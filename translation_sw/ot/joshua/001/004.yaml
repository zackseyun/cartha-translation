  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מֵ/הַ/מִּדְבָּר֩ וְ/הַ/לְּבָנ֨וֹן הַ/זֶּ֜ה וְֽ/עַד הַ/נָּהָ֧ר הַ/גָּד֣וֹל נְהַר פְּרָ֗ת כֹּ֚ל אֶ֣רֶץ הַֽ/חִתִּ֔ים וְ/עַד הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֣וֹא הַ/שָּׁ֑מֶשׁ יִֽהְיֶ֖ה גְּבוּלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: sw
  text: Mpaka wenu utakuwa kuanzia nyika na Lebanoni hii hadi mto mkubwa, Mto Eufrate—nchi yote ya Wahiti—na hadi Bahari Kuu[a], kuelekea machweo ya jua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Bahari ya Mediterania.
    reason: cross_reference
  - marker: b
    text: Au, “kuelekea magharibi”; kihalisi, “kuelekea mahali jua linapoingia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: Kuanzia nyikani
  rationale: מִדְבָּר hutaja eneo kame lisilolimwa au nyika. “Nyika” ni neno la kawaida la kijiografia linaloacha rejeo mahususi bila kulibana kuwa jangwa la mchanga.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: na Lebanoni hii
  rationale: Jina la mahali “Lebanoni” limehifadhiwa, na kiashiria הַזֶּה (“hii”) kimetafsiriwa wazi kama kilivyo katika Kiebrania.
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: hadi mto mkubwa, Mto Eufrate
  rationale: 'Muundo wa ufafanuzi umehifadhiwa: kwanza “mto mkubwa,” kisha jina linaloutambulisha, “Mto Eufrate.” “Hadi” linaonyesha mpaka wa eneo.'
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: nchi yote ya Wahiti
  rationale: Tafsiri hii inawakilisha כֹּל (“yote”) pamoja na kirai cha umilikaji “nchi ya Wahiti” bila kupunguza maana yake ya kikabila na kijiografia.
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: na hadi Bahari Kuu[a]
  rationale: Jina la Kiebrania “Bahari Kuu” limehifadhiwa katika matini; utambulisho wake kuwa Bahari ya Mediterania umewekwa katika tanbihi.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: kuelekea machweo ya jua[b]
  rationale: Kirai hiki kinahifadhi taswira ya Kiebrania ya jua kutua, huku maana yake ya mwelekeo wa magharibi ikielezwa katika tanbihi.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: utakuwa mpaka wenu
  rationale: גְּבוּל katika muktadha huu ni mpaka wa eneo. Wakati ujao unafaa kwa kauli hii ya ahadi, na umoja wa nomino “mpaka” umehifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Muundo wa mipaka na majina ya kijiografia umefuata Kiebrania kwa ukaribu, huku alama za vistari zikisaidia kutenganisha kirai “nchi yote ya Wahiti.” Alama ya tanbihi kuhusu Bahari ya Mediterania imewekwa baada ya “Bahari Kuu,” mahali panapolingana na maelezo yake.
