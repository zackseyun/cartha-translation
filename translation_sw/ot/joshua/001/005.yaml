revisions:
- from: Hakuna mtu atakayeweza kusimama mbele yako siku zote za maisha yako.[a] Kama nilivyokuwa pamoja na Musa, ndivyo nitakavyokuwa pamoja nawe. Sitakuacha bila msaada,[b] wala sitakuacha kabisa.
  to: Hakuna mtu atakayeweza kusimama mbele yako siku zote za maisha yako.[a] Kama nilivyokuwa pamoja na Musa, ndivyo nitakavyokuwa pamoja nawe. Sitakuacha bila msaada,[b] wala sitakutelekeza.
  rationale: 'The revision changes only the final clause to render עזב as ''sitakutelekeza'' (I will not forsake/abandon you). This preserves the source''s twofold assurance: God will not withdraw needed support, nor will he abandon Joshua. Existing footnote anchors and notes remain correctly placed and relevant.'
  reviewer_model: gpt-5.6-terra
