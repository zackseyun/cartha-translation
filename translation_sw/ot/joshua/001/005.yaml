review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversarial sense of לֹא יִתְיַצֵּב אִישׁ לְפָנֶיךָ, the lifelong scope, the comparison with Moses, and the promised divine presence. Its final two clauses, however, render two distinct Hebrew verbs with repeated 'sitakuacha'; the second should explicitly convey abandonment/forsaking (עזב).
  naturalness: The Swahili is clear and suitably formal. Replacing the second repeated 'sitakuacha' with 'sitakutelekeza' makes the parallel more idiomatic and rhetorically effective while retaining the distinction in the Hebrew.
  terminology: Musa, pamoja nawe, and mtu are appropriate Standard East African Swahili choices. 'Sitakuacha bila msaada' appropriately communicates the supportive nuance of אַרְפְּךָ; 'sitakutelekeza' clearly renders אֶעֶזְבֶךָּ without importing doctrinal interpretation.
  issues:
  - severity: medium
    issue: The second member of the final Hebrew pair is rendered as 'wala sitakuacha kabisa.'
    rationale: עזב specifically adds the sense of leaving or forsaking. Since 'Sitakuacha bila msaada' has already rendered the first verb, repeating 'kuacha' and adding 'kabisa' weakens the lexical distinction and the solemn force of the paired promise.
  revised_text: Hakuna mtu atakayeweza kusimama mbele yako siku zote za maisha yako.[a] Kama nilivyokuwa pamoja na Musa, ndivyo nitakavyokuwa pamoja nawe. Sitakuacha bila msaada,[b] wala sitakutelekeza.
  revised_footnotes:
  - marker: a
    text: Au, “Hakuna mtu atakayeweza kukupinga.” Msemo wa Kiebrania wa “kusimama mbele yako” unaweza kumaanisha kufanikiwa kumpinga mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Sitakuachilia.” Kitenzi cha Kiebrania kinaweza kutoa wazo la kutomwachilia mtu, kutolegeza mshiko, au kutoshindwa kumsaidia.
    reason: lexical_alternative
  revision_rationale: 'The revision changes only the final clause to render עזב as ''sitakutelekeza'' (I will not forsake/abandon you). This preserves the source''s twofold assurance: God will not withdraw needed support, nor will he abandon Joshua. Existing footnote anchors and notes remain correctly placed and relevant.'
