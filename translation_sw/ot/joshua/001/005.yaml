  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: sw
  text: Hakuna mtu atakayeweza kusimama mbele yako siku zote za maisha yako.[a] Kama nilivyokuwa pamoja na Musa, ndivyo nitakavyokuwa pamoja nawe. Sitakuacha bila msaada,[b] wala sitakutelekeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakuna mtu atakayeweza kukupinga.” Msemo wa Kiebrania wa “kusimama mbele yako” unaweza kumaanisha kufanikiwa kumpinga mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Sitakuachilia.” Kitenzi cha Kiebrania kinaweza kutoa wazo la kutomwachilia mtu, kutolegeza mshiko, au kutoshindwa kumsaidia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ לְפָנֶיךָ
  choice: Hakuna mtu atakayeweza kusimama mbele yako
  rationale: Kauli hii huhifadhi taswira ya Kiebrania ya kusimama mbele ya mtu, huku “atakayeweza” ikionyesha maana ya muktadha kwamba hakuna mpinzani atakayefanikiwa kumpinga Yoshua.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: siku zote za maisha yako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya msemo wa Kiebrania unaomaanisha kipindi chote cha maisha ya mtu.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה אֶהְיֶה עִמָּךְ
  choice: Kama nilivyokuwa pamoja na Musa, ndivyo nitakavyokuwa pamoja nawe
  rationale: Muundo wa “kama... ndivyo...” unaonyesha wazi ulinganisho wa uwepo wa Mungu pamoja na Musa na ahadi yake kwa Yoshua.
- source_word: לֹא אַרְפְּךָ
  choice: Sitakuacha bila msaada
  rationale: Kitenzi רפה katika hifili kina wazo la kulegeza mshiko, kumwacha mtu aanguke, au kushindwa kumsaidia. Tafsiri hii ni ya asili katika Kiswahili na huitofautisha na kitenzi kinachofuata.
- source_word: וְלֹא אֶעֶזְבֶךָּ
  choice: wala sitakuacha kabisa
  rationale: Kitenzi עזב humaanisha kuacha au kutelekeza. Neno “kabisa” linaonyesha kuachwa kwa maana ya kutelekezwa, bila kuingiza istilahi ya kimadhehebu.
theological_decisions:
- issue: Nguvu ya jumla ya אִישׁ yenye umbo la kiume la umoja
  choice: Hakuna mtu
  alternative: Hakuna yeyote; hakuna adui
  rationale: Katika Kiswahili, “mtu” ni neno la kawaida linaloweza kumaanisha mwanadamu yeyote, na hivyo huhifadhi maana ya jumla ya אִישׁ bila kudokeza kwamba ahadi inawahusu wapinzani wanaume pekee. “Adui” haikuwekwa katika matini kwa kuwa ni ufafanuzi wa kimuktadha, si neno lililotajwa wazi.
- issue: Tofauti kati ya לֹא אַרְפְּךָ na לֹא אֶעֶזְבֶךָּ
  choice: Sitakuacha bila msaada, wala sitakuacha kabisa
  alternative: Sitakuachilia wala sitakutelekeza
  rationale: 'Tafsiri iliyochaguliwa huhifadhi ahadi mbili zinazohusiana lakini kutofautiana: Mungu hatalegeza msaada wake wala hatamtelekeza Yoshua. Kielezi cha chini kinahifadhi taswira halisi zaidi ya kitenzi cha kwanza.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Pamoja nawe” hudumisha uzito wa ahadi ya uwepo wa Mungu, na “wala” huhifadhi msisitizo wa ukanushaji maradufu.
