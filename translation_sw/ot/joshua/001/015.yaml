source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: sw
  text: mpaka Yahwe atakapowapa ndugu zenu pumziko[a], kama alivyowapa ninyi, na wao pia watakapoimiliki nchi ambayo Yahwe Mungu wenu anawapa. Ndipo mtakaporudi katika nchi ya milki yenu na mtaimiliki, ambayo Musa, mtumishi wa Yahwe, aliwapa ng'ambo ya Yordani[b], upande wa mawio ya jua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ndugu zenu Waisraeli; hapa neno “ndugu” linarejelea watu wa makabila mengine ya Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au “mashariki”; kihalisi, “upande wa mawio ya jua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: atakapowapa ... pumziko
  rationale: Hifili ya נוח hapa ina maana ya kuwapa hali ya utulivu na makazi baada ya mapigano; “kuwapa pumziko” huhifadhi taswira ya Kiebrania na inafaa katika muktadha.
- source_word: לַאֲחֵיכֶם
  choice: ndugu zenu
  rationale: Nomino ya Kiebrania ni ya kiume wingi, lakini katika muktadha inarejelea watu wa makabila mengine ya Israeli; Kiswahili “ndugu” huhifadhi lugha ya undugu bila kulazimisha jinsia.
- source_word: כָּכֶם
  choice: kama alivyowapa ninyi
  rationale: Kiebrania kinasema kwa ufupi “kama ninyi”; kitenzi kinachodokezwa kutokana na muktadha kimeongezwa ili Kiswahili kiwe wazi na cha kawaida.
- source_word: וְיָרְשׁוּ
  choice: waimiliki
  rationale: ירשׁ katika muktadha wa ushindi na ugawaji wa nchi humaanisha kuichukua na kuwa nayo kama milki; “waimiliki” ni fupi na ya asili katika Kiswahili.
- source_word: נֹתֵן
  choice: anawapa
  rationale: Kauli ya wakati unaoendelea ya Kiebrania inaonyesha tendo la Mungu linaloendelea au lililo karibu kutimizwa; wakati wa sasa wa Kiswahili unahifadhi maana hiyo.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: nchi ya milki yenu
  rationale: Kirai hiki kinaonyesha nchi waliyopewa iwe urithi na milki yao; “milki” huhifadhi uhusiano na kitenzi cha kuimiliki.
- source_word: וִירִשְׁתֶּם אוֹתָהּ
  choice: na kuimiliki
  rationale: Tafsiri hii inadumisha uhusiano wa kileksia na ירשׁ iliyotangulia na kueleza wazi kuingia katika eneo walilopewa.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahwe
  rationale: Hapa עבד ni cheo cha heshima kinachoeleza huduma rasmi ya Musa kwa Yahwe, si lazima hali ya utumwa.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Hiki ni kirai cha kijiografia kinachoweza kumaanisha upande mwingine wa Yordani kulingana na mahali pa msemaji; “ng’ambo” huhifadhi mtazamo huo.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: upande wa mawio ya jua
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kiebrania huku ikiwa ya kueleweka; maana ya kawaida ni upande wa mashariki.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la agano YHWH; “Yahwe” hulitaja moja kwa moja badala ya kulibadili kuwa cheo.
- issue: Upeo wa neno אֲחֵיכֶם
  choice: ndugu zenu
  alternative: Waisraeli wenzenu
  rationale: “Ndugu zenu” hufuata taswira ya undugu katika Kiebrania, huku tanbihi ikifafanua kwamba hapa linarejelea makabila mengine ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unafuata hatua za simulizi la Kiebrania bila kuwa mgumu, na taswira ya “mawio ya jua” imehifadhiwa.
