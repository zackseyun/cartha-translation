  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: sw
  text: Kitabu hiki cha sheria kisiondoke kinywani mwako; bali uitafakari[a] mchana na usiku, ili uwe mwangalifu kutenda kulingana na yote yaliyoandikwa ndani yake. Kwa maana ndipo utakapoifanikisha njia yako, na ndipo utakapotenda kwa hekima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uinong’one” au “uikariri kwa sauti ya chini”; kitenzi cha Kiebrania kinaweza kujumuisha kurudia maneno kwa sauti tulivu pamoja na kuyatafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּשׁ
  choice: kisiondoke
  rationale: Kitenzi kina maana ya kuondoka au kusogea mbali. Pamoja na “kinywani mwako,” tafsiri hii inadumisha picha ya maneno ya sheria kuendelea kuwa tayari kutamkwa.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: Kitabu hiki cha sheria
  rationale: סֵפֶר inaweza kuwa kitabu, gombo, au hati; “kitabu” ni wazi katika Kiswahili cha sasa. Katika muktadha huu תּוֹרָה ni sheria iliyoandikwa ya agano, ingawa neno hilo pia linaweza kumaanisha mafundisho.
- source_word: מִפִּיךָ
  choice: kinywani mwako
  rationale: Tafsiri hii inadumisha picha halisi ya Kiebrania na kidokezo cha kusema au kukariri sheria.
- source_word: וְהָגִיתָ
  choice: ukitafakari
  rationale: הגה inaweza kueleza kunong’ona, kukariri kwa sauti ya chini, au kutafakari. “Kutafakari” ni ya kawaida na wazi, huku kidokezo cha kutamka kikihifadhiwa katika kishazi cha kwanza na tanbihi.
- source_word: יוֹמָם וָלַיְלָה
  choice: mchana na usiku
  rationale: Jozi hii inadumisha usemi wa asili unaoonyesha tendo la kudumu.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: ili uwe mwangalifu kutenda
  rationale: Muundo huu unaonyesha kusudi na uangalifu katika kutii, si kujua tu.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: kulingana na yote yaliyoandikwa ndani yake
  rationale: Hii inadumisha nguvu ya ujumla ya כְּכָל na mamlaka ya yaliyoandikwa.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: utakapoifanikisha njia yako
  rationale: 'Kauli ya Kiebrania ina nguvu ya kisababishi: Yoshua ataifanya njia yake ifanikiwe kwa kufuata sheria, badala ya kusema tu kwamba njia itafanikiwa.'
- source_word: תַּשְׂכִּיל
  choice: utakapotenda kwa hekima
  rationale: Hifili ya שכל inaweza kumaanisha kutenda kwa ufahamu au busara, wakati mwingine kukiwa na matokeo ya mafanikio. Tafsiri hii inaitofautisha na צלח iliyotangulia.
theological_decisions:
- issue: Maana ya תּוֹרָה katika muktadha wa agano
  choice: sheria
  alternative: mafundisho; Torati
  rationale: Ingawa תּוֹרָה linaweza kumaanisha mafundisho kwa upana, hapa linarejelea maandishi ya agano ambayo Yoshua anapaswa kuyatii. “Sheria” ni wazi na inafaa katika muktadha huu.
- issue: Kutafakari kama kukariri kwa sauti au kuwaza kwa ndani
  choice: ukitafakari
  alternative: ukinong’ona; ukiikariri kwa sauti ya chini
  rationale: 'Mstari unaunganisha kusema na kutafakari: kitabu hakiondoki kinywani, na Yoshua anapaswa kufanya הגה ndani yake. Matini kuu inatumia “kutafakari” kwa ufasaha, huku maana ya kutamka kwa sauti ya chini ikihifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa Kiebrania na tofauti kati ya kufanikisha njia na kutenda kwa hekima zimehifadhiwa.
