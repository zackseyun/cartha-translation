  variant: Standard East African Swahili
source:
  edition: WLC
  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: sw
  text: Ila uwe hodari na jasiri sana, ukiwa mwangalifu kutenda kulingana na sheria yote ambayo Musa, mtumishi wangu, alikuamuru. Usiache kuifuata kwa kugeukia kulia wala kushoto, ili utende kwa hekima[a] popote uendapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili ufanikiwe” au “ili upate mafanikio” katika yote ufanyayo, popote uendapo.
    reason: Neno תַּשְׂכִּיל linaweza kueleza kutenda kwa busara au kufanikiwa kama matokeo ya tendo la busara.
lexical_decisions:
- source_word: רַק
  choice: Ila
  rationale: Katika muktadha huu neno hilo linaweka mkazo wa kizuizi juu ya agizo muhimu linalofuata; “Ila” ni la asili na lenye hadhi katika Kiswahili.
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: uwe hodari na jasiri sana
  rationale: “Hodari” linaonyesha nguvu na uthabiti, “jasiri” linaonyesha moyo wa kukabili hatari, na “sana” linahifadhi mkazo wa מְאֹד.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: ukiwa mwangalifu kutenda
  rationale: Muundo huu unahifadhi wazo la kuzingatia kwa makini pamoja na kulitekeleza kwa vitendo.
- source_word: כְּכָל הַתּוֹרָה
  choice: kulingana na sheria yote
  rationale: Katika muktadha wa maagizo ya Musa, תּוֹרָה lina maana hasa ya sheria ya agano; “yote” linahifadhi ukamilifu wake.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: ambayo Musa mtumishi wangu alikuamuru
  rationale: Tafsiri hii inahifadhi kishazi cha uhusiano na cheo cha Musa alichopewa na Mungu, “mtumishi wangu.”
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: Usigeuke kutoka katika hiyo kwenda kulia wala kushoto
  rationale: Inahifadhi sitiari ya njia na maana ya kutokengeuka kutoka kwenye sheria iliyowekwa.
- source_word: לְמַעַן
  choice: ili
  rationale: Neno hili linaonyesha kusudi au matokeo kwa Kiswahili cha kawaida na fasaha.
- source_word: תַּשְׂכִּיל
  choice: utende kwa hekima
  rationale: Hifili ya שׂכל inaangazia kutenda kwa ufahamu au busara, huku ikiweza pia kudokeza kufanikiwa; maana ya mafanikio imehifadhiwa katika tanbihi.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: popote uendapo
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayohifadhi kitenzi cha kwenda na wigo mpana wa kauli hiyo.
theological_decisions:
- issue: Maana ya תּוֹרָה katika muktadha wa agano
  choice: sheria
  alternative: mafundisho
  rationale: Rejeo la moja kwa moja kwa yale Musa aliyoamuru linafanya maana ya kisheria na ya kiagano kuwa ya msingi hapa, ingawa neno la Kiebrania linaweza kuwa pana zaidi.
- issue: Maana ya תַּשְׂכִּיל
  choice: utende kwa hekima
  alternative: ufanikiwe; upate mafanikio
  rationale: Maana ya msingi ya kutenda kwa busara imewekwa katika matini ili kutodai moja kwa moja ahadi ya mafanikio ya kimwili. Dokezo halisi la kufanikiwa limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Sitiari ya kutogeuka kulia wala kushoto imehifadhiwa, na tanbihi imewekwa baada ya “utende kwa hekima,” ambako tofauti ya kimsamiati inahusika.
