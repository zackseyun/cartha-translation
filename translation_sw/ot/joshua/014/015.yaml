base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: sw
  text: Jina la Hebroni zamani lilikuwa Kiriath-arba[a]. Arba alikuwa mtu mkuu zaidi kati ya Waanaki[b]. Nchi ikatulia kutokana na vita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda Kiriath-arba maana yake ni “mji wa Arba.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mtu mkuu kati ya Waanaki”; Kiebrania kinaweza kumtaja Arba kuwa mtu mashuhuri zaidi aliyehusishwa na Waanaki.
    reason: alternative_reading
  - marker: c
    text: Au, “nchi ikawa tulivu kutokana na vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁם חֶבְרוֹן לְ/פָנִים
  choice: Jina la Hebroni hapo zamani
  rationale: Huwasilisha maana ya jina la mahali na לְפָנִים, ‘hapo zamani/zamani,’ kwa Kiswahili cha kawaida bila kuongeza neno la wazi la wakati ambalo halipo katika Kiebrania.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriath-arba
  rationale: Jina maalumu limeandikwa kwa unukuzi; maana yake inayowezekana imeelezwa katika tanbihi.
- source_word: הָ/אָדָם הַ/גָּד֛וֹל בָּ/עֲנָקִים הוּא
  choice: Arba alikuwa mtu mkuu kati ya Waanaki
  rationale: Kiebrania kihalisi kina ‘yeye ndiye mtu mkuu kati ya Waanaki.’ Kutaja Arba huondoa utata wa kiwakilishi, huku ‘mtu mkuu’ ikihifadhi uwezekano wa kueleweka kuwa mashuhuri au mkuu zaidi badala ya kulazimisha daraja la juu kabisa.
- source_word: עֲנָקִים
  choice: Waanaki
  rationale: Hili ni umbo la kawaida la Kiswahili kwa jina la kundi la watu linalohusishwa na Anaki.
- source_word: וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה
  choice: Nayo nchi ikapumzika kutokana na vita
  rationale: שׁקט hueleza kuwa tulivu au kupata pumziko; katika muktadha wa mapigano, ‘ikapumzika kutokana na vita’ ni ya asili na huhifadhi wazo la kusitishwa kwa vita.
theological_decisions:
- issue: Kiwango cha ukuu wa Arba
  choice: mtu mkuu kati ya Waanaki
  alternative: mtu mkuu zaidi kati ya Waanaki
  rationale: הַגָּדוֹל inaweza kumtaja Arba kuwa mtu mashuhuri/mkuu wa kundi hilo, lakini si lazima kwa umbo lisilo na utata kumaanisha kiwango cha juu kabisa. Tafsiri kuu imehifadhi mvutano huo, na mbadala umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Hebroni’ na ‘Waanaki’ yametumiwa kama maumbo ya majina yaliyozoeleka katika Kiswahili cha Biblia; ‘Kiriath-arba’ limehifadhiwa kama jina maalumu. Viashiria vya tanbihi vimewekwa mara moja kila kimoja na kwa mpangilio.
