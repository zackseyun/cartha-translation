id: JOS.14.5
reference: Joshua 14:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: sw
  text: Kama vile Yahweh alivyomwamuru Musa, ndivyo wana wa Israeli[a] walivyofanya, nao wakaigawanya nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema “wana wa Israeli,” usemi wa kawaida unaowarejelea watu wa Israeli kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kama vile
  rationale: Huonyesha ulinganifu wa moja kwa moja kati ya amri ya Yahweh na tendo la Israeli kwa Kiswahili cha kawaida.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: Kitenzi hiki humaanisha kutoa amri; muundo huu unaungana kiasili na “kama vile” na unaonyesha kwamba Musa ndiye aliyeamriwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: Musa ndiye mtendewa wa kitenzi “aliamuru”; Kiswahili huonyesha hilo kwa kiambishi cha yambwa katika “alivyomwamuru.”
- source_word: כֵּן
  choice: ndivyo
  rationale: Huhifadhi ulinganifu kati ya kilichoamriwa na walichofanya Waisraeli.
- source_word: עָשׂוּ
  choice: walivyofanya
  rationale: Huhifadhi maana pana na sahili ya kitenzi cha Kiebrania bila kuongeza yambwa ambayo haikutajwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania unaowataja watu wa Israeli kwa pamoja, huku tanbihi ikitoa tafsiri ya kawaida zaidi.
- source_word: וַיַּחְלְקוּ
  choice: nao wakaigawanya
  rationale: Kitenzi kina maana ya kugawanya au kupangia sehemu; “wakaigawanya” ni wazi na hudumisha mwendelezo wa simulizi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa Yoshua, neno hili linamaanisha nchi iliyokuwa ikigawanywa, si dunia kwa ujumla.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa usemi בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili huhifadhi umbo la usemi wa Kiebrania, ambao hapa unafanya kazi kama jina la pamoja la watu wa Israeli; tanbihi inaeleza maana hiyo ili kuepuka kueleweka kuwa wanaume pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “kama vile ... ndivyo ...” unatoa ulinganifu wa Kiebrania kwa njia ya asili; “nao wakaigawanya” hudumisha mtiririko wa simulizi.
