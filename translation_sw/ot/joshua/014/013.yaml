  text: Kisha Yoshua akambariki[a], akampa Kalebu mwana wa Yefune Hebroni kuwa urithi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akambariki Kalebu”; Kiebrania husema “akambariki yeye,” naye Kalebu ndiye anayerejelewa wazi katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: akambariki
  rationale: Kitenzi ברך pamoja na kiambishi cha nafsi ya tatu umoja wa kiume humaanisha ‘akambariki.’ Kiswahili huhifadhi rejeleo la kiwakilishi kwa njia ya kawaida; muktadha unaonyesha wazi kwamba anayebarikiwa ni Kalebu.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: נתן ni kitenzi cha kawaida chenye maana ya ‘kutoa/kumpa’; ‘akampa’ huonyesha kwa ufupi kwamba Kalebu ndiye mpokeaji.
- source_word: אֶת חֶבְרוֹן
  choice: mji wa Hebroni
  rationale: חֶבְרוֹן ni jina la mahali. Neno ‘mji’ limewekwa wazi kwa Kiswahili cha kawaida ili kuonyesha kwamba hapa kinachotolewa ni eneo la Hebroni, bila kubadili kiini cha maana.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: Kalebu mwana wa Yefune
  rationale: לְ humtambulisha mpokeaji, naye בֶּן יְפֻנֶּה ni usemi wa ukoo ‘mwana wa Yefune.’ Majina yametoholewa kwa matumizi ya kawaida ya Kiswahili.
- source_word: לְנַחֲלָה
  choice: uwe urithi wake
  rationale: נַחֲלָה humaanisha urithi, hasa ardhi iliyogawiwa. Muundo huu ni wa asili katika Kiswahili na unaweka wazi uhusiano wa urithi na Kalebu unaoonyeshwa na muktadha.
