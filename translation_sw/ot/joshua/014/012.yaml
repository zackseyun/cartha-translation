source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: sw
  text: Basi, nipe nchi hii ya milima ambayo Yahwe aliizungumzia siku ile[a], kwa maana wewe mwenyewe ulisikia siku ile kwamba Waanaki wako huko, pamoja na miji mikubwa yenye ngome. Huenda Yahwe atakuwa pamoja nami[b], nami nitawafukuza, kama Yahwe alivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlima huu.” Neno la Kiebrania הָהָר linaweza kumaanisha mlima mmoja au eneo la milima; hapa maana ya eneo pana inaelekea kufaa zaidi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Huenda Yahwe pamoja nami,” kishazi kisicho na kitenzi. Katika muktadha, kinaeleweka kuwa tumaini kwamba Yahwe atakuwa pamoja na Kalebu na kumsaidia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mazungumzo kinachoingiza ombi la Kalebu la wakati huu; “Basi sasa” huhifadhi uhusiano na yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: תְּנָה לִּי
  choice: nipe
  rationale: Amri ya moja kwa moja ya נתן pamoja na yambwa ya mtendewa; “nipe” ni ya kawaida na huhifadhi ukakamavu wa ombi.
- source_word: אֶת־הָהָר הַזֶּה
  choice: nchi hii ya milima
  rationale: הַר yaweza kumaanisha mlima mmoja au eneo la milima. Katika muktadha wa kugawiwa nchi, eneo pana ndilo linalokusudiwa zaidi.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: ambayo Yahwe aliizungumzia
  rationale: דבר ni “sema/zungumza,” si lazima “ahidi”; tafsiri hii huhifadhi maana ya kimsamiati bila kufanya kauli iwe ahadi wazi zaidi kuliko Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: kwa maana wewe mwenyewe ulisikia
  rationale: כִּי inatoa sababu, na kiwakilishi huru אַתָּה kina mkazo unaowakilishwa na “wewe mwenyewe.”
- source_word: כִּי עֲנָקִים שָׁם
  choice: kwamba Waanaki wako huko
  rationale: Jina la kundi la watu limehifadhiwa kwa umbo la Kiswahili; usemi unarejelea hali inayomkabili Kalebu wakati huo.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: pamoja na miji mikubwa yenye ngome
  rationale: Huhifadhi ukubwa na ulinzi wa miji kwa mpangilio wa asili wa Kiswahili.
- source_word: אוּלַי
  choice: Huenda
  rationale: Huhifadhi uwezekano na unyenyekevu wa kauli bila kuugeuza kuwa uhakika.
- source_word: יְהוָה אוֹתִי
  choice: Yahwe atakuwa pamoja nami
  rationale: Kishazi kisicho na kitenzi kinaeleweka kimuktadha kuwa uwepo na msaada wa Yahwe katika hatua inayokuja, bila kutaja “msaada” moja kwa moja.
- source_word: וְהוֹרַשְׁתִּים
  choice: nami nitawafukuza
  rationale: Hiphil ya ירשׁ hapa ina maana ya kuwaondoa wakaaji katika nchi; “kuwafukuza” ni wazi na ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la Mungu moja kwa moja; kulitaja kama “Yahwe” huhifadhi hali yake ya kuwa jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya אוּלַי יְהוָה אוֹתִי
  choice: Huenda Yahwe atakuwa pamoja nami
  alternative: Labda Yahwe atanisaidia
  rationale: Chaguo hili huhifadhi mvutano kati ya tumaini la Kalebu na kutodai matokeo kwa kiburi, na pia huhifadhi taswira ya uwepo wa Mungu badala ya kuifafanua tu kama msaada.
- issue: Uhusiano wa וְהוֹרַשְׁתִּים na kauli iliyotangulia
  choice: nami nitawafukuza
  alternative: ili niwafukuze
  rationale: Kiunganishi cha Kiebrania kinaendeleza matokeo yanayotarajiwa; “nami” huhifadhi uratibu bila kufanya uhusiano wa kusudi kuwa wazi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nchi ya milima” ni ya kueleweka kuliko tafsiri finyu ya “mlima,” “Waanaki” hufuata kawaida ya Kiswahili ya majina ya makundi ya watu, na “Huenda” huhifadhi tahadhari ya אוּלַי.
