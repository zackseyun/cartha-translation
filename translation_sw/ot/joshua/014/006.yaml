  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: sw
  text: Ndipo wana wa Yuda wakamsogelea Yoshua huko Gilgali, na Kalebu mwana wa Yefune, Mkenizi, akamwambia, “Wewe unajua neno[a] ambalo Yahwe alimnena Musa mtu wa Mungu kunihusu na kukuhusu huko Kadesh-barnea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo” au “suala” ambalo Yahwe alimnena Musa.
    reason: Neno la Kiebrania דָּבָר linaweza kumaanisha ‘neno,’ ‘jambo,’ au ‘suala’; hapa ‘neno’ linafaa kwa sababu linarejelea tamko la Mungu, lakini maana nyingine zinazowezekana zinahifadhiwa.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: wakamsogelea
  rationale: Kitenzi hiki kinaonyesha kusogea karibu ili kumfikia mtu; ‘wakamsogelea’ ni cha kawaida katika simulizi na kinahifadhi mwendo wa tukio.
- source_word: בְנֵי יְהוּדָה
  choice: wana wa Yuda
  rationale: Muundo huu unahifadhi taswira ya kifamilia na kikabila ya Kiebrania, huku ukitambulika katika Kiswahili cha Biblia kuwa watu wa kabila la Yuda.
- source_word: בַּגִּלְגָּל
  choice: huko Gilgali
  rationale: ‘Huko’ linaonyesha mahali pa tukio kwa njia ya asili katika simulizi; jina limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Kalebu mwana wa Yefune, Mkenizi
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika Kiswahili, na jina la ukoo au jamii ‘Mkenizi’ limehifadhiwa.
- source_word: אַתָּה יָדַעְתָּ
  choice: Wewe unajua
  rationale: Kauli timilifu ya Kiebrania hapa inaeleza hali ya sasa ya kujua; kiwakilishi ‘Wewe’ kinahifadhi msisitizo uliopo katika chanzo.
- source_word: הַדָּבָר
  choice: neno
  rationale: Katika muktadha huu דָּבָר hurejelea tamko maalumu la Mungu. ‘Neno’ linadumisha mkazo huo, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: Yahwe alimwambia Musa
  rationale: Muundo huu ni Kiswahili cha kawaida kwa tendo la Mungu kusema na Musa na unawakilisha kwa usahihi דִּבֶּר ... אֶל.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: Musa, mtu wa Mungu
  rationale: Hili linahifadhi cheo rasmi cha kibiblia bila kukifafanua zaidi.
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: kunihusu mimi na kukuhusu wewe
  rationale: Kurudiwa kwa muundo pamoja na ‘mimi’ na ‘wewe’ kunahifadhi ulinganifu na msisitizo wa Kiebrania.
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: huko Kadesh-barnea
  rationale: Kihusishi cha mahali kimetolewa kwa Kiswahili cha asili, na jina la mahali limehifadhiwa kwa kutoholewa.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina maalumu la agano יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הַדָּבָר
  choice: neno
  alternative: jambo
  rationale: Kwa kuwa kifungu kinaeleza jambo ambalo Yahwe alitamka, ‘neno’ linaonyesha tamko la Mungu; hata hivyo, neno la Kiebrania linaweza pia kumaanisha ‘jambo,’ ambalo limeonyeshwa katika tanbihi.
- issue: Utambulisho wa kikabila בְנֵי יְהוּדָה
  choice: wana wa Yuda
  alternative: watu wa Yuda
  rationale: ‘Wana wa Yuda’ linahifadhi muundo wa kifamilia wa chanzo na matumizi yake kama jina la kikabila bila kuugeuza kimyakimya kuwa usemi usio na jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima, na unaosomeka kwa urahisi. Majina ya kibiblia yametolewa kwa maumbo yanayotambulika katika Kiswahili; jina la Mungu limeandikwa ‘Yahwe.’
