reference: Joshua 14:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: sw
  text: Hizi ndizo sehemu za urithi ambazo wana wa Israeli[a] walipokea katika nchi ya Kanaani, ambazo Eleazari kuhani, Yoshua mwana wa Nuni, na wakuu wa koo za mababu[c] za makabila ya wana wa Israeli walizowagawia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania hutumia kihalisi usemi wa kifamilia “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walizowapa kuwa urithi.” Kiebrania hurudia mzizi unaohusu urithi katika vifungu vyote viwili.
    reason: lexical_alternative
  - marker: c
    text: “Koo za mababu” ni vikundi vya kifamilia vya ukoo vilivyokuwa ndani ya makabila.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hizi ndizo
  rationale: Kiunganishi pamoja na kiwakilishi cha kuonyesha huanzisha sehemu mpya huku kikiendeleza simulizi. “Hizi ndizo” ni ya kawaida na yenye hadhi katika Kiswahili, bila kuongeza neno la wakati lisilokuwapo katika Kiebrania.
- source_word: נָחֲלוּ
  choice: walipokea
  rationale: Hapa kitenzi kinaeleza Israeli kupokea sehemu walizopangiwa kuwa urithi. “Walipokea” huepuka kudokeza kwamba urithi huo ulitokana tu na kifo cha mwenye mali.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania na maana yake ya utambulisho wa agano; “Waisraeli” limetolewa kama chaguo la kawaida zaidi katika tanbihi.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: katika nchi ya Kanaani
  rationale: Kiebrania kinataja wazi “nchi,” neno muhimu katika muktadha wa urithi wa eneo.
- source_word: אֲשֶׁר נִחֲלוּ אֹתָם
  choice: ambazo ... walizowagawia
  rationale: Muundo huu unaeleza kitendo rasmi cha viongozi kuwapa Waisraeli sehemu zao. “Walizowagawia” ni Kiswahili cha asili kinachoonyesha vitu vilivyogawiwa na wapokeaji.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Eleazari kuhani
  rationale: Hili ni umbo la kawaida la jina na cheo katika Kiswahili; cheo kilichowekwa baada ya jina huwasilisha uhusiano wa Kiebrania kwa uwazi.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yamewasilishwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, huku uhusiano wa kifamilia ukihifadhiwa wazi.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: wakuu wa jamaa za mababu za makabila
  rationale: “Wakuu” huakisi רָאשֵׁי, na “jamaa za mababu” huhifadhi muundo wa ukoo wa jamii ya kale bila kuufupisha kuwa viongozi wa makabila tu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: za wana wa Israeli
  rationale: 'Kirai hiki kinaeleweka vizuri zaidi kuwa kinafafanua makabila: makabila ya wana wa Israeli. Muundo huo huhifadhi uhusiano wa kisarufi wa Kiebrania.'
- source_word: נָחֲלוּ / נִחֲלוּ
  choice: sehemu za urithi / walipokea ... walizowagawia
  rationale: Mzizi mmoja wa Kiebrania umetumiwa katika vifungu vyote viwili. Kiswahili hakiwezi kuurudia kwa ufasaha sawa hapa, kwa hiyo dhana ya urithi imewekwa wazi na tendo la pili limetafsiriwa kwa usahihi wa kimuktadha.
theological_decisions:
- issue: Jina la agano lenye jinsia katika בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Kiebrania hutumia wazi usemi wa kifamilia wa wingi wa kiume unaofanya kazi pia kama jina la taifa la agano. Tafsiri kuu huhifadhi umbo hilo, huku chaguo la kawaida zaidi likiwekwa katika tanbihi.
- issue: Istilahi ya ukoo katika אֲבוֹת
  choice: jamaa za mababu
  alternative: jamaa za ukoo
  rationale: Usemi wa Kiebrania unaonyesha muundo wa kijamii wa kifamilia na wa mababu. “Jamaa za mababu” huhifadhi mazingira hayo ya kale bila kuingiza muundo wa dhehebu au ufafanuzi usio katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa utangulizi wa orodha na msisitizo wa nchi kama urithi, lakini imetumia “walizowagawia” ili uhusiano wa watoaji, wapokeaji, na sehemu zilizogawiwa uwe wazi kwa msomaji wa kawaida.
