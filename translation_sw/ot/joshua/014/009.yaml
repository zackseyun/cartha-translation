id: JOS.14.9
reference: Joshua 14:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: sw
  text: Musa akaapa siku hiyo[a], akisema, “Hakika nchi ambayo mguu wako umeikanyaga itakuwa urithi wako na wa wanao milele[b], kwa sababu umemfuata Yahweh, Mungu wangu, kwa moyo wote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina nahau ya kiapo, kihalisi “ikiwa sivyo,” inayotumiwa hapa kusisitiza uhakika; ndiyo maana imetafsiriwa “Hakika.”
    reason: lexical_alternative
  - marker: b
    text: Au “na wa wazao wako.” Kiebrania kinasema “wanao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: akaapa
  rationale: Kitenzi hiki katika Niphal humaanisha kuapa; ‘akaapa’ ni cha kawaida, kifupi, na kinahifadhi uzito wa kiapo.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa moja kwa moja wa wakati na unasikika kwa kawaida katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno ya moja kwa moja kwa njia ya kawaida katika Kiswahili.
- source_word: אִם לֹא
  choice: Hakika
  rationale: Katika muktadha wa kiapo, huu ni mtindo wa Kiebrania wa kusisitiza, si sharti halisi; ‘Hakika’ huwasilisha nguvu hiyo.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: nchi ambayo mguu wako umeikanyaga
  rationale: Inahifadhi taswira halisi ya mguu kuikanyaga nchi pamoja na umoja wa ‘mguu’ katika Kiebrania.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: itakuwa urithi wako
  rationale: ‘Urithi’ huonyesha milki iliyogawiwa na kupokelewa, huku wakati ujao ukihifadhiwa kwa ‘itakuwa.’
- source_word: וּלְבָנֶיךָ
  choice: na wa wanao
  rationale: Kiebrania kinasema kihalisi ‘wana wako’; ‘wanao’ huhifadhi umbo hilo la kiume bila kulipanua kimya kimya.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida na yenye uzito inayowasilisha muda usio na mwisho ulioelezwa hapa.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: kwa sababu umemfuata ... kwa moyo wote
  rationale: Nahau hii humaanisha kufuata kikamilifu au kwa uaminifu wote; Kiswahili ‘kwa moyo wote’ ni cha asili na huhifadhi maana ya kujitoa kikamilifu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limehifadhiwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kiko wazi katika Kiebrania na kinahifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya cheo.
- issue: Neno la ukoo וּלְבָנֶיךָ lenye jinsia ya kiume
  choice: na wa wanao
  alternative: na wa watoto wako; na wa wazao wako
  rationale: Kiebrania kinasema ‘wana wako.’ Tafsiri kuu inahifadhi umbo hilo, huku uwezekano wa maana pana ya wazao ukitajwa katika tanbihi.
- issue: Nahau מִלֵּאתָ אַחֲרֵי
  choice: umemfuata ... kwa moyo wote
  alternative: umemfuata kikamilifu
  rationale: Chaguo hili linatoa Kiswahili cha kawaida na chenye heshima bila kupunguza wazo la kumfuata Yahweh kwa ukamilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa usimulizi wa Biblia lakini si wa kizamani; taswira ya ‘mguu ... umeikanyaga’ na jina ‘Yahweh’ zimehifadhiwa.
