  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: sw
  text: Kwa maana Musa alikuwa ametoa urithi kwa makabila mawili na nusu ya kabila ng'ambo ya Yordani[a], lakini hakuwapa Walawi urithi miongoni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande wa pili wa Yordani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza maelezo yanayotoa sababu ya kauli katika muktadha, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: נָתַן
  choice: alikuwa amewapa
  rationale: Wakati timilifu wa zamani unaonyesha kwamba tendo la Musa lilitangulia hali inayosimuliwa sasa; kiambishi cha watendewa wengi kinaendana na makabila.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Hapa neno linamaanisha milki ya ardhi iliyogawiwa na kurithiwa; “urithi” huhifadhi istilahi kuu bila kuifanya kuwa maelezo marefu.
- source_word: שְׁנֵי הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: yale makabila mawili na nusu ya kabila
  rationale: מַטֶּה hapa ni kabila, si fimbo. “Nusu ya kabila” ni usemi sahihi wa mgao wa nusu ya kabila la Manase; “yale” yanaonyesha makabila yaliyotajwa katika muktadha.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Ni usemi wa asili wa kijiografia unaohifadhi uwezekano wa maana ya upande wa pili bila kubainisha kimyakimya upande wa mashariki.
- source_word: וְלַלְוִיִּם
  choice: lakini ... Walawi
  rationale: 'Ingawa וְ kimsingi ni “na,” uhusiano wa kishazi ni wa kulinganisha kwa utofauti: makabila mengine yalipewa urithi, Walawi hawakupewa.'
- source_word: לֹא נָתַן נַחֲלָה
  choice: hakuwapa ... urithi
  rationale: Tafsiri ya moja kwa moja inayorudia istilahi “urithi” na kuonyesha Walawi kama wapokeaji wengi.
- source_word: בְּתוֹכָם
  choice: miongoni mwao
  rationale: 'Hudumisha kikomo cha kauli: Walawi hawakupewa urithi wa kikabila miongoni mwa makabila hayo.'
theological_decisions:
- issue: Aina ya urithi ambao Walawi hawakupewa
  choice: Kauli inakanusha urithi wa ardhi wa kikabila miongoni mwa makabila mengine.
  alternative: Kusema kwa ujumla tu kwamba Walawi hawakupata urithi wowote.
  rationale: Maneno “miongoni mwao” yamehifadhiwa ili kutodokeza kwamba Walawi walinyimwa kila aina ya riziki au fungu, huku tafsiri isiongeze maelezo ya kitheolojia yasiyosemwa moja kwa moja hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Ng’ambo ya Yordani” ni usemi mfupi na wa kawaida; alama ya tanbihi imewekwa katika matini kuu.
