  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: sw
  text: Nilikuwa na umri wa miaka arobaini wakati Musa, mtumishi wa Yahwe, aliponituma kutoka Kadeshi-Barnea kuipeleleza nchi, nami nikamletea habari kulingana na yaliyokuwa moyoni mwangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nikamletea habari kulingana na moyo wangu.”
    reason: Njia nyingine ya kuhifadhi kwa karibu zaidi nahau ya Kiebrania כַּאֲשֶׁר עִם לְבָבִי.
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: Nilikuwa na umri wa miaka arobaini
  rationale: Hii ni nahau ya Kiebrania ya kutaja umri; Kiswahili cha kawaida hutumia ‘kuwa na umri wa miaka arobaini.’
- source_word: בִּשְׁלֹחַ
  choice: wakati ... aliponituma
  rationale: Kitenzi-jina chenye ב kinaonyesha wakati au hali ambamo jambo lilitokea; muundo huu ni wa asili katika Kiswahili.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahwe
  rationale: ‘Mtumishi’ huhifadhi hadhi ya cheo cha heshima cha Musa katika uhusiano wake na Mungu, bila maana hasi inayoweza kuambatana na ‘mtumwa.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: kutoka Kadeshi-Barnea
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: לְרַגֵּל
  choice: kuipeleleza
  rationale: Kitenzi hiki kinaonyesha uchunguzi wa nchi kwa kusudi la upelelezi; ‘kuipeleleza’ kinafaa katika muktadha wa simulizi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu neno linamaanisha eneo au nchi iliyokuwa ikichunguzwa.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: nami nikamletea habari
  rationale: Nahau hiyo ina maana ya kumrudishia mtu ujumbe au taarifa; ‘nikamletea habari’ ni Kiswahili cha asili na huhifadhi umoja wa דָּבָר bila kulazimisha ‘ripoti.’
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: kulingana na yaliyokuwa moyoni mwangu
  rationale: Huhifadhi taswira ya moyo na kutaja maudhui ya ndani ya Kalebu bila kuamua kimyakimya kwamba kifungu hicho kinamaanisha hasa uaminifu au moyo wote.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina יהוה; ‘Yahwe’ hulihifadhi kama jina binafsi la agano badala ya kulibadili kuwa cheo.
- issue: Maana ya כַּאֲשֶׁר עִם לְבָבִי
  choice: kulingana na yaliyokuwa moyoni mwangu
  alternative: kwa moyo wa uaminifu; kwa moyo wangu wote
  rationale: Tafsiri iliyochaguliwa huhifadhi mvutano kati ya usadikisho wa ndani na uaminifu wa msemaji, bila kuongeza wazo la ‘moyo wote’ ambalo halijasemwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida, huku taswira ya ‘moyo’ ikihifadhiwa. Alama ya tanbihi [a] imewekwa mara tu baada ya kishazi kinachohusika.
