  yaml_path: translation/ot/joshua/014/008.yaml
  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: sw
  text: Lakini ndugu zangu waliopanda pamoja nami waliwavunja moyo watu, ila mimi nilimfuata kikamilifu BWANA Mungu wangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: ndugu zangu
  rationale: Neno la Kiebrania linaweza kumaanisha ndugu wa ukoo au watu wenza; katika muktadha huu ni wapelelezi wenzake, na “ndugu zangu” huhifadhi usemi wa Kalebu.
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: waliwavunja moyo watu
  rationale: Nahau halisi ni ‘waliiyeyusha moyo wa watu’; katika Kiswahili cha kawaida maana yake ya kuwatia hofu na kuwaondolea ujasiri inaelezwa kwa kawaida kwa ‘kuwavunja moyo’.
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: nilimfuata kikamilifu
  rationale: Muundo huu una wazo la kufuata kwa ukamilifu au kwa moyo wote; ‘kikamilifu’ huhifadhi nguvu ya kitenzi bila kuongeza fundisho lisilokuwamo.
- source_word: יְהוָה
  choice: BWANA
  rationale: Huwakilisha jina la agano la Mungu kwa desturi iliyozoeleka katika tafsiri za Biblia za Kiswahili, kwa herufi kubwa ili kulitofautisha na cheo cha kawaida.
theological_decisions:
- issue: Tofauti kati ya mwenendo wa wale wapelelezi na uaminifu wa Kalebu
  choice: ila mimi nilimfuata kikamilifu BWANA Mungu wangu
  alternative: nami nilimfuata BWANA Mungu wangu kwa moyo wote
  rationale: Tafsiri iliyochaguliwa huhifadhi msisitizo wa Kiebrania kwamba Kalebu alitimiza kikamilifu wajibu wa kumfuata BWANA, bila kufafanua kupita kiasi hali yake ya ndani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Walipanda’ linafaa kijiografia kwa safari kuelekea nchi ya Kanaani; ‘ila’ huonyesha utofauti ulio katika וְאָנֹכִי.
