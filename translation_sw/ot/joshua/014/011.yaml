base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: sw
  text: Bado nina nguvu leo kama nilivyokuwa siku ile Musa aliponituma; nguvu zangu zilivyokuwa wakati ule, ndivyo zilivyo sasa, kwa vita na kwa kutoka na kuingia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “kutoka na kuingia” ni nahau ya Kiebrania inayoweza kumaanisha uwezo kamili wa kutenda na kushughulika.
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם חָזָק
  choice: Bado nina nguvu leo
  rationale: Huwasilisha hali inayoendelea ya Kalebu kwa Kiswahili cha kawaida; 'nina nguvu' ni ya asili zaidi hapa kuliko 'niko mwenye nguvu'.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: kama nilivyokuwa siku ile Musa aliponituma
  rationale: Huhifadhi ulinganisho na rejeo la wakati maalumu huku ikifanya kitenzi kilichodokezwa katika Kiebrania kuwa wazi kwa Kiswahili.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: nguvu zangu zilivyokuwa wakati ule, ndivyo zilivyo sasa
  rationale: Huhifadhi uwiano wa kishairi na ulinganisho wa Kiebrania kati ya zamani na sasa bila kuongeza maana.
- source_word: לַמִּלְחָמָה
  choice: kwa ajili ya vita
  rationale: מִלְחָמָה hapa huelekea uwezo wa kushiriki mapigano; 'vita' ni neno la kawaida na lenye heshima katika muktadha huu.
- source_word: וְלָצֵאת וְלָבוֹא
  choice: na kwa kutoka na kuingia
  rationale: Tafsiri ya karibu huhifadhi nahau ya Kiebrania na utata wake wa kurejelea shughuli kamili, uongozi, au uwezo wa kijeshi.
