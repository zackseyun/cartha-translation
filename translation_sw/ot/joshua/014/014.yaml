source:
  edition: WLC
  text: עַל כֵּ֣ן הָיְתָֽה חֶ֠בְרוֹן לְ/כָלֵ֨ב בֶּן יְפֻנֶּ֤ה הַ/קְּנִזִּי֙ לְֽ/נַחֲלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה יַ֚עַן אֲשֶׁ֣ר מִלֵּ֔א אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: sw
  text: Kwa hiyo, Hebroni ikawa urithi wa Kalebu mwana wa Yefune, Mkenizi, mpaka leo, kwa sababu alimfuata Yahwe, Mungu wa Israeli, kwa moyo wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimfuata Yahwe kikamilifu.” Nahau ya Kiebrania inasema kihalisi kwamba “alijaza baada ya” Yahwe, ikimaanisha kumfuata kwa uaminifu kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha matokeo yanayotokana na kutolewa kwa eneo lililotajwa kabla, kwa Kiswahili cha kawaida na cha heshima.
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: ikawa urithi wa
  rationale: Muundo huu unaonyesha kwamba Hebroni iliingia katika hali ya kuwa sehemu ya urithi uliogawiwa Kalebu, si tu kwamba ilikuwa hivyo bila mabadiliko.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Umbo la jina la mahali lililozoeleka katika Kiswahili cha Biblia.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: wa Kalebu mwana wa Yefune, Mkenizi
  rationale: Kihusishi לְ kinaonyesha umiliki au mnufaika; muundo huu unasomeka kwa kawaida pamoja na neno ‘urithi’.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Ni nahau ya Kiswahili inayoonyesha kwamba hali hiyo iliendelea hadi wakati wa msimulizi.
- source_word: יַעַן אֲשֶׁר
  choice: kwa sababu
  rationale: Inaeleza wazi sababu ya Kalebu kupewa Hebroni kuwa urithi.
- source_word: מִלֵּא אַחֲרֵי
  choice: alimfuata ... kwa moyo wote
  rationale: Nahau ya Kiebrania ‘kujaza baada ya’ huonyesha ufuasi kamili na uaminifu usiogawanyika; tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi taswira halisi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu katika Tetragramatoni badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Linawakilisha moja kwa moja muundo wa umilikishi na utambulisho wa Mungu kwa Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה; ‘Yahwe’ hulihifadhi badala ya kutumia cheo mbadala.
- issue: Kiwango cha uaminifu wa Kalebu katika מִלֵּא אַחֲרֵי
  choice: alimfuata ... kwa moyo wote
  alternative: alimfuata kikamilifu
  rationale: Chaguo hili linaonyesha uaminifu kamili bila kulipanua kuwa dai lisilosemwa la kutokuwa na dhambi; tanbihi inaeleza nahau ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia; sentensi inadumisha uhusiano wa sababu na matokeo wa Kiebrania.
