reference: Joshua 14:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: sw
  text: Na sasa, tazama, Yahwe amenihifadhi hai[a], kama alivyosema, kwa miaka hii arobaini na mitano tangu Yahwe aliposema jambo hili[b] kwa Musa, wakati Israeli ilipokuwa ikitembea jangwani[c]. Na sasa, tazama, leo nina umri wa miaka themanini na mitano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameniweka hai.”
    reason: lexical_alternative
  - marker: b
    text: “Jambo hili” pia linaweza kutafsiriwa “neno hili,” au kwa kufafanua zaidi, “ahadi hii.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wakati Israeli ilipokuwa ikisafiri jangwani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: amenihifadhi hai
  rationale: Hifili ya חיה hapa ina maana ya kudumisha au kuhifadhi uhai katika kipindi kilichopita hadi sasa, si kumpa mtu uhai kwa mara ya kwanza.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: kama alivyosema
  rationale: Huhifadhi maana ya kitenzi 'kusema' bila kufasiri kauli hiyo moja kwa moja kuwa ahadi.
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: kwa miaka hii arobaini na mitano
  rationale: Huonyesha kipindi cha miaka 45 kilichopita na kufikia wakati wa sasa, huku ikihifadhi nguvu ya kielekezi זֶה.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דבר inaweza kumaanisha neno, jambo, au suala; 'jambo hili' ni la asili katika Kiswahili na halilazimishi tafsiri ya 'ahadi'.
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: wakati Israeli ilipokuwa ikitembea jangwani
  rationale: Huhifadhi picha ya הלך, 'kutembea/kwenda,' pamoja na uhusiano wa wakati wa kishazi.
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira na kutia mkazo kwa lugha ya sasa yenye hadhi.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: nina umri wa miaka themanini na mitano
  rationale: Ni namna ya kawaida ya Kiswahili ya kueleza nahau ya Kiebrania inayosema kihalisi 'mwana wa miaka themanini na mitano.'
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo; tahajia 'Yahwe' inafaa matamshi na uandishi wa Kiswahili.
- issue: Maana ya הַדָּבָר הַזֶּה
  choice: jambo hili
  alternative: neno hili; ahadi hii
  rationale: Muktadha unaweza kuelekeza kwenye kauli yenye nguvu ya ahadi, lakini neno lenyewe ni pana; 'jambo hili' huhifadhi upana huo bila kuondoa mvutano wa kifasiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya 'Na sasa, tazama' yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa Kiebrania. 'Israeli' imetumiwa kama jina la pamoja la taifa, hivyo upatanisho wa ngeli umetolewa kwa 'ilikuwa'.
