base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: sw
  text: Kwa maana wazao wa Yosefu walikuwa makabila mawili, Manase na Efraimu. Hawakuwapa Walawi sehemu katika nchi, isipokuwa miji ya kuishi, pamoja na maeneo yao ya malisho[a] kwa ajili ya mifugo yao na mali zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maeneo ya malisho” ni maeneo ya wazi yaliyozunguka miji ya Walawi, yaliyotumiwa hasa kulishia mifugo.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu au msingi wa kauli iliyotangulia; “Kwa maana” hudumisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בְנֵי יוֹסֵף
  choice: wazao wa Yosefu
  rationale: Ingawa maana ya karibu ni “wana wa Yosefu,” hapa kirai kinarejelea vizazi vyake vilivyounda makabila, hivyo “wazao” huepuka kudokeza wana wake wa moja kwa moja pekee.
- source_word: שְׁנֵי מַטּוֹת
  choice: makabila mawili
  rationale: Katika muktadha wa ugawaji wa nchi, מַטּוֹת ni makabila, si fimbo halisi.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: Manase na Efraimu
  rationale: Haya ni maumbo ya majina yanayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: Hawakuwapa ... sehemu
  rationale: Muundo tendaji unafuata kitenzi cha Kiebrania, huku “sehemu” ikifaa katika muktadha wa mgao wa nchi.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Neno hili la wingi linarejelea watu wa kabila la Lawi kama kundi.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Linarejelea nchi iliyokuwa ikigawanywa kuwa urithi.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Kirai hiki kinaweka jambo pekee lililotolewa licha ya kutotolewa kwa sehemu ya nchi.
- source_word: עָרִים לָשֶׁבֶת
  choice: miji ya kukaa
  rationale: Huwasilisha kwa njia fupi kusudi la miji hiyo kuwa mahali pa kuishi.
- source_word: מִגְרְשֵׁיהֶם
  choice: maeneo yake ya malisho
  rationale: Neno linamaanisha maeneo ya wazi yaliyozunguka miji, yaliyotumiwa hasa kwa mifugo; kiwakilishi “yake” kinarejelea miji.
- source_word: לְמִקְנֵיהֶם
  choice: kwa ajili ya mifugo yao
  rationale: מִקְנֶה ni neno pana kwa wanyama wanaofugwa, hivyo “mifugo” ni la asili na sahihi.
- source_word: וּלְקִנְיָנָם
  choice: na mali zao
  rationale: Neno hili linahusu vitu walivyomiliki kwa upana zaidi, tofauti na mifugo iliyotajwa kabla yake.
