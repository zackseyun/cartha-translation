  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: sw
  text: Urithi wao uligawanywa kwa kura, kama Yahwe alivyoamuru kupitia kwa Musa[a], kwa makabila tisa na nusu ya kabila moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mkono wa Musa”; nahau inayomaanisha kwamba agizo lilitolewa kupitia kwake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: kwa kura
  rationale: Kirai hiki kinaonyesha njia iliyotumiwa kugawa urithi, yaani kupiga kura; “kwa kura” ni Kiswahili cha kawaida na chenye maana hiyo wazi.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: Katika muktadha huu neno linamaanisha ardhi waliyopokea kama milki yao ya urithi.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Huunganisha ugawaji huo na agizo la awali la Yahwe kwa njia fupi na ya kawaida.
- source_word: צִוָּה
  choice: alivyoamuru
  rationale: Kauli hii inaonyesha kwamba agizo lilitangulia ugawaji unaosimuliwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa kulinakili katika muundo unaosomeka kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia kwa Musa
  rationale: Neno kwa neno ni “kwa mkono wa Musa,” lakini ni nahau ya Kiebrania inayoonyesha uwakala au upatanishi.
- source_word: לְתִשְׁעַת הַמַּטּוֹת
  choice: kwa ajili ya makabila tisa
  rationale: Kiambishi לְ hapa kinaonyesha waliopokea mgao, na מַטֶּה humaanisha kabila katika muktadha huu.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: na nusu ya kabila
  rationale: Hurejelea nusu ya kabila moja; tafsiri hii haiongezi jina la Manase ambalo halimo katika mstari wenyewe.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kwa namna inayolingana na matamshi na tahajia ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kutendwa “uligawanywa” unaweka wazi tendo linalodokezwa na kishazi kifupi cha Kiebrania, huku “kwa kura” ikihifadhi njia ya ugawaji.
