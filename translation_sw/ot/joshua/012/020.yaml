  text: Mfalme wa Shimron-Meroni[a], mmoja; mfalme wa Akshafu, mmoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda haya ni majina mawili tofauti ya mahali, “Shimroni” na “Meroni”; kwa kawaida Kiebrania hapa huchukuliwa kuwa jina ambatani, “Shimron-Meroni,” linalopatana na hesabu ya wafalme wawili katika mstari huu.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: mfalme wa
  rationale: Katika orodha hii ya ushindi, neno hili linamtaja mtawala wa kila mji-dola. Kiswahili cha kawaida hutumia muundo mfupi “mfalme wa [mahali].”
- source_word: שִׁמְרוֹן מְראוֹן
  choice: Shimron-meroni
  rationale: Mpangilio wa Kimasoreti na hesabu ya wafalme wawili katika mstari huu zinaunga mkono kulichukulia kama jina ambatani la mahali. Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili badala ya kutafsiriwa.
- source_word: אֶחָד
  choice: mmoja
  rationale: Katika fomula inayorudiwa ya sura hii, neno hilo ni hesabu fupi ya kila mfalme. “Mmoja” huhifadhi ufupi na mdundo wa Kiebrania.
- source_word: אַכְשָׁף
  choice: Akshafu
  rationale: Ni jina la mahali, kwa hiyo limetoholewa kwa tahajia ya Kiswahili inayowakilisha konsonanti za Kiebrania na kuongezewa irabu ya mwisho kwa usomaji wa kawaida.
