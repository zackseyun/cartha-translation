- source_word: מֶלֶךְ
  choice: mfalme wa
  rationale: Nomino katika hali ya kuunganisha na jina la mahali linalofuata; Kiswahili hutumia kwa kawaida muundo “mfalme wa Tirza” katika orodha hii.
- source_word: תִּרְצָה
  choice: Tirza
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili badala ya kutafsiriwa.
- source_word: אֶחָד
  choice: mmoja
  rationale: Namba ya msingi inayoonyesha mfalme mmoja, ikiwa na upatanisho wa ngeli unaolingana na “mfalme.”
- source_word: כָּל
  choice: wote
  rationale: Neno la kujumlisha kundi zima la wafalme waliotajwa; “wote” huhifadhi maana ya msingi kwa Kiswahili cha kawaida.
- source_word: מְלָכִים
  choice: wafalme
  rationale: Wingi wa “mfalme,” ukirejelea kundi maalumu lililoorodheshwa.
- source_word: שְׁלֹשִׁים וְאֶחָד
  choice: thelathini na mmoja
  rationale: Namna ya kawaida ya Kiswahili ya kutoa jumla ya wafalme thelathini na mmoja, huku “mmoja” ikipatana na “wafalme.”
