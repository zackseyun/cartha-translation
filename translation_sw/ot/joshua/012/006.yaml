  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: sw
  text: Musa, mtumishi wa Yahweh, na wana wa Israeli,[a] waliwapiga. Kisha Musa, mtumishi wa Yahweh, akawapa nchi hiyo kuwa urithi Wareubeni, Wagadi, na nusu ya kabila la Manase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa usemi wa kawaida zaidi, “Waisraeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: mtumishi
  rationale: Katika cheo cha Musa, neno hili linaonyesha utumishi wa kujitoa na mamlaka aliyopewa na Yahweh; “mtumishi” ni la kawaida na lenye heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo wa Kiebrania, ambao kihalisi ni “wana wa Israeli,” huku tanbihi ikitoa usemi wa kawaida zaidi.
- source_word: הִכּוּם
  choice: waliwaangamiza
  rationale: Katika muhtasari huu wa vita, kitenzi נכה kinaonyesha kuwashinda kwa kuwaua; “waliwaangamiza” huwasilisha nguvu ya tendo hilo kwa Kiswahili cha kawaida.
- source_word: וַיִּתְּנָהּ
  choice: akaitoa nchi hiyo
  rationale: Kiambishi cha kike cha umoja kinarejelea nchi au eneo linaloeleweka kutokana na muktadha; kutaja “nchi hiyo” hufanya rejeo liwe wazi kwa Kiswahili.
- source_word: יְרֻשָּׁה
  choice: iwe urithi
  rationale: Huwasilisha nchi kama milki ya kurithi bila kuongeza maelezo ya kimadhehebu.
- source_word: לָרֻאוּבֵנִי
  choice: Wareubeni
  rationale: Nomino ya ukoo iliyo katika umoja hutumiwa kwa maana ya kundi lote la kabila; “Wareubeni” ni umbo la kawaida la Kiswahili.
- source_word: לַגָּדִי
  choice: Wagadi
  rationale: Kama ilivyo kwa Wareubeni, umbo la Kiebrania linawakilisha kwa pamoja watu wa kabila la Gadi.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: nusu ya kabila la Manase
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi kinachorejelea sehemu ya kabila la Manase iliyopewa eneo hilo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano la Mungu, kwa hiyo limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- issue: Usemi wa kijumuiya wenye jinsia בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Maandishi yana usemi ambao kihalisi ni “wana wa Israeli.” Muundo huo umehifadhiwa katika mstari, na tanbihi inaonyesha usemi wa kawaida zaidi bila kuficha umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa ili isomeke kwa urahisi, na “pamoja na” inaonyesha kwamba Musa na wana wa Israeli ndio wahusika wa pamoja wa tendo la kwanza.
