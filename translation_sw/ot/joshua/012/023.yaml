lexical_decisions:
- source_word: מֶלֶךְ
  choice: mfalme wa
  rationale: Katika orodha hii neno hili linaunganika na jina la mahali au kundi; “mfalme wa” ni muundo wa kawaida na wa asili katika Kiswahili.
- source_word: דּוֹר
  choice: Dori
  rationale: Ni jina la mahali; limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: לְנָפַת דּוֹר
  choice: katika eneo la Dori
  rationale: נָפָה inaweza kumaanisha eneo, wilaya, au sehemu ya miinuko. “Eneo” ni la asili na halilazimishi maana ya kijiografia iliyo mahususi kupita ushahidi wa Kiebrania.
- source_word: אֶחָד
  choice: mmoja
  rationale: Hutumika kama alama ya kuhesabu kila mfalme katika orodha. “Mmoja” huhifadhi mtindo mfupi wa Kiebrania na kupatana na nomino ya ngeli ya mtu.
- source_word: גּוֹיִם
  choice: Goimu
  rationale: Ingawa kwa kawaida humaanisha “mataifa,” hapa huenda ni jina la mahali au eneo. Kulitohoa katika matini kuu kunahifadhi utata huo.
- source_word: לְגִלְגָּל
  choice: huko Gilgali
  rationale: Kiambishi לְ kinaonyesha uhusiano na mahali. “Huko Gilgali” ni Kiswahili cha asili kinachoonyesha mahali mfalme huyo alikohusishwa nako.
