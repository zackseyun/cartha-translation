  footnotes:
  - marker: a
    text: Au “katika miinuko ya Dori” au “katika wilaya ya Dori.” Neno la Kiebrania linaweza kutaja eneo kwa ujumla au sehemu yake ya miinuko.
    reason: lexical_alternative
  - marker: b
    text: 'Neno la Kiebrania lililotoholewa kuwa “Goimu” kwa kawaida humaanisha “mataifa” au “watu wa mataifa”; hapa huenda linatumika kama jina la mahali au la eneo. Kwa hiyo, pia yawezekana kutafsiri: “mfalme wa mataifa huko Gilgali.”'
