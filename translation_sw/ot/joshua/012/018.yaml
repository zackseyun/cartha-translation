  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: mfalme wa
  rationale: Katika orodha hii ya ushindi, neno hili humtambulisha kila mtawala aliyeshindwa. Kiswahili kwa kawaida hakihitaji kibainishi kinacholingana na ‘the’ ya Kiingereza.
- source_word: אֲפֵק
  choice: Afeki
  rationale: Ni jina la mahali; limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: אֶחָד
  choice: mmoja
  rationale: Hutumika kama hesabu ya kila mfalme katika orodha. ‘Mmoja’ hupatana na ngeli ya ‘mfalme’ na kuhifadhi mtindo mfupi wa Kiebrania.
- source_word: לַ/שָּׁרוֹן
  choice: wa Sharoni
  rationale: Kiambishi cha Kiebrania kinaelekeza kwenye eneo la Sharoni. ‘Sharoni’ ni utohozi wa jina la eneo, bila kuongeza ufafanuzi wa kijiografia usiotajwa wazi.
