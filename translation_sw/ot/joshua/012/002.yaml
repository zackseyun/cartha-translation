  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: sw
  text: Sihoni, mfalme wa Waamori, aliyeishi Heshboni, alitawala kuanzia Aroeri, ulio ukingoni mwa Bonde la Arnoni[a], na katikati ya bonde hilo, pamoja na nusu ya Gileadi, hadi Bonde la Yaboki, mpaka wa wana wa Amoni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania נחל linaweza kumaanisha bonde, wadi, au kijito katika bonde; hapa Arnoni na Yaboki vinatajwa kama mipaka ya maeneo.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania: “wana wa Amoni,” yaani Waamoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹשֵׁב
  choice: aliyekaa
  rationale: Kitenzi ישב hapa kinaonyesha makao ya kudumu. “Aliyekaa” ni Kiswahili cha kawaida na chenye heshima kinachowasilisha maana ya kuishi mahali.
- source_word: מֹשֵׁל
  choice: alitawala
  rationale: משל hapa inaeleza utawala wa kisiasa wa Sihoni juu ya eneo linalotajwa.
- source_word: מֵעֲרוֹעֵר
  choice: kuanzia Aroeri
  rationale: Kihusishi מ־ kinaonyesha mwanzo wa eneo; “kuanzia” huonyesha wazi mwanzo huo wa kijiografia.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: ukingoni mwa Bonde la Arnoni
  rationale: שפה ni ukingo au kingo, na נחל inaweza kumaanisha bonde lenye kijito au mkondo wa msimu. “Ukingoni mwa Bonde” huhifadhi picha ya kijiografia bila kulazimisha maana ya mto wenye maji daima.
- source_word: וְתוֹךְ הַנַּחַל
  choice: na kutoka katikati ya bonde hilo
  rationale: תוך humaanisha katikati. Neno “kutoka” limeongezwa kwa uwazi wa Kiswahili ili kuendeleza maelezo ya mipaka, bila kufuta ugumu uliopo katika mpangilio wa Kiebrania.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: pamoja na nusu ya Gileadi
  rationale: חצי ni nusu ya eneo. “Pamoja na” huunganisha sehemu hii kwa kawaida na maeneo yaliyokuwa chini ya utawala wa Sihoni.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: hadi Bonde la Yaboki
  rationale: עד huonyesha mwisho wa eneo, huku נחל ikihifadhiwa kwa maana pana ya bonde au wadi.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: mpaka wa wana wa Amoni
  rationale: בני עמון ni kihalisi “wana wa Amoni.” Muundo huo umehifadhiwa kwa sababu unaeleweka kwa Kiswahili na unaakisi namna ya Kiebrania ya kulitaja taifa hilo.
- source_word: הָאֱמֹרִי
  choice: wa Waamori
  rationale: Ingawa umbo la Kiebrania ni la umoja likimfafanua mfalme, Kiswahili cha kawaida husema “mfalme wa Waamori” kumaanisha taifa alilolitawala.
