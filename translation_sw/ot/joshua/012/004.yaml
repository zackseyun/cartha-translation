lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: na eneo la
  rationale: גְּבוּל hapa inaonyesha eneo lililokuwa chini ya utawala wa Ogu, si mpaka mmoja tu; kiambishi וּ kimetafsiriwa “na” kuendeleza orodha.
- source_word: ע֚וֹג
  choice: Ogu
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili.
- source_word: מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: mfalme wa Bashani
  rationale: Muundo huu unamtambulisha Ogu kwa cheo chake na eneo alilotawala; Bashani limetoholewa kama jina la mahali.
- source_word: מִ/יֶּ֖תֶר
  choice: aliyekuwa mmoja wa mabaki ya
  rationale: יֶתֶר humaanisha kilichobaki. Muundo huu wa Kiswahili unaonyesha wazi kwamba Ogu alikuwa sehemu ya wale waliokuwa wamebaki, bila kufanya sentensi kuwa ngumu.
- source_word: הָ/רְפָאִ֑ים
  choice: Warefaim[a]
  rationale: Jina la kundi la watu limehifadhiwa badala ya kutafsiriwa moja kwa moja kuwa “majitu”; uwezekano huo wa maana umewekwa katika tanbihi.
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: aliyeishi
  rationale: Kivumishi-shirikishi cha umoja kinamrejelea Ogu, na ישב hapa kwa kawaida humaanisha kuishi au kukaa mahali.
- source_word: בְּ/עַשְׁתָּר֖וֹת
  choice: huko Ashtarothi
  rationale: Jina la mahali limetoholewa, na “huko” linaonyesha mahali alipoishi kwa Kiswahili cha kawaida.
- source_word: וּ/בְ/אֶדְרֶֽעִי
  choice: na Edrei
  rationale: Kiunganishi וּ kimewakilishwa kwa “na”; kihusishi cha mahali kinaeleweka kwa pamoja na “huko” iliyotangulia.
