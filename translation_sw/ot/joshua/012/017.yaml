  rationale: Namba hii inahesabu kwa ufupi kila mfalme aliyeshindwa; ‘mmoja’ inapatanishwa na nomino hai ‘mfalme’ na kuhifadhi mtindo wa orodha.
- source_word: חֵפֶר
  choice: Heferi
  rationale: Ni jina la mahali; limetoholewa kwa namna ya kawaida na inayotamkika kwa Kiswahili.
