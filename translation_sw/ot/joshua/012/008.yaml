base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: sw
  text: katika nchi ya milima, na katika nyanda za chini[a], na katika Araba[b], na kwenye miteremko, na nyikani, na katika Negebu[c]—Wahiti, Waamori, Wakanaani, Waperizi, Wahivi na Wayebusi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika Shefela,” jina la eneo la nyanda za chini na vilima vya magharibi.
    reason: lexical_alternative
  - marker: b
    text: “Araba” ni jina la eneo la bonde la ufa au uwanda wa jangwani; au “katika uwanda wa jangwani.”
    reason: lexical_alternative
  - marker: c
    text: Au “katika nchi ya kusini”; neno la Kiebrania Negebu linaweza kutaja eneo hilo la kusini au kumaanisha “kusini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: katika nchi ya milima
  rationale: הַר hapa ina maana ya eneo la milima, si mlima mmoja; tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili.
- source_word: וּבַשְּׁפֵלָה
  choice: katika nchi ya chini
  rationale: שְׁפֵלָה hutaja eneo la chini au la vilima vya chini upande wa magharibi; ‘nchi ya chini’ ni wazi katika matini, huku jina Shefela likihifadhiwa katika tanbihi.
- source_word: וּבָעֲרָבָה
  choice: katika Araba
  rationale: עֲרָבָה hapa lina nguvu ya jina la eneo la bonde tambarare la ufa; ‘Araba’ huhifadhi utambulisho huo wa kijiografia.
- source_word: וּבָאֲשֵׁדוֹת
  choice: kwenye miteremko
  rationale: אֲשֵׁדוֹת humaanisha miteremko au sehemu zinazoteremka za milima; ‘kwenye miteremko’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: וּבַמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר mara nyingi ni nchi kame isiyokaliwa sana, si lazima jangwa la mchanga; ‘nyikani’ huwasilisha maana hiyo kwa ufupi.
- source_word: וּבַנֶּגֶב
  choice: katika Negebu
  rationale: נֶגֶב linaweza kumaanisha kusini au eneo maalumu la kusini; katika orodha hii ya maeneo, jina la eneo ‘Negebu’ linafaa zaidi.
- source_word: הַחִתִּי
  choice: Wahiti
  rationale: Nomino ya Kiebrania iko katika umoja wa kijumla lakini hutaja jamii nzima; wingi wa Kiswahili unafaa.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Umoja wa kijumla wa Kiebrania umetafsiriwa kwa jina la jamii katika wingi wa Kiswahili.
- source_word: וְהַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Jina hili la kikabila lina maana ya kijumla, hivyo limetolewa katika wingi wa Kiswahili.
- source_word: הַפְּרִזִּי
  choice: Waperizi
  rationale: Jina la jamii katika umoja wa kijumla limetafsiriwa kwa wingi wa kawaida wa Kiswahili.
- source_word: הַחִוִּי
  choice: Wahivi
  rationale: Jina la jamii katika umoja wa kijumla limetafsiriwa kwa wingi wa kawaida wa Kiswahili.
- source_word: וְהַיְבוּסִי
  choice: Wayebusi
  rationale: Jina la jamii katika umoja wa kijumla limetafsiriwa kwa wingi wa kawaida wa Kiswahili.
