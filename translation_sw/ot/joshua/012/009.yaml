lexical_decisions:
- source_word: מֶלֶךְ
  choice: mfalme wa
  rationale: Hutoa maana ya kawaida ya mtawala na kuunganisha kwa asili jina la mahali katika orodha hii.
- source_word: יְרִיחוֹ
  choice: Yeriko
  rationale: Umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
- source_word: אֶחָד
  choice: mmoja
  rationale: Katika fomula ya kuhesabu wafalme walioshindwa, neno hili linatoa jumla fupi ya mmoja; mtindo wa orodha umehifadhiwa bila kuongeza 'mfalme'.
- source_word: הָעַי
  choice: Ai
  rationale: Jina la mahali limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: אֲשֶׁר
  choice: ulio
  rationale: Kiwakilishi rejeshi kinarejelea mji wa Ai na kuanzisha maelezo ya mahali ulipo.
- source_word: מִצַּד
  choice: kando ya
  rationale: Hueleza ukaribu au kuwa upande wa Betheli kwa lugha fupi na ya kawaida.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Umbo la kawaida la Kiswahili la jina hili la mahali.
