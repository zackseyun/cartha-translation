- source_word: מֶלֶךְ
  choice: mfalme wa
  rationale: Katika orodha hii, neno hili linamtaja mtawala wa kila mji-ufalme. Kiswahili cha kawaida hutumia muundo “mfalme wa [mahali].”
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֶחָד
  choice: mmoja
  rationale: Hapa neno hili ni hesabu ya kila mfalme aliyeshindwa. “Mmoja” huhifadhi mtindo mfupi wa orodha ya Kiebrania.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Jina la mahali limetolewa kwa tahajia ya kawaida ya Kiswahili.
