source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: sw
  text: Na hawa ndio wafalme wa nchi ambao Yoshua na Waisraeli[a] waliwashinda upande wa magharibi wa Yordani, kuanzia Baal-Gadi katika Bonde la Lebanoni hadi Mlima Halaki, unaoinuka kuelekea Seiri[b]; naye Yoshua akawapa makabila ya Israeli nchi hiyo kuwa urithi wao kulingana na mafungu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “unaopanda kuelekea Seiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na hawa ndio
  rationale: Inahifadhi kiunganishi cha Kiebrania na kutambulisha orodha inayofuata kwa Kiswahili cha kawaida.
- source_word: מַלְכֵי הָאָרֶץ
  choice: wafalme wa nchi
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa Kiebrania bila kuifanya nchi hiyo kuwa taifa la kisasa.
- source_word: אֲשֶׁר הִכָּה
  choice: ambao ... waliwashinda
  rationale: Katika muktadha wa vita vya kutwaa nchi, kitenzi נכה kinaweza kumaanisha kuwapiga au kuwashinda; 'waliwashinda' ni cha kawaida na hakidai zaidi ya muktadha.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: na Waisraeli
  rationale: Kiebrania halisi ni 'wana wa Israeli,' lakini hapa usemi huo unalitaja taifa; 'Waisraeli' ni Kiswahili cha asili na maana halisi imehifadhiwa katika tanbihi.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: upande wa magharibi wa Yordani
  rationale: יַמָּה inaelekeza magharibi, na usemi huu unaonyesha wazi eneo linalokusudiwa bila sintaksia ngumu.
- source_word: מִבַּעַל גָּד בְּבִקְעַת הַלְּבָנוֹן
  choice: kuanzia Baal-Gadi katika Bonde la Lebanoni
  rationale: Majina yametoholewa, na בִּקְעָה limetafsiriwa 'Bonde' kama eneo pana la chini.
- source_word: וְעַד הָהָר הֶחָלָק
  choice: hadi Mlima Halaki
  rationale: הָהָר הֶחָלָק inatumiwa hapa kama jina la eneo; kulitohowa kunazuia kulifanya kwa lazima kuwa maelezo ya 'mlima laini'.
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: unaoinuka kuelekea Seiri
  rationale: Inahifadhi taswira ya kupanda na mwelekeo wa Seiri bila kudai kwa lazima kwamba mlima huo unaishia Seiri.
- source_word: וַיִּתְּנָהּ יְהוֹשֻׁעַ
  choice: Yoshua akaipa nchi hiyo
  rationale: Kiambishi cha kike cha Kiebrania kinarejelea nchi; kutaja 'nchi hiyo' huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: יְרֻשָּׁה כְּמַחְלְקֹתָם
  choice: iwe urithi wao kulingana na mafungu yao
  rationale: '''Urithi'' huhifadhi lugha ya ugawaji wa nchi, na ''mafungu yao'' huonyesha sehemu zilizogawiwa makabila mbalimbali.'
