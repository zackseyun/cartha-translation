id: JOS.12.3
reference: Joshua 12:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: sw
  text: na Araba[a] hadi Bahari ya Kineroth upande wa mashariki, na hadi Bahari ya Araba, Bahari ya Chumvi,[b] upande wa mashariki kuelekea Beth-yeshimoth, na upande wa kusini,[c] chini ya miteremko ya Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwanda tambarare.” Hapa yaelekea kuwa jina la eneo maalumu la ufa wa Yordani, si uwanda wowote tu.
    reason: lexical_alternative
  - marker: b
    text: “Bahari ya Araba, Bahari ya Chumvi” ndiyo bahari iliyokuja kujulikana sana baadaye kama Bahari ya Kifo.
    reason: cultural_note
  - marker: c
    text: Au, “na kutoka kusini.” Kiebrania kinaweza kuonyesha upande wa kusini au mwendo kutoka huko.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Limetumiwa kama jina maalumu la eneo la ufa wa Yordani, badala ya kutafsiriwa kwa maana ya jumla kuwa ‘uwanda tambarare’.
- source_word: יָם כִּנְרוֹת
  choice: Bahari ya Kineroth
  rationale: Jina la mahali limeandikwa kwa kufuata sauti ya Kiebrania, huku ‘bahari’ likihifadhi matumizi ya יָם katika orodha hii ya mipaka.
- source_word: מִזְרָחָה
  choice: upande wa mashariki
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya mwelekeo au mahali upande wa mashariki katika maelezo ya mipaka.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: Bahari ya Araba, Bahari ya Chumvi
  rationale: Muundo wa majina mawili yanayoelezea sehemu ileile umehifadhiwa bila kuingiza jina la baadaye ‘Bahari ya Chumvi’ kama ‘Bahari ya Kifo’.
- source_word: דֶּרֶךְ
  choice: kuelekea
  rationale: Katika maelezo ya kijiografia neno hili linaonyesha njia au mwelekeo; ‘kuelekea’ ni wazi na la kawaida katika Kiswahili.
- source_word: בֵּית הַיְשִׁמוֹת
  choice: Beth-yeshimoth
  rationale: Jina la mahali limenukuliwa kwa sauti badala ya kutafsiriwa.
- source_word: וּמִתֵּימָן
  choice: na upande wa kusini
  rationale: Hii inafaa katika orodha ya mipaka na inaepuka kulazimisha maana ya mwendo, ingawa umbo la Kiebrania linaweza kueleweka pia ‘na kutoka kusini’.
- source_word: תַּחַת אַשְׁדּוֹת
  choice: chini ya miteremko
  rationale: Tafsiri hii ni ya kawaida na sahihi kwa maelezo ya mahali palipo chini ya sehemu zinazoteremka za mlima.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Limechukuliwa kuwa jina maalumu la mahali na kuandikwa kwa namna inayosomeka kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wenye heshima na ulio wazi. Muundo mfupi wa orodha ya mipaka umehifadhiwa, majina ya kale yamenukuliwa kwa sauti, na utata wa וּמִתֵּימָן umeonyeshwa katika tanbihi badala ya kuamuliwa kimya kimya.
