id: JOS.12.1
reference: Joshua 12:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: sw
  text: Hawa ndio wafalme wa nchi ambao Waisraeli[a] waliwashinda na kuitwaa nchi yao ng’ambo ya Yordani, upande wa mashariki[b], tangu Bonde la Arnoni[c] mpaka Mlima Hermoni, pamoja na Araba yote upande wa mashariki[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kuelekea kuchomoza kwa jua,” yaani, upande wa mashariki.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaonyesha bonde lenye mkondo wa maji, mara nyingi mkondo unaotiririka kwa majira; linaweza pia kutafsiriwa “bonde la kijito cha Arnoni.”
    reason: cultural_note
  - marker: d
    text: Au “tambarare.” Araba ni jina la kijiografia la eneo la bonde la ufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Inaanzisha orodha mpya huku ikiendeleza simulizi; kiunganishi cha Kiebrania kinaweza kuachwa bila kuongeza neno la wakati lisilokuwapo katika chanzo.
- source_word: מַלְכֵי הָאָרֶץ
  choice: wafalme wa nchi
  rationale: Inahifadhi muundo na maana pana ya eneo linalotajwa.
- source_word: אֲשֶׁר הִכּוּ
  choice: ambao ... waliwashinda
  rationale: Katika muktadha wa vita, נכה huonyesha kupigwa au kushindwa; ‘waliwashinda’ ni Kiswahili cha kawaida na hakilazimishi hitimisho kwamba kila mfalme aliuawa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ni namna ya asili na wazi katika Kiswahili ya kutaja watu wa Israeli; maana halisi ya nahau ya Kiebrania imeonyeshwa katika tanbihi.
- source_word: וַיִּרְשׁוּ אֶת אַרְצָם
  choice: na kuitwaa nchi yao
  rationale: ירשׁ katika simulizi la ushindi humaanisha kutwaa na kumiliki eneo, si kurithi tu.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרְחָה הַשָּׁמֶשׁ
  choice: ng’ambo ya Yordani, upande wa mashariki
  rationale: Kifungu kinabainisha upande wa mashariki wa Yordani; tafsiri ni ya kawaida huku taswira halisi ya kuchomoza kwa jua ikihifadhiwa katika tanbihi.
- source_word: מִנַּחַל אַרְנוֹן
  choice: tangu Bonde la Arnoni
  rationale: נחל linaweza kutaja bonde la mkondo wa maji unaotiririka kwa majira; ‘Bonde’ linaeleweka kwa urahisi, na maelezo ya kijiografia yametolewa katika tanbihi.
- source_word: עַד הַר חֶרְמוֹן
  choice: mpaka Mlima Hermoni
  rationale: Inaonyesha kikomo cha eneo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: וְכָל הָעֲרָבָה מִזְרָחָה
  choice: pamoja na Araba yote ya mashariki
  rationale: ‘Araba’ limehifadhiwa kama jina la eneo maalumu badala ya kulifanya tambarare yoyote kwa ujumla.
