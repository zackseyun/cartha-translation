base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: sw
  text: na akitawala Mlima Hermoni[a], Saleka, na Bashani yote, hadi mpaka wa Wageshuri na Wamaakathi, na nusu ya Gileadi hadi mpaka wa Sihoni, mfalme wa Heshboni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye alitawala Mlima Hermoni, Saleka, na Bashani yote.” Kiebrania kinatumia kitenzi kishirikishi kinachoendeleza maelezo kutoka mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: na aliyekuwa akitawala
  rationale: Kitenzi kishirikishi cha Kiebrania kinaendeleza maelezo ya Ogu kutoka mstari uliotangulia na kinaonyesha utawala wake juu ya maeneo hayo. Muundo huu wa Kiswahili huhifadhi uhusiano huo bila kuanzisha sentensi mpya huru.
- source_word: בְּהַר חֶרְמוֹן
  choice: Mlima Hermoni
  rationale: Baada ya ‘akitawala,’ kihusishi cha Kiebrania kinaonyesha eneo lililokuwa chini ya mamlaka yake; Kiswahili cha kawaida hakihitaji kurudia ‘juu ya.’
- source_word: וּבְסַלְכָה
  choice: Saleka
  rationale: Ni jina la mahali katika milki ya Ogu; umbo ‘Saleka’ linafuata matamshi yanayosomeka kwa urahisi katika Kiswahili.
- source_word: וּבְכָל הַבָּשָׁן
  choice: na Bashani yote
  rationale: Kirai hiki kinamaanisha eneo lote la Bashani lililokuwa chini ya utawala wake.
- source_word: עַד גְּבוּל
  choice: hadi mpaka wa
  rationale: Muundo huu unaonyesha kikomo cha kijiografia cha eneo.
- source_word: הַגְּשׁוּרִי
  choice: Wageshuri
  rationale: Ingawa umbo la Kiebrania ni la kivumishi cha kikabila katika umoja, muktadha unaelekeza kwa watu ambao mpaka wao unatajwa.
- source_word: וְהַמַּעֲכָתִי
  choice: na Wamaaka
  rationale: Jina la kikundi cha watu limetolewa kwa umbo la wingi la Kiswahili, sambamba na Wageshuri.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: pamoja na nusu ya Gileadi
  rationale: Kirai kinataja sehemu ya eneo la Gileadi iliyokuwa chini ya utawala huo; ‘pamoja na’ huunganisha kwa wazi sehemu hii na orodha ya maeneo.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: hadi mpaka wa Sihoni, mfalme wa Heshboni
  rationale: Kirai kinafafanua ukomo wa nusu hiyo ya Gileadi. Koma huonyesha kwamba ‘mfalme wa Heshboni’ ni maelezo ya Sihoni.
