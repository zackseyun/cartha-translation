  text: וְ/אַתָּ֗ה תְּצַוֶּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֥י אֲרֽוֹן הַ/בְּרִ֖ית לֵ/אמֹ֑ר כְּ/בֹאֲ/כֶ֗ם עַד קְצֵה֙ מֵ֣י הַ/יַּרְדֵּ֔ן בַּ/יַּרְדֵּ֖ן תַּעֲמֹֽדוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: sw
  text: Nawe utawaamuru makuhani wanaolibeba Sanduku la Agano, ukisema, “Mtakapofika kwenye ukingo wa maji ya Yordani[a], simameni ndani ya Yordani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pembezoni mwa maji ya Yordani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Nawe
  rationale: Inaendeleza simulizi huku ikimkazia Yoshua kama anayeelekezwa moja kwa moja.
- source_word: תְּצַוֶּה
  choice: utawaamuru
  rationale: Kitenzi cha Kiebrania kinaonyesha agizo ambalo Yoshua anatakiwa kuwapa makuhani; umbo la wakati ujao linafaa katika muktadha huu wa maagizo.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: makuhani wanaolibeba
  rationale: Kirai tegemezi ni cha kawaida katika Kiswahili na kinaonyesha wazi kwamba makuhani hao ndio wabebaji.
- source_word: אֲרוֹן הַבְּרִית
  choice: Sanduku la Agano
  rationale: Ni tafsiri iliyo wazi na ya kawaida ya mfuatano huu wa nomino, huku ikihifadhi maana ya agano.
- source_word: לֵאמֹר
  choice: ukisema
  rationale: Inahifadhi fomula ya Kiebrania inayotanguliza maneno ya agizo, bila kuifanya sentensi kuwa nzito.
- source_word: כְּבֹאֲכֶם
  choice: Mtakapofika
  rationale: Inaonyesha kwa kawaida uhusiano wa wakati uliomo katika kihusishi pamoja na kitenzi-jina cha Kiebrania.
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: kwenye ukingo wa maji ya Yordani
  rationale: Kְצֵה hapa hutaja sehemu ya mwisho au ukingo wa maji; ‘ukingo’ ni wazi na wa kawaida, huku tanbihi ikihifadhi uwezekano wa ‘pembezoni.’
- source_word: בַּיַּרְדֵּן
  choice: ndani ya Yordani
  rationale: Kihusishi kinaonyesha mahali; ‘ndani ya’ kinaweka wazi kwamba makuhani watasimama katika mto, si kando yake.
- source_word: תַּעֲמֹדוּ
  choice: simameni
  rationale: Amri ya Kiswahili inawasilisha kwa kawaida nguvu ya kielekezo ya kitenzi cha Kiebrania na maana ya kuchukua nafasi wakiwa wamesimama.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. ‘Nawe’ huhifadhi mkazo wa kiwakilishi cha Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, yaani ukingo wa maji ya Yordani.
