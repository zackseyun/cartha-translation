base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: sw
  text: Wakawaamuru watu, wakisema, “Mtakapoona sanduku la agano la Yahwe, Mungu wenu, na makuhani Walawi[a] wakilibeba, ndipo mtaondoka mahali mlipo na kulifuata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makuhani, Walawi.”
    reason: Muundo wa Kiebrania unaweza kusomwa kama “makuhani Walawi” au kama apposition, “makuhani, Walawi.”
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: Wakawaamuru
  rationale: Kitenzi hiki katika piel kina nguvu ya kutoa amri. “Wakawaamuru” ni cha kawaida na kinadumisha mamlaka ya agizo.
- source_word: כִּרְאוֹתְכֶם
  choice: Mtakapoona
  rationale: Muundo huu unaonyesha wakati. “Mtakapoona” ni Kiswahili cha asili bila kuongeza wazo la kwamba lazima iwe mara moja.
- source_word: אֲרוֹן בְּרִית
  choice: sanduku la agano
  rationale: Hili ndilo neno linalotambulika katika muktadha wa ibada na linaonyesha sanduku lililohusishwa na agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni namna ya kawaida ya Kiswahili ya kuandika jina la Mungu יהוה, na hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  rationale: Usemi huu unaeleweka kwa kawaida kuwa unawatambulisha makuhani kuwa Walawi, bila kudokeza makundi mawili tofauti.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: wakilichukua
  rationale: נשא hapa ni kubeba au kuchukua kitu. “Wakilichukua” ni ya asili katika sentensi hii na kiambishi “-li-” kinarejelea sanduku.
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: mtaondoka mahali mlipo
  rationale: נסע humaanisha kuanza safari au kuondoka. Tafsiri hii ni ya asili na haiongezi kwa lazima wazo la kufunja kambi.
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: na kulifuata
  rationale: הלך אחרי ina maana ya kwenda nyuma ya kitu, yaani kukifuata. “Kulifuata” ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. “Yahwe” hulihifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Maana ya הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  alternative: makuhani, yaani Walawi
  rationale: Tafsiri kuu inasomeka kwa urahisi na inaonyesha kwamba makuhani wanaotajwa ni Walawi. Tanbihi inadumisha uwezekano wa kusoma muundo wa Kiebrania kama usemi wa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri umewekwa katika wakati ujao (“mtaondoka”) ili kudumisha mpangilio wa masharti wa sentensi ya Kiebrania, huku “kulifuata” ikitoa maana ya mwendo kwa lugha ya kawaida.
