base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: sw
  text: Nao makuhani waliolibeba sanduku la agano la Yahweh[a] wakasimama imara[b] juu ya nchi kavu katikati ya Yordani, huku Israeli wote wakivuka juu ya nchi kavu, mpaka taifa lote[c] lilipomaliza kuvuka Yordani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanduku la Yahweh la agano.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasisitiza kwamba makuhani walisimama kwa uthabiti, bila kuondoka mahali pao katika mto.
    reason: lexical_alternative
  - marker: c
    text: Au, “watu wote.” Neno la Kiebrania lililotafsiriwa “taifa lote” ni la umoja na linawarejelea Waisraeli kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: wakasimama
  rationale: Kitenzi cha Kiebrania kinaonyesha kuchukua na kudumisha hali ya kusimama; ‘wakasimama’ ni simulizi la kawaida na la wazi kwa Kiswahili.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: makuhani waliolibeba
  rationale: Kirai cha kishirikishi kinaeleza tendo lao lililokuwa likiendelea; ‘waliolibeba’ ni Kiswahili cha sasa na cha asili.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Tafsiri hii inafuata kwa uwazi mfuatano wa maneno ya muundo tegemezi wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa na cheo.
- source_word: בֶּחָרָבָה
  choice: juu ya nchi kavu
  rationale: Neno linamaanisha ardhi kavu iliyofunuliwa baada ya maji kuondoka; kirai hiki kimetumiwa kwa namna ileile katika sehemu zote mbili za mstari.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: katikati ya Yordani
  rationale: בְּתוֹךְ huonyesha mahali ndani au katikati; tafsiri hii ni wazi na ya kawaida.
- source_word: הָכֵן
  choice: imara
  rationale: Katika muktadha huu kielezi kinasisitiza uthabiti wa makuhani walipobaki wamesimama katika mto.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: huku Israeli wote wakivuka
  rationale: Kishirikishi kinaonyesha tendo linaloendelea sambamba na kusimama kwa makuhani; ‘huku’ huonyesha usambamba huo kwa kawaida.
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: mpaka ... lilipomaliza
  rationale: Kirai kinaonyesha kikomo ambacho tendo la kuvuka lilifikia ukamilifu.
- source_word: כָּל הַגּוֹי
  choice: taifa lote
  rationale: גּוֹי ni nomino ya umoja yenye maana ya jamii nzima; ‘taifa lote’ huhifadhi umoja huo wa kijumla.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: kuvuka Yordani
  rationale: Muundo wa Kiswahili ‘kumaliza kuvuka’ hutoa kwa kawaida maana ya tendo lililokamilika.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja herufi nne za jina la Mungu; ‘Yahweh’ huhifadhi jina hilo badala ya kutumia cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa kawaida, marudio ya ‘juu ya nchi kavu’ yamehifadhiwa, na jina ‘Yahweh’ limetumiwa kama jina binafsi.
