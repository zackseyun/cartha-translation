  source_fidelity: 'Maana ya msingi imehifadhiwa vizuri: umbali unaotakiwa, dhiraa elfu mbili kwa kipimo, katazo la kukaribia, kusudi la kujua njia, na nahau ya kutokuwa wamepitia njia hiyo hapo awali. Hata hivyo, usemi wa mwisho una marudio ya maana ya wakati (''hamjawahi'' pamoja na ''hapo awali'') na unaweza kufanywa wa karibu zaidi na muundo wa Kiebrania wa ''hamjapita ... hapo awali.'''
