base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: sw
  text: Lakini kuwe na umbali kati yenu na hilo, kama dhiraa elfu mbili kwa kipimo.[a] Msilikaribie, ili mpate kujua njia mtakayopitia, kwa maana hamjapita njia hii hapo awali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dhiraa ilikuwa kipimo cha kawaida cha urefu katika nyakati za kale, takriban urefu wa mkono kutoka kwenye kiwiko hadi ncha ya kidole.
    reason: cultural_note
  - marker: b
    text: Kwa halisi, “tangu jana na juzi,” nahau yenye maana ya “hapo awali” au “kabla ya sasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Neno hili linaweka mpaka au tofauti na agizo lililotangulia; “Lakini” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: kuwe na umbali kati yenu na hilo
  rationale: Huhifadhi muundo wa Kiebrania unaoeleza kuwepo kwa nafasi ya utengano bila kuugeuza moja kwa moja kuwa amri kali. “Hilo” linarejelea sanduku la agano.
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: kama dhiraa elfu mbili kwa kipimo
  rationale: “Kama” huonyesha ukadiriaji wa kiambishi כְּ, “dhiraa” huhifadhi kipimo cha ulimwengu wa kale, na “kwa kipimo” huwakilisha בַּמִּדָּה.
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: Msilikaribie
  rationale: Ni katazo la moja kwa moja na la kawaida kwa Kiswahili, likirejelea sanduku la agano.
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: ili mpate kujua
  rationale: Huonyesha kusudi bila kuongeza maana isiyokuwapo katika chanzo.
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: njia mtakayopita
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi maana ya njia watakayosafiria, bila kuongeza ulazima ambao haujaelezwa wazi.
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: kwa maana hamjawahi kuipitia njia hii
  rationale: Huonyesha kuwa hawakuwa wamepita katika njia hiyo kabla; “njia hii” hufanya rejeleo la mahali liwe wazi kwa Kiswahili.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: hapo awali
  rationale: Ni tafsiri ya maana ya nahau inayosema kwa halisi “tangu jana na juzi,” yaani wakati uliopita au kabla ya sasa.
