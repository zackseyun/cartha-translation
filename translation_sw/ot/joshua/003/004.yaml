translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kuwe na umbali” huhifadhi namna chanzo kinavyoeleza utengano, huku “Msilikaribie” likitoa katazo wazi. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa: [a] kwa dhiraa na [b] kwa nahau ya wakati.'
