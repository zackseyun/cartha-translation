id: JOS.3.7
reference: Joshua 3:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: sw
  text: Yahwe akamwambia Yoshua, “Leo nitaanza kukufanya mkuu mbele ya Israeli wote, ili wajue kwamba kama nilivyokuwa pamoja na Musa, ndivyo nitakavyokuwa pamoja nawe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, kwa umbo la kawaida la Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wa Kiebrania umetafsiriwa kwa kitenzi cha kawaida cha Kiswahili kinachoonyesha Yahwe alisema maneno kwa Yoshua.
- source_word: הַיּוֹם הַזֶּה
  choice: Leo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kirai chenye maana ya ‘siku hii.’
- source_word: אָחֵל
  choice: nitaanza
  rationale: Huwasilisha maana ya kuanzisha tendo na mwelekeo wake wa wakati ujao katika tamko hili.
- source_word: גַּדֶּלְךָ
  choice: kukufanya mkuu
  rationale: Huhifadhi wazo la kuinua hadhi ya Yoshua hadharani bila kudokeza kwamba tayari alikuwa mkuu kwa maana hiyo.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: mbele ya Israeli wote
  rationale: Ni Kiswahili cha asili kinachowasilisha maana ya kuonekana na kutambuliwa na taifa lote.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: ili wajue
  rationale: Huonyesha kusudi au matokeo yaliyokusudiwa kwa njia ya kawaida katika Kiswahili.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: kama nilivyokuwa pamoja na Musa
  rationale: Huhifadhi ulinganisho wa wazi kati ya uwepo wa Mungu pamoja na Musa na pamoja na Yoshua.
- source_word: אֶהְיֶה עִמָּךְ
  choice: ndivyo nitakavyokuwa pamoja nawe
  rationale: Huonyesha ahadi ya wakati ujao na kukamilisha kwa uwazi muundo wa ulinganisho katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi jina hilo kwa mwandiko unaofaa Kiswahili bila kulibadilisha kuwa ‘BWANA.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘kama ... ndivyo ...’ umetumiwa ili ulinganisho wa Kiebrania uwe wazi na wa asili.
