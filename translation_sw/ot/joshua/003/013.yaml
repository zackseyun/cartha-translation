id: JOS.3.13
reference: Joshua 3:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: sw
  text: Na itakuwa kwamba, mara tu nyayo za makuhani wanaolibeba sanduku la Yahweh[a], Bwana wa dunia yote, zitakapotua katika maji ya Yordani, maji ya Yordani yatakatwa—maji yanayoshuka kutoka juu[b]—na yatasimama yakiwa lundo moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanduku la Bwana wa dunia yote.” Kiebrania kinaweza kusomwa kwa kuunganisha kwa karibu maneno “Bwana wa dunia yote” na “sanduku,” ingawa matini kuu inayachukua kuwa cheo kinachomtambulisha Yahweh.
    reason: alternative_reading
  - marker: b
    text: Au, “maji yanayoshuka kutoka upande wa juu wa mto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Na itakuwa
  rationale: Inahifadhi fomula ya utabiri ya Kiebrania huku ikiunganisha sentensi kiasili na yaliyotangulia.
- source_word: כְּנוֹחַ
  choice: mara ... zitakapotua
  rationale: Kiambishi כְּ pamoja na נוח kina maana ya wakati, ‘mara/zinapotua’; ‘kutua’ huonyesha nyayo kufika na kubaki mahali.
- source_word: כַּפּוֹת רַגְלֵי
  choice: nyayo
  rationale: כַּף katika usemi huu ni sehemu za chini za miguu; ‘nyayo’ ni sahihi na ya kawaida katika Kiswahili.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: makuhani wanaolibeba sanduku
  rationale: Kirai cha kushiriki נֹשְׂאֵי kinaeleza makuhani kuwa wabebaji wa sanduku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: Bwana wa dunia yote
  rationale: אֲדוֹן ni cheo cha mamlaka; ‘Bwana wa dunia yote’ ni lugha ya heshima na huacha cheo hicho kikimtambulisha Yahweh.
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: katika maji ya Yordani
  rationale: בְּ hapa huonyesha kugusa na kutua ndani ya maji ya mto.
- source_word: יִכָּרֵתוּן
  choice: yatakatiliwa mbali
  rationale: Nifali ya כרת huonyesha maji kukatiliwa au kuzuiwa; usemi huu huhifadhi picha yenye nguvu ya chanzo.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: maji yanayotiririka kutoka upande wa juu
  rationale: Huhifadhi wazo halisi la maji kushuka kutoka juu bila kuamua kimya kimya kwamba maana pekee ni ‘kutoka upande wa juu wa mto.’
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: nayo yatasimama kama lundo moja
  rationale: נֵד ni fungu au lundo lililokusanyika; ‘kama lundo moja’ huwasilisha picha ya maji yaliyosimama yakiwa fungu moja.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kina jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Uhusiano wa ‘Bwana wa dunia yote’ na maneno yaliyotangulia
  choice: 'Cheo cha nyongeza kinachomtambulisha Yahweh: ‘sanduku la Yahweh, Bwana wa dunia yote’'
  alternative: ‘sanduku la Bwana wa dunia yote’
  rationale: Mpangilio wa Kiebrania unaruhusu miundo yote miwili. Matini kuu inachukua maneno hayo kuwa cheo cha Yahweh, huku tanbihi ikihifadhi usomaji mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nyayo,’ ‘kutua,’ na ‘lundo moja’ huhifadhi picha halisi za Kiebrania; tanbihi huhifadhi utata wa kisintaksia na maana ya kimuktadha ya מִלְמָעְלָה.
