  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: sw
  text: Yoshua akawaambia wana wa Israeli[a], “Njooni hapa, msikie maneno ya Yahwe, Mungu wenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Katika simulizi, kitenzi hiki kinatanguliza maneno ya moja kwa moja. ‘Akawaambia’ ni Kiswahili cha kawaida na pia huonyesha wazi kwamba Yoshua aliwaelekea watu hao.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo halisi wa Kiebrania, ‘wana wa Israeli,’ bila kuficha kwamba ni jina la kawaida la taifa zima; mbadala wa kawaida zaidi ni ‘Waisraeli.’
- source_word: גֹּשׁוּ הֵנָּה
  choice: Njooni hapa
  rationale: Amri ya wingi inawaita wasogee mahali alipo msemaji; tafsiri hii ni ya kawaida na huhifadhi mwelekeo wa הֵנָּה.
- source_word: וְשִׁמְעוּ
  choice: msikie
  rationale: Huhifadhi maana ya msingi ya ‘kusikia,’ huku muktadha ukidokeza kusikiliza kwa makini.
- source_word: אֶת דִּבְרֵי
  choice: maneno ya
  rationale: Ni tafsiri ya moja kwa moja ya kishazi cha Kiebrania; ‘ujumbe wa’ ungeongeza ufafanuzi usiotajwa wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hutumia jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, katika umbo la Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa umbo la neno la Kiebrania ni la wingi kimaumbo, hapa linamtaja Mungu wa Israeli mmoja na kiambishi kinaonyesha ‘wenu.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la agano lenyewe. ‘Yahwe’ hulihifadhi kama jina binafsi katika umbo linalofaa Kiswahili, badala ya kuweka cheo mahali pake.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watoto wa Israeli
  rationale: Tafsiri hii inadumisha usemi wa Kiebrania na jinsia yake ya kisarufi. Kwa kuwa usemi huo ni jina la kikabila linaloweza kulihusu taifa zima, tanbihi inatoa tafsiri ya kawaida ya ‘Waisraeli’ bila kulazimisha maana finyu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Njooni hapa’ ni amri ya kawaida na wazi; ‘msikie’ inadumisha ukaribu na Kiebrania huku ikieleweka kuwa wito wa kusikiliza kwa makini. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
