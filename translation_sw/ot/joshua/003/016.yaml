base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: sw
  text: Maji yaliyokuwa yakitiririka kutoka upande wa juu yakasimama[a]; yakainuka na kuwa lundo moja mbali sana, huko Adamu, mji ulio kando ya Sarethani. Nayo maji yaliyokuwa yakitiririka kuelekea Bahari ya Araba, Bahari ya Chumvi[b], yakakatika kabisa. Kisha watu wakavuka mkabala na Yeriko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yakasimama yakiwa lundo moja.” Taswira ya Kiebrania inasisitiza maji kujikusanya pamoja na kuwa kizuizi kimoja kilichoinuka.
    reason: lexical_alternative
  - marker: b
    text: “Bahari ya Chumvi” ndiyo bahari inayojulikana pia kama Bahari Mfu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: yakasimama
  rationale: Kitenzi עמד kinaonyesha maji yaliacha mtiririko wake, huku tafsiri hii ikihifadhi taswira halisi ya ‘kusimama’.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: maji yaliyokuwa yakitiririka kutoka upande wa juu
  rationale: Kirai kinaelekeza kwenye maji yaliyoshuka kutoka sehemu ya juu ya mto; ‘upande wa juu’ ni wazi bila kuongeza neno lisilokuwamo moja kwa moja kama ‘mto’.
- source_word: קָמוּ נֵד אֶחָד
  choice: yakainuka na kuwa lundo moja
  rationale: Huhifadhi taswira ya maji kujikusanya yakiwa kizuizi kimoja kilichoinuka.
- source_word: הַרְחֵק מְאֹד
  choice: mbali sana
  rationale: Huwasilisha mkazo wa Kiebrania juu ya umbali mkubwa kwa Kiswahili cha kawaida.
- source_word: בְאָדָם
  choice: huko Adamu
  rationale: Adamu hapa ni jina la mahali, si nomino ya kawaida inayomaanisha mwanadamu.
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: mji ulio kando ya Sarethani
  rationale: מִצַּד huonyesha ukaribu au kuwa pembeni mwa mahali fulani.
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: Nayo maji yaliyokuwa yakitiririka kuelekea Bahari ya Araba
  rationale: Nomino ‘maji’ imerudiwa kwa uwazi wa Kiswahili, na עַל imetolewa kwa maana ya mwelekeo kuelekea baharini.
- source_word: יָם הַמֶּלַח
  choice: Bahari ya Chumvi
  rationale: Ni tafsiri ya moja kwa moja ya jina la Kiebrania; jina linalotumiwa zaidi baadaye linaelezwa katika tanbihi.
- source_word: תַּמּוּ נִכְרָתוּ
  choice: yakakatika kabisa
  rationale: Jozi ya vitenzi inasisitiza kukoma kamili kwa maji yaliyokuwa yakielekea chini.
- source_word: וְהָעָם עָבְרוּ
  choice: Kisha watu wakavuka
  rationale: עבר katika muktadha huu ni kuvuka mto; ‘kisha’ huunganisha kwa kawaida matokeo ya kukatika kwa maji na tendo la watu bila kubadili mpangilio wa simulizi.
- source_word: נֶגֶד יְרִיחוֹ
  choice: mkabala na Yeriko
  rationale: נֶגֶד huonyesha mahali palipoelekeana na Yeriko.
