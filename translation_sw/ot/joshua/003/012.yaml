lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha mpito wa hotuba kuelekea agizo linalofuata; “Basi sasa” ni ya asili katika Kiswahili na huhifadhi uhusiano wa mfululizo unaoonyeshwa na וְ.
- source_word: קְחוּ לָכֶם
  choice: chukueni kwa ajili yenu
  rationale: Kitenzi cha amri cha לקח pamoja na לָכֶם kina maana ya kuchukua au kuteua kwa kusudi lao; tafsiri hii huhifadhi agizo na maana ya dativu bila kuamua wazi kuwa ni “teueni.”
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: wanaume kumi na wawili
  rationale: אִישׁ katika muktadha huu inawahusu wawakilishi wa kiume, hivyo “wanaume” ni sahihi na wazi.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: kutoka katika makabila ya Israeli
  rationale: Huwasilisha wazi asili au kundi ambamo wanaume hao wanatakiwa kuchukuliwa.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: mwanamume mmoja kutoka kila kabila
  rationale: Urudiaji wa Kiebrania ni usemi wa ugawaji unaomaanisha mwakilishi mmoja kwa kila kabila; Kiswahili hiki ni cha kawaida na huhifadhi maana hiyo.
