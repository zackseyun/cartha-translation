base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: sw
  text: Tazama, sanduku la agano la Bwana wa dunia yote linavuka mbele yenu katika Mto Yordani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “linaingia katika Mto Yordani mbele yenu.” Kihusishi cha Kiebrania kinaweza kutafsiriwa “katika”; hata hivyo, katika muktadha huu tendo la kuvuka linaweza pia kueleweka kuwa linasisitiza kuingia mtoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu. “Tazama” linaendeleza msisitizo na uhai wa kauli ya Kiebrania kwa lugha yenye heshima na inayoeleweka.
- source_word: אֲרוֹן הַבְּרִית
  choice: sanduku la agano
  rationale: 'Huu ndio uhusiano wa kawaida wa maneno haya: sanduku linalohusishwa na agano. “Sanduku la agano” ni tafsiri ya wazi na ya kawaida katika Kiswahili cha Biblia.'
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: Bwana wa dunia yote
  rationale: אֲדוֹן ni cheo cha mamlaka na enzi. “Bwana” huhifadhi uzito wa cheo hicho bila kuongeza dai la kimafundisho lisilosemwa na matini.
- source_word: עֹבֵר
  choice: linavuka
  rationale: Kitenzi-jina cha Kiebrania kinaonyesha tendo linaloendelea au lililo karibu kutendeka. Katika muktadha wa kuvuka mto, “linavuka” ni cha asili na chenye uhai.
- source_word: לִפְנֵיכֶם
  choice: mbele yenu
  rationale: Kirai hiki kinaonyesha kwamba sanduku linatangulia watu katika mwendo wao. “Mbele yenu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בַּיַּרְדֵּן
  choice: katika Mto Yordani
  rationale: Kihusishi בְּ kwa umbo lake la kawaida humaanisha “katika,” na hapa kinaambatana na tendo la kuvuka. Neno “Mto” linaweka wazi kwa msomaji wa kisasa kwamba Yordani ni mto.
theological_decisions:
- issue: Uhusiano wa אֲדוֹן כָּל הָאָרֶץ na אֲרוֹן הַבְּרִית
  choice: sanduku la agano la Bwana wa dunia yote
  alternative: sanduku la agano—Bwana wa dunia yote—
  rationale: Muundo huu unaeleweka kwa asili kuwa sanduku la agano linalomhusu Bwana wa dunia yote, kama inavyothibitishwa pia na muktadha wa Yoshua 3:13. Hivyo unaepuka kauli isiyo ya kawaida kwamba sanduku lenyewe ni “Bwana,” huku ukiendeleza cheo cha enzi ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisasa, wenye heshima na unaofaa kusomwa hadharani. “Tazama” huhifadhi sauti ya kuvuta usikivu, na “Mto Yordani” husaidia uwazi bila kubadili maana.
