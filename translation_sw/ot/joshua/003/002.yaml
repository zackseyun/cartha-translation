  text: And at the end of three days[a], the officers went through the midst of the camp.
translation:
  language: sw
  text: Ikawa, siku tatu zilipokwisha, maafisa wakapita katikati ya kambi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kiunganishi cha usimulizi kinachoanzisha tukio linalofuata; “Ikawa” huhifadhi mtiririko wa simulizi bila kutumia lugha nzito au ya kizamani kupita kiasi.
- source_word: מִקְצֵה
  choice: mwishoni mwa
  rationale: Muundo huu unaonyesha mpaka wa wakati, yaani kufikia mwisho wa kipindi kilichotajwa, kwa Kiswahili cha kawaida na sahihi.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: siku tatu
  rationale: Ni tafsiri ya moja kwa moja ya usemi wa muda.
- source_word: וַיַּעַבְרוּ
  choice: wakapita
  rationale: Kitenzi kina maana ya kupita au kwenda kupitia mahali; hapa kinataja mwendo wa maafisa ndani ya kambi, si kuvuka mto au mpaka.
- source_word: הַשֹּׁטְרִים
  choice: maafisa
  rationale: Katika muktadha huu ni watu waliowekwa rasmi kutoa na kusimamia maagizo kambini; “maafisa” ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: בְּקֶרֶב
  choice: ndani ya
  rationale: Kimsingi humaanisha katikati au sehemu ya ndani. Pamoja na kitenzi cha mwendo, “ndani ya” huonyesha kwamba walipita kupitia sehemu ya ndani ya kambi; tanbihi inadumisha taswira mahsusi zaidi ya “katikati.”
- source_word: הַמַּחֲנֶה
  choice: kambi
  rationale: Ni neno la kawaida na la asili kwa eneo ambalo Waisraeli walikuwa wamepiga kambi.
