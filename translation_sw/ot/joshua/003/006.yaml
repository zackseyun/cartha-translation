base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: sw
  text: Kisha Yoshua akawaambia makuhani, “Lichukueni Sanduku la Agano, mkavuke mbele ya watu.” Basi wakalichukua Sanduku la Agano, wakaenda mbele ya watu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi. “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, na “akawaambia” inafaa kwa usemi unaowaelekea makuhani wengi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili, likiandikwa kwa namna inayosomeka kwa wasemaji wa Kiswahili.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye maana ya watumishi wa kikuhani wa Israeli.
- source_word: שְׂאוּ
  choice: Lichukueni
  rationale: Katika muktadha huu נשא humaanisha kuinua na kubeba Sanduku. “Lichukueni” ni ya kawaida na inajumuisha kulichukua ili kulibeba, bila kuongeza maelezo yasiyosemwa.
- source_word: אֲרוֹן הַבְּרִית
  choice: Sanduku la Agano
  rationale: Ni istilahi ya kawaida, wazi na yenye heshima kwa sanduku takatifu linalohusishwa na agano; muundo wa Kiswahili unawakilisha vizuri neno ambatani la Kiebrania.
- source_word: וְעִבְרוּ
  choice: mkavuke
  rationale: עבר hapa ni kuvuka, hasa kwa kuzingatia muktadha wa kuvuka Yordani. Kiambishi “-ka-” kinaunganisha kwa kawaida kuchukua Sanduku na tendo linalofuata.
- source_word: לִפְנֵי הָעָם
  choice: mbele ya watu
  rationale: Tafsiri hii huhifadhi maana ya mahali, yaani kuwa upande wa mbele wa watu, bila kufafanua zaidi ya Kiebrania.
- source_word: וַיִּשְׂאוּ
  choice: wakalichukua
  rationale: Inarudia kitenzi kilichotumiwa katika amri na hivyo kudumisha ulinganifu wa kileksika kati ya agizo na utiifu.
- source_word: וַיֵּלְכוּ
  choice: wakaenda
  rationale: הלך ni kitenzi cha kawaida cha kwenda au kutembea. “Wakaenda” ni simulizi asilia la Kiswahili na haliongezi namna maalumu ya mwendo.
theological_decisions:
- issue: Uwasilishaji wa istilahi ya agano katika mazingira ya ibada
  choice: Sanduku la Agano
  alternative: sanduku la agano / Sanduku la agano
  rationale: Usemi huu unaonyesha sanduku takatifu linalohusishwa na agano bila kuingiza ufafanuzi wa kiteolojia usiotajwa. Herufi kubwa zinatumika kama namna ya kawaida ya kulitaja kifaa hiki maalumu, si kuongeza maana nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, cha heshima na kinachoeleweka kwa urahisi. Muundo wa simulizi wenye “Kisha,” “Basi,” na viambishi vya mfululizo “-ka-” huleta mtiririko wa kawaida huku ukihifadhi mpangilio na urudiaji wa maandishi ya Kiebrania.
