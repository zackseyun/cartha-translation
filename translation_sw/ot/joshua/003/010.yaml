  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: sw
  text: Yoshua akasema, “Kwa jambo hili mtajua kwamba Mungu aliye hai yuko miongoni mwenu, na kwamba bila shaka atawafukuza[a] kutoka mbele yenu Wakanaani, Wahiti, Wahivi, Waperizi, Wagirgashi, Waamori na Wayebusi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawanyang’anya milki yao.” Kitenzi cha Kiebrania kinasisitiza kwamba wataondolewa nchini kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ka- ya masimulizi inaendeleza mtiririko wa matukio kwa Kiswahili cha kawaida bila kusisitiza mpangilio wa wakati kuliko Kiebrania.
- source_word: בְּזֹאת
  choice: Kwa jambo hili
  rationale: Inaonyesha jambo au ishara ambayo kupitia kwayo watu watatambua kuwapo na kutenda kwa Mungu; usemi huu ni wazi na wa kawaida kwa Kiswahili.
- source_word: תֵּדְעוּן
  choice: mtajua
  rationale: Kitenzi hiki cha nafsi ya pili wingi kina maana ya wakati ujao katika muktadha huu.
- source_word: אֵל חַי
  choice: Mungu aliye hai
  rationale: Huhifadhi dai la moja kwa moja la Kiebrania kuhusu Mungu mwenye uhai, bila kuingiza jina la agano ambalo halipo katika mstari huu.
- source_word: בְּקִרְבְּכֶם
  choice: yuko miongoni mwenu
  rationale: Hueleza kuwapo kwa Mungu katikati ya jumuiya, si kukaa ndani ya kila mtu mmoja mmoja.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: bila shaka atawafukuza
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo unasisitiza uhakika wa kuondolewa kwa watu hao. ‘Bila shaka’ huwasilisha msisitizo huo kwa Kiswahili cha sasa.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Huhifadhi taswira ya watu hao kuondolewa kutoka mbele ya Israeli katika njia yao.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: Wakanaani ... Wayebusi
  rationale: Majina ya umoja yenye maana ya jamii yametafsiriwa kwa ngeli ya watu katika wingi, kama ilivyo kawaida katika Kiswahili.
theological_decisions:
- issue: Kutafsiri אֵל חַי bila kuingiza jina יהוה
  choice: Mungu aliye hai
  alternative: Mwenye nguvu aliye hai
  rationale: Neno lililoandikwa ni אֵל, si jina יהוה. ‘Mungu aliye hai’ ndilo tamko la kawaida na sahihi katika muktadha huu, huku likihifadhi msisitizo wa uhai na kuwapo kwake.
- issue: Kuhifadhi uzito wa kitenzi cha kuwaondoa wenyeji wa nchi
  choice: bila shaka atawafukuza
  alternative: bila shaka atawanyang’anya milki yao
  rationale: Kiebrania kinasisitiza kuondolewa kwa hakika. ‘Atawafukuza’ ni cha asili na cha moja kwa moja, bila kupunguza nguvu ya tendo wala kuongeza maelezo ya kitheolojia yasiyosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Majina ya makabila yametumia maumbo yaliyozoeleka katika tafsiri za Biblia za Kiswahili. Alama ya tanbihi imewekwa moja kwa moja baada ya kitenzi kinachofafanuliwa.
