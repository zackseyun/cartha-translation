  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: ishara itawafanya Waisraeli wajue kwamba Mungu aliye hai yuko katikati yao na atawaondoa kwa hakika makundi yaliyotajwa. Orodha ya majina na msisitizo wa וְהוֹרֵשׁ יוֹרִישׁ vimehifadhiwa.'
