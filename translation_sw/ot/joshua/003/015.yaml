base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: sw
  text: Wakati wale waliolibeba sanduku walipofika Mto Yordani, na miguu ya makuhani waliolibeba sanduku ikachovywa kwenye ukingo wa maji[a]—wakati huo Yordani ulikuwa umejaa kupita kingo zake zote wakati wote wa mavuno[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya ukingo wa maji.” Kiebrania kinasema kihalisi “ndani ya ukingo/mwisho wa maji,” kikionyesha kwamba miguu ya makuhani iliingia majini pembezoni mwa mto.
    reason: lexical_alternative
  - marker: b
    text: Yaani, wakati wa mavuno Mto Yordani ulikuwa katika kiwango cha mafuriko.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְבוֹא
  choice: Ikawa ... walipofika
  rationale: Muundo huu unaonyesha tukio linalofuata na kishazi cha wakati, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: wale waliolibeba sanduku
  rationale: Kirai cha Kiebrania ni kivumishi-tendo kinachowataja watu waliokuwa wakilibeba sanduku; tafsiri hii ni wazi na ya asili.
- source_word: עַד הַיַּרְדֵּן
  choice: walipofika Yordani
  rationale: עַד inaonyesha mwendo uliofikia mahali fulani; hapa maana ya kawaida ni kufika mtoni.
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: na miguu ya makuhani
  rationale: Inafuata msisitizo wa mnyororo wa umilikaji wa Kiebrania badala ya kuufupisha.
- source_word: נִטְבְּלוּ
  choice: ikachovya
  rationale: Mzizi טבל una maana ya kuchovya au kutumbukiza. Katika muktadha huu miguu iliingia majini, si kugusa tu.
- source_word: בִּקְצֵה הַמָּיִם
  choice: ndani ya ukingo wa maji
  rationale: Tafsiri hii inadumisha wazo la miguu kuingia katika sehemu ya maji iliyo pembezoni, huku tanbihi ikieleza usemi huo.
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: wakati huo Yordani ulikuwa umejaa na kufurika kingo zake zote
  rationale: Kishazi ni maelezo ya mazingira. 'Kufurika' huweka wazi taswira inayotokana na mto kujaa juu ya kingo zake zote.
- source_word: כֹּל יְמֵי קָצִיר
  choice: wakati wote wa mavuno
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kipindi chote cha mavuno.
