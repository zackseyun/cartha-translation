lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kauli ya kawaida ya masimulizi inayoanzisha tukio jipya, bila kutumia lugha ya kizamani kupita kiasi.
- source_word: בִּנְסֹעַ הָעָם
  choice: watu walipoondoka
  rationale: Muundo huu unaonyesha wakati ambapo watu walianza safari yao; ‘walipoondoka’ ni wa asili na unaeleweka katika muktadha wa kuvunja kambi.
- source_word: מֵאָהֳלֵיהֶם
  choice: mahemani mwao
  rationale: Neno אהל humaanisha hema; usemi huu wa Kiswahili unaonyesha kwamba waliondoka kutoka mahali pa mahema yao.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: ili kuvuka Yordani
  rationale: Kitenzi kisicho na kikomo kinaonyesha kusudi, na ‘kuvuka’ ndilo neno la kawaida kwa kuvuka mto.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: na makuhani waliolibeba
  rationale: Hufuata kwa karibu muundo wa Kiebrania unaowatambulisha makuhani kuwa wabebaji, huku kiambishi ‘-li-’ kikirejelea sanduku.
- source_word: הָאָרוֹן הַבְּרִית
  choice: sanduku la agano
  rationale: ‘Sanduku’ ni tafsiri iliyo wazi ya chombo hiki kitakatifu, na ‘agano’ huhifadhi maana ya kitheolojia na kisimulizi ya ברית.
- source_word: לִפְנֵי הָעָם
  choice: mbele ya watu
  rationale: Huhifadhi maana ya mahali ya makuhani kuwa upande wa mbele wa msafara; uwezekano wa ‘wakitangulia watu’ umetolewa katika tanbihi.
