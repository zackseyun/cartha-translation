  text: וַ/יֹּ֧אמֶר יְהוֹשֻׁ֛עַ אֶל הָ/עָ֖ם הִתְקַדָּ֑שׁוּ כִּ֣י מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה בְּ/קִרְבְּ/כֶ֖ם נִפְלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: sw
  text: Ndipo Yoshua akawaambia watu, “Jitakaseni, kwa sababu kesho BWANA atafanya maajabu miongoni mwenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: Jitakaseni
  rationale: Amri hii ya kujirejelea inaonyesha watu kujiweka wakfu na kujiandaa kwa ajili ya tendo takatifu la Mungu; “jitakaseni” ni fupi, ya kawaida katika lugha ya Biblia, na hudumisha maana pana ya Kiebrania.
- source_word: כִּי
  choice: kwa sababu
  rationale: 'Hapa kiunganishi kinatoa sababu ya amri: watu wajitakase kwa kuwa BWANA atatenda maajabu kesho.'
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya tafsiri za Kiswahili ya kuwakilisha jina la agano YHWH kwa “BWANA” kwa herufi kubwa.
- source_word: נִפְלָאוֹת
  choice: maajabu
  rationale: Neno hili humaanisha matendo ya ajabu yanayopita uwezo wa kawaida; “maajabu” ni la asili na linafaa katika muktadha huu.
- source_word: בְּקִרְבְּכֶם
  choice: miongoni mwenu
  rationale: Hutoa maana ya BWANA kutenda katikati ya jumuiya ya Israeli, bila kudokeza tu tendo la ndani ya nafsi zao.
theological_decisions:
- issue: Maana ya kujitakasa
  choice: Jitakaseni
  alternative: Jiwekeni wakfu
  rationale: “Jitakaseni” huhifadhi upeo wa neno la Kiebrania bila kubainisha taratibu fulani ambazo mstari wenyewe hauzitaji.
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni namna inayotambulika sana katika Biblia za Kiswahili na inalingana na safu ya mashauriano ya POB, huku herufi kubwa zikionyesha kuwa chanzo kina jina la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ni wa moja kwa moja na hudumisha mfuatano, sababu, na ahadi ya maandishi ya Kiebrania.
