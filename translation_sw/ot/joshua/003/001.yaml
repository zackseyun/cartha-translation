  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֩ יְהוֹשֻׁ֨עַ בַּ/בֹּ֜קֶר וַ/יִּסְע֣וּ מֵֽ/הַ/שִּׁטִּ֗ים וַ/יָּבֹ֨אוּ֙ עַד הַ/יַּרְדֵּ֔ן ה֖וּא וְ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּלִ֥נוּ שָׁ֖ם טֶ֥רֶם יַעֲבֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: sw
  text: Yoshua akaamka mapema asubuhi; yeye na wana wote wa Israeli wakaondoka Shitimu, wakafika Yordani, wakalala huko kabla ya kuvuka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Waisraeli wote.” Kiebrania: “wana wote wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: akaamka asubuhi na mapema
  rationale: Hiphil ya שׁכם pamoja na בַּבֹּקֶר inaonyesha kuamka mapema wakati wa asubuhi. Usemi huu ni wa kawaida na wa wazi katika Kiswahili cha sasa.
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Katika simulizi la safari, נסע mara nyingi humaanisha kuondoka kambini na kuanza safari. “Wakaondoka” ni kifupi, cha kawaida, na kinaendeleza mwendo wa simulizi.
- source_word: מֵהַשִּׁטִּים
  choice: Shitimu
  rationale: Jina hili la mahali limetoholewa badala ya kutafsiriwa kuwa mahali pa mikunga, kwa kuwa hapa linatumika kama toponimu.
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: na kufika Yordani
  rationale: Muundo huu unaonyesha kufika hadi kwenye Yordani. “Kufika Yordani” ni Kiswahili cha kawaida na kinawakilisha kikomo cha safari.
- source_word: הוּא וְכָל בְּנֵי יִשְׂרָאֵל
  choice: yeye pamoja na wana wote wa Israeli
  rationale: Kiwakilishi הוּא kinamrejelea Yoshua kwa msisitizo, naye ametajwa wazi. “Wana wa Israeli” huhifadhi umbo la ukoo lililo katika Kiebrania, huku mbadala wa kawaida zaidi ukiwekwa katika tanbihi.
- source_word: וַיָּלִנוּ
  choice: wakakaa huko usiku
  rationale: לון hapa humaanisha kukaa mahali usiku. Usemi huu ni wazi na wa asili katika Kiswahili.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: kabla ya kuvuka
  rationale: טֶרֶם huonyesha jambo ambalo halikuwa limetokea bado, na עבר katika muktadha huu ni kuvuka mto. Kiswahili hakihitaji kurudia kiwakilishi cha mtenda hapa.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  alternative: Waisraeli wote
  rationale: Hakuna fundisho linalobishaniwa hapa, lakini tafsiri kuu inahifadhi taswira ya ukoo na umbo la Kiebrania. Tanbihi inatoa namna ya kawaida zaidi ya kulitaja taifa lote bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili iwe rahisi kusomeka bila kupoteza mfululizo wa simulizi la Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
