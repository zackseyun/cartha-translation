base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: sw
  text: Kisha mpaka ukageuka kutoka Saridi kuelekea mashariki[a], upande wa maawio ya jua, hadi mpaka wa Kisiloth-tabori; ukaendelea hadi Daberathi, kisha ukapanda hadi Yafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea mashariki, upande wa mashariki”; neno kwa neno, “kuelekea mashariki, maawio ya jua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Kisha mpaka ukageuka
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mpaka kubadili mwelekeo. Kutaja ‘mpaka’ wazi kunafanya rejeleo la kisarufi lieleweke kwa Kiswahili.
- source_word: מִשָּׂרִיד
  choice: kutoka Saridi
  rationale: Jina la mahali limetoholewa kwa matamshi ya Kiswahili, na kihusishi kinaonyesha mahali sehemu hii ya mpaka ilipoanzia.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: kuelekea mashariki, upande wa kuchomoza kwa jua
  rationale: Maneno yote mawili ya mwelekeo yamehifadhiwa ili kutopunguza msisitizo na taswira ya Kiebrania.
- source_word: עַל גְּבוּל
  choice: hadi mpaka wa
  rationale: Katika muktadha huu wa kijiografia, msemo unaonyesha mpaka kufikia mpaka wa eneo linalofuata.
- source_word: כִּסְלֹת תָּבֹר
  choice: Kisloth-tabori
  rationale: Jina ambatani la mahali limetoholewa kwa namna inayoweza kusomeka kwa Kiswahili huku likihifadhi umbo lake la Kiebrania.
- source_word: וְיָצָא
  choice: ukaendelea
  rationale: Katika maelezo ya mipaka, kitenzi hiki hueleza mstari wa mpaka kuendelea au kufika mahali fulani; ‘ukaendelea’ ni Kiswahili cha kawaida bila kuongeza maana isiyokuwapo.
- source_word: אֶל הַדָּבְרַת
  choice: hadi Daberathi
  rationale: Jina la mahali limetoholewa, na kihusishi ‘hadi’ kinaonyesha mahali mpaka ulipofika.
- source_word: וְעָלָה
  choice: kisha ukapanda hadi
  rationale: Tafsiri hii inadumisha wazo la kupanda kijiografia badala ya kulifanya kuwa mwendo wa kawaida tu.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Jina la mahali limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia inayofaa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Majina ya maeneo yametoholewa kwa usomaji wa Kiswahili, na msururu wa vitenzi umefafanuliwa kwa kutaja ‘mpaka’ ili rejeleo lisibaki tata isivyo kawaida katika Kiswahili.
