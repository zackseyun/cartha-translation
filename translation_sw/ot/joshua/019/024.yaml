  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: sw
  text: Kura ya tano ilitoka kwa ajili ya kabila la wana wa Asheri[a], kwa koo zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kura ya tano ilitolewa kwa ajili ya kabila la wana wa Asheri, kulingana na jamaa zao.”
    reason: Toleo hili linaonyesha uwezekano wa kueleza וַיֵּצֵא kimuktadha kuwa kura ‘ilitolewa’ na מִשְׁפְּחוֹת kama ‘jamaa,’ ingawa maandishi makuu yanadumisha zaidi taswira na mpangilio wa Kiebrania.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ilitoka
  rationale: Kitenzi יצא kimsingi humaanisha ‘kutoka.’ Katika muktadha wa kugawa nchi kwa kura, ‘ilitoka’ kinahifadhi taswira ya Kiebrania bila kufafanua kupita kiasi utaratibu wa kura.
- source_word: הַגּוֹרָל
  choice: kura
  rationale: גורל hapa ni kura iliyotumiwa kuamua sehemu ya kila kabila; ‘kura’ huhifadhi maana ya moja kwa moja kuliko ‘sehemu’ au ‘urithi,’ ambazo zinasisitiza matokeo.
- source_word: הַחֲמִישִׁי
  choice: ya tano
  rationale: Ni namba ya mpangilio inayofafanua kura.
- source_word: לְמַטֵּה
  choice: kwa ajili ya kabila la
  rationale: Ingawa מַטֶּה pia inaweza kumaanisha fimbo, katika muktadha huu ni istilahi ya kabila; ‘kabila’ ndiyo maana wazi na ya kawaida kwa Kiswahili.
- source_word: בְנֵי אָשֵׁר
  choice: wana wa Asheri
  rationale: Tafsiri hii inadumisha lugha ya nasaba ya Kiebrania na pia inafanya kazi kama jina la kikabila katika muundo ‘kabila la wana wa Asheri.’
- source_word: לְמִשְׁפְּחוֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחוֹת ni vikundi vya ukoo ndani ya kabila; ‘koo’ ni sahihi zaidi hapa kuliko ‘familia,’ ambayo katika Kiswahili cha sasa mara nyingi humaanisha kaya ndogo.
