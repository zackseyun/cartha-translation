id: JOS.19.50
reference: Joshua 19:50
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: sw
  text: Kwa agizo la Yahwe, wakampa mji aliouomba, Timnath-sera, katika eneo la milima la Efraimu. Akaujenga mji huo, akakaa humo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: Kwa agizo la Yahwe
  rationale: Nahau עַל־פִּי inaonyesha maelekezo au amri yenye mamlaka; “kwa agizo la” ni Kiswahili cha kawaida kinachohifadhi maana hiyo, huku יְהוָה ikitafsiriwa kwa jina Yahwe.
- source_word: נָתְנוּ לוֹ
  choice: wakampa
  rationale: Kitenzi נתן pamoja na kiwakilishi cha yule anayepokea kina maana ya moja kwa moja ya kumpa mtu kitu; “wakampa” ni fupi na ya asili katika simulizi.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: mji aliouomba
  rationale: שׁאל hapa ni kuomba kitu; muundo huu unahifadhi kishazi cha uhusiano bila kuongeza wazo lisilokuwapo.
- source_word: תִּמְנַת סֶרַח
  choice: Timnath-sera
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; umbo hili linaweza kusomeka kwa urahisi katika Kiswahili huku likibaki karibu na jina la Kiebrania.
- source_word: בְּהַר אֶפְרָיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: הַר katika muktadha huu huonyesha eneo la milima au vilima, si lazima mlima mmoja; “nchi ya vilima” inaeleza jiografia hiyo kwa uwazi.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: Akaujenga mji huo
  rationale: בנה kimsingi ni “kujenga.” Tafsiri kuu inafuata maana ya moja kwa moja, huku uwezekano wa “kuujenga upya/kuurejesha” ukihifadhiwa katika tanbihi kwa sababu mji tayari umetajwa kuwapo.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: na kuishi humo
  rationale: ישׁב hapa humaanisha kukaa au kuishi mahali; “kuishi humo” ni ya kawaida na hurejelea mji kwa uwazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la Mungu la herufi nne moja kwa moja. “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Maana ya בנה kuhusu mji uliokuwapo tayari
  choice: kujenga
  alternative: kujenga upya au kurejesha
  rationale: Kitenzi chenyewe husema “kujenga,” lakini muktadha unaweza kudokeza kuujenga upya, kuurejesha, au kuufanya ufae kukaliwa. Tafsiri kuu haikulazimishi dokezo hilo, na tanbihi inalihifadhi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wa heshima. “Ya kwamba” na misemo ya kale imeepukwa; “yaani” inatambulisha jina la mji kwa uwazi. Alama ya tanbihi imewekwa mara tu baada ya kitenzi kinachohusika.
