base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: sw
  text: Lakini mpaka wa wazao wa Dani ukaenda nje yao[a]. Basi wazao wa Dani wakapanda, wakapigana na Leshemu, wakauteka, wakaupiga kwa makali ya upanga, wakaumiliki, wakakaa humo. Wakauita Leshemu Dani[b], kwa jina la Dani baba yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka wa wazao wa Dani ukaenea nje yao.” Tafsiri nyingine hufafanua maneno haya kuwa, “eneo la wazao wa Dani lilikuwa dogo mno kwao,” kwa kuzingatia muktadha mpana; lakini maneno ya Kiebrania yanaeleza zaidi wazo la mahali.
    reason: alternative_reading
  - marker: b
    text: Leshemu huhusianishwa na Laishi katika Waamuzi 18:7, 14, 27, 29.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: mpaka wa wazao wa Dani ukaenda nje yao
  rationale: גְבוּל inaweza kumaanisha mpaka au eneo. Tafsiri hii inadumisha taswira ya mahali na ugumu wa מֵהֶם (‘kutoka kwao/nje yao’) bila kuingiza moja kwa moja ufafanuzi kwamba eneo lao lilikuwa dogo mno.
- source_word: בְּנֵי דָן
  choice: wazao wa Dani
  rationale: Hii huwasilisha nahau ya kifamilia ‘wana wa Dani’ kwa Kiswahili cha kawaida huku ikionyesha kuwa kinachokusudiwa ni kabila lililotokana na Dani.
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: עלה kwa kawaida humaanisha kwenda au kupanda juu, na hapa inaweza pia kueleza mwendo wa kijeshi.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: wakapigana na Leshemu
  rationale: Kitenzi humaanisha kupigana au kufanya vita; muundo wa Kiswahili ‘kupigana na’ ni wa kawaida na unaonyesha kuwa Leshemu ilikuwa adui.
- source_word: לֶשֶׁם
  choice: Leshemu
  rationale: Jina hili linafuata umbo la Kiebrania katika aya hii badala ya kulibadilisha kuwa Laishi; uhusiano na Laishi umewekwa katika tanbihi.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: wakauteka
  rationale: לכד katika muktadha wa vita humaanisha kuuteka mji au mahali.
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: wakaupiga kwa makali ya upanga
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania, yaani ‘kwa kinywa/makali ya upanga,’ bila kuficha ukali wa tendo.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: wakaumiliki
  rationale: ירשׁ hapa inaeleza kutwaa na kumiliki mahali baada ya ushindi.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: na kukaa humo
  rationale: ישׁב humaanisha kukaa au kuishi mahali; ‘humo’ hurejelea kwa kawaida mji uliotekwa.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: Wakauita Leshemu Dani
  rationale: Muundo huu unaonyesha wazi kuwa waliubadili mji wa Leshemu jina na kuuita Dani.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: kwa jina la Dani baba yao
  rationale: אָב inaweza kumaanisha baba au babu wa ukoo. ‘Baba yao’ huhifadhi nahau ya ukoo wa kikabila iliyopo katika Kiebrania.
