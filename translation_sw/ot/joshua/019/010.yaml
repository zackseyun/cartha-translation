base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: sw
  text: Kura ya tatu ikatokea kwa ajili ya wana wa Zabuloni[a], kwa kufuata koo zao, na mpaka wa urithi wao ukafika hadi Saridi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikachaguliwa.” Kiebrania husema kihalisi kwamba kura “ilipanda/ikatokea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ikatokea
  rationale: Kitenzi עלה humaanisha kihalisi ‘kupanda/kutokea’; katika muktadha wa kupiga kura, ‘kura ikatokea’ huhifadhi taswira ya Kiebrania na kueleweka kwa Kiswahili cha kawaida.
- source_word: הַגּוֹרָל
  choice: kura
  rationale: Ni kura iliyopigwa ili kuamua mgao wa nchi kwa kabila; ‘kura’ ndilo neno la kawaida na sahihi katika muktadha huu.
- source_word: הַשְּׁלִישִׁי
  choice: ya tatu
  rationale: Ni namba ya mpangilio inayovumisha ‘kura.’
- source_word: לִבְנֵי זְבוּלֻן
  choice: kwa ajili ya wana wa Zabuloni
  rationale: בני humaanisha kihalisi ‘wana wa’; usemi huu wa ukoo na kabila umehifadhiwa bila kuufanya kuwa ‘watu’ kwa ujumla.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa kufuata koo zao
  rationale: Katika ugawaji wa nchi, משפחה hurejelea koo zilizokuwa sehemu za kabila; ‘kwa kufuata koo zao’ huonyesha pia nguvu ya ugawaji ya kihusishi ל.
- source_word: וַיְהִי
  choice: ukafika
  rationale: Kitenzi cha simulizi kimeunganishwa kwa njia ya asili na kauli inayofuata badala ya kutafsiriwa kwa ukakasi kama ‘ikawa.’
- source_word: גְּבוּל
  choice: mpaka
  rationale: Katika maelezo ya nchi, גבול ni mstari wa mpaka, si eneo lote.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: נחלה ni nchi waliyopewa kuwa urithi; ‘urithi’ huhifadhi maana ya mgao wa kudumu kuliko ‘miliki’ pekee.
- source_word: עַד
  choice: hadi
  rationale: Katika maelezo ya mipaka, עד huonyesha mwisho wa eneo au mstari wa mpaka.
- source_word: שָׂרִיד
  choice: Saridi
  rationale: Ni jina la mahali, limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
theological_decisions: []
