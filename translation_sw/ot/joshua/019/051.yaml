source:
  edition: WLC
  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: sw
  text: Hizi ndizo sehemu za urithi ambazo kuhani Eleazari, Yoshua mwana wa Nuni, na wakuu wa koo za makabila ya wana wa Israeli[a] waligawa kwa kura huko Shilo mbele ya Yahwe, mlangoni mwa hema la kukutania. Hivyo wakamaliza kuigawa nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli”; usemi huu humaanisha watu wa Israeli.'
    reason: Ufafanuzi wa usemi wa Kiebrania unaohifadhiwa katika maandishi makuu.
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: sehemu za urithi
  rationale: Neno hili linamaanisha mali au eneo lililotolewa kuwa urithi; katika muktadha huu ni sehemu za nchi zilizogawiwa makabila.
- source_word: נִחֲלוּ
  choice: waligawa
  rationale: Katika muktadha wa ugawaji wa nchi, kitenzi hiki kinaeleza kitendo cha kuwapa makabila sehemu zao za urithi; ‘waligawa’ ni wazi na ya kawaida katika Kiswahili.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: wakuu wa jamaa za ukoo
  rationale: Usemi huu unawahusu viongozi wa vitengo vya kijamii vinavyotokana na mababu; tafsiri hii ni ya asili kuliko muundo wa moja kwa moja ‘nyumba za baba’ huku ikihifadhi wazo la ukoo.
- source_word: לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: za makabila ya wana wa Israeli
  rationale: ‘Makabila’ huwakilisha מַטּוֹת, na ‘wana wa Israeli’ huhifadhi kwa uwazi usemi wa Kiebrania בְּנֵי יִשְׂרָאֵל.
- source_word: בְּגוֹרָל
  choice: kwa kura
  rationale: Huu ndio usemi mfupi na wa kawaida wa Kiswahili kwa ugawaji ulioamuliwa kwa kupiga kura.
- source_word: בְּשִׁלֹה
  choice: huko Shilo
  rationale: ‘Huko’ huonyesha kwa kawaida mahali pa tukio la simulizi, na Shilo huhifadhi jina la mahali.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye ingilio la hema la kukutania
  rationale: ‘Ingilio’ huwakilisha פֶּתַח, na ‘hema la kukutania’ ni tafsiri wazi ya אֹהֶל מוֹעֵד.
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: Hivyo wakamaliza kuigawa nchi
  rationale: Muundo huu unaendeleza simulizi na kuonyesha kukamilika kwa mchakato wa kuigawa nchi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la agano יְהוָה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa ukoo wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watu wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi usemi wa Kiebrania na uhusiano wake wa ukoo, huku tanbihi ikifafanua kwamba usemi huo unarejelea watu wa Israeli kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Jamaa za ukoo’ huepuka tafsiri ngumu ya neno kwa neno ya ‘nyumba za baba’ bila kufuta muundo wa kijamii wa maandishi ya asili.
