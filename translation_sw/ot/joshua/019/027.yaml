base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: sw
  text: Kisha mpaka ukageuka kuelekea mashariki, upande wa mawio ya jua, hadi Beth-dagoni; ukafika eneo la Zabuloni na Bonde la Yiftha-eli kuelekea kaskazini, hadi Beth-emeki na Neieli. Kisha ukaendelea hadi Kabuli, upande wa kushoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka kushoto.” Katika maelezo ya mipaka, upande wa kushoto unaweza kumaanisha upande wa kaskazini, ikitegemea mtu anaelekea upande gani.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: Kisha mpaka ukageuka
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mpaka kubadili mwelekeo; kutaja 'mpaka' kwa uwazi kunafanya Kiswahili kiwe cha kawaida.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: kuelekea mashariki, upande wa mawio ya jua
  rationale: Kauli hii inatoa maana ya kijiografia na pia kuhifadhi taswira halisi ya Kiebrania ya kuchomoza kwa jua.
- source_word: בֵּית דָּגֹן
  choice: Beth-dagoni
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa, kwa tahajia inayosomeka kwa Waswahili.
- source_word: וּפָגַע בִּזְבֻלוּן
  choice: ukafika eneo la Zabuloni
  rationale: Katika muktadha wa mipaka, פגע hueleza mpaka kukutana na eneo jingine; 'eneo la' huepusha kueleweka kana kwamba Zabuloni hapa ni mtu.
- source_word: וּבְגֵי יִפְתַּח אֵל
  choice: na Bonde la Yiftha-eli
  rationale: גֵי limetafsiriwa 'Bonde,' huku jina maalumu Yiftha-eli likitoholewa.
- source_word: צָפוֹנָה
  choice: kuelekea kaskazini
  rationale: Huhifadhi nguvu ya kielezi cha mwelekeo katika Kiebrania.
- source_word: בֵּית הָעֵמֶק
  choice: Beth-emeki
  rationale: Jina la mahali limetoholewa, si kutafsiriwa kuwa 'nyumba ya bonde.'
- source_word: וּנְעִיאֵל
  choice: na Neieli
  rationale: Jina maalumu limetoholewa kwa namna inayosomeka katika Kiswahili.
- source_word: וְיָצָא
  choice: Kisha ukaendelea
  rationale: Katika fomula ya mpaka, kitenzi kinaonyesha mstari wa mpaka kuenea au kuendelea hadi kituo kingine; 'ukaendelea' ni asilia katika Kiswahili.
- source_word: אֶל כָּבוּל
  choice: hadi Kabuli
  rationale: Jina la mahali limetoholewa kwa fonolojia na tahajia ya Kiswahili.
- source_word: מִשְּׂמֹאל
  choice: upande wa kushoto
  rationale: Tafsiri inahifadhi usemi halisi 'kushoto' badala ya kuamua kimya kimya kuwa maana yake ni kaskazini.
