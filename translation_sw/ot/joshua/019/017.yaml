    issue: Repeated use of 'kwa ajili ya'
    rationale: It adds a purposive nuance and makes the formula heavier than necessary; simple 'kwa' adequately renders the Hebrew lamed in this context.
  - severity: low
    issue: Rendering of clan-distribution phrase
    rationale: '''Kwa kufuata koo zao'' is intelligible, but ''sawasawa na koo zao'' more idiomatically conveys ''according to/by their clans.'''
  revised_text: Kwa Isakari ilitoka kura ya nne, kwa wana wa Isakari, sawasawa na koo zao.
