  verdict: revise
  source_fidelity: Draft correctly represents the fourth lot, Issachar, the tribal-descent expression 'sons of Issachar,' and clan-based division. However, 'Kwa ajili ya' is more expansive than the Hebrew prefixed לְ and is unnecessarily repeated. 'Sawasawa na koo zao' more directly expresses the distributive sense of לְמִשְׁפְּחוֹתָם.
  naturalness: The proposed wording is understandable, but the repeated 'kwa ajili ya' is cumbersome in a short allotment formula. Reordering to 'Kwa Isakari ilitoka kura ya nne' is natural, concise Standard East African Swahili while retaining the source imagery.
  terminology: '''Isakari,'' ''kura,'' ''wana wa Isakari,'' and ''koo'' are appropriate. ''Koo'' aptly conveys tribal clans rather than modern nuclear families.'
  issues:
