base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: sw
  text: Kwa Isakari ilitoka kura ya nne, kwa wana wa Isakari, sawasawa na koo zao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: Kwa ajili ya Isakari
  rationale: Kiambishi לְ kinaonyesha kabila ambalo kura hiyo ililihusu; usemi huu ni wa kawaida na unaeleweka katika muktadha wa ugawaji.
- source_word: יָצָא
  choice: ikatokea
  rationale: Kitenzi hiki kimsingi humaanisha ‘kutoka’; katika muktadha wa kupiga kura, ‘ikatokea’ huhifadhi taswira ya kura iliyotolewa bila kuibadili kuwa ‘ikaangukia’.
- source_word: הַגּוֹרָל הָרְבִיעִי
  choice: kura ya nne
  rationale: ‘Kura’ hudumisha maana ya njia au matokeo ya kupiga kura, na namba ya mpangilio inaonyesha nafasi yake katika mfululizo wa ugawaji.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: kwa ajili ya wana wa Isakari
  rationale: Tafsiri hii inadumisha usemi halisi wa Kiebrania wa ukoo wa kikabila, ‘wana wa Isakari,’ badala ya kuufanya kuwa usemi mpana zaidi.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: kwa kufuata koo zao
  rationale: Katika muktadha wa ugawaji wa maeneo ya kikabila, מִשְׁפָּחוֹת ni vikundi vya ukoo ndani ya kabila; ‘koo’ ni sahihi kuliko ‘familia’ katika Kiswahili cha sasa.
