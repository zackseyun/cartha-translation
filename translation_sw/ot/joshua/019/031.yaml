translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Wazao wa Asheri” huepuka kueleweka kana kwamba ni wana wa moja kwa moja tu, na “vijiji” ni la kawaida zaidi kuliko istilahi nzito kwa makazi tegemezi.
