translation:
  language: sw
  text: Huu ulikuwa urithi wa kabila la wazao wa Asheri kulingana na koo zao—miji hii na vijiji vyake[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Huu ndio urithi ...” Muundo wa Kiebrania unaweza kutafsiriwa kwa wakati wa sasa, lakini wakati uliopita unafaa katika muhtasari huu wa simulizi.
    reason: lexical_alternative
  - marker: b
    text: Au “makazi yake ya kandokando” badala ya “vijiji vyake.” Kiebrania kinarejelea makazi madogo ya mashambani yaliyohusishwa na miji iliyoorodheshwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Huu ndio uliokuwa
  rationale: Kiwakilishi hiki kinarejelea “urithi,” ambalo kwa Kiswahili ni jina la ngeli ya 3. Wakati uliopita unafaa katika muhtasari huu wa simulizi, ingawa Kiebrania pia kinaweza kutafsiriwa kwa wakati wa sasa.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Katika muktadha wa ugawaji wa nchi, neno hili linamaanisha sehemu ya nchi iliyopokelewa kama urithi; “urithi” huhifadhi maana ya kifamilia na ya agano.
- source_word: מַטֵּה
  choice: kabila
  rationale: Hapa neno hili linataja kundi la kikabila, wala si maana yake halisi ya fimbo.
- source_word: בְנֵי אָשֵׁר
  choice: wazao wa Asheri
  rationale: Ingawa kwa muundo wa karibu ni “wana wa Asheri,” katika fomula hii usemi huo unamaanisha watu waliotokana na Asheri; “wazao” ni wazi na wa kawaida katika Kiswahili.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: Katika orodha za kikabila, מִשְׁפָּחָה ni mgawanyiko wa ukoo ndani ya kabila, na לְ inaonyesha ugawaji kulingana na koo hizo.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: miji hii
  rationale: עָרִים ni makazi ya mjini; “miji” ni tafsiri ya kawaida ya kibiblia hata kama baadhi ya maeneo hayo yalikuwa madogo kwa vipimo vya sasa.
- source_word: וְחַצְרֵיהֶן
  choice: pamoja na vijiji vyake
  rationale: חָצֵר hapa hurejelea makazi madogo ya mashambani yaliyotegemea miji iliyoorodheshwa. “Vijiji” ni neno la kawaida na linaloeleweka katika Kiswahili, huku tanbihi ikihifadhi maana pana zaidi.
