  text: 'Aini[a], Rimoni, Eteri na Ashani: miji minne pamoja na vijiji vyake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinaorodhesha majina manne ya mahali: Aini, Rimoni, Eteri na Ashani. Baadhi ya wafafanuzi hulinganisha 1 Mambo ya Nyakati 4:32, ambako “Aini-Rimoni” linaweza kueleweka kuwa jina moja; hilo huathiri hesabu ya miji.'
