lexical_decisions:
- source_word: עַיִן
  choice: Aini
  rationale: Ni jina la mahali katika orodha ya miji; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili badala ya kutafsiriwa kuwa ‘chemchemi’ au ‘jicho’.
- source_word: רִמּוֹן
  choice: Rimoni
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiri maana yake ya kawaida, ‘komamanga’.
- source_word: וָעֶתֶר
  choice: Etheri
  rationale: Ni jina la mahali lenye kiunganishi; limetoholewa kwa umbo linaloweza kutamkwa kwa urahisi katika Kiswahili.
- source_word: וְעָשָׁן
  choice: na Ashani
  rationale: Kiunganishi cha Kiebrania kimetafsiriwa kuwa ‘na’, nalo jina la mahali limetoholewa.
- source_word: עָרִים
  choice: miji
  rationale: Neno hili humaanisha maeneo ya makazi ya mjini; ‘miji’ linafaa katika muhtasari wa orodha ya maeneo.
- source_word: אַרְבַּע
  choice: minne
  rationale: Namba imepatana kisarufi na nomino ya ngeli ya miji.
- source_word: וְחַצְרֵיהֶן
  choice: pamoja na vijiji vyake
  rationale: Katika orodha za maeneo, חָצֵר hurejelea makazi madogo ya vijijini yaliyohusiana na miji iliyotajwa; ‘pamoja na vijiji vyake’ ni Kiswahili cha kawaida na huonyesha uhusiano huo.
theological_decisions:
- issue: Ikiwa Aini na Rimoni ni jina moja au majina mawili
  choice: Yameachwa kuwa majina mawili kulingana na mpangilio wa maandishi ya Kiebrania katika mstari huu, huku jumla ya ‘miji minne’ ikihifadhiwa.
  alternative: Kuyachukulia pamoja kama jina moja, ‘Aini-Rimoni’, kwa kulinganisha na 1 Mambo ya Nyakati 4:32.
  rationale: Maandishi ya Yoshua 19:7 yanaorodhesha maumbo manne na kisha kusema ‘miji minne’. Hata hivyo, ushahidi wa rejeo lingine unastahili kutajwa bila kuondoa mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina ya mahali yametoholewa kwa namna inayosomeka kwa urahisi, na muundo mfupi wa orodha ya Kiebrania umehifadhiwa.
