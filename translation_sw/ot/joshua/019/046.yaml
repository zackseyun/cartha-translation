  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: sw
  text: na maji ya Yarkoni[a] na Rakoni, pamoja na mpaka[b] ulio mkabala na Yafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kueleweka kama jina la mahali, “Me-Yarkoni,” badala ya usemi “maji ya Yarkoni.”
    reason: lexical_alternative
  - marker: b
    text: Au, “eneo lililo mkabala na Yafa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵי הַיַּרְקוֹן
  choice: na maji ya Yarkoni
  rationale: Masora huiwekea vokali מֵי, hali ya kuambatanisha ya wingi wa מַיִם, yaani “maji ya.” Tafsiri hii inaonyesha maana ya moja kwa moja ya Kiebrania huku ikiweka uwezekano wa jina la mahali katika tanbihi.
- source_word: וְ/הָרַקּוֹן
  choice: na Rakoni
  rationale: Ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa Kiswahili bila kuhamisha kibainishi cha Kiebrania kama neno tofauti.
- source_word: עִם
  choice: pamoja na
  rationale: Katika orodha hii ya maeneo, “pamoja na” huunganisha kwa kawaida majina yaliyotangulia na eneo linalofuata.
- source_word: הַ/גְּבוּל
  choice: eneo
  rationale: גְּבוּל inaweza kumaanisha mpaka, mstari wa mpaka, au eneo. Hapa “eneo” linafaa katika orodha ya urithi wa kikabila, huku maana ya “mpaka” ikihifadhiwa katika tanbihi.
- source_word: מוּל
  choice: lililo mkabala na
  rationale: מוּל huonyesha uhusiano wa mahali wa kuwa upande unaokabiliana na mahali pengine; “mkabala na” huhifadhi maana hiyo bila kuifanya kuwa mwelekeo tu.
- source_word: יָפוֹ
  choice: Yafa
  rationale: “Yafa” ni utohozi wa jina la mahali יָפוֹ unaofaa kwa mfumo wa sauti na tahajia ya Kiswahili.
