  text: And they had in their inheritance Beer-sheba[a], Sheba, and Moladah.
translation:
  language: sw
  text: Nao, katika urithi wao, walikuwa na Beer-sheba[a], Sheba, na Molada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Beer-sheba na Sheba.” Baadhi huelewa maneno haya kuwa jina moja la mahali (“Beer-sheba”), wakiona hapa hitilafu ya kimatini au ya kimtindo, badala ya majina ya miji miwili tofauti.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: Nao walikuwa na
  rationale: Muundo wa Kiebrania wa ויהי pamoja na לָהֶם unaonyesha kuwa vitu hivyo vilikuwa vyao au viligawiwa kwao. Kiswahili cha kawaida hueleza maana hiyo kwa urahisi kwa kusema “walikuwa na,” badala ya tafsiri ya neno kwa neno isiyo ya kawaida.
- source_word: בְּנַחֲלָתָם
  choice: katika urithi wao
  rationale: Neno נחלה hapa linamaanisha sehemu ya nchi waliyogawiwa kuwa milki yao. “Katika urithi wao” linadumisha taswira ya urithi na kuonyesha kuwa miji iliyotajwa ilikuwa ndani ya eneo walilogawiwa.
- source_word: בְּאֵר שֶׁבַע
  choice: Beer-sheba
  rationale: Jina la mahali limetoholewa kwa herufi za Kiswahili huku kistari kikidumisha wazi muundo wa sehemu mbili wa jina la Kiebrania.
- source_word: וְשֶׁבַע
  choice: Sheba
  rationale: Maandishi ya Kiebrania ya Kimasoreti yanasoma jina jingine, “na Sheba.” Ugumu wa kuwepo kwake mara tu baada ya Beer-sheba haujaondolewa kimya kimya, bali umefafanuliwa katika tanbihi.
- source_word: וּמוֹלָדָה
  choice: na Molada
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili; kiunganishi cha Kiebrania kimedumishwa kama “na.”
