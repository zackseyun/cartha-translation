translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Neno “miji hii” limeongezwa kwa uwazi kutokana na muktadha wa orodha ya miji, bila kubadili maana. Majina ya mahali yametoholewa, na utata wa Beer-sheba/Sheba umehifadhiwa katika matini na tanbihi.
