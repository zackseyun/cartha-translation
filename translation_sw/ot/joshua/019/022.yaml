base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: sw
  text: Mpaka ukagusa Tabori[a], Shahazuma, na Beth-shemeshi, na mpaka wao uliishia Yordani[b]—miji kumi na sita pamoja na vijiji vyao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukafika” au “ukakutana na”; kitenzi cha Kiebrania kinaweza kuonyesha mstari wa mpaka unaofikia au kugusana na mahali fulani.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “sehemu za kutokea za mpaka wao zilikuwa Yordani”; hii ni fomula ya mipaka inayorejelea mwisho au upeo wa mpaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע הַגְּבוּל
  choice: Mpaka ukafika
  rationale: Katika maelezo ya mipaka, פגע huonyesha mpaka unaofika au kukutana na mahali; “ukafika” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kijiografia.
- source_word: בְּתָבוֹר
  choice: Tabori
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili.
- source_word: וְשַׁחֲצוּמָה
  choice: Shahazuma
  rationale: Jina la mahali limenukuliwa kwa sauti kulingana na umbo la Kiebrania.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Beth-shemeshi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa maana yake ya kileksika.
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: na mwisho wa mpaka wao ulikuwa Yordani
  rationale: תֹּצְאוֹת katika fomula za mipaka humaanisha sehemu ya mwisho au mahali mpaka unapofikia; usemi huu ni wazi na wa asili kwa Kiswahili.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: miji kumi na sita
  rationale: Huu ni uwasilishaji wa moja kwa moja wa idadi na nomino.
- source_word: וְחַצְרֵיהֶן
  choice: pamoja na vijiji vyake
  rationale: חָצֵר katika orodha za miji hurejelea vijiji au makazi madogo yaliyo chini ya miji hiyo; kiwakilishi cha ngeli “vyake” kinarejelea miji.
