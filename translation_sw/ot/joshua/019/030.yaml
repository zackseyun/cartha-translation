  yaml_path: translation/ot/joshua/019/030.yaml
  text: 'Ummah[a], Aphek, and Rehob: twenty-two cities, with their villages.'
translation:
  language: sw
  text: Uma, Afeki na Rehobu—miji ishirini na miwili pamoja na vijiji vyao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makazi yao” au “vitongoji vyao”; neno la Kiebrania linamaanisha maeneo madogo ya vijijini yaliyohusishwa na miji iliyoorodheshwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻמָה
  choice: Uma
  rationale: Jina la mahali limetoholewa kulingana na matamshi ya Kiebrania na tahajia ya kawaida ya Kiswahili.
- source_word: אֲפֵק
  choice: Afeki
  rationale: Jina la mahali limetoholewa kwa umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: רְחֹב
  choice: Rehobu
  rationale: Jina la mahali limetoholewa kwa kuhifadhi sauti kuu za Kiebrania huku likifuata muundo unaosomeka kwa Kiswahili.
- source_word: עָרִים
  choice: miji
  rationale: Neno hili linajumlisha maeneo yaliyotajwa katika orodha ya ugawaji; 'miji' ni tafsiri ya kawaida hapa, ingawa ukubwa wake huenda ulitofautiana.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: ishirini na miwili
  rationale: Idadi ya msingi inayotoa jumla ya miji katika sehemu hii.
- source_word: חַצְרֵיהֶן
  choice: vijiji vyake
  rationale: Katika orodha za maeneo, neno hili humaanisha makazi ya vijijini yaliyo chini ya miji iliyotajwa; 'vijiji vyake' ni lugha ya asili na iliyo wazi kwa msomaji wa Kiswahili.
