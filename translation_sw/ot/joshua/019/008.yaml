base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: sw
  text: pamoja na vijiji vyote vilivyokuwa kandokando ya miji hii, mpaka Baalath-beeri, Ramath-negebu.[a] Huu ndio urithi wa kabila la wana wa Simeoni kulingana na koo zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “Baalath-beeri, yaani, Ramath-negebu,” ikiwa jina la pili linaitambulisha sehemu ileile iliyoitwa kwa jina la kwanza.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל
  choice: pamoja na ... vyote
  rationale: Kiunganishi kinaendeleza orodha ya miji katika mstari uliotangulia, na muundo huu unaonyesha kwa Kiswahili cha kawaida kwamba vijiji vinaongezwa katika orodha hiyo.
- source_word: הַחֲצֵרִים
  choice: vijiji
  rationale: Katika orodha za maeneo, neno hili humaanisha makazi madogo, mara nyingi yasiyozungushiwa ukuta, yaliyohusishwa na miji; “vijiji” ni wazi na la kawaida.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: vilivyozunguka miji hii
  rationale: Huhifadhi uhusiano wa kijiografia na nguvu ya kiashiria cha karibu “hii” kwa lugha ya asili ya Kiswahili.
- source_word: עַד
  choice: mpaka
  rationale: Katika maelezo ya eneo, “mpaka” huonyesha mwisho wa kiwango cha kijiografia bila kuleta maana ya wakati.
- source_word: בַּעֲלַת בְּאֵר
  choice: Baalath-beeri
  rationale: Ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa; kistari huonyesha kuwa ni jina ambatani.
- source_word: רָאמַת נֶגֶב
  choice: Ramath-negebu
  rationale: Kutoholewa kwa jina kunahifadhi uwezekano kwamba ni jina mbadala la mahali palepale au jina la eneo jingine, bila kulifasiri kimya kimya kuwa “Rama ya Negebu.”
- source_word: זֹאת
  choice: Huu ndio
  rationale: Kiebrania kina kiashiria bila kitenzi kilicho wazi. Muundo huu wa Kiswahili ni wa kawaida katika sentensi ya muhtasari na hauhitaji kuamua wazi kati ya wakati uliopo na uliopita.
- source_word: נַחֲלַת
  choice: urithi
  rationale: “Urithi” huhifadhi maana ya sehemu ya nchi iliyogawiwa na pia dhana ya milki inayorithiwa.
- source_word: מַטֵּה
  choice: kabila la
  rationale: Katika muktadha wa ugawaji wa nchi, neno hili humaanisha kabila, si fimbo kwa maana halisi.
- source_word: בְנֵי שִׁמְעוֹן
  choice: wana wa Simeoni
  rationale: Huhifadhi lugha ya ukoo ya Kiebrania huku ikibaki wazi kwa msomaji wa kawaida.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: Katika ugawaji wa kikabila, neno hili linarejelea vikundi vya koo ndani ya kabila; “koo” ni sahihi kuliko “familia” katika muktadha huu.
