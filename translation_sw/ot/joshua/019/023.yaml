translation:
  language: sw
  text: 'Huu ndio uliokuwa urithi wa kabila la wazao wa Isakari, kwa koo zao: miji na vijiji vyake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huu ndio urithi ...” Kiebrania hakina kitenzi katika sentensi hii; kwa hiyo muhtasari huu unaweza kutafsiriwa kwa wakati wa sasa au uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Huo ndio uliokuwa
  rationale: Kiwakilishi hiki cha kike kinarejelea eneo la urithi lililoelezwa. Kitenzi cha wakati uliopita kimeongezwa kwa Kiswahili cha kawaida, ingawa Kiebrania hakina kitenzi wazi hapa.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Neno hili linamaanisha eneo la ardhi lililotolewa kuwa milki ya kurithi; “urithi” huhifadhi maana ya ardhi inayorithiwa kuliko neno la kiutawala tu.
- source_word: מַטֵּה בְנֵי יִשָּׂשכָר
  choice: kabila la wazao wa Isakari
  rationale: Katika muktadha huu מַטֵּה ni kabila, na בְנֵי יִשָּׂשכָר ni kundi la ukoo linalotokana na Isakari. “Wazao” ni Kiswahili cha asili zaidi kuliko tafsiri ya moja kwa moja “wana.”
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחוֹת hapa ni migawanyiko ya koo ndani ya kabila, na לְ inaonyesha upangaji au ugawaji kwa koo.
- source_word: הֶעָרִים
  choice: miji hiyo
  rationale: עָרִים ni vituo vya makazi; kiwakilishi “hiyo” kinaonyesha kuwa ni miji iliyotangulia kutajwa katika orodha.
- source_word: וְחַצְרֵיהֶן
  choice: pamoja na vijiji vyake
  rationale: חֲצֵרִים katika orodha za maeneo ni makazi madogo yaliyohusishwa na miji. “Vijiji” ni neno wazi na la kawaida kwa wasomaji wa sasa.
