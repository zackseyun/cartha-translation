translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa muhtasari umehifadhiwa, huku usemi wa Kiebrania wa “wana wa Isakari” ukitolewa kwa njia ya kawaida kama “wazao wa Isakari.”
