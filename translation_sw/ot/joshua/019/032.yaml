lexical_decisions:
- source_word: לִבְנֵי
  choice: kwa wana wa
  rationale: Kiambishi לְ־ kinamtaja mpokeaji wa mgao. “Wana wa” kinahifadhi nahau ya kikabila ya Kiebrania na katika muktadha huu kinaweza kumaanisha wazao wa Naftali.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina la mtu na la kabila limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: יָצָא
  choice: ikatoka
  rationale: Kitenzi hiki kimsingi humaanisha ‘kutoka’ au ‘kwenda nje’; hapa kinaeleza matokeo ya kupiga kura bila kubadili picha ya lugha ya chanzo.
- source_word: הַגּוֹרָל
  choice: kura
  rationale: Katika muktadha huu גורל ni kura iliyopigwa ili kuamua mgao wa eneo.
- source_word: הַשִּׁשִּׁי
  choice: ya sita
  rationale: Ni namba ya mp ترتيب inayovumisha ‘kura’.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: מִשְׁפָּחוֹת hapa ni vikundi vya undugu ndani ya kabila; ‘koo’ ni sahihi zaidi kuliko ‘familia’ katika muktadha wa mgao wa kikabila.
