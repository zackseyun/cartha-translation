base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: sw
  text: 'Huu ndio urithi wa kabila la wazao wa Dani,[a] kulingana na koo zao: miji hii pamoja na vijiji vyake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu waliyopewa.” Neno la Kiebrania linaweza kukazia ama urithi ama sehemu ya nchi iliyogawiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Huu ndio
  rationale: Kiwakilishi hiki cha kuonyesha kinarejelea urithi uliotajwa. Kiswahili hakihitaji kuongeza kitenzi cha wakati uliopo au uliopita katika muundo huu.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Katika muktadha wa ugawaji wa nchi, neno hili ni sehemu ya ardhi iliyorithiwa; “urithi” huhifadhi maana hiyo kuliko neno la kiutawala tu la mgao.
- source_word: מַטֵּה
  choice: kabila
  rationale: Hapa neno hili linamaanisha kundi la kikabila, si fimbo.
- source_word: בְנֵי דָן
  choice: wazao wa Dani
  rationale: “Wazao wa Dani” ni ya asili katika Kiswahili na huhifadhi wazo la Kiebrania la wana au uzao wa Dani.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: Katika orodha za kikabila, neno hili linataja migawanyiko ya ukoo ndani ya kabila, si familia ndogo pekee.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: miji hii
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kifungu kinachorejelea orodha iliyotangulia.
- source_word: וְחַצְרֵיהֶן
  choice: pamoja na vijiji vyake
  rationale: Neno hili linamaanisha makazi madogo yaliyo chini ya miji hiyo; kiwakilishi cha umoja “-ake” kinapatana kisarufi na nomino ya ngeli ya miji “miji,” huku kikirejelea kila mji na vijiji vinavyohusiana nao.
