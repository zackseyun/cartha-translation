lexical_decisions:
- source_word: לְמַטֵּה
  choice: Kwa kabila la
  rationale: מַטֶּה hapa humaanisha kabila, si fimbo; kiambishi לְ kinaonyesha anayepokea mgao, na ‘kwa’ ni ya kawaida katika Kiswahili.
- source_word: בְנֵי דָן
  choice: wana wa Dani
  rationale: Inahifadhi kwa uwazi usemi wa Kiebrania wa uhusiano wa ukoo bila kuufupisha kuwa jina la wakazi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kufuatana na koo zao
  rationale: מִשְׁפָּחוֹת hapa ni migawanyiko ya ukoo ndani ya kabila; ‘koo’ huepuka maana finyu ya kaya za kisasa.
- source_word: יָצָא
  choice: ilitoka
  rationale: Hufuata maana ya msingi ya kitenzi na inafaa katika muktadha wa matokeo ya kupiga kura.
- source_word: הַגּוֹרָל
  choice: kura
  rationale: Ni neno la kawaida la Kiswahili kwa גוֹרָל katika ugawaji unaoamuliwa kwa kura.
- source_word: הַשְּׁבִיעִי
  choice: ya saba
  rationale: Ni tafsiri ya moja kwa moja ya namba ya mpangilio inayofafanua kura.
