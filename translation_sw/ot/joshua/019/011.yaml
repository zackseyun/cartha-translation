base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: sw
  text: Mpaka wao ukapanda kuelekea magharibi hadi Marala, ukafika Dabeshethi, kisha ukafika kwenye bonde la mto lililo mkabala na Yokneamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה ... לַיָּמָּה
  choice: ukapanda kuelekea magharibi
  rationale: Kitenzi kinahifadhi mwendo wa kupanda, na לַיָּמָּה katika muktadha wa mpaka kinaeleza upande wa magharibi.
- source_word: וּפָגַע
  choice: ukafika
  rationale: Katika maelezo ya mipaka, פגע humaanisha mpaka kufikia au kukutana na sehemu fulani; ‘ukafika’ ni ya kawaida na wazi kwa Kiswahili.
- source_word: הַנַּחַל
  choice: bonde la mto
  rationale: נחל inaweza kuwa kijito au bonde lenye mkondo wa maji; ‘bonde la mto’ linahifadhi maana ya kijiografia bila kudai kwamba maji hutiririka daima.
- source_word: עַל־פְּנֵי
  choice: lililo mkabala na
  rationale: Usemi huu hapa unaonyesha mahali palipoelekeana au karibu mbele ya Yokneamu.
- source_word: מַרְעֲלָה ... דַבָּשֶׁת ... יָקְנְעָם
  choice: Marala ... Dabeshethi ... Yokneamu
  rationale: Majina yamenakiliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku yakifuata kwa karibu maumbo ya Kiebrania.
