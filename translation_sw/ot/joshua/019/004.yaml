lexical_decisions:
- source_word: אֶלְתּוֹלַד
  choice: Eltoladi
  rationale: Jina la mahali katika orodha ya miji. Umbo hili limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku likihifadhi utambulisho wa jina la Kiebrania.
- source_word: בְתוּל
  choice: Bethuli
  rationale: Jina la mahali limetoholewa kama Bethuli; tahajia yenye th hutofautisha jina hili na Betuli na kufuata matumizi yanayofahamika katika mapokeo ya Biblia ya Kiswahili.
- source_word: חָרְמָה
  choice: Horma
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa kisemantiki. Horma ni umbo la kawaida na linalosomeka kwa urahisi katika Kiswahili.
- source_word: וְ / וּ
  choice: na
  rationale: Viunganishi vya Kiebrania vinaunganisha majina katika orodha rahisi; Kiswahili cha asili hutumia koma na 'na' kabla ya jina la mwisho.
