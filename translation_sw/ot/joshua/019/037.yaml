lexical_decisions:
- source_word: קֶדֶשׁ
  choice: Kedeshi
  rationale: Ni jina la mahali katika orodha ya miji; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili badala ya kutafsiriwa maana yake.
- source_word: אֶדְרֶעִי
  choice: Edrei
  rationale: Ni jina la mahali; umbo hili linahifadhi kwa urahisi matamshi ya jina la Kiebrania bila alama ngeni kwa wasomaji wa kawaida.
- source_word: עֵין חָצוֹר
  choice: En-hasori
  rationale: Ni jina ambatani la mahali. Neno עֵין linaweza kumaanisha ‘chemchemi,’ lakini katika orodha hii linafanya kazi kama sehemu ya jina, kwa hiyo jina limetoholewa badala ya kutafsiriwa.
- source_word: וְ
  choice: na
  rationale: Kiunganishi kinachorudiwa kinaunganisha kila jina katika orodha; kurudia ‘na’ kunaakisi muundo wa Kiebrania kwa Kiswahili cha kawaida.
