  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: sw
  text: Kisha mpaka ukapinda kuizunguka kwa upande wa kaskazini wa Hanathoni[a], na ncha zake[b] zilikuwa katika Bonde la Yiftaeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kaskazini kuelekea Hanathoni.” Maneno ya Kiebrania yanaweza kueleweka kuwa yanaonyesha mahali (“upande wa kaskazini wa Hanathoni”) au mwelekeo (“kaskazini kuelekea Hanathoni”).
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “sehemu zake za kutokea”; hii ni istilahi ya mipaka inayomaanisha ncha au sehemu za mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Kisha ... ukapinda kuizunguka
  rationale: Katika maelezo ya mipaka, kitenzi נָסַב huonyesha mpaka unaogeuka au kupinda na kuzunguka mahali fulani. Kauli hii ni ya kawaida katika Kiswahili huku ikihifadhi mwendo wa mstari wa mpaka.
- source_word: אֹתוֹ
  choice: kuizunguka
  rationale: Kiambishi cha yambwa -i- kinawakilisha kitu au mahali palipotajwa katika muktadha wa maelezo ya mpaka, bila kukifanya kiwe mtu.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: Katika maelezo ya kugawa maeneo, גְּבוּל ni mstari unaotenga eneo moja na jingine; “mpaka” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: kwa upande wa kaskazini wa Hanathoni
  rationale: Muundo huu unaweza kuonyesha mahali mpaka ulipopita kuhusiana na Hanathoni. Tafsiri kuu inatoa maana ya upande wa kaskazini, huku tanbihi ikihifadhi uwezekano wa maana ya mwelekeo.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: na ncha zake zilikuwa
  rationale: תֹּצָאוֹת ni wingi na katika maelezo ya mipaka humaanisha ncha au sehemu za mwisho za mstari wa mpaka. “Ncha zake” huhifadhi wingi wa Kiebrania na kueleweka kijiografia.
- source_word: גֵּי
  choice: Bonde la
  rationale: גֵּי humaanisha bonde au korongo. “Bonde” linafaa hapa kama sehemu ya jina la mahali.
- source_word: יִפְתַּח אֵל
  choice: Yiftha-eli
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa kwa tahajia inayosomeka kwa Waswahili badala ya kutafsiriwa.
