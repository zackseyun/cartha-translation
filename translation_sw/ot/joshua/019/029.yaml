base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: sw
  text: Kisha mpaka ukageuka kuelekea Rama, hadi Tiro, mji wenye ngome. Halafu mpaka ukageuka kuelekea Hosa, na miisho yake iliishia baharini[a], kutoka eneo la Akzibu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea baharini,” yaani upande wa magharibi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka wilaya ya Akzibu” au “kutoka nchi ya Akzibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: ukageuka
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mpaka kubadili mwelekeo; ‘ukageuka’ ni cha kawaida na wazi katika Kiswahili.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: Neno hili hapa linamaanisha mstari unaotenga maeneo; ‘mpaka’ ndilo neno la kawaida la kijiografia katika Kiswahili.
- source_word: הָרָמָה
  choice: Rama
  rationale: Ni jina la mahali, limeandikwa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: עִיר מִבְצַר צֹר
  choice: Tiro, mji wenye ngome
  rationale: Tafsiri hii inaonyesha kuwa Tiro ndio mji unaoelezwa kuwa umeimarishwa kwa ngome, huku ikisomeka kwa urahisi katika Kiswahili.
- source_word: חֹסָה
  choice: Hosa
  rationale: Ni jina la mahali lililotoholewa kwa tahajia ya Kiswahili.
- source_word: וַיהיו תֹצְאֹתָיו
  choice: miisho yake ilikuwa
  rationale: Katika maelezo ya mipaka, תֹצָאוֹת hurejelea ncha au mahali mpaka unapofikia; ‘miisho yake’ huhifadhi wingi wa Kiebrania bila kutumia lugha ngumu ya kitaalamu.
- source_word: הַיָּמָּה
  choice: baharini
  rationale: Umbo lenye kiambishi cha mwelekeo kwa kawaida humaanisha kuelekea baharini, lakini likiambatana na ‘miisho’ linaweza kueleweka kuwa mpaka ulifikia bahari; ‘baharini’ huwasilisha matokeo hayo kwa Kiswahili cha kawaida.
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: kutoka eneo la Akzibu
  rationale: חֶבֶל hapa ni sehemu au eneo la ardhi, si ‘kamba’ halisi. Tafsiri hii inadumisha uhusiano wa ‘kutoka’ uliopo katika מֵ־ bila kulazimisha maana ya kiutawala.
