  text: And their border was Jezreel[a], Chesulloth[b], and Shunem.
translation:
  language: sw
  text: Mpaka wao ulielekea Yezreeli[a], Kesulothi[b], na Shunemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, jina “Yezreeli” lina kiishio kinachoonyesha mwelekeo, yaani “kuelekea Yezreeli” au “hadi Yezreeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Mpaka wao ulikuwa Yezreeli, Kesulothi, na Shunemu,” ikiwa kiishio cha mwelekeo katika jina la kwanza hakijaonyeshwa wazi katika tafsiri.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ulikuwa
  rationale: Muundo huu unaendeleza maelezo ya mpaka katika mfululizo; Kiswahili cha kawaida hutumia “ulikuwa” badala ya tafsiri ngumu ya neno kwa neno.
- source_word: גְּבוּלָם
  choice: mpaka wao
  rationale: גְּבוּל hutaja mpaka wa eneo, na kiambishi cha nafsi ya tatu wingi kimetafsiriwa “wao,” kikirejelea kabila linalozungumziwa katika muktadha.
- source_word: יִזְרְעֶאלָה
  choice: kuelekea Yezreeli
  rationale: Herufi ה ya mwelekeo iliyo mwishoni mwa jina inaonyesha mwelekeo wa kwenda au kuelekea mahali hapo; “kuelekea Yezreeli” huhifadhi maana hiyo bila kudai kwa hakika kuwa ndipo mwisho wa mpaka.
- source_word: הַכְּסוּלֹת
  choice: Kesulothi
  rationale: Ni jina la mahali; limeandikwa kwa namna inayosomeka kwa Kiswahili. Kihusishi cha utambulisho kilichotangulia jina katika Kiebrania hakihitaji kutafsiriwa kama neno tofauti.
- source_word: שׁוּנֵם
  choice: Shunemu
  rationale: Ni jina la mahali lililotoholewa kwa tahajia inayosomeka kwa Kiswahili.
