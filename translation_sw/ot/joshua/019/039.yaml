translation:
  language: sw
  text: Huu ndio ulikuwa[a] urithi wa kabila la wazao wa Naftali[b], kulingana na koo zao—miji na vijiji vyake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huu ndio urithi ...” Kiebrania hakina kitenzi kinachoonyesha wazi wakati katika sentensi hii; wakati uliopo au uliopita unaweza kutumiwa kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wana wa Naftali.” Usemi huu wa Kiebrania unamaanisha wazao au watu wa kabila la Naftali.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Huu ndio uliokuwa
  rationale: Kiwakilishi hiki kinarejelea urithi uliotajwa, na wakati uliopita unafaa katika muhtasari unaofuata orodha ya miji; hata hivyo, Kiebrania hakitaji wazi wakati wa kitenzi.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Katika muktadha wa ugawaji wa nchi, neno hili linamaanisha sehemu ya nchi iliyopokelewa kama urithi na linadumisha dhana ya nchi ya agano.
- source_word: מַטֵּה
  choice: kabila
  rationale: Hapa neno hili ni istilahi ya kawaida ya kundi la kikabila, si fimbo.
- source_word: בְנֵי נַפְתָּלִי
  choice: wazao wa Naftali
  rationale: Tafsiri hii ya kawaida na jumuishi inaeleza ukoo na wanakabila wa Naftali; maana halisi ‘wana wa Naftali’ imehifadhiwa katika tanbihi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: Katika ugawaji wa kikabila, מִשְׁפָּחָה ni ukoo, na kiambishi לְ hapa kinaonyesha ugawaji au upangaji kulingana na koo.
- source_word: הֶעָרִים
  choice: miji
  rationale: Hili ndilo neno la kawaida katika fomula za maeneo katika Yoshua, hata kama baadhi ya makazi yalikuwa madogo.
- source_word: וְחַצְרֵיהֶן
  choice: pamoja na vijiji vyake
  rationale: Neno חָצֵר hapa linaonyesha makazi madogo ya kandokando yaliyohusishwa na miji, si malisho.
