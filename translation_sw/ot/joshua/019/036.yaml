lexical_decisions:
- source_word: אֲדָמָה
  choice: Adama
  rationale: Ni jina la mahali katika orodha ya miji; limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kutafsiriwa kuwa neno la kawaida ‘ardhi/udongo’.
- source_word: הָרָמָה
  choice: Rama
  rationale: Ni jina la mahali. Kiwakilishi cha Kiebrania הָ־ hakijatafsiriwa kando, kwa kuwa katika jina hili ni sehemu iliyoganda au ya kimapokeo; umbo la Kiswahili ‘Rama’ ni la kawaida na la asili.
- source_word: חָצוֹר
  choice: Hazori
  rationale: Ni jina la mahali katika mgao wa kikabila; limetoholewa kwa umbo la kawaida la kibiblia la Kiswahili, si kutafsiriwa kwa maana inayowezekana ya mzizi wake.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hicho kinaunganisha majina katika orodha rahisi; Kiswahili cha kawaida hutumia ‘na’ kabla ya jina la mwisho.
