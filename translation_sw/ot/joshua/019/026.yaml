  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: sw
  text: Na Alameleki, Amadi na Mishali; mpaka ukafika Karmeli kuelekea magharibi[a], na Shihor-libnathi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kuelekea baharini”; katika muktadha wa kijiografia maana yake ni “kuelekea magharibi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלַּמֶּלֶךְ
  choice: Alameleki
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti na tahajia unaosomeka kwa urahisi katika Kiswahili.
- source_word: עַמְעָד
  choice: Amadi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; umbo hili linafaa matamshi ya kawaida ya Kiswahili.
- source_word: מִשְׁאָל
  choice: Mishali
  rationale: Jina la mahali limetoholewa kwa Kiswahili huku sauti kuu za jina la Kiebrania zikihifadhiwa.
- source_word: וּפָגַע
  choice: kisha mpaka ukafika
  rationale: Katika maelezo ya mipaka, kitenzi hiki humaanisha kufika au kukutana na sehemu fulani; kutaja 'mpaka' wazi kunafanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: בְּכַרְמֶל
  choice: Karmeli
  rationale: Kihusishi cha Kiebrania kinaonyesha mahali mpaka ulipofika; muundo wa Kiswahili baada ya 'ukafika' hauhitaji kihusishi kingine.
- source_word: הַיָּמָּה
  choice: kuelekea magharibi
  rationale: Neno hili kihalisi linaelekeza upande wa bahari, lakini katika jiografia ya Kiebrania humaanisha upande wa magharibi; tafsiri hii ni wazi na ya kawaida.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: na Shihor-libnathi
  rationale: Jina ambatani la mahali limetoholewa na kuunganishwa kwa kistari; kufika huko kunaeleweka kwa kuendeleza kitenzi kilichotangulia.
