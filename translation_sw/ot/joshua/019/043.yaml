  rationale: Jina la mahali limetoholewa kwa Kiswahili, likihifadhi konsonanti kuu za jina la Kiebrania na kuongeza irabu ya mwisho kwa matamshi ya kawaida.
- source_word: וְ
  choice: na
  rationale: Kiunganishi kilichorudiwa katika Kiebrania kimehifadhiwa mbele ya kila jina ili kuendeleza muundo wa orodha.
