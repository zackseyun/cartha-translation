  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya maeneo yametoholewa kwa fonolojia ya Kiswahili. Muundo wa orodha ya mpaka umehifadhiwa, huku 'ukapitia' ikifanya sentensi isomeke kwa kawaida.
