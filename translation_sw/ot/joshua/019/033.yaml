base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: sw
  text: Mpaka wao ulikuwa kutoka Helefu[a], kutoka kwenye mwaloni katika Saananimu, na Adami-Nekebu na Yabneeli hadi Lakumu; na mwisho wake ulikuwa kwenye Mto Yordani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka Eloni-Besaananimu”; Kiebrania kinaweza kusomwa ama kuwa jina la mahali ama kuwa “mwaloni katika/wa Saananimu.”
    reason: alternative_reading
  - marker: b
    text: Kiebrania, kihalisi, “miisho yake ilikuwa Yordani,” nahau ya mipaka inayomaanisha kwamba mpaka ulifikia Mto Yordani.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: mpaka wao
  rationale: Nomino hii humaanisha mpaka wa eneo; kiambishi cha wingi kinawarejelea watu wa Naftali waliotajwa kabla.
- source_word: מֵחֵלֶף
  choice: kutoka Helefu
  rationale: Ni jina la mahali, limetoholewa kwa mfumo unaosomeka kwa Kiswahili.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: kutoka kwenye mwaloni huko Saananimu
  rationale: אֵלוֹן hapa inaweza kuwa mti mkubwa, yaani mwaloni au mvinje, pamoja na jina la mahali linalofuata. Tafsiri kuu inafuata uchanganuzi huo, huku uwezekano wa jina la mahali lililounganishwa ukihifadhiwa katika tanbihi.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: ukapitia Adami-Nekebu
  rationale: Katika orodha hii ya mipaka, maneno haya yanaeleweka vizuri zaidi kuwa jina la mahali lililounganishwa. Kitenzi 'ukapitia' kinaonyesha mwendelezo wa mpaka kwa Kiswahili cha kawaida bila kubadili mwelekeo wa orodha.
- source_word: וְיַבְנְאֵל
  choice: na Yabneeli
  rationale: Ni jina la mahali lililotoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: עַד לַקּוּם
  choice: hadi Lakumu
  rationale: עַד huonyesha ukomo wa mwendo au eneo, hivyo 'hadi' ni sawa na ya kawaida.
- source_word: תֹּצְאֹתָיו
  choice: mwisho wake
  rationale: Kihalisi ni 'mahali pa kutokea' au 'miisho yake'; katika maelezo ya mipaka ni nahau inayotaja mahali mpaka unapofikia mwisho.
- source_word: הַיַּרְדֵּן
  choice: Mto Yordani
  rationale: Hili ndilo jina la kawaida la kijiografia kwa Kiswahili; kuongeza 'Mto' huweka wazi rejeo kwa msomaji wa leo.
