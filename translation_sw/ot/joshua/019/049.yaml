  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: sw
  text: Walipomaliza kuigawa nchi kwa kufuata mipaka yake,[a] Waisraeli[b] wakampa Yoshua mwana wa Nuni fungu la urithi miongoni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na maeneo yake.” Neno la Kiebrania linaweza kusisitiza mipaka au maeneo yaliyotengwa kwa mipaka hiyo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ לִנְחֹל
  choice: Walipomaliza kuigawa nchi kuwa urithi
  rationale: Muundo huu unaonyesha tendo lililokamilika kabla ya hatua inayofuata na unaipa נחל maana yake ya kugawa nchi kama urithi katika muktadha wa Yoshua 13–19.
- source_word: לִגְבוּלֹתֶיהָ
  choice: kwa kufuata mipaka yake
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo lililowekewa mipaka. Tafsiri hii inadumisha picha ya ugawaji uliofuata mipaka, huku tanbihi ikihifadhi uwezekano wa kumaanisha maeneo ya nchi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ndilo jina la kawaida na la asili katika Kiswahili kwa taifa lote. Maana halisi ya muundo wa Kiebrania imeonyeshwa katika tanbihi.
- source_word: נַחֲלָה
  choice: fungu la urithi
  rationale: Neno hili linaonyesha sehemu ya ardhi iliyotolewa rasmi kama urithi. ‘Fungu la urithi’ ni la asili zaidi hapa kuliko ‘urithi’ peke yake na linahifadhi maana ya kisheria na ya agano.
- source_word: בְּתוֹכָם
  choice: miongoni mwao
  rationale: Kifungu hiki kinaonyesha kwamba Yoshua alipokea fungu lake ndani ya mgao wa jumuiya ya Israeli, si nje yake.
theological_decisions:
- issue: Maana ya נַחֲלָה katika simulizi la kugawa nchi
  choice: fungu la urithi
  alternative: milki; sehemu
  rationale: ‘Fungu la urithi’ linahifadhi kwa pamoja wazo la sehemu iliyogawiwa na uzito wa urithi wa nchi katika agano, bila kulifanya neno hilo kuwa mali ya kawaida tu.
- issue: Uwakilishi wa בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Katika muktadha huu msemo wa Kiebrania ni jina la taifa lote. ‘Waisraeli’ ni Kiswahili cha kawaida na jumuishi, huku tafsiri ya neno kwa neno ikitolewa katika tanbihi ili uwazi wa chanzo udumishwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia mtiririko wa kawaida wa simulizi (‘Walipomaliza … wakampa’) na kuhifadhi istilahi ya msingi ya nchi kama urithi.
