  text: This was the inheritance of the sons of Zebulun according to their clans[a], these cities and their villages.
translation:
  language: sw
  text: 'Huu ulikuwa urithi wa wana wa Zabuloni kwa koo zao[a]: miji hii na vijiji vyake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Huu ndio urithi wa wana wa Zabuloni kwa koo zao.” Kiebrania kina kishazi kisicho na kitenzi; kwa hiyo katika muhtasari huu kinaweza kutafsiriwa kwa wakati wa sasa au uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Huu ulikuwa
  rationale: Kiwakilishi hiki cha kuonyesha kinarejelea urithi uliotajwa, na wakati uliopita unafaa katika muhtasari wa simulizi. Kwa kuwa kishazi cha Kiebrania hakina kitenzi, wakati wa sasa pia unawezekana.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Katika muktadha wa kugawa nchi, neno hili linamaanisha sehemu ya nchi iliyotolewa kuwa milki ya kudumu; “urithi” huhifadhi maana ya kisheria na ya agano.
- source_word: בְּנֵי זְבוּלֻן
  choice: wana wa Zabuloni
  rationale: Hili linafuata usemi wa kifamilia wa Kiebrania, unaotumika kwa ujumla kuhusu kabila lililotokana na Zabuloni.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: kwa koo zao
  rationale: Hapa kihusishi kinaonyesha mgawanyo kwa makundi ya ukoo; “kwa koo zao” ni fupi, ya kawaida, na inafaa katika muktadha wa kikabila.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: miji hii
  rationale: Usemi huu unajumlisha miji iliyoorodheshwa kabla yake.
- source_word: וְחַצְרֵיהֶן
  choice: na vijiji vyake
  rationale: Neno חָצֵר katika orodha za maeneo humaanisha makazi madogo yaliyohusishwa na miji; “vijiji” ni tafsiri ya wazi na ya kawaida. Kiwakilishi “vyake” kinarejelea miji hiyo kwa mujibu wa sarufi ya Kiswahili.
