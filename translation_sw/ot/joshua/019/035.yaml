lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: Nayo miji yenye ngome
  rationale: וְ inaendeleza orodha, na muundo עָרֵי מִבְצָר unaeleza miji iliyoimarishwa kwa ngome. “Miji yenye ngome” ni Kiswahili cha kawaida na chenye maana ya kijeshi iliyo katika Kiebrania.
- source_word: הַ/צִּדִּים
  choice: Sidimu
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili; kibainishi cha Kiebrania hakihitajiki kwa jina la mji katika orodha hii.
- source_word: צֵר
  choice: Seri
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: וְ/חַמַּת
  choice: Hamathi
  rationale: Jina la mahali limetoholewa kwa Kiswahili huku likihifadhi umbo lake la Kiebrania na kulitofautisha na majina mengine yanayofanana.
- source_word: רַקַּת
  choice: Rakathi
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili, huku konsonanti iliyokazwa ya katikati ikiwakilishwa kwa namna inayosomeka kiasili.
- source_word: וְ/כִנָּֽרֶת
  choice: na Kinerethi
  rationale: וְ imetafsiriwa “na,” na jina la mahali limetoholewa kwa mfumo wa tahajia unaoeleweka kwa wasomaji wa Kiswahili.
