  text: 'Na miji yenye ngome ilikuwa: Sidimu[a], Seri, Hamathi, Rakathi, na Kinerethi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miji ya ngome.”
