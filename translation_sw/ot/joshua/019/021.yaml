lexical_decisions:
- source_word: רֶמֶת
  choice: Remethi
  rationale: Ni jina la mahali katika orodha ya miji; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili badala ya kutafsiriwa.
- source_word: עֵין גַּנִּים
  choice: En-Ganimi
  rationale: Jina hili la mahali limeundwa kwa עֵין (‘chemchemi’) na גַּנִּים (‘bustani’). Kwa kuwa hapa ni jina rasmi la mji, limetoholewa katika matini kuu.
- source_word: עֵין חַדָּה
  choice: En-Hada
  rationale: Ni jina la mahali linaloanza kwa עֵין (‘chemchemi’); sehemu ya pili ina maana isiyo na uhakika katika jina hili, hivyo jina zima limetoholewa.
- source_word: בֵית פַּצֵּץ
  choice: Beth-Pazesi
  rationale: Ni jina la mahali lenye בֵית (‘nyumba ya’). Limetoholewa kwa sababu linafanya kazi kama jina la mji katika orodha hii.
- source_word: וְ
  choice: na
  rationale: Viunganishi vinavyorudiwa vinaunganisha majina ya mahali; mtindo wa kawaida wa orodha ya Kiswahili umetumia koma na ‘na’ kabla ya jina la mwisho.
