lexical_decisions:
- source_word: הָרַבִּית
  choice: Harabithi
  rationale: Jina la mahali limetoholewa kwa kufuata matamshi ya Kiebrania na mfumo wa sauti wa Kiswahili; herufi ya mwanzo ה imehifadhiwa kama sehemu ya jina.
- source_word: קִשְׁיוֹן
  choice: Kishioni
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili, huku mkondo wa sauti wa Kiebrania ukihifadhiwa.
- source_word: אָבֶץ
  choice: Abesi
  rationale: Jina la mahali limetoholewa moja kwa moja kutoka matamshi ya Kiebrania; vokali ya mwanzo imetolewa kama 'A' na konsonanti ya mwisho צ kama 's' katika umbo la Kiswahili.
- source_word: וְ / וָ
  choice: na
  rationale: Kiunganishi cha Kiebrania kinachorudiwa katika orodha kimewakilishwa kwa 'na' mbele ya kila jina ili kuhifadhi mtindo wa kuunganisha kila kipengele.
