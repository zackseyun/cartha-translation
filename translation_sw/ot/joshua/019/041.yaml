  yaml_path: translation/ot/joshua/019/041.yaml
  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
translation:
  language: sw
  text: Na mpaka wa urithi wao ulikuwa Sora, Eshtaoli, na Iri-shemeshi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iri-shemeshi maana yake ni “mji wa jua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Na ... ulikuwa
  rationale: Muundo wa masimulizi unaounganisha mstari huu na uliotangulia; Kiswahili cha kawaida hutumia kishirikishi ‘ulikuwa’ badala ya tafsiri ngumu ya ‘ikawa.’
- source_word: גְּבוּל
  choice: mpaka
  rationale: Katika muktadha wa kugawa nchi, neno hili linamaanisha mpaka wa eneo la urithi; ‘mpaka’ ni la kawaida na sahihi katika Kiswahili.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: Linadumisha wazo la sehemu ya nchi iliyorithiwa na kabila, huku kiambishi cha nafsi ya tatu wingi kikirejelea kabila la Dani.
- source_word: צָרְעָה
  choice: Sora
  rationale: Tahajia ya Kiswahili ya jina la mahali la Kiebrania צָרְעָה.
- source_word: אֶשְׁתָּאוֹל
  choice: Eshtaoli
  rationale: Tahajia iliyorekebishwa kwa mfumo wa sauti wa Kiswahili ya jina la mahali la Kiebrania אֶשְׁתָּאוֹל.
- source_word: עִיר שָׁמֶשׁ
  choice: Ir-shemeshi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa katika matini kuu; maana yake ya wazi imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. Majina ya mahali yametoholewa kwa tahajia inayosomeka kwa Waswahili, na maana ya jina Ir-shemeshi imewekwa katika tanbihi.
