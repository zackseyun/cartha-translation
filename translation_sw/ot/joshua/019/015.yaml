  text: וְ/קַטָּ֤ת וְ/נַֽהֲלָל֙ וְ/שִׁמְר֔וֹן וְ/יִדְאֲלָ֖ה וּ/בֵ֣ית לָ֑חֶם עָרִ֥ים שְׁתֵּים עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: sw
  text: 'Katati[a], Nahalali, Shimroni, Idala na Bethlehemu: miji kumi na miwili pamoja na vijiji vyake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bethlehemu katika mstari huu ni jina la mahali, si maneno yaliyotafsiriwa kuwa “nyumba ya mkate.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: Katati
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, badala ya kutafsiriwa.
- source_word: נַהֲלָל
  choice: Nahalali
  rationale: Jina la mahali limetoholewa kwa mtindo wa majina ya Biblia katika Kiswahili.
- source_word: שִׁמְרוֹן
  choice: Shimroni
  rationale: Jina la mahali limetoholewa huku konsonanti za Kiebrania zikihifadhiwa kwa namna inayosomeka kwa Waswahili.
- source_word: יִדְאֲלָה
  choice: Idala
  rationale: Jina la mahali limetoholewa; yod ya mwanzo imewakilishwa kwa I, na umbo hilo linasomeka kwa urahisi katika Kiswahili.
- source_word: בֵית לָחֶם
  choice: Bethlehemu
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa kwa umbo lililozoeleka katika Kiswahili badala ya kutafsiriwa kuwa ‘nyumba ya mkate’.
- source_word: עָרִים
  choice: miji
  rationale: Neno hili linaonyesha makazi yaliyotambuliwa katika orodha ya maeneo; ‘miji’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: kumi na miwili
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kuhesabu nomino ya ngeli ya miji.
- source_word: חַצְרֵיהֶן
  choice: vijiji vyake
  rationale: Katika orodha za mgao wa maeneo, neno hili hurejelea makazi madogo yaliyotegemea miji hiyo; ‘vijiji vyake’ linaeleza uhusiano huo kwa lugha ya kawaida.
