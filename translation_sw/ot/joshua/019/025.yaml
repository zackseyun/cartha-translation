  text: And their border was Helkath[a], Hali, Beten, and Akshaph.
translation:
  language: sw
  text: Mpaka wao ulikuwa Helkathi, Hali, Beteni na Akshafu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ulikuwa
  rationale: Kitenzi hiki kinaendeleza simulizi ya orodha ya mipaka; katika Kiswahili, “ulikuwa” huanzisha orodha hiyo kwa kawaida bila kulazimisha kiunganishi kisichohitajika.
- source_word: גְּבוּלָם
  choice: mpaka wao
  rationale: גְּבוּל hapa inaashiria mpaka wa eneo; “mpaka wao” ni usemi mfupi na wa kawaida katika muktadha wa kugawa nchi, na kiambishi cha nafsi ya tatu wingi kinarejelea kabila linalozungumziwa.
- source_word: חֶלְקַת
  choice: Helkathi
  rationale: Ni jina la mahali; limeandikwa kwa namna inayoweza kutamkwa kwa kawaida katika Kiswahili huku likikaribia umbo la Kiebrania.
- source_word: וַחֲלִי
  choice: Hali
  rationale: Ni jina la mahali; herufi ח imewakilishwa kwa “H” kwa usomaji wa kawaida wa Kiswahili.
- source_word: וָבֶטֶן
  choice: Beteni
  rationale: Ni jina la mahali; umbo “Beteni” linafuata matamshi ya kawaida ya majina ya kibiblia katika Kiswahili.
- source_word: וְאַכְשָׁף
  choice: Akshafu
  rationale: Ni jina la mahali; “Akshafu” linawakilisha kwa uwazi konsonanti za Kiebrania אַכְשָׁף katika muundo unaotamkika kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Majina ya mahali yametoholewa kwa matamshi ya Kiswahili. Tanbihi ya Kiingereza kuhusu tahajia mbadala ya Kiingereza “Achshaph” haikuhamishwa, kwa kuwa tofauti hiyo ya tahajia si ya maana katika tafsiri ya Kiswahili.
