lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: Beth-lebaoth
  rationale: Ni jina la mahali; limenukuliwa kwa herufi za Kilatini badala ya kutafsiriwa kihalisi kuwa ‘nyumba ya simba-jike,’ jambo ambalo lingeongeza tafsiri isiyo ya lazima katika orodha ya maeneo.
- source_word: שָׁרוּחֶן
  choice: Sharuhen
  rationale: Ni jina la mahali, na WLC hapa inasoma Sharuhen; kwa hiyo umbo hilo limenukuliwa badala ya kubadilishwa kuwa jina la orodha sambamba.
- source_word: עָרִים
  choice: miji
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa maeneo yaliyotajwa katika orodha za mgao wa nchi, hata kama baadhi yake huenda yalikuwa madogo.
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: kumi na mitatu
  rationale: Idadi imewasilishwa kwa Kiswahili cha kawaida, kwa upatanisho wa ngeli ya neno ‘miji.’
- source_word: חַצְרֵיהֶן
  choice: vijiji vyake
  rationale: Katika orodha za mgao wa nchi, neno hili humaanisha vijiji au makazi madogo yaliyotegemea miji iliyotajwa; ‘vijiji vyake’ ni wazi na ya asili kwa Kiswahili.
