translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wenye hadhi, unaofaa orodha ya maeneo. Majina ya mahali yamenukuliwa, na muundo wa kujumlisha miji pamoja na vijiji vyake umehifadhiwa.
