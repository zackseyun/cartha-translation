  text: 'Beth-lebaoth and Sharuhen: thirteen cities[a], with their villages.'
translation:
  language: sw
  text: 'Beth-lebaoth na Sharuhen: miji kumi na mitatu[a], pamoja na vijiji vyake.'
  philosophy: optimal-equivalence
  footnotes:
