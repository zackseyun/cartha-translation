  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Neno ‘mpaka’ limetajwa wazi kama kiima kilichodokezwa na muktadha. Marudio ya mwelekeo wa mashariki yamehifadhiwa kwa sababu yako katika chanzo, huku utata wa kishazi cha mwisho ukielezwa katika tanbihi badala ya kuondolewa kimya kimya.
