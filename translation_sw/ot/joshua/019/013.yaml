base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: sw
  text: Kutoka hapo, mpaka ukapita kuelekea mashariki[a], upande wa mawio ya jua, hadi Gath-heferi, hadi Eth-kazini[b]; ukatokea hadi Rimoni[c], unaoenea hadi Nea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutoka hapo mpaka ukapita upande wa mashariki.” Kiebrania kinatumia maneno mawili ya mwelekeo, kihalisi “kuelekea mashariki, kuelekea mawio ya jua,” huenda kwa ajili ya kusisitiza.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Eth-kazini”; wengine hulielewa umbo hili kuwa “Itha-kazini.”'
    reason: alternative_reading
  - marker: c
    text: Kiebrania cha kishazi hiki ni kigumu; kihalisi ni kama “Rimoni, uliowekewa alama, kuelekea Nea.” Wengi hukielewa kuwa mpaka ulienea kutoka Rimoni hadi Nea.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Kutoka hapo
  rationale: Muundo huu unaendeleza kwa kawaida maelezo ya hatua zinazofuatana za mpaka; kiunganishi cha Kiebrania kinaeleweka katika mfuatano bila kulazimika kutafsiriwa kwa neno tofauti.
- source_word: עָבַר
  choice: mpaka ukapita
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mstari wa mpaka ukisonga kutoka sehemu moja hadi nyingine. Kutaja ‘mpaka’ wazi kunafanya Kiswahili kiwe cha kawaida.
- source_word: קֵדְמָה מִזְרָחָה
  choice: kuelekea mashariki, upande wa mawio ya jua
  rationale: Maneno yote mawili ya mwelekeo yamehifadhiwa ili kuonyesha msisitizo wa Kiebrania badala ya kuyafupisha kuwa neno moja.
- source_word: גִּתָּה חֵפֶר
  choice: Gath-heferi
  rationale: Ni jina la mahali; umbo hili linafuata namna ya kawaida ya kuandika majina hayo katika Kiswahili.
- source_word: עִתָּה קָצִין
  choice: Eth-kazini
  rationale: Mgawanyo wa Kimasora unaeleweka zaidi kama jina moja la mahali katika orodha hii ya mipaka, ingawa usomaji wake si hakika kabisa.
- source_word: וְיָצָא
  choice: ukafika
  rationale: Katika fomula za mipaka, kitenzi hiki kinaweza kueleza mpaka unaotokea au kufikia mahali pengine. ‘Ukafika’ ni Kiswahili cha kawaida kinachohifadhi mwendo wa mpaka.
- source_word: רִמּוֹן
  choice: Rimoni
  rationale: Jina la mahali limetoholewa kwa namna ya kawaida ya Kiswahili.
- source_word: הַמְּתֹאָר
  choice: unaoenea
  rationale: Umbo hili ni gumu, lakini katika muktadha linaweza kueleza mpaka unaoendelea au kuenea kuelekea mahali panapofuata. Tanbihi inahifadhi uwezekano mwingine.
- source_word: הַנֵּעָה
  choice: hadi Nea
  rationale: Limechukuliwa kuwa jina la mahali na kama mwisho wa sehemu hii ya mpaka.
