  edition: WLC
  text: וְ/שָׁ֨ב הַ/גְּב֥וּל יָ֨מָּ/ה֙ אַזְנ֣וֹת תָּב֔וֹר וְ/יָצָ֥א מִ/שָּׁ֖ם חוּקֹ֑קָ/ה וּ/פָגַ֨ע בִּ/זְבֻל֜וּן מִ/נֶּ֗גֶב וּ/בְ/אָשֵׁר֙ פָּגַ֣ע מִ/יָּ֔ם וּ/בִ֣/יהוּדָ֔ה הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: sw
  text: Kisha mpaka ukageuka upande wa magharibi kuelekea Aznoth-tabori; kutoka huko ukaendelea hadi Hukoki. Ukafika Zabuloni upande wa kusini, ukafika Asheri upande wa magharibi, na Yuda kwenye Yordani, upande wa mashariki jua linapochomoza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema, “na Yuda kwenye Yordani, upande wa mashariki jua linapochomoza.” Jiografia ni tata, kwa kuwa kwa maana ya kawaida Naftali haikupakana moja kwa moja na eneo la kabila la Yuda. Wengine huelewa maneno haya kwa njia tofauti au hufikiri kwamba huenda matini ina tatizo, lakini hapa yametafsiriwa kama yalivyo katika Kiebrania.
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: Kisha mpaka ukageuka
  rationale: Katika maelezo ya mipaka, שׁוב hapa huonyesha mpaka kubadili mwelekeo; ‘ukageuka’ ni Kiswahili cha kawaida na hudumisha mfuatano wa simulizi.
- source_word: יָמָּה
  choice: kuelekea magharibi
  rationale: Neno hilo kihalisi linaelekeza upande wa bahari, yaani magharibi katika jiografia hii; tafsiri ya mwelekeo inaeleweka wazi kwa msomaji wa leo.
- source_word: אַזְנוֹת תָּבוֹר
  choice: Aznoth-tabori
  rationale: Ni jina la mahali; limetoholewa badala ya kutafsiriwa, huku umbo la mwisho likirahisisha matamshi ya Kiswahili.
- source_word: וְיָצָא מִשָּׁם
  choice: na kutoka huko ukaendelea
  rationale: Katika kauli za mipaka, יצא humaanisha mstari wa mpaka kuendelea kutoka mahali fulani; ‘ukaendelea’ ni ya asili kuliko tafsiri ya neno kwa neno ‘ukatoka.’
- source_word: חוּקֹקָה
  choice: hadi Hukoki
  rationale: Ni jina la mahali lililotoholewa; kiambishi cha mwelekeo katika Kiebrania kinawasilishwa kwa ‘hadi.’
- source_word: וּפָגַע
  choice: Ukafika
  rationale: פגע katika maelezo ya maeneo humaanisha mpaka kufikia au kukutana na eneo jingine; ‘ukafika’ ni wazi na haiongezi wazo lisilokuwapo.
- source_word: בִּזְבֻלוּן מִנֶּגֶב
  choice: Zabuloni upande wa kusini
  rationale: Inaonyesha eneo la Zabuloni likiwa upande wa kusini wa mpaka unaoelezwa.
- source_word: וּבְאָשֵׁר פָּגַע מִיָּם
  choice: ukafika Asheri upande wa magharibi
  rationale: Bahari hutumika kama rejeleo la magharibi; ‘upande wa magharibi’ huwasilisha maana ya kijiografia kwa uwazi.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן
  choice: na Yuda kwenye Yordani
  rationale: Maneno ya Kimasoreti yametafsiriwa kama yalivyo bila kurekebisha ugumu wa kijiografia.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: upande wa mashariki, upande wa mawio ya jua
  rationale: Tafsiri hii huhifadhi mwelekeo pamoja na taswira ya Kiebrania ya kuchomoza kwa jua.
theological_decisions:
- issue: Kauli yenye ugumu wa kijiografia ‘na Yuda kwenye Yordani upande wa mashariki’
  choice: Kudumisha maneno ya maandishi ya Kimasoreti katika matini kuu bila kuyapatanisha au kuyarekebisha.
  alternative: Kulainisha kauli ili isionekane kwamba eneo la Naftali liligusana moja kwa moja na Yuda, au kudhani kwamba ‘Yuda’ ni hitilafu ya kunakili.
  rationale: Ingawa suala hili si la kimafundisho moja kwa moja, lina uzito wa kiuandishi na kiufafanuzi. Tafsiri inapaswa kuhifadhi ushahidi wa Kiebrania na kueleza ugumu huo katika tanbihi badala ya kuutatua kimya kimya.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimebaki katika mtindo wa maelezo ya mpaka, lakini marudio ya ‘ukafika’ yametumiwa ili orodha ya maeneo ieleweke kwa urahisi. Majina ya makabila yamefuata maumbo yanayotambulika katika Kiswahili: Zabuloni, Asheri na Yuda.'
