translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Muundo “ikawa ya Simeoni” umetumiwa ili kuepuka usemi usio wa asili “ikatokea kwa Simeoni,” huku tanbihi ikihifadhi taswira ya Kiebrania. Marudio ya “urithi” yamedumishwa kwa sababu ni neno kuu la kifungu.
