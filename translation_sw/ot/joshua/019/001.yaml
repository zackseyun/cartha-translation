base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: sw
  text: Kura ya pili ikamwangukia Simeoni[a], kwa ajili ya kabila la wana wa Simeoni[b], kulingana na koo zao; na urithi wao ulikuwa ndani ya urithi wa wana wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kura ya pili ikawa ya Simeoni.” Kitenzi cha Kiebrania kwa maana halisi ni “ilitoka,” nacho hapa kinahusu matokeo ya kupiga kura.
    reason: lexical_alternative
  - marker: b
    text: “Wana wa Simeoni” na “wana wa Yuda” ni majina ya kikabila ya Kiebrania; yanamaanisha wazao au watu wa makabila hayo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ikawa ya
  rationale: Katika muktadha wa kupiga kura kwa ajili ya ugawaji wa ardhi, Kiswahili cha kawaida husema kura “ikawa ya” mtu au kundi. Tanbihi inahifadhi taswira halisi ya kitenzi cha Kiebrania, “ilitoka.”
- source_word: הַגּוֹרָל הַשֵּׁנִי
  choice: Kura ya pili
  rationale: “Kura” inaonyesha utaratibu wa kuamua mgawo, wala si eneo la urithi lenyewe; “ya pili” inatafsiri moja kwa moja namba ya mpangilio.
- source_word: לְשִׁמְעוֹן
  choice: ya Simeoni
  rationale: Kiambishi לְ kinaonyesha mpokeaji wa kura; katika muundo huu “ya Simeoni” ni Kiswahili cha asili na wazi.
- source_word: לְמַטֵּה
  choice: kabila la
  rationale: Katika masimulizi ya ugawaji wa nchi, מַטֶּה humaanisha kabila, si fimbo.
- source_word: בְנֵי שִׁמְעוֹן
  choice: wana wa Simeoni
  rationale: Inadumisha usemi wa ukoo wa Kiebrania, huku tanbihi ikifafanua kwamba ni jina la kikabila.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: kulingana na koo zao
  rationale: “Koo” inaeleza vizuri zaidi vitengo vikubwa vya kijamii ndani ya kabila kuliko “familia” katika maana yake ya kisasa.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: “Urithi” huhifadhi maana ya eneo walilopewa kuwa milki pamoja na mwangwi wake wa kisheria na wa agano.
- source_word: בְּתוֹךְ
  choice: ndani ya
  rationale: Inaonyesha kwamba eneo la Simeoni lilipatikana ndani ya eneo lililokuwa urithi wa Yuda.
- source_word: נַחֲלַת בְּנֵי יְהוּדָה
  choice: urithi wa wana wa Yuda
  rationale: Inadumisha neno “urithi” kwa uthabiti na kuhifadhi usemi wa kikabila wa Kiebrania.
