lexical_decisions:
- source_word: עֶבְרֹן
  choice: Ebroni
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili kutoka umbo la Kiebrania la WLC; usomaji tofauti ‘Abdoni’ umewekwa katika tanbihi.
- source_word: רְחֹב
  choice: Rehobu
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti unaosomeka kwa urahisi katika Kiswahili, huku konsonanti kuu za Kiebrania zikihifadhiwa.
- source_word: חַמּוֹן
  choice: Hamoni
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: קָנָה
  choice: Kana
  rationale: Jina la mahali limetoholewa moja kwa moja na kwa namna inayosomeka kiasili katika Kiswahili.
- source_word: עַד
  choice: mpaka
  rationale: Katika muktadha wa mpaka wa eneo, ‘mpaka’ huonyesha kikomo cha kufika kwa ufasaha na usahihi.
- source_word: צִידוֹן רַבָּה
  choice: Sidoni Mkuu
  rationale: Kivumishi cha Kiebrania kinaonyesha umaarufu au ukubwa wa mji; ‘Sidoni Mkuu’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
