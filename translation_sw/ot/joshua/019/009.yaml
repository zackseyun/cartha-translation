id: JOS.19.9
reference: Joshua 19:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: sw
  text: Urithi wa wazao wa Simeoni ulitoka katika sehemu ya wazao wa Yuda,[a] kwa sababu sehemu ya wazao wa Yuda ilikuwa kubwa mno kwao; kwa hiyo wazao wa Simeoni walipokea urithi wao ndani ya urithi wa Yuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika eneo la wazao wa Yuda.” Neno la Kiebrania חֶבֶל linaweza kumaanisha sehemu au eneo la ardhi lililopimwa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, ardhi waliyogawiwa wazao wa Simeoni ilikuwa ndani ya eneo lililogawiwa Yuda.
    reason: cultural_note
lexical_decisions:
- source_word: מֵ/חֶבֶל
  choice: katika sehemu
  rationale: Katika muktadha wa kugawa ardhi, חֶבֶל ni sehemu au eneo lililopimwa. “Sehemu” ni ya kawaida na inaendana na wazo la mgao wa ardhi.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Katika Yoshua, נַחֲלָה humaanisha ardhi iliyogawiwa kuwa milki ya kudumu; “urithi” huhifadhi maana hiyo kuliko neno la kiutawala pekee.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: wazao wa Yuda / wazao wa Simeoni
  rationale: “Wazao wa” huwasilisha בני kwa Kiswahili cha kawaida na chenye heshima, huku ikionyesha kwamba majina hayo yanawakilisha makabila.
- source_word: חֵלֶק
  choice: sehemu
  rationale: חֵלֶק ni fungu au sehemu iliyogawiwa. Kurudia “sehemu” ni wazi na hakubadili uhusiano wake na mgao wa ardhi.
- source_word: רַב מֵהֶם
  choice: ilikuwa kubwa mno kwao
  rationale: Kirai hiki kinaonyesha kuwa sehemu ya Yuda ilizidi kiasi walichohitaji; “kubwa mno kwao” huhifadhi maana ya ulinganisho na ziada.
- source_word: וַיִּנְחֲלוּ
  choice: walipokea urithi wao
  rationale: Kitenzi נחל hapa kinahusu kupata ardhi iliyogawiwa kuwa urithi; usemi huu ni wazi katika Kiswahili cha sasa.
- source_word: בְּתוֹךְ נַחֲלָתָם
  choice: ndani ya urithi wa Yuda
  rationale: בְּתוֹךְ huonyesha eneo lililo ndani ya jingine. Kutaja Yuda wazi kunabainisha kiwakilishi cha Kiebrania kulingana na muktadha na kuzuia utata wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wazao wa” limetumiwa kwa majina ya kikabila, na “urithi” limedumishwa kama istilahi kuu ya ardhi iliyogawiwa.
