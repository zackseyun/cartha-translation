lexical_decisions:
- source_word: חֲפָרַיִם
  choice: Hafaraimu
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili; halitafsiriwi maana yake.
- source_word: שִׁיאֹן
  choice: Shioni
  rationale: Jina la mahali limetoholewa kwa kufuata sauti za Kiebrania na muundo wa kawaida wa majina ya kibiblia katika Kiswahili.
- source_word: אֲנָחֲרַת
  choice: Anaharati
  rationale: Jina la mahali limetoholewa; herufi h inawakilisha kwa urahisi konsonanti ya koo ya Kiebrania bila kujaribu kutafsiri jina.
- source_word: וַ / וְ
  choice: na
  rationale: Viambishi hivi vinaunganisha majina katika orodha; Kiswahili cha kawaida hutumia koma na 'na' kabla ya jina la mwisho.
