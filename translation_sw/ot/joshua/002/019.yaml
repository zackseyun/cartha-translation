  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: sw
  text: Yeyote atakayetoka nje kupitia milango ya nyumba yako, damu yake itakuwa juu ya kichwa chake, nasi hatutakuwa na hatia; lakini yeyote atakayekuwa pamoja nawe ndani ya nyumba, damu yake itakuwa juu ya vichwa vyetu[a], ikiwa mtu yeyote atamdhuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “damu yake itakuwa juu ya kichwa chake” na “damu yake itakuwa juu ya vichwa vyetu” ni misemo ya kisheria inayoonyesha anayewajibika kwa umwagaji damu au kifo.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: halijawakilishwa kwa neno tofauti
  rationale: Katika muktadha huu umbo hili linaanzisha sharti linalofuata; Kiswahili cha kawaida kinaweza kulieleza sharti moja kwa moja bila fomula tofauti.
- source_word: כֹּל אֲשֶׁר
  choice: yeyote atakaye-
  rationale: Kirai hiki kinawahusu watu mmoja mmoja kwa maana ya kugawa; “yeyote atakaye-” ni cha kawaida na kinahifadhi maana hiyo.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: atakayetoka nje kupitia milango ya nyumba yako
  rationale: “Atakayetoka nje” huonyesha mwelekeo, huku “kupitia milango” ikihifadhi taswira ya milango ya nyumba bila kurudia maneno yasiyo ya kawaida.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: damu yake itakuwa juu ya kichwa chake mwenyewe
  rationale: Taswira ya kisheria ya Kiebrania imehifadhiwa; inaweka wajibu wa umwagaji damu au kifo juu ya mtu huyo mwenyewe.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: nasi hatutakuwa na hatia
  rationale: Hii inaeleza kutokuwa na wajibu au hatia chini ya kiapo kwa Kiswahili cha wazi na cha kisheria.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: lakini yeyote atakayekuwa pamoja nawe ndani ya nyumba
  rationale: “Lakini” huonyesha utofauti wa sharti hili na lile la kwanza, nalo linamhusu kila mtu anayebaki ndani ya nyumba.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: damu yake itakuwa juu ya vichwa vyetu
  rationale: Ulinganifu na usemi wa kwanza umehifadhiwa, pamoja na maana yake ya kuwajibika kwa damu ya mtu huyo.
- source_word: אִם יָד תִּהְיֶה בוֹ
  choice: ikiwa mtu yeyote atamdhuru
  rationale: Usemi halisi wenye “mkono” humaanisha kutendewa kwa nguvu au kudhuriwa. Tafsiri hii ya kawaida inaweka wazi kitendo kinachokusudiwa bila kubainisha mtu maalumu kuwa mtendaji.
theological_decisions:
- issue: Kuhifadhi usemi wa uwajibikaji wa damu
  choice: “damu yake itakuwa juu ya kichwa chake mwenyewe / juu ya vichwa vyetu”
  alternative: “atawajibika mwenyewe kwa kifo chake / sisi tutawajibika kwa kifo chake”
  rationale: Kuhifadhi usemi wa Kiebrania kunadumisha uzito wa agano na lugha ya kisheria; tanbihi inaeleza maana yake bila kuondoa taswira hiyo katika matini.
- issue: Umoja wa mtu asiyeainishwa
  choice: Kutumia “yeyote” pamoja na viambishi vya umoja
  alternative: Kutumia muundo wa wingi kama “wote watakao-”
  rationale: Kiebrania kinamwasilisha mtu yeyote mmoja mmoja. Kiswahili linaweza kuhifadhi maana hii kwa kawaida bila kuingiza jinsia ambayo haijabainishwa na nomino.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Ulinganifu wa misemo miwili ya damu umehifadhiwa, na alama ya tanbihi [a] imewekwa katika matini.
