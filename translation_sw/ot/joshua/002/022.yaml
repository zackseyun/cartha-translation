  text: וַ/יֵּלְכוּ֙ וַ/יָּבֹ֣אוּ הָ/הָ֔רָ/ה וַ/יֵּ֤שְׁבוּ שָׁם֙ שְׁלֹ֣שֶׁת יָמִ֔ים עַד שָׁ֖בוּ הָ/רֹדְפִ֑ים וַ/יְבַקְשׁ֧וּ הָ/רֹדְפִ֛ים בְּ/כָל הַ/דֶּ֖רֶךְ וְ/לֹ֥א מָצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: sw
  text: Basi wakaenda hadi nchi ya vilima[a], wakakaa huko siku tatu, mpaka wale waliowafuatilia waliporudi. Wale waliowafuatilia walitafuta kotekote njiani, lakini hawakuwapata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlimani” au “kwenye vilima.” Inaelekea kwamba Kiebrania kinamaanisha nchi ya vilima magharibi mwa Yeriko, si kilele kimoja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: wakaenda hadi
  rationale: Mfuatano halisi ‘wakaenda wakafika’ ungekuwa mzito katika Kiswahili; ‘wakaenda hadi’ huwasilisha mwendo na kufika mahali walikokusudia kwa kawaida.
- source_word: הָהָרָה
  choice: nchi ya vilima
  rationale: Nomino ya Kiebrania ni umoja lakini inaweza kutaja eneo la milima au vilima; katika mazingira ya Yeriko, ‘nchi ya vilima’ inaeleza eneo bila kulazimisha maana ya kilele kimoja.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: wakakaa huko
  rationale: Kitenzi ישב hapa kinaonyesha kukaa kwa muda, si kuishi au kuhamia mahali hapo kabisa.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: siku tatu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya idadi na nomino.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: mpaka wale waliowafuatilia waliporudi
  rationale: Neno שוב lina maana ya kurudi, na participo הָרֹדְפִים humaanisha watu waliokuwa wakiwafuatilia.
- source_word: וַיְבַקְשׁוּ
  choice: walitafuta
  rationale: Katika muktadha wa msako, ‘walitafuta’ ni kauli ya kawaida na huonyesha jitihada za kuwapata.
- source_word: בְּכָל הַדֶּרֶךְ
  choice: kotekote njiani
  rationale: Kauli hii huhifadhi wazo la kutafuta katika urefu wote wa njia bila kudai kwamba מדובר ni barabara iliyojengwa.
- source_word: וְלֹא מָצָאוּ
  choice: lakini hawakuwapata
  rationale: ‘Lakini’ huwasilisha utofauti wa kimuktadha, na kiambishi cha yambwa ‘-wa-’ huweka wazi kwamba watu hao wawili ndio hawakupatikana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ulio wa kawaida na wa heshima. ‘Wale waliowafuatilia’ ni wazi zaidi kuliko nomino nzito kama ‘wafuatiliaji,’ huku ‘kotekote njiani’ kikidumisha maana ya utafutaji katika njia yote.
