  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: sw
  text: Basi mfalme wa Yeriko akatuma kwa Rahabu, akisema, “Watoe nje wanaume waliokuja kwako, walioingia nyumbani mwako, kwa maana wamekuja kuipeleleza[a] nchi yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuichunguza nchi yote.” Kitenzi cha Kiebrania katika muktadha huu kinaweza kumaanisha kufanya upelelezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma ujumbe
  rationale: Kitenzi שׁלח kimsingi ni ‘kutuma.’ Katika muktadha huu, mfalme anatuma agizo kwa Rahabu; ‘akatuma ujumbe’ ni Kiswahili cha kawaida kinachoonyesha mawasiliano hayo bila kudai kwamba mfalme mwenyewe alikwenda.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: mfalme wa Yeriko
  rationale: Muundo wa umilikaji katika Kiebrania unaonyeshwa kwa kawaida na ‘wa’ katika Kiswahili.
- source_word: אֶל רָחָב
  choice: kwa Rahabu
  rationale: אֶל inaonyesha anayelengwa au anayepokea ujumbe. ‘Kwa Rahabu’ ni ya asili baada ya ‘akatuma ujumbe.’
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni utangulizi wa kawaida wa maneno yaliyonukuliwa; ‘akisema’ hudumisha mtiririko wa masimulizi.
- source_word: הוֹצִיאִי
  choice: Watoe nje
  rationale: Amri ya Hiphil kutoka יצא inamaanisha kuwasababisha watoke. ‘Watoe nje’ inahifadhi nguvu ya agizo lililoelekezwa kwa Rahabu.
- source_word: הָאֲנָשִׁים
  choice: watu
  rationale: אֲנָשִׁים hapa ni wanaume waliotumwa kuipeleleza nchi, lakini Kiswahili cha kawaida kinaweza kuwarejelea kama ‘watu’; muktadha tayari unawatambulisha bila kulazimisha marudio yasiyo ya asili.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: waliokuja kwako
  rationale: Kirai cha participle kinaeleza watu hao kwa tukio lililokwisha kutokea; wakati uliopita unafaa katika simulizi.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: walioingia nyumbani mwako
  rationale: Ingawa בוא inaweza kuwa ‘kuja,’ hapa kuingia nyumbani kunaeleza mwendo kwa usahihi na huepuka marudio mazito ya ‘kuja.’
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inatanguliza sababu ya agizo. ‘Kwa maana’ ni ya kawaida na yenye hadhi katika usemi wa moja kwa moja.
- source_word: לַחְפֹּר
  choice: kuipeleleza
  rationale: Katika muktadha huu חפר ina maana ya kuchunguza kwa siri au kufanya upelelezi, si kuchimba halisi. ‘Kuipeleleza’ huwasilisha maana ya upelelezi wa nchi kwa uwazi na kawaida.
- source_word: אֶת כָּל הָאָרֶץ
  choice: nchi yote
  rationale: הָאָרֶץ inarejelea eneo au nchi inayozungumziwa, si dunia nzima. ‘Nchi yote’ ni tafsiri ya asili.
- source_word: בָּאוּ
  choice: wamekuja
  rationale: Wakati timilifu wa Kiswahili unaonyesha kwamba kuja kwao kumetokea na bado ndiko msingi wa agizo la sasa.
