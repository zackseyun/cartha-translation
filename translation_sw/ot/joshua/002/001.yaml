reference: Joshua 2:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: sw
  text: Ndipo Yoshua mwana wa Nuni akawatuma kwa siri wanaume wawili kutoka Shitimu wakiwa wapelelezi. Akawaambia, “Nendeni mkaiangalie nchi na Yeriko.”[a] Basi wakaenda, wakaingia katika nyumba ya mwanamke kahaba aliyeitwa Rahabu,[b] wakajilaza huko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “nchi na Yeriko.” Huenda kinataja nchi kwa ujumla na Yeriko hasa.
    reason: lexical_alternative
  - marker: b
    text: Au, kulingana na maoni ya baadhi ya watu, “nyumba ya mwenye nyumba ya wageni.” Hata hivyo, neno la Kiebrania kwa kawaida humaanisha “kahaba.”
    reason: alternative_reading
  - marker: c
    text: Au “wakakaa huko usiku.” Kiebrania kinasema kihalisi “wakajilaza huko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akawatuma
  rationale: Ni tafsiri ya kawaida ya שלח katika simulizi, nayo inaonyesha Yoshua aliwatuma wale wanaume wawili bila kuongeza maana nyingine.
- source_word: מִן הַשִּׁטִּים
  choice: kutoka Shitimu
  rationale: Shitimu ni jina la mahali; limetoholewa badala ya kutafsiriwa kuwa ‘Kichaka cha Migunga.’
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: wanaume wawili
  rationale: Kiebrania kinataja watu wawili wa kiume, na Kiswahili hiki kinaonyesha jambo hilo wazi.
- source_word: מְרַגְּלִים
  choice: wakiwa wapelelezi
  rationale: Neno hili linaonyesha jukumu lao la kuchunguza nchi kwa siri; ‘wapelelezi’ ni la kawaida na linafaa katika muktadha wa kijeshi.
- source_word: חֶרֶשׁ
  choice: kwa siri
  rationale: Hapa neno linafanya kazi kama kielezi kinachoonyesha kwamba utume ulifanywa bila kujulikana.
- source_word: לְכוּ רְאוּ
  choice: Nendeni mkaiangalie
  rationale: Muundo huu wa Kiswahili unaonyesha amri mbili zilizounganishwa na kusudi la kwenda kuichunguza nchi.
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: nchi na Yeriko
  rationale: Inafuata uratibu wa Kiebrania kwa karibu bila kuamua kimyakimya kwamba Yeriko ni maelezo ya ‘nchi’ au lengo maalumu ndani yake.
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: nyumbani kwa mwanamke kahaba
  rationale: זוֹנָה kwa kawaida humaanisha kahaba. Tafsiri hii ni ya moja kwa moja na haipunguzi maana ya wazi ya neno.
- source_word: וּשְׁמָהּ רָחָב
  choice: aliyeitwa Rahabu
  rationale: Ni usemi wa kawaida wa Kiswahili wa kumtambulisha mwanamke huyo kwa jina bila kubadili maana.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: wakajilaza huko
  rationale: שכב kimsingi ni ‘kulala chini/kujilaza.’ Tafsiri hii huhifadhi usemi wa maandishi bila kudokeza tendo la ngono wala kufafanua kupita kiasi kwamba walipanga malazi rasmi.
theological_decisions:
- issue: Kazi ya Rahabu (זוֹנָה)
  choice: mwanamke kahaba
  alternative: mwenye nyumba ya wageni
  rationale: Maana ya kawaida ya זוֹנָה ni kahaba. ‘Mwenye nyumba ya wageni’ hutokana na jaribio la kufasiri muktadha au mapokeo, si maana ya msingi ya neno lenyewe.
- issue: Maana ya וַיִּשְׁכְּבוּ שָׁמָּה
  choice: wakajilaza huko
  alternative: wakakaa huko usiku
  rationale: Usemi wa Kiebrania unasema kihalisi kwamba walijilaza huko. Tafsiri iliyochaguliwa haiingizi wazo la ngono, wala haifuti uwezekano kwamba maana ya kimuktadha ni kukaa huko usiku.
- issue: Uhusiano kati ya ‘nchi’ na ‘Yeriko’
  choice: nchi na Yeriko
  alternative: nchi, hasa Yeriko
  rationale: Kiunganishi cha Kiebrania ni ‘na.’ Kukihifadhi kunaacha wazi mvutano wa kisarufi kati ya eneo lote kwa ujumla na Yeriko kama lengo linalotajwa hasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Majina yametoholewa kama Yoshua, Nuni, Shitimu, Yeriko na Rahabu. ‘Kahaba’ ni neno la kawaida na la moja kwa moja, huku ‘wakajilaza’ kikihifadhi utata wa maandishi ya Kiebrania.
