base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: sw
  text: Na lango lilipokuwa karibu kufungwa giza lilipoanza kuingia[a], wanaume wale wakatoka. Sijui wanaume wale walikokwenda. Wafuateni upesi, kwa maana mtawafikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulipokuwa na giza”; kirai cha Kiebrania kinaonyesha wakati wa kufungwa kwa lango, giza lilipokuwa likianza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Na ... lilipokuwa
  rationale: Muundo huu unaanzisha tukio linalofuata na wakati wake kwa Kiswahili cha masimulizi bila kutumia fomula nzito kama “ikawa kwamba.”
- source_word: הַשַּׁעַר
  choice: lango
  rationale: Neno hilo humaanisha lango; muktadha unaonyesha kuwa ni lango la mji, hivyo hakuna haja ya kuongeza “la mji” katika matini.
- source_word: לִסְגֹּר
  choice: lilikuwa karibu kufungwa
  rationale: Kitenzi-jina chenye ל katika muundo huu kinaonyesha tendo lililokuwa linakaribia kutokea, si lazima kwamba kufungwa tayari kulikuwa kumeanza.
- source_word: בַּחֹשֶׁךְ
  choice: wakati wa kuingia giza
  rationale: Kirai kinaonyesha muda wa kufungwa kwa lango, yaani mwanzo wa giza; tafsiri hii ni ya kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: watu hao wakatoka
  rationale: יצא ni “kutoka.” “Watu hao” huwarejelea wanaume waliotajwa katika muktadha huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: לֹא יָדַעְתִּי
  choice: Sijui
  rationale: Ingawa umbo la Kiebrania ni timilifu, katika usemi wa moja kwa moja linaeleza hali ya sasa ya kutokujua.
- source_word: אָנָה הָלְכוּ
  choice: walikokwenda
  rationale: אָנָה huuliza mahali panapolengwa; “walikokwenda” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: הָאֲנָשִׁים
  choice: watu hao
  rationale: Kurudiwa kwa nomino kumehifadhiwa badala ya kutumia kiwakilishi pekee, kama ilivyo katika Kiebrania.
- source_word: רִדְפוּ
  choice: Wafuateni
  rationale: Amri hii inataka ufuatiliaji wa haraka wa watu wanaokimbia; “wafuateni” ni ya kawaida na inafaa muktadha.
- source_word: מַהֵר
  choice: upesi
  rationale: Kielezi hiki kinaonyesha namna ya kutekeleza amri bila kuongeza maana isiyokuwapo katika Kiebrania.
- source_word: אַחֲרֵיהֶם
  choice: -wa- katika “Wafuateni”
  rationale: Kitenzi “fuata” pamoja na kiambishi cha yambwa tayari kinawasilisha maana ya kuwafuata wao bila kurudia kirai kisicho cha lazima.
- source_word: כִּי תַשִּׂיגֻם
  choice: kwa maana mtawafikia
  rationale: כִּי hutoa sababu ya amri, na נשׂג katika Hifili humaanisha kuwafikia au kuwapata watu wanaofuatwa; “mtawafikia” huhifadhi taswira ya kuwafikia katika mbio.
