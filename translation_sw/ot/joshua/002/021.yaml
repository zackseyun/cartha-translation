  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: sw
  text: Akasema, “Kama mlivyosema, iwe hivyo.” Kisha akawaacha waende, nao wakaenda; akaifunga ile kamba nyekundu dirishani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ule mstari mwekundu.” Neno la Kiebrania linaweza kumaanisha kamba, mstari, au kamba nene iliyotumiwa kuwa alama inayoonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: Kama mlivyosema
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya kufuata maneno au masharti waliyotamka wale watu wawili; kiambishi cha nafsi ya pili wingi kinahifadhiwa katika “mlivyosema.”
- source_word: כֵּן הוּא
  choice: na iwe hivyo
  rationale: Ni kauli ya kukubali masharti; “na iwe hivyo” ni ya asili na yenye hadhi katika Kiswahili, bila kuongeza maana.
- source_word: וַתְּשַׁלְּחֵם
  choice: akawaaga
  rationale: Katika muktadha huu שלח ina maana ya kuwaacha waondoke au kuwaaga baada ya mazungumzo. “Akawaaga” ni ya asili katika simulizi, ingawa maana yake ya msingi ni “akawaacha waende/akawapeleka.”
- source_word: וַיֵּלֵכוּ
  choice: nao wakaenda
  rationale: Huhifadhi tendo rahisi la kwenda na mfuatano wa simulizi wa Kiebrania.
- source_word: וַתִּקְשֹׁר
  choice: akaifunga
  rationale: קשר ni kufunga au kushikamanisha; “akaifunga” inafaa kwa kuweka kamba mahali ilipoonekana.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: ile kamba nyekundu
  rationale: Katika muktadha huu תִּקְוָה si “tumaini” bali kitu halisi kama kamba au uzi mnene, na שָׁנִי huonyesha rangi nyekundu angavu. “Kamba nyekundu” ni wazi kwa msomaji wa kawaida.
- source_word: בַּחַלּוֹן
  choice: dirishani
  rationale: Kiambishi ב kinaonyesha mahali; “dirishani” ni tafsiri ya asili ya Kiswahili kwa kitu kilichofungwa kwenye au katika eneo la dirisha.
