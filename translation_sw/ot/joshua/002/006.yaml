  text: But she had brought them up to the roof and hidden them among the stalks of flax laid out for her on the roof.
translation:
  language: sw
  text: Lakini yeye alikuwa amewapandisha juu ya paa na kuwaficha kati ya mashina ya kitani yaliyokuwa yamepangwa kwa ajili yake juu ya paa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגָּגָה / עַל הַגָּג
  choice: juu ya paa
  rationale: Nomino גג humaanisha paa tambarare la nyumba; kishazi hiki ni cha kawaida na wazi katika Kiswahili cha Afrika Mashariki.
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: kati ya mashina ya kitani
  rationale: Kihalisi ni kitani katika hali ya mashina au mabua; “mashina ya kitani” yanaonyesha kuwa mimea ilikuwa imewekwa ili ikauke au ichakatwe bila kuongeza maelezo yasiyotajwa.
- source_word: הָעֲרֻכוֹת
  choice: yaliyokuwa yamepangwa
  rationale: Umbo hili linaonyesha vitu vilivyowekwa au kupangwa; tafsiri hii huhifadhi hali hiyo bila kudokeza namna maalumu ya mpangilio.
- source_word: לָהּ
  choice: kwa ajili yake
  rationale: Kiwakilishi cha kike chenye ל־ kinaweza kuonyesha milki au manufaa; “kwa ajili yake” huhifadhi kwa uwazi maana inayowezekana ya kuwa kitani kilikuwa chake au kimeandaliwa kwa matumizi yake.
