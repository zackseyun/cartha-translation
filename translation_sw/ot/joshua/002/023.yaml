  text: וַ/יָּשֻׁ֜בוּ שְׁנֵ֤י הָֽ/אֲנָשִׁים֙ וַ/יֵּרְד֣וּ מֵֽ/הָ/הָ֔ר וַ/יַּעַבְרוּ֙ וַ/יָּבֹ֔אוּ אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וַ/יְסַ֨פְּרוּ ל֔/וֹ אֵ֥ת כָּל הַ/מֹּצְא֖וֹת אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: sw
  text: Kisha wale watu wawili wakarudi, wakashuka kutoka eneo la milima, wakavuka, wakafika kwa Yoshua mwana wa Nuni, nao wakamsimulia yote yaliyowapata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yote yaliyowakuta”; kihalisi zaidi, “mambo yote yaliyowapata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: wakarudi
  rationale: Kitenzi שוב katika mfululizo huu wa simulizi kinaonyesha kwamba wale watu walirudi kutoka katika kazi yao; “wakarudi” ni Kiswahili cha kawaida na sahihi.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: wale watu wawili
  rationale: Tafsiri inadumisha neno la Kiebrania “watu” badala ya kuongeza utambulisho wao wa kimuktadha kama wapelelezi.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: wakashuka kutoka eneo la milima
  rationale: הָהָר inaweza kumaanisha eneo la milima, si lazima mlima mmoja; uchaguzi huu unafaa jiografia ya simulizi na ni wa kawaida kwa Kiswahili.
- source_word: וַיַּעַבְרוּ
  choice: wakavuka
  rationale: עבר humaanisha kuvuka. Kwa kuwa kitu walichovuka hakijatajwa katika mstari huu, tafsiri haiongezi “Yordani”.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: wakafika kwa Yoshua mwana wa Nuni
  rationale: “Wakafika kwa” ni usemi wa asili unaowasilisha בוא אל, na jina la baba limehifadhiwa kama katika chanzo.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: wakamsimulia
  rationale: ספר katika piel humaanisha kusimulia au kutoa habari; “wakamsimulia” linaonyesha kwamba walimweleza Yoshua kwa mpangilio yaliyotokea.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: yote yaliyowapata
  rationale: Hii ni tafsiri ya asili ya nahau inayosema kihalisi mambo yote “yaliyowakuta”; inadumisha wazo la jumla linaloonyeshwa na כָּל.
theological_decisions: []
