  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: sw
  text: Watu wale wakamwambia, “Tutakuwa huru kutokana na kiapo hiki chako ulichotuapisha[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hatutawajibika kwa kiapo hiki chako.” Neno la Kiebrania linaweza kumaanisha kuwa huru kutokana na wajibu au lawama katika muktadha wa kisheria au wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: wakamwambia
  rationale: Muundo wa masimulizi wa wayyiqtol unaendeleza tukio; “wakamwambia” ni wa kawaida na wa asili katika masimulizi ya Kiswahili.
- source_word: אֵלֶיהָ
  choice: -mwambia
  rationale: Kiambishi cha yambwa “-mw-” kinaonyesha wazi kwamba walizungumza na Rahabu.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: Kiebrania kinasema tu “watu hao/wale,” si “wapelelezi”; hivyo tafsiri haiongezi jukumu lao kutoka katika muktadha.
- source_word: נְקִיִּם אֲנַחְנוּ
  choice: hatutawajibika
  rationale: Katika muktadha wa kiapo, נָקִי humaanisha kutokuwa chini ya wajibu au lawama inayotokana na kiapo. Wakati ujao unaendana na masharti yatakayofuata, ingawa kishazi cha Kiebrania hakina kitenzi kilichoeleza wakati moja kwa moja.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: kwa kiapo hiki chako
  rationale: “Kiapo hiki chako” huhifadhi kiwakilishi cha kuonyesha na kiambishi cha nafsi ya pili ya kike; “kwa” huonyesha eneo la wajibu ambao hawatahesabiwa kuwa nao.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: ulichotuapisha
  rationale: '“Ulichotuapisha” huhifadhi maana ya kisababishi ya Hiphil: Rahabu aliwafanya waape, si kwamba aliwaapia.'
theological_decisions:
- issue: Wakati wa kauli נְקִיִּם אֲנַחְנוּ
  choice: 'Wakati ujao: “hatutawajibika”'
  alternative: 'Wakati wa sasa: “hatuwajibiki” au “tuko huru”'
  rationale: Kishazi cha Kiebrania hakina kitenzi cha wakati, lakini muktadha unaanzisha masharti ambayo yakivunjwa yatawaondolea watu hao wajibu wa kiapo. Tafsiri ya wakati ujao huwasilisha mwelekeo huo bila kufanya kauli kuwa dai la kwamba tayari hawana wajibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hatutawajibika” ni wazi kwa msomaji wa kawaida na huwasilisha maana ya kisheria/agano bila kutumia istilahi nzito; tanbihi huhifadhi taswira ya kuwa “huru” na wigo wa neno la Kiebrania.
