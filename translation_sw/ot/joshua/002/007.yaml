base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: sw
  text: Nao watu wakawafuata kwa njia ya kuelekea Yordani[a], mpaka vivukoni; nao wakalifunga lango nyuma yao mara tu wafuatiliaji walipotoka wakiwafuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye sehemu za kuvukia”; yaani, sehemu zisizo na kina kirefu za Mto Yordani ambako watu wangeweza kuvuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Nao wale watu
  rationale: Nomino yenye kiainishi inawarejelea watu wa mfalme waliotajwa katika muktadha; “Nao” inadumisha muendelezo wa simulizi wa וְ.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: wakawafuatilia
  rationale: “Kufuatilia” ni Kiswahili cha kawaida kwa kuwafuata watu kwa kusudi la kuwakamata, na kiambishi cha yambwa kinawakilisha אַחֲרֵיהֶם bila kurudia “baada yao” kwa namna isiyo ya kawaida.
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: katika njia ya kwenda Yordani
  rationale: דֶּרֶךְ ni njia au barabara; katika muktadha huu inaonyesha njia inayoelekea Mto Yordani.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: mpaka kwenye vivuko
  rationale: מַעְבָּרוֹת ni sehemu za kuvukia mto; עַל katika muktadha huu wa mwendo inaeleweka kuwa mpaka au kwenye maeneo hayo.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: nao wakalifunga lango
  rationale: “Lango” linarejelea lango maalumu la mji kutokana na muktadha, bila haja ya kuongeza neno “mji” katika matini.
- source_word: אַחֲרֵי
  choice: mara tu ... walipotoka
  rationale: Badala ya kutafsiri kihalisi “nyuma yao,” muundo huu wa Kiswahili unaonyesha kwamba lango lilifungwa baada ya waliokuwa wakifuatilia kutoka.
- source_word: כַּאֲשֶׁר יָצְאוּ
  choice: mara tu ... walipotoka
  rationale: Muundo huu unaonyesha uhusiano wa wakati na ukaribu wa matukio unaofaa katika simulizi.
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: wale waliowafuatilia ... kuwafuata
  rationale: Kirai hiki kinadumisha rejeo kwa wafuatiliaji na kiasi fulani cha urudiaji wa mzizi רדף uliomo katika Kiebrania.
