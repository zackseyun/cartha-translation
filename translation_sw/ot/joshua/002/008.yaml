translation:
  language: sw
  text: Kabla hawajajilaza[a], yule mwanamke akapanda juu ya paa kwenda kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kabla hawajalala.” Kitenzi cha Kiebrania kwa maana halisi ni “kujilaza,” lakini hapa huenda kinamaanisha kwenda kulala.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: Kabla hawaja-
  rationale: Muundo wa Kiswahili ‘kabla hawaja-’ unaonyesha kwa kawaida na kwa usahihi kwamba tendo la mwanamke lilitokea kabla ya wao kulala.
- source_word: יִשְׁכָּבוּן
  choice: hawajalala
  rationale: Kitenzi שׁכב kimsingi humaanisha kujilaza; katika muktadha huu kinadokeza kulala. ‘Hawajalala’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi maana halisi ya kujilaza.
- source_word: עָלְתָה
  choice: akapanda
  rationale: Qal timilifu ya עלה inaonyesha mwendo wa kwenda juu. ‘Akapanda’ ni simulizi la kawaida la Kiswahili na linafaa kwa kwenda juu ya paa.
- source_word: עֲלֵיהֶם
  choice: kwenda kwao
  rationale: Kihusishi hiki pamoja na kitenzi cha mwendo kinaonyesha kuelekea kwa watu hao. ‘Kwenda kwao’ huepuka tafsiri potovu ya kwamba aliwapanda au alikuwa juu yao.
- source_word: עַל הַגָּג
  choice: juu ya paa
  rationale: Kirai hiki kinataja mahali walipokuwa na mahali alikowafuata. ‘Juu ya paa’ ni wazi na cha kawaida katika Kiswahili.
- source_word: וְהֵמָּה ... וְהִיא
  choice: wao ... yule mwanamke
  rationale: Viwakilishi vya wazi katika Kiebrania vinalinganisha wahusika. Muundo ‘Kabla wao… yule mwanamke…’ ungekuwa mzito; kiambishi cha wingi katika ‘hawajalala’ na ‘yule mwanamke’ huhifadhi utofautishaji kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. ‘Yule mwanamke’ imetumiwa badala ya ‘yeye’ ili rejeo liwe wazi katika mstari unaosimama peke yake; ‘akapanda kwenda kwao’ huhifadhi mwendo wa kwenda juu na kusudi la kuwafikia.
