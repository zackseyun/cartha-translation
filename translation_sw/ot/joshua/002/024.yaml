  source_fidelity: The rendering accurately conveys the emphatic report that YHWH has given the entire land into Israel's power and preserves the metaphor of the inhabitants 'melting.' However, מִפָּנֵינוּ means 'before us/from before us,' not primarily 'because of us.'
