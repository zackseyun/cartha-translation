  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: sw
  text: Nao wakamwambia Yoshua, “Hakika, Yahwe ameitia nchi yote mikononi mwetu; naam, wakaaji wote wa nchi wameyeyuka mbele yetu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Hakika
  rationale: Katika muktadha huu neno hili linatanguliza uthibitisho wenye msisitizo wa wapelelezi, si sababu tu.
- source_word: יְהוָה
  choice: YAHWE
  rationale: Linatolewa kama jina la Mungu lililo katika maandishi ya Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: ameitia ... mikononi mwetu
  rationale: Nahau hii huhifadhi picha ya Kiebrania ya kukabidhi nchi katika mamlaka ya Israeli.
- source_word: נָמֹגוּ
  choice: wameyeyuka
  rationale: Huhifadhi sitiari yenye nguvu ya kupoteza moyo au ujasiri kwa hofu.
- source_word: מִפָּנֵינוּ
  choice: kwa sababu yetu
  rationale: Huwasilisha maana ya hofu iliyosababishwa na ujio au tishio la Israeli kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uhakika wa tendo la Mungu
  choice: ameitia nchi yote mikononi mwetu
  alternative: ataitia nchi yote mikononi mwetu
  rationale: Kitenzi cha Kiebrania ni timilifu; wapelelezi wanatangaza utoaji huo kuwa jambo lililokwisha hakikishwa, ingawa kuimiliki nchi bado kungetekelezwa kihistoria.
- issue: Jina la agano la Mungu
  choice: YAHWE
  alternative: BWANA
  rationale: Jina binafsi יהוה linaonyeshwa wazi bila kuligeuza kuwa cheo, huku kuepuka kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kusomeka lakini huhifadhi nahau na sitiari kuu za Kiebrania.
