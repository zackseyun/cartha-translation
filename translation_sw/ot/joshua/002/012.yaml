  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: sw
  text: Sasa basi, tafadhali niapieni kwa Yahwe kwamba, kama nilivyowatendea kwa fadhili, ninyi pia mtawatendea jamaa ya baba yangu kwa fadhili na mnipatie ishara ya hakika[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ishara ya kweli,” “ishara ya kuaminika,” au “dhamana ya hakika.”
    reason: Kirai אוֹת אֱמֶת kinaweza kueleza ishara iliyo ya kweli, ya kutegemeka, au inayotumika kama dhamana ya uhakika.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huendeleza kiunganishi וְ pamoja na maana ya wakati ya עַתָּה, huku ikiashiria mgeuko wa Rahabu kutoka simulizi kwenda ombi lake.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: tafadhali niapieni
  rationale: Kitenzi ni amri ya wingi ya kuapa, na נָא huonyesha ombi la heshima lenye msisitizo. ‘Niapieni’ huweka wazi kwamba kiapo kinafanywa kwake.
- source_word: בַּיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha jina linalotumiwa kuthibitisha kiapo; jina la agano יהוה limetoholewa kuwa ‘Yahwe’.
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: nilivyowatendea kwa fadhili
  rationale: חֶסֶד hapa ni wema wenye uaminifu unaoonyeshwa kwa vitendo. ‘Kuwatendea kwa fadhili’ ni Kiswahili cha kawaida na kinachofaa katika muktadha huu.
- source_word: וַעֲשִׂיתֶם גַּם אַתֶּם
  choice: ninyi pia mtaitendea
  rationale: Baada ya ombi la kuapa, muundo huu unaeleza tendo ambalo Rahabu anataka waahidi kulifanya; ‘ninyi pia’ huhifadhi msisitizo wa גַּם אַתֶּם.
- source_word: בֵּית אָבִי
  choice: jamaa ya baba yangu
  rationale: Nahau ya Kiebrania ‘nyumba ya baba yangu’ humaanisha ukoo au watu wa nyumba ya baba, si jengo. ‘Jamaa ya baba yangu’ huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: אוֹת אֱמֶת
  choice: ishara ya hakika
  rationale: אוֹת ni ishara au alama ya uthibitisho, na אֱמֶת hapa huonyesha ukweli, uhakika, au kutegemeka kwake. ‘Ishara ya hakika’ ni wazi bila kuondoa upana wa usemi wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la pekee יהוה kama msingi wa kiapo. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Maana ya חֶסֶד katika ombi la Rahabu
  choice: fadhili
  alternative: wema wa uaminifu; upendo wa agano
  rationale: Muktadha unahusu wema wa vitendo unaotarajiwa kulipwa kwa namna ileile. ‘Fadhili’ huhifadhi maana pana bila kuingiza dhana ya agano ambayo haijaelezwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Basi sasa’ ni mpito wa kawaida wa mazungumzo; ‘niapieni’ huhifadhi wingi wa wanaoombwa kuapa. Alama ya koma mwishoni imehifadhiwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
