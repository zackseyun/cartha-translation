  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: sw
  text: “Tazama, tutakapoingia katika nchi, ufunge kamba hii nyekundu[a] kwenye dirisha ambalo ulitushushia kupitia hilo, nawe uwakusanye nyumbani kwako baba yako, mama yako, ndugu zako wa kiume, na watu wote wa nyumba ya baba yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “mstari huu wa uzi mwekundu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuvuta fikira. “Tazama” linaendeleza nguvu yake ya kuelekeza usikivu huku likibaki la heshima na linaloeleweka.
- source_word: בָאִים בָּאָרֶץ
  choice: tutakapoingia katika nchi
  rationale: Kitenzi cha hali endelevu katika muktadha huu kinaelekeza kwenye kuingia kwao kunakotarajiwa; muundo huu wa Kiswahili unaonyesha wazi sharti la wakati ujao.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: kamba hii nyekundu
  rationale: Mfuatano huu wa maneno una maana halisi inayokaribia “mstari/kamba ya uzi mwekundu.” Katika tukio hili ni alama inayofungwa dirishani; “kamba hii nyekundu” ni ya kawaida na sahihi kimuktadha, huku tafsiri ya karibu zaidi na muundo wa Kiebrania ikihifadhiwa katika tanbihi.
- source_word: תִּקְשְׁרִי
  choice: ufunge
  rationale: Ni nafsi ya pili, umoja wa kike, inayotumika kama agizo katika masharti ya makubaliano. “Ufunge” ni agizo la kawaida na lenye uzito unaofaa.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: kwenye dirisha ulilotuteremshia
  rationale: Kitenzi cha Kiebrania ni cha kusababisha kushuka. Usemi huu unarejelea kwa uwazi dirisha alilotumia kuwashusha wapelelezi.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: uwakusanye kwako nyumbani
  rationale: Muundo wa Kiebrania unajumuisha kuwakusanya watu kwake na kuwaelekeza ndani/kwenda nyumbani; Kiswahili hiki kinahifadhi vipengele vyote kwa njia ya asili.
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: baba yako, mama yako, ndugu zako wa kiume
  rationale: אַחַיִךְ ni umbo la wingi wa kiume. “Ndugu zako wa kiume” linaepuka utata wa neno “ndugu” peke yake na kuhifadhi jinsia ya neno la chanzo.
- source_word: כָּל בֵּית אָבִיךְ
  choice: watu wote wa nyumba ya baba yako
  rationale: “Nyumba” hapa ni jamaa au kaya, si jengo pekee. Kuongeza “watu wote” kunadhihirisha maana hiyo ya kijamii bila kuondoa picha ya “nyumba ya baba.”
