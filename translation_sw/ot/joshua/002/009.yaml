base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: sw
  text: Akawaambia wale wanaume, “Ninajua kwamba Yahweh amewapa nchi, kwamba hofu yenu imetuangukia[a], na kwamba wakaaji wote wa nchi wameyeyuka mbele yenu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hofu inayosababishwa na ninyi imetuangukia.
    reason: lexical_alternative
  - marker: b
    text: Au “wakaaji wote wa nchi wamevunjika moyo kwa sababu yenu.” Kitenzi cha Kiebrania kwa maana halisi ni “wameyeyuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: Akawaambia wale wanaume
  rationale: Muundo wenye ‘aka-’ unaendeleza mtiririko wa simulizi wa waw-consecutive, huku ‘wale wanaume’ ikirejelea watu maalumu waliotajwa katika muktadha.
- source_word: יָדַעְתִּי
  choice: Ninajua
  rationale: Kitenzi timilifu hapa kinaeleza ujuzi uliothibitika wenye umuhimu wa sasa; wakati wa sasa ni wa kawaida na wazi katika Kiswahili.
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: Yahwe amewapa nchi
  rationale: ‘Amewapa’ huonyesha tendo linalotazamwa kuwa limetimizwa na lenye matokeo ya sasa, ingawa kutwaa nchi bado kunaendelea. ‘Nchi’ huhifadhi maana ya eneo bila kuongeza ufafanuzi usiomo katika Kiebrania.
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: tumepatwa na hofu kubwa kwa sababu yenu
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha kwamba Israeli ndio chanzo cha hofu. Tanbihi huhifadhi taswira halisi ya hofu ‘kuangukia’ watu.
- source_word: נָמֹגוּ
  choice: wameyeyuka
  rationale: Huhifadhi sitiari yenye nguvu ya Kiebrania ya kuyeyuka, badala ya kuibadili kimya kuwa maelezo ya kupoteza moyo.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: wakaaji wote wa nchi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya wote wanaokaa katika nchi hiyo.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Huhifadhi nahau ya Kiebrania na uwezekano wake wa kumaanisha kuwapo au kukaribia kwa Israeli, bila kuifupisha kuwa sababu pekee.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Jina binafsi la agano limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo kama ‘BWANA’; hivyo utambulisho wa jina katika matini ya Kiebrania unahifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatumia mtiririko wa kawaida wa simulizi, lakini inahifadhi sitiari ya Kiebrania ‘wameyeyuka’ na kui erläutisha katika tanbihi.
