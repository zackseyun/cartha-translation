  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Matumizi ya 'yule/wale' yanaunganisha mstari huu na wahusika waliotajwa tayari. Tanbihi imehifadhi hali isiyo ya kawaida ya kiambishi cha umoja katika Kiebrania.
