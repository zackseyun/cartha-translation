  text: וַ/תִּקַּ֧ח הָֽ/אִשָּׁ֛ה אֶת שְׁנֵ֥י הָ/אֲנָשִׁ֖ים וַֽ/תִּצְפְּנ֑/וֹ וַ/תֹּ֣אמֶר כֵּ֗ן בָּ֤אוּ אֵלַ/י֙ הָֽ/אֲנָשִׁ֔ים וְ/לֹ֥א יָדַ֖עְתִּי מֵ/אַ֥יִן הֵֽמָּה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: sw
  text: Lakini yule mwanamke alikuwa amewachukua wale watu wawili na kuwaficha[a]. Akasema, “Ndiyo, wale watu walikuja kwangu, lakini sikujua walikotoka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kiambishi cha umoja katika “akamficha,” lakini muktadha unawahusu wale watu wawili kwa pamoja; kwa hiyo limetafsiriwa “kuwaficha.”
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: alikuwa amewachukua
  rationale: Kauli ya wakati uliopita timilifu inaonyesha kwa Kiswahili cha kawaida kwamba kuwachukua kulitukia kabla ya maneno yake kwa wajumbe, huku ikihifadhi mtiririko wa simulizi.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Katika muktadha neno linamtaja Rahabu kama mwanamke anayejulikana tayari katika simulizi, si kama mke wa mtu.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: wale watu wawili
  rationale: Hawa ni wale wanaume wawili waliotajwa katika muktadha; 'watu wawili' ni usemi wa kawaida wa Kiswahili na viwakilishi vya ngeli ya watu vinadumisha rejeo lao.
- source_word: וַתִּצְפְּנוֹ
  choice: kuwaficha
  rationale: Ingawa kiambishi cha Kiebrania kiko katika umoja wa kiume, muktadha unaonyesha kwamba waliofichwa ni wale watu wawili; wingi umetumika katika matini na hali hiyo imeelezwa katika tanbihi.
- source_word: וַתֹּאמֶר
  choice: Akasema
  rationale: Hiki ni kitambulisho cha kawaida cha usemi katika simulizi; 'akasema' ni cha asili na kinaendeleza mfuatano wa matukio.
- source_word: כֵּן
  choice: Ndiyo
  rationale: Neno hili linakubali kwamba watu hao walifika kwake; 'Ndiyo' linaonyesha uthibitisho huo wazi katika mazungumzo.
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: wale watu walikuja kwangu
  rationale: Tafsiri hii inahifadhi tendo na mwelekeo wa kuja kwake kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וְלֹא יָדַעְתִּי
  choice: lakini sikujua
  rationale: Ingawa וְ kimsingi ni kiunganishi cha 'na', hapa uhusiano wa kimantiki ni wa kutofautisha kukiri kuja kwao na kudai kutokujua asili yao; 'lakini' huleta maana hiyo kwa kawaida.
- source_word: מֵאַיִן הֵמָּה
  choice: walikotoka
  rationale: Usemi huu unauliza asili au mahali walikotoka; 'walikotoka' ni Kiswahili cha kawaida na chenye maana hiyo.
theological_decisions: []
