id: JOS.2.11
reference: Joshua 2:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: sw
  text: Tuliposikia habari hiyo, mioyo yetu ikayeyuka, wala hakuna mtu yeyote aliyekuwa tena na ujasiri[a] kwa sababu yenu; kwa maana Yahwe, Mungu wenu[b], ndiye Mungu mbinguni juu na duniani chini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wala roho haikuinuka tena ndani ya mtu yeyote,” yaani, hakuna aliyebaki na ujasiri.
    reason: lexical_alternative
  - marker: b
    text: Jina “Yahwe” linawakilisha jina la Mungu la Kiebrania YHWH.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: Tuliposikia habari hiyo
  rationale: Muundo huu unaonyesha uhusiano wa wakati na tukio lililotangulia. “Habari hiyo” hutaja kwa kawaida taarifa iliyosimuliwa katika muktadha uliotangulia.
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: mioyo yetu ikayeyuka
  rationale: Huhifadhi taswira ya Kiebrania ya mioyo kuyeyuka kwa hofu, huku ikiwa usemi unaoeleweka kwa Kiswahili.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: wala hakuna mtu yeyote aliyekuwa tena na ujasiri
  rationale: Neno רוּחַ hapa linaelekea kumaanisha nguvu ya ndani au ujasiri, si Roho Mtakatifu wala upepo. Tafsiri ya maana ni ya kawaida zaidi kwa Kiswahili, na tafsiri halisi imehifadhiwa katika tanbihi.
- source_word: מִפְּנֵיכֶם
  choice: kwa sababu yenu
  rationale: Ingawa kifungu hiki kwa msingi ni “kutoka mbele yenu/uso wenu,” katika muktadha kinaonyesha sababu ya hofu ya Wakanaani.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu inayoeleza hofu na kuvunjika moyo vilivyotajwa kabla yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha moja kwa moja jina la Mungu YHWH badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni rejeo kwa Mungu wa Israeli na liko katika uhusiano wa ufafanuzi na jina Yahwe.
- source_word: הוּא אֱלֹהִים
  choice: ndiye Mungu
  rationale: Hutoa dai la Kiebrania kwa mkazo wa kawaida wa Kiswahili bila kuongeza maneno kama “pekee” au “wa kweli,” ambayo hayajaandikwa wazi hapa.
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: mbinguni juu
  rationale: Huhifadhi upande wa kwanza wa jozi ya mbingu na dunia na utofautishaji wa juu na chini.
- source_word: וְעַל הָאָרֶץ מִתָּחַת
  choice: na duniani chini
  rationale: Hukamilisha jozi ya mbingu na dunia inayodhihirisha utawala wa Mungu kote.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina YHWH moja kwa moja. “Yahwe” huhifadhi jina hilo la agano badala ya kuweka cheo mahali pake.
- issue: Upeo wa ungamo la Rahabu
  choice: ndiye Mungu mbinguni juu na duniani chini
  alternative: ndiye Mungu wa kweli; yeye peke yake ndiye Mungu
  rationale: Kiebrania kinathibitisha wazi uungu na utawala wa Yahwe katika mbingu na dunia. Tafsiri haiongezi “wa kweli” au “peke yake,” ingawa kauli hiyo ina uzito mkubwa wa kitheolojia.
- issue: Maana ya רוּחַ katika mwitikio wa Wakanaani
  choice: ujasiri
  alternative: roho
  rationale: Katika muktadha huu neno hilo linaonyesha moyo au nguvu ya ndani ya kukabiliana na hatari. “Ujasiri” huepuka kudokeza kwamba roho ya mtu ilikoma kuwapo, huku tanbihi ikihifadhi taswira halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Taswira ya “mioyo kuyeyuka” imehifadhiwa, lakini nahau ya רוּחַ imetolewa kwa maana ya kawaida ya “ujasiri,” huku uhalisi wake ukielezwa katika tanbihi.
