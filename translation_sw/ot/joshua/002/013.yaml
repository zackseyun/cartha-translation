  yaml_path: translation/ot/joshua/002/013.yaml
  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: sw
  text: na mtawahifadhi hai baba yangu na mama yangu, ndugu zangu wa kiume na wa kike, pamoja na watu wote wa kwao[a]; na myaokoe maisha yetu kutoka katika mauti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na vyote walivyo navyo.” Kirai cha Kiebrania kinaweza kuwahusu watu wengine wa kaya yao, au, kwa maana pana zaidi, vyote vilivyo vyao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: kuwaacha hai
  rationale: Hifili ya חיה ina maana ya kusababisha waishi au kuwahifadhi hai. Katika ombi hili, “kuwaacha hai” ni Kiswahili cha kawaida kinachowasilisha wazo hilo bila kulifanya kuwa la kiteolojia zaidi ya muktadha.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: baba yangu na mama yangu, ndugu zangu wa kiume na wa kike
  rationale: Majina ya jamaa yametajwa kwa mpangilio wa Kiebrania. “Ndugu zangu wa kiume na wa kike” huonyesha kwa uwazi makundi yote mawili ya ndugu katika Kiswahili sanifu.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: watu wote wa kwao
  rationale: Katika muktadha wa kuwaokoa watu wasife, kirai hiki kinaelekea kuwahusu wengine wa jamaa au kaya yao. “Watu wote wa kwao” ni cha kawaida na chenye upana wa kutosha; tanbihi inahifadhi uwezekano wa maana pana inayotia ndani mali.
- source_word: וְהִצַּלְתֶּם
  choice: kuyaokoa
  rationale: Hifili ya נצל humaanisha kuokoa au kukomboa kutoka hatarini. “Kuyaokoa” inafaa moja kwa moja kwa maisha yaliyo hatarini.
- source_word: נַפְשֹׁתֵינוּ
  choice: maisha yetu
  rationale: נפש hapa humaanisha uhai au maisha ya watu, si nafsi isiyo ya mwili. “Maisha yetu” huwasilisha maana halisi katika tishio la kufa.
- source_word: מִמָּוֶת
  choice: na kifo
  rationale: Muundo wa Kiswahili “kuokoa ... na kifo” huwasilisha kwa kawaida maana ya kuondoa katika hatari ya mauti.
