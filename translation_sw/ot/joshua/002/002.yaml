  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: sw
  text: Mfalme wa Yeriko akaambiwa, “Tazama, wanaume wamekuja hapa usiku huu kutoka kwa Waisraeli ili kuichunguza nchi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kupeleleza nchi.” Kitenzi cha Kiebrania kinaweza kumaanisha kutafuta kwa makini au kuchunguza; katika muktadha huu kinarejelea uchunguzi wa nchi kwa kusudi la kupata taarifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: akaambiwa
  rationale: Kauli tendwa inahifadhi kwamba mtoa taarifa hakutajwa, huku ikitoa simulizi la Kiswahili la kawaida na lenye mtiririko.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: Mfalme wa Yeriko
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi cheo na eneo analotawala.
- source_word: לֵאמֹר
  choice: imewasilishwa kwa nukuu ya moja kwa moja
  rationale: Kitenzi-jina hiki kinatanguliza maneno yaliyonukuliwa; alama za kunukuu ni njia ya asili ya kuonyesha kazi hiyo katika Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta usikivu kwa taarifa ya dharura na linadumisha hadhi ya lugha bila kuwa gumu kueleweka.
- source_word: אֲנָשִׁים
  choice: wanaume
  rationale: Katika muktadha huu neno linawarejelea watu wa kiume, yaani wale waliotumwa kufanya upelelezi.
- source_word: בָּאוּ הֵנָּה
  choice: wamekuja hapa
  rationale: Kauli hii inaonyesha kuwasili kulikokamilika ambako kuna umuhimu kwa wakati wa taarifa.
- source_word: הַלַּיְלָה
  choice: usiku huu
  rationale: Inarejelea usiku wa wakati huo; huu ni usemi wa kawaida na wazi katika Kiswahili sanifu.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: kutoka kwa Waisraeli
  rationale: Huwatambulisha wanaume hao kuwa wanatoka miongoni mwa watu wa Israeli bila kutumia tafsiri isiyo ya kawaida ya neno kwa neno.
- source_word: לַחְפֹּר
  choice: kuichunguza
  rationale: Kitenzi kinaweza kumaanisha kutafuta kwa makini au kufanya uchunguzi; katika muktadha huu kinahusu uchunguzi wa nchi kwa kusudi la kijeshi, lakini tafsiri kuu haibani maana kwa neno la upelelezi pekee.
- source_word: אֶת הָאָרֶץ
  choice: nchi
  rationale: Hii ni tafsiri ya kawaida ya הָאָרֶץ katika muktadha wa eneo linalochunguzwa.
