source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: sw
  text: Wanaume wakamwambia, “Maisha yetu badala ya yenu, hata kufa, ikiwa hamtafunua jambo letu hili. Yahweh atakapotupa nchi, tutakutendea kwa wema na uaminifu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tutakutendea kwa fadhili na uaminifu.” Maneno haya ya Kiebrania mara nyingi huonyesha wema wa kudumu na uaminifu wa kutegemeka katika uhusiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: wale wanaume
  rationale: Neno la Kiebrania linamaanisha moja kwa moja ‘wanaume’; muktadha unawatambulisha kuwa wapelelezi, lakini hilo halijaongezwa katika mstari.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: Uhai wetu uwe badala ya uhai wenu, hata kufa
  rationale: נֶפֶשׁ hapa ni ‘uhai,’ תַּחַת inaonyesha kuchukua nafasi ya mwingine, na לָמוּת inaweka wazi hatari ya kifo. Tafsiri inadumisha muundo wa kiapo bila kuufafanua kupita kiasi.
- source_word: אִם לֹא תַגִּידוּ
  choice: ikiwa hamtafunua
  rationale: Hifili ya נגד inaweza kumaanisha kusema, kutoa habari, au kufunua. ‘Kufunua’ linafaa kwa siri ya wapelelezi. Wingi wa kitenzi umehifadhiwa kwa ‘hamta-’ na ‘wenu.’
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: jambo letu hili
  rationale: דָּבָר hapa ni jambo au shughuli inayohusika, si lazima ‘neno’ linalosemwa.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: Yahweh atakapotupa nchi hii
  rationale: Muundo בְּ + kitenzi-jina unaonyesha wakati au hali, hivyo ‘atakapotupa’ ni Kiswahili cha kawaida. Kihusishi maalumu ‘hii’ kinaonyesha nchi inayozungumziwa katika muktadha bila kubadili maana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limeandikwa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: tutakutendea
  rationale: עשה עם ina maana ya kumtendea mtu kwa namna fulani; umoja wa ‘-ku-’ unalingana na Rahabu anayesemeshwa moja kwa moja.
- source_word: חֶסֶד וֶאֱמֶת
  choice: kwa fadhili na uaminifu
  rationale: ‘Fadhili’ hudokeza wema wenye kujitoa, na ‘uaminifu’ hubeba maana ya ukweli na kutegemeka. Maneno yote mawili yamehifadhiwa bila kuingiza neno ‘agano,’ ambalo halipo wazi katika kishazi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina maalumu la Mungu, hivyo ‘Yahweh’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya maana ya חֶסֶד וֶאֱמֶת
  choice: kwa fadhili na uaminifu
  alternative: kwa upendo thabiti na uaminifu
  rationale: Tafsiri kuu ni ya asili katika Kiswahili na inadumisha sifa mbili tofauti. Tanbihi huhifadhi uwezekano wa kuelewa חֶסֶד kuwa upendo wa kudumu na wenye wajibu wa uhusiano, bila kulazimisha neno ‘agano’ katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kiapo umehifadhiwa kwa kiasi ili kutobatilisha mkazo na mvutano wa Kiebrania; wingi katika ‘uhai wenu/hamtafunua’ na umoja katika ‘tutakutendea’ umehifadhi tofauti iliyopo katika chanzo.
