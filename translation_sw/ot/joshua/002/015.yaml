base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/015.yaml
  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: sw
  text: Kisha akawashusha kwa kamba kupitia dirishani, kwa sababu nyumba yake ilikuwa katika ukuta wa mji, naye alikuwa akiishi katika ukuta huo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba yake ilikuwa kwenye ukuta wa mji, naye alikuwa akiishi kwenye ukuta huo.” Kiebrania kinaweza kueleza nyumba iliyokuwa ndani ya muundo wa ukuta au juu/kwenye ukuta huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: Kisha akawashusha
  rationale: Hifili ya ירד ina maana ya kusababisha washuke. “Akawashusha” huhifadhi maana hiyo ya kisababishi, na “Kisha” huendeleza mfululizo wa simulizi.
- source_word: בַּחֶבֶל
  choice: kwa kamba
  rationale: חֶבֶל hapa ni kamba, na kiambishi ב kinaonyesha chombo kilichotumiwa kuwashusha.
- source_word: בְּעַד הַחַלּוֹן
  choice: kupitia dirishani
  rationale: בְּעַד inaonyesha kupita katika uwazi; “kupitia dirishani” ni Kiswahili cha kawaida na wazi.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי inaanzisha maelezo ya sababu iliyofanya iwezekane kuwashusha kupitia dirishani.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: nyumba yake ilikuwa katika ukuta wa mji
  rationale: Tafsiri hii inafuata kwa karibu taswira ya Kiebrania ya nyumba iliyokuwa katika muundo wa ukuta, huku “wa mji” ikieleza kwa kawaida kwamba חוֹמָה ni ukuta wa ulinzi wa mji.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: naye alikuwa akiishi katika ukuta huo
  rationale: יֹשֶׁבֶת ni umbo linaloonyesha hali inayoendelea ya kukaa au kuishi. Kurudia “katika ukuta” kunahifadhi msisitizo wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa kawaida, wenye heshima na unaoeleweka kwa wasomaji wa leo. Neno “katika” limehifadhiwa katika matini kuu ili kufuata Kiebrania kwa karibu, huku tanbihi ikihifadhi uwezekano wa maana ya “kwenye/juu ya” ukuta.
