  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: sw
  text: Kwa maana tumesikia jinsi Yahweh alivyoyakausha maji ya Bahari ya Shamu[a] mbele yenu mlipotoka Misri, na yale mliyowatendea wale wafalme wawili wa Waamori waliokuwa ng’ambo ya Yordani—Sihoni na Ogu—ambao mliwaweka wakfu kwa maangamizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, Yam Suph; jina hili kwa kawaida hutafsiriwa “Bahari ya Shamu,” lakini kwa maana ya karibu zaidi ni “Bahari ya Matete.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo ya Rahabu kuhusu sababu ya hofu iliyotajwa katika muktadha.
- source_word: שָׁמַעְנוּ
  choice: tumesikia
  rationale: Kauli timilifu ya Kiebrania inaonyesha taarifa iliyosikiwa ambayo athari yake bado ipo.
- source_word: הוֹבִישׁ
  choice: alivyoyakausha
  rationale: Hifili ya יבש humaanisha kusababisha kitu kikauke; usemi huu ni wa kawaida na sahihi kwa maji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limeandikwa moja kwa moja katika maandishi ya Kiebrania, hivyo linahifadhiwa kwa umbo hili.
- source_word: מֵי יַם סוּף
  choice: maji ya Bahari ya Shamu
  rationale: ‘Bahari ya Shamu’ ni jina la kijiografia lililozoeleka katika Kiswahili; maana ya karibu zaidi na muundo wa Kiebrania imeonyeshwa katika tanbihi.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Inaonyesha kwamba maji yaliondolewa mbele ya Waisraeli walipokuwa wakipita.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: mlipotoka Misri
  rationale: Muundo wa wakati umetafsiriwa kwa Kiswahili cha kawaida bila kupoteza uhusiano wake na tukio la kutoka Misri.
- source_word: וַאֲשֶׁר עֲשִׂיתֶם
  choice: na yale mliyowatendea
  rationale: Inahifadhi upana wa kitenzi עשה kabla ya tendo lenyewe kufafanuliwa mwishoni mwa sentensi.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: wale wafalme wawili wa Waamori
  rationale: Ni Kiswahili cha kawaida kinachohifadhi idadi na utambulisho wa wafalme.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: waliokuwa ng’ambo ya Yordani
  rationale: ‘Ng’ambo ya Yordani’ hudumisha mtazamo wa msemaji bila kulazimisha upande fulani katika maandishi.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: Sihoni na Ogu
  rationale: Majina haya yanawatambulisha kwa maelezo wale wafalme wawili; vistari vinasaidia apposition ya asili.
- source_word: הֶחֱרַמְתֶּם אֹתָם
  choice: ambao mliwaangamiza kabisa kama waliowekwa wakfu
  rationale: Inajaribu kubeba pamoja matokeo ya kuangamizwa na dhana maalumu ya חרם, yaani kutengwa au kuwekwa wakfu kwa hukumu, bila kuifanya kuwa ushindi wa kijeshi tu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya חרם katika vita
  choice: mliwaangamiza kabisa kama waliowekwa wakfu
  alternative: mliwaangamiza kabisa / mliwaweka chini ya marufuku
  rationale: Tafsiri hii inalinda mvutano kati ya kutengwa kwa kusudi maalumu na matokeo yake ya kuangamizwa, bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ng’ambo ya Yordani’ ni usemi wa kawaida; ‘mliwaangamiza kabisa kama waliowekwa wakfu’ ni mzito kidogo kwa makusudi ili kuhifadhi nguvu na upekee wa חרם.
