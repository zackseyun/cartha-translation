  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: sw
  text: 'Akawaambia, “Nendeni milimani[a], ili wanaowafuatilia wasikutane nanyi[b]. Jificheni huko kwa siku tatu, mpaka wanaowafuatilia watakaporudi. Baadaye ndipo mtaendelea na safari yenu.”


    [a] Au “kwenye mlima”; neno la Kiebrania linaweza kumaanisha mlima fulani au eneo la milima.


    [b] Au “wasiwajie” au “wasiwapate”; kitenzi hiki kinaweza kumaanisha kukutana na mtu au kumjia, na katika muktadha huu kukutana huko kungekuwa kwa nia ya uadui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye mlima”; neno la Kiebrania linaweza kumaanisha mlima fulani au eneo la milima.
    reason: lexical_alternative
  - marker: b
    text: Au “wasiwajie” au “wasiwapate”; kitenzi hiki kinaweza kumaanisha kukutana na mtu au kumjia, na katika muktadha huu kukutana huko kungekuwa kwa nia ya uadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: milimani
  rationale: הַר inaweza kumaanisha mlima mmoja au eneo lenye milima. “Milimani” ni ya kawaida katika Kiswahili na inafaa kwa mahali pa kujificha, huku tanbihi ikihifadhi uwezekano wa mlima mmoja maalumu.
- source_word: לֵּכוּ
  choice: Nendeni
  rationale: Amri ya wingi ya הלך ina maana ya moja kwa moja ya kuwaagiza waende.
- source_word: פֶּן
  choice: ili ... wasije
  rationale: פֶּן huanzisha tahadhari au kusudi hasi. Muundo wa “ili ... wasije” ni wa asili katika Kiswahili na unadumisha nguvu ya onyo.
- source_word: יִפְגְּעוּ בָכֶם
  choice: wakakutana nanyi
  rationale: פגע pamoja na ב inaweza kumaanisha kukutana na mtu au kumfikia. “Wakakutana nanyi” huhifadhi maana ya msingi bila kuongeza wazi wazo la kuwapita au kuwakamata.
- source_word: הָרֹדְפִים
  choice: wanaowafuatilia
  rationale: Kitenzi kishirikishi cha רדף kimetumika kama nomino kwa watu waliokuwa wakiwafuatilia. Muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: וְנַחְבֵּתֶם
  choice: Jificheni
  rationale: Umbo hili lina maana ya kujificha; amri ya wingi “Jificheni” inaeleza moja kwa moja tendo la wao wenyewe kujisitiri.
- source_word: שָׁמָּה
  choice: huko
  rationale: Kielezi hiki hurejelea mahali walikoagizwa kwenda. “Huko” ni cha kawaida baada ya “milimani.”
- source_word: שְׁלֹשֶׁת יָמִים
  choice: kwa siku tatu
  rationale: Huu ni muda wa tendo; “kwa siku tatu” huwasilisha muda huo kwa Kiswahili cha kawaida.
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: mpaka wanaowafuatilia watakaporudi
  rationale: עַד pamoja na kitenzi-jina cha שוב huonyesha mwisho wa muda wa kujificha. Muundo huu wa Kiswahili huonyesha wazi kuwa warudi kwanza.
- source_word: וְאַחַר
  choice: Baadaye
  rationale: Neno hili linaonyesha hatua inayofuata baada ya muda wa kusubiri.
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: mtaenda zenu
  rationale: Nahau ya Kiswahili “kwenda zenu” ni sawa ya asili kwa kuendelea na njia yao baada ya hatari kupita, bila kuongeza mahali wanakoenda.
