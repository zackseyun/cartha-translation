  text: וְ/אִם תַּגִּ֖ידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה וְ/הָיִ֣ינוּ נְקִיִּ֔ם מִ/שְּׁבֻעָתֵ֖/ךְ אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: sw
  text: Lakini ukifichua jambo hili letu,[a] basi tutakuwa huru kutokana na kiapo chako ambacho ulituapisha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shughuli hii yetu” au “habari hii yetu.” Neno la Kiebrania linaweza kumaanisha kwa upana jambo, shughuli, habari, au neno lililosemwa; hapa linarejelea siri inayohusu ujumbe wa wapelelezi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweza kutafsiriwa, “tutakuwa bila hatia kuhusu kiapo chako.” Nahau hiyo humaanisha kwamba hawataendelea kufungwa na kiapo hicho ikiwa Rahabu angefichua siri yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini uki-
  rationale: Muungano na kisharti huleta sharti linalotofautiana na ahadi iliyotangulia; “Lakini uki-” ni ya asili katika Kiswahili na huhifadhi mtiririko huo.
- source_word: תַּגִּידִי
  choice: ukifichua
  rationale: Hifili ya נגד inaweza kumaanisha kusema, kutangaza, au kujulisha. Katika muktadha huu onyo linahusu kutoa siri, hivyo “ukifichua” huwasilisha maana hiyo kwa uwazi bila kutaja njia maalumu ya kuifunua.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: jambo hili letu
  rationale: דבר inaweza kuwa neno, jambo, au shughuli. Hapa inarejelea siri inayohusu wapelelezi; “jambo hili letu” huhifadhi upana wa neno, kiashiria “hili,” na umilikaji.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: basi tutakuwa huru
  rationale: Nahau היה pamoja na נקי hapa humaanisha kutokuwa tena chini ya wajibu au dhima. “Tutakuwa huru” ni Kiswahili cha kawaida kinachoonyesha kuondolewa kwa kifungo cha kiapo.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: kutokana na kiapo chako
  rationale: Kihusishi מן huonyesha kuachiliwa au kutengwa na kiapo. “Kutokana na kiapo chako” huonyesha kuwa hawatafungwa tena na kiapo alichowataka waape.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: ambacho ulituapisha
  rationale: 'Hifili ya שׁבע ina nguvu ya kisababishi: Rahabu aliwafanya waape. Kitenzi “ulituapisha” ni kifupi, cha kawaida, na huhifadhi nguvu hiyo.'
theological_decisions: []
