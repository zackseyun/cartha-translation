lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Hutambulisha utofauti na tukio lililotangulia na pia huongoza kwenye jambo lililo tofauti; “Lakini” ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: כָּל הֶעָרִים ... לֹא
  choice: haikuchoma jiji lolote kati ya yale
  rationale: Katika sentensi hasi, “jiji lolote” huwasilisha kwa kawaida maana ya kugawa ya ‘miji yote ... haikuchoma’ bila kudokeza kwamba baadhi yake ilichomwa.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: yaliyokuwa yamesimama juu ya vilima vyake
  rationale: Hudumisha taswira ya kitenzi ‘kusimama’ na maana ya miji iliyokuwa juu ya vilima vya makazi; tanbihi inafafanua maana ya kiakiolojia.
- source_word: לֹא שְׂרָפָם יִשְׂרָאֵל
  choice: Israeli haikuchoma
  rationale: Mpangilio wa kawaida wa Kiswahili huweka kiima kabla ya kitenzi; upatanisho wa ngeli kwa jina la nchi/taifa umetumiwa.
- source_word: זוּלָתִי ... לְבַדָּהּ
  choice: isipokuwa Hazori peke yake
  rationale: Huweka wazi kwamba Hazori ndiyo iliyokuwa tofauti pekee, huku ikihifadhi msisitizo wa maandishi ya Kiebrania.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: Yoshua aliuchoma
  rationale: Kitenzi kimerudiwa kama katika Kiebrania, na kiambishi cha yambwa ‘-u-’ kinarejelea mji wa Hazori.
- source_word: חָצוֹר
  choice: Hazori
  rationale: Umbo la jina linalosomeka kwa kawaida katika Kiswahili na linalokaribia transliteresheni ya jina la Kiebrania.
