  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: sw
  text: na kwa wafalme waliokuwa upande wa kaskazini, katika nchi ya vilima, katika Araba kusini mwa Kinerothi, katika nyanda za chini, na katika miinuko ya Dori[a] upande wa magharibi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika maeneo ya Dori,” “katika eneo la Dori,” au “katika miteremko ya Dori.” Neno la Kiebrania ni adimu, na maana yake kamili ya kijiografia inabishaniwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka baharini”; katika matumizi ya kijiografia ya Kiebrania, kwa kawaida hii humaanisha “upande wa magharibi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: na kwa
  rationale: Kiunganishi pamoja na kihusishi kinaendeleza orodha ya mstari uliotangulia na kuonyesha kwamba wafalme hawa pia walitumwa ujumbe.
- source_word: הַמְּלָכִים
  choice: wafalme
  rationale: Neno מֶלֶךְ humaanisha wafalme kwa wazi, si watawala kwa maana pana.
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: waliokuwa upande wa kaskazini
  rationale: Kauli hii inabainisha mahali walikokuwa wafalme hao; tafsiri hii ni ya kawaida na inaendana na orodha ya maeneo inayofuata.
- source_word: בָּהָר
  choice: katika nchi ya vilima
  rationale: Katika maelezo ya maeneo ya Yoshua, הַר hapa inaashiria eneo la vilima au milima, si mlima mmoja mmoja.
- source_word: וּבָעֲרָבָה
  choice: katika Araba
  rationale: עֲרָבָה hapa ni jina la eneo maalumu la kijiografia; kulihifadhi kama Araba ni sahihi kuliko kulifanya tu kuwa tambarare ya kawaida.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: kusini mwa Kinerothi
  rationale: נֶגֶב inatumika hapa kuelekeza upande wa kusini kuhusiana na Kinerothi, eneo la kaskazini, wala si kutaja eneo maalumu la Negebu.
- source_word: וּבַשְּׁפֵלָה
  choice: katika nyanda za chini
  rationale: שְׁפֵלָה huonyesha eneo la chini au la vilima vya chini; 'nyanda za chini' ni Kiswahili cha kawaida kinachohifadhi maana ya kijiografia.
- source_word: וּבְנָפוֹת דּוֹר
  choice: katika miinuko ya Dori
  rationale: נָפוֹת ni neno adimu lenye maana ya kijiografia inayobishaniwa. 'Miinuko ya Dori' huhifadhi wazo la mandhari iliyoinuka, huku maana nyingine zikitajwa katika tanbihi.
- source_word: מִיָּם
  choice: upande wa magharibi
  rationale: Ingawa kihalisi ni 'kutoka baharini,' יָם hutumiwa mara nyingi katika jiografia ya Kiebrania kumaanisha magharibi, kwa kuwa Bahari ya Mediterania ilikuwa upande huo.
