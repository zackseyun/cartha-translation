  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: sw
  text: Basi Yoshua akaitwaa nchi yote[a], sawasawa na yote ambayo Yahweh alikuwa amemwambia Musa. Yoshua akawapa Israeli nchi hiyo iwe urithi wao, kwa mafungu yao kulingana na makabila yao. Nayo nchi ikapumzika kutokana na vita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi nzima.” Kifungu hiki ni muhtasari wa Yoshua kuitwaa nchi inayozungumziwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “nchi ikawa tulivu bila vita.” Usemi wa Kiebrania unaonyesha pumziko au utulivu baada ya mapigano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akaitwaa
  rationale: Kitenzi לקח kimsingi ni ‘kutwaa/kuchukua.’ Katika muhtasari huu, ‘akaitwaa’ ni lugha ya kawaida ya kutwaa nchi bila kulazimisha maana finyu ya kijeshi ya ‘kuiteka.’
- source_word: כָּל הָאָרֶץ
  choice: nchi yote
  rationale: אָרֶץ hapa ni nchi inayozungumziwa katika simulizi, si dunia nzima. ‘Nchi yote’ huhifadhi upeo wa kauli ya muhtasari bila kutatua mvutano na habari za maeneo yaliyobaki.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: sawasawa na yote ambayo ... alikuwa amemwambia
  rationale: Muundo huu unaonyesha kwamba tendo hilo lililingana na yale yaliyokuwa yamesemwa hapo awali; wakati timilifu ‘alikuwa amemwambia’ unaeleza utangulizi huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika tetragramu limeandikwa ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: וַיִּתְּנָהּ
  choice: akawapa Israeli nchi hiyo
  rationale: Kiambishi cha kike kinarejelea nchi. Kutaja tena ‘nchi hiyo’ huondoa utata katika Kiswahili, na ‘akawapa Israeli’ huwasilisha mpokeaji wa zawadi kwa kawaida.
- source_word: לְנַחֲלָה
  choice: iwe urithi wao
  rationale: נחלה ni milki ya urithi, hasa mgao wa nchi wa agano. ‘Iwe urithi wao’ ni ya asili na huhifadhi maana ya kisheria na kitheolojia.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: kwa mafungu yao kulingana na makabila yao
  rationale: מחלקות inahusu migawanyo au mafungu; kifungu kinachofuata kinaonyesha kuwa ugawaji huo ulipangwa kwa makabila.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: ikapumzika kutokana na vita
  rationale: שקט huonyesha utulivu au pumziko baada ya mapigano. Usemi huu huonyesha kukoma kwa vita bila kudai kwamba hakukuwa na mgogoro wowote kabisa.
theological_decisions:
- issue: Upeo wa muhtasari ‘nchi yote’
  choice: Kuhifadhi kauli ya muhtasari kuhusu Yoshua kuitwaa nchi kwa kutimiza neno la Yahweh.
  alternative: Kuitafsiri kuwa kila sehemu ilikaliwa kikamilifu mara moja, au kuitaja wazi kuwa ni lugha ya kutia chumvi.
  rationale: Kiebrania kinatoa muhtasari wa kisimulizi. Tafsiri inadumisha ‘nchi yote’ bila kuingiza suluhisho la kiufafanuzi kuhusu maeneo ambayo vifungu vingine vinasema yalikuwa bado yamebaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akaitwaa’ hudumisha ufupi wa Kiebrania; ‘mafungu’ ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi nzito ya kiutawala. Viashiria vyote vya tanbihi vimewekwa katika matini.
