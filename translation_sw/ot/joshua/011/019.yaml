  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: sw
  text: Hakuna mji hata mmoja uliofanya amani na wana wa Israeli[a], isipokuwa Wahivi waliokaa Gibeoni; waliwateka wote vitani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema kwa tafsiri ya karibu zaidi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi, “waliwachukua wote katika vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: uliofanya amani na
  rationale: Hifili ya שׁלם pamoja na אֶל hapa ina maana ya kuingia katika uhusiano wa amani. Kiswahili cha kawaida husema “kufanya amani na,” bila kuingiza wazo maalumu zaidi la kujisalimisha.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa karibu usemi wa Kiebrania wenye maana ya taifa, huku ikiwa wazi na yenye heshima katika Kiswahili.
- source_word: בִּלְתִּי
  choice: isipokuwa
  rationale: Neno hili linaonyesha kwamba Wahivi wa Gibeoni ndio waliokuwa pekee nje ya kauli hasi iliyotangulia.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: Wahivi waliokuwa wakikaa Gibeoni
  rationale: Inawakilisha kitenzi-shirikishi יֹשְׁבֵי, yaani watu waliokuwa wakaaji wa Gibeoni.
- source_word: אֶת הַכֹּל לָקְחוּ בַמִּלְחָמָה
  choice: miji mingine yote waliiteka vitani
  rationale: Katika muktadha wa kijeshi, לָקְחוּ ina maana ya kuitwaa au kuiteka. “Miji mingine yote” huweka wazi rejeo linalodokezwa na הַכֹּל, huku tanbihi ikihifadhi usemi halisi zaidi.
