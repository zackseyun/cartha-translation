id: JOS.11.3
reference: Joshua 11:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הַֽ/כְּנַעֲנִי֙ מִ/מִּזְרָ֣ח וּ/מִ/יָּ֔ם וְ/הָ/אֱמֹרִ֧י וְ/הַ/חִתִּ֛י וְ/הַ/פְּרִזִּ֥י וְ/הַ/יְבוּסִ֖י בָּ/הָ֑ר וְ/הַֽ/חִוִּי֙ תַּ֣חַת חֶרְמ֔וֹן בְּ/אֶ֖רֶץ הַ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: sw
  text: Wakanaani waliokuwa mashariki na magharibi[a], Waamori, Wahiti, Waperizi, na Wayebusi waliokuwa katika nchi ya vilima, na Wahivi waliokuwa chini ya Hermoni katika nchi ya Mispa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, neno kwa neno, “na kutoka baharini”; hapa huenda “bahari” ni istilahi ya kijiografia inayomaanisha upande wa magharibi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Nomino ya umoja katika Kiebrania imetumiwa kwa maana ya jamii nzima; Kiswahili cha kawaida hutumia wingi kwa jina la watu.
- source_word: מִמִּזְרָח
  choice: waliokuwa mashariki
  rationale: Ingawa kihusishi kinaweza kumaanisha ‘kutoka,’ hapa orodha ya kijiografia inaonyesha mahali walipokaa.
- source_word: וּמִיָּם
  choice: na magharibi
  rationale: Neno la Kiebrania ‘bahari’ mara nyingi humaanisha upande wa magharibi kwa sababu Bahari ya Mediterania iko magharibi mwa Kanaani; maana halisi imewekwa katika tanbihi.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: Waamori, Wahiti, Waperizi, na Wayebusi
  rationale: Majina ya umoja ya kijamii katika Kiebrania yametafsiriwa kwa wingi wa kawaida wa Kiswahili, kwa kuwa yanarejelea makundi ya watu.
- source_word: בָּהָר
  choice: katika nchi ya vilima
  rationale: Katika Yoshua, neno hili kwa kawaida hurejelea eneo la nyanda za juu au vilima, si lazima milima mirefu.
- source_word: הַחִוִּי
  choice: Wahivi
  rationale: Umoja wa kijamii wa Kiebrania umetolewa kwa wingi wa kawaida wa Kiswahili.
- source_word: תַּחַת חֶרְמוֹן
  choice: chini ya Hermoni
  rationale: Kirai kinaonyesha mahali palipo chini ya mlima Hermoni au kwenye miteremko yake ya chini, bila kuongeza neno lisilokuwapo katika maandishi.
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: katika nchi ya Mispa
  rationale: Neno אֶרֶץ linaonyesha eneo au nchi, huku Mispa likihifadhiwa kama jina la mahali.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka. Majina ya makabila yametolewa kwa wingi wa kawaida wa Kiswahili, huku uradidi wa ‘waliokuwa’ ukifafanua mgawanyo wa maeneo bila kubadili mpangilio wa orodha.
