id: JOS.11.14
reference: Joshua 11:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/כֹל שְׁלַ֞ל הֶ/עָרִ֤ים הָ/אֵ֨לֶּה֙ וְ/הַ/בְּהֵמָ֔ה בָּזְז֥וּ לָ/הֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֣ק אֶֽת כָּל הָ/אָדָ֞ם הִכּ֣וּ לְ/פִי חֶ֗רֶב עַד הִשְׁמִדָ/ם֙ אוֹתָ֔/ם לֹ֥א הִשְׁאִ֖ירוּ כָּל נְשָׁמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: sw
  text: Nao wana wa Israeli wakajitwalia nyara zote za miji hiyo pamoja na mifugo; lakini watu wote wakawaua kwa makali ya upanga mpaka wakawaangamiza. Hawakuacha chochote chenye pumzi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawakuacha hai chochote chenye pumzi,” au “Hawakuacha mtu yeyote aliyekuwa akipumua.”
    reason: Kiebrania kwa halisi kinarejelea kutokuacha “pumzi yoyote”; usemi huo unaweza kumaanisha kwamba hakuna aliyeachwa hai.
lexical_decisions:
- source_word: שְׁלַל
  choice: nyara
  rationale: Neno hili hutaja mali iliyotwaliwa vitani; “nyara” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: miji hiyo
  rationale: Kiashiria kinarejelea miji iliyotajwa katika simulizi lililotangulia; “hiyo” ni ya asili katika Kiswahili cha masimulizi.
- source_word: הַבְּהֵמָה
  choice: mifugo
  rationale: Katika muktadha wa nyara za vita, neno hili linamaanisha wanyama wanaofugwa na kutwaliwa kama mali.
- source_word: בָּזְזוּ לָהֶם
  choice: wakajitwalia
  rationale: Muundo huu unaonyesha kutwaa nyara kwa manufaa yao wenyewe; “wakajitwalia” hudumisha wazo la tendo na la kujinufaisha.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii huhifadhi taswira halisi ya kifamilia ya Kiebrania huku ikibaki yenye kueleweka na yenye heshima katika Kiswahili.
- source_word: רַק
  choice: lakini
  rationale: Hapa neno linaweka tofauti kali kati ya mifugo iliyotwaliwa na watu waliouawa; “lakini” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: כָּל הָאָדָם
  choice: watu wote
  rationale: אָדָם hapa ni jina la pamoja la wakazi wa kibinadamu, likitofautishwa na mifugo; “watu wote” halibani maana kwa wanaume pekee.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: wakawaua kwa makali ya upanga
  rationale: Tamathali ya Kiebrania ni ‘kwa kinywa cha upanga’; “kwa makali ya upanga” huhifadhi picha hiyo, na kitenzi “wakawaua” huweka wazi matokeo katika muktadha.
- source_word: עַד הִשְׁמִדָם אֹתָם
  choice: mpaka wakawaangamiza
  rationale: Hifili ya שׁמד ina maana ya kuharibu au kuangamiza kabisa; “wakawaangamiza” ni ya moja kwa moja bila kuingiza istilahi ya חרם isiyopo katika kishazi.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: Hawakuacha chochote chenye pumzi hai
  rationale: Tafsiri hii huhifadhi taswira ya pumzi iliyomo katika נְשָׁמָה na wakati huohuo kueleza kwamba hakuna kiumbe mwenye pumzi aliyeachwa hai.
theological_decisions:
- issue: Maana ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa kifamilia umehifadhiwa kwa sababu ni wazi katika Kiswahili na unaakisi namna chanzo kinavyowataja watu wa agano.
- issue: Upeo wa כָּל הָאָדָם
  choice: watu wote
  alternative: kila mtu
  rationale: Katika tofauti na mifugo, אָדָם hapa inawakilisha wakazi wa kibinadamu kwa pamoja; tafsiri haipaswi kueleweka kana kwamba inawahusu wanaume pekee.
- issue: Upeo wa כָּל נְשָׁמָה
  choice: chochote chenye pumzi hai
  alternative: mtu yeyote aliyekuwa akipumua
  rationale: Kiebrania kinaacha usemi mpana wa ‘kila pumzi’; tafsiri kuu huhifadhi upana na taswira hiyo badala ya kuufanya kwa lazima uwahusu watu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi la kihistoria na hadhi inayofaa maandiko. Msamiati kama “nyara,” “mifugo,” “makali ya upanga,” na “pumzi hai” ni wa sasa na unaeleweka bila kupunguza ukali wa chanzo.
