  yaml_path: translation/ot/joshua/011/022.yaml
  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: sw
  text: Hawakubaki wana wa Anaki wowote katika nchi ya wana wa Israeli; ila huko Gaza, Gathi na Ashdodi walibaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נוֹתַר
  choice: Hakubaki ... wowote
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na kwa msisitizo kwamba hakuna hata mmoja aliyesalia, huku ukihifadhi maana ya hali iliyotokana na vita vya Yoshua.
- source_word: עֲנָקִים
  choice: Waanaki
  rationale: Jina la kundi la watu limetoholewa kwa kufuata muundo wa majina ya watu katika Kiswahili, badala ya kufafanuliwa kwa maneno ya ziada.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: katika nchi ya wana wa Israeli
  rationale: Hili linahifadhi kwa uwazi muundo wa Kiebrania, 'wana wa Israeli,' kwa lugha ya Kiswahili inayoeleweka na yenye heshima.
- source_word: רַק
  choice: tu
  rationale: Neno 'tu' linaonyesha kikomo na tofauti kati ya nchi ya wana wa Israeli na miji iliyotajwa baadaye.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: Gaza, Gathi na Ashdodi
  rationale: Majina ya mahali yametoholewa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili; kihusishi hakihitaji kurudiwa mbele ya kila jina.
- source_word: נִשְׁאָרוּ
  choice: walibaki
  rationale: Kitenzi cha wingi kinawarejelea Waanaki na kurudia wazo la kusalia bila kuongeza neno lisilokuwapo wazi katika Kiebrania.
