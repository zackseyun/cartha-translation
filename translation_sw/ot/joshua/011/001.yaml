base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: sw
  text: Yabini, mfalme wa Hasori, aliposikia habari hizo[a][b], akatuma kwa Yobabu, mfalme wa Madoni, kwa mfalme wa Shimroni[c], na kwa mfalme wa Akshafu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri rasmi zaidi, “Ikawa, Yabini, mfalme wa Hasori, aliposikia.” Mfumo wa kawaida wa simulizi la Kiebrania umetolewa hapa kwa Kiswahili cha kawaida kuwa “aliposikia.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema tu “aliposikia”; maneno “habari hizo” yanadokezwa na muktadha uliotangulia.
    reason: cross_reference
  - marker: c
    text: Wengine hulitambulisha jina “Shimroni” hapa na mahali panapoitwa “Shimron-meroni” katika Yoshua 12:20.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: aliposikia habari hizo
  rationale: Muundo huu unaanzisha hali ya wakati katika simulizi. Kiswahili cha kawaida hutumia “aliposikia”; “habari hizo” inaweka wazi kwa njia ya asili jambo linalodokezwa na muktadha uliotangulia.
- source_word: יָבִין
  choice: Yabini
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: מֶלֶךְ חָצוֹר
  choice: mfalme wa Hasori
  rationale: Muundo wa Kiebrania wa cheo na mahali umetafsiriwa moja kwa moja; jina la mahali limetoholewa kwa Kiswahili.
- source_word: וַיִּשְׁלַח אֶל
  choice: akatuma ujumbe kwa
  rationale: Kitenzi cha Kiebrania kinasema kihalisi “akatuma kwa” bila kutaja kilichotumwa. Kwa kuwa usemi huo si wa kawaida katika Kiswahili, “ujumbe” umetumiwa kueleza kwa ufasaha mawasiliano yanayodokezwa bila kuamua kwamba wajumbe walitajwa wazi.
- source_word: אֶל יוֹבָב
  choice: kwa Yobabu
  rationale: Kihusishi na jina la mtu vimetafsiriwa moja kwa moja, huku jina likitoholewa kwa Kiswahili.
- source_word: מֶלֶךְ מָדוֹן
  choice: mfalme wa Madoni
  rationale: Cheo na jina la mahali vimetafsiriwa kwa kufuata muundo na maana ya Kiebrania.
- source_word: שִׁמְרוֹן
  choice: Shimroni
  rationale: Maandishi ya Kiebrania katika aya hii yana jina Shimroni; hayabadilishwi kuwa Shimron-meroni licha ya uwezekano wa uhusiano na Yoshua 12:20.
- source_word: אַכְשָׁף
  choice: Akshafu
  rationale: Jina la mahali limetoholewa kwa tahajia inayowakilisha konsonanti za Kiebrania na inayosomeka kwa Kiswahili.
