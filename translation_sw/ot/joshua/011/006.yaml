  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: sw
  text: Yahwe akamwambia Yoshua, “Usiwaogope, kwa maana kesho majira kama haya[a] nitawatoa wote mbele ya Israeli wakiwa wamekwisha kuuawa[b]. Utakata kano za miguu ya farasi wao, na magari yao ya vita utayachoma kwa moto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kesho karibu na wakati kama huu.”
    reason: Muundo wa Kiebrania unaweza kuonyesha wakati unaokadiriwa, si lazima wakati uleule kabisa.
  - marker: b
    text: Kwa Kiebrania, “ninawatoa wote mbele ya Israeli wakiwa watu waliouawa,” yaani, anawatoa ili waangushwe mbele ya Israeli.
    reason: Dokezo linaonyesha muundo halisi na maana ya kijeshi ya חֲלָלִים bila kuufanya mstari mkuu kuwa mzito.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililoandikwa katika Kiebrania kwa umbo la kawaida na linalosomeka kwa Kiswahili.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: Usiwaogope
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha moja kwa moja katazo la kuwaogopa maadui hao.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: kesho majira kama haya
  rationale: Linadumisha maana ya wakati unaokaribiana na wakati huu, bila kuufanya kuwa saa kamili isiyokusudiwa wazi na Kiebrania.
- source_word: אָנֹכִי נֹתֵן אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: nitawatia wote mbele ya Israeli wakiwa wameuawa
  rationale: Wakati ujao ni wa kawaida katika ahadi ya Kiswahili, huku muundo wa ‘wakiwa wameuawa’ ukihifadhi hali ya matokeo na ‘mbele ya Israeli’ ukidumisha taswira ya Kiebrania.
- source_word: תְּעַקֵּר
  choice: utakata kano za miguu ya farasi wao
  rationale: Kitenzi hiki katika muktadha wa kijeshi humaanisha kuwafanya farasi wasiweze kutumika kwa kukata kano zao; tafsiri hii ni wazi kuliko neno la jumla ‘kuwalemaza.’
- source_word: מַרְכְּבֹתֵיהֶם
  choice: magari yao ya vita
  rationale: Hutofautisha magari ya kivita ya kale na magari ya kawaida katika Kiswahili cha sasa.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: utayachoma kwa moto
  rationale: Linahifadhi kutajwa wazi kwa moto kama ilivyo katika chanzo.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu; kulitoa kama ‘Yahwe’ hulihifadhi bila kulibadilisha kuwa cheo.
- issue: Ahadi ya kuwatoa maadui wakiwa wameuawa
  choice: nitawatia wote mbele ya Israeli wakiwa wameuawa
  alternative: nitawatia wote mikononi mwa Israeli ili wawaue
  rationale: Tafsiri iliyochaguliwa haiongezi kishazi cha kusudi wala haifafanui kupita kiasi namna ambayo tendo la Mungu na tendo la Israeli yanahusiana; inadumisha mvutano wa usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Yoshua,’ ‘Israeli,’ ‘magari ya vita,’ na ‘kano za miguu’ ni maneno yanayoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa karibu na vifungu vinavyohusika.
