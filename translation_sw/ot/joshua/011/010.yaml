base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: sw
  text: Wakati huo Yoshua akarudi[a] na kuuteka Hasori, akampiga mfalme wake kwa upanga[c], kwa maana hapo zamani Hasori ulikuwa kichwa cha falme hizi zote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akageuka na kurudi.” Kitenzi cha Kiebrania kinaweza kueleza kurudi au kugeuka na kurudi katika mwendo wa kampeni.
    reason: lexical_alternative
  - marker: b
    text: Au “ulikuwa mkuu wa falme hizi zote.” Kiebrania kinasema kihalisi “ulikuwa kichwa cha falme hizi zote,” sitiari inayoonyesha nafasi ya kwanza au ukuu.
    reason: lexical_alternative
  - marker: c
    text: “Akampiga ... kwa upanga” ni tafsiri iliyojizuia ya Kiebrania. Katika muktadha maneno hayo huenda yanamaanisha kwamba alimuua, lakini kitenzi chenyewe kihalisi ni “alimpiga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב hapa kinaonyesha kurudi au kugeuka kurudi katika mwendo wa kampeni. “Akarudi” ni Kiswahili cha kawaida na cha wazi; uwezekano wa “akageuka kurudi” umehifadhiwa katika tanbihi.
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa wakati ambao hauulazimishi kuwa dakika au wakati mfupi mahususi.
- source_word: וַיִּלְכֹּד
  choice: kuuteka
  rationale: לכד hutumiwa kwa kutwaa mji katika vita. “Kuuteka” ni usemi wa kawaida wa kijeshi, na kiambishi “u-” kinarejelea mji wa Hasori.
- source_word: חָצוֹר
  choice: Hasori
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: מַלְכָּהּ
  choice: mfalme wake
  rationale: Kiambishi cha nafsi kinamrejelea Hasori kama mji; “mfalme wake” ni usemi wa asili wa Kiswahili.
- source_word: הִכָּה בֶחָרֶב
  choice: Akampiga ... kwa upanga
  rationale: נכה maana yake ya moja kwa moja ni kupiga. Muktadha huenda unaashiria kumuua, lakini tafsiri haijaongeza wazi kitenzi “kuua” ambacho hakipo katika kishazi chenyewe.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza maelezo yanayoonyesha umuhimu wa Hasori; “kwa maana” huhifadhi uhusiano huo wa ufafanuzi.
- source_word: לְפָנִים
  choice: hapo zamani
  rationale: Inaelekeza kwenye hali ya wakati uliopita; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: רֹאשׁ
  choice: kichwa
  rationale: Tafsiri ya moja kwa moja huhifadhi sitiari ya Kiebrania ya ukuu au nafasi ya kwanza.
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: falme hizi zote
  rationale: Huhifadhi wingi, ujumla, na nguvu ya kionyeshi cha Kiebrania kwa mpangilio wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya “kichwa” imehifadhiwa, huku maana yake ikifafanuliwa katika tanbihi. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na maneno yanayohusika.
