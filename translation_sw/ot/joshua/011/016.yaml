  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: sw
  text: 'Basi Yoshua akaitwaa nchi hii yote: nchi ya vilima, Negebu yote, nchi yote ya Gosheni,[a] Shefela,[b] Araba,[c] nchi ya vilima ya Israeli, na Shefela yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gosheni inayotajwa hapa ni eneo la Kanaani; si lazima iwe Gosheni ya Misri.
    reason: cultural_note
  - marker: b
    text: Shefela ni eneo la vilima vya chini kati ya nyanda za juu za kati na tambarare ya pwani. Pia linaweza kutafsiriwa “nchi ya vilima vya chini.” Neno hilo linatokea tena mwishoni mwa mstari.
    reason: lexical_alternative
  - marker: c
    text: Araba ni jina la eneo la kijiografia; wengine hulitafsiri kwa ufafanuzi kuwa “Bonde la Yordani” au “uwanda wa jangwani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akaitwaa
  rationale: Kitenzi לקח kimsingi humaanisha ‘kutwaa/kuchukua’; katika muhtasari huu wa ushindi, ‘akaitwaa’ ni Kiswahili cha kawaida kinachodokeza kupata nchi kwa ushindi bila kuongeza maelezo yasiyosemwa wazi.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: nchi hii yote
  rationale: אֶרֶץ hapa ni nchi au eneo, na mpangilio ‘nchi hii yote’ huhifadhi nguvu ya kiashirio הַזֹּאת kwa Kiswahili cha kawaida.
- source_word: הָהָר
  choice: nchi ya vilima
  rationale: Katika Yoshua, הָהָר mara nyingi ni jina la eneo la miinuko, si mlima mmoja mmoja; ‘nchi ya vilima’ linaeleza maana hiyo kwa uwazi.
- source_word: הַנֶּגֶב
  choice: Negebu
  rationale: Hili ni jina la eneo la kusini; kulitaja kama Negebu huhifadhi thamani yake kama jina la kijiografia badala ya kulifanya tu ‘kusini.’
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: nchi yote ya Gosheni
  rationale: Kifungu cha Kiebrania kinamaanisha nchi ya Gosheni; ‘yote’ huwakilisha כָּל inayotangulia kifungu hiki. Tafsiri haikulazimishi kulitambulisha eneo hili na Gosheni ya Misri.
- source_word: הַשְּׁפֵלָה
  choice: Shefela
  rationale: שְׁפֵלָה ni jina la eneo maalumu la vilima vya chini kati ya nyanda za juu za kati na tambarare ya pwani. Kutumia ‘Shefela’ kunazuia mkanganyiko wa ‘nchi tambarare’ na kuhifadhi jina la kijiografia; tanbihi hulifafanua.
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: עֲרָבָה hapa ni istilahi ya eneo la kijiografia. ‘Araba’ huhifadhi jina hilo bila kulibana kuwa Bonde la Yordani pekee.
- source_word: הַר יִשְׂרָאֵל
  choice: nchi ya vilima ya Israeli
  rationale: Kama הָהָר ya awali, הַר ina maana ya eneo la miinuko; muundo huu pia huhifadhi uhusiano wa ‘Israeli’ katika kifungu cha Kiebrania.
- source_word: וּשְׁפֵלָתוֹ
  choice: na Shefela yake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kinaelekea kurejelea nchi ya vilima ya Israeli. ‘Yake’ huhifadhi marejeo hayo na utofautishaji wa eneo la juu na eneo lake la chini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya maeneo ‘Negebu,’ ‘Shefela,’ na ‘Araba’ yametumika ili kuhifadhi orodha ya kijiografia; tanbihi zinafafanua istilahi zisizozoeleka. Viambishi vya kuunganisha katika ‘akaitwaa’ vinaendeleza mtiririko wa simulizi unaoonyeshwa na וַ.
