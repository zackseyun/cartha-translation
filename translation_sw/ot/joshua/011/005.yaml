  yaml_path: translation/ot/joshua/011/005.yaml
  text: All these kings met by agreement[a], and they came and encamped together at the waters of Merom to fight against Israel.
translation:
  language: sw
  text: Wafalme hawa wote wakakutana kwa makubaliano[a], wakaja na kupiga kambi pamoja kando ya maji ya Meromu ili kupigana na Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakakusanyika kwa makubaliano” au “wakakutana pamoja”; kitenzi cha Kiebrania kinaonyesha mkusanyiko uliopangwa, si mkutano wa bahati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  choice: wakakusanyika kwa makubaliano
  rationale: Kauli ya Niphal ya יעד hapa inaonyesha kukusanyika kulikopangwa au kuratibiwa, si kukutana kwa bahati. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la ushirika ulioratibiwa.
- source_word: כֹּל הַמְּלָכִים הָאֵלֶּה
  choice: wafalme hao wote
  rationale: Inadumisha maana ya jumla ya כֹּל na nguvu ya kielezi cha kurejelea wafalme waliotajwa katika muktadha wa karibu.
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Ni tafsiri nyepesi na ya moja kwa moja ya kitenzi cha kawaida cha masimulizi בוא.
- source_word: וַיַּחֲנוּ
  choice: kupiga kambi
  rationale: Huwakilisha maana ya kijeshi ya חנה kwa Kiswahili cha sasa na cha kawaida.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Inasisitiza tendo lao la pamoja kama muungano.
- source_word: אֶל מֵי מֵרוֹם
  choice: karibu na maji ya Meromu
  rationale: Katika muktadha wa kupiga kambi, אֶל hutaja mahali walikofikia; 'karibu na' ni Kiswahili asilia kinachofaa kwa eneo la maji huku 'maji' ikihifadhi namna ya usemi wa Kiebrania.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: ili kupigana na Israeli
  rationale: Infinitivu ya kusudi imetafsiriwa kwa 'ili'; katika muktadha wa kijeshi, kupigana 'na' Israeli huonyesha wazi uadui bila kulazimisha maana nyingine.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetolewa kwa vitenzi vya mfululizo vya 'waka-', huku sentensi ikigawanywa ili isomeke kwa urahisi. Jina Meromu limeandikwa kwa muundo unaotamkika kiasili katika Kiswahili.
