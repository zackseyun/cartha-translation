translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. “Magari ya vita” linafafanua chariots kwa msomaji wa sasa, na “umati mkubwa” linaepuka maana inayoweza kuchukuliwa kuwa hadhi au ukuu wa taifa badala ya wingi wa watu.
