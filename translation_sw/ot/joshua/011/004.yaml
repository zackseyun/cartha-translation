base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: sw
  text: Nao wakatoka, wao pamoja na kambi[a] zao zote, watu wengi sana, kama mchanga ulio ufukweni mwa bahari[b], wakiwa na farasi na magari mengi sana ya vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majeshi yao.” Neno la Kiebrania linaweza kumaanisha kambi za kijeshi na, kwa upanuzi, majeshi yaliyokusanyika humo.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kwa wingi.” Maneno haya yanasisitiza wingi wa watu, kama mchanga ulio ufukweni mwa bahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Nao wakatoka
  rationale: Kitenzi יצא kinaonyesha kutoka au kwenda nje. “Wakatoka” ni simulizi la kawaida la Kiswahili na haliongezi wazo la kijeshi lisilosemwa wazi na kitenzi.
- source_word: מַחֲנֵיהֶם
  choice: majeshi yao
  rationale: מַחֲנֶה inaweza kumaanisha kambi, eneo la kupiga kambi, au jeshi lililokusanyika kambini. Katika muktadha huu wa wafalme wanaokwenda vitani, “majeshi” linaeleweka kwa urahisi, huku tanbihi ikihifadhi taswira halisi ya kambi.
- source_word: עַם רָב
  choice: umati mkubwa
  rationale: Ingawa עַם kwa kawaida ni “watu,” hapa pamoja na רָב na tashbihi ya mchanga inaeleza kundi kubwa sana kwa idadi. “Umati mkubwa” ni Kiswahili cha kawaida kinachobeba maana hiyo.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: wengi kama mchanga ulio ufukweni mwa bahari
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania na kuonyesha wazi kwamba hoja ya ulinganisho ni wingi wao.
- source_word: סוּס
  choice: farasi
  rationale: Nomino ya Kiebrania iko katika umoja wa mkusanyiko; “farasi” kwa Kiswahili inaweza kutumika bila kubadilika kuonyesha mmoja au wengi, na hapa muktadha unaonyesha wingi.
- source_word: רֶכֶב
  choice: magari ya vita
  rationale: רֶכֶב hapa inamaanisha magari ya kukokotwa yaliyotumiwa vitani au kikosi cha magari hayo. “Magari ya vita” ni wazi zaidi kwa msomaji wa sasa kuliko “magari” pekee.
- source_word: רַב מְאֹד
  choice: mengi sana
  rationale: Maneno haya yanasisitiza idadi kubwa kupita kawaida ya farasi na magari ya vita; “mengi sana” ni ya asili na yanahifadhi msisitizo huo.
