source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוֹשֻׁ֜עַ בָּ/עֵ֣ת הַ/הִ֗יא וַ/יַּכְרֵ֤ת אֶת הָֽ/עֲנָקִים֙ מִן הָ/הָ֤ר מִן חֶבְרוֹן֙ מִן דְּבִ֣ר מִן עֲנָ֔ב וּ/מִ/כֹּל֙ הַ֣ר יְהוּדָ֔ה וּ/מִ/כֹּ֖ל הַ֣ר יִשְׂרָאֵ֑ל עִם עָרֵי/הֶ֖ם הֶחֱרִימָ֥/ם יְהוֹשֻֽׁעַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: sw
  text: Wakati huo Yoshua akaja, akawafutilia mbali Waanaki kutoka eneo la milima—kutoka Hebroni, Debiri, Anabu, na kutoka eneo lote la milima ya Yuda na kutoka eneo lote la milima ya Israeli. Yoshua akawafanya wakfu wa maangamizi[a], pamoja na miji yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kitaalamu zaidi, “akawaweka chini ya marufuku ya kuangamizwa.” Kitenzi cha Kiebrania kina maana ya kuwaweka watu au vitu wakfu wa maangamizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi בוא kinaendeleza simulizi kwa kuonyesha kuja au kufika kwa Yoshua; “akaja” ni cha kawaida na kinafuata mtazamo wa maandishi.
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa wakati unaounganisha tukio hili na simulizi lililotangulia bila kubainisha muda usiotajwa.
- source_word: וַיַּכְרֵת
  choice: kuwaondoa
  rationale: כרת kihalisi ni “kukata mbali”; hapa ina maana ya kuwaondoa Waanaki katika eneo hilo. “Kuwaondoa” ni Kiswahili cha sasa na pia huacha tofauti kati ya kitenzi hiki na חרם kinachofuata.
- source_word: הָעֲנָקִים
  choice: Waanaki
  rationale: Jina la kundi la watu limetoholewa kwa muundo wa kawaida wa Kiswahili.
- source_word: מִן הָהָר
  choice: kutoka nchi ya vilima
  rationale: Katika Yoshua, הָהָר mara nyingi ni eneo lote la nyanda za juu, si mlima mmoja.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: kutoka Hebroni, Debiri, Anabu
  rationale: Majina ya mahali yametoholewa kwa tahajia na matamshi yanayofaa Kiswahili; kurudia “kutoka” mwanzoni mwa orodha kunadumisha uhusiano wake na eneo waliloondolewa.
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: na kutoka nchi yote ya vilima vya Yuda
  rationale: Usemi huu unamaanisha eneo lote la nyanda za juu linalohusishwa na Yuda.
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: na nchi yote ya vilima vya Israeli
  rationale: “Israeli” limehifadhiwa kama jina la eneo bila kulipanua kwa tafsiri inayoweza kuondoa utata wake wa kihistoria-kijiografia.
- source_word: עִם עָרֵיהֶם
  choice: pamoja na miji yao
  rationale: עִם huonyesha kuambatana, na עָרִים hapa limetafsiriwa kwa neno la kawaida “miji.”
- source_word: הֶחֱרִימָם
  choice: akawatenga kwa ajili ya kuangamizwa
  rationale: חרם katika kausativi humaanisha kuweka watu au vitu chini ya hukumu maalumu ya kuangamizwa. Tafsiri hii huhifadhi dhana ya kutengwa kwa kusudi hilo badala ya kuifupisha kuwa “aliwaangamiza” tu.
theological_decisions:
- issue: Istilahi ya חרם katika vita
  choice: Yoshua akawatenga kwa ajili ya kuangamizwa
  alternative: Yoshua akawaweka chini ya marufuku; Yoshua akawaangamiza kabisa
  rationale: Aya inatumia כרת na חרם, hivyo tafsiri inapaswa kutofautisha dhana hizo. “Akawatenga kwa ajili ya kuangamizwa” huhifadhi nguvu maalumu ya kidini na kisheria ya חרם bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa sasa. Alama ya tanbihi imewekwa baada ya usemi unaotafsiri חרם, ambako maelezo hayo yanahusika.
