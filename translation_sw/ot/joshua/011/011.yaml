base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: sw
  text: Wakawaua kwa makali ya upanga watu wote waliokuwa humo, wakiwaweka wakfu kwa maangamizi[a]. Hakuna mwenye pumzi hata mmoja aliyebaki[b], naye akauchoma Hazori kwa moto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawaangamiza kabisa.” Kiebrania kinatumia neno חרם, linalomaanisha kuweka wakfu kwa maangamizi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hakuna pumzi yoyote iliyobaki”; hii ni nahau inayomaanisha kwamba hakuna aliye hai aliyenusurika.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania hubadilika kutoka wingi (“wakawaua”) kwenda umoja (“akauchoma”); huenda mtendaji wa mwisho ni Yoshua.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: Wakamuua
  rationale: Kitenzi נכה katika muktadha wa vita humaanisha kuua au kuangusha kwa kipigo. Kwa kuwa kitu kinachofuata ni ‘kila mtu’ katika umoja wa kijumla, ‘wakamuua’ ni Kiswahili cha kawaida na kinaonyesha matokeo ya tendo hilo.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: kila mtu aliyekuwa humo
  rationale: Neno נֶפֶשׁ hapa linamaanisha mtu aliye hai, si nafsi isiyo na mwili. ‘Kila mtu’ huwasilisha maana hiyo wazi na huhifadhi umoja wa kijumla wa Kiebrania.
- source_word: לְפִי חֶרֶב
  choice: kwa makali ya upanga
  rationale: Hii ni nahau ya Kiebrania, kihalisi ‘kwa kinywa cha upanga.’ ‘Kwa makali ya upanga’ huhifadhi taswira yake kwa Kiswahili cha kawaida.
- source_word: הַחֲרֵם
  choice: wakawaweka wakfu waangamizwe
  rationale: Neno חרם katika simulizi la ushindi linaonyesha kutengwa au kuwekwa wakfu kwa ajili ya maangamizi, si kuua tu. Kauli hii huhifadhi uzito huo huku ikibaki kueleweka.
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: Hakuna yeyote mwenye pumzi aliyebaki
  rationale: Kihalisi usemi huo unahusu kutobaki kwa yeyote mwenye pumzi; katika muktadha ni nahau inayosisitiza kwamba hakuna aliye hai aliyenusurika.
- source_word: חָצוֹר
  choice: Hazori
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: שָׂרַף בָּאֵשׁ
  choice: akauchoma Hazori kwa moto
  rationale: Kauli hii huhifadhi kitenzi cha umoja pamoja na mtajo wa wazi wa moto uliomo katika Kiebrania.
theological_decisions:
- issue: Maana ya חרם katika muktadha wa ushindi
  choice: wakawaweka wakfu waangamizwe
  alternative: wakawaangamiza kabisa
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la kutengwa au kuwekwa wakfu kwa maangamizi lililomo katika חרם, bila kupunguza usemi huo kuwa maelezo ya kijeshi pekee wala kuongeza fundisho la dhehebu fulani.
- issue: Kubadilika kwa mtendaji kutoka wingi kwenda umoja
  choice: Wakamuua … naye akauchoma Hazori
  alternative: Wakamuua … nao wakauchoma Hazori
  rationale: Kiebrania hubadilika kutoka kitenzi cha wingi וַיַּכּוּ kwenda kitenzi cha umoja שָׂרַף. Tafsiri imehifadhi badiliko hilo; huenda mtendaji wa mwisho ni Yoshua, ingawa jina lake halitajwi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku nahau ya upanga, lugha ya חרם, na badiliko la mtendaji kutoka wingi kwenda umoja vikihifadhiwa. ‘Naye’ huunganisha kishazi cha mwisho bila kumtaja Yoshua moja kwa moja, kwa kuwa jina lake halipo katika mstari wenyewe.
