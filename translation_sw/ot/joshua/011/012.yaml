base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: sw
  text: Yoshua akaiteka miji yote ya wafalme hao, pamoja na wafalme wao wote. Akawaua kwa makali ya upanga, akawaweka wakfu kwa ajili ya maangamizi[a], kama Musa, mtumishi wa Yahwe, alivyoamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwaangamiza kabisa.” Kiebrania kinatumia kitenzi cha kiufundi kinachomaanisha kuwaweka watu au vitu chini ya heremu, yaani kuwaweka wakfu bila kubatilishwa ili waangamizwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: miji yote ya wafalme hao
  rationale: Muundo wa Kiebrania unasema kihalisi ‘miji ya wafalme hao.’ Tafsiri hii huhifadhi uhusiano na wafalme waliotajwa bila kuifasiri kwa upana kuwa ‘miji ya kifalme.’
- source_word: לָכַד
  choice: akaiteka
  rationale: Katika muktadha wa vita, ‘kuteka’ hueleza kwa kawaida kuichukua miji kwa nguvu za kijeshi.
- source_word: וַיַּכֵּם
  choice: akawaua
  rationale: Kitenzi נכה kina maana pana ya kupiga, lakini hapa usemi unaofuata, ‘kwa makali ya upanga,’ unaonyesha kwamba tendo hilo lilisababisha kifo.
- source_word: לְפִי חֶרֶב
  choice: kwa makali ya upanga
  rationale: Huu ni usemi wa Kiebrania wenye maana halisi ya ‘kwa kinywa cha upanga.’ ‘Kwa makali ya upanga’ huhifadhi taswira yake kwa Kiswahili kinachoeleweka.
- source_word: הֶחֱרִים
  choice: kuwaweka wakfu kwa maangamizi
  rationale: Kitenzi hiki cha kiufundi humaanisha kuweka watu au vitu chini ya heremu, yaani kuwatoa kabisa ili waangamizwe. Tafsiri hii huhifadhi dhana ya kuwekwa wakfu pamoja na matokeo ya maangamizi.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: kama ... alivyoamuru
  rationale: Muundo huu unaonyesha kwamba tendo la Yoshua lilipatana na amri iliyotolewa hapo awali na Mose.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahwe
  rationale: Hapa עֶבֶד ni cheo cha heshima na cha agano kwa Mose; ‘mtumishi’ ni la kawaida na linalofaa kuliko ‘mtumwa.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo ‘BWANA.’
theological_decisions:
- issue: Tafsiri ya lugha ya חרם katika simulizi la ushindi
  choice: kuwaweka wakfu kwa maangamizi
  alternative: kuwaangamiza kabisa
  rationale: Kiebrania kinatumia istilahi ya kiufundi ya heremu, si kitenzi cha kawaida tu cha kuangamiza. Chaguo hili huhifadhi uzito wake wa kidini na wa agano huku tanbihi ikieleza maana yake.
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili kupunguza uzito wa mfululizo wa vitenzi. ‘Wafalme wote wa miji hiyo’ huweka wazi rejeo la kiwakilishi cha Kiebrania bila kubadili maana, na lugha ya heremu imehifadhiwa badala ya kusawazishwa kuwa maangamizi ya kawaida.
