  text: כִּ֣י מֵ/אֵ֣ת יְהוָ֣ה הָיְתָ֡ה לְ/חַזֵּ֣ק אֶת לִבָּ/ם֩ לִ/קְרַ֨את הַ/מִּלְחָמָ֤ה אֶת יִשְׂרָאֵל֙ לְמַ֣עַן הַֽחֲרִימָ֔/ם לְ/בִלְתִּ֥י הֱיוֹת לָ/הֶ֖ם תְּחִנָּ֑ה כִּ֚י לְמַ֣עַן הַשְׁמִידָ֔/ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Kwa maana ni Yahweh aliyefanya mioyo yao kuwa migumu, ili wakabiliane na Israeli vitani, kusudi awaweke wakfu kwa maangamizi, ili kusiwe na ombi la rehema kwa ajili yao, bali awaangamize, kama Yahweh alivyomwamuru Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: Yahweh ndiye
  rationale: Kiebrania kinamtaja Yahweh moja kwa moja kuwa chanzo cha jambo hilo. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha wazi utendaji wake bila kuupunguza kuwa ruhusa tu.
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: aliyeifanya mioyo yao kuwa migumu
  rationale: Ingawa חזק kwa msingi humaanisha kuimarisha, hapa inaeleza kuwafanya wawe na ukaidi thabiti dhidi ya Israeli; ‘kuifanya mioyo yao kuwa migumu’ hudumisha maana hiyo na mvutano wa kitheolojia.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: ili wakabiliane na Israeli vitani
  rationale: Kauli hii inaonyesha kukutana na Israeli kwa uhasama wa kivita. ‘Wakabiliane ... vitani’ ni Kiswahili cha sasa, wazi na cha heshima.
- source_word: לְמַעַן הַחֲרִימָם
  choice: kusudi awaweke wakfu kwa maangamizi
  rationale: חרם ni istilahi ya kuweka kitu chini ya hukumu kwa kuangamizwa. Tafsiri hii huhifadhi dhana ya kuwekwa wakfu badala ya kuifanya iwe tu kauli ya kawaida ya kuua.
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: wasipate rehema
  rationale: תְּחִנָּה inaweza kumaanisha ombi la fadhili au rehema yenyewe. Kauli kuu ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya ombi.
- source_word: לְמַעַן הַשְׁמִידָם
  choice: bali awaangamize
  rationale: שמד huonyesha kuharibu au kuangamiza kabisa. ‘Awaangamize’ ni kali, wazi na inafaa sajili ya simulizi la hukumu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama Yahweh alivyokuwa amemwamuru Mose
  rationale: Kauli hii inaonyesha kwamba kuangamizwa huko kulipatana na amri iliyotolewa kwa Mose hapo awali.
theological_decisions:
- issue: Utendaji wa Mungu katika kuifanya mioyo ya wafalme wa Kanaani kuwa migumu
  choice: Yahweh ndiye aliyeifanya mioyo yao kuwa migumu
  alternative: Yahweh aliruhusu mioyo yao kuwa migumu
  rationale: Kiebrania kinahusisha jambo hilo moja kwa moja na Yahweh. Tafsiri haibadili utendaji huo kuwa ruhusa tu, bali inaacha mvutano kati ya enzi ya Mungu na upinzani wa wanadamu ubaki.
- issue: Maana ya חרם katika hukumu
  choice: awaweke wakfu kwa maangamizi
  alternative: awaangamize kabisa
  rationale: Chaguo kuu huhifadhi maana maalumu ya kitu kuwekwa chini ya marufuku au hukumu kwa kuangamizwa; tanbihi inaeleza dhana hiyo kwa msomaji wa kawaida.
- issue: Utata wa תְּחִנָּה
  choice: wasipate rehema
  alternative: kusiwe na ombi la rehema kwa ajili yao
  rationale: Neno linaweza kuelekea kwenye rehema/fadhili au ombi la kuzipata. Maandishi makuu yanatumia Kiswahili cha kawaida, na tanbihi inahifadhi usomaji mwingine bila kuamua kupita ushahidi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Sentensi imetengenezwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi urudiaji wa kusudi, ukali wa hukumu, na utendaji wa Yahweh ulio wazi katika Kiebrania.
