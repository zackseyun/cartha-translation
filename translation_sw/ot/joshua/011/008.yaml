base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: sw
  text: Yahweh akawatia mikononi mwa Israeli, nao wakawapiga na kuwafuatilia mpaka Sidoni Kuu, mpaka Misrefoth-maimu[a], na mpaka Bonde la Mispa upande wa mashariki. Wakawapiga mpaka hawakuacha manusura yeyote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misrefoth-maimu ni jina la mahali; maneno ya Kiebrania huenda yakamaanisha “mahali pa kuchomea maji.”
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania hakitaji wazi mtendaji kuwa ni mmoja au wengi. Pia yaweza kutafsiriwa, “mpaka hakuacha manusura yeyote,” yaani Israeli kwa umoja au Yoshua kama mwakilishi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: akawatia mikononi mwa Israeli
  rationale: Nahau ya Kiebrania ya kutia adui katika mamlaka ya mwingine imetafsiriwa kwa Kiswahili cha kawaida huku taswira ya mkono ikihifadhiwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: wakawapiga / wakaendelea kuwapiga
  rationale: Kitenzi נכה katika muktadha wa vita kina nguvu ya kupiga na kushinda; 'kuwapiga' huhifadhi taswira ya chanzo bila kulazimisha kwamba kila tendo lenyewe lilimaanisha kuua.
- source_word: וַיִּרְדְּפוּם
  choice: kuwafuatilia
  rationale: Hili ni neno la kawaida la kuwafuatilia maadui wanaokimbia.
- source_word: צִידוֹן רַבָּה
  choice: Sidoni Mkuu
  rationale: Jina la mji limetoholewa, na kivumishi רַבָּה kimetafsiriwa kwa namna ya kawaida ya Kiswahili.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: Misrefoth-maimu
  rationale: Kirai kinafanya kazi kama jina la mahali, kwa hiyo kimetoholewa; maana yake ya kimsamiati imehifadhiwa katika tanbihi.
- source_word: בִּקְעַת מִצְפֶּה מִזְרָחָה
  choice: Bonde la Mispa upande wa mashariki
  rationale: בִּקְעָה ni bonde pana, na umbo la mwelekeo מִזְרָחָה limewasilishwa kwa kawaida kama 'upande wa mashariki.'
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: mpaka hawakuwaachia manusura hata mmoja
  rationale: Tafsiri hii hutoa maana ya kutobakiza mtu aliyepona. 'Manusura hata mmoja' ni ya kawaida na sahihi kuliko nomino ya dhahania kama 'mabaki.'
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu; kulitohowa kama 'Yahwe' huhifadhi tofauti kati ya jina hilo na cheo.
- issue: Mtendaji katika kirai cha mwisho עַד בִּלְתִּי הִשְׁאִיר
  choice: hawakuwaachia
  alternative: hakuwaachia / hakuna manusura aliyesalia
  rationale: הִשְׁאִיר ni umbo la kitenzi-jina lisiloonyesha idadi ya mtendaji. Mfululizo wa vitenzi vya wingi unaunga mkono 'wao,' lakini uwezekano wa kuelewa Israeli kwa umoja au Yoshua kama mwakilishi umeonyeshwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya Biblia lakini kinachoeleweka kwa wasomaji wa sasa. Majina yametoholewa kwa maumbo yanayotambulika, na tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
