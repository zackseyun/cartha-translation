  text: מִן הָ/הָ֤ר הֶֽ/חָלָק֙ הָ/עוֹלֶ֣ה שֵׂעִ֔יר וְ/עַד בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן תַּ֖חַת הַר חֶרְמ֑וֹן וְ/אֵ֤ת כָּל מַלְכֵי/הֶם֙ לָכַ֔ד וַ/יַּכֵּ֖/ם וַ/יְמִיתֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: sw
  text: kuanzia Mlima Halaki[a], unaoinuka kuelekea Seiri, hadi Baal-gadi katika Bonde la Lebanoni[b], chini ya Mlima Hermoni. Yoshua aliwakamata wafalme wao wote, akawapiga na kuwaua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlima laini.” Kiebrania kinaweza kueleweka kama maelezo, lakini hapa huenda ni jina la mahali, “Mlima Halaki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika Uwanda wa Lebanoni.” Neno la Kiebrania linaweza kumaanisha bonde pana au uwanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: Mlima Halaki
  rationale: Katika muhtasari huu wa kijiografia, kirai hiki kinaeleweka vizuri zaidi kama jina la mahali; umbo la Kiswahili linafuata kawaida ya uhawilishaji wa majina ya Kiebrania.
- source_word: הָעֹלֶה
  choice: unaoinuka
  rationale: Kauli endelevu inaeleza mwinuko au mwelekeo wa eneo la mlima kwa lugha ya asili ya Kiswahili.
- source_word: שֵׂעִיר
  choice: Seiri
  rationale: Jina la mahali limehawilishwa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: וְעַד
  choice: hadi
  rationale: Inaonyesha mpaka au upeo wa eneo lililotajwa kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: בַּעַל גָּד
  choice: Baal-gadi
  rationale: Ni jina la mahali, hivyo limehawilishwa badala ya kutafsiriwa maana yake.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: katika Bonde la Lebanoni
  rationale: בִּקְעָה inaweza kumaanisha bonde pana au uwanda; 'Bonde' linafaa kwa mazingira haya huku tanbihi ikihifadhi maana nyingine.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: chini ya Mlima Hermoni
  rationale: Inaonyesha mahali palipo chini kwa kulinganishwa na Mlima Hermoni, bila kuongeza wazo lisilosemwa wazi la kuwa hasa kwenye kitako chake.
- source_word: וְאֵת כָּל מַלְכֵיהֶם לָכַד
  choice: Yoshua aliwakamata wafalme wao wote
  rationale: Kitenzi 'aliwakamata' kinafaa kwa wafalme waliotekwa vitani. Jina 'Yoshua' limetajwa ili kuepusha utata wa kiwakilishi baada ya sentensi ya mpaka wa kijiografia, ingawa Kiebrania kina kiima kilichodokezwa.
- source_word: וַיַּכֵּם
  choice: akawapiga
  rationale: Huhifadhi maana pana ya נכה kama kuwapiga au kuwaangusha, bila kuifananisha kabisa na kitenzi kinachofuata cha kuua.
- source_word: וַיְמִיתֵם
  choice: na kuwaua
  rationale: Hili linaeleza wazi kusababisha kifo na kudumisha hatua ya mwisho baada ya kuwapiga.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na wenye hadhi. Majina ya maeneo yamehawilishwa kwa maumbo yanayoeleweka katika matumizi ya Biblia ya Kiswahili. Muundo wa 'kuanzia ... hadi ...' unaonyesha upeo wa eneo kwa uwazi; marudio ya vitenzi 'akawapiga na kuwaua' yanahifadhi utofauti wa vitendo viwili vya Kiebrania.
