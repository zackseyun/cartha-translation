  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: sw
  text: Kama vile Yahweh alivyomwamuru Musa, mtumishi wake, ndivyo Musa alivyomwamuru Yoshua, na Yoshua akafanya vivyo hivyo. Hakupunguza hata jambo moja katika yote ambayo Yahweh alimwamuru Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakupuuza jambo lolote katika yote ambayo Yahweh alimwamuru Musa.” Kihalisi, “Hakuondoa jambo lolote kutoka katika yote ambayo Yahweh alimwamuru Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kama vile
  rationale: Huanzisha ulinganisho wa moja kwa moja kati ya amri ya Yahweh kwa Musa na amri ya Musa kwa Yoshua; ni Kiswahili cha kawaida na wazi.
- source_word: צִוָּה
  choice: alivyomwamuru / alikuwa amemwamuru
  rationale: Kitenzi kinaonyesha amri yenye mamlaka. Wakati timilifu katika sehemu ya mwisho huonyesha kwamba amri hiyo ilitangulia utekelezaji wa Yoshua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limeandikwa kwa matamshi ya jina badala ya kubadilishwa kuwa cheo.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Katika muktadha huu ni jina la heshima la agano kwa Musa; “mtumishi” ni la asili kuliko “mtumwa” bila kupoteza wazo la kumtumikia mwenye mamlaka.
- source_word: כֵּן
  choice: ndivyo / vivyo hivyo
  rationale: Huonyesha uwiano kati ya amri na utekelezaji. Tofauti ndogo ya Kiswahili inaleta sentensi ya asili huku ikihifadhi urudiaji wa maana.
- source_word: עָשָׂה
  choice: akafanya
  rationale: Huhifadhi upana na ufupi wa kitenzi cha Kiebrania; muktadha unaonyesha kuwa Yoshua alitekeleza alichoamriwa.
- source_word: לֹא הֵסִיר דָּבָר
  choice: Hakuacha jambo lolote
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha maana ya kutopunguza au kutosaza chochote katika amri, bila kufanya tafsiri kuwa ngumu isivyo lazima.
- source_word: מִכֹּל אֲשֶׁר
  choice: katika yote ambayo
  rationale: Huonyesha ukamilifu wa mambo yote yaliyoamriwa na kuendana kwa kawaida na “hakuacha jambo lolote.”
- source_word: אֶת
  choice: '[halijatafsiriwa]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania na halina neno huru linalolingana nalo katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Matini ina jina la Mungu moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza fasiri ya kimadhehebu.
- issue: Kiwango cha utii wa Yoshua
  choice: Hakuacha jambo lolote katika yote ambayo Yahweh alikuwa amemwamuru Musa
  alternative: Hakuondoa neno lolote katika yote ambayo Yahweh alimwamuru Musa
  rationale: Kiebrania kwa halisi husema hakuliondoa jambo/neno. Tafsiri iliyochaguliwa huonyesha utekelezaji kamili huku tanbihi ikihifadhi taswira halisi na uwezekano wa “hakupunguza chochote.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “kama vile ... ndivyo” unadumisha uwiano wa Kiebrania; “akafanya vivyo hivyo” ni wa asili na huhifadhi ufupi wa simulizi.
