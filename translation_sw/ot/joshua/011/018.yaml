translation:
  language: sw
  text: Yoshua alipigana vita dhidi ya wafalme hao wote kwa siku nyingi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yoshua alipigana vita dhidi ya wafalme hao wote kwa muda mrefu.” Kiebrania kinasema kihalisi “siku nyingi” na kinatumia nahau “alifanya vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: kwa siku nyingi
  rationale: Huhifadhi usemi halisi wa Kiebrania, huku ukieleweka kwa kawaida kuwa kipindi kirefu.
- source_word: עָשָׂה ... מִלְחָמָה
  choice: alipigana vita
  rationale: Ingawa kwa muundo wa maneno ni ‘alifanya vita,’ ‘alipigana vita’ ni nahau ya kawaida ya Kiswahili inayowasilisha kwa usahihi maana ya kuendesha vita.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: dhidi ya wafalme hao wote
  rationale: ‘Dhidi ya’ huonyesha wazi uhusiano wa uhasama unaodokezwa na nahau ya Kiebrania; ‘hao’ hurejelea wafalme waliotajwa katika muktadha.
- source_word: מִלְחָמָה
  choice: vita
  rationale: ‘Vita’ ni neno la kawaida na lenye hadhi linalofaa kwa maana ya vita au mapigano katika nahau hii.
