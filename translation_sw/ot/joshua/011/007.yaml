base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: sw
  text: Basi Yoshua na wapiganaji wote[a] waliokuwa pamoja naye wakawajia ghafla kwenye maji ya Meromu, wakawavamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno halisi: “watu wote wa vita”; tafsiri ya jadi: “wanaume wote wa vita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakawajia
  rationale: Kitenzi בוא katika simulizi kinaweza kumaanisha kuja au kwenda kulingana na mtazamo. Hapa, pamoja na עֲלֵיהֶם, kinaeleza kusogea kwa uhasama kuelekea adui; “wakawajia” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: עַם הַמִּלְחָמָה
  choice: wapiganaji wote
  rationale: Kirai hiki kwa kawaida ni “watu wa vita.” “Wapiganaji wote” ni cha sasa na cha asili katika Kiswahili, kinahifadhi maana ya kundi la watu wa kupigana bila kuongeza kwamba walikuwa wanaume pekee.
- source_word: עִמּוֹ
  choice: waliokuwa pamoja naye
  rationale: Huwasilisha wazi uandamani unaoonyeshwa na kihusishi pamoja na kiambishi cha nafsi.
- source_word: עֲלֵיהֶם
  choice: wakawajia
  rationale: על pamoja na mwendo wa kijeshi huweza kuwa na maana ya kuelekea au dhidi ya. Maana hiyo imejumuishwa kiasili katika “kuwajia” kwa muktadha huu wa mashambulizi.
- source_word: עַל מֵי מֵרוֹם
  choice: hapo kwenye maji ya Meromu
  rationale: Hutaja mahali pa tukio katika eneo la maji yanayoitwa Meromu. “Hapo kwenye” huonyesha eneo bila kulazimisha kwamba walikuwa ndani ya maji.
- source_word: פִּתְאֹם
  choice: ghafla
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi hali ya kutokea bila kutarajiwa na kasi ya shambulio.
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: wakawavamia
  rationale: נפל pamoja na ב ni nahau ya kijeshi yenye maana ya kuwaangukia kwa shambulio. “Kuwavamia” ni nahau ya Kiswahili iliyo wazi na yenye nguvu kuliko tafsiri ya neno kwa neno.
- source_word: וְ
  choice: Basi
  rationale: Waw ya mwanzo inaendeleza mfululizo wa simulizi. “Basi” huunganisha tukio hili na yaliyotangulia kwa mtiririko wa kawaida wa Kiswahili.
theological_decisions: []
