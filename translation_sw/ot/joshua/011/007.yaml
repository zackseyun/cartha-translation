  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umewekwa wenye mwendo wa haraka, huku “wapiganaji” ikiepuka uainishaji wa kijinsia usiotajwa wazi na nomino ya pamoja ya Kiebrania.
