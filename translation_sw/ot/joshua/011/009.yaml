  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: sw
  text: 'Yoshua akawatendea kama vile Yahwe alivyomwambia: akakata kano za miguu za farasi wao[a], na akayateketeza magari yao ya vita kwa moto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawalemaza farasi wao”; neno la Kiebrania linamaanisha hasa kukata kano za miguu yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: Yoshua akawatendea
  rationale: Muundo wa עשה + ל unaonyesha kitendo kilichoelekezwa kwao. ‘Akawatendea’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo katika muktadha wa kijeshi.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: kama vile ... alivyomwambia
  rationale: ‘Kama vile’ linaonyesha ulinganisho na utekelezaji kamili wa maagizo, huku ‘alivyomwambia’ likifaa kwa mtiririko wa simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: סוּסֵיהֶם
  choice: farasi wao
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa wingi wa סוּס.
- source_word: עִקֵּר
  choice: akazikata kano za miguu
  rationale: Kitenzi hiki humaanisha kuwalemaza wanyama kwa kukata kano za miguu. Tafsiri hii ni sahihi na inaeleweka kuliko kutumia neno la jumla ‘kuwalemaza’ pekee.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: magari yao ya vita
  rationale: ‘Magari ya vita’ huwasilisha kwa uwazi magari ya kukokotwa yaliyotumiwa vitani katika muktadha wa kale.
- source_word: שָׂרַף בָּאֵשׁ
  choice: kuyateketeza ... kwa moto
  rationale: Kirai ‘kwa moto’ kinahifadhi kutajwa wazi kwa אֵשׁ katika Kiebrania, na ‘kuyateketeza’ ni Kiswahili cha asili kinachoonyesha kuyachoma kabisa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina binafsi la Mungu badala ya kuliweka kama cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. ‘Magari ya vita’ limetumiwa badala ya ‘magari’ pekee ili maana ya magari ya kijeshi ya kale iwe wazi.
