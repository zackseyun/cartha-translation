  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: sw
  text: 'Nao wakala baadhi ya mazao ya nchi[a] siku iliyofuata Pasaka: mikate isiyotiwa chachu na nafaka iliyooka[b], siku hiyo hiyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baadhi ya mazao ya zamani ya nchi.” Neno la Kiebrania linaweza kumaanisha mazao au mavuno ya nchi; wengine huelewa muktadha kuwa unamaanisha mazao yaliyohifadhiwa kutoka mavuno yaliyotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au, “nafaka iliyokaangwa” au “nafaka iliyochomwa.” Kiebrania kinamaanisha nafaka iliyotayarishwa kwa kuokwa au kuchomwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: Nao wakala
  rationale: Huhifadhi mtiririko wa masimulizi wa wayyiqtol kwa Kiswahili cha kawaida bila kuongeza wazo maalumu la wakati.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: baadhi ya mazao ya nchi
  rationale: עֲבוּר humaanisha mazao au mavuno ya nchi. Neno “baadhi” linaonyesha kwa Kiswahili cha asili kwamba walikula sehemu ya mazao hayo, bila kudai kuwa neno la Kiebrania lenyewe linamaanisha “baadhi.”
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: siku iliyofuata Pasaka
  rationale: Ni usemi wa wazi wa Kiswahili unaowasilisha kwa usahihi wakati unaotajwa, yaani siku baada ya Pasaka.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Hili ni tamko la kawaida na linaloeleweka la mikate isiyo na chachu katika muktadha wa Pasaka.
- source_word: וְקָלוּי
  choice: na nafaka iliyokaangwa
  rationale: קָלוּי ni nafaka iliyotayarishwa kwa kuangwa au kuchomwa. “Iliyokaangwa” ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: siku iyo hiyo
  rationale: Huhifadhi msisitizo wa nahau ya Kiebrania kwamba jambo hilo lilitokea katika siku ileile hasa.
