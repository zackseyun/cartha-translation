base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: sw
  text: Ndipo mkuu wa jeshi la Yahwe[a] akamwambia Yoshua, “Vua kiatu chako mguuni mwako[b], kwa maana mahali unaposimama ni patakatifu.” Yoshua akafanya hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuu wa jeshi la BWANA” au “mkuu wa majeshi ya BWANA.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kina umoja: “kiatu chako ... mguu wako.” Linganisha na maneno ya wingi yanayofahamika zaidi katika Kutoka 3:5.'
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: mkuu
  rationale: Katika muktadha wa kijeshi, “mkuu” huonyesha mwenye mamlaka ya kuongoza bila kuingiza cheo mahususi cha kisasa.
- source_word: צְבָא יְהוָה
  choice: jeshi la Yahwe
  rationale: צָבָא hapa ina maana ya jeshi; muundo huu ni wa kawaida na wazi katika Kiswahili, huku jina la Mungu likihifadhiwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: שַׁל נַעַלְךָ מֵעַל רַגְלְךָ
  choice: Vua kiatu chako mguuni mwako
  rationale: “Vua” ni amri ya kawaida ya kuondoa kiatu; umoja wa “kiatu” na “mguu” umehifadhiwa kama ulivyo katika Kiebrania.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו
  choice: mahali unaposimama
  rationale: Ni Kiswahili cha asili kinachowasilisha mahali ambapo Yoshua alikuwa amesimama bila kurudia kihusishi kisichohitajika.
- source_word: קֹדֶשׁ הוּא
  choice: ni patakatifu
  rationale: Upatanisho wa kisarufi na “mahali” unahitaji “pa-”; “patakatifu” huhifadhi maana ya utakatifu wa mahali.
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  choice: Yoshua akafanya hivyo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi taarifa ya utii wa Yoshua.
theological_decisions:
- issue: Utambulisho na hadhi ya שַׂר צְבָא יְהוָה
  choice: mkuu wa jeshi la Yahwe
  alternative: malaika mkuu wa jeshi; udhihirisho wa Yahwe; Kristo kabla ya kupata mwili
  rationale: Aya inamtaja msemaji kwa cheo hiki lakini haisemi wazi kama ni malaika, udhihirisho wa Mungu, au Kristo kabla ya kupata mwili. Tafsiri ya kimaelezo inalinda mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Sentensi ni wazi kwa msomaji wa kawaida; umoja wa Kiebrania umehifadhiwa, na utambulisho wa msemaji haujafafanuliwa zaidi ya maandishi yenyewe.
