  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha urudiaji wa ‘watu wote’ na utofauti wa vizazi viwili, huku ikitumia miundo ya kawaida ya Kiswahili.
