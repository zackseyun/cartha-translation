id: JOS.5.5
reference: Joshua 5:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי מֻלִ֣ים הָי֔וּ כָּל הָ/עָ֖ם הַ/יֹּֽצְאִ֑ים וְ/כָל הָ֠/עָם הַ/יִּלֹּדִ֨ים בַּ/מִּדְבָּ֥ר בַּ/דֶּ֛רֶךְ בְּ/צֵאתָ֥/ם מִ/מִּצְרַ֖יִם לֹא מָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: sw
  text: Kwa maana watu wote waliotoka Misri walikuwa wametahiriwa, lakini watu wote waliozaliwa jangwani njiani baada ya kutoka Misri hawakuwa wametahiriwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha aya hii na aya iliyotangulia kwa kutoa maelezo ya sababu, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מֻלִים הָיוּ
  choice: walikuwa wametahiriwa
  rationale: Muundo wa kitenzi kishirikishi na kitenzi היה unaonyesha hali iliyokuwapo tayari; wakati timilifu uliopita unaonyesha kuwa waliotoka Misri walikuwa tayari wametahiriwa.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Neno עָם linarejelea kundi la watu kwa ujumla. Tafsiri hii haiingizi neno jembamba zaidi kama ‘wanaume,’ ambalo halipo wazi katika Kiebrania.
- source_word: הַיֹּצְאִים
  choice: waliotoka Misri
  rationale: Kishirikishi hiki kinatumika kama nomino kwa kizazi kilichotoka Misri. ‘Misri’ imewekwa hapa kwa uwazi wa kawaida wa Kiswahili, kwa kuwa mahali hapo panatajwa baadaye katika sentensi ya Kiebrania.
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: lakini watu wote waliozaliwa
  rationale: Ingawa וְ mara nyingi ni ‘na,’ hapa inaonyesha utofauti kati ya kizazi kilichotoka Misri na kile kilichozaliwa jangwani; ‘lakini’ huwasilisha utofauti huo kwa kawaida.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: ‘Jangwa’ ni neno la kawaida katika Kiswahili kwa mazingira ya safari ya kutoka Misri na linafaa kwa maana ya מִדְבָּר hapa.
- source_word: בַּדֶּרֶךְ
  choice: njiani
  rationale: Linadumisha maana ya kuwa safarini bila kulazimisha wazo la barabara maalumu.
- source_word: בְּצֵאתָם מִמִּצְרַיִם
  choice: baada ya kutoka Misri
  rationale: Inaonyesha kwamba kuzaliwa huko kulitokea katika kipindi cha safari baada ya kutoka Misri. Muundo mfupi unaepuka marudio yasiyo ya lazima na unabaki wa kawaida katika Kiswahili.
- source_word: לֹא מָלוּ
  choice: hawakuwa wametahiriwa
  rationale: Kiebrania kina kitenzi tendaji chenye mtendaji asiyeainishwa na mtendwa anayeeleweka kutokana na muktadha. Kiswahili cha kutendwa huweka mkazo kwa hali ya watu hao, kama muktadha unavyohitaji.
theological_decisions: []
