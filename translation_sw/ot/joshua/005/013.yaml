  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּֽ/הְי֣וֹת יְהוֹשֻׁעַ֮ בִּ/ירִיחוֹ֒ וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִישׁ֙ עֹמֵ֣ד לְ/נֶגְדּ֔/וֹ וְ/חַרְבּ֥/וֹ שְׁלוּפָ֖ה בְּ/יָד֑/וֹ וַ/יֵּ֨לֶךְ יְהוֹשֻׁ֤עַ אֵלָי/ו֙ וַ/יֹּ֣אמֶר ל֔/וֹ הֲ/לָ֥/נוּ אַתָּ֖ה אִם לְ/צָרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: sw
  text: Ikawa, Yoshua alipokuwa huko Yeriko[a], akainua macho yake, akaona, na tazama, mtu alikuwa amesimama mkabala naye, akiwa ameshika upanga wake uliofutwa ala mkononi mwake. Yoshua akamwendea na kumuuliza, “Je, wewe uko upande wetu, au upande wa adui zetu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya Yeriko” au “karibu na Yeriko.” Kihusishi cha Kiebrania kinaweza kutaja mahali kwa upana bila kubainisha kwa usahihi kama ni ndani ya jiji au karibu nalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni utangulizi wa kawaida wa tukio jipya katika simulizi la Kiebrania; “Ikawa” huhifadhi mpito huo kwa Kiswahili cha kibiblia kinachoeleweka bila kuongeza maelezo.
- source_word: בִּהְיוֹת
  choice: alipokuwa
  rationale: Muundo wa infinitivu pamoja na בְּ unaonyesha hali ya wakati; “alipokuwa” ni wa asili na sahihi katika Kiswahili.
- source_word: בִּירִיחוֹ
  choice: karibu na Yeriko
  rationale: Kihusishi בְּ kinaweza kuonyesha mahali kwa upana. Katika muktadha huu “karibu na Yeriko” huepuka kudai kwamba Yoshua alikuwa ndani ya jiji, ingawa maana hiyo ya kisarufi bado inawezekana na imewekwa katika tanbihi.
- source_word: וַיִּשָּׂא עֵינָיו
  choice: akainua macho yake
  rationale: Huhifadhi taswira ya nahau ya Kiebrania na kuitofautisha na kitenzi kinachofuata cha kuona.
- source_word: וַיַּרְא
  choice: akaona
  rationale: Hii ndiyo maana ya moja kwa moja ya ראה na huendeleza kwa kawaida tendo la kuinua macho.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi kishazi cha kuvuta fikira na uwasilishaji wenye uhai wa ghafla bila kukififisha kuwa taarifa ya kawaida.
- source_word: אִישׁ
  choice: mtu mmoja
  rationale: Andiko linamtambulisha tu kuwa mtu; halisemi hapa kuwa ni malaika, shujaa, au BWANA.
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: alikuwa amesimama mbele yake
  rationale: לְנֶגֶד huonyesha mahali palipo mbele au mkabala na mtu. “Mbele yake” ni Kiswahili cha kawaida na kinahifadhi hali ya kukabiliana uso kwa uso.
- source_word: חַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: akiwa na upanga wake mkononi, umefutwa ala
  rationale: שְׁלוּפָה husema upanga umetolewa katika ala yake. “Umefutwa ala” ni usemi sahihi na wenye hadhi unaoonyesha wazi mkao wa kijeshi.
- source_word: וַיֵּלֶךְ ... אֵלָיו
  choice: Yoshua akamwendea
  rationale: Huonyesha mwendo wa Yoshua kuelekea kwa mtu huyo kwa Kiswahili cha simulizi kilicho fasaha.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: Je, wewe uko upande wetu, au upande wa adui zetu?
  rationale: Kihusishi לְ hapa kinaonyesha utii au upande katika mapambano; “uko upande wetu” huwasilisha maana hiyo wazi kuliko tafsiri inayoweza kudokeza tu utambulisho wa kikundi.
theological_decisions:
- issue: Utambulisho wa mtu aliyekutana na Yoshua
  choice: Kutafsiri bila ufafanuzi wa ziada kama “mtu mmoja.”
  alternative: Malaika; malaika wa BWANA; udhihirisho wa Mungu au wa Kristo kabla ya kuzaliwa kwake.
  rationale: Mstari huu wenyewe unatumia אִישׁ, “mtu,” na bado haujafafanua utambulisho wake. Tafsiri haipaswi kutangulia muktadha unaofuata wala kuamua mvutano wa kiteolojia ambao mstari umeuacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa vitenzi vya mfululizo kwa kiambishi -ka- umehifadhi mwendo wa haraka wa simulizi la Kiebrania; “na tazama” na “umefutwa ala” huhifadhi uzito wa kifasihi bila kuwa wa kizamani kupita kiasi.
