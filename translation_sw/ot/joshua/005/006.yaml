  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: sw
  text: Kwa maana Waisraeli walitembea jangwani kwa miaka arobaini, mpaka taifa lote—wanaume wa vita waliotoka Misri—lilipokwisha, kwa sababu hawakuisikiliza sauti ya Yahweh. Yahweh alikuwa amewaapia kwamba hatawaonyesha nchi ambayo Yahweh alikuwa amewaapia mababu zao kwamba atatupatia sisi[a], nchi inayotiririka maziwa na asali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutupatia sisi”; baadhi ya matoleo ya kale na tafsiri husoma “kuwapatia wao.”'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kwamba mstari huu unatoa sababu au maelezo ya yaliyotangulia.
- source_word: הָלְכוּ בְנֵי יִשְׂרָאֵל בַּמִּדְבָּר
  choice: Waisraeli walitembea jangwani
  rationale: “Waisraeli” ni Kiswahili cha kawaida kwa בני ישראל, na “walitembea jangwani” huhifadhi taswira halisi ya kwenda kwa miguu bila kufanya sentensi kuwa nzito.
- source_word: עַד תֹּם כָּל הַגּוֹי
  choice: mpaka taifa lote ... lilipoisha
  rationale: Huhifadhi maana ya kukoma au kufikia mwisho bila kuongeza waziwazi neno “kufa,” ingawa muktadha unaonyesha kuangamia kwa kundi hilo.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume wa vita
  rationale: Huhifadhi wazi jinsia ya kundi na kazi yake ya kijeshi.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: hawakuisikiliza sauti ya Yahweh
  rationale: Huhifadhi nahau ya Kiebrania ya kuisikiliza sauti, ambayo katika muktadha huu pia humaanisha kutii.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huwakilisha jina la agano lililoandikwa kwa herufi יהוה badala ya kulibadilisha kuwa cheo.
- source_word: לְבִלְתִּי הַרְאוֹתָם
  choice: hatawaonyesha
  rationale: 'Hutoa kwa Kiswahili cha kawaida maana ya muundo unaosababisha wa kitenzi “kuona”: Yahweh hangewafanya waione nchi.'
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Huhifadhi taswira ya kitamaduni na ya kiagano ya nchi yenye wingi na rutuba.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina lenyewe; “Yahweh” hulihifadhi kama jina badala ya cheo.
- issue: Kiwakilishi katika לָנוּ
  choice: atatupatia sisi
  alternative: atawapatia wao
  rationale: Maandishi ya Kimasora yana nafsi ya kwanza wingi, “sisi.” Umbo hilo lisilotarajiwa limehifadhiwa katika maandishi, huku tofauti ya kale ikitajwa katika tanbihi.
- issue: Maana ya kutosikiliza sauti ya Yahweh
  choice: hawakuisikiliza sauti ya Yahweh
  alternative: hawakumtii Yahweh
  rationale: Tafsiri iliyochaguliwa huhifadhi taswira ya kusikia pamoja na maana yake ya utiifu, bila kuifupisha kuwa dhana moja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama za vistari zimetumiwa kutenga ufafanuzi wa “taifa lote,” na “sisi” imeongezwa baada ya kiambishi -tu- ili tofauti ya maandishi ionekane wazi.
