base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: sw
  text: Na Yoshua akawatahiri wana wao[a], ambao alikuwa amewainua badala yao, kwa kuwa walikuwa hawajatahiriwa, kwa maana hawakuwatahiri njiani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana wao, ambao alikuwa amewainua mahali pao.” Kifungu cha Kiebrania kinaonyesha kwamba wana hawa walichukua nafasi ya kizazi kilichotangulia; hakimtaji wazi aliyewainua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם
  choice: wana wao
  rationale: Katika muktadha wa tohara, בְּנֵיהֶם inarejelea wana wa kiume. Kiunganishi וְ kinaendeleza simulizi na kinawakilishwa kwa mtiririko wa kitenzi ‘akawatahiri’.
- source_word: הֵקִים
  choice: Mungu alikuwa amewainua
  rationale: Hiphil ya קום hapa ina maana ya kusimamisha au kuinua kizazi kilichofuata. Kiswahili huhitaji mtendaji atajwe ili sentensi iwe wazi; ‘Mungu’ anaeleweka katika muktadha kama mtendaji, ingawa halitajwi wazi katika Kiebrania.
- source_word: תַּחְתָּם
  choice: kuchukua nafasi yao
  rationale: תַּחַת hapa huonyesha urithi au ubadilishaji wa kizazi, si mahali halisi chini yao.
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: Yoshua akawatahiri
  rationale: מוּל ni kitenzi cha kawaida cha kutahiri; muundo wa Kiswahili unaweka kiambishi cha yambwa kwa wana waliotajwa.
- source_word: עֲרֵלִים
  choice: hawajatahiriwa
  rationale: Neno hili linaeleza hali halisi ya kutokuwa na tohara katika muktadha wa agano, kwa lugha ya kawaida na yenye heshima.
- source_word: כִּי לֹא מָלוּ אֹתָם
  choice: kwa kuwa hawakuwa wamewatahiri
  rationale: Kiebrania kinaacha mtendaji wa kitenzi katika wingi bila kumtaja. Tafsiri inadumisha hali hiyo badala ya kuongeza ‘hakuna mtu’ au kuwataja wazazi moja kwa moja.
- source_word: בַּדָּרֶךְ
  choice: njiani
  rationale: ‘Njiani’ ni usemi wa asili wa Kiswahili unaorejelea kipindi cha safari yao jangwani.
theological_decisions:
- issue: Hali ya kimwili yenye umuhimu wa agano
  choice: hawajatahiriwa
  alternative: walikuwa na govi
  rationale: Aya inahusu tohara halisi ya mwili yenye umuhimu wa agano. ‘Hawajatahiriwa’ ni wazi, ya kawaida, na haibadili jambo hilo kuwa sitiari.
- issue: Mtendaji wa הֵקִים ambaye hatajwi wazi
  choice: Mungu alikuwa amewainua
  alternative: walikuwa wameinuka
  rationale: Umbo la Hiphil ni la kusababisha, na muktadha unaashiria Mungu ndiye aliyekifanya kizazi kipya kichukue nafasi ya kile kilichotangulia. Tanbihi inaweka wazi kwamba jina hilo halipo moja kwa moja katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. ‘Kutahiri’ ni neno la kawaida na sahihi; ‘njiani’ linaepuka uzito usio wa lazima wa ‘wakati wa safari’.
