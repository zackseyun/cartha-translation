reference: Joshua 5:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: sw
  text: Akasema, “La[a]; bali nimekuja sasa nikiwa mkuu wa jeshi la Yahwe.” Ndipo Yoshua akaanguka kifudifudi, akamsujudia[b], akamwambia, “Bwana wangu anasema nini kwa mtumishi wake?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Si upande wowote; bali nimekuja sasa nikiwa mkuu wa jeshi la Yahwe.”
    reason: Neno la Kiebrania לֹא ni ukanushaji wa moja kwa moja, lakini katika muktadha wa swali lenye chaguo mbili linaweza kueleweka kuwa msemaji hachagui upande wowote kati ya pande hizo.
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza pia kutafsiriwa “akamwabudu.” Hapa limetafsiriwa “akamsujudia” ili kuhifadhi tendo la kujishusha mbele yake bila kuamua utambulisho wa kiumbe huyo kutokana na aya hii pekee.
    reason: Usomaji mbadala unaohifadhi uwezekano wa maana ya ibada bila kuufanya kuwa hitimisho la lazima.
lexical_decisions:
- source_word: לֹא
  choice: La
  rationale: Ni jibu la moja kwa moja kwa swali la Yoshua lililotangulia. Maana ya ‘si upande wowote’ imehifadhiwa katika tanbihi kwa sababu hiyo ni ufafanuzi unaowezekana wa jibu hili.
- source_word: כִּי
  choice: bali
  rationale: 'Hapa neno hili linasahihisha dhana iliyotangulia: si mojawapo ya chaguo alizotaja Yoshua, bali msemaji anajitambulisha kwa cheo chake.'
- source_word: שַׂר
  choice: mkuu
  rationale: Katika muktadha wa kijeshi, ‘mkuu’ ni neno la kawaida na lenye hadhi kwa kiongozi mwenye mamlaka; linaepuka maana finyu ya cheo maalumu cha kijeshi.
- source_word: צְבָא יְהוָה
  choice: jeshi la Yahwe
  rationale: ‘Jeshi’ linafikisha wazi maana ya kijeshi ya צָבָא, na ‘Yahwe’ linahifadhi jina binafsi la Mungu lililoandikwa katika Kiebrania.
- source_word: עַתָּה בָאתִי
  choice: nimekuja sasa
  rationale: Wakati timilifu wa Kiswahili unaonyesha kuwa kuja kumekamilika na kuna umuhimu katika wakati wa sasa, huku ‘sasa’ likihifadhi kielezi cha Kiebrania.
- source_word: פָּנָיו אַרְצָה
  choice: akaanguka kifudifudi
  rationale: Hii ni nahau ya asili ya Kiswahili inayoonyesha wazi kuanguka uso ukielekea chini.
- source_word: וַיִּשְׁתָּחוּ
  choice: akainama mbele yake
  rationale: Tafsiri hii huhifadhi tendo la kujishusha na kuinama bila kuamua kimbele kama tendo hilo lilikuwa ibada kwa maana kamili ya kitheolojia.
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Ni namna ya heshima ya kumwita mwenye mamlaka. Muktadha wa sentensi, si tafsiri yenyewe, ndio unaopaswa kuamua utambulisho wa msemaji.
- source_word: מְדַבֵּר אֶל עַבְדּוֹ
  choice: anasema nini kwa mtumishi wake
  rationale: Wakati wa sasa unaakisi hali endelevu ya kitenzi kishirikishi, na ‘mtumishi wake’ huhifadhi namna ya Yoshua ya kujinyenyekeza.
theological_decisions:
- issue: Ikiwa tendo la Yoshua limaanishwe wazi kuwa ibada
  choice: Kutafsiri וַיִּשְׁתָּחוּ kama ‘akainama mbele yake’
  alternative: ‘akamwabudu’ au ‘akamsujudia’
  rationale: Kitenzi cha Kiebrania kinaweza kumaanisha kuinama kwa heshima au kuabudu. Aya hii peke yake hailazimishi tafsiri iamue utambulisho wa kiumbe huyo au aina kamili ya tendo la Yoshua.
- issue: Ikiwa msemaji atambulishwe katika tafsiri kuwa malaika au ufunuo wa Mungu
  choice: Kumwita tu ‘mkuu wa jeshi la Yahwe’ kama ilivyo katika Kiebrania
  alternative: Kutumia maneno yanayodokeza wazi kuwa yeye ni malaika, ufunuo wa Mungu, au Kristo kabla ya kufanyika mwili
  rationale: Aya inatoa cheo chake lakini haisuluhishi wazi asili yake. Tafsiri inahifadhi mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘kifudifudi’ kwa picha halisi ya tendo, ‘mkuu wa jeshi’ kwa uwazi wa kijeshi, na jina ‘Yahwe’ badala ya kulibadilisha kuwa cheo. Muundo umebaki wa asili bila kuwa mgumu kupita kiasi.
