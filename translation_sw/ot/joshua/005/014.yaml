    rationale: '''Akainama mbele yake'' can describe an ordinary bow and does not adequately convey the Hebrew verb’s sense of prostrating/bowing oneself in homage. ''Akamsujudia'' retains the concrete action and its reverential force while leaving whether it constitutes worship to the footnote.'
