id: JOS.5.1
reference: Joshua 5:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: sw
  text: Ikawa wafalme wote wa Waamori waliokuwa ng’ambo ya Yordani upande wa magharibi, na wafalme wote wa Wakanaani waliokuwa karibu na bahari[a], waliposikia kwamba Yahwe alikuwa ameyakausha maji ya Yordani mbele ya wana wa Israeli mpaka tulipokwisha kuvuka[b], moyo wao ukayeyuka, wala hapakuwa tena na roho ndani yao[c] kwa sababu ya wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa katika eneo la pwani.” Maneno “karibu na bahari” yanarejelea eneo la pwani.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati na tafsiri za kale zinasoma “mpaka walipokwisha kuvuka” badala ya “mpaka tulipokwisha kuvuka.”
    reason: textual_variant
  - marker: c
    text: Kwa Kiebrania, “hapakuwa tena na roho ndani yao”; hapa ni msemo unaomaanisha kwamba walipoteza ujasiri au azimio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi utangulizi wa simulizi wa Kiebrania kwa mtindo wa heshima unaoeleweka katika Kiswahili.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: ng’ambo ya Yordani upande wa magharibi
  rationale: Neno יָמָּה linaonyesha mwelekeo wa magharibi, yaani kuelekea baharini; tafsiri hii inaweka jiografia wazi.
- source_word: אֲשֶׁר עַל הַיָּם
  choice: waliokuwa karibu na bahari
  rationale: Kirai hiki kinawaeleza wafalme wa eneo la pwani; tafsiri ya karibu imehifadhiwa huku ufafanuzi ukiwekwa katika tanbihi.
- source_word: הוֹבִישׁ
  choice: alikuwa ameyakausha
  rationale: Hifili ya יבש humaanisha kusababisha kitu kikauke; wakati timilifu unaonyesha tukio lililotangulia kusikia kwa wafalme.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kulitamka badala ya kubadilishwa kuwa cheo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa Kiebrania wa kifamilia na kitaifa bila kuufanya kuwa jina la jumla tu.
- source_word: עַד עברנו
  choice: mpaka tulipokwisha kuvuka
  rationale: Hufuata umbo la konsonanti la Maandiko ya Kimasora, ambalo lina nafsi ya kwanza wingi; tofauti ya nafsi ya tatu imeonyeshwa katika tanbihi.
- source_word: וַיִּמַּס לְבָבָם
  choice: moyo wao ukayeyuka
  rationale: Huhifadhi umoja wa kijumla wa לְבָבָם na sitiari ya kuyeyuka kwa sababu ya hofu.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: wala hapakuwa tena na roho ndani yao
  rationale: Huhifadhi taswira na upana wa maana wa רוּחַ, ambayo hapa hudokeza ujasiri au azimio la ndani.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano moja kwa moja; kulitafsiri kama Yahwe huhifadhi jina binafsi badala ya kuliweka kama cheo.
- issue: Usemi wa kitaifa בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili huhifadhi taswira ya kifamilia ya chanzo bila kuongeza fundisho la dhehebu.
- issue: Nafsi ya kitenzi katika עַד עברנו
  choice: mpaka tulipokwisha kuvuka
  alternative: mpaka walipokwisha kuvuka
  rationale: Umbo la konsonanti la Kimasora linaunga mkono nafsi ya kwanza wingi, lakini usomaji wa nafsi ya tatu una ushahidi wa kale na umehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
- issue: Maana ya רוּחַ katika muktadha wa hofu
  choice: roho
  alternative: ujasiri
  rationale: Neno la karibu ‘roho’ huhifadhi taswira na mvutano wa kileksika, huku maana ya kimuktadha ya kupoteza ujasiri ikifafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaofaa simulizi la Biblia. Miundo ya karibu na Kiebrania imehifadhiwa pale inaposomeka kiasili, na tofauti ya maandishi pamoja na nahau zimefafanuliwa kwa tanbihi.
