  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo umewekwa wa asili katika Kiswahili huku ukihifadhi mlolongo wa matukio na maana ya mkusanyiko ya “taifa lote.”
