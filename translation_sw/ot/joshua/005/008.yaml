  yaml_path: translation/ot/joshua/005/008.yaml
  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: sw
  text: Baada ya taifa lote kumaliza kutahiriwa, walibaki mahali pao kambini mpaka walipopata nafuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka walipopona” au “mpaka walipopata nguvu tena.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Baada ya
  rationale: Kauli hii ya masimulizi inaanzisha uhusiano wa wakati. Katika Kiswahili, “Baada ya” inaunganisha kwa kawaida kukamilika kwa kutahiriwa na kubaki kambini.
- source_word: תַּמּוּ
  choice: kumaliza
  rationale: Kitenzi kinaonyesha tendo lililokamilika; “kumaliza” ni cha kawaida na kinafaa katika muundo “baada ya ... kumaliza.”
- source_word: כָל הַגּוֹי
  choice: taifa lote
  rationale: “Taifa lote” huhifadhi umoja wa jina la mkusanyiko גּוֹי na kurejelea Israeli kama jumuiya moja.
- source_word: לְהִמּוֹל
  choice: kutahiriwa
  rationale: Huhifadhi maana ya kutendwa ya umbo la Kiebrania na ni usemi wa kawaida wa Kiswahili baada ya “kumaliza.”
- source_word: וַיֵּשְׁבוּ
  choice: walibaki
  rationale: Katika muktadha wa kupata nafuu, maana ni kuendelea kukaa mahali fulani, si lazima kuketi.
- source_word: תַחְתָּם
  choice: mahali pao
  rationale: Hii ni nahau ya kubaki pale walipokuwa, wala si maana halisi ya kuwa “chini yao.”
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: Ni tafsiri ya kawaida na ya asili ya mahali walipobaki.
- source_word: עַד חֲיוֹתָם
  choice: mpaka walipopata nafuu
  rationale: Katika muktadha wa baada ya tohara, חיה humaanisha kurejea katika hali ya afya au nguvu. “Kupata nafuu” ni ya asili bila kubana maana kuwa uponyaji kamili pekee.
