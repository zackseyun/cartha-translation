id: JOS.5.10
reference: Joshua 5:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/גִּלְגָּ֑ל וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בָּ/עֶ֖רֶב בְּ/עַֽרְב֥וֹת יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: sw
  text: Wana wa Israeli[a] wakapiga kambi huko Gilgali, wakaadhimisha Pasaka siku ya kumi na nne ya mwezi, jioni, katika tambarare za Yeriko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kuweka au kupiga kambi. ‘Wakapiga kambi’ ni usemi wa kawaida na wa wazi katika Kiswahili cha sasa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi usemi wa Kiebrania wa kifamilia, yaani ‘wana wa Israeli,’ badala ya kuubadili moja kwa moja kuwa jina la kikabila ‘Waisraeli.’
- source_word: בַּגִּלְגָּל
  choice: huko Gilgali
  rationale: Kiambishi ב kinaonyesha mahali; ‘huko Gilgali’ ni cha asili katika Kiswahili kwa mahali walipopiga kambi.
- source_word: וַיַּעֲשׂוּ אֶת־הַפֶּסַח
  choice: wakaadhimisha Pasaka
  rationale: Kitenzi עשה kinapotumiwa pamoja na Pasaka ni nahau inayomaanisha kuitimiza au kuiadhimisha; tafsiri ya moja kwa moja ‘wakaifanya’ isingekuwa ya asili hapa.
- source_word: הַפֶּסַח
  choice: Pasaka
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sikukuu na tendo la Pasaka katika muktadha huu.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: siku ya kumi na nne ya mwezi
  rationale: Hutoa kwa usahihi na kwa Kiswahili cha kawaida tamko la tarehe katika Kiebrania.
- source_word: בָּעֶרֶב
  choice: jioni
  rationale: Neno linaonyesha wakati wa maadhimisho; ‘jioni’ ni fupi, wazi, na la asili.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: katika tambarare za Yeriko
  rationale: עַרְבוֹת hurejelea eneo tambarare au nyika pana; ‘tambarare za Yeriko’ ni tafsiri wazi ya kijiografia bila kuongeza maana isiyolazimishwa na muktadha.
theological_decisions:
- issue: Tafsiri ya בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Hakuna utata wa kimafundisho unaotatuliwa hapa. ‘Wana wa Israeli’ huhifadhi muundo wa kifamilia na wingi wa kiume wa Kiebrania, huku tanbihi ikieleza tafsiri nyingine za kawaida.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Gilgali na Yeriko. Muundo wa simulizi wenye ‘waka-’ umehifadhi mfuatano wa matendo kwa njia ya asili.'
