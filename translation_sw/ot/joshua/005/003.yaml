  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
translation:
  language: sw
  text: Basi Yoshua akajitengenezea visu vya flinti[a], akawatahiri wana wa Israeli[b] katika Gibeath-haaraloth[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “visu vya jiwe” au “mapanga/blade za flinti.” Neno la Kiebrania linalotaja kifaa hiki mara nyingi humaanisha “upanga,” lakini hapa linarejelea vifaa vya kukatia vilivyotumiwa katika tohara.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana wa Israeli”; inaweza pia kutafsiriwa “Waisraeli.”
    reason: lexical_alternative
  - marker: c
    text: Jina hili la Kiebrania linamaanisha “Kilima cha Magovi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לּוֹ
  choice: akajitengenezea
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba Yoshua alitengeneza vifaa hivyo kwa ajili yake mwenyewe, huku ukidumisha mtiririko wa simulizi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: חַרְבוֹת צֻרִים
  choice: visu vya jiwe gumu
  rationale: Ingawa חֶרֶב mara nyingi humaanisha upanga, hapa muktadha wa tohara unahitaji vifaa vya kukatia. צֻרִים hueleza jiwe gumu lenye makali, mara nyingi flinti; 'jiwe gumu' ni wazi zaidi kwa wasomaji wa kawaida wa Kiswahili, na tanbihi huhifadhi mbadala wa kileksia.
- source_word: וַיָּמָל
  choice: akawatahiri
  rationale: Kitenzi מול humaanisha kutahiri; kiambishi cha kitu 'wa-' kinarejelea wana wa Israeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi umbo la Kiebrania 'wana wa Israeli' badala ya kulainisha kuwa 'Waisraeli,' na linaeleweka katika Kiswahili sanifu.
- source_word: אֶל גִּבְעַת הָעֲרָלוֹת
  choice: huko kilima cha Gibeath-haaraloth
  rationale: אֶל katika muktadha huu hutaja mahali tukio lilipotokea. Tafsiri inahifadhi jina la mahali kwa unukuzi huku ikibainisha kwamba ni kilima; maana yake halisi inaelezwa katika tanbihi.
