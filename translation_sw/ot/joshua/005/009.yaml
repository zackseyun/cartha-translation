base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: sw
  text: Yahwe akamwambia Yoshua, “Leo nimeviringisha mbali fedheha ya Misri kutoka juu yenu.[a]” Kwa hiyo, mahali pale pakaitwa Gilgali[b] mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aibu ya Misri” au “shutuma ya Misri.” Kauli hii inaweza kumaanisha aibu ya Israeli huko Misri, shutuma kutoka Misri, au fedheha inayohusishwa na agano ambayo sasa imeondolewa.
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, jina “Gilgali” linafanana kwa sauti na kitenzi kinachomaanisha “kuviringisha mbali”; hivyo kuna mchezo wa maneno na kauli “nimeviringisha mbali.”
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limetumiwa kama jina maalumu la Mungu, kwa tahajia ya Kiswahili inayosomeka kwa urahisi na inayolingana kwa karibu na jina la Kiebrania.
- source_word: גַּלּוֹתִי
  choice: nimeviringisha mbali
  rationale: Kitenzi גלל kina wazo la kuviringisha. Tafsiri hii inadumisha picha halisi na pia msingi wa mchezo wa sauti unaohusisha jina Gilgali.
- source_word: חֶרְפַּת מִצְרַיִם
  choice: fedheha ya Misri
  rationale: Neno חֶרְפָּה linaweza kumaanisha fedheha, aibu, au shutuma. Muundo “ya Misri” unaacha uhusiano huo wazi kama ulivyo katika Kiebrania.
- source_word: מֵעֲלֵיכֶם
  choice: iliyokuwa juu yenu
  rationale: Kauli hii inadumisha taswira ya fedheha kama mzigo uliokuwa juu yao na sasa umeondolewa, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: Kwa hiyo, mahali pale pakaitwa Gilgali
  rationale: Kauli tendwa ni ya kawaida katika Kiswahili kwa kutaja jina la mahali na haibuni wazi mhusika ambaye Kiebrania hakumtaji. “Kwa hiyo” inaonyesha uhusiano na tamko lililotangulia.
- source_word: גִּלְגָּל
  choice: Gilgali
  rationale: Tahajia hii ya Kiswahili huhifadhi jina la mahali na inafaa mfumo wa sauti wa Kiswahili; tanbihi inaeleza mchezo wa maneno wa Kiebrania.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni kauli ya kawaida na wazi ya Kiswahili inayodumisha mtazamo wa wakati wa msimulizi.
theological_decisions:
- issue: Maana ya “fedheha ya Misri”
  choice: Kauli pana “fedheha ya Misri” imedumishwa bila kuifafanua zaidi.
  alternative: Kuieleza kuwa aibu ya utumwa wa Israeli, shutuma kutoka kwa Wamisri, au fedheha ya kutotahiriwa iliyohusiana na agano.
  rationale: Kiebrania hakibainishi fedheha hiyo ni ipi wala uhusiano kamili wa “Misri” na “fedheha.” Tafsiri haipaswi kuamua kimya-kimya jambo ambalo matini yenyewe imeliacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa kawaida bila kupoteza taswira ya kuviringisha, utata wa “fedheha ya Misri,” au mchezo wa maneno wa Kiebrania.
