  text: וַ/יִּשְׁבֹּ֨ת הַ/מָּ֜ן מִֽ/מָּחֳרָ֗ת בְּ/אָכְלָ/ם֙ מֵ/עֲב֣וּר הָ/אָ֔רֶץ וְ/לֹא הָ֥יָה ע֛וֹד לִ/בְנֵ֥י יִשְׂרָאֵ֖ל מָ֑ן וַ/יֹּאכְל֗וּ מִ/תְּבוּאַת֙ אֶ֣רֶץ כְּנַ֔עַן בַּ/שָּׁנָ֖ה הַ/הִֽיא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: sw
  text: Mana ilikoma siku iliyofuata, baada ya kula mazao ya nchi[a]. Wana wa Israeli[b] hawakuwa na mana tena, nao wakala mavuno ya nchi ya Kanaani mwaka huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mazao ya zamani ya nchi.” Neno la Kiebrania linaweza kurejelea hasa mazao yaliyohifadhiwa kutoka mavuno ya mwaka uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: “Wana wa Israeli” ni tafsiri ya karibu zaidi ya maneno ya Kiebrania; maana yake hapa ni Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: ikaacha kutokea
  rationale: Kitenzi שׁבת hapa kinaonyesha kukoma, si kushika Sabato. Kauli “ikaacha kutokea” inaeleza kwa kawaida kwamba mana haikupatikana tena.
- source_word: הַמָּן / מָן
  choice: mana
  rationale: “Mana” ndilo neno la kawaida la Kiswahili kwa chakula cha jangwani; muktadha unatosha bila kuhitaji kibainishi tofauti katika kila tukio.
- source_word: מִמָּחֳרָת
  choice: siku iliyofuata
  rationale: Kirai hiki cha wakati kinaonyesha siku iliyofuata baada ya tukio lililotangulia katika simulizi.
- source_word: בְּאָכְלָם
  choice: baada ya wao kula
  rationale: Muundo wa Kiebrania unaweza kutafsiriwa kwa maana ya wakati. “Baada ya wao kula” huonyesha mfuatano unaoelekea kudokezwa na muktadha.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: mazao ya nchi
  rationale: עֲבוּר hurejelea mazao ya nchi. Neno lenyewe halilazimishi maana ya “mazao ya zamani,” hivyo uwezekano huo umewekwa katika tanbihi.
- source_word: וְלֹא הָיָה עוֹד
  choice: hawakuwa na ... tena
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayowasilisha vizuri wazo la kutokuwapo tena.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania “wana wa Israeli” na pia ni usemi unaotambulika katika Kiswahili cha Biblia.
- source_word: וַיֹּאכְלוּ
  choice: nao wakala
  rationale: Huwasilisha kwa ufasaha tendo linalofuata katika simulizi.
- source_word: מִתְּבוּאַת
  choice: mavuno
  rationale: תְּבוּאָה humaanisha mazao au mavuno. “Mavuno” yanatofautisha kwa kiasi istilahi hii na עֲבוּר iliyotangulia bila kupoteza maana ya kilimo.
- source_word: אֶרֶץ כְּנַעַן
  choice: nchi ya Kanaani
  rationale: Huhifadhi kirai kamili kinachotaja nchi hiyo.
- source_word: בַּשָּׁנָה הַהִיא
  choice: mwaka huo
  rationale: Ni usemi wa kawaida na sahihi wa Kiswahili kwa kirai hiki cha wakati.
