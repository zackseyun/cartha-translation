  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Tafsiri imehifadhi tofauti kati ya “mazao” na “mavuno,” pamoja na uwezekano wa maana ya mazao yaliyohifadhiwa katika tanbihi.
