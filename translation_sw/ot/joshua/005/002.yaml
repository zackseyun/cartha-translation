id: JOS.5.2
reference: Joshua 5:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: sw
  text: Wakati huo Yahwe akamwambia Yoshua, “Jitengenezee visu vya gumegume[a], kisha uwatahiri tena wana wa Israeli[b], mara ya pili[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “visu vilivyotengenezwa kwa gumegume.” Usemi wa Kiebrania unamaanisha vyombo vya kukatia vilivyotengenezwa kwa jiwe la gumegume, vilivyotumiwa hapa kwa tohara.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “wana wa Israeli”; tafsiri nyingi hutumia kwa ujumla zaidi “Waisraeli.” Hapa muktadha wa tohara unawahusu wanaume.
    reason: lexical_alternative
  - marker: c
    text: “Mara ya pili” inamaanisha kufanya tena tohara miongoni mwa Israeli kama taifa, si lazima kuwatahiri watu wale wale mara mbili.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa wakati unaoanzisha mazingira ya simulizi; tafsiri hii ni ya asili na yenye heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: עֲשֵׂה לְךָ
  choice: Jitengenezee
  rationale: Kitenzi hiki kinawakilisha agizo la kutengeneza kitu kwa ajili yako mwenyewe kwa Kiswahili cha kawaida.
- source_word: חַרְבוֹת צֻרִים
  choice: visu vya gumegume
  rationale: Katika muktadha wa tohara, חַרְבוֹת ni vyombo vya kukatia, yaani visu, na צֻרִים inaonyesha kwamba vilitengenezwa kwa gumegume.
- source_word: וְשׁוּב
  choice: tena
  rationale: Ingawa kimsingi lina wazo la kurudi, hapa neno hili linafanya kazi kama kielezi kinachoonyesha kurudiwa kwa tendo.
- source_word: מֹל
  choice: uwatahiri
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kufanya tohara katika muktadha huu wa agano.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa Kiebrania unaomaanisha wana wa kiume wa Israeli, jambo linalofaa hasa kwa sababu wao ndio wanaotahiriwa.
- source_word: שֵׁנִית
  choice: mara ya pili
  rationale: Huhifadhi wazi msisitizo wa tukio la pili, bila kuunganisha neno hili na maana ya וְשׁוּב ‘tena.’
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya usemi בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Usemi wa asili ni wa kiume, na muktadha wa tohara unaonyesha kwamba wanaume ndio wanaokusudiwa moja kwa moja.
- issue: Kurudiwa kwa ‘tena’ na ‘mara ya pili’
  choice: kuhifadhi maneno yote mawili
  alternative: uwatahiri Waisraeli tena
  rationale: Kiebrania kina וְשׁוּב na שֵׁנִית pamoja. Tafsiri inahifadhi mvutano na msisitizo huo badala ya kuufupisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. ‘Gumegume’ ni neno sahihi la jiwe aina ya flint; tanbihi inalifafanua. Uradidi wa ‘tena ... mara ya pili’ umehifadhiwa kwa sababu upo pia katika Kiebrania.
