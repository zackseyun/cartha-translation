base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: sw
  text: 'Na hii ndiyo sababu Yoshua aliwatahiri: watu wote waliotoka Misri[a]—wanaume wote, yaani, watu wote wa vita[b]—walikuwa wamekufa nyikani njiani baada ya kutoka Misri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo wa karibu zaidi na Kiebrania: “Na hili ndilo jambo la Yoshua kutahiri: watu wote ...” Katika muktadha, msemo huu unaanzisha maelezo ya sababu ya tendo la Yoshua.'
    reason: lexical_alternative
  - marker: b
    text: “Watu wa vita” pia inaweza kutafsiriwa “wapiganaji” au “wanaume wapiganaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: Na hii ndiyo sababu Yoshua aliwatahiri
  rationale: Kirai cha Kiebrania kwa muundo wake ni ‘na hili ndilo jambo ambalo Yoshua alitahiri,’ lakini katika muktadha kinaanzisha maelezo ya sababu ya tendo hilo. Kiswahili cha ‘hii ndiyo sababu’ huwasilisha nguvu hiyo ya kimuktadha kwa kawaida; kiwakilishi ‘wa-’ kinakamilisha kitenzi na kurejelea waliotahiriwa.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: wanaume wote waliokuwa miongoni mwa watu waliotoka Misri
  rationale: הַזְּכָרִים hubainisha wanaume katika kundi lote lililotoka Misri. Muundo huu huepuka kudokeza kwamba kila mtu, wakiwemo wanawake, alikufa, huku ukihifadhi rejeo la watu waliotoka Misri.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: yaani, watu wote wa vita
  rationale: Kirai hiki kinafafanua kwa apposition wanaume wanaozungumziwa. ‘Watu wa vita’ ni tafsiri rasmi lakini inayoeleweka; ‘yaani’ huonyesha uhusiano huo wa ufafanuzi bila kuufanya kuwa kundi tofauti.
- source_word: מֵתוּ בַמִּדְבָּר בַּדֶּרֶךְ
  choice: walikuwa wamekufa nyikani njiani
  rationale: Wakati timilifu ‘walikuwa wamekufa’ huonyesha kuwa vifo vilitangulia tendo la Yoshua. ‘Nyikani’ inafaa kwa mazingira ya safari ya Israeli, na ‘njiani’ huwasilisha בַּדֶּרֶךְ kwa Kiswahili cha kawaida.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: baada ya kutoka Misri
  rationale: Kirai hiki huweka safari na vifo baada ya kuondoka Misri. Kiswahili hakihitaji kurudia kiima wazi kwa sababu kinajulikana katika sentensi.
