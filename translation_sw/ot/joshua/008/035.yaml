base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: sw
  text: Hakuna neno lolote katika yote aliyoyaamuru Musa ambalo Yoshua hakulisoma mbele ya kusanyiko lote la Israeli, na mbele ya wanawake, watoto wadogo, na mgeni[a] aliyeishi kati yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mgeni” hapa ni mtu asiye Mwisraeli kwa asili ambaye aliishi miongoni mwa Waisraeli.
    reason: cultural_note
lexical_decisions:
- source_word: דָבָר
  choice: neno
  rationale: Katika muktadha wa amri zinazosomewa hadharani, “neno” linafaa kuliko “jambo” na linadumisha uhusiano wa moja kwa moja na kitendo cha kusoma.
- source_word: צִוָּה
  choice: aliamuru
  rationale: Kitenzi hiki kinaonyesha mamlaka ya maagizo ya Musa katika muktadha wa agano na sheria.
- source_word: קָרָא
  choice: hakulisoma
  rationale: Muktadha wa karibu ni usomaji wa Sheria mbele ya mkutano; kwa hiyo “kusoma” ni sahihi kuliko maana pana ya kutangaza au kuita.
- source_word: נֶגֶד
  choice: mbele ya
  rationale: Ni usemi wa kawaida wa Kiswahili unaomaanisha kusoma hadharani katika uwepo wa waliokusanyika.
- source_word: קְהַל
  choice: kusanyiko
  rationale: Neno hili linaonyesha mkutano rasmi wa watu wa Israeli bila kuingiza maana ya dhehebu au taasisi ya kidini ya baadaye.
- source_word: הַטַּף
  choice: watoto wadogo
  rationale: Linabainisha kuwa neno la Kiebrania linawahusu hasa watoto wachanga au wadogo, si watoto kwa maana pana tu.
- source_word: הַגֵּר
  choice: mgeni
  rationale: Hapa ni mtu asiye mzawa aliyekaa ndani ya jamii ya Israeli; ufafanuzi wa kitamaduni umetolewa katika tanbihi.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: aliyeishi kati yao
  rationale: Ingawa muundo wa Kiebrania kwa halisi una picha ya “kutembea kati yao,” hapa unaeleza hali ya kuishi au kukaa ndani ya jamii; Kiswahili cha kawaida hutumia “aliyeishi kati yao.”
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: hakuna hata neno moja ... ambalo ... hakulisoma
  rationale: Muundo wa kukanusha mara mbili umehifadhiwa kwa Kiswahili cha asili, huku “hata neno moja” ikisisitiza kwamba Yoshua hakukosa kusoma sehemu yoyote.
theological_decisions:
- issue: Upeo wa hadhara iliyopokea maagizo ya agano
  choice: Wanawake, watoto wadogo, na mgeni wametajwa wazi kuwa sehemu ya kusanyiko lililosikia usomaji.
  alternative: Kuwaficha makundi haya ndani ya kauli ya jumla “kusanyiko lote la Israeli.”
  rationale: Kiebrania kinayataja makundi haya wazi baada ya kusanyiko lote la Israeli; tafsiri inadumisha ujumuishaji huo bila kupunguza au kupanua maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unadumisha msisitizo wa Kiebrania wa kutokukosa hata neno moja, lakini unaepuka tafsiri isiyo ya kawaida ya “kutembea kati yao.”
