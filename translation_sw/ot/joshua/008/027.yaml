  terminology: “Mifugo,” “nyara,” “Waisraeli,” “Yahwe,” na “Yoshua” ni istilahi zinazofaa katika Kiswahili cha Afrika Mashariki. “Yahwe” huhifadhi jina binafsi la יהוה badala ya kulibadilisha kuwa cheo.
