  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: רַ֣ק הַ/בְּהֵמָ֗ה וּ/שְׁלַל֙ הָ/עִ֣יר הַ/הִ֔יא בָּזְז֥וּ לָ/הֶ֖ם יִשְׂרָאֵ֑ל כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה אֶת יְהוֹשֻֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: sw
  text: Mifugo na nyara za mji huo ndizo tu Waisraeli walizojitwalia, kulingana na agizo la Yahwe alilompa Yoshua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: ndizo tu
  rationale: Muundo huu wa msisitizo unaonyesha wazi kuwa mifugo na nyara pekee ndizo zilizotwaliwa, huku ukiendeleza utofautishaji na maangamizi yaliyotangulia.
- source_word: הַבְּהֵמָה
  choice: mifugo
  rationale: Katika muktadha huu neno linarejelea wanyama wanaofugwa walioweza kuchukuliwa kama nyara.
- source_word: וּשְׁלַל
  choice: na nyara
  rationale: Neno la Kiebrania linamaanisha mali iliyochukuliwa vitani; “nyara” ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: הָעִיר הַהִיא
  choice: za mji huo
  rationale: Kiwakilishi “huo” kinahifadhi umahususi wa kiashiria cha Kiebrania.
- source_word: בָּזְזוּ לָהֶם
  choice: walizojitwalia
  rationale: Kitenzi cha kujirejelea kinaonyesha kuchukua mali ya vita kwa manufaa na umiliki wao wenyewe bila kurudia “nyara” kwa namna isiyo ya asili.
- source_word: יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Kiswahili hutumia jina la watu “Waisraeli” kwa Israeli kama mhusika wa kitaifa katika tendo hili.
- source_word: כִּדְבַר יְהוָה
  choice: kulingana na agizo la Yahwe
  rationale: Katika muktadha huu דָּבָר ni neno lenye nguvu ya amri; “agizo” huwasilisha kwa Kiswahili kwa kawaida kwamba tendo lao lilipatana na alichosema Yahwe.
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: alilompa Yoshua
  rationale: Hukamilisha kwa kawaida wazo la agizo ambalo Yahwe alimpa Yoshua na kuhifadhi uhusiano wa kishazi tegemezi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “ndizo tu” umetumiwa ili kuweka wazi upeo wa kizuizi cha רַק; hakuna tanbihi inayohitajika kwa mstari huu.
