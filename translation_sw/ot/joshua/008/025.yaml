base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: sw
  text: Wote walioanguka siku hiyo, kuanzia mwanamume mpaka mwanamke, walikuwa elfu kumi na mbili—watu wote wa Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wanaume wote wa Ai.” Huu unaweza kuwa usemi wa kijumuiya unaomaanisha “watu wote wa Ai” au “wakazi wote wa Ai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: walikuwa
  rationale: Kitenzi hiki kinafanya kazi hapa kama kiunganishi katika kauli ya muhtasari; “walikuwa” ni Kiswahili cha kawaida kuliko tafsiri ya neno kwa neno “ikawa.”
- source_word: כָל הַנֹּפְלִים
  choice: Wote walioanguka
  rationale: Kitenzi kishirikishi cha נפל humaanisha kihalisi walioanguka; katika muktadha wa vita kinawahusu waliouawa. Tafsiri hii inadumisha taswira ya Kiebrania bila kuifanya kuwa maelezo ya moja kwa moja zaidi ya yaliyo katika chanzo.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huu ni usemi wa kawaida wa wakati na unatafsirika kwa Kiswahili cha asili kuwa “siku hiyo.”
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: kuanzia mwanamume mpaka mwanamke
  rationale: Inahifadhi nomino za umoja zenye jinsia na nguvu ya usemi unaojumuisha watu wote wa makundi hayo mawili.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: elfu kumi na mbili
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi 12,000 kwa Kiswahili.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: watu wote wa Ai
  rationale: Ingawa אַנְשֵׁי kwa umbo ni “wanaume wa,” hapa inaonekana kutumika kwa maana ya kijumuiya kuhusu wakazi wa Ai, kwa kuwa sentensi yenyewe imetaja wanaume na wanawake. Tanbihi inadumisha maana halisi na utata huo.
theological_decisions:
- issue: Lugha yenye jinsia katika muhtasari wa waliokufa
  choice: Kudumisha “kuanzia mwanamume mpaka mwanamke,” lakini kutafsiri usemi wa mwisho kuwa “watu wote wa Ai”
  alternative: “wanaume wote wa Ai” au “wakazi wote wa Ai”
  rationale: Kifungu cha kwanza kinataja wazi mwanamume na mwanamke, ilhali אַנְשֵׁי הָעָי kinaweza kutumika kama nahau ya kijumuiya. “Watu wote wa Ai” huepuka kuwadondosha wanawake waliotajwa wazi; tanbihi inaonyesha umbo halisi la Kiebrania bila kuondoa mvutano wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kuanzia mwanamume mpaka mwanamke” umedumishwa kwa makusudi ili kuonyesha upeo wa usemi wa Kiebrania, ingawa ni rasmi kidogo kuliko “wanaume na wanawake.”
