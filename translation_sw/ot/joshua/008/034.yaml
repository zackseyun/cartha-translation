  text: וְ/אַֽחֲרֵי כֵ֗ן קָרָא֙ אֶת כָּל דִּבְרֵ֣י הַ/תּוֹרָ֔ה הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה כְּ/כָל הַ/כָּת֖וּב בְּ/סֵ֥פֶר הַ/תּוֹרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: sw
  text: Baada ya hayo akasoma maneno yote ya Sheria[a]—baraka na laana—kulingana na yote yaliyoandikwa katika Kitabu cha Sheria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akatangaza” au “akasoma kwa sauti.” Kitenzi cha Kiebrania katika muktadha huu kinaweza kumaanisha kusoma hadharani au kutangaza. “Sheria” hutafsiri neno la Kiebrania torah, ambalo pia linaweza kumaanisha “mafundisho”; hapa muktadha wa hati ya agano unapendelea “Sheria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  choice: Kisha
  rationale: Kirai hiki kinaonyesha mfuatano wa matukio. “Kisha” ni Kiswahili cha kawaida na chenye mtiririko mzuri katika simulizi.
- source_word: קָרָא
  choice: akasoma
  rationale: Kwa kuwa yambwa ni maneno yote ya Sheria, kitenzi hapa kinamaanisha kusoma, na katika muktadha huu ni kusoma mbele ya watu. Maana ya kutangaza au kusoma kwa sauti imeonyeshwa katika tanbihi bila kuipanua matini.
- source_word: אֶת כָּל דִּבְרֵי הַתּוֹרָה
  choice: maneno yote ya Sheria
  rationale: “Maneno yote” huhifadhi usemi halisi wa Kiebrania. Katika muktadha wa hati ya agano, “Sheria” linafaa kuliko neno pana zaidi “mafundisho.”
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: baraka na laana
  rationale: Nomino za umoja zinajumlisha sehemu au masharti ya agano yanayohusu baraka na laana. Tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: כְּ/כָל הַ/כָּתוּב
  choice: kulingana na yote yaliyoandikwa
  rationale: Usemi huu unaonyesha kwamba usomaji ulifuata yaliyomo katika hati iliyoandikwa; “yaliyoandikwa” hupatana kisarufi na “yote.”
- source_word: בְּ/סֵפֶר הַ/תּוֹרָה
  choice: katika Kitabu cha Sheria
  rationale: “Kitabu” ni tafsiri wazi ya hati iliyoandikwa, na “Kitabu cha Sheria” ni jina linalotambulika katika muktadha huu bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Vistari virefu vinabainisha kwamba “baraka na laana” zinafafanua yaliyomo katika maneno ya Sheria. Alama ya tanbihi [a] imewekwa katika matini kuu.
