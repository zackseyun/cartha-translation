translation:
  language: sw
  text: Basi Yoshua aliuchoma moto mji wa Ai na kuufanya kuwa kilima cha magofu cha kudumu[a], mahali pa ukiwa, mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilima cha magofu cha milele”; neno la Kiebrania עוֹלָם linaweza kumaanisha muda mrefu sana au muda usiojulikana kikomo chake, na mara nyingi hutafsiriwa “milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: akauteketeza
  rationale: Kitenzi שׂרף humaanisha kuchoma kwa moto; “akauteketeza” kinaonyesha kuangamizwa kwa mji kwa moto kwa Kiswahili cha kawaida na cha masimulizi.
- source_word: הָעָי
  choice: mji wa Ai
  rationale: Ai ni jina la mahali; kuongeza “mji wa” kunadhihirisha kwa kawaida kwamba kiambishi cha ngeli katika “kuufanya” kinarejelea mji, bila kutafsiri jina lenyewe.
- source_word: וַיְשִׂימֶהָ
  choice: na kuufanya kuwa
  rationale: שׂים pamoja na kiambishi cha nafsi ya tatu, umoja wa kike, hapa ina maana ya kuweka au kufanya kitu kiwe katika hali inayofuata; “kuufanya kuwa” huwasilisha maana hiyo ya matokeo.
- source_word: תֵּל
  choice: kilima cha magofu
  rationale: תֵּל ni kilima au lundo lililoundwa na mabaki ya mji uliobomolewa. “Kilima cha magofu” ni wazi zaidi kuliko “kilima” peke yake na hakipunguzi maana kuwa lundo la kawaida.
- source_word: עוֹלָם
  choice: cha kudumu
  rationale: עוֹלָם hapa huonyesha hali inayoendelea kwa muda usio na kikomo kilichotajwa; “cha kudumu” ni cha asili katika Kiswahili bila kulazimisha maana ya umilele wa kifalsafa.
- source_word: שְׁמָמָה
  choice: ukiwa ukiwa
  rationale: Nomino שְׁמָמָה huonyesha ukiwa au uharibifu. Kirai “ukiwa ukiwa” huhifadhi wazo la Ai kuwa mahali pa ukiwa, huku kikisomeka kwa kawaida baada ya “mji wa Ai.”
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni nahau ya kawaida inayoonyesha kwamba hali hiyo iliendelea hadi wakati wa msimulizi; “mpaka leo” ni Kiswahili cha kawaida na sahihi.
