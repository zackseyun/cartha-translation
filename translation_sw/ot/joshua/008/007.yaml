base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: sw
  text: Nanyi mtainuka kutoka mahali pa kuvizia na kuutwaa mji[a], kwa maana Yahwe Mungu wenu atautia mikononi mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuumiliki mji.” Kitenzi cha Kiebrania kinaweza kumaanisha kutwaa milki, si kuuteka kijeshi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: mtainuka
  rationale: Ni Qal imperfect nafsi ya pili wingi ya קום, ikitumika kama agizo katika mfuatano wa kijeshi. ‘Mtainuka’ linaonyesha kutoka katika hali ya kujificha ili kuchukua hatua.
- source_word: מֵהָאוֹרֵב
  choice: kutoka mahali pa kuvizia
  rationale: Nomino אֹרֵב hapa inaashiria mahali au kikosi kilichojificha kwa ajili ya shambulizi la kushtukiza. Usemi huu ni wa kawaida na unaweka wazi maana ya kijeshi.
- source_word: וְהוֹרַשְׁתֶּם
  choice: na kuutwaa
  rationale: Hiphil ya ירשׁ inaweza kumaanisha kutwaa, kumiliki, au kuwanyang’anya wengine milki. Katika muktadha wa kuushambulia mji, ‘kuutwaa’ huhifadhi kwa ufupi wazo la kuuchukua na kuuweka chini ya mamlaka yao.
- source_word: הָעִיר
  choice: mji
  rationale: Tafsiri ya moja kwa moja ya עִיר yenye kibainishi; katika Kiswahili, kiambishi cha yambwa ‘u-’ kwenye kitenzi tayari kinaurejelea mji huo.
- source_word: וּנְתָנָהּ
  choice: atautia
  rationale: Qal perfect yenye kiunganishi baada ya agizo inaonyesha matokeo ya wakati ujao yaliyoahidiwa kwa uhakika. ‘Atautia’ ni ya asili katika Kiswahili na inadumisha ahadi hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni umbo la kuunganisha lenye kiambishi cha nafsi ya pili wingi, hivyo limetafsiriwa moja kwa moja.
- source_word: בְּיֶדְכֶם
  choice: mikononi mwenu
  rationale: Nahau ya Kiebrania ya kutoa kitu ‘mkononi’ mwa mtu humaanisha kukiweka chini ya uwezo au mamlaka yake. Wingi ‘mikononi mwenu’ ni nahau ya kawaida na inayoeleweka katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uhakika wa tendo la Mungu katika וּנְתָנָהּ
  choice: atautia
  alternative: ameutia
  rationale: Ingawa kitenzi kina umbo la perfect, katika mfuatano huu wa maagizo kinaeleza matokeo ya baadaye yaliyoahidiwa kwa uhakika; wakati ujao wa Kiswahili huwasilisha kazi hiyo bila kuondoa uhakika wa ahadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Nahau ya kibiblia ‘mikononi mwenu’ imehifadhiwa kwa sababu inaeleweka vizuri; ‘mahali pa kuvizia’ huepuka usemi mzito au usio wazi.
