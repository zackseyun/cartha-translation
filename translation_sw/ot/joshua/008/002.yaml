base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: sw
  text: Utautendea mji wa Ai na mfalme wake kama ulivyoutendea mji wa Yeriko na mfalme wake. Nyara zake na mifugo yake tu mnaweza kujitwalia[a]. Jiwekee waviziaji nyuma ya mji[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtajitwalia.” Umbo la Kiebrania linaweza kueleweka kuwa taarifa ya jambo litakalofanywa au agizo lenye idhini; tafsiri kuu inaonyesha tofauti na Yeriko, ambako kuchukua nyara kulikatazwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “jiwekee kikosi cha kuvizia nyuma ya mji.” Neno la Kiebrania lililo katika umoja linaweza kumaanisha uviziaji kama mpango mmoja au kikosi cha waviziaji kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ לָעַי וּלְמַלְכָּהּ
  choice: Utautendea mji wa Ai na mfalme wake
  rationale: Kauli hii ni agizo kwa Yoshua. Kitenzi ‘utautendea’ kinaonyesha jambo litakalofanywa kwa Ai, huku ‘mji wa’ ikifanya jina Ai lieleweke kwa kawaida katika Kiswahili.
- source_word: כַּאֲשֶׁר עָשִׂיתָ לִירִיחוֹ וּלְמַלְכָּהּ
  choice: kama ulivyoutendea mji wa Yeriko na mfalme wake
  rationale: Inahifadhi ulinganisho wa moja kwa moja na yaliyofanywa kwa Yeriko na mfalme wake.
- source_word: רַק
  choice: Lakini
  rationale: 'Hapa neno hilo linaweka tofauti muhimu na yaliyotokea Yeriko: nyara na mifugo ya Ai zinaruhusiwa kuchukuliwa.'
- source_word: שְׁלָלָהּ וּבְהֶמְתָּהּ
  choice: nyara zake na mifugo yake
  rationale: ‘Nyara’ ni mali inayotwaliwa vitani, na ‘mifugo’ inaonyesha wanyama wanaofugwa kama mali.
- source_word: תָּבֹזּוּ לָכֶם
  choice: mnaweza kujitwalia
  rationale: Kitenzi cha wingi kinawaelekea wapiganaji pamoja. Katika muktadha huu kinaidhinisha kuchukua nyara, tofauti na marufuku ya Yeriko; ‘kujitwalia’ pia huhifadhi wazo la לָכֶם, ‘kwa ajili yenu wenyewe.’
- source_word: שִׂים לְךָ
  choice: Jiwekee
  rationale: Agizo hili ni la umoja kwa Yoshua na linahifadhi maana ya kuweka kwa kusudi lake mwenyewe.
- source_word: אֹרֵב
  choice: waviziaji
  rationale: Umbo la Kiebrania linaweza kumaanisha mviziaji au kikosi cha kuvizia kwa pamoja; ‘waviziaji’ ni usemi wa kawaida na wazi katika muktadha wa kijeshi.
- source_word: מֵאַחֲרֶיהָ
  choice: nyuma ya mji
  rationale: Inaeleza mahali ambapo waviziaji wanapaswa kuwekwa, upande wa nyuma wa mji.
