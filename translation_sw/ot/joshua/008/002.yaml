  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ni wazi kwa wasomaji wa kawaida, huku tofauti ya nafsi ikihifadhiwa: Yoshua anaagizwa kwa umoja, na jeshi linaidhinishwa kwa wingi kuchukua nyara.'
