  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: sw
  text: Ikawa, mfalme wa Ai alipoona, wanaume wa mji wakaharakisha na kuamka mapema, wakatoka kwenda kukabiliana na Israeli vitani, yeye na watu wake wote, mahali palipopangwa[a] mbele ya Araba[b]. Lakini hakujua kwamba kulikuwa na kikosi cha kuvizia dhidi yake nyuma ya mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati uliopangwa.” Neno la Kiebrania linaweza kutaja wakati au mahali palipopangwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “mbele ya uwanda kame.” Neno la Kiebrania linaweza kutaja eneo la Araba au, kwa ujumla zaidi, uwanda kame.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kiashiria cha kawaida cha kuendeleza simulizi; “Ikawa” hudumisha mtindo wa Kiebrania bila kuwa nzito kupita kiasi.
- source_word: כִּרְאוֹת מֶלֶךְ הָעַי
  choice: mfalme wa Ai alipoona hayo
  rationale: Muundo wenye כ na kitenzi-jina unaonyesha wakati, “alipoona.” Kirejewa hakitajwi wazi katika Kiebrania; “hayo” kinarejelea yaliyokuwa yakitokea katika muktadha.
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: watu wa mji wakafanya haraka, wakaamka mapema
  rationale: Vitenzi vyote ni vya wingi. Kutaja “watu wa mji” mapema kunafanya wahusika wawe wazi katika Kiswahili huku maana ya kufanya haraka na kuamka mapema ikihifadhiwa.
- source_word: אַנְשֵׁי הָעִיר
  choice: watu wa mji
  rationale: Ingawa neno hilo linaweza kutafsiriwa kihalisi “wanaume wa mji,” hapa linataja kikosi kilichotoka vitani; “watu wa mji” ni Kiswahili cha kawaida bila kuongeza neno “jeshi” lisilopo katika maandishi.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: kwenda kukabiliana na Israeli vitani
  rationale: לִקְרַאת ni kwenda kukutana au kuelekea upande wa mwingine; muktadha wa לַמִּלְחָמָה unaonyesha wazi kuwa mkutano huo ni wa mapambano.
- source_word: הוּא וְכָל עַמּוֹ
  choice: yeye na watu wake wote
  rationale: Inahifadhi neno עַם, “watu,” badala ya kulibadili kuwa “jeshi,” ingawa mazingira ni ya kijeshi.
- source_word: לַמּוֹעֵד
  choice: mahali palipopangwa
  rationale: מוֹעֵד linaweza kumaanisha wakati au mahali palipowekwa. Maelezo ya eneo yanayofuata yanaunga mkono maana ya mahali, lakini maana nyingine imehifadhiwa katika tanbihi.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: mbele ya Araba
  rationale: לִפְנֵי ni “mbele ya,” na הָעֲרָבָה huenda ni jina la eneo la Araba; tanbihi inahifadhi uwezekano wa maana ya kawaida ya uwanda kame.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: kulikuwa na waviziaji waliomvizia nyuma ya mji
  rationale: אֹרֵב inaweza kueleza waviziaji au uvamizi wa kuvizia. Kiswahili hiki kinaonyesha wazi kuwa watu walikuwa wamejificha kwa kusudi la kumvizia, bila kubadili mahali pao nyuma ya mji.
