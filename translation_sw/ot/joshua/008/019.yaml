  terminology: “Yoshua,” “mji,” “kuteka,” na “moto” ni istilahi sahihi na zenye rejista inayofaa. Maelezo “wale waliokuwa wamejificha kwa kuvizia” yanawakilisha kwa usahihi kikosi kilichokuwa kiviziani, ingawa ni mapana kidogo kuliko istilahi fupi.
