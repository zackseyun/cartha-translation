base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: sw
  text: Ndipo wale waliokuwa wamejificha kwa kuvizia waliinuka upesi kutoka mahali pao, wakakimbia Yoshua aliponyoosha mkono wake.[a] Wakaingia mjini, wakauteka, kisha wakafanya haraka wakautia moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mara tu Yoshua aliponyoosha mkono wake.” Muundo wa Kiebrania unaonyesha wakati wa ishara ya Yoshua na unaweza kutafsiriwa kwa msisitizo wa mwitikio wa haraka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: wale waliokuwa wamejificha kwa kuvizia
  rationale: Nomino ya kishiriki inarejelea kwa pamoja kikosi kilichokuwa kimejificha ili kuvizia. Kauli hii ni wazi na ya kawaida zaidi katika Kiswahili kuliko nomino dhahania kama 'mavizio'.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: waliinuka upesi kutoka mahali pao
  rationale: קום hapa huonyesha kuanza kutenda kutoka mafichoni; 'waliinuka upesi' huhifadhi mwendo na kasi. Ingawa Kiebrania hutumia umoja kwa kikosi cha pamoja, Kiswahili hutumia wingi wa watu kwa kawaida.
- source_word: וַיָּרֻצוּ
  choice: wakakimbia
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi, nayo inadumisha kasi ya simulizi bila kuongeza wazo la kushambulia.
- source_word: כִּנְטוֹת יָדוֹ
  choice: mara tu Yoshua aliponyoosha mkono wake
  rationale: Muundo wa infinitivi pamoja na כ unaonyesha wakati, na huenda pia ukasisitiza mwitikio wa papo hapo. Jina 'Yoshua' limewekwa wazi kutokana na muktadha ili kuepuka utata wa kiwakilishi katika Kiswahili.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: wakaingia mjini
  rationale: בוא pamoja na mahali pa kufikiwa humaanisha kuingia. 'Mjini' ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: וַיִּלְכְּדוּהָ
  choice: wakauteka
  rationale: לכד katika simulizi la kijeshi humaanisha kuteka au kuuchukua mji kwa nguvu. Kiwakilishi '-u-' kinarejelea mji.
- source_word: וַיְמַהֲרוּ
  choice: wakafanya haraka
  rationale: Kitenzi hiki kimehifadhiwa kwa uwazi badala ya kugeuzwa tu kuwa kielezi, ili msisitizo wa pili wa kasi katika Kiebrania ubaki.
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: kuuteketeza kwa moto
  rationale: Hiphil ya יצת ina maana ya kuwasha au kutia moto. 'Kuuteketeza kwa moto' ni ya asili na huhifadhi kutajwa wazi kwa moto.
