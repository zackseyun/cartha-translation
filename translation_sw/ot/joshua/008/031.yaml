  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: sw
  text: 'kama vile Musa, mtumishi wa Yahwe, alivyowaamuru wana wa Israeli, kama ilivyoandikwa katika Kitabu cha Sheria ya Musa: madhabahu ya mawe mazima[a], mawe ambayo hayakufanyiwa kazi kwa chuma. Juu yake wakamtolea Yahwe sadaka za kuteketezwa na wakatoa dhabihu za amani[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawe yasiyochongwa.” Kiebrania kinasema “mawe mazima,” yaani mawe yaliyoachwa katika hali yake kamili bila kufanyiwa kazi kwa chuma.
    reason: lexical_alternative
  - marker: b
    text: Au, “dhabihu za ushirika” au “dhabihu za hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: kama vile ... alivyowaamuru
  rationale: Inaonyesha kwamba tendo hilo lilifanywa sawasawa na amri ya awali, kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahwe
  rationale: “Mtumishi” linafaa kwa cheo hiki cha heshima cha Musa bila kuingiza dhana ya utumwa ambayo haitiliwi mkazo hapa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatamka jina la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo; “Yahwe” ni umbo linalofaa katika tahajia ya Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Linahifadhi taswira ya kifamilia na ya kijumuiya ya Kiebrania huku likibaki wazi kwa msomaji wa Kiswahili.
- source_word: כַּכָּתוּב בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: kulingana na yaliyoandikwa katika Kitabu cha Sheria ya Musa
  rationale: Linawasilisha kwa kawaida fomula ya mamlaka ya maandishi na kuhifadhi “kitabu” pamoja na “sheria/mafundisho.”
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: madhabahu ya mawe mazima
  rationale: “Mazima” linaakisi maana ya mawe yaliyobaki katika hali yake kamili; ufafanuzi wa “yasiyochongwa” umewekwa katika tanbihi.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: ambayo hakuna chombo cha chuma kilichokuwa kimetumiwa juu yake
  rationale: Linatoa maana ya nahau ya kuinua au kutumia chuma juu ya mawe kwa Kiswahili kinachoeleweka, bila kudai aina mahususi ya chombo.
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: Juu yake wakamtolea ... sadaka za kuteketezwa
  rationale: “Sadaka za kuteketezwa” ni istilahi wazi ya dhabihu iliyoteketezwa, na “juu yake” linahifadhi uhusiano wake na madhabahu.
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: na kutoa dhabihu za amani
  rationale: Linahifadhi istilahi ya jadi ya dhabihu hii, huku upana wa maana yake—ushirika na hali njema—ukibainishwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina lenyewe; kwa hiyo limetoholewa kwa tahajia ya Kiswahili badala ya kubadilishwa kuwa cheo.
- issue: Usemi wa kijumuiya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili linahifadhi usemi wa kifamilia wa Kiebrania bila kuufanya kuwa dai kuhusu wanaume pekee.
- issue: Maana ya dhabihu שְׁלָמִים
  choice: dhabihu za amani
  alternative: dhabihu za ushirika / dhabihu za hali njema
  rationale: Neno la Kiebrania lina uwanja mpana wa maana. Tafsiri kuu inatumia istilahi inayotambulika, na tanbihi inalinda maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mstari unaendeleza wazo la mstari uliotangulia, kama ilivyo katika Kiebrania; alama ya nukta mbili husaidia kutambulisha maelezo ya madhabahu. Viashiria vya tanbihi vimewekwa moja kwa moja baada ya maneno vinayoyafafanua.
