base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: sw
  text: Nao watatoka kutufuata mpaka tutakapowavuta watoke mjini[a], kwa maana watasema[b], ‘Wanatukimbia kama mara ya kwanza.’ Nasi tutawakimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kueleza zaidi maana ya mpango huo, “mpaka tutakapowashawishi watoke mjini.” Kitenzi cha Kiebrania humaanisha kuvuta au kuondoa; “kuwashawishi” huweka wazi ujanja uliokusudiwa.
    reason: lexical_alternative
  - marker: b
    text: “Kama mara ya kwanza” hurejelea wakati Israeli walipowakimbia watu wa Ai hapo awali (tazama Yoshua 7:4–5).
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: Nao watatoka na kutufuata
  rationale: Muundo wa wakati ujao unafaa katika maelezo ya mpango wa Yoshua; ‘kutufuata’ huonyesha wazi maana ya kijeshi ya אַחֲרֵינוּ bila kuongeza wazo lisilokuwapo.
- source_word: עַד הַתִּיקֵנוּ אֹתָם מִן הָעִיר
  choice: mpaka tutakapowavuta mbali na mji
  rationale: Kitenzi נתק katika Hifili kina maana ya kuvuta au kuondoa kitu mahali; ‘kuwavuta mbali’ huhifadhi taswira ya chanzo huku kikieleza ujanja wa kijeshi kwa Kiswahili cha kawaida.
- source_word: כִּי יֹאמְרוּ
  choice: kwa maana watasema
  rationale: כִּי hapa hutoa sababu ya kufanikiwa kwa mpango; ‘kwa maana’ ni kiunganishi cha sababu chenye hadhi na kinachoeleweka.
- source_word: נָסִים לְפָנֵינוּ
  choice: Wanakimbia mbele yetu
  rationale: Kivumishi-tendo נָסִים huonyesha tendo linaloendelea; ‘wanakimbia’ linaakisi hilo na ‘mbele yetu’ hudumisha nahau na ulinganifu wa Kiebrania.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: kama mara ya kwanza
  rationale: Usemi huo unarejelea kurudi nyuma kwa Israeli hapo awali; ‘mara ya kwanza’ ni wa asili zaidi kwa Kiswahili kuliko tafsiri ya neno kwa neno.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: Nasi tutakimbia mbele yao
  rationale: Wakati ujao unafaa kwa tendo lililopangwa; ‘tutakimbia mbele yao’ huhifadhi mwangwi na ulinganifu wa kauli ya adui.
