  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inadumisha mtiririko wa mpango wa kijeshi na ulinganifu wa ‘mbele yetu/mbele yao,’ huku tanbihi ikihifadhi tafsiri ya kifafanuzi zaidi ya הַתִּיקֵנוּ.
