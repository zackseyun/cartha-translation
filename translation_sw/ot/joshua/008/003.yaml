base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: sw
  text: Basi Yoshua na wapiganaji wote[a] waliinuka, wakapanda kuelekea Ai[b]. Yoshua akachagua wanaume elfu thelathini, mashujaa hodari[c], akawatuma usiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “watu wote wa vita”; au “jeshi lote.”'
    reason: lexical_alternative
  - marker: b
    text: Au “kwenda Ai.” Kiebrania kinasema “kupanda,” na katika muktadha huu mwendo huo ulikuwa wa kijeshi dhidi ya Ai.
    reason: lexical_alternative
  - marker: c
    text: Au “wapiganaji mashujaa” au “wanaume wenye uwezo wa vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Katika mfululizo huu wa simulizi, kitenzi קום kinaanzisha tendo la safari. “Akaondoka” ni Kiswahili cha kawaida na cha asili katika muktadha huu, bila kukifanya moja kwa moja kuwa tendo la kushambulia.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: wapiganaji wote
  rationale: Kirai hiki ni halisi zaidi ‘watu wote wa vita.’ “Wapiganaji wote” kinaeleza kazi yao ya kijeshi kwa Kiswahili cha sasa huku kikihifadhi maana ya kundi zima.
- source_word: לַעֲלוֹת
  choice: ili kupanda kwenda
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu kuelekea mahali. Tafsiri hii inahifadhi taswira ya mwelekeo bila kuibadili moja kwa moja kuwa ‘kushambulia,’ ingawa muktadha ni wa kijeshi.
- source_word: הָעָי
  choice: Ai
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali hapa.
- source_word: וַיִּבְחַר
  choice: akachagua
  rationale: בחר humaanisha kuchagua; “akachagua” ni tafsiri ya moja kwa moja na ya kawaida katika simulizi.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: wanaume elfu thelathini
  rationale: Tafsiri hii inahifadhi idadi na nomino אִישׁ, ‘mwanamume,’ badala ya kuiweka tu kwa namna ya kufasiri kuwa ‘askari.’
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: mashujaa hodari
  rationale: Kirai hiki humaanisha wapiganaji wenye nguvu, uwezo na ushujaa. “Mashujaa hodari” ni cha asili, chenye heshima, na kisicho cha kizamani katika Kiswahili.
- source_word: וַיִּשְׁלָחֵם
  choice: akawatuma
  rationale: שלח pamoja na kiambishi cha yambwa humaanisha ‘aliwatuma.’ Kiswahili hakihitaji kuongeza neno kama ‘wakaende’ ili kueleza jambo ambalo muktadha tayari unaonyesha.
- source_word: לָיְלָה
  choice: usiku
  rationale: Hapa neno hili limetumiwa kielezi kuonyesha wakati walipotumwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Maneno ya kizamani kama “watu wa vita” yameepukwa katika andiko kuu, lakini maana yake halisi imehifadhiwa katika tanbihi. Kauli “kupanda kwenda Ai” imehifadhi ili kutofuta taswira na utata wa kitenzi cha Kiebrania.
