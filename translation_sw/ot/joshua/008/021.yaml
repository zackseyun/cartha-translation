base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: sw
  text: Yoshua na Israeli wote walipoona kwamba waviziaji[a] walikuwa wameuteka mji na kwamba moshi wa mji ulikuwa umepanda, waligeuka na kuwapiga wanaume wa Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikosi kilichovizia.” Umbo la Kiebrania ni la umoja, lakini linaweza kurejelea kwa maana ya pamoja kikosi cha waviziaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: walipoona
  rationale: Kitenzi cha kawaida cha kuona au kutambua; hapa muundo wa ‘walipoona kwamba’ unaonyesha kwa kawaida yaliyotambuliwa katika simulizi.
- source_word: כִּי ... וְכִי
  choice: kwamba ... na kwamba
  rationale: Viunganishi hivi vinaanzisha mambo mawili yaliyoonwa na Yoshua pamoja na Israeli yote.
- source_word: לָכַד
  choice: walikuwa wameuteka
  rationale: ‘Kuteka’ hufaa kwa kuuchukua mji vitani, na hali timilifu inaonyesha kuwa tendo hilo lilikuwa limetokea kabla ya wao kuliona.
- source_word: הָאֹרֵב
  choice: waviziaji
  rationale: Umbo la Kiebrania linamtaja kwa maana ya pamoja mtu au kikosi kilichokuwa kikivizia; ‘waviziaji’ ni wazi na ya kawaida katika Kiswahili cha simulizi la kijeshi.
- source_word: הָעִיר
  choice: mji
  rationale: Tafsiri ya moja kwa moja ya nomino hii; imerudiwa ili kudumisha uwazi wa maandishi ya Kiebrania.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: moshi wa mji ulikuwa umepanda
  rationale: Huhifadhi taswira ya Kiebrania ya moshi kupanda na huonyesha kuwa tayari ulikuwa unaonekana.
- source_word: וַיָּשֻׁבוּ
  choice: waligeuka
  rationale: Katika muktadha wa vita, kitenzi kinaonyesha kubadili mwelekeo ili kukabiliana tena na adui.
- source_word: וַיַּכּוּ
  choice: kuwapiga
  rationale: Kitenzi נכה humaanisha kupiga au kushambulia, mara nyingi kwa matokeo ya kufisha vitani; ‘kuwapiga’ huhifadhi maana yake bila kutaja wazi zaidi ya maandishi.
- source_word: אַנְשֵׁי הָעָי
  choice: watu wa Ai
  rationale: Ingawa אַנְשֵׁי inaweza kumaanisha ‘wanaume wa,’ katika muundo huu wa jina la mahali pia hutaja watu wa Ai kwa ujumla; ‘watu wa Ai’ ni Kiswahili cha kawaida bila kuwalazimisha wawe ‘wanajeshi.’
