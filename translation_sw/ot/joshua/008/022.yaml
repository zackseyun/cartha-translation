base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: sw
  text: Nao wale wakatoka mjini kwenda kukabiliana nao. Hivyo watu wa Ai wakawa katikati ya Waisraeli, hawa upande mmoja na wale upande mwingine.[a] Waisraeli wakawapiga mpaka hawakumwachia hata mmoja aliyenusurika wala mkimbizi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hawa kutoka upande huu na wale kutoka upande ule,” yaani, Waisraeli waliwabana kutoka pande zote mbili.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania hubadilika ghafla na kutumia kitenzi cha umoja: “mpaka hakumwachia yeye aliyenusurika wala mkimbizi.” Maana yake ni kwamba hakuna aliyebaki hai wala aliyeweza kutoroka.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Nao wale
  rationale: Kiwakilishi cha kuonyesha kinadumishwa kwa lugha ya kawaida ya Kiswahili na kinarejelea kikosi cha kuvizia kilichotajwa katika muktadha uliotangulia.
- source_word: יָצְאוּ מִן הָעִיר
  choice: wakatoka mjini
  rationale: Kitenzi יצא kina maana ya kutoka; “mjini” ni usemi wa kawaida na wa wazi kwa kutoka ndani ya mji.
- source_word: לִקְרָאתָם
  choice: kwenda kukabiliana nao
  rationale: Katika muktadha wa vita, לקראת inaashiria kwenda kuonana nao kwa uhasama. “Kukabiliana” huonyesha nguvu hiyo bila kuongeza maelezo yasiyokuwamo.
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: Hivyo watu wa Ai wakawa katikati ya Waisraeli
  rationale: Kauli inaeleza matokeo ya mbinu ya kijeshi. Kutaja “watu wa Ai” kunaondoa utata wa viwakilishi katika Kiswahili, huku “katikati” ikidumisha picha ya Kiebrania.
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: hawa upande mmoja na wale upande mwingine
  rationale: Huu ni usemi wa pande mbili unaoonyesha kuwa watu wa Ai walibanwa kutoka pande zote mbili.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Waisraeli wakawapiga
  rationale: Katika vita, נכה hueleza kushambulia na kuangusha adui. “Wakawapiga” hudumisha upana wa kitenzi bila kulazimisha tafsiri ya kila pigo kuwa mauaji ya papo hapo.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: mpaka hawakumwachia hata mmoja
  rationale: Kiswahili cha kawaida huwasilisha kikomo na ukanushi kwa njia hii. Wingi wa Waisraeli umetumiwa kwa uwazi, ingawa Kiebrania hubadilika na kutumia kitenzi cha umoja pamoja na kiambishi cha umoja; jambo hilo linaelezwa katika tanbihi.
- source_word: שָׂרִיד וּפָלִיט
  choice: aliyenusurika au kutoroka
  rationale: Maneno hayo mawili yanatofautisha mtu aliyebaki hai na mtu aliyeponyoka. Muundo wa vitenzi vya Kiswahili ni wa kawaida na unaeleza kwamba hakuna wa aina yoyote aliyebaki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya wahusika yamewekwa wazi pale ambapo mfululizo wa viwakilishi ungeleta utata. Muundo wa sentensi umefanywa wa kawaida kwa wasomaji wa leo, huku picha ya kuzingirwa kutoka pande mbili na badiliko lisilo la kawaida la Kiebrania katika kishazi cha mwisho vikihifadhiwa kupitia matini na tanbihi.
