    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: wakajifanya kuwa wameshindwa
  rationale: Katika muktadha wa kijeshi, kitenzi hiki kinaweza kueleza kushindwa mbele ya adui; simulizi linaonyesha kwamba hapa ilikuwa mbinu ya kujifanya wameshindwa. Tafsiri hii inaonyesha hila hiyo bila kuongeza maelezo marefu ndani ya mstari, huku tanbihi ikihifadhi uwezekano wa maana ya kawaida ya kutendwa.
- source_word: לִפְנֵיהֶם
  choice: mbele yao
  rationale: Hii ni tafsiri ya kawaida na ya asili ya לִפְנֵי pamoja na kiambishi chake, na inadumisha picha ya kukabili adui vitani.
- source_word: וַיָּנֻסוּ
  choice: wakakimbia
  rationale: נוּס humaanisha kukimbia au kutoroka. “Wakakimbia” ni lugha ya kawaida na ya moja kwa moja; “wakarudi nyuma” ingeweza kudokeza zaidi kwamba ilikuwa hatua iliyopangwa.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: kwa njia inayoelekea nyikani
  rationale: דֶּרֶךְ inaweza kumaanisha njia, barabara, au mwelekeo. Kauli hii ya Kiswahili ni ya asili na inaonyesha njia iliyoelekea nyikani, huku tanbihi ikihifadhi uwezekano wa kuelewa kwamba walikuwa kwenye barabara ya nyikani.
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: Yoshua na Israeli wote
  rationale: Inahifadhi jina la Yoshua na matumizi ya “Israeli” kama jina la pamoja la watu, kama ilivyo katika Kiebrania.
