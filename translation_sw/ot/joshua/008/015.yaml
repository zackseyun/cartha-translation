  language: sw
  text: Yoshua na Israeli wote wakashindwa mbele yao, wakakimbia kwa njia inayoelekea nyikani.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakajifanya wameshindwa mbele yao.” Katika muktadha, huenda hii inaeleza mbinu ya kujifanya wameshindwa ili kuwavuta watu wa Ai watoke mjini.
    reason: lexical_alternative
  - marker: b
