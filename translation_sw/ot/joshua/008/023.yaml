  text: וְ/אֶת מֶ֥לֶךְ הָ/עַ֖י תָּ֣פְשׂוּ חָ֑י וַ/יַּקְרִ֥בוּ אֹת֖/וֹ אֶל יְהוֹשֻֽׁעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/023.yaml
  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: sw
  text: Lakini walimkamata mfalme wa Ai akiwa hai, wakamleta kwa Yoshua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao walimkamata mfalme wa Ai akiwa hai, wakamleta kwa Yoshua.”
    reason: Kiunganishi cha Kiebrania kinaweza kutafsiriwa kama mwendelezo wa simulizi (“Nao”) badala ya kuonyesha tofauti (“Lakini”).
lexical_decisions:
- source_word: וְ/אֶת
  choice: Lakini
  rationale: Kiunganishi וְ kinaendeleza simulizi, lakini hapa pia kinaonyesha tofauti na kuuawa kwa watu wengine wa Ai; “Lakini” huonyesha tofauti hiyo kwa Kiswahili cha kawaida. “Nao” linawezekana kwa tafsiri iliyo karibu zaidi na muundo wa Kiebrania.
- source_word: מֶלֶךְ הָעַי
  choice: mfalme wa Ai
  rationale: Huu ni muundo wa umilikaji unaotaja mfalme wa mji wa Ai; “mfalme wa Ai” ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: תָּפְשׂוּ
  choice: walimkamata
  rationale: Kitenzi hiki humaanisha kumtia mtu mikononi au kumkamata; katika muktadha wa vita, “walimkamata” hutoa maana kwa uwazi.
- source_word: חָי
  choice: akiwa hai
  rationale: Kivumishi hiki kinaonyesha kwamba mfalme hakuuawa alipokamatwa. “Akiwa hai” ni Kiswahili cha kawaida na huhifadhi hali hiyo.
- source_word: וַיַּקְרִבוּ
  choice: wakamleta
  rationale: Hifili ya קרב humaanisha kumleta mtu karibu. Katika Kiswahili, “wakamleta kwa Yoshua” huwasilisha kwa kawaida mwendo na kumfikisha kwa Yoshua bila kuongeza wazo la hukumu au uwasilishaji rasmi.
- source_word: אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: kwa Yoshua
  rationale: Kihusishi אֶל kinaonyesha Yoshua kuwa mwisho wa mwendo. “Kwa Yoshua” ni muundo wa kawaida wa Kiswahili unaoonyesha kwamba walimfikisha kwake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo “akiwa hai” huondoa utata wa kisarufi na kubainisha kwamba ni mfalme aliyekuwa hai. Jina la mahali “Ai” na jina “Yoshua” yamehifadhiwa kwa maumbo yanayotumika katika Kiswahili cha Biblia.
