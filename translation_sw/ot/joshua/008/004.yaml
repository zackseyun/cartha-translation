translation:
  language: sw
  text: Akawaamuru, akisema, “Angalieni! Mtavizia mji kutoka upande wa nyuma yake. Msiende mbali sana na mji, nanyi nyote muwe tayari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: Angalieni!
  rationale: Amri hii huvuta usikivu kwa msisitizo; ‘Angalieni!’ ni ya kawaida na yenye nguvu katika Kiswahili sanifu.
- source_word: אֹרְבִים לָעִיר
  choice: Mtavizia mji
  rationale: Muundo wa Kiebrania unaeleza kuwa wao ndio kikosi cha kuvizia dhidi ya mji; kitenzi ‘kuvizia’ kinawasilisha tendo hilo kwa ufasaha.
- source_word: מֵאַחֲרֵי הָעִיר
  choice: kutoka upande wa nyuma yake
  rationale: Huhifadhi mahali pa kikosi nyuma ya mji bila kudokeza kwamba wako ndani yake.
- source_word: נְכֹנִים
  choice: tayari
  rationale: Katika muktadha wa maagizo ya kijeshi, neno hili humaanisha kuwa wamejiandaa kuchukua hatua.
