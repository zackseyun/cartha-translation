  text: וַ/יִּזָּעֲק֗וּ כָּל הָ/עָם֙ אֲשֶׁ֣ר ב/עיר לִ/רְדֹּ֖ף אַחֲרֵי/הֶ֑ם וַֽ/יִּרְדְּפוּ֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/יִּנָּתְק֖וּ מִן הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/016.yaml
  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: sw
  text: Basi watu wote waliokuwa mjini wakaitwa ili wawafuatilie[a]. Nao wakamfuatilia Yoshua, wakavutwa mbali na mji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapiga kelele ili wawafuatilie.” Kitenzi cha Kiebrania kinaweza kumaanisha kupiga kelele, ingawa hapa yaelekea kinamaanisha kuitwa au kuhamasishwa kwa ajili ya msako.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakatenganishwa na mji” au “wakaondolewa mjini.” Kiebrania kinaonyesha kuvutwa au kung’olewa na hivyo kutengwa na mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: wakaitwa
  rationale: Nifali ya זעק hapa inaelekea kumaanisha kuitwa au kuhamasishwa kwa ajili ya hatua ya kijeshi, si kupiga kelele tu. Kauli tendwa “wakaitwa” inadumisha umbo hilo bila kuongeza maelezo yasiyomo.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: watu wote waliokuwa mjini
  rationale: עָם ni “watu” au kundi la watu; “watu wote” huepuka kubainisha “wanaume” pasipo msingi wa moja kwa moja katika Kiebrania.
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: ili wawafuatilie
  rationale: רדף אחרי ni nahau ya kufuatilia au kukimbiza. “Kuwafuatilia” ni ya kawaida na inafaa simulizi la kijeshi.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: wakamfuatilia Yoshua
  rationale: Inadumisha kurudiwa kwa kitenzi na mabadiliko ya wazi kutoka kiwakilishi cha wingi “wao” hadi Yoshua kama mlengwa aliyetajwa.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: wakavutwa mbali na mji
  rationale: Nifali ya נתק inaweza kuonyesha kung’olewa, kutenganishwa, au kuvutwa mbali. Katika muktadha huu, watu walitolewa katika nafasi ya mji na kutenganishwa nao; tafsiri hii inadumisha taswira hiyo bila kuifanya kuwa kukatwa kimwili.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
