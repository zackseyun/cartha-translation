  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye hadhi, na unaoeleweka kwa urahisi. “Basi” huunganisha mstari na tukio lililotangulia, huku miundo ya “waka-” ikidumisha mwendo wa simulizi. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vipashio vinavyohusika.
