translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi wenye “waka-” unadumisha mwendo wa simulizi la Kiebrania. “Wapiganaji” huepuka usemi usio wa kawaida “watu wa vita” na pia huepuka kuingiza jinsia isiyotajwa na neno עָם.
