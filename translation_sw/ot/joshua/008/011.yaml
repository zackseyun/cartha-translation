base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: sw
  text: Nao wapiganaji wote waliokuwa pamoja naye wakapanda, wakakaribia, wakafika mbele ya mji, wakapiga kambi upande wa kaskazini wa Ai, na bonde lilikuwa kati yake[a] na Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kati yake na Ai.” Kiwakilishi cha umoja huenda kinamrejelea Yoshua, ingawa wengine huelewa maana yake kwa ujumla kuwa “kati yao na Ai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: wapiganaji wote
  rationale: Kirai hiki kinamaanisha kundi lote la waliopigana, si raia wote. “Wapiganaji” ni Kiswahili cha kawaida, wazi, na hakiongezi ubainishaji wa jinsia ambao haupo katika Kiebrania.
- source_word: אֲשֶׁר אִתּוֹ
  choice: waliokuwa pamoja naye
  rationale: Hutambulisha wapiganaji waliokuwa wakifuatana na Yoshua.
- source_word: עָלוּ
  choice: wakapanda
  rationale: Kitenzi עלה kwa kawaida humaanisha kwenda au kupanda juu; tafsiri hii inadumisha maana ya mwelekeo bila kuongeza maelezo ya kijeshi.
- source_word: וַיִּגְּשׁוּ
  choice: wakakaribia
  rationale: נגשׁ humaanisha kusogea karibu; “wakakaribia” ni ya asili na wazi katika Kiswahili.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: wakafika mbele ya mji
  rationale: נֶגֶד huonyesha mahali palipo mbele au mkabala na kitu. “Mbele ya mji” inadumisha wazo la kuufikia na kuukabili bila kudokeza kwamba waliingia ndani yake.
- source_word: וַיַּחֲנוּ
  choice: kupiga kambi
  rationale: חנה ni kitenzi cha kawaida cha kuweka au kupiga kambi; usemi “kupiga kambi” ni Kiswahili cha kawaida.
- source_word: מִצְּפוֹן לָעַי
  choice: upande wa kaskazini wa Ai
  rationale: Kirai hiki hutaja mahali walipokuwa kuhusiana na Ai; tafsiri hii ni wazi na ya kawaida.
- source_word: הַגַּי
  choice: bonde
  rationale: גַּי inaweza kumaanisha bonde au korongo. “Bonde” ni neno pana na linaloeleweka bila kuifanya sura ya ardhi kuwa mahususi kuliko maandishi.
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: kati yake na Ai
  rationale: Maandishi ya Kiebrania yana kiwakilishi cha nafsi ya tatu umoja wa kiume, ambacho huenda kinamrejelea Yoshua. Tafsiri inadumisha umoja huo mgumu badala ya kuubadili kimya kuwa wingi.
