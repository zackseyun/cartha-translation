  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: sw
  text: Mimi na watu wote walio pamoja nami tutaukaribia mji[a]. Nao watakapotoka kukutana nasi kama hapo awali[b], tutawakimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tutauendea mji.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kama mara ya kwanza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי וְכָל הָעָם אֲשֶׁר אִתִּי
  choice: Nami pamoja na watu wote walio pamoja nami
  rationale: Muundo huu unaendeleza mfululizo wa maagizo, unahifadhi maana pana ya הָעָם kama “watu,” na unasikika kwa kawaida katika Kiswahili bila kuibana maana kuwa wanajeshi pekee.
- source_word: נִקְרַב אֶל הָעִיר
  choice: tutaukaribia mji
  rationale: Kitenzi קרב kinaonyesha mwendo wa kusogea karibu na mji kama hatua iliyopangwa; “kuukaribia” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְהָיָה כִּי
  choice: Nao watakapotoka
  rationale: Muundo wa Kiebrania unatambulisha tukio la wakati linalofuata. Kiambishi “-takapo-” kinatoa maana hiyo kwa Kiswahili fasaha, huku “Nao” ikiendeleza uhusiano wa sentensi.
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: watakapotoka kuja kukutana nasi
  rationale: יצא pamoja na לקראת inaeleza kutoka ili kukutana na upande mwingine. Tafsiri haiongezi waziwazi maana ya uhasama ambayo haijatajwa moja kwa moja katika kirai.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: kama hapo awali
  rationale: Kirai kinarejelea tukio la kwanza lililotangulia. “Kama hapo awali” ni cha kawaida na kinadumisha rejeo hilo bila maelezo ya ziada.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: tutawakimbia
  rationale: נוס ina nguvu ya “kukimbia,” si tu kurudi nyuma kwa mpangilio. Katika Kiswahili, “kuwakimbia” huwasilisha kwa kawaida kukimbia mbele yao au kuwaepuka.
