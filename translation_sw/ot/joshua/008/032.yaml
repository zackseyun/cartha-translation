  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: sw
  text: Hapo, kwenye mawe, akaandika nakala[a] ya sheria ya Musa, ambayo Musa aliandika mbele ya[b] wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “marudio ya sheria ya Musa” au “nakala nyingine ya sheria ya Musa.” Neno la Kiebrania linaweza kumaanisha nakala au toleo lililorudiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “katika uwepo wa wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: akaandika
  rationale: Kitenzi cha kawaida cha kuandika kinafaa; ingawa kuandika kwa kuchonga kunawezekana kwa sababu ya mawe, kitenzi cha Kiebrania chenyewe hakilazimishi maana hiyo.
- source_word: שָׁם
  choice: hapo
  rationale: Kielezi hiki cha mahali kinaendeleza simulizi kwa Kiswahili cha kawaida na kurejelea mahali palipotajwa.
- source_word: עַל הָאֲבָנִים
  choice: juu ya mawe
  rationale: Kirai hiki kinaonyesha sehemu ambayo maandishi yaliwekwa.
- source_word: מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: nakala ya sheria ya Musa
  rationale: מִשְׁנֵה inaweza kumaanisha nakala, kitu kilichorudiwa, au mfano wa pili; katika muktadha wa kuandika juu ya mawe, ‘nakala’ ni wazi bila kuamua ukubwa wa maandishi.
- source_word: תּוֹרַת מֹשֶׁה
  choice: sheria ya Musa
  rationale: Ingawa תּוֹרָה pia inaweza kuwa ‘mafundisho’ au ‘maagizo,’ hapa matumizi ya kimapokeo na muktadha wa agano yanafaa kutafsiriwa ‘sheria ya Musa.’
- source_word: אֲשֶׁר כָּתַב
  choice: ambayo aliandika
  rationale: Kiswahili hiki kinafuata kwa karibu kishazi tegemezi cha Kiebrania na hakimtaji mhusika kwa jina, kwa kuwa maandishi ya Kiebrania hayarudii jina lake hapa.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: mbele ya wana wa Israeli
  rationale: ‘Mbele ya’ huhifadhi usemi mfupi wa Kiebrania na inaweza kueleweka kuwa katika kuwapo kwao au machoni pao.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linaakisi kwa uwazi muundo wa Kiebrania wenye nomino ya kiume ya wingi bila kutumia tafsiri pana zaidi ‘Waisraeli.’
theological_decisions:
- issue: Upeo wa מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: nakala ya sheria ya Musa
  alternative: marudio ya sheria ya Musa; nakala nyingine ya sheria ya Musa
  rationale: Mstari hausemi kama maandishi hayo yalikuwa Torati yote au sehemu fulani ya sheria; tafsiri haiongezi uamuzi huo.
- issue: Mhusika wa אֲשֶׁר כָּתַב
  choice: ambayo aliandika
  alternative: ambayo Musa alikuwa ameiandika
  rationale: Kiebrania hakimtaji Musa tena kama kiima cha kishazi hiki. Kutotaja jina katika tafsiri huepuka kuondoa uwezekano wa kuelewa kuwa Yoshua ndiye aliyeandika mbele ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. ‘Hapo’ na ‘akaandika’ ni za kawaida na wazi; ‘sheria ya Musa’ huhifadhi istilahi inayotambulika. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
