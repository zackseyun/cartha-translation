base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: sw
  text: Mtakapouteka mji, mtauchoma moto. Fanyeni kulingana na neno la Yahwe.[a] Angalieni, nimewaamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Fanyeni kulingana na amri ya Yahwe.” Kiebrania kinasema kihalisi, “kulingana na neno la Yahwe, fanyeni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: Mtakapokuwa mmeuteka
  rationale: Muundo huu unatambulisha tukio litakalotangulia amri inayofuata. Kauli ya wakati timilifu katika Kiswahili inaonyesha wazi kwamba kuuteka mji kunatangulia kuuchoma.
- source_word: הָעִיר
  choice: mji
  rationale: Hili ndilo neno la kawaida na linalofaa kwa עִיר katika simulizi la kijeshi.
- source_word: תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: mtauchoma moto
  rationale: Kauli hii ya kawaida ya Kiswahili inawasilisha maana ya kisababishi ya kuwasha au kutia mji moto bila ukakasi wa tafsiri ya neno kwa neno.
- source_word: כִּדְבַר יְהוָה תַּעֲשׂוּ
  choice: Fanyeni kulingana na neno la Yahwe
  rationale: Inahifadhi neno דָּבָר kama “neno” na nguvu ya amri ya תַּעֲשׂוּ kwa kutumia “Fanyeni,” huku mpangilio ukiwa wa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa umbo la kawaida la Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: רְאוּ
  choice: Angalieni
  rationale: Ni amri ya wingi inayovuta usikivu na kudumisha udhahiri wa Kiebrania bila kuongeza ufafanuzi.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: nimewaamuru
  rationale: Kauli timilifu inaonyesha tendo la kuamuru lililokamilika na ambalo bado lina umuhimu kwa wasikilizaji.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. “Yahwe” huhifadhi jina hilo katika umbo linalosomeka kwa Kiswahili bila kulibadilisha kuwa cheo.
- issue: Maana ya כִּדְבַר יְהוָה
  choice: kulingana na neno la Yahwe
  alternative: kulingana na amri ya Yahwe
  rationale: “Neno” huhifadhi upana wa דָּבָר na ukaribu na muundo wa chanzo; “amri” inawezekana katika muktadha lakini inaifanya maana kuwa mahsusi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Wingi wa wahusika umehifadhiwa katika vitenzi vyote, na jina la Mungu limeandikwa “Yahwe” kwa tahajia inayofaa Kiswahili.
