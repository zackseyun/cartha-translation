base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: sw
  text: Ndipo wanaume wa Ai wakageuka, wakatazama nyuma, na tazama, moshi wa mji ulikuwa ukipanda kuelekea angani[a]. Hawakuwa na uwezo wa kukimbia huku wala kule[b]. Nao watu waliokuwa wamekimbilia nyikani wakageuka dhidi ya aliyekuwa akiwafuatilia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukipanda hadi mbinguni.” Usemi wa Kiebrania una maana halisi ya “kuelekea angani/mbinguni.”
    reason: lexical_alternative
  - marker: b
    text: Nahau ya Kiebrania ni, “hakukuwa na mikono ndani yao,” yaani, hawakuwa na nguvu au uwezo wa kutoroka.
    reason: cultural_note
  - marker: c
    text: Kiebrania kina umoja, “aliyekuwa akifuatilia”; huenda umetumiwa kwa maana ya kijumla kutaja kikosi kilichokuwa kikiwafuatilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אַנְשֵׁי הָעַי אַחֲרֵיהֶם וַיִּרְאוּ
  choice: wanaume wa Ai wakageuka, wakatazama nyuma
  rationale: Hutenganisha matendo mawili ya Kiebrania—kugeuka na kutazama—na kuhifadhi maana ya kutazama upande wa nyuma wao.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi kiashirio cha simulizi kinachovuta fikira kwenye jambo waliloligundua ghafula.
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: moshi wa mji ulikuwa ukipanda kuelekea angani
  rationale: Huwasilisha tendo linaloendelea la moshi kupanda na mwelekeo wa הַשָּׁמַיְמָה bila kudokeza kwa lazima makao ya kiroho.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: hawakuwa na uwezo
  rationale: Nahau ya Kiebrania, kihalisi ‘hakukuwa na mikono ndani yao,’ humaanisha kukosa nguvu au uwezo wa kutenda.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: kukimbia huku wala kule
  rationale: Jozi ya vielezi inaonyesha kwamba hawakuwa na njia ya kutorokea upande wowote.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: watu waliokuwa wamekimbilia nyikani
  rationale: 'Huwatambulisha kwa tendo lao la awali katika simulizi: walikuwa wameelekea nyikani kwa kukimbia.'
- source_word: נֶהְפַּךְ אֶל הָרֹדֵף
  choice: wakageuka dhidi ya aliyekuwa akiwafuatilia
  rationale: ‘Wakageuka’ huonyesha kugeuza mwelekeo, na ‘dhidi ya’ huwasilisha muktadha wa mapambano; umoja wa ‘aliyekuwa akiwafuatilia’ umehifadhiwa.
theological_decisions:
- issue: Maana ya הַשָּׁמַיְמָה
  choice: kuelekea angani
  alternative: hadi mbinguni
  rationale: Katika muktadha huu neno linaonyesha mwelekeo wa juu angani; tafsiri hii huepuka kulazimisha maana ya makao ya Mungu, huku tanbihi ikihifadhi chaguo jingine halali.
- issue: Umoja wa הָרֹדֵף
  choice: aliyekuwa akiwafuatilia
  alternative: waliokuwa wakiwafuatilia
  rationale: Umoja wa Kiebrania umehifadhiwa bila kuamua ikiwa unamtaja mtu mmoja au jeshi linalofuatilia kwa maana ya kijumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Na tazama’ hudumisha msisitizo wa ghafla wa maandishi ya Kiebrania; ‘nyikani’ ni neno la kawaida la kibiblia lakini bado linaeleweka kwa wasomaji wa sasa.
