  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: sw
  text: Israeli wote, pamoja na wazee wao, maafisa na waamuzi wao, walikuwa wamesimama upande huu na upande ule wa sanduku, mkabala na makuhani Walawi waliobeba sanduku la agano la Yahwe—wageni wakazi na wazawa pia[a]. Nusu yao ilikuwa mbele ya Mlima Gerizimu, na nusu yao nyingine mbele ya Mlima Ebali, kama Musa, mtumishi wa Yahwe, alivyoamuru mwanzoni[b], ili kuwabariki watu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mgeni anayeishi miongoni mwao na mzaliwa wa nchi vivyo hivyo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mwanzoni.” Kirai hiki kinaweza kumaanisha “kama tendo la kwanza” au kurejelea amri ambayo Musa alikuwa ametoa hapo awali kuhusu baraka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Huwakilisha kusanyiko lote la taifa kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: pamoja na wazee wao, maafisa na waamuzi wao
  rationale: Kiambishi cha umilikaji kinarejelea Israeli kama jamii; 'maafisa' linafaa kwa viongozi wa kiutawala, na 'waamuzi' kwa viongozi wa kimahakama.
- source_word: עֹמְדִים מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: walikuwa wamesimama pande zote mbili za sanduku
  rationale: Hutoa wazi mpangilio wa makundi pande mbili za sanduku kwa lugha ya asili ya Kiswahili.
- source_word: נֶגֶד הַכֹּהֲנִים הַלְוִיִּם
  choice: mkabala na makuhani Walawi
  rationale: '''Mkabala na'' huonyesha mahali pa kuelekeana; ''makuhani Walawi'' huhifadhi uhusiano wa kikundi bila kulazimisha iwapo Kiebrania ni kivumishi au apposition.'
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: waliobeba sanduku la agano la Yahwe
  rationale: Kirai cha Kiswahili kinawataambulisha makuhani kwa tendo lao na kuhifadhi jina la agano la Mungu.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: Mgeni mkazi na mzawa walikuwamo vivyo hivyo
  rationale: Huonyesha ushiriki sawa wa mgeni anayeishi miongoni mwa Israeli na mtu aliyezaliwa katika jamii hiyo.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: Nusu yao ... na nusu nyingine
  rationale: Hufanya rejeleo kwa watu waliokusanyika liwe wazi na huonyesha mgawanyo katika makundi mawili.
- source_word: בָּרִאשֹׁנָה
  choice: mwanzoni
  rationale: Huhifadhi maana ya msingi ya wakati bila kuamua kimya kimya kama ni tendo la kwanza au amri ya awali.
theological_decisions:
- issue: Uwakilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; 'Yahwe' hulihifadhi kwa unukuzi unaoeleweka katika Kiswahili.
- issue: Utambulisho wa הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  alternative: makuhani, yaani Walawi
  rationale: Uamuzi huu unahifadhi maneno yote mawili bila kuingiza hitimisho la kimadhehebu kuhusu mipaka ya ukuhani.
- issue: Ujumuishaji wa גֵּר na אֶזְרָח
  choice: mgeni mkazi na mzawa ... vivyo hivyo
  alternative: mgeni na mwenyeji
  rationale: Hutofautisha hadhi zao za kijamii huku ukidumisha msisitizo wa maandishi kwamba wote walishiriki sawa katika kusanyiko.
- issue: Maana ya בָּרִאשֹׁנָה
  choice: mwanzoni, pamoja na tanbihi
  alternative: kama tendo la kwanza; hapo awali
  rationale: Kirai kinaweza kueleza mpangilio wa tendo au kurejelea amri ya awali ya Musa; tafsiri na tanbihi hazifungi uwezekano mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa ili kupunguza uzito wa muundo mrefu wa Kiebrania bila kupoteza uhusiano wa mawazo. Majina ya milima yametolewa kama Gerizimu na Ebali, maumbo yaliyozoeleka katika Kiswahili cha Biblia.
