translation:
  language: sw
  text: Yoshua akaamka asubuhi na mapema, akawakusanya watu[a], naye pamoja na wazee wa Israeli wakapanda mbele ya watu kwenda Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akawahesabu watu” au “akawakagua watu”; kitenzi cha Kiebrania kinaweza kumaanisha kuhesabu, kukagua, kuteua au kuweka watu katika nafasi au majukumu, au kukusanya na kupanga kwa shughuli ya kijeshi. Muktadha wa kijeshi unaunga mkono maana ya mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: akaamka asubuhi na mapema
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha maana ya kuamka mapema na kuhifadhi rejeo la wazi la wakati.
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: akawakusanya watu
  rationale: Katika muktadha huu wa kijeshi, kitenzi פקד kinaashiria kuwakusanya na kuwapanga watu tayari kwa hatua, si kuwahesabu tu.
- source_word: הָעָם
  choice: watu
  rationale: Huhifadhi upana wa neno la Kiebrania badala ya kulifinya kuwa “askari” au “jeshi,” ingawa muktadha ni wa kijeshi.
- source_word: וַיַּעַל
  choice: wakapanda
  rationale: Huhifadhi maana ya kawaida ya עלה, ikiwemo uwezekano wa mwendo wa kupanda kulingana na jiografia, bila kuifafanua tu kuwa kusonga kijeshi.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: yeye pamoja na wazee wa Israeli
  rationale: Huhifadhi msisitizo wa kiwakilishi kinachomtaja Yoshua mwenyewe na kuwaweka wazi wazee kama washiriki wa tendo hilo.
- source_word: לִפְנֵי הָעָם
  choice: mbele ya watu
  rationale: Tafsiri ya karibu inayoweza kueleza nafasi yao mbele ya watu bila kuamua kimya kimya kwamba walikuwa makamanda wao.
- source_word: הָעָי
  choice: Ai
  rationale: Jina la mahali limetolewa kwa umbo lake la kawaida bila kuhamisha kibainishi cha Kiebrania katika Kiswahili.
