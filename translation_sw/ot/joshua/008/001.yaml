  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Yoshua, “Usiogope wala usivunjike moyo. Chukua pamoja nawe watu wote wa vita[a]; ondoka, upande Ai. Tazama, nimemkabidhi mkononi mwako mfalme wa Ai, watu wake, mji wake na nchi yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wapiganaji wote” au “jeshi lote.” Kiebrania kinasema kihalisi “watu wote wa vita,” yaani kikosi cha kupigana.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Usiogope wala usivunjike moyo
  rationale: Kauli hii inahifadhi makatazo yote mawili; ‘usivunjike moyo’ huwasilisha hali ya kulegea au kuvunjwa moyo inayodokezwa na חתת kwa Kiswahili cha kawaida.
- source_word: קַח עִמְּךָ
  choice: Wachukue pamoja nawe
  rationale: Kirai עִמְּךָ kimetajwa wazi katika chanzo, hivyo maana ya kwenda pamoja na Yoshua imehifadhiwa.
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: watu wote wa vita
  rationale: Tafsiri hii inakaribia muundo halisi wa Kiebrania na katika muktadha inaeleweka kuwa kikosi cha wapiganaji, si wakazi wote.
- source_word: וְקוּם עֲלֵה
  choice: ondoka, upande kwenda
  rationale: Vitenzi viwili vya kuamuru vimehifadhiwa. ‘Ondoka’ ni Kiswahili cha asili kwa wito wa kuanza safari, na ‘upande kwenda’ huhifadhi wazo la kuelekea juu Ai.
- source_word: רְאֵה
  choice: Tazama
  rationale: Neno hili linaanzisha uhakikisho wa Mungu na kuhifadhi nguvu ya amri bila kutumia lugha ngumu.
- source_word: נָתַתִּי בְיָדְךָ
  choice: nimemkabidhi mkononi mwako
  rationale: Kauli ya wakati timilifu inaonyesha ushindi uliohakikishwa kana kwamba tayari umetolewa; taswira ya ‘mkono’ imehifadhiwa.
- source_word: הָעָי
  choice: Ai
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la Kiswahili linalotambulika la jina la Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, kwa hiyo tafsiri inalihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya wakati timilifu katika נָתַתִּי
  choice: nimemkabidhi
  alternative: nitamkabidhi au ninamkabidhi
  rationale: Wakati timilifu katika ahadi hii ya Mungu unasisitiza uhakika wa ushindi, bila kubadili waziwazi kauli kuwa wakati ujao.
- issue: Upeo wa כָּל עַם הַמִּלְחָמָה
  choice: watu wote wa vita
  alternative: jeshi lote au wapiganaji wote
  rationale: Chaguo hili linahifadhi namna ya usemi wa chanzo na maana yake ya kijeshi bila kudai kwamba linawahusu wakazi wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima lakini unaoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
