  source_fidelity: Maana kuu imehifadhiwa, ikiwemo makatazo mawili, kuchukua kikosi cha vita, amri mbili za kusafiri, na uhakikisho wa ushindi. Hata hivyo, 'Wachukue' si umbo sahihi la amri kwa 'chukua ... pamoja nawe'; linapaswa kuwa 'Chukua'. Pia 'pamoja na' kabla ya orodha ya mfalme, watu, mji, na nchi huongeza kiunganishi kisichopo katika muundo wa Kiebrania, ingawa hakibadili maana kwa kiasi kikubwa.
  naturalness: Kiswahili kwa ujumla ni cha asili na cha kisasa. 'Chukua pamoja nawe watu wote wa vita' ni sahihi na wazi zaidi kuliko 'Wachukue pamoja nawe'. 'Ondoka, upande kwenda Ai' huhifadhi vitenzi viwili, lakini 'ondoka, uende juu mpaka Ai' si ya kawaida; 'ondoka, upande Ai' ni ya asili na inahifadhi wazo la kupanda/kwenda juu. 'Usivunjike moyo' ni usemi wa kawaida unaofaa kwa kutokata tamaa/kufadhaika.
