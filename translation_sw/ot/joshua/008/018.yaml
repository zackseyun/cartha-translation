base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: sw
  text: Ndipo Yahwe akamwambia Yoshua, “Nyosha mkuki wa kurusha[a] ulio mkononi mwako kuelekea Ai, kwa maana nitautia mji huo mkononi mwako.” Basi Yoshua akaunyosha mkuki wa kurusha uliokuwa mkononi mwake kuelekea mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuki.” Neno la Kiebrania כִּידוֹן linaweza kumaanisha mkuki wa kurusha, mkuki, au mkuki mrefu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatumiwa jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo; tahajia ‘Yahwe’ ni ya kawaida na ya asili katika Kiswahili.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: Nyosha / akaunyosha
  rationale: Kitenzi hiki kinaonyesha kunyoosha au kuelekeza kitu. ‘Nyosha’ linadumisha ishara ya kimwili na ulinganifu kati ya amri na utekelezaji wake.
- source_word: כִּידוֹן
  choice: mkuki wa kurusha
  rationale: Neno hili hutaja silaha inayoweza kueleweka kuwa mkuki, mkuki wa kurusha, au mkuki mrefu. ‘Mkuki wa kurusha’ linatoa maana mahsusi inayowezekana, huku tanbihi ikihifadhi tafsiri mbadala.
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: ulio mkononi mwako / uliokuwa mkononi mwake
  rationale: Vishazi hivi vinahifadhi kishazi tegemezi cha Kiebrania na kubadili wakati kwa njia ya kawaida kati ya usemi wa moja kwa moja na simulizi.
- source_word: אֶל הָעַי / אֶל הָעִיר
  choice: kuelekea Ai / kuelekea mji
  rationale: ‘Kuelekea’ linaonyesha upande wa ishara bila kudokeza kuwa Yoshua aliingia mjini; tofauti kati ya jina ‘Ai’ na ‘mji’ imehifadhiwa.
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: kwa maana nitautia mkononi mwako
  rationale: Usemi wa Kiebrania wa kutia kitu mkononi mwa mtu unaonyesha kukiweka chini ya mamlaka yake. Taswira hiyo imehifadhiwa bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu YHWH
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja tetragramatoni יְהוָה. ‘Yahwe’ linahifadhi jina la agano badala ya kulibadilisha kuwa cheo, huku ‘Yehova’ likiwa umbo jingine la kimapokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ‘Ndipo… Basi…’ ni wazi kwa msomaji wa kawaida, na nahau ya ‘kutia mkononi’ imehifadhiwa kwa sababu inaeleweka katika muktadha kuwa ni kukabidhi chini ya mamlaka.
