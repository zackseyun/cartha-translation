  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: sw
  text: Ndipo Yoshua akamjengea Yahwe[a], Mungu wa Israeli, madhabahu juu ya Mlima Ebali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina la Mungu ambalo hapa limetafsiriwa “Yahwe.”'
    reason: Hufafanua kwamba “Yahwe” linawakilisha jina la Mungu יהוה katika maandishi ya Kiebrania.
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Inaonyesha tukio linalofuata katika simulizi; “Ndipo” ni ya kawaida na huhifadhi mtiririko wa masimulizi.
- source_word: יִבְנֶה
  choice: akamjengea
  rationale: Ingawa kimaumbo ni hali isiyotimilika, baada ya אָז katika simulizi inaeleza tendo lililotokea. Kiambishi cha kutendea -e- kinaonyesha kwa kawaida kwamba madhabahu ilijengwa kwa ajili ya Yahwe.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hili la mtu.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Neno linamaanisha mahali pa kutolea dhabihu; “madhabahu” ni istilahi ya kawaida na inayoeleweka katika Kiswahili.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Herufi ל inaonyesha anayejengewa au anayewekewa wakfu madhabahu. Muundo “akamjengea Yahwe ... madhabahu” unawasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huhifadhi utambulisho wa Yahwe kama Mungu wa Israeli na apposition ya maandishi ya Kiebrania.
- source_word: בְּהַר עֵיבָל
  choice: juu ya Mlima Ebali
  rationale: Kirai kinaonyesha mahali kwenye mlima uitwao Ebali; “juu ya Mlima Ebali” ni usemi wa asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה. “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo, huku tanbihi ikifafanua msingi wake wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa “akamjengea ... madhabahu” ni wa kawaida na huhifadhi maana ya kujenga madhabahu kwa ajili ya Yahwe.
