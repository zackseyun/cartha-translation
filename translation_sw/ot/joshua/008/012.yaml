  register: Kiswahili sanifu cha Afrika Mashariki, katika mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. ‘Wapatao’ huhifadhi ukadiriaji wa Kiebrania, na ‘wavizie’ huwasilisha kwa kawaida mpango wa kijeshi.
