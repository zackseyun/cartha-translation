  yaml_path: translation/ot/joshua/008/012.yaml
  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: sw
  text: Akachukua wanaume wapatao elfu tano[a] akawaweka wavizie kati ya Betheli na Ai, upande wa magharibi wa mji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “wapatao wanaume elfu tano”; kiambishi כ־ kwenye neno “tano” huenda kinaonyesha makadirio badala ya idadi kamili.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “kutoka baharini kuelekea mji”; katika matumizi haya, “bahari” hutumiwa kwa maana ya upande wa magharibi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Akachukua
  rationale: Kitenzi לקח katika mtiririko wa simulizi humaanisha kwa msingi ‘alichukua’; hapa kinaweza kudokeza kuwateua kutoka katika jeshi kubwa zaidi bila kulazimisha maana hiyo katika tafsiri.
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: wanaume wapatao elfu tano
  rationale: Kiambishi כ־ kwenye idadi huonyesha makadirio, nayo אִישׁ imetumiwa kwa maana ya pamoja ya wanaume.
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: na kuwaweka wavizie
  rationale: שׂים ni ‘kuweka,’ na אֹרֵב hapa huonyesha kikosi kilichowekwa kuvizia. Kiswahili ‘kuwaweka wavizie’ ni cha kawaida na huhifadhi kazi ya kikosi hicho.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: kati ya Betheli na Ai
  rationale: Ni usemi wa moja kwa moja wa mahali; majina yamenukuliwa kwa maumbo yanayotambulika katika Kiswahili.
- source_word: מִיָּם לָעִיר
  choice: upande wa magharibi wa mji
  rationale: יָם, kwa kawaida ‘bahari,’ hutumiwa hapa kama istilahi ya mwelekeo ikimaanisha magharibi.
