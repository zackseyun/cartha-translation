  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: sw
  text: Naye akamtundika mfalme wa Ai juu ya mti[a] mpaka jioni. Wakati wa machweo[b], Yoshua aliamuru, nao wakaishusha maiti yake kutoka juu ya mti, wakaitupa kwenye mwingilio wa lango la jiji. Kisha wakarundika juu yake rundo kubwa la mawe, ambalo lipo hadi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamning’iniza”; kitenzi cha Kiebrania humaanisha kutundika au kuning’iniza.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “jua lilipoingia,” yaani, “jua lilipotua.”
    reason: idiom_clarification
lexical_decisions:
- source_word: תָּלָה
  choice: akamtundika
  rationale: Kitenzi cha Kiebrania humaanisha kutundika au kuning’iniza bila kubainisha kwa usahihi namna ya kuuawa; “akamtundika” huhifadhi upana huo.
- source_word: הָעֵץ
  choice: juu ya mti
  rationale: עֵץ kwa kawaida ni “mti” au “mbao.” “Mti” ndilo chaguo la moja kwa moja na haliongezi wazo maalumu la mti wa kutundikia au kuchomekea.
- source_word: עַד עֵת הָעָרֶב
  choice: mpaka jioni
  rationale: Hutoa maana ya wakati wa jioni kwa Kiswahili cha kawaida bila uzito usio wa lazima.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: wakati wa machweo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoeleza wakati jua linapotua.
- source_word: נִבְלָתוֹ
  choice: maiti yake
  rationale: “Maiti” hutaja mwili wa mtu aliyekufa na kuhifadhi ukali wa נְבֵלָה kwa lugha yenye heshima na inayoeleweka.
- source_word: וַיַּשְׁלִיכוּ אֹתָהּ
  choice: wakaitupa
  rationale: Kiambishi cha yambwa kinarejelea “maiti”; “kutupa” huwasilisha tendo hilo moja kwa moja na kwa lugha ya sasa.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: kwenye mwingilio wa lango la jiji
  rationale: Huhifadhi vipengele vyote viwili vya neno la mwingilio na lango huku ikisomeka kwa kawaida.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: rundo kubwa la mawe
  rationale: Ni tafsiri wazi na ya kawaida ya rundo au kilima kikubwa cha mawe.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: lipo hadi leo
  rationale: Hueleza wazi kuwa rundo hilo liliendelea kuwapo hadi wakati wa msimulizi.
theological_decisions:
- issue: Mtendaji wa tendo katika kishazi cha kwanza
  choice: “akamtundika,” Yoshua akiwa ndiye mtendaji anayedokezwa
  alternative: “wakamtundika,” tendo likihusishwa na kundi
  rationale: Kitenzi cha Kiebrania kiko katika nafsi ya tatu, umoja wa kiume, bila kutaja mtendaji waziwazi. Muktadha na kutajwa kwa Yoshua katika kishazi kinachofuata hufanya Yoshua awe mtendaji anayeelekea zaidi, lakini sentensi haimtaji kwa jina katika kishazi cha kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umefanywa uwe wa kawaida kwa wasomaji wengi, huku ukali wa tukio na kutobainishwa kwa namna hasa ya kutundika vikihifadhiwa.
