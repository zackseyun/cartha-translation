id: JOS.8.24
reference: Joshua 8:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: sw
  text: Ikawa watu wa Israeli walipomaliza kuwaua wakazi wote wa Ai waliokuwa uwandani, katika nyika ambako walikuwa wamewafuatilia, nao wote walikuwa wameanguka kwa makali ya upanga hadi walipomalizwa kabisa[a], watu wote wa Israeli wakarudi Ai na kulipiga kwa makali ya upanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi walipokwisha kabisa” au “hadi walipofikia mwisho wao.”
    reason: Mbadala hizi zinahifadhi kwa namna tofauti wazo la kukamilika au kufikia mwisho lililomo katika עַד תֻּמָּם.
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kiunganishi cha kawaida cha masimulizi kinachoanzisha hatua mpya bila kutumia lugha ya kizamani isiyo ya lazima.
- source_word: כְכַלּוֹת יִשְׂרָאֵל לַהֲרֹג
  choice: watu wa Israeli walipomaliza kuwaua
  rationale: Muundo wenye כ na kitenzi-jina cha כלה unaonyesha wakati na kukamilika kwa tendo; הרג ni kuua, si kushinda tu.
- source_word: יֹשְׁבֵי הָעַי
  choice: wakazi wa Ai
  rationale: Kitenzi-partisipio cha ישב kimetumika kama nomino kwa watu waliokaa katika mji huo.
- source_word: בַשָּׂדֶה בַמִּדְבָּר
  choice: uwandani, katika nyika
  rationale: “Uwandani” huonyesha eneo lililo nje ya mji, na “nyika” huwasilisha ardhi isiyolimwa bila kudokeza lazima jangwa la mchanga.
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: ambako walikuwa wamewafuatilia
  rationale: Kiwakilishi cha mahali kinaelekeza kwenye eneo ambako ufuatiliaji ulitokea, na wakati uliotangulia unahifadhi mfuatano wa simulizi.
- source_word: וַיִּפְּלוּ כֻלָּם לְפִי חֶרֶב
  choice: nao wote walikuwa wameanguka kwa makali ya upanga
  rationale: Katika muktadha wa vita, נפל humaanisha kuanguka na kufa; “makali ya upanga” ni Kiswahili cha asili kinachohifadhi picha ya nahau ya Kiebrania.
- source_word: עַד תֻּמָּם
  choice: hadi walipomalizwa kabisa
  rationale: Usemi unasisitiza kukamilishwa kwa maangamizi ya kundi lote huku ukihifadhi wazo la mzizi la kufikia mwisho.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: watu wote wa Israeli wakarudi Ai
  rationale: שוב pamoja na mahali pa kuelekea humaanisha kurudi; “watu wote wa Israeli” ni wazi na ya kawaida kuliko kutumia jina hilo kana kwamba ni mtu mmoja.
- source_word: וַיַּכּוּ אֹתָהּ לְפִי חָרֶב
  choice: na kulipiga kwa makali ya upanga
  rationale: Kiwakilishi cha kike kinarejelea jiji la Ai; tafsiri inahifadhi jiji kama yambwa badala ya kuongeza wazi “watu waliokuwa humo,” jambo ambalo halijasemwa katika kishazi hiki.
theological_decisions:
- issue: Kuwasilisha simulizi la mauaji ya kivita bila kulainisha au kuongeza maana ya kitheolojia
  choice: Kutumia maneno ya wazi “kuwaua,” “walikuwa wameanguka,” na “walipomalizwa kabisa”
  alternative: Kutumia maneno laini kama “kuwashinda,” au kuongeza kwamba tendo hilo lilikuwa hukumu iliyoidhinishwa na Mungu
  rationale: Aya yenyewe inaeleza mauaji kamili kwa lugha kali, lakini katika aya hii haitoi maelezo ya kitheolojia kuhusu tendo hilo. Tafsiri inadumisha ukali bila kuongeza fundisho lisilosemwa hapa.
- issue: Upeo wa עַד תֻּמָּם
  choice: Kueleza kukamilika kwa kuangamizwa kwa kundi lililofuatiliwa
  alternative: Kutafsiri kwa ujumla kuwa “hadi walipofikia mwisho wao”
  rationale: Muktadha wa kuanguka kwa upanga unaunga mkono maana ya kumalizwa kabisa, huku tanbihi ikihifadhi uwezekano wa usemi wa karibu zaidi na wazo la kufikia mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha masimulizi yenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. “Nyika” na “makali ya upanga” hudumisha hadhi ya kifasihi bila kuwa vya kizamani kupita kiasi.
