base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: sw
  text: Hakubaki mtu hata mmoja[b] katika Ai wala Betheli ambaye hakutoka kuwafuata Waisraeli. Waliuacha mji wazi[a], wakawafuata Waisraeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kueleza maana yake: “waliuacha mji bila ulinzi.” Kiebrania kinasema kihalisi, “mji wazi.”'
    reason: lexical_alternative
  - marker: b
    text: “Mtu hata mmoja” hutafsiri neno la Kiebrania אִישׁ, ambalo lina umbo la kiume la umoja lakini hapa limetumiwa kwa maana ya jumla kuhusu mtu yeyote aliyebaki nyuma.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: Hakubaki mtu hata mmoja
  rationale: Huwasilisha kwa Kiswahili cha kawaida kitenzi cha kutendwa chenye maana ya ‘kubaki’ pamoja na אִישׁ ya umoja; ‘mtu hata mmoja’ huhifadhi mkazo wa kwamba hakuna aliyebaki bila kudokeza kwamba walikuwa wanaume pekee.
- source_word: בָּעַי וּבֵית אֵל
  choice: katika Ai wala Betheli
  rationale: Baada ya kauli kanushi, ‘wala’ huonyesha kwa kawaida kwamba hakuna mtu aliyebaki katika sehemu yoyote kati ya hizo mbili. Majina ya mahali yametoholewa kwa matumizi ya Kiswahili.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: ambaye hakutoka kuwafuata Waisraeli
  rationale: Huhifadhi muundo wa kishazi tegemezi na maana ya mwendo wa kijeshi ya ‘kutoka ... kuwafuata’; ‘Waisraeli’ ni ya asili zaidi hapa kuliko jina dhahania ‘Israeli’ linapotaja kundi linalofuatwa.
- source_word: וַיַּעַזְבוּ
  choice: Waliuacha
  rationale: ‘Kuacha’ ni tafsiri ya moja kwa moja na ya kawaida ya עזב katika simulizi hili, huku kivumishi kinachofuata kikibeba wazo la hatari ya kimkakati.
- source_word: הָעִיר פְּתוּחָה
  choice: mji wazi
  rationale: Huhifadhi picha halisi ya Kiebrania ‘mji ukiwa wazi’ badala ya kufafanua moja kwa moja kuwa haukulindwa.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: wakaendelea kuwafuatilia Waisraeli
  rationale: ‘Kuwafuatilia’ hutoa maana ya רדף katika mazingira ya kijeshi; ‘wakaendelea’ huunganisha tendo hili kwa kawaida na kutoka kwao tayari nyuma ya Israeli bila kubadili mlolongo wa simulizi.
