base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: sw
  text: Yoshua hakurudisha nyuma mkono wake ambao alikuwa ameunyosha akiwa ameshika mkuki, mpaka alipowaangamiza kabisa wakazi wote wa Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwaweka wakazi wote wa Ai chini ya marufuku kwa ajili ya kuangamizwa.” Kiebrania kinatumia kitenzi kinachomaanisha kuweka watu au vitu chini ya marufuku, yaani kutenga kwa ajili ya kuangamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: hakurudisha nyuma
  rationale: Hifili ya שׁוב hapa ina maana ya kuurudisha au kuuondoa mkono. Katika muktadha wa vita, “hakurudisha nyuma” huonyesha kwa kawaida kwamba Yoshua aliendelea kuunyosha mkono wake.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Hili ni rejeo halisi la kiungo cha mwili, na tafsiri ya moja kwa moja ni ya asili katika Kiswahili.
- source_word: נָטָה
  choice: aliokuwa ameunyosha
  rationale: Kitenzi kina maana ya kunyoosha. Muundo huu unaonyesha kwamba mkono ulikuwa tayari umenyooshwa na uliendelea kuwa hivyo.
- source_word: בַּכִּידוֹן
  choice: akiwa ameshika mkuki
  rationale: כידון ni silaha ya aina ya mkuki. Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba mkuki ulikuwa mkononi ulionyoshwa, bila kudai kwa uhakika zaidi aina mahususi ya silaha kuliko ushahidi unavyoruhusu.
- source_word: הֶחֱרִים
  choice: amewaangamiza kabisa
  rationale: Katika muktadha huu, hifili ya חרם inaonyesha kuangamiza chini ya marufuku maalumu. Tafsiri hii ni wazi na ya kawaida kwa msomaji, huku tanbihi ikihifadhi maana ya kiufundi ya neno la Kiebrania.
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: wakazi wote wa Ai
  rationale: יֹשְׁבֵי ni watu wanaokaa mahali fulani; “wakazi wote” ni tafsiri sahihi, ya kawaida, na yenye hadhi.
- source_word: וִיהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili. Kiunganishi cha Kiebrania hakijahitaji kutafsiriwa kwa “na” kwa kuwa mstari huu unasomeka kwa kawaida kama sentensi inayojitegemea katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya חרם katika muktadha wa hukumu ya kivita
  choice: amewaangamiza kabisa, pamoja na tanbihi kuhusu kuwekwa chini ya marufuku
  alternative: amewatenga kwa ajili ya kuangamizwa; amewaweka chini ya marufuku
  rationale: “Amewaangamiza kabisa” huwasilisha kitendo kilichotekelezwa kwa lugha ya kawaida. Tanbihi inaonyesha kwamba kitenzi cha Kiebrania si neno la kawaida tu la kuua au kuharibu, bali linahusiana na kuweka watu au vitu chini ya marufuku na hivyo kuvitenga kwa maangamizi. Hii huhifadhi uzito wa kisheria na kitheolojia bila kufanya mstari mkuu kuwa mgumu au kudokeza kwamba watu walitengwa tu lakini hawakuangamizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akiwa ameshika mkuki” ni ya kawaida kuliko tafsiri ngumu ya neno kwa neno ya kihusishi cha Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi kinachotafsiri הֶחֱרִים, kwa sababu tanbihi inaeleza kitenzi hicho.
