base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: sw
  text: Yoshua akawatuma, nao wakaenda mahali pa kuvizia[a] na wakakaa kati ya Betheli na Ai, upande wa magharibi wa Ai. Yoshua akakaa usiku ule miongoni mwa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kikosi cha waviziaji.” Neno la Kiebrania linaweza kumaanisha kikosi kinachovizia au mahali pa kuvizia; hapa muktadha unaelekea zaidi kumaanisha mahali walipokaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: akawatuma
  rationale: Kitenzi שלח pamoja na kiambishi cha yambwa wa wingi kinamaanisha kwa kawaida kwamba Yoshua aliwatuma; tafsiri hii ni ya moja kwa moja na ya asili katika Kiswahili.
- source_word: הַמַּאְרָב
  choice: mahali pa kuvizia[a]
  rationale: Nomino hii inaweza kutaja kikosi kinachovizia au mahali kilipojificha. Katika muktadha wa watu kwenda na kukaa katika eneo fulani, maana ya mahali pa kuvizia inafaa zaidi, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: וַיֵּשְׁבוּ
  choice: wakakaa
  rationale: ישב inaweza kumaanisha kuketi, kukaa, au kubaki. Hapa 'wakakaa' inadumisha maana yake ya msingi bila kuongeza waziwazi wazo la kijeshi la kujiweka katika nafasi.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: kati ya Betheli na Ai
  rationale: Hii ni taarifa ya moja kwa moja ya kijiografia; majina ya mahali yametoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מִיָּם לָעָי
  choice: upande wa magharibi wa Ai
  rationale: Ingawa יָם humaanisha kihalisi 'bahari,' katika usemi wa kijiografia wa Kiebrania humaanisha upande wa magharibi.
- source_word: וַיָּלֶן
  choice: akalala
  rationale: Katika muktadha huu לון humaanisha kukaa au kulala usiku mahali fulani. 'Akalala' ni ya asili na inaeleweka, huku kirai kinachofuata 'usiku ule' kikitoa maana kamili.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku ule
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kirai cha wakati.
- source_word: בְּתוֹךְ הָעָם
  choice: katikati ya watu
  rationale: בְּתוֹךְ hueleza kuwa ndani au miongoni mwa kundi; 'katikati ya watu' inahifadhi picha ya kuwa miongoni mwao kwa lugha ya kawaida yenye hadhi.
