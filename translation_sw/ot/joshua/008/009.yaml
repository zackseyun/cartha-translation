  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na wenye hadhi. Kiunganishi cha mwanzo kimetafsiriwa 'Basi' ili kuendeleza simulizi, na sentensi ya mwisho haijawekewa kiunganishi cha kuonyesha tofauti kwa kuwa Kiebrania kina kiunganishi cha kawaida tu.
