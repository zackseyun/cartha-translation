id: JOS.8.13
reference: Joshua 8:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּשִׂ֨ימוּ הָ/עָ֜ם אֶת כָּל הַֽ/מַּחֲנֶ֗ה אֲשֶׁר֙ מִ/צְּפ֣וֹן לָ/עִ֔יר וְ/אֶת עֲקֵב֖/וֹ מִ/יָּ֣ם לָ/עִ֑יר וַ/יֵּ֧לֶךְ יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: sw
  text: Basi watu wakaweka kambi yote upande wa kaskazini wa mji, huku sehemu yake ya nyuma[a] ikiwa upande wa magharibi[b] wa mji. Usiku huo Yoshua akaenda katikati ya bonde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikosi chake cha nyuma.”
    reason: alternative_reading
  - marker: b
    text: Kiebrania kihalisi, “upande wa bahari wa mji”; hapa “bahari” ni neno la mwelekeo linalomaanisha “magharibi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: wakaweka
  rationale: Kitenzi שׂים kina maana pana ya ‘kuweka.’ Katika muktadha huu wa kijeshi, ‘wakaweka’ linaonyesha upangaji wa kambi bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: הָעָם
  choice: watu
  rationale: Neno la Kiebrania linasema kihalisi ‘watu.’ Ingawa hapa linawahusu walio katika jeshi, tafsiri hii inadumisha usemi mpana wa matini.
- source_word: כָּל הַמַּחֲנֶה
  choice: kambi yote
  rationale: 'מַחֲנֶה kwa kawaida ni ‘kambi,’ na כָּל inaonyesha ukamilifu wake: ‘kambi yote.’'
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: upande wa kaskazini wa mji
  rationale: Usemi huu unaonyesha mahali kambi ilipowekwa; Kiswahili hiki ni cha kawaida na wazi.
- source_word: עֲקֵבוֹ
  choice: sehemu yake ya nyuma
  rationale: עָקֵב kimsingi huhusiana na ‘kisigino,’ na kwa upanuzi humaanisha sehemu ya nyuma. ‘Sehemu yake ya nyuma’ inadumisha maana hiyo bila kuamua kwamba lazima iwe kikosi maalumu cha nyuma.
- source_word: מִיָּם לָעִיר
  choice: upande wa magharibi wa mji
  rationale: יָם humaanisha ‘bahari,’ lakini katika maelekezo ya kijiografia ya Kiebrania mara nyingi humaanisha ‘magharibi.’ Maana ya mwelekeo inafaa katika matini kuu.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: הלך ni kitenzi cha kawaida cha kwenda au kutembea; ‘akaenda’ kinafaa kwa mwendo unaoelezwa hapa.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku huo
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya usemi huo katika Kiswahili.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: katikati ya bonde
  rationale: בְּתוֹךְ huonyesha kuwa ndani au katikati; pamoja na kitenzi cha mwendo, usemi huu unaeleza Yoshua akielekea katikati ya bonde.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. ‘Watu’ na ‘kambi yote’ vinadumisha maneno mapana ya Kiebrania, huku tanbihi zikihifadhi uwezekano wa maana ya kijeshi katika עֲקֵבוֹ na taswira halisi ya ‘bahari’ katika מִיָּם.
