  yaml_path: translation/ot/joshua/021/009.yaml
  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: sw
  text: 'Kutoka katika kabila la wana wa Yuda na kutoka katika kabila la wana wa Simeoni, walitoa miji hii[a], ambayo majina yake yametajwa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ambayo imetajwa kwa majina” au “ambayo majina yake yameainishwa.” Usemi wa Kiebrania unaonyesha kwamba miji hiyo inatajwa mmoja mmoja kwa majina katika orodha inayofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: walitoa
  rationale: Kitenzi נתן kimsingi humaanisha ‘kutoa’; katika muktadha huu ni kutoa miji iwe sehemu ya mgao wa Walawi.
- source_word: מִמַּטֵּה
  choice: kutoka katika kabila la
  rationale: Ingawa מַטֶּה pia huweza kumaanisha fimbo, katika muktadha wa ugawaji wa nchi humaanisha kabila.
- source_word: בְּנֵי יְהוּדָה
  choice: wana wa Yuda
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania na pia ni namna ya kawaida ya kulitaja kundi la kikabila.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: na katika kabila la wana wa Simeoni
  rationale: Huhifadhi usambamba wa kirai kilichotangulia na maana ya kikabila ya מַטֶּה.
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: miji hii
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino עָרִים pamoja na kiashiria הָאֵלֶּה.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: ambayo majina yake yametajwa
  rationale: Usemi huu wa Kiebrania unaonyesha kwamba miji hiyo inatajwa mmoja mmoja kwa majina katika orodha inayofuata; Kiswahili hiki ni cha kawaida na hakilazimishi maana ya kupewa majina mapya.
