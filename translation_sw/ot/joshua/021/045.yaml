base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: sw
  text: Hakuna hata neno moja miongoni mwa maneno yote mema aliyokuwa ameyanena Yahwe kwa nyumba ya Israeli[a] lililoshindwa kutimia; yote yalitokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakuna hata ahadi moja miongoni mwa ahadi zote njema alizokuwa ameiahidi Yahwe nyumba ya Israeli iliyoshindwa kutimia.”
    reason: Muktadha unaruhusu דָּבָר kueleweka kama ‘ahadi,’ ingawa maana yake ya msingi hapa ni ‘neno’ au ‘jambo lililosemwa.’
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: Hakuna hata neno moja ... lililokosa kutimia
  rationale: Muundo huu unaonyesha wazi kwamba hakuna lolote katika yale yaliyosemwa lililoshindwa kutekelezeka. Kitenzi נָפַל ni ‘kuanguka’ kihalisi, lakini hapa ni nahau yenye maana ya kukosa kutimia.
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: kati ya maneno yote mema
  rationale: Kiebrania kina usemi wa umoja wenye maana ya ujumla, ‘neno lote jema.’ Wingi wa Kiswahili ni wa kawaida zaidi na bado unahifadhi wazo la jumla ya yote mema aliyoyasema Yahwe.
- source_word: דָּבָר
  choice: neno
  rationale: ‘Neno’ linadumisha uhusiano wa kimsamiati na דִּבֶּר, ‘alisema/alinena,’ bila kuingiza moja kwa moja tafsiri fafanuzi ya ‘ahadi.’
- source_word: אֲשֶׁר דִּבֶּר
  choice: ambayo ... alikuwa ameinenea
  rationale: Wakati uliopita ‘alikuwa ameinenea’ unaonyesha kwamba usemi wa Yahwe ulitangulia kutimia kwake. ‘Kuinenea nyumba ya Israeli’ ni lugha ya heshima na inahifadhi mkazo wa tendo la kusema.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina maalumu badala ya kubadilishwa kuwa cheo kama ‘BWANA.’ ‘Yahwe’ ni umbo linalofaa katika tahajia ya Kiswahili.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: nyumba ya Israeli
  rationale: Tafsiri hii inadumisha usemi rasmi wa pamoja wa Kiebrania badala ya kuufupisha kuwa ‘Israeli’ au kuufafanua kuwa ‘watu wa Israeli.’
- source_word: הַכֹּל בָּא
  choice: yote yalitimia
  rationale: Ingawa בָּא ni ‘yalikuja’ kihalisi, katika muktadha huu usemi huo unamaanisha kwamba yote yaliyosemwa yalitokea kama yalivyosemwa. ‘Yalitimia’ ni Kiswahili cha sasa na cha wazi.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulihifadhi kama ‘Yahwe’ kunatofautisha jina hilo na cheo na hakufichi jina lililo katika chanzo.
- issue: Iwapo דָּבָר itafsiriwe ‘neno’ au ‘ahadi’
  choice: neno
  alternative: ahadi
  rationale: ‘Neno’ linahifadhi uhusiano na kitenzi ‘alinena’ na halitatui kimya kimya maana pana ya דָּבָר. Katika muktadha, ‘ahadi’ ni ufafanuzi halali, kwa hiyo umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha msisitizo wa jumla wa Kiebrania kwa ‘hakuna hata ... moja’ na ‘yote,’ huku ikitumia wingi wa kawaida wa Kiswahili badala ya usemi mgumu wa umoja-jumla.
