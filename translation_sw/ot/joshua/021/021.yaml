  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עִ֨יר מִקְלַ֧ט הָ/רֹצֵ֛חַ אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: sw
  text: Wakawapa Shekemu pamoja na maeneo yake ya malisho katika eneo la vilima la Efraimu[a], mji wa makimbilio kwa ajili ya mtu aliyeua[b], na Gezeri pamoja na maeneo yake ya malisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mlima wa Efraimu”; yaani, eneo la vilima la Efraimu.'
    reason: lexical_alternative
  - marker: b
    text: Au kwa tafsiri ya karibu zaidi, “mji wa makimbilio wa mtu aliyeua.” Neno la kisheria la Kiebrania hapa humaanisha mtu aliyesababisha kifo na ambaye angeweza kukimbilia hifadhi akisubiri hukumu; si lazima liwe na maana ya mtu aliyepatikana na hatia ya kuua kwa kukusudia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: Wakawapa
  rationale: Kitenzi cha masimulizi וַיִּתְּנוּ pamoja na kiwakilishi cha mtendewa לָהֶם kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaomaanisha ‘nao wakawapa.’
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: mji wa makimbilio kwa ajili ya mtu aliyeua
  rationale: ‘Mji wa makimbilio’ huwasilisha kazi ya kisheria ya mahali pa kukimbilia, na ‘mtu aliyeua’ haimhukumu mhusika kuwa muuaji wa kukusudia kabla ya hukumu.
- source_word: שְׁכֶם
  choice: Shekemu
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno hilo linamaanisha ardhi ya wazi iliyoambatana na mji, hasa kwa matumizi kama malisho.
- source_word: בְּהַר אֶפְרָיִם
  choice: katika eneo la vilima la Efraimu
  rationale: Katika jina hili la kijiografia, הַר hurejelea ukanda wa vilima wa Efraimu, si lazima mlima mmoja.
- source_word: גֶּזֶר
  choice: Gezeri
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali Gezer.
theological_decisions:
- issue: Hadhi ya kisheria na kimaadili ya הָרֹצֵחַ
  choice: mtu aliyeua
  alternative: muuaji
  rationale: Muktadha wa sheria za miji ya makimbilio unahusisha mtu aliyesababisha kifo ambaye shauri lake bado linapaswa kuamuliwa; tafsiri haipaswi kudokeza moja kwa moja kwamba ameua kwa kukusudia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya heshima na inayoeleweka kwa urahisi. Mpangilio wa sentensi umeweka kirai kinachoeleza kazi ya Shekemu baada ya maelezo ya mahali, huku maana ya Kiebrania ikihifadhiwa. Alama za tanbihi zimepangiliwa kulingana na maneno yanayofafanuliwa.
