base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: sw
  text: 'Na kutoka nusu ya kabila la Manase: Taanaki pamoja na maeneo yake ya malisho[a], na Gath-rimoni pamoja na maeneo yake ya malisho—miji miwili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za Kiebrania na kifungu sambamba katika 1 Mambo ya Nyakati 6:70 vinatofautiana kuhusu majina ya miji iliyotolewa kutoka kwa Manase.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה
  choice: Na kutoka katika nusu ya kabila
  rationale: Kirai hiki kinaonyesha chanzo cha mgao. Kiswahili hiki ni cha asili na kinahifadhi maana ya nusu ya kitengo cha kikabila.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la kabila hilo.
- source_word: תַּעְנַךְ
  choice: Taanaki
  rationale: Jina la mahali limetoholewa kwa namna inayoendana na matamshi na tahajia ya Kiswahili.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi ya wazi iliyozunguka mji, hasa kwa malisho; kiambishi cha nafsi ya kike kimetafsiriwa kwa “yake,” kikirejelea kila mji.
- source_word: גַּת רִמּוֹן
  choice: Gath-rimoni
  rationale: Jina ambatani la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likihifadhi utambulisho wake.
- source_word: עָרִים שְׁתָּיִם
  choice: miji miwili
  rationale: Huu ni muhtasari wa idadi ya makazi yaliyotajwa; “miji” ni neno la kawaida katika orodha za mgao wa maeneo.
