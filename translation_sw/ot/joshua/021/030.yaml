lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: na kutoka katika kabila la
  rationale: Katika muktadha wa ugawaji wa maeneo kwa makabila, מַטֶּה humaanisha “kabila”; viambishi vinaonyesha “na kutoka katika.”
- source_word: אָשֵׁר
  choice: Asheri
  rationale: Jina la kabila limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֶת
  choice: —
  rationale: Kiashiria cha yambwa tendwa katika Kiebrania hakina neno linalolingana moja kwa moja katika Kiswahili.
- source_word: מִשְׁאָל
  choice: Mishali
  rationale: Jina la mahali limetoholewa kwa Kiswahili kwa kuzingatia umbo la konsonanti la Kiebrania.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Neno מִגְרָשֶׁיהָ humaanisha ardhi ya wazi iliyohusishwa na mji, hasa kwa malisho na matumizi ya pamoja; “maeneo yake ya malisho” ni wazi na ya kawaida kwa Kiswahili.
- source_word: עַבְדּוֹן
  choice: Abdoni
  rationale: Jina la mahali limetoholewa kwa mtindo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: וְ/אֶת
  choice: na
  rationale: Kiunganishi וְ kimetafsiriwa “na,” huku kiashiria cha yambwa אֶת kikiachwa bila tafsiri ya moja kwa moja.
