  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: wana wa Aroni kuhani wanapokea Hebroni, inayotambuliwa kama mji wa makimbilio kwa mtu aliyeua, pamoja na maeneo yake ya malisho, na Libna pamoja na maeneo yake ya malisho. Kirai “mtu aliyeua” hakiamui mapema kuwa tendo hilo lilikuwa la kukusudia.'
