  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֣ן הַ/כֹּהֵ֗ן נָֽתְנוּ֙ אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת חֶבְר֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: sw
  text: Nao waliwapa wana wa kuhani Aroni Hebroni, mji wa makimbilio kwa ajili ya mtu aliyeua[a], pamoja na maeneo yake ya malisho, na Libna pamoja na maeneo yake ya malisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muuaji.” Neno la Kiebrania hapa ni istilahi ya kisheria kwa mtu aliyesababisha kifo na ambaye angeweza kukimbilia mji wa makimbilio; si lazima limaanishe kwamba aliua kwa kukusudia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: wana wa kuhani Aroni
  rationale: 'Muundo huu unaonyesha ukoo wa Aroni na pia cheo chake. Kiswahili cha kawaida huweka cheo kabla ya jina: ‘kuhani Aroni.’'
- source_word: נָתְנוּ
  choice: waliwapa
  rationale: Kitenzi נתן humaanisha ‘kutoa/kupa’; kiambishi ‘-wa-’ kinawataja wana wa Aroni kama wapokeaji, kulingana na לִבְנֵי.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: mji wa makimbilio kwa ajili ya mtu aliyeua
  rationale: ‘Mji wa makimbilio’ ni usemi wa wazi kwa taasisi hii ya kisheria. ‘Mtu aliyeua’ huhifadhi upana wa רֹצֵחַ katika muktadha huu bila kudokeza moja kwa moja kwamba mauaji yalipangwa.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Hili ndilo umbo la jina la mahali lililozoeleka katika Biblia za Kiswahili.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשֶׁיהָ ni ardhi ya wazi inayohusiana na mji, hasa kwa malisho; ‘maeneo yake ya malisho’ ni ya asili na inaeleweka kwa wasomaji wa sasa.
- source_word: לִבְנָה
  choice: Libna
  rationale: Uhawilishaji wa kawaida wa jina hili la mahali kwa Kiswahili.
theological_decisions:
- issue: Maana ya kisheria ya הָרֹצֵחַ
  choice: mtu aliyeua
  alternative: muuaji
  rationale: ‘Muuaji’ katika matumizi ya kawaida huweza kueleweka kuwa mtu aliyefanya mauaji ya kukusudia. Muktadha wa mji wa makimbilio unahusu mtu aliyesababisha kifo na anayestahili kupata hifadhi wakati shauri lake linachunguzwa; tafsiri haipaswi kuamua kimya kimya kiwango cha hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Mpangilio ‘kuhani Aroni’ ni wa kawaida katika Kiswahili. Kirai ‘maeneo yake ya malisho’ kimetumiwa kwa uwazi na uthabiti.
