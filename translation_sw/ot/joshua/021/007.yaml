base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: sw
  text: Wana wa Merari[a], kulingana na koo zao, walipewa miji kumi na miwili kutoka katika kabila la Reubeni, kabila la Gadi, na kabila la Zabuloni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Kwa wana wa Merari, kulingana na koo zao, kutoka katika kabila la Reubeni, kabila la Gadi, na kabila la Zabuloni: miji kumi na miwili.”'
    reason: Muundo wa Kiebrania hauna kitenzi wazi; unaweza kuhifadhiwa kama kishazi cha mgao, badala ya kuongeza ‘walipewa’ kwa uwazi wa Kiswahili.
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Wana wa Merari
  rationale: Muundo huu unahifadhi lugha ya kifamilia ya Kiebrania. Kiambishi ל־ kinaonyesha mgao; maana hiyo imewasilishwa kwa kitenzi ‘walipewa’ ili sentensi iwe ya asili na wazi katika Kiswahili.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: מִשְׁפָּחָה hapa ni kikundi cha ukoo ndani ya taifa; ‘koo’ ni sahihi zaidi kuliko ‘familia’ katika muktadha wa ugawaji wa kikabila.
- source_word: מִמַּטֵּה
  choice: kutoka katika kabila la
  rationale: Katika muktadha wa mgao wa nchi, מַטֶּה humaanisha kabila, si fimbo.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Tahajia ya jina inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: גָד
  choice: Gadi
  rationale: Tahajia ya jina inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: זְבוּלֻן
  choice: Zabuloni
  rationale: Tahajia ya jina inayotambulika kwa kawaida katika mapokeo ya Biblia za Kiswahili.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: miji kumi na miwili
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya idadi na nomino katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kitenzi ‘walipewa’ kimeongezwa kutokana na muktadha wa mgao ili kuepuka sentensi isiyo kamili kwa Kiswahili; tanbihi huhifadhi muundo mfupi na utata wa kisintaksia wa Kiebrania.
