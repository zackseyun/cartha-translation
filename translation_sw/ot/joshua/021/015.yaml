  text: Holon with its pasturelands[a], and Debir with its pasturelands.
translation:
  language: sw
  text: Holoni na malisho yake[a], na Debiri na malisho yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orodha sambamba katika 1 Mambo ya Nyakati 6:58 inasoma “Hileni” kwa jina la mji huu; hapa Yoshua inasoma “Holoni.”
    reason: cross_reference
lexical_decisions:
- source_word: חֹלֹן
  choice: Holoni
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili; maandishi ya Yoshua hapa yana חֹלֹן (Holoni), ingawa orodha sambamba ina umbo tofauti.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Neno מִגְרָשׁ hurejelea maeneo ya wazi yaliyohusishwa na mji, hasa kwa malisho na matumizi ya pamoja. Kauli hii ni ya asili na wazi katika Kiswahili cha sasa, huku kiambishi cha nafsi ya tatu kike kikirejelea kila mji.
- source_word: דְּבִר
  choice: Debiri
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa, kwa kuwa hapa linatumika kama toponimu katika orodha ya miji.
- source_word: וְאֶת
  choice: na / pamoja na
  rationale: Kiunganishi וְ kimewakilishwa kwa “na”; alama ya yambwa אֶת haitafsiriwi moja kwa moja. Uhusiano wa kila mji na maeneo yake umeelezwa kwa Kiswahili cha asili kwa “pamoja na.”
