  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa orodha umehifadhiwa, na majina ya mahali yametoholewa kwa mfumo wa kawaida wa Kiswahili.
