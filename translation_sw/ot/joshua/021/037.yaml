lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedemothi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kutafsiri maana yake.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Neno מִגְרָשׁ humaanisha ardhi ya wazi iliyohusishwa na mji, hasa kwa matumizi ya pamoja na malisho. Kiambishi cha nafsi ya tatu umoja wa kike kinaelekezwa kwa kila jiji na kuwakilishwa na “yake.”
- source_word: מֵיפָעַת
  choice: Mefaathi
  rationale: Jina la mahali limetoholewa kwa namna inayolingana na sauti za Kiswahili.
- source_word: עָרִים אַרְבַּע
  choice: majiji manne
  rationale: Ni muhtasari wa moja kwa moja wa idadi ya majiji yaliyotajwa, kwa kutumia ngeli na mpangilio wa kawaida wa Kiswahili.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: pamoja na ... na ... pamoja na ...
  rationale: Vihisishi vya yambwa vinavyorudiwa vinaunda orodha; Kiswahili cha asili huonyesha uhusiano wa kila jiji na ardhi yake kwa “pamoja na” badala ya kuiga muundo huo neno kwa neno.
