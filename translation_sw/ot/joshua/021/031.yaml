lexical_decisions:
- source_word: חֶלְקָת
  choice: Helkathi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kutafsiri maana yake.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili linamaanisha ardhi iliyoambatanishwa na mji kwa matumizi, hasa malisho; kiambishi cha nafsi ya tatu umoja wa kike kinarejelea kila jiji.
- source_word: רְחֹב
  choice: Rehobu
  rationale: Jina la mahali limetoholewa kwa muundo wa Kiswahili unaorahisisha matamshi.
- source_word: עָרִים אַרְבַּע
  choice: majiji manne
  rationale: Ni kirai cha jumla kinachotaja idadi ya majiji yaliyoorodheshwa hapa na katika mstari uliotangulia.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: pamoja na ... na ... pamoja na ...
  rationale: Alama za yambwa hazitafsiriwi moja kwa moja; “pamoja na” huonyesha kwa asili kuwa maeneo ya malisho yalikuwa sehemu zilizoambatanishwa na kila jiji.
