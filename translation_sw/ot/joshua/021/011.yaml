base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: sw
  text: Basi wakawapa Kiriath-arba (Arba alikuwa baba wa Anaki)[a], yaani, Hebroni, katika nchi ya vilima ya Yuda, pamoja na malisho yake yaliyoizunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Arba, baba au babu wa ukoo wa Anaki.” Usemi wa Kiebrania unaweza kumaanisha baba mzazi au babu wa ukoo wa zamani zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Basi wakawapa
  rationale: Kitenzi hiki kinaendeleza mfuatano wa simulizi; “Basi” huonyesha maendeleo hayo kwa Kiswahili cha kawaida, huku “wakawapa” kikihifadhi nafsi na wingi wa Kiebrania.
- source_word: לָהֶם
  choice: -wa- (wakawapa)
  rationale: Kiambishi cha yambwa kinawakilisha kiwakilishi cha wingi “wao”; waliopokea wanaeleweka kutokana na muktadha bila kutajwa wazi katika aya.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriath-arba
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa kuwa “mji wa Arba,” kwa kuwa hapa ni jina maalumu la mji.
- source_word: אֲבִי הָעֲנֹוק
  choice: Arba alikuwa baba ya Anaki
  rationale: Kirai cha Kiebrania kinamtambulisha Arba kwa uhusiano wake na Anaki. “Baba” huhifadhi maana ya msingi, huku tanbihi ikionyesha uwezekano wa maana pana ya babu au babu wa kale.
- source_word: הִיא חֶבְרוֹן
  choice: yaani Hebroni
  rationale: Kiwakilishi pamoja na jina la mahali vinafafanua kwamba Kiriath-arba ndio Hebroni; “yaani” ni usemi wa asili na ulio wazi katika Kiswahili.
- source_word: בְּהַר יְהוּדָה
  choice: katika eneo la milima la Yuda
  rationale: Hapa הַר hurejelea ukanda wa nyanda za juu wenye milima, wala si mlima mmoja.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili humaanisha ardhi ya wazi inayouzunguka mji na kutumiwa, hasa, kwa kulishia mifugo.
- source_word: סְבִיבֹתֶיהָ
  choice: yaliyoizunguka
  rationale: Hueleza maeneo ya malisho yaliyokuwa pande zote za mji; muundo huu ni wa kawaida na unaeleweka kwa urahisi.
theological_decisions: []
