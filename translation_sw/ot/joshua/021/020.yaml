base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: sw
  text: Koo za wazao wa Kohathi, yaani Walawi waliosalia miongoni mwa wazao wa Kohathi, zilipewa kwa kura[a] miji kutoka katika kabila la Efraimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “miji ya fungu lao ilikuwa kutoka katika kabila la Efraimu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: Koo za
  rationale: Katika muktadha wa mgawanyo wa kikabila, מִשְׁפָּחוֹת humaanisha vikundi vya ukoo; “koo” ni ya kawaida na sahihi zaidi kuliko “familia” hapa.
- source_word: בְּנֵי קְהָת
  choice: wazao wa Kohathi
  rationale: Usemi wa Kiebrania unaonyesha nasaba pana, si lazima wana wa moja kwa moja; “wazao” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: Walawi waliosalia
  rationale: Hutambulisha wale Wakohathi waliobaki baada ya migawo iliyotangulia, huku ikihifadhi nguvu ya kishirikishi cha Kiebrania.
- source_word: מִבְּנֵי קְהָת
  choice: miongoni mwa wazao wa Kohathi
  rationale: מִן ina maana ya sehemu ya kundi hapa; “miongoni mwa” huonyesha kwamba hawa ni sehemu ya wazao wa Kohathi.
- source_word: עָרֵי גוֹרָלָם
  choice: zilipewa kwa kura miji
  rationale: Muundo umegeuzwa kwa kiasi kuwa kauli tendwa ili uwe wa asili kwa Kiswahili, huku גורל ikitafsiriwa wazi kuwa ugawaji kwa kura.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: kutoka katika kabila la Efraimu
  rationale: מַטֶּה humaanisha “kabila” katika orodha za migawo; מִן inaonyesha kabila ambalo miji ilitolewa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Koo” na “wazao” zimetumiwa kwa muktadha wa nasaba, na kauli imepangwa upya kidogo ili isomeke kwa kawaida bila kupoteza wazo la ugawaji kwa kura.
