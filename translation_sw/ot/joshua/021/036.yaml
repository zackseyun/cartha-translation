  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: sw
  text: 'Na kutoka katika kabila la Reubeni: Beseri na malisho yake[a], na Yahasa na malisho yake[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za Kiebrania na mashahidi wa kale huacha mistari ya Yoshua 21:36–37; miji iliyoorodheshwa hapa inalingana na 1 Mambo ya Nyakati 6:78–79.
