lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: Na kutoka katika kabila la
  rationale: Katika muktadha wa kugawa miji kwa makabila, מִן pamoja na מַטֶּה huonyesha chanzo kutoka katika kabila; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Jina la kabila limetoholewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: אֶת בֶּצֶר
  choice: Bezeri
  rationale: אֶת ni kiashiria cha yambwa tendwa kisichohitaji neno tofauti katika Kiswahili; jina la mahali limetoholewa kama Bezeri.
- source_word: מִגְרָשֶׁהָ
  choice: malisho yake
  rationale: Katika vifungu vya miji ya Walawi, מִגְרָשׁ hurejelea maeneo ya wazi yanayouzunguka mji, hasa kwa ajili ya mifugo. 'Malisho yake' ni usemi mfupi na wa kawaida unaodumisha kiambishi kinachourejelea mji.
- source_word: יַהְצָה
  choice: Yahasa
  rationale: Jina la mahali limetoholewa kwa Kiswahili kama Yahasa; tofauti za uandishi katika mapokeo mengine zimehifadhiwa katika tanbihi.
