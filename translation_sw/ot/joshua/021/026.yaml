base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: sw
  text: Miji yote ilikuwa kumi, pamoja na maeneo yake ya malisho,[a] kwa koo za wana wa Kohathi waliosalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Maeneo ya malisho” ni maeneo ya wazi yaliyohusishwa na miji hiyo, hasa kwa ajili ya kulishia mifugo na matumizi yanayohusiana nayo.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: Jumla ya miji ilikuwa kumi
  rationale: Huu ni muhtasari unaohitimisha orodha. Tafsiri hii inaonyesha maana ya jumla ya miji na inadumisha mtindo wa kuhesabu wa Kiebrania huku ikiwa ya kawaida katika Kiswahili.
- source_word: מִגְרְשֵׁיהֶן
  choice: maeneo yake ya malisho
  rationale: Neno hili linamaanisha maeneo ya wazi yaliyohusishwa na miji, hasa kwa malisho na matumizi yanayohusiana nayo.
- source_word: לְמִשְׁפְּחוֹת
  choice: kwa ajili ya koo za
  rationale: מִשְׁפָּחוֹת ni vitengo vya ukoo ndani ya kabila; 'koo' linaeleza muundo huo vizuri kuliko 'familia' katika muktadha huu.
- source_word: בְּנֵי קְהָת
  choice: wazao wa Kohathi
  rationale: Ingawa maana halisi ni 'wana wa Kohathi,' hapa kifungu kinawahusu watu waliotokana naye; 'wazao' ni wazi na cha asili bila kupoteza maana ya kiukoo.
- source_word: הַנּוֹתָרִים
  choice: waliobaki
  rationale: Huwatofautisha wazao hawa wa Kohathi na tawi lililotajwa awali na tayari kupewa miji.
