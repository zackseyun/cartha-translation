  text: Heshboni pamoja na malisho yake[a], na Yazeri pamoja na malisho yake—jumla ya miji minne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ardhi yake ya matumizi ya pamoja” au “ardhi ya wazi inayozunguka mji”; neno la Kiebrania humaanisha ardhi ya wazi iliyokuwa mali ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Heshboni
  rationale: Jina la mahali limetoholewa kwa namna inayotumika kwa kawaida katika Biblia za Kiswahili, badala ya kutafsiriwa.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili humaanisha eneo la wazi lililokuwa mali ya mji, mara nyingi likitumiwa kwa malisho; wingi wa 'maeneo' unafaa katika orodha hii na kiambishi kinaonyesha kuwa maeneo hayo ni ya kila mji.
- source_word: יַעְזֵר
  choice: Yazeri
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili inayoonyesha matamshi na matumizi ya kawaida ya kibiblia.
- source_word: כָּל עָרִים אַרְבַּע
  choice: jumla ya miji minne
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida muhtasari wa nahau ya Kiebrania, kihalisi 'miji yote, minne'.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: pamoja na ... na ... pamoja na
  rationale: Viashiria vya yambwa vya Kiebrania havina neno maalumu la kulingana navyo katika Kiswahili; uhusiano wa vipengele vya orodha umeonyeshwa kwa viunganishi vya kawaida.
