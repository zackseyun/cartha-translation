base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: sw
  text: Nao Wakohathi waliosalia, kutoka koo za kabila la Efraimu, kutoka kabila la Dani, na kutoka nusu ya kabila la Manase, walipata kwa kura miji kumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao waliosalia wa Kohathi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: Nao wazao wengine wa Kohathi
  rationale: בְּנֵי katika muktadha wa kundi la ukoo inafaa kutafsiriwa 'wazao'; הַנּוֹתָרִים hurejelea sehemu iliyobaki ya Wakohathi baada ya kundi lililotajwa katika mstari uliotangulia.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: kutoka katika koo
  rationale: מִשְׁפָּחָה hapa ni kitengo cha kijamii ndani ya kabila, hivyo 'koo' ni sahihi na ya kawaida kuliko 'familia'.
- source_word: מַטֵּה אֶפְרַיִם
  choice: kabila la Efraimu
  rationale: מַטֶּה hapa humaanisha kabila, si fimbo.
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: kabila la Dani
  rationale: Kihusishi cha chanzo kutoka kishazi kilichotangulia kinatumika pia katika orodha hii; mtindo huu ni mwepesi na wa asili kwa Kiswahili.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: na nusu ya kabila la Manase
  rationale: Huhifadhi mgawanyo wa kabila la Manase kwa lugha wazi na ya kawaida.
- source_word: בַּ/גּוֹרָל
  choice: kwa kura
  rationale: Hueleza njia iliyotumiwa kugawa miji, bila kuifanya kuwa dhana ya jumla ya mgao.
- source_word: עָרִים עָשֶׂר
  choice: miji kumi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha Kiebrania.
- source_word: implicit verbless clause
  choice: walipata
  rationale: Kiebrania kina kishazi cha orodha kisicho na kitenzi; 'walipata' huwasilisha kwa asili maana ya ugawaji iliyo wazi katika muktadha, bila kuongeza maelezo yasiyokuwamo.
