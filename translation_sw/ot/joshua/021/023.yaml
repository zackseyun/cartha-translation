  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: sw
  text: 'Na kutoka kabila la Dani: Elteke na malisho yake[a], na Gibethoni na malisho yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ardhi yake ya malisho iliyoizunguka” / “ardhi yake ya matumizi ya pamoja,” kwa Kiebrania מִגְרָשֶׁהָ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: Na kutoka kabila la Dani
  rationale: Katika muktadha wa ugawaji wa maeneo, מַטֶּה humaanisha ‘kabila.’ Viambishi vya kuunganisha na vya kutoka vimetafsiriwa kwa kawaida kuwa ‘Na kutoka.’
- source_word: אֶת
  choice: '[alama ya yambwa haikutafsiriwa]'
  rationale: Alama ya Kiebrania ya yambwa maalumu haina neno linalolingana nayo moja kwa moja katika Kiswahili.
- source_word: אֶלְתְּקֵא
  choice: Elteke
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi iliyo kandokando ya mji, iliyotumiwa kwa malisho au kwa matumizi ya pamoja. Wingi ‘maeneo’ unaeleza kwa uwazi aina hii ya ardhi, na kiambishi cha nafsi ya tatu ya kike kinaelekezwa kwa mji.
- source_word: גִּבְּתוֹן
  choice: Gibethoni
  rationale: Jina la mahali limetoholewa kwa namna inayolingana na mfumo wa sauti na tahajia ya Kiswahili.
- source_word: וְ/אֶת
  choice: na
  rationale: Kiunganishi וְ kimetafsiriwa ‘na,’ huku alama ya yambwa אֶת ikiachwa bila tafsiri ya moja kwa moja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa sasa na unaoeleweka. ‘Pamoja na’ limetumiwa kuonyesha kuwa mji ulitolewa ukiwa na maeneo yake ya malisho. Alama ya tanbihi [a] imewekwa baada ya kutokea kwa kwanza kwa istilahi husika, kwa kuwa maana hiyo hiyo inajirudia katika mstari.
