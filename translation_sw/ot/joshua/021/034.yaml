translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na urudiaji wa “pamoja na maeneo yake ya malisho” umehifadhiwa. Alama ya tanbihi imewekwa baada ya jina linalohusika.
