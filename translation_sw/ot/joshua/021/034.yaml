base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: sw
  text: 'Na kwa jamaa za wana wa Merari, Walawi waliobaki, kutoka kabila la Zabuloni: Yokneamu pamoja na maeneo yake ya malisho, na Karta[a] pamoja na maeneo yake ya malisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia huandikwa “Kartha” katika baadhi ya tafsiri za Kiingereza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּח֣וֹת
  choice: Na kwa jamaa za
  rationale: Kiunganishi na kihusishi vinaendeleza orodha ya mgao kutoka mstari uliotangulia. Katika muktadha huu, “jamaa” linaeleza makundi ya kifamilia ndani ya ukoo kwa Kiswahili cha kawaida.
- source_word: בְּנֵֽי מְרָרִי
  choice: wazao wa Merari
  rationale: Ingawa muundo wa Kiebrania ni “wana wa Merari,” hapa unamaanisha vizazi vya ukoo wake; “wazao” ni wa asili na huepuka kudokeza wana wa moja kwa moja pekee.
- source_word: הַ/לְוִיִּ֣ם הַ/נּוֹתָרִים
  choice: Walawi waliobaki
  rationale: Huwatambulisha Walawi ambao mgao wao bado ulikuwa ukitajwa baada ya migao iliyotangulia.
- source_word: מֵ/אֵת֙ מַטֵּ֣ה זְבוּלֻ֔ן
  choice: kutoka kabila la Zabuloni
  rationale: Katika muktadha wa ugawaji wa miji, מַטֶּה humaanisha kabila, na מֵאֵת huonyesha chanzo cha mgao.
- source_word: יָקְנְעָם
  choice: Yokneamu
  rationale: Unukuzi wa jina la mahali unaofuata kanuni za kawaida za majina ya Biblia katika Kiswahili.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili hurejelea ardhi ya wazi kandokando ya mji, hasa iliyotumiwa kwa malisho; “maeneo yake ya malisho” ni wazi na ya asili.
- source_word: קַרְתָּה
  choice: Karta
  rationale: Unukuzi wa jina la mahali unaoakisi kwa karibu konsonanti za Kiebrania na unaofaa katika Kiswahili.
