base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: sw
  text: Ndipo viongozi wa jamaa za ukoo za Walawi wakawaendea kuhani Eleazari, Yoshua mwana wa Nuni, na viongozi wa jamaa za ukoo za makabila ya Waisraeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: wakamwendea
  rationale: Kitenzi נגשׁ humaanisha kukaribia au kumwendea mtu. Katika muktadha huu wa viongozi kuwasilisha ombi rasmi, “wakamwendea” ni Kiswahili cha kawaida na huhifadhi mwendo wa simulizi.
- source_word: רָאשֵׁי אֲבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Nahau hii ya Kiebrania inawahusu viongozi wa vikundi vya kifamilia vilivyotokana na babu mmoja. “Jamaa za ukoo” huonyesha muundo huo wa ukoo kwa Kiswahili kinachoeleweka bila tafsiri ngumu ya neno kwa neno.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la kikabila la Walawi.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: kuhani Eleazari
  rationale: כֹּהֵן ni “kuhani”; mpangilio huu ni wa asili katika Kiswahili na haumwongezei Eleazari cheo kisichotajwa.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Huhifadhi wazi patronimia ya Kiebrania kwa lugha ya kawaida na yenye heshima.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: viongozi wa jamaa za ukoo za makabila
  rationale: מַטּוֹת ni makabila, na kirai kizima kinaonyesha viongozi wa vitengo vya ukoo ndani ya mfumo wa makabila ya Israeli.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ya Waisraeli
  rationale: Ingawa maana halisi ni “wana wa Israeli,” hapa kirai kinabainisha makabila yanayohusika. “Waisraeli” ni cha asili katika Kiswahili na hudumisha maana ya pamoja bila utata wa “wana” kama watoto wa kiume pekee.
theological_decisions:
- issue: Lugha ya ukoo yenye msingi wa upande wa baba katika muundo wa makabila ya Israeli
  choice: jamaa za ukoo
  alternative: nyumba za baba; koo za mababu
  rationale: Kiebrania hutumia אֲבוֹת kueleza vitengo vya kijamii vinavyofuata ukoo wa baba. “Jamaa za ukoo” huhifadhi wazo la vikundi vya kifamilia vya nasaba bila kuleta kirai kisicho cha kawaida cha “nyumba za baba.”
- issue: Nahau ya pamoja “wana wa Israeli”
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Katika kirai hiki, לִבְנֵי יִשְׂרָאֵל ni jina la pamoja la taifa. “Waisraeli” ni wazi na sahihi katika Kiswahili, huku “wana wa Israeli” ikiweza kueleweka kwa maana finyu ya watoto wa kiume.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inafuata usawazishaji mwafaka: inaweka wazi muundo wa ukoo na makabila, lakini inaepuka kaliki ngumu kama “vichwa vya nyumba za baba.”'
