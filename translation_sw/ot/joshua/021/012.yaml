  yaml_path: translation/ot/joshua/021/012.yaml
  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: sw
  text: Lakini mashamba ya mji huo pamoja na vijiji vyake[a] wakampa Kalebu mwana wa Yefune kuwa milki yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makazi yake ya kandokando.” Neno la Kiebrania linaweza kutaja vijiji au makazi madogo yanayohusishwa na mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: mashamba ya mji huo
  rationale: Ingawa שְׂדֵה ni umbo la umoja, hapa lina maana ya ujumla ya ardhi ya kilimo iliyo mali ya mji; wingi wa Kiswahili unasomeka kwa kawaida na kuwasilisha maana hiyo.
- source_word: חֲצֵרֶיהָ
  choice: vijiji vyake
  rationale: Katika muktadha wa maeneo yaliyogawiwa, neno hili linaweza kutaja vijiji au makazi madogo yanayoutegemea mji. “Vijiji vyake” ni la kawaida na halilazimishi maana ya malisho ambayo haiko wazi katika neno lenyewe.
- source_word: נָתְנוּ
  choice: wakampa
  rationale: Kitenzi נתן humaanisha “kutoa.” Muundo wa Kiswahili “wakampa” unaonyesha kwa kawaida kwamba walimpa Kalebu maeneo hayo.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: Kalebu mwana wa Yefune
  rationale: Huhifadhi jina la mpokeaji na nasaba yake kwa muundo wa kawaida wa Kiswahili.
- source_word: בַּאֲחֻזָּתוֹ
  choice: kuwa milki yake
  rationale: אֲחֻזָּה ni eneo au mali inayomilikiwa kwa haki; “milki yake” huwasilisha maana ya umiliki wa ardhi bila kuifanya lazima iwe tendo la kurithi.
- source_word: וְאֶת
  choice: Lakini
  rationale: 'Kiunganishi cha mwanzo kinaunganisha sentensi hii na mstari uliotangulia kwa utofautishaji: mji ulipewa Walawi, lakini ardhi na vijiji vyake vikapewa Kalebu.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Pamoja na” huunganisha kwa uwazi mashamba na vijiji kama vitu vilivyotolewa, huku “milki” ikihifadhi dhana ya umiliki halali wa ardhi.
