  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku sauti ya mwanzo ya yod ikihifadhiwa.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili linamaanisha ardhi ya wazi iliyolizunguka jiji na kutumiwa kwa pamoja, hasa kwa malisho; kiambishi cha nafsi ya tatu umoja wa kike kinarejelea kila jiji.
- source_word: אֶשְׁתְּמֹעַ
  choice: Eshtemoa
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa.
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi kimewakilishwa kwa “na”; alama ya Kiebrania ya yambwa haina neno la moja kwa moja linalohitajika katika Kiswahili.
