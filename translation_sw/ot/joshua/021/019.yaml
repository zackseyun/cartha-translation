translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa muhtasari usio na kitenzi katika Kiebrania umewekwa kwa kitenzi “ilikuwa” ili sentensi iwe ya asili katika Kiswahili. Hakuna tanbihi inayohitajika, kwa kuwa “pamoja na” huakisi וְ bila kuleta utata wa maana.
