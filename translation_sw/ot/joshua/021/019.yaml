  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: sw
  text: Jumla ya miji ya wazao wa Aroni, makuhani, ilikuwa miji kumi na mitatu pamoja na maeneo ya malisho ya miji hiyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Jumla ya miji yote
  rationale: Kifungu hiki kinaonyesha jumla kamili ya miji iliyotajwa; Kiswahili hiki ni cha asili katika sentensi ya muhtasari na kinahifadhi wazo la כָּל.
- source_word: בְנֵי אַהֲרֹן
  choice: wazao wa Aroni
  rationale: Katika muktadha wa ugawaji wa miji, neno בְנֵי linarejelea ukoo wa Aroni, si lazima wanawe wa moja kwa moja; “wazao” huwasilisha maana hiyo kwa uwazi katika Kiswahili cha sasa.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Ni maelezo ya ziada yanayowatambulisha wazao wa Aroni kwa kazi yao ya ukuhani.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: miji kumi na mitatu
  rationale: Huu ni uwasilishaji wa kawaida na wa moja kwa moja wa idadi pamoja na nomino katika Kiswahili.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: pamoja na maeneo yake ya malisho
  rationale: מִגְרָשׁ ni ardhi ya wazi inayohusishwa na miji ya Walawi, hasa kwa malisho; “pamoja na” huhifadhi kiunganishi cha Kiebrania kwa Kiswahili cha asili.
