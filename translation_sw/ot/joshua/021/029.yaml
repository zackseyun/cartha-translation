lexical_decisions:
- source_word: יַרְמוּת
  choice: Yarmuthi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosaidia wasomaji wa Kiswahili kutamka konsonanti ya mwanzo ya Kiebrania na kumalizia neno kwa mtindo wa kawaida wa majina ya kibiblia katika Kiswahili.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Katika orodha za ugawaji wa miji, neno hili humaanisha maeneo ya wazi yaliyouzunguka mji, hasa yaliyotumiwa kwa malisho. Kiambishi cha nafsi ya tatu umoja wa kike kimetafsiriwa kuwa “yake,” kikirejelea kila jiji.
- source_word: עֵין גַּנִּים
  choice: En-Ganimi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa kama “chemchemi ya bustani”; tahajia hii ni ya asili na rahisi kutamkwa katika Kiswahili.
- source_word: עָרִים אַרְבַּע
  choice: majiji manne
  rationale: Huu ni muhtasari wa kawaida wa idadi katika orodha ya miji; “majiji” ni tafsiri ya kawaida ya עָרִים katika muktadha huu.
