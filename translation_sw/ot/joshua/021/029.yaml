  text: Jarmuth with its pasturelands[a], and En-gannim with its pasturelands—four cities.
translation:
  language: sw
  text: Yarmuthi pamoja na malisho yake, na En-Ganimi[a] pamoja na malisho yake—miji minne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Ganimi pia inaweza kutahajiwa Ain-Ganimi.
