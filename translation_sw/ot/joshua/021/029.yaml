translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa orodha ya Kiebrania na msisitizo wa jumla ya majiji manne umehifadhiwa.
