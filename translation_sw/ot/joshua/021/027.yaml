  text: וְ/לִ/בְנֵ֣י גֵרְשׁוֹן֮ מִ/מִּשְׁפְּחֹ֣ת הַ/לְוִיִּם֒ מֵ/חֲצִ֞י מַטֵּ֣ה מְנַשֶּׁ֗ה אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת גלון בַּ/בָּשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶֽת בְּעֶשְׁתְּרָ֖ה וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: sw
  text: Nao wakawapa wana wa Gershoni, wa jamaa za Walawi, kutoka nusu ya kabila la Manase, Golani katika Bashani, mji wa makimbilio kwa mtu aliyemuua mtu, pamoja na maeneo yake ya malisho, na Beeshtera[a] pamoja na maeneo yake ya malisho—miji miwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina Beeshtera; linganisha 1 Mambo ya Nyakati 6:71, ambapo pana Ashtarothi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: wana wa Gershoni
  rationale: Neno בני kwa maana ya msingi ni ‘wana wa’; katika muktadha huu linamaanisha wazao wa Gershoni. Muundo huu unadumisha namna ya Kiebrania huku ukieleweka kwa Kiswahili.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: wa jamaa za Walawi
  rationale: מִשְׁפָּחוֹת hapa ni makundi ya ukoo ndani ya kabila; ‘jamaa’ ni neno la kawaida na linalofaa katika muktadha huu wa ugawaji wa kikabila.
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: kutoka nusu ya kabila la Manase
  rationale: מַטֶּה katika simulizi za ugawaji wa nchi humaanisha ‘kabila’; usemi huu ni wa asili na wazi kwa Kiswahili.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: mji wa makimbilio kwa mtu aliyemuua mwingine
  rationale: ‘Mji wa makimbilio’ ni usemi wa kisheria katika muktadha huu. הָרֹצֵחַ humaanisha mtu aliyesababisha kifo; tafsiri hii haiongezi wazo la mauaji ya kukusudia ambalo neno ‘muuaji’ lingeweza kudokeza.
- source_word: גלון בַּ/בָּשָׁן
  choice: Golani katika Bashani
  rationale: Majina yote mawili ni ya mahali na yametoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ ni ardhi ya wazi iliyozunguka mji wa Walawi, iliyotumiwa hasa kwa malisho na shughuli zinazohusiana nayo.
- source_word: בְּעֶשְׁתְּרָה
  choice: Beeshtera
  rationale: Maandishi ya Kimasora katika mstari huu yana jina Beeshtera; matini kuu haijapatanishwa kimya kimya na jina tofauti katika kifungu sambamba.
- source_word: עָרִים שְׁתָּיִם
  choice: jumla miji miwili
  rationale: Huu ni muhtasari wa idadi unaofunga orodha; ‘jumla’ huifanya kazi yake ya kuhesabu iwe wazi kwa Kiswahili bila kubadili maana.
- source_word: implicit verbal sense in allotment list
  choice: waliwapa
  rationale: Ingawa mstari huu hauna kitenzi dhahiri katika Kiebrania, muundo wa ugawaji katika mistari inayouzunguka hutoa maana ya ‘waliwapa’; kitenzi kimewekwa ili kuunda sentensi kamili ya Kiswahili.
theological_decisions:
- issue: Maana ya הָרֹצֵחַ katika sheria ya mji wa makimbilio
  choice: mtu aliyemuua mwingine
  alternative: muuaji
  rationale: Muktadha wa miji ya makimbilio unajumuisha hasa kusababisha kifo bila kukusudia. ‘Mtu aliyemuua mwingine’ huhifadhi maana pana bila kumhukumu tayari kuwa alifanya mauaji ya kukusudia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umerahisishwa kwa kutumia koloni, na majina ya watu na mahali yametoholewa kwa mtindo wa kawaida wa Kiswahili.
