id: JOS.21.44
reference: Joshua 21:44
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: sw
  text: Yahweh akawapa pumziko pande zote, kulingana na yote aliyokuwa amewaapia baba zao. Hakuna hata mtu mmoja miongoni mwa adui zao wote aliyeweza kusimama dhidi yao[a]; Yahweh akawatia adui zao wote mikononi mwao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kusimama mbele yao”; nahau yenye maana ya kuwapinga kwa mafanikio.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “katika mkono wao”; nahau ya kumtia mtu chini ya mamlaka ya mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: akawapa pumziko
  rationale: Hifili ya נוח hapa ina maana ya kusababisha wapumzike au kuwapa pumziko. Usemi huu ni wa kawaida katika Kiswahili na unadumisha mada ya utimilifu wa ahadi na usalama baada ya vita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: מִסָּבִיב
  choice: pande zote
  rationale: Usemi huu unaonyesha usalama kamili dhidi ya vitisho vilivyowazunguka; “pande zote” ni Kiswahili cha kawaida chenye maana hiyo ya kijumla na ya kieneo.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: kulingana na yote aliyokuwa amewaapia
  rationale: “Kulingana na” inadumisha nguvu ya כְּ, na “yote” inadumisha ukamilifu wa כֹּל. Wakati wa kitendo unaonyesha kwamba kiapo kilitangulia utimilifu wake.
- source_word: לַאֲבוֹתָם
  choice: baba zao
  rationale: Neno la Kiebrania linataja “baba” kwa umbo la kiume na hapa linawarejelea mababu wa Israeli; tafsiri inadumisha taswira ya kifamilia ya matini.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: Hakuna hata mtu mmoja ... aliyeweza kusimama dhidi yao
  rationale: Usemi wa Kiebrania “kusimama mbele yao” ni nahau ya kuweza kupinga kwa mafanikio. “Kusimama dhidi yao” ni ya asili zaidi katika Kiswahili, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: miongoni mwa adui zao wote
  rationale: 'Hii inaonyesha maana ya sehemu katika kundi: hakuna hata mmoja kutoka miongoni mwa maadui wao wote.'
- source_word: נָתַן ... בְּיָדָם
  choice: akawatia ... mikononi mwao
  rationale: Hii ni nahau ya kumkabidhi mtu chini ya mamlaka ya mwingine. “Kuwatia mikononi mwao” ni nahau ya kawaida ya Kiswahili inayodumisha taswira na maana ya ushindi uliotolewa na Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi kama jina la agano.
- issue: Maana ya pumziko katika utimilifu wa kiapo
  choice: akawapa pumziko pande zote
  alternative: akawapa nafuu pande zote
  rationale: “Pumziko” hudumisha mada pana ya pumziko baada ya ushindi bila kuongeza dai kwamba kila aina ya mapambano ilikuwa imekoma kabisa.
- issue: Lugha ya kiume katika לַאֲבוֹתָם na אִישׁ
  choice: baba zao / mtu mmoja
  alternative: mababu zao / yeyote
  rationale: “Baba zao” hudumisha umbo na taswira ya kifamilia ya chanzo. Katika sentensi ya pili, “mtu mmoja” huwasilisha אִישׁ kwa Kiswahili cha kawaida bila kubadili maana yake ya mgawanyo, yaani, hata mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa simulizi umetumia “aka-” kwa mwendelezo wa matukio. Nahau za Kiebrania zimewasilishwa kwa Kiswahili cha kawaida, na taswira zake halisi zimeelezwa katika tanbihi.
