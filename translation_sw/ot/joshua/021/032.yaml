base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: sw
  text: 'Na kutoka katika kabila la Naftali: Kedeshi katika Galilaya, mji wa makimbilio kwa mtu aliyeua[a], pamoja na maeneo yake ya malisho; Hamothi-dori pamoja na maeneo yake ya malisho[b]; na Kartani pamoja na maeneo yake ya malisho—miji mitatu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muuaji.” Neno la Kiebrania humaanisha mtu aliyeua, hasa katika muktadha wa kisheria wa kupata hifadhi, na si lazima limaanishe mtu aliyeua kwa kukusudia.
    reason: lexical_alternative
  - marker: b
    text: Maandishi ya Kiebrania yanasema Hamothi-dori; mapokeo fulani yanahusianisha mahali hapa na Hamathi.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: Na kutoka katika kabila la Naftali
  rationale: Katika muktadha wa mgao wa miji, מַטֶּה humaanisha ‘kabila,’ si fimbo halisi. Viambishi וּ־ na מִ־ vimetafsiriwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: mji wa makimbilio kwa mtu aliyeua
  rationale: ‘Mji wa makimbilio’ ni usemi wa kisheria unaoeleweka. הָרֹצֵחַ humaanisha mtu aliyeua; katika sheria ya hifadhi, neno lenyewe halisemi moja kwa moja kwamba mauaji yalipangwa, hivyo ‘muuaji’ lingeweza kuleta lawama nzito isiyolazimishwa na muktadha.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Kedeshi katika Galilaya
  rationale: Majina yametoholewa kwa maumbo yanayosomeka kiasili katika Kiswahili; בַּגָּלִיל inaonyesha eneo la mahali.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ ni ardhi ya wazi iliyoizunguka na kuuhudumia mji, mara nyingi kwa malisho. Wingi wa Kiswahili unaonyesha eneo pana bila kudai kuwa matumizi yake yalikuwa malisho pekee.
- source_word: חַמֹּת דֹּאר
  choice: Hamothi-dori
  rationale: Jina la mahali limetoholewa kutoka katika umbo la Kiebrania la maandishi ya WLC, huku kistari kikihifadhi muundo wake wa sehemu mbili.
- source_word: קַרְתָּן
  choice: Kartani
  rationale: Ni jina la mahali lililotoholewa moja kwa moja kwa tahajia inayofaa Kiswahili.
- source_word: עָרִים שָׁלֹשׁ
  choice: miji mitatu
  rationale: Muhtasari wa Kiebrania umewekwa katika mpangilio wa kawaida wa maneno ya Kiswahili.
theological_decisions:
- issue: Kiwango cha hatia kinachodokezwa na הָרֹצֵחַ
  choice: mtu aliyeua
  alternative: muuaji
  rationale: Tafsiri iliyochaguliwa inadumisha uwezekano wa kisheria wa mtu aliyesababisha kifo bila kudai moja kwa moja kuwa ni mauaji ya kukusudia; tofauti hiyo ni muhimu katika muktadha wa miji ya makimbilio.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa orodha na marudio ya ‘pamoja na maeneo yake ya malisho’ yamehifadhiwa ili kuonyesha urasmi wa maandishi ya chanzo.
