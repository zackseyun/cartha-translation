base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: sw
  text: Nao wana wa Gershoni walipewa kwa kura miji kumi na mitatu kutoka katika jamaa[a] za kabila la Isakari, kutoka katika kabila la Asheri, kutoka katika kabila la Naftali, na kutoka katika nusu ya kabila la Manase iliyokuwa Bashani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, koo za kabila la Isakari. Neno la Kiebrania מִשְׁפָּחוֹת linaweza kumaanisha jamaa/familia pana au koo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: Nao wana wa Gershoni
  rationale: Katika muktadha wa ukoo wa Walawi, בְּנֵי inaonyesha wazao wa Gershoni. Muundo wa jadi “wana wa” unabaki wazi na wenye heshima, huku “Nao” ikiendeleza orodha ya mgao kutoka mstari uliotangulia.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: kutoka katika jamaa za
  rationale: מִשְׁפָּחוֹת humaanisha vikundi vya ukoo au koo pana. “Jamaa” ni Kiswahili cha kawaida kinachoonyesha makundi hayo bila kuyafanya yaonekane kuwa familia ndogo tu.
- source_word: מַטֵּה
  choice: kabila la
  rationale: Katika muktadha wa ugawaji wa maeneo, מַטֶּה ni kitengo cha kikabila, hivyo “kabila” ndiyo maana inayofaa.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה בַ/בָּשָׁן
  choice: na kutoka katika nusu ya kabila la Manase iliyokuwa Bashani
  rationale: Tafsiri hii inaonyesha kwamba ni nusu ya kabila la Manase iliyohusishwa na eneo la Bashani, huku ikihifadhi uhusiano wa kirai cha mahali katika Kiebrania.
- source_word: בַּ/גּוֹרָל
  choice: kwa kura
  rationale: Kirai hiki kinaeleza njia ya ugawaji; “kwa kura” ni usemi wa kawaida na mwaminifu katika Kiswahili cha Biblia.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: miji kumi na mitatu
  rationale: עָרִים ni miji au makazi ya mjini; “miji” inafaa kwa orodha za ugawaji katika Yoshua.
