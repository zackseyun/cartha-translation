translation:
  language: sw
  text: Kila mojawapo ya miji hii ilikuwa na maeneo yake ya malisho yaliyouzunguka[a]; ndivyo ilivyokuwa kwa miji hii yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, “mji kwa mji, na maeneo yake ya malisho kuuzunguka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: ilikuwa na
  rationale: Kitenzi hiki kinaeleza hali katika muhtasari wa simulizi; pamoja na kirai kinachofuata, Kiswahili cha kawaida huwasilisha uhusiano huo kwa ‘ilikuwa na’.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: miji hii
  rationale: ‘Miji’ ni tafsiri ya kawaida na yenye hadhi inayofaa muktadha wa ugawaji wa maeneo.
- source_word: עִיר עִיר
  choice: kila mojawapo
  rationale: Urudiaji huu una maana ya kugawa, yaani kila mji mmoja mmoja; ‘kila mojawapo’ huhifadhi mkazo huo kwa Kiswahili cha asili.
- source_word: וּמִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili linataja ardhi ya wazi iliyotengwa kandokando ya mji, hasa kwa matumizi ya malisho; ‘maeneo ya malisho’ ni wazi kuliko ‘viunga’.
- source_word: סְבִיבֹתֶיהָ
  choice: yaliyoizunguka
  rationale: Huhifadhi wazi maana ya mahali pa maeneo hayo kuuzunguka kila mji.
- source_word: כֵּן
  choice: ndivyo ilivyokuwa
  rationale: Kirai hiki kinatoa hitimisho linalothibitisha kwamba mpangilio huo ulikuwa uleule katika miji yote.
- source_word: לְכָל הֶעָרִים הָאֵלֶּה
  choice: kwa miji hii yote
  rationale: Hujumlisha mpangilio uliotajwa na kuuhusisha na kundi lote la miji.
