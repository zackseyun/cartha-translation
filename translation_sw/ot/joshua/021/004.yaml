base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: sw
  text: Kura ikatoka kwa ajili ya koo za Wakohathi[a]. Nao wana wa kuhani Haruni, miongoni mwa Walawi, wakapata kwa kura miji kumi na mitatu kutoka katika kabila la Yuda, kutoka katika kabila la Simeoni na kutoka katika kabila la Benyamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kura iliwaangukia koo za Wakohathi.” Nahau ya Kiebrania inaweza kutafsiriwa kuwa kura “ilitoka” au “iliwaangukia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: Kura ikatoka
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania huku ikiwa inaeleweka katika muktadha wa ugawaji kwa kura; uwezekano wa kutafsiri kuwa kura ‘iliwaangukia’ umewekwa katika tanbihi.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: kwa ajili ya koo za Wakohathi
  rationale: ‘Koo’ huonyesha vikundi vya kifamilia vya ukoo kwa usahihi zaidi kuliko ‘familia’ katika muktadha wa mgawanyo wa kikabila; ‘Wakohathi’ ni namna ya kawaida ya kutaja wazao wa Kohathi.
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: Nao wana wa kuhani Haruni ... wakapata
  rationale: Kitenzi ‘wakapata’ kinakamilisha kwa Kiswahili sentensi ya Kiebrania iliyo na muundo wa ufupisho, bila kubadili maana ya kupokea mgao. ‘Wana wa kuhani Haruni’ huhifadhi uhusiano wa ukoo na cheo cha Haruni.
- source_word: מִן הַלְוִיִּם
  choice: miongoni mwa Walawi
  rationale: 'Huweka wazi maana ya sehemu ya kundi: wana wa Haruni walikuwa kundi ndani ya Walawi.'
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: kutoka katika kabila la Yuda, kutoka katika kabila la Simeoni na kutoka katika kabila la Benyamini
  rationale: ‘Kabila’ ndiyo maana ya מַטֶּה katika muktadha huu. Kurudia ‘kutoka katika kabila la’ kunaakisi msisitizo na muundo wa Kiebrania.
- source_word: בַּגּוֹרָל
  choice: kwa kura
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha njia iliyotumiwa kugawa miji.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: miji kumi na mitatu
  rationale: ‘Miji’ ni tafsiri ya kawaida ya עָרִים katika masimulizi ya ugawaji wa maeneo.
