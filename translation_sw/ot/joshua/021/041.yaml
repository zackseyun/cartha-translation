  text: כֹּ֚ל עָרֵ֣י הַ/לְוִיִּ֔ם בְּ/ת֖וֹךְ אֲחֻזַּ֣ת בְּנֵֽי יִשְׂרָאֵ֑ל עָרִ֛ים אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה וּ/מִגְרְשֵׁי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: sw
  text: Miji yote ya Walawi iliyokuwa ndani ya milki ya wana wa Israeli[a] ilikuwa miji arobaini na minane, pamoja na maeneo yake ya malisho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “maeneo yake ya wazi” au “ardhi zake za pamoja,” yaani ardhi iliyozunguka miji hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: yote
  rationale: Inaonyesha jumla kamili ya miji inayotajwa, kwa Kiswahili cha kawaida na sahihi.
- source_word: עָרֵי הַלְוִיִּם
  choice: miji ya Walawi
  rationale: Inahifadhi moja kwa moja uhusiano wa umilikaji/uhusiano katika muundo wa Kiebrania, badala ya kutumia kivumishi chenye tafsiri pana zaidi.
- source_word: בְּתוֹךְ
  choice: ndani ya
  rationale: Inaeleza kwamba miji hiyo ilikuwa katika eneo pana lililomilikiwa na Israeli.
- source_word: אֲחֻזַּת
  choice: milki
  rationale: Hapa neno linamaanisha eneo la ardhi lililoshikiliwa kama mali; 'milki' ni fupi na huepuka kulazimisha maana ya 'urithi'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi umbo halisi la Kiebrania la jina la taifa, huku tanbihi ikitoa namna ya kawaida zaidi ya kusema 'Waisraeli'.
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: ilikuwa miji arobaini na minane
  rationale: Kitenzi kimeongezwa ili kuunda sentensi kamili ya Kiswahili, huku idadi ya Kiebrania ikihifadhiwa sawasawa.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: pamoja na maeneo yake ya malisho
  rationale: מִגְרָשׁ katika muktadha huu ni ardhi wazi inayozunguka miji na kutumiwa hasa kwa malisho; 'maeneo ya malisho' ni wazi na ya kawaida.
theological_decisions:
- issue: Jina la taifa lenye umbo la kiume בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watoto wa Israeli
  rationale: Kiebrania hutumia kihalisi 'wana wa Israeli' kama jina la pamoja la taifa. Tafsiri kuu inahifadhi umbo hilo bila kudai kwamba rejeo linawahusu wanaume pekee; tanbihi inaonyesha mbadala wa kawaida wa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unafuata kwa karibu sentensi ya Kiebrania bila kuwa mgumu; alama zote za tanbihi zimewekwa katika matini kuu.
