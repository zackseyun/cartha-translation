  text: Anathothi pamoja na malisho yake[a], na Almoni pamoja na malisho yake; miji minne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ardhi ya pamoja ya mji” au “ardhi inayouzunguka mji.” Neno la Kiebrania linamaanisha eneo la wazi lililokuwa mali ya mji.
