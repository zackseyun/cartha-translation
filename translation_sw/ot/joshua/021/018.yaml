lexical_decisions:
- source_word: עֲנָתוֹת
  choice: Anathothi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kulitafsiri maana yake.
- source_word: מִגְרָשֶׁהָ
  choice: malisho yake
  rationale: Neno מִגְרָשׁ katika orodha za mgao humaanisha eneo la wazi lililokuwa mali ya mji, mara nyingi likitumiwa kulishia mifugo. 'Malisho yake' ni usemi wa kawaida na wazi katika Kiswahili; kiambishi cha nafsi ya tatu umoja kinarejelea kila mji.
- source_word: עַלְמוֹן
  choice: Almoni
  rationale: Jina la mahali limetoholewa kwa namna ya kawaida ya Kiswahili badala ya kutafsiriwa.
- source_word: עָרִים אַרְבַּע
  choice: miji minne
  rationale: Ni tafsiri ya moja kwa moja ya kishazi cha muhtasari wa idadi ya maeneo yaliyotajwa.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: pamoja na ... na ... pamoja na
  rationale: Kiashiria cha yambwa אֶת hakina kisawe cha moja kwa moja katika Kiswahili; mpangilio wa vitu vilivyoorodheshwa na viunganishi unaonyesha kazi yake.
