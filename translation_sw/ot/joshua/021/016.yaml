base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: sw
  text: Aini na maeneo yake ya malisho[a], Yuta na maeneo yake ya malisho, na Beth-shemeshi na maeneo yake ya malisho—miji tisa kutoka kwa makabila hayo mawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ardhi ya kawaida ya mji” au “ardhi inayozunguka mji”; yaani, ardhi iliyohusishwa na kila mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Aini
  rationale: Jina la mahali limetoholewa kwa mfumo unaosomeka kwa kawaida katika Kiswahili, badala ya kutafsiri maana yake ya kileksika.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno hilo linamaanisha ardhi ya wazi iliyohusishwa na mji, hasa kwa matumizi ya malisho; tafsiri hii ni ya kawaida na inaepuka neno la zamani lisilo sahihi la 'vitongoji'.
- source_word: יֻטָּה
  choice: Yuta
  rationale: Jina la mahali limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia ya kawaida ya Kiswahili.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-shemeshi
  rationale: Jina la mji limetoholewa badala ya kutafsiriwa kuwa 'Nyumba ya Jua,' kwa kuwa hapa ni jina maalumu la mahali.
- source_word: עָרִים תֵּשַׁע
  choice: jumla ya miji tisa
  rationale: Neno 'miji' linafaa kwa vituo hivi vya makazi; 'jumla ya' hufanya muhtasari wa idadi usomeke kwa urahisi bila kubadili maana.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: kutoka kwa makabila hayo mawili
  rationale: Kauli hii huhifadhi wazo la kwamba miji hiyo ilitolewa kutoka katika makabila mawili yaliyotajwa katika muktadha.
