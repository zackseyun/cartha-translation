source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: sw
  text: 'Nao wakawaambia huko Shilo, katika nchi ya Kanaani: “Yahwe aliamuru kupitia Musa[a] kwamba tupewe miji ya kuishi, pamoja na maeneo yake ya malisho[b] kwa ajili ya mifugo yetu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “kwa mkono wa Musa,” nahau yenye maana ya “kupitia Musa.”
    reason: lexical_alternative
  - marker: b
    text: Au “maeneo yake ya wazi” au “ardhi yake ya pamoja”; neno la Kiebrania linamaanisha ardhi iliyoizunguka miji, iliyotumiwa kwa malisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם ... לֵאמֹר
  choice: Nao wakawaambia ...
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida kitendo cha kusema kwao na utangulizi wa maneno ya moja kwa moja bila kurudia ‘wakasema ... wakisema.’
- source_word: בְּשִׁלֹה
  choice: huko Shilo
  rationale: ‘Huko’ ni kiashirio cha mahali kinachofaa kwa mkutano uliofanyika Shilo na ni cha kawaida katika simulizi la Kiswahili.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: katika nchi ya Kanaani
  rationale: Tafsiri inadumisha nomino המפורש ‘nchi’ iliyo katika Kiebrania badala ya kufupisha kuwa ‘Kanaani’ pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya Kiswahili badala ya kubadilishwa na cheo.
- source_word: צִוָּה
  choice: aliamuru
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida ya kitenzi צוה katika muktadha huu.
- source_word: בְיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Nahau ya Kiebrania ‘kwa mkono wa Musa’ inaonyesha uwakala au upatanishi; ‘kupitia Musa’ huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: לָתֶת לָנוּ
  choice: kwamba tupewe
  rationale: Kauli tendwa ya Kiswahili inaweka wazi kuwa Walawi ndio wapokeaji huku ikiacha bila kutajwa wale waliopaswa kutoa miji, kama chanzo kinavyofanya.
- source_word: עָרִים לָשָׁבֶת
  choice: miji ya kuishi
  rationale: ‘Miji’ hufuata neno עָרִים, na ‘ya kuishi’ huonyesha kusudi la miji hiyo kwa lugha ya kawaida ya kisasa.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: pamoja na maeneo yake ya malisho
  rationale: מִגְרָשׁ hapa ni eneo lililoizunguka miji na lililotumiwa hasa kwa mifugo; ‘maeneo ya malisho’ huwasilisha kazi yake bila kulifanya kuwa mashamba.
- source_word: לִבְהֶמְתֵּנוּ
  choice: kwa ajili ya mifugo yetu
  rationale: ‘Mifugo’ ni neno la kawaida na linalofaa kwa wanyama wafugwao waliokusudiwa kutumia maeneo hayo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi kwa umbo la tahajia linaloeleweka katika Kiswahili bila kuingiza fasiri ya kimadhehebu.
- issue: Mhusika anayetoa miji katika לָתֶת לָנוּ
  choice: kwamba tupewe
  alternative: kutupatia
  rationale: Kiebrania hakimtaji wazi mtendaji wa kutoa miji. Kauli tendwa huhifadhi kutotajwa huko na kuepuka kudokeza kimakosa kwamba Musa au Yahwe ndiye anayetoa miji moja kwa moja katika sentensi hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘wakawaambia’ umechaguliwa kwa ufasaha wa simulizi, na maneno ya kiufundi yasiyo ya kawaida yameepukwa. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayofafanuliwa.
