  text: and Kibzaim with its pasturelands[a], and Beth-horon with its pasturelands—four cities.
translation:
  language: sw
  text: na Kibzaimu pamoja na maeneo yake ya malisho,[a] na Beth-horoni pamoja na maeneo yake ya malisho—majiji manne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ardhi ya matumizi ya pamoja” au “ardhi ya malisho.” Neno la Kiebrania linamaanisha eneo la wazi lililokuwa mali ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: Kibzaimu
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili badala ya kutafsiriwa maana yake.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Neno מִגְרָשׁ linaonyesha eneo la wazi lililokuwa mali ya mji, hasa kwa matumizi ya malisho; kiambishi cha nafsi ya tatu umoja wa kike kimetafsiriwa kwa 'yake' kikirejelea jiji.
- source_word: בֵּית חוֹרֹן
  choice: Beth-horoni
  rationale: Jina maalumu limetoholewa badala ya kutafsiriwa kihalisi kuwa 'Nyumba ya Horoni'; umbo lenye -i linaendana na matumizi ya kawaida ya majina haya katika Kiswahili.
- source_word: עָרִים אַרְבַּע
  choice: majiji manne
  rationale: Ni muhtasari wa idadi unaohitimisha orodha; 'majiji' linawakilisha עָרִים kwa kawaida katika orodha ya miji iliyogawiwa.
- source_word: וְאֶת ... וְאֶת
  choice: na ... na
  rationale: Viunganishi vilivyorudiwa vimehifadhi uratibu wa orodha, huku alama za yambwa za Kiebrania zikiachwa bila tafsiri ya moja kwa moja.
