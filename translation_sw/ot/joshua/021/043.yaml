base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: sw
  text: Hivyo Yahwe akawapa Israeli nchi yote ambayo alikuwa ameapa kuwapa baba zao; nao wakaimiliki[a] na wakakaa humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakairithi”; kitenzi cha Kiebrania kinaweza pia kuwa na maana ya “kurithi” katika muktadha wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetafsiriwa kwa umbo la kawaida la Kiswahili, “Yahwe,” badala ya kulibadili kuwa cheo kama “BWANA.”
- source_word: וַיִּתֵּן
  choice: akawapa
  rationale: Kitenzi נתן hapa humaanisha kutoa; umbo la “akawapa” linaendeleza simulizi na kuonyesha Israeli kama jamii ya watu.
- source_word: כָּל הָאָרֶץ
  choice: nchi yote
  rationale: אָרֶץ hapa ni nchi iliyoahidiwa kwa Israeli, si dunia nzima; “yote” huhifadhi nguvu ya כָּל.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: aliyokuwa ameapa kuwapa
  rationale: Kauli hii inaonyesha kiapo cha awali cha Yahwe cha kuitoa nchi; “ameapa” huhifadhi wazi uzito wa kiapo.
- source_word: לַאֲבוֹתָם
  choice: baba zao
  rationale: Tafsiri hii huhifadhi neno la kiume lililo wazi katika Kiebrania na rejeo lake kwa mababa wa Israeli.
- source_word: וַיִּרָשׁוּהָ
  choice: wakaimiliki
  rationale: ירשׁ hapa inaeleza kuipata na kuishika nchi kuwa mali yao; “wakaimiliki” ni ya asili na haifungi maana ya kitenzi katika dhana ya urithi pekee.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: na kukaa humo
  rationale: ישׁב pamoja na ב ina maana ya kukaa au kuishi mahali; “kukaa humo” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וַ
  choice: Hivyo
  rationale: Kiunganishi cha mwanzo kinaendeleza simulizi huku kikianzisha muhtasari wa matokeo; “Hivyo” huonyesha nguvu hiyo bila kuongeza maelezo.
theological_decisions:
- issue: Upeo na nguvu ya kauli kuhusu kutimizwa kwa ahadi ya nchi
  choice: Kudumisha kauli thabiti kwamba Yahwe aliwapa Israeli nchi yote iliyoahidiwa, nao wakaimiliki na kukaa humo.
  alternative: Kupunguza “nchi yote” kuwa sehemu tu ya nchi, au kuifanya kauli hii iamue moja kwa moja mvutano wote na habari nyingine za ushindi.
  rationale: Kiebrania kinasema wazi כָּל הָאָרֶץ, “nchi yote,” na kufuatisha kwa kumiliki na kukaa humo. Tafsiri inahifadhi nguvu hiyo bila kuingiza upatanisho wa kimafundisho ambao mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida, huku mtiririko wa muhtasari wa Kiebrania na utata halisi wa ירשׁ vikihifadhiwa.
