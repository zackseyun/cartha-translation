  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. “Wagershoni” na “koo” zinafaa kwa muktadha wa nasaba na mgao wa Walawi; “maeneo ya malisho” huepuka istilahi ya kale au yenye utata.
