translation:
  language: sw
  text: Miji yote ya Wagershoni, kwa koo zao, ilikuwa kumi na mitatu, pamoja na maeneo ya malisho ya miji hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na maeneo ya malisho ya miji hiyo.”
    reason: Kiunganishi וּ kinaweza kutafsiriwa moja kwa moja kuwa “na”; “pamoja na” huonyesha uhusiano wa maeneo ya malisho na miji hiyo.
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Miji yote
  rationale: Huwasilisha kwa njia ya kawaida jumla ya miji inayohesabiwa katika mgao huu.
- source_word: הַגֵּרְשֻׁנִּי
  choice: Wagershoni
  rationale: Nomino hii ya Kiebrania ni ya umoja lakini inatumika kwa maana ya pamoja kuhusu wazao wa Gershoni; wingi wa Kiswahili ni wa kawaida na wazi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Neno hili linaonyesha upangaji wa Wagershoni kulingana na vikundi vyao vya ukoo; “koo” linafaa katika muktadha wa makabila na migawanyo ya ardhi.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: miji kumi na mitatu
  rationale: Mpangilio wa kawaida wa Kiswahili unaweka nomino kabla ya idadi, huku “miji” ikidumisha istilahi iliyotumiwa mwanzoni mwa aya.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: pamoja na maeneo yake ya malisho
  rationale: מִגְרָשׁ hapa ni ardhi ya wazi iliyohusishwa na kila mji, hasa kwa malisho; “pamoja na” huonyesha kwamba maeneo hayo yaliambatana na miji bila kuyahesabu kama miji mingine.
