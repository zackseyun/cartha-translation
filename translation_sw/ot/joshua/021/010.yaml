lexical_decisions:
- source_word: וַיְהִי
  choice: Hayo yalikuwa
  rationale: Kauli hii ya kisimulizi inaonyesha kwamba mgao uliotajwa uliwahusu watu wanaofuata; Kiswahili cha asili kinahitaji rejeleo linaloeleweka katika muktadha.
- source_word: לִבְנֵי אַהֲרֹן
  choice: kwa ajili ya wana wa Aroni
  rationale: ל inaonyesha walengwa wa mgao, huku “wana wa Aroni” ikihifadhi namna ya ukoo ya Kiebrania.
- source_word: מִמִּשְׁפְּחוֹת
  choice: waliotoka katika jamaa za
  rationale: מִשְׁפָּחוֹת humaanisha vikundi vya ukoo au jamaa pana; “jamaa” ni wazi na ya kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: הַקְּהָתִי
  choice: Wakohathi
  rationale: Jina hili linataja kundi la ukoo wa Kohathi miongoni mwa Walawi; umbo la Kiswahili lenye kiambishi Wa- linaeleweka kwa watu.
- source_word: מִבְּנֵי לֵוִי
  choice: miongoni mwa wana wa Lawi
  rationale: Tafsiri hii huhifadhi lugha ya nasaba na pia huonyesha kwamba Wakohathi walikuwa sehemu ya ukoo mpana wa Lawi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaonyesha sababu ya wana wa Aroni kutajwa kwanza katika mgao.
- source_word: לָהֶם
  choice: ilikuwa yao
  rationale: Katika muktadha wa ugawaji, לָהֶם huonyesha kwamba kura hiyo iliwahusu au iliwapangukia wao; “ilikuwa yao” ni ya asili na fupi.
- source_word: הַגּוֹרָל
  choice: kura
  rationale: “Kura” ni neno la kawaida la Kiswahili kwa njia ya kufanya uteuzi au mgao kwa kupiga kura, na linafaa katika muktadha huu.
- source_word: רִאשֹׁנָה
  choice: ya kwanza
  rationale: Hueleza nafasi ya kura katika mfuatano wa ugawaji.
