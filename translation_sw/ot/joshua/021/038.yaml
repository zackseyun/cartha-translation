  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: sw
  text: 'Na kutoka katika kabila la Gadi: Ramothi katika Gileadi[b], mji wa makimbilio kwa mtu aliyeua[a], pamoja na maeneo yake ya malisho[c], na Mahanaimu pamoja na maeneo yake ya malisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘muuaji.’ Katika muktadha huu wa kisheria, usemi ‘mtu aliyeua’ haumhukumu mapema kuwa alifanya mauaji ya kukusudia.
    reason: lexical_alternative
  - marker: b
    text: Au ‘Ramoth-Gileadi.’ Kiebrania kinaweza kuwakilishwa kama ‘Ramothi katika Gileadi’ au kama jina moja la mahali.
    reason: alternative_reading
  - marker: c
    text: ‘Maeneo ya malisho’ ni ardhi iliyouzunguka mji na kutengwa itumiwe pamoja na mji huo.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה גָד
  choice: Na kutoka katika kabila la Gadi
  rationale: Katika muktadha wa kugawa miji kwa makabila, מַטֶּה humaanisha ‘kabila’; viambishi vya kuunganisha na vya mahali vimetafsiriwa kwa Kiswahili cha kawaida kama ‘Na kutoka katika.’
- source_word: עִיר מִקְלַט
  choice: mji wa makimbilio
  rationale: Hili ni neno la kisheria kwa mji uliotengwa kuwa mahali pa kukimbilia baada ya mtu kumuua mwingine; ‘mji wa makimbilio’ ni usemi wa asili na unaoeleweka katika Kiswahili.
- source_word: הָרֹצֵחַ
  choice: mtu aliyeua
  rationale: Katika sheria ya miji ya makimbilio, neno hili humtaja aliyesababisha kifo bila kuamua mapema ikiwa ni muuaji wa kukusudia. ‘Mtu aliyeua’ huhifadhi upana huo bila kutamka hukumu ya hatia.
- source_word: רָמֹת בַּ/גִּלְעָד
  choice: Ramothi katika Gileadi
  rationale: Muundo wa Kiebrania una jina la mji na eneo lake; ‘katika’ huuwakilisha wazi, huku majina yakitoholewa kwa mwandiko wa Kiswahili.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ katika orodha za miji ya Walawi ni ardhi iliyoizunguka miji na iliyotumiwa pamoja nayo, hasa kwa malisho.
- source_word: מַחֲנַיִם
  choice: Mahanaimu
  rationale: Ni jina la mahali, limetoholewa kwa kufuata mfumo wa sauti na mwandiko wa Kiswahili.
theological_decisions:
- issue: Kiwango cha hatia kinachodokezwa na הָרֹצֵחַ
  choice: mtu aliyeua
  alternative: muuaji; mwuaji wa kukusudia
  rationale: Kifungu kinahusu mji wa makimbilio, na neno la Kiebrania hapa halipaswi kutafsiriwa kwa namna inayohukumu mapema kwamba tendo lilikuwa mauaji ya kukusudia. Tafsiri hii inadumisha mvutano wa kisheria wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kusomeka. Muundo wa orodha wa Kiebrania umehifadhiwa, na majina ya mahali yametoholewa kuwa Ramothi, Gileadi, na Mahanaimu.
