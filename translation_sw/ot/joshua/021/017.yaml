  text: 'na kutoka katika kabila la Benyamini: Gibeoni pamoja na malisho yake[a], na Geba pamoja na malisho yake;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ardhi ya matumizi ya pamoja” au “ardhi iliyo wazi”; yaani, ardhi inayozunguka kila mji.
