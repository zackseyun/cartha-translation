lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: na kutoka katika kabila la
  rationale: Katika muktadha wa kugawa miji kwa makabila, מַטֶּה humaanisha “kabila”; viambishi וּ na מִ vimetafsiriwa “na kutoka katika” ili kuendeleza orodha iliyotangulia.
- source_word: בִנְיָמִן
  choice: Benyamini
  rationale: Jina la kabila limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida.
- source_word: אֶת גִּבְעוֹן
  choice: Gibeoni
  rationale: אֶת ni alama ya yambwa na haihitaji neno tofauti katika Kiswahili; jina la mahali limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi iliyo wazi kuzunguka mji wa Walawi, hasa kwa matumizi ya malisho au ya pamoja. Tafsiri hii ni ya asili na wazi huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: גֶּבַע
  choice: Geba
  rationale: Jina la mahali limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: וְ/אֶת
  choice: na
  rationale: Kiunganishi וְ kinaunganisha miji katika orodha; אֶת ni alama ya yambwa isiyotafsiriwa moja kwa moja.
