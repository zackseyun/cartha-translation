translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Pamoja na” limetumiwa kuonyesha kwamba kila mji ulipewa pamoja na ardhi yake inayouzunguka. Alama ya tanbihi [a] imewekwa baada ya kutokea kwa kwanza kwa neno husika.
