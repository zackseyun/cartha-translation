  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kati ya mistari mirefu umetumiwa kuhifadhi maelezo ya Kiebrania kuhusu nafasi ya Wamerari miongoni mwa jamaa za Walawi.
