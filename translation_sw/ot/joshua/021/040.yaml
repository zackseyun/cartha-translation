base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: sw
  text: Jumla ya miji yote ya wana wa Merari[a], kwa kufuata jamaa zao—waliobaki miongoni mwa jamaa za Walawi[b]—ilikuwa kumi na miwili kwa kura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wa Merari” au “Wamerari.”
    reason: lexical_alternative
  - marker: b
    text: Au, “waliosalia kutoka katika jamaa za Walawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Miji yote
  rationale: עִיר inaweza kumaanisha mji au mji mdogo; “miji” ni neno la kawaida na linafaa katika orodha ya maeneo yaliyogawiwa.
- source_word: לִבְנֵי מְרָרִי
  choice: ya wana wa Merari
  rationale: “Wana wa Merari” huhifadhi muundo wa Kiebrania, huku katika muktadha huu wa nasaba ikieleweka pia kuwa ni wazao wake.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa kufuata jamaa zao
  rationale: מִשְׁפָּחָה humaanisha familia au ukoo; hapa kirai kinaonyesha mgawanyo uliofanywa kwa makundi yao ya kijamaa.
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: hao ndio waliobaki kati ya jamaa za Walawi
  rationale: Tafsiri hii huhifadhi wazo la wale waliobaki na uhusiano wao na kundi pana la jamaa za Walawi bila kuufanya ufafanuzi huo kuwa mahususi kuliko Kiebrania.
- source_word: וַיְהִי גּוֹרָלָם
  choice: ikiwa ndiyo fungu lao kwa kura
  rationale: גּוֹרָל inaweza kuwa kura au fungu linalopatikana kwa kura. Usemi huu wa Kiswahili unaonyesha matokeo ya ugawaji kwa kura kwa njia ya kawaida.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: miji kumi na miwili
  rationale: Mpangilio wa Kiswahili huweka idadi baada ya nomino na kuhifadhi hesabu kamili ya maandishi ya chanzo.
