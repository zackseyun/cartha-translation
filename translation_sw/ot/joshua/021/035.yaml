lexical_decisions:
- source_word: דִּמְנָה
  choice: Dimna
  rationale: Jina la mahali limetoholewa kwa mwandiko unaofaa Kiswahili badala ya kutafsiriwa.
- source_word: מִגְרָשֶׁהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili linamaanisha ardhi ya wazi iliyokuwa ya mji, hasa kwa ajili ya malisho; kiambishi cha umoja wa kike kimerejeshwa kwa kila mji kwa neno 'yake'.
- source_word: נַהֲלָל
  choice: Nahalali
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: עָרִים אַרְבַּע
  choice: miji minne
  rationale: Hii ni jumla ya idadi inayohitimisha orodha, na 'miji' hudumisha istilahi ya kawaida katika orodha za mgao za Yoshua.
