id: JOS.21.3
reference: Joshua 21:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: sw
  text: Basi Waisraeli wakawapa Walawi, kutoka katika urithi wao, miji hii pamoja na maeneo yake ya malisho, kama Yahweh alivyoagiza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “kulingana na kinywa cha Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: wakawapa
  rationale: Kitenzi נתן kina maana ya msingi ya “kutoa”; muundo huu wa masimulizi unaonyesha tendo lililofuata katika mfululizo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa maana ya neno kwa neno ni “wana wa Israeli,” hapa ni usemi wa kawaida wa kikabila unaomaanisha Waisraeli; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi, waliokuwa wapokeaji.
- source_word: מִנַּחֲלָתָם
  choice: kutoka katika urithi wao
  rationale: נחלה hapa ni sehemu ya nchi waliyopewa makabila kuwa milki yao; “urithi wao” huhifadhi dhana hiyo kwa ufupi.
- source_word: אֶל־פִּי יְהוָה
  choice: kama Yahweh alivyoagiza
  rationale: Usemi wa Kiebrania, kwa neno kwa neno “kulingana na kinywa cha Yahweh,” ni nahau yenye maana ya kutenda kwa agizo la Yahweh; Kiswahili hiki ni cha asili na sahihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: miji hii
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai chenye kiashiria.
- source_word: מִגְרְשֵׁיהֶן
  choice: maeneo yake ya malisho
  rationale: מגרשׁ humaanisha ardhi wazi iliyohusishwa na mji, hasa kwa matumizi ya malisho; kiwakilishi “yake” kinarejelea miji kama nomino ya ngeli ya 4 katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; “Yahweh” hulihifadhi wazi badala ya kuweka cheo mahali pake.
- issue: Ikiwa usemi בְנֵי יִשְׂרָאֵל uhifadhiwe kwa muundo wa kifamilia wa neno kwa neno
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Katika muktadha huu usemi huo ni jina la pamoja la watu wa Israeli, si msisitizo kuhusu wana wa kiume pekee. “Waisraeli” huwasilisha maana ya ethnonimu kwa Kiswahili cha kawaida bila kuingiza tofauti ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wa heshima, wa sasa na unaoeleweka kwa wasomaji wa kawaida. “Maeneo ya malisho” yanafafanua matumizi ya ardhi ya miji bila kuongeza maelezo yasiyokuwapo katika mstari.
