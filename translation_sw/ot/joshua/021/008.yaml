base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: sw
  text: Basi Waisraeli wakawapa Walawi miji hii pamoja na maeneo yake ya malisho, kama Yahwe alivyoamuru kwa mkono wa Musa[a], kwa kura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia Musa.” Usemi “kwa mkono wa Musa” ni nahau ya Kiebrania inayoonyesha kwamba amri ilitolewa kupitia kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: wakawapa
  rationale: Kitenzi נתן hapa kinaeleza tendo la kuwapa au kuwagawia Walawi miji; “wakawapa” ni cha moja kwa moja na kinaendeleza simulizi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa umbo ni “wana wa Israeli,” katika muktadha huu usemi huo unamaanisha jamii ya Israeli kwa ujumla; “Waisraeli” ni Kiswahili cha sasa, cha kawaida na kisichopotosha kuwa wanaume pekee.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Jina la kikundi cha kabila la Lawi katika umbo la wingi, likiwa walengwa wa miji iliyotolewa.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: miji hii
  rationale: Huhifadhi kiashiria cha miji maalumu iliyoorodheshwa katika muktadha uliotangulia.
- source_word: מִגְרְשֵׁיהֶן
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ ni ardhi iliyo wazi kandokando ya mji, hasa kwa malisho na matumizi ya pamoja; tafsiri hii inatoa maana yake halisi kwa Kiswahili kinachoeleweka.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Huonyesha kwamba utoaji huo ulifanywa kulingana na amri iliyotangulia.
- source_word: צִוָּה
  choice: alivyoamuru
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kuwa tendo lilifuata amri ya awali bila kulazimisha wakati uliopita timilifu wa Kiingereza.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: בְּיַד מֹשֶׁה
  choice: kwa mkono wa Musa
  rationale: Huhifadhi nahau ya Kiebrania ya uwakala uliopitishwa kwa Musa; tanbihi inafafanua maana yake ya kawaida.
- source_word: בַּגּוֹרָל
  choice: kwa kura
  rationale: Hurejelea ugawaji uliofanywa kwa kupiga kura; “kwa kura” ni usemi mfupi na wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia Tetragramatoni, jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kutumia cheo.
- issue: Uwakala katika בְּיַד מֹשֶׁה
  choice: kwa mkono wa Musa
  alternative: kupitia Musa
  rationale: Tafsiri kuu huhifadhi taswira ya nahau ya Kiebrania, huku tanbihi ikitoa maana yake ya uwakala bila kudokeza kwamba amri hiyo ilitoka kwa Musa mwenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. “Waisraeli” limetumiwa badala ya tafsiri sisisi “wana wa Israeli” ili kuwasilisha jamii nzima kwa lugha ya kawaida. Mpangilio wa mwisho “kwa kura” umehifadhiwa ili kubaki karibu na msisitizo na mpangilio wa chanzo.
