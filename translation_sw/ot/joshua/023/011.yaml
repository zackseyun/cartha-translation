  text: Therefore, take great care to love Yahweh your God.
translation:
  language: sw
  text: Kwa hiyo, jihadharini sana ili kumpenda Yahwe Mungu wenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: Kwa hiyo, jihadharini
  rationale: Kitenzi hiki kinatoa wito wa kujilinda kwa uangalifu. Kiunganishi וְ kinaeleweka hapa kama hitimisho la mawaidha yaliyotangulia, hivyo ‘Kwa hiyo’ kinafaa katika muktadha.
- source_word: מְאֹד
  choice: sana
  rationale: Kielezi hiki kinatilia mkazo kiwango kikubwa cha tahadhari na kinaambatana kwa kawaida na ‘jihadharini’ katika Kiswahili.
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: nguvu ya kujirejelea imejumuishwa katika ‘jihadharini’
  rationale: Kirai hiki kinawahusu wao wenyewe kwa ujumla, si ‘roho’ kama sehemu tofauti ya mtu. Kitenzi cha kujirejelea ‘jihadharini’ kinawasilisha maana hiyo kwa Kiswahili cha kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: לְאַהֲבָה
  choice: ili kumpenda
  rationale: Jina-kitenzi linaonyesha kusudi la kujihadhari kwao. ‘Ili kumpenda’ linaonyesha uhusiano huo wazi na kwa kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: 'Muundo wenye kiambishi cha nafsi ya pili wingi unaonyesha uhusiano: ‘Mungu wenu.’'
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika himizo la agano
  choice: Maana inayowarejelea wao wenyewe imejumuishwa katika ‘jihadharini’
  alternative: nafsi zenu; maisha yenu; ninyi wenyewe
  rationale: Katika nahau hii, נֶפֶשׁ inamaanisha mtu mzima anayepaswa kujilinda, wala hailazimishi wazo la ‘roho’ kama sehemu isiyo ya mwili. Tafsiri hii inadumisha uzito wa amri bila kuingiza fundisho la ziada kuhusu muundo wa binadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Jihadharini sana’ huhifadhi msisitizo wa Kiebrania, na ‘ili kumpenda’ huonyesha kusudi bila kutatua zaidi ya maandishi yanavyosema.
