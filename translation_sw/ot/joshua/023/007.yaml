    rationale: The Hiphil form is causative. “Msimfanye mtu yeyote aape kwa miungu hiyo” transparently preserves both the causative sense and the unstated object supplied for natural Swahili.
  - severity: low
    issue: Footnote a’s alternative, “msiliitie jina la miungu yao,” is not the most natural construction for invoking a name.
    rationale: “Msiliite jina la miungu yao” naturally expresses calling on/invoking the name while retaining the singular Hebrew “name.”
