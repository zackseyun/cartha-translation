  text: לְ/בִלְתִּי בוֹא֙ בַּ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וּ/בְ/שֵׁ֨ם אֱלֹהֵי/הֶ֤ם לֹא תַזְכִּ֨ירוּ֙ וְ/לֹ֣א תַשְׁבִּ֔יעוּ וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִֽשְׁתַּחֲו֖וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: sw
  text: ili msije kuingia miongoni mwa mataifa haya, haya yaliyobaki pamoja nanyi, wala msilitaje jina la miungu yao[a], wala msimfanye mtu yeyote aape kwa miungu hiyo[b], wala msiitumikie miungu hiyo, wala msiisujudie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiliite jina la miungu yao.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutaja” au, katika muktadha huu, “kuliitia.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “msisababishe kuapa.” Mtendwa hajaelezwa, hivyo inaweza kumaanisha kumfanya mtu mwingine aape kwa miungu hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: ili msiingie kati ya mataifa haya
  rationale: Muundo לְבִלְתִּי pamoja na kitenzi-jina unaonyesha kusudi la kuzuia. ‘Msiingie kati ya’ linafuata maana ya בוא pamoja na ב huku likiacha wazi kama kinachosisitizwa ni kuingia kimahali au kujihusisha nao.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: haya yaliyobaki pamoja nanyi
  rationale: ‘Yaliyobaki’ linaonyesha hali ya mataifa hayo kuwa mabaki, na ‘pamoja nanyi’ linaakisi אִתְּכֶם moja kwa moja.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: wala msilitaje jina la miungu yao
  rationale: Katika Hifili, הזכיר linaweza kumaanisha kutaja au kulitumia jina kwa kulitia katika kauli ya kidini. ‘Msilitaje’ ndilo chaguo la moja kwa moja; uwezekano wa ‘kuliitia’ umehifadhiwa katika tanbihi.
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: wala msimwapishe mtu yeyote kwa miungu hiyo
  rationale: 'Hifili ya שׁבע ni ya kusababisha: kumfanya mtu aape. ‘Mtu yeyote’ limeongezwa kwa uwazi kwa kuwa mtendwa hajaelezwa katika Kiebrania.'
- source_word: וְלֹא תַעַבְדוּם
  choice: wala msiitumikie miungu hiyo
  rationale: עבד ni ‘kutumikia,’ ikiwa ni pamoja na huduma ya kidini. Tafsiri hii inatofautisha tendo hilo na kusujudu katika kishazi kinachofuata.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: wala msiisujudie
  rationale: Kitenzi שׁחה katika muundo huu kinaonyesha kujinama au kujilaza chini mbele ya mwingine. ‘Kusujudia’ ni usemi wa kawaida na wenye hadhi unaohifadhi tendo halisi badala ya kulifupisha kuwa ‘kuabudu.’
theological_decisions:
- issue: Matendo yanayohusiana na ibada ya sanamu
  choice: 'Kuhifadhi mfuatano wa makatazo: kutaja, kumwapisha mtu, kutumikia, na kusujudia.'
  alternative: Kuyajumlisha yote kwa neno la jumla ‘kuabudu.’
  rationale: Kiebrania kinatumia vitenzi tofauti vinavyoonyesha matendo mahususi ya utii kwa miungu ya mataifa. Kuyahifadhi huepuka kupunguza mvutano na nguvu halisi ya onyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Marudio ya ‘mataifa haya, haya yaliyobaki’ yamehifadhiwa kwa sababu yapo katika Kiebrania na yanatia mkazo. ‘Miungu hiyo’ limerudiwa ili marejeo ya viwakilishi yawe wazi kwa Kiswahili cha sasa.
