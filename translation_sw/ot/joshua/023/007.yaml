  terminology: “Mataifa,” “miungu,” “kutumikia,” and “kusujudia” are appropriate, and the distinct cultic actions remain distinct. The revised footnote uses “msiliite jina la miungu yao” for the alternative sense ‘invoke/call on the name.’
