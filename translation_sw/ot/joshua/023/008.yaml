  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: sw
  text: Bali shikamaneni na Yahweh Mungu wenu[a], kama mlivyofanya mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mng’ang’anie Yahweh Mungu wenu”; kitenzi cha Kiebrania kinaonyesha kushikamana kwa karibu na kwa uaminifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Bali
  rationale: Chembe hizi zinaonyesha utofautishaji mkali na onyo lililotangulia; “Bali” ni ya asili na yenye hadhi katika muktadha huu.
- source_word: בַּ/יהוָה
  choice: na Yahweh
  rationale: Pamoja na kitenzi דבק, kihusishi ב huonyesha yule ambaye mtu anashikamana naye; Kiswahili hutumia kwa kawaida “shikamana na.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי/כֶם
  choice: Mungu wenu
  rationale: Katika kumrejelea Yahweh, אֱלֹהִים ina maana ya umoja; kiambishi kinaonyesha uhusiano wake na wasikilizaji.
- source_word: תִּדְבָּקוּ
  choice: mshikamane
  rationale: דבק hapa hueleza kushikamana kwa karibu na kwa uaminifu wa agano; “mshikamane” huhifadhi maana hiyo ya kimahusiano na pia nguvu ya himizo.
- source_word: כַּ/אֲשֶׁר עֲשִׂיתֶם
  choice: kama mlivyofanya
  rationale: Kirai hiki kinalinganisha agizo na mwenendo wao uliotangulia hadi wakati wa kusema.
- source_word: עַד הַ/יּוֹם הַ/זֶּה
  choice: mpaka leo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mwendelezo hadi siku ya sasa ya msemaji.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya agano katika דבק
  choice: mshikamane
  alternative: mng'ang'anie; mfuate kwa uaminifu
  rationale: “Mshikamane” huhifadhi picha ya ukaribu na uaminifu bila kuifanya maana kuwa tafsiri ya kimadhehebu au maelezo yaliyo wazi kupita maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi wa nafsi ya pili umehifadhiwa. “Bali” inaweka wazi utofautishaji na mstari uliotangulia, huku “mshikamane” ikitoa himizo la kawaida na la kimahusiano.
