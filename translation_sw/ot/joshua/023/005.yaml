  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: sw
  text: Yahwe, Mungu wenu, yeye mwenyewe atawafukuza mbele yenu na kuwanyang’anya milki yao mbele yenu. Nanyi mtaimiliki nchi yao[a], kama vile Yahwe, Mungu wenu, alivyowaambia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nanyi mtairithi nchi yao.” Kitenzi cha Kiebrania kinaweza kumaanisha “kurithi” au “kumiliki”; hapa “mtaimiliki” limetumiwa kwa sababu ya muktadha wa kuitwaa nchi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama vile Yahwe, Mungu wenu, alivyowaahidi.” Kiebrania kinasema kihalisi “alivyowaambia,” lakini katika muktadha huu maneno hayo ni ahadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano la Mungu lililo katika maandishi ya Kiebrania, kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Kiambishi cha nafsi ya pili wingi kinawahusu Waisraeli, na pamoja na Yahwe nomino hii ina maana ya umoja.
- source_word: הוּא
  choice: ndiye mwenyewe
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; usemi huu unasisitiza kwamba Yahwe mwenyewe ndiye atakayetenda.
- source_word: יֶהְדֳּפֵם
  choice: atakayewafukuza
  rationale: Kitenzi kinamaanisha kuwasukuma au kuwafukuza kwa nguvu; ‘kuwafukuza’ ni cha asili katika muktadha wa kuyaondoa mataifa nchini.
- source_word: מִפְּנֵיכֶם / מִלִּפְנֵיכֶם
  choice: mbele yenu
  rationale: Usemi huu unahifadhi picha ya Kiebrania ya mataifa kuondolewa mbele ya Israeli bila kuwa mgumu kueleweka.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: na kuwanyang’anya milki yao
  rationale: Hifili ya ירש hapa inaonyesha kuwafanya waliokuwa wamiliki wapoteze milki; tafsiri hii inaitofautisha na ‘kuwafukuza’ na kuhifadhi wazo la umiliki wa nchi.
- source_word: וִירִשְׁתֶּם
  choice: Nanyi mtaimiliki
  rationale: Qali ya ירש inaweza kumaanisha kurithi au kutwaa milki. Katika muktadha huu, ‘mtaimiliki’ linaonyesha Israeli kuipata nchi huku uwezekano wa maana ‘kurithi’ ukitajwa katika tanbihi.
- source_word: אֶת אַרְצָם
  choice: nchi yao
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nchi iliyokuwa ikikaliwa na mataifa hayo.
- source_word: כַּאֲשֶׁר דִּבֶּר ... לָכֶם
  choice: kama vile ... alivyowaambia
  rationale: דבר kimsingi ni kusema au kunena. ‘Alivyowaambia’ ni Kiswahili cha kawaida kinachohifadhi tendo la kusema, bila kuficha kwamba kauli hiyo ilikuwa ahadi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina maalumu la Mungu. ‘Yahwe’ hulihifadhi moja kwa moja bila kulibadili kuwa cheo kama ‘Bwana’.
- issue: Maana tofauti za mzizi ירש katika vishazi viwili
  choice: kuwanyang’anya milki yao / mtaimiliki nchi yao
  alternative: kutumia ‘kuwafukuza’ katika sehemu zote mbili, au ‘mtaurithi’ katika sehemu ya pili
  rationale: 'Kiebrania kinatumia mzizi mmoja katika miundo tofauti: Yahwe anawafanya wenyeji wapoteze milki, kisha Israeli inaipata. Maneno tofauti yanahifadhi utofauti huo wa kisarufi na wa umiliki bila kuondoa maana mbadala ya ‘kurithi’.'
- issue: Ikiwa דִּבֶּר itafsiriwe kama kusema au kuahidi
  choice: alivyowaambia
  alternative: alivyowaahidi
  rationale: Kitenzi chenyewe ni ‘sema/nena,’ ingawa katika muktadha huu maneno hayo yana nguvu ya ahadi. Matini kuu inahifadhi maana ya msingi, na tanbihi inaonyesha maana ya kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Ndiye mwenyewe’ huhifadhi mkazo wa Kiebrania; urudiaji wa ‘mbele yenu’ umeachwa ili kuonyesha urudiaji wa chanzo. Alama zote za tanbihi zimewekwa mahali zinapohusu katika matini kuu.
