base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: sw
  text: Kwa maana Yahweh ameyafukuza kutoka mbele yenu mataifa makubwa na yenye nguvu[a]; nanyi, hakuna mtu aliyesimama mbele yenu[b] hata leo hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ameyanyang’anya nchi” au “ameyaondoa.” Kitenzi cha Kiebrania kinaweza kukazia kuyaondoa mataifa katika nchi ili Israeli ipate kuimiliki.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “hakuna mtu aliyesimama mbele yenu,” ni nahau yenye maana kwamba hakuna mtu aliyeweza kuwastahimili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: ameyafukuza
  rationale: Katika muktadha wa kuitwaa nchi, kausativi ya ירשׁ ina maana ya kuwaondoa au kuwafukuza wakaaji ili wengine waimiliki. “Ameyafukuza” ni Kiswahili cha kawaida kinachohifadhi tendo la kuyaondoa mataifa hayo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi “Yahweh,” bila kulibadili kuwa cheo.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Usemi huu unaonyesha kwamba mataifa yaliondolewa kutoka mbele ya Israeli. “Mbele yenu” huhifadhi taswira ya Kiebrania na inaeleweka katika muktadha wa ushindi.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: mataifa makubwa na yenye nguvu
  rationale: “Makubwa” huwasilisha ukubwa au umuhimu, na “yenye nguvu” huwasilisha uwezo mkubwa wa kijeshi; usemi huu ni wa asili na wenye heshima katika Kiswahili.
- source_word: וְאַתֶּם
  choice: nanyi
  rationale: Kiwakilishi kilichotangulizwa katika Kiebrania kina mkazo. “Nanyi” huonyesha mgeuko wa kuzungumzia hali ya Israeli bila kuongeza upinzani usio wazi katika kiunganishi.
- source_word: לֹא עָמַד אִישׁ
  choice: hakuna mtu aliyesimama
  rationale: Tafsiri hii inahifadhi picha ya mtu kusimama mbele ya mpinzani, huku ikitoa kwa Kiswahili cha kawaida maana ya kwamba hakuna hata mmoja aliyefaulu kufanya hivyo.
- source_word: בִּפְנֵיכֶם
  choice: mbele yenu
  rationale: Katika muktadha wa vita, kusimama mbele ya mtu ni kumpinga au kustahimili mashambulizi yake. Tafsiri ya moja kwa moja imehifadhiwa, na tanbihi inaeleza maana ya nahau.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hata leo hii
  rationale: Huu ni usemi wa kawaida unaoonyesha kwamba hali hiyo imeendelea mpaka wakati wa usemi wa Yoshua.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo “mbele yenu” umehifadhiwa katika sehemu zote mbili ili kudumisha urudiaji na taswira ya Kiebrania; maana yake ya kijeshi imefafanuliwa katika tanbihi.
