reference: Joshua 23:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: sw
  text: Na tazama, leo ninakwenda katika njia ya ulimwengu wote[a]. Nanyi mnajua kwa mioyo yenu yote na kwa nafsi zenu zote kwamba katika maneno yote mema aliyoyasema Yahwe Mungu wenu kuwahusu, hata neno moja halikukosa kutimia[b]. Yote yametimia kwenu; hata neno moja katika hayo halikukosa kutimia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Njia ya ulimwengu wote” ni nahau ya Kiebrania inayomaanisha mwisho unaowapata wanadamu wote, hasa kifo.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania kihalisi: “hata neno moja halikuanguka.” Maana yake ni kwamba hakuna neno hata moja lililoshindwa kutimia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inahifadhi kiunganishi na usemi wa kuvuta fikira kwa uzito, huku ikibaki katika Kiswahili cha heshima kinachoeleweka.
- source_word: אָנֹכִי הוֹלֵךְ הַיּוֹם
  choice: leo ninakwenda
  rationale: Inafuata hali ya tendo linaloendelea au lililo karibu kutokea bila kufafanua moja kwa moja kuwa ‘ninakaribia kufa’; kirai kinachofuata ndicho kinachodokeza kifo.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: katika njia ya dunia yote
  rationale: Inahifadhi sitiari ya Kiebrania kuhusu mwisho wa kawaida wa wanadamu badala ya kuibadilisha moja kwa moja kuwa ‘kufa.’
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: kwa mioyo yenu yote na kwa nafsi zenu zote
  rationale: Inahifadhi jozi ya ‘moyo’ na ‘nafsi’ pamoja na viambishi vya wingi vya Kiebrania.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: hata neno moja halikukosa kutimia
  rationale: Kitenzi נפל ni ‘kuanguka’ kihalisi, lakini katika nahau hii humaanisha kushindwa au kutotimia. Kiswahili hiki cha kawaida kinaeleza maana hiyo huku ‘neno’ likihifadhi uhusiano na yale Yahwe aliyosema; taswira halisi imewekwa katika tanbihi.
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: kati ya maneno yote mema
  rationale: ‘Maneno’ yanahifadhi kiungo cha kile kilichosemwa na huepuka kuongeza tafsiri finyu ya ‘ahadi,’ ingawa maneno hayo yana nguvu ya ahadi katika muktadha.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם עֲלֵיכֶם
  choice: ambayo Yahwe Mungu wenu alisema kuwahusu
  rationale: ‘Kuwahusu’ inaakisi maana ya עַל kama ‘kuhusu’ au ‘juu ya’ badala ya kuifanya kuwa tu ‘aliwaambia.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina la agano יהוה kwa jina lenyewe badala ya cheo.
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: Yote yametimia kwenu
  rationale: Kiebrania kina taswira ya ‘kuja kwao,’ lakini hapa maana yake ni kwamba kila neno jema limefikia utimilifu. ‘Yametimia kwenu’ ni Kiswahili cha asili na huonyesha walengwa wa utimilifu huo.
theological_decisions:
- issue: Uwakilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. ‘Yahwe’ huhifadhi jina la agano bila kulibadili kuwa cheo wala kuingiza matamshi ya kimapokeo yasiyo na uhakika sawa.
- issue: Je, דְּבָרִים itafsiriwe kuwa ‘maneno’ au ‘ahadi’?
  choice: maneno
  alternative: ahadi
  rationale: ‘Maneno’ yanahifadhi upana wa דָּבָר na uhusiano wa moja kwa moja na kitenzi ‘alisema.’ ‘Ahadi’ ni ufafanuzi unaowezekana, lakini ungepunguza kwa kiasi fulani utata wa asili.
- issue: Nahau לֹא נָפַל דָּבָר אֶחָד
  choice: hata neno moja halikukosa kutimia
  alternative: hata neno moja halikuanguka
  rationale: Tafsiri kuu inaeleza maana ya nahau kwa Kiswahili cha kawaida bila kudai zaidi ya kwamba maneno ya Yahwe yalitimia. Tafsiri halisi imehifadhiwa katika tanbihi ili taswira ya asili isipotee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na cha sasa. Muundo wa sentensi umewekwa wazi kwa wasomaji wa kawaida, huku sitiari ya ‘njia ya dunia yote,’ jozi ya ‘moyo’ na ‘nafsi,’ marudio ya mwisho, na uhusiano kati ya ‘maneno’ na ‘alisema’ vikihifadhiwa.
