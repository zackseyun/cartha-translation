  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: sw
  text: Ikawa, baada ya siku nyingi[a], baada ya Yahwe kuwapa Israeli pumziko dhidi ya maadui wao wote wa pande zote, Yoshua alikuwa mzee, amesonga sana katika miaka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya muda mrefu.”
    reason: lexical_alternative
  - marker: b
    text: Nahau ya Kiebrania inayomaanisha umri wa juu; kwa neno halisi, “alikuja katika siku.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutanguliza tukio au hatua mpya katika simulizi; “Ikawa” ni fupi, yenye hadhi, na inaakisi kazi ya muundo wa Kiebrania.
- source_word: מִיָּמִים רַבִּים
  choice: baada ya siku nyingi
  rationale: Inahifadhi picha ya Kiebrania huku ikieleza wazi kwamba muda mwingi ulikuwa umepita.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: baada ya
  rationale: Ni kiunganishi cha kawaida cha wakati kinachoonyesha tukio lililotangulia hali ya Yoshua iliyoelezwa baadaye.
- source_word: הֵנִיחַ
  choice: kuwapa ... pumziko
  rationale: Katika kausativi hapa, kitenzi kina maana ya kuwapa utulivu au nafuu kutokana na mashambulizi ya maadui.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: לְיִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa na watu limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: kutoka kwa maadui wao wote waliowazunguka
  rationale: Huwasilisha ukamilifu wa pumziko na pia wazo la kijiografia kwamba maadui walikuwa pande zote.
- source_word: וִיהוֹשֻׁעַ זָקֵן
  choice: Yoshua alikuwa amezeeka
  rationale: “Alikuwa amezeeka” ni Kiswahili cha sasa na cha kawaida kinachoonyesha hali ya uzee iliyokuwa imefikiwa.
- source_word: בָּא בַּיָּמִים
  choice: alikuwa na umri mkubwa
  rationale: Hutoa maana ya nahau ya Kiebrania kwa Kiswahili cha asili bila kupoteza msisitizo wake kuhusu uzee mkubwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Marudio ya “baada ya” yamehifadhiwa kwa sababu yanaakisi muundo wa wakati wa maandishi ya Kiebrania; “pumziko” linadumisha wazo la nafuu na usalama kutoka kwa maadui.
