source:
  edition: WLC
  text: וַ/יִּקְרָ֤א יְהוֹשֻׁ֨עַ֙ לְ/כָל יִשְׂרָאֵ֔ל לִ/זְקֵנָי/ו֙ וּ/לְ/רָאשָׁ֔י/ו וּ/לְ/שֹׁפְטָ֖י/ו וּ/לְ/שֹֽׁטְרָ֑י/ו וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אֲנִ֣י זָקַ֔נְתִּי בָּ֖אתִי בַּ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: sw
  text: Kisha Yoshua akawaita[a] Israeli yote—wazee wake, wakuu wake[b], waamuzi wake na maofisa wake—akawaambia, “Mimi nimezeeka; umri wangu umesonga sana[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawakusanya.” Kitenzi cha Kiebrania hapa kina maana ya kuwaita watu waje kwake.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “vichwa vyake,” yaani watu wake wakuu au viongozi wake.
    reason: lexical_alternative
  - marker: c
    text: Nahau ya Kiebrania ni “nimeingia katika siku,” yaani nimefikia umri mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Katika muundo huu, kitenzi קרא pamoja na לְ kina maana ya kuwaita watu waje au wakusanyike. ‘Akawaita’ ni Kiswahili cha kawaida na cha heshima; wazo la kuwakusanya linaeleweka kutokana na muktadha.
- source_word: לְכָל יִשְׂרָאֵל
  choice: Israeli yote
  rationale: Huhifadhi rejeo la taifa zima kama jumuiya. Orodha inayofuata inaonyesha kwamba viongozi wake ndio walioliwakilisha taifa, bila kufuta usemi mpana wa Kiebrania.
- source_word: לִזְקֵנָיו
  choice: wazee wake
  rationale: Kiambishi cha nafsi ya tatu umoja kinarejelea Israeli kama taifa la kijumuiya. ‘Wazee’ ni neno linaloeleweka kwa viongozi wenye mamlaka katika jamii.
- source_word: וּלְרָאשָׁיו
  choice: wakuu wake
  rationale: רָאשִׁים, kihalisi ‘vichwa,’ hapa humaanisha watu wakuu au viongozi. ‘Wakuu’ huhifadhi tofauti yao na wazee, waamuzi na maofisa bila kutumia taswira isiyo ya kawaida katika Kiswahili.
- source_word: וּלְשֹׁפְטָיו
  choice: waamuzi wake
  rationale: Neno linalotokana na שׁפט hapa linataja wenye jukumu la kutoa hukumu; ‘waamuzi’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וּלְשֹׁטְרָיו
  choice: maofisa wake
  rationale: שֹׁטְרִים ni maofisa wa utawala walio chini ya viongozi wakuu. ‘Maofisa’ linafaa katika mazingira ya kiutawala bila kulibana neno kwa maana ya waandishi pekee.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: akawaambia
  rationale: Huu ni utangulizi wa kawaida wa maneno ya moja kwa moja na unasomeka kwa ufasaha katika simulizi la Kiswahili.
- source_word: אֲנִי זָקַנְתִּי
  choice: Mimi nimezeeka
  rationale: Huhifadhi msisitizo wa kiwakilishi אֲנִי na hali ya sasa iliyotokana na mchakato wa kuzeeka.
- source_word: בָּאתִי בַּיָּמִים
  choice: umri wangu umesonga sana
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha nahau ya Kiebrania kuhusu kufikia uzee mkubwa, huku tanbihi ikihifadhi taswira yake halisi.
theological_decisions:
- issue: Rejeo la ‘Israeli yote’ likifuatiwa na orodha ya viongozi
  choice: Kuhifadhi ‘Israeli yote’ na kisha kutaja wazee, wakuu, waamuzi na maofisa wake kama wawakilishi wake.
  alternative: Kufupisha kuwa ‘viongozi wote wa Israeli.’
  rationale: Kiebrania kinataja wazi Israeli yote na baadaye makundi ya viongozi. Tafsiri haifuti mvutano huo kwa kugeuza taifa lote moja kwa moja kuwa viongozi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. ‘Israeli yote’ limetumiwa kama jina la taifa la kijumuiya; ‘wakuu’ na ‘maofisa’ ni maneno ya sasa yanayoeleweka bila kupoteza mpangilio wa nyadhifa.
