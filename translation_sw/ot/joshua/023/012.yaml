base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: sw
  text: Kwa maana ikiwa kweli mtarudi nyuma na kushikamana[a] na mabaki ya mataifa haya, mataifa haya yaliyobaki pamoja nanyi, na kuoana nao, na kuchangamana nao, nao wakachangamana nanyi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujifungamanisha kwa uthabiti.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno kwa neno kinaweza kutafsiriwa, “mkaingia ndani yao, nao ndani yenu.” Nahau hiyo inaweza kumaanisha kwenda miongoni mwao au kuwa na mahusiano nao, si kusogea mahali fulani tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Kwa maana ikiwa
  rationale: Katika muktadha huu, kifungu hiki kinaendeleza onyo la mstari uliotangulia na kuanzisha sharti; “Kwa maana ikiwa” kinahifadhi uhusiano huo.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: ikiwa kweli mtarudi nyuma
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichopigwa huongeza msisitizo. “Kweli” huonyesha msisitizo huo, na “kurudi nyuma” hudokeza kuacha uaminifu wa agano bila kulazimisha istilahi ya kimadhehebu.
- source_word: וּדְבַקְתֶּם
  choice: na kushikamana
  rationale: Kitenzi דבק huonyesha kujifungamanisha kwa karibu. “Kushikamana” ni cha kawaida, chenye nguvu ya kimahusiano, na kinaweza pia kutumiwa katika lugha ya agano.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: na mabaki ya mataifa haya
  rationale: יֶתֶר ni kile kilichosalia. “Mabaki” hapa humaanisha tu mataifa yaliyosalia, bila kuingiza maana chanya ya kiteolojia.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: yaani mataifa haya yaliyobaki pamoja nanyi
  rationale: Maneno haya yanafafanua tena mataifa yanayozungumziwa na kudumisha wazo la kuwapo kwao pamoja na Israeli; “yaani” hufanya urudiaji wa Kiebrania ueleweke kwa Kiswahili cha kawaida.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: na kuoana nao
  rationale: Muundo wa hitpaeli wa חתן unamaanisha kuingia katika mahusiano ya ndoa baina ya makundi. “Kuoana nao” ni usemi wa sasa na wa moja kwa moja.
- source_word: וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: na kuchangamana nao, nao wakachangamana nanyi
  rationale: Nahau ya בוא ב inapohusu watu inaweza kueleza kuingia miongoni mwao na kuwa na mahusiano nao. “Kuchangamana” huhifadhi wazo pana la mwingiliano wa pande zote bila kulifanya kuwa tendo la kimwili au la kingono pekee.
theological_decisions:
- issue: Mwelekeo wa kiagano katika שׁוֹב תָּשׁוּבוּ
  choice: mtarudi nyuma
  alternative: mtarudi
  rationale: Muktadha ni onyo kuhusu kuacha uaminifu na kujifungamanisha na mataifa yaliyosalia. “Kurudi nyuma” huhifadhi mwelekeo huo hasi, ilhali “kurudi” peke yake hauelezi upande wa mabadiliko.
- issue: Uwezekano wa kulipa neno יֶתֶר maana ya kiteolojia isiyokusudiwa
  choice: mabaki
  alternative: yale yaliyosalia
  rationale: “Mabaki” ni tafsiri fupi ya kile kilichosalia; hapa halitumiki kama jina la kundi teule au lililookolewa. Muktadha unazuia maana hiyo kuingizwa.
- issue: Upana wa nahau וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: kuchangamana nao, nao wakachangamana nanyi
  alternative: kuingia kati yao, nao wakaingia kati yenu
  rationale: Baada ya ndoa kutajwa wazi, nahau hii inaweza kueleza ushirikiano na mwingiliano mpana wa pande zote. Tafsiri iliyochaguliwa huepuka kuibana kuwa tasfida ya ngono, huku tanbihi ikihifadhi picha halisi na uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa onyo la masharti na sentensi inayoendelea umehifadhiwa; alama ya koma mwishoni inaonyesha kuwa wazo linaendelea katika mstari unaofuata.
