base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: sw
  text: Tazameni, nimewagawia kwa kura mataifa haya yaliyosalia kuwa urithi wa makabila yenu, kuanzia Yordani, pamoja na mataifa yote niliyoyakatilia mbali, hadi Bahari Kuu upande wa machweo ya jua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “upande wa kuingia kwa jua,” yaani, upande wa magharibi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Tazameni
  rationale: Amri ya wingi ya ראה inavuta fikira kwa msisitizo; “Tazameni” ni ya sasa, yenye heshima, na inadumisha nguvu ya usemi.
- source_word: הִפַּלְתִּי
  choice: nimewagawia kwa kura
  rationale: Hifili ya נפל hapa ni nahau ya kugawa sehemu kwa kura. Tafsiri hii inaonyesha wazi tendo la ugawaji bila kutumia kauli halisi isiyoeleweka ya ‘kuangusha.’
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: mataifa haya yaliyosalia
  rationale: Inadumisha muundo wa kirai cha kitenzi cha Kiebrania na kueleza mataifa ambayo bado yalikuwapo katika nchi.
- source_word: בְּנַחֲלָה לְשִׁבְטֵיכֶם
  choice: kuwa urithi wa makabila yenu
  rationale: נחלה katika Yoshua humaanisha milki ya ardhi inayorithiwa; usemi huu ni wa kawaida katika Kiswahili na unadumisha dhana hiyo.
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: kuanzia Yordani ... hadi Bahari Kuu
  rationale: Ingawa Kiebrania kina kiunganishi kabla ya ‘Bahari Kuu,’ muktadha unaonyesha eneo linaloenea kutoka mpaka mmoja hadi mwingine.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: pamoja na mataifa yote niliyoyaangamiza
  rationale: כרת katika muktadha huu humaanisha kuondoa kabisa au kuangamiza. “Niliyoyaangamiza” huwasilisha maana kwa Kiswahili cha kawaida, huku “pamoja na” ikiunganisha mataifa hayo na yale yaliyosalia.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: upande wa machweo ya jua
  rationale: Usemi huu ni halisi kwa maana ya kuingia au kutua kwa jua na ni nahau ya upande wa magharibi; tafsiri inadumisha taswira ya Kiebrania.
