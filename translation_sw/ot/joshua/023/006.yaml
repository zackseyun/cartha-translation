  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/חֲזַקְתֶּ֣ם מְאֹ֔ד לִ/שְׁמֹ֣ר וְ/לַ/עֲשׂ֔וֹת אֵ֚ת כָּל הַ/כָּת֔וּב בְּ/סֵ֖פֶר תּוֹרַ֣ת מֹשֶׁ֑ה לְ/בִלְתִּ֥י סוּר מִמֶּ֖/נּוּ יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: sw
  text: Kwa hiyo, iweni imara sana kushika na kutenda yote yaliyoandikwa katika Kitabu cha Sheria ya Musa[a], ili msikengeuke kutoka humo kwenda kulia wala kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kitabu cha Mafundisho ya Musa.” Neno la Kiebrania torah linaweza kumaanisha “mafundisho” au “maelekezo,” na pia “sheria”; hapa linarejelea hasa mkusanyo wa sheria na maagizo yaliyotolewa kupitia Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: iweni imara sana
  rationale: Kitenzi חזק kinaelekezwa kwa watu wengi na hapa kina nguvu ya himizo. “Iweni imara sana” huhifadhi wingi na msisitizo wa מְאֹד kwa Kiswahili cha kawaida na chenye heshima.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: kushika na kutenda
  rationale: Katika muktadha wa maagizo ya agano, שׁמר ni kuyatunza kwa utii, na עשה ni kuyatekeleza. “Kushika na kutenda” huhifadhi jozi ya vitenzi vya Kiebrania bila kuviunganisha kuwa wazo moja tu.
- source_word: כָּל הַכָּתוּב
  choice: yote yaliyoandikwa
  rationale: Hueleza kwa ujumla mambo yote yaliyo katika maandishi; umbo hili ni la asili na wazi katika Kiswahili.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: katika Kitabu cha Sheria ya Musa
  rationale: סֵפֶר inaweza kuwa kitabu au gombo, lakini “Kitabu” ni neno linaloeleweka vizuri. Katika muktadha huu תּוֹרָה hurejelea mkusanyo wa sheria na maagizo yanayohusishwa na Musa.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: bila kuiacha kwa kugeuka
  rationale: Kirai hiki kinaonyesha kutokengeuka kutoka katika kitu kilichotajwa. Kiwakilishi cha umoja katika “kuiacha” hudumisha rejeo la umoja la sheria hiyo kama mwili mmoja wa maandishi.
- source_word: יָמִין וּשְׂמֹאול
  choice: kwenda kulia wala kushoto
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kukengeuka upande wowote. “Kulia wala kushoto” huhifadhi taswira hiyo, huku “wala” ikilingana na ukanushi uliotangulia.
theological_decisions:
- issue: Tafsiri ya תּוֹרָה katika muktadha wa agano la Musa
  choice: Sheria katika “Kitabu cha Sheria ya Musa”
  alternative: Mafundisho katika “Kitabu cha Mafundisho ya Musa”
  rationale: תּוֹרָה inaweza kumaanisha mafundisho au maelekezo kwa upana, lakini katika fomula hii inarejelea hasa mkusanyo wa sheria na maagizo ya agano yanayohusishwa na Musa. Tanbihi huhifadhi maana mbadala ya kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wingi wa wahutubiwa umeonyeshwa kwa “iweni.” Muundo umehifadhi himizo, jozi ya “kushika na kutenda,” na nahau ya kutogeuka kulia wala kushoto.
