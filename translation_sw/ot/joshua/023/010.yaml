  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: sw
  text: Mtu mmoja kati yenu atawafukuza watu elfu moja,[a] kwa sababu Yahwe, Mungu wenu, ndiye anayewapigania, kama alivyosema nanyi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawafuatilia watu elfu moja.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kama alivyowaahidi”; kwa maana halisi zaidi, “kama alivyosema nanyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד מִכֶּם
  choice: Mtu mmoja kati yenu
  rationale: Huwasilisha umoja wa mtu mmoja na maana ya kwamba anatoka miongoni mwa kundi linalozungumziwa; Kiswahili hakihitaji kuweka jinsia wazi hapa.
- source_word: יִרְדָּף
  choice: atawafukuza
  rationale: Kitenzi רדף katika muktadha wa kijeshi humaanisha kufukuza au kufuatilia adui; kiambishi -wa- kinaeleza kwa kawaida kwamba hao elfu moja ni watu.
- source_word: אָלֶף
  choice: watu elfu moja
  rationale: Idadi imehifadhiwa moja kwa moja, huku 'watu' ikiongezwa kwa uwazi wa kawaida wa Kiswahili bila kubadili maana.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hutambulisha sababu ya ushindi wa Israeli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa konsonanti YHWH katika Kiebrania, kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni tafsiri ya moja kwa moja ya muundo wenye kiambishi cha nafsi ya pili wingi.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: ndiye anayewapigania
  rationale: '''Ndiye'' huhifadhi msisitizo wa הוּא, na ''anayewapigania'' huonyesha kwamba Mungu ndiye anayepigana kwa niaba yao.'
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: kama alivyowaambia
  rationale: Huhifadhi maana halisi ya kusema kwao bila kuibadili kimya kimya kuwa 'kuwaahidi,' ingawa muktadha unaweza kuwa wa ahadi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano YHWH, hivyo jina lenyewe limehifadhiwa badala ya kubadilishwa kuwa cheo.
- issue: Lugha ya uwakilishi katika אִישׁ אֶחָד
  choice: Mtu mmoja
  alternative: Mwanamume mmoja
  rationale: Ingawa nomino ya Kiebrania ni ya kiume kisarufi, katika kauli hii mtu huyo anawakilisha mmoja yeyote miongoni mwa Israeli; 'mtu mmoja' ni ya asili na haiingizii msisitizo wa jinsia usio wa lazima katika Kiswahili.
- issue: Nguvu ya promisi katika דִּבֶּר לָכֶם
  choice: kama alivyowaambia
  alternative: kama alivyowaahidi
  rationale: Kitenzi chenyewe ni 'alisema/alizungumza.' Tafsiri haifungi uwezekano wa maana ya ahadi, lakini pia haiiongezi moja kwa moja katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi na ya kawaida; msisitizo wa Kiebrania umehifadhiwa kwa 'ndiye,' na lugha ya kijeshi kwa 'atawafukuza' na 'anayewapigania.'
