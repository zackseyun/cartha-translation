source:
  edition: WLC
  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: sw
  text: Jueni kwa hakika kwamba Yahwe Mungu wenu hataendelea kuyafukuza mataifa haya mbele yenu[a], lakini yatakuwa mtego na tanzi kwenu, mjeledi katika pande zenu[b] na miiba machoni mwenu, mpaka mtakapoangamia kutoka katika nchi hii nzuri ambayo Yahwe Mungu wenu amewapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatawafukuza tena mataifa haya mbele yenu.”
    reason: Njia nyingine ya kutafsiri לֹא יוֹסִיף pamoja na kitenzi-jina.
  - marker: b
    text: Au, “pigo katika pande zenu.” Neno la Kiebrania hapa ni gumu; huenda likamaanisha chombo cha kuchapia au mateso yenye maumivu.
    reason: Maana sahihi ya שֹׁטֵט haijulikani kwa uhakika.
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: Jueni kwa hakika
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kamili unatia mkazo; msemo huu unaonyesha uhakika huo kwa Kiswahili cha kawaida.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: hataendelea kuyafukuza
  rationale: יסף pamoja na kitenzi-jina huonyesha kutokuendelea kufanya tendo; ירש katika muktadha huu ni kuyafukuza au kuyaondoa mataifa yaliyokuwapo.
- source_word: מִלִּפְנֵיכֶם
  choice: mbele yenu
  rationale: Inahifadhi taswira ya Kiebrania ya kuyaondoa mataifa kutoka mbele ya Israeli.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: mtego na tanzi
  rationale: Maneno mawili tofauti ya Kiebrania yanadumishwa kwa maneno mawili yanayokaribiana bila kuyafanya kuwa neno moja.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: mjeledi ubavuni mwenu
  rationale: Neno שֹׁטֵט ni gumu, lakini katika muktadha linaonyesha chombo au maumivu ya kuchapa; tafsiri hii inadumisha taswira ya mwili.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: miiba machoni mwenu
  rationale: Inawasilisha wazi taswira ya vitu vyenye ncha kali vinavyosababisha maumivu ya kudumu.
- source_word: עַד אֲבָדְכֶם מֵעַל הָאֲדָמָה
  choice: mpaka mtakapoangamia na kutoweka kutoka katika nchi
  rationale: Inabeba wazo la kuangamia na matokeo yake ya kuondoka katika nchi, huku ikiepuka Kiswahili kisicho cha kawaida cha tafsiri ya neno kwa neno.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; kulitaja kama Yahwe kunadumisha tofauti kati ya jina na cheo.
- issue: Asili ya onyo
  choice: Yahwe ataacha kuyaondoa mataifa, nayo yatakuwa chanzo cha mateso mpaka Israeli itoweke katika nchi aliyopewa
  alternative: Utabiri wa kijeshi usiohusishwa na kupoteza nchi waliyopewa
  rationale: Sentensi yenyewe inaunganisha kusitishwa kwa kufukuzwa kwa mataifa, mateso ya Israeli, na kuangamia kwake kutoka katika nchi nzuri ambayo Mungu aliwapa; tafsiri haiongezi maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira za mtego, tanzi, mjeledi, ubavu, miiba na macho zimehifadhiwa; sentensi imegawanywa baada ya kishazi cha kwanza ili isomeke kwa urahisi.
