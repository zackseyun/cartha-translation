    issue: Nyongeza ya 'kutoweka'
    rationale: '''Na kutoweka'' baada ya ''mtakapoangamia'' huongeza dhana tofauti ambayo haipo wazi katika עַד אֲבָדְכֶם. ''Mtakapoangamia kutoka katika nchi'' hutosha kuwasilisha tishio la chanzo.'
  - severity: low
    issue: Wingi wa בְּצִדֵּיכֶם haujahifadhiwa kikamilifu
    rationale: '''Ubavuni mwenu'' ni wa umoja, ilhali Kiebrania kinasema ''katika pande zenu.'' Marekebisho huhifadhi taswira na idadi ya chanzo.'
  - severity: low
    issue: Kiunganishi cha ulinganisho kinaweza kuwa cha karibu zaidi na chanzo
    rationale: '''Lakini'' hutafsiri waw wa mgeuko/adversative kwa moja kwa moja; ''Badala yake'' si kosa kubwa, lakini hudokeza ubadilishanaji kwa nguvu zaidi.'
