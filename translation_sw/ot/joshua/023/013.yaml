review_pass:
  verdict: revise
  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo mkuu wa Kiebrania: onyo lenye mkazo, kusitishwa kwa Yahwe kuwafukuza mataifa, taswira za mtego/tanzi na maumivu ya mwili, na kuangamia kutoka nchi nzuri waliyopewa. Hata hivyo, ''kutoweka'' huongeza wazo lisilosemwa wazi kando ya ''kuangamia''; ni salama kutafsiri אבד kwa ''kuangamia'' pekee. Pia בְּצִדֵּיכֶם ni wingi (''katika pande zenu''), si ''ubavuni mwenu'' wa umoja.'
  naturalness: Kiswahili kwa jumla ni cha kawaida na chenye hadhi inayofaa. 'Mjeledi katika pande zenu' husomeka kwa kawaida zaidi na huhifadhi wingi wa chanzo. Kuondoa 'Badala yake' kunafanya uhusiano wa 'lakini' kuwa wa moja kwa moja zaidi bila kuongeza ufafanuzi.
  terminology: Yahwe hudumisha jina binafsi יהוה kwa namna inayoweza kutamkika katika Kiswahili. 'Mtego na tanzi' na 'miiba machoni mwenu' ni istilahi za asili na za wazi. Tanbihi ya neno שֹׁטֵט inapaswa kubaki imefungwa kwenye 'mjeledi', si kwenye kishazi cha awali.
  issues:
