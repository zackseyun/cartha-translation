language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: sw
  text: Na itakuwa kwamba, kama vile kila neno jema ambalo Yahwe, Mungu wenu, alilowaambia limewapata, vivyo hivyo Yahwe atawaletea kila neno baya[a], mpaka awaangamize kabisa kutoka katika nchi hii nzuri ambayo Yahwe, Mungu wenu, amewapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila jambo baya” au “maafa yote.” Kiebrania ni “kila neno/jambo baya,” sambamba na “kila neno jema” mwanzoni mwa mstari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Na itakuwa kwamba
  rationale: Huhifadhi utangulizi wa hali ya wakati ujao na uzito wake bila kutumia Kiswahili cha kizamani.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kama vile ... vivyo hivyo
  rationale: Jozi hii ya Kiswahili inaonyesha wazi ulinganisho kati ya baraka zilizotimia na hukumu itakayokuja.
- source_word: בָּא עֲלֵיכֶם
  choice: limewapata
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la jambo lililowajia na kutimia kwao, huku likidumisha ulinganifu na hukumu itakayowajia.
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: kila neno jema
  rationale: Neno 'neno' huhifadhi maana ya msingi ya דָּבָר na ulinganifu wa makusudi na 'kila neno baya'; muktadha wa kile Mungu alisema unaifanya maana ieleweke.
- source_word: דִּבֶּר ... אֲלֵיכֶם
  choice: aliwaambia
  rationale: Ni usemi wa asili wa Kiswahili kwa tendo la kusema moja kwa moja kwa watu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha moja kwa moja jina la agano יהוה badala ya kulibadili kuwa cheo.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: atawaletea
  rationale: Huhifadhi nguvu ya kisababishi ya Hiphil ya בוא kwa Kiswahili cha kawaida.
- source_word: כָּל הַדָּבָר הָרָע
  choice: kila neno baya
  rationale: Huhifadhi ulinganifu wa kileksia na 'kila neno jema' na haidokezi kwamba tendo la Mungu ni uovu wa kimaadili.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: mpaka awaangamize kabisa
  rationale: Huonyesha kikomo na matokeo kamili ya hukumu inayotajwa.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: kutoka katika nchi hii nzuri
  rationale: Hutoa kwa Kiswahili kinachoeleweka wazo la kuondolewa kutoka juu ya nchi hiyo, bila kuongeza maelezo yasiyomo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu lenye herufi nne moja kwa moja; 'Yahwe' huhifadhi jina hilo badala ya cheo.
- issue: Maana ya רָע katika hukumu inayoletwa na Mungu
  choice: baya
  alternative: ovu, maafa, au mabaya
  rationale: Katika muktadha huu רָע ni upande mbaya wa hukumu ya agano, lakini ulinganifu wa 'neno jema/neno baya' ni muhimu. 'Baya' huhifadhi mvutano huo bila kumhusisha Mungu na uovu wa kimaadili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa 'kama vile ... vivyo hivyo' umehifadhi ulinganifu wa sentensi ya Kiebrania; 'neno jema/neno baya' limedumishwa kwa sababu ni ulinganifu wa makusudi katika chanzo.
