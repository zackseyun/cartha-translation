reference: Joshua 23:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: sw
  text: Mkivunja agano la Yahweh Mungu wenu[a], alilowaagiza, mkaenda kutumikia miungu mingine na kuzisujudia, ndipo hasira ya Yahweh itakapowaka dhidi yenu, nanyi mtaangamia upesi kutoka katika nchi nzuri aliyowapa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtakapovunja agano la Yahweh Mungu wenu.” Mwanzo wa sentensi ya Kiebrania unaweza kueleweka kuwa wa wakati (“mtakapovunja”) au wa sharti (“mkivunja”).
    reason: alternative_reading
  - marker: b
    text: Kwa Kiebrania, “kutoka juu ya nchi nzuri”; usemi huu unasisitiza kuondolewa kutoka katika nchi ambayo Yahweh aliwapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: Mkivunja
  rationale: Muundo huu unatoa onyo la masharti kwa Kiswahili cha kawaida. Katika muktadha wa agano, עבר ברית humaanisha kuvunja au kukiuka agano, si kuvuka tu.
- source_word: בְּרִית
  choice: agano
  rationale: “Agano” ni neno la kawaida lenye uzito wa kisheria na kitheolojia unaofaa uhusiano wa Yahweh na Israeli.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika muunganiko na Yahweh na muktadha wa agano, umbo hili linamtaja Mungu mmoja wa Israeli.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: ambalo aliwaamuru
  rationale: Huhifadhi kwa ufupi kishazi husishi cha Kiebrania bila kuongeza maneno kama “mlishike,” ambayo hayajaandikwa wazi katika chanzo.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: mkaenda kuitumikia
  rationale: “Mkaenda kuitumikia” ni Kiswahili cha kawaida kinachoonyesha kugeukia utumishi wa miungu mingine huku kikihifadhi kitenzi cha kutumikia.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya deities washindani.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: na kuiinamia
  rationale: “Kuiinamia” huhifadhi tendo la kuinama mbele ya miungu hiyo na kulitofautisha na kuitumikia.
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: ndipo hasira ya Yahweh itakapowaka dhidi yenu
  rationale: Huhifadhi sitiari ya hasira inayowaka na pia huonyesha wazi uhusiano wa matokeo katika onyo.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: nanyi mtaangamia upesi
  rationale: “Mtaangamia” huhifadhi nguvu ya אבד, na “upesi” huonyesha kasi ya matokeo hayo.
- source_word: מֵעַל הָאָרֶץ הַטּוֹבָה
  choice: na kuondolewa katika nchi nzuri
  rationale: Kirai hiki kinaonyesha kutoweka kwao kutoka katika nchi, si tu kuangamia wakiwa ndani yake. “Kuondolewa” hufanya maana hiyo iwe wazi katika Kiswahili cha kawaida.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: 'Onyo la agano: sharti au wakati'
  choice: Sharti linaloanzishwa na “Mkivunja”
  alternative: Wakati mtakapovunja
  rationale: Muundo wa Kiebrania unaweza kueleweka kwa maana ya “ikiwa” au “wakati.” Katika himizo hili, uundaji wa sharti huhifadhi nguvu ya onyo bila kudai kwamba uasi huo lazima utokee.
- issue: Maana ya kuangamia kutoka katika nchi
  choice: mtaangamia upesi na kuondolewa katika nchi
  alternative: mtaangamia upesi kutoka katika nchi
  rationale: Chaguo hili huhifadhi pamoja wazo la maangamizi na la kuondoshwa nchini, huku likiepuka Kiswahili kisicho cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa onyo umewekwa kwa mtiririko wa asili wa Kiswahili, huku sitiari ya hasira inayowaka, tofauti kati ya kutumikia na kuinamia, na utata wa “ikiwa/wakati” vikihifadhiwa.
