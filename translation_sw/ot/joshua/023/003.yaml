  text: וְ/אַתֶּ֣ם רְאִיתֶ֗ם אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לְ/כָל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: sw
  text: Nanyi wenyewe mmeona yote ambayo Yahweh, Mungu wenu, ameyatendea mataifa haya yote mbele yenu,[a] kwa maana Yahweh, Mungu wenu, ndiye aliyewapigania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mbele yenu,” nahau inayomaanisha kwamba mataifa yalifukuzwa kutoka mbele ya Israeli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Nanyi wenyewe
  rationale: Kiwakilishi huru kinasisitiza wale wanaosemeshwa; “wenyewe” huhifadhi msisitizo huo, na “na” huendeleza mtiririko wa hotuba.
- source_word: רְאִיתֶם
  choice: mmeona
  rationale: Kauli timilifu inaeleza jambo walilolishuhudia ambalo bado lina umuhimu katika hotuba ya Yoshua.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: yote ambayo ... ameyatendea
  rationale: Huhifadhi upana wa “yote” na maana pana ya kitenzi ‘kufanya,’ huku muundo wa Kiswahili pamoja na kiambishi cha kutendea ukionyesha mataifa yaliyoathiriwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי/כֶם
  choice: Mungu wenu
  rationale: Huhifadhi muundo wa umilikaji wa nafsi ya pili wingi katika usemi wa agano.
- source_word: לְ/כָל הַ/גּוֹיִם הָ/אֵלֶּה
  choice: mataifa haya yote
  rationale: Kiambishi cha kutendea katika “ameyatendea” hubeba ל na kuonyesha mataifa kuwa yaliyoathiriwa bila kufafanua kupita kiasi aina ya tendo.
- source_word: מִ/פְּנֵי/כֶם
  choice: mbele yenu
  rationale: Ni tafsiri ya kawaida ya nahau; tanbihi inaeleza maana ya kuondolewa kutoka mbele ya Israeli katika muktadha wa ushindi.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutanguliza sababu au ufafanuzi wa kauli iliyotangulia.
- source_word: הוּא הַ/נִּלְחָם
  choice: ndiye aliyewapigania
  rationale: “Ndiye” huhifadhi msisitizo wa kiwakilishi na Kiswahili cha kawaida huwasilisha tendo la Mungu kwa niaba yao kwa “aliyewapigania.”
- source_word: לָ/כֶם
  choice: -wa- katika “aliyewapigania”
  rationale: Kiambishi cha yambwa ya manufaa huonyesha kwamba Mungu alipigana kwa niaba yao.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “Nanyi wenyewe” huhifadhi msisitizo, na “ndiye aliyewapigania” ni wa asili na hudumisha mkazo wa Kiebrania.
