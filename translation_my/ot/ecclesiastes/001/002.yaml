  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: my
  text: “ထွက်သက်တကာ့ထွက်သက်ပေတည်း”[a] ဟု ကိုဟေလက်[b]က ဆို၏။ “ထွက်သက်တကာ့ထွက်သက်ပေတည်း။ အရာခပ်သိမ်းသည် ထွက်သက်မျှသာ ဖြစ်၏။”
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ဟေဗြဲ הֶבֶל (ဟေဗယ်) သည် စာလုံးအတိုင်းဆိုလျှင် “ထွက်သက်” သို့မဟုတ် “အငွေ့” ဖြစ်သည်။ ဤကျမ်းတွင် ၃၈ ကြိမ် အသုံးပြုထားပြီး ခဏသာတည်ခြင်း၊ ဆုပ်ကိုင်မရခြင်းနှင့် မျှော်လင့်ထားသည့်အရာနှင့် အမှန်တကယ်ဖြစ်လာသည့်အရာ မကိုက်ညီခြင်းဟူသော ဆက်စပ်သဘောသုံးမျိုးကို တစ်ပြိုင်နက် သယ်ဆောင်သည်။ “ထွက်သက်တကာ့ထွက်သက်” သည် “သီချင်းတကာ့သီချင်း၊ သန့်ရှင်းခြင်းတကာ့သန့်ရှင်းခြင်း” ကဲ့သို့ အထွတ်အထိပ်ကို ဖော်ပြသော ဟေဗြဲဖွဲ့စည်းပုံဖြစ်သည်။
    reason: lexical_choice
lexical_decisions:
- source_word: הֶבֶל / הֲבֵל
  choice: ထွက်သက်
  rationale: ဟေဗြဲစကားလုံး၏ မူလပုံရိပ်ဖြစ်သော အသက်ငွေ့၊ အငွေ့အသက်ကို ထိန်းသိမ်းပြီး ခဏသာတည်ခြင်း၊ ဆုပ်ကိုင်မရခြင်းနှင့် မျှော်လင့်ချက်နှင့် အဖြစ်မှန် မကိုက်ညီခြင်းဟူသော ဆက်စပ်သဘောများကို စာစဉ်အလိုက် ပေါ်လွင်စေသည်။ “အနတ္တ၊ အဓိပ္ပာယ်မဲ့၊ အချည်းနှီး” စသည့် စိတ္တဇစကားလုံးတစ်လုံးဖြင့် အဓိပ္ပာယ်တစ်ဖက်တည်းသို့ မကျဉ်းစေပါ။
- source_word: הֲבֵל הֲבָלִים
  choice: ထွက်သက်တကာ့ ထွက်သက်
  rationale: “သီချင်းတကာ့သီချင်း” ကဲ့သို့ ဟေဗြဲဘာသာ၏ X-of-Xs အထွတ်အထိပ်ပြပုံကို မြန်မာဘာသာ၌ သဘာဝကျ၍ မှတ်မိလွယ်သော “တကာ့” ဖွဲ့စည်းပုံဖြင့် ထိန်းထားသည်။
- source_word: אָמַר
  choice: ဆိုသည်
  rationale: စာပေမိတ်ဆက်စကားနှင့် အစဉ်တည်သော ကြေညာချက်သဘောကို မြန်မာပစ္စုပ္ပန်ပုံစံဖြင့် သဘာဝကျစွာ ဖော်ပြသည်။
- source_word: קֹהֶלֶת
  choice: ကိုဟေလက်
  rationale: “ဆရာ” သို့မဟုတ် “တရားဟောဆရာ” ဟု အဓိပ္ပာယ်တစ်မျိုးတည်း မသတ်မှတ်ဘဲ ဟေဗြဲခေါင်းစဉ်/အမည်ကို အသံဖလှယ်ထားသည်။
- source_word: הַכֹּל
  choice: အရာခပ်သိမ်း
  rationale: မူရင်း၏ အားလုံးလွှမ်းခြုံသော အင်အားကို ဂုဏ်သိက္ခာရှိပြီး နားလည်လွယ်သော မြန်မာအသုံးဖြင့် ဖော်ပြသည်။
- source_word: הָבֶל
  choice: ထွက်သက်မျှသာ
  rationale: ဝါကျနောက်ဆုံး စီရင်ချက်နေရာတွင် “မျှသာ” ကို ထည့်ခြင်းအားဖြင့် အရာဝတ္ထု၏ ဖွဲ့စည်းပုံကို အတိအကျ သတ်မှတ်ခြင်းမဟုတ်ဘဲ မျှော်မှန်းထားသည်ကို လျှော့ချချိုးဖျက်သော အကဲဖြတ်ချက်ဖြစ်ကြောင်း ပေါ်လွင်စေသည်။
theological_decisions:
- issue: ဒေသနာကျမ်းတစ်လျှောက် အဓိကပြန်လည်သုံးစွဲသော הֶבֶל ကို မည်သို့ဖော်ပြမည်နည်း
  choice: ကွန်ကရစ်ပုံရိပ်ဖြစ်သော “ထွက်သက်” ကို ထိန်းသိမ်းပြီး နောက်ဆုံး predicate တွင် “ထွက်သက်မျှသာ” ဟု ဖော်ပြသည်။
  alternative: အချည်းနှီး၊ အဓိပ္ပာယ်မဲ့၊ အကျိုးမဲ့၊ မတည်မြဲ
  rationale: စိတ္တဇရွေးချယ်စရာတစ်ခုချင်းသည် ခဏတာဖြစ်ခြင်း၊ ဆုပ်ကိုင်မရခြင်းနှင့် အဖြစ်အပျက်၏ မျှော်လင့်မထားသော အလွဲသဘောတို့အနက် တစ်မျိုးကိုသာ ရှေ့တန်းတင်တတ်သည်။ “အဓိပ္ပာယ်မဲ့” ဟူသော စကားသည် မူရင်းက အတိအလင်း မဆိုသော နိဟိလဝါဒသဘောကိုပါ ထည့်သွင်းနိုင်သဖြင့် မူရင်းပုံရိပ်နှင့် တင်းမာမှုကို ဆက်ထိန်းထားသည်။
translation_notes:
  register: ခေတ်မီစံမြန်မာစကားကို အခြေခံထားသော်လည်း ကျမ်းစကား၏ ဂုဏ်သိက္ခာနှင့် ကြေညာချက်ဆန်သော လေသံကို ထိန်းရန် “ပေတည်း၊ ဖြစ်၏” ကို သုံးထားသည်။ “ထွက်သက်တကာ့ ထွက်သက်” သည် မူရင်း၏ ထပ်ကျော့သံနှင့် အထွတ်အထိပ်ဖွဲ့စည်းပုံကို ထိန်းထားပြီး သာမန်စာဖတ်သူ နားလည်နိုင်ရန် [a] တွင် ရှင်းလင်းထားသည်။
