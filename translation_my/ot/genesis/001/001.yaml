base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: my
  text: အစအဦး၌ ဘုရားသခင်သည် ကောင်းကင်နှင့် မြေကြီးကို ဖန်ဆင်းတော်မူသောအခါ[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: ရိုးရာအားဖြင့် ဤကို ပြီးပြည့်စုံသောဝါကျအဖြစ် “အစအဦး၌ ဘုရားသခင်သည် ကောင်းကင်နှင့် မြေကြီးကို ဖန်ဆင်းတော်မူ၏” ဟု ပြန်ဆိုကြသည်။ ဟေဗြဲစာတွင် သတ်မှတ်အညွှန်းမပါသော בְּרֵאשִׁית ၏နောက်၌ ကြိယာ בָּרָא လိုက်လာသောကြောင့်၊ ကမ္ဘာဦး ၂:၄ခ ရှိ ပုံစံနှင့် နှိုင်းယှဉ်ကာ အချိန်ပြမှီခိုဝါကျအဖြစ်လည်း ဖတ်နိုင်သည်။ ထိုသို့ဖတ်လျှင် အဓိကဝါကျသည် အခန်းငယ် ၃ ရှိ “ဘုရားသခင်က ‘အလင်းဖြစ်စေ’ ဟု မိန့်တော်မူ၏” ဟူသောဝါကျဖြစ်သည်။
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: အစအဦး၌ … ဖန်ဆင်းတော်မူသောအခါ
  rationale: အဓိပ္ပာယ်အရ “အစအဦး” ဟူသော רֵאשִׁית ၏အားကို ထိန်းထားပြီး၊ ဝိဘတ်အညွှန်းမပါသော בְּרֵאשִׁית နှင့် နောက်က finite verb တို့၏ အချိန်ပြ မှီခိုဝါကျသဘောကို “သောအခါ” ဖြင့် သဘာဝကျစွာ ဖော်ပြထားသည်။
- source_word: בָּרָא
  choice: ဖန်ဆင်းတော်မူ
  rationale: ဘုရားသခင်၏ ဖန်ဆင်းခြင်းကို ဆိုလိုသော စံဟေဗြဲကြိယာဖြစ်သဖြင့် ယန္တရား သို့မဟုတ် နည်းလမ်းကို ထပ်မံမသတ်မှတ်ဘဲ တိုက်ရိုက်ဖော်ပြသည်။
- source_word: אֱלֹהִים
  choice: ဘုရားသခင်
  rationale: ပုံသဏ္ဌာန်အားဖြင့် အများကိန်းဖြစ်သော်လည်း ဤနေရာတွင် တစ်ခုကိန်းကြိယာ בָּרָא နှင့် တွဲထားသောကြောင့် တစ်ပါးတည်းသော ဘုရားသခင်ကို ရည်ညွှန်းသည်။
- source_word: אֵת
  choice: '[သီးခြားဘာသာမပြန်—တိုက်ရိုက်ကံပုဒ်အမှတ်အသား]'
  rationale: ဟေဗြဲဘာသာတွင် သတ်မှတ်ထားသော တိုက်ရိုက်ကံပုဒ်ကို မှတ်သားပေးသည့် စကားလုံးဖြစ်ပြီး မြန်မာဘာသာ၌ “ကို” ဖြင့် ဝါကျဖွဲ့စည်းပုံအတွင်း လုပ်ဆောင်ချက်ကို ဖော်ပြထားသည်။
- source_word: הַשָּׁמַיִם
  choice: မိုးကောင်းကင်များ
  rationale: ဟေဗြဲအများကိန်းပုံစံကို ထင်ရှားစွာ ထိန်းထားပြီး၊ မြေကြီးနှင့် တွဲဖက်ကာ ဖန်ဆင်းထားသမျှ အလုံးစုံကို ခြုံငုံညွှန်းသည့် စကားစုံ၏ ပထမပိုင်းကို ဖော်ပြသည်။
- source_word: הָאָרֶץ
  choice: မြေကြီး
  rationale: אָרֶץ သည် “ပြည်/မြေ” ဟုလည်း အဓိပ္ပာယ်ရနိုင်သော်လည်း မိုးကောင်းကင်များနှင့် တွဲသုံးထားသော စကြဝဠာဆိုင်ရာ စကားစုံတွင် “မြေကြီး” ဟု နားလည်ရသည်။
theological_decisions:
- issue: အဖွင့်ဝါကျ၏ သဒ္ဒါဆက်နွှယ်ပုံ
  choice: မှီခိုသော အချိန်ပြဝါကျ—“အစအဦး၌ … ဖန်ဆင်းတော်မူသောအခါ—”
  alternative: သီးခြားပြီးပြည့်စုံသော ဝါကျ—“အစအဦး၌ ဘုရားသခင်သည် မိုးကောင်းကင်များနှင့် မြေကြီးကို ဖန်ဆင်းတော်မူ၏။”
  rationale: ဝိဘတ်အညွှန်းမပါသော בְּרֵאשִׁית၊ ၎င်းနောက် ချက်ချင်းလိုက်သော finite verb בָּרָא နှင့် ကမ္ဘာဦး ၂:၄ခ၊ ဟောရှေ ၁:၂ တို့ရှိ အဖွင့်ပုံစံများက အချိန်ပြမှီခိုဝါကျအဖြစ် ဖတ်ခြင်းကို အားပေးသည်။ သို့သော် ရိုးရာပြီးပြည့်စုံဝါကျဖတ်ပုံမှာ ရှေးကျပြီး အရေးပါသောကြောင့် အောက်ခြေမှတ်စုတွင် ထိန်းသိမ်းထားသည်။ ဤသဒ္ဒါရွေးချယ်မှုဖြင့် ဖန်ဆင်းခြင်းဆိုင်ရာ အယူကို ထပ်ဆောင်းမဆုံးဖြတ်ထားပါ။
translation_notes:
  register: ခေတ်သစ်စံမြန်မာစာကို အသုံးပြုပြီး ဘုရားသခင်နှင့်ဆိုင်သော ကြိယာတွင် ရိုသေသည့် “တော်မူ” ပုံစံကို ထည့်ထားသည်။ “ဖန်ဆင်းတော်မူသောအခါ—” ဟူသော ဆက်လက်မပြီးသေးသည့် အဖွင့်ပုံစံနှင့် em dash ကို အသုံးပြုကာ အခန်းငယ် ၂ မှတစ်ဆင့် အခန်းငယ် ၃ ရှိ အဓိကဝါကျသို့ ဆက်သွားကြောင်း ဖော်ပြသည်။
