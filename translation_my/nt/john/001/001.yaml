base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: my
  text: အစအဦး၌[b] နှုတ်ကပတ်တော် ရှိတော်မူ၏။ နှုတ်ကပတ်တော်သည် ဘုရားသခင်နှင့်အတူ ရှိတော်မူ၏။ နှုတ်ကပတ်တော်သည် ဘုရားသခင် ဖြစ်တော်မူ၏။[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: သို့မဟုတ် “နှုတ်ကပတ်တော်သည် ဘုရားသဘောရှိတော်မူ၏” သို့မဟုတ် “ဘုရားသခင်ဖြစ်သကဲ့သို့ နှုတ်ကပတ်တော်လည်း ဖြစ်တော်မူ၏” ဟုလည်း ပြန်ဆိုနိုင်သည်။ ဂရိဝါကျဖွဲ့ပုံတွင် နောက်ဆုံးဝါကျရှိ “ဘုရားသခင်” သည် အညွှန်းပုဒ်မပါဘဲ လာသောကြောင့် အရည်အသွေးကို အလေးပေးဖော်ပြနိုင်သည်။ သို့သော် ၎င်းသည် ရှေ့ဝါကျရှိ “ဘုရားသခင်” နှင့် နှုတ်ကပတ်တော်ကို ပုဂ္ဂိုလ်တစ်ဦးတည်းဟု မဆိုလိုပါ။
    reason: alternative_reading
  - marker: b
    text: “အစအဦး၌” ဟူသော စကားသည် ကမ္ဘာဦး ၁:၁ ကို ထင်ဟပ်ထားပြီး နှုတ်ကပတ်တော်ကို ဖန်ဆင်းခြင်းအစနှင့် ဆက်စပ်ဖော်ပြသည်။
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: အစအဦး၌
  rationale: ကမ္ဘာဦး ၁:၁ ကို ပဲ့တင်ထပ်သည့် စကားအသုံးအနှုန်းနှင့် ဖန်ဆင်းခြင်းအစဆိုင်ရာ ဆက်နွှယ်မှုကို ထိန်းသိမ်းပေးသည်။
- source_word: ἦν
  choice: ရှိတော်မူ၏
  rationale: εἰμί ၏ မပြီးဆုံးသေးသောအတိတ်ကာလပုံစံက ဖော်ပြသည့် ဆက်လက်တည်ရှိခြင်းကို မြန်မာဘာသာ၌ သဘာဝကျ၍ ဂုဏ်သိက္ခာရှိစွာ ဖော်ပြသည်။ ‘ရှိခဲ့သည်’ ဟုဆိုလျှင် ယခုမရှိတော့သကဲ့သို့ အဓိပ္ပာယ်လွဲနိုင်သဖြင့် ရှောင်ထားသည်။ မူရင်း၏ သုံးကြိမ်ထပ်သည့် စည်းချက်ကိုလည်း ထိန်းသိမ်းထားသည်။
- source_word: ὁ λόγος
  choice: နှုတ်ကပတ်တော်
  rationale: ဗျာဒိတ်ဖော်ပြသည့် စကားနှင့် ပုဂ္ဂိုလ်ရေးဆိုင်ရာ အမည်သတ်မှတ်ချက် နှစ်မျိုးလုံးကို ထိန်းသိမ်းနိုင်ပြီး မြန်မာခရစ်ယာန်စာပေတွင် နားလည်လွယ်သော အသုံးအနှုန်းဖြစ်သည်။ ‘သတင်းစကား’ ဟူသောရွေးချယ်မှုထက် အဓိပ္ပာယ်ကို ကျဉ်းမြောင်းမသွားစေပါ။
- source_word: πρὸς τὸν θεόν
  choice: ဘုရားသခင်နှင့်အတူ
  rationale: πρός က ပေးသည့် ဆက်ဆံရေးနှင့် ဦးတည်တည်ရှိမှုသဘောကို မြန်မာဘာသာတွင် သဘာဝကျစွာ ဖော်ပြပြီး နှုတ်ကပတ်တော်နှင့် ဘုရားသခင်တို့၏ ပုဂ္ဂိုလ်ရေးကွဲပြားမှုကို ထိန်းထားသည်။
- source_word: θεὸς ἦν ὁ λόγος
  choice: နှုတ်ကပတ်တော်သည် ဘုရားသခင် ဖြစ်တော်မူ၏
  rationale: ဝါကျရှေ့ထားသည့် အညွှန်းပုဒ်မဲ့ θεός ၏ အရည်အသွေးဖော်ပြသဘောကို လျော့ပါးမသွားစေဘဲ နှုတ်ကပတ်တော်၏ ဘုရားသဘောသဘာဝကို အပြည့်အဝ အတည်ပြုသည်။ ရှေ့ဝါကျရှိ ဘုရားသခင်နှင့် ပုဂ္ဂိုလ်တစ်ဦးတည်းဟု ရောနှောမသတ်မှတ်ဘဲ မူရင်း၏ တင်းမာချက်ကို ထိန်းသိမ်းထားသည်။
theological_decisions:
- issue: နောက်ဆုံးဝါကျရှိ အညွှန်းပုဒ်မဲ့ θεός ကို ပြန်ဆိုပုံ
  choice: နှုတ်ကပတ်တော်သည် ဘုရားသခင် ဖြစ်တော်မူ၏
  alternative: နှုတ်ကပတ်တော်သည် ဘုရားသဘောသဘာဝရှိတော်မူ၏ / ဘုရားသခင်၏ ဖြစ်ခြင်းသဘောအတိုင်း နှုတ်ကပတ်တော်လည်း ဖြစ်တော်မူ၏
  rationale: ဂရိဝါကျဖွဲ့ပုံအရ θεός သည် အဓိကအားဖြင့် အရည်အသွေးကို ဖော်ပြကာ နှုတ်ကပတ်တော်၏ ဘုရားသဘောသဘာဝ အပြည့်အဝရှိခြင်းကို အတည်ပြုသည်။ တစ်ချိန်တည်းတွင် ရှေ့ဝါကျရှိ ‘ဘုရားသခင်’ နှင့် ပုဂ္ဂိုလ်ရေးကွဲပြားမှုကို ဆက်လက်ထားရှိသည်။ ပင်မစာသားသည် တိုက်ရိုက်၍ ခိုင်မာသော ပြန်ဆိုချက်ကို အသုံးပြုပြီး အရည်အသွေးဆိုင်ရာ နူးညံ့သဘောကို အောက်ခြေမှတ်စုတွင် ရှင်းပြထားသည်။
translation_notes:
  register: ခေတ်သစ်စံမြန်မာစကားကို အခြေခံ၍ သာမန်စာဖတ်သူ နားလည်လွယ်သော်လည်း ကျမ်းစာနှင့်လျော်ညီသော ဂုဏ်သိက္ခာရှိသည့် ‘၏’ အဆုံးသတ်ပုံစံနှင့် ‘တော်မူ’ ကို အသုံးပြုထားသည်။ ဝါကျသုံးပိုင်း၏ ထပ်တလဲလဲစည်းချက်ကို မူရင်းအတိုင်း ထိန်းသိမ်းထားပြီး အောက်ခြေမှတ်စုအမှတ်များကို သက်ဆိုင်ရာ စကားစုများနောက်တွင် ထားရှိသည်။
