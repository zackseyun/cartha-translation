  text: אֱדַ֨יִן֙ עללין כֹּ֖ל חַכִּימֵ֣י מַלְכָּ֑/א וְ/לָֽא כָהֲלִ֤ין כְּתָבָ/א֙ לְ/מִקְרֵ֔א ו/פשר/א לְ/הוֹדָעָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/008.yaml
  text: Then all the king’s wise men came in[b][a], but they were not able to read the writing or make its interpretation known to the king.
translation:
  language: pt
  text: Então entraram todos os sábios do rei, mas não conseguiram ler a escrita[a] nem dar ao rei a conhecer sua interpretação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ler a inscrição”. O termo aramaico pode se referir à própria mensagem escrita.
    reason: lexical_alternative
  - marker: b
    text: Ou “explicar ao rei o seu significado”. Em Daniel, o termo aramaico traduzido por “interpretação” aparece repetidamente para a explicação de uma mensagem ou de um sonho misterioso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que introduz o acontecimento seguinte; “Então” preserva com naturalidade a sequência narrativa.
- source_word: עללין
  choice: entraram
  rationale: O verbo aramaico עלל indica entrar; a forma plural se refere aos sábios que se apresentam na corte.
- source_word: כֹּל חַכִּימֵי מַלְכָּא
  choice: todos os sábios do rei
  rationale: A cadeia construta designa o grupo completo de sábios ligado à corte real; a formulação é clara e mantém a relação expressa no aramaico.
- source_word: וְלָא כָהֲלִין
  choice: mas não conseguiram
  rationale: A conjunção em contexto introduz contraste, e a forma negada expressa incapacidade para realizar as ações seguintes.
- source_word: כְּתָבָא לְמִקְרֵא
  choice: ler a escrita
  rationale: כְּתָבָא pode designar aquilo que está escrito, a mensagem escrita ou a inscrição. “A escrita” mantém essa amplitude, enquanto a nota registra a alternativa contextual.
- source_word: וּפִשְׁרָא
  choice: sua interpretação
  rationale: פְּשַׁר é o termo recorrente em Daniel para a explicação de uma mensagem ou sonho misterioso; o possessivo liga a interpretação à escrita.
- source_word: לְהוֹדָעָה לְמַלְכָּא
  choice: dar ao rei a conhecer
  rationale: O infinitivo causativo de ידע significa fazer saber ou tornar conhecido. A formulação preserva esse valor causativo e o tom digno do relato de corte.
