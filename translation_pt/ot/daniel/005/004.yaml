base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/004.yaml
  text: They drank the wine and praised the gods of gold and silver[a], bronze, iron, wood, and stone.
translation:
  language: pt
  text: Beberam o vinho e louvaram os deuses de ouro, prata, bronze[a], ferro, madeira e pedra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”. O termo aramaico pode designar cobre ou bronze; “bronze” se ajusta melhor à lista convencional de materiais de ídolos neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִשְׁתִּיו
  choice: Beberam
  rationale: O peal perfeito, terceira pessoa masculina plural, apresenta a ação na sequência narrativa; o pretérito perfeito é a forma mais natural em português.
- source_word: חַמְרָא
  choice: o vinho
  rationale: O substantivo definido refere-se ao vinho específico consumido no banquete.
- source_word: וְשַׁבַּחוּ
  choice: e louvaram
  rationale: O verbo expressa a atribuição de louvor; “louvaram” é natural, digno e conserva o sentido cultual.
- source_word: לֵאלָהֵי
  choice: os deuses de
  rationale: Embora a preposição ל marque o objeto do louvor em aramaico, o português idiomático emprega objeto direto com “louvar”.
- source_word: דַּהֲבָא וְכַסְפָּא
  choice: ouro e prata
  rationale: Mantém a sequência dos materiais que caracterizam os deuses ou suas imagens.
- source_word: נְחָשָׁא
  choice: bronze
  rationale: O termo pode indicar cobre ou bronze; “bronze” se ajusta melhor à lista convencional de materiais de ídolos, sem ocultar a alternativa lexical.
- source_word: פַרְזְלָא
  choice: ferro
  rationale: Equivalente português padrão do termo aramaico.
- source_word: אָעָא
  choice: madeira
  rationale: Em uma lista de materiais usados para imagens, “madeira” é mais natural em português do que “pau”.
- source_word: וְאַבְנָא
  choice: e pedra
  rationale: “Pedra” é o equivalente contextual natural para o material de ídolos.
theological_decisions:
- issue: Se אֱלָהֵי deve ser traduzido como “deuses” ou “Deus”
  choice: deuses
  alternative: Deus
  rationale: A forma plural e a lista subsequente de materiais indicam divindades ou imagens pagãs, não o Deus de Israel.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A coordenação da lista foi preservada sem repetições desnecessárias.
