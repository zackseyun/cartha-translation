  text: בֵּ/אדַ֜יִן עָנֵ֣ה דָנִיֵּ֗אל וְ/אָמַר֙ קֳדָ֣ם מַלְכָּ֔/א מַתְּנָתָ/ךְ֙ לָ֣/ךְ לֶֽהֶוְיָ֔ן וּ/נְבָ֥זְבְּיָתָ֖/ךְ לְ/אָחֳרָ֣ן הַ֑ב בְּרַ֗ם כְּתָבָ/א֙ אֶקְרֵ֣א לְ/מַלְכָּ֔/א וּ/פִשְׁרָ֖/א אֲהוֹדְעִנֵּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/017.yaml
  text: Then Daniel answered and said before the king, “Let your gifts remain yours, and give your rewards to another. Nevertheless, I will read the writing for the king and make its interpretation known to him.”
translation:
  language: pt
  text: 'Então Daniel respondeu e disse diante do rei: “Que os teus presentes fiquem contigo, e dá as tuas recompensas a outra pessoa. Contudo, lerei a escrita para o rei e lhe darei a conhecer a interpretação.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador narrativo aramaico que introduz a ação seguinte; “Então” preserva a sequência com naturalidade.
- source_word: עָנֵה ... וְאָמַר
  choice: respondeu e disse
  rationale: Mantém os dois verbos da fórmula narrativa sem tornar a frase pouco natural em português.
- source_word: קֳדָם מַלְכָּא
  choice: diante do rei
  rationale: Preserva a ideia espacial e cerimonial de estar na presença do rei, em vez de reduzi-la simplesmente a “ao rei”.
- source_word: מַתְּנָתָךְ ... לָךְ לֶהֶוְיָן
  choice: Que os teus presentes fiquem contigo
  rationale: Expressa de modo idiomático a recusa de Daniel, preservando o sentido de que os presentes continuem pertencendo ao rei.
- source_word: נְבָזְבְּיָתָךְ
  choice: tuas recompensas
  rationale: No contexto, refere-se às dádivas ou recompensas régias prometidas pela interpretação.
- source_word: לְאָחֳרָן הַב
  choice: dá ... a outra pessoa
  rationale: O singular substantivado é reproduzido naturalmente; “outra pessoa” evita a possível leitura de que se trata apenas de outra coisa.
- source_word: בְּרַם
  choice: Contudo
  rationale: 'Marca claramente o contraste: Daniel rejeita a recompensa, mas aceita ler e interpretar a escrita.'
- source_word: כְּתָבָא
  choice: a escrita
  rationale: Designa aquilo que foi escrito na parede sem antecipar uma caracterização mais específica como “inscrição”.
- source_word: אֶקְרֵא לְמַלְכָּא
  choice: lerei a escrita para o rei
  rationale: Conserva tanto o objeto explícito como o beneficiário ou destinatário da leitura.
- source_word: פִשְׁרָא
  choice: a interpretação
  rationale: Mantém o termo técnico empregado em Daniel para a explicação de uma mensagem enigmática.
- source_word: אֲהוֹדְעִנֵּהּ
  choice: lhe darei a conhecer
  rationale: Reproduz a força causativa do verbo, isto é, fazer com que o rei conheça a interpretação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal em “lhe darei” é natural no registro escrito e evita uma formulação excessivamente coloquial. Não foram necessárias notas de rodapé.
