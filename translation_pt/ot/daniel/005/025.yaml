base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/025.yaml
  text: 'And this is the inscription that was written: MENE[a], MENE, TEKEL[b], and PARSIN.'
translation:
  language: pt
  text: 'E esta é a inscrição que foi escrita: MENE[a], MENE, TEQUEL e PARSIM.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'As palavras aramaicas foram mantidas em transliteração porque Daniel as interpreta nos versículos seguintes mediante jogos de palavras: MENE soa como “contado”; TEQUEL, como “pesado”; e PARSIM/PERES, como “dividido”, além de evocar os persas. Elas também podem designar unidades de peso ou monetárias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְנָה
  choice: E esta é
  rationale: Preserva a conjunção aramaica e a força demonstrativa, introduzindo naturalmente o conteúdo que segue.
- source_word: כְתָבָא
  choice: a inscrição
  rationale: No contexto da mensagem exposta na parede, “inscrição” é mais específico que o termo genérico “escrita”.
- source_word: דִּי רְשִׁים
  choice: que foi escrita
  rationale: Reproduz de modo claro a oração relativa e a forma verbal passiva, sem tornar a expressão excessivamente técnica.
- source_word: מְנֵא מְנֵא
  choice: MENE, MENE
  rationale: Mantém a transliteração e a repetição do original, preservando o caráter enigmático da mensagem e o jogo de palavras explicado nos versículos seguintes.
- source_word: תְּקֵל
  choice: TEQUEL
  rationale: A transliteração adaptada à ortografia portuguesa conserva a forma enigmática e permite a posterior associação com o verbo “pesar”.
- source_word: וּפַרְסִין
  choice: e PARSIM
  rationale: Preserva a conjunção, translitera a forma plural deste versículo e mantém aberto o jogo de palavras posterior com divisão e persas.
theological_decisions:
- issue: Interpretação antecipada das palavras da inscrição
  choice: Manter MENE, TEQUEL e PARSIM transliterados
  alternative: Traduzir como unidades monetárias ou como “contado, pesado e dividido”
  rationale: Daniel interpreta essas palavras nos versículos seguintes. Traduzi-las aqui resolveria prematuramente a ambiguidade deliberada e reduziria o efeito narrativo e os jogos de palavras.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. As transliterações TEQUEL e PARSIM seguem uma forma naturalmente pronunciável em português; a repetição de MENE é preservada exatamente. O marcador da nota aparece após a primeira palavra transliterada e abrange toda a sequência.
