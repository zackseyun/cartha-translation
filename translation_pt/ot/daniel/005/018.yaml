  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אנתה מַלְכָּ֑/א אֱלָהָ/א֙ עלי/א מַלְכוּתָ֤/א וּ/רְבוּתָ/א֙ וִ/יקָרָ֣/א וְ/הַדְרָ֔/ה יְהַ֖ב לִ/נְבֻכַדְנֶצַּ֥ר אֲבֽ/וּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/018.yaml
  text: As for you[a], O king, the Most High God gave kingship and greatness and glory and majesty to Nebuchadnezzar your father.
translation:
  language: pt
  text: Quanto a você, ó rei, o Deus Altíssimo deu a Nabucodonosor, seu pai[a], a realeza, a grandeza, a glória e a majestade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu antepassado” ou “seu predecessor”; o termo aramaico significa literalmente “seu pai”, mas pode ser usado em sentido mais amplo na linguagem de linhagem real.
    reason: lexical_alternative
lexical_decisions:
- source_word: אנתה
  choice: Quanto a você
  rationale: O pronome independente em posição inicial é enfático e marca o destinatário; “Quanto a você” reproduz com naturalidade esse destaque discursivo.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: O vocativo preserva o tom formal do discurso na corte.
- source_word: אֱלָהָא עִלָּיָא
  choice: o Deus Altíssimo
  rationale: Expressão portuguesa clara e consagrada que mantém o título divino superlativo.
- source_word: מַלְכוּתָא
  choice: a realeza
  rationale: Neste contexto, designa a condição, autoridade ou dignidade régia concedida pessoalmente a Nabucodonosor, não apenas um território.
- source_word: רְבוּתָא
  choice: a grandeza
  rationale: Conserva o sentido de grandeza ou posição elevada e se integra naturalmente à enumeração.
- source_word: וִיקָרָא
  choice: a glória
  rationale: Representa a honra e o prestígio régios, preservando o tom elevado.
- source_word: וְהַדְרָה
  choice: a majestade
  rationale: Expressa magnificência régia e permanece distinta de “glória” na sequência.
- source_word: יְהַב
  choice: deu
  rationale: Tradução direta do verbo aramaico, sem acrescentar uma nuance não exigida pelo texto.
- source_word: לִנְבֻכַדְנֶצַּר
  choice: a Nabucodonosor
  rationale: Transliteração portuguesa corrente do nome próprio.
- source_word: אֲבוּךְ
  choice: seu pai
  rationale: Mantém o sentido lexical direto, enquanto a amplitude dinástica possível é explicitada em nota.
theological_decisions:
- issue: Sentido de “seu pai” na linguagem régia e dinástica
  choice: Manter “seu pai” no texto principal
  alternative: “seu antepassado” ou “seu predecessor”
  rationale: O aramaico emprega o termo comum para “pai”, mas ele pode ter sentido mais amplo de antepassado ou predecessor dinástico. A tradução preserva a expressão do texto sem decidir silenciosamente a relação histórica exata.
translation_notes:
  register: Português moderno, claro e digno, com formalidade adequada a uma fala dirigida ao rei. A colocação de “a Nabucodonosor” antes da enumeração evita ambiguidade e produz uma ordem natural em português, sem alterar as relações semânticas do aramaico.
