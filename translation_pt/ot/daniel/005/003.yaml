base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/003.yaml
  text: Then they brought in the gold vessels that had been taken out of the temple[a], the house of God, which was in Jerusalem, and the king and his nobles[b], his wives and his concubines drank from them.
translation:
  language: pt
  text: Então trouxeram os utensílios de ouro que haviam sido retirados do templo[a], a casa de Deus, que ficava em Jerusalém; e o rei, os seus nobres, as suas esposas[b] e as suas concubinas beberam deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que eles haviam retirado do templo”. O verbo aramaico também pode ser traduzido de forma ativa; a construção passiva mantém o foco nos utensílios.'
    reason: lexical_alternative
  - marker: b
    text: O termo aramaico pode se referir às consortes reais; alguns traduzem por “rainhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a sequência do relato de modo natural e claro em português moderno.
- source_word: הַיְתִיו
  choice: trouxeram
  rationale: No contexto, o verbo indica que os utensílios foram levados ao banquete; a forma ativa corresponde naturalmente à construção aramaica.
- source_word: מָאנֵי דַהֲבָא
  choice: os utensílios de ouro
  rationale: “Utensílios” abrange os objetos usados no serviço do templo e soa mais natural em português do que “vasos” neste contexto.
- source_word: דִּי הַנְפִּקוּ
  choice: que haviam sido retirados
  rationale: A formulação passiva mantém o foco nos utensílios e preserva a referência à retirada anterior do templo.
- source_word: מִן הֵיכְלָא
  choice: do templo
  rationale: Aqui הֵיכְלָא designa claramente o templo de Jerusalém.
- source_word: דִּי בֵית אֱלָהָא
  choice: a casa de Deus
  rationale: Mantém a expressão bíblica formal como explicação aposicional de “templo”.
- source_word: דִּי בִירוּשְׁלֶם
  choice: que ficava em Jerusalém
  rationale: Expressa de maneira fluente a localização indicada pela oração relativa.
- source_word: וְאִשְׁתִּיו בְּהוֹן
  choice: beberam neles
  rationale: O uso de בְּ com os recipientes indica que beberam usando-os; “neles” é conciso, natural e mantém os utensílios como recipientes.
- source_word: רַבְרְבָנוֹהִי
  choice: os seus nobres
  rationale: Refere-se aos grandes dignitários ou magnatas do rei; “nobres” é claro e adequado ao registro.
- source_word: שֵׁגְלָתֵהּ
  choice: as suas esposas
  rationale: O termo pode designar mulheres ou consortes reais; “esposas” é transparente sem restringi-lo apenas a rainhas principais.
- source_word: וּלְחֵנָתֵהּ
  choice: as suas concubinas
  rationale: “Concubinas” é o equivalente tradicional e preciso para mulheres de condição conjugal secundária na corte.
