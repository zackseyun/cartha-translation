  source_fidelity: A tradução preserva a progressão de בֵּאדַיִן (“Então”), a origem expressa de modo pronominal em מִן־קֳדָמוֹהִי, a voz passiva de שְׁלִיחַ e רְשִׁים, e a formulação deliberadamente incomum “a palma de uma mão”. “Da presença dele” é uma equivalência interpretativamente contida, adequadamente esclarecida pela nota literal.
  naturalness: O português é moderno, claro e solene sem se tornar arcaizante. A inversão em “foi enviada a palma de uma mão” é natural no registro narrativo elevado e mantém o foco na aparição da mão. “Esta inscrição foi traçada” comunica bem uma escrita visível, em contexto de inscrição.
