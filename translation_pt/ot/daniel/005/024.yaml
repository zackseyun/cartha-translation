source:
  edition: WLC
  text: בֵּ/אדַ֨יִן֙ מִן קֳדָמ֔וֹ/הִי שְׁלִ֖יַחַ פַּסָּ֣/א דִֽי יְדָ֑/א וּ/כְתָבָ֥/א דְנָ֖ה רְשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/024.yaml
  text: Then from before him the palm of a hand was sent[b][a], and this writing was inscribed.
translation:
  language: pt
  text: Então, da presença dele[a], foi enviada a palma de uma mão, e esta inscrição foi traçada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “de diante dele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi escrita”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: מִן קֳדָמוֹהִי
  choice: da presença dele
  rationale: Expressa em português corrente a ideia aramaica, literalmente espacial, de procedência “de diante dele”, sem explicitar no corpo do versículo um sujeito divino que o texto deixa pronominal.
- source_word: שְׁלִיחַ
  choice: foi enviada
  rationale: Reproduz diretamente a forma passiva do verbo aramaico “enviar” e concorda com “palma”.
- source_word: פַּסָּא דִי יְדָא
  choice: a palma de uma mão
  rationale: Preserva a referência anatômica do aramaico e a aparição súbita de uma mão ainda não identificada, sem substituí-la interpretativamente por “dedos”.
- source_word: וּכְתָבָא דְנָה
  choice: e esta inscrição
  rationale: O demonstrativo aponta para a mensagem que será citada; “inscrição” se ajusta ao escrito traçado na parede.
- source_word: רְשִׁים
  choice: foi traçada
  rationale: Comunica o ato de escrever ou inscrever visivelmente, evitando em português a repetição pouco elegante “inscrição foi escrita”.
theological_decisions:
- issue: Referente de “dele” em “da presença dele”
  choice: Manter o pronome, deixando que o contexto identifique o Altíssimo como a origem da mão.
  alternative: Explicitar “da presença de Deus”.
  rationale: O contexto aponta para Deus, mas o aramaico usa apenas o pronome; a tradução conserva essa contenção e não acrescenta um nome ao versículo.
- issue: Agente passivo do envio e da inscrição
  choice: Conservar as formas passivas sem nomear o agente.
  alternative: Traduzir ativamente, fazendo de Deus o sujeito expresso.
  rationale: As formas passivas do original preservam tanto a solenidade da cena quanto a ausência de um agente gramatical explícito.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada ao idioma receptor, mas a progressão, as formas passivas e a contenção teológica do aramaico foram preservadas.
