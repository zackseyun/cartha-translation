  text: 'Peres: your kingdom has been divided and given to the Medes and Persians[a].'
translation:
  language: pt
  text: 'Peres: seu reino foi dividido e entregue aos medos e aos persas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em aramaico, o termo da inscrição, «Peres», soa como o verbo traduzido por «dividido» e também evoca «Pérsia/persas», preservando o jogo de palavras na interpretação de Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרֵס
  choice: Peres
  rationale: Mantém como transliteração o termo da inscrição que Daniel está interpretando, preservando sua ligação sonora com o verbo aramaico para «dividir» e com «Pérsia/persas».
- source_word: פְּרִיסַת
  choice: foi dividido
  rationale: Traduz o perfeito aramaico como um juízo decisivo anunciado sobre o reino; o pretérito perfeito é natural e claro em português.
- source_word: מַלְכוּתָךְ
  choice: seu reino
  rationale: Expressa naturalmente o domínio governado por Belsazar, mais diretamente do que «realeza» ou «poder real».
- source_word: וִיהִיבַת
  choice: e entregue
  rationale: Comunica de modo natural a transferência passiva do reino a novos governantes.
- source_word: לְמָדַי
  choice: aos medos
  rationale: Entende o termo como designação do povo, em paralelo com «persas».
- source_word: וּפָרָס
  choice: e aos persas
  rationale: Expressa o referente histórico como povo e mantém, por meio da nota, o jogo sonoro com «Peres» e «dividido».
