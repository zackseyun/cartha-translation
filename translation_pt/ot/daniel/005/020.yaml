id: DAN.5.20
reference: Daniel 5:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/כְ/דִי֙ רִ֣ם לִבְבֵ֔/הּ וְ/רוּחֵ֖/הּ תִּֽקְפַ֣ת לַ/הֲזָדָ֑ה הָנְחַת֙ מִן כָּרְסֵ֣א מַלְכוּתֵ֔/הּ וִֽ/יקָרָ֖/ה הֶעְדִּ֥יוּ מִנֵּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/020.yaml
  text: But when his heart was lifted up and his spirit was hardened in arrogance[a], he was brought down from his royal throne[b], and his glory was taken away from him.
translation:
  language: pt
  text: Mas, quando o coração dele se exaltou e seu espírito se endureceu na arrogância[a], ele foi deposto de seu trono real, e sua glória[b] lhe foi tirada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu espírito se tornou arrogante” ou “seu espírito se fortaleceu na presunção”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua honra” ou “sua majestade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְדִי
  choice: Mas, quando
  rationale: A conjunção aramaica introduz a circunstância temporal do juízo e, no contexto, também contrasta com o versículo anterior.
- source_word: רִם לִבְבֵהּ
  choice: o coração dele se exaltou
  rationale: Preserva a metáfora do coração elevado e seu sentido moral de orgulho, sem reduzi-la a uma simples paráfrase.
- source_word: וְרוּחֵהּ תִּקְפַת לַהֲזָדָה
  choice: seu espírito se endureceu na arrogância
  rationale: Expressa tanto o fortalecimento ou enrijecimento interior indicado por תִּקְפַת quanto a arrogância presunçosa indicada por לַהֲזָדָה.
- source_word: הָנְחַת
  choice: ele foi deposto
  rationale: No contexto régio, comunica com clareza que Nabucodonosor foi removido de sua posição elevada, mantendo a forma passiva e sem nomear um agente que o verso não explicita.
- source_word: מִן כָּרְסֵא מַלְכוּתֵהּ
  choice: de seu trono real
  rationale: É uma formulação portuguesa natural para o trono ligado à sua realeza ou domínio régio.
- source_word: וִיקָרֵהּ
  choice: sua glória
  rationale: יְקָר pode significar glória, honra ou majestade; 'glória' se ajusta ao contexto de dignidade régia sem excluir as demais nuances.
- source_word: הֶעְדִּיוּ מִנֵּהּ
  choice: lhe foi tirada
  rationale: O plural com sujeito indefinido é bem representado pela passiva portuguesa, evitando acrescentar um agente explícito.
theological_decisions:
- issue: Natureza da queda de Nabucodonosor
  choice: Descrever sua humilhação por meio da deposição real sem nomear Deus explicitamente nesta frase.
  alternative: Explicitar que Deus o depôs e lhe tirou a glória.
  rationale: Embora o contexto mais amplo identifique Deus como o agente último, esta linha emprega formas passivas ou de agente indefinido. A tradução conserva essa formulação e não torna explícito o que aqui permanece implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora do coração elevado foi preservada; 'foi deposto' transmite naturalmente a remoção do trono, e as notas mantêm abertas as principais nuances lexicais aramaicas.
