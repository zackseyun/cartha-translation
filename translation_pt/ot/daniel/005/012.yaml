  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֡ל דִּ֣י ר֣וּחַ יַתִּירָ֡ה וּ/מַנְדַּ֡ע וְ/שָׂכְלְתָנ֡וּ מְפַשַּׁ֣ר חֶלְמִין֩ וַֽ/אַֽחֲוָיַ֨ת אֲחִידָ֜ן וּ/מְשָׁרֵ֣א קִטְרִ֗ין הִשְׁתְּכַ֤חַת בֵּ/הּ֙ בְּ/דָ֣נִיֵּ֔אל דִּֽי מַלְכָּ֥/א שָׂם שְׁמֵ֖/הּ בֵּלְטְשַׁאצַּ֑ר כְּעַ֛ן דָּנִיֵּ֥אל יִתְקְרֵ֖י וּ/פִשְׁרָ֥/ה יְהַֽחֲוֵֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/012.yaml
  text: because an extraordinary spirit[a], knowledge, and understanding to interpret dreams, explain riddles, and solve difficulties were found in him, in Daniel, whom the king named Belteshazzar. Now let Daniel be called[c][b], and he will show the interpretation.
translation:
  language: pt
  text: porque nele — em Daniel, a quem o rei deu o nome de Beltessazar — foram encontrados um espírito extraordinário[a], conhecimento e entendimento para interpretar sonhos, explicar enigmas e resolver dificuldades[b]. Agora, que Daniel seja chamado, e ele dará a conhecer a interpretação.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito excelente”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “desatar nós”, metáfora para solucionar problemas difíceis.
    reason: cultural_note
  - marker: c
    text: 'Ou: “mostrará a interpretação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: porque
  rationale: Conserva a força causal da expressão aramaica e liga naturalmente esta razão à recomendação feita no contexto.
- source_word: רוּחַ יַתִּירָה
  choice: um espírito extraordinário
  rationale: Comunica a ideia de algo excepcional ou superior sem identificar explicitamente esse espírito como o Espírito de Deus.
- source_word: מַנְדַּע וְשָׂכְלְתָנוּ
  choice: conhecimento e entendimento
  rationale: Mantém distintos os dois termos acumulados no elogio às capacidades de Daniel.
- source_word: מְפַשַּׁר חֶלְמִין
  choice: interpretar sonhos
  rationale: Expressa em português corrente a capacidade descrita pela construção participial aramaica.
- source_word: אַחֲוָיַת אֲחִידָן
  choice: explicar enigmas
  rationale: Transmite de modo claro a ideia de tornar compreensíveis declarações ou questões enigmáticas.
- source_word: מְשָׁרֵא קִטְרִין
  choice: resolver dificuldades
  rationale: Traduz naturalmente a metáfora aramaica de desatar nós, preservada em nota.
- source_word: הִשְׁתְּכַחַת בֵּהּ
  choice: foram encontrados ... nele
  rationale: Mantém a imagem de qualidades e capacidades encontradas em Daniel; o plural é exigido naturalmente pela enumeração em português.
- source_word: דִּי מַלְכָּא שָׂם שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: a quem o rei deu o nome de Beltessazar
  rationale: Forma idiomática e fiel de expressar o ato de o rei estabelecer outro nome para Daniel.
- source_word: כְּעַן דָּנִיֵּאל יִתְקְרֵי
  choice: Agora, que Daniel seja chamado
  rationale: Preserva tanto a transição discursiva quanto o sentido passivo e volitivo da forma aramaica.
- source_word: פִשְׁרָה יְהַחֲוֵה
  choice: ele dará a conhecer a interpretação
  rationale: Representa com naturalidade o sentido de fazer conhecida ou declarar a interpretação.
theological_decisions:
- issue: Sentido de “espírito” na descrição da sabedoria de Daniel
  choice: Manter “um espírito extraordinário” sem especificar sua identidade ou origem
  alternative: Explicitar “o Espírito de Deus” ou reduzir o termo a “disposição/capacidade” humana
  rationale: A expressão elogia o caráter ou a dotação excepcional de Daniel, mas nesta oração não identifica explicitamente o espírito como o Espírito de Deus. A tradução conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da oração foi ajustada para evitar uma abertura pesada, sem alterar a relação causal nem a ênfase em Daniel. As capacidades foram formuladas com infinitivos naturais em português, e a metáfora dos “nós” foi explicada em nota.
