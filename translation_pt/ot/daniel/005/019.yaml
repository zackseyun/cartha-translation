  text: וּ/מִן רְבוּתָ/א֙ דִּ֣י יְהַב לֵ֔/הּ כֹּ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ/א֙ וְ/לִשָּׁ֣נַיָּ֔/א הֲו֛וֹ זאעין וְ/דָחֲלִ֖ין מִן קֳדָמ֑וֹ/הִי דִּֽי הֲוָ֨ה צָבֵ֜א הֲוָ֣א קָטֵ֗ל וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מַחֵ֔א וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מָרִ֔ים וְ/דִֽי הֲוָ֥ה צָבֵ֖א הֲוָ֥ה מַשְׁפִּֽיל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/019.yaml
  text: And because of the greatness that he gave him[a], all peoples, nations, and languages were trembling and fearing before him. Whomever he wanted, he killed; and whomever he wanted, he kept alive; and whomever he wanted, he raised up; and whomever he wanted[c][b], he humbled.
translation:
  language: pt
  text: E, por causa da grandeza que ele lhe havia dado[a], todos os povos, nações e línguas tremiam e temiam diante dele. A quem queria, matava; a quem queria, deixava viver; a quem queria, exaltava; e a quem queria, humilhava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito de “havia dado” não é expresso nesta oração; pelo contexto do versículo anterior, refere-se a Deus.
    reason: cross_reference
lexical_decisions:
- source_word: רְבוּתָא
  choice: grandeza
  rationale: Expressa grandeza, majestade ou posição elevada; “grandeza” preserva a amplitude do termo e se encaixa naturalmente no contexto régio.
- source_word: יְהַב לֵהּ
  choice: ele lhe havia dado
  rationale: Mantém o sujeito implícito do aramaico, cujo referente contextual é Deus no versículo anterior. O mais-que-perfeito esclarece a relação anterior com a reação subsequente dos povos.
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: povos, nações e línguas
  rationale: Preserva a tríade convencional de Daniel e usa vocabulário corrente em português.
- source_word: זאעין וְדָחֲלִין
  choice: tremiam e temiam
  rationale: Conserva os dois termos coordenados e sua intensificação retórica, sem fundi-los em uma única ideia.
- source_word: מִן קֳדָמוֹהִי
  choice: diante dele
  rationale: Equivalente idiomático para estar em sua presença e sob seu poder.
- source_word: דִּי הֲוָה צָבֵא
  choice: a quem queria
  rationale: A repetição preserva a ênfase do texto no exercício da vontade pessoal do rei.
- source_word: קָטֵל
  choice: matava
  rationale: Tradução direta e vigorosa do verbo; o aspecto habitual da sequência é expresso naturalmente pelo imperfeito em português.
- source_word: מַחֵא
  choice: deixava viver
  rationale: No paralelismo antitético com “matava”, indica permitir que alguém permanecesse vivo; também pode significar conservar vivo ou poupar.
- source_word: מָרִים
  choice: exaltava
  rationale: No contexto, o ato de levantar é figurativo, referente à elevação de posição; “exaltava” mantém o contraste com “humilhava” de modo natural.
- source_word: מַשְׁפִּיל
  choice: humilhava
  rationale: Expressa fazer descer ou rebaixar e preserva o contraste literário e conceitual com “exaltava”.
theological_decisions:
- issue: Agente da grandeza concedida a Nabucodonosor
  choice: Manter “ele” como sujeito implícito/contextual, sem inserir “Deus” no texto principal.
  alternative: 'Traduzir explicitamente: “a grandeza que Deus lhe havia dado”.'
  rationale: O aramaico não repete o nome de Deus nesta oração, embora o versículo anterior deixe claro que ele é o referente. A tradução preserva essa coesão e evita explicitar no corpo do texto o que permanece implícito na fonte.
- issue: Alcance da autoridade descrita
  choice: 'Reproduzir a série como descrição da vontade régia: “a quem queria...”.'
  alternative: Qualificar moralmente a autoridade como arbitrária ou absoluta.
  rationale: O texto enfatiza o poder exercido segundo a vontade do rei, mas não inclui aqui um qualificativo moral explícito; por isso, a tradução não acrescenta um julgamento interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição sintática do aramaico foi mantida por sua força retórica. Usou-se o imperfeito (“matava”, “deixava”, “exaltava”, “humilhava”) para retratar ações características ou reiteradas do rei.
