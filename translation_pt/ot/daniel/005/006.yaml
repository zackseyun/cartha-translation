base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/006.yaml
  text: Then the king’s color changed[a], and his thoughts terrified him; the joints of his hips gave way[b], and his knees knocked against each other.
translation:
  language: pt
  text: Então, o rei mudou de cor[a], e seus pensamentos o aterrorizaram; as articulações dos seus quadris cederam[b], e seus joelhos batiam um contra o outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “seu brilho mudou”. A expressão aramaica indica que sua aparência ou compleição mudou por causa do medo.
    reason: lexical_alternative
  - marker: b
    text: Ou “as articulações dos seus lombos se afrouxaram”. A expressão descreve a fraqueza física ou o colapso provocado pelo terror.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Advérbio temporal aramaico que introduz o acontecimento seguinte na narrativa; “Então” é natural e direto.
- source_word: מַלְכָּא
  choice: o rei
  rationale: O substantivo em estado enfático retoma o rei já identificado no contexto.
- source_word: זִיוֹהִי שְׁנוֹהִי
  choice: mudou de cor
  rationale: A expressão literalmente ligada ao brilho ou aspecto descreve uma mudança visível na aparência ou compleição do rei; a formulação portuguesa comunica naturalmente a reação de medo.
- source_word: רַעְיוֹנֹהִי
  choice: seus pensamentos
  rationale: Mantém o sentido direto de pensamentos ou impressões mentais sem reduzir a expressão a um estado genérico da mente.
- source_word: יְבַהֲלוּנֵּהּ
  choice: o aterrorizaram
  rationale: O verbo indica susto ou perturbação intensa; a reação física subsequente sustenta “aterrorizaram”.
- source_word: קִטְרֵי חַרְצֵהּ
  choice: as articulações dos seus quadris
  rationale: A difícil expressão se refere às junções ou articulações da região dos lombos/quadris, preservando a imagem corporal do aramaico.
- source_word: מִשְׁתָּרַיִן
  choice: cederam
  rationale: Expressa de modo idiomático o afrouxamento das articulações e a perda de firmeza causada pelo terror.
- source_word: אַרְכֻבָּתֵהּ
  choice: seus joelhos
  rationale: Equivalente português comum e preciso para o substantivo aramaico.
- source_word: דָּא לְדָא
  choice: um contra o outro
  rationale: Reproduz naturalmente a expressão recíproca aramaica.
- source_word: נָקְשָׁן
  choice: batiam
  rationale: O verbo significa golpear ou bater; no imperfeito português, retrata vividamente os joelhos chocando-se por medo.
