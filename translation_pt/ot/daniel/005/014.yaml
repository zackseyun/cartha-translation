id: DAN.5.14
reference: Daniel 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שִׁמְעֵ֣ת עלי/ך דִּ֛י ר֥וּחַ אֱלָהִ֖ין בָּ֑/ךְ וְ/נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה יַתִּירָ֖ה הִשְׁתְּכַ֥חַת בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/014.yaml
  text: And I have heard about you that the spirit of the gods is in you[b][a], and that light and insight and extraordinary wisdom are found in you.
translation:
  language: pt
  text: E ouvi dizer a seu respeito que o espírito dos deuses está em você[a], e que em você se encontram luz[b], discernimento e sabedoria extraordinária.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o espírito de Deus” ou “o Espírito de Deus”. O aramaico diz literalmente “o espírito dos deuses”, refletindo a maneira de falar do rei.'
    reason: alternative_reading
  - marker: b
    text: “Luz” é usada aqui metaforicamente no sentido de clareza mental; também pode ser traduzida como “claridade” ou “iluminação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁמְעֵת עֲלָיִךְ
  choice: E ouvi dizer a seu respeito
  rationale: A forma perfeita relata uma informação que chegou ao conhecimento do rei; em português, “ouvi dizer” expressa isso com naturalidade.
- source_word: דִּי
  choice: que
  rationale: Introduz o conteúdo do que o rei ouviu.
- source_word: רוּחַ אֱלָהִין
  choice: o espírito dos deuses
  rationale: אֱלָהִין é formalmente plural, e a tradução preserva a perspectiva e a linguagem cortesã do rei babilônico.
- source_word: בָּךְ
  choice: está em você / em você
  rationale: Mantém a expressão locativa simples; a segunda ocorrência foi deslocada para o início da oração por fluidez em português.
- source_word: נַהִירוּ
  choice: luz
  rationale: Preserva a imagem concreta de luz ou claridade, empregada metaforicamente para clareza mental.
- source_word: שָׂכְלְתָנוּ
  choice: discernimento
  rationale: Comunica compreensão e capacidade de avaliar com acerto, distinguindo o termo de “sabedoria”.
- source_word: חָכְמָה יַתִּירָה
  choice: sabedoria extraordinária
  rationale: יַתִּירָה indica algo que excede o comum; “extraordinária” reproduz essa força em português atual.
- source_word: הִשְׁתְּכַחַת
  choice: se encontram
  rationale: Expressa o sentido passivo de serem achadas ou reconhecidas essas qualidades em Daniel, com formulação natural em português.
theological_decisions:
- issue: Se אֱלָהִין deve ser traduzido no singular (“Deus”) ou no plural (“deuses”) na fala do rei pagão
  choice: o espírito dos deuses
  alternative: o espírito de Deus; o Espírito de Deus
  rationale: O plural morfológico e o contexto da fala de Belsazar favorecem a formulação politeísta. A nota conserva a leitura singular adotada por algumas traduções sem impor essa interpretação ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” corresponde ao tratamento direto singular do aramaico. A repetição de בָּךְ foi preservada semanticamente, mas reposicionada na segunda oração para evitar rigidez.
