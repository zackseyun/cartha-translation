base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/009.yaml
  text: Then King Belshazzar became greatly alarmed[a], his color changed[b], and his nobles were perplexed.
translation:
  language: pt
  text: Então o rei Belsazar ficou muito alarmado, a cor do seu rosto mudou, e seus nobres ficaram perplexos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que introduz o acontecimento seguinte; “Então” preserva com naturalidade o fluxo narrativo.
- source_word: מַלְכָּא בֵלְשַׁאצַּר
  choice: o rei Belsazar
  rationale: O título seguido do nome próprio corresponde à ordem natural em português.
- source_word: שַׂגִּיא מִתְבָּהַל
  choice: ficou muito alarmado
  rationale: O intensificador שַׂגִּיא reforça o estado de perturbação expresso por מִתְבָּהַל; a formulação comunica uma reação intensa sem impor “aterrorizado” como única nuance possível.
- source_word: וְזִיוֹהִי שָׁנַיִן עֲלוֹהִי
  choice: a cor do seu rosto mudou
  rationale: זִיו pode indicar brilho, aparência ou aspecto do rosto; no contexto de medo, a expressão idiomática descreve uma mudança visível na fisionomia ou coloração. A tradução explicita o rosto para tornar o idioma aramaico claro em português.
- source_word: וְרַבְרְבָנוֹהִי
  choice: seus nobres
  rationale: Designa os grandes do reino, isto é, altos dignitários da corte; “nobres” é claro, digno e adequado ao contexto.
- source_word: מִשְׁתַּבְּשִׁין
  choice: ficaram perplexos
  rationale: O particípio descreve confusão ou desorientação; “ficaram perplexos” expressa naturalmente o estado resultante em português.
