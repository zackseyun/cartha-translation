base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/026.yaml
  text: 'This is the interpretation of the message: MENE—God has numbered your kingdom and finished it[a][b].'
translation:
  language: pt
  text: 'Esta é a interpretação da mensagem[b]: MENE[a] — Deus contou o seu reino e pôs fim a ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em aramaico, MENE soa como o verbo que significa “contou” ou “numerou”.
    reason: lexical_alternative
  - marker: b
    text: Ou “palavra”, “assunto” ou “inscrição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Esta é
  rationale: O demonstrativo aramaico introduz a explicação; em português, a cópula expressa torna a oração nominal natural.
- source_word: פְּשַׁר
  choice: interpretação
  rationale: Em Daniel, o termo designa regularmente a interpretação de sonhos ou de escrita enigmática.
- source_word: מִלְּתָא
  choice: mensagem
  rationale: O termo pode significar “palavra”, “assunto” ou “coisa”; neste contexto, refere-se à escrita na parede enquanto comunicação significativa.
- source_word: מְנֵא
  choice: MENE
  rationale: Mantém-se a transliteração do termo inscrito, que Daniel passa a interpretar.
- source_word: מְנָה
  choice: contou
  rationale: O verbo significa contar ou numerar e explica MENE por meio de um jogo de palavras. “Contou” é idiomático em português, enquanto a nota preserva a ligação lexical.
- source_word: אֱלָהָא
  choice: Deus
  rationale: A forma determinada é naturalmente vertida como “Deus” neste contexto.
- source_word: מַלְכוּתָךְ
  choice: o seu reino
  rationale: O substantivo designa o domínio real; “reino” preserva tanto o governo quanto a esfera governada.
- source_word: וְהַשְׁלְמַהּ
  choice: e pôs fim a ele
  rationale: A forma verbal comunica conclusão ou término; no contexto de juízo, “pôs fim” evita sugerir mera realização bem-sucedida.
theological_decisions:
- issue: Natureza da ação divina na interpretação de MENE
  choice: Deus contou o reino de Belsazar e pôs fim a ele
  alternative: Deus contou os dias do reino de Belsazar e o concluiu
  rationale: A tradução preserva a imagem de contagem e a ação divina de encerramento sem acrescentar “dias”, que está implícito em algumas interpretações, mas não expresso no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem segue de perto o aramaico sem sacrificar a naturalidade. Os marcadores aparecem após a frase à qual se aplicam, embora a nota [a] esclareça MENE e a nota [b], “mensagem”.
