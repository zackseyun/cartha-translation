base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/001.yaml
  text: King Belshazzar made a great feast for a thousand of his nobles[a], and in the presence of the thousand he was drinking wine.
translation:
  language: pt
  text: O rei Belsazar deu um grande banquete para mil dos seus nobres e, na presença dos mil, bebia vinho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e diante dos mil bebeu vinho». A expressão aramaica pode ser traduzida mais literalmente por «diante de», mas aqui provavelmente indica que ele bebia publicamente na presença dos mil convidados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: O rei
  rationale: O substantivo em estado enfático aparece em aposição ao nome próprio; em português, «O rei Belsazar» é uma formulação natural.
- source_word: עֲבַד
  choice: deu
  rationale: Embora o verbo aramaico signifique literalmente «fez», em português se diz naturalmente «dar um banquete»; a escolha preserva o sentido contextual sem soar artificial.
- source_word: לְחֶם רַב
  choice: um grande banquete
  rationale: לְחֶם pode designar pão ou comida, mas neste contexto cortesão refere-se a uma refeição festiva; «grande banquete» comunica adequadamente a expressão inteira.
- source_word: לְרַבְרְבָנֹוהִי
  choice: para mil dos seus nobres
  rationale: O termo designa grandes homens ou altos dignitários. «Nobres» é claro, atual e apropriado ao ambiente da corte, sem especificar um cargo não indicado no texto.
- source_word: אֲלַף
  choice: mil
  rationale: Correspondência direta do numeral cardinal; o português não requer artigo indefinido nesta construção.
- source_word: וְלָקֳבֵל
  choice: e, na presença dos mil
  rationale: A expressão pode significar literalmente «diante de» e, no contexto, indica que Belsazar bebia publicamente na presença dos convidados.
- source_word: חַמְרָא
  choice: vinho
  rationale: Equivalente português corrente do termo aramaico.
- source_word: שָׁתֵה
  choice: bebia
  rationale: O particípio aramaico expressa ação em curso; o pretérito imperfeito português reproduz naturalmente esse aspecto progressivo.
