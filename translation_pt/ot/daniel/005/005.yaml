source:
  edition: WLC
  text: בַּ/הּ שַׁעֲתָ֗/ה נפקו אֶצְבְּעָן֙ דִּ֣י יַד אֱנָ֔שׁ וְ/כָֽתְבָן֙ לָ/קֳבֵ֣ל נֶבְרַשְׁתָּ֔/א עַל גִּירָ֕/א דִּֽי כְתַ֥ל הֵיכְלָ֖/א דִּ֣י מַלְכָּ֑/א וּ/מַלְכָּ֣/א חָזֵ֔ה פַּ֥ס יְדָ֖/ה דִּ֥י כָתְבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/005.yaml
  text: At that moment the fingers of a human hand came out and wrote opposite the lampstand on the plaster of the wall of the king’s palace[e][d][c][b][a], and the king saw the palm of the hand that was writing.
translation:
  language: pt
  text: Naquele momento, saíram os dedos de uma mão humana[a] e escreveram diante do candelabro[b], sobre o reboco[c] da parede do palácio do rei[d]; e o rei viu a palma[e] da mão que escrevia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os dedos da mão de um homem». O aramaico אֱנָשׁ pode significar «homem» ou, de modo mais geral, «ser humano».
    reason: lexical_alternative
  - marker: b
    text: Ou «em frente ao candelabro».
    reason: lexical_alternative
  - marker: c
    text: Ou «sobre o reboco de cal» ou «sobre a caiação».
    reason: lexical_alternative
  - marker: d
    text: Ou «do salão do rei»; o termo aramaico pode designar um palácio ou um grande salão dentro dele.
    reason: lexical_alternative
  - marker: e
    text: Ou, possivelmente, apenas «a mão»; o sentido exato de פַּס neste contexto é discutido.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָה
  choice: Naquele momento
  rationale: Expressa o ponto imediato no tempo e preserva a súbita irrupção do acontecimento em português natural.
- source_word: נפקו
  choice: saíram
  rationale: Mantém o sentido concreto e vívido de sair ou emergir, sem substituí-lo pela interpretação mais genérica «apareceram».
- source_word: אֶצְבְּעָן דִּי יַד אֱנָשׁ
  choice: os dedos de uma mão humana
  rationale: Reproduz naturalmente a construção aramaica; «humana» preserva o contraste implícito sem identificar necessariamente um homem específico.
- source_word: וְכָתְבָן
  choice: e escreveram
  rationale: O plural concorda com «dedos» e o pretérito perfeito apresenta com clareza a sequência narrativa.
- source_word: לָקֳבֵל נֶבְרַשְׁתָּא
  choice: diante do candelabro
  rationale: לָקֳבֵל indica posição diante de, em frente a ou defronte de; «candelabro» é uma designação corrente para o suporte de luz referido.
- source_word: עַל גִּירָא
  choice: sobre o reboco
  rationale: Designa a camada de cal ou argamassa que revestia a parede; «reboco» é claro e corrente em português.
- source_word: דִּי כְתַל הֵיכְלָא דִּי מַלְכָּא
  choice: da parede do palácio do rei
  rationale: כְתַל significa «parede», enquanto הֵיכְלָא pode indicar palácio ou grande salão; «palácio» se ajusta bem ao contexto régio, sem ocultar a alternativa.
- source_word: וּמַלְכָּא חָזֵה
  choice: e o rei viu
  rationale: O pretérito perfeito é a forma narrativa natural em português.
- source_word: פַּס יְדָה
  choice: a palma da mão
  rationale: פַּס pode indicar a parte extrema ou uma porção da mão; «palma» é uma interpretação específica tradicional e plausível, mas a incerteza é registrada em nota.
- source_word: דִּי כָתְבָה
  choice: que escrevia
  rationale: O imperfeito retrata a mão no decorrer da ação que o rei estava vendo.
