  text: קָרֵ֤א מַלְכָּ/א֙ בְּ/חַ֔יִל לְ/הֶֽעָלָה֙ לְ/אָ֣שְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/חַכִּימֵ֣י בָבֶ֗ל דִּ֣י כָל אֱ֠נָשׁ דִּֽי יִקְרֵ֞ה כְּתָבָ֣/ה דְנָ֗ה וּ/פִשְׁרֵ/הּ֙ יְחַוִּנַּ֔/נִי אַרְגְּוָנָ֣/א יִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארֵ֔/הּ וְ/תַלְתִּ֥י בְ/מַלְכוּתָ֖/א יִשְׁלַֽט׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/007.yaml
  text: The king called out loudly to bring in the enchanters[a], the Chaldeans, and the diviners. The king answered and said to the wise men of Babylon, “Any man who reads this writing and makes its interpretation known to me shall be clothed with purple, have a chain of gold around his neck[c][b], and rule as third in the kingdom.”
translation:
  language: pt
  text: 'O rei gritou, mandando trazer os encantadores, os caldeus[a] e os adivinhos. O rei respondeu e disse aos sábios da Babilônia: “Quem ler esta escrita e me der a conhecer a sua interpretação será vestido de púrpura, terá uma corrente de ouro sobre o pescoço e terá o terceiro posto no reino[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os astrólogos”. Aqui, “caldeus” pode designar uma classe de sábios da corte babilônica, e não apenas o grupo étnico.
    reason: lexical_alternative
  - marker: b
    text: Ou “será o terceiro governante do reino”. O aramaico provavelmente se refere ao terceiro posto em autoridade.
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵא ... בְּחַיִל
  choice: gritou
  rationale: A expressão aramaica indica um chamado forte e público; “gritou” transmite naturalmente a intensidade em português.
- source_word: לְהֶעָלָה
  choice: mandando trazer
  rationale: O infinitivo causativo, neste contexto de corte, expressa a ordem de fazer comparecer os especialistas diante do rei.
- source_word: אָשְׁפַיָּא
  choice: os encantadores
  rationale: Designa uma classe de especialistas em práticas ocultas; “encantadores” a distingue do grupo mais amplo dos sábios.
- source_word: כשדי/א
  choice: os caldeus
  rationale: Preserva a designação aramaica, que pode referir-se tanto aos caldeus como grupo quanto a uma classe profissional de sábios da corte; a alternativa é registrada em nota.
- source_word: גָזְרַיָּא
  choice: os adivinhos
  rationale: O termo descreve especialistas que determinavam ou pronunciavam interpretações e presságios.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: O rei tomou a palavra e disse
  rationale: Reproduz com naturalidade a fórmula narrativa semítica, preservando a ideia de que o rei passou a falar.
- source_word: לְחַכִּימֵי בָבֶל
  choice: aos sábios da Babilônia
  rationale: Tradução direta da designação coletiva dos sábios da corte babilônica.
- source_word: כָל אֱנָשׁ
  choice: Quem
  rationale: A expressão masculina singular tem sentido genérico no contexto; “quem” é natural, abrangente e fiel à função da construção.
- source_word: יִקְרֵה כְּתָבָה דְנָה
  choice: ler esta escrita
  rationale: “Escrita” mantém o sentido amplo do texto aramaico e se ajusta à mensagem escrita na parede.
- source_word: וּפִשְׁרֵהּ יְחַוִּנַּנִי
  choice: me der a conhecer a sua interpretação
  rationale: Preserva tanto o substantivo “interpretação” quanto o sentido verbal de fazer conhecer ou declarar.
- source_word: אַרְגְּוָנָא יִלְבַּשׁ
  choice: será vestido de púrpura
  rationale: Mantém a forma passiva e o símbolo de honra régia do original.
- source_word: ו/המונכא די דהבא על צוארהּ
  choice: receberá uma corrente de ouro ao redor do pescoço
  rationale: Expressa de modo idiomático a concessão do ornamento honorífico, embora o original diga literalmente que a corrente estará sobre o pescoço.
- source_word: וְתַלְתִּי בְמַלְכוּתָא יִשְׁלַט
  choice: governará como o terceiro no reino
  rationale: Mantém a provável referência ao terceiro posto de autoridade sem transformar a expressão em um título mais definido do que o aramaico permite.
theological_decisions:
- issue: Sentido de “caldeus”
  choice: Manter “caldeus” no texto
  alternative: “astrólogos” ou outra designação profissional
  rationale: O termo pode ser étnico ou técnico-profissional; manter a forma tradicional no texto e indicar a ambiguidade em nota evita decidir além da evidência.
- issue: Posição prometida no reino
  choice: “governará como o terceiro no reino”
  alternative: “será o terceiro governante do reino”
  rationale: A formulação escolhida preserva a provável ideia de terceiro em autoridade, sem eliminar completamente a nuance idiomática da expressão aramaica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva os grupos distintos de especialistas da corte e mantém em nota as ambiguidades reais de “caldeus” e da posição de terceiro no reino.
