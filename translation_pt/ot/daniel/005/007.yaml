revisions:
- from: 'O rei gritou, mandando trazer os encantadores, os caldeus[a] e os adivinhos. O rei tomou a palavra e disse aos sábios da Babilônia: “Quem ler esta escrita e me der a conhecer a sua interpretação será vestido de púrpura, receberá uma corrente de ouro ao redor do pescoço e governará como o terceiro no reino[b].”'
  to: 'O rei gritou, mandando trazer os encantadores, os caldeus[a] e os adivinhos. O rei respondeu e disse aos sábios da Babilônia: “Quem ler esta escrita e me der a conhecer a sua interpretação será vestido de púrpura, terá uma corrente de ouro sobre o pescoço e terá o terceiro posto no reino[b].”'
  rationale: A revisão ajusta a descrição da corrente ao sentido espacial do aramaico e substitui a formulação menos idiomática sobre o cargo por «terá o terceiro posto no reino», mantendo a ambiguidade histórica e a explicação em nota. «Respondeu e disse» reproduz com maior proximidade a fórmula narrativa original em português bíblico moderno.
