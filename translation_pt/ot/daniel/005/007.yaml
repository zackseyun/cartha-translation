    rationale: O original descreve uma corrente/colar de ouro «sobre o seu pescoço». «Ao redor» pode sugerir uma ação ou disposição mais específica que o texto não afirma. «Uma corrente de ouro sobre o pescoço» é mais fiel e natural.
  - severity: low
    issue: «governará como o terceiro no reino»
    rationale: A formulação é compreensível, mas soa pouco natural e pode ser lida como uma função governativa vaga. «Terá o terceiro posto no reino» preserva a expressão concisa e a nota esclarece a provável ideia de posição em autoridade.
