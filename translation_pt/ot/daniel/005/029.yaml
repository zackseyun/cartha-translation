base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/029.yaml
  text: Then Belshazzar gave the command[a], and they clothed Daniel with purple, put a chain of gold around his neck[b], and proclaimed concerning him that he should be the third ruler in the kingdom.
translation:
  language: pt
  text: Então Belsazar deu a ordem, e vestiram Daniel de púrpura[a], puseram uma corrente de ouro em volta do pescoço dele e proclamaram a respeito dele que seria o terceiro governante[b] do reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobriram Daniel com tecido púrpura”. O termo aramaico pode indicar roupa ou tecido púrpura usado como sinal de honra régia.
    reason: lexical_alternative
  - marker: b
    text: Ou “o terceiro em autoridade no reino”. A expressão indica a posição de Daniel na hierarquia do reino.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que introduz o acontecimento seguinte na sequência narrativa; “Então” é natural e preserva esse fluxo.
- source_word: אֲמַר
  choice: deu a ordem
  rationale: Embora o sentido básico seja “disse”, o contexto régio e a execução imediata por terceiros indicam uma ordem.
- source_word: בֵּלְשַׁאצַּר
  choice: Belsazar
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: וְהַלְבִּישׁוּ לְדָנִיֵּאל אַרְגְּוָנָא
  choice: vestiram Daniel de púrpura
  rationale: O verbo causativo plural indica que Daniel foi vestido, e o substantivo designa púrpura, seja como tecido, seja como traje de honra régia.
- source_word: ו/המונכא דִי דַהֲבָא
  choice: uma corrente de ouro
  rationale: O substantivo se refere a uma corrente ornamental usada como sinal de honra; a formulação é clara e corrente em português.
- source_word: עַל צַוְּארֵהּ
  choice: em volta do pescoço dele
  rationale: Expressão idiomática em português para a colocação de um ornamento no pescoço, preservando a referência inequívoca a Daniel.
- source_word: וְהַכְרִזוּ עֲלֹוהִי
  choice: e proclamaram a respeito dele
  rationale: O verbo descreve um anúncio público, e a locução prepositiva identifica Daniel como objeto da proclamação.
- source_word: דִּי לֶהֱוֵא
  choice: que seria
  rationale: Expressa de modo natural o conteúdo da proclamação e a nomeação resultante, sem acrescentar certeza além da declaração oficial.
- source_word: שַׁלִּיט תַּלְתָּא
  choice: o terceiro governante
  rationale: Preserva o ordinal e apresenta שַׁלִּיט como título de autoridade no contexto da corte.
- source_word: בְּמַלְכוּתָא
  choice: do reino
  rationale: Em português, “terceiro governante do reino” comunica naturalmente a esfera em que a autoridade seria exercida; literalmente, a construção também pode ser vertida “no reino”.
