  yaml_path: translation/ot/daniel/005/030.yaml
  text: In that very night Belshazzar[a], the Chaldean king, was killed.
translation:
  language: pt
  text: Naquela mesma noite, Belsazar, rei dos caldeus, foi morto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּהּ בְּלֵילְיָא
  choice: Naquela mesma noite
  rationale: 'A combinação aramaica do pronome sufixado com a expressão temporal tem sentido idiomático de identidade e ênfase: “naquela mesma noite”. A formulação é natural em português e conserva a força dêitica.'
- source_word: קְטִיל
  choice: foi morto
  rationale: A forma aramaica comunica estado ou resultado passivo do verbo “matar”. “Foi morto” preserva a voz passiva e é claro e corrente, sem o tom mais literário de “foi assassinado” ou “foi morto à espada”.
- source_word: בֵּלְאשַׁצַּר
  choice: Belsazar
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: מַלְכָּא כשדיא
  choice: rei dos caldeus
  rationale: Traduz diretamente o título e a designação étnica. “Dos caldeus” preserva com maior transparência a forma lexical do aramaico, sem substituí-la pela interpretação mais ampla “babilônio”.
