  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַ֣ל מָרֵֽא שְׁמַיָּ֣/א הִתְרוֹמַ֡מְתָּ וּ/לְ/מָֽאנַיָּ֨/א דִֽי בַיְתֵ֜/הּ הַיְתִ֣יו קדמי/ך ו/אנתה ו/רברבני/ך שֵֽׁגְלָתָ֣/ךְ וּ/לְחֵנָתָ/ךְ֮ חַמְרָ/א֮ שָׁתַ֣יִן בְּ/הוֹן֒ וְ/לֵֽ/אלָהֵ֣י כַסְפָּֽ/א וְ֠/דַהֲבָ/א נְחָשָׁ֨/א פַרְזְלָ֜/א אָעָ֣/א וְ/אַבְנָ֗/א דִּ֠י לָֽא חָזַ֧יִן וְ/לָא שָׁמְעִ֛ין וְ/לָ֥א יָדְעִ֖ין שַׁבַּ֑חְתָּ וְ/לֵֽ/אלָהָ֞/א דִּֽי נִשְׁמְתָ֥/ךְ בִּ/ידֵ֛/הּ וְ/כָל אֹרְחָתָ֥/ךְ לֵ֖/הּ לָ֥א הַדַּֽרְתָּ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/023.yaml
  text: But you have exalted yourself against the Lord of heaven[a], and the vessels of his house were brought before you, and you and your nobles, your wives, and your concubines have been drinking wine from them. And you have praised the gods of silver and gold, bronze, iron, wood, and stone, which do not see or hear or know; but the God in whose hand is your breath, and to whom belong all your ways[c][b], you have not honored.
translation:
  language: pt
  text: Mas você se exaltou contra o Senhor do céu[a]. Os utensílios da casa dele foram trazidos à sua presença, e você, os seus nobres, as suas mulheres e as suas concubinas beberam vinho deles. Você louvou os deuses de prata e de ouro, de bronze, de ferro, de madeira e de pedra, que não veem, não ouvem nem sabem; mas não honrou o Deus em cuja mão está o seu fôlego[b] e a quem pertencem todos os seus caminhos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Mestre do céu”. O título aramaico pode significar “senhor” ou “mestre”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o Deus que segura o seu fôlego na mão”.
    reason: lexical_alternative
  - marker: c
    text: Ou “não glorificou” ou “não deu glória a”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרֵא שְׁמַיָּא
  choice: o Senhor do céu
  rationale: מָרֵא significa senhor ou soberano; “Senhor” é natural e digno como título divino, enquanto o singular coletivo שְׁמַיָּא é bem representado por “céu” neste contexto.
- source_word: הִתְרוֹמַמְתָּ
  choice: você se exaltou
  rationale: O tema reflexivo expressa autoexaltação arrogante; a formulação conserva tanto o sentido quanto a imagem ascendente.
- source_word: מָאנַיָּא דִי בַיְתֵהּ
  choice: os utensílios da casa dele
  rationale: “Utensílios” comunica de modo claro os objetos usados no templo, e “casa dele” preserva a expressão concreta do aramaico sem substituir sua imagem por “templo”.
- source_word: רַבְרְבָנַיִךְ
  choice: os seus nobres
  rationale: O termo designa altos dignitários da corte; “nobres” é conciso, corrente e adequado ao cenário real.
- source_word: שֵׁגְלָתָךְ וּלְחֵנָתָךְ
  choice: as suas mulheres e as suas concubinas
  rationale: O primeiro termo indica mulheres ou consortes reais, enquanto o segundo distingue concubinas; a tradução mantém essa diferença de condição.
- source_word: חַמְרָא שָׁתַיִן בְּהוֹן
  choice: beberam vinho neles
  rationale: O particípio aramaico descreve a ação na cena; o pretérito perfeito é natural em português narrativo. “Neles” preserva o uso instrumental dos utensílios.
- source_word: שַׁבַּחְתָּ
  choice: louvou
  rationale: “Louvar” traduz diretamente a ideia de exaltar ou elogiar e se ajusta ao objeto religioso sem acrescentar interpretação.
- source_word: אֱלָהֵי כַסְפָּא וְדַהֲבָא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא
  choice: os deuses de prata e de ouro, de bronze, de ferro, de madeira e de pedra
  rationale: A cadeia genitiva enumera os materiais dos ídolos; repetir “de” produz clareza e ritmo natural em português.
- source_word: דִּי לָא חָזַיִן וְלָא שָׁמְעִין וְלָא יָדְעִין
  choice: que não veem, não ouvem nem sabem
  rationale: A tradução conserva os três verbos concretos e o contraste retórico sobre a impotência dos ídolos, sem interpretar יָדְעִין como “entendem”.
- source_word: אֱלָהָא דִּי נִשְׁמְתָךְ בִּידֵהּ
  choice: o Deus em cuja mão está o seu fôlego
  rationale: A formulação mantém a metáfora concreta da mão divina e o substantivo “fôlego”, expressando soberania sobre a vida sem parafrasear como “destino” ou simplesmente “vida”.
- source_word: וְכָל אֹרְחָתָךְ לֵהּ
  choice: e a quem pertencem todos os seus caminhos
  rationale: A construção de posse com לֵהּ é expressa naturalmente por “a quem pertencem”; “caminhos” preserva a imagem ampla da conduta e do curso da vida.
- source_word: לָא הַדַּרְתָּ
  choice: não honrou
  rationale: O verbo denota honrar ou glorificar; “honrou” é direto e preserva a contraposição com o louvor prestado aos ídolos.
theological_decisions:
- issue: Título divino מָרֵא
  choice: o Senhor do céu
  alternative: o Soberano do céu
  rationale: “Senhor” comunica domínio divino de forma idiomática e elevada, sem acrescentar uma identificação cristológica que não está explicitada no texto.
- issue: Soberania de Deus sobre a vida humana
  choice: manter “em cuja mão está o seu fôlego”
  alternative: “que tem a sua vida nas mãos”
  rationale: 'A redação conserva a imagem e a tensão do original: o próprio fôlego do rei está sob o poder de Deus.'
- issue: Alcance de “todos os seus caminhos”
  choice: preservar “caminhos” e a relação de pertença
  alternative: interpretar como “destino”, “conduta” ou “tudo o que você faz”
  rationale: A expressão pode abranger trajetória, ações e curso de vida; traduzi-la literalmente preserva essa amplitude teológica e semântica.
- issue: Contraste entre louvar ídolos e honrar Deus
  choice: “louvou” os deuses, mas “não honrou” Deus
  alternative: usar “glorificou” em uma ou nas duas orações
  rationale: 'Os verbos aramaicos são distintos. Manter verbos distintos preserva a acusação: o rei dirigiu louvor a ídolos impotentes e recusou honra ao Deus vivo.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” porque a fala é uma repreensão direta ao rei e evita formas excessivamente arcaicas. Mantém imagens concretas do aramaico — casa, mão, fôlego e caminhos — enquanto usa “utensílios” para clareza contemporânea.
