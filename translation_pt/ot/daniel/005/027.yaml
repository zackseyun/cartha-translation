  text: 'Tekel: you have been weighed in the balances and found lacking[a][b][c].'
translation:
  language: pt
  text: 'Tequel: você foi pesado na balança e achado em falta[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O aramaico Tequel é a palavra da inscrição que Daniel interpreta; ela está relacionada à ideia de pesar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nos pratos da balança”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “considerado insuficiente” ou “achado deficiente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקֵל
  choice: Tequel
  rationale: Mantém transliterada a palavra aramaica da inscrição que Daniel passa a interpretar, preservando a distinção entre o termo escrito e sua explicação. A grafia aportuguesada facilita a leitura.
- source_word: תְּקִילְתָּה
  choice: você foi pesado
  rationale: Traduz a forma passiva dirigida a Belsazar como uma avaliação já realizada; o pretérito perfeito é natural em português e conserva sua relevância no anúncio do juízo.
- source_word: בְמֹאזַנְיָא
  choice: na balança
  rationale: Designa o instrumento de pesagem. O singular coletivo é idiomático em português e preserva a imagem tradicional de uma balança de pratos.
- source_word: וְהִשְׁתְּכַחַתְּ
  choice: e considerado
  rationale: Expressa o resultado constatado após a pesagem. Em português, 'considerado insuficiente' comunica naturalmente a descoberta avaliativa, embora a nota registre a formulação mais literal.
- source_word: חַסִּיר
  choice: insuficiente
  rationale: Comunica deficiência ou falta segundo o padrão da avaliação, preservando tanto a imagem de peso abaixo do devido quanto a dimensão judicial, sem recorrer ao pouco natural 'achado em falta'.
theological_decisions:
- issue: Natureza da metáfora de julgamento
  choice: Preservar a imagem de uma pessoa pesada e considerada insuficiente como expressão de avaliação divina.
  alternative: 'Explicitar por paráfrase: ''Deus julgou você e o considerou culpado''.'
  rationale: O aramaico apresenta a sentença mediante a metáfora da pesagem e da deficiência. A tradução conserva essa tensão imagética sem reduzi-la a uma pesagem comercial literal nem ampliá-la em uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Você' torna explícito o destinatário singular indicado pela forma verbal aramaica. 'Tequel' segue uma transliteração aportuguesada; 'balança' mantém a metáfora concreta, e 'insuficiente' evita tanto arcaísmo quanto explicação doutrinária excessiva.
