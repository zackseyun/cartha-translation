  text: בֵּלְשַׁאצַּ֞ר אֲמַ֣ר בִּ/טְעֵ֣ם חַמְרָ֗/א לְ/הַיְתָיָה֙ לְ/מָאנֵי֙ דַּהֲבָ֣/א וְ/כַסְפָּ֔/א דִּ֤י הַנְפֵּק֙ נְבוּכַדְנֶצַּ֣ר אֲב֔/וּהִי מִן הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וְ/יִשְׁתּ֣וֹן בְּ/ה֗וֹן מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי שֵׁגְלָתֵ֖/הּ וּ/לְחֵנָתֵֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/002.yaml
  text: Belshazzar gave the order[a], as he tasted the wine, to bring the vessels of gold and silver that Nebuchadnezzar his father had taken out of the temple that was in Jerusalem, so that the king and his nobles, his wives and his concubines[b], might drink from them.
translation:
  language: pt
  text: Belsazar, ao provar o vinho,[a] deu ordem para que trouxessem os utensílios de ouro e de prata que Nabucodonosor, seu pai,[b] havia tirado do templo de Jerusalém, a fim de que o rei, seus nobres, suas esposas e suas concubinas bebessem deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob o efeito do vinho”; a expressão aramaica significa literalmente “no sabor do vinho”.
    reason: lexical_alternative
  - marker: b
    text: Aramaico “seu pai”; no uso régio, a expressão também pode significar “seu antepassado” ou “seu predecessor”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַר
  choice: deu ordem
  rationale: Embora o verbo signifique basicamente “disse”, aqui ele introduz a determinação de trazer os utensílios; “deu ordem” expressa naturalmente essa força no contexto sem exagerá-la.
- source_word: בִּטְעֵם חַמְרָא
  choice: ao provar o vinho
  rationale: A expressão aramaica é literalmente “no sabor do vinho”. A formulação preserva a imagem concreta e a possível ambiguidade entre o ato de beber e a influência do vinho, sem afirmar explicitamente embriaguez.
- source_word: לְהַיְתָיָה
  choice: para que trouxessem
  rationale: A forma causativa indica que Belsazar mandou trazer os objetos; esta construção é natural em português depois de “deu ordem”.
- source_word: מָאנֵי דַּהֲבָא וְכַסְפָּא
  choice: os utensílios de ouro e de prata
  rationale: O termo aramaico é amplo e designa recipientes ou objetos. “Utensílios” mantém o sentido de objetos pertencentes ao templo sem restringi-los indevidamente a taças.
- source_word: הַנְפֵּק
  choice: havia tirado
  rationale: O verbo significa “fazer sair”, “retirar” ou “tirar”. O mais-que-perfeito composto situa naturalmente a retirada antes do banquete.
- source_word: אֲבוּהִי
  choice: seu pai
  rationale: Mantém-se o sentido literal do termo aramaico, enquanto a nota registra que, no uso régio, ele pode ter alcance mais amplo.
- source_word: הֵיכְלָא
  choice: templo
  rationale: No contexto de Jerusalém, “templo” é o sentido claro e corrente.
- source_word: וְיִשְׁתּוֹן בְּהוֹן
  choice: bebessem neles
  rationale: O imperfeito expressa a finalidade da ordem. “Beber neles” é idiomático em português e preserva a referência aos utensílios como recipientes.
- source_word: רַבְרְבָנוֹהִי
  choice: seus nobres
  rationale: O termo designa grandes homens, dignitários ou altos oficiais da corte; “nobres” é claro e adequado ao cenário régio.
- source_word: שֵׁגְלָתֵהּ
  choice: suas mulheres
  rationale: O termo se refere às mulheres ou esposas do rei. “Mulheres” é abrangente e natural, sem pressupor que todas possuíssem formalmente o título de rainha.
- source_word: לְחֵנָתֵהּ
  choice: suas concubinas
  rationale: O termo designa mulheres de posição secundária no grupo doméstico régio; “concubinas” é o equivalente português tradicional e preciso.
theological_decisions:
- issue: Termo de parentesco régio aplicado a Nabucodonosor
  choice: Manter “seu pai” no texto principal
  alternative: “seu antepassado” ou “seu predecessor”
  rationale: O aramaico emprega o termo comum para “pai”. Como no uso régio ele também pode designar um antepassado ou predecessor, a tradução preserva a forma literal e apresenta a amplitude histórica em nota, sem resolver a questão interpretativamente no texto.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi ajustada à posição real dos referentes no versículo: primeiro a expressão sobre o vinho, depois o termo de parentesco.'
