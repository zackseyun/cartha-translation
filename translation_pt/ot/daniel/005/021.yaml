id: DAN.5.21
reference: Daniel 5:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִן בְּנֵי֩ אֲנָשָׁ֨/א טְרִ֜יד וְ/לִבְבֵ֣/הּ עִם חֵיוְתָ֣/א שוי וְ/עִם עֲרָֽדַיָּ/א֙ מְדוֹרֵ֔/הּ עִשְׂבָּ֤/א כְ/תוֹרִין֙ יְטַ֣עֲמוּנֵּ֔/הּ וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּֽי יְדַ֗ע דִּֽי שַׁלִּ֞יט אֱלָהָ֤/א עלי/א בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖ה יְהָקֵ֥ים עלי/ה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/021.yaml
  text: He was driven away from the sons of men[a], and his heart was made like the beasts, and his dwelling was with the wild donkeys. He was fed grass like oxen, and his body was drenched with the dew of heaven[d][c][b], until he knew that the Most High God rules over the kingdom of mankind and sets over it whomever he wills.
translation:
  language: pt
  text: Ele foi expulso do meio dos seres humanos, seu coração tornou-se semelhante ao dos animais, e passou a morar entre os jumentos selvagens.[a] Deram-lhe capim para comer como aos bois, e seu corpo ficou encharcado com o orvalho do céu, até que reconheceu que o Deus Altíssimo governa o reino da humanidade e coloca sobre ele quem quer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, jumentos selvagens conhecidos também como onagros.
    reason: cultural_note
lexical_decisions:
- source_word: טְרִיד
  choice: foi expulso do meio de
  rationale: Expressa de modo natural o estado passivo e a retirada forçada do convívio humano.
- source_word: בְּנֵי אֲנָשָׁא
  choice: seres humanos
  rationale: Transmite o sentido genérico do idioma aramaico sem sugerir que se trate apenas de homens.
- source_word: לִבְבֵהּ ... שוי
  choice: seu coração tornou-se semelhante ao
  rationale: Mantém a imagem literal do coração, que no aramaico bíblico abrange mente, disposição e interioridade, sem restringir o sentido.
- source_word: חֵיוְתָא
  choice: animais
  rationale: Termo moderno, claro e suficientemente amplo para o contraste entre a condição humana e a animal.
- source_word: עֲרָדַיָּא
  choice: jumentos selvagens
  rationale: Identifica de forma compreensível os onagros mencionados pelo termo aramaico.
- source_word: מְדוֹרֵהּ
  choice: sua morada
  rationale: Preserva a referência ao lugar de habitação em registro digno e corrente.
- source_word: עִשְׂבָּא
  choice: capim
  rationale: No contexto de alimento de bois, 'capim' é mais concreto e natural em português do que o mais amplo 'erva'.
- source_word: כְתוֹרִין
  choice: como aos bois
  rationale: Preserva a comparação específica com bois e, junto à construção causativa, produz português idiomático.
- source_word: יְטַעֲמוּנֵּהּ
  choice: Deram-lhe ... para comer
  rationale: 'Representa a forma causativa do verbo: fizeram que ele comesse ou lhe deram alimento, sem introduzir agentes específicos.'
- source_word: גִּשְׁמֵהּ
  choice: seu corpo
  rationale: Equivalente direto, claro e atual.
- source_word: יִצְטַבַּע
  choice: ficou encharcado
  rationale: Comunica a intensidade de ser completamente molhado pelo orvalho.
- source_word: אֱלָהָא עליא
  choice: o Deus Altíssimo
  rationale: Forma consagrada e natural em português para o título divino.
- source_word: שַׁלִּיט
  choice: governa
  rationale: Expressa diretamente o exercício de domínio sem recorrer a terminologia teológica mais técnica do que o original.
- source_word: מַלְכוּת אֲנָשָׁא
  choice: reino da humanidade
  rationale: Mantém 'reino' e entende o substantivo humano em sentido coletivo e genérico.
- source_word: יְהָקֵים עלי/ה
  choice: estabelece sobre ele
  rationale: Conserva a ação divina de colocar alguém em autoridade sobre o reino.
theological_decisions:
- issue: Afirmação da soberania divina sobre o governo humano
  choice: o Deus Altíssimo governa o reino da humanidade e estabelece sobre ele quem ele quer
  alternative: o Deus Altíssimo tem domínio sobre o reino dos homens e nomeia para governá-lo quem deseja
  rationale: Preserva a afirmação direta da ação e autoridade divinas, sem suavizá-la nem convertê-la em formulação teológica técnica.
- issue: Alcance genérico de אֲנָשָׁא
  choice: seres humanos / humanidade
  alternative: filhos dos homens / reino dos homens
  rationale: O termo é masculino na forma, mas coletivo e genérico no contexto; as escolhas comunicam esse alcance em português atual.
- issue: Sentido antropológico de לִבְבֵהּ
  choice: coração
  alternative: mente
  rationale: Mantém a metáfora antropológica do texto e sua amplitude sem decidir que a referência seja apenas intelectual ou psicológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe preserva a sequência narrativa do aramaico, mas evita o hebraísmo pouco natural 'filhos dos homens'. O pronome final 'ele' retoma 'reino', não Deus.
