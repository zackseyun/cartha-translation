    rationale: 'Em אֲב֥וּךְ מַלְכָּֽא, “o rei” identifica Nabucodonosor: “seu pai, o rei”. A leitura vocativa (“ó rei”) altera a função sintática e faz a rainha dirigir-se novamente a Belsazar onde o texto está qualificando Nabucodonosor.'
