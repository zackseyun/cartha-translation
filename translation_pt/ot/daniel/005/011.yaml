source:
  edition: WLC
  text: אִיתַ֨י גְּבַ֜ר בְּ/מַלְכוּתָ֗/ךְ דִּ֠י ר֣וּחַ אֱלָהִ֣ין קַדִּישִׁין֮ בֵּ/הּ֒ וּ/בְ/יוֹמֵ֣י אֲב֗/וּךְ נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה כְּ/חָכְמַת אֱלָהִ֖ין הִשְׁתְּכַ֣חַת בֵּ֑/הּ וּ/מַלְכָּ֤/א נְבֻֽכַדְנֶצַּר֙ אֲב֔/וּךְ רַ֧ב חַרְטֻמִּ֣ין אָֽשְׁפִ֗ין כַּשְׂדָּאִין֙ גָּזְרִ֔ין הֲקִימֵ֖/הּ אֲב֥/וּךְ מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/011.yaml
  text: There is a man in your kingdom in whom is a spirit of the holy gods[a], and in the days of your father light and insight and wisdom like the wisdom of the gods were found in him. And King Nebuchadnezzar, your father, appointed him chief of the magicians, enchanters, Chaldeans, and diviners—your father[b], the king.
translation:
  language: pt
  text: Há no seu reino um homem em quem há um espírito dos deuses santos[a]. Nos dias de seu pai, acharam-se nele luz, discernimento e sabedoria como a sabedoria dos deuses. E o rei Nabucodonosor, seu pai, o constituiu chefe dos magos, encantadores, caldeus e adivinhos — seu pai[b], o rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Espírito do Deus santo” ou “um espírito do Deus santo”. O aramaico traz formas plurais (“deuses santos”), mas alguns entendem as palavras da rainha como referência ao único Deus verdadeiro.'
    reason: alternative_reading
  - marker: b
    text: Neste contexto de corte e dinastia, “seu pai” também pode significar “seu antepassado” ou “seu predecessor”.
    reason: cultural_note
lexical_decisions:
- source_word: אִיתַי גְּבַר
  choice: Há ... um homem
  rationale: Reproduz de modo natural em português a afirmação existencial aramaica, sem acrescentar especificidade.
- source_word: בְּמַלְכוּתָךְ
  choice: no seu reino
  rationale: Equivalente direto e corrente para o domínio do rei.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: um espírito dos deuses santos
  rationale: Mantém o plural morfológico do aramaico e a perspectiva da fala na corte babilônica; a leitura monoteísta fica registrada em nota.
- source_word: נַהִירוּ
  choice: luz
  rationale: Preserva a metáfora de iluminação e clareza intelectual presente no termo aramaico.
- source_word: שָׂכְלְתָנוּ
  choice: discernimento
  rationale: Expressa percepção e capacidade de compreensão com clareza no português atual.
- source_word: חָכְמָה כְּחָכְמַת אֱלָהִין
  choice: sabedoria como a sabedoria dos deuses
  rationale: Conserva tanto a repetição quanto a comparação explícita e o plural do texto-fonte.
- source_word: רַב חַרְטֻמִּין אָשְׁפִין כַּשְׂדָּאִין גָּזְרִין
  choice: chefe dos magos, encantadores, caldeus e adivinhos
  rationale: Distingue as quatro classes da corte com termos portugueses compreensíveis; “caldeus” funciona aqui como designação de uma classe de sábios.
- source_word: אֲבוּךְ
  choice: seu pai
  rationale: Mantém a expressão literal e repetida do aramaico, deixando sua amplitude dinástica para a nota.
theological_decisions:
- issue: Sentido de אֱלָהִין קַדִּישִׁין e אֱלָהִין na fala da rainha
  choice: “deuses santos” e “deuses” no texto principal
  alternative: “Deus santo” e “Deus”, ou uma formulação com “divino”
  rationale: Os substantivos e o adjetivo estão no plural, e a cena apresenta a linguagem de uma corte babilônica. O plural preserva a perspectiva narrativa sem negar que alguns entendam a expressão como referência ao único Deus.
- issue: Relação indicada por “seu pai” entre Nabucodonosor e Belsazar
  choice: Conservar “seu pai”
  alternative: “seu antepassado” ou “seu predecessor”
  rationale: O aramaico repete literalmente “seu pai”, expressão que pode ter sentido biológico, ancestral ou dinástico. A tradução não deve decidir silenciosamente entre essas possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada em períodos distintos, mas a repetição enfática de “seu pai” e as ambiguidades teológicas e dinásticas foram preservadas.
