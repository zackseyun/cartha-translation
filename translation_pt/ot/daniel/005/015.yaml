base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/015.yaml
  text: And now the wise men, the enchanters, have been brought before me to read this writing and make its interpretation known to me, but they were not able to show the interpretation of the message.
translation:
  language: pt
  text: E agora os sábios, os encantadores, foram trazidos à minha presença para lerem esta escrita e me darem a conhecer a sua interpretação, mas não foram capazes de explicar a interpretação da mensagem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכִּימַיָּא
  choice: os sábios
  rationale: Equivalente natural e abrangente para a classe de especialistas da corte babilônica.
- source_word: אָשְׁפַיָּא
  choice: os encantadores
  rationale: Preserva a referência a praticantes de artes mágicas, distinguindo-os do grupo mais amplo dos sábios.
- source_word: כְתָבָה דְנָה
  choice: esta escrita
  rationale: Mantém o sentido concreto da inscrição visível, sem restringi-la a uma carta ou documento.
- source_word: פִשְׁרֵהּ
  choice: a sua interpretação
  rationale: Expressa o sentido ou explicação da escrita, conforme o uso aramaico no contexto.
- source_word: לְהַחֲוָיָה
  choice: explicar
  rationale: O verbo significa mostrar ou declarar; neste contexto, 'explicar' comunica naturalmente a apresentação da interpretação.
- source_word: מִלְּתָא
  choice: mensagem
  rationale: O termo pode significar palavra, assunto ou coisa; 'mensagem' se ajusta à inscrição cujo conteúdo precisava ser interpretado.
theological_decisions: []
