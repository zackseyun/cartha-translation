  text: וַ/אֲנָה֙ שִׁמְעֵ֣ת עלי/ך דִּֽי תוכל פִּשְׁרִ֛ין לְ/מִפְשַׁ֖ר וְ/קִטְרִ֣ין לְ/מִשְׁרֵ֑א כְּעַ֡ן הֵן֩ תוכל כְּתָבָ֜/א לְ/מִקְרֵ֗א וּ/פִשְׁרֵ/הּ֙ לְ/הוֹדָ֣עֻתַ֔/נִי אַרְגְּוָנָ֣/א תִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארָ֔/ךְ וְ/תַלְתָּ֥א בְ/מַלְכוּתָ֖/א תִּשְׁלַֽט־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/016.yaml
  text: But I have heard about you that you are able to give interpretations and to solve difficulties[a]. Now, if you are able to read the writing and make its interpretation known to me, you shall be clothed with purple, and a chain of gold shall be put around your neck[b], and you shall rule as third in the kingdom.
translation:
  language: pt
  text: Mas eu ouvi dizer a seu respeito que você é capaz de dar interpretações e resolver dificuldades[a]. Agora, se você puder ler a escrita e me revelar sua interpretação, será vestido de púrpura, e uma corrente de ouro será posta ao redor do seu pescoço; você ocupará a terceira posição no reino[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em aramaico, literalmente, “desatar nós”, expressão idiomática para solucionar problemas difíceis ou esclarecer questões desconcertantes.
    reason: lexical_alternative
  - marker: b
    text: Ou “será o terceiro governante no reino”. A expressão provavelmente indica o terceiro posto na hierarquia do reino.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנָה
  choice: Mas eu
  rationale: A conjunção com o pronome independente assinala uma transição pessoal e contrastiva no discurso de Belsazar.
- source_word: פִּשְׁרִין לְמִפְשַׁר
  choice: dar interpretações
  rationale: A combinação cognata de substantivo e verbo é idiomática e indica a capacidade de fornecer interpretações.
- source_word: וְקִטְרִין לְמִשְׁרֵא
  choice: resolver dificuldades[a]
  rationale: A expressão significa literalmente 'desatar nós' e funciona como metáfora para solucionar questões difíceis.
- source_word: כְּתָבָא
  choice: a escrita
  rationale: Designa o texto misterioso na parede e mantém o elo lexical com o contexto narrativo.
- source_word: וּפִשְׁרֵהּ לְהוֹדָעוּתַנִי
  choice: me revelar sua interpretação
  rationale: Expressa de modo natural o causativo aramaico 'fazer sua interpretação conhecida por mim'.
- source_word: אַרְגְּוָנָא תִלְבַּשׁ
  choice: será vestido de púrpura
  rationale: Conserva a formulação de investidura honorífica e a associação da púrpura à dignidade régia.
- source_word: וְתַלְתָּא בְמַלְכוּתָא תִּשְׁלַט
  choice: governará como o terceiro no reino[b]
  rationale: Preserva a referência ordinal e a provável ideia de terceiro posto, sem eliminar a alternativa sintática.
theological_decisions:
- issue: Sentido da posição designada por וְתַלְתָּא
  choice: governará como o terceiro no reino
  alternative: será o terceiro governante no reino
  rationale: A formulação principal mantém a ambiguidade entre ocupar o terceiro posto e ser contado como terceiro governante; a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento por “você” comunica naturalmente a segunda pessoa singular no diálogo; a linguagem da recompensa preserva o tom formal da corte.
