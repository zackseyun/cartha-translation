review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite bem a sequência do aramaico: o relato sobre Daniel, sua capacidade de interpretar e resolver dificuldades, a condição de ler a escrita e explicar sua interpretação, e as honras prometidas. Contudo, «receberá uma corrente ... ao redor do pescoço» torna mais genérica a construção em que a corrente de ouro é posta sobre o pescoço; e «governará como o terceiro» é pouco idiomático em português e não expressa com precisão suficiente a noção de terceira posição/rank.'
  naturalness: O registro é moderno e apropriado para a fala régia; «você» é aceitável no português-alvo. A revisão torna a descrição da condecoração mais direta e a última promessa mais natural.
  terminology: «Interpretações», «dificuldades», «a escrita» e «púrpura» são escolhas adequadas. A nota sobre «desatar nós» explica corretamente o idiomatismo aramaico. A nota sobre a posição no reino preserva a alternativa interpretativa relevante.
  issues:
  - severity: low
    issue: Formulação da corrente de ouro
    rationale: O aramaico diz que uma corrente de ouro estará/sobrevirá sobre o pescoço de Daniel. «Receberá ... ao redor do pescoço» é compreensível, mas «será posta ao redor do seu pescoço» preserva melhor a imagem e a construção honorífica.
  - severity: medium
    issue: «Governará como o terceiro no reino»
    rationale: A expressão é algo artificial em português e pode sugerir apenas uma maneira de governar. O texto se refere à terceira posição ou autoridade no reino; «ocupará a terceira posição no reino» comunica isso com clareza, enquanto a nota mantém a leitura alternativa de «terceiro governante».
  revised_text: Mas eu ouvi dizer a seu respeito que você é capaz de dar interpretações e resolver dificuldades[a]. Agora, se você puder ler a escrita e me revelar sua interpretação, será vestido de púrpura, e uma corrente de ouro será posta ao redor do seu pescoço; você ocupará a terceira posição no reino[b].
  revised_footnotes:
