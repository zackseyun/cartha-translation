  to: Mas eu ouvi dizer a seu respeito que você é capaz de dar interpretações e resolver dificuldades[a]. Agora, se você puder ler a escrita e me revelar sua interpretação, será vestido de púrpura, e uma corrente de ouro será posta ao redor do seu pescoço; você ocupará a terceira posição no reino[b].
