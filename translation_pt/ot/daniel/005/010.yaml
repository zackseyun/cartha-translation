base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/010.yaml
  text: Because of the words of the king and his nobles[a], the queen entered the banquet hall. The queen spoke and said, “O king, live forever! Do not let your thoughts terrify you[b], and do not let your face grow pale.”
translation:
  language: pt
  text: 'Por causa das palavras do rei e dos seus nobres, a rainha entrou no salão do banquete. A rainha falou e disse[a]: “Ó rei, viva para sempre! Não deixe que seus pensamentos o aterrorizem, nem que seu rosto fique pálido[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “respondeu e disse”. O idioma aramaico pode introduzir uma fala tanto como resposta quanto simplesmente como o início de uma declaração.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “seus brilhos não mudem”, expressão idiomática referente à aparência do rosto; compare a expressão semelhante neste capítulo para o rosto que muda de cor por causa do medo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָ/קֳבֵל
  choice: Por causa de
  rationale: 'A preposição aramaica indica aqui causa ou ocasião: a rainha entra em razão do que ouviu do rei e dos nobres.'
- source_word: מִלֵּי
  choice: palavras
  rationale: O plural em construção refere-se naturalmente às palavras, à fala ou ao clamor do rei e dos nobres; “palavras” mantém a correspondência mais direta.
- source_word: רַבְרְבָנ֔וֹ/הִי
  choice: seus nobres
  rationale: O termo designa altos dignitários ou grandes do reino; “nobres” comunica o status com clareza e sem arcaísmo excessivo.
- source_word: לְ/בֵית מִשְׁתְּיָא
  choice: no salão do banquete
  rationale: A expressão significa literalmente “casa do banquete/beber”; “salão do banquete” transmite de modo natural o ambiente da corte.
- source_word: עללת
  choice: entrou
  rationale: O verbo significa entrar ou ir para dentro; “entrou” é direto e adequado ao contexto narrativo.
- source_word: עֲנָת ... וַאֲמֶרֶת
  choice: falou e disse
  rationale: Mantém o duplo verbo do idioma sem afirmar de modo inequívoco que a rainha respondia a uma fala dirigida a ela; a alternativa é registrada em nota.
- source_word: לְ/עָלְמִין חֱיִי
  choice: Ó rei, viva para sempre!
  rationale: É uma fórmula convencional da corte. A forma “viva” soa natural em português como saudação respeitosa dirigida ao rei.
- source_word: רַעְיוֹנָךְ
  choice: seus pensamentos
  rationale: O substantivo denota pensamentos ou reflexões; o caráter aterrador é expresso pelo verbo seguinte, preservando-se a distinção lexical.
- source_word: יְבַהֲלוּךְ
  choice: o aterrorizem
  rationale: O verbo pode indicar perturbar, alarmar ou aterrorizar; o contexto de forte abalo e mudança visível de aparência favorece a expressão mais intensa.
- source_word: זִיוָיָךְ
  choice: seu rosto
  rationale: Embora o termo se relacione literalmente a brilho ou aparência, neste idioma aponta para a aparência visível do rosto; “rosto” é claro e natural.
- source_word: יִשְׁתַּנּוֹ
  choice: fique pálido
  rationale: O sentido básico é “mudar”, mas, ligado à aparência do rosto neste contexto de medo, indica mudança de cor; “fique pálido” comunica o valor idiomático, com o literal preservado em nota.
theological_decisions: []
