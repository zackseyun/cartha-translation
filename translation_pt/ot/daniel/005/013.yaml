base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/013.yaml
  text: Then Daniel was brought in before the king. The king answered and said to Daniel[a], “Are you that Daniel, one of the exiles of Judah, whom the king my father brought from Judah?”
translation:
  language: pt
  text: 'Então Daniel foi levado à presença do rei. O rei tomou a palavra e disse a Daniel: “Você é aquele Daniel, um dos exilados de Judá, que o rei, meu pai,[a] trouxe de Judá?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu predecessor”. Na linguagem régia, “pai” pode designar um antepassado ou rei anterior, e não apenas o pai biológico imediato.
    reason: Nota cultural sobre o uso dinástico de 'pai' e preservação da ambiguidade histórica.
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e atual em português.
- source_word: הֻעַל
  choice: foi levado
  rationale: A forma passiva causativa indica que outros conduziram Daniel à presença real.
- source_word: קֳדָם מַלְכָּא
  choice: à presença do rei
  rationale: Expressa de maneira idiomática o comparecimento de Daniel diante do rei.
- source_word: עָנֵה ... וְאָמַר
  choice: tomou a palavra e disse
  rationale: Preserva os dois verbos da fórmula semítica em português natural, evitando a impressão de que o rei respondia a uma fala imediatamente anterior.
- source_word: אַנְתָּה הוּא דָנִיֵּאל
  choice: Você é aquele Daniel
  rationale: Mantém a força identificadora e o tom de reconhecimento ou distanciamento da construção aramaica.
- source_word: דִּי מִן בְּנֵי גָלוּתָא
  choice: um dos exilados
  rationale: Transmite idiomaticamente a pertença ao grupo levado ao exílio, em vez do literal pouco natural 'dos filhos do exílio'.
- source_word: יְהוּד
  choice: Judá
  rationale: Conserva o sentido geográfico e étnico apropriado ao contexto do exílio.
- source_word: דִּי הַיְתִי מַלְכָּא אַבִי מִן יְהוּד
  choice: que o rei, meu pai, trouxe de Judá
  rationale: Segue de perto a ordem e o conteúdo do aramaico, preservando 'meu pai' no texto e deixando sua amplitude no uso régio para a nota.
theological_decisions:
- issue: Sentido de “meu pai” (אַבִי) na linguagem régia
  choice: meu pai
  alternative: meu predecessor
  rationale: O aramaico diz explicitamente 'meu pai'. A tradução conserva essa expressão e não resolve no corpo do texto a tensão histórica; a nota esclarece que o termo pode ter sentido dinástico mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea, sem coloquialismo excessivo. A fórmula aramaica foi vertida como “tomou a palavra e disse”, preservando seus dois componentes de maneira fluente.
