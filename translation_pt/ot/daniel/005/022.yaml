  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ו/אנתה בְּרֵ/הּ֙ בֵּלְשַׁאצַּ֔ר לָ֥א הַשְׁפֵּ֖לְתְּ לִבְבָ֑/ךְ כָּ/ל קֳבֵ֕ל דִּ֥י כָל דְּנָ֖ה יְדַֽעְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/022.yaml
  text: But you[a], his son, Belshazzar, have not humbled your heart, though you knew all this.
translation:
  language: pt
  text: Mas você, Belsazar, filho dele[a], não humilhou o seu coração, embora soubesse de tudo isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em aramaico, “filho dele” também pode significar “descendente dele” ou “sucessor dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַנְתָּה
  choice: Mas você
  rationale: A conjunção com o pronome independente estabelece forte contraste com o relato anterior sobre Nabucodonosor; “Mas você” expressa naturalmente essa força adversativa.
- source_word: בְּרֵהּ
  choice: filho dele
  rationale: Mantém a formulação aramaica direta e deixa em aberto seu alcance literal ou dinástico.
- source_word: בֵּלְשַׁאצַּר
  choice: Belsazar
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַשְׁפֵּלְתְּ
  choice: não humilhou
  rationale: O verbo significa rebaixar ou humilhar; com “coração”, a expressão comunica que Belsazar não abandonou sua postura orgulhosa.
- source_word: לִבְבָךְ
  choice: o seu coração
  rationale: Preserva a imagem bíblica do coração como centro da vontade, do entendimento e das disposições interiores.
- source_word: כָּל־קֳבֵל דִּי
  choice: embora
  rationale: 'No contexto, a expressão tem sentido concessivo: Belsazar não se humilhou apesar de conhecer os acontecimentos anteriores.'
- source_word: כָל־דְּנָה
  choice: tudo isso
  rationale: Retoma de modo conciso e natural os acontecimentos relatados a respeito de Nabucodonosor.
- source_word: יְדַעְתָּ
  choice: soubesse
  rationale: O imperfeito do subjuntivo é exigido naturalmente após “embora” e representa o conhecimento prévio de Belsazar.
theological_decisions:
- issue: Sentido de “filho dele” na relação entre Nabucodonosor e Belsazar
  choice: Conservar “filho dele” no texto principal sem definir que se trata necessariamente de filiação biológica.
  alternative: descendente dele; sucessor dele
  rationale: O termo aramaico pode indicar um filho em sentido literal ou uma relação mais ampla de descendência ou sucessão dinástica. A tradução preserva a ambiguidade do texto em vez de impor uma harmonização histórica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das aposições foi levemente ajustada para fluidez, sem alterar a relação entre Belsazar e o antecedente.
