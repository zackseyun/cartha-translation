id: DAN.9.24
reference: Daniel 9:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שָׁבֻעִ֨ים שִׁבְעִ֜ים נֶחְתַּ֥ךְ עַֽל עַמְּ/ךָ֣ וְ/עַל עִ֣יר קָדְשֶׁ֗/ךָ לְ/כַלֵּ֨א הַ/פֶּ֜שַׁע ו/ל/חתם חטאות וּ/לְ/כַפֵּ֣ר עָוֺ֔ן וּ/לְ/הָבִ֖יא צֶ֣דֶק עֹֽלָמִ֑ים וְ/לַ/חְתֹּם֙ חָז֣וֹן וְ/נָבִ֔יא וְ/לִ/מְשֹׁ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/024.yaml
  text: 'Seventy weeks are decreed concerning your people and your holy city: to finish the transgression[a], to seal up sins, to make atonement for iniquity, to bring in everlasting righteousness, to seal up vision and prophet[d][c][b], and to anoint the most holy place.'
translation:
  language: pt
  text: 'Setenta semanas[a] estão decretadas a respeito do seu povo e da sua cidade santa: para pôr fim à transgressão, selar os pecados[b], fazer expiação pela iniquidade, trazer justiça eterna, selar a visão e o profeta[c] e ungir o lugar santíssimo[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, «setenta setes»; muitos entendem a expressão como setenta semanas de anos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «pôr fim aos pecados».'
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz literalmente «visão e profeta»; alguns intérpretes antigos e modernos entendem «visão e profecia».
    reason: alternative_reading
  - marker: d
    text: 'Ou: «ungir alguém santíssimo». A expressão hebraica pode referir-se ao lugar ou objeto mais santo; alguns a interpretam como referência a uma pessoa.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁבֻעִים שִׁבְעִים
  choice: Setenta semanas
  rationale: שָׁבֻעִים designa literalmente semanas ou unidades de sete. O texto não explicita que sejam anos; por isso, a interpretação «semanas de anos» fica na nota.
- source_word: נֶחְתַּךְ
  choice: estão decretadas
  rationale: O nifal de חתך expressa aqui algo determinado ou estabelecido. «Decretadas» comunica com clareza a determinação fixa sem recorrer ao literalismo obscuro «cortadas».
- source_word: עַל עַמְּךָ וְעַל עִיר קָדְשֶׁךָ
  choice: a respeito do seu povo e da sua cidade santa
  rationale: עַל indica o âmbito ao qual o decreto se refere; «a respeito de» é natural em português e preserva essa relação.
- source_word: לְכַלֵּא הַפֶּשַׁע
  choice: para pôr fim à transgressão
  rationale: A expressão comunica levar a transgressão definida ao seu término. «Pôr fim» é idiomático e conserva a força télica.
- source_word: וְלַחְתֹּם חטאות
  choice: selar os pecados
  rationale: חתם significa literalmente «selar». A tradução mantém a metáfora e deixa em aberto suas nuances de encerramento, conclusão ou confirmação.
- source_word: וּלְכַפֵּר עָוֺן
  choice: fazer expiação pela iniquidade
  rationale: כפר é um verbo teológico central ligado à expiação. A formulação preserva suas ressonâncias cultuais sem especificar indevidamente o mecanismo.
- source_word: וּלְהָבִיא צֶדֶק עֹלָמִים
  choice: trazer justiça eterna
  rationale: צֶדֶק é «justiça», e עֹלָמִים expressa duração permanente. «Justiça eterna» é clara, digna e semanticamente adequada.
- source_word: וְלַחְתֹּם חָזוֹן וְנָבִיא
  choice: selar a visão e o profeta
  rationale: O texto consonantal e a vocalização massorética trazem נָבִיא, «profeta», não o substantivo abstrato «profecia». A tradução direta preserva essa leitura, embora a alternativa mais esperada seja registrada em nota.
- source_word: וְלִמְשֹׁחַ
  choice: ungir
  rationale: משׁח é o verbo comum para «ungir» e não exige ampliação interpretativa.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: o lugar santíssimo
  rationale: A expressão superlativa frequentemente designa o espaço mais santo do santuário ou algo consagrado em grau máximo. «O lugar santíssimo» é uma leitura contextual natural, enquanto a possível referência pessoal fica explícita em nota.
theological_decisions:
- issue: Referente de קֹדֶשׁ קָדָשִׁים
  choice: o lugar santíssimo
  alternative: alguém santíssimo; o Santo dos Santos como espaço ou objeto do santuário
  rationale: A expressão costuma designar um espaço ou objeto de santidade máxima, e a redação não identifica explicitamente uma pessoa. A tradução principal evita impor uma identificação messiânica, enquanto a nota preserva a possibilidade pessoal.
- issue: Natureza das שָׁבֻעִים na profecia
  choice: semanas
  alternative: setes; semanas de anos
  rationale: O termo denota unidades de sete, mas o versículo não acrescenta «anos». A tradução menos interpretativa permanece no texto, e a compreensão comum como períodos de sete anos aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as metáforas «selar» e «ungir» e a formulação incomum «visão e o profeta» para preservar os contornos e as ambiguidades do hebraico. Os marcadores foram posicionados junto às expressões que explicam.
