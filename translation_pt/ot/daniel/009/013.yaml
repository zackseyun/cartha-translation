reference: Daniel 9:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר כָּתוּב֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/זֹּ֖את בָּ֣אָה עָלֵ֑י/נוּ וְ/לֹֽא חִלִּ֜ינוּ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֵ֗י/נוּ לָ/שׁוּב֙ מֵֽ/עֲוֺנֵ֔/נוּ וּ/לְ/הַשְׂכִּ֖יל בַּ/אֲמִתֶּֽ/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/013.yaml
  text: Just as it is written in the Law of Moses[a], all this calamity has come upon us[c][b], yet we have not sought the favor of Yahweh our God by turning from our iniquities and by gaining insight into your truth.
translation:
  language: pt
  text: Assim como está escrito na Lei de Moisés, toda esta calamidade veio sobre nós; contudo, não buscamos o favor de Yahweh, nosso Deus[a], afastando-nos de nossas iniquidades e procurando compreender a tua verdade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não suplicamos diante da face de Yahweh, nosso Deus”. A expressão significa buscar seu favor ou sua misericórdia.
    reason: lexical_alternative
  - marker: b
    text: Ou “procurando agir com sabedoria na tua verdade”. O termo traduzido como “verdade” também pode significar “fidelidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר כָּתוּב
  choice: Assim como está escrito
  rationale: Preserva a força comparativa da expressão hebraica e introduz naturalmente a correspondência entre o que foi escrito e a calamidade ocorrida.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: na Lei de Moisés
  rationale: Neste contexto pactual, תּוֹרָה se refere à instrução legal mosaica; a formulação é clara e consagrada em português.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: toda esta calamidade
  rationale: רָעָה designa aqui a desgraça decorrente do juízo, não o mal moral; “calamidade” preserva a gravidade sem criar uma implicação enganosa.
- source_word: בָּאָה עָלֵינוּ
  choice: veio sobre nós
  rationale: Reproduz de modo natural o idioma hebraico que descreve a chegada do juízo.
- source_word: וְלֹא חִלִּינוּ אֶת פְּנֵי
  choice: contudo, não buscamos o favor de
  rationale: A construção idiomática significa suplicar, aplacar ou buscar o favor de alguém. A tradução explicita esse sentido em português atual.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, nosso Deus
  rationale: Mantém o nome divino presente no hebraico e a designação pactual com o possessivo.
- source_word: לָשׁוּב מֵעֲוֺנֵנוּ
  choice: afastando-nos de nossas iniquidades
  rationale: Expressa a mudança de direção moral indicada por שׁוב e conserva o peso ético de עָוֹן.
- source_word: וּלְהַשְׂכִּיל בַּאֲמִתֶּךָ
  choice: e procurando compreender a tua verdade
  rationale: O hifil de שׂכל pode indicar compreender, adquirir discernimento ou agir sabiamente. “Procurando compreender” se encaixa naturalmente na coordenação e mantém aberta a dimensão moral e cognitiva; “a tua verdade” preserva a ambiguidade de אֱמֶת entre verdade e fidelidade.
theological_decisions:
- issue: Sentido de רָעָה no contexto do juízo pactual
  choice: calamidade
  alternative: mal; desgraça; desastre
  rationale: O contexto trata da adversidade anunciada na Lei e sofrida pelo povo, não de maldade moral atribuída a Deus.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama; a transliteração preserva o nome pactual.
- issue: Relação sintática dos infinitivos לָשׁוּב e וּלְהַשְׂכִּיל
  choice: meios ou manifestações da busca pelo favor de Deus
  alternative: 'propósitos independentes: “para nos afastarmos... e compreendermos...”'
  rationale: A tradução com gerúndios expressa naturalmente que arrependimento e discernimento constituem a resposta que não ocorreu, sem excluir totalmente uma nuance de propósito.
- issue: Sentido de אֱמֶת
  choice: verdade
  alternative: fidelidade
  rationale: “Verdade” é adequada ao verbo de compreensão, mas a nota registra a amplitude semântica do hebraico e evita resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação esclarece a progressão do período sem romper sua unidade. Os gerúndios evitam uma formulação excessivamente literal e tornam explícita a relação provável entre buscar o favor divino, abandonar as iniquidades e adquirir discernimento.
