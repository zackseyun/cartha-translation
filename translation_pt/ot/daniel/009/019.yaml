  source_fidelity: 'A tradução reproduz com precisão a sequência enfática de invocações e imperativos do hebraico: «ouve», «perdoa», «presta atenção e age» e «Não demores». «Por amor de ti mesmo» representa adequadamente לְמַעַנְךָ, e «meu Deus» preserva אֱלֹהַי. «O teu nome é invocado sobre» mantém, de modo compreensível em português, a construção centrada no nome divino e a imagem de identificação expressa por שִׁמְךָ נִקְרָא עַל, sem impor uma paráfrase interpretativa.'
  naturalness: O português é moderno, solene e claro, com boa legibilidade brasileira e aceitável em âmbito internacional. A repetição de «Senhor» e as formas de «tu» são coerentes com o registro oracional. «Por amor de ti mesmo» tem tom elevado, mas é natural e apropriado ao gênero de súplica bíblica.
  terminology: «Senhor», «meu Deus», «perdoa» e «o teu nome» são terminologicamente consistentes e adequados. A nota apresenta de forma útil a alternativa idiomática «são chamados pelo teu nome», sem substituir indevidamente a imagem do texto principal.
