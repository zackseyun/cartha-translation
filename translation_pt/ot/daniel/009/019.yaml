  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲדֹנָ֤/י שְׁמָ֨עָ/ה֙ אֲדֹנָ֣/י סְלָ֔חָ/ה אֲדֹנָ֛/י הַֽקֲשִׁ֥יבָ/ה וַ/עֲשֵׂ֖ה אַל תְּאַחַ֑ר לְמַֽעֲנְ/ךָ֣ אֱלֹהַ֔/י כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל עִירְ/ךָ֖ וְ/עַל עַמֶּֽ/ךָ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/019.yaml
  text: Lord[a], hear! Lord, forgive! Lord, pay attention and act! Do not delay, for your own sake, my God, because your name is called over your city and your people.
translation:
  language: pt
  text: Senhor, ouve! Senhor, perdoa! Senhor, presta atenção e age! Não demores, por amor de ti mesmo, meu Deus, pois o teu nome é invocado sobre a tua cidade e sobre o teu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: «a tua cidade e o teu povo são chamados pelo teu nome».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Vocativo dirigido a Deus. «Senhor» é a forma natural e consagrada em português; o possessivo implícito na forma hebraica não precisa ser explicitado no vocativo.
- source_word: שְׁמָעָה
  choice: ouve
  rationale: Imperativo que preserva tanto o sentido de escutar quanto a força própria da linguagem de oração.
- source_word: סְלָחָה
  choice: perdoa
  rationale: Imperativo claro e corrente no contexto de uma oração penitencial.
- source_word: הַקֲשִׁיבָה
  choice: presta atenção
  rationale: O imperativo hifil expressa atenção deliberada e intensifica o apelo depois de «ouve».
- source_word: וַעֲשֵׂה
  choice: e age
  rationale: Embora o verbo seja amplo, aqui pede uma intervenção efetiva; «age» comunica isso sem acrescentar um objeto ausente no hebraico.
- source_word: אַל תְּאַחַר
  choice: Não demores
  rationale: Expressa de modo natural e vigoroso o pedido para que a ação não seja adiada.
- source_word: לְמַעַנְךָ
  choice: por amor de ti mesmo
  rationale: Preserva a ideia de que o apelo se fundamenta no próprio nome, honra e interesse de Deus.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Mantém o possessivo e o caráter pessoal do apelo direto.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a razão apresentada para o pedido.
- source_word: שִׁמְךָ נִקְרָא עַל
  choice: o teu nome é invocado sobre
  rationale: Conserva a construção passiva e a imagem hebraica de o nome divino ser proclamado ou invocado sobre a cidade e o povo, indicando identificação e pertença.
- source_word: עִירְךָ
  choice: a tua cidade
  rationale: Tradução direta do substantivo com sufixo possessivo; no contexto, refere-se a Jerusalém.
- source_word: עַמֶּךָ
  choice: o teu povo
  rationale: Tradução direta do substantivo com sufixo possessivo; no contexto, refere-se ao povo de Deus.
theological_decisions:
- issue: A expressão de identificação e pertença שִׁמְךָ נִקְרָא עַל
  choice: o teu nome é invocado sobre a tua cidade e sobre o teu povo
  alternative: a tua cidade e o teu povo são chamados pelo teu nome
  rationale: A tradução principal preserva a forma passiva centrada no nome de Deus e a preposição «sobre», sem reduzir a expressão a uma paráfrase. A alternativa idiomática esclarece a noção de identificação e pertença e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática de «Senhor» e a sequência de imperativos foram mantidas. Empregou-se «tu» em coerência com o singular íntimo da oração e para evitar ambiguidades possessivas.
