  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בִּ/תְחִלַּ֨ת תַּחֲנוּנֶ֜י/ךָ יָצָ֣א דָבָ֗ר וַ/אֲנִי֙ בָּ֣אתִי לְ/הַגִּ֔יד כִּ֥י חֲמוּד֖וֹת אָ֑תָּה וּ/בִין֙ בַּ/דָּבָ֔ר וְ/הָבֵ֖ן בַּ/מַּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/023.yaml
  text: At the beginning of your pleas[a], a word went out, and I have come to tell it, because you are greatly beloved[b]. So consider the word and understand the vision.
translation:
  language: pt
  text: No início das suas súplicas, saiu uma palavra[a], e eu vim para anunciá-la, porque você é muito amado[b]. Portanto, considere a palavra e compreenda a visão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saiu uma mensagem”. A expressão hebraica, literalmente “saiu uma palavra”, pode se referir a uma mensagem pronunciada ou a uma ordem emitida.
    reason: lexical_alternative
  - marker: b
    text: Ou “você é muito estimado”. A expressão hebraica indica que Daniel é especialmente precioso ou amado.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת תַּחֲנוּנֶיךָ
  choice: No início das suas súplicas
  rationale: Expressa o momento em que a ação começou. “Súplicas” comunica pedidos fervorosos dirigidos a Deus em linguagem bíblica ainda compreensível.
- source_word: יָצָא דָבָר
  choice: saiu uma palavra
  rationale: Preserva a formulação e a amplitude semântica do hebraico; דָבָר pode ser palavra, mensagem ou ordem, sem que o contexto exija restringi-lo a decreto.
- source_word: וַאֲנִי בָּאתִי לְהַגִּיד
  choice: e eu vim para anunciá-la
  rationale: Mantém a finalidade da vinda do mensageiro. O pronome retoma naturalmente “palavra”, embora o objeto não esteja expresso no hebraico.
- source_word: חֲמוּדוֹת אָתָּה
  choice: você é muito amado
  rationale: Transmite de modo natural a ideia intensiva de alguém especialmente precioso e favorecido, sem recorrer ao literalismo inadequado de “desejável”.
- source_word: וּבִין בַּדָּבָר
  choice: Portanto, considere a palavra
  rationale: בין aqui é um imperativo que pede discernimento atento. “Considere” é idiomático e mantém a distinção em relação ao imperativo seguinte.
- source_word: וְהָבֵן בַּמַּרְאֶה
  choice: e compreenda a visão
  rationale: O segundo imperativo enfatiza a compreensão; מַרְאֶה, no contexto de Daniel, designa adequadamente uma visão reveladora.
theological_decisions:
- issue: Sentido de חֲמוּדוֹת אָתָּה quanto à posição de Daniel diante de Deus
  choice: você é muito amado
  alternative: você é muito estimado; você é precioso
  rationale: A escolha preserva o caráter relacional do favor dirigido a Daniel sem acrescentar uma categoria doutrinária não expressa no texto. A nota registra a possível nuance de estima e preciosidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “palavra” preserva a continuidade lexical de דָבָר. “Você” oferece clareza internacional com naturalidade no Brasil; as notas conservam as principais alternativas sem resolver indevidamente a ambiguidade.
