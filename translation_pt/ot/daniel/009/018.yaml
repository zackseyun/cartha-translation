  text: הַטֵּ֨ה אֱלֹהַ֥/י אָזְנְ/ךָ֮ וּֽ/שֲׁמָע֒ פקח/ה עֵינֶ֗י/ךָ וּ/רְאֵה֙ שֹֽׁמְמֹתֵ֔י/נוּ וְ/הָ/עִ֕יר אֲשֶׁר נִקְרָ֥א שִׁמְ/ךָ֖ עָלֶ֑י/הָ כִּ֣י לֹ֣א עַל צִדְקֹתֵ֗י/נוּ אֲנַ֨חְנוּ מַפִּילִ֤ים תַּחֲנוּנֵ֨י/נוּ֙ לְ/פָנֶ֔י/ךָ כִּ֖י עַל רַחֲמֶ֥י/ךָ הָ/רַבִּֽים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/018.yaml
  text: Incline your ear[a], my God, and hear; open your eyes and see our desolations and the city that is called by your name. For we are not presenting our pleas before you because of our righteousnesses[b], but because of your abundant mercies.
translation:
  language: pt
  text: Inclina o teu ouvido, meu Deus, e ouve; abre os teus olhos e vê as nossas desolações e a cidade sobre a qual o teu nome é invocado[a]. Pois não apresentamos as nossas súplicas diante de ti com base em nossos atos de justiça[b], mas com base em tuas muitas misericórdias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a cidade sobre a qual o teu nome é chamado”. A expressão indica que a cidade pertence a Deus e está associada ao seu nome.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nossas justiças”; o plural pode se referir a atos de justiça ou a alegações de retidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה אֱלֹהַי אָזְנְךָ
  choice: Inclina o teu ouvido, meu Deus
  rationale: Mantém o imperativo e a imagem antropomórfica singular do hebraico, em linguagem elevada, porém compreensível.
- source_word: וּשֲׁמָע ... פְּקַחָה עֵינֶיךָ וּרְאֵה
  choice: e ouve; abre os teus olhos e vê
  rationale: Preserva a sequência enfática de imperativos e o paralelismo entre ouvir e ver.
- source_word: שֹׁמְמֹתֵינוּ
  choice: as nossas desolações
  rationale: Conserva o plural e permite que a expressão abranja tanto a condição devastada do povo quanto suas ruínas, sem restringir o referente.
- source_word: אֲשֶׁר נִקְרָא שִׁמְךָ עָלֶיהָ
  choice: sobre a qual o teu nome é invocado
  rationale: Reproduz de modo inteligível o idioma hebraico e conserva suas ideias de pertencimento e associação com Deus.
- source_word: מַפִּילִים תַּחֲנוּנֵינוּ לְפָנֶיךָ
  choice: apresentamos as nossas súplicas diante de ti
  rationale: Traduz naturalmente o idioma formado por 'fazer cair', 'súplicas' e 'diante de', cujo sentido é colocar ou apresentar uma petição perante alguém.
- source_word: לֹא עַל צִדְקֹתֵינוּ ... כִּי עַל רַחֲמֶיךָ הָרַבִּים
  choice: não ... com base em nossos atos de justiça, mas com base em tuas muitas misericórdias
  rationale: Explicita a relação de fundamento expressa por עַל, preserva o plural de ambos os substantivos e mantém o contraste entre a justiça humana e as misericórdias divinas.
theological_decisions:
- issue: Linguagem antropomórfica aplicada a Deus
  choice: Manter 'ouvido' e 'olhos' como imagens diretas da oração
  alternative: Parafrasear como 'presta atenção' e 'repara'
  rationale: As imagens corporais fazem parte da retórica hebraica e exprimem o pedido urgente de atenção divina sem exigir uma interpretação sobre a natureza de Deus.
- issue: Fundamento da súplica de Daniel
  choice: Negar que os atos de justiça do povo fundamentem o pedido e apontar as muitas misericórdias de Deus como seu fundamento
  alternative: Generalizar a expressão como mera falta de mérito ou transformar 'misericórdias' em singular abstrato
  rationale: O texto estabelece explicitamente esse contraste e emprega formas plurais, que devem permanecer perceptíveis sem acrescentar uma formulação doutrinária externa.
- issue: O nome de Deus invocado sobre a cidade
  choice: Conservar o idioma em forma próxima ao hebraico
  alternative: Traduzir interpretativamente como 'a cidade que leva o teu nome'
  rationale: A formulação escolhida preserva a possível amplitude de pertencimento, autoridade e associação pactual sem reduzir a expressão a uma simples denominação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa singular coerentes na oração. A redação mantém o ritmo solene dos imperativos hebraicos e preserva plurais semanticamente relevantes, recorrendo a notas apenas onde o idioma original poderia ficar obscuro.
