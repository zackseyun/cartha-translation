id: DAN.9.14
reference: Daniel 9:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁקֹ֤ד יְהוָה֙ עַל הָ֣/רָעָ֔ה וַ/יְבִיאֶ֖/הָ עָלֵ֑י/נוּ כִּֽי צַדִּ֞יק יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַל כָּל מַֽעֲשָׂי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/לֹ֥א שָׁמַ֖עְנוּ בְּ/קֹלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/014.yaml
  text: So Yahweh kept watch over the disaster and brought it upon us[a], for Yahweh our God is righteous in all the works that he has done[c][b], and we have not listened to his voice.
translation:
  language: pt
  text: Assim, Yahweh manteve-se atento[b] à calamidade[a] e a trouxe sobre nós, pois Yahweh, nosso Deus, é justo em tudo o que fez; e nós não demos ouvidos à sua voz.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «desgraça». A palavra hebraica também pode significar «mal», mas aqui se refere à calamidade do juízo que sobreveio ao povo.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por «manteve-se atento» também pode ser entendido como «esteve vigilante a respeito de» ou, de modo mais interpretativo, «apressou-se».
    reason: lexical_alternative
  - marker: c
    text: «Dar ouvidos à sua voz» inclui a ideia de obedecer ao que ele disse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁקֹד
  choice: manteve-se atento
  rationale: Preserva a ideia de vigilância e atenção contínua expressa por שׁקד sem recorrer à interpretação mais específica «apressou-se». Em português, evita também que «velou por» sugira proteção da calamidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָרָעָה
  choice: a calamidade
  rationale: Neste contexto de juízo, רָעָה designa a desgraça ou calamidade que sobreveio ao povo, não o mal moral.
- source_word: וַיְבִיאֶהָ עָלֵינוּ
  choice: e a trouxe sobre nós
  rationale: O pronome feminino retoma «a calamidade», e «trouxe sobre nós» reproduz naturalmente a linguagem hebraica de juízo.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a afirmação anterior.
- source_word: צַדִּיק
  choice: justo
  rationale: Expressa adequadamente a retidão de Deus no contexto de suas ações judiciais e pactuais.
- source_word: עַל כָּל מַעֲשָׂיו אֲשֶׁר עָשָׂה
  choice: em tudo o que fez
  rationale: Formulação portuguesa natural que preserva a abrangência de todas as ações realizadas por Deus.
- source_word: וְלֹא שָׁמַעְנוּ בְּקֹלוֹ
  choice: e nós não demos ouvidos à sua voz
  rationale: «Dar ouvidos à voz» conserva a imagem hebraica e comunica também a implicação de obedecer.
theological_decisions:
- issue: Sentido de רָעָה quando a ação é atribuída a Deus
  choice: a calamidade
  alternative: o mal
  rationale: Em contexto de juízo, o substantivo pode indicar desgraça ou calamidade. Essa opção preserva a afirmação de que Deus trouxe o juízo sem sugerir que ele praticou mal moral.
- issue: Relação entre a justiça de Deus e suas obras
  choice: é justo em tudo o que fez
  alternative: é justo quanto a todas as suas obras que realizou
  rationale: A tradução afirma, sem explicação doutrinária adicional, que a justiça de Deus se manifesta em todas as ações mencionadas, inclusive no juízo em questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o nome Yahweh, a metáfora de atenção vigilante e a expressão semítica «dar ouvidos à sua voz», esclarecendo em nota sua força obediencial.
