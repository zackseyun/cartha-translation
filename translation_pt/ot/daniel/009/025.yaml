id: DAN.9.25
reference: Daniel 9:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/תֵדַ֨ע וְ/תַשְׂכֵּ֜ל מִן מֹצָ֣א דָבָ֗ר לְ/הָשִׁיב֙ וְ/לִ/בְנ֤וֹת יְרֽוּשָׁלִַ֨ם֙ עַד מָשִׁ֣יחַ נָגִ֔יד שָׁבֻעִ֖ים שִׁבְעָ֑ה וְ/שָׁבֻעִ֞ים שִׁשִּׁ֣ים וּ/שְׁנַ֗יִם תָּשׁוּב֙ וְ/נִבְנְתָה֙ רְח֣וֹב וְ/חָר֔וּץ וּ/בְ/צ֖וֹק הָ/עִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/025.yaml
  text: 'So know and understand: from the issuing of the word to restore and rebuild Jerusalem until an anointed one[a], a prince, there will be seven weeks, and for sixty-two weeks it will be restored and rebuilt, with plaza and moat[c][b], but in troubled times.'
translation:
  language: pt
  text: 'Portanto, saiba e compreenda: desde a emissão da palavra para restaurar e reconstruir Jerusalém até um ungido[a], um príncipe, haverá sete semanas[b]; e durante sessenta e duas semanas ela será restaurada e reconstruída, com praça e fosso[c], mas em tempos de aflição.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o Messias, um príncipe” ou “até o Messias, o Príncipe”. O hebraico diz literalmente “ungido, príncipe/dirigente”.'
    reason: alternative_reading
  - marker: b
    text: O hebraico “sete semanas” também pode ser traduzido por “sete unidades de sete”; do mesmo modo, “sessenta e duas semanas” pode ser traduzido por “sessenta e duas unidades de sete”. A pontuação hebraica tradicional separa os dois períodos, mas também é possível entendê-los como uma sequência combinada de sete e sessenta e duas semanas.
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: 'Ou: “praça e trincheira”. O termo hebraico traduzido por “fosso” é incerto e pode indicar uma vala, trincheira ou obra defensiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתֵדַע וְתַשְׂכֵּל
  choice: saiba e compreenda
  rationale: Os verbos dirigem-se a Daniel no singular e têm força exortativa. A formulação é natural em português e mantém o par cognitivo do hebraico.
- source_word: מִן מֹצָא דָבָר
  choice: desde a emissão da palavra
  rationale: מֹצָא expressa a saída ou emissão, e דָבָר pode significar palavra, assunto ou decreto. “Emissão da palavra” conserva a imagem hebraica sem especificar em excesso que se trata de um decreto imperial.
- source_word: לְהָשִׁיב וְלִבְנוֹת
  choice: para restaurar e reconstruir
  rationale: No contexto de Jerusalém, הָשִׁיב indica restauração, enquanto לִבְנוֹת se refere à reconstrução da cidade.
- source_word: עַד מָשִׁיחַ נָגִיד
  choice: até um ungido, um príncipe
  rationale: מָשִׁיחַ significa literalmente alguém ungido, sem determinar por si só sua identidade; נָגִיד designa príncipe, dirigente ou líder. A tradução mantém aberta a questão interpretativa.
- source_word: שָׁבֻעִים שִׁבְעָה
  choice: sete semanas
  rationale: שָׁבֻעִים pode designar semanas ou unidades de sete. “Semanas” é uma tradução tradicional e legível, com a alternativa literal registrada em nota.
- source_word: וְשָׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: e durante sessenta e duas semanas
  rationale: “Durante” torna explícito em português o valor temporal da expressão, sem definir se essas semanas devem ser entendidas literalmente ou como períodos de sete anos.
- source_word: תָּשׁוּב וְנִבְנְתָה
  choice: ela será restaurada e reconstruída
  rationale: As formas femininas singulares retomam Jerusalém. O pronome “ela” deixa essa referência clara em português.
- source_word: רְחוֹב
  choice: praça
  rationale: O termo denota um espaço urbano amplo e aberto, como uma praça pública, mais do que uma rua estreita.
- source_word: וְחָרוּץ
  choice: fosso
  rationale: O sentido do substantivo é incerto; no contexto urbano, provavelmente indica uma vala, trincheira ou obra defensiva semelhante a um fosso.
- source_word: וּבְצוֹק הָעִתִּים
  choice: mas em tempos de aflição
  rationale: A expressão descreve tempos de aperto e adversidade. “Tempos de aflição” preserva esse sentido com linguagem digna e corrente.
theological_decisions:
- issue: Se מָשִׁיחַ deve ser traduzido no texto principal como o título “Messias”
  choice: Traduzir como “um ungido” no texto principal.
  alternative: “Messias, um príncipe” ou “Messias, o Príncipe”.
  rationale: O substantivo hebraico significa “ungido” e não identifica por si só uma figura escatológica específica. A opção lexical evita decidir na tradução uma questão teológica disputada, preservando a leitura tradicional em nota.
- issue: Como representar שָׁבֻעִים na profecia
  choice: Usar “semanas” no texto principal.
  alternative: “Unidades de sete” ou “setes”; também se interpreta como semanas de anos.
  rationale: O termo normalmente significa “semanas”, mas sua estrutura remete a grupos de sete. A nota preserva essa amplitude sem impor ao texto principal um esquema cronológico específico.
- issue: Como pontuar os períodos de sete e sessenta e duas semanas
  choice: Separar as duas etapas com ponto e vírgula, associando a reconstrução às sessenta e duas semanas.
  alternative: Ler “sete semanas e sessenta e duas semanas” como um período combinado antes da oração sobre a reconstrução.
  rationale: A acentuação massorética favorece uma divisão após “sete semanas”, embora a sintaxe permita debate. A pontuação adotada segue o WLC, e a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Emprega “saiba” como tratamento respeitoso no singular e evita terminologia denominacional. A pontuação segue a divisão sugerida pelos acentos massoréticos, enquanto a nota reconhece a ambiguidade sintática.
