  text: וְ/ע֨וֹד אֲנִ֤י מְדַבֵּר֙ וּ/מִתְפַּלֵּ֔ל וּ/מִתְוַדֶּה֙ חַטָּאתִ֔/י וְ/חַטַּ֖את עַמִּ֣/י יִשְׂרָאֵ֑ל וּ/מַפִּ֣יל תְּחִנָּתִ֗/י לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהַ֔/י עַ֖ל הַר קֹ֥דֶשׁ אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/020.yaml
  text: While I was still speaking and praying[a], confessing my sin and the sin of my people Israel, and presenting my plea before Yahweh my God concerning the holy mountain of my God[b],
translation:
  language: pt
  text: Enquanto eu ainda falava, orava, confessava o meu pecado e o pecado do meu povo Israel e apresentava a minha súplica diante de Yahweh, meu Deus, a respeito do santo monte do meu Deus[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “santo monte do meu Deus” refere-se a Sião/Jerusalém, onde ficava o santuário de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: וְעוֹד אֲנִי
  choice: Enquanto eu ainda
  rationale: Expressa naturalmente em português a ação que continuava em andamento, em ligação com os particípios seguintes.
- source_word: מְדַבֵּר וּמִתְפַּלֵּל
  choice: falava e orava
  rationale: Mantém o paralelismo das ações simultâneas em registro corrente e digno.
- source_word: וּמִתְוַדֶּה חַטָּאתִי
  choice: confessando o meu pecado
  rationale: Com pecado como objeto, o hitpael de ידה tem aqui o sentido de confessar, não de agradecer ou louvar.
- source_word: וְחַטַּאת עַמִּי יִשְׂרָאֵל
  choice: e o pecado do meu povo Israel
  rationale: Preserva a relação de construção e a aposição do hebraico de modo claro em português.
- source_word: וּמַפִּיל תְּחִנָּתִי
  choice: e apresentava a minha súplica
  rationale: O hebraico diz literalmente 'fazia cair minha súplica', expressão idiomática para colocá-la ou apresentá-la diante de Deus; 'súplica' conserva o apelo por misericórdia.
- source_word: לִפְנֵי יְהוָה אֱלֹהַי
  choice: diante de Yahweh, meu Deus
  rationale: Traduz diretamente a preposição de presença e preserva o nome divino e a forma possessiva.
- source_word: עַל הַר קֹדֶשׁ אֱלֹהָי
  choice: a respeito do santo monte do meu Deus
  rationale: עַל indica aqui o assunto da súplica; a formulação mantém a repetição de 'meu Deus' presente no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome próprio sem substituí-lo por um título.
- issue: Identificação do 'santo monte'
  choice: Manter 'o santo monte do meu Deus' no texto e explicar a referência em nota
  alternative: Traduzir interpretativamente como 'Sião' ou 'Jerusalém'
  rationale: O original não nomeia explicitamente Sião ou Jerusalém neste versículo; a tradução preserva sua formulação e a nota oferece o contexto referencial sem inseri-lo no texto.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. A frase permanece aberta ao versículo seguinte, como no hebraico. O idiomatismo de וּמַפִּיל תְּחִנָּתִי foi traduzido por uma expressão natural, sem perder o caráter fervoroso da petição.
