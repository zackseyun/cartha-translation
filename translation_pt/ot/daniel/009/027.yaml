  text: וְ/הִגְבִּ֥יר בְּרִ֛ית לָ/רַבִּ֖ים שָׁב֣וּעַ אֶחָ֑ד וַ/חֲצִ֨י הַ/שָּׁב֜וּעַ יַשְׁבִּ֣ית זֶ֣בַח וּ/מִנְחָ֗ה וְ/עַ֨ל כְּנַ֤ף שִׁקּוּצִים֙ מְשֹׁמֵ֔ם וְ/עַד כָּלָה֙ וְ/נֶ֣חֱרָצָ֔ה תִּתַּ֖ךְ עַל שֹׁמֵֽם׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/027.yaml
  text: And he will make a firm covenant with the many for one week[a], and for half of the week he will put a stop to sacrifice and offering. And on the wing of abominations will come one who makes desolate[e][d][c][b], until the decreed end is poured out on the desolator.
translation:
  language: pt
  text: Ele tornará firme uma aliança com muitos por uma semana[a]; e, durante metade da semana, fará cessar o sacrifício e a oferta[b]. E sobre a asa de abominações[c] virá aquele que causa desolação[d], até que o fim decretado seja derramado sobre o desolador[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confirmará uma aliança” ou “fortalecerá uma aliança”. O verbo hebraico significa tornar forte ou fazer prevalecer.
    reason: lexical_alternative
  - marker: b
    text: Ou “sacrifício e oferta de cereal”. O segundo termo pode referir-se mais especificamente a uma oferta de cereal.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “sobre a asa de abominações”. A expressão é difícil; entre as alternativas estão “sobre o pináculo de abominações” e “sobre uma asa de abominações”.'
    reason: alternative_reading
  - marker: d
    text: Ou “um desolador” ou “alguém que provoca desolação”.
    reason: lexical_alternative
  - marker: e
    text: Ou “sobre aquele que foi desolado” ou “sobre o lugar desolado”. A cláusula final é textualmente estável, mas sintaticamente difícil.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגְבִּיר
  choice: tornará firme
  rationale: O hifil de גבר comunica tornar forte ou fazer prevalecer. “Tornará firme” preserva essa força causativa sem pressupor que se trate necessariamente da confirmação de uma aliança anterior.
- source_word: בְּרִית
  choice: aliança
  rationale: “Aliança” conserva o peso do termo bíblico, sem reduzi-lo a mero acordo ou tratado.
- source_word: לָרַבִּים
  choice: com muitos
  rationale: A preposição ל admite mais de uma relação neste contexto. “Com muitos” é natural com “aliança” e não força a leitura menos idiomática “com os muitos” em português.
- source_word: שָׁבוּעַ אֶחָד
  choice: por uma semana
  rationale: No contexto das setenta semanas, שָׁבוּעַ designa convencionalmente uma unidade de sete. “Uma semana” é legível e deixa seu valor cronológico ou simbólico à interpretação.
- source_word: וַחֲצִי הַשָּׁבוּעַ
  choice: durante metade da semana
  rationale: A formulação conserva a referência à metade da semana sem transformá-la, de modo interpretativo, em um ponto exato no meio dela.
- source_word: יַשְׁבִּית
  choice: fará cessar
  rationale: A expressão reproduz de maneira natural e digna a força causativa do hifil de שבת.
- source_word: זֶבַח וּמִנְחָה
  choice: o sacrifício e a oferta
  rationale: זֶבַח indica sacrifício, enquanto מִנְחָה pode designar uma oferta em geral ou, no uso ritual, uma oferta de cereal. A opção mais ampla fica no texto e a mais específica, na nota.
- source_word: וְעַל כְּנַף שִׁקּוּצִים
  choice: E sobre a asa de abominações
  rationale: “Asa” conserva o sentido lexical de כָּנָף e a dificuldade da metáfora, sem impor uma interpretação arquitetônica como “pináculo”.
- source_word: מְשֹׁמֵם
  choice: virá aquele que causa desolação
  rationale: O particípio denota quem desola ou causa desolação. O verbo “virá” é suprido para formar uma oração inteligível em português, sem identificar a personagem.
- source_word: וְעַד כָּלָה וְנֶחֱרָצָה
  choice: até que o fim decretado
  rationale: A expressão reúne a ideia de consumação ou fim e a de algo determinado; “fim decretado” transmite ambas com concisão.
- source_word: תִּתַּךְ
  choice: seja derramado
  rationale: נתך comunica derramar. O subjuntivo depois de “até que” é a construção temporal natural em português.
- source_word: עַל שֹׁמֵם
  choice: sobre o desolador
  rationale: A forma participial masculina singular é lida mais naturalmente como agente, embora outras análises sintáticas permaneçam possíveis e sejam registradas em nota.
theological_decisions:
- issue: Identidade do sujeito masculino singular ao longo do versículo
  choice: Mantido como “ele”, sem identificação explícita.
  alternative: O Messias; o governante que virá mencionado no versículo anterior; Antíoco IV; Tito; ou uma figura escatológica.
  rationale: O hebraico não nomeia o antecedente neste versículo, e as principais tradições interpretativas divergem. A tradução não resolve a disputa.
- issue: Sentido de כְּנַף שִׁקּוּצִים
  choice: “a asa de abominações”
  alternative: “o pináculo de abominações”, “a extremidade de abominações” ou uma construção relacionada a coisas abomináveis.
  rationale: A expressão é lexical e sintaticamente difícil. A tradução mais literal preserva sua ambiguidade em vez de impor uma leitura arquitetônica ou histórica.
- issue: Referente de שֹׁמֵם na cláusula final
  choice: “o desolador”
  alternative: “aquele que foi desolado” ou “o lugar desolado”.
  rationale: A morfologia favorece a leitura de um agente masculino singular, mas a sintaxe da cláusula é difícil; por isso, as alternativas são mantidas em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conservam-se termos bíblicos centrais como “aliança”, “sacrifício” e “abominações”. A ordem das notas segue sua ocorrência no texto; todos os marcadores [a]–[e] aparecem no corpo principal.
