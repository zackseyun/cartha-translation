id: DAN.9.17
reference: Daniel 9:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֣ה שְׁמַ֣ע אֱלֹהֵ֗י/נוּ אֶל תְּפִלַּ֤ת עַבְדְּ/ךָ֙ וְ/אֶל תַּ֣חֲנוּנָ֔י/ו וְ/הָאֵ֣ר פָּנֶ֔י/ךָ עַל מִקְדָּשְׁ/ךָ֖ הַ/שָּׁמֵ֑ם לְמַ֖עַן אֲדֹנָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/017.yaml
  text: And now[a], our God, hear the prayer of your servant and his pleas for mercy, and let your face shine upon your sanctuary, which lies desolate, for the Lord’s sake.
translation:
  language: pt
  text: E agora, nosso Deus, ouve a oração do teu servo e as suas súplicas por misericórdia. Faze o teu rosto brilhar sobre o teu santuário, que está desolado, por amor do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por amor de ti mesmo, ó Senhor”. O hebraico diz literalmente “por amor do Senhor”, empregando um título divino na terceira pessoa em meio a uma fala dirigida diretamente a Deus.'
    reason: Leitura alternativa que esclarece a mudança incomum para a terceira pessoa sem eliminá-la do texto principal.
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto o conectivo וְ como o advérbio temporal, introduzindo a nova etapa da súplica de Daniel.
- source_word: שְׁמַע
  choice: ouve
  rationale: Mantém a linguagem tradicional e natural da oração dirigida a Deus, sem acrescentar a ideia explícita de obediência.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente o substantivo com o sufixo de primeira pessoa do plural e conserva o caráter comunitário da invocação.
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: a oração do teu servo
  rationale: Mantém a cadeia construta e o tom humilde da oração; “servo” é claro, digno e adequado ao contexto.
- source_word: תַּחֲנוּנָיו
  choice: as suas súplicas por misericórdia
  rationale: Expressa pedidos insistentes de favor ou compaixão com clareza em português atual, sem reduzir o termo a pedidos genéricos.
- source_word: וְהָאֵר פָּנֶיךָ
  choice: Faze o teu rosto brilhar
  rationale: Preserva a forma causativa e a metáfora bíblica do rosto divino que brilha como sinal de favor.
- source_word: עַל מִקְדָּשְׁךָ
  choice: sobre o teu santuário
  rationale: “Santuário” conserva o sentido de lugar santo pertencente a Deus e é mais abrangente que “templo”.
- source_word: הַשָּׁמֵם
  choice: que está desolado
  rationale: A oração relativa comunica com naturalidade o estado devastado do santuário e preserva a força descritiva do hebraico.
- source_word: לְמַעַן אֲדֹנָי
  choice: por amor do Senhor
  rationale: “Por amor de” expressa finalidade ou motivo em registro digno, enquanto “o Senhor” preserva o título divino na terceira pessoa presente no hebraico.
theological_decisions:
- issue: Referência divina na terceira pessoa em לְמַעַן אֲדֹנָי dentro de uma oração dirigida diretamente a Deus
  choice: por amor do Senhor
  alternative: por amor de ti mesmo, ó Senhor
  rationale: O texto hebraico emprega אֲדֹנָי, “Senhor”, e não um pronome de segunda pessoa. A tradução principal conserva essa forma incomum e sua tensão retórica; a nota oferece a leitura contextualmente natural sem substituir silenciosamente a formulação do texto.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa do singular coerentes com a oração direta (“teu”). A divisão em duas frases evita uma coordenação excessivamente longa e dá destaque ao pedido central. A metáfora do rosto divino foi mantida, assim como a referência incomum ao Senhor na terceira pessoa.
