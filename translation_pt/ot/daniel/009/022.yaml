  text: וַ/יָּ֖בֶן וַ/יְדַבֵּ֣ר עִמִּ֑/י וַ/יֹּאמַ֕ר דָּנִיֵּ֕אל עַתָּ֥ה יָצָ֖אתִי לְ/הַשְׂכִּילְ/ךָ֥ בִינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/022.yaml
  text: He made me understand[a], and spoke with me, and said, “Daniel[b], I have now come out to give you insight and understanding.”
translation:
  language: pt
  text: 'Ele me fez entender[a] e falou comigo. Então disse: “Daniel, agora saí[b] para lhe dar discernimento e compreensão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele me instruiu”. O verbo hebraico é entendido aqui em sentido causativo.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “parti” ou “vim”. O hebraico diz literalmente “saí”; neste contexto, refere-se ao mensageiro que foi enviado até Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: Ele me fez entender
  rationale: 'O verbo de בין é entendido aqui em sentido causativo: o mensageiro levou Daniel a entender. A formulação preserva esse valor de modo claro e próximo do hebraico.'
- source_word: וַיְדַבֵּר עִמִּי
  choice: e falou comigo
  rationale: Mantém a preposição עִם (“com”) e é idiomático em português.
- source_word: וַיֹּאמַר
  choice: Então disse
  rationale: Introduz naturalmente o discurso direto na sequência narrativa; “então” expressa a progressão do hebraico sem tornar a frase pesada.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Forma tradicional e corrente do nome em português.
- source_word: עַתָּה
  choice: agora
  rationale: Equivalente direto e natural do advérbio temporal.
- source_word: יָצָאתִי
  choice: saí
  rationale: Preserva o sentido básico de יצא, “sair”, sem decidir explicitamente se o movimento deve ser expresso em português como “vim” ou “parti”; o contexto indica que o mensageiro foi enviado até Daniel.
- source_word: לְהַשְׂכִּילְךָ
  choice: para lhe dar discernimento
  rationale: O Hifil de שכל comunica a concessão de percepção ou discernimento; “dar discernimento” mantém o sentido causativo e forma um par natural com בִינָה.
- source_word: בִינָה
  choice: compreensão
  rationale: Expressa a capacidade de entender. A escolha evita repetir “entendimento” logo depois de “entender”, sem apagar a distinção entre o verbo anterior e o substantivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. Conserva o paralelismo semântico entre “discernimento” e “compreensão” e mantém a ambiguidade de direção em יָצָאתִי por meio de nota.
