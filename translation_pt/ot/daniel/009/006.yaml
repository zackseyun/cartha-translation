id: DAN.9.6
reference: Daniel 9:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֤א שָׁמַ֨עְנוּ֙ אֶל עֲבָדֶ֣י/ךָ הַ/נְּבִיאִ֔ים אֲשֶׁ֤ר דִּבְּרוּ֙ בְּ/שִׁמְ/ךָ֔ אֶל מְלָכֵ֥י/נוּ שָׂרֵ֖י/נוּ וַ/אֲבֹתֵ֑י/נוּ וְ/אֶ֖ל כָּל עַ֥ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/006.yaml
  text: We have not listened to your servants the prophets[a], who spoke in your name to our kings, our officials, our fathers[b], and to all the people of the land.
translation:
  language: pt
  text: Não demos ouvidos aos teus servos, os profetas[a], que falaram em teu nome aos nossos reis, aos nossos governantes, aos nossos pais[b] e a todo o povo da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Não obedecemos». O verbo hebraico pode significar escutar de modo responsivo, e não apenas ouvir.
    reason: lexical_alternative
  - marker: b
    text: Ou «nossos antepassados». Literalmente, «nossos pais».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: demos ouvidos
  rationale: Com אֶל, o verbo שׁמע expressa escutar alguém com atenção e resposta implícita. «Dar ouvidos» é natural em português, conserva a imagem auditiva e deixa a desobediência subentendida sem explicitá-la em excesso.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: Neste contexto, עבד é uma designação honrosa dos profetas a serviço de Deus; «servos» é claro e adequado, sem destacar indevidamente a possível acepção de escravidão.
- source_word: הַנְּבִיאִים
  choice: os profetas
  rationale: Tradução direta do aposto que identifica os servos de Deus.
- source_word: דִּבְּרוּ בְּשִׁמְךָ
  choice: falaram em teu nome
  rationale: A expressão indica representação e autoridade divina. «Em teu nome» preserva a forma do idioma hebraico e sua força profética.
- source_word: מְלָכֵינוּ
  choice: nossos reis
  rationale: Correspondência direta e natural para a primeira categoria de destinatários.
- source_word: שָׂרֵינוּ
  choice: nossos governantes
  rationale: שׂרים designa autoridades dirigentes. «Governantes» comunica essa função em português atual sem limitar o termo à nobreza hereditária sugerida por «príncipes».
- source_word: אֲבֹתֵינוּ
  choice: nossos pais
  rationale: Mantém o sentido literal e a forma masculina do hebraico. No contexto, pode designar os antepassados ou as gerações anteriores.
- source_word: כָּל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Preserva o substantivo coletivo singular e a expressão hebraica, que aqui abrange a população da terra ou do país.
theological_decisions:
- issue: Se שָׁמַעְנוּ deve explicitar obediência ou apenas audição
  choice: Não demos ouvidos
  alternative: Não obedecemos
  rationale: A oração confessa infidelidade, de modo que a falta de obediência está implicada; contudo, a expressão escolhida mantém a amplitude do hebraico entre escutar, atender e obedecer.
- issue: Se אֲבֹתֵינוּ deve ser modernizado como termo neutro
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O texto hebraico usa o masculino plural e, literalmente, diz «nossos pais». A alternativa esclarece que a referência pode abranger gerações anteriores, sem neutralizar silenciosamente o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação «aos nossos» explicita com naturalidade a regência de «falar a». «Dar ouvidos» preserva a tensão entre escuta e obediência; «governantes» evita o possível arcaísmo ou estreitamento social de «príncipes».
