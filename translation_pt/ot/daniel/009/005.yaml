  text: חָטָ֥אנוּ וְ/עָוִ֖ינוּ ו/הרשענו וּ/מָרָ֑דְנוּ וְ/ס֥וֹר מִ/מִּצְוֺתֶ֖/ךָ וּ/מִ/מִּשְׁפָּטֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/005.yaml
  text: We have sinned and done wrong and acted wickedly and rebelled[b][a], turning aside from your commandments and your judgments.
translation:
  language: pt
  text: Pecamos, agimos perversamente, praticamos o mal e nos rebelamos, desviando-nos dos teus mandamentos e das tuas ordenanças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos teus mandamentos e dos teus juízos”. O termo hebraico pode designar decisões judiciais, juízos ou ordenanças prescritas.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: Pecamos
  rationale: O qal perfeito na primeira pessoa do plural de חטא expressa diretamente a confissão de haver pecado; o pretérito perfeito é natural em português no contexto retrospectivo da oração.
- source_word: וְעָוִינוּ
  choice: cometemos injustiça
  rationale: O verbo עוה sugere ação tortuosa, perversa ou culpável. A expressão preserva uma nuance distinta de 'pecamos' e mantém linguagem atual e digna.
- source_word: וְהִרְשַׁעְנוּ
  choice: agimos perversamente
  rationale: O hifil de רשע indica agir de modo perverso ou ímpio. A formulação conserva a força verbal e distingue este termo do anterior.
- source_word: וּמָרָדְנוּ
  choice: e nos rebelamos
  rationale: מרד significa rebelar-se; a forma pronominal é idiomática em português e comunica a afronta deliberada no contexto da aliança.
- source_word: וְסוֹר
  choice: desviando-nos
  rationale: A forma de סור continua a série confessional com a ideia de afastamento ou desvio. O gerúndio reproduz naturalmente essa continuação sintática em português.
- source_word: מִמִּצְוֺתֶיךָ
  choice: dos teus mandamentos
  rationale: מצוה designa mandamento ou ordem. 'Mandamentos' mantém o registro bíblico e a dimensão da aliança sem arcaísmo desnecessário.
- source_word: וּמִמִּשְׁפָּטֶיךָ
  choice: e das tuas ordenanças
  rationale: משפט pode indicar decisões judiciais, juízos ou normas prescritas. 'Ordenanças' é clara neste paralelismo legal com 'mandamentos', enquanto a nota conserva a alternativa 'juízos'.
theological_decisions:
- issue: Preservação da sequência cumulativa de verbos confessionais
  choice: 'Manter expressões separadas: pecamos, cometemos injustiça, agimos perversamente, nos rebelamos, desviando-nos'
  alternative: Condensar a sequência como 'pecamos, fizemos o mal e nos rebelamos'
  rationale: O hebraico acumula termos próximos, mas não idênticos, intensificando a confissão. Preservar a sequência evita apagar suas diferentes nuances morais e relacionais.
- issue: Tradução de מִשְׁפָּטֶיךָ
  choice: tuas ordenanças
  alternative: teus juízos
  rationale: No contexto, o termo pode designar normas prescritas e decisões de caráter jurídico. 'Ordenanças' comunica melhor a ideia de preceitos que foram transgredidos, sem excluir a nuance judicial, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação repetida preserva o caráter solene e cumulativo da confissão hebraica. O pronome 'teus' mantém proximidade oracional sem soar excessivamente formal.
