id: DAN.9.7
reference: Daniel 9:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/ךָ֤ אֲדֹנָ/י֙ הַ/צְּדָקָ֔ה וְ/לָ֛/נוּ בֹּ֥שֶׁת הַ/פָּנִ֖ים כַּ/יּ֣וֹם הַ/זֶּ֑ה לְ/אִ֤ישׁ יְהוּדָה֙ וּ/לְ/יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם וּֽ/לְ/כָל יִשְׂרָאֵ֞ל הַ/קְּרֹבִ֣ים וְ/הָ/רְחֹקִ֗ים בְּ/כָל הָֽ/אֲרָצוֹת֙ אֲשֶׁ֣ר הִדַּחְתָּ֣/ם שָׁ֔ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֥ר מָֽעֲלוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/007.yaml
  text: To you[a], O Lord, belongs righteousness, but to us belongs shame of face, as it is this day—to the men of Judah, to the inhabitants of Jerusalem, and to all Israel, those who are near and those who are far away[b], in all the lands where you have driven them[c], because of their unfaithfulness that they committed against you.
translation:
  language: pt
  text: A ti, Senhor, pertence a justiça, mas a nós, a vergonha estampada no rosto[a], como se vê hoje — aos homens de Judá[b], aos habitantes de Jerusalém e a todo o Israel, tanto aos que estão perto como aos que estão longe, em todas as terras para onde os expulsaste, por causa da infidelidade[c] que cometeram contra ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «vergonha do rosto»; isto é, vergonha pública ou desonra visível no semblante.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «a cada homem de Judá». O hebraico usa uma forma masculina singular com sentido distributivo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «deslealdade», «traição» ou «quebra de confiança».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É um vocativo dirigido a Deus. O termo é אֲדֹנָי, não o nome divino YHWH; por isso, emprega-se «Senhor» sem convenção tipográfica especial.
- source_word: הַצְּדָקָה
  choice: a justiça
  rationale: Neste contexto confessional, designa a retidão de Deus e o fato de ele estar com a razão. «Justiça» é natural em português e mantém a dimensão moral e judicial do termo.
- source_word: בֹּשֶׁת הַפָּנִים
  choice: a vergonha estampada no rosto
  rationale: A expressão hebraica significa literalmente «vergonha do rosto» e descreve desonra pública, visível no semblante. A formulação portuguesa preserva a imagem sem soar obscura.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê hoje
  rationale: A expressão aponta para a condição presente e observável do povo. Esta tradução comunica de modo natural o valor demonstrativo e temporal.
- source_word: לְאִישׁ יְהוּדָה
  choice: aos homens de Judá
  rationale: O singular אִישׁ tem aqui valor distributivo ou coletivo. «Homens de Judá» conserva a forma masculina representativa do hebraico.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: aos habitantes de Jerusalém
  rationale: Tradução direta e corrente da construção participial que designa os que moram na cidade.
- source_word: כָּל יִשְׂרָאֵל
  choice: a todo o Israel
  rationale: Mantém a referência convencional ao conjunto do povo da aliança.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: tanto aos que estão perto como aos que estão longe
  rationale: Preserva o contraste geográfico entre os israelitas próximos e os dispersos em terras distantes.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: em todas as terras
  rationale: «Terras» evita impor a noção política moderna de países e corresponde bem aos diversos territórios da dispersão.
- source_word: הִדַּחְתָּם
  choice: os expulsaste
  rationale: 'O hifil de נדח expressa ação causativa: Deus fez com que fossem afastados ou dispersos. «Expulsaste» preserva a força da ação e a agência divina no exílio.'
- source_word: בְּמַעֲלָם
  choice: por causa da infidelidade
  rationale: מעל denota quebra de confiança, deslealdade ou traição, especialmente em relação à aliança. «Infidelidade» comunica claramente essa violação.
- source_word: אֲשֶׁר מָעֲלוּ בָךְ
  choice: que cometeram contra ti
  rationale: A oração relativa retoma a raiz מעל e salienta que a ofensa foi dirigida pessoalmente contra Deus. Em português, «infidelidade que cometeram contra ti» conserva o sentido sem repetição artificial.
theological_decisions:
- issue: A justiça de Deus em contraste com a vergonha de Israel
  choice: O texto declara que Deus está com a razão e que ao povo cabe a vergonha pública decorrente de sua infidelidade.
  alternative: Entender הַצְּדָקָה de modo mais restrito como «retidão judicial» ou «justo juízo».
  rationale: 'A oração é confessional: contrapõe a retidão de Deus à desonra merecida pelo povo, sem negar a misericórdia divina nem introduzir a ideia de autojustificação humana.'
- issue: Linguagem coletiva masculina em לְאִישׁ יְהוּדָה
  choice: Manter «aos homens de Judá».
  alternative: Traduzir «ao povo de Judá» ou «a todos em Judá».
  rationale: O hebraico emprega אִישׁ, masculino singular, com valor distributivo. A tradução mantém essa forma representativa sem ampliar ou neutralizar silenciosamente a expressão.
- issue: Agência divina no exílio
  choice: Traduzir הִדַּחְתָּם como «os expulsaste», mantendo Deus como agente do afastamento.
  alternative: Usar «foram dispersos», deixando a agência implícita.
  rationale: A forma verbal hebraica atribui diretamente a Deus a ação de afastá-los. A tradução conserva essa tensão teológica sem a suavizar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva o contraste solene da oração, mas evita construções excessivamente literais. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
