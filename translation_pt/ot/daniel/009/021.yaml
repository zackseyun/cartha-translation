base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/021.yaml
  text: while I was still speaking in prayer[a], the man Gabriel, whom I had seen in the vision at the beginning, came to me in swift flight at the time of the evening offering.
translation:
  language: pt
  text: Enquanto eu ainda falava em oração, o homem Gabriel, que eu tinha visto na visão no princípio, tocou-me em voo veloz[a], por volta da hora da oferta da tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, menos provavelmente, “chegou cansado” ou “em exaustão”. A expressão hebraica é difícil.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר בַּתְּפִלָּה
  choice: Enquanto eu ainda falava em oração
  rationale: A construção indica uma ação em andamento, simultânea à chegada de Gabriel. A tradução preserva tanto o ato de falar quanto o contexto de oração.
- source_word: הָאִישׁ גַּבְרִיאֵל
  choice: Gabriel, o homem
  rationale: אִישׁ significa normalmente “homem”. A formulação mantém a descrição de Gabriel segundo sua aparência humana na visão, sem negar sua identidade como mensageiro celestial.
- source_word: אֲשֶׁר רָאִיתִי בֶחָזוֹן בַּתְּחִלָּה
  choice: que eu tinha visto na visão no princípio
  rationale: O mais-que-perfeito composto marca naturalmente em português a visão anterior, e “no princípio” reproduz de perto בַּתְּחִלָּה sem definir além do texto a qual início se refere.
- source_word: מֻעָף בִּיעָף
  choice: em voo veloz
  rationale: A leitura tradicional e contextualmente plausível entende a expressão difícil como movimento rápido em voo. A alternativa relacionada a cansaço é preservada em nota.
- source_word: נֹגֵעַ אֵלַי
  choice: aproximou-se de mim
  rationale: נגע pode significar “tocar” ou “alcançar”. Aqui, a forma participial descreve a chegada ou aproximação de Gabriel; “aproximou-se de mim” preserva esse sentido sem afirmar com certeza um contato físico.
- source_word: כְּעֵת מִנְחַת עָרֶב
  choice: por volta da hora da oferta da tarde
  rationale: כְּעֵת expressa correspondência temporal aproximada. “Oferta da tarde” mantém a amplitude de מִנְחָה e reconhece seu uso como designação do horário da oferta regular.
theological_decisions:
- issue: Natureza do movimento de Gabriel em מֻעָף בִּיעָף
  choice: Gabriel se aproxima em voo veloz.
  alternative: Gabriel se aproxima cansado ou em estado de exaustão.
  rationale: A expressão hebraica é difícil. O contexto de uma chegada rápida e a interpretação tradicional favorecem o sentido de voo veloz, mas a possível associação lexical com cansaço não deve ser ocultada e aparece em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem “Gabriel, o homem” é mais natural em português do que “o homem Gabriel”, mantendo ainda a descrição explícita do hebraico. A nota está marcada no texto principal.
