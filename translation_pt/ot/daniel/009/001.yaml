id: DAN.9.1
reference: Daniel 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת אַחַ֗ת לְ/דָרְיָ֛וֶשׁ בֶּן אֲחַשְׁוֵר֖וֹשׁ מִ/זֶּ֣רַע מָדָ֑י אֲשֶׁ֣ר הָמְלַ֔ךְ עַ֖ל מַלְכ֥וּת כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/001.yaml
  text: In the first year of Darius son of Ahasuerus[a], of the offspring of the Medes, who was made king over the kingdom of the Chaldeans—
translation:
  language: pt
  text: No primeiro ano de Dario, filho de Assuero, descendente dos medos, o qual foi constituído rei sobre o reino dos caldeus[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos babilônios”. “Caldeus” é o termo hebraico, mas, neste contexto, pode designar o reino babilônico.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת
  choice: No primeiro ano
  rationale: A expressão construta com o cardinal é uma fórmula idiomática de datação régia; em português natural, corresponde a “no primeiro ano”.
- source_word: לְדָרְיָוֶשׁ
  choice: de Dario
  rationale: O prefixo לְ indica relação na fórmula de datação; “de Dario” é a expressão portuguesa convencional.
- source_word: בֶּן אֲחַשְׁוֵרוֹשׁ
  choice: filho de Assuero
  rationale: בֶּן indica filiação direta, e os nomes próprios são apresentados em suas formas portuguesas tradicionais.
- source_word: מִזֶּרַע מָדָי
  choice: descendente dos medos
  rationale: זֶרַע refere-se aqui à linhagem ou ascendência, não a semente literal. “Descendente dos medos” comunica o sentido com naturalidade e preserva a referência ao povo medo.
- source_word: אֲשֶׁר
  choice: o qual
  rationale: O pronome relativo introduz uma oração referente a Dario. “O qual” evita que a oração seja ligada por engano ao substantivo plural “medos”.
- source_word: הָמְלַךְ
  choice: foi constituído rei
  rationale: A forma Hofal é passiva/causativa e indica que Dario recebeu a realeza. “Foi constituído rei” preserva essa nuance melhor que “tornou-se rei”.
- source_word: עַל מַלְכוּת
  choice: sobre o reino
  rationale: מַלְכוּת designa aqui o reino ou domínio, e עַל assinala governo sobre ele.
- source_word: כַּשְׂדִּים
  choice: os caldeus
  rationale: O hebraico emprega o etnônimo “caldeus”. A tradução principal o conserva, enquanto a nota registra o valor contextual possível de “babilônios”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o travessão final porque o versículo introduz a oração e a narrativa que continuam no versículo seguinte.
