  terminology: “Dario”, “Assuero”, “medos” e “caldeus” são formas portuguesas estabelecidas. “Descendente dos medos” comunica de modo natural o sentido de linhagem em מִזֶּרַע מָדָי. A nota registra adequadamente a possibilidade contextual de “babilônios” sem substituir o termo hebraico no texto principal.
