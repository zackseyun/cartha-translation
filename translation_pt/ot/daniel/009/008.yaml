  text: יְהוָ֗ה לָ֚/נוּ בֹּ֣שֶׁת הַ/פָּנִ֔ים לִ/מְלָכֵ֥י/נוּ לְ/שָׂרֵ֖י/נוּ וְ/לַ/אֲבֹתֵ֑י/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/008.yaml
  text: O Lord[a], to us belongs shame of face—to our kings, to our princes[b], and to our fathers—because we have sinned against you.
translation:
  language: pt
  text: Ó SENHOR, a nós cabe a vergonha do rosto[a] — a nossos reis, a nossos príncipes e a nossos pais[b] —, porque pecamos contra ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “vergonha do rosto”, expressão que indica desonra pública ou humilhação.
    reason: lexical_alternative
  - marker: b
    text: Ou “antepassados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Emprega a forma portuguesa tradicional para o nome divino YHWH, em maiúsculas para distingui-lo do título comum “Senhor”.
- source_word: לָנוּ בֹּשֶׁת הַפָּנִים
  choice: a nós cabe a vergonha no rosto
  rationale: O לְ pronominal exprime aquilo que pertence ao povo; “cabe” comunica essa relação com naturalidade. A expressão concreta “vergonha no rosto” preserva o idioma hebraico e sua ideia de desonra manifesta.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ
  choice: a nossos reis, a nossos príncipes
  rationale: Mantém o paralelismo introduzido pela repetição de לְ. “Príncipes” conserva o sentido elevado e político de שָׂרִים no contexto da monarquia.
- source_word: וְלַאֲבֹתֵינוּ
  choice: e a nossos pais
  rationale: Traduz literalmente אָבוֹת, que aqui pode abranger os antepassados; a nota registra essa extensão de sentido.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: porque pecamos contra ti
  rationale: אֲשֶׁר tem força causal no contexto, e לָךְ com חטא indica a pessoa ofendida. O pretérito perfeito é natural em português para esta confissão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma em versaletes segue a convenção bíblica portuguesa amplamente reconhecida, sem transformar o nome em mero título; “Yahweh” é uma transliteração possível.
- issue: Dimensão coletiva da culpa
  choice: Mantida a enumeração “nós... nossos reis... nossos príncipes... nossos pais”
  alternative: Resumir como culpa de todo o povo
  rationale: A enumeração hebraica distribui explicitamente a vergonha entre o povo, seus governantes e seus antepassados; preservá-la mantém a amplitude e a tensão da confissão.
translation_notes:
  register: Português moderno, solene e acessível. O paralelismo e a expressão concreta do hebraico foram preservados, com travessões para tornar clara a enumeração parentética.
