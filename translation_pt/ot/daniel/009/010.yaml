id: DAN.9.10
reference: Daniel 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֤כֶת בְּ/תֽוֹרֹתָי/ו֙ אֲשֶׁ֣ר נָתַ֣ן לְ/פָנֵ֔י/נוּ בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/010.yaml
  text: and we have not obeyed the voice of Yahweh our God[a], to walk in his laws, which he set before us through his servants the prophets.
translation:
  language: pt
  text: e não obedecemos à voz de Yahweh, nosso Deus, para andarmos nas suas leis, que ele colocou diante de nós por meio dos seus servos, os profetas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão dos seus servos, os profetas”, expressão que significa “por meio dos seus servos, os profetas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ בְּקוֹל
  choice: obedecemos à voz
  rationale: A construção שמע בקול indica ouvir com resposta obediente. A tradução conserva tanto a força de obediência quanto a imagem hebraica da voz.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Representa diretamente o substantivo com o sufixo de primeira pessoa do plural.
- source_word: לָלֶכֶת
  choice: para andarmos
  rationale: Conserva o infinitivo de finalidade ou consequência ligado à obediência e mantém a metáfora bíblica de andar como modo de viver.
- source_word: בְּתוֹרֹתָיו
  choice: nas suas leis
  rationale: O plural designa as diretrizes divinas apresentadas por intermédio dos profetas; 'leis' se ajusta ao contexto de desobediência da aliança, sem negar o sentido mais amplo de instruções.
- source_word: אֲשֶׁר נָתַן לְפָנֵינוּ
  choice: que ele colocou diante de nós
  rationale: Expressa naturalmente o idioma hebraico de dar ou pôr algo diante de alguém para sua consideração e cumprimento.
- source_word: בְּיַד
  choice: por meio de
  rationale: Comunica em português atual o valor instrumental ou mediador do idioma literal 'pela mão de'.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: seus servos, os profetas
  rationale: No contexto de comissão divina, 'servos' é a designação adequada; a aposição identifica esses servos como os profetas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. 'Yahweh' o preserva por transliteração sem substituí-lo por um título.
- issue: Sentido do plural תּוֹרֹתָיו
  choice: suas leis
  alternative: suas instruções; seus ensinamentos
  rationale: O contexto de obediência e conduta favorece 'leis', embora o campo semântico de torah também inclua instrução e ensino.
- issue: Relação do infinitivo לָלֶכֶת com a obediência
  choice: para andarmos
  alternative: andando; vivendo de acordo com
  rationale: A formulação mantém a ligação aberta entre finalidade e resultado, sem reduzir a expressão a um valor exclusivamente instrumental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os biblicismos transparentes 'obedecer à voz' e 'andar nas leis', pois preservam imagens relevantes do hebraico sem comprometer a clareza.
