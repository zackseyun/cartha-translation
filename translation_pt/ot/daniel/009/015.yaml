revisions:
- from: E agora, Senhor, nosso Deus, tu que tiraste o teu povo da terra do Egito com mão forte[a] e fizeste para ti um nome[b], como se vê até hoje[c] — nós pecamos e agimos perversamente.
  to: E agora, Ó Senhor, nosso Deus, tu que tiraste o teu povo da terra do Egito com mão forte[a] e fizeste para ti um nome[b], como ainda é hoje[c] — nós pecamos e agimos perversamente.
  rationale: A revisão limita-se a substituir a expansão interpretativa «como se vê até hoje» por «como ainda é hoje», que mantém a afirmação temporal do hebraico sem acrescentar um verbo de percepção. Também foi empregado «Ó» para assinalar de modo inequívoco a invocação vocativa. O restante do texto e as âncoras das notas foram preservados.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:42:22Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a estrutura da oração, a alusão ao êxodo, a expressão «mão forte», a aquisição de renome e a dupla confissão. Contudo, «como se vê até hoje» introduz explicitamente a ideia de observação, que não está expressa em כַּיּוֹם הַזֶּה. Uma formulação que preserve a continuidade temporal sem essa explicitação é mais próxima do hebraico.
  naturalness: O registro é claro, solene e natural em português contemporâneo. «Ó Senhor, nosso Deus» torna a invocação vocativa mais nítida. «Como ainda é hoje» é compreensível e evita a expansão interpretativa de «como se vê».
  terminology: «Senhor», «nosso Deus», «teu povo», «mão forte», «fizeste para ti um nome», «pecamos» e «agimos perversamente» são escolhas apropriadas e coerentes com o texto hebraico. As notas preservam alternativas legítimas e explicam o idiomatismo sem impor leitura doutrinária.
