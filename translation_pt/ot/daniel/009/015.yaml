source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י אֱלֹהֵ֗י/נוּ אֲשֶׁר֩ הוֹצֵ֨אתָ אֶֽת עַמְּ/ךָ֜ מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ בְּ/יָ֣ד חֲזָקָ֔ה וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כַּ/יּ֣וֹם הַ/זֶּ֑ה חָטָ֖אנוּ רָשָֽׁעְנוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/015.yaml
  text: And now[a], O Lord our God, who brought your people out of the land of Egypt with a strong hand and made for yourself a name, as it is this day—we have sinned[c][b]; we have acted wickedly.
translation:
  language: pt
  text: E agora, Ó Senhor, nosso Deus, tu que tiraste o teu povo da terra do Egito com mão forte[a] e fizeste para ti um nome[b], como ainda é hoje[c] — nós pecamos e agimos perversamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com mão poderosa”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, adquiriste renome para ti.
    reason: idiom_explanation
  - marker: c
    text: 'Mais literalmente: “como neste dia”; também pode ser entendido como “até o dia de hoje”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: Senhor, nosso Deus
  rationale: Forma vocativa natural em uma oração, preservando אֲדֹנָי como título divino e אֱלֹהֵינוּ como expressão comunitária.
- source_word: הוֹצֵאתָ אֶת עַמְּךָ מֵאֶרֶץ מִצְרַיִם
  choice: tu que tiraste o teu povo da terra do Egito
  rationale: O hifil de יצא expressa fazer sair ou tirar; esta formulação é clara em português e conserva a referência ao êxodo e a expressão geográfica completa.
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: Mantém de perto a imagem hebraica e a fórmula tradicional do êxodo; “com mão poderosa” é uma alternativa idiomática.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: e fizeste para ti um nome
  rationale: Preserva a imagem hebraica de adquirir nome ou renome, sem substituir o idioma por sua explicação.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê até hoje
  rationale: Expressa de modo natural a realidade pública e continuada do renome de Deus no presente do orador, preservando o valor temporal da locução.
- source_word: חָטָאנוּ
  choice: nós pecamos
  rationale: Confissão direta e solene, com aspecto passado cuja relevância permanece no contexto da oração.
- source_word: רָשָׁעְנוּ
  choice: agimos perversamente
  rationale: Distingue este verbo do anterior e mantém sua força moral e ativa.
theological_decisions:
- issue: Alusão ao êxodo e o renome de Deus
  choice: Conservar a fórmula do êxodo e a imagem de Deus fazer para si um nome.
  alternative: Traduzir dinamicamente como “libertaste o teu povo do Egito pelo teu poder e adquiriste renome”.
  rationale: A linguagem remete deliberadamente à história fundadora de Israel. A forma escolhida preserva esse vínculo intertextual e o caráter teológico da confissão sem impor uma interpretação denominacional.
- issue: Relação entre pecado e perversidade
  choice: 'Manter duas declarações coordenadas: “pecamos e agimos perversamente”.'
  alternative: Fundir as duas ideias em “pecamos perversamente”.
  rationale: Os dois verbos hebraicos são distintos e cumulativos; mantê-los evita apagar a intensidade da confissão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “tu” mantém a referência pessoal já indicada pelas formas verbais e possessivas do hebraico. A construção “fizeste para ti um nome” é intencionalmente mais formal para conservar a imagem do texto-fonte, esclarecida em nota.
