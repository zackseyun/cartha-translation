  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַחֲרֵ֤י הַ/שָּׁבֻעִים֙ שִׁשִּׁ֣ים וּ/שְׁנַ֔יִם יִכָּרֵ֥ת מָשִׁ֖יחַ וְ/אֵ֣ין ל֑/וֹ וְ/הָ/עִ֨יר וְ/הַ/קֹּ֜דֶשׁ יַ֠שְׁחִית עַ֣ם נָגִ֤יד הַ/בָּא֙ וְ/קִצּ֣/וֹ בַ/שֶּׁ֔טֶף וְ/עַד֙ קֵ֣ץ מִלְחָמָ֔ה נֶחֱרֶ֖צֶת שֹׁמֵמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/026.yaml
  text: And after the sixty-two weeks[a], an anointed one will be cut off and will have nothing. And the city and the sanctuary the people of the coming ruler will destroy. Its end will come with a flood, and until the end there will be war[d][c][b]; desolations are decreed.
translation:
  language: pt
  text: E, depois das sessenta e duas semanas, um ungido será eliminado e ficará sem nada.[a] O povo de um governante que virá destruirá a cidade e o santuário.[b] Seu fim virá com uma inundação.[c] Até o fim haverá guerra. Desolações estão decretadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Messias será eliminado”. A expressão hebraica também pode ser traduzida por “será cortado”; a frase seguinte pode significar “e não haverá nada para ele” ou “e ele não terá ninguém”.'
    reason: Registra tanto a possível leitura titular de מָשִׁיחַ quanto a ambiguidade lexical e sintática de וְאֵין לוֹ.
  - marker: b
    text: 'Ou: “o povo do governante que vem” ou “o povo de um príncipe que virá”.'
    reason: Preserva as alternativas para a determinação de נָגִיד e para o valor do particípio הַבָּא.
  - marker: c
    text: 'Hebraico: “e seu fim será com uma inundação”. O pronome pode referir-se à cidade, ao governante ou a outro elemento do contexto.'
    reason: Expõe a ambiguidade real do sufixo pronominal em קִצּוֹ sem introduzir uma comparação ausente do hebraico.
lexical_decisions:
- source_word: אַחֲרֵי
  choice: depois de
  rationale: Expressa diretamente a relação temporal de posterioridade.
- source_word: הַשָּׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: as sessenta e duas semanas
  rationale: Mantém a tradução tradicional e lexicalmente defensável de שָׁבוּעַ, sem decidir se as unidades devem ser entendidas como semanas comuns ou heptênios.
- source_word: יִכָּרֵת
  choice: será eliminado
  rationale: Comunica o sentido passivo e violento de ser suprimido. É mais natural em português contemporâneo do que o decalque 'será cortado', embora este preserve mais diretamente a imagem hebraica.
- source_word: מָשִׁיחַ
  choice: um ungido
  rationale: O substantivo não tem artigo no hebraico e pode designar genericamente alguém ungido; a formulação evita impor no texto principal uma identificação messiânica específica.
- source_word: וְאֵין לוֹ
  choice: e ficará sem nada
  rationale: Preserva a concisão e a ideia provável de privação, sem definir se a falta diz respeito a bens, apoio, sucessão ou direito.
- source_word: הָעִיר וְהַקֹּדֶשׁ
  choice: a cidade e o santuário
  rationale: '''Santuário'' comunica naturalmente o lugar ou recinto santo em paralelo com a cidade.'
- source_word: יַשְׁחִית
  choice: destruirá
  rationale: Representa com clareza a ação destrutiva do hifil de שׁחת.
- source_word: עַם נָגִיד הַבָּא
  choice: o povo de um governante que virá
  rationale: Mantém נָגִיד como autoridade política e liga o particípio 'que virá' ao governante, sem pressupor que ele já seja conhecido.
- source_word: וְקִצּוֹ בַשֶּׁטֶף
  choice: O fim dela virá como uma inundação
  rationale: Toma provisoriamente o sufixo como referência à cidade, mas assinala em nota a ambiguidade do referente. 'Como uma inundação' conserva a força da imagem hebraica.
- source_word: וְעַד קֵץ מִלְחָמָה
  choice: até o fim haverá guerra
  rationale: Formulação natural que preserva a continuidade da guerra até o fim.
- source_word: נֶחֱרֶצֶת שֹׁמֵמוֹת
  choice: Desolações estão decretadas
  rationale: Conserva a linguagem de determinação decisiva e o plural enfático de devastações ou estados de desolação.
theological_decisions:
- issue: Se מָשִׁיחַ deve ser traduzido explicitamente como título 'Messias'
  choice: um ungido
  alternative: o Messias
  rationale: A ausência do artigo e a amplitude lexical do termo tornam debatida a identificação. O texto principal preserva essa abertura, e a leitura messiânica aparece na nota.
- issue: Sentido de וְאֵין לוֹ
  choice: ficará sem nada
  alternative: não haverá nada para ele; não terá ninguém
  rationale: A cláusula é extremamente breve e pode indicar privação, abandono ou ausência de direito/posse. A tradução não especifica aquilo que o hebraico deixa implícito.
- issue: Referente do sufixo em קִצּוֹ, 'seu fim'
  choice: o fim dela, referindo-se provisoriamente à cidade
  alternative: o fim dele, referindo-se ao governante; ou o fim disso, referindo-se à destruição
  rationale: O referente gramatical e contextual é discutido. A nota registra a alternativa para impedir que a escolha pronominal portuguesa encerre a questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evita o arcaísmo sintático e mantém termos bíblicos correntes como 'ungido', 'santuário' e 'desolações'. Os marcadores aparecem junto às respectivas dificuldades textuais.
