revisions:
- from: E, depois das sessenta e duas semanas, um ungido será eliminado e ficará sem nada.[a] O povo de um governante que virá destruirá a cidade e o santuário.[b] O fim dela virá como uma inundação; até o fim haverá guerra. Desolações estão decretadas.[c]
  to: E, depois das sessenta e duas semanas, um ungido será eliminado e ficará sem nada.[a] O povo de um governante que virá destruirá a cidade e o santuário.[b] Seu fim virá com uma inundação.[c] Até o fim haverá guerra. Desolações estão decretadas.
  rationale: A revisão substitui a comparação «como uma inundação» pela relação expressa no hebraico, «com uma inundação»; troca «o fim dela» por «Seu fim» para não decidir o antecedente disputado; e reposiciona a nota c junto à cláusula que ela explica. As demais opções do rascunho são mantidas, pois comunicam o texto de modo natural e preservam suas tensões interpretativas.
