  naturalness: O português é claro, moderno e de registro apropriado. «Será eliminado», «santuário» e «Desolações estão decretadas» funcionam bem. «Seu fim» é igualmente natural e preserva melhor a indeterminação do original.
  terminology: «Um ungido» mantém a cautela lexical necessária; «Messias» deve permanecer como alternativa em nota. «Governante», «santuário» e «desolações» são escolhas adequadas e não impõem uma leitura confessional.
