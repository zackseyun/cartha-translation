  to: 'No primeiro ano do seu reinado, eu, Daniel, compreendi pelos livros[a] o número de anos acerca dos quais a palavra de Yahweh havia vindo a Jeremias, o profeta: setenta anos para se completarem as desolações de Jerusalém.'
  rationale: 'A revisão elimina a adição de “o período” e conserva a sequência informativa do versículo: Daniel discerniu nos escritos o número de anos anunciado a Jeremias, isto é, setenta anos para que as desolações de Jerusalém chegassem à sua completude. Mantêm-se o plural “desolações”, o nome “Yahweh” e a nota cultural ancorada em “livros”.'
