source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת אַחַת֙ לְ/מָלְכ֔/וֹ אֲנִי֙ דָּֽנִיֵּ֔אל בִּינֹ֖תִי בַּ/סְּפָרִ֑ים מִסְפַּ֣ר הַ/שָּׁנִ֗ים אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֶל יִרְמִיָ֣ה הַ/נָּבִ֔יא לְ/מַלֹּ֛אות לְ/חָרְב֥וֹת יְרוּשָׁלִַ֖ם שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/002.yaml
  text: 'In the first year of his reign[a], I, Daniel, understood from the books the number of the years about which the word of Yahweh had come to Jeremiah the prophet, for the completion of the desolations of Jerusalem: seventy years.'
translation:
  language: pt
  text: 'No primeiro ano do seu reinado, eu, Daniel, compreendi pelos livros[a] o número de anos acerca dos quais a palavra de Yahweh havia vindo a Jeremias, o profeta: setenta anos para se completarem as desolações de Jerusalém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelos rolos”. O termo hebraico pode designar de modo amplo documentos escritos; “livros” é usado no texto por ser natural em português, enquanto “rolos” explicita melhor o suporte material antigo.
    reason: cultural_note
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת
  choice: No primeiro ano
  rationale: A expressão com o numeral cardinal tem função ordinal idiomática e indica o primeiro ano.
- source_word: לְמָלְכוֹ
  choice: do seu reinado
  rationale: Expressa o período em que ele reinava; esta formulação é natural e mantém a referência pronominal do hebraico.
- source_word: בִּינֹתִי
  choice: compreendi
  rationale: O verbo בין indica alcançar entendimento ou discernimento; “compreendi” é claro e adequado ao contexto.
- source_word: בַּסְּפָרִים
  choice: pelos livros
  rationale: 'A preposição ב é entendida em sentido instrumental: Daniel obteve entendimento por meio dos documentos escritos. “Livros” é acessível, enquanto a nota registra “rolos” como alternativa historicamente explícita.'
- source_word: מִסְפַּר הַשָּׁנִים
  choice: o número de anos
  rationale: Preserva a ideia de uma quantidade determinada de anos sem produzir uma construção portuguesa excessivamente rígida.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל יִרְמִיָה הַנָּבִיא
  choice: acerca dos quais a palavra de Yahweh havia vindo a Jeremias, o profeta
  rationale: A oração relaciona os anos à revelação anteriormente dada a Jeremias; o mais-que-perfeito composto marca essa anterioridade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְמַלֹּאות לְחָרְבוֹת יְרוּשָׁלִַם
  choice: para se completar o período das desolações de Jerusalém
  rationale: Expressa a chegada à medida completa indicada pelos setenta anos. “O período” torna explícita em português a dimensão temporal já presente em “número de anos”, sem identificar um agente que cumpra a profecia.
- source_word: שִׁבְעִים שָׁנָה
  choice: setenta anos
  rationale: Tradução direta da expressão numérica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Nuance de לְמַלֹּאות na profecia de Jeremias
  choice: para se completar o período das desolações de Jerusalém
  alternative: para cumprir as desolações de Jerusalém
  rationale: A forma escolhida destaca a conclusão do período de setenta anos e evita introduzir um sujeito específico para o cumprimento, preservando a tensão e a relativa abertura sintática do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, mas evita rigidez desnecessária. O marcador da nota foi colocado depois de “livros”, termo ao qual a nota efetivamente se refere.
