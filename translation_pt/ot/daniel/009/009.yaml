  text: לַֽ/אדֹנָ֣/י אֱלֹהֵ֔י/נוּ הָ/רַחֲמִ֖ים וְ/הַ/סְּלִח֑וֹת כִּ֥י מָרַ֖דְנוּ בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/009.yaml
  text: To the Lord our God belong compassion and forgiveness[a], for we have rebelled against him.
translation:
  language: pt
  text: Ao Senhor, nosso Deus, pertencem as misericórdias e o perdão[a], pois nos rebelamos contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as misericórdias e os perdões”. No hebraico, os dois substantivos estão no plural, o que pode expressar abundância ou funcionar com sentido abstrato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנָי
  choice: Ao Senhor ... pertencem
  rationale: 'O לְ marca posse: aquilo que pertence ao Senhor. Em português, explicitar “pertencem” torna natural a oração nominal hebraica e conserva sua estrutura e sentido.'
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: O sufixo de primeira pessoa do plural significa “nosso”; a expressão foi mantida junto de “Senhor”, preservando a forma da invocação.
- source_word: הָרַחֲמִים
  choice: as misericórdias
  rationale: O substantivo está no plural e pode denotar manifestações abundantes da compaixão divina. “Misericórdias” é corrente no registro bíblico português e permite preservar o plural sem perder clareza.
- source_word: וְהַסְּלִחוֹת
  choice: e o perdão
  rationale: Embora a forma hebraica seja plural, em português “perdão” funciona naturalmente como substantivo abstrato. A nota registra a alternativa formal “os perdões”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação ligada à confissão; “pois” expressa com naturalidade essa relação sem torná-la excessivamente causal.
- source_word: מָרַדְנוּ
  choice: nos rebelamos
  rationale: מרד designa rebelião, não apenas pecado em sentido geral. O pretérito perfeito português apresenta a ação confessada com relevância no contexto da oração.
- source_word: בּוֹ
  choice: contra ele
  rationale: Com מרד, a preposição indica a pessoa contra quem se dirige a rebelião; “contra ele” é a expressão idiomática adequada em português.
theological_decisions:
- issue: Título divino אֲדֹנָי
  choice: Senhor
  alternative: Soberano; Mestre
  rationale: “Senhor” é o equivalente tradicional e natural do título divino neste contexto de oração, sem acrescentar uma interpretação denominacional.
- issue: Plurais de misericórdia e perdão
  choice: misericórdias e o perdão
  alternative: a misericórdia e os perdões; as misericórdias e os perdões
  rationale: A tradução conserva o plural de רַחֲמִים, que soa natural em português, mas emprega o abstrato singular “perdão” para סְלִחוֹת. A nota preserva a informação de que ambos os termos são plurais no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a oração nominal e a ênfase possessiva do hebraico mediante “pertencem”, sem sacrificar a naturalidade.
