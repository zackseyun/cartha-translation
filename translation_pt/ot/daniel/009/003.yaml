  text: וָ/אֶתְּנָ֣/ה אֶת פָּנַ֗/י אֶל אֲדֹנָ/י֙ הָֽ/אֱלֹהִ֔ים לְ/בַקֵּ֥שׁ תְּפִלָּ֖ה וְ/תַחֲנוּנִ֑ים בְּ/צ֖וֹם וְ/שַׂ֥ק וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/003.yaml
  text: So I turned my face to the Lord God[a], to seek prayer and pleas for mercy, with fasting, sackcloth[b], and ashes.
translation:
  language: pt
  text: Então dirigi o rosto para o Senhor Deus[a], para buscar com oração e súplicas, com jejum, pano de saco[b] e cinzas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pus o rosto para o Senhor Deus”. A expressão hebraica diz mais literalmente: “dei/pus o meu rosto para”.'
    reason: lexical_alternative
  - marker: b
    text: Tecido grosseiro usado como sinal de luto, humilhação ou arrependimento.
    reason: cultural_clarification
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת־פָּנַי
  choice: voltei o rosto
  rationale: A expressão hebraica significa literalmente “dei/pus o meu rosto” e comunica orientação deliberada e resoluta. “Voltei o rosto” mantém a imagem concreta em português natural.
- source_word: אֶל אֲדֹנָי הָאֱלֹהִים
  choice: para o Senhor Deus
  rationale: “Senhor” traduz אֲדֹנָי, que aqui é um título e não o nome divino YHWH; “Deus” traduz הָאֱלֹהִים.
- source_word: לְבַקֵּשׁ תְּפִלָּה וְתַחֲנוּנִים
  choice: buscando-o com oração e súplicas
  rationale: A construção hebraica é compacta e, tomada literalmente, seria “buscar oração e súplicas”. No contexto, expressa a busca dirigida a Deus mediante oração e pedidos insistentes. O pronome explicita em português o referente contextual sem transformar “oração” no objeto procurado.
- source_word: תְּפִלָּה
  choice: oração
  rationale: É o termo geral para oração e contrasta com o termo mais específico e urgente que vem em seguida.
- source_word: תַחֲנוּנִים
  choice: súplicas
  rationale: O plural designa pedidos humildes e insistentes por favor ou misericórdia. “Súplicas” é corrente, conciso e preserva o tom solene.
- source_word: בְּצוֹם
  choice: em jejum
  rationale: A preposição marca circunstância concomitante; “em jejum” é a formulação mais natural em português.
- source_word: שַׂק
  choice: pano de saco
  rationale: Designa o tecido grosseiro usado como sinal de luto, humilhação ou arrependimento. A expressão é mais imediatamente compreensível do que apenas “saco”.
- source_word: אֵפֶר
  choice: cinzas
  rationale: O plural idiomático em português expressa o uso ritual das cinzas como sinal de luto e humilhação.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי הָאֱלֹהִים
  choice: o Senhor Deus
  alternative: o Senhor, o Deus
  rationale: O texto traz אֲדֹנָי, “Senhor”, e não YHWH. A tradução preserva os dois títulos sem introduzir a convenção gráfica reservada ao nome divino.
- issue: Objeto implícito de לְבַקֵּשׁ
  choice: buscando-o com oração e súplicas
  alternative: para buscar oração e súplicas
  rationale: O hebraico permite uma formulação compacta cujo objeto contextual é Deus, enquanto oração e súplicas indicam o modo da busca. A opção escolhida produz sentido natural em português, mas a nota registra a forma mais literal e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem da frase e as imagens de rosto, jejum, pano de saco e cinzas foram preservadas, enquanto a construção infinitiva foi tornada natural sem ocultar sua forma mais literal, registrada em nota.
