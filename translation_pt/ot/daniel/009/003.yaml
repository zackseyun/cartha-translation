  naturalness: “Dirigi o rosto” é claro, digno e natural em registro bíblico moderno. “Para buscar com oração e súplicas” é uma maneira fluente de comunicar a relação instrumental entre a busca e as práticas de oração, sem fazer de “oração e súplicas” o objeto direto semanticamente estranho de “buscar”. “Pano de saco” é amplamente compreensível.
  terminology: “Senhor Deus” reproduz adequadamente אֲדֹנָי הָאֱלֹהִים, sem introduzir a convenção gráfica própria de YHWH. “Oração”, “súplicas”, “jejum”, “pano de saco” e “cinzas” são escolhas fiéis e adequadas ao registro.
