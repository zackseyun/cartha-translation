  text: וְ/כָל יִשְׂרָאֵ֗ל עָֽבְרוּ֙ אֶת תּ֣וֹרָתֶ֔/ךָ וְ/ס֕וֹר לְ/בִלְתִּ֖י שְׁמ֣וֹעַ בְּ/קֹלֶ֑/ךָ וַ/תִּתַּ֨ךְ עָלֵ֜י/נוּ הָ/אָלָ֣ה וְ/הַ/שְּׁבֻעָ֗ה אֲשֶׁ֤ר כְּתוּבָה֙ בְּ/תוֹרַת֙ מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֔ים כִּ֥י חָטָ֖אנוּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/011.yaml
  text: All Israel has transgressed your law and turned aside[a], not listening to your voice. So the curse and the oath that are written in the law of Moses, the servant of God, have been poured out on us, because we have sinned against him.
translation:
  language: pt
  text: Todo o Israel transgrediu a tua lei e se desviou, sem dar ouvidos à tua voz. Assim, foram derramados sobre nós a maldição e o juramento[a] escritos na Lei de Moisés, servo de Deus, porque pecamos contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a maldição jurada”. O hebraico diz literalmente “a maldição e o juramento”, provavelmente em referência às sanções da aliança confirmadas por juramento na Lei de Moisés.
    reason: Alternativa lexical e esclarecimento da relação possível entre os dois substantivos hebraicos.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Todo o Israel
  rationale: Expressa Israel como totalidade coletiva e permite concordância natural no singular em português.
- source_word: עָבְרוּ אֶת תּוֹרָתֶךָ
  choice: transgrediu a tua lei
  rationale: עבר, neste contexto de aliança, indica ultrapassar ou violar os limites da Torá; “lei” comunica as estipulações da aliança.
- source_word: וְסוֹר לְבִלְתִּי שְׁמֹעַ בְּקוֹלֶךָ
  choice: e se desviou, deixando de dar ouvidos à tua voz
  rationale: “Se desviou” conserva a imagem de afastamento da obediência; “deixando de dar ouvidos” traduz de modo natural a construção negativa sem explicitar além do texto uma recusa deliberada.
- source_word: וַתִּתַּךְ עָלֵינוּ
  choice: foram derramados sobre nós
  rationale: Mantém a imagem de נתך, usada para o derramamento do juízo, com concordância portuguesa natural para os dois substantivos coordenados.
- source_word: הָאָלָה וְהַשְּׁבֻעָה
  choice: a maldição e o juramento
  rationale: Preserva os dois termos distintos do hebraico e evita reduzir interpretativamente o juramento a uma segunda designação da maldição.
- source_word: אֲשֶׁר כְּתוּבָה בְּתוֹרַת מֹשֶׁה
  choice: escritos na Lei de Moisés
  rationale: A concordância no plural é natural em português com o par “maldição e juramento”; “Lei de Moisés” identifica o documento da aliança em vista.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: servo de Deus
  rationale: Reproduz o título honorífico de Moisés com clareza e concisão.
- source_word: כִּי חָטָאנוּ לוֹ
  choice: porque pecamos contra ele
  rationale: חטא com ל indica pecar contra alguém; o pronome retoma Deus, a quem a oração é dirigida.
theological_decisions:
- issue: Culpa coletiva e concordância gramatical
  choice: “Todo o Israel transgrediu” no singular coletivo, seguido de “sobre nós” e “pecamos”.
  alternative: Empregar concordância plural com Israel.
  rationale: O singular é idiomático em português e mantém Israel como corpo coletivo, enquanto a primeira pessoa do plural inclui Daniel na confissão nacional.
- issue: Sentido de “o juramento” no contexto da aliança
  choice: Manter “a maldição e o juramento” no texto principal.
  alternative: Traduzir como “a maldição jurada”.
  rationale: Embora os termos provavelmente se refiram às sanções juramentadas da aliança, o hebraico apresenta dois substantivos; mantê-los preserva a ambiguidade e a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento divino em segunda pessoa usa “tua/teu”, enquanto o encerramento conserva a mudança do hebraico para a terceira pessoa (“contra ele”).
