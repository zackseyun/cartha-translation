id: DAN.9.4
reference: Daniel 9:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָֽ/אֶתְפַּֽלְלָ֛/ה לַ/יהוָ֥ה אֱלֹהַ֖/י וָ/אֶתְוַדֶּ֑ה וָ/אֹֽמְרָ֗/ה אָנָּ֤א אֲדֹנָ/י֙ הָ/אֵ֤ל הַ/גָּדוֹל֙ וְ/הַ/נּוֹרָ֔א שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/004.yaml
  text: And I prayed to Yahweh my God and confessed and said[a], “Please, Lord, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: pt
  text: 'E orei a Yahweh, meu Deus, confessei e disse: “Ah, Senhor, Deus grande e temível[a], que guarda a aliança e o amor leal[b] para com os que o amam e guardam os seus mandamentos,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que inspira temor”. O termo hebraico descreve alguém que desperta profundo temor reverente.
    reason: lexical_alternative
  - marker: b
    text: Ou “amor constante”, “fidelidade à aliança” ou “misericórdia”. O hebraico חֶסֶד reúne ideias de amor, lealdade e misericórdia, especialmente no contexto da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלְלָה
  choice: E orei
  rationale: O wayyiqtol apresenta a ação seguinte na narrativa; o pretérito perfeito é natural em português.
- source_word: לַיהוָה אֱלֹהַי
  choice: a Yahweh, meu Deus
  rationale: Preserva o destinatário marcado por ל, o nome divino e o sufixo explícito de primeira pessoa.
- source_word: וָאֶתְוַדֶּה
  choice: confessei
  rationale: O hitpael de ידה, neste contexto penitencial, indica confissão de pecados.
- source_word: וָאֹמְרָה
  choice: e disse
  rationale: Mantém a sequência verbal que introduz as palavras da oração.
- source_word: אָנָּא
  choice: Ah
  rationale: Partícula de súplica solene; “Ah” conserva a intensidade do apelo sem sugerir que Daniel apenas esteja usando uma fórmula cotidiana de cortesia.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Título divino em vocativo, distinto do nome Yahweh anteriormente empregado.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: Deus grande e temível
  rationale: Formulação vocativa natural; “temível” expressa aquele que inspira temor reverente, sem o sentido coloquial de “incrível” que “impressionante” pode adquirir.
- source_word: שֹׁמֵר הַבְּרִית
  choice: que guarda a aliança
  rationale: O particípio descreve uma ação característica de Deus; “guarda” preserva a imagem lexical e é idiomático em contexto de aliança.
- source_word: וְהַחֶסֶד
  choice: e o amor leal
  rationale: Comunica a combinação de amor, misericórdia e fidelidade relacional de חֶסֶד sem reduzi-la a apenas um desses aspectos.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: para com os que o amam e guardam os seus mandamentos
  rationale: Conserva o paralelismo e os pronomes referentes a Deus.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; a transliteração preserva a distinção entre o nome da aliança e o título אֲדֹנָי, “Senhor”.
- issue: Sentido de חֶסֶד no contexto da aliança
  choice: amor leal
  alternative: amor constante; fidelidade à aliança; misericórdia
  rationale: “Amor leal” preserva tanto a dimensão afetiva quanto a constância e fidelidade pactuais do termo, sem resolver toda a sua amplitude em uma única ideia abstrata.
- issue: Alcance de לְ diante dos que amam e obedecem
  choice: para com os que
  alternative: aos que
  rationale: A formulação indica os beneficiários ou o âmbito relacional em que Deus guarda a aliança e o amor leal, sem afirmar aqui uma explicação sistemática dessa relação.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. Mantém a cadência de uma oração confessional e deixa a oração sintaticamente aberta, como no versículo hebraico, que prossegue no contexto seguinte.
