source:
  edition: WLC
  text: אֲדֹנָ֗/י כְּ/כָל צִדְקֹתֶ֨/ךָ֙ יָֽשָׁב נָ֤א אַפְּ/ךָ֙ וַ/חֲמָ֣תְ/ךָ֔ מֵ/עִֽירְ/ךָ֥ יְרוּשָׁלִַ֖ם הַר קָדְשֶׁ֑/ךָ כִּ֤י בַ/חֲטָאֵ֨י/נוּ֙ וּ/בַ/עֲוֺנ֣וֹת אֲבֹתֵ֔י/נוּ יְרוּשָׁלִַ֧ם וְ/עַמְּ/ךָ֛ לְ/חֶרְפָּ֖ה לְ/כָל סְבִיבֹתֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/016.yaml
  text: Lord[a], according to all your righteous acts, please let your anger and your wrath turn away from your city Jerusalem, your holy mountain; because through our sins and the iniquities of our fathers[b], Jerusalem and your people have become a reproach to all those around us.
translation:
  language: pt
  text: Senhor, segundo todos os teus atos de justiça[a], por favor, afasta a tua ira e o teu furor da tua cidade, Jerusalém, do teu santo monte; pois, por causa dos nossos pecados e das iniquidades dos nossos pais[b], Jerusalém e o teu povo se tornaram objeto de desprezo para todos os que estão ao nosso redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os teus atos justos” ou “toda a tua justiça”. O hebraico está no plural e provavelmente aponta para os feitos justos de Deus, não apenas para uma qualidade abstrata.
    reason: lexical_alternative
  - marker: b
    text: “Nossos pais” refere-se às gerações anteriores, isto é, aos antepassados do povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Forma consagrada e natural do título divino em vocativo; a pontuação comunica a invocação sem exigir a interjeição “ó”.
- source_word: כְּכָל צִדְקֹתֶיךָ
  choice: segundo todos os teus atos de justiça
  rationale: A preposição indica a norma à qual Daniel apela, e o plural aponta naturalmente para manifestações concretas da justiça divina.
- source_word: יָשָׁב נָא
  choice: por favor, afasta
  rationale: O jussivo com נָא expressa súplica. A formulação ativa é natural em português e comunica que se pede a Deus que faça sua ira retirar-se.
- source_word: אַפְּךָ וַחֲמָתְךָ
  choice: a tua ira e o teu furor
  rationale: Traduz o primeiro termo idiomático por “ira” e mantém, com “furor”, a intensificação do segundo termo sem os fundir.
- source_word: מֵעִירְךָ יְרוּשָׁלַם הַר קָדְשֶׁךָ
  choice: da tua cidade, Jerusalém, o teu santo monte
  rationale: Conserva a relação apositiva entre Jerusalém, a cidade de Deus, e o seu santo monte, com pontuação clara em português.
- source_word: כִּי בַחֲטָאֵינוּ וּבַעֲוֹנוֹת אֲבֹתֵינוּ
  choice: pois, por causa dos nossos pecados e das iniquidades dos nossos pais
  rationale: כִּי introduz a razão da súplica, e בְּ tem valor causal neste contexto. “Iniquidades” preserva a distinção de עָוֹן em relação ao termo geral para pecado.
- source_word: לְחֶרְפָּה
  choice: se tornaram motivo de vergonha
  rationale: Expressa em português natural o estado resultante indicado pela construção com לְ, sem reduzir a ideia a mera censura verbal.
- source_word: לְכָל סְבִיבֹתֵינוּ
  choice: para todos os que estão ao nosso redor
  rationale: Interpreta o substantivo contextual como referência aos povos ou habitantes circundantes, conforme exige a construção pessoal com “todos”.
theological_decisions:
- issue: Sentido do plural צִדְקֹתֶיךָ no apelo a Deus
  choice: teus atos de justiça
  alternative: tua justiça; teus atos justos
  rationale: O plural favorece feitos concretos que manifestam a justiça de Deus, sem separar esses feitos de seu caráter justo nem restringir o termo apenas à justiça judicial.
- issue: Solidariedade coletiva e intergeracional na confissão
  choice: nossos pecados e as iniquidades dos nossos pais
  alternative: nossos pecados e as iniquidades dos nossos antepassados
  rationale: A tradução mantém a distinção explícita entre a geração que ora e as gerações anteriores, sem explicar ou resolver além do texto a relação teológica entre suas culpas.
- issue: Natureza da desonra de Jerusalém e do povo
  choice: se tornaram motivo de vergonha
  alternative: são objeto de desprezo; são uma vergonha
  rationale: A escolha comunica a condição pública e desonrosa diante dos povos vizinhos, sem afirmar que Jerusalém e o povo sejam moralmente vergonhosos em si mesmos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “tu” em concordância uniforme, preserva o paralelismo entre ira e furor e mantém a súplica direta sem linguagem excessivamente arcaica.
