source:
  edition: WLC
  text: וַ/יָּ֜קֶם אֶת דברי/ו אֲשֶׁר דִּבֶּ֣ר עָלֵ֗י/נוּ וְ/עַ֤ל שֹֽׁפְטֵ֨י/נוּ֙ אֲשֶׁ֣ר שְׁפָט֔וּ/נוּ לְ/הָבִ֥יא עָלֵ֖י/נוּ רָעָ֣ה גְדֹלָ֑ה אֲשֶׁ֣ר לֹֽא נֶעֶשְׂתָ֗ה תַּ֚חַת כָּל הַ/שָּׁמַ֔יִם כַּ/אֲשֶׁ֥ר נֶעֶשְׂתָ֖ה בִּ/ירוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/012.yaml
  text: He has confirmed his words that he spoke against us and against our judges who judged us[a], by bringing upon us a great disaster such as had not been done under all heaven, as it was done in Jerusalem.
translation:
  language: pt
  text: Ele confirmou as palavras que havia falado contra nós e contra os nossos juízes, que nos julgaram,[a] trazendo sobre nós uma grande calamidade, como nunca havia ocorrido debaixo de todo o céu, tal como ocorreu em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os nossos governantes, que nos governavam” ou “os nossos líderes, que nos dirigiam”. Os termos hebraicos traduzidos por “juízes” e “julgaram” podem referir-se, de modo mais amplo, às autoridades que governavam, e não apenas a juízes de tribunal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: confirmou
  rationale: O hifil de קום com “palavras” indica confirmar, estabelecer ou cumprir o que foi dito. “Confirmou” expressa que Deus fez valer sua sentença anunciada.
- source_word: דבריו
  choice: as palavras
  rationale: Mantém o plural hebraico; o possessivo é recuperado naturalmente pela oração relativa “que havia falado”.
- source_word: דִּבֶּר עָלֵינוּ
  choice: havia falado contra nós
  rationale: Neste contexto de juízo, על tem força adversativa. O mais-que-perfeito situa as palavras antes de sua confirmação pelo desastre.
- source_word: שֹׁפְטֵינוּ אֲשֶׁר שְׁפָטוּנוּ
  choice: os nossos juízes, que nos julgavam
  rationale: Preserva a repetição lexical da raiz שפט e deixa em nota seu sentido governamental mais amplo.
- source_word: לְהָבִיא עָלֵינוּ
  choice: trazendo sobre nós
  rationale: 'O gerúndio comunica de modo natural o valor instrumental ou resultativo do infinitivo: Deus confirmou suas palavras mediante a calamidade.'
- source_word: רָעָה גְדֹלָה
  choice: uma grande calamidade
  rationale: Em contexto de juízo, רָעָה designa desgraça ou calamidade, não mal moral. “Calamidade” mantém tom digno e abrangente.
- source_word: אֲשֶׁר לֹא נֶעֶשְׂתָה
  choice: como nunca havia ocorrido
  rationale: Expressa de maneira idiomática a natureza sem precedente da calamidade, sem reproduzir um passivo pouco natural em português.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: debaixo de todo o céu
  rationale: Conserva a imagem do idioma hebraico para toda a extensão do mundo.
- source_word: כַּאֲשֶׁר נֶעֶשְׂתָה בִּירוּשָׁלָם
  choice: tal como ocorreu em Jerusalém
  rationale: Retoma “calamidade” e verte o passivo hebraico por uma construção natural, sem alterar o sentido.
theological_decisions:
- issue: Referente do sujeito implícito
  choice: “Ele”, referindo-se a Deus no contexto da oração
  alternative: Inserir explicitamente “Deus”
  rationale: O contexto identifica Deus como quem confirmou as palavras e trouxe a calamidade. Manter o pronome preserva o estilo do hebraico sem acrescentar o nome ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição da raiz hebraica שפט foi preservada no texto, e sua amplitude semântica foi registrada em nota.
