base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/004.yaml
  text: 'Then the Chaldeans spoke to the king in Aramaic: “O king[a], live forever! Tell the dream to your servants[c][b], and we will declare the interpretation.”'
translation:
  language: pt
  text: Então os caldeus disseram ao rei em aramaico:[a] “Ó rei, viva para sempre![b] Conte o sonho aos seus servos, e nós daremos a conhecer a interpretação.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto aramaico começa aqui e continua até Daniel 7:28.
    reason: cross_reference
  - marker: b
    text: 'Ou: “que o rei viva para sempre”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “mostraremos a interpretação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Então ... disseram
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Mantém a designação étnica ou titular do grupo da corte, sem reduzi-la interpretativamente a “astrólogos”.
- source_word: לַמֶּלֶךְ
  choice: ao rei
  rationale: Reproduz diretamente a expressão preposicional que identifica o destinatário.
- source_word: אֲרָמִית
  choice: em aramaico
  rationale: Indica de modo conciso tanto a língua da fala quanto a transição linguística do livro.
- source_word: מַלְכָּא
  choice: Ó rei
  rationale: O vocativo com “ó” conserva o tom solene e cortês da linguagem da corte.
- source_word: לְעָלְמִין חֱיִי
  choice: viva para sempre
  rationale: Preserva a fórmula convencional de aclamação real e seu valor de desejo ou voto.
- source_word: אֱמַר
  choice: Conte
  rationale: No contexto, pede-se ao rei que relate o conteúdo do sonho; “conte” é natural em português.
- source_word: חֶלְמָא
  choice: o sonho
  rationale: A forma determinada é representada pelo artigo; o contexto torna desnecessário acrescentar “seu”.
- source_word: לְעַבְדָךְ
  choice: aos seus servos
  rationale: Na linguagem da corte, “servos” comunica a autodesignação deferente sem afirmar uma condição jurídica específica de escravidão.
- source_word: וּפִשְׁרָא
  choice: a interpretação
  rationale: O termo funciona em Daniel como palavra técnica para a interpretação de sonhos e visões.
- source_word: נְחַוֵּא
  choice: daremos a conhecer
  rationale: Expressa o sentido causativo de mostrar ou tornar conhecido, em registro digno e natural.
