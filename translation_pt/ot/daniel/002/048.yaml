  yaml_path: translation/ot/daniel/002/048.yaml
  text: Then the king made Daniel great and gave him many great gifts[b][a], and he made him ruler over the whole province of Babylon and chief prefect over all the wise men of Babylon.
translation:
  language: pt
  text: Então, o rei engrandeceu Daniel[a], deu-lhe muitos e grandes presentes e o constituiu governador de toda a província da Babilônia e chefe dos administradores sobre todos os sábios da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “promoveu Daniel”. O verbo aramaico significa literalmente “tornou grande” e, neste contexto, refere-se à exaltação concedida pelo rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Advérbio temporal e sequencial que dá continuidade natural à narrativa.
- source_word: מַלְכָּא
  choice: o rei
  rationale: Forma enfática definida; tradução direta e natural.
- source_word: לְדָנִיֵּאל
  choice: Daniel
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: רַבִּי
  choice: engrandeceu Daniel
  rationale: O verbo significa literalmente tornar grande e, no contexto da corte, implica exaltar ou promover; a opção preserva a imagem do aramaico.
- source_word: וּמַתְּנָן רַבְרְבָן שַׂגִּיאָן יְהַב לֵהּ
  choice: deu-lhe muitos presentes valiosos
  rationale: מַתְּנָן são presentes; os qualificadores indicam quantidade e grandeza. 'Valiosos' comunica naturalmente o caráter notável dos presentes sem sugerir apenas tamanho físico.
- source_word: וְהַשְׁלְטֵהּ
  choice: o constituiu governador
  rationale: A forma causativa indica que o rei pôs Daniel em posição de governo ou domínio.
- source_word: עַל כָּל מְדִינַת בָּבֶל
  choice: de toda a província da Babilônia
  rationale: מְדִינָה designa uma província no contexto imperial, e כָּל com o singular abrange sua totalidade.
- source_word: וְרַב סִגְנִין
  choice: e chefe dos administradores
  rationale: רַב significa chefe, e סִגְנִין designa oficiais ou administradores. Esta formulação conserva a ideia de autoridade superior sem depender de um título português excessivamente técnico.
- source_word: עַל כָּל חַכִּימֵי בָבֶל
  choice: sobre todos os sábios da Babilônia
  rationale: Tradução tradicional e contextualmente adequada para os sábios e conselheiros da corte babilônica.
