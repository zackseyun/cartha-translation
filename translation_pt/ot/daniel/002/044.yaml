  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּֽ/בְ/יוֹמֵי/ה֞וֹן דִּ֧י מַלְכַיָּ֣/א אִנּ֗וּן יְקִים֩ אֱלָ֨הּ שְׁמַיָּ֤/א מַלְכוּ֙ דִּ֤י לְ/עָלְמִין֙ לָ֣א תִתְחַבַּ֔ל וּ/מַ֨לְכוּתָ֔/ה לְ/עַ֥ם אָחֳרָ֖ן לָ֣א תִשְׁתְּבִ֑ק תַּדִּ֤ק וְ/תָסֵיף֙ כָּל אִלֵּ֣ין מַלְכְוָתָ֔/א וְ/הִ֖יא תְּק֥וּם לְ/עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/044.yaml
  text: And in the days of those kings[a], the God of heaven will set up a kingdom that will never be destroyed, and the kingdom will not be left to another people. It will crush and put an end to all these kingdoms[b], and it will stand forever.
translation:
  language: pt
  text: E nos dias daqueles reis[a], o Deus do céu estabelecerá um reino que jamais será destruído, e esse reino não será deixado para outro povo. Ele esmagará[b] e porá fim a todos esses reinos, e permanecerá para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aqueles reis” retoma os reis ou reinos representados no sonho de Nabucodonosor; há diferentes entendimentos quanto à referência histórica exata.
    reason: alternative_reading
  - marker: b
    text: Ou “despedaçará”; o verbo aramaico transmite a ideia de esmagar ou reduzir a pedaços.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹמֵיהוֹן דִּי מַלְכַיָּא אִנּוּן
  choice: E, nos dias daqueles reis
  rationale: Preserva a ligação narrativa, a expressão temporal e a referência anafórica aos reis já representados no sonho, sem delimitar sua identificação histórica.
- source_word: יְקִים
  choice: estabelecerá
  rationale: Expressa de modo natural e digno a ideia de levantar ou instituir um reino.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: o Deus do céu
  rationale: Mantém o título bíblico aramaico em sua forma corrente em português.
- source_word: מַלְכוּ דִּי לְעָלְמִין לָא תִתְחַבַּל
  choice: um reino que jamais será destruído
  rationale: A construção negativa com לְעָלְמִין comunica indestrutibilidade permanente; “jamais” reproduz essa força com clareza.
- source_word: וּמַלְכוּתָהּ לְעַם אָחֳרָן לָא תִשְׁתְּבִק
  choice: Esse reino não será deixado para outro povo
  rationale: “Esse reino” retoma naturalmente o reino mencionado, enquanto a forma passiva indica que ele não passará à posse de outro povo.
- source_word: תַּדִּק
  choice: ele esmagará
  rationale: O causativo de דק descreve esmagar ou despedaçar, em harmonia com a imagem da pedra no contexto.
- source_word: וְתָסֵיף
  choice: e dará fim
  rationale: Traduz o sentido causativo de levar ao fim, distinguindo-o do verbo anterior.
- source_word: כָּל אִלֵּין מַלְכְוָתָא
  choice: todos esses reinos
  rationale: O demonstrativo aponta para os reinos representados e explicados no sonho.
- source_word: וְהִיא תְּקוּם לְעָלְמַיָּא
  choice: e permanecerá para sempre
  rationale: Comunica a permanência duradoura de קום neste contexto, em contraste com os reinos eliminados.
theological_decisions:
- issue: Natureza e identificação do reino final
  choice: Declarar sua origem divina, permanência e triunfo sem identificá-lo explicitamente no texto com uma formulação doutrinária posterior.
  alternative: Identificá-lo expressamente como o reino messiânico de Cristo ou reduzi-lo a um governo divino genérico.
  rationale: O aramaico afirma que Deus estabelece esse reino eterno e vitorioso, mas o versículo não apresenta por si só uma identificação doutrinária mais específica.
- issue: Referente de “daqueles reis”
  choice: Manter a referência anafórica sem precisar quais reis ou qual etapa histórica estão em vista.
  alternative: Especificar os quatro reinos, os reis do reino dividido ou governantes de uma fase final.
  rationale: O texto remete às figuras régias do sonho, mas não resolve no próprio versículo as diferentes delimitações históricas propostas.
- issue: Agente dos verbos finais
  choice: Usar “ele” para retomar o reino como agente que esmaga, dá fim e permanece.
  alternative: Repetir “o reino” em cada oração ou atribuir diretamente as ações a Deus.
  rationale: As formas verbais aramaicas têm como sujeito gramatical o reino; a tradução conserva essa estrutura sem separar a ação do estabelecimento divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Estabelecerá” evita coloquialismo; “jamais” e “para sempre” preservam a dupla ênfase na permanência. A pontuação explicita as relações entre as orações sem alterar sua sequência lógica.
