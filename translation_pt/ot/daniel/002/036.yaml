  text: דְּנָ֣ה חֶלְמָ֔/א וּ/פִשְׁרֵ֖/הּ נֵאמַ֥ר קֳדָם מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/036.yaml
  text: This was the dream[a], and we will tell its interpretation before the king.
translation:
  language: pt
  text: Este foi o sonho[a], e diremos diante do rei a sua interpretação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o sonho; diremos diante do rei a sua interpretação.” O aramaico permite pequenas diferenças de pontuação e aspecto verbal sem alterar o sentido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Este foi
  rationale: O demonstrativo aramaico retoma o sonho que Daniel acaba de narrar; em português, a cópula e o passado tornam natural essa conclusão retrospectiva.
- source_word: חֶלְמָא
  choice: o sonho
  rationale: O substantivo definido se refere ao sonho específico de Nabucodonosor.
- source_word: וּפִשְׁרֵהּ
  choice: a sua interpretação
  rationale: פִשְׁרָא é o termo técnico para a interpretação de sonhos e mistérios em Daniel; o possessivo retoma 'o sonho'.
- source_word: נֵאמַר
  choice: diremos
  rationale: A forma verbal na primeira pessoa do plural anuncia a exposição que virá; 'diremos' preserva de modo claro o valor prospectivo.
- source_word: קֳדָם מַלְכָּא
  choice: ao rei
  rationale: Embora קֳדָם signifique literalmente 'diante de' ou 'na presença de', com o verbo 'dizer' a construção idiomática portuguesa 'diremos ao rei' comunica naturalmente a cena de audiência.
