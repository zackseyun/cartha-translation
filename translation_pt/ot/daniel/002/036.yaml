  to: Este foi o sonho[a], e diremos diante do rei a sua interpretação.
  rationale: A revisão substitui «ao rei» por «diante do rei» para refletir diretamente קֳדָם. Também retira «agora» da alternativa de rodapé, pois, embora seja uma explicitação discursivamente possível, não é necessário ao sentido expresso no aramaico. Mantém-se «Este foi» como formulação portuguesa natural para a conclusão retrospectiva do relato do sonho.
