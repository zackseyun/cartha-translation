  terminology: “Seres humanos”, “animais do campo”, “aves do céu” e “cabeça de ouro” são termos claros, fiéis e apropriados ao registro. “Aves do céu” é mais idiomático em português do que “aves dos céus”, sem perda semântica relevante, pois “céus” é aqui o idiomatismo semítico para o céu.
