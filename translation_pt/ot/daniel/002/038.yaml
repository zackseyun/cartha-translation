source:
  edition: WLC
  text: וּ/בְ/כָל דִּ֣י דארין בְּֽנֵי אֲ֠נָשָׁ/א חֵיוַ֨ת בָּרָ֤/א וְ/עוֹף שְׁמַיָּ/א֙ יְהַ֣ב בִּ/ידָ֔/ךְ וְ/הַשְׁלְטָ֖/ךְ בְּ/כָלְּ/ה֑וֹן אַנְתְּה ה֔וּא רֵאשָׁ֖/ה דִּ֥י דַהֲבָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/038.yaml
  text: And wherever the children of men dwell[a], the beasts of the field and the birds of the heavens—he has given them into your hand and made you ruler over all of them[c][b]. You are the head of gold.
translation:
  language: pt
  text: E onde quer que habitem os seres humanos[a], os animais do campo e as aves do céu, ele os entregou em suas mãos e constituiu o senhor governante sobre todos eles[b]. O senhor é a cabeça de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos dos homens”.
    reason: lexical_alternative
  - marker: b
    text: O sujeito implícito de “entregou” e “constituiu o senhor governante” é Deus, mencionado no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְכָל דִּי דארין
  choice: E onde quer que habitem
  rationale: A construção aramaica tem sentido locativo abrangente. Esta formulação preserva “onde quer que” e soa natural em português.
- source_word: בְּנֵי אֲנָשָׁא
  choice: os seres humanos
  rationale: Embora literalmente seja “filhos do homem/dos homens”, a expressão aramaica é idiomática e designa os humanos em geral; “seres humanos” comunica esse sentido com clareza no português atual.
- source_word: חֵיוַת בָּרָא
  choice: os animais do campo
  rationale: Preserva a imagem concreta dos animais da região aberta ou campestre sem sugerir necessariamente apenas feras.
- source_word: וְעוֹף שְׁמַיָּא
  choice: as aves dos céus
  rationale: Mantém a forma imagética e elevada do original; “aves do céu” também seria possível.
- source_word: יְהַב בִּידָךְ
  choice: ele os entregou em suas mãos
  rationale: O verbo significa “dar”, e a expressão “na mão” indica entrega à autoridade ou ao domínio de alguém. O pretérito perfeito traduz naturalmente a forma perfectiva aramaica.
- source_word: וְהַשְׁלְטָךְ
  choice: e fez o senhor governar
  rationale: A forma causativa indica que o rei foi constituído ou capacitado para exercer domínio. “Fez o senhor governar” preserva essa causalidade e distingue o pronome de tratamento do sujeito divino implícito.
- source_word: בְּכָלְּהוֹן
  choice: sobre todos eles
  rationale: Explicita de maneira natural que o domínio abrange todos os grupos anteriormente mencionados.
- source_word: אַנְתְּה הוּא
  choice: O senhor é
  rationale: O pronome tem valor enfático. Em português, a oração independente e a escolha do tratamento direto dão destaque suficiente sem uma construção pesada.
- source_word: רֵאשָׁה דִּי דַהֲבָא
  choice: a cabeça de ouro
  rationale: Preserva diretamente a identificação do rei com a parte da estátua e mantém a metáfora material do original.
theological_decisions:
- issue: Sujeito implícito de “entregou” e “fez governar”
  choice: Manter “ele”, com referência contextual ao Deus do céu mencionado no versículo anterior.
  alternative: Inserir explicitamente “Deus” no texto principal.
  rationale: O aramaico não repete o sujeito nominal neste versículo. Preservar o pronome mantém a continuidade e evita acrescentar ao texto, enquanto a nota esclarece a referência.
- issue: Alcance antropológico de בְּנֵי אֲנָשָׁא
  choice: Traduzir como “os seres humanos”.
  alternative: “os filhos dos homens” ou “a humanidade”.
  rationale: A expressão inclui a humanidade em geral. A tradução escolhida reproduz o referente sem restringi-lo ao sexo masculino e sem transformar a expressão em uma abstração coletiva.
- issue: Forma de tratamento dirigida a Nabucodonosor
  choice: Usar “o senhor/suas” para distinguir o destinatário humano do “ele” divino.
  alternative: Usar “você/suas” ou “tu/tuas”.
  rationale: “O senhor” é corrente, respeitoso e claro no português de ampla legibilidade brasileira; também reduz a possível confusão entre o rei e o sujeito divino implícito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação conserva o paralelismo e a imagem da cabeça de ouro, ao mesmo tempo que evita construções excessivamente literais. Os marcadores [a] e [b] aparecem no texto principal.
