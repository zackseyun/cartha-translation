source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת שְׁתַּ֗יִם לְ/מַלְכוּת֙ נְבֻֽכַדְנֶצַּ֔ר חָלַ֥ם נְבֻֽכַדְנֶצַּ֖ר חֲלֹמ֑וֹת וַ/תִּתְפָּ֣עֶם רוּח֔/וֹ וּ/שְׁנָת֖/וֹ נִהְיְתָ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/001.yaml
  text: In the second year of Nebuchadnezzar’s reign[a], Nebuchadnezzar dreamed dreams, and his spirit was troubled[c][b], and his sleep left him.
translation:
  language: pt
  text: No segundo ano do reinado de Nabucodonosor, Nabucodonosor teve sonhos[a]. Seu espírito ficou perturbado[b], e o sono o abandonou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sonhou sonhos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Seu espírito ficou agitado”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “seu sono se foi dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁתַּיִם
  choice: No segundo ano
  rationale: A conjunção inicial funciona como ligação narrativa e não precisa ser reproduzida por “e”; a expressão temporal é vertida de modo natural em português.
- source_word: לְמַלְכוּת
  choice: do reinado de
  rationale: Neste contexto, מַלְכוּת indica o período em que o rei governava, não o território do reino.
- source_word: נְבֻכַדְנֶצַּר
  choice: Nabucodonosor
  rationale: Forma tradicional, reconhecível e amplamente usada em português.
- source_word: חָלַם ... חֲלֹמוֹת
  choice: teve sonhos
  rationale: A construção cognata hebraica significa literalmente “sonhou sonhos”. “Teve sonhos” comunica seu sentido com naturalidade em português, enquanto a nota preserva a forma enfática do original.
- source_word: וַתִּתְפָּעֶם רוּחוֹ
  choice: Seu espírito ficou perturbado
  rationale: Preserva o substantivo רוּחַ (“espírito”) e expressa a forte inquietação interior indicada pelo verbo, sem reduzi-la apenas à mente.
- source_word: וּשְׁנָתוֹ נִהְיְתָה עָלָיו
  choice: o sono o abandonou
  rationale: Expressão idiomática que indica que ele perdeu o sono; esta formulação é clara e digna em português.
