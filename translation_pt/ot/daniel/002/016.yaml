  text: So Daniel went in and asked the king to give him time, so that he might make the interpretation known to the king.
translation:
  language: pt
  text: Então Daniel entrou e pediu ao rei que lhe desse um prazo, para que pudesse dar a conhecer ao rei a interpretação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: entrou
  rationale: Neste contexto, o verbo aramaico indica que Daniel entrou na presença do rei; a tradução explicita naturalmente o movimento implícito.
- source_word: זְמָן
  choice: algum tempo
  rationale: Expressa de modo idiomático o pedido de um prazo, sem especificar uma duração ausente no texto.
- source_word: פִשְׁרָא
  choice: a interpretação
  rationale: É o termo aramaico usual em Daniel para a explicação ou interpretação do sonho.
- source_word: לְהַחֲוָיָה
  choice: revelar
  rationale: O infinitivo causativo significa fazer saber, mostrar ou declarar; 'revelar' é natural no contexto de comunicar a interpretação ao rei.
theological_decisions:
- issue: Relação entre o prazo solicitado e a comunicação da interpretação
  choice: para que pudesse revelar
  alternative: e ele revelaria
  rationale: A construção aramaica permite expressar finalidade; esta formulação preserva a relação intencional sem afirmar além do texto como Daniel obteria a interpretação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a repetição de 'rei', presente no aramaico, e evita acrescentar que Daniel já conhecia a interpretação.
