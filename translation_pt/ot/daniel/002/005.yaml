  source_fidelity: 'A tradução preserva adequadamente os elementos centrais do aramaico: o rei se dirige aos caldeus, exige que lhe deem a conhecer o sonho e sua interpretação e ameaça tanto as pessoas quanto suas casas. «Serão esquartejados» é uma forma portuguesa natural e fiel à imagem de desmembramento em הַדָּמִין תִּתְעַבְדוּן. A expressão sobre a palavra real deve, porém, conservar melhor sua função de pronunciamento definitivo e ter a nota alternativa ancorada nela, não na punição.'
  naturalness: O texto é fluente, de registro narrativo digno e acessível. «Minha palavra está firmada» é compreensível, mas pouco idiomática no português moderno; «Minha palavra é definitiva» comunica com maior naturalidade a decisão fixada do rei. «Montes de entulho» é mais corrente do que «montões de entulho» neste contexto.
  terminology: «Caldeus», «sonho», «interpretação» e «esquartejados» são escolhas apropriadas. «Caldeus» preserva a designação do texto, sem reduzi-la a uma função profissional. A nota deve apresentar a alternativa de que a palavra/ordem já saiu do rei sem sugerir que essa seja a única leitura.
