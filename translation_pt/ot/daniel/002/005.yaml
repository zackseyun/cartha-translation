revisions:
- from: 'O rei respondeu aos caldeus: “Minha palavra está firmada: se vocês não me revelarem o sonho e a sua interpretação, serão esquartejados[a], e as suas casas serão transformadas em montões de entulho.”'
  to: 'O rei respondeu aos caldeus: “Minha palavra é definitiva[a]: se vocês não me revelarem o sonho e a sua interpretação, serão esquartejados, e as suas casas serão transformadas em montes de entulho.”'
  rationale: A revisão desloca a âncora da nota para a expressão aramaica efetivamente discutida e torna sua tradução principal mais natural em português. Mantém-se «serão esquartejados», pois transmite de modo claro e fiel a ameaça de desmembramento, e ajusta-se «montões» para «montes de entulho» por maior idiomaticidade, sem alterar o sentido de casas convertidas em lugar de ruína e desprezo.
