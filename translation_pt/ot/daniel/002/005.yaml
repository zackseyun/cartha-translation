base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/005.yaml
  text: 'The king answered and said to the Chaldeans[a], “The word from me is firm: if you do not make known to me the dream and its interpretation, you will be made into limbs[b], and your houses will be made a refuse heap.”'
translation:
  language: pt
  text: 'O rei respondeu aos caldeus: “Minha palavra é definitiva[a]: se vocês não me revelarem o sonho e a sua interpretação, serão esquartejados, e as suas casas serão transformadas em montes de entulho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A palavra já saiu de mim” ou “A ordem já foi dada por mim”. O aramaico admite uma leitura em que a palavra real já foi pronunciada, em vez de enfatizar que ela é definitiva.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְכָּא
  choice: o rei
  rationale: Equivalente direto e natural do título real no registro narrativo.
- source_word: לכשדיא
  choice: aos caldeus
  rationale: Preserva a designação aramaica, que no contexto também identifica uma classe de sábios da corte, sem substituí-la por uma interpretação funcional.
- source_word: מִלְּתָא מִנִּי אַזְדָּא
  choice: Minha palavra está firmada
  rationale: Comunica de modo natural que o pronunciamento do rei está fixado, mantendo em nota a leitura alternativa possível do aramaico.
- source_word: תְהוֹדְעוּנַּנִי
  choice: me revelarem
  rationale: Expressa a força causativa de tornar conhecido, com formulação corrente em português no contexto de um sonho oculto.
- source_word: חֶלְמָא וּפִשְׁרֵהּ
  choice: o sonho e a sua interpretação
  rationale: Mantém a distinção explícita entre o conteúdo do sonho e sua explicação.
- source_word: הַדָּמִין תִּתְעַבְדוּן
  choice: serão esquartejados
  rationale: O substantivo indica membros ou partes do corpo e, com o verbo passivo, ameaça desmembramento. 'Esquartejados' transmite essa imagem com clareza e naturalidade em português.
- source_word: וּבָתֵּיכוֹן נְוָלִי יִתְּשָׂמוּן
  choice: as suas casas serão transformadas em montões de entulho
  rationale: Expressa a conversão das casas em lugares arruinados e desprezíveis; 'entulho' evita uma formulação arcaica e preserva o sentido de devastação.
theological_decisions:
- issue: Sentido de מִנִּי אַזְדָּא
  choice: O pronunciamento do rei está firmado.
  alternative: A palavra saiu de mim.
  rationale: A forma aramaica admite discussão lexical. O contexto favorece a ideia de uma decisão real fixa, mas a alternativa é preservada em nota para não eliminar a ambiguidade.
- issue: Imagem punitiva de הַדָּמִין
  choice: serão esquartejados
  alternative: serão feitos em membros/pedaços
  rationale: A ameaça é de desmembramento. A escolha preserva o conteúdo corporal da expressão em português natural, sem suavizar a violência do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição semítica 'respondeu e disse' foi vertida naturalmente por 'respondeu'. A forma plural 'vocês' torna explícito o destinatário coletivo.
