base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/047.yaml
  text: The king answered Daniel and said[a], “Truly, your God is God of gods and Lord of kings, and a revealer of mysteries, because you were able to reveal this mystery.”
translation:
  language: pt
  text: 'O rei respondeu a Daniel e disse: “Verdadeiramente, o Deus de vocês é Deus dos deuses, Senhor dos reis e revelador de mistérios[a], pois você foi capaz de revelar este mistério.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segredos”. O termo aramaico pode indicar coisas ocultas em geral, mas “mistérios” preserva melhor o vocabulário recorrente de Daniel sobre aquilo que Deus revela.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: respondeu ...
  rationale: Fórmula narrativa aramaica. Em português, “respondeu a Daniel” comunica naturalmente a fórmula completa sem o pouco idiomático “respondeu e disse”.
- source_word: מִן קְשֹׁט
  choice: Verdadeiramente
  rationale: Expressão enfática que significa “em verdade” ou “certamente”; a escolha preserva a solenidade e continua compreensível.
- source_word: אֱלָהֲכוֹן
  choice: o Deus de vocês
  rationale: O sufixo aramaico é plural e pode abranger Daniel e seus companheiros. “De vocês” preserva esse número, enquanto a referência imediata continua clara pelo contexto.
- source_word: אֱלָהּ אֱלָהִין
  choice: Deus dos deuses
  rationale: A cadeia construta expressa supremacia. A formulação conserva a força elevada sem acrescentar uma afirmação explícita de exclusividade que o texto não faz.
- source_word: וּמָרֵא מַלְכִין
  choice: Senhor dos reis
  rationale: מָרֵא significa senhor ou soberano; “Senhor” mantém o registro régio e teológico.
- source_word: וְגָלֵה רָזִין
  choice: e revelador de mistérios
  rationale: O particípio descreve uma ação característica de Deus. “Revelador” preserva de modo conciso a forma predicativa.
- source_word: רָזִין
  choice: mistérios
  rationale: Em Daniel, רָז designa realidades ocultas tornadas conhecidas por revelação divina; “mistérios” preserva esse vocabulário temático.
- source_word: דִּי יְכֵלְתָּ
  choice: pois você foi capaz
  rationale: A conjunção apresenta a razão da declaração do rei. “Pois” explicita naturalmente a relação causal.
- source_word: לְמִגְלֵא רָזָה דְנָה
  choice: de revelar este mistério
  rationale: Mantém a repetição lexical de גלה e identifica o sonho e sua interpretação como o mistério em questão.
theological_decisions:
- issue: Se a declaração de Nabucodonosor implica conversão monoteísta plena ou apenas reconhecimento da supremacia do Deus de Daniel
  choice: Conservar a elevada confissão “Deus dos deuses, Senhor dos reis” sem acrescentar exclusividade religiosa.
  alternative: Parafrasear como “somente o Deus de vocês é Deus” ou enfraquecer os títulos como simples linguagem politeísta.
  rationale: O aramaico reconhece enfaticamente a supremacia do Deus de Daniel, mas não declara que o rei tenha abandonado todos os outros deuses. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preferiu-se “respondeu a Daniel” à reprodução rígida “respondeu e disse”. O plural “de vocês” reflete o sufixo aramaico, provavelmente referente a Daniel e seus companheiros.
