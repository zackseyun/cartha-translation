base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/019.yaml
  text: Then the mystery was revealed to Daniel in a vision of the night[c][b][a]. Then Daniel blessed the God of heaven.
translation:
  language: pt
  text: Então o mistério foi revelado a Daniel numa visão noturna.[a][b] Então Daniel louvou o Deus do céu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «numa visão da noite».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o segredo foi revelado».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «bendisse o Deus do céu».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marcador aramaico de sequência narrativa. A repetição nas duas orações reproduz a estrutura enfática do texto-fonte e é natural em português.
- source_word: בְּחֶזְוָא דִי לֵילְיָא
  choice: numa visão noturna
  rationale: Expressa com naturalidade a visão recebida durante a noite; a alternativa mais formal «numa visão da noite» é preservada em nota.
- source_word: רָזָה
  choice: o mistério
  rationale: Em Daniel, designa uma realidade oculta — aqui, o sonho do rei e seu significado — que se torna conhecida por revelação divina. «Mistério» mantém essa nuance; «segredo» continua sendo alternativa lexical válida.
- source_word: גֲלִי
  choice: foi revelado
  rationale: A forma passiva preserva a apresentação do conteúdo oculto como algo dado a conhecer, e não descoberto por esforço humano.
- source_word: בָּרִךְ
  choice: bendisse
  rationale: Representa diretamente o verbo aramaico e conserva o idioma bíblico segundo o qual uma pessoa bendiz a Deus; «louvou» é possível pelo sentido contextual.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: o Deus do céu
  rationale: Forma corrente e digna do título bíblico em português, mantendo o sentido determinado da expressão aramaica.
- source_word: דָנִיֵּאל
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
theological_decisions:
- issue: Linguagem de revelação para a realidade oculta
  choice: o mistério foi revelado
  alternative: o segredo foi revelado
  rationale: A formulação conserva a iniciativa implícita da revelação divina sem acrescentar um agente que o texto não nomeia explicitamente.
- issue: Resposta humana a Deus em בָּרִךְ
  choice: Daniel bendisse o Deus do céu
  alternative: Daniel louvou o Deus do céu
  rationale: «Bendisse» preserva mais de perto o valor lexical e a tensão do idioma bíblico, enquanto «louvou» explicita seu sentido funcional no contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. Mantém a repetição de «Então» e o verbo bíblico «bendisse», recorrendo a notas para alternativas naturais e semanticamente legítimas.
