  text: עָנֵ֣ה וְ/אָמַ֗ר לְ/אַרְיוֹךְ֙ שַׁלִּיטָ֣/א דִֽי מַלְכָּ֔/א עַל מָ֥ה דָתָ֛/א מְהַחְצְפָ֖ה מִן קֳדָ֣ם מַלְכָּ֑/א אֱדַ֣יִן מִלְּתָ֔/א הוֹדַ֥ע אַרְי֖וֹךְ לְ/דָנִיֵּֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/015.yaml
  text: He answered and said to Arioch[a], the king’s commander[b], “Why is the decree so harsh from before the king?” Then Arioch made the matter known to Daniel.
translation:
  language: pt
  text: 'Ele respondeu a Arioque, comandante do rei: “Por que o decreto da parte do rei é tão severo[a]?” Então Arioque explicou a questão a Daniel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tão urgente”, “tão rigoroso” ou “tão precipitado”. O termo aramaico pode reunir as ideias de severidade e pressa na execução do decreto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה וְאָמַר
  choice: Ele respondeu
  rationale: A dupla fórmula semítica significa literalmente “respondeu e disse”, mas em português corrente “respondeu” transmite naturalmente sua função narrativa sem redundância artificial.
- source_word: שַׁלִּיטָא דִי מַלְכָּא
  choice: comandante do rei
  rationale: No contexto, Arioque é o oficial régio encarregado da execução dos sábios; “comandante” comunica sua autoridade executiva ou militar sem recorrer a linguagem arcaica.
- source_word: עַל מָה
  choice: Por que
  rationale: Equivalente interrogativo direto e idiomático em português.
- source_word: דָתָא
  choice: o decreto
  rationale: No contexto da corte, refere-se a uma ordem régia formal, não a uma lei em sentido geral.
- source_word: מְהַחְצְפָה
  choice: tão severo
  rationale: O termo raro expressa severidade impetuosa ou urgência rigorosa. “Severo” se ajusta ao decreto de execução, enquanto a possível ideia de precipitação é preservada em nota.
- source_word: מִן קֳדָם מַלְכָּא
  choice: da parte do rei
  rationale: Traduz de modo natural o idioma aramaico literalmente equivalente a “de diante do rei”, indicando procedência e autoridade régias.
- source_word: אֱדַיִן
  choice: Então
  rationale: Conector narrativo temporal adequado ao contexto.
- source_word: מִלְּתָא הוֹדַע
  choice: explicou a questão
  rationale: A construção causativa indica que Arioque fez Daniel conhecer o assunto; “explicou a questão” é clara e natural, sem especificar mais do que o texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão idiomática aramaica “de diante do rei” foi vertida como “da parte do rei”; a fórmula narrativa redundante foi suavizada para português natural. O marcador [a] aparece junto ao termo anotado.
