  text: אַ֣נְתְּה מַלְכָּ֔/א מֶ֖לֶךְ מַלְכַיָּ֑/א דִּ֚י אֱלָ֣הּ שְׁמַיָּ֔/א מַלְכוּתָ֥/א חִסְנָ֛/א וְ/תָקְפָּ֥/א וִֽ/יקָרָ֖/א יְהַב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/037.yaml
  text: You[a], O king, are the king of kings, to whom the God of heaven has given the kingdom, the might, the power, and the glory.
translation:
  language: pt
  text: Tu, ó rei, és o rei dos reis, a quem o Deus dos céus deu o reino, a força, o poder e a glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a honra” ou “o esplendor”.
    reason: Alternativas lexicais legítimas para וִיקָרָא, termo que pode denotar glória, honra ou esplendor.
lexical_decisions:
- source_word: אַ֣נְתְּה מַלְכָּ֔א
  choice: Tu, ó rei
  rationale: O pronome independente de segunda pessoa e o substantivo em função de tratamento são expressos de modo direto, solene e natural em português.
- source_word: מֶ֖לֶךְ מַלְכַיָּ֑א
  choice: o rei dos reis
  rationale: Preserva a construção superlativa e o título régio tradicional sem reduzi-lo a simplesmente “grande rei”.
- source_word: דִּי
  choice: a quem
  rationale: Introduz a oração relativa ligada ao destinatário dos dons concedidos por Deus.
- source_word: אֱלָ֣הּ שְׁמַיָּ֔א
  choice: o Deus dos céus
  rationale: Reproduz o título aramaico em português bíblico corrente, mantendo o plural de “céus” presente na expressão-fonte.
- source_word: מַלְכוּתָ֥א
  choice: o reino
  rationale: Abrange tanto a realeza quanto o domínio régio no contexto, sem restringir indevidamente o sentido.
- source_word: חִסְנָ֛א
  choice: a força
  rationale: Expressa vigor ou potência e conserva a proximidade semântica com o termo seguinte.
- source_word: תָקְפָּ֥א
  choice: o poder
  rationale: Distingue este termo de “força” sem eliminar a sobreposição existente no aramaico.
- source_word: וִֽיקָרָ֖א
  choice: a glória
  rationale: Comunica a majestade, a honra e o esplendor ligados à condição régia em registro elevado e corrente.
- source_word: יְהַב לָֽךְ
  choice: deu
  rationale: O perfeito aramaico apresenta a concessão como ato realizado; o destinatário é indicado pelo relativo “a quem”.
theological_decisions:
- issue: Origem da autoridade e da grandeza régias de Nabucodonosor
  choice: O reino, a força, o poder e a glória são apresentados como dádivas do Deus dos céus.
  alternative: Entender que o rei possui essas coisas inerentemente ou apenas por conquista e posição.
  rationale: A oração atribui explicitamente a Deus o ato de conceder todos esses elementos, sem desenvolver além disso uma doutrina sobre autoridade política.
translation_notes:
  register: Português moderno, claro e solene, com tratamento régio em segunda pessoa. A formulação mantém a cadeia de quatro dádivas e a tensão semântica entre “força” e “poder”.
