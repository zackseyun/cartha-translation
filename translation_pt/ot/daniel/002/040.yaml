  text: וּ/מַלְכוּ֙ רביעיה תֶּהֱוֵ֥א תַקִּיפָ֖ה כְּ/פַרְזְלָ֑/א כָּ/ל קֳבֵ֗ל דִּ֤י פַרְזְלָ/א֙ מְהַדֵּ֤ק וְ/חָשֵׁל֙ כֹּ֔לָּ/א וּֽ/כְ/פַרְזְלָ֛/א דִּֽי מְרָעַ֥ע כָּל אִלֵּ֖ין תַּדִּ֥ק וְ/תֵרֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/040.yaml
  text: And the fourth kingdom will be strong like iron[a], because iron crushes and shatters everything; and like iron that breaks all these things[b], it will crush and shatter.
translation:
  language: pt
  text: E o quarto reino será forte como o ferro[a], pois o ferro esmaga e despedaça tudo; e, assim como o ferro que quebra todas essas coisas[b], esse reino esmagará e despedaçará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E um quarto reino». O aramaico não tem artigo definido, embora, pelo contexto, esse reino seja claramente o quarto da sequência.'
    reason: lexical_alternative
  - marker: b
    text: A expressão «todas essas coisas» provavelmente se refere aos reinos anteriores representados na visão da estátua.
    reason: cross_reference
lexical_decisions:
- source_word: וּמַלְכוּ רביעיה
  choice: E o quarto reino
  rationale: מַלְכוּ significa «reino», e רביעיה o identifica como «quarto». Embora o aramaico não tenha artigo definido, o contexto apresenta esse reino como o quarto da sequência.
- source_word: תֶּהֱוֵא
  choice: será
  rationale: O imperfeito aramaico indica aqui um estado futuro; «será» é direto e natural em português atual.
- source_word: תַקִּיפָה
  choice: forte
  rationale: O adjetivo expressa força ou poder; «forte» preserva de modo simples a comparação com o ferro.
- source_word: כְּפַרְזְלָא
  choice: como o ferro
  rationale: A partícula comparativa כְ introduz uma comparação explícita; «como o ferro» é a formulação idiomática em português.
- source_word: כָּל קֳבֵל דִּי
  choice: pois
  rationale: A expressão introduz a razão da comparação. «Pois» mantém com clareza a relação causal e o tom digno da passagem.
- source_word: מְהַדֵּק
  choice: esmaga
  rationale: O verbo comunica a ação de triturar ou reduzir pela força; «esmaga» conserva a imagem destrutiva.
- source_word: וְחָשֵׁל כֹּלָּא
  choice: e despedaça tudo
  rationale: A expressão intensifica a ação do ferro. «Despedaça» comunica fragmentação violenta e distingue o verbo de «esmaga».
- source_word: וּכְפַרְזְלָא דִּי מְרָעַע
  choice: e, assim como o ferro que quebra
  rationale: מְרָעַע descreve quebrar ou destroçar. «Quebra» preserva a comparação e evita repetir imediatamente os mesmos verbos.
- source_word: כָּל אִלֵּין
  choice: todas essas coisas
  rationale: A expressão demonstrativa provavelmente retoma os reinos ou materiais anteriores da estátua, mas a tradução mantém o referente formalmente aberto.
- source_word: תַּדִּק וְתֵרֹעַ
  choice: esse reino esmagará e despedaçará
  rationale: Os dois verbos descrevem ações destrutivas relacionadas. A explicitação de «esse reino» evita uma referência pronominal pouco natural em português, e «esmagará e despedaçará» preserva o paralelismo enfático.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade no Brasil e compreensão internacional. Mantém a repetição enfática e a violência das imagens do aramaico sem identificar historicamente o quarto reino nem restringir de modo indevido o referente de «todas essas coisas».
