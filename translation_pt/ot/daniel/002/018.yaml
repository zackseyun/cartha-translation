  text: וְ/רַחֲמִ֗ין לְ/מִבְעֵא֙ מִן קֳדָם֙ אֱלָ֣הּ שְׁמַיָּ֔/א עַל רָזָ֖/ה דְּנָ֑ה דִּ֣י לָ֤א יְהֹֽבְדוּן֙ דָּנִיֵּ֣אל וְ/חַבְר֔וֹ/הִי עִם שְׁאָ֖ר חַכִּימֵ֥י בָבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/018.yaml
  text: and to seek mercy from before the God of heaven concerning this mystery[a], so that Daniel and his companions might not perish with the rest of the wise men of Babylon.
translation:
  language: pt
  text: e que pedissem misericórdia ao Deus do céu a respeito desse mistério[a], para que Daniel e seus companheiros não perecessem com os demais sábios da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segredo”. O termo aramaico se refere a algo oculto que precisa ser revelado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַחֲמִין לְמִבְעֵא
  choice: e que pedissem misericórdia
  rationale: O plural aramaico רַחֲמִין tem sentido coletivo de compaixão ou misericórdia. “Pedissem misericórdia” expressa naturalmente a súplica indicada pelo infinitivo לְמִבְעֵא e sua ligação de propósito com o contexto anterior.
- source_word: מִן קֳדָם אֱלָהּ שְׁמַיָּא
  choice: ao Deus do céu
  rationale: A locução מִן קֳדָם significa literalmente “de diante de”, mas, neste contexto de súplica, o português idiomático pede “ao”. “Deus do céu” preserva o título aramaico tradicional.
- source_word: עַל רָזָה דְּנָה
  choice: a respeito desse mistério
  rationale: רָז designa algo oculto que necessita de revelação divina. “Mistério” preserva essa dimensão, enquanto “desse” retoma naturalmente, em português, o assunto já apresentado no contexto.
- source_word: דִּי לָא יְהֹבְדוּן
  choice: para que ... não perecessem
  rationale: A construção expressa propósito ou resultado pretendido. O Haphil de אבד pode indicar fazer perecer ou destruir; “não perecessem” é natural e mantém o foco no destino ameaçado sem explicitar além do texto o agente da execução.
- source_word: וְחַבְרוֹהִי
  choice: e seus companheiros
  rationale: O termo identifica os associados próximos de Daniel na narrativa; “companheiros” é claro, digno e adequado ao contexto.
- source_word: עִם שְׁאָר חַכִּימֵי בָבֶל
  choice: com os demais sábios da Babilônia
  rationale: A formulação comunica que Daniel e seus companheiros estavam incluídos no grupo maior ameaçado. “Demais sábios” é mais fluente que uma reprodução literal de “o restante dos sábios”.
theological_decisions:
- issue: Sentido de רָז na narrativa da corte
  choice: mistério
  alternative: segredo
  rationale: O capítulo apresenta o assunto como inacessível à sabedoria humana e dependente da revelação de Deus. “Mistério” mantém essa força narrativa e teológica sem lhe impor um sentido técnico posterior; a alternativa lexical é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A expressão aramaica literalmente espacial “de diante de” foi vertida segundo sua função idiomática de dirigir uma súplica a Deus.
