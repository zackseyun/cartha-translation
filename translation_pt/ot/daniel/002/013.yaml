base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/013.yaml
  text: So the decree went out[a], and the wise men were being killed[b]; and they sought Daniel and his companions to kill them.
translation:
  language: pt
  text: Assim, o decreto foi promulgado[a], e os sábios estavam sendo mortos[b]; e procuraram Daniel e seus companheiros para matá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “saiu”. A expressão se refere à promulgação oficial do decreto real.
    reason: lexical_alternative
  - marker: b
    text: Ou “estavam sendo executados”. A forma aramaica sugere que as mortes já estavam em andamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָתָא
  choice: decreto
  rationale: Designa uma decisão legal ou ordem oficial no contexto da corte; “decreto” é claro e natural em português.
- source_word: נֶפְקַת
  choice: foi promulgado
  rationale: A expressão aramaica significa literalmente “saiu”, mas, referindo-se a um decreto real, comunica sua emissão e divulgação oficial.
- source_word: חַכִּימַיָּא
  choice: os sábios
  rationale: É a designação recorrente dos conselheiros eruditos da corte em Daniel e preserva o termo tradicional sem restringir indevidamente o grupo.
- source_word: מִתְקַטְּלִין
  choice: estavam sendo mortos
  rationale: O particípio indica ação em andamento, sugerindo que as execuções já haviam começado.
- source_word: וּבְעוֹ
  choice: procuraram
  rationale: No contexto, o verbo expressa a busca oficial por Daniel e seus companheiros; “procuraram” é direto e idiomático.
- source_word: חַבְרוֹהִי
  choice: seus companheiros
  rationale: Refere-se aos homens associados a Daniel e mantém a relação ampla indicada pelo aramaico.
- source_word: לְהִתְקְטָלָה
  choice: para matá-los
  rationale: O infinitivo expressa a finalidade da busca; o pronome plural explicita naturalmente que Daniel e os companheiros estavam incluídos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Foi promulgado” evita o pouco idiomático “saiu” no corpo do texto, enquanto a nota preserva a imagem literal; a construção progressiva mantém o aspecto da forma aramaica.
