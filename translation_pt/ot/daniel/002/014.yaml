  text: בֵּ/אדַ֣יִן דָּנִיֵּ֗אל הֲתִיב֙ עֵטָ֣א וּ/טְעֵ֔ם לְ/אַרְי֕וֹךְ רַב טַבָּחַיָּ֖/א דִּ֣י מַלְכָּ֑/א דִּ֚י נְפַ֣ק לְ/קַטָּלָ֔ה לְ/חַכִּימֵ֖י בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/014.yaml
  text: Then Daniel answered Arioch[a], the chief of the king’s executioners, with counsel and discretion—the one who had gone out to kill the wise men of Babylon.
translation:
  language: pt
  text: Então Daniel respondeu com conselho e discernimento a Arioque[a], chefe dos executores do rei, que havia saído para matar os sábios da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «comandante da guarda do rei». O título aramaico significa literalmente «chefe dos que abatem» e, no contexto da corte, pode designar os executores ou a guarda real.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador narrativo aramaico que introduz o acontecimento seguinte; «Então» preserva com naturalidade a sequência.
- source_word: הֲתִיב
  choice: respondeu
  rationale: O verbo introduz uma resposta verbal; «respondeu» mantém o sentido e o tom narrativo.
- source_word: עֵטָא וּטְעֵם
  choice: com conselho e discrição
  rationale: Preserva os dois substantivos do aramaico sem acrescentar um adjetivo ausente. «Discrição» comunica discernimento e tato no modo de responder.
- source_word: לְאַרְיוֹךְ
  choice: a Arioque
  rationale: Transliteração portuguesa corrente do nome próprio aramaico.
- source_word: רַב טַבָּחַיָּא דִּי מַלְכָּא
  choice: chefe dos executores do rei
  rationale: O título significa literalmente o chefe dos que abatem; no contexto imediato, trata-se dos oficiais incumbidos de executar a ordem de morte. A alternativa ligada à guarda real é preservada em nota.
- source_word: דִּי נְפַק
  choice: que havia saído
  rationale: O mais-que-perfeito composto esclarece que Arioque já tinha saído para cumprir a ordem antes de Daniel falar com ele.
- source_word: לְקַטָּלָה
  choice: para matar
  rationale: Expressa diretamente a finalidade da saída de Arioque, sem suavizar a severidade do decreto.
- source_word: לְחַכִּימֵי בָּבֶל
  choice: os sábios da Babilônia
  rationale: Designação regular dos sábios da corte no livro de Daniel, vertida de maneira direta e natural.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada para ligar com clareza «com conselho e discrição» ao modo como Daniel respondeu, sem perder a relativa referente a Arioque.
