  text: וְ/דָנִיֵּאל֙ בְּעָ֣א מִן מַלְכָּ֔/א וּ/מַנִּ֗י עַ֤ל עֲבִֽידְתָּ/א֙ דִּ֚י מְדִינַ֣ת בָּבֶ֔ל לְ/שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ וְ/דָנִיֵּ֖אל בִּ/תְרַ֥ע מַלְכָּֽ/א־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/049.yaml
  text: And Daniel requested of the king[a], and he appointed Shadrach, Meshach, and Abed-nego over the administration of the province of Babylon. But Daniel remained at the king’s court.
translation:
  language: pt
  text: Daniel fez um pedido ao rei, e este nomeou Sadraque, Mesaque e Abede-Nego para administrar a província da Babilônia. Daniel, porém, permaneceu na corte do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no portão do rei”. A expressão provavelmente se refere ao lugar de Daniel na corte ou na administração real.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָא מִן מַלְכָּא
  choice: fez um pedido ao rei
  rationale: O verbo aramaico significa pedir ou solicitar. A expressão é natural em português, adequada ao contexto da corte e preserva o caráter formal sem sugerir necessariamente uma petição jurídica.
- source_word: וּמַנִּי
  choice: e este nomeou
  rationale: O verbo indica colocar ou nomear para uma função. O sujeito não está expresso, mas o contexto aponta para o rei; “este” torna o referente claro sem repetir desnecessariamente o título.
- source_word: עַל עֲבִידְתָּא דִּי מְדִינַת בָּבֶל
  choice: para administrar a província da Babilônia
  rationale: A construção literalmente os põe sobre o trabalho, serviço ou administração da província. A forma verbal comunica com clareza a responsabilidade administrativa oficial em português atual.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Sadraque, Mesaque e Abede-Nego
  rationale: Emprega as formas tradicionalmente reconhecíveis dos nomes em português, conservando a distinção entre os três personagens.
- source_word: וְדָנִיֵּאל
  choice: Daniel, porém
  rationale: A conjunção introduz aqui um contraste entre a função provincial atribuída aos três companheiros e a permanência de Daniel na esfera real.
- source_word: בִּתְרַע מַלְכָּא
  choice: na corte do rei
  rationale: A expressão significa literalmente “no portão do rei”, mas, no contexto administrativo do antigo Oriente Próximo, o portão representa o lugar de acesso, julgamento e serviço oficial do rei. “Na corte do rei” comunica o sentido provável, enquanto a forma literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe explicita o rei como sujeito contextual da nomeação e preserva em nota a imagem concreta e institucional do “portão do rei”.
