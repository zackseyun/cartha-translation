  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶצְבְּעָת֙ רַגְלַיָּ֔/א מנ/הון פַּרְזֶ֖ל ו/מנ/הון חֲסַ֑ף מִן קְצָ֤ת מַלְכוּתָ/א֙ תֶּהֱוֵ֣ה תַקִּיפָ֔ה וּ/מִנַּ֖/הּ תֶּהֱוֵ֥ה תְבִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/042.yaml
  text: And as the toes of the feet were partly iron and partly clay[a], so part of the kingdom will be strong[b], and part of it will be brittle.
translation:
  language: pt
  text: E, como os dedos dos pés eram em parte de ferro e em parte de barro[a], assim também parte do reino será forte, e parte será quebradiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cerâmica» ou «barro cozido».
    reason: lexical_alternative
  - marker: b
    text: Ou «frágil» ou «sujeita a se quebrar».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְבְּעָת רַגְלַיָּא
  choice: os dedos dos pés
  rationale: Preserva a expressão aramaica e a ligação formal com a imagem dos pés da estátua, embora em português «dedos dos pés» já seja uma unidade lexical natural.
- source_word: מנ/הון ... ו/מנ/הון
  choice: em parte ... e em parte
  rationale: A repetição significa literalmente «deles... e deles», mas aqui expressa a composição mista; «em parte... e em parte» comunica isso com naturalidade.
- source_word: פַּרְזֶל
  choice: ferro
  rationale: Equivalente direto e corrente, coerente com os materiais da estátua.
- source_word: חֲסַף
  choice: barro
  rationale: O termo designa material cerâmico ou argiloso. «Barro» forma um contraste natural com «ferro» e se ajusta à imagem do capítulo, sem excluir o sentido de cerâmica.
- source_word: מִן קְצָת
  choice: parte
  rationale: 'Mantém o sentido parcial ou distributivo: uma porção do reino possui determinada qualidade.'
- source_word: מַלְכוּתָא
  choice: o reino
  rationale: É o equivalente padrão e contextualmente claro para o domínio representado na visão.
- source_word: תֶּהֱוֵה
  choice: será
  rationale: O verbo prediz o estado futuro do reino; o futuro simples é claro e natural em português.
- source_word: תַקִּיפָה
  choice: forte
  rationale: Expressa diretamente força ou firmeza e mantém o contraste com a fragilidade do barro.
- source_word: וּ/מִנַּהּ
  choice: e parte
  rationale: O sufixo feminino retoma «reino». Em português, a elipse de «do reino» evita repetição sem perder a referência distributiva.
- source_word: תְבִירָה
  choice: quebradiça
  rationale: Comunica a propensão a se quebrar, adequada ao contraste entre ferro e barro, sem afirmar necessariamente que essa parte já esteja quebrada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «assim também» explicita naturalmente a correlação comparativa do aramaico, e «quebradiça» preserva a metáfora material sem resolver sua interpretação histórica.
