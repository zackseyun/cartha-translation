base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/012.yaml
  text: Because of this[a], the king became furious and very enraged[b], and he commanded that all the wise men of Babylon be destroyed.
translation:
  language: pt
  text: Por causa disso[a], o rei ficou furioso e muito irado, e ordenou[b] que todos os sábios da Babilônia fossem mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por essa razão” ou “Portanto”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo significa literalmente “disse”, mas aqui introduz um decreto real; por isso, foi traduzido como “ordenou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Por causa disso
  rationale: Expressa de modo natural a locução causal aramaica, mantendo explícita a ligação com o acontecimento anterior.
- source_word: מַלְכָּא
  choice: o rei
  rationale: A forma enfática definida é representada diretamente pelo artigo definido em português.
- source_word: בְּנַס
  choice: ficou furioso
  rationale: O verbo indica que o rei se tornou intensamente irado; a formulação preserva a progressão narrativa.
- source_word: וּקְצַף שַׂגִּיא
  choice: e muito irado
  rationale: Mantém tanto o segundo termo de ira quanto o intensificador שַׂגִּיא, preservando a acumulação enfática do aramaico.
- source_word: וַאֲמַר
  choice: e ordenou
  rationale: Embora o verbo signifique formalmente “disse”, neste contexto introduz um decreto real, e “ordenou” comunica sua força pragmática.
- source_word: לְהוֹבָדָה
  choice: que ... fossem mortos
  rationale: O infinitivo causativo de אבד indica fazer perecer; aplicado a pessoas num decreto real, “fossem mortos” comunica com clareza o resultado pretendido.
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: todos os sábios da Babilônia
  rationale: Reproduz a totalidade expressa por לְכֹל e a designação contextual dos sábios da corte babilônica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de dois termos de ira foi preservada para refletir a ênfase do aramaico, enquanto “fossem mortos” evita a estranheza de aplicar “destruídos” diretamente a pessoas.
