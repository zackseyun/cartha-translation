base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/046.yaml
  text: Then King Nebuchadnezzar fell on his face and paid homage to Daniel[c][b][a], and he commanded that an offering and incense be offered to him.
translation:
  language: pt
  text: Então o rei Nabucodonosor caiu com o rosto em terra e prestou homenagem a Daniel[a], e ordenou que lhe oferecessem[b] uma oferta e incenso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adorou Daniel” ou “prostrou-se diante de Daniel”. O verbo aramaico pode indicar prostração ou homenagem reverente; “prestou homenagem” evita definir o gesto necessariamente como adoração divina.
    reason: alternative_reading
  - marker: b
    text: O verbo traduzido por “oferecessem” indica mais especificamente derramar, como se faz com uma libação.
    reason: lexical_alternative
  - marker: c
    text: Ou “aromas agradáveis” ou “odores suaves”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a progressão da narrativa de modo natural e claro em português moderno.
- source_word: מַלְכָּא נְבוּכַדְנֶצַּר
  choice: o rei Nabucodonosor
  rationale: Aposição idiomática do título e do nome em português.
- source_word: נְפַל עַל אַנְפּוֹהִי
  choice: caiu com o rosto em terra
  rationale: Preserva a imagem física vívida da expressão aramaica, com formulação natural em português.
- source_word: סְגִד
  choice: prestou homenagem
  rationale: Expressa prostração e reverência sem determinar que se tratava necessariamente de adoração divina.
- source_word: מִנְחָה
  choice: uma oferta
  rationale: Mantém a amplitude do termo, que pode indicar presente ou oferta de caráter cultual, sem especificar indevidamente sua natureza.
- source_word: נִיחֹחִין
  choice: incenso
  rationale: No contexto de uma apresentação cultual, é uma formulação portuguesa concisa e natural; a nota preserva o sentido mais literal de aromas agradáveis.
- source_word: אֲמַר לְנַסָּכָה לֵהּ
  choice: ordenou que lhe oferecessem
  rationale: Comunica naturalmente o valor de ordem da construção e abrange os dois objetos; a nota registra que o verbo se refere mais especificamente ao ato de derramar uma libação.
theological_decisions:
- issue: Se סְגִד dirigido a Daniel deve ser traduzido como adoração divina ou como reverência/prostração
  choice: prestou homenagem
  alternative: adorou; prostrou-se diante de
  rationale: A escolha preserva a reverência extrema demonstrada pelo rei sem afirmar além do aramaico que Daniel estivesse sendo reconhecido como divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição em “oferecessem uma oferta” foi mantida por clareza lexical e para não transformar o objeto em uma libação específica; as notas preservam as nuances do aramaico.
