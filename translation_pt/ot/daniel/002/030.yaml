reference: Daniel 2:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנָ֗ה לָ֤א בְ/חָכְמָה֙ דִּֽי אִיתַ֥י בִּ/י֙ מִן כָּל חַיַּיָּ֔/א רָזָ֥/א דְנָ֖ה גֱּלִ֣י לִ֑/י לָהֵ֗ן עַל דִּבְרַת֙ דִּ֤י פִשְׁרָ/א֙ לְ/מַלְכָּ֣/א יְהוֹדְע֔וּן וְ/רַעְיוֹנֵ֥י לִבְבָ֖/ךְ תִּנְדַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/030.yaml
  text: But as for me[a], this mystery has been revealed to me not because of wisdom that is in me more than in all the living, but in order that the interpretation may be made known to the king[b], and that you may know the thoughts of your heart.
translation:
  language: pt
  text: Quanto a mim, este mistério[a] me foi revelado, não porque haja em mim mais sabedoria do que em todos os outros seres humanos, mas para que a interpretação seja dada a conhecer ao rei e para que você conheça os pensamentos do seu coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este segredo”. O termo aramaico pode indicar algo oculto, mas em Daniel frequentemente designa um mistério revelado por Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “os pensamentos da sua mente”. Literalmente, “os pensamentos do seu coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָה
  choice: Quanto a mim
  rationale: O pronome independente introduz Daniel como tópico em contraste com a ação reveladora de Deus; a formulação é natural e preserva a ênfase.
- source_word: לָא בְחָכְמָה דִּי אִיתַי בִּי מִן כָּל חַיַּיָּא
  choice: não porque haja em mim mais sabedoria do que em todos os outros seres humanos
  rationale: A preposição בְּ indica aqui fundamento ou causa, e מִן marca comparação. “Seres humanos” explicita o referente contextual de “os viventes” sem sugerir todos os organismos vivos.
- source_word: רָזָא דְנָה
  choice: este mistério
  rationale: Em Daniel, רָז designa uma realidade oculta que é revelada por Deus; “mistério” conserva melhor essa dimensão revelatória do que apenas “segredo”.
- source_word: גֱּלִי לִי
  choice: me foi revelado
  rationale: A forma apresenta Daniel como destinatário, não como fonte, da revelação. O pretérito perfeito composto seria possível, mas o perfeito simples é mais natural neste contexto em português.
- source_word: לָהֵן עַל דִּבְרַת דִּי
  choice: mas para que
  rationale: 'A combinação introduz contraste seguido de finalidade: a revelação não decorre da superioridade de Daniel, mas visa tornar conhecida a interpretação.'
- source_word: פִשְׁרָא
  choice: a interpretação
  rationale: É o termo técnico recorrente em Daniel para a interpretação de sonho ou mistério.
- source_word: לְמַלְכָּא יְהוֹדְעוּן
  choice: seja dada a conhecer ao rei
  rationale: O verbo plural funciona naturalmente como construção impessoal ou de sentido passivo no contexto. A formulação evita introduzir um agente não identificado.
- source_word: וְרַעְיוֹנֵי לִבְבָךְ תִּנְדַּע
  choice: e para que você conheça os pensamentos do seu coração
  rationale: “Coração” preserva a imagem antropológica aramaica, que inclui pensamento e intenção; a repetição de “para que” esclarece em português que ambas as orações exprimem finalidade.
theological_decisions:
- issue: A negação de superioridade pessoal por parte de Daniel
  choice: A revelação não ocorreu porque Daniel tivesse mais sabedoria do que os demais seres humanos.
  alternative: Entender a frase apenas como uma negação geral de que a sabedoria de Daniel tenha sido a causa, sem conservar a comparação explícita.
  rationale: A expressão comparativa מִן כָּל חַיַּיָּא é explícita e deve ser mantida, preservando a humildade de Daniel e a origem divina da revelação.
- issue: A linguagem antropológica de “coração”
  choice: Manter “coração” no texto principal.
  alternative: Traduzir como “mente”.
  rationale: No uso bíblico, o coração abrange reflexão, intenção e vida interior. A opção mantém a imagem da fonte sem impor uma categoria psicológica moderna mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para a referência singular ao rei, evita a possível ambiguidade biológica de “todos os viventes” e conserva “coração” por fidelidade à imagem da fonte.
