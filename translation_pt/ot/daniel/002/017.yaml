  text: אֱדַ֥יִן דָּֽנִיֵּ֖אל לְ/בַיְתֵ֣/הּ אֲזַ֑ל וְ֠/לַ/חֲנַנְיָה מִֽישָׁאֵ֧ל וַ/עֲזַרְיָ֛ה חַבְר֖וֹ/הִי מִלְּתָ֥/א הוֹדַֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/017.yaml
  text: Then Daniel went to his house and made the matter known to Hananiah[a], Mishael, and Azariah, his companions.
translation:
  language: pt
  text: Então Daniel foi para sua casa e deu a conhecer o assunto a Hananias, Misael e Azarias, seus companheiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus amigos”. O termo aramaico pode indicar associados ou pessoas estreitamente ligadas a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: O advérbio aramaico marca a sequência narrativa; “Então” é natural em português e preserva a progressão temporal.
- source_word: לְבַיְתֵהּ
  choice: para sua casa
  rationale: A preposição com “casa” e o sufixo de terceira pessoa masculina indicam direção. A formulação é clara e próxima da estrutura do aramaico.
- source_word: אֲזַל
  choice: foi
  rationale: É o equivalente comum e contextualmente adequado do verbo aramaico que expressa deslocamento.
- source_word: חַבְרוֹהִי
  choice: seus companheiros
  rationale: O termo designa pessoas ligadas a Daniel como associados próximos. “Companheiros” preserva esse sentido relacional sem pressupor mais do que o texto afirma.
- source_word: מִלְּתָא
  choice: o assunto
  rationale: Neste contexto, o substantivo se refere à questão anteriormente narrada. “Assunto” é idiomático e mantém a amplitude semântica do termo.
- source_word: הוֹדַע
  choice: deu a conhecer
  rationale: A forma causativa do verbo “conhecer/saber” é refletida de modo transparente por “deu a conhecer”, mantendo um registro digno e compreensível.
- source_word: וְלַחֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: a Hananias, Misael e Azarias
  rationale: Os nomes seguem formas portuguesas bíblicas amplamente reconhecíveis, e a preposição “a” rege naturalmente toda a enumeração.
