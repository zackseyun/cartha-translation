  text: וַ/יֹּ֧אמֶר לָ/הֶ֛ם הַ/מֶּ֖לֶךְ חֲל֣וֹם חָלָ֑מְתִּי וַ/תִּפָּ֣עֶם רוּחִ֔/י לָ/דַ֖עַת אֶֽת הַ/חֲלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/003.yaml
  text: And the king said to them[a], “I have dreamed a dream[c][b], and my spirit is troubled to know the dream.”
translation:
  language: pt
  text: 'E o rei lhes disse: “Tive um sonho[a], e meu espírito está perturbado[b] porque quero saber o sonho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Sonhei um sonho”. O hebraico emprega duas formas da mesma raiz, uma construção que pode dar ênfase à afirmação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meu espírito ficou perturbado” ou “meu espírito está agitado”. Aqui, “meu espírito” também pode ser entendido de modo mais idiomático como “eu” ou “minha mente”, mas o texto preserva o termo hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol narrativo de אמר dá continuidade ao relato; “E ... disse” preserva esse fluxo sem impor uma sequência temporal mais específica.
- source_word: לָהֶם
  choice: lhes
  rationale: Equivalente português natural da preposição com sufixo pronominal, indicando os destinatários das palavras do rei.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Substantivo definido que, no contexto, se refere a Nabucodonosor.
- source_word: חֲלוֹם חָלָמְתִּי
  choice: Tive um sonho
  rationale: A construção cognata hebraica significa literalmente “sonhei um sonho”. A forma escolhida é corrente e clara em português; a nota conserva a forma e a possível ênfase do original.
- source_word: וַתִּפָּעֶם
  choice: está perturbado
  rationale: O verbo expressa agitação ou perturbação interior. O presente comunica naturalmente o estado ainda vigente do rei no discurso direto, embora a forma hebraica também possa ser vertida no passado.
- source_word: רוּחִי
  choice: meu espírito
  rationale: Preserva רוּחַ como referência ao ser interior do rei, sem reduzi-lo interpretativamente a “mente” ou simplesmente “eu”.
- source_word: לָדַעַת
  choice: para saber
  rationale: Traduz diretamente o infinitivo de ידע e mantém aberta a possibilidade contextual de saber o conteúdo do sonho ou compreender o que ele significa.
- source_word: אֶת־הַחֲלוֹם
  choice: o sonho
  rationale: Mantém a repetição do substantivo presente no hebraico, em vez de substituí-lo por um pronome.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tive um sonho” evita a artificialidade de “sonhei um sonho” no corpo do texto, enquanto a nota registra a construção cognata. A formulação “para saber o sonho” preserva a estranheza e a amplitude do hebraico, sem decidir se o rei quer recordar o conteúdo, conhecê-lo plenamente ou compreender seu significado.
