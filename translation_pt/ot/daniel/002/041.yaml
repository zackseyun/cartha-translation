  text: וְ/דִֽי חֲזַ֜יְתָה רַגְלַיָּ֣/א וְ/אֶצְבְּעָתָ֗/א מנ/הון חֲסַ֤ף דִּֽי פֶחָר֙ ו/מנ/הון פַּרְזֶ֔ל מַלְכ֤וּ פְלִיגָה֙ תֶּהֱוֵ֔ה וּ/מִן נִצְבְּתָ֥/א דִ֥י פַרְזְלָ֖/א לֶֽהֱוֵא בַ֑/הּ כָּ/ל קֳבֵל֙ דִּ֣י חֲזַ֔יְתָה פַּ֨רְזְלָ֔/א מְעָרַ֖ב בַּ/חֲסַ֥ף טִינָֽ/א־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/041.yaml
  text: And as you saw the feet and toes[a], partly of potter’s clay and partly of iron, the kingdom will be divided; yet some of the firmness of iron will be in it[b], just as you saw the iron mixed with clay mud.
translation:
  language: pt
  text: E, como você viu os pés e os dedos, em parte de barro de oleiro e em parte de ferro, o reino será dividido; contudo, haverá nele algo da firmeza do ferro[a], assim como você viu o ferro misturado com barro lamacento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “algo da força do ferro”. O termo aramaico pode indicar firmeza, força ou estabilidade.
    reason: lexical_alternative
  - marker: b
    text: A expressão aramaica combina termos para barro ou argila e para lama, ressaltando a natureza da mistura.
    reason: lexical_clarification
lexical_decisions:
- source_word: רַגְלַיָּא וְאֶצְבְּעָתָא
  choice: os pés e os dedos
  rationale: No contexto da estátua, רַגְלַיָּא designa os pés, especialmente por estar coordenado com os dedos; a expressão portuguesa é natural e precisa.
- source_word: מנ/הון ... ו/מנ/הון
  choice: em parte ... e em parte
  rationale: Reproduz de modo idiomático a distribuição dos materiais entre os pés e os dedos.
- source_word: חֲסַף דִּי פֶחָר
  choice: barro de oleiro
  rationale: Preserva tanto o material quanto a referência ao oleiro, em português corrente.
- source_word: פַּרְזֶל
  choice: ferro
  rationale: Equivalente direto e tradicional do metal retratado na visão.
- source_word: מַלְכוּ פְלִיגָה
  choice: o reino será dividido
  rationale: O reino é definido pelo contexto, e פְלִיגָה indica seu estado dividido.
- source_word: וּמִן נִצְבְּתָא דִי פַרְזְלָא לֶהֱוֵא בַהּ
  choice: contudo, haverá nele algo da firmeza do ferro
  rationale: נִצְבְּתָא pode expressar firmeza, força ou estabilidade. “Algo da firmeza” conserva a ideia partitiva de וּמִן sem explicar além do texto.
- source_word: כָּל־קֳבֵל דִּי
  choice: assim como
  rationale: Neste contexto interpretativo, introduz a correspondência entre a visão e seu significado.
- source_word: מְעָרַב בַּחֲסַף טִינָא
  choice: misturado com barro lamacento
  rationale: “Misturado” expressa o particípio, e “barro lamacento” conserva de forma natural a combinação dos termos referentes a barro/argila e lama.
theological_decisions: []
