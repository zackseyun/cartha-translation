  text: כָּ/ל קֳבֵ֣ל דִּֽי חֲזַ֡יְתָ דִּ֣י מִ/טּוּרָ/א֩ אִתְגְּזֶ֨רֶת אֶ֜בֶן דִּי לָ֣א בִ/ידַ֗יִן וְ֠/הַדֶּקֶת פַּרְזְלָ֨/א נְחָשָׁ֤/א חַסְפָּ/א֙ כַּסְפָּ֣/א וְ/דַהֲבָ֔/א אֱלָ֥הּ רַב֙ הוֹדַ֣ע לְ/מַלְכָּ֔/א מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/יַצִּ֥יב חֶלְמָ֖/א וּ/מְהֵימַ֥ן פִּשְׁרֵֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/045.yaml
  text: Just as you saw that a stone was cut from the mountain not by hands[a], and that it crushed the iron, the bronze, the clay, the silver, and the gold, the great God has made known to the king what will happen after this. The dream is certain, and its interpretation is trustworthy.
translation:
  language: pt
  text: Assim como você viu que uma pedra foi cortada do monte, não por mãos[a], e que ela esmagou o ferro, o bronze, o barro, a prata e o ouro, o grande Deus deu a conhecer ao rei o que acontecerá depois disso. O sonho é certo, e sua interpretação é digna de confiança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sem mãos» ou «não com mãos». O idioma aramaico indica que a pedra não foi cortada por ação humana.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: Assim como
  rationale: Introduz a explicação em correspondência com o detalhe visto no sonho; preserva melhor a força comparativa e explicativa do que uma formulação puramente causal.
- source_word: מִטּוּרָא
  choice: do monte
  rationale: A forma determinada indica um monte definido; «do monte» é natural em português e conserva a imagem espacial.
- source_word: אִתְגְּזֶרֶת אֶבֶן
  choice: uma pedra foi cortada
  rationale: Mantém a construção passiva e a pedra como sujeito, sem acrescentar a ideia mais específica de extração de uma pedreira.
- source_word: דִּי לָא בִידַיִן
  choice: não por mãos humanas
  rationale: Expressa com clareza a ausência de ação humana, sem identificar explicitamente o agente não humano; a nota registra a forma mais literal do idioma aramaico.
- source_word: וְהַדֶּקֶת
  choice: e que ela esmagou
  rationale: O verbo indica esmagar ou reduzir a pedaços; «esmagou» é vívido, preciso e corrente.
- source_word: פַּרְזְלָא נְחָשָׁא חַסְפָּא כַּסְפָּא וְדַהֲבָא
  choice: o ferro, o bronze, o barro, a prata e o ouro
  rationale: Segue a ordem do texto aramaico e emprega os termos usuais para os materiais da estátua.
- source_word: אֱלָהּ רַב
  choice: o grande Deus
  rationale: Tradução direta do substantivo com adjetivo, preservando a afirmação de grandeza sem ampliar seu sentido.
- source_word: הוֹדַע לְמַלְכָּא
  choice: deu a conhecer ao rei
  rationale: Reproduz o valor causativo de tornar conhecido ou informar, em registro digno e compreensível.
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: o que acontecerá depois disso
  rationale: Comunica com naturalidade a orientação futura da oração.
- source_word: וְיַצִּיב חֶלְמָא
  choice: O sonho é certo
  rationale: «Certo» transmite que o sonho está firmado e é seguro, sem linguagem arcaica.
- source_word: וּמְהֵימַן פִּשְׁרֵהּ
  choice: e sua interpretação é digna de confiança
  rationale: Preserva o sentido de confiabilidade de מְהֵימַן e distingue essa afirmação da certeza atribuída ao sonho.
theological_decisions:
- issue: Agência indicada pela expressão «não por mãos»
  choice: não por mãos humanas
  alternative: não por mãos; sem o auxílio de mãos
  rationale: A expressão esclarece que o corte não resultou de ação humana, mas não explicita quem o realizou. Assim, preserva-se a implicação de ação divina sem inseri-la diretamente no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha a progressão explicativa do aramaico, e a terminologia evita tanto arcaísmos quanto explicações doutrinárias inseridas no texto.
