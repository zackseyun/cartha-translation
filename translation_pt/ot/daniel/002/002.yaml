base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/002.yaml
  text: Then the king ordered the magicians[a], the enchanters, the sorcerers, and the Chaldeans to tell the king his dreams[b]. So they came and stood before the king.
translation:
  language: pt
  text: Então o rei mandou chamar[a] os magos, os encantadores, os feiticeiros e os caldeus[b], para que contassem ao rei os sonhos do rei. Eles vieram e se puseram diante do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente que o rei “disse para chamar”, expressão idiomática que indica que ele deu ordem para convocá-los.
    reason: lexical_alternative
  - marker: b
    text: “Caldeus” pode designar o povo caldeu ou, neste contexto, uma classe de sábios da corte babilônica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִקְרֹא
  choice: mandou chamar
  rationale: A construção diz literalmente que o rei “disse para chamar”, mas funciona como uma ordem para convocar. “Mandou chamar” é natural em português e preserva tanto a autoridade real quanto a ideia de convocação.
- source_word: חַרְטֻמִּים
  choice: magos
  rationale: O termo designa especialistas da corte ligados à magia e à adivinhação. “Magos” é uma tradução tradicional, clara e distinta dos demais grupos enumerados.
- source_word: אַשָּׁפִים
  choice: encantadores
  rationale: A função exata desse grupo é incerta. “Encantadores” conserva o sentido amplo de especialistas em práticas ocultas sem impor a identificação mais específica e discutível de “astrólogos”.
- source_word: מְכַשְּׁפִים
  choice: feiticeiros
  rationale: O termo deriva da raiz associada à prática de feitiçaria. “Feiticeiros” é corrente, compreensível e mantém a conotação de prática oculta.
- source_word: כַּשְׂדִּים
  choice: caldeus
  rationale: A forma transliterada preserva a possibilidade de o termo indicar tanto o povo caldeu quanto, neste contexto, uma classe de sábios da corte babilônica; a nota explicita a ambiguidade.
- source_word: לְהַגִּיד
  choice: contassem
  rationale: O verbo significa declarar, informar ou tornar conhecido. “Contassem” combina naturalmente com “sonhos” e mantém a ideia de comunicá-los ao rei.
- source_word: חֲלֹמֹתָיו
  choice: os seus sonhos
  rationale: O sufixo masculino singular remete ao rei. A tradução conserva o plural do texto hebraico e sua referência possessiva.
- source_word: וַיָּבֹאוּ
  choice: vieram
  rationale: Equivalente direto e natural da forma narrativa hebraica.
- source_word: וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: ficaram de pé diante do rei
  rationale: A formulação reproduz concretamente a ação descrita e também comunica a apresentação formal dos convocados perante o soberano.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A enumeração dos especialistas foi mantida sem fundir categorias cuja distinção exata é incerta. O plural “sonhos” e a ambiguidade contextual de “caldeus” foram preservados.
