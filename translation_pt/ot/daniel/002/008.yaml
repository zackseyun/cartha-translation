  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר מִן יַצִּיב֙ יָדַ֣ע אֲנָ֔ה דִּ֥י עִדָּנָ֖/א אַנְתּ֣וּן זָבְנִ֑ין כָּ/ל קֳבֵל֙ דִּ֣י חֲזֵית֔וֹן דִּ֥י אַזְדָּ֖א מִנִּ֥/י מִלְּתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/008.yaml
  text: The king answered and said[a], “I know for certain that you are trying to gain time, because you have seen that the matter has gone from me.”
translation:
  language: pt
  text: 'O rei respondeu e disse: “Sei com certeza que vocês estão tentando ganhar tempo, porque viram que a questão se afastou de mim.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra saiu de mim”, “a questão me escapou” ou, possivelmente, “a ordem é firme da minha parte”. A formulação aramaica é compacta e tem sido entendida de mais de uma maneira neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן יַצִּיב
  choice: com certeza
  rationale: Expressa de modo natural e enfático o idiomatismo aramaico que indica certeza.
- source_word: יָדַע אֲנָה
  choice: Sei
  rationale: Equivalente direto e corrente do verbo cognitivo na primeira pessoa.
- source_word: עִדָּנָא אַנְתּוּן זָבְנִין
  choice: vocês estão tentando ganhar tempo
  rationale: Comunica em português atual o sentido contextual da expressão literalmente ligada a comprar tempo.
- source_word: כָּל־קֳבֵל דִּי
  choice: porque
  rationale: Introduz com clareza a razão da acusação do rei.
- source_word: חֲזֵיתוֹן
  choice: perceberam
  rationale: Neste contexto, o verbo de ver tem o sentido natural de reconhecer ou perceber uma situação.
- source_word: אַזְדָּא מִנִּי מִלְּתָא
  choice: a questão já não está em minhas mãos
  rationale: Reproduz em português natural a ideia de que a questão saiu do domínio ou da disponibilidade do rei, sem definir se se trata do sonho, da palavra ou da ordem; a nota registra as leituras mais formais.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: O rei respondeu
  rationale: A fórmula narrativa com dois verbos é representada de forma idiomática por um único verbo em português, sem perda informativa.
theological_decisions:
- issue: Ambiguidade de מִלְּתָא / אַזְדָּא מִנִּי
  choice: a questão já não está em minhas mãos
  alternative: a palavra saiu de mim; a questão me escapou; minha ordem é irrevogável
  rationale: 'O aramaico compacto admite interpretações diferentes: o rei pode estar dizendo que o assunto ou sonho lhe escapou, ou que sua palavra ou ordem está estabelecida. O texto principal evita identificar especificamente o referente, e a nota preserva as alternativas.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícita a segunda pessoa plural. A formulação principal é natural, enquanto a nota conserva a ambiguidade decisiva do aramaico.
