  text: אֱדַ֤יִן אַרְיוֹךְ֙ בְּ/הִתְבְּהָלָ֔ה הַנְעֵ֥ל לְ/דָנִיֵּ֖אל קֳדָ֣ם מַלְכָּ֑/א וְ/כֵ֣ן אֲמַר לֵ֗/הּ דִּֽי הַשְׁכַּ֤חַת גְּבַר֙ מִן בְּנֵ֤י גָֽלוּתָ/א֙ דִּ֣י יְה֔וּד דִּ֥י פִשְׁרָ֖/א לְ/מַלְכָּ֥/א יְהוֹדַֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/025.yaml
  text: Then Arioch hurriedly brought Daniel before the king and said to him[a], “I have found a man from among the exiles of Judah who will make the interpretation known to the king.”
translation:
  language: pt
  text: 'Então Arioque levou Daniel às pressas à presença do rei e lhe disse: “Encontrei entre os exilados de Judá[a] um homem que dará a conhecer ao rei a interpretação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos judeus” ou “judeu”. O aramaico identifica Daniel como pertencente ao povo de Judá que estava no exílio.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marcador discursivo que introduz o acontecimento seguinte; “Então” preserva com naturalidade a sequência narrativa.
- source_word: בְּהִתְבְּהָלָה
  choice: às pressas
  rationale: A expressão comunica pressa e urgência. “Às pressas” é corrente em português e se ajusta ao contexto imediato.
- source_word: הַנְעֵל
  choice: levou
  rationale: O verbo causativo significa fazer subir, conduzir ou levar. “Levou” expressa a ação sem especificar em excesso o movimento.
- source_word: קֳדָם מַלְכָּא
  choice: à presença do rei
  rationale: Fórmula de corte que indica comparecimento diante do soberano; esta forma é clara e digna em português atual.
- source_word: וְכֵן אֲמַר לֵהּ
  choice: e lhe disse
  rationale: Introduz o discurso direto. A partícula equivalente a “assim” não precisa ser explicitada em português para que a construção soe natural.
- source_word: הַשְׁכַּחַת
  choice: Encontrei
  rationale: O perfeito aramaico relata uma descoberta concluída e relevante no momento da fala; o pretérito perfeito é a formulação natural em português.
- source_word: גְּבַר
  choice: um homem
  rationale: O substantivo designa especificamente um homem, sentido preservado na tradução.
- source_word: מִן בְּנֵי גָלוּתָא
  choice: entre os exilados
  rationale: Expressão idiomática referente aos integrantes da comunidade deportada; evita o literalismo “filhos do exílio”.
- source_word: דִּי יְהוּד
  choice: de Judá
  rationale: Mantém de modo transparente a ligação histórica e étnica dos exilados com Judá, sem impor uma formulação posterior.
- source_word: פִשְׁרָא
  choice: a interpretação
  rationale: Termo característico de Daniel para a interpretação de sonhos e mistérios; convém preservar essa recorrência terminológica.
- source_word: יְהוֹדַע
  choice: dará a conhecer
  rationale: O causativo significa fazer saber ou dar conhecimento. A formulação conserva o sentido e o registro cortês sem acrescentar a ideia mais forte de revelação.
theological_decisions:
- issue: Designação histórica e étnica דִּי יְהוּד
  choice: de Judá
  alternative: dos judeus; judeu
  rationale: No contexto do exílio, a expressão identifica o povo ou a origem ligada a Judá. “De Judá” permanece próxima do aramaico, enquanto a nota registra traduções igualmente possíveis.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para fluência sem perder a estrutura narrativa nem o tom de uma comunicação feita na corte.
