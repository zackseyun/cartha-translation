revisions:
- from: 'Mas há um Deus nos céus[a] que revela mistérios e fez saber ao rei Nabucodonosor o que acontecerá nos últimos dias[b]. O seu sonho e as visões em sua mente[c], enquanto estava deitado em sua cama, foram estes:'
