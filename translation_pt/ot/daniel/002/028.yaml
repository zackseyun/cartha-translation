base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/028.yaml
  text: 'But there is a God in heaven who reveals mysteries[a], and he has made known to King Nebuchadnezzar what will happen in the latter days. Your dream, and the visions of your head as you lay on your bed[c][b], were these:'
translation:
  language: pt
  text: 'Mas há um Deus nos céus[a] que revela mistérios e fez saber ao rei Nabucodonosor o que acontecerá nos últimos dias[b]. O sonho que tiveste e as visões que tiveste em tua mente[c], enquanto estavas deitado em tua cama, foram estes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “há Deus nos céus” ou “há o Deus nos céus”. Em aramaico, a expressão é formalmente indefinida, embora no contexto se refira claramente ao Deus verdadeiro.
    reason: alternative_reading
  - marker: b
    text: A expressão também pode ser traduzida como “nos dias futuros” ou “no fim dos dias”. Ela pode indicar um período futuro culminante sem especificar um sistema escatológico particular.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “as visões da tua cabeça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Mas
  rationale: Partícula adversativa que contrasta a revelação divina com a incapacidade dos sábios babilônios mencionada no contexto anterior.
- source_word: אִיתַי אֱלָהּ בִּשְׁמַיָּא
  choice: há um Deus nos céus
  rationale: Mantém a construção existencial e a forma gramaticalmente indefinida do aramaico. A inicial maiúscula deixa claro, no contexto, que Daniel se refere ao verdadeiro Deus.
- source_word: גָּלֵא רָזִין
  choice: que revela mistérios
  rationale: O particípio caracteriza a ação contínua de Deus, e “mistérios” preserva o motivo de realidades ocultas desvendadas por revelação divina.
- source_word: וְהוֹדַע
  choice: e fez saber
  rationale: Expressa o sentido causativo de levar alguém a conhecer, sem apagar a distinção lexical em relação a “revela”.
- source_word: מָה דִּי לֶהֱוֵא
  choice: o que acontecerá
  rationale: Comunica em português atual a orientação futura da oração aramaica.
- source_word: בְּאַחֲרִית יוֹמַיָּא
  choice: nos últimos dias
  rationale: Conserva a força temporal e a possível dimensão escatológica da expressão sem definir um sistema interpretativo específico.
- source_word: וְחֶזְוֵי רֵאשָׁךְ
  choice: e as visões em sua mente
  rationale: Reproduz de modo compreensível o idiomatismo aramaico “visões da sua cabeça”, indicando percepções visionárias internas sem perder o substantivo “visões”.
- source_word: עַל מִשְׁכְּבָךְ
  choice: enquanto estava deitado em sua cama
  rationale: Explicita naturalmente em português a circunstância indicada pela expressão aramaica, sem acrescentar conteúdo substantivo.
theological_decisions:
- issue: Forma indefinida de אֱלָהּ em um contexto monoteísta
  choice: um Deus nos céus
  alternative: Deus nos céus; o Deus dos céus
  rationale: A redação conserva a forma indefinida do aramaico e o contraste retórico no ambiente da corte pagã. O contexto e a maiúscula identificam esse Deus como o Deus verdadeiro, sem transformar a frase em afirmação de politeísmo.
- issue: Alcance temporal de בְּאַחֲרִית יוֹמַיָּא
  choice: nos últimos dias
  alternative: nos dias futuros; no fim dos dias
  rationale: A expressão pode apontar para um período futuro culminante, mas o versículo não determina por si só um esquema escatológico particular; a nota preserva essa abertura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a indefinição de “um Deus”, conserva a tensão escatológica de “últimos dias” e torna natural o idiomatismo semítico relativo às visões da cabeça.
