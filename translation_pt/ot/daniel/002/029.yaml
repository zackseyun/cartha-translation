id: DAN.2.29
reference: Daniel 2:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א רַעְיוֹנָ/ךְ֙ עַל מִשְׁכְּבָ֣/ךְ סְלִ֔קוּ מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/גָלֵ֧א רָזַיָּ֛/א הוֹדְעָ֖/ךְ מָה דִ֥י לֶהֱוֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/029.yaml
  text: As for you[a], O king, your thoughts came up on your bed about what would happen after this, and he who reveals mysteries has made known to you what would happen.
translation:
  language: pt
  text: Quanto a você, ó rei, em sua cama lhe vieram pensamentos sobre o que aconteceria depois disso; e aquele que revela os mistérios[a] lhe deu a conhecer o que aconteceria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Revelador dos mistérios”.'
    reason: O particípio aramaico também pode ser entendido como uma expressão de caráter titular.
lexical_decisions:
- source_word: אַנְתְּה
  choice: Quanto a você
  rationale: O pronome independente é enfático e introduz o rei como tópico; “Quanto a você” preserva essa ênfase em português natural.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: O substantivo funciona como vocativo. A forma “ó rei” mantém o tratamento direto e o registro cortesão.
- source_word: רַעְיוֹנָךְ ... סְלִקוּ
  choice: lhe vieram pensamentos
  rationale: A expressão aramaica diz literalmente que os pensamentos do rei “subiram” ou “surgiram”. Esta formulação conserva a ideia de pensamentos que lhe ocorreram sem soar artificial.
- source_word: עַל מִשְׁכְּבָךְ
  choice: em sua cama
  rationale: Expressa de modo claro e natural o local ou a circunstância em que os pensamentos surgiram.
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: sobre o que aconteceria depois disso
  rationale: Preserva tanto o conteúdo dos pensamentos quanto sua orientação para acontecimentos posteriores.
- source_word: גָלֵא רָזַיָּא
  choice: aquele que revela os mistérios
  rationale: Traduz descritivamente o particípio aramaico, sem acrescentar o nome de Deus nem impor que a expressão seja entendida formalmente como título.
- source_word: הוֹדְעָךְ
  choice: lhe deu a conhecer
  rationale: Representa o sentido causativo de “fazer saber” em linguagem dignificada e corrente.
- source_word: מָה דִי לֶהֱוֵא
  choice: o que aconteceria
  rationale: Mantém a repetição do texto e o sentido futuro visto a partir do momento narrado.
theological_decisions:
- issue: Caráter descritivo ou titular de גָלֵא רָזַיָּא
  choice: aquele que revela os mistérios
  alternative: o Revelador dos mistérios
  rationale: O particípio pode funcionar como descrição ou como expressão semelhante a um título. A tradução principal conserva a forma descritiva e evita introduzir uma titularização mais explícita do que o aramaico exige; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com vocativo cortesão. A ordem foi levemente ajustada para fluência, sem eliminar a ênfase inicial no rei nem a repetição final do conteúdo revelado.
