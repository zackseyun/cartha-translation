  source_fidelity: 'A tradução representa com precisão a estrutura e o sentido do aramaico: Daniel responde perante o rei; o mistério é o assunto da indagação real; e nenhuma das quatro classes de especialistas é capaz de o dar a conhecer ao rei. “A respeito do qual o rei pergunta” expressa naturalmente em português a relação do particípio aramaico com “mistério”, sem alterar o sentido.'
