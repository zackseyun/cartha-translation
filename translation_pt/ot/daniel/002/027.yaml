  text: עָנֵ֧ה דָנִיֵּ֛אל קֳדָ֥ם מַלְכָּ֖/א וְ/אָמַ֑ר רָזָ/ה֙ דִּֽי מַלְכָּ֣/א שָׁאֵ֔ל לָ֧א חַכִּימִ֣ין אָֽשְׁפִ֗ין חַרְטֻמִּין֙ גָּזְרִ֔ין יָכְלִ֖ין לְ/הַֽחֲוָיָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/027.yaml
  text: Daniel answered before the king and said[a], “The mystery that the king asks, no wise men, enchanters, magicians[b], or diviners are able to make known to the king.”
translation:
  language: pt
  text: 'Daniel respondeu diante do rei e disse: “O mistério[a] a respeito do qual o rei pergunta, nem sábios, nem encantadores[b], nem magos, nem adivinhos são capazes de dar a conhecer ao rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “segredo”. Aqui, o termo aramaico foi traduzido por “mistério” para preservar o tema recorrente do capítulo: algo oculto que somente Deus pode revelar.'
    reason: lexical_alternative
  - marker: b
    text: “Encantadores” traduz um termo técnico para uma classe de especialistas babilônicos; “astrólogos” é uma alternativa tradicional.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה
  choice: respondeu
  rationale: Verbo narrativo aramaico comum que introduz uma resposta; preserva o tom formal do diálogo.
- source_word: קֳדָם
  choice: diante de
  rationale: Expressa a ideia de estar perante ou na presença de alguém e mantém o cenário da corte.
- source_word: רָזָה
  choice: mistério
  rationale: Em Daniel, designa algo oculto que necessita de revelação divina; mantém o tema recorrente do capítulo, sem excluir a alternativa 'segredo'.
- source_word: דִּי
  choice: a respeito do qual
  rationale: Introduz a oração relativa ligada a 'mistério'; esta formulação evita a construção pouco natural 'perguntar um mistério' em português.
- source_word: שָׁאֵל
  choice: pergunta
  rationale: Apresenta a indagação do rei como a questão em pauta, preservando o aspecto verbal sem acrescentar uma conclusão interpretativa.
- source_word: חַכִּימִין
  choice: sábios
  rationale: Termo corrente para a classe de conselheiros instruídos da corte.
- source_word: אָשְׁפִין
  choice: encantadores
  rationale: Representa cautelosamente uma classe técnica de especialistas babilônicos em práticas ocultas, cujo sentido exato é incerto.
- source_word: חַרְטֻמִּין
  choice: magos
  rationale: Equivalente claro e tradicional para uma classe reconhecida de especialistas em artes ocultas.
- source_word: גָּזְרִין
  choice: adivinhos
  rationale: Expressa a função de praticantes que determinavam ou pronunciavam coisas ocultas, sem recorrer a um termo arcaico.
- source_word: יָכְלִין
  choice: são capazes
  rationale: Traduz diretamente a ideia de capacidade e combina com o registro elevado da fala perante o rei.
- source_word: לְהַחֲוָיָה
  choice: dar a conhecer
  rationale: Preserva o valor causativo de fazer alguém saber ou comunicar algo, sem explicitar além do texto o modo da revelação.
- source_word: לְמַלְכָּא
  choice: ao rei
  rationale: Marca claramente o destinatário da comunicação e se distingue da expressão anterior 'diante do rei'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “nem” preserva a força enumerativa da lista aramaica; “dar a conhecer” mantém o sentido de comunicação ou revelação sem resolver indevidamente a ambiguidade lexical.
