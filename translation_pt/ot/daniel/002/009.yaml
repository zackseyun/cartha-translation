  text: דִּ֣י הֵן חֶלְמָ/א֩ לָ֨א תְהֽוֹדְעֻנַּ֜/נִי חֲדָה הִ֣יא דָֽתְ/כ֗וֹן וּ/מִלָּ֨ה כִדְבָ֤ה וּ/שְׁחִיתָה֙ הזמנתון לְ/מֵאמַ֣ר קָֽדָמַ֔/י עַ֛ד דִּ֥י עִדָּנָ֖/א יִשְׁתַּנֵּ֑א לָהֵ֗ן חֶלְמָ/א֙ אֱמַ֣רוּ לִ֔/י וְֽ/אִנְדַּ֕ע דִּ֥י פִשְׁרֵ֖/הּ תְּהַחֲוֻנַּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/009.yaml
  text: But if you do not make the dream known to me[a], there is only one decree for you, for you have agreed to speak lying and corrupt words before me until the time changes. Therefore tell me the dream[c][b], and I will know that you can make its interpretation known to me.
translation:
  language: pt
  text: Mas, se vocês não me revelarem o sonho, uma só é a sentença para vocês[a], pois combinaram[b] dizer diante de mim palavras mentirosas e corruptas até que o tempo mude[c]. Portanto, contem-me o sonho, e saberei que vocês podem me revelar a sua interpretação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma só é a decisão para vocês” ou “uma só é a lei para vocês”. O termo aramaico pode indicar decreto, lei ou sentença judicial no contexto da corte real.
    reason: lexical_alternative
  - marker: b
    text: Ou “prepararam” ou “planejaram” dizer. O verbo sugere preparação deliberada; “combinaram” ressalta o caráter conjunto da acusação.
    reason: lexical_alternative
  - marker: c
    text: Ou “até que os tempos mudem”. O texto aramaico traz “tempo” no singular, preservado no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי הֵן
  choice: Mas, se
  rationale: Introduz uma condição com força enfática e mantém a ligação adversativa com o contexto anterior.
- source_word: חֶלְמָא
  choice: o sonho
  rationale: O artigo definido é adequado porque o rei se refere ao sonho específico já mencionado.
- source_word: לָא תְהוֹדְעֻנַּנִי
  choice: não me revelarem
  rationale: Expressa de modo natural o sentido causativo de tornar conhecido, sem reduzir a ideia a uma simples menção.
- source_word: חֲדָה הִיא דָתְכוֹן
  choice: uma só é a sentença para vocês
  rationale: No contexto judicial da corte, דָּת designa a decisão oficial aplicável a todos; a construção conserva a ênfase em uma única sentença.
- source_word: וּמִלָּה כִדְבָה וּשְׁחִיתָה
  choice: palavras mentirosas e perversas
  rationale: Preserva os dois qualificativos, um ligado à falsidade e outro à corrupção ou distorção moral, em português claro.
- source_word: הזמנתון
  choice: combinaram
  rationale: O verbo indica preparar ou acertar previamente; no contexto, a forma plural sugere um plano conjunto.
- source_word: לְמֵאמַר קָדָמַי
  choice: dizer diante de mim
  rationale: Mantém a referência à fala apresentada na presença do rei.
- source_word: עַד דִּי עִדָּנָא יִשְׁתַּנֵּא
  choice: até que o tempo mude
  rationale: Conserva o singular do aramaico e a acusação de que eles procuram ganhar tempo, sem explicitar uma mudança de circunstâncias que o texto apenas pode sugerir.
- source_word: לָהֵן
  choice: Portanto
  rationale: Marca claramente a conclusão que o rei tira da acusação anterior.
- source_word: אֱמַרוּ לִי
  choice: contem-me
  rationale: É a forma idiomática e direta de transmitir a ordem do rei em português.
- source_word: וְאִנְדַּע
  choice: e saberei
  rationale: Mantém o valor resultante da forma verbal sem convertê-la explicitamente em oração de finalidade.
- source_word: פִשְׁרֵהּ תְּהַחֲוֻנַּנִי
  choice: podem me revelar a sua interpretação
  rationale: פְּשַׁר é o termo recorrente para a interpretação do sonho, e o contexto torna explícita a capacidade que o rei pretende comprovar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. A formulação mantém o tom acusatório e judicial da fala do rei, preserva o singular de “tempo” e evita explicar além do que o aramaico afirma.
