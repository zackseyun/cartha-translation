base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/022.yaml
  text: He reveals deep and hidden things[a]; he knows what is in the darkness[b], and light dwells with him.
translation:
  language: pt
  text: Ele revela coisas profundas e ocultas[a]; sabe o que está nas trevas, e a luz habita com ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “secretas”, em vez de “ocultas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e a luz está com ele”. O verbo aramaico também pode ser entendido de maneira mais estática, mas “habita” preserva melhor a imagem poética.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלֵא
  choice: revela
  rationale: O particípio aramaico expressa tornar conhecido ou descobrir; “revela” é natural, digno e adequado ao contexto da revelação divina.
- source_word: עַמִּיקָתָא
  choice: coisas profundas
  rationale: Preserva a metáfora de profundidade e forma um par natural com “ocultas”.
- source_word: וּמְסַתְּרָתָא
  choice: e ocultas
  rationale: O termo deriva de uma raiz ligada a esconder ou encobrir. “Ocultas” é transparente; “secretas” permanece uma alternativa legítima.
- source_word: יָדַע מָה
  choice: sabe o que
  rationale: Reproduz de modo direto e idiomático a construção que introduz o conteúdo do conhecimento divino.
- source_word: בַחֲשׁוֹכָא
  choice: há nas trevas
  rationale: “Nas trevas” conserva a imagem concreta e o valor definido da forma aramaica; “há” completa a oração naturalmente em português.
- source_word: וּנְהִירָא
  choice: e a luz
  rationale: “Luz” mantém o contraste poético com “trevas”; o artigo é natural em português nesta construção.
- source_word: עִמֵּהּ שְׁרֵא
  choice: habita com ele
  rationale: O verbo pode indicar habitar, permanecer ou repousar. “Habita com ele” preserva a imagem pessoal e poética, sem reduzi-la a mera localização estática.
- source_word: הוּא
  choice: Ele
  rationale: O pronome inicial é enfático e retoma Deus no contexto. A posição inicial e a repetição do sujeito comunicam adequadamente essa ênfase.
theological_decisions:
- issue: Personificação da luz em relação a Deus
  choice: e a luz habita com ele
  alternative: e a luz está com ele
  rationale: O verbo aramaico שְׁרֵא sugere habitar ou permanecer, e não apenas estar em certo lugar. “Habita” conserva a personificação poética sem acrescentar uma afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém o paralelismo poético, a oposição entre trevas e luz e a imagem de a luz habitar com Deus. Os pronomes referentes a Deus seguem a capitalização comum do português, sem maiúsculas reverenciais internas.
