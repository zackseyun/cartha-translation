id: DAN.2.31
reference: Daniel 2:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א חָזֵ֤ה הֲוַ֨יְתָ֙ וַ/אֲל֨וּ צְלֵ֥ם חַד֙ שַׂגִּ֔יא צַלְמָ֨/א דִּכֵּ֥ן רַ֛ב וְ/זִיוֵ֥/הּ יַתִּ֖יר קָאֵ֣ם לְ/קָבְלָ֑/ךְ וְ/רֵוֵ֖/הּ דְּחִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/031.yaml
  text: You[a], O king, were watching, and behold, there was one great statue[b]. That statue was immense, and its splendor was extraordinary; it was standing before you[c], and its appearance was terrifying.
translation:
  language: pt
  text: Tu, ó rei, estavas olhando, e eis que havia uma grande estátua[a]. Essa estátua era imensa, e seu esplendor era extraordinário[b]; estava em pé diante de ti, e sua aparência era aterrorizante[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande imagem”. O aramaico צְלֵם pode designar uma imagem ou estátua; “estátua” foi adotado porque o contexto descreve uma grande figura em pé diante do rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu brilho era extraordinário”. A expressão ressalta a radiância ou o esplendor excepcional da figura.
    reason: lexical_alternative
  - marker: c
    text: Ou “seu aspecto era temível”. O aramaico descreve uma aparência que provoca medo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣נְתְּה מַלְכָּ֗א
  choice: Tu, ó rei
  rationale: Mantém o pronome de segunda pessoa e a força vocativa da forma aramaica, em registro elevado, mas compreensível.
- source_word: חָזֵ֤ה הֲוַ֨יְתָ֙
  choice: estavas olhando
  rationale: A construção com particípio e auxiliar indica uma ação contínua no passado; o imperfeito português preserva esse aspecto durativo.
- source_word: וַאֲלוּ
  choice: e eis que havia
  rationale: “Eis que” conserva a função apresentativa e repentina da interjeição; “havia” introduz naturalmente em português o que surge na visão.
- source_word: צְלֵ֥ם חַד֙ שַׂגִּ֔יא
  choice: uma grande estátua
  rationale: “Estátua” comunica no contexto uma figura visível de grandes proporções. “Uma” representa naturalmente חַד sem acrescentar a ênfase mais forte de “uma única”.
- source_word: צַלְמָ֨א דִּכֵּ֥ן רַ֛ב
  choice: Essa estátua era imensa
  rationale: “Essa” retoma a figura recém-apresentada, e “imensa” preserva a nova ênfase em seu tamanho sem repetir simplesmente “grande”.
- source_word: וְזִיוֵ֥הּ יַתִּ֖יר
  choice: e seu esplendor era extraordinário
  rationale: זִיו pode indicar brilho, radiância ou esplendor, enquanto יַתִּיר expressa caráter excepcional ou superior.
- source_word: קָאֵ֣ם לְקָבְלָ֑ךְ
  choice: estava em pé diante de ti
  rationale: Preserva a descrição estática e contínua da figura posicionada diante do rei.
- source_word: וְרֵוֵ֖הּ דְּחִֽיל
  choice: e sua aparência era aterrorizante
  rationale: רֵו descreve aparência ou aspecto, e דְּחִיל caracteriza aquilo que causa medo; “aterrorizante” comunica claramente esse efeito.
