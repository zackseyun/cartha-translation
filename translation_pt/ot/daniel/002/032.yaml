  text: ה֣וּא צַלְמָ֗/א רֵאשֵׁ/הּ֙ דִּֽי דְהַ֣ב טָ֔ב חֲד֥וֹ/הִי וּ/דְרָע֖וֹ/הִי דִּ֣י כְסַ֑ף מְע֥וֹ/הִי וְ/יַרְכָתֵ֖/הּ דִּ֥י נְחָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/032.yaml
  text: That image—its head was of fine gold[a], its chest and its arms of silver[c][b], its belly and its thighs of bronze.
translation:
  language: pt
  text: Aquela imagem[a] tinha a cabeça de ouro fino[b], o peito e os braços de prata, e o ventre e as coxas de bronze[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estátua”. O termo aramaico צַלְמָא pode designar uma imagem ou uma estátua.
    reason: lexical_alternative
  - marker: b
    text: Ou “ouro de alta qualidade”. Literalmente, “ouro bom”.
    reason: lexical_alternative
  - marker: c
    text: Ou “cobre”. O aramaico נְחָשׁ frequentemente se refere ao bronze neste tipo de contexto, embora a terminologia antiga dos metais possa se sobrepor.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַלְמָא
  choice: imagem
  rationale: O termo aramaico pode designar uma imagem ou estátua. “Imagem” preserva sua amplitude sem excluir a figura de forma humana descrita no contexto.
- source_word: רֵאשֵׁהּ
  choice: a cabeça
  rationale: Tradução direta do substantivo com sufixo possessivo; em português, a construção com “tinha” torna desnecessária a repetição de “sua”.
- source_word: דִּי
  choice: de
  rationale: A partícula relativa introduz o material de que cada parte era feita; a preposição “de” é a forma mais natural e concisa em português.
- source_word: דְהַב טָב
  choice: ouro fino
  rationale: Literalmente, “ouro bom”; no contexto, a expressão indica ouro de alta qualidade. “Ouro fino” comunica isso sem impor uma especificação técnica de pureza.
- source_word: חֲדוֹהִי
  choice: o peito
  rationale: O substantivo se refere à parte frontal do tronco; “peito” é claro e natural em português atual.
- source_word: דְרָעוֹהִי
  choice: os braços
  rationale: Equivalente direto e corrente do substantivo plural aramaico.
- source_word: כְסַף
  choice: prata
  rationale: Equivalente direto do termo aramaico para esse metal.
- source_word: מְעוֹהִי
  choice: o ventre
  rationale: O termo designa o ventre ou a região abdominal. “Ventre” mantém um registro digno e é amplamente compreensível.
- source_word: יַרְכָתֵהּ
  choice: as coxas
  rationale: No encadeamento anatômico, o termo aponta para a região superior das pernas ou flancos; “coxas” é preciso e evita o sentido amplo demais de “pernas”.
- source_word: נְחָשׁ
  choice: bronze
  rationale: Em listas bíblicas de metais, o termo é convencionalmente entendido como bronze, embora a terminologia antiga possa também abranger cobre.
- source_word: הוּא
  choice: aquela
  rationale: O pronome retoma a figura já apresentada no sonho; “aquela imagem” expressa naturalmente essa referência discursiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “tinha” evita uma sequência rígida de possessivos sem alterar as relações entre as partes da imagem e seus materiais.
