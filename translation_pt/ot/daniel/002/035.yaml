    rationale: A expressão pode modificar apenas a lista de materiais. «Todos ... ao mesmo tempo» torna explícito o valor adverbial de כַחֲדָה, sem acrescentar interpretação.
  - severity: medium
    issue: Âncora da nota b em «eiras»
    rationale: A nota explica כְּעוּר, traduzido por «palha», e não אִדְּרֵי קַיִט, traduzido por «eiras ... verão». A âncora deve acompanhar o termo explicado.
