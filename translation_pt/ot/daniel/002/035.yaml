base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/035.yaml
  text: Then the iron[a], the clay, the bronze, the silver, and the gold were crushed all at once and became like chaff from the summer threshing floors, and the wind carried them away so that no place was found for them[c][b]. But the stone that struck the statue became a great mountain and filled the whole earth.
translation:
  language: pt
  text: Então o ferro, o barro, o bronze, a prata e o ouro foram todos despedaçados ao mesmo tempo[a] e se tornaram como a palha[b] das eiras de verão. O vento os levou, e não se encontrou lugar algum para eles. Mas a pedra que atingiu a estátua tornou-se uma grande montanha e encheu toda a terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “juntos” ou “como uma só coisa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como o pó”. O termo aramaico descreve resíduos leves da debulha, levados pelo vento.'
    reason: lexical_alternative
  - marker: c
    text: “Terra” também pode significar “país” ou “território”; aqui, o alcance mais amplo da visão favorece “terra”.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e fiel ao aramaico.
- source_word: דָּקוּ
  choice: foram despedaçados
  rationale: Expressa a redução violenta dos materiais em fragmentos leves, coerente com a comparação seguinte.
- source_word: כַחֲדָה
  choice: todos juntos
  rationale: Preserva o sentido de simultaneidade e ação conjunta sem acrescentar necessariamente a ideia de súbito.
- source_word: חַסְפָּא
  choice: o barro
  rationale: É a designação contextual mais clara para o componente frágil da estátua.
- source_word: נְחָשָׁא
  choice: o bronze
  rationale: Embora o termo possa indicar cobre ou bronze, 'bronze' é adequado à sequência dos materiais da estátua.
- source_word: וַהֲווֹ כְּעוּר
  choice: e se tornaram como a palha
  rationale: Representa os resíduos leves da debulha que o vento facilmente dispersa.
- source_word: אִדְּרֵי קַיִט
  choice: das eiras no verão
  rationale: Formulação portuguesa natural que conserva a estação seca e o cenário de debulha.
- source_word: וּנְשָׂא הִמּוֹן רוּחָא
  choice: O vento os levou
  rationale: Mantém o vento como sujeito e comunica claramente a remoção completa dos materiais.
- source_word: וְכָל אֲתַר לָא הִשְׁתֲּכַח לְהוֹן
  choice: e não se encontrou lugar algum para eles
  rationale: Conserva a construção passiva e a ideia de desaparecimento total.
- source_word: טוּר רַב
  choice: uma grande montanha
  rationale: Equivalência direta e idiomática para a transformação da pedra.
- source_word: כָּל אַרְעָא
  choice: toda a terra
  rationale: Preserva a amplitude do horizonte da visão e a possível referência ao mundo inteiro.
theological_decisions:
- issue: Alcance de אַרְעָא
  choice: terra
  alternative: país / território
  rationale: O contexto da visão favorece alcance universal, mas a nota registra a amplitude sem impor uma interpretação doutrinária adicional.
- issue: Valor da conjunção antes de 'a pedra'
  choice: Mas a pedra
  alternative: E a pedra
  rationale: O aramaico traz uma conjunção geral; 'mas' torna explícito o contraste discursivo entre o desaparecimento da estátua e o crescimento da pedra.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos materiais segue o aramaico. Evitou-se linguagem denominacional e manteve-se em nota a ambiguidade lexical relevante.
