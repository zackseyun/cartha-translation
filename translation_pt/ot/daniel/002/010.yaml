  text: עֲנ֨וֹ כשדי/א קֳדָם מַלְכָּ/א֙ וְ/אָ֣מְרִ֔ין לָֽא אִיתַ֤י אֲנָשׁ֙ עַל יַבֶּשְׁתָּ֔/א דִּ֚י מִלַּ֣ת מַלְכָּ֔/א יוּכַ֖ל לְ/הַחֲוָיָ֑ה כָּ/ל קֳבֵ֗ל דִּ֚י כָּל מֶ֨לֶךְ֙ רַ֣ב וְ/שַׁלִּ֔יט מִלָּ֤ה כִ/דְנָה֙ לָ֣א שְׁאֵ֔ל לְ/כָל חַרְטֹּ֖ם וְ/אָשַׁ֥ף וְ/כַשְׂדָּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/010.yaml
  text: The Chaldeans answered before the king and said, “There is not a man on earth who can make known the king’s matter, because no great and powerful king has asked for a thing like this from any diviner-priest, enchanter, or Chaldean.”
translation:
  language: pt
  text: 'Os caldeus responderam diante do rei: “Não há ninguém sobre a terra capaz de revelar o que o rei exige, pois nenhum rei, por maior e mais poderoso que fosse, jamais exigiu algo assim de qualquer sacerdote-adivinho, encantador ou caldeu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כשדי
  choice: os caldeus
  rationale: Mantém a designação do grupo de sábios da corte no contexto de Daniel, sem substituir o termo histórico por uma interpretação mais estreita.
- source_word: מִלַּת מַלְכָּא
  choice: o que o rei exige
  rationale: No contexto, מִלָּה pode indicar a questão, ordem ou exigência do rei. A formulação natural em português explicita a força contextual sem especificar além do necessário se se trata do sonho e de sua interpretação.
- source_word: לְהַחֲוָיָה
  choice: revelar
  rationale: Expressa o sentido causativo de tornar conhecido ou declarar, adequado ao pedido para comunicar aquilo que o rei não revelou.
- source_word: רַב וְשַׁלִּיט
  choice: maior e mais poderoso
  rationale: Reproduz os dois qualificativos aramaicos, entendendo-os como uma comparação implícita abrangente na afirmação de que nem mesmo os maiores soberanos fizeram tal exigência.
- source_word: חַרְטֹּם
  choice: sacerdote-adivinho
  rationale: Distingue a função técnico-religiosa do termo de uma referência genérica a sábio ou mago.
- source_word: אָשַׁף
  choice: encantador
  rationale: Representa uma categoria de especialista ritual distinta do sacerdote-adivinho e do caldeu.
theological_decisions:
- issue: Alcance da incapacidade humana afirmada pelos caldeus
  choice: “Não há ninguém sobre a terra capaz”
  alternative: “Não existe ser humano na terra que possa”
  rationale: Preserva a afirmação universal do texto acerca da incapacidade humana, preparando o contraste narrativo com a revelação divina sem acrescentar uma explicação teológica ao versículo.
- issue: Natureza precisa da מִלָּה do rei
  choice: “o que o rei exige”
  alternative: “a questão do rei”
  rationale: O contexto favorece uma exigência real, mas o texto não a reduz explicitamente apenas ao sonho ou à interpretação; por isso a tradução mantém a referência relativamente aberta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi aliviada sem perder a repetição enfática nem as categorias profissionais da corte babilônica.
