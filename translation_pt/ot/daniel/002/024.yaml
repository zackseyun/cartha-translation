base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/024.yaml
  text: 'Therefore Daniel went in to Arioch[a], whom the king had appointed to destroy the wise men of Babylon. He went and said this to him: “Do not destroy the wise men of Babylon. Bring me in before the king[b], and I will show the interpretation to the king.”'
translation:
  language: pt
  text: 'Por isso, Daniel foi até Arioque, a quem o rei havia encarregado de matar os sábios da Babilônia. Daniel foi e lhe disse: “Não mate os sábios da Babilônia. Leve-me à presença do rei, e eu lhe darei a conhecer a interpretação.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: Por isso
  rationale: Expressa de modo natural o nexo causal e discursivo com a revelação relatada anteriormente.
- source_word: עַל עַל אַרְיוֹךְ
  choice: foi até Arioque
  rationale: O verbo aramaico pode indicar entrar ou dirigir-se a alguém; no contexto, a formulação comunica com naturalidade que Daniel procurou Arioque.
- source_word: דִּי מַנִּי מַלְכָּא
  choice: a quem o rei havia encarregado
  rationale: מני indica designação ou incumbência oficial; “encarregado” também se liga naturalmente à tarefa expressa em seguida.
- source_word: לְהוֹבָדָה / אַל תְּהוֹבֵד
  choice: de matar / Não mate
  rationale: A forma causativa de אבד significa fazer perecer ou destruir. Como se trata explicitamente da execução de pessoas, “matar” transmite com precisão o sentido contextual e mantém a repetição lexical.
- source_word: לְחַכִּימֵי בָבֶל
  choice: os sábios da Babilônia
  rationale: É a designação corrente e inteligível dos especialistas da corte babilônica.
- source_word: אֲזַל וְכֵן אֲמַר לֵהּ
  choice: Daniel foi e lhe disse
  rationale: Preserva a sequência narrativa de movimento e fala; a repetição do nome evita uma possível confusão pronominal com Arioque em português.
- source_word: הַעֵלְנִי קֳדָם מַלְכָּא
  choice: Leve-me à presença do rei
  rationale: Reproduz a forma causativa de “entrar/subir” e o sentido de comparecer diante do rei em linguagem portuguesa natural.
- source_word: וּפִשְׁרָא
  choice: a interpretação
  rationale: פשר é o termo técnico usado em Daniel para a interpretação de sonho ou mistério.
- source_word: אֲחַוֵּא
  choice: eu lhe darei a conhecer
  rationale: O verbo significa mostrar ou dar a conhecer. Esta opção soa natural com “interpretação” e preserva a ideia de comunicá-la ao rei.
