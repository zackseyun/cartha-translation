base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/026.yaml
  text: The king answered and said to Daniel, whose name was Belteshazzar, “Are you able to make known to me the dream that I saw, and its interpretation?”
translation:
  language: pt
  text: 'O rei respondeu e disse a Daniel, cujo nome era Beltessazar: “Você é capaz de me dar a conhecer o sonho que tive e a sua interpretação?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: O rei respondeu e disse
  rationale: Preserva a fórmula narrativa aramaica com os dois verbos, em português claro e digno.
- source_word: לְדָנִיֵּאל
  choice: a Daniel
  rationale: Representa naturalmente o destinatário da fala em português.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: cujo nome era Beltessazar
  rationale: Reproduz a construção relativa com 'seu nome' e emprega o passado adequado ao quadro narrativo.
- source_word: הֲאִיתָךְ כָּהֵל
  choice: Você é capaz
  rationale: Expressa diretamente a pergunta sobre a capacidade de Daniel; 'você' favorece legibilidade brasileira sem perder dignidade.
- source_word: לְהוֹדָעֻתַנִי
  choice: de me dar a conhecer
  rationale: Mantém a nuance causativa de 'fazer saber', com formulação portuguesa natural e solene.
- source_word: חֶלְמָא דִי חֲזֵית
  choice: o sonho que tive
  rationale: O verbo aramaico é literalmente 'vi', mas 'ter um sonho' é a expressão idiomática corrente em português para experimentar um sonho.
- source_word: וּפִשְׁרֵהּ
  choice: e a sua interpretação
  rationale: Mantém o sentido técnico de פשר no livro de Daniel, em vez do termo mais amplo 'significado'.
