id: DAN.2.34
reference: Daniel 2:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָזֵ֣ה הֲוַ֗יְתָ עַ֠ד דִּ֣י הִתְגְּזֶ֤רֶת אֶ֨בֶן֙ דִּי לָ֣א בִ/ידַ֔יִן וּ/מְחָ֤ת לְ/צַלְמָ/א֙ עַל רַגְל֔וֹ/הִי דִּ֥י פַרְזְלָ֖/א וְ/חַסְפָּ֑/א וְ/הַדֵּ֖קֶת הִמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/034.yaml
  text: You were watching until a stone was cut out[a], not by hands[b], and it struck the statue on its feet of iron and clay and crushed them.
translation:
  language: pt
  text: Você estava olhando até que uma pedra foi cortada, não por mãos humanas[a]. Ela atingiu a estátua[b] nos pés, que eram de ferro e barro, e os triturou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não por mãos”. A expressão aramaica indica que a pedra não foi cortada por ação humana.
    reason: lexical_alternative
  - marker: b
    text: Ou “imagem”. A palavra aramaica pode designar uma imagem ou estátua; aqui se refere à grande figura vista no sonho.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוַיְתָ
  choice: você estava olhando
  rationale: A construção com particípio e הוה expressa uma ação contínua no passado. “Estava olhando” preserva esse aspecto durativo em português natural.
- source_word: עַד דִּי
  choice: até que
  rationale: Introduz o momento até o qual a ação de olhar prosseguiu; “até que” é a forma idiomática adequada em português.
- source_word: הִתְגְּזֶרֶת אֶבֶן
  choice: uma pedra foi cortada
  rationale: A forma verbal passiva indica que a pedra foi cortada ou retirada por corte. A tradução mantém a imagem concreta sem acrescentar uma origem não expressa no verso.
- source_word: דִּי לָא בִידַיִן
  choice: não por mãos humanas
  rationale: A expressão aramaica indica ausência de ação humana. A inclusão de “humanas” torna o sentido idiomático claro sem identificar explicitamente outro agente.
- source_word: וּמְחָת
  choice: ela atingiu
  rationale: O verbo feminino singular retoma “pedra”. “Atingiu” comunica de modo natural e digno o impacto violento.
- source_word: לְצַלְמָא
  choice: a estátua
  rationale: צְלֵם pode designar imagem ou estátua. Neste sonho, “estátua” expressa com clareza a grande figura material descrita.
- source_word: עַל רַגְלוֹהִי דִּי פַרְזְלָא וְחַסְפָּא
  choice: nos pés, que eram de ferro e barro
  rationale: A formulação explicita naturalmente em português que ferro e barro descrevem os pés, mantendo a precisão do referente.
- source_word: וְהַדֵּקֶת הִמּוֹן
  choice: e os triturou
  rationale: O verbo comunica esmagar ou reduzir a pedaços, e o pronome plural retoma os pés. “Triturou” preserva a força da ação e a referência pronominal.
theological_decisions:
- issue: Expressão idiomática que indica ausência de ação humana
  choice: não por mãos humanas
  alternative: sem o auxílio de mãos
  rationale: A tradução conserva a referência concreta a “mãos” e deixa claro que a pedra não foi cortada por ação humana, sem especificar além do texto qual foi o agente.
- issue: Referente de צַלְמָא
  choice: estátua
  alternative: imagem
  rationale: “Estátua” se ajusta à figura corpórea do sonho e evita que “imagem” seja entendida apenas como representação visual, enquanto a alternativa lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe preserva a ação contínua de Daniel, a passividade do corte da pedra e o referente plural de “os triturou”, evitando linguagem arcaica e interpretações teológicas acrescentadas.
