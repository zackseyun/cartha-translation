base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/023.yaml
  text: To you[a], O God of my fathers, I give thanks and praise, because you have given me wisdom and might, and now you have made known to me what we requested from you[c][b], for you have made known to us the king’s matter.
translation:
  language: pt
  text: A ti, ó Deus de meus pais[a], dou graças e louvor, porque me deste sabedoria e poder. E agora me fizeste saber o que te pedimos[b], pois nos fizeste saber a questão do rei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus de meus antepassados”. O aramaico diz literalmente “Deus de meus pais”, expressão que liga Daniel às gerações que o precederam.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o que buscamos de ti”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a palavra do rei” ou “o assunto do rei”. O termo aramaico é amplo e se refere à questão apresentada pelo rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהּ אֲבָהָתִי
  choice: ó Deus de meus pais
  rationale: Preserva a forma literalmente familiar e a continuidade histórica evocada pela expressão aramaica, mantendo em nota a alternativa mais abrangente no português atual.
- source_word: מְהוֹדֵא וּמְשַׁבַּח אֲנָה
  choice: dou graças e louvor
  rationale: Reproduz os dois atos coordenados dos particípios aramaicos em formulação natural e digna em português.
- source_word: חָכְמְתָא וּגְבוּרְתָא
  choice: sabedoria e poder
  rationale: “Sabedoria” corresponde diretamente ao primeiro termo; “poder” expressa capacidade ou força eficaz sem restringir o segundo termo à força física.
- source_word: יְהַבְתְּ לִי
  choice: me deste
  rationale: O pretérito perfeito apresenta com clareza a dádiva já concedida e se ajusta naturalmente à oração em português.
- source_word: וּכְעַן
  choice: E agora
  rationale: Marca a transição para a revelação recém-concedida, como no aramaico.
- source_word: הוֹדַעְתַּנִי
  choice: me fizeste saber
  rationale: Mantém o valor causativo de ידע e permite conservar a repetição lexical da oração.
- source_word: דִּי בְעֵינָא מִנָּךְ
  choice: o que te pedimos
  rationale: Preserva explicitamente a primeira pessoa do plural e apresenta a relação verbal de modo idiomático em português.
- source_word: מִלַּת מַלְכָּא
  choice: a questão do rei
  rationale: “Questão” conserva a amplitude contextual de מִלָּה, que aqui designa o assunto apresentado pelo rei, sem acrescentar interpretação ausente do versículo.
- source_word: הוֹדַעְתֶּנָא
  choice: nos fizeste saber
  rationale: Preserva o sufixo de primeira pessoa do plural e a dimensão comunitária da súplica, em contraste deliberado com o singular anterior.
theological_decisions:
- issue: Forma familiar e histórica da invocação a Deus
  choice: ó Deus de meus pais
  alternative: ó Deus de meus antepassados
  rationale: A opção principal conserva de perto a expressão aramaica e sua ressonância de continuidade com as gerações anteriores, sem desenvolver uma afirmação doutrinária além do texto.
- issue: Alternância entre singular e plural na revelação recebida
  choice: me fizeste saber o que te pedimos ... nos fizeste saber
  alternative: uniformizar toda a frase no singular
  rationale: O aramaico passa intencionalmente do singular para o plural. A tradução mantém essa tensão gramatical e a participação dos companheiros de Daniel, sem harmonização.
- issue: Amplitude de מִלַּת מַלְכָּא
  choice: a questão do rei
  alternative: a palavra do rei / o assunto do rei
  rationale: “Questão” comunica o problema ou caso apresentado pelo rei, mas a nota preserva a amplitude lexical do termo aramaico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal é natural (“me deste”, “me fizeste”, “nos fizeste”), e a divisão em duas frases evita um período excessivamente longo sem apagar a progressão da oração. Mantêm-se a repetição de “fizeste saber” e a alternância singular-plural do original.
