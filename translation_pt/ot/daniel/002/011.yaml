  text: וּ/מִלְּתָ֨/א דִֽי מַלְכָּ֤/ה שָׁאֵל֙ יַקִּירָ֔ה וְ/אָחֳרָן֙ לָ֣א אִיתַ֔י דִּ֥י יְחַוִּנַּ֖/הּ קֳדָ֣ם מַלְכָּ֑/א לָהֵ֣ן אֱלָהִ֔ין דִּ֚י מְדָ֣רְ/ה֔וֹן עִם בִּשְׂרָ֖/א לָ֥א אִיתֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/011.yaml
  text: And the thing that the king asks is difficult[a], and there is no other who can declare it before the king except the gods[b], whose dwelling is not with flesh.
translation:
  language: pt
  text: E aquilo que o rei pede é difícil[a], e não há ninguém mais que possa declará-lo diante do rei, a não ser os deuses[b], cuja morada não é com a carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é árduo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a não ser os deuses, cuja morada não é com os seres humanos” ou “com os mortais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּתָא
  choice: aquilo
  rationale: O termo aramaico pode significar palavra, assunto ou coisa. Aqui se refere ao que o rei exige que seja revelado; “aquilo que o rei pede” é natural em português e evita a rigidez de “a coisa”.
- source_word: שָׁאֵל
  choice: pede
  rationale: O particípio descreve o que o rei está pedindo. “Pede” preserva a força lexical sem introduzir no verbo, por si só, a ideia mais forte de “exige”.
- source_word: יַקִּירָה
  choice: difícil
  rationale: Embora o adjetivo também possa expressar algo raro, precioso ou pesado, neste contexto qualifica o pedido como extraordinariamente difícil de atender.
- source_word: וְאָחֳרָן לָא אִיתַי
  choice: não há ninguém mais
  rationale: A expressão nega a existência de outra pessoa capaz de realizar o pedido. Em português, “ninguém mais” explicita naturalmente o referente pessoal sugerido pela oração seguinte.
- source_word: יְחַוִּנַּהּ
  choice: possa declará-lo
  rationale: O verbo significa mostrar, declarar ou tornar conhecido. “Declará-lo” combina com o ambiente da corte e mantém a referência ao assunto pedido pelo rei.
- source_word: קֳדָם מַלְכָּא
  choice: diante do rei
  rationale: A expressão significa na presença do rei; “diante do rei” é corrente, digna e próxima da forma aramaica.
- source_word: לָהֵן
  choice: a não ser
  rationale: A partícula introduz a única exceção. “A não ser” é idiomático em português e se encaixa bem após a construção negativa.
- source_word: אֱלָהִין
  choice: os deuses
  rationale: A forma é plural e, na fala dos sábios babilônios, refere-se naturalmente aos deuses. O plural preserva tanto a gramática quanto o contexto narrativo.
- source_word: מְדָרְהוֹן
  choice: cuja morada
  rationale: O substantivo denota morada ou habitação. “Cuja morada” conserva a relação expressa pela oração e mantém um registro digno sem ser arcaico.
- source_word: עִם בִּשְׂרָא
  choice: com a carne
  rationale: O aramaico diz literalmente “com carne”. A formulação mantém a imagem concreta e o contraste entre os deuses e os seres humanos mortais; alternativas interpretativas constam em nota.
- source_word: לָא אִיתוֹהִי
  choice: não é
  rationale: A expressão existencial/copular negada funciona aqui como afirmação simples de que a morada dos deuses não se encontra com a carne.
theological_decisions:
- issue: Referente de אֱלָהִין
  choice: os deuses
  alternative: seres divinos; Deus
  rationale: A morfologia plural e o contexto pagão da corte favorecem “os deuses”. Traduzir no singular como “Deus” importaria para a fala dos conselheiros uma formulação israelita que o texto não exige.
- issue: Sentido de בִּשְׂרָא
  choice: a carne
  alternative: os seres humanos; os mortais
  rationale: A tradução principal preserva a palavra concreta do original e sua tensão expressiva. A nota oferece equivalentes que esclarecem seu referente humano sem substituir silenciosamente a imagem-fonte.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira e tom digno. A sintaxe acompanha o desenvolvimento do aramaico sem soar excessivamente literal. “Carne” foi mantido no texto principal por transparência à imagem original, com esclarecimento em nota.
