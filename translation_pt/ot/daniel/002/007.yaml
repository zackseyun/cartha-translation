  text: עֲנ֥וֹ תִנְיָנ֖וּת וְ/אָמְרִ֑ין מַלְכָּ֕/א חֶלְמָ֛/א יֵאמַ֥ר לְ/עַבְד֖וֹ/הִי וּ/פִשְׁרָ֥/ה נְהַחֲוֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/007.yaml
  text: They answered a second time and said[a], “Let the king tell the dream to his servants[b], and we will show the interpretation.”
translation:
  language: pt
  text: 'Eles responderam pela segunda vez e disseram[a]: “Que o rei conte o sonho aos seus servos, e nós mostraremos a interpretação[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “novamente”. O advérbio aramaico significa mais especificamente “pela segunda vez”.
    reason: lexical_alternative
  - marker: b
    text: Ou “daremos a conhecer a sua interpretação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ
  choice: Eles responderam
  rationale: O perfeito Peal, terceira pessoa do plural, introduz a resposta no diálogo; “responderam” é direto e natural.
- source_word: תִנְיָנוּת
  choice: pela segunda vez
  rationale: Preserva a nuance ordinal explícita do advérbio aramaico, mais específica que “novamente”.
- source_word: וְאָמְרִין
  choice: e disseram
  rationale: Embora a forma seja participial, no encadeamento narrativo introduz a fala direta; o pretérito perfeito é idiomático em português.
- source_word: מַלְכָּא
  choice: o rei
  rationale: O substantivo funciona como sujeito de יֵאמַר, não como vocativo.
- source_word: חֶלְמָא
  choice: o sonho
  rationale: Equivalente comum e preciso para o termo aramaico definido.
- source_word: יֵאמַר
  choice: Que o rei conte
  rationale: A construção com “que” transmite naturalmente em português a força volitiva ou jussiva do imperfeito no pedido.
- source_word: לְעַבְדוֹהִי
  choice: aos seus servos
  rationale: No contexto da corte, designa os súditos ou oficiais que se apresentam respeitosamente ao rei; “servos” mantém o idioma cortesão sem destacar indevidamente escravidão.
- source_word: וּפִשְׁרָה
  choice: e a interpretação
  rationale: פשר é o termo técnico para a interpretação ou explicação de um sonho; o sufixo remete ao sonho, embora o português possa deixá-lo implícito.
- source_word: נְהַחֲוֵה
  choice: nós mostraremos
  rationale: O Haphel de חוה significa “mostrar, dar a conhecer”; “mostraremos” preserva de modo conciso o valor causativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe mantém o pedido cortesão na terceira pessoa (“Que o rei...”) e preserva a repetição narrativa do aramaico.
