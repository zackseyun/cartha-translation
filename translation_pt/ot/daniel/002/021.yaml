  text: וְ֠/הוּא מְהַשְׁנֵ֤א עִדָּנַיָּ/א֙ וְ/זִמְנַיָּ֔/א מְהַעְדֵּ֥ה מַלְכִ֖ין וּ/מְהָקֵ֣ים מַלְכִ֑ין יָהֵ֤ב חָכְמְתָ/א֙ לְ/חַכִּימִ֔ין וּ/מַנְדְּעָ֖/א לְ/יָדְעֵ֥י בִינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/021.yaml
  text: He changes times and seasons[a]; he removes kings and sets up kings[b]; he gives wisdom to the wise and knowledge to those who have understanding.
translation:
  language: pt
  text: Ele muda os tempos e as épocas[a]; remove reis e estabelece reis; dá sabedoria aos sábios e conhecimento aos que têm entendimento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os tempos e as ocasiões determinadas”. O par aramaico pode indicar tanto o tempo em geral quanto suas ocasiões apropriadas ou estabelecidas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aos conhecedores do entendimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהַשְׁנֵא
  choice: muda
  rationale: Expressa de modo direto e natural a ideia causativa de produzir mudança, preservando o caráter ativo da declaração.
- source_word: עִדָּנַיָּא וְזִמְנַיָּא
  choice: os tempos e as épocas
  rationale: Mantém os dois termos aramaicos distintos em uma combinação natural em português; a nota registra a possível nuance de ocasiões determinadas no segundo termo.
- source_word: מְהַעְדֵּה
  choice: remove
  rationale: Preserva o sentido amplo de fazer passar ou retirar, sem restringi-lo à noção política mais específica de depor.
- source_word: מַלְכִין
  choice: reis
  rationale: É a correspondência direta e comum do substantivo aramaico plural.
- source_word: מְהָקֵים
  choice: estabelece
  rationale: Comunica a ideia de fazer surgir ou firmar reis e forma um contraste claro com “remove”, sem acrescentar conotações alheias ao texto.
- source_word: יָהֵב
  choice: dá
  rationale: É a tradução mais simples e direta do verbo aramaico.
- source_word: חָכְמְתָא לְחַכִּימִין
  choice: sabedoria aos sábios
  rationale: Mantém a repetição lexical e a formulação concisa do original.
- source_word: מַנְדְּעָא
  choice: conhecimento
  rationale: Preserva a distinção entre conhecimento e בִינָה, traduzido como entendimento.
- source_word: לְיָדְעֵי בִינָה
  choice: aos que têm entendimento
  rationale: Formulação natural em português para a expressão semítica literalmente equivalente a “os conhecedores do entendimento”; a nota conserva essa textura do original.
theological_decisions:
- issue: Soberania divina sobre os governantes políticos
  choice: Atribuir diretamente a Deus a remoção e o estabelecimento de reis.
  alternative: Dizer que Deus apenas permite ou influencia a ascensão e a queda de reis.
  rationale: O aramaico atribui diretamente as duas ações a Deus. A tradução conserva essa afirmação forte sem ampliá-la em um sistema teológico determinista nem atenuá-la por meio de linguagem permissiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura paralela e as repetições do aramaico foram preservadas, enquanto a expressão semítica final foi vertida de modo natural e documentada em nota.
