  text: שָׁק֖וֹ/הִי דִּ֣י פַרְזֶ֑ל רַגְל֕וֹ/הִי מנ/הון דִּ֣י פַרְזֶ֔ל ו/מנ/הון דִּ֥י חֲסַֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/033.yaml
  text: its legs were of iron[a], its feet partly of iron and partly of clay.
translation:
  language: pt
  text: suas pernas, de ferro; seus pés, em parte de ferro e em parte de barro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cerâmica” ou “barro cozido” (aramaico חֲסַף).
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקוֹהִי
  choice: suas pernas
  rationale: O substantivo aramaico designa as pernas ou a parte inferior delas. “Pernas” é natural em português e mantém a distinção em relação aos pés mencionados em seguida.
- source_word: דִּי
  choice: de
  rationale: A construção relaciona as partes da estátua ao material de que eram feitas; a formulação elíptica “de ferro” reproduz isso com naturalidade.
- source_word: פַרְזֶל
  choice: ferro
  rationale: Equivalente direto e habitual do termo aramaico para esse metal.
- source_word: רַגְלוֹהִי
  choice: seus pés
  rationale: Neste contexto, o termo se refere aos pés e deve permanecer distinto do substantivo anterior traduzido por “pernas”.
- source_word: מנ/הון ... ו/מנ/הון
  choice: em parte ... e em parte
  rationale: Embora a expressão seja literalmente “deles/entre eles”, aqui distribui os dois materiais pelos pés; “em parte ... e em parte” comunica esse sentido de modo claro.
- source_word: חֲסַף
  choice: barro
  rationale: O termo pode designar barro ou material cerâmico. “Barro” é a forma mais direta e natural para a matéria contrastada com o ferro, sem excluir a ideia de cerâmica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. Mantém-se a estrutura fragmentária e descritiva do versículo, que continua a enumeração iniciada no contexto anterior. O ponto e vírgula distingue as pernas dos pés, e a repetição de “em parte” preserva a distribuição dos materiais.
