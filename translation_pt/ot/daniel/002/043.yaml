  text: די חֲזַ֗יְתָ פַּרְזְלָ/א֙ מְעָרַב֙ בַּ/חֲסַ֣ף טִינָ֔/א מִתְעָרְבִ֤ין לֶהֱוֺן֙ בִּ/זְרַ֣ע אֲנָשָׁ֔/א וְ/לָֽא לֶהֱוֺ֥ן דָּבְקִ֖ין דְּנָ֣ה עִם דְּנָ֑ה הֵֽא כְ/דִ֣י פַרְזְלָ֔/א לָ֥א מִתְעָרַ֖ב עִם חַסְפָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/043.yaml
  text: As you saw the iron mixed with clay[a], they will mix themselves with the seed of man, but they will not hold together, this one with that one[c][b], just as iron does not mix with pottery.
translation:
  language: pt
  text: Assim como você viu o ferro misturado com barro, eles se misturarão com a descendência humana[a], mas não ficarão unidos um ao outro[b], assim como o ferro não se mistura com a cerâmica[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com a semente do homem”. Muitos entendem que a expressão se refere a casamentos entre grupos, mas o aramaico não especifica isso.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “este com aquele”.
    reason: lexical_alternative
  - marker: c
    text: Ou “barro” ou “louça de barro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַיְתָ
  choice: você viu
  rationale: Forma verbal aramaica na segunda pessoa masculina singular, dirigida a Nabucodonosor. “Você viu” é claro, natural e exato em português moderno.
- source_word: פַּרְזְלָא
  choice: ferro
  rationale: Equivalente corrente do substantivo aramaico e coerente com a imagem da estátua ao longo do capítulo.
- source_word: חֲסַף טִינָא
  choice: barro
  rationale: A expressão composta designa material argiloso. “Barro” comunica a imagem de modo natural, sem sobrecarregar o texto principal.
- source_word: מִתְעָרְבִין לֶהֱוֺן
  choice: eles se misturarão
  rationale: A construção tem valor reflexivo ou médio. A forma pronominal portuguesa preserva esse aspecto sem perder naturalidade.
- source_word: בִּזְרַע אֲנָשָׁא
  choice: com a descendência humana
  rationale: A expressão significa literalmente “com a semente do homem”. “Descendência humana” conserva a imagem genealógica e a ambiguidade do referente, evitando em português moderno a possível leitura biológica de “semente humana”.
- source_word: דָּבְקִין
  choice: ficarão unidos
  rationale: O verbo denota aderir, apegar-se ou manter-se unido. Esta formulação comunica tanto a união relacional quanto a instabilidade dos materiais simbólicos.
- source_word: דְּנָה עִם דְּנָה
  choice: um ao outro
  rationale: Equivalente idiomático português da expressão distributiva “este com aquele”, preservando a relação entre partes distintas.
- source_word: הֵא כְדִי
  choice: assim como
  rationale: Introduz a comparação que fundamenta a afirmação anterior.
- source_word: חַסְפָּא
  choice: cerâmica
  rationale: O termo pode designar barro, objeto de barro ou louça de barro. “Cerâmica” preserva a distinção possível em relação à expressão anterior, חֲסַף טִינָא, sem excluir a ideia de material argiloso.
theological_decisions:
- issue: Sentido de “eles se misturarão com a descendência humana”
  choice: Manter indefinido o referente de “eles” e conservar a expressão genealógica sem identificar um mecanismo histórico específico.
  alternative: Traduzir como “haverá casamentos entre eles” ou identificar explicitamente reis, reinos, governantes ou classes sociais.
  rationale: O aramaico não esclarece plenamente quem se mistura nem reduz a mistura a casamentos. A tradução preserva a dificuldade e evita impor uma interpretação histórica ou escatológica particular.
translation_notes:
  register: Português contemporâneo, digno e de leitura ampla, com “você” para a segunda pessoa singular. A redação mantém a ambiguidade do aramaico, conserva a forma reflexiva “se misturarão” e evita transformar uma interpretação possível em texto explícito.
