  source_fidelity: 'A tradução acompanha com precisão a estrutura e as imagens do aramaico: o ferro misturado com barro, a construção reflexiva/média em “eles se misturarão”, a expressão deliberadamente ambígua “com a descendência humana”, a falta de coesão entre as partes e o contraste final entre ferro e cerâmica. Não identifica indevidamente os referentes de “eles” nem transforma a frase em uma teoria de casamentos ou alianças.'
