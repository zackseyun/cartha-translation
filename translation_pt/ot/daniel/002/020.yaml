base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/020.yaml
  text: 'Daniel answered and said: “Blessed be the name of God from everlasting to everlasting[b][a], for wisdom and might belong to him.”'
translation:
  language: pt
  text: 'Daniel respondeu e disse: “Bendito seja o nome de Deus de eternidade a eternidade[a], pois a sabedoria e o poder pertencem a ele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de era em era” ou “para todo o sempre”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a sabedoria e a força são dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: tomou a palavra e disse
  rationale: A expressão aramaica é uma fórmula narrativa de introdução à fala. Em português, “tomou a palavra e disse” preserva sua função e seus dois elementos sem sugerir necessariamente uma resposta a uma pergunta explícita.
- source_word: לֶהֱוֵא ... מְבָרַךְ
  choice: Bendito seja
  rationale: Reproduz naturalmente em português o valor volitivo da fórmula de bênção e mantém o registro doxológico.
- source_word: שְׁמֵהּ דִּי אֱלָהָא
  choice: o nome de Deus
  rationale: Conserva o idioma bíblico referente à identidade revelada e à honra de Deus, sem tornar a frase artificial em português.
- source_word: מִן עָלְמָא וְעַד עָלְמָא
  choice: de eternidade a eternidade
  rationale: Mantém a estrutura temporal abrangente do aramaico e uma formulação bíblica digna e inteligível; a nota registra alternativas legítimas.
- source_word: דִּי
  choice: pois
  rationale: Neste contexto, a partícula introduz o fundamento da bênção. “Pois” expressa essa relação causal com concisão.
- source_word: חָכְמְתָא
  choice: sabedoria
  rationale: Equivalente direto e natural do substantivo abstrato aramaico.
- source_word: גְבוּרְתָא
  choice: poder
  rationale: O termo denota força ou potência. “Poder” é claro no português atual e forma um par natural com “sabedoria”.
- source_word: דִּי לֵהּ הִיא
  choice: pertencem a ele
  rationale: Expressa diretamente a construção aramaica de posse sem acrescentar a ideia de exclusividade.
theological_decisions:
- issue: Fórmula doxológica e atributos divinos
  choice: Apresentar a fala como uma bênção ao nome de Deus, fundamentada no fato de que a sabedoria e o poder lhe pertencem.
  alternative: 'Traduzir mais literalmente: “Seja bendito o nome de Deus... porque a sabedoria e o poder são dele.”'
  rationale: A tradução conserva a doxologia e a atribuição de sabedoria e poder a Deus, sem transformar o verso em uma definição metafísica nem introduzir afirmações doutrinárias além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o caráter poético e doxológico do aramaico sem arcaísmos desnecessários.
