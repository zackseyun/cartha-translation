  text: וּ/בָתְרָ֗/ךְ תְּק֛וּם מַלְכ֥וּ אָחֳרִ֖י ארע/א מִנָּ֑/ךְ וּ/מַלְכ֨וּ תליתיא אָחֳרִי֙ דִּ֣י נְחָשָׁ֔/א דִּ֥י תִשְׁלַ֖ט בְּ/כָל אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/039.yaml
  text: And after you another kingdom[a], inferior to yours, will arise; and yet a third kingdom, of bronze[b], which will rule over all the earth.
translation:
  language: pt
  text: Depois de você, surgirá outro reino, inferior ao seu[a]; depois, um terceiro reino, de bronze, que dominará toda a terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mais baixo do que você». A expressão aramaica é difícil; o sentido parece ser que o reino seguinte seria inferior ao reino de Nabucodonosor em posição ou esplendor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «todo o território». O termo aramaico pode significar tanto «terra» em sentido amplo como «território» ou «país»; aqui, provavelmente descreve um vasto domínio imperial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתְרָךְ
  choice: Depois de você
  rationale: A expressão preposicional indica sucessão temporal após Nabucodonosor; a continuidade do discurso é expressa naturalmente em português sem exigir um «e» inicial.
- source_word: תְּקוּם
  choice: surgirá
  rationale: O verbo significa literalmente levantar-se ou surgir; no contexto da sucessão de reinos, «surgirá» é natural e preserva a imagem de aparecimento.
- source_word: מַלְכוּ אָחֳרִי
  choice: outro reino
  rationale: O substantivo designa aqui um domínio político, e o adjetivo indica um reino posterior e distinto.
- source_word: ארעא מִנָּךְ
  choice: inferior ao seu
  rationale: A expressão aramaica é difícil. No contexto dos metais sucessivos da estátua, a leitura comparativa de inferioridade é plausível; «ao seu» deixa claro que se compara o reino seguinte com o reino de Nabucodonosor.
- source_word: וּמַלְכוּ תליתיא אָחֳרִי
  choice: depois, um terceiro reino
  rationale: A formulação mantém a progressão sequencial e verte de modo natural o reino terceiro e subsequente.
- source_word: דִּי נְחָשָׁא
  choice: de bronze
  rationale: A construção identifica o terceiro reino com o bronze da imagem; a expressão é concisa e corrente.
- source_word: דִּי תִשְׁלַט
  choice: que dominará
  rationale: O verbo denota exercer domínio ou poder. «Dominará» conserva essa força política e combina bem com o complemento territorial.
- source_word: בְּכָל אַרְעָא
  choice: toda a terra
  rationale: O termo pode significar «terra» no sentido amplo ou «território/país». A linguagem imperial abrangente favorece «toda a terra», sem eliminar a alternativa em nota.
theological_decisions:
- issue: Sentido comparativo de ארעא מִנָּךְ
  choice: inferior ao seu
  alternative: mais baixo do que você
  rationale: A sintaxe é incomum, mas a sequência de metais de valor decrescente sustenta a noção de inferioridade. A tradução não identifica historicamente os reinos e a nota conserva a forma mais literal.
- issue: Alcance de בְּכָל אַרְעָא
  choice: toda a terra
  alternative: todo o território
  rationale: A retórica de domínio imperial favorece o alcance amplo, mas o campo semântico do aramaico permite uma referência territorial mais limitada, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando a sequência dos reinos, a metáfora do bronze e as ambiguidades relevantes em notas.
