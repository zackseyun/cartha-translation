base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/006.yaml
  text: But if you make known the dream and its interpretation[a], you will receive from me gifts and rewards and great honor. Therefore make known to me the dream and its interpretation.
translation:
  language: pt
  text: Mas, se vocês me revelarem o sonho e a sua interpretação[a], receberão de mim presentes, uma recompensa e grande honra. Portanto, revelem-me o sonho e a sua interpretação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «me declararem» ou «me derem a conhecer»; o verbo aramaico repetido significa fazer saber ou declarar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵן
  choice: Mas, se
  rationale: Introduz uma condição em contraste com a ameaça do versículo anterior; a formulação é natural e preserva tanto a conjunção quanto o valor condicional.
- source_word: חֶלְמָא
  choice: o sonho
  rationale: Refere-se ao sonho específico do rei, já em foco no contexto.
- source_word: וּפִשְׁרֵהּ
  choice: e a sua interpretação
  rationale: פשר designa a interpretação ou explicação de um sonho; esta opção é precisa e corrente em português.
- source_word: תְּהַחֲוֺן / הַחֲוֺנִי
  choice: revelarem / revelem-me
  rationale: O Haphel de חוה significa fazer saber, declarar ou mostrar. «Revelar» expressa de modo natural a comunicação de algo oculto e permite manter a repetição do verbo aramaico.
- source_word: מַתְּנָן
  choice: presentes
  rationale: Designa dádivas ou objetos de valor concedidos pelo rei.
- source_word: וּנְבִזְבָּה
  choice: recompensas
  rationale: O substantivo designa recompensa, prêmio ou gratificação. O plural português funciona naturalmente ao lado de «presentes» e comunica a promessa de recompensa régia.
- source_word: וִיקָר שַׂגִּיא
  choice: e grande honra
  rationale: Preserva o sentido de prestígio ou honra intensificado por שַׂגִּיא, «grande».
- source_word: תְּקַבְּלוּן
  choice: receberão
  rationale: O imperfeito de segunda pessoa masculina plural tem valor futuro na consequência da condição.
- source_word: מִן קֳדָמַי
  choice: de mim
  rationale: Neste idioma aramaico, indica a origem da dádiva na pessoa e autoridade do rei; «de mim» é claro e idiomático.
- source_word: לָהֵן
  choice: Portanto
  rationale: Marca a conclusão prática derivada da promessa de recompensa e introduz a ordem seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento plural «vocês» torna explícita a segunda pessoa plural aramaica. A repetição de «o sonho e a sua interpretação» e do verbo «revelar» preserva a estrutura enfática do original.
