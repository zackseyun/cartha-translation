  text: יְלָדִ֣ים אֲשֶׁ֣ר אֵֽין בָּ/הֶ֣ם כָּל מאום וְ/טוֹבֵ֨י מַרְאֶ֜ה וּ/מַשְׂכִּילִ֣ים בְּ/כָל חָכְמָ֗ה וְ/יֹ֤דְעֵי דַ֨עַת֙ וּ/מְבִינֵ֣י מַדָּ֔ע וַ/אֲשֶׁר֙ כֹּ֣חַ בָּ/הֶ֔ם לַ/עֲמֹ֖ד בְּ/הֵיכַ֣ל הַ/מֶּ֑לֶךְ וּֽ/לֲ/לַמְּדָ֥/ם סֵ֖פֶר וּ/לְשׁ֥וֹן כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/004.yaml
  text: young men in whom there was no defect at all[a], good in appearance, skillful in all wisdom, knowledgeable in learning, discerning in understanding, and who had the ability to stand in the king’s palace[c][b], and to teach them the literature and language of the Chaldeans.
translation:
  language: pt
  text: jovens sem defeito algum, de boa aparência, perspicazes em toda sabedoria, dotados de conhecimento, capazes de compreender o saber e com aptidão para servir no palácio do rei[a], e que ele lhes ensinasse a escrita[b] e a língua dos caldeus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para ficar de pé no palácio do rei”; a expressão pode significar servir no palácio ou comparecer perante o rei em sua corte.
    reason: lexical_alternative
  - marker: b
    text: Ou “a literatura”. O termo pode designar escrita, livro ou aprendizado escribal.
    reason: lexical_alternative
  - marker: c
    text: Neste contexto, “caldeus” pode referir-se de modo amplo aos babilônios, mas o hebraico emprega especificamente “caldeus”.
    reason: cultural_note
lexical_decisions:
- source_word: יְלָדִים
  choice: jovens
  rationale: No contexto de seleção para o serviço real, designa jovens do sexo masculino, provavelmente adolescentes ou jovens adultos. Em português, “jovens” é natural e não sugere crianças pequenas.
- source_word: אֵין בָּהֶם כָּל מְאוּם
  choice: sem defeito algum
  rationale: Expressa a ausência total de defeito, provavelmente físico, como qualificação para a corte; evita a conotação predominantemente cultual que “sem mancha” poderia ter.
- source_word: טוֹבֵי מַרְאֶה
  choice: de boa aparência
  rationale: Preserva de modo natural a avaliação da aparência física sem intensificá-la para “bonitos” ou “formosos”.
- source_word: מַשְׂכִּילִים בְּכָל חָכְמָה
  choice: perspicazes em toda sabedoria
  rationale: O particípio de שכל indica discernimento, inteligência ou aptidão; “perspicazes” comunica essa capacidade no âmbito da sabedoria.
- source_word: יֹדְעֵי דַעַת
  choice: dotados de conhecimento
  rationale: Reproduz naturalmente a ideia de possuir conhecimento, evitando em português a formulação artificial “conhecedores de conhecimento”.
- source_word: מְבִינֵי מַדָּע
  choice: capazes de compreender o saber
  rationale: Mantém a acumulação de qualidades intelectuais e o destaque dado à compreensão, sem confundir a expressão com a anterior.
- source_word: כֹּחַ בָּהֶם
  choice: com aptidão
  rationale: כֹּחַ pode indicar força ou capacidade; aqui se refere à qualificação necessária para o serviço na corte.
- source_word: לַעֲמֹד בְּהֵיכַל הַמֶּלֶךְ
  choice: para servir no palácio do rei
  rationale: A expressão significa literalmente “ficar de pé no palácio do rei”, mas nesse contexto funciona como idioma de comparecimento e serviço na corte. A nota preserva a forma literal.
- source_word: הֵיכַל
  choice: palácio
  rationale: No contexto real babilônico, refere-se ao palácio ou salão do rei, não a um templo.
- source_word: לְלַמְּדָם
  choice: que lhes ensinasse
  rationale: O infinitivo continua a ordem dada a Aspenaz no versículo anterior; a construção em português explicita naturalmente essa ligação sintática.
- source_word: סֵפֶר
  choice: a escrita
  rationale: O singular coletivo pode designar escrita, documentos ou aprendizado livresco/escribal. “Escrita” conserva melhor a amplitude lexical, com alternativas indicadas em nota.
- source_word: לְשׁוֹן כַּשְׂדִּים
  choice: a língua dos caldeus
  rationale: Tradução direta e clara, mantendo o etnônimo específico do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A tradução conserva a sequência cumulativa das qualificações intelectuais, mas evita calques artificiais. “Servir” verte idiomaticamente “ficar de pé”, cuja imagem concreta é preservada em nota.
