  text: וַ/יִּשְׁמַ֥ע לָ/הֶ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יְנַסֵּ֖/ם יָמִ֥ים עֲשָׂרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/014.yaml
  text: So he listened to them in this matter and tested them for ten days[a].
translation:
  language: pt
  text: Então ele deu ouvidos a eles nesse assunto[a] e os pôs à prova durante dez dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os atendeu nesse assunto”. O verbo hebraico pode indicar tanto escutar como atender ao que foi dito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע לָהֶם
  choice: ele os atendeu
  rationale: שׁמע com לְ pode significar ouvir, dar ouvidos ou atender. No contexto, o encarregado aceita agir conforme a proposta; “os atendeu” expressa isso naturalmente sem sugerir a submissão social implicada por “obedeceu”.
- source_word: לַדָּבָר הַזֶּה
  choice: nesse assunto
  rationale: דָּבָר aqui se refere à proposta específica que acaba de ser feita. “Nesse assunto” é claro e idiomático, sem a rigidez de “nessa palavra”.
- source_word: וַיְנַסֵּם
  choice: os pôs à prova
  rationale: נסה no piel significa testar ou experimentar. “Pôs à prova” comunica com clareza que ele realizou a experiência proposta.
- source_word: יָמִים עֲשָׂרָה
  choice: durante dez dias
  rationale: A expressão funciona como acusativo de duração; “durante” torna explícito em português o período pelo qual a prova se estendeu.
theological_decisions: []
