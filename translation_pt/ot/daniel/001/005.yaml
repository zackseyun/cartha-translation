  text: וַ/יְמַן֩ לָ/הֶ֨ם הַ/מֶּ֜לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֗/וֹ מִ/פַּת בַּ֤ג הַ/מֶּ֨לֶךְ֙ וּ/מִ/יֵּ֣ין מִשְׁתָּ֔י/ו וּֽ/לְ/גַדְּלָ֖/ם שָׁנִ֣ים שָׁל֑וֹשׁ וּ/מִ֨/קְצָתָ֔/ם יַֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/005.yaml
  text: And the king assigned to them a daily portion from the king’s food and from the wine he drank[a], and to bring them up for three years[c][b]; and at the end of them they were to stand before the king.
translation:
  language: pt
  text: O rei lhes destinou uma porção diária da comida real[a] e do vinho que o rei bebia, para criá-los durante três anos; ao fim desse período[b], eles se apresentariam diante do rei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das iguarias do rei” ou “da rica comida do rei”. O hebraico se refere às provisões da mesa real e pode sugerir alimentos luxuosos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ao fim deles”, isto é, ao fim dos três anos.
    reason: lexical_alternative
  - marker: c
    text: “Apresentar-se diante do rei” é uma expressão da corte que pode indicar comparecer perante o rei para o serviço real.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמַן
  choice: destinou
  rationale: O verbo expressa a designação ou atribuição de algo a alguém; “destinou” comunica naturalmente a determinação administrativa do rei.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: uma porção diária
  rationale: A expressão idiomática indica a quantidade fixada para cada dia; “uma porção diária” preserva a ideia concreta de provisão regular.
- source_word: מִפַּת בַּג הַמֶּלֶךְ
  choice: da comida real
  rationale: A expressão designa as provisões da mesa do rei, possivelmente alimentos finos ou luxuosos. “Comida real” é clara e contida, sem tornar obrigatória essa nuance possível.
- source_word: וּמִיֵּין מִשְׁתָּיו
  choice: do vinho que ele bebia
  rationale: A formulação mantém a referência pessoal ao vinho consumido pelo rei e soa natural em português.
- source_word: וּלְגַדְּלָם
  choice: que fossem preparados
  rationale: O causativo pode envolver criar, nutrir e conduzir ao desenvolvimento. No contexto do programa da corte, “preparados” comunica o processo sem limitá-lo apenas à alimentação ou à educação formal.
- source_word: שָׁנִים שָׁלוֹשׁ
  choice: durante três anos
  rationale: Expressa de modo direto e natural a duração do período determinado.
- source_word: וּמִקְצָתָם
  choice: ao fim desse período
  rationale: A expressão significa literalmente “ao fim deles”, sendo os três anos o referente. A tradução explicita esse antecedente sem alterar o sentido.
- source_word: יַעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: eles se apresentariam diante do rei
  rationale: Preserva a imagem da presença formal diante do soberano e evita reduzir no texto principal a expressão cortesã apenas à ideia de emprego, embora o serviço real esteja implícito.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi dividida em duas frases para evitar uma coordenação pesada, mantendo a sequência do hebraico. As notas preservam tanto a possível nuance luxuosa de פַּת־בַּג quanto o sentido cortesão de estar diante do rei.
