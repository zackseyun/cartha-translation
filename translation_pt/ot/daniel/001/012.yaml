  text: נַס נָ֥א אֶת עֲבָדֶ֖י/ךָ יָמִ֣ים עֲשָׂרָ֑ה וְ/יִתְּנוּ לָ֜/נוּ מִן הַ/זֵּרֹעִ֛ים וְ/נֹאכְלָ֖ה וּ/מַ֥יִם וְ/נִשְׁתֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/012.yaml
  text: Please test your servants for ten days[a], and let us be given vegetables to eat and water to drink.
translation:
  language: pt
  text: Por favor, ponha os seus servos à prova durante dez dias. Que nos deem alimentos vegetais[a] para comer e água para beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alimentos provenientes de sementes” ou “comida de sementes”; o termo hebraico designa de modo amplo alimentos vegetais produzidos a partir de sementes.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַס נָא
  choice: Por favor, ponha ... à prova
  rationale: O imperativo de נסה pede um período de avaliação, enquanto נָא suaviza o pedido com cortesia.
- source_word: עֲבָדֶיךָ
  choice: os seus servos
  rationale: Neste contexto de corte, é uma autodesignação respeitosa diante de um superior; “servos” preserva o registro sem enfatizar indevidamente a condição jurídica de escravo.
- source_word: יָמִים עֲשָׂרָה
  choice: durante dez dias
  rationale: Expressa naturalmente em português o acusativo hebraico de duração.
- source_word: וְיִתְּנוּ לָנוּ
  choice: Que nos deem
  rationale: Reproduz o valor volitivo do jussivo na terceira pessoa do plural, mantendo indefinidos os responsáveis por fornecer a comida.
- source_word: מִן הַזֵּרֹעִים
  choice: alimentos de origem vegetal
  rationale: O substantivo se refere amplamente a alimentos vegetais provenientes do que é semeado; a escolha evita o arcaico “legumes secos” e não restringe o sentido apenas a hortaliças.
- source_word: וְנֹאכְלָה וּמַיִם וְנִשְׁתֶּה
  choice: para comer e água para beber
  rationale: Formulação portuguesa natural que preserva o paralelismo e a finalidade dos alimentos e da água solicitados.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e respeitoso, com legibilidade brasileira e alcance internacional. O tratamento “seus” evita regionalizar excessivamente a fala; a construção mantém o tom cortês de Daniel.
