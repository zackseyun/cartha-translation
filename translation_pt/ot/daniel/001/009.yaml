source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן הָֽ/אֱלֹהִים֙ אֶת דָּ֣נִיֵּ֔אל לְ/חֶ֖סֶד וּֽ/לְ/רַחֲמִ֑ים לִ/פְנֵ֖י שַׂ֥ר הַ/סָּרִיסִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/009.yaml
  text: And God gave Daniel favor and compassion before the chief of the eunuchs[a].
translation:
  language: pt
  text: E Deus fez com que Daniel encontrasse favor e compaixão diante do chefe dos eunucos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe dos oficiais da corte” ou “chefe dos oficiais do palácio”; o termo hebraico pode se referir tanto a eunucos em sentido literal quanto, de modo mais amplo, a oficiais do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: fez com que encontrasse
  rationale: O verbo נתן significa literalmente “dar”, mas, nesta construção, expressa que Deus levou Daniel a receber uma atitude favorável do oficial. A formulação é natural em português e mantém Deus como agente da ação.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: O substantivo designa o Deus verdadeiro neste contexto. Como o nome da aliança não aparece, “Deus” é a tradução adequada.
- source_word: אֶת דָּנִיֵּאל
  choice: Daniel
  rationale: אֶת é a marca do objeto direto e não tem equivalente independente em português; o nome próprio é vertido na forma portuguesa tradicional.
- source_word: לְחֶסֶד
  choice: favor
  rationale: Aqui חֶסֶד descreve a consideração favorável que Daniel recebeu perante o oficial, não necessariamente a lealdade de aliança. “Favor” se ajusta ao contexto interpessoal.
- source_word: וּלְרַחֲמִים
  choice: compaixão
  rationale: O plural רַחֲמִים comunica sentimentos de misericórdia e ternura. “Compaixão” é claro, atual e combina naturalmente com “favor”.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A expressão significa literalmente “diante de” ou “na presença de” e, neste contexto, indica a disposição do oficial em relação a Daniel.
- source_word: שַׂר
  choice: chefe
  rationale: שַׂר designa alguém com autoridade ou posição elevada. No estado construto, “chefe” comunica claramente sua função de supervisão.
- source_word: הַסָּרִיסִים
  choice: dos eunucos
  rationale: סָרִיס pode indicar eunucos em sentido literal ou, por extensão, oficiais da corte. O texto principal conserva o sentido lexical direto, enquanto a amplitude semântica é registrada em nota.
theological_decisions:
- issue: Sentido de סָרִיסִים no contexto da corte babilônica
  choice: eunucos
  alternative: oficiais da corte; oficiais do palácio
  rationale: O termo hebraico pode se referir tanto a eunucos literais quanto, de modo mais amplo, a funcionários reais. Como o contexto não decide inequivocamente entre esses sentidos, o texto mantém a tradução direta e a nota preserva a alternativa institucional sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Fez com que Daniel encontrasse” evita o pouco natural “deu Daniel para favor” e explicita apenas a relação causativa já presente na construção hebraica. A nota mantém a ambiguidade lexical de סָרִיסִים.
