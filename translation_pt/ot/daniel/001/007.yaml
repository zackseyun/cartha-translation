base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/007.yaml
  text: 'And the chief of the eunuchs gave them names: he gave Daniel the name Belteshazzar[a], Hananiah the name Shadrach, Mishael the name Meshach, and Azariah the name Abed-nego.'
translation:
  language: pt
  text: 'O chefe dos eunucos[a] deu-lhes nomes: a Daniel deu o nome de Beltessazar; a Hananias, o nome de Sadraque; a Misael, o nome de Mesaque; e a Azarias, o nome de Abede-Nego.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o chefe dos oficiais” ou “o comandante dos oficiais da corte”; o termo hebraico pode designar um eunuco ou, por extensão, um oficial da corte real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם לָהֶם שֵׁמוֹת
  choice: deu-lhes nomes
  rationale: A expressão hebraica usa literalmente “pôr/colocar nomes”; “deu-lhes nomes” comunica de modo natural a atribuição dos novos nomes sem acrescentar ao texto a palavra “novos”.
- source_word: שַׂר הַסָּרִיסִים
  choice: o chefe dos eunucos
  rationale: סָרִיס pode designar literalmente um eunuco e, por extensão, um oficial da corte. A tradução mantém o sentido lexical mais direto, enquanto a nota registra a alternativa contextual.
- source_word: וַיָּשֶׂם
  choice: deu o nome de
  rationale: Na distribuição dos nomes, “deu o nome de” exprime com clareza e naturalidade o ato de nomear. A repetição é preservada por elipse controlada, com “o nome de” em cada membro.
- source_word: לְדָנִיֵּאל ... בֵּלְטְשַׁאצַּר
  choice: a Daniel deu o nome de Beltessazar
  rationale: A construção deixa explícito que Beltessazar é o nome atribuído a Daniel e conserva a ordem de apresentação do hebraico.
- source_word: שַׁדְרַךְ / מֵישַׁךְ / עֲבֵד נְגוֹ
  choice: Sadraque / Mesaque / Abede-Nego
  rationale: Os nomes próprios são transliterados segundo formas tradicionais e reconhecíveis em português, sem tentativa de traduzir suas possíveis etimologias.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes tradicionais em português. Os dois-pontos introduzem a enumeração, e os pontos e vírgulas distinguem com clareza cada par de nomes. A colocação pronominal em “deu-lhes” mantém fluidez e registro literário acessível.
