id: DAN.1.3
reference: Daniel 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ לְ/אַשְׁפְּנַ֖ז רַ֣ב סָרִיסָ֑י/ו לְ/הָבִ֞יא מִ/בְּנֵ֧י יִשְׂרָאֵ֛ל וּ/מִ/זֶּ֥רַע הַ/מְּלוּכָ֖ה וּ/מִן הַֽ/פַּרְתְּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/003.yaml
  text: Then the king told Ashpenaz[a], the chief of his court officials, to bring some of the sons of Israel, both from the royal offspring and from the nobles,
translation:
  language: pt
  text: Então o rei disse a Aspenaz, chefe dos seus oficiais da corte[a], que trouxesse alguns dos filhos de Israel, tanto da descendência real como dos nobres,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe dos seus eunucos”. O termo hebraico pode designar tanto eunucos em sentido literal como altos oficiais da corte em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar, refletido por “Então”. “Disse ... que trouxesse” expressa naturalmente em português a fala com força diretiva, sem intensificá-la para “ordenou”.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Equivalente direto do substantivo comum definido.
- source_word: לְאַשְׁפְּנַז
  choice: a Aspenaz
  rationale: O nome próprio é transliterado numa forma corrente e clara em português.
- source_word: רַב סָרִיסָיו
  choice: chefe dos seus oficiais da corte
  rationale: רַב indica o chefe ou dirigente; סָרִיס pode designar um eunuco literal ou, em sentido mais amplo, um alto oficial régio. A opção no texto principal preserva a ambiguidade funcional do contexto, e a alternativa literal aparece em nota.
- source_word: לְהָבִיא
  choice: que trouxesse
  rationale: O infinitivo hifil de בוא, depois de um verbo de fala com valor diretivo, é expresso de modo natural pela oração subordinada portuguesa.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: alguns dos filhos de Israel
  rationale: Preserva a forma tradicional e relativamente transparente da expressão hebraica, indicando membros do povo de Israel no contexto.
- source_word: וּמִזֶּרַע הַמְּלוּכָה
  choice: tanto da descendência real
  rationale: “Descendência” comunica o sentido genealógico de זֶרַע sem o caráter pouco natural de “semente”; “tanto” introduz naturalmente a construção coordenada.
- source_word: וּמִן הַפַּרְתְּמִים
  choice: como dos nobres
  rationale: O termo raro provavelmente designa pessoas da elite ou de alta posição; “nobres” é conciso e evita especificar um título técnico incerto.
