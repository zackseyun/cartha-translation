  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּנִיֵּאל֙ עַל לִבּ֔/וֹ אֲשֶׁ֧ר לֹֽא יִתְגָּאַ֛ל בְּ/פַתְבַּ֥ג הַ/מֶּ֖לֶךְ וּ/בְ/יֵ֣ין מִשְׁתָּ֑י/ו וַ/יְבַקֵּשׁ֙ מִ/שַּׂ֣ר הַ/סָּרִיסִ֔ים אֲשֶׁ֖ר לֹ֥א יִתְגָּאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/008.yaml
  text: But Daniel resolved in his heart that he would not defile himself with the king’s food or with the wine he drank[a], and he sought permission from the chief of the eunuchs that he might not defile himself.
translation:
  language: pt
  text: Daniel, porém, resolveu, em seu coração, não se contaminar com a comida do rei nem com o vinho que o rei bebia. E pediu ao chefe dos eunucos[a] que lhe permitisse não se contaminar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «chefe dos altos funcionários da corte»; o termo hebraico pode designar tanto eunucos propriamente ditos como altos funcionários reais em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... עַל לִבּוֹ
  choice: decidiu no coração
  rationale: Preserva o caráter interior e volitivo do idiomatismo hebraico, literalmente «pôs sobre o coração», em português natural.
- source_word: יִתְגָּאַל
  choice: se contaminar
  rationale: Mantém a força moral e ritual do hitpael sem determinar se a contaminação seria alimentar, cerimonial ou ligada à idolatria.
- source_word: פַּתְבַּג
  choice: comida
  rationale: Designa as provisões fornecidas pelo rei; «comida» é clara e não exagera o possível caráter luxuoso dos alimentos.
- source_word: יֵין מִשְׁתָּיו
  choice: o vinho que ele bebia
  rationale: Reproduz de modo idiomático a expressão «vinho de seu beber/banquete», entendendo o pronome como referente ao rei.
- source_word: שַׂר הַסָּרִיסִים
  choice: chefe dos eunucos
  rationale: Conserva o sentido lexical tradicional e transparente de סָרִיס, registrando em nota a possível acepção mais ampla de alto funcionário da corte.
- source_word: וַיְבַקֵּשׁ
  choice: pediu ... que lhe permitisse
  rationale: Explicita naturalmente a autorização implícita no pedido dirigido a um superior, sem alterar seu conteúdo.
- source_word: אֲשֶׁר לֹא יִתְגָּאָל
  choice: que lhe permitisse não se contaminar
  rationale: Expressa o conteúdo e a finalidade do pedido em português corrente.
theological_decisions:
- issue: Natureza da contaminação associada às provisões reais
  choice: Usar «se contaminar» sem explicar a causa precisa.
  alternative: Especificar impureza cerimonial, transgressão das leis alimentares ou associação com idolatria.
  rationale: O hebraico não informa neste versículo por que a comida e o vinho causariam contaminação; a formulação ampla preserva essa tensão interpretativa.
- issue: Sentido de סָרִיסִים
  choice: Traduzir «eunucos» no texto principal e registrar «altos funcionários da corte» em nota.
  alternative: Traduzir diretamente «funcionários da corte».
  rationale: O termo pode indicar eunucos literais ou funcionários palacianos. A tradução principal mantém seu sentido lexical distintivo, enquanto a nota preserva a ambiguidade histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Porém» marca o contraste com o contexto anterior; «Por isso» torna natural a relação entre a decisão interior e o pedido subsequente. O marcador [a] aparece imediatamente após o termo a que se refere.
