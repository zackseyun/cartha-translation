source:
  edition: WLC
  text: וַ/יְהִ֥י בָ/הֶ֖ם מִ/בְּנֵ֣י יְהוּדָ֑ה דָּנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/006.yaml
  text: And among them[a], from the sons of Judah, were Daniel, Hananiah, Mishael, and Azariah.
translation:
  language: pt
  text: Entre eles, dos filhos de Judá[a], estavam Daniel, Hananias, Misael e Azarias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos judeus”. O hebraico diz, mais literalmente, “dos filhos de Judá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: estavam
  rationale: A forma narrativa de היה introduz aqui uma declaração de existência ou pertencimento. Em português, “estavam” expressa isso naturalmente sem o literalismo excessivo de “e aconteceu que havia”.
- source_word: בָהֶם
  choice: entre eles
  rationale: Neste contexto, ב com sufixo indica inclusão no grupo mencionado anteriormente; “entre eles” é idiomático e preciso.
- source_word: מִבְּנֵי יְהוּדָה
  choice: dos filhos de Judá
  rationale: Preserva de perto a expressão hebraica בני יהודה e sua referência ao povo ou linhagem de Judá, sem substituí-la silenciosamente pelo termo geográfico posterior “judeus”.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: חֲנַנְיָה
  choice: Hananias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מִישָׁאֵל
  choice: Misael
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַעֲזַרְיָה
  choice: e Azarias
  rationale: A conjunção liga o último nome da lista; “Azarias” é a forma tradicional em português.
