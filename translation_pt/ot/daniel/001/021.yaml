  text: And Daniel remained until the first year of King Cyrus[a].
translation:
  language: pt
  text: E Daniel permaneceu até o primeiro ano do rei Ciro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Daniel esteve até o primeiro ano do rei Ciro.” O verbo hebraico é literalmente “foi” ou “esteve”, mas aqui provavelmente indica permanência contínua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: permaneceu
  rationale: Embora o verbo signifique literalmente “e ele foi/estava”, com sujeito pessoal e a indicação temporal introduzida por עַד, “permaneceu” expressa naturalmente a continuidade da presença de Daniel.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַד
  choice: até
  rationale: Preposição temporal que indica continuidade até determinado ponto.
- source_word: שְׁנַת אַחַת
  choice: o primeiro ano
  rationale: Neste contexto de datação régia, a expressão com o cardinal “um” tem sentido ordinal e se refere ao primeiro ano de reinado.
- source_word: לְכוֹרֶשׁ
  choice: de Ciro
  rationale: Na fórmula de datação régia, a preposição לְ identifica o governante a cujo reinado pertence o ano mencionado.
- source_word: הַמֶּלֶךְ
  choice: rei
  rationale: A construção “rei Ciro” é natural em português e preserva explicitamente o título real do hebraico.
