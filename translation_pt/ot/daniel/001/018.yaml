  text: וּ/לְ/מִ/קְצָת֙ הַ/יָּמִ֔ים אֲשֶׁר אָמַ֥ר הַ/מֶּ֖לֶךְ לַ/הֲבִיאָ֑/ם וַ/יְבִיאֵ/ם֙ שַׂ֣ר הַ/סָּרִיסִ֔ים לִ/פְנֵ֖י נְבֻכַדְנֶצַּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/018.yaml
  text: And at the end of the days that the king had said to bring them in[a], the chief of the eunuchs brought them before Nebuchadnezzar.
translation:
  language: pt
  text: Ao fim dos dias que o rei havia determinado para que fossem trazidos à sua presença, o chefe dos eunucos[a] os levou à presença de Nabucodonosor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o chefe dos oficiais da corte”. O termo hebraico pode designar um eunuco ou, em sentido mais amplo, um oficial da corte real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִקְצָת הַיָּמִים
  choice: Ao fim dos dias
  rationale: Expressa o término do período especificado e mantém a imagem concreta do plural hebraico, em linguagem portuguesa natural.
- source_word: אֲשֶׁר אָמַר הַמֶּלֶךְ
  choice: que o rei havia determinado
  rationale: Embora אָמַר signifique literalmente “disse”, neste contexto a fala do rei estabelece o prazo mencionado em Daniel 1:5; “havia determinado” comunica essa força contextual sem recorrer ao sentido mais forte de “ordenado”.
- source_word: לַהֲבִיאָם
  choice: para que fossem trazidos à sua presença
  rationale: O hifil de בוא significa fazer vir ou trazer. A explicitação “à sua presença” decorre do cenário de apresentação ao rei e produz uma formulação natural, sem substituir o verbo pelo mais interpretativo “apresentar”.
- source_word: וַיְבִיאֵם
  choice: os levou
  rationale: Traduz diretamente a ação causativa de conduzi-los, evitando em português a repetição próxima de “trazidos”.
- source_word: שַׂר הַסָּרִיסִים
  choice: o chefe dos eunucos
  rationale: Preserva o sentido lexical mais direto e a terminologia da corte; a possibilidade de designar mais amplamente oficiais palacianos é registrada em nota.
- source_word: לִפְנֵי
  choice: à presença de
  rationale: Comunica naturalmente em português o sentido de comparecer diante de uma autoridade.
- source_word: נְבֻכַדְנֶצַּר
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
