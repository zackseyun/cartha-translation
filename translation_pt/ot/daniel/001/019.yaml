base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/019.yaml
  text: The king spoke with them[a], and among them all no one was found like Daniel, Hananiah, Mishael, and Azariah; so they stood before the king.
translation:
  language: pt
  text: O rei falou com eles, e, entre todos, não se encontrou ninguém como Daniel, Hananias, Misael e Azarias; assim, eles se puseram diante do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passaram a servir ao rei”. A expressão hebraica traduzida literalmente por “puseram-se diante do rei” pode indicar serviço na presença real.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם
  choice: falou com eles
  rationale: Traduz de modo direto a conversa pessoal indicada por דִּבֵּר com אִתָּם, sem acrescentar a ideia mais interpretativa de uma entrevista formal.
- source_word: וְלֹא נִמְצָא מִכֻּלָּם
  choice: entre todos, não se encontrou ninguém
  rationale: Preserva o passivo de מָצָא e expressa naturalmente em português a comparação com o grupo inteiro.
- source_word: כְּדָנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: como Daniel, Hananias, Misael e Azarias
  rationale: כְּ introduz uma comparação. Os nomes seguem suas formas portuguesas tradicionais e reconhecíveis, próximas das formas hebraicas.
- source_word: וַיַּעַמְדוּ
  choice: assim, eles se puseram
  rationale: Mantém a imagem literal de עָמַד, “pôr-se de pé/estar”, enquanto “assim” comunica a consequência narrativa no contexto.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante do rei
  rationale: Preserva tanto o sentido espacial de estar na presença do rei quanto a possível nuance cortesã de servi-lo.
