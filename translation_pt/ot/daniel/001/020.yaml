id: DAN.1.20
reference: Daniel 1:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כֹ֗ל דְּבַר֙ חָכְמַ֣ת בִּינָ֔ה אֲשֶׁר בִּקֵּ֥שׁ מֵ/הֶ֖ם הַ/מֶּ֑לֶךְ וַֽ/יִּמְצָאֵ֞/ם עֶ֣שֶׂר יָד֗וֹת עַ֤ל כָּל הַֽ/חַרְטֻמִּים֙ הָֽ/אַשָּׁפִ֔ים אֲשֶׁ֖ר בְּ/כָל מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/020.yaml
  text: And in every matter of wisdom and understanding that the king asked of them[b][a], he found them ten times better than all the magicians and enchanters who were in all his kingdom.
translation:
  language: pt
  text: E em toda questão de sabedoria e entendimento sobre a qual o rei os consultou, ele os achou dez vezes superiores[a] a todos os magos e encantadores[b] que havia em todo o seu reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dez mãos acima”. A expressão hebraica indica uma superioridade marcante.
    reason: lexical_alternative
  - marker: b
    text: Ou “astrólogos”. O segundo termo designa uma classe de sábios babilônicos, mas seu equivalente exato em português é incerto.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹל דְּבַר
  choice: E em toda questão
  rationale: A expressão introduz, em ligação com o versículo anterior, cada assunto sobre o qual eles foram avaliados; “questão” é natural em português nesse contexto de consulta.
- source_word: חָכְמַת בִּינָה
  choice: de sabedoria e entendimento
  rationale: Preserva distintamente os dois substantivos hebraicos em uma combinação clara e corrente.
- source_word: אֲשֶׁר בִּקֵּשׁ מֵהֶם הַמֶּלֶךְ
  choice: sobre a qual o rei os consultou
  rationale: בקשׁ com מן, neste contexto de exame e consulta, indica aquilo que o rei procurou saber deles; “consultou” comunica isso com naturalidade sem sugerir um simples pedido.
- source_word: וַיִּמְצָאֵם
  choice: ele os achou
  rationale: Mantém o sentido avaliativo do verbo e seu objeto direto, indicando a conclusão do rei.
- source_word: עֶשֶׂר יָדוֹת עַל
  choice: dez vezes superiores
  rationale: Traduz de modo idiomático a expressão literalmente formada por “dez mãos acima”, preservando tanto o número quanto a forte comparação.
- source_word: הַחַרְטֻמִּים
  choice: os magos
  rationale: Designa especialistas da corte ligados a saberes sagrados ou ocultos; “magos” é conciso, conhecido e adequado ao contexto babilônico.
- source_word: הָאַשָּׁפִים
  choice: encantadores
  rationale: O termo designa outra classe de sábios babilônicos, provavelmente ligada a encantamentos, embora sua equivalência exata seja incerta.
- source_word: אֲשֶׁר בְּכָל מַלְכוּתוֹ
  choice: que havia em todo o seu reino
  rationale: Expressa com clareza que esses especialistas se encontravam por toda a extensão do reino.
theological_decisions:
- issue: Designação das classes de especialistas da corte babilônica
  choice: magos e encantadores
  alternative: magos e astrólogos
  rationale: A formulação preserva o contraste com a sabedoria de Daniel e seus companheiros sem atribuir precisão técnica excessiva a termos hebraicos cuja identificação exata é debatida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Questão”, “consultou” e “superiores” tornam natural a avaliação da corte, enquanto as notas preservam o idioma hebraico e a incerteza lexical.
