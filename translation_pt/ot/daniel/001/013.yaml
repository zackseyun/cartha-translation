  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יֵרָא֤וּ לְ/פָנֶ֨י/ךָ֙ מַרְאֵ֔י/נוּ וּ/מַרְאֵה֙ הַ/יְלָדִ֔ים הָ/אֹ֣כְלִ֔ים אֵ֖ת פַּתְבַּ֣ג הַ/מֶּ֑לֶךְ וְ/כַ/אֲשֶׁ֣ר תִּרְאֵ֔ה עֲשֵׂ֖ה עִם עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/013.yaml
  text: Then let our appearance and the appearance of the youths who are eating the king’s food be seen before you[a], and according to what you see, deal with your servants.
translation:
  language: pt
  text: Então, que a nossa aparência e a aparência dos jovens que comem a comida do rei[a] sejam vistas por você; e, conforme o que você vir, trate os seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a porção do rei” ou “as iguarias do rei”. O termo hebraico se refere às provisões reais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרָאוּ
  choice: sejam vistas
  rationale: O nifal com valor jussivo apresenta a aparência dos dois grupos como objeto da observação. A formulação mantém a voz passiva do hebraico sem acrescentar explicitamente a ideia de exame.
- source_word: לְפָנֶיךָ
  choice: por você
  rationale: A expressão hebraica significa literalmente “diante de você”, mas, ligada a “sejam vistas”, o português natural pede “por você” para indicar que o oficial fará a observação.
- source_word: מַרְאֵינוּ וּמַרְאֵה הַיְלָדִים
  choice: a nossa aparência e a aparência dos jovens
  rationale: מַרְאֶה indica o aspecto visível, e יְלָדִים, neste contexto de formação na corte, designa jovens, não necessariamente crianças pequenas.
- source_word: הָאֹכְלִים
  choice: que comem
  rationale: O particípio descreve a prática contínua ou habitual do outro grupo; o presente simples expressa isso naturalmente em português.
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: a comida do rei
  rationale: O empréstimo persa designa as provisões ou a comida fornecida pela mesa real. “Comida do rei” é claro e evita interpretar excessivamente como iguarias.
- source_word: וְכַאֲשֶׁר תִּרְאֵה
  choice: e, conforme o que você vir
  rationale: A frase deixa a decisão a cargo da observação posterior do oficial e preserva a relação explícita entre o que ele verá e como deverá agir.
- source_word: עֲשֵׂה עִם עֲבָדֶיךָ
  choice: trate os seus servos
  rationale: A construção idiomática עשה עם significa agir ou proceder com alguém. “Trate” é natural em português, enquanto “seus servos” conserva o tratamento deferente usado por Daniel.
theological_decisions:
- issue: Sentido contextual de עֲבָדֶיךָ
  choice: seus servos
  alternative: seus escravos
  rationale: Daniel emprega linguagem deferente perante um oficial da corte. Embora עֶבֶד possa designar uma pessoa escravizada, o vínculo jurídico ou social não é o foco desta frase; “servos” preserva melhor a função retórica sem eliminar a possível condição subordinada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção passiva foi mantida para refletir a forma hebraica, enquanto “por você” evita a rigidez pouco idiomática de “diante de você” após “sejam vistas”.
