  source_fidelity: 'O texto transmite com precisão a proposta de Daniel: comparar a aparência dele e de seus companheiros com a dos jovens que consomem as provisões reais e, com base nessa observação, agir para com os servos. A passiva jussiva em “sejam vistas por você” representa adequadamente וְיֵרָאוּ לְפָנֶיךָ, sem introduzir a nuance adicional de “examinar”.'
