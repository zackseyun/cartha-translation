base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/011.yaml
  text: Then Daniel said to the steward whom the chief of the eunuchs had appointed over Daniel[a], Hananiah, Mishael, and Azariah,
translation:
  language: pt
  text: 'Então Daniel disse ao encarregado que o chefe dos eunucos[a] havia designado para cuidar de Daniel, Hananias, Misael e Azarias:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe dos oficiais da corte”; o termo hebraico traduzido como “eunucos” pode, em alguns contextos, referir-se de modo mais amplo a funcionários da corte real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: הַמֶּלְצַר
  choice: o encarregado
  rationale: O termo provavelmente designa o funcionário diretamente responsável pelos jovens. “Encarregado” é claro em português e se ajusta à função de supervisão indicada pelo contexto.
- source_word: אֲשֶׁר מִנָּה
  choice: que ... havia designado
  rationale: A construção identifica o encarregado por sua designação anterior; o mais-que-perfeito composto deixa clara essa anterioridade.
- source_word: שַׂר הַסָּרִיסִים
  choice: o chefe dos eunucos
  rationale: É a tradução mais direta do hebraico, preservando na nota a possibilidade de que סָרִיסִים designe mais amplamente funcionários da corte.
- source_word: עַל
  choice: para cuidar de
  rationale: Neste contexto de nomeação, a preposição indica responsabilidade sobre os jovens. A formulação natural em português evita a rigidez de “sobre Daniel...” sem perder a ideia de supervisão.
- source_word: דָּנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: Daniel, Hananias, Misael e Azarias
  rationale: Mantêm-se os nomes hebraicos usados pelo texto-fonte, em suas formas portuguesas tradicionais e reconhecíveis.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. “Encarregado” comunica a função do oficial sem recorrer a transliteração obscura; os dois-pontos refletem que a fala de Daniel continua no versículo seguinte.
