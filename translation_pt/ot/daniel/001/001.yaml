  text: בִּ/שְׁנַ֣ת שָׁל֔וֹשׁ לְ/מַלְכ֖וּת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֑ה בָּ֣א נְבוּכַדְנֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל יְרוּשָׁלִַ֖ם וַ/יָּ֥צַר עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/001.yaml
  text: In the third year of the reign of Jehoiakim king of Judah[b][a], Nebuchadnezzar king of Babylon came to Jerusalem and besieged it.
translation:
  language: pt
  text: No terceiro ano do reinado de Jeoaquim, rei de Judá, Nabucodonosor, rei da Babilônia, veio a Jerusalém e a sitiou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e pôs cerco contra ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שָׁל֔וֹשׁ לְ/מַלְכ֖וּת
  choice: No terceiro ano do reinado de
  rationale: A expressão hebraica é uma fórmula de datação régia. Em português natural, o numeral cardinal hebraico é expresso como ordinal neste contexto.
- source_word: יְהוֹיָקִים
  choice: Jeoaquim
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶֽלֶךְ יְהוּדָ֑ה
  choice: rei de Judá
  rationale: Preserva a aposição hebraica e identifica o cargo e o reino de Jeoaquim sem exigir artigo.
- source_word: בָּ֣א
  choice: veio
  rationale: Tradução direta do verbo בוא; evita acrescentar a ideia interpretativa de uma marcha militar, enquanto o verbo seguinte explicita a hostilidade.
- source_word: נְבוּכַדְנֶאצַּ֧ר
  choice: Nabucodonosor
  rationale: Forma consagrada e prontamente reconhecível em português para o nome presente no texto hebraico.
- source_word: מֶֽלֶךְ בָּבֶ֛ל
  choice: rei da Babilônia
  rationale: Aposição natural em português; o artigo em 'da Babilônia' corresponde ao uso idiomático moderno.
- source_word: יְרוּשָׁלִַ֖ם
  choice: Jerusalém
  rationale: Forma portuguesa convencional do topônimo.
- source_word: וַ/יָּ֥צַר עָלֶֽי/הָ
  choice: e a sitiou
  rationale: No contexto militar, צור com על significa cercar ou sitiar uma cidade. 'Sitiou' é conciso, preciso e retoma corretamente 'Jerusalém' com pronome feminino.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais dos nomes bíblicos. A ordem da frase acompanha de perto o hebraico, mas a pontuação e as construções são naturais em português. Não se reproduziu a nota inglesa sobre a variante de Nabucodonosor, pois ela trata especificamente de tradições ortográficas inglesas e não representa uma ambiguidade relevante para o leitor em português.
