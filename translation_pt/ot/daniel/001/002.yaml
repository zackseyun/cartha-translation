source:
  edition: WLC
  text: וַ/יִּתֵּן֩ אֲדֹנָ֨/י בְּ/יָד֜/וֹ אֶת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֗ה וּ/מִ/קְצָת֙ כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יְבִיאֵ֥/ם אֶֽרֶץ שִׁנְעָ֖ר בֵּ֣ית אֱלֹהָ֑י/ו וְ/אֶת הַ/כֵּלִ֣ים הֵבִ֔יא בֵּ֖ית אוֹצַ֥ר אֱלֹהָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/002.yaml
  text: And the Lord gave Jehoiakim king of Judah into his hand[a], along with some of the vessels of the house of God. He brought them to the land of Shinar, to the house of his god[c][b], and he brought the vessels into the treasury of his god.
translation:
  language: pt
  text: E o Senhor entregou Jeoaquim, rei de Judá, nas mãos dele,[a] junto com parte dos utensílios da casa de Deus. Ele os levou para a terra de Sinar,[b] para a casa do seu deus,[c] e levou os utensílios para a tesouraria do seu deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deu Jeoaquim, rei de Judá, em sua mão”. A expressão também pode ser traduzida por “pôs Jeoaquim, rei de Judá, sob o poder dele”.
    reason: lexical_alternative
  - marker: b
    text: Sinar é o nome antigo da Babilônia.
    reason: cultural_note
  - marker: c
    text: Ou “para o templo do seu deus”. O hebraico usa “casa” tanto para a casa de Deus como para a casa da divindade babilônica; “tesouraria” também pode ser traduzido por “depósito do tesouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: O texto consonantal traz אֲדֹנָי, não o nome divino YHWH. “O Senhor” é, portanto, a correspondência direta, sem empregar a convenção “SENHOR” reservada ao tetragrama.
- source_word: וַיִּתֵּן ... בְּיָדוֹ
  choice: entregou ... nas mãos dele
  rationale: נתן significa literalmente “dar”, mas, com בְּיָדוֹ neste contexto, expressa entregar alguém ao poder de outro. A formulação portuguesa mantém a imagem concreta das mãos e comunica naturalmente a transferência de poder.
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Jeoaquim, rei de Judá
  rationale: Emprega a forma portuguesa corrente do nome e conserva o título real em aposição.
- source_word: וּמִקְצָת כְּלֵי בֵית הָאֱלֹהִים
  choice: junto com parte dos utensílios da casa de Deus
  rationale: מִקְצָת indica uma parte do conjunto, e כְּלֵי designa objetos ou utensílios. “Casa de Deus” preserva בֵית e o paralelo literário posterior com a casa do deus babilônico.
- source_word: וַיְבִיאֵם
  choice: Ele os levou
  rationale: O sufixo masculino plural é mantido por “os”, sem explicitar além do hebraico se abrange Jeoaquim e os utensílios em conjunto; a sequência narrativa permite conservar essa amplitude referencial.
- source_word: אֶרֶץ שִׁנְעָר
  choice: a terra de Sinar
  rationale: אֶרֶץ é traduzido expressamente por “terra”, e o topônimo antigo שִׁנְעָר é transliterado na forma portuguesa “Sinar”.
- source_word: בֵּית אֱלֹהָיו
  choice: a casa do seu deus
  rationale: A tradução formal de בֵּית como “casa” preserva o contraste deliberado com “a casa de Deus”. “deus” fica em minúscula porque designa a divindade do rei babilônico.
- source_word: בֵּית אוֹצַר אֱלֹהָיו
  choice: a tesouraria do seu deus
  rationale: אוֹצָר pode denotar tesouro, depósito ou tesouraria. “Tesouraria” comunica aqui o recinto onde se guardavam objetos valiosos, e a repetição de “levou” conserva a repetição hebraica.
theological_decisions:
- issue: Soberania divina na queda de Jerusalém
  choice: O Senhor entregou ativamente Jeoaquim nas mãos do rei babilônico.
  alternative: O Senhor apenas permitiu que Jeoaquim fosse capturado.
  rationale: Com Deus como sujeito, נתן apresenta sua agência no acontecimento. A tradução não enfraquece essa afirmação para mera permissão nem tenta resolver a tensão teológica que ela produz.
- issue: Referência plural em וַיְבִיאֵם
  choice: Manter o pronome plural “os” sem restringir expressamente seu referente.
  alternative: Fazer o pronome referir-se apenas aos utensílios, ou explicitar “Jeoaquim e os utensílios”.
  rationale: A forma hebraica admite leitura coletiva à luz do objeto composto anterior, enquanto a menção subsequente dos utensílios pode favorecer uma referência mais estreita. O pronome português conserva a ambiguidade contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações e a repetição verbal seguem de perto o hebraico, enquanto “entregou” torna natural em português o idioma “deu ... nas mãos”. Os pronomes permanecem contextuais, sem inserir no versículo o nome Nabucodonosor, que vem do versículo anterior.
