id: DAN.1.17
reference: Daniel 1:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/יְלָדִ֤ים הָ/אֵ֨לֶּה֙ אַרְבַּעְתָּ֔/ם נָתַ֨ן לָ/הֶ֧ם הָֽ/אֱלֹהִ֛ים מַדָּ֥ע וְ/הַשְׂכֵּ֖ל בְּ/כָל סֵ֣פֶר וְ/חָכְמָ֑ה וְ/דָנִיֵּ֣אל הֵבִ֔ין בְּ/כָל חָז֖וֹן וַ/חֲלֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/017.yaml
  text: As for these four youths[a], God gave them knowledge and insight in every kind of literature and wisdom[b]; and Daniel had understanding in every vision and dream.
translation:
  language: pt
  text: Quanto a esses quatro jovens, Deus lhes deu conhecimento e discernimento em todo tipo de literatura[a] e sabedoria; e Daniel tinha entendimento sobre toda visão e todo sonho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em todo livro”; a expressão hebraica provavelmente se refere de modo mais amplo aos escritos ou ao saber literário.
    reason: lexical_alternative
  - marker: b
    text: Ou “Daniel compreendia toda visão e todo sonho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: jovens
  rationale: No contexto de formação na corte, “jovens” preserva a pouca idade relativa sem soar infantil como “crianças” nem excessivamente específico.
- source_word: הָאֵלֶּה אַרְבַּעְתָּם
  choice: esses quatro
  rationale: Reproduz naturalmente o demonstrativo e o numeral; o sufixo pronominal hebraico não precisa de expressão separada em português.
- source_word: נָתַן לָהֶם הָאֱלֹהִים
  choice: Deus lhes deu
  rationale: Mantém explícitos o agente divino e o sentido simples de נתן, com sintaxe natural em português.
- source_word: מַדָּע
  choice: conhecimento
  rationale: Expressa saber ou aprendizado adquirido e combina naturalmente com o termo cognitivo seguinte.
- source_word: הַשְׂכֵּל
  choice: discernimento
  rationale: A forma derivada de שכל comunica compreensão perspicaz ou capacidade de discernir; “discernimento” evita repetição com o entendimento atribuído depois a Daniel.
- source_word: בְּכָל סֵפֶר
  choice: em todo tipo de literatura
  rationale: Embora סֵפֶר signifique literalmente “livro”, neste contexto a expressão provavelmente abrange escritos e saber literário; a nota preserva a leitura mais literal.
- source_word: וְחָכְמָה
  choice: e sabedoria
  rationale: Mantém o sentido comum de חָכְמָה e apresenta a competência sábia como complemento do conhecimento dos escritos.
- source_word: הֵבִין
  choice: tinha entendimento
  rationale: Preserva a nuance de estado ou capacidade do Hifil de בין, sem limitar a declaração apenas ao ato de interpretar.
- source_word: בְּכָל חָזוֹן וַחֲלֹמוֹת
  choice: sobre toda visão e todo sonho
  rationale: Indica a esfera da capacidade especial de Daniel sem afirmar que ele recebeu todas as revelações nem restringir explicitamente o dom à interpretação.
theological_decisions:
- issue: A ação de Deus nas capacidades dos jovens
  choice: O texto atribui diretamente a Deus o conhecimento, o discernimento e a sabedoria concedidos aos quatro jovens.
  alternative: Entender essas capacidades apenas como resultado natural da formação recebida.
  rationale: Deus é o sujeito explícito de נָתַן (“deu”); a tradução mantém essa agência divina sem ampliá-la além do que o versículo afirma.
- issue: A natureza da capacidade de Daniel quanto a visões e sonhos
  choice: Daniel possuía entendimento em relação a visões e sonhos.
  alternative: Afirmar especificamente que Daniel recebeu toda visão e todo sonho, ou limitar a frase à interpretação técnica deles.
  rationale: A construção hebraica declara sua compreensão nesse domínio, mas não especifica por completo se se trata de interpretação, discernimento ou outra forma de entendimento; a formulação preserva essa amplitude.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Quanto a” organiza o tópico sem tornar a frase excessivamente solene; “lhes deu” mantém concisão e naturalidade. As notas ficam junto às expressões a que de fato se referem.
