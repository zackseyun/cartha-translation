  text: וַ/יְהִ֣י הַ/מֶּלְצַ֗ר נֹשֵׂא֙ אֶת פַּתְבָּגָ֔/ם וְ/יֵ֖ין מִשְׁתֵּי/הֶ֑ם וְ/נֹתֵ֥ן לָ/הֶ֖ם זֵרְעֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/016.yaml
  text: So the steward kept taking away their choice food and the wine they were to drink[b][a], and kept giving them vegetables.
translation:
  language: pt
  text: Assim, o encarregado continuou retirando a comida especial e o vinho que eles deveriam beber e dando-lhes vegetais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “legumes”. O hebraico זֵרְעֹנִים se refere a alimentos provenientes de plantas ou sementes, provavelmente vegetais e leguminosas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְצַר
  choice: o encarregado
  rationale: O termo designa o oficial responsável pelas provisões dos jovens. “Encarregado” é natural em português e comunica sua função sem recorrer a uma transliteração técnica.
- source_word: נֹשֵׂא
  choice: continuou retirando
  rationale: O particípio ligado a וַיְהִי expressa ação contínua ou habitual; a formulação indica que essa passou a ser a prática regular.
- source_word: פַּתְבָּגָם
  choice: a comida especial
  rationale: O empréstimo lexical se refere à comida seleta destinada aos jovens, proveniente da mesa real. “Comida especial” preserva a ideia de provisão diferenciada sem acrescentar detalhes ausentes do versículo.
- source_word: יֵין מִשְׁתֵּיהֶם
  choice: o vinho que eles deveriam beber
  rationale: A expressão construta indica o vinho destinado ao consumo deles. Esta redação reproduz o sentido idiomático com clareza.
- source_word: וְנֹתֵן
  choice: e dando-lhes
  rationale: O particípio coordena-se com נֹשֵׂא e compartilha seu valor contínuo ou habitual. A construção com “continuou” rege naturalmente as duas ações em português.
- source_word: זֵרְעֹנִים
  choice: vegetais
  rationale: O termo denota alimentos oriundos de sementes ou plantas, provavelmente incluindo legumes. “Vegetais” é claro e atual, enquanto uma tradução estritamente etimológica seria pouco natural.
