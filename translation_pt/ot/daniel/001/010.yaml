  text: וַ/יֹּ֜אמֶר שַׂ֤ר הַ/סָּרִיסִים֙ לְ/דָ֣נִיֵּ֔אל יָרֵ֤א אֲנִי֙ אֶת אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֲשֶׁ֣ר מִנָּ֔ה אֶת מַאֲכַלְ/כֶ֖ם וְ/אֶת מִשְׁתֵּי/כֶ֑ם אֲשֶׁ֡ר לָ/מָּה֩ יִרְאֶ֨ה אֶת פְּנֵי/כֶ֜ם זֹֽעֲפִ֗ים מִן הַ/יְלָדִים֙ אֲשֶׁ֣ר כְּ/גִֽילְ/כֶ֔ם וְ/חִיַּבְתֶּ֥ם אֶת רֹאשִׁ֖/י לַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/010.yaml
  text: But the chief of the eunuchs said to Daniel[a], “I fear my lord the king, who assigned your food and your drink[c][b]. Why should he see your faces looking worse than the youths who are of your own age? Then you would endanger my head with the king.”
translation:
  language: pt
  text: 'Mas o chefe dos eunucos[a] disse a Daniel: “Tenho medo do meu senhor, o rei, que determinou a comida e a bebida de vocês. Por que ele haveria de ver o rosto de vocês mais abatido[b] do que o dos jovens da mesma idade? Assim, vocês colocariam minha cabeça em risco diante do rei[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe dos oficiais”. O termo hebraico traduzido como “eunucos” também pode designar, de modo mais amplo, oficiais da corte real.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o rosto de vocês abatido”, “sombrio” ou “aflito”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “vocês tornariam minha cabeça responsável perante o rei”; isto é, poriam minha vida em risco diante dele.
    reason: idiom_explanation
lexical_decisions:
- source_word: שַׂר הַסָּרִיסִים
  choice: chefe dos eunucos
  rationale: Traduz diretamente שַׂר como “chefe” e סָרִיסִים como “eunucos”, preservando em nota o sentido mais amplo possível de oficiais da corte.
- source_word: יָרֵא אֲנִי אֶת אֲדֹנִי הַמֶּלֶךְ
  choice: Tenho medo do meu senhor, o rei
  rationale: Expressa de modo natural o temor presente do oficial e mantém o tratamento respeitoso e cortesão de אֲדֹנִי.
- source_word: מִנָּה
  choice: determinou
  rationale: O verbo indica que o rei estabeleceu ou designou as provisões; “determinou” comunica sua autoridade sem acrescentar detalhes.
- source_word: מַאֲכַלְכֶם וְאֶת מִשְׁתֵּיכֶם
  choice: a comida e a bebida de vocês
  rationale: Mantém os termos gerais do hebraico e não especifica “vinho” onde este versículo diz apenas “bebida”.
- source_word: לָמָּה יִרְאֶה
  choice: Por que ele haveria de ver
  rationale: Reproduz a pergunta retórica sobre uma consequência temida e soa corrente em português.
- source_word: פְּנֵיכֶם זֹעֲפִים
  choice: o rosto de vocês mais abatido
  rationale: “Abatido” preserva a ideia de uma aparência visivelmente desfavorável, sombria ou aflita; a nota registra alternativas mais literais.
- source_word: מִן הַיְלָדִים אֲשֶׁר כְּגִילְכֶם
  choice: do que o dos jovens da mesma idade
  rationale: Transmite com clareza a comparação com os demais jovens da faixa etária deles.
- source_word: וְחִיַּבְתֶּם אֶת רֹאשִׁי לַמֶּלֶךְ
  choice: Assim, vocês fariam com que eu respondesse com a cabeça perante o rei
  rationale: Preserva a imagem hebraica vívida da cabeça posta em responsabilidade e deixa claro que o oficial teria de prestar contas ao rei, com risco de vida explicitado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A tradução conserva o registro cortesão e a imagem concreta de “responder com a cabeça”, esclarecida em nota, sem suavizar o perigo implícito.
