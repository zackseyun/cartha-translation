reference: Daniel 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/דָרְיָ֨וֶשׁ֙ מָֽדָיָ֔/א קַבֵּ֖ל מַלְכוּתָ֑/א כְּ/בַ֥ר שְׁנִ֖ין שִׁתִּ֥ין וְ/תַרְתֵּֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/001.yaml
  text: And Darius the Mede received the kingdom[a], being about sixty-two years old.
translation:
  language: pt
  text: E Dario, o medo, recebeu o reino[a] quando tinha cerca de sessenta e dois anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tomou o reino». O verbo aramaico tem sentido amplo, mas «recebeu» reflete mais de perto sua acepção usual e evita indicar um modo específico de ascensão ao poder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָרְיָוֶשׁ
  choice: E Dario
  rationale: A conjunção aramaica é preservada como ligação narrativa simples, sem especificar uma relação temporal ou lógica mais forte; o nome próprio segue a forma tradicional em português.
- source_word: מָדָיָא
  choice: o medo
  rationale: O gentílico identifica a origem étnica ou nacional de Dario. «O medo» é a forma bíblica tradicional e ainda compreensível em português, sem confundi-la com o substantivo «medo» graças ao contexto e à pontuação.
- source_word: קַבֵּל
  choice: recebeu
  rationale: O verbo aramaico tem como sentido comum «receber». Esta escolha permanece próxima do texto e não sugere indevidamente que Dario conquistou ou usurpou o reino.
- source_word: מַלְכוּתָא
  choice: o reino
  rationale: «Reino» expressa de modo natural o domínio ou governo real neste contexto narrativo, embora o termo também possa designar a realeza ou o poder régio.
- source_word: כְּבַר שְׁנִין
  choice: quando tinha cerca de ... anos
  rationale: A fórmula idiomática de idade, literalmente relacionada a «filho de ... anos», é vertida em português corrente; «cerca de» preserva a aproximação.
- source_word: שִׁתִּין וְתַרְתֵּין
  choice: sessenta e dois
  rationale: Os numerais são apresentados na forma padrão do português contemporâneo.
theological_decisions:
- issue: Natureza da ascensão de Dario ao poder
  choice: recebeu o reino
  alternative: tomou o reino
  rationale: «Recebeu» acompanha mais diretamente o verbo aramaico e mantém em aberto se o reino lhe foi entregue, conferido, herdado ou obtido por outro meio, sem resolver debates históricos ou interpretativos que o versículo não esclarece.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem da frase permanece próxima do aramaico, enquanto a expressão de idade é vertida idiomaticamente. As vírgulas em «Dario, o medo,» deixam claro que «o medo» é um gentílico em aposição.
