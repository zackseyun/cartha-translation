  yaml_path: translation/ot/daniel/006/026.yaml
  text: 'Then King Darius wrote to all the peoples[a], nations[b], and languages that dwell in all the earth: “May your peace abound.”'
translation:
  language: pt
  text: 'Então o rei Dario escreveu a todos os povos, nações e línguas que habitam em toda a terra[b]: “Que a paz de vocês seja multiplicada[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que a paz de vocês aumente cada vez mais.”'
    reason: lexical_alternative
  - marker: b
    text: “Em toda a terra” reproduz a expressão aramaica; no contexto, refere-se à extensão completa dos domínios imperiais de Dario.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: o rei Dario
  rationale: Segue a ordem idiomática normal do português para título e nome.
- source_word: כְּתַב
  choice: escreveu
  rationale: Traduz diretamente o verbo, sem explicitar como decreto aquilo que o texto apenas diz que foi escrito.
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: a todos os povos, nações e línguas
  rationale: Preserva a fórmula tríplice de Daniel e sua abrangência imperial; “línguas” mantém a imagem concreta do aramaico.
- source_word: דִּי דארין
  choice: que habitavam
  rationale: Expressa a residência dos destinatários em linguagem corrente e concorda com a referência narrativa ao edito de Dario.
- source_word: בְּכָל אַרְעָא
  choice: em toda a terra
  rationale: Conserva a amplitude retórica de אַרְעָא sem restringi-la interpretativamente a “reino” ou “império”.
- source_word: שְׁלָמְכוֹן
  choice: a paz de vocês
  rationale: Mantém explícito o possessivo plural e comunica tanto paz como bem-estar numa fórmula de saudação.
- source_word: יִשְׂגֵּא
  choice: seja multiplicada
  rationale: Reproduz a ideia de aumento presente no verbo e preserva o tom solene de uma saudação real.
