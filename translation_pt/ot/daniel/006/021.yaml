base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/021.yaml
  text: And when he came near the den[a], he cried out to Daniel with a distressed voice. The king spoke and said to Daniel, “Daniel, servant of the living God, has your God, whom you continually serve[c][b], been able to deliver you from the lions?”
translation:
  language: pt
  text: 'Quando chegou perto da cova, gritou para Daniel com voz angustiada.[a] O rei disse a Daniel: “Daniel, servo[b] do Deus vivo, será que o seu Deus, a quem você serve continuamente,[c] pôde livrá-lo dos leões?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com voz triste” ou “com voz aflita”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “escravo”. Neste contexto, “servo” ressalta a dedicação leal de Daniel a Deus.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a quem você adora continuamente”. O verbo aramaico pode indicar serviço religioso ou adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמִקְרְבֵהּ
  choice: Quando chegou perto
  rationale: A construção marca uma circunstância temporal e movimento de aproximação; esta formulação é natural e mantém o sentido concreto.
- source_word: גֻבָּא
  choice: cova
  rationale: No contexto dos leões, “cova” é a designação tradicional e clara em português para o recinto ou fosso.
- source_word: בְּקָל עֲצִיב
  choice: com voz angustiada
  rationale: עֲצִיב comunica dor, aflição ou tristeza; “angustiada” expressa de modo natural o estado emocional audível do rei.
- source_word: זְעִק
  choice: gritou
  rationale: O verbo indica um clamor em voz alta e urgente, bem expresso por “gritou”.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: O rei falou e disse
  rationale: A fórmula aramaica introduz a fala do rei; “falou e disse” preserva sua estrutura sem sugerir necessariamente uma resposta a uma fala anterior.
- source_word: עֲבֵד אֱלָהָא חַיָּא
  choice: servo do Deus vivo
  rationale: עֲבֵד pode significar servo ou escravo, mas aqui funciona como designação respeitosa da dedicação de Daniel a Deus.
- source_word: דִּי אנתה פָּלַח לֵהּ בִּתְדִירָא
  choice: a quem você serve continuamente
  rationale: פָּלַח denota serviço religioso e pode incluir adoração; “serve” mantém a amplitude semântica e a relação lexical com “servo”, enquanto בִּתְדִירָא indica constância.
- source_word: הַיְכִל לְשֵׁיזָבוּתָךְ
  choice: pôde livrá-lo
  rationale: A pergunta indaga se Deus demonstrou capacidade de realizar o livramento; o pretérito perfeito é idiomático em português neste momento narrativo.
- source_word: מִן אַרְיָוָתָא
  choice: dos leões
  rationale: Tradução direta e natural da expressão aramaica.
theological_decisions:
- issue: Relação de Daniel com Deus em עֲבֵד אֱלָהָא
  choice: servo do Deus vivo
  alternative: escravo do Deus vivo
  rationale: Embora o termo possa designar um escravo, o contexto o emprega como título respeitoso de lealdade e serviço religioso, sem salientar a condição social ou jurídica de escravidão.
- issue: Sentido religioso de פָּלַח
  choice: a quem você serve continuamente
  alternative: a quem você adora continuamente
  rationale: “Serve” preserva o sentido mais amplo de devoção constante e o vínculo verbal com “servo”; a nota registra a possível tradução por “adora”.
- issue: Forma da pergunta sobre a capacidade divina
  choice: será que o seu Deus ... pôde livrá-lo
  alternative: o seu Deus ... foi capaz de livrá-lo
  rationale: “Será que” comunica naturalmente a pergunta ansiosa do rei sem afirmar previamente o resultado, preservando a tensão narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea, mantém a fórmula semítica “falou e disse” e preserva a incerteza dramática da pergunta do rei.
