    issue: «gritou por Daniel»
    rationale: A preposição «por» pode ser entendida como pedido ou procura por Daniel. O aramaico indica que o rei clamou dirigindo-se a Daniel; «gritou para Daniel» é mais preciso.
  - severity: low
    issue: «O rei falou e disse»
    rationale: Embora imite a fórmula semítica, a duplicação é pouco natural em português moderno. «O rei disse a Daniel» mantém integralmente a função discursiva da fórmula.
