  text: בֵּ/אדַ֣יִן מַלְכָּ֔/א בִּ/שְׁפַּרְפָּרָ֖/א יְק֣וּם בְּ/נָגְהָ֑/א וּ/בְ/הִ֨תְבְּהָלָ֔ה לְ/גֻבָּ֥/א דִֽי אַרְיָוָתָ֖/א אֲזַֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/020.yaml
  text: Then the king arose at dawn[a], at first light[b], and in haste went to the den of the lions.
translation:
  language: pt
  text: Então o rei se levantou ao romper da aurora[a], à primeira luz, e foi apressadamente[b] à cova dos leões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao raiar do dia, quando clareou”. O versículo emprega duas expressões muito próximas para o amanhecer, dando ênfase ao momento.
    reason: lexical_alternative
  - marker: b
    text: “Apressadamente” também pode transmitir a ideia de alarme ou de urgência ansiosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que dá sequência à narrativa; “Então” é natural e claro em português.
- source_word: מַלְכָּא
  choice: o rei
  rationale: A forma enfática é definida, e o referente já é conhecido no contexto.
- source_word: בִּשְׁפַּרְפָּרָא
  choice: ao romper da aurora
  rationale: Expressa o início do dia; a formulação preserva o tom narrativo digno e distingue esta expressão temporal da seguinte.
- source_word: יְקוּם
  choice: se levantou
  rationale: Equivalente direto e corrente para o verbo que indica levantar-se.
- source_word: בְּנָגְהָא
  choice: à primeira luz
  rationale: Refere-se ao clarear do dia. Mantê-lo como segunda expressão evita eliminar a ênfase produzida pelos dois termos próximos.
- source_word: וּבְהִתְבְּהָלָה
  choice: e foi apressadamente
  rationale: O substantivo comunica pressa, agitação ou urgência ansiosa; o advérbio integra-se naturalmente ao verbo de movimento sem excluir as demais nuances.
- source_word: לְגֻבָּא
  choice: à cova
  rationale: No contexto, designa o recinto onde ficavam os leões; “cova dos leões” é a expressão portuguesa estabelecida e adequada.
- source_word: דִי
  choice: dos
  rationale: A partícula relativa que liga a cova aos leões é expressa naturalmente em português pela construção genitiva.
- source_word: אַרְיָוָתָא
  choice: os leões
  rationale: A forma plural enfática indica os leões definidos e conhecidos da narrativa.
- source_word: אֲזַל
  choice: foi
  rationale: Tradução narrativa direta do verbo aramaico comum para ir.
