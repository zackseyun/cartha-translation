  text: אֱדַ֨יִן סָֽרְכַיָּ֜/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֗/א הֲו֨וֹ בָעַ֧יִן עִלָּ֛ה לְ/הַשְׁכָּחָ֥ה לְ/דָנִיֵּ֖אל מִ/צַּ֣ד מַלְכוּתָ֑/א וְ/כָל עִלָּ֨ה וּ/שְׁחִיתָ֜ה לָא יָכְלִ֣ין לְ/הַשְׁכָּחָ֗ה כָּ/ל קֳבֵל֙ דִּֽי מְהֵימַ֣ן ה֔וּא וְ/כָל שָׁלוּ֙ וּ/שְׁחִיתָ֔ה לָ֥א הִשְׁתְּכַ֖חַת עֲלֽוֹ/הִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/005.yaml
  text: Then the high officials and satraps tried to find grounds for accusing Daniel in matters of the kingdom, but they could find no grounds for accusation or corruption, because he was trustworthy[a], and no negligence[b] or corruption could be found against him.
translation:
  language: pt
  text: Então os altos funcionários e os sátrapas procuraram encontrar motivos para acusar Daniel em questões do reino, mas não conseguiram encontrar nenhum motivo de acusação nem corrupção, porque ele era digno de confiança[a], e não se pôde encontrar contra ele nenhuma negligência[b] nem corrupção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiel” ou “confiável”; o aramaico descreve a conduta segura e constante de Daniel no exercício do cargo.
    reason: lexical_alternative
  - marker: b
    text: Ou “erro”, “lapso” ou “descuido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural no português moderno.
- source_word: סָרְכַיָּא
  choice: altos funcionários
  rationale: Designa autoridades administrativas superiores sem impor um título burocrático posterior excessivamente específico.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: sátrapas
  rationale: Preserva o título histórico persa, reconhecível em português.
- source_word: בָעַיִן ... לְהַשְׁכָּחָה
  choice: procuraram encontrar
  rationale: Reflete a busca deliberada expressa pelo verbo seguido do infinitivo, sem tornar a frase artificial.
- source_word: עִלָּה
  choice: motivos para acusar / motivo de acusação
  rationale: Comunica a ideia de fundamento ou pretexto para uma acusação, não necessariamente de uma acusação formal já apresentada.
- source_word: מִצַּד מַלְכוּתָא
  choice: em questões do reino
  rationale: Indica a esfera da administração real em que procuravam falhas contra Daniel.
- source_word: שְׁחִיתָה
  choice: corrupção
  rationale: Adequa-se ao contexto administrativo e expressa conduta corrupta ou danosa.
- source_word: מְהֵימַן
  choice: digno de confiança
  rationale: Destaca a confiabilidade de Daniel no exercício do cargo sem atribuir necessariamente ao termo um sentido religioso específico.
- source_word: שָׁלוּ
  choice: negligência
  rationale: Expressa uma falha, descuido ou lapso no desempenho administrativo.
- source_word: הִשְׁתְּכַחַת עֲלֹוהִי
  choice: se pôde encontrar contra ele
  rationale: Preserva a orientação forense da preposição no contexto da procura por fundamentos acusatórios.
theological_decisions:
- issue: Natureza da fidelidade de Daniel
  choice: digno de confiança no exercício do cargo
  alternative: fiel; confiável
  rationale: O contexto imediato trata da integridade pública e administrativa de Daniel. A formulação mantém esse foco sem excluir a dimensão moral nem importar uma afirmação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “sátrapas” para preservar o cenário histórico e usa linguagem forense-administrativa natural.
