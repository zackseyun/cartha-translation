  naturalness: O português é claro e de registro apropriado. “Acorreram em grupo ao rei” comunica mais naturalmente a ação coordenada e urgente; “toda proibição ou todo decreto que o rei estabeleça” evita a ambiguidade sintática de um particípio singular após dois substantivos alternativos.
  terminology: “Proibição” e “decreto” são equivalentes aceitáveis e compreensíveis para אֱסָר e קְיָם. A formulação “uma lei dos medos e dos persas” reproduz melhor a construção indefinida do aramaico sem perder o sentido jurídico.
