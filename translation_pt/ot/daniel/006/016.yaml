base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/016.yaml
  text: Then these men came by agreement to the king and said to the king[a], "Know, O king[b], that it is a law of the Medes and Persians that any injunction or statute that the king establishes cannot be changed."
translation:
  language: pt
  text: 'Então aqueles homens[a] acorreram em grupo ao rei e lhe disseram: “Saiba, ó rei, que uma lei dos medos e dos persas determina que toda proibição ou todo decreto[b] que o rei estabeleça não pode ser alterado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pressionaram o rei” ou “vieram de comum acordo contra o rei”. O verbo aramaico pode indicar uma ação coordenada e insistente, não apenas uma aproximação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “interdito ou estatuto”. Os dois termos abrangem diferentes formas de determinações reais com força de lei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo claro e natural em português moderno.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: aqueles homens
  rationale: Retoma os homens hostis já mencionados no contexto; o demonstrativo português funciona naturalmente nessa referência narrativa.
- source_word: הַרְגִּשׁוּ עַל
  choice: foram juntos ao
  rationale: Expressa a ação coordenada e insistente sugerida pelo verbo aramaico sem reduzi-la a uma simples aproximação física; a alternativa possivelmente hostil é preservada em nota.
- source_word: וְאָמְרִין לְמַלְכָּא
  choice: e lhe disseram
  rationale: A construção pronominal evita uma repetição pesada de “ao rei” e transmite naturalmente a continuação narrativa.
- source_word: דַּע מַלְכָּא
  choice: Saiba, ó rei
  rationale: Preserva tanto o imperativo quanto o vocativo formal da linguagem da corte.
- source_word: דִּי דָת לְמָדַי וּפָרַס
  choice: que é lei dos medos e dos persas
  rationale: Mantém a afirmação sobre a norma jurídica reconhecida no império em português conciso e idiomático.
- source_word: כָל אֱסָר
  choice: toda proibição
  rationale: אֱסָר designa uma restrição formalmente imposta; “proibição” é claro para leitores comuns e conserva o sentido jurídico básico.
- source_word: וּקְיָם
  choice: ou decreto
  rationale: O termo indica uma determinação estabelecida e vinculante; “decreto” comunica bem esse valor jurídico em português corrente.
- source_word: דִּי מַלְכָּא יְהָקֵים
  choice: estabelecido pelo rei
  rationale: Reproduz o sentido de pôr em vigor e concorda de modo natural com os dois substantivos jurídicos.
- source_word: לָא לְהַשְׁנָיָה
  choice: não pode ser alterado
  rationale: Comunica claramente a irrevogabilidade prática alegada pelos oficiais e mantém o registro jurídico.
