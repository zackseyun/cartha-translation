  - marker: b
    text: 'Ou: «orando e fazendo súplicas diante do seu Deus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Advérbio temporal aramaico que dá sequência à narrativa; «Então» é claro e natural em português.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: aqueles homens
  rationale: Traduz o substantivo plural com demonstrativo e retoma os conspiradores já mencionados.
- source_word: הַרְגִּשׁוּ
  choice: se reuniram de comum acordo
  rationale: O verbo, neste contexto, sugere reunião ou ação conjunta e coordenada. A expressão preserva tanto o ajuntamento quanto a intenção concertada.
- source_word: וְהַשְׁכַּחוּ
  choice: e encontraram
  rationale: Verbo narrativo que indica que acharam Daniel no exercício da ação descrita.
- source_word: לְדָנִיֵּאל
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: בָּעֵא
  choice: fazendo pedidos
  rationale: O particípio expressa o ato de pedir ou apresentar uma petição; a formulação é corrente e mantém o valor verbal sem tecnicismo excessivo.
- source_word: וּמִתְחַנַּן
  choice: e suplicando
  rationale: O particípio denota súplica insistente ou busca de favor; «suplicando» conserva a intensidade sem acrescentar um objeto não expresso.
- source_word: קֳדָם
  choice: diante de
  rationale: Equivalente natural de «perante» ou «na presença de», adequado ao contexto de oração.
- source_word: אֱלָהֵהּ
  choice: seu Deus
  rationale: Reproduz o substantivo com o sufixo possessivo masculino singular, referindo-se ao Deus de Daniel.
theological_decisions:
- issue: Como traduzir a linguagem da oração de Daniel sem importar terminologia doutrinária posterior
  choice: fazendo pedidos e suplicando diante do seu Deus
  alternative: orando e fazendo súplicas diante do seu Deus
  rationale: A redação escolhida mantém distintos os dois particípios aramaicos e preserva o caráter devocional e insistente da ação, sem acrescentar um objeto como «favor» ou «misericórdia», que não está explicitamente expresso.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «De comum acordo» comunica a ação coordenada dos conspiradores; «fazendo pedidos e suplicando» evita linguagem excessivamente técnica e não explicita um objeto ausente no aramaico.
