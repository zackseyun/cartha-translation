  text: Then these men came by agreement and found Daniel petitioning and pleading before his God[a][b].
translation:
  language: pt
  text: Então, esses homens se reuniram de comum acordo[a] e encontraram Daniel pedindo e suplicando diante do seu Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «vieram juntos» ou «vieram em tumulto». O verbo aramaico provavelmente indica que esses homens se reuniram e agiram de maneira coordenada.'
