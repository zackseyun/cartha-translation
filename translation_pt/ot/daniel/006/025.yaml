source:
  edition: WLC
  text: וַ/אֲמַ֣ר מַלְכָּ֗/א וְ/הַיְתִ֞יו גֻּבְרַיָּ֤/א אִלֵּךְ֙ דִּֽי אֲכַ֤לוּ קַרְצ֨וֹ/הִי֙ דִּ֣י דָֽנִיֵּ֔אל וּ/לְ/גֹ֤ב אַרְיָוָתָ/א֙ רְמ֔וֹ אִנּ֖וּן בְּנֵי/ה֣וֹן וּ/נְשֵׁי/ה֑וֹן וְ/לָֽא מְט֞וֹ לְ/אַרְעִ֣ית גֻּבָּ֗/א עַ֠ד דִּֽי שְׁלִ֤טֽוּ בְ/הוֹן֙ אַרְיָ֣וָתָ֔/א וְ/כָל גַּרְמֵי/ה֖וֹן הַדִּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/025.yaml
  text: Then the king commanded[a], and those men who had maliciously accused Daniel were brought and thrown into the lions’ den—they, their sons, and their wives. And before they reached the bottom of the den, the lions overpowered them and crushed all their bones.
translation:
  language: pt
  text: Então o rei deu uma ordem, e trouxeram aqueles homens que haviam acusado Daniel maliciosamente[a]. Eles foram lançados na cova dos leões, junto com seus filhos e suas esposas. Antes que chegassem ao fundo da cova, os leões os dominaram e esmagaram todos os seus ossos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão idiomática aramaica, literalmente “comeram os pedaços dele”; isto é, caluniaram ou acusaram Daniel maliciosamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר
  choice: Então o rei deu uma ordem
  rationale: Embora o verbo signifique literalmente “dizer”, neste contexto régio ele introduz uma ordem imediatamente executada. “Então” expressa a progressão narrativa do waw.
- source_word: וְהַיְתִיו
  choice: trouxeram
  rationale: A forma causativa indica que os homens foram levados ao local por ordem do rei. A construção ativa com sujeito indeterminado é natural em português.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: aqueles homens
  rationale: O substantivo com demonstrativo identifica o grupo específico de acusadores já mencionado.
- source_word: אֲכַלוּ קַרְצֹוהִי דִּי דָנִיֵּאל
  choice: haviam acusado Daniel maliciosamente
  rationale: A expressão idiomática aramaica significa caluniar, denunciar ou acusar alguém com hostilidade. A tradução conserva tanto o aspecto acusatório quanto a intenção maliciosa.
- source_word: וּלְגֹב אַרְיָוָתָא רְמוֹ
  choice: foram lançados na cova dos leões
  rationale: “Cova dos leões” mantém a designação contextual do lugar, e “lançados” comunica a violência do ato judicial.
- source_word: אִנּוּן בְּנֵיהוֹן וּנְשֵׁיהוֹן
  choice: junto com seus filhos e suas esposas
  rationale: A tradução retém explicitamente os filhos e as esposas, sem generalizar “filhos” como “crianças” nem atenuar a afirmação do texto.
- source_word: וְלָא מְטוֹ לְאַרְעִית גֻּבָּא עַד דִּי
  choice: Antes que chegassem ao fundo da cova
  rationale: Na construção temporal negativa, “antes que” comunica naturalmente que o ataque ocorreu antes de eles alcançarem o fundo.
- source_word: שְׁלִטוּ בְהוֹן אַרְיָוָתָא
  choice: os leões os dominaram
  rationale: O verbo expressa domínio ou poder exercido sobre alguém. “Dominaram” preserva esse sentido sem reduzi-lo apenas a “agarraram”.
- source_word: וְכָל גַּרְמֵיהוֹן הַדִּקוּ
  choice: esmagaram todos os seus ossos
  rationale: A formulação preserva a totalidade indicada por “todos” e a força destrutiva do verbo.
theological_decisions:
- issue: Punição coletiva das famílias dos acusadores
  choice: Manter a afirmação explícita de que os filhos e as esposas também foram lançados na cova.
  alternative: Generalizar como “suas famílias”, omitir os familiares ou acrescentar uma avaliação moral.
  rationale: O texto aramaico nomeia claramente filhos e esposas. A tradução não deve suavizar a severidade da narrativa nem inserir uma justificação ou condenação teológica ausente do versículo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Esposas” evita a possível ambiguidade contemporânea de “mulheres”, enquanto “cova dos leões” mantém a expressão bíblica corrente. O marcador da nota foi colocado junto à expressão que ele explica.
