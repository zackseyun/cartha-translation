base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/019.yaml
  text: Then the king went to his palace and spent the night fasting; no entertainment was brought before him[a], and sleep fled from him.
translation:
  language: pt
  text: Então o rei foi para o seu palácio e passou a noite em jejum; nenhum entretenimento foi levado à sua presença[a], e o sono fugiu dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nenhum músico foi levado à sua presença”. O termo aramaico é incerto e pode referir-se mais especificamente a pessoas ou atividades destinadas a entreter e distrair.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Advérbio narrativo aramaico que marca o acontecimento seguinte na sequência.
- source_word: לְהֵיכְלֵהּ
  choice: para o seu palácio
  rationale: Embora הֵיכַל possa designar palácio, templo ou grande salão, o contexto indica a residência do rei.
- source_word: וּבָת טְוָת
  choice: passou a noite em jejum
  rationale: Expressão portuguesa natural que preserva tanto a ideia de passar a noite quanto a circunstância do jejum.
- source_word: וְדַחֲוָן
  choice: entretenimento
  rationale: O termo aramaico é raro e incerto; a escolha ampla evita especificar indevidamente músicos ou outra forma particular de distração.
- source_word: לָא הַנְעֵל קָדָמוֹהִי
  choice: nenhum entretenimento foi levado à sua presença
  rationale: A construção causativa indica que isso não foi introduzido diante do rei; a formulação passiva é clara e preserva o foco do texto.
- source_word: וְשִׁנְתֵּהּ נַדַּת עֲלוֹהִי
  choice: e o sono fugiu dele
  rationale: Mantém a imagem vívida e personificada do aramaico, em português natural.
