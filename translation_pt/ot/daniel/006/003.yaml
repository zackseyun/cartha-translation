  text: וְ/עֵ֤לָּא מִנְּ/הוֹן֙ סָרְכִ֣ין תְּלָתָ֔א דִּ֥י דָנִיֵּ֖אל חַֽד מִנְּ/ה֑וֹן דִּֽי לֶהֱוֺ֞ן אֲחַשְׁדַּרְפְּנַיָּ֣/א אִלֵּ֗ין יָהֲבִ֤ין לְ/הוֹן֙ טַעְמָ֔/א וּ/מַלְכָּ֖/א לָֽא לֶהֱוֵ֥א נָזִֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/003.yaml
  text: And over them were three high officials[a], of whom Daniel was one[b], so that these satraps might give account to them and the king might suffer no loss.
translation:
  language: pt
  text: Acima deles havia três altos oficiais, um dos quais era Daniel, para que esses sátrapas lhes prestassem contas[a] e o rei não sofresse prejuízo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «lhes apresentassem relatórios»; a expressão aramaica pode indicar tanto prestação de contas quanto apresentação de relatório em contexto administrativo.
    reason: lexical_alternative
  - marker: b
    text: Ou «e o rei não fosse prejudicado»; neste contexto, a ideia provavelmente é evitar perdas administrativas ou financeiras para o rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵלָּא מִנְּהוֹן
  choice: Acima deles havia
  rationale: Expressa de modo natural a posição hierárquica superior dos três oficiais em relação aos sátrapas.
- source_word: סָרְכִין תְּלָתָא
  choice: três altos oficiais
  rationale: Preserva a elevada função administrativa sem recorrer ao anacrônico título político «presidentes».
- source_word: דִּי דָנִיֵּאל חַד מִנְּהוֹן
  choice: um dos quais era Daniel
  rationale: Identifica com clareza Daniel como integrante do grupo dos três.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: sátrapas
  rationale: É o termo histórico consagrado para esse cargo administrativo persa e preserva o contexto cultural.
- source_word: יָהֲבִין לְהוֹן טַעְמָא
  choice: lhes prestassem contas
  rationale: Comunica a responsabilidade administrativa dos sátrapas perante os três altos oficiais; o aramaico também admite a ideia de apresentar relatório.
- source_word: וּמַלְכָּא לָא לֶהֱוֵא נָזִק
  choice: e o rei não sofresse prejuízo
  rationale: No contexto burocrático, נזק provavelmente indica perda ou dano aos interesses reais, especialmente de caráter administrativo ou financeiro.
