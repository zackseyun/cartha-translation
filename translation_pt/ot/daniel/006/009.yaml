  text: כְּעַ֣ן מַלְכָּ֔/א תְּקִ֥ים אֱסָרָ֖/א וְ/תִרְשֻׁ֣ם כְּתָבָ֑/א דִּ֣י לָ֧א לְ/הַשְׁנָיָ֛ה כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/009.yaml
  text: Now[a], O king, establish the injunction and sign the document so that it cannot be changed, according to the law of the Medes and Persians[b], which cannot be revoked.
translation:
  language: pt
  text: Agora, ó rei, estabelece a proibição e assina o documento, para que não possa ser alterado[a], conforme a lei dos medos e dos persas, que não pode ser revogada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que não seja alterado”. O aramaico enfatiza que o decreto escrito não deve sofrer alteração.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que não pode ser anulada”. Literalmente, “que não passa”, expressão que indica irrevogabilidade jurídica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Agora
  rationale: Advérbio discursivo que introduz o apelo imediato dos conselheiros; “Agora” é natural e não impõe uma relação conclusiva mais forte do que o aramaico exige.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: O substantivo está em uso vocativo; a forma preserva o tratamento direto e solene da corte.
- source_word: תְּקִים
  choice: estabelece
  rationale: O verbo significa pôr de pé, firmar ou instituir; no contexto jurídico, indica dar vigência formal à proibição.
- source_word: אֱסָרָא
  choice: a proibição
  rationale: Designa especificamente a restrição vinculante proposta no contexto; “proibição” é clara para leitores modernos e mais precisa aqui do que o termo mais amplo “decreto”.
- source_word: וְתִרְשֻׁם
  choice: e assina
  rationale: Embora o verbo possa referir-se a escrever ou registrar, neste contexto indica a formalização escrita pelo rei; “assina” comunica de modo natural essa autorização oficial.
- source_word: כְּתָבָא
  choice: o documento
  rationale: Refere-se ao texto legal escrito; “documento” preserva seu caráter oficial em linguagem corrente.
- source_word: דִּי לָא לְהַשְׁנָיָה
  choice: para que não possa ser alterado
  rationale: Expressa a intenção de tornar imutável o documento promulgado, sem eliminar a alternativa modal indicada em nota.
- source_word: כְּדָת
  choice: conforme a lei
  rationale: Representa a conformidade com a norma ou costume jurídico e soa natural em português contemporâneo.
- source_word: מָדַי וּפָרַס
  choice: dos medos e dos persas
  rationale: A expressão gentílica identifica os povos cuja ordem jurídica é invocada e corresponde à formulação histórica consagrada em português.
- source_word: דִּי לָא תֶעְדֵּא
  choice: que não pode ser revogada
  rationale: Traduz idiomaticamente a ideia literal de uma lei que “não passa”, isto é, que não pode ser anulada.
