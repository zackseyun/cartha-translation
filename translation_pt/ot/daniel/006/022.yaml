base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/022.yaml
  text: 'Then Daniel spoke with the king: “O king[a], live forever!”'
translation:
  language: pt
  text: 'Então Daniel falou com o rei: “Ó rei[a], viva para sempre!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Que o rei viva para sempre!” O aramaico usa uma fórmula convencional de bênção ao rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Advérbio aramaico de discurso que marca a sequência narrativa; “Então” é natural em português e preserva a progressão temporal.
- source_word: דָּנִיֶּאל
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עִם
  choice: com
  rationale: A preposição significa literalmente “com” e, junto a um verbo de fala, indica o interlocutor; “falou com o rei” preserva essa construção e soa natural.
- source_word: מַלְכָּא
  choice: o rei
  rationale: Na primeira ocorrência, o substantivo definido designa a pessoa com quem Daniel falou.
- source_word: מַלִּל
  choice: falou
  rationale: O perfeito Peal significa “falar/dizer”; “falou” combina naturalmente com a preposição “com” sem acrescentar a ideia de resposta, ausente no texto.
- source_word: מַלְכָּא
  choice: Ó rei
  rationale: Na segunda ocorrência, o termo funciona como vocativo. “Ó rei” conserva o tom solene da saudação régia sem ser obscuro.
- source_word: לְעָלְמִין
  choice: para sempre
  rationale: Expressão idiomática de duração contínua, convencional em fórmulas de bênção dirigidas ao rei.
- source_word: חֱיִי
  choice: viva
  rationale: Forma imperativa com sentido desiderativo ou optativo na fórmula de bênção; “viva para sempre” mantém tanto a forma direta quanto o sentido de desejo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O vocativo “Ó rei” preserva a solenidade da fórmula cortesã; a nota explicita seu valor de desejo sem eliminar a concisão do original.
