  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱלָהִ֞/י שְׁלַ֣ח מַלְאֲכֵ֗/הּ וּֽ/סֲגַ֛ר פֻּ֥ם אַרְיָוָתָ֖/א וְ/לָ֣א חַבְּל֑וּ/נִי כָּ/ל קֳבֵ֗ל דִּ֤י קָֽדָמ֨וֹ/הִי֙ זָכוּ֙ הִשְׁתְּכַ֣חַת לִ֔/י וְ/אַ֤ף קדמי/ך מַלְכָּ֔/א חֲבוּלָ֖ה לָ֥א עַבְדֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/023.yaml
  text: My God sent his angel and shut the mouths of the lions[a], and they have not harmed me, because innocence was found in me before him; and also before you, O king[c][b], I have done no harm.
translation:
  language: pt
  text: Meu Deus enviou o seu anjo[a] e fechou a boca dos leões, e eles não me feriram, porque diante dele foi encontrada inocência em mim[b]; e também diante de você, ó rei, não cometi mal algum[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu mensageiro”. O termo aramaico pode designar um mensageiro ou um anjo; neste contexto milagroso, “anjo” é o sentido mais provável.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi encontrada em mim, diante dele, pureza ou irrepreensibilidade”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “não agi injustamente contra você, ó rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהִי
  choice: Meu Deus
  rationale: Preserva o possessivo pessoal e identifica naturalmente, no contexto, o Deus a quem Daniel pertence e em quem confia.
- source_word: שְׁלַח
  choice: enviou
  rationale: O perfeito aramaico relata uma ação concluída; o pretérito perfeito é a forma natural em português.
- source_word: מַלְאֲכֵהּ
  choice: o seu anjo
  rationale: מַלְאַךְ pode indicar mensageiro ou anjo; o livramento milagroso favorece aqui a referência a um ser celestial, sem especificar além do texto.
- source_word: וּסֲגַר
  choice: e fechou
  rationale: Expressa diretamente a continuação da ação divina; 'fechar a boca' é idiomático e claro em português.
- source_word: פֻּם אַרְיָוָתָא
  choice: a boca dos leões
  rationale: Mantém o singular coletivo do aramaico, que apresenta a boca dos vários leões de modo distributivo.
- source_word: וְלָא חַבְּלוּנִי
  choice: e eles não me feriram
  rationale: O verbo plural retoma os leões; 'feriram' comunica de modo preciso a ausência de dano físico.
- source_word: כָּל־קֳבֵל דִּי
  choice: porque
  rationale: Introduz com clareza a razão do livramento e reproduz a força causal da expressão aramaica.
- source_word: קָדָמוֹהִי
  choice: diante dele
  rationale: Conserva a linguagem relacional e judicial de avaliação na presença de Deus.
- source_word: זָכוּ
  choice: inocência
  rationale: O substantivo denota inocência, pureza ou irrepreensibilidade; 'inocência' se ajusta melhor ao contexto judicial de vindicação.
- source_word: הִשְׁתְּכַחַת לִי
  choice: foi encontrada inocência em mim
  rationale: Preserva a construção passiva e a ideia de que a inocência foi constatada em Daniel.
- source_word: וְאַף קֳדָמָיךְ
  choice: e também diante de você
  rationale: Acrescenta a esfera humana da vindicação, perante o rei, sem apagar a paralelização com 'diante dele'.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: Representa o vocativo e mantém o tom respeitoso da fala na corte.
- source_word: חֲבוּלָה לָא עַבְדֵת
  choice: não cometi mal algum
  rationale: Expressa naturalmente que Daniel não praticou ato danoso ou injusto contra o rei.
theological_decisions:
- issue: Identidade de מַלְאֲכֵהּ no livramento milagroso
  choice: o seu anjo
  alternative: o seu mensageiro
  rationale: O contexto sobrenatural favorece 'anjo', mas a nota preserva a amplitude lexical do termo sem especular sobre a identidade específica desse agente.
- issue: Alcance da declaração de inocência de Daniel
  choice: inocência em relação à acusação e à conduta em questão
  alternative: impecabilidade absoluta
  rationale: O contexto judicial apresenta Daniel como inocente diante de Deus e sem ter causado dano ao rei; a tradução não transforma essa vindicação contextual em afirmação de ausência absoluta de pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o paralelismo judicial de “diante dele” e “diante de você”, bem como o singular coletivo “a boca dos leões”. Os marcadores aparecem junto às expressões a que correspondem.
