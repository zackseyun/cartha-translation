base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/018.yaml
  text: Then a stone was brought and placed over the mouth of the pit[a], and the king sealed it with his signet ring and with the signet rings of his nobles, so that nothing concerning Daniel might be changed.
translation:
  language: pt
  text: Então trouxeram uma pedra e a colocaram sobre a boca da cova. O rei a selou com seu anel de sinete e com os anéis de sinete de seus nobres, para que nada a respeito de Daniel fosse alterado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que a decisão a respeito de Daniel não fosse alterada”. O termo aramaico צְבוּ pode se referir a um assunto, uma intenção, uma vontade ou uma decisão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיתָיִת
  choice: Então trouxeram
  rationale: A forma passiva aramaica introduz o evento seguinte. Em português, a construção com sujeito indeterminado é natural e mantém o foco narrativo na pedra.
- source_word: אֶבֶן חֲדָה
  choice: uma pedra
  rationale: חֲדָה significa literalmente 'uma'; neste contexto, o artigo indefinido português expressa naturalmente que trouxeram uma pedra, sem dar ênfase indevida à ideia de 'uma única pedra'.
- source_word: וְשֻׂמַת עַל פֻּם גֻּבָּא
  choice: e a colocaram sobre a boca da cova
  rationale: Mantém a imagem concreta de פֻּם, 'boca', que também é idiomática em português, e traduz גֻּבָּא por 'cova', termo adequado ao contexto da cova dos leões.
- source_word: וְחַתְמַהּ מַלְכָּא
  choice: O rei a selou
  rationale: O pronome feminino retoma naturalmente 'pedra'; o verbo preserva o sentido direto de aplicar um selo para impedir violação.
- source_word: בְּעִזְקְתֵהּ
  choice: com seu anel-sinete
  rationale: Explicita que se trata do anel usado para imprimir o selo, em linguagem moderna e precisa.
- source_word: וּבְעִזְקָת רַבְרְבָנֹוהִי
  choice: e com os anéis-sinetes de seus nobres
  rationale: Repete o mesmo substantivo da oração anterior e traduz os altos dignitários da corte por 'nobres', termo conciso e apropriado.
- source_word: דִּי לָא תִשְׁנֵא צְבוּ בְדָנִיֵּאל
  choice: para que nada a respeito de Daniel fosse alterado
  rationale: Preserva a amplitude de צְבוּ, que pode indicar assunto, intenção, vontade ou decisão, sem restringir o sentido a uma única alternativa.
