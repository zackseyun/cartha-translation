source:
  edition: WLC
  text: וְ֠/דָנִיֵּאל כְּ/דִ֨י יְדַ֜ע דִּֽי רְשִׁ֤ים כְּתָבָ/א֙ עַ֣ל לְ/בַיְתֵ֔/הּ וְ/כַוִּ֨ין פְּתִיחָ֥ן לֵ/הּ֙ בְּ/עִלִּיתֵ֔/הּ נֶ֖גֶד יְרוּשְׁלֶ֑ם וְ/זִמְנִין֩ תְּלָתָ֨ה בְ/יוֹמָ֜/א ה֣וּא בָּרֵ֣ךְ עַל בִּרְכ֗וֹ/הִי וּ/מְצַלֵּ֤א וּ/מוֹדֵא֙ קֳדָ֣ם אֱלָהֵ֔/הּ כָּ/ל קֳבֵל֙ דִּֽי הֲוָ֣א עָבֵ֔ד מִן קַדְמַ֖ת דְּנָֽה־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/011.yaml
  text: And when Daniel knew that the document had been signed[a], he went to his house. Now the windows in his upper room were open toward Jerusalem, and three times a day he knelt on his knees and prayed and gave thanks before his God[c][b], just as he had been doing before this.
translation:
  language: pt
  text: Quando Daniel soube que o documento havia sido assinado[a], foi para casa. As janelas do seu aposento no andar de cima estavam abertas na direção de Jerusalém[b]. Três vezes por dia, ele se ajoelhava[c], orava e dava graças diante do seu Deus, como costumava fazer antes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que o escrito havia sido assinado”. O aramaico se refere ao decreto oficialmente registrado e formalmente posto em vigor.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “voltadas para Jerusalém”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão aramaica menciona os joelhos e descreve a postura de Daniel ao orar.
    reason: cultural_note
lexical_decisions:
- source_word: כְּדִי יְדַע
  choice: Quando Daniel soube
  rationale: A construção introduz a circunstância temporal e a tomada de conhecimento de Daniel; a formulação é natural em português narrativo.
- source_word: רְשִׁים כְּתָבָא
  choice: o documento havia sido assinado
  rationale: O idioma aramaico se refere a um escrito oficial formalmente assinado ou promulgado. “Documento” comunica com clareza seu caráter jurídico-administrativo.
- source_word: עַל לְבַיְתֵהּ
  choice: foi para casa
  rationale: No contexto, a expressão indica o movimento de Daniel para sua residência; esta é a forma corrente e concisa em português.
- source_word: כַוִּין פְּתִיחָן
  choice: As janelas ... estavam abertas
  rationale: Retrata o estado das aberturas sem sugerir que Daniel as tenha aberto naquele momento.
- source_word: בְּעִלִּיתֵהּ
  choice: seu quarto no andar de cima
  rationale: Designa um aposento superior; a escolha é mais imediatamente compreensível que uma expressão arquitetônica técnica.
- source_word: נֶגֶד יְרוּשְׁלֶם
  choice: na direção de Jerusalém
  rationale: Preserva a orientação espacial sem afirmar além do texto se Daniel ou as janelas estavam propriamente “de frente” para a cidade.
- source_word: זִמְנִין תְּלָתָה בְיוֹמָא
  choice: Três vezes por dia
  rationale: Equivalente idiomático direto da expressão temporal aramaica.
- source_word: בָּרֵךְ עַל בִּרְכוֹהִי
  choice: ele se ajoelhava
  rationale: Neste idioma e contexto, o verbo com a referência aos joelhos descreve a postura de ajoelhar-se; evita a redundância pouco natural “ajoelhava-se sobre os joelhos”.
- source_word: מְצַלֵּא וּמוֹדֵא
  choice: orava e dava graças
  rationale: Reproduz as duas ações devocionais distintas, entendendo מוֹדֵא aqui no sentido contextual de agradecer.
- source_word: כָּל קֳבֵל דִּי הֲוָא עָבֵד מִן קַדְמַת דְּנָה
  choice: como costumava fazer antes
  rationale: Expressa de modo natural a continuidade habitual indicada pela construção aramaica.
theological_decisions:
- issue: A prática de oração de Daniel sob o decreto real
  choice: Descrever sua prática habitual de ajoelhar-se, orar e agradecer, sem qualificá-la explicitamente como protesto.
  alternative: Realçar a ação como desafio deliberado ao decreto do rei.
  rationale: O versículo enfatiza que Daniel continuou fazendo o que já fazia antes, mas não caracteriza expressamente sua conduta como protesto político.
- issue: Sentido de וּמוֹדֵא diante de Deus
  choice: “dava graças”
  alternative: “confessava” ou “louvava”
  rationale: O campo semântico permite outras nuances, mas neste contexto de oração diante de Deus, “dar graças” é a leitura mais provável e preserva o caráter devocional da sequência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quarto no andar de cima” evita o tom antiquado de “cenáculo”; os verbos no imperfeito comunicam a prática repetida e habitual de Daniel.
