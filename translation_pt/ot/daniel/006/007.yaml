  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱ֠דַיִן סָרְכַיָּ֤/א וַ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ אִלֵּ֔ן הַרְגִּ֖שׁוּ עַל מַלְכָּ֑/א וְ/כֵן֙ אָמְרִ֣ין לֵ֔/הּ דָּרְיָ֥וֶשׁ מַלְכָּ֖/א לְ/עָלְמִ֥ין חֱיִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/007.yaml
  text: 'Then these high officials and satraps came before the king and said this to him: “King Darius[b][a], live forever!”'
translation:
  language: pt
  text: 'Então esses altos funcionários e sátrapas foram juntos até o rei[a] e lhe disseram: “Ó rei Dario, viva para sempre!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reuniram-se diante do rei”, “foram de comum acordo até o rei” ou “foram tumultuosamente até o rei”. O idiomatismo aramaico enfatiza uma aproximação coletiva e coordenada e, pelo contexto, pode sugerir intenção conspiratória.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Ó rei Dario, viva por eras”. Trata-se de uma aclamação convencional da corte, não de uma afirmação literal de imortalidade.
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: סָרְכַיָּא
  choice: altos funcionários
  rationale: Comunica claramente a elevada posição desses oficiais imperiais sem recorrer a um título tradicional potencialmente enganoso.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: sátrapas
  rationale: Mantém o termo histórico consagrado para administradores provinciais do Império Persa.
- source_word: אִלֵּן
  choice: esses
  rationale: Retoma os oficiais mencionados no contexto imediato; em português corrente, “esses” é a forma dêitica mais natural aqui.
- source_word: הַרְגִּשׁוּ עַל
  choice: foram juntos até
  rationale: Preserva a ideia de uma aproximação coletiva e coordenada sem afirmar no texto principal se foi tumultuosa ou explicitamente conspiratória.
- source_word: מַלְכָּא
  choice: o rei
  rationale: Representa o título real definido na narração.
- source_word: וְכֵן אָמְרִין לֵהּ
  choice: e lhe disseram
  rationale: Expressa naturalmente em português a introdução aramaica ao discurso direto, sem reproduzir de modo rígido o idiomatismo “assim disseram a ele”.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: Ó rei Dario
  rationale: A ordem e a partícula vocativa são naturais no tratamento direto em português e deixam claro que se trata de uma aclamação dirigida ao rei.
- source_word: לְעָלְמִין חֱיִי
  choice: viva para sempre
  rationale: É a fórmula cortesã convencional correspondente, clara e corrente em português; a nota preserva o valor mais literal de “eras”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sátrapas” preserva o contexto administrativo persa; “altos funcionários” evita o tradicional “presidentes”, que hoje sugeriria outro tipo de cargo. A construção “foram juntos até” conserva a força coletiva do idiomatismo aramaico, enquanto a nota registra suas alternativas legítimas.
