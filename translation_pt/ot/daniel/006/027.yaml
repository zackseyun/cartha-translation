language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִן קֳדָמַ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י בְּ/כָל שָׁלְטָ֣ן מַלְכוּתִ֗/י לֶהֱוֺ֤ן זאעין וְ/דָ֣חֲלִ֔ין מִן קֳדָ֖ם אֱלָהֵ֣/הּ דִּי דָֽנִיֵּ֑אל דִּי ה֣וּא אֱלָהָ֣/א חַיָּ֗/א וְ/קַיָּם֙ לְ/עָ֣לְמִ֔ין וּ/מַלְכוּתֵ/הּ֙ דִּֽי לָ֣א תִתְחַבַּ֔ל וְ/שָׁלְטָנֵ֖/הּ עַד סוֹפָֽ/א־׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/027.yaml
  text: A decree is issued by me[a], that in all the dominion of my kingdom people are to tremble and fear before the God of Daniel, for he is the living God, enduring forever; and his kingdom will not be destroyed[c][b], and his dominion will be to the end.
translation:
  language: pt
  text: Por mim se decreta[a] que, em todo o domínio do meu reino[b], todos tremam e temam diante do Deus de Daniel, pois ele é o Deus vivo e permanece para sempre. Seu reino não será destruído, e seu domínio durará até o fim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da minha presença é estabelecido um decreto”, fórmula administrativa que indica que o decreto procede da autoridade do rei.
    reason: idioma_do_original
  - marker: b
    text: 'Ou: “em toda a extensão do meu reino”.'
    reason: alternativa_lexical
  - marker: c
    text: 'Também pode ser traduzido: “seu domínio é até o fim” ou “seu governo permanece até o fim”.'
    reason: ambiguidade_sintática
lexical_decisions:
- source_word: מִן קֳדָמַי שִׂים טְעֵם
  choice: Por mim se decreta
  rationale: A fórmula administrativa aramaica diz literalmente que, procedente da presença do rei, um decreto é estabelecido. A formulação portuguesa preserva a autoridade pessoal do monarca e o tom oficial sem reproduzir a construção de modo artificial.
- source_word: בְּכָל שָׁלְטָן מַלְכוּתִי
  choice: em todo o domínio do meu reino
  rationale: שָׁלְטָן designa a esfera de governo ou domínio. A expressão mantém o alcance político de todo o território sujeito ao reino.
- source_word: לֶהֱוֺן זאעין וְדָחֲלִין
  choice: todos tremam e temam
  rationale: O sujeito humano está implícito no contexto do decreto. Os dois particípios expressam forte temor reverente; os dois verbos em português preservam sua intensidade e duplicidade.
- source_word: מִן קֳדָם אֱלָהֵהּ דִּי דָנִיֵּאל
  choice: diante do Deus de Daniel
  rationale: A preposição indica a postura perante Deus, e a construção seguinte associa diretamente esse Deus a Daniel.
- source_word: אֱלָהָא חַיָּא
  choice: o Deus vivo
  rationale: A expressão confessional apresenta o Deus de Daniel como vivo, em contraste implícito com deuses sem vida.
- source_word: וְקַיָּם לְעָלְמִין
  choice: e permanece para sempre
  rationale: קַיָּם comunica permanência e continuidade. 'Permanece para sempre' é claro, natural e conserva a força temporal da expressão.
- source_word: וּמַלְכוּתֵהּ דִּי לָא תִתְחַבַּל
  choice: Seu reino não será destruído
  rationale: Neste contexto, o verbo denota arruinar ou destruir. A tradução afirma diretamente a indestrutibilidade do reino sem acrescentar explicações.
- source_word: וְשָׁלְטָנֵהּ עַד סוֹפָא
  choice: e seu domínio durará até o fim
  rationale: A oração nominal deixa implícita a relação verbal. 'Durará' torna a frase natural em português, enquanto 'até o fim' preserva a formulação temporal aberta do aramaico.
theological_decisions:
- issue: A resposta exigida diante do Deus de Daniel
  choice: todos tremam e temam diante do Deus de Daniel
  alternative: todos o reverenciem e temam diante do Deus de Daniel
  rationale: Os dois termos aramaicos exprimem tremor e temor intensos. Traduzir o primeiro por 'reverenciem' suavizaria e interpretaria a emoção; a redação escolhida conserva a força e a tensão do decreto.
- issue: A permanência de Deus, de seu reino e de seu domínio
  choice: ele é o Deus vivo e permanece para sempre. Seu reino não será destruído, e seu domínio durará até o fim
  alternative: ele é o Deus vivo e firme para sempre; seu reino jamais será arruinado, e seu governo é até o fim
  rationale: A tradução mantém as afirmações diretas do texto sobre a vida e permanência de Deus e sobre a continuidade de seu governo, sem expandi-las em uma formulação doutrinária posterior. 'Até o fim' é mantido, em vez de ser harmonizado silenciosamente com 'para sempre'.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O tom solene de proclamação real foi preservado sem arcaísmos; a repetição enfática de “tremam e temam” e a expressão aberta “até o fim” foram mantidas por fidelidade ao aramaico.
