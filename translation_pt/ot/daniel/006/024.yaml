  text: בֵּ/אדַ֣יִן מַלְכָּ֗/א שַׂגִּיא֙ טְאֵ֣ב עֲל֔וֹ/הִי וּ/לְ/דָ֣נִיֵּ֔אל אֲמַ֖ר לְ/הַנְסָקָ֣ה מִן גֻּבָּ֑/א וְ/הֻסַּ֨ק דָּנִיֵּ֜אל מִן גֻּבָּ֗/א וְ/כָל חֲבָל֙ לָא הִשְׁתְּכַ֣ח בֵּ֔/הּ דִּ֖י הֵימִ֥ן בֵּ/אלָהֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/024.yaml
  text: Then the king was very glad because of him[a], and he ordered that Daniel be brought up from the pit. So Daniel was brought up from the pit, and no kind of harm was found on him[b], because he had trusted in his God.
translation:
  language: pt
  text: Então o rei ficou muito contente por causa dele e ordenou que tirassem Daniel da cova.[a] Daniel foi tirado da cova, e não se encontrou nele ferimento algum, porque havia confiado em seu Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fosso”. O substantivo aramaico indica uma cavidade ou recinto semelhante a um fosso; neste contexto, trata-se da cova dos leões.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque havia crido em seu Deus”. O verbo pode significar “confiar” ou “crer”; “confiado” destaca aqui a dependência pessoal de Daniel em relação a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e claro em português.
- source_word: שַׂגִּיא טְאֵב
  choice: ficou muito contente
  rationale: Reproduz a forte reação positiva do rei em linguagem corrente e digna.
- source_word: עֲלוֹהִי
  choice: por causa dele
  rationale: Expressa Daniel como causa ou motivo da alegria do rei, preservando a referência pronominal do aramaico.
- source_word: וּלְדָנִיֵּאל אֲמַר לְהַנְסָקָה
  choice: ordenou que tirassem Daniel
  rationale: O infinitivo causativo, no contexto da fala régia, comunica uma ordem para que Daniel fosse retirado; a formulação é idiomática em português.
- source_word: מִן גֻּבָּא
  choice: da cova
  rationale: O substantivo designa uma cavidade ou recinto semelhante a um fosso; “cova” é natural no contexto da cova dos leões e mantém a imagem espacial.
- source_word: וְכָל חֲבָל לָא הִשְׁתְּכַח בֵּהּ
  choice: e não se encontrou nele ferimento algum
  rationale: “Ferimento algum” transmite a negação abrangente, enquanto “se encontrou nele” conserva a ideia de que nenhum dano foi constatado em Daniel.
- source_word: דִּי הֵימִן בֵּאלָהֵהּ
  choice: porque havia confiado em seu Deus
  rationale: Mantém a relação causal explícita e comunica a confiança pessoal de Daniel em Deus; o mais-que-perfeito composto situa essa confiança antes da constatação de sua preservação.
theological_decisions:
- issue: Fundamento declarado para a preservação de Daniel
  choice: porque havia confiado em seu Deus
  alternative: porque havia crido em seu Deus
  rationale: O verbo admite os sentidos de crer e confiar. “Confiado” ressalta a entrega pessoal adequada ao contexto, sem transformar a afirmação causal do versículo em uma explicação doutrinária mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “Daniel” e “da cova” preserva a cadência narrativa do aramaico; “tirassem” evita uma passiva pesada sem alterar o sentido causativo.
