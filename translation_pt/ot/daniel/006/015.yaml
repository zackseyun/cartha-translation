base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/015.yaml
  text: Then the king[a], when he heard the statement, was greatly distressed, and he set his mind on delivering Daniel; and until the going down of the sun he kept striving to rescue him.
translation:
  language: pt
  text: Então o rei, ao ouvir aquela declaração, ficou profundamente angustiado[a] e decidiu livrar Daniel. Até o pôr do sol, continuou se esforçando para salvá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficou muito descontente consigo mesmo”. A expressão aramaica diz literalmente que ele ficou muito angustiado ou descontente “sobre si mesmo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: מַלְכָּא
  choice: o rei
  rationale: O estado enfático aramaico indica uma referência definida no contexto.
- source_word: כְּדִי מִלְּתָא שְׁמַע
  choice: ao ouvir aquela declaração
  rationale: A construção é temporal; “declaração” comunica a fala específica recém-proferida no contexto jurídico, e “aquela” torna clara a referência contextual.
- source_word: שַׂגִּיא בְּאֵשׁ עֲלוֹהִי
  choice: ficou profundamente angustiado
  rationale: Expressa a intensa perturbação interior do rei em português natural, enquanto a possível nuance reflexiva de desagrado consigo mesmo é preservada em nota.
- source_word: וְעַל דָּנִיֵּאל שָׂם בָּל
  choice: e decidiu livrar Daniel
  rationale: O idioma “pôs o coração” indica propósito ou determinação; “decidiu” evita uma reprodução artificial e mantém a força volitiva.
- source_word: לְשֵׁיזָבוּתֵהּ
  choice: livrar Daniel
  rationale: O verbo denota libertar ou resgatar de perigo; repetir o nome elimina uma possível ambiguidade pronominal em português.
- source_word: וְעַד מֶעָלֵי שִׁמְשָׁא
  choice: Até o pôr do sol
  rationale: Equivalente idiomático, claro e corrente da expressão aramaica relativa ao ocaso.
- source_word: הֲוָא מִשְׁתַּדַּר
  choice: continuou se esforçando
  rationale: Preserva o aspecto durativo da construção perifrástica aramaica.
- source_word: לְהַצָּלוּתֵהּ
  choice: para salvá-lo
  rationale: Comunica a tentativa de retirar Daniel do perigo e mantém uma variação natural em relação a “livrar”.
