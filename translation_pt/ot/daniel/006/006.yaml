  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ אָֽמְרִ֔ין דִּ֣י לָ֧א נְהַשְׁכַּ֛ח לְ/דָנִיֵּ֥אל דְּנָ֖ה כָּל עִלָּ֑א לָהֵ֕ן הַשְׁכַּ֥חְנָֽה עֲל֖וֹ/הִי בְּ/דָ֥ת אֱלָהֵֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/006.yaml
  text: Then these men said[a], ‘We will not find any charge against this Daniel unless we find it against him in the law of his God.’
translation:
  language: pt
  text: 'Então estes homens disseram: “Não encontraremos nenhuma acusação[a] contra esse Daniel, a menos que a encontremos contra ele na lei do Deus dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nenhum fundamento para acusá-lo”.
    reason: Alternativa lexical que explicita o sentido jurídico de עִלָּא.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Advérbio temporal e sequencial que introduz o desenvolvimento seguinte da narrativa; “Então” é natural e preserva o encadeamento.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: estes homens
  rationale: Mantém o substantivo comum e o demonstrativo do aramaico, sem acrescentar o título de “autoridades” fornecido apenas pelo contexto mais amplo.
- source_word: אָמְרִין
  choice: disseram
  rationale: O pretérito perfeito é a forma narrativa corrente em português para este verbo de fala.
- source_word: דִּי לָא נְהַשְׁכַּח
  choice: Não encontraremos
  rationale: O imperfeito aramaico expressa aqui o resultado futuro que eles esperam de sua busca.
- source_word: לְדָנִיֵּאל דְּנָה
  choice: contra esse Daniel
  rationale: “Contra” comunica o sentido jurídico da preposição; “esse Daniel” preserva o demonstrativo e seu possível tom depreciativo ou enfático em português natural.
- source_word: כָּל עִלָּא
  choice: nenhuma acusação
  rationale: No contexto jurídico, a expressão designa uma causa ou base para acusar. “Nenhuma acusação” é conciso e claro, enquanto a nota registra a alternativa mais explícita.
- source_word: לָהֵן
  choice: a menos que
  rationale: A conjunção introduz a única exceção à afirmação anterior.
- source_word: הַשְׁכַּחְנָה
  choice: a encontremos
  rationale: Repete o verbo “encontrar” do original; o pronome retoma naturalmente “acusação”.
- source_word: עֲלוֹהִי
  choice: contra esse Daniel / contra ele (retomado pelo pronome “a”)
  rationale: A relação adversativa está expressa na primeira ocorrência por “contra esse Daniel”; na segunda oração, a estrutura portuguesa “a encontremos na lei” evita uma repetição pesada sem alterar o sentido de uma acusação dirigida contra ele.
- source_word: בְּדָת אֱלָהֵהּ
  choice: na lei do Deus dele
  rationale: “Lei” corresponde a דָת, e “do Deus dele” preserva a referência possessiva inequívoca a Daniel, evitando a possível ambiguidade de “seu Deus”.
theological_decisions:
- issue: Uso de maiúscula em אֱלָהֵהּ
  choice: Deus dele
  alternative: deus dele
  rationale: O aramaico não distingue maiúsculas, mas o referente narrativo é o Deus adorado por Daniel. A maiúscula identifica esse referente em português sem acrescentar uma afirmação doutrinária ao versículo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A fala direta preserva o tom conspiratório. “Esse Daniel” soa natural no português brasileiro e conserva o possível tom apontado ou depreciativo do demonstrativo; “do Deus dele” evita ambiguidade referencial.
