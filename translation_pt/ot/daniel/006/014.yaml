  text: בֵּ֠/אדַיִן עֲנ֣וֹ וְ/אָמְרִין֮ קֳדָ֣ם מַלְכָּ/א֒ דִּ֣י דָנִיֵּ֡אל דִּי֩ מִן בְּנֵ֨י גָלוּתָ֜/א דִּ֣י יְה֗וּד לָא שָׂ֨ם עלי/ך מַלְכָּ/א֙ טְעֵ֔ם וְ/עַל אֱסָרָ֖/א דִּ֣י רְשַׁ֑מְתָּ וְ/זִמְנִ֤ין תְּלָתָה֙ בְּ/יוֹמָ֔/א בָּעֵ֖א בָּעוּתֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/014.yaml
  text: Then they answered and said before the king[a], “Daniel, who is one of the exiles from Judah, pays no attention to you, O king, or to the injunction that you have signed[c][b], but three times a day he makes his petition.”
translation:
  language: pt
  text: 'Então eles responderam e disseram diante do rei: “Daniel, que é um dos exilados de Judá, não dá atenção ao senhor, ó rei,[a] nem à proibição que o senhor assinou;[b] mas, três vezes por dia, ele apresenta sua súplica”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não mostra consideração pelo senhor”. O idioma aramaico fala literalmente em não pôr atenção ou consideração sobre o rei.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “à interdição” ou “ao decreto”. O termo designa aqui uma proibição legal vinculante.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “ele busca a sua súplica”. A expressão indica que ele continua a apresentar seu pedido em oração. O destinatário não é nomeado nesta cláusula, embora o contexto identifique o Deus de Daniel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que dá sequência à narrativa; “Então” é natural e claro em português moderno.
- source_word: עֲנוֹ וְאָמְרִין
  choice: responderam e disseram
  rationale: Mantém os dois verbos da fórmula semítica de fala, sem reduzi-los a um só.
- source_word: קֳדָם מַלְכָּא
  choice: diante do rei
  rationale: Preserva a ideia de presença perante o rei e o cenário formal da corte.
- source_word: דִּי מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: que é um dos exilados de Judá
  rationale: Expressa naturalmente o pertencimento à comunidade deportada e mantém o teor acusatório da identificação.
- source_word: לָא שָׂם עֲלַיִךְ ... טְעֵם
  choice: não dá atenção ao senhor
  rationale: Reproduz em português corrente o idioma aramaico de não colocar consideração ou atenção sobre alguém. “Ao senhor” oferece legibilidade brasileira no discurso dirigido ao rei sem confundir com o nome divino.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: Conserva o vocativo explícito e sua força retórica no contexto da corte.
- source_word: וְעַל אֱסָרָא דִּי רְשַׁמְתָּ
  choice: nem à proibição que o senhor assinou
  rationale: “Proibição” comunica o caráter legal e vinculante de אֱסָרָא em linguagem acessível; “assinou” corresponde à formalização escrita do ato no contexto.
- source_word: וְזִמְנִין תְּלָתָה בְּיוֹמָא
  choice: pelo contrário, três vezes por dia
  rationale: A expressão temporal é vertida idiomaticamente; “pelo contrário” torna explícito o contraste pragmático entre a desobediência alegada e a conduta contínua de Daniel.
- source_word: בָּעֵא בָּעוּתֵהּ
  choice: ele faz a sua súplica
  rationale: Traduz a construção verbo-substantivo como ato contínuo de apresentar um pedido solene, sem acrescentar um destinatário não expresso na oração aramaica.
theological_decisions:
- issue: Explicitar ou não Deus como destinatário da súplica de Daniel
  choice: 'Manter o destinatário implícito: “ele faz a sua súplica”'
  alternative: “ele ora ao seu Deus” ou “ele apresenta sua súplica a Deus”
  rationale: Embora o contexto identifique o Deus de Daniel como destinatário, esta oração aramaica não o nomeia. A tradução evita acrescentar conteúdo e conserva a formulação do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fórmula narrativa e o vocativo régio foram preservados; termos jurídicos excessivamente técnicos foram evitados. Os marcadores [a], [b] e [c] aparecem no texto principal e correspondem às notas.
