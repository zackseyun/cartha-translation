- source_word: וְעָבֵד אָתִין וְתִמְהִין
  choice: e realiza sinais e maravilhas
  rationale: Emprega a expressão bíblica corrente para atos extraordinários que manifestam o poder divino.
- source_word: מִן יַד אַרְיָוָתָא
  choice: do poder dos leões
  rationale: O idiomatismo aramaico 'da mão dos leões' indica domínio ou poder; a tradução evita a imagem anatômica imprópria em português.
theological_decisions:
- issue: Relação entre a afirmação geral e o livramento de Daniel
  choice: — ele livrou Daniel
  alternative: — aquele que livrou Daniel
  rationale: O pronome retoma Deus enfaticamente e conserva a progressão do geral para o exemplo concreto, sem introduzir interpretação doutrinária adicional.
