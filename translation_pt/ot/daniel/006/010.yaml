  text: Because of this[a], King Darius signed the document and the injunction.
translation:
  language: pt
  text: Por isso, o rei Dario assinou o documento e a interdição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Por isso, o rei Dario lavrou o documento e a proibição». O verbo aramaico também pode significar «escreveu» ou «registrou»; neste contexto jurídico, «assinou» comunica naturalmente o ato formal que põe a medida em vigor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: Por isso
  rationale: A expressão aramaica introduz a consequência do que foi narrado anteriormente; «Por isso» preserva de modo natural tanto a ligação causal quanto o avanço da narrativa.
- source_word: מַלְכָּא דָּרְיָוֶשׁ
  choice: o rei Dario
  rationale: Mantém o título real e adapta a ordem ao uso natural do português.
- source_word: רְשַׁם
  choice: assinou
  rationale: Embora o verbo possa significar «escreveu» ou «registrou», no contexto jurídico indica o ato formal do rei que autentica e põe o documento em vigor.
- source_word: כְּתָבָא
  choice: o documento
  rationale: O substantivo designa um escrito ou documento; «documento» é claro, atual e apropriado ao contexto jurídico.
- source_word: וֶאֱסָרָא
  choice: com a proibição
  rationale: O termo designa uma restrição vinculante. A construção «documento com a proibição» expressa em português natural a estreita relação entre o escrito e a medida legal, sem tratá-los necessariamente como dois atos independentes.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. «Proibição» é mais corrente do que «interdição», enquanto a nota preserva a formulação mais formal e a amplitude lexical do aramaico.
