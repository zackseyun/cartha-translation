  source_fidelity: A ligação causal em «Por isso» corresponde bem a כָּל־קֳבֵל דְּנָה, e «o rei Dario» representa adequadamente מַלְכָּא דָּרְיָוֶשׁ. «Assinou» é uma contextualização jurídica defensável de רְשַׁם. Contudo, a conjunção וְ entre כְּתָבָא e אֱסָרָא deve ser mantida como coordenação, não convertida em «com».
