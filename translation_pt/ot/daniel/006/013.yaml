  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֵּ֠/אדַיִן קְרִ֨יבוּ וְ/אָמְרִ֥ין קֳדָם מַלְכָּ/א֮ עַל אֱסָ֣ר מַלְכָּ/א֒ הֲ/לָ֧א אֱסָ֣ר רְשַׁ֗מְתָּ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִבְעֵה֩ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/ג֖וֹב אַרְיָותָ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר יַצִּיבָ֧א מִלְּתָ֛/א כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/013.yaml
  text: 'Then they came near and spoke before the king concerning the king’s injunction: “Did you not sign an injunction that any man who makes a petition to any god or man for thirty days[a], except to you, O king, shall be thrown into the lions’ den?” The king answered and said, “The matter is certain, according to the law of the Medes and Persians[c][b], which cannot be changed.”'
translation:
  language: pt
  text: 'Então eles se aproximaram e falaram diante do rei a respeito da proibição real: “Não assinaste uma proibição segundo a qual todo homem que, durante trinta dias, fizer uma petição a qualquer deus ou homem, exceto a ti, ó rei, será lançado na cova dos leões?” O rei respondeu: “A declaração é certa, conforme a lei dos medos e dos persas, que não pode ser revogada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que introduz o acontecimento seguinte; “Então” mantém com naturalidade a sequência narrativa.
- source_word: קְרִיבוּ
  choice: eles se aproximaram
  rationale: O verbo indica chegar perto ou aproximar-se; a formulação preserva o movimento concreto em direção ao rei.
- source_word: וְאָמְרִין קֳדָם מַלְכָּא
  choice: e falaram diante do rei
  rationale: A expressão retrata tanto o ato de falar quanto o ambiente formal da corte, na presença do rei.
- source_word: עַל אֱסָר מַלְכָּא
  choice: a respeito da proibição real
  rationale: אֱסָר designa aqui uma ordem vinculante de caráter proibitivo; “proibição real” é clara e específica em português corrente.
- source_word: הֲלָא אֱסָר רְשַׁמְתָּ
  choice: Não assinaste uma proibição
  rationale: A pergunta retórica espera confirmação, e o verbo, neste contexto jurídico, se refere ao ato formal de pôr a proibição por escrito e em vigor.
- source_word: כָל אֱנָשׁ
  choice: todo homem
  rationale: Mantém o substantivo masculino singular do aramaico e seu valor genérico dentro da formulação legal.
- source_word: יִבְעֵה
  choice: fizer uma petição
  rationale: O verbo indica pedir ou apresentar uma solicitação; “fizer uma petição” preserva o tom formal do contexto jurídico.
- source_word: מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: a qualquer deus ou homem
  rationale: Embora מִן costume significar “de”, com o verbo pedir a expressão identifica aquele a quem a petição é dirigida; a preposição “a” comunica isso naturalmente em português.
- source_word: עַד יוֹמִין תְּלָתִין
  choice: durante trinta dias
  rationale: Expressa de modo natural a duração da proibição.
- source_word: לָהֵן מִנָּךְ
  choice: exceto a ti
  rationale: A frase estabelece a exceção à proibição e conserva a direção da petição ao rei.
- source_word: יִתְרְמֵא לְגוֹב אַרְיָותָא
  choice: será lançado na cova dos leões
  rationale: Preserva a voz passiva e a força jurídica da consequência penal.
- source_word: יַצִּיבָא מִלְּתָא
  choice: A determinação está confirmada
  rationale: A expressão afirma que o assunto ou palavra tem validade firme; “está confirmada” se ajusta à resposta jurídica do rei sem confundi-la com a proibição mencionada anteriormente.
- source_word: דִּי לָא תֶעְדֵּא
  choice: que não pode ser revogada
  rationale: No contexto de uma lei, o verbo expressa que ela não pode passar, ser removida ou alterada; “revogada” é juridicamente natural.
theological_decisions:
- issue: Masculino genérico אֱנָשׁ na formulação legal
  choice: todo homem
  alternative: qualquer pessoa; qualquer um
  rationale: O aramaico emprega um substantivo masculino singular com alcance genérico. A tradução conserva essa forma sem restringir explicitamente o alcance da norma apenas aos homens.
- issue: Sentido de אֱסָר no contexto
  choice: proibição
  alternative: decreto; interdito
  rationale: O termo se refere especificamente a uma ordem vinculante que proíbe determinada conduta, não apenas a um decreto real em sentido amplo.
- issue: Caráter imutável da lei dos medos e dos persas
  choice: que não pode ser revogada
  alternative: que não pode ser alterada; que não passa
  rationale: A tradução preserva a afirmação narrativa sobre a irrevogabilidade dessa lei, sem ampliar a declaração para além do contexto jurídico apresentado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe da pergunta foi ajustada à ordem natural do português, sem perder o caráter formal da acusação perante o rei. Empregou-se “tu” em formas verbais e pronominais (“assinaste”, “a ti”) para manter a solenidade do tratamento direto, acompanhado do vocativo “ó rei”.
