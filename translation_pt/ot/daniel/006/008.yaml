id: DAN.6.8
reference: Daniel 6:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִתְיָעַ֜טוּ כֹּ֣ל סָרְכֵ֣י מַלְכוּתָ֗/א סִגְנַיָּ֤/א וַֽ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ הַדָּֽבְרַיָּ֣/א וּ/פַחֲוָתָ֔/א לְ/קַיָּמָ֤ה קְיָם֙ מַלְכָּ֔/א וּ/לְ/תַקָּפָ֖ה אֱסָ֑ר דִּ֣י כָל דִּֽי יִבְעֵ֣ה בָ֠עוּ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/גֹ֖ב אַרְיָוָתָֽ/א׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/008.yaml
  text: 'All the high officials of the kingdom[a], the prefects and satraps, the counselors and governors, have agreed together to establish a royal statute and to enforce an injunction: that whoever makes a petition to any god or man for thirty days, except to you, O king[c][b], shall be thrown into the lions’ den.'
translation:
  language: pt
  text: 'Todos os altos funcionários do reino — os prefeitos e os sátrapas, os conselheiros e os governadores — deliberaram em conjunto[a] para estabelecer um estatuto real e tornar obrigatória uma proibição[b]: durante trinta dias, quem fizer um pedido a qualquer deus ou ser humano[c], exceto a ti, ó rei, será lançado na cova dos leões.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chegaram juntos a um acordo”. O verbo pode destacar tanto a deliberação conjunta quanto o acordo resultante.
    reason: lexical_alternative
  - marker: b
    text: Os termos jurídicos aramaicos aqui usados têm sentidos parcialmente sobrepostos e também podem ser traduzidos por “decreto real” e “interdição”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “pedir de qualquer deus ou ser humano”, isto é, pedir alguma coisa da parte deles.
    reason: source_form
lexical_decisions:
- source_word: אִתְיָעַטוּ
  choice: deliberaram em conjunto
  rationale: A forma reflexiva-recíproca expressa consulta ou deliberação conjunta e pode também implicar acordo. A formulação preserva a ação coordenada sem afirmar mais unanimidade do que o verbo exige.
- source_word: סָרְכֵי מַלְכוּתָא
  choice: os altos funcionários do reino
  rationale: Designa coletivamente autoridades superiores do governo; a expressão é clara e atual em português.
- source_word: סִגְנַיָּא
  choice: os prefeitos
  rationale: Mantém um título administrativo distinto dentro da enumeração oficial, sem substituí-lo por um termo genérico.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: os sátrapas
  rationale: É o termo histórico estabelecido para governantes provinciais do Império Persa.
- source_word: הַדָּבְרַיָּא
  choice: os conselheiros
  rationale: Expressa de modo natural a função de aconselhamento exercida por esses oficiais.
- source_word: פַחֲוָתָא
  choice: os governadores
  rationale: Equivalente corrente para o cargo governamental indicado pelo aramaico.
- source_word: לְקַיָּמָה קְיָם מַלְכָּא
  choice: para estabelecer um estatuto real
  rationale: A combinação do verbo com o substantivo cognato comunica a promulgação ou confirmação de uma norma real.
- source_word: וּלְתַקָּפָה אֱסָר
  choice: e tornar obrigatória uma proibição
  rationale: Transmite a ideia de dar força vinculante a uma restrição legal, em linguagem compreensível e sem excesso de tecnicismo.
- source_word: יִבְעֵה בָעוּ
  choice: fizer um pedido
  rationale: O idioma verbal-nominal indica formular ou apresentar uma solicitação. A tradução não o restringe indevidamente à oração religiosa, pois o objeto pode ser um deus ou um ser humano.
- source_word: מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: a qualquer deus ou ser humano
  rationale: Embora מִן tenha valor básico de origem, em português a construção natural é 'fazer um pedido a alguém'; a nota registra a possibilidade de explicitar a ideia de pedir algo da parte de alguém.
- source_word: עַד יוֹמִין תְּלָתִין
  choice: durante trinta dias
  rationale: Exprime com clareza o período de vigência da proibição.
- source_word: לָהֵן מִנָּךְ
  choice: exceto a ti
  rationale: Marca diretamente o rei como a única exceção à proibição.
- source_word: לְגֹב אַרְיָוָתָא
  choice: na cova dos leões
  rationale: É a expressão portuguesa tradicional e semanticamente direta para o local de confinamento dos leões.
theological_decisions:
- issue: Natureza do pedido proibido
  choice: fizer um pedido
  alternative: orar
  rationale: O aramaico abrange solicitações dirigidas tanto a uma divindade quanto a uma pessoa. Traduzir apenas como 'orar' estreitaria o alcance da ordem e poderia introduzir uma interpretação especificamente religiosa não exigida pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração administrativa foi preservada, e travessões esclarecem que os cargos seguintes detalham os altos funcionários. Evitou-se 'orar' para não reduzir a abrangência do pedido, e preferiu-se 'ser humano' a 'homem' para representar אֱנָשׁ sem possível ambiguidade de gênero.
