base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/017.yaml
  text: Then the king gave the command[a], and they brought Daniel and threw him into the den of lions. The king answered and said to Daniel, “Your God, whom you continually serve[b], he will deliver you.”
translation:
  language: pt
  text: 'Então o rei deu a ordem, e trouxeram Daniel e o lançaram na cova dos leões. O rei respondeu e disse a Daniel: “O seu Deus, a quem você serve continuamente, ele o livrará.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ele o livre”. Alguns entendem o aramaico como expressão de desejo, embora o texto principal siga o sentido declarativo mais direto: “ele o livrará”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a progressão da narrativa de modo natural e fiel ao aramaico.
- source_word: אֲמַר
  choice: deu a ordem
  rationale: Embora o verbo signifique literalmente “disse”, o contexto mostra uma ordem real imediatamente executada.
- source_word: וְהַיְתִיו
  choice: trouxeram
  rationale: A forma causativa de “vir” tem aqui o sentido idiomático de fazer Daniel chegar ao local.
- source_word: וּרְמוֹ
  choice: lançaram
  rationale: Preserva a força de atirar ou lançar sem usar uma expressão excessivamente coloquial.
- source_word: לְגֻבָּא דִּי אַרְיָוָתָא
  choice: na cova dos leões
  rationale: Reproduz com clareza a construção aramaica e corresponde ao uso tradicional e natural em português.
- source_word: עָנֵה ... וְאָמַר
  choice: tomou a palavra e disse
  rationale: Representa a fórmula narrativa semítica com naturalidade, preservando seus dois elementos.
- source_word: דִּי אנתה פָּלַח לֵהּ
  choice: a quem você serve
  rationale: “Servir” mantém a amplitude do verbo, que no contexto inclui devoção religiosa sem se limitar ao culto ritual.
- source_word: בִּתְדִירָא
  choice: continuamente
  rationale: Expressa a constância e regularidade do serviço de Daniel.
- source_word: הוּא יְשֵׁיזְבִנָּךְ
  choice: ele o livrará
  rationale: O pronome explícito conserva a ênfase do aramaico, e “livrará” comunica resgate diante do perigo com registro digno.
theological_decisions:
- issue: Força da declaração final do rei
  choice: 'declaração de confiança: “ele o livrará”'
  alternative: 'desejo ou súplica: “que ele o livre”'
  rationale: A forma aramaica admite naturalmente uma declaração no futuro. A nota preserva a leitura volitiva proposta por algumas traduções sem enfraquecer no texto principal a força declarativa mais direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” por naturalidade contemporânea e mantém “ele” antes de “o livrará” para refletir a ênfase do pronome independente no aramaico.
