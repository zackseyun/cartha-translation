  yaml_path: translation/ot/daniel/006/002.yaml
  text: It seemed good to Darius to appoint over the kingdom one hundred and twenty satraps[a], who would be throughout the whole kingdom.
translation:
  language: pt
  text: Dario achou por bem nomear cento e vinte sátrapas[a] para todo o reino, para que estivessem por todo o reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governadores provinciais”, referindo-se a altos funcionários administrativos persas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפַר קֳדָם דָּרְיָוֶשׁ
  choice: Dario achou por bem
  rationale: Reproduz naturalmente a expressão idiomática aramaica, indicando que a medida pareceu boa ou apropriada a Dario, sem enfatizar indevidamente uma reação emocional.
- source_word: וַהֲקִים
  choice: nomear
  rationale: No contexto administrativo, o verbo indica a investidura de pessoas num cargo, e não o ato físico de levantar ou estabelecer algo.
- source_word: עַל מַלְכוּתָא
  choice: sobre o reino
  rationale: Preserva a ideia de autoridade e jurisdição administrativa exercida em relação ao reino.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: sátrapas
  rationale: É o termo histórico consagrado para altos funcionários provinciais do governo persa; a nota oferece uma explicação acessível.
- source_word: מְאָה וְעֶשְׂרִין
  choice: cento e vinte
  rationale: Apresenta o número por extenso, de modo natural no texto corrido.
- source_word: דִּי לֶהֱוֺן
  choice: que ficariam
  rationale: Conserva a força prospectiva da construção relativa com imperfeito e se liga naturalmente à distribuição territorial dos funcionários.
- source_word: בְּכָל מַלְכוּתָא
  choice: distribuídos por todo o reino
  rationale: 'Explicita o sentido distributivo da expressão: os oficiais exerceriam suas funções pelas diversas partes de todo o território.'
