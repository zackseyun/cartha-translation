  source_fidelity: 'O sentido central está bem preservado: a decisão de Dario, a nomeação de 120 sátrapas e sua presença em toda a extensão do reino. Contudo, “nomear sobre o reino” é uma reprodução pouco idiomática de עַל מַלְכוּתָא em português. A construção final pode conservar melhor a finalidade/prospecção de דִּי לֶהֱוֺן sem a explicitação administrativa de “distribuídos”.'
