id: DAN.6.29
reference: Daniel 6:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/דָנִיֵּ֣אל דְּנָ֔ה הַצְלַ֖ח בְּ/מַלְכ֣וּת דָּרְיָ֑וֶשׁ וּ/בְ/מַלְכ֖וּת כּ֥וֹרֶשׁ פרסי/א׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/029.yaml
  text: And this Daniel prospered during the reign of Darius and during the reign of Cyrus the Persian[a].
translation:
  language: pt
  text: E este Daniel prosperou durante o reinado de Dario e durante o reinado de Ciro, o persa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “durante o reinado de Dario, isto é, durante o reinado de Ciro, o persa”, caso os dois nomes sejam entendidos como referentes ao mesmo governante.'
    reason: Leitura alternativa que preserva a possibilidade sintática e histórica sem impô-la ao texto principal.
lexical_decisions:
- source_word: דְּנָה
  choice: este
  rationale: O demonstrativo retoma Daniel de modo enfático; “este Daniel” preserva essa força e soa natural em português.
- source_word: הַצְלַח
  choice: prosperou
  rationale: O verbo indica ter êxito ou prosperar. “Prosperou” é conciso e não limita o sentido apenas à riqueza material.
- source_word: בְּמַלְכוּת
  choice: durante o reinado de
  rationale: Embora a expressão possa ser vertida literalmente como “no reino/reinado de”, aqui seu valor temporal é predominante.
- source_word: דָּרְיָוֶשׁ
  choice: Dario
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּבְמַלְכוּת
  choice: e durante o reinado de
  rationale: Mantém a repetição da estrutura aramaica, conferindo clareza e ritmo à frase.
- source_word: כּוֹרֶשׁ
  choice: Ciro
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: פרסי
  choice: o persa
  rationale: O gentílico identifica Ciro por sua origem ou vinculação imperial; “o persa” é uma tradução direta e natural.
theological_decisions:
- issue: Relação entre Dario e Ciro no versículo
  choice: Apresentar os dois segmentos de modo direto, sem determinar se Dario e Ciro eram a mesma pessoa ou governantes distintos.
  alternative: Entender os nomes como dois governantes sucessivos, ou entender Dario como outro nome ou título de Ciro.
  rationale: O texto menciona o reinado de Dario e o reinado de Ciro, o persa, mas não explica a relação entre eles. A tradução preserva essa tensão histórica e interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição “durante o reinado de” preserva a estrutura do original; a vírgula em “Ciro, o persa” torna o epíteto claro.
