id: DAN.6.4
reference: Daniel 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱדַ֨יִן֙ דָּנִיֵּ֣אל דְּנָ֔ה הֲוָ֣א מִתְנַצַּ֔ח עַל סָרְכַיָּ֖/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֑/א כָּ/ל קֳבֵ֗ל דִּ֣י ר֤וּחַ יַתִּירָא֙ בֵּ֔/הּ וּ/מַלְכָּ֣/א עֲשִׁ֔ית לַ/הֲקָמוּתֵ֖/הּ עַל כָּל מַלְכוּתָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/004.yaml
  text: Then this Daniel distinguished himself above the high officials and the satraps[a], because an extraordinary spirit was in him[b], and the king planned to set him over the whole kingdom.
translation:
  language: pt
  text: Então esse Daniel se destacava acima dos altos funcionários e dos sátrapas, porque nele havia um espírito extraordinário[a]; e o rei planejava colocá-lo sobre todo o reino[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito excelente”. A expressão pode referir-se, de modo amplo, à excepcional qualidade interior, sabedoria ou disposição de Daniel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e o rei pretendia nomeá-lo sobre todo o reino”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Introduz a etapa seguinte da narrativa de modo temporal e sequencial, com naturalidade em português.
- source_word: דָּנִיֵּאל דְּנָה
  choice: esse Daniel
  rationale: Conserva a ênfase do demonstrativo aramaico, em vez de reduzi-lo simplesmente ao nome próprio.
- source_word: הֲוָא מִתְנַצַּח
  choice: se destacava
  rationale: Expressa superioridade contínua ou característica em português corrente, sem reproduzir de maneira rígida a construção participial.
- source_word: עַל
  choice: acima de
  rationale: Marca aqui a superioridade comparativa de Daniel em relação aos demais oficiais, e não ainda sua autoridade sobre eles.
- source_word: סָרְכַיָּא
  choice: altos funcionários
  rationale: Designa membros superiores da administração imperial; a expressão é clara e evita títulos institucionais potencialmente enganosos.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: sátrapas
  rationale: Mantém o título histórico específico dos governadores do império persa, termo já estabelecido em português.
- source_word: כָּל־קֳבֵל דִּי
  choice: porque
  rationale: Apresenta de maneira direta a razão pela qual Daniel se destacava.
- source_word: רוּחַ יַתִּירָא
  choice: um espírito extraordinário
  rationale: Preserva a linguagem metafórica de 'espírito' e comunica a qualidade excepcional atribuída a Daniel sem reduzi-la apenas a habilidade ou caráter.
- source_word: בֵּהּ
  choice: nele havia
  rationale: Expressa naturalmente em português que esse espírito caracterizava interiormente Daniel.
- source_word: וּמַלְכָּא עֲשִׁית
  choice: e o rei planejava
  rationale: A expressão indica propósito ou intenção do rei, não uma ação já concluída.
- source_word: לַהֲקָמוּתֵהּ
  choice: colocá-lo
  rationale: Traduz idiomaticamente o causativo 'fazê-lo ficar de pé', isto é, pô-lo em uma posição de autoridade, sem especificar em excesso o procedimento administrativo.
- source_word: עַל כָּל מַלְכוּתָא
  choice: sobre todo o reino
  rationale: Indica autoridade sobre a totalidade do domínio real e mantém a formulação ampla do aramaico.
theological_decisions:
- issue: Sentido de 'espírito' na excelência de Daniel
  choice: Manter 'espírito' como descrição da qualidade interior excepcional de Daniel, sem definir sua natureza.
  alternative: Interpretar como 'capacidade excepcional', 'sabedoria extraordinária', 'caráter excelente' ou referência explícita ao Espírito de Deus.
  rationale: O aramaico não esclarece se a expressão se refere à disposição, à sabedoria, ao caráter ou à capacitação divina. A tradução preserva essa abertura literária e teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e as relações lógicas do aramaico foram preservadas, mas expressas com sintaxe natural. O título histórico “sátrapas” foi mantido por sua precisão, e a ambiguidade de “espírito” não foi resolvida interpretativamente.
