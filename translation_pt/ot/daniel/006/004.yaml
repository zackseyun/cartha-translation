  terminology: '“Sátrapas” conserva com precisão o título administrativo persa; “altos funcionários” comunica bem o papel de סָרְכַיָּא sem impor um cargo moderno específico. “Espírito” é corretamente mantido sem identificar dogmaticamente sua natureza. As notas estão ancoradas de modo coerente: [a] em “espírito extraordinário” e [b] na intenção de nomeação.'
