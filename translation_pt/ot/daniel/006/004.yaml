  source_fidelity: 'O texto reproduz com fidelidade as relações essenciais do aramaico: a progressão narrativa de אֱדַיִן, a ênfase de “esse Daniel”, a superioridade contínua expressa por הֲוָא מִתְנַצַּח, a causa introduzida por כָּל־קֳבֵל דִּי e a intenção, ainda não realizada, do rei. “Um espírito extraordinário” preserva adequadamente a abertura semântica de רוּחַ יַתִּירָא.'
