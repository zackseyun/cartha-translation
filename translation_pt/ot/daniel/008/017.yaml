  text: וַ/יָּבֹא֙ אֵ֣צֶל עָמְדִ֔/י וּ/בְ/בֹא֣/וֹ נִבְעַ֔תִּי וָ/אֶפְּלָ֖/ה עַל פָּנָ֑/י וַ/יֹּ֤אמֶר אֵלַ/י֙ הָבֵ֣ן בֶּן אָדָ֔ם כִּ֖י לְ/עֶת קֵ֥ץ הֶ/חָזֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/017.yaml
  text: So he came near where I was standing[a], and when he came, I was terrified and fell on my face. Then he said to me, “Understand, son of man[b], that the vision is for the time of the end.”
translation:
  language: pt
  text: 'Ele se aproximou de onde eu estava e, quando chegou, fiquei apavorado e caí com o rosto em terra. Então ele me disse: “Entenda, filho do homem[a], pois a visão se refere ao tempo do fim[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “ser humano” ou “mortal”. Hebraico: “filho do homem”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “a visão diz respeito ao tempo determinado do fim”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵצֶל עָמְדִי
  choice: para perto de onde eu estava
  rationale: אֵצֶל expressa proximidade, e עָמְדִי indica o lugar onde Daniel estava de pé. A formulação é natural em português e conserva o sentido espacial.
- source_word: נִבְעַתִּי
  choice: fiquei apavorado
  rationale: O nifal de בעת descreve alguém tomado de intenso medo. “Fiquei apavorado” comunica essa força com clareza atual.
- source_word: וָאֶפְּלָה עַל־פָּנַי
  choice: e caí com o rosto em terra
  rationale: A expressão hebraica descreve uma queda em posição prostrada. A tradução comunica naturalmente a postura sem perder a imagem concreta.
- source_word: הָבֵן
  choice: Entenda
  rationale: O imperativo hifil de בין exige compreensão ou discernimento. “Entenda” é direto e idiomático.
- source_word: בֶּן אָדָם
  choice: filho do homem
  rationale: A tradução literal preserva a forma de tratamento dada a Daniel, sua ênfase na condição humana e possíveis ressonâncias literárias, sem reduzi-la a uma paráfrase.
- source_word: לְעֵת קֵץ
  choice: ao tempo do fim
  rationale: A expressão relaciona a visão com o tempo de um fim ou desfecho. A formulação segue de perto o hebraico sem impor um esquema escatológico específico.
- source_word: הֶחָזוֹן
  choice: a visão
  rationale: O substantivo definido retoma a revelação que Daniel acaba de receber; “a visão” é suficiente e natural.
theological_decisions:
- issue: Sentido de בֶּן אָדָם no contexto apocalíptico
  choice: filho do homem
  alternative: ser humano; mortal
  rationale: A forma literal mantém a linguagem do texto e suas ressonâncias dentro de Daniel, ao mesmo tempo que a nota esclarece seu sentido possível como referência à condição humana.
- issue: Alcance de לְעֵת קֵץ
  choice: a visão se refere ao tempo do fim
  alternative: a visão diz respeito ao fim determinado
  rationale: A tradução afirma a relação da visão com um tempo de culminação, mas não define qual fim está em vista nem acrescenta um sistema escatológico ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. Conservou-se “filho do homem” por sua precisão formal e ressonância literária; as alternativas aparecem em nota. Os marcadores foram posicionados junto às expressões que de fato explicam.
