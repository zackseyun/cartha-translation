  text: הָ/אַ֥יִל אֲשֶׁר רָאִ֖יתָ בַּ֣עַל הַ/קְּרָנָ֑יִם מַלְכֵ֖י מָדַ֥י וּ/פָרָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/020.yaml
  text: The ram that you saw[a], the one with the two horns, is the kings of Media and Persia.
translation:
  language: pt
  text: O carneiro que você viu, aquele que tinha os dois chifres, representa os reis da Média e da Pérsia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  choice: o carneiro
  rationale: אַיִל designa um carneiro; é o termo natural e preciso no contexto da visão.
- source_word: אֲשֶׁר רָאִיתָ
  choice: que você viu
  rationale: A partícula relativa e o perfeito qal na segunda pessoa masculina singular formam naturalmente esta oração em português.
- source_word: בַּעַל הַקְּרָנַיִם
  choice: aquele que tinha os dois chifres
  rationale: בַּעַל significa literalmente possuidor ou senhor, mas nesta construção indica quem tem os chifres; o dual קְּרָנַיִם especifica dois.
- source_word: מַלְכֵי
  choice: representa os reis de
  rationale: A oração hebraica não tem verbo expresso. No contexto de interpretação de um símbolo, 'representa' comunica naturalmente a relação entre o carneiro e os reis, sem alterar o referente plural.
- source_word: מָדַי וּפָרָס
  choice: da Média e da Pérsia
  rationale: São as formas convencionais em português dos nomes geográficos, ligadas a 'reis' pela relação de pertencimento.
theological_decisions:
- issue: Sentido copulativo ou explicativo implícito na identificação simbólica
  choice: representa os reis da Média e da Pérsia
  alternative: é os reis da Média e da Pérsia
  rationale: O hebraico apresenta uma oração nominal sem cópula. 'Representa' torna clara em português a interpretação do símbolo e evita a construção gramaticalmente áspera 'é os reis', sem resolver nenhuma questão doutrinária além do que o contexto explicativo indica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o singular do símbolo e o plural de seus referentes, usando 'representa' para expressar naturalmente a relação simbólica.
