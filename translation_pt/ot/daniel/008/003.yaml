base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/003.yaml
  text: Then I lifted up my eyes and saw[a], and behold, one ram was standing before the canal, and it had two horns. The horns were high, but one was higher than the other[b], and the higher one came up last.
translation:
  language: pt
  text: 'Então levantei os olhos e vi: havia um carneiro em pé diante do canal[a]. Ele tinha dois chifres. Os chifres eram altos, mas um era mais alto que o outro, e o mais alto surgiu por último[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «curso de água», «riacho» ou «rio». O termo hebraico designa um curso de água e, em Daniel, provavelmente se refere a um canal.
    reason: lexical_alternative
  - marker: b
    text: Ou «e o mais alto cresceu depois».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Então levantei os olhos
  rationale: Preserva de modo natural a expressão hebraica que indica dirigir o olhar e mantém o estilo visionário.
- source_word: וָאֶרְאֶה וְהִנֵּה
  choice: 'e vi: diante de mim estava'
  rationale: O dois-pontos e a expressão deíctica comunicam a percepção vívida introduzida por הִנֵּה sem recorrer ao pouco corrente «eis».
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: אַיִל designa especificamente um carneiro. Em português, o artigo indefinido já apresenta uma única figura, de modo que acrescentar «um só» daria ênfase excessiva.
- source_word: עֹמֵד לִפְנֵי הָאֻבָל
  choice: estava um carneiro junto ao canal
  rationale: O particípio descreve a posição do animal. «Junto ao» expressa naturalmente a localização diante ou à margem do curso de água; «canal» se ajusta ao provável referente de אֻבָל em Daniel.
- source_word: וְלוֹ קְרָנָיִם
  choice: Ele tinha dois chifres
  rationale: Traduz idiomaticamente a construção possessiva hebraica e explicita o dual de קְרָנָיִם.
- source_word: וְהַקְּרָנַיִם גְּבֹהוֹת
  choice: os dois eram altos
  rationale: Mantém a noção física de altura de גְּבֹהוֹת; o referente «chifres» permanece claro no contexto imediato.
- source_word: וְהָאַחַת גְּבֹהָה מִן הַשֵּׁנִית
  choice: mas um era mais alto que o outro
  rationale: «Mas» torna explícito o contraste contextual, enquanto «o outro» é mais natural em português que «o segundo».
- source_word: וְהַגְּבֹהָה עֹלָה בָּאַחֲרֹנָה
  choice: e o mais alto surgiu por último
  rationale: «Surgiu» comunica o aparecimento ou crescimento do chifre, e «por último» preserva a ordem temporal indicada por בָּאַחֲרֹנָה.
theological_decisions:
- issue: Imagens simbólicas da visão apocalíptica
  choice: Manter as imagens concretas de carneiro e chifres sem explicá-las no corpo do versículo.
  alternative: Inserir no versículo a identificação histórica dos símbolos apresentada mais adiante no capítulo.
  rationale: A própria narrativa fornece posteriormente a interpretação. Antecipá-la eliminaria a progressão da visão e importaria explicação para o texto.
- issue: Nuance temporal do chifre mais alto
  choice: «surgiu por último»
  alternative: «cresceu depois»
  rationale: A formulação escolhida mantém tanto a ideia de surgimento/ascensão quanto a ordem temporal, sem decidir de maneira excessiva se o processo descrito é aparecimento ou crescimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita arcaísmos como «eis» sem perder a vivacidade do relato visionário; as notas preservam as principais alternativas lexicais.
