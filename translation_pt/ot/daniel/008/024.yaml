  text: וְ/עָצַ֤ם כֹּח/וֹ֙ וְ/לֹ֣א בְ/כֹח֔/וֹ וְ/נִפְלָא֥וֹת יַשְׁחִ֖ית וְ/הִצְלִ֣יחַ וְ/עָשָׂ֑ה וְ/הִשְׁחִ֥ית עֲצוּמִ֖ים וְ/עַם קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/024.yaml
  text: His power will become strong[a], but not by his own power. He will bring about extraordinary destruction, and he will succeed and act; he will destroy the mighty and the people of the holy ones.
translation:
  language: pt
  text: Seu poder se tornará grande, mas não por seu próprio poder. Ele causará destruição extraordinária, terá êxito e agirá; destruirá os poderosos e o povo dos santos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o povo santo” ou “o povo dos seres santos”.'
    reason: Leituras alternativas da construção וְעַם קְדֹשִׁים, cujo plural e relação sintática permitem mais de uma compreensão.
lexical_decisions:
- source_word: וְעָצַם כֹּחוֹ
  choice: Seu poder se tornará forte
  rationale: O verbo עָצַם com כֹּחַ exprime tornar-se forte ou poderoso. A formulação verbal preserva a força predicativa do hebraico.
- source_word: וְלֹא בְכֹחוֹ
  choice: mas não por seu próprio poder
  rationale: A preposição בְּ indica aqui meio ou fonte. “Próprio” explicita em português o contraste contextual sem identificar de onde vem esse poder.
- source_word: וְנִפְלָאוֹת יַשְׁחִית
  choice: Ele causará destruição extraordinária
  rationale: נִפְלָאוֹת denota algo extraordinário ou espantoso; em combinação com שׁחת, descreve uma devastação fora do comum, não maravilhas positivas.
- source_word: וְהִצְלִיחַ
  choice: terá êxito
  rationale: O hifil de צלח significa prosperar ou ter êxito. “Terá êxito” comunica eficácia sem sugerir aprovação moral.
- source_word: וְעָשָׂה
  choice: e agirá
  rationale: 'עשה é amplo: fazer ou agir. A tradução evita acrescentar “como quiser”, ideia não expressa diretamente no texto.'
- source_word: וְהִשְׁחִית
  choice: destruirá
  rationale: No contexto de violência e opressão, “destruir” expressa adequadamente שׁחת.
- source_word: עֲצוּמִים
  choice: os poderosos
  rationale: O adjetivo substantivado designa pessoas fortes ou poderosas.
- source_word: וְעַם קְדֹשִׁים
  choice: o povo dos santos
  rationale: A construção nominal significa literalmente “povo de santos/de seres santos”. Esta forma preserva o plural קְדֹשִׁים e a relação de construção, enquanto a leitura idiomática “o povo santo” fica registrada em nota.
theological_decisions:
- issue: Referente e nuance de וְעַם קְדֹשִׁים
  choice: o povo dos santos
  alternative: o povo santo; o povo dos seres santos
  rationale: O plural קְדֹשִׁים pode designar santos ou seres santos e a expressão também pode funcionar idiomaticamente como referência ao povo santo de Deus. O texto principal preserva a construção e o plural hebraicos; a nota mantém a alternativa sem decidir silenciosamente a tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “poder” conserva o contraste do hebraico; o ponto e vírgula mantém unidas as ações sucessivas sem produzir uma frase excessivamente longa.
