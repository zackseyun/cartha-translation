id: DAN.8.2
reference: Daniel 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָֽ/אֶרְאֶה֮ בֶּ/חָזוֹן֒ וַ/יְהִי֙ בִּ/רְאֹתִ֔/י וַ/אֲנִי֙ בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֔ה אֲשֶׁ֖ר בְּ/עֵילָ֣ם הַ/מְּדִינָ֑ה וָ/אֶרְאֶה֙ בֶּֽ/חָז֔וֹן וַ/אֲנִ֥י הָיִ֖יתִי עַל אוּבַ֥ל אוּלָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/002.yaml
  text: And I saw in the vision[a], and when I saw, I was in Susa the citadel, which is in the province of Elam; and I saw in the vision that I was beside the Ulai Canal.
translation:
  language: pt
  text: Vi na visão[a] e, quando vi, eu estava em Susã, a cidadela, que fica na província de Elão; vi na visão que eu estava junto ao canal Ulai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa visão”.
    reason: O hebraico pode ser entendido como referência à visão específica ou, de modo mais indefinido, a uma visão.
  - marker: b
    text: Ou “rio Ulai” ou “ribeiro Ulai”. O termo hebraico designa mais amplamente um curso de água; “canal” se ajusta bem ao provável contexto de Susã.
    reason: Alternativa lexical para oubal, termo que pode designar diferentes tipos de curso de água.
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Eu vi
  rationale: O verbo narra a experiência visionária passada de Daniel; “vi” é a forma natural em português.
- source_word: בֶּחָזוֹן
  choice: na visão
  rationale: A expressão situa o que Daniel viu dentro da experiência visionária específica mencionada no contexto.
- source_word: וַיְהִי בִּרְאֹתִי
  choice: que estava
  rationale: A construção hebraica introduz o que se verificou quando Daniel viu; em português, a formulação explicita naturalmente que sua localização fazia parte da cena percebida.
- source_word: בְּשׁוּשַׁן
  choice: em Susã
  rationale: “Susã” é a forma tradicional e reconhecível do topônimo em português.
- source_word: הַבִּירָה
  choice: a cidadela
  rationale: O termo designa um centro real e administrativo fortificado; “cidadela” preserva esse sentido sem restringi-lo apenas ao palácio.
- source_word: אֲשֶׁר בְּעֵילָם הַמְּדִינָה
  choice: que fica na província de Elão
  rationale: A formulação identifica geograficamente Susã e verte הַמְּדִינָה como uma unidade administrativa.
- source_word: וָאֶרְאֶה בֶּחָזוֹן
  choice: enquanto contemplava a visão
  rationale: Na segunda ocorrência, a variação evita repetição pesada e preserva o sentido de Daniel estar vendo a cena visionária.
- source_word: וַאֲנִי הָיִיתִי
  choice: eu estava
  rationale: Mantém a afirmação explícita da posição percebida por Daniel, sem decidir se sua presença era física ou apenas visionária.
- source_word: עַל
  choice: junto a
  rationale: Com um curso de água, a preposição indica localização ao lado ou nas proximidades, não necessariamente sobre ele.
- source_word: אוּבַל
  choice: canal
  rationale: O substantivo indica um curso de água e, no ambiente de Susã, provavelmente se refere a um canal; outras traduções possíveis são registradas em nota.
- source_word: אוּלָי
  choice: Ulai
  rationale: É um nome geográfico próprio, transliterado de modo convencional.
theological_decisions:
- issue: Natureza da presença de Daniel em Susã
  choice: Manter a afirmação sem especificar se Daniel foi transportado fisicamente ou se apenas se viu ali na visão.
  alternative: Explicitar que ele estava em Susã somente em visão, ou que estava fisicamente presente.
  rationale: O hebraico relata sua localização no quadro visionário, mas não resolve de maneira inequívoca a natureza dessa presença.
translation_notes:
  register: Português moderno, claro e digno, com topônimos de uso bíblico corrente. A sintaxe foi suavizada para legibilidade sem eliminar a repetição visionária do hebraico. O marcador [b] deve acompanhar “canal Ulai” no texto.
