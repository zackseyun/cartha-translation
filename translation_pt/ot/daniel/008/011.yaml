source:
  edition: WLC
  text: וְ/עַ֥ד שַֽׂר הַ/צָּבָ֖א הִגְדִּ֑יל וּ/מִמֶּ֨/נּוּ֙ הרים הַ/תָּמִ֔יד וְ/הֻשְׁלַ֖ךְ מְכ֥וֹן מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/011.yaml
  text: It even magnified itself up to the Prince of the host[a], and from him the regular offering was taken away[c][b], and the place of his sanctuary was cast down.
translation:
  language: pt
  text: Chegou a engrandecer-se até o Príncipe do exército[a]; dele foi retirada a oferta regular[b], e o lugar do seu santuário foi lançado por terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Comandante do exército”. O título não identifica explicitamente essa figura nem determina se o exército é celestial ou humano.
    reason: lexical_alternative
  - marker: b
    text: Também traduzido por “sacrifício contínuo”, “oferta contínua” ou “oferta diária”. No contexto do templo, o hebraico se refere ao serviço sacrificial realizado regularmente. “Dele” segue literalmente o pronome hebraico; seu antecedente é debatido.
    reason: lexical_alternative
  - marker: c
    text: Ou “o fundamento do seu santuário”. O termo hebraico pode indicar lugar ou sítio estabelecido, bem como fundamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד
  choice: chegou ... até contra
  rationale: עַד indica o alcance da exaltação; em português, a construção expressa que ela chegou ao ponto de afrontar o Príncipe, sem perder a ideia de extensão.
- source_word: שַׂר הַצָּבָא
  choice: o Príncipe do exército
  rationale: שַׂר pode significar príncipe, governante ou comandante. “Príncipe” preserva o título elevado, enquanto “exército” mantém aberto se צָבָא designa uma força celestial ou outra coletividade organizada.
- source_word: הִגְדִּיל
  choice: engrandecer-se
  rationale: No contexto, o hifil descreve exaltação arrogante. A forma pronominal portuguesa comunica a ideia reflexiva sem identificar além do texto o sujeito ou o alvo.
- source_word: וּמִמֶּנּוּ
  choice: dele
  rationale: O sufixo hebraico é masculino singular. “Dele” reproduz essa forma e conserva a incerteza quanto ao antecedente.
- source_word: הרים
  choice: foi retirado
  rationale: No contexto cultual, a elevação expressa pela raiz tem o sentido efetivo de remoção. A construção passiva corresponde à leitura contextual e evita explicitar um agente não nomeado.
- source_word: הַתָּמִיד
  choice: o sacrifício contínuo
  rationale: תָּמִיד significa literalmente “contínuo/regular” e, no contexto do santuário, funciona elipticamente para o serviço sacrificial regular. “Sacrifício contínuo” é claro e mantém a formulação cultual tradicional sem acrescentar “holocausto” ao texto.
- source_word: וְהֻשְׁלַךְ
  choice: foi lançado por terra
  rationale: O hofal exige sentido passivo e conserva a imagem violenta de algo lançado abaixo.
- source_word: מְכוֹן
  choice: o lugar
  rationale: מָכוֹן pode indicar lugar estabelecido, sítio ou fundamento. “Lugar” é natural e evita restringir o termo à fundação estrutural.
- source_word: מִקְדָּשׁוֹ
  choice: seu santuário
  rationale: “Santuário” expressa o sentido cultual de מִקְדָּשׁ sem limitá-lo necessariamente a todo o complexo do templo.
theological_decisions:
- issue: Identidade do “Príncipe do exército”
  choice: O título é mantido sem identificar seu referente.
  alternative: Um príncipe celestial ou governante angélico; o próprio Deus; o sumo sacerdote Onias III; ou o Messias em certas leituras cristãs.
  rationale: O título hebraico é elevado, mas o versículo não identifica expressamente a figura. A tradução preserva essa tensão interpretativa.
- issue: Antecedente do pronome em “dele”
  choice: O pronome masculino singular é preservado sem explicação no texto principal.
  alternative: “Dela”, caso se entenda que a referência remonta à coletividade do exército; ou uma construção impessoal.
  rationale: O antecedente é debatido, e explicitá-lo resolveria uma ambiguidade genuína do hebraico.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantêm-se o paralelismo, a voz passiva e as ambiguidades relativas ao título, ao pronome e ao termo cultual; as alternativas relevantes ficam nas notas.
