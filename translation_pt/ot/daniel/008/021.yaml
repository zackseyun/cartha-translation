base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/021.yaml
  text: And the shaggy male goat is the king of Greece[b][a], and the great horn that is between his eyes is the first king.
translation:
  language: pt
  text: E o bode peludo[a] é o rei da Grécia[b]; o grande chifre que está entre os olhos dele é o primeiro rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o bode macho”, ou simplesmente “o bode”. A expressão hebraica é vívida e descreve um bode macho peludo.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Javã”, termo que aqui normalmente se refere à Grécia ou ao domínio grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּפִיר הַשָּׂעִיר
  choice: o bode peludo
  rationale: A expressão combina uma designação de bode macho com seu aspecto peludo. “Bode peludo” preserva os dois elementos e mantém a imagem vívida em português natural.
- source_word: מֶלֶךְ יָוָן
  choice: o rei da Grécia
  rationale: Neste contexto, יָוָן designa a Grécia ou o domínio grego. Como מֶלֶךְ é singular e pessoal, “rei da Grécia” reproduz mais diretamente a formulação hebraica do que “reino da Grécia”.
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: o grande chifre
  rationale: “Grande chifre” conserva a imagem simbólica e pode expressar tanto dimensão quanto proeminência.
- source_word: אֲשֶׁר בֵּין עֵינָיו
  choice: que está entre os olhos dele
  rationale: O presente “está” corresponde naturalmente à oração hebraica sem verbo expresso. “Dele” retém a referência masculina singular sem tornar a construção artificial.
- source_word: הוּא הַמֶּלֶךְ הָרִאשׁוֹן
  choice: é o primeiro rei
  rationale: רִאשׁוֹן indica aqui o primeiro em uma sequência. “Rei” mantém a correspondência com מֶלֶךְ na primeira parte do versículo.
theological_decisions:
- issue: Referente simbólico do bode e do chifre
  choice: O bode representa o rei da Grécia, e o grande chifre representa o primeiro rei.
  alternative: Entender o bode coletivamente como o reino ou poder grego.
  rationale: O hebraico diz literalmente “rei da Grécia” e identifica depois o chifre como “o primeiro rei”. A tradução preserva a própria explicação simbólica do texto sem inserir no versículo uma identificação histórica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva o paralelismo interpretativo do hebraico e mantém a distinção entre o bode, o chifre e seus referentes.
