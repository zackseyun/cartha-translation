  text: רָאִ֣יתִי אֶת הָ/אַ֡יִל מְנַגֵּחַ֩ יָ֨מָּ/ה וְ/צָפ֜וֹנָ/ה וָ/נֶ֗גְבָּ/ה וְ/כָל חַיּוֹת֙ לֹֽא יַֽעַמְד֣וּ לְ/פָנָ֔י/ו וְ/אֵ֥ין מַצִּ֖יל מִ/יָּד֑/וֹ וְ/עָשָׂ֥ה כִ/רְצֹנ֖/וֹ וְ/הִגְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/004.yaml
  text: I saw the ram charging westward and northward and southward[a], and no beasts could stand before him, and there was no one who could rescue from his hand. He did as he pleased and became great.
translation:
  language: pt
  text: Vi o carneiro investindo para o oeste, para o norte e para o sul. Nenhum animal podia manter-se de pé diante dele, e não havia quem pudesse livrar da mão dele. Ele fazia o que queria e se tornou grande.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “engrandeceu-se” ou “cresceu em grandeza”. O hebraico pode indicar tanto tornar-se grande como engrandecer a si mesmo.'
    reason: Alternativa lexical que preserva a ambiguidade do hiphil וְהִגְדִּיל.
lexical_decisions:
- source_word: רָאִיתִי
  choice: Vi
  rationale: O qal perfeito na primeira pessoa do singular introduz, de modo direto, aquilo que Daniel viu na visão.
- source_word: הָאַיִל
  choice: o carneiro
  rationale: אַיִל designa um carneiro; o artigo definido identifica o animal já presente na cena visionária.
- source_word: מְנַגֵּחַ
  choice: dando chifradas
  rationale: O particípio de נגח descreve a ação vigorosa de um animal que ataca com os chifres. A expressão é clara e preserva a imagem específica do carneiro.
- source_word: יָמָּה וְצָפוֹנָה וָנֶגְבָּה
  choice: para o oeste, para o norte e para o sul
  rationale: O ה direcional indica movimento em direção a esses pontos cardeais.
- source_word: וְכָל חַיּוֹת לֹא יַעַמְדוּ לְפָנָיו
  choice: Nenhum animal conseguia ficar de pé diante dele
  rationale: No contexto visionário, חַיּוֹת são animais. A combinação da negação com o verbo expressa incapacidade de resistir, enquanto 'ficar de pé diante dele' conserva a imagem hebraica.
- source_word: וְאֵין מַצִּיל מִיָּדוֹ
  choice: e não havia quem livrasse alguém de sua mão
  rationale: O hiphil de נצל significa livrar ou resgatar. 'De sua mão' preserva a metáfora hebraica de domínio ou poder; 'alguém' explicita apenas o objeto subentendido necessário em português.
- source_word: וְעָשָׂה כִרְצֹנוֹ
  choice: Ele fazia o que queria
  rationale: A expressão indica agir segundo a própria vontade. O imperfeito português descreve naturalmente a atuação continuada do carneiro na cena.
- source_word: וְהִגְדִּיל
  choice: e se tornou grande
  rationale: O hiphil de גדל pode indicar tornar-se grande ou engrandecer-se. Esta formulação acompanha o crescimento de poder sem impor uma avaliação moral mais específica.
theological_decisions:
- issue: Se וְהִגְדִּיל deve ser entendido reflexivamente como autoengrandecimento ou, de modo mais geral, como crescimento em grandeza e poder
  choice: e se tornou grande
  alternative: e se engrandeceu; e cresceu em grandeza
  rationale: O hebraico não traz pronome reflexivo explícito, e o contexto imediato ressalta o êxito e a expansão do poder do carneiro. A tradução principal preserva essa amplitude; a nota registra as possibilidades reflexivas e resultativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva as imagens hebraicas de ficar de pé diante do carneiro e ser livrado de sua mão. O marcador da nota foi colocado após a expressão a que efetivamente se refere.
