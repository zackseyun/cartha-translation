revisions:
- from: Vi o carneiro dando chifradas para o oeste, para o norte e para o sul. Nenhum animal conseguia ficar de pé diante dele, e não havia quem livrasse alguém de sua mão. Ele fazia o que queria e se tornou grande.[a]
  to: Vi o carneiro investindo para o oeste, para o norte e para o sul. Nenhum animal podia manter-se de pé diante dele, e não havia quem pudesse livrar da mão dele. Ele fazia o que queria e se tornou grande.[a]
  rationale: A revisão elimina o objeto acrescentado em «livrasse alguém», preservando a construção aberta de «não havia quem pudesse livrar da mão dele». Também substitui uma formulação mais coloquial por «investindo», adequada à ação de um animal com chifres e ao registro do texto. A nota e seu marcador continuam corretamente vinculados a «se tornou grande».
