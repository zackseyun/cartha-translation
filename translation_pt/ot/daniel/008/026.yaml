  text: וּ/מַרְאֵ֨ה הָ/עֶ֧רֶב וְ/הַ/בֹּ֛קֶר אֲשֶׁ֥ר נֶאֱמַ֖ר אֱמֶ֣ת ה֑וּא וְ/אַתָּה֙ סְתֹ֣ם הֶֽ/חָז֔וֹן כִּ֖י לְ/יָמִ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/026.yaml
  text: And the vision of the evening and the morning that was spoken is true; but you, seal up the vision, for it concerns many days from now.
translation:
  language: pt
  text: A visão das tardes e das manhãs, da qual se falou, é verdadeira. Quanto a você, sele a visão, pois ela se refere a muitos dias no futuro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַרְאֵה הָעֶרֶב וְהַבֹּקֶר
  choice: a visão das tardes e das manhãs
  rationale: Mantém a formulação temporal concreta e a ligação com Daniel 8:14, usando o plural idiomático em português para a sequência mencionada.
- source_word: סְתֹם
  choice: sele
  rationale: O verbo pode comunicar fechar, guardar ou selar. “Sele” preserva aqui a ideia de tornar o conteúdo seguro e reservado, sem implicar necessariamente ocultação absoluta.
- source_word: לְיָמִים רַבִּים
  choice: a muitos dias no futuro
  rationale: Expressa naturalmente a distância temporal indicada pelo hebraico, sem converter “dias” em uma duração cronológica mais específica.
theological_decisions:
- issue: Sentido da ordem para selar a visão
  choice: sele a visão
  alternative: feche a visão / guarde em segredo a visão
  rationale: A tradução conserva a imagem profética de selar, evitando decidir se a ordem significa apenas preservar, autenticar ou ocultar.
- issue: Referência temporal de לְיָמִים רַבִּים
  choice: ela se refere a muitos dias no futuro
  alternative: isso acontecerá daqui a muitos dias
  rationale: Mantém a referência geral a um futuro distante sem determinar de modo indevido a data, a duração ou o cumprimento escatológico.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição “tardes e manhãs” foi preservada por sua importância contextual.
