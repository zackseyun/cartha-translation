source:
  edition: WLC
  text: וְ/עַל שִׂכְל֗/וֹ וְ/הִצְלִ֤יחַ מִרְמָה֙ בְּ/יָד֔/וֹ וּ/בִ/לְבָב֣/וֹ יַגְדִּ֔יל וּ/בְ/שַׁלְוָ֖ה יַשְׁחִ֣ית רַבִּ֑ים וְ/עַ֤ל שַׂר שָׂרִים֙ יַעֲמֹ֔ד וּ/בְ/אֶ֥פֶס יָ֖ד יִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/025.yaml
  text: And through his shrewdness he will make deceit prosper in his hand; and in his heart he will magnify himself. In a time of security he will destroy many[a], and he will rise up against the Prince of princes; but he will be broken without hand.
translation:
  language: pt
  text: Por sua astúcia, fará o engano prosperar em sua mão; em seu coração, se engrandecerá. Em tempo de segurança, destruirá muitos e se levantará contra o Príncipe dos príncipes; mas será quebrado sem mão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem mão humana”; isto é, não pelo poder humano comum.'
    reason: A expressão hebraica é literalmente “sem mão”, mas pode indicar uma derrota que não ocorre por ação ou poder humano comum. A nota esclarece essa possibilidade sem tornar a explicação interpretativa parte do texto principal.
lexical_decisions:
- source_word: שִׂכְלוֹ
  choice: sua astúcia
  rationale: O termo pode indicar discernimento, prudência ou habilidade; no contexto hostil, “astúcia” comunica inteligência usada de modo moralmente negativo sem reduzir o sentido apenas a fraude.
- source_word: וְהִצְלִיחַ מִרְמָה בְּיָדוֹ
  choice: fará o engano prosperar em suas mãos
  rationale: O hifil de צלח é causativo, tendo מִרְמָה como objeto. A formulação preserva tanto a ideia de fazer o engano ter êxito quanto a imagem hebraica de algo em suas mãos, isto é, sob seu domínio ou por sua ação.
- source_word: וּבִלְבָבוֹ יַגְדִּיל
  choice: em seu coração, engrandecerá a si mesmo
  rationale: O objeto reflexivo está implícito no hebraico. A tradução mantém a imagem interior do coração e o sentido de exaltação orgulhosa.
- source_word: וּבְשַׁלְוָה יַשְׁחִית רַבִּים
  choice: quando muitos se sentirem seguros, ele os destruirá
  rationale: שַׁלְוָה denota tranquilidade, despreocupação ou segurança. A construção hebraica admite relação circunstancial; esta formulação natural em português apresenta os muitos como desprevenidos sem sugerir necessariamente um período formal de paz.
- source_word: שַׂר שָׂרִים
  choice: Príncipe dos príncipes
  rationale: A cadeia construta expressa supremacia hierárquica. “Príncipe dos príncipes” preserva a forma elevada do título sem identificar seu referente além do que o versículo afirma.
- source_word: וְעַל ... יַעֲמֹד
  choice: se levantará contra
  rationale: Com עַל, עמד expressa oposição hostil. “Levantar-se contra” é idiomático e conserva a imagem verbal.
- source_word: וּבְאֶפֶס יָד
  choice: sem intervenção humana
  rationale: A expressão elíptica significa literalmente “sem mão” e indica que sua queda não será produzida pelo poder humano comum. A tradução explicita o sentido idiomático, enquanto a nota registra a forma literal.
- source_word: יִשָּׁבֵר
  choice: será quebrado
  rationale: O nifal de שׁבר é passivo. “Será quebrado” mantém a metáfora e deixa implícito quem executa o juízo.
theological_decisions:
- issue: Referente e capitalização de שַׂר שָׂרִים
  choice: Príncipe dos príncipes
  alternative: príncipe dos príncipes; Soberano dos soberanos
  rationale: O contexto apresenta a figura como o governante supremo contra quem o rei se insurge. A inicial maiúscula sinaliza uso titular e provável referente transcendente, sem especificar mais precisamente sua identidade.
- issue: Agente da quebra em וּבְאֶפֶס יָד
  choice: sem intervenção humana
  alternative: sem mão; sem o poder de mão humana
  rationale: Embora “humana” não esteja lexicalmente expresso, o idioma contrasta essa derrota com a ação humana comum. A formulação não nomeia diretamente Deus como agente e, assim, preserva a reserva do hebraico.
- issue: Relação de וּבְשַׁלְוָה com רַבִּים
  choice: quando muitos se sentirem seguros
  alternative: em tempo de segurança, destruirá muitos; de repente destruirá muitos
  rationale: A sintaxe é compacta e pode descrever a condição de tranquilidade ou segurança em que ocorre a destruição. A tradução escolhida preserva a ideia de vítimas desprevenidas sem adotar a leitura menos provável de “de repente”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se imagens centrais como “em suas mãos”, “em seu coração”, “Príncipe dos príncipes” e “será quebrado”; a expressão idiomática final é esclarecida no texto e documentada literalmente em nota.
