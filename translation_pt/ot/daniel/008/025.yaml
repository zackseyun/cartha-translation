review_pass:
  verdict: revise
  source_fidelity: A revisão preserva o valor causativo de הִצְלִיחַ (“fará ... prosperar”), a imagem de “em sua mão”, a autoexaltação interior, a oposição ao “Príncipe dos príncipes” e a passiva “será quebrado”. O texto revisto também mantém a concisão e a ambiguidade sintática de בְּשַׁלְוָה e a expressão elíptica final, em vez de antecipar suas explicações no corpo do versículo.
  naturalness: A redação é moderna, clara e digna. “Por sua astúcia” é mais direta do que “Por causa de sua astúcia”; “se engrandecerá” é idiomático no contexto de orgulho; e “Em tempo de segurança” evita atribuir explicitamente a segurança a “muitos”, algo que o hebraico não determina de modo inequívoco.
  terminology: “Astúcia”, “engano”, “Príncipe dos príncipes” e “será quebrado” são adequados. “Sem mão” conserva a imagem e a reserva do hebraico; a nota oferece a explicação idiomática sem transformá-la em elemento do texto principal.
  issues:
  - severity: medium
    issue: “Quando muitos se sentirem seguros, ele os destruirá” resolve uma ambiguidade sintática.
    rationale: בְּשַׁלְוָה (“em segurança/tranquilidade”) pode caracterizar as circunstâncias da destruição, mas o hebraico não explicita que “muitos” sejam o sujeito que se sente seguro. “Em tempo de segurança, destruirá muitos” preserva melhor a concisão e a abertura do original.
  - severity: medium
    issue: “Sem intervenção humana” substitui no texto a expressão elíptica “sem mão”.
    rationale: Embora a explicação seja plausível, “humana” não está expresso no hebraico. A formulação interpretativa deve ficar na nota, enquanto o corpo mantém a expressão breve e deliberadamente não especificada.
  - severity: low
    issue: “Por causa de sua astúcia” é mais explicativo do que necessário.
    rationale: A preposição על pode ter força instrumental ou causal. “Por sua astúcia” mantém ambas as possibilidades de maneira mais concisa e natural.
  revised_text: Por sua astúcia, fará o engano prosperar em sua mão; em seu coração, se engrandecerá. Em tempo de segurança, destruirá muitos e se levantará contra o Príncipe dos príncipes; mas será quebrado sem mão.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: “sem mão humana”; isto é, não pelo poder humano comum.'
    reason: A expressão hebraica é literalmente “sem mão”, mas pode indicar uma derrota que não ocorre por ação ou poder humano comum. A nota esclarece essa possibilidade sem tornar a explicação interpretativa parte do texto principal.
  revision_rationale: 'A revisão restaura no texto principal duas ambiguidades significativas do hebraico: o alcance circunstancial de “em segurança” e a expressão final “sem mão”. Também ajusta a primeira oração para uma formulação portuguesa mais concisa, sem alterar o sentido causal/instrumental da astúcia. A capitalização titular de “Príncipe dos príncipes” é mantida, sem identificar além do necessário o referente.'
