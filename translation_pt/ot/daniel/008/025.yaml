revisions:
- from: Por causa de sua astúcia, fará o engano prosperar em suas mãos; em seu coração, engrandecerá a si mesmo. Quando muitos se sentirem seguros, ele os destruirá e se levantará contra o Príncipe dos príncipes; mas será quebrado sem intervenção humana.[a]
  to: Por sua astúcia, fará o engano prosperar em sua mão; em seu coração, se engrandecerá. Em tempo de segurança, destruirá muitos e se levantará contra o Príncipe dos príncipes; mas será quebrado sem mão.[a]
  rationale: 'A revisão restaura no texto principal duas ambiguidades significativas do hebraico: o alcance circunstancial de “em segurança” e a expressão final “sem mão”. Também ajusta a primeira oração para uma formulação portuguesa mais concisa, sem alterar o sentido causal/instrumental da astúcia. A capitalização titular de “Príncipe dos príncipes” é mantida, sem identificar além do necessário o referente.'
  reviewer_model: gpt-5.6-terra
