base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/019.yaml
  text: Then he said, “Look, I am making known to you what will happen in the latter part of the indignation, for the end is for the appointed time.”
translation:
  language: pt
  text: 'Então ele disse: “Veja, vou lhe dar a conhecer o que acontecerá na parte final da indignação, pois o fim será no tempo determinado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Veja
  rationale: Sinaliza a chamada de atenção enfática do hebraico de modo natural em português moderno.
- source_word: מוֹדִיעֲךָ
  choice: vou lhe dar a conhecer
  rationale: 'Expressa a construção causativa: o mensageiro fará Daniel saber o que ocorrerá.'
- source_word: בְּאַחֲרִית הַזָּעַם
  choice: na parte final da indignação
  rationale: Preserva a ideia temporal de אַחֲרִית e mantém 'indignação' como termo teologicamente não especificado para זַעַם.
- source_word: לְמוֹעֵד קֵץ
  choice: o fim será no tempo determinado
  rationale: Mantém 'fim' como sujeito lógico e מוֹעֵד como um tempo fixado ou determinado, sem acrescentar quem o determinou.
theological_decisions:
- issue: Referente e natureza da indignação
  choice: a indignação
  alternative: a ira de Deus
  rationale: O versículo não explicita o possuidor nem identifica diretamente a indignação; a tradução preserva essa abertura.
- issue: Relação entre o fim e o tempo determinado
  choice: pois o fim será no tempo determinado
  alternative: pois isso é para o tempo determinado do fim
  rationale: Segue a leitura sintática refletida no texto de consulta e produz português claro, mantendo que o fim corresponde ao tempo estabelecido.
