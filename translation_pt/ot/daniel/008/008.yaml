  terminology: “Bode”, “grande chifre”, “chifres proeminentes” e “quatro ventos do céu” são escolhas adequadas. A nota a, porém, introduz “figuras”, termo ausente tanto do texto quanto da alternativa lexical e que enfraquece a referência explícita aos chifres.
