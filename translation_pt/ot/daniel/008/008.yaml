  text: וּ/צְפִ֥יר הָ/עִזִּ֖ים הִגְדִּ֣יל עַד מְאֹ֑ד וּ/כְ/עָצְמ֗/וֹ נִשְׁבְּרָה֙ הַ/קֶּ֣רֶן הַ/גְּדוֹלָ֔ה וַֽ/תַּעֲלֶ֜נָה חָז֤וּת אַרְבַּע֙ תַּחְתֶּ֔י/הָ לְ/אַרְבַּ֖ע רוּח֥וֹת הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/008.yaml
  text: And the male goat grew exceedingly great[a], but when he was strong, the great horn was broken[b], and in its place four conspicuous horns came up toward the four winds of heaven.
translation:
  language: pt
  text: O bode tornou-se extremamente grande; mas, quando estava forte, o grande chifre foi quebrado, e em seu lugar[b] surgiram quatro chifres proeminentes[a], voltados para os quatro ventos do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quatro notáveis”; o termo hebraico descreve algo visível ou proeminente, e “chifres” é suprido pelo contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “debaixo dele”; neste contexto, o sentido é “em seu lugar” ou “em vez dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְפִיר הָעִזִּים
  choice: o bode
  rationale: A expressão designa especificamente um bode, isto é, o macho da cabra. Em português, “bode” comunica essa especificidade de modo natural e claro.
- source_word: הִגְדִּיל עַד מְאֹד
  choice: cresceu extraordinariamente
  rationale: Preserva tanto a ideia de aumento em poder ou importância quanto a forte intensificação de עַד מְאֹד, em linguagem portuguesa natural.
- source_word: וּכְעָצְמוֹ
  choice: quando estava forte
  rationale: Mantém o valor temporal da construção e sua referência direta à força ou ao poder do bode, sem acrescentar a ideia interpretativa de que esse fosse necessariamente o auge de seu poder.
- source_word: נִשְׁבְּרָה
  choice: foi quebrado
  rationale: Reproduz diretamente a forma passiva do hebraico e conserva a imagem do chifre que se rompe.
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: o grande chifre
  rationale: Mantém a imagem simbólica da visão; “grande” pode expressar tanto dimensão quanto importância.
- source_word: וַתַּעֲלֶנָה
  choice: surgiram
  rationale: Expressa naturalmente o aparecimento dos quatro chifres na visão e corresponde ao sentido contextual de עלה.
- source_word: חָזוּת אַרְבַּע
  choice: quatro chifres proeminentes
  rationale: חָזוּת descreve algo visível, destacado ou notável. “Chifres” é suprido pelo contexto, e “proeminentes” preserva a noção de destaque sem impor uma interpretação histórica.
- source_word: תַּחְתֶּיהָ
  choice: em seu lugar
  rationale: Embora a expressão signifique literalmente “debaixo dele”, neste contexto indica que os quatro chifres substituem o grande chifre quebrado.
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: voltados para os quatro ventos do céu
  rationale: Conserva a imagem bíblica dos quatro ventos e torna explícita, sem a reduzir a pontos cardeais, a orientação dos chifres nas quatro direções.
theological_decisions:
- issue: Preservar ou interpretar a linguagem simbólica da visão
  choice: Manter “chifre” e “quatro ventos do céu” como imagens da visão.
  alternative: Substituir “chifre” por rei ou reino e “ventos” por direções ou pontos cardeais.
  rationale: O próprio capítulo fornece interpretação posterior para os símbolos. Traduzir aqui as imagens sem identificá-las historicamente preserva a progressão do texto e evita inserir uma leitura doutrinária ou histórica na tradução.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a concisão e as imagens apocalípticas do hebraico. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem, corrigindo o desalinhamento aparente na camada inglesa fornecida.
