source:
  edition: WLC
  text: וַ/אֲנִ֣י הָיִ֣יתִי מֵבִ֗ין וְ/הִנֵּ֤ה צְפִיר הָֽ/עִזִּים֙ בָּ֤א מִן הַֽ/מַּעֲרָב֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֵ֥ין נוֹגֵ֖עַ בָּ/אָ֑רֶץ וְ/הַ֨/צָּפִ֔יר קֶ֥רֶן חָז֖וּת בֵּ֥ין עֵינָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/005.yaml
  text: As I was considering[a], behold, a male goat came from the west over the face of the whole earth, without touching the ground[c][b]; and the goat had a conspicuous horn between its eyes.
translation:
  language: pt
  text: Enquanto eu refletia, eis que um bode vinha do ocidente sobre a face de toda a terra[a], sem tocar o chão[b]; e o bode tinha um chifre proeminente[c] entre os olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por toda a região”. A palavra hebraica pode significar tanto “terra” quanto “região” ou “país”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “e não havia contato com a terra”, imagem de velocidade extraordinária.'
    reason: literal_rendering
  - marker: c
    text: 'Ou: “bem visível” ou “notável”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי מֵבִין
  choice: eu procurava entender
  rationale: A construção com היה e particípio indica ação contínua. No contexto da visão, Daniel está empenhado em compreender o que vê, não apenas declarando que possuía entendimento.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a força vívida do marcador que introduz um novo elemento da visão, em registro profético digno e ainda compreensível.
- source_word: צְפִיר הָעִזִּים
  choice: um bode
  rationale: A expressão designa especificamente um caprino macho. Em português, “bode” comunica esse dado de modo direto e natural.
- source_word: מִן הַמַּעֲרָב
  choice: do ocidente
  rationale: מַעֲרָב indica o oeste, associado ao lugar do pôr do sol. “Ocidente” é claro e adequado ao registro bíblico moderno.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: por sobre toda a superfície da terra
  rationale: Preserva a imagem espacial de movimento sobre a face ou superfície da terra, sem restringir silenciosamente אֶרֶץ a um território local.
- source_word: וְאֵין נוֹגֵעַ בָּאָרֶץ
  choice: sem tocar o chão
  rationale: Expressa naturalmente em português a imagem de velocidade extraordinária. “Chão” evita uma repetição pouco elegante de “terra” sem alterar a cena.
- source_word: קֶרֶן חָזוּת
  choice: um chifre proeminente
  rationale: “Chifre” conserva a imagem animal e seu posterior valor simbólico; “proeminente” comunica que ele se destacava visualmente, deixando em nota a alternativa “bem visível”.
- source_word: בֵּין עֵינָיו
  choice: entre os olhos
  rationale: Reproduz de maneira direta a localização indicada pelo hebraico, sem substituí-la interpretativamente por “na testa”.
theological_decisions:
- issue: Imagens simbólicas na visão apocalíptica
  choice: Manter literalmente o bode e o chifre, sem identificá-los nesta etapa da narrativa.
  alternative: Traduzir já em termos do reino e do governante explicados mais adiante no capítulo.
  rationale: O versículo apresenta primeiro os símbolos e só depois fornece sua interpretação. Preservar essa sequência evita inserir no texto uma explicação ainda não dada.
- issue: Alcance de כָל הָאָרֶץ
  choice: Traduzir “toda a terra” e registrar a alternativa territorial em nota.
  alternative: Fixar no texto “toda a região” ou “todo o país”.
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma terra ou região. O caráter abrangente da visão favorece “toda a terra”, mas a alternativa lexical genuína não deve ser ocultada.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira. “Eis que” conserva deliberadamente o tom visionário; “bode” é mais natural e preciso que uma perífrase como “cabra macho”. A ordem das imagens e sua ambiguidade simbólica foram preservadas.
