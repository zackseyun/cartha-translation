id: DAN.8.14
reference: Daniel 8:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י עַ֚ד עֶ֣רֶב בֹּ֔קֶר אַלְפַּ֖יִם וּ/שְׁלֹ֣שׁ מֵא֑וֹת וְ/נִצְדַּ֖ק קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/014.yaml
  text: And he said to me[a], “Until 2,300 evenings and mornings[b]; then the sanctuary will be restored.”
translation:
  language: pt
  text: 'E ele me disse: “Até 2.300 tardes e manhãs[a]; então o santuário será restaurado[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até tarde-manhã, 2.300”. A expressão pode se referir tanto a 2.300 dias completos quanto a 2.300 ofertas da tarde e da manhã, correspondentes a cerca de 1.150 dias.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “então o santuário será purificado”, “vindicado” ou “justificado”. O verbo hebraico significa literalmente ser posto em ordem ou em seu devido estado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: E ele me disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa, e אֵלַי indica o destinatário em primeira pessoa. A formulação é direta e natural em português.
- source_word: עַד
  choice: Até
  rationale: Marca o limite temporal pedido pela pergunta anterior e preserva com precisão a ideia de duração até determinado ponto.
- source_word: עֶרֶב בֹּקֶר
  choice: tardes e manhãs
  rationale: Mantém os dois substantivos da expressão hebraica e, com o plural exigido naturalmente pela contagem em português, não decide se são dias completos ou ocorrências ligadas às ofertas diárias.
- source_word: אַלְפַּיִם וּשְׁלֹשׁ מֵאוֹת
  choice: '2.300'
  rationale: Expressa o numeral cardinal no formato convencional do português moderno.
- source_word: וְנִצְדַּק
  choice: será restaurado
  rationale: O nifal de צדק comunica que algo será posto em seu estado correto, vindicado ou restabelecido. “Será restaurado” expressa esse sentido no contexto do santuário sem impor a interpretação mais específica de purificação ritual.
- source_word: קֹדֶשׁ
  choice: o santuário
  rationale: No contexto do templo profanado em Daniel 8, קֹדֶשׁ se refere mais naturalmente ao santuário ou lugar santo, não à santidade em abstrato.
theological_decisions:
- issue: Sentido de וְנִצְדַּק קֹדֶשׁ em relação ao templo
  choice: o santuário será restaurado
  alternative: o santuário será purificado, vindicado ou justificado
  rationale: O hebraico emprega צדק, e não o verbo mais esperado para “purificar”, טהר. A tradução principal conserva o sentido amplo de pôr em ordem ou restabelecer, enquanto a nota registra alternativas relevantes sem impor uma interpretação histórica ou doutrinária específica.
- issue: Se עֶרֶב בֹּקֶר indica 2.300 dias completos ou 2.300 ofertas da tarde e da manhã
  choice: 2.300 tardes e manhãs
  alternative: 2.300 dias, ou cerca de 1.150 dias se forem contadas separadamente as ofertas da tarde e da manhã
  rationale: A expressão hebraica permite debate quanto ao modo de contagem. A tradução mantém a formulação concreta do texto e deixa a questão cronológica em aberto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A coordenação inicial preserva o fluxo hebraico; a ordem da frase permanece concisa. As notas retêm as ambiguidades cronológica e lexical sem favorecer uma leitura denominacional.
