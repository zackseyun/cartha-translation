  text: וַ/אֲנִ֣י דָנִיֵּ֗אל נִהְיֵ֤יתִי וְ/נֶֽחֱלֵ֨יתִי֙ יָמִ֔ים וָ/אָק֕וּם וָ/אֶֽעֱשֶׂ֖ה אֶת מְלֶ֣אכֶת הַ/מֶּ֑לֶךְ וָ/אֶשְׁתּוֹמֵ֥ם עַל הַ/מַּרְאֶ֖ה וְ/אֵ֥ין מֵבִֽין־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/027.yaml
  text: And I[a], Daniel, was overcome and was sick for days. Then I rose and did the king’s work, but I was appalled by the vision, and there was no one who understood it.
translation:
  language: pt
  text: Eu, Daniel, fiquei exausto e adoeci durante dias. Depois, levantei-me e realizei o trabalho do rei. Fiquei estarrecido com a visão, e não havia quem a entendesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas eu não a entendia”. A expressão hebraica é concisa e pode ser entendida de modo impessoal (“não havia quem a entendesse”) ou como uma referência ao próprio Daniel.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִהְיֵיתִי
  choice: fiquei exausto
  rationale: Nesse contexto, o verbo descreve o estado resultante provocado pela visão, não mera existência. “Fiquei exausto” comunica o abatimento profundo de Daniel sem afirmar especificamente que ele desmaiou.
- source_word: וְנֶחֱלֵיתִי
  choice: e adoeci
  rationale: O nifal de חלה pode indicar adoecer ou ficar debilitado. “Adoeci” é natural em português e distingue a enfermidade do esgotamento expresso pelo verbo anterior.
- source_word: יָמִים
  choice: por alguns dias
  rationale: O plural hebraico indica um período não especificado. “Por alguns dias” soa natural em português e evita determinar uma duração exata.
- source_word: וָאָקוּם
  choice: Depois, levantei-me
  rationale: A forma narrativa faz a sequência avançar e indica que Daniel se recuperou o suficiente para retomar suas atividades. “Depois” explicita naturalmente essa progressão temporal.
- source_word: וָאֶעֱשֶׂה אֶת מְלֶאכֶת הַמֶּלֶךְ
  choice: e cuidei dos assuntos do rei
  rationale: מְלָאכָה pode designar trabalho, tarefa ou negócios. A expressão escolhida comunica de modo atual e digno que Daniel retomou suas responsabilidades na administração real.
- source_word: וָאֶשְׁתּוֹמֵם
  choice: fiquei estarrecido
  rationale: A forma verbal expressa forte perturbação, assombro ou desolação, mais do que simples surpresa. “Estarrecido” preserva o impacto intenso e desorientador da visão.
- source_word: הַמַּרְאֶה
  choice: a visão
  rationale: No contexto de Daniel, o substantivo se refere à revelação contemplada, e não apenas a uma aparência visual.
- source_word: וְאֵין מֵבִין
  choice: e não havia quem a entendesse
  rationale: A construção hebraica é concisa e não apresenta sujeito explícito. Esta formulação conserva a leitura existencial mais direta e permanece natural em português.
theological_decisions:
- issue: Sujeito de וְאֵין מֵבִין
  choice: 'Leitura existencial e impessoal: “não havia quem a entendesse”'
  alternative: 'Leitura pessoal: “mas eu não a entendia”'
  rationale: O hebraico não contém pronome explícito de primeira pessoa e, literalmente, apresenta a ausência de alguém que entenda. Contudo, a reação de Daniel no contexto permite que ele próprio seja o sujeito implícito; por isso, a alternativa é preservada em nota, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém a sequência narrativa e a intensidade emocional do hebraico, evitando linguagem excessivamente arcaica e preservando em nota a ambiguidade da frase final.
