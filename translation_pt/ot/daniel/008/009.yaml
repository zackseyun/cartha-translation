  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִן הָ/אַחַ֣ת מֵ/הֶ֔ם יָצָ֥א קֶֽרֶן אַחַ֖ת מִ/צְּעִירָ֑ה וַ/תִּגְדַּל יֶ֛תֶר אֶל הַ/נֶּ֥גֶב וְ/אֶל הַ/מִּזְרָ֖ח וְ/אֶל הַ/צֶּֽבִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/009.yaml
  text: And out of one of them came a small horn[a], and it grew exceedingly great toward the south, toward the east[b], and toward the Beautiful Land.
translation:
  language: pt
  text: E de um deles saiu um pequeno chifre[a], que cresceu extraordinariamente em direção ao sul, ao leste e à Terra Formosa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um chifre pequeno”.
    reason: lexical_alternative
  - marker: b
    text: Ou “terra gloriosa” ou “terra desejável”. A expressão hebraica é um título descritivo que provavelmente se refere à terra de Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הָאַחַת מֵהֶם
  choice: E de um deles
  rationale: A construção com מִן indica origem. A formulação preserva o referente pronominal plural e a ambiguidade presente no hebraico.
- source_word: יָצָא
  choice: saiu
  rationale: O verbo expressa movimento para fora ou surgimento; “saiu” é direto e natural no contexto da imagem.
- source_word: קֶרֶן אַחַת מִצְּעִירָה
  choice: um pequeno chifre
  rationale: Mantém literalmente o símbolo apocalíptico de “chifre” e expressa a pequenez inicial sem interpretá-lo como rei ou poder.
- source_word: וַתִּגְדַּל יֶתֶר
  choice: que cresceu extraordinariamente
  rationale: “Cresceu” conserva a ideia verbal de desenvolvimento, enquanto “extraordinariamente” comunica a forte intensificação de יֶתֶר.
- source_word: אֶל הַנֶּגֶב
  choice: em direção ao sul
  rationale: Na sequência geográfica, נֶגֶב funciona naturalmente como direção cardinal, embora também possa designar o Neguebe.
- source_word: וְאֶל הַמִּזְרָח
  choice: ao leste
  rationale: מִזְרָח designa o leste, literalmente associado ao nascer do sol; a forma curta evita repetição pesada sem alterar a relação direcional.
- source_word: וְאֶל הַצְּבִי
  choice: e à Terra Formosa
  rationale: צְבִי comunica beleza, esplendor ou atratividade. “Terra Formosa” preserva o título descritivo e sua provável referência geográfica sem substituí-lo explicitamente por “Israel”.
theological_decisions:
- issue: Se o símbolo apocalíptico do chifre deve ser interpretado no texto principal
  choice: Preservar “chifre” sem explicação interpretativa
  alternative: rei, poder ou reino
  rationale: O hebraico apresenta o símbolo, não sua interpretação neste versículo; explicitá-la resolveria indevidamente a imagem.
- issue: Como verter הַצְּבִי
  choice: Terra Formosa
  alternative: terra gloriosa; terra desejável; terra de Israel
  rationale: A tradução mantém o caráter de epíteto descritivo e não identifica explicitamente a região além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura direcional foi suavizada para evitar repetição excessiva, e os símbolos e epítetos do hebraico foram preservados.
