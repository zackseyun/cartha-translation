  text: וְ/צָבָ֛א תִּנָּתֵ֥ן עַל הַ/תָּמִ֖יד בְּ/פָ֑שַׁע וְ/תַשְׁלֵ֤ךְ אֱמֶת֙ אַ֔רְצָ/ה וְ/עָשְׂתָ֖ה וְ/הִצְלִֽיחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/012.yaml
  text: And a host was given over with the regular burnt offering because of transgression[a]; and it cast truth to the ground[c][b], and it acted and prospered.
translation:
  language: pt
  text: E um exército foi entregue juntamente com o sacrifício regular, por causa da transgressão[a]; lançou a verdade por terra[b] e agiu e prosperou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o sacrifício diário» ou «a oferta contínua». O hebraico tamid se refere à oferta regular do templo.
    reason: lexical_alternative
  - marker: b
    text: 'Os verbos hebraicos «lançou», «agiu» e «prosperou» estão no feminino singular, mas o referente exato fica condensado na visão e pode ser a potência hostil simbolizada no contexto anterior. Por isso, o português omite o pronome. A construção hebraica também é difícil: em vez de «juntamente com o sacrifício regular», alguns entendem «contra o sacrifício regular».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְצָבָא
  choice: um exército
  rationale: צָבָא pode indicar exército, hoste ou um corpo organizado. «Um exército» é natural em português e conserva o sentido coletivo no contexto da visão.
- source_word: תִּנָּתֵן
  choice: foi entregue
  rationale: O nifal de נתן é passivo. «Foi entregue» expressa a transferência para o poder de outro sem explicitar um agente ausente do hebraico.
- source_word: עַל הַתָּמִיד
  choice: juntamente com o sacrifício regular
  rationale: A construção com עַל é difícil. «Juntamente com» apresenta o exército e o sacrifício regular como participantes de um destino comum, sem excluir em nota a leitura «contra».
- source_word: הַתָּמִיד
  choice: o sacrifício regular
  rationale: No contexto do culto, תָּמִיד designa a oferta sacrificial contínua ou regular do templo. «Sacrifício regular» é claro e evita acrescentar «holocausto», termo não expresso neste versículo.
- source_word: בְּפָשַׁע
  choice: por causa da transgressão
  rationale: O בְּ admite aqui valor causal ou circunstancial. A formulação conserva indefinido quem comete a transgressão.
- source_word: וְתַשְׁלֵךְ
  choice: ela lançou
  rationale: O hifil de שלך significa lançar ou atirar. «Lançou» mantém a força da imagem e a forma feminina do verbo hebraico.
- source_word: אֱמֶת
  choice: a verdade
  rationale: אֱמֶת pode significar verdade ou fidelidade. «A verdade» preserva sua ampla força moral e religiosa neste contexto.
- source_word: אַרְצָה
  choice: por terra
  rationale: A forma direcional significa literalmente «à terra/ao chão»; «por terra» é uma expressão portuguesa natural para o ato de derrubar ou aviltar.
- source_word: וְעָשְׂתָה
  choice: agiu
  rationale: עשה é deliberadamente amplo e não tem objeto expresso. «Agiu» conserva a concisão sem acrescentar «como quis».
- source_word: וְהִצְלִיחָה
  choice: prosperou
  rationale: O hifil de צלח pode significar prosperar ou ter êxito. «Prosperou» mantém o tom profético e não implica aprovação moral.
theological_decisions:
- issue: Referente e agência dos verbos femininos singulares
  choice: Usar «ela» sem identificar explicitamente o referente.
  alternative: «ele», «o chifre» ou repetição explícita de outro referente
  rationale: Os três verbos finais estão no feminino singular, embora o referente esteja comprimido na visão. O pronome feminino reproduz esse dado gramatical e a nota reconhece a incerteza, sem identificar dogmaticamente a potência hostil.
- issue: Sentido de תָּמִיד
  choice: «o sacrifício regular»
  alternative: «o sacrifício diário» ou «a oferta contínua»
  rationale: O termo designa a prática sacrificial regular do templo. A tradução comunica o sentido cultual sem depender de uma formulação confessional tradicional.
- issue: Relação expressa por עַל
  choice: «juntamente com»
  alternative: «contra»
  rationale: A sintaxe hebraica é difícil. A leitura escolhida associa o exército e o sacrifício regular na entrega, enquanto a nota preserva a alternativa adversativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém-se a concisão do hebraico e assinalam-se em nota as dificuldades sintáticas e referenciais, sem resolver a ambiguidade da visão.
