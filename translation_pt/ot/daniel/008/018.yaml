base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/018.yaml
  text: And while he was speaking with me[a], I fell into a deep sleep with my face to the ground[b]; but he touched me and made me stand up where I had been standing.
translation:
  language: pt
  text: Enquanto ele falava comigo, caí num sono profundo[a], com o rosto em terra; mas ele me tocou e me pôs de pé, no lugar em que eu estava[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “fiquei num sono profundo” ou “caí num estado semelhante a um transe”. O hebraico descreve alguém vencido por sono profundo ou torpor.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e me fez ficar de pé sobre a minha posição de pé”. A expressão provavelmente indica que ele tornou a colocar Daniel de pé, no lugar em que estava.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: Enquanto ele falava comigo
  rationale: A preposição בְּ com o infinitivo construto tem valor temporal, e עִם significa normalmente “com”. A formulação preserva a ação em curso e soa natural em português.
- source_word: נִרְדַּמְתִּי
  choice: caí num sono profundo
  rationale: O nifal de רדם indica ser vencido por sono profundo ou torpor. “Caí num sono profundo” expressa o aspecto ingressivo sem impor a categoria técnica de transe.
- source_word: עַל־פָּנַי אָרְצָה
  choice: com o rosto em terra
  rationale: A expressão significa literalmente “sobre o meu rosto, em direção à terra” e descreve de modo conciso a posição de Daniel.
- source_word: וַיִּגַּע בִּי
  choice: ele me tocou
  rationale: נגע com בְּ tem aqui o sentido comum de tocar; o contexto não exige um verbo mais forte.
- source_word: וַיַּעֲמִידֵנִי עַל־עָמְדִי
  choice: me fez ficar de pé onde eu estava
  rationale: O hifil de עמד é causativo, “fazer ficar de pé”. A expressão comprimida עַל־עָמְדִי, literalmente “sobre o meu estar de pé”, indica a restauração de Daniel à posição ou ao lugar em que estava, sem introduzir “pés”, termo ausente do hebraico.
theological_decisions:
- issue: Natureza do estado de Daniel durante a visão
  choice: sono profundo ou torpor físico
  alternative: transe ou êxtase visionário em sentido técnico
  rationale: רדם descreve sono profundo ou torpor. A tradução conserva a descrição narrativa da reação corporal de Daniel sem atribuir ao termo uma categoria teológica mais específica do que o hebraico permite.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Mantém-se a ambiguidade de נִרְדַּמְתִּי na nota e evita-se acrescentar “pés”, palavra que não ocorre no texto hebraico.
