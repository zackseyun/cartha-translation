  text: וְ/הַ֨/נִּשְׁבֶּ֔רֶת וַ/תַּֽעֲמֹ֥דְנָה אַרְבַּ֖ע תַּחְתֶּ֑י/הָ אַרְבַּ֧ע מַלְכֻי֛וֹת מִ/גּ֥וֹי יַעֲמֹ֖דְנָה וְ/לֹ֥א בְ/כֹחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/022.yaml
  text: 'And as for the broken horn[a], in whose place four arose: four kingdoms will arise from that nation, but not with its power.'
translation:
  language: pt
  text: 'Quanto ao chifre que foi quebrado, em cujo lugar surgiram quatro: quatro reinos surgirão daquela nação, mas não com o poder dele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas não com o poder daquele chifre”, isto é, com o poder do reino anterior.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁבֶּרֶת
  choice: Quanto ao chifre que foi quebrado
  rationale: O particípio feminino singular retoma o substantivo feminino «chifre» no versículo anterior. O referente implícito é explicitado para dar clareza, e «Quanto a» transmite a função explicativa da interpretação.
- source_word: וַתַּעֲמֹדְנָה אַרְבַּע תַּחְתֶּיהָ
  choice: em cujo lugar surgiram quatro
  rationale: עמד indica aqui o surgimento de poderes, e תַּחְתֶּיהָ significa «em seu lugar». A formulação conserva a referência ao chifre e soa natural em português.
- source_word: אַרְבַּע מַלְכֻיּוֹת
  choice: quatro reinos
  rationale: Embora o substantivo possa denotar realeza ou domínio régio, «quatro reinos» comunica naturalmente os domínios sucessores neste contexto político-apocalíptico.
- source_word: מִגּוֹי
  choice: daquela nação
  rationale: גּוֹי significa «nação» ou «povo». O demonstrativo torna clara a retomada da nação mencionada no contexto sem identificá-la além do que o texto diz.
- source_word: יַעֲמֹדְנָה
  choice: surgirão
  rationale: עמד descreve a ascensão ou o aparecimento de poderes políticos; «surgirão» é idiomático e adequado ao discurso profético.
- source_word: וְלֹא בְכֹחוֹ
  choice: mas não com o poder dele
  rationale: O sufixo é masculino singular e aponta com maior naturalidade para o rei anterior representado pelo chifre. «Dele» preserva essa referência pessoal sem inserir no texto um nome histórico.
theological_decisions:
- issue: Referente do sufixo pronominal em וְלֹא בְכֹחוֹ
  choice: «não com o poder dele», referindo-se ao rei anterior representado pelo chifre quebrado
  alternative: «não com o seu poder», entendendo a referência de modo simbólico como o poder do chifre ou do reino anterior
  rationale: O hebraico traz um sufixo masculino singular, o que favorece a referência ao rei de 8:21, embora rei, chifre e reino estejam estreitamente associados na visão. A nota conserva a leitura simbólica alternativa sem identificar dogmaticamente o governante.
translation_notes:
  register: Português moderno, claro e digno, com estrutura explicativa próxima do hebraico. Emprega-se «chifre», termo comum na linguagem bíblica e necessário para manter o símbolo da visão. A colocação do marcador após a oração indica que a nota se refere à expressão final.
