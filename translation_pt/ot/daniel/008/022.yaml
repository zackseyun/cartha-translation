  source_fidelity: 'A tradução reproduz adequadamente a estrutura interpretativa do hebraico: o chifre quebrado, o surgimento de quatro em seu lugar, quatro reinos procedentes daquela nação e a limitação final de poder. «Quatro reinos» é uma representação apropriada de מַלְכֻיּוֹת neste contexto. A formulação «o poder dele» conserva, sem identificação histórica indevida, a referência masculina singular de בְּכֹחוֹ.'
