  text: בִּ/שְׁנַ֣ת שָׁל֔וֹשׁ לְ/מַלְכ֖וּת בֵּלְאשַׁצַּ֣ר הַ/מֶּ֑לֶךְ חָז֞וֹן נִרְאָ֤ה אֵלַ/י֙ אֲנִ֣י דָנִיֵּ֔אל אַחֲרֵ֛י הַ/נִּרְאָ֥ה אֵלַ֖/י בַּ/תְּחִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/001.yaml
  text: In the third year of the reign of Belshazzar the king[a], a vision appeared to me—I, Daniel—after the one that had appeared to me at the first.
translation:
  language: pt
  text: No terceiro ano do reinado do rei Belsazar, apareceu-me uma visão — a mim, Daniel — depois da que me havia aparecido no início.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, depois da visão que me havia aparecido no início. O hebraico remete a uma manifestação anterior e provavelmente alude à visão relatada no capítulo anterior.
    reason: Esclarece o referente implícito de «da que» sem inserir «visão» no texto principal e apresenta a alusão à visão precedente como provável, não certa.
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ
  choice: No terceiro ano
  rationale: A fórmula hebraica de datação usa o número cardinal com sentido ordinal; em português, “no terceiro ano” é a forma natural.
- source_word: לְמַלְכוּת
  choice: do reinado de
  rationale: Neste contexto cronológico, מַלְכוּת designa o período de governo real; “reinado” é claro e idiomático.
- source_word: בֵּלְאשַׁצַּר הַמֶּלֶךְ
  choice: do rei Belsazar
  rationale: A construção portuguesa natural antepõe o título ao nome, sem omitir o título expresso no hebraico.
- source_word: חָזוֹן נִרְאָה אֵלַי
  choice: tive uma visão
  rationale: Embora a construção hebraica seja literalmente “uma visão apareceu a mim”, “tive uma visão” comunica de modo natural em português a experiência visionária, sem acrescentar a ideia de que Daniel a produziu.
- source_word: אֲנִי דָנִיֵּאל
  choice: eu, Daniel
  rationale: Mantém a identificação enfática expressa pelo pronome independente seguido do nome.
- source_word: אַחֲרֵי הַנִּרְאָה אֵלַי
  choice: depois daquela que me havia aparecido
  rationale: “Daquela” fornece o apoio nominal exigido em português e remete à visão anterior sem repetir explicitamente “visão”; o mais-que-perfeito composto torna clara a anterioridade.
- source_word: בַּתְּחִלָּה
  choice: no princípio
  rationale: Preserva o sentido definido da expressão hebraica e aponta para a visão anterior na sequência, sem reduzi-la simplesmente a “antes”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem “rei Belsazar” foi preferida por naturalidade, enquanto “eu, Daniel” conserva a ênfase autobiográfica do hebraico. “No princípio” mantém a formulação temporal marcada do original.
