id: DAN.8.10
reference: Daniel 8:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּגְדַּ֖ל עַד צְבָ֣א הַ/שָּׁמָ֑יִם וַ/תַּפֵּ֥ל אַ֛רְצָ/ה מִן הַ/צָּבָ֥א וּ/מִן הַ/כּוֹכָבִ֖ים וַֽ/תִּרְמְסֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/010.yaml
  text: It grew as high as the host of heaven[a], and it cast some of the host and some of the stars down to the earth, and trampled them.
translation:
  language: pt
  text: Ele cresceu até alcançar o exército do céu[a] e lançou por terra alguns do exército e algumas das estrelas, e os pisoteou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a hoste do céu”. A expressão pode representar seres celestes, o povo de Deus ou poderes celestiais; o hebraico deixa a imagem em aberto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְדַּל
  choice: Ele cresceu
  rationale: O qal consecutivo de גדל descreve aumento em grandeza ou extensão. “Cresceu” mantém a imagem do chifre e evita introduzir o sentido reflexivo não explícito de “engrandeceu-se”.
- source_word: עַד
  choice: até alcançar
  rationale: A preposição indica extensão até o nível do exército celeste. “Até alcançar” comunica naturalmente o movimento ascendente sem transformar a comparação em igualdade estrita.
- source_word: צְבָא הַשָּׁמַיִם
  choice: o exército do céu
  rationale: צָבָא pode significar exército ou hoste. “Exército do céu” é claro em português e conserva a possível referência a seres celestes, ao povo de Deus ou a poderes astrais.
- source_word: וַתַּפֵּל
  choice: lançou ... por terra
  rationale: O hifil de נפל é causativo, “fazer cair”. “Lançou por terra” preserva a força da ação e incorpora naturalmente a direção indicada por אַרְצָה.
- source_word: אַרְצָה
  choice: por terra
  rationale: A forma direcional de אֶרֶץ expressa movimento para a terra ou o chão. A locução portuguesa é idiomática e mantém o contraste vertical da visão.
- source_word: מִן הַצָּבָא וּמִן הַכּוֹכָבִים
  choice: alguns do exército e algumas das estrelas
  rationale: מִן tem sentido partitivo neste contexto. Explicitar “alguns/algumas” evita sugerir que todo o exército e todas as estrelas foram derrubados.
- source_word: הַכּוֹכָבִים
  choice: as estrelas
  rationale: Tradução direta de כּוֹכָבִים; preserva a imagem apocalíptica sem substituir o termo por uma identificação interpretativa.
- source_word: וַתִּרְמְסֵם
  choice: e os pisoteou
  rationale: רמס significa pisar ou calcar. “Pisoteou” transmite de forma concisa a violência da ação; o pronome retoma coletivamente os integrantes derrubados do exército e das estrelas.
theological_decisions:
- issue: Identificação do “exército do céu” e das “estrelas”
  choice: Manter as imagens literais sem identificar seus referentes no texto principal
  alternative: Traduzir interpretativamente como anjos, povo de Deus/santos ou governantes simbolizados por corpos celestes
  rationale: O hebraico apresenta imagens apocalípticas, mas não identifica explicitamente seus referentes neste versículo. A tradução conserva a ambiguidade e a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Exército” é mais corrente que “hoste”, enquanto a nota registra a alternativa tradicional. A construção conserva o caráter visionário e a ambiguidade do hebraico.
