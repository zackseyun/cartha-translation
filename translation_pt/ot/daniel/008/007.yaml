  text: וּ/רְאִיתִ֞י/ו מַגִּ֣יעַ אֵ֣צֶל הָ/אַ֗יִל וַ/יִּתְמַרְמַ֤ר אֵלָי/ו֙ וַ/יַּ֣ךְ אֶת הָ/אַ֔יִל וַ/יְשַׁבֵּר֙ אֶת שְׁתֵּ֣י קְרָנָ֔י/ו וְ/לֹא הָ֥יָה כֹ֛חַ בָּ/אַ֖יִל לַ/עֲמֹ֣ד לְ/פָנָ֑י/ו וַ/יַּשְׁלִיכֵ֤/הוּ אַ֨רְצָ/ה֙ וַֽ/יִּרְמְסֵ֔/הוּ וְ/לֹא הָיָ֥ה מַצִּ֛יל לָ/אַ֖יִל מִ/יָּדֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/007.yaml
  text: And I saw him come up to the ram[a], and he was enraged against him, and he struck the ram and broke its two horns. And there was no strength in the ram to stand before him; he threw him to the ground and trampled him[d][c][b], and there was no one to rescue the ram from his hand.
translation:
  language: pt
  text: Eu o vi chegar perto do carneiro[a]. Ele se enfureceu contra ele[b], golpeou o carneiro e quebrou os dois chifres dele. O carneiro não tinha força para resistir-lhe[c]. Ele o lançou por terra e o pisoteou, e não houve quem livrasse o carneiro de seu poder[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aproximar-se do carneiro”. O verbo hebraico pode indicar chegar perto ou alcançar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “amargurou-se contra ele”. A expressão hebraica transmite hostilidade intensa ou ira marcada por amargura.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “para ficar de pé diante dele”; neste confronto, a expressão tem o sentido de resistir-lhe.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “de sua mão”, expressão hebraica que indica estar sob o poder ou controle de alguém.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתִיו
  choice: Eu o vi
  rationale: Mantém a primeira pessoa do relato da visão e o sufixo masculino singular, que retoma o bode no contexto.
- source_word: מַגִּיעַ אֵצֶל
  choice: chegar perto de
  rationale: Expressa o movimento até as proximidades do carneiro e preserva a possibilidade lexical de aproximação sem afirmar necessariamente contato.
- source_word: הָאַיִל
  choice: o carneiro
  rationale: É a designação comum de אַיִל neste contexto de visão animal simbólica.
- source_word: וַיִּתְמַרְמַר אֵלָיו
  choice: Enfurecido contra ele
  rationale: Comunica a hostilidade intensa ou o amargor irado do Hitpael de מרר de modo natural em português.
- source_word: וַיַּךְ
  choice: atacou
  rationale: No contexto do combate, traduz naturalmente o golpe violento de נכה; evita a possível leitura de um único golpe sugerida por 'feriu'.
- source_word: וַיְשַׁבֵּר אֶת שְׁתֵּי קְרָנָיו
  choice: quebrou os seus dois chifres
  rationale: Reproduz diretamente שבר e deixa claro que os chifres pertencem ao carneiro.
- source_word: וְלֹא הָיָה כֹחַ בָּאַיִל
  choice: O carneiro não tinha força
  rationale: Forma portuguesa clara e natural para a construção existencial hebraica, mantendo a imagem física do confronto.
- source_word: לַעֲמֹד לְפָנָיו
  choice: para resistir-lhe
  rationale: Torna explícito o sentido contextual de 'ficar de pé diante dele' em um confronto, registrando o teor literal em nota.
- source_word: וַיַּשְׁלִיכֵהוּ אַרְצָה
  choice: Ele o lançou por terra
  rationale: Preserva o movimento descendente e a força de השליך com formulação digna e corrente.
- source_word: וַיִּרְמְסֵהוּ
  choice: e o pisoteou
  rationale: Equivalente direto e expressivo de רמס no cenário de violência.
- source_word: וְלֹא הָיָה מַצִּיל לָאַיִל מִיָּדוֹ
  choice: e não houve quem livrasse o carneiro de seu poder
  rationale: Traduz idiomaticamente o particípio מַצִּיל e comunica o sentido de domínio presente na expressão hebraica 'de sua mão'.
