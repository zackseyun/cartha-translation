revisions:
- from: Aconteceu que, quando eu, Daniel, vi a visão e procurava compreendê-la, eis que estava de pé diante de mim alguém com aparência de homem.[a]
  to: Aconteceu que, quando eu, Daniel, vi a visão e busquei entendimento, eis que alguém estava de pé diante de mim, com a aparência de um homem.[a]
  rationale: A revisão aproxima a tradução de וָאֲבַקְשָׁה בִינָה mediante «busquei entendimento», elimina uma explicitação desnecessária do objeto e torna a ordem da oração final mais corrente. Mantém-se a descrição estritamente observacional da figura, sem lhe atribuir identidade teológica.
