source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/רְאֹתִ֛/י אֲנִ֥י דָנִיֵּ֖אל אֶת הֶ/חָז֑וֹן וָ/אֲבַקְשָׁ֣/ה בִינָ֔ה וְ/הִנֵּ֛ה עֹמֵ֥ד לְ/נֶגְדִּ֖/י כְּ/מַרְאֵה גָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/015.yaml
  text: And it happened[a], when I, Daniel, had seen the vision and was seeking understanding, behold, standing before me was one with the appearance of a man.
translation:
  language: pt
  text: Aconteceu que, quando eu, Daniel, vi a visão e busquei entendimento, eis que alguém estava de pé diante de mim, com a aparência de um homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «diante de mim estava alguém com a aparência de um homem».'
    reason: Alternativa de ordem sintática que preserva a posição da figura diante de Daniel e a força comparativa da expressão hebraica.
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Introduz o novo desenvolvimento narrativo de maneira natural em português, sem recorrer à fórmula arcaica «e sucedeu».
- source_word: בִּרְאֹתִי
  choice: quando eu ... vi
  rationale: O infinitivo construto com בְּ forma uma oração temporal. O pretérito perfeito expressa com clareza a visão que antecede a busca de compreensão.
- source_word: אֲנִי דָנִיֵּאל
  choice: eu, Daniel
  rationale: Preserva a identificação enfática produzida pelo pronome explícito seguido do nome.
- source_word: הֶחָזוֹן
  choice: a visão
  rationale: É o equivalente direto e contextualmente apropriado para a experiência visionária relatada por Daniel.
- source_word: וָאֲבַקְשָׁה בִינָה
  choice: e procurava compreendê-la
  rationale: Comunica em português corrente o esforço de alcançar entendimento, mantendo a visão como referente contextual sem sugerir que Daniel já a tivesse compreendido.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a função apresentativa e vívida da partícula hebraica em registro literário digno.
- source_word: עֹמֵד לְנֶגְדִּי
  choice: estava de pé diante de mim
  rationale: Representa o particípio de עמד e a posição frontal indicada por לְנֶגְדִּי, formando uma cena visual clara.
- source_word: כְּמַרְאֵה גָבֶר
  choice: alguém com aparência de homem
  rationale: Preserva a comparação visual marcada por כְּ sem afirmar que a figura fosse ontologicamente humana; «alguém» explicita apenas o referente implícito exigido pelo português.
- source_word: גָבֶר
  choice: homem
  rationale: Neste contexto, designa uma pessoa do sexo masculino quanto à aparência; não há base suficiente para introduzir o sentido possível de «guerreiro».
theological_decisions:
- issue: Natureza da figura descrita como כְּמַרְאֵה גָבֶר
  choice: Descrevê-la apenas como «alguém com aparência de homem».
  alternative: Identificá-la como anjo em forma humana, homem ou figura divina pré-encarnada.
  rationale: O versículo relata somente a aparência observada por Daniel. A tradução não deve resolver além do texto a identidade ou a natureza da figura.
translation_notes:
  register: Português moderno, claro e literariamente digno, com ampla legibilidade brasileira. «Eis que» conserva a vivacidade solene do hebraico; «estava de pé» evita que «estava diante de mim» perca a contribuição explícita do particípio עֹמֵד.
