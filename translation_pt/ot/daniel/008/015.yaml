    reason: Alternativa de ordem sintática que preserva a posição da figura diante de Daniel e a força comparativa da expressão hebraica.
  revision_rationale: A revisão aproxima a tradução de וָאֲבַקְשָׁה בִינָה mediante «busquei entendimento», elimina uma explicitação desnecessária do objeto e torna a ordem da oração final mais corrente. Mantém-se a descrição estritamente observacional da figura, sem lhe atribuir identidade teológica.
