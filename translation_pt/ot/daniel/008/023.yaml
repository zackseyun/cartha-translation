id: DAN.8.23
reference: Daniel 8:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּֽ/בְ/אַחֲרִית֙ מַלְכוּתָ֔/ם כְּ/הָתֵ֖ם הַ/פֹּשְׁעִ֑ים יַעֲמֹ֛ד מֶ֥לֶךְ עַז פָּנִ֖ים וּ/מֵבִ֥ין חִידֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/023.yaml
  text: And at the latter end of their kingdom[a], when the transgressors have reached their full measure, a king will arise, fierce in countenance and skilled in intrigue.
translation:
  language: pt
  text: E no fim do reinado deles, quando os transgressores tiverem chegado à medida plena, surgirá um rei de semblante feroz e entendido em enigmas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “hábil em intrigas”; também pode ser entendido como “entendido em ditos obscuros”.'
    reason: Alternativas lexicais e contextuais para וּמֵבִין חִידוֹת.
lexical_decisions:
- source_word: וּבְאַחֲרִית
  choice: E no fim de
  rationale: אַחֲרִית indica a parte final ou o fim de um período; a formulação é natural em português e conserva o valor temporal e a conjunção prefixada.
- source_word: מַלְכוּתָם
  choice: o reinado deles
  rationale: O substantivo está no singular com sufixo masculino plural. Neste contexto, “reinado” expressa naturalmente a fase de domínio associada coletivamente aos governantes anteriores, sem converter o singular hebraico em “reinos”.
- source_word: כְּהָתֵם הַפֹּשְׁעִים
  choice: quando os transgressores tiverem chegado à medida plena
  rationale: תמם comunica conclusão ou plenitude; com “os transgressores”, a expressão indica que a transgressão chega à sua plena medida, não necessariamente que as pessoas deixam de existir.
- source_word: יַעֲמֹד
  choice: surgirá
  rationale: Em contexto régio e político, עמד pode indicar que alguém se levanta, aparece ou entra em cena; “surgirá” é idiomático e preciso.
- source_word: עַז פָּנִים
  choice: de semblante feroz
  rationale: A expressão literalmente ligada à força ou dureza do rosto descreve audácia, severidade ou ferocidade; “semblante feroz” conserva a imagem facial em português corrente e digno.
- source_word: וּמֵבִין חִידוֹת
  choice: e entendido em enigmas
  rationale: A tradução mantém diretamente os elementos de compreender/ser entendido e enigmas ou ditos obscuros, evitando decidir no texto principal que se trata especificamente de intriga política.
theological_decisions:
- issue: Sentido de וּמֵבִין חִידוֹת
  choice: entendido em enigmas
  alternative: hábil em intrigas; entendido em ditos obscuros
  rationale: O hebraico admite a ideia literal de compreender enigmas e, contextualmente, pode sugerir sagacidade ou habilidade em tramas. O texto principal preserva a imagem e a ambiguidade; a nota registra as extensões contextuais possíveis.
- issue: Referente da plenitude em כְּהָתֵם הַפֹּשְׁעִים
  choice: os transgressores tiverem chegado à medida plena
  alternative: as transgressões tiverem chegado ao cúmulo; os transgressores tiverem completado sua ação
  rationale: A formulação conserva o sujeito expresso “os transgressores”, mas comunica o aspecto de plenitude de תמם sem afirmar de maneira indevida que eles foram exterminados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Reinado” evita a estranheza de “o reino deles” no contexto temporal; “semblante feroz” preserva o idioma facial hebraico sem arcaísmo excessivo.
