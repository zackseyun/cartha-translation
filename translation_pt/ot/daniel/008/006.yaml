  text: וַ/יָּבֹ֗א עַד הָ/אַ֨יִל֙ בַּ֣עַל הַ/קְּרָנַ֔יִם אֲשֶׁ֣ר רָאִ֔יתִי עֹמֵ֖ד לִ/פְנֵ֣י הָ/אֻבָ֑ל וַ/יָּ֥רָץ אֵלָ֖י/ו בַּ/חֲמַ֥ת כֹּחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/006.yaml
  text: He came up to the ram with the two horns[a], which I had seen standing before the canal[b], and ran at him in the fury of his power.
translation:
  language: pt
  text: Ele chegou até o carneiro de dois chifres, que eu tinha visto em pé diante do canal[a], e correu contra ele no furor de sua força.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “curso de água”. O hebraico אוּבָל designa um curso de água; “canal” foi adotado por se ajustar bem ao cenário de Daniel 8.
    reason: lexical_alternative
  - marker: b
    text: Ou “investiu contra ele com a fúria de sua força”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עַד
  choice: chegou até
  rationale: A combinação de בוא com עַד indica movimento até o ponto em que se encontrava o carneiro; “chegou até” preserva tanto o deslocamento quanto a chegada.
- source_word: הָאַיִל
  choice: o carneiro
  rationale: אַיִל designa aqui o carneiro da visão de Daniel.
- source_word: בַּעַל הַקְּרָנַיִם
  choice: de dois chifres
  rationale: Embora בַּעַל signifique literalmente “possuidor de”, a construção atributiva “de dois chifres” é natural em português e preserva o dual קְּרָנַיִם.
- source_word: אֲשֶׁר רָאִיתִי עֹמֵד
  choice: que eu tinha visto parado
  rationale: O mais-que-perfeito composto explicita que Daniel já havia visto o carneiro antes desta ação; “parado” expressa naturalmente a posição indicada pelo particípio עֹמֵד.
- source_word: לִפְנֵי הָאֻבָל
  choice: diante do canal
  rationale: אוּבָל denota um curso de água e, no cenário de Daniel 8, “canal” é uma escolha contextual plausível; “diante de” mantém a relação espacial de לִפְנֵי.
- source_word: וַיָּרָץ אֵלָיו
  choice: e correu contra ele
  rationale: רוץ significa “correr”; o contexto hostil favorece “contra ele”, que comunica investida sem substituir o verbo por uma paráfrase.
- source_word: בַּחֲמַת כֹּחוֹ
  choice: no furor de sua força
  rationale: 'A formulação conserva os dois substantivos hebraicos: חֵמָה/חֲמָה, “furor”, e כֹּחַ, “força”, mantendo a intensidade e a construção compacta do original.'
