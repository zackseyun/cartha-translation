base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/016.yaml
  text: And I heard the voice of a man between the banks of the Ulai[a], and he called out and said, “Gabriel[c][b], make this one understand the vision.”
translation:
  language: pt
  text: 'E ouvi a voz de um homem entre as margens do Ulai[a], e ele gritou e disse: “Gabriel, faça este homem entender a visão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no meio do Ulai” ou “entre os lados do Ulai”. A expressão provavelmente se refere ao espaço entre suas margens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: E ouvi
  rationale: Preserva a sequência narrativa do wayyiqtol sem impor uma nuance temporal mais específica.
- source_word: קוֹל אָדָם
  choice: a voz de um homem
  rationale: Expressa de modo direto o sentido concreto de קוֹל אָדָם e mantém a referência masculina singular do contexto.
- source_word: בֵּין אוּלָי
  choice: entre as margens do Ulai
  rationale: Torna natural em português a expressão hebraica com בֵּין, entendendo-a como o espaço entre as duas margens do curso de água, sem ocultar a formulação mais literal, registrada em nota.
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: que chamou e disse
  rationale: Conserva os dois verbos hebraicos em uma construção portuguesa fluente; o sujeito é a voz masculina anteriormente ouvida.
- source_word: גַּבְרִיאֵל
  choice: Gabriel
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: הָבֵן
  choice: faça ... entender
  rationale: Preserva a força causativa do imperativo hifil de בין.
- source_word: לְהַלָּז
  choice: este homem
  rationale: O demonstrativo refere-se a Daniel, um indivíduo masculino presente na cena; a formulação é clara e idiomática em português.
- source_word: אֶת הַמַּרְאֶה
  choice: a visão
  rationale: No contexto revelatório de Daniel, מַרְאֶה designa naturalmente a visão que deve ser compreendida.
theological_decisions:
- issue: Sentido de אָדָם em קוֹל אָדָם
  choice: a voz de um homem
  alternative: uma voz humana
  rationale: O contexto favorece uma referência concreta, mas a alternativa lexical legítima é preservada em nota.
- issue: Referência de לְהַלָּז
  choice: este homem
  alternative: este aqui / este
  rationale: A expressão aponta para Daniel; explicitar “homem” produz português natural e não acrescenta uma identidade além daquela indicada pela cena.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. Evitou-se sobrecarregar o versículo com notas que apenas repetiriam a tradução principal. O marcador [a] aparece no texto imediatamente após “Ulai”.
