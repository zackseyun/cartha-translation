source:
  edition: WLC
  text: וָ/אֶשְׁמְעָ֥/ה אֶֽחָד קָד֖וֹשׁ מְדַבֵּ֑ר וַ/יֹּאמֶר֩ אֶחָ֨ד קָד֜וֹשׁ לַ/פַּֽלְמוֹנִ֣י הַֽ/מְדַבֵּ֗ר עַד מָתַ֞י הֶ/חָז֤וֹן הַ/תָּמִיד֙ וְ/הַ/פֶּ֣שַׁע שֹׁמֵ֔ם תֵּ֛ת וְ/קֹ֥דֶשׁ וְ/צָבָ֖א מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/013.yaml
  text: Then I heard a holy one speaking[a], and one holy one said to the one speaking, “How long is the vision concerning the regular burnt offering and the desolating transgression[d][c][b], and the giving over of both the sanctuary and the host to be trampled?”
translation:
  language: pt
  text: 'Então ouvi um santo falando, e outro santo perguntou àquele que falava[d]: “Até quando durará a visão sobre a oferta regular[a], a transgressão devastadora[b] e a entrega do santuário e do exército[c] para serem pisoteados?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “sacrifício diário”. O hebraico se refere à oferta regular e contínua do serviço do templo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a transgressão que causa desolação”.'
    reason: lexical_alternative
  - marker: c
    text: “Exército” também pode ser traduzido por “hoste”. Pode se referir ao povo ligado ao santuário, a um exército ou a outra força coletiva; o hebraico não especifica plenamente.
    reason: lexical_alternative
  - marker: d
    text: A expressão hebraica traduzida por “àquele que falava” é obscura. Também pode ser entendida como “a um certo indivíduo” ou como o nome ou título “Palmoni”.
    reason: alternative_reading
lexical_decisions:
- source_word: קָדוֹשׁ
  choice: santo
  rationale: O adjetivo substantivado designa, no contexto da visão, um ser celestial. “Santo” conserva a forma lexical sem especificar além do hebraico que se trata de um anjo.
- source_word: לַפַּלְמוֹנִי
  choice: àquele
  rationale: A forma é obscura e pode indicar um interlocutor particular não identificado. “Àquele que falava” produz português natural sem transformá-la no nome próprio Palmoni; essa possibilidade é registrada em nota.
- source_word: הַתָּמִיד
  choice: oferta regular
  rationale: O termo designa a oferta contínua do culto no templo. “Oferta regular” é precisa e evita restringir indevidamente o termo a “sacrifício diário” ou acrescentar “holocausto” ao que está elíptico no hebraico.
- source_word: הַפֶּשַׁע שֹׁמֵם
  choice: transgressão devastadora
  rationale: Conserva de modo compacto tanto a ideia de rebelião/transgressão quanto seu efeito desolador, sem impor uma fórmula técnica posterior.
- source_word: תֵּת
  choice: entrega
  rationale: O infinitivo expressa o ato de entregar ou sujeitar o santuário e o exército ao pisoteio. A nominalização é natural no encadeamento da pergunta.
- source_word: קֹדֶשׁ
  choice: santuário
  rationale: No contexto cultual da visão, o substantivo se refere concretamente ao lugar santo, não à santidade em sentido abstrato.
- source_word: צָבָא
  choice: exército
  rationale: O termo significa hoste ou exército. “Exército” é corrente em português, mas seu referente específico permanece aberto e é esclarecido em nota.
- source_word: מִרְמָס
  choice: para serem pisoteados
  rationale: Expressa naturalmente o substantivo hebraico de resultado/finalidade e mantém a ideia de profanação por se pisar sobre algo.
theological_decisions:
- issue: Identidade dos santos
  choice: seres celestiais, sem explicitar “anjos” no texto
  alternative: santos humanos
  rationale: O cenário visionário favorece seres celestiais, mas “santo” preserva a designação lexical e evita uma identificação mais específica do que o texto oferece.
- issue: Referente de צָבָא
  choice: mantido lexicalmente como “exército”, com o referente deixado em aberto por nota
  alternative: o povo de Deus; a hoste celestial; uma força militar
  rationale: O contexto não determina de modo inequívoco qual coletividade está em vista. A nota preserva essa tensão interpretativa.
- issue: Relação sintática entre visão, oferta, transgressão e entrega
  choice: três elementos coordenados como conteúdo da visão
  alternative: ler “oferta regular e transgressão devastadora” como uma única expressão ou subordinar de outra forma a entrega
  rationale: A coordenação com וְ antes de “a transgressão” e antes de “santuário” sustenta a enumeração, embora a sintaxe hebraica seja compacta; a tradução não identifica a oferta com a transgressão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais. “Santo” mantém a sobriedade do hebraico; “oferta regular” evita uma expansão interpretativa no texto principal. A pergunta foi formulada com “durará” para tornar idiomático “até quando” em português, sem alterar a referência à duração dos acontecimentos vistos.
