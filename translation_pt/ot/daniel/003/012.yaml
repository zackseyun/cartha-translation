source:
  edition: WLC
  text: אִיתַ֞י גֻּבְרִ֣ין יְהוּדָאיִ֗ן דִּֽי מַנִּ֤יתָ יָתְ/הוֹן֙ עַל עֲבִידַת֙ מְדִינַ֣ת בָּבֶ֔ל שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ גֻּבְרַיָּ֣/א אִלֵּ֗ךְ לָא שָׂ֨מֽוּ עלי/ך מַלְכָּ/א֙ טְעֵ֔ם ל/אלהי/ך לָ֣א פָלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א סָגְדִֽין־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/012.yaml
  text: 'There are certain Jewish men whom you have appointed over the administration of the province of Babylon—Shadrach[a], Meshach, and Abed-nego. These men have paid no attention to you, O king: they do not serve your gods[b], and they do not worship the golden image that you have set up.'
translation:
  language: pt
  text: 'Há alguns homens judeus que nomeaste para cuidar da administração da província da Babilônia — Sadraque, Mesaque e Abede-Nego. Esses homens não fizeram caso de ti, ó rei[a]: não servem aos teus deuses[b] nem adoram a imagem de ouro que ergueste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não demonstraram consideração por ti” ou “não te deram ouvidos”. A expressão aramaica diz literalmente que eles não “puseram” consideração ou atenção sobre ti.'
    reason: lexical_alternative
  - marker: b
    text: 'O aramaico emprega verbos diferentes: eles não “servem” aos deuses do rei e não “adoram” a imagem de ouro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי גֻּבְרִין יְהוּדָאיִן
  choice: Há alguns homens judeus
  rationale: A partícula existencial é vertida naturalmente por “Há”. “Alguns” comunica a força idiomática e acusatória da apresentação, enquanto “homens judeus” preserva tanto o substantivo masculino explícito quanto a identificação étnica.
- source_word: דִּי מַנִּיתָ יָתְהוֹן עַל עֲבִידַת מְדִינַת בָּבֶל
  choice: que nomeaste para administrar a província da Babilônia
  rationale: מַנִּיתָ indica nomeação para uma função, e עֲבִידַת, neste contexto governamental, refere-se ao trabalho ou à administração da província. A formulação evita a rigidez de “sobre o serviço”.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Sadraque, Mesaque e Abede-Nego
  rationale: Empregam-se as formas portuguesas reconhecíveis dos nomes aramaicos, com hífen em Abede-Nego para tornar clara a composição tradicional do nome.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: Esses homens
  rationale: A expressão demonstrativa retoma enfaticamente os três homens mencionados.
- source_word: לָא שָׂמוּ עֲלַיִךְ ... טְעֵם
  choice: não fizeram caso de ti
  rationale: A expressão aramaica diz literalmente que eles não “puseram” sobre o rei consideração, atenção ou acatamento. “Não fizeram caso de ti” é natural e mantém a afronta pessoal sem especificar indevidamente que o objeto era apenas uma ordem.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: A forma funciona como vocativo; “ó rei” conserva o tratamento direto e solene.
- source_word: לֵאלָהַיִךְ לָא פָלְחִין
  choice: não servem aos teus deuses
  rationale: פְלַח denota serviço prestado a uma divindade. “Servem” preserva a distinção lexical em relação ao verbo de adoração usado depois.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: nem adoram a imagem de ouro
  rationale: צֶלֶם designa uma imagem ou estátua, e a construção seguinte indica ouro. “Imagem de ouro” é clara e não decide se a imagem era de ouro maciço ou revestida.
- source_word: דִּי הֲקֵימְתָּ
  choice: que ergueste
  rationale: O verbo causativo significa levantar, instalar ou erigir. “Ergueste” é conciso, natural e adequado a uma imagem monumental.
- source_word: לָא סָגְדִין
  choice: nem adoram
  rationale: סְגַד descreve prostrar-se ou prestar homenagem cultual. “Adoram” comunica o sentido religioso no contexto, enquanto a nota preserva a distinção do verbo anterior.
theological_decisions:
- issue: Distinção entre os dois verbos de ação religiosa
  choice: Traduzir פָלְחִין por “servem” e סָגְדִין por “adoram”
  alternative: Traduzir ambos por “adoram”
  rationale: 'O aramaico emprega deliberadamente verbos diferentes: um para o serviço cultual prestado aos deuses e outro para a prostração ou adoração diante da imagem. Preservar essa distinção evita nivelar a acusação.'
- issue: Objeto da desconsideração dos três homens
  choice: “não fizeram caso de ti”
  alternative: “não obedeceram à tua ordem”
  rationale: A expressão dirige a desconsideração ao próprio rei e permite mais de uma nuance para טְעֵם. A tradução escolhida não introduz uma referência explícita a uma ordem que a construção não declara sem ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas naturais para leitores brasileiros sem regionalismos marcados. A segunda pessoa do singular (“nomeaste”, “ti”, “teus”, “ergueste”) mantém a fala direta e solene ao rei. Os marcadores [a] e [b] aparecem no texto nos pontos exatos a que as notas se referem.
