base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/023.yaml
  text: And these three men—Shadrach[a], Meshach[b], and Abed-nego—fell bound into the midst of the blazing furnace.
translation:
  language: pt
  text: E estes três homens — Sadraque, Mesaque e Abede-Nego — caíram amarrados no meio da fornalha de fogo ardente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais interpretativa, “foram lançados, amarrados, no meio da fornalha de fogo ardente”. O verbo aramaico significa simplesmente “caíram”, embora o contexto explique que eles haviam sido lançados ali.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֻבְרַיָּא אִלֵּךְ תְּלָתֵּהוֹן
  choice: estes três homens
  rationale: Reproduz de modo natural o demonstrativo, o numeral com sufixo e o substantivo aramaico que designa os três indivíduos do sexo masculino.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Sadraque, Mesaque e Abede-Nego
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis dos nomes próprios.
- source_word: נְפַלוּ
  choice: caíram
  rationale: Preserva o sentido simples do verbo aramaico, sem inserir no texto principal o agente ou a ação de lançar, embora o contexto anterior explique a queda.
- source_word: לְגוֹא
  choice: no meio de
  rationale: Conserva a ideia espacial de interior ou centro, com formulação idiomática em português.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: fornalha de fogo ardente
  rationale: Representa todos os elementos da expressão aramaica — fornalha, fogo e ardente — em linguagem portuguesa clara e digna.
- source_word: מְכַפְּתִין
  choice: amarrados
  rationale: Expressa naturalmente o particípio passivo 'atados/presos', sem acrescentar a ideia não explícita de estarem amarrados de mãos e pés.
