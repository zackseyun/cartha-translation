base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/020.yaml
  text: And he commanded certain mighty men of valor who were in his army to bind Shadrach[a], Meshach, and Abednego, to throw them into the blazing furnace of fire.
translation:
  language: pt
  text: E ordenou a alguns guerreiros valentes do seu exército que amarrassem Sadraque, Mesaque e Abede-Nego e os lançassem na fornalha de fogo ardente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְגֻבְרִין גִּבָּרֵי חַיִל
  choice: a alguns guerreiros valentes
  rationale: A expressão designa homens fortes e capazes em contexto militar. “Guerreiros valentes” preserva tanto a força quanto o caráter marcial, enquanto “alguns” comunica naturalmente a referência indefinida.
- source_word: דִּי בְחַיְלֵהּ
  choice: do seu exército
  rationale: חַיִל indica aqui a força militar do rei, não força abstrata. A formulação portuguesa identifica os guerreiros como integrantes do exército.
- source_word: אֲמַר
  choice: ordenou
  rationale: Embora o verbo possa significar “disse”, os infinitivos seguintes exprimem uma ordem; “ordenou” reproduz adequadamente a força do ato de fala.
- source_word: לְכַפָּתָה
  choice: que amarrassem
  rationale: O verbo significa atar ou prender. A oração finita é idiomática em português depois de “ordenou” e conserva o sentido da construção infinitiva aramaica.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Sadraque, Mesaque e Abede-Nego
  rationale: Os nomes seguem formas tradicionais e amplamente reconhecíveis em português.
- source_word: לְמִרְמֵא
  choice: os lançassem
  rationale: O verbo significa lançar ou atirar. “Lançassem” mantém o registro narrativo digno; o pronome explicita naturalmente em português o objeto já mencionado.
- source_word: לְאַתּוּן נוּרָא יָקִדְתָּא
  choice: na fornalha de fogo ardente
  rationale: 'A tradução preserva os três componentes da expressão aramaica: fornalha, fogo e a qualidade de estar ardendo, sem produzir uma combinação artificial em português.'
