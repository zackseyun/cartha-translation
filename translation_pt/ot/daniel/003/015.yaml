source:
  edition: WLC
  text: כְּעַ֞ן הֵ֧ן אִֽיתֵי/כ֣וֹן עֲתִידִ֗ין דִּ֣י בְ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַשְׁרוֹקִיתָ֣/א קיתרס שַׂבְּכָ֡א פְּסַנְתֵּרִין֩ וְ/סוּמְפֹּ֨נְיָ֜ה וְ/כֹ֣ל זְנֵ֣י זְמָרָ֗/א תִּפְּל֣וּן וְ/תִסְגְּדוּן֮ לְ/צַלְמָ֣/א דִֽי עַבְדֵת֒ וְ/הֵן֙ לָ֣א תִסְגְּד֔וּן בַּ/הּ שַׁעֲתָ֣/ה תִתְרְמ֔וֹן לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּ֑/א וּ/מַן ה֣וּא אֱלָ֔הּ דֵּ֥י יְשֵֽׁיזְבִנְ/כ֖וֹן מִן יְדָֽ/י־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/015.yaml
  text: Now if you are ready[a], when you hear the sound of the horn, pipe, lyre, trigon, harp, and bagpipe, and every kind of music, to fall down and worship the image that I have made, well and good. But if you do not worship, in that very hour you will be thrown into the midst of a blazing furnace of fire[d][c][b]. And who is the god who will deliver you out of my hands?
translation:
  language: pt
  text: Agora, se vocês estão prontos para, quando ouvirem o som da trompa, da flauta, da lira, da harpa triangular[a], do saltério[b], da gaita de foles[c] e de todo tipo de música, se prostrarem e adorarem a estátua que fiz — muito bem[d]. Mas, se não a adorarem, naquela mesma hora serão lançados no meio da fornalha de fogo ardente. E quem é o deus que poderá livrá-los das minhas mãos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de שַׂבְּכָא é incerta; “trígono” é uma alternativa tradicional, talvez designando um instrumento triangular de cordas.
    reason: lexical_alternative
  - marker: b
    text: O saltério (פְּסַנְתֵּרִין) era um instrumento de cordas; sua forma exata é incerta.
    reason: lexical_alternative
  - marker: c
    text: A identificação de סוּמְפֹּנְיָה é discutida; talvez fosse uma flauta dupla. O termo se relaciona etimologicamente a “sinfonia”, mas aqui não indica uma orquestra moderna.
    reason: lexical_alternative
  - marker: d
    text: 'O aramaico interrompe a construção depois de “que fiz”; “muito bem” completa em português o sentido implícito: se obedecerem, não haverá punição.'
    reason: textual_ellipsis
lexical_decisions:
- source_word: כְּעַן
  choice: Agora
  rationale: Introduz o desafio renovado do rei com força discursiva imediata e natural em português.
- source_word: אִיתֵיכון עֲתִידִין
  choice: vocês estão prontos
  rationale: Expressa de modo claro e idiomático a prontidão para agir imediatamente.
- source_word: קַרְנָא
  choice: trompa
  rationale: Designação ampla de um instrumento de sopro feito ou associado a um chifre, sem especificar indevidamente sua forma.
- source_word: מַשְׁרוֹקִיתָא
  choice: flauta
  rationale: Termo corrente e compreensível para o instrumento de sopro indicado, embora sua forma exata não seja conhecida.
- source_word: קיתרס
  choice: lira
  rationale: Equivalente português tradicional e acessível para o instrumento de cordas designado pelo empréstimo aramaico.
- source_word: שַׂבְּכָא
  choice: harpa triangular
  rationale: Comunica ao leitor a identificação provável do instrumento sem recorrer ao pouco conhecido tecnicismo 'trígono'; a incerteza é registrada em nota.
- source_word: פְּסַנְתֵּרִין
  choice: saltério
  rationale: Preserva a distinção entre os vários instrumentos de cordas da lista e corresponde ao termo tradicional português.
- source_word: סוּמְפֹּנְיָה
  choice: gaita de foles
  rationale: É uma identificação moderna comum, mas discutida; a alternativa é preservada em nota.
- source_word: כֹל זְנֵי זְמָרָא
  choice: todo tipo de música
  rationale: Reproduz a abrangência da expressão aramaica em português natural.
- source_word: שַׁעֲתָה
  choice: naquela mesma hora
  rationale: Mantém a ameaça de execução imediata presente no contexto.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: fornalha de fogo ardente
  rationale: Preserva a formulação enfática do aramaico, embora em português haja alguma redundância intencional.
theological_decisions:
- issue: Sentido de סגד diante da estátua
  choice: adorar
  alternative: prestar homenagem
  rationale: O contexto apresenta um ato religioso dirigido à estátua; 'prostrem-se' preserva separadamente a postura corporal.
- issue: Sentido de אֱלָהּ na provocação de Nabucodonosor
  choice: deus, com inicial minúscula
  alternative: Deus
  rationale: O rei formula um desafio genérico e arrogante, sem confessar nem identificar explicitamente o Deus de Israel.
- issue: Modalidade de יְשֵׁיזְבִנְכוֹן
  choice: poderá livrá-los
  alternative: livrará vocês
  rationale: A pergunta desafia a capacidade de qualquer deus para resgatá-los; 'poderá' explicita em português essa força pragmática sem identificar antecipadamente o Deus de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A enumeração conserva a variedade dos instrumentos e notas breves registram as identificações incertas. A elipse aramaica é mantida perceptível por travessão e completada de modo mínimo.
