  text: עָנֵ֤ה נְבֻֽכַדְנֶצַּר֙ וְ/אָמַ֣ר לְ/ה֔וֹן הַ/צְדָּ֕א שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לֵֽ/אלָהַ֗/י לָ֤א אִֽיתֵי/כוֹן֙ פָּֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימֶת לָ֥א סָֽגְדִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/014.yaml
  text: Nebuchadnezzar answered and said to them[a], “Is it true, Shadrach, Meshach, and Abed-nego, that you do not serve my god and do not bow down to the golden image that I have set up?”
translation:
  language: pt
  text: 'Nabucodonosor lhes respondeu: “É verdade, Sadraque, Mesaque e Abede-Nego, que vocês não servem ao meu deus nem se prostram diante da estátua de ouro que eu ergui?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: perguntou
  rationale: A expressão aramaica é uma fórmula narrativa que introduz uma fala em resposta à situação anterior. Em português atual, “perguntou” comunica naturalmente a função da fala neste contexto interrogativo, sem reproduzir o pouco idiomático “respondeu e disse”.
- source_word: לְהוֹן
  choice: lhes
  rationale: Pronome de terceira pessoa do plural que retoma coletivamente os três judeus.
- source_word: הַצְדָּא
  choice: É verdade
  rationale: A expressão pode indicar verdade ou realidade, mas também intencionalidade. Após a acusação recebida pelo rei, “É verdade” se encaixa bem no fluxo imediato; a nuance de ação deliberada é preservada em nota.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Sadraque, Mesaque e Abede-Nego
  rationale: Empregam-se as formas tradicionalmente consagradas e reconhecíveis em português.
- source_word: לֵאלָהַי
  choice: ao meu deus
  rationale: A forma é singular com sufixo de primeira pessoa do singular, e o contexto sintático favorece “meu deus”, não “meus deuses”.
- source_word: פָּלְחִין
  choice: servem
  rationale: O verbo denota serviço, aqui de caráter cultual. “Servem” mantém a distinção lexical em relação ao verbo seguinte, que descreve prostração.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: diante da estátua de ouro
  rationale: Neste contexto, צלם designa uma representação tridimensional erguida pelo rei. “Estátua de ouro” é claro e natural em português, e “diante de” combina idiomaticamente com “prostrar-se”.
- source_word: דִּי הֲקֵימֶת
  choice: que eu ergui
  rationale: A oração relativa remete ao ato anterior do rei de levantar ou instalar a estátua. O pretérito perfeito exprime com naturalidade essa ação concluída.
- source_word: סָגְדִין
  choice: se prostram
  rationale: O verbo descreve especificamente curvar-se ou prostrar-se em homenagem. “Se prostram” conserva o gesto físico e o distingue de “servem”.
theological_decisions:
- issue: Manter distintos os dois verbos referentes à ação idólatra
  choice: “servem” e “se prostram”
  alternative: Traduzir um ou ambos por “adoram”
  rationale: O aramaico emprega verbos diferentes para serviço cultual e prostração. Preservar ambos mantém a força retórica e evita reduzir duas ações distintas a uma única categoria interpretativa.
- issue: Sentido de הַצְדָּא
  choice: “É verdade” no texto principal
  alternative: “É de propósito?” ou “É deliberadamente?”
  rationale: O termo admite tanto uma leitura factual quanto uma referência à intenção desafiadora. O contexto imediato favorece a confirmação da acusação, enquanto a alternativa legítima é registrada em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas correntes no Brasil. Evitou-se o formalismo pouco natural “respondeu e disse”, sem perder a função responsiva da fala. Os verbos “servir” e “prostrar-se” foram mantidos distintos.
