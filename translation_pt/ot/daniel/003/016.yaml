  text: עֲנ֗וֹ שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ וְ/אָמְרִ֖ין לְ/מַלְכָּ֑/א נְבֽוּכַדְנֶצַּ֔ר לָֽא חַשְׁחִ֨ין אֲנַ֧חְנָה עַל דְּנָ֛ה פִּתְגָ֖ם לַ/הֲתָבוּתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/016.yaml
  text: Shadrach, Meshach, and Abed-nego answered and said to the king, Nebuchadnezzar, “We have no need to give you an answer concerning this matter.”
translation:
  language: pt
  text: 'Sadraque, Mesaque e Abede-Nego responderam ao rei Nabucodonosor: “Não precisamos dar uma resposta ao senhor sobre este assunto.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנוֹ ... וְאָמְרִין
  choice: responderam
  rationale: A construção aramaica literalmente combina “responder” e “dizer”; em português atual, “responderam” comunica naturalmente a fórmula sem redundância artificial.
- source_word: לְמַלְכָּא נְבוּכַדְנֶצַּר
  choice: ao rei Nabucodonosor
  rationale: Mantém tanto o título quanto o nome em uma ordem natural em português.
- source_word: לָא חַשְׁחִין אֲנַחְנָה
  choice: Não precisamos
  rationale: Expressa a ideia de não haver necessidade ou obrigação, de acordo com o uso aramaico do termo.
- source_word: לַהֲתָבוּתָךְ פִּתְגָם
  choice: dar uma resposta ao senhor
  rationale: Preserva o sentido de “devolver/dar uma palavra ou resposta” e explicita com respeito o destinatário indicado pelo sufixo de segunda pessoa.
- source_word: עַל דְּנָה
  choice: sobre este assunto
  rationale: A expressão aponta para a questão em debate, não apenas para um objeto ou evento isolado.
theological_decisions:
- issue: Natureza da recusa dos três homens
  choice: Não precisamos dar uma resposta
  alternative: Não temos necessidade de nos defender
  rationale: A tradução mantém a formulação ampla do aramaico e não decide se eles recusam uma defesa jurídica, uma explicação ou simplesmente uma resposta adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas tradicionais e reconhecíveis dos nomes próprios. “Ao senhor” evita o ambíguo “a você” e representa respeitosamente o sufixo dirigido ao rei, sem introduzir tratamento excessivamente solene.
