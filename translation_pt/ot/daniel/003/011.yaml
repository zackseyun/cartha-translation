  text: וּ/מַן דִּי לָ֥א יִפֵּ֖ל וְ/יִסְגֻּ֑ד יִתְרְמֵ֕א לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/011.yaml
  text: And whoever does not fall down and worship shall be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: pt
  text: E quem não se prostrar e adorar será lançado no meio de uma fornalha de fogo ardente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “será lançado para dentro de uma fornalha de fogo que arde”.'
    reason: Alternativa lexical que explicita mais literalmente a referência ao interior e a construção aramaica que caracteriza o fogo como ardente.
lexical_decisions:
- source_word: וּמַן דִּי
  choice: E quem
  rationale: A combinação aramaica introduz uma condição geral, “quem”, e a conjunção inicial mantém a continuidade do decreto.
- source_word: לָא יִפֵּל
  choice: não se prostrar
  rationale: No contexto de homenagem obrigatória diante da imagem, o verbo indica cair em prostração, não uma queda acidental.
- source_word: וְיִסְגֻּד
  choice: e adorar
  rationale: O verbo expressa reverência ou homenagem mediante prostração; “adorar” comunica a dimensão cultual e político-religiosa sem repetir o gesto físico.
- source_word: יִתְרְמֵא
  choice: será lançado
  rationale: A forma passiva no decreto apresenta a penalidade prescrita; o futuro mantém sua força normativa em português natural.
- source_word: לְגוֹא
  choice: no meio de
  rationale: Preserva a referência enfática ao interior da fornalha, em vez de indicar apenas movimento em sua direção.
- source_word: אַתּוּן
  choice: uma fornalha
  rationale: O substantivo designa uma fornalha ou forno; “fornalha” é claro e adequado ao contexto da execução.
- source_word: נוּרָא יָקִדְתָּא
  choice: de fogo ardente
  rationale: A expressão caracteriza o fogo como aceso e intensamente abrasador; a formulação é idiomática, digna e mantém o elemento modificador ligado a “fogo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Prostrar-se e adorar” distingue o gesto corporal de seu sentido de reverência, enquanto “fornalha de fogo ardente” conserva a ordem e a intensidade da expressão aramaica.
