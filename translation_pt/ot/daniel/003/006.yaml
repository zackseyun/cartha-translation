  text: And whoever does not fall down and worship shall in that hour be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: pt
  text: E quem não se prostrar e adorar será, naquela hora[a], lançado no meio de uma fornalha de fogo ardente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aramaico: “naquela hora”; expressão idiomática que pode significar “imediatamente” ou “sem demora”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  choice: E quem
  rationale: A expressão relativa indefinida aramaica introduz uma condição geral; “quem” preserva sua força universal com naturalidade em português.
- source_word: לָא יִפֵּל
  choice: não se prostrar
  rationale: Embora o verbo signifique literalmente “cair”, neste contexto descreve o ato corporal de curvar-se diante da imagem; “prostrar-se” comunica esse sentido com clareza.
- source_word: וְיִסְגֻּד
  choice: e adorar
  rationale: O verbo denota prostração ou homenagem reverente; diante de uma imagem cultual, “adorar” expressa adequadamente a dimensão religiosa do ato.
- source_word: בַּהּ שַׁעֲתָא
  choice: naquela mesma hora
  rationale: A tradução mantém de perto a expressão temporal aramaica e sua ênfase, sem substituir no texto a imagem literal pelo valor idiomático “imediatamente”.
- source_word: יִתְרְמֵא
  choice: será ... lançado
  rationale: A forma passiva indica que o infrator sofrerá a ação; “será lançado” é corrente, digno e fiel.
- source_word: לְגוֹא
  choice: no meio de
  rationale: A expressão indica o interior ou centro da fornalha; “no meio de” preserva essa vividez.
- source_word: אַתּוּן
  choice: uma fornalha
  rationale: O substantivo designa um grande forno ou fornalha; “fornalha” é a designação mais clara e estabelecida neste contexto narrativo.
- source_word: נוּרָא יָקִדְתָּא
  choice: de fogo ardente
  rationale: A expressão aramaica, literalmente “fogo que arde”, intensifica a cena; “fogo ardente” preserva a ênfase de modo natural.
