base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/007.yaml
  text: Therefore[a], at that time, when all the peoples heard the sound of the horn, pipe, lyre, trigon, psaltery, and every kind of music, all the peoples, nations, and languages fell down and worshiped the golden image that King Nebuchadnezzar had set up.
translation:
  language: pt
  text: Por isso, naquele momento, quando todos os povos ouviram o som da trompa, da flauta, da lira, do trígono, do saltério[a] e de todo tipo de música, todos os povos, nações e línguas caíram por terra e adoraram a imagem de ouro que o rei Nabucodonosor havia erguido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de vários desses instrumentos é incerta. O “trígono” talvez fosse uma harpa triangular, e o “saltério”, uma espécie de cítara ou harpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Por isso
  rationale: Expressa de modo natural a relação de consequência introduzida pela locução aramaica.
- source_word: בֵּהּ זִמְנָא
  choice: naquele momento
  rationale: Marca a ocasião em que a ordem foi cumprida, sem acrescentar uma precisão temporal ausente do texto.
- source_word: כְּדִי שָׁמְעִין
  choice: quando ... ouviram
  rationale: Conserva o valor temporal da construção sem tornar explícita uma ideia de imediatismo apenas implícita no contexto.
- source_word: כָּל עַמְמַיָּא
  choice: todos os povos
  rationale: O plural representa grupos étnicos e preserva a repetição enfática do original.
- source_word: קָל
  choice: o som
  rationale: No contexto, refere-se ao som audível dos instrumentos, não a uma voz falada.
- source_word: קַרְנָא
  choice: trompa
  rationale: Designação ampla e reconhecível para um instrumento de sopro feito ou concebido como chifre, sem especificá-lo indevidamente.
- source_word: מַשְׁרוֹקִיתָא
  choice: flauta
  rationale: Equivalente corrente para o instrumento de sopro mencionado, cuja identificação exata não é segura.
- source_word: קיתרס
  choice: lira
  rationale: Equivalente acessível para o instrumento de cordas relacionado ao grego kithara.
- source_word: שַׂבְּכָא
  choice: trígono
  rationale: Mantém um nome específico tradicional sem identificar com falsa certeza o instrumento antigo; a incerteza é indicada em nota.
- source_word: פְּסַנְטֵרִין
  choice: saltério
  rationale: Equivalente português tradicional para esse provável instrumento de cordas; sua identificação exata permanece incerta.
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: e de todo tipo de música
  rationale: Reproduz naturalmente a expressão abrangente que encerra a lista de instrumentos.
- source_word: נָפְלִין
  choice: caíram por terra
  rationale: Preserva a ação concreta de cair em prostração, em vez de fundi-la com o verbo seguinte.
- source_word: צֶלֶם דַּהֲבָא
  choice: imagem de ouro
  rationale: Traduz diretamente o termo aramaico para imagem ou representação, sem restringi-lo desnecessariamente a uma forma escultórica específica.
- source_word: הֲקֵים
  choice: havia erguido
  rationale: O mais-que-perfeito deixa clara, em português natural, a anterioridade da instalação da imagem.
theological_decisions:
- issue: Natureza do ato dirigido à imagem
  choice: adoraram
  alternative: prestaram homenagem; curvaram-se diante de
  rationale: O objeto é uma imagem dentro de uma cerimônia cultual imposta; por isso, o verbo português preserva adequadamente a força religiosa do aramaico סגד, sem reduzir o ato a mera cortesia civil.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração e a repetição de “todos os povos” foram preservadas por seu valor retórico; os nomes tradicionais dos instrumentos menos conhecidos são esclarecidos em nota.
