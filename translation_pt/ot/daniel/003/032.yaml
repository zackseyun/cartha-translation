  text: It has seemed good to me to declare the signs and wonders that the Most High God has done for me[a][b].
translation:
  language: pt
  text: Pareceu-me bem declarar os sinais e as maravilhas que o Deus Altíssimo fez comigo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pareceu-me bem dar a conhecer”; a expressão aramaica é uma fórmula de aprovação ou decisão real.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fez comigo”; isto é, o que Deus fez em relação a Nabucodonosor.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָתַיָּא
  choice: os sinais
  rationale: O substantivo aramaico plural significa “sinais”; o artigo definido é natural em português para atos conhecidos que serão relatados.
- source_word: וְתִמְהַיָּא
  choice: e as maravilhas
  rationale: “Maravilhas” traduz naturalmente o termo de atos extraordinários e preserva sua associação tradicional com “sinais”.
- source_word: דִּי
  choice: que
  rationale: A partícula relativa introduz a oração que descreve os sinais e as maravilhas.
- source_word: עֲבַד
  choice: fez
  rationale: O verbo significa “fazer”. O pretérito perfeito é natural em português para os atos já realizados que motivam a proclamação.
- source_word: עִמִּי
  choice: por mim
  rationale: Literalmente, “comigo”; no contexto, indica o que Deus fez em relação ao rei ou em seu favor. “Por mim” comunica essa dimensão benefativa sem eliminar a alternativa literal, registrada em nota.
- source_word: אֱלָהָא עִלָּיָא
  choice: o Deus Altíssimo
  rationale: Forma portuguesa corrente e digna do título divino superlativo, sem acrescentar formulação doutrinária posterior.
- source_word: שְׁפַר קָדָמַי
  choice: Pareceu-me bem
  rationale: Reproduz de modo natural a expressão formal de aprovação ou resolução real, cujo sentido literal envolve aquilo que é bom diante do falante.
- source_word: לְהַחֲוָיָה
  choice: declarar
  rationale: O infinitivo significa “dar a conhecer, declarar”; “declarar” se ajusta ao caráter público e régio da proclamação.
theological_decisions:
- issue: Tradução do título divino אֱלָהָא עִלָּיָא
  choice: o Deus Altíssimo
  alternative: Deus, o Altíssimo
  rationale: Preserva explicitamente a exaltação expressa pelo título aramaico e soa natural em português, sem importar distinções doutrinárias alheias ao texto.
- issue: Sentido relacional de עִמִּי
  choice: por mim
  alternative: comigo
  rationale: O contexto admite a noção do que Deus fez em favor do rei ou em relação a ele. O texto principal oferece a leitura portuguesa mais natural, enquanto a nota preserva a forma mais literal e sua amplitude.
translation_notes:
  register: Português moderno, claro e digno, com tom formal apropriado a uma proclamação real. A ordem “Deus Altíssimo” favorece a legibilidade brasileira e permanece amplamente compreensível no português internacional. As notas mantêm as principais alternativas do aramaico sem sobrecarregar o versículo.
