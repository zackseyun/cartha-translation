base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/019.yaml
  text: Then Nebuchadnezzar was filled with fury[a], and the expression of his face was changed against Shadrach, Meshach, and Abed-nego. He answered and said to heat the furnace seven times more than it was usually heated.
translation:
  language: pt
  text: Então Nabucodonosor ficou cheio de fúria, e seu semblante mudou contra Sadraque, Mesaque e Abede-Nego. Ele respondeu e ordenou que aquecessem a fornalha sete vezes mais do que era costume aquecê-la[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sete vezes”. A expressão aramaica indica que a fornalha devia ser aquecida a uma intensidade sete vezes superior à habitual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca o avanço da sequência narrativa de modo natural e claro em português.
- source_word: הִתְמְלִי חֱמָא
  choice: ficou cheio de fúria
  rationale: Preserva a imagem de encher-se de ira e comunica a intensidade do estado emocional sem linguagem arcaica.
- source_word: וּצְלֵם אַנְפּוֹהִי אשתנו עַל
  choice: a expressão do seu rosto tornou-se hostil a
  rationale: A expressão aramaica descreve uma mudança visível no semblante, orientada de modo adverso contra os três homens. A formulação portuguesa torna explícita essa hostilidade sem perder a referência concreta ao rosto.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Sadraque, Mesaque e Abede-Nego
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes aramaicos.
- source_word: עָנֵה וְאָמַר
  choice: Ele respondeu e ordenou
  rationale: Mantém o verbo de resposta da fórmula semítica, enquanto 'ordenou' expressa naturalmente que a fala seguinte tem força de comando.
- source_word: לְמֵזֵא לְאַתּוּנָא
  choice: que aquecessem a fornalha
  rationale: O infinitivo aramaico dependente do verbo de fala comunica a ordem de elevar o calor da fornalha.
- source_word: חַד שִׁבְעָה
  choice: sete vezes mais
  rationale: Expressa em português corrente a intensificação em grau sete indicada pelo idioma aramaico, mantendo em nota a possibilidade de formular a proporção como 'sete vezes'.
- source_word: עַל דִּי חֲזֵה לְמֵזְיֵהּ
  choice: do que de costume
  rationale: A oração refere-se ao grau considerado habitual ou apropriado para aquecer a fornalha; esta forma evita uma tradução literal obscura.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações e a imagem do rosto foram preservadas, enquanto a fórmula de fala foi ajustada para deixar clara a força imperativa. O marcador da nota foi colocado junto à expressão numérica a que efetivamente se refere.
