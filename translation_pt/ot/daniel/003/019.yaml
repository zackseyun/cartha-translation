revisions:
- from: Então Nabucodonosor ficou cheio de fúria, e a expressão do seu rosto tornou-se hostil a Sadraque, Mesaque e Abede-Nego. Ele respondeu e ordenou que aquecessem a fornalha sete vezes mais do que de costume[a].
  to: Então Nabucodonosor ficou cheio de fúria, e seu semblante mudou contra Sadraque, Mesaque e Abede-Nego. Ele respondeu e ordenou que aquecessem a fornalha sete vezes mais do que era costume aquecê-la[a].
  rationale: A revisão substitui uma expressão facial pouco idiomática por «seu semblante mudou», sem perder a orientação hostil indicada por «contra». Corrige também a nota, removendo «até», que enfraquecia indevidamente a intensidade determinada da expressão aramaica. A redação principal mantém a ordem de aquecer a fornalha e o sentido de intensificação além do uso habitual.
