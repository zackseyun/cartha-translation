    issue: A nota diz «até sete vezes o calor habitual».
    rationale: «Até» sugere um limite máximo ou uma aproximação, enquanto o aramaico expressa uma intensificação determinada, convencionalmente entendida como sete vezes. A nota também não apresenta uma alternativa precisa à redação principal.
  - severity: low
    issue: «A expressão do seu rosto tornou-se hostil a» é menos natural do que uma formulação com «semblante».
    rationale: O original descreve a mudança da aparência/expressão facial em hostilidade contra os homens. «Seu semblante mudou contra» preserva a imagem e soa mais natural no português bíblico moderno.
