id: DAN.3.10
reference: Daniel 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אנתה מַלְכָּ/א֮ שָׂ֣מְתָּ טְּעֵם֒ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִשְׁמַ֡ע קָ֣ל קַרְנָ֣/א מַ֠שְׁרֹקִיתָ/א קיתרס שַׂבְּכָ֤א פְסַנְתֵּרִין֙ ו/סיפניה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א יִפֵּ֥ל וְ/יִסְגֻּ֖ד לְ/צֶ֥לֶם דַּהֲבָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/010.yaml
  text: You[a], O king, have issued a decree that every man who hears the sound of the horn, pipe, lyre[b], trigon, psaltery, and bagpipe, and every kind of music, must fall down and worship the golden image.
translation:
  language: pt
  text: Tu, ó rei, promulgaste um decreto segundo o qual todo homem[a] que ouvir o som da trompa, da flauta, da cítara, do trígono, do saltério, da gaita de foles[b] e de todo tipo de música deve prostrar-se e adorar a imagem de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda pessoa” ou “todos”; o aramaico emprega uma forma masculina singular com sentido genérico.
    reason: lexical_alternative
  - marker: b
    text: Ou “flauta dupla”; não se sabe ao certo qual instrumento é designado pelo termo aramaico.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה מַלְכָּא
  choice: Tu, ó rei
  rationale: Preserva o pronome independente de segunda pessoa e o valor vocativo da forma de tratamento régia, em linguagem solene e clara.
- source_word: שָׂמְתָּ טְּעֵם
  choice: promulgaste um decreto
  rationale: Expressa naturalmente o idioma aramaico, literalmente “estabeleceste um decreto”, mantendo seu caráter oficial e jurídico.
- source_word: כָל אֱנָשׁ
  choice: todo homem
  rationale: Mantém a forma masculina singular do aramaico e seu sentido representativo; a alternativa inclusiva é registrada em nota.
- source_word: יִשְׁמַע קָל
  choice: que ouvir o som
  rationale: Reproduz diretamente a construção “ouvir o som”, apropriada antes da enumeração dos instrumentos.
- source_word: קַרְנָא
  choice: trompa
  rationale: Designa de modo acessível um instrumento de sopro feito ou derivado de um chifre, sem especificar além do texto.
- source_word: מַשְׁרֹקִיתָא
  choice: flauta
  rationale: É uma designação corrente para o instrumento de sopro, cuja identificação mais específica não é segura.
- source_word: קיתרס
  choice: cítara
  rationale: Reflete o empréstimo relacionado ao grego kithara e distingue este instrumento de cordas dos demais da lista.
- source_word: שַׂבְּכָא
  choice: trígono
  rationale: Conserva a designação tradicional de um instrumento triangular de cordas sem o fundir com os outros instrumentos da lista.
- source_word: פְסַנְתֵּרִין
  choice: saltério
  rationale: Emprega o termo português tradicional e reconhecido para este instrumento de cordas.
- source_word: סִיפֹנְיָה
  choice: gaita de foles
  rationale: Segue uma identificação tradicional plausível, mas a incerteza lexical é explicitada em nota.
- source_word: יִפֵּל וְיִסְגֻּד
  choice: deve prostrar-se e adorar
  rationale: A formulação com “deve” comunica a força obrigatória do decreto, enquanto os dois verbos preservam tanto o gesto físico quanto seu sentido cultual.
- source_word: צֶלֶם דַּהֲבָא
  choice: imagem de ouro
  rationale: Mantém a construção simples e concreta do aramaico, sem decidir se a imagem era maciça ou revestida.
theological_decisions:
- issue: Sentido cultual de וְיִסְגֻּד
  choice: adorar
  alternative: prestar homenagem
  rationale: O ato é dirigido a uma imagem de ouro em um contexto explicitamente cultual; “adorar” conserva esse peso religioso, sem reduzir a ação a deferência política.
- issue: Masculino genérico em כָל אֱנָשׁ
  choice: todo homem
  alternative: toda pessoa / todos
  rationale: A tradução principal retém a forma masculina singular com força genérica do original, enquanto a nota esclarece seu alcance representativo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas verbais de segunda pessoa adequadas ao tratamento régio solene. Os nomes tradicionais dos instrumentos foram mantidos quando ajudam a distingui-los; a identificação mais incerta recebeu nota.
