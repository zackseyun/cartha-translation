base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/008.yaml
  text: For this reason[a], at that time certain Chaldean men came forward and maliciously accused the Jews.
translation:
  language: pt
  text: Por essa razão, naquele tempo, alguns homens caldeus se apresentaram e fizeram acusações maliciosas contra os judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeanos”. O termo aramaico pode designar o povo de Judá em sentido étnico-geográfico, bem como “os judeus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: Por essa razão
  rationale: Expressa com naturalidade o valor causal do idioma aramaico e mantém sua ligação com o contexto anterior.
- source_word: בֵּהּ זִמְנָא
  choice: naquele momento
  rationale: Reproduz a expressão temporal de maneira clara e corrente; o contexto sugere a ocasião imediata.
- source_word: קְרִבוּ
  choice: se apresentaram
  rationale: No cenário da corte, comunica que os homens se aproximaram para formular a acusação, sem acrescentar que fossem autoridades.
- source_word: גֻּבְרִין כַּשְׂדָּאִין
  choice: alguns homens caldeus
  rationale: Preserva o substantivo masculino explícito e o caráter indefinido do grupo sem inferir funções oficiais.
- source_word: וַאֲכַלוּ קַרְצֵיהוֹן
  choice: acusaram maldosamente
  rationale: 'Traduz o idioma aramaico, literalmente ligado a ''comer os pedaços'', mediante seu sentido forense e hostil: denunciar ou acusar com malícia.'
- source_word: דִּי יְהוּדָיֵא
  choice: os judeus
  rationale: É a designação portuguesa convencional e clara neste contexto; a possibilidade étnico-geográfica 'judeanos' é mantida em nota.
