  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵ֣ן לָ֔א יְדִ֥יעַ לֶהֱוֵא לָ֖/ךְ מַלְכָּ֑/א דִּ֤י ל/אלהי/ך לָא איתי/נא פָֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א נִסְגֻּֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/018.yaml
  text: But if not[a], let it be known to you, O king, that we will not serve your gods, and we will not bow down to the golden image that you have set up.
translation:
  language: pt
  text: Mas, se não[a], fique sabendo, ó rei, que não serviremos aos seus deuses nem nos prostraremos diante da imagem de ouro que você ergueu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas, mesmo que não”, com o sentido implícito do versículo anterior: “mesmo que ele não nos livre”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵן לָא
  choice: Mas, se não
  rationale: Preserva a expressão aramaica elíptica e condicional, cujo complemento é fornecido pelo versículo anterior, sem explicitá-lo no texto principal.
- source_word: יְדִיעַ לֶהֱוֵא לָךְ
  choice: fique sabendo
  rationale: Expressa de modo natural e digno em português a fórmula impessoal de declaração, mantendo sua força solene.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: Reproduz o vocativo direto e o tom solene da fala perante o rei.
- source_word: דִּי
  choice: que
  rationale: Introduz adequadamente, em português, o conteúdo daquilo que o rei deve saber.
- source_word: לֵאלָהָיִךְ ... לָא אִיתַנָא פָלְחִין
  choice: não serviremos aos seus deuses
  rationale: A forma participial negativa comunica uma recusa firme com alcance presente e futuro; o futuro em português ressalta naturalmente essa resolução.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: nem ... diante da imagem de ouro
  rationale: “Imagem de ouro” conserva o substantivo concreto sem restringi-lo a “estátua”; “diante de” combina naturalmente com “prostrar-se” e representa a relação marcada pela preposição aramaica.
- source_word: דִּי הֲקֵימְתָּ
  choice: que você ergueu
  rationale: Indica a ação concluída do rei e usa um verbo corrente e apropriado para instalar uma grande imagem.
- source_word: לָא נִסְגֻּד
  choice: nem nos prostraremos
  rationale: Mantém o sentido físico de curvar-se em homenagem cultual, sem substituí-lo diretamente pela interpretação mais ampla “adorar”.
theological_decisions:
- issue: Expressão condicional elíptica no início da resposta
  choice: Mas, se não
  alternative: Mas, mesmo que ele não nos livre
  rationale: O contexto anterior permite entender “se ele não nos livrar”, mas o aramaico deixa o complemento implícito. A tradução curta preserva a ambiguidade genuína, a força retórica e a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” mantém a distinção singular do endereço ao rei sem recorrer ao hoje excessivamente cerimonioso “vós”. A construção “se não” é deliberadamente elíptica, conforme o original, e recebe esclarecimento em nota.
