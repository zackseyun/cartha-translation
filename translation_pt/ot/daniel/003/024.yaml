base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/024.yaml
  text: Then King Nebuchadnezzar was astonished and rose up in haste[a]. He answered and said to his counselors, “Did we not throw three men, bound, into the midst of the fire?” They answered and said to the king, “Certainly[b], O king.”
translation:
  language: pt
  text: 'Então o rei Nabucodonosor ficou espantado e se levantou às pressas. Ele tomou a palavra e disse aos seus conselheiros[a]: “Não lançamos três homens amarrados no meio do fogo?” Eles responderam ao rei: “Certamente, ó rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus funcionários” ou “aos seus ministros”; o termo aramaico se refere a pessoas que serviam na corte real.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: תְּוַהּ
  choice: ficou espantado
  rationale: Expressa a forte surpresa ou o sobressalto do rei diante do que viu, sem acrescentar uma interpretação além do texto.
- source_word: בְּהִתְבְּהָלָה
  choice: às pressas
  rationale: Preserva a ideia de rapidez agitada; o verbo anterior já comunica o estado emocional do rei.
- source_word: עָנֵה וְאָמַר
  choice: tomou a palavra e disse
  rationale: Representa a fórmula semítica de introdução à fala de maneira corrente e digna em português, mantendo os dois elementos sem reproduzir uma construção pouco natural.
- source_word: לְהַדָּבְרוֹהִי
  choice: aos seus conselheiros
  rationale: O termo designa pessoas da corte que serviam em função administrativa ou consultiva; “conselheiros” se ajusta ao contexto, embora “funcionários” e “ministros” também sejam possíveis.
- source_word: הֲלָא
  choice: Não lançamos
  rationale: Introduz uma pergunta retórica que espera confirmação, forma naturalmente expressa em português pela negativa inicial.
- source_word: גֻבְרִין תְּלָתָא
  choice: três homens
  rationale: Tradução direta, clara e contextualmente precisa.
- source_word: רְמֵינָא
  choice: lançamos
  rationale: “Lançar” expressa adequadamente o ato de jogar alguém ao fogo e combina com o registro narrativo solene sem soar arcaico.
- source_word: לְגוֹא נוּרָא
  choice: no meio do fogo
  rationale: Preserva o valor espacial mais pleno do aramaico, que indica o interior ou meio do fogo.
- source_word: מְכַפְּתִין
  choice: amarrados
  rationale: Descreve com clareza o estado dos três homens quando foram lançados; é mais corrente para leitores modernos do que “atados” ou “agrilhoados”.
- source_word: עָנַיִן וְאָמְרִין
  choice: responderam
  rationale: A fórmula aramaica “responderam e disseram” é condensada para uma expressão portuguesa natural, sem perda de conteúdo.
- source_word: יַצִּיבָא
  choice: Certamente
  rationale: Comunica a confirmação enfática dada pelos cortesãos à pergunta do rei.
theological_decisions: []
