  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula semítica de fala foi preservada na primeira ocorrência por “tomou a palavra e disse” e condensada na resposta para evitar rigidez. O vocativo “ó rei” mantém o tom cortesão do original.
