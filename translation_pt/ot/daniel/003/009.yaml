  text: They answered and said to King Nebuchadnezzar[a], “O king, live forever!”
translation:
  language: pt
  text: 'Eles responderam e disseram ao rei Nabucodonosor: “Ó rei, viva para sempre!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em aramaico: “Ó rei, viva por eras”. A expressão é uma aclamação convencional da corte com o sentido de “viva para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ וְאָמְרִין
  choice: Eles responderam
  rationale: A fórmula aramaica significa literalmente “responderam e disseram”, mas, em português atual, “responderam” comunica naturalmente a introdução da fala sem redundância desnecessária.
- source_word: לִנְבוּכַדְנֶצַּר מַלְכָּא
  choice: ao rei Nabucodonosor
  rationale: A preposição indica o destinatário, e o título seguido do nome corresponde à ordem mais natural em português.
- source_word: מַלְכָּא (segunda ocorrência)
  choice: Ó rei
  rationale: A repetição do título funciona como vocativo solene e cortês; “Ó rei” preserva esse valor.
- source_word: לְעָלְמִין חֱיִי
  choice: viva para sempre
  rationale: Embora לְעָלְמִין tenha literalmente o sentido de “por eras”, a expressão é uma aclamação convencional da corte e equivale idiomaticamente a “viva para sempre”.
