  text: וּ֠/מִֽתְכַּנְּשִׁין אֲחַשְׁדַּרְפְּנַיָּ֞/א סִגְנַיָּ֣/א וּ/פַחֲוָתָ/א֮ וְ/הַדָּבְרֵ֣י מַלְכָּ/א֒ חָזַ֣יִן לְ/גֻבְרַיָּ֣/א אִלֵּ֡ךְ דִּי֩ לָֽא שְׁלֵ֨ט נוּרָ֜/א בְּ/גֶשְׁמְ/ה֗וֹן וּ/שְׂעַ֤ר רֵֽאשְׁ/הוֹן֙ לָ֣א הִתְחָרַ֔ךְ וְ/סָרְבָּלֵי/ה֖וֹן לָ֣א שְׁנ֑וֹ וְ/רֵ֣יחַ נ֔וּר לָ֥א עֲדָ֖ת בְּ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/027.yaml
  text: And the satraps[a], the prefects, the governors, and the king’s counselors gathered together and saw concerning these men that the fire had no power over their bodies, and the hair of their heads was not singed, and their cloaks were not changed, and no smell of fire had come upon them.
translation:
  language: pt
  text: Os sátrapas, os prefeitos, os governadores e os conselheiros do rei reuniram-se e constataram, a respeito destes homens, que o fogo não tivera poder sobre os corpos deles; nenhum fio de cabelo da cabeça deles fora chamuscado, seus mantos[a] não haviam sofrido alteração, e nenhum cheiro de fogo havia ficado neles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestes”; o termo aramaico para essa peça de roupa é de sentido incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתְכַּנְּשִׁין
  choice: reuniram-se
  rationale: Expressa de modo natural em português a ação coletiva de se ajuntar ou reunir.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: sátrapas
  rationale: Mantém o título administrativo persa tradicional e historicamente preciso.
- source_word: סִגְנַיָּא
  choice: prefeitos
  rationale: Distingue esses altos administradores dos governadores e dos demais oficiais mencionados.
- source_word: פַחֲוָתָא
  choice: governadores
  rationale: Equivalente claro e corrente para o cargo administrativo indicado.
- source_word: הַדָּבְרֵי מַלְכָּא
  choice: conselheiros do rei
  rationale: Representa adequadamente os oficiais ou assessores da corte sem impor uma função técnica mais específica.
- source_word: חָזַיִן לְגֻבְרַיָּא אִלֵּךְ
  choice: constataram, a respeito daqueles homens
  rationale: ‘Constataram’ comunica a observação comprobatória, enquanto ‘a respeito daqueles homens’ preserva a função referencial da preposição aramaica לְ.
- source_word: לָא שְׁלֵט נוּרָא בְּגֶשְׁמְהוֹן
  choice: o fogo não tivera poder sobre o corpo deles
  rationale: Preserva o sentido forte de שׁלט, exercer poder ou domínio, e traduz גשם como corpo.
- source_word: וּשְׂעַר רֵאשְׁהוֹן לָא הִתְחָרַךְ
  choice: nenhum fio de cabelo da cabeça deles fora chamuscado
  rationale: ‘Chamuscado’ é preciso para o efeito do fogo sobre cabelos; a formulação portuguesa expressa naturalmente a preservação completa.
- source_word: וְסָרְבָּלֵיהוֹן לָא שְׁנוֹ
  choice: seus mantos não haviam sofrido alteração
  rationale: ‘Mantos’ é uma identificação tradicional e plausível da peça de roupa, cuja natureza exata permanece incerta; ‘não haviam sofrido alteração’ conserva o sentido de não terem mudado.
- source_word: וְרֵיחַ נוּר לָא עֲדָת בְּהוֹן
  choice: nenhum cheiro de fogo havia ficado neles
  rationale: Formulação idiomática que comunica que nem sequer o odor do fogo os atingira ou permanecera neles.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com títulos administrativos historicamente reconhecíveis. A sintaxe foi tornada natural sem eliminar a referência explícita aos homens marcada pelo aramaico. O marcador da nota foi colocado após “mantos”, termo ao qual a incerteza lexical efetivamente se aplica.
