  text: עָנֵ֣ה וְ/אָמַ֗ר הָֽא אֲנָ֨ה חָזֵ֜ה גֻּבְרִ֣ין אַרְבְּעָ֗ה שְׁרַ֨יִן֙ מַהְלְכִ֣ין בְּ/גֽוֹא נוּרָ֔/א וַ/חֲבָ֖ל לָא אִיתַ֣י בְּ/ה֑וֹן וְ/רֵוֵ/הּ֙ דִּ֣י רביעי/א דָּמֵ֖ה לְ/בַר אֱלָהִֽין־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/025.yaml
  text: He answered and said[a], “Look! I see four men unbound, walking in the midst of the fire, and there is no harm on them; and the appearance of the fourth is like a son of the gods.”
translation:
  language: pt
  text: 'Ele respondeu: “Vejam! Estou vendo quatro homens soltos, andando no meio do fogo, sem sofrer nenhum dano; e a aparência do quarto é semelhante à de um filho dos deuses.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, segundo a interpretação cristã tradicional, “semelhante à do Filho de Deus”. Mais literalmente, o aramaico diz “semelhante à de um filho dos deuses”, refletindo a perspectiva do próprio Nabucodonosor.
    reason: alternative_reading
lexical_decisions:
- source_word: הָא
  choice: Vejam!
  rationale: Interjeição dêitica que introduz uma observação enfática e repentina. “Vejam!” é natural em português moderno e se dirige aos presentes na cena.
- source_word: חָזֵה
  choice: Estou vendo
  rationale: A forma expressa a percepção imediata do rei; o presente progressivo comunica com naturalidade que ele relata o que vê naquele momento.
- source_word: גֻּבְרִין אַרְבְּעָה
  choice: quatro homens
  rationale: O substantivo aramaico designa homens do sexo masculino neste contexto, e o numeral é preservado diretamente.
- source_word: שְׁרַיִן
  choice: soltos
  rationale: Contrasta com o fato de terem sido amarrados antes de serem lançados na fornalha. “Soltos” é claro e idiomático, mantendo a imagem das amarras desfeitas.
- source_word: מַהְלְכִין
  choice: andando
  rationale: O particípio descreve uma ação em curso; “andando” é a correspondência direta e natural.
- source_word: בְּגוֹא נוּרָא
  choice: no meio do fogo
  rationale: Preserva de modo idiomático a força locativa da expressão aramaica.
- source_word: וַחֲבָל לָא אִיתַי בְּהוֹן
  choice: sem sofrer nenhum dano
  rationale: Expressa naturalmente em português a ausência total de lesão indicada pela construção aramaica, sem alterar seu sentido.
- source_word: רֵוֵהּ דִּי רביעיא
  choice: a aparência do quarto
  rationale: Refere-se ao aspecto visível da quarta figura; a construção genitiva é mantida com clareza.
- source_word: דָּמֵה
  choice: é semelhante à de
  rationale: Preserva a comparação, sem transformar semelhança em identificação. A retomada “à de” produz uma construção natural com “aparência”.
- source_word: לְבַר אֱלָהִין
  choice: um filho dos deuses
  rationale: A expressão é indefinida (“um filho”) e o plural אֱלָהִין, na fala de Nabucodonosor, é mais naturalmente entendido como “deuses”. A formulação mantém a perspectiva do rei e evita inserir no texto uma identificação cristológica explícita.
theological_decisions:
- issue: Identidade da quarta figura na descrição de Nabucodonosor
  choice: 'Traduzir a fala segundo a perspectiva do próprio rei: “semelhante à de um filho dos deuses”.'
  alternative: “semelhante à do Filho de Deus” ou referência genérica a um ser divino/angelical.
  rationale: O aramaico apresenta uma comparação, não uma identificação, e a expressão é mais naturalmente indefinida e plural na boca do rei pagão. Daniel 3:28 posteriormente registra a interpretação do rei em termos do anjo de Deus, mas este versículo não exige uma identificação messiânica explícita. A interpretação cristã tradicional é preservada em nota, sem ser imposta ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala mantém vivacidade por meio de “Vejam!” e “Estou vendo”. Evitaram-se tanto o arcaísmo “Eis” quanto uma formulação confessional que resolvesse a ambiguidade da quarta figura.
