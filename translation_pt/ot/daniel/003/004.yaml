  yaml_path: translation/ot/daniel/003/004.yaml
  text: And the herald cried aloud[a], “To you it is proclaimed, O peoples, nations[b], and languages:”
translation:
  language: pt
  text: 'Então o arauto proclamou em alta voz[a]: “A vocês se proclama, ó povos, nações e línguas:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com força”. A expressão aramaica se refere literalmente à força e, aqui, descreve a intensidade ou o volume da proclamação do arauto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרוֹזָא
  choice: o arauto
  rationale: Designa o proclamador público oficial; “arauto” preserva o caráter formal e régio da cena.
- source_word: קָרֵא
  choice: proclamou
  rationale: O verbo indica chamar em voz alta; no contexto de um anúncio oficial, “proclamou” é natural e mantém a força pública da fala.
- source_word: בְחָיִל
  choice: em alta voz
  rationale: Literalmente “com força”; aqui descreve a intensidade ou o volume da proclamação.
- source_word: לְכוֹן
  choice: A vocês
  rationale: Reproduz o dativo da segunda pessoa do plural que introduz os destinatários.
- source_word: אָמְרִין
  choice: se ordena
  rationale: A forma literal “estão dizendo” funciona como fórmula oficial impessoal. No contexto imediato do decreto real, “se ordena” comunica sua força normativa sem identificar um sujeito inexistente no aramaico.
- source_word: עַמְמַיָּא
  choice: povos
  rationale: Mantém o plural distributivo e distingue este termo do seguinte.
- source_word: אֻמַּיָּא
  choice: nações
  rationale: Preserva o segundo elemento distinto da fórmula imperial tríplice.
- source_word: לִשָּׁנַיָּא
  choice: línguas
  rationale: Equivalente moderno e claro do termo literalmente associado a “línguas”, aqui referente a grupos linguísticos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção vocativa “ó povos, nações e línguas” preserva o endereço direto e solene. “A vocês se ordena” expressa a fórmula impessoal aramaica no contexto de um decreto oficial.
