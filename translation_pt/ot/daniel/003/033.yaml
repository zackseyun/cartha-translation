  text: אָת֨וֹ/הִי֙ כְּ/מָ֣ה רַבְרְבִ֔ין וְ/תִמְה֖וֹ/הִי כְּ/מָ֣ה תַקִּיפִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/שָׁלְטָנֵ֖/הּ עִם דָּ֥ר וְ/דָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/033.yaml
  text: How great are his signs[a], and how mighty are his wonders! His kingdom is an everlasting kingdom[c][b], and his dominion is from generation to generation.
translation:
  language: pt
  text: Como são grandes os seus sinais[a], e como são poderosas as suas maravilhas! O seu reino é um reino eterno[b], e o seu domínio permanece de geração em geração.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus prodígios”.
    reason: lexical_alternative
  - marker: b
    text: Ou “um reino perpétuo”.
    reason: lexical_alternative
  - marker: c
    text: 'Aramaico: “com geração e geração”, expressão que indica continuidade por todas as gerações.'
    reason: cultural_note
lexical_decisions:
- source_word: אָתוֹהִי
  choice: os seus sinais
  rationale: No aramaico bíblico, o substantivo designa sinais, em especial atos extraordinários com valor de sinal. “Sinais” é claro e preserva a associação tradicional com “maravilhas”.
- source_word: כְּמָה
  choice: como são
  rationale: A partícula introduz uma exclamação de admiração; em português, “Como são grandes...” expressa isso com naturalidade.
- source_word: רַבְרְבִין
  choice: grandes
  rationale: Neste louvor exclamativo, indica a grandeza qualitativa dos sinais, não apenas sua quantidade.
- source_word: תִמְהוֹהִי
  choice: as suas maravilhas
  rationale: Refere-se a atos que causam assombro. “Maravilhas” é natural, digno e mantém o paralelismo com “sinais”.
- source_word: תַקִּיפִין
  choice: poderosas
  rationale: Expressa força ou potência. A concordância com “maravilhas” exige a forma feminina e transmite bem o tom doxológico.
- source_word: מַלְכוּתֵהּ
  choice: o seu reino
  rationale: A forma possessiva se refere ao reino ou governo de Deus, sem necessidade de explicitar o referente no próprio versículo.
- source_word: מַלְכוּת עָלַם
  choice: um reino eterno
  rationale: A expressão denota duração indefinida ou perpétua. “Eterno” é corrente e solene; a nota registra uma alternativa igualmente possível.
- source_word: שָׁלְטָנֵהּ
  choice: o seu domínio
  rationale: Designa autoridade governante. “Domínio” conserva a nuance régia e o paralelismo com “reino”.
- source_word: עִם דָּר וְדָר
  choice: permanece de geração em geração
  rationale: Literalmente, a construção é “com geração e geração”. A formulação portuguesa comunica sua continuidade por todas as gerações; “permanece” torna idiomática a predicação nominal implícita sem alterar seu sentido.
theological_decisions:
- issue: Referente divino na doxologia de Nabucodonosor
  choice: Manter os pronomes possessivos como referência direta ao Deus Altíssimo, sem explicação adicional no texto.
  alternative: Explicitar “de Deus” no texto principal.
  rationale: O contexto identifica claramente o referente, e a explicitação acrescentaria material ausente deste versículo.
- issue: Duração do reino e do domínio
  choice: Traduzir עָלַם por “eterno” e a expressão geracional como continuidade de geração em geração.
  alternative: Traduzir por “perpétuo” ou “para sempre” e “por todas as gerações”.
  rationale: A redação mantém a afirmação forte da duração do governo divino sem impor uma elaboração teológica além das expressões aramaicas.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. Preserva o paralelismo exclamativo e régio do aramaico. Os marcadores aparecem junto aos elementos a que se referem, e a pontuação mantém o caráter de louvor.
