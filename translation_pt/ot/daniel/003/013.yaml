base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/013.yaml
  text: Then Nebuchadnezzar, in rage and fury, commanded that Shadrach, Meshach, and Abed-nego be brought in. Then these men were brought before the king.
translation:
  language: pt
  text: Então Nabucodonosor, tomado de ira e furor, ordenou que trouxessem Sadraque, Mesaque e Abede-Nego. Então esses homens foram levados à presença do rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que introduz o acontecimento seguinte; “Então” mantém com naturalidade a sequência narrativa nas duas ocorrências.
- source_word: בִּרְגַז וַחֲמָה
  choice: tomado de ira e furor
  rationale: A expressão conserva os dois substantivos intensificadores e apresenta de modo idiomático o estado emocional de Nabucodonosor.
- source_word: אֲמַר לְהַיְתָיָה
  choice: ordenou que trouxessem
  rationale: A construção com “disse” e infinitivo causativo tem força de ordem; esta formulação portuguesa comunica claramente que terceiros deveriam trazer os homens.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Sadraque, Mesaque e Abede-Nego
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecíveis dos nomes próprios aramaicos.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: esses homens
  rationale: Retoma os três homens recém-nomeados e preserva adequadamente a força dêitica da expressão.
- source_word: הֵיתָיוּ קֳדָם מַלְכָּא
  choice: foram levados à presença do rei
  rationale: Preserva o sentido passivo/causativo do verbo e traduz קֳדָם de modo natural para um contexto de audiência real.
