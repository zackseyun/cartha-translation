base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/022.yaml
  text: Because of this, since the king’s command was harsh and the furnace had been heated exceedingly, the flame of the fire killed those men who brought up Shadrach, Meshach, and Abed-nego.
translation:
  language: pt
  text: Por isso, visto que a ordem do rei era urgente e a fornalha estava excessivamente aquecida, a chama do fogo matou os homens que fizeram Sadraque, Mesaque e Abede-Nego subir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחְצְפָה
  choice: severa
  rationale: O adjetivo aramaico indica algo duro, rigoroso ou inexorável; “severa” comunica naturalmente a dureza da ordem real sem reduzi-la apenas à urgência.
- source_word: אֵזֵה יַתִּירָא
  choice: havia sido aquecida excessivamente
  rationale: Preserva a intensidade superlativa da expressão aramaica e a relação temporal com o resultado narrado.
- source_word: הַסִּקוּ
  choice: levaram ... para cima
  rationale: O verbo causativo deriva de “subir” e provavelmente descreve os homens conduzindo os condenados até a abertura elevada da fornalha; a tradução retém essa dimensão espacial.
- source_word: שְׁבִיבָא דִּי נוּרָא
  choice: a chama do fogo
  rationale: Equivalência direta e natural para a expressão aramaica, que pode designar chama ou labareda.
