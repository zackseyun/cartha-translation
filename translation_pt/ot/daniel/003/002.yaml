base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/002.yaml
  text: Then King Nebuchadnezzar sent to assemble the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces, to come to the dedication of the image that King Nebuchadnezzar had set up.
translation:
  language: pt
  text: Então o rei Nabucodonosor mandou reunir os sátrapas, os prefeitos, os governadores, os conselheiros, os tesoureiros, os juízes, os magistrados e todas as autoridades das províncias, para que viessem à dedicação da imagem[a] que o rei Nabucodonosor havia erguido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estátua”. O termo aramaico pode se referir a uma imagem em geral ou, neste contexto, a uma estátua monumental.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְמִכְנַשׁ
  choice: mandou reunir
  rationale: No contexto administrativo, expressa naturalmente que o rei enviou uma ordem para convocar e reunir os oficiais, sem acrescentar conteúdo além da construção aramaica.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: sátrapas
  rationale: Mantém o título administrativo persa tradicional e preserva o cenário imperial.
- source_word: סִגְנַיָּא
  choice: prefeitos
  rationale: Equivalente formal corrente para essa classe de altos administradores.
- source_word: פַחֲוָתָא
  choice: governadores
  rationale: Designa claramente uma função governamental e a distingue dos sátrapas.
- source_word: אֲדַרְגָּזְרַיָּא
  choice: conselheiros
  rationale: Embora a identificação exata do cargo seja incerta, esta tradução convencional comunica uma função consultiva de alto nível.
- source_word: גְדָבְרַיָּא
  choice: tesoureiros
  rationale: Reflete o entendimento comum de que eram responsáveis pelo tesouro ou pelas finanças.
- source_word: דְּתָבְרַיָּא
  choice: juízes
  rationale: É o equivalente direto mais provável para oficiais ligados a decisões jurídicas.
- source_word: תִּפְתָּיֵא
  choice: magistrados
  rationale: Preserva o sentido judicial-administrativo sem alegar precisão indevida quanto ao cargo exato.
- source_word: כֹל שִׁלְטֹנֵי מְדִינָתָא
  choice: todas as autoridades das províncias
  rationale: A expressão ampla resume os detentores de autoridade provincial; 'autoridades' mantém o sentido coletivo.
- source_word: לְמֵתֵא
  choice: para que viessem
  rationale: Reproduz o sentido básico de 'vir' e conecta naturalmente a finalidade da convocação em português.
- source_word: חֲנֻכַּת
  choice: dedicação
  rationale: Termo claro e tradicional para a cerimônia em que o monumento era formalmente inaugurado ou consagrado.
- source_word: צַלְמָא
  choice: imagem
  rationale: Preserva a amplitude lexical do aramaico; no contexto, a referência pode ser especificamente a uma estátua monumental.
- source_word: הֲקֵים
  choice: havia erguido
  rationale: Expressa o ato de levantar ou instalar a imagem e situa naturalmente a ação antes da convocação.
