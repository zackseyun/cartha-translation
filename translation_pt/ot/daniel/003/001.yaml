  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נְבוּכַדְנֶצַּ֣ר מַלְכָּ֗/א עֲבַד֙ צְלֵ֣ם דִּֽי דְהַ֔ב רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֣ין שִׁ֑ת אֲקִימֵ/הּ֙ בְּ/בִקְעַ֣ת דּוּרָ֔א בִּ/מְדִינַ֖ת בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/001.yaml
  text: King Nebuchadnezzar made an image of gold[a], its height sixty cubits and its width six cubits. He set it up in the plain of Dura[b], in the province of Babylon.
translation:
  language: pt
  text: O rei Nabucodonosor fez uma imagem de ouro[a], com sessenta côvados de altura e seis côvados de largura. Ele a ergueu na planície de Dura, na província da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estátua de ouro”. O termo aramaico pode designar uma imagem ou estátua. “Ídolo” também é possível à luz do contexto posterior, mas o texto principal preserva a formulação mais neutra deste versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: O rei
  rationale: 'Em português, o artigo definido antes do título e do nome próprio é natural na narrativa: “O rei Nabucodonosor”.'
- source_word: עֲבַד
  choice: fez
  rationale: O verbo aramaico significa normalmente “fazer”; a escolha é direta e não especifica indevidamente o método de fabricação.
- source_word: צְלֵם
  choice: imagem
  rationale: “Imagem” preserva a amplitude e a neutralidade lexical do termo; “estátua” é possível, enquanto “ídolo” anteciparia a função cultual explicitada depois.
- source_word: דִּי דְהַב
  choice: de ouro
  rationale: A construção indica o material. “De ouro” mantém em aberto se a imagem era de ouro maciço ou revestida de ouro.
- source_word: רוּמֵהּ אַמִּין שִׁתִּין
  choice: com sessenta côvados de altura
  rationale: Expressa naturalmente em português a dimensão vertical indicada pelo aramaico.
- source_word: פְּתָיֵהּ אַמִּין שִׁת
  choice: seis côvados de largura
  rationale: “Largura” é a forma corrente e clara de exprimir a dimensão horizontal.
- source_word: אֲקִימֵהּ
  choice: Ele a ergueu
  rationale: O verbo significa levantar ou instalar. “Ergueu” é conciso, digno e adequado à colocação de uma grande imagem.
- source_word: בְּבִקְעַת
  choice: na planície
  rationale: O substantivo denota uma planície ou vale amplo; “planície” representa bem a provável referência geográfica.
- source_word: דּוּרָא
  choice: Dura
  rationale: O nome próprio do lugar é transliterado de forma tradicional e reconhecível em português.
- source_word: בִּמְדִינַת בָּבֶל
  choice: na província da Babilônia
  rationale: מְדִינָה designa um distrito administrativo; “província da Babilônia” comunica claramente o contexto imperial.
theological_decisions:
- issue: Se צְלֵם deve ser traduzido com linguagem explicitamente religiosa
  choice: imagem
  alternative: estátua; ídolo
  rationale: O versículo descreve o objeto, suas dimensões e sua localização, mas ainda não o chama explicitamente de ídolo. “Imagem” preserva a neutralidade narrativa e permite que o contexto posterior revele sua função.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se “côvado”, unidade antiga tradicional e suficientemente conhecida; a sintaxe explicita as dimensões de modo natural. A nota cultural sobre o côvado presente na camada inglesa estava marcada de maneira inconsistente como [b], sem marcador correspondente no texto; por isso, não foi reproduzida como nota independente.
