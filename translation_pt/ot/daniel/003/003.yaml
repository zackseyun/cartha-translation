  text: בֵּ/אדַ֡יִן מִֽתְכַּנְּשִׁ֡ין אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ֣/א גְדָבְרַיָּ/א֩ דְּתָ֨בְרַיָּ֜/א תִּפְתָּיֵ֗/א וְ/כֹל֙ שִׁלְטֹנֵ֣י מְדִֽינָתָ֔/א לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֣ר מַלְכָּ֑/א ו/קאמין לָ/קֳבֵ֣ל צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/003.yaml
  text: Then the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces were assembled for the dedication of the image that King Nebuchadnezzar had set up, and they stood before the image that Nebuchadnezzar had set up.
translation:
  language: pt
  text: Então os sátrapas, os prefeitos, os governadores, os conselheiros, os tesoureiros, os juízes, os magistrados e todos os oficiais das províncias reuniram-se para a dedicação da imagem[a] que o rei Nabucodonosor havia erguido, e ficaram em pé diante da imagem que Nabucodonosor havia erguido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estátua”. O termo aramaico pode designar uma imagem física ou uma figura monumental.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que dá sequência à narrativa; “Então” é natural e claro em português.
- source_word: מִתְכַּנְּשִׁין
  choice: reuniram-se
  rationale: Expressa o ajuntamento coletivo indicado pela forma participial de valor reflexivo/passivo, com fluidez em português.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: sátrapas
  rationale: Título administrativo persa específico, tradicionalmente transliterado e reconhecível em português.
- source_word: סִגְנַיָּא
  choice: prefeitos
  rationale: Equivalente convencional para uma categoria administrativa, preservando sua distinção dentro da lista.
- source_word: פַחֲוָתָא
  choice: governadores
  rationale: Tradução corrente do título administrativo imperial e distinta de “sátrapas”.
- source_word: אֲדַרְגָּזְרַיָּא
  choice: conselheiros
  rationale: O sentido exato do cargo é incerto; “conselheiros” comunica uma classe de altos funcionários sem alegar precisão excessiva.
- source_word: גְדָבְרַיָּא
  choice: tesoureiros
  rationale: O termo é geralmente entendido como designação de responsáveis pelo tesouro.
- source_word: דְּתָבְרַיָּא
  choice: juízes
  rationale: Equivalente direto e inteligível para os prováveis oficiais judiciais.
- source_word: תִּפְתָּיֵא
  choice: magistrados
  rationale: Preserva a nuance jurídico-administrativa e distingue essa categoria dos juízes.
- source_word: כֹל שִׁלְטֹנֵי מְדִינָתָא
  choice: todos os demais oficiais das províncias
  rationale: A expressão resume as autoridades provinciais; “demais” torna claro em português que o grupo geral complementa a lista anterior, sem alterar seu referente.
- source_word: לַחֲנֻכַּת
  choice: para a dedicação da
  rationale: Indica uma cerimônia formal de dedicação; esta é a expressão portuguesa mais direta e idiomática.
- source_word: צַלְמָא
  choice: imagem
  rationale: Preserva a amplitude do termo aramaico, que pode designar uma imagem física ou figura monumental, bem como sua repetição no versículo.
- source_word: הֲקֵים
  choice: havia erguido
  rationale: Expressa a ação anterior de instalar ou levantar a imagem e soa natural no encadeamento narrativo português.
- source_word: וְקָאמִין לָקֳבֵל
  choice: E ficaram em pé diante de
  rationale: Mantém explicitamente a postura e a posição espacial dos oficiais, em vez de reduzir a expressão a “compareceram”.
