  to: Então os sátrapas, os prefeitos, os governadores, os conselheiros, os tesoureiros, os juízes, os magistrados e todos os oficiais das províncias reuniram-se para a dedicação da imagem[a] que o rei Nabucodonosor havia erguido, e ficaram em pé diante da imagem que Nabucodonosor havia erguido.
