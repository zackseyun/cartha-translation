  text: הֵ֣ן אִיתַ֗י אֱלָהַ֨/נָא֙ דִּֽי אֲנַ֣חְנָא פָֽלְחִ֔ין יָכִ֖ל לְ/שֵׁיזָבוּתַ֑/נָא מִן אַתּ֨וּן נוּרָ֧/א יָקִֽדְתָּ֛/א וּ/מִן יְדָ֥/ךְ מַלְכָּ֖/א יְשֵׁיזִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/017.yaml
  text: If it is so[a], our God whom we serve is able to deliver us from the furnace of blazing fire, and he will deliver us from your hand[c][b], O king.
translation:
  language: pt
  text: Se assim for[a], o nosso Deus, a quem servimos, é capaz de nos livrar da fornalha de fogo ardente[b], e ele nos livrará[c] da tua mão, ó rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Se existe [tal situação]”. A abertura aramaica é idiomática e retoma a punição com que o rei os ameaçou.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “da fornalha de fogo que arde”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “ele talvez nos livre” ou “que ele nos livre”. A forma aramaica admite diferentes entendimentos; o texto principal a toma como uma afirmação confiante sobre o futuro.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן אִיתַי
  choice: Se assim for
  rationale: A combinação aramaica é idiomática e retoma a ameaça do rei. A formulação portuguesa expressa naturalmente a condição sem transformar a frase em mera interjeição.
- source_word: אֱלָהַנָא
  choice: o nosso Deus
  rationale: Reproduz diretamente o substantivo com o sufixo possessivo.
- source_word: דִּי אֲנַחְנָא פָלְחִין
  choice: a quem servimos
  rationale: O verbo aramaico pode indicar serviço prestado com devoção religiosa. “Servimos” conserva a amplitude lexical, enquanto o contexto deixa clara a dimensão de culto.
- source_word: יָכִל
  choice: é capaz
  rationale: Expressa de modo atual e enfático a capacidade divina indicada pelo aramaico.
- source_word: לְשֵׁיזָבוּתַנָא
  choice: de nos livrar
  rationale: O verbo denota resgate ou libertação de um perigo. “Livrar” é natural em português e apropriado ao registro solene da declaração.
- source_word: מִן אַתּוּן נוּרָא יָקִדְתָּא
  choice: da fornalha de fogo ardente
  rationale: 'Mantém os três componentes da expressão: fornalha, fogo e a qualidade de arder, em ordem natural no português moderno.'
- source_word: וּמִן יְדָךְ
  choice: da tua mão
  rationale: Preserva a metáfora semítica da mão como poder ou domínio, mantendo também o singular do texto-fonte.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: Marca claramente o vocativo e conserva o tom formal da resposta dirigida ao monarca.
- source_word: יְשֵׁיזִב
  choice: ele nos livrará
  rationale: O imperfeito aramaico é entendido no texto principal como afirmação confiante de futuro, sem ocultar outras possibilidades gramaticais registradas em nota.
theological_decisions:
- issue: Força do imperfeito final יְשֵׁיזִב
  choice: 'afirmação confiante de futuro: “ele nos livrará”'
  alternative: “ele pode nos livrar” ou “que ele nos livre”
  rationale: O discurso favorece uma confissão ousada diante do rei. A continuação no versículo 18 preserva a tensão ao afirmar a fidelidade dos jovens mesmo que a libertação não ocorra; por isso, esta forma não precisa ser enfraquecida no texto principal, mas a ambiguidade gramatical é indicada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conservam-se o vocativo “ó rei” e a metáfora “da tua mão” por sua força retórica e proximidade com o aramaico; formas excessivamente arcaicas foram evitadas.
