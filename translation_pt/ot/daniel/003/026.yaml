base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/026.yaml
  text: Then Nebuchadnezzar came near to the door of the blazing fiery furnace[a]. He answered and said, “Shadrach, Meshach, and Abed-nego, servants of the Most High God, come out and come here.” Then Shadrach, Meshach[b], and Abed-nego came out from the midst of the fire.
translation:
  language: pt
  text: 'Então Nabucodonosor se aproximou da entrada da fornalha de fogo ardente[a] e disse: “Sadraque, Mesaque e Abede-Nego, servos do Deus Altíssimo, saiam e venham para cá!” Então Sadraque, Mesaque e Abede-Nego saíram do meio do fogo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da entrada da fornalha de fogo que ardia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador aramaico de sequência narrativa; “Então” é natural e mantém o avanço dos acontecimentos.
- source_word: קְרֵב
  choice: se aproximou
  rationale: Expressa com clareza o movimento físico de Nabucodonosor em direção à fornalha.
- source_word: לִתְרַע
  choice: da entrada
  rationale: תְרַע pode indicar porta, portão ou entrada. No contexto de uma fornalha, “entrada” evita sugerir necessariamente uma porta com folha.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: a fornalha de fogo ardente
  rationale: Conserva os três elementos da expressão aramaica — fornalha, fogo e o caráter ardente — em português digno e natural.
- source_word: עָנֵה וְאָמַר
  choice: disse
  rationale: A fórmula semítica literalmente correspondente a “respondeu e disse” funciona aqui como introdução de fala; “disse” comunica naturalmente seu valor sem pressupor uma pergunta anterior.
- source_word: עַבְדֹוהִי
  choice: servos
  rationale: Neste contexto, o termo designa pessoas que pertencem ao serviço de Deus; “servos” preserva esse sentido relacional e reverencial.
- source_word: אֱלָהָא עליא
  choice: Deus Altíssimo
  rationale: Título divino reconhecível e idiomático em português, que mantém a afirmação de supremacia sem acrescentar interpretação doutrinária.
- source_word: פֻּקוּ
  choice: saiam
  rationale: Imperativo plural que ordena a saída da fornalha; “saiam” é a forma direta e natural em português.
- source_word: וֶאֱתוֹ
  choice: venham para cá
  rationale: Segundo imperativo, indicando movimento em direção ao rei; “para cá” torna explícita a orientação dêitica.
- source_word: נָפְקִין
  choice: saíram
  rationale: Relata o cumprimento da ordem e corresponde de modo natural ao imperativo anterior.
- source_word: מִן גּוֹא נוּרָא
  choice: do meio do fogo
  rationale: Preserva a ideia de que os três estavam no interior do fogo, não apenas perto dele.
theological_decisions:
- issue: Tradução do título divino אֱלָהָא עליא
  choice: Deus Altíssimo
  alternative: o Deus Altíssimo
  rationale: A forma sem artigo soa natural como título em português e preserva o reconhecimento da supremacia de Deus feito por Nabucodonosor, sem desenvolver implicações teológicas além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os nomes seguem formas bíblicas correntes. A fórmula aramaica de introdução da fala foi vertida idiomaticamente por “disse”, enquanto a repetição enfática em “fornalha de fogo ardente” foi preservada.
