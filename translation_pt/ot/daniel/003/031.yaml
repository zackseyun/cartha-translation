  text: נְבוּכַדְנֶצַּ֣ר מַלְכָּ֗/א לְֽ/כָל עַֽמְמַיָּ֞/א אֻמַיָּ֧/א וְ/לִשָּׁנַיָּ֛/א דִּֽי דארין בְּ/כָל אַרְעָ֖/א שְׁלָמְ/כ֥וֹן יִשְׂגֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/031.yaml
  text: 'King Nebuchadnezzar[a], to all peoples, nations[b], and languages that dwell in all the earth: May your peace abound.'
translation:
  language: pt
  text: O rei Nabucodonosor, a todos os povos, nações e línguas que habitam em toda a terra:[a] Que a paz de vocês seja abundante.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Em toda a terra» é uma expressão imperial convencional e pode ter sentido retórico, equivalente a «em todo o reino».
    reason: cultural_note
  - marker: b
    text: 'Ou: «Que a paz de vocês se multiplique».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: O rei
  rationale: Em aposição ao nome próprio, forma o título real; em português, «O rei Nabucodonosor» é natural em uma proclamação.
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: a todos os povos, nações e línguas
  rationale: Preserva a tríade administrativa aramaica e sua referência abrangente às populações do império, com vocabulário moderno e claro.
- source_word: דִּי דארין
  choice: que habitam
  rationale: Reproduz a construção relativa com particípio e mantém o tom formal da proclamação.
- source_word: בְּכָל אַרְעָא
  choice: em toda a terra
  rationale: אַרְעָא pode significar «terra» ou «país». A tradução mantém a formulação imperial ampla sem decidir silenciosamente se o alcance é geográfico universal ou retórico.
- source_word: שְׁלָמְכוֹן
  choice: a paz de vocês
  rationale: O termo abrange paz, bem-estar e prosperidade. «Paz» conserva a fórmula semítica de saudação, e «de vocês» oferece leitura amplamente acessível em português.
- source_word: יִשְׂגֵּא
  choice: seja abundante
  rationale: Expressa o desejo de que a paz aumente ou se multiplique, em português atual e digno.
theological_decisions: []
translation_notes:
  register: Proclamação real em português moderno, claro e solene. A ordem «povos, nações e línguas» e a saudação de paz preservam o caráter formular do aramaico. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
