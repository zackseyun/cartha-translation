reference: Daniel 3:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַ֠שְׁרוֹקִיתָ/א קיתרוס סַבְּכָ֤א פְּסַנְתֵּרִין֙ סוּמְפֹּ֣נְיָ֔ה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א תִּפְּל֤וּן וְ/תִסְגְּדוּן֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/005.yaml
  text: At the time when you hear the sound of the horn[a], pipe, lyre, trigon, psaltery, bagpipe, and every kind of music[b], you are to fall down and pay homage to the golden image that King Nebuchadnezzar has set up.
translation:
  language: pt
  text: Quando ouvirem o som da trompa, da flauta, da lira, da harpa triangular, do saltério, da gaita de foles[a] e de todo tipo de música, vocês deverão prostrar-se e prestar homenagem[b] à imagem de ouro que o rei Nabucodonosor ergueu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata deste instrumento é incerta; também se propõe “flauta dupla”.
    reason: lexical_alternative
  - marker: b
    text: Ou “adorar”. O verbo aramaico pode indicar prostrar-se em reverência; neste contexto, a homenagem à imagem tem caráter idolátrico.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעִדָּנָא דִּי
  choice: Quando
  rationale: Expressa naturalmente a construção temporal aramaica sem perder a relação imediata entre o sinal musical e a ordem.
- source_word: תִשְׁמְעוּן קָל
  choice: ouvirem o som
  rationale: Mantém o sentido auditivo e o plural da segunda pessoa, formulado de modo corrente em português.
- source_word: קַרְנָא
  choice: trompa
  rationale: Designação ampla de um instrumento de sopro em forma de chifre, sem especificá-lo indevidamente como chifre de carneiro.
- source_word: מַשְׁרוֹקִיתָא
  choice: flauta
  rationale: Equivalente português claro para um instrumento do tipo tubo ou flauta; evita a acepção moderna mais estreita de 'apito'.
- source_word: קיתרוס
  choice: lira
  rationale: Representa de maneira compreensível o instrumento de cordas relacionado à cítara ou kithara.
- source_word: סַבְּכָא
  choice: harpa triangular
  rationale: Torna inteligível ao leitor comum a identificação tradicional de um instrumento triangular de cordas, embora sua forma exata seja incerta.
- source_word: פְּסַנְתֵּרִין
  choice: saltério
  rationale: Termo tradicional e distinto para o instrumento de cordas, preservando a diferenciação dentro da lista.
- source_word: סוּמְפֹּנְיָה
  choice: gaita de foles
  rationale: É uma identificação moderna comum, mas discutida; a incerteza é explicitada em nota.
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: e de todo tipo de música
  rationale: Reproduz a expressão abrangente que encerra a enumeração.
- source_word: תִּפְּלוּן
  choice: vocês deverão prostrar-se
  rationale: Comunica a força de ordem do imperfeito aramaico no contexto de um decreto real e preserva o gesto corporal de cair diante da imagem.
- source_word: וְתִסְגְּדוּן
  choice: prestar homenagem
  rationale: Expressa reverência ou submissão mediante prostração sem reduzir o verbo, por si só, ao termo teológico 'adorar'.
- source_word: צֶלֶם דַּהֲבָא
  choice: imagem de ouro
  rationale: Equivalente direto e natural, sem decidir se a imagem era inteiramente de ouro ou revestida dele.
- source_word: הֲקֵים
  choice: ergueu
  rationale: Verbo natural para a instalação pública de uma imagem ou estátua.
theological_decisions:
- issue: Sentido de סגד diante de uma imagem idolátrica
  choice: prestar homenagem
  alternative: adorar
  rationale: O verbo indica prostração reverente ou homenagem. O contexto torna o ato idolátrico, mas a tradução preserva a extensão lexical do verbo; a alternativa 'adorar' é registrada em nota para explicitar a força religiosa possível neste contexto.
translation_notes:
  register: 'Português moderno, digno e acessível, com uso de “vocês” para tornar explícita a segunda pessoa do plural. A lista mantém instrumentos distintos, recorrendo a nomes reconhecíveis e assinalando em nota a incerteza mais relevante. Os marcadores aparecem junto aos termos a que se referem, embora a ordem [b] antes de [a] no texto tenha sido evitada? Não: no texto atual [b] precede [a]; editorialmente, convém renumerar em ordem de ocorrência na composição final.'
