source:
  edition: WLC
  text: בֵּ/אדַ֜יִן גֻּבְרַיָּ֣/א אִלֵּ֗ךְ כְּפִ֨תוּ֙ בְּ/סַרְבָּלֵי/הוֹן֙ פטישי/הון וְ/כַרְבְּלָתְ/ה֖וֹן וּ/לְבֻשֵׁי/ה֑וֹן וּ/רְמִ֕יו לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/021.yaml
  text: Then these men were bound in their trousers[a], their tunics, their cloaks, and their other garments[b], and they were thrown into the midst of the blazing furnace.
translation:
  language: pt
  text: Então, esses homens foram amarrados, ainda vestidos com suas calças, túnicas[a], mantos e outras roupas, e foram lançados no meio da fornalha ardente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “turbantes”. A palavra aramaica é rara, e não se sabe ao certo a que peça de vestuário ela se refere.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a fornalha de fogo ardente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que introduz o acontecimento seguinte; “Então” mantém com naturalidade a sequência narrativa.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: esses homens
  rationale: O substantivo plural com demonstrativo retoma os três judeus já mencionados. “Esses homens” é claro e natural em português.
- source_word: כְּפִתוּ
  choice: foram amarrados
  rationale: A forma verbal indica que eles foram presos ou atados antes de serem lançados na fornalha. “Amarrados” é corrente e comunica concretamente a ação.
- source_word: סַרְבָּלֵיהוֹן
  choice: suas calças
  rationale: Empréstimo persa geralmente entendido como peça que cobria a parte inferior do corpo. “Calças” representa o referente provável sem recorrer ao tradicional e menos preciso “túnicas” ou “mantos”.
- source_word: פטישי/הון
  choice: túnicas
  rationale: O termo é raro e seu referente exato é incerto. No contexto da lista de vestimentas, “túnicas” é uma opção legível e cautelosa; a alternativa “turbantes” é registrada em nota.
- source_word: כַרְבְּלָתְהוֹן
  choice: mantos
  rationale: O termo parece indicar uma veste exterior ou peça usada por cima das demais. “Mantos” distingue essa peça das calças e das túnicas.
- source_word: לְבֻשֵׁיהוֹן
  choice: outras roupas
  rationale: É um termo geral para vestuário. Como peças específicas já foram enumeradas, “outras roupas” expressa sua função abrangente na lista.
- source_word: וּרְמִיו
  choice: e foram lançados
  rationale: No contexto narrativo, os homens recebem a ação de serem atirados por outros. A construção passiva preserva o foco sobre eles.
- source_word: לְגוֹא
  choice: no meio de
  rationale: A expressão aponta para o interior, ou meio, da fornalha, e não apenas para o movimento de entrada.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: a fornalha ardente
  rationale: A expressão aramaica acumula os termos “fornalha”, “fogo” e “ardente”. “Fornalha ardente” preserva a intensidade da imagem em português natural, enquanto a forma literal é indicada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A expressão “ainda vestidos com” torna explícita a relação contextual entre o ato de amarrar e a enumeração das roupas, sem eliminar a incerteza lexical do segundo item.
