source:
  edition: WLC
  text: עָנֵ֨ה נְבֽוּכַדְנֶצַּ֜ר וְ/אָמַ֗ר בְּרִ֤יךְ אֱלָהֲ/הוֹן֙ דִּֽי שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ דִּֽי שְׁלַ֤ח מַלְאֲכֵ/הּ֙ וְ/שֵׁיזִ֣ב לְ/עַבְד֔וֹ/הִי דִּ֥י הִתְרְחִ֖צוּ עֲל֑וֹ/הִי וּ/מִלַּ֤ת מַלְכָּ/א֙ שַׁנִּ֔יו וִ/יהַ֣בוּ גשמי/הון דִּ֠י לָֽא יִפְלְח֤וּן וְ/לָֽא יִסְגְּדוּן֙ לְ/כָל אֱלָ֔הּ לָהֵ֖ן לֵ/אלָֽהֲ/הֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/028.yaml
  text: Nebuchadnezzar answered and said[a], “Blessed be the God of Shadrach, Meshach, and Abed-nego, who sent his angel and delivered his servants, who trusted in him, and set aside the king’s command, and gave up their bodies[c][b], that they might not serve or worship any god except their own God.”
translation:
  language: pt
  text: 'Nabucodonosor respondeu e disse: “Bendito seja o Deus de Sadraque, Mesaque e Abede-Nego, que enviou o seu anjo[a] e livrou os seus servos, os quais confiaram nele, deixaram de lado a ordem do rei[b] e entregaram seus corpos, para não servirem nem adorarem[c] nenhum deus, a não ser o Deus deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”. O termo aramaico pode ter os dois sentidos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “mudaram a palavra do rei”; isto é, recusaram-se a cumprir a ordem dele.
    reason: lexical_alternative
  - marker: c
    text: Ou “se prostrarem diante de”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: respondeu e disse
  rationale: Preserva a fórmula narrativa aramaica que introduz uma declaração solene, mesmo sem uma pergunta explícita anterior.
- source_word: בְּרִיךְ
  choice: Bendito seja
  rationale: Mantém a força de bênção e louvor da forma predicativa.
- source_word: אֱלָהֲהוֹן
  choice: o Deus de Sadraque, Mesaque e Abede-Nego
  rationale: O sufixo é explicitado pelos três nomes que vêm em seguida.
- source_word: שְׁלַח מַלְאֲכֵהּ
  choice: enviou o seu anjo
  rationale: מַלְאָךְ pode significar anjo ou mensageiro; no contexto de livramento sobrenatural, 'anjo' é a leitura mais natural, sem identificar mais especificamente a figura.
- source_word: וְשֵׁיזִב
  choice: livrou
  rationale: Expressa resgate de um perigo concreto e conserva a dicção bíblica natural em português.
- source_word: לְעַבְדוהִי
  choice: os seus servos
  rationale: No contexto de lealdade e culto, 'servos' é idiomático e adequado ao referente.
- source_word: הִתְרְחִצוּ עֲלֹוהִי
  choice: confiaram nele
  rationale: Comunica de modo claro o ato de depositar confiança ou depender de alguém.
- source_word: וּמִלַּת מַלְכָּא שַׁנִּיו
  choice: deixaram de lado a ordem do rei
  rationale: A expressão significa literalmente que mudaram a palavra do rei; no contexto, indica que não acataram sua ordem, sem sugerir que alteraram o texto do decreto.
- source_word: וִיהַבוּ גֶּשְׁמֵיהוֹן
  choice: entregaram o próprio corpo
  rationale: Retrata a disposição de expor o corpo ao sofrimento e à morte em vez de praticar idolatria; o singular distributivo é natural em português.
- source_word: לָא יִפְלְחוּן
  choice: não servirem
  rationale: O verbo denota serviço prestado a uma divindade.
- source_word: וְלָא יִסְגְּדוּן
  choice: nem adorarem
  rationale: No contexto religioso e em paralelo com 'servir', comunica claramente o ato de prostração cultual.
- source_word: לָהֵן
  choice: a não ser
  rationale: Marca com naturalidade a única exceção à recusa de servir e adorar outros deuses.
theological_decisions:
- issue: Identidade de מַלְאֲכֵהּ no relato do livramento
  choice: o seu anjo
  alternative: o seu mensageiro; uma identificação cristológica mais específica
  rationale: O termo aramaico admite 'anjo' ou 'mensageiro'. O contexto favorece 'anjo', mas o versículo não exige uma identificação teológica mais específica; a nota preserva a alternativa lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula narrativa e a linguagem de louvor foram preservadas sem rigidez excessiva; as ambiguidades lexicais relevantes aparecem em notas.
