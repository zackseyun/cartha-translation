  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָשֹׁ֤ב אַרְצ/וֹ֙ בִּ/רְכ֣וּשׁ גָּד֔וֹל וּ/לְבָב֖/וֹ עַל בְּרִ֣ית קֹ֑דֶשׁ וְ/עָשָׂ֖ה וְ/שָׁ֥ב לְ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/028.yaml
  text: Then he will return to his land with great wealth[a], but his heart will be against the holy covenant[b]; and he will act and return to his land.
translation:
  language: pt
  text: Então ele voltará para a sua terra com grandes riquezas[a], mas seu coração estará contra a santa aliança; ele agirá e voltará para a sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com muitos bens”; o termo hebraico pode indicar propriedades, bens ou riquezas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב
  choice: Então ele voltará
  rationale: O qal imperfeito de שוב indica o próximo movimento da sequência. “Então” expressa naturalmente a progressão narrativa em português.
- source_word: אַרְצוֹ
  choice: para a sua terra
  rationale: אֶרֶץ pode significar “terra” ou “país”; “terra” mantém o tom geopolítico e a formulação tradicional sem perder clareza.
- source_word: בִּרְכוּשׁ גָּדוֹל
  choice: com grandes riquezas
  rationale: רְכוּשׁ abrange bens, posses e riqueza. “Grandes riquezas” é natural e não especifica indevidamente que se trate de despojo.
- source_word: וּלְבָבוֹ עַל
  choice: mas seu coração estará contra
  rationale: A construção descreve uma disposição interior hostil. “Mas” explicita o contraste contextual, enquanto “seu coração estará contra” preserva a imagem e a relativa concisão do hebraico.
- source_word: בְּרִית קֹדֶשׁ
  choice: a santa aliança
  rationale: Preserva diretamente os conceitos de aliança e santidade, sem reduzir a expressão a uma religião, instituição ou grupo específico.
- source_word: וְעָשָׂה
  choice: ele agirá
  rationale: עשה é amplo (“fazer, agir”) e não apresenta objeto expresso. “Agirá” conserva a indeterminação e a concisão do texto.
- source_word: וְשָׁב לְאַרְצוֹ
  choice: e voltará para a sua terra
  rationale: A repetição de שוב é mantida, destacando a volta à sua terra depois da ação contra a aliança.
theological_decisions:
- issue: Referente de “a santa aliança”
  choice: Manter a linguagem de aliança sem explicação interpretativa no corpo do texto.
  alternative: A religião judaica; o povo ou a ordem da aliança de Deus.
  rationale: Embora o contexto possa apontar para a ordem da aliança ligada ao povo santo, o hebraico diz “aliança santa”. A tradução preserva essa categoria teológica e sua amplitude.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Mantém-se a repetição de “voltará” e a formulação deliberadamente genérica “agirá”. O marcador [a] aparece no texto; não se acrescentou nota em “santa aliança”, pois a alternativa inglesa fornecida apenas repete a redação principal e não representa uma variante real.
