  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֶ/אֱלֹ֨הַּ֙ מָֽעֻזִּ֔ים עַל כַּנּ֖/וֹ יְכַבֵּ֑ד וְ/לֶ/אֱל֜וֹהַּ אֲשֶׁ֧ר לֹא יְדָעֻ֣/הוּ אֲבֹתָ֗י/ו יְכַבֵּ֛ד בְּ/זָהָ֥ב וּ/בְ/כֶ֛סֶף וּ/בְ/אֶ֥בֶן יְקָרָ֖ה וּ/בַ/חֲמֻדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/038.yaml
  text: Instead[a], he will honor a god of fortresses in his place; he will honor a god whom his fathers did not know with gold, silver, precious stones[c][b], and desirable things.
translation:
  language: pt
  text: Em vez disso, honrará um deus das fortalezas[a] em seu lugar;[b] honrará com ouro, prata, pedras preciosas e objetos valiosos[c] um deus que seus antepassados não conheceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um deus dos lugares fortificados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sobre sua base” ou “sobre seu pedestal”. A expressão é difícil e também pode significar “em lugar dele”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “coisas preciosas” ou “tesouros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֶאֱלֹהַּ
  choice: Em vez disso, ... um deus
  rationale: A conjunção prefixada, junto da construção com ל, introduz aqui um contraste com o versículo anterior. “Em vez disso” expressa esse valor discursivo em português claro.
- source_word: מָעֻזִּים
  choice: fortalezas
  rationale: O plural designa lugares fortificados ou defensivos. “Fortalezas” é natural em português e se ajusta ao contexto militar do capítulo, sem identificar o deus mencionado.
- source_word: עַל־כַּנּוֹ
  choice: em seu lugar
  rationale: A expressão é difícil e sintaticamente condensada. “Em seu lugar” conserva a provável noção de substituição sem determinar de modo indevido o referente do pronome; a nota registra a leitura espacial mais literal.
- source_word: יְכַבֵּד
  choice: honrará
  rationale: O piel de כבד significa aqui honrar ou glorificar. “Honrará” é conciso, digno e adequado nas duas ocorrências.
- source_word: וְלֶאֱלוֹהַּ אֲשֶׁר לֹא יְדָעֻהוּ אֲבֹתָיו
  choice: um deus que seus antepassados não conheceram
  rationale: A oração descreve uma divindade desconhecida pela linhagem ancestral do personagem. “Antepassados” comunica melhor esse sentido em português atual do que “pais”, que poderia ser entendido apenas como os progenitores imediatos.
- source_word: בְּזָהָב וּבְכֶסֶף
  choice: com ouro, prata
  rationale: A preposição ב tem valor instrumental ou associativo; “com” expressa naturalmente os bens por meio dos quais o deus é honrado.
- source_word: וּבְאֶבֶן יְקָרָה
  choice: pedras preciosas
  rationale: Embora אבן esteja no singular, a expressão admite sentido coletivo. O plural é idiomático em português nesta enumeração de bens valiosos.
- source_word: וּבַחֲמֻדוֹת
  choice: objetos valiosos
  rationale: O substantivo abrange coisas desejáveis, preciosas ou estimadas. “Objetos valiosos” é claro e mantém a amplitude sem restringir o termo a tesouros ou presentes.
theological_decisions:
- issue: Identidade e natureza do “deus das fortalezas”
  choice: Manter a descrição indefinida “um deus das fortalezas”.
  alternative: Identificá-lo como uma divindade histórica específica, um deus da guerra ou a própria força militar personificada.
  rationale: O hebraico não fornece neste versículo dados suficientes para uma identificação específica. A tradução preserva a ambiguidade histórica e teológica.
- issue: Sentido de עַל־כַּנּוֹ
  choice: Traduzir “em seu lugar”.
  alternative: “sobre sua base/seu pedestal” ou “em lugar dele”.
  rationale: A expressão é debatida. A formulação escolhida mantém tanto quanto possível a noção provável de substituição sem fixar o referente, e a nota conserva a alternativa espacial literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi levemente ajustada para clareza, sem eliminar a repetição de “honrará” nem as ambiguidades do hebraico.
