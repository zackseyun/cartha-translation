  naturalness: O português é moderno, claro e de registro apropriado. “Quatro ventos do céu” é a forma mais idiomática e tradicionalmente reconhecível da expressão, preservando plenamente o hebraico.
  terminology: “Reino”, “descendentes”, “domínio” e “arrancado pela raiz” são escolhas adequadas. A nota sobre descendentes preserva corretamente a amplitude de אַחֲרִיתוֹ, sem impor uma identificação histórica ou dinástica mais estreita do que o contexto permite.
