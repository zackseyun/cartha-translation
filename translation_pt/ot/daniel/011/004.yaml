source:
  edition: WLC
  text: וּ/כְ/עָמְד/וֹ֙ תִּשָּׁבֵ֣ר מַלְכוּת֔/וֹ וְ/תֵחָ֕ץ לְ/אַרְבַּ֖ע רוּח֣וֹת הַ/שָּׁמָ֑יִם וְ/לֹ֣א לְ/אַחֲרִית֗/וֹ וְ/לֹ֤א כְ/מָשְׁל/וֹ֙ אֲשֶׁ֣ר מָשָׁ֔ל כִּ֤י תִנָּתֵשׁ֙ מַלְכוּת֔/וֹ וְ/לַ/אֲחֵרִ֖ים מִ/לְּ/בַד אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/004.yaml
  text: And as soon as he has arisen[a], his kingdom will be broken and divided toward the four winds of heaven, but not to his posterity, and not according to the dominion with which he ruled[b]; for his kingdom will be uprooted and given to others besides these.
translation:
  language: pt
  text: Assim que ele se estabelecer, seu reino será quebrado e dividido em direção aos quatro ventos do céu[a], mas não passará aos seus descendentes[b], nem será conforme ao domínio que ele exerceu; pois seu reino será arrancado pela raiz e entregue a outros, além desses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Os quatro ventos do céu” é uma expressão hebraica que indica todas as direções, isto é, os quatro pontos cardeais.
    reason: cultural_note
  - marker: b
    text: Ou “aos que vierem depois dele”. A expressão hebraica pode designar sua posteridade ou seus sucessores na dinastia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעָמְדוֹ
  choice: Assim que ele se estabelecer
  rationale: A construção temporal com עמד se refere, neste contexto, ao estabelecimento do rei no poder. “Assim que” comunica a rápida sequência entre sua ascensão e a queda do reino.
- source_word: תִּשָּׁבֵר מַלְכוּתוֹ
  choice: seu reino será quebrado
  rationale: O nifal de שבר indica que o reino será desfeito ou quebrado; “quebrado” preserva de modo direto a imagem hebraica.
- source_word: וְתֵחָץ
  choice: e repartido
  rationale: O verbo descreve a divisão do reino em partes. “Repartido” expressa tanto a divisão quanto a distribuição subsequente.
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: em direção aos quatro ventos dos céus
  rationale: Mantém a imagem direcional hebraica, que aponta para os quatro rumos ou pontos cardeais, sem substituí-la pela explicação.
- source_word: וְלֹא לְאַחֲרִיתוֹ
  choice: mas não passará aos seus descendentes
  rationale: אַחֲרִיתוֹ significa literalmente aquilo ou aqueles que vêm depois dele. No contexto de sucessão real, refere-se naturalmente à sua descendência ou posteridade; “passará” explicita de forma mínima a transferência do reino já indicada pelo contexto.
- source_word: וְלֹא כְמָשְׁלוֹ אֲשֶׁר מָשָׁל
  choice: nem conservará o domínio que ele exerceu
  rationale: A expressão cognata מָשְׁלוֹ ... מָשָׁל enfatiza o domínio exercido pelo rei. A formulação portuguesa comunica que o reino dividido não manterá a força ou extensão de seu governo.
- source_word: תִנָּתֵשׁ מַלְכוּתוֹ
  choice: seu reino será arrancado pela raiz
  rationale: נתש apresenta a imagem de algo removido à força desde a raiz; a expressão portuguesa preserva a metáfora e sua intensidade.
- source_word: וְלַאֲחֵרִים מִלְּבַד אֵלֶּה
  choice: e entregue a outros, além desses
  rationale: O hebraico diz literalmente “e para outros além desses”. O verbo “entregue” é uma complementação contextual mínima que torna clara a transferência do reino.
theological_decisions:
- issue: Identificação histórica do rei e dos destinatários do reino
  choice: Manter a descrição sem identificar no texto traduzido o rei ou os poderes que recebem seu reino.
  alternative: Inserir nomes históricos ou interpretar explicitamente a divisão como referência a governantes específicos.
  rationale: O versículo descreve a ruptura e a redistribuição do reino, mas não fornece aqui essas identificações. Acrescentá-las ao texto resolveria além do que o hebraico afirma.
- issue: Sentido dinástico de אַחֲרִיתוֹ
  choice: Traduzir no texto como “seus descendentes”, registrando em nota a amplitude literal da expressão.
  alternative: Traduzir literalmente como “seu fim” ou, de modo mais amplo, “seus sucessores”.
  rationale: O contexto político favorece uma referência à descendência dinástica, mas a nota preserva a extensão semântica da expressão hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A imagem dos “quatro ventos dos céus” e a metáfora de arrancar pela raiz foram preservadas; expansões mínimas foram usadas apenas para clareza sintática.
