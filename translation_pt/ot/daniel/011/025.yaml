  text: וְ/יָעֵר֩ כֹּח֨/וֹ וּ/לְבָב֜/וֹ עַל מֶ֣לֶךְ הַ/נֶּגֶב֮ בְּ/חַ֣יִל גָּדוֹל֒ וּ/מֶ֣לֶךְ הַ/נֶּ֗גֶב יִתְגָּרֶה֙ לַ/מִּלְחָמָ֔ה בְּ/חַֽיִל גָּד֥וֹל וְ/עָצ֖וּם עַד מְאֹ֑ד וְ/לֹ֣א יַעֲמֹ֔ד כִּֽי יַחְשְׁב֥וּ עָלָ֖י/ו מַחֲשָׁבֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/025.yaml
  text: And he will stir up his power and his heart against the king of the South with a great army[a], and the king of the South will engage in battle with a very great and mighty army, but he will not stand[b], for they will devise schemes against him.
translation:
  language: pt
  text: Ele mobilizará sua força e sua coragem contra o rei do Sul, com um grande exército. O rei do Sul entrará em combate com um exército muito grande e extremamente poderoso; contudo, não resistirá[a], pois tramarão planos contra ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não prevalecerá” ou “não conseguirá manter sua posição”. O hebraico diz literalmente “não ficará de pé”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “conspirarão contra ele”. O hebraico emprega uma construção com palavras da mesma raiz, literalmente: “pensarão pensamentos contra ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָעֵר כֹּחוֹ וּלְבָבוֹ
  choice: mobilizará sua força e sua coragem
  rationale: O hifil de עור expressa despertar ou pôr em ação. No contexto militar, “mobilizará” comunica naturalmente essa ativação. לְבָבוֹ significa literalmente “seu coração”, mas aqui designa a disposição interior ou coragem; a tradução explicita esse sentido contextual sem reduzir a expressão apenas a capacidade militar.
- source_word: עַל מֶלֶךְ הַנֶּגֶב
  choice: contra o rei do Sul
  rationale: Em Daniel 11, נֶגֶב funciona como designação geopolítica direcional. “Sul” é claro e tradicional em português, sem identificar no texto um reino específico.
- source_word: בְּחַיִל גָּדוֹל
  choice: com um grande exército
  rationale: חַיִל, neste contexto bélico, refere-se a forças militares; “exército” é a forma mais natural e específica em português.
- source_word: יִתְגָּרֶה לַמִּלְחָמָה
  choice: entrará em combate
  rationale: O hitpael de גרה descreve envolver-se ou lançar-se no conflito. “Entrará em combate” é atual, claro e mantém a ação militar sem a formulação pouco natural “incitará a si mesmo”.
- source_word: בְּחַיִל גָּדוֹל וְעָצוּם עַד מְאֹד
  choice: com um exército muito grande e extremamente poderoso
  rationale: A tradução conserva tanto a grandeza quanto a força do exército e representa a intensificação de עַד מְאֹד.
- source_word: וְלֹא יַעֲמֹד
  choice: contudo, não resistirá
  rationale: O hebraico diz literalmente “não ficará de pé”, idioma que neste contexto indica não conseguir manter-se ou prevalecer. “Não resistirá” comunica o sentido naturalmente, enquanto a nota preserva a imagem literal.
- source_word: יַחְשְׁבוּ עָלָיו מַחֲשָׁבוֹת
  choice: tramarão planos contra ele
  rationale: A construção cognata significa literalmente “pensarão pensamentos contra ele”, mas expressa a elaboração hostil de planos. “Tramarão planos” preserva a ideia de conspiração e a referência explícita aos planos.
