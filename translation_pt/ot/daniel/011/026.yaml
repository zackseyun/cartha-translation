source:
  edition: WLC
  text: וְ/אֹכְלֵ֧י פַת בָּג֛/וֹ יִשְׁבְּר֖וּ/הוּ וְ/חֵיל֣/וֹ יִשְׁט֑וֹף וְ/נָפְל֖וּ חֲלָלִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/026.yaml
  text: Those who eat his food will break him[a], and his army will be swept away[c][b], and many slain will fall.
translation:
  language: pt
  text: Os que comem das suas provisões[a] o levarão à ruína[b]; seu exército será arrastado como por uma enxurrada[c], e muitos cairão mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que comem do seu alimento”. A expressão se refere a associados próximos ou dependentes sustentados pelo rei, que o traem por dentro.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o quebrarão”, metáfora para causar sua ruína.'
    reason: lexical_alternative
  - marker: c
    text: 'O verbo hebraico evoca uma inundação: o exército “transbordará” ou “será arrastado” como por uma enxurrada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכְלֵי פַת בָּגוֹ
  choice: os que comem das suas provisões
  rationale: A expressão designa pessoas sustentadas pelos recursos do rei, provavelmente integrantes próximos de sua corte ou dependentes. “Provisões” comunica a ideia de alimento fornecido por ele sem acrescentar explicitamente “mesa”, palavra que não aparece no hebraico.
- source_word: יִשְׁבְּרוּהוּ
  choice: o levarão à ruína
  rationale: O verbo שׁבר significa literalmente “quebrar”, mas aqui descreve figuradamente a derrocada do rei provocada por gente próxima. A formulação escolhida é natural em português, enquanto a nota preserva a metáfora hebraica.
- source_word: חֵילוֹ
  choice: seu exército
  rationale: Neste contexto militar, חַיִל se refere à força armada, e “exército” é a opção mais clara e corrente.
- source_word: יִשְׁטוֹף
  choice: será arrastado como por uma enxurrada
  rationale: O verbo evoca água que transborda e arrasta o que encontra. A tradução comunica tanto a imagem de inundação quanto a derrota avassaladora do exército, preservando na nota a amplitude verbal do hebraico.
- source_word: וְנָפְלוּ חֲלָלִים רַבִּים
  choice: e muitos cairão mortos
  rationale: חֲלָלִים são pessoas mortas ou mortalmente feridas em combate. “Muitos cairão mortos” é idiomático, direto e mantém a formulação marcante do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A tradução explicita idiomaticamente a ruína do rei, enquanto as notas conservam a metáfora de “quebrar”, o sentido cortesão da alimentação fornecida e a imagem ambígua de inundação ligada ao exército.
