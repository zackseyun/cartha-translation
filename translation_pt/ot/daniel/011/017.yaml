base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/017.yaml
  text: He will set his face to come with the strength of his whole kingdom[a], and upright terms will be with him; and he will act. He will give him the daughter of women to destroy it, but she will not stand[d][c][b], and she will not be for him.
translation:
  language: pt
  text: Ele se disporá a vir com as forças de todo o seu reino; homens íntegros estarão com ele[a], e agirá. Dará a ele a filha das mulheres[b] para destruí-la[c]; mas ela não se manterá firme[d], nem será para ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e condições justas estarão com ele”, ou: “e fará um acordo com ele”. A expressão hebraica, literalmente “retos” ou “íntegros”, é difícil neste contexto e pode indicar pessoas que o acompanham ou condições e acordos equitativos.'
    reason: alternative_reading
  - marker: b
    text: Em hebraico, “a filha das mulheres”, provavelmente uma princesa dada em casamento; muitos entendem a expressão, historicamente, como referência a uma aliança política por casamento.
    reason: cultural_note
  - marker: c
    text: O sufixo hebraico em “destruí-la” é feminino singular e pode referir-se à mulher (“arruiná-la”) ou a um antecedente feminino implícito no contexto, como um reino ou um plano.
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “mas isso não se manterá firme” ou “mas ela não terá êxito”. O verbo feminino pode referir-se à mulher ou ao plano.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשֵׂם פָּנָיו
  choice: Ele decidirá
  rationale: A expressão hebraica significa voltar-se resolutamente para uma ação. Em português atual, “decidirá” comunica a determinação sem conservar um decalque pouco natural.
- source_word: לָבוֹא
  choice: vir
  rationale: Mantém o sentido amplo de בוא, sem explicitar interpretativamente “invadir”.
- source_word: בְּתֹקֶף כָּל מַלְכוּתוֹ
  choice: com a força de todo o seu reino
  rationale: Reproduz diretamente a ideia de mobilizar a força ou os recursos do reino inteiro.
- source_word: וִישָׁרִים עִמּוֹ
  choice: levando consigo homens íntegros
  rationale: Preserva no texto principal o sentido lexical de יְשָׁרִים como pessoas retas, embora a expressão seja difícil e possa indicar condições justas ou um acordo; essa alternativa é registrada em nota.
- source_word: וְעָשָׂה
  choice: e agirá
  rationale: Conserva a amplitude semântica de עשה sem especificar uma ação que o hebraico deixa aberta.
- source_word: וּבַת הַנָּשִׁים
  choice: a filha das mulheres
  rationale: Mantém a expressão hebraica incomum no texto, deixando sua provável referência dinástica para a nota.
- source_word: יִתֶּן לוֹ
  choice: Dará a ele
  rationale: Preserva a transferência e o destinatário masculino expressos no hebraico.
- source_word: לְהַשְׁחִיתָהּ
  choice: para destruí-la
  rationale: O sufixo é feminino singular. O pronome português conserva a referência feminina, ainda que seu antecedente possa ser a mulher ou outra realidade feminina implícita.
- source_word: וְלֹא תַעֲמֹד
  choice: mas ela não permanecerá
  rationale: Mantém o verbo feminino e seu sentido básico de permanecer ou manter-se, sem decidir se o referente é a mulher ou o plano.
- source_word: וְלֹא לוֹ תִהְיֶה
  choice: nem ficará do lado dele
  rationale: Expressa naturalmente a relação de não estar a favor dele, adequada ao contexto político e matrimonial, embora o hebraico também possa sugerir posse ou pertencimento.
