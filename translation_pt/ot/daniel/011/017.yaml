revisions:
- from: Ele decidirá vir com a força de todo o seu reino, levando consigo homens íntegros[a], e agirá. Dará a ele a filha das mulheres[b] para destruí-la[c]; mas ela não permanecerá[d] nem ficará do lado dele.
  to: Ele se disporá a vir com as forças de todo o seu reino; homens íntegros estarão com ele[a], e agirá. Dará a ele a filha das mulheres[b] para destruí-la[c]; mas ela não se manterá firme[d], nem será para ele.
  rationale: A revisão preserva as ambiguidades sintáticas e referenciais do hebraico onde o português permite fazê-lo, elimina a restrição interpretativa da última cláusula e torna mais direta a representação de «íntegros estarão com ele». As notas mantêm as alternativas relevantes sem identificar historicamente as personagens nem impor uma leitura doutrinária.
  reviewer_model: gpt-5.6-terra
