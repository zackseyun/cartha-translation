source:
  edition: WLC
  text: וְ/גַ֣ם אֱֽלֹהֵי/הֶ֡ם עִם נְסִֽכֵי/הֶם֩ עִם כְּלֵ֨י חֶמְדָּתָ֜/ם כֶּ֧סֶף וְ/זָהָ֛ב בַּ/שְּׁבִ֖י יָבִ֣א מִצְרָ֑יִם וְ/הוּא֙ שָׁנִ֣ים יַעֲמֹ֔ד מִ/מֶּ֖לֶךְ הַ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/008.yaml
  text: He will also carry off to Egypt their gods[a], with their cast images and with their precious vessels of silver and gold, as plunder; and for some years he will stand aloof from the king of the north.
translation:
  language: pt
  text: Levará também para o Egito, como despojo, os deuses deles, juntamente com suas imagens fundidas e seus objetos preciosos de prata e ouro; e, por alguns anos, se manterá afastado do rei do norte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por alguns anos, ele continuará por mais tempo do que o rei do norte”; ou: “durante anos, permanecerá mais forte do que o rei do norte”. A frase hebraica é condensada, e a preposição pode ser entendida em sentido comparativo, em vez de indicar afastamento.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: também
  rationale: Preserva de modo conciso e natural a força aditiva e enfática da expressão.
- source_word: אֱלֹהֵיהֶם
  choice: os deuses deles
  rationale: Traduz diretamente o plural com sufixo possessivo, sem acrescentar ao texto principal a interpretação explícita de que sejam ídolos.
- source_word: נְסִכֵיהֶם
  choice: suas imagens fundidas
  rationale: Refere-se, neste contexto, a imagens produzidas por fundição; a formulação é clara em português moderno e mantém a referência ao modo de fabricação.
- source_word: כְּלֵי חֶמְדָּתָם
  choice: seus objetos preciosos
  rationale: כְּלֵי é abrangente e pode designar recipientes, utensílios ou outros objetos; 'objetos' evita especificidade indevida, enquanto 'preciosos' expressa o valor indicado por חֶמְדָּה.
- source_word: כֶּסֶף וְזָהָב
  choice: de prata e ouro
  rationale: Liga naturalmente os materiais aos objetos preciosos e reproduz a enumeração hebraica.
- source_word: בַּשְּׁבִי
  choice: como despojo
  rationale: No contexto de bens tomados em campanha militar, comunica a ideia de espólio capturado melhor do que uma expressão associada ao cativeiro de pessoas.
- source_word: יָבִא מִצְרָיִם
  choice: levará para o Egito
  rationale: O hifil de בוא significa fazer ir ou trazer; com bens apreendidos e destino explícito, 'levará para o Egito' é natural e conserva o transporte do despojo.
- source_word: שָׁנִים
  choice: por alguns anos
  rationale: O plural é indefinido; 'alguns' torna idiomática a duração sem especificar um número ausente do hebraico.
- source_word: יַעֲמֹד מִן
  choice: se manterá afastado de
  rationale: Preserva a imagem de permanecer ou manter-se em separação, sem explicitar demais a possível implicação militar de não atacar.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: rei do norte
  rationale: É a tradução direta e estabelecida do título geopolítico no contexto de Daniel 11.
theological_decisions:
- issue: Sentido de וְהוּא שָׁנִים יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  choice: Por alguns anos, ele se manterá afastado do rei do norte
  alternative: 'Por alguns anos, ele continuará mais do que o rei do norte; ou: durante anos, permanecerá mais forte do que o rei do norte'
  rationale: A construção é sintaticamente condensada. O texto principal mantém a imagem verbal de עמד com מן como afastamento ou não envolvimento, enquanto a nota conserva as leituras comparativas plausíveis sem decidir dogmaticamente entre elas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para apresentar naturalmente o destino e a condição do despojo. O pronome possessivo foi alternado entre 'deles' e 'suas' para evitar ambiguidade e repetição excessiva. A nota foi colocada após a oração ambígua à qual efetivamente se refere.
