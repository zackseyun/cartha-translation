  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִן הַ/מַּשְׂכִּילִ֣ים יִכָּֽשְׁל֗וּ לִ/צְר֥וֹף בָּ/הֶ֛ם וּ/לְ/בָרֵ֥ר וְ/לַ/לְבֵּ֖ן עַד עֵ֣ת קֵ֑ץ כִּי ע֖וֹד לַ/מּוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/035.yaml
  text: And some of those who have insight will stumble[a], so that they may be refined among them, purified, and made white, until the time of the end[d][c][b]; for it is still for the appointed time.
translation:
  language: pt
  text: Alguns dos que têm discernimento tropeçarão[a], para serem refinados entre eles[b], purificados e tornados brancos[c], até o tempo do fim; pois o tempo determinado ainda está por vir[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cairão”. O verbo hebraico conserva a imagem de tropeçar e pode indicar queda ou derrota causada por perseguição ou provação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “neles” ou “por meio deles”. A expressão hebraica é concisa e pode indicar que a refinação ocorre dentro desse grupo ou por meio do que acontece com seus integrantes.'
    reason: lexical_alternative
  - marker: c
    text: “Tornados brancos” traduz literalmente a imagem hebraica e expressa limpeza ou purificação.
    reason: lexical_alternative
  - marker: d
    text: 'Mais literalmente: “pois ainda é para o tempo determinado”. A cláusula hebraica é elíptica.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הַמַּשְׂכִּילִים
  choice: Alguns dos que têm discernimento
  rationale: מִן tem sentido partitivo neste contexto, e o particípio הַמַּשְׂכִּילִים designa pessoas perspicazes ou instruídas. A formulação preserva a ideia de discernimento sem reduzir o grupo simplesmente aos “sábios”.
- source_word: יִכָּשְׁלוּ
  choice: tropeçarão
  rationale: O verbo כשל mantém a imagem de tropeçar, que pode abranger queda, derrota ou sofrimento sem determinar qual deles está em primeiro plano.
- source_word: לִצְרוֹף
  choice: para serem refinados
  rationale: צרף pertence ao campo da refinação de metais. A construção final expressa o propósito ou resultado do tropeço, sem desenvolver uma doutrina mais ampla do sofrimento.
- source_word: בָּהֶם
  choice: entre eles
  rationale: A expressão preposicional é concisa e sintaticamente difícil. “Entre eles” preserva a leitura de que a refinação ocorre no meio desse grupo, enquanto a nota registra outras relações possíveis.
- source_word: וּלְבָרֵר
  choice: purificados
  rationale: ברר pode indicar purificar, separar ou expurgar. “Purificados” se ajusta à sequência de imagens de refinação e limpeza sem explicitar demais o modo do processo.
- source_word: וְלַלְבֵּן
  choice: tornados brancos
  rationale: O hifil de לבן significa literalmente “tornar branco”. A tradução conserva a imagem concreta, esclarecida em nota, em vez de substituí-la por uma interpretação abstrata.
- source_word: עַד עֵת קֵץ
  choice: até o tempo do fim
  rationale: A expressão é característica de Daniel e fica clara e formalmente próxima do hebraico nesta redação.
- source_word: כִּי עוֹד לַמּוֹעֵד
  choice: pois o tempo determinado ainda está por vir
  rationale: A cláusula hebraica é elíptica. A redação portuguesa torna explícita a relação temporal implícita, preservando מוֹעֵד como um tempo fixado ou determinado.
theological_decisions:
- issue: Propósito ou resultado do sofrimento dos que têm discernimento
  choice: O tropeço é apresentado como conducente à refinação e purificação, sem se definir uma doutrina abrangente do sofrimento.
  alternative: Ler os infinitivos apenas como sequência preditiva, sem valor de propósito ou resultado.
  rationale: A cadeia de infinitivos depois de יִכָּשְׁלוּ admite naturalmente valor de propósito ou resultado. “Para serem” mantém essa relação e não especifica além do que o versículo afirma.
- issue: Referência de בָּהֶם no processo de refinação
  choice: A refinação ocorre “entre eles”, no âmbito do grupo mencionado.
  alternative: A refinação ocorre “por meio deles” ou “neles”.
  rationale: A preposição ב permite mais de uma relação contextual. A tradução principal segue uma leitura possível e coerente, enquanto a nota conserva a ambiguidade real.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantiveram-se a metáfora de tropeçar, a imagem concreta de tornar branco e a ambiguidade de בָּהֶם por meio de notas, enquanto a oração final elíptica foi expressa de modo natural.
