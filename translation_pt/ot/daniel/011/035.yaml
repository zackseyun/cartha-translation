  source_fidelity: 'A tradução preserva adequadamente a estrutura e as imagens do hebraico: o sentido partitivo de וּמִן, a metáfora de יִכָּשְׁלוּ (“tropeçarão”), a sequência de refinação/purificação/branqueamento e a expressão daniélica “até o tempo do fim”. “Entre eles” para בָּהֶם é uma leitura possível e a nota registra apropriadamente a dificuldade sintática e outras possibilidades. A expansão final “o tempo determinado ainda está por vir” comunica de modo claro a elipse de כִּי עוֹד לַמּוֹעֵד sem alterar seu sentido temporal.'
