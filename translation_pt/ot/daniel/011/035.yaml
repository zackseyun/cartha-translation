  terminology: “Discernimento” traduz bem הַמַּשְׂכִּילִים sem reduzir o termo a capacidade intelectual genérica; “refinados” conserva a imagem metalúrgica de צרף; e “tornados brancos” preserva a concretude de לַלְבֵּן. “Tempo do fim” e “tempo determinado” são escolhas consistentes para a linguagem de Daniel e para מוֹעֵד.
