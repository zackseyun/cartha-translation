  text: וּ/בָ֗א בְּ/מַלְכוּת֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/שָׁ֖ב אֶל אַדְמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/009.yaml
  text: Then he will come into the realm of the king of the South[a], but he will return to his own land.
translation:
  language: pt
  text: Então ele entrará no reino do rei do Sul[a], mas voltará para a sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ele entrará no reino do rei do Sul e voltará para a sua terra.”'
    reason: O waw hebraico que introduz cada oração pode ser vertido simplesmente por “e”; a tradução principal expressa as relações sequencial e contrastiva percebidas no contexto.
lexical_decisions:
- source_word: וּבָא
  choice: Então ele entrará
  rationale: O waw seguido da forma verbal perfeita integra a sequência profética e pode ser expresso naturalmente pelo futuro em português. “Então” indica a progressão do relato; “entrará” transmite de modo idiomático o movimento para dentro do domínio mencionado, sem acrescentar a ideia mais específica de conquista.
- source_word: בְּמַלְכוּת
  choice: no reino
  rationale: מַלְכוּת pode significar realeza, reino ou domínio. Neste contexto político e territorial, “reino” é claro e corrente. Com o verbo de movimento, בְ recebe sentido direcional, expresso por “entrará no”.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: o rei do Sul
  rationale: Em Daniel 11, a expressão funciona como título geopolítico do soberano situado ao sul, e não como simples referência local ao Neguebe. A inicial maiúscula em “Sul” assinala essa designação contextual.
- source_word: וְשָׁב
  choice: mas voltará
  rationale: Embora waw normalmente seja traduzido por “e”, aqui a volta à própria terra produz um contraste ou desfecho contrário ao avanço anterior. “Mas” torna essa relação discursiva natural em português, sem alterar a ação verbal.
- source_word: אֶל אַדְמָתוֹ
  choice: para a sua terra
  rationale: אֲדָמָה pode designar solo ou terra; no contexto político-militar, “terra” é a opção natural. O possessivo “sua” representa o sufixo hebraico sem explicitar além do texto a identidade do referente.
theological_decisions:
- issue: Referente do pronome masculino implícito nos verbos
  choice: Manter apenas “ele”, sem identificar o governante pelo nome
  alternative: Explicitar “o rei do Norte” ou outro referente contextual
  rationale: O hebraico não nomeia o sujeito neste versículo. Explicá-lo no corpo do texto resolveria uma referência que o original deixa dependente do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Entrará no reino” evita o pouco natural “virá para dentro do reino”, preservando o movimento direcional. A formulação não identifica além do texto o sujeito implícito.
