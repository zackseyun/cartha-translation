source:
  edition: WLC
  text: ו/בנ/ו יִתְגָּר֗וּ וְ/אָסְפוּ֙ הֲמוֹן֙ חֲיָלִ֣ים רַבִּ֔ים וּ/בָ֥א ב֖וֹא וְ/שָׁטַ֣ף וְ/עָבָ֑ר וְ/יָשֹׁ֥ב ו/יתגרו עַד מעז/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/010.yaml
  text: His sons will stir themselves up and assemble a multitude of great forces[a], and one will certainly come and overflow and pass through[b]; then he will return and stir up war as far as his fortress.
translation:
  language: pt
  text: Seus filhos se mobilizarão e reunirão uma grande multidão de tropas. Então um deles certamente virá, avançará como uma inundação e atravessará; depois voltará e travará combate até a fortaleza dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até sua fortaleza” ou “até seu reduto”. O hebraico traz um sufixo masculino singular (“dele/sua”), mas não identifica de modo inequívoco a quem ele se refere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנָיו
  choice: Seus filhos
  rationale: No contexto de conflito dinástico, בנים designa os descendentes reais masculinos.
- source_word: יִתְגָּרוּ
  choice: se mobilizarão
  rationale: O hitpael de גרה exprime incitar-se ou entrar em conflito; a formulação natural em português conserva aqui a ideia de preparação ativa para a guerra.
- source_word: וְאָסְפוּ הֲמוֹן חֲיָלִים רַבִּים
  choice: e reunirão uma multidão de grandes forças
  rationale: Preserva tanto a ideia de grande concentração em הֲמוֹן como o sentido militar de חֲיָלִים רַבִּים.
- source_word: וּבָא בּוֹא
  choice: Então um deles certamente virá
  rationale: A construção com infinitivo absoluto intensifica o verbo, e 'um deles' torna perceptível a passagem do sujeito plural para o singular sem identificar qual filho.
- source_word: וְשָׁטַף וְעָבָר
  choice: avançará como uma inundação e atravessará
  rationale: Conserva a imagem de שטף aplicada ao avanço militar e traduz diretamente o movimento subsequente de עבר.
- source_word: וְיָשֹׁב וְיִתְגָּרוּ
  choice: depois voltará e travará combate
  rationale: שוב indica retorno, enquanto o segundo verbo de conflito é representado idiomaticamente como entrar em combate.
- source_word: עַד מָעֻזֹּה
  choice: até a fortaleza dele
  rationale: מָעוֹז significa fortaleza ou reduto; o pronome masculino singular é mantido sem explicitar seu referente.
theological_decisions:
- issue: Referente do sujeito singular depois de 'seus filhos'
  choice: um deles certamente virá
  alternative: ele certamente virá
  rationale: O hebraico passa do plural para o singular. A tradução sinaliza essa mudança sem identificar historicamente qual filho é o agente.
- issue: Referente do sufixo em 'sua fortaleza'
  choice: a fortaleza dele
  alternative: a fortaleza do adversário
  rationale: O sufixo hebraico é masculino singular, mas seu antecedente não é expresso de forma inequívoca; a tradução mantém essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe fluente. A imagem da inundação foi preservada, e as ambiguidades relativas ao filho singular e ao proprietário da fortaleza não foram resolvidas além do que permite o hebraico.
