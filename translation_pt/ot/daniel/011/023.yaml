base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/023.yaml
  text: And from the time of an alliance with him[a], he will act deceitfully; and he will rise and become strong with a small nation.
translation:
  language: pt
  text: E, a partir da aliança com ele, agirá com engano; subirá e se tornará poderoso com uma pequena nação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com poucas pessoas”. A expressão hebraica בִּמְעַט גּוֹי é compacta e pode destacar tanto uma nação pequena quanto o pequeno número de pessoas por meio das quais ele se torna poderoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: E, a partir de
  rationale: Preserva a ligação com o versículo anterior e apresenta a aliança como a circunstância inicial das ações seguintes.
- source_word: הִתְחַבְּרוּת אֵלָיו
  choice: da aliança com ele
  rationale: O substantivo verbal derivado de חבר indica união ou associação; no contexto político, “aliança” é a formulação mais precisa e natural. Embora אֵלָיו seja literalmente “a ele”, a regência portuguesa pede “com ele”.
- source_word: יַעֲשֶׂה מִרְמָה
  choice: agirá com engano
  rationale: Expressa de modo natural o hebraísmo “fará engano”, mantendo tanto a ação deliberada quanto a ideia de fraude ou traição.
- source_word: וְעָלָה
  choice: subirá
  rationale: Mantém o sentido básico de עלה e, neste contexto, permite a leitura de ascensão política sem torná-la explícita demais.
- source_word: וְעָצַם
  choice: e se tornará poderoso
  rationale: Reproduz o sentido de adquirir força ou poder, preservando o aspecto de desenvolvimento indicado pelo verbo.
- source_word: בִּמְעַט גּוֹי
  choice: com uma pequena nação
  rationale: Segue de perto a construção compacta do hebraico e sua leitura político-coletiva, sem ocultar a possibilidade de que a expressão se refira a poucas pessoas.
