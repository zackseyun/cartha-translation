id: DAN.11.11
reference: Daniel 11:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יִתְמַרְמַר֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יָצָ֕א וְ/נִלְחַ֥ם עִמּ֖/וֹ עִם מֶ֣לֶךְ הַ/צָּפ֑וֹן וְ/הֶעֱמִיד֙ הָמ֣וֹן רָ֔ב וְ/נִתַּ֥ן הֶ/הָמ֖וֹן בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/011.yaml
  text: Then the king of the South will become enraged and go out and fight with him[a], with the king of the North; and he will raise up a great multitude[c][b], but the multitude will be given into his hand.
translation:
  language: pt
  text: Então o rei do Sul ficará enfurecido[a], sairá e lutará contra ele, contra o rei do Norte. O rei do Norte mobilizará uma grande multidão[b], mas essa multidão será entregue na mão do rei do Sul[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “ficará profundamente agitado” ou “ficará amargurado”. O verbo hebraico descreve intensa agitação interior que leva à ação.
    reason: lexical_alternative
  - marker: b
    text: Ou “um grande exército”. O termo hebraico significa literalmente uma grande massa ou multidão e, neste contexto, designa uma força militar.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz literalmente “será entregue em sua mão”. “Na mão” significa “sob o poder”. O texto hebraico usa pronomes; o contexto indica que o rei do Norte mobiliza a multidão e que ela é entregue ao poder do rei do Sul.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִתְמַרְמַר
  choice: ficará enfurecido
  rationale: O hitpael de מרר expressa intensa agitação interior ou amargura que leva à ação. “Ficará enfurecido” comunica essa força emocional em português natural.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: o rei do Sul
  rationale: Mantém o título geopolítico direcional empregado ao longo de Daniel 11.
- source_word: וְיָצָא
  choice: sairá
  rationale: Reproduz o sentido básico do verbo; no contexto, trata-se de sair para a batalha, sem necessidade de explicitar “marchará”.
- source_word: וְנִלְחַם עִמּוֹ עִם מֶלֶךְ הַצָּפוֹן
  choice: lutará contra ele, contra o rei do Norte
  rationale: Embora עִם signifique literalmente “com”, com o verbo “lutar” indica confronto. A repetição em aposição preserva a estrutura e identifica o adversário.
- source_word: וְהֶעֱמִיד
  choice: mobilizará
  rationale: O hifil de עמד significa aqui fazer comparecer ou pôr em posição uma força; “mobilizará” é idiomático no contexto militar.
- source_word: הָמוֹן רָב
  choice: uma grande multidão
  rationale: Preserva o sentido amplo de המון e a repetição do substantivo na oração seguinte, sem restringi-lo explicitamente a “exército”.
- source_word: וְנִתַּן הֶהָמוֹן בְּיָדוֹ
  choice: mas essa multidão será entregue nas mãos do rei do Sul
  rationale: A forma passiva de נתן indica entrega ao poder de alguém. “Nas mãos” conserva o conhecido idioma hebraico; o referente contextual é explicitado para evitar uma ambiguidade pronominal enganosa em português.
theological_decisions:
- issue: Referentes dos verbos e do pronome na segunda metade do versículo
  choice: Identificar o rei do Norte como quem mobiliza a multidão e o rei do Sul como aquele em cujas mãos ela é entregue
  alternative: Conservar apenas “ele” e “suas mãos”, deixando ambos os referentes formalmente implícitos
  rationale: 'A sequência narrativa e o contraste indicam mudança de referente: o rei do Norte reúne a força, que é entregue ao rei do Sul. A nota registra que o hebraico emprega formas pronominais e não repete os títulos.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantiveram-se os títulos “rei do Sul” e “rei do Norte” e a repetição de “multidão”. Os referentes foram explicitados no corpo para que a alternância entre os dois reis permaneça compreensível, enquanto a forma mais pronominal do hebraico é registrada em nota.
