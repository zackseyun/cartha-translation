  text: וּ/בָא֙ בְּ/אֶ֣רֶץ הַ/צְּבִ֔י וְ/רַבּ֖וֹת יִכָּשֵׁ֑לוּ וְ/אֵ֨לֶּה֙ יִמָּלְט֣וּ מִ/יָּד֔/וֹ אֱד֣וֹם וּ/מוֹאָ֔ב וְ/רֵאשִׁ֖ית בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/041.yaml
  text: 'He will enter into the Beautiful Land[a], and many will stumble; but these will escape from his hand: Edom, Moab[c][b], and the foremost of the sons of Ammon.'
translation:
  language: pt
  text: 'Ele entrará na Terra Formosa[a], e muitos tropeçarão[b]; mas estes escaparão de sua mão: Edom, Moabe e a parte principal dos filhos de Amom[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Terra Gloriosa” ou “Terra Aprazível”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “muitas”; o referente implícito pode ser pessoas ou terras.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou “o principal dos amonitas”. Hebraico: “a parte principal dos filhos de Amom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Ele entrará
  rationale: בוא pode significar “vir” ou “entrar”; com בְּ e “terra”, “entrará” é natural em português e mantém a continuidade do sujeito no contexto.
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: na Terra Formosa
  rationale: צְבִי expressa beleza, esplendor ou aprazibilidade. “Terra Formosa” preserva a imagem hebraica e funciona como designação geográfica sem inserir explicitamente “Israel”.
- source_word: וְרַבּוֹת
  choice: e muitos
  rationale: O adjetivo feminino plural é substantivado, mas o nome implícito não é expresso. “Muitos” preserva de modo conciso a ambiguidade entre pessoas, terras ou outras entidades.
- source_word: יִכָּשֵׁלוּ
  choice: tropeçarão
  rationale: O nifal de כשל pode indicar tropeçar, cair ou ser derrubado. “Tropeçarão” retém a metáfora do hebraico sem explicitar além do texto a natureza da derrota.
- source_word: וְאֵלֶּה יִמָּלְטוּ
  choice: mas estes escaparão
  rationale: O contexto dá valor contrastivo à conjunção; ימלטו significa escapar ou ser livrado. A formulação é clara e natural.
- source_word: מִיָּדוֹ
  choice: de sua mão
  rationale: Mantém a metáfora concreta hebraica de domínio ou poder, inteligível em português.
- source_word: אֱדוֹם וּמוֹאָב
  choice: Edom, Moabe
  rationale: São as formas tradicionais e reconhecíveis desses nomes em português.
- source_word: וְרֵאשִׁית בְּנֵי עַמּוֹן
  choice: e os principais dos filhos de Amom
  rationale: רֵאשִׁית pode designar a parte primeira, principal ou mais destacada. “Os principais” comunica esse sentido, enquanto “filhos de Amom” preserva a estrutura do hebraico.
theological_decisions:
- issue: Referente de “Terra Formosa”
  choice: Manter a designação geográfica implícita, sem acrescentar “Israel” ou “Judá”
  alternative: Traduzir interpretativamente como “a terra de Israel”
  rationale: No contexto de Daniel, a expressão aponta provavelmente para Israel/Judá, mas o hebraico emprega uma designação figurada; a tradução conserva essa forma sem transformar a identificação contextual em texto explícito.
- issue: Referente de וְרַבּוֹת
  choice: “muitos”, sem fornecer o substantivo implícito
  alternative: “muitas terras” ou “muitas pessoas”
  rationale: O hebraico não explicita o referente. A tradução preserva a ambiguidade genuína e a nota informa as possibilidades.
- issue: Identidade de רֵאשִׁית בְּנֵי עַמּוֹן
  choice: “os principais dos filhos de Amom”
  alternative: “a parte principal dos amonitas” ou “o chefe dos amonitas”
  rationale: A expressão pode indicar o grupo principal ou destacado entre os amonitas. O plural português evita impor a ideia de um único governante e mantém a referência coletiva provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das notas foi regularizada para acompanhar sua ocorrência no texto. “Terra Formosa” recebe iniciais maiúsculas por funcionar aqui como designação geográfica. A sintaxe preserva as imagens hebraicas de tropeço e mão sem perder naturalidade.
