  text: וּ/בְ/הִכָּ֣שְׁלָ֔/ם יֵעָזְר֖וּ עֵ֣זֶר מְעָ֑ט וְ/נִלְו֧וּ עֲלֵי/הֶ֛ם רַבִּ֖ים בַּ/חֲלַקְלַקּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/034.yaml
  text: When they stumble[a], they will receive a little help, and many will join themselves to them with smooth words.
translation:
  language: pt
  text: Quando tropeçarem, receberão um pouco de ajuda, e muitos se juntarão a eles com palavras suaves[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com lisonjas” ou “por meio de palavras lisonjeiras”. O hebraico fala literalmente de “coisas suaves”, imagem que pode indicar uma fala aduladora ou enganosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּשְׁלָם
  choice: Quando tropeçarem
  rationale: A construção com בְּ e o infinitivo construto nifal indica uma circunstância temporal. “Tropeçarem” preserva a imagem e não sugere necessariamente uma queda definitiva.
- source_word: יֵעָזְרוּ
  choice: receberão ... ajuda
  rationale: O nifal apresenta a ajuda como algo recebido. Esta formulação é natural em português e conserva o sentido passivo.
- source_word: עֵזֶר מְעָט
  choice: um pouco de ajuda
  rationale: Expressa de modo claro e idiomático o caráter limitado da ajuda.
- source_word: וְנִלְווּ עֲלֵיהֶם
  choice: e muitos se juntarão a eles
  rationale: “Se juntarão” preserva a ideia reflexiva de pessoas que se ligam ao grupo, em linguagem portuguesa corrente.
- source_word: רַבִּים
  choice: muitos
  rationale: Equivalente quantitativo direto e natural.
- source_word: בַּחֲלַקְלַקּוֹת
  choice: com palavras suaves
  rationale: Preserva a imagem hebraica de coisas ou palavras lisas/suaves, sem tornar explícita demais a falsidade implícita; a nota registra a alternativa contextual.
theological_decisions: []
