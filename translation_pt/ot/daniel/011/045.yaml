  text: וְ/יִטַּע֙ אָהֳלֶ֣י אַפַּדְנ֔/וֹ בֵּ֥ין יַמִּ֖ים לְ/הַר צְבִי קֹ֑דֶשׁ וּ/בָא֙ עַד קִצּ֔/וֹ וְ/אֵ֥ין עוֹזֵ֖ר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/045.yaml
  text: He will pitch the tents of his royal pavilion between the seas and the beautiful holy mountain[a]; yet he will come to his end[b], and there will be no one to help him.
translation:
  language: pt
  text: Armará as tendas de seu pavilhão real[a] entre os mares e o belo monte santo[b]; mas chegará ao seu fim, e não haverá quem o ajude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu palácio”, “sua tenda palaciana” ou “seu pavilhão”. A palavra rara provavelmente designa uma residência régia ou um pavilhão oficial.
    reason: lexical_alternative
  - marker: b
    text: Ou “o esplêndido monte santo” ou “o monte do santo esplendor”. A expressão hebraica pode indicar o monte santo em sua beleza ou glória, provavelmente em referência a Sião/Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִטַּע
  choice: Armará
  rationale: Embora נטע signifique literalmente “plantar”, quando tem “tendas” por objeto expressa idiomaticamente a ação de armá-las ou instalá-las. “Armará” é a colocação natural em português.
- source_word: אָהֳלֵי
  choice: as tendas de
  rationale: Mantém o plural construto do hebraico, que pode evocar um acampamento régio ou um conjunto de tendas.
- source_word: אַפַּדְנוֹ
  choice: seu pavilhão real
  rationale: O termo raro, provavelmente um empréstimo, parece designar uma residência palaciana ou um pavilhão régio. No contexto de tendas, “pavilhão real” comunica melhor uma instalação régia de campanha sem sugerir necessariamente um edifício permanente.
- source_word: בֵּין יַמִּים
  choice: entre os mares
  rationale: Preserva o plural hebraico e sua expressão geográfica sem identificar no texto quais mares estão em vista.
- source_word: לְהַר צְבִי קֹדֶשׁ
  choice: e o belo monte santo
  rationale: צְבִי pode indicar beleza, esplendor ou glória. A construção é entendida como o segundo termo de “entre”, com לְ em função locativa, e provavelmente alude ao monte santo de Sião/Jerusalém sem explicitá-lo.
- source_word: וּבָא עַד קִצּוֹ
  choice: mas chegará ao seu fim
  rationale: A formulação conserva o sentido direto de chegar ao fim. “Mas” expressa o contraste contextual entre a demonstração de poder anterior e o desfecho do governante.
- source_word: וְאֵין עוֹזֵר לוֹ
  choice: e não haverá quem o ajude
  rationale: Verte naturalmente a construção existencial negativa com o particípio “ajudante”, preservando a ideia de que ninguém lhe prestará auxílio.
theological_decisions:
- issue: Identidade do governante em Daniel 11:45
  choice: O referente permanece implícito nas formas verbais e pronominais, sem ser identificado no texto.
  alternative: O governante pode ser entendido como Antíoco IV Epifânio, uma figura escatológica anticrística ou um governante de caráter composto ou tipológico.
  rationale: O hebraico não nomeia a personagem neste versículo. Identificá-la na tradução resolveria uma questão interpretativa que o texto deixa aberta.
- issue: Identificação do monte santo
  choice: A tradução mantém “o belo monte santo” sem acrescentar “Sião” ou “Jerusalém”.
  alternative: Explicitar Sião/Jerusalém no texto principal.
  rationale: A referência provavelmente aponta para o monte santo associado a Jerusalém, mas o nome não consta do hebraico; por isso, a tradução preserva a formulação original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados sempre que naturais. “Armará as tendas” evita o literalismo pouco idiomático de “plantará”, enquanto “pavilhão real” mantém a imagem de um acampamento régio. Os marcadores foram colocados imediatamente após as expressões às quais suas notas se referem.
