base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/021.yaml
  text: And in his place a despised man will arise[a], on whom they had not bestowed the majesty of kingship[b]; he will come in quietly and seize the kingdom by intrigues.
translation:
  language: pt
  text: Em seu lugar se levantará um homem desprezado, a quem não terão concedido a majestade real. Ele chegará tranquilamente[a] e se apoderará do reino por meio de manobras ardilosas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em segurança”, “em paz” ou “sem alarde”; o termo pode indicar tranquilidade, segurança ou uma aproximação sem agressão aberta.
    reason: lexical_alternative
  - marker: b
    text: Ou “por meio de lisonjas” ou “de palavras suaves”; a expressão sugere persuasão enganosa e manipulação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל־כַּנּוֹ
  choice: Em seu lugar se levantará
  rationale: No contexto de sucessão política em Daniel, עמד indica o surgimento de alguém no poder, e עַל־כַּנּוֹ expressa que ele sucede à figura anterior.
- source_word: נִבְזֶה
  choice: um homem desprezado
  rationale: Preserva o sentido passivo de alguém tido em desprezo, sem recorrer a termos arcaicos ou intensificar o hebraico para 'vil'.
- source_word: וְלֹא נָתְנוּ עָלָיו הוֹד מַלְכוּת
  choice: a quem não terão concedido a dignidade real
  rationale: הוֹד comunica honra, esplendor ou majestade, e מַלְכוּת aponta aqui para a condição ou autoridade régia. 'Dignidade real' é natural e mantém a ideia de investidura não concedida.
- source_word: וּבָא בְשַׁלְוָה
  choice: Ele chegará sem alarde
  rationale: בְשַׁלְוָה pode indicar tranquilidade, segurança ou uma aproximação sem agressão aberta. 'Sem alarde' comunica uma entrada discreta sem atribuir ao personagem uma disposição moralmente pacífica.
- source_word: וְהֶחֱזִיק מַלְכוּת
  choice: e se apoderará do reino
  rationale: O Hifil de חזק pode indicar obter ou firmar controle. No contexto de usurpação, 'se apoderará' expressa a tomada efetiva do reino.
- source_word: בַּחֲלַקְלַקּוֹת
  choice: por meio de manobras ardilosas
  rationale: O termo deriva da noção de lisura e pode designar lisonjas, palavras enganosamente suaves ou artifícios políticos. A escolha conserva o caráter manipulador sem limitar o meio apenas à fala.
