id: DAN.11.15
reference: Daniel 11:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָבֹא֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/יִשְׁפֹּךְ֙ סֽוֹלֲלָ֔ה וְ/לָכַ֖ד עִ֣יר מִבְצָר֑וֹת וּ/זְרֹע֤וֹת הַ/נֶּ֨גֶב֙ לֹ֣א יַעֲמֹ֔דוּ וְ/עַם֙ מִבְחָרָ֔י/ו וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/015.yaml
  text: Then the king of the north will come and heap up a siege ramp and capture a fortified city[a], and the forces of the south will not stand, nor his choice troops[b], for there will be no strength to stand.
translation:
  language: pt
  text: Então o rei do norte virá, levantará uma rampa de cerco e tomará uma cidade fortificada. As forças do sul não resistirão, nem suas tropas de elite[a], pois não terão força para resistir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nem seu povo escolhido”. No contexto, a expressão provavelmente se refere às tropas selecionadas ou de elite do rei do sul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָבֹא
  choice: Então ... virá
  rationale: O waw com o imperfeito dá continuidade à sequência profética; “Então” expressa essa progressão com naturalidade em português.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: o rei do norte
  rationale: Preserva a designação político-geográfica recorrente e o contraste entre norte e sul em Daniel 11.
- source_word: וְיִשְׁפֹּךְ סֹלֲלָה
  choice: levantará uma rampa de cerco
  rationale: A expressão descreve a construção de uma obra de cerco; “levantar uma rampa de cerco” comunica claramente o sentido militar sem reproduzir de modo artificial o verbo literal “derramar”.
- source_word: וְלָכַד
  choice: e tomará
  rationale: No contexto militar, “tomar” exprime de modo natural a conquista da cidade e mantém a sequência futura.
- source_word: עִיר מִבְצָרוֹת
  choice: uma cidade fortificada
  rationale: O plural no sintagma construto caracteriza a cidade por suas fortificações; a formulação portuguesa é clara e idiomática.
- source_word: וּזְרֹעוֹת הַנֶּגֶב
  choice: As forças do sul
  rationale: “Braços” é metáfora hebraica para poder ou forças militares; “forças” torna explícito o sentido contextual.
- source_word: לֹא יַעֲמֹדוּ
  choice: não resistirão
  rationale: Embora o verbo signifique literalmente “ficar de pé”, no contexto de combate indica a incapacidade de resistir; a escolha é natural em português.
- source_word: וְעַם מִבְחָרָיו
  choice: nem suas tropas de elite
  rationale: No contexto militar, o grupo escolhido provavelmente são as tropas selecionadas do rei do sul. “Nem” liga naturalmente esse grupo à negação anterior, enquanto a nota preserva a alternativa lexical mais literal.
- source_word: וְאֵין כֹּחַ לַעֲמֹד
  choice: pois não terão força para resistir
  rationale: A oração explica por que as forças fracassarão. O plural recupera naturalmente os combatentes mencionados, e a repetição de “resistir” conserva o vínculo com יעמדו.
theological_decisions: []
