source:
  edition: WLC
  text: וּ/בָ֨אוּ ב֜/וֹ צִיִּ֤ים כִּתִּים֙ וְ/נִכְאָ֔ה וְ/שָׁ֛ב וְ/זָעַ֥ם עַל בְּרִֽית ק֖וֹדֶשׁ וְ/עָשָׂ֑ה וְ/שָׁ֣ב וְ/יָבֵ֔ן עַל עֹזְבֵ֖י בְּרִ֥ית קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/030.yaml
  text: For ships of Kittim will come against him[a], and he will be disheartened. Then he will turn back and rage against the holy covenant, and he will act[b]. He will turn back and pay attention to those who forsake the holy covenant.
translation:
  language: pt
  text: Pois navios de Quitim virão contra ele[a], e ele ficará desanimado. Então voltará, se enfurecerá contra a santa aliança e agirá[b]. Voltará e dará atenção aos que abandonam a santa aliança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «navios vindos de Quitim». Quitim pode referir-se a Chipre ou, de modo mais amplo, a potências marítimas ocidentais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, segundo outra compreensão da sequência: «agirá contra a santa aliança». A expressão hebraica é concisa e não declara explicitamente o objeto de «agirá».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: צִיִּים כִּתִּים
  choice: navios de Quitim
  rationale: No contexto, צִיִּים designa embarcações ou forças marítimas, enquanto כִּתִּים pode indicar Chipre ou, de modo mais amplo, potências marítimas ocidentais. A forma tradicional «Quitim» preserva a referência geográfica sem a restringir indevidamente.
- source_word: וְנִכְאָה
  choice: e ele ficará desanimado
  rationale: O verbo comunica abatimento, intimidação ou humilhação diante da oposição. «Ficará desanimado» é natural em português e não implica destruição física.
- source_word: וְשָׁב
  choice: voltará
  rationale: שׁוּב indica aqui uma mudança de rumo depois de um revés. «Voltará» expressa isso de forma clara e concisa.
- source_word: וְזָעַם
  choice: se enfurecerá contra
  rationale: O verbo denota ira ou indignação dirigida contra alguém ou algo. A formulação escolhida preserva a força hostil da ação.
- source_word: בְּרִית קֹדֶשׁ / בְּרִית קוֹדֶשׁ
  choice: a santa aliança
  rationale: A expressão caracteriza a aliança como santa sem explicitar uma identificação além do que o hebraico afirma.
- source_word: וְעָשָׂה
  choice: e agirá
  rationale: O verbo é amplo, com o sentido de fazer ou agir. A tradução mantém a concisão e a ausência de objeto explícito no hebraico.
- source_word: וְיָבֵן
  choice: e dará atenção a
  rationale: Neste contexto, בין comunica considerar, atentar para ou levar em conta, possivelmente com a ideia de aproximação política. «Dará atenção a» conserva essa amplitude.
- source_word: עֹזְבֵי
  choice: os que abandonam
  rationale: O particípio descreve os que deixam ou abandonam a aliança. A escolha é clara e evita introduzir no texto principal um termo técnico como «apóstatas».
theological_decisions:
- issue: Referente de «a santa aliança»
  choice: Manter «a santa aliança» sem especificação adicional.
  alternative: «a aliança de Deus com Israel» ou «a aliança judaica»
  rationale: O contexto relaciona a expressão ao povo santo e ao seu culto, mas o hebraico não explicita essa identificação neste versículo; a tradução preserva essa contenção.
- issue: Relação de וְעָשָׂה com a santa aliança e com os que a abandonam
  choice: 'Traduzir o verbo de modo independente: «e agirá».'
  alternative: Entender a ação mais especificamente como hostilidade contra a santa aliança ou como consideração pelos que a abandonam.
  rationale: A sintaxe é comprimida e o verbo עשה não traz objeto expresso. A redação principal preserva essa indeterminação, enquanto a nota registra uma leitura contextual possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. «Quitim» mantém a forma geográfica tradicional; «santa aliança» conserva a formulação teológica do hebraico sem explicação denominacional.
