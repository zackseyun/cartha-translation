  text: וּ/זְרֹעִ֖ים מִמֶּ֣/נּוּ יַעֲמֹ֑דוּ וְ/חִלְּל֞וּ הַ/מִּקְדָּ֤שׁ הַ/מָּעוֹז֙ וְ/הֵסִ֣ירוּ הַ/תָּמִ֔יד וְ/נָתְנ֖וּ הַ/שִּׁקּ֥וּץ מְשׁוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/031.yaml
  text: And forces from him will arise[a], and they will profane the sanctuary fortress, and remove the regular burnt offering[d][c][b], and set up the abomination that desolates.
translation:
  language: pt
  text: E forças vindas dele se levantarão[a]; profanarão o santuário, a fortaleza[b], retirarão o sacrifício regular[c] e colocarão a abominação que causa desolação[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “braços” ou “forças militares”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o santuário, a fortaleza”; possivelmente, “o santuário fortificado” ou “o santuário-fortaleza”.'
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “o contínuo”; expressão que se refere ao sacrifício oferecido regularmente.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “a abominação desoladora”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּזְרֹעִים
  choice: forças
  rationale: Embora o sentido literal seja “braços”, no contexto político-militar o termo designa forças armadas; “forças” comunica naturalmente esse uso figurado.
- source_word: מִמֶּנּוּ
  choice: vindas dele
  rationale: Mantém a referência pessoal mais provável ao governante mencionado no contexto, sem especificar além do hebraico a forma exata de sua atuação.
- source_word: יַעֲמֹדוּ
  choice: se levantarão
  rationale: O verbo significa literalmente “ficar de pé”, mas aqui descreve forças que surgem ou tomam posição; “se levantarão” preserva a imagem e é natural em português.
- source_word: וְחִלְּלוּ
  choice: profanarão
  rationale: O piel de חלל indica tratar como profano ou dessacralizar; “profanarão” corresponde diretamente à linguagem de santuário.
- source_word: הַמִּקְדָּשׁ
  choice: o santuário
  rationale: É a equivalência corrente e concisa para o lugar santo, sem explicitar “templo” além do texto.
- source_word: הַמָּעוֹז
  choice: a fortaleza
  rationale: O substantivo denota fortaleza, lugar fortificado ou refúgio. A aposição preserva o segundo substantivo e a compactação sintática do hebraico.
- source_word: וְהֵסִירוּ
  choice: retirarão
  rationale: Expressa o causativo “fazer desaparecer, remover”, sem decidir se a supressão será temporária ou definitiva.
- source_word: הַתָּמִיד
  choice: o sacrifício contínuo
  rationale: O hebraico traz literalmente “o contínuo”, expressão cultual abreviada para o sacrifício oferecido regularmente. “Sacrifício contínuo” torna o referente compreensível sem restringi-lo desnecessariamente a uma formulação mais extensa.
- source_word: וְנָתְנוּ
  choice: colocarão
  rationale: נתן significa aqui pôr ou instalar. “Colocarão” é direto e evita pressupor com excessiva precisão a natureza física do objeto ou prática.
- source_word: הַשִּׁקּוּץ
  choice: a abominação
  rationale: O termo indica algo detestável, frequentemente associado à idolatria. “Abominação” preserva a linguagem forte e tradicional de Daniel.
- source_word: מְשׁוֹמֵם
  choice: que causa desolação
  rationale: A construção relativa comunica a força participial causativa ou desoladora, sem reduzir o termo apenas ao resultado estático.
theological_decisions:
- issue: Relação entre “o santuário” e “a fortaleza” (הַמִּקְדָּשׁ הַמָּעוֹז)
  choice: “o santuário, a fortaleza”
  alternative: “o santuário fortificado” ou “o santuário-fortaleza”
  rationale: Os dois substantivos definidos estão justapostos, e a relação exata é compacta. A aposição conserva ambos e não resolve silenciosamente a ambiguidade como simples adjetivação.
- issue: Sentido cultual de הַתָּמִיד
  choice: “o sacrifício contínuo”
  alternative: “o contínuo”, “a oferta regular” ou “o holocausto regular”
  rationale: No contexto de Daniel, a expressão substantivada aponta para o sacrifício cultual regular. O acréscimo de “sacrifício” esclarece o referente implícito, enquanto “contínuo” mantém o valor lexical sem impor que o texto nomeie explicitamente o holocausto.
- issue: Força de מְשׁוֹמֵם
  choice: “que causa desolação”
  alternative: “desoladora” ou “que assola”
  rationale: A formulação mantém aberta a tensão entre uma abominação caracterizada como desoladora e uma que efetivamente produz desolação, sem identificar antecipadamente seu referente histórico ou escatológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega futuro verbal e vocabulário bíblico corrente sem arcaísmos. A pontuação com ponto e vírgula separa o surgimento das forças de suas ações subsequentes, e as notas preservam as principais ambiguidades lexicais e sintáticas.
