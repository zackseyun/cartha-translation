language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֱמֶ֖ת אַגִּ֣יד לָ֑/ךְ הִנֵּה עוֹד֩ שְׁלֹשָׁ֨ה מְלָכִ֜ים עֹמְדִ֣ים לְ/פָרַ֗ס וְ/הָֽ/רְבִיעִי֙ יַעֲשִׁ֤יר עֹֽשֶׁר גָּדוֹל֙ מִ/כֹּ֔ל וּ/כְ/חֶזְקָת֣/וֹ בְ/עָשְׁר֔/וֹ יָעִ֣יר הַ/כֹּ֔ל אֵ֖ת מַלְכ֥וּת יָוָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/002.yaml
  text: 'And now I will tell you the truth: behold[a], three more kings will arise for Persia, and the fourth will become far richer than all of them; and when he becomes strong through his riches[c][b], he will stir up everyone against the kingdom of Greece.'
translation:
  language: pt
  text: 'E agora eu lhe direi a verdade: eis que mais três reis se levantarão na Pérsia[a], e o quarto se tornará muito mais rico do que todos eles[b]. Quando se fortalecer por meio de suas riquezas, mobilizará todos contra o reino da Grécia[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: “se levantarão para a Pérsia”.'
    reason: A preposição לְ indica a relação dos reis com a Pérsia; “na Pérsia” torna explícito em português o sentido contextual de sucessão no âmbito persa.
  - marker: b
    text: 'Ou: “adquirirá grandes riquezas, mais do que todos”.'
    reason: Alternativa mais formal que preserva a construção hebraica com o verbo e o substantivo cognato ligados à riqueza.
  - marker: c
    text: 'Ou: “incitará todos contra o reino da Grécia”.'
    reason: יָעִיר pode descrever despertar, incitar ou mobilizar; a alternativa conserva mais diretamente a ideia de provocação.
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto o conectivo ו quanto o marcador temporal עַתָּה, introduzindo a etapa seguinte da revelação.
- source_word: אֱמֶת אַגִּיד לָךְ
  choice: eu lhe direi a verdade
  rationale: Expressão portuguesa natural que mantém אֱמֶת como objeto de אַגִּיד e o destinatário indicado por לָךְ.
- source_word: הִנֵּה
  choice: eis que
  rationale: Conserva a força de apresentação e ênfase do hebraico em registro profético digno e inteligível.
- source_word: עוֹד שְׁלֹשָׁה מְלָכִים
  choice: mais três reis
  rationale: עוֹד indica adição; esta formulação é natural e concisa em português.
- source_word: עֹמְדִים לְפָרַס
  choice: se levantarão para a Pérsia
  rationale: עמד, no contexto de sucessão régia, tem o sentido de surgir ou levantar-se; 'para a Pérsia' preserva a relação expressa por לְ sem convertê-la silenciosamente em localização.
- source_word: יַעֲשִׁיר עֹשֶׁר גָּדוֹל מִכֹּל
  choice: se tornará muito mais rico do que todos eles
  rationale: A construção causativa com o substantivo cognato intensifica a aquisição de riqueza, e מִכֹּל estabelece a comparação com os demais reis.
- source_word: וּכְחֶזְקָתוֹ בְעָשְׁרוֹ
  choice: Quando se fortalecer por meio de suas riquezas
  rationale: Entende כְ em sentido temporal ou circunstancial e בְ em sentido instrumental, sem separar artificialmente poder e riqueza.
- source_word: יָעִיר הַכֹּל
  choice: mobilizará todos
  rationale: O Hifil de עור pode significar despertar, incitar ou pôr em movimento. 'Mobilizará' comunica bem a ação político-militar, enquanto 'todos' mantém a abrangência substantivada de הַכֹּל.
- source_word: אֵת מַלְכוּת יָוָן
  choice: contra o reino da Grécia
  rationale: No contexto, a construção completa descreve a mobilização dirigida contra o reino grego; 'reino' traduz מַלְכוּת e 'Grécia' traduz יָוָן.
theological_decisions:
- issue: Sentido histórico-político da oração final
  choice: O quarto rei persa mobiliza todos contra o reino da Grécia.
  alternative: Ele desperta tudo, inclusive o reino da Grécia, ou mobiliza todos em favor da Grécia.
  rationale: A leitura adversativa corresponde melhor à combinação contextual de עור, הַכֹּל e אֵת מַלְכוּת יָוָן e ao desenvolvimento do anúncio histórico, sem acrescentar identificação extratextual do rei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém 'eis que' para a força profética, evita arcaísmos desnecessários e preserva em nota as ambiguidades lexicais relevantes.
