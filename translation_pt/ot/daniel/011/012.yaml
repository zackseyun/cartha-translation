base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/012.yaml
  text: And when the multitude is carried away[a], his heart will be lifted up, and he will cast down tens of thousands[c][b], but he will not prevail.
translation:
  language: pt
  text: Quando a multidão for levada embora[a], o coração dele se exaltará[b]; ele derrubará dezenas de milhares, mas não prevalecerá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando a multidão for levantada” ou “for retirada”. O verbo hebraico pode significar ser levantada, ser carregada ou ser removida; o contexto de derrota militar favorece “levada embora”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “o coração dele se exaltará” indica que ele se tornará orgulhoso.
    reason: cultural_note
  - marker: c
    text: 'Ou: “mas não se fortalecerá”. O hebraico pode enfatizar tanto que ele não prevalecerá como que não consolidará seu poder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשָּׂא
  choice: Quando ... for levada embora
  rationale: O nifal de נשׂא pode significar ser levantado, carregado ou removido. No contexto de derrota militar, “levada embora” comunica melhor que a multidão foi varrida ou retirada; “quando” expressa naturalmente a sequência temporal implícita.
- source_word: הֶהָמוֹן
  choice: aquela multidão
  rationale: הָמוֹן designa uma multidão ou massa de pessoas. O contexto é militar, mas “multidão” evita especificar além do hebraico; o demonstrativo torna natural em português a referência ao exército mencionado no contexto anterior.
- source_word: ירום לְבָבוֹ
  choice: o coração dele se exaltará
  rationale: Preserva a imagem idiomática hebraica de um coração que se eleva, isto é, que se torna orgulhoso, sem substituir a metáfora pela interpretação.
- source_word: וְהִפִּיל
  choice: ele derrubará
  rationale: O hifil de נפל significa fazer cair. “Derrubará” mantém a força causativa e funciona naturalmente no contexto de combate.
- source_word: רִבֹּאוֹת
  choice: dezenas de milhares
  rationale: O plural indica miríades ou grupos de dez mil; “dezenas de milhares” é claro e corrente em português.
- source_word: וְלֹא יָעוֹז
  choice: mas não prevalecerá
  rationale: O verbo pode expressar ser ou tornar-se forte e, neste contexto, prevalecer. A tradução comunica que o êxito militar não resultará em triunfo ou força duradoura.
