source:
  edition: WLC
  text: וְ/יָשֵׁ֣ב פָּנָ֔י/ו לְ/מָעוּזֵּ֖י אַרְצ֑/וֹ וְ/נִכְשַׁ֥ל וְ/נָפַ֖ל וְ/לֹ֥א יִמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/019.yaml
  text: Then he will turn his face toward the fortresses of his own land[a], but he will stumble and fall[b], and he will not be found.
translation:
  language: pt
  text: Então ele voltará o rosto para as fortalezas de sua própria terra[a], mas tropeçará, cairá e não será encontrado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugares fortificados”. O termo hebraico pode indicar, de modo amplo, lugares de força, proteção ou defesa.
    reason: lexical_alternative
  - marker: b
    text: “Não será encontrado” indica, de maneira idiomática, que ele desaparecerá de cena, provavelmente por morte ou queda do poder, sem que o texto especifique como isso acontecerá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֵׁב פָּנָיו
  choice: Então ele voltará o rosto
  rationale: שׁוב significa voltar ou retornar; com פָּנָיו como objeto, a expressão indica mudança de direção. A formulação preserva a imagem hebraica e soa natural em português.
- source_word: לְמָעוּזֵּי
  choice: para as fortalezas
  rationale: מָעוֹז designa um lugar de força, proteção ou defesa. “Fortalezas” se ajusta ao contexto político-militar, sem restringir indevidamente o alcance do termo.
- source_word: אַרְצוֹ
  choice: de sua própria terra
  rationale: אֶרֶץ refere-se aqui à terra ou ao território pertencente a ele. “Sua própria terra” torna clara a direção de retorno sem acrescentar conteúdo estranho ao texto.
- source_word: וְנִכְשַׁל וְנָפַל
  choice: mas tropeçará, cairá
  rationale: A tradução mantém as duas imagens sucessivas, “tropeçar” e “cair”. “Mas” expressa naturalmente o contraste contextual entre seu retorno e seu fracasso.
- source_word: וְלֹא יִמָּצֵא
  choice: e não será encontrado
  rationale: A forma passiva de מצא significa literalmente “não será encontrado”. A tradução conserva a maneira indireta pela qual o hebraico indica seu desaparecimento, sem especificar morte ou deposição.
