base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/029.yaml
  text: At the appointed time he will return and come into the south[a], but it will not be as the former or as the latter.
translation:
  language: pt
  text: No tempo determinado, ele voltará e entrará no sul, mas não será como antes nem como depois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas não será como na primeira nem como na última”. O hebraico apresenta a comparação de forma condensada e um tanto elíptica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד
  choice: No tempo determinado
  rationale: מוֹעֵד designa um tempo fixado ou ocasião marcada. A expressão preserva a especificidade temporal sem sugerir indevidamente uma festa ou reunião.
- source_word: יָשׁוּב
  choice: ele voltará
  rationale: O qal de שׁוּב significa normalmente voltar ou retornar; aqui descreve de modo natural a retomada da ação militar.
- source_word: וּבָא
  choice: e entrará
  rationale: בוא pode significar vir ou entrar. Com o complemento territorial בַנֶּגֶב, “entrará” exprime em português natural o movimento para dentro da região, preservando a sequência verbal.
- source_word: בַנֶּגֶב
  choice: no sul
  rationale: Embora נֶגֶב também possa nomear o Neguebe, o contraste geopolítico recorrente entre norte e sul em Daniel 11 favorece o sentido amplo de território ou reino do sul.
- source_word: וְלֹא תִהְיֶה
  choice: mas dessa vez não será
  rationale: O verbo feminino singular provavelmente retoma de maneira implícita a expedição ou campanha. “Dessa vez não será” mantém a referência aberta e torna inteligível a elipse hebraica.
- source_word: כָרִאשֹׁנָה
  choice: como na primeira
  rationale: רִאשׁוֹנָה significa primeira ou anterior e, no feminino, pode qualificar uma campanha ou ocasião subentendida. A tradução conserva essa elipse.
- source_word: וְכָאַחֲרֹנָה
  choice: nem como na última
  rationale: אַחֲרֹנָה significa última ou posterior. “Nem” traduz naturalmente o וְ coordenativo sob o alcance da negação, sem eliminar a concisão e ambiguidade da comparação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém implícito o referente feminino da comparação (possivelmente a campanha ou expedição) e não identifica historicamente o governante no próprio texto.
