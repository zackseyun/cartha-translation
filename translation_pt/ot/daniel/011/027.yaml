  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/שְׁנֵי/הֶ֤ם הַ/מְּלָכִים֙ לְבָבָ֣/ם לְ/מֵרָ֔ע וְ/עַל שֻׁלְחָ֥ן אֶחָ֖ד כָּזָ֣ב יְדַבֵּ֑רוּ וְ/לֹ֣א תִצְלָ֔ח כִּי ע֥וֹד קֵ֖ץ לַ/מּוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/027.yaml
  text: As for both of them[a], the kings—their hearts are set on evil, and at one table they will speak lies, but it will not succeed[c][b], for the end is still for the appointed time.
translation:
  language: pt
  text: Os dois reis terão o coração voltado para o mal e, à mesma mesa, falarão mentiras[a]. Mas isso não terá êxito[b], pois o fim só virá no tempo determinado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dirão falsidades” ou “contarão mentiras”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mas isso não prosperará”. O verbo hebraico está no feminino singular e provavelmente tem sentido impessoal, referindo-se à trama ou ao resultado pretendido.'
    reason: lexical_and_grammatical_alternative
  - marker: c
    text: 'Mais literalmente: “pois o fim ainda é para o tempo determinado”. A expressão ressalta que o desfecho aguarda um tempo fixado.'
    reason: literal_rendering
lexical_decisions:
- source_word: וּשְׁנֵיהֶם הַמְּלָכִים
  choice: Os dois reis
  rationale: Reúne de modo natural em português o numeral com sufixo pronominal e o substantivo definido, mantendo a referência aos dois governantes já mencionados.
- source_word: לְבָבָם לְמֵרָע
  choice: terão o coração voltado para o mal
  rationale: A expressão hebraica indica intenção interior dirigida ao mal. O singular coletivo de לְבָבָם é preservado naturalmente com “o coração”, sem perder a referência a ambos.
- source_word: וְעַל שֻׁלְחָן אֶחָד
  choice: e, à mesma mesa
  rationale: Preserva a imagem concreta de ambos compartilhando uma mesa, provavelmente em contexto diplomático ou de refeição, enquanto “mesma” expressa com naturalidade o valor de אֶחָד neste contexto.
- source_word: כָּזָב יְדַבֵּרוּ
  choice: falarão mentiras
  rationale: כָּזָב denota falsidade ou engano. A formulação é clara, atual e conserva a ação verbal recíproca dos reis.
- source_word: וְלֹא תִצְלָח
  choice: Mas isso não terá êxito
  rationale: O verbo feminino singular provavelmente funciona de modo impessoal e remete ao plano, à trama ou ao resultado das falsidades. “Isso” evita inserir no texto um referente específico não expresso no hebraico.
- source_word: כִּי עוֹד קֵץ לַמּוֹעֵד
  choice: pois o fim só virá no tempo determinado
  rationale: Expressa em português corrente que o desfecho permanece vinculado a um prazo fixado. “Só virá” comunica a força temporal de עוֹד e a relação com לַמּוֹעֵד sem explicitar quem determinou o tempo.
theological_decisions:
- issue: Soberania divina implícita no tempo determinado do fim
  choice: Manter a afirmação temporal sem nomear Deus como agente
  alternative: “pois o fim só virá no tempo determinado por Deus”
  rationale: O contexto de Daniel sugere fortemente a soberania divina sobre o calendário histórico, mas Deus não é mencionado nesta oração. A tradução conserva a implicação sem transformá-la em afirmação explícita.
- issue: Referente do verbo feminino singular תִצְלָח
  choice: Usar o pronome neutro “isso”, deixando amplo o referente
  alternative: “mas o plano deles não terá êxito”
  rationale: O hebraico não nomeia diretamente um plano. A formulação escolhida preserva a possibilidade de o verbo se referir à trama, à negociação enganosa ou ao resultado pretendido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para fluência, sem eliminar a imagem da mesa, a intenção maligna, o engano mútuo nem a ambiguidade quanto ao referente de “não terá êxito”.
