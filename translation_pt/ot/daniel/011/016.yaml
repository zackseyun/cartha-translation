reference: Daniel 11:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יַ֨עַשׂ הַ/בָּ֤א אֵלָי/ו֙ כִּ/רְצוֹנ֔/וֹ וְ/אֵ֥ין עוֹמֵ֖ד לְ/פָנָ֑י/ו וְ/יַעֲמֹ֥ד בְּ/אֶֽרֶץ הַ/צְּבִ֖י וְ/כָלָ֥ה בְ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/016.yaml
  text: And the one who comes against him will do as he pleases[a], and no one will stand before him. He will stand in the Beautiful Land[b], and it will be consumed in his hand.
translation:
  language: pt
  text: Aquele que vier contra ele fará o que quiser, e ninguém conseguirá resistir a ele. Ele se estabelecerá na Terra Formosa[a], e a destruição estará em sua mão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Terra Gloriosa”. A expressão hebraica descreve uma terra bela, esplêndida ou desejável e, aqui, refere-se à terra de Israel/Judá.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e ela será consumida em sua mão” ou “e ele causará destruição”. A frase hebraica é compacta e pode destacar tanto o poder destrutivo sob seu controle quanto a ruína causada à terra.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַעַשׂ
  choice: fará
  rationale: Traduz o sentido amplo de עשה, “fazer, agir”, sem especificar além do que o contexto permite.
- source_word: הַבָּא אֵלָיו
  choice: Aquele que vier contra ele
  rationale: Embora אֶל normalmente indique movimento em direção a alguém, o contexto militar dá à expressão o sentido de avanço hostil.
- source_word: כִּרְצוֹנוֹ
  choice: o que quiser
  rationale: Expressão corrente em português para “segundo a sua vontade”, comunicando liberdade irrestrita de ação.
- source_word: וְאֵין עוֹמֵד לְפָנָיו
  choice: e ninguém conseguirá resistir a ele
  rationale: Transmite com clareza o valor militar do idioma hebraico “ficar de pé diante de”, isto é, resistir ou fazer frente.
- source_word: וְיַעֲמֹד
  choice: Ele se estabelecerá
  rationale: Neste contexto político-militar, עמד indica tomar posição ou firmar presença, não apenas permanecer fisicamente em pé.
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: na Terra Formosa
  rationale: צְבִי pode denotar beleza, esplendor ou algo desejável; aqui funciona como designação geográfica da terra de Israel/Judá.
- source_word: וְכָלָה בְיָדוֹ
  choice: e a destruição estará em sua mão
  rationale: A frase hebraica é compacta e elíptica. Esta tradução conserva a imagem do poder destrutivo sob seu controle sem definir de modo excessivo a relação sintática.
theological_decisions:
- issue: Referência da “Terra Formosa”
  choice: Manter a designação metafórica no texto, entendida no contexto como a terra de Israel/Judá.
  alternative: Explicitar “a terra de Israel” ou traduzir “a terra gloriosa”.
  rationale: A designação geográfica é reconhecível no contexto de Daniel, mas explicitar Israel no corpo do versículo acrescentaria informação interpretativa não expressa diretamente pelo hebraico.
- issue: Sentido da cláusula final
  choice: “a destruição estará em sua mão”
  alternative: “ela será consumida em sua mão” ou “ele causará destruição”
  rationale: O hebraico admite análise nominal ou verbal e não esclarece plenamente se o foco está no poder destrutivo do invasor ou na ruína da terra. O texto principal preserva a concisão e a imagem, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fará o que quiser” e “ninguém conseguirá resistir” comunicam naturalmente os idiomas hebraicos; “Terra Formosa” preserva o caráter de título geográfico.
