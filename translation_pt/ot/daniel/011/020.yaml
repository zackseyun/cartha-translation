  source_fidelity: A tradução acompanha com precisão a sequência sucessória de וְעָמַד עַל־כַּנּוֹ, o envio de um agente arrecadador por meio do reino, a brevidade do período e a descrição deliberadamente não especificada de sua queda. “Será quebrado” conserva adequadamente a imagem metafórica de יִשָּׁבֵר, sem antecipar uma identificação histórica ou especificar morte, deposição ou ruína. “Não por ira nem em batalha” representa de modo aceitável as duas cláusulas negativas finais e não elimina de forma indevida a concisão hebraica.
