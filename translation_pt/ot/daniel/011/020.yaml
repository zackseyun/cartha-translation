  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָמַ֧ד עַל כַּנּ֛/וֹ מַעֲבִ֥יר נוֹגֵ֖שׂ הֶ֣דֶר מַלְכ֑וּת וּ/בְ/יָמִ֤ים אֲחָדִים֙ יִשָּׁבֵ֔ר וְ/לֹ֥א בְ/אַפַּ֖יִם וְ/לֹ֥א בְ/מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/020.yaml
  text: Then one will arise in his place who will send an exactor through the splendor of the kingdom[a]; but within a few days he will be broken[c][b], though not in anger and not in battle.
translation:
  language: pt
  text: Então se levantará em seu lugar alguém que enviará pelo esplendor do reino[b] um cobrador de tributos[a]; mas, dentro de poucos dias, ele será quebrado, não por ira[c] nem em batalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um agente de cobrança” ou “um opressor”. O termo hebraico designa alguém que exige tributo ou pagamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “a glória do reino”. A expressão pode se referir à parte mais esplêndida do território ou, de modo mais geral, à majestade do reino.
    reason: lexical_alternative
  - marker: c
    text: Ou “não em ira” ou “não pela ira”. A expressão hebraica é um tanto condensada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  choice: Então se levantará
  rationale: No contexto da sucessão de governantes em Daniel 11, עמד indica o surgimento do próximo governante; “então” expressa a progressão narrativa do waw.
- source_word: עַל כַּנּוֹ
  choice: em seu lugar
  rationale: A expressão idiomática indica que alguém assume a posição de seu predecessor.
- source_word: מַעֲבִיר
  choice: que enviará
  rationale: O particípio hifil de עבר descreve fazer um oficial percorrer o território; “enviará” comunica isso naturalmente sem a rigidez de “fará passar”.
- source_word: נוֹגֵשׂ
  choice: um cobrador de tributos
  rationale: O termo designa quem exige pagamentos ou tributos. A formulação é clara em português e mantém o contexto fiscal-político, enquanto alternativas mais amplas são registradas em nota.
- source_word: הֶדֶר מַלְכוּת
  choice: o esplendor do reino
  rationale: A tradução conserva a relação genitiva e a ambiguidade entre a parte mais esplêndida do território e a majestade do reino em sentido geral.
- source_word: וּבְיָמִים אֲחָדִים
  choice: dentro de poucos dias
  rationale: A expressão comunica um período breve, sem exigir uma contagem literal precisa.
- source_word: יִשָּׁבֵר
  choice: será quebrado
  rationale: Preserva a imagem metafórica do nifal de שבר e evita especificar indevidamente se o fim significa morte, ruína ou destituição.
- source_word: וְלֹא בְאַפַּיִם
  choice: não por ira
  rationale: אַפַּיִם é uma expressão corrente para ira, e a preposição ב pode indicar modo ou meio. A formulação mantém a construção hebraica comprimida e sua ambiguidade.
- source_word: וְלֹא בְמִלְחָמָה
  choice: nem em batalha
  rationale: “Batalha” expressa naturalmente o modo de sua queda e mantém o contraste com a cláusula anterior.
theological_decisions: []
