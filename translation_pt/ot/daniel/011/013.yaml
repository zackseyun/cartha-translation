base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/013.yaml
  text: Then the king of the north will return and raise a multitude greater than the former one[a]; and at the end of the times, after some years[c][b], he will surely come with a great army and with much equipment.
translation:
  language: pt
  text: Então o rei do norte voltará e reunirá uma multidão maior que a primeira[a]. Ao fim dos tempos, depois de alguns anos[b], ele certamente virá com um grande exército e muitos recursos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande multidão, maior que a anterior”. A expressão hebraica pode enfatizar tanto o tamanho quanto o número.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao fim dos tempos determinados, depois de anos”. A expressão hebraica é condensada e pode destacar que um período fixado chegou ao fim.
    reason: lexical_alternative
  - marker: c
    text: Ou “muitos bens” ou “muitos suprimentos”. O termo hebraico pode abranger posses e recursos materiais levados na campanha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Então ... voltará
  rationale: O qal de שׁוּב significa normalmente “voltar”. “Então” expressa com naturalidade a progressão narrativa indicada pela conjunção.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: o rei do norte
  rationale: Preserva o título direcional recorrente no capítulo sem identificar ou interpretar além do texto.
- source_word: וְהֶעֱמִיד
  choice: reunirá
  rationale: O hifil de עמד pode indicar fazer ficar de pé ou pôr em posição; neste contexto militar, refere-se a reunir ou mobilizar forças. “Reunirá” é claro e não restringe a imagem a um procedimento militar específico.
- source_word: הָמוֹן רַב
  choice: uma multidão maior
  rationale: הָמוֹן designa uma massa, multidão ou contingente numeroso. Com רַב e a comparação seguinte, “maior” comunica o aumento sem substituir o termo amplo por “exército” antes que חַיִל apareça.
- source_word: מִן הָרִאשׁוֹן
  choice: que a primeira
  rationale: A preposição מִן tem valor comparativo. O feminino em português retoma naturalmente “multidão”, o referente implícito da força anterior.
- source_word: וּלְקֵץ הָעִתִּים שָׁנִים
  choice: Ao fim dos tempos, depois de alguns anos
  rationale: 'A expressão hebraica é condensada: קֵץ indica “fim”, עִתִּים pode significar “tempos” ou “tempos determinados”, e שָׁנִים acrescenta a referência a anos. A tradução conserva os dois elementos temporais e registra a alternativa em nota.'
- source_word: יָבוֹא בּוֹא
  choice: ele certamente virá
  rationale: O infinitivo absoluto junto ao verbo finito intensifica a afirmação; “certamente virá” reproduz essa ênfase em português corrente.
- source_word: בְּחַיִל גָּדוֹל
  choice: com um grande exército
  rationale: Embora חַיִל possa significar força, riqueza ou capacidade, o contexto de campanha militar favorece “exército”.
- source_word: וּבִרְכוּשׁ רָב
  choice: e muitos recursos
  rationale: רְכוּשׁ abrange bens, posses e recursos materiais. “Recursos” mantém essa amplitude e se ajusta ao contexto de uma campanha, sem limitar o sentido apenas a armas ou suprimentos.
