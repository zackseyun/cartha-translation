  text: וּ/מָשַׁ֗ל בְּ/מִכְמַנֵּי֙ הַ/זָּהָ֣ב וְ/הַ/כֶּ֔סֶף וּ/בְ/כֹ֖ל חֲמֻד֣וֹת מִצְרָ֑יִם וְ/לֻבִ֥ים וְ/כֻשִׁ֖ים בְּ/מִצְעָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/043.yaml
  text: And he will rule over the treasures of gold and silver[a], and over all the precious things of Egypt[b]; and the Libyans and Cushites will be in his train.
translation:
  language: pt
  text: Ele terá domínio sobre os tesouros de ouro e prata e sobre todas as coisas preciosas do Egito; os líbios e os cuxitas seguirão seus passos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «estarão em seu séquito».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁל
  choice: Ele terá domínio sobre
  rationale: O verbo מָשַׁל indica exercer domínio ou controle. A formulação é natural e digna, e se ajusta melhor a bens do que «governará».
- source_word: בְּמִכְמַנֵּי
  choice: sobre os tesouros
  rationale: מִכְמָן designa algo escondido ou guardado em reserva. «Tesouros» comunica naturalmente o referente no contexto; a nuance de depósitos ocultos é registrada em nota.
- source_word: הַזָּהָב וְהַכֶּסֶף
  choice: de ouro e prata
  rationale: Equivalentes correntes e diretos para os dois metais preciosos.
- source_word: וּבְכֹל חֲמֻדוֹת מִצְרָיִם
  choice: e sobre todas as coisas preciosas do Egito
  rationale: חֲמֻדוֹת abrange coisas desejáveis ou valiosas, sem restringir o sentido a dinheiro ou tesouros monetários.
- source_word: לֻבִים
  choice: os líbios
  rationale: O etnônimo se refere convencionalmente aos líbios ou povos líbios; a forma traduzida favorece a compreensão.
- source_word: כֻשִׁים
  choice: os cuxitas
  rationale: Preserva o nome histórico-geográfico de Cuxe e evita identificar diretamente o povo com uma nacionalidade moderna.
- source_word: בְּמִצְעָדָיו
  choice: seguirão seus passos
  rationale: A expressão envolve passos, marcha ou deslocamento. A tradução preserva a imagem hebraica e a possível ideia de acompanhar o avanço dele, sem definir se isso ocorre como aliados, séquito ou povos subjugados.
theological_decisions:
- issue: Relação dos líbios e cuxitas com o governante
  choice: seguirão seus passos
  alternative: estarão em seu séquito
  rationale: O hebraico é conciso e não especifica claramente a natureza da relação. A opção escolhida conserva a imagem de marcha e evita determinar que sejam aliados voluntários, servos ou cativos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Terá domínio» evita a estranheza de dizer que alguém «governa» tesouros; «cuxitas» mantém a geografia histórica. A única nota preserva a ambiguidade de בְּמִצְעָדָיו.
