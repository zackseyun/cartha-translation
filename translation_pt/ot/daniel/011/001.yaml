  text: וַ/אֲנִי֙ בִּ/שְׁנַ֣ת אַחַ֔ת לְ/דָרְיָ֖וֶשׁ הַ/מָּדִ֑י עָמְדִ֛/י לְ/מַחֲזִ֥יק וּ/לְ/מָע֖וֹז לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/001.yaml
  text: And as for me[a], in the first year of Darius the Mede[b], I stood up to strengthen and be a fortress to him.
translation:
  language: pt
  text: Quanto a mim, no primeiro ano de Dario, o Medo,[a] levantei-me para fortalecê-lo e ser-lhe uma fortaleza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, pertencente ao povo da Média.
    reason: reader_clarity
  - marker: b
    text: 'Ou: “fiquei de pé para fortalecê-lo e ser-lhe uma fortaleza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: O pronome independente, ligado pela conjunção, retoma o falante com leve ênfase; a expressão portuguesa preserva essa transição discursiva.
- source_word: בִּשְׁנַת אַחַת
  choice: no primeiro ano
  rationale: Em uma datação de reinado, a expressão idiomática indica o primeiro ano.
- source_word: לְדָרְיָוֶשׁ הַמָּדִי
  choice: de Dario, o medo
  rationale: A preposição integra a fórmula de datação régia. A vírgula deixa claro que «medo» é o gentílico referente ao povo da Média, não o substantivo português «medo».
- source_word: עָמְדִי
  choice: tomei posição
  rationale: עמד pode significar ficar de pé ou tomar posição; aqui introduz uma atuação deliberada em favor de alguém.
- source_word: לְמַחֲזִיק
  choice: para lhe dar força
  rationale: O infinitivo causativo de חזק expressa fortalecer ou sustentar. A formulação é natural em português e mantém a ideia de conferir força.
- source_word: וּלְמָעוֹז
  choice: e servir-lhe de fortaleza
  rationale: מָעוֹז é um substantivo que designa fortaleza, baluarte ou lugar de proteção. A tradução conserva a metáfora nominal em vez de reduzi-la ao verbo «proteger».
- source_word: לוֹ
  choice: lhe
  rationale: O pronome masculino singular refere-se mais naturalmente a Dario no contexto, mas a forma pronominal não acrescenta identificação além do texto.
theological_decisions:
- issue: Identidade do falante e referente do pronome
  choice: O texto mantém a fala da figura angelical do contexto anterior, e o pronome é naturalmente entendido como referência a Dario.
  alternative: A divisão discursiva ou capitular pode levar alguns leitores a relacionar o versículo mais estreitamente ao encerramento do capítulo anterior.
  rationale: A tradução não identifica a figura angelical de modo especulativo e conserva o referente masculino sem inserir explicações doutrinárias.
- issue: Valor metafórico de מָעוֹז
  choice: Conservar a imagem de alguém que serve de fortaleza.
  alternative: Traduzir funcionalmente como «proteger».
  rationale: O hebraico emprega um substantivo concreto; preservar a metáfora comunica tanto apoio quanto proteção sem estreitar o sentido.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. «Dario, o medo» preserva o gentílico bíblico tradicional, esclarecido em nota para evitar confusão com o substantivo homógrafo. A sintaxe mantém a metáfora de fortaleza presente no hebraico.
