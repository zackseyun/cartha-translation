  text: וּ/מַשְׂכִּ֣ילֵי עָ֔ם יָבִ֖ינוּ לָֽ/רַבִּ֑ים וְ/נִכְשְׁל֞וּ בְּ/חֶ֧רֶב וּ/בְ/לֶהָבָ֛ה בִּ/שְׁבִ֥י וּ/בְ/בִזָּ֖ה יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/033.yaml
  text: And those among the people who have insight will give understanding to the many[a], but they will stumble by sword and by flame, by captivity and by plunder[d][c][b], for days.
translation:
  language: pt
  text: Os que têm discernimento entre o povo darão entendimento a muitos[a], mas tropeçarão[b] pela espada e pela chama, pelo cativeiro[c] e pelo saque, por dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instruirão muitos” ou “farão muitos entender”.
    reason: lexical_alternative
  - marker: b
    text: Ou “cairão”. A imagem hebraica pode indicar colapso, derrota ou morte em meio à perseguição.
    reason: lexical_alternative
  - marker: c
    text: Ou “para o cativeiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּילֵי עָם
  choice: os que têm discernimento entre o povo
  rationale: Preserva o sentido participial de pessoas dotadas de discernimento e mantém עָם como “o povo”, sem explicitar uma identificação que o hebraico não acrescenta.
- source_word: יָבִינוּ לָרַבִּים
  choice: darão entendimento a muitos
  rationale: 'O hifil de בין com לָרַבִּים tem força causativa ou instrutiva: essas pessoas comunicam entendimento. “A muitos” soa natural em português sem excluir a possível leitura substantivada de “os muitos”.'
- source_word: וְנִכְשְׁלוּ
  choice: mas tropeçarão
  rationale: Mantém a imagem hebraica, que pode abranger queda, derrota, sofrimento ou morte, sem restringir antecipadamente seu alcance.
- source_word: בְּחֶרֶב וּבְלֶהָבָה
  choice: pela espada e pela chama
  rationale: A preposição ב marca aqui o meio ou a causa. “Chama” conserva a imagem específica de לֶהָבָה e o paralelismo da enumeração.
- source_word: בִּשְׁבִי וּבְבִזָּה
  choice: pelo cativeiro e pelo saque
  rationale: Reproduz a estrutura paralela com ב e emprega termos atuais e claros para o estado de cativeiro e a espoliação.
- source_word: יָמִים
  choice: por alguns dias
  rationale: O plural sem determinação funciona adverbialmente e indica duração indefinida. Em português, “por alguns dias” expressa isso de modo natural, sem convertê-lo em fórmula escatológica.
theological_decisions:
- issue: Se נִכְשְׁלוּ deve ser vertido como destruição total ou como uma imagem mais ampla de queda sob perseguição.
  choice: mas tropeçarão
  alternative: mas cairão / mas serão derrotados
  rationale: '“Tropeçarão” conserva a metáfora e sua tensão: o contexto permite sofrimento gravíssimo e até morte, mas o verbo não exige que todos os casos sejam definidos exclusivamente como morte.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção evita arcaísmos, preserva o paralelismo da lista de sofrimentos e mantém a ambiguidade semântica do verbo “tropeçar”.
