  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָשָׂ֞ה לְ/מִבְצְרֵ֤י מָֽעֻזִּים֙ עִם אֱל֣וֹהַּ נֵכָ֔ר אֲשֶׁ֥ר הכיר יַרְבֶּ֣ה כָב֑וֹד וְ/הִמְשִׁילָ/ם֙ בָּֽ/רַבִּ֔ים וַ/אֲדָמָ֖ה יְחַלֵּ֥ק בִּ/מְחִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/039.yaml
  text: And he will act against the strongest fortresses with a foreign god[a]. Those whom he acknowledges, he will increase with honor, and he will make them rule over many[d][c][b], and he will divide land for a price.
translation:
  language: pt
  text: Ele agirá contra as fortalezas mais poderosas com um deus estrangeiro[a]. Aos que ele reconhecer, concederá grande honra; fará com que governem sobre muitos e repartirá terras por um preço[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de um deus estrangeiro”. A expressão hebraica também pode ser entendida como “contra fortalezas fortificadas” ou “para as fortalezas dos lugares fortes”.
    reason: A preposição pode indicar acompanhamento ou meio, e a expressão hebraica referente às fortalezas é compacta e admite pequenas variações de análise.
  - marker: b
    text: Ou “repartirá terras em troca de pagamento” ou “como recompensa”. A expressão indica uma distribuição de terras de caráter transacional.
    reason: מְחִיר pode designar preço ou pagamento, sem esclarecer se a compensação é monetária ou política.
lexical_decisions:
- source_word: וְעָשָׂה
  choice: Ele agirá
  rationale: O verbo עשה é amplo, mas, neste contexto militar e político, “agirá” é natural e mantém o complemento aberto sem explicitar além do hebraico.
- source_word: לְמִבְצְרֵי מָעֻזִּים
  choice: contra as fortalezas mais poderosas
  rationale: מִבְצָר designa uma fortificação, e מָעוֹז, força ou lugar fortificado. A preposição לְ é entendida contextualmente como direcional ou adversativa; a formulação comunica a força intensiva da expressão compacta.
- source_word: עִם אֱלוֹהַּ נֵכָר
  choice: com um deus estrangeiro
  rationale: עִם normalmente significa “com” e pode indicar acompanhamento ou meio. A tradução preserva essa ambiguidade.
- source_word: אֲשֶׁר הִכִּיר
  choice: Aos que ele reconhecer
  rationale: O hifil de נכר pode significar “reconhecer” ou “admitir”. A forma verbal na terceira pessoa masculina singular aponta mais naturalmente para o rei como sujeito e certas pessoas como objeto.
- source_word: יַרְבֶּה כָבוֹד
  choice: concederá grande honra
  rationale: A expressão comprimida indica que ele fará a honra aumentar ou abundar para essas pessoas. Esta formulação é clara em português e preserva o sentido causativo.
- source_word: וְהִמְשִׁילָם בָּרַבִּים
  choice: fará com que governem sobre muitos
  rationale: No hifil, משל significa “fazer governar” ou “constituir governante”; בָּרַבִּים é adequadamente entendido como “sobre muitos”.
- source_word: וַאֲדָמָה יְחַלֵּק בִּמְחִיר
  choice: repartirá terras por um preço
  rationale: אֲדָמָה é terra ou solo, חלק no piel indica dividir ou repartir, e מְחִיר denota preço ou pagamento. O plural idiomático “terras” é natural em português, sem definir a natureza da transação.
theological_decisions:
- issue: Referente das pessoas reconhecidas na segunda oração
  choice: O rei reconhece certos apoiadores e lhes concede honra e autoridade.
  alternative: Os que reconhecem o deus estrangeiro, ou os que reconhecem o rei, são recompensados.
  rationale: 'A sintaxe hebraica toma mais naturalmente הִכִּיר como verbo na terceira pessoa masculina singular, tendo o rei por sujeito: “aos que ele reconhecer”. Isso evita inserir uma afirmação teológica mais específica sobre adoradores do deus estrangeiro.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, e as ambiguidades relevantes foram mantidas no texto ou registradas em notas.
