base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/042.yaml
  text: He will stretch out his hand against the countries[a], and the land of Egypt will not escape.
translation:
  language: pt
  text: Ele estenderá a mão contra os países, e a terra do Egito não escapará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não terá escape”. Lit.: “não será para fuga”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁלַח
  choice: estenderá
  rationale: O verbo שׁלח pode significar “enviar” ou “estender”. Com “a mão” como objeto, descreve figuradamente o exercício de poder ou uma ação hostil; “estenderá” preserva a imagem hebraica sem explicá-la em excesso.
- source_word: יָדוֹ
  choice: a mão
  rationale: A expressão “estenderá a mão” é natural em português e conserva a metáfora hebraica de exercer poder ou agir contra alguém. O possessivo já está indicado pelo sujeito e não precisa ser repetido.
- source_word: בָּאֲרָצוֹת
  choice: contra os países
  rationale: Neste contexto militar, a preposição בְּ é bem representada por “contra”. O plural אֲרָצוֹת refere-se a territórios ou países, e “países” oferece clareza moderna.
- source_word: וְאֶרֶץ מִצְרַיִם
  choice: e a terra do Egito
  rationale: Mantém a construção explícita do hebraico e seu destaque geográfico, em vez de reduzi-la simplesmente a “Egito”.
- source_word: לֹא תִהְיֶה לִפְלֵיטָה
  choice: não escapará
  rationale: פְּלֵיטָה pode indicar escape, livramento ou sobreviventes. Aqui, a formulação idiomática comunica que o Egito não ficará fora do alcance do rei, enquanto a nota preserva a forma incomum e a alternativa lexical do hebraico.
