base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/007.yaml
  text: And one from a branch of her roots shall arise in his place[a], and he shall come against the army and enter the fortress of the king of the north[d][c][b], and he shall act against them and prevail.
translation:
  language: pt
  text: Em seu lugar, surgirá um rebento das raízes dela[a]. Ele avançará contra o exército e entrará na fortaleza do rei do norte[b]. Agirá contra eles[c] e prevalecerá[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um broto das raízes dela”, isto é, alguém de sua linhagem familiar.
    reason: lexical_alternative
  - marker: b
    text: Ou “entrará no reduto fortificado do rei do norte”.
    reason: lexical_alternative
  - marker: c
    text: Ou “lidará com eles” ou “agirá entre eles”; a expressão hebraica tem sentido amplo.
    reason: lexical_alternative
  - marker: d
    text: Ou “mostrará força” ou “obterá vantagem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  choice: surgirá
  rationale: Em um contexto de sucessão dinástica, עמד indica que alguém surge ou se apresenta como sucessor, não apenas que fica fisicamente em pé.
- source_word: מִנֵּצֶר שָׁרָשֶׁיהָ
  choice: um rebento das raízes dela
  rationale: נֵצֶר designa um broto ou rebento. A tradução preserva a metáfora vegetal e sua referência implícita à linhagem familiar.
- source_word: כַּנּוֹ
  choice: em seu lugar
  rationale: A expressão indica substituição ou sucessão, mas esta formulação evita identificar de modo interpretativo o antecedente do pronome.
- source_word: הַחַיִל
  choice: o exército
  rationale: Neste contexto militar, חַיִל se refere a uma força armada, e “exército” é a expressão mais clara e natural.
- source_word: בְּמָעוֹז מֶלֶךְ הַצָּפוֹן
  choice: entrará na fortaleza do rei do norte
  rationale: מָעוֹז denota um lugar fortificado ou de força. Com o verbo de movimento, a preposição é naturalmente expressa como entrada na fortaleza.
- source_word: וְעָשָׂה בָהֶם
  choice: agirá contra eles
  rationale: A construção עשה ב é ampla e pode significar agir contra, tratar ou operar entre. O contexto militar favorece ação hostil sem especificar além do hebraico.
- source_word: וְהֶחֱזִיק
  choice: prevalecerá
  rationale: O hifil de חזק pode indicar mostrar força, tornar-se forte ou obter vantagem. “Prevalecerá” comunica de modo conciso o êxito no contexto militar.
