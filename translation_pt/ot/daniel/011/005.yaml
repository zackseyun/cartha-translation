id: DAN.11.5
reference: Daniel 11:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יֶחֱזַ֥ק מֶֽלֶךְ הַ/נֶּ֖גֶב וּ/מִן שָׂרָ֑י/ו וְ/יֶחֱזַ֤ק עָלָי/ו֙ וּ/מָשָׁ֔ל מִמְשָׁ֥ל רַ֖ב מֶמְשַׁלְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/005.yaml
  text: Then the king of the South will grow strong[a], but one of his commanders will grow stronger than he and will rule, and his dominion will be a great dominion.
translation:
  language: pt
  text: Então o rei do Sul se tornará forte, mas um dos seus comandantes se tornará mais forte do que ele e governará; seu domínio será um grande domínio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e um dos seus príncipes se tornará forte sobre ele e governará; seu governo será um grande domínio”. A construção hebraica é compacta e admite uma tradução mais literal; o texto principal expressa a provável força comparativa com mais clareza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶחֱזַק
  choice: se tornará forte
  rationale: O qal imperfeito de חזק indica aqui adquirir ou demonstrar força política e militar; a formulação preserva a orientação futura da visão.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: o rei do Sul
  rationale: Mantém o título político-direcional recorrente em Daniel 11, em linguagem natural e sem identificar interpretativamente o monarca.
- source_word: וּמִן שָׂרָיו
  choice: mas um dos seus comandantes
  rationale: מן com o plural e sufixo sugere alguém dentre os oficiais do rei; שַׂר, neste contexto político-militar, é bem expresso por “comandantes”. “Mas” explicita o contraste contextual sem alterar sua substância.
- source_word: וְיֶחֱזַק עָלָיו
  choice: se tornará mais forte do que ele
  rationale: עַל junto de חזק exprime superioridade em relação ao rei anteriormente mencionado; o comparativo é idiomático em português.
- source_word: וּמָשָׁל
  choice: governará
  rationale: O perfeito com waw prossegue a sequência profética; “governará” comunica claramente o exercício de autoridade.
- source_word: מִמְשָׁל רַב מֶמְשַׁלְתּוֹ
  choice: seu domínio será um grande domínio
  rationale: A repetição de “domínio” procura refletir a ênfase e o jogo lexical entre מִמְשָׁל e מֶמְשָׁלָה, ainda que a construção seja marcada em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva “rei do Sul” como fórmula recorrente do capítulo e evita identificar historicamente as personagens. A repetição deliberada de “domínio” conserva a ênfase do hebraico.
