  text: וּ/לְ/קֵ֤ץ שָׁנִים֙ יִתְחַבָּ֔רוּ וּ/בַ֣ת מֶֽלֶךְ הַ/נֶּ֗גֶב תָּבוֹא֙ אֶל מֶ֣לֶךְ הַ/צָּפ֔וֹן לַ/עֲשׂ֖וֹת מֵישָׁרִ֑ים וְ/לֹֽא תַעְצֹ֞ר כּ֣וֹחַ הַ/זְּר֗וֹעַ וְ/לֹ֤א יַעֲמֹד֙ וּ/זְרֹע֔/וֹ וְ/תִנָּתֵ֨ן הִ֤יא וּ/מְבִיאֶ֨י/הָ֙ וְ/הַ/יֹּ֣לְדָ֔/הּ וּ/מַחֲזִקָ֖/הּ בָּ/עִתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/006.yaml
  text: At the end of years they will join together[a], and the daughter of the king of the South will come to the king of the North to make an agreement. But she will not retain the strength of her arm, and he and his arm will not stand; and she will be given up, along with those who brought her, and the one who fathered her[b], and the one who supported her in those times.
translation:
  language: pt
  text: Ao fim de alguns anos, eles se aliarão. A filha do rei do Sul irá ao rei do Norte para estabelecer um acordo[a]. Mas ela não conservará a força do seu braço, nem ele nem seu braço permanecerão. Ela será entregue, juntamente com os que a levaram, aquele que a gerou[b] e aquele que lhe dava apoio naqueles tempos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para estabelecer condições justas” ou “para promover um acordo equitativo”. Em hebraico, a expressão fala literalmente de “fazer retidões/equidades”.
    reason: lexical_alternative
  - marker: b
    text: “Aquele que a gerou” segue a forma masculina do particípio hebraico. Algumas traduções trazem “filho” ou “criança”, ou entendem que a expressão se refere a outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקֵץ שָׁנִים
  choice: Passados alguns anos
  rationale: A expressão indica o término de um período de anos. A formulação idiomática comunica isso com naturalidade em português sem exigir que se trate do fim absoluto de uma era.
- source_word: יִתְחַבָּרוּ
  choice: eles se aliarão
  rationale: O hitpael de חבר descreve pessoas que se unem; no contexto político, “se aliarão” expressa com clareza essa associação sem definir seus termos.
- source_word: וּבַת מֶלֶךְ הַנֶּגֶב
  choice: A filha do rei do Sul
  rationale: Mantém a relação de parentesco e o título político-direcional usado ao longo de Daniel 11.
- source_word: תָּבוֹא אֶל מֶלֶךְ הַצָּפוֹן
  choice: irá ao rei do Norte
  rationale: בוא pode ser vertido por “vir” ou “ir” conforme o ponto de vista. “Irá ao” descreve naturalmente o deslocamento da filha até o rei do Norte.
- source_word: לַעֲשׂוֹת מֵישָׁרִים
  choice: para estabelecer um acordo
  rationale: מֵישָׁרִים denota retidão, equidade ou condições justas; no contexto diplomático, a expressão aponta para a celebração de um acordo. A nota preserva o matiz literal.
- source_word: וְלֹא תַעְצֹר כּוֹחַ הַזְּרוֹעַ
  choice: ela não conservará a força do seu braço
  rationale: עצר tem aqui o sentido de reter ou conservar, e “braço” é a metáfora hebraica para força ou poder. A tradução conserva tanto a ideia quanto a imagem.
- source_word: וְלֹא יַעֲמֹד וּזְרֹעוֹ
  choice: e nem ele nem o seu braço permanecerão
  rationale: O masculino singular provavelmente aponta para o rei do Norte, enquanto “seu braço” representa seu poder ou apoio. “Permanecer” comunica o sentido contextual de עמד sem eliminar a metáfora.
- source_word: וְתִנָּתֵן הִיא
  choice: Ela será entregue
  rationale: O nifal de נתן é passivo e indica que ela será entregue ou abandonada ao poder de outros.
- source_word: וּמְבִיאֶיהָ
  choice: os que a levaram
  rationale: O particípio de בוא com sufixo designa aqueles que a conduziram ou acompanharam até o rei do Norte.
- source_word: וְהַיֹּלְדָהּ
  choice: aquele que a gerou
  rationale: A forma participial masculina favorece a referência ao homem que a gerou. A redação mantém essa indicação gramatical sem substituir a expressão pela identificação interpretativa “pai”.
- source_word: וּמַחֲזִקָהּ
  choice: aquele que lhe dava apoio
  rationale: O particípio hiphil de חזק pode significar fortalecer, sustentar ou apoiar. A locução escolhida admite tanto apoio pessoal quanto político.
- source_word: בָּעִתִּים
  choice: naqueles tempos
  rationale: Preserva o plural hebraico e descreve naturalmente o período histórico em questão.
