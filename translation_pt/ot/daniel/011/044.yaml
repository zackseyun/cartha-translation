  text: וּ/שְׁמֻע֣וֹת יְבַהֲלֻ֔/הוּ מִ/מִּזְרָ֖ח וּ/מִ/צָּפ֑וֹן וְ/יָצָא֙ בְּ/חֵמָ֣א גְדֹלָ֔ה לְ/הַשְׁמִ֥יד וּֽ/לְ/הַחֲרִ֖ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/044.yaml
  text: But reports from the east and from the north will alarm him[b][a], and he will go out with great fury to destroy and to devote many to destruction.
translation:
  language: pt
  text: Mas notícias do leste e do norte o alarmarão[a], e ele sairá com grande furor para destruir e consagrar muitos à destruição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “relatos” ou “rumores do leste e do norte”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico pode significar “colocar sob interdição” ou “consagrar à destruição”; é mais específico que o verbo anterior, traduzido por “destruir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֻעוֹת
  choice: notícias
  rationale: O plural designa coisas ouvidas e, neste contexto, informações recebidas. “Notícias” é natural em português moderno e não pressupõe que sejam boatos, embora essa possibilidade lexical permaneça indicada em nota.
- source_word: יְבַהֲלֻהוּ
  choice: o deixarão alarmado
  rationale: O piel de בהל expressa causar perturbação súbita ou alarme. A formulação preserva a força causativa sem intensificá-la necessariamente até “aterrorizar”.
- source_word: מִמִּזְרָח וּמִצָּפוֹן
  choice: vindas do leste e do norte
  rationale: Mantém a origem geográfica paralela das notícias em linguagem corrente e clara.
- source_word: וְיָצָא
  choice: Então ele sairá
  rationale: יצא significa basicamente “sair”. “Então” expressa a sequência narrativa do waw sem acrescentar ao verbo uma especificação militar que o contexto apenas sugere.
- source_word: בְּחֵמָא גְדֹלָה
  choice: com grande furor
  rationale: חֵמָה denota ira intensa, ardor ou furor. A expressão é vívida, digna e adequada ao contexto.
- source_word: לְהַשְׁמִיד
  choice: para destruir
  rationale: O infinitivo hifil de שׁמד significa destruir ou exterminar. “Destruir” preserva o sentido amplo sem especificar além do texto.
- source_word: וּלְהַחֲרִים
  choice: e entregar muitos à destruição
  rationale: O hifil de חרם pode indicar colocar sob interdição ou consagrar à destruição. A formulação distingue este verbo do anterior e comunica o resultado em português compreensível.
- source_word: רַבִּים
  choice: muitos
  rationale: Equivalente direto e natural do substantivado רַבִּים.
theological_decisions:
- issue: Sentido de חרם em contexto de guerra e juízo
  choice: entregar muitos à destruição
  alternative: exterminar completamente muitos; colocar muitos sob interdição
  rationale: O hebraico usa חרם depois de שׁמד, favorecendo a preservação de alguma distinção entre os verbos. A escolha reflete a ideia específica de destinação à destruição sem impor uma interpretação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural sobretudo para o público brasileiro. A ordem das notas foi ajustada para que cada marcador apareça junto ao termo que explica. “Leste” foi preferido a “oriente” por clareza geográfica contemporânea; a repetição hebraica das duas finalidades foi preservada.
