  text: וְ/עַל אֱלֹהֵ֤י אֲבֹתָי/ו֙ לֹ֣א יָבִ֔ין וְ/עַל חֶמְדַּ֥ת נָשִׁ֛ים וְ/עַֽל כָּל אֱל֖וֹהַּ לֹ֣א יָבִ֑ין כִּ֥י עַל כֹּ֖ל יִתְגַּדָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/037.yaml
  text: He will show no regard for the gods of his fathers[a], or for the desire of women, or for any god[b], because he will magnify himself above all.
translation:
  language: pt
  text: Não dará atenção aos deuses de seus pais[a], nem ao desejo das mulheres[b], nem a deus algum, pois se engrandecerá acima de todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao Deus de seus pais”. A forma hebraica é plural (“deuses de”), mas alguns entendem aqui a conhecida expressão referente ao Deus de Israel.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “o desejo das mulheres”. A expressão pode significar “aquilo que as mulheres desejam” ou “aquele que é desejado pelas mulheres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: os deuses de seus pais
  rationale: A forma construta אֱלֹהֵי é morfologicamente plural. Embora a expressão possa ser entendida como referência singular ao Deus de seus pais, o contexto menciona também qualquer deus; por isso, mantém-se no texto principal a leitura plural mais direta.
- source_word: לֹא יָבִין
  choice: não dará atenção
  rationale: Embora בין signifique literalmente “entender” ou “considerar”, a construção com עַל neste contexto expressa falta de atenção, consideração ou respeito. “Não dará atenção” comunica esse valor idiomático com naturalidade.
- source_word: חֶמְדַּת נָשִׁים
  choice: o desejo das mulheres
  rationale: A tradução direta preserva a ambiguidade da construção hebraica, que pode indicar aquilo que as mulheres desejam ou alguém desejado por elas.
- source_word: כָּל אֱלוֹהַּ
  choice: deus algum
  rationale: כָּל com o substantivo singular tem sentido distributivo. Na oração negativa, “nem a deus algum” é a formulação portuguesa mais natural para “nem a qualquer deus”.
- source_word: כִּי עַל כֹּל יִתְגַּדָּל
  choice: pois se engrandecerá acima de todos
  rationale: O hitpael de גדל indica autoexaltação, preservada por “se engrandecerá”. “Acima de todos” mantém o alcance amplo de עַל כֹּל sem especificar além do hebraico.
theological_decisions:
- issue: Interpretação de חֶמְדַּת נָשִׁים
  choice: Manter no texto principal a expressão ambígua “o desejo das mulheres”.
  alternative: “Aquilo que as mulheres desejam” ou “aquele que é desejado pelas mulheres”.
  rationale: O hebraico admite mais de uma interpretação, inclusive possíveis referências a relações, filhos, uma divindade ou uma figura esperada. A tradução não deve impor uma identificação histórica ou doutrinária específica.
- issue: Número de אֱלֹהֵי אֲבֹתָיו
  choice: 'Traduzir no plural: “os deuses de seus pais”.'
  alternative: “O Deus de seus pais”.
  rationale: A morfologia plural e o contexto favorecem a leitura plural, mas a conhecida expressão bíblica singular constitui uma alternativa relevante e, por isso, é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formulação acessível no Brasil e compreensível internacionalmente. Emprega-se “pais” para conservar de perto a expressão hebraica, e “deus” em minúscula no uso genérico.
