  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם רַבִּ֥ים יַֽעַמְד֖וּ עַל מֶ֣לֶךְ הַ/נֶּ֑גֶב וּ/בְנֵ֣י פָּרִיצֵ֣י עַמְּ/ךָ֗ יִֽנַּשְּׂא֛וּ לְ/הַעֲמִ֥יד חָז֖וֹן וְ/נִכְשָֽׁלוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/014.yaml
  text: And in those times many will rise up against the king of the South[a], and the violent among your people will lift themselves up to establish the vision[c][b], but they will stumble.
translation:
  language: pt
  text: E, naqueles tempos, muitos se levantarão contra o rei do Sul, e os violentos dentre o teu povo[a] se exaltarão para estabelecer a visão[b], mas tropeçarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os filhos dos violentos do teu povo”. A construção hebraica é mais complexa do que a tradução fluente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para cumprir a visão”. A expressão hebraica diz literalmente “para fazer a visão ficar de pé”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: E naqueles tempos
  rationale: Preserva o enquadramento temporal e o plural do hebraico em português natural.
- source_word: יַעַמְדוּ עַל
  choice: se levantarão contra
  rationale: No contexto de conflito, a expressão indica oposição hostil, não apenas permanecer de pé.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: o rei do Sul
  rationale: Em Daniel 11, o termo funciona como designação geopolítica direcional; a inicial maiúscula sinaliza o título contextual.
- source_word: וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: os violentos dentre o seu povo
  rationale: Comunica a caracterização negativa de פָּרִיצִים sem reproduzir de modo obscuro a expressão hebraica literalmente mais complexa, 'filhos dos violentos'.
- source_word: יִנַּשְּׂאוּ
  choice: se exaltarão
  rationale: Expressa de modo natural o sentido reflexivo de autoengrandecimento ou autoafirmação.
- source_word: לְהַעֲמִיד חָזוֹן
  choice: para estabelecer a visão
  rationale: Mantém o sentido básico de 'fazer ficar de pé, estabelecer' e evita decidir se o grupo pretende cumprir, confirmar ou concretizar a visão.
- source_word: וְנִכְשָׁלוּ
  choice: mas tropeçarão
  rationale: Preserva a imagem hebraica e sua abertura semântica para fracasso ou queda.
theological_decisions:
- issue: Identidade e caracterização de וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: os violentos dentre o seu povo
  alternative: os filhos dos violentos do seu povo; os transgressores dentre o seu povo
  rationale: A tradução conserva a avaliação negativa sem identificar o grupo com uma seita ou movimento histórico-teológico específico não nomeado no texto.
- issue: Sentido de לְהַעֲמִיד חָזוֹן
  choice: para estabelecer a visão
  alternative: para cumprir a visão
  rationale: O verbo hebraico não diz explicitamente 'cumprir'. A formulação principal preserva a tensão entre tentar concretizar a visão e contribuir para sua confirmação ou realização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega futuro simples para o discurso profético e mantém concisão e paralelismo. O pronome 'seu' segue a referência singular a Daniel presente em 'seu povo'.
