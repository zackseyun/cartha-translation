  text: בְּ/שַׁלְוָ֞ה וּ/בְ/מִשְׁמַנֵּ֣י מְדִינָה֮ יָבוֹא֒ וְ/עָשָׂ֗ה אֲשֶׁ֨ר לֹא עָשׂ֤וּ אֲבֹתָי/ו֙ וַ/אֲב֣וֹת אֲבֹתָ֔י/ו בִּזָּ֧ה וְ/שָׁלָ֛ל וּ/רְכ֖וּשׁ לָ/הֶ֣ם יִבְז֑וֹר וְ/עַ֧ל מִבְצָרִ֛ים יְחַשֵּׁ֥ב מַחְשְׁבֹתָ֖י/ו וְ/עַד עֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/024.yaml
  text: 'In a time of security he will come into the richest parts of the province[a], and he will do what neither his fathers nor his fathers’ fathers did: he will scatter among them plunder, spoil, and goods; and against fortresses he will devise his plans[c][b], but only until a time.'
translation:
  language: pt
  text: 'Em plena segurança, ele entrará nas regiões mais ricas da província[a] e fará o que nem seus pais nem os pais de seus pais fizeram: distribuirá entre eles despojo, saque e bens[b]. Tramará seus planos contra fortalezas[c], mas somente até certo tempo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “De modo pacífico, ele entrará nas regiões mais ricas da província” ou “Inesperadamente, ele entrará nas regiões mais ricas da província”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “espalhará entre eles despojo, saque e bens”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Conspirará contra fortalezas”. Quanto ao final do versículo, também é possível: “até o tempo determinado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשַׁלְוָה
  choice: Em plena segurança
  rationale: שַׁלְוָה pode indicar tranquilidade, segurança ou prosperidade. A expressão conserva o cenário de calma e segurança sem afirmar que a entrada será necessariamente pacífica; outras possibilidades ficam registradas em nota.
- source_word: וּבְמִשְׁמַנֵּי מְדִינָה
  choice: nas regiões mais ricas da província
  rationale: מִשְׁמַנִּים significa literalmente lugares de gordura ou abundância e, de modo idiomático, as regiões férteis ou prósperas. מְדִינָה é mantido no sentido administrativo comum de província.
- source_word: יָבוֹא
  choice: entrará
  rationale: O verbo comum significa vir ou entrar. 'Entrará' exprime o movimento no contexto sem acrescentar a força militar específica de 'invadirá'.
- source_word: וְעָשָׂה אֲשֶׁר לֹא עָשׂוּ
  choice: fará o que ... fizeram
  rationale: A formulação direta preserva a comparação enfática entre esse governante e seus predecessores.
- source_word: אֲבֹתָיו וַאֲבוֹת אֲבֹתָיו
  choice: seus pais nem os pais de seus pais
  rationale: Mantém a repetição explícita do hebraico e sua força retórica, em vez de reduzi-la simplesmente a 'antepassados'.
- source_word: בִּזָּה וְשָׁלָל וּרְכוּשׁ
  choice: despojo, saque e bens
  rationale: 'Preserva a acumulação de três substantivos próximos, mas não idênticos: bens tomados, saque e propriedade ou riqueza.'
- source_word: לָהֶם יִבְזוֹר
  choice: distribuirá entre eles
  rationale: בזר significa espalhar ou dispersar. Neste contexto, descreve a repartição das riquezas capturadas; 'distribuirá entre eles' comunica naturalmente o sentido, enquanto a imagem literal é indicada em nota.
- source_word: וְעַל מִבְצָרִים יְחַשֵּׁב מַחְשְׁבֹתָיו
  choice: Tramará seus planos contra fortalezas
  rationale: A construção cognata 'pensará seus pensamentos' indica conceber planos ou estratégias. 'Tramará seus planos' retém o caráter deliberado, e 'fortalezas' corresponde ao contexto militar.
- source_word: וְעַד עֵת
  choice: mas somente até certo tempo
  rationale: A expressão é literalmente 'e até um tempo'. A tradução conserva a limitação temporal indefinida sem inserir 'determinado', adjetivo que não está explícito aqui.
theological_decisions:
- issue: Se a limitação temporal deve ser apresentada explicitamente como divinamente determinada
  choice: mas somente até certo tempo
  alternative: até o tempo determinado; mas apenas por algum tempo
  rationale: עַד עֵת não traz neste versículo um modificador explícito equivalente a 'determinado'. A redação principal preserva a indefinição e evita explicitar uma interpretação providencial mais forte do que as palavras isoladas exigem.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A repetição 'pais... pais de seus pais' foi mantida por sua força retórica. A ordem das notas segue a ocorrência dos marcadores no texto principal.
