base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/018.yaml
  text: Then he will turn his face to the coastlands and capture many[b][a]. But a commander will put an end to his reproach against him; indeed, he will repay his reproach to him.
translation:
  language: pt
  text: Então ele voltará o rosto para as terras costeiras[a] e conquistará muitos[b]. Mas um comandante porá fim à afronta dele contra ele; de fato, fará essa afronta recair sobre ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para as ilhas”. O termo hebraico pode se referir tanto a ilhas quanto, de modo mais amplo, a terras costeiras ou regiões marítimas.
    reason: lexical_alternative
  - marker: b
    text: O hebraico de “muitos” não traz um substantivo expresso e pode indicar muitas terras, regiões ou pessoas. As orações finais também são difíceis e podem ser entendidas de outras maneiras, inclusive que o comandante acabará com a afronta sem que a afronta dele próprio recaia sobre ele.
    reason: alternative_reading
lexical_decisions:
- source_word: וישב פניו
  choice: voltará o rosto
  rationale: Preserva a imagem do idiomatismo hebraico de dirigir-se para um lugar ou objetivo e permanece natural em português.
- source_word: לאיים
  choice: para as terras costeiras
  rationale: אִיִּים pode designar ilhas ou, mais amplamente, regiões costeiras e marítimas; a escolha mantém essa abrangência contextual sem limitar a campanha a ilhas literais.
- source_word: ולכד רבים
  choice: e conquistará muitas
  rationale: לכד indica capturar ou tomar em contexto militar. Como רַבִּים não traz substantivo expresso, o feminino retoma naturalmente 'terras costeiras', embora o hebraico permaneça mais aberto.
- source_word: קצין
  choice: um comandante
  rationale: קָצִין designa um líder ou oficial e, neste contexto militar, 'comandante' é a opção mais adequada.
- source_word: והשבית
  choice: porá fim
  rationale: O hifil de שׁבת significa fazer cessar; 'pôr fim' transmite o sentido de modo natural e vigoroso.
- source_word: חרפתו לו
  choice: à afronta dele contra si
  rationale: חֶרְפָּה pode significar afronta, insulto ou desonra. A formulação conserva a difícil relação pronominal, entendendo o comandante como alvo da afronta.
- source_word: בלתי חרפתו ישיב לו
  choice: de fato, fará recair sobre ele a sua afronta
  rationale: Adota a leitura enfática de בִּלְתִּי e entende יָשִׁיב como reversão ou retribuição, sem identificar historicamente os referentes dos pronomes.
theological_decisions:
- issue: Referentes e sintaxe das duas orações finais
  choice: O comandante põe fim à afronta do rei contra ele e faz essa afronta recair sobre o próprio rei.
  alternative: O comandante põe fim à afronta sem que a afronta do próprio comandante recaia sobre ele.
  rationale: O hebraico é comprimido e admite mais de uma análise. A redação principal segue a leitura em que קָצִין é sujeito tanto de וְהִשְׁבִּית quanto de יָשִׁיב, e בִּלְתִּי tem força enfática. A nota registra a dificuldade sem impor uma identificação histórica ou doutrinária.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Mantém a imagem hebraica de 'voltar o rosto' e evita identificar as personagens com figuras históricas específicas. A ordem dos marcadores foi normalizada e todos aparecem no texto principal.
