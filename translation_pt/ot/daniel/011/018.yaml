revisions:
- from: Então ele voltará o rosto para as terras costeiras[a] e conquistará muitas[b]. Mas um comandante porá fim à afronta dele contra si; de fato, fará recair sobre ele a sua afronta.[b]
  to: Então ele voltará o rosto para as terras costeiras[a] e conquistará muitos[b]. Mas um comandante porá fim à afronta dele contra ele; de fato, fará essa afronta recair sobre ele.[b]
  rationale: A revisão elimina o reflexivo português inadequado, sem resolver os referentes pronominais disputados do hebraico. Também muda «muitas» para «muitos», evitando que a concordância determine como objeto as terras costeiras. As notas preservam tanto a alternativa lexical de אִיִּים quanto a incerteza sintática e interpretativa das cláusulas finais.
