language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/עֵ֣ת קֵ֗ץ יִתְנַגַּ֤ח עִמּ/וֹ֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יִשְׂתָּעֵ֨ר עָלָ֜י/ו מֶ֣לֶךְ הַ/צָּפ֗וֹן בְּ/רֶ֨כֶב֙ וּ/בְ/פָ֣רָשִׁ֔ים וּ/בָ/אֳנִיּ֖וֹת רַבּ֑וֹת וּ/בָ֥א בַ/אֲרָצ֖וֹת וְ/שָׁטַ֥ף וְ/עָבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/040.yaml
  text: At the time of the end[a], the king of the South will clash with him, and the king of the North will storm against him with chariots, horsemen, and many ships[d][c][b]; he will enter into the lands and sweep through and pass on.
translation:
  language: pt
  text: No tempo do fim, o rei do Sul entrará em confronto[a] com ele[d], e o rei do Norte avançará impetuosamente[b] contra ele, com carros de guerra, cavaleiros e muitos navios; entrará nas terras[c], avançará como uma inundação e seguirá adiante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “dará uma investida contra”. O verbo hebraico evoca literalmente o ato de dar uma cabeçada ou chifrada e, em sentido figurado, um choque hostil.
    reason: lexical_alternative
  - marker: b
    text: Ou “virá contra ele como uma tempestade”. O verbo descreve um avanço violento e impetuoso.
    reason: lexical_alternative
  - marker: c
    text: Ou “países” ou “territórios”. O plural hebraico pode designar diferentes terras, regiões ou nações.
    reason: lexical_alternative
  - marker: d
    text: O texto hebraico não identifica expressamente a quem se refere o pronome “ele” neste versículo; seu referente exato é interpretado de maneiras diferentes.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְעֵת קֵץ
  choice: No tempo do fim
  rationale: Reproduz a expressão temporal hebraica de modo natural e mantém aberta a natureza exata desse período final.
- source_word: יִתְנַגַּח עִמּוֹ
  choice: entrará em confronto com ele
  rationale: O verbo evoca literalmente uma cabeçada ou chifrada e, em sentido figurado, um choque hostil. A expressão comunica o embate sem reduzir o sentido a um ataque unilateral.
- source_word: מֶלֶךְ הַנֶּגֶב / מֶלֶךְ הַצָּפוֹן
  choice: o rei do Sul / o rei do Norte
  rationale: Mantém os títulos geopolíticos recorrentes em Daniel 11 e sua simetria.
- source_word: וְיִשְׂתָּעֵר עָלָיו
  choice: avançará impetuosamente contra ele
  rationale: Expressa o movimento violento e tempestuoso do verbo hebraico em português corrente, sem transformar obrigatoriamente a imagem em uma comparação explícita.
- source_word: בְּרֶכֶב וּבְפָרָשִׁים וּבָאֳנִיּוֹת רַבּוֹת
  choice: com carros de guerra, cavaleiros e muitos navios
  rationale: Apresenta naturalmente a enumeração das forças terrestres e navais; 'carros de guerra' esclarece o sentido militar de רֶכֶב.
- source_word: וּבָא בָאֲרָצוֹת
  choice: entrará nas terras
  rationale: Conserva o verbo comum 'entrar' e a amplitude do plural אֲרָצוֹת, sem especificar se se trata de países, territórios ou regiões.
- source_word: וְשָׁטַף
  choice: avançará como uma inundação
  rationale: Torna inteligível a metáfora de transbordar ou inundar aplicada a um avanço militar irresistível.
- source_word: וְעָבָר
  choice: e seguirá adiante
  rationale: Comunica a progressão subsequente sem a repetição pouco natural de 'passará pelas terras' logo após 'entrará nas terras'.
theological_decisions:
- issue: Referente dos pronomes em 'com ele' e 'contra ele'
  choice: Manter o referente implícito
  alternative: Identificar o referente como o governante do contexto anterior ou como uma figura escatológica específica
  rationale: O hebraico emprega apenas o pronome, sem repetir seu antecedente neste versículo. Identificá-lo no texto resolveria uma questão interpretativa que o original deixa aberta.
- issue: Natureza do 'tempo do fim'
  choice: Preservar a expressão sem definir sua cronologia
  alternative: Explicá-la como um período histórico ou escatológico específico
  rationale: A tradução mantém a força da expressão קֵץ sem impor um esquema cronológico ou doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'carros de guerra' para evitar a possível ambiguidade de 'carros' e mantém os títulos 'rei do Sul' e 'rei do Norte'. A metáfora da inundação é preservada em forma natural, e os referentes pronominais permanecem deliberadamente não identificados.
