id: DAN.11.36
reference: Daniel 11:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָשָׂ֨ה כִ/רְצוֹנ֜/וֹ הַ/מֶּ֗לֶךְ וְ/יִתְרוֹמֵ֤ם וְ/יִתְגַּדֵּל֙ עַל כָּל אֵ֔ל וְ/עַל֙ אֵ֣ל אֵלִ֔ים יְדַבֵּ֖ר נִפְלָא֑וֹת וְ/הִצְלִ֨יחַ֙ עַד כָּ֣לָה זַ֔עַם כִּ֥י נֶחֱרָצָ֖ה נֶעֱשָֽׂתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/036.yaml
  text: And the king will do as he pleases[a]. He will exalt himself and magnify himself above every god, and against the God of gods he will speak astonishing things. And he will prosper until the indignation is finished[c][b], for what has been decreed will be done.
translation:
  language: pt
  text: O rei fará o que quiser. Ele se exaltará e se engrandecerá acima de todo deus; contra o Deus dos deuses dirá coisas extraordinárias[a]. Será bem-sucedido até que a indignação chegue ao fim[b], pois o que foi determinado se cumprirá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “coisas espantosas” ou “coisas maravilhosas”. O termo hebraico descreve o que é extraordinário; neste contexto, trata-se de uma fala chocante e arrogante.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até que a ira se complete”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pois aquilo que foi decretado será realizado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה כִרְצוֹנוֹ
  choice: fará o que quiser
  rationale: Expressa de modo natural a ideia literal de agir segundo a própria vontade, preservando a autonomia e a obstinação do rei.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém diretamente o substantivo definido, sem identificar o personagem além do que o hebraico declara.
- source_word: וְיִתְרוֹמֵם וְיִתְגַּדֵּל
  choice: se exaltará e se engrandecerá
  rationale: Os dois verbos têm força reflexiva e formam uma intensificação retórica de autoexaltação; a formulação portuguesa conserva ambos.
- source_word: עַל כָּל אֵל
  choice: acima de todo deus
  rationale: Com os verbos de exaltação, עַל comunica superioridade metafórica. O singular distributivo 'todo deus' acompanha de perto o hebraico.
- source_word: וְעַל אֵל אֵלִים
  choice: contra o Deus dos deuses
  rationale: Neste segundo uso, עַל introduz o alvo da fala hostil. A expressão construta designa o Deus supremo no contexto.
- source_word: יְדַבֵּר נִפְלָאוֹת
  choice: dirá coisas extraordinárias
  rationale: נִפְלָאוֹת denota coisas fora do comum, espantosas ou prodigiosas. 'Extraordinárias' preserva a amplitude lexical, enquanto o contexto deixa clara a natureza arrogante da fala.
- source_word: וְהִצְלִיחַ
  choice: será bem-sucedido
  rationale: Comunica com clareza o sentido de obter êxito ou prosperar, sem sugerir necessariamente prosperidade material.
- source_word: עַד כָּלָה זַעַם
  choice: até que a indignação chegue ao fim
  rationale: זַעַם pode indicar indignação ou ira, provavelmente divina neste contexto profético. A tradução não explicita o agente, preservando a formulação hebraica.
- source_word: כִּי נֶחֱרָצָה נֶעֱשָׂתָה
  choice: pois o que foi determinado se cumprirá
  rationale: Representa tanto a decisão já estabelecida quanto sua efetiva realização, em português claro e próprio do registro profético.
theological_decisions:
- issue: Referente de אֵל אֵלִים
  choice: Deus dos deuses, com inicial maiúscula
  alternative: deus dos deuses, em sentido genérico
  rationale: O contraste entre 'todo deus' e a divindade suprema contra quem o rei fala favorece a referência ao Deus verdadeiro; a capitalização sinaliza isso sem acrescentar uma identificação ausente do texto.
- issue: Natureza de זַעַם
  choice: indignação, sem explicitar de quem procede
  alternative: ira divina; ira em sentido geral
  rationale: O contexto apocalíptico sugere um período determinado de indignação divina, mas o hebraico não nomeia aqui seu agente. A tradução conserva essa tensão.
- issue: Duração do sucesso do rei
  choice: sucesso temporário até o fim determinado da indignação
  alternative: sucesso indefinido ou aprovação divina
  rationale: A oração temporal e a declaração do decreto limitam claramente seu êxito; a tradução mantém o limite sem interpretar o sucesso como aprovação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o paralelismo de autoexaltação, a diferença entre estar acima dos deuses e falar contra Deus, e a ambiguidade controlada de termos proféticos como זַעַם e נִפְלָאוֹת.
