source:
  edition: WLC
  text: וּ/זְרֹע֥וֹת הַ/שֶּׁ֛טֶף יִשָּׁטְפ֥וּ מִ/לְּ/פָנָ֖י/ו וְ/יִשָּׁבֵ֑רוּ וְ/גַ֖ם נְגִ֥יד בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/022.yaml
  text: The flood-like forces will be swept away from before him and be broken[b][a], and also the prince of the covenant.
translation:
  language: pt
  text: As forças inundantes[a] serão varridas de diante dele e despedaçadas, bem como o príncipe da aliança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os braços da inundação”; provavelmente uma expressão para forças militares avassaladoras.
    reason: lexical_alternative
  - marker: b
    text: Ou “o líder da aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרֹעוֹת הַשֶּׁטֶף
  choice: as forças da inundação
  rationale: A expressão significa literalmente “os braços da inundação”. Neste contexto político-militar, זְרֹעוֹת aponta para poder armado ou forças, enquanto הַשֶּׁטֶף conserva a imagem de uma inundação avassaladora.
- source_word: יִשָּׁטְפוּ
  choice: serão arrastadas
  rationale: 'A forma nifal é entendida como passiva: essas forças serão levadas ou varridas como por uma inundação. “Arrastadas” preserva a imagem aquática e soa natural em português.'
- source_word: מִלְּפָנָיו
  choice: de diante dele
  rationale: Tradução próxima da construção hebraica, preservando o sentido espacial e confrontacional sem explicá-lo em excesso.
- source_word: וְיִשָּׁבֵרוּ
  choice: e serão quebradas
  rationale: שבר no nifal significa ser quebrado ou despedaçado. “Serão quebradas” mantém a formulação sóbria e não determina o grau exato da destruição.
- source_word: וְגַם
  choice: e também
  rationale: Mantém a força aditiva da expressão hebraica e introduz o príncipe da aliança como outro atingido pelos verbos anteriores.
- source_word: נְגִיד
  choice: príncipe
  rationale: O termo pode designar príncipe, governante ou líder. “Príncipe” conserva o registro elevado de Daniel sem implicar necessariamente filiação real.
- source_word: בְּרִית
  choice: da aliança
  rationale: Embora sem artigo explícito em hebraico, o substantivo pode ser definido pelo contexto. “Da aliança” preserva a leitura contextual tradicional sem identificar qual figura histórica está em vista.
theological_decisions:
- issue: Identidade do “príncipe da aliança”
  choice: Manter o título sem identificar a pessoa.
  alternative: Traduzir ou anotar como referência específica a Onias III, a um governante ligado à aliança ou a uma figura messiânica.
  rationale: O texto hebraico não identifica explicitamente essa figura. A tradução deve preservar essa abertura interpretativa.
- issue: Relação sintática de “e também o príncipe da aliança”
  choice: Entender a expressão como objeto adicional dos verbos passivos anteriores.
  alternative: Tratá-la como uma frase elíptica mais independente.
  rationale: וְגַם introduz naturalmente outro elemento que será arrastado e quebrado, embora a construção hebraica seja condensada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A imagem da inundação e a ambiguidade quanto à identidade do príncipe foram preservadas.
