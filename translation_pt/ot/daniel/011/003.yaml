  text: Então surgirá um rei poderoso, que exercerá grande domínio e fará o que quiser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָמַד
  choice: Então surgirá
  rationale: Neste contexto profético, עמד indica que um governante surge ou entra em cena. “Então” expressa naturalmente a progressão da visão sem reduzir o verbo ao sentido literal de ficar em pé.
- source_word: מֶלֶךְ גִּבּוֹר
  choice: um rei poderoso
  rationale: גִּבּוֹר comunica força, poder ou valentia. “Rei poderoso” é natural em português e preserva a amplitude política e militar do termo sem especificá-lo como guerreiro.
- source_word: וּמָשַׁל
  choice: que exercerá
  rationale: O verbo משל significa governar ou exercer domínio. A formulação liga naturalmente o verbo ao substantivo cognato seguinte e evita repetição pouco idiomática em português.
- source_word: מִמְשָׁל רַב
  choice: grande domínio
  rationale: A expressão ressalta a grande extensão ou força do governo do rei. “Grande domínio” conserva o substantivo hebraico e seu vínculo lexical com משל.
- source_word: וְעָשָׂה כִּרְצוֹנוֹ
  choice: e fará o que quiser
  rationale: A expressão significa agir segundo a própria vontade. “Fará o que quiser” é idiomático, claro e transmite a ideia de liberdade de ação sem acrescentar uma avaliação teológica.
