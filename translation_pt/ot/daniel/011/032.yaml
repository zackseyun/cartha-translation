  text: וּ/מַרְשִׁיעֵ֣י בְרִ֔ית יַחֲנִ֖יף בַּ/חֲלַקּ֑וֹת וְ/עַ֛ם יֹדְעֵ֥י אֱלֹהָ֖י/ו יַחֲזִ֥קוּ וְ/עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/032.yaml
  text: He will corrupt with smooth words those who act wickedly against the covenant[b][a], but the people who know their God will stand firm and take action.
translation:
  language: pt
  text: Ele corromperá com palavras sedutoras[a] os que agem perversamente contra a aliança, mas o povo que conhece o seu Deus permanecerá firme e agirá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com lisonjas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “será forte e agirá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַרְשִׁיעֵי בְרִית
  choice: os que agem perversamente contra a aliança
  rationale: O particípio de רשע descreve pessoas que procedem perversamente; a formulação explicita de modo natural a relação hostil ou infiel para com a aliança.
- source_word: יַחֲנִיף
  choice: corromperá
  rationale: O hifil de חנף pode indicar levar à impiedade ou tornar profano. “Corromperá” comunica a sedução moral e religiosa sem definir além do que o contexto permite.
- source_word: בַּחֲלַקּוֹת
  choice: com palavras sedutoras
  rationale: O substantivo ligado à ideia de lisura refere-se idiomaticamente a fala lisonjeira e enganosa. “Palavras sedutoras” conserva a função persuasiva do hebraico em português corrente.
- source_word: וְעַם
  choice: mas o povo
  rationale: Embora וְ seja formalmente aditivo, aqui introduz um contraste claro entre os infiéis à aliança e o povo que conhece seu Deus.
- source_word: יֹדְעֵי אֱלֹהָיו
  choice: que conhece o seu Deus
  rationale: O particípio expressa conhecimento contínuo e relacional. Em português, “o povo que conhece o seu Deus” mantém naturalmente o coletivo singular e o sufixo correspondente.
- source_word: יַחֲזִקוּ
  choice: permanecerá firme
  rationale: O verbo חזק, neste contexto, comunica força e constância diante da pressão. “Permanecerá firme” expressa resistência fiel sem acrescentar uma proeza específica.
- source_word: וְעָשׂוּ
  choice: e agirá
  rationale: עשה é amplo, significando fazer ou agir. “Agirá” preserva essa amplitude melhor do que uma expressão mais interpretativa como “realizará proezas”.
theological_decisions:
- issue: Natureza da resposta dos fiéis na oração final
  choice: O povo fiel permanece firme e age.
  alternative: O povo será forte e fará; ou realizará proezas.
  rationale: A tradução mantém o contraste entre corrupção e fidelidade, mas deixa o objeto e a natureza exata da ação sem especificação, como no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O coletivo “o povo” rege verbos no singular. Evitou-se “fará proezas”, pois essa formulação especifica mais do que o verbo hebraico עשה.
