  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ אַל תִּירָ֣א דָנִיֵּאל֒ כִּ֣י מִן הַ/יּ֣וֹם הָ/רִאשׁ֗וֹן אֲשֶׁ֨ר נָתַ֧תָּ אֶֽת לִבְּ/ךָ֛ לְ/הָבִ֧ין וּ/לְ/הִתְעַנּ֛וֹת לִ/פְנֵ֥י אֱלֹהֶ֖י/ךָ נִשְׁמְע֣וּ דְבָרֶ֑י/ךָ וַ/אֲנִי בָ֖אתִי בִּ/דְבָרֶֽי/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/012.yaml
  text: Then he said to me[a], “Do not fear, Daniel, because from the first day that you set your heart to understand and to humble yourself before your God, your words were heard[b], and I have come because of your words.”
translation:
  language: pt
  text: 'Então ele me disse: “Não tenha medo, Daniel, pois, desde o primeiro dia em que você se empenhou em compreender e em se humilhar[a] diante do seu Deus, suas palavras foram ouvidas; e eu vim por causa das suas palavras[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a se afligir” ou “a se privar”. O hebraico pode indicar autoprivação ou humilhação voluntária em contexto devocional.
    reason: lexical_alternative
  - marker: b
    text: Ou “em resposta às suas palavras”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Expressa de modo natural e direto, em português atual, a proibição hebraica de temer, preservando o tom de consolo dirigido a Daniel.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן
  choice: desde o primeiro dia
  rationale: O valor temporal de מִן é bem comunicado por “desde”, indicando que a ação divina remonta ao primeiro dia.
- source_word: נָתַתָּ אֶת לִבְּךָ
  choice: você dispôs o coração
  rationale: Preserva a imagem hebraica do coração como centro da intenção e da resolução, sem reduzi-la apenas à atividade intelectual.
- source_word: לְהָבִין
  choice: a compreender
  rationale: Verte diretamente o infinitivo de בין no hiphil, que aqui indica buscar compreensão ou entendimento.
- source_word: וּלְהִתְעַנּוֹת
  choice: a se humilhar
  rationale: No contexto devocional, o hitpael de ענה descreve a atitude voluntária de humilhação diante de Deus; a possibilidade mais concreta de autoprivação ou aflição é mantida em nota.
- source_word: לִפְנֵי אֱלֹהֶיךָ
  choice: diante do seu Deus
  rationale: Equivalente português natural para a expressão relacional לִפְנֵי, preservando a ideia de estar na presença de Deus.
- source_word: נִשְׁמְעוּ דְבָרֶיךָ
  choice: suas palavras foram ouvidas
  rationale: Mantém tanto a forma passiva quanto o substantivo amplo “palavras”, sem explicitar “orações”, embora o contexto indique petição dirigida a Deus.
- source_word: וַאֲנִי בָאתִי בִּדְבָרֶיךָ
  choice: e eu vim por causa das suas palavras
  rationale: Traduz o provável valor causal de בְּ e conserva a ligação entre as palavras de Daniel e a vinda do mensageiro, sem definir além do texto os mecanismos dessa resposta.
theological_decisions:
- issue: Sentido da ação devocional em וּלְהִתְעַנּוֹת
  choice: a se humilhar
  alternative: a se afligir; a se privar
  rationale: “Se humilhar” comunica a postura penitencial e devocional diante de Deus sem impor um rito ascético específico. A nota preserva a dimensão possível de autoprivação ou aflição.
- issue: Força de בִּדְבָרֶיךָ no fim do versículo
  choice: por causa das suas palavras
  alternative: em resposta às suas palavras
  rationale: A tradução principal conserva a relação causal indicada pelo hebraico, enquanto a alternativa explicita o valor responsivo possível sem alterar a teologia da missão do mensageiro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “dispôs o coração” preserva a imagem do hebraico, e “Não tenha medo” evita uma solenidade artificial. As notas foram posicionadas junto às expressões a que efetivamente se referem.
