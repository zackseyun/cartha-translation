source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר אַל תִּירָ֧א אִישׁ חֲמֻד֛וֹת שָׁל֥וֹם לָ֖/ךְ חֲזַ֣ק וַ/חֲזָ֑ק וּֽ/בְ/דַבְּר֤/וֹ עִמִּ/י֙ הִתְחַזַּ֔קְתִּי וָ/אֹֽמְרָ֛/ה יְדַבֵּ֥ר אֲדֹנִ֖/י כִּ֥י חִזַּקְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/019.yaml
  text: And he said[a], “Do not fear, man greatly beloved; peace be to you. Be strong, yes, be strong.” And when he spoke with me, I was strengthened and said, “Let my lord speak, for you have strengthened me.”
translation:
  language: pt
  text: 'E ele disse: “Não tenha medo, homem muito amado[a]. Que você tenha paz! Seja forte, sim, seja forte!” Enquanto ele falava comigo, recobrei as forças e disse: “Fale, meu senhor, pois o senhor me fortaleceu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homem muito estimado” ou “homem precioso”. A expressão hebraica diz literalmente “homem de coisas desejáveis/preciosas” e indica favor ou estima especial.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: homem muito amado
  rationale: A expressão hebraica, literalmente ligada a desejos ou coisas preciosas, funciona como tratamento que indica favor especial e grande estima. “Homem muito amado” é natural em português, mantém a referência masculina a Daniel e preserva o tom pessoal, sem excluir em nota as nuances de estima e preciosidade.
- source_word: שָׁלוֹם לָךְ
  choice: Que você tenha paz!
  rationale: A fórmula expressa uma bênção ou desejo dirigido a Daniel, não apenas o substantivo abstrato “paz”. Esta formulação comunica naturalmente em português a força optativa do hebraico.
- source_word: חֲזַק וַחֲזָק
  choice: Seja forte, sim, seja forte!
  rationale: A repetição dos imperativos intensifica a exortação. “Sim” torna idiomática a ênfase, enquanto a repetição de “forte” conserva a ligação lexical com os verbos seguintes da mesma raiz.
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: Enquanto ele falava comigo
  rationale: A preposição com o infinitivo construto tem sentido temporal. “Enquanto” representa bem a simultaneidade entre a fala do mensageiro e o fortalecimento de Daniel.
- source_word: הִתְחַזַּקְתִּי
  choice: recobrei as forças
  rationale: O hitpael descreve Daniel entrando em um estado de força em reação às palavras recebidas. “Recobrei as forças” é idiomático e adequado ao contexto físico e emocional, embora varie a forma para evitar uma construção passiva menos natural.
- source_word: יְדַבֵּר אֲדֹנִי
  choice: Fale, meu senhor
  rationale: O imperfeito tem aqui força volitiva de pedido respeitoso. A colocação direta é natural em português e “meu senhor”, em minúsculas, representa o tratamento honorífico dirigido ao interlocutor.
- source_word: כִּי חִזַּקְתָּנִי
  choice: pois o senhor me fortaleceu
  rationale: '“Pois” explicita a relação causal: Daniel agora pode ouvir porque foi fortalecido. “Fortaleceu” conserva a ligação com a repetição da raiz חזק ao longo do versículo. O pronome de tratamento foi explicitado para evitar a ambiguidade de “você” junto de “meu senhor”.'
theological_decisions:
- issue: Sentido de אִישׁ חֲמֻדוֹת
  choice: homem muito amado
  alternative: homem muito estimado; homem precioso
  rationale: O texto indica favor ou preciosidade especial, mas a expressão admite mais de uma nuance. A tradução principal preserva o tom afetivo, e a nota registra alternativas sem decidir além da evidência lexical.
- issue: Tratamento אֲדֹנִי dado ao interlocutor
  choice: meu senhor
  alternative: meu mestre; Senhor
  rationale: A forma hebraica é um tratamento respeitoso singular. Neste contexto, o versículo não exige identificar o interlocutor com o nome divino; por isso, as minúsculas evitam importar uma identificação teológica mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega-se “você” na bênção e “o senhor” no reconhecimento respeitoso de Daniel; “meu senhor” permanece em minúsculas por ser um título de cortesia no contexto. A repetição enfática de “seja forte” e a cadeia de termos ligados à força foram preservadas tanto quanto permite a naturalidade.
