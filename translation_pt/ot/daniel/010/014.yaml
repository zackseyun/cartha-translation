id: DAN.10.14
reference: Daniel 10:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בָ֨אתִי֙ לַ/הֲבִ֣ינְ/ךָ֔ אֵ֛ת אֲשֶׁר יִקְרָ֥ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֣ית הַ/יָּמִ֑ים כִּי ע֥וֹד חָז֖וֹן לַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/014.yaml
  text: And I have come to make you understand what will happen to your people in the latter days[b][a], for the vision is yet for days to come.
translation:
  language: pt
  text: Vim para fazer você entender o que acontecerá ao seu povo nos últimos dias[a], pois a visão diz respeito a dias que ainda virão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no fim dos dias”. A expressão hebraica é uma fórmula profética para a fase futura e culminante dos acontecimentos.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “a visão ainda é para dias”. O sentido pode ser “para dias futuros” e, segundo outra compreensão, “para muitos dias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתִי
  choice: Vim
  rationale: O perfeito qal na primeira pessoa descreve a chegada já realizada do mensageiro, cuja finalidade ele explica agora. Em português, o pretérito perfeito é a forma mais natural; a conjunção pode ficar implícita sem perda da ligação contextual.
- source_word: לַהֲבִינְךָ
  choice: para fazer você entender
  rationale: 'O infinitivo hifil de בין com sufixo de segunda pessoa masculina singular tem força causativa: o mensageiro veio para levar Daniel a compreender.'
- source_word: אֵת אֲשֶׁר יִקְרָה
  choice: o que acontecerá
  rationale: A combinação do marcador de objeto com a oração relativa introduz o conteúdo a ser compreendido, e o imperfeito de קרה aponta para acontecimentos futuros.
- source_word: לְעַמְּךָ
  choice: ao seu povo
  rationale: A preposição ל marca o povo afetado pelo que ocorrerá. “Ao seu povo” preserva essa relação sem pressupor que os acontecimentos sejam exclusivamente adversos ou benéficos.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos dias finais
  rationale: A expressão profética indica a fase culminante ou posterior dos acontecimentos. A formulação é compreensível e mantém a amplitude temporal do hebraico sem impor um esquema escatológico específico.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz uma explicação para a afirmação anterior; “pois” conserva esse valor causal-explicativo em registro digno e corrente.
- source_word: עוֹד חָזוֹן לַיָּמִים
  choice: a visão diz respeito a dias que ainda virão
  rationale: A construção concisa associa a visão a dias ainda futuros. A tradução explicita a relação de modo natural, sem converter לַיָּמִים em uma indicação certa de grande distância ou quantidade.
theological_decisions:
- issue: Alcance escatológico de בְּאַחֲרִית הַיָּמִים
  choice: nos dias finais
  alternative: no fim dos dias; nos últimos dias
  rationale: A expressão pode apontar para a culminação futura dos acontecimentos, mas o versículo não define por si só um sistema escatológico completo. A tradução mantém esse horizonte profético sem o estreitar denominacionalmente.
- issue: Relação temporal expressa por עוֹד חָזוֹן לַיָּמִים
  choice: a visão diz respeito a dias que ainda virão
  alternative: a visão é para muitos dias; a visão é para dias futuros
  rationale: O hebraico indica que o conteúdo da visão pertence a um tempo ainda por vir, mas não exige que se acrescente a ideia quantitativa de “muitos” nem que se determine quão distante é esse tempo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Fazer você entender” preserva a causatividade do hebraico sem soar excessivamente técnico; “dias finais” mantém o caráter profético da expressão, enquanto as notas registram alternativas legítimas.
