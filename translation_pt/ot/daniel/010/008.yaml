  text: וַ/אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י וָֽ/אֶרְאֶ֗ה אֶת הַ/מַּרְאָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/לֹ֥א נִשְׁאַר בִּ֖/י כֹּ֑ח וְ/הוֹדִ֗/י נֶהְפַּ֤ךְ עָלַ/י֙ לְ/מַשְׁחִ֔ית וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/008.yaml
  text: So I alone was left and saw this great vision[a], and no strength remained in me; my splendor was turned to ruin upon me[b], and I retained no strength.
translation:
  language: pt
  text: Assim, fiquei sozinho e vi esta grande visão[a]. Não restou força em mim; meu esplendor se transformou em ruína[b], e não retive força alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta grande aparição” ou “esta grande aparência”.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha aparência se transformou em ruína” ou “meu vigor se transformou em ruína”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַרְתִּי לְבַדִּי
  choice: fiquei sozinho
  rationale: Expressa de modo natural tanto a ideia de permanecer ou ser deixado quanto a ênfase de לְבַדִּי, no contexto em que os demais já haviam fugido.
- source_word: הַמַּרְאָה הַגְּדֹלָה הַזֹּאת
  choice: esta grande visão
  rationale: מַרְאָה pode designar visão, aparência ou algo visto. “Visão” é natural no contexto revelatório de Daniel, sem eliminar as alternativas, registradas em nota.
- source_word: כֹּחַ
  choice: força
  rationale: Nas duas ocorrências, refere-se à capacidade física de Daniel, que se esvai diante da experiência.
- source_word: וְלֹא נִשְׁאַר בִּי כֹּחַ
  choice: Não restou força em mim
  rationale: Preserva o sentido de algo que não permaneceu e a localização interna indicada por בִּי, em português claro e corrente.
- source_word: הוֹדִי
  choice: meu esplendor
  rationale: Mantém o núcleo lexical de הוֹד, que pode indicar esplendor, majestade ou a aparência digna e vigorosa de alguém. A nota registra as leituras contextuais possíveis.
- source_word: נֶהְפַּךְ עָלַי לְמַשְׁחִית
  choice: converteu-se, em mim, em ruína
  rationale: Conserva a ideia de transformação em uma condição ruinosa e representa עָלַי sem reduzir a frase a uma explicação apenas fisiológica. A formulação deliberadamente mantém algo da força e da tensão do hebraico.
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: e não retive força alguma
  rationale: עצר neste contexto comunica conservar ou reter. A construção portuguesa preserva a distinção em relação à oração anterior e enfatiza a ausência total de força.
theological_decisions:
- issue: Natureza de הַמַּרְאָה no contexto apocalíptico
  choice: visão
  alternative: aparência; cena contemplada
  rationale: O contexto é revelatório, o que favorece “visão”, mas o substantivo hebraico também pode referir-se a uma aparência ou ao que é visto; a nota preserva essa amplitude.
- issue: Sentido de הוֹדִי na condição de Daniel
  choice: meu esplendor
  alternative: minha aparência; meu vigor
  rationale: A tradução conserva o valor lexical direto de הוֹד e não decide silenciosamente se o texto se refere sobretudo à aparência exterior, à dignidade ou ao vigor físico.
- issue: Força da expressão לְמַשְׁחִית
  choice: em ruína
  alternative: em corrupção; em estado arruinado
  rationale: “Ruína” mantém a severidade da expressão sem especificar decomposição física nem impor uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe é natural, mas conserva a repetição de “força” e a formulação intensa da transformação de Daniel. Os marcadores [a] e [b] aparecem no texto principal.
