revisions:
- from: No terceiro ano de Ciro, rei da Pérsia, uma palavra foi revelada a Daniel, que era chamado Beltessazar. A palavra era verdadeira e dizia respeito a um grande conflito.[a] Ele compreendeu a palavra e recebeu entendimento da visão.
  to: No terceiro ano de Ciro, rei da Pérsia, uma palavra foi revelada a Daniel, que era chamado Beltessazar. A palavra era verdadeira e dizia respeito a um grande conflito.[a] Ele compreendeu a palavra e teve entendimento na visão.
  rationale: A revisão limita-se à oração final, para traduzir בַּמַּרְאֶה como esfera da compreensão («na visão»), e à nota, para evitar a inserção desnecessária de «houve». O sentido principal e a ambiguidade de צָבָא גָדוֹל permanecem preservados.
