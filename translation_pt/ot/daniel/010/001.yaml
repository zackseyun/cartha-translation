  text: בִּ/שְׁנַ֣ת שָׁל֗וֹשׁ לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס דָּבָר֙ נִגְלָ֣ה לְ/דָֽנִיֵּ֔אל אֲשֶׁר נִקְרָ֥א שְׁמ֖/וֹ בֵּלְטְשַׁאצַּ֑ר וֶ/אֱמֶ֤ת הַ/דָּבָר֙ וְ/צָבָ֣א גָד֔וֹל וּ/בִין֙ אֶת הַ/דָּבָ֔ר וּ/בִ֥ינָה ל֖/וֹ בַּ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/001.yaml
  text: In the third year of Cyrus king of Persia[a], a word was revealed to Daniel, who was called Belteshazzar. The word was true, and it concerned a great conflict; and he understood the word and had understanding in the vision.
translation:
  language: pt
  text: No terceiro ano de Ciro, rei da Pérsia, uma palavra foi revelada a Daniel, que era chamado Beltessazar. A palavra era verdadeira e dizia respeito a um grande conflito.[a] Ele compreendeu a palavra e teve entendimento na visão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e uma grande guerra”. A expressão hebraica também pode ser traduzida mais literalmente em termos militares.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבָר
  choice: palavra
  rationale: Preserva a repetição e o caráter revelatório do termo hebraico, podendo abranger palavra, mensagem ou assunto.
- source_word: נִגְלָה
  choice: foi revelada
  rationale: Expressa com clareza o sentido passivo de algo que foi descoberto ou dado a conhecer.
- source_word: נִקְרָא שְׁמוֹ
  choice: que era chamado
  rationale: Reproduz naturalmente em português a expressão hebraica que identifica Daniel por seu nome babilônico.
- source_word: בֵּלְטְשַׁאצַּר
  choice: Beltessazar
  rationale: Emprega a forma tradicional e amplamente reconhecível do nome em português.
- source_word: וֶאֱמֶת הַדָּבָר
  choice: A palavra era verdadeira
  rationale: Mantém a repetição de דָּבָר e afirma a veracidade da revelação sem explicitação adicional.
- source_word: וְצָבָא גָדוֹל
  choice: dizia respeito a um grande conflito
  rationale: Comunica o provável sentido contextual de luta ou guerra intensa, sem reduzir o termo a um exército concreto.
- source_word: וּבִין אֶת הַדָּבָר
  choice: Ele compreendeu a palavra
  rationale: Traduz diretamente o verbo בין como compreensão ou discernimento do conteúdo revelado.
- source_word: וּבִינָה לוֹ בַּמַּרְאֶה
  choice: recebeu entendimento da visão
  rationale: Expressa de modo natural que Daniel obteve compreensão mediante a visão, preservando a relação semântica entre o verbo e o substantivo de entendimento.
theological_decisions:
- issue: Sentido de צָבָא גָדוֹל na revelação apocalíptica
  choice: dizia respeito a um grande conflito
  alternative: e houve uma grande guerra
  rationale: O contexto dos capítulos 10–12 favorece a ideia de conflito ou guerra ligada ao conteúdo da revelação. A tradução principal torna essa relação explícita, enquanto a nota preserva a formulação militar mais direta.
- issue: Relação de בַּמַּרְאֶה com o entendimento
  choice: recebeu entendimento da visão
  alternative: teve entendimento na visão
  rationale: A preposição ב pode indicar esfera ou meio. A formulação principal é natural em português e não afirma que Daniel compreendeu tudo por capacidade própria; a alternativa mais formal continua semanticamente possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva a repetição de “palavra” e a ambiguidade militar de צָבָא por meio de nota.
