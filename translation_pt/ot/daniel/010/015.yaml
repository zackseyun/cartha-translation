  text: וּ/בְ/דַבְּר֣/וֹ עִמִּ֔/י כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה נָתַ֧תִּי פָנַ֛/י אַ֖רְצָ/ה וְ/נֶאֱלָֽמְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/015.yaml
  text: And when he spoke these words with me[b][a], I set my face toward the ground and became speechless.
translation:
  language: pt
  text: E, enquanto ele falava comigo essas palavras, voltei o rosto para o chão e fiquei sem fala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְדַבְּרוֹ
  choice: enquanto ele falava
  rationale: A preposição בְּ com o infinitivo construto expressa uma relação temporal. «Enquanto ele falava» preserva a possível simultaneidade sem excluir que a reação tenha ocorrido ao fim das palavras.
- source_word: עִמִּי
  choice: comigo
  rationale: Traduz diretamente a preposição עִם e é natural em português no contexto de alguém falar com outra pessoa.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: דְּבָרִים pode significar «palavras», «coisas» ou «assuntos»; o contexto imediato de fala favorece «palavras». «Essas» remete naturalmente, em português, às palavras que ele acabava de proferir.
- source_word: נָתַתִּי פָנַי אַרְצָה
  choice: voltei o rosto para o chão
  rationale: A expressão hebraica diz literalmente que Daniel pôs ou dirigiu o rosto em direção ao chão. «Voltei o rosto para o chão» conserva a imagem e soa natural, sem acrescentar que ele necessariamente o encostou no solo.
- source_word: אַרְצָה
  choice: para o chão
  rationale: O contexto corporal favorece «chão» em vez de «terra», e «para» representa o sentido direcional da terminação hebraica.
- source_word: וְנֶאֱלָמְתִּי
  choice: e fiquei sem fala
  rationale: O nifal de אלם indica aqui que Daniel ficou sem poder ou sem conseguir falar. «Fiquei sem fala» comunica o estado resultante sem sugerir necessariamente mudez permanente nem uma ação externa que o tenha silenciado.
