base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/021.yaml
  text: But I will tell you what is recorded in the writing of truth[a]. And there is no one who stands firmly with me against these except Michael[b], your prince.
translation:
  language: pt
  text: Mas eu lhe direi o que está registrado no escrito da verdade[a]. E não há ninguém que se mantenha firme ao meu lado contra estes, a não ser Miguel[b], o príncipe de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que está escrito no escrito da verdade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que me apoie nestas questões”. A expressão hebraica pode indicar alguém que se mantém forte ao lado de outra pessoa, e “estes” pode se referir tanto a poderes hostis quanto às questões em discussão.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲבָל
  choice: Mas
  rationale: Marca o contraste com o discurso anterior de modo direto e natural.
- source_word: אַגִּיד לְךָ
  choice: eu lhe direi
  rationale: Expressa o hifil de נגד como comunicação direta e preserva o valor futuro e o destinatário singular.
- source_word: הָרָשׁוּם
  choice: o que está registrado
  rationale: Traduz o particípio passivo substantivado de רשם e mantém a ideia de algo consignado por escrito.
- source_word: בִּכְתָב אֱמֶת
  choice: no escrito da verdade
  rationale: כְּתָב designa um escrito ou documento; esta formulação evita acrescentar explicitamente a noção de livro e preserva a construção genitiva.
- source_word: וְאֵין אֶחָד
  choice: E não há ninguém
  rationale: Reproduz naturalmente em português a construção existencial negativa.
- source_word: מִתְחַזֵּק עִמִּי
  choice: que se mantenha firme ao meu lado
  rationale: Conserva a nuance reflexiva do hitpael de חזק e a ideia de solidariedade ativa indicada por עִמִּי.
- source_word: עַל אֵלֶּה
  choice: contra estes
  rationale: No contexto de conflito, עַל pode ser entendido adversativamente; o referente permanece deliberadamente sem explicitação.
- source_word: כִּי אִם
  choice: a não ser
  rationale: Equivalente idiomático da construção exceptiva depois de uma negação.
- source_word: מִיכָאֵל
  choice: Miguel
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: שַׂרְכֶם
  choice: o príncipe de vocês
  rationale: Preserva o título שַׂר sem acrescentar 'arcanjo'; 'de vocês' comunica claramente o sufixo plural em português internacional com boa legibilidade brasileira.
theological_decisions:
- issue: Identidade e função de Miguel
  choice: Miguel é chamado apenas de «o príncipe de vocês».
  alternative: Identificá-lo aqui como arcanjo ou como representação simbólica de Israel.
  rationale: O versículo usa שַׂרְכֶם e não o termo «arcanjo»; a tradução mantém a caracterização própria do texto sem importar uma identificação doutrinária posterior.
- issue: Referente de «estes» e relação expressa por עַל
  choice: Manter «contra estes» sem identificar expressamente quem são.
  alternative: Traduzir «nesses assuntos» ou explicitar poderes hostis.
  rationale: O contexto favorece uma relação adversativa, mas o hebraico não nomeia aqui o referente; a nota preserva as possibilidades sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. A formulação conserva o singular «escrito» e evita explicitar além do hebraico tanto o referente de «estes» quanto a identidade celestial mais ampla de Miguel.
