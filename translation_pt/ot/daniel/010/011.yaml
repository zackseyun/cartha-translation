  text: וַ/יֹּ֣אמֶר אֵלַ֡/י דָּנִיֵּ֣אל אִישׁ חֲ֠מֻדוֹת הָבֵ֨ן בַּ/דְּבָרִ֜ים אֲשֶׁר֩ אָנֹכִ֨י דֹבֵ֤ר אֵלֶ֨י/ךָ֙ וַ/עֲמֹ֣ד עַל עָמְדֶ֔/ךָ כִּ֥י עַתָּ֖ה שֻׁלַּ֣חְתִּי אֵלֶ֑י/ךָ וּ/בְ/דַבְּר֥/וֹ עִמִּ֛/י אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עָמַ֥דְתִּי מַרְעִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/011.yaml
  text: And he said to me[a], “Daniel, man greatly beloved, understand the words that I am speaking to you, and stand in your place, for now I have been sent to you.” And when he spoke this word to me[c][b], I stood trembling.
translation:
  language: pt
  text: 'Então ele me disse: “Daniel, homem muito amado[a], entenda as palavras que estou lhe dizendo e fique de pé no seu lugar[b], pois agora fui enviado a você.” Enquanto ele falava comigo essa palavra[c], fiquei de pé, tremendo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homem muito estimado”. A expressão hebraica descreve Daniel como alguém precioso ou desejável e funciona aqui como tratamento honorífico.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “ponha-se de pé” ou “permaneça no seu posto”. O idioma hebraico diz literalmente “fique de pé sobre a sua posição/lugar”.
    reason: lexical_alternative
  - marker: c
    text: Ou “essa mensagem” ou “esse assunto”. O termo hebraico traduzido por “palavra” também pode ter esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: homem muito amado
  rationale: A expressão caracteriza Daniel como precioso ou desejável e funciona como tratamento honorífico. “Muito amado” preserva tanto o calor relacional quanto a dignidade do contexto, sem excluir a nuance de alta estima.
- source_word: הָבֵן
  choice: entenda
  rationale: O imperativo pede que Daniel compreenda o conteúdo da revelação, e não apenas que o ouça.
- source_word: בַּדְּבָרִים אֲשֶׁר אָנֹכִי דֹבֵר אֵלֶיךָ
  choice: as palavras que estou lhe dizendo
  rationale: O plural דְּבָרִים, associado ao particípio de “falar”, refere-se primariamente às palavras que estão sendo comunicadas. A forma progressiva expressa a ação em curso.
- source_word: וַעֲמֹד עַל עָמְדֶךָ
  choice: fique de pé no seu lugar
  rationale: 'A tradução conserva os dois elementos do idioma hebraico: assumir a posição ereta e permanecer ou tomar o próprio lugar, sem reduzir a expressão a apenas um deles.'
- source_word: שֻׁלַּחְתִּי אֵלֶיךָ
  choice: fui enviado a você
  rationale: O perfeito passivo indica que o mensageiro recebeu uma missão cujo propósito se realiza naquele encontro. O pretérito perfeito é natural em português e mantém essa relevância imediata.
- source_word: וּבְדַבְּרוֹ עִמִּי אֶת הַדָּבָר הַזֶּה
  choice: Quando ele me dirigiu essa palavra
  rationale: A construção infinitiva marca ação contemporânea ou circunstancial. “Dirigiu essa palavra” mantém o singular do hebraico de modo natural e indica que a fala foi dirigida a Daniel.
- source_word: עָמַדְתִּי מַרְעִיד
  choice: fiquei de pé, tremendo
  rationale: עָמַדְתִּי retoma o comando anterior para Daniel se pôr de pé, enquanto מַרְעִיד descreve seu tremor físico. A formulação portuguesa expressa ambas as ações com clareza.
theological_decisions:
- issue: Descrição honorífica de Daniel na fala do mensageiro
  choice: homem muito amado
  alternative: homem muito estimado
  rationale: A opção comunica favor e afeição sem importar uma categoria doutrinária posterior. A nota preserva a possível nuance de estima ou preciosidade.
- issue: Sentido da ordem וַעֲמֹד עַל עָמְדֶךָ
  choice: fique de pé no seu lugar
  alternative: ponha-se de pé; permaneça no seu posto
  rationale: A formulação mantém a tensão entre a postura física e a ideia de ocupar o próprio lugar, evitando resolver uma ambiguidade genuína do idioma hebraico.
- issue: Agente não expresso em “fui enviado”
  choice: manter o agente implícito
  alternative: explicitar que Deus o enviou
  rationale: O hebraico usa uma forma passiva sem nomear nesta frase quem enviou o mensageiro. A tradução não acrescenta uma identificação teológica que o versículo deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais ao leitor brasileiro. O tratamento “você” mantém clareza contemporânea; “homem muito amado” e “me dirigiu essa palavra” preservam a solenidade do discurso sem arcaísmo excessivo.
