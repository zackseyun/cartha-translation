base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/018.yaml
  text: Again one with the appearance of a man touched me and strengthened me[a].
translation:
  language: pt
  text: De novo, alguém com aparência de homem tocou em mim e me fortaleceu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguém semelhante a um homem” ou “alguém com a aparência de um homem”. O hebraico descreve a semelhança visível da figura, sem identificá-la explicitamente como meramente humana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: De novo
  rationale: Com o verbo finito seguinte, יסף introduz aqui a repetição da ação. “De novo” é natural em português e preserva o valor de “outra vez”.
- source_word: וַיִּגַּע בִּי
  choice: tocou em mim
  rationale: נגע com ב indica contato físico neste contexto visionário; “tocou em mim” expressa de modo direto o sentido contextual.
- source_word: כְּמַרְאֵה אָדָם
  choice: aquele que tinha a aparência de um homem
  rationale: מַרְאֶה designa aparência ou forma visível, e כ marca semelhança. A formulação descreve a figura sem afirmar que ela era simplesmente humana.
- source_word: אָדָם
  choice: homem
  rationale: Neste contexto singular, a palavra descreve a aparência de uma figura masculina, não a humanidade em sentido coletivo.
- source_word: וַיְחַזְּקֵנִי
  choice: me fortaleceu
  rationale: O piel de חזק significa fortalecer ou tornar forte. “Me fortaleceu” conserva a amplitude física e emocional adequada ao contexto.
theological_decisions:
- issue: Identidade da figura com aparência de homem
  choice: Descrever a aparência sem identificar a figura
  alternative: Identificá-la como um ser angelical ou como o Cristo pré-encarnado
  rationale: O hebraico declara apenas que a figura tinha aparência de homem. A tradução preserva essa descrição e não acrescenta uma identificação teológica que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De novo” retoma naturalmente a ação anterior; “aquele que tinha a aparência” mantém a descrição visionária e a ambiguidade quanto à identidade da figura.
