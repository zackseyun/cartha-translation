  text: וְ/רָאִיתִי֩ אֲנִ֨י דָנִיֵּ֤אל לְ/בַדִּ/י֙ אֶת הַ/מַּרְאָ֔ה וְ/הָ/אֲנָשִׁים֙ אֲשֶׁ֣ר הָי֣וּ עִמִּ֔/י לֹ֥א רָא֖וּ אֶת הַ/מַּרְאָ֑ה אֲבָ֗ל חֲרָדָ֤ה גְדֹלָה֙ נָפְלָ֣ה עֲלֵי/הֶ֔ם וַֽ/יִּבְרְח֖וּ בְּ/הֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/007.yaml
  text: And I[a], Daniel, alone saw the vision, and the men who were with me did not see the vision; but a great trembling fell upon them[b], and they fled to hide themselves.
translation:
  language: pt
  text: Somente eu, Daniel, vi a visão; os homens que estavam comigo não viram a visão, mas um grande terror caiu sobre eles[a], e fugiram para se esconder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande tremor caiu sobre eles” ou “um grande pavor se apoderou deles”. O hebraico חֲרָדָה pode indicar tremor, pavor ou terror.
    reason: lexical_alternative
  - marker: b
    text: Ou “fugiram e se esconderam” ou “fugiram, escondendo-se”. O infinitivo hebraico בְּהֵחָבֵא pode expressar o propósito ou a maneira da fuga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אֲנִי דָנִיֵּאל לְבַדִּי
  choice: Somente eu, Daniel, vi
  rationale: A construção preserva a ênfase do pronome explícito, a identificação de Daniel e a exclusividade expressa por לְבַדִּי, em português claro e natural.
- source_word: הַמַּרְאָה
  choice: a visão
  rationale: Embora o termo possa significar aparência ou aquilo que é visto, no contexto revelatório de Daniel, “visão” comunica melhor a experiência visionária.
- source_word: וְהָאֲנָשִׁים אֲשֶׁר הָיוּ עִמִּי
  choice: os homens que estavam comigo
  rationale: Mantém o sentido masculino plural comum de אֲנָשִׁים e reproduz com naturalidade a oração relativa.
- source_word: לֹא רָאוּ אֶת הַמַּרְאָה
  choice: não viram a visão
  rationale: Repete “visão” para conservar o contraste explícito entre o que Daniel viu e o que seus companheiros não viram.
- source_word: חֲרָדָה גְדֹלָה
  choice: um grande terror
  rationale: חֲרָדָה abrange terror, pavor e tremor. “Grande terror” expressa naturalmente em português a reação intensa que domina os homens, enquanto a nota conserva a alternativa corporal.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: caiu sobre eles
  rationale: Preserva a metáfora hebraica vívida de uma experiência avassaladora que sobrevém às pessoas.
- source_word: וַיִּבְרְחוּ
  choice: e fugiram
  rationale: O verbo faz a narrativa avançar e “fugiram” mantém o peso da reação de medo.
- source_word: בְּהֵחָבֵא
  choice: para se esconder
  rationale: A expressão infinitiva pode indicar propósito ou maneira; esta formulação apresenta de modo natural a fuga com o propósito de se ocultarem.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Somente eu, Daniel” preserva a ênfase sem produzir a construção pouco natural “vi sozinho a visão”. A metáfora “caiu sobre eles” foi mantida por sua força e inteligibilidade.
