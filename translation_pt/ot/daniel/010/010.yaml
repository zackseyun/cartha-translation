revisions:
- from: E eis que uma mão me tocou e me fez mover[a], apoiado nos joelhos e nas palmas das mãos.
  to: E eis que uma mão me tocou e me pôs de joelhos e com as palmas das mãos no chão[a].
  rationale: A revisão substitui a construção ambígua «me fez mover, apoiado...» por uma expressão idiomática que comunica a posição de Daniel sobre os joelhos e as palmas das mãos. A nota preserva as alternativas lexicais de וַתְּנִיעֵנִי e evita decidir que o movimento tenha sido necessariamente tremor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:42:20Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem «E eis que», «uma mão» e «me tocou». Contudo, «me fez mover, apoiado nos joelhos...» não expressa com clareza a postura resultante indicada por עַל בִּרְכַי וְכַפּוֹת יָדָי e introduz uma construção participial que pode sugerir apenas que Daniel se movia enquanto já estava apoiado. O hifil de נוע admite movimento, abalo ou tremor; no contexto, uma formulação que apresente Daniel posto de joelhos e mãos no chão representa de modo mais fiel e inteligível o resultado narrado, sem afirmar que ele necessariamente tremeu.
  naturalness: «Apoiado nos joelhos e nas palmas das mãos» é compreensível, mas pouco idiomático e sintaticamente ligado de forma ambígua a «me fez mover». «De joelhos e com as palmas das mãos no chão» é natural em português moderno e descreve claramente a posição corporal.
  terminology: «E eis que», «uma mão», «tocou», «joelhos» e «palmas das mãos» são escolhas adequadas. Mantém-se «palmas das mãos», pois traduz especificamente כַּפּוֹת יָדַי.
  issues:
  - severity: medium
    issue: A expressão da postura resultante é ambígua e pouco natural.
    rationale: «me fez mover, apoiado nos joelhos e nas palmas das mãos» pode descrever movimento numa postura já assumida, em vez de o ato pelo qual Daniel veio a ficar sobre joelhos e palmas. A revisão torna explícito o resultado corporal do hebraico.
  revised_text: E eis que uma mão me tocou e me pôs de joelhos e com as palmas das mãos no chão[a].
  revised_footnotes:
  - marker: a
    text: Ou “me sacudiu” ou “me fez tremer”; o verbo hebraico pode indicar fazer alguém se mover, cambalear ou tremer.
    reason: lexical_alternative
