base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/010.yaml
  text: And behold[a], a hand touched me and set me on my knees and the palms of my hands.
translation:
  language: pt
  text: E eis que uma mão me tocou e me pôs de joelhos e com as palmas das mãos no chão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me sacudiu” ou “me fez tremer”; o verbo hebraico pode indicar fazer alguém se mover, cambalear ou tremer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a força vívida do marcador discursivo e sua função de chamar a atenção, em registro bíblico ainda compreensível.
- source_word: יָד
  choice: uma mão
  rationale: Reflete o substantivo sem artigo e mantém momentaneamente em aberto a identidade de quem toca Daniel.
- source_word: נָגְעָה בִּי
  choice: me tocou
  rationale: Verte diretamente o sentido comum de נגע neste contexto de contato físico.
- source_word: וַתְּנִיעֵנִי
  choice: me fez mover
  rationale: Expressa o valor causativo do hifil de נוע sem decidir de modo indevido entre movimento, sacudida e tremor; a nota registra a amplitude lexical.
- source_word: עַל בִּרְכַּי וְכַפּוֹת יָדָי
  choice: apoiado nos joelhos e nas palmas das mãos
  rationale: Comunica naturalmente em português a postura resultante e preserva a referência específica às palmas, em vez de reduzi-la apenas às mãos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve coloração bíblica em “E eis que”. A formulação preserva a ambiguidade lexical do verbo וַתְּנִיעֵנִי e apresenta de modo idiomático a postura de Daniel sobre os joelhos e as palmas das mãos.
