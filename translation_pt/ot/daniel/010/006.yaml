source:
  edition: WLC
  text: וּ/גְוִיָּת֣/וֹ כְ/תַרְשִׁ֗ישׁ וּ/פָנָ֞י/ו כְּ/מַרְאֵ֤ה בָרָק֙ וְ/עֵינָי/ו֙ כְּ/לַפִּ֣ידֵי אֵ֔שׁ וּ/זְרֹֽעֹתָי/ו֙ וּ/מַרְגְּלֹתָ֔י/ו כְּ/עֵ֖ין נְחֹ֣שֶׁת קָלָ֑ל וְ/ק֥וֹל דְּבָרָ֖י/ו כְּ/ק֥וֹל הָמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/006.yaml
  text: His body was like beryl[a], his face like the appearance of lightning, his eyes like torches of fire, his arms and his feet like the gleam of polished bronze[c][b], and the sound of his words like the sound of a multitude.
translation:
  language: pt
  text: Seu corpo era como berilo[a]; seu rosto, como a aparência de um relâmpago; seus olhos, como tochas de fogo; seus braços e pés, como o brilho do bronze polido[b]; e o som de suas palavras, como o som de uma multidão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “topázio”, “crisólito” ou outra pedra preciosa; a identificação exata do hebraico tarshish é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “como a aparência do bronze brunido”.
    reason: lexical_alternative
  - marker: c
    text: Ou “como o som de uma multidão em tumulto” ou “como o estrondo de uma multidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְוִיָּתוֹ
  choice: seu corpo
  rationale: גְוִיָּה designa o corpo ou a estrutura física; “seu corpo” é natural e concreto no contexto da visão.
- source_word: כְתַרְשִׁישׁ
  choice: como berilo
  rationale: תַּרְשִׁישׁ designa uma pedra preciosa cuja identificação mineral exata é incerta. “Berilo” mantém a imagem tradicional sem ocultar a incerteza, registrada em nota.
- source_word: פָנָיו
  choice: seu rosto
  rationale: Embora פָּנִים possa também significar presença, a sequência descreve traços visíveis da figura, favorecendo “rosto”.
- source_word: כְמַרְאֵה בָרָק
  choice: como a aparência de um relâmpago
  rationale: מַרְאֶה ressalta o aspecto visível; a formulação conserva essa nuance sem reduzir a expressão simplesmente a “como um relâmpago”.
- source_word: כְלַפִּידֵי אֵשׁ
  choice: como tochas de fogo
  rationale: לַפִּיד significa tocha ou archote flamejante. “Tochas de fogo” preserva de modo vívido a construção hebraica.
- source_word: זְרֹעֹתָיו וּמַרְגְּלֹתָיו
  choice: seus braços e pés
  rationale: זְרוֹעַ significa normalmente “braço”, e מַרְגְּלוֹת pode indicar os pés ou as extremidades inferiores. “Braços e pés” é claro e preserva a descrição anatômica.
- source_word: כְעֵין נְחֹשֶׁת קָלָל
  choice: como o brilho do bronze polido
  rationale: עֵין, nesta expressão, indica aspecto ou brilho; נְחֹשֶׁת é bronze ou cobre, e קָלָל provavelmente comunica a ideia de metal polido, brunido ou luminoso.
- source_word: קוֹל דְּבָרָיו
  choice: o som de suas palavras
  rationale: A formulação reproduz naturalmente a estrutura hebraica e destaca o efeito auditivo da fala.
- source_word: כְקוֹל הָמוֹן
  choice: como o som de uma multidão
  rationale: הָמוֹן pode indicar multidão, tumulto ou seu ruído intenso. A escolha preserva a ambiguidade entre o coletivo e o som avassalador que ele produz.
theological_decisions:
- issue: Identidade da figura descrita
  choice: Manter uma descrição direta da figura humana vista na visão, sem identificá-la no texto traduzido.
  alternative: Identificá-la como mensageiro angelical, manifestação teofânica ou aparição pré-encarnada de Cristo.
  rationale: O versículo descreve a figura, mas não a identifica explicitamente. A tradução não deve resolver uma questão interpretativa que o próprio texto deixa em aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação organiza a série de comparações, e as notas preservam as incertezas lexicais reais do hebraico.
