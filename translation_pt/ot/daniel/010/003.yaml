  text: לֶ֣חֶם חֲמֻד֞וֹת לֹ֣א אָכַ֗לְתִּי וּ/בָשָׂ֥ר וָ/יַ֛יִן לֹא בָ֥א אֶל פִּ֖/י וְ/ס֣וֹךְ לֹא סָ֑כְתִּי עַד מְלֹ֕את שְׁלֹ֥שֶׁת שָׁבֻעִ֖ים יָמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/003.yaml
  text: I ate no delicacies[a], and no meat or wine entered my mouth, nor did I anoint myself at all[b], until the completion of three full weeks.
translation:
  language: pt
  text: Não comi alimentos especiais[a]; carne e vinho não entraram em minha boca, nem usei óleo algum no corpo, até se completarem três semanas inteiras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «pão de coisas desejáveis»; isto é, alimento agradável, escolhido ou especial.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «três semanas de dias», isto é, três semanas completas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֲמֻדוֹת
  choice: comida saborosa
  rationale: A expressão, literalmente «pão de coisas desejáveis», é idiomática e designa alimento agradável ou especial, não apenas pão. «Comida saborosa» preserva esse sentido em português natural.
- source_word: בָשָׂר
  choice: carne
  rationale: No contexto de alimentação, «carne» é o equivalente direto e idiomático.
- source_word: יַיִן
  choice: vinho
  rationale: Correspondência direta e corrente.
- source_word: לֹא בָא אֶל־פִּי
  choice: não entraram na minha boca
  rationale: Mantém de perto a imagem hebraica e comunica claramente a abstinência de consumo.
- source_word: סוֹךְ ... סָכְתִּי
  choice: não passei óleo algum no corpo
  rationale: O verbo se refere à aplicação de óleo no corpo como cuidado pessoal ou revigoramento. Esta formulação evita a possível leitura exclusivamente ritual de «ungir» e expressa a negação enfática.
- source_word: עַד מְלֹאת
  choice: até se completarem
  rationale: Reproduz de modo natural a ideia de o período chegar ao seu término.
- source_word: שְׁלֹשֶׁת שָׁבֻעִים יָמִים
  choice: três semanas inteiras
  rationale: A expressão literalmente menciona «três semanas de dias»; «três semanas inteiras» transmite em português claro a duração completa indicada pelo hebraico.
