  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כִּ/דְמוּת֙ בְּנֵ֣י אָדָ֔ם נֹגֵ֖עַ עַל שְׂפָתָ֑/י וָ/אֶפְתַּח פִּ֗/י וָ/אֲדַבְּרָ/ה֙ וָ/אֹֽמְרָ/ה֙ אֶל הָ/עֹמֵ֣ד לְ/נֶגְדִּ֔/י אֲדֹנִ֗/י בַּ/מַּרְאָה֙ נֶהֶפְכ֤וּ צִירַ/י֙ עָלַ֔/י וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/016.yaml
  text: And behold[a], something like the likeness of a son of man touched my lips. Then I opened my mouth and spoke, and I said to the one standing before me, “My lord, because of the vision my pains have come upon me[c][b], and I have retained no strength.”
translation:
  language: pt
  text: 'E eis que algo semelhante à forma de um ser humano[a] tocou meus lábios. Então abri a boca, falei e disse àquele que estava diante de mim: “Meu senhor, por causa da visão, minhas dores se apoderaram de mim[b], e não conservei força alguma[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “algo como a semelhança dos filhos do homem”; isto é, algo de aparência humana. A expressão hebraica é incomumente sobreposta e imprecisa.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha angústia caiu sobre mim” ou “minhas fortes dores se apoderaram de mim”. A expressão hebraica retrata um sofrimento intenso que domina Daniel.
    reason: lexical_alternative
  - marker: c
    text: Ou “e nenhuma força restou em mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְמוּת בְּנֵי אָדָם
  choice: algo semelhante à forma de um ser humano
  rationale: A expressão hebraica é deliberadamente indireta e combina comparação, forma ou semelhança e uma referência genérica aos seres humanos. A tradução preserva a imprecisão visionária sem transformar בְּנֵי אָדָם em título messiânico.
- source_word: נֹגֵעַ עַל שְׂפָתָי
  choice: tocou meus lábios
  rationale: נגע com עַל indica contato; em português, a forma simples é natural. O particípio é entendido no encadeamento narrativo como ação passada.
- source_word: וָאֶפְתַּח פִּי
  choice: Então abri a boca
  rationale: Mantém o idiomatismo hebraico que introduz a fala e torna clara a progressão narrativa.
- source_word: וָאֲדַבְּרָה וָאֹמְרָה
  choice: falei e disse
  rationale: Conserva os dois verbos do hebraico, apesar da leve redundância retórica, sem tornar a frase artificial.
- source_word: הָעֹמֵד לְנֶגְדִּי
  choice: àquele que estava diante de mim
  rationale: לְנֶגֶד indica posição em frente ou defronte; “diante de mim” é natural e digno em português.
- source_word: אֲדֹנִי
  choice: Meu senhor
  rationale: É uma forma respeitosa de dirigir-se à figura celestial, não o nome divino. A inicial minúscula evita identificá-la indevidamente com YHWH.
- source_word: בַּמַּרְאָה
  choice: por causa da visão
  rationale: O ב é entendido causalmente no contexto, em que Daniel explica a origem de seu sofrimento.
- source_word: נֶהֶפְכוּ צִירַי עָלַי
  choice: minhas dores se apoderaram de mim
  rationale: צִירַי pode indicar dores, angústias ou fortes pontadas; com נהפכו עלי, descreve o sofrimento que sobrevém e domina Daniel.
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: e não conservei força alguma
  rationale: עצר aqui comunica reter ou conservar. A formulação permanece próxima do hebraico e é clara em português.
theological_decisions:
- issue: Sentido de בְּנֵי אָדָם na descrição visionária
  choice: referência humana genérica, “um ser humano”
  alternative: título messiânico “Filho do Homem” ou tradução mais literal “filhos do homem”
  rationale: A expressão é plural e está inserida numa fórmula comparativa de aparência. O contexto não justifica convertê-la em título cristológico; a tradução mantém a referência genérica e a incerteza da visão.
- issue: Sentido de אֲדֹנִי
  choice: “Meu senhor”, com inicial minúscula
  alternative: “Meu Senhor”, “senhor” ou “meu mestre”
  rationale: Trata-se de uma forma deferente de tratamento dirigida ao ser da visão, não do nome divino YHWH. A minúscula preserva essa distinção.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A formulação conserva a repetição narrativa “falei e disse”, a indeterminação da figura humana e a intensidade física ou emocional de צִירַי. Todos os marcadores de notas aparecem no texto em ordem alfabética.
