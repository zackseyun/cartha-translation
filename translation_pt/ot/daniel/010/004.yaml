base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/004.yaml
  text: On the twenty-fourth day of the first month[a], I was by the side of the great river—that is, the Tigris.
translation:
  language: pt
  text: No vigésimo quarto dia do primeiro mês, eu estava junto ao grande rio, isto é, o Tigre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Hidequel, nome hebraico tradicional do rio Tigre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: No vigésimo quarto dia
  rationale: A preposição e o substantivo introduzem a data. Embora o hebraico empregue literalmente a construção cardinal “vinte e quatro”, o português usa naturalmente o ordinal em fórmulas de data.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: do primeiro mês
  rationale: Reproduz de modo claro e natural a relação da data com o mês indicado.
- source_word: וַאֲנִי הָיִיתִי
  choice: eu estava
  rationale: Neste contexto, היה indica simplesmente a localização de Daniel; “eu estava” é direto e idiomático.
- source_word: עַל יַד
  choice: junto a
  rationale: A expressão idiomática significa “ao lado de” ou “junto a”. Evita acrescentar a ideia mais específica de “margem”, que não está expressa pelo substantivo hebraico.
- source_word: הַנָּהָר הַגָּדוֹל
  choice: o grande rio
  rationale: Tradução direta do substantivo com o adjetivo, preservando sua força descritiva.
- source_word: הוּא חִדָּקֶל
  choice: isto é, o Tigre
  rationale: O pronome introduz a identificação explicativa do rio. חִדָּקֶל é o nome hebraico do rio conhecido convencionalmente em português como Tigre.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. O conectivo inicial hebraico não foi representado separadamente, pois a fórmula temporal inicia o versículo naturalmente em português. A nota foi colocada após “Tigre”, termo ao qual sua informação lexical se refere.
