  text: וְ/הֵ֣יךְ יוּכַ֗ל עֶ֤בֶד אֲדֹנִ/י֙ זֶ֔ה לְ/דַבֵּ֖ר עִם אֲדֹ֣נִ/י זֶ֑ה וַ/אֲנִ֤י מֵ/עַ֨תָּה֙ לֹֽא יַעֲמָד בִּ֣/י כֹ֔חַ וּ/נְשָׁמָ֖ה לֹ֥א נִשְׁאֲרָה בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/017.yaml
  text: So how can this servant of my lord speak with my lord like this? As for me[a], from now on no strength remains in me[c][b], and no breath is left in me.
translation:
  language: pt
  text: Então, como pode este servo do meu senhor[a] falar assim[b] com o meu senhor? Quanto a mim, desde agora[c], não resta força em mim, e não resta em mim nenhum fôlego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu mestre”, nas duas ocorrências de “meu senhor”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “este servo do meu senhor… meu senhor, este”; a repetição de “este” ressalta a situação imediata. A tradução expressa a segunda ocorrência de modo idiomático com “assim”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “agora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיךְ יוּכַל
  choice: Então, como pode
  rationale: A combinação introduz uma pergunta retórica ligada ao contexto anterior. “Então” transmite naturalmente a força conjuntiva, e “pode” expressa capacidade.
- source_word: עֶבֶד אֲדֹנִי זֶה
  choice: este servo do meu senhor
  rationale: “Servo” preserva a autodesignação humilde e cortês de Daniel sem sugerir necessariamente escravidão como condição social. “Meu senhor” mantém o tratamento respeitoso dirigido à figura presente.
- source_word: לְדַבֵּר עִם אֲדֹנִי זֶה
  choice: falar assim com o meu senhor
  rationale: “Falar com” representa diretamente a construção com עִם. O segundo זֶה tem valor dêitico difícil de reproduzir literalmente; “assim” comunica de modo natural a situação imediata e a maneira de Daniel se dirigir ao interlocutor.
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: A expressão destaca a mudança para o estado pessoal de Daniel e preserva a ênfase do pronome explícito.
- source_word: מֵעַתָּה
  choice: desde agora
  rationale: Mantém o sentido temporal literal de “a partir de agora”, embora o contexto também permita o simples “agora”.
- source_word: לֹא יַעֲמָד בִּי כֹחַ
  choice: não resta força em mim
  rationale: Traduz idiomaticamente a imagem hebraica de a força já não se manter ou permanecer dentro dele.
- source_word: וּנְשָׁמָה לֹא נִשְׁאֲרָה בִי
  choice: e nenhum fôlego ficou em mim
  rationale: Neste contexto de esgotamento físico, נְשָׁמָה designa mais naturalmente o fôlego ou alento vital. “Ficou em mim” representa o sentido de algo que não restou.
theological_decisions:
- issue: Sentido de אֲדֹנִי no tratamento dado à figura celestial
  choice: meu senhor
  alternative: meu mestre
  rationale: O termo é um título respeitoso dirigido à figura presente, não o nome divino YHWH. “Meu senhor” conserva o registro elevado sem identificar explicitamente o interlocutor como Deus nem resolver sua identidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção cortês “este servo do meu senhor” preserva o tom humilde da fala, enquanto “falar assim” evita uma reprodução obscura do segundo demonstrativo hebraico. A perda de força e fôlego é expressa de forma concreta, sem transformar נְשָׁמָה em uma afirmação técnica sobre o espírito humano.
