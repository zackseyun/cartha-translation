  text: Then I heard the sound of his words[a], and when I heard the sound of his words, I fell into a deep sleep on my face[b], with my face to the ground.
translation:
  language: pt
  text: Então ouvi o som de suas palavras[a] e, ao ouvir o som de suas palavras, fiquei profundamente adormecido[b], de rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a voz de suas palavras”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fiquei adormecido” ou “fiquei atordoado e adormecido”; o hebraico indica sono pesado ou profundo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Então ouvi
  rationale: O wayyiqtol de שׁמע dá sequência à narrativa; “Então ouvi” expressa naturalmente essa progressão.
- source_word: קוֹל דְּבָרָיו
  choice: o som de suas palavras
  rationale: קוֹל pode significar “som” ou “voz”, enquanto דְּבָרָיו significa “suas palavras”; a formulação conserva a expressão hebraica sem identificar indevidamente o termo apenas com “voz”.
- source_word: וּכְשָׁמְעִי
  choice: Ao ouvir
  rationale: A construção com כ tem valor temporal. “Ao ouvir” é natural em português e mantém a repetição enfática do original.
- source_word: נִרְדָּם
  choice: caí em sono profundo
  rationale: A forma de רדם indica sono pesado ou profundo. O verbo “caí” comunica a entrada nesse estado, e não apenas uma condição estática.
- source_word: עַל פָּנַי וּפָנַי אָרְצָה
  choice: com o rosto em terra
  rationale: A expressão portuguesa comunica claramente a postura de Daniel, de bruços e com o rosto voltado para o chão, sem uma repetição corporal pouco natural.
theological_decisions:
- issue: Natureza do estado de Daniel diante da visão
  choice: colapso em sono profundo, com o rosto em terra
  alternative: transe extático
  rationale: נִרְדָּם designa mais naturalmente sono profundo ou torpor; o texto descreve o estado físico de Daniel sem exigir a categoria técnica de transe.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Preserva-se a repetição de “o som de suas palavras”, importante no hebraico; a descrição espacial é condensada em “com o rosto em terra”, enquanto a nota registra uma forma mais explícita.
