source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הֲ/יָדַ֨עְתָּ֙ לָ/מָּה בָּ֣אתִי אֵלֶ֔י/ךָ וְ/עַתָּ֣ה אָשׁ֔וּב לְ/הִלָּחֵ֖ם עִם שַׂ֣ר פָּרָ֑ס וַ/אֲנִ֣י יוֹצֵ֔א וְ/הִנֵּ֥ה שַׂר יָוָ֖ן בָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/020.yaml
  text: Then he said[a], “Do you know why I have come to you? And now I will return to fight against the prince of Persia; and when I go out, behold[c][b], the prince of Greece is coming.”
translation:
  language: pt
  text: 'Então ele disse: “Você sabe por que vim até você? Agora voltarei para lutar contra o príncipe da Pérsia; e, quando eu sair,[a] eis que o príncipe da Grécia está vindo.[b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “e eu estou saindo”. A oração hebraica é concisa e pode indicar simples partida ou uma sequência temporal: “quando eu sair”.'
    reason: lexical_alternative
  - marker: b
    text: “Príncipe” provavelmente se refere aqui a um governante sobrenatural associado a uma nação, embora este versículo não o identifique explicitamente dessa forma.
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “Javã”, nome que geralmente se refere à Grécia ou ao domínio grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Você sabe
  rationale: A interrogativa com ידע pergunta naturalmente se Daniel sabe ou compreende a razão da vinda do interlocutor. “Você sabe” é claro e corrente.
- source_word: לָמָּה
  choice: por que
  rationale: É a forma interrogativa normal para indagar a razão.
- source_word: בָּאתִי אֵלֶיךָ
  choice: vim até você
  rationale: O perfeito hebraico descreve a vinda já realizada e relevante para o diálogo presente; em português, o pretérito perfeito é natural.
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a progressão temporal do discurso. A conjunção pode ser representada naturalmente pela sequência sintática, sem a necessidade de “e”.
- source_word: אָשׁוּב
  choice: voltarei
  rationale: O imperfeito tem sentido futuro no contexto e indica retorno ao conflito anterior.
- source_word: לְהִלָּחֵם עִם
  choice: para lutar contra
  rationale: O infinitivo de לחם com עִם expressa envolvimento em conflito; “lutar contra” deixa clara a relação adversativa.
- source_word: שַׂר פָּרָס
  choice: o príncipe da Pérsia
  rationale: שַׂר pode significar príncipe, chefe ou autoridade. “Príncipe” preserva o termo e não explicita além do texto a natureza desse personagem.
- source_word: וַאֲנִי יוֹצֵא
  choice: quando eu sair
  rationale: A construção é concisa e admite leitura temporal ou simples coordenação. A opção temporal comunica com naturalidade a sequência, enquanto a nota preserva a alternativa.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: A expressão chama atenção para o que se segue e conserva o tom solene da visão em português atual.
- source_word: שַׂר יָוָן
  choice: o príncipe da Grécia
  rationale: יָוָן designa aqui a Grécia ou o domínio grego; “Grécia” torna o referente claro ao leitor moderno.
- source_word: בָּא
  choice: virá
  rationale: O particípio indica vinda em curso ou iminente. No encadeamento futuro da frase, “virá” é natural; “está vindo” permanece possível.
theological_decisions:
- issue: Identidade do “príncipe da Pérsia” e do “príncipe da Grécia”
  choice: Manter “príncipe” no texto principal sem qualificá-lo como angelical ou demoníaco.
  alternative: Entender como príncipe territorial sobrenatural ou como governante humano.
  rationale: O contexto mais amplo sugere seres sobrenaturais, mas este versículo não os classifica explicitamente. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” de acordo com o uso corrente e mantém “eis que” para conservar a solenidade visionária. As notas preservam a concisão e a ambiguidade do hebraico.
