  yaml_path: translation/ot/daniel/010/002.yaml
  text: In those days[a], I, Daniel, was mourning for three weeks of days.
translation:
  language: pt
  text: Naqueles dias, eu, Daniel, estive de luto durante três semanas inteiras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “três semanas de dias”, expressão que esclarece que se trata de três semanas comuns.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Reproduz naturalmente a expressão temporal hebraica com o substantivo plural e mantém o enquadramento narrativo.
- source_word: אֲנִי דָנִיֵּאל
  choice: eu, Daniel,
  rationale: A construção explícita com o pronome independente e o nome próprio é autoidentificadora e enfática; a aposição entre vírgulas transmite isso em português atual.
- source_word: הָיִיתִי מִתְאַבֵּל
  choice: estive de luto
  rationale: A combinação de היה com o particípio hitpael de אבל descreve um estado prolongado no passado. “Estive de luto” é natural e preserva o sentido específico de lamento, sem ampliar para a ideia mais genérica de tristeza.
- source_word: שְׁלֹשָׁה שָׁבֻעִים יָמִים
  choice: durante três semanas inteiras
  rationale: A expressão hebraica diz literalmente “três semanas, dias” e esclarece que se trata de semanas constituídas por dias comuns. “Três semanas inteiras” comunica essa força em português natural; a forma literal é preservada em nota.
theological_decisions:
- issue: Possível distinção entre semanas comuns e períodos simbólicos
  choice: três semanas inteiras
  alternative: três semanas de dias
  rationale: A tradução comunica que são semanas ordinárias sem impor uma interpretação específica sobre outros usos proféticos de “semanas”. A formulação mais literal seria pouco natural em português e aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O marcador da nota foi colocado junto à expressão que ele explica.
