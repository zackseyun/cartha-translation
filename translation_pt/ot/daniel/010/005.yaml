  text: וָ/אֶשָּׂ֤א אֶת עֵינַ/י֙ וָ/אֵ֔רֶא וְ/הִנֵּ֥ה אִישׁ אֶחָ֖ד לָב֣וּשׁ בַּדִּ֑ים וּ/מָתְנָ֥י/ו חֲגֻרִ֖ים בְּ/כֶ֥תֶם אוּפָֽז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/005.yaml
  text: I lifted up my eyes and looked[a], and behold, a man clothed in linen, with his waist girded with the gold of Uphaz.
translation:
  language: pt
  text: Ergui os olhos e olhei, e eis que ali estava um homem vestido de linho, com a cintura cingida de ouro de Ufaz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de ouro fino de Ufaz”. A expressão hebraica pode destacar a qualidade do ouro, além de sua procedência.'
    reason: Alternativa lexical para כֶּתֶם e possível relação de Ufaz com a procedência do ouro.
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי
  choice: Ergui os olhos
  rationale: Preserva a expressão hebraica de dirigir o olhar, sem reduzi-la ao verbo seguinte, “olhei”.
- source_word: וָאֵרֶא
  choice: e olhei
  rationale: Representa o segundo momento da percepção após Daniel erguer os olhos e evita antecipar a identificação da figura.
- source_word: וְהִנֵּה
  choice: e eis que ali estava
  rationale: “Eis que” mantém a força apresentativa e o tom visionário; “ali estava” completa a construção de modo natural em português sem acrescentar uma identificação à figura.
- source_word: אִישׁ אֶחָד
  choice: um homem
  rationale: Expressa naturalmente a figura humana masculina e não força o valor numeral de אֶחָד onde o português não o exige.
- source_word: לָבוּשׁ בַּדִּים
  choice: vestido de linho
  rationale: Mantém a referência ao material da veste sem especificar indevidamente o tipo de roupa.
- source_word: מָתְנָיו חֲגֻרִים
  choice: com a cintura cingida
  rationale: Transmite a região corporal e a imagem de algo ajustado ao redor dela em linguagem digna e compreensível.
- source_word: בְּכֶתֶם אוּפָז
  choice: de ouro de Ufaz
  rationale: Preserva Ufaz como nome próprio e deixa aberta a possibilidade de כֶּתֶם indicar tanto ouro precioso ou refinado quanto simplesmente ouro associado a Ufaz.
theological_decisions:
- issue: Identidade da figura da visão
  choice: Traduzir de modo neutro como “um homem”
  alternative: Identificá-lo como anjo, Messias ou manifestação divina
  rationale: O versículo descreve a aparência e a roupa da figura, mas não declara sua identidade; a tradução não resolve a tensão teológica além do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” conserva o tom visionário elevado; “cingida” mantém a imagem formal sem recorrer ao arcaísmo anatômico “lombos”.
