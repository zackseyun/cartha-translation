source:
  edition: WLC
  text: וְ/שַׂ֣ר מַלְכ֣וּת פָּרַ֗ס עֹמֵ֤ד לְ/נֶגְדִּ/י֙ עֶשְׂרִ֣ים וְ/אֶחָ֣ד י֔וֹם וְ/הִנֵּ֣ה מִֽיכָאֵ֗ל אַחַ֛ד הַ/שָּׂרִ֥ים הָ/רִאשֹׁנִ֖ים בָּ֣א לְ/עָזְרֵ֑/נִי וַ/אֲנִי֙ נוֹתַ֣רְתִּי שָׁ֔ם אֵ֖צֶל מַלְכֵ֥י פָרָֽס׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/013.yaml
  text: But the prince of the kingdom of Persia stood against me for twenty-one days[a], and behold, Michael, one of the chief princes, came to help me[b], and I was left there beside the kings of Persia.
translation:
  language: pt
  text: Mas o príncipe do reino da Pérsia se opôs a mim durante vinte e um dias. E eis que Miguel, um dos príncipes principais[a], veio me ajudar, e eu fui deixado ali, junto aos reis da Pérsia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um dos primeiros príncipes” ou “um dos príncipes de mais alta posição”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “os reis da Pérsia”, no plural; algumas traduções adotam o singular, “o rei da Pérsia”.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר
  choice: príncipe
  rationale: No contexto de Daniel, o termo designa alguém de alta posição e pode ter referência política ou celestial. “Príncipe” mantém essa ambiguidade e também serve para a descrição paralela de Miguel.
- source_word: מַלְכוּת פָּרַס
  choice: reino da Pérsia
  rationale: Reproduz a relação do construto hebraico e associa o príncipe ao domínio persa sem reduzir a expressão simplesmente a “Pérsia”.
- source_word: עֹמֵד לְנֶגְדִּי
  choice: se opôs a mim
  rationale: A expressão indica que alguém se mantém diante de outro em oposição. A formulação escolhida comunica naturalmente a força adversativa em português.
- source_word: עֶשְׂרִים וְאֶחָד יוֹם
  choice: durante vinte e um dias
  rationale: “Durante” expressa de modo natural em português a duração indicada pelo hebraico.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva o chamado vívido de atenção de הִנֵּה e o tom solene da passagem.
- source_word: מִיכָאֵל
  choice: Miguel
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אַחַד הַשָּׂרִים הָרִאשֹׁנִים
  choice: um dos príncipes principais
  rationale: הָרִאשֹׁנִים pode indicar primazia de posição ou destaque. “Principais” comunica a hierarquia sem definir sua natureza.
- source_word: בָּא לְעָזְרֵנִי
  choice: veio me ajudar
  rationale: Tradução direta e natural do verbo de movimento seguido da finalidade.
- source_word: נוֹתַרְתִּי
  choice: permaneci
  rationale: O nifal de יתר pode significar “ser deixado” ou “permanecer”. “Permaneci” é natural no contexto e não acrescenta um agente implícito.
- source_word: אֵצֶל מַלְכֵי פָרָס
  choice: junto aos reis da Pérsia
  rationale: אֵצֶל expressa proximidade ou associação; “junto a” conserva essa relativa abertura sem transformar a relação em oposição. O plural “reis” é mantido conforme o texto hebraico.
theological_decisions:
- issue: Identidade do “príncipe do reino da Pérsia” e dos “príncipes principais”
  choice: Manter “príncipe” sem identificar explicitamente as figuras como seres celestiais ou governantes humanos.
  alternative: Traduzir interpretativamente como “anjo”, “príncipe angelical” ou “governante”.
  rationale: Embora o contexto sugira fortemente um conflito celestial, o hebraico usa שַׂר. A tradução preserva a tensão entre referência celestial, política ou representativa.
- issue: Plural em מַלְכֵי פָרָס
  choice: reis da Pérsia
  alternative: rei da Pérsia
  rationale: O texto massorético está no plural. Mantê-lo evita harmonização interpretativa e permite que a expressão seja entendida como referência a vários reis, à dinastia persa ou a autoridades régias.
- issue: Sentido de נוֹתַרְתִּי
  choice: permaneci
  alternative: fui deixado
  rationale: A forma verbal admite ambos os sentidos. “Permaneci” oferece português natural sem afirmar quem teria deixado o mensageiro ali; a possibilidade passiva permanece registrada na análise lexical.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva “e eis que” para representar a vivacidade do hebraico, mantém a linguagem de “príncipe” sem explicação denominacional e preserva o plural incomum “reis da Pérsia”.
