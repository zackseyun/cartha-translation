source:
  edition: WLC
  text: בָּאתַ֣ר דְּנָה֩ חָזֵ֨ה הֲוֵ֜ית בְּ/חֶזְוֵ֣י לֵֽילְיָ֗/א וַ/אֲר֣וּ חֵיוָ֣ה רביעיה דְּחִילָה֩ וְ/אֵֽימְתָנִ֨י וְ/תַקִּיפָ֜א יַתִּ֗ירָא וְ/שִׁנַּ֨יִן דִּֽי פַרְזֶ֥ל לַ/הּ֙ רַבְרְבָ֔ן אָֽכְלָ֣ה וּ/מַדֱּקָ֔ה וּ/שְׁאָרָ֖/א ב/רגלי/ה רָפְסָ֑ה וְ/הִ֣יא מְשַׁנְּיָ֗ה מִן כָּל חֵֽיוָתָ/א֙ דִּ֣י קָֽדָמַ֔י/הּ וְ/קַרְנַ֥יִן עֲשַׂ֖ר לַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/007.yaml
  text: After this I kept looking in the visions of the night[a], and behold, a fourth beast, terrifying and dreadful and exceedingly strong. It had large iron teeth; it devoured and crushed, and it trampled the remainder with its feet. It was different from all the beasts that were before it[b], and it had ten horns.
translation:
  language: pt
  text: Depois disso, continuei olhando nas visões da noite, e eis um quarto animal, aterrorizante, medonho e extremamente forte. Tinha grandes dentes de ferro; devorava e despedaçava, e pisoteava com os pés o que restava. Era diferente de todos os animais que vieram antes dele e tinha dez chifres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: Depois disso
  rationale: Marca naturalmente a transição temporal e mantém a sequência da visão.
- source_word: חָזֵה הֲוֵית
  choice: continuei olhando
  rationale: O particípio com o auxiliar comunica ação contínua no passado, não apenas um ato pontual de ver.
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: nas visões da noite
  rationale: Reprodução próxima e natural da expressão aramaica, preservando o cenário visionário noturno.
- source_word: וַאֲרוּ
  choice: e eis
  rationale: Mantém o marcador dêitico que apresenta a cena de modo súbito e vívido.
- source_word: חֵיוָה רביעיה
  choice: um quarto animal
  rationale: No contexto, חֵיוָה designa a criatura simbólica da visão; 'animal' é claro e digno em português, sem antecipar sua identificação histórica.
- source_word: דְּחִילָה וְאֵימְתָנִי
  choice: aterrorizante, medonho
  rationale: Preserva os dois qualificativos relacionados, sem reduzir sua intensificação a um único termo.
- source_word: וְתַקִּיפָא יַתִּירָא
  choice: extremamente forte
  rationale: Expressa claramente a força excepcional indicada pelo adjetivo e seu intensificador.
- source_word: וְשִׁנַּיִן דִּי פַרְזֶל לַהּ רַבְרְבָן
  choice: Tinha grandes dentes de ferro
  rationale: Conserva tanto o material quanto o tamanho dos dentes em sintaxe portuguesa natural.
- source_word: אָכְלָה וּמַדֱּקָה
  choice: devorava e despedaçava
  rationale: Mantém a imagem animal e a violência destrutiva do segundo verbo.
- source_word: וּשְׁאָרָא בְרגליה רָפְסָה
  choice: e pisoteava com os pés o que restava
  rationale: Torna natural em português o contraste entre aquilo que era devorado e despedaçado e o restante que era pisoteado.
- source_word: מְשַׁנְּיָה מִן כָּל חֵיוָתָא דִּי קָדָמַיהּ
  choice: diferente de todos os animais que vieram antes dele
  rationale: Comunica a distinção em relação aos animais anteriores sem sugerir uma identificação interpretativa.
- source_word: וְקַרְנַיִן עֲשַׂר לַהּ
  choice: e tinha dez chifres
  rationale: Tradução direta da característica simbólica, sem explicá-la no corpo do versículo.
theological_decisions:
- issue: Identidade do quarto animal
  choice: Preservar a descrição simbólica sem identificar o reino representado.
  alternative: Inserir ou insinuar identificações como Roma, um império helenístico ou um reino escatológico composto.
  rationale: O versículo descreve o animal e sua singularidade, mas não nomeia aqui o poder histórico correspondente; a tradução não deve resolver essa questão interpretativa.
- issue: Valor simbólico dos dez chifres
  choice: Traduzir simplesmente 'dez chifres', sem interpretação adicional.
  alternative: Explicitar no texto que se trata de reis ou reinos.
  rationale: Embora o capítulo posteriormente interprete os chifres, este versículo apenas apresenta a imagem; antecipar a explicação reduziria a progressão literária da visão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o caráter vívido da visão e a repetição enfática dos qualificativos, evitando arcaísmos e identificações doutrinárias importadas.
