source:
  edition: WLC
  text: נְהַ֣ר דִּי נ֗וּר נָגֵ֤ד וְ/נָפֵק֙ מִן קֳדָמ֔וֹ/הִי אֶ֤לֶף אלפים יְשַׁמְּשׁוּנֵּ֔/הּ וְ/רִבּ֥וֹ רבון קָֽדָמ֣וֹ/הִי יְקוּמ֑וּן דִּינָ֥/א יְתִ֖ב וְ/סִפְרִ֥ין פְּתִֽיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/010.yaml
  text: A river of fire was flowing and coming out from before him[a]; a thousand thousands were serving him, and ten thousand times ten thousand were standing before him. The court sat[c][b], and the books were opened.
translation:
  language: pt
  text: Um rio de fogo corria e saía de diante dele. Milhares de milhares o serviam, e dez mil vezes dez mil estavam de pé diante dele. O tribunal tomou seu assento[a], e os livros[b] foram abertos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o juízo se assentou”; a expressão indica que a corte celeste tomou assento para julgar.
    reason: lexical_alternative
  - marker: b
    text: Ou “rolos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְהַר דִּי נוּר
  choice: um rio de fogo
  rationale: Preserva a imagem vívida e substancial do aramaico; a partícula relativa funciona aqui naturalmente como ligação genitiva.
- source_word: נָגֵד וְנָפֵק
  choice: corria e saía
  rationale: Os dois particípios descrevem ação contínua. A formulação mantém ambos os movimentos sem recorrer a linguagem arcaica.
- source_word: מִן קֳדָמוֹהִי
  choice: de diante dele
  rationale: Mantém a imagem espacial literal e a referência à figura entronizada, sem reduzir a expressão ao sentido abstrato de presença.
- source_word: אֶלֶף אלפים
  choice: mil milhares
  rationale: Conserva a forma numérica intensiva do original. Embora menos habitual, é inteligível em português e evita transformá-la apenas numa declaração genérica de incontabilidade.
- source_word: יְשַׁמְּשׁוּנֵּהּ
  choice: o serviam
  rationale: Expressa de modo claro e amplo o serviço ou assistência prestados a ele, sem impor sentido litúrgico técnico.
- source_word: וְרִבּוֹ רבון
  choice: dez mil vezes dez mil
  rationale: Preserva a imagem numérica e a grandiosidade da multidão celeste em linguagem portuguesa transparente.
- source_word: קָדָמוֹהִי יְקוּמוּן
  choice: permaneciam de pé diante dele
  rationale: No cenário de corte, comunica que a multidão estava em posição de assistência perante o trono; evita sugerir necessariamente que naquele instante se levantou.
- source_word: דִּינָא יְתִב
  choice: o tribunal tomou seu assento
  rationale: Traduz idiomaticamente a instalação da sessão judicial celeste, preservando o ato de se assentar presente no aramaico.
- source_word: וְסִפְרִין פְּתִיחוּ
  choice: e os livros foram abertos
  rationale: ‘Livros’ é natural e tradicional neste contexto judicial-apocalíptico, embora o termo também possa designar rolos ou registros escritos.
theological_decisions:
- issue: Expressão judicial דִּינָא יְתִב
  choice: O tribunal tomou seu assento
  alternative: O juízo se assentou
  rationale: A escolha comunica a instalação da corte celeste sem transformar a expressão numa abstração pouco natural. A nota conserva a forma mais literal e sua ambiguidade.
- issue: Expressões numéricas dos assistentes celestes
  choice: mil milhares ... dez mil vezes dez mil
  alternative: milhares e milhares ... miríades e miríades
  rationale: A tradução mantém as imagens numéricas do texto sem decidir se devem ser entendidas como contagem exata ou linguagem apocalíptica de incontabilidade.
- issue: Natureza dos registros abertos
  choice: livros
  alternative: rolos
  rationale: ‘Livros’ é suficientemente amplo e natural; a nota registra a possibilidade material de rolos sem afirmar mais do que o substantivo aramaico permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva o paralelismo e a solenidade da visão, evitando tanto arcaísmos como explicitações doutrinárias.
