  text: קִרְבֵ֗ת עַל חַד֙ מִן קָ֣אֲמַיָּ֔/א וְ/יַצִּיבָ֥א אֶבְעֵֽא מִנֵּ֖/הּ עַֽל כָּל דְּנָ֑ה וַ/אֲמַר לִ֕/י וּ/פְשַׁ֥ר מִלַּיָּ֖/א יְהוֹדְעִנַּֽ/נִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/016.yaml
  text: I approached one of those standing there and asked him the certainty about all this[b][a]. So he told me and made known to me the interpretation of the matter.
translation:
  language: pt
  text: Aproximei-me de um dos que estavam de pé e lhe perguntei a verdade sobre tudo aquilo.[a] Ele me respondeu e me deu a conhecer a interpretação das palavras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a certeza a respeito de tudo aquilo”. O termo aramaico pode designar o que é firme, certo ou verdadeiro.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a interpretação das palavras”. Aqui, “palavras” provavelmente se refere ao conteúdo ou assunto da visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבֵת
  choice: Aproximei-me
  rationale: Expressa naturalmente o perfeito aramaico em primeira pessoa e preserva o movimento em direção a alguém.
- source_word: עַל חַד מִן קָאֲמַיָּא
  choice: de um dos que estavam ali
  rationale: Mantém a referência indefinida a uma das figuras presentes, sem especificar sua identidade.
- source_word: וְיַצִּיבָא אֶבְעֵא מִנֵּהּ עַל כָּל דְּנָה
  choice: lhe perguntei a verdade sobre tudo aquilo
  rationale: יַצִּיבָא pode indicar aquilo que é firme, certo ou verdadeiro. Em português, 'a verdade sobre' reproduz de modo natural a busca de Daniel por uma explicação segura, sem eliminar a alternativa lexical 'certeza'.
- source_word: וַאֲמַר לִי
  choice: Ele me respondeu
  rationale: No contexto de uma pergunta, traduz idiomaticamente o ato subsequente de falar a Daniel.
- source_word: וּפְשַׁר מִלַּיָּא
  choice: a interpretação dessas coisas
  rationale: פְשַׁר significa 'interpretação'; embora מִלַּיָּא seja literalmente 'as palavras', aqui se refere provavelmente ao conteúdo da visão.
- source_word: יְהוֹדְעִנַּנִי
  choice: me deu a conhecer
  rationale: Preserva a força causativa do verbo aramaico e mantém um registro digno e compreensível.
