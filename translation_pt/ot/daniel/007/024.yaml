base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/024.yaml
  text: As for the ten horns[a], out of this kingdom ten kings will arise; and another will arise after them. He will be different from the former ones[b], and he will humble three kings.
translation:
  language: pt
  text: Quanto aos dez chifres, desse reino se levantarão dez reis; depois deles, se levantará outro. Ele será diferente dos anteriores e humilhará três reis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rebaixará”, “abaterá” ou “deporá três reis”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: os dez chifres
  rationale: Mantém o símbolo apocalíptico sem interpretá-lo, pois o próprio versículo explica que os chifres representam reis.
- source_word: מִנַּהּ מַלְכוּתָה
  choice: desse reino
  rationale: Expressa de modo natural que os reis surgem do reino representado pelo animal; o sufixo feminino retoma 'reino' no contexto.
- source_word: עַשְׂרָה מַלְכִין יְקֻמוּן
  choice: se levantarão dez reis
  rationale: No contexto de governantes, קום indica seu surgimento; 'levantar-se' conserva a imagem e é português bíblico claro.
- source_word: וְאָחֳרָן יְקוּם אַחֲרֵיהוֹן
  choice: depois deles, se levantará outro
  rationale: Preserva a sequência temporal e o paralelismo verbal. 'Outro' tem como referente contextual outro rei.
- source_word: יִשְׁנֵא מִן קַדְמָיֵא
  choice: será diferente dos anteriores
  rationale: No contexto, o verbo aramaico comunica distinção ou diversidade, não ódio. A formulação não especifica em que consiste a diferença.
- source_word: וּתְלָתָה מַלְכִין יְהַשְׁפִּל
  choice: e rebaixará três reis
  rationale: O Haphel de שׁפל significa fazer baixar ou rebaixar. 'Rebaixará' preserva a metáfora sem definir além do texto o modo político dessa ação.
theological_decisions:
- issue: Natureza da diferença do último governante em relação aos reis anteriores
  choice: Ele será diferente dos anteriores
  alternative: 'Ele será mais severo que os anteriores; ou: ele mudará em relação aos anteriores'
  rationale: O texto afirma a diferença, mas não define sua natureza nem identifica o governante. A tradução evita inserir um sistema interpretativo posterior.
- issue: Sentido da ação contra os três reis
  choice: rebaixará três reis
  alternative: humilhará, abaterá ou deporá três reis
  rationale: A tradução mantém a imagem de fazê-los baixar e evita decidir se a ação designa humilhação, subjugação ou deposição política.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura topicaliza naturalmente os dez chifres. Evitou-se explicar o símbolo além do que o próprio versículo declara e preservou-se a ambiguidade do verbo final.
