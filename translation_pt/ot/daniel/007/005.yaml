base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/005.yaml
  text: 'And look[a], another beast, a second one, resembling a bear; it was raised up on one side, and three ribs were in its mouth between its teeth. And this is what they were saying to it: “Arise[b], eat much flesh.”'
translation:
  language: pt
  text: 'E eis outra fera, uma segunda, semelhante a um urso. Ela estava levantada de um lado[b], e havia três costelas[a] em sua boca, entre os dentes. E assim lhe diziam: “Levante-se e coma muita carne!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “três presas”; porém, “costelas” se ajusta melhor à expressão “entre os dentes”.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “levantada sobre um flanco”, destacando a postura desigual da fera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוּ
  choice: E eis
  rationale: Preserva a força dêitica e vívida do marcador aramaico que introduz uma nova cena da visão, em registro bíblico digno e ainda compreensível.
- source_word: חֵיוָה
  choice: fera
  rationale: No contexto simbólico e ameaçador de Daniel 7, “fera” comunica melhor que um animal comum a natureza temível da criatura visionária.
- source_word: אָחֳרִי תִנְיָנָה
  choice: outra fera, uma segunda
  rationale: 'Mantém os dois elementos do original: a distinção de “outra” e a posição ordinal de “segunda”.'
- source_word: דָּמְיָה לְדֹב
  choice: semelhante a um urso
  rationale: Expressa diretamente a comparação indicada pela forma participial sem identificar a fera literalmente com um urso.
- source_word: וְלִשְׂטַר חַד הֳקִמַת
  choice: foi levantada sobre um dos lados
  rationale: Reflete o sentido passivo da forma verbal e conserva a imagem difícil de uma postura assimétrica, sem explicar seu possível simbolismo.
- source_word: וּתְלָת עִלְעִין
  choice: três costelas
  rationale: “Costelas” é o sentido contextual mais provável e combina naturalmente com sua posição entre os dentes; a possibilidade minoritária de “presas” é registrada em nota.
- source_word: בְּפֻמַּהּ בֵּין שניּה
  choice: em sua boca, entre os dentes
  rationale: Preserva as duas indicações de lugar e apresenta a segunda como especificação da primeira.
- source_word: וְכֵן אָמְרִין לַהּ
  choice: E assim lhe diziam
  rationale: Mantém o sujeito plural indefinido do original sem identificar os falantes e reproduz de modo natural o aspecto durativo da forma verbal.
- source_word: קוּמִי
  choice: Levante-se
  rationale: Imperativo natural em português, dirigido à fera, com dignidade adequada ao tom da visão.
- source_word: אֲכֻלִי בְּשַׂר שַׂגִּיא
  choice: coma muita carne
  rationale: Traduz literalmente o verbo “comer”, sem intensificá-lo para “devorar”, e conserva a imagem concreta de “carne”.
