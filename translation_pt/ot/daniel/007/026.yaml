  source_fidelity: 'A tradução preserva com precisão a sequência e as relações do aramaico: a corte/tribunal toma assento, o domínio lhe é removido por construção impessoal passiva, e esse domínio é destinado à destruição total “até o fim”. “O tribunal se assentará” mantém adequadamente a imagem forense de דִינָא יִתִּב sem reduzir o termo a um juízo meramente abstrato.'
  naturalness: O português é moderno, claro e de registro digno. “Mas o tribunal se assentará” e “o domínio dele será tirado” são formulações compreensíveis e apropriadas ao estilo visionário-jurídico do capítulo. A coordenação “para ser destruído e aniquilado” é fluente e conserva a intensificação do original.
  terminology: “Tribunal”, “domínio”, “destruído” e “aniquilado” são escolhas terminológicas consistentes com o contexto régio-apocalíptico. “Domínio dele” preserva o pronome masculino e evita especificar indevidamente o referente. As notas apresentam alternativas legítimas e não impõem uma identificação teológica.
