  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/דִינָ֖/א יִתִּ֑ב וְ/שָׁלְטָנֵ֣/הּ יְהַעְדּ֔וֹן לְ/הַשְׁמָדָ֥ה וּ/לְ/הוֹבָדָ֖ה עַד סוֹפָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/026.yaml
  text: But the court will sit[a], and his dominion will be taken away[c][b], to be destroyed and annihilated to the end.
translation:
  language: pt
  text: Mas o tribunal se assentará[a], e o domínio dele será tirado[b], para ser destruído e aniquilado até o fim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o juízo se assentará”; o aramaico pode destacar tanto a reunião do tribunal quanto a própria sessão judicial.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu governo” ou “sua autoridade”.
    reason: lexical_alternative
  - marker: c
    text: A expressão também pode ser entendida como “por completo”; literalmente, “até o fim”, ressaltando o caráter definitivo do juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִינָא
  choice: o tribunal
  rationale: Em aramaico bíblico, o termo pode indicar o juízo, a sessão judicial ou o corpo que julga. Com o verbo “assentar-se”, “o tribunal” preserva naturalmente a cena da corte celestial reunida.
- source_word: יִתִּב
  choice: se assentará
  rationale: O verbo significa literalmente “sentar-se”. No contexto judicial, descreve o tribunal tomando assento para julgar, mantendo a imagem do original em português digno e corrente.
- source_word: שָׁלְטָנֵהּ
  choice: o domínio dele
  rationale: O substantivo designa poder governante, domínio ou autoridade. “Domínio” se ajusta ao contexto régio e apocalíptico de Daniel 7; a construção “dele” conserva o referente masculino sem identificá-lo além do texto.
- source_word: יְהַעְדּוֹן
  choice: será tirado
  rationale: O verbo plural tem força indefinida ou impessoal neste contexto. A voz passiva comunica a retirada do domínio sem introduzir um agente explícito que o aramaico não identifica.
- source_word: לְהַשְׁמָדָה
  choice: para ser destruído
  rationale: A forma expressa propósito ou resultado após a retirada do domínio. A formulação passiva apresenta o domínio como aquilo que sofre a destruição.
- source_word: וּלְהוֹבָדָה
  choice: e aniquilado
  rationale: O segundo infinitivo intensifica o primeiro e comunica a eliminação completa. A coordenação evita repetição desnecessária de “ser” sem enfraquecer o paralelismo cumulativo.
- source_word: עַד סוֹפָא
  choice: até o fim
  rationale: É a correspondência direta da expressão aramaica e ressalta a finalidade e o caráter definitivo do juízo, sem transformá-la apenas no advérbio interpretativo “completamente”.
theological_decisions:
- issue: Referente de “o domínio dele”
  choice: Manter o pronome masculino referente ao governante arrogante, o pequeno chifre, no contexto imediato, sem explicitar sua identidade na tradução.
  alternative: Entender o domínio como pertencente mais amplamente à quarta fera e ao reino que ela representa.
  rationale: O contexto imediato concentra o juízo no chifre blasfemo, mas este permanece ligado à quarta fera. A tradução conserva a forma singular e a tensão do texto, sem impor uma identificação escatológica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Tribunal se assentará” preserva a imagem judicial do aramaico; “domínio dele” evita a ambiguidade potencial de “seu” e mantém o referente sem o identificar além do contexto. Os marcadores aparecem na ordem textual [a], [b], [c].
