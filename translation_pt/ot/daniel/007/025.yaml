source:
  edition: WLC
  text: וּ/מִלִּ֗ין לְ/צַ֤ד עלי/א יְמַלִּ֔ל וּ/לְ/קַדִּישֵׁ֥י עֶלְיוֹנִ֖ין יְבַלֵּ֑א וְ/יִסְבַּ֗ר לְ/הַשְׁנָיָה֙ זִמְנִ֣ין וְ/דָ֔ת וְ/יִתְיַהֲב֣וּן בִּ/ידֵ֔/הּ עַד עִדָּ֥ן וְ/עִדָּנִ֖ין וּ/פְלַ֥ג עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/025.yaml
  text: He will speak words against the Most High[a], and he will wear out the saints of the Most High. He will intend to change times and law, and they will be given into his hand for a time, times[c][b], and half a time.
translation:
  language: pt
  text: Ele proferirá palavras contra o Altíssimo e desgastará os santos do Altíssimo. Pretenderá mudar os tempos[a] e a lei, e eles[b] serão entregues em sua mão por um tempo, tempos e metade de um tempo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tempos determinados”; o termo também pode se referir a ocasiões fixadas, inclusive épocas festivas.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “serão entregues a ele”. O referente implícito mais natural são os santos.'
    reason: alternative_reading
  - marker: c
    text: Literalmente, “por um tempo, tempos e metade de um tempo”. A expressão pode indicar um período limitado e muitas vezes é entendida como três tempos e meio, ou três anos e meio.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלִּין לְצַד עֶלְיָא יְמַלִּל
  choice: proferirá palavras contra o Altíssimo
  rationale: Expressa com naturalidade a fala hostil e preserva a força adversativa da preposição, bem como o título divino.
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  choice: os santos do Altíssimo
  rationale: Mantém a designação tradicional e concisa sem explicitar no texto principal se os santos são seres humanos ou celestiais.
- source_word: יְבַלֵּא
  choice: desgastará
  rationale: Conserva a imagem de exaurir por ação contínua, em vez de reduzi-la simplesmente a perseguir ou oprimir.
- source_word: יִסְבַּר לְהַשְׁנָיָה
  choice: pretenderá mudar
  rationale: Indica intenção ou propósito sem afirmar que a mudança será efetivamente realizada.
- source_word: זִמְנִין
  choice: tempos
  rationale: É a tradução direta e permite preservar em nota a possibilidade de tempos determinados ou ocasiões fixadas.
- source_word: דָת
  choice: lei
  rationale: Representa o sentido usual do termo aramaico neste par com 'tempos', sem restringi-lo a uma legislação religiosa específica.
- source_word: יִתְיַהֲבוּן בִּידֵהּ
  choice: eles serão entregues nas mãos dele
  rationale: Mantém a voz passiva e traduz de modo natural a imagem semítica da mão como esfera de poder ou controle.
- source_word: עַד עִדָּן וְעִדָּנִין וּפְלַג עִדָּן
  choice: por um tempo, tempos e metade de um tempo
  rationale: Preserva a fórmula apocalíptica e sua indefinição, sem convertê-la em anos nem impor um cálculo cronológico.
theological_decisions:
- issue: Identidade dos santos do Altíssimo
  choice: Manter a expressão 'os santos do Altíssimo' sem especificar sua identidade no texto
  alternative: Explicitar 'o povo santo do Altíssimo' ou interpretar como seres celestiais
  rationale: O contexto favorece o povo de Deus, mas a expressão aramaica não deve ter sua possível amplitude eliminada pela tradução.
- issue: Referente do plural em 'eles serão entregues'
  choice: Manter o pronome plural, com nota indicando que seu referente mais natural são os santos
  alternative: Substituir diretamente por 'os santos serão entregues' ou relacionar o plural aos tempos e à lei
  rationale: A forma verbal é plural e o sujeito está implícito; a tradução conserva essa característica, enquanto a nota esclarece a leitura contextual mais provável.
- issue: Valor da fórmula temporal final
  choice: Conservar 'um tempo, tempos e metade de um tempo'
  alternative: Traduzir como 'três anos e meio' ou explicar como período simbólico limitado
  rationale: A fonte apresenta uma fórmula apocalíptica cuja duração e função simbólica são interpretadas de maneiras diferentes; o texto principal não deve decidir essa questão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. 'Proferirá' preserva solenidade sem arcaísmo excessivo; 'desgastará' mantém a metáfora da opressão contínua. A formulação evita linguagem denominacional e conserva as ambiguidades do sujeito plural e da duração apocalíptica.
