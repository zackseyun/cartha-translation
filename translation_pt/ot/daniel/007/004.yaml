source:
  edition: WLC
  text: קַדְמָיְתָ֣/א כְ/אַרְיֵ֔ה וְ/גַפִּ֥ין דִּֽי נְשַׁ֖ר לַ֑/הּ חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּי מְּרִ֨יטוּ גַפַּ֜י/הּ וּ/נְטִ֣ילַת מִן אַרְעָ֗/א וְ/עַל רַגְלַ֨יִן֙ כֶּ/אֱנָ֣שׁ הֳקִימַ֔ת וּ/לְבַ֥ב אֱנָ֖שׁ יְהִ֥יב לַֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/004.yaml
  text: The first was like a lion[a], and it had the wings of an eagle. I kept watching until its wings were plucked off, and it was lifted up from the earth and made to stand on two feet like a man[c][b], and a human heart was given to it.
translation:
  language: pt
  text: A primeira era semelhante a um leão e tinha asas de águia. Continuei olhando até que suas asas foram arrancadas[a]. Ela foi erguida da terra e posta sobre os pés, como um ser humano[b]; e foi-lhe dado um coração humano[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram puxadas para fora” ou “foram removidas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “posta sobre pés, como um ser humano”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “um coração de ser humano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְמָיְתָא
  choice: A primeira
  rationale: O ordinal feminino singular retoma naturalmente a primeira das feras da visão.
- source_word: כְאַרְיֵה
  choice: era semelhante a um leão
  rationale: O prefixo comparativo indica semelhança, não identidade; a formulação é clara e digna em português.
- source_word: וְגַפִּין דִּי נְשַׁר לַהּ
  choice: e tinha asas de águia
  rationale: A construção aramaica de posse, literalmente 'asas de águia eram para ela', é expressa idiomaticamente com 'tinha'.
- source_word: חָזֵה הֲוֵית
  choice: Continuei olhando
  rationale: O particípio com auxiliar comunica uma ação passada contínua; esta tradução preserva o caráter durativo.
- source_word: עַד דִּי
  choice: até que
  rationale: Introduz o ponto temporal alcançado durante a observação da visão.
- source_word: מְּרִיטוּ גַפַּיהּ
  choice: suas asas foram arrancadas
  rationale: O verbo descreve asas puxadas ou removidas à força; 'arrancadas' preserva a força visual e é natural em português.
- source_word: וּנְטִילַת מִן אַרְעָא
  choice: Ela foi erguida da terra
  rationale: Mantém o sentido passivo e o movimento para longe da terra, com o pronome feminino retomando a fera.
- source_word: וְעַל רַגְלַיִן כֶּאֱנָשׁ הֳקִימַת
  choice: e posta em pé, sobre dois pés, como um ser humano
  rationale: O causativo indica que a fera foi colocada na posição ereta. 'Dois pés' explicita naturalmente o dual aramaico sem perder a imagem.
- source_word: אֱנָשׁ
  choice: um ser humano / humano
  rationale: Nos dois usos, o termo destaca o contraste entre a fera e características humanas, sem exigir referência específica ao sexo masculino.
- source_word: וּלְבַב אֱנָשׁ יְהִיב לַהּ
  choice: e foi-lhe dado um coração humano
  rationale: A expressão mantém a imagem concreta do coração e a oposição entre a condição animal e a humana, sem explicar além do texto.
theological_decisions:
- issue: Linguagem antropológica na transformação da fera
  choice: como um ser humano / um coração humano
  alternative: como um homem / coração de homem
  rationale: O aramaico contrasta a fera com a humanidade. A formulação escolhida preserva esse contraste e evita restringir desnecessariamente a referência ao sexo masculino.
- issue: Sentido de 'coração'
  choice: Preservar a imagem como 'coração humano'
  alternative: mente humana ou natureza humana
  rationale: Embora 'coração' possa abranger entendimento e disposição interior, traduzi-lo diretamente conserva a amplitude e a tensão da metáfora sem impor uma interpretação.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é narrativo e digno; conserva a progressão visual da cena e evita linguagem excessivamente arcaica. A referência à fera permanece no feminino, em concordância com 'a primeira' e com o antecedente implícito 'fera'.
