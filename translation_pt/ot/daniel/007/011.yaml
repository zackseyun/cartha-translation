source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית בֵּ/אדַ֗יִן מִן קָל֙ מִלַּיָּ֣/א רַבְרְבָתָ֔/א דִּ֥י קַרְנָ֖/א מְמַלֱּלָ֑ה חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּ֨י קְטִילַ֤ת חֵֽיוְתָ/א֙ וְ/הוּבַ֣ד גִּשְׁמַ֔/הּ וִ/יהִיבַ֖ת לִ/יקֵדַ֥ת אֶשָּֽׁא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/011.yaml
  text: I kept watching then because of the sound of the great words that the horn was speaking. I kept watching until the beast was killed[a], and its body was destroyed and given over to the burning fire.
translation:
  language: pt
  text: Continuei olhando então, por causa do som das grandes palavras[a] que o chifre dizia. Continuei olhando até que a besta foi morta, seu corpo foi destruído e entregue ao fogo ardente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “palavras arrogantes” ou “palavras de vanglória”; literalmente, “grandes palavras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Continuei olhando
  rationale: A construção com particípio e verbo auxiliar expressa ação contínua no passado; esta formulação preserva a duração e soa natural em português.
- source_word: בֵּאדַיִן
  choice: então
  rationale: Advérbio temporal que marca a sequência dos acontecimentos na visão.
- source_word: מִן
  choice: por causa de
  rationale: Neste contexto, introduz a causa ou ocasião pela qual Daniel continuou olhando.
- source_word: קָל
  choice: som
  rationale: Designa aquilo que era audível; evita atribuir ao chifre uma voz pessoal além do que a imagem já expressa.
- source_word: מִלַּיָּא רַבְרְבָתָא
  choice: as grandes palavras
  rationale: Preserva a expressão aramaica literalmente, sem eliminar sua possível conotação de arrogância ou vanglória.
- source_word: קַרְנָא
  choice: o chifre
  rationale: Mantém diretamente a figura simbólica da visão, sem interpretá-la na tradução.
- source_word: מְמַלֱּלָה
  choice: dizia
  rationale: O particípio descreve fala em andamento; no contexto, o imperfeito português comunica essa continuidade de modo natural.
- source_word: עַד דִּי
  choice: até que
  rationale: Marca o ponto final da observação contínua de Daniel.
- source_word: קְטִילַת חֵיוְתָא
  choice: o animal foi morto
  rationale: Reproduz claramente a construção passiva. 'Animal' é natural em português e mantém o ser visto na visão sem acrescentar juízo moral lexical.
- source_word: וְהוּבַד
  choice: foi destruído
  rationale: Expressa de maneira direta a destruição do corpo do animal.
- source_word: גִּשְׁמַהּ
  choice: seu corpo
  rationale: Equivalente simples e preciso, sem acrescentar a ideia específica de cadáver.
- source_word: וִיהִיבַת לִיקֵדַת אֶשָּׁא
  choice: entregue ao fogo ardente
  rationale: Comunica a entrega do corpo para a queima pelo fogo em português natural, preservando a imagem de julgamento.
theological_decisions:
- issue: Se a expressão 'grandes palavras' deve ser interpretada explicitamente como fala arrogante no texto principal
  choice: Manter 'grandes palavras' no texto principal
  alternative: palavras arrogantes; palavras de vanglória
  rationale: O contexto sugere arrogância e vanglória, mas a expressão aramaica diz literalmente 'grandes palavras'. A tradução preserva essa tensão e registra a conotação possível em nota.
- issue: Se as imagens do julgamento devem ser interpretadas em termos abstratos
  choice: Manter 'o animal', 'seu corpo' e 'fogo ardente' como imagens da visão
  alternative: o reino foi destruído; ele foi completamente julgado
  rationale: O versículo narra símbolos vistos por Daniel; interpretá-los no próprio texto importaria uma identificação que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. A repetição de 'Continuei olhando' foi preservada por sua função narrativa e enfática. O marcador de nota foi colocado após a frase à qual se refere, embora a nota esclareça especificamente 'grandes palavras'.
