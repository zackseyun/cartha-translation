id: DAN.7.9
reference: Daniel 7:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֗ית עַ֣ד דִּ֤י כָרְסָוָן֙ רְמִ֔יו וְ/עַתִּ֥יק יוֹמִ֖ין יְתִ֑ב לְבוּשֵׁ֣/הּ כִּ/תְלַ֣ג חִוָּ֗ר וּ/שְׂעַ֤ר רֵאשֵׁ/הּ֙ כַּ/עֲמַ֣ר נְקֵ֔א כָּרְסְיֵ/הּ֙ שְׁבִיבִ֣ין דִּי נ֔וּר גַּלְגִּלּ֖וֹ/הִי נ֥וּר דָּלִֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/009.yaml
  text: I kept watching until thrones were set in place[a], and the Ancient of Days took his seat. His clothing was white as snow, and the hair of his head was like pure wool. His throne was flames of fire[b]; its wheels were a burning fire.
translation:
  language: pt
  text: Continuei olhando até que tronos foram colocados[a], e o Ancião de Dias[b] se assentou. Sua veste era branca como a neve, e os cabelos de sua cabeça eram como lã pura. Seu trono eram chamas de fogo; as rodas do trono eram fogo ardente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tronos foram postos em seus lugares”. A tradução tradicional “tronos foram derrubados” é menos provável aqui, pois a cena seguinte apresenta a instalação da corte celestial.'
    reason: alternative_reading
  - marker: b
    text: 'Aramaico: “Ancião de Dias”, título que enfatiza grande antiguidade e majestade eterna.'
    reason: cultural_note
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Continuei olhando
  rationale: O particípio com o auxiliar expressa uma ação contínua no passado; a formulação comunica naturalmente a continuidade da visão.
- source_word: עַד דִּי
  choice: até que
  rationale: Introduz o acontecimento até o qual Daniel continuou olhando.
- source_word: כָרְסָוָן
  choice: tronos
  rationale: O plural se refere a tronos reais ou judiciais e preserva a imagem da corte celestial.
- source_word: רְמִיו
  choice: foram colocados
  rationale: No contexto da instalação da corte celestial, o verbo indica mais provavelmente que os tronos foram postos em seus lugares; o sentido de serem derrubados é possível lexicalmente, mas menos adequado aqui.
- source_word: וְעַתִּיק יוֹמִין
  choice: e o Ancião de Dias
  rationale: Mantém de perto o título aramaico solene, que ressalta idade imemorial e majestade, sem substituir a imagem por uma interpretação.
- source_word: יְתִב
  choice: se assentou
  rationale: Expressa o ato de tomar assento e convém ao contexto de entronização e julgamento.
- source_word: לְבוּשֵׁהּ כִּתְלַג חִוָּר
  choice: Sua roupa era branca como a neve
  rationale: Reproduz a comparação visual em português natural, tratando o singular como designação coletiva da vestimenta.
- source_word: וּשְׂעַר רֵאשֵׁהּ כַּעֲמַר נְקֵא
  choice: e os cabelos da sua cabeça eram como lã pura
  rationale: Preserva a noção de pureza ou limpeza de נְקֵא sem explicitar novamente a brancura já sugerida pelo paralelismo.
- source_word: כָּרְסְיֵהּ שְׁבִיבִין דִּי נוּר
  choice: Seu trono eram chamas de fogo
  rationale: Conserva a metáfora nominal intensa do aramaico e a imagem flamejante; a concordância com o predicativo plural é natural em português.
- source_word: גַּלְגִּלּוֹהִי נוּר דָּלִק
  choice: as rodas dele eram fogo ardente
  rationale: O pronome retoma o trono, não a pessoa, preservando a imagem do trono-carro; 'fogo ardente' reproduz a expressão nominal.
theological_decisions:
- issue: Tradução de עַתִּיק יוֹמִין como título divino
  choice: o Ancião de Dias
  alternative: o Ancião; alguém idoso em dias
  rationale: A expressão funciona como título reverente na visão da corte celestial. A tradução mantém sua forma descritiva e a tensão teológica do texto, sem reduzir o título a uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Mantiveram-se a progressão visionária, a imagética judicial e o título tradicional próximo do aramaico. O referente de “dele” foi explicitamente orientado pelo contexto para o trono, evitando atribuir rodas ao Ancião de Dias.
