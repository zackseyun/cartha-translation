  text: חָזֵ֣ה הֲוֵ֔ית וְ/קַרְנָ֣/א דִכֵּ֔ן עָבְדָ֥ה קְרָ֖ב עִם קַדִּישִׁ֑ין וְ/יָכְלָ֖ה לְ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/021.yaml
  text: I kept watching[a], and that horn was making war with the holy ones and was prevailing over them,
translation:
  language: pt
  text: Eu continuava olhando, e aquele chifre fazia guerra contra os santos[a] e prevalecia sobre eles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que são santos” ou “o povo santo de Deus”. O aramaico diz literalmente “os santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Eu continuava olhando
  rationale: A construção com particípio e verbo de existência indica ação contínua no passado; esta formulação comunica naturalmente o caráter durativo da visão.
- source_word: וְקַרְנָא דִכֵּן
  choice: e aquele chifre
  rationale: דִכֵּן retoma demonstrativamente o chifre já descrito; “aquele chifre” é claro e natural em português.
- source_word: עָבְדָה קְרָב
  choice: fazia guerra
  rationale: Preserva de modo inteligível o idioma aramaico formado por “fazer” e “guerra”, além do aspecto contínuo da cena.
- source_word: עִם
  choice: contra
  rationale: Embora a preposição signifique literalmente “com”, em português a expressão idiomática natural é “fazer guerra contra”; o contexto exige oposição hostil.
- source_word: קַדִּישִׁין
  choice: os santos
  rationale: O adjetivo substantivado significa literalmente “os santos” ou “os que são santos”. Esta forma é concisa e tradicional, enquanto a nota preserva alternativas e a amplitude do referente.
- source_word: וְיָכְלָה לְהוֹן
  choice: e prevalecia sobre eles
  rationale: O verbo pode significar ser capaz, prevalecer ou vencer; “prevalecia” mantém o caráter progressivo da descrição visionária sem apresentá-lo como ato meramente pontual.
theological_decisions:
- issue: Referente de קַדִּישִׁין
  choice: os santos
  alternative: os seres santos; o povo santo de Deus
  rationale: A tradução não restringe o referente exclusivamente ao povo da aliança nem a seres celestiais. A nota registra as possibilidades e preserva a tensão interpretativa do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto imediato.
