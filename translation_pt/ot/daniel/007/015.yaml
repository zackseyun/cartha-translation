source:
  edition: WLC
  text: אֶתְכְּרִיַּ֥ת רוּחִ֛/י אֲנָ֥ה דָנִיֵּ֖אל בְּ/ג֣וֹא נִדְנֶ֑ה וְ/חֶזְוֵ֥י רֵאשִׁ֖/י יְבַהֲלֻנַּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/015.yaml
  text: As for me[a], Daniel, my spirit was distressed within me, and the visions of my head terrified me.
translation:
  language: pt
  text: Quanto a mim, Daniel, meu espírito ficou angustiado dentro de sua bainha[a], e as visões da minha cabeça me aterrorizaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentro do meu corpo”. O termo aramaico traduzido por “bainha” é uma metáfora rara para o corpo que encerra o espírito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתְכְּרִיַּת
  choice: ficou angustiado
  rationale: Expressa a aflição e a perturbação interior indicadas pelo verbo, em português natural, sem impor a imagem mais literal e obscura de ser ferido ou traspassado.
- source_word: רוּחִי
  choice: meu espírito
  rationale: Preserva o sentido antropológico do espírito interior de Daniel, em contraste com os sentidos possíveis de vento ou sopro.
- source_word: בְּגוֹא נִדְנֶה
  choice: dentro de sua bainha
  rationale: Mantém a rara metáfora aramaica da bainha ou invólucro que contém o espírito; o pronome retoma 'meu espírito'. A interpretação corporal é indicada na nota.
- source_word: חֶזְוֵי
  choice: as visões
  rationale: No contexto apocalíptico, refere-se às cenas vistas por Daniel em experiência visionária.
- source_word: רֵאשִׁי
  choice: da minha cabeça
  rationale: Conserva o modo de expressão concreto do aramaico, sem reduzi-lo interpretativamente a 'mente'.
- source_word: יְבַהֲלֻנַּנִי
  choice: me aterrorizaram
  rationale: Comunica a forte intensidade de medo e alarme expressa pelo verbo.
theological_decisions:
- issue: Relação entre espírito e corpo na metáfora de נִדְנֶה
  choice: Preservar 'bainha' no texto e explicar a referência corporal em nota
  alternative: Traduzir diretamente 'dentro do meu corpo' ou 'dentro de mim'
  rationale: A formulação evita resolver silenciosamente a antropologia da passagem e conserva sua imagem rara, ao mesmo tempo que torna a interpretação provável acessível ao leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A expressão incomum “bainha” foi mantida por fidelidade à metáfora aramaica e esclarecida em nota.
