  text: וּ/שְׁאָר֙ חֵֽיוָתָ֔/א הֶעְדִּ֖יו שָׁלְטָנְ/ה֑וֹן וְ/אַרְכָ֧ה בְ/חַיִּ֛ין יְהִ֥יבַת לְ/ה֖וֹן עַד זְמַ֥ן וְ/עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/012.yaml
  text: As for the rest of the beasts[a], their dominion was taken away, but an extension of life was given to them for a time and a season.
translation:
  language: pt
  text: Quanto aos outros animais, seu domínio foi tirado, mas sua vida foi prolongada por um tempo e uma época.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até um tempo e uma época”. A expressão aramaica pode ser entendida como indicação do limite do prolongamento que lhes foi concedido.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁאָר חֵיוָתָא
  choice: Quanto aos outros animais
  rationale: A expressão introduz uma mudança contrastiva para os demais animais da visão. “Quanto aos” explicita naturalmente essa função discursiva, e “animais” é claro em português sem perder o caráter simbólico do contexto.
- source_word: הֶעְדִּיו שָׁלְטָנְהוֹן
  choice: seu domínio foi tirado
  rationale: O passivo preserva a forma da oração aramaica sem identificar quem removeu o poder; “domínio” expressa a autoridade governante no vocabulário político e apocalíptico de Daniel.
- source_word: וְאַרְכָה בְחַיִּין יְהִיבַת לְהוֹן
  choice: mas foi-lhes concedido prolongar a vida
  rationale: O valor adversativo da conjunção ressalta o contraste entre a perda do domínio e a continuação da vida. A formulação verbal é natural em português e não acrescenta identidade ao agente implícito.
- source_word: עַד זְמַן וְעִדָּן
  choice: por um tempo e uma época
  rationale: A tradução mantém distintos os dois substantivos temporais e comunica duração limitada, sem lhes impor um esquema escatológico técnico.
theological_decisions:
- issue: A duração da existência dos animais depois da perda do domínio
  choice: por um tempo e uma época
  alternative: até um tempo e uma época
  rationale: A leitura principal expressa uma duração limitada; a nota preserva a possibilidade de que a expressão aramaica indique mais diretamente o limite final do período concedido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Animais” evita a possível carga excessivamente fantástica de “feras”, enquanto o contexto visionário deixa claro seu caráter simbólico. A construção “foi-lhes concedido” mantém tom solene sem ser arcaizante.
