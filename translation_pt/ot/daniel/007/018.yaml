source:
  edition: WLC
  text: וִֽ/יקַבְּלוּן֙ מַלְכוּתָ֔/א קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/יַחְסְנ֤וּן מַלְכוּתָ/א֙ עַֽד עָ֣לְמָ֔/א וְ/עַ֖ד עָלַ֥ם עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/018.yaml
  text: But the holy ones of the Most High will receive the kingdom and possess the kingdom forever—forever and ever[a].
translation:
  language: pt
  text: Mas os santos do Altíssimo receberão o reino e possuirão o reino para sempre — para todo o sempre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que são santos e pertencem ao Altíssimo”. A expressão aramaica pode referir-se ao povo santo de Deus; neste contexto, alguns intérpretes também entendem uma referência a seres celestiais.
    reason: Alternativa lexical e preservação da ambiguidade quanto à identidade dos “santos”.
lexical_decisions:
- source_word: וִיקַבְּלוּן
  choice: receberão
  rationale: O imperfeito Peal de קבל significa normalmente “receber” ou “aceitar” no aramaico bíblico. “Receberão” preserva o sentido direto sem sugerir conquista pela força nem explicitar uma construção passiva ausente no texto.
- source_word: מַלְכוּתָא
  choice: o reino
  rationale: O substantivo pode indicar tanto o domínio real quanto o âmbito governado. “O reino” é natural em português e mantém essa amplitude no contraste apocalíptico entre os reinos.
- source_word: קַדִּישֵׁי
  choice: os santos
  rationale: O adjetivo substantivado significa literalmente “os santos” ou “os que são santos”. A formulação é concisa e deixa em aberto se a referência é ao povo santo de Deus ou a seres celestiais.
- source_word: עֶלְיוֹנִין
  choice: do Altíssimo
  rationale: No contexto, funciona como título divino. “Altíssimo” é a forma consagrada e natural em português, preservando sua força superlativa.
- source_word: וְיַחְסְנוּן
  choice: e possuirão
  rationale: O verbo expressa posse duradoura. “Possuirão” acompanha adequadamente “receberão” e evita a interpretação mais específica de “herdarão”.
- source_word: עַד עָלְמָא
  choice: para sempre
  rationale: A expressão idiomática indica duração sem fim; “para sempre” comunica isso de modo claro e natural.
- source_word: וְעַד עָלַם עָלְמַיָּא
  choice: para todo o sempre
  rationale: A expressão intensificada reforça a permanência do reino. “Para todo o sempre” preserva em português a progressão enfática após “para sempre”.
theological_decisions:
- issue: Identidade de קַדִּישֵׁי עֶלְיוֹנִין
  choice: A expressão foi traduzida de modo genérico como “os santos do Altíssimo”, sem definir com maior precisão sua identidade.
  alternative: “o povo santo do Altíssimo” ou “os seres santos do Altíssimo”
  rationale: Daniel 7 permite discussão sobre uma referência ao povo fiel de Deus, a seres celestiais ou a ambos em relação representativa. O versículo não exige que a tradução resolva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “o reino” foi mantida por refletir a ênfase do original, e o travessão destaca a intensificação final sem alterar sua relação sintática.
