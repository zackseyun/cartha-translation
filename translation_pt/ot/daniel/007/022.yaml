  text: עַ֣ד דִּֽי אֲתָ֗ה עַתִּיק֙ יֽוֹמַיָּ֔/א וְ/דִינָ֣/א יְהִ֔ב לְ/קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/זִמְנָ֣/א מְטָ֔ה וּ/מַלְכוּתָ֖/א הֶחֱסִ֥נוּ קַדִּישִֽׁין־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/022.yaml
  text: until the Ancient of Days came[a], and judgment was given to the saints of the Most High, and the time arrived[c][b], and the saints took possession of the kingdom.
translation:
  language: pt
  text: até que veio o Ancião de Dias, e a sentença foi dada em favor dos santos do Altíssimo[a], e chegou o tempo, e os santos tomaram posse do reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sentença foi dada aos santos do Altíssimo”. A preposição aramaica pode indicar tanto benefício (“em favor de”) quanto destinatário (“aos”).'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד דִּי
  choice: até que
  rationale: Introduz naturalmente, em português, o limite temporal da opressão descrita antes.
- source_word: אֲתָה
  choice: veio
  rationale: Expressa de modo direto e narrativo a ideia de vir ou chegar.
- source_word: עַתִּיק יוֹמַיָּא
  choice: o Ancião de Dias
  rationale: Preserva o título divino e sua imagem de antiguidade venerável; é também a forma consagrada e inteligível em português.
- source_word: וְדִינָא יְהִב
  choice: e a sentença foi dada
  rationale: Mantém a construção passiva e o sentido forense de דִּין; 'sentença' comunica aqui uma decisão judicial com mais naturalidade do que a expressão ambígua 'julgamento foi dado'.
- source_word: לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: em favor dos santos do Altíssimo
  rationale: 'No contexto, a preposição é entendida em sentido benefactivo: a decisão judicial favorece e vindica os santos. A possibilidade de destinatário é preservada em nota.'
- source_word: וְזִמְנָא מְטָה
  choice: então chegou o tempo
  rationale: Indica a chegada do momento decisivo sem acrescentar que fosse explicitamente 'determinado'; 'então' representa com naturalidade a progressão coordenada.
- source_word: וּמַלְכוּתָא
  choice: o reino
  rationale: É a tradução mais natural no contexto de Daniel 7, abrangendo a esfera e o exercício do domínio real.
- source_word: הֶחֱסִנוּ
  choice: tomaram posse de
  rationale: Expressa a entrada efetiva na posse, além da simples ideia estática de possuir.
- source_word: קַדִּישִׁין
  choice: os santos
  rationale: Termo corrente e conciso para os que pertencem a Deus, mantido de modo coerente nas duas ocorrências e sem restringir indevidamente seu referente.
theological_decisions:
- issue: Sentido de וְדִינָא יְהִב לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: a sentença foi dada em favor dos santos do Altíssimo
  alternative: a sentença foi dada aos santos do Altíssimo
  rationale: O contexto favorece a vindicação judicial dos santos, mas a preposição aramaica também pode indicar destinatário; essa ambiguidade legítima é registrada em nota.
- issue: Referente de קַדִּישִׁין
  choice: os santos
  alternative: os seres santos
  rationale: A tradução não define o grupo além do que o próprio texto declara, evitando impor um sistema denominacional ou escatológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação aramaica foi levemente ajustada com ponto e vírgula e 'então' para produzir uma sequência natural sem alterar a relação temporal. O termo 'santos' foi preferido a 'seres santos' por naturalidade e por manter aberto o referente no contexto.
