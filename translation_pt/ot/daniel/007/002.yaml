  text: עָנֵ֤ה דָנִיֵּאל֙ וְ/אָמַ֔ר חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוִ֖/י עִם לֵֽילְיָ֑/א וַ/אֲר֗וּ אַרְבַּע֙ רוּחֵ֣י שְׁמַיָּ֔/א מְגִיחָ֖ן לְ/יַמָּ֥/א רַבָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/002.yaml
  text: Daniel answered and said[a], “I was seeing in my vision by night, and behold, the four winds of heaven were stirring up the great sea.”
translation:
  language: pt
  text: 'Daniel respondeu e disse: “Eu via, em minha visão durante a noite, e eis que os quatro ventos do céu[a] irrompiam sobre o grande mar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os quatro espíritos do céu”. A palavra aramaica pode significar tanto “ventos” como “espíritos”.
    reason: alternative_reading
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: respondeu e disse
  rationale: Preserva a fórmula narrativa aramaica e sua estrutura, embora não haja uma pergunta anterior expressa.
- source_word: חָזֵה הֲוֵית
  choice: eu estava vendo
  rationale: O particípio com o auxiliar indica uma ação passada em curso; a locução verbal conserva esse aspecto durativo.
- source_word: בְּחֶזְוִי
  choice: na minha visão
  rationale: Traduz diretamente o singular com sufixo de primeira pessoa e explicita o contexto visionário.
- source_word: עִם לֵילְיָא
  choice: durante a noite
  rationale: Expressa de modo natural em português o período noturno em que se dá a visão.
- source_word: וַאֲרוּ
  choice: e eis que
  rationale: Mantém o marcador de atenção e o tom vívido e solene da narrativa apocalíptica.
- source_word: אַרְבַּע רוּחֵי שְׁמַיָּא
  choice: os quatro ventos do céu
  rationale: No contexto do mar agitado, 'ventos' é o sentido imediato mais provável, enquanto a alternativa 'espíritos' permanece registrada em nota.
- source_word: מְגִיחָן
  choice: agitavam
  rationale: Comunica com clareza o movimento ativo dos ventos sobre o mar, sem excluir a ideia de impacto vigoroso presente no verbo.
- source_word: לְיַמָּא רַבָּא
  choice: o grande mar
  rationale: É uma tradução direta e idiomática, preservando a possível ressonância da expressão como designação de uma vasta massa de água.
theological_decisions:
- issue: רוּחֵי em uma visão apocalíptica
  choice: ventos
  alternative: espíritos
  rationale: A ação sobre o mar favorece 'ventos' no texto principal, mas o substantivo aramaico também pode significar 'espíritos'; a nota preserva essa ambiguidade relevante sem impor uma resolução doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção aspectual 'estava vendo' e a fórmula 'respondeu e disse' preservam traços formais do aramaico; 'e eis que' mantém o tom visionário.
