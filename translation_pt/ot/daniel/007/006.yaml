base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/006.yaml
  text: After this I kept looking[a], and behold, another, like a leopard; it had four wings of a bird on its back, and the beast had four heads, and dominion was given to it.
translation:
  language: pt
  text: Depois disso, continuei olhando, e eis outra fera, semelhante a um leopardo. Ela tinha quatro asas de ave sobre o dorso[a] e quatro cabeças, e foi-lhe dado domínio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sobre os lados»; a expressão aramaica pode designar o dorso ou, de modo mais geral, a parte superior do corpo da criatura.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: Depois disso
  rationale: Expressão temporal natural em português que mantém a progressão da sequência visionária.
- source_word: חָזֵה הֲוֵית
  choice: continuei olhando
  rationale: O particípio com o auxiliar comunica ação contínua no passado; a formulação preserva essa força durativa.
- source_word: וַאֲרוּ
  choice: e eis
  rationale: Mantém a vivacidade e a função dêitica da interjeição aramaica em registro bíblico digno e compreensível.
- source_word: אָחֳרִי
  choice: outra fera
  rationale: O substantivo é recuperado do contexto imediato; explicitá-lo em português evita uma construção truncada sem alterar o referente.
- source_word: כִּנְמַר
  choice: semelhante a um leopardo
  rationale: Reproduz claramente a comparação marcada pelo prefixo aramaico e soa natural em português.
- source_word: גַּפִּין אַרְבַּע דִּי עוֹף
  choice: quatro asas de ave
  rationale: Tradução concisa e transparente da expressão nominal e de sua relação genitiva.
- source_word: עַל גביּה
  choice: sobre as costas
  rationale: Expressa o sentido mais provável de localização no dorso, preservando em nota a amplitude lexical possível.
- source_word: וְאַרְבְּעָה רֵאשִׁין לְחֵיוְתָא
  choice: e quatro cabeças
  rationale: A coordenação com o verbo 'tinha' produz português fluente e preserva a descrição da fera.
- source_word: שָׁלְטָן
  choice: domínio
  rationale: Conserva o sentido de poder governante e o registro elevado próprio do contexto apocalíptico-político de Daniel.
- source_word: יְהִיב לַהּ
  choice: foi-lhe dado
  rationale: Mantém a construção passiva e não identifica um agente que o versículo deixa implícito.
theological_decisions:
- issue: Agente implícito da concessão do domínio
  choice: foi-lhe dado domínio
  alternative: recebeu de Deus o domínio
  rationale: O aramaico afirma que o domínio foi dado à fera, mas não nomeia o doador neste versículo; a tradução preserva essa reserva teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom visionário permanece digno sem recorrer a linguagem excessivamente arcaica; «e eis» conserva a vivacidade da cena, enquanto «foi-lhe dado domínio» mantém a passiva e o registro elevado do original.
