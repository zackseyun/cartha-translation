base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/028.yaml
  text: This is the end of the matter[a]. As for me, Daniel, my thoughts greatly terrified me, and my appearance changed because of it[b]; but I kept the matter in my heart.
translation:
  language: pt
  text: Aqui termina a questão[a]. Quanto a mim, Daniel, meus pensamentos me aterrorizaram muito, e minha aparência mudou[b]; mas guardei a questão em meu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a conclusão da questão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meu semblante mudou” ou “meu brilho mudou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד כָּה
  choice: Até aqui
  rationale: Preserva o marcador aramaico de limite ou encerramento de modo natural em português.
- source_word: סוֹפָא דִי מִלְּתָא
  choice: o fim da questão
  rationale: Mantém o sentido direto de 'fim' e traduz מִלְּתָא como 'questão', adequado ao conteúdo da visão relatada.
- source_word: אֲנָה דָנִיֵּאל
  choice: Quanto a mim, Daniel
  rationale: Reproduz a ênfase do pronome independente seguido do nome próprio.
- source_word: שַׂגִּיא רַעְיוֹנַי יְבַהֲלֻנַּנִי
  choice: meus pensamentos me aterrorizaram profundamente
  rationale: Conserva tanto a intensidade de שַׂגִּיא quanto a forte perturbação expressa pelo verbo.
- source_word: וְזִיוַי
  choice: minha aparência
  rationale: זִיו pode indicar brilho, semblante ou aparência; 'aparência' mantém a referência exterior sem restringi-la indevidamente ao rosto.
- source_word: יִשְׁתַּנּוֹן עֲלַי
  choice: mudou
  rationale: Traduz naturalmente a construção idiomática aramaica, cujo sentido é que a aparência de Daniel sofreu alteração.
- source_word: וּמִלְּתָא
  choice: mas guardei a questão
  rationale: O valor adversativo explicita em português o contraste entre a perturbação exterior e a retenção interior, sem alterar o conteúdo.
- source_word: בְּלִבִּי נִטְרֵת
  choice: guardei a questão no coração
  rationale: Mantém a linguagem antropológica bíblica de 'coração' e o sentido de guardar ou preservar.
theological_decisions:
- issue: Linguagem antropológica de בְּלִבִּי
  choice: no coração
  alternative: na mente; dentro de mim
  rationale: Preserva a imagem bíblica do coração como centro da interioridade, sem reduzi-la apenas à cognição.
- issue: Sentido de זִיוַי
  choice: minha aparência
  alternative: meu semblante; meu brilho
  rationale: A forma admite mais de um matiz. O texto principal usa a opção contextual mais ampla, enquanto a nota conserva as alternativas genuínas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a concisão conclusiva do aramaico e suas ambiguidades lexicais relevantes.
