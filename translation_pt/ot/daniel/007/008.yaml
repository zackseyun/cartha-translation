  naturalness: A redação é clara e de registro apropriado. «Olhos como olhos de homem», embora compreensível e próximo da forma-fonte, soa menos natural em português do que «olhos como os de um homem», que preserva a comparação explícita sem repetição pesada.
  terminology: «Chifres», «arrancados», «grandes coisas» e «eis que» são escolhas adequadas. A nota sobre a alternativa contextual para «grandes coisas» deve formular a opção como fala, não apenas como «coisas», para refletir a construção «uma boca falando».
