source:
  edition: WLC
  text: מִשְׂתַּכַּ֨ל הֲוֵ֜ית בְּ/קַרְנַיָּ֗/א וַ֠/אֲלוּ קֶ֣רֶן אָחֳרִ֤י זְעֵירָה֙ סִלְקָ֣ת ביני/הון וּ/תְלָ֗ת מִן קַרְנַיָּ/א֙ קַדְמָ֣יָתָ֔/א אתעקרו מִן קדמי/ה וַ/אֲל֨וּ עַיְנִ֜ין כְּ/עַיְנֵ֤י אֲנָשָׁ/א֙ בְּ/קַרְנָ/א דָ֔א וּ/פֻ֖ם מְמַלִּ֥ל רַבְרְבָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/008.yaml
  text: I was considering the horns[a], and behold, another horn, a little one, came up among them, and three of the first horns were uprooted before it. And behold, in this horn were eyes like the eyes of a man[b], and a mouth speaking great things.
translation:
  language: pt
  text: Eu estava observando os chifres e eis que outro chifre, um pequeno, surgiu entre eles. Três dos primeiros chifres foram arrancados diante dele. E eis que neste chifre havia olhos como os de um homem[a] e uma boca que falava grandes coisas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «olhos humanos».
    reason: lexical_alternative
  - marker: b
    text: Ou «palavras arrogantes» ou «proferindo grandes arrogâncias».
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׂתַּכַּל הֲוֵית
  choice: Eu estava observando
  rationale: O particípio com o auxiliar expressa uma ação contínua no passado. “Estava observando” comunica atenção sustentada à visão sem acrescentar uma ideia excessivamente reflexiva.
- source_word: בְּקַרְנַיָּא
  choice: os chifres
  rationale: O plural determinado aramaico e o contexto imediato pedem o artigo definido.
- source_word: וַאֲלוּ
  choice: quando, de repente / E eis que
  rationale: A partícula introduz uma transição vívida na visão. A primeira ocorrência foi vertida de modo natural no fluxo narrativo; a segunda conserva “e eis que”, adequado ao registro apocalíptico.
- source_word: קֶרֶן אָחֳרִי זְעֵירָה
  choice: outro chifre, um pequeno
  rationale: 'Preserva a sequência e a aposição do aramaico: trata-se de outro chifre, caracterizado como pequeno, sem transformar a expressão em título técnico.'
- source_word: סִלְקָת בֵּינֵיהוֹן
  choice: surgiu entre eles
  rationale: “Surgiu” expressa com clareza a imagem do chifre que sobe ou aparece no meio dos demais; “entre eles” é idiomático com antecedente plural.
- source_word: וּתְלָת מִן קַרְנַיָּא קַדְמָיָתָא
  choice: Três dos primeiros chifres
  rationale: קַדְמָיָתָא identifica os chifres anteriores ou primeiros na sequência da visão.
- source_word: אתעקרו מִן קֳדָמֵיהּ
  choice: foram arrancados diante dele
  rationale: “Arrancados” preserva a força da remoção pela raiz, enquanto “diante dele” mantém aberta a nuance espacial ou de presença da expressão aramaica.
- source_word: עַיְנִין כְּעַיְנֵי אֲנָשָׁא
  choice: olhos como olhos de homem
  rationale: Reproduz a comparação explícita e o singular אֲנָשָׁא. A formulação mais idiomática “olhos humanos” é registrada em nota.
- source_word: בְּקַרְנָא דָא
  choice: nesse chifre havia
  rationale: Preserva a imagem locativa do aramaico, em vez de reduzi-la à simples posse.
- source_word: וּפֻם מְמַלִּל רַבְרְבָן
  choice: uma boca que falava grandes coisas
  rationale: Mantém o sentido formal de רַבְרְבָן, deixando que o contexto sugira arrogância sem impô-la no texto principal.
theological_decisions:
- issue: Se רַבְרְבָן deve ser vertido explicitamente como discurso arrogante
  choice: grandes coisas
  alternative: coisas arrogantes; grandes arrogâncias
  rationale: A expressão significa formalmente “grandes coisas”, embora o contexto possa indicar ostentação ou arrogância. A tradução principal preserva essa tensão, e a nota apresenta a leitura contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe acompanha o movimento da visão sem rigidez excessiva. “Chifre” mantém a imagem concreta recorrente do capítulo; “e eis que” conserva o tom visionário elevado.
