  to: Eu estava observando os chifres e eis que outro chifre, um pequeno, surgiu entre eles. Três dos primeiros chifres foram arrancados diante dele. E eis que neste chifre havia olhos como os de um homem[a] e uma boca que falava grandes coisas[b].
  rationale: A revisão restaura nas duas ocorrências o marcador visionário aramaico «e eis que», melhora discretamente a fluência da comparação dos olhos sem generalizar «um homem» no texto principal e ajusta a nota interpretativa para conservar o caráter falado da expressão. O sentido e a ambiguidade de «grandes coisas» são preservados.
