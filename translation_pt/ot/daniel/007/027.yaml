  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מַלְכוּתָ֨/ה וְ/שָׁלְטָנָ֜/א וּ/רְבוּתָ֗/א דִּ֚י מַלְכְוָת֙ תְּח֣וֹת כָּל שְׁמַיָּ֔/א יְהִיבַ֕ת לְ/עַ֖ם קַדִּישֵׁ֣י עֶלְיוֹנִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/כֹל֙ שָׁלְטָ֣נַיָּ֔/א לֵ֥/הּ יִפְלְח֖וּן וְ/יִֽשְׁתַּמְּעֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/027.yaml
  text: And the kingdom and the dominion and the greatness of the kingdoms under all heaven shall be given to the people of the saints of the Most High[a]. His kingdom shall be an everlasting kingdom[c][b], and all dominions shall serve and obey him.
translation:
  language: pt
  text: O reino, o domínio e a grandeza dos reinos sob todo o céu serão dados ao povo dos santos do Altíssimo[a]. O reino dele será um reino eterno[b], e todos os domínios o servirão[c] e lhe obedecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao povo dos seres santos do Altíssimo” ou “ao povo santo do Altíssimo”.'
    reason: lexical_alternative
  - marker: b
    text: 'O aramaico emprega pronomes no singular: “O reino dele... todos os domínios o servirão e lhe obedecerão”. Isso pode apontar para o governante representativo visto antes na visão, embora o reino seja dado aos santos.'
    reason: alternative_reading
  - marker: c
    text: Em Daniel, “servir” também pode ter o sentido de “adorar” quando o serviço é prestado à divindade.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכוּתָה
  choice: o reino
  rationale: מַלְכוּת pode indicar tanto o reino quanto o exercício da realeza. “Reino” preserva aqui os sentidos concreto e abstrato e se integra naturalmente à tríade inicial.
- source_word: שָׁלְטָנָא
  choice: o domínio
  rationale: O termo designa poder governante ou autoridade soberana. “Domínio” mantém a nuance política e a ligação lexical com o plural no fim do versículo.
- source_word: רְבוּתָא
  choice: a grandeza
  rationale: O substantivo exprime grandeza ou magnitude. A tradução direta conserva o registro elevado sem restringir o sentido a esplendor ou majestade real.
- source_word: דִּי מַלְכְוָת תְּחוֹת כָּל שְׁמַיָּא
  choice: dos reinos sob todo o céu
  rationale: A expressão delimita o alcance universal do governo. “Sob todo o céu” é idiomático em português e mantém a imagem do aramaico.
- source_word: יְהִיבַת
  choice: serão dados
  rationale: Embora a forma seja perfeita, no contexto apocalíptico descreve o resultado futuro da visão. O plural é a concordância natural em português com os três elementos coordenados.
- source_word: לְעַם
  choice: ao povo
  rationale: עַם é coletivo. “Povo” comunica uma comunidade sem sugerir necessariamente um Estado nacional moderno.
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  choice: dos santos do Altíssimo
  rationale: קַדִּישִׁין pode significar “santos” ou “seres santos”. A escolha preserva o termo central do capítulo e, com “povo”, mantém o caráter coletivo sem resolver a ambiguidade lexical.
- source_word: מַלְכוּתֵהּ
  choice: O reino dele
  rationale: O sufixo aramaico está no masculino singular. “Dele” torna esse singular explícito e evita transformá-lo em plural ou em construção impessoal.
- source_word: מַלְכוּת עָלַם
  choice: um reino eterno
  rationale: A expressão indica duração perpétua. “Eterno” é corrente, solene e fiel ao alcance temporal do original.
- source_word: שָׁלְטָנַיָּא
  choice: todos os domínios
  rationale: O plural pode indicar esferas de governo ou poderes governantes. “Domínios” conserva essa abertura e retoma o vocábulo usado no início.
- source_word: יִפְלְחוּן
  choice: o servirão
  rationale: O verbo denota serviço e, em Daniel, pode adquirir o sentido de culto quando dirigido à divindade. “Servirão” preserva a amplitude sem impor de antemão “adorarão”.
- source_word: וְיִשְׁתַּמְּעוּן
  choice: e lhe obedecerão
  rationale: O verbo parte da ideia de ouvir, mas em contexto de governo exprime submissão obediente. “Obedecerão” forma o paralelo natural com “servirão”.
theological_decisions:
- issue: Referente dos pronomes singulares na segunda frase
  choice: 'Manter o singular: “O reino dele... o servirão e lhe obedecerão”.'
  alternative: Empregar o plural (“o reino deles... os servirão”) ou tornar a frase impessoal.
  rationale: O aramaico usa formas pronominais masculinas singulares, embora o reino seja dado ao povo dos santos. Preservar o singular mantém a tensão do capítulo entre o governante representativo e os santos, sem resolvê-la por interpretação.
- issue: Sentido de “santos do Altíssimo”
  choice: “o povo dos santos do Altíssimo”
  alternative: “o povo dos seres santos do Altíssimo” ou “o povo santo do Altíssimo”
  rationale: A expressão pode ser entendida como referência coletiva ao povo santo de Deus, mas קַדִּישֵׁי também permite “santos/seres santos”. A formulação principal conserva a estrutura e a ambiguidade do aramaico.
- issue: Amplitude religiosa de יִפְלְחוּן
  choice: “servirão”, com nota indicando a possibilidade de “adorarão”
  alternative: Traduzir diretamente por “adorarão”.
  rationale: Em Daniel, o verbo pode descrever serviço religioso prestado à divindade, mas seu valor lexical é mais amplo. A tradução principal evita decidir uma questão que o contexto deixa carregada de implicações.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação mantém a tríade solene do início, evita arcaísmos e conserva tanto a ambiguidade de “santos” quanto os pronomes singulares do aramaico.
