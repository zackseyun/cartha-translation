  text: וְ/לֵ֨/הּ יְהִ֤יב שָׁלְטָן֙ וִ/יקָ֣ר וּ/מַלְכ֔וּ וְ/כֹ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ֛/א וְ/לִשָּׁנַיָּ֖/א לֵ֣/הּ יִפְלְח֑וּן שָׁלְטָנֵ֞/הּ שָׁלְטָ֤ן עָלַם֙ דִּֽי לָ֣א יֶעְדֵּ֔ה וּ/מַלְכוּתֵ֖/הּ דִּי לָ֥א תִתְחַבַּֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/014.yaml
  text: And to him was given dominion and glory and a kingdom[a], that all peoples, nations, and languages should serve him. His dominion is an everlasting dominion, which will not pass away, and his kingdom is one that will not be destroyed.
translation:
  language: pt
  text: E foi-lhe dado domínio, glória e reino, para que todos os povos, nações e línguas o servissem.[a] Seu domínio é um domínio eterno, que não passará, e seu reino não será destruído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o adorassem” ou “lhe prestassem homenagem”. O verbo aramaico pode indicar serviço, inclusive serviço religioso; portanto, seu sentido aqui talvez vá além da submissão política.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִיב
  choice: foi-lhe dado
  rationale: Preserva o sentido passivo do aramaico e mantém implícito o agente que concede.
- source_word: שָׁלְטָן
  choice: domínio
  rationale: Expressa poder régio e permite conservar a repetição enfática na segunda metade do versículo.
- source_word: וִיקָר
  choice: glória
  rationale: Comunica honra e esplendor em registro régio-teológico elevado e natural em português.
- source_word: מַלְכוּ
  choice: reino
  rationale: Neste contexto, abrange tanto a realidade régia quanto o âmbito do governo concedido; o artigo indefinido é desnecessário na enumeração portuguesa.
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: povos, nações e línguas
  rationale: Conserva os três termos e o alcance universal entre grupos humanos, políticos e linguísticos.
- source_word: יִפְלְחוּן
  choice: o servissem
  rationale: Mantém o valor amplo de prestar serviço, inclusive sua possível dimensão religiosa, sem decidir entre submissão política, homenagem e culto. O subjuntivo após 'para que' exprime naturalmente a relação de finalidade ou resultado.
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: Seu domínio é um domínio eterno
  rationale: Conserva a repetição enfática do substantivo e traduz עָלַם de maneira clara e tradicional.
- source_word: יֶעְדֵּה
  choice: não passará
  rationale: Expressa de modo natural a ideia de não desaparecer nem ser removido.
- source_word: תִתְחַבַּל
  choice: não será destruído
  rationale: No contexto de reinos, o verbo indica ruína ou destruição, não corrupção moral.
theological_decisions:
- issue: Sentido de יִפְלְחוּן em relação à figura semelhante a um filho de homem
  choice: o servissem
  alternative: o adorassem; lhe prestassem homenagem
  rationale: O verbo pode incluir serviço religioso em Daniel, mas 'adorassem' definiria mais estritamente uma questão que o aramaico deixa aberta. 'Servissem' preserva a tensão entre lealdade régia e serviço cultual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem inicial 'E foi-lhe dado' conserva o encadeamento narrativo e o foco no destinatário sem tornar explícito o doador. A colocação do marcador após 'servissem' liga a nota diretamente ao termo ambíguo.
