source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת חֲדָ֗ה לְ/בֵלְאשַׁצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל דָּנִיֵּאל֙ חֵ֣לֶם חֲזָ֔ה וְ/חֶזְוֵ֥י רֵאשֵׁ֖/הּ עַֽל מִשְׁכְּבֵ֑/הּ בֵּ/אדַ֨יִן֙ חֶלְמָ֣/א כְתַ֔ב רֵ֥אשׁ מִלִּ֖ין אֲמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/001.yaml
  text: In the first year of Belshazzar king of Babylon[a], Daniel saw a dream and visions in his head while on his bed. Then he wrote down the dream—the summary of the words he told.
translation:
  language: pt
  text: No primeiro ano de Belsazar, rei da Babilônia, Daniel teve um sonho e visões em sua mente enquanto estava em sua cama. Então, escreveu o sonho e relatou o essencial.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “escreveu o sonho e disse a cabeça das palavras”. A expressão aramaica provavelmente significa que ele registrou ou relatou os pontos principais, isto é, o resumo.'
    reason: Alternativa lexical e esclarecimento de um idioma aramaico.
lexical_decisions:
- source_word: בִּשְׁנַת חֲדָה
  choice: No primeiro ano
  rationale: A fórmula aramaica de datação emprega o numeral com sentido ordinal; esta é a forma natural e precisa em português.
- source_word: לְבֵלְאשַׁצַּר מֶלֶךְ בָּבֶל
  choice: de Belsazar, rei da Babilônia
  rationale: A preposição marca o reinado pelo qual o ano é contado, e a cadeia nominal identifica o cargo real de Belsazar.
- source_word: חֵלֶם חֲזָה
  choice: teve um sonho
  rationale: Embora a expressão diga literalmente “viu um sonho”, “teve um sonho” é o modo corrente de expressar a experiência onírica em português sem diminuir seu caráter visionário, explicitado logo em seguida.
- source_word: וְחֶזְוֵי רֵאשֵׁהּ
  choice: e visões em sua mente
  rationale: Literalmente, “visões de sua cabeça”; “em sua mente” comunica naturalmente que eram visões interiores, evitando uma formulação anatômica e pouco idiomática.
- source_word: עַל מִשְׁכְּבֵהּ
  choice: enquanto estava em sua cama
  rationale: Expressa de modo natural a localização e a circunstância da experiência, sem acrescentar que Daniel dormia.
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Conector narrativo aramaico comum que indica a sequência dos acontecimentos.
- source_word: חֶלְמָא כְתַב
  choice: escreveu o sonho
  rationale: Mantém o sentido direto do verbo “escrever”; no contexto, significa registrar por escrito o sonho.
- source_word: רֵאשׁ מִלִּין אֲמַר
  choice: e relatou o essencial
  rationale: A expressão idiomática, literalmente “disse a cabeça das palavras”, aponta para os pontos principais ou o resumo do relato. A formulação portuguesa conserva esse sentido sem impor uma reconstrução mais específica.
