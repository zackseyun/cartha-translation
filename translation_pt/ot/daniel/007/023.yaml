base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/023.yaml
  text: 'Thus he said: ‘The fourth beast will be a fourth kingdom on the earth[a], which will be different from all the kingdoms[b]; and it will devour the whole earth and trample it down and crush it.’'
translation:
  language: pt
  text: 'Ele disse: “A quarta fera será um quarto reino na terra, diferente de todos os reinos; devorará toda a terra, a pisoteará e a esmagará.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן אֲמַר
  choice: Assim ele disse
  rationale: Introduz de modo natural e digno a explicação que segue, mantendo o verbo de elocução e o sujeito implícito recuperado do contexto.
- source_word: חֵיוְתָא רְבִיעָיְתָא
  choice: o quarto animal
  rationale: No português bíblico, “animal” expressa com clareza a criatura simbólica da visão sem exigir a conotação adicional que “fera” pode introduzir.
- source_word: מַלְכוּ רביעיא
  choice: um quarto reino
  rationale: O próprio texto interpreta o animal como um reino; o artigo indefinido corresponde ao uso predicativo do numeral ordinal.
- source_word: בְאַרְעָא
  choice: sobre a terra
  rationale: O contexto imperial e abrangente de Daniel 7 favorece “terra” em sentido amplo, e “sobre” comunica domínio ou presença no cenário terrestre.
- source_word: דִּי תִשְׁנֵא מִן כָּל מַלְכְוָתָא
  choice: diferente de todos os outros reinos
  rationale: Expressa a comparação de modo idiomático em português; “outros” torna explícito o contraste já implícito sem alterar o referente.
- source_word: וְתֵאכֻל כָּל אַרְעָא
  choice: devorará toda a terra
  rationale: Preserva a metáfora violenta e animalesca do verbo aramaico e a extensão total indicada por כָּל.
- source_word: וּתְדוּשִׁנַּהּ
  choice: a pisoteará
  rationale: Reproduz a ação de calcar sob os pés com linguagem corrente e forte.
- source_word: וְתַדְּקִנַּהּ
  choice: a esmagará
  rationale: Mantém a intensificação destrutiva final; o verbo também pode comunicar a ideia de despedaçar.
theological_decisions:
- issue: Identificação do quarto animal
  choice: “O quarto animal será um quarto reino”
  alternative: Manter o símbolo sem explicitação política
  rationale: A identificação com um reino não é uma interpretação denominacional posterior, mas está declarada no próprio texto aramaico.
- issue: Alcance de אַרְעָא
  choice: “terra” em sentido abrangente
  alternative: “país” ou “território” em sentido local
  rationale: O contexto da visão e a afirmação “toda a terra” favorecem alcance mundial, embora a linguagem apocalíptica não deva ser convertida em uma especificação geográfica além do texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção mantém a sucessão enfática dos três atos de destruição e evita identificar historicamente o quarto reino, preservando a tensão interpretativa do texto.
