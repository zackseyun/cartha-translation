  naturalness: «Assim ele disse» é pouco idiomático no português moderno. «Ele disse» é natural e mantém o sujeito contextual. A redação revista também usa «na terra», formulação mais direta para o cenário terrestre indicado pelo aramaico.
  terminology: '«Fera» é o termo mais adequado neste contexto visionário e apocalíptico. «Reino», «terra», «devorará», «pisoteará» e «esmagará» são precisos e claros. Não é necessária nota: não há ambiguidade textual relevante que a exija nesta tradução.'
