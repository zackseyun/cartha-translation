base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/019.yaml
  text: Then I wanted to know for certain about the fourth beast[a], which was different from all of them, exceedingly terrifying, with teeth of iron and claws of bronze, which devoured, crushed[b], and trampled what was left with its feet.
translation:
  language: pt
  text: Então quis ter certeza a respeito da quarta fera[a], que era diferente de todas elas e extremamente aterrorizante. Ela tinha dentes de ferro e garras de bronze[b]; devorava, esmagava e pisoteava com os pés o que restava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quis averiguar com certeza a respeito da quarta fera”. A expressão aramaica indica o desejo de obter conhecimento seguro.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “unhas de bronze”. O termo aramaico pode designar garras ou unhas; “garras” corresponde melhor à imagem de uma fera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marcador temporal que dá sequência à visão e introduz a investigação de Daniel.
- source_word: צְבִית לְיַצָּבָא
  choice: quis ter certeza
  rationale: Expressa tanto o desejo de Daniel quanto a ideia de alcançar conhecimento seguro, sem substituir a certeza pela noção mais abstrata de verdade.
- source_word: עַל חֵיוְתָא רְבִיעָיְתָא
  choice: a respeito da quarta fera
  rationale: Reproduz naturalmente o objeto da investigação e mantém o substantivo usado na descrição simbólica.
- source_word: דִּי הֲוָת שָׁנְיָה מִן כָּלְהוֹן
  choice: que era diferente de todas elas
  rationale: Preserva a comparação explícita entre a quarta fera e todas as demais.
- source_word: דְּחִילָה יַתִּירָה
  choice: extremamente aterrorizante
  rationale: Mantém a forte intensificação do aramaico em linguagem portuguesa atual.
- source_word: שִׁנַּיּהּ דִּי פַרְזֶל
  choice: dentes de ferro
  rationale: Tradução direta da característica física da fera.
- source_word: וְטִפְרַיּהּ דִּי נְחָשׁ
  choice: garras de bronze
  rationale: No contexto de uma fera, 'garras' é mais natural que 'unhas'; 'bronze' é a designação convencional do metal neste contexto.
- source_word: אָכְלָה מַדֲּקָה
  choice: devorava, esmagava
  rationale: Conserva a sequência vívida de ações violentas e o aspecto descritivo da cena.
- source_word: וּשְׁאָרָא בְּרַגְלַיּהּ רָפְסָה
  choice: pisoteava com os pés o que restava
  rationale: Mantém tanto o instrumento explicitamente mencionado quanto a referência ao remanescente.
