  text: חָזֵ֤ה הֲוֵית֙ בְּ/חֶזְוֵ֣י לֵֽילְיָ֔/א וַ/אֲרוּ֙ עִם עֲנָנֵ֣י שְׁמַיָּ֔/א כְּ/בַ֥ר אֱנָ֖שׁ אָתֵ֣ה הֲוָ֑ה וְ/עַד עַתִּ֤יק יֽוֹמַיָּ/א֙ מְטָ֔ה וּ/קְדָמ֖וֹ/הִי הַקְרְבֽוּ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/013.yaml
  text: I kept looking in the visions of the night[a], and behold, with the clouds of heaven one like a son of man was coming, and he came to the Ancient of Days[b], and they brought him near before him.
translation:
  language: pt
  text: Eu continuava olhando nas visões da noite, e eis que, com as nuvens do céu[a], vinha alguém semelhante a um filho de homem[b]. Ele chegou até o Ancião de Dias, e o fizeram aproximar-se diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “sobre as nuvens do céu”. A preposição aramaica usada aqui significa “com” e pode indicar acompanhamento, sem afirmar explicitamente que a figura se movia sobre as nuvens.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “alguém semelhante a um ser humano”. Em aramaico, a expressão é literalmente “como um filho de homem”; ela pode designar uma figura humana e, posteriormente, tornou-se um título messiânico importante na interpretação bíblica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Eu continuava olhando
  rationale: A construção com particípio e הוה expressa ação contínua no passado; esta formulação preserva o aspecto durativo com naturalidade em português.
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: nas visões da noite
  rationale: Mantém o plural “visões” e a relação genitiva com “noite”, em linguagem clara e formal.
- source_word: וַאֲרוּ
  choice: e eis que
  rationale: Preserva a função do marcador discursivo, que introduz de modo vívido uma nova cena da visão.
- source_word: עִם עֲנָנֵי שְׁמַיָּא
  choice: com as nuvens do céu
  rationale: Traduz diretamente a preposição עִם, “com”, sem substituí-la pela leitura tradicional mais interpretativa “sobre”.
- source_word: כְּבַר אֱנָשׁ
  choice: alguém semelhante a um filho de homem
  rationale: “Alguém semelhante a” conserva a comparação e torna a construção natural em português; “filho de homem” retém a expressão formal e sua relevância bíblica sem identificar a figura além do que o texto afirma.
- source_word: אָתֵה הֲוָה
  choice: vinha
  rationale: O imperfeito português comunica adequadamente a aproximação em andamento indicada pela construção participial aramaica.
- source_word: וְעַד עַתִּיק יוֹמַיָּא
  choice: até o Ancião de Dias
  rationale: “Até” expressa o movimento em direção à figura designada pelo título aramaico tradicionalmente vertido como “Ancião de Dias”.
- source_word: מְטָה
  choice: chegou
  rationale: Marca a chegada concluída depois da aproximação apresentada como ação em andamento.
- source_word: וּקְדָמוֹהִי
  choice: diante dele
  rationale: Expressa de forma concisa a apresentação na presença do Ancião de Dias.
- source_word: הַקְרְבוּהִי
  choice: o fizeram aproximar-se
  rationale: Preserva a forma causativa e o sujeito plural não especificado do aramaico, evitando convertê-la silenciosamente em passiva.
theological_decisions:
- issue: Tradução de כְּבַר אֱנָשׁ numa visão de importância messiânica
  choice: alguém semelhante a um filho de homem
  alternative: alguém semelhante a um ser humano
  rationale: A redação conserva tanto a comparação quanto a expressão tradicional “filho de homem”, teologicamente significativa, sem impor à tradução as identificações desenvolvidas em sua recepção posterior.
- issue: Tradução de עִם עֲנָנֵי שְׁמַיָּא
  choice: com as nuvens do céu
  alternative: sobre as nuvens do céu
  rationale: A preposição aramaica significa literalmente “com”. A alternativa tradicional é registrada em nota por sua importância interpretativa, mas não substitui o sentido lexical no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas acompanha sua primeira ocorrência no versículo. A formulação preserva o tom visionário, o aspecto verbal e as ambiguidades lexical e teológica do aramaico.
