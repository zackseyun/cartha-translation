  text: וְ/עַל קַרְנַיָּ֤/א עֲשַׂר֙ דִּ֣י בְ/רֵאשַׁ֔/הּ וְ/אָחֳרִי֙ דִּ֣י סִלְקַ֔ת ו/נפלו מִן קדמי/ה תְּלָ֑ת וְ/קַרְנָ֨/א דִכֵּ֜ן וְ/עַיְנִ֣ין לַ֗/הּ וְ/פֻם֙ מְמַלִּ֣ל רַבְרְבָ֔ן וְ/חֶזְוַ֖/הּ רַ֥ב מִן חַבְרָתַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/020.yaml
  text: and about the ten horns that were on its head[a], and the other horn that came up, before which three fell—the horn that had eyes and a mouth speaking great things, and whose appearance was greater than that of its companions.
translation:
  language: pt
  text: e a respeito dos dez chifres que estavam na sua cabeça, e do outro chifre que surgiu, diante do qual caíram três — o chifre que tinha olhos e uma boca que falava grandes coisas[a], e cuja aparência era maior que a de seus companheiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma boca que falava coisas arrogantes” ou “uma boca que proferia grandes arrogâncias”.
    reason: Registra a possível força jactanciosa de רַבְרְבָן sem incorporá-la obrigatoriamente ao texto principal.
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: os dez chifres
  rationale: Preserva diretamente a imagem simbólica dos dez chifres, sem interpretá-los no corpo do versículo.
- source_word: בְרֵאשַׁהּ
  choice: em sua cabeça
  rationale: Expressa de modo natural em português a localização dos chifres na cabeça da besta, à qual o sufixo feminino aramaico se refere.
- source_word: אָחֳרִי
  choice: o outro chifre
  rationale: Distingue esse chifre dos dez já mencionados sem impor como sentido principal a possível nuance temporal de 'posterior'.
- source_word: סִלְקַת
  choice: surgiu
  rationale: Mantém a imagem visual do aparecimento ou ascensão do chifre e soa natural no contexto de uma visão.
- source_word: וּנְפַלוּ מִן קֳדָמַהּ תְּלָת
  choice: diante do qual caíram três
  rationale: 'Conserva a relação espacial e simbólica do aramaico: três chifres caíram diante desse outro chifre.'
- source_word: וְקַרְנָא דִכֵּן
  choice: o chifre que
  rationale: Retoma o chifre específico em foco, reproduzindo com fluidez a construção resumptiva aramaica.
- source_word: וְעַיְנִין לַהּ
  choice: tinha olhos
  rationale: Preserva o detalhe vívido e simbólico em linguagem portuguesa direta.
- source_word: וְפֻם מְמַלִּל רַבְרְבָן
  choice: uma boca que falava grandes coisas
  rationale: Segue de perto o sentido lexical, sem explicitar no texto principal a interpretação de que se trata de fala arrogante; essa possibilidade fica registrada em nota.
- source_word: וְחֶזְוַהּ
  choice: cuja aparência
  rationale: Traduz o aspecto visível do chifre e liga naturalmente a oração descritiva ao seu referente.
- source_word: רַב מִן חַבְרָתַהּ
  choice: era maior que a de seus companheiros
  rationale: Mantém a comparação ampla de grandeza ou proeminência sem reduzi-la necessariamente ao tamanho físico; 'companheiros' conserva a relação com os demais chifres.
theological_decisions:
- issue: Se רַבְרְבָן deve ser interpretado como fala arrogante ou traduzido mais literalmente
  choice: grandes coisas
  alternative: coisas arrogantes; grandes arrogâncias
  rationale: A expressão aramaica diz literalmente 'grandes coisas'. Embora o contexto favoreça a ideia de arrogância, o texto principal preserva a formulação menos resolvida da fonte, e a nota apresenta a leitura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém o caráter de continuação sintática do contexto anterior. O marcador [a] foi colocado junto à expressão à qual a nota realmente se refere.
