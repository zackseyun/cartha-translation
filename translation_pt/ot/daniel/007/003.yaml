source:
  edition: WLC
  text: וְ/אַרְבַּ֤ע חֵיוָן֙ רַבְרְבָ֔ן סָלְקָ֖ן מִן יַמָּ֑/א שָׁנְיָ֖ן דָּ֥א מִן דָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/003.yaml
  text: And four great beasts were coming up from the sea[a], different from one another.
translation:
  language: pt
  text: E quatro grandes animais subiam do mar[a], diferentes uns dos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de dentro do mar”.'
    reason: Alternativa lexical que explicita o movimento para fora do mar, possível para a preposição de origem.
lexical_decisions:
- source_word: וְ/אַרְבַּע
  choice: E quatro
  rationale: A conjunção seguida do numeral introduz de modo simples o elemento seguinte da visão; “E quatro” preserva essa ligação sem acrescentar uma nuance temporal.
- source_word: חֵיוָן
  choice: animais
  rationale: O termo aramaico designa criaturas animais. Em português, “animais” mantém o sentido zoológico e permite que o caráter monstruoso e simbólico surja do contexto, sem impor uma conotação adicional.
- source_word: רַבְרְבָן
  choice: grandes
  rationale: O adjetivo indica grandeza ou tamanho; “grandes” é natural, digno e preserva a amplitude sem especificar apenas tamanho físico.
- source_word: סָלְקָן
  choice: subiam
  rationale: A forma verbal descreve a ação em andamento no cenário visionário. O imperfeito “subiam” expressa naturalmente esse movimento ascendente contínuo.
- source_word: מִן יַמָּא
  choice: do mar
  rationale: A preposição assinala origem ou procedência. “Do mar” é conciso e natural; “de dentro do mar” explicita uma possibilidade contextual e fica registrada em nota.
- source_word: שָׁנְיָן
  choice: diferentes
  rationale: Neste contexto comparativo, o termo indica que as criaturas não eram iguais entre si.
- source_word: דָּא מִן דָּא
  choice: uns dos outros
  rationale: A expressão idiomática aramaica estabelece diferenciação recíproca entre os quatro animais; “uns dos outros” é a formulação portuguesa natural.
theological_decisions:
- issue: Força simbólica de חֵיוָן no contexto apocalíptico
  choice: Traduzir como “animais”
  alternative: “feras” ou “seres vivos”
  rationale: “Animais” traduz diretamente o termo aramaico e evita tanto neutralizá-lo como “seres vivos” quanto antecipar, com “feras”, uma interpretação mais carregada. A natureza ameaçadora e a função simbólica dessas criaturas são preservadas pelo contexto e pela explicação posterior do capítulo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção é concisa e solene, preservando o andamento da visão e a ambiguidade razoável da preposição de origem.
