  text: אִלֵּין֙ חֵיוָתָ֣/א רַבְרְבָתָ֔/א דִּ֥י אִנִּ֖ין אַרְבַּ֑ע אַרְבְּעָ֥ה מַלְכִ֖ין יְקוּמ֥וּן מִן אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/017.yaml
  text: These great beasts[a], which are four, are four kings who will arise from the earth.
translation:
  language: pt
  text: Esses grandes animais, que são quatro, são quatro reis que se levantarão da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do território”. O aramaico pode indicar tanto a terra em sentido amplo quanto uma terra ou território específico; aqui, “terra” é preferível por causa do amplo cenário apocalíptico do capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִלֵּין
  choice: Esses
  rationale: Demonstrativo plural aramaico que retoma os animais imediatamente apresentados na visão; “esses” é natural nesse contexto.
- source_word: חֵיוָתָא
  choice: animais
  rationale: O termo pode designar animais ou feras. “Animais” é claro e digno em português, enquanto o contexto visionário preserva seu caráter ameaçador.
- source_word: רַבְרְבָתָא
  choice: grandes
  rationale: Expressa grandeza ou tamanho; “grandes” conserva a amplitude sem decidir se a ênfase recai apenas no porte ou também na importância.
- source_word: דִּי אִנִּין אַרְבַּע
  choice: que são quatro
  rationale: Reproduz de modo natural a construção relativa que identifica o número dos animais.
- source_word: אַרְבְּעָה מַלְכִין
  choice: quatro reis
  rationale: O aramaico diz explicitamente “reis”, não “reinos”; a tradução mantém a forma lexical e não antecipa uma interpretação do símbolo.
- source_word: יְקוּמוּן
  choice: se levantarão
  rationale: O verbo significa levantar-se ou surgir. “Se levantarão” conserva a imagem verbal do original e funciona naturalmente para o aparecimento de governantes.
- source_word: מִן אַרְעָא
  choice: da terra
  rationale: אַרְעָא pode significar “terra” em sentido amplo ou “país/território”. O alcance apocalíptico do capítulo favorece “terra”, sem eliminar a alternativa lexical registrada em nota.
theological_decisions:
- issue: Referente dos “quatro reis” no simbolismo apocalíptico
  choice: Manter “quatro reis” no texto principal.
  alternative: Traduzir interpretativamente como “quatro reinos”.
  rationale: O substantivo aramaico significa “reis”. Preservá-lo evita harmonizar silenciosamente o versículo com uma interpretação mais ampla e mantém a tensão própria do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura repetitiva do original (“são quatro... são quatro reis”) foi preservada por sua função explicativa. O marcador de nota aparece após a expressão a que se refere.
