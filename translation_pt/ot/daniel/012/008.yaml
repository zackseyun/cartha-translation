  text: וַ/אֲנִ֥י שָׁמַ֖עְתִּי וְ/לֹ֣א אָבִ֑ין וָ/אֹ֣מְרָ֔/ה אֲדֹנִ֕/י מָ֥ה אַחֲרִ֖ית אֵֽלֶּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/008.yaml
  text: As for me[a], I heard, but I did not understand. So I said, “My lord, what will be the outcome of these things?”
translation:
  language: pt
  text: 'Quanto a mim, ouvi, mas não entendi. Então eu disse: “Meu senhor, qual será o desfecho dessas coisas?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qual é o fim dessas coisas?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: A conjunção com o pronome independente destaca a perspectiva pessoal de Daniel, com leve contraste ou retomada; “Quanto a mim” expressa isso naturalmente.
- source_word: שָׁמַעְתִּי
  choice: ouvi
  rationale: O qal de שׁמע tem aqui o sentido comum de ouvir, referindo-se à recepção auditiva da revelação.
- source_word: וְלֹא אָבִין
  choice: mas não entendi
  rationale: בין significa entender ou discernir. “Mas” explicita o contraste contextual entre ouvir e não compreender, sem acrescentar incapacidade ao verbo.
- source_word: וָאֹמְרָה
  choice: Então perguntei
  rationale: A forma narrativa faz a ação avançar em consequência da falta de entendimento. Como a fala seguinte é interrogativa, “perguntei” é idiomático em português e preserva a função do ato de fala.
- source_word: אֲדֹנִי
  choice: Meu senhor
  rationale: É uma forma respeitosa de tratamento dirigida à figura celestial no contexto. A inicial minúscula evita identificá-la necessariamente com Deus.
- source_word: מָה אַחֲרִית אֵלֶּה
  choice: qual será o desfecho dessas coisas?
  rationale: אַחֲרִית pode designar fim, resultado ou desfecho. “Desfecho” comunica com clareza a orientação final ou futura da pergunta, mantendo a alternativa mais literal em nota.
theological_decisions:
- issue: Referente de אֲדֹנִי
  choice: 'Tratamento respeitoso à figura celestial/intérprete: “Meu senhor”, sem inicial maiúscula.'
  alternative: Entender como endereço direto a Deus e traduzir “Senhor”.
  rationale: O contexto imediato apresenta Daniel dirigindo-se à figura que comunica a revelação. A forma escolhida evita impor uma identificação divina que o texto não exige.
- issue: Sentido escatológico de אַחֲרִית
  choice: “desfecho”, preservando a referência ao resultado ou término final.
  alternative: “fim”, tradução mais formal e potencialmente mais cronológica.
  rationale: O termo admite tanto “fim” quanto “resultado/desfecho”. O texto não especifica além disso a natureza exata do término, por isso a nota conserva a alternativa lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Meu senhor” mantém o respeito sem sugerir por capitalização uma identificação necessária com Deus; “desfecho” soa natural no contexto apocalíptico.
