  text: וַ/אֲנִ֥י שָׁמַ֖עְתִּי וְ/לֹ֣א אָבִ֑ין וָ/אֹ֣מְרָ֔/ה אֲדֹנִ֕/י מָ֥ה אַחֲרִ֖ית אֵֽלֶּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/008.yaml
  text: As for me[a], I heard, but I did not understand. So I said, “My lord, what will be the outcome of these things?”
translation:
  language: pt
  text: 'Quanto a mim, ouvi, mas não entendi. Então eu disse: “Meu senhor, qual será o desfecho dessas coisas?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qual é o fim dessas coisas?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quanto a mim
  rationale: A conjunção com o pronome independente destaca a perspectiva pessoal de Daniel, com leve contraste ou retomada; “Quanto a mim” expressa isso naturalmente.
- source_word: שָׁמַעְתִּי
  choice: ouvi
  rationale: O qal de שׁמע tem aqui o sentido comum de ouvir, referindo-se à recepção auditiva da revelação.
- source_word: וְלֹא אָבִין
  choice: mas não entendi
  rationale: בין significa entender ou discernir; “mas” explicita o contraste contextual entre ouvir e não compreender.
- source_word: וָאֹמְרָה
  choice: Então perguntei
  rationale: A forma narrativa faz a sequência avançar. Embora o verbo seja literalmente “disse”, em português a introdução de uma pergunta é expressa com naturalidade por “perguntei”.
- source_word: אֲדֹנִי
  choice: Meu senhor
  rationale: É um tratamento respeitoso dirigido à figura celestial ou intérprete. A inicial minúscula evita identificá-la indevidamente com Deus.
- source_word: מָה אַחֲרִית אֵלֶּה
  choice: qual será o desfecho dessas coisas?
  rationale: אַחֲרִית pode significar fim, fase final ou resultado. “Desfecho” comunica com clareza a consumação futura em vista sem eliminar a alternativa mais literal.
theological_decisions:
- issue: Referente de אֲדֹנִי
  choice: 'Tratamento respeitoso à figura celestial/intérprete: “Meu senhor”'
  alternative: 'Referência direta a Deus: “Senhor”'
  rationale: O contexto imediato favorece Daniel dirigindo-se ao mensageiro da revelação. A minúscula preserva essa leitura sem impor uma identificação teológica mais forte.
- issue: Sentido escatológico de אַחֲרִית
  choice: “desfecho”, destacando o resultado ou consumação
  alternative: “fim”, formulação mais literal e potencialmente temporal
  rationale: O termo admite tanto o fim quanto o resultado final. O texto principal usa uma expressão portuguesa natural, e a nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem e o contraste do hebraico são preservados sem rigidez; “perguntei” traduz idiomaticamente o verbo “disse” diante de uma pergunta direta.
