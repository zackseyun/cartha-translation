  rationale: A revisão elimina a explicitação de “receber” do texto principal e usa uma formulação portuguesa natural que mantém a relação entre levantar-se e sua porção atribuída. Também aproxima o imperativo inicial do hebraico. As notas preservam a alternativa idiomática, a provável referência à morte e a relação contextual com a ressurreição, sem impor essa interpretação como tradução explícita.
