base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/013.yaml
  text: But as for you[a], go to the end[d][c][b]; and you will rest and stand in your allotted place at the end of the days.
translation:
  language: pt
  text: Quanto a você, vá até o fim; você descansará e se levantará para a porção que lhe cabe, no fim dos dias.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “siga seu caminho até o fim”.'
    reason: lexical_alternative
  - marker: b
    text: “Descansará” provavelmente se refere à morte de Daniel antes da consumação final.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “ficará de pé para a sua porção”. A expressão pode indicar que Daniel receberá a parte ou herança que lhe cabe, com possível ressonância de ressurreição; compare Daniel 12:2.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quanto a você
  rationale: O pronome independente com a conjunção assinala uma mudança de foco para Daniel e tem valor contrastivo; a formulação é natural e digna em português.
- source_word: לֵךְ לַקֵּץ
  choice: siga seu caminho até o fim
  rationale: O imperativo de הלך ordena que Daniel prossiga, enquanto לַקֵּץ aponta para o limite final. A expressão portuguesa comunica melhor o sentido contextual do que o pouco natural 'vá ao fim'.
- source_word: וְתָנוּחַ
  choice: você descansará
  rationale: נוח significa 'descansar'. O contexto pode sugerir a morte de Daniel antes da consumação, mas a tradução não torna explícito aquilo que o verbo apenas implica.
- source_word: וְתַעֲמֹד
  choice: se levantará
  rationale: עמד significa literalmente 'ficar de pé' ou 'estar de pé'. Aqui, após o descanso e no horizonte escatológico do capítulo, 'se levantará' conserva a imagem de assumir posição e permite a ressonância de ressurreição sem empregar o termo técnico 'ressuscitar'.
- source_word: לְגֹרָלְךָ
  choice: para receber a porção que lhe foi destinada
  rationale: גּוֹרָל é literalmente 'sorte' e, por extensão, a parte atribuída por sorteio. A formulação evita a opacidade de 'para a sua sorte' e expressa naturalmente a ideia de porção ou herança designada.
- source_word: לְקֵץ הַיָּמִין
  choice: no fim dos dias
  rationale: Reproduz de perto a expressão hebraica e mantém sua força escatológica sem definir além do que o texto afirma.
theological_decisions:
- issue: Se וְתָנוּחַ declara explicitamente a morte de Daniel
  choice: Manter 'você descansará' no texto principal.
  alternative: você morrerá e descansará
  rationale: Embora a morte antes da vindicação final seja uma implicação provável, o hebraico diz apenas 'descansará'; a tradução preserva essa contenção.
- issue: Se וְתַעֲמֹד deve ser explicitado como ressurreição
  choice: Traduzir por 'se levantará', sem usar 'ressuscitar'.
  alternative: ficará de pé; ressuscitará
  rationale: O contexto de Daniel 12 dá à expressão uma possível ressonância de ressurreição, mas o verbo significa 'estar ou ficar de pé'. 'Se levantará' preserva a tensão entre o sentido lexical e a implicação contextual.
- issue: Sentido de לְגֹרָלְךָ
  choice: Entender como a porção destinada a Daniel.
  alternative: para a sua sorte; em seu lugar designado
  rationale: A metáfora da sorte designa a parcela ou herança atribuída. A tradução comunica o referente sem impor uma descrição específica dessa recompensa.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é digno e direto. Evitou-se tanto o literalismo opaco de 'para a sua sorte' quanto a explicitação doutrinária de 'ressuscitará'. Todos os marcadores remetem a notas e aparecem no texto principal.
