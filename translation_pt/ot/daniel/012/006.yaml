id: DAN.12.6
reference: Daniel 12:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לָ/אִישׁ֙ לְב֣וּשׁ הַ/בַּדִּ֔ים אֲשֶׁ֥ר מִ/מַּ֖עַל לְ/מֵימֵ֣י הַ/יְאֹ֑ר עַד מָתַ֖י קֵ֥ץ הַ/פְּלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/006.yaml
  text: And he said to the man clothed in linen[a], who was above the waters of the river[b], “How long until the end of these wonders?”
translation:
  language: pt
  text: 'E ele disse ao homem vestido de linho, que estava acima das águas do rio[a]: “Quanto tempo falta para o fim dessas maravilhas[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre as águas do rio”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dessas coisas extraordinárias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa. “E ele disse” preserva essa ligação sem tornar explícita uma sequência temporal além do que o hebraico exige.
- source_word: לָאִישׁ
  choice: ao homem
  rationale: O artigo definido aponta para uma figura já identificável no contexto da visão.
- source_word: לְבוּשׁ הַבַּדִּים
  choice: vestido de linho
  rationale: Expressão natural e digna em português para a construção participial que descreve a roupa da figura, sem acrescentar identificação teológica.
- source_word: אֲשֶׁר מִמַּעַל לְמֵימֵי הַיְאֹר
  choice: que estava acima das águas do rio
  rationale: מִמַּעַל expressa posição acima ou sobre algo. “Rio” se ajusta ao cenário imediato e evita a associação indevida de יְאֹר exclusivamente com o Nilo.
- source_word: עַד מָתַי
  choice: Quanto tempo falta para
  rationale: Forma idiomática em português para perguntar pelo tempo restante até determinado acontecimento, preservando a orientação futura da expressão hebraica.
- source_word: קֵץ
  choice: o fim
  rationale: Indica o ponto terminal ou a conclusão dos acontecimentos mencionados.
- source_word: הַפְּלָאוֹת
  choice: dessas maravilhas
  rationale: O substantivo derivado de פלא descreve acontecimentos admiráveis ou extraordinários. “Dessas” torna natural em português a referência contextual aos eventos da visão.
theological_decisions:
- issue: Identidade do falante e do homem vestido de linho
  choice: Manter “ele” e a descrição “o homem vestido de linho”, sem identificar nenhuma das figuras além do que o versículo afirma.
  alternative: Identificar explicitamente o falante como um anjo ou o homem vestido de linho como uma manifestação de Cristo.
  rationale: O hebraico deste versículo não fornece essas identificações de modo explícito. A tradução preserva a abertura do texto e evita introduzir uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira e compreensão internacional. A formulação conserva o caráter visionário do texto sem recorrer a linguagem arcaica nem resolver ambiguidades de identificação.
