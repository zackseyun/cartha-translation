  source_fidelity: 'A tradução representa com fidelidade os elementos centrais do hebraico: o homem vestido de linho acima das águas do rio, o levantamento explícito das duas mãos, o juramento por aquele que vive para sempre, a fórmula temporal deliberadamente enigmática e a conclusão ligada ao despedaçamento do poder do povo santo. A construção em discurso indireto (''que seria... quando terminasse... se cumpririam'') preserva adequadamente a perspectiva futura do juramento narrado.'
  naturalness: O português é moderno, claro e solene sem artificialidade. A divisão em duas frases melhora a legibilidade e não prejudica a progressão do enunciado. 'Vestido de linho', 'para o céu' e 'povo santo' são formulações naturais e apropriadas ao registro.
  terminology: 'As escolhas terminológicas são consistentes com o texto-fonte e com o registro bíblico: ''linho'', ''rio'', ''aquele que vive para sempre'', ''tempo, tempos e metade de um tempo'' e ''povo santo''. ''Poder'' comunica de forma idiomática a metonímia hebraica de ''mão'', e a nota preserva a forma literal. A nota sobre a fórmula temporal mantém corretamente a ambiguidade sem impor uma cronologia interpretativa.'
