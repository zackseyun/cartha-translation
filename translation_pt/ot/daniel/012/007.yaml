  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת הָ/אִ֣ישׁ לְב֣וּשׁ הַ/בַּדִּ֗ים אֲשֶׁ֣ר מִ/מַּעַל֮ לְ/מֵימֵ֣י הַ/יְאֹר֒ וַ/יָּ֨רֶם יְמִינ֤/וֹ וּ/שְׂמֹאל/וֹ֙ אֶל הַ/שָּׁמַ֔יִם וַ/יִּשָּׁבַ֖ע בְּ/חֵ֣י הָ/עוֹלָ֑ם כִּי֩ לְ/מוֹעֵ֨ד מֽוֹעֲדִ֜ים וָ/חֵ֗צִי וּ/כְ/כַלּ֛וֹת נַפֵּ֥ץ יַד עַם קֹ֖דֶשׁ תִּכְלֶ֥ינָה כָל אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/007.yaml
  text: Then I heard the man clothed in linen[a], who was above the waters of the river, and he raised his right hand and his left hand to heaven and swore by him who lives forever that it would be for a time, times, and half a time; and when the shattering of the power of the holy people is finished[b], all these things will be completed.
translation:
  language: pt
  text: Então ouvi o homem vestido de linho, que estava acima das águas do rio. Ele levantou a mão direita e a esquerda para o céu e jurou por aquele que vive para sempre que seria por um tempo, tempos e metade de um tempo[a]; e, quando terminasse o despedaçamento do poder do povo santo[b], todas essas coisas se cumpririam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “por um período determinado, períodos determinados e metade”. Muitos entendem a expressão como “por um ano, dois anos e meio ano”.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “a mão do povo santo”. Aqui, “mão” provavelmente significa poder ou força.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבוּשׁ הַבַּדִּים
  choice: vestido de linho
  rationale: Reproduz naturalmente a construção participial e preserva a imagem concreta das vestes de linho.
- source_word: הַיְאֹר
  choice: o rio
  rationale: No contexto da visão em Daniel, designa o grande curso de água sem exigir a identificação específica com o Nilo.
- source_word: וַיָּרֶם יְמִינוֹ וּשְׂמֹאלוֹ
  choice: levantou a mão direita e a esquerda
  rationale: Mantém a referência explícita às duas mãos e a solenidade do gesto de juramento.
- source_word: בְּחֵי הָעוֹלָם
  choice: por aquele que vive para sempre
  rationale: Expressa de modo idiomático a fórmula hebraica de juramento e conserva sua referência pessoal e divina.
- source_word: לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: por um tempo, tempos e metade de um tempo
  rationale: Preserva a fórmula apocalíptica e sua ambiguidade, sem definir no texto principal unidades cronológicas que o hebraico não explicita.
- source_word: וּכְכַלּוֹת נַפֵּץ יַד
  choice: quando terminasse o despedaçamento do poder
  rationale: A construção indica uma circunstância temporal; 'poder' comunica a metonímia de 'mão', enquanto 'despedaçamento' mantém a força violenta do verbo.
- source_word: עַם קֹדֶשׁ
  choice: o povo santo
  rationale: É uma formulação clara e consagrada para o povo separado para Deus.
- source_word: תִּכְלֶינָה כָל אֵלֶּה
  choice: todas essas coisas se cumpririam
  rationale: Indica que os acontecimentos anunciados chegariam ao seu desfecho completo e harmoniza a perspectiva verbal com o juramento relatado em discurso indireto.
theological_decisions:
- issue: Sentido da fórmula apocalíptica לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: Manter 'por um tempo, tempos e metade de um tempo'.
  alternative: Por um período determinado, períodos determinados e metade; ou por um ano, dois anos e meio ano.
  rationale: A tradução conserva a abertura interpretativa do hebraico e não transforma em afirmação explícita a interpretação comum de que os períodos sejam anos.
- issue: Sentido metonímico de יַד na expressão נַפֵּץ יַד עַם קֹדֶשׁ
  choice: Traduzir יַד por 'poder'.
  alternative: A mão do povo santo; ou a força do povo santo.
  rationale: '''Poder'' torna inteligível a metonímia em português sem atenuar a ideia de opressão e desintegração sofrida pelo povo santo.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar um período excessivamente longo, sem alterar a progressão do hebraico. Os marcadores [a] e [b] aparecem junto às expressões correspondentes no texto principal.
