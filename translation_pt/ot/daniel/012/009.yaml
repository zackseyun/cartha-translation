  text: וַ/יֹּ֖אמֶר לֵ֣ךְ דָּנִיֵּ֑אל כִּֽי סְתֻמִ֧ים וַ/חֲתֻמִ֛ים הַ/דְּבָרִ֖ים עַד עֵ֥ת קֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/009.yaml
  text: And he said[a], “Go your way, Daniel, because the words are concealed and sealed until the time of the end.”
translation:
  language: pt
  text: 'Então ele disse: “Siga seu caminho, Daniel, porque as palavras estão ocultas e seladas até o tempo do fim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então ele disse” é natural em português e mantém a progressão do discurso.
- source_word: לֵךְ
  choice: Siga seu caminho
  rationale: O imperativo de הלך, neste contexto, encerra a instrução e manda Daniel prosseguir; a expressão é idiomática e preserva mais dessa força do que apenas “Vá”.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da ordem dada a Daniel de maneira clara e natural.
- source_word: סְתֻמִים
  choice: ocultas
  rationale: O particípio passivo de סתם apresenta as palavras como fechadas ou inacessíveis; “ocultas” comunica esse sentido sem formulação arcaica.
- source_word: וַחֲתֻמִים
  choice: e seladas
  rationale: O particípio passivo de חתם evoca diretamente o ato de selar um documento e mantém a imagem do texto hebraico.
- source_word: הַדְּבָרִים
  choice: estas palavras
  rationale: דברים se refere à mensagem revelatória precedente. O demonstrativo explicita naturalmente em português a referência contextual do artigo hebraico.
- source_word: עַד עֵת קֵץ
  choice: até o tempo do fim
  rationale: Preserva a estrutura formal e o peso escatológico da expressão característica de Daniel, sem determinar em que consiste esse fim ou quando ocorre.
theological_decisions:
- issue: Força escatológica de עֵת קֵץ
  choice: o tempo do fim
  alternative: o tempo final
  rationale: “O tempo do fim” mantém a expressão-chave de Daniel e sua tensão escatológica, sem impor uma cronologia mais específica do que o hebraico fornece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o paralelismo “ocultas e seladas” e evita linguagem confessional específica.
