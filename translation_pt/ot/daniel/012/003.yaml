revisions:
- from: Os que têm discernimento[a] brilharão como o esplendor da expansão celeste[b]; e os que tornam justos os muitos[c], como as estrelas, para todo o sempre.
  to: E os que têm discernimento[a] brilharão como o esplendor da extensão celeste[b]; e os que tornam justos os muitos[c], como as estrelas, para todo o sempre.
  rationale: Apenas “expansão celeste” foi substituído por “extensão celeste”, para representar mais naturalmente רָקִיעַ em português moderno e harmonizar o texto principal com a explicação da nota. Foi também mantido o “E” inicial, correspondente à conjunção hebraica, sem prejuízo da fluência.
