  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ֨/מַּשְׂכִּלִ֔ים יַזְהִ֖רוּ כְּ/זֹ֣הַר הָ/רָקִ֑יעַ וּ/מַצְדִּיקֵי֙ הָֽ/רַבִּ֔ים כַּ/כּוֹכָבִ֖ים לְ/עוֹלָ֥ם וָ/עֶֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/003.yaml
  text: And those who have insight will shine like the brightness of the expanse[a], and those who make the many righteous[c][b], like the stars forever and ever.
translation:
  language: pt
  text: E os que têm discernimento[a] brilharão como o esplendor da extensão celeste[b]; e os que tornam justos os muitos[c], como as estrelas, para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os sábios” ou “os que entendem”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a vasta extensão dos céus; tradicionalmente, “firmamento”.
    reason: lexical_alternative
  - marker: c
    text: Ou “os que conduzem os muitos à justiça”; o hebraico também pode ser entendido como “os que declaram justos os muitos”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּשְׂכִּלִים
  choice: os que têm discernimento
  rationale: O particípio de שכל caracteriza pessoas dotadas de compreensão e discernimento. A formulação conserva a nuance verbal sem reduzi-la simplesmente a uma categoria fixa de “sábios”.
- source_word: יַזְהִרוּ
  choice: brilharão
  rationale: O hifil de זהר expressa brilho ou fulgor; “brilharão” é natural em português e corresponde à comparação que se segue.
- source_word: כְּזֹהַר
  choice: como o esplendor
  rationale: זֹהַר indica brilho, fulgor ou esplendor. “Esplendor” evita a repetição imediata de “brilharão” e mantém o tom elevado.
- source_word: הָרָקִיעַ
  choice: a expansão celeste
  rationale: רָקִיעַ designa a extensão aberta dos céus. “Expansão celeste” preserva essa imagem melhor que o simples “céu”, enquanto a nota registra a tradução tradicional.
- source_word: וּמַצְדִּיקֵי
  choice: e os que tornam justos
  rationale: O particípio causativo de צדק pode significar fazer com que alguém seja justo, conduzir à justiça ou declarar justo. A tradução direta conserva a força causativa e deixa a amplitude semântica explícita na nota.
- source_word: הָרַבִּים
  choice: os muitos
  rationale: O artigo definido hebraico foi preservado. A expressão deliberadamente marcada também mantém o peso de “os muitos” no discurso apocalíptico.
- source_word: כַּכּוֹכָבִים
  choice: como as estrelas
  rationale: Tradução direta e idiomática da comparação hebraica.
- source_word: לְעוֹלָם וָעֶד
  choice: para todo o sempre
  rationale: A expressão dupla intensifica a ideia de duração perpétua; a fórmula portuguesa conserva essa ênfase.
theological_decisions:
- issue: Sentido de מַצְדִּיקֵי הָרַבִּים
  choice: os que tornam justos os muitos
  alternative: os que conduzem os muitos à justiça; os que declaram justos os muitos
  rationale: O causativo de צדק admite uma leitura transformadora, orientadora ou declarativa. A tradução principal segue de perto a forma causativa, sem impor uma interpretação exclusivamente ética ou forense; a nota preserva as alternativas legítimas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura paralela do hebraico foi mantida, inclusive a elipse de “brilharão” na segunda oração. “Os muitos” é intencionalmente mais marcado para preservar o artigo e a expressão apocalíptica da fonte.
