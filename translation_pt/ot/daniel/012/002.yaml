base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/002.yaml
  text: And many of those sleeping in the dust of the earth will awake[a], these to everlasting life, and those to reproaches[c][b], to everlasting contempt.
translation:
  language: pt
  text: 'E muitos dos que dormem no pó da terra despertarão[a]: estes, para a vida eterna; e aqueles, para afrontas[b], para o desprezo eterno[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “multidões dos que dormem no pó da terra”. O hebraico diz “muitos”, não explicitamente “todos”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “para a vergonha” ou “para a desonra”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para a repulsa eterna”. Compare Isaías 66:24, onde aparece o mesmo substantivo raro em um contexto de juízo.'
    reason: cross_reference
lexical_decisions:
- source_word: רַבִּים
  choice: muitos
  rationale: Preserva o sentido lexical direto do hebraico sem ampliá-lo interpretativamente para “todos”; “multidões” permanece uma alternativa possível.
- source_word: מִיְּשֵׁנֵי
  choice: dos que dormem
  rationale: Mantém de modo natural em português a metáfora do sono para a morte, sem substituí-la por uma interpretação explícita.
- source_word: אַדְמַת עָפָר
  choice: no pó da terra
  rationale: Expressão portuguesa clara e digna que conserva as imagens de sepultamento e mortalidade presentes na construção hebraica.
- source_word: יָקִיצוּ
  choice: despertarão
  rationale: Conserva a metáfora verbal de acordar, em vez de introduzir “ressuscitarão” ou “se levantarão”, que interpretariam mais diretamente o evento.
- source_word: אֵלֶּה
  choice: estes ... aqueles
  rationale: Reproduz o contraste demonstrativo do hebraico com clareza e sem suavizá-lo para “uns ... outros”.
- source_word: לְחַיֵּי עוֹלָם
  choice: para a vida eterna
  rationale: Formulação corrente e inteligível em português; “eterna” comunica duração permanente e permite repetir o mesmo termo na conclusão do versículo.
- source_word: חֲרָפוֹת
  choice: afrontas
  rationale: O plural preserva tanto a forma hebraica quanto a dimensão pública e social de censura, vergonha e desonra.
- source_word: דִרְאוֹן
  choice: desprezo
  rationale: Traduz com clareza o raro substantivo que denota repulsa ou aversão; a alternativa mais forte “repulsa” é registrada em nota.
- source_word: עוֹלָם
  choice: eterna / eterno
  rationale: A mesma escolha lexical nos dois casos preserva o paralelismo entre os dois destinos, com a flexão de gênero exigida em português.
theological_decisions:
- issue: Alcance da ressurreição indicada por רַבִּים
  choice: Traduzir como “muitos”, sem expandir para “todos”.
  alternative: Entender “muitos” como referência inclusiva a todos os mortos em vista, ou traduzir “multidões”.
  rationale: O texto hebraico diz literalmente “muitos”. A tradução conserva essa formulação e deixa aberta a questão de seu alcance, sem impor uma conclusão sistemática.
- issue: Natureza do destino negativo
  choice: 'Manter dois termos distintos: “para afrontas, para o desprezo eterno”.'
  alternative: “Para a vergonha e a repulsa eterna” ou formulações que fundam as duas expressões em uma só.
  rationale: O hebraico apresenta duas expressões ligadas, uma no plural e outra no singular. Preservá-las distintamente mantém a força e a tensão próprias do texto sem importar formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem e o paralelismo hebraicos foram mantidos onde naturais; os dois usos de עוֹלָם são traduzidos consistentemente por “eterno”, com concordância de gênero. A metáfora do sono e do despertar permanece explícita.
