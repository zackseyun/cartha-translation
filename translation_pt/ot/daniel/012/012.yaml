base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/012.yaml
  text: Blessed is the one who waits and reaches the 1,335 days[a].
translation:
  language: pt
  text: Feliz aquele que espera e chega aos 1.335 dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bem-aventurado aquele que continua esperando e alcança os 1.335 dias.”'
    reason: Alternativas lexicais que ressaltam o tom elevado de אַשְׁרֵי, a continuidade do particípio e o sentido de alcançar um marco temporal.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: Expressa a condição bem-aventurada e invejável da pessoa. “Feliz” é natural e claro em português atual, sem implicar necessariamente uma emoção passageira.
- source_word: הַמְחַכֶּה
  choice: aquele que espera
  rationale: O particípio indica espera contínua e expectante; a formulação preserva o singular representativo e soa natural em português.
- source_word: וְיַגִּיעַ
  choice: e chega
  rationale: Neste contexto, o hifil de נגע indica alcançar ou chegar a um ponto temporal determinado.
- source_word: לְיָמִים
  choice: aos ... dias
  rationale: A preposição marca a chegada ao período especificado; “chega aos ... dias” conserva essa relação temporal de modo idiomático.
- source_word: אֶלֶף שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  choice: '1.335'
  rationale: A sequência cardinal hebraica totaliza 1.335; emprega-se a notação numérica usual em português para facilitar a leitura.
theological_decisions:
- issue: Sentido da bem-aventurança dentro de um cronograma apocalíptico
  choice: Manter a afirmação temporal sem interpretar os 1.335 dias como literais ou simbólicos.
  alternative: Entender o número como um período cronológico estritamente literal ou como um número apocalíptico simbólico ou estilizado.
  rationale: O hebraico declara feliz quem persevera até o marco temporal indicado, mas não explica a natureza desse período; a tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Feliz aquele” mantém a concisão proverbial da fórmula hebraica; a nota registra uma opção mais elevada e explicita nuances lexicais sem impor uma interpretação escatológica.
