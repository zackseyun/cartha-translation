  text: וְ/אַתָּ֣ה דָֽנִיֵּ֗אל סְתֹ֧ם הַ/דְּבָרִ֛ים וַ/חֲתֹ֥ם הַ/סֵּ֖פֶר עַד עֵ֣ת קֵ֑ץ יְשֹׁטְט֥וּ רַבִּ֖ים וְ/תִרְבֶּ֥ה הַ/דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/004.yaml
  text: But you[a], Daniel, shut up the words and seal the book until the time of the end. Many will roam about[b], and knowledge will increase.
translation:
  language: pt
  text: Mas você, Daniel, encerre as palavras e sele o livro[a] até o tempo do fim. Muitos andarão de um lado para outro[b], e o conhecimento aumentará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o rolo”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “Muitos correrão de um lado para outro”. O hebraico também pode sugerir buscas ou exame cuidadoso, dando o sentido: “Muitos buscarão, e o conhecimento aumentará”.'
    reason: alternative_reading
lexical_decisions:
- source_word: סְתֹם
  choice: guarde
  rationale: O imperativo indica fechar ou manter inacessível. “Guarde” soa natural em português, conserva a ideia de preservar e restringir o acesso e evita afirmar que a mensagem ficaria totalmente secreta.
- source_word: הַדְּבָרִים
  choice: as palavras
  rationale: דבר pode significar “palavra” ou “assunto”; aqui se refere à mensagem revelada a Daniel, por isso “as palavras” é direto e fiel.
- source_word: חֲתֹם
  choice: sele
  rationale: O imperativo descreve o ato de pôr um selo num documento, tanto para preservá-lo como para restringir seu acesso.
- source_word: הַסֵּפֶר
  choice: o livro
  rationale: ספר pode designar livro, rolo ou documento escrito. “Livro” é claro e convencional; “rolo” é preservado em nota como alternativa ligada à forma material do texto.
- source_word: עַד עֵת קֵץ
  choice: até o tempo do fim
  rationale: A expressão marca o ponto final escatológico. A formulação é natural e tradicional sem acrescentar uma cronologia específica.
- source_word: יְשֹׁטְטוּ רַבִּים
  choice: Muitos andarão de um lado para outro
  rationale: שוטט pode indicar deslocar-se por vários lugares, ir e vir ou percorrer algo em busca de informação. A redação principal mantém o sentido amplo de movimento, enquanto a nota registra as demais nuances plausíveis.
- source_word: וְתִרְבֶּה הַדָּעַת
  choice: e o conhecimento aumentará
  rationale: רבה com דעת expressa aumento ou multiplicação do conhecimento. A tradução é direta e não determina se se trata de conhecimento geral ou de compreensão da profecia.
theological_decisions:
- issue: Sentido de יְשֹׁטְטוּ רַבִּים וְתִרְבֶּה הַדָּעַת
  choice: Uma declaração ampla de que muitos irão de um lado para outro e de que o conhecimento aumentará, sem especificar a natureza desse movimento ou conhecimento.
  alternative: A frase pode descrever viagens literais e aumento do conhecimento humano em geral, ou pessoas examinando a mensagem e crescendo na compreensão da profecia.
  rationale: O hebraico admite movimento físico, busca ou exame. A tradução principal preserva essa tensão e não transforma o versículo numa previsão explícita de progresso tecnológico nem o limita ao estudo da profecia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” mantém a distinção enfática do pronome hebraico sem recorrer ao mais regional ou solene “tu”. A ordem das frases e o paralelismo do original foram preservados.
