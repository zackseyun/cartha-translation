  naturalness: O português é moderno, claro e adequado ao registro bíblico. “Mas você, Daniel” é legível e conserva o contraste enfático. “Muitos andarão de um lado para outro” é natural e mantém a amplitude do hebraico.
  terminology: “Sele o livro”, “tempo do fim” e “o conhecimento aumentará” são escolhas fiéis e idiomáticas. A nota sobre “rolo” é apropriada. A nota sobre o último dístico deve formular a alternativa de busca sem introduzir o transitivo incompleto “Muitos examinarão”.
