base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/005.yaml
  text: 'Then I[a], Daniel, looked, and behold, two others were standing: one on this bank of the river, and one on that bank of the river.'
translation:
  language: pt
  text: 'Então eu, Daniel, olhei, e eis que dois outros estavam em pé: um em uma margem do rio e o outro na outra margem do rio.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete, nas duas ocorrências, “aqui, à margem do rio”; a tradução entende as duas posições como margens opostas do rio.
    reason: ambiguidade textual e lexical
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Então ... olhei
  rationale: O waw com a forma verbal faz a narrativa avançar; “então” expressa a sequência, e “olhei” introduz naturalmente a nova cena visual sem perder o ato de ver.
- source_word: אֲנִי דָנִיֵּאל
  choice: eu, Daniel
  rationale: O pronome explícito seguido do nome próprio tem valor enfático e de autoidentificação, preservado de modo idiomático em português.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: A expressão chama a atenção para algo novo visto na visão. “E eis que” conserva sua vivacidade de modo digno e reconhecível.
- source_word: שְׁנַיִם אֲחֵרִים
  choice: dois outros
  rationale: Distingue essas duas figuras daquela já presente no contexto, sem especificar sua natureza.
- source_word: עֹמְדִים
  choice: estavam em pé
  rationale: O particípio descreve uma postura contínua e compõe o cenário; “estavam em pé” comunica esse aspecto durativo.
- source_word: הֵנָּה
  choice: deste lado ... do outro lado
  rationale: No contexto das duas margens opostas, a formulação torna clara em português a distribuição das figuras, enquanto a repetição incomum do advérbio hebraico é registrada em nota.
- source_word: לִשְׂפַת
  choice: à margem
  rationale: שָׂפָה significa literalmente “lábio” ou “borda”; em referência a um rio, “margem” é a equivalência portuguesa natural.
- source_word: הַיְאֹר
  choice: o rio
  rationale: Embora יְאֹר possa designar o Nilo em outros contextos, aqui se refere ao rio da visão e não exige a identificação específica como Nilo.
theological_decisions:
- issue: Identidade dos “dois outros”
  choice: Traduzir de modo neutro como “dois outros”, sem identificá-los.
  alternative: “dois outros anjos” ou “dois outros seres celestiais”
  rationale: O hebraico não identifica explicitamente essas figuras neste versículo; especificá-las acrescentaria uma conclusão teológica não declarada pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” conserva a força de apresentação da visão; “à margem do rio” é natural e evita a expressão excessivamente literal “no lábio do rio”. O marcador [a] aparece após a frase cuja formulação a nota esclarece.
