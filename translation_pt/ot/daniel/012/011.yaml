id: DAN.12.11
reference: Daniel 12:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מֵ/עֵת֙ הוּסַ֣ר הַ/תָּמִ֔יד וְ/לָ/תֵ֖ת שִׁקּ֣וּץ שֹׁמֵ֑ם יָמִ֕ים אֶ֖לֶף מָאתַ֥יִם וְ/תִשְׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/011.yaml
  text: And from the time that the regular offering is removed and the abomination that desolates is set up[b][a], there will be 1,290 days.
translation:
  language: pt
  text: E, desde o momento em que a oferta regular for retirada e a abominação que causa desolação for estabelecida[a][b], haverá 1.290 dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “o sacrifício diário”. O hebraico תָּמִיד é uma forma cultual abreviada para a oferta regular ou contínua do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou, “a abominação da desolação” ou “a abominação desoladora”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵעֵת
  choice: E, desde o momento em que
  rationale: Preserva tanto a conjunção que liga o versículo ao contexto anterior quanto o ponto inicial temporal expresso por מִן + עֵת, em português natural.
- source_word: הוּסַר
  choice: for retirada
  rationale: O hofal de סור expressa remoção passiva. O futuro do subjuntivo ajusta-se naturalmente à construção temporal e ao contexto profético.
- source_word: הַתָּמִיד
  choice: a oferta regular
  rationale: תָּמִיד funciona aqui como abreviação cultual da oferta contínua ou regular do templo. A tradução evita especificar 'holocausto' ou 'sacrifício' além do que o substantivo elíptico explicita.
- source_word: וְלָתֵת
  choice: e ... for estabelecida
  rationale: Embora literalmente contenha o infinitivo 'dar/pôr', no contexto indica a colocação ou instalação da abominação. A formulação passiva produz uma construção temporal clara em português.
- source_word: שִׁקּוּץ
  choice: a abominação
  rationale: O termo designa algo detestável, sobretudo em contexto idolátrico ou profanador. 'Abominação' mantém o registro bíblico reconhecível.
- source_word: שֹׁמֵם
  choice: que causa desolação
  rationale: Expressa o valor participial e o efeito desolador sem resolver a construção na fórmula substantiva tradicional.
- source_word: יָמִים אֶלֶף מָאתַיִם וְתִשְׁעִים
  choice: haverá 1.290 dias
  rationale: O hebraico apresenta de modo sucinto a duração. 'Haverá' completa naturalmente a oração em português, preservando o número exato.
theological_decisions:
- issue: Tradução de הַתָּמִיד no contexto apocalíptico e templário
  choice: a oferta regular
  alternative: o sacrifício diário; a oferta contínua
  rationale: O hebraico é elíptico e se refere ao rito regular do templo. A escolha mantém a referência cultual sem estreitá-la indevidamente; a forma tradicional fica registrada em nota.
- issue: Tradução de שִׁקּוּץ שֹׁמֵם
  choice: a abominação que causa desolação
  alternative: a abominação da desolação; a abominação desoladora
  rationale: A opção principal representa de maneira direta a força participial de שֹׁמֵם. As alternativas preservam a ambiguidade sintática e a conhecida formulação tradicional.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem dos marcadores segue a ocorrência das expressões explicadas: primeiro הַתָּמִיד, depois שִׁקּוּץ שֹׁמֵם.'
