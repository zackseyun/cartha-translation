  source_fidelity: 'O texto representa com precisão a sequência hebraica: os dois hitpael iniciais são expressos com nuance reflexiva/média («se purificarão, se tornarão brancos»), o nifal de צרף como passivo («serão refinados»), e a negação total de כָּל רְשָׁעִים é transmitida idiomaticamente por «Nenhum dos perversos». A repetição enfática entre «perversos» e «perversamente» também é preservada. Não se introduz agente para a purificação nem interpretação doutrinária alheia ao texto.'
