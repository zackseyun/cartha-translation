  terminology: «Perversos», «agirão perversamente» e «os que têm discernimento» são escolhas semanticamente adequadas e naturais. «Os que têm discernimento» preserva melhor que «os sábios» a relação com o verbo final «entenderão», enquanto a nota apresenta «os sábios» como alternativa legítima. A nota a explica de maneira suficiente a alternativa passiva para os dois primeiros verbos.
