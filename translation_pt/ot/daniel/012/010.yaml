  text: יִ֠תְבָּֽרֲרוּ וְ/יִֽתְלַבְּנ֤וּ וְ/יִצָּֽרְפוּ֙ רַבִּ֔ים וְ/הִרְשִׁ֣יעוּ רְשָׁעִ֔ים וְ/לֹ֥א יָבִ֖ינוּ כָּל רְשָׁעִ֑ים וְ/הַ/מַּשְׂכִּלִ֖ים יָבִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/010.yaml
  text: Many will purify themselves and make themselves white and be refined[a], but the wicked will act wickedly; and none of the wicked will understand[b], but those who have insight will understand.
translation:
  language: pt
  text: Muitos se purificarão, se tornarão brancos e serão refinados[a], mas os perversos agirão perversamente. Nenhum dos perversos entenderá, mas os que têm discernimento entenderão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Muitos serão purificados, embranquecidos e refinados.” Os dois primeiros verbos hebraicos podem ter sentido passivo, embora suas formas também admitam a nuance reflexiva ou média apresentada no texto principal.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “os sábios entenderão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְבָּרֲרוּ
  choice: se purificarão
  rationale: O hitpael de ברר admite sentido reflexivo ou médio, inclusive a ideia de tornar-se puro. A escolha preserva a participação dos próprios sujeitos sem excluir o processo de purificação.
- source_word: יִתְלַבְּנוּ
  choice: se tornarão brancos
  rationale: O hitpael de לבן conserva a imagem concreta de embranquecimento, aqui associada à purificação, e permite uma leitura reflexiva ou média natural em português.
- source_word: יִצָּרְפוּ
  choice: serão refinados
  rationale: O nifal de צרף remete ao refino de metais e, por extensão, à purificação por prova; a forma passiva distingue este verbo dos dois hitpael anteriores.
- source_word: רַבִּים
  choice: Muitos
  rationale: O termo funciona como substantivo plural indefinido e é traduzido de modo direto e natural.
- source_word: הִרְשִׁיעוּ רְשָׁעִים
  choice: os perversos agirão perversamente
  rationale: A combinação cognata intensifica a conduta perversa. A formulação mantém em português a repetição sem soar excessivamente artificial.
- source_word: כָּל רְשָׁעִים ... לֹא יָבִינוּ
  choice: Nenhum dos perversos entenderá
  rationale: 'A negação hebraica com כָּל é expressa idiomaticamente em português como negação total: ''nenhum''.'
- source_word: הַמַּשְׂכִּלִים
  choice: os que têm discernimento
  rationale: O particípio de שכל designa pessoas perspicazes ou discernidoras e mantém a ligação semântica com o verbo 'entenderão'.
theological_decisions:
- issue: Se os três primeiros verbos devem ser vertidos como ação passiva ou como processo com participação reflexiva dos sujeitos
  choice: 'Empregar linguagem reflexiva ou média nos dois primeiros verbos e passiva no terceiro: ''se purificarão, se tornarão brancos e serão refinados''.'
  alternative: Muitos serão purificados, embranquecidos e refinados.
  rationale: Os dois primeiros verbos estão no hitpael e admitem valor reflexivo ou médio; o terceiro está no nifal e se presta naturalmente ao passivo. A tradução preserva essa textura gramatical sem identificar explicitamente o agente da purificação.
- issue: Se הַמַּשְׂכִּלִים deve ser traduzido pelo termo mais geral 'sábios'
  choice: os que têm discernimento
  alternative: os sábios
  rationale: A opção escolhida preserva o valor participial e a relação lexical e conceitual com 'entenderão', sem ampliar o termo para uma categoria geral de sabedoria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a imagem concreta de tornar-se branco, a repetição enfática entre 'perversos' e 'perversamente' e o contraste entre falta de entendimento e discernimento.
