  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִ֠תְבָּֽרֲרוּ וְ/יִֽתְלַבְּנ֤וּ וְ/יִצָּֽרְפוּ֙ רַבִּ֔ים וְ/הִרְשִׁ֣יעוּ רְשָׁעִ֔ים וְ/לֹ֥א יָבִ֖ינוּ כָּל רְשָׁעִ֑ים וְ/הַ/מַּשְׂכִּלִ֖ים יָבִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/010.yaml
  text: Many will purify themselves and make themselves white and be refined[a], but the wicked will act wickedly; and none of the wicked will understand[b], but those who have insight will understand.
translation:
  language: pt
  text: Muitos se purificarão, se tornarão brancos e serão refinados[a], mas os perversos agirão perversamente. Nenhum dos perversos entenderá, mas os que têm discernimento entenderão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Muitos serão purificados, embranquecidos e refinados”. Os dois primeiros verbos hebraicos também podem ser entendidos em sentido passivo, embora suas formas admitam a nuance reflexiva ou média refletida no texto principal.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “os sábios entenderão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְבָּרֲרוּ
  choice: se purificarão
  rationale: O hitpael de ברר admite sentido reflexivo ou médio, bem como nuance passiva. “Se purificarão” preserva a participação dos próprios sujeitos sem excluir que a purificação lhes aconteça.
- source_word: יִתְלַבְּנוּ
  choice: se tornarão brancos
  rationale: O hitpael de לבן expressa tornar-se branco ou ser embranquecido. A tradução mantém a imagem concreta do hebraico e soa mais natural em português do que “se embranquecerão”.
- source_word: יִצָּרְפוּ
  choice: serão refinados
  rationale: O nifal de צרף descreve o refino de metais e, figuradamente, a purificação mediante prova. A forma passiva conserva tanto a voz quanto a metáfora.
- source_word: רַבִּים
  choice: Muitos
  rationale: O termo funciona como substantivo plural indefinido; “Muitos” é direto e natural.
- source_word: הִרְשִׁיעוּ רְשָׁעִים
  choice: os perversos agirão perversamente
  rationale: A combinação cognata enfatiza a conduta má. A repetição “perversos... perversamente” preserva essa ênfase de modo idiomático e digno.
- source_word: לֹא יָבִינוּ כָּל רְשָׁעִים
  choice: Nenhum dos perversos entenderá
  rationale: A construção hebraica com totalidade e negação é expressa naturalmente em português por “nenhum”.
- source_word: הַמַּשְׂכִּלִים
  choice: os que têm discernimento
  rationale: O particípio de שכל designa pessoas perspicazes ou capazes de compreender. “Os que têm discernimento” mantém a relação lexical e contextual com “entenderão”.
- source_word: יָבִינוּ
  choice: entenderão
  rationale: בין significa compreender ou discernir; “entenderão” preserva claramente o contraste entre os dois grupos.
theological_decisions:
- issue: Se os três primeiros verbos devem ser traduzidos como ação passiva ou reflexiva/média
  choice: 'Empregar formas reflexiva/média nos dois primeiros verbos e passiva no terceiro: “se purificarão, se tornarão brancos e serão refinados”'
  alternative: “serão purificados, embranquecidos e refinados”
  rationale: Os dois primeiros verbos estão no hitpael e comportam nuance reflexiva ou média; o terceiro está no nifal e favorece uma formulação passiva. A tradução conserva essa variação gramatical e não nomeia um agente que o texto hebraico deixa implícito.
- issue: Como traduzir הַמַּשְׂכִּלִים
  choice: os que têm discernimento
  alternative: os sábios
  rationale: Embora “os sábios” seja possível, “os que têm discernimento” preserva melhor o valor participial e sua ligação imediata com o verbo “entenderão”, sem ampliar o termo para uma categoria sapiencial mais abrangente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A imagem concreta de tornar-se branco foi preservada, e a repetição cognata “perversos... perversamente” reproduz a ênfase do hebraico sem linguagem excessivamente arcaica.
