  text: וּ/בָ/עֵ֣ת הַ/הִיא֩ יַעֲמֹ֨ד מִֽיכָאֵ֜ל הַ/שַּׂ֣ר הַ/גָּד֗וֹל הָ/עֹמֵד֮ עַל בְּנֵ֣י עַמֶּ/ךָ֒ וְ/הָיְתָה֙ עֵ֣ת צָרָ֔ה אֲשֶׁ֤ר לֹֽא נִהְיְתָה֙ מִֽ/הְי֣וֹת גּ֔וֹי עַ֖ד הָ/עֵ֣ת הַ/הִ֑יא וּ/בָ/עֵ֤ת הַ/הִיא֙ יִמָּלֵ֣ט עַמְּ/ךָ֔ כָּל הַ/נִּמְצָ֖א כָּת֥וּב בַּ/סֵּֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/001.yaml
  text: And at that time Michael[a], the great prince who stands over the sons of your people, will arise. And there will be a time of distress such as has not happened since there was a nation until that time. And at that time your people will escape[c][b], everyone who is found written in the book.
translation:
  language: pt
  text: E naquele tempo se levantará Miguel, o grande príncipe que está sobre os filhos do seu povo.[a] Haverá um tempo de angústia[b] como nunca houve desde que existe uma nação até aquele tempo. E naquele tempo o seu povo escapará,[c] todo aquele que for achado escrito no livro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se coloca a favor dos filhos do seu povo”; também pode ter o sentido de “que protege os filhos do seu povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um tempo de aflição”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “será livrado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: se levantará
  rationale: O verbo עמד significa literalmente “ficar de pé”, mas aqui pode indicar levantar-se para agir ou tomar posição. “Se levantará” conserva a imagem e sugere intervenção decisiva sem explicitar além do texto.
- source_word: הַשַּׂר הַגָּדוֹל
  choice: o grande príncipe
  rationale: שַׂר pode designar príncipe, governante ou chefe. No contexto celestial e político de Daniel, “príncipe” é natural e preserva a terminologia do livro.
- source_word: הָעֹמֵד עַל
  choice: que está sobre
  rationale: A expressão significa literalmente “que está sobre”. A tradução mantém a imagem hebraica e deixa aberta a ideia contextual de proteção, representação ou supervisão.
- source_word: בְּנֵי עַמֶּךָ
  choice: os filhos do seu povo
  rationale: Reproduz formalmente a expressão hebraica “filhos do seu povo”, que pode referir-se coletivamente aos membros ou descendentes do povo.
- source_word: עֵת צָרָה
  choice: um tempo de angústia
  rationale: צָרָה pode significar angústia, aflição ou dificuldade. “Angústia” comunica com clareza a intensidade da situação.
- source_word: אֲשֶׁר לֹא נִהְיְתָה מִהְיוֹת גּוֹי
  choice: como nunca houve desde que existe nação
  rationale: A formulação acompanha de perto a comparação temporal do hebraico e evita especificar se a referência é a uma nação particular ou às nações em geral.
- source_word: יִמָּלֵט
  choice: escapará
  rationale: O nifal de מלט pode significar escapar ou ser livrado. “Escapará” preserva a possibilidade de sair a salvo sem definir explicitamente o agente, que permanece implícito.
- source_word: כָּל הַנִּמְצָא כָּתוּב
  choice: todo aquele que for achado escrito
  rationale: Mantém a estrutura hebraica e a associação entre pertencimento ao povo e o registro no livro, ainda que a expressão seja deliberadamente solene.
- source_word: בַּסֵּפֶר
  choice: no livro
  rationale: סֵפֶר pode ser livro ou rolo. “Livro” é claro, tradicional e adequado ao motivo do registro celestial.
theological_decisions:
- issue: Natureza da ação de Miguel
  choice: Miguel “se levantará”, indicando que toma posição ou passa a agir
  alternative: Miguel “estará de pé” ou “se porá de pé”
  rationale: O hebraico admite uma leitura mais estática ou uma ação decisiva. “Se levantará” é adequada ao contexto apocalíptico, mas não define os pormenores da função celestial de Miguel.
- issue: Relação de Miguel com o povo
  choice: “está sobre os filhos do seu povo”
  alternative: “se coloca a favor dos filhos do seu povo” ou “protege os filhos do seu povo”
  rationale: A tradução principal conserva a preposição e a imagem do original, sem resolver se a relação é principalmente de proteção, representação ou autoridade.
- issue: Sentido de יִמָּלֵט
  choice: “escapará”, destacando a passagem segura pela angústia
  alternative: “será livrado”, com ênfase mais explícita no livramento recebido
  rationale: A forma hebraica permite ambos os matizes. A opção escolhida não restringe o versículo a uma formulação soteriológica específica nem exclui a ação divina implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a repetição de “naquele tempo”, a imagem formal de Miguel sobre o povo e a ambiguidade entre escapar e ser livrado. Os marcadores [a], [b] e [c] aparecem no texto principal junto aos termos correspondentes.
