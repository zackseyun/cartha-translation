base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/007.yaml
  text: 'These were the visions of my head as I lay on my bed: and behold[a], a tree in the midst of the earth, and its height was great.'
translation:
  language: pt
  text: 'Enquanto eu estava deitado em minha cama, eu via visões em minha mente[a]: eis uma árvore no meio da terra, e sua altura era grande.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aramaico, literalmente, “as visões da minha cabeça”. A expressão se refere ao que Nabucodonosor via interiormente no sonho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: contemplava as visões em minha mente[a]
  rationale: A expressão aramaica é literalmente “as visões da minha cabeça”. “Em minha mente” comunica em português atual que se trata de imagens vistas interiormente, enquanto a nota preserva o idioma original.
- source_word: עַל מִשְׁכְּבִי
  choice: Enquanto eu estava deitado em minha cama
  rationale: Expressa de modo natural em português a posição e a circunstância indicadas por “sobre o meu leito”.
- source_word: חָזֵה הֲוֵית
  choice: contemplava
  rationale: A construção perifrástica aramaica, literalmente “eu estava vendo”, indica uma ação em curso. “Contemplava” mantém o caráter visionário sem exigir uma formulação mecânica.
- source_word: וַאֲלוּ
  choice: eis que
  rationale: Preserva o marcador deíctico que introduz um elemento surpreendente ou digno de atenção na visão.
- source_word: אִילָן
  choice: uma árvore
  rationale: Equivalente direto do substantivo aramaico, com artigo indefinido por ser a primeira menção.
- source_word: בְּגוֹא אַרְעָא
  choice: no meio da terra
  rationale: Mantém o sentido espacial de “no meio” e traduz אַרְעָא por “terra”, adequado ao alcance amplo da visão.
- source_word: וְרוּמֵהּ שַׂגִּיא
  choice: e sua altura era grande
  rationale: Reproduz diretamente o substantivo “altura” com o sufixo possessivo e o predicado simples “grande”, sem intensificação indevida.
