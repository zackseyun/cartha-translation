id: DAN.4.22
reference: Daniel 4:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָ֣/ךְ טָֽרְדִ֣ין מִן אֲנָשָׁ֡/א וְ/עִם חֵיוַ֣ת בָּרָ/א֩ לֶהֱוֵ֨ה מְדֹרָ֜/ךְ וְ/עִשְׂבָּ֥/א כְ/תוֹרִ֣ין לָ֣/ךְ יְטַֽעֲמ֗וּן וּ/מִ/טַּ֤ל שְׁמַיָּ/א֙ לָ֣/ךְ מְצַבְּעִ֔ין וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עֲלָ֑/יךְ עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/022.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and you will be drenched with the dew of heaven, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: pt
  text: Você será expulso do convívio humano, e sua morada será com os animais do campo. Será obrigado a comer capim como os bois e ficará encharcado com o orvalho do céu. Sete tempos passarão sobre você[a], até que reconheça que o Altíssimo governa o reino dos homens[b] e o dá a quem ele quer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sete períodos”; muitos entendem a expressão como “sete anos”.
    reason: alternative_reading
  - marker: b
    text: “Reino dos homens” refere-se ao governo humano ou ao domínio da humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָרְדִין מִן אֲנָשָׁא
  choice: será expulso do convívio humano
  rationale: O plural ativo aramaico tem sujeito indefinido e é expresso naturalmente por uma construção passiva. “Do convívio humano” explicita a separação da sociedade humana sem alterar o contraste com a vida animal.
- source_word: חֵיוַת בָּרָא
  choice: os animais do campo
  rationale: Expressa os animais que vivem fora do espaço humano civilizado, preservando a imagem do campo com linguagem atual e digna.
- source_word: מְדֹרָךְ
  choice: sua morada
  rationale: Mantém o sentido concreto de lugar de habitação e o registro elevado do texto.
- source_word: עִשְׂבָּא כְתוֹרִין ... יְטַעֲמוּן
  choice: será obrigado a comer capim como os bois
  rationale: “Capim” é natural no contexto de bovinos pastando, e “será obrigado a comer” preserva a nuance causativa de algo imposto ao rei.
- source_word: מִטַּל שְׁמַיָּא ... מְצַבְּעִין
  choice: ficará encharcado com o orvalho do céu
  rationale: Reproduz vividamente a exposição ao orvalho e conserva a expressão elevada “do céu”.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sete tempos
  rationale: O termo aramaico designa tempos ou períodos sem definir por si só uma unidade calendárica exata; a formulação preserva essa ambiguidade.
- source_word: יַחְלְפוּן עֲלָיךְ
  choice: passarão sobre você
  rationale: Mantém a imagem pessoal do transcurso desses tempos sobre o rei, em vez de reduzir a expressão a simples duração abstrata.
- source_word: עַד דִּי תִנְדַּע
  choice: até que reconheça
  rationale: Embora o verbo signifique literalmente “saber/conhecer”, o contexto indica conhecimento adquirido pela experiência e reconhecimento da soberania divina.
- source_word: שַׁלִּיט עִלָּיָא
  choice: o Altíssimo governa
  rationale: “Altíssimo” preserva o título divino, e “governa” comunica de modo natural o exercício efetivo de domínio.
- source_word: מַלְכוּת אֲנָשָׁא
  choice: o reino dos homens
  rationale: Conserva a formulação concreta do aramaico e a ligação lexical com a humanidade da qual o rei será afastado; a nota esclarece seu alcance genérico.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: e o dá a quem ele quer
  rationale: Expressa de forma direta a liberdade soberana do Altíssimo na concessão do domínio humano.
theological_decisions:
- issue: Duração expressa por עִדָּנִין
  choice: sete tempos
  alternative: sete períodos; sete anos
  rationale: O aramaico não especifica inequivocamente anos. A tradução principal retém a indeterminação, enquanto a nota registra a interpretação comum sem impô-la ao texto.
- issue: Sentido de מַלְכוּת אֲנָשָׁא
  choice: reino dos homens
  alternative: governo humano; domínio da humanidade
  rationale: A escolha mantém a expressão do texto e sua tensão entre soberania divina e governo humano, sem restringi-la a um reino político específico.
- issue: Valor contextual de תִנְדַּע
  choice: reconheça
  alternative: saiba; conheça
  rationale: O juízo visa levar o rei ao reconhecimento experiencial da autoridade do Altíssimo; “reconheça” comunica essa força sem acrescentar uma formulação doutrinária externa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Preferiu-se “você” por clareza na fala direta ao rei, evitando formas regionais ou excessivamente arcaicas. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
