id: DAN.4.19
reference: Daniel 4:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אנתה ה֣וּא מַלְכָּ֔/א דִּ֥י רְבַ֖ית וּ/תְקֵ֑פְתְּ וּ/רְבוּתָ֤/ךְ רְבָת֙ וּ/מְטָ֣ת לִ/שְׁמַיָּ֔/א וְ/שָׁלְטָנָ֖/ךְ לְ/ס֥וֹף אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/019.yaml
  text: You are the king[a], who has grown great and strong; your greatness has become great and reached to heaven, and your dominion to the end of the earth.
translation:
  language: pt
  text: Tu és o rei que se tornou grande e forte; a tua grandeza cresceu e chegou até o céu, e o teu domínio, até os confins da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até o extremo da terra”.
    reason: Alternativa mais próxima da forma singular do aramaico.
lexical_decisions:
- source_word: אַנְתָּה הוּא
  choice: Tu és
  rationale: A combinação do pronome com o demonstrativo dá ênfase à identificação. “Tu és” é direta, natural e conserva essa ênfase sem tornar a frase pesada.
- source_word: מַלְכָּא
  choice: o rei
  rationale: A forma determinada identifica Nabucodonosor como o rei representado pela árvore; não funciona aqui primariamente como vocativo.
- source_word: דִּי רְבַית וּתְקֵפְתְּ
  choice: que se tornou grande e forte
  rationale: Os dois verbos descrevem a ascensão do rei em grandeza e poder. A formulação mantém o desenvolvimento expresso no aramaico.
- source_word: וּרְבוּתָךְ רְבָת
  choice: a tua grandeza cresceu
  rationale: “Grandeza” preserva a ligação lexical com a raiz רבה, enquanto “cresceu” reproduz de modo natural o aumento indicado pelo verbo.
- source_word: וּמְטָת לִשְׁמַיָּא
  choice: e chegou até o céu
  rationale: O verbo indica alcançar ou chegar. “Céu” é uma forma portuguesa natural para o plural aramaico idiomático.
- source_word: וְשָׁלְטָנָךְ
  choice: e o teu domínio
  rationale: “Domínio” expressa a autoridade governante e mantém o registro régio característico de Daniel.
- source_word: לְסוֹף אַרְעָא
  choice: até os confins da terra
  rationale: A expressão portuguesa idiomática comunica o alcance extremo do governo. A alternativa mais formalmente singular é preservada em nota.
theological_decisions:
- issue: Extensão do governo do rei
  choice: linguagem régia de alcance universal, vertida como “até os confins da terra”
  alternative: controle político estritamente global ou, em contraste, alcance apenas local do império
  rationale: A tradução conserva a afirmação abrangente e sua força hiperbólica sem definir além do texto a extensão histórica exata do domínio.
translation_notes:
  register: Português atual, digno e acessível, com construção compreensível no Brasil e no espaço lusófono. A repetição da ideia de grandeza foi mantida sem produzir uma formulação artificial; a elipse antes de “até os confins” evita repetir o verbo e continua clara.
