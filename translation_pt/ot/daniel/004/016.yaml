id: DAN.4.16
reference: Daniel 4:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱדַ֨יִן דָּֽנִיֵּ֜אל דִּֽי שְׁמֵ֣/הּ בֵּלְטְשַׁאצַּ֗ר אֶשְׁתּוֹמַם֙ כְּ/שָׁעָ֣ה חֲדָ֔ה וְ/רַעְיֹנֹ֖/הִי יְבַהֲלֻנֵּ֑/הּ עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר בֵּלְטְשַׁאצַּר֙ חֶלְמָ֤/א וּ/פִשְׁרֵ/א֙ אַֽל יְבַהֲלָ֔/ךְ עָנֵ֤ה בֵלְטְשַׁאצַּר֙ וְ/אָמַ֔ר מרא/י חֶלְמָ֥/א ל/שנאי/ך וּ/פִשְׁרֵ֥/הּ ל/ערי/ך־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/016.yaml
  text: Then Daniel[a], whose name was Belteshazzar, was appalled for about an hour, and his thoughts terrified him. The king answered and said, “Belteshazzar, do not let the dream or its interpretation terrify you.” Belteshazzar answered and said, “My lord, may the dream be for those who hate you[b], and its interpretation for your enemies.”
translation:
  language: pt
  text: 'Então Daniel, cujo nome era Beltessazar, ficou estarrecido[a] por cerca de uma hora[b], e seus pensamentos o apavoraram. O rei tomou a palavra e disse: “Beltessazar, não deixe que o sonho ou sua interpretação o apavorem”. Beltessazar respondeu: “Meu senhor, que o sonho seja para os que odeiam o senhor, e sua interpretação, para os seus inimigos!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou atônito” ou “ficou chocado”. O verbo aramaico pode descrever alguém que, abalado, fica sem reação; neste contexto, indica consternação.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por uma hora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e claro em português.
- source_word: דָּנִיֵּאל דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: Daniel, cujo nome era Beltessazar
  rationale: Mantém a identificação explicativa de Daniel por seu nome babilônico e se ajusta à narrativa no passado.
- source_word: אֶשְׁתּוֹמַם
  choice: ficou estarrecido
  rationale: Expressa o choque que deixa alguém momentaneamente sem reação; o contexto indica consternação, não mera surpresa.
- source_word: כְּשָׁעָה חֲדָה
  choice: por cerca de uma hora
  rationale: Reproduz a duração aproximada indicada pela construção aramaica sem tornar a expressão excessivamente mecânica.
- source_word: וְרַעְיֹנֹהִי
  choice: e seus pensamentos
  rationale: Equivalente direto e corrente para as reflexões mentais de Daniel.
- source_word: יְבַהֲלֻנֵּהּ / יְבַהֲלָךְ
  choice: o apavoraram / o apavorem
  rationale: Preserva a repetição da mesma raiz aramaica e sua forte ideia de medo e perturbação.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: O rei tomou a palavra e disse
  rationale: Transmite com naturalidade a fórmula semítica de introdução à fala sem omitir sua função discursiva.
- source_word: חֶלְמָא וּפִשְׁרֵא אַל יְבַהֲלָךְ
  choice: não deixe que o sonho ou sua interpretação o apavorem
  rationale: O uso de “ou” apresenta cada elemento como possível causa do temor e produz uma construção idiomática em português.
- source_word: מָרִי
  choice: Meu senhor
  rationale: Mantém o tratamento respeitoso dirigido ao rei, sem sugerir aqui um título divino.
- source_word: לְשָׂנְאָיִךְ
  choice: para os que odeiam o senhor
  rationale: Conserva a formulação de desejo e o referente humano do sufixo de segunda pessoa, usando tratamento respeitoso em português.
- source_word: וּפִשְׁרֵהּ לְעָרָיִךְ
  choice: e sua interpretação, para os seus inimigos
  rationale: Mantém o paralelismo entre o sonho e sua interpretação, bem como entre os que odeiam o rei e seus inimigos.
theological_decisions:
- issue: Tratamento מָרִי dirigido a Nabucodonosor
  choice: Meu senhor
  alternative: Meu mestre; Senhor
  rationale: Trata-se de uma forma humana de deferência no ambiente da corte. A tradução preserva o respeito sem converter a expressão em título divino.
- issue: Desejo de que o sonho recaia sobre os inimigos do rei
  choice: que o sonho seja para os que odeiam o senhor
  alternative: que o sonho se cumpra nos que odeiam o senhor
  rationale: A formulação escolhida preserva a concisão e certa abertura da preposição aramaica, sem explicitar além do texto se Daniel deseja o cumprimento ou apenas a aplicação do sonho aos inimigos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Beltessazar” segue a forma tradicional portuguesa. O rei se dirige a Daniel por “você” implícito nas formas verbais, enquanto Daniel emprega “meu senhor” e repete “o senhor” para manter a deferência cortesã e evitar a ambiguidade regional de “te” ou “vós”.
