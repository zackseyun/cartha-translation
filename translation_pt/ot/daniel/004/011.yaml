  source_fidelity: 'A tradução representa com precisão a proclamação aramaica: o chamado em voz forte, a sequência de imperativos contra a árvore e o jussivo relativo aos animais. «Cortem a árvore» é uma tradução aceitável de גֹּדּוּ, e «decepem os seus galhos» reproduz adequadamente o corte/separação expresso pelo segundo imperativo. A elipse verbal na cláusula das aves é mantida sem obscurecer o sentido.'
  naturalness: O português é claro, moderno e de leitura natural no Brasil e em outros contextos lusófonos. «Clamou em alta voz», «arranquem sua folhagem» e «Que os animais fujam» preservam o tom solene e vigoroso da visão. A vírgula em «e as aves, dos seus galhos» comunica de modo compreensível o verbo subentendido.
  terminology: «Árvore», «galhos», «folhagem», «frutos», «animais» e «aves» são escolhas exatas e apropriadas ao registro. Não há termos teológicos controversos nem nomes próprios neste versículo.
