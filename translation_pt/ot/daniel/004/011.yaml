source:
  edition: WLC
  text: קָרֵ֨א בְ/חַ֜יִל וְ/כֵ֣ן אָמַ֗ר גֹּ֤דּוּ אִֽילָנָ/א֙ וְ/קַצִּ֣צוּ עַנְפ֔וֹ/הִי אַתַּ֥רוּ עָפְיֵ֖/הּ וּ/בַדַּ֣רוּ אִנְבֵּ֑/הּ תְּנֻ֤ד חֵֽיוְתָ/א֙ מִן תַּחְתּ֔וֹ/הִי וְ/צִפְּרַיָּ֖/א מִן עַנְפֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/011.yaml
  text: 'He cried aloud and said thus: ‘Chop down the tree[a], and cut off its branches; strip off its foliage, and scatter its fruit. Let the beasts flee from beneath it[b], and the birds from its branches.’'
translation:
  language: pt
  text: 'Ele clamou em alta voz e disse assim: “Cortem a árvore[a] e decepem os seus galhos; arranquem sua folhagem e espalhem seus frutos. Que os animais fujam de debaixo dela[b], e as aves, dos seus galhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Derrubem a árvore”.'
    reason: lexical_alternative
  - marker: b
    text: A oração final é elíptica em aramaico; entende-se que também as aves devem fugir dos galhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרֵא בְחַיִל
  choice: clamou em alta voz
  rationale: Expressa o chamado forte e audível do original em português natural e digno.
- source_word: וְכֵן אָמַר
  choice: e disse assim
  rationale: Preserva a fórmula que introduz o conteúdo da proclamação.
- source_word: גֹּדּוּ אִילָנָא
  choice: Cortem a árvore
  rationale: Mantém a imagem concreta do corte e a força do imperativo; a nota registra a possibilidade contextual de explicitar o resultado, isto é, derrubá-la.
- source_word: וְקַצִּצוּ עַנְפוֹהִי
  choice: e decepem os seus galhos
  rationale: “Decepar” comunica o corte e a separação dos galhos, distinguindo este comando do corte da árvore inteira.
- source_word: אַתַּרוּ עָפְיֵהּ
  choice: arranquem sua folhagem
  rationale: Traduz a remoção vigorosa da cobertura de folhas sem reduzir o termo coletivo a folhas isoladas.
- source_word: וּבַדַּרוּ אִנְבֵּהּ
  choice: e espalhem seus frutos
  rationale: Reproduz diretamente a dispersão dos frutos ordenada no texto.
- source_word: תְּנֻד חֵיוְתָא מִן תַּחְתּוֹהִי
  choice: Que os animais fujam de debaixo dela
  rationale: O jussivo é expresso com clareza; “fujam” comunica o afastamento súbito no contexto da destruição da árvore.
- source_word: וְצִפְּרַיָּא מִן עַנְפוֹהִי
  choice: e as aves, dos seus galhos
  rationale: A elipse verbal do aramaico é preservada de modo natural em português, com “fujam” subentendido.
theological_decisions:
- issue: Força imperativa e jussiva da proclamação
  choice: Traduzir diretamente os imperativos e usar “Que ... fujam” no jussivo, deixando o verbo elíptico na oração sobre as aves
  alternative: Repetir explicitamente “que as aves fujam dos seus galhos”
  rationale: A construção mantém a sequência de ordens e conserva, sem perda de sentido, a elipse presente no aramaico; não acrescenta interpretação teológica.
translation_notes:
  register: Português moderno, claro e solene, com formas compreensíveis internacionalmente e boa legibilidade brasileira. A pontuação conserva o paralelismo e a progressão vigorosa das ordens.
