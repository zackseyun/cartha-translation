base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/033.yaml
  text: At that time my reason returned to me[a], and for the glory of my kingdom, my majesty and splendor returned to me. My counselors and my nobles sought me, and I was reestablished over my kingdom[c][b], and surpassing greatness was added to me.
translation:
  language: pt
  text: Naquele momento, minha razão voltou a mim[a] e, para a glória do meu reino, minha majestade e meu esplendor voltaram a mim. Meus conselheiros e meus nobres[b] me procuraram; fui restabelecido no governo do meu reino[c], e uma grandeza ainda maior me foi acrescentada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu entendimento”, em vez de “minha razão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “meus assessores e meus homens importantes”.
    reason: lexical_alternative
  - marker: c
    text: Ou “fui restaurado” ou “fui confirmado no governo do meu reino”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: Naquele momento
  rationale: Expressa naturalmente a indicação temporal aramaica e mantém a sequência narrativa sem definir uma duração específica.
- source_word: מַנְדְּעִי
  choice: minha razão
  rationale: No contexto da recuperação de Nabucodonosor, designa sua capacidade racional ou entendimento restaurado; a alternativa lexical é registrada em nota.
- source_word: יְתוּב עֲלַי
  choice: voltou a mim
  rationale: Preserva o sentido básico de retorno e também a repetição verbal presente no aramaico.
- source_word: לִיקַר מַלְכוּתִי
  choice: para a glória do meu reino
  rationale: Mantém a relação expressa pela preposição e o valor régio de יְקָר, sem explicar além do que o texto afirma.
- source_word: הַדְרִי וְזִוִי
  choice: minha majestade e meu esplendor
  rationale: Reproduz o par de termos ligados à dignidade, imponência e aparência régias.
- source_word: הַדָּבְרַי וְרַבְרְבָנַי
  choice: meus conselheiros e meus nobres
  rationale: Usa termos atuais e dignos para os assessores do rei e os homens de alta posição do reino.
- source_word: יְבַעוֹן
  choice: me procuraram
  rationale: Traduz diretamente o sentido de buscar ou procurar, sem acrescentar a ideia mais específica de consultar.
- source_word: עַל מַלְכוּתִי הָתְקְנַת
  choice: fui restabelecido sobre o meu reino
  rationale: Comunica que o rei foi novamente colocado de modo firme em sua posição de governo, preservando a formulação passiva.
- source_word: רְבוּ יַתִּירָה
  choice: uma grandeza ainda maior
  rationale: Expressa em português natural a força intensificadora ou comparativa do adjetivo aramaico.
- source_word: הוּסְפַת לִי
  choice: me foi acrescentada
  rationale: Mantém a voz passiva e a noção de que o aumento lhe veio de fora, sem explicitar um agente não nomeado no versículo.
theological_decisions:
- issue: Agência divina na restauração e exaltação do rei
  choice: Manter as formulações passivas — “fui restabelecido” e “me foi acrescentada” — sem inserir “por Deus”.
  alternative: Explicitar Deus como agente da restauração.
  rationale: O contexto atribui os acontecimentos ao Altíssimo, mas este versículo não nomeia diretamente o agente; a tradução preserva essa implicitude.
- issue: Natureza daquilo que voltou ao rei
  choice: Traduzir מַנְדְּעִי por “minha razão”, com “meu entendimento” em nota.
  alternative: Traduzir diretamente por “meu entendimento”.
  rationale: “Razão” se ajusta à recuperação da capacidade mental no contexto, enquanto a nota conserva a amplitude lexical do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “voltou a mim” foi preservada por corresponder à estrutura enfática do aramaico. As passivas conservam a agência implícita do texto-fonte.
