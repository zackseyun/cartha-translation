  text: לָהֵ֣ן מַלְכָּ֗/א מִלְכִּ/י֙ יִשְׁפַּ֣ר עלי/ך ו/חטי/ך בְּ/צִדְקָ֣ה פְרֻ֔ק וַ/עֲוָיָתָ֖/ךְ בְּ/מִחַ֣ן עֲנָ֑יִן הֵ֛ן תֶּהֱוֵ֥א אַרְכָ֖ה לִ/שְׁלֵוְתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/024.yaml
  text: 'Therefore[a], O king, let my counsel be acceptable to you: break off your sins by righteousness, and your iniquities by showing mercy to the poor[b], that there may perhaps be a prolonging of your prosperity.'
translation:
  language: pt
  text: 'Portanto, ó rei, que o meu conselho lhe seja agradável: rompa com os seus pecados praticando a justiça e com as suas iniquidades mostrando misericórdia para com os pobres. Talvez a sua prosperidade se prolongue[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou: “a sua tranquilidade” ou “a sua paz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  choice: Portanto
  rationale: Marca naturalmente a conclusão que Daniel tira da interpretação do sonho.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: Preserva o vocativo respeitoso e a solenidade do apelo dirigido ao rei.
- source_word: מִלְכִּי יִשְׁפַּר עֲלָיִךְ
  choice: aceite o meu conselho
  rationale: Expressa em português atual e respeitoso a ideia idiomática de que o conselho pareça bom ou seja aceitável ao rei.
- source_word: וְחֲטָיָךְ בְּצִדְקָה פְרֻק
  choice: rompa com os seus pecados praticando a justiça
  rationale: “Rompa com” conserva a imagem de cessação decisiva sem impor o sentido teológico de expiação; “praticando a justiça” torna explícito o caráter ativo de בְּצִדְקָה em português natural.
- source_word: וַעֲוָיָתָךְ
  choice: suas iniquidades
  rationale: Mantém a distinção lexical em relação a “pecados” e preserva o paralelismo solene.
- source_word: בְּמִחַן עֲנָיִן
  choice: mostrando misericórdia aos pobres
  rationale: Comunica de modo idiomático a ação compassiva em favor dos pobres ou aflitos.
- source_word: הֵן
  choice: Talvez
  rationale: Preserva a contingência da afirmação, evitando apresentá-la como promessa certa.
- source_word: תֶּהֱוֵא אַרְכָה לִשְׁלֵוְתָךְ
  choice: a sua prosperidade se prolongue
  rationale: Expressa com fluidez a ideia de prolongamento; “prosperidade” abrange o bem-estar e a segurança do rei, embora “tranquilidade” e “paz” também sejam possíveis.
theological_decisions:
- issue: Se a exortação ensina expiação meritória dos pecados ou arrependimento demonstrado por atos justos
  choice: Apelo para romper com o pecado mediante uma conduta justa e misericordiosa
  alternative: “Resgate os seus pecados pela justiça”, possivelmente entendido como expiação por boas obras ou esmolas
  rationale: O verbo פְרֻק admite a ideia de romper, livrar ou resgatar. O contexto favorece uma convocação ética à mudança concreta, mas a alternativa lexical é preservada em nota para não eliminar a ambiguidade do aramaico.
- issue: Se a continuação do bem-estar do rei é garantida
  choice: 'Possibilidade contingente: “Talvez”'
  alternative: Uma promessa certa de prolongamento da prosperidade
  rationale: הֵן introduz uma possibilidade, não uma garantia; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação direta “aceite o meu conselho” evita rigidez excessiva, enquanto “ó rei”, “iniquidades” e o paralelismo preservam o tom solene da fala cortesã.
