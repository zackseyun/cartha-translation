    rationale: “Passou a comer” acrescenta a ideia de início de um hábito, enquanto o texto descreve simplesmente que ele comia/comeu erva como os bois. “Capim” também tem uso mais marcadamente brasileiro; “erva” é mais internacional e próximo do campo semântico de עִשְׂבָּא.
  - severity: low
    issue: Formulação da nota lexical
    rationale: “Ou ‘dos abutres’” fica elíptico e pode soar como se substituísse apenas o complemento. Formular a alternativa comparativa completa torna o escopo da nota inequívoco.
