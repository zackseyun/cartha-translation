  text: בַּ/הּ שַׁעֲתָ֗/א מִלְּתָ/א֮ סָ֣פַת עַל נְבוּכַדְנֶצַּר֒ וּ/מִן אֲנָשָׁ֣/א טְרִ֔יד וְ/עִשְׂבָּ֤/א כְ/תוֹרִין֙ יֵאכֻ֔ל וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּ֥י שַׂעְרֵ֛/הּ כְּ/נִשְׁרִ֥ין רְבָ֖ה וְ/טִפְר֥וֹ/הִי כְ/צִפְּרִֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/030.yaml
  text: At that moment the word was fulfilled against Nebuchadnezzar. He was driven away from among men[a], and he ate grass like oxen, and his body was drenched with the dew of heaven, until his hair grew like eagles’ feathers and his nails like birds’ claws.
translation:
  language: pt
  text: Naquele mesmo instante, a palavra se cumpriu contra Nabucodonosor. Ele foi expulso do convívio humano e comeu erva como os bois. Seu corpo ficou encharcado pelo orvalho do céu, até que seus cabelos cresceram como as penas das águias[a], e suas unhas, como as garras das aves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como as penas dos abutres”. O termo aramaico pode designar, de modo mais amplo, grandes aves de rapina; “águias” é a tradução tradicional.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָא
  choice: Naquele mesmo instante
  rationale: Expressa com naturalidade a locução temporal aramaica e ressalta a execução imediata do juízo.
- source_word: מִלְּתָא סָפַת
  choice: a palavra se cumpriu
  rationale: Mantém o sentido amplo de מִלְּתָא, que pode indicar palavra, declaração ou assunto, sem restringi-lo indevidamente a uma sentença judicial; סָפַת indica que o pronunciamento chegou ao seu cumprimento.
- source_word: עַל נְבוּכַדְנֶצַּר
  choice: contra Nabucodonosor
  rationale: No contexto de juízo, 'contra' comunica claramente a força adversativa de עַל.
- source_word: וּמִן אֲנָשָׁא טְרִיד
  choice: Ele foi expulso do convívio humano
  rationale: Transmite a exclusão da sociedade humana de modo claro, atual e sem dar a entender que a referência seja apenas a homens do sexo masculino.
- source_word: וְעִשְׂבָּא כְתוֹרִין יֵאכֻל
  choice: passou a comer capim como os bois
  rationale: '''Capim'' e ''bois'' comunicam naturalmente a imagem do texto; ''passou a comer'' apresenta a ação resultante do afastamento sem perder o valor narrativo.'
- source_word: וּמִטַּל שְׁמַיָּא גִּשְׁמֵהּ יִצְטַבַּע
  choice: Seu corpo ficou encharcado com o orvalho do céu
  rationale: Reproduz a imagem vívida de o corpo ficar molhado ou ensopado pelo orvalho, preservando a expressão bíblica 'do céu'.
- source_word: שַׂעְרֵהּ כְּנִשְׁרִין רְבָה
  choice: seus cabelos cresceram como as penas das águias
  rationale: '''Cresceram'' expressa idiomaticamente רְבָה aplicado aos cabelos; ''águias'' conserva a leitura tradicional, enquanto a amplitude zoológica do termo é registrada em nota.'
- source_word: וְטִפְרוֹהִי כְצִפְּרִין
  choice: suas unhas, como as garras das aves
  rationale: A elipse de 'cresceram' é natural em português, e 'garras' torna explícita a imagem produzida pela comparação com aves.
theological_decisions:
- issue: Sentido antropológico de אֲנָשָׁא
  choice: do convívio humano
  alternative: dentre os homens
  rationale: O contraste é entre a sociedade humana e a condição bestial de Nabucodonosor, não entre sexos; a formulação escolhida preserva esse contraste sem acrescentar uma tese antropológica.
- issue: Natureza de מִלְּתָא
  choice: a palavra
  alternative: a sentença
  rationale: O termo pode designar palavra, assunto, decreto ou sentença. 'Palavra' preserva sua amplitude e remete ao pronunciamento divino anterior sem definir além do que o aramaico exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação longa do aramaico foi levemente segmentada para fluidez, sem alterar a sequência dos acontecimentos. O marcador [a] aparece imediatamente após o termo ao qual a alternativa lexical se refere.
