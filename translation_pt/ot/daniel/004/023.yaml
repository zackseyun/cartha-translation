    issue: «ficará assegurado para você»
    rationale: A expressão sugere que o reino será garantido ou reservado, enquanto קַיָּמָה, com לָךְ, afirma que o reino permanecerá/continuará sendo do destinatário.
  - severity: low
    issue: «disseram que se deixasse»
    rationale: A forma impessoal não reflete tão bem o plural ativo «disseram» seguido do infinitivo «deixar». «Disseram para deixar» é mais direto e natural.
  - severity: low
    issue: Âncora da nota em «raízes»
    rationale: A nota explica «Céu/céus», portanto a âncora deve acompanhar esse termo.
