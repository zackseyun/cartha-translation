  text: וְ/דִ֣י אֲמַ֗רוּ לְ/מִשְׁבַּ֞ק עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ דִּ֣י אִֽילָנָ֔/א מַלְכוּתָ֖/ךְ לָ֣/ךְ קַיָּמָ֑ה מִן דִּ֣י תִנְדַּ֔ע דִּ֥י שַׁלִּטִ֖ן שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/023.yaml
  text: And because they said to leave the stump of the tree with its roots[a], your kingdom will remain yours from the time that you know that Heaven rules.
translation:
  language: pt
  text: E, visto que disseram para deixar o toco da árvore com suas raízes, seu reino continuará sendo seu a partir do momento em que você reconhecer que o Céu[a] governa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os céus governam”. O aramaico emprega “céus” como expressão reverencial para a autoridade soberana de Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִי
  choice: E, visto que
  rationale: Introduz uma oração explicativa com valor causal ligada à ordem mencionada no versículo anterior.
- source_word: אֲמַרוּ לְמִשְׁבַּק
  choice: disseram que se deixasse
  rationale: Preserva o verbo ativo no plural, que pode ter sentido impessoal, e expressa naturalmente em português o conteúdo da ordem.
- source_word: עִקַּר שָׁרְשׁוֹהִי דִּי אִילָנָא
  choice: o tronco da árvore com suas raízes
  rationale: A expressão designa a base remanescente da árvore derrubada e seu sistema de raízes; 'tronco ... com suas raízes' mantém clara a imagem.
- source_word: מַלְכוּתָךְ לָךְ קַיָּמָה
  choice: seu reino ficará assegurado para você
  rationale: קַיָּמָה indica que o reino permanecerá firme e reservado ao rei para posterior restauração; a formulação conserva o dativo לָךְ.
- source_word: מִן דִּי תִנְדַּע
  choice: quando reconhecer
  rationale: A locução assinala o momento a partir do qual a restauração se efetiva, e o contexto dá a 'saber' o sentido de chegar a reconhecer.
- source_word: שַׁלִּטִן שְׁמַיָּא
  choice: o Céu governa
  rationale: Mantém a metonímia reverencial aramaica para a autoridade soberana de Deus sem substituí-la explicitamente por 'Deus'.
theological_decisions:
- issue: Se שְׁמַיָּא deve ser traduzido literalmente como plural ou como metonímia reverencial
  choice: o Céu governa
  alternative: os céus governam
  rationale: No contexto de Daniel, 'Céu' funciona como modo reverencial de falar da soberania divina. O singular com inicial maiúscula preserva essa figura sem resolver a expressão em 'Deus governa'.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita arcaísmos e mantém a imagem arbórea e a metonímia teológica do aramaico.
