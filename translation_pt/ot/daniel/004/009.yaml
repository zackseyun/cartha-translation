  text: עָפְיֵ֤/הּ שַׁפִּיר֙ וְ/אִנְבֵּ֣/הּ שַׂגִּ֔יא וּ/מָז֨וֹן לְ/כֹ֖לָּ/א בֵ֑/הּ תְּחֹת֜וֹ/הִי תַּטְלֵ֣ל חֵיוַ֣ת בָּרָ֗/א וּ/בְ/עַנְפ֨וֹ/הִי֙ ידרון צִפֲּרֵ֣י שְׁמַיָּ֔/א וּ/מִנֵּ֖/הּ יִתְּזִ֥ין כָּל בִּשְׂרָֽ/א־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/009.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field found shade, and in its branches the birds of the heavens dwelt, and from it all flesh was fed.
translation:
  language: pt
  text: Sua folhagem era bela, e seu fruto, abundante; nele havia alimento para todos. Debaixo dele, os animais do campo encontravam sombra; em seus galhos, as aves do céu moravam; e dele se alimentava toda carne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seres vivos”. O aramaico diz literalmente “toda carne”, expressão bíblica que pode designar o conjunto dos seres animados.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: sua folhagem
  rationale: O termo aramaico designa coletivamente a cobertura de folhas da árvore; “folhagem” é natural e preciso em português.
- source_word: שַׁפִּיר
  choice: bela
  rationale: Expressa a beleza ou boa aparência da folhagem em linguagem atual e digna.
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: seu fruto, abundante
  rationale: “Fruto” traduz diretamente o produto da árvore, e “abundante” comunica a grande quantidade indicada por שַׂגִּיא.
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: nele havia alimento para todos
  rationale: Mantém a afirmação ampla do original sem especificar antecipadamente quem está incluído em “todos”.
- source_word: תַּטְלֵל
  choice: encontravam sombra
  rationale: O verbo está ligado à ideia de ficar à sombra ou abrigar-se; esta formulação é clara e idiomática em português.
- source_word: חֵיוַת בָּרָא
  choice: os animais do campo
  rationale: Preserva a expressão bíblica referente aos animais terrestres que vivem no campo ou em espaço aberto.
- source_word: בְעַנְפוֹהִי ידרון
  choice: em seus galhos, as aves do céu moravam
  rationale: “Galhos” é acessível e natural; “moravam” preserva o sentido amplo de habitar ou permanecer, sem restringi-lo à construção de ninhos.
- source_word: כָּל בִּשְׂרָא
  choice: toda carne
  rationale: Conserva literalmente o idioma bíblico e sua textura intertextual, deixando a equivalência semântica mais explícita para a nota.
theological_decisions:
- issue: Tradução do idioma כָּל בִּשְׂרָא
  choice: toda carne
  alternative: todos os seres vivos
  rationale: A forma literal preserva um idioma bíblico teologicamente evocativo e não reduz seu alcance interpretativo; a nota esclarece que, no contexto, a expressão abrange os seres animados.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção mantém o paralelismo descritivo do aramaico, com pontuação que favorece clareza e fluidez. O marcador foi colocado junto a “toda carne”, expressão à qual a nota se refere.
