base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/004.yaml
  text: Then the magicians[a], enchanters, Chaldeans, and diviners came in, and I told the dream before them[b], but they did not make its interpretation known to me.
translation:
  language: pt
  text: Então entraram os magos, os encantadores, os caldeus[a] e os adivinhos. Contei o sonho diante deles, mas eles não me deram a conhecer a interpretação do sonho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “caldeus” pode designar não apenas um grupo étnico, mas também uma classe de especialistas da corte babilônica.
    reason: cultural_note
  - marker: b
    text: 'Ou: “não conseguiram me dar a conhecer a interpretação do sonho”. O aramaico diz diretamente que eles não a deram a conhecer; a incapacidade é uma inferência do contexto, refletida em algumas traduções.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e fiel ao aramaico.
- source_word: עללין
  choice: entraram
  rationale: Expressa diretamente a entrada ou apresentação dos especialistas no ambiente da corte.
- source_word: חַרְטֻמַיָּא
  choice: magos
  rationale: Equivalente tradicional e compreensível para essa classe de sábios ligada às artes secretas.
- source_word: אָשְׁפַיָּא
  choice: encantadores
  rationale: Distingue esta classe dos demais especialistas e corresponde ao campo de práticas mágicas ou mânticas.
- source_word: כשדי/א
  choice: caldeus
  rationale: Preserva o termo étnico/técnico do texto, que neste contexto pode designar uma classe de especialistas da corte.
- source_word: גָזְרַיָּא
  choice: adivinhos
  rationale: Designa com clareza os praticantes de adivinhação mencionados na lista.
- source_word: חֶלְמָא
  choice: o sonho
  rationale: O estado enfático e o contexto indicam o sonho específico do rei.
- source_word: אָמַר אֲנָה קֳדָמֵיהוֹן
  choice: Contei o sonho diante deles
  rationale: Mantém a ideia de relatar o sonho na presença deles, sem produzir uma formulação artificial em português.
- source_word: וּפִשְׁרֵהּ
  choice: a sua interpretação
  rationale: Conserva o sentido técnico recorrente de פשר em Daniel para a interpretação de sonhos e mistérios.
- source_word: לָא מְהוֹדְעִין לִי
  choice: não me deram a conhecer
  rationale: Reproduz o causativo 'fazer conhecer' e não acrescenta explicitamente uma incapacidade que o aramaico apenas pode sugerir pelo contexto.
theological_decisions:
- issue: Se a oração final deve declarar incapacidade ou apenas a não comunicação da interpretação
  choice: não me deram a conhecer
  alternative: não conseguiram me dar a conhecer
  rationale: O aramaico nega o ato de tornar conhecido, sem empregar um verbo explícito de capacidade. A tradução mantém essa reserva, enquanto a nota registra a inferência contextual possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da lista e a distinção entre as classes de especialistas foram preservadas. As notas do material inglês foram realinhadas aos termos a que efetivamente se referem.
