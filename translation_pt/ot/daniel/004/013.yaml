  text: לִבְבֵ/הּ֙ מִן אנוש/א יְשַׁנּ֔וֹן וּ/לְבַ֥ב חֵיוָ֖ה יִתְיְהִ֣ב לֵ֑/הּ וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/013.yaml
  text: Let his heart be changed from that of a man[a], and let the heart of a beast be given to him, and let seven times pass over him.
translation:
  language: pt
  text: Que o coração dele seja mudado, para que deixe de ser humano, e que lhe seja dado o coração de um animal; e que sete tempos[a] passem sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sete períodos” ou “sete estações”. O termo aramaico indica tempos ou períodos determinados; sua duração exata não é especificada aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְבֵהּ מִן אֱנוֹשָׁא
  choice: o coração dele deixe de ser humano
  rationale: לְבַב designa o coração como centro interior do pensamento e da disposição. A formulação preserva a metáfora concreta e expressa em português natural a mudança do coração humano.
- source_word: יְשַׁנּוֹן
  choice: deixe de ser
  rationale: O plural aramaico tem sentido impessoal. A construção portuguesa evita indicar um agente não expresso e comunica naturalmente a mudança sofrida.
- source_word: וּלְבַב חֵיוָה
  choice: coração de animal
  rationale: חֵיוָה designa um animal ou fera. “Animal” é claro, atual e não acrescenta a ideia específica de ferocidade.
- source_word: יִתְיְהִב לֵהּ
  choice: lhe seja dado
  rationale: Mantém a voz passiva do aramaico e não identifica além do texto quem realiza a ação.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sete tempos
  rationale: עִדָּן indica tempos ou períodos determinados, mas o versículo não define sua duração exata. “Tempos” preserva essa abertura.
- source_word: יַחְלְפוּן עֲלֹוהִי
  choice: passem sobre ele
  rationale: Reproduz de modo inteligível a imagem aramaica de períodos que passam sobre a pessoa.
theological_decisions:
- issue: Natureza da mudança imposta ao rei
  choice: Preservar a imagem de o coração humano ser substituído por um coração de animal
  alternative: Explicitar uma metamorfose física ou interpretar a mudança como loucura/perturbação mental
  rationale: O aramaico não resolve neste versículo se a descrição é transformação literal ou condição mental semelhante à de um animal. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “coração” conserva a imagem central do aramaico; “lhe seja dado” mantém a passiva sem introduzir um agente.
