base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/028.yaml
  text: 'While the word was still in the king’s mouth[a], a voice fell from heaven: “To you it is said, King Nebuchadnezzar, the kingdom has departed from you.”'
translation:
  language: pt
  text: 'Enquanto a palavra ainda estava na boca do rei, uma voz caiu do céu: “A você se diz, ó rei Nabucodonosor: o reino se afastou de você[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o reino foi tirado de você”.'
    reason: Alternativa lexical que explicita a perda do poder régio como remoção, sentido possível no contexto.
lexical_decisions:
- source_word: עוֹד מִלְּתָא בְּפֻם מַלְכָּא
  choice: Enquanto a palavra ainda estava na boca do rei
  rationale: Preserva a imagem aramaica da palavra ainda na boca do rei e expressa com naturalidade a ação em curso no momento da interrupção.
- source_word: קָל מִן שְׁמַיָּא נְפַל
  choice: uma voz veio do céu
  rationale: קָל é uma voz articulada, como mostra o discurso seguinte. Embora נְפַל signifique literalmente “caiu”, em português “veio do céu” comunica de modo natural o movimento de origem celeste sem sugerir uma queda acidental.
- source_word: לָךְ אָמְרִין
  choice: A você se diz
  rationale: A construção plural tem sentido impessoal semelhante ao passivo. Esta formulação conserva o tom solene do anúncio e destaca o destinatário.
- source_word: נְבוּכַדְנֶצַּר מַלְכָּא
  choice: ó rei Nabucodonosor
  rationale: A partícula vocativa “ó” torna explícito o tratamento direto e mantém o registro solene; a ordem título-nome é natural em português.
- source_word: מַלְכוּתָה
  choice: o reino
  rationale: O substantivo designa o domínio ou poder régio de Nabucodonosor; “reino” é claro, tradicional e adequado ao contexto.
- source_word: עֲדָת מִנָּךְ
  choice: se afastou de você
  rationale: Reproduz o valor básico de separação do verbo e da preposição, sem decidir no texto principal se a expressão salienta apenas a perda ou a ação divina de retirar o reino.
theological_decisions:
- issue: Sentido de “céu” no anúncio
  choice: do céu
  alternative: dos céus; do firmamento
  rationale: O contexto é um anúncio de juízo divino. “Do céu” preserva essa ressonância teológica sem reduzir a expressão ao céu físico.
- issue: Agência na perda do reino
  choice: o reino se afastou de você
  alternative: o reino foi tirado de você
  rationale: A forma aramaica descreve o reino como tendo passado ou se afastado do rei, enquanto o contexto implica juízo divino. O texto principal mantém a forma menos explícita, e a nota registra a leitura passiva possível sem impor uma especificação além da expressão original.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A imagem “a palavra ainda estava na boca do rei” foi mantida; o movimento literal da voz que “caiu” foi vertido de modo idiomático como “veio do céu”. O marcador [a] foi colocado junto à expressão a que a alternativa se refere.
