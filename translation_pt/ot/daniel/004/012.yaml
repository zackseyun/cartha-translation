  text: בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶֽ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֤ל שְׁמַיָּ/א֙ יִצְטַבַּ֔ע וְ/עִם חֵיוְתָ֥/א חֲלָקֵ֖/הּ בַּ/עֲשַׂ֥ב אַרְעָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/012.yaml
  text: Nevertheless[a], leave the stump of its roots in the earth, even with a band of iron and bronze in the grass of the field; and let him be drenched with the dew of heaven, and let his portion be with the beasts in the grass of the earth.
translation:
  language: pt
  text: Mas deixem no solo o toco das suas raízes, com uma cinta de ferro e bronze, entre a relva do campo. Que ele seja molhado pelo orvalho do céu, e que sua porção seja com os animais, entre a vegetação da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com uma corrente de ferro e bronze”. O termo aramaico pode indicar uma cinta que envolve o toco ou um objeto que prende e restringe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Mas
  rationale: Partícula adversativa que introduz a exceção à ordem de derrubar a árvore; “Mas” é direto, natural e preserva o contraste.
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: o toco com suas raízes
  rationale: Designa a base enraizada que permanece depois de a árvore ser cortada. A formulação conserva tanto o toco visível quanto as raízes.
- source_word: בְּאַרְעָא שְׁבֻקוּ
  choice: deixem na terra
  rationale: O imperativo plural é mantido, e “na terra” expressa o sentido local de permanecer no solo.
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: preso com uma cinta de ferro e bronze
  rationale: אֱסוּר pode indicar algo que prende ou restringe. “Cinta” se ajusta à imagem do toco circundado, enquanto “preso” explicita sua função sem eliminar a alternativa de uma corrente ou grilhão.
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: no capim do campo
  rationale: Expressa de modo corrente a vegetação rasteira do campo aberto.
- source_word: וּבְטַל שְׁמַיָּא יִצְטַבַּע
  choice: Que ele seja molhado pelo orvalho do céu
  rationale: Mantém a forma passiva e a mudança intencional para o referente pessoal. “Molhado” traduz com clareza o efeito do orvalho sem intensificar indevidamente o verbo.
- source_word: וְעִם חֵיוְתָא חֲלָקֵהּ
  choice: que sua porção seja com os animais
  rationale: “Porção” conserva o sentido de parte, sorte ou quinhão e o tom solene do decreto. “Animais” é amplo e natural, sem pressupor domesticação.
- source_word: בַּעֲשַׂב אַרְעָא
  choice: entre a vegetação da terra
  rationale: “Vegetação” representa o termo mais amplo para plantas ou erva e evita uma repetição portuguesa pouco natural de “capim da terra”.
theological_decisions:
- issue: Mudança da imagem da árvore para o referente pessoal
  choice: 'Manter o pronome pessoal: “Que ele seja molhado... que sua porção seja...”'
  alternative: 'Conservar a referência impessoal à árvore: “Que isso seja molhado...”'
  rationale: O aramaico passa do sufixo referente ao toco para formas masculinas pessoais, antecipando o rei simbolizado pela árvore. Preservar essa mudança mantém a tensão e a lógica da visão.
- issue: Natureza da restrição de ferro e bronze
  choice: Representá-la como uma cinta que prende o toco, registrando outra possibilidade em nota
  alternative: Entendê-la diretamente como corrente, grilhão ou algema aplicada ao homem
  rationale: O termo aramaico permite uma faixa que envolve o toco ou um instrumento de restrição pessoal. A imagem imediata favorece “cinta”, mas a transição para o rei impede que a outra leitura seja excluída.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem do aramaico foi moderadamente ajustada para fluidez. O pronome “ele” preserva a passagem deliberada da árvore para a pessoa simbolizada.
