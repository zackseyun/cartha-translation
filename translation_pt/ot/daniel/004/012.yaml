revisions:
- from: Mas deixem na terra o toco com suas raízes, preso com uma cinta de ferro e bronze, no capim do campo. Que ele seja molhado pelo orvalho do céu, e que sua porção seja com os animais, entre a vegetação da terra.[a]
  to: Mas deixem no solo o toco das suas raízes, com uma cinta de ferro e bronze, entre a relva do campo. Que ele seja molhado pelo orvalho do céu, e que sua porção seja com os animais, entre a vegetação da terra.[a]
  rationale: A revisão elimina a explicitação interpretativa de «preso», preservando a ambiguidade de אֱסוּר entre uma faixa em torno do toco e um meio de restrição. Também torna mais exata a relação «toco das suas raízes», sem alterar a mudança intencional para o referente pessoal em «ele» e «sua porção».
