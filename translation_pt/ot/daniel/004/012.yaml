review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a adversativa, o imperativo plural, a passagem da imagem do toco ao referente pessoal e os elementos do orvalho, dos animais e da vegetação. Contudo, «preso» torna explícita uma função da cinta que o aramaico deixa mais aberta; a construção deve conservar essa ambiguidade, conforme a nota lexical.
  naturalness: O texto é claro e de registro apropriado. «Deixem no solo o toco das suas raízes» e «entre a relva do campo» soam naturais em português moderno e exprimem com maior precisão a localização e a imagem vegetal. A frase final permanece deliberadamente concisa, como no decreto aramaico.
  terminology: «Cinta de ferro e bronze» é uma boa representação imagética de אֱסוּר e a nota preserva a possibilidade de um instrumento de contenção. «Relva» evita a conotação regional ou específica de «capim», sem perder o sentido de erva/vegetação rasteira.
  issues:
  - severity: medium
    issue: «preso com uma cinta» explicita a função da cinta.
    rationale: וּבֶאֱסוּר significa literalmente algo como «com/em uma atadura, ligação ou contenção». Embora a imagem possa sugerir que o toco esteja preso, o verbo ou particípio «preso» não está expresso e limita uma ambiguidade que a nota corretamente reconhece.
  - severity: low
    issue: «o toco com suas raízes» é menos preciso que uma construção genitiva.
    rationale: A expressão aramaica designa o toco/base das raízes. «O toco das suas raízes» preserva melhor a relação entre o toco remanescente e o sistema radicular.
  revised_text: Mas deixem no solo o toco das suas raízes, com uma cinta de ferro e bronze, entre a relva do campo. Que ele seja molhado pelo orvalho do céu, e que sua porção seja com os animais, entre a vegetação da terra.[a]
  revised_footnotes:
