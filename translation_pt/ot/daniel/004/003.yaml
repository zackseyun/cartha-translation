base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/003.yaml
  text: And by me a decree was issued to bring before me all the wise men of Babylon[a], that they might make known to me the interpretation of the dream.
translation:
  language: pt
  text: E por mim foi expedido um decreto para que trouxessem à minha presença todos os sábios da Babilônia, a fim de que me dessem a conhecer a interpretação do sonho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que me dissessem o significado do sonho”.'
    reason: Alternativa lexical que traduz פְשַׁר e יְהוֹדְעֻנַּנִי de modo mais idiomático, sem alterar o sentido essencial.
lexical_decisions:
- source_word: וּמִנִּי
  choice: E por mim
  rationale: A preposição מן com o sufixo da primeira pessoa indica que o decreto procedeu do rei; a formulação preserva tanto a conjunção quanto a expressão de origem ou autoria.
- source_word: שִׂים טְעֵם
  choice: foi expedido um decreto
  rationale: A combinação é uma fórmula administrativa aramaica para estabelecer ou emitir uma ordem oficial. “Foi expedido um decreto” comunica naturalmente esse sentido e mantém a construção passiva do texto.
- source_word: לְהַנְעָלָה קָדָמַי
  choice: para que trouxessem à minha presença
  rationale: O infinitivo causativo expressa fazer entrar ou trazer, e קָדָמַי indica estar diante do rei, isto é, em sua presença.
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: todos os sábios da Babilônia
  rationale: A expressão designa o conjunto dos especialistas da corte babilônica; “sábios” é clara e mantém a terminologia tradicional de Daniel.
- source_word: דִּי
  choice: a fim de que
  rationale: A partícula introduz aqui a finalidade do decreto; a locução portuguesa explicita naturalmente essa força final.
- source_word: פְשַׁר חֶלְמָא
  choice: a interpretação do sonho
  rationale: פְשַׁר é o termo técnico usado em Daniel para a interpretação de sonhos e mistérios. O estado enfático de חֶלְמָא é traduzido como “o sonho”, sem acrescentar o possessivo “meu”.
- source_word: יְהוֹדְעֻנַּנִי
  choice: me dessem a conhecer
  rationale: A forma causativa de ידע com objeto de primeira pessoa significa literalmente fazer com que o rei saiba; a escolha preserva essa estrutura e o registro solene.
theological_decisions: []
