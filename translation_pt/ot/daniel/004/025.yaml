  text: כֹּ֣לָּ/א מְּטָ֔א עַל נְבוּכַדְנֶצַּ֖ר מַלְכָּֽ/א־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/025.yaml
  text: All this came upon King Nebuchadnezzar[a].
translation:
  language: pt
  text: Tudo isso aconteceu ao rei Nabucodonosor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tudo isso sobreveio ao rei Nabucodonosor”.'
    reason: Alternativa lexical que preserva mais diretamente a ideia de algo que chega e recai sobre alguém.
lexical_decisions:
- source_word: כֹּלָּא
  choice: Tudo isso
  rationale: A expressão aramaica retoma de modo abrangente o juízo anunciado; “Tudo isso” é natural em português e preserva o sentido totalizante.
- source_word: מְּטָא
  choice: aconteceu a
  rationale: O verbo aramaico significa chegar, alcançar ou sobrevir. Neste contexto narrativo, “aconteceu a” comunica com clareza que o que fora anunciado se cumpriu na experiência do rei.
- source_word: עַל
  choice: a
  rationale: Com מְּטָא, introduz a pessoa atingida pelo acontecimento; em português, a construção idiomática é “aconteceu a alguém”.
- source_word: נְבוּכַדְנֶצַּר
  choice: Nabucodonosor
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: מַלְכָּא
  choice: rei
  rationale: O estado enfático permite valor definido; em aposição ao nome próprio, “rei Nabucodonosor” é a forma natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação concisa preserva a função narrativa e retrospectiva do aramaico.
