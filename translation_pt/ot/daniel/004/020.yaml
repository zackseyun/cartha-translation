  naturalness: O registro é moderno, claro e adequado. “Na relva do campo” é mais direto e idiomático que “no meio da relva do campo”. A construção de continuação “E quanto ao fato de o rei ter visto...” é aceitável no contexto sintático do capítulo.
  terminology: “Vigilante” preserva o termo aramaico sem impor a identificação como anjo; “um santo” mantém a aposição do original. “Cinta de ferro e bronze” é uma opção legítima para o vínculo/cinta, sem resolver indevidamente a imagem. “Tempos” conserva a ambiguidade temporal.
