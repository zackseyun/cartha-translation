id: DAN.4.20
reference: Daniel 4:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/דִ֣י חֲזָ֣ה מַלְכָּ֡/א עִ֣יר וְ/קַדִּ֣ישׁ נָחִ֣ת מִן שְׁמַיָּ֡/א וְ/אָמַר֩ גֹּ֨דּוּ אִֽילָנָ֜/א וְ/חַבְּל֗וּ/הִי בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֧ל שְׁמַיָּ֣/א יִצְטַבַּ֗ע וְ/עִם חֵיוַ֤ת בָּרָ/א֙ חֲלָקֵ֔/הּ עַ֛ד דִּֽי שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/020.yaml
  text: And because the king saw a watcher[a], a holy one, coming down from heaven and saying, ‘Cut down the tree and destroy it, but leave the stump of its roots in the earth, with a band of iron and bronze, in the grass of the field, and let him be drenched with the dew of heaven[c][b], and let his portion be with the beasts of the field until seven times pass over him’—
translation:
  language: pt
  text: 'E quanto ao fato de o rei ter visto um vigilante[a], um santo, descendo do céu e dizendo: ‘Cortem a árvore e destruam-na, mas deixem na terra o toco com suas raízes, preso com uma cinta de ferro e bronze, na relva do campo. Que ele seja encharcado pelo orvalho do céu, e que sua porção seja com os animais do campo, até que sete tempos[b] passem sobre ele’ —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sentinela”; o termo aramaico designa um ser celestial caracterizado por estar desperto e vigilante.
    reason: lexical_alternative
  - marker: b
    text: “Sete tempos” pode significar sete períodos; o texto não especifica a unidade exata.
    reason: alternative_reading
lexical_decisions:
- source_word: עִיר
  choice: vigilante
  rationale: Designa aqui um ser celestial caracterizado por estar desperto e atento. “Vigilante” preserva essa ideia sem impor uma classificação angelológica mais específica.
- source_word: וְקַדִּישׁ
  choice: um santo
  rationale: 'É uma segunda descrição, em aposição, do mesmo ser celestial: “um vigilante, um santo”.'
- source_word: נָחִת מִן שְׁמַיָּא
  choice: descendo do céu
  rationale: Expressa o ser visto no ato de descer e mantém de modo natural o valor participial da expressão aramaica.
- source_word: גֹּדּוּ
  choice: Cortem
  rationale: Imperativo plural dirigido a agentes não identificados; é claro e adequado à derrubada de uma árvore.
- source_word: וְחַבְּלוּהִי
  choice: destruam-na
  rationale: Conserva a força do verbo, que comunica causar dano grave ou destruir.
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: o toco com suas raízes
  rationale: Refere-se à parte enraizada que permanece depois de a árvore ser cortada. Esta formulação é natural em português e não reduz a expressão apenas às raízes.
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: preso com uma cinta de ferro e bronze
  rationale: אֱסוּר pode indicar cinta, atadura ou vínculo. “Cinta” se ajusta à imagem de algo circundando o toco, enquanto “preso” explicita sua função sem decidir que se trata necessariamente de grilhões.
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: no meio da relva do campo
  rationale: Traduz de forma idiomática a vegetação ou relva existente no campo aberto.
- source_word: יִצְטַבַּע
  choice: seja molhado
  rationale: O verbo indica ser umedecido ou encharcado. “Seja molhado pelo orvalho” é natural em português e preserva a voz passiva.
- source_word: וְעִם חֵיוַת בָּרָא חֲלָקֵהּ
  choice: que sua porção seja com os animais do campo
  rationale: “Porção” conserva o sentido formal de חֲלָק, enquanto “animais do campo” é atual e abrangente.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sete tempos
  rationale: Mantém a indeterminação do aramaico quanto à duração ou unidade exata desses períodos.
theological_decisions:
- issue: Identidade do “vigilante, um santo”
  choice: Manter as designações próprias do texto para um ser celestial
  alternative: Traduzir de modo mais específico como “anjo” ou “membro do conselho divino”
  rationale: O aramaico não define uma taxonomia angelológica além dessas designações; a tradução preserva essa abertura.
- issue: Mudança do referente da árvore para uma pessoa
  choice: Preservar a passagem de “o toco” para “ele”
  alternative: Uniformizar toda a descrição no gênero inanimado ou explicitar imediatamente que se trata do rei
  rationale: A oscilação presente no texto revela gradualmente o referente humano da imagem e não deve ser eliminada.
- issue: Duração dos “sete tempos”
  choice: Não especificar a unidade temporal
  alternative: Traduzir como “sete anos”
  rationale: O texto diz apenas “tempos” ou “períodos”; identificar a unidade como anos resolveria uma ambiguidade que o versículo conserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a estrutura de continuação sintática do versículo e a transição intencional da imagem da árvore para o referente pessoal. Os marcadores aparecem no texto em ordem [a], [b].
