revisions:
- from: 'E quanto ao fato de o rei ter visto um vigilante[a], um santo, descendo do céu e dizendo: ‘Cortem a árvore e destruam-na, mas deixem na terra o toco com suas raízes, preso com uma cinta de ferro e bronze, no meio da relva do campo. Que ele seja molhado pelo orvalho do céu, e que sua porção seja com os animais do campo, até que sete tempos[b] passem sobre ele’ —'
  to: 'E quanto ao fato de o rei ter visto um vigilante[a], um santo, descendo do céu e dizendo: ‘Cortem a árvore e destruam-na, mas deixem na terra o toco com suas raízes, preso com uma cinta de ferro e bronze, na relva do campo. Que ele seja encharcado pelo orvalho do céu, e que sua porção seja com os animais do campo, até que sete tempos[b] passem sobre ele’ —'
  rationale: A revisão remove uma especificação espacial não exigida pelo aramaico e reforça, com “encharcado”, o sentido de ser molhado intensamente pelo orvalho. Conserva-se a estrutura, a ambiguidade temporal, a terminologia para o ser celestial e os marcadores de nota existentes.
