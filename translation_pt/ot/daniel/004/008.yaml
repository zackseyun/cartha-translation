  text: The tree grew large and became strong[a], and its height reached to the heavens, and it was visible to the end of the whole earth.
translation:
  language: pt
  text: A árvore cresceu e se fortaleceu; sua altura chegou aos céus, e ela podia ser vista até os confins de toda a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua aparência alcançava os confins de toda a terra”. O substantivo aramaico pode indicar “aparência” ou “aspecto”, além daquilo que é visto; o contexto favorece a ideia de visibilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְבָה אִילָנָא
  choice: A árvore cresceu
  rationale: O verbo expressa crescimento ou aumento; em português, “cresceu” comunica naturalmente o desenvolvimento da árvore. O estado enfático de אִילָנָא é adequadamente representado pelo artigo definido no contexto da árvore específica da visão.
- source_word: וּתְקִף
  choice: e se fortaleceu
  rationale: O verbo indica tornar-se forte ou poderoso. A forma pronominal preserva o aspecto progressivo e se coordena naturalmente com “cresceu”.
- source_word: וְרוּמֵהּ
  choice: sua altura
  rationale: A expressão se refere diretamente à altura ou elevação da árvore; “sua altura” é clara e idiomática.
- source_word: יִמְטֵא לִשְׁמַיָּא
  choice: chegou aos céus
  rationale: O verbo significa chegar ou alcançar, e o plural aramaico é preservado por “céus”, mantendo a imagem elevada do texto.
- source_word: וַחֲזוֹתֵהּ
  choice: ela podia ser vista
  rationale: Embora o substantivo possa significar “aparência” ou “aspecto”, a construção contextual favorece a ideia de visibilidade. A formulação verbal é natural em português sem eliminar a alternativa lexical, registrada em nota.
- source_word: לְסוֹף כָּל אַרְעָא
  choice: até os confins de toda a terra
  rationale: A expressão aponta para a extensão mais distante da terra. “Confins” transmite idiomaticamente esse alcance universal e preserva a amplitude da visão.
