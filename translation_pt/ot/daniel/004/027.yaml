source:
  edition: WLC
  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר הֲ/לָ֥א דָא הִ֖יא בָּבֶ֣ל רַבְּתָ֑/א דִּֽי אֲנָ֤ה בֱנַיְתַ/הּ֙ לְ/בֵ֣ית מַלְכ֔וּ בִּ/תְקַ֥ף חִסְנִ֖/י וְ/לִ/יקָ֥ר הַדְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/027.yaml
  text: The king answered and said[a], “Is this not Babylon the Great[b], which I myself built as a royal residence by the might of my power and for the glory of my majesty?”
translation:
  language: pt
  text: 'O rei declarou: “Não é esta a grande Babilônia[a], que eu mesmo construí para ser a residência real[b], com a força do meu poder e para a glória da minha majestade?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Babilônia, a Grande”.
    reason: lexical_alternative
  - marker: b
    text: Ou “como casa do reino” ou “como sede da realeza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: declarou
  rationale: Fórmula narrativa aramaica que, neste contexto, introduz uma fala sem exigir resposta prévia. “Declarou” é natural em português e evita a expressão pouco idiomática “respondeu e disse”.
- source_word: הֲלָא
  choice: Não é esta
  rationale: Conserva a forma de pergunta retórica, que espera uma resposta afirmativa.
- source_word: בָּבֶל רַבְּתָא
  choice: a grande Babilônia
  rationale: Preserva o valor descritivo e enfático do adjetivo posposto, bem como o tom grandioso da vanglória do rei.
- source_word: אֲנָה
  choice: eu mesmo
  rationale: A explicitação do pronome independente é enfática; “eu mesmo” reproduz a autoexaltação sem acrescentar a ideia de exclusividade absoluta.
- source_word: בֱנַיְתַהּ
  choice: construí
  rationale: Equivalente direto e corrente do verbo aramaico no contexto da obra atribuída pelo rei a si próprio.
- source_word: לְבֵית מַלְכוּ
  choice: para ser a residência real
  rationale: Expressa naturalmente em português a finalidade de Babilônia como sede ou residência da realeza, sem restringir necessariamente a referência a um único palácio.
- source_word: בִּתְקַף חִסְנִי
  choice: com a força do meu poder
  rationale: Mantém a intensificação deliberadamente grandiosa e algo redundante do original.
- source_word: וְלִיקָר הַדְרִי
  choice: e para a glória da minha majestade
  rationale: Distingue adequadamente os conceitos de glória/honra e majestade/esplendor, preservando o registro elevado da vanglória real.
theological_decisions:
- issue: A vanglória de Nabucodonosor acerca da grandeza de Babilônia
  choice: a grande Babilônia
  alternative: Babilônia, a Grande
  rationale: A expressão é primariamente descritiva no aramaico, e não necessariamente um título técnico. A formulação escolhida conserva a ênfase sem transformar o adjetivo em título formal.
- issue: Sentido de לְבֵית מַלְכוּ
  choice: para ser a residência real
  alternative: como casa do reino
  rationale: A alternativa mais literal conserva a imagem de “casa”, mas é obscura em português. A escolha comunica a função régia de Babilônia, mantendo em nota a amplitude possível da expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pergunta retórica e a linguagem enfática do orgulho real foram preservadas; a fórmula narrativa inicial foi vertida de modo idiomático.
