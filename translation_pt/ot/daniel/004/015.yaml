language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דְּנָה֙ חֶלְמָ֣/א חֲזֵ֔ית אֲנָ֖ה מַלְכָּ֣/א נְבוּכַדְנֶצַּ֑ר ו/אנתה בֵּלְטְשַׁאצַּ֜ר פִּשְׁרֵ֣/א אֱמַ֗ר כָּ/ל קֳבֵל֙ דִּ֣י כָּל חַכִּימֵ֣י מַלְכוּתִ֗/י לָֽא יָכְלִ֤ין פִּשְׁרָ/א֙ לְ/הוֹדָ֣עֻתַ֔/נִי ו/אנתה כָּהֵ֔ל דִּ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בָּֽ/ךְ׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/015.yaml
  text: This is the dream that I[a], King Nebuchadnezzar, saw. And you, Belteshazzar, tell its interpretation, because all the wise men of my kingdom are not able to make its interpretation known to me, but you are able, for the spirit of the holy gods is in you.
translation:
  language: pt
  text: Este é o sonho que eu, o rei Nabucodonosor, vi. E você, Beltessazar, diga-me a interpretação, pois todos os sábios do meu reino não conseguem me revelar a interpretação; mas você consegue, porque o espírito dos deuses santos[a] está em você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Espírito do Deus santo”. As formas aramaicas são plurais, mas alguns entendem a expressão como uma referência singular.'
    reason: Leitura alternativa que preserva a possível compreensão singular da expressão aramaica.
lexical_decisions:
- source_word: דְּנָה חֶלְמָא
  choice: Este é o sonho
  rationale: O demonstrativo e o substantivo em estado determinado introduzem de modo natural e enfático o sonho que acaba de ser relatado.
- source_word: חֲזֵית
  choice: tive
  rationale: Embora o verbo signifique literalmente 'vi', em português é idiomático dizer 'ter um sonho'; a escolha preserva o sentido no contexto sem sugerir mera observação.
- source_word: אֲנָה מַלְכָּא נְבוּכַדְנֶצַּר
  choice: eu, o rei Nabucodonosor
  rationale: Mantém a identificação real em aposição e a ênfase explícita do pronome de primeira pessoa.
- source_word: וְאַנתָּה בֵּלְטְשַׁאצַּר
  choice: E você, Beltessazar
  rationale: Conserva a conjunção simples e a interpelação direta em português moderno e amplamente compreensível.
- source_word: פִּשְׁרֵא אֱמַר
  choice: diga qual é a interpretação
  rationale: O imperativo de אמר pede que Beltessazar declare a interpretação. A formulação portuguesa é natural e liga claramente a interpretação ao sonho.
- source_word: כָּל־קֳבֵל דִּי
  choice: pois
  rationale: Expressa de forma concisa a relação causal introduzida pela locução aramaica.
- source_word: כָּל חַכִּימֵי מַלְכוּתִי
  choice: nenhum dos sábios do meu reino
  rationale: Em combinação com a negação verbal, esta formulação comunica naturalmente em português que todos eles são incapazes, sem alterar o alcance universal.
- source_word: לָא יָכְלִין פִּשְׁרָא לְהוֹדָעוּתַנִי
  choice: consegue me dar a conhecer a interpretação
  rationale: Preserva a ideia causativa de 'fazer saber' e a referência explícita à interpretação.
- source_word: וְאַנתָּה כָּהֵל
  choice: mas você consegue
  rationale: O 'mas' explicita em português o contraste contextual entre a incapacidade dos sábios e a capacidade de Beltessazar.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין בָּךְ
  choice: o espírito dos deuses santos está em você
  rationale: Mantém no texto principal a morfologia plural e o provável modo de falar do rei babilônico, sem eliminar a possível leitura singular registrada em nota.
theological_decisions:
- issue: Sentido de רוּחַ אֱלָהִין קַדִּישִׁין na fala de Nabucodonosor
  choice: o espírito dos deuses santos
  alternative: o Espírito do Deus santo
  rationale: אֱלָהִין e קַדִּישִׁין têm formas plurais, e a fala pertence a um rei babilônico. A leitura plural é, portanto, mantida no texto, enquanto a leitura singular tradicional, gramaticalmente defendida por alguns, aparece em nota para preservar a ambiguidade interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Usa 'você' na interpelação direta e 'Beltessazar' como forma portuguesa tradicional do nome, distinguindo-o de Belsazar. A repetição de 'interpretação' reflete o texto aramaico e mantém clareza.
