    reason: Leitura alternativa que preserva a possível compreensão singular da expressão aramaica.
  revision_rationale: A revisão aproxima a redação do verbo aramaico «vi» e da construção «todos os sábios ... não conseguem», ao mesmo tempo que substitui perífrases menos naturais por formulações portuguesas claras. Mantém-se a leitura plural principal e a nota de alternativa singular, sem resolver a ambiguidade teológica.
