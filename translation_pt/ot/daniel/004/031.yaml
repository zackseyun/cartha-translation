  text: וְ/לִ/קְצָ֣ת יֽוֹמַיָּ/ה֩ אֲנָ֨ה נְבוּכַדְנֶצַּ֜ר עַיְנַ֣/י לִ/שְׁמַיָּ֣/א נִטְלֵ֗ת וּ/מַנְדְּעִ/י֙ עֲלַ֣/י יְת֔וּב ו/ל/עלי/א בָּרְכֵ֔ת וּ/לְ/חַ֥י עָלְמָ֖/א שַׁבְּחֵ֣ת וְ/הַדְּרֵ֑ת דִּ֤י שָׁלְטָנֵ/הּ֙ שָׁלְטָ֣ן עָלַ֔ם וּ/מַלְכוּתֵ֖/הּ עִם דָּ֥ר וְ/דָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/031.yaml
  text: At the end of the days[a], I, Nebuchadnezzar, lifted my eyes to heaven, and my understanding returned to me; and I blessed the Most High, and I praised and honored him who lives forever, for his dominion is an everlasting dominion, and his kingdom is from generation to generation.
translation:
  language: pt
  text: Ao fim daqueles dias, eu, Nabucodonosor, levantei os olhos para o céu, e meu entendimento voltou a mim. Então bendisse o Altíssimo e louvei e honrei aquele que vive para sempre, pois seu domínio é um domínio eterno, e seu reino permanece de geração em geração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִקְצָת יֽוֹמַיָּה
  choice: Ao fim daqueles dias
  rationale: A expressão aramaica indica o término do período previamente determinado. “Daqueles dias” mantém a ligação narrativa e soa natural em português.
- source_word: עַיְנַי לִשְׁמַיָּא נִטְלֵת
  choice: levantei os olhos para o céu
  rationale: Preserva a imagem e o gesto físico do original, bem como sua conotação de voltar-se para Deus.
- source_word: וּמַנְדְּעִי עֲלַי יְתוּב
  choice: meu entendimento voltou a mim
  rationale: מַנְדַּע pode indicar conhecimento, entendimento ou razão. “Entendimento” comunica a recuperação da lucidez sem impor uma categoria psicológica moderna.
- source_word: לעליא
  choice: o Altíssimo
  rationale: Título divino consagrado em português e apropriado ao uso recorrente em Daniel.
- source_word: בָּרְכֵת
  choice: bendisse
  rationale: Mantém a distinção lexical em relação ao verbo seguinte, que significa louvar.
- source_word: לְחַי עָלְמָא
  choice: aquele que vive para sempre
  rationale: Expressa de modo natural a referência pessoal a Deus como o eternamente vivo.
- source_word: שַׁבְּחֵת וְהַדְּרֵת
  choice: louvei e honrei
  rationale: Conserva os dois atos paralelos e distintos sem tornar a linguagem artificial.
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: seu domínio é um domínio eterno
  rationale: Preserva a construção cognata enfática e o vocabulário régio do livro.
- source_word: וּמַלְכוּתֵהּ עִם דָּר וְדָר
  choice: seu reino permanece de geração em geração
  rationale: A oração aramaica não tem verbo expresso; “permanece” comunica naturalmente seu sentido durativo, enquanto “de geração em geração” preserva o idioma de sucessão contínua.
theological_decisions:
- issue: Forma pessoal da doxologia dirigida a Deus
  choice: louvei e honrei aquele que vive para sempre
  alternative: louvei e honrei o que vive para sempre
  rationale: “Aquele” oferece uma referência pessoal natural e digna sem acrescentar especificação teológica ausente do aramaico.
- issue: Valor da oração nominal sobre o reino
  choice: seu reino permanece de geração em geração
  alternative: seu reino é de geração em geração
  rationale: Como não há verbo expresso no aramaico, “permanece” explicita o sentido durativo sugerido pelo contexto sem eliminar a possibilidade formal da alternativa mais literal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A pontuação divide a longa sequência aramaica em duas frases para maior clareza, sem alterar sua progressão. Não se acrescentou nota lexical porque “entendimento” representa adequadamente o termo no corpo do texto e nenhuma alternativa é necessária para preservar ambiguidade relevante à publicação.
