  text: וְ/עָפְיֵ֤/הּ שַׁפִּיר֙ וְ/אִנְבֵּ֣/הּ שַׂגִּ֔יא וּ/מָז֨וֹן לְ/כֹ֖לָּ/א בֵ֑/הּ תְּחֹת֗וֹ/הִי תְּדוּר֙ חֵיוַ֣ת בָּרָ֔/א וּ/בְ/עַנְפ֕וֹ/הִי יִשְׁכְּנָ֖ן צִפֲּרֵ֥י שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/018.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field lived, and in its branches the birds of the heavens dwelled.
translation:
  language: pt
  text: Sua folhagem era bela, e seu fruto, abundante; nela havia alimento para todos. Debaixo dela viviam os animais do campo, e em seus galhos habitavam as aves dos céus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as aves do céu”. O aramaico usa literalmente a forma plural “céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: sua folhagem
  rationale: O termo aramaico designa coletivamente a cobertura de folhas da árvore; “folhagem” preserva esse sentido e soa natural em português.
- source_word: שַׁפִּיר
  choice: bela
  rationale: Expressa beleza ou aspecto agradável; “bela” é clara, atual e adequada ao registro.
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: seu fruto, abundante
  rationale: “Fruto” traduz diretamente o produto da árvore, e “abundante” comunica a grande quantidade indicada pelo adjetivo aramaico.
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: nela havia alimento para todos
  rationale: Preserva tanto a localização do alimento na árvore quanto seu alcance universal, em construção natural em português.
- source_word: חֵיוַת בָּרָא
  choice: os animais do campo
  rationale: Mantém a expressão semítica referente aos animais terrestres do campo ou da região aberta, sem restringi-la indevidamente apenas a animais ferozes.
- source_word: תְּדוּר
  choice: viviam
  rationale: O verbo significa morar ou residir; com animais sob uma árvore, “viviam” é contemporâneo e idiomático.
- source_word: עַנְפוֹהִי
  choice: seus galhos
  rationale: “Galhos” é uma equivalência direta e corrente para os ramos da árvore.
- source_word: יִשְׁכְּנָן
  choice: habitavam
  rationale: Preserva a ideia de residência ou permanência sem especificar que as aves faziam ninhos.
- source_word: צִפֲּרֵי שְׁמַיָּא
  choice: as aves dos céus
  rationale: Reproduz a forma plural do aramaico e conserva a textura bíblica, permanecendo compreensível em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve textura bíblica. O paralelismo locativo entre “debaixo dela” e “em seus galhos” foi preservado. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
