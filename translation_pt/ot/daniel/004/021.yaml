  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דְּנָ֥ה פִשְׁרָ֖/א מַלְכָּ֑/א וּ/גְזֵרַ֤ת עלי/א הִ֔יא דִּ֥י מְטָ֖ת עַל מרא/י מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/021.yaml
  text: 'This is the interpretation[a], O king, and it is a decree of the Most High that has come upon my lord the king:'
translation:
  language: pt
  text: 'Esta é a interpretação, ó rei, e este é o decreto do Altíssimo[a] que veio sobre o rei, meu senhor:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do Supremo». O título aramaico apresenta Deus como aquele que está acima de todos os governantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Esta é
  rationale: O demonstrativo introduz a explicação de Daniel; em português, explicita-se naturalmente a cópula diante do predicativo.
- source_word: פִשְׁרָא
  choice: a interpretação
  rationale: No aramaico bíblico, o termo designa com frequência a interpretação de um sonho ou mistério; a escolha preserva a correspondência formal e se ajusta ao contexto.
- source_word: מַלְכָּא
  choice: ó rei
  rationale: A primeira ocorrência funciona como vocativo; «ó rei» conserva o tom solene e cortês da fala na corte.
- source_word: וּגְזֵרַת ... הִיא
  choice: e este é o decreto
  rationale: A construção nominal identifica o conteúdo anunciado como um decreto; o demonstrativo masculino concorda naturalmente com «decreto» em português.
- source_word: עִלָּיָא
  choice: do Altíssimo
  rationale: Título divino consagrado e claro em português, que expressa a supremacia de Deus sobre os governantes terrenos.
- source_word: דִּי
  choice: que
  rationale: O relativo introduz a oração que modifica «decreto».
- source_word: מְטָת עַל
  choice: veio sobre
  rationale: Mantém a imagem de algo que chegou e recaiu sobre o rei, sem tornar explícita demais a nuance hostil por meio de «contra».
- source_word: מָרִי מַלְכָּא
  choice: o rei, meu senhor
  rationale: Expressa a deferência cortesã com ordem natural em português e deixa claro que «meu senhor» se refere ao rei.
theological_decisions:
- issue: Tradução do título divino עִלָּיָא
  choice: o Altíssimo
  alternative: o Supremo
  rationale: «O Altíssimo» é exato, idiomático e tradicionalmente reconhecível, enfatizando a supremacia divina sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve solenidade apropriada ao discurso perante o rei. A construção «veio sobre» preserva a formulação e a tensão judicial do aramaico.
