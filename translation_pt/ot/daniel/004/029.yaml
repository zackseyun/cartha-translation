id: DAN.4.29
reference: Daniel 4:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִן אֲנָשָׁ/א֩ לָ֨/ךְ טָֽרְדִ֜ין וְֽ/עִם חֵיוַ֧ת בָּרָ֣/א מְדֹרָ֗/ךְ עִשְׂבָּ֤/א כְ/תוֹרִין֙ לָ֣/ךְ יְטַעֲמ֔וּן וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עלי/ך עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/029.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: pt
  text: E você será expulso do meio dos seres humanos[a], e sua morada será com os animais do campo. Farão você comer capim como os bois, e sete tempos se passarão sobre você[b], até que você reconheça que o Altíssimo governa o reino dos seres humanos e o dá a quem ele quer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, para longe do convívio com outros seres humanos.
    reason: lexical_clarification
  - marker: b
    text: 'Aramaico: “sete tempos”; possivelmente sete anos ou, de modo mais geral, sete períodos de tempo.'
    reason: alternative_reading
lexical_decisions:
- source_word: טָֽרְדִ֜ין
  choice: você será expulso
  rationale: Embora a forma aramaica seja ativa e plural, literalmente “expulsarão você”, a construção passiva é natural em português e conserva o foco no juízo sofrido pelo rei.
- source_word: אֲנָשָׁא
  choice: seres humanos
  rationale: Designa a humanidade em contraste com os animais; a expressão é clara, inclusiva e mantém o contraste antropológico tanto na primeira ocorrência quanto em “reino dos seres humanos”.
- source_word: מְדֹרָךְ
  choice: sua morada
  rationale: Equivalente direto e digno para o lugar onde alguém habita.
- source_word: חֵיוַת בָּרָא
  choice: os animais do campo
  rationale: Preserva a imagem bíblica de animais que vivem fora da sociedade humana, sem a conotação excessivamente feroz que “feras” pode ter no português atual.
- source_word: עִשְׂבָּא
  choice: capim
  rationale: No contexto de bois pastando, “capim” é mais concreto e natural em português brasileiro do que “erva” ou “vegetação”.
- source_word: כְתוֹרִין
  choice: como os bois
  rationale: O termo aramaico se refere a bovinos; “bois” conserva a comparação tradicional e a imagem de pastagem.
- source_word: יְטַעֲמ֔וּן
  choice: farão você comer
  rationale: Traduz a forma causativa e explicita que a alimentação faz parte do juízo imposto, em vez de ser uma ação meramente voluntária.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sete tempos
  rationale: Mantém a indeterminação lexical do aramaico, que fala de tempos ou períodos sem identificar explicitamente anos.
- source_word: יַחְלְפ֣וּן עֲלָךְ
  choice: passarão sobre você
  rationale: Reproduz a expressão aramaica e comunica que os períodos transcorrerão enquanto o juízo recai sobre o rei.
- source_word: תִנְדַּע
  choice: você reconheça
  rationale: O contexto envolve chegar a saber pela experiência e admitir a soberania divina; “reconheça” transmite essa dimensão sem transformá-la em uma formulação doutrinária mais específica.
- source_word: שַׁלִּיט עִלָּיָא
  choice: o Altíssimo governa
  rationale: Expressa de modo direto e atual o domínio ativo do Altíssimo.
- source_word: בְּמַלְכוּת אֲנָשָׁא
  choice: o reino dos seres humanos
  rationale: Conserva a imagem política e a referência coletiva ao domínio humano, evitando sugerir um reino específico.
- source_word: יִתְּנִנַּהּ ... יִצְבֵּא
  choice: o dá a quem ele quer
  rationale: Tradução direta da liberdade soberana do Altíssimo para conceder o reino conforme sua vontade.
theological_decisions:
- issue: Duração expressa por עִדָּנִין no juízo de Nabucodonosor
  choice: sete tempos
  alternative: sete anos; sete períodos de tempo
  rationale: O substantivo pode indicar um tempo ou período e, no contexto, costuma ser entendido como anos, mas o versículo não especifica essa unidade. A tradução principal preserva a abertura do texto e a nota registra as interpretações possíveis.
- issue: Sentido de אֲנָשָׁא no contraste entre sociedade humana e animais
  choice: seres humanos
  alternative: homens; humanidade
  rationale: A referência é coletiva e abrange a humanidade em contraste com os animais. “Seres humanos” comunica esse sentido com precisão e também funciona naturalmente na expressão “reino dos seres humanos”.
- issue: Valor de תִנְדַּע como conhecimento resultante do juízo
  choice: reconheça
  alternative: saiba; venha a saber
  rationale: “Reconheça” preserva o componente cognitivo e sugere a admissão experiencial da autoridade do Altíssimo, sem definir além do texto a natureza espiritual dessa resposta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se a imagem de “animais do campo”, o título “Altíssimo” e a ambiguidade temporal de “sete tempos”. Os marcadores das notas aparecem no texto na ordem correspondente.
