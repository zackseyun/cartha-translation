base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/034.yaml
  text: I, Nebuchadnezzar, praise and exalt and honor the King of heaven, because all his works are truth, and his ways are justice; and those who walk in pride he is able to humble.
translation:
  language: pt
  text: Agora eu, Nabucodonosor, louvo, exalto e honro o Rei dos céus, porque todas as suas obras são verdadeiras, e os seus caminhos são justos; ele pode humilhar os que andam com orgulho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעַן
  choice: Agora
  rationale: O advérbio aramaico marca o momento presente ou a conclusão do relato; “Agora” preserva essa função discursiva de modo natural em português.
- source_word: מְשַׁבַּח וּמְרוֹמֵם וּמְהַדַּר
  choice: louvo, exalto e honro
  rationale: Mantém os três verbos coordenados e sua progressão retórica sem fundi-los.
- source_word: קְשֹׁט
  choice: verdadeiras
  rationale: O substantivo predicativo “verdade” caracteriza todas as obras do Rei; em português corrente, o adjetivo plural comunica esse sentido com naturalidade.
- source_word: דִּין
  choice: justos
  rationale: O substantivo “justiça/juízo” funciona como predicativo dos caminhos; “justos” preserva a afirmação moral e judicial em português idiomático.
- source_word: מַהְלְכִין בְּגֵוָה
  choice: os que andam com orgulho
  rationale: Conserva a metáfora bíblica de “andar” como modo de viver e traduz גֵוָה sem restringi-lo a uma manifestação específica de soberba.
- source_word: יָכִל לְהַשְׁפָּלָה
  choice: pode humilhar
  rationale: Expressa diretamente a capacidade soberana afirmada pelo texto, sem acrescentar necessidade ou inevitabilidade.
theological_decisions:
- issue: Relação entre a justiça divina e os caminhos do Rei dos céus
  choice: os seus caminhos são justos
  alternative: os seus caminhos são justiça
  rationale: A formulação adjetiva é natural em português e preserva a declaração abrangente de que o agir divino é conforme à justiça, sem definir um sistema teológico específico.
- issue: Capacidade de Deus para rebaixar os orgulhosos
  choice: ele pode humilhar
  alternative: ele é capaz de humilhar
  rationale: “Pode” mantém a afirmação de capacidade do aramaico e evita transformar o enunciado em declaração de que Deus necessariamente humilha toda pessoa orgulhosa em cada ocasião.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A sequência tríplice dos verbos e a metáfora de andar foram preservadas.
