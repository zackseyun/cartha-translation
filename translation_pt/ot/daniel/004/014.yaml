  text: בִּ/גְזֵרַ֤ת עִירִין֙ פִּתְגָמָ֔/א וּ/מֵאמַ֥ר קַדִּישִׁ֖ין שְׁאֵֽלְתָ֑/א עַד דִּבְרַ֡ת דִּ֣י יִנְדְּע֣וּן חַ֠יַּיָּ/א דִּֽי שַׁלִּ֨יט עלי/א בְּ/מַלְכ֣וּת אנוש/א וּ/לְ/מַן דִּ֤י יִצְבֵּא֙ יִתְּנִנַּ֔/הּ וּ/שְׁפַ֥ל אֲנָשִׁ֖ים יְקִ֥ים עלי/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/014.yaml
  text: The sentence is by the decree of the watchers[a], and the decision by the word of the holy ones, so that the living may know that the Most High rules in the kingdom of mankind and gives it to whom he wills[c][b], and sets up over it the lowliest of men.
translation:
  language: pt
  text: A sentença é por decreto dos vigilantes[a], e a decisão, pela palavra dos santos[b], para que os que vivem saibam que o Altíssimo domina sobre o reino dos seres humanos[c], dá-o a quem quer e estabelece sobre ele o mais insignificante dos homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vigilantes” traduz literalmente um termo próprio de Daniel para seres celestiais; muitos intérpretes os entendem como anjos.
    reason: cultural_note
  - marker: b
    text: 'Ou: “A sentença é por decreto dos vigilantes, e a decisão é um pedido dos santos”. A formulação aramaica é condensada, e שְׁאֵלְתָא pode significar “pedido” ou “petição”.'
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “no reino dos seres humanos” ou “no reino da humanidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְזֵרַת
  choice: por decreto
  rationale: Preserva o caráter formal e judicial de גְזֵרָה e o valor instrumental da preposição בְּ.
- source_word: עִירִין
  choice: vigilantes
  rationale: Mantém o termo técnico e a imagem aramaica de seres celestiais que permanecem alertas, sem substituí-lo interpretativamente por “anjos”.
- source_word: פִּתְגָמָא
  choice: sentença
  rationale: No contexto judicial, designa o pronunciamento anunciado; “sentença” comunica melhor essa força do que os termos mais amplos “palavra” ou “assunto”.
- source_word: וּמֵאמַר קַדִּישִׁין שְׁאֵלְתָא
  choice: e a decisão, pela palavra dos santos
  rationale: Expressa em português natural o paralelismo formal da frase, sem ocultar em nota a construção aramaica condensada nem a possibilidade de entender שְׁאֵלְתָא como “pedido” ou “petição”.
- source_word: קַדִּישִׁין
  choice: santos
  rationale: Conserva a designação paralela a “vigilantes”. O contexto indica seres santos celestiais; a tradução evita inserir diretamente a identificação interpretativa “anjos”.
- source_word: עַד דִּבְרַת דִּי
  choice: para que
  rationale: Reproduz com naturalidade a relação de propósito ou resultado introduzida pela locução.
- source_word: חַיַּיָּא
  choice: os que vivem
  rationale: É uma formulação clara e inclusiva para o substantivo coletivo “os viventes”, sem restringir indevidamente seu alcance.
- source_word: שַׁלִּיט עִלָּיָא
  choice: o Altíssimo domina
  rationale: Preserva o título divino e a força verbal de exercício de autoridade, em vez de convertê-la apenas em uma qualidade abstrata.
- source_word: בְּמַלְכוּת אֱנוֹשָׁא
  choice: sobre o reino dos seres humanos
  rationale: “Sobre” explicita em português o âmbito do domínio, enquanto “seres humanos” traduz o coletivo אֱנוֹשָׁא sem sugerir que apenas homens do sexo masculino estejam em vista.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: dá esse reino a quem quer
  rationale: O demonstrativo explicita o referente pronominal necessário para fluência em português, e “a quem quer” mantém a liberdade soberana expressa pelo aramaico.
- source_word: וּשְׁפַל אֲנָשִׁים
  choice: o mais humilde dos homens
  rationale: Reproduz o idiomatismo superlativo formado pelo adjetivo singular com o substantivo plural, preservando a formulação humana masculina genérica da expressão.
theological_decisions:
- issue: Identidade dos “vigilantes” e dos “santos”
  choice: Conservar a terminologia da corte celestial, “vigilantes” e “santos”.
  alternative: “anjos” ou “seres celestiais”
  rationale: O contexto aponta para seres celestiais, mas o texto emprega designações próprias. Mantê-las preserva a imagem e evita transformar uma identificação interpretativa em tradução direta.
- issue: Agência dos vigilantes em relação à soberania do Altíssimo
  choice: Preservar tanto o decreto atribuído aos vigilantes quanto a declaração de que o Altíssimo governa e concede o reino.
  alternative: Reformular o decreto como vindo diretamente de Deus ou reduzir os vigilantes a meros mensageiros.
  rationale: O versículo mantém deliberadamente a linguagem da corte celestial ao lado da soberania suprema de Deus; a tradução não deve eliminar essa tensão.
- issue: Sentido de אֱנוֹשָׁא
  choice: Traduzir o coletivo como “seres humanos”.
  alternative: “homens”, “humanidade” ou “gênero humano”
  rationale: O referente é a esfera humana em geral. “Seres humanos” é atual, concreto e fiel ao sentido coletivo, sem restringi-lo por sexo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o paralelismo judicial e o cenário da corte celestial. “Vigilantes” e “santos” mantêm a terminologia distintiva do aramaico; as ambiguidades relevantes são registradas em notas, sem serem resolvidas silenciosamente.
