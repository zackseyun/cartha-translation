base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/002.yaml
  text: I saw a dream[a], and it frightened me; and the thoughts on my bed and the visions of my head terrified me.
translation:
  language: pt
  text: Tive um sonho, e ele me deixou com medo; os pensamentos em minha cama e as visões em minha mente me aterrorizaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶם חֲזֵית
  choice: Tive um sonho
  rationale: Embora a expressão aramaica seja literalmente “vi um sonho”, “tive um sonho” é a forma natural em português para relatar essa experiência, sem alterar o sentido.
- source_word: וִידַחֲלִנַּנִי
  choice: e ele me deixou com medo
  rationale: O verbo singular retoma naturalmente “sonho”; esta formulação preserva o sentido de causar medo e distingue este verbo do mais intenso יְבַהֲלֻנַּנִי no fim do versículo.
- source_word: וְהַרְהֹרִין
  choice: os pensamentos
  rationale: O substantivo aramaico designa pensamentos ou reflexões; “pensamentos” é claro, atual e adequado ao paralelismo com “visões”.
- source_word: עַל מִשְׁכְּבִי
  choice: em minha cama
  rationale: A expressão localiza os pensamentos no contexto noturno. Em português, “em minha cama” é mais idiomático do que o decalque “sobre minha cama”.
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: e as visões em minha mente
  rationale: Literalmente, “as visões da minha cabeça”. “Em minha mente” comunica naturalmente o sentido da expressão semítica em português moderno.
- source_word: יְבַהֲלֻנַּנִי
  choice: me aterrorizaram
  rationale: O verbo expressa perturbação ou terror intenso; a forma plural concorda com os pensamentos e as visões e mantém uma progressão em relação a “deixou com medo”.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A tradução adota equivalência ótima: verte idiomaticamente “vi um sonho” por “tive um sonho” e “visões da minha cabeça” por “visões em minha mente”, preservando o paralelismo e a intensificação dos dois verbos de temor.'
