  text: אִֽילָנָ/א֙ דִּ֣י חֲזַ֔יְתָ דִּ֥י רְבָ֖ה וּ/תְקִ֑ף וְ/רוּמֵ/הּ֙ יִמְטֵ֣א לִ/שְׁמַיָּ֔/א וַ/חֲזוֹתֵ֖/הּ לְ/כָל אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/017.yaml
  text: The tree that you saw[a], which grew and became strong, whose height reached to the heavens and was visible to all the earth—
translation:
  language: pt
  text: A árvore que você viu, que cresceu e se tornou forte, cuja altura chegou aos céus e era visível em toda a terra[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O aramaico אַרְעָא também pode significar “terra” no sentido de “país” ou “região”; aqui, “toda a terra” corresponde melhor à amplitude universal da imagem do sonho.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִילָנָא
  choice: a árvore
  rationale: O substantivo aramaico comum designa uma árvore; o artigo definido retoma a árvore específica do sonho.
- source_word: דִּי חֲזַיְתָ
  choice: que você viu
  rationale: Preserva a oração relativa e a forma verbal na segunda pessoa masculina singular em português atual e claro.
- source_word: רְבָה
  choice: cresceu
  rationale: Embora o verbo possa significar “tornou-se grande”, “cresceu” expressa naturalmente essa ideia no contexto da árvore.
- source_word: וּתְקִף
  choice: e se tornou forte
  rationale: Conserva o sentido de aquisição de força e a progressão verbal da descrição.
- source_word: וְרוּמֵהּ
  choice: cuja altura
  rationale: Representa de perto o substantivo “altura” com sufixo possessivo, sem reduzi-lo apenas à copa da árvore.
- source_word: יִמְטֵא לִשְׁמַיָּא
  choice: chegou aos céus
  rationale: Traduz o verbo “alcançar, chegar” e mantém o plural aramaico “céus” em linguagem bíblica natural.
- source_word: וַחֲזוֹתֵהּ לְכָל אַרְעָא
  choice: e era visível em toda a terra
  rationale: Comunica idiomaticamente que a árvore podia ser vista por toda a extensão retratada na visão.
theological_decisions:
- issue: Alcance de אַרְעָא na imagem do sonho régio
  choice: terra
  alternative: país / região
  rationale: Embora o termo aramaico também possa designar uma terra ou região, a árvore que alcança os céus e é visível por toda parte sugere aqui a escala universal da visão, sem exigir conclusões teológicas posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção mantém a longa descrição relativa e o travessão final, indicando que a frase prossegue no versículo seguinte.
