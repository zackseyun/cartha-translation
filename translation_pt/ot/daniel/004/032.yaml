  to: 'E todos os habitantes da terra são tidos como nada; ele faz conforme a sua vontade entre o exército dos céus[a] e entre os habitantes da terra. Não há ninguém que possa deter a sua mão[b] ou lhe dizer: “O que fizeste?”'
  rationale: A revisão limita-se ao idiomatismo aramaico «golpear sua mão». «Deter a sua mão» é natural em português e preserva o sentido de que ninguém pode obstruir a ação do soberano, sem introduzir interpretação confessional. A nota conserva a imagem literal do original. O restante do texto e as âncoras das notas permanecem adequados.
