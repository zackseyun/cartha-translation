  text: וְ/כָל דארי אַרְעָ/א֙ כְּ/לָ֣ה חֲשִׁיבִ֔ין וּֽ/כְ/מִצְבְּיֵ֗/הּ עָבֵד֙ בְּ/חֵ֣יל שְׁמַיָּ֔/א ו/דארי אַרְעָ֑/א וְ/לָ֤א אִיתַי֙ דִּֽי יְמַחֵ֣א בִ/ידֵ֔/הּ וְ/יֵ֥אמַר לֵ֖/הּ מָ֥ה עֲבַֽדְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/032.yaml
  text: And all the inhabitants of the earth are regarded as nothing[a], and he does according to his will among the army of heaven and among the inhabitants of the earth; and there is no one who can strike his hand or say to him[b], “What have you done?”
translation:
  language: pt
  text: 'E todos os habitantes da terra são tidos como nada; ele faz conforme a sua vontade entre o exército dos céus[a] e entre os habitantes da terra. Não há ninguém que possa deter a sua mão[b] ou lhe dizer: “O que fizeste?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a hoste dos céus”. A expressão não especifica se são anjos, outros seres celestiais ou astros.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “golpear sua mão”; isto é, impedi-lo ou conter sua ação.
    reason: idiom_clarification
lexical_decisions:
- source_word: דארי אַרְעָא
  choice: os habitantes da terra
  rationale: Expressa naturalmente, em português moderno, o particípio aramaico que designa os que habitam na terra, preservando o alcance universal do contexto.
- source_word: כְּלָה חֲשִׁיבִין
  choice: são tidos como nada
  rationale: Mantém a ideia de avaliação ou consideração, sem transformar a afirmação em negação da existência dos habitantes da terra.
- source_word: וּכְמִצְבְּיֵהּ
  choice: conforme a sua vontade
  rationale: Reproduz o sentido de vontade, desejo ou beneplácito com formulação natural e solene.
- source_word: עָבֵד
  choice: ele faz
  rationale: Preserva a força direta do verbo aramaico comum para fazer ou agir.
- source_word: בְּחֵיל שְׁמַיָּא
  choice: entre o exército dos céus
  rationale: Conserva a imagem coletiva e militar de חֵיל sem restringir a expressão especificamente a anjos ou astros.
- source_word: וְלָא אִיתַי דִּי
  choice: Não há ninguém que possa
  rationale: Representa com clareza a construção existencial e a impossibilidade enfática expressa no aramaico.
- source_word: יְמַחֵא בִידֵהּ
  choice: bater em sua mão
  rationale: Preserva a imagem concreta do texto aramaico; a nota esclarece o sentido idiomático de impedir ou conter.
- source_word: מָה עֲבַדְתְּ
  choice: O que fizeste?
  rationale: A forma verbal portuguesa expressa uma ação realizada e mantém a força da interpelação retórica dirigida ao soberano.
theological_decisions:
- issue: Referente do agente soberano
  choice: Manter o pronome “ele”
  alternative: Explicitar “Deus” ou “o Altíssimo”
  rationale: O contexto identifica o agente como o Altíssimo, mas o versículo emprega um pronome. A tradução não acrescenta um nome divino ausente desta oração.
- issue: Identidade do exército dos céus
  choice: Preservar a expressão genérica “exército dos céus”
  alternative: Especificar anjos, seres celestiais ou astros
  rationale: A expressão aramaica não obriga a escolher entre essas identificações; a tradução conserva sua amplitude e a imagem do original.
- issue: Imagem de bater na mão
  choice: Conservar a imagem no texto e explicar sua função na nota
  alternative: Substituí-la no texto por “conter sua mão” ou “impedi-lo”
  rationale: A formulação mantém a metáfora vívida do aramaico, enquanto a nota fornece seu sentido funcional sem eliminar a imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “São tidos como nada” evita rigidez excessiva; “O que fizeste?” conserva solenidade e precisão na interpelação. O ponto e vírgula organiza o período longo sem enfraquecer sua unidade.
