review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a abrangência de «todos os habitantes da terra», a avaliação de que são «tidos como nada», a vontade soberana do agente e a dupla esfera — a hoste/exército celestial e os habitantes da terra. Contudo, «bater em sua mão» não comunica em português o valor idiomático de יְמַחֵא בִידֵהּ; tende a sugerir meramente tocar ou desferir golpes físicos na mão. «Deter a sua mão» transmite adequadamente a imagem e a função idiomática de impedir sua ação, com a literalidade preservada em nota.
  naturalness: O registro é moderno, solene e amplamente compreensível. «São tidos como nada», «conforme a sua vontade» e «exército dos céus» são formulações naturais. A substituição de «bater em sua mão» por «deter a sua mão» elimina a única construção que soa pouco idiomática e semanticamente imprecisa em português.
  terminology: «Exército dos céus» conserva a força coletiva e militar de חֵיל sem definir a natureza da hoste celestial. A nota mantém, de modo não doutrinário, a alternativa «hoste dos céus» e a amplitude referencial. «Deter a sua mão» é expressão estabelecida para o idiomatismo, enquanto a nota registra a formulação literal.
