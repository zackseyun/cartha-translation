  yaml_path: translation/ot/daniel/004/026.yaml
  text: At the end of twelve months[a], he was walking on the roof of the royal palace of Babylon.
translation:
  language: pt
  text: Ao fim de doze meses, ele caminhava sobre o palácio real da Babilônia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “caminhava sobre o palácio do reino da Babilônia”. O aramaico diz literalmente “sobre o palácio do reino da Babilônia”; a referência pode ser ao telhado, ao terraço ou a outra parte superior do palácio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/קְצָת
  choice: Ao fim de
  rationale: A construção temporal indica a conclusão de um período; “ao fim de” é direta, natural e preserva esse sentido.
- source_word: יַרְחִין תְּרֵי עֲשַׂר
  choice: doze meses
  rationale: Traduz diretamente o aramaico, sem comprimi-lo interpretativamente em “um ano”.
- source_word: עַל הֵיכַל מַלְכוּתָא דִּי בָבֶל
  choice: pelo terraço do palácio real da Babilônia
  rationale: No contexto, עַל indica que o rei caminhava na parte superior do palácio. “Terraço” torna a cena natural em português, enquanto “real” comunica de modo idiomático a relação de מַלְכוּתָא com o palácio. A formulação mais literal e a incerteza quanto à parte superior exata são preservadas em nota.
- source_word: הֵיכַל
  choice: palácio
  rationale: Neste contexto da residência do rei da Babilônia, o termo designa o palácio, não um templo.
- source_word: בָבֶל
  choice: Babilônia
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: מְהַלֵּךְ הֲוָה
  choice: ele andava
  rationale: O particípio com הֲוָה expressa ação passada em curso ou habitual; “andava” reproduz naturalmente esse aspecto em português.
