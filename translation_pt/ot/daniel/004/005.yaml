  text: וְ/עַ֣ד אָחֳרֵ֡ין עַל֩ קָֽדָמַ֨/י דָּנִיֵּ֜אל דִּֽי שְׁמֵ֤/הּ בֵּלְטְשַׁאצַּר֙ כְּ/שֻׁ֣ם אֱלָהִ֔/י וְ/דִ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בֵּ֑/הּ וְ/חֶלְמָ֖/א קָֽדָמ֥וֹ/הִי אַמְרֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/005.yaml
  text: 'At last Daniel came in before me—he whose name was Belteshazzar[a], after the name of my god, and in whom is the spirit of the holy gods—and I told the dream before him:'
translation:
  language: pt
  text: 'Por fim, Daniel veio à minha presença — aquele cujo nome era Beltessazar, segundo o nome do meu deus, e em quem há o espírito dos deuses santos[a] —, e relatei o sonho diante dele:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Espírito do Deus santo” ou “o espírito do Deus santo”. O aramaico admite diferentes interpretações, mas, neste contexto, as palavras do rei refletem mais naturalmente sua perspectiva pagã: “o espírito dos deuses santos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַד אָחֳרֵין
  choice: Por fim
  rationale: Reproduz de modo natural o valor temporal do idioma aramaico, indicando que Daniel compareceu por último.
- source_word: עַל קָדָמַי
  choice: veio à minha presença
  rationale: Preserva a ideia de movimento para diante do rei e o contexto de audiência na corte.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: aquele cujo nome era Beltessazar
  rationale: Mantém a oração relativa que identifica Daniel por seu nome babilônico, com formulação natural em português.
- source_word: כְּשֻׁם אֱלָהִי
  choice: segundo o nome do meu deus
  rationale: Conserva a correspondência explícita com o nome da divindade do rei sem substituir a expressão por uma paráfrase mais interpretativa.
- source_word: וְדִי רוּחַ אֱלָהִין קַדִּישִׁין בֵּהּ
  choice: e em quem há o espírito dos deuses santos
  rationale: Mantém o plural de אֱלָהִין e קַדִּישִׁין e reflete mais naturalmente a perspectiva pagã do rei, sem identificar de modo explícito o referente com o Espírito Santo.
- source_word: וְחֶלְמָא קָדָמוֹהִי אַמְרֵת
  choice: e relatei o sonho diante dele
  rationale: Expressa o ato de contar o sonho e preserva a locução espacial e cortesã “diante dele” presente no aramaico.
theological_decisions:
- issue: Sentido de רוּחַ אֱלָהִין קַדִּישִׁין na fala de Nabucodonosor
  choice: o espírito dos deuses santos
  alternative: o Espírito do Deus santo; o espírito do Deus santo
  rationale: O plural gramatical e a identidade pagã do falante favorecem a leitura politeísta no texto principal. As leituras no singular continuam possíveis e são registradas em nota para preservar a ambiguidade interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com leve tom cortesão em “à minha presença” e “diante dele”. O travessão delimita a explicação sobre a identidade de Daniel sem tornar a frase excessivamente pesada.
