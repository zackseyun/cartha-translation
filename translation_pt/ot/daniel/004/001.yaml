  text: אֲנָ֣ה נְבוּכַדְנֶצַּ֗ר שְׁלֵ֤ה הֲוֵית֙ בְּ/בֵיתִ֔/י וְ/רַעְנַ֖ן בְּ/הֵיכְלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/001.yaml
  text: I[a], Nebuchadnezzar[b], was at ease in my house and flourishing in my palace.
translation:
  language: pt
  text: Eu, Nabucodonosor, estava tranquilo[a] em minha casa e próspero[b] em meu palácio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seguro”; o termo aramaico pode indicar tranquilidade ou segurança.
    reason: lexical_alternative
  - marker: b
    text: Ou “florescente”; o termo transmite vigor, bem-estar e prosperidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנָה
  choice: Eu
  rationale: Pronome independente de primeira pessoa; mantém a estrutura enfática e a aposição com o nome próprio.
- source_word: נְבוּכַדְנֶצַּר
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: שְׁלֵה
  choice: tranquilo
  rationale: Expressa o estado de sossego e bem-estar indicado pelo adjetivo aramaico, sem limitar o sentido à prosperidade material.
- source_word: הֲוֵית
  choice: estava
  rationale: O verbo tem aqui função copulativa e descreve a condição do rei antes do sonho.
- source_word: בְּבֵיתִי
  choice: em minha casa
  rationale: Preserva a imagem concreta e o paralelismo com “em meu palácio”.
- source_word: וְרַעְנַן
  choice: e florescia
  rationale: Reproduz a imagem de vigor, pleno desenvolvimento e bem-estar do termo aramaico, com formulação natural em português.
- source_word: בְּהֵיכְלִי
  choice: em meu palácio
  rationale: No contexto da residência real de Nabucodonosor, “palácio” é o sentido adequado e evita uma associação cultual indevida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção em primeira pessoa e o paralelismo entre casa e palácio foram preservados; “florescia” mantém a imagem do original sem tornar explícita apenas a prosperidade material.
