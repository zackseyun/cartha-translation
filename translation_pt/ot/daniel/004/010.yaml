id: DAN.4.10
reference: Daniel 4:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוֵ֥י רֵאשִׁ֖/י עַֽל מִשְׁכְּבִ֑/י וַ/אֲלוּ֙ עִ֣יר וְ/קַדִּ֔ישׁ מִן שְׁמַיָּ֖/א נָחִֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/010.yaml
  text: I was looking in the visions of my head as I lay on my bed[a], and behold, a watcher, a holy one, came down from heaven.
translation:
  language: pt
  text: Eu contemplava as visões em minha mente enquanto estava deitado na cama; e eis que um vigilante[a], um santo, desceu do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um vigilante angelical»; o aramaico diz literalmente «um vigilante, um santo».
    reason: Alternativa lexical que esclarece tratar-se de um ser celestial sem substituir, no texto principal, a designação aramaica distintiva.
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Eu contemplava
  rationale: O particípio com o verbo «ser» expressa uma percepção contínua no passado. «Eu contemplava» comunica esse aspecto de modo natural e digno.
- source_word: בְּחֶזְוֵי רֵאשִׁי
  choice: as visões em minha mente
  rationale: A expressão aramaica é literalmente «as visões da minha cabeça». «Em minha mente» preserva o sentido de visões interiores sem produzir em português uma formulação estranha ou potencialmente enganosa.
- source_word: עַל מִשְׁכְּבִי
  choice: enquanto estava deitado na cama
  rationale: A formulação explicita naturalmente a circunstância temporal e espacial indicada pelo aramaico.
- source_word: וַאֲלוּ
  choice: e eis que
  rationale: Mantém a partícula que chama a atenção para o aparecimento súbito da figura seguinte, em registro bíblico ainda compreensível.
- source_word: עִיר
  choice: um vigilante
  rationale: Preserva a designação aramaica distintiva para o ser celestial, sem reduzi-la ao termo mais geral «anjo».
- source_word: וְקַדִּישׁ
  choice: um santo
  rationale: O adjetivo substantivado está em aposição a «vigilante» e identifica o mesmo ser como santo.
- source_word: מִן שְׁמַיָּא
  choice: do céu
  rationale: Embora a forma aramaica seja plural, «do céu» é o equivalente idiomático natural neste contexto.
- source_word: נָחִת
  choice: desceu
  rationale: O perfeito aramaico apresenta a descida como acontecimento. «Desceu» é direto e corresponde ao ponto de vista terrestre da narrativa.
theological_decisions:
- issue: Identidade de עִיר וְקַדִּישׁ
  choice: um vigilante, um santo
  alternative: um anjo; um mensageiro celestial
  rationale: A tradução conserva as duas designações do texto em aposição e não identifica o ser de maneira mais específica do que o próprio versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se «e eis que» para reproduzir a mudança enfática de foco e «vigilante» como termo celestial distintivo; «em minha mente» traduz de modo idiomático o aramaísmo literal «da minha cabeça».
