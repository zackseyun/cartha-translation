source:
  edition: WLC
  text: בֵּלְטְשַׁאצַּר֮ רַ֣ב חַרְטֻמַיָּ/א֒ דִּ֣י אֲנָ֣ה יִדְעֵ֗ת דִּ֠י ר֣וּחַ אֱלָהִ֤ין קַדִּישִׁין֙ בָּ֔/ךְ וְ/כָל רָ֖ז לָא אָנֵ֣ס לָ֑/ךְ חֶזְוֵ֨י חֶלְמִ֧/י דִֽי חֲזֵ֛ית וּ/פִשְׁרֵ֖/הּ אֱמַֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/006.yaml
  text: Belteshazzar[a], chief of the magicians, whom I know has the spirit of the holy gods in you, and no mystery is too difficult for you, tell me the visions of my dream that I saw, and its interpretation.
translation:
  language: pt
  text: Beltessazar[a], chefe dos magos, eu sei que o espírito dos deuses santos está em você e que nenhum mistério é difícil demais para você. Diga-me as visões do sonho que tive e a sua interpretação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Espírito do santo Deus”; ou: “o espírito do santo Deus”.'
    reason: Leitura alternativa possível para a expressão aramaica “espírito dos deuses santos”.
lexical_decisions:
- source_word: רַב חַרְטֻמַיָּא
  choice: chefe dos magos
  rationale: O termo designa em Daniel uma classe de sábios da corte babilônica, enquanto רַב indica que Daniel era o chefe deles. “Chefe dos magos” é claro, corrente e adequado ao contexto.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: o espírito dos deuses santos
  rationale: A forma plural de אֱלָהִין e a concordância plural de קַדִּישִׁין favorecem esta leitura, que também condiz com a perspectiva de Nabucodonosor. A possível leitura no singular é preservada em nota.
- source_word: וְכָל רָז לָא אָנֵס לָךְ
  choice: e que nenhum mistério é difícil demais para você
  rationale: רָז designa um segredo ou mistério, especialmente algo que exige revelação ou interpretação. A expressão idiomática indica que nenhum mistério está além da capacidade de Daniel.
- source_word: חֶזְוֵי חֶלְמִי דִי חֲזֵית
  choice: as visões do sonho que tive
  rationale: Mantém o plural “visões” e expressa em português natural que o rei vivenciou o sonho, sem a formulação pouco idiomática “o sonho que vi”.
- source_word: וּפִשְׁרֵהּ אֱמַר
  choice: e a sua interpretação. Diga-me
  rationale: O sufixo pronominal refere-se ao sonho ou ao seu conteúdo visionário; “interpretação” é o termo técnico recorrente em Daniel. A colocação de “Diga-me” no início da oração em português torna clara a força do imperativo sem alterar o sentido.
theological_decisions:
- issue: Se רוּחַ אֱלָהִין קַדִּישִׁין é uma expressão pagã plural ou uma referência singular a Deus
  choice: o espírito dos deuses santos
  alternative: o Espírito do Deus santo; ou, o espírito do Deus santo
  rationale: A morfologia plural e a identidade do falante favorecem a leitura plural no texto principal. Como a expressão também pode ser entendida como referência singular a Deus, essa possibilidade é mantida em nota, sem eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. Conserva o vocabulário cortesão de Daniel e a ambiguidade teológica relevante; usa “você” para uma interlocução natural e respeitosa no português brasileiro contemporâneo.
