  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: pt
  text: Depois, ela permanecerá trinta e três dias no sangue da purificação.[a] Não tocará em nenhuma coisa santa nem entrará no santuário até que se completem os dias de sua purificação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no sangue de sua purificação”. A expressão hebraica é literalmente “nos sangues/no sangue da purificação” e se refere ao período após o parto associado ao sangramento e à purificação ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: trinta e três dias
  rationale: O hebraico enumera literalmente “trinta dias e três dias”; a forma numérica combinada é natural em português e preserva a duração exata.
- source_word: תֵּשֵׁב
  choice: permanecerá
  rationale: Embora o verbo possa significar literalmente “sentar-se” ou “habitar”, aqui indica a continuidade de uma condição durante determinado período.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: no sangue de sua purificação
  rationale: Preserva a imagem concreta e difícil do hebraico, cujo plural formal דְמֵי pode designar sangue ou fluxo de sangue, sem reduzir a expressão a uma paráfrase interpretativa.
- source_word: בְּ/כָל קֹדֶשׁ
  choice: em nenhuma coisa santa
  rationale: Representa o sentido abrangente de “qualquer coisa santa/sagrada” no contexto cultual.
- source_word: לֹא תִגָּע
  choice: não tocará
  rationale: Mantém o tom jurídico da proibição hebraica com uma formulação clara e digna em português.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: nem entrará no santuário
  rationale: O hebraico diz literalmente que ela não virá ao santuário; “entrará no santuário” explicita com naturalidade a relação espacial pretendida.
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: até que se completem os dias de sua purificação
  rationale: Expressa de modo idiomático o limite temporal e conserva tanto a ideia de completar-se quanto o possessivo feminino explícito.
theological_decisions:
- issue: Terminologia de pureza ritual sem sugerir culpa moral
  choice: purificação
  alternative: limpeza
  rationale: O contexto trata da condição ritual após o parto, não afirma culpa moral. “Purificação” conserva a categoria cultual e jurídica do texto.
- issue: Interpretação da expressão difícil בִּדְמֵי טָהֳרָה
  choice: preservar “no sangue de sua purificação” no texto
  alternative: parafrasear como “durante o período de purificação após o sangramento”
  rationale: A formulação literal mantém a ambiguidade e a tensão da expressão hebraica, enquanto a nota esclarece sua referência contextual sem impor uma única análise.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário cultual consistente. O futuro simples mantém o caráter prescritivo da legislação sem recorrer a formulações excessivamente arcaicas.
