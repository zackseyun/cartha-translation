source:
  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: pt
  text: Ele o apresentará diante de Yahweh e fará expiação por ela, e ela ficará purificada da fonte do seu sangue.[a] Esta é a lei para a mulher que dá à luz um menino ou uma menina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do fluxo do seu sangue”. O hebraico diz literalmente “da fonte do seu sangue”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: Ele o apresentará
  rationale: O hifil de קרב, com sufixo de objeto masculino singular, indica que o sacerdote apresenta diante de Deus a oferta mencionada no contexto. “Apresentará” conserva o sentido cultual sem acrescentar detalhes.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão significa “diante de” ou “na presença de”; o nome divino יהוה é transliterado como “Yahweh”.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: fará expiação por ela
  rationale: Em contexto sacerdotal e sacrificial, כפר descreve o ato ritual de fazer expiação. A formulação evita impor uma teoria específica da expiação.
- source_word: וְטָהֲרָה
  choice: assim, ela ficará purificada
  rationale: O perfeito qal com waw sequencial expressa o resultado da ação sacerdotal. “Ficará purificada” comunica a mudança para o estado de pureza ritual.
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: da fonte do seu sangue
  rationale: מָקוֹר significa literalmente “fonte” ou “nascente”. A tradução preserva a imagem hebraica, enquanto a nota registra a interpretação contextual como fluxo de sangue.
- source_word: זֹאת תּוֹרַת
  choice: Esta é a lei para
  rationale: תּוֹרָה designa aqui a prescrição ritual. “Lei” é clara e adequada à fórmula recorrente de Levítico.
- source_word: הַיֹּלֶדֶת
  choice: a mulher que dá à luz
  rationale: O particípio feminino identifica especificamente a mulher em relação ao parto, sem substituí-lo pelo termo mais interpretativo “mãe”.
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: um menino ou uma menina
  rationale: Embora o hebraico use os termos “macho” e “fêmea”, “menino” e “menina” é a forma natural e digna em português para seres humanos recém-nascidos, preservando a distinção sexual do texto.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido de כפר no rito pós-parto
  choice: fará expiação por ela
  alternative: fará purificação por ela
  rationale: “Fazer expiação” mantém a terminologia sacrificial e a tensão do texto, que aplica כפר à mulher nesse contexto ritual, sem reduzir o verbo apenas à purificação física.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a terminologia cultual de Levítico; a sintaxe foi levemente ajustada para fluência, sem apagar a imagem hebraica nem a noção de pureza ritual.
