base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, o Tetragrama; também representado como “Jeová”.'
    reason: Esclarece que YHWH é a forma consonantal hebraica e apresenta uma representação portuguesa alternativa do nome divino, sem redundância com “Yahweh” no texto.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O wayyiqtol de דבר dá continuidade à narrativa e introduz a fala divina. “Falou” é natural em português e corresponde com precisão à fórmula hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; em português, a construção idiomática é “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala. Em português moderno, os dois-pontos desempenham essa função de modo natural, sem o redundante “dizendo” antes do discurso direto que segue.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e uma transliteração acadêmica amplamente aceita, enquanto “Jeová” reflete uma forma tradicional posterior e “SENHOR” substitui o nome por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A conjunção inicial preserva a continuidade narrativa. Os dois-pontos traduzem funcionalmente לֵאמֹר e preparam o discurso do versículo seguinte.
