id: LEV.12.2
reference: Leviticus 12:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: pt
  text: 'Fale aos filhos de Israel, dizendo: Se[a] uma mulher conceber e der à luz um menino[b], ficará impura[c] durante sete dias; ficará impura como nos dias da impureza de sua menstruação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «quando». A partícula hebraica que introduz este caso legal pode ser traduzida das duas maneiras neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «um macho».
    reason: lexical_alternative
  - marker: c
    text: Isto é, em estado de impureza ritual.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva de modo transparente a designação nacional e pactual hebraica, em forma corrente e reconhecível em português.
- source_word: כִּי
  choice: se
  rationale: Introduz o caso previsto pela legislação. «Se» reproduz naturalmente a formulação condicional, embora «quando» também seja possível.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O sentido genérico é o mais adequado neste contexto legal; o hebraico não exige «esposa».
- source_word: תַזְרִיעַ
  choice: conceber
  rationale: Embora o verbo esteja ligado literalmente à ideia de produzir semente, neste contexto de parto o sentido idiomático é conceber.
- source_word: וְיָלְדָה זָכָר
  choice: der à luz um menino
  rationale: Expressa em português natural tanto o ato de dar à luz como o sexo masculino da criança. A nota registra a forma mais literal.
- source_word: וְטָמְאָה ... תִּטְמָא
  choice: ficará impura ... ficará impura
  rationale: Mantém a repetição explícita do hebraico e o registro prescritivo, sem acrescentar «ritualmente» ao texto principal.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A preposição «durante» torna clara e natural em português a duração declarada.
- source_word: נִדַּת דְּוֺתָהּ
  choice: impureza de sua menstruação
  rationale: Comunica a condição de impureza associada ao fluxo menstrual no sistema levítico, evitando expressões arcaicas ou a interpretação indevida de simples enfermidade.
theological_decisions:
- issue: Natureza de טמא na legislação de pureza
  choice: impura
  alternative: ritualmente impura
  rationale: O contexto trata de condição ritual, mas o verbo hebraico declara simplesmente impureza. O texto principal não recebe um qualificativo explicativo ausente do original; a nota esclarece o âmbito.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A formulação preserva a expressão hebraica tradicional e sua referência coletiva ao povo de Israel, sem substituir a imagem de parentesco por uma designação nacional mais genérica.
- issue: Valor condicional ou temporal de כִּי
  choice: se
  alternative: quando
  rationale: A partícula introduz um caso legal e admite ambas as formulações. «Se» preserva com clareza o caráter casuístico, enquanto a nota mantém visível a alternativa temporal legítima.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe jurídica compreensível. A tradução conserva a repetição hebraica de «ficará impura» e a designação «filhos de Israel», enquanto emprega formulações naturais como «conceber» e «dar à luz um menino».
