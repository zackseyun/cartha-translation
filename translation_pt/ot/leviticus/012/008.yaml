id: LEV.12.8
reference: Leviticus 12:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: pt
  text: Mas, se ela não tiver recursos para oferecer um cordeiro, deverá levar duas rolas ou dois pombinhos, um para o holocausto e o outro para a oferta pelo pecado[a]. O sacerdote fará expiação por ela, e ela ficará pura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”; neste contexto, a oferta trata da impureza ritual após o parto.
    reason: Alternativa lexical contextual para חַטָּאת, preservando a distinção entre impureza ritual e culpa moral.
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: não tiver recursos para oferecer um cordeiro
  rationale: A expressão idiomática hebraica indica insuficiência de meios materiais. A formulação comunica isso de modo natural e deixa claro que os recursos dizem respeito à oferta prescrita.
- source_word: שֶׂה
  choice: cordeiro
  rationale: No contexto sacrificial e à luz do versículo anterior, “cordeiro” é a designação natural e específica em português.
- source_word: שְׁתֵּי תֹרִים
  choice: duas rolas
  rationale: תֹרִים designa especificamente rolas; o termo preciso é preservado.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dois pombinhos
  rationale: A construção hebraica designa pombos jovens. “Pombinhos” é corrente na linguagem bíblica em português e distingue esta opção das rolas.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo sacrificial consagrado em português para a oferta inteiramente queimada, mantendo concisão e precisão cultual.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: Preserva a correspondência tradicional e a consistência do termo sacrificial, enquanto a nota registra a alternativa contextual “oferta de purificação”.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: O sacerdote fará expiação por ela
  rationale: Mantém a força cultual-teológica de כפר sem definir além do texto o mecanismo da expiação.
- source_word: וְטָהֵרָה
  choice: ela ficará pura
  rationale: Expressa a restauração à pureza ritual de maneira clara e natural, sem sugerir que o parto constitua culpa moral.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto da purificação após o parto
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O texto principal mantém a designação sacrificial tradicional e consistente, mas a nota preserva a alternativa contextual plausível, pois aqui se trata de impureza ritual após o parto, não necessariamente de transgressão moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega terminologia sacrificial reconhecível (“holocausto”, “oferta pelo pecado”, “expiação”) e formulação natural para a condição econômica da mulher.
