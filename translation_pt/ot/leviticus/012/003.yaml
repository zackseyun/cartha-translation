  text: וּ/בַ/יּ֖וֹם הַ/שְּׁמִינִ֑י יִמּ֖וֹל בְּשַׂ֥ר עָרְלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/003.yaml
  text: And on the eighth day the flesh of his foreskin shall be circumcised[a].
translation:
  language: pt
  text: E, no oitavo dia, a carne do seu prepúcio será circuncidada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais dinâmico: “ele deverá ser circuncidado no oitavo dia”. O hebraico emprega formalmente a voz passiva; o texto principal preserva essa forma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: E, no ... dia
  rationale: A conjunção seguida da expressão temporal introduz a instrução legal seguinte; “E, no ... dia” preserva a sequência e soa natural em português.
- source_word: הַ/שְּׁמִינִי
  choice: oitavo
  rationale: Adjetivo ordinal que modifica “dia”, traduzido pelo equivalente português direto.
- source_word: יִמּוֹל
  choice: será circuncidada
  rationale: O nifal imperfeito masculino singular de מול tem forma passiva e, neste contexto legal, força prescritiva. A concordância no feminino decorre da formulação portuguesa, cujo sujeito é “a carne”.
- source_word: בְּשַׂר
  choice: a carne
  rationale: Equivalente direto de בָּשָׂר, mantendo de perto a expressão corporal concreta do hebraico.
- source_word: עָרְלָת/וֹ
  choice: do seu prepúcio
  rationale: O substantivo significa “prepúcio” e traz sufixo possessivo masculino singular; a construção “a carne do seu prepúcio” reproduz a relação construta do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação deliberadamente próxima da sintaxe hebraica. “Será circuncidada” mantém a voz passiva e comunica a força prescritiva no contexto legal; a nota oferece uma alternativa mais natural centrada no menino.
