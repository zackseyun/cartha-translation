id: LEV.12.5
reference: Leviticus 12:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: pt
  text: Mas, se ela der à luz uma menina, ficará impura por duas semanas, como durante a sua menstruação[a]; depois, permanecerá sessenta e seis dias no período do sangue da purificação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, como durante a condição de impureza ritual associada à menstruação.
    reason: lexical_alternative
  - marker: b
    text: “Sangue da purificação” refere-se ao período prescrito de purificação após o parto, não a culpa moral.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz o caso contrastante em relação ao nascimento de um menino no versículo anterior; em português, “Mas, se” expressa naturalmente essa relação contextual.
- source_word: נְקֵבָה תֵלֵד
  choice: ela der à luz uma menina
  rationale: נְקֵבָה designa uma pessoa do sexo feminino; no contexto do parto, “menina” é claro e natural, enquanto “der à luz” traduz idiomaticamente ילד.
- source_word: וְטָמְאָה
  choice: ficará impura
  rationale: Indica a condição ritual resultante do parto, sem afirmar culpa moral. O futuro mantém o caráter normativo do contexto legal.
- source_word: שְׁבֻעַיִם
  choice: por duas semanas
  rationale: A forma dual indica duas semanas neste contexto.
- source_word: כְּנִדָּתָהּ
  choice: como durante a sua menstruação
  rationale: נִדָּה pode abranger tanto a menstruação quanto a condição ritual associada a ela. A formulação conserva a comparação de modo claro, com a nota explicitando sua dimensão ritual.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: sessenta e seis dias
  rationale: Reúne de forma natural em português a expressão hebraica “sessenta dias e seis dias”, preservando exatamente a quantidade.
- source_word: תֵּשֵׁב
  choice: permanecerá
  rationale: Embora o verbo signifique literalmente “sentar-se” ou “habitar”, aqui denota a continuidade numa condição ou num período prescrito.
- source_word: עַל דְּמֵי טָהֳרָה
  choice: no período do sangue da purificação
  rationale: A expressão hebraica, literalmente “sobre/nos sangues da purificação”, é idiomática. A inclusão de “período” torna inteligível que se trata da fase pós-parto relacionada à purificação, sem reduzir a expressão simplesmente ao sangramento.
theological_decisions:
- issue: Natureza da impureza em Levítico
  choice: Traduzir טמא por “impura” e esclarecer que se trata de condição ritual.
  alternative: “ritualmente impura” no texto principal
  rationale: O hebraico emprega o termo comum da legislação cultual sem acrescentar um advérbio. Manter “impura” preserva a forma do texto, enquanto a nota impede que seja entendida como culpa moral.
- issue: Sentido de דְּמֵי טָהֳרָה
  choice: Manter “sangue da purificação” e esclarecer seu sentido prescrito e pós-parto.
  alternative: “sangue purificado” ou “sangue que purifica”
  rationale: A construção não afirma que o sangue seja moralmente purificado nem que ele efetue purificação. Ela designa o sangue ou período relacionado ao processo ritual de purificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém a terminologia ritual de Levítico sem linguagem excessivamente técnica; as notas esclarecem os conceitos culturais sem inserir distinções denominacionais.
