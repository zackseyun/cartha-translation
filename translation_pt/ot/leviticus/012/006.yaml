source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: pt
  text: Quando se completarem os dias da purificação dela, seja por um filho, seja por uma filha, ela levará um cordeiro de um ano como oferta queimada e um pombinho ou uma rola como oferta pelo pecado[a], ao sacerdote, à entrada da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como oferta de purificação”. O termo hebraico pode designar a oferta usada para remover impureza ritual, não apenas uma oferta relacionada a transgressão moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאת יְמֵי טָהֳרָהּ
  choice: Quando se completarem os dias da purificação dela
  rationale: A construção com בְּ e o infinitivo de מלא indica o momento em que um período chega ao fim. “Purificação” conserva o sentido ritual de טָהֳרָה, e “dela” mantém explícita a referência à mulher.
- source_word: לְבֵן אוֹ לְבַת
  choice: seja por um filho, seja por uma filha
  rationale: A formulação comunica com naturalidade que a prescrição vale nos dois casos, sem acrescentar distinção além da presente no hebraico.
- source_word: תָּבִיא
  choice: ela levará
  rationale: O imperfeito hifil tem força prescritiva neste texto legal. O futuro do indicativo é uma forma natural de expressar essa obrigação em português.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: um cordeiro de um ano
  rationale: Expressa de modo claro e corrente a idade indicada pela expressão idiomática hebraica.
- source_word: לְעֹלָה
  choice: como oferta queimada
  rationale: עֹלָה designa a oferta consumida pelo fogo. “Oferta queimada” é transparente ao leitor moderno e evita as associações contemporâneas potencialmente enganosas de “holocausto”.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: um pombinho ou uma rola
  rationale: בֶּן־יוֹנָה é uma ave jovem, enquanto תֹּר designa especificamente a rola. A tradução preserva a distinção entre as duas opções.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: Mantém a designação sacrificial tradicional de חַטָּאת, ao passo que a nota registra o sentido contextual possível de oferta destinada à purificação ritual.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: ao sacerdote, à entrada da tenda do encontro
  rationale: Identifica tanto o destinatário quanto o lugar da apresentação. “Tenda do encontro” traduz de forma direta e inteligível אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto da purificação após o parto
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: חַטָּאת é o termo técnico tradicionalmente traduzido como “oferta pelo pecado”, mas aqui o rito trata da remoção de impureza ritual após o parto, sem afirmar que o parto seja transgressão moral. A nota conserva essa tensão lexical e contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém o caráter prescritivo da lei e emprega termos cultuais transparentes sem impor uma interpretação denominacional.
