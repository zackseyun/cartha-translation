base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: pt
  text: Quem se deitar na casa deverá lavar suas roupas[a], e quem comer na casa deverá lavar suas roupas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem dormir na casa”. O verbo hebraico pode significar “deitar-se” ou “dormir”; “deitar-se” é mais amplo e se ajusta ao contexto legal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: Quem se deitar
  rationale: O particípio substantivado tem sentido genérico. “Se deitar” preserva o sentido amplo de שׁכב no contexto legal, sem exigir que a pessoa durma.
- source_word: בַּבַּיִת
  choice: na casa
  rationale: Tradução locativa direta, natural e fiel.
- source_word: יְכַבֵּס
  choice: deverá lavar
  rationale: O imperfeito, neste texto legal sacerdotal, exprime obrigação. “Deverá lavar” mantém um registro jurídico claro e atual.
- source_word: אֶת־בְּגָדָיו
  choice: suas roupas
  rationale: בֶּגֶד designa roupa ou vestimenta. “Roupas” é claro e corrente; o possessivo “suas” concorda naturalmente com o pronome genérico “quem” em português.
- source_word: וְהָאֹכֵל
  choice: e quem comer
  rationale: O particípio substantivado também tem alcance genérico. O futuro do subjuntivo é idiomático em português para uma prescrição aplicável a qualquer pessoa que cumpra a condição.
theological_decisions:
- issue: Gênero das formas masculinas singulares genéricas na instrução legal
  choice: Usar “quem ... suas roupas”
  alternative: “aquele que ... as roupas dele”
  rationale: As formas hebraicas são masculinas singulares, mas têm função representativa e genérica. Em português, “quem ... suas roupas” comunica naturalmente esse alcance sem restringir a norma aos homens nem acrescentar uma distinção ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o paralelismo da prescrição hebraica e sua força obrigatória.
