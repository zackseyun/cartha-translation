reference: Leviticus 14:52
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: pt
  text: Assim, ele purificará a casa com o sangue da ave, com a água viva[a], com a ave viva, com madeira de cedro, com hissopo e com fio escarlate[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “água fresca” ou “água corrente”. Em hebraico, literalmente “água viva”, expressão comum para água proveniente de uma fonte fresca e corrente.
    reason: lexical_alternative
  - marker: b
    text: Ou “cordão escarlate”. A expressão hebraica se refere a um material tingido de escarlate usado no rito de purificação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: Assim, ele purificará
  rationale: O piel de חטא, neste contexto ritual, indica purificar ou descontaminar. “Assim” expressa de modo natural a ligação com o procedimento descrito anteriormente.
- source_word: הַבַּיִת
  choice: a casa
  rationale: Refere-se à construção física submetida ao rito de purificação.
- source_word: בְּדַם הַצִּפּוֹר
  choice: com o sangue da ave
  rationale: A preposição בְּ indica aqui o meio empregado no rito; “com” é a formulação natural em português.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: com a água viva
  rationale: A expressão hebraica significa literalmente “água viva” e designa água fresca proveniente de uma fonte corrente. A tradução literal preserva a terminologia ritual e sua ressonância bíblica.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: com a ave viva
  rationale: Distingue esta ave daquela cujo sangue foi empregado no rito e mantém o contraste verbal com “água viva”.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: com madeira de cedro
  rationale: עֵץ seguido de uma espécie arbórea pode designar a madeira dessa árvore usada no rito.
- source_word: וּבָאֵזֹב
  choice: com hissopo
  rationale: “Hissopo” é a designação bíblica tradicional, embora a identificação botânica exata da planta permaneça discutida.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: com fio escarlate
  rationale: A expressão designa material tingido de escarlate, provavelmente fio ou cordão empregado no rito.
theological_decisions:
- issue: Sentido ritual de וְחִטֵּא
  choice: purificará
  alternative: fará expiação pela casa; limpará
  rationale: Neste inventário ritual, o verbo descreve a remoção da impureza da casa. “Purificará” preserva o caráter cultual sem reduzir o ato a uma limpeza comum nem impor uma formulação expiatória mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se “água viva” para preservar a expressão hebraica e “hissopo” como termo ritual bíblico tradicional. Os marcadores de nota foram colocados junto às expressões efetivamente explicadas.
