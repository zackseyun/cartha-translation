  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: pt
  text: Depois, tomarão outras pedras e as colocarão no lugar das pedras[a]; e se tomará outra argamassa[b] e se rebocará a casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “debaixo das pedras”; aqui, a expressão hebraica significa “no lugar das pedras” ou “para substituir as pedras”.
    reason: lexical_alternative
  - marker: b
    text: Ou “outro reboco”; mais literalmente, “outro pó” ou “outra terra”. O hebraico se refere ao material usado para revestir novamente a casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Depois, pegarão
  rationale: O perfeito com waw prossegue a sequência do procedimento. O futuro português expressa naturalmente a instrução, e “Depois” explicita seu valor sequencial.
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: outras pedras
  rationale: Tradução direta que comunica a substituição das pedras retiradas.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: e as colocarão no lugar das pedras removidas
  rationale: Embora הֵבִיאוּ signifique literalmente “trarão”, em português “colocarão” comunica melhor a instalação das pedras. אֶל־תַּחַת indica substituição neste contexto; “removidas” explicita o referente contextual sem alterar o procedimento.
- source_word: וְעָפָר אַחֵר
  choice: outro reboco
  rationale: עָפָר significa literalmente pó ou terra, mas aqui designa o material terroso usado para revestir novamente a casa. “Reboco” é claro e funcional em português, preservando-se a expressão literal em nota.
- source_word: יִקַּח
  choice: se pegará
  rationale: O hebraico muda do plural para o singular masculino, provavelmente com agente indefinido. A construção impessoal com “se” evita introduzir um referente masculino inexistente e mantém a mudança gramatical sem harmonizá-la com o plural anterior.
- source_word: וְטָח אֶת הַבָּיִת
  choice: e se rebocará a casa
  rationale: טוח designa aplicar uma camada de revestimento. “Rebocar” é o verbo português natural neste contexto de reparo da casa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o tom procedural da legislação ritual. As construções impessoais com “se” representam naturalmente o agente singular indefinido dos dois últimos verbos hebraicos.
