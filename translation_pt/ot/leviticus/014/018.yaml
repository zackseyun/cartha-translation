source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: pt
  text: E o que restar do óleo que está na palma da mão do sacerdote, ele porá sobre a cabeça daquele que está sendo purificado; e o sacerdote fará expiação por ele diante de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: E o que restar do óleo
  rationale: O particípio nifal de נותר indica aquilo que sobra ou permanece. “O que restar do óleo” é natural em português, conserva o valor substantivado e expressa adequadamente a relação partitiva.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: que está na palma da mão do sacerdote
  rationale: כַּף designa especificamente a palma da mão. Embora עַל tenha como sentido básico “sobre”, em português o óleo segurado ali está naturalmente “na palma da mão”; a formulação evita a impressão de que se trata das costas da mão.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: ele porá sobre a cabeça
  rationale: נתן pode significar “dar”, “pôr” ou “colocar”. Neste ato ritual, “porá” comunica com precisão a aplicação do óleo, e “sobre a cabeça” corresponde diretamente a עַל רֹאשׁ.
- source_word: הַמִּטַּהֵר
  choice: daquele que está sendo purificado
  rationale: O particípio hitpael de טהר refere-se à pessoa que passa pelo processo ritual de purificação. A construção progressiva preserva o caráter ainda em curso do rito, em vez de apresentar a pessoa como já plenamente purificada.
- source_word: וְכִפֶּר עָלָיו
  choice: e o sacerdote fará expiação por ele
  rationale: Em contextos sacerdotais de Levítico, כפר tem sentido ritual convencionalmente expresso por “fazer expiação”. “Por ele” traduz עָלָיו de modo idiomático sem impor uma teoria específica da expiação.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa “diante de” ou “na presença de”. “Diante de Yahweh” é conciso e conserva o nome divino expresso no texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Sentido ritual de כפר
  choice: fará expiação por ele
  alternative: realizará o rito de purificação por ele; fará propiciação por ele
  rationale: “Fazer expiação” mantém o sentido ritual-teológico amplo do verbo em Levítico, sem reduzi-lo exclusivamente a purificação ou propiciação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a sequência ritual do hebraico, enquanto “na palma da mão” e “daquele que está sendo purificado” oferecem naturalidade sem apagar o aspecto processual do original.
