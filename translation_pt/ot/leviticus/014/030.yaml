  text: וְ/עָשָׂ֤ה אֶת הָֽ/אֶחָד֙ מִן הַ/תֹּרִ֔ים א֖וֹ מִן בְּנֵ֣י הַ/יּוֹנָ֑ה מֵ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: pt
  text: E oferecerá uma das rolas ou um dos pombinhos, conforme os recursos que tiver[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “conforme o que sua mão alcançar”, expressão hebraica que indica aquilo que a pessoa tem condições de oferecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: E oferecerá
  rationale: Embora o verbo signifique literalmente “fazer”, no contexto sacrificial ele se refere à apresentação da oferta; “oferecerá” expressa naturalmente o sentido cultual.
- source_word: אֶת הָאֶחָד
  choice: uma
  rationale: A construção introduz um único animal dentre as alternativas mencionadas; o feminino concorda com “rola”.
- source_word: מִן הַתֹּרִים
  choice: das rolas
  rationale: תֹּרִים designa especificamente rolas na legislação sacrificial, e não pombas em sentido genérico.
- source_word: אוֹ מִן בְּנֵי הַיּוֹנָה
  choice: ou um dos pombinhos
  rationale: A expressão hebraica designa pombos novos. “Pombinhos” é uma forma corrente e concisa em português, e a repetição de “um” torna clara a alternativa.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: conforme os recursos que tiver
  rationale: A expressão significa literalmente “conforme o que sua mão alcançar” e funciona como um idiomatismo relativo à capacidade econômica. A formulação preserva esse sentido em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O travessão final foi preservado porque o versículo continua sintaticamente no versículo seguinte.
