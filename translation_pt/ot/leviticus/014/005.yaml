  yaml_path: translation/ot/leviticus/014/005.yaml
  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: pt
  text: Então o sacerdote ordenará que uma das aves seja abatida sobre água corrente, dentro de um recipiente de barro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “água viva”; também pode significar água fresca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Então ... ordenará
  rationale: O waw com o perfeito, em instrução ritual sequencial, tem força prospectiva; “então” marca a sequência e “ordenará” preserva a autoridade do sacerdote.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כֹּהֵן no contexto cultual e jurídico.
- source_word: וְשָׁחַט
  choice: seja abatida
  rationale: Embora a forma hebraica seja ativa, ela depende naturalmente de “ordenará que”; a construção passiva em português deixa em aberto quem executa a ordem e “abatida” é apropriado ao sacrifício ritual.
- source_word: אֶת־הַצִּפּוֹר הָאֶחָת
  choice: uma das aves
  rationale: A expressão identifica uma ave entre as duas mencionadas no contexto, e esta formulação comunica isso naturalmente.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: sobre um recipiente de barro
  rationale: No contexto, o abate é feito de modo que o sangue caia no recipiente; “sobre” produz uma descrição ritual natural sem sugerir que a ave inteira seja abatida dentro dele.
- source_word: עַל מַיִם חַיִּים
  choice: contendo água fresca
  rationale: Literalmente “sobre águas vivas”; no contexto ritual, designa água não estagnada. “Contendo” torna clara a relação da água com o recipiente sem eliminar a expressão literal, registrada em nota.
theological_decisions:
- issue: Sentido de מַיִם חַיִּים no rito de purificação
  choice: água fresca
  alternative: água viva; água corrente
  rationale: Aqui a expressão descreve a qualidade ou procedência da água usada no rito, sem exigir a importação de simbolismo teológico posterior. A nota conserva tanto a forma literal quanto outra interpretação concreta possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A redação mantém o caráter prescritivo do texto legal e evita vocabulário excessivamente técnico.
