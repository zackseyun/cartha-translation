  yaml_path: translation/ot/leviticus/014/056.yaml
  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: pt
  text: E para o inchaço, para a crosta[a] e para a mancha brilhante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “erupção”, “irritação” ou “descamação”; o sentido dermatológico exato do termo hebraico סַפַּחַת é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “placa brilhante” ou, neste contexto, “mancha branca”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: inchaço
  rationale: No contexto diagnóstico de Levítico 13–14, indica uma área elevada da pele. “Inchaço” é conciso, compreensível e evita interpretar o termo mais especificamente como ferida.
- source_word: סַפַּחַת
  choice: crosta
  rationale: Designa algum tipo de alteração ou erupção cutânea secundária. “Crosta” mantém o vocabulário concreto e tradicional, enquanto a nota registra a incerteza dermatológica.
- source_word: בֶּהֶרֶת
  choice: mancha brilhante
  rationale: O termo destaca o aspecto claro ou brilhante de uma área da pele. “Mancha brilhante” preserva essa ideia sem especificar indevidamente que fosse sempre branca.
- source_word: וְ/לַ
  choice: para ... e para
  rationale: A combinação repetida da conjunção com a preposição continua a enumeração legal dos casos abrangidos pelas instruções; a repetição de “para” preserva essa estrutura.
