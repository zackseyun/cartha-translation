  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: pt
  text: Mas, se ele for pobre e não tiver recursos suficientes[a], pegará um cordeiro macho como oferta pela culpa, para ser movido ritualmente, a fim de fazer expiação por ele; pegará também um décimo de efa de farinha fina misturada com azeite como oferta de cereal e um logue de azeite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “sua mão não alcança”; isto é, ele não dispõe de recursos suficientes.
    reason: lexical_alternative
  - marker: b
    text: O logue era uma pequena medida de volume para líquidos usada na legislação ritual israelita.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: pobre
  rationale: Expressa diretamente a baixa condição econômica indicada pelo hebraico neste contexto legal.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: não tiver recursos suficientes
  rationale: Comunica o sentido econômico da expressão idiomática hebraica, literalmente ligada à mão que não alcança, sem tornar a formulação excessivamente coloquial.
- source_word: כֶּבֶשׂ אֶחָד
  choice: um cordeiro macho
  rationale: Preserva a especificidade de sexo do substantivo hebraico e a precisão exigida pela legislação sacrificial.
- source_word: אָשָׁם
  choice: oferta pela culpa
  rationale: Mantém uma designação cultual reconhecível e distinta, sem restringir o termo a uma teoria específica de reparação.
- source_word: לִתְנוּפָה
  choice: para ser movido ritualmente
  rationale: Indica que o cordeiro da oferta pela culpa é submetido ao rito de apresentação por movimento; evita sugerir que se trata de uma segunda oferta independente.
- source_word: לְכַפֵּר עָלָיו
  choice: a fim de fazer expiação por ele
  rationale: Preserva a força ritual e teológica de כפר sem explicar de modo denominacional como a expiação opera.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: um décimo de efa de farinha fina
  rationale: Explicita a unidade pressuposta no décimo e conserva a medida antiga, de acordo com o uso da legislação sacrificial.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: misturada com azeite
  rationale: É uma formulação natural em português para a combinação ritual da farinha com o azeite.
- source_word: לְמִנְחָה
  choice: como oferta de cereal
  rationale: Distingue com clareza esta categoria sacrificial no contexto levítico.
- source_word: לֹג שָׁמֶן
  choice: um logue de azeite
  rationale: Conserva a unidade líquida técnica antiga; a nota esclarece sua natureza ao leitor moderno.
theological_decisions:
- issue: Terminologia sacrificial na legislação sacerdotal
  choice: 'Manter termos cultuais distintos: “oferta pela culpa”, “fazer expiação” e “oferta de cereal”.'
  alternative: Empregar paráfrases como “oferta de reparação”, “obter perdão” ou simplesmente “oferta”.
  rationale: As escolhas preservam as categorias do texto hebraico e sua tensão teológica sem impor uma explicação doutrinária específica.
- issue: Relação de לִתְנוּפָה com a oferta pela culpa
  choice: “para ser movido ritualmente”
  alternative: “como oferta movida” ou “para apresentação ritual”
  rationale: A construção descreve o rito aplicado ao cordeiro oferecido pela culpa, não necessariamente uma categoria sacrificial separada. A tradução mantém o gesto ritual explícito sem criar uma segunda oferta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi dividida por ponto e vírgula para tornar clara a enumeração dos elementos exigidos, mantendo o tom prescritivo da lei. “Azeite” foi preferido a “óleo” por ser natural neste contexto e corresponder ao produto ritual de oliva.
