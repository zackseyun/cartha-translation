  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: pt
  text: A pessoa que está sendo purificada[a] lavará as suas roupas, rapará todos os pelos do corpo e se banhará em água; então ficará pura. Depois, poderá entrar no acampamento[b], mas ficará fora da sua tenda durante sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que está sendo limpa». O hebraico se refere à pessoa que passa pelo processo prescrito de purificação ritual.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «entrará no acampamento». A forma hebraica pode ser entendida como futuro simples ou como permissão; o contexto sugere que a pessoa recebe autorização para voltar, embora ainda esteja sujeita a restrições.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: a pessoa que está sendo purificada
  rationale: O particípio hitpael designa quem passa pelo processo prescrito de purificação ritual. A construção evita sugerir que a pessoa realiza por si mesma todo o processo.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: lavará as suas roupas
  rationale: כִּבֵּס é usado com frequência para a lavagem de peças de vestuário; «roupas» é atual e claro.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: rapará todos os pelos do corpo
  rationale: שֵׂעָר pode abranger os pelos em geral, e o contexto ritual exige remoção completa. «Do corpo» evita que o leitor entenda apenas os cabelos da cabeça.
- source_word: רָחַץ בַּמַּיִם
  choice: se banhará em água
  rationale: No contexto, o verbo se refere à lavagem do corpo e se distingue da lavagem das roupas mencionada antes.
- source_word: וְטָהֵר
  choice: então ficará pura
  rationale: Expressa o estado ritual resultante das ações anteriores, mantendo a sequência do hebraico.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: poderá entrar no acampamento
  rationale: 'O imperfeito pode indicar a entrada subsequente ou permitida. A formulação permissiva se ajusta ao contexto: a pessoa volta ao acampamento, mas ainda enfrenta uma restrição.'
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: mas ficará fora da sua tenda
  rationale: יָשַׁב aqui indica permanência temporária. «Mas» explicita em português o contraste contextual entre entrar no acampamento e ainda não voltar à própria tenda.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Forma portuguesa natural para indicar a duração do período.
theological_decisions:
- issue: Natureza da linguagem de pureza
  choice: «purificada» e «pura» em sentido ritual
  alternative: «limpa» e «limpo»
  rationale: O contexto trata da restauração ao estado de pureza ritual segundo as prescrições levíticas, não de purificação moral interior.
- issue: Valor modal de יָבֹא
  choice: «poderá entrar»
  alternative: «entrará»
  rationale: O contexto permite entender a forma verbal como autorização para voltar ao acampamento, embora a pessoa ainda deva permanecer fora da própria tenda. A nota preserva a leitura de futuro simples.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Pessoa» evita marcar desnecessariamente o sexo do participante; a concordância no feminino é gramatical. «Pelos do corpo» comunica a abrangência de שְׂעָרוֹ com mais precisão do que «cabelo». Mantém-se a terminologia de pureza ritual sem moralizar o texto.
