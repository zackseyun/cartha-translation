  source_fidelity: 'A tradução preserva a sequência ritual do hebraico: lavagem das roupas, remoção completa dos pelos, banho em água, aquisição de pureza ritual, retorno ao acampamento e permanência fora da própria tenda por sete dias. «Poderá entrar» representa de modo defensável o valor permissivo contextual de יָבֹא, e a nota mantém a alternativa de futuro simples.'
