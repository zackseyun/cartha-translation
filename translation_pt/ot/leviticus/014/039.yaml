  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: pt
  text: No sétimo dia, o sacerdote voltará para examinar a casa. Se constatar que a praga se espalhou pelas paredes da casa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: voltará
  rationale: Expressa naturalmente o retorno do sacerdote, com valor futuro no contexto das instruções legais.
- source_word: וְרָאָה
  choice: para examinar a casa
  rationale: O verbo significa literalmente “ver”, mas aqui denota inspeção; “examinar” comunica a função contextual. “A casa” é explicitada em português a partir do contexto imediato.
- source_word: הַנֶּגַע
  choice: a praga
  rationale: Mantém a designação ampla usada no rito levítico para a afecção ou sinal que atinge pessoas, roupas e casas, sem impor uma identificação médica moderna.
- source_word: פָשָׂה
  choice: se espalhou
  rationale: Reproduz o sentido de propagação ou avanço da praga.
- source_word: בְּקִירֹת הַבָּיִת
  choice: pelas paredes da casa
  rationale: Forma idiomática em português para indicar que a praga avançou na superfície ou extensão das paredes.
theological_decisions:
- issue: Natureza da נגע na casa
  choice: praga
  alternative: infecção; mancha
  rationale: “Praga” preserva a categoria ritual abrangente do hebraico e evita reduzir o fenômeno a uma infecção biológica ou a uma simples descoloração.
- issue: Relação de וְהִנֵּה com a condição seguinte
  choice: Se constatar que
  alternative: e eis que; e se
  rationale: No contexto da inspeção legal, a construção introduz o resultado observado e a condição para a medida subsequente. A redação conserva o caráter condicional sem reproduzir de modo artificial o hebraísmo “e eis que”.
translation_notes:
  register: Português moderno, claro e digno, com estrutura adequada a uma instrução legal. O versículo termina com vírgula porque a condição continua no versículo seguinte.
