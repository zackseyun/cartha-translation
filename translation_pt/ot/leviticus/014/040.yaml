base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: pt
  text: Então o sacerdote ordenará que retirem as pedras em que está a mancha[a] e as lancem fora da cidade, para um lugar impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as pedras que têm a mancha nelas”. A expressão hebraica é literalmente “as pedras em que está a mancha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Então ... ordenará
  rationale: O waw com o perfeito dá continuidade à sequência ritual com valor prospectivo; “Então” expressa naturalmente a etapa seguinte, e “ordenará” preserva a força normativa.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente de כֹּהֵן no contexto ritual levítico, preservando o artigo definido.
- source_word: וְחִלְּצוּ
  choice: que retirem
  rationale: O verbo indica extrair ou remover; no contexto das pedras de uma casa, “retirem” é claro e natural sem especificar em excesso o método.
- source_word: הָאֲבָנִים
  choice: as pedras
  rationale: Tradução direta e suficiente; o contexto deixa claro que se trata de pedras da construção.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: em que está a praga
  rationale: Mantém de perto a construção locativa hebraica e emprega “praga” como termo amplo para o נֶגַע ritual que atinge a casa, sem identificá-lo com um diagnóstico moderno específico.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: e as lancem
  rationale: “Lancem” preserva a ação deliberada de השליך em registro digno e atual; o pronome retoma explicitamente as pedras.
- source_word: אֶל מִחוּץ לָעִיר
  choice: fora da cidade
  rationale: Expressa de modo idiomático o movimento para um local exterior à cidade.
- source_word: אֶל מָקוֹם טָמֵא
  choice: em um lugar impuro
  rationale: “Impuro” comunica a categoria ritual de טָמֵא com clareza em português moderno, sem sugerir mera sujeira física.
theological_decisions:
- issue: Terminologia da pureza levítica
  choice: “impuro” para טָמֵא e “praga” para נֶגַע
  alternative: “imundo” para טָמֵא; “infecção”, “mancha” ou “mofo” para נֶגַע
  rationale: O texto trata de uma categoria ritual e de uma manifestação cuja natureza física exata não é definida. “Impuro” preserva a categoria cultual, enquanto “praga” mantém a amplitude do termo hebraico e evita impor um diagnóstico moderno.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o caráter sequencial e normativo da instrução ritual e preserva a construção locativa do hebraico.
