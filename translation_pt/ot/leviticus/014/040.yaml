review_pass:
  verdict: revise
  source_fidelity: A sequência normativa, o sacerdote, a remoção das pedras e seu descarte fora da cidade estão corretamente representados. Contudo, «em um lugar impuro» enfraquece o valor direcional de אֶל («para»). Além disso, «praga» pode sugerir uma calamidade generalizada; «mancha» comunica melhor o נֶגַע visível e ritualmente relevante no contexto de uma casa, sem impor diagnóstico moderno.
  naturalness: O texto é claro e fluente. «Para um lugar impuro» é mais natural para o destino do lançamento do que «em um lugar impuro». «Mancha» é corrente e compreensível neste contexto.
  terminology: «Sacerdote» e «impuro» são adequados ao registro ritual levítico. «Mancha» preserva a amplitude de נֶגַע melhor do que «praga» neste contexto material; a nota mantém a construção locativa hebraica e uma alternativa idiomática.
  issues:
  - severity: medium
    issue: A preposição «em» em «em um lugar impuro» não preserva plenamente o movimento indicado por אֶל.
    rationale: As pedras devem ser lançadas para um destino situado fora da cidade; «para um lugar impuro» explicita esse valor direcional.
  - severity: low
    issue: «Praga» pode ser entendido como flagelo ou calamidade, e não como a manifestação localizada nas pedras.
    rationale: נֶגַע designa aqui uma marca/afecção cuja identificação física não é especificada. «Mancha» é mais preciso no contexto e evita tanto uma leitura de calamidade quanto um diagnóstico científico.
  revised_text: Então o sacerdote ordenará que retirem as pedras em que está a mancha[a] e as lancem fora da cidade, para um lugar impuro.
  revised_footnotes:
