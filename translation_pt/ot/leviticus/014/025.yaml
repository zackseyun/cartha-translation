base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: pt
  text: Então abaterá o cordeiro da oferta pela culpa, e o sacerdote pegará um pouco do sangue da oferta pela culpa e o porá no lóbulo da orelha direita daquele que está sendo purificado, no polegar da sua mão direita e no dedo grande do seu pé direito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁחַט
  choice: sacrificará
  rationale: No contexto ritual, indica abater o animal para o sacrifício; “sacrificará” comunica naturalmente em português tanto o ato quanto sua finalidade cultual.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: o cordeiro da oferta pela culpa
  rationale: 'Preserva a relação construta: trata-se do cordeiro destinado à oferta específica chamada אָשָׁם.'
- source_word: אָשָׁם
  choice: oferta pela culpa
  rationale: Designa aqui uma categoria sacrificial específica, não a culpa em sentido abstrato. A formulação é clara e tradicionalmente reconhecível em português.
- source_word: מִדַּם הָאָשָׁם
  choice: um pouco do sangue da oferta pela culpa
  rationale: 'Expressa o valor partitivo de מִן: o sacerdote usa apenas parte do sangue.'
- source_word: תְּנוּךְ אֹזֶן
  choice: lóbulo da orelha
  rationale: O termo se refere à extremidade externa da orelha; “lóbulo” é a equivalência anatômica mais natural no contexto ritual.
- source_word: הַמִּטַּהֵר
  choice: daquele que está sendo purificado
  rationale: O particípio hitpael retrata a pessoa que passa pelo processo ritual de purificação.
- source_word: בֹּהֶן יָדוֹ
  choice: polegar da sua mão
  rationale: Com יָד, בֹּהֶן designa especificamente o polegar.
- source_word: בֹּהֶן רַגְלוֹ
  choice: dedão do seu pé
  rationale: Com רֶגֶל, בֹּהֶן designa o dedo maior do pé; “dedão” é amplamente compreensível e natural no português moderno.
- source_word: הַיְמָנִית
  choice: direita/direito
  rationale: Mantém explicitamente o lado indicado para a orelha, a mão e o pé.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão e preciso para o oficiante cultual.
theological_decisions:
- issue: Sentido do termo sacrificial אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: “Oferta pela culpa” conserva a ligação lexical com culpa e identifica uma oferta levítica específica, sem reduzir seu sentido exclusivamente à reparação nem importar uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe procedural natural. A repetição de “oferta pela culpa” foi mantida por precisão ritual. “Está sendo purificado” preserva o processo em andamento expresso pelo particípio hebraico.
