base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: pt
  text: E ele matará o cordeiro no lugar onde se matam a oferta pelo pecado[a] e o holocausto, no lugar santo; pois a oferta pela culpa[b], tal como a oferta pelo pecado, pertence ao sacerdote; é coisa santíssima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «oferta de purificação»; o hebraico חַטָּאת pode enfatizar a função purificadora do rito na legislação sacerdotal.
    reason: lexical_alternative
  - marker: b
    text: Ou «oferta de reparação»; o hebraico אָשָׁם pode destacar o aspecto de reparação ou restituição ligado à oferta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: E ele matará
  rationale: שׁחט é o verbo habitual para o abate ritual. Em português, «matará» é natural no contexto, enquanto a formulação e o vocabulário sacrificial preservam seu sentido técnico.
- source_word: הַכֶּבֶשׂ
  choice: o cordeiro
  rationale: כֶּבֶשׂ designa um cordeiro, frequentemente macho jovem na legislação sacrificial; o contexto imediato identifica o animal exigido.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: no lugar onde se matam
  rationale: O imperfeito singular pode ter valor genérico ou impessoal em instrução legal. A construção com «se» transmite em português a prática prescrita sem identificar indevidamente um agente específico.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: חַטָּאת é o nome tradicional e reconhecível desta categoria sacrificial; a alternativa «oferta de purificação», que realça a função ritual, é mantida em nota.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עֹלָה designa a oferta inteiramente queimada. «Holocausto» é o termo bíblico convencional em português e funciona aqui como categoria técnica sacrificial.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: no lugar santo
  rationale: O artigo hebraico aponta para a área sagrada determinada para o abate; «no lugar santo» preserva essa referência definida sem confundi-la necessariamente com o compartimento do santuário chamado Lugar Santo.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: pois, assim como a oferta pelo pecado, a oferta pela culpa pertence ao sacerdote
  rationale: A frase estabelece uma analogia entre as duas ofertas e indica o direito sacerdotal por meio de לַכֹּהֵן. «Pertence ao sacerdote» comunica isso com clareza.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: É coisa santíssima
  rationale: A construção superlativa hebraica é uma classificação ritual técnica. «Coisa santíssima» expressa seu gênero gramatical e evita fazer parecer que a frase descreve apenas um grau subjetivo de santidade.
theological_decisions:
- issue: Tradução de חַטָּאת na legislação sacrificial sacerdotal
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode salientar tanto a relação com o pecado quanto a função purificadora do rito. O texto principal conserva a categoria tradicional e inteligível, enquanto a nota registra a alternativa lexical significativa.
- issue: Tradução de אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: «Oferta pela culpa» preserva a categoria sacrificial convencional e sua relação explícita com חַטָּאת. «Oferta de reparação» destaca a dimensão de restituição, mas não esgota todos os usos do termo.
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial reconhecível. A sintaxe impessoal «onde se matam» reproduz o valor genérico da forma hebraica. Os marcadores [a] e [b] aparecem imediatamente após os termos a que se referem.
