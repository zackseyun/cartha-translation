source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: pt
  text: Então o sacerdote oferecerá a oferta pelo pecado e fará expiação por aquele que está sendo purificado de sua impureza[a]. Depois, imolará o holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חַטָּאת pode designar a oferta empregada em ritos de purificação em Levítico.
    reason: Alternativa lexical que preserva a possível função purificadora do sacrifício neste contexto.
lexical_decisions:
- source_word: וְעָשָׂה
  choice: oferecerá
  rationale: Embora o verbo signifique literalmente “fazer”, em contexto sacrificial pode indicar a realização ou apresentação de um sacrifício; “oferecerá” expressa naturalmente esse sentido ritual.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso do substantivo definido neste contexto ritual.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: Aqui חַטָּאת designa a oferta sacrificial, não apenas o pecado. A formulação preserva o termo tradicional e reconhecível, enquanto a alternativa contextual é registrada em nota.
- source_word: וְכִפֶּר עַל
  choice: fará expiação por
  rationale: Mantém a força ritual e teológica de כפר sem impor uma teoria específica da expiação; “por” indica a pessoa em favor de quem o rito é realizado.
- source_word: הַמִּטַּהֵר
  choice: aquele que está sendo purificado
  rationale: O particípio hitpael refere-se à pessoa que passa pelo processo de purificação ritual. A construção progressiva preserva o caráter ainda em curso do processo.
- source_word: מִטֻּמְאָתוֹ
  choice: de sua impureza
  rationale: טֻמְאָה indica impureza, especialmente ritual, em Levítico. “Sua” conserva a referência singular do sufixo hebraico sem tornar o português desnecessariamente pesado.
- source_word: וְאַחַר
  choice: Depois
  rationale: Marca com clareza a sequência das ações prescritas.
- source_word: יִשְׁחַט
  choice: sacrificará
  rationale: No contexto cultual, o verbo descreve o abate de um animal sacrificial. “Sacrificará” é natural em português e mantém explícito o contexto ritual.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo bíblico tradicional em português para a oferta inteiramente queimada e funciona aqui como designação técnica do sacrifício.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto sacrificial levítico
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo funciona como nome técnico de um sacrifício. “Oferta pelo pecado” preserva a designação tradicional e amplamente reconhecida, mas “oferta de purificação” é uma leitura contextual plausível, sobretudo porque o rito trata de impureza; por isso, a alternativa é mantida em nota.
- issue: Natureza da impureza em מִטֻּמְאָתוֹ
  choice: impureza
  alternative: impureza ritual
  rationale: O contexto deixa claro que se trata de condição ritual. A tradução não acrescenta “ritual” ao texto principal, evitando explicitação desnecessária, mas conserva o sentido cultual do termo.
translation_notes:
  register: Português moderno, claro e digno, com terminologia cultual reconhecível. “Está sendo purificado” conserva o processo expresso pelo particípio; “holocausto” é empregado em seu sentido sacrificial bíblico tradicional.
