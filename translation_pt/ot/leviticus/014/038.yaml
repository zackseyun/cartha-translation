  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: pt
  text: Então o sacerdote sairá da casa, irá até a entrada dela e fechará a casa por sete dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “impedirá o acesso à casa por sete dias”. O verbo hebraico pode indicar que se fecha ou restringe o acesso durante um período de inspeção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Então ... sairá
  rationale: Em material jurídico-procedimental, o waw com qatal faz avançar a sequência. “Então” expressa naturalmente essa progressão, e o futuro mantém o valor prescritivo.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão de כֹּהֵן no contexto das leis levíticas, preservando o artigo definido.
- source_word: מִן הַבַּיִת
  choice: da casa
  rationale: Com o verbo “sair”, a preposição “de” expressa de modo natural a procedência e preserva a definição do substantivo.
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: irá até a entrada dela
  rationale: פֶּתַח designa a entrada ou abertura. A retomada pronominal evita a repetição pouco natural de “casa” sem alterar o referente; “irá” explicita em português o movimento inerente à construção hebraica.
- source_word: וְהִסְגִּיר
  choice: e fechará
  rationale: O hifil de סגר indica fechar ou impedir o acesso à casa durante o período determinado. “Fechará” é claro e não introduz a interpretação mais específica de “colocará em quarentena”.
- source_word: אֶת הַבַּיִת
  choice: a casa
  rationale: O marcador de objeto direto não recebe tradução; o substantivo definido é vertido diretamente.
- source_word: שִׁבְעַת יָמִים
  choice: por sete dias
  rationale: “Por” expressa de forma idiomática a duração em português.
