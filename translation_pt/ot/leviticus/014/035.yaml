  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: pt
  text: 'Então o dono da casa virá e informará ao sacerdote: “Parece-me haver na casa algo como uma praga[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como uma afecção/praga”. O dono relata apenas uma condição aparente, não um diagnóstico definitivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Então ... virá
  rationale: O perfeito com waw em contexto legal e processual indica a etapa seguinte do procedimento. “Então” explicita a sequência, e o futuro mantém o valor prescritivo.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: o dono da casa
  rationale: A expressão significa literalmente “aquele a quem pertence a casa”. “O dono da casa” é natural, claro e fiel à ideia de posse.
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: informará ao sacerdote
  rationale: O hifil de נגד significa dar a conhecer ou comunicar. “Informará” preserva o caráter oficial da comunicação sem soar excessivamente técnico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português, os dois-pontos introduzem a fala direta de modo mais natural do que a reprodução explícita de “dizendo”, sem perda de conteúdo discursivo.
- source_word: כְּנֶגַע
  choice: algo parecido com uma praga
  rationale: A preposição כ־ expressa semelhança ou aproximação, mostrando que o morador não faz um diagnóstico definitivo. “Praga” mantém o tom formal e a terminologia característica de נגע neste contexto levítico.
- source_word: נִרְאָה לִי
  choice: apareceu
  rationale: O nifal de ראה descreve aquilo que se tornou visível ou apareceu ao observador. Em português, “apareceu” expressa naturalmente a constatação visual, enquanto a limitação do diagnóstico já está preservada por “algo parecido com”.
- source_word: בַּבָּיִת
  choice: na casa
  rationale: A preposição ב־ localiza a condição na estrutura da casa; “na casa” é a formulação portuguesa mais ampla e natural.
theological_decisions: []
