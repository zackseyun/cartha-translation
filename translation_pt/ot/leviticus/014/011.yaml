source:
  edition: WLC
  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: pt
  text: O sacerdote que realiza a purificação apresentará o homem que está sendo purificado, juntamente com essas coisas, diante de Yahweh, à entrada da tenda do encontro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: apresentará
  rationale: O hifil de עמד indica fazer alguém ou algo ficar de pé diante de Yahweh num contexto ritual. “Apresentará” exprime naturalmente esse ato formal em português.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: o sacerdote que realiza a purificação
  rationale: O particípio de טהר descreve o papel ritual do sacerdote no processo. A formulação evita sugerir purificação moral e abrange mais do que uma simples declaração de pureza.
- source_word: הָאִישׁ
  choice: o homem
  rationale: O hebraico emprega explicitamente o substantivo masculino singular אִישׁ, aqui preservado.
- source_word: הַמִּטַּהֵר
  choice: que está sendo purificado
  rationale: A forma hitpael, neste contexto, retrata o homem submetido ao processo de purificação ritual. A construção progressiva comunica que o processo ainda está em curso.
- source_word: וְאֹתָם
  choice: juntamente com essas coisas
  rationale: O pronome masculino plural retoma os elementos materiais especificados no versículo anterior. “Essas coisas” torna claro o referente sem alterar o sentido contextual.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a linguagem cultual de comparecer na presença divina e translitera o nome próprio da aliança.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Tradução clara e convencional da localização do santuário; “tenda do encontro” comunica a função de אֹהֶל מוֹעֵד em português corrente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem o substituir por um título.
- issue: Natureza da purificação
  choice: linguagem de purificação ritual
  alternative: linguagem que poderia sugerir limpeza física ou pureza moral
  rationale: O contexto de Levítico 14 trata de um processo cerimonial. “Realiza a purificação” e “está sendo purificado” conservam essa dimensão sem resolver além do texto a relação entre o sacerdote e a condição do homem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, mantendo o paralelismo entre o sacerdote que realiza a purificação e o homem que está sendo purificado.
