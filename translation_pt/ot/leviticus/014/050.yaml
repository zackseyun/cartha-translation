base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/050.yaml
  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: pt
  text: Então ele degolará uma das aves sobre água corrente[a], em um recipiente de barro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “água viva”; isto é, água fresca de uma fonte ou água corrente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Então ele matará
  rationale: O verbo com וְ dá continuidade à sequência de instruções rituais; o futuro em português expressa naturalmente a prescrição, e “matará” é claro sem atribuir caráter sacrificial não explicitado aqui.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: uma das aves
  rationale: A expressão distingue uma ave da outra mencionada no contexto. “Uma das aves” é natural em português e não introduz a ideia de que se trata da primeira.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: dentro de um recipiente de barro
  rationale: Neste contexto, אֶל indica que o abate é feito de modo que o sangue caia no recipiente; כְּלִי חֶרֶשׂ designa um recipiente feito de barro.
- source_word: עַל מַיִם חַיִּים
  choice: sobre água corrente
  rationale: Literalmente, “sobre águas vivas”. No uso ritual, a expressão indica água de fonte ou em movimento, não estagnada; “água corrente” comunica esse sentido com clareza.
theological_decisions:
- issue: Sentido de מַיִם חַיִּים no rito de purificação
  choice: água corrente
  alternative: água viva
  rationale: O contexto pede uma especificação concreta da água usada no rito. A tradução principal explicita o sentido idiomático, enquanto a nota preserva a formulação literal e sua ressonância bíblica.
translation_notes:
  register: Português moderno, claro e digno, com construção procedural natural. A ordem “sobre água corrente, dentro de um recipiente de barro” evita sugerir que a ave é colocada dentro do vaso para ser morta, deixando claro que o sangue cai na água contida nele.
