  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: pt
  text: Ele aspergirá sete vezes sobre aquele que está sendo purificado da doença de pele[a], o declarará puro[b] e soltará a ave viva em campo aberto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “lepra”. O termo hebraico abrange diversas afecções de pele em Levítico e não indica necessariamente a hanseníase moderna.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o purificará”. O ato do sacerdote tem caráter ritual e judicial, não apenas médico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Ele aspergirá
  rationale: O hifil de נזה, em contexto ritual, indica aspergir ou borrifar um líquido. O objeto permanece implícito, como no hebraico, e é recuperado do rito descrito no contexto anterior.
- source_word: הַמִּטַּהֵר
  choice: aquele que está sendo purificado
  rationale: O particípio hitpael de טהר apresenta a pessoa no decorrer do processo ritual de purificação, não apenas como alguém já puro.
- source_word: מִן הַצָּרַעַת
  choice: da doença de pele
  rationale: צָרַעַת designa em Levítico uma categoria mais ampla de afecções que causam impureza ritual e não corresponde necessariamente à hanseníase moderna.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Equivalência direta e natural da expressão numérico-adverbial hebraica.
- source_word: וְטִהֲרוֹ
  choice: o declarará puro
  rationale: No contexto sacerdotal, a forma verbal pode expressar o ato ritual e judicial de reconhecer ou declarar a condição de pureza. A nota preserva a possibilidade de entender o verbo como efetuação da purificação.
- source_word: וְשִׁלַּח
  choice: soltará
  rationale: שׁלח pode significar enviar ou libertar; aqui descreve naturalmente a soltura da ave viva como parte do rito.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: a ave viva
  rationale: A expressão distingue esta ave daquela que foi morta no versículo anterior.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: em campo aberto
  rationale: A expressão idiomática descreve a extensão aberta do campo; esta formulação preserva a ideia espacial sem reproduzir de modo artificial o hebraísmo 'sobre a face do campo'.
theological_decisions:
- issue: Sentido de צָרַעַת
  choice: doença de pele
  alternative: lepra
  rationale: A categoria levítica é mais ampla que a hanseníase moderna; a escolha evita impor ao texto uma identificação médica anacrônica.
- issue: Força ritual de וְטִהֲרוֹ
  choice: o declarará puro
  alternative: o purificará
  rationale: A formulação principal evidencia a função sacerdotal de determinar formalmente a pureza ritual, enquanto a nota mantém a possível leitura causativa do verbo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. Emprega “aspergir” por sua precisão no contexto ritual e evita terminologia médica anacrônica.
