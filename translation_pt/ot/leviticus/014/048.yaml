  text: וְ/אִם בֹּ֨א יָבֹ֜א הַ/כֹּהֵ֗ן וְ/רָאָה֙ וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ/בַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת הַ/בָּ֑יִת וְ/טִהַ֤ר הַ/כֹּהֵן֙ אֶת הַ/בַּ֔יִת כִּ֥י נִרְפָּ֖א הַ/נָּֽגַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: pt
  text: Mas, se o sacerdote entrar e examinar, e constatar que a afecção[a] não se espalhou na casa depois que ela foi rebocada, o sacerdote declarará a casa pura, pois a afecção foi curada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «praga» ou «mancha». O termo hebraico designa a condição nociva que atingia a casa, sem identificar sua natureza segundo categorias modernas.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega literalmente linguagem de cura para descrever o fim da afecção da casa.
    reason: metaphor_clarification
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz a alternativa condicional em contraste com o caso anterior, de modo natural no contexto legal.
- source_word: בֹּא יָבֹא
  choice: entrar
  rationale: A construção intensiva hebraica salienta a entrada efetiva do sacerdote; em português, o verbo simples comunica com naturalidade a etapa do procedimento.
- source_word: וְרָאָה וְהִנֵּה
  choice: examinar, e constatar que
  rationale: No contexto, a visão é uma inspeção sacerdotal, e הִנֵּה chama atenção para o resultado observado. A formulação preserva essa função sem recorrer ao arcaizante «e eis».
- source_word: לֹא פָשָׂה
  choice: não se espalhou
  rationale: פשה indica a propagação da afecção, tanto nas leis sobre pessoas quanto nas relativas a casas.
- source_word: הַנֶּגַע
  choice: a afecção
  rationale: נגע designa a condição nociva que atinge a casa. «Afecção» evita tanto a associação epidêmica de «praga» quanto uma identificação excessivamente específica com mofo ou fungo.
- source_word: בַּבַּיִת
  choice: na casa
  rationale: Reproduz diretamente a preposição hebraica e indica o âmbito em que a afecção poderia ter-se espalhado.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: depois que ela foi rebocada
  rationale: טוח se refere à aplicação de reboco ou revestimento, conforme o procedimento descrito no contexto imediato.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבָּיִת
  choice: o sacerdote declarará a casa pura
  rationale: No procedimento sacerdotal, טהר expressa o reconhecimento ou pronunciamento do estado de pureza, não uma nova limpeza física realizada pelo sacerdote.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: pois a afecção foi curada
  rationale: Mantém a metáfora de cura presente em רפא, mesmo quando aplicada à afecção de uma construção.
theological_decisions:
- issue: Declaração ritual ou limpeza física em וְטִהַר
  choice: o sacerdote declarará a casa pura
  alternative: o sacerdote purificará a casa
  rationale: O contexto apresenta o sacerdote inspecionando e determinando o estado ritual da casa. A tradução escolhida evita sugerir que ele executa nesse momento outra limpeza material.
- issue: Linguagem de cura aplicada à casa
  choice: a afecção foi curada
  alternative: a afecção desapareceu
  rationale: A redação conserva a personificação ou metáfora do hebraico e não reduz o sentido à mera ausência visível da afecção.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. «Rebocada» preserva a ação concreta do procedimento; «declarará ... pura» explicita a função sacerdotal sem acrescentar uma interpretação denominacional.
