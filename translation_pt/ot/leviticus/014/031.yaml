id: LEV.14.31
reference: Leviticus 14:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: pt
  text: 'aquilo que estiver ao alcance de seus recursos[a]: uma como oferta pelo pecado[b] e a outra como holocausto, junto com a oferta de cereal. Assim, o sacerdote fará expiação pela pessoa que está sendo purificada diante de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “aquilo que sua mão alcançar”; isto é, aquilo que estiver dentro de suas possibilidades.
    reason: lexical_alternative
  - marker: b
    text: Ou “oferta de purificação”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: aquilo que estiver ao alcance de seus recursos
  rationale: O idioma hebraico significa literalmente “aquilo que sua mão alcançar” e indica a capacidade econômica da pessoa. A formulação comunica esse sentido em português natural.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: Termo sacrificial tradicional e reconhecível, que preserva a relação do sacrifício com o pecado sem excluir sua função de purificação ritual.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo bíblico corrente em português para a oferta inteiramente queimada, correspondente ao sacrifício que “sobe” em fumaça.
- source_word: עַל הַמִּנְחָה
  choice: junto com a oferta de cereal
  rationale: Neste procedimento sacrificial, עַל expressa acompanhamento ou adição; “junto com” evita uma leitura espacial inadequada.
- source_word: וְכִפֶּר
  choice: fará expiação
  rationale: Preserva a força cultual e teológica de כפר sem especificar uma teoria posterior sobre o modo da expiação.
- source_word: הַמִּטַּהֵר
  choice: a pessoa que está sendo purificada
  rationale: O particípio designa quem passa pelo processo ritual de purificação; a expressão inclusiva e natural evita atribuir gênero não exigido pelo referente.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa o sentido de presença implicado por לִפְנֵי e conserva o nome divino pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome próprio, em conformidade com a prática declarada do projeto.
theological_decisions:
- issue: Terminologia sacrificial sem resolver em excesso a teologia da expiação
  choice: oferta pelo pecado, holocausto e fará expiação
  alternative: oferta de purificação; fará purificação ritual
  rationale: Os termos escolhidos mantêm a linguagem cultual tradicional e a tensão semântica do hebraico, enquanto uma nota registra a alternativa contextual para חַטָּאת.
- issue: Tradução do nome divino
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A forma escolhida preserva o nome pessoal representado pelo Tetragrama e mantém a consistência do projeto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A frase mantém a continuidade sintática com o versículo anterior. Usa-se “oferta de cereal”, mais transparente ao leitor comum do que “oferta de manjares”, e “a pessoa” para representar naturalmente o referente humano sem acrescentar uma especificação de gênero.
