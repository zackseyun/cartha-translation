source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: pt
  text: E o sacerdote porá um pouco do óleo que está na palma da sua mão sobre o lóbulo da orelha direita daquele que está sendo purificado, sobre o polegar da sua mão direita e sobre o dedão do seu pé direito, no lugar do sangue da oferta pela culpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, no lugar onde o sangue da oferta pela culpa havia sido aplicado.
    reason: Esclarece a referência ritual contextual de «lugar do sangue», sem substituir no texto a expressão nominal do hebraico.
lexical_decisions:
- source_word: וְנָתַן
  choice: porá
  rationale: נתן tem sentido amplo de dar, pôr ou colocar; no contexto ritual, “porá” expressa naturalmente a aplicação do óleo sem acrescentar detalhes ao gesto.
- source_word: מִן הַשֶּׁמֶן
  choice: um pouco do óleo
  rationale: O מן partitivo indica que o sacerdote toma parte do óleo, e esta formulação é idiomática em português.
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: que está na palma da sua mão
  rationale: כף designa aqui a palma ou concavidade da mão do sacerdote; explicitar “da sua mão” evita estranheza em português.
- source_word: תְּנוּךְ אֹזֶן
  choice: o lóbulo da orelha
  rationale: תנוך, nestes ritos sacerdotais, refere-se ao lóbulo da orelha, a designação anatômica mais clara em português atual.
- source_word: הַמִּטַּהֵר
  choice: daquele que está sendo purificado
  rationale: O particípio hitpael apresenta a pessoa em processo de purificação ritual, não apenas num estado já concluído.
- source_word: הַיְמָנִית
  choice: direita/direito
  rationale: A flexão portuguesa acompanha os substantivos “orelha”, “mão” e “pé”, preservando em cada caso a indicação do lado direito.
- source_word: בֹּהֶן יָדוֹ
  choice: o polegar da sua mão
  rationale: בֹּהֶן aplicado à mão corresponde precisamente a “polegar”.
- source_word: בֹּהֶן רַגְלוֹ
  choice: o dedão do seu pé
  rationale: בֹּהֶן aplicado ao pé designa o dedo maior; “dedão do pé” é claro, corrente e amplamente compreensível.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: no lugar onde foi aplicado o sangue da oferta pela culpa
  rationale: A formulação torna explícita a referência contextual ao lugar de aplicação anterior do sangue, sem alterar o referente ritual da expressão hebraica.
theological_decisions:
- issue: Tradução de אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: אָשָׁם pode destacar culpa ou reparação e também nomeia o sacrifício correspondente. “Oferta pela culpa” mantém o termo sacrificial explícito e é reconhecível, sem excluir a dimensão reparadora.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe ritual clara. “Está sendo purificado” preserva o aspecto processual do hebraico. A frase final explicita a aplicação já descrita no contexto imediato, evitando a expressão pouco natural “lugar do sangue”.
