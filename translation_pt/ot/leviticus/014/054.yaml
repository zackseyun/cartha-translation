base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/054.yaml
  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: pt
  text: Esta é a lei para todo caso de doença de pele e para uma erupção[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma erupção escamosa»; tradicionalmente, «tinha». O termo hebraico se refere a uma afecção específica, sobretudo do couro cabeludo ou da barba, mas seu equivalente médico exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Esta é
  rationale: O demonstrativo feminino singular introduz uma fórmula de resumo; em português, a cópula precisa ser expressa.
- source_word: הַתּוֹרָה
  choice: a lei
  rationale: Neste contexto, תּוֹרָה designa a regulamentação prescrita para examinar e tratar esses casos; «lei» preserva a fórmula jurídica e é natural em português.
- source_word: לְכָל
  choice: para todo
  rationale: A preposição לְ com כָּל indica o âmbito de aplicação da regulamentação.
- source_word: נֶגַע הַצָּרַעַת
  choice: caso de doença de pele
  rationale: נֶגַע indica aqui uma ocorrência submetida a exame, e צָרַעַת abrange afecções que não correspondem necessariamente à hanseníase moderna; a expressão evita essa identificação médica indevida.
- source_word: וְלַנָּתֶק
  choice: e para a tinha
  rationale: נֶתֶק é uma afecção específica do couro cabeludo ou da barba, descrita em Levítico 13. «Tinha» oferece um equivalente português claro e tradicional, embora a identificação médica exata permaneça incerta.
