  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/לָקַ֧ח לַ/מִּטַּהֵ֛ר שְׁתֵּֽי צִפֳּרִ֥ים חַיּ֖וֹת טְהֹר֑וֹת וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: pt
  text: Então o sacerdote ordenará que sejam trazidos, para a pessoa que está sendo purificada, duas aves vivas e puras, madeira de cedro, fio escarlate[a] e hissopo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “material escarlate”. A expressão hebraica שְׁנִי תוֹלַעַת designa material tingido de escarlate, mas sua forma exata não é indicada.
    reason: lexical_alternative
  - marker: b
    text: Não se sabe ao certo qual planta é designada por “hissopo”; mantém-se aqui a tradução tradicional.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: Então o sacerdote ordenará
  rationale: Em instruções rituais, o waw com a forma verbal faz avançar a sequência. “Então” expressa esse passo seguinte, e o futuro mantém o caráter prescritivo.
- source_word: וְלָקַח
  choice: que sejam trazidos
  rationale: 'Embora a forma hebraica seja morfologicamente masculina singular, depois de “ordenará” ela funciona de modo idiomático: o sacerdote manda providenciar os itens, sem exigir que ele mesmo os tome. A construção passiva comunica isso naturalmente em português.'
- source_word: לַמִּטַּהֵר
  choice: para a pessoa que está sendo purificada
  rationale: O particípio hitpael apresenta alguém em processo de purificação ritual. A formulação preserva esse aspecto processual sem restringir desnecessariamente o gênero da pessoa.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: duas aves
  rationale: צִפּוֹר é um termo geral para ave e não designa especificamente pardais.
- source_word: חַיּוֹת טְהֹרוֹת
  choice: vivas e puras
  rationale: Os adjetivos especificam que as aves devem estar vivas e ser ritualmente aptas. “Puras” preserva a terminologia levítica tradicional sem inserir uma explicação no texto principal.
- source_word: עֵץ אֶרֶז
  choice: madeira de cedro
  rationale: A construção designa madeira de cedro usada no rito; a expressão portuguesa é natural e não acrescenta uma forma ou quantidade não indicada no hebraico.
- source_word: שְׁנִי תוֹלַעַת
  choice: fio escarlate
  rationale: A expressão indica material tingido de escarlate, provavelmente em forma de fio ou fibra. “Fio escarlate” é claro e tradicional, enquanto a nota preserva a incerteza quanto à forma exata do material.
- source_word: אֵזֹב
  choice: hissopo
  rationale: “Hissopo” é a designação tradicional em contextos rituais bíblicos. Como a identificação botânica exata é incerta, evita-se substituí-la por uma espécie conjectural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia ritual coerente com Levítico. A ordem foi levemente ajustada para fluidez, e a passiva evita atribuir ao sacerdote, sem necessidade, a ação física de recolher pessoalmente todos os itens.
