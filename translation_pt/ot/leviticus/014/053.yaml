  text: וְ/שִׁלַּ֞ח אֶת הַ/צִּפֹּ֧ר הַֽ/חַיָּ֛ה אֶל מִ/ח֥וּץ לָ/עִ֖יר אֶל פְּנֵ֣י הַ/שָּׂדֶ֑ה וְ/כִפֶּ֥ר עַל הַ/בַּ֖יִת וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: pt
  text: Então soltará a ave viva fora da cidade, em campo aberto. Assim fará expiação pela casa[a], e a casa ficará pura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “purificará ritualmente a casa”. O hebraico emprega aqui linguagem sacerdotal de expiação num contexto de purificação ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: Então soltará
  rationale: O piel de שלח indica aqui deixar a ave ir livre no ato ritual. “Soltará” é natural e preciso; “então” expressa a sequência indicada pelo waw.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: a ave viva
  rationale: Mantém de forma concisa o contraste com a ave anteriormente morta no ritual.
- source_word: אֶל מִחוּץ לָעִיר
  choice: fora da cidade
  rationale: Expressa naturalmente o movimento para além dos limites da cidade.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: em campo aberto
  rationale: O idiomatismo hebraico aponta para o campo ou a área aberta; esta formulação evita um literalismo obscuro.
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: fará expiação pela casa
  rationale: Preserva a linguagem sacerdotal de כפר e a tensão de aplicá-la a uma casa, sem reduzi-la apenas à limpeza ritual nem impor uma teoria doutrinária posterior.
- source_word: וְטָהֵר
  choice: e ela ficará pura
  rationale: Explicita a casa como sujeito implícito e comunica o estado resultante de pureza ritual. “Pura” é mais claro neste contexto do que “limpa”, que poderia sugerir apenas higiene física.
theological_decisions:
- issue: Sentido de כפר em um rito de purificação de uma casa
  choice: fará expiação pela casa
  alternative: purificará ritualmente a casa; fará propiciação pela casa
  rationale: O hebraico emprega linguagem sacerdotal de expiação mesmo em relação a uma casa. A tradução mantém essa categoria e sua tensão, enquanto a nota registra alternativas pertinentes ao contexto ritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem sequencial foi preservada sem rigidez sintática, e a terminologia ritual permanece transparente.
