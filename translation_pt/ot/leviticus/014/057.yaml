  yaml_path: translation/ot/leviticus/014/057.yaml
  text: to instruct about the day of uncleanness and the day of cleanness[a]. This is the law of the skin disease.
translation:
  language: pt
  text: para ensinar sobre o dia em que algo está impuro e o dia em que está puro. Esta é a lei da doença de pele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “lepra”. O termo hebraico não corresponde necessariamente à hanseníase moderna; designa uma categoria mais ampla de condições ligadas à impureza ritual e também pode ser empregado para manifestações em tecidos e casas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: para ensinar
  rationale: O infinitivo hifil de ירה expressa aqui a finalidade didática e normativa da legislação anterior. “Ensinar” conserva essa força sem acrescentar a ideia específica de uma decisão judicial.
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: quando algo está impuro e quando está puro
  rationale: A construção hebraica com “dia” indica a ocasião ou condição em que se constata impureza ou pureza. A formulação com “quando” é natural em português; “algo” mantém aberta a referência, pois as normas abrangem pessoas e também objetos ou casas.
- source_word: זֹאת תּוֹרַת
  choice: Essa é a lei referente à
  rationale: Reproduz a fórmula conclusiva do texto sacerdotal em linguagem jurídica clara. “Referente à” evita sugerir posse e indica o assunto regulamentado.
- source_word: הַצָּרָעַת
  choice: doença de pele
  rationale: O termo hebraico designa uma categoria antiga de afecções associadas à impureza ritual e não equivale precisamente à hanseníase moderna. A expressão é compreensível e evita a identificação médica anacrônica, enquanto a nota registra a tradução tradicional e a amplitude do termo.
theological_decisions:
- issue: Sentido de צָרַעַת nas leis de pureza levíticas
  choice: doença de pele
  alternative: lepra; afecção contaminante; tsaraat
  rationale: “Lepra” poderia levar o leitor a identificar indevidamente a condição com a hanseníase. “Doença de pele” comunica o principal uso do termo em seres humanos sem transformar a categoria ritual antiga em um diagnóstico moderno; a nota preserva a tradição e informa que o mesmo vocábulo pode descrever manifestações em tecidos e casas.
- issue: Referente implícito de הַטָּמֵא e הַטָּהֹר
  choice: algo está impuro / está puro
  alternative: alguém está impuro / está puro; há impureza / há pureza
  rationale: Os adjetivos hebraicos não identificam explicitamente uma pessoa, e o contexto imediato resume regras aplicáveis também a roupas e casas. “Algo” evita restringir indevidamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com terminologia de pureza ritual preservada. A construção “quando... está” traduz idiomaticamente a expressão hebraica com “dia”, e “algo” conserva a abrangência contextual sem tornar a frase excessivamente técnica.
