  text: וְ/הִזָּ֤ה הַ/כֹּהֵן֙ בְּ/אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: pt
  text: Então o sacerdote aspergirá, com o dedo da mão direita, um pouco do óleo que está na palma da mão esquerda, sete vezes diante de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: Então ... aspergirá
  rationale: O hifil de נזה, em contexto ritual, significa normalmente «aspergir». «Então» expressa com naturalidade a sequência do procedimento indicada pela conjunção.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כֹּהֵן na legislação cultual.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: com o dedo direito
  rationale: Preserva o singular e a ênfase ritual no lado direito, com formulação natural em português.
- source_word: מִן הַשֶּׁמֶן
  choice: um pouco do óleo
  rationale: 'מִן tem sentido partitivo: trata-se de uma porção do óleo, não de todo ele.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: que está na palma da sua mão esquerda
  rationale: כַּף designa aqui especificamente a palma; a formulação torna clara a relação anatômica e preserva a imagem ritual.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Tradução direta e idiomática da expressão de contagem.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica ação perante a presença divina, e o nome próprio יְהוָה é transliterado como «Yahweh».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. «Yahweh» preserva o caráter de nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se a terminologia ritual precisa sem arcaísmo desnecessário.
