language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: pt
  text: No oitavo dia, ele tomará dois cordeiros machos sem defeito, uma cordeira de um ano sem defeito, três décimos de efa de farinha fina como oferta de cereal, misturada com azeite, e um logue de azeite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “logue” era uma pequena medida de volume para líquidos usada nas práticas rituais de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: No oitavo dia
  rationale: Expressa com naturalidade a sequência temporal da instrução ritual; a conjunção hebraica não precisa ser reproduzida por “e” no início da frase em português.
- source_word: יִקַּח
  choice: ele tomará
  rationale: O imperfeito tem força prescritiva neste texto legal; o futuro do presente mantém essa força em registro digno e corrente.
- source_word: שְׁנֵי כְבָשִׂים
  choice: dois cordeiros machos
  rationale: Torna explícito o sexo masculino dos animais, em contraste intencional com a cordeira mencionada em seguida.
- source_word: תְּמִימִים / תְּמִימָה
  choice: sem defeito
  rationale: No contexto sacrificial, o adjetivo indica animais livres de defeito físico; a expressão é clara e natural em português.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: uma cordeira de um ano
  rationale: Preserva tanto o sexo feminino quanto a exigência de idade expressa pelo idioma hebraico.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: três décimos de efa
  rationale: עִשָּׂרוֹן designa a décima parte da medida padrão, entendida neste contexto como o efa; explicitar a unidade torna a quantidade compreensível sem substituir a medida antiga.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Designa farinha finamente moída, própria para as ofertas cultuais.
- source_word: מִנְחָה
  choice: como oferta de cereal
  rationale: No sistema sacrificial levítico, o termo se refere aqui à oferta feita de farinha ou cereal; “como” comunica de modo natural a relação apositiva.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: Reproduz o particípio que descreve a farinha ou oferta preparada mediante mistura com azeite.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: e um logue de azeite
  rationale: Mantém por transliteração a medida líquida israelita específica, pois não há equivalente moderno exato; a nota esclarece seu caráter.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Emprega “azeite” para o óleo de oliva pressuposto no contexto ritual e conserva as unidades antigas “efa” e “logue”.
