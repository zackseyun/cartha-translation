  text: וְ/טָבַ֤ל הַ/כֹּהֵן֙ אֶת אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית וְ/הִזָּ֨ה מִן הַ/שֶּׁ֧מֶן בְּ/אֶצְבָּע֛/וֹ שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: pt
  text: O sacerdote mergulhará o dedo direito no óleo que está na palma da sua mão esquerda e, com o seu dedo, aspergirá um pouco do óleo sete vezes diante de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: molhará ... no óleo
  rationale: O verbo indica introduzir uma parte do corpo em líquido. “Molhar o dedo no óleo” expressa de modo natural, em português, a ação ritual sem sugerir que a mão inteira seja imersa.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: o dedo direito
  rationale: Reproduz diretamente a expressão hebraica e conserva a especificidade corporal da ação, sem identificar um dedo que o texto não nomeia.
- source_word: מִן הַשֶּׁמֶן
  choice: no óleo / um pouco do óleo
  rationale: Depois de טבל, a preposição indica o líquido em que o dedo é molhado; na segunda ocorrência, indica que parte do óleo é aspergida.
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: que está na palma da sua mão esquerda
  rationale: כַּף designa aqui especificamente a palma. A formulação é clara e natural em português.
- source_word: הִזָּה
  choice: aspergirá
  rationale: “Aspergir” é o termo português preciso e estabelecido para espalhar ritualmente gotas de um líquido.
- source_word: בְּאֶצְבָּעוֹ
  choice: com o dedo
  rationale: A preposição marca o instrumento usado na aspersão.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Mantém literalmente a contagem, que é significativa no rito.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a expressão cultual de realização na presença divina e representa diretamente o nome próprio יהוה.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário ritual preciso. A repetição de “dedo” e “óleo” foi mantida por refletir a sequência detalhada da instrução sacerdotal.
