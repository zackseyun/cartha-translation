base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica do nome divino e sua tradução tradicional.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דִּבֵּר, com waw consecutivo, introduz um novo ato de fala. “Falou” reproduz com naturalidade e dignidade a fórmula recorrente de discurso divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando-o como nome pessoal em vez de substituí-lo pelo título tradicional “SENHOR”.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; em português, “falar a alguém” corresponde de modo formal e natural à construção hebraica.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico מֹשֶׁה.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz o conteúdo do discurso. “Dizendo” preserva a fórmula hebraica e liga naturalmente o versículo à fala que vem em seguida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome divino e é uma transliteração academicamente difundida; a nota informa a substituição tradicional sem impô-la ao texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima da fórmula narrativa hebraica. A vírgula e os dois-pontos indicam que o conteúdo da fala começa no versículo seguinte.
