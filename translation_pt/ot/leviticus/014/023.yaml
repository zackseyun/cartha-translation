  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: pt
  text: No oitavo dia, para a sua purificação[a], ele os levará ao sacerdote, à entrada da tenda do encontro, diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para a sua limpeza ritual». O termo hebraico se refere, neste contexto, ao processo ritual de purificação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: ele os levará
  rationale: No contexto jurídico e ritual, o hifil perfeito com conjunção tem força prescritiva/futura; o futuro do indicativo é natural em português para instruções legais.
- source_word: אֹתָם
  choice: os
  rationale: O pronome objeto masculino plural retoma os elementos sacrificiais exigidos no versículo anterior.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: No oitavo dia
  rationale: Expressão temporal idiomática e fiel em português.
- source_word: לְטָהֳרָתוֹ
  choice: para a sua purificação
  rationale: O termo derivado de טהר designa aqui o processo ritual pelo qual a pessoa é declarada e restaurada como pura; 'purificação' mantém com clareza o sentido cultual.
- source_word: אֶל הַכֹּהֵן
  choice: ao sacerdote
  rationale: Reprodução direta e natural da expressão direcional.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: A expressão indica o destino e local do rito; 'tenda do encontro' comunica naturalmente a função de אֹהֶל מוֹעֵד.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Mantém a fórmula cultual que indica a presença divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido cultual de לְטָהֳרָתוֹ
  choice: para a sua purificação
  alternative: para a sua limpeza ritual
  rationale: O contexto é de pureza ritual, não de higiene física nem de purificação moral. A alternativa explicita esse âmbito e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe jurídica natural. Emprega 'tenda do encontro', expressão acessível e próxima do sentido funcional do hebraico, e preserva o nome divino Yahweh.
