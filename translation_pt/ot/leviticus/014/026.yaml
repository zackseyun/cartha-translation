lexical_decisions:
- source_word: וּ/מִן הַ/שֶּׁמֶן
  choice: E ... um pouco do óleo
  rationale: A conjunção dá continuidade à sequência ritual, e מִן marca a origem ou porção tomada do óleo. Em português, “um pouco do óleo” comunica naturalmente a ideia partitiva exigida pelo ato descrito.
- source_word: יִצֹק
  choice: derramará
  rationale: O yiqtol tem aqui valor instrucional na sequência ritual; o futuro do indicativo é natural em textos legais e procedimentais em português.
- source_word: הַ/כֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כֹּהֵן neste contexto cultual.
- source_word: עַל כַּף
  choice: na palma
  rationale: כַּף designa especificamente a palma ou concavidade da mão; “na palma” expressa de modo idiomático o destino do óleo em português.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: de sua própria mão esquerda
  rationale: Evita a repetição pouco natural de “sacerdote” e deixa claro que se trata da mão esquerda do próprio sacerdote, preservando o referente do hebraico.
