base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/055.yaml
  text: and for a skin disease in a garment or in a house,[a]
translation:
  language: pt
  text: e para a afecção[a] em uma peça de roupa ou em uma casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico tsara‘at é tradicionalmente traduzido por “lepra”, mas em Levítico se refere a uma variedade mais ampla de afecções ou contaminações, inclusive as que atingem peças de roupa e casas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: e para
  rationale: A conjunção e a preposição dão continuidade à lista de casos abrangidos pelas instruções anteriores.
- source_word: צָרַעַת
  choice: afecção
  rationale: O termo hebraico designa em Levítico uma categoria ampla de alterações que podem atingir pessoas, tecidos e casas. “Afecção” evita identificá-lo indevidamente com a hanseníase moderna e permite seu uso para objetos, enquanto a nota preserva a particularidade do termo.
- source_word: הַבֶּגֶד
  choice: uma peça de roupa
  rationale: Embora o hebraico use o artigo, o singular genérico é mais natural em português com o artigo indefinido. “Peça de roupa” expressa com clareza o substantivo singular.
- source_word: וְלַבָּיִת
  choice: ou em uma casa
  rationale: Neste contexto enumerativo, “ou” apresenta a casa como outro lugar em que a mesma categoria de afecção pode ocorrer; “em” explicita naturalmente a relação locativa implícita.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura breve que mantém a continuidade da lista. A escolha “afecção” preserva a amplitude do termo hebraico sem impor uma identificação médica moderna.
