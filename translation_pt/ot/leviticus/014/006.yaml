base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: pt
  text: Quanto à ave viva, ele a pegará juntamente com a madeira de cedro, o fio escarlate e o hissopo; então mergulhará esses objetos e a ave viva no sangue da ave que foi abatida sobre a água corrente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “águas vivas”; também pode ser entendido como “água de nascente”.
    reason: Registra a formulação literal e uma alternativa lexical da expressão hebraica מַיִם חַיִּים.
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: a ave viva
  rationale: Mantém o contraste explícito com a ave abatida e emprega a expressão mais natural em português.
- source_word: יִקַּח
  choice: ele a pegará
  rationale: O futuro expressa adequadamente a força prescritiva do imperfeito hebraico no contexto das instruções rituais; o pronome retoma a ave viva.
- source_word: עֵץ הָאֶרֶז
  choice: a madeira de cedro
  rationale: Representa a madeira ou peça de cedro empregada no rito sem especificar forma ou tamanho não declarados no texto.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: o fio escarlate
  rationale: Comunica de modo claro o material tingido de escarlate, sem acrescentar que fosse de lã, detalhe não expresso nesta frase.
- source_word: הָאֵזֹב
  choice: o hissopo
  rationale: É a designação tradicional e transparente da planta ritual, embora sua identificação botânica exata permaneça discutida.
- source_word: וְטָבַל
  choice: então mergulhará
  rationale: Expressa a ação ritual de introduzir os elementos no líquido; 'então' torna natural a sequência coordenada sem alterar sua ordem.
- source_word: אוֹתָם וְאֵת הַצִּפֹּר הַחַיָּה
  choice: tudo isso, junto com a ave viva
  rationale: Torna clara em português a referência do pronome plural aos objetos anteriormente enumerados e conserva a menção adicional e explícita da ave viva.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחֻטָה
  choice: no sangue da ave que foi abatida
  rationale: A preposição indica o líquido no qual ocorre a imersão, e 'abatida' preserva a nuance ritual de שׁחט.
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: sobre a água corrente
  rationale: No contexto, a expressão hebraica designa água viva, isto é, água fresca proveniente de fonte ou em movimento; 'água corrente' é clara e idiomática em português, enquanto a formulação literal fica registrada em nota.
theological_decisions:
- issue: Sentido de מַיִם חַיִּים no rito de purificação
  choice: água corrente
  alternative: água viva; água de nascente
  rationale: A tradução evita impor à expressão associações teológicas posteriores, mas a nota preserva sua forma literal e a extensão semântica possível.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula organiza a longa instrução ritual sem fragmentá-la. A repetição de “ave viva” foi mantida porque também ocorre no hebraico e distingue cuidadosamente os participantes do rito.
