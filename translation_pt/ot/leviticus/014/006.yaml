  source_fidelity: A tradução reproduz adequadamente a sequência ritual, os objetos e o contraste entre a ave viva e a ave abatida. “Água corrente” é uma boa representação contextual de מַיִם חַיִּים, e a nota preserva a formulação literal. Contudo, “tudo isso, junto com a ave viva” pode sugerir que a ave já esteja incluída em “tudo isso”, antes de ser acrescentada novamente; o hebraico distingue os objetos listados da ave viva como objeto adicional da imersão.
  naturalness: O português é claro, atual e de registro apropriado. A substituição de “tudo isso, junto com” por “esses objetos e” torna a coordenação mais direta e elimina uma pequena ambiguidade referencial.
  terminology: “Ave viva”, “madeira de cedro”, “fio escarlate”, “hissopo”, “abatida” e “água corrente” são escolhas defensáveis e naturais. A nota lexical é pertinente e não impõe associações teológicas posteriores.
