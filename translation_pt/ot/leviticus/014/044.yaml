base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: pt
  text: Então o sacerdote virá e examinará; se verificar que a praga se espalhou pela casa, trata-se de uma contaminação destrutiva na casa; a casa está impura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: Então ... virá
  rationale: No contexto de instruções legais, a forma verbal dá sequência ao procedimento prescrito, não narra simplesmente um fato passado.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente comum e preciso para o oficial cultual, preservando a determinação do hebraico.
- source_word: וְרָאָה
  choice: examinará
  rationale: Embora o verbo signifique literalmente “ver”, neste contexto diagnóstico indica uma inspeção avaliativa.
- source_word: וְהִנֵּה
  choice: Se constatar que
  rationale: Expressa de modo natural em português a condição verificada pelo sacerdote após o exame.
- source_word: פָּשָׂה
  choice: se espalhou
  rationale: O verbo descreve a extensão progressiva da área afetada.
- source_word: הַנֶּגַע
  choice: a praga
  rationale: Mantém o sentido amplo de uma afecção ou foco de contaminação sem impor um diagnóstico moderno.
- source_word: צָרַעַת
  choice: mofo
  rationale: Como a afecção está numa casa, “mofo” comunica naturalmente ao leitor o fenômeno estrutural, enquanto a nota preserva a amplitude e a terminologia peculiar do hebraico.
- source_word: מַמְאֶרֶת
  choice: destrutivo
  rationale: Comunica o caráter grave e danoso da afecção sem introduzir a conotação médica moderna de “maligno”.
- source_word: טָמֵא הוּא
  choice: a casa está impura
  rationale: O pronome masculino hebraico retoma naturalmente בַּיִת, “casa”; “impura” preserva a linguagem de condição ritual.
theological_decisions:
- issue: Como traduzir צָרַעַת quando se refere a uma casa
  choice: Usar “mofo” no texto e explicar o termo hebraico em nota
  alternative: lepra; tsaraat; contaminação
  rationale: “Lepra” sugeriria indevidamente a hanseníase e soa incoerente aplicada a uma construção. “Mofo” é compreensível neste contexto, mas a nota deixa claro que o hebraico designa uma categoria ritual mais ampla e não identifica tecnicamente um fungo.
- issue: Valor das formas verbais no procedimento sacerdotal
  choice: 'Empregar o futuro prescritivo: “virá e examinará”'
  alternative: veio e examinou
  rationale: O versículo integra legislação ritual e descreve a etapa seguinte do procedimento, não uma narrativa passada.
- issue: Referente de טָמֵא הוּא
  choice: Explicitar “a casa está impura”
  alternative: ela é impura; isso é impuro
  rationale: A concordância masculina do hebraico favorece “a casa” como referente e torna clara a declaração de condição ritual.
translation_notes:
  register: Português moderno, claro e digno, com futuro de valor prescritivo. “Mofo” favorece a compreensão no contexto de uma casa, enquanto a nota conserva a singularidade e a amplitude do termo hebraico. A repetição de “casa” acompanha a ênfase do original e evita ambiguidade no fechamento.
