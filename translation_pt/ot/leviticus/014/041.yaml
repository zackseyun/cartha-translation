  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: pt
  text: Mandará raspar todo o interior da casa, em toda a volta, e despejarão o pó que tiverem raspado fora da cidade, num lugar impuro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַקְצִעַ
  choice: Mandará raspar
  rationale: 'O hifil tem força causativa: o responsável ordena ou providencia que o trabalho seja feito, sem indicar que o execute pessoalmente.'
- source_word: מִבַּיִת סָבִיב
  choice: por dentro toda a casa, ao redor
  rationale: Expressa a raspagem da superfície interior em toda a volta da casa, em português claro e natural.
- source_word: וְשָׁפְכוּ
  choice: jogarão
  rationale: Embora o verbo possa significar literalmente 'derramar', no contexto do descarte de material raspado, 'jogar' comunica naturalmente a ação.
- source_word: הֶעָפָר
  choice: o pó
  rationale: Mantém o sentido literal do termo hebraico sem especificar indevidamente 'reboco'; o contexto mostra que se trata do material retirado por raspagem.
- source_word: אֲשֶׁר הִקְצוּ
  choice: que tiverem raspado
  rationale: Retoma o material removido das paredes e preserva a conexão lexical com a primeira ação do versículo.
- source_word: אֶל מִחוּץ לָעִיר
  choice: fora da cidade
  rationale: Forma idiomática que expressa o destino além dos limites da cidade.
- source_word: אֶל מָקוֹם טָמֵא
  choice: num lugar impuro
  rationale: Preserva a categoria ritual levítica de טָמֵא sem sugerir necessariamente culpa moral.
theological_decisions:
- issue: Tradução de טָמֵא no contexto levítico de pureza
  choice: impuro
  alternative: contaminado; imundo
  rationale: '''Impuro'' é o termo técnico mais claro e amplamente compreensível em português para a condição ritual, evitando uma conotação predominantemente moral.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção causativa foi preservada por “mandará raspar”; “impuro” mantém a terminologia ritual de Levítico.
