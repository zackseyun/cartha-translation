  text: וְ/הֶעֱלָ֧ה הַ/כֹּהֵ֛ן אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה הַ/מִּזְבֵּ֑חָ/ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/טָהֵֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: pt
  text: Então o sacerdote oferecerá sobre o altar o holocausto e a oferta de cereal, e o sacerdote fará expiação por ele, e ele ficará puro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: oferecerá
  rationale: No hifil de עלה e em contexto sacrificial, o verbo indica oferecer no altar, não apenas levar ou apresentar.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עֹלָה é o termo sacrificial estabelecido para a oferta inteiramente queimada; “holocausto” é a designação bíblica tradicional e compreensível em português.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: Na legislação levítica, מִנְחָה designa especificamente a oferta feita de cereal, embora tenha sentidos mais amplos em outros contextos.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: O ה direcional ligado a מִזְבֵּחַ, neste contexto ritual, indica que as ofertas são colocadas e oferecidas sobre o altar.
- source_word: וְכִפֶּר עָלָיו
  choice: fará expiação por ele
  rationale: Em contextos sacerdotais, כפר expressa o ato de fazer expiação; עָלָיו tem aqui sentido benefactivo, “por ele” ou “em favor dele”.
- source_word: וְטָהֵר
  choice: ele ficará puro
  rationale: O qal declara a condição resultante do rito. “Ficará puro” comunica naturalmente em português a aquisição do estado de pureza ritual sem transformar o verbo em passivo.
theological_decisions:
- issue: Natureza da pureza na legislação sacerdotal
  choice: pureza ritual
  alternative: pureza moral
  rationale: Levítico 14 trata da restauração sacerdotal após um estado de impureza associado a uma afecção de pele. “Puro” preserva a categoria ritual do texto sem introduzir uma transformação moral.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial consolidada. A divisão em duas frases melhora a legibilidade sem alterar a sequência lógica do hebraico; “Assim” explicita de modo moderado a relação resultante entre a oferta e a expiação.
