  text: וְ/לָקַ֣ח הַ/כֹּהֵן֮ מִ/דַּ֣ם הָ/אָשָׁם֒ וְ/נָתַן֙ הַ/כֹּהֵ֔ן עַל תְּנ֛וּךְ אֹ֥זֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: pt
  text: Então o sacerdote pegará um pouco do sangue da oferta pela culpa[a] e o colocará no lóbulo da orelha direita[b] daquele que está sendo purificado, no polegar da sua mão direita e no dedão do seu pé direito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do sangue da oferta pela culpa”; o sentido é que o sacerdote pega uma parte dele para o rito.'
    reason: lexical_alternative
  - marker: b
    text: Ou “na ponta da orelha direita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: um pouco do sangue
  rationale: A preposição מִן tem sentido partitivo neste contexto. A expressão explicita de modo natural que o sacerdote toma parte do sangue para o rito, não todo ele.
- source_word: הָאָשָׁם
  choice: oferta pela culpa
  rationale: No contexto sacrificial de Levítico, אָשָׁם designa uma oferta específica associada à culpa e à reparação. A formulação escolhida é clara e reconhecível em português.
- source_word: תְּנוּךְ אֹזֶן
  choice: lóbulo da orelha
  rationale: תְּנוּךְ indica a extremidade ou parte macia da orelha no contexto ritual. “Lóbulo” é o equivalente anatômico mais provável; a alternativa “ponta” é preservada em nota.
- source_word: הַמִּטַּהֵר
  choice: daquele que está sendo purificado
  rationale: O particípio hitpael descreve a pessoa submetida ao processo ritual de purificação, sem sugerir que ela se purifica autonomamente.
- source_word: בֹּהֶן יָדוֹ
  choice: polegar da sua mão
  rationale: Com יָד, בֹּהֶן designa o polegar.
- source_word: בֹּהֶן רַגְלוֹ
  choice: dedão do seu pé
  rationale: Com רֶגֶל, בֹּהֶן designa o dedo maior do pé. “Dedão” é corrente e imediatamente compreensível no português brasileiro.
- source_word: וְלָקַח ... וְנָתַן
  choice: pegará ... colocará
  rationale: As formas verbais têm valor prescritivo ou futuro nesta instrução ritual. O futuro do indicativo comunica a determinação legal com naturalidade em português.
theological_decisions:
- issue: Condição da pessoa no rito de purificação
  choice: aquele que está sendo purificado
  alternative: aquele que se purifica; aquele que será purificado
  rationale: A tradução conserva a pessoa como participante submetido ao processo ritual conduzido pelo sacerdote, sem transformar a forma hebraica em uma afirmação de autopurificação nem apresentar o processo como ainda não iniciado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Oferta pela culpa” mantém a categoria sacrificial; “está sendo purificado” conserva o caráter processual da expressão hebraica. Os marcadores foram posicionados junto às expressões a que suas respectivas notas se referem.
