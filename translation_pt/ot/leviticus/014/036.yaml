base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: pt
  text: Então o sacerdote ordenará que esvaziem a casa antes que ele entre para examinar a área afetada[a], para que tudo o que está na casa não se torne impuro. Depois disso, o sacerdote entrará para examinar a casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mancha”, “a infecção” ou, tradicionalmente, “a praga”. O hebraico néga refere-se à área ou condição afetada submetida à inspeção sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Então ... ordenará
  rationale: Em legislação processual, o waw com a forma verbal perfeita introduz naturalmente a etapa seguinte; “Então” torna clara a sequência.
- source_word: וּפִנּוּ אֶת הַבַּיִת
  choice: que esvaziem a casa
  rationale: O verbo plural tem sujeito indefinido e indica a retirada do conteúdo da casa por ordem do sacerdote.
- source_word: בְּטֶרֶם יָבֹא
  choice: antes que ele entre
  rationale: בְּטֶרֶם marca anterioridade; o pronome retoma naturalmente o sacerdote, e “entre” explicita o movimento para dentro da casa implícito no contexto.
- source_word: לִרְאוֹת
  choice: examinar
  rationale: Embora o sentido básico seja “ver”, no contexto diagnóstico sacerdotal trata-se de uma inspeção oficial.
- source_word: הַנֶּגַע
  choice: a área afetada
  rationale: נֶגַע designa aqui a mancha, área ou condição atingida sob inspeção, sem necessariamente corresponder a uma doença ou praga em sentido moderno.
- source_word: וְלֹא יִטְמָא
  choice: para que ... não se torne impuro
  rationale: A oração expressa a finalidade preventiva de esvaziar a casa antes da declaração sacerdotal.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: tudo o que está na casa
  rationale: Refere-se de modo abrangente ao conteúdo da casa.
- source_word: וְאַחַר כֵּן
  choice: Depois disso
  rationale: Marca claramente a etapa processual seguinte.
- source_word: לִרְאוֹת אֶת הַבָּיִת
  choice: para examinar a casa
  rationale: Mantém o sentido de inspeção oficial e preserva a mudança do foco específico, a área afetada, para a casa inteira.
theological_decisions:
- issue: Terminologia de impureza ritual
  choice: se torne impuro
  alternative: seja contaminado; se torne ritualmente impuro
  rationale: טמא indica aqui estado de impureza ritual, não culpa moral. “Impuro” conserva a terminologia levítica sem acrescentar uma interpretação moral; o contexto deixa clara sua natureza ritual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “que esvaziem” preserva o sujeito plural indefinido. “Área afetada” evita diagnosticar o fenômeno segundo categorias médicas modernas, enquanto a nota registra alternativas tradicionais.
