  text: וְ/נָתַ֣ץ אֶת הַ/בַּ֗יִת אֶת אֲבָנָי/ו֙ וְ/אֶת עֵצָ֔י/ו וְ/אֵ֖ת כָּל עֲפַ֣ר הַ/בָּ֑יִת וְ/הוֹצִיא֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: pt
  text: Então demolirá a casa — suas pedras, sua madeira e todo o reboco da casa[a] — e levará tudo para um lugar impuro, fora da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todo o pó da casa» ou «toda a argamassa da casa». O hebraico diz literalmente «todo o pó da casa», mas, neste contexto de construção, provavelmente se refere ao material removido das paredes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: Então demolirá
  rationale: O verbo נתץ indica derrubar ou desmantelar a estrutura. “Demolirá” é claro e natural em português; “então” expressa a sequência indicada pelo waw no contexto.
- source_word: הַבַּיִת
  choice: a casa
  rationale: בית designa aqui a construção física submetida à inspeção.
- source_word: אֲבָנָיו
  choice: suas pedras
  rationale: Mantém o sentido concreto do hebraico e identifica um dos materiais da casa.
- source_word: עֵצָיו
  choice: sua madeira
  rationale: עֵצָיו refere-se coletivamente aos componentes de madeira da construção. “Sua madeira” é natural e não restringe o termo apenas a vigas.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: todo o reboco da casa
  rationale: Embora עָפָר signifique literalmente “pó” ou “terra solta”, neste contexto construtivo e após a raspagem das paredes refere-se provavelmente ao material de revestimento removido. “Reboco” comunica isso com clareza.
- source_word: וְהוֹצִיא
  choice: e levará tudo
  rationale: O hifil de יצא significa fazer sair ou retirar. “Levará tudo” exprime naturalmente a remoção conjunta dos materiais enumerados.
- source_word: אֶל מִחוּץ לָעִיר
  choice: para fora da cidade
  rationale: Reproduz de modo idiomático a direção para além dos limites urbanos.
- source_word: אֶל מָקוֹם טָמֵא
  choice: a um lugar impuro
  rationale: “Impuro” preserva o sentido ritual e legal de טָמֵא em Levítico, sem sugerir mera sujeira física.
theological_decisions:
- issue: Tradução da terminologia de pureza ritual
  choice: impuro
  alternative: imundo
  rationale: “Impuro” é amplamente compreensível em português moderno e conserva a categoria ritual de טָמֵא. “Imundo” também é tradicional, mas pode sugerir mais facilmente sujeira física ou adquirir tom pejorativo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. O travessão delimita a enumeração dos componentes demolidos. Não se acrescentou nota, pois “reboco” é a equivalência contextual mais provável e o versículo isolado permanece claro.
