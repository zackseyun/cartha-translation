  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: pt
  text: Esta é a lei referente àquele que tem uma afecção de pele[a] e não dispõe de recursos para sua purificação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico צָרָעַת é tradicionalmente traduzido como “lepra”, mas em Levítico abrange diversas afecções graves da pele e a impureza ritual associada a elas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua mão não alcança em sua purificação”; expressão que indica não possuir recursos suficientes para as ofertas exigidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: lei
  rationale: No material sacerdotal, תּוֹרָה introduz uma norma ou procedimento prescrito; “lei” é conciso, claro e adequado ao contexto.
- source_word: אֲשֶׁר בּוֹ
  choice: referente a quem tem
  rationale: Expressa naturalmente em português que a afecção está presente na pessoa, sem reproduzir de modo rígido a construção hebraica “em quem há”.
- source_word: נֶגַע צָרָעַת
  choice: uma afecção de pele
  rationale: צָרָעַת designa em Levítico uma categoria mais ampla que a hanseníase moderna. “Afecção de pele” evita a identificação enganosa com uma única doença e representa נֶגַע como uma manifestação ou afecção.
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: não dispõe de recursos
  rationale: A expressão idiomática, literalmente “sua mão não alcança”, indica insuficiência de meios materiais; a tradução comunica esse sentido com naturalidade.
- source_word: בְּטָהֳרָתוֹ
  choice: para a sua purificação
  rationale: Refere-se ao processo ritual de purificação descrito no contexto. “Purificação” preserva com clareza a dimensão ritual do termo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação evita identificar צָרָעַת especificamente com a hanseníase e explicita o sentido econômico do idioma hebraico sem perder seu valor em nota.
