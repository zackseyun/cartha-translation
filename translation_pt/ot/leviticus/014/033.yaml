  yaml_path: translation/ot/leviticus/014/033.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: pt
  text: 'Yahweh[a] falou a Moisés e a Arão:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido como “o SENHOR”.'
    reason: Informa a forma hebraica e a tradução tradicional do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol introduz um novo ato de fala na sequência narrativa. “Então falou” é natural em português e mantém a progressão do discurso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A preposição אֶל marca os dois destinatários. Em português, a repetição de “a” antes de Arão é dispensável sem perda de sentido.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz a fala direta que vem nos versículos seguintes. Em português moderno, os dois-pontos cumprem essa função de modo natural, evitando o pouco idiomático “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” preserva esse nome e evita substituí-lo pelo título tradicional “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os dois-pontos representam funcionalmente לֵאמֹר e sinalizam que a fala continua no versículo seguinte.
