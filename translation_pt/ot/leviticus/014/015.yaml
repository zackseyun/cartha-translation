  text: וְ/לָקַ֥ח הַ/כֹּהֵ֖ן מִ/לֹּ֣ג הַ/שָּׁ֑מֶן וְ/יָצַ֛ק עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/015.yaml
  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: pt
  text: Então o sacerdote pegará um pouco do logue de azeite e o derramará na palma da sua própria mão esquerda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “logue” era uma antiga medida para líquidos.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw com qatal dá continuidade sequencial ao procedimento ritual; o futuro em português comunica naturalmente a instrução prescritiva.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão de כֹּהֵן neste contexto cultual, preservando o artigo definido.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: um pouco do logue de azeite
  rationale: מִן tem sentido partitivo ou de origem; a formulação indica que o sacerdote retira parte do azeite contido na medida, e não necessariamente toda a quantidade.
- source_word: לֹג
  choice: logue
  rationale: Mantém por transliteração o nome de uma antiga medida específica para líquidos, evitando substituí-la por uma equivalência moderna incerta.
- source_word: וְיָצַק
  choice: e o derramará
  rationale: Prossegue a sequência prescritiva e explicita com o pronome o azeite que será derramado.
- source_word: עַל כַּף
  choice: na palma
  rationale: Embora עַל signifique literalmente “sobre”, “na palma” é natural em português para o ato de derramar líquido sobre uma mão em concha.
- source_word: כַּף
  choice: palma
  rationale: Preserva a referência concreta à palma, em vez de generalizá-la como “mão”.
- source_word: הַשְּׂמָאלִית
  choice: mão esquerda
  rationale: O adjetivo indica o lado esquerdo; “palma da ... mão esquerda” é a expressão idiomática clara em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O possessivo reforçado “sua própria” deixa claro que se trata da mão do sacerdote, refletindo a repetição de הַכֹּהֵן no hebraico. O marcador da nota foi colocado imediatamente após a oração.
