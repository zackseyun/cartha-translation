  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: pt
  text: O restante do óleo que está na palma da mão do sacerdote[a], ele colocará sobre a cabeça da pessoa que está sendo purificada, para fazer expiação por ela diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que restar do óleo que está sobre a palma da mão do sacerdote”.'
    reason: Alternativa mais literal para וְהַנּוֹתָר e para a preposição עַל.
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן־הַשֶּׁמֶן
  choice: O restante do óleo
  rationale: O particípio de נותר indica aquilo que sobra ou permanece, e מִן tem sentido partitivo. “O restante do óleo” é natural em português e se encaixa na sequência ritual.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: que estiver na palma da mão do sacerdote
  rationale: כַּף designa a palma ou a concavidade da mão. Embora עַל seja literalmente “sobre”, para um líquido retido na mão, “na palma da mão” comunica de modo mais natural a imagem concreta.
- source_word: יִתֵּן
  choice: ele colocará
  rationale: נתן pode significar dar, pôr ou colocar. Neste contexto ritual, refere-se à aplicação do óleo sobre a cabeça; “colocará” é claro e digno.
- source_word: הַמִּטַּהֵר
  choice: a pessoa que está sendo purificada
  rationale: O particípio Hitpael descreve a pessoa que passa pelo rito de purificação. A formulação mantém o aspecto processual, sem tratá-la antecipadamente como já purificada.
- source_word: לְכַפֵּר עָלָיו
  choice: para fazer expiação por ela
  rationale: כפר é um termo cultual central, preservado como “fazer expiação”; עַל indica aqui a pessoa em cujo favor a expiação é realizada.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי expressa presença diante de Deus no contexto cultual, e o nome próprio יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama, por isso a tradução conserva o nome da aliança em forma transliterada, sem substituí-lo por um título.
- issue: Sentido cultual de כפר
  choice: fazer expiação
  alternative: expiar; obter perdão
  rationale: “Fazer expiação” preserva o vocabulário sacrificial e evita reduzir o termo a apenas um de seus possíveis efeitos teológicos.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Emprega “pessoa” e a retomada pronominal feminina para evitar o masculino genérico, sem alterar o referente humano não especificado do hebraico.
