reference: Leviticus 14:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: pt
  text: e duas rolas ou dois pombinhos, conforme os seus recursos permitirem; um será oferta pelo pecado[a], e o outro, holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de purificação”. O termo hebraico pode designar a oferta usada para purificação em contextos rituais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: e duas rolas
  rationale: A conjunção dá continuidade à lista do versículo anterior, e תֹרִים designa especificamente rolas, aves usadas nos sacrifícios levíticos.
- source_word: אוֹ
  choice: ou
  rationale: Expressa a alternativa simples entre as duas espécies de aves permitidas.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dois pombinhos
  rationale: A expressão idiomática, literalmente 'dois filhos de pomba', refere-se a pombos novos; 'pombinhos' comunica naturalmente em português tanto a espécie quanto a pouca idade.
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: conforme os seus recursos permitirem
  rationale: O idioma hebraico 'aquilo que sua mão alcançar' indica capacidade econômica. A formulação escolhida preserva esse sentido em português claro e corrente.
- source_word: וְהָיָה אֶחָד
  choice: um será
  rationale: Explicita de modo conciso a distribuição das duas aves entre funções sacrificiais distintas.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: É o termo sacrificial tradicional e reconhecível em português, sem eliminar a possível nuance ritual de purificação, registrada em nota.
- source_word: וְהָאֶחָד
  choice: e o outro
  rationale: O artigo assinala a ave restante do par; 'o outro' é a formulação idiomática mais clara em português.
- source_word: עֹלָה
  choice: holocausto
  rationale: É o termo técnico consagrado em português para a oferta totalmente queimada, correspondente ao uso cultual de עֹלָה.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto sacrificial levítico
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O substantivo pode designar a oferta relacionada ao pecado e, em contextos rituais, salientar a purificação da impureza. O texto principal mantém o termo sacrificial tradicional, enquanto a nota preserva a alternativa sem resolver indevidamente a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a continuidade sintática do versículo anterior, emprega terminologia sacrificial reconhecível e explica apenas por nota a ambiguidade relevante de חַטָּאת.
