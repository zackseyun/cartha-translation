  - severity: low
    issue: A relação entre נֶגַע e צרעת fica pouco explícita em «a afecção de pele»
    rationale: O hebraico fala da «lesão/afecção da doença de pele». «Lesão da doença de pele» conserva melhor essa estrutura e a terminologia correlata no fim do versículo.
