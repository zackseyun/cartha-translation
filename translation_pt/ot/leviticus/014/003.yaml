source:
  edition: WLC
  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: pt
  text: O sacerdote sairá para fora do acampamento e examinará a pessoa; e eis que a lesão da doença de pele foi curada na pessoa com a doença de pele,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא
  choice: sairá
  rationale: No contexto de instrução ritual, a forma verbal indica a ação prescrita que o sacerdote deverá realizar; o futuro é natural e digno em português.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão no contexto cultual. A segunda ocorrência não foi repetida, pois a coordenação verbal mantém o sujeito inequívoco em português.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: Preserva a direção expressa por אֶל e o sentido locativo de מִחוּץ em formulação portuguesa natural.
- source_word: וְרָאָה
  choice: examinará a pessoa
  rationale: Embora ראה signifique literalmente 'ver', neste contexto legislativo designa a inspeção realizada pelo sacerdote. 'A pessoa' explicita com naturalidade o objeto implícito no hebraico.
- source_word: וְהִנֵּה
  choice: se constatar que
  rationale: A expressão chama atenção para o resultado observado. Em instrução ritual, 'se constatar que' comunica naturalmente sua função circunstancial sem o arcaísmo de 'e eis que'.
- source_word: נִרְפָּא
  choice: foi curada
  rationale: 'O nifal expressa estado resultante passivo: a afecção se encontra curada no momento do exame.'
- source_word: נֶגַע הַצָּרַעַת
  choice: a afecção de pele
  rationale: נגע indica uma afecção ou lesão, e צרעת abrange condições ritualizadas que não correspondem necessariamente à hanseníase moderna. A formulação evita precisão médica indevida.
- source_word: מִן הַצָּרוּעַ
  choice: na pessoa afetada
  rationale: O hebraico apresenta a afecção como curada ou removida da pessoa atingida. Em português, 'na pessoa afetada' expressa de modo claro o estado observado sem rotulá-la pela doença.
theological_decisions:
- issue: Sentido de צָרַעַת e צָרוּעַ
  choice: afecção de pele / pessoa afetada
  alternative: lepra / leproso
  rationale: Os termos hebraicos abrangem diferentes manifestações associadas à impureza ritual e não devem ser identificados automaticamente com a hanseníase moderna. A opção ampla preserva essa indeterminação sem impor diagnóstico anacrônico.
- issue: Função de וְהִנֵּה
  choice: se constatar que
  alternative: e eis que
  rationale: No procedimento de inspeção, a expressão introduz o fato verificado pelo sacerdote. A tradução funcional preserva a condição prática do enunciado, embora não reproduza literalmente a partícula de apresentação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe foi ligeiramente desdobrada em duas orações para evitar repetição pesada e tornar explícito o exame da pessoa. O versículo termina com vírgula porque a instrução prossegue no versículo seguinte.
