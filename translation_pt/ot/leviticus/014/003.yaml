  verdict: revise
  source_fidelity: A tradução capta corretamente a ação prescrita de o sacerdote sair e examinar a pessoa, bem como o sentido amplo de צרעת. Contudo, «Se constatar que» transforma a partícula apresentativa וְהִנֵּה em uma condição explícita e introduz um verbo que não está no hebraico. «E eis que» conserva melhor a observação resultante do exame. A formulação revista também torna mais visível a relação entre נֶגַע e צרעת.
  naturalness: O registro é claro e moderno. «Sairá para fora do acampamento» é compreensível e mantém o movimento para o exterior; «e eis que» é levemente mais solene, mas é natural e apropriado ao registro jurídico-ritual. A repetição de «doença de pele» é deliberada, pois reflete a expressão e a designação correlata do hebraico.
  terminology: «Doença de pele» evita identificar anacronicamente צרעת com hanseníase moderna. «Lesão da doença de pele» distingue de modo útil נֶגַע da condição designada por צרעת, sem pretender diagnóstico médico específico.
