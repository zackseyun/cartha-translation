  source_fidelity: O texto preserva a estrutura condicional-temporal do hebraico, a entrada futura na terra de Canaã, a concessão divina da terra como posse, a agência divina explícita em «eu puser» e a localização da ocorrência numa casa situada na terra possuída pelos destinatários. «Manifestação de tsaraat» evita indevidamente identificar a condição da casa com uma doença humana moderna ou com mofo.
