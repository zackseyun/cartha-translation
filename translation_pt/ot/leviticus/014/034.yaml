  terminology: «Canaã», «propriedade» e «terra que lhes pertence» são adequados. A manutenção de «tsaraat», explicada em nota, é uma solução prudente para um termo que o próprio texto aplica tanto a pessoas quanto a tecidos e casas. A nota evita a falsa equivalência exclusiva com a lepra moderna.
