  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: pt
  text: Quando vocês entrarem na terra de Canaã, que eu lhes dou como propriedade, e eu puser uma manifestação de tsaraat[a] numa casa da terra que lhes pertence,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico tsaraat refere-se a diversas afecções ou manifestações que causavam impureza ritual e podiam atingir pessoas, tecidos e casas. Tradicionalmente traduzido como “lepra”, ele não corresponde apenas à doença hoje conhecida por esse nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: Quando vocês entrarem
  rationale: כִּי introduz aqui uma circunstância futura, e o imperfeito תָבֹאוּ refere-se à entrada futura de Israel. A construção com o futuro do subjuntivo é natural em português.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: na terra de Canaã
  rationale: Expressa de modo idiomático o destino indicado pela preposição אֶל.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: que eu lhes dou
  rationale: Preserva o presente participial da ação divina e identifica claramente Deus como aquele que concede a terra.
- source_word: לַאֲחֻזָּה
  choice: como propriedade
  rationale: אֲחֻזָּה designa uma posse territorial ou propriedade permanente; esta escolha evita impor aqui a noção mais específica de herança.
- source_word: וְנָתַתִּי
  choice: e eu puser
  rationale: O verbo literalmente atribui a Deus a colocação da afecção. O futuro do subjuntivo harmoniza-se com a oração temporal iniciada por 'quando' sem apagar a agência divina.
- source_word: נֶגַע צָרַעַת
  choice: uma manifestação de tsaraat
  rationale: נֶגַע indica uma afecção, marca ou manifestação; צָרַעַת abrange condições rituais observadas em pessoas, tecidos e casas, de modo que nem 'lepra' nem 'doença de pele' funciona adequadamente numa casa. A transliteração, acompanhada de nota, preserva a amplitude do termo.
- source_word: בְּבֵית
  choice: numa casa
  rationale: Representa naturalmente a preposição בְּ e o substantivo indefinido no contexto.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: da terra que lhes pertence
  rationale: Comunica em português natural a ideia da terra mantida como propriedade, embora sem repetir de modo rígido o substantivo 'propriedade'.
theological_decisions:
- issue: Agência divina na afecção da casa
  choice: 'Manter a ação explícita de Deus: ''eu puser'''
  alternative: Empregar uma formulação impessoal, como 'aparecer' ou 'houver'
  rationale: וְנָתַתִּי atribui diretamente a Deus a ocorrência. A tradução conserva essa tensão teológica em vez de suavizá-la.
- issue: Natureza de צָרַעַת numa casa
  choice: Usar 'tsaraat' com explicação em nota
  alternative: Traduzir como 'lepra', 'doença de pele', 'mofo' ou 'bolor'
  rationale: O texto aplica o mesmo termo a condições humanas, tecidos e casas. Uma equivalência médica ou material específica resolveria uma ambiguidade que o hebraico não resolve.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento plural por “vocês/lhes”. A transliteração técnica foi mantida apenas onde as alternativas correntes seriam enganosas; a nota fornece a explicação necessária. A vírgula final conserva a continuidade sintática do versículo com a legislação subsequente.
