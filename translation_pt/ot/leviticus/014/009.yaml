  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: pt
  text: 'No sétimo dia, ele raspará todos os pelos: os da cabeça, a barba e as sobrancelhas. Raspará todos os pelos, lavará as roupas e lavará o corpo com água; então estará puro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, ritualmente puro.
    reason: Esclarece que a condição descrita é ritual, não uma afirmação de pureza moral nem apenas de limpeza física.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: A construção hebraica introduz a etapa seguinte do procedimento. A formulação temporal direta é natural em português e preserva a sequência ritual.
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: ele raspará todos os pelos
  rationale: O piel de גלח indica a remoção por raspagem, e שֵׂעָר abrange aqui os pelos do corpo. “Raspará todos os pelos” expressa com clareza a ação e sua totalidade.
- source_word: רֹאשׁוֹ
  choice: os da cabeça
  rationale: Em aposição a “todos os pelos”, o referente implícito são os pelos da cabeça; a explicitação evita a ideia de raspar literalmente a cabeça.
- source_word: זְקָנוֹ
  choice: a barba
  rationale: זָקָן designa normalmente a barba neste contexto.
- source_word: גַּבֹּת עֵינָיו
  choice: as sobrancelhas
  rationale: Equivalente idiomático natural da expressão hebraica literalmente associada às saliências acima dos olhos.
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: Raspará todos os pelos
  rationale: Mantém-se a repetição enfática do hebraico após a enumeração das áreas específicas.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: lavará as roupas
  rationale: כבס refere-se regularmente à lavagem de peças de roupa; a expressão é corrente e clara.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: banhará o corpo em água
  rationale: בָּשָׂר significa literalmente “carne”, mas neste contexto designa o corpo da pessoa. “Banhará o corpo” comunica naturalmente a lavagem ritual e mantém “em água”.
- source_word: וְטָהֵר
  choice: então estará puro
  rationale: O verbo indica o estado ritual resultante. “Então” evidencia a sequência, e “estará puro” preserva a categoria de pureza ritual sem sugerir inocência moral.
theological_decisions:
- issue: Terminologia de pureza ritual
  choice: puro
  alternative: limpo; purificado
  rationale: Neste contexto, טהר descreve a condição ritual alcançada, não pureza moral. “Puro” é natural em português para a oposição cultual puro/impuro; “purificado” poderia apresentar o termo como processo, e “limpo” poderia soar predominantemente higiênico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição do comando de raspar todos os pelos foi preservada por refletir a ênfase do hebraico. Emprega-se futuro prescritivo, comum em legislação ritual.
