  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: pt
  text: Ele examinará a área afetada e, se houver nas paredes da casa depressões[a] esverdeadas ou avermelhadas, cuja aparência seja mais baixa que a superfície da parede[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «áreas rebaixadas».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «mais baixa que a parede»; isto é, parece estar abaixo da superfície da parede.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Ele examinará
  rationale: No contexto do procedimento sacerdotal, o verbo indica uma inspeção cuidadosa, não apenas o ato de ver.
- source_word: הַנֶּגַע
  choice: a área afetada
  rationale: O termo designa uma afecção ou marca anormal. Como se trata de uma casa, «área afetada» evita sugerir sem base uma doença humana ou uma identificação microbiológica específica.
- source_word: וְהִנֵּה
  choice: e, se houver
  rationale: Na prosa legal, a expressão introduz o que se constata durante a inspeção; a formulação condicional é natural em português.
- source_word: בְּקִירֹת הַבַּיִת
  choice: nas paredes da casa
  rationale: A preposição indica a localização da área afetada nas paredes, e «nas paredes» é idiomático em português.
- source_word: שְׁקַעֲרוּרֹת
  choice: cavidades
  rationale: O termo raro descreve pontos ocos ou rebaixados na parede; «cavidades» comunica de modo conciso essa característica.
- source_word: יְרַקְרַקֹּת
  choice: esverdeadas
  rationale: A forma hebraica indica uma tonalidade tendente ao verde, não necessariamente verde intenso.
- source_word: אֲדַמְדַּמֹּת
  choice: avermelhadas
  rationale: A forma hebraica indica uma tonalidade tendente ao vermelho, não necessariamente vermelho intenso.
- source_word: וּמַרְאֵיהֶן
  choice: cuja aparência
  rationale: Expressa o aspecto visual das cavidades e liga naturalmente a descrição ao critério seguinte.
- source_word: שָׁפָל מִן הַקִּיר
  choice: mais funda que a superfície da parede
  rationale: Literalmente, «mais baixa que a parede»; no contexto, indica que a área parece rebaixada em relação à superfície da parede.
