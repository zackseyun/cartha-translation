  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: pt
  text: Então, o sacerdote tomará o cordeiro da oferta pela culpa[a] e o logue de óleo[b], e o sacerdote os moverá ritualmente diante de Yahweh como oferta movida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cordeiro do sacrifício pela culpa”; tradicionalmente, “o cordeiro da oferta pela transgressão”.'
    reason: lexical_alternative
  - marker: b
    text: O “logue” era uma pequena unidade de medida para líquidos usada no sistema ritual de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw com a forma verbal dá continuidade à sequência ritual. “Então” expressa com clareza a progressão do procedimento, e o futuro mantém o valor prescritivo do texto legal.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão de כֹּהֵן em contexto cultual. A repetição do sujeito antes do segundo verbo foi mantida, conforme o hebraico.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: o cordeiro da oferta pela culpa
  rationale: A construção preserva a relação entre o animal e a categoria sacrificial אָשָׁם. “Oferta pela culpa” é clara em português contemporâneo e evita o termo tradicional menos transparente “oferta pela transgressão”.
- source_word: לֹג הַשָּׁמֶן
  choice: o logue de óleo
  rationale: לֹג designa uma medida líquida específica; “logue” preserva o termo técnico, explicado em nota. “Óleo” traduz שֶׁמֶן sem acrescentar ao versículo uma especificação ausente nesta expressão.
- source_word: וְהֵנִיף
  choice: os moverá
  rationale: O hifil de נוּף descreve o movimento ritual de apresentação diante de Yahweh. “Moverá” preserva a ligação lexical com “oferta movida”, embora a natureza exata do gesto não seja detalhada aqui.
- source_word: אֹתָם
  choice: os
  rationale: O pronome plural retoma conjuntamente o cordeiro e o logue de óleo.
- source_word: תְּנוּפָה
  choice: como oferta movida
  rationale: O substantivo cognato do verbo נוּף identifica a apresentação ritual. “Oferta movida” conserva a terminologia cultual tradicional e a repetição lexical do hebraico.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão indica apresentação na presença divina, e o nome próprio יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Tradução de אָשָׁם na legislação sacrificial
  choice: oferta pela culpa
  alternative: oferta pela transgressão; sacrifício de reparação
  rationale: “Oferta pela culpa” mantém explícita a categoria sacrificial e seu vínculo com culpa ou responsabilidade, sem restringi-la indevidamente a uma única explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se os termos técnicos “logue” e “oferta movida”, acompanhando o caráter ritual do hebraico; a repetição de “o sacerdote” reproduz a ênfase estrutural do original.
