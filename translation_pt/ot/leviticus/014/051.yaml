  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: pt
  text: Depois pegará a madeira de cedro, o hissopo, o fio escarlate[a] e a ave viva. Ele os mergulhará no sangue da ave abatida e na água corrente[b] e aspergirá a casa sete vezes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “escarlate do verme”; tradicionalmente entendido como fio ou material tingido de escarlate.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “águas vivas”, isto é, água fresca ou corrente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Depois pegará
  rationale: A forma verbal com conjunção, no contexto de instruções rituais sequenciais, expressa a próxima ação prescrita; o futuro em português comunica isso com naturalidade.
- source_word: עֵץ הָאֶרֶז
  choice: a madeira de cedro
  rationale: A expressão designa o cedro como material ritual; esta formulação é clara e próxima do hebraico.
- source_word: הָאֵזֹב
  choice: o hissopo
  rationale: É a designação tradicional e reconhecível da planta, sem acrescentar uma identificação botânica incerta.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: o fio escarlate
  rationale: A expressão indica material tingido de escarlate, tradicionalmente entendido como fio; a forma literalmente associada ao verme é preservada em nota.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: a ave viva
  rationale: O adjetivo distingue esta ave daquela que foi abatida.
- source_word: וְטָבַל אֹתָם
  choice: Ele os mergulhará
  rationale: O pronome plural abrange os elementos anteriormente enumerados, e 'mergulhar' expressa com clareza a ação ritual de טבל.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: no sangue da ave abatida
  rationale: '''Abatida'' preserva o sentido ritual de שׁחט melhor do que o termo genérico ''morta''.'
- source_word: וּבַמַּיִם הַחַיִּים
  choice: e na água corrente
  rationale: A expressão idiomática hebraica, literalmente 'águas vivas', refere-se a água fresca proveniente de uma fonte ativa ou corrente; a tradução comunica o sentido contextual sem importar associações teológicas posteriores.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: e aspergirá a casa
  rationale: O Hifil de נזה é o verbo técnico habitual para a aspersão ritual; em português, o objeto direto produz uma formulação natural.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Tradução direta da expressão numérica adverbial.
theological_decisions:
- issue: Tradução de מַיִם חַיִּים na legislação ritual
  choice: água corrente
  alternative: água viva; água fresca
  rationale: No contexto, a expressão indica água de fonte ativa, fresca ou corrente. 'Água corrente' comunica o referente ritual sem destacar indevidamente os sentidos teológicos que a expressão literal pode adquirir em outros contextos; a forma literal é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases evita uma sequência excessivamente longa sem alterar a ordem das ações. Os marcadores de nota foram posicionados junto às expressões efetivamente explicadas.
