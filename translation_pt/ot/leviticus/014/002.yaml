  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: pt
  text: 'Esta será a instrução para a pessoa afetada por tsaraat[a], no dia da sua purificação: ela será levada ao sacerdote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraat é o termo hebraico para uma condição de impureza ritual que podia afetar pessoas e também casas ou tecidos; tradicionalmente traduzido por “lepra”, não designa necessariamente a hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Esta será
  rationale: Mantém o demonstrativo feminino, que concorda com “instrução”, e o valor do imperfeito em uma formulação normativa.
- source_word: תּוֹרַת
  choice: a instrução para
  rationale: Neste contexto, תּוֹרָה designa o procedimento ritual prescrito; “instrução” comunica esse sentido com clareza sem sugerir apenas legislação abstrata.
- source_word: הַמְּצֹרָע
  choice: a pessoa afetada por tsaraat
  rationale: O termo designa quem está afetado por צָרַעַת. A formulação evita identificar a condição de modo impreciso com a hanseníase moderna e não reduz a pessoa à condição.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: no dia da sua purificação
  rationale: Reproduz diretamente a expressão temporal e usa “purificação” para o restabelecimento ritual indicado pela raiz טהר.
- source_word: וְהוּבָא
  choice: ela será levada
  rationale: Preserva a voz passiva do hofal e o valor sequencial do procedimento; o pronome retoma naturalmente “a pessoa” em português.
- source_word: אֶל הַכֹּהֵן
  choice: ao sacerdote
  rationale: Mantém a determinação do hebraico, referindo-se ao sacerdote que oficiará o rito.
theological_decisions:
- issue: Relação de מְצֹרָע e צָרַעַת com a terminologia tradicional de “lepra”
  choice: a pessoa afetada por tsaraat
  alternative: o leproso; a pessoa com doença de pele
  rationale: צָרַעַת é uma categoria ritual bíblica que não corresponde necessariamente à hanseníase nem apenas a uma doença de pele. A transliteração preserva essa distinção e a nota esclarece o sentido.
- issue: Sentido de טָהֳרָתוֹ
  choice: sua purificação
  alternative: sua limpeza; quando se tornar pura
  rationale: O contexto trata de pureza ritual, não simplesmente de higiene ou cura médica; “purificação” conserva essa dimensão sem afirmar que o rito produz a cura da condição.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do hebraico. “Tsaraat” requer nota, mas evita uma identificação médica enganosa. “Ela” retoma gramaticalmente “a pessoa” e não especifica o sexo do indivíduo.
