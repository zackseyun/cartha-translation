base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: pt
  text: E tomará, para purificar a casa[a], duas aves, madeira de cedro, fio escarlate[b] e hissopo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para limpar a casa”. Neste contexto ritual, o verbo hebraico indica purificar a casa da contaminação ritual.
    reason: lexical_alternative
  - marker: b
    text: Ou “material escarlate”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: E ... tomará
  rationale: O perfeito qal com waw, numa sequência de instruções rituais, tem valor prescritivo ou futuro. “Tomará” mantém o tom legal e soa natural em português.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: para purificar a casa
  rationale: O piel de חטא, neste contexto ritual e tendo uma casa como objeto, indica remover a impureza ou contaminação ritual. “Purificar” comunica esse sentido sem atribuir culpa moral à casa nem explicitar uma teoria de expiação.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: duas aves
  rationale: O hebraico deste versículo diz apenas “duas aves”; não se acrescenta “vivas”, embora essa informação apareça no contexto próximo.
- source_word: וְעֵץ אֶרֶז
  choice: madeira de cedro
  rationale: Tradução direta e idiomática da construção hebraica, que designa o material usado no rito.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: fio escarlate
  rationale: A expressão designa material tingido de escarlate usado no rito. “Fio escarlate” é claro e corrente, embora a forma exata do material não seja inteiramente especificada.
- source_word: וְאֵזֹב
  choice: hissopo
  rationale: É a tradução tradicional e reconhecível de אֵזוֹב, apesar de haver incerteza quanto à identificação botânica exata.
theological_decisions:
- issue: Sentido ritual de לְחַטֵּא quando a casa é o objeto
  choice: para purificar a casa
  alternative: para tirar o pecado da casa; para desimpurificar a casa; para fazer expiação pela casa
  rationale: O contexto trata da purificação ritual de uma casa afetada, não do perdão moral de um edifício. A tradução principal preserva a categoria ritual; a nota registra a força incomum do verbo derivado da raiz חטא sem transformar a expressão em uma afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem omitir elementos do hebraico. “Tomará” conserva o caráter prescritivo da instrução ritual.
