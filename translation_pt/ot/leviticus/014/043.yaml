base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: pt
  text: Mas, se a afecção[a] voltar e irromper na casa, depois que as pedras forem retiradas, a casa for raspada e rebocada,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “infecção”, “praga” ou “lesão”. O termo hebraico néga é uma designação técnica em Levítico para uma condição anormal visível que pode afetar pessoas, roupas ou casas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma continuação condicional que contrasta o novo caso com o procedimento anterior.
- source_word: יָשׁוּב הַנֶּגַע
  choice: a afecção voltar
  rationale: שׁוב indica o reaparecimento da condição; “afecção” mantém o caráter técnico e abrangente de נגע sem sugerir necessariamente uma epidemia.
- source_word: וּפָרַח
  choice: e se alastrar
  rationale: O verbo evoca brotar ou irromper e, neste contexto, descreve a nova expansão visível da afecção na casa.
- source_word: בַּבַּיִת
  choice: pela casa
  rationale: Expressa de modo natural em português a localização e a propagação da afecção na estrutura.
- source_word: אַחַר חִלֵּץ אֶת־הָאֲבָנִים
  choice: depois de retiradas as pedras
  rationale: Retoma o procedimento prescrito anteriormente e evita especificar um agente que o hebraico não torna necessário aqui.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת־הַבַּיִת
  choice: de raspada a casa
  rationale: Preserva a ação física concreta de raspar as superfícies da casa.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: e de ela ter sido rebocada
  rationale: טוח descreve a aplicação de revestimento ou reboco; a formulação passiva preserva a ausência de agente expresso.
