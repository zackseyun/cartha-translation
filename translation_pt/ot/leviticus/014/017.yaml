base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: pt
  text: Do restante do óleo que estiver na palma da mão do sacerdote, ele porá um pouco no lóbulo[a] da orelha direita daquele que está sendo purificado, no polegar de sua mão direita e no dedo grande de seu pé direito, sobre o sangue da oferta pela culpa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na ponta da orelha”. O termo hebraico indica a extremidade externa da orelha; “lóbulo” expressa com clareza o provável ponto de aplicação neste rito.
    reason: lexical_alternative
  - marker: b
    text: Isto é, no mesmo lugar que já havia sido marcado com o sangue da oferta pela culpa; também pode ser entendido como óleo aplicado por cima do sangue.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: Do restante do óleo
  rationale: Preserva o sentido partitivo de מִן e o significado de יֶתֶר como aquilo que restou. “Óleo” traduz שֶׁמֶן sem especificar além do hebraico.
- source_word: עַל כַּפּוֹ
  choice: que estiver na palma de sua mão
  rationale: כַּף designa a palma ou a concavidade da mão. A formulação é natural em português e mantém a relação expressa por עַל.
- source_word: יִתֵּן
  choice: porá um pouco
  rationale: נתן pode significar dar, pôr ou colocar. “Um pouco” torna explícito, de modo natural, que se aplica parte do óleo restante, conforme a construção partitiva.
- source_word: תְּנוּךְ אֹזֶן
  choice: lóbulo da orelha
  rationale: תְּנוּךְ indica a extremidade externa da orelha neste rito. “Lóbulo” é o termo anatômico moderno mais claro, embora “ponta” também seja possível.
- source_word: הַמִּטַּהֵר
  choice: daquele que está sendo purificado
  rationale: O particípio hitpael apresenta a pessoa no processo de purificação ritual; a forma progressiva preserva esse aspecto sem pressupor que o processo já terminou.
- source_word: בֹּהֶן יָדוֹ
  choice: o polegar de sua mão
  rationale: No contexto da mão, בֹּהֶן designa o polegar.
- source_word: בֹּהֶן רַגְלוֹ
  choice: o dedo grande de seu pé
  rationale: No contexto do pé, בֹּהֶן designa o dedo grande. A expressão é clara e amplamente compreensível em português.
- source_word: עַל דַּם הָאָשָׁם
  choice: sobre o sangue da oferta pela culpa
  rationale: “Sobre” conserva a relação espacial de עַל sem decidir além do necessário se o óleo fica diretamente por cima do sangue ou no mesmo lugar previamente marcado por ele. אָשָׁם é mantido como termo sacrificial técnico.
theological_decisions:
- issue: Tradução de אָשָׁם como terminologia sacrificial
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: No uso levítico, אָשָׁם designa uma oferta específica ligada à culpa ou responsabilidade e, em certos casos, à reparação. “Oferta pela culpa” é reconhecível e preserva a terminologia sacrificial sem impor uma interpretação doutrinária posterior.
- issue: Relação entre o óleo e o sangue em עַל דַּם הָאָשָׁם
  choice: sobre o sangue
  alternative: por cima do sangue / no lugar do sangue
  rationale: A tradução mantém a amplitude de עַל. O contexto indica aplicação no ponto já marcado pelo sangue, mas o texto também permite visualizar o óleo aplicado por cima dele; a nota conserva essa nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Dedo grande do pé” foi preferido a formas mais regionais ou coloquiais, como “dedão”. A repetição de “direita/direito” conserva a precisão enfática da fórmula ritual hebraica.
