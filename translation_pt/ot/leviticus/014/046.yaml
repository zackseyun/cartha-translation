base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: pt
  text: E quem entrar na casa durante todos os dias em que ela estiver isolada[a] ficará impuro até o entardecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estiver fechada” ou “estiver confinada”. O hebraico se refere à casa mantida isolada sob restrição sacerdotal para inspeção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: E quem entrar
  rationale: O artigo com o particípio tem valor substantivado e genérico. “Quem entrar” expressa de modo natural a força geral da norma.
- source_word: אֶל הַ/בַּיִת
  choice: na casa
  rationale: Com בוא e אֶל, a expressão indica movimento para dentro. Em português, “entrar na casa” comunica naturalmente esse sentido.
- source_word: כָּל יְמֵי
  choice: durante todos os dias
  rationale: A expressão abrange toda a duração do período de isolamento e mantém explicitamente o alcance temporal do hebraico.
- source_word: הִסְגִּיר אֹת/וֹ
  choice: em que ela estiver isolada
  rationale: Neste contexto ritual e jurídico, סגר descreve a casa mantida separada sob restrição sacerdotal para inspeção. “Isolada” evita associar o termo exclusivamente à medicina moderna e preserva o sentido contextual.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: O verbo indica a entrada ou permanência em estado de impureza ritual. O futuro exprime com clareza a consequência jurídica da entrada.
- source_word: עַד הָ/עָרֶב
  choice: até o entardecer
  rationale: Expressão temporal corrente para o término desse estado temporário de impureza; “entardecer” é natural e digno em português.
