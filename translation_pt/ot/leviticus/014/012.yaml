  source_fidelity: A expressão «o primeiro cordeiro» introduz uma ordem temporal que não está no hebraico. הַכֶּבֶשׂ הָאֶחָד identifica um dos cordeiros previstos no rito, não necessariamente o primeiro. O restante preserva adequadamente a sequência e os elementos rituais do versículo.
  naturalness: «Pegará», «apresentará», «logue de azeite» e «diante de Yahweh» são claros e apropriados. «Os moverá em gesto de oferta movida» torna mais idiomática a formulação do rito, preservando a correspondência entre o verbo e o substantivo técnicos.
  terminology: «Oferta pela culpa» é uma tradução estabelecida e adequada para אָשָׁם; a alternativa «oferta de reparação» cabe em nota. «Oferta movida» conserva o termo ritual de תְּנוּפָה, sem impor uma descrição física além do texto.
  issues:
