  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: pt
  text: Então o sacerdote pegará um dos cordeiros e o apresentará como oferta pela culpa[a], junto com o logue de azeite[b]; e os moverá em gesto de oferta movida diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de reparação”.'
    reason: lexical_alternative
  - marker: b
    text: O logue era uma pequena unidade de medida para líquidos usada no sistema ritual de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw com qatal dá continuidade à sequência ritual; “Então” expressa a progressão, e o futuro mantém o caráter prescritivo.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כֹּהֵן em contexto cultual.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: o primeiro cordeiro
  rationale: O numeral com artigo distingue este cordeiro dos demais animais do rito; em português, “o primeiro cordeiro” comunica naturalmente a seleção de um entre os cordeiros mencionados, sem acrescentar aqui uma especificação de sexo ausente do substantivo nesta forma.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: e o apresentará
  rationale: No contexto sacrificial, הקריב indica trazer ou apresentar para a oferta; “apresentará” evita antecipar uma ação ritual mais específica.
- source_word: לְאָשָׁם
  choice: como oferta pela culpa
  rationale: אָשָׁם é um termo sacrificial técnico. “Oferta pela culpa” é tradicional e inteligível, embora “oferta de reparação” também expresse uma dimensão possível do termo.
- source_word: לֹג הַשָּׁמֶן
  choice: o logue de azeite
  rationale: Mantém a unidade israelita específica, transliterada de modo legível em português; “azeite” é o termo natural para o óleo ritual de oliva.
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: e os moverá como oferta movida
  rationale: Preserva a relação entre o verbo הניף e o substantivo técnico תְּנוּפָה, indicando o movimento ritual de apresentação sem definir uma direção que o texto não explicita.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” representa naturalmente לִפְנֵי no contexto ritual, e “Yahweh” translitera o nome divino.
theological_decisions:
- issue: Sentido sacrificial de אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: A expressão escolhida conserva a terminologia sacrificial amplamente reconhecida, enquanto a nota registra a alternativa que realça o aspecto reparador sem decidir em excesso a amplitude do termo.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; a transliteração o representa diretamente, sem substituí-lo por um título.
translation_notes:
  register: 'Português moderno, claro e digno, com terminologia ritual consistente. As notas foram ligadas aos termos corretos no texto: [a] a אָשָׁם e [b] a “logue”.'
