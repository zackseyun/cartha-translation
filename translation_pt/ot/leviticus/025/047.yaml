  source_fidelity: O texto principal transmite adequadamente a estrutura condicional incompleta do versículo, o aumento de recursos do estrangeiro residente, o empobrecimento do «irmão» e a venda de si mesmo. «Estrangeiro residente» representa bem o par גֵּר וְתוֹשָׁב como designação social composta. A expressão final עֵקֶר מִשְׁפַּחַת גֵּר é difícil; «membro da família» é uma solução contextual plausível, desde que a nota apresente alternativas de modo sintaticamente completo.
  naturalness: O português é moderno e claro. «Junto dele» preserva prudentemente a abertura de עִמּוֹ, embora seja uma formulação um pouco marcada; não exige alteração. A oração permanece deliberadamente sem conclusão, pois a consequência legal segue no versículo 48.
  terminology: «Estrangeiro residente», «irmão», «empobrecer» e «se vender» são escolhas consistentes e adequadas ao registro jurídico-social. A nota, porém, tinha uma alternativa incompleta («à estirpe») e precisava explicitar a relação com «família de um estrangeiro».
