  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: pt
  text: Se um estrangeiro residente entre vocês prosperar, e seu irmão, junto dele, empobrecer e se vender ao estrangeiro residente entre vocês ou a um membro da família de um estrangeiro residente,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «à raiz ou estirpe da família de um estrangeiro»; ou «a um ramo da família de um estrangeiro». A expressão hebraica é difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: prosperar
  rationale: A expressão idiomática, literalmente «a mão alcançar», indica que os recursos ou a capacidade financeira aumentam. «Prosperar» comunica isso de modo natural e conciso.
- source_word: גֵּר וְתוֹשָׁב
  choice: estrangeiro residente
  rationale: Os dois termos descrevem aqui um não israelita estabelecido no meio da comunidade. A expressão evita tanto a ideia de mero viajante quanto a duplicação pouco natural «estrangeiro e residente».
- source_word: וּמָךְ
  choice: empobrecer
  rationale: O verbo indica declínio econômico, isto é, tornar-se pobre.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Mantém a linguagem familiar e ética do hebraico; no contexto, refere-se a um compatriota israelita.
- source_word: עִמּוֹ
  choice: junto dele
  rationale: Preserva a relação de proximidade expressa pelo hebraico sem definir com excessiva precisão se ela é espacial, social ou econômica.
- source_word: וְנִמְכַּר
  choice: se vender
  rationale: Embora a forma hebraica possa ser traduzida passivamente como «ser vendido», o contexto jurídico de pobreza e servidão por dívida favorece o sentido reflexivo de vender a si mesmo.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: a um membro da família do estrangeiro
  rationale: A expressão hebraica é rara e difícil. Esta formulação apresenta no texto principal o sentido contextual provável, deixando a imagem mais literal para a nota.
theological_decisions:
- issue: Linguagem de parentesco israelita na legislação social
  choice: seu irmão
  alternative: seu compatriota israelita; seu parente
  rationale: «Irmão» conserva a força familiar da obrigação pactual sem substituir a imagem do texto por uma categoria meramente civil.
- issue: Natureza da venda descrita por וְנִמְכַּר
  choice: se vender
  alternative: for vendido
  rationale: O contexto trata de uma pessoa empobrecida que entra em serviço por causa de sua condição econômica. A leitura reflexiva é provável, mas a alternativa passiva permanece reconhecida.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega «vocês» para o público comunitário e preserva «irmão» como linguagem social do texto. A vírgula antes da nota acompanha a continuação da frase no versículo seguinte.
