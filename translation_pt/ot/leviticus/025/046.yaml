base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: pt
  text: Vocês poderão transmiti-los como herança a seus filhos, depois de vocês[a], para que os possuam como propriedade perpétua; deles poderão exigir trabalho. Mas, quanto a seus irmãos, os filhos de Israel[b], ninguém dominará o seu irmão com dureza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês poderão legá-los a seus filhos, depois de vocês, como propriedade hereditária”.'
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” e “filhos de Israel” traduzem diretamente os termos masculinos de parentesco do hebraico; a lei trata os demais israelitas como parentes dentro da aliança.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: poderão transmiti-los como herança
  rationale: O hithpael de נחל, neste contexto jurídico, indica fazer passar pessoas adiante como propriedade hereditária. A formulação mantém a força legal e soa natural em português.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: aos seus filhos depois de vocês
  rationale: Mantém o substantivo masculino בנים, “filhos”, e a referência à geração posterior, sem neutralizar a linguagem jurídica do hebraico.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: para que os herdem como propriedade
  rationale: Expressa tanto a ideia de herança quanto a de posse vinculada ao patrimônio familiar, presentes na combinação de ירשׁ e אֲחֻזָּה.
- source_word: לְעֹלָם
  choice: permanente
  rationale: No contexto legal, indica duração contínua ou perpetuidade da condição de posse, sem exigir a noção metafísica de eternidade.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: poderão impor-lhes trabalho
  rationale: Torna clara a realidade de trabalho compulsório no contexto de pessoas tratadas como propriedade, sem suavizá-la como simples prestação de serviço.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: Mas, quanto aos seus irmãos, os filhos de Israel
  rationale: Preserva o contraste e a estrutura de parentesco da expressão hebraica, que identifica os israelitas como irmãos dentro da aliança.
- source_word: אִישׁ בְּאָחִיו
  choice: nenhum homem ... seu irmão
  rationale: 'A formulação negativa natural em português comunica a relação distributiva: cada homem israelita em relação ao seu irmão.'
- source_word: לֹא תִרְדֶּה בוֹ
  choice: dominará ... seu irmão
  rationale: רדה denota exercer domínio ou governo sobre alguém; “dominar” mantém a força da proibição no contexto laboral.
- source_word: בְּפָרֶךְ
  choice: com dureza
  rationale: A expressão designa severidade opressiva, especialmente em contextos de trabalho forçado. “Com dureza” é direta e conserva o substantivo adverbial do hebraico.
theological_decisions:
- issue: Linguagem de parentesco na legislação social de Israel
  choice: Manter “irmãos” e “filhos de Israel”.
  alternative: “compatriotas israelitas” ou “outros israelitas”
  rationale: Os termos masculinos de parentesco enquadram a obrigação legal como solidariedade de aliança. A tradução preserva essa linguagem sem substituí-la por uma expressão social mais genérica.
- issue: Representação direta da escravidão e da posse hereditária
  choice: Empregar linguagem explícita de herança, propriedade permanente e trabalho imposto.
  alternative: Usar linguagem atenuada de serviço ou dependência.
  rationale: O hebraico apresenta pessoas como posse hereditária e sujeitas a trabalho compulsório. A tradução mantém a força jurídica e o peso moral do texto, sem suavizar nem acrescentar uma avaliação externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe jurídica foi mantida clara, e a linguagem de propriedade e trabalho compulsório não foi atenuada.
