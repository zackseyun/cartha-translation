  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: pt
  text: Mas o campo de pastagem das suas cidades[a] não poderá ser vendido, pois é propriedade permanente deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “campo de uso comum” ou “campo aberto”. O termo hebraico מִגְרָשׁ refere-se à área ao redor das cidades levíticas.
    reason: lexical_alternative
  - marker: b
    text: Ou “propriedade perpétua”. O hebraico עוֹלָם pode indicar permanência duradoura; aqui se refere à condição inalienável da terra.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה
  choice: Mas o campo
  rationale: שָׂדֶה significa “campo”. A conjunção וּ é vertida como “Mas” para marcar o contraste com a possibilidade de resgate e venda das casas mencionada no contexto anterior.
- source_word: מִגְרַשׁ
  choice: de pastagem
  rationale: מִגְרָשׁ designa a área aberta ao redor de uma cidade, usada especialmente como pastagem; a expressão preserva o uso da terra e continua clara em português atual.
- source_word: עָרֵיהֶם
  choice: pertencente às cidades deles
  rationale: Explicita de modo natural a relação da cadeia construta hebraica entre o campo de pastagem e as cidades, sem acrescentar que o campo se localizava necessariamente dentro delas.
- source_word: לֹא יִמָּכֵר
  choice: não poderá ser vendido
  rationale: O nifal imperfeito de מכר tem sentido passivo, “ser vendido”. Nesta disposição legal, “não poderá” comunica uma proibição, e não mera previsão futura.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição de forma concisa e natural.
- source_word: אֲחֻזַּת עוֹלָם
  choice: propriedade permanente
  rationale: אֲחֻזָּה é uma propriedade ou posse fundiária, e עוֹלָם indica aqui sua condição duradoura e inalienável. “Permanente” evita impor necessariamente a ideia metafísica de eternidade.
- source_word: הוּא לָהֶם
  choice: é propriedade permanente deles
  rationale: A construção pronominal com לָהֶם expressa que essa propriedade lhes pertence; a formulação é idiomática em português e mantém o referente coletivo.
theological_decisions:
- issue: Força de עוֹלָם na legislação territorial de Israel
  choice: propriedade permanente
  alternative: propriedade perpétua; propriedade eterna
  rationale: Neste contexto jurídico, עוֹלָם ressalta a condição duradoura e não transferível da terra dentro da ordem pactual de Israel. “Permanente” conserva essa força sem transformar o versículo numa afirmação explícita sobre eternidade metafísica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário compreensível internacionalmente. A estrutura mantém o singular coletivo do hebraico e explicita a força normativa da proibição sem recorrer a linguagem jurídica arcaizante.
