  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/כֹ֖ל אֶ֣רֶץ אֲחֻזַּתְ/כֶ֑ם גְּאֻלָּ֖ה תִּתְּנ֥וּ לָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: pt
  text: Em toda a terra que vocês possuem[a], permitam o resgate da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão se refere à propriedade ou posse de terra dentro da herança recebida por Israel.
    reason: cultural_note
  - marker: b
    text: 'Ou: “concedam o direito de resgate da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל
  choice: Em toda
  rationale: A construção introduz uma regra geral aplicável à totalidade da terra possuída; em português, “em toda” é direto e natural. O וּ conectivo pode ficar implícito neste versículo isolado sem perda do vínculo discursivo.
- source_word: אֶרֶץ
  choice: a terra
  rationale: No contexto jurídico de Levítico 25, designa território ou propriedade fundiária, não o planeta nem a terra em sentido genérico.
- source_word: אֲחֻזַּתְכֶם
  choice: que vocês possuem
  rationale: Expressa de modo claro a ideia de propriedade ou posse fundiária vinculada à herança de Israel, enquanto a nota preserva essa nuance histórico-jurídica.
- source_word: גְּאֻלָּה
  choice: resgate
  rationale: No contexto, refere-se à recuperação de uma propriedade alienada mediante pagamento. “Resgate” mantém o termo jurídico-covenantal sem importar necessariamente sentidos doutrinários posteriores.
- source_word: תִּתְּנוּ
  choice: permitam
  rationale: Embora o verbo signifique literalmente “deem”, aqui a construção exige que se assegure ou permita o resgate. “Permitam” soa natural em português jurídico comum e evita sugerir que a terra recebe algo materialmente.
- source_word: לָאָרֶץ
  choice: da terra
  rationale: Em português, “resgate da terra” expressa idiomaticamente a recuperação da propriedade; a relação indicada pela preposição hebraica é final ou referencial, não posse em sentido estrito.
theological_decisions:
- issue: Natureza da ordem acerca da terra ancestral vendida
  choice: A ordem exige que se permita o resgate da terra pertencente às posses de Israel.
  alternative: “Deem resgate à terra” ou “concedam o direito de resgate da terra”.
  rationale: O contexto legal institui uma possibilidade reconhecida de recuperar a propriedade, mas o texto hebraico não contém explicitamente a palavra “direito”. A formulação principal comunica a exigência sem transformar a explicitação contextual em parte do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. “Resgate” preserva a terminologia jurídica do contexto, e as notas esclarecem tanto a posse hereditária quanto a possível explicitação do direito de resgate.
