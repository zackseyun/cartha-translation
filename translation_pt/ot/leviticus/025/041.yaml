  text: וְ/יָצָא֙ מֵֽ/עִמָּ֔/ךְ ה֖וּא וּ/בָנָ֣י/ו עִמּ֑/וֹ וְ/שָׁב֙ אֶל מִשְׁפַּחְתּ֔/וֹ וְ/אֶל אֲחֻזַּ֥ת אֲבֹתָ֖י/ו יָשֽׁוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: pt
  text: Então ele sairá de junto de você, ele e seus filhos com ele, e voltará ao seu clã[a]; voltará à propriedade de seus pais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sua família”; o termo hebraico pode indicar um grupo de parentesco mais amplo, isto é, um clã.
    reason: lexical_alternative
  - marker: b
    text: Ou “à posse de seus pais” ou “à sua propriedade ancestral”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵעִמָּךְ
  choice: sairá de junto de você
  rationale: Preserva o verbo concreto hebraico de saída e a relação expressa por מֵעִם, sem explicitar interpretativamente “será libertado do seu serviço”.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: ele e seus filhos com ele
  rationale: Mantém a formulação masculina explícita e a ênfase de que os filhos saem juntamente com ele.
- source_word: וְשָׁב ... יָשׁוּב
  choice: voltará ... voltará
  rationale: Reproduz a repetição enfática da raiz שׁוב, central à ideia de restauração no jubileu.
- source_word: מִשְׁפַּחְתּוֹ
  choice: seu clã
  rationale: No contexto social e fundiário, o termo pode indicar um grupo de parentesco mais amplo que a família imediata.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: propriedade de seus pais
  rationale: אֲחֻזָּה designa uma posse ou propriedade hereditária; a formulação conserva o idioma hebraico de linhagem paterna.
theological_decisions:
- issue: Linguagem masculina de parentesco
  choice: seus filhos ... seus pais
  alternative: seus descendentes ... seus antepassados
  rationale: O hebraico emprega formas masculinas explícitas em um contexto jurídico de herança paterna; a tradução não as neutraliza.
- issue: Força sociojurídica da saída
  choice: sairá de junto de você
  alternative: será libertado do seu serviço
  rationale: Embora o contexto seja a libertação da servidão por dívida no jubileu, o texto usa o verbo concreto “sair”; a tradução preserva essa expressão sem introduzir no corpo do versículo uma explicação contextual.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. “De junto de você” conserva a relação do hebraico de modo natural; o ponto e vírgula ajuda a tornar audível a repetição deliberada de “voltará”.
