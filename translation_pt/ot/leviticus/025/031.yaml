  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: pt
  text: Mas as casas dos povoados que não têm muralha ao redor serão consideradas como os campos da terra[a]. Haverá direito de resgate para elas e, no Jubileu, sairão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “serão consideradas como o campo da terra”; isto é, essas casas de povoados recebem o mesmo tratamento jurídico dado às terras rurais, não às casas de cidades muradas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sairão”. Neste contexto jurídico, a expressão indica que a propriedade deixa de permanecer com o comprador no ano do Jubileu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בָתֵּי הַ/חֲצֵרִים
  choice: as casas dos povoados
  rationale: O construto בָּתֵּי significa “casas de”, e חֲצֵרִים designa povoados ou aldeias rurais. “Povoados” é natural e não antecipa a informação seguinte sobre a ausência de muralha.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: que não têm muralha ao redor
  rationale: Reproduz diretamente a descrição dos povoados sem uma muralha circundante, em português claro e corrente.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: serão consideradas como os campos da terra
  rationale: Mantém de perto a formulação hebraica e expressa a classificação jurídica dessas casas junto às propriedades rurais, em contraste com casas de cidades muradas.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: Haverá direito de resgate para elas
  rationale: 'Explicita de modo natural o sentido jurídico de גְּאֻלָּה: a propriedade permanece sujeita ao resgate. O plural português retoma “casas”.'
- source_word: וּ/בַ/יֹּבֵל יֵצֵא
  choice: e no Jubileu serão liberadas
  rationale: No contexto da legislação fundiária, “sair” indica que as propriedades deixam o domínio do comprador e retornam na ocasião do Jubileu. “Serão liberadas” conserva a imagem jurídica sem sugerir movimento físico das casas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Muralha”, “resgate” e “Jubileu” preservam o vocabulário jurídico e institucional do contexto levítico.
