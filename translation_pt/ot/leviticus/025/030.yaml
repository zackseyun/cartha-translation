revisions:
- from: Mas, se a casa não for resgatada antes de se completar um ano inteiro, ela permanecerá definitivamente em poder de quem a comprou, de geração em geração. Isso vale para uma casa situada numa cidade cercada por muralha.[a] Ela não será devolvida no Jubileu.[b]
  to: Mas, se ela não for resgatada antes de se completar um ano inteiro, a casa situada numa cidade cercada por muralha pertencerá definitivamente ao comprador, por todas as suas gerações.[a] Ela não será devolvida no Jubileu.[b]
  rationale: A revisão recompõe a oração jurídica segundo a sintaxe hebraica, conserva a leitura qerê massorética “cidade cercada por muralha” e torna explícita, sem excesso interpretativo, a permanência hereditária da posse do comprador. A nota preserva a divergência ketiv-qerê; a nota sobre o Jubileu esclarece o idioma jurídico de “não sairá”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:56:12Z'
