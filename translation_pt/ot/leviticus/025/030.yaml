  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: pt
  text: Mas, se ela não for resgatada antes de se completar um ano inteiro, a casa situada numa cidade cercada por muralha pertencerá definitivamente ao comprador, por todas as suas gerações.[a] Ela não será devolvida no Jubileu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto consonantal hebraico traz “que não tem muralha” (ketiv), mas a leitura tradicional massorética (qerê) é “que tem muralha”. O contraste com as aldeias sem muralhas no versículo seguinte favorece a leitura adotada no texto.
    reason: textual_variant
  - marker: b
    text: Isto é, a casa não volta à família do vendedor no ano do Jubileu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: for resgatada
  rationale: O nifal de גאל, neste contexto jurídico, indica que a propriedade é resgatada por recompra; “resgatada” mantém a terminologia jurídica recorrente em Levítico 25.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: antes de se completar um ano inteiro
  rationale: Expressa com naturalidade o prazo máximo de um ano completo, sem tornar explícito se a contagem se vincula à casa ou à venda.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: permanecerá definitivamente em poder
  rationale: וקם significa literalmente “ficará de pé”, mas no uso jurídico indica que a venda fica confirmada; לַצְּמִיתֻת acrescenta o caráter permanente.
- source_word: לַקֹּנֶה אֹתוֹ
  choice: de quem a comprou
  rationale: Forma portuguesa natural para o particípio substantivado “o comprador”, conservando a referência à casa.
- source_word: לְדֹרֹתָיו
  choice: de geração em geração
  rationale: Comunica a continuidade hereditária na linhagem do comprador sem restringir indevidamente a expressão a descendentes imediatos.
- source_word: אֲשֶׁר לא חֹמָה
  choice: cercada por muralha
  rationale: Segue a leitura massorética tradicional (qerê לוֹ, “que tem muralha”), exigida também pelo contraste jurídico do contexto; o texto consonantal escrito é preservado em nota.
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: não será devolvida no Jubileu
  rationale: O literal “não sairá” é um idioma jurídico que aqui significa que a casa não retorna à família do vendedor no Jubileu.
- source_word: יּוֹבֵל
  choice: Jubileu
  rationale: Termo bíblico consagrado para a instituição regulamentada em Levítico 25.
theological_decisions:
- issue: Caráter definitivo da venda da casa em cidade murada
  choice: Se não houver resgate dentro de um ano completo, a venda torna-se permanente e não é revertida no Jubileu.
  alternative: Traduzir apenas que a venda “ficará de pé”, deixando implícitos seu caráter hereditário e sua irreversibilidade.
  rationale: A combinação de וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו e לֹא יֵצֵא בַּיּוֹבֵל estabelece claramente a validade permanente e hereditária da transferência.
- issue: Ketiv-qerê em אֲשֶׁר לא/לוֹ חֹמָה
  choice: Adotar no texto principal a leitura tradicional “que tem muralha”.
  alternative: 'Seguir as consoantes escritas literalmente: “que não tem muralha”.'
  rationale: A leitura marginal massorética לוֹ, o contraste com as aldeias sem muralhas no versículo seguinte e toda a unidade legal favorecem decisivamente “que tem muralha”, sem ocultar a variante escrita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação jurídica foi tornada natural sem perder a terminologia de “resgate” e “Jubileu”. O gênero feminino dos pronomes retoma “casa” de modo explícito.
