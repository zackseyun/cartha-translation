base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a] e diga-lhes: “Quando vocês entrarem na terra que eu lhes dou, a terra guardará um sábado para Yahweh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a terra descansará um sábado para Yahweh”. “Yahweh” representa o nome divino YHWH, tradicionalmente traduzido como “o SENHOR”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel introduz uma instrução divina direta; “Fale” mantém clareza e solenidade natural em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a expressão familiar hebraica em vez de a reduzir a “israelitas”; a nota registra a alternativa idiomática.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Reproduz a sequência coordenada de ordens e o tom formal da instrução legal.
- source_word: כִּי תָבֹאוּ
  choice: Quando vocês entrarem
  rationale: כִּי tem aqui valor temporal, e בוא com אֶל descreve a entrada na terra. “Vocês” torna explícito o plural do hebraico e é amplamente compreensível.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: que eu lhes dou
  rationale: O presente português expressa adequadamente a concessão divina em curso ou iminente, sem resultar pesado.
- source_word: וְשָׁבְתָה הָאָרֶץ
  choice: a terra guardará
  rationale: O verbo personifica a terra como participante da observância sabática. “Guardará” conserva essa dimensão, não apenas a ideia genérica de repouso.
- source_word: שַׁבָּת
  choice: um sábado
  rationale: Designa o descanso ou a observância sabática; a minúscula segue a ortografia corrente do português, enquanto o contexto deixa claro o caráter instituído.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica orientação ou dedicação; “para” é natural em português. “Yahweh” translitera o nome divino presente no texto.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama. A forma “Yahweh” preserva o nome da aliança sem o substituir por um título; a nota informa a tradição alternativa.
- issue: A terra como observadora do sábado
  choice: a terra guardará um sábado
  alternative: a terra repousará num descanso sabático
  rationale: A formulação mantém a personificação e a ligação lexical entre o verbo שׁבת e o substantivo שׁבת, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantém a cadência da instrução legal, o plural explícito em “vocês” e a personificação da terra. A colocação pronominal formal em “diga-lhes” evita repetição sem soar arcaica.
