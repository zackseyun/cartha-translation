  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: pt
  text: ou seu tio, ou o filho de seu tio[a], poderá resgatá-lo; ou um de seus parentes consanguíneos próximos, pertencente ao seu clã, poderá resgatá-lo; ou, se conseguir recursos suficientes[b], ele poderá resgatar a si mesmo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, seu primo; literalmente, “o filho de seu tio”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se sua mão alcançar o necessário”. A expressão hebraica indica que ele obteve recursos suficientes.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “ele poderá ser resgatado”. Neste contexto, a expressão pode indicar que ele custeia o próprio resgate.
    reason: source_ambiguity
lexical_decisions:
- source_word: דֹדוֹ
  choice: seu tio
  rationale: No contexto da legislação de parentesco, דּוֹד designa o tio, e não o sentido não familiar de “amado”.
- source_word: בֶן דֹּדוֹ
  choice: o filho de seu tio
  rationale: Reproduz com clareza a expressão hebraica de parentesco; em português corrente, trata-se de seu primo, como explica a nota.
- source_word: יִגְאָלֶנּוּ
  choice: poderá resgatá-lo
  rationale: O verbo גאל expressa o resgate realizado por um parente. “Resgatar” mantém a continuidade jurídica e teológica do termo ao longo do capítulo; “poderá” comunica adequadamente a possibilidade prevista pela lei.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: um de seus parentes consanguíneos próximos
  rationale: A expressão idiomática, literalmente ligada à sua “carne”, indica parentesco próximo de sangue. A formulação portuguesa comunica esse vínculo sem reproduzir a imagem de modo artificial.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: pertencente ao seu clã
  rationale: מִשְׁפָּחָה pode indicar uma unidade de parentesco mais ampla que a família imediata; “clã” preserva essa dimensão social no contexto israelita.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: se conseguir recursos suficientes
  rationale: A expressão hebraica diz literalmente que sua mão “alcança”, mas funciona como idioma para adquirir meios suficientes. A tradução corrente comunica o sentido, enquanto a nota preserva a imagem original.
- source_word: וְנִגְאָל
  choice: ele poderá resgatar a si mesmo
  rationale: A forma hebraica é passiva, “ser resgatado”, mas, após a afirmação de que ele obteve recursos, o contexto aponta para o resgate custeado pelo próprio homem. A nota registra a forma e a possível nuance do original.
theological_decisions:
- issue: Terminologia do resgate por parentesco
  choice: Usar “resgatar” para o grupo lexical גאל.
  alternative: comprar de volta; recuperar
  rationale: “Resgatar” conserva a unidade conceitual entre a disposição jurídica e o tema do resgate no capítulo, sem reduzir o ato a uma simples transação comercial.
- issue: Expressão idiomática הִשִּׂיגָה יָדוֹ
  choice: Traduzir o sentido no texto e preservar a imagem da mão em nota.
  alternative: se sua mão alcançar o necessário
  rationale: Em português moderno, a reprodução direta da imagem soaria pouco natural. “Se conseguir recursos suficientes” transmite com precisão a condição econômica, e a nota permite acesso à forma hebraica.
- issue: Voz passiva em וְנִגְאָל
  choice: Explicitar no texto a leitura contextual de autorresgate, registrando em nota a forma passiva.
  alternative: ele poderá ser resgatado
  rationale: O contexto imediato associa os recursos adquiridos pelo homem ao seu próprio resgate, mas a forma hebraica não é explicitamente reflexiva; a nota evita apagar essa tensão gramatical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A redação mantém o caráter jurídico do versículo, emprega “clã” para a unidade familiar ampliada e usa notas para preservar tanto a imagem idiomática hebraica quanto a voz passiva da cláusula final.
