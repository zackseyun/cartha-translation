  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: pt
  text: Como trabalhador assalariado, ano após ano, ele estará com o estrangeiro[a]; o estrangeiro não o dominará com dureza diante dos seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como trabalhador contratado, de ano em ano ele estará com ele.”'
    reason: Alternativa de formulação para o trabalhador remunerado, a expressão anual e o pronome hebraico.
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: Como trabalhador contratado
  rationale: O prefixo כ marca comparação, e שׂכיר designa alguém que trabalha mediante pagamento, não um escravo. A formulação é atual e clara.
- source_word: שָׁנָה בְּשָׁנָה
  choice: ano após ano
  rationale: Reproduz de modo natural o sentido distributivo e contínuo da expressão hebraica.
- source_word: יִהְיֶה עִמּוֹ
  choice: ele estará com o estrangeiro
  rationale: Mantém o sentido simples de היה com עִם, sem acrescentar explicitamente 'servir' ou 'permanecer'. 'O estrangeiro' explicita apenas o referente contextual do pronome para evitar ambiguidade em português.
- source_word: לֹא יִרְדֶּנּוּ
  choice: este não o dominará
  rationale: רדה expressa exercer domínio ou autoridade sobre alguém. 'Dominar' preserva essa força no contexto jurídico e torna claros os referentes pronominais.
- source_word: בְּפֶרֶךְ
  choice: com dureza
  rationale: A expressão indica tratamento severo ou opressivo, especialmente no trabalho. 'Com dureza' é digna, corrente e mantém a forma nominal do hebraico.
- source_word: לְעֵינֶיךָ
  choice: diante dos seus olhos
  rationale: Preserva a imagem concreta dos olhos e a responsabilidade da pessoa interpelada como testemunha do tratamento.
theological_decisions:
- issue: Natureza da condição do israelita sob o senhor estrangeiro
  choice: Apresentá-lo por comparação como trabalhador contratado
  alternative: Apresentá-lo como servo contratado
  rationale: O texto enquadra sua condição mediante שׂכיר, ressaltando proteção e temporalidade sem apagar o contexto mais amplo de servidão nem introduzir a noção mais forte de escravidão como propriedade.
- issue: Referentes dos pronomes masculinos
  choice: Explicitar 'o estrangeiro' e usar 'este' para o senhor
  alternative: Manter apenas 'ele' e 'com ele'
  rationale: O hebraico depende do contexto para identificar os referentes. Em português, a explicitação evita que o trabalhador pareça ser o sujeito da proibição, sem alterar a relação jurídica expressa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a comparação com o trabalhador assalariado, a cadência jurídica e a imagem de vigilância pessoal, esclarecendo apenas os referentes pronominais exigidos pela naturalidade do português.
