revisions:
- from: Então você fará ressoar o toque do shofar[a] no sétimo mês, no décimo dia do mês. No Dia das Expiações[b], vocês farão ressoar o shofar por toda a sua terra.
  to: Então você fará soar o shofar[a] com um toque forte, no sétimo mês, no décimo dia do mês. No Dia da Expiação[b], vocês farão soar o shofar por toda a sua terra.
