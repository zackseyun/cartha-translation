  - severity: medium
    issue: “Dia das Expiações” como texto principal
    rationale: Embora כִּפֻּרִים seja formalmente plural, a expressão designa a data cultual conhecida como “Dia da Expiação”. Usar o singular estabelecido no corpo do texto, com nota sobre o plural hebraico, comunica o referente sem apagar a nuance.
  - severity: low
