  text: וְ/הַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִעִ֔י בֶּ/עָשׂ֖וֹר לַ/חֹ֑דֶשׁ בְּ/יוֹם֙ הַ/כִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּ/כָל אַרְצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: pt
  text: Então você fará soar o shofar[a] com um toque forte, no sétimo mês, no décimo dia do mês. No Dia da Expiação[b], vocês farão soar o shofar por toda a sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O shofar é um instrumento feito de chifre, tradicionalmente muitas vezes entendido como chifre de carneiro.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Dia das Expiações”, com o substantivo no plural; “Dia da Expiação” é a designação tradicional dessa data.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ שׁוֹפַר תְּרוּעָה
  choice: Então você fará ressoar o toque do shofar
  rationale: O hifil de עבר, com שׁוֹפַר, indica fazer o som do instrumento percorrer a terra. “Fará ressoar” preserva essa imagem melhor que simplesmente “tocará”; “toque” traduz תְּרוּעָה como sinal sonoro forte.
- source_word: שׁוֹפַר
  choice: shofar
  rationale: O empréstimo já é reconhecível em português bíblico e religioso e evita identificar o instrumento de modo excessivamente específico como chifre de carneiro; a nota explica sua natureza.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: no sétimo mês
  rationale: Tradução temporal direta e natural.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: no décimo dia do mês
  rationale: Explicita “dia”, subentendido no idioma hebraico, para clareza em português.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: No Dia das Expiações
  rationale: Mantém de forma inteligível o plural morfológico de הַכִּפֻּרִים e o caráter de nome da data cultual.
- source_word: תַּעֲבִירוּ שׁוֹפָר
  choice: vocês farão ressoar o shofar
  rationale: Preserva tanto o sentido causativo quanto a mudança do singular para o plural presente no hebraico.
- source_word: בְּכָל אַרְצְכֶם
  choice: por toda a sua terra
  rationale: Expressa a extensão abrangente do anúncio em português corrente; “sua” funciona naturalmente com o sujeito plural “vocês” no português brasileiro.
theological_decisions:
- issue: Tradução de יוֹם הַכִּפֻּרִים
  choice: Dia das Expiações
  alternative: Dia da Expiação
  rationale: O plural “Expiações” preserva a forma hebraica e é compreensível como designação cultual. A alternativa singular é tradicional e idiomática, mas reduziria uma nuance genuína do texto-fonte.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A alternância entre “você” e “vocês” reproduz a mudança do verbo hebraico do singular para o plural. “Shofar” é mantido com explicação em nota, e “fará/farão ressoar” conserva a imagem idiomática de fazer o som percorrer a terra.
