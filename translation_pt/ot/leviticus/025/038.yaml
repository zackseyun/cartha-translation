  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: pt
  text: Eu sou Yahweh, o Deus de vocês,[a] que os tirei da terra do Egito para lhes dar a terra de Canaã e para ser o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal YHWH, preservando sua função na fórmula de autoidentificação, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Embora אֱלֹהִים tenha forma plural, aqui se refere ao único Deus de Israel; “de vocês” representa com clareza o sufixo da segunda pessoa plural.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: os tirei
  rationale: O hifil de יצא significa fazer sair ou tirar; esta formulação é natural em português e mantém a referência ao êxodo.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém explicitamente אֶרֶץ, “terra”, sem reduzir a expressão apenas a “do Egito”.
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: para lhes dar a terra de Canaã
  rationale: O infinitivo com ל expressa propósito; a tradução conserva a linguagem direta da dádiva da terra.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: e ser o Deus de vocês
  rationale: Reproduz a fórmula relacional da aliança em português corrente, sem sugerir mudança no ser de Deus.
- source_word: אֲנִי
  choice: Eu sou
  rationale: A oração nominal hebraica requer em português a cópula “sou”; o pronome explícito conserva a ênfase da autoidentificação.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” o preserva por transliteração; a nota registra a forma hebraica e a tradução tradicional.
- issue: Sentido da fórmula לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: ser o Deus de vocês
  alternative: ser Deus para vocês; tornar-me o Deus de vocês
  rationale: A expressão denota a relação de aliança. A opção escolhida mantém esse sentido sem introduzir a ideia de que Deus passou a existir ou sofreu mudança em seu ser.
- issue: Relação entre os dois infinitivos de propósito
  choice: para lhes dar ... e ser
  alternative: para lhes dar ... a fim de ser
  rationale: A coordenação preserva a ligação de ambos os elementos com a ação de tirar Israel do Egito, sem determinar além do necessário uma relação lógica mais específica entre eles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês”, “os” e “lhes” deixam explícito o destinatário plural. A repetição de “o Deus de vocês” conserva a fórmula da aliança e a repetição do original.
