  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: pt
  text: Quanto às cidades dos levitas, os levitas terão direito permanente de resgatar as casas nas cidades de sua propriedade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Haverá para os levitas resgate perpétuo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  choice: Quanto às cidades dos levitas
  rationale: A conjunção introduz um novo caso na legislação. “Quanto às” expressa naturalmente a mudança de tópico, e “dos levitas” preserva a relação de associação ou posse.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: as casas situadas nas cidades que são propriedade deles
  rationale: A construção hebraica designa as casas localizadas nas cidades que constituem a possessão dos levitas. “Situadas” explicita idiomaticamente a relação locativa, enquanto “propriedade” comunica o sentido jurídico de אֲחֻזָּה.
- source_word: גְּאֻלַּת
  choice: o direito de resgatar
  rationale: O substantivo “resgate”, com o verbo “ser” e o dativo dos levitas, estabelece uma prerrogativa legal. A formulação verbal com “direito” torna essa força clara em português.
- source_word: עוֹלָם
  choice: para sempre
  rationale: No contexto jurídico, indica a vigência perpétua ou permanente do direito. “Para sempre” é claro e corrente, sem sugerir aqui uma afirmação sobre infinitude metafísica.
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: os levitas terão
  rationale: A construção significa literalmente que o resgate perpétuo “será para os levitas”. “Terão” expressa em português natural que essa prerrogativa legal lhes pertence.
theological_decisions:
- issue: Força jurídica da cláusula de resgate das casas levíticas
  choice: O texto concede aos levitas um direito contínuo de resgatar as casas de suas cidades.
  alternative: “Haverá para os levitas resgate perpétuo.”
  rationale: A cláusula nominal גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם estabelece uma prerrogativa duradoura. A tradução principal explicita essa força jurídica, e a nota preserva a forma mais próxima da estrutura hebraica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação jurídica é acessível, sem arcaísmos; a nota conserva a construção nominal e a ambiguidade formal do hebraico.
