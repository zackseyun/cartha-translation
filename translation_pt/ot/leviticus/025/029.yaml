reference: Leviticus 25:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: pt
  text: Se alguém vender uma casa de moradia numa cidade murada, poderá resgatá-la até se completar um ano desde a venda; durante um ano inteiro[a], terá o direito de resgatá-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dias”; neste uso jurídico, a expressão indica a duração de um ano inteiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Se alguém
  rationale: Introduz naturalmente uma condição de lei casuística em português; embora אִישׁ seja masculino singular, “alguém” funciona como representante geral sem alterar o alcance jurídico.
- source_word: יִמְכֹּר
  choice: vender
  rationale: O imperfeito hebraico na prótase jurídica é expresso naturalmente pelo futuro do subjuntivo português após “se”.
- source_word: בֵּית מוֹשַׁב
  choice: uma casa de moradia
  rationale: Preserva a noção de uma casa destinada à habitação e soa clara em português corrente.
- source_word: עִיר חוֹמָה
  choice: uma cidade murada
  rationale: Expressa literalmente uma cidade caracterizada por muralha, sem ampliar necessariamente o sentido para toda espécie de fortificação.
- source_word: וְהָיְתָה גְּאֻלָּתוֹ
  choice: poderá resgatá-la
  rationale: No contexto legal, גְּאֻלָּה designa a possibilidade ou o direito de reaver mediante resgate a propriedade vendida; a formulação verbal é natural e identifica a casa como objeto.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: até se completar um ano desde a venda
  rationale: Indica um período integral contado a partir da venda, e não o término do ano civil em que ela ocorreu.
- source_word: יָמִים
  choice: um ano inteiro
  rationale: Neste idioma jurídico, o plural “dias” designa a duração de um ano completo; a tradução comunica o referente temporal, enquanto a nota registra a forma literal.
- source_word: תִּהְיֶה גְאֻלָּתוֹ
  choice: terá o direito de resgatá-la
  rationale: Explicita o sentido jurídico de גְּאֻלָּה e a permanência desse direito durante o prazo estipulado.
theological_decisions: []
