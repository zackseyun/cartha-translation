  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male slave and your female slave who may belong to you[a], from the nations that are around you[b], from them you may buy a male slave and a female slave.
translation:
  language: pt
  text: Quanto aos escravos e às escravas que vierem a lhes pertencer[a], vocês poderão comprar escravos e escravas dentre as nações que estão ao redor de vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seu escravo e sua escrava, que vierem a pertencer a você”. O hebraico emprega formas no singular nesta oração e passa ao plural no restante do versículo.'
    reason: variante_gramatical
  - marker: b
    text: '“Nações” refere-se aos povos não israelitas ao redor de Israel. Outra tradução possível: “dentre os povos que estão ao redor de vocês”.'
    reason: alternativa_lexical
lexical_decisions:
- source_word: עַבְדְּךָ / עֶבֶד
  choice: escravos / escravo
  rationale: עֶבֶד pode designar servo ou escravo, mas, neste contexto legal de compra e posse, “escravo” comunica com clareza a condição de cativeiro.
- source_word: אֲמָתְךָ / אָמָה
  choice: escravas / escrava
  rationale: אָמָה é o termo feminino correspondente neste contexto; “escrava” preserva a distinção de sexo sem recorrer a linguagem arcaica.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: que vocês poderão ter
  rationale: A expressão descreve pessoas que poderão estar sob a posse dos destinatários. “Poderão ter” é natural em português e mantém o valor jurídico e permissivo do contexto.
- source_word: מֵאֵת הַגּוֹיִם
  choice: dentre as nações
  rationale: גּוֹיִם refere-se aqui aos povos não israelitas vizinhos. “Nações” evita conotações neotestamentárias que “gentios” poderia introduzir.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: que estão ao redor de vocês
  rationale: A formulação preserva de modo direto o sentido espacial da oração relativa hebraica.
- source_word: מֵהֶם
  choice: dentre
  rationale: A ideia de origem dentre os povos circunvizinhos foi integrada à expressão “dentre as nações”, evitando uma repetição pouco natural em português sem perder o referente.
- source_word: תִּקְנוּ
  choice: vocês poderão comprar
  rationale: קנה significa comprar ou adquirir. No contexto, a forma verbal concede permissão, não ordena que se faça uma compra.
- source_word: עֶבֶד וְאָמָה
  choice: escravos e escravas
  rationale: O par singular hebraico tem sentido genérico e distributivo. O plural natural em português conserva explicitamente as categorias masculina e feminina.
theological_decisions:
- issue: Terminologia referente à escravidão em um texto legal
  choice: Traduzir עֶבֶד e אָמָה por “escravo” e “escrava”.
  alternative: “servo” e “serva”
  rationale: A compra e a posse de pessoas são explícitas neste contexto; “servo” poderia atenuar indevidamente a condição jurídica descrita.
- issue: Força contextual do imperfeito תִּקְנוּ
  choice: 'Traduzir como permissão: “vocês poderão comprar”.'
  alternative: “vocês comprarão” ou “comprem”
  rationale: A legislação permite a aquisição dentre as nações vizinhas, mas não ordena que os israelitas comprem escravos.
- issue: Alternância entre destinatário singular e plural no hebraico
  choice: Empregar “vocês” ao longo do versículo para representar coletivamente os israelitas.
  alternative: Reproduzir literalmente a alternância entre “você” e “vocês”.
  rationale: O hebraico passa de sufixos no singular para formas no plural. Em português, a alternância soaria como mudança de referente; o plural coletivo preserva o público visado sem criar essa falsa impressão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O texto usa “escravos” de modo explícito por causa do contexto de compra e posse, evita o arcaísmo “servos” e regulariza no plural a alternância hebraica entre destinatário singular e plural.
