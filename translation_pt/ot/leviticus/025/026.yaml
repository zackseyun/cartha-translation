base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: pt
  text: Mas, se um homem não tiver resgatador[a], e vier a ter recursos suficientes e encontrar o necessário para o seu resgate[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “parente-resgatador”. O hebraico גֹּאֵל muitas vezes designa um parente próximo com o dever ou o direito de resgatar a propriedade da família.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua mão alcançar, e ele encontrar o suficiente para o seu resgate”. A expressão “sua mão alcançar” indica que a pessoa passou a ter recursos suficientes; a oração seguinte refere-se a encontrar o necessário para o resgate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: Mas, se um homem
  rationale: A construção introduz uma hipótese legal em contraste com o caso anterior. “Um homem” preserva o singular masculino do hebraico, e “se” expressa o valor condicional de כִּי.
- source_word: לֹא יִהְיֶה לּ/וֹ גֹּאֵל
  choice: não tiver resgatador
  rationale: גֹּאֵל designa aqui o parente que tem o direito ou dever de resgatar a propriedade familiar. “Resgatador” mantém o termo jurídico conciso, enquanto a nota explicita o vínculo familiar.
- source_word: וְ/הִשִּׂיגָה יָד/וֹ
  choice: vier a dispor de recursos suficientes
  rationale: A expressão literalmente afirma que “sua mão alcança”; neste contexto econômico, é uma expressão idiomática para a obtenção de meios suficientes. A tradução comunica naturalmente esse sentido sem sugerir mera ação física.
- source_word: וּ/מָצָא כְּ/דֵי גְאֻלָּת/וֹ
  choice: para o resgate
  rationale: וּמָצָא כְּדֵי indica que ele encontra ou obtém o bastante, e גְאֻלָּתוֹ refere-se ao resgate no contexto da propriedade vendida. A suficiência já está expressa em “recursos suficientes”, evitando redundância em português.
