source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: pt
  text: A terra não poderá ser vendida em definitivo[a], pois a terra é minha. Vocês são estrangeiros e residentes temporários comigo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em perpetuidade” ou “de modo que fique definitivamente alienada”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “estrangeiros e residentes temporários” descreve os israelitas como residentes dependentes de Deus, a quem pertence a terra.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: não poderá ser vendida
  rationale: O nifal imperfeito de מכר tem aqui força passiva e proibitiva em contexto legal; esta formulação comunica naturalmente a proibição sem perder a voz passiva.
- source_word: לִצְמִתֻת
  choice: para sempre
  rationale: No contexto da posse da terra, צְמִתֻת indica alienação duradoura ou irrevogável. “Para sempre” é claro e corrente; a nota registra a formulação jurídica alternativa.
- source_word: כִּי לִי הָאָרֶץ
  choice: pois a terra é minha
  rationale: A oração apresenta a razão da proibição e preserva de modo direto a afirmação da propriedade divina.
- source_word: גֵרִים
  choice: estrangeiros
  rationale: גֵר designa quem reside numa terra que não é originalmente sua, em condição dependente; “estrangeiros” conserva essa condição de não proprietários nativos.
- source_word: וְתוֹשָׁבִים
  choice: residentes temporários
  rationale: תּוֹשָׁב designa um residente sem pleno direito hereditário à terra. A expressão distingue o termo de גֵר e ressalta a natureza provisória da permanência.
- source_word: עִמָּדִי
  choice: comigo
  rationale: A preposição עם com sufixo de primeira pessoa singular significa diretamente “comigo”; no contexto, descreve a condição de Israel perante Deus sem explicá-la além do hebraico.
theological_decisions:
- issue: Natureza da relação de Israel com a terra
  choice: A posse de Israel é derivada e subordinada à propriedade de Deus, no contexto da legislação do jubileu.
  alternative: Entender o versículo apenas como norma socioeconômica, sem afirmação teológica de propriedade, ou ampliar sua linguagem para uma desapropriação absoluta além do contexto imediato.
  rationale: A declaração explícita “a terra é minha” fundamenta teologicamente a proibição. A tradução mantém juntas a força legal e a afirmação da propriedade divina, sem importar sistemas doutrinários posteriores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não poderá ser vendida” preserva o caráter jurídico; “residentes temporários” comunica a condição fundiária de תוֹשָׁב sem usar vocabulário excessivamente arcaico.
