base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: pt
  text: Não lhe empreste seu dinheiro[a] a juros, nem lhe forneça seu alimento cobrando acréscimo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua prata”. O termo hebraico כֶּסֶף pode significar tanto “prata” como “dinheiro”; aqui se refere ao dinheiro empregado num empréstimo.
    reason: lexical_alternative
  - marker: b
    text: Ou “com acréscimo”. O termo hebraico מַרְבִּית pode indicar aumento, ganho ou lucro obtido sobre aquilo que foi fornecido.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ
  choice: seu dinheiro
  rationale: Embora כֶּסֶף possa designar literalmente “prata”, em um contexto de empréstimo refere-se naturalmente a dinheiro.
- source_word: תִתֵּן לוֹ
  choice: lhe empreste
  rationale: O verbo נתן significa literalmente “dar”, mas, com dinheiro e juros, o contexto exige o sentido idiomático de emprestar.
- source_word: בְּנֶשֶׁךְ
  choice: a juros
  rationale: נֶשֶׁךְ designa juros cobrados sobre um empréstimo; “a juros” é claro e atual, sem a conotação mais restrita que “usura” pode ter hoje.
- source_word: וּבְמַרְבִּית
  choice: visando obter lucro
  rationale: מַרְבִּית indica aumento, ganho ou retorno adicional. Com alimento como objeto, a expressão comunica a obtenção de ganho sobre o que foi fornecido.
- source_word: אָכְלֶךָ
  choice: seu alimento
  rationale: אָכֶל significa alimento ou comida; “alimento” mantém a referência concreta e se ajusta ao registro jurídico do contexto.
- source_word: לֹא ... לֹא
  choice: Não ... nem
  rationale: A construção preserva as duas proibições coordenadas em português natural e digno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e de tom jurídico sóbrio. A tradução explicita o sentido contextual de empréstimo sem recorrer a “usura”, termo que hoje pode sugerir apenas juros excessivos. A segunda oração conserva a ideia ampla de ganho ou acréscimo e registra a alternativa mais literal em nota.
