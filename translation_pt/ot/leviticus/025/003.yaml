review_pass:
  verdict: revise
  source_fidelity: 'O sentido geral é fiel: as duas séries de seis anos, a semeadura do campo, a poda da vinha e a coleta da produção são preservadas. Contudo, «a produção dela» atribui indevidamente o sufixo de «sua produção» especificamente à vinha. No hebraico, o sufixo feminino não tem como antecedente gramatical imediato «vinha» (כרם é masculino) e provavelmente remete à terra subentendida no contexto; convém manter a referência possessiva sem a resolver de modo excessivamente estreito.'
  naturalness: «A produção dela» é pouco idiomático neste contexto e soa desnecessariamente pesado. «A sua produção» é natural, claro e mantém a relação possessiva sem impor um referente específico. A pontuação com ponto e vírgula também torna mais nítido o paralelismo das duas cláusulas temporais.
  terminology: «Campo», «podar», «vinha», «recolher» e «produção» são escolhas adequadas e modernas. A nota lexical deve estar ancorada em «produção», não em «campo», pois diz respeito a תְּבוּאָה.
  issues:
  - severity: medium
    issue: Referente excessivamente especificado em «a produção dela»
    rationale: A formulação e a justificativa identificam «dela» com «a vinha», mas כרם é masculino, enquanto o sufixo de תְּבוּאָתָהּ é feminino. A tradução deve evitar decidir um referente que o próprio encadeamento gramatical imediato não sustenta.
  - severity: low
    issue: Ausência de nota lexical para «produção»
    rationale: A trilha de auditoria inglesa registra a alternativa «rendimento» para תְּבוּאָה. Uma nota em português, ancorada no termo correto, preserva essa informação sem alterar o sentido.
  revised_text: Durante seis anos, você semeará o seu campo; durante seis anos, podará a sua vinha e recolherá a sua produção[a].
  revised_footnotes:
  - marker: a
    text: Ou «o seu rendimento». O termo hebraico pode designar a produção agrícola de modo mais geral.
    reason: lexical_alternative
  revision_rationale: A revisão substitui a expressão pouco natural e interpretativamente restritiva «a produção dela» por «a sua produção», preservando a relação possessiva do hebraico sem identificar o referente feminino como a vinha. Também acrescenta a nota lexical da trilha de auditoria, com âncora em «produção».
