  text: שֵׁ֤שׁ שָׁנִים֙ תִּזְרַ֣ע שָׂדֶ֔/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים תִּזְמֹ֣ר כַּרְמֶ֑/ךָ וְ/אָסַפְתָּ֖ אֶת תְּבוּאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/003.yaml
  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: pt
  text: Durante seis anos, você semeará o seu campo; durante seis anos, podará a sua vinha e recolherá a sua produção[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o seu rendimento». O termo hebraico pode designar a produção agrícola de modo mais geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: durante seis anos
  rationale: O acusativo de duração expressa o período ao longo do qual as ações agrícolas devem ocorrer; esta formulação é clara e natural em português.
- source_word: תִּזְרַע
  choice: você semeará
  rationale: O imperfeito tem força instrutiva neste contexto legal. O futuro em português preserva essa prescrição sem recorrer a uma formulação excessivamente solene.
- source_word: שָׂדֶךָ
  choice: o seu campo
  rationale: שָׂדֶה designa aqui o campo cultivado, e não a terra em sentido amplo.
- source_word: תִּזְמֹר
  choice: podará
  rationale: No contexto de uma vinha, זמר indica especificamente a poda das videiras.
- source_word: כַּרְמֶךָ
  choice: a sua vinha
  rationale: Equivalente corrente e preciso de כרם no contexto agrícola.
- source_word: וְאָסַפְתָּ
  choice: e recolherá
  rationale: אָסַף significa juntar ou recolher. A escolha preserva o sentido lexical sem restringi-lo ao ato técnico de ceifar.
- source_word: תְּבוּאָתָהּ
  choice: a produção dela
  rationale: תְּבוּאָה designa a produção ou o rendimento agrícola. A forma explicita naturalmente em português o sufixo feminino, cujo referente gramatical imediato é a vinha.
theological_decisions: []
