- from: Durante seis anos você semeará o seu campo, e durante seis anos podará a sua vinha e recolherá a produção dela.
  to: Durante seis anos, você semeará o seu campo; durante seis anos, podará a sua vinha e recolherá a sua produção[a].
  rationale: A revisão substitui a expressão pouco natural e interpretativamente restritiva «a produção dela» por «a sua produção», preservando a relação possessiva do hebraico sem identificar o referente feminino como a vinha. Também acrescenta a nota lexical da trilha de auditoria, com âncora em «produção».
