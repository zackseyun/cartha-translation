  - severity: low
    issue: «Eles se tornarão propriedade» acrescenta uma nuance de mudança de estado que não é necessária no hebraico.
    rationale: וְהָיוּ é mais diretamente vertido por «eles serão», preservando a formulação legal sem alterar o sentido.
