- from: Vocês também poderão comprar dentre os filhos dos estrangeiros residentes que vivem com vocês[a] e dentre as famílias deles que estão com vocês, aqueles que eles geraram na terra de vocês; eles se tornarão propriedade de vocês[b].
  to: Vocês também poderão comprar dentre os filhos dos estrangeiros residentes que vivem com vocês[a] e dentre as famílias deles que estão com vocês aqueles que eles geraram na terra de vocês; eles serão propriedade de vocês[b].
  rationale: 'A revisão mantém todas as escolhas lexicais essenciais do rascunho, corrige a âncora da nota b para «propriedade» e traduz mais diretamente o verbo hebraico por «serão». A supressão da vírgula antes de «aqueles» deixa mais clara a sequência: compra-se dentre as famílias presentes aqueles que elas geraram na terra dos destinatários.'
