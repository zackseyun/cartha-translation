review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a permissão legal de comprar pessoas oriundas dos filhos e das famílias dos residentes estrangeiros, bem como o estatuto delas como posse. «Geraram» preserva adequadamente o sentido genealógico de הוֹלִידוּ. Contudo, o hebraico diz literalmente que eles «serão» (וְהָיוּ) para os destinatários como posse; «serão propriedade» é uma correspondência mais direta do que «se tornarão propriedade».
  naturalness: O português é claro e de registro moderno. A pequena reorganização proposta melhora a ligação de «aqueles que eles geraram» com o objeto comprado e evita que o relativo pareça qualificar apenas «famílias».
  terminology: «Estrangeiros residentes», «comprar» e «propriedade» são escolhas adequadas e não atenuam a realidade jurídica do texto. «Filhos» mantém a formulação do hebraico, enquanto «aqueles» evita restringir indevidamente o referente subsequente ao sexo masculino.
  issues:
