  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: pt
  text: Vocês também poderão comprar dentre os filhos dos estrangeiros residentes que vivem com vocês[a] e dentre as famílias deles que estão com vocês aqueles que eles geraram na terra de vocês; eles serão propriedade de vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dentre os descendentes dos estrangeiros residentes que vivem entre vocês».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «como posse». No contexto jurídico, trata-se de propriedade que podia ser transmitida por herança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... מֵהֶם תִּקְנוּ
  choice: Vocês também poderão comprar
  rationale: Expressa a continuidade com o versículo anterior e o valor permissivo da legislação, mantendo explícito o sentido comercial de קנה.
- source_word: מִבְּנֵי
  choice: dentre os filhos
  rationale: Preserva o sentido básico de בנים e, com «dentre», indica que se trata de pessoas pertencentes a esse grupo; «descendentes» é uma alternativa contextual possível.
- source_word: הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: dos estrangeiros residentes que vivem com vocês
  rationale: A combinação dos termos designa não israelitas estabelecidos entre o povo. A formulação evita o pouco corrente «peregrinos» e conserva tanto a condição estrangeira quanto a residência local.
- source_word: וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם
  choice: e dentre as famílias deles que estão com vocês
  rationale: משפחה pode significar família ou clã; «famílias» é claro e adequado ao contexto social e jurídico.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: aqueles que eles geraram na terra de vocês
  rationale: Mantém o valor causativo e genealógico de הוליד sem restringir artificialmente a referência a filhos homens.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: eles se tornarão propriedade de vocês
  rationale: אחזה denota posse ou propriedade legal. Neste contexto, refere-se a pessoas mantidas como bem transmissível; «propriedade» comunica diretamente essa realidade jurídica.
theological_decisions:
- issue: Linguagem de compra e propriedade aplicada a pessoas
  choice: Manter «comprar» e «propriedade» de modo direto
  alternative: Adquirir; posse; servos
  rationale: O texto hebraico descreve compra e condição jurídica de posse. Atenuar esses termos ocultaria a natureza da instituição regulamentada no trecho.
- issue: Alcance de בְּנֵי e do relativo ligado a הוֹלִידוּ
  choice: «filhos» no primeiro termo e «aqueles» no relativo
  alternative: «descendentes» em ambos os casos
  rationale: A redação preserva a forma hebraica em בְּנֵי, mas evita sugerir que somente homens poderiam estar em vista no objeto da compra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural hebraico. A ordem foi levemente ajustada para fluidez, sem suavizar a linguagem jurídica do texto.
