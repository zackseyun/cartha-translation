  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: pt
  text: E, se venderem algo ao seu próximo ou comprarem algo dele, não prejudiquem cada um o seu irmão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não explorem uns aos outros”; o verbo pode indicar tirar vantagem indevida de alguém, especialmente em transações comerciais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Quando
  rationale: Em formulação legal casuística, introduz a situação prevista; “quando” soa natural em português sem eliminar o valor condicional.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: vocês venderem alguma coisa
  rationale: Reproduz o verbo no plural e expressa de modo idiomático o objeto ou bem vendido indicado por מִמְכָּר.
- source_word: לַעֲמִיתֶךָ
  choice: ao seu próximo
  rationale: עָמִית designa outro membro da comunidade. “Próximo” conserva o caráter relacional e comunitário do termo.
- source_word: אוֹ קָנֹה מִיַּד עֲמִיתֶךָ
  choice: ou comprarem algo dele
  rationale: O infinitivo absoluto tem força coordenada com o verbo anterior. מִיַּד, literalmente “da mão de”, é uma expressão de procedência que aqui se traduz naturalmente por “dele”.
- source_word: אַל תּוֹנוּ
  choice: ninguém prejudique
  rationale: O verbo ינה, neste contexto comercial, proíbe causar dano ou obter vantagem injusta. “Prejudique” mantém amplitude suficiente, enquanto a nota explicita a nuance econômica.
- source_word: אִישׁ אֶת אָחִיו
  choice: ninguém prejudique seu irmão
  rationale: A formulação distributiva hebraica é representada por “ninguém”, enquanto “seu irmão” preserva אָחִיו e a solidariedade entre membros da comunidade.
theological_decisions:
- issue: Termos masculinos representativos na proibição legal
  choice: Preservar “seu irmão”, traduzindo אִישׁ de modo distributivo por “ninguém”
  alternative: “não prejudiquem uns aos outros” ou “ninguém prejudique o seu próximo”
  rationale: “Seu irmão” mantém a imagem social e pactual de אָחִיו. “Ninguém” comunica naturalmente em português a força distributiva de אִישׁ sem restringir indevidamente a aplicação da lei.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o plural da situação inicial e a formulação distributiva da proibição, evitando tanto arcaísmo excessivo quanto explicitação doutrinária.
