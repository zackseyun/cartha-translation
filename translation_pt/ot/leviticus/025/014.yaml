  naturalness: O texto revisto permanece claro em português moderno e de boa legibilidade brasileira. “Cada um o seu irmão” tem tom jurídico adequado ao contexto legal e evita a mudança de pessoa e número criada por “ninguém prejudique seu irmão”.
  terminology: “Próximo” é uma escolha aceitável para עָמִית no contexto comunitário. “Prejudicar” é semanticamente possível para ינה, e a nota esclarece com acerto a nuance de exploração ou vantagem indevida em negócios. “Irmão” conserva אָחִיו sem impor interpretação denominacional.
