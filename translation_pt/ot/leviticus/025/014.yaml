    rationale: אַל תּוֹנוּ é uma proibição dirigida ao plural, enquanto אִישׁ ... אָחִיו explicita a responsabilidade individual dentro do grupo. “Não prejudiquem cada um o seu irmão” conserva o plural e a distribuição.
