base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a slave.
translation:
  language: pt
  text: E, se o seu irmão empobrecer estando com você e for vendido a você[b], não o faça trabalhar como escravo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “não o faça prestar trabalho de escravo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vender-se a você”. A expressão hebraica está na forma passiva, mas, neste contexto, pode referir-se a um homem pobre que se vende para prestar serviço por causa de dívidas.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִי
  choice: E, se
  rationale: Preserva tanto a conjunção como a introdução do caso condicional, em português natural.
- source_word: יָמוּךְ
  choice: empobrecer
  rationale: Expressa a queda em condição de pobreza de modo conciso e corrente.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Mantém o termo familiar do hebraico, que neste contexto designa um membro da comunidade da aliança, sem substituí-lo por uma explicação interpretativa.
- source_word: עִמָּךְ
  choice: junto de você
  rationale: Conserva a relação espacial e social indicada pelo hebraico de maneira compreensível.
- source_word: וְנִמְכַּר לָךְ
  choice: e for vendido a você
  rationale: Mantém a forma passiva do nifal e, portanto, a ambiguidade genuína da expressão; o contexto admite a ideia de venda de si mesmo por causa da pobreza.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: não o faça trabalhar
  rationale: Comunica a exigência de trabalho imposta ao homem, sem o pouco natural 'não trabalhe nele'.
- source_word: עֲבֹדַת עָבֶד
  choice: como escravo
  rationale: Transmite de modo claro a condição e o tipo de serviço proibidos; a formulação literal é registrada em nota.
theological_decisions:
- issue: Terminologia de condição social na legislação sobre serviço por dívida
  choice: como escravo
  alternative: como servo; em trabalho de escravo
  rationale: O hebraico descreve trabalho ligado à condição de עֶבֶד, não serviço genérico. 'Escravo' preserva a força da proibição e evita um eufemismo, sem negar que o israelita empobrecido prestaria outra forma de serviço.
- issue: Agência na venda do israelita empobrecido
  choice: for vendido a você
  alternative: vender-se a você
  rationale: A forma verbal hebraica é passiva e pode também funcionar idiomaticamente para a venda de si mesmo. O texto principal conserva a forma e a nota esclarece a leitura contextual sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega 'você' para o singular hebraico e mantém 'irmão' como linguagem relacional do texto. As notas retêm a literalidade e a ambiguidade relevantes.
