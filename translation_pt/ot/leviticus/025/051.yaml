  text: אִם ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים לְ/פִי/הֶן֙ יָשִׁ֣יב גְּאֻלָּת֔/וֹ מִ/כֶּ֖סֶף מִקְנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: pt
  text: Se ainda restarem muitos anos, ele devolverá, proporcionalmente a eles, o preço do seu resgate, com base no valor pelo qual foi comprado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם עוֹד רַבּוֹת בַּשָּׁנִים
  choice: Se ainda restarem muitos anos
  rationale: Expressa naturalmente em português a condição e a ideia implícita de anos que ainda faltam até o jubileu.
- source_word: לְפִיהֶן
  choice: proporcionalmente a eles
  rationale: Reproduz o sentido idiomático de cálculo segundo o número dos anos restantes.
- source_word: יָשִׁיב
  choice: devolverá
  rationale: O hifil de שוב indica fazer retornar; no contexto financeiro, trata-se de devolver uma quantia.
- source_word: גְּאֻלָּתוֹ
  choice: o preço do seu resgate
  rationale: Neste cálculo legal, גְּאֻלָּה designa concretamente o valor necessário para obter a libertação.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: com base no valor pelo qual foi comprado
  rationale: Comunica com clareza que o resgate proporcional é calculado a partir do preço original da compra, sem sugerir que o pagamento precise sair fisicamente daquele dinheiro.
