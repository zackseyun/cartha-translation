  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: pt
  text: Pois é o jubileu; será santo para vocês. Do campo vocês comerão a sua produção[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu produto” ou “o que ele produzir”. O termo hebraico se refere àquilo que o campo faz brotar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da instrução anterior e conserva a função explicativa da conjunção no contexto legal.
- source_word: יוֹבֵל
  choice: jubileu
  rationale: Neste capítulo, o termo designa o quinquagésimo ano especial, e não o chifre de carneiro associado à origem da palavra.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: será santo para vocês
  rationale: Preserva a linguagem de santidade e consagração do texto hebraico, com formulação clara e digna em português atual.
- source_word: מִן הַשָּׂדֶה
  choice: Do campo
  rationale: Traduz diretamente a origem daquilo que seria comido e destaca que o alimento viria do que o próprio campo produzisse.
- source_word: תֹּאכְלוּ
  choice: vocês comerão
  rationale: Mantém o valor instrutivo e futuro do imperfeito hebraico no contexto jurídico.
- source_word: תְּבוּאָתָהּ
  choice: a sua produção
  rationale: Refere-se ao que o campo produz. “Produção” é abrangente e natural, sem sugerir necessariamente uma colheita agrícola organizada.
theological_decisions:
- issue: A santidade do jubileu
  choice: será santo para vocês
  alternative: será sagrado para vocês; será separado para vocês
  rationale: “Santo” conserva o peso pactual e religioso de קֹדֶשׁ, sem reduzir a expressão à mera distinção cerimonial ou civil.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Do campo” foi mantida para preservar a ênfase do hebraico, e “vocês” explicita naturalmente o plural de לָכֶם e תֹּאכְלוּ.
