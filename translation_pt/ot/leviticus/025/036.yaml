  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: pt
  text: Não exija dele juros nem acréscimo[a]; tema o seu Deus e deixe seu irmão[b] viver com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ganho”; o hebraico reúne dois termos relacionados para juros e um acréscimo exigidos de um devedor pobre.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “seu irmão” significa um membro da mesma comunidade da aliança, não necessariamente um irmão biológico.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: Não cobre
  rationale: A construção com אַל e o imperfeito expressa proibição. Em contexto financeiro, “não cobre” comunica com naturalidade que não se deve exigir do necessitado a quantia proibida.
- source_word: מֵאִתּוֹ
  choice: dele
  rationale: A expressão preposicional identifica o israelita empobrecido como aquele de quem os juros ou o ganho seriam exigidos.
- source_word: נֶשֶׁךְ
  choice: juros
  rationale: O substantivo designa juros cobrados sobre um empréstimo. “Juros” é claro e atual, enquanto “usura” pode sugerir apenas juros excessivos.
- source_word: וְתַרְבִּית
  choice: nem lucro
  rationale: O termo, coordenado com נֶשֶׁךְ, indica acréscimo ou ganho obtido do devedor pobre. “Lucro” preserva o sentido econômico; outras possibilidades são “acréscimo” e “ganho”.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: tema o seu Deus
  rationale: A forma verbal prossegue a exortação ética. A pontuação em português torna desnecessário explicitar um contraste com “mas”, preservando mais diretamente a conjunção hebraica.
- source_word: וְחֵי
  choice: e deixe ... viver
  rationale: 'A forma וְחֵי pode ser entendida com força volitiva no contexto: o israelita deve permitir que seu irmão continue vivendo junto dele. A tradução evita acrescentar uma relação final explícita, como “para que”.'
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: A tradução literal preserva a linguagem familiar e comunitária da legislação da aliança; uma nota esclarece que não se limita ao parentesco biológico.
- source_word: עִמָּךְ
  choice: com você
  rationale: A expressão indica vida continuada junto ao destinatário, dentro da comunidade. “Com você” é direta, natural e amplamente compreensível.
theological_decisions:
- issue: Sentido social e pactual de אָחִיךָ
  choice: seu irmão
  alternative: seu compatriota israelita; seu parente
  rationale: “Seu irmão” preserva a metáfora familiar e a força comunitária do hebraico sem restringi-la silenciosamente ao parentesco biológico; a nota explica seu alcance contextual.
- issue: Relação entre o temor de Deus e a proibição econômica
  choice: tema o seu Deus
  alternative: mas tema o seu Deus
  rationale: A conjunção hebraica é mantida sem tornar obrigatoriamente adversativa a relação lógica. A sequência ainda apresenta o temor de Deus como fundamento ético para não explorar o necessitado.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Cobre” é usado no sentido financeiro de exigir pagamento. Os marcadores [a] e [b] aparecem imediatamente após as expressões que explicam.
