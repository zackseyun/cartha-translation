base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: pt
  text: De acordo com o maior número de anos, você aumentará o preço de compra; de acordo com o menor número de anos, você o reduzirá, pois ele lhe vende um número de colheitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um número de safras”. O termo hebraico תְּבוּאוֹת pode indicar colheitas, safras ou produtos da terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי רֹב הַשָּׁנִים
  choice: Quanto maior for o número de anos
  rationale: Expressa de modo natural a correspondência proporcional indicada por לְפִי e o contraste quantitativo de רֹב הַשָּׁנִים.
- source_word: תַּרְבֶּה מִקְנָתוֹ
  choice: mais você aumentará o preço de compra
  rationale: O hifil de רבה indica aumento, e מִקְנָה, neste contexto comercial, refere-se adequadamente ao preço da aquisição.
- source_word: וּלְפִי מְעֹט הַשָּׁנִים
  choice: quanto menor for o número de anos
  rationale: Mantém o paralelismo comparativo com a primeira oração e comunica claramente a redução dos anos considerados.
- source_word: תַּמְעִיט מִקְנָתוֹ
  choice: mais reduzirá o preço de compra
  rationale: O hifil de מעט significa diminuir; a formulação preserva a lógica proporcional da norma.
- source_word: כִּי מִסְפַּר תְּבוּאֹת הוּא מֹכֵר לָךְ
  choice: pois o que ele vende a você é um número de colheitas
  rationale: 'A construção focaliza a verdadeira base econômica da transação: a quantidade de safras futuras, não a alienação permanente da terra.'
