  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: pt
  text: Consagrem o quinquagésimo ano e proclamem liberdade na terra a todos os seus habitantes. Esse ano será para vocês um jubileu, e cada um voltará à sua propriedade[a], e cada um voltará à sua família[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sua posse”. O hebraico se refere especialmente à propriedade de terra recebida como herança familiar.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao seu clã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: Consagrem
  rationale: O piel de קדשׁ indica consagrar ou separar como santo. “Consagrem” preserva o sentido cultual e soa natural no português atual.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: o quinquagésimo ano
  rationale: A construção hebraica designa idiomaticamente o quinquagésimo ano.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: e proclamem liberdade
  rationale: דְּרוֹר se refere à proclamação formal de liberdade ou soltura no jubileu. “Liberdade” conserva a amplitude do termo sem restringi-lo apenas à remissão de obrigações.
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: na terra a todos os seus habitantes
  rationale: Mantém o valor locativo de ב e expressa de modo direto o alcance universal indicado por לְכָל.
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: Esse ano será para vocês um jubileu
  rationale: יוֹבֵל é aqui o termo técnico para a instituição do ano do jubileu, não apenas para o toque da trombeta. “Esse ano” torna explícito o referente do pronome feminino hebraico, concordante com “ano” em hebraico.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: voltará ... voltará
  rationale: A repetição de שוב é preservada para manter a ênfase hebraica na restauração.
- source_word: אִישׁ
  choice: cada um
  rationale: O substantivo masculino singular tem força distributiva no contexto legal. “Cada um” é uma forma natural em português, mantém a referência individual e se harmoniza com o discurso dirigido ao povo.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: à sua propriedade
  rationale: אֲחֻזָּה designa uma posse fundiária, especialmente a propriedade hereditária familiar. “Propriedade” é clara e natural, enquanto a nota registra a nuance.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: à sua família
  rationale: מִשְׁפָּחָה pode indicar família ou clã. “Família” é a opção mais acessível, sem eliminar a alternativa social mais ampla, registrada em nota.
theological_decisions:
- issue: Sentido distributivo de אִישׁ no texto legal
  choice: cada um
  alternative: cada homem
  rationale: A forma hebraica é masculina singular, mas funciona distributivamente. “Cada um” preserva a individualidade e a forma masculina gramatical possível em português, sem sugerir indevidamente que a ordem se limita apenas aos homens.
- issue: Sentido técnico de יוֹבֵל
  choice: jubileu
  alternative: toque de chifre de carneiro
  rationale: Neste contexto, o termo nomeia a instituição do quinquagésimo ano. A tradução não reduz o referente ao instrumento ou toque usado para anunciá-lo.
- issue: Alcance de דְּרוֹר
  choice: liberdade
  alternative: libertação
  rationale: O termo abrange uma proclamação formal de soltura e restauração no ano do jubileu. “Liberdade” mantém essa amplitude e evita definir em excesso todos os seus efeitos jurídicos no próprio termo.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com imperativos no plural adequados ao discurso dirigido à comunidade. A repetição de “cada um voltará” acompanha a estrutura enfática do hebraico. As notas são colocadas exatamente nos termos a que se referem.
