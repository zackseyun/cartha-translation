  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: pt
  text: Então mandarei a minha bênção sobre vocês no sexto ano, e ela produzirá a colheita para três anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: Então ordenarei
  rationale: O verbo צוה expressa uma ordem ou determinação divina. “Então” comunica naturalmente a função contextual da conjunção, pois a frase responde à pergunta prevista no versículo anterior.
- source_word: בִּרְכָתִי
  choice: que a minha bênção esteja
  rationale: “Minha bênção” preserva a amplitude de ברכה, enquanto a construção com “esteja” torna natural em português a combinação com “ordenarei” sem enfraquecer a ação divina direta.
- source_word: לָכֶם
  choice: com vocês
  rationale: O ל marca os beneficiários da bênção. Nesta construção portuguesa, “com vocês” expressa de modo claro que a bênção lhes será concedida.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: no sexto ano
  rationale: Tradução temporal direta e natural, preservando a referência ao ciclo sabático.
- source_word: וְעָשָׂת
  choice: e ele produzirá
  rationale: O verbo indica a produção agrícola resultante da bênção. O pronome retoma naturalmente “o sexto ano”, sujeito feminino no hebraico por causa de שָׁנָה, mas masculino em português por causa de “ano”.
- source_word: הַתְּבוּאָה
  choice: uma colheita
  rationale: תבואה designa o produto ou rendimento agrícola. “Colheita” é claro, corrente e adequado ao contexto.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: suficiente para três anos
  rationale: A expressão indica que a produção proveria alimento durante três anos. “Suficiente” explicita em português a relação funcional implícita no hebraico, evitando a impressão de que uma colheita seria produzida ao longo de três anos.
theological_decisions:
- issue: Natureza da bênção prometida
  choice: Um ato divino direto que resulta em provisão agrícola extraordinária
  alternative: Uma declaração geral sobre a providência divina
  rationale: A primeira pessoa, “ordenarei”, ligada a “minha bênção”, apresenta a abundância como determinação específica de Deus, e não apenas como observação sobre colheitas normais.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação preserva a iniciativa divina e esclarece sem tecnicismo que a colheita do sexto ano sustentaria o povo por três anos.
