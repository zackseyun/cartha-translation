id: LEV.25.5
reference: Leviticus 25:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: pt
  text: Não colha o que nascer por si mesmo depois da sua colheita[a], nem recolha as uvas da sua videira não podada[b]. Será um ano de descanso completo para a terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o produto espontâneo da sua colheita”. Refere-se ao que cresce por si mesmo das sementes deixadas pela colheita anterior.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as uvas da sua videira separada”; no contexto, trata-se da videira deixada sem poda e sem cultivo durante o ano sabático.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “um ano sabático para a terra” ou “um ano de repouso solene para a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: o que nascer por si mesmo depois da sua colheita
  rationale: Expressa a produção espontânea que brota de sementes deixadas pela colheita anterior, sem sugerir nova semeadura deliberada.
- source_word: תִקְצֹר
  choice: colha
  rationale: Em português corrente, “colher” comunica naturalmente a ceifa de produtos do campo neste contexto.
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: as uvas da sua videira não podada
  rationale: “Videira não podada” transmite o sentido agrícola de uma videira deixada sem cultivo durante o ano sabático, evitando a obscuridade de uma tradução estritamente literal como “videira separada”.
- source_word: תִבְצֹר
  choice: recolha
  rationale: O verbo hebraico se refere especificamente à vindima; “recolha as uvas” é claro e natural, distinguindo a ação da colheita dos cereais na primeira oração.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: um ano de descanso completo
  rationale: Preserva a força intensiva de שַׁבָּתוֹן e torna explícito, em linguagem acessível, o repouso integral prescrito para a terra.
- source_word: לָאָרֶץ
  choice: para a terra
  rationale: O contexto trata da terra cultivada e de seu ciclo agrícola, não da terra no sentido do planeta.
theological_decisions:
- issue: Terminologia do descanso sabático da terra
  choice: um ano de descanso completo para a terra
  alternative: um ano sabático para a terra; um ano de repouso solene para a terra
  rationale: A formulação mantém o motivo sabático e a intensidade do hebraico sem reduzir a expressão a um simples rótulo calendárico nem introduzir associações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe imperativa direta preserva o paralelismo hebraico, e as notas mantêm as alternativas lexicais genuínas.
