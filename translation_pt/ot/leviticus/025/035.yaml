reference: Leviticus 25:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: pt
  text: Se o seu irmão empobrecer e ficar sem meios de se sustentar ao seu lado[a], você deverá ampará-lo[b], para que ele viva ao seu lado como estrangeiro residente ou residente temporário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e sua mão vacilar com você”; trata-se de uma expressão idiomática para a perda dos meios ou da capacidade de se sustentar.
    reason: lexical_alternative
  - marker: b
    text: 'A expressão hebraica traduzida adiante como “estrangeiro residente ou residente temporário” é sintaticamente condensada. Também pode ser entendida como: “ampare-o — bem como o estrangeiro residente e o residente temporário”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: Se
  rationale: Introduz uma situação condicional de legislação casuística; em português atual, “Se” comunica a relação com clareza sem exigir a reprodução separada da conjunção inicial.
- source_word: יָמוּךְ
  choice: empobrecer
  rationale: O verbo indica tornar-se reduzido ou enfraquecido em condição econômica; “empobrecer” é direto e natural.
- source_word: אָחִיךָ
  choice: o seu irmão
  rationale: Mantém a linguagem familiar do hebraico, que no contexto designa um membro da comunidade da aliança, sem substituí-la por uma paráfrase interpretativa.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: e ficar sem meios de se sustentar ao seu lado
  rationale: Traduz o sentido econômico da expressão idiomática, segundo a qual a “mão” da pessoa vacila ou perde força, e mantém em “ao seu lado” a dimensão relacional de עִמָּךְ.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: você deverá ampará-lo
  rationale: O hifil de חזק pede aqui que se dê firmeza e apoio à pessoa necessitada. “Amparar” abrange ajuda concreta sem restringi-la indevidamente a uma única forma.
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Designa alguém de origem estrangeira que reside na comunidade; a expressão preserva tanto sua condição estrangeira quanto sua residência local.
- source_word: וְתוֹשָׁב
  choice: ou residente temporário
  rationale: Indica uma pessoa estabelecida sem plena condição permanente. “Residente temporário” diferencia o termo de גֵּר; “ou” evita afirmar que os dois substantivos necessariamente designam uma única categoria.
- source_word: וָחַי
  choice: para que ele viva
  rationale: Expressa naturalmente o resultado ou propósito do amparo, sem eliminar por completo a proximidade entre valor consecutivo e final da construção hebraica.
- source_word: עִמָּךְ
  choice: ao seu lado
  rationale: Comunica a permanência da pessoa junto à comunidade e repete a formulação relacional usada anteriormente no versículo.
theological_decisions:
- issue: Alcance de “o seu irmão”
  choice: Manter o termo familiar literal, entendido contextualmente como membro da comunidade da aliança.
  alternative: Traduzir explicitamente como “seu compatriota israelita” ou “seu parente”.
  rationale: A linguagem de parentesco pertence ao texto e sustenta a obrigação comunitária sem exigir que a tradução torne explícita uma identificação contextual.
- issue: Função sintática de גֵּר וְתוֹשָׁב
  choice: 'Ligar a expressão à condição em que o irmão necessitado poderá viver junto do destinatário: “como estrangeiro residente ou residente temporário”.'
  alternative: 'Entender a expressão como objeto adicional da ordem: “ampare-o — bem como o estrangeiro residente e o residente temporário”.'
  rationale: O hebraico é sintaticamente comprimido. A leitura adotada produz uma frase portuguesa coerente e próxima da sequência textual, enquanto a alternativa genuína é preservada em nota.
- issue: Valor de וָחַי
  choice: 'Traduzir como propósito ou resultado: “para que ele viva”.'
  alternative: 'Traduzir como oração coordenada: “e ele viverá”.'
  rationale: A formulação escolhida comunica o efeito pretendido do amparo, sem transformar a frase em promessa independente.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. A formulação evita arcaísmos como “forasteiro” e “peregrino” quando estes obscureceriam as categorias sociais do hebraico. A repetição de “ao seu lado” reproduz o elo relacional criado pela repetição de עִמָּךְ.
