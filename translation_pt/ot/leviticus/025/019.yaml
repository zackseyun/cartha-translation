  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: pt
  text: A terra dará o seu fruto, e vocês comerão até ficarem satisfeitos e habitarão[a] nela em segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “viverão”. O verbo hebraico pode significar “viver” ou “habitar” e, aqui, ressalta a permanência segura na terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנָה
  choice: dará
  rationale: Preserva o sentido básico de נתן, “dar”, e soa natural com “a terra” como sujeito e “o seu fruto” como objeto.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto de Levítico 25, refere-se à terra em que Israel habitaria e cultivaria, não ao planeta em sentido geral.
- source_word: פִּרְיָהּ
  choice: o seu fruto
  rationale: Mantém a imagem concreta de פְּרִי, que pode abranger tanto fruto como produção agrícola.
- source_word: וַאֲכַלְתֶּם לָשֹׂבַע
  choice: vocês comerão até ficarem satisfeitos
  rationale: Expressa de modo claro e atual a ideia de comer até a saciedade, sem sugerir necessariamente excesso.
- source_word: וִישַׁבְתֶּם
  choice: habitarão
  rationale: ישב, neste contexto, indica residência estável na terra; “habitarão” preserva essa nuance melhor que o mais genérico “viverão”.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: Comunica a ideia de segurança e tranquilidade associada a בֶּטַח.
- source_word: עָלֶיהָ
  choice: nela
  rationale: O pronome retoma “a terra”; em português, “habitar nela” é mais natural que a reprodução literal “sobre ela”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês” para explicitar a segunda pessoa do plural. A formulação conserva a imagem de a terra dar seu fruto e mantém a nuance de habitação estável e segura.
