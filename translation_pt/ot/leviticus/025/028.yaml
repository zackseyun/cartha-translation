revisions:
- from: Mas, se ele não tiver recursos suficientes para devolver ao comprador o valor devido, aquilo que vendeu permanecerá nas mãos do comprador até o ano do Jubileu. No Jubileu, sairá das mãos do comprador, e ele voltará à sua propriedade.[a]
  to: Mas, se ele não tiver recursos suficientes para resgatar o bem vendido, este permanecerá nas mãos de quem o comprou até o ano do Jubileu. No Jubileu, o bem sairá, e ele voltará à sua propriedade.[a]
  rationale: A revisão substitui a explicitação indevida de “o valor devido” por “resgatar o bem vendido”, que comunica o efeito jurídico-econômico pretendido sem acrescentar um objeto que o hebraico não declara. Também esclarece o sujeito do verbo “sairá” e torna a nota de ambiguidade gramatical inequívoca.
