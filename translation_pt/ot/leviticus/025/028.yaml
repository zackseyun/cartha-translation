source:
  edition: WLC
  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: pt
  text: Mas, se ele não tiver recursos suficientes para resgatar o bem vendido, este permanecerá nas mãos de quem o comprou até o ano do Jubileu. No Jubileu, o bem sairá, e ele voltará à sua propriedade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o bem vendido voltará à posse dele”. O verbo hebraico também pode ser entendido tendo como sujeito o bem vendido, em vez do vendedor.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ
  choice: ele não tiver recursos
  rationale: A expressão hebraica diz literalmente que “sua mão não encontrou”, usando “mão” como metonímia dos meios disponíveis. Em português atual, “não tiver recursos” comunica com clareza o sentido econômico da expressão.
- source_word: דֵּי
  choice: suficientes
  rationale: דֵּי indica suficiência; “recursos suficientes” forma uma expressão natural e precisa no contexto do resgate da propriedade.
- source_word: הָשִׁיב לוֹ
  choice: devolver ao comprador o valor devido
  rationale: No contexto imediato, trata-se de entregar ao comprador a quantia necessária para resgatar a propriedade. A explicitação de “ao comprador” e “o valor devido” evita que o leitor entenda que a própria terra seria devolvida ao comprador.
- source_word: מִמְכָּרוֹ
  choice: aquilo que vendeu
  rationale: O substantivo pode designar a venda ou o bem vendido. Como esse bem permanece sob o controle do comprador até o Jubileu, “aquilo que vendeu” expressa de modo natural o referente concreto sem restringi-lo além do hebraico.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: nas mãos do comprador
  rationale: A formulação conserva a imagem hebraica da “mão” como posse ou controle e soa natural em português.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: o ano do Jubileu
  rationale: Tradução direta e tradicional da expressão hebraica, clara no contexto legal de Levítico 25.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: No Jubileu, sairá das mãos do comprador
  rationale: יצא significa “sair”. A expressão “das mãos do comprador”, inferida da oração anterior, esclarece de qual domínio o bem sai e preserva a imagem jurídica do texto.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: e ele voltará à sua propriedade
  rationale: O verbo masculino singular é apresentado com o vendedor original como sujeito provável. אֲחֻזָּה designa a propriedade fundiária ou hereditária; “sua propriedade” é claro e adequado ao contexto.
theological_decisions:
- issue: Referente do sujeito de וְשָׁב
  choice: 'O proprietário original é o sujeito: “ele voltará à sua propriedade”.'
  alternative: 'O bem vendido é o sujeito: “ela voltará à posse dele”.'
  rationale: A forma verbal masculina singular permite, no discurso hebraico, relacionar o verbo tanto ao proprietário quanto ao bem vendido, designado anteriormente pelo substantivo masculino מִמְכָּר. O contexto do Jubileu favorece o retorno do proprietário à sua herança, mas a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a imagem das “mãos” para posse ou controle, mas traduz dinamicamente a expressão idiomática inicial para evitar obscuridade. A pontuação divide o longo período legal em duas frases para facilitar a leitura.
