source:
  edition: WLC
  text: אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה לּ֑/וֹ אֶחָ֥ד מֵ/אֶחָ֖י/ו יִגְאָלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: pt
  text: Depois de ter sido vendido, ele poderá ser resgatado; um de seus irmãos poderá resgatá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido mais amplo: “um de seus parentes do sexo masculino poderá resgatá-lo”. O hebraico diz literalmente “um de seus irmãos”, referindo-se a um membro da família que atua como parente-resgatador.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: Depois de ter sido vendido
  rationale: A locução temporal seguida do nifal de מכר apresenta a venda como fato já ocorrido; o infinitivo composto é natural em português e conserva a voz passiva.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: ele poderá ser resgatado
  rationale: A construção nominal-existencial indica que, mesmo após a venda, o resgate permanece possível ou legalmente disponível. A formulação verbal é clara e idiomática em português.
- source_word: אֶחָד מֵאֶחָיו
  choice: um de seus irmãos
  rationale: Reproduz o sentido literal masculino de 'um dentre seus irmãos' no contexto jurídico do resgatador familiar, sem ampliá-lo silenciosamente para todo tipo de parente.
- source_word: יִגְאָלֶנּוּ
  choice: poderá resgatá-lo
  rationale: O verbo גאל designa o ato de resgate exercido por um familiar. 'Resgatar' conserva o teor jurídico e a ressonância bíblica; 'poderá' expressa a possibilidade prevista pela norma.
theological_decisions:
- issue: Alcance do termo de parentesco אֶחָיו
  choice: seus irmãos
  alternative: seus parentes do sexo masculino
  rationale: O texto hebraico diz literalmente 'seus irmãos' e emprega forma masculina. O texto principal preserva essa especificidade, enquanto a nota esclarece a função familiar mais ampla que o termo pode assumir neste contexto legal.
- issue: Forma da provisão de resgate em גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: ele poderá ser resgatado
  alternative: haverá para ele direito de resgate
  rationale: A tradução verbal comunica naturalmente a disponibilidade jurídica do resgate sem transformar a possibilidade em garantia de que ele necessariamente ocorrerá.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “resgatado/resgatá-lo” foi mantida para refletir o vínculo lexical entre גְּאֻלָּה e גאל. O marcador foi colocado após a cláusula a que a nota se refere.
