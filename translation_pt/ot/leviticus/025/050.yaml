id: LEV.25.50
reference: Leviticus 25:50
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: pt
  text: Ele fará o cálculo com seu comprador, desde o ano em que se vendeu a ele até o ano do jubileu[a], e o preço de sua venda será conforme o número de anos; ele estará com ele pelo tempo de um trabalhador contratado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o ano em que foi vendido a ele”. A expressão hebraica admite essa formulação mais literal; o contexto indica que o homem se vendeu para prestar serviço.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “como os dias de um trabalhador contratado, ele estará com ele”. A comparação apresenta sua permanência como serviço contratado, não como posse perpétua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: fará o cálculo
  rationale: O verbo indica um acerto financeiro para determinar o valor do resgate; a expressão é clara e preserva o sentido jurídico-econômico.
- source_word: קֹנֵהוּ
  choice: seu comprador
  rationale: O particípio de קנה designa quem o adquiriu; “comprador” conserva de modo conciso a força transacional.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: desde o ano em que se vendeu a ele
  rationale: A formulação explicita naturalmente o sentido reflexivo indicado pelo contexto, sem apagar a possibilidade de uma tradução mais formal, registrada em nota.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: até o ano do jubileu
  rationale: Expressão corrente e inteligível para a instituição legal israelita.
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: O preço da sua venda será
  rationale: כֶּסֶף significa literalmente dinheiro ou prata, mas aqui designa o valor monetário da venda.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: proporcional ao número de anos
  rationale: A preposição e o contexto do resgate indicam que o preço deve ser calculado em função dos anos relevantes, não apenas enumerado.
- source_word: כִּימֵי שָׂכִיר
  choice: como o de um trabalhador contratado
  rationale: שָׂכִיר é alguém que trabalha por remuneração. A formulação comunica a comparação entre o período de serviço e o tempo de trabalho contratado.
- source_word: יִהְיֶה עִמּוֹ
  choice: o tempo que estiver com ele será contado
  rationale: A redação torna explícita em português a relação temporal sugerida por “dias” e pelo cálculo dos anos, preservando o sentido de sua permanência junto ao comprador.
theological_decisions:
- issue: Natureza da relação com o comprador
  choice: Comparar o período ao de um trabalhador contratado
  alternative: 'Traduzir apenas de forma literal: “como os dias de um trabalhador contratado estará com ele”'
  rationale: O texto enquadra a avaliação econômica do serviço sem declarar posse perpétua da pessoa; a tradução preserva essa distinção legal sem acrescentar uma doutrina externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe jurídica foi moderadamente explicitada para clareza, enquanto as alternativas mais formais e a ambiguidade da construção passiva/reflexiva foram preservadas em notas.
