  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my slaves[a], whom I brought out from the land of Egypt[b]; they shall not be sold as slaves are sold.
translation:
  language: pt
  text: Pois eles são meus escravos[a], os quais tirei da terra do Egito; não serão vendidos como se vendem escravos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus servos”. O hebraico עֲבָדַי admite ambas as traduções; “escravos” foi usado aqui porque o versículo enfatiza o pertencimento e proíbe que sejam vendidos como propriedade escrava comum.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não serão vendidos com a venda de um escravo”, isto é, à maneira de uma transação comum de escravos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da norma anterior e mantém com naturalidade a força explicativa do hebraico.
- source_word: עֲבָדַי
  choice: meus escravos
  rationale: O substantivo עֶבֶד com sufixo de primeira pessoa pluraliza a relação de pertencimento. Neste contexto jurídico, a condição de escravo é central, pois israelitas não devem ser tratados como propriedade escrava comum; a nota registra a alternativa lexical menos forte.
- source_word: הֵם
  choice: eles são
  rationale: O pronome explícito tem valor enfático; a cópula, implícita em hebraico, é expressa naturalmente em português.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: os quais tirei
  rationale: Reproduz a oração relativa e a fórmula do êxodo sem acrescentar uma interpretação ao ato de fazer sair.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Equivalente convencional e claro da expressão geográfica hebraica.
- source_word: לֹא יִמָּכְרוּ
  choice: não serão vendidos
  rationale: O nifal imperfeito em contexto legal expressa uma proibição na voz passiva.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: como se vendem escravos
  rationale: Comunica de modo natural a maneira ou modalidade de venda própria de uma transação de escravos, sem reduzir a expressão a uma formulação abstrata.
theological_decisions:
- issue: Sentido de עֲבָדַי na relação entre YHWH e os israelitas resgatados do Egito
  choice: meus escravos
  alternative: meus servos
  rationale: A fundamentação da proibição apela ao pertencimento dos israelitas a YHWH e contrasta esse vínculo com sua venda como propriedade escrava comum. “Escravos” conserva a força social e jurídica do termo, enquanto a nota preserva a alternativa legítima “servos”, sem importar conotações raciais modernas.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica direta. “Pois” liga o versículo à norma anterior; “os quais” mantém a relação sintática com leve solenidade. As duas notas esclarecem a amplitude de עֶבֶד e a construção idiomática final.
