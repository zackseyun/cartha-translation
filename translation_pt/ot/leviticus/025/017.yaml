id: LEV.25.17
reference: Leviticus 25:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת עֲמִית֔/וֹ וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: pt
  text: Ninguém explore o seu próximo[a]; tema, porém, o seu Deus, pois eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prejudique” ou “tire vantagem injusta do seu próximo”. O verbo hebraico pode indicar explorar alguém ou agir injustamente contra essa pessoa em relações sociais ou econômicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: explore
  rationale: No contexto socioeconômico das leis do jubileu, o hifil de ינה indica prejudicar ou tirar vantagem injusta de alguém. “Explore” comunica essa força com clareza no português atual, sem limitar a proibição a um único tipo de fraude.
- source_word: אִישׁ
  choice: ninguém
  rationale: 'A construção אִישׁ אֶת־עֲמִיתוֹ tem força distributiva: nenhuma pessoa deve explorar o seu próximo. Em português, “ninguém” reproduz naturalmente a proibição geral; “nenhum homem” poderia ser entendido de modo indevidamente restrito ao sexo masculino.'
- source_word: עֲמִיתוֹ
  choice: o seu próximo
  rationale: עָמִית designa aqui o semelhante ou membro da mesma comunidade com quem se mantêm relações sociais e econômicas. “Próximo” preserva a dimensão interpessoal e é natural no registro bíblico moderno.
- source_word: וְיָרֵאתָ
  choice: tema, porém
  rationale: Embora וְ seja formalmente “e”, a segunda oração contrasta a exploração do próximo com o temor de Deus. “Porém” explicita essa relação sem alterar o sentido do mandamento.
- source_word: מֵאֱלֹהֶיךָ
  choice: o seu Deus
  rationale: Depois de ירא, a preposição מִן introduz idiomaticamente o objeto do temor; em português, a formulação natural é “temer a Deus”, não “temer de Deus”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino YHWH. “Yahweh” o representa como nome próprio, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: O sufixo hebraico é plural e se refere a toda a comunidade. “De vocês” torna explícita essa mudança do singular individual na ordem para o plural comunitário na fórmula final.
- source_word: כִּי
  choice: pois
  rationale: A conjunção fundamenta o mandamento na identidade e autoridade de Yahweh; “pois” preserva de modo natural sua força causal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: Como o hebraico emprega diretamente o Tetragrama, a tradução conserva o nome próprio em forma transliterada, sem substituí-lo por um título.
- issue: Alcance de אִישׁ na proibição
  choice: Ninguém
  alternative: Nenhum homem
  rationale: O masculino singular hebraico funciona distributivamente numa norma dirigida à comunidade. “Ninguém” preserva o alcance representativo universal no português moderno, sem sugerir que mulheres estejam excluídas da ordem.
- issue: Número dos pronomes de segunda pessoa
  choice: “seu Deus” no mandamento e “Deus de vocês” na declaração final
  alternative: Uniformizar ambos como “seu Deus”
  rationale: O hebraico passa do singular na exortação individual (אֱלֹהֶיךָ) ao plural na fórmula dirigida à comunidade (אֱלֹהֵיכֶם). A tradução conserva essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção no singular “o seu próximo” mantém o caráter distributivo, enquanto “Deus de vocês” preserva o plural comunitário do texto hebraico.
