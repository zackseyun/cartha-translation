    issue: «sete sábados de anos» é ambíguo e pouco idiomático no corpo do texto.
    rationale: Em português, «sábado» normalmente se refere ao dia da semana; aqui o hebraico designa ciclos sabáticos de sete anos. «Semanas de anos» evita uma leitura indevida, enquanto a nota conserva o literal.
  - severity: medium
    issue: As expressões «Conte para você» e «serão para você quarenta e nove anos» soam calcadas no hebraico.
    rationale: A construção portuguesa resultante é artificial e dificulta a compreensão. A relação de resultado pode ser expressa naturalmente por «totalizarão» sem alterar o sentido.
  revised_text: 'Você deverá contar sete semanas de anos[a]: sete anos, sete vezes. Os dias dessas sete semanas de anos totalizarão quarenta e nove anos.'
