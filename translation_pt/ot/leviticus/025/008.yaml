base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: pt
  text: 'Você deverá contar sete semanas de anos[a]: sete anos, sete vezes. Os dias dessas sete semanas de anos totalizarão quarenta e nove anos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sete sábados de anos». O hebraico diz literalmente «sete sábados de anos», referindo-se a sete ciclos de sete anos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ
  choice: Conte
  rationale: O verbo ספר significa contar ou enumerar. O imperativo em português comunica naturalmente a instrução jurídica expressa pelo perfeito hebraico com valor prescritivo.
- source_word: לְךָ
  choice: para você
  rationale: Mantém a referência explícita à segunda pessoa sem recorrer ao mais reflexivo e menos exato «para si mesmo».
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: sete sábados de anos
  rationale: Preserva a imagem hebraica e sua ligação com o descanso sabático da terra; a nota esclarece que se trata de sete ciclos de sete anos.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: sete anos sete vezes
  rationale: Conserva a ordem e a repetição enfática do hebraico, com formulação inteligível em português.
- source_word: וְהָיוּ לְךָ
  choice: serão para você
  rationale: Reproduz de perto a construção hebraica e deixa que o total resultante seja expresso pela frase seguinte, sem acrescentar «somarão».
- source_word: יְמֵי
  choice: os dias
  rationale: Mantém o substantivo concreto do original, usado para designar a duração total dos ciclos.
- source_word: שֶׁבַע שַׁבְּתֹת הַשָּׁנִים
  choice: os sete sábados de anos
  rationale: Mantém consistência com a primeira ocorrência e preserva a expressão distintiva do texto hebraico.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: quarenta e nove anos
  rationale: Emprega a ordem numérica normal do português para comunicar com clareza o total.
