  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: pt
  text: Mas, se ele não for resgatado por esses meios[a], então ele e seus filhos sairão juntos no ano do Jubileu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por estes” — referência às disposições para o resgate descritas nos versículos anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz a continuação condicional e expressa o leve contraste com as possibilidades de resgate apresentadas antes.
- source_word: יִגָּאֵל
  choice: for resgatado
  rationale: O nifal de גאל indica ser resgatado ou recuperado mediante o mecanismo legal de resgate; a escolha preserva tanto o sentido jurídico quanto sua ressonância teológica.
- source_word: בְּאֵלֶּה
  choice: por esses meios
  rationale: A expressão remete às formas de resgate descritas nos versículos anteriores; “meios” torna natural e claro o referente sem restringi-lo indevidamente.
- source_word: וְיָצָא
  choice: então ... sairão
  rationale: O hebraico diz literalmente “e sairá”; “então” explicita a consequência da condição, enquanto “sairão” preserva a imagem hebraica de deixar a servidão.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: no ano do Jubileu
  rationale: Emprega o termo consagrado em português para יוֹבֵל e conserva a referência temporal legal.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: ele e seus filhos
  rationale: Mantém o pronome explícito e o masculino plural בָנָיו; a coordenação verbal no plural produz português natural. “Com ele” fica semanticamente representado pela reunião de ambos como sujeitos da saída.
theological_decisions:
- issue: Termo doméstico masculino בָנָיו
  choice: filhos
  alternative: crianças / filhos e filhas
  rationale: O texto hebraico emprega explicitamente o plural masculino “filhos”; a tradução conserva essa forma em vez de ampliá-la de maneira interpretativa.
- issue: Sentido de וְיָצָא no contexto da servidão
  choice: sairão
  alternative: serão libertados
  rationale: “Sairão” preserva a formulação concreta e a ambiguidade idiomática do hebraico, embora o contexto jurídico indique libertação da servidão.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A formulação mantém a concisão jurídica do hebraico e usa “Jubileu” como termo bíblico reconhecido.
