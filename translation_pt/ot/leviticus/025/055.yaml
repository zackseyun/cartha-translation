  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: pt
  text: Pois os filhos de Israel[a] são meus escravos[b]; são meus escravos, que tirei da terra do Egito. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os israelitas” ou “os descendentes de Israel”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “servos”. O termo hebraico designa pessoas em serviço vinculado; neste contexto, “escravos” preserva o contraste entre o pertencimento de Israel a Yahweh e sua sujeição a senhores humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da legislação anterior e conserva de modo natural o valor explicativo da conjunção.
- source_word: לִי
  choice: meus
  rationale: A preposição com o sufixo pronominal expressa posse ou pertencimento; o possessivo é conciso e idiomático em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e corporativa do hebraico; a nota registra a alternativa coletiva corrente.
- source_word: עֲבָדִים / עֲבָדַי
  choice: servos / meus servos
  rationale: “Servos” mantém o registro de pertencimento e serviço pactuais sem excluir o sentido de condição vinculada; a repetição reproduz a ênfase hebraica, e a nota registra “escravos” como alternativa mais forte.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: os quais tirei
  rationale: Expressa naturalmente o hifil de יצא e preserva a fórmula do êxodo.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Formulação portuguesa clara e fiel à expressão hebraica tradicional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Reproduz a fórmula pactual e torna explícito, em português corrente, que o sufixo é plural.
theological_decisions:
- issue: Sentido de עבד no contexto do pertencimento pactual e da servidão vinculada
  choice: servos
  alternative: escravos
  rationale: O termo hebraico abrange serviço e condição de escravo. “Servos” se ajusta ao registro pactual da declaração, enquanto a nota preserva a leitura mais forte, importante para o contraste com senhores humanos.
- issue: Expressão corporativa masculina בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução principal conserva a forma familiar e corporativa do hebraico sem afirmar que o referente se limita aos homens; a alternativa idiomática aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a repetição enfática do hebraico e usa “vocês” para deixar claro o plural de אֱלֹהֵיכֶם.
