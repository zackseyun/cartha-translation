source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: pt
  text: Mas, no sétimo ano, a terra terá um sábado de descanso completo[a], um sábado dedicado a Yahweh. Não semeie o seu campo nem pode a sua vinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um sábado de repouso solene». A expressão hebraica intensifica a ideia de cessação completa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: Mas, no sétimo ano
  rationale: A conjunção וּ introduz aqui contraste com os seis anos de cultivo do versículo anterior; «mas» expressa naturalmente essa progressão.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: um sábado de descanso completo
  rationale: A construção intensifica a ideia de cessação, preservando ao mesmo tempo o termo «sábado» e a ênfase de שַׁבָּתוֹן.
- source_word: יִהְיֶה לָאָרֶץ
  choice: a terra terá
  rationale: Formulação portuguesa natural que mantém a terra como aquela que recebe e desfruta o descanso.
- source_word: שַׁבָּת לַיהוָה
  choice: um sábado dedicado a Yahweh
  rationale: «Dedicado a» torna explícita, sem exagero, a força consagratória do ל hebraico.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: Não semeie o seu campo
  rationale: O imperativo negativo comunica com clareza a proibição legal dirigida ao israelita individual.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: nem pode a sua vinha
  rationale: No contexto vitícola, זמר significa podar; «nem» liga naturalmente as duas proibições paralelas.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal da aliança sem o substituir por um título.
- issue: Sentido de שַׁבָּת לַיהוָה
  choice: um sábado dedicado a Yahweh
  alternative: um sábado para Yahweh
  rationale: A tradução escolhida preserva a ideia de descanso consagrado a Deus, sem definir mais precisamente a natureza dessa dedicação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. Usa «seu/sua» para o singular hebraico e evita construções jurídicas excessivamente arcaicas.
