  terminology: «Sábado de descanso completo» representa adequadamente a intensificação de שַׁבַּת שַׁבָּתוֹן; «dedicado a Yahweh» comunica de forma legítima a força consagratória de לַיהוָה. «Campo», «vinha», «semear» e «podar» são os equivalentes agrícolas adequados.
