  source_fidelity: A tradução transmite com precisão o contraste do sétimo ano, o descanso sabático completo destinado à terra, sua dedicação a Yahweh e as duas proibições agrícolas. «Pod(e)» é a forma correta do presente do subjuntivo de «podar» na construção negativa («não ... pode»).
