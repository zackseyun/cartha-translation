base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: pt
  text: 'E se vocês disserem: “O que comeremos no sétimo ano, visto que não semearemos nem recolheremos a nossa produção?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: E se vocês perguntarem
  rationale: A construção introduz uma situação hipotética. Embora אָמַר signifique literalmente “dizer”, em português natural a fala direta interrogativa é bem introduzida por “perguntarem”.
- source_word: מַה נֹאכַל
  choice: O que comeremos
  rationale: Reproduz diretamente a pergunta hebraica e mantém a primeira pessoa do plural.
- source_word: הֵן
  choice: visto que
  rationale: Aqui a partícula apresenta a circunstância que fundamenta a preocupação. “Visto que” expressa essa relação no português atual sem o arcaísmo de “eis que”.
- source_word: לֹא נִזְרָע וְלֹא נֶאֱסֹף
  choice: não semearemos nem recolheremos
  rationale: Mantém os dois verbos na primeira pessoa do plural e usa “nem” para coordenar naturalmente as duas negações.
- source_word: תְּבוּאָתֵנוּ
  choice: a nossa produção
  rationale: O substantivo designa o produto ou rendimento agrícola; “produção” preserva a abrangência sem restringi-lo indevidamente a um cereal específico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “vocês” adequado à leitura brasileira e amplamente compreensível. A formulação conserva a preocupação prática do povo e a relação lógica entre a pergunta e a suspensão do plantio e da colheita.
