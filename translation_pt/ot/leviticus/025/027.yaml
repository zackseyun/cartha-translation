  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: pt
  text: Então calculará os anos decorridos desde a venda e devolverá o valor excedente[a] ao homem a quem vendeu a propriedade; e voltará à sua propriedade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o restante” ou “o excedente”. O hebraico se refere ao montante que sobra após o cálculo do valor correspondente aos anos que ainda restavam.
    reason: lexical_alternative
  - marker: b
    text: “Sua propriedade” se refere à sua posse de terra, provavelmente a propriedade hereditária de sua família em Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: então calculará
  rationale: O verbo חִשֵּׁב indica calcular o valor do resgate; “então” expressa naturalmente a sequência do procedimento legal.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: os anos decorridos desde a venda
  rationale: A expressão é literalmente “os anos de sua venda”, mas, neste contexto, designa os anos transcorridos desde que a propriedade foi vendida, dos quais depende o cálculo.
- source_word: וְהֵשִׁיב אֶת הָעֹדֵף
  choice: devolverá ... o valor excedente
  rationale: O hifil de שׁוב indica devolver ou restituir, e הָעֹדֵף é aquilo que sobra após o cálculo. “Valor excedente” explicita, sem definir a quantia, que se trata de um acerto financeiro.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: ao homem a quem a vendeu
  rationale: Preserva a referência pessoal do hebraico e supre o objeto feminino “a”, que remete à propriedade vendida no contexto.
- source_word: וְשָׁב
  choice: assim, voltará
  rationale: O qal de שׁוב indica o retorno do vendedor à sua terra depois do resgate; “assim” liga esse resultado ao pagamento anterior.
- source_word: לַאֲחֻזָּתוֹ
  choice: à sua propriedade
  rationale: אֲחֻזָּה designa aqui uma posse de terra, no contexto a propriedade familiar vinculada à herança em Israel. “Propriedade” é claro no texto principal, e a nota preserva a nuance histórica.
theological_decisions:
- issue: Sentido de אֲחֻזָּה na legislação do jubileu
  choice: sua propriedade
  alternative: sua propriedade hereditária / sua possessão
  rationale: O termo não indica propriedade genérica apenas, mas uma posse de terra familiar no sistema fundiário de Israel. A tradução principal mantém leitura natural, enquanto a nota registra a dimensão hereditária sem impor formulação interpretativa excessiva.
translation_notes:
  register: Português moderno, digno e acessível, com formulação jurídica clara. O futuro do indicativo expressa a prescrição legal de modo natural. Os marcadores [a] e [b] aparecem no texto principal junto aos termos esclarecidos.
