  text: וְ/אִם מְעַ֞ט נִשְׁאַ֧ר בַּ/שָּׁנִ֛ים עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל וְ/חִשַּׁב ל֑/וֹ כְּ/פִ֣י שָׁנָ֔י/ו יָשִׁ֖יב אֶת גְּאֻלָּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: pt
  text: Mas, se restarem poucos anos até o Ano do Jubileu, ele fará o cálculo com o comprador e, de acordo com esses anos, devolverá o valor do seu resgate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pagará o preço do seu resgate”. A expressão hebraica se refere ao valor necessário para o resgate, não ao resgate em sentido abstrato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: restarem poucos anos
  rationale: Expressa naturalmente em português o valor quantitativo de מְעַט e o sentido de permanência do nifal נִשְׁאַר.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: Ano do Jubileu
  rationale: Designação corrente e clara da instituição legal de Levítico 25; a inicial maiúscula indica seu caráter formal.
- source_word: וְחִשַּׁב לוֹ
  choice: fará o cálculo com o comprador
  rationale: חִשַּׁב tem sentido de calcular neste contexto econômico. A explicitação contextual de לוֹ como “com o comprador” evita a ambiguidade pronominal em português sem alterar os participantes do procedimento.
- source_word: כְּפִי שָׁנָיו
  choice: de acordo com esses anos
  rationale: כְּפִי indica correspondência ou proporção; “esses anos” retoma naturalmente os poucos anos restantes mencionados no início do versículo.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: devolverá o valor do seu resgate
  rationale: O hifil de שׁוב indica devolver ou restituir, e גְּאֻלָּה, neste procedimento, refere-se concretamente ao valor necessário para o resgate.
