  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: pt
  text: De acordo com o número de anos depois do Jubileu, você comprará de seu compatriota; de acordo com o número de anos de produção agrícola[a], ele venderá a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de acordo com o número de anos de produtos agrícolas/colheitas”. O preço da venda se baseava no número de anos produtivos que restavam até o próximo Jubileu, e não numa transferência permanente da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר שָׁנִים אַחַר הַיּוֹבֵל
  choice: De acordo com o número de anos depois do Jubileu
  rationale: A construção com בְּמִסְפַּר indica medida ou critério. A tradução mantém a estrutura temporal do hebraico sem acrescentar explicitamente «restantes», ideia fornecida pelo contexto mais amplo.
- source_word: תִּקְנֶה
  choice: você comprará
  rationale: O imperfeito de segunda pessoa masculina singular tem força normativa neste contexto legal; o futuro em português preserva essa instrução com naturalidade e dignidade.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: de seu compatriota
  rationale: עָמִית designa aqui outro membro da comunidade de Israel. «Compatriota» comunica a relação comunitária e jurídica melhor que o genérico «próximo», sem reduzir o termo a amizade pessoal.
- source_word: בְּמִסְפַּר שְׁנֵי תְבוּאֹת
  choice: de acordo com o número de anos de colheitas
  rationale: A expressão significa literalmente anos de produtos agrícolas ou colheitas e estabelece a base econômica da venda. A formulação preserva a referência tanto aos anos quanto à produção.
- source_word: יִמְכָּר לָךְ
  choice: ele venderá a você
  rationale: O futuro conserva a simetria jurídica com «você comprará» e mantém explícitos vendedor e comprador.
theological_decisions:
- issue: Natureza temporária da transferência da terra
  choice: Manter no versículo o critério dos anos e explicar em nota sua relação com o próximo Jubileu
  alternative: Inserir no texto «anos restantes até o próximo Jubileu»
  rationale: O contexto indica que o preço corresponde às colheitas disponíveis antes do próximo Jubileu, mas essas palavras não aparecem integralmente neste versículo. A nota esclarece a aplicação sem transformar inferência contextual em tradução direta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Jubileu» conserva o termo bíblico estabelecido; a sintaxe paralela reflete a formulação jurídica hebraica.
