review_pass:
  verdict: revise
  source_fidelity: 'O texto traduz adequadamente a estrutura comparativa do hebraico: a pessoa deve estar na casa do israelita como trabalhador contratado e como estrangeiro residente, até o ano do jubileu. A repetição de «com você» reproduz o עִמָּךְ do original, embora em português «servirá com você» preserve uma formulação algo literal.'
  naturalness: O português é moderno, claro e de registro apropriado. «Estrangeiro residente» comunica bem a categoria social indicada por תּוֹשָׁב; «forasteiro» é uma alternativa lexical possível, ainda que menos específica quanto à residência.
  terminology: '«Trabalhador contratado», «estrangeiro residente» e «ano do jubileu» são escolhas aceitáveis e não introduzem leituras doutrinárias. A nota lexical, porém, está ancorada no termo errado: ela comenta «estrangeiro residente», não «trabalhador contratado».'
  issues:
  - severity: medium
    issue: Âncora da nota de rodapé posicionada após «trabalhador contratado».
    rationale: A nota «Ou “como forasteiro”» oferece uma alternativa para «como estrangeiro residente» (תּוֹשָׁב). A âncora deve seguir essa expressão, para que a referência lexical seja inequívoca.
  revised_text: Ele estará com você como trabalhador contratado, como estrangeiro residente[a]; servirá com você até o ano do jubileu.
  revised_footnotes:
  - marker: a
    text: Ou “como forasteiro”.
    reason: lexical_alternative
  revision_rationale: A única revisão necessária é deslocar a âncora da nota para «estrangeiro residente», expressão à qual a alternativa «forasteiro» corresponde. O sentido do versículo e as escolhas lexicais são preservados.
