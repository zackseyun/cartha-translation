  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: pt
  text: Ele estará com você como trabalhador contratado, como estrangeiro residente[a]; trabalhará para você até o ano do jubileu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como forasteiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: como trabalhador contratado
  rationale: שָׂכִיר designa quem trabalha mediante pagamento. A expressão é clara em português atual e, no contexto, distingue essa pessoa de um escravo.
- source_word: כְּתוֹשָׁב
  choice: como estrangeiro residente
  rationale: תּוֹשָׁב designa um não nativo que reside entre os israelitas. “Estrangeiro residente” comunica de modo natural a categoria social e jurídica, sem o tom arcaico de “forasteiro”.
- source_word: יִהְיֶה עִמָּךְ
  choice: estará com você
  rationale: Reproduz diretamente a relação expressa pelo hebraico; o valor comparativo já aparece nos dois termos introduzidos por כְּ.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: até o ano do jubileu
  rationale: Mantém a designação técnica do ano de libertação regulamentado em Levítico 25.
- source_word: יַעֲבֹד עִמָּךְ
  choice: servirá com você
  rationale: עבד pode significar servir ou trabalhar. “Servirá com você” preserva a repetição de עִמָּךְ e evita intensificar a ideia de domínio além do que o contexto permite.
theological_decisions:
- issue: Condição do israelita endividado durante o serviço
  choice: A tradução o apresenta como trabalhador contratado e estrangeiro residente, não como escravo.
  alternative: Empregar “servo contratado” ou formular a oração de maneira que sugira condição escrava.
  rationale: O contexto imediato (Lv 25:39-43) distingue explicitamente esse israelita de um escravo e limita seu período e suas condições de serviço. A tradução preserva essa distinção sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” representa o singular hebraico; “jubileu” conserva o termo jurídico tradicional. A formulação mantém a repetição de “com você” presente no original.
