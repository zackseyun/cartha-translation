review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente as duas comparações ("como trabalhador contratado" e "como estrangeiro residente") e o limite temporal "até o ano do jubileu". Contudo, "servirá com você" é pouco natural em português e pode sugerir que ele servirá ao lado do interlocutor, em vez de trabalhar sob sua responsabilidade. Neste contexto, עבד עם pode ser expresso idiomaticamente como trabalhar para alguém, sem alterar a condição temporária e não escrava explicitada no contexto.
  naturalness: '"Estrangeiro residente" e "trabalhador contratado" são claros e adequados ao registro. A substituição de "servirá com você" por "trabalhará para você" torna a última oração natural e inequívoca em português moderno.'
  terminology: '"Jubileu" preserva corretamente o termo técnico. "Estrangeiro residente" é uma opção apropriada para תושב; a nota com "forasteiro" registra uma alternativa tradicional, embora mais ampla e menos atual.'
  issues:
  - severity: medium
    issue: '"servirá com você" é semanticamente ambíguo e pouco idiomático em português.'
    rationale: Em português, a expressão tende a comunicar serviço conjunto ou colaboração lado a lado. No hebraico, a formulação descreve o trabalho da pessoa na relação com o israelita que a acolhe/emprega. "Trabalhará para você" transmite essa relação de modo idiomático, sem designá-la como escrava.
  revised_text: Ele estará com você como trabalhador contratado, como estrangeiro residente[a]; trabalhará para você até o ano do jubileu.
  revised_footnotes:
  - marker: a
    text: Ou “como forasteiro”.
    reason: lexical_alternative
  revision_rationale: A revisão limita-se à oração final, para expressar em português natural a relação de trabalho indicada por עבד עם, evitando a leitura de que a pessoa e o destinatário trabalharão juntos. As comparações sociais, o termo técnico "jubileu" e a alternativa lexical da nota são preservados.
