revisions:
- from: Cumpram os meus estatutos e guardem as minhas decisões[a], pondo-os em prática[b]. Assim vocês viverão em segurança na terra.[c]
  to: Cumpram os meus estatutos e guardem as minhas decisões[a]; façam isso[b], e habitarão na terra em segurança.[c]
  rationale: A revisão elimina a referência incerta de “pondo-os”, conserva a repetição enfática do verbo hebraico mediante “façam isso” e traduz וִישַׁבְתֶּם por “habitarão”, que expressa melhor a residência estável na terra. Mantêm-se a distinção terminológica entre os dois termos legais e o contexto pactual, sem ampliar a promessa além do texto.
