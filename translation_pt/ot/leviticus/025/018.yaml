  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: pt
  text: Cumpram os meus estatutos e guardem as minhas decisões[a]; façam isso[b], e habitarão na terra em segurança.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os meus decretos”. O hebraico emprega dois termos legais distintos: חֻקִּים, “estatutos”, e מִשְׁפָּטִים, “decisões” ou “ordenanças”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete o verbo “fazer”: literalmente, “façam os meus estatutos, guardem as minhas decisões e façam-nos”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, na terra prometida, em condições de segurança.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: os meus estatutos
  rationale: “Estatutos” preserva o caráter legal e pactual de חֻקִּים e permite distingui-lo do termo seguinte.
- source_word: מִשְׁפָּטַי
  choice: as minhas decisões
  rationale: מִשְׁפָּטִים pode designar decisões ou determinações jurídicas. “Decisões” mantém a nuance legal sem confundi-lo com “estatutos”.
- source_word: תִּשְׁמְרוּ
  choice: guardem
  rationale: No contexto pactual, שׁמר significa observar fielmente. “Guardem” conserva essa força e é natural em português bíblico atual.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: Cumpram ... pondo-os em prática
  rationale: O hebraico emprega עשה duas vezes. A formulação portuguesa evita repetição pesada, mas preserva a ênfase na obediência efetiva; a repetição literal é registrada em nota.
- source_word: וִישַׁבְתֶּם
  choice: vocês viverão
  rationale: ישׁב aqui descreve habitação estável na terra. “Viverão” é claro e natural em português, sem perder a ideia contextual de permanência.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto, refere-se à terra prometida a Israel. “A terra” preserva a linguagem pactual tradicional.
- source_word: לָבֶטַח
  choice: em segurança
  rationale: בֶּטַח indica segurança ou condição segura. “Em segurança” é idiomático com “viver” e comunica proteção estável.
theological_decisions:
- issue: Relação entre obediência e habitação segura na terra
  choice: O versículo apresenta a segurança na terra como consequência pactual da obediência de Israel.
  alternative: Ler o texto como promessa geral e incondicional de segurança pessoal para todos os fiéis.
  rationale: A construção hebraica liga diretamente a observância dos estatutos e decisões à habitação segura na terra. A tradução mantém esse contexto sem universalizar a promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento no plural por “vocês”. A ordem foi ajustada com “Assim” para explicitar naturalmente a relação consequencial já presente na sequência hebraica. Os marcadores seguem ordem alfabética e aparecem no texto principal.
