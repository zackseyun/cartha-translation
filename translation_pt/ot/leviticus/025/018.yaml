  source_fidelity: A tradução comunica adequadamente a exortação à obediência e a consequência de segurança na terra. Contudo, “viverão” atenua a noção de habitação estabelecida de וִישַׁבְתֶּם, e “pondo-os” apresenta antecedente gramatical e semântico pouco claro, pois “decisões” é feminino e o pronome masculino tende a remeter apenas a “estatutos”.
  naturalness: O português é moderno e compreensível, mas a coordenação pode reproduzir melhor a ênfase final do hebraico sem um gerúndio de referência ambígua. “Habitarão na terra em segurança” é natural, solene sem ser arcaico e mais preciso no contexto da promessa da terra.
  terminology: “Estatutos” e “decisões” distinguem de modo defensável os dois termos jurídicos hebraicos. A repetição de fazer/cumprir deve permanecer perceptível no texto principal ou ser expressa de modo inequívoco; “façam isso” preserva a retomada abrangente de אֹתָם sem atribuir o pronome somente a um dos dois substantivos.
  issues:
  - severity: medium
    issue: O pronome em “pondo-os em prática” tem referência ambígua e concordância problemática.
    rationale: “Os” está no masculino, embora o substantivo imediatamente anterior seja “decisões”, feminino; além disso, a expressão pode ser entendida como referente apenas aos estatutos, enquanto אֹתָם retoma as prescrições mencionadas.
  - severity: low
    issue: “Viverão” é menos específico que o verbo hebraico de habitar/estabelecer-se.
    rationale: וִישַׁבְתֶּם, em paralelo com “na terra”, descreve habitação estabelecida. “Habitarão” preserva melhor esse sentido e continua claro em português moderno.
