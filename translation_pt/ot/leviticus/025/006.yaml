  text: וְ֠/הָיְתָה שַׁבַּ֨ת הָ/אָ֤רֶץ לָ/כֶם֙ לְ/אָכְלָ֔ה לְ/ךָ֖ וּ/לְ/עַבְדְּ/ךָ֣ וְ/לַ/אֲמָתֶ֑/ךָ וְ/לִ/שְׂכִֽירְ/ךָ֙ וּ/לְ/תוֹשָׁ֣בְ/ךָ֔ הַ/גָּרִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male slave, for your female slave, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: pt
  text: 'O que a terra produzir durante seu descanso sabático servirá de alimento para vocês: para você, para seu escravo, para sua escrava, para seu trabalhador contratado e para seu residente estrangeiro, que vivem com você.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: servirá
  rationale: No contexto legal, a forma verbal introduz o uso futuro estabelecido para a produção do ano sabático; “servirá” comunica isso naturalmente em português.
- source_word: שַׁבַּת הָאָרֶץ
  choice: o que a terra produzir durante seu descanso sabático
  rationale: A expressão é literalmente “o sábado da terra”, mas, ligada a “para alimento”, refere-se aqui ao que a terra produz durante seu repouso sabático. A formulação explicita o referente sem perder a ligação com o descanso da terra.
- source_word: לָכֶם לְאָכְלָה
  choice: servirá de alimento para vocês
  rationale: Expressa de modo idiomático tanto o destinatário plural quanto a finalidade alimentar indicada pelas duas construções com ל.
- source_word: לְךָ
  choice: para você
  rationale: Preserva a mudança do plural comunitário para o destinatário individual que encabeça a lista.
- source_word: עַבְדְּךָ
  choice: seu escravo
  rationale: Mantém a categoria de pessoa em condição de escravidão e a distingue do trabalhador assalariado.
- source_word: אֲמָתֶךָ
  choice: sua escrava
  rationale: Preserva a contraparte feminina expressa pelo termo hebraico.
- source_word: שְׂכִירְךָ
  choice: seu trabalhador contratado
  rationale: Indica uma pessoa que trabalha mediante remuneração, em contraste com os escravizados da casa.
- source_word: תוֹשָׁבְךָ
  choice: o residente estrangeiro
  rationale: Traduz a ideia de um não nativo que reside entre os israelitas em linguagem atual e clara.
- source_word: הַגָּרִים עִמָּךְ
  choice: que vive com você
  rationale: O particípio descreve residência contínua junto ao destinatário; “vive com você” é natural e preserva esse sentido.
theological_decisions:
- issue: Distinção entre escravizados e trabalhador remunerado na legislação israelita
  choice: Traduzir עבד e אמה como “escravo” e “escrava”, e שׂכיר como “trabalhador contratado”.
  alternative: Traduzir todas as categorias como “servos”.
  rationale: O texto diferencia categorias sociais e econômicas. Mantê-las evita suavizar a escravidão ou apagar a diferença entre trabalho escravizado e remunerado.
- issue: Sentido contextual de “sábado da terra”
  choice: Explicitar no texto a produção obtida durante o descanso sabático da terra.
  alternative: Manter literalmente “o sábado da terra”.
  rationale: Neste versículo, a expressão funciona metonimicamente para aquilo que a terra fornece no ano de descanso, como mostra a finalidade “para alimento”. A tradução conserva a noção de descanso sabático e torna claro o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural para brasileiros. A alternância entre “vocês” e “você” reproduz a passagem do destinatário coletivo para o singular no hebraico. Evitou-se “sábado da terra” isoladamente por soar opaco neste contexto, mas preservou-se “descanso sabático” para manter o vínculo institucional com o versículo anterior.
