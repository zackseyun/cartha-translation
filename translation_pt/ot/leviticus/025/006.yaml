  verdict: revise
  source_fidelity: A tradução capta adequadamente a metonímia de «sábado da terra» como a produção disponível durante o descanso sabático e preserva as distinções entre escravo, escrava e trabalhador contratado. Contudo, o particípio plural «os que vivem/residem com você» (הַגָּרִים עִמָּךְ) abrange, pela construção hebraica, tanto o trabalhador contratado quanto o residente estrangeiro, não apenas o último.
  naturalness: O texto é claro, atual e adequado ao registro legislativo. A revisão da oração relativa torna explícito em português o antecedente duplo sem sacrificar a fluência.
  terminology: «Escravo/escrava» e «trabalhador contratado» mantêm a distinção social do hebraico. «Residente estrangeiro» é uma solução contemporânea defensável para תושב neste contexto; a nota deve evitar definir o termo de modo excessivamente estreito como necessariamente não nativo.
  issues:
  - severity: medium
    issue: Escopo limitado da oração «que vive com você».
    rationale: O hebraico emprega o particípio plural הַגָּרִים, que retoma conjuntamente «seu trabalhador contratado» e «seu residente estrangeiro». No rascunho, o singular «que vive» faz a oração modificar somente «residente estrangeiro».
  - severity: low
    issue: A nota caracteriza o referente como «pessoa não nativa» de forma mais específica do que o vocábulo isolado exige.
    rationale: תושב designa fundamentalmente um residente/estabelecido. O contexto pode justificar «residente estrangeiro», mas a nota deve apresentar alternativas sem afirmar como definição lexical necessária que a pessoa seja não nativa.
