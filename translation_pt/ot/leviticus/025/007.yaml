base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: pt
  text: E, para os seus animais de criação e para os animais selvagens que estão na sua terra, toda a produção da terra será para alimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: para os seus animais domésticos
  rationale: בְּהֵמָה designa coletivamente os animais domesticados do destinatário. “Animais domésticos” é claro em português e mantém o contraste com os animais selvagens, sem restringir o sentido ao gado bovino.
- source_word: לַחַיָּה
  choice: para os animais selvagens
  rationale: חַיָּה, em contraste com בְּהֵמָה, refere-se aqui aos animais não domesticados. A expressão é concreta, natural e amplamente compreensível.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: que vivem na sua terra
  rationale: A oração relativa modifica “animais selvagens”. “Vivem” explicita naturalmente em português a presença indicada pelo hebraico, enquanto “sua terra” preserva o sentido concreto e agrícola de אֶרֶץ.
- source_word: תִּהְיֶה
  choice: servirá
  rationale: היה exprime aqui a destinação ou disponibilidade da produção. “Servirá” comunica de modo natural o resultado prescrito, preservando o tom normativo.
- source_word: כָּל תְּבוּאָתָהּ
  choice: toda a produção dela
  rationale: תְּבוּאָה é a produção ou colheita proveniente da terra, e o sufixo feminino retoma “terra”. “Dela” conserva essa referência sem substituí-la por uma interpretação diferente.
- source_word: לֶאֱכֹל
  choice: de alimento
  rationale: O infinitivo com ל indica finalidade ou uso. Na construção “servirá de alimento”, a formulação é idiomática e mantém o sentido literal de destinação para consumo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação preserva o contraste entre animais domesticados e selvagens e mantém explícita a referência da produção à terra.
