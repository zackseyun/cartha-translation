  text: כִּֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָכַ֖ר מֵ/אֲחֻזָּת֑/וֹ וּ/בָ֤א גֹֽאֲל/וֹ֙ הַ/קָּרֹ֣ב אֵלָ֔י/ו וְ/גָאַ֕ל אֵ֖ת מִמְכַּ֥ר אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: pt
  text: Se seu irmão empobrecer e vender parte de sua propriedade hereditária[a], seu resgatador, o parente mais próximo, deverá vir e resgatar o que seu irmão vendeu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão se refere à propriedade familiar recebida por herança dentro da distribuição territorial de Israel.
    reason: cultural_note
  - marker: b
    text: 'Ou: “seu resgatador, o parente mais próximo, poderá vir e resgatar o que seu irmão vendeu”. O hebraico pode apresentar aqui tanto a atuação esperada do parente quanto seu direito de resgate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּךְ
  choice: empobrecer
  rationale: Expressa de modo natural e preciso a perda de recursos econômicos indicada pelo verbo hebraico.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Preserva o termo familiar masculino do hebraico, que neste contexto legal pode abranger um membro da comunidade de Israel.
- source_word: מֵאֲחֻזָּתוֹ
  choice: parte de sua propriedade hereditária
  rationale: Neste contexto, אֲחֻזָּה designa uma propriedade familiar vinculada à herança territorial de Israel, e não uma posse genérica.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: seu resgatador, o parente mais próximo
  rationale: Torna explícita em português a função jurídica do גֹּאֵל e a prioridade do familiar elegível mais próximo.
- source_word: וְגָאַל
  choice: resgatar
  rationale: Mantém a terminologia jurídica e teológica de גאל, em vez de reduzi-la à ideia comercial de simplesmente comprar de volta.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: o que seu irmão vendeu
  rationale: É uma formulação idiomática que identifica claramente o bem alienado.
theological_decisions:
- issue: Linguagem de parentesco na legislação israelita
  choice: seu irmão
  alternative: seu parente; seu compatriota israelita
  rationale: O hebraico diz literalmente “seu irmão”. Embora o alcance jurídico possa incluir outro israelita, a tradução conserva a imagem de parentesco do texto.
- issue: Sentido jurídico de גאל
  choice: resgatador / resgatar
  alternative: parente-resgatador / comprar de volta
  rationale: “Resgatador” preserva a ressonância jurídica e teológica da raiz גאל; o vínculo familiar é explicitado pela expressão “o parente mais próximo”.
- issue: Força modal de וּבָא וְגָאַל
  choice: deverá vir e resgatar
  alternative: poderá vir e resgatar; virá e resgatará
  rationale: No contexto de lei casuística, a sequência verbal apresenta a atuação esperada do resgatador. A nota conserva a possibilidade de entendê-la como direito ou permissão, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Propriedade hereditária” comunica o contexto fundiário sem exigir vocabulário técnico; “resgatador” preserva o termo-chave e é explicado por aposição.
