revisions:
- from: E, se um dos levitas resgatar a casa, a casa vendida na cidade de sua propriedade será liberada no Jubileu[a], pois as casas das cidades dos levitas são propriedade deles entre os filhos de Israel[b].
  to: Se alguém resgatar dos levitas uma casa, a casa vendida numa de suas cidades de propriedade voltará no Jubileu[a], pois as casas das cidades dos levitas são propriedade deles entre os filhos de Israel[b].
  rationale: 'A revisão segue prioritariamente a sintaxe hebraica: a preposição מִן em relação aos levitas é mantida como “dos levitas”, em vez de convertida num sujeito partitivo. “Uma casa” antecipa de forma natural o referente retomado por “a casa vendida”, e “numa de suas cidades de propriedade” esclarece a construção compacta עיר אחזתו. As notas permanecem corretamente ancoradas em “Jubileu” e “filhos de Israel”.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:56:12Z'
review_pass:
