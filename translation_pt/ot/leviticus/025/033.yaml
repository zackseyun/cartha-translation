base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: pt
  text: Se alguém resgatar dos levitas uma casa, a casa vendida numa de suas cidades de propriedade voltará no Jubileu[a], pois as casas das cidades dos levitas são propriedade deles entre os filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sairá” ou “reverterá” no Jubileu. O hebraico diz literalmente “sairá”, isto é, a propriedade vendida sairá da posse do comprador e retornará.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”, expressão pactual tradicional que designa o povo de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: E, se um dos levitas resgatar a casa
  rationale: A construção introduz um caso jurídico condicional. מִן הַלְוִיִּם é entendido em sentido partitivo, “um dentre os levitas”; “a casa” explicita em português o objeto implícito de “resgatar”, indicado pelo contexto imediato.
- source_word: וְיָצָא
  choice: será liberada
  rationale: Literalmente, “sairá”. No regime do Jubileu, a propriedade vendida sai do domínio do comprador e retorna; “será liberada” expressa o efeito jurídico sem eliminar a imagem literal, registrada em nota.
- source_word: מִמְכַּר בַּיִת וְעִיר אֲחֻזָּתוֹ
  choice: a casa vendida na cidade de sua propriedade
  rationale: A sintaxe hebraica é compacta e admite alguma dificuldade. A formulação portuguesa entende a referência como uma casa vendida situada numa cidade pertencente à porção do levita, em continuidade com o contexto.
- source_word: בַּיֹּבֵל
  choice: no Jubileu
  rationale: Designa a instituição e o período jurídico do Jubileu; a inicial maiúscula assinala seu uso técnico.
- source_word: בָתֵּי עָרֵי הַלְוִיִּם
  choice: as casas das cidades dos levitas
  rationale: Mantém de perto a cadeia de construto hebraica, com redação natural em português.
- source_word: הִוא אֲחֻזָּתָם
  choice: são propriedade deles
  rationale: אֲחֻזָּה indica posse ou propriedade territorial, frequentemente hereditária. “Propriedade” preserva o caráter jurídico sem acrescentar uma especificação ausente.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Preserva a expressão pactual convencional e formalmente masculina do hebraico; uma nota esclarece seu valor coletivo.
theological_decisions:
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel; israelitas
  rationale: A tradução formal conserva a expressão pactual hebraica, enquanto a nota esclarece que ela designa coletivamente o povo de Israel, sem restringir a referência apenas aos homens.
- issue: Relação sintática de מִן הַלְוִיִּם
  choice: um dos levitas
  alternative: resgatar dos levitas
  rationale: 'A leitura partitiva se ajusta melhor ao caso jurídico e evita inverter a relação: trata-se de um levita que exerce o resgate da propriedade levítica.'
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém o tom jurídico do contexto e conserva “Jubileu” e “propriedade” como termos técnicos. Os marcadores foram ligados aos elementos que de fato explicam: [a] à liberação no Jubileu e [b] a “filhos de Israel”.'
