  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: pt
  text: Neste ano do Jubileu, cada um de vocês voltará à sua propriedade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à sua possessão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: Neste ano do Jubileu
  rationale: A preposição temporal בְּ, o substantivo em construção שְׁנַת e o demonstrativo הַזֹּאת formam naturalmente “neste ano do Jubileu”. “Jubileu” identifica a instituição especial regulamentada em Levítico 25.
- source_word: תָּשֻׁבוּ
  choice: voltará
  rationale: O imperfeito na segunda pessoa do plural tem força normativa neste contexto legal. Em português, o futuro do indicativo expressa adequadamente a determinação; o singular concorda com a construção distributiva “cada um de vocês”.
- source_word: אִישׁ
  choice: cada um de vocês
  rationale: אִישׁ tem sentido distributivo após o verbo no plural. A expressão portuguesa é natural, mantém a referência aos destinatários e preserva a distribuição individual sem recorrer ao menos idiomático “cada homem”.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: à sua propriedade
  rationale: אֶל marca a direção do retorno, e אֲחֻזָּה designa aqui a propriedade ou porção de terra mantida como posse familiar. “Propriedade” é clara no português atual; “possessão” permanece como alternativa lexical em nota.
theological_decisions:
- issue: Forma masculina distributiva אִישׁ
  choice: cada um de vocês
  alternative: cada homem
  rationale: O hebraico usa o masculino singular de modo distributivo, em correlação com a segunda pessoa do plural. “Cada um de vocês” conserva essa estrutura representativa e a aplicação individual, mas soa mais natural em português.
- issue: Natureza da אֲחֻזָּה no Jubileu
  choice: propriedade
  alternative: propriedade hereditária
  rationale: O contexto envolve a restituição das terras familiares, mas o versículo emprega apenas אֲחֻזָּה. A tradução evita acrescentar “hereditária” ao texto principal, preservando a concisão e não tornando explícito mais do que o termo exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o tom normativo da legislação e a construção distributiva do hebraico. O marcador [a] aparece imediatamente após o termo ao qual a alternativa lexical se refere.
