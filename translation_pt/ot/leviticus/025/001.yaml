  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/הַ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/001.yaml
  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés no monte Sinai[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; também transliterado como “Jeová”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O waw consecutivo introduz o acontecimento seguinte na narrativa. “Falou” traduz דבר e mantém sua distinção contextual de אמר, que introduz o conteúdo da fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל marca o destinatário da fala; “a Moisés” é uma formulação natural e precisa em português.
- source_word: בְּהַר סִינַי
  choice: no monte Sinai
  rationale: A preposição בְּ tem sentido locativo. “No monte Sinai” é a forma idiomática corrente em português e não força uma localização mais específica do que o hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz diretamente o conteúdo da fala no versículo seguinte. Em português atual, os dois-pontos expressam essa função com mais naturalidade do que o literal “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal e corresponde à reconstrução acadêmica mais amplamente aceita; a nota registra a forma alternativa tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o encadeamento narrativo hebraico; os dois-pontos introduzem naturalmente a fala que começa no versículo seguinte.
