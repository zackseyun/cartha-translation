  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: pt
  text: É um Jubileu[a]; o quinquagésimo ano será para vocês.[b] Não semeiem, não ceifem o que nela nascer espontaneamente[c], nem colham as uvas de suas videiras não podadas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode designar o chifre de carneiro; aqui, refere-se ao ano do Jubileu.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: “O quinquagésimo ano será um Jubileu para vocês”.'
    reason: previous_rendering
  - marker: c
    text: 'Ou: “o que crescer por si mesmo”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “as uvas não tratadas”; o hebraico se refere à produção das videiras deixadas sem poda e sem cultivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹבֵל
  choice: Jubileu
  rationale: Em Levítico 25, o termo designa o ano especial de libertação e restauração, não o chifre de carneiro usado como instrumento. A inicial maiúscula o apresenta como nome da instituição.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: o quinquagésimo ano
  rationale: Expressão natural em português para a construção hebraica que identifica esse Jubileu como o ano de número cinquenta.
- source_word: תִּהְיֶה לָכֶם
  choice: será para vocês
  rationale: Conserva o sentido relacional do dativo hebraico sem acrescentar uma explicação não expressa no texto.
- source_word: לֹא תִזְרָעוּ
  choice: Não semeiem
  rationale: O imperativo negativo comunica de modo natural, atual e inequívoco a proibição legal expressa pela forma verbal hebraica.
- source_word: לֹא תִקְצְרוּ
  choice: não ceifem
  rationale: Mantém a referência à colheita de produtos do campo e distingue este verbo do verbo específico da colheita de uvas na oração seguinte.
- source_word: סְפִיחֶיהָ
  choice: o que nela nascer espontaneamente
  rationale: Refere-se à produção que brota por si mesma, sem nova semeadura. A formulação é clara para leitores comuns e preserva a ideia de crescimento espontâneo.
- source_word: לֹא תִבְצְרוּ
  choice: nem colham as uvas
  rationale: O verbo hebraico se refere especificamente à vindima. A explicitação de “as uvas” produz português natural e evita o termo menos corrente “vindimar”.
- source_word: נְזִרֶיהָ
  choice: suas videiras não podadas
  rationale: No contexto agrícola, a palavra descreve o crescimento das videiras deixadas sem poda ou trato. A tradução preserva esse sentido contextual, enquanto a nota registra a formulação alternativa centrada nas uvas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para a segunda pessoa do plural. As proibições foram formuladas com imperativos negativos atuais, evitando o futuro arcaizante em “-reis”. “Ceifar” e “colher as uvas” mantêm a distinção entre a colheita do campo e a vindima.
