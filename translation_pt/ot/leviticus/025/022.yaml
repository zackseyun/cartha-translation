source:
  edition: WLC
  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: pt
  text: No oitavo ano, vocês semearão e comerão da produção antiga até o nono ano; até que chegue a produção desse ano, comerão da antiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, da produção antiga. O hebraico diz apenas “antiga” na segunda ocorrência, deixando “produção” subentendido pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: vocês semearão
  rationale: O perfeito qal com conjunção assume aqui valor futuro no contexto das instruções sobre o ano sabático. A forma com “vocês” é clara e amplamente compreensível em português moderno.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: no oitavo ano
  rationale: Expressão ordinal direta; a preposição “em” se contrai naturalmente com o artigo em português.
- source_word: וַאֲכַלְתֶּם
  choice: e comerão
  rationale: Mantém a ação coordenada e o mesmo valor futuro da oração anterior.
- source_word: מִן הַתְּבוּאָה
  choice: da produção
  rationale: תְּבוּאָה designa o produto ou rendimento agrícola. “Produção” conserva a amplitude do termo e se ajusta ao alimento armazenado.
- source_word: יָשָׁן
  choice: antiga
  rationale: O adjetivo significa “velho/antigo” e se refere à produção de uma colheita anterior. “Antiga” soa mais natural do que “velha” para produção agrícola.
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: até o nono ano
  rationale: Reprodução direta do limite temporal indicado no hebraico.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: até que chegue a produção desse ano
  rationale: בּוֹא significa “vir/chegar”, e o sufixo feminino em תְּבוּאָתָהּ retoma mais naturalmente o nono ano mencionado. “Desse ano” explicita em português a referência pronominal sem alterar o sentido.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: comerão da antiga
  rationale: Preserva a repetição enfática de יָשָׁן e a elipse do substantivo, recuperado naturalmente de “produção” na oração anterior.
theological_decisions: []
