  text: לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָ֑רֶךְ וְ/יָרֵ֖אתָ מֵ/אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/043.yaml
  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: pt
  text: Não exerça domínio sobre ele com dureza[a]; tema o seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com rigor”, “com severidade”. O termo hebraico indica tratamento severo e opressivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה
  choice: domine
  rationale: O verbo רדה expressa exercer domínio ou autoridade sobre alguém. Neste contexto legal, “domine” preserva a relação de poder e combina naturalmente com a proibição de tratamento cruel.
- source_word: בּוֹ
  choice: o
  rationale: O pronome masculino singular retoma o israelita em situação de servidão; em português, funciona naturalmente como objeto direto de “domine”.
- source_word: בְּפָרֶךְ
  choice: com crueldade
  rationale: פָרֶךְ denota rigor severo, opressivo ou esmagador. “Com crueldade” é claro e idiomático, enquanto a nota registra alternativas que preservam a forma mais literal.
- source_word: וְיָרֵאתָ
  choice: tema
  rationale: A conjunção liga a proibição ao mandamento que fornece sua motivação ética. O ponto e vírgula comunica essa relação sem precisar transformar explicitamente וְ em uma conjunção adversativa.
- source_word: מֵאֱלֹהֶיךָ
  choice: o seu Deus
  rationale: Com ירא, a preposição מִן introduz idiomaticamente o objeto do temor. Em português, a formulação natural é “temer o seu Deus”.
theological_decisions:
- issue: Função ética da oração final
  choice: A reverência a Deus é apresentada como fundamento que limita o exercício de poder sobre o israelita em servidão.
  alternative: 'Traduzir a ligação de modo estritamente coordenado: “e tema o seu Deus”.'
  rationale: O ponto e vírgula conserva a coordenação hebraica e, ao mesmo tempo, deixa perceptível que o temor de Deus regula o tratamento da pessoa vulnerável, sem inserir uma explicação doutrinária no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo “tema” expressa naturalmente o valor injuntivo do hebraico. A opção por “domine” mantém a linguagem de autoridade do verbo fonte; a nota esclarece a intensidade de בְּפָרֶךְ.
