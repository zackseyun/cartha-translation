  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: pt
  text: Guardem os meus estatutos e cumpram-nos. Eu sou Yahweh, que os santifica.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que os torna santos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Guardem
  rationale: שׁמר, em contexto legal e pactual, significa guardar ou observar. O imperativo em português comunica naturalmente a força normativa da forma hebraica.
- source_word: חֻקֹּתַי
  choice: os meus estatutos
  rationale: חֻקָּה designa prescrições estabelecidas; “estatutos” preserva a nuance jurídica e distingue o termo de outras palavras hebraicas para lei ou mandamento.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: e cumpram-nos
  rationale: עשה com prescrições como objeto indica pô-las em prática. “Cumpram-nos” é mais natural em português que “façam-nos” e conserva a exigência de execução concreta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְקַדִּשְׁכֶם
  choice: que os santifica
  rationale: O particípio piel de קדשׁ apresenta a ação característica ou contínua de Yahweh. “Santifica” mantém o vocabulário bíblico de santidade e o sentido causativo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem convertê-lo em título.
- issue: Sentido de מְקַדִּשְׁכֶם no contexto da aliança
  choice: que os santifica
  alternative: que os torna santos; que os consagra
  rationale: “Santifica” conserva a ligação lexical com a santidade e não restringe a ação a uma consagração meramente ritual nem a reduz a um sentido apenas moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” está implícito nas formas verbais e no pronome “os”. A conjunção inicial hebraica não foi vertida separadamente, pois o versículo funciona naturalmente como exortação direta em português.
