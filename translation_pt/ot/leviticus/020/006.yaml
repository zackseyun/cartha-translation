  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: pt
  text: Quanto à pessoa que recorrer aos médiuns[a] e aos adivinhos, para se prostituir seguindo-os[b], voltarei o meu rosto contra essa pessoa e a cortarei do meio do seu povo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode referir-se a pessoas que consultam os mortos ou espíritos, ou que servem de intermediárias nessas consultas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para se prostituir seguindo-os”; trata-se de uma metáfora de infidelidade por meio de práticas espirituais proibidas.
    reason: lexical_alternative
  - marker: c
    text: “Cortarei” traduz uma fórmula jurídica hebraica. O versículo não especifica aqui se o juízo ocorre por morte, exclusão da comunidade ou outra ação divina.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: a pessoa
  rationale: No contexto jurídico, נֶפֶשׁ designa o indivíduo inteiro, não especificamente uma alma imaterial.
- source_word: תִּפְנֶה
  choice: recorrer
  rationale: פנה significa literalmente voltar-se, mas aqui indica buscar a ajuda ou consulta de praticantes ocultistas; “recorrer” comunica esse sentido de modo natural.
- source_word: הָאֹבֹת
  choice: os médiuns
  rationale: אוֹב, neste contexto, refere-se a quem atua como intermediário na consulta aos mortos ou espíritos. “Médiuns” é claro no português atual, embora o referente exato do termo hebraico seja discutido.
- source_word: הַיִּדְּעֹנִים
  choice: os adivinhos
  rationale: יִדְּעֹנִי designa praticantes de conhecimento oculto e aparece frequentemente ao lado de אוֹב. “Adivinhos” mantém a distinção entre os dois termos sem associar o texto diretamente a uma religião moderna específica.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: prostituindo-se ao segui-los
  rationale: A formulação conserva tanto a metáfora explícita de זנה, que expressa infidelidade, quanto a imagem de seguir tais praticantes presente em אַחֲרֵיהֶם.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: voltarei o meu rosto contra essa pessoa
  rationale: Preserva a imagem hebraica do rosto divino dirigido contra alguém em oposição e juízo, em formulação compreensível em português.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: e a eliminarei
  rationale: כרת é uma fórmula jurídica de exclusão ou juízo severo. “Eliminarei” comunica sua força, enquanto a nota evita determinar um modo específico de punição que o versículo não explicita.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: do meio do seu povo
  rationale: Reproduz naturalmente a fórmula comunitária hebraica, indicando retirada da pessoa do âmbito de seu povo.
theological_decisions:
- issue: Manutenção da metáfora de prostituição para infidelidade religiosa
  choice: prostituindo-se ao segui-los
  alternative: sendo infiel ao segui-los
  rationale: O hebraico emprega explicitamente זנה. Preservar a metáfora mantém a gravidade relacional e pactual da conduta, sem reduzi-la a uma desobediência genérica.
- issue: Sentido da sanção expressa por כרת
  choice: e a eliminarei do meio do seu povo
  alternative: e a excluirei do meio do seu povo
  rationale: A expressão indica juízo severo, mas o mecanismo preciso não é declarado aqui. A tradução mantém a força da fórmula, e a nota registra sua abertura interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla compreensão internacional. Evitou-se “espíritas” por sua associação contemporânea com uma tradição religiosa específica. A repetição de “pessoa” preserva a referência sem impor gênero gramatical ao indivíduo.
