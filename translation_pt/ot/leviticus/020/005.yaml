base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: pt
  text: Então eu mesmo porei o meu rosto contra aquele homem e contra sua família e eliminarei[a], do meio do povo deles, tanto ele como todos os que se prostituem seguindo-o, prostituindo-se ao seguir Moloque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eliminar do meio do povo” é uma expressão de juízo da aliança. Aqui o texto não especifica se isso acontece por morte, expulsão ou outra forma de remoção divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: então eu mesmo voltarei o meu rosto contra
  rationale: Preserva a ênfase de אֲנִי e traduz de modo natural o idiomatismo hebraico que expressa oposição e juízo divinos.
- source_word: בָּאִישׁ הַהוּא
  choice: contra aquele homem
  rationale: Mantém o referente singular masculino explícito no hebraico.
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: e contra a sua família
  rationale: מִשְׁפָּחָה pode indicar família ou grupo de parentesco; “família” é claro e suficientemente abrangente em português.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: eliminarei ... ele
  rationale: O Hifil de כרת é uma fórmula de juízo da aliança que indica remoção do meio da comunidade; “eliminarei do meio” preserva essa ideia sem determinar o mecanismo exato.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו
  choice: todos os que se prostituem seguindo-o
  rationale: Mantém a metáfora sexual de זנה para a apostasia idólatra e entende אַחֲרָיו como seguir o exemplo ou a iniciativa daquele homem.
- source_word: לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: prostituindo-se para seguir Moloque
  rationale: Reproduz a repetição retórica da raiz זנה e comunica com clareza a devoção ilícita expressa por “seguir” Moloque.
- source_word: הַמֹּלֶךְ
  choice: Moloque
  rationale: Usa a forma tradicional e amplamente reconhecida em português para o nome da divindade mencionada neste contexto.
- source_word: מִקֶּרֶב עַמָּם
  choice: do meio do seu povo
  rationale: Traduz o idiomatismo de remoção da comunidade. O possessivo plural hebraico se refere ao conjunto formado pelo homem e seus seguidores; em português, “seu povo” permite essa referência coletiva com naturalidade.
theological_decisions:
- issue: Metáfora de infidelidade sexual aplicada à idolatria
  choice: se prostituem ... prostituindo-se
  alternative: são infiéis; praticam idolatria
  rationale: A tradução conserva a metáfora deliberadamente forte do hebraico e sua representação da apostasia como infidelidade, sem a reduzir a uma explicação abstrata.
- issue: Sentido da fórmula de juízo וְהִכְרַתִּי
  choice: eliminarei do meio do seu povo
  alternative: matarei; expulsarei; destruirei
  rationale: O versículo anuncia remoção por juízo divino, mas não especifica se ela ocorre por morte, expulsão ou outra forma. A redação escolhida preserva essa indeterminação.
- issue: Alcance do juízo sobre a família
  choice: contra aquele homem e contra a sua família
  alternative: contra aquele homem e o seu clã
  rationale: A família é explicitamente incluída no objeto da oposição divina. A tradução não explica por que nem presume culpa ou punição idêntica para cada integrante.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. Conserva-se a metáfora forte da prostituição espiritual e evita-se definir além do texto a forma do juízo. O marcador [a] aparece no texto principal.
