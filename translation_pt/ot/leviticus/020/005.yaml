    rationale: לִזְנוֹת introduz a ação de prostituir-se em conexão com seguir Moloque; “para seguir” pode indicar que a prostituição visa alcançar esse seguimento. “Prostituindo-se ao seguir Moloque” conserva melhor a relação e a repetição retórica.
  - severity: low
    issue: O marcador da nota sobre “eliminar do meio do povo” está no final do versículo.
    rationale: A nota explica especificamente a fórmula de remoção, não a cláusula final sobre Moloque. O marcador deve seguir “eliminarei” para ter ancoragem inequívoca.
