id: LEV.20.15
reference: Leviticus 20:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: pt
  text: Se um homem tiver relações sexuais com um animal, certamente será morto; e vocês matarão o animal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “der o seu deitar com um animal”, expressão idiomática hebraica para ter relações sexuais.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo é masculino singular e se refere especificamente ao infrator do sexo masculino; o versículo seguinte trata separadamente do caso de uma mulher.
- source_word: אֲשֶׁר
  choice: se
  rationale: Embora seja formalmente um pronome relativo, na formulação casuística da lei introduz uma condição, expressa naturalmente em português por “se”.
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: tiver relações sexuais
  rationale: A expressão hebraica é literalmente “der o seu deitar”; a tradução escolhida comunica com clareza e dignidade o sentido sexual do idioma.
- source_word: בִּבְהֵמָה
  choice: com um animal
  rationale: בְּהֵמָה designa um animal; “animal” é claro e corrente em português moderno.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a sentença de morte; “certamente” preserva essa ênfase sem tornar a frase artificial.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: e vocês matarão o animal
  rationale: O plural “vocês” preserva o destinatário coletivo do verbo hebraico, e “matarão” reproduz de maneira direta a força legal da forma verbal.
theological_decisions:
- issue: Especificidade de gênero do infrator
  choice: “um homem”, com referência específica a um infrator masculino
  alternative: “uma pessoa”, em sentido genérico
  rationale: O hebraico usa um substantivo masculino, e o versículo seguinte apresenta separadamente o caso feminino. Uma forma genérica apagaria a estrutura e a especificidade jurídica do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação mantém a especificidade masculina, explicita com sobriedade o idioma sexual e conserva a ênfase da pena e o plural dirigido à comunidade ou às autoridades responsáveis.
