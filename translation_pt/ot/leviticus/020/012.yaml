  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: pt
  text: Se um homem se deitar com a sua nora, ambos certamente serão mortos. Cometeram uma perversidade[a]; o sangue deles recai sobre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma desordem”, “um ultraje” ou “um ato vergonhoso”. O termo hebraico תֶּבֶל designa, neste contexto jurídico, um ato moralmente desordenado.
    reason: lexical_alternative
  - marker: b
    text: Ou “a culpa pelo sangue deles recai sobre eles”. A expressão idiomática hebraica atribui a eles mesmos a responsabilidade por sua morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Se um homem
  rationale: A construção introduz um caso jurídico condicional. “Se um homem” expressa naturalmente essa função em português, mantendo o sujeito masculino explícito do hebraico.
- source_word: יִשְׁכַּב אֶת
  choice: se deitar com
  rationale: Neste contexto, שׁכב com אֶת é um idioma para relações sexuais. “Deitar-se com” preserva a imagem do original e é compreensível em português atual.
- source_word: כַּלָּתוֹ
  choice: a sua nora
  rationale: כַּלָּה designa aqui especificamente a esposa do filho; “nora” é o termo de parentesco preciso.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: ambos certamente serão mortos
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a fórmula de pena capital. “Certamente” conserva a ênfase, e “ambos” explicita que a sentença abrange os dois participantes.
- source_word: תֶּבֶל עָשׂוּ
  choice: Cometeram uma perversidade
  rationale: תֶּבֶל caracteriza o ato como moralmente desordenado e vergonhoso. “Cometeram uma perversidade” transmite a força condenatória do termo sem ampliar indevidamente o sentido.
- source_word: דְּמֵיהֶם בָּם
  choice: o sangue deles recai sobre eles
  rationale: A tradução conserva a metáfora jurídica hebraica e comunica que os próprios transgressores carregam a responsabilidade pela pena.
theological_decisions:
- issue: Sujeito masculino da lei
  choice: “um homem”
  alternative: “uma pessoa” ou “alguém”
  rationale: אִישׁ é masculino singular, e o vínculo com a nora identifica especificamente um homem. A tradução mantém essa particularidade do texto.
- issue: Caracterização moral de תֶּבֶל
  choice: “uma perversidade”
  alternative: “uma desordem”, “um ultraje” ou “um ato vergonhoso”
  rationale: O próprio texto qualifica moralmente o ato. “Perversidade” preserva essa avaliação forte sem introduzir uma explicação doutrinária externa.
- issue: Responsabilidade expressa pelo idioma do sangue
  choice: Preservar “o sangue deles recai sobre eles”
  alternative: Explicitar “a culpa pela morte deles é deles mesmos”
  rationale: A formulação principal mantém a imagem e a tensão jurídica do hebraico; a nota esclarece o sentido sem substituir a expressão original por uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o caráter jurídico do versículo, a ênfase da sentença e os idiomas hebraicos, esclarecendo em notas as alternativas lexicais e o sentido da expressão final.
