source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: pt
  text: Vocês serão santos para mim, porque eu, Yahweh, sou santo e os separei dos povos[a] para serem meus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das nações”. O hebraico עַמִּים pode significar “povos” ou, em alguns contextos, “nações”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: Vocês serão
  rationale: O perfeito qal com conjunção, neste contexto legal e exortativo, tem força prospectiva ou resultativa. “Vocês serão” preserva essa nuance pactual sem transformar explicitamente a forma em imperativo.
- source_word: לִי קְדֹשִׁים
  choice: santos para mim
  rationale: Mantém tanto a ideia de santidade quanto a relação com Yahweh expressa por לִי; “santos” não reduz o termo à pureza moral nem apenas à separação ritual.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da santidade exigida de Israel e soa claro no português atual.
- source_word: קָדוֹשׁ אֲנִי
  choice: eu ... sou santo
  rationale: Preserva a ligação lexical entre a santidade de Yahweh e a santidade do povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: e os separei
  rationale: בדל denota separar ou distinguir. A forma verbal descreve uma ação divina concluída; “separei” preserva a distinção em relação a קדש, traduzido como “santo”.
- source_word: מִן הָעַמִּים
  choice: dos povos
  rationale: עַמִּים designa coletividades humanas e é mais amplo que o sentido estritamente geopolítico de “nações”; a alternativa é registrada em nota.
- source_word: לִהְיוֹת לִי
  choice: para serem meus
  rationale: Expressa de modo natural a finalidade ou o resultado da separação e conserva a linguagem de pertencimento pactual.
theological_decisions:
- issue: A santidade pactual de Israel pode ser reduzida à pureza moral ou à mera distinção ritual.
  choice: Empregar “santos” para קדש e “separei” para בדל.
  alternative: Traduzir ambos os termos com linguagem de “separação” ou moralizar קדש como “puros”.
  rationale: O próprio versículo relaciona a santidade do povo à santidade de Yahweh e usa outro verbo para a separação dos povos. A tradução mantém essa distinção lexical e a tensão entre as dimensões moral, cultual e pactual.
- issue: Representação do nome divino יְהוָה.
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico traz o tetragrama como nome próprio; “Yahweh” o representa diretamente sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para o plural. A construção “para serem meus” comunica pertencimento de forma natural. O marcador da nota foi colocado junto a “povos”, termo ao qual a alternativa lexical se refere.
