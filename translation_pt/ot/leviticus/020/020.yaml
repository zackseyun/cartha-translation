source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: pt
  text: Se um homem se deitar com a mulher de seu tio, descobriu a nudez de seu tio.[a] Ambos levarão sobre si o seu pecado;[b] morrerão sem filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “descobriu a nudez de seu tio” — expressão de Levítico para a violação de um vínculo sexual e familiar proibido ao se deitar com a esposa do tio.
    reason: cultural_note
  - marker: b
    text: 'Ou: “levarão sobre si a sua culpa”. A expressão hebraica pode se referir tanto ao pecado quanto à culpa ou responsabilidade decorrente dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Se um homem
  rationale: A formulação introduz mais um caso legal. “Se um homem” exprime naturalmente a força condicional e preserva o referente masculino singular.
- source_word: יִשְׁכַּב אֶת
  choice: se deitar com
  rationale: Neste contexto, שׁכב é um eufemismo convencional para relações sexuais. A expressão portuguesa preserva o idioma bíblico e continua compreensível.
- source_word: דֹּדָתוֹ
  choice: a mulher de seu tio
  rationale: O termo designa especificamente a esposa do tio. A explicitação evita a possível ambiguidade de “tia”, que também poderia indicar uma irmã do pai ou da mãe, e se harmoniza com a cláusula seguinte.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: terá descoberto a nudez de seu tio
  rationale: Mantém a expressão levítica que apresenta a relação sexual com a esposa do tio como violação do vínculo conjugal e de parentesco do tio.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: Ambos levarão sobre si o seu pecado
  rationale: O verbo e o sufixo estão no plural e abrangem as duas pessoas. “Levar sobre si” reproduz o idioma de assumir ou suportar o pecado e sua responsabilidade, sem eliminar sua amplitude semântica.
- source_word: עֲרִירִים יָמֻתוּ
  choice: morrerão sem filhos
  rationale: A formulação concisa conserva os dois elementos do hebraico sem especificar se não terão filhos ou se ficarão sem descendência sobrevivente.
theological_decisions:
- issue: Sentido da sanção עֲרִירִים יָמֻתוּ
  choice: morrerão sem filhos
  alternative: morrerão sem descendência sobrevivente
  rationale: O hebraico declara o estado ou resultado, mas não explica o mecanismo nem define com precisão se a ausência de filhos é absoluta ou se diz respeito a descendência sobrevivente. A tradução mantém essa concisão.
- issue: Amplitude de חֶטְאָם יִשָּׂאוּ
  choice: levarão sobre si o seu pecado
  alternative: levarão sobre si a sua culpa
  rationale: חטא pode indicar o pecado cometido e, no idioma com נשׂא, a culpa ou responsabilidade ligada a ele. O texto principal conserva “pecado”, e a nota registra a alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Mulher de seu tio” foi preferido a “tia” por sua maior precisão relacional. O idioma levítico de “descobrir a nudez” foi preservado e esclarecido em nota.
