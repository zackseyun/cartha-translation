base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: pt
  text: Se uma mulher se aproximar de qualquer animal para ter relações sexuais com ele[a], você deverá matar a mulher e o animal. Os dois certamente serão mortos; o sangue deles está sobre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para montá-lo”. O verbo hebraico se refere especificamente à relação sexual e, literalmente, envolve o ato de montar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a culpa pelo sangue deles recai sobre eles”. A expressão indica que eles próprios são responsáveis pela morte que lhes é imposta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: se aproximar
  rationale: Preserva o sentido concreto de קרב, “aproximar-se”, enquanto a finalidade sexual é expressa pela construção seguinte.
- source_word: כָּל בְּהֵמָה
  choice: qualquer animal
  rationale: בְּהֵמָה designa de modo amplo um animal ou besta; “qualquer animal” comunica com clareza o alcance genérico de כָּל sem tom arcaico.
- source_word: לְרִבְעָה אֹתָהּ
  choice: para ter relações sexuais com ele
  rationale: A expressão com רבע refere-se especificamente ao ato sexual com um animal, associado literalmente ao ato de montar. A formulação escolhida é explícita, natural e não acrescenta detalhes além do necessário.
- source_word: וְהָרַגְתָּ
  choice: você deverá matar
  rationale: Mantém a segunda pessoa do singular do hebraico e expressa claramente a força diretiva própria desta legislação, em português atual.
- source_word: מוֹת יוּמָתוּ
  choice: certamente serão mortos
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a fórmula da pena de morte; “certamente” conserva essa ênfase.
- source_word: דְּמֵיהֶם בָּם
  choice: o sangue deles está sobre eles
  rationale: Preserva a imagem jurídica e moral do idioma hebraico, deixando a nota explicar que eles próprios carregam a responsabilidade pela morte.
theological_decisions:
- issue: Formulação de uma lei penal severa referente à relação sexual com animal
  choice: Traduzir diretamente tanto o ato quanto a sanção, sem atenuação e sem comentário moral adicional.
  alternative: Empregar um eufemismo como “deitar-se com” ou explicitar interpretativamente a culpa moral.
  rationale: O texto hebraico apresenta uma norma jurídica e sua pena. A tradução deve conservar sua clareza, gravidade e tensão próprias, sem suavizar a linguagem nem importar uma explicação doutrinária externa.
- issue: Responsabilidade expressa pela fórmula do sangue
  choice: Conservar o idioma “o sangue deles está sobre eles” e explicá-lo em nota.
  alternative: Substituí-lo no texto por “eles são responsáveis pela própria morte”.
  rationale: A forma figurada é significativa no discurso jurídico bíblico e pode ser mantida em português; a nota assegura a compreensão sem eliminar a imagem original.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica direta. “Você deverá” preserva a segunda pessoa do singular do hebraico sem recorrer ao tom arcaico de “tu”. A expressão idiomática sobre o sangue foi mantida no corpo do texto e esclarecida em nota.
