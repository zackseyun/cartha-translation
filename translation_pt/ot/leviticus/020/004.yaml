  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: pt
  text: Mas, se o povo da terra deliberadamente fechar os olhos para aquele homem[a], quando ele der algum de seus filhos[b] a Moloque[c], para não o matar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ignorarem completamente aquele homem”. A expressão hebraica diz literalmente “esconderem os olhos daquele homem”.'
    reason: lexical_alternative
  - marker: b
    text: “Filhos” traduz literalmente “semente”; aqui, a palavra se refere aos filhos do homem, embora também possa designar descendência.
    reason: lexical_alternative
  - marker: c
    text: Moloque pode designar uma divindade ou um tipo de rito de sacrifício de crianças; alternativamente, alguns entendem a expressão como “ao rei”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: deliberadamente fechar os olhos
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. Em conjunto com “os olhos”, a expressão idiomática indica ignorar intencionalmente; a tradução preserva tanto a imagem hebraica quanto sua força enfática.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Neste contexto legal, a expressão designa a população da terra ou da comunidade, sem indicar necessariamente uma classe socioeconômica específica.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: os olhos para aquele homem
  rationale: O hebraico diz literalmente “os olhos daquele homem/para longe daquele homem”, mas a expressão significa recusar-se a notar o homem ou a agir contra ele. “Fechar os olhos para” é a formulação idiomática natural em português.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: quando ele der algum dos seus descendentes
  rationale: 'A preposição מִן tem valor partitivo: trata-se de alguém dentre sua descendência, não necessariamente de toda ela. “Descendentes” comunica o sentido contextual de זֶרַע sem perder sua abrangência.'
- source_word: לַמֹּלֶךְ
  choice: a Moloque
  rationale: A transliteração tradicional “Moloque” preserva o nome ou designação do destinatário do ato cultual sem incorporar ao texto principal uma explicação interpretativa.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: para não o matar
  rationale: 'A construção expressa a finalidade ou o resultado de ignorarem o transgressor: deixam de executar a pena prescrita. A formulação é direta, natural e adequada ao contexto judicial.'
theological_decisions:
- issue: Identificação do referente de לַמֹּלֶךְ
  choice: Moloque
  alternative: ao rei; ou uma designação de um rito sacrificial
  rationale: Embora as consoantes possam, em tese, receber a leitura “o rei”, o contexto de Levítico 18:21 e 20:2–5 favorece o nome ou a designação do destinatário cultual proibido. A transliteração mantém aberta a questão de ser uma divindade ou uma designação ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva a imagem hebraica de “fechar os olhos”, enquanto “deliberadamente” representa a intensificação do infinitivo absoluto. A vírgula final mantém a continuidade sintática com o versículo seguinte.
