id: LEV.20.10
reference: Leviticus 20:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: pt
  text: Se um homem cometer adultério com a mulher de outro homem — se cometer adultério com a mulher do seu próximo —, o adúltero e a adúltera certamente serão mortos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “com a mulher de um homem... com a mulher do seu próximo”. A repetição intensifica e esclarece a infração em estilo jurídico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Se um homem
  rationale: A conjunção seguida do substantivo e da partícula relativa introduz um caso legal. Em português, a formulação condicional comunica com naturalidade essa função, preservando o masculino singular do hebraico.
- source_word: יִנְאַף
  choice: cometer adultério
  rationale: O verbo נאף designa especificamente o adultério, e não a imoralidade sexual em sentido amplo. Esta é a expressão corrente, clara e precisa em português.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: com a mulher de outro homem
  rationale: 'A expressão significa literalmente “com a mulher de um homem”. O uso de “outro” torna explícita em português a relação pretendida: ela é casada com um homem diferente do transgressor.'
- source_word: אֲשֶׁר יִנְאַף אֶת אֵשֶׁת רֵעֵהוּ
  choice: se cometer adultério com a mulher do seu próximo
  rationale: A segunda formulação retoma e esclarece a infração. A repetição foi mantida para preservar a ênfase e a precisão do estilo jurídico hebraico.
- source_word: רֵעֵהוּ
  choice: seu próximo
  rationale: רֵעַ refere-se aqui a outro membro da comunidade, não apenas a alguém que mora nas proximidades. “Próximo” é uma equivalência tradicional, ampla e adequada ao contexto legal.
- source_word: מוֹת יוּמַת
  choice: certamente serão mortos
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a sentença de morte. “Certamente” preserva essa ênfase sem acrescentar um método de execução. O plural em português concorda naturalmente com os dois culpados mencionados em seguida.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: o adúltero e a adúltera
  rationale: Os particípios substantivados masculino e feminino identificam explicitamente os dois culpados. Os termos simétricos preservam a formulação equilibrada do hebraico.
theological_decisions:
- issue: Linguagem jurídica marcada por gênero
  choice: Foram mantidos “um homem” e os termos explícitos “o adúltero e a adúltera”.
  alternative: “Se alguém cometer adultério... ambos serão mortos.”
  rationale: O hebraico distingue expressamente o homem e a mulher tanto na descrição do caso como na pena. A tradução conserva essa forma em vez de neutralizá-la.
- issue: Fórmula da pena de morte
  choice: “certamente serão mortos”
  alternative: “serão executados” ou “deverão ser mortos”
  rationale: O hebraico declara enfaticamente a morte dos culpados, mas não especifica neste versículo o método nem descreve uma etapa judicial intermediária. A tradução preserva tanto a ênfase quanto os limites do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição deliberada do hebraico foi preservada; o travessão sinaliza a retomada explicativa sem eliminar sua força jurídica.
