base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: pt
  text: Portanto, guardem todos os meus estatutos e todos os meus juízos e cumpram-nos[b], para que a terra à qual eu os estou levando, para nela habitarem, não os vomite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os lance fora”. O verbo hebraico significa literalmente “vomitar”, uma metáfora vívida para a terra expulsar habitantes contaminados.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “meus decretos e minhas ordenanças”. O hebraico emprega dois termos jurídicos distintos: חֻקּוֹת e מִשְׁפָּטִים.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Portanto, guardem
  rationale: שׁמר, em contexto jurídico e pactual, significa guardar ou observar. O imperativo português comunica naturalmente a força injuntiva da forma hebraica no contexto; “Portanto” liga a ordem às advertências anteriores.
- source_word: חֻקֹּתַי
  choice: meus estatutos
  rationale: חֻקָּה designa prescrições estabelecidas. “Estatutos” conserva o registro jurídico e permite distingui-lo do termo seguinte.
- source_word: מִשְׁפָּטַי
  choice: meus juízos
  rationale: מִשְׁפָּט pode indicar juízo, decisão judicial ou ordenança. “Juízos” preserva a distinção lexical em relação a חֻקּוֹת e mantém o caráter jurídico-pactual.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: e cumpram-nos
  rationale: עשה com mandamentos como objeto significa praticá-los ou executá-los. “Cumpram-nos” é natural em português jurídico-religioso e evita o pouco idiomático “façam-nos”.
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: não os vomite
  rationale: קיא significa literalmente vomitar. A tradução mantém sem suavização a metáfora vívida da terra expulsando seus habitantes.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ refere-se aqui à terra para a qual Israel está sendo levado, não ao planeta em geral.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: à qual eu os estou levando
  rationale: A construção identifica a terra como destino, e o particípio מֵבִיא apresenta a ação divina em andamento. A expressão é clara e corrente em português.
- source_word: לָשֶׁבֶת בָּהּ
  choice: para nela habitarem
  rationale: ישׁב pode significar sentar-se, permanecer, habitar ou viver. “Habitar” oferece um registro digno sem ser obscuro, e a construção com “para” expressa a finalidade.
theological_decisions:
- issue: Preservação da metáfora da expulsão pela terra como advertência pactual
  choice: A terra é personificada como capaz de vomitar seus habitantes.
  alternative: A terra os rejeite ou os expulse.
  rationale: O hebraico emprega deliberadamente uma personificação forte. Preservá-la mantém a gravidade da contaminação e da expulsão sem reduzir a imagem a uma paráfrase.
- issue: Distinção entre חֻקּוֹת e מִשְׁפָּטִים
  choice: “estatutos” e “juízos”
  alternative: “decretos” e “ordenanças” ou “estatutos” e “normas”
  rationale: O texto-fonte usa dois termos jurídicos distintos. A tradução conserva essa diferença sem determinar com precisão excessiva categorias cuja relação permanece ampla.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural dirigidas ao povo. “Cumpram-nos” soa mais natural do que o decalque “façam-nos”; “vomite” preserva a força concreta do hebraico. Os marcadores aparecem junto às expressões que explicam.
