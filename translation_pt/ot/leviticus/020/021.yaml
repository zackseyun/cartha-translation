  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: pt
  text: Se um homem tomar a mulher de seu irmão, isso é impureza[a]; ele descobriu a nudez de seu irmão. Os dois ficarão sem filhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “isso é uma contaminação”. O termo hebraico pode designar impureza em sentido ritual e moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “Os dois morrerão sem filhos”. Mais literalmente, o hebraico diz apenas que ficarão “sem filhos”, sem explicar como essa sentença será cumprida.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Se um homem
  rationale: A construção introduz um novo caso legal. Em português, “Se um homem” expressa naturalmente seu valor condicional, sem exigir a reprodução mecânica da conjunção inicial.
- source_word: יִקַּח
  choice: tomar
  rationale: O verbo significa literalmente “tomar” e, neste contexto, implica tomar a mulher para si. A escolha preserva a formulação hebraica sem especificar além do texto se houve casamento formal.
- source_word: אֵשֶׁת אָחִיו
  choice: a mulher de seu irmão
  rationale: É a tradução direta da construção possessiva. “Mulher” conserva o sentido conjugal corrente em português bíblico e moderno.
- source_word: נִדָּה הִוא
  choice: isso é impureza
  rationale: נִדָּה pode indicar impureza ritual-moral ou algo contaminante. O pronome neutro “isso” aplica a qualificação à união ou ao ato, sem caracterizar pessoalmente a mulher como impura.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: ele descobriu a nudez de seu irmão
  rationale: Mantém o conhecido idiomatismo legal de Levítico para relações sexuais ilícitas e preserva sua ligação verbal com outras passagens do livro.
- source_word: עֲרִירִים יִהְיוּ
  choice: Os dois ficarão sem filhos
  rationale: O adjetivo plural significa “sem filhos”, e o verbo plural aponta para ambos os envolvidos. “Ficarão” comunica o estado futuro decretado sem explicar o modo como ocorrerá.
theological_decisions:
- issue: Alcance da proibição relativa à mulher do irmão
  choice: Manter “a mulher de seu irmão” sem acrescentar qualificações
  alternative: Especificar “a mulher de seu irmão ainda vivo” ou introduzir uma exceção explícita para o levirato
  rationale: Este versículo não declara tais qualificações. Acrescentá-las resolveria no corpo da tradução uma relação legal que deve ser avaliada à luz de outros textos, em vez de preservar a formulação própria desta passagem.
- issue: Sentido da sentença עֲרִירִים יִהְיוּ
  choice: Os dois ficarão sem filhos
  alternative: Os dois morrerão sem filhos
  rationale: O hebraico afirma a condição de não ter filhos, mas não especifica morte nem o mecanismo pelo qual a sentença se cumpre. A tradução mantém essa abertura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A linguagem jurídica permanece concisa; o idiomatismo “descobriu a nudez” foi conservado por sua importância literária e legal em Levítico. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
