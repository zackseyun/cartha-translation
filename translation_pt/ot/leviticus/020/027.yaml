revisions:
- from: Se um homem ou uma mulher tiver em si um espírito de necromancia[a] ou de adivinhação[b], certamente será morto. Eles os apedrejarão. O sangue deles recairá sobre eles mesmos.[c]
  to: Se um homem ou uma mulher for médium[a] ou pessoa que consulta espíritos[b], certamente será morto; será apedrejado com pedras. O sangue deles estará sobre eles.[c]
  rationale: A revisão traduz os termos em seu sentido funcional mais provável neste contexto legal, sem negar por tradução a discussão lexical sobre ouֹב, que permanece registrada na nota. Também corrige erros formais nas notas, torna inequívoca a referência da execução e retém a fórmula hebraica final de responsabilidade pelo sangue.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:56:15Z'
review_pass:
  verdict: revise
  source_fidelity: A redação atual trata tanto אוֹב quanto יִדְּעֹנִי como “espíritos” presentes na pessoa. Embora אוֹב possa, em certos usos, referir-se a um espírito associado à necromancia, no contexto jurídico a leitura funcional como pessoa/praticante é a mais segura; “espírito de adivinhação” não representa adequadamente יִדְּעֹנִי. A revisão mantém a distinção entre os dois termos e preserva a ambiguidade lexical em notas.
  naturalness: A revisão elimina construções pouco naturais e referentes plurais pouco claros (“Eles os apedrejarão”) depois de um sujeito distributivo singular. “Será apedrejado com pedras” é claro, conserva expressamente o instrumento hebraico e mantém o registro jurídico solene.
  terminology: “Médium” comunica adequadamente אוֹב em português moderno. Para יִדְּעֹנִי, “pessoa que consulta espíritos” evita tanto a falsa reificação como espírito quanto conotações modernas imprecisas de “adivinho”; a nota registra “adivinho” como alternativa lexical. A fórmula final é mantida de modo literal, com explicação jurídica em nota.
  issues:
  - severity: high
    issue: “Espírito de necromancia” e “de adivinhação” no texto principal
    rationale: A construção apresenta os dois termos hebraicos como espíritos possuídos. Isso é especialmente inadequado para יִדְּעֹנִי, que designa um praticante ligado à consulta de espíritos/conhecimento oculto, não “um espírito de adivinhação”.
  - severity: medium
    issue: Notas a e b contêm o erro “for médium/adivinho”
    rationale: O texto das notas tem um erro formal e precisa indicar corretamente as alternativas em português.
  - severity: medium
    issue: “Eles os apedrejarão” após sujeito singular distributivo
    rationale: Embora reflita a alternância de número do hebraico, em português produz uma referência pronominal menos clara. A voz passiva singular é natural e não altera o sentido.
  - severity: low
    issue: O instrumento da execução não é expresso
    rationale: O verbo “apedrejar” já o sugere, mas o hebraico inclui explicitamente “com pedra(s)”; “com pedras” pode ser preservado sem prejuízo de naturalidade.
  revised_text: Se um homem ou uma mulher for médium[a] ou pessoa que consulta espíritos[b], certamente será morto; será apedrejado com pedras. O sangue deles estará sobre eles.[c]
