    reason: lexical_alternative
  - marker: b
    text: Ou “adivinho”. O termo hebraico designa uma pessoa associada à consulta de espíritos ou ao conhecimento oculto.
    reason: lexical_alternative
  - marker: c
    text: Expressão jurídica que atribui aos próprios infratores a responsabilidade por sua morte.
    reason: cultural_note
