  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: pt
  text: Se um homem ou uma mulher for médium[a] ou pessoa que consulta espíritos[b], certamente será morto; será apedrejado com pedras. O sangue deles estará sobre eles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito familiar”. O termo hebraico pode designar o espírito associado à necromancia ou, por extensão, a pessoa que o consulta.
    reason: lexical_alternative
  - marker: b
    text: Ou “adivinho”. O termo hebraico designa uma pessoa associada à consulta de espíritos ou ao conhecimento oculto.
    reason: lexical_alternative
  - marker: c
    text: Expressão jurídica que atribui aos próprios infratores a responsabilidade por sua morte.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֽוֹ אִשָּׁה
  choice: Se um homem ou uma mulher
  rationale: Mantém a menção explícita dos dois sexos. No contexto, a conjunção inicial é representada com naturalidade pela abertura condicional em português, sem a necessidade de um “e” artificial.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: tiver em si
  rationale: Expressa de modo compreensível a construção hebraica “houver neles”, sem decidir se o termo seguinte designa propriamente um espírito presente na pessoa ou, por extensão, a função exercida por ela.
- source_word: אוֹב
  choice: um espírito de necromancia
  rationale: Preserva a referência ao contato com os mortos e a ambiguidade do termo, que pode indicar o espírito associado à necromancia ou a pessoa que atua como médium.
- source_word: יִדְּעֹנִי
  choice: '[um espírito] de adivinhação'
  rationale: Traduz o segundo termo ocultista de forma paralela e inteligível, evitando palavras que hoje evocam fantasia. A elipse de “espírito” é natural em português.
- source_word: מוֹת יוּמָתוּ
  choice: certamente será morto
  rationale: Representa a ênfase da construção com infinitivo absoluto e verbo no hofal, comunicando inequivocamente a sentença de morte.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: Eles os apedrejarão
  rationale: O verbo português já inclui o uso de pedras; acrescentar “com pedras” seria redundante. O plural dos pronomes conserva a formulação distributiva hebraica referente ao homem ou à mulher mencionados.
- source_word: דְּמֵיהֶם בָּם
  choice: O sangue deles recairá sobre eles mesmos
  rationale: Mantém a imagem do sangue e explicita reflexivamente a responsabilidade dos condenados pela própria morte, sem substituir a fórmula por um termo jurídico interpretativo.
theological_decisions:
- issue: Sentido dos termos ligados à consulta de espíritos
  choice: “espírito de necromancia” e “de adivinhação” no texto, com a extensão metonímica a “médium” e “adivinho” indicada em notas
  alternative: Traduzir diretamente por “médium” e “adivinho”
  rationale: O hebraico admite discussão sobre se os substantivos nomeiam espíritos, práticas ou seus praticantes. A redação escolhida conserva essa tensão lexical e as notas oferecem a leitura funcional sem impor uma taxonomia do mundo espiritual.
- issue: Fórmula de responsabilidade pelo sangue
  choice: “O sangue deles recairá sobre eles mesmos”
  alternative: “Eles são culpados da própria morte”
  rationale: A escolha retém a metáfora jurídica do original e deixa sua função clara, sem transformar a tradução em explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Necromancia” é um termo técnico, mas corrente o bastante e esclarecido pela nota. A alternância entre o singular distributivo (“será morto”) e os plurais (“os”, “deles”) reproduz a passagem do par genérico para as pessoas abrangidas pela lei, embora possa soar levemente marcada em português.
