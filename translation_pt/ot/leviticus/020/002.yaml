base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: pt
  text: 'E diga aos filhos de Israel: “Qualquer homem dentre os filhos de Israel ou dentre os estrangeiros residentes em Israel[a] que der algum de seus descendentes[b] a Moloque[c] certamente será morto; o povo da terra o apedrejará.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o estrangeiro que reside em Israel”, com um substantivo e um verbo da mesma raiz. A expressão designa o estrangeiro que vive como residente no meio do povo.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico significa literalmente “semente” e, aqui, refere-se aos filhos ou descendentes de uma pessoa.
    reason: lexical_alternative
  - marker: c
    text: Moloque é tradicionalmente entendido como nome ou título de uma divindade associada ao sacrifício de crianças. Alguns estudiosos entendem o termo como referência a um tipo de oferta, e não a uma divindade.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão hebraica tradicional e seu caráter corporativo, mantendo o masculino representativo sem substituí-lo desnecessariamente por uma formulação neutra.
- source_word: אִישׁ אִישׁ
  choice: qualquer homem
  rationale: 'A repetição do substantivo tem sentido distributivo: qualquer homem, sem exceção.'
- source_word: הַגֵּר הַגָּר בְּיִשְׂרָאֵל
  choice: estrangeiros residentes em Israel
  rationale: Expressa em português natural a condição do גֵּר, estrangeiro que vive de modo estável no meio de Israel. O hebraico singular possui força genérica; o português plural concorda naturalmente com a construção coordenada.
- source_word: יִתֵּן מִזַּרְעוֹ
  choice: der algum de seus descendentes
  rationale: זֶרַע significa literalmente “semente”, mas neste contexto designa filhos ou descendentes. “Algum de seus descendentes” mantém a amplitude lexical sem acrescentar detalhes do rito.
- source_word: לַמֹּלֶךְ
  choice: a Moloque
  rationale: Adota a compreensão tradicional do termo como nome ou título da entidade cultual, deixando em nota a leitura alternativa como designação de um tipo de oferta.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: Reproduz tanto a intensificação do infinitivo absoluto quanto o sentido judicial passivo da forma verbal.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Mantém a formulação concreta do hebraico; no contexto, refere-se à comunidade encarregada de executar a sentença.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: o apedrejará
  rationale: “Apedrejar” comunica de modo natural e completo em português a execução por pedras, sem a redundância pouco idiomática “apedrejar com pedras”.
theological_decisions:
- issue: Sentido da entrega de descendentes a Moloque
  choice: O texto principal apresenta Moloque como nome ou título da entidade à qual o descendente é entregue.
  alternative: O termo pode designar um tipo específico de oferta, e não uma divindade.
  rationale: A leitura tradicional é direta e bem estabelecida, mas a controvérsia lexical é real. O texto não explicita aqui fogo, sacrifício ou detalhes rituais; por isso, esses elementos não foram acrescentados à tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe jurídica e solene foi preservada sem reproduzir redundâncias hebraicas que soariam artificiais em português.
