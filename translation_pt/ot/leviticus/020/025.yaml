  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: pt
  text: Portanto, vocês devem distinguir entre o animal puro e o impuro, e entre a ave impura e a pura. Não se[b] tornem detestáveis[a] por meio do animal, da ave ou de qualquer coisa que rasteja sobre o solo, que separei para vocês como impura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abomináveis”. O verbo hebraico pertence ao campo semântico do que é detestável ou repugnante; não é o termo habitual para “tornar-se impuro”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “suas vidas”, “suas pessoas” ou, literalmente, “suas almas”; neste idioma, o sentido é “vocês mesmos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: Portanto, vocês devem distinguir
  rationale: O hifil de בדל indica estabelecer ou reconhecer uma distinção. “Distinguir” é natural em português, e “portanto” expressa a ligação lógica com o contexto.
- source_word: הַבְּהֵמָה
  choice: animal
  rationale: O termo designa aqui uma categoria ampla de animais terrestres; “animal” é atual e não restringe indevidamente o sentido a gado.
- source_word: הַטְּהֹרָה / הַטְּמֵא / הַטְּמֵאָה / הַטָּהֹר
  choice: puro / impuro
  rationale: Esses termos preservam as categorias levíticas de pureza ritual e são claros em português, sem converter a distinção em uma afirmação meramente higiênica ou moral.
- source_word: הָעוֹף
  choice: ave
  rationale: Embora o hebraico possa abranger criaturas voadoras, “ave” é a designação mais natural neste contexto alimentar.
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: Não tornem ... detestáveis
  rationale: O piel de שׁקץ pertence ao campo semântico do que é detestável ou abominável. A formulação evita confundi-lo com o vocabulário próprio de tornar-se impuro.
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: vocês mesmos
  rationale: נפשׁ refere-se aqui às próprias pessoas, não necessariamente a uma alma imaterial distinta do corpo. A expressão reflexiva comunica o idioma hebraico.
- source_word: בַּבְּהֵמָה וּבָעוֹף
  choice: por meio do animal, da ave
  rationale: A preposição indica o meio ou aquilo por cujo uso as pessoas se tornam detestáveis; “por meio de” torna essa relação explícita sem especificar consumo ou contato.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: ou de qualquer coisa que rasteja sobre o solo
  rationale: רמשׂ descreve movimento rente ao chão. “Qualquer coisa que rasteja” mantém a amplitude do hebraico sem introduzir a ideia específica de enxamear.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: que separei para vocês como impura
  rationale: A tradução conserva a ideia de designação divina da categoria e deixa a oração relativa ligada, como no hebraico, ao conjunto expresso imediatamente antes.
theological_decisions:
- issue: Categorias rituais ou paráfrase moralizada
  choice: puro/impuro como categorias de pureza da aliança
  alternative: moralmente bom/mau ou saudável/nocivo
  rationale: O versículo trata das distinções alimentares e rituais dadas a Israel; a tradução não as reduz a juízos morais ou higiênicos.
- issue: Sentido de נֶפֶשׁ em אֶת נַפְשֹׁתֵיכֶם
  choice: as próprias pessoas (“vocês mesmos”)
  alternative: “suas almas”
  rationale: O idioma hebraico designa aqui a pessoa inteira. “Vocês mesmos” evita impor ao texto uma antropologia dualista que ele não exige.
- issue: Alcance da oração relativa אֲשֶׁר הִבְדַּלְתִּי
  choice: manter a ligação sintática sem explicitar além do hebraico se ela abrange apenas o último grupo ou todas as categorias mencionadas
  alternative: reescrever explicitamente como “todos os quais”
  rationale: A formulação preserva a leve ambiguidade estrutural do original em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. Mantiveram-se as categorias rituais “puro/impuro” e a alternância da ordem presente no hebraico. Os marcadores foram colocados junto às expressões que de fato explicam.
