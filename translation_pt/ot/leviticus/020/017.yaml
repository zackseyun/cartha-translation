source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: pt
  text: Se um homem tomar sua irmã, filha de seu pai ou filha de sua mãe, e vir a nudez dela, e ela vir a nudez dele, isso é uma infâmia[a]. Eles serão eliminados perante os filhos do seu povo[b]. Ele expôs a nudez de sua irmã; levará sobre si a sua culpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “algo vergonhoso” ou “uma desonra”. O hebraico חֶסֶד tem aqui um raro sentido negativo, não seu sentido habitual de “bondade” ou “amor leal”.
    reason: lexical_alternative
  - marker: b
    text: A fórmula hebraica traduzida por “serão eliminados” não especifica se a pena é morte, expulsão ou outra forma de remoção.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o masculino singular da formulação jurídica hebraica.
- source_word: יִקַּח
  choice: tomar
  rationale: Preserva a amplitude do verbo hebraico, que neste contexto pode sugerir tomá-la como mulher ou sexualmente, sem definir além do que o texto explicita nas cláusulas seguintes.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: sua irmã, filha de seu pai ou filha de sua mãe
  rationale: Conserva a explicação aposicional e inclui claramente tanto a irmã por parte de pai quanto a irmã por parte de mãe.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: e vir a nudez dela, e ela vir a nudez dele
  rationale: Mantém a imagem e o eufemismo jurídico-sexual do hebraico, em vez de explicitar relações sexuais na tradução.
- source_word: חֶסֶד
  choice: uma infâmia
  rationale: Neste uso negativo e raro, o termo designa um ato vergonhoso ou desonroso; “infâmia” é conciso, digno e adequado ao contexto penal.
- source_word: וְנִכְרְתוּ
  choice: serão eliminados
  rationale: Expressa a fórmula jurídica de remoção sem determinar se o meio é morte, expulsão ou outra forma de exclusão; a nota registra essa ambiguidade.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: perante os filhos do seu povo
  rationale: Preserva de perto a imagem hebraica e sua dimensão pública e comunitária.
- source_word: גִּלָּה
  choice: expôs
  rationale: Reproduz o sentido de descobrir ou deixar nua, mantendo a ligação com a linguagem de nudez nas leis de incesto.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: levará sobre si a sua culpa
  rationale: Conserva a fórmula jurídico-teológica que abrange tanto a culpa quanto as consequências associadas a ela, sem reduzi-la apenas à punição.
theological_decisions:
- issue: Sentido de חֶסֶד neste versículo
  choice: 'sentido negativo: “uma infâmia”'
  alternative: o sentido comum positivo de “bondade” ou “amor leal”
  rationale: O contexto da proibição e da sanção exige o raro sentido negativo; a tradução positiva contrariaria o teor da passagem.
- issue: Natureza da pena expressa por וְנִכְרְתוּ
  choice: manter uma fórmula de remoção sem especificar o mecanismo
  alternative: entender especificamente como execução, expulsão ou exclusão da comunidade
  rationale: A expressão hebraica não define por si só o modo da sanção neste versículo; a tradução preserva essa tensão em vez de decidir uma questão debatida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém os eufemismos jurídicos do hebraico e sua ambiguidade penal. Os marcadores de nota foram colocados junto às expressões efetivamente comentadas.
