  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: pt
  text: Se um homem se deitar com a mulher de seu pai, descobriu a nudez de seu pai[a]. Ambos certamente serão mortos; o sangue deles recai sobre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “desonrou sexualmente seu pai”. A expressão hebraica diz literalmente “descobriu a nudez de seu pai” e é uma fórmula de Levítico para uma relação sexual proibida.'
    reason: lexical_alternative
  - marker: b
    text: Expressão jurídica que indica que eles próprios são responsáveis pela pena de morte que lhes é imposta.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Se um homem
  rationale: A construção introduz um caso jurídico condicional; “Se um homem” é natural em português e preserva o sujeito masculino específico.
- source_word: יִשְׁכַּב אֶת
  choice: se deitar com
  rationale: No contexto das leis sexuais, o verbo denota relação sexual. A expressão mantém o caráter idiomático e o registro digno do hebraico.
- source_word: אֵשֶׁת אָבִיו
  choice: a mulher de seu pai
  rationale: Reproduz a formulação hebraica sem restringir o referente a “madrasta”, termo mais interpretativo.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: terá descoberto a nudez de seu pai
  rationale: Preserva a expressão fixa de Levítico e sua ligação com as proibições do capítulo 18. O futuro composto exprime, no caso jurídico, o ato consumado que fundamenta a pena.
- source_word: מוֹת יוּמְתוּ
  choice: serão certamente mortos
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a certeza da pena sem especificar um método de execução.
- source_word: שְׁנֵיהֶם
  choice: Ambos
  rationale: Mantém a aplicação explícita da pena às duas pessoas envolvidas.
- source_word: דְּמֵיהֶם בָּם
  choice: o sangue deles recai sobre eles
  rationale: Conserva a metáfora jurídica hebraica e comunica que a responsabilidade pela morte recai sobre os próprios infratores.
theological_decisions:
- issue: Expressão das leis sexuais e sua força canônica
  choice: terá descoberto a nudez de seu pai
  alternative: terá desonrado sexualmente seu pai
  rationale: A formulação literal preserva a linguagem técnica recorrente em Levítico e não reduz sua dimensão moral e familiar a uma paráfrase interpretativa.
- issue: Sujeito jurídico marcado pelo gênero
  choice: Se um homem
  alternative: Se alguém
  rationale: O hebraico apresenta especificamente um sujeito masculino, adequado à natureza da infração descrita; neutralizá-lo apagaria uma informação do texto.
- issue: Responsabilidade expressa pela fórmula do sangue
  choice: o sangue deles recai sobre eles
  alternative: eles são responsáveis pela própria morte
  rationale: A metáfora jurídica é preservada no texto, enquanto a nota esclarece seu sentido sem eliminar sua força bíblica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Mantém-se a linguagem jurídica condicional e a expressão corporal característica de Levítico; as notas esclarecem os idiomas sem substituí-los por paráfrases.
