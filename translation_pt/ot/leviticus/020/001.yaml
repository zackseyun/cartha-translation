  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido como “o SENHOR”.'
    reason: Registra a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O wayyiqtol no Piel de דבר introduz uma nova unidade de discurso. “Falou” reproduz de modo natural e digno a fórmula hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Marca o destinatário da fala; “falou a Moisés” é uma construção corrente em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Embora literalmente corresponda a “dizendo”, nesta fórmula introdutória o dois-pontos comunica naturalmente em português que as palavras vêm a seguir, sem produzir uma construção artificial.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama como nome próprio. “Yahweh” preserva esse nome e evita substituí-lo por um título; a nota registra a tradição de vertê-lo como “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno. A fórmula hebraica foi vertida idiomaticamente, usando dois-pontos para introduzir o discurso que começa no versículo seguinte.
