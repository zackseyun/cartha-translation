source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: pt
  text: Se um homem tomar uma mulher e a mãe dela[a], isso é perversidade[c]. Devem queimar no fogo o homem e as duas mulheres[b], para que não haja perversidade no meio de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “casar-se com uma mulher e com a mãe dela”. Em contextos legais, o verbo hebraico traduzido como “tomar” pode indicar casamento, embora aqui não se use um termo explícito para “casar-se”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a ele e a elas”; “elas” se refere à mulher e à mãe dela.
    reason: lexical_clarification
  - marker: c
    text: Também pode ser traduzido como “infâmia”, “ato vergonhoso” ou “ultraje”. O termo hebraico descreve aqui uma grave transgressão sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo hebraico está no masculino singular e identifica o homem envolvido na transgressão.
- source_word: יִקַּח
  choice: tomar
  rationale: לקח significa literalmente “tomar” e, em contextos legais, pode indicar tomar por esposa. A formulação preserva essa possível conotação sem tornar explícito um casamento que o hebraico não nomeia diretamente.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. “Mulher” mantém a amplitude lexical e evita decidir de antemão a natureza jurídica da união.
- source_word: אִמָּהּ
  choice: a mãe dela
  rationale: A construção possessiva relaciona inequivocamente a mãe com a mulher mencionada antes; “dela” é claro e natural em português.
- source_word: זִמָּה
  choice: perversidade
  rationale: No contexto das leis sexuais de Levítico, זִמָּה designa um ato gravemente imoral e ultrajante. “Perversidade” comunica essa forte censura moral sem restringir o termo a uma nuance única.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: A expressão indica o fogo como meio da pena. Embora “queimar no fogo” tenha certa redundância em português, ela conserva a menção enfática e explícita do hebraico.
- source_word: יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן
  choice: Devem queimar no fogo o homem e as duas mulheres
  rationale: O hebraico emprega verbo ativo na terceira pessoa do plural, com o homem e as mulheres como objetos. “Devem queimar” reproduz o valor prescritivo da formulação legal sem inventar agentes específicos; “as duas mulheres” esclarece o referente do pronome feminino plural.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: para que não haja perversidade no meio de vocês
  rationale: A redação comunica naturalmente a finalidade ou o resultado visado pela pena e traduz בְּתוֹכְכֶם de modo claro para leitores modernos.
theological_decisions:
- issue: Natureza da relação indicada por “tomar uma mulher e a mãe dela”
  choice: Manter a formulação ampla “tomar uma mulher e a mãe dela”.
  alternative: “casar-se com uma mulher e com a mãe dela” ou “tomar por esposa uma mulher e a mãe dela”
  rationale: לקח pode ter sentido matrimonial nesse contexto, mas o versículo não contém um termo inequívoco para casamento. A tradução mantém a ambiguidade genuína e registra a leitura matrimonial em nota.
- issue: Forma da cláusula penal
  choice: 'Usar uma construção ativa e prescritiva: “Devem queimar...”'
  alternative: “O homem e as duas mulheres serão queimados no fogo.”
  rationale: O texto hebraico traz uma forma verbal ativa no plural, não uma passiva. A construção escolhida preserva essa característica sem identificar agentes que o versículo não nomeia.
- issue: Referente do objeto feminino plural
  choice: Explicitar “as duas mulheres” no texto.
  alternative: Traduzir literalmente “ele e elas”.
  rationale: O sufixo feminino plural refere-se à mulher e à mãe dela. A explicitação evita uma formulação portuguesa dura ou ambígua, sem alterar quem está incluído na sentença.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom prescritivo da lei, a ambiguidade possível de “tomar” e a força moral de זִמָּה, evitando linguagem denominacional ou explicações doutrinárias acrescentadas.
