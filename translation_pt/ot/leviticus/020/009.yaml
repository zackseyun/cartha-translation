  text: כִּֽי אִ֣ישׁ אִ֗ישׁ אֲשֶׁ֨ר יְקַלֵּ֧ל אֶת אָבִ֛י/ו וְ/אֶת אִמּ֖/וֹ מ֣וֹת יוּמָ֑ת אָבִ֧י/ו וְ/אִמּ֛/וֹ קִלֵּ֖ל דָּמָ֥י/ו בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: pt
  text: Pois qualquer homem que amaldiçoar seu pai ou sua mãe certamente será morto. Ele amaldiçoou seu pai e sua mãe; seu sangue recai sobre ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ele é responsável por sua própria morte». A expressão hebraica atribui ao próprio infrator a responsabilidade por sua morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz e fundamenta este caso legal no fluxo do capítulo; «pois» preserva melhor essa força explicativa do que uma formulação estritamente condicional.
- source_word: אִישׁ אִישׁ
  choice: todo homem
  rationale: A repetição forma uma expressão distributiva, isto é, «todo homem» ou «quem quer que». A escolha conserva a forma masculina do hebraico e comunica sua abrangência representativa.
- source_word: יְקַלֵּל / קִלֵּל
  choice: amaldiçoar / amaldiçoou
  rationale: O piel de קלל, neste contexto penal, indica proferir maldição contra alguém, não apenas desonrá-lo ou tratá-lo com desprezo.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: seu pai ou sua mãe / seu pai e sua mãe
  rationale: Na definição do delito, «ou» deixa claro em português que amaldiçoar qualquer um dos pais acarreta a pena. Na fundamentação subsequente, «e» preserva a formulação hebraica resumidora.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a sentença; esta formulação conserva tanto a ênfase quanto a voz passiva judicial.
- source_word: דָּמָיו בּוֹ
  choice: seu sangue recai sobre ele
  rationale: A expressão idiomática atribui ao próprio infrator a responsabilidade por sua morte, mantendo a imagem jurídica do sangue sem explicá-la excessivamente no texto.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ אִישׁ
  choice: todo homem
  alternative: qualquer pessoa / quem quer que
  rationale: A tradução preserva a forma masculina do texto hebraico. No contexto legal, ela tem alcance representativo, mas isso não exige neutralizar sua forma na tradução.
- issue: Fórmula de responsabilidade דָּמָיו בּוֹ
  choice: seu sangue recai sobre ele
  alternative: sua culpa de sangue está sobre ele / ele é responsável por sua própria morte
  rationale: A escolha mantém a metáfora jurídica e atribui a responsabilidade pela execução ao infrator, sem acrescentar conceitos posteriores de expiação ou culpa metafísica.
translation_notes:
  register: Português moderno, digno e direto, com leitura natural no Brasil e compreensão internacional. «Será morto» preserva a passiva judicial; «recai sobre ele» torna a fórmula hebraica inteligível sem eliminar sua imagem.
