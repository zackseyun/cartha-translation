  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: pt
  text: Não andem segundo os costumes[a] da nação que estou expulsando de diante de vocês[b], pois eles fizeram todas essas coisas, e eu os detestei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as normas”. O termo hebraico pode indicar práticas estabelecidas ou determinações fixas.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “enviando para longe de diante de vocês”; neste contexto, o sentido é expulsar ou desalojar.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “senti repulsa por eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: andem
  rationale: Preserva a imagem hebraica de “andar” como modo de conduta; em português, “andar segundo” é compreensível e mantém o caráter ético da expressão.
- source_word: בְּחֻקֹּת
  choice: segundo os costumes
  rationale: Neste contexto, חֻקּוֹת designa práticas ou normas estabelecidas da nação. “Costumes” comunica naturalmente a referência às práticas enumeradas no contexto, enquanto a nota registra a alternativa mais jurídica.
- source_word: הַגּוֹי
  choice: da nação
  rationale: O substantivo está no singular e apresenta coletivamente o povo cananeu que seria desalojado; “nação” conserva esse número e evita conotações posteriores de “gentios”.
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: estou expulsando de diante de vocês
  rationale: Embora שׁלח possa significar “enviar”, com מִפְּנֵיכֶם neste contexto expressa remoção da terra. A formulação conserva também a imagem espacial do hebraico.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: pois eles fizeram todas essas coisas
  rationale: כִּי introduz a causa, e a tradução direta remete às práticas proibidas nos versículos anteriores sem explicitação adicional.
- source_word: וָאָקֻץ בָּם
  choice: e eu os detestei
  rationale: קוץ exprime forte repulsa ou aversão. “Detestei” é atual, vigoroso e permite que o pronome “os” continue com naturalidade a referência às pessoas da nação.
theological_decisions:
- issue: Expressão da repulsa divina
  choice: e eu os detestei
  alternative: e senti repulsa por eles
  rationale: O texto atribui a Deus uma reação intensa de aversão. A tradução preserva essa força afetiva e moral sem reduzi-la a simples desaprovação nem ampliá-la em uma formulação doutrinária.
- issue: Referente do pronome em בָּם
  choice: os, referindo-se aos membros da nação
  alternative: delas, referindo-se às práticas
  rationale: O antecedente gramatical mais natural é o grupo humano indicado por הַגּוֹי e retomado pelo verbo plural “fizeram”. A tensão entre a condenação das práticas e a repulsa dirigida aos seus praticantes é mantida, sem substituir o referente por “coisas”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Não andem segundo” conserva a metáfora ética hebraica sem soar excessivamente arcaico; “vocês” torna explícita a segunda pessoa do plural.
