base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: pt
  text: 'Mas eu disse a vocês: “Vocês tomarão posse da terra deles, e eu mesmo a darei a vocês para possuí-la”[a] — uma terra onde correm leite e mel.[b] Eu sou Yahweh,[c] o Deus de vocês, que os separei dos povos.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês herdarão a terra deles, e eu mesmo a darei a vocês para herdá-la”. O verbo hebraico pode significar tanto herdar quanto tomar posse.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “uma terra onde correm leite e mel” descreve uma terra fértil e abundante.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
  - marker: d
    text: 'Ou: “que os coloquei à parte dentre os povos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Mas eu disse
  rationale: O waw dá continuidade ao discurso, enquanto “mas” expressa naturalmente o contraste contextual com o destino dos povos anteriormente mencionados.
- source_word: תִּירְשׁוּ ... לָרֶשֶׁת אֹתָהּ
  choice: tomarão posse ... para que a possuam
  rationale: ירשׁ pode significar herdar ou tomar posse. A formulação escolhida preserva o paralelismo verbal e comunica de modo natural a aquisição e posse da terra.
- source_word: אַדְמָתָם
  choice: a terra deles
  rationale: Embora אֲדָמָה possa designar solo ou chão, neste contexto territorial “terra” é a opção portuguesa mais natural.
- source_word: וַאֲנִי
  choice: e eu mesmo
  rationale: O pronome independente enfatiza o próprio Yahweh como aquele que dá a terra.
- source_word: אֶתְּנֶנָּה
  choice: a darei
  rationale: O sufixo feminino retoma a terra, e o futuro exprime adequadamente a promessa divina.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: uma terra onde correm leite e mel
  rationale: Reproduz a imagem idiomática hebraica de fertilidade e abundância em português claro e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הִבְדַּלְתִּי
  choice: separei
  rationale: Traduz diretamente a ação divina de distinguir ou pôr Israel à parte, sem desenvolver implicações teológicas além do texto.
- source_word: הָעַמִּים
  choice: os outros povos
  rationale: “Povos” traduz o plural עַמִּים; “outros” torna explícita em português a relação indicada por “separar vocês dos povos”, sem lhe dar sentido político indevido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” preserva esse nome, enquanto “SENHOR” o substitui por um título.
- issue: Natureza da distinção de Israel
  choice: que os separei dos outros povos
  alternative: que os coloquei à parte dentre os povos
  rationale: “Separei” mantém a afirmação textual e o tema de distinção deste capítulo sem acrescentar categorias doutrinárias posteriores.
- issue: Sentido de ירשׁ na promessa da terra
  choice: tomar posse / possuir
  alternative: herdar
  rationale: O verbo admite ambos os matizes. O texto principal salienta a posse da terra, e a nota conserva a legítima alternativa “herdar”.
translation_notes:
  register: Português moderno, digno e acessível, com construção legível tanto no Brasil quanto em outros contextos lusófonos. “A vocês” evita ambiguidade regional; “os separei” retoma naturalmente o grupo referido. As notas seguem a ordem dos marcadores no texto.
