base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: pt
  text: Se um homem se deitar com uma mulher durante a impureza menstrual dela[a] e descobrir a nudez dela — ele expôs a fonte dela[b], e ela descobriu a fonte do seu sangue —, ambos serão removidos do meio do povo deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto ela estiver menstruada”. O termo hebraico também inclui a ideia da impureza ritual associada à menstruação em Levítico.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “ele expôs a fonte dela, e ela descobriu a fonte do seu sangue”. Nesse contexto, “fonte” é uma imagem hebraica para a origem corporal do fluxo menstrual.'
    reason: lexical_alternative
  - marker: c
    text: “Serão removidos” traduz uma fórmula jurídica comum na Torá. Aqui o texto não especifica de que modo essa remoção seria efetuada.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o referente masculino singular da formulação jurídica e corresponde ao participante masculino mencionado no contexto sexual.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: se deitar com uma mulher
  rationale: Preserva de modo natural e digno o eufemismo hebraico para relações sexuais, sem recorrer a linguagem clínica.
- source_word: דָּוָה
  choice: durante a impureza menstrual dela
  rationale: Expressa tanto a menstruação quanto o estado de impureza ritual relevante no contexto de Levítico.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: descobrir a nudez dela
  rationale: Conserva a expressão jurídica característica de Levítico para exposição sexual ou relação sexual ilícita.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: ele expôs a fonte do fluxo dela
  rationale: Mantém a imagem hebraica de uma fonte corporal e esclarece que ela se refere ao fluxo menstrual, sem tornar a frase excessivamente clínica.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: e ela descobriu a fonte do seu sangue
  rationale: Preserva a cláusula paralela e sua referência à participação da mulher, bem como a metáfora da fonte.
- source_word: וְנִכְרְתוּ
  choice: ambos serão eliminados
  rationale: Verte a fórmula jurídica de remoção sem definir no texto principal se ela ocorre por morte, expulsão ou outro meio.
- source_word: מִקֶּרֶב עַמָּם
  choice: do meio do seu povo
  rationale: Reproduz a dimensão comunitária e pactual da fórmula hebraica em português natural.
theological_decisions:
- issue: Natureza da condição indicada por דָּוָה
  choice: impureza menstrual
  alternative: enquanto ela estiver menstruada; enfermidade/impureza
  rationale: No contexto das leis levíticas, o termo aponta especificamente para a menstruação considerada como estado de impureza ritual, não para uma enfermidade genérica.
- issue: Sentido da pena expressa por וְנִכְרְתוּ
  choice: serão eliminados do meio do seu povo
  alternative: serão mortos; serão expulsos da comunidade; morrerão sem descendência
  rationale: A fórmula hebraica não determina aqui o mecanismo da remoção. A tradução e a nota preservam essa indefinição em vez de impor uma interpretação jurídica ou teológica disputada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva os eufemismos jurídicos e corporais do hebraico, esclarecendo em notas os pontos que poderiam soar opacos, e evita definir além do texto a natureza da pena.
