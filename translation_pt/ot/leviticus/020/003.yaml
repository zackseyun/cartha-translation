  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: pt
  text: Eu mesmo voltarei o meu rosto contra aquele homem e o eliminarei do meio do seu povo, porque ele deu um de seus descendentes a Moloque[a], a fim de contaminar o meu santuário e profanar o meu santo nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacrificou um de seus filhos a Moloque”. Literalmente, o hebraico diz “deu um de seus descendentes a Moloque”; o sentido de sacrifício é inferido do contexto mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Eu mesmo
  rationale: O pronome independente é enfático e destaca a ação pessoal de Deus no juízo.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: voltarei o meu rosto contra aquele homem
  rationale: Preserva a imagem hebraica de oposição divina deliberada em português natural; o demonstrativo הַהוּא é mantido por “aquele”.
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: e o eliminarei do meio do seu povo
  rationale: Expressa a fórmula judicial de כרת sem especificar indevidamente o modo da pena e conserva sua dimensão comunitária.
- source_word: מִזַּרְעוֹ
  choice: um dos seus descendentes
  rationale: A construção partitiva מן indica alguém dentre sua descendência; “descendentes” evita o literalismo obscuro de “semente” e não restringe o termo além do hebraico.
- source_word: נָתַן לַמֹּלֶךְ
  choice: deu ... a Moloque
  rationale: Mantém o verbo geral “dar” empregado no versículo, sem inserir no texto principal a interpretação sacrificial fornecida pelo contexto.
- source_word: לְמַעַן טַמֵּא אֶת־מִקְדָּשִׁי
  choice: contaminando assim o meu santuário
  rationale: Comunica a relação de finalidade ou resultado de לְמַעַן e preserva o sentido cultual de טמא em linguagem clara.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: e profanando o meu santo nome
  rationale: “Profanar” conserva o peso cultual e teológico de tratar como comum aquilo que é santo.
theological_decisions:
- issue: Natureza da entrega a Moloque
  choice: Manter “deu um dos seus descendentes a Moloque” no texto principal.
  alternative: “sacrificou um dos seus filhos a Moloque” ou “fez um dos seus descendentes passar pelo fogo para Moloque”.
  rationale: O contexto mais amplo indica sacrifício de crianças, mas este versículo emprega apenas o verbo geral “dar”. A tradução conserva essa formulação e registra a interpretação contextual em nota.
- issue: Envolvimento pessoal de Deus no juízo
  choice: “Eu mesmo voltarei o meu rosto contra aquele homem”.
  alternative: “Eu me oporei àquele homem”.
  rationale: A formulação escolhida mantém tanto a ênfase do pronome independente quanto a imagem judicial e relacional do idioma hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Moloque” segue a forma tradicional portuguesa do nome. A ordem e o paralelismo foram ajustados levemente para fluência, sem eliminar a ambiguidade lexical do verbo “dar”.
