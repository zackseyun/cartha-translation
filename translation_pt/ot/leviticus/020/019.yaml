source:
  edition: WLC
  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: pt
  text: Não descubra a nudez da irmã de sua mãe nem a da irmã de seu pai, pois ele expôs sua própria carne[a]; eles levarão sobre si a sua iniquidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu parente próximo” ou “seu próprio sangue”. O hebraico diz literalmente “sua própria carne”, usando uma expressão de parentesco.'
    reason: lexical_alternative
  - marker: b
    text: “Levarão sobre si a sua iniquidade” também pode significar “carregarão a sua culpa” ou “sofrerão o castigo por sua iniquidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: não descubra a nudez
  rationale: Mantém a fórmula jurídica levítica para relações sexuais ilícitas, preservando a imagem e a coerência com o contexto, sem substituí-la por uma explicitação interpretativa.
- source_word: אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ
  choice: a irmã de sua mãe nem a ... irmã de seu pai
  rationale: Reproduz diretamente os termos hebraicos de parentesco; o uso de “nem” expressa com naturalidade em português a coordenação de dois elementos sob a mesma proibição negativa.
- source_word: כִּי
  choice: pois
  rationale: Introduz a justificativa da proibição com valor explicativo, de modo natural e formal em português.
- source_word: שְׁאֵרוֹ
  choice: sua própria carne
  rationale: Preserva a metáfora concreta de parentesco consanguíneo presente no hebraico, sem limitar o sentido a uma paráfrase como “parente próximo”.
- source_word: הֶעֱרָה
  choice: expôs
  rationale: Traduz o sentido de tornar nu ou pôr a descoberto e evita repetir imediatamente o verbo “descobrir”, mantendo o contexto jurídico-sexual.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: eles levarão sobre si a sua iniquidade
  rationale: Conserva o idioma hebraico de carregar a iniquidade, incluindo sua possível abrangência de culpa e consequência, sem especificar uma pena que o texto não explicita.
theological_decisions:
- issue: Mudança do singular para o plural entre a justificativa e a cláusula de responsabilidade
  choice: “ele expôs sua própria carne; eles levarão sobre si a sua iniquidade”
  alternative: 'Uniformizar no plural: “eles expuseram sua própria carne; levarão sobre si a sua iniquidade”'
  rationale: O hebraico usa formas singulares em שְׁאֵרוֹ e הֶעֱרָה, mas passa ao plural em עֲוֺנָם יִשָּׂאוּ. A tradução mantém essa mudança, deixando visível a formulação jurídica do texto e a responsabilidade plural final.
- issue: Grau de explicitação do eufemismo sexual
  choice: Conservar “descobrir a nudez”
  alternative: Explicitar como “ter relações sexuais com”
  rationale: A expressão hebraica é uma fórmula característica deste conjunto de leis. Preservá-la mantém a textura e as ligações internas do texto, enquanto o contexto esclarece seu sentido sexual.
- issue: Amplitude semântica de עָוֹן na fórmula penal
  choice: Traduzir por “iniquidade” e registrar as demais possibilidades em nota
  alternative: Traduzir diretamente por “culpa” ou “castigo pela iniquidade”
  rationale: O termo pode abranger o delito, a culpa e suas consequências. “Iniquidade” mantém essa tensão sem decidir de modo indevido entre culpa moral e punição.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural para leitores brasileiros. A formulação jurídica e a metáfora hebraica de parentesco foram preservadas; evitou-se tanto o arcaísmo verbal quanto uma paráfrase sexual excessivamente explícita.
