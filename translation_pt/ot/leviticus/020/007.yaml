  text: וְ/הִ֨תְקַדִּשְׁתֶּ֔ם וִ/הְיִיתֶ֖ם קְדֹשִׁ֑ים כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: pt
  text: Consagrem-se[a] e sejam santos, porque eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Santifiquem-se” ou “Tornem-se santos”. O verbo hebraico tem sentido reflexivo e convoca Israel a participar ativamente da própria consagração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Consagrem-se
  rationale: O hitpael de קדשׁ tem força reflexiva e convoca Israel a uma consagração ativa. “Consagrem-se” é natural em português e não se confunde com o estado expresso na oração seguinte.
- source_word: וִהְיִיתֶם
  choice: e sejam
  rationale: A forma de היה, coordenada à ordem anterior, funciona naturalmente como uma segunda exortação. “E sejam” preserva tanto a coordenação como a força imperativa.
- source_word: קְדֹשִׁים
  choice: santos
  rationale: “Santos” conserva o peso cultual, pactual e ético de קדושׁ; “separados” expressaria apenas parte do sentido.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão que fundamenta as ordens e é causal e natural no português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Apesar da forma morfológica plural de אֱלֹהִים, o contexto se refere ao único Deus de Israel. A construção explicita naturalmente em português a relação indicada pelo sufixo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual e segue uma transliteração academicamente difundida, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural em forma brasileira amplamente inteligível. “O Deus de vocês” evita a possível leitura de Yahweh e Deus como dois referentes distintos e mantém boa naturalidade.
