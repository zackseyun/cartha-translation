base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: pt
  text: Se um homem se deitar com alguém do sexo masculino, como se deita com uma mulher[a], ambos cometeram uma abominação. Serão certamente mortos; o sangue deles recai sobre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os leitos de uma mulher”, um idiomatismo hebraico referente à relação sexual com uma mulher. O termo traduzido por “alguém do sexo masculino” é literalmente “macho” ou “indivíduo do sexo masculino”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a culpa de sangue deles recai sobre eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Se um homem
  rationale: A formulação introduz uma situação jurídica condicional. “Se um homem” comunica isso naturalmente em português e preserva o singular masculino de אִישׁ.
- source_word: יִשְׁכַּב אֶת
  choice: se deitar com
  rationale: Neste contexto, שׁכב é um modo convencional de se referir a relações sexuais. A expressão portuguesa mantém o caráter idiomático e a proximidade com o hebraico.
- source_word: זָכָר
  choice: outro homem
  rationale: O hebraico usa זָכָר, “indivíduo do sexo masculino”, em contraste com אִישׁ. “Outro homem” é a formulação corrente e digna em português; a nota registra a distinção lexical sem recorrer ao potencialmente desumanizador “macho”.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: como se deita com uma mulher
  rationale: A expressão plural literal, “os leitos de uma mulher”, é um idiomatismo referente à relação sexual com uma mulher. A tradução explicita seu sentido sem ampliá-lo para categorias modernas.
- source_word: תּוֹעֵבָה
  choice: uma abominação
  rationale: “Abominação” preserva o peso moral e cultual de תּוֹעֵבָה e sua relação com ocorrências semelhantes no texto bíblico.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: ambos cometeram
  rationale: A tradução conserva a ênfase explícita do hebraico nos dois participantes e usa em português a colocação natural “cometer uma abominação”.
- source_word: מוֹת יוּמָתוּ
  choice: Certamente serão mortos
  rationale: O infinitivo absoluto seguido da forma verbal passiva intensifica a sentença. “Certamente” preserva a ênfase, e “serão mortos” conserva a voz passiva.
- source_word: דְּמֵיהֶם בָּם
  choice: o sangue deles recai sobre eles mesmos
  rationale: A expressão atribui aos próprios infratores a responsabilidade jurídica por sua morte. A formulação mantém a imagem do sangue e torna clara a ênfase reflexiva de בָּם.
theological_decisions:
- issue: Tradução de uma proibição jurídica moral e culturalmente controversa
  choice: Manter a descrição concreta do ato e a pena declarada no texto, sem suavização nem comentário doutrinário.
  alternative: Empregar categorias abrangentes como “atos homossexuais” ou terminologia moderna de identidade sexual.
  rationale: O hebraico formula uma lei sobre um ato específico, não define uma categoria moderna de identidade. A tradução não deve tornar a formulação mais ampla nem mais estreita que o texto.
- issue: Distinção entre אִישׁ e זָכָר
  choice: Usar “homem” e “outro homem”, registrando em nota que o segundo termo hebraico significa literalmente “indivíduo do sexo masculino”.
  alternative: Traduzir literalmente por “homem” e “macho”, ou empregar “pessoa” para neutralizar o gênero.
  rationale: A referência masculina do original deve permanecer, mas “macho” aplicado a uma pessoa soa desumanizador no português corrente. A nota preserva a distinção lexical genuína.
- issue: Sentido de דְּמֵיהֶם בָּם
  choice: Conservar a imagem “o sangue deles recai sobre eles mesmos”.
  alternative: Explicitar como “a culpa de sangue deles recai sobre eles”.
  rationale: A expressão pode indicar tanto o sangue decorrente da sentença quanto a responsabilidade por ele. O texto principal preserva a imagem e a tensão jurídica; a nota apresenta a explicitação possível.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A redação evita tanto arcaísmos como “varão” quanto terminologia clínica ou identitária ausente do hebraico. Os marcadores [a] e [b] aparecem no texto principal.
