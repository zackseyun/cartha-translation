source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: pt
  text: Ou, se uma pessoa jurar de modo precipitado com os lábios[b], para fazer o mal ou o bem — seja o que for que um ser humano declare sob juramento[a] —, e isso lhe ficar oculto, e depois ela vier a saber disso, essa pessoa será culpada em um desses casos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seja o que for que o homem declare sob juramento”. “O homem” é aqui uma forma singular representativa de qualquer ser humano.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida como “de modo precipitado com os lábios” também pode ser entendida simplesmente como “pronunciar com os lábios”; o contexto sugere um juramento irrefletido.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: uma pessoa
  rationale: Em formulações legais, o termo designa o indivíduo como um todo, não especificamente a alma imaterial.
- source_word: תִשָּׁבַע
  choice: jurar
  rationale: O verbo no nifal refere-se a prestar ou fazer juramento; “jurar” é conciso e natural em português.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: de modo precipitado com os lábios
  rationale: A expressão denota algo verbalmente proferido; neste contexto jurídico, pode sugerir uma declaração irrefletida. A nota preserva a amplitude lexical.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: para fazer o mal ou o bem
  rationale: Mantém a polaridade ampla do hebraico e não restringe o juramento apenas a prejudicar ou beneficiar outra pessoa.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: seja o que for que um ser humano declare sob juramento
  rationale: Expressa a generalização do caso e verte הָאָדָם como referência representativa à humanidade, sem sugerir que a lei se aplique somente a homens.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: e isso lhe ficar oculto
  rationale: Preserva a construção passiva do hebraico e sua possível referência ao juramento, às implicações dele ou à transgressão decorrente.
- source_word: וְהוּא יָדַע
  choice: mas depois ela vier a sabê-lo
  rationale: Torna clara a sequência entre a falta de percepção e o conhecimento posterior; “mas” explicita o contraste implícito.
- source_word: וְאָשֵׁם לְאַחַת מֵאֵלֶּה
  choice: essa pessoa será culpada em um desses casos
  rationale: Comunica a responsabilidade jurídica resultante e remete aos casos enumerados no contexto imediato.
theological_decisions:
- issue: Referência humana genérica em הָאָדָם
  choice: um ser humano
  alternative: um homem
  rationale: O substantivo hebraico é masculino singular e representativo, mas aqui abrange qualquer pessoa. “Ser humano” preserva esse valor genérico sem limitar indevidamente o alcance da lei; a forma hebraica é esclarecida em nota.
- issue: Natureza do juramento e da culpa
  choice: manter a formulação ampla, sem especificar se a culpa decorre do conteúdo, da quebra ou do esquecimento do juramento
  alternative: explicitar que a pessoa se esqueceu de cumprir o juramento
  rationale: O hebraico afirma que algo lhe ficou oculto e que depois a pessoa soube, mas não define de maneira inequívoca todos os detalhes da infração. A tradução evita resolver essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “essa pessoa” evita ambiguidade de gênero e deixa explícito o sujeito jurídico. O versículo termina com vírgula porque a construção sintática prossegue no versículo seguinte.
