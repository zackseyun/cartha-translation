  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: pt
  text: 'E trará a Yahweh sua oferta de reparação[a]: um carneiro sem defeito[b], tirado do rebanho, conforme a tua avaliação, como oferta pela culpa, ao sacerdote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua oferta pela culpa”. O termo hebraico אָשָׁם pode se referir à culpa ou à reparação e também à oferta específica apresentada por causa dela.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “sem mancha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: sua oferta de reparação
  rationale: אָשָׁם pode designar tanto a culpa ou reparação quanto o sacrifício associado. Neste contexto legal, “oferta de reparação” ressalta a dimensão reparadora sem apagar a relação com a oferta pela culpa.
- source_word: יָבִיא
  choice: levará
  rationale: O imperfeito hifil tem força prescritiva na legislação; o futuro em português comunica de modo digno e natural a obrigação legal.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יְהוָה como nome próprio, em vez de substituí-lo por um título.
- source_word: אַיִל תָּמִים
  choice: um carneiro sem defeito
  rationale: Identifica precisamente o animal e expressa sua integridade exigida para o sacrifício em linguagem portuguesa corrente.
- source_word: מִן הַצֹּאן
  choice: tirado do rebanho
  rationale: צֹאן designa o gado miúdo; como אַיִל já especifica um carneiro, “do rebanho” é suficiente e idiomático.
- source_word: בְּעֶרְכְּךָ
  choice: conforme a sua avaliação
  rationale: Mantém o sentido jurídico de avaliação e preserva o sufixo de segunda pessoa sem identificar além do texto quem faz a avaliação.
- source_word: לְאָשָׁם
  choice: como oferta pela culpa
  rationale: Aqui אָשָׁם caracteriza a categoria ou função sacrificial do carneiro; “oferta pela culpa” conserva a terminologia cultual reconhecível.
- source_word: אֶל הַכֹּהֵן
  choice: ao sacerdote
  rationale: Expressa diretamente o destinatário a quem o animal deve ser apresentado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome da aliança como nome próprio.
- issue: As duas ocorrências de אָשָׁם e sua sobreposição semântica
  choice: 'Primeira ocorrência: “oferta de reparação”; segunda: “oferta pela culpa”'
  alternative: Traduzir ambas como “oferta pela culpa” ou ambas como “oferta de reparação”
  rationale: 'A diferenciação reflete a amplitude lexical do termo: a primeira ocorrência pode realçar a reparação devida, enquanto a segunda funciona como designação do sacrifício. A nota registra a alternativa sem eliminar a ambiguidade.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem retirar o caráter prescritivo nem resolver indevidamente a ambiguidade de אָשָׁם ou do responsável pela avaliação.
