  text: וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה וְ/נִסְלַ֣ח ל֑/וֹ עַל אַחַ֛ת מִ/כֹּ֥ל אֲשֶֽׁר יַעֲשֶׂ֖ה לְ/אַשְׁמָ֥ה בָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: pt
  text: E o sacerdote fará expiação por ele diante de Yahweh, e ele será perdoado por qualquer uma das coisas que alguém fizer e pelas quais incorra em culpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “por uma dentre todas as coisas que fizer, tornando-se culpado por ela”.'
    reason: A construção hebraica final é compacta e admite uma reprodução mais literal, embora menos natural em português.
lexical_decisions:
- source_word: וְכִפֶּר
  choice: fará expiação
  rationale: O piel de כפר, em contexto sacrificial, indica efetuar expiação. A expressão preserva o sentido cúltico sem impor uma teoria específica da expiação.
- source_word: עָלָיו
  choice: por ele
  rationale: Com כפר, a preposição עַל indica a pessoa em favor de quem se realiza a expiação.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução direta do substantivo definido no contexto sacerdotal.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי exprime presença diante de Deus no âmbito do santuário; o nome divino é transliterado como Yahweh.
- source_word: וְנִסְלַח לוֹ
  choice: e ele será perdoado
  rationale: O nifal de סלח apresenta o perdão de modo passivo, deixando Deus como agente implícito, conforme o hebraico.
- source_word: עַל אַחַת מִכֹּל
  choice: por qualquer uma de todas as coisas
  rationale: 'A formulação conserva a força distributiva: uma ocorrência qualquer dentro do conjunto de atos mencionados.'
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: que alguém faça e pelas quais incorra em culpa
  rationale: A tradução comunica naturalmente a relação entre o ato e a culpa, mantendo o valor geral ou modal da forma verbal e sem interpretar אַשְׁמָה como oferta pela culpa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Agente do perdão em וְנִסְלַח לוֹ
  choice: Manter a construção passiva, com Deus como agente implícito
  alternative: Explicitar “Yahweh o perdoará”
  rationale: A passiva preserva a forma e a tensão do texto hebraico, evitando acrescentar um sujeito explícito embora o contexto teológico indique a ação divina.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega vocabulário sacrificial tradicional onde necessário e sintaxe corrente, preservando a generalidade do sujeito e a passiva teológica do original.
