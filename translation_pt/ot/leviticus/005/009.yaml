  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: pt
  text: E aspergirá um pouco do sangue da oferta pelo pecado sobre a lateral do altar[a]; o restante do sangue será espremido na base do altar. É uma oferta pelo pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”, nas duas ocorrências de “oferta pelo pecado”. O termo hebraico חַטָּאת pode designar a oferta pelo pecado, com ênfase em sua função purificadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: aspergirá
  rationale: O hifil de נזה, em contexto sacrificial, descreve a aplicação ritual do sangue por aspersão; “aspergirá” é preciso, corrente no registro bíblico e compreensível.
- source_word: מִדַּם
  choice: um pouco do sangue
  rationale: 'A preposição מִן tem sentido partitivo: apenas uma porção do sangue é aplicada nessa etapa.'
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: No procedimento sacrificial, חַטָּאת designa a oferta relacionada ao pecado. A tradução tradicional e reconhecível é mantida, enquanto a nuance purificadora é registrada em nota.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: sobre a lateral do altar
  rationale: קִיר significa literalmente “parede”, mas “lateral” expressa com naturalidade a superfície vertical do altar sem sugerir uma parede arquitetônica separada.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: o restante do sangue
  rationale: 'Expressa de modo direto e natural o particípio substantivado: aquilo que resta do sangue.'
- source_word: יִמָּצֶה
  choice: será espremido
  rationale: O nifal de מצה indica extrair ou fazer escoar por pressão o sangue restante da ave; “será espremido” preserva esse aspecto mais específico, em vez de sugerir mero derramamento.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: junto à base do altar
  rationale: יְסוֹד designa a base ou fundação; a preposição direcional אֶל é representada naturalmente por “junto à” no contexto do sangue extraído nessa direção.
- source_word: חַטָּאת הוּא
  choice: É uma oferta pelo pecado
  rationale: A oração classifica o sacrifício; a mesma expressão é usada nas duas ocorrências para manter coerência terminológica.
theological_decisions:
- issue: Tradução de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode destacar tanto a relação da oferta com o pecado quanto sua função purificadora. “Oferta pelo pecado” é exato e amplamente reconhecido; a alternativa relevante é preservada em nota para não eliminar a ambiguidade funcional do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial reconhecível. “Aspergirá” mantém a precisão ritual; “lateral do altar” evita a expressão menos natural “parede do altar”. O ponto e vírgula acompanha a progressão das ações, e a frase final preserva a classificação enfática do hebraico.
