revisions:
- from: Se alguém pecar e cometer infidelidade contra Yahweh, enganando o seu próximo a respeito de algo que lhe foi confiado como depósito, ou de algo entregue em suas mãos[a], ou por meio de roubo, ou se explorar o seu próximo,
  to: Se alguém pecar e cometer infidelidade contra Yahweh, enganando o seu próximo a respeito de algo confiado à sua guarda, ou de algo posto em sua mão[a], ou por roubo, ou se explorar o seu próximo,
  rationale: A revisão faz pequenos ajustes de precisão e fluidez. Mantém a ambiguidade lexical de תְּשׂוּמֶת יָד no texto e na nota, conserva o caráter aberto da oração que prossegue no versículo seguinte e não altera o sentido jurídico-teológico do enunciado.
