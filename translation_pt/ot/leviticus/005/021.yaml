id: LEV.5.21
reference: Leviticus 5:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: pt
  text: Se alguém pecar e cometer infidelidade contra Yahweh, enganando o seu próximo a respeito de algo confiado à sua guarda, ou de algo posto em sua mão[a], ou por roubo, ou se explorar o seu próximo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “algo dado em garantia”; literalmente, “algo posto em sua mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: alguém
  rationale: No contexto jurídico, designa uma pessoa individual; “alguém” introduz com naturalidade o caso legal em português.
- source_word: כִּי תֶחֱטָא
  choice: Se alguém pecar
  rationale: כִּי com o imperfeito introduz aqui uma condição casuística; “se” corresponde ao estilo jurídico da passagem.
- source_word: וּמָעֲלָה מַעַל
  choice: e cometer infidelidade
  rationale: A construção cognata expressa ação desleal ou traiçoeira. “Cometer infidelidade” preserva seu peso relacional e religioso sem recorrer ao arcaísmo “prevaricar”.
- source_word: בַּיהוָה
  choice: contra Yahweh
  rationale: A preposição apresenta a deslealdade praticada contra Yahweh, embora o dano imediato recaia sobre o próximo.
- source_word: וְכִחֵשׁ
  choice: enganando
  rationale: O verbo pode indicar negar falsamente, mentir ou agir com falsidade; “enganando” funciona no conjunto das transações enumeradas sem restringir o ato à fala.
- source_word: בַּעֲמִיתוֹ
  choice: o seu próximo
  rationale: עָמִית designa outro membro da comunidade; “próximo” é claro, corrente e apropriado ao contexto social e jurídico.
- source_word: בְּפִקָּדוֹן
  choice: a respeito de algo que lhe foi confiado como depósito
  rationale: O substantivo indica um bem confiado à guarda de alguém. A formulação esclarece o sentido jurídico sem pressupor depósito bancário.
- source_word: בִתְשׂוּמֶת יָד
  choice: algo entregue em suas mãos
  rationale: A expressão, literalmente relacionada a algo posto na mão, é lexicalmente incerta e pode indicar um bem entregue, confiado ou dado em garantia. A tradução mantém a imagem básica e deixa a alternativa em nota.
- source_word: בְגָזֵל
  choice: por meio de roubo
  rationale: O substantivo se refere ao roubo ou ao que foi tomado pela força; a formulação preserva a relação instrumental expressa pela preposição.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: se explorar o seu próximo
  rationale: O verbo abrange opressão econômica, extorsão, retenção indevida e exploração. “Explorar” comunica bem esse campo no contexto de delitos patrimoniais.
theological_decisions:
- issue: Expressar que uma falta social e econômica também constitui pecado contra Deus
  choice: cometer infidelidade contra Yahweh
  alternative: agir de modo infiel para com Yahweh
  rationale: O hebraico enquadra explicitamente o engano contra o próximo como infidelidade contra Yahweh; a tradução mantém essa dimensão vertical sem explicá-la além do texto.
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração “Yahweh” representa diretamente o nome divino e segue a camada inglesa auditada fornecida.
- issue: Amplitude de עָשַׁק
  choice: explorar
  alternative: oprimir; extorquir; defraudar
  rationale: No contexto econômico, “explorar” retém a noção ampla de obter vantagem injusta ou reter o que é devido, sem limitar o verbo a uma única modalidade jurídica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a estrutura de uma oração condicional que prossegue nos versículos seguintes. A nota preserva a incerteza de תְשׂוּמֶת יָד.
