review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura condicional, a caracterização do delito como infidelidade contra Yahweh e as quatro categorias patrimoniais. Contudo, «algo que lhe foi confiado como depósito» é mais explicativo do que necessário e «em suas mãos» se afasta da imagem singular da expressão hebraica. A revisão aproxima a formulação do texto sem tornar a expressão disputada excessivamente específica.
  naturalness: O texto é claro e de registro jurídico apropriado. «Por roubo» é mais conciso e idiomático que «por meio de roubo» nesta série; «confiado à sua guarda» evita a formulação um tanto pesada «confiado como depósito».
  terminology: «Yahweh», «infidelidade», «próximo» e «explorar» são escolhas aceitáveis e coerentes com o hebraico. «Algo posto em sua mão» mantém a formulação deliberadamente ampla de בִתְשׂוּמֶת יָד; a nota conserva a alternativa interpretativa «algo dado em garantia».
  issues:
  - severity: low
    issue: Formulação do depósito e da expressão «posto na mão»
    rationale: «Algo que lhe foi confiado como depósito» introduz uma explicação adicional; «algo confiado à sua guarda» exprime diretamente o sentido de פִּקָּדוֹן. Para תְּשׂוּמֶת יָד, o singular «em sua mão» preserva melhor a imagem hebraica do que «em suas mãos».
  - severity: low
    issue: Construção «por meio de roubo»
    rationale: «Por roubo» é a forma mais natural e econômica em português para o membro da enumeração, sem mudança de sentido.
  revised_text: Se alguém pecar e cometer infidelidade contra Yahweh, enganando o seu próximo a respeito de algo confiado à sua guarda, ou de algo posto em sua mão[a], ou por roubo, ou se explorar o seu próximo,
  revised_footnotes:
