base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: pt
  text: E acontecerá que, quando ele pecar e incorrer em culpa[a], restituirá aquilo que roubou, ou aquilo de que se apoderou por opressão[b], ou o bem que lhe foi confiado, ou o bem perdido que encontrou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se ele pecar e se tornar culpado”. A fórmula jurídica hebraica pode ser entendida como “quando” ou “se”; a expressão também pode ser traduzida por “tornar-se culpado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aquilo que obteve por opressão” ou “aquilo de que se apropriou por fraude”. O termo hebraico pode indicar apropriação ou retenção abusiva dos bens de outra pessoa.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a coisa perdida que encontrou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Preserva a fórmula jurídica casuística hebraica e verte כִּי naturalmente como “quando”, sem ocultar que “se” também é possível.
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: ele pecar e se tornar culpado
  rationale: Mantém tanto a dimensão moral de חטא quanto a condição de culpa ou responsabilidade expressa por אשם, sem reduzi-la à mera percepção subjetiva.
- source_word: וְהֵשִׁיב
  choice: restituirá
  rationale: No contexto jurídico, “restituir” comunica com precisão a obrigação de devolver o bem; o futuro assume força prescritiva na formulação legal.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: aquilo que roubou
  rationale: Expressa de modo natural o objeto tomado ilicitamente, evitando em português a repetição cognata pouco idiomática do hebraico.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: aquilo de que se apoderou por opressão
  rationale: O par cognato pode envolver obtenção, retenção ou apropriação mediante opressão ou fraude. A formulação conserva a ideia ampla de abuso no âmbito patrimonial.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: o bem que lhe foi confiado
  rationale: Refere-se a propriedade entregue à guarda da pessoa. “Bem” é claro e abrangente, e “confiado” explicita a relação de custódia.
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: a coisa perdida que encontrou
  rationale: Segue de perto a expressão hebraica sem pressupor além do texto o tipo específico de propriedade perdida.
theological_decisions:
- issue: Valor condicional ou temporal da fórmula כִּי e sentido de וְאָשֵׁם
  choice: quando ele pecar e se tornar culpado
  alternative: se ele pecar e incorrer em culpa
  rationale: A leitura escolhida funciona naturalmente numa lei casuística, enquanto a nota preserva a possibilidade condicional e a alternativa jurídica “incorrer em culpa”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura enumerativa e o tom jurídico do hebraico foram preservados, mas repetições cognatas pouco naturais foram evitadas. Todos os marcadores aparecem junto às expressões pertinentes no texto.
