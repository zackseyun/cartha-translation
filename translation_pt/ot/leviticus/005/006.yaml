  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: pt
  text: 'e levará a Yahweh sua oferta pela culpa[a], por causa do pecado que cometeu: uma fêmea do rebanho, uma cordeira ou uma cabra, como oferta pelo pecado; e o sacerdote fará expiação por ele, por causa do seu pecado[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “sua oferta de reparação” ou “sua oferta por causa da culpa”. O hebraico usa aqui אשם, termo associado à culpa e à reparação, embora depois especifique o animal como “oferta pelo pecado”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “do seu pecado”. A expressão pode destacar que a expiação resulta em livramento ou remoção do pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: e levará
  rationale: No contexto legal, a forma verbal tem força prescritiva. O futuro simples é natural em português bíblico e normativo.
- source_word: אֲשָׁמוֹ
  choice: sua oferta pela culpa
  rationale: Preserva a associação de אשם com culpa e reparação sem identificá-la de modo rígido com uma categoria sacrificial diferente daquela especificada adiante.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: por causa do pecado que cometeu
  rationale: Expressa naturalmente a base ou ocasião da oferta e mantém a referência explícita ao pecado.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: uma fêmea do rebanho
  rationale: Mantém tanto a indicação explícita do sexo quanto a categoria de pequenos animais domésticos.
- source_word: כִשְׂבָּה
  choice: uma cordeira
  rationale: O termo designa uma ovelha jovem do sexo feminino; 'cordeira' preserva essa informação de forma concisa.
- source_word: אוֹ שְׂעִירַת עִזִּים
  choice: ou uma cabra
  rationale: A forma hebraica especifica uma fêmea caprina; 'cabra' comunica isso naturalmente em português.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: Em contexto sacrificial, חטאת designa a oferta pelo pecado ou de purificação; 'como' expressa a função atribuída ao animal.
- source_word: וְכִפֶּר עָלָיו
  choice: e o sacerdote fará expiação por ele
  rationale: Preserva o sentido cultual de כפר sem impor uma teoria posterior específica da expiação.
- source_word: מֵחַטָּאתוֹ
  choice: por causa do seu pecado
  rationale: A preposição מן pode relacionar a expiação à ofensa e também sugerir libertação dela; a formulação principal é idiomática, e a nuance mais literal é indicada em nota.
theological_decisions:
- issue: Emprego conjunto de אשם e חטאת
  choice: Manter 'oferta pela culpa' para אשם e 'oferta pelo pecado' para חטאת no mesmo versículo.
  alternative: Uniformizar os dois termos ou traduzir חטאת como 'oferta de purificação'.
  rationale: O hebraico justapõe deliberadamente os termos. Preservar a distinção evita apagar uma tensão real da terminologia sacrificial.
- issue: Sentido de כפר
  choice: fará expiação
  alternative: fará purificação ou obterá perdão
  rationale: A expressão cultual ampla preserva a linguagem sacerdotal sem reduzir o termo a uma única explicação teológica.
- issue: Nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração representa o nome próprio presente no texto hebraico e segue a camada de consulta fornecida.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. Mantém a terminologia sacrificial distinta do hebraico e evita arcaísmos como 'fêmea das cabras'.
