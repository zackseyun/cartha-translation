id: LEV.5.2
reference: Leviticus 5:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: pt
  text: Ou, se uma pessoa tocar em qualquer coisa impura — seja no cadáver de um animal selvagem impuro, no cadáver de um animal doméstico impuro ou no cadáver de uma criatura rastejante impura — e não se der conta disso[a], ela ficará impura e será culpada[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e isso lhe ficar oculto”; isto é, a pessoa não percebe que teve esse contato.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, ela incorre em responsabilidade no âmbito das leis de pureza. O texto não equipara necessariamente o simples contato involuntário com um cadáver a uma maldade moral deliberada.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: uma pessoa
  rationale: Em textos legais, o termo designa o indivíduo inteiro, não especificamente a parte imaterial chamada “alma”. “Uma pessoa” comunica com naturalidade o alcance geral da norma.
- source_word: תִּגַּע בְּ
  choice: tocar em
  rationale: O verbo com a preposição indica contato físico. “Tocar em” é direto, natural e preciso neste contexto.
- source_word: כָל דָּבָר טָמֵא
  choice: qualquer coisa impura
  rationale: A expressão é ampla e introduz os casos especificados em seguida. “Impura” mantém a categoria levítica sem sugerir necessariamente maldade moral.
- source_word: נִבְלַת
  choice: no cadáver de
  rationale: No contexto das leis de pureza, o substantivo se refere ao corpo morto de um animal. “Cadáver” é claro e aplica-se naturalmente às três categorias mencionadas.
- source_word: חַיָּה טְמֵאָה
  choice: um animal selvagem impuro
  rationale: חַיָּה contrasta aqui com בְּהֵמָה e aponta para animais terrestres não domesticados. “Animal selvagem” preserva essa distinção.
- source_word: בְּהֵמָה טְמֵאָה
  choice: um animal doméstico impuro
  rationale: O termo designa aqui quadrúpedes domesticados. “Animal doméstico” é mais abrangente e internacionalmente inteligível do que “gado”.
- source_word: שֶׁרֶץ טָמֵא
  choice: uma criatura rastejante impura
  rationale: שֶׁרֶץ abrange pequenos seres que se movem em grande número, rastejam ou fervilham. “Criatura rastejante” oferece uma categoria compreensível sem restringi-la indevidamente a répteis.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: e não se der conta disso
  rationale: A forma passiva expressa literalmente que o fato ficou oculto à pessoa, isto é, que ela não o percebeu. A formulação escolhida transmite esse sentido em português corrente; a imagem literal é preservada em nota.
- source_word: וְהוּא טָמֵא
  choice: ela ficará impura
  rationale: A oração declara o estado ritual resultante. O futuro contextual é natural em português para a sequência de uma norma casuística, e “ela” concorda gramaticalmente com “pessoa”.
- source_word: וְאָשֵׁם
  choice: e será culpada
  rationale: אָשֵׁם indica culpa ou responsabilidade contraída no âmbito legal e cultual. “Será culpada” mantém a progressão da norma sem definir além do texto a natureza exata dessa culpa.
theological_decisions:
- issue: Natureza da impureza
  choice: Traduzir טָמֵא/טְמֵאָה por “impuro/impura”.
  alternative: “contaminado”, “profanado” ou “pecaminoso”
  rationale: O versículo trata do estado ritual causado pelo contato com cadáveres. “Impuro” preserva a categoria levítica e evita equipará-la automaticamente à maldade moral.
- issue: Natureza da culpa
  choice: Manter “será culpada” no texto e esclarecer em nota a responsabilidade cultual envolvida.
  alternative: Traduzir diretamente por “incorrerá em responsabilidade ritual”
  rationale: O hebraico afirma culpa ou responsabilidade sem explicá-la aqui. A tradução conserva a força da afirmação, enquanto a nota impede que o leitor confunda sem ressalvas impureza ritual com pecado moral deliberado.
- issue: Referência genérica e gênero gramatical
  choice: Usar “uma pessoa” e, depois, formas femininas em concordância gramatical.
  alternative: Usar “alguém” e repetir o substantivo, ou empregar formas masculinas genéricas
  rationale: נֶפֶשׁ designa qualquer indivíduo. Em português, “pessoa” é gramaticalmente feminino independentemente do sexo do referente; a concordância feminina é natural e não altera o alcance universal da lei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura casuística foi preservada, inclusive a vírgula final que indica continuação da frase no versículo seguinte. Os travessões organizam a enumeração sem enfraquecer a formulação legal.
