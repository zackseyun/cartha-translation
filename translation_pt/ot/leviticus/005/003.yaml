id: LEV.5.3
reference: Leviticus 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: pt
  text: Ou, se alguém tocar em impureza humana[a] — qualquer impureza pela qual se torne impuro —, sem perceber isso[b], e depois vier a sabê-lo, será culpado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “impureza proveniente de uma pessoa”. Neste contexto legal, o termo hebraico se refere à impureza ritual.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e isso lhe estiver oculto”; isto é, a pessoa não percebeu o fato naquele momento.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: tocar em
  rationale: A construção נגע com ב indica contato físico; “tocar em” é direta e natural em português.
- source_word: טֻמְאַת אָדָם
  choice: impureza humana
  rationale: טֻמְאָה designa impureza ritual neste contexto legal, e אָדָם indica aqui uma fonte humana de impureza, sem referência exclusiva ao sexo masculino.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: qualquer impureza
  rationale: A expressão amplia a categoria para todo tipo de impureza ligada à fonte humana; a formulação evita reproduzir de modo artificial o sufixo pronominal hebraico.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: pela qual se torne impuro
  rationale: A oração relativa explica o efeito dessa impureza. A construção com sujeito indeterminado preserva o valor genérico e é idiomática em português.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: sem perceber isso
  rationale: Expressa naturalmente que o fato escapou ao conhecimento da pessoa naquele momento; a nota preserva a forma passiva mais literal do hebraico.
- source_word: וְהוּא יָדַע
  choice: e depois vier a sabê-lo
  rationale: O contexto indica conhecimento posterior à falta de percepção inicial; “depois” torna clara essa sequência sem alterar o sentido.
- source_word: וְאָשֵׁם
  choice: será culpado
  rationale: No contexto legal e sacrificial, אשם indica culpa ou responsabilidade contraída; “será culpado” conserva a força judicial da expressão.
theological_decisions:
- issue: Natureza de טֻמְאָה na legislação levítica
  choice: impureza
  alternative: pecaminosidade
  rationale: O versículo trata de impureza ritual decorrente de contato, não necessariamente de mal moral em si; “impureza” preserva a categoria cultual e legal.
- issue: Sentido genérico de אָדָם
  choice: humana
  alternative: do homem
  rationale: אָדָם é genérico neste contexto e descreve a origem humana da impureza, não especificamente um indivíduo do sexo masculino.
- issue: Relação entre desconhecimento e culpa
  choice: preservar tanto a falta inicial de percepção quanto a declaração posterior de culpa
  alternative: explicar que só há culpa depois da tomada de consciência
  rationale: O hebraico apresenta a sequência sem definir explicitamente em que momento a culpa é contraída; a tradução não resolve essa tensão jurídica e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade no Brasil. O singular genérico hebraico foi vertido por “alguém” e por construções de sujeito indeterminado, sem restringir o referente ao sexo masculino. Os travessões mantêm a explicação parentética do texto.
