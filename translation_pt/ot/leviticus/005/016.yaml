base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: pt
  text: Fará restituição pelo dano causado às coisas sagradas[a], acrescentará um quinto a ela e a entregará ao sacerdote. Então o sacerdote fará expiação por ele com o carneiro da oferta pela culpa[b], e ele será perdoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo que reteve indevidamente das coisas sagradas”. O hebraico se refere à restituição por uma transgressão que envolveu algo santo ou sagrado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com o carneiro para uma oferta pela culpa”; também se pode traduzir por “oferta de reparação”.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: pelo dano causado às coisas sagradas
  rationale: A construção hebraica é compacta e incomum, referindo-se a uma transgressão que envolveu bens ou contribuições sagradas. A formulação preserva a amplitude do texto sem inserir explicitamente “santuário” nem limitar o ato a roubo deliberado.
- source_word: יְשַׁלֵּם
  choice: fará restituição
  rationale: No contexto jurídico e sacrificial, o Piel de שלם indica ressarcimento ou devolução do valor devido, não um pagamento genérico.
- source_word: חֲמִישִׁתוֹ יוֹסֵף עָלָיו
  choice: acrescentará um quinto ao valor
  rationale: Expressa de modo natural a sobretaxa de um quinto acrescentada ao valor principal, sem modernizá-la para uma porcentagem.
- source_word: וְנָתַן אֹתוֹ לַכֹּהֵן
  choice: e entregará o total ao sacerdote
  rationale: O objeto singular retoma a quantia composta pela restituição e pelo quinto acrescentado. “O total” evita a impressão de que somente o quinto seria entregue.
- source_word: יְכַפֵּר עָלָיו
  choice: fará expiação por ele
  rationale: “Fazer expiação” é uma expressão corrente e acessível para כפר em contexto sacrificial.
- source_word: בְּאֵיל הָאָשָׁם
  choice: com o carneiro da oferta pela culpa
  rationale: Mantém a relação entre o carneiro e o sacrifício designado por אָשָׁם, usando uma denominação reconhecível em português.
- source_word: וְנִסְלַח לוֹ
  choice: e ele será perdoado
  rationale: Reproduz naturalmente a forma passiva hebraica e deixa implícito, como no texto, quem concede o perdão.
theological_decisions:
- issue: Sentido sacrificial de אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: O termo reúne as ideias de culpa e reparação. “Oferta pela culpa” mantém uma designação sacrificial amplamente reconhecível, enquanto a nota registra a ênfase reparatória possível.
- issue: Natureza da transgressão contra o que é sagrado
  choice: dano causado às coisas sagradas
  alternative: o que reteve indevidamente das coisas sagradas
  rationale: O hebraico aponta para uma falta envolvendo algo sagrado, mas não explicita aqui se houve retirada, retenção ou outra forma de prejuízo. A tradução principal não resolve essa ambiguidade de maneira indevida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe jurídica clara. “Coisas sagradas” conserva o alcance do hebraico; “o total” esclarece que a restituição e o acréscimo são entregues juntos. Todos os marcadores de nota aparecem no texto principal.
