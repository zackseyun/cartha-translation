revisions:
- from: ou se achar algo perdido, mentir a respeito e jurar falsamente — em qualquer dessas coisas que alguém possa fazer, pecando assim —
  to: ou achar algo perdido, mentir a respeito dele e jurar falsamente — em qualquer uma das coisas que alguém possa fazer para pecar por meio delas —
  rationale: A revisão conserva a frase incompleta, ligada ao contexto dos versículos adjacentes, e mantém as escolhas naturais do rascunho. Ela restaura explicitamente a ligação plural entre os atos e o pecado (“por meio delas”) e representa mais de perto a abrangência de “qualquer uma de todas as coisas”.
