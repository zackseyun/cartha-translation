base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: pt
  text: ou achar algo perdido, mentir a respeito dele e jurar falsamente — em qualquer uma das coisas que alguém possa fazer para pecar por meio delas —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: algo perdido
  rationale: Expressa de modo natural um objeto ou bem perdido, sem restringir indevidamente o referente.
- source_word: וְכִחֶשׁ בָּהּ
  choice: mentir a respeito
  rationale: Reproduz a ideia de negar ou agir falsamente quanto ao bem encontrado; o contexto imediato esclarece a fraude.
- source_word: הָאָדָם
  choice: alguém
  rationale: Neste enunciado geral, o hebraico se refere ao ser humano de modo genérico; “alguém” é natural e inclusivo em português.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: pecando assim
  rationale: Comunica idiomaticamente que tais atos constituem o meio ou âmbito em que a pessoa peca.
theological_decisions:
- issue: Caráter geral de הָאָדָם
  choice: alguém
  alternative: um homem
  rationale: O contexto formula uma regra aplicável a qualquer pessoa; não há aqui razão contextual ou teológica para limitar o referente ao sexo masculino.
- issue: Relação sintática da cláusula final
  choice: em qualquer dessas coisas que alguém possa fazer, pecando assim
  alternative: em qualquer uma de todas as coisas que o homem faz para pecar por meio delas
  rationale: Mantém a abrangência e a ligação entre os atos e o pecado, evitando uma formulação artificial em português sem resolver além do necessário a sintaxe hebraica.
translation_notes:
  register: Português atual, claro e digno, com continuidade sintática marcada por travessões porque o versículo integra uma frase iniciada anteriormente e concluída no versículo seguinte.
