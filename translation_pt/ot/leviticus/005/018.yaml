id: LEV.5.18
reference: Leviticus 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: pt
  text: Ele levará ao sacerdote um carneiro sem defeito, tirado do rebanho, conforme a sua avaliação, como oferta pela culpa[a]. O sacerdote fará expiação por ele quanto ao erro que cometeu sem intenção e do qual não tinha conhecimento[b], e ele será perdoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como oferta de reparação”. O hebraico אָשָׁם designa uma categoria sacrificial específica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quanto ao seu pecado involuntário”. O hebraico enfatiza um erro ou uma infração cometida inadvertidamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Ele levará
  rationale: No contexto de instrução legal, a forma verbal tem força prescritiva. O futuro do indicativo comunica essa obrigação com naturalidade em português.
- source_word: אַיִל תָּמִים
  choice: um carneiro sem defeito
  rationale: אַיִל designa um carneiro adulto, e תָּמִים, no contexto sacrificial, indica ausência de defeito físico.
- source_word: מִן הַצֹּאן
  choice: tirado do rebanho
  rationale: צֹאן é um termo coletivo para animais de pequeno porte, sobretudo ovelhas e cabras; como אַיִל já especifica um carneiro, “do rebanho” é claro e natural.
- source_word: בְּעֶרְכְּךָ
  choice: conforme a sua avaliação
  rationale: Preserva a referência à avaliação exigida no procedimento sem definir além do texto quem a realiza.
- source_word: לְאָשָׁם
  choice: como oferta pela culpa
  rationale: אָשָׁם nomeia uma categoria sacrificial específica. “Oferta pela culpa” é reconhecível e mantém a ligação lexical com culpa, enquanto a nota registra a alternativa reparatória.
- source_word: וְכִפֶּר עָלָיו
  choice: O sacerdote fará expiação por ele
  rationale: “Fazer expiação” conserva o peso cultual de כפר e expressa naturalmente que o sacerdote age em favor da pessoa.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: quanto ao erro que cometeu sem intenção
  rationale: A formulação mantém a ideia de erro ou infração inadvertida e reproduz, sem rigidez, a relação entre o substantivo שְׁגָגָה e o verbo cognato שָׁגַג.
- source_word: וְהוּא לֹא יָדַע
  choice: e do qual não tinha conhecimento
  rationale: Liga naturalmente a falta de conhecimento ao erro, preservando a explicação hebraica de que a infração foi inadvertida.
- source_word: וְנִסְלַח לוֹ
  choice: e ele será perdoado
  rationale: O passivo preserva o chamado passivo divino do hebraico sem especificar explicitamente o agente do perdão.
theological_decisions:
- issue: Sentido sacrificial de אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: O termo designa uma oferta definida no sistema levítico e pode destacar tanto a culpa quanto a reparação associada. O texto principal usa a forma mais reconhecível, e a nota preserva a alternativa lexical sem impor uma interpretação doutrinária.
- issue: Sentido cultual de כפר
  choice: fará expiação
  alternative: realizará expiação em favor dele
  rationale: A escolha mantém a linguagem teológica e ritual do texto, sem reduzir o verbo apenas a perdão nem especificar uma teoria de expiação.
- issue: Agente implícito do perdão
  choice: ele será perdoado
  alternative: o perdão lhe será concedido
  rationale: A forma passiva acompanha o hebraico e evita explicitar o agente onde o versículo não o nomeia, embora o contexto pressuponha a ação divina.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Mantiveram-se os termos cultuais “oferta pela culpa” e “expiação”, explicados apenas onde há alternativa lexical relevante. A construção evita linguagem arcaica e não resolve além do hebraico a identidade de quem faz a avaliação nem o agente gramaticalmente implícito do perdão.
