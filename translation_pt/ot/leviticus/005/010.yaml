id: LEV.5.10
reference: Leviticus 5:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: pt
  text: E preparará a segunda ave como holocausto, conforme o procedimento prescrito[a], e o sacerdote fará expiação por ele, por causa do pecado que cometeu, e ele será perdoado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «conforme a norma estabelecida».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «isso lhe será perdoado»; a fórmula passiva deixa implícito quem concede o perdão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: a segunda ave
  rationale: O ordinal retoma a segunda das duas aves do contexto anterior. A explicitação de «ave» evita ambiguidade em português sem acrescentar um referente novo.
- source_word: יַעֲשֶׂה
  choice: preparará
  rationale: O verbo עשה é amplo, «fazer», e aqui descreve a execução ritual. «Preparará» é natural no contexto sacrificial e evita especificar mais do que o hebraico.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo tradicional e amplamente reconhecido em português bíblico para a oferta inteiramente queimada, embora não reproduza diretamente a imagem etimológica de algo que sobe.
- source_word: כַּמִּשְׁפָּט
  choice: conforme o procedimento prescrito
  rationale: Neste contexto, מִשְׁפָּט indica a norma ou forma estabelecida para realizar o sacrifício; a formulação comunica com clareza seu sentido ritual-procedimental.
- source_word: וְכִפֶּר עָלָיו
  choice: o sacerdote fará expiação por ele
  rationale: Preserva a linguagem cultual característica de כפר e traduz עָלָיו de modo idiomático, sem impor uma teoria posterior da expiação.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: por causa do pecado que cometeu
  rationale: Expressa naturalmente o pecado em vista como motivo da expiação, evitando a reprodução pouco idiomática «do seu pecado que pecou».
- source_word: וְנִסְלַח לוֹ
  choice: e ele será perdoado
  rationale: Mantém a construção passiva e deixa implícito o agente divino, como no hebraico.
theological_decisions:
- issue: Linguagem sacerdotal de expiação sem precisão doutrinária importada
  choice: fará expiação por ele
  alternative: o purificará; obterá perdão para ele
  rationale: «Fará expiação» conserva a categoria ritual e teológica de כפר sem reduzi-la apenas à purificação nem explicá-la por um modelo doutrinário posterior.
- issue: Preservação da fórmula passiva de perdão
  choice: ele será perdoado
  alternative: o SENHOR o perdoará; isso lhe será perdoado
  rationale: A formulação mantém o agente divino reverentemente implícito, em vez de inserir na oração um sujeito que o texto hebraico não nomeia.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Holocausto» conserva a terminologia bíblica corrente; «procedimento prescrito» esclarece o sentido ritual de מִשְׁפָּט. A repetição de «ele» no encerramento preserva a passiva do original sem nomear explicitamente o agente divino.
