  text: 'E Yahweh falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O waw consecutivo introduz um novo ato narrativo de fala. “Falou” é a forma natural e digna da fórmula recorrente de comunicação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; “a” é a forma portuguesa natural na construção “falar a alguém”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo da fala que vem a seguir; “dizendo” preserva a fórmula hebraica e a ligação com o versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título; “Jeová” reflete uma vocalização tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com formulação narrativa natural. Mantém-se “dizendo” para refletir a fórmula hebraica que introduz a fala subsequente.
