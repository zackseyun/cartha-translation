lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, com a forma narrativa, introduz uma nova unidade de discurso; “falou” é a fórmula natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Marca o destinatário da fala e corresponde naturalmente à regência portuguesa de “falar a alguém” nesta fórmula.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o conteúdo da fala, o qual continua no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino. “Yahweh” preserva sua função como nome próprio e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com a fórmula narrativa bíblica preservada sem arcaísmos desnecessários.
