base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: pt
  text: ou qualquer coisa a respeito da qual tenha jurado falsamente — fará restituição integral e acrescentará um quinto a ela. Entregará a restituição àquele a quem pertence, no dia de sua oferta pela culpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «no dia de sua culpa». O termo hebraico pode referir-se à culpa ou à oferta pela culpa; no contexto sacrificial, o texto principal segue a segunda possibilidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּל אֲשֶׁר
  choice: ou qualquer coisa a respeito da qual
  rationale: Dá continuidade à lista legal do versículo anterior e preserva o alcance amplo da expressão hebraica em português natural.
- source_word: יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  choice: tenha jurado falsamente
  rationale: Expressa de modo conciso o juramento falso referente à coisa mencionada, sem repetir desnecessariamente o complemento.
- source_word: וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ
  choice: fará restituição do valor integral
  rationale: O idiomatismo hebraico, literalmente relacionado ao 'principal', exige a devolução integral do bem ou de seu valor original.
- source_word: וַחֲמִשִׁתָיו יֹסֵף עָלָיו
  choice: e acrescentará a quinta parte
  rationale: Reproduz a fórmula legal de acréscimo de um quinto, isto é, vinte por cento.
- source_word: לַאֲשֶׁר הוּא לוֹ יִתְּנֶנּוּ
  choice: Entregará tudo àquele a quem pertence
  rationale: Comunica a entrega da restituição completa, incluindo o acréscimo, ao legítimo proprietário.
- source_word: בְּיוֹם אַשְׁמָתוֹ
  choice: no dia em que reparar sua culpa
  rationale: Preserva a ligação lexical entre culpa e reparação sem decidir de forma excessivamente estreita entre o estado de culpa e a oferta de reparação.
theological_decisions:
- issue: Sentido de אַשְׁמָתוֹ no contexto legal-sacrificial
  choice: no dia em que reparar sua culpa
  alternative: no dia da sua oferta pela culpa; no dia da sua culpa
  rationale: O termo pode apontar para a culpa, para a reparação devida ou para a oferta associada. A tradução principal mantém essa tensão e se ajusta ao ato de restituição; a nota registra as leituras mais literais e cultuais.
translation_notes:
  register: Português moderno, claro e digno, com terminologia jurídica acessível. A expressão “oferta pela culpa” fica na nota para preservar a ambiguidade do hebraico, enquanto o texto principal evita impor uma única interpretação cultual.
