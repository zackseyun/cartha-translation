base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: pt
  text: 'Mas, se os seus recursos não forem suficientes para uma ovelha, levará a Yahweh, como sua oferta pela culpa, pelo pecado que cometeu, duas rolas ou dois pombinhos: um como oferta pelo pecado[a] e o outro como holocausto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O hebraico חַטָּאת pode designar tanto o pecado como a oferta relacionada à remoção ritual do pecado ou da impureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: os seus recursos não forem suficientes para uma ovelha
  rationale: A expressão idiomática fala literalmente de a mão não alcançar o bastante; a formulação escolhida comunica a incapacidade econômica sem recorrer a uma tradução excessivamente literal.
- source_word: אֲשָׁמוֹ אֲשֶׁר חָטָא
  choice: como oferta pela culpa do pecado que cometeu
  rationale: Neste contexto, אָשָׁם designa aquilo que a pessoa leva por causa de sua culpa. A formulação preserva a linguagem sacrificial e liga explicitamente a oferta ao pecado cometido, sem confundi-la por completo com uma categoria técnica distinta.
- source_word: שְׁתֵּי תֹרִים
  choice: duas rolas
  rationale: “Rolas” é a designação portuguesa corrente das aves תֹרִים usadas nos sacrifícios.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: dois pombinhos
  rationale: A expressão hebraica significa literalmente “filhotes de pomba”; “pombinhos” expressa de modo natural que se trata de aves jovens.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, distinguindo-o de títulos como “Senhor”.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת nomeia a oferta relacionada ao pecado; a tradução tradicional é clara, enquanto a alternativa funcional “oferta de purificação” é preservada em nota.
- source_word: לְעֹלָה
  choice: como holocausto
  rationale: “Holocausto” é o termo português tradicional e reconhecível para o sacrifício inteiramente queimado designado por עֹלָה.
theological_decisions:
- issue: Sentido sacrificial de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O contexto legal e a associação com עֹלָה favorecem no texto principal a designação tradicional “oferta pelo pecado”. A nota mantém a alternativa “oferta de purificação”, que ressalta a função ritual do sacrifício sem eliminar a ambiguidade lexical.
- issue: Sentido de אָשָׁם neste versículo
  choice: oferta pela culpa
  alternative: reparação devida
  rationale: O substantivo pode indicar culpa, reparação ou a oferta correspondente. A tradução mantém a relação explícita com a culpa, mas evita afirmar que as aves constituem necessariamente a oferta técnica pela culpa descrita em outras passagens.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. Emprega “rolas”, “pombinhos” e “holocausto” por serem termos correntes no vocabulário bíblico português; mantém “Yahweh” como nome próprio divino.
