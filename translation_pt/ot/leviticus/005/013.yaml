review_pass:
  verdict: revise
  source_fidelity: A primeira oração traduz com precisão כִּפֶּר עָלָיו, a referência ao pecado cometido em um dos casos e a fórmula passiva de perdão. Na oração final, porém, “Essa oferta” pode sugerir que a oferta inteira passa ao sacerdote. No contexto imediato, o sacerdote já queimou uma porção memorial (5:12); o que lhe cabe é o restante, à maneira da oferta de cereais.
  naturalness: O texto é claro, moderno e adequado ao registro ritual. “O restante será do sacerdote” torna explícito, de modo natural e contextual, o referente da forma feminina hebraica sem criar ambiguidade em português.
  terminology: “Fará expiação”, “pecado”, “sacerdote” e “oferta de cereais” são escolhas adequadas e consistentes para o contexto levítico. A nota preserva corretamente a possibilidade formal de entender o perdão com “isso” como referente, sem identificar o agente do perdão.
  issues:
