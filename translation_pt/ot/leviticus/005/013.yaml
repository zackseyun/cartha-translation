    issue: “Essa oferta pertencerá ao sacerdote” pode ser entendida como a atribuição da oferta inteira ao sacerdote.
    rationale: A legislação precedente determina que uma porção seja queimada como memorial. A cláusula final regula a porção restante, em paralelo com a oferta de cereais. “O restante” comunica a referência contextual e evita uma implicação material incorreta.
