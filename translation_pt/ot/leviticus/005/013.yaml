  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: pt
  text: Assim, o sacerdote fará expiação por ele, pelo pecado que cometeu em qualquer um desses casos, e ele será perdoado.[a] O restante será do sacerdote, como na oferta de cereais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e isso lhe será perdoado”. O hebraico emprega uma forma passiva e não identifica explicitamente quem perdoa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: fará expiação por ele
  rationale: No contexto ritual sacerdotal, כפר com עַל indica a realização de expiação em favor do transgressor. “Fará expiação por ele” é claro, consagrado e não impõe uma teoria específica da expiação.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: pelo pecado que cometeu
  rationale: Embora חַטָּאת possa designar tanto o pecado quanto a oferta pelo pecado, a oração “que cometeu” aponta aqui para a transgressão. A formulação é idiomática em português.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: em qualquer um desses casos
  rationale: A expressão partitiva remete às situações enumeradas anteriormente. “Casos” comunica essa referência com naturalidade e precisão.
- source_word: וְנִסְלַח לוֹ
  choice: e ele será perdoado
  rationale: A forma passiva hebraica declara o perdão recebido sem nomear explicitamente quem perdoa. A tradução conserva essa passividade em português corrente.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: Essa oferta pertencerá ao sacerdote
  rationale: O verbo feminino retoma a oferta mencionada no contexto. A explicitação de “oferta” evita um pronome sem antecedente claro em português e expressa o direito do sacerdote sobre ela.
- source_word: כַּמִּנְחָה
  choice: como a oferta de cereais
  rationale: Em Levítico, מִנְחָה designa normalmente a oferta composta de cereal. A expressão distingue essa categoria sacrificial de modo compreensível.
theological_decisions:
- issue: Fórmula passiva de perdão após o rito sacrificial
  choice: e ele será perdoado
  alternative: e isso lhe será perdoado
  rationale: O hebraico mantém o agente do perdão implícito. A opção principal é natural e preserva essa reserva teológica; a nota registra a construção alternativa sem identificar explicitamente o perdoador.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém-se a terminologia ritual “expiação” e “oferta de cereais”, evitando linguagem denominacional ou excessivamente técnica.
