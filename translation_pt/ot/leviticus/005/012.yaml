  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: pt
  text: Então ele a levará ao sacerdote, e o sacerdote tirará dela um punhado como sua porção memorial e o queimará no altar, sobre as ofertas feitas pelo fogo para Yahweh. É uma oferta pelo pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É uma oferta de purificação”. O termo hebraico pode designar a oferta que trata do pecado por meio da purificação.'
    reason: alternative_reading
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Então ele a levará
  rationale: O hifil de בוא com sufixo feminino refere-se à oferta de farinha do contexto anterior. “Então” expressa naturalmente a sequência narrativa da conjunção hebraica.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: tirará dela um punhado
  rationale: קמץ designa aqui o gesto ritual de recolher a quantidade que cabe na mão; “um punhado” é claro e idiomático em português.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: como porção memorial
  rationale: אזכרה é o termo técnico para a parte representativa da oferta que era queimada no altar; “porção memorial” preserva essa função cultual.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: e o queimará no altar
  rationale: No contexto sacrificial, o hifil de קטר indica queimar a oferta sobre o altar, fazendo-a subir em fumaça.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: sobre as ofertas queimadas de Yahweh
  rationale: A formulação conserva עַל em seu sentido espacial ou ritual aberto e traduz אִשִּׁים como ofertas consumidas pelo fogo, sem introduzir a interpretação específica de “alimento”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: חַטָּאת הִוא
  choice: É uma oferta pelo pecado
  rationale: Neste contexto, חטאת classifica o sacrifício. “Oferta pelo pecado” é a expressão convencional e imediatamente compreensível, enquanto a dimensão purificadora é registrada em nota.
theological_decisions:
- issue: Sentido de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode designar tanto a oferta relacionada ao pecado quanto o rito que efetua purificação. O texto principal mantém a designação tradicional e a nota preserva a alternativa relevante.
- issue: Relação indicada por עַל entre a porção memorial e as ofertas queimadas
  choice: sobre
  alternative: além de; junto às
  rationale: A preposição pode indicar posição sobre o fogo ou associação com outras ofertas. A tradução formal “sobre” preserva a abertura do hebraico sem decidir que se trata necessariamente de uma oferta adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal e o vocabulário ritual evitam arcaísmo excessivo. O marcador [a] aparece no texto principal e corresponde à única nota.
