revisions:
- from: Então ele a levará ao sacerdote, e o sacerdote tirará dela um punhado, como porção memorial, e o queimará no altar, sobre as ofertas queimadas de Yahweh. É uma oferta pelo pecado.[a]
  to: Então ele a levará ao sacerdote, e o sacerdote tirará dela um punhado como sua porção memorial e o queimará no altar, sobre as ofertas feitas pelo fogo para Yahweh. É uma oferta pelo pecado.[a]
  rationale: A revisão conserva o sentido espacial/ritual aberto de «sobre» para עַל e substitui uma expressão potencialmente restritiva por uma tradução mais abrangente de אִשֵּׁי יהוה. Também explicita, de modo discreto, que a porção memorial é a porção da própria oferta.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha a sequência e os atos rituais do hebraico: levar a oferta ao sacerdote, retirar dela um punhado como porção memorial e queimá-lo no altar. A formulação de עַל אִשֵּׁי יְהוָה deve evitar sugerir que «ofertas queimadas» seja uma categoria sacrificial mais restrita; trata-se da expressão abrangente «ofertas feitas pelo fogo para Yahweh».'
  naturalness: O português é moderno, claro e adequado ao registro legislativo-cultual. A explicitação de que a porção memorial pertence à oferta torna a frase ligeiramente mais precisa sem sacrificar fluência.
  terminology: «Sacerdote», «porção memorial», «Yahweh» e «oferta pelo pecado» são escolhas consistentes. A nota preserva de modo apropriado a alternativa acadêmica «oferta de purificação».
  issues:
  - severity: low
    issue: «ofertas queimadas de Yahweh» pode ser entendido como uma categoria específica de holocaustos.
    rationale: אִשֵּׁי יהוה significa literalmente ofertas feitas pelo fogo para Yahweh e é uma designação cultual mais ampla. «Ofertas feitas pelo fogo para Yahweh» preserva o caráter técnico sem restringir indevidamente o referente.
  - severity: low
    issue: A relação possessiva de «porção memorial» fica apenas implícita.
    rationale: O sufixo feminino em אַזְכָּרָתָהּ remete à oferta. «Como sua porção memorial» torna essa relação explícita e mantém a função de «um punhado».
