id: LEV.5.15
reference: Leviticus 5:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: pt
  text: Se alguém agir com infidelidade e pecar sem intenção no que diz respeito às coisas sagradas de Yahweh, trará a Yahweh, como sua oferta de reparação[a], um carneiro sem defeito, tirado do rebanho, conforme a tua avaliação em siclos de prata, segundo o siclo do santuário[b], como oferta de reparação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “oferta pela culpa” ou “oferta de compensação”. O termo hebraico אָשָׁם pode indicar tanto a responsabilidade pela falta quanto o sacrifício ligado à reparação; o mesmo termo ocorre novamente no fim do versículo.
    reason: lexical_alternative
  - marker: b
    text: O “siclo do santuário” era o padrão de peso usado nas avaliações sagradas.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: alguém
  rationale: Em formulações legais, o termo designa uma pessoa individual; “alguém” é natural em português e mantém o caráter genérico da norma.
- source_word: תִמְעֹל מַעַל
  choice: agir com infidelidade
  rationale: A combinação do verbo com o substantivo cognato enfatiza uma violação infiel de obrigação, aqui no âmbito sagrado, sem exigir uma expressão técnica pouco acessível.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: pecar sem intenção
  rationale: בִשְׁגָגָה indica inadvertência ou falta não deliberada, em contraste com uma transgressão consciente e desafiadora.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: no que diz respeito às coisas sagradas de Yahweh
  rationale: A expressão preserva a amplitude da preposição מִן e não restringe indevidamente a falta a roubo, profanação ou retenção de ofertas; “coisas sagradas” abrange bens, porções e dádivas consagradas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: sua oferta de reparação / como oferta de reparação
  rationale: אָשָׁם pode designar tanto a responsabilidade decorrente da falta quanto o sacrifício que a trata. Neste contexto de perda relativa às coisas sagradas e de avaliação monetária, “oferta de reparação” comunica sua dimensão compensatória; a alternativa tradicional é registrada em nota.
- source_word: אַיִל תָּמִים
  choice: um carneiro sem defeito
  rationale: No contexto sacrificial, תָּמִים indica um animal livre de defeito; a formulação é clara e corrente.
- source_word: מִן הַצֹּאן
  choice: tirado do rebanho
  rationale: צֹאן é o coletivo para gado miúdo; como אַיִל já identifica um carneiro, “rebanho” basta sem acrescentar uma espécie não expressa nesse ponto.
- source_word: בְּעֶרְכְּךָ
  choice: conforme a sua avaliação
  rationale: Mantém a segunda pessoa masculina singular do hebraico e a ideia de valor oficialmente determinado, sem inserir explicitamente a identidade do avaliador.
- source_word: כֶּסֶף שְׁקָלִים
  choice: em siclos de prata
  rationale: Expressa a avaliação monetária por peso de prata. O hebraico traz o plural “siclos” sem numeral explícito, por isso a tradução não acrescenta uma quantidade.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: Indica que a avaliação seguia o padrão de peso empregado no culto.
theological_decisions:
- issue: Sentido sacrificial de אָשָׁם
  choice: oferta de reparação
  alternative: oferta pela culpa; oferta de compensação
  rationale: A palavra reúne as ideias de culpa, responsabilidade e reparação. A avaliação em prata neste contexto favorece uma formulação que torne visível a dimensão reparadora, sem negar a dimensão de culpa, preservada em nota.
- issue: Relação da falta com as coisas sagradas
  choice: no que diz respeito às coisas sagradas
  alternative: contra as coisas sagradas; tomando das coisas sagradas
  rationale: A preposição hebraica permite mais de uma caracterização da relação. A opção adotada conserva a amplitude jurídica e evita decidir se a infração foi especificamente apropriação, retenção ou profanação.
- issue: Sujeito genérico singular
  choice: Se alguém... trará
  alternative: Se uma pessoa... ela trará
  rationale: “Alguém” preserva o sujeito legal individual e genérico sem introduzir marcação de gênero desnecessária nem pluralizar a norma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitaram-se termos excessivamente técnicos como “prevaricar” e soluções que restringissem a natureza exata da infração. A repetição de “oferta de reparação” reproduz a recorrência de אָשָׁם e mantém a ênfase jurídica e sacrificial do versículo.
