  text: אָשָׁ֖ם ה֑וּא אָשֹׁ֥ם אָשַׁ֖ם לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: pt
  text: É uma oferta pela culpa[a]; ele de fato incorreu em culpa perante Javé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É uma oferta de reparação; ele é certamente culpado perante Javé”. O hebraico repete a raiz אשם (“culpa”, “ser culpado”) para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: oferta pela culpa
  rationale: No contexto sacrificial, o substantivo designa a oferta específica exigida por uma culpa que gera responsabilidade e, em certos casos, reparação. “Oferta pela culpa” é clara e preserva a ligação lexical com a segunda oração.
- source_word: הוּא
  choice: É uma
  rationale: O pronome exerce função predicativa, identificando o sacrifício; em português, a cópula fornece a formulação natural.
- source_word: אָשֹׁם אָשַׁם
  choice: de fato incorreu em culpa
  rationale: O infinitivo absoluto seguido do verbo da mesma raiz intensifica a afirmação. “De fato” comunica a ênfase, enquanto “incorreu em culpa” preserva a relação com “oferta pela culpa”.
- source_word: לַיהוָה
  choice: perante Javé
  rationale: Com o verbo אָשַׁם, a preposição pode expressar responsabilidade em relação a Javé. “Perante” preserva essa ideia sem decidir de modo excessivo entre prestação de contas diante dele e transgressão diretamente contra ele.
- source_word: יהוה
  choice: Javé
  rationale: Representa em português o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de לַיהוָה na oração final
  choice: A pessoa incorreu em culpa perante Javé.
  alternative: A pessoa é certamente culpada contra Javé; ou a oferta é uma oferta pela culpa para Javé.
  rationale: A sintaxe liga naturalmente לַיהוָה à declaração verbal de culpa. “Perante Javé” comunica responsabilidade diante dele e mantém a possível nuance relacional sem transformar a preposição, de forma categórica, em “contra”.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial transparente. A repetição da raiz hebraica é parcialmente preservada por “culpa” nas duas orações; “de fato” reproduz sua força enfática.
