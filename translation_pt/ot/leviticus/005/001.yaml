  to: Se alguém pecar por ter ouvido uma convocação solene ligada a juramento[a], sendo testemunha — quer tenha visto, quer tenha tomado conhecimento —, e não declarar o que sabe, levará sobre si a sua culpa[b].
  rationale: A revisão evita a possível leitura de que a pessoa ou a testemunha estivesse “sob juramento”, ao mesmo tempo que mantém a função jurídica provável de קוֹל אָלָה. Também ajusta a construção das duas modalidades de conhecimento para refletir a disjunção hebraica sem introduzir causalidade. As âncoras foram preservadas junto aos respectivos termos anotados.
