  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: pt
  text: Se alguém pecar por ter ouvido uma convocação solene ligada a juramento[a], sendo testemunha — quer tenha visto, quer tenha tomado conhecimento —, e não declarar o que sabe, levará sobre si a sua culpa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a voz de uma maldição” ou “a voz de um juramento”. No contexto jurídico, a expressão se refere a uma solene convocação ou adjuração para que quem soubesse do caso se manifestasse como testemunha.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “carregará a sua iniquidade”. A expressão hebraica indica que a pessoa permanece responsável pela culpa de omitir o testemunho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: alguém
  rationale: Em legislação casuística, נֶפֶשׁ designa uma pessoa, não uma entidade metafísica; “alguém” introduz o caso de modo natural em português.
- source_word: תֶחֱטָא
  choice: pecar
  rationale: Preserva tanto a dimensão moral quanto a jurídica do verbo חטא.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: ter ouvido uma convocação solene sob juramento
  rationale: 'Comunica o sentido jurídico provável de קוֹל אָלָה: uma conclamação formal, acompanhada de juramento ou imprecação, para que testemunhas se manifestem. A nota conserva a forma mais literal e a ambiguidade lexical.'
- source_word: וְהוּא עֵד
  choice: e for testemunha
  rationale: Expressa de maneira direta a condição jurídica da pessoa em relação ao fato.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: seja porque viu, seja porque tomou conhecimento
  rationale: Mantém a distinção entre conhecimento visual direto e conhecimento obtido de outra forma, sem acrescentar detalhes não presentes no hebraico.
- source_word: אִם לֹא יַגִּיד
  choice: mas não declarar o que sabe
  rationale: O hifil de נגד significa tornar conhecido ou declarar; no contexto, trata-se de prestar a informação ou testemunho devido. “O que sabe” explicita em português o objeto implícito.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: levará sobre si a sua culpa
  rationale: Preserva a imagem e a força jurídico-teológica do idioma hebraico, que inclui responsabilidade pela culpa e suas consequências sem reduzi-lo apenas à punição.
theological_decisions:
- issue: Representação de gênero na formulação jurídica
  choice: Usar “alguém” e construções sem pronome de gênero
  alternative: Usar “uma pessoa” seguida de pronomes masculinos representativos
  rationale: O substantivo נֶפֶשׁ refere-se genericamente a qualquer pessoa. O português permite conservar o singular e a generalidade da norma sem introduzir gênero gramatical onde ele não é semanticamente relevante.
- issue: Relação sintática entre pecar e ouvir a convocação
  choice: “pecar por ter ouvido... mas não declarar”
  alternative: “se alguém pecar, ouvir... e não declarar”
  rationale: A formulação apresenta a omissão de testemunho após a convocação como o delito, conforme o sentido jurídico do caso, sem afirmar que o simples ato de ouvir seja pecaminoso.
translation_notes:
  register: Português moderno, digno e acessível, com formulação jurídica clara. Evitou-se “adju­ração”, pouco corrente, em favor de “convocação solene sob juramento”. Os travessões destacam as duas formas de conhecimento cobertas pela norma.
