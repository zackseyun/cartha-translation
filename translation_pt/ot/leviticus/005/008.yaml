revisions:
- from: Ele levará as duas aves ao sacerdote e apresentará primeiro a que será destinada à oferta pelo pecado[a]. O sacerdote deslocará a cabeça da ave pela nuca[b], mas não a separará do corpo[c].
  to: Ele levará as duas aves ao sacerdote e apresentará primeiro a que será destinada à oferta pelo pecado[a]. O sacerdote torcerá a cabeça da ave junto ao pescoço[b], mas não a separará do corpo[c].
  rationale: A revisão substitui um verbo português demasiado genérico por «torcerá», que representa melhor o ato ritual indicado por מָלַק e permanece compatível com a proibição de separar completamente a cabeça. Também substitui a leitura excessivamente determinada «pela nuca» por «junto ao pescoço» e transfere a incerteza filológica para uma nota, preservando a ambiguidade do hebraico. A explicitação de que o sacerdote realiza a segunda ação continua justificável pelo contexto ritual e melhora a compreensão em português.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:38Z'
review_pass:
  verdict: revise
  source_fidelity: A explicitação de «as duas aves» preserva corretamente o plural do hebraico. Contudo, «deslocará» é demasiado fraco e impreciso para מָלַק, verbo técnico que descreve a torção/ruptura ritual da cabeça da ave. «Pela nuca» também apresenta como certa uma localização anatómica que o difícil מִמּוּל עָרְפּוֹ não permite fixar com essa precisão.
  naturalness: O texto é geralmente claro e de registo apropriado. «Torcerá a cabeça ... junto ao pescoço» é mais idiomático e transmite melhor a ação ritual sem sugerir a separação completa que a cláusula final nega.
  terminology: «Oferta pelo pecado» é uma designação estabelecida e a nota preserva adequadamente «oferta de purificação» como alternativa. A troca de «deslocará» por «torcerá» melhora a terminologia ritual sem resolver artificialmente a ambiguidade espacial do hebraico.
  issues:
  - severity: medium
    issue: «Deslocará» para מָלַק
    rationale: O verbo não indica apenas deslocar ou luxar; no rito de aves refere-se a torcer/romper ritualmente a cabeça, ainda que sem a destacar por completo. «Deslocará» pode minimizar indevidamente a ação.
  - severity: medium
    issue: «Pela nuca» para מִמּוּל עָרְפּוֹ
    rationale: A expressão hebraica é difícil; «pela nuca» impõe uma direção e uma anatomia mais definidas do que o texto permite. Uma formulação espacial mais cautelosa deve ser mantida, com nota explicativa.
