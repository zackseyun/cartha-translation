  text: וְ/הֵבִ֤יא אֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן וְ/הִקְרִ֛יב אֶת אֲשֶׁ֥ר לַ/חַטָּ֖את רִאשׁוֹנָ֑ה וּ/מָלַ֧ק אֶת רֹאשׁ֛/וֹ מִ/מּ֥וּל עָרְפּ֖/וֹ וְ/לֹ֥א יַבְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: pt
  text: Ele levará as duas aves ao sacerdote e apresentará primeiro a que será destinada à oferta pelo pecado[a]. O sacerdote torcerá a cabeça da ave junto ao pescoço[b], mas não a separará do corpo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de purificação”. O termo hebraico também pode destacar a purificação efetuada por esse sacrifício.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico descreve uma ação ritual própria do sacrifício de aves; também é traduzido por “romperá” ou, em versões tradicionais, “destroncará”. A expressão que localiza a ação é difícil; literalmente, refere-se a uma posição em relação à nuca ou ao pescoço.
    reason: lexical_alternative
  - marker: c
    text: Isto é, a cabeça não devia ser completamente destacada do corpo.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: Ele levará as duas aves ao sacerdote
  rationale: O plural אֹתָם retoma as duas aves do versículo anterior. A explicitação de “aves” evita um pronome solto em português sem acrescentar um novo referente.
- source_word: וְהִקְרִיב
  choice: apresentará
  rationale: No hifil, קרב é termo sacrificial para fazer chegar ou apresentar uma oferta. “Apresentará” mantém a distinção entre o ofertante levar as aves ao sacerdote e o ato ritual subsequente.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: primeiro a que será destinada à oferta pelo pecado
  rationale: Reproduz a prioridade marcada por רִאשׁוֹנָה e a destinação da ave indicada por לַחַטָּאת.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: É a designação tradicional e amplamente compreensível do sacrifício; em Levítico, o termo também pode ressaltar a função de purificação, preservada em nota.
- source_word: וּמָלַק
  choice: deslocará
  rationale: מלק é um verbo ritual técnico referente ao manejo manual da cabeça ou do pescoço da ave. “Deslocará” comunica que há lesão ritual sem sugerir, contra a cláusula seguinte, a separação completa da cabeça.
- source_word: מִמּוּל עָרְפּוֹ
  choice: pela nuca
  rationale: עֹרֶף designa a parte posterior do pescoço, e a expressão localiza ali o ato. A preposição composta é difícil e admite formulações como “junto à nuca” ou “diante da nuca”; a versão principal evita precisão anatômica excessiva.
- source_word: וְלֹא יַבְדִּיל
  choice: mas não a separará do corpo
  rationale: בדל significa separar. A explicitação “do corpo” torna claro em português que a cabeça não devia ser totalmente destacada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com futuro prescritivo próprio da legislação ritual. “As duas aves” explicita o antecedente imediato para dar clareza ao versículo isolado. A alternância entre “ele” e “o sacerdote” esclarece naturalmente a mudança do responsável pela ação sem impor interpretação teológica.
