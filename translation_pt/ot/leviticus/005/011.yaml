source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: pt
  text: Mas, se os seus recursos não forem suficientes para duas rolas ou dois pombinhos[a], levará como oferta pelo pecado que cometeu a décima parte de um efa de farinha fina, como oferta pelo pecado. Não porá azeite sobre ela nem porá sobre ela olíbano (franquincenso), pois é uma oferta pelo pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por «se os seus recursos não forem suficientes» significa literalmente «se sua mão não alcançar»; é uma forma de dizer que a pessoa não dispõe de meios.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: os seus recursos não forem suficientes
  rationale: Traduz o sentido econômico do idioma hebraico, literalmente «sua mão não alcançar», em linguagem clara e digna, sem o tornar coloquial demais.
- source_word: תֹרִים
  choice: rolas
  rationale: Designa especificamente rolas no contexto sacrificial, distinguindo-as dos pombinhos mencionados em seguida.
- source_word: בְנֵי יוֹנָה
  choice: pombinhos
  rationale: A expressão, literalmente «filhotes de pomba», refere-se a pombos jovens; «pombinhos» é corrente e natural em português bíblico moderno.
- source_word: קָרְבָּנוֹ
  choice: oferta
  rationale: Termo amplo para aquilo que é levado e apresentado a Deus, adequado também ao substituto de farinha prescrito neste versículo.
- source_word: אֲשֶׁר חָטָא
  choice: pelo pecado que cometeu
  rationale: Explicita de maneira idiomática a relação entre a oferta e a transgressão, sem acrescentar conteúdo teológico.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: a décima parte de um efa
  rationale: Mantém a antiga unidade de medida e reproduz com precisão a fração indicada no hebraico.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente usual da farinha finamente peneirada ou moída empregada nas ofertas.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: Neste contexto ritual, חַטָּאת designa a oferta associada ao pecado, não apenas o pecado em abstrato.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: Não porá azeite sobre ela
  rationale: Preserva diretamente a proibição ritual; «azeite» é a designação natural para o óleo de oliva nesse contexto.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: nem lhe acrescentará incenso
  rationale: לְבֹנָה é a resina aromática usada no culto. «Incenso» é amplamente compreensível em português e a construção evita repetição pesada.
- source_word: כִּי חַטָּאת הִיא
  choice: pois é uma oferta pelo pecado
  rationale: Mantém a razão explícita para a ausência de azeite e incenso e identifica a categoria ritual da oferta.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto sacrificial
  choice: oferta pelo pecado
  alternative: pecado
  rationale: A sintaxe e as instruções tratam do objeto apresentado no ritual. A tradução conserva esse sentido cultual sem inserir categorias doutrinárias posteriores.
- issue: Expressão hebraica de insuficiência econômica
  choice: se os seus recursos não forem suficientes
  alternative: se sua mão não alcançar
  rationale: Comunica com clareza a concessão legal feita a quem não dispõe de meios, preservando a força condicional do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantêm-se o termo antigo «efa» e a terminologia sacrificial «oferta pelo pecado». O marcador [a] foi colocado junto à condição econômica que a nota explica.
