  text: וְ/הָיָ֥ה כִֽי יֶאְשַׁ֖ם לְ/אַחַ֣ת מֵ/אֵ֑לֶּה וְ/הִ֨תְוַדָּ֔ה אֲשֶׁ֥ר חָטָ֖א עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: pt
  text: Quando alguém incorrer em culpa[a] em um desses casos, confessará o pecado que cometeu em relação a esse caso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornar-se culpado” ou “ser culpado”. O verbo hebraico destaca culpa ou responsabilidade jurídica, não apenas a percepção interior de ter agido mal.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que pecou a respeito dela”. O pronome feminino se refere à situação ou ao caso pertinente entre os anteriormente enumerados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quando
  rationale: A fórmula introduz a circunstância jurídica que desencadeia a obrigação. Em português, “Quando” transmite isso com naturalidade, sem exigir o calque pesado “E acontecerá que”.
- source_word: יֶאְשַׁם
  choice: incorrer em culpa
  rationale: O verbo אשם indica culpa ou responsabilidade jurídica. “Incorrer em culpa” preserva esse sentido sem pressupor que a pessoa apenas tomou consciência interior do erro.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: em um desses casos
  rationale: A expressão remete às situações enumeradas anteriormente. “Casos” é claro e adequado ao contexto legal.
- source_word: וְהִתְוַדָּה
  choice: confessará
  rationale: O hitpael de ידה expressa confissão. O futuro com valor prescritivo mantém a sequência e a força da instrução legal.
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: aquilo em que pecou
  rationale: A formulação conserva tanto a oração relativa quanto a relação com o caso em questão, expressa por עָלֶיהָ, sem produzir uma construção antinatural em português.
theological_decisions:
- issue: Natureza da culpa indicada por אשם
  choice: incorrer em culpa
  alternative: perceber que é culpado
  rationale: O texto afirma culpa ou responsabilidade, mas não declara explicitamente um momento de percepção subjetiva; a tradução evita acrescentar esse elemento interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Incorrer em culpa” mantém o tom jurídico do contexto; “aquilo em que pecou” preserva a referência relacional do hebraico sem rigidez excessiva.
