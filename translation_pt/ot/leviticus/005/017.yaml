id: LEV.5.17
reference: Leviticus 5:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: pt
  text: Se alguém pecar e fizer uma das coisas que, segundo os mandamentos de Yahweh, não devem ser feitas, ainda que não o saiba, será culpado[a] e carregará sua iniquidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “incorrerá em culpa”. O termo hebraico pode indicar que a pessoa se torna responsável pela culpa decorrente da transgressão.
    reason: lexical_alternative
  - marker: b
    text: Ou “carregará sua culpa” ou “responderá por sua iniquidade”. A expressão hebraica pode se referir à responsabilidade ou às consequências da transgressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: alguém
  rationale: Neste contexto jurídico, נֶפֶשׁ designa uma pessoa, não especificamente a parte imaterial do ser humano. “Alguém” é natural e inclusivo em português.
- source_word: תֶחֱטָא
  choice: pecar
  rationale: O verbo חטא tem aqui seu sentido direto de cometer pecado ou transgredir.
- source_word: וְעָשְׂתָה אַחַת מִכָּל
  choice: e fizer uma das coisas
  rationale: A formulação conserva o sentido distributivo de praticar uma ação dentre o conjunto das ações proibidas, sem reproduzir uma construção hebraica pouco natural em português.
- source_word: מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: que, segundo os mandamentos de Yahweh, não devem ser feitas
  rationale: A tradução mantém a referência aos mandamentos e a força normativa da construção que descreve atos proibidos.
- source_word: וְלֹא יָדַע
  choice: ainda que não o saiba
  rationale: A expressão comunica que a pessoa desconhecia a transgressão, preservando certa abertura quanto a desconhecer o ato, seu caráter proibido ou sua culpa.
- source_word: וְאָשֵׁם
  choice: será culpado
  rationale: אָשֵׁם indica que a pessoa se torna culpada ou incorre em responsabilidade pelo ato, mesmo praticado sem conhecimento.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: carregará sua iniquidade
  rationale: A tradução preserva a imagem jurídica e moral do idioma hebraico נשׂא עון, sem reduzi-lo apenas à punição ou apenas ao sentimento de culpa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” representa o nome pessoal da aliança sem substituí-lo por um título.
- issue: Culpa decorrente de transgressão involuntária
  choice: será culpado
  alternative: incorrerá em culpa
  rationale: A tradução mantém a afirmação do texto de que a falta de conhecimento não elimina a responsabilidade, sem explicar além do que o versículo declara.
- issue: Sentido do idioma נשׂא עון
  choice: carregará sua iniquidade
  alternative: carregará sua culpa; responderá por sua iniquidade
  rationale: A formulação conserva a tensão entre culpa, responsabilidade e consequências, sentidos possíveis do idioma hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe jurídica clara. “Alguém” evita uma referência artificial à “alma”, e “carregará sua iniquidade” preserva deliberadamente o peso e a amplitude do idioma hebraico.
