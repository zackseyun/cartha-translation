  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֣ל אֲשֶׁר ל/וֹ֩ סְנַפִּ֨יר וְ/קַשְׂקֶ֜שֶׂת בַּ/מַּ֗יִם בַּ/יַּמִּ֛ים וּ/בַ/נְּחָלִ֖ים אֹתָ֥/ם תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: pt
  text: 'Dentre tudo o que há nas águas, vocês podem comer o seguinte: tudo o que tem barbatanas e escamas nas águas, nos mares e nos cursos de água[a]; isso vocês podem comer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rios”. O termo hebraico pode designar cursos de água, rios ou uádis, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת זֶה
  choice: Isto
  rationale: Preserva o demonstrativo singular hebraico, que introduz naturalmente a categoria do que é permitido comer.
- source_word: תֹּאכְלוּ
  choice: vocês podem comer
  rationale: O imperfeito de segunda pessoa masculina plural tem aqui força permissiva no contexto das normas alimentares.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: dentre tudo o que vive nas águas
  rationale: “Dentre” conserva o sentido partitivo de מִן; “vive” é uma explicitação idiomática mínima dos seres aquáticos, sem restringi-los a uma espécie.
- source_word: כֹּל אֲשֶׁר לוֹ
  choice: tudo o que ... tem
  rationale: Reproduz a força abrangente da construção relativa e expressa naturalmente a posse indicada por לוֹ.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: barbatanas e escamas
  rationale: Os substantivos hebraicos funcionam como nomes coletivos; o plural é a forma zoológica natural em português.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: nos mares e nos riachos
  rationale: “Mares” traduz יַמִּים; “riachos” é uma opção clara para נְחָלִים neste contexto, embora o termo também possa indicar rios, cursos de água ou uádis.
- source_word: אֹתָם תֹּאכֵלוּ
  choice: isso vocês podem comer
  rationale: Retoma com ênfase os seres aquáticos que satisfazem os dois critérios e mantém a força permissiva da instrução.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa plural. A repetição de “águas” e “vocês podem comer” preserva o ritmo jurídico e a ênfase do hebraico; os travessões esclarecem que mares e riachos especificam as águas.
