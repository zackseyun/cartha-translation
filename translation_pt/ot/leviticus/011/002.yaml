base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: pt
  text: 'Falem aos filhos de Israel[a] e digam: “Estes são os animais[b] que vocês podem comer dentre todos os animais que há sobre a terra[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes de Israel” ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “Este é o animal” ou “Este é o ser vivo”. O singular tem aqui sentido coletivo e introduz as categorias de animais que podem ser comidos.'
    reason: lexical_alternative
  - marker: c
    text: Ou “sobre o solo” ou “em terra firme”. A expressão distingue os animais terrestres das outras categorias tratadas neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Falem
  rationale: Imperativo plural de דבר, dirigido a Moisés e Arão no contexto. “Falem” preserva tanto o número quanto o tom direto da instrução.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão familiar hebraica de modo claro e tradicional, sem reduzir o coletivo simplesmente a “israelitas”.
- source_word: לֵאמֹר
  choice: e digam
  rationale: O infinitivo hebraico introduz o discurso direto. Em português atual, “e digam” é mais natural do que o hebraísmo rígido “dizendo” depois de “falem”.
- source_word: זֹאת הַחַיָּה
  choice: Estes são os seres vivos
  rationale: Embora o demonstrativo e o substantivo estejam no singular, חַיָּה tem aqui sentido coletivo e classificatório, desenvolvido pela lista subsequente. O plural comunica naturalmente esse alcance em português, enquanto a nota registra a forma hebraica.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: que vocês podem comer
  rationale: O imperfeito na legislação expressa aqui permissão alimentar. “Podem comer” comunica autorização, não mera capacidade nem simples previsão futura.
- source_word: מִכָּל
  choice: dentre todos
  rationale: 'A combinação מן + כל tem força partitiva: seleciona os seres permitidos do conjunto maior dos animais terrestres.'
- source_word: הַבְּהֵמָה
  choice: os animais
  rationale: Neste contexto, בְּהֵמָה designa amplamente os animais terrestres. “Animais” evita restringir indevidamente o termo a gado ou animais domésticos.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: que há sobre a terra
  rationale: A expressão localiza essa categoria em contraste com os seres aquáticos tratados depois. “Sobre a terra” mantém a imagem espacial do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “vocês” torna explícita a segunda pessoa plural do hebraico; “e digam” evita uma construção quotativa artificial. As aspas introduzem diretamente a fala prescrita.
