  text: כֹּ֣ל מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ פְּרָסֹ֔ת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: pt
  text: Todo animal que tenha o casco fendido e completamente dividido, e que rumine[a], vocês poderão comer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “faz subir o alimento ruminado”; isto é, rumina.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: todo
  rationale: Empregado distributivamente para abranger cada animal que reúna as características indicadas; “todo animal que” é natural em uma norma de permissão.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: tem o casco fendido
  rationale: Expressa em português corrente a característica física indicada pelo particípio e seu objeto, literalmente relacionados a dividir o casco.
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: completamente dividido
  rationale: A segunda expressão hebraica especifica e reforça que a divisão do casco é efetiva; a formulação evita uma repetição pesada sem perder a ênfase.
- source_word: מַעֲלַת גֵּרָה
  choice: rumina
  rationale: É o equivalente português claro e usual do idioma hebraico que, literalmente, descreve o animal como fazendo subir o alimento ruminado.
- source_word: בַּבְּהֵמָה
  choice: animal
  rationale: No contexto da classificação alimentar, o termo designa animais terrestres; “animal” é claro e não o restringe indevidamente a animais domésticos.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: vocês poderão comer
  rationale: O imperfeito, neste contexto legal, comunica permissão, não uma ordem para consumir; o plural “vocês” torna explícito o destinatário coletivo.
theological_decisions: []
