  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: pt
  text: Quem carregar a carcaça deles lavará as suas roupas e ficará impuro até o entardecer.[a] Eles são impuros para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as carcaças deles”. O hebraico pode ser entendido distributivamente em referência aos animais em questão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: Quem carregar
  rationale: O particípio com artigo tem sentido genérico, literalmente “aquele que carrega”. “Quem carregar” expressa de modo natural em português a força geral da norma.
- source_word: נִבְלָתָם
  choice: a carcaça deles
  rationale: נְבֵלָה designa a carcaça de um animal. O sufixo plural remete aos animais do contexto anterior; o singular pode ser entendido distributivamente, ambiguidade registrada em nota.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavará as suas roupas
  rationale: No contexto jurídico, o imperfeito tem força prescritiva. O futuro do presente expressa essa obrigação com dignidade e naturalidade; “roupas” é claro e atual.
- source_word: וְטָמֵא
  choice: e ficará impuro
  rationale: A forma descreve o estado ritual resultante. “Ficará impuro” torna explícita essa consequência sem lhe atribuir culpa moral.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Expressão natural em português para o limite temporal indicado pelo hebraico, preservando o artigo da construção fonte.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: Eles são impuros para vocês
  rationale: Mantém a referência aos animais em discussão e representa לָכֶם de forma direta, sem ampliar o sentido.
theological_decisions:
- issue: Terminologia de impureza ritual
  choice: impuro
  alternative: contaminado; imundo
  rationale: Em Levítico, טמא indica uma categoria técnica de impureza ritual. “Impuro” preserva essa categoria sem sugerir necessariamente culpa moral; “imundo” pode soar pejorativo, e “contaminado” pode sugerir contágio físico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação conserva o caráter jurídico do texto e distingue impureza ritual de culpa moral.
