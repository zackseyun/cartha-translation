  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: pt
  text: a cegonha, a garça segundo a sua espécie[a], a poupa[b] e o morcego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata do termo hebraico traduzido por «garça» é incerta; pode designar o íbis ou outra ave aquática de pernas longas. A expressão «segundo a sua espécie» abrange variedades relacionadas desse tipo geral de ave.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Tradicionalmente, algumas versões trazem «abibe»; é mais provável que o termo hebraico designe a poupa.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲסִידָה
  choice: cegonha
  rationale: É a identificação tradicional e mais amplamente aceita; funciona aqui como nome de ave, sem explicitar no texto a possível associação etimológica com lealdade ou bondade.
- source_word: אֲנָפָה
  choice: garça
  rationale: A identificação zoológica exata é incerta, mas “garça” é uma equivalência convencional e plausível para uma ave aquática de pernas longas.
- source_word: לְמִינָהּ
  choice: segundo as suas espécies
  rationale: Expressa a classificação das variedades relacionadas abrangidas pelo tipo geral de ave; o plural natural em português comunica que se incluem todas as variedades correspondentes.
- source_word: דּוּכִיפַת
  choice: poupa
  rationale: A pesquisa lexical moderna favorece a poupa, em vez da identificação tradicional em algumas versões como abibe.
- source_word: עֲטַלֵּף
  choice: morcego
  rationale: A identificação é segura; preserva-se a classificação fenomenológica antiga entre criaturas voadoras, sem impor a taxonomia zoológica moderna.
- source_word: וְאֵת / וְאֶת
  choice: coordenação por vírgulas e “e” final
  rationale: Os marcadores de objeto direto não têm equivalente lexical em português; a conjunção hebraica é representada pela coordenação natural de uma lista portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário zoológico amplamente reconhecível. A coordenação foi ajustada à sintaxe natural do português, sem perder nenhum item da lista. As incertezas zoológicas reais foram preservadas em notas.
