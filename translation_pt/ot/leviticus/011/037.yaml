source:
  edition: WLC
  text: וְ/כִ֤י יִפֹּל֙ מִ/נִּבְלָתָ֔/ם עַל כָּל זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: pt
  text: E, se alguma parte do cadáver deles cair sobre qualquer semente destinada à semeadura, ela é limpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se algum dos cadáveres deles cair”. A expressão hebraica pode ser entendida de modo partitivo (“alguma parte do cadáver deles”) ou coletivo/plural. “Limpa” refere-se à condição ritual da semente.'
    reason: Preserva a ambiguidade de מִנִּבְלָתָם e esclarece o sentido ritual de טָהוֹר sem introduzir a ideia interpretativa de permanência.
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Mantém tanto a ligação com a legislação anterior quanto o valor condicional de כִּי neste contexto casuístico.
- source_word: יִפֹּל
  choice: cair
  rationale: O imperfeito qal exprime a eventualidade prevista pela condição; em português, o futuro do subjuntivo após «se» é a forma natural.
- source_word: מִנִּבְלָתָם
  choice: alguma parte do cadáver deles
  rationale: Explicita o provável valor partitivo de מִן e conserva o singular coletivo נְבֵלָה com sufixo plural, evitando uma construção pouco natural em português.
- source_word: עַל כָּל זֶרַע זֵרוּעַ
  choice: sobre qualquer semente destinada à semeadura
  rationale: «Qualquer» comunica o valor distributivo de כָּל, e «destinada à semeadura» reproduz de modo natural a ideia da expressão cognata זֶרַע זֵרוּעַ.
- source_word: אֲשֶׁר יִזָּרֵעַ
  choice: destinada à semeadura
  rationale: 'Integra a oração relativa à expressão anterior e preserva seu sentido prospectivo: trata-se de semente que será semeada.'
- source_word: טָהוֹר הוּא
  choice: ela continuará pura
  rationale: No contexto, a declaração significa que a semente não se torna ritualmente impura. «Pura» concorda naturalmente com «semente»; «continuará» torna explícito o resultado jurídico contextual.
theological_decisions:
- issue: Sentido ritual de טָהוֹר
  choice: pura
  alternative: limpa
  rationale: Em português, «pura/impura» é linguagem corrente para a condição ritual levítica e evita sugerir mera limpeza física. A nota esclarece que se trata de pureza ritual.
- issue: Valor resultativo de טָהוֹר הוּא
  choice: continuará pura
  alternative: é pura
  rationale: A formulação contextual explicita que o contato descrito não altera o estado ritual da semente, embora o hebraico diga literalmente «ela é pura»; essa diferença é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega «semente destinada à semeadura» para evitar repetição pouco idiomática, e «pura» no sentido técnico de pureza ritual.
