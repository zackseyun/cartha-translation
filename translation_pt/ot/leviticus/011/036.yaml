id: LEV.11.36
reference: Leviticus 11:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֣ךְ מַעְיָ֥ן וּ/ב֛וֹר מִקְוֵה מַ֖יִם יִהְיֶ֣ה טָה֑וֹר וְ/נֹגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: pt
  text: Contudo, uma nascente ou uma cisterna onde se acumula água[a] permanecerá pura; mas quem tocar na carcaça deles ficará impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um ajuntamento de águas”; também pode ser entendido como “um reservatório de água”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Sinaliza a exceção às regras de impureza imediatamente anteriores, sem impor o sentido mais restritivo de “somente”.
- source_word: מַעְיָן
  choice: nascente
  rationale: Designa uma fonte natural de água; “nascente” é claro e corrente em português moderno.
- source_word: בּוֹר
  choice: cisterna
  rationale: Neste contexto, refere-se a um depósito escavado ou construído para reter água; “cisterna” é mais preciso que “poço” ou “cova”.
- source_word: מִקְוֵה מַיִם
  choice: onde se acumula água
  rationale: Expressa em português natural a ideia de água reunida ou armazenada, ao mesmo tempo que preserva a relação da expressão com a nascente ou a cisterna.
- source_word: יִהְיֶה טָהוֹר
  choice: permanecerá pura
  rationale: Embora a forma verbal diga literalmente “será pura”, o contexto indica que a fonte de água não se torna impura pela situação descrita; “permanecerá” explicita essa continuidade implícita.
- source_word: נֹגֵעַ
  choice: quem tocar
  rationale: O particípio tem função substantiva e aplicação genérica; esta formulação é natural e fiel em português.
- source_word: נִבְלָתָם
  choice: carcaça deles
  rationale: O singular coletivo hebraico se refere à carcaça de um dos animais mencionados anteriormente, com sufixo masculino plural que retoma esses animais.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: Comunica o estado ritual resultante de modo claro, sem sugerir mera sujeira física.
theological_decisions:
- issue: Terminologia de pureza ritual
  choice: pura / impuro
  alternative: limpa / impuro; ritualmente pura / ritualmente impuro
  rationale: “Puro/impuro” preserva a terminologia cultual de Levítico e evita confusão com limpeza física. O contexto torna desnecessário acrescentar “ritualmente” ao texto.
- issue: Continuidade da pureza da fonte de água
  choice: permanecerá pura
  alternative: será pura
  rationale: A tradução explicita a continuidade sugerida pelo contraste contextual, sem alterar a condição ritual declarada no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “onde se acumula água” evita a rigidez de uma aposição literal, enquanto “pura/impuro” mantém a linguagem própria das leis de pureza ritual.
