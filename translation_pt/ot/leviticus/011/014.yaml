  text: the kite[a], and the falcon according to its kind,
translation:
  language: pt
  text: o milhafre[a] e o falcão, segundo a sua espécie;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata dessas aves é incerta; alternativamente, a primeira pode ser traduzida como “abutre”, e a segunda, como “milhafre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּאָה
  choice: o milhafre
  rationale: O nome da ave é de identificação incerta. “Milhafre” é uma designação atual e plausível para uma ave de rapina desse grupo; a alternativa “abutre” é registrada em nota.
- source_word: הָאַיָּה
  choice: o falcão
  rationale: O termo designa uma ave de rapina, tradicionalmente entendida como falcão ou milhafre. “Falcão” distingue os dois nomes hebraicos sem ultrapassar o campo semântico provável; a incerteza zoológica é indicada em nota.
- source_word: לְמִינָהּ
  choice: segundo a sua espécie
  rationale: Reproduz de modo natural o sentido classificatório de “conforme/segundo a sua espécie” e preserva o singular feminino do sufixo hebraico.
- source_word: וְאֶת ... וְאֶת
  choice: o ... e o ...
  rationale: Os marcadores de objeto direto não têm equivalente expresso necessário em português; as conjunções e os artigos são representados naturalmente no contexto da lista.
