review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a distinção entre tornar-se detestável (שׁקץ) e tornar-se impuro (טמא), bem como a repetição enfática da causa/meio. Contudo, «a si mesmos» é uma reprodução excessivamente literal do objeto reflexivo hebraico e soa pouco idiomática em português; a relação expressa por ב também fica mais natural e precisa como «por causa de»/«por meio de».
  naturalness: «Não tornem a si mesmos detestáveis» é pesado e pouco natural no português contemporâneo. «Não se tornem detestáveis» comunica o mesmo valor reflexivo de modo claro. Também é preferível evitar a alternância pouco natural «por causa deles» / «por eles» no final.
  terminology: «Detestáveis» e «impuros» são escolhas apropriadas. «Criatura que enxameia» mantém a amplitude de שׁרץ melhor que uma designação limitada a animais rastejantes e é mais natural neste contexto do que «animal que enxameia».
  issues:
  - severity: medium
    issue: 'Construção reflexiva pouco idiomática: «Não tornem a si mesmos detestáveis».'
    rationale: Embora reproduza formalmente o objeto «a si mesmos», o português normalmente exprime esse sentido com «não se tornem detestáveis». A revisão não reduz a força reflexiva do hebraico.
  - severity: low
    issue: Formulação final «por eles» é pouco natural e a alternância de preposições não é necessária.
    rationale: «Por causa deles» ou «por meio deles» exprime com maior clareza a relação causal/instrumental de בָּם, sem alterar o sentido.
  - severity: low
    issue: «Animal que enxameia» pode sugerir que um animal individual enxameia.
    rationale: «Criatura que enxameia» conserva a categoria abrangente de שׁרץ e funciona melhor em português para seres pequenos que se movem em grande número.
  revised_text: Não se tornem detestáveis por causa de nenhuma criatura que enxameia[a], nem se tornem impuros por meio delas, para não ficarem impuros por causa delas.
