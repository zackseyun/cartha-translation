- from: Não tornem a si mesmos detestáveis por nenhum animal que enxameia[a], nem se tornem impuros por causa deles, para que não fiquem impuros por eles.
  to: Não se tornem detestáveis por causa de nenhuma criatura que enxameia[a], nem se tornem impuros por meio delas, para não ficarem impuros por causa delas.
  rationale: A revisão torna a construção reflexiva idiomática em português, preserva a distinção lexical entre o verbo de tornar detestável e os verbos de impureza, e mantém a repetição deliberada da relação com essas criaturas. A oração final continua a expressar a consequência negativa no encadeamento das proibições, sem impor uma interpretação doutrinária.
