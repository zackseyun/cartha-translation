base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: pt
  text: Não se tornem detestáveis por causa de nenhuma criatura que enxameia[a], nem se tornem impuros por meio delas, para não ficarem impuros por causa delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por nenhuma criatura rastejante que rasteja”. O hebraico se refere a uma categoria ampla de pequenos seres que enxameiam ou se movem em grande número; “criatura que enxameia” procura preservar melhor essa amplitude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: tornem a si mesmos detestáveis
  rationale: Preserva o sentido reflexivo de שׁקץ e sua ideia própria de tornar detestável, sem confundi-lo com os termos טמא de impureza que aparecem depois.
- source_word: נַפְשֹׁתֵיכֶם
  choice: a si mesmos
  rationale: Neste uso reflexivo, נפש designa a própria pessoa; “suas almas” estreitaria indevidamente o sentido em português.
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: por nenhum animal que enxameia
  rationale: “Animal que enxameia” expressa a categoria ampla de pequenos seres que se movem em grande número. A formulação mantém parcialmente a repetição hebraica sem produzir uma frase excessivamente artificial.
- source_word: תִטַּמְּאוּ
  choice: se tornem impuros
  rationale: Mantém a força reflexiva da forma verbal e a terminologia de impureza característica de Levítico.
- source_word: בָּהֶם
  choice: por causa deles
  rationale: 'Torna clara em português a relação instrumental ou causal: esses animais são o meio pelo qual se contrai impureza.'
- source_word: וְנִטְמֵתֶם
  choice: para que não fiquem impuros
  rationale: No encadeamento das proibições, traduz a cláusula como resultado ou propósito negativo, sem reduzi-la a simples coordenação.
- source_word: בָּם
  choice: por eles
  rationale: Preserva a repetição enfática da relação instrumental presente no hebraico.
theological_decisions:
- issue: Terminologia de impureza na legislação de santidade
  choice: impuros
  alternative: contaminados
  rationale: “Impuros” preserva a categoria ritual e pactual de טמא em Levítico sem afirmar, além do texto, culpa moral. “Contaminados” poderia sugerir sobretudo sujeira física ou contágio.
- issue: Relação lógica de וְנִטְמֵתֶם após as proibições
  choice: para que não fiquem impuros
  alternative: e fiquem impuros / para não acontecer que fiquem impuros
  rationale: A opção apresenta naturalmente em português o resultado ou propósito negativo implicado pelo contexto, embora a conjunção hebraica também possa ser entendida de modo mais coordenativo.
translation_notes:
  register: Português moderno, digno e acessível, com construção no plural dirigida à comunidade. “Animal que enxameia” é deliberadamente mais amplo que “animal rastejante”; a nota registra a alternativa tradicional. A repetição de “impuros” e “por eles” acompanha a ênfase do hebraico.
