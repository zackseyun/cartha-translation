  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: pt
  text: Quem comer de sua carcaça[a] deverá lavar suas roupas e ficará impuro[b] até o anoitecer; e quem carregar a sua carcaça deverá lavar suas roupas e ficará impuro até o anoitecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alguma parte de sua carcaça”; a expressão hebraica tem sentido partitivo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, impuro segundo as leis de pureza ritual de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: quem comer
  rationale: O particípio com artigo é substantivado e tem referência genérica. “Quem comer” expressa naturalmente em português a formulação legal sem restringi-la a uma pessoa específica.
- source_word: מִנִּבְלָתָהּ
  choice: de sua carcaça
  rationale: 'A preposição מִן tem sentido partitivo: trata-se de comer da carcaça, isto é, alguma parte dela. A formulação preserva essa relação sem acrescentar uma quantidade não expressa.'
- source_word: נִבְלָתָהּ
  choice: sua carcaça
  rationale: Neste contexto de animais e pureza, נְבֵלָה designa o corpo morto de um animal. “Carcaça” é preciso e natural em português.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: deverá lavar suas roupas
  rationale: O imperfeito em legislação tem força prescritiva. “Deverá lavar” comunica essa obrigação de modo claro e atual; “roupas” é mais corrente que “vestes”.
- source_word: וְטָמֵא
  choice: e ficará impuro
  rationale: A cláusula declara o estado de impureza resultante. “Ficará impuro” mantém a sequência jurídica e não introduz “ritualmente” no texto principal.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Reproduz de maneira natural a expressão temporal e o artigo hebraico.
- source_word: הַנֹּשֵׂא
  choice: quem carregar
  rationale: O segundo particípio substantivado também é genérico. A escolha mantém o paralelismo com “quem comer”.
- source_word: אֶת נִבְלָתָהּ
  choice: a sua carcaça
  rationale: O objeto direto definido com sufixo possessivo é expresso de modo direto e idiomático em português.
theological_decisions:
- issue: Natureza da linguagem de impureza
  choice: Traduzir טָמֵא como “impuro” e explicar em nota o sentido próprio das leis de pureza de Israel.
  alternative: “Ritualmente impuro” no texto principal.
  rationale: O contexto indica impureza ritual, mas o hebraico usa apenas o termo comum para “impuro”. A tradução preserva a concisão do original, enquanto a nota evita que a expressão seja entendida como juízo moral ou falta de higiene.
- issue: Representação de gênero nos particípios legais
  choice: Usar a construção genérica singular “quem”, com “suas roupas”.
  alternative: “Aquele que” e “as roupas dele”, ou uma formulação no plural.
  rationale: “Quem” conserva o referente singular e genérico do hebraico, aplica a norma a qualquer pessoa e evita marcar um gênero que, em português, não precisa ser explicitado nessa construção.
translation_notes:
  register: Português moderno, claro e digno, com cadência jurídica. “Deverá” torna explícita a força prescritiva própria deste contexto legal; “quem” oferece uma formulação genérica natural e mantém o paralelismo das duas cláusulas.
