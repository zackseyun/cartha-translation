source:
  edition: WLC
  text: לְ/הַבְדִּ֕יל בֵּ֥ין הַ/טָּמֵ֖א וּ/בֵ֣ין הַ/טָּהֹ֑ר וּ/בֵ֤ין הַֽ/חַיָּה֙ הַֽ/נֶּאֱכֶ֔לֶת וּ/בֵין֙ הַֽ/חַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: pt
  text: para distinguir entre o impuro e o puro, e entre o animal que se pode comer[a] e o animal que não se pode comer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o animal comestível e o animal que não é comestível”.'
    reason: Alternativa lexical que expressa a aptidão ou permissão alimentar de forma adjetival.
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: para distinguir
  rationale: O infinitivo indica a finalidade do ensino precedente. “Distinguir” expressa discernimento classificatório e jurídico melhor que o mais espacial “separar”.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e ...; e entre ... e ...
  rationale: A construção repetida organiza dois pares contrastantes; a formulação portuguesa preserva o paralelismo com naturalidade.
- source_word: הַטָּמֵא / הַטָּהֹר
  choice: o impuro / o puro
  rationale: São categorias técnicas de pureza ritual em Levítico. O par “impuro/puro” é claro e corrente em português e não implica, por si só, maldade ou virtude moral.
- source_word: הַחַיָּה
  choice: o animal
  rationale: Neste resumo das normas alimentares, חַיָּה designa o animal ou criatura viva. “Animal” é natural em português e não restringe indevidamente a referência a animais selvagens.
- source_word: הַנֶּאֱכֶלֶת
  choice: que se pode comer
  rationale: O particípio nifal indica o animal permitido ou próprio para consumo, não apenas aquilo que de fato é comido.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: que não se pode comer
  rationale: A oração contrasta o animal proibido com o permitido. A construção comunica proibição em português atual e mantém o paralelismo.
theological_decisions:
- issue: Terminologia de pureza ritual na legislação levítica
  choice: “impuro/puro” como categorias cultuais e jurídicas
  alternative: “imundo/limpo” ou uma leitura moralizada de impureza e pureza
  rationale: O versículo resume as distinções alimentares estabelecidas na lei. A tradução preserva a categoria ritual do hebraico sem afirmar que os animais classificados como impuros sejam intrinsecamente maus.
- issue: Valor modal das expressões relativas ao consumo
  choice: “pode/não se pode comer” como permissão e proibição
  alternative: “é comido/não é comido” como descrição de costume ou prática
  rationale: O contexto legal mostra que o contraste diz respeito ao que é permitido e proibido para consumo, e não apenas ao comportamento alimentar observado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura paralela do hebraico foi mantida sem rigidez, e a terminologia evita tanto arcaísmos quanto moralização das categorias rituais.
