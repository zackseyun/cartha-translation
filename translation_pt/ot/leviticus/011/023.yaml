  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: pt
  text: Mas toda criatura alada que se move em enxames e tem quatro pés é detestável para vocês.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “criatura rastejante que voa”. A expressão hebraica abrange amplamente criaturas aladas que se movem em enxames, sobretudo insetos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “quatro pés”; também se pode traduzir “quatro pernas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Mas todo
  rationale: 'A conjunção וְ pode significar “e”, mas aqui introduz contraste com a exceção permitida no versículo anterior; כֹל tem força distributiva: “todo”.'
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: inseto alado
  rationale: A expressão hebraica designa amplamente pequenas criaturas voadoras que se movem em enxames, sobretudo insetos. “Inseto alado” é natural e claro em português, embora a categoria hebraica não corresponda exatamente à taxonomia moderna.
- source_word: אֲשֶׁר ל/וֹ
  choice: que anda sobre
  rationale: Literalmente, a construção significa “que tem”. Em português, “anda sobre quatro pés” exprime naturalmente a característica corporal e o modo de locomoção pressupostos pelo contexto imediato.
- source_word: אַרְבַּע רַגְלָיִם
  choice: quatro pés
  rationale: רַגְלַיִם pode designar pés ou pernas. “Pés” preserva mais de perto a formulação hebraica, enquanto a nota registra a alternativa natural “pernas”.
- source_word: שֶׁקֶץ הוּא לָ/כֶם
  choice: será detestável para vocês
  rationale: שֶׁקֶץ indica algo repulsivo e proibido no contexto alimentar. O futuro “será” dá à frase a força normativa da legislação, e “para vocês” preserva os destinatários explícitos.
theological_decisions:
- issue: Força normativa da oração nominal שֶׁקֶץ הוּא לָכֶם
  choice: será detestável para vocês
  alternative: é detestável para vocês
  rationale: Embora o hebraico não expresse o verbo, o contexto legal permite presente ou futuro normativo. O futuro soa natural na formulação legislativa portuguesa sem transformar a categoria ritual em uma afirmação zoológica universal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Inseto alado” comunica a referência contextual sem sugerir que a categoria hebraica seja uma classificação científica moderna. As notas preservam a amplitude lexical do original e a formulação literal “quatro pés”.
