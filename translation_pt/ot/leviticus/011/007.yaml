source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: pt
  text: E o porco[a], porque tem o casco fendido e completamente dividido, mas não rumina[b], é impuro para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suíno”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não traz de volta o alimento ruminado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזִיר
  choice: o porco
  rationale: “Porco” é o termo comum, atual e abrangente em português para a espécie; “suíno” é mais técnico.
- source_word: כִּי
  choice: embora
  rationale: Neste contexto, a partícula introduz a característica que o animal possui em contraste com a que lhe falta; “embora” expressa naturalmente essa relação concessiva em português.
- source_word: מַפְרִיס פַּרְסָה
  choice: tenha o casco dividido
  rationale: Expressão portuguesa natural que descreve o estado do casco, preservando a imagem do hebraico.
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: com uma fenda que o separa
  rationale: Mantém a segunda descrição enfática do hebraico sem produzir uma repetição obscura em português.
- source_word: גֵּרָה לֹא יִגָּר
  choice: não rumina
  rationale: “Ruminar” é o equivalente corrente e preciso do idioma hebraico que, literalmente, fala em fazer subir o alimento ruminado.
- source_word: טָמֵא הוּא לָכֶם
  choice: ele é impuro para vocês
  rationale: Preserva a categoria ritual e alimentar de Levítico e a relação explícita com os destinatários.
theological_decisions:
- issue: Natureza de טָמֵא na legislação alimentar
  choice: impuro no sentido ritual e alimentar
  alternative: imundo; contaminado
  rationale: O contexto classifica animais segundo as leis alimentares dadas a Israel, sem caracterizar o animal como moralmente mau. “Impuro” comunica a categoria cultual com clareza.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva as duas descrições hebraicas do casco e torna explícito, por meio de “embora”, o contraste entre a característica presente e a ausente.
