base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: pt
  text: Não comam nada da carne deles nem toquem em suas carcaças[a]; eles são impuros para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus corpos mortos”. O termo hebraico refere-se à carcaça de um animal.'
    reason: Alternativa lexical para נְבֵלָה; a nota é ancorada em “carcaças”, o termo a que se refere.
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: nada da carne deles
  rationale: 'O מִן tem sentido partitivo neste contexto: é proibido comer qualquer porção da carne desses animais. “Carne” preserva o sentido corporal e é natural em português.'
- source_word: לֹא תֹאכֵלוּ
  choice: não comam
  rationale: O imperfeito em instrução legal expressa uma proibição. O imperativo negativo é direto, atual e mantém plenamente a força normativa.
- source_word: וּבְנִבְלָתָם
  choice: nem toquem em suas carcaças
  rationale: נְבֵלָה designa o corpo morto de um animal. “Carcaças” é preciso neste contexto e evita sugerir cadáveres humanos; “nem” liga naturalmente as duas proibições coordenadas.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: eles são impuros para vocês
  rationale: “Impuros” expressa a categoria ritual de טָמֵא, sem confundi-la com sujeira física ou maldade moral. “Para vocês” preserva a relação indicada por לָכֶם.
theological_decisions:
- issue: Natureza da impureza na legislação alimentar levítica
  choice: impuros
  alternative: imundos
  rationale: A formulação conserva a categoria ritual do texto sem introduzir conclusões sobre culpa moral ou sobre a aplicação posterior dessas leis. “Impuros” é claro e digno no português contemporâneo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A forma plural “não comam” comunica a proibição legal sem recorrer ao futuro solene e menos natural “não comereis”. O referente animal permanece explícito por meio de “carcaças”.
