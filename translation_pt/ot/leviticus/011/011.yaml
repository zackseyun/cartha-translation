id: LEV.11.11
reference: Leviticus 11:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: pt
  text: E serão detestáveis[a] para vocês; não comam nada da carne deles e considerem detestáveis as suas carcaças.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abomináveis”. O termo hebraico indica algo ritualmente repulsivo ou detestável neste contexto alimentar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: detestáveis
  rationale: O substantivo designa algo ritualmente repulsivo ou detestável no contexto das leis alimentares. A forma adjetiva produz uma construção natural em português e evita confundi-lo com outros termos hebraicos específicos para impureza.
- source_word: יִהְיוּ לָכֶם
  choice: serão ... para vocês
  rationale: Preserva o verbo e o complemento dativo, indicando como os israelitas devem considerar esses animais.
- source_word: מִבְּשָׂרָם
  choice: nada da carne deles
  rationale: 'Depois de um verbo de comer negado, a preposição מִן tem sentido partitivo: não se deve comer porção alguma da carne deles.'
- source_word: לֹא תֹאכֵלוּ
  choice: não comam
  rationale: O imperfeito negado tem força de proibição no texto legal. O imperativo negativo comunica essa força de modo claro e natural no português atual.
- source_word: נִבְלָתָם
  choice: as suas carcaças
  rationale: נְבֵלָה se refere ao corpo morto de um animal; “carcaças” é preciso e idiomático neste contexto.
- source_word: תְּשַׁקֵּצוּ
  choice: considerem detestáveis
  rationale: O Piel cognato de שֶׁקֶץ indica tratar ou considerar algo detestável, não apenas sentir aversão emocional. A formulação também conserva a repetição lexical do hebraico.
theological_decisions:
- issue: Natureza da linguagem de repulsa nas leis alimentares
  choice: Empregar linguagem de repulsa ritual (“detestáveis”)
  alternative: Empregar “abomináveis” ou simplificar para “impuros”
  rationale: “Detestáveis” mantém a forte avaliação negativa própria da distinção alimentar da aliança sem transformar automaticamente a categoria em condenação moral geral; “impuros” enfraqueceria o termo e o confundiria com outro vocabulário hebraico.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade brasileira ampla. O ponto e vírgula e a conjunção inicial preservam a estrutura encadeada do hebraico; a repetição de “detestáveis” reproduz a relação entre o substantivo e o verbo cognato.
