lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (tinshemet)
  choice: a coruja
  rationale: A identificação zoológica exata é incerta; “coruja” preserva a identificação tradicional e oferece ao leitor moderno uma categoria de ave reconhecível, sem acrescentar uma espécie específica não demonstrável.
- source_word: הַקָּאָת (qa’at)
  choice: o pelicano
  rationale: “Pelicano” é a identificação tradicional e lexicalmente plausível, embora a espécie antiga exata permaneça incerta.
- source_word: הָרָחָם (racham)
  choice: o abutre
  rationale: O termo designa provavelmente uma ave necrófaga, com frequência identificada como o abutre-do-egito; a forma genérica evita precisão zoológica excessiva.
