  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: pt
  text: a pequena coruja[a], o corvo-marinho e a grande coruja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata dessas aves é incerta. “Pequena coruja”, “corvo-marinho” e “grande coruja” são traduções tradicionais ou acadêmicas plausíveis; outras possibilidades são “coruja” ou “mocho” para כּוֹס, “pelicano” para שָׁלָךְ e “coruja-de-chifres” ou “bufo-real” para יַנְשׁוּף.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: a coruja-pequena
  rationale: O termo designa uma ave impura, provavelmente uma espécie de coruja, mas sua identificação exata é incerta. “Coruja-pequena” preserva a provável especificidade zoológica sem ocultar a incerteza, registrada em nota.
- source_word: הַשָּׁלָךְ
  choice: o corvo-marinho
  rationale: A identificação é discutida; “corvo-marinho” é uma equivalência tradicional plausível para uma ave aquática mergulhadora. A possibilidade de “pelicano” é mantida na nota.
- source_word: הַיַּנְשׁוּף
  choice: a coruja-grande
  rationale: O termo provavelmente indica uma ave noturna de grande porte. “Coruja-grande” comunica essa distinção sem afirmar uma espécie moderna exata.
- source_word: וְאֶת
  choice: e
  rationale: A repetição da conjunção com o marcador de objeto dá continuidade à lista. Em português natural, usam-se vírgulas e a conjunção antes do último item.
