id: LEV.11.5
reference: Leviticus 11:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: pt
  text: E o hírax[a], porque rumina, mas não tem o casco fendido, é impuro para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hírax-das-rochas”; tradicionalmente, “coelho-das-rochas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: o hirax
  rationale: O hebraico designa provavelmente o pequeno mamífero rupícola hoje identificado como hirax. O termo é zoologicamente mais preciso que “texugo-das-rochas”, nome tradicional que pode sugerir erroneamente um tipo de texugo.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da classificação e preserva claramente o valor causal.
- source_word: מַעֲלֵה גֵרָה
  choice: rumina
  rationale: Expressa de modo natural e conciso o idioma hebraico que literalmente significa “faz subir o bolo alimentar”.
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: mas não tem o casco fendido
  rationale: Reproduz a característica contrastante em português natural; embora o hebraico diga mais literalmente “não fende o casco”, a construção escolhida comunica o mesmo critério classificatório.
- source_word: טָמֵא
  choice: impuro
  rationale: No contexto das normas alimentares levíticas, indica condição ritual ou cultual, não maldade moral intrínseca.
- source_word: לָכֶם
  choice: para vocês
  rationale: Indica que essa classificação se aplica à comunidade a quem a norma é dirigida, em linguagem moderna e amplamente compreensível.
theological_decisions:
- issue: Natureza de טָמֵא nas normas alimentares de Levítico
  choice: impuro em sentido ritual ou cultual
  alternative: moralmente impuro
  rationale: Em Levítico 11, o termo pertence ao sistema de pureza ritual. A tradução preserva essa categoria sem atribuir maldade moral ao animal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Hirax” conserva a identificação zoológica mais provável; a nota registra nomes alternativos. O contraste hebraico foi vertido com “mas”, natural em português.
