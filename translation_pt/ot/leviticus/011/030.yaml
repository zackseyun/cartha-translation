  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: pt
  text: a lagartixa[a], o lagarto-monitor, o lagarto, o lagarto-da-areia e o camaleão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A identificação exata de vários animais deste versículo é incerta. Entre as propostas tradicionais e modernas estão: para “lagartixa”, talvez “furão” ou “musaranho”; para “lagarto-monitor”, talvez “camaleão”; para “lagarto-da-areia”, talvez “escinco” ou, na tradição antiga, “caracol”; e para “camaleão”, talvez “toupeira” ou outra espécie de lagarto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: a lagartixa
  rationale: A identificação zoológica exata é incerta. No contexto dos animais rastejantes, um pequeno réptil é mais provável que um mamífero; “lagartixa” é natural e amplamente compreensível em português.
- source_word: הַכֹּחַ
  choice: o lagarto-monitor
  rationale: O termo parece indicar um lagarto de maior porte. “Lagarto-monitor” oferece um equivalente zoológico moderno plausível e o distingue dos demais lagartos da lista.
- source_word: הַלְּטָאָה
  choice: o lagarto
  rationale: A tradução genérica evita afirmar uma espécie que o hebraico não permite identificar com segurança.
- source_word: הַחֹמֶט
  choice: o lagarto-da-areia
  rationale: No contexto de uma lista de répteis rastejantes, a identificação como lagarto é mais coerente que a tradução tradicional “caracol”, embora a espécie permaneça incerta.
- source_word: הַתִּנְשָׁמֶת
  choice: o camaleão
  rationale: Embora o mesmo termo hebraico designe uma ave em outro contexto, aqui a posição na lista favorece um réptil. “Camaleão” é uma identificação contextual comum, sem eliminar a incerteza lexical.
