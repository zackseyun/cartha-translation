base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: pt
  text: Pois eu sou Javé, que fiz vocês subirem[a] da terra do Egito para ser o Deus de vocês. E sejam santos[b], porque eu sou santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “que faz vocês subirem”. O hebraico usa um particípio, embora se refira ao êxodo, um acontecimento passado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “E vocês serão santos, pois eu sou santo”.'
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega uma forma portuguesa corrente do nome divino, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: הַמַּעֲלֶה
  choice: que fiz vocês subirem
  rationale: O particípio hebraico significa literalmente aquele que faz subir. Como a referência é ao êxodo já ocorrido, o passado é natural em português, sem apagar a imagem de subida.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Mantém o substantivo explícito terra e a fórmula ligada ao êxodo.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: para ser o Deus de vocês
  rationale: Expressa com naturalidade a fórmula relacional da aliança e conserva o possessivo plural.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: E sejam santos
  rationale: Verte a forma contextual como exortação ou ordem, preservando a conjunção hebraica e usando uma construção portuguesa direta.
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: porque eu sou santo
  rationale: 'Torna clara a relação causal: a santidade exigida do povo se fundamenta na santidade de Deus.'
theological_decisions:
- issue: Fundamento pactual da santidade
  choice: A exigência de santidade é ligada à identidade de Javé, ao êxodo e à relação em que ele é o Deus de Israel.
  alternative: Entender a frase apenas como regra de pureza ritual, sem alcance pactual mais amplo.
  rationale: Embora o contexto imediato trate de alimentos e pureza, o próprio versículo fundamenta a ordem no êxodo, na relação com Deus e na santidade divina.
- issue: Força de וִהְיִיתֶם
  choice: sejam santos
  alternative: vocês serão santos
  rationale: No contexto, a forma tem força injuntiva, mas o hebraico também pode ser representado mais formalmente pelo futuro; a nota conserva essa possibilidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” explicita o plural e evita a ambiguidade regional de “vós”; “Javé” preserva o nome divino. A formulação mantém a imagem de subir do Egito e a relação causal entre a santidade divina e a do povo.
