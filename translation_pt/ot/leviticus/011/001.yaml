  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֥ר אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: pt
  text: 'Yahweh[a] falou a Moisés e a Arão, dizendo-lhes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma consonantal hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O imperfeito consecutivo de דבר introduz um novo acontecimento narrativo; “falou” preserva o caráter formular e solene da fala divina em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A preposição אֶל marca os destinatários da fala. Em português, sua repetição antes de Arão pode ser omitida naturalmente sem perder a coordenação dos dois destinatários.
- source_word: לֵאמֹר אֲלֵהֶם
  choice: dizendo-lhes
  rationale: Reúne de modo natural o marcador introdutório לֵאמֹר e o objeto pronominal אֲלֵהֶם, preservando explicitamente que a fala seguinte se dirige aos dois.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o tom narrativo e jurídico-sacerdotal de Levítico; “dizendo-lhes” conserva um elemento explícito do hebraico sem tornar a frase artificial.
