  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: pt
  text: E todo aquele que carregar qualquer uma das carcaças deles lavará suas roupas e será impuro até o anoitecer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carregar das carcaças deles”. A construção hebraica pode ser traduzida mais literalmente dessa forma, mas “qualquer uma das carcaças deles” comunica melhor, em português natural, o sentido distributivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: E todo aquele que carregar
  rationale: A conjunção liga esta norma ao contexto anterior; כָּל com o particípio tem sentido distributivo e universal. “Todo aquele que carregar” preserva esse alcance e soa natural em português jurídico-narrativo.
- source_word: מִ/נִּבְלָתָ/ם
  choice: qualquer uma das carcaças deles
  rationale: נְבֵלָה designa a carcaça de um animal no contexto das leis de pureza. Após נָשָׂא, a preposição מִן admite uma leitura partitiva; esta formulação transmite naturalmente que a regra se aplica a qualquer carcaça pertencente ao grupo de animais mencionado.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: lavará suas roupas
  rationale: O imperfeito expressa aqui uma obrigação legal. O futuro do presente é corrente em formulações legais bíblicas em português, e “roupas” é atual e claro.
- source_word: וְ/טָמֵא
  choice: e ficará impuro
  rationale: No contexto, טָמֵא indica estado de impureza ritual, não culpa moral. “Ficará impuro” explicita o resultado do contato sem acrescentar uma avaliação moral.
- source_word: עַד הָ/עָרֶב
  choice: até a tarde
  rationale: A expressão delimita a duração da impureza. “Até a tarde” reproduz de modo natural o artigo hebraico e a referência temporal.
theological_decisions:
- issue: Forma masculina singular em uma norma legal de aplicação geral
  choice: “todo aquele” e “suas roupas”
  alternative: “quem” e “as próprias roupas”
  rationale: O hebraico apresenta um indivíduo representativo no masculino singular. A tradução mantém essa forma gramatical sem restringir explicitamente a aplicação da norma apenas a homens.
- issue: Natureza da impureza indicada por טָמֵא
  choice: “ficará impuro”
  alternative: “ficará ritualmente impuro”
  rationale: O contexto levítico deixa claro que se trata de impureza ritual. Manter apenas “impuro” preserva a concisão do original e evita inserir no texto uma explicação interpretativa desnecessária.
translation_notes:
  register: Português moderno, digno e acessível, com cadência adequada ao estilo legal de Levítico. Emprega-se “carcaças” para restos de animais e “impuro” no sentido ritual estabelecido pelo contexto.
