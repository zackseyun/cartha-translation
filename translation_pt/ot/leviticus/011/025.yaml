  source_fidelity: 'A tradução reproduz adequadamente a estrutura normativa: o universal distributivo, o ato de carregar, a lavagem das roupas e a duração da impureza. Contudo, a alternância entre «carregar» e «ficará impuro» é menos direta que o hebraico, cujo segundo predicado descreve o estado resultante («será/estará impuro»).'
  naturalness: O texto é claro e natural em português moderno. «Até o anoitecer» é mais preciso e idiomático neste contexto cultual do que «até a tarde», pois עַד הָעָרֶב normalmente aponta para o cair da noite/entardecer, marco temporal recorrente nas leis de pureza.
  terminology: «Carcaças» é adequado para נְבֵלָה no contexto de animais. «Impuro» mantém corretamente o termo técnico sem impor interpretação doutrinária. «Roupas» é natural; «suas» é aceitável para o singular genérico.
