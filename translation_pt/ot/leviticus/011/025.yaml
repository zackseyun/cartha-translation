  - severity: low
    issue: «ficará impuro»
    rationale: Embora possível em português, «será impuro» reflete mais diretamente o predicado hebraico וְטָמֵא e o estado legal declarado. Evita sugerir desnecessariamente uma mudança de estado distinta do resultado já pressuposto pelo ato.
  - severity: low
