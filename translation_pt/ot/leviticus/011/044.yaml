  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: pt
  text: Pois eu sou Yahweh, o Deus de vocês. Portanto, consagrem-se[a] e sejam santos, porque eu sou santo. Não se contaminem com nenhuma criatura que fervilha e se move sobre a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “santifiquem-se”. O verbo hebraico é reflexivo e indica que eles devem separar-se para a santidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não se tornem impuros com nenhum animal rastejante que se move sobre a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino como nome próprio, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: O contexto da fórmula da aliança exige o singular; esta formulação é clara e natural no português brasileiro contemporâneo.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: consagrem-se
  rationale: 'O hitpael tem sentido reflexivo: o povo deve separar-se para a santidade. “Consagrem-se” preserva tanto a dimensão cultual quanto a ética.'
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: e sejam santos
  rationale: Expressa de modo idiomático o estado requerido como resultado da consagração e mantém a força exortativa do contexto.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: É o equivalente teológico e lexical estabelecido, preservando a ligação verbal entre a santidade de Deus e a do povo.
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  choice: se contaminem
  rationale: Traduz a construção reflexivamente, sem reduzir נֶפֶשׁ a uma “alma” distinta do corpo; comunica a impureza ritual e pessoal.
- source_word: שֶּׁרֶץ
  choice: criatura que fervilha
  rationale: Retém a ideia de criaturas que pululam ou enxameiam, sem restringir indevidamente o termo a um modo específico de locomoção.
- source_word: הָרֹמֵשׂ
  choice: se move
  rationale: Mantém a amplitude do particípio hebraico, evitando especificar apenas rastejar ou engatinhar.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Reproduz de maneira direta a esfera terrestre em que essas criaturas se movem.
theological_decisions:
- issue: Relação entre a santidade de Deus e a obrigação de seu povo
  choice: Usar “santo/santos” nas duas ocorrências
  alternative: Traduzir uma ou ambas por “separado(s)”
  rationale: A repetição do mesmo grupo lexical fundamenta a santidade exigida do povo na própria santidade de Deus; a repetição em português preserva essa ligação.
- issue: Sentido de נַפְשֹׁתֵיכֶם na proibição
  choice: Expressar reflexivamente como “se contaminem”
  alternative: “contaminem as suas almas” ou “tornem impuras as suas vidas”
  rationale: Aqui נֶפֶשׁ designa as próprias pessoas, não estabelece uma antropologia técnica. A construção reflexiva evita importar uma distinção doutrinária entre corpo e alma.
translation_notes:
  register: Português atual, digno e de leitura natural no Brasil, sem regionalismos marcados. Empregam-se “vocês” e imperativos correspondentes para ampla inteligibilidade brasileira. “Yahweh” preserva a transliteração do nome divino. A coordenação e a repetição de “santo” mantêm a estrutura e a lógica teológica do hebraico.
