  naturalness: A revisão mantém português moderno e claro. Dois-pontos após a oração relativa reproduzem de modo fluente a passagem da condição para a consequência, sem criar o acréscimo semântico de «juntamente com».
  terminology: «Recipiente de barro» é aceitável para כְּלִי חֶרֶשׂ. A nota registra que se trata mais especificamente de cerâmica/argila cozida, sem exigir uma opção menos natural no corpo do texto. «Impuro» preserva adequadamente o termo técnico ritual.
