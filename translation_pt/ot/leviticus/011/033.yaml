  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: pt
  text: 'Todo recipiente de barro em que cair algum deles: tudo o que estiver dentro dele ficará impuro, e vocês deverão quebrá-lo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: recipiente de barro
  rationale: כְּלִי designa um objeto ou recipiente, e חֶרֶשׂ especifica que é feito de barro/cerâmica. “Recipiente de barro” é claro, natural e conserva a relevância ritual do material.
- source_word: יִפֹּל מֵהֶם
  choice: cair algum deles
  rationale: O pronome plural retoma os animais rastejantes mortos mencionados no contexto anterior. “Algum deles” expressa naturalmente o sentido distributivo sem acrescentar uma identificação ausente no versículo.
- source_word: אֶל תּוֹכוֹ
  choice: em que
  rationale: A construção indica movimento para o interior do recipiente. Em português, “em que cair” comunica isso de modo idiomático e conciso.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: tudo o que estiver dentro dele
  rationale: Preserva a abrangência de כֹּל e explicita com naturalidade que a norma alcança todo o conteúdo do recipiente.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: No contexto levítico, טמא denota impureza ritual. “Ficará impuro” comunica o estado resultante do contato, sem sugerir impureza moral.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: vocês deverão quebrá-lo
  rationale: A forma verbal plural dirige a obrigação à comunidade. “Deverão” expressa a força normativa, e “quebrá-lo” mantém o objeto enfatizado no hebraico sem recorrer a um verbo excessivamente forte.
theological_decisions:
- issue: Natureza da impureza
  choice: “impuro” em sentido ritual
  alternative: “contaminado” ou impureza moral
  rationale: O vocabulário e o contexto de Levítico 11 tratam de condição ritual. A tradução mantém o termo tradicional e não introduz uma avaliação moral.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação foi reorganizada para evitar a possível leitura de que somente o conteúdo, e não o recipiente, fica impuro; “juntamente com” torna explícito que ambos ficam impuros, conforme a sintaxe e o contexto.
