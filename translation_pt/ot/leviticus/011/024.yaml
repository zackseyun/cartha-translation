  text: וּ/לְ/אֵ֖לֶּה תִּטַּמָּ֑אוּ כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: pt
  text: 'E por estes[a] vocês se tornarão impuros: todo aquele que tocar no cadáver deles[b] ficará impuro até a tarde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E quanto a estes, vocês se tornarão impuros”. A frase inicial pode introduzir de modo mais geral a categoria seguinte, em vez de indicar estritamente o meio pelo qual alguém se torna impuro.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz o substantivo no singular, “o cadáver deles”; também se pode traduzir “os cadáveres deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: E por estes
  rationale: A combinação de ו com ל e o demonstrativo pode indicar meio ou introduzir o assunto seguinte. “Por estes” comunica naturalmente que o contato com esses animais produz impureza, sem eliminar a alternativa mais geral registrada em nota.
- source_word: תִּטַּמָּאוּ
  choice: vocês se tornarão impuros
  rationale: O imperfeito hitpael, na segunda pessoa do plural, indica a entrada em estado de impureza ritual. A formulação evita sugerir culpa moral.
- source_word: כָּל הַנֹּגֵעַ
  choice: todo aquele que tocar
  rationale: O particípio singular com כָּל tem sentido genérico e universal. Esta construção é clara, digna e corrente em português.
- source_word: בְּנִבְלָתָם
  choice: no cadáver deles
  rationale: נְבֵלָה designa o corpo morto de um animal. O singular com sufixo plural foi preservado; “cadáver” é preciso no contexto, embora “carcaça” também seja possível.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: O verbo singular concorda com o sujeito genérico. “Ficará impuro” expressa o estado ritual resultante do contato.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: A expressão delimita a duração da impureza ritual. “Até a tarde” preserva o artigo hebraico e é idiomático em português.
theological_decisions:
- issue: Natureza da linguagem de impureza na legislação de santidade
  choice: Traduzir טמא com linguagem de impureza ritual, não de culpa moral
  alternative: “contaminar-se” ou “ficar imundo”
  rationale: O versículo trata do estado cultual decorrente do contato com cadáveres de animais. “Impuro” preserva essa categoria sem acrescentar condenação moral.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e mantém um tom jurídico-religioso claro e digno. “Impuro” é usado em sentido ritual; as notas preservam as ambiguidades sintáticas e numéricas genuínas do hebraico.
