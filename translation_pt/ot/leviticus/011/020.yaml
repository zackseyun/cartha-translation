base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: pt
  text: Toda criatura alada que se move em enxames e anda sobre quatro pernas é detestável para vocês.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Toda criatura voadora que se move em enxames”. O hebraico pode designar criaturas voadoras de modo amplo, não apenas aves.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “anda sobre quatro”. Os versículos seguintes estabelecem uma exceção para certos insetos com pernas articuladas para saltar.'
    reason: cultural_note
  - marker: c
    text: Ou “é uma abominação para vocês”. O termo indica algo ritualmente detestável no contexto das leis alimentares.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Todo
  rationale: 'Expressa naturalmente em português a abrangência distributiva da norma: cada membro dessa classe está incluído.'
- source_word: שֶׁרֶץ הָעוֹף
  choice: inseto alado
  rationale: No contexto imediato, a expressão designa pequenas criaturas voadoras, especialmente insetos, como mostram as exceções dos versículos seguintes. “Alado” evita restringir עוֹף a aves.
- source_word: הַהֹלֵךְ
  choice: que anda
  rationale: O particípio descreve o modo habitual de locomoção; “anda” é simples, natural e fiel.
- source_word: עַל אַרְבַּע
  choice: sobre quatro pernas
  rationale: Mantém de perto o hebraico, que diz literalmente “sobre quatro”, explicitando “pernas” em português. Os versículos seguintes esclarecem a anatomia e as exceções pertinentes.
- source_word: שֶׁקֶץ
  choice: detestável
  rationale: No contexto das leis alimentares, indica algo que deve ser tido como repulsivo e ritualmente impróprio. “Detestável” preserva sua força sem confundi-lo simplesmente com o termo geral para “impuro”.
- source_word: לָכֶם
  choice: para vocês
  rationale: 'Expressa a relação normativa com os israelitas: essas criaturas devem ser consideradas detestáveis por eles.'
theological_decisions:
- issue: Força ritual de שֶׁקֶץ
  choice: detestável
  alternative: abominação
  rationale: “Detestável” comunica a repulsa prescrita no âmbito das leis alimentares sem sugerir, por si só, uma categoria moral mais ampla do que o contexto estabelece.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” torna explícito o plural de לָכֶם. A formulação conserva a linguagem classificatória do texto legal sem impor taxonomia zoológica moderna rígida.
