source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: pt
  text: 'Mas, dentre os animais que ruminam ou têm o casco fendido[a], vocês não comerão estes: o camelo, pois rumina, mas não tem o casco fendido; ele é impuro para vocês.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dividem o casco”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “impuro para vocês”, isto é, impuro para Israel segundo as leis alimentares.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Marca a restrição ou exceção à regra anterior de modo natural e preserva a força adversativa do hebraico.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: dentre os animais que ruminam
  rationale: Expressa com clareza a locução hebraica que, literalmente, descreve o ato de fazer subir o alimento ruminado.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: ou têm o casco fendido
  rationale: Representa a segunda característica classificatória. O valor disjuntivo contextual deixa claro que os exemplos seguintes possuem apenas uma das duas características exigidas.
- source_word: הַגָּמָל
  choice: o camelo
  rationale: Equivalente direto e corrente do animal mencionado.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: pois rumina
  rationale: Apresenta de forma idiomática a característica que poderia fazer o camelo parecer permitido segundo um dos critérios.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: mas não tem o casco fendido
  rationale: Preserva o contraste entre a ruminação e a ausência da segunda característica exigida.
- source_word: טָמֵא הוּא לָכֶם
  choice: ele é impuro para vocês
  rationale: Mantém o termo central da linguagem levítica de pureza e conserva a perspectiva legal dirigida aos israelitas, sem restringi-lo no texto principal a uma explicação interpretativa.
theological_decisions:
- issue: Natureza da impureza nas leis alimentares levíticas
  choice: impuro
  alternative: ritualmente impuro; cerimonialmente impuro
  rationale: O hebraico טָמֵא classifica o animal no sistema de pureza de Israel. O texto principal mantém o termo bíblico amplo, enquanto a nota esclarece seu contexto legal sem reduzir seu alcance lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção “vocês não comerão” preserva o tom normativo, enquanto “ruminam” e “casco fendido” comunicam naturalmente os critérios alimentares.
