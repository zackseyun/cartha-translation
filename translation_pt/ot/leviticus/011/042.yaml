  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: pt
  text: Tudo o que anda sobre o ventre[a], tudo o que anda sobre quatro patas, incluindo tudo o que tem muitas patas, entre todos os seres rastejantes que rastejam sobre a terra[b], vocês não comerão, pois são repugnantes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «rasteja sobre o ventre».'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente «todo ser rastejante que rasteja», repetição que enfatiza essa categoria de seres.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «são uma abominação».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: tudo o que
  rationale: Empregado distributivamente para abranger cada ser pertencente às categorias enumeradas; a expressão é natural em português e preserva a abrangência do hebraico.
- source_word: הוֹלֵךְ עַל גָּח
  choice: se move sobre o ventre
  rationale: Descreve o modo de locomoção sem restringi-lo necessariamente ao verbo português «rastejar»; a alternativa é registrada em nota.
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: anda sobre quatro patas
  rationale: Torna explícito o membro corporal subentendido pelo numeral hebraico e produz uma formulação clara em português.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: incluindo tudo o que tem muitas patas
  rationale: עַד amplia aqui a enumeração até os seres de numerosas patas. «Incluindo» comunica com naturalidade esse valor inclusivo, sem sugerir uma escala rígida.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: entre todos os seres rastejantes que rastejam
  rationale: Mantém, em português inteligível, a repetição enfática do substantivo e do particípio cognatos no hebraico. «Seres» evita limitar a categoria a uma classificação zoológica moderna.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Equivalente direto que se ajusta à linguagem abrangente de classificação, embora «sobre o chão» também seja possível no contexto.
- source_word: לֹא תֹאכְלֻם
  choice: vocês não comerão
  rationale: Preserva a força proibitiva e o registro legal do imperfeito hebraico com negação, usando uma forma natural no português moderno.
- source_word: שֶׁקֶץ
  choice: repugnantes
  rationale: Expressa forte repulsa no contexto das leis alimentares sem acrescentar uma interpretação doutrinária; «abominação» permanece como alternativa lexical em nota.
theological_decisions:
- issue: Natureza da proibição na legislação de pureza
  choice: Apresentar diretamente a proibição alimentar no contexto levítico, sem comentar sua aplicabilidade posterior.
  alternative: Caracterizá-la como preceito moral universal ou reduzi-la a mero tabu cultural.
  rationale: O texto hebraico formula uma proibição legal direta. A tradução não deve decidir debates canônicos ou doutrinários que o próprio versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para o plural da proibição e conserva a estrutura enumerativa e a repetição expressiva do hebraico sem recorrer a terminologia zoológica técnica.
