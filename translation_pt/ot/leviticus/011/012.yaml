base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: pt
  text: Tudo o que, na água, não tem barbatanas nem escamas é detestável para vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é uma abominação para vocês”. Neste contexto de leis alimentares, o hebraico שֶׁקֶץ indica algo ritualmente detestável ou abominável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tudo o que
  rationale: Expressa naturalmente em português a categoria abrangente introduzida por כֹּל e ligada pela partícula relativa אֲשֶׁר.
- source_word: אֵין לוֹ
  choice: não tem
  rationale: Reproduz de modo idiomático a construção existencial negativa com sentido de posse.
- source_word: סְנַפִּיר
  choice: barbatanas
  rationale: Embora o hebraico use o singular genérico, o plural é natural em português para classificar animais aquáticos.
- source_word: קַשְׂקֶשֶׂת
  choice: escamas
  rationale: O singular hebraico tem valor coletivo ou genérico; o plural português é a forma zoológica habitual.
- source_word: בַּמָּיִם
  choice: na água
  rationale: מַיִם tem forma plural em hebraico, mas neste contexto corresponde naturalmente ao singular coletivo português “água”.
- source_word: שֶׁקֶץ
  choice: repugnante
  rationale: Comunica a forte ideia de algo ritualmente detestável ou abominável no contexto das leis alimentares, sem confundi-la com o vocabulário hebraico específico de impureza.
- source_word: הוּא
  choice: será
  rationale: Na cláusula nominal, o pronome reforça a predicação. O futuro português é idiomático em formulações legais e mantém a força normativa do contexto.
- source_word: לָכֶם
  choice: para vocês
  rationale: Mantém a aplicação direta da norma aos israelitas interpelados, em português moderno e amplamente compreensível.
theological_decisions:
- issue: Terminologia de status ritual para שֶׁקֶץ no contexto alimentar
  choice: repugnante
  alternative: abominação
  rationale: “Repugnante” preserva a forte avaliação ritual do termo e permanece claro em linguagem moderna. “Abominação” também é possível, mas pode soar mais tradicional ou carregar associações teológicas mais amplas; “impuro” não foi usado porque confundiria שֶׁקֶץ com outra terminologia hebraica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade brasileira. A construção “Tudo o que vive na água” explicita de modo mínimo e contextual que a norma se refere a seres aquáticos; “nem... nem...” apresenta naturalmente a ausência dos dois critérios exigidos.
