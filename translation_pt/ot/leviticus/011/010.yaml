  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: pt
  text: Mas tudo o que não tem barbatanas e escamas nos mares e nos cursos de água[b], entre todos os animais que fervilham nas águas e entre todas as criaturas vivas que nelas há, é detestável para vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é uma abominação para vocês”. O termo hebraico designa, neste contexto de leis alimentares, algo ritualmente repulsivo ou detestável.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode ser traduzida como “rios”, “riachos” ou “uádis”; refere-se de modo amplo a cursos de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Mas tudo o que
  rationale: O וְ introduz aqui o contraste com os animais aquáticos permitidos do versículo anterior; “mas” explicita naturalmente essa força contextual, e “tudo” preserva o alcance abrangente de כֹל.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: que [...] não tem
  rationale: Reproduz de modo direto e natural a oração relativa hebraica que indica a ausência das características exigidas.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: barbatanas e escamas
  rationale: São os dois sinais anatômicos cumulativamente exigidos; o plural é idiomático em português, e “e” preserva a conjunção aditiva.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: nos mares e nos cursos de água
  rationale: “Mares” traduz diretamente יַמִּים. “Cursos de água” mantém a amplitude de נְחָלִים, que pode designar riachos, rios ou leitos sazonais, sem restringir indevidamente o referente.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: entre todos os animais que fervilham nas águas
  rationale: “Entre todos” expressa o מִן partitivo; “animais que fervilham” comunica a categoria concreta de seres aquáticos abundantes ou movediços indicada por שֶׁרֶץ, com clareza em português.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: e entre todas as criaturas vivas
  rationale: “Criaturas vivas” verte naturalmente נֶפֶשׁ הַחַיָּה como expressão abrangente de vida animal, evitando o sentido humano estreito que “alma vivente” poderia sugerir.
- source_word: אֲשֶׁר בַּמָּיִם
  choice: que nelas há
  rationale: A formulação retoma naturalmente “águas” e preserva a oração relativa locativa, sem repetição pesada.
- source_word: שֶׁקֶץ
  choice: detestável
  rationale: No contexto das leis alimentares, o termo indica algo ritualmente repulsivo ou abominável; “detestável” mantém a força sem acrescentar a categoria técnica de impureza, que este substantivo não expressa por si só.
- source_word: הֵם לָכֶם
  choice: será detestável para vocês
  rationale: O hebraico apresenta uma oração nominal que define o status desses seres para a comunidade. O singular concorda em português com o abrangente “tudo o que”; o futuro assume de forma natural o valor normativo do contexto legal, embora o presente também seja possível.
theological_decisions:
- issue: Terminologia de status ritual nas leis alimentares
  choice: detestável
  alternative: uma abominação
  rationale: A expressão descreve a classificação alimentar no âmbito da aliança, não necessariamente uma condenação moral geral dos animais. “Detestável” conserva a intensidade ritual e legal de שֶׁקֶץ em linguagem moderna.
- issue: Valor temporal da oração nominal הֵם לָכֶם
  choice: será detestável para vocês
  alternative: é detestável para vocês
  rationale: A oração hebraica não possui verbo expresso e admite uma declaração presente de status. No contexto prescritivo, o futuro normativo é natural em português, mas a nota registra a alternativa formalmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cursos de água” preserva a amplitude geográfica do hebraico; “fervilham” mantém a imagem concreta de שֶׁרֶץ sem recorrer a terminologia excessivamente técnica. Os marcadores aparecem junto às expressões correspondentes no texto.
