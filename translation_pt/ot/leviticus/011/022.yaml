base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: pt
  text: 'Destes, vocês podem comer: a locusta, conforme a sua espécie[a]; o gafanhoto-calvo, conforme a sua espécie; o grilo, conforme a sua espécie; e o gafanhoto, conforme a sua espécie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Não se sabe ao certo quais insetos são designados pelos nomes hebraicos além de “locusta”; traduções tradicionais incluem “gafanhoto-calvo” para סָלְעָם e “grilo” para חַרְגֹּל.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: Destes
  rationale: Introduz de modo natural em português o subconjunto permitido entre os insetos alados mencionados anteriormente.
- source_word: תֹּאכֵלוּ
  choice: vocês podem comer
  rationale: O imperfeito tem valor permissivo no contexto das leis alimentares; a formulação expressa autorização, não obrigação.
- source_word: הָאַרְבֶּה
  choice: a locusta
  rationale: אַרְבֶּה é o termo hebraico mais estabelecido para o gafanhoto migratório. “Locusta” permite distingui-lo de חָגָב, que aparece no mesmo versículo.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: conforme a sua espécie
  rationale: Preserva a fórmula classificatória recorrente na Torá em português claro e atual.
- source_word: הַסָּלְעָם
  choice: o gafanhoto-de-cabeça-lisa
  rationale: A identificação zoológica é incerta. A expressão conserva a associação tradicional com “gafanhoto calvo” de maneira mais natural em português, sem alegar precisão científica.
- source_word: הַחַרְגֹּל
  choice: o grilo
  rationale: “Grilo” é uma identificação tradicional plausível para esse inseto saltador, embora não seja zoologicamente segura.
- source_word: הֶחָגָב
  choice: o gafanhoto
  rationale: חָגָב designa normalmente um inseto do tipo gafanhoto; a tradução é corrente e o distingue de אַרְבֶּה, aqui vertido por “locusta”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A repetição classificatória do hebraico foi mantida, e a incerteza dos nomes zoológicos foi explicitada em nota.
