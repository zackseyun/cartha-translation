  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: pt
  text: Todo alimento que possa ser comido[a], sobre o qual cair água, ficará impuro; e toda bebida que possa ser bebida em qualquer recipiente ficará impura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “que é comido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: Todo alimento
  rationale: A construção partitiva/general introduz a categoria de alimentos abrangida pela norma. “Todo alimento” é natural em português e preserva a abrangência do hebraico.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: que possa ser comido
  rationale: O nifal imperfeito qualifica o alimento como aquilo que pode ou é próprio para ser comido, sem restringir a frase a um ato já consumado.
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: sobre o qual cair água
  rationale: Reproduz de modo natural a imagem hebraica de a água vir sobre o alimento, sem acrescentar um agente que a derrame.
- source_word: יִטְמָא
  choice: ficará impuro / ficará impura
  rationale: No contexto ritual de Levítico, o verbo indica a passagem ao estado de impureza. “Ficará impuro” comunica esse resultado e concorda com os substantivos em português.
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: bebida que possa ser bebida
  rationale: Mantém a correspondência com a formulação paralela sobre o alimento e expressa a categoria do que é próprio para beber.
- source_word: בְּכָל כְּלִי
  choice: em qualquer recipiente
  rationale: כְּלִי é um termo amplo para vaso, utensílio ou recipiente. “Recipiente” é claro no português atual, e “qualquer” comunica a força distributiva de כָּל.
theological_decisions:
- issue: Natureza da impureza indicada por טמא
  choice: impuro
  alternative: cerimonialmente impuro
  rationale: “Impuro” preserva o termo ritual do texto sem inserir na tradução uma explicação interpretativa. O contexto legal de Levítico esclarece a natureza da impureza.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica natural. Conserva o paralelismo entre alimento e bebida e mantém em nota a leitura mais estritamente literal do nifal imperfeito.
