  text: וְ/כֹ֣ל הוֹלֵ֣ךְ עַל כַּפָּ֗י/ו בְּ/כָל הַֽ/חַיָּה֙ הַ/הֹלֶ֣כֶת עַל אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: pt
  text: E todo animal que anda sobre as patas, entre todos os animais que andam de quatro patas,[a] é impuro para vocês. Todo aquele que tocar no cadáver deles[b] ficará impuro até a tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que se locomovem sobre quatro membros”.'
    reason: lexical_alternative
  - marker: b
    text: No hebraico, “cadáver” está no singular com um sufixo plural, em uso coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ
  choice: E todo animal que anda
  rationale: O particípio singular tem valor distributivo e, pelo contexto, refere-se a um animal. A explicitação de “animal” evita que “todo aquele” seja entendido como pessoa.
- source_word: עַל כַּפָּיו
  choice: sobre as patas
  rationale: כַּף designa literalmente a palma ou a parte inferior de uma extremidade; no contexto zoológico, “patas” é a equivalência natural em português.
- source_word: בְּכָל הַחַיָּה
  choice: entre todos os animais
  rationale: Neste contexto das leis alimentares, חַיָּה indica animais terrestres, e não seres vivos em geral.
- source_word: הַהֹלֶכֶת עַל אַרְבַּע
  choice: que andam sobre quatro pés
  rationale: Mantém a referência explícita do hebraico ao número quatro, em formulação compreensível e próxima da estrutura original.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: é impuro para vocês
  rationale: A concordância no singular acompanha naturalmente “todo animal” em português, embora o hebraico retome coletivamente a classe com “eles”. “Impuro” expressa aqui uma condição ritual, não culpa moral.
- source_word: כָּל הַנֹּגֵעַ
  choice: Todo aquele que tocar
  rationale: Formulação distributiva e jurídica, natural no português atual.
- source_word: בְּנִבְלָתָם
  choice: no cadáver deles
  rationale: נְבֵלָה denota o corpo morto de um animal. A expressão conserva o substantivo singular com sufixo plural do hebraico e seu funcionamento coletivo.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: O imperfeito em contexto legal indica a condição ritual resultante do contato; “ficará impuro” comunica essa mudança de estado com clareza.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Tradução direta da expressão temporal hebraica, adequada ao registro legal do texto.
theological_decisions:
- issue: Terminologia de pureza ritual
  choice: impuro
  alternative: contaminado
  rationale: O versículo regula uma condição ritual temporária, não uma culpa moral. “Impuro” preserva essa categoria cultual sem sugerir necessariamente sujeira física ou pecado.
- issue: Concordância entre o indivíduo e a classe coletiva
  choice: “é impuro” no singular, retomado por “deles” coletivamente
  alternative: “todos eles são impuros”
  rationale: A formulação escolhida conserva a força distributiva de “todo animal” e produz concordância natural em português, sem eliminar a referência posterior à classe inteira.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O texto mantém o tom jurídico de Levítico e distingue a impureza ritual de culpa moral. Os marcadores [a] e [b] aparecem no texto principal.
