  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: pt
  text: e a avestruz[a], e o gavião, e a gaivota, e o falcão segundo a sua espécie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação de várias aves neste versículo é incerta. Entre as alternativas tradicionais estão “coruja” para “avestruz”, “coruja” ou “gavião-noturno” para “gavião”, “cuco” para “gaivota” e “gavião” para “falcão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: a avestruz
  rationale: A expressão hebraica é literalmente “filha da ya'anah”, mas funciona nesta lista zoológica como nome de ave. “Avestruz” é a identificação convencional mais provável, embora permaneça incerta.
- source_word: הַתַּחְמָס
  choice: o açor
  rationale: A identificação exata é incerta. “Açor” oferece em português um nome amplo e natural de ave de rapina e evita repetir “falcão” para o termo hebraico seguinte.
- source_word: הַשָּׁחַף
  choice: a gaivota
  rationale: Embora a espécie seja incerta, “gaivota” corresponde a uma identificação amplamente aceita na lexicografia moderna e é imediatamente compreensível.
- source_word: הַנֵּץ
  choice: o falcão
  rationale: O termo designa uma ave de rapina e pode referir-se a um falcão ou gavião. “Falcão” preserva esse campo semântico e distingue este nome de תַּחְמָס.
- source_word: לְמִינֵהוּ
  choice: segundo a sua espécie
  rationale: A expressão classificatória recorrente indica o animal com todas as variedades de seu grupo. Esta formulação é clara, digna e mantém de perto a estrutura hebraica.
- source_word: וְאֵת / וְאֶת
  choice: e
  rationale: A conjunção encadeia cada ave à lista iniciada no versículo anterior; o marcador hebraico de objeto direto não recebe tradução independente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com boa legibilidade brasileira. Mantém-se a repetição de “e” para refletir a estrutura da lista hebraica. A nota explicita a incerteza zoológica sem sobrecarregar o texto principal.
