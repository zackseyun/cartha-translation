source:
  edition: WLC
  text: אֵ֛לֶּה הַ/טְּמֵאִ֥ים לָ/כֶ֖ם בְּ/כָל הַ/שָּׁ֑רֶץ כָּל הַ/נֹּגֵ֧עַ בָּ/הֶ֛ם בְּ/מֹתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: pt
  text: Estes são impuros para vocês dentre todas as criaturas que pululam[a]. Todo aquele que tocar neles quando estiverem mortos[b] ficará impuro até a tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre todas as pequenas criaturas que fervilham”. O termo hebraico abrange pequenas criaturas que rastejam, pululam ou se movem em grande número.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na morte deles”; isto é, enquanto estiverem mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes
  rationale: Pronome demonstrativo plural que retoma os animais enumerados nos versículos anteriores; é direto e natural em português.
- source_word: הַטְּמֵאִים
  choice: impuros
  rationale: Expressa a condição de impureza ritual. “Impuros” é claro e digno no contexto levítico, sem sugerir mera sujeira física.
- source_word: לָכֶם
  choice: para vocês
  rationale: Conserva a relação indicada pelo dativo e torna explícita a aplicação dessas normas à comunidade de Israel.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: entre todos os animais que rastejam
  rationale: שֶׁרֶץ designa amplamente criaturas pequenas que se movem em grande número, rastejam ou fervilham. A formulação mantém uma categoria abrangente e é compreensível em português.
- source_word: כָּל הַנֹּגֵעַ
  choice: Todo aquele que tocar
  rationale: Reproduz o valor distributivo e genérico da construção hebraica em linguagem jurídica natural.
- source_word: בָּהֶם
  choice: neles
  rationale: Retoma diretamente os animais mencionados.
- source_word: בְּמֹתָם
  choice: quando estiverem mortos
  rationale: Indica contato com os animais em seu estado morto, não apenas no instante da morte.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: 'Comunica o resultado do contato: a pessoa passa a ter condição ritual de impureza.'
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Expressa o limite temporal da impureza; “até a tarde” é uma formulação natural e tradicionalmente inteligível em português.
theological_decisions:
- issue: Natureza da impureza
  choice: Usar “impuro” como condição ritual
  alternative: “sujo” ou uma formulação moralizante
  rationale: O contexto trata de pureza ritual; a tradução evita confundir essa condição com sujeira física ou culpa moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o caráter jurídico do texto sem recorrer a construções arcaicas. Os marcadores aparecem junto às expressões que esclarecem.
