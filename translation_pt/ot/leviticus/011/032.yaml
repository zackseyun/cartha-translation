  source_fidelity: A tradução comunica corretamente a contaminação ritual por contato com um dos animais mortos, os materiais/objetos abrangidos, a colocação na água e a duração da impureza. Contudo, a construção atual após «ficará impuro» («seja qualquer objeto...») é sintaticamente inadequada em português e torna obscura a relação entre a lista e o antecedente.
  naturalness: «E tudo aquilo sobre o que cair algum deles, quando estiver morto» é compreensível, mas a alternância entre «algum deles» e «estiver morto» pode ser simplificada. A enumeração deve integrar-se diretamente à oração para produzir português formal e atual mais natural.
  terminology: «Impuro/puro» é apropriado para o estatuto ritual. «Pele» e «pano de saco» preservam adequadamente a amplitude dos termos hebraicos. «Objeto usado para trabalho» transmite de modo acessível a função de כְּלִי, embora «objeto com que se faz algum trabalho» reflita mais explicitamente o instrumental hebraico.
  issues:
