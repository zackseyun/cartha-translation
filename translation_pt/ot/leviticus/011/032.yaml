revisions:
- from: E tudo aquilo sobre o que cair algum deles, quando estiver morto, ficará impuro, seja qualquer objeto de madeira, roupa, pele ou pano de saco, qualquer objeto usado para algum trabalho. Deverá ser colocado na água[a] e ficará impuro até a tarde; depois ficará puro.
  to: E qualquer objeto de madeira, roupa, pele ou pano de saco — qualquer objeto com que se faça algum trabalho — sobre o qual cair algum deles depois de morto ficará impuro. Deverá ser colocado na água[a] e ficará impuro até a tarde; depois ficará puro.
  rationale: A revisão reorganiza a frase para que a lista de materiais e objetos seja claramente o sujeito de «ficará impuro», eliminando a construção problemática com «seja». «Depois de morto» refere-se naturalmente a «algum deles» e preserva o sentido de contato com o animal morto. Mantêm-se os termos rituais, a possível imersão em nota e o sentido não especificado do verbo hebraico em «colocado na água».
