base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: pt
  text: E qualquer objeto de madeira, roupa, pele ou pano de saco — qualquer objeto com que se faça algum trabalho — sobre o qual cair algum deles depois de morto ficará impuro. Deverá ser colocado na água[a] e ficará impuro até a tarde; depois ficará puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “imerso em água”. O hebraico diz literalmente: “levado para dentro da água”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: E tudo aquilo sobre o que cair algum deles, quando estiver morto
  rationale: Preserva a abrangência de כֹּל e a construção relativa, enquanto o singular «estiver morto» acompanha «algum deles» e deixa claro que se trata do animal cujo cadáver cai sobre o objeto.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: Expressa a mudança para o estado de impureza ritual sem sugerir culpa moral.
- source_word: מִכָּל כְּלִי עֵץ אוֹ בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: seja qualquer objeto de madeira, roupa, pele ou pano de saco
  rationale: «Objeto» traduz o sentido amplo de כְּלִי melhor que um termo limitado a recipientes; «seja» apresenta naturalmente em português a lista de artigos abrangidos. «Pele» não pressupõe processamento em couro, e «pano de saco» comunica o material grosseiro indicado por שָׂק.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: qualquer objeto usado para algum trabalho
  rationale: Formulação natural que conserva a função instrumental e a amplitude da expressão hebraica.
- source_word: בַּמַּיִם יוּבָא
  choice: Deverá ser colocado na água
  rationale: O hofal de בוא significa literalmente «ser levado/trazido para dentro»; no contexto, «ser colocado na água» comunica a ação exigida sem determinar além do texto o modo exato.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: e ficará impuro até a tarde; depois ficará puro
  rationale: Mantém o contraste legal impuro/puro e torna explícita, de modo natural, a sequência temporal indicada pelo hebraico.
theological_decisions:
- issue: Natureza da linguagem de impureza
  choice: impuro/puro
  alternative: contaminado/limpo
  rationale: טמא e טהר descrevem aqui condição ritual-legal. «Impuro/puro» preserva essa categoria e evita introduzir culpa moral ou reduzir o sentido à higiene física.
- issue: Modo de aplicação da água
  choice: colocado na água
  alternative: imerso na água
  rationale: O hebraico afirma literalmente que o objeto deve ser levado à água, mas não emprega o verbo técnico que obrigaria a tradução «imergir». A alternativa é registrada em nota sem resolver indevidamente a questão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a cadência de legislação ritual sem arcaísmos; usa «impuro/puro» no sentido cerimonial e conserva em nota a possível leitura de imersão.
