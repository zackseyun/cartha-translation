  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: pt
  text: E, se morrer algum dos animais que lhes servem de alimento[a], quem tocar no seu cadáver ficará impuro até o anoitecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «que é para vocês para alimento». A expressão hebraica identifica os animais permitidos como alimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Preserva tanto a ligação com as normas anteriores, expressa por וְ, quanto o valor condicional de כִּי.
- source_word: יָמוּת
  choice: morrer
  rationale: O imperfeito qal de מות ocorre numa condição eventual; o infinitivo pessoal em português soa natural depois de «se».
- source_word: מִן הַבְּהֵמָה
  choice: algum dos animais
  rationale: 'מִן tem sentido partitivo: trata-se de um indivíduo dentre os animais dessa categoria. «Animais» é claro no contexto, sem restringir indevidamente o termo a uma única espécie de gado.'
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: que lhes servem de alimento
  rationale: A expressão identifica a categoria dos animais destinados ou permitidos para alimentação. A formulação mantém esse sentido classificatório em português natural.
- source_word: הַנֹּגֵעַ
  choice: quem tocar
  rationale: Reproduz de modo idiomático o particípio substantivado, indicando qualquer pessoa que pratique a ação.
- source_word: בְּנִבְלָתָהּ
  choice: no seu cadáver
  rationale: נְבֵלָה designa o corpo morto de um animal, especialmente um animal que morreu sem ser abatido; «cadáver» é conciso e apropriado ao contexto das leis de pureza.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: Expressa a entrada no estado de impureza ritual, sem sugerir impureza moral.
- source_word: עַד הָעָרֶב
  choice: até o entardecer
  rationale: Verte a fórmula temporal legal com linguagem atual e digna, referindo-se ao período da tarde que culmina no anoitecer.
theological_decisions:
- issue: Natureza da impureza
  choice: ficará impuro
  alternative: será impuro
  rationale: «Ficará» comunica que o contato produz um estado ritual temporário, sem acrescentar uma avaliação moral.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção legal permanece direta, e a nota conserva a forma mais literal da expressão hebraica.
