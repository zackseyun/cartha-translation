base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: pt
  text: 'Dentre as aves, estas vocês considerarão detestáveis[a]; não deverão ser comidas; são detestáveis: a águia, o abutre-barbudo[b] e o abutre-preto[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes hebraicos das aves desta lista nem sempre podem ser identificados com certeza. O termo traduzido por “águia” talvez designe mais amplamente uma grande ave de rapina, até mesmo um abutre.
    reason: lexical_alternative
  - marker: b
    text: A identificação é incerta. Outras possibilidades incluem “abutre” em sentido geral e “quebra-ossos”.
    reason: lexical_alternative
  - marker: c
    text: A identificação desta ave é incerta. Traduções mais antigas trazem frequentemente “águia-pescadora”; também se propõem tipos de águia ou de abutre.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: vocês considerarão detestáveis
  rationale: O piel expressa tratar ou considerar algo como repulsivo no contexto das leis alimentares, não apenas sentir aversão. A formulação também preserva a ligação com שֶׁקֶץ na oração seguinte.
- source_word: מִן הָעוֹף
  choice: as aves
  rationale: עוֹף pode designar criaturas voadoras em sentido amplo, mas aqui introduz uma lista de aves. Em português, a construção direta é mais natural, e o sentido partitivo fica suficientemente claro pelo contexto.
- source_word: לֹא יֵאָכְלוּ
  choice: não deverão ser comidas
  rationale: O nifal imperfeito funciona como proibição passiva. “Não deverão ser comidas” mantém o tom normativo e soa natural em português atual.
- source_word: שֶׁקֶץ
  choice: detestáveis
  rationale: No contexto alimentar levítico, o termo caracteriza algo ritualmente repulsivo ou proibido. “Detestáveis” preserva essa força sem reduzi-la simplesmente a “impuras” nem recorrer ao termo mais carregado “abominação”.
- source_word: הַנֶּשֶׁר
  choice: a águia
  rationale: “Águia” é a identificação tradicional e lexicalmente plausível, embora o nome hebraico possa abranger uma grande ave de rapina, inclusive algum abutre; a incerteza é indicada em nota.
- source_word: הַפֶּרֶס
  choice: o abutre-barbudo
  rationale: O termo é frequentemente identificado com o quebra-ossos ou abutre-barbudo, mas a identificação zoológica não é totalmente segura; a nota preserva alternativas.
- source_word: הָעָזְנִיָּה
  choice: o abutre-preto
  rationale: É uma identificação moderna possível, porém incerta. A alternativa tradicional “águia-pescadora” e outras propostas são registradas em nota.
theological_decisions:
- issue: Natureza da classificação alimentar
  choice: Traduzir שֶׁקֶץ por “detestáveis”
  alternative: “impuras” ou “abominações”
  rationale: O texto usa שֶׁקֶץ, não o vocabulário habitual de puro/impuro nesta frase. A tradução mantém a categoria avaliativa própria do hebraico sem impor uma sistematização teológica externa.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. Mantém-se a repetição deliberada de “detestáveis” e a forma passiva da proibição. Os nomes zoológicos são apresentados de modo legível, com a incerteza filológica explicitada nas notas.
