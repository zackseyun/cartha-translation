base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: pt
  text: E a lebre[a], porque rumina, mas não tem o casco fendido, é impura para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o coelho”. O hebraico אַרְנֶבֶת é tradicionalmente entendido como “lebre”, embora alguns o tomem em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: a lebre
  rationale: A identificação tradicional e zoologicamente mais provável é “lebre”; “coelho” permanece como alternativa lexical possível.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da classificação e conserva com clareza o valor causal.
- source_word: מַעֲלַת גֵּרָה
  choice: rumina
  rationale: Expressa de modo natural e conciso o idiomatismo hebraico de fazer subir o alimento para nova mastigação.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: mas não tem o casco fendido
  rationale: Comunica naturalmente o contraste entre os dois critérios, preservando a referência ao casco não dividido.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: ela é impura para vocês
  rationale: Mantém a classificação de impureza e a referência explícita aos destinatários sem acrescentar uma interpretação no corpo do texto.
theological_decisions:
- issue: Natureza da impureza na legislação alimentar levítica
  choice: impura
  alternative: moralmente impura
  rationale: O contexto trata de classificação ritual e alimentar, não de maldade moral do animal; o texto conserva o termo bíblico mais amplo sem explicação excessiva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O início com “e” preserva a continuidade da lista do contexto.
