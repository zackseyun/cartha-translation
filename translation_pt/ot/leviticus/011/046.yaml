id: LEV.11.46
reference: Leviticus 11:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: pt
  text: Esta é a lei[a] a respeito dos animais terrestres, das aves, de todo ser vivo[b] que se move nas águas e de todo ser que enxameia sobre a terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a instrução”; o termo hebraico também pode indicar ensino autorizado.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda criatura viva”. A expressão hebraica designa um ser animado, não especificamente uma “alma” imaterial.
    reason: lexical_alternative
  - marker: c
    text: Ou “sobre o solo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: a lei a respeito de
  rationale: Neste resumo das normas anteriores, תּוֹרָה designa um conjunto autorizado de instruções. “A lei a respeito de” é natural em português e mantém tanto o caráter normativo quanto o assunto regulado.
- source_word: הַבְּהֵמָה
  choice: os animais terrestres
  rationale: בְּהֵמָה pode designar animais de terra, com frequência quadrúpedes domésticos. “Animais terrestres” evita restringir indevidamente a categoria a gado ou rebanhos e a distingue das aves e dos seres aquáticos.
- source_word: הָעוֹף
  choice: as aves
  rationale: Embora עוֹף possa abranger criaturas voadoras, “aves” é a designação contextual mais clara e idiomática.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: todo ser vivo
  rationale: A expressão é um idioma hebraico para uma criatura ou ser dotado de vida; não se refere especificamente a uma alma imaterial.
- source_word: הָרֹמֶשֶׂת
  choice: que se move
  rationale: O particípio de רמש indica movimento, muitas vezes de criaturas pequenas. No contexto aquático, “se move” é abrangente e natural.
- source_word: בַּמָּיִם
  choice: nas águas
  rationale: Conserva o plural formal do hebraico e soa natural no registro bíblico português.
- source_word: וּלְכָל נֶפֶשׁ
  choice: e de todo ser
  rationale: “Ser” preserva a referência a uma criatura animada sem repetir de modo pesado “ser vivo”.
- source_word: הַשֹּׁרֶצֶת
  choice: que enxameia
  rationale: שׁרץ descreve o movimento abundante ou coletivo de criaturas pequenas; “enxameia” preserva essa nuance e o distingue de רמש.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: “Terra” mantém a amplitude de אֶרֶץ e estabelece o contraste espacial com “as águas”.
theological_decisions:
- issue: Sentido de נֶפֶשׁ em referência aos animais
  choice: ser vivo / ser
  alternative: alma viva / alma
  rationale: Aqui נֶפֶשׁ designa o próprio ser animado, não uma parte imaterial distinta. A tradução evita introduzir uma definição antropológica ou metafísica ausente do contexto.
translation_notes:
  register: Português moderno, claro e digno, com leve textura bíblica em “nas águas” e “sobre a terra”. A construção paralela conserva as categorias do resumo hebraico, e “enxameia” mantém a distinção lexical entre רמש e שׁרץ.
