  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: pt
  text: Contudo, entre todas as criaturas aladas que enxameiam e andam sobre quatro pernas, vocês poderão comer as que têm[a] pernas articuladas[b] acima dos pés, para saltar com elas sobre o chão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico escrito diz literalmente “que não têm pernas”; a leitura tradicional, indicada à margem e apoiada pelo contexto e por versões antigas, é “que têm pernas”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “pernas próprias para saltar”. O termo hebraico se refere às pernas traseiras especializadas usadas no salto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Assinala a exceção à proibição anterior com uma transição clara e digna.
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: vocês poderão comer as que
  rationale: O imperfeito, neste contexto legal, expressa permissão. Embora זֶה esteja no singular, introduz uma classe de criaturas, para a qual o plural é natural em português.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: entre todas as criaturas aladas que enxameiam
  rationale: Preserva a ideia de criaturas pequenas que se agrupam ou pululam e evita restringir הָעוֹף a aves.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: andam sobre quatro pernas
  rationale: Mantém a descrição concreta do hebraico em linguagem portuguesa corrente.
- source_word: אֲשֶׁר לוֹ כְרָעַיִם
  choice: as que têm pernas articuladas
  rationale: Segue a leitura tradicional לוֹ, apoiada pelo contexto e pelas versões antigas. כְרָעַיִם designa aqui as pernas especializadas usadas para saltar.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: acima dos pés
  rationale: Conserva a descrição anatômica do texto, sem substituir 'pés' por uma interpretação mais ampla.
- source_word: לְנַתֵּר בָּהֵן עַל הָאָרֶץ
  choice: para saltar com elas sobre o chão
  rationale: Expressa claramente a finalidade das pernas especializadas e traduz הָאָרֶץ conforme o contexto de locomoção terrestre.
