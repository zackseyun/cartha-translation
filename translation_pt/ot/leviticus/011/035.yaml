base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: pt
  text: E tudo aquilo sobre o que cair algo do cadáver deles ficará impuro[a]. Seja forno ou fogão[b], devem ser derrubados; são impuros e serão impuros para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do corpo morto deles” ou “dos cadáveres deles”. O hebraico se refere ao cadáver de um animal impuro no contexto das leis de pureza.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa uma instalação para cozinhar e pode se referir a um fogareiro, uma trempe ou uma estrutura semelhante a uma lareira.
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: cadáver deles
  rationale: נְבֵלָה designa o cadáver de um animal, especialmente no contexto das leis de pureza. A expressão mantém a referência coletiva sem reduzi-la vagamente a “corpo morto”.
- source_word: יִפֹּל
  choice: cair
  rationale: O imperfeito expressa aqui uma situação geral em formulação legal; “cair” é natural na oração relativa em português.
- source_word: עָלָיו יִטְמָא
  choice: sobre o qual ... ficará impuro
  rationale: Expressa com clareza o estado de impureza resultante do contato, sem acrescentar uma qualificação moral.
- source_word: תַּנּוּר
  choice: forno
  rationale: O termo designa um forno usado para assar; “forno” é o equivalente moderno mais claro.
- source_word: כִירַיִם
  choice: fogão
  rationale: Refere-se a uma instalação para cozinhar, possivelmente um fogareiro, trempe ou estrutura semelhante a uma lareira. “Fogão” comunica a função de modo acessível, enquanto a nota preserva a incerteza quanto à forma antiga.
- source_word: יֻתָּץ
  choice: deverá ser destruído
  rationale: A forma passiva indica a destruição obrigatória da instalação contaminada. “Deverá ser destruído” transmite a exigência legal sem pressupor um método específico.
- source_word: טְמֵאִים הֵם
  choice: são impuros
  rationale: Mantém o termo tradicional das leis de pureza e evita confundir impureza ritual com maldade moral.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: continuarão impuros para vocês
  rationale: O futuro com לָכֶם apresenta esses objetos como impuros em relação à comunidade israelita; “continuarão” torna natural a repetição enfática sem eliminar sua força.
theological_decisions:
- issue: Natureza da linguagem de impureza na lei levítica
  choice: impuro
  alternative: ritualmente impuro; cerimonialmente impuro
  rationale: O contexto trata de impureza ritual, não de culpa moral. O termo “impuro” preserva a concisão e a consistência lexical bíblica sem inserir uma explicação interpretativa no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva o caráter legal do versículo, a repetição hebraica de “impuros” e a orientação “para vocês”, ao mesmo tempo que explica em nota a incerteza arqueológica e lexical de כִירַיִם.
