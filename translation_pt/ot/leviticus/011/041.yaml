base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: pt
  text: E todo ser rastejante que se move sobre a terra é detestável[a]; não será comido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abominável”. Neste contexto, o termo indica algo ritualmente detestável como alimento. “Ser rastejante” também pode ser entendido como criatura que pulula ou se move em grande número.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: E todo
  rationale: Preserva tanto a ligação com as leis alimentares anteriores quanto o sentido abrangente de כָּל.
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: pequeno animal que se move rente ao chão
  rationale: Expressa em português natural a classe ampla de criaturas pequenas caracterizadas por movimento junto ao solo. Evita a repetição pouco idiomática de um cognato, sem restringir o termo a insetos ou répteis.
- source_word: עַל הָ/אָ֑רֶץ
  choice: rente ao chão
  rationale: Neste contexto, אָרֶץ indica o âmbito terrestre. Integrar a expressão à descrição do movimento produz português claro e mantém o contraste contextual com criaturas aquáticas e voadoras.
- source_word: שֶׁ֥קֶץ
  choice: detestável
  rationale: Comunica que a criatura é ritualmente repulsiva e imprópria para alimentação, sem acrescentar conotações morais que o contexto não exige.
- source_word: ה֖וּא
  choice: é
  rationale: A oração copulativa portuguesa transmite de modo natural a predicação enfática do pronome hebraico.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: não será comido
  rationale: Mantém a voz passiva e o registro jurídico da proibição hebraica.
theological_decisions:
- issue: Natureza de שֶׁקֶץ no contexto das leis alimentares
  choice: detestável
  alternative: abominável
  rationale: A tradução mantém a força ritual e alimentar do termo sem transformar implicitamente a classificação em juízo moral geral.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Pequeno animal que se move rente ao chão” traduz funcionalmente a construção cognata hebraica e deixa aberta a amplitude da categoria zoológica.
