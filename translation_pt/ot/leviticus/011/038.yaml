  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: pt
  text: Mas, se água for colocada sobre a semente e alguma de suas carcaças[a] cair sobre ela, a semente ficará impura para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «algum de seus cadáveres». O hebraico נְבֵלָה designa o corpo morto de um animal; «carcaça» é mais específico no contexto das leis de pureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o caso do versículo anterior, preservando tanto a conjunção quanto sua força adversativa contextual.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: água for colocada sobre a semente
  rationale: Mantém o valor passivo do hophal de נתן e o sentido concreto de água aplicada à semente, sem acrescentar a interpretação mais específica de que ela foi apenas umedecida.
- source_word: וְנָפַל
  choice: e ... cair
  rationale: A forma verbal, dentro da condição legal, é expressa naturalmente em português pelo futuro do subjuntivo.
- source_word: מִנִּבְלָתָם
  choice: algum dos cadáveres deles
  rationale: O מן tem sentido partitivo no contexto, e נְבֵלָה designa o corpo morto de um animal. 'Cadáveres' é claro e natural em português, enquanto o plural distributivo corresponde aos animais mencionados anteriormente.
- source_word: עָלָיו
  choice: sobre ela
  rationale: Retoma 'a semente'; o pronome feminino segue o gênero da palavra em português.
- source_word: טָמֵא הוּא לָכֶם
  choice: a semente ficará impura para vocês
  rationale: Explicita o referente para evitar ambiguidade pronominal e comunica o estado resultante de impureza ritual. 'Para vocês' preserva a perspectiva comunitária de לָכֶם.
theological_decisions:
- issue: Natureza da impureza
  choice: impura
  alternative: contaminada
  rationale: O texto declara uma condição ritual segundo as leis levíticas, não necessariamente culpa moral. 'Impura' preserva essa categoria legal sem introduzir uma noção meramente física de contaminação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção passiva conserva a forma do hebraico, e a repetição de 'a semente' elimina possível dúvida sobre o referente da declaração final.
