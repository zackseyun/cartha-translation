base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: pt
  text: 'E estes são impuros para vocês entre os pequenos animais que fervilham sobre a terra: o rato-toupeira[a], o rato e o lagarto grande, segundo a sua espécie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata de חֹלֶד e צָב é incerta; traduções tradicionais incluem “doninha” ou “toupeira” para חֹלֶד, e “tartaruga” ou simplesmente “lagarto” para צָב.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: E estes são
  rationale: Embora זֶה esteja no singular, ele introduz uma lista de vários animais; o plural em português torna a referência natural sem perder a função demonstrativa.
- source_word: לָכֶם
  choice: para vocês
  rationale: 'A preposição marca a relação com os destinatários: esses animais são ritualmente impuros para Israel.'
- source_word: הַטָּמֵא
  choice: impuros
  rationale: No contexto das leis levíticas, “impuro” é um termo claro e corrente para a condição ritual expressa por טָמֵא.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: entre os pequenos animais que fervilham
  rationale: “Fervilham” preserva a ideia de movimento numeroso associada à raiz שׁרץ; “pequenos animais” comunica naturalmente a categoria substantivada sem sugerir apenas insetos.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Mantém o sentido do domínio terrestre ou da superfície do solo indicado por אֶרֶץ.
- source_word: הַחֹלֶד
  choice: o rato-toupeira
  rationale: A identificação zoológica é incerta; “rato-toupeira” é uma proposta moderna plausível, com alternativas tradicionais registradas em nota.
- source_word: הָעַכְבָּר
  choice: o camundongo
  rationale: עַכְבָּר designa normalmente o camundongo ou pequenos roedores semelhantes; “camundongo” é específico e amplamente compreensível.
- source_word: הַצָּב
  choice: o lagarto grande
  rationale: A espécie exata é incerta. Um réptil do tipo lagarto é plausível neste contexto, sem ocultar em nota outras traduções tradicionais.
- source_word: לְמִינֵהוּ
  choice: segundo a sua espécie
  rationale: Reproduz a fórmula classificatória hebraica de modo claro e digno em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. A repetição derivacional de שֶׁרֶץ/שֹׁרֵץ é parcialmente preservada pela expressão “animais que fervilham”, evitando o tradicional “rastejam”, que pode restringir indevidamente a categoria.
