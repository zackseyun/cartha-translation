id: LEV.11.26
reference: Leviticus 11:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: pt
  text: Quanto a todo animal que tem o casco dividido, mas não completamente fendido[a] e que não rumina, esses animais são impuros para vocês. Todo aquele que tocar neles ficará impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não fende uma fenda”; o hebraico emprega palavras da mesma raiz para enfatizar a ideia de um casco plenamente fendido.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: Quanto a todo animal
  rationale: A preposição לְ introduz aqui a categoria em pauta. “Quanto a” expressa naturalmente essa função tópica, e “animal” comunica בְּהֵמָה com clareza no contexto dos animais terrestres.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: tem o casco dividido
  rationale: A expressão descreve um animal cujo casco apresenta divisão. Esta formulação é natural em português e preserva a imagem concreta do hebraico.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: mas não o tem completamente fendido[a]
  rationale: A construção cognata especifica ou intensifica a divisão do casco, indicando que ele não é inteiramente fendido. O pronome “o” retoma “casco” e evita repetição pouco natural.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: e não rumina
  rationale: Embora o hebraico fale literalmente em “fazer subir” o conteúdo ruminado, “ruminar” é o equivalente zoológico corrente, claro e conciso em português.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: esses animais são impuros para vocês
  rationale: “Impuros” preserva a categoria ritual e legal de Levítico sem sugerir necessariamente culpa moral. “Para vocês” mantém a perspectiva comunitária expressa por לָכֶם; “esses animais” torna natural a passagem do referente coletivo singular ao predicado plural hebraico.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Todo aquele que tocar neles
  rationale: A construção com כָּל e particípio tem sentido geral. “Todo aquele que tocar” é uma formulação portuguesa clara e adequada ao registro legal.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: O imperfeito declara a consequência legal do contato. “Ficará impuro” expressa com naturalidade a entrada no estado de impureza ritual.
theological_decisions:
- issue: Terminologia de pureza na legislação levítica
  choice: impuro
  alternative: imundo
  rationale: O contexto trata de uma categoria ritual, não necessariamente de contaminação moral. “Impuro” é claro no português atual e preserva a distinção cultual sem acrescentar conotações indevidas.
- issue: Natureza da consequência do contato
  choice: ficará impuro
  alternative: será impuro
  rationale: “Ficará impuro” apresenta a impureza como estado resultante do contato, sem ampliar sua duração nem sua natureza além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o tom legal-sacral sem arcaísmos e conserva a mudança do animal coletivo singular para o predicado plural presente no hebraico.
