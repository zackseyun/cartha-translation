base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: pt
  text: Mas, se, aos olhos do sacerdote, a lesão escamosa tiver permanecido sem alteração, e nela tiver crescido cabelo preto, a lesão está curada. Ele está puro, e o sacerdote o declarará puro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sacerdote o purificará”. Aqui, o verbo hebraico se refere ao veredito formal do sacerdote depois de constatada a cura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: aos olhos do sacerdote
  rationale: A expressão hebraica indica a avaliação visual do examinador. A explicitação de “do sacerdote” evita ambiguidade em português e preserva o cenário de inspeção.
- source_word: עָמַד
  choice: tiver permanecido sem alteração
  rationale: Neste contexto diagnóstico, o verbo indica que a lesão se manteve como estava, sem mudança relevante; a formulação é natural e precisa em português.
- source_word: הַנֶּתֶק
  choice: a lesão escamosa
  rationale: O termo designa uma afecção específica do couro cabeludo ou da barba. “Lesão escamosa” é compreensível hoje e evita tanto um diagnóstico moderno excessivamente específico quanto termos arcaicos.
- source_word: שֵׂעָר שָׁחֹר
  choice: cabelo preto
  rationale: Tradução direta da expressão hebraica, mantendo o sinal diagnóstico em contraste com os pelos de outra cor mencionados no contexto.
- source_word: צָמַח בּוֹ
  choice: nela tiver crescido
  rationale: Preserva a ideia de o cabelo crescer dentro da área afetada, com concordância natural com “lesão”.
- source_word: נִרְפָּא
  choice: está curada
  rationale: Expressa o estado resultante de cura da lesão sem atribuir a cura ao sacerdote.
- source_word: טָהוֹר הוּא
  choice: Ele está puro
  rationale: No vocabulário levítico, טָהוֹר indica o estado de pureza ritual da pessoa examinada. “Puro” conserva essa dimensão melhor do que uma formulação meramente sanitária.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: e o sacerdote o declarará puro
  rationale: No contexto jurídico-ritual, o sacerdote profere um veredito oficial de pureza; ele não efetua a cura física.
theological_decisions:
- issue: Natureza da ação sacerdotal na determinação da pureza ritual
  choice: o sacerdote o declarará puro
  alternative: o sacerdote o purificará
  rationale: O texto distingue a cura já constatada da decisão subsequente do sacerdote. A tradução escolhida comunica a função declaratória sem sugerir que o sacerdote produz a cura, enquanto a nota preserva a amplitude lexical do verbo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o vocabulário ritual de Levítico e explicita o referente de “aos olhos dele” sem alterar o sentido.
