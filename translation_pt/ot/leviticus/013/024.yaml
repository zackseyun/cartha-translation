  text: א֣וֹ בָשָׂ֔ר כִּֽי יִהְיֶ֥ה בְ/עֹר֖/וֹ מִכְוַת אֵ֑שׁ וְֽ/הָיְתָ֞ה מִֽחְיַ֣ת הַ/מִּכְוָ֗ה בַּהֶ֛רֶת לְבָנָ֥ה אֲדַמְדֶּ֖מֶת א֥וֹ לְבָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: pt
  text: Ou, se alguém tiver na pele uma queimadura de fogo, e a carne viva da queimadura se tornar uma mancha brilhante, branco-avermelhada ou branca,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹ
  choice: Ou, se
  rationale: Introduz um caso alternativo na instrução legal; a combinação preserva o sentido disjuntivo e explicita naturalmente a condição em português.
- source_word: בָשָׂר
  choice: alguém
  rationale: Embora o termo signifique literalmente “carne” ou “corpo”, aqui designa a pessoa cujo tecido corporal será examinado; “alguém” evita a formulação pouco natural “se uma carne tiver” sem alterar o referente.
- source_word: בְּעֹרוֹ
  choice: na pele
  rationale: Expressa de modo idiomático o local da queimadura; o possessivo hebraico fica naturalmente implícito em português.
- source_word: מִכְוַת אֵשׁ
  choice: uma queimadura de fogo
  rationale: Mantém a causa expressa no hebraico e usa terminologia clara e corrente.
- source_word: וְהָיְתָה
  choice: se tornar
  rationale: No contexto legal e diagnóstico, descreve o desenvolvimento da condição; o infinitivo concorda naturalmente com a construção iniciada por “se”.
- source_word: מִחְיַת הַמִּכְוָה
  choice: a carne viva da queimadura
  rationale: Preserva a imagem hebraica de tecido vivo ou exposto na área queimada, sem substituí-la por terminologia médica mais específica do que o original.
- source_word: בַּהֶרֶת
  choice: uma mancha brilhante
  rationale: Designa uma área visivelmente clara ou brilhante na pele e mantém consistência com o vocabulário diagnóstico do capítulo.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: branco-avermelhada
  rationale: Reproduz a coloração composta e mantém a concordância com “mancha”.
- source_word: אוֹ לְבָנָה
  choice: ou branca
  rationale: Preserva diretamente a alternativa de cor apresentada no hebraico.
