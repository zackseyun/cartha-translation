  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: pt
  text: e, no lugar do furúnculo, houver uma inchação branca ou uma mancha brilhante branco-avermelhada, ele se apresentará ao sacerdote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele será visto pelo sacerdote”. O hebraico pode ser traduzido mais literalmente como “será visto” ou “aparecerá”; no contexto, provavelmente se refere à pessoa afetada apresentar-se para exame sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: surgir
  rationale: No contexto do diagnóstico, o verbo introduz o aparecimento de uma alteração no local do furúnculo; “surgir” expressa essa ocorrência com naturalidade em português.
- source_word: בִּמְקוֹם
  choice: no lugar de
  rationale: Equivalente locativo direto e claro, indicando a área anteriormente afetada pelo furúnculo.
- source_word: הַשְּׁחִין
  choice: o furúnculo
  rationale: שְׁחִין designa uma lesão inflamada ou furúnculo; esta escolha é corrente, compreensível e adequada ao contexto.
- source_word: שְׂאֵת
  choice: inchação
  rationale: O termo indica uma elevação ou inchaço da pele. “Inchação” mantém a distinção em relação à mancha brilhante mencionada em seguida.
- source_word: לְבָנָה
  choice: branca
  rationale: Tradução direta do adjetivo que indica a cor branca.
- source_word: בַהֶרֶת
  choice: mancha brilhante
  rationale: Designa uma área clara ou perceptivelmente brilhante da pele; a expressão preserva sua distinção lexical em relação à inchação.
- source_word: אֲדַמְדָּמֶת
  choice: branco-avermelhada
  rationale: O adjetivo significa “avermelhada” e modifica uma mancha já descrita como branca; o composto comunica naturalmente a combinação das duas tonalidades.
- source_word: וְנִרְאָה
  choice: deverá ser apresentada
  rationale: Embora o nifal possa significar literalmente “ser vista” ou “aparecer”, neste procedimento legal a expressão provavelmente indica a apresentação da lesão ou do caso para exame sacerdotal. A nota preserva a formulação mais literal.
- source_word: אֶל הַכֹּהֵן
  choice: ao sacerdote
  rationale: Tradução direta da expressão que indica a pessoa diante de quem a condição será apresentada para exame.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia concreta para as lesões da pele. A estrutura mantém a ligação sintática com o contexto anterior do capítulo. O feminino “ela” retoma naturalmente “inchação” ou “mancha”, sem eliminar na nota a ambiguidade da forma hebraica.
