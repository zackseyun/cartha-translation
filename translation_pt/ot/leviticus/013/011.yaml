  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: pt
  text: É uma doença de pele persistente na pele de seu corpo[a]. O sacerdote o declarará impuro; não o manterá isolado, pois ele está impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é uma doença de pele de longa duração”. Traduções tradicionais muitas vezes vertem צָרַעַת por “lepra”, mas, em Levítico, o termo hebraico abrange uma variedade de afecções mais ampla do que a hanseníase moderna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: doença de pele
  rationale: Em Levítico, o termo abrange diversas afecções graves da pele e não designa especificamente a hanseníase; a tradução evita uma identificação médica indevida.
- source_word: נוֹשֶׁנֶת
  choice: antiga
  rationale: O particípio indica uma afecção antiga ou de longa duração. “Antiga” preserva o sentido básico e permite que a nota explicite a alternativa “persistente”.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: na pele do seu corpo
  rationale: Reproduz de perto a expressão hebraica, usando “corpo” em vez de “carne” por ser mais natural no contexto físico.
- source_word: וְטִמְּאוֹ
  choice: o declarará impuro
  rationale: No procedimento sacerdotal, o sacerdote reconhece e anuncia oficialmente a condição ritual; não é ele quem a causa.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Correspondência direta e convencional para o ofício cultual.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: não o manterá isolado
  rationale: O verbo se refere à reclusão temporária para observação. Esta formulação moderna expressa o procedimento sem a especificidade médica de “quarentena”.
- source_word: כִּי טָמֵא הוּא
  choice: pois ele está impuro
  rationale: 'Mantém a oração causal que explica por que não é necessário continuar o isolamento: a condição ritual já está determinada.'
theological_decisions:
- issue: Terminologia de impureza ritual
  choice: impuro
  alternative: imundo
  rationale: “Impuro” comunica o estado ritual e jurídico neste contexto sem sugerir necessariamente culpa moral nem empregar uma expressão hoje potencialmente depreciativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem inicial continua a frase do versículo anterior, como no hebraico. A repetição de “pele” preserva a formulação enfática da fonte.
