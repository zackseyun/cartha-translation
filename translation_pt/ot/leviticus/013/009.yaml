  text: נֶ֣גַע צָרַ֔עַת כִּ֥י תִהְיֶ֖ה בְּ/אָדָ֑ם וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/009.yaml
  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: pt
  text: Quando uma pessoa tiver uma lesão de pele[a], será levada ao sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico צָרַעַת (tsaráat), tradicionalmente traduzido por “lepra”, provavelmente abrangia várias doenças ou alterações graves da pele, e não apenas a hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: lesão
  rationale: No contexto do exame sacerdotal de Levítico 13, designa uma manifestação visível na pele. “Lesão” é atual e mais precisa do que “praga” ou “aflição”, sem pressupor que se trate necessariamente de uma infecção.
- source_word: צָרַעַת
  choice: de pele
  rationale: O termo hebraico tradicionalmente traduzido por “lepra” abrange condições mais amplas do que a hanseníase moderna. No conjunto “lesão de pele”, a tradução comunica com clareza o caráter dermatológico sem impor uma identificação médica indevida; a nota preserva a terminologia tradicional e a ambiguidade histórica.
- source_word: כִּי
  choice: quando
  rationale: Introduz um caso previsto na legislação. “Quando” expressa naturalmente essa condição em português.
- source_word: תִהְיֶה בְּאָדָם
  choice: uma pessoa tiver
  rationale: A construção portuguesa com “ter” transmite de modo natural o hebraico literalmente expresso como uma condição que “há em” alguém.
- source_word: וְהוּבָא
  choice: será levada
  rationale: Preserva a voz passiva e a sequência do procedimento legal, sem acrescentar quem conduz a pessoa.
- source_word: אֶל הַכֹּהֵן
  choice: ao sacerdote
  rationale: Mantém o artigo definido hebraico e identifica o sacerdote encarregado do exame ritual.
theological_decisions:
- issue: Sentido de צָרַעַת
  choice: lesão de pele, com nota explicativa
  alternative: lesão de lepra / infecção de lepra
  rationale: Evita equiparar a condição ritual e dermatológica bíblica especificamente à hanseníase, ao mesmo tempo que preserva na nota a tradução tradicional.
- issue: Referência genérica de אָדָם
  choice: pessoa
  alternative: homem / ser humano
  rationale: Aqui אָדָם designa genericamente qualquer indivíduo submetido ao exame. “Pessoa” expressa essa abrangência de modo natural, sem alterar o alcance do hebraico; a concordância feminina decorre gramaticalmente de “pessoa”, não do sexo do indivíduo.
translation_notes:
  register: Português atual, digno e acessível, com formulação natural de caso legal. “Lesão de pele” evita linguagem arcaica e precisão médica indevida; a voz passiva do hebraico foi mantida.
