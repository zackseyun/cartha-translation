revisions:
- from: Mas, se o sacerdote a examinar e constatar que a mancha perdeu a intensidade depois de ser lavada, deverá arrancar a parte afetada da roupa, do couro, da urdidura ou da trama[a].
  to: Mas, se o sacerdote examinar o objeto e verificar que a mancha ficou menos intensa depois da lavagem, deverá remover, rasgando, a parte afetada da peça de roupa, do couro, da urdidura ou da trama[a].
  rationale: A revisão elimina a concordância feminina que poderia limitar o objeto examinado e lavado à roupa, mantendo o alcance do procedimento para os materiais enumerados. Também torna mais natural a descrição da mancha, preserva o caráter passivo da lavagem por meio de “depois da lavagem” e explicita que a remoção ocorre por rasgamento, conforme o verbo hebraico.
