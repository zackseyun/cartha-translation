base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: pt
  text: Mas, se o sacerdote examinar o objeto e verificar que a mancha ficou menos intensa depois da lavagem, deverá remover, rasgando, a parte afetada da peça de roupa, do couro, da urdidura ou da trama[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os fios transversais do tecido, que se entrelaçam com os fios longitudinais da urdidura.
    reason: Esclarece um termo técnico de tecelagem.
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição que dá continuidade ao procedimento anterior, com leve contraste em relação ao caso precedente.
- source_word: רָאָה הַכֹּהֵן
  choice: o sacerdote a examinar
  rationale: Embora o verbo signifique literalmente “ver”, neste contexto legal descreve a inspeção feita pelo sacerdote. O pronome retoma a peça ou o material em questão.
- source_word: וְהִנֵּה
  choice: e constatar que
  rationale: Transmite de modo natural em português o valor de chamar a atenção para o resultado observado, sem recorrer ao pouco corrente “e eis que”.
- source_word: כֵּהָה הַנֶּגַע
  choice: a mancha perdeu a intensidade
  rationale: Indica que a área afetada ficou menos forte ou visível, sem afirmar que desapareceu completamente.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: depois de ser lavada
  rationale: Conserva a construção passiva do hebraico; a concordância natural em português retoma a peça examinada.
- source_word: וְקָרַע אֹתוֹ
  choice: deverá arrancar a parte afetada
  rationale: Expressa a remoção por rasgamento da porção atingida, evitando sugerir a destruição da peça inteira.
- source_word: מִן הַבֶּגֶד
  choice: da roupa
  rationale: “Roupa” é claro e natural para o objeto têxtil designado neste contexto.
- source_word: מִן הָעוֹר
  choice: do couro
  rationale: No contexto de materiais, עוֹר designa couro ou pele curtida, não pele humana.
- source_word: מִן הַשְּׁתִי
  choice: da urdidura
  rationale: Termo técnico português para os fios longitudinais do tecido, preservando a precisão material do hebraico.
- source_word: מִן הָעֵרֶב
  choice: da trama
  rationale: Termo técnico corrente para os fios transversais que se entrelaçam com a urdidura.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário técnico preservado onde a precisão legal do texto o exige. A formulação explicita “a parte afetada” como objeto da remoção, sentido exigido pelo contexto, sem indicar que toda a peça deva ser destruída.
