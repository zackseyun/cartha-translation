base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: pt
  text: O sacerdote examinará a área afetada no sétimo dia e, se verificar que a afecção escamosa[a] não se espalhou, que não há nela pelo amarelo e que seu aspecto não é mais profundo que a pele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “coceira” ou, em versões mais antigas, “tinha”. O termo hebraico נֶתֶק designa uma afecção escamosa específica do couro cabeludo ou da barba tratada nesta seção.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: examinará
  rationale: No contexto dos procedimentos sacerdotais de diagnóstico, ראה indica inspeção cuidadosa, não apenas o ato de ver.
- source_word: הַנֶּגַע
  choice: a área afetada
  rationale: נֶגַע designa amplamente uma área atingida por uma afecção. A expressão evita atribuir um diagnóstico médico moderno específico.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: no sétimo dia
  rationale: Tradução direta da indicação temporal para o novo exame.
- source_word: וְהִנֵּה
  choice: Se constatar que
  rationale: No fluxo condicional do procedimento, introduz aquilo que o sacerdote observa. Esta formulação natural preserva a função do marcador sem recorrer ao pouco corrente “e eis que”.
- source_word: לֹא פָשָׂה
  choice: não se espalhou
  rationale: פשה descreve a expansão da afecção pela pele.
- source_word: הַנֶּתֶק
  choice: a afecção escamosa
  rationale: נֶתֶק é o nome de uma afecção específica do couro cabeludo ou da barba nesta seção. A tradução descreve seu caráter sem identificá-la indevidamente com uma doença moderna precisa.
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: não há nela pelo amarelo
  rationale: Preserva tanto a ausência do sinal diagnóstico como a referência locativa à área afetada. “Pelo” é adequado ao couro cabeludo e à barba.
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: ela não parece mais profunda que a pele
  rationale: מַרְאֶה marca a avaliação visual; “parece” evita transformar a descrição da aparência em uma afirmação anatômica.
