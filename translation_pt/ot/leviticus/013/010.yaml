  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: pt
  text: O sacerdote o examinará e, se houver uma inchação branca na pele, que tenha tornado brancos os pelos, e houver carne viva na inchação[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «carne viva»; a expressão se refere a tecido vivo, em carne viva, visível dentro da lesão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה הַכֹּהֵן
  choice: O sacerdote a examinará
  rationale: No contexto jurídico-diagnóstico, ראה significa inspecionar ou examinar. O pronome retoma naturalmente a pessoa afetada no contexto, sem acrescentar distinção de gênero ausente no uso referencial relevante.
- source_word: וְהִנֵּה
  choice: se houver
  rationale: Em uma formulação casuística, introduz aquilo que o sacerdote constata. 'Se houver' comunica naturalmente em português a condição observada, sem o arcaísmo de 'eis que'.
- source_word: שְׂאֵת לְבָנָה
  choice: uma inchação branca
  rationale: שְׂאֵת é um termo técnico para uma elevação ou lesão elevada da pele; 'inchação' é claro, concreto e mantém sua recorrência no versículo.
- source_word: בָּעוֹר
  choice: na pele
  rationale: עוֹר designa a pele; a preposição é vertida idiomaticamente por 'na'.
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: que tenha tornado branco o pelo
  rationale: O pronome feminino retoma a inchação. A formulação preserva a imagem hebraica de a lesão ter embranquecido o pelo.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: e houver carne viva exposta
  rationale: A expressão literalmente relacionada a 'carne viva' descreve tecido vivo ou cru visível na lesão. 'Exposta' torna claro o sinal clínico sem substituir a imagem concreta do hebraico.
- source_word: בַּשְׂאֵת
  choice: na inchação
  rationale: Repete o mesmo termo técnico e localiza a carne viva dentro da lesão.
theological_decisions: []
