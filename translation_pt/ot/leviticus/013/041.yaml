  text: וְ/אִם֙ מִ/פְּאַ֣ת פָּנָ֔י/ו יִמָּרֵ֖ט רֹאשׁ֑/וֹ גִּבֵּ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: pt
  text: Se lhe cair o cabelo na parte da frente da cabeça, ele é calvo na parte da frente da cabeça[a]; está limpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tem calvície frontal». O termo hebraico distingue essa condição da calvície na parte posterior da cabeça, mencionada no versículo anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: na parte da frente da cabeça
  rationale: Embora a expressão combine literalmente a ideia de extremidade ou lado com “seu rosto”, o contexto anatômico indica a região frontal da cabeça.
- source_word: יִמָּרֵט
  choice: o cabelo cair
  rationale: O nifal descreve a região ficando sem cabelo; em português corrente, “o cabelo cair” expressa naturalmente o processo sem sugerir necessariamente que foi arrancado.
- source_word: רֹאשׁוֹ
  choice: da cabeça
  rationale: Equivalente anatômico direto e natural em português.
- source_word: גִּבֵּחַ
  choice: deixando a testa calva
  rationale: O termo designa calvície frontal e contrasta com a calvície da parte posterior mencionada no versículo anterior.
- source_word: טָהוֹר
  choice: puro
  rationale: Neste contexto legislativo, indica o estado ritual resultante do exame, não uma qualidade moral.
theological_decisions:
- issue: Terminologia do estado ritual nas leis de pureza
  choice: puro
  alternative: limpo
  rationale: “Puro” é a forma corrente e digna de designar em português a categoria ritual levítica; o contexto deixa claro que não se trata de mérito moral.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com leitura natural no Brasil. A formulação mantém a distinção anatômica do hebraico e o sentido ritual de טָהוֹר.
