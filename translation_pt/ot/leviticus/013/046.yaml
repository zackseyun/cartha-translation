id: LEV.13.46
reference: Leviticus 13:46
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: pt
  text: Durante todos os dias em que a afecção estiver nele[a], ele estará impuro. Ele está impuro[b]. Viverá sozinho; sua morada ficará fora do acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lesão”, “aflição” ou “praga”. O termo hebraico é amplo e, aqui, se refere à condição diagnosticada descrita neste capítulo.
    reason: lexical_alternative
  - marker: b
    text: “Impuro” se refere aqui ao estado de impureza no contexto da lei levítica, não necessariamente à culpa moral.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: a afecção
  rationale: נֶגַע é um termo amplo para golpe, aflição, lesão ou condição patológica. Neste capítulo, “afecção” comunica uma condição diagnosticada sem restringi-la a uma doença específica nem sugerir necessariamente uma epidemia.
- source_word: בּוֹ
  choice: nele
  rationale: A preposição pode significar “nele” ou “sobre ele”. Com “afecção”, “estiver nele” é natural em português e preserva a amplitude da construção hebraica.
- source_word: יִטְמָא
  choice: estará impuro
  rationale: O Qal de טמא indica aqui o estado de impureza estabelecido pela lei. O futuro mantém o caráter normativo da formulação sem acrescentar ao texto a qualificação interpretativa “ritualmente”.
- source_word: טָמֵא הוּא
  choice: Ele está impuro
  rationale: A oração nominal reafirma enfaticamente o estado da pessoa. Mantê-la como frase separada preserva essa repetição intencional.
- source_word: בָּדָד
  choice: sozinho
  rationale: בָּדָד expressa separação ou solidão. “Sozinho” é direto e evita o tom clínico mais interpretativo de “em isolamento”.
- source_word: יֵשֵׁב
  choice: viverá
  rationale: ישב pode significar sentar-se, habitar ou permanecer. Neste contexto de residência fora do acampamento, “viverá” expressa naturalmente a habitação continuada.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: A expressão indica exclusão da área ocupada pela comunidade e conserva com clareza o cenário do acampamento.
- source_word: מוֹשָׁבוֹ
  choice: sua morada
  rationale: מוֹשָׁב designa lugar de residência. “Sua morada” é conciso, digno e mantém o sentido concreto do local onde a pessoa habitará.
theological_decisions:
- issue: Natureza da impureza em Levítico 13
  choice: Traduzir טמא por “impuro” no texto principal, sem acrescentar “ritualmente” ou “cerimonialmente”.
  alternative: “ritualmente impuro” ou “cerimonialmente impuro”
  rationale: O contexto é o estado de impureza definido pela legislação levítica, não uma declaração necessária de culpa moral. O texto principal preserva a categoria bíblica sem estreitá-la; a nota esclarece o contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “estará impuro. Ele está impuro” foi preservada para reproduzir a ênfase do hebraico; “sozinho” mantém a formulação direta sem medicalizar o texto.
