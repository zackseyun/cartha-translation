source:
  edition: WLC
  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֶת הַ/נֶּ֜תֶק בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨תֶק֙ בָּ/ע֔וֹר וּ/מַרְאֵ֕/הוּ אֵינֶ֥/נּוּ עָמֹ֖ק מִן הָ/ע֑וֹר וְ/טִהַ֤ר אֹת/וֹ֙ הַ/כֹּהֵ֔ן וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: pt
  text: No sétimo dia, o sacerdote examinará a afecção escamosa[a]. Se ela não tiver se espalhado pela pele e não parecer mais profunda que a pele[b], o sacerdote declarará a pessoa pura[c]. A pessoa lavará as suas roupas e ficará pura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coceira”; tradicionalmente, “tinha”. O hebraico néteq designa uma afecção específica do couro cabeludo ou da barba, mas não permite identificá-la com segurança segundo a medicina moderna.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não é mais profunda que a pele”; este é um critério sacerdotal que indica que a área afetada não parece estar rebaixada em relação à pele ao redor.
    reason: cultural_note
  - marker: c
    text: Isto é, o sacerdote declara oficialmente que a pessoa está em estado de pureza ritual; não significa que ele cure a afecção.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: afecção escamosa
  rationale: O termo designa uma afecção específica do couro cabeludo ou da barba submetida à inspeção sacerdotal. “Afecção escamosa” comunica uma alteração dermatológica visível sem impor um diagnóstico médico moderno; alternativas como “tinha” podem ser específicas demais.
- source_word: פָשָׂה
  choice: tiver se espalhado
  rationale: Neste contexto diagnóstico, o verbo indica que a afecção se alastrou pela pele. A formulação é natural e precisa em português.
- source_word: בָּעוֹר
  choice: pela pele
  rationale: Com o verbo “espalhar-se”, “pela pele” expressa de modo idiomático a extensão da afecção na área cutânea.
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן הָעוֹר
  choice: não parecer mais profunda que a pele
  rationale: A expressão descreve o aspecto visual da área afetada. O verbo “parecer” preserva que se trata de um critério de inspeção, não de uma medição anatômica exata.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: o sacerdote declarará a pessoa pura
  rationale: No contexto das leis de pureza, o sacerdote profere um veredito oficial sobre o estado ritual da pessoa; ele não cura medicamente a afecção.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: A pessoa lavará as suas roupas
  rationale: “Roupas” é corrente e claro em português moderno. A repetição de “a pessoa” evita ambiguidade de referente e mantém linguagem inclusiva sem alterar o sentido.
- source_word: וְטָהֵר
  choice: e ficará pura
  rationale: O verbo final apresenta o estado de pureza resultante após a lavagem. “Ficará pura” é natural em português e preserva a sequência legal-ritual.
- source_word: וְרָאָה
  choice: examinará
  rationale: O sacerdote realiza uma inspeção oficial, não apenas olha para a afecção.
- source_word: וְהִנֵּה
  choice: Se
  rationale: Na fórmula de inspeção, a partícula introduz a condição constatada. “Se” comunica com naturalidade a estrutura condicional implícita.
theological_decisions:
- issue: Natureza da ação sacerdotal na lei de pureza
  choice: O sacerdote declara oficialmente a pessoa pura.
  alternative: O sacerdote purifica a pessoa.
  rationale: Neste contexto jurídico-cultual, טהר indica a determinação do estado ritual. A tradução evita sugerir que o sacerdote cure a doença ou efetue pessoalmente uma purificação sacramental.
- issue: Sentido de pureza no versículo
  choice: “Pura” expressa o estado ritual reconhecido pela lei.
  alternative: “Limpa” como descrição de higiene física ou cura médica.
  rationale: O contexto de Levítico 13 trata da condição cultual determinada mediante inspeção, embora inclua a lavagem das roupas; por isso, “pura” preserva a categoria ritual sem confundi-la com mera limpeza física.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Afecção” mantém precisão sem soar excessivamente técnica, e “roupas” é preferível ao mais solene “vestes”. A repetição de “a pessoa” torna explícito o referente do hebraico masculino sem restringir desnecessariamente a aplicação do procedimento a um sexo.
