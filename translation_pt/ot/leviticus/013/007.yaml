base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: pt
  text: Mas, se a erupção escamosa[a] de fato se espalhar[b] na pele, depois de ter se apresentado ao sacerdote para sua purificação[c], deverá apresentar-se novamente ao sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a erupção”, “a erupção cutânea” ou, tradicionalmente, “a crosta”. O termo hebraico se refere a uma afecção superficial da pele que está sendo examinada.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico intensifica o verbo: “se a erupção certamente/de fato se espalhar”.'
    reason: lexical_alternative
  - marker: c
    text: “Para sua purificação” refere-se ao processo ou propósito do exame, tendo em vista a pureza ritual e uma eventual declaração de que a pessoa está pura.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: de fato se espalhar
  rationale: A construção com infinitivo absoluto e verbo finito intensifica פשה. “De fato se espalhar” preserva a ênfase de modo natural em português.
- source_word: הַמִּסְפַּחַת
  choice: a erupção escamosa
  rationale: O termo designa uma afecção superficial da pele submetida a exame sacerdotal; esta expressão evita a ideia moderna e restrita de uma crosta de ferida.
- source_word: בָּעוֹר
  choice: pela pele
  rationale: Indica a superfície ou área em que a afecção se alastra. O hebraico não traz possessivo explícito.
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: depois que a pessoa tiver se apresentado
  rationale: O nifal de ראה, no contexto do exame sacerdotal, descreve a apresentação da pessoa para ser examinada. A formulação sem gênero explícito é clara e natural.
- source_word: אֶל הַכֹּהֵן
  choice: ao sacerdote
  rationale: A preposição assinala o movimento ou a apresentação diante do sacerdote encarregado do exame.
- source_word: לְטָהֳרָתוֹ
  choice: para ser declarada pura
  rationale: No contexto de Levítico 13, trata-se do exame com vistas a uma determinação sacerdotal de pureza ritual, não necessariamente de uma cura física.
- source_word: וְנִרְאָה שֵׁנִית
  choice: deverá apresentar-se novamente
  rationale: No contexto legal, a forma verbal expressa a exigência de um novo comparecimento para exame.
theological_decisions:
- issue: Natureza da purificação em לְטָהֳרָתוֹ
  choice: para ser declarada pura
  alternative: para sua purificação
  rationale: A opção escolhida explicita o aspecto forense-ritual do exame sacerdotal sem sugerir que o sacerdote efetua uma cura ou lavagem; a nota preserva a amplitude possível da expressão.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Pessoa” evita introduzir um referente masculino não expresso como substantivo no versículo, enquanto os marcadores de nota foram mantidos na mesma posição fornecida pelo texto de consulta.
