  naturalness: O português é moderno e claro. «Na pele» corresponde mais diretamente ao hebraico do que «pela pele», que pode sugerir movimento através da pele. «Depois de ter se apresentado» evita uma referência de gênero desnecessária e soa natural em português internacional de boa legibilidade brasileira.
  terminology: «Erupção escamosa» é uma boa solução para הַמִּסְפַּחַת. «Purificação» preserva a amplitude ritual do hebraico; a nota pode esclarecer que o contexto inclui o exame e a eventual declaração de pureza, sem transformar isso no único sentido da frase.
