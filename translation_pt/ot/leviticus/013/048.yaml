base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: pt
  text: ou na urdidura ou na trama, seja de linho, seja de lã, ou no couro, ou em qualquer objeto feito de couro—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתִי
  choice: urdidura
  rationale: Designa os fios longitudinais do tecido; “urdidura” é o termo técnico corrente em português e forma o par natural com “trama”.
- source_word: עֵרֶב
  choice: trama
  rationale: Designa os fios transversais entrelaçados à urdidura; “trama” é claro e corrente em português.
- source_word: לַפִּשְׁתִּים
  choice: de linho
  rationale: Embora o termo possa designar o linho como planta ou fibra, neste contexto de materiais tecidos refere-se naturalmente ao tecido ou material de linho.
- source_word: וְלַצָּמֶר
  choice: seja de lã
  rationale: צֶמֶר significa “lã”; a construção “seja de linho, seja de lã” expressa com naturalidade as duas alternativas materiais.
- source_word: עוֹר
  choice: couro
  rationale: No contexto de objetos manufaturados, refere-se à pele animal usada como material; “couro” evita sugerir pele ainda não processada.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: em qualquer objeto feito de couro
  rationale: מְלָאכָה aqui indica produto ou artigo confeccionado, não trabalho abstrato; a formulação é clara e fiel ao sentido.
- source_word: אוֹ ... אוֹ
  choice: ou ... ou
  rationale: A repetição preserva a estrutura hebraica de alternativas, com “seja... seja” apenas na coordenação interna dos materiais para maior naturalidade em português.
