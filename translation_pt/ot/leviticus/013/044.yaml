id: LEV.13.44
reference: Leviticus 13:44
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: pt
  text: É um homem com uma doença de pele; está impuro. O sacerdote certamente o declarará impuro; a sua afecção está na cabeça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צָרוּעַ
  choice: um homem com uma doença de pele
  rationale: Mantém o sexo masculino expresso por אִישׁ e traduz צָרוּעַ sem identificar indevidamente a condição com a hanseníase moderna; o contexto abrange diferentes afecções cutâneas.
- source_word: טָמֵא הוּא
  choice: está impuro
  rationale: Em Levítico, טָמֵא designa sobretudo o estado de impureza ritual. “Impuro” é claro, digno e evita sugerir mera falta de higiene.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: certamente o declarará impuro
  rationale: O infinitivo absoluto seguido do verbo conjugado intensifica a declaração. Nesse procedimento diagnóstico, o sacerdote reconhece oficialmente o estado, não o causa.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente do oficial cultual encarregado do exame e da declaração.
- source_word: בְּרֹאשׁוֹ
  choice: na cabeça
  rationale: Reproduz de modo natural a localização indicada pelo hebraico, sem restringi-la interpretativamente ao couro cabeludo.
- source_word: נִגְעוֹ
  choice: a sua afecção
  rationale: נֶגַע refere-se aqui à manifestação diagnosticada. “Afecção” preserva o caráter médico-descritivo sem pressupor uma doença moderna específica nem sugerir uma epidemia.
theological_decisions:
- issue: Natureza da impureza
  choice: impuro
  alternative: sujo
  rationale: O versículo trata de uma condição ritual reconhecida pelo sacerdote, não de higiene ou culpa moral.
- issue: Função da declaração sacerdotal
  choice: o declarará impuro
  alternative: o tornará impuro
  rationale: O sacerdote emite o diagnóstico e a declaração oficial; a formulação evita atribuir-lhe a produção causal da impureza.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição enfática do hebraico é preservada por “certamente”; evita-se “leproso” por sua associação moderna específica com a hanseníase e por seu potencial estigmatizante.
