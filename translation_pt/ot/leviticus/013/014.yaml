  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: pt
  text: Mas, no dia em que aparecer carne viva nele, ficará impuro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּשָׂר חַי
  choice: carne viva
  rationale: Reproduz de modo claro e direto a expressão hebraica para tecido vivo ou em carne viva, preservando a terminologia concreta do diagnóstico.
- source_word: יִטְמָא
  choice: ficará impura
  rationale: Expressa o estado ritual resultante indicado pelo verbo hebraico, sem acrescentar uma declaração sacerdotal que não aparece neste versículo.
- source_word: בּוֹ
  choice: nela
  rationale: O pronome retoma naturalmente a condição descrita no contexto imediato; o feminino em português concorda com 'condição', evitando interpretar que a carne aparece 'na pessoa'.
theological_decisions:
- issue: Natureza da impureza
  choice: impura
  alternative: contaminada
  rationale: '''Impura'' conserva a categoria ritual e cultual de Levítico, sem sugerir necessariamente culpa moral ou contágio médico.'
- issue: Referente do pronome בּוֹ
  choice: nela
  alternative: na pessoa
  rationale: Mantém a leitura contextual refletida pela revisão auditada, entendendo o pronome como referência à condição/afecção, embora o hebraico permita discussão sobre o referente.
translation_notes:
  register: Português moderno, digno e acessível. A formulação conserva a imagem concreta 'carne viva' e explicita 'a pessoa' como sujeito natural em português, pois o hebraico traz apenas a forma verbal masculina singular.
