base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/016.yaml
  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: pt
  text: Ou, se a carne viva voltar a ficar branca, a pessoa irá ao sacerdote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֣וֹ כִ֥י
  choice: Ou, se
  rationale: אוֹ introduz um caso alternativo, e כִּי tem valor condicional neste contexto; juntos, são expressos naturalmente como “Ou, se”.
- source_word: יָשׁ֛וּב
  choice: voltar a
  rationale: O verbo שׁוב indica retorno ao estado anterior; com o verbo seguinte, “voltar a ficar” transmite a reversão da condição.
- source_word: הַ/בָּשָׂ֥ר הַ/חַ֖י
  choice: a carne viva
  rationale: Tradução direta da expressão hebraica, preservando o termo técnico e concreto usado no diagnóstico sacerdotal; no contexto, refere-se a tecido vivo ou em carne viva.
- source_word: וְ/נֶהְפַּ֣ךְ לְ/לָבָ֑ן
  choice: ficar branca
  rationale: O nifal de הפך descreve mudança de estado; “ficar branca” é natural em português e mantém o resultado visível da mudança.
- source_word: וּ/בָ֖א אֶל הַ/כֹּהֵֽן
  choice: a pessoa irá ao sacerdote
  rationale: A forma verbal dá continuidade ao procedimento. O sujeito implícito é explicitado de modo inclusivo e natural como “a pessoa”, evitando uma referência masculina potencialmente ambígua.
