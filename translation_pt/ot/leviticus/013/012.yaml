  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: pt
  text: Mas, se a doença de pele se espalhar pela pele[a] e cobrir toda a pele da pessoa afetada, da cabeça aos pés, até onde o sacerdote puder ver[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico צָרַעַת (tsaráat) designa em Levítico várias afecções da pele relacionadas à impureza ritual e não deve ser identificado de modo restrito com a hanseníase moderna.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “toda a pele da afecção”. A expressão hebraica se refere à pele da pessoa atingida pela doença.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: se espalhar por toda
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ideia de פרח. No contexto, “se espalhar por toda” comunica uma erupção extensa em português natural.
- source_word: הַצָּרַעַת
  choice: a doença de pele
  rationale: צָרַעַת designa em Levítico várias afecções que causam impureza ritual e não deve ser identificada especificamente com a hanseníase moderna.
- source_word: בָּעוֹר
  choice: por toda a pele
  rationale: A preposição בְּ descreve aqui a superfície corporal atingida; “por toda a pele” combina naturalmente com a ideia de propagação.
- source_word: וְכִסְּתָה
  choice: e cobrir
  rationale: Na oração condicional, a forma verbal prossegue a hipótese iniciada por “se”; o infinitivo flexionado em português mantém essa relação com clareza.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: toda a pele da pessoa afetada
  rationale: A expressão literal, “toda a pele da afecção”, é pouco natural; esta formulação explicita o referente humano sem alterar o alcance da doença.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: da cabeça aos pés
  rationale: Expressão portuguesa corrente que preserva o merismo hebraico de extensão corporal completa.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: até onde os olhos do sacerdote puderem ver
  rationale: Reproduz a referência explícita aos olhos do sacerdote e comunica naturalmente o limite do que é visível durante o exame.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A frase permanece aberta porque o versículo continua no seguinte. “Sacerdote” preserva o termo cultual, e “da cabeça aos pés” evita marcar gênero onde o português não o exige.
