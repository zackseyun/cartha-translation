  verdict: revise
  source_fidelity: A tradução comunica corretamente a condição, a cobertura completa da pele, a extensão «da cabeça aos pés» e o limite da observação sacerdotal. Contudo, «se espalhar por toda a pele» antecipa na primeira oração a totalidade que o hebraico explicita sobretudo na oração seguinte («e cobrir toda a pele»). Uma formulação menos expansiva preserva melhor a progressão do texto-fonte.
  naturalness: O português é claro e de registro adequado. «Até onde os olhos do sacerdote puderem ver» é compreensível, mas «até onde o sacerdote puder ver» é mais natural em português e transmite o mesmo idiomatismo hebraico.
  terminology: «Doença de pele» é uma solução acessível e prudentemente não médica para צָרַעַת; a nota explica de modo apropriado que não se trata necessariamente de hanseníase. «Sacerdote» preserva o termo cultual. A nota lexical mantém a alternativa literal sem a impor ao texto.
