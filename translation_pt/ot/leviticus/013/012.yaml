    rationale: O hebraico diz que a afecção irrompe/se espalha «na pele»; a cobertura de «toda a pele» vem explicitamente em seguida. «Por toda» na primeira oração pode fundir ou duplicar os dois elementos.
  - severity: low
    issue: «até onde os olhos do sacerdote puderem ver»
    rationale: A referência hebraica aos «olhos do sacerdote» é idiomática. Em português moderno, «até onde o sacerdote puder ver» é mais fluente, sem perda de sentido.
