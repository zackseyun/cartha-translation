  yaml_path: translation/ot/leviticus/013/018.yaml
  text: And when the body has a boil in its skin[a], and it heals[c][b],
translation:
  language: pt
  text: Quando alguém tiver na pele um furúnculo e ele sarar,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ele ficar curado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָשָׂר
  choice: alguém
  rationale: Embora בָּשָׂר signifique literalmente “carne” e possa designar o corpo, neste contexto jurídico-diagnóstico refere-se naturalmente a uma pessoa. “Alguém” evita a construção pouco idiomática em português na qual “o corpo” teria algo na própria pele.
- source_word: כִּי
  choice: quando
  rationale: Introduz uma situação prevista na legislação casuística. “Quando” reproduz bem o caráter procedural, embora “se” também seja possível.
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: tiver na pele
  rationale: A expressão hebraica usa o verbo “ser/haver” e duas indicações locativas. Em português, “tiver na pele” transmite o sentido de modo natural e conciso.
- source_word: שְׁחִין
  choice: um furúnculo
  rationale: שְׁחִין designa uma inflamação ou erupção cutânea, frequentemente vertida como “furúnculo”. É um termo corrente e adequado ao contexto médico-ritual.
- source_word: וְנִרְפָּא
  choice: e este sarar
  rationale: O nifal de רפא pode indicar que a lesão sara ou fica curada. “Este sarar” identifica claramente o furúnculo como referente e preserva a possibilidade intransitiva do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação casuística natural. A referência literal à “carne/corpo” foi expressa por “alguém”, pois o hebraico trata da pessoa examinada; a nota preserva a ambiguidade verbal relevante em וְנִרְפָּא.
