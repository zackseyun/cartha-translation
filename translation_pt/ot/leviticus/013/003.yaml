base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: pt
  text: O sacerdote examinará a lesão na pele do corpo. Se os pelos da lesão tiverem ficado brancos, e ela parecer mais profunda que a pele do corpo, é uma lesão de doença de pele[a]. Depois de examinar a pessoa, o sacerdote a declarará impura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “uma lesão de lepra” ou “uma afecção leprosa”. O termo hebraico צָרַעַת designa uma categoria mais ampla do que a hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: lesão
  rationale: No contexto diagnóstico de Levítico 13, designa uma área visivelmente afetada da pele. “Lesão” é clara e atual, sem pressupor uma etiologia médica específica.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: na pele do corpo
  rationale: Expressa naturalmente em português o sentido anatômico de עוֹר e בָּשָׂר, evitando o tom arcaico de “pele da carne”.
- source_word: שֵׂעָר
  choice: pelos
  rationale: No contexto da pele do corpo, o plural “pelos” é mais natural em português do que o coletivo “cabelo”.
- source_word: הָפַךְ לָבָן
  choice: tiverem ficado brancos
  rationale: Comunica a mudança e o estado resultante observado pelo sacerdote; concorda naturalmente com “pelos”.
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: ela parecer mais profunda que a pele do corpo
  rationale: Preserva o caráter visual de מַרְאֵה e a comparação do hebraico, indicando que a lesão aparenta estar abaixo do nível da pele.
- source_word: נֶגַע צָרַעַת
  choice: uma lesão de doença de pele
  rationale: Mantém representados os dois substantivos hebraicos e evita identificar צָרַעַת exclusivamente com a hanseníase moderna. Embora haja alguma repetição semântica, ela reflete a formulação classificatória do original.
- source_word: וְרָאָהוּ
  choice: Depois de examinar a pessoa
  rationale: O sufixo pode formalmente referir-se a ele/ela ou a isso; o contexto favorece a pessoa examinada. A formulação evita ambiguidade de gênero e preserva a sequência entre exame e veredito.
- source_word: וְטִמֵּא אֹתוֹ
  choice: o sacerdote a declarará impura
  rationale: No contexto jurídico-sacerdotal, o verbo indica um veredito sobre o estado ritual, não que o sacerdote cause a impureza.
theological_decisions:
- issue: Sentido de צָרַעַת na legislação de pureza
  choice: doença de pele
  alternative: lepra; afecção cutânea que causa impureza
  rationale: צָרַעַת abrange uma categoria ritual antiga que não corresponde de modo exato à hanseníase moderna. A opção principal evita precisão médica anacrônica; a tradução tradicional é registrada em nota.
- issue: Natureza da ação sacerdotal em וְטִמֵּא אֹתוֹ
  choice: declarará impura
  alternative: tornará impura
  rationale: O sacerdote examina e profere um veredito de condição ritual. “Declarará” evita sugerir que ele produza a impureza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pessoa” e o pronome “a” evitam presumir sexo não expresso no hebraico. A divisão em três frases melhora a clareza sem alterar a sequência legal do versículo.
