revisions:
- from: 'Quanto à pessoa que tem a doença de pele, aquela em quem está a lesão, suas roupas ficarão rasgadas, seu cabelo ficará solto, ela cobrirá o lábio superior[a] e gritará: “Impuro! Impuro!”'
  to: 'Quanto àquele que tem doença de pele, aquele em quem estiver a lesão, suas roupas estarão rasgadas, seu cabelo ficará solto, ele cobrirá o lábio superior[a] e gritará: “Impuro! Impuro!”'
  rationale: A revisão limita-se a restaurar a marcação masculina singular presente no hebraico, substituindo “a pessoa ... ela” por “àquele ... ele”. Também ajusta “está” para “estiver”, tornando a oração relativa mais fluente no período legislativo português. As demais escolhas preservam com precisão o sentido textual e a ambiguidade lexical.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:40Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência de prescrições e o valor ritual de “impuro”. Contudo, o hebraico emprega formas masculinas singulares (הַצָּרוּעַ; בּוֹ; בְּגָדָיו; רֹאשׁוֹ; יִקְרָא). A construção “a pessoa ... ela” substitui sistematicamente essa marcação por feminino gramatical. Uma formulação masculina genérica preserva com maior precisão a forma do texto-fonte sem identificar a afecção com hanseníase.
  naturalness: O português é claro e moderno. “Aquele que tem doença de pele” é natural, mantém registro legislativo solene e evita a alternância potencialmente distraente entre “pessoa” e pronomes femininos. “Estiver” é mais direto para a cláusula “em quem está a lesão”.
  terminology: “Doença de pele”, “lesão”, “roupas rasgadas”, “cabelo solto” e “impuro” são escolhas adequadas. “Impuro” deve permanecer, pois comunica o status ritual sem importar uma explicação médica ou moral. A nota para “lábio superior” preserva corretamente a alternativa “região do bigode”.
  issues:
  - severity: medium
    issue: Marcação de gênero não correspondente ao singular masculino do hebraico
    rationale: Embora “pessoa” possa ser inclusivo em português, a retomada por “ela” converte as formas masculinas singulares do texto hebraico em feminino. “Aquele que” conserva a marcação formal da fonte e ainda pode funcionar genericamente em português.
  revised_text: 'Quanto àquele que tem doença de pele, aquele em quem estiver a lesão, suas roupas estarão rasgadas, seu cabelo ficará solto, ele cobrirá o lábio superior[a] e gritará: “Impuro! Impuro!”'
  revised_footnotes:
