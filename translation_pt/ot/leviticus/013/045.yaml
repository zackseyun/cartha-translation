  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: pt
  text: 'Quanto àquele que tem doença de pele, aquele em quem estiver a lesão, suas roupas estarão rasgadas, seu cabelo ficará solto, ele cobrirá o lábio superior[a] e gritará: “Impuro! Impuro!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobrirá a região do bigode”. A expressão hebraica se refere à área do lábio superior ou do bigode.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: a pessoa que tem a doença de pele
  rationale: Evita associar a condição especificamente à hanseníase e expressa a categoria mais ampla de afecções cutâneas tratada no contexto levítico.
- source_word: הַנֶּגַע
  choice: a lesão
  rationale: Neste contexto, נֶגַע designa a manifestação ou área afetada examinada pelo sacerdote. “Lesão” é natural em português e não introduz a ideia moderna de infecção microbiana.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: suas roupas ficarão rasgadas
  rationale: Preserva o sentido de vestes rasgadas como sinal público de aflição, em linguagem corrente.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: seu cabelo ficará solto
  rationale: פָרוּעַ indica cabelo deixado solto, não cuidado ou desalinhado; “ficará solto” preserva a imagem concreta sem sugerir cabeça descoberta.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: ela cobrirá o lábio superior
  rationale: שָׂפָם pode indicar o lábio superior ou a região do bigode. A formulação escolhida é mais literal e aplicável à pessoa sem acrescentar uma característica masculina; a alternativa tradicional é registrada em nota.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: 'e gritará: “Impuro! Impuro!”'
  rationale: A repetição é mantida como declaração pública enfática. “Gritará” comunica a função de advertência, e “impuro” designa aqui o estado ritual.
theological_decisions:
- issue: Natureza da impureza em Levítico 13
  choice: Traduzir טָמֵא por “impuro” como condição ritual e pública.
  alternative: “Contaminado” ou “imundo”, com possível conotação médica, higiênica ou moral.
  rationale: O termo, neste contexto, indica o estado ritual que afeta a participação comunitária, sem afirmar culpa moral pessoal nem identificar uma categoria médica moderna.
- issue: Identidade da afecção designada por צרע
  choice: “doença de pele”
  alternative: “lepra” ou “hanseníase”
  rationale: A categoria hebraica é mais ampla do que a hanseníase moderna; a tradução evita uma identificação médica indevidamente específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “pessoa” e retomadas pronominais femininas por concordância gramatical, sem alterar o referente humano do masculino singular hebraico. Mantém a repetição solene da declaração ritual.
