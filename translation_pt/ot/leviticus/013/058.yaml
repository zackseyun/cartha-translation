  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: pt
  text: Mas a roupa, os fios da urdidura, os fios da trama ou qualquer objeto de couro, se forem lavados e a mancha desaparecer deles, deverão ser lavados uma segunda vez e ficarão puros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: a roupa
  rationale: בגד designa de modo geral uma peça de vestuário ou tecido; “roupa” é corrente, claro e adequado ao contexto.
- source_word: הַשְּׁתִי
  choice: os fios da urdidura
  rationale: Termo técnico para os fios longitudinais do tecido; a explicitação “fios da” torna “urdidura” compreensível no contexto.
- source_word: הָעֵרֶב
  choice: os fios da trama
  rationale: Termo técnico correspondente aos fios transversais entrelaçados à urdidura; “trama” é o equivalente moderno usual em português.
- source_word: כָל כְּלִי הָעוֹר
  choice: qualquer objeto de couro
  rationale: כְּלִי pode indicar utensílio, artigo ou objeto; “objeto” preserva a amplitude sem restringir o sentido a recipiente.
- source_word: תְּכַבֵּס
  choice: for lavado
  rationale: O piel de כבס indica lavagem de roupa ou material. A formulação passiva concorda naturalmente com a sequência de itens e evita um “você” ambíguo.
- source_word: הַנָּגַע
  choice: a mancha
  rationale: Neste contexto de tecidos e couro, נגע indica a manifestação visível examinada pelo sacerdote. “Mancha” é concreta e evita impor um diagnóstico microbiológico moderno.
- source_word: וְסָר מֵהֶם
  choice: e do qual a mancha desaparecer
  rationale: Mantém a coordenação hebraica com וְ, ao mesmo tempo que a oração relativa expressa naturalmente em português o caso em que a alteração some após a lavagem.
- source_word: וְכֻבַּס שֵׁנִית
  choice: deverá ser lavado uma segunda vez
  rationale: A passiva com שֵׁנִית prescreve nova lavagem; “deverá” comunica a força procedimental.
- source_word: וְטָהֵר
  choice: então ficará puro
  rationale: No contexto levítico, טהר expressa pureza ritual, não mera limpeza física. “Puro” preserva essa distinção, e “então” torna clara a consequência da segunda lavagem.
theological_decisions:
- issue: Sentido ritual de וְטָהֵר
  choice: ficará puro
  alternative: ficará limpo
  rationale: “Puro” conserva a categoria ritual própria de Levítico e evita reduzir a declaração ao estado físico do objeto.
- issue: Natureza de הַנָּגַע em materiais
  choice: a mancha
  alternative: a infecção
  rationale: O texto descreve uma alteração observável em roupa, fios ou couro sem identificá-la segundo categorias médicas modernas; “mancha” mantém essa cautela.
translation_notes:
  register: Português moderno, digno e acessível, com termos têxteis precisos acompanhados de “fios da” para facilitar a compreensão. A sintaxe conserva a longa enumeração legal do hebraico, mas usa pontuação natural em português.
