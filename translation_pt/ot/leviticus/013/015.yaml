  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: pt
  text: Quando o sacerdote vir a carne viva[a], declarará essa pessoa impura[b]. A carne viva é impura; é uma doença de pele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “carne viva”, isto é, tecido vivo exposto.'
    reason: lexical_alternative
  - marker: b
    text: Ou “a considerará impura”. O sacerdote emite uma decisão oficial sobre o estado de pureza ritual da pessoa.
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, “lepra”. O termo hebraico é mais amplo e não se refere especificamente à hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Quando ... vir
  rationale: O waw seguido de qatal dá continuidade ao procedimento legal. A oração temporal expressa com naturalidade a condição para a decisão sacerdotal.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: É a designação comum de כֹּהֵן e identifica o encarregado da inspeção ritual.
- source_word: הַבָּשָׂר הַחַי
  choice: a carne viva
  rationale: A expressão significa literalmente “a carne viva” e, em português, comunica de modo natural tecido vivo exposto, preservando ao mesmo tempo a forma do hebraico.
- source_word: וְטִמְּאוֹ
  choice: declarará essa pessoa impura
  rationale: No contexto das leis sacerdotais, o piel de טמא indica uma decisão oficial sobre o estado ritual da pessoa, não que o sacerdote cause sua impureza.
- source_word: טָמֵא הוּא
  choice: é impura
  rationale: “Impura” conserva a categoria ritual de טָמֵא e concorda naturalmente com “carne” em português.
- source_word: צָרַעַת
  choice: uma doença de pele
  rationale: O termo hebraico abrange condições cutâneas e não equivale especificamente à hanseníase moderna. Esta formulação é clara sem alegar precisão diagnóstica indevida.
theological_decisions:
- issue: Sentido de צָרַעַת na legislação de pureza de Levítico
  choice: doença de pele
  alternative: lepra; afecção que causa impureza
  rationale: “Doença de pele” evita identificar a categoria ritual antiga com a hanseníase moderna e preserva a amplitude do termo, enquanto a frase anterior explicita a condição de impureza.
- issue: Função do sacerdote ao aplicar טמא
  choice: declarará essa pessoa impura
  alternative: tornará essa pessoa impura
  rationale: A tradução apresenta o sacerdote como aquele que profere a decisão ritual oficial, sem sugerir que ele produza a condição física ou ritual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Carne viva” é simultaneamente fiel ao hebraico e idiomática em português. “Essa pessoa” evita um pronome masculino isolado sem perder o referente humano do sufixo hebraico.
