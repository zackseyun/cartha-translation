base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: pt
  text: O sacerdote a examinará[a] e eis que a área afetada ficou branca; o sacerdote declarará pura a área afetada[b]. Ela está pura[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a inspecionará”. O hebraico diz literalmente “a verá”, mas aqui se refere ao exame feito pelo sacerdote.
    reason: lexical_alternative
  - marker: b
    text: Ou “declarará limpa a área afetada”. Trata-se de um veredito de pureza ritual, não de cura ou limpeza física.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “puro é ele”. O pronome é masculino singular e retoma o termo hebraico traduzido por “área afetada”; em português, a concordância segue o feminino de “área”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: a examinará
  rationale: Embora ראה signifique literalmente “ver”, neste contexto de inspeção sacerdotal indica exame. O pronome feminino retoma naturalmente “área afetada” em português.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente usual de כֹּהֵן e designação da autoridade encarregada da inspeção e do veredito ritual.
- source_word: וְהִנֵּה
  choice: se
  rationale: Neste procedimento legal, וְהִנֵּה introduz o resultado constatado no exame. “Se” expressa com naturalidade em português a condição observada, sem acrescentar certeza médica.
- source_word: נֶהְפַּךְ
  choice: tiver ficado
  rationale: O nifal indica mudança de estado; com uma cor, “ter ficado branca” é português natural e preserva o valor resultativo.
- source_word: הַנֶּגַע
  choice: a área afetada
  rationale: נֶגַע designa a manifestação visível submetida à inspeção, sem corresponder necessariamente a um diagnóstico médico moderno. “Área afetada” é concreta e suficientemente ampla.
- source_word: לְלָבָן
  choice: branca
  rationale: Tradução direta do termo de cor, com concordância com “área”.
- source_word: וְטִהַר
  choice: declarará pura
  rationale: No contexto de Levítico 13, o sacerdote profere um veredito de pureza ritual; não cura nem efetua uma limpeza física.
- source_word: טָהוֹר הוּא
  choice: Ela está pura
  rationale: Preserva a cláusula enfática e conclusiva do hebraico. O masculino singular hebraico pode retomar נֶגַע; em português, o feminino concorda com “área afetada”.
theological_decisions:
- issue: Natureza da ação sacerdotal na legislação de pureza
  choice: O sacerdote declara pura a área afetada.
  alternative: O sacerdote purifica ou limpa a área afetada.
  rationale: Aqui טהר descreve o veredito autorizado após a inspeção, não uma ação médica, física ou sacramental realizada pelo sacerdote.
- issue: Referente do veredito final טָהוֹר הוּא
  choice: A frase final retoma a área afetada conforme a gramática da tradução.
  alternative: A frase poderia ser entendida como um veredito sobre a pessoa examinada.
  rationale: O antecedente explícito imediato é נֶגַע, masculino singular. A tradução mantém essa referência sem excluir que o veredito tenha consequências para o estado ritual da pessoa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita terminologia médica anacrônica e conserva a repetição conclusiva do hebraico. O condicional “se” apresenta de modo natural o achado da inspeção no gênero legal.
