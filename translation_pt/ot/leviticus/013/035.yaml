base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: pt
  text: Mas, se a afecção escamosa de fato se espalhar na pele depois de ter sido declarado puro,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tinha”. O termo hebraico designa uma afecção específica descrita neste capítulo, localizada no couro cabeludo ou na barba e associada à alteração dos pelos e, provavelmente, à descamação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A conjunção introduz um caso condicional que contrasta com a declaração de pureza do versículo anterior; “Mas, se” expressa essa transição com naturalidade.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: de fato se espalhar
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ideia verbal. “De fato” conserva essa ênfase sem sugerir necessariamente propagação contínua ou extensa.
- source_word: הַנֶּתֶק
  choice: a afecção escamosa
  rationale: Neste capítulo, נֶתֶק designa uma afecção específica do couro cabeludo ou da barba, associada à alteração dos pelos e provavelmente à descamação. A expressão é clara e evita reduzir o termo a mera coceira.
- source_word: בָּעוֹר
  choice: pela pele
  rationale: עוֹר significa “pele”; com o verbo “espalhar-se”, “pela pele” é a formulação portuguesa mais natural para indicar a área de propagação.
- source_word: אַחֲרֵי טָהֳרָתוֹ
  choice: depois de ele ser declarado puro
  rationale: No procedimento imediato, a pureza é determinada pelo sacerdote. A formulação explicita esse sentido contextual sem transformar a pureza ritual em pureza moral.
theological_decisions:
- issue: Sentido ritual de טָהֳרָתוֹ
  choice: depois de ele ser declarado puro
  alternative: depois de sua purificação
  rationale: O contexto trata da avaliação sacerdotal e da condição ritual da pessoa. “Declarado puro” evita sugerir purificação moral ou cura médica, embora o substantivo hebraico também possa ser traduzido mais literalmente por “purificação” ou “estado de pureza”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Afecção escamosa” funciona como designação descritiva; a alternativa tradicional “tinha” é preservada em nota. A vírgula final mantém a continuidade sintática com o versículo seguinte.
