source:
  edition: WLC
  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: pt
  text: Mas, se a mancha voltar a aparecer na roupa, nos fios da urdidura ou da trama, ou em qualquer objeto de couro, ela está se alastrando. Queime no fogo o objeto em que está a mancha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “mancha” é uma designação técnica em Levítico para uma área atingida ou contaminada; tradicionalmente também se traduz por “praga”, “afecção” ou “marca”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: voltar a aparecer
  rationale: Expressa de modo natural a recorrência da mancha após o procedimento anterior, preservando o sentido observacional do nifal de ראה e a força temporal de עוֹד.
- source_word: בֶּגֶד
  choice: roupa
  rationale: Termo corrente e abrangente para peça de vestuário ou tecido no contexto; mantém boa legibilidade em português moderno.
- source_word: שְׁתִי ... עֵרֶב
  choice: fios da urdidura ou da trama
  rationale: Usa os termos técnicos portugueses para os fios longitudinais e transversais do tecido, acrescentando 'fios' para tornar a expressão compreensível.
- source_word: כְּלִי עוֹר
  choice: objeto de couro
  rationale: Preserva a amplitude da expressão hebraica, que pode indicar qualquer utensílio ou artigo feito de pele/couro.
- source_word: פֹּרַחַת הִוא
  choice: ela está se alastrando
  rationale: O particípio de פרח, literalmente ligado a brotar ou florescer, descreve aqui a expansão ativa da afecção; 'se alastrando' comunica essa progressão sem impor diagnóstico médico.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Queime no fogo
  rationale: Reproduz a instrução legal direta na segunda pessoa do singular em português natural e digno.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: o objeto em que está a mancha
  rationale: Torna explícito o referente material da construção relativa sem restringir qual dos objetos mencionados está contaminado.
- source_word: הַנָּגַע
  choice: a mancha
  rationale: Neste contexto de inspeção de tecidos e couro, designa a área visivelmente afetada. 'Mancha' evita tanto a ideia moderna específica de infecção quanto o sentido excessivamente amplo de 'praga'.
theological_decisions: []
