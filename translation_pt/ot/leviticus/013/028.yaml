base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: pt
  text: Mas, se a mancha clara permanecer no mesmo lugar[a], não tiver se espalhado pela pele e estiver desbotada, é o inchaço resultante da queimadura. O sacerdote o declarará puro, pois é a cicatriz da queimadura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «permanecer sob ela». O hebraico diz literalmente que a mancha clara «permanece sob ela»; neste contexto, a expressão indica que ela permanece no lugar, sem se espalhar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: permanecer no mesmo lugar
  rationale: O hebraico diz literalmente que a mancha «fica debaixo dela», mas, no contexto do diagnóstico, a expressão indica que ela permanece estacionária; a tradução natural preserva esse sentido e a nota registra a forma literal.
- source_word: הַבַּהֶרֶת
  choice: a mancha clara
  rationale: Designa uma descoloração visivelmente clara ou brilhante examinada na pele; «mancha clara» é corrente e compreensível em português.
- source_word: לֹא פָשְׂתָה בָעוֹר
  choice: não tiver se espalhado pela pele
  rationale: O verbo é o termo diagnóstico recorrente para a expansão da lesão, e «pela pele» expressa naturalmente o âmbito em que ela se espalharia.
- source_word: כֵהָה
  choice: desbotada
  rationale: Indica redução de brilho ou intensidade; «desbotada» descreve com naturalidade uma marca que perdeu vivacidade.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: a elevação causada pela queimadura
  rationale: שְׂאֵת denota algo elevado ou inchado na pele. «Elevação» evita confundir a observação visual com um processo inflamatório e explicita naturalmente a relação com a queimadura.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: O sacerdote o declarará puro
  rationale: Neste contexto legal e diagnóstico, o verbo significa emitir uma declaração de pureza ritual, não efetuar fisicamente uma limpeza.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: a cicatriz da queimadura
  rationale: O substantivo indica a marca ou cicatriz resultante da queimadura; «cicatriz» é conciso e adequado ao contexto.
theological_decisions:
- issue: Sentido ritual de טהר
  choice: declarará puro
  alternative: purificará
  rationale: 'A decisão preserva a função avaliadora do sacerdote no capítulo: ele reconhece e declara o estado de pureza, em vez de produzir a cura ou a pureza por sua ação.'
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. «Mancha clara», «elevação» e «cicatriz» mantêm o caráter observacional do diagnóstico sem introduzir terminologia médica moderna ausente do texto.
