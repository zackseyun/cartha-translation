  text: If a man loses the hair of his head[a], he is bald; he is clean.
translation:
  language: pt
  text: Se um homem perder o cabelo da cabeça[a], ele é calvo; está puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficar sem cabelo na cabeça”. O verbo hebraico pode indicar ficar sem cabelo ou ter o cabelo removido; o texto principal preserva a distinção verbal antes de “ele é calvo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: um homem
  rationale: Mantém o masculino singular do hebraico e o referente provável nesta norma sobre uma condição corporal.
- source_word: כִּי
  choice: se
  rationale: Neste contexto jurídico e diagnóstico, introduz um caso condicional.
- source_word: יִמָּרֵט
  choice: perder os cabelos
  rationale: O nifal de מרט indica ficar desprovido de cabelo ou ter o cabelo removido. A formulação não especifica a causa e preserva a distinção em relação ao predicado seguinte, 'calvo'.
- source_word: רֹאשׁוֹ
  choice: da cabeça
  rationale: Expressa naturalmente em português a relação com os cabelos, mantendo a referência explícita à cabeça.
- source_word: קֵרֵחַ
  choice: calvo
  rationale: Traduz de modo claro e atual o adjetivo que declara a condição resultante.
- source_word: טָהוֹר
  choice: puro
  rationale: No sistema terminológico de Levítico, 'puro' comunica o estado ritual em oposição a 'impuro', sem indicar inocência moral.
- source_word: הוּא ... הוּא
  choice: ele é ... está ...
  rationale: As duas predicações são preservadas; na segunda, o sujeito fica implícito de maneira natural em português.
theological_decisions:
- issue: Terminologia do estado ritual na legislação levítica sobre impureza
  choice: puro
  alternative: limpo
  rationale: '''Puro'' é a formulação portuguesa mais estabelecida e digna para a categoria ritual טָהוֹר, em oposição a ''impuro''; o contexto deixa claro que não se trata de pureza moral.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a estrutura concisa do diagnóstico legal e a distinção hebraica entre a perda de cabelo e a declaração de calvície.
