base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: pt
  text: E, se o sacerdote examinar a área afetada pela afecção descamativa[a] e vir que ela não parece mais profunda do que a pele e que não há pelos pretos nela, isolará por sete dias a área afetada pela afecção descamativa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coceira” ou, tradicionalmente, “tinha”, para “afecção descamativa” (נֶתֶק), uma condição específica da pele ou do couro cabeludo neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: área afetada
  rationale: No contexto da inspeção de Levítico 13, designa uma região visivelmente afetada, sem exigir a ideia moderna de praga ou uma etiologia médica específica.
- source_word: נֶתֶק
  choice: afecção descamativa
  rationale: Expressa uma condição específica do couro cabeludo ou da barba associada à perda de pelos, sem recorrer a um termo arcaico nem identificar com certeza uma doença moderna.
- source_word: מַרְאֵהוּ
  choice: não parece
  rationale: Integra de modo natural em português a referência à aparência visual da área examinada.
- source_word: עָמֹק מִן־הָעוֹר
  choice: mais profunda que a pele
  rationale: Preserva a comparação do hebraico e a ideia de que a lesão aparenta estar abaixo da superfície da pele.
- source_word: שֵׂעָר שָׁחֹר
  choice: pelo preto
  rationale: Mantém a cor especificada no hebraico e usa o singular coletivo natural em português.
- source_word: וְהִסְגִּיר
  choice: isolará
  rationale: Comunica a separação temporária para observação prevista na legislação ritual, sem impor as conotações epidemiológicas mais específicas de 'quarentena'.
- source_word: שִׁבְעַת יָמִים
  choice: por sete dias
  rationale: Forma temporal corrente e natural com o verbo 'isolar'.
- source_word: וְכִי
  choice: Quando
  rationale: Neste caso legal, introduz de maneira natural a condição que desencadeia o procedimento; o valor condicional permanece evidente no contexto.
- source_word: יִרְאֶה
  choice: examinar
  rationale: Embora o verbo signifique literalmente 'ver', aqui descreve a inspeção oficial realizada pelo sacerdote.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia descritiva e não excessivamente técnica. A repetição de “área afetada pela afecção descamativa” acompanha a formulação jurídica do hebraico; “isolará” mantém o objeto gramatical do texto sem explicitar além dele se a medida recaía, na prática, sobre a pessoa.
