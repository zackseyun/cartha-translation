review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a inspeção sacerdotal, a aparência não mais profunda que a pele, a ausência de pelo preto e o isolamento por sete dias. Contudo, «Quando» torna a construção mais temporal do que condicional; וְכִי é melhor preservado por «E, se». A nota também deve apresentar «tinha» como alternativa lexical, sem sugerir uma identificação médica ou uma relação necessária com perda de pelos.
  naturalness: O texto é claro e de registro apropriado. «E, se ... e vir que» expressa de forma natural a sequência jurídica e visual do hebraico. «Não houver pelos pretos» é mais idiomático do que o singular coletivo «não há pelo preto» neste contexto.
  terminology: «Área afetada» para נֶגַע, «afecção descamativa» para נֶתֶק e «isolará» para וְהִסְגִּיר são escolhas modernas, neutras e adequadas. A nota lexical deve manter a incerteza sobre o referente exato de נֶתֶק e evitar reduzir o termo a uma doença específica.
  issues:
  - severity: medium
    issue: «Quando» em vez de uma condicional explícita
    rationale: וְכִי introduz o caso condicional da legislação. «E, se» preserva tanto a condição quanto a ligação com o contexto precedente.
  - severity: medium
    issue: A nota associa a condição à perda de pelos e à restringe ao couro cabeludo ou à barba
    rationale: O versículo especifica a ausência de pelo preto, não uma perda de pelos; além disso, o referente preciso de נֶתֶק é disputado. A nota inglesa de controle o descreve de modo mais cauteloso como condição de pele ou couro cabeludo.
  revised_text: E, se o sacerdote examinar a área afetada pela afecção descamativa[a] e vir que ela não parece mais profunda do que a pele e que não há pelos pretos nela, isolará por sete dias a área afetada pela afecção descamativa.
