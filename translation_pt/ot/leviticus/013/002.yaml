  naturalness: O texto é claro e de registro apropriado. Contudo, depois de “uma pessoa”, o pronome “ela” e o particípio feminino em “levada” são gramaticalmente possíveis, mas tornam a referência menos direta e soam menos naturais numa norma de alcance genérico. Repetir “a pessoa” resolve isso. “Seu corpo” também explicita o possessivo presente no hebraico.
  terminology: “Inchaço”, “crosta” e “mancha clara” são escolhas naturais e suficientemente cautelosas. “Lesão de doença de pele” conserva a relação entre נֶגַע e צָרָעַת sem sugerir um diagnóstico médico moderno específico. Arão e sacerdote estão adequadamente vertidos.
