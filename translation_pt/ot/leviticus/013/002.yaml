base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: pt
  text: Quando uma pessoa tiver na pele do seu corpo um inchaço, uma crosta ou uma mancha clara, e isso se tornar, na pele do seu corpo, uma lesão de doença de pele[a], a pessoa deverá ser levada a Arão, o sacerdote, ou a um de seus filhos, os sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “lepra” ou “doença leprosa”. O hebraico צָרָעַת (tsaraat) designa mais amplamente uma categoria de afecções da pele e não corresponde necessariamente à hanseníase moderna.
    reason: Registra a tradução tradicional e esclarece a amplitude e a incerteza médica do termo hebraico.
lexical_decisions:
- source_word: אָדָם
  choice: uma pessoa
  rationale: Introduz genericamente o indivíduo contemplado nesta norma. Em português atual, “uma pessoa” expressa com naturalidade o valor inclusivo do substantivo hebraico.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: na pele do corpo
  rationale: Preserva a expressão anatômica concreta e sua repetição no hebraico, evitando o pouco natural “na pele de sua carne”.
- source_word: שְׂאֵת
  choice: uma inchação
  rationale: Designa uma área elevada da pele; “inchação” é concreta, clara e não impõe um diagnóstico moderno específico.
- source_word: סַפַּחַת
  choice: uma crosta
  rationale: O referente dermatológico exato é incerto. “Crosta” conserva o sentido tradicional de uma lesão superficial concreta sem especificação médica excessiva.
- source_word: בַּהֶרֶת
  choice: uma mancha clara
  rationale: Comunica uma marca de aspecto claro ou brilhante sem restringi-la necessariamente a uma mancha branca.
- source_word: לְנֶגַע צָרָעַת
  choice: uma lesão de doença de pele
  rationale: “Lesão” representa נֶגַע no contexto diagnóstico, e “doença de pele” evita identificar צָרָעַת automaticamente com a hanseníase moderna.
- source_word: וְהוּבָא
  choice: ela deverá ser levada
  rationale: Mantém a voz passiva e a força procedimental da instrução legal, em português natural.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: Arão, o sacerdote
  rationale: Reproduz de modo direto e idiomático o nome acompanhado do título.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: um de seus filhos, os sacerdotes
  rationale: Conserva tanto a relação familiar quanto a identificação sacerdotal em aposição.
theological_decisions:
- issue: Tradução de צָרָעַת
  choice: doença de pele
  alternative: lepra; doença leprosa; tsaraat
  rationale: O termo hebraico abrange uma categoria bíblica de afecções diagnosticadas ritualmente e não deve ser equiparado sem ressalvas à hanseníase. A tradução principal comunica o âmbito dermatológico sem impor um diagnóstico moderno; a forma tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica compreensível. “Uma pessoa” mantém o caráter genérico da norma; a repetição de “na pele do corpo” preserva a estrutura enfática do hebraico.
