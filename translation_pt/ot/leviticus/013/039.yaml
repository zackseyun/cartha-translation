revisions:
- from: O sacerdote examinará e, se houver na pele do corpo dessas pessoas manchas brancas sem brilho, trata-se de uma erupção cutânea[a] que apareceu na pele; essa pessoa está pura.
  to: Se, ao examinar, o sacerdote constatar na pele do corpo dessas pessoas manchas brancas sem brilho, trata-se de uma erupção cutânea[a] que irrompeu na pele; essa pessoa está pura.
  rationale: A revisão torna explícito que as manchas são o resultado constatado pelo sacerdote, em vez de uma condição solta após «examinará». Também substitui «apareceu» por «irrompeu», que é uma equivalência mais específica e natural para o verbo hebraico no contexto de uma manifestação cutânea. O restante, inclusive o veredito ritual «essa pessoa está pura» e a nota de incerteza lexical, é preservado.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:51Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a inspeção sacerdotal, as manchas brancas de aspecto apagado, a identificação de בֹּהַק e o veredito de pureza ritual. Contudo, «se houver» transforma a apresentação constatativa de וְהִנֵּה («e eis que») numa condição independente e torna a construção menos direta. «Apareceu» é possível para פָּרַח, mas «irrompeu» preserva melhor a ideia de eclosão/manifestação da afecção na pele.
  naturalness: O registro é claro e moderno. A sequência «examinará e, se houver» soa sintaticamente um pouco truncada, pois a existência das manchas é aquilo que o sacerdote constata. «Se, ao examinar, ele constatar...» é mais idiomático em português jurídico-procedimental e conserva a função condicional do enunciado legal.
  terminology: «Sacerdote», «manchas brancas sem brilho», «erupção cutânea» e «pura» são adequados. «Pura» mantém o termo cultual sem introduzir uma explicação denominacional; a nota esclarece corretamente que se trata de uma condição que não implica impureza no contexto.
  issues:
  - severity: low
    issue: Formulação de וְהִנֵּה
    rationale: «Se houver» não representa tão bem a função de constatação introduzida por «e eis que» e deixa o sujeito da constatação implícito de modo menos natural. Uma oração com «se, ao examinar, ele constatar» preserva tanto o caráter legal quanto o resultado do exame.
  - severity: low
    issue: Verbo para פָּרַח
    rationale: «Apareceu» é amplo e aceitável, mas «irrompeu» traduz mais precisamente o surgimento eruptivo indicado pelo verbo no contexto dermatológico, sem impor diagnóstico médico.
