  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: pt
  text: Se, ao examinar, o sacerdote constatar na pele do corpo dessas pessoas manchas brancas sem brilho, trata-se de uma erupção cutânea[a] que irrompeu na pele; essa pessoa está pura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma afecção da pele” ou “uma mancha na pele”. O raro termo hebraico indica aqui uma condição que não torna a pessoa impura, distinta da afecção mais grave tratada neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: examinará
  rationale: No contexto das inspeções sacerdotais de Levítico 13, o verbo indica exame ou inspeção, não apenas o ato de ver. O futuro é natural em português para uma instrução legal.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente convencional e exato para o responsável pela inspeção e pelo veredito neste contexto.
- source_word: וְהִנֵּה
  choice: se houver
  rationale: 'Em legislação casuística, introduz o resultado constatado durante o exame. A formulação condicional comunica essa função de modo natural em português, embora a expressão tenha literalmente força de apresentação: ''e eis que''.'
- source_word: בְעוֹר בְּשָׂרָם
  choice: na pele do corpo dessas pessoas
  rationale: Mantém a referência plural do sufixo hebraico e expressa בשר de maneira idiomática em português; 'pele da carne deles' seria excessivamente rígido.
- source_word: בֶּהָרֹת
  choice: manchas
  rationale: Designa marcas ou áreas visíveis na pele; os adjetivos seguintes especificam sua cor e aparência.
- source_word: כֵּהוֹת לְבָנֹת
  choice: brancas sem brilho
  rationale: Preserva tanto a cor branca quanto a aparência apagada ou pouco intensa indicada por כֵּהוֹת.
- source_word: בֹּהַק
  choice: uma erupção cutânea
  rationale: O termo raro designa uma condição visível da pele que, no contexto, não produz impureza. A tradução evita identificá-la com uma enfermidade moderna específica e a nota registra a incerteza lexical.
- source_word: פָּרַח
  choice: apareceu
  rationale: Em referência a uma afecção da pele, o verbo descreve seu surgimento ou erupção. 'Apareceu' é claro e natural sem sugerir necessariamente propagação.
- source_word: טָהוֹר הוּא
  choice: essa pessoa está pura
  rationale: Expressa o veredito de pureza no sistema ritual de Levítico. 'Essa pessoa' resolve com naturalidade a passagem da referência plural anterior ao veredito singular hebraico sem restringi-lo a um sexo.
theological_decisions:
- issue: Natureza do veredito sacerdotal
  choice: essa pessoa está pura
  alternative: essa pessoa está cerimonialmente pura
  rationale: O contexto estabelece que se trata de condição ritual/legal, e não de inocência moral nem de cura médica. Acrescentar 'cerimonialmente' tornaria explícito algo que o hebraico deixa implícito.
- issue: Natureza da condição denominada בֹּהַק
  choice: erupção cutânea, com nota lexical
  alternative: erupção inofensiva
  rationale: O texto declara que a pessoa está pura, mas não caracteriza diretamente a condição como clinicamente inofensiva. A tradução preserva essa distinção e evita uma afirmação médica além do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção legal foi tornada natural por meio de 'se houver'; a nota preserva a incerteza do termo dermatológico raro. O plural inclusivo do contexto e o veredito singular foram mantidos semanticamente por 'dessas pessoas' e 'essa pessoa'.
