  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: pt
  text: 'O sacerdote a examinará[a] e, eis que, o pelo na mancha brilhante ficou branco, e ela parece mais funda do que a pele; é tsaraat que irrompeu na cicatriz da queimadura. O sacerdote declarará a pessoa impura: é uma lesão de tsaraat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraat é um termo hebraico amplo para uma afecção grave que tornava a pessoa ritualmente impura; tradicionalmente traduzido por “lepra”, não designa necessariamente a hanseníase.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: examinará
  rationale: No contexto do diagnóstico sacerdotal, o verbo indica inspeção e avaliação, não apenas o ato de ver.
- source_word: בַּהֶרֶת
  choice: mancha brilhante
  rationale: Expressa uma lesão clara ou brilhante visível, sem impor terminologia médica moderna.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: o pelo ... tiver ficado branco
  rationale: Preserva a ideia de mudança de cor do pelo como sinal diagnóstico.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: ela parecer mais funda que a pele
  rationale: Reproduz de modo natural a fórmula diagnóstica que descreve a aparência de profundidade da lesão.
- source_word: צָרַעַת
  choice: tsaraat
  rationale: A transliteração evita identificar indevidamente a ampla categoria ritual hebraica com a hanseníase ou com uma doença moderna específica; a nota explica o termo.
- source_word: מִכְוָה
  choice: cicatriz da queimadura
  rationale: O contexto aponta para a área marcada por uma queimadura anterior.
- source_word: פָּרָחָה
  choice: irrompeu
  rationale: Comunica a erupção ou manifestação da afecção no local da queimadura.
- source_word: טִמֵּא אֹתוֹ
  choice: declarará a pessoa impura
  rationale: Indica o veredito ritual autorizado do sacerdote, sem sugerir que ele cause a impureza.
- source_word: נֶגַע צָרַעַת
  choice: lesão de tsaraat
  rationale: נגע designa aqui uma marca ou lesão aflitiva; 'lesão' é claro e evita a possível alegação médica de 'infecção'.
theological_decisions:
- issue: Sentido de צָרַעַת na lei levítica de pureza
  choice: tsaraat, explicado em nota como categoria ampla de afecção grave
  alternative: lepra; doença de pele
  rationale: A transliteração conserva a categoria ritual própria do texto e evita tanto a identificação anacrônica com a hanseníase quanto uma especificação médica que o hebraico não exige.
- issue: Função sacerdotal em טִמֵּא אֹתוֹ
  choice: declarará a pessoa impura
  alternative: tornará a pessoa impura
  rationale: O sacerdote profere um diagnóstico ritual autoritativo; a tradução não atribui a ele a causa da condição.
translation_notes:
  register: Português atual, digno e acessível, com construção condicional natural para a sequência וְהִנֵּה no contexto diagnóstico. Emprega 'pelo' no singular coletivo conforme o hebraico, 'pessoa' para tornar explícito o referente masculino gramatical sem restringir o sentido, e translitera tsaraat para preservar a categoria ritual antiga.
