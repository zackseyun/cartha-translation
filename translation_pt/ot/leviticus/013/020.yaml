  source_fidelity: A tradução transmite corretamente o exame sacerdotal, o rebaixamento visível da área afetada, o embranquecimento dos pelos, a declaração de impureza ritual e o surgimento da afecção em um שְׁחִין. Contudo, «mais funda que a pele» não exprime com precisão natural a comparação hebraica com o nível da pele, e «ferida inflamada» é menos específico que «furúnculo» para שְׁחִין neste contexto.
