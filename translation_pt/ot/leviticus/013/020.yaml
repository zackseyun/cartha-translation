  terminology: «Doença de pele» para צָרַעַת, com nota explicativa, evita identificar anacronicamente o termo com a hanseníase moderna. «Declarará essa pessoa impura» preserva corretamente a função declarativa ritual do sacerdote. «Furúnculo» representa adequadamente שְׁחִין.
