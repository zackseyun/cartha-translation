  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: pt
  text: O sacerdote a examinará, e eis que a área afetada parece estar abaixo do nível da pele, e os pelos nela se tornaram brancos; então o sacerdote declarará essa pessoa impura. É uma manifestação de doença de pele[a] que surgiu no furúnculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico צָרַעַת, tradicionalmente traduzido como “lepra”, designa em Levítico uma variedade de afecções graves e não se limita à hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: examinará
  rationale: No contexto dos procedimentos sacerdotais, ראה indica inspeção diagnóstica, não apenas o ato de ver.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva o marcador hebraico que chama atenção para os sinais observados, mantendo um registro digno e inteligível.
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: sua aparência é mais funda que a pele
  rationale: Expressa a aparência rebaixada da lesão em relação à pele ao redor sem transformar a observação em diagnóstico médico moderno.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: os pelos nela se tornaram brancos
  rationale: O singular hebraico pode ter sentido coletivo; em português, 'os pelos nela' deixa claro que se trata dos pelos na área afetada.
- source_word: וְטִמְּאוֹ
  choice: declarará essa pessoa impura
  rationale: O sacerdote profere uma determinação ritual autorizada; ele não causa a impureza. 'Essa pessoa' evita ambiguidade pronominal e é natural em português.
- source_word: נֶגַע צָרַעַת
  choice: uma manifestação de doença de pele
  rationale: נגע designa aqui uma manifestação ou afecção observável, enquanto צרעת abrange condições que não correspondem necessariamente à hanseníase moderna.
- source_word: בַּשְּׁחִין
  choice: na ferida inflamada
  rationale: שְׁחִין pode designar furúnculo, úlcera ou inflamação cutânea; 'ferida inflamada' comunica o sentido sem impor precisão clínica indevida.
- source_word: פָּרָחָה
  choice: irrompeu
  rationale: O verbo descreve o surgimento ou a erupção da afecção na ferida, sem exigir a ideia de propagação ampla.
theological_decisions:
- issue: Tradução de צָרַעַת na legislação de pureza levítica
  choice: doença de pele
  alternative: lepra
  rationale: O termo hebraico tem alcance mais amplo que a hanseníase moderna. A tradução evita uma identificação médica anacrônica e preserva o contexto ritual e diagnóstico.
- issue: Função sacerdotal em וְטִמְּאוֹ
  choice: declarará essa pessoa impura
  alternative: tornará essa pessoa impura
  rationale: A formulação apresenta o sacerdote como quem reconhece e declara o estado ritual, sem afirmar que seu pronunciamento produz a condição.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Conserva-se 'e eis que' para refletir a força observacional do hebraico, enquanto a sintaxe restante permanece natural.
