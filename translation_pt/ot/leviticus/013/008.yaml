review_pass:
  verdict: revise
  source_fidelity: 'A tradução capta adequadamente a inspeção sacerdotal, a propagação da afecção e a declaração de impureza. Contudo, a transliteração isolada “tsara‘at” no corpo do texto é menos clara para leitores de português e não é necessária aqui: “doença de pele”, com nota qualificadora, comunica o referente sem identificar indevidamente o termo com a hanseníase moderna. A construção condicional com “se” é uma representação natural da constatação introduzida por וְהִנֵּה neste procedimento.'
  naturalness: O texto é claro, mas “É tsara‘at” introduz um termo técnico não integrado ao português e cria uma mudança de registro desnecessária. “É uma doença de pele” é mais fluente e acessível. O ponto e vírgula mantém a relação explicativa estreita com a declaração anterior.
  terminology: “Sacerdote”, “erupção escamosa” e “declarará impuro” são adequados ao contexto ritual e jurídico. “Doença de pele” evita a falsa precisão médica de “lepra”; a nota deve esclarecer que o hebraico tradicionalmente vertido por “lepra” tem extensão mais ampla, sem caracterizar todas as condições como graves.
  issues:
  - severity: medium
    issue: Transliteração “tsara‘at” no texto principal
    rationale: Embora defensável em contexto técnico, ela é opaca em português corrente e não oferece, por si, um sentido ao leitor. Uma equivalência geral acompanhada de nota preserva a cautela semântica e favorece a legibilidade.
  - severity: low
    issue: A nota descreve as afecções como “graves”
    rationale: O versículo e o termo hebraico não exigem qualificar todas as condições abrangidas como graves. A nota deve limitar-se à não equivalência com a hanseníase moderna.
  revised_text: O sacerdote o examinará e, se a erupção escamosa tiver se espalhado pela pele, o declarará impuro; é uma doença de pele.[a]
  revised_footnotes:
  - marker: a
    text: O termo hebraico tsara‘at, tradicionalmente traduzido como “lepra”, provavelmente abrange em Levítico uma variedade mais ampla de afecções da pele do que apenas a hanseníase moderna.
    reason: lexical_alternative
  revision_rationale: A revisão substitui a transliteração não explicativa no texto por uma equivalência portuguesa ampla e mantém uma nota que impede a identificação anacrônica com a hanseníase moderna. Também remove da nota a qualificação não exigida de que tais afecções seriam necessariamente graves.
