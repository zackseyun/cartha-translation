revisions:
- from: O sacerdote o examinará e, se a erupção escamosa tiver se espalhado pela pele, o sacerdote o declarará impuro. É tsara‘at.[a]
  to: O sacerdote o examinará e, se a erupção escamosa tiver se espalhado pela pele, o declarará impuro; é uma doença de pele.[a]
  rationale: A revisão substitui a transliteração não explicativa no texto por uma equivalência portuguesa ampla e mantém uma nota que impede a identificação anacrônica com a hanseníase moderna. Também remove da nota a qualificação não exigida de que tais afecções seriam necessariamente graves.
