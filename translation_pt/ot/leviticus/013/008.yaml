source:
  edition: WLC
  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: pt
  text: O sacerdote o examinará e, se a erupção escamosa tiver se espalhado pela pele, o declarará impuro; é uma doença de pele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico tsara‘at, tradicionalmente traduzido como “lepra”, provavelmente abrange em Levítico uma variedade mais ampla de afecções da pele do que apenas a hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: examinará
  rationale: No contexto diagnóstico sacerdotal, o verbo indica inspeção e avaliação, não apenas o ato de ver.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: É a designação comum do agente autorizado a examinar e declarar o estado ritual.
- source_word: וְהִנֵּה
  choice: se
  rationale: Nesta fórmula processual, introduz o que se constata no exame; “se” expressa com naturalidade a força condicional do contexto.
- source_word: פָּשְׂתָה
  choice: tiver se espalhado
  rationale: O verbo descreve a propagação da afecção, critério diagnóstico central no capítulo.
- source_word: הַמִּסְפַּחַת
  choice: a erupção escamosa
  rationale: Representa uma afecção superficial da pele e evita a especificidade excessiva de “crosta” ou a generalidade de “mancha”.
- source_word: בָּעוֹר
  choice: pela pele
  rationale: Expressão portuguesa natural para indicar a superfície sobre a qual a afecção se espalha.
- source_word: וְטִמְּאוֹ
  choice: o declarará impuro
  rationale: O sacerdote reconhece e declara autoritativamente o estado ritual; não é apresentado como quem causa a impureza.
- source_word: צָרַעַת
  choice: tsara‘at
  rationale: A transliteração preserva a categoria hebraica, que não corresponde com precisão à hanseníase moderna nem a uma única doença cutânea; a nota esclarece seu alcance.
- source_word: הִוא
  choice: É
  rationale: Forma uma oração identificadora concisa, cujo sujeito é a afecção constatada.
theological_decisions:
- issue: Tradução de צָרַעַת na legislação de pureza levítica
  choice: tsara‘at
  alternative: lepra; doença de pele; doença cutânea que causa impureza
  rationale: “Lepra” pode sugerir incorretamente apenas a hanseníase moderna, enquanto “doença de pele” pode reduzir a categoria bíblica a um diagnóstico médico moderno. A transliteração mantém a amplitude e a alteridade da classificação ritual hebraica, com explicação em nota.
- issue: Função sacerdotal na declaração de impureza
  choice: declarará impuro
  alternative: tornará impuro
  rationale: A formulação preserva a função diagnóstica e jurídica do sacerdote sem afirmar que ele causa a condição ritual.
translation_notes:
  register: Português moderno, claro e digno, com construção jurídica natural. A transliteração técnica ocorre somente onde evita uma equivalência médica enganosa e é explicada em nota.
