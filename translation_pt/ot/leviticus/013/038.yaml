  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: pt
  text: Se um homem ou uma mulher tiver, na pele do corpo, manchas claras, manchas brancas[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “manchas brilhantes, manchas brancas brilhantes”.'
    reason: O termo hebraico pode descrever manchas de cor clara ou de aparência brilhante; a alternativa preserva explicitamente o possível aspecto lustroso e a repetição.
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: um homem ou uma mulher
  rationale: A formulação mantém a referência explícita a ambos os sexos e o singular indefinido próprio deste caso legal.
- source_word: כִּי יִהְיֶה
  choice: se ... tiver
  rationale: Neste contexto de diagnóstico legal, כִּי introduz uma circunstância eventual; “tiver” expressa naturalmente em português a construção hebraica de existência localizada no corpo.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: na pele do corpo
  rationale: “Pele do corpo” comunica em linguagem corrente a referência concreta à pele da pessoa, sem o sentido potencialmente enganoso de “carne” no português moderno.
- source_word: בֶּהָרֹת
  choice: manchas claras
  rationale: O substantivo designa marcas visíveis de aspecto claro ou brilhante na pele; “manchas claras” é compreensível e apropriado ao contexto diagnóstico.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: manchas brancas
  rationale: A repetição de “manchas” preserva a repetição enfática do hebraico, enquanto “brancas” traduz לְבָנֹת de modo direto.
