base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: pt
  text: Se o sacerdote o examinar e constatar que a afecção escamosa se espalhou pela pele, não precisa procurar pelos amarelos; a pessoa está impura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאָהוּ הַכֹּהֵן
  choice: Se o sacerdote o examinar
  rationale: No contexto das inspeções sacerdotais, ראה tem sentido avaliativo. A forma condicional explicita naturalmente a função do enunciado dentro do procedimento legal.
- source_word: וְהִנֵּה
  choice: e constatar que
  rationale: Transmite a descoberta resultante da inspeção sem recorrer ao pouco natural «e eis que» neste contexto técnico.
- source_word: פָּשָׂה
  choice: se espalhou
  rationale: Expressa diretamente a expansão da afecção, sinal diagnóstico recorrente no capítulo.
- source_word: הַנֶּתֶק
  choice: a afecção escamosa
  rationale: O termo designa uma condição específica do couro cabeludo ou da barba. «Afecção escamosa» é claro, evita diagnóstico médico moderno indevido e preserva a especificidade contextual.
- source_word: בָּעוֹר
  choice: pela pele
  rationale: Em português, «espalhou-se pela pele» comunica de modo natural a extensão da lesão na superfície cutânea.
- source_word: לֹא יְבַקֵּר הַכֹּהֵן
  choice: não precisará procurar
  rationale: A negação indica que, constatada a propagação, já não é necessário verificar o outro sinal diagnóstico.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: pelo amarelo nos pelos
  rationale: Preserva a referência à coloração amarela do pelo como sinal diagnóstico; «pelos» se ajusta ao couro cabeludo ou à barba, embora a repetição exija formulação idiomática.
- source_word: טָמֵא הוּא
  choice: a pessoa está impura
  rationale: O pronome se refere à pessoa examinada. «Impura» indica seu estado ritual, não culpa moral nem apenas a condição da lesão.
theological_decisions:
- issue: Natureza de טָמֵא na legislação levítica
  choice: impura
  alternative: contaminada; imunda
  rationale: O termo indica estado de impureza ritual. «Impura» é claro em português e evita sugerir necessariamente sujeira física, infecção médica ou culpa moral.
translation_notes:
  register: Português moderno, claro e digno, com terminologia não diagnóstica. A construção procedural foi tornada natural em português. Nenhuma nota é necessária neste versículo; a especificidade de נתק é comunicada no próprio texto por «afecção escamosa».
