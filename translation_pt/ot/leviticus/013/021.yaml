review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a condição contrastiva, a inspeção sacerdotal, a ausência de pelo branco, a lesão não rebaixada em relação à pele, sua aparência enfraquecida e o período de sete dias. «Desbotada» é uma opção aceitável para כֵהָה neste contexto visual, sem impor uma identificação médica específica.
  naturalness: O texto é claro e de registro apropriado. «Não há nenhum pelo branco» soa mais idiomático e inequívoco do que «não há pelo branco». Para וְהִסְגִּירוֹ, «isolará essa pessoa» expressa mais diretamente o ato prescrito do que «manterá essa pessoa isolada», que pode sugerir uma condição já em curso.
  terminology: «Sacerdote», «examinar», «pelo branco», «mais funda que a pele» e «isolará» são escolhas adequadas, compreensíveis e não anacrônicas. A nota explica corretamente a finalidade observacional do isolamento sem chamar o procedimento de quarentena no texto principal.
  issues:
  - severity: low
    issue: «Manterá essa pessoa isolada» é levemente menos direto que o verbo hebraico.
    rationale: וְהִסְגִּירוֹ prescreve que o sacerdote ponha/isole a pessoa sob restrição. «Manterá» pode dar a entender a continuação de um isolamento anterior; «isolará» conserva melhor o ato ordenado.
  - severity: low
    issue: «Nela não há pelo branco» é um pouco marcado em português moderno.
    rationale: A inserção de «nenhum» torna a negação e o uso genérico do singular mais naturais, sem alterar o critério diagnóstico do hebraico.
