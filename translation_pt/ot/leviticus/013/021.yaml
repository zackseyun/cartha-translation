base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: pt
  text: Mas, se o sacerdote a examinar e constatar que nela não há nenhum pelo branco, que ela não é mais funda que a pele e que está desbotada, o sacerdote isolará essa pessoa durante sete dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “manterá essa pessoa em isolamento durante sete dias”. O verbo hebraico indica que a pessoa era mantida separada para observação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma hipótese em contraste com o diagnóstico do versículo anterior, de modo natural em português.
- source_word: יִרְאֶנָּה
  choice: a examinar
  rationale: Embora o verbo signifique literalmente “ver”, no contexto da inspeção sacerdotal tem sentido diagnóstico; o pronome feminino retoma a área afetada.
- source_word: וְהִנֵּה
  choice: e constatar que
  rationale: Transmite em português natural a fórmula hebraica que chama atenção para aquilo que se verifica durante a inspeção.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: nela não há pelo branco
  rationale: Preserva diretamente o critério diagnóstico e a referência feminina à área afetada.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: ela não é mais funda que a pele
  rationale: Expressa o aspecto rebaixado ou afundado indicado pelo hebraico, com linguagem clara e corrente.
- source_word: וְהִיא כֵהָה
  choice: está desbotada
  rationale: כֵהָה indica aparência enfraquecida, menos viva ou menos nítida; “desbotada” comunica esse critério visual sem especificá-lo além do texto.
- source_word: וְהִסְגִּירוֹ
  choice: manterá essa pessoa isolada
  rationale: O verbo indica confinamento para observação; o sufixo masculino se refere à pessoa examinada, não à lesão.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Forma natural e precisa de expressar o período prescrito.
