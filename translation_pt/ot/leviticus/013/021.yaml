- from: Mas, se o sacerdote a examinar e constatar que nela não há pelo branco, que ela não é mais funda que a pele e que está desbotada, o sacerdote manterá essa pessoa isolada durante sete dias.[a]
  to: Mas, se o sacerdote a examinar e constatar que nela não há nenhum pelo branco, que ela não é mais funda que a pele e que está desbotada, o sacerdote isolará essa pessoa durante sete dias.[a]
  rationale: 'A revisão é limitada a duas melhorias de precisão e fluidez: torna explícita a negação de pelo branco e substitui «manterá ... isolada» por «isolará», que corresponde mais diretamente ao ato de confinamento expresso pelo verbo hebraico. A formulação «está desbotada» é preservada como representação natural da aparência diminuída indicada por כֵהָה.'
