source:
  edition: WLC
  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: pt
  text: Mas, se houver uma mancha branca e brilhante na pele do seu corpo[a], e ela não parecer mais profunda que a pele, e os pelos nela não tiverem ficado brancos, o sacerdote manterá a área afetada isolada[b] por sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma mancha branca e reluzente na pele da sua carne”.
    reason: lexical_alternative
  - marker: b
    text: Ou “colocará a área afetada em quarentena”; o hebraico indica isolamento temporário para observação.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: mancha branca e brilhante
  rationale: O substantivo designa uma marca cutânea caracterizada por brilho ou clareza; a combinação é natural em português e, com לְבָנָה, comunica tanto o tipo de lesão quanto sua cor.
- source_word: לְבָנָה
  choice: branca
  rationale: O adjetivo indica diretamente a cor da mancha.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: na pele do seu corpo
  rationale: Expressa com clareza o sentido anatômico de בשר sem o possível estranhamento ou ambiguidade de 'carne' em português moderno.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: ela não parecer mais profunda que a pele
  rationale: Preserva o caráter visual do diagnóstico e a comparação de profundidade com a pele circundante.
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: os pelos nela não tiverem ficado brancos
  rationale: O singular coletivo hebraico pode ser expresso naturalmente pelo plural 'pelos'; 'nela' deixa clara a ligação com a mancha, e 'ficado brancos' indica mudança de estado.
- source_word: וְהִסְגִּיר
  choice: manterá ... isolada
  rationale: O verbo descreve confinamento temporário para observação. Esta formulação liga naturalmente o procedimento à área afetada, o objeto gramatical expresso no hebraico.
- source_word: אֶת־הַנֶּגַע
  choice: a área afetada
  rationale: נגע aqui se refere à manifestação cutânea examinada; 'área afetada' evita antecipar um diagnóstico de doença e preserva o objeto concreto da inspeção.
- source_word: שִׁבְעַת יָמִים
  choice: por sete dias
  rationale: Forma portuguesa corrente para indicar a duração do isolamento.
theological_decisions: []
