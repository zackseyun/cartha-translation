base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: pt
  text: Mas, se houver uma lesão branco-avermelhada na parte calva de trás da cabeça ou na parte calva da frente da cabeça, é uma doença de pele[a] que se espalha na parte calva de trás ou na parte calva da frente da cabeça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “lepra”. O termo hebraico abrange diversas doenças ou afecções da pele e não deve ser identificado estritamente com a hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Mas, se
  rationale: Introduz um caso condicional em contraste com a situação do versículo anterior.
- source_word: קָרַחַת / גַּבַּחַת
  choice: parte calva de trás da cabeça / parte calva da frente
  rationale: Preserva no texto a distinção hebraica entre as duas regiões de calvície, em português claro.
- source_word: נֶגַע
  choice: lesão
  rationale: Designa uma alteração visível submetida a exame, sem impor um diagnóstico médico moderno.
- source_word: לָבָן אֲדַמְדָּם
  choice: branco-avermelhada
  rationale: Mantém a ordem dos qualificativos hebraicos e expressa uma coloração branca com tonalidade avermelhada.
- source_word: צָרַעַת
  choice: doença de pele
  rationale: Evita identificar indevidamente o termo amplo do hebraico com a hanseníase moderna.
- source_word: פֹּרַחַת
  choice: que está irrompendo
  rationale: Reproduz a imagem verbal de uma condição que brota ou entra em erupção, sem decidir além do texto se o foco é sua expansão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível. A distinção anatômica entre os dois termos de calvície foi explicitada no corpo do texto; por isso, não exige nota separada.
