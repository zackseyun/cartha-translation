revisions:
- from: Mas, se na parte calva de trás da cabeça ou na parte calva da frente houver uma lesão branco-avermelhada, é uma doença de pele[a] que está irrompendo na parte calva de trás ou na parte calva da frente da cabeça.
  to: Mas, se houver uma lesão branco-avermelhada na parte calva de trás da cabeça ou na parte calva da frente da cabeça, é uma doença de pele[a] que se espalha na parte calva de trás ou na parte calva da frente da cabeça.
  rationale: A revisão limita-se a substituir a construção pouco idiomática «que está irrompendo» por «que se espalha», mantendo a ambiguidade médica e o caráter descritivo do hebraico. Também ajusta a ordem inicial para uma construção existencial mais fluente em português, sem alterar o sentido.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:32Z'
review_pass:
  verdict: revise
  source_fidelity: O texto preserva adequadamente a construção condicional, a distinção entre as áreas calvas posterior e anterior, a lesão de coloração branco-avermelhada e o sentido amplo de צָרַעַת como afecção cutânea, sem a identificar com a hanseníase. Contudo, «uma doença de pele que está irrompendo» atribui de modo pouco preciso e pouco idiomático o particípio פֹּרַחַת à doença; no contexto, ele qualifica a condição como manifestando-se/espalhando-se.
  naturalness: A formulação é clara em geral, mas «doença de pele que está irrompendo» soa artificial em português moderno. «Doença de pele que se espalha» é natural e comunica adequadamente o valor contextual do hebraico.
  terminology: «Lesão» é uma boa solução neutra para נֶגַע; «branco-avermelhada» conserva a sequência hebraica; e «doença de pele», com a nota, evita a equivalência indevida entre צָרַעַת e a hanseníase. A explicitação de trás/frente no texto torna desnecessária uma nota adicional sobre os dois termos.
  issues:
  - severity: low
    issue: «que está irrompendo»
    rationale: Embora «irromper» possa refletir a imagem verbal de פֹּרַחַת, a expressão faz a doença, e não a manifestação/lesão, «irromper», o que é pouco natural em português. «Que se espalha» reproduz de modo claro o uso contextual em Levítico 13.
