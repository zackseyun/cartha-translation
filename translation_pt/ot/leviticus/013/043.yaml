  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: pt
  text: e o sacerdote o examinará, e eis que a inchação da lesão é esbranquiçada e avermelhada em sua calvície posterior ou frontal[b], como o aspecto de uma doença de pele[a] na pele do corpo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico צָרַעַת, tradicionalmente traduzido por “lepra”, refere-se em Levítico a uma categoria mais ampla de afecções graves da pele, e não especificamente à hanseníase.
    reason: lexical_alternative
  - marker: b
    text: Os dois termos hebraicos para calvície provavelmente distinguem a parte de trás da cabeça da parte da frente.
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה אֹתוֹ הַכֹּהֵן
  choice: e o sacerdote o examinará
  rationale: No contexto dos procedimentos sacerdotais de Levítico 13, ראה indica inspeção ou exame, não apenas visão; o futuro mantém o caráter prescritivo da legislação.
- source_word: וְהִנֵּה
  choice: Se houver
  rationale: No procedimento diagnóstico, a partícula introduz aquilo que o sacerdote constata. A formulação condicional comunica naturalmente essa função em português, sem acrescentar certeza ao diagnóstico.
- source_word: שְׂאֵת הַנֶּגַע
  choice: uma inchação ... na lesão
  rationale: שׂאת designa uma elevação ou inchação, enquanto נגע é a lesão ou afecção examinada. A formulação mantém distintos os dois elementos.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: esbranquiçada e avermelhada
  rationale: Reproduz os dois componentes cromáticos e a nuance da forma hebraica אֲדַמְדֶּמֶת, evitando o composto pouco natural 'branco-avermelhada'.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: na parte calva de trás da cabeça ou na parte calva da frente
  rationale: Os termos provavelmente distinguem a calvície posterior da frontal; a tradução explicita o contraste em linguagem corrente.
- source_word: כְּמַרְאֵה
  choice: semelhante à aparência de
  rationale: Mantém a linguagem comparativa própria da observação diagnóstica.
- source_word: צָרַעַת
  choice: doença de pele
  rationale: O termo hebraico abrange uma categoria de afecções cutâneas e não corresponde especificamente à hanseníase.
- source_word: עוֹר בָּשָׂר
  choice: na pele do corpo
  rationale: Traduz os dois componentes da expressão hebraica de modo natural e preserva a referência à pele corporal em contraste com o couro cabeludo.
theological_decisions:
- issue: Identificação de צָרַעַת
  choice: doença de pele
  alternative: lepra
  rationale: A tradução evita identificar indevidamente a categoria ritual e diagnóstica de Levítico com uma doença moderna específica, preservando a amplitude do termo hebraico.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. A redação conserva o caráter procedural da passagem e termina com vírgula porque a sentença prossegue no versículo seguinte.
