  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: pt
  text: Mas, se o sacerdote a examinar e constatar que não há pelo branco na mancha clara, que ela não é mais funda do que a pele[a] e está esmaecida, o sacerdote isolará a pessoa[b] por sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não está mais baixa do que a pele”, isto é, não parece afundada em relação à pele ao redor.
    reason: lexical_alternative
  - marker: b
    text: Ou “manterá a pessoa confinada” ou “a colocará em quarentena”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: a examinar
  rationale: Embora o verbo signifique literalmente “ver”, neste contexto sacerdotal descreve uma inspeção formal; “examinar” expressa essa função com naturalidade.
- source_word: בַּבֶּהֶרֶת
  choice: na mancha clara
  rationale: בַּהֶרֶת designa uma marca cutânea clara ou esbranquiçada. “Mancha clara” preserva o aspecto visual sem impor um diagnóstico médico moderno.
- source_word: שֵׂעָר לָבָן
  choice: pelo branco
  rationale: A expressão singular pode ter sentido coletivo. “Pelo branco” é conciso e natural como sinal observado na lesão.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: ela não é mais funda do que a pele
  rationale: A formulação comunica que a mancha não parece rebaixada em relação à pele ao redor, preservando o critério visual do hebraico.
- source_word: כֵהָה
  choice: está esmaecida
  rationale: O termo indica aparência enfraquecida, sem intensidade. “Esmaecida” é apropriado para a coloração de uma mancha cutânea.
- source_word: וְהִסְגִּירוֹ
  choice: o sacerdote isolará a pessoa
  rationale: O verbo significa fechar ou manter separado para observação. “Isolará” é claro e evita associar automaticamente o procedimento às categorias médicas modernas; “a pessoa” explicita o referente masculino do sufixo sem ambiguidade em português.
- source_word: שִׁבְעַת יָמִים
  choice: por sete dias
  rationale: Tradução direta e idiomática da duração.
- source_word: וְהִנֵּה
  choice: e constatar que
  rationale: No fluxo da inspeção, o marcador introduz o resultado observado. “Constatar que” transmite sua força evidencial em português atual sem recorrer ao mais solene “e eis que”.
