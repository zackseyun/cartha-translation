lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: um homem ou uma mulher
  rationale: O hebraico menciona explicitamente ambos os sexos; a tradução preserva essa formulação sem reduzi-la a um termo genérico.
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto jurídico e casuístico, introduz uma situação condicional; “quando” é natural em português e mantém esse valor.
- source_word: יִהְיֶה בּוֹ
  choice: tiver
  rationale: Expressa de modo idiomático em português a construção hebraica que indica a presença da lesão na pessoa.
- source_word: נָגַע
  choice: lesão
  rationale: O termo hebraico é amplo e designa uma manifestação visível examinada pelo sacerdote, sem corresponder necessariamente a uma infecção diagnosticada pela medicina moderna.
- source_word: בְּ/רֹאשׁ
  choice: na cabeça
  rationale: Mantém o sentido lexical amplo de רֹאשׁ; “couro cabeludo” é possível no contexto, mas é mais específico que o hebraico.
- source_word: בְ/זָקָן
  choice: na barba
  rationale: זָקָן significa “barba”; a preposição é vertida naturalmente como “na” para indicar a região afetada.
