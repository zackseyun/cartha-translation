base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: pt
  text: O sacerdote o examinará no sétimo dia. Se a mancha de fato tiver se espalhado pela pele, o sacerdote o declarará impuro; é um caso de doença de pele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “lepra”. O termo hebraico tem sentido mais amplo nas leis de pureza de Israel e não designa necessariamente a hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: o examinará
  rationale: Embora ראה signifique literalmente “ver”, neste procedimento sacerdotal indica inspeção diagnóstica; “examinar” expressa isso com naturalidade.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão de כֹּהֵן no contexto ritual de Levítico.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: no sétimo dia
  rationale: Tradução direta e idiomática da expressão temporal.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: se ... de fato tiver se espalhado
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ação; “de fato” preserva essa ênfase.
- source_word: בָּעוֹר
  choice: pela pele
  rationale: עוֹר significa “pele”; com o verbo “espalhar-se”, “pela pele” é natural em português e descreve a extensão da mancha.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: o declarará impuro
  rationale: O sacerdote profere um veredito ritual, não causa a impureza; “declarará” preserva essa função oficial.
- source_word: נֶגַע
  choice: afecção
  rationale: נֶגַע designa aqui uma manifestação ou lesão patológica visível. “Afecção” evita afirmar uma etiologia infecciosa que o hebraico não especifica.
- source_word: צָרַעַת
  choice: doença de pele
  rationale: O termo hebraico abrange condições previstas nas leis de pureza e não corresponde necessariamente à hanseníase moderna; a opção evita precisão médica anacrônica.
- source_word: הִוא
  choice: é
  rationale: O pronome identifica a condição descrita; a cópula simples é a formulação mais natural em português.
theological_decisions:
- issue: Tradução de צָרַעַת nas leis de pureza ritual
  choice: doença de pele
  alternative: lepra; doença de pele que causa impureza
  rationale: “Lepra” poderia sugerir indevidamente a hanseníase moderna. “Doença de pele” mantém a amplitude do termo, enquanto a nota registra a tradução tradicional.
- issue: Natureza do ato sacerdotal em וְטִמֵּא אֹתוֹ
  choice: declarará impuro
  alternative: tornará impuro
  rationale: O contexto apresenta o sacerdote emitindo uma determinação ritual com base no exame, sem afirmar que ele produz a condição de impureza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mancha” foi explicitada como referente contextual daquilo que se espalha; “afecção” conserva o caráter técnico sem pressupor contágio.
