  source_fidelity: 'O texto traduz adequadamente a sequência hebraica: o novo exame no sétimo dia, a atenuação da lesão, a ausência de propagação pela pele, a declaração sacerdotal de pureza, a identificação como מִסְפַּחַת e a lavagem das roupas seguida do estado de pureza. “Lesão” evita impor uma etiologia infecciosa moderna a נֶגַע, e “declarará puro” preserva o caráter ritual-jurídico de וְטִהֲרוֹ.'
