  terminology: A terminologia distingue corretamente a condição observada (“lesão”) do veredito de pureza ritual (“declarará puro”; “ficará puro”), sem alegar cura clínica. A nota em “erupção cutânea” oferece “crosta” como alternativa lexical possível e explica com prudência o contraste contextual com a condição mais grave que se dissemina.
