base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: pt
  text: No sétimo dia, o sacerdote o examinará novamente. Se a lesão estiver menos intensa e não tiver se espalhado pela pele, o sacerdote o declarará puro; é uma erupção cutânea.[a] Ele lavará as suas roupas e ficará puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “crosta”. O termo hebraico designa uma erupção ou afecção superficial da pele, em contraste com a condição mais grave que continuava se espalhando.'
    reason: alternativa lexical e esclarecimento do alcance do termo hebraico
lexical_decisions:
- source_word: וְרָאָה
  choice: examinará
  rationale: No contexto do diagnóstico sacerdotal, o verbo indica uma inspeção oficial, não apenas o ato de ver.
- source_word: שֵׁנִית
  choice: novamente
  rationale: Expressa de modo natural a repetição do exame no sétimo dia.
- source_word: כֵּהָה
  choice: estiver menos intensa
  rationale: O termo descreve a diminuição da intensidade ou visibilidade da lesão; esta formulação evita sugerir necessariamente o desaparecimento da cor.
- source_word: הַנֶּגַע
  choice: a lesão
  rationale: Designa a alteração visível da pele sob exame. “Lesão” é claro e não pressupõe uma causa infecciosa segundo a medicina moderna.
- source_word: פָשָׂה
  choice: não tiver se espalhado
  rationale: Transmite o sentido contextual de expansão da alteração pela pele.
- source_word: בָּעוֹר
  choice: pela pele
  rationale: Em português, esta é a construção mais natural com “espalhar-se”, preservando a referência inequívoca à pele.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: o sacerdote o declarará puro
  rationale: Representa o veredito sacerdotal de pureza ritual, sem sugerir que o sacerdote efetue uma cura física.
- source_word: מִסְפַּחַת
  choice: uma erupção cutânea
  rationale: O substantivo indica uma afecção superficial ou erupção de menor gravidade; a escolha é compreensível e evita precisão médica indevida.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Ele lavará as suas roupas
  rationale: Formulação corrente e fiel para a ação prescrita sobre as vestes.
- source_word: וְטָהֵר
  choice: e ficará puro
  rationale: Expressa o estado ritual resultante após a lavagem, sem confundi-lo com cura clínica.
theological_decisions:
- issue: Veredito de pureza ritual versus cura física
  choice: “o sacerdote o declarará puro” e “ficará puro”
  alternative: “o sacerdote o purificará” ou “ficará curado”
  rationale: O texto trata da avaliação sacerdotal e do estado ritual. A tradução não atribui ao sacerdote uma cura física nem identifica pureza ritual com recuperação médica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “lesão” a “infecção” para não impor um diagnóstico biomédico ausente do hebraico. O marcador da nota foi colocado após o termo ao qual a alternativa lexical efetivamente se refere.
