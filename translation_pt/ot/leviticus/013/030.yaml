base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: pt
  text: O sacerdote examinará a área afetada e constatará que ela parece mais profunda do que a pele e que nela há pelo amarelo e fino; então declarará essa pessoa impura. É uma afecção[a], uma doença de pele[b] da cabeça ou da barba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “tinha”. O termo hebraico נֶתֶק designa uma afecção da cabeça ou da barba, mas sua identificação médica exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: O hebraico צָרַעַת é um termo amplo para uma doença grave da pele e não se refere necessariamente à hanseníase (doença de Hansen).
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: área afetada
  rationale: No contexto diagnóstico de Levítico 13, designa a área visível examinada pelo sacerdote. A expressão é natural e evita atribuir uma etiologia médica específica.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: seu aspecto é mais profundo que a pele
  rationale: Preserva a formulação diagnóstica e a linguagem visual do hebraico sem explicar em excesso se a área está deprimida ou se parece penetrar abaixo da pele.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: pelo amarelo e fino
  rationale: 'Mantém no singular coletivo os dois qualificativos do hebraico: a cor amarela e a espessura fina.'
- source_word: וְטִמֵּא אֹתוֹ
  choice: declarará impura essa pessoa
  rationale: O sacerdote profere uma determinação ritual; não causa a impureza. A explicitação de 'essa pessoa' evita a ambiguidade de gênero de um pronome isolado em português.
- source_word: נֶתֶק
  choice: afecção
  rationale: O termo nomeia uma condição específica da cabeça ou da barba, mas sua identificação médica exata é incerta. 'Afecção' conserva essa indeterminação; a nota registra a tradução tradicional.
- source_word: צָרַעַת
  choice: doença de pele
  rationale: O termo hebraico abrange uma categoria de afecções mais ampla que a hanseníase moderna e não deve ser identificado automaticamente com ela.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: da cabeça ou da barba
  rationale: Segue de perto a construção hebraica e evita substituir interpretativamente 'cabeça' por 'couro cabeludo'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção com “verá que” expressa naturalmente וְהִנֵּה no contexto de exame, sem o arcaísmo de “e eis que”. A repetição classificatória final reflete a estrutura hebraica, distinguindo נֶתֶק de צָרַעַת.
