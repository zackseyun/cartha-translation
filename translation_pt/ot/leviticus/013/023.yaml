  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: pt
  text: Mas, se a mancha clara permanecer no mesmo lugar e não se espalhar[a], é a cicatriz da inflamação; o sacerdote declarará a pessoa pura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «ficar debaixo dela»; neste contexto, a expressão indica que a mancha permanece onde está, em vez de se espalhar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o caso anterior, preservando com naturalidade o valor adversativo da sequência.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: permanecer no mesmo lugar
  rationale: Embora תַּחְתֶּיהָ signifique literalmente «debaixo dela», neste contexto a expressão indica que a mancha se mantém localizada, sem avançar pela pele.
- source_word: הַבַּהֶרֶת
  choice: a mancha clara
  rationale: Designa uma marca visivelmente clara ou brilhante na pele; a tradução descreve o sinal observado sem impor um diagnóstico moderno.
- source_word: לֹא פָשָׂתָה
  choice: não se espalhar
  rationale: O verbo descreve repetidamente neste capítulo a expansão de uma afecção pela pele.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: a cicatriz da ferida
  rationale: צָרֶבֶת é a marca residual de inflamação, e שְׁחִין designa aqui a ferida inflamada examinada nos versículos anteriores. «Cicatriz da ferida» é claro e coerente no contexto.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: o sacerdote declarará a pessoa pura
  rationale: No contexto sacerdotal, o verbo atribui oficialmente o estado de pureza ritual; não descreve cura física nem uma ação que produza limpeza.
theological_decisions:
- issue: Pureza ritual versus cura médica
  choice: declarará a pessoa pura
  alternative: a purificará; a curará
  rationale: O sacerdote examina e declara o estado ritual da pessoa. A formulação evita sugerir que ele efetue uma cura ou purificação física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «A pessoa» evita o masculino genérico do pronome hebraico sem alterar o referente. A terminologia mantém a distinção entre observação física e declaração sacerdotal de pureza ritual.
