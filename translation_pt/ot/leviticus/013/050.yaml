base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/050.yaml
  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: pt
  text: O sacerdote examinará a área afetada[a] e a manterá isolada[b] durante sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a lesão”, “a mancha” ou, mais tradicionalmente, “a praga”. O termo hebraico se refere à marca ou área afetada submetida ao exame do sacerdote, não necessariamente a uma categoria específica de doença moderna.
    reason: lexical_alternative
  - marker: b
    text: Ou “a encerrará”; mais literalmente, “a fechará”. O sentido é mantê-la temporariamente isolada para observação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: examinará
  rationale: Embora ראה signifique literalmente “ver”, neste procedimento sacerdotal indica uma inspeção oficial; “examinará” expressa esse sentido com clareza.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução corrente de כֹּהֵן, preservando o artigo definido.
- source_word: הַנָּגַע / הַנֶּגַע
  choice: a área afetada
  rationale: נגע designa aqui a marca ou área atingida que está sob exame, sem identificá-la necessariamente com uma categoria médica moderna. A repetição lexical do hebraico é retomada naturalmente pelo pronome “a” na segunda oração.
- source_word: וְהִסְגִּיר
  choice: a manterá isolada
  rationale: O hifil de סגר significa fechar, confinar ou isolar. No contexto, trata-se de isolamento temporário para observação; a construção com “manter” deixa claro que o estado dura sete dias e evita sugerir uma quarentena moderna específica.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Expressão temporal natural em português para a duração indicada no hebraico.
