  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: pt
  text: Queimará a roupa, a urdidura ou a trama[a], de lã ou de linho, ou qualquer objeto de couro em que estiver a marca, pois é uma afecção destrutiva[b]; isso será queimado no fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Urdidura” são os fios longitudinais do tecido; “trama” são os fios transversais.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico tradicionalmente traduzido por “lepra” designa uma categoria mais ampla de impureza ritual e também é aplicado, neste capítulo, a roupas e casas; não corresponde simplesmente à hanseníase moderna.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Queimará
  rationale: O perfeito qal com conjunção dá continuidade à sequência prescritiva do caso legal; o futuro em português expressa de modo natural essa instrução.
- source_word: הַבֶּגֶד
  choice: a roupa
  rationale: בגד é um termo geral para peça de vestir ou roupa; esta forma é clara e corrente em português.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: a urdidura ou a trama
  rationale: 'São os dois termos técnicos complementares da tecelagem: os fios longitudinais e os fios transversais.'
- source_word: בַּצֶּמֶר אוֹ בַפִּשְׁתִּים
  choice: de lã ou de linho
  rationale: Em português, a preposição “de” indica naturalmente o material dos fios ou do tecido; “linho” traduz o produto têxtil associado ao linho vegetal.
- source_word: כָּל כְּלִי הָעוֹר
  choice: qualquer objeto de couro
  rationale: כלי abrange utensílio, artigo ou objeto, e não apenas recipiente; “objeto de couro” mantém essa amplitude.
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: em que estiver a marca
  rationale: נגע designa aqui a manifestação ou marca observável da afecção. “Marca” evita atribuir ao texto uma categoria microbiológica moderna.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: afecção destrutiva
  rationale: צרעת é uma categoria levítica mais ampla que a hanseníase moderna e, neste contexto, afeta materiais; ממארת comunica caráter danoso, persistente ou consumidor sem impor um diagnóstico contemporâneo.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: isso será queimado no fogo
  rationale: O nifal imperfeito expressa o resultado passivo exigido. “Isso” retoma de modo abrangente qualquer dos materiais contaminados e evita ambiguidade de gênero em português.
theological_decisions:
- issue: Tradução de צָרַעַת quando aplicada a tecidos e couro
  choice: afecção
  alternative: lepra; doença de pele; tsaraat
  rationale: Neste capítulo, o termo hebraico abrange uma categoria de impureza ritual que pode atingir pessoas, vestimentas e casas. “Afecção” preserva a ligação conceitual sem identificar indevidamente a condição com a hanseníase nem chamar uma alteração de tecido de “doença de pele”.
- issue: Sentido de מַמְאֶרֶת
  choice: destrutiva
  alternative: maligna; corrosiva; persistente
  rationale: “Destrutiva” transmite o efeito nocivo ou consumidor do termo, sem introduzir a associação médica específica que “maligna” costuma ter no português atual.
translation_notes:
  register: Português moderno, claro e digno, com terminologia têxtil precisa. A formulação evita arcaísmos e categorias médicas anacrônicas, preservando o caráter prescritivo da legislação e a amplitude do vocabulário hebraico.
