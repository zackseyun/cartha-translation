base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: pt
  text: Mas, se ela de fato se espalhar pela pele, o sacerdote declarará a pessoa impura[a]; é uma afecção[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “considerará a pessoa impura”. O verbo, neste contexto sacerdotal, indica uma declaração oficial de impureza ritual.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “lesão”, “praga” ou “marca”. O termo hebraico é amplo e não corresponde com precisão a uma categoria médica moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o caso anterior; a combinação preserva tanto a relação com o contexto quanto o valor condicional.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: de fato se espalhar
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ideia verbal; “de fato” comunica a ênfase em português natural.
- source_word: בָּעוֹר
  choice: pela pele
  rationale: עוֹר significa “pele”; com o verbo “espalhar-se”, “pela pele” expressa de modo idiomático a extensão da afecção na superfície cutânea.
- source_word: וְטִמֵּא
  choice: declarará ... impura
  rationale: No contexto jurídico-sacerdotal, o Piel de טמא indica a determinação oficial do estado de impureza, não que a fala do sacerdote produza esse estado.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כֹּהֵן no contexto levítico.
- source_word: אֹתוֹ
  choice: a pessoa
  rationale: O objeto é a pessoa examinada. “A pessoa” evita uma referência pronominal potencialmente ambígua e funciona naturalmente em português contemporâneo.
- source_word: נֶגַע
  choice: uma afecção
  rationale: O termo é amplo e pode designar uma lesão, marca ou condição aflitiva; “afecção” evita identificar indevidamente uma doença moderna específica.
- source_word: הִוא
  choice: é
  rationale: A oração nominal identifica a condição descrita como נֶגַע; em português, a cópula explícita é necessária.
theological_decisions:
- issue: Natureza da declaração sacerdotal de impureza
  choice: O sacerdote declara oficialmente a pessoa impura.
  alternative: O sacerdote torna a pessoa impura.
  rationale: O contexto de exame e decisão sacerdotal favorece uma declaração autorizada de condição ritual, sem sugerir que o sacerdote cause a impureza por suas palavras.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. “De fato” preserva a ênfase hebraica sem soar excessivamente literal; “afecção” mantém a amplitude diagnóstica do termo original.
