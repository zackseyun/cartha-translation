base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: pt
  text: O sacerdote o examinará e, ao constatar que a doença de pele[a] cobriu todo o seu corpo, declarará limpa a pessoa afetada[b]. Todo o seu corpo se tornou branco; essa pessoa está limpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico צָרַעַת, tradicionalmente traduzido por “lepra”, refere-se em Levítico a uma variedade de afecções da pele, não necessariamente à hanseníase moderna.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “declarará limpa a afecção” ou “a marca”. O parecer, porém, determina que a pessoa que a apresenta está limpa.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְרָאָה
  choice: examinará
  rationale: Embora o verbo signifique literalmente “ver”, neste contexto de inspeção sacerdotal ele indica um exame destinado a emitir um parecer.
- source_word: וְהִנֵּה
  choice: se constatar que
  rationale: Expressa de modo natural em português o resultado observado pelo sacerdote, sem exigir o arcaizante “e eis que”.
- source_word: הַצָּרַעַת
  choice: doença de pele
  rationale: O termo hebraico abrange afecções cutâneas e não corresponde necessariamente à hanseníase moderna.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: todo o seu corpo
  rationale: No contexto, בָּשָׂר designa a superfície corporal da pessoa; “todo o seu corpo” é natural e evita que “carne” seja entendida como tecido muscular.
- source_word: וְטִהַר
  choice: declarará limpa
  rationale: No sistema de pureza levítico, a forma verbal indica um pronunciamento sacerdotal, não um ato de cura ou limpeza física.
- source_word: אֶת הַנָּגַע
  choice: a pessoa afetada
  rationale: Literalmente, o objeto pode ser “a afecção” ou “a marca”; a formulação pessoal comunica com clareza que o parecer de pureza se aplica à pessoa, e a nota preserva a forma hebraica.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: Tudo se tornou branco
  rationale: Mantém a ênfase na totalidade e descreve diretamente a mudança de cor observada.
- source_word: טָהוֹר הוּא
  choice: essa pessoa está limpa
  rationale: “Limpa” conserva a terminologia de pureza de Levítico sem acrescentar a explicação interpretativa “cerimonialmente”.
theological_decisions:
- issue: Sentido de צָרַעַת na legislação de pureza
  choice: doença de pele
  alternative: lepra; hanseníase; tzaraat
  rationale: Evita identificar indevidamente a categoria hebraica mais ampla com uma doença clínica moderna específica.
- issue: Natureza do parecer sacerdotal em וְטִהַר
  choice: declarará limpa
  alternative: purificará; tornará limpa
  rationale: O sacerdote reconhece e pronuncia o estado de pureza; o verbo não descreve cura nem a produção desse estado.
- issue: Referente do objeto אֶת הַנָּגַע
  choice: a pessoa afetada, com nota sobre a expressão literal
  alternative: a afecção; a área afetada
  rationale: A redação portuguesa torna explícita a aplicação pessoal do parecer, enquanto a nota conserva a tensão entre a gramática hebraica e o efeito jurídico da declaração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “se constatar que” integra naturalmente o resultado da inspeção ao procedimento legal. Evitaram-se tanto o arcaísmo “e eis que” quanto a falsa precisão médica de “lepra” ou “hanseníase”.
