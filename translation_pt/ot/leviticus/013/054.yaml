base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: pt
  text: Então o sacerdote ordenará que lavem o objeto em que está a mancha[a] e o manterá isolado por mais sete dias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a afecção”. O termo hebraico pode designar uma mancha, lesão ou afecção; aqui se refere à alteração presente no objeto examinado.
    reason: lexical_alternative
  - marker: b
    text: Ou “e o encerrará novamente por sete dias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: Então o sacerdote ordenará
  rationale: O waw com o perfeito dá continuidade à sequência legal; “então” e o futuro expressam naturalmente o passo seguinte do procedimento.
- source_word: וְכִבְּסוּ
  choice: que lavem
  rationale: A forma verbal na terceira pessoa do plural deixa os agentes sem identificação; a oração subordinada após “ordenará” preserva isso com naturalidade.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: o objeto em que está a mancha
  rationale: “Objeto” mantém a referência ampla ao artigo afetado no contexto, enquanto “em que está” acompanha de perto a construção relativa hebraica.
- source_word: הַנָּגַע
  choice: a mancha
  rationale: No contexto de tecido, couro ou outro artigo, “mancha” designa de modo claro e não excessivamente clínico a alteração visível examinada pelo sacerdote; uma nota registra alternativas possíveis.
- source_word: וְהִסְגִּירוֹ
  choice: e o manterá isolado
  rationale: A expressão comunica o confinamento ou isolamento do objeto para nova inspeção sem sugerir necessariamente uma quarentena médica moderna.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: por mais sete dias
  rationale: Forma idiomática em português que expressa com clareza a repetição do período de sete dias.
