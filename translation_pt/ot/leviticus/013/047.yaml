  text: Se houver numa peça de roupa uma mancha de lepra[a], numa peça de lã ou numa peça de linho,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico tsaraat, tradicionalmente traduzido por “lepra”, designa aqui uma categoria mais ampla de afecções ou marcas, inclusive as que aparecem em tecidos, e não especificamente a hanseníase moderna.
