lexical_decisions:
- source_word: וְהַבֶּגֶד
  choice: Se houver numa peça de roupa
  rationale: בֶּגֶד designa uma peça de vestuário ou tecido. Embora o hebraico use o artigo, o contexto jurídico apresenta um caso genérico; em português, a construção indefinida com “se houver” é natural. O וְ liga este caso ao contexto anterior, sem exigir um “e” pouco fluente no início da frase.
- source_word: כִּי יִהְיֶה בוֹ
  choice: Se houver numa
  rationale: כִּי com o imperfeito introduz aqui uma hipótese legal. A construção existencial “se houver” preserva o sentido de presença indicado por יִהְיֶה בוֹ e soa corrente em português.
- source_word: נֶגַע
  choice: uma manifestação
  rationale: נֶגַע indica uma afecção ou sinal perceptível sujeito a exame. “Manifestação” funciona tanto para pessoas quanto, neste caso, para tecidos, sem sugerir necessariamente uma epidemia ou uma simples mancha.
- source_word: צָרָעַת
  choice: lepra
  rationale: Mantém-se o termo tradicional e reconhecível, mas uma nota esclarece que צָרָעַת abrange uma categoria antiga mais ampla e, aqui, afeta tecidos, não correspondendo especificamente à hanseníase moderna.
- source_word: בְּבֶגֶד צֶמֶר
  choice: seja numa peça de lã
  rationale: A formulação conserva a localização marcada por בְּ e identifica o material. “Peça de lã” é natural e não restringe indevidamente בֶּגֶד a uma roupa pronta.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: seja numa peça de linho
  rationale: פִּשְׁתִּים refere-se ao linho produzido do flax. A correlação “seja... seja...” expressa com clareza as duas possibilidades, mantendo a preposição locativa de ambas as expressões hebraicas.
