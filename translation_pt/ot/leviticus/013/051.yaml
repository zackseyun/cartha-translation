base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: pt
  text: No sétimo dia, ele examinará a mancha. Se a mancha tiver se espalhado na roupa, na urdidura, na trama ou no couro — em qualquer objeto feito de couro —, a mancha é uma tsara‘at destrutiva[a]; ela está impura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsara‘at é o termo hebraico tradicionalmente traduzido como “lepra”. Em Levítico, porém, ele abrange diversas manifestações de impureza e também pode aparecer em roupas, couro e casas; portanto, não corresponde especificamente à hanseníase.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: examinará
  rationale: No contexto dos procedimentos sacerdotais, o verbo indica inspeção cuidadosa, não apenas o ato de ver.
- source_word: הַנֶּגַע
  choice: a mancha
  rationale: O substantivo designa a área afetada ou manifestação visível submetida à inspeção. “Mancha” funciona naturalmente para roupa e couro sem pressupor uma infecção biologicamente definida.
- source_word: פָשָׂה
  choice: tiver se espalhado
  rationale: Expressa a extensão da área afetada; a forma condicional corresponde à construção hebraica com כִּי neste contexto legal.
- source_word: בֶּגֶד
  choice: roupa
  rationale: Termo atual e amplamente compreensível para uma peça de vestuário, adequado ao referente hebraico.
- source_word: שְׁתִי
  choice: urdidura
  rationale: É o termo técnico português para os fios longitudinais do tecido.
- source_word: עֵרֶב
  choice: trama
  rationale: É o termo técnico português para os fios transversais, formando o par convencional “urdidura e trama”.
- source_word: עוֹר
  choice: couro
  rationale: O contexto trata de pele preparada e empregada na fabricação de objetos, portanto “couro” é mais preciso que “pele”.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: em qualquer objeto feito de couro
  rationale: Representa com naturalidade a abrangência da expressão hebraica, que inclui todo objeto para cuja fabricação o couro seja empregado.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: uma manifestação destrutiva de tsara‘at
  rationale: Mantém o termo técnico hebraico porque ele também se aplica a roupas e couro, onde “doença de pele” seria inadequado; “destrutiva” comunica o caráter danoso de מַמְאֶרֶת.
- source_word: טָמֵא הוּא
  choice: o objeto está impuro
  rationale: Explicita o referente inanimado no português e preserva a declaração de condição ritual, sem reduzir a impureza a sujeira física.
theological_decisions:
- issue: Sentido de צָרַעַת na legislação de pureza levítica
  choice: tsara‘at, com explicação em nota
  alternative: lepra; doença de pele; praga
  rationale: O termo hebraico não equivale especificamente à hanseníase e, neste capítulo, pode afetar pessoas, roupas, couro e casas. A transliteração preserva a categoria ritual abrangente e evita uma designação médica inadequada neste versículo.
- issue: Referente de טָמֵא הוּא
  choice: o objeto está impuro
  alternative: ela está impura; isso é impuro
  rationale: O masculino singular hebraico pode retomar o נגע, mas no contexto a determinação prática recai sobre o material ou objeto afetado. A formulação portuguesa comunica essa consequência sem acrescentar uma doutrina denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação jurídica clara. Emprega “urdidura” e “trama”, o par técnico usual em português. A transliteração “tsara‘at” evita a expressão semanticamente imprópria “doença de pele” para materiais inanimados; a nota fornece a explicação necessária. O travessão delimita a ampliação referente a objetos de couro.
