  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: pt
  text: Se a mancha for esverdeada ou avermelhada na roupa, no couro, na urdidura, na trama ou em qualquer objeto de couro, é uma mancha de tsaraat[a] e deverá ser mostrada ao sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, «mancha de lepra». «Tsaraat» é o termo hebraico para uma categoria ritual examinada em Levítico; não se refere especificamente à hanseníase moderna e, neste contexto, pode afetar roupas e objetos de couro.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶגַע
  choice: mancha
  rationale: No contexto de tecidos e couro, indica uma área visível afetada. “Mancha” é natural em português e se aplica bem tanto à coloração quanto ao objeto examinado.
- source_word: יְרַקְרַק
  choice: esverdeada
  rationale: A forma hebraica indica uma tonalidade verde aproximada, sem especificar com segurança um matiz exato.
- source_word: אֲדַמְדָּם
  choice: avermelhada
  rationale: A forma reduplicada aponta para uma tonalidade semelhante ao vermelho, e não necessariamente para um vermelho vivo e puro.
- source_word: בֶּגֶד
  choice: roupa
  rationale: “Roupa” é claro e corrente para a peça de tecido mencionada neste contexto, sem excluir o sentido mais amplo de material têxtil.
- source_word: עוֹר
  choice: couro
  rationale: Aqui se trata de pele animal usada como material, e não de pele viva; por isso, “couro” é a equivalência contextual mais clara.
- source_word: שְׁתִי
  choice: urdidura
  rationale: É o termo técnico português para o conjunto de fios longitudinais de um tecido.
- source_word: עֵרֶב
  choice: trama
  rationale: É o termo técnico português para os fios transversais entrelaçados à urdidura.
- source_word: כְּלִי עוֹר
  choice: objeto de couro
  rationale: A expressão hebraica é abrangente e pode indicar qualquer utensílio ou artigo feito de couro.
- source_word: נֶגַע צָרַעַת
  choice: mancha de doença
  rationale: A expressão designa uma categoria ritual e física que, neste capítulo, pode afetar pessoas, tecidos e couro. “Doença” evita identificar indevidamente o fenômeno com a hanseníase moderna; a nota preserva o termo tradicional e esclarece a amplitude do hebraico.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: deverá ser mostrada ao sacerdote
  rationale: A forma verbal hebraica é passiva e deixa implícita a pessoa que leva o objeto; a tradução preserva esse foco na mancha submetida à inspeção.
theological_decisions:
- issue: Tradução de צָרַעַת na legislação sacerdotal
  choice: doença
  alternative: lepra
  rationale: A condição pode atingir tecidos e couro, além da pele humana, portanto não corresponde especificamente à hanseníase moderna. A escolha mantém ampla a categoria ritual e diagnóstica do texto, enquanto a nota registra a tradução tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Urdidura” e “trama” mantêm a distinção técnica do hebraico. A coordenação foi simplificada de modo natural, sem alterar as categorias enumeradas; a construção passiva final preserva o agente implícito do original.
