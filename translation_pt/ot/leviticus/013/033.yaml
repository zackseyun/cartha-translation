base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/033.yaml
  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: pt
  text: Então, ele se rapará[a], mas não rapará a área afetada[b]; e o sacerdote manterá a área afetada isolada por mais sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fará com que o barbeiem”. A forma hebraica é reflexiva e pode indicar que a própria pessoa se barbeia ou providencia que alguém a barbeie.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente que não se deve rapar “a área afetada”, provavelmente para que ela permaneça distinguível depois de se raparem os pelos ao redor.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: Então rapará o cabelo
  rationale: 'O hitpael de גלח tem sentido reflexivo: a pessoa deve se barbear ou fazer com que a barbeiem. Como o contexto trata de uma afecção no couro cabeludo ou na barba, explicitar “o cabelo” produz uma instrução natural em português sem determinar quem executa a ação.'
- source_word: הַנֶּתֶק
  choice: a área afetada
  rationale: נֶתֶק designa aqui uma afecção específica da cabeça ou da barba, associada à perda de pelos. “Área afetada” é clara e evita identificar de modo incerto a condição como simples coceira ou descamação.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: mas não rapará a área afetada
  rationale: O hebraico marca a própria área afetada como objeto direto de “rapar”. A tradução preserva essa formulação, em vez de introduzir no texto principal a interpretação de que se deve rapar somente ao redor dela.
- source_word: וְהִסְגִּיר
  choice: manterá ... isolada
  rationale: No procedimento de Levítico 13, סגר indica manter separado para observação. “Manter isolada” comunica a continuação do isolamento e evita o tom médico moderno de “quarentena”.
- source_word: שֵׁנִית
  choice: por mais sete dias
  rationale: שֵׁנִית indica a repetição do período de sete dias. Em português, “por mais sete dias” expressa naturalmente que se trata de um segundo período.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica natural. “Rapará” preserva o tom prescritivo; “área afetada” evita um diagnóstico moderno excessivamente específico. Os marcadores [a] e [b] aparecem no texto principal.
