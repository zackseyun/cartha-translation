  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: pt
  text: Esta é a instrução acerca da mancha de tsaraat[a] numa peça de lã ou de linho, nos fios da urdidura ou da trama, ou em qualquer artigo de couro, para declará-lo puro ou impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraat é o termo hebraico para uma categoria de afecções que podia atingir pessoas, tecidos e construções. Não corresponde necessariamente à hanseníase moderna, tradicionalmente chamada de «lepra».
    reason: lexical_and_historical_clarification
lexical_decisions:
- source_word: תּוֹרַת
  choice: a instrução acerca de
  rationale: Neste resumo da legislação anterior, תּוֹרָה designa a norma ou instrução que rege o caso. “Instrução” comunica bem o sentido sem limitar o termo à ideia moderna de lei estatutária.
- source_word: נֶגַע צָרַעַת
  choice: praga de tsaraat
  rationale: נֶגַע indica uma manifestação ou afecção visível, enquanto צָרַעַת é uma categoria ritual que também atinge tecidos e couro. “Praga” conserva a gravidade da expressão, e a transliteração evita identificá-la erroneamente com uma doença moderna específica.
- source_word: בֶּגֶד הַצֶּמֶר א֣וֹ הַפִּשְׁתִּים
  choice: numa peça de lã ou de linho
  rationale: בֶּגֶד é aqui uma peça de tecido ou vestuário; “peça” abrange naturalmente o objeto de lã ou linho e evita repetir um substantivo não expresso após “linho”.
- source_word: הַשְּׁתִי
  choice: os fios da urdidura
  rationale: Termo técnico para os fios longitudinais do tecido. A explicitação “fios” torna o vocabulário têxtil compreensível em português corrente.
- source_word: הָעֵרֶב
  choice: a trama
  rationale: Termo técnico para os fios transversais entrelaçados à urdidura; é a designação moderna habitual em português.
- source_word: כָּל כְּלִי עוֹר
  choice: qualquer artigo de couro
  rationale: כְּלִי tem sentido amplo de objeto, utensílio ou artigo. “Artigo de couro” preserva essa amplitude com naturalidade.
- source_word: לְטַהֲרוֹ א֥וֹ לְטַמְּאוֹ
  choice: para declará-lo puro ou impuro
  rationale: No contexto sacerdotal, os infinitivos descrevem a determinação do estado ritual, não necessariamente uma ação física de limpar ou contaminar. “Declarar” expressa essa função adjudicatória.
theological_decisions:
- issue: Como traduzir צָרַעַת quando se aplica a tecidos e couro
  choice: tsaraat, com explicação em nota
  alternative: lepra; doença de pele; praga de lepra
  rationale: O termo hebraico abrange uma categoria de afecção e impureza ritual que não corresponde precisamente à hanseníase e, neste contexto, aplica-se a objetos. A transliteração preserva a categoria textual sem introduzir diagnóstico médico nem a incongruência de uma “doença de pele” num tecido.
- issue: Sentido de טהר e טמא na conclusão do procedimento
  choice: declarar puro ou impuro
  alternative: purificar ou tornar impuro
  rationale: O contexto resume a decisão sacerdotal sobre o estado ritual do objeto. A tradução evita sugerir que a mera declaração cause fisicamente sua condição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega terminologia têxtil corrente (“urdidura” e “trama”) e conserva o termo hebraico técnico apenas onde equivalentes portugueses poderiam criar uma identificação médica enganosa.
