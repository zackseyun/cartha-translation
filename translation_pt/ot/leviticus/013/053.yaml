  text: וְ/אִם֮ יִרְאֶ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔גַע בַּ/בֶּ֕גֶד א֥וֹ בַ/שְּׁתִ֖י א֣וֹ בָ/עֵ֑רֶב א֖וֹ בְּ/כָל כְּלִי עֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: pt
  text: Mas, se o sacerdote examinar e constatar que a mancha não se espalhou na roupa, nem na urdidura, nem na trama[a], nem em qualquer objeto de couro,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, nos fios transversais do tecido.
    reason: Esclarece para leitores não familiarizados com a terminologia têxtil o sentido técnico de 'trama'.
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz a continuação condicional e mantém o leve contraste com o procedimento descrito anteriormente.
- source_word: יִרְאֶה הַכֹּהֵן וְהִנֵּה
  choice: o sacerdote examinar e constatar
  rationale: No contexto de inspeção ritual, יִרְאֶה descreve mais que um simples olhar; a formulação transmite o exame oficial e o resultado indicado por וְהִנֵּה, em português natural.
- source_word: לֹא פָשָׂה
  choice: não se espalhou
  rationale: פָשָׂה indica que a condição se alastrou ou se estendeu; o pretérito perfeito expressa o resultado observado na nova inspeção.
- source_word: הַנֶּגַע
  choice: a mancha
  rationale: Neste contexto de tecido ou couro afetado, 'mancha' é concreta, compreensível e evita atribuir ao fenômeno um diagnóstico microbiológico moderno que o hebraico não especifica.
- source_word: בַּבֶּגֶד
  choice: na roupa
  rationale: בֶּגֶד pode designar roupa ou peça de tecido; 'roupa' é corrente e adequado ao contexto imediato.
- source_word: בַשְּׁתִי
  choice: na urdidura
  rationale: Termo técnico português para o conjunto de fios longitudinais do tecido.
- source_word: בָעֵרֶב
  choice: na trama
  rationale: Termo técnico português para os fios transversais entrelaçados à urdidura.
- source_word: בְּכָל כְּלִי עוֹר
  choice: em qualquer objeto de couro
  rationale: כְּלִי é um termo amplo para utensílio ou objeto; 'objeto de couro' preserva essa abrangência em linguagem atual.
