base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: pt
  text: O sacerdote o examinará no sétimo dia. Se a lesão[a] permanecer inalterada aos olhos dele[b] e não tiver se espalhado pela pele, o sacerdote o isolará por sete dias pela segunda vez[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a mancha» ou «a afecção». O termo hebraico néga se refere à alteração visível submetida ao exame sacerdotal, não necessariamente a uma doença definida pela medicina moderna.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «a lesão permaneceu aos olhos dele», isto é, pareceu inalterada ao sacerdote.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «o encerrará por sete dias pela segunda vez»; também pode ser traduzido como «o manterá confinado por sete dias, pela segunda vez».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: o examinará
  rationale: Embora ראה signifique literalmente “ver”, neste procedimento sacerdotal indica inspeção cuidadosa para uma determinação ritual.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: no sétimo dia
  rationale: Expressa de modo direto a data definida para a nova inspeção.
- source_word: וְהִנֵּה
  choice: Se
  rationale: No encadeamento casuístico, introduz o resultado constatado pelo sacerdote; em português atual, “Se” comunica naturalmente a condição, sem exigir o solene “e eis que”.
- source_word: הַנֶּגַע
  choice: a lesão
  rationale: Designa a alteração visível examinada pelo sacerdote sem identificá-la indevidamente com uma doença moderna específica.
- source_word: עָמַד בְּעֵינָיו
  choice: parecer não ter mudado
  rationale: Traduz o sentido do idioma, literalmente “permaneceu aos seus olhos”, preservando que se trata da avaliação visual do sacerdote.
- source_word: לֹא פָשָׂה הַנֶּגַע בָּעוֹר
  choice: não tiver se espalhado pela pele
  rationale: פשׂה indica expansão da lesão; “pela pele” é idiomático em português e explicita o âmbito dessa expansão.
- source_word: וְהִסְגִּירוֹ
  choice: o manterá isolado
  rationale: O verbo significa fechar ou manter separado; “manterá isolado” comunica a continuação da separação sem impor a precisão médica moderna de “quarentena”.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: por mais sete dias
  rationale: Expressa naturalmente que se trata de um segundo período completo de sete dias.
