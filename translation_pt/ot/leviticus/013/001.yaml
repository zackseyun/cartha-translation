  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés e a Arão[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH. Tradicionalmente traduzido como “SENHOR” em muitas versões.'
    reason: Informa a forma hebraica subjacente e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O wayyiqtol de דבר introduz um novo ato narrativo de fala; “falou” reproduz de modo natural e digno a fórmula recorrente de discurso divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A preposição אֶל identifica os dois destinatários. Em português, a coordenação natural permite não repetir “a” antes de Arão sem perder a relação sintática.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala que vem a seguir. Em português moderno, os dois-pontos cumprem naturalmente essa função e evitam o calque pouco idiomático “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e uma transliteração amplamente reconhecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A fórmula final foi vertida por dois-pontos, pois a fala começa no versículo seguinte.
