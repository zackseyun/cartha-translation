  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: pt
  text: Depois de lavada a área afetada, o sacerdote a examinará. Se a área afetada não tiver mudado de aparência[a] nem tiver se espalhado, o objeto está impuro. Queime-o no fogo; trata-se de uma deterioração corrosiva[b], seja no lado gasto, seja no lado exposto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tiver mudado de cor”. O hebraico diz literalmente “não tiver mudado o seu olho”, expressão referente ao aspecto visível.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma corrosão destrutiva”. O termo hebraico é raro e indica deterioração que consome o material.'
    reason: lexical_alternative
  - marker: c
    text: A frase final é difícil. Literalmente, “na sua calvície ou na sua calvície frontal”. No contexto, provavelmente se refere a lados, superfícies ou partes expostas do material.
    reason: textual_or_exegetical_difficulty
lexical_decisions:
- source_word: וְרָאָה
  choice: o sacerdote a examinará
  rationale: No contexto diagnóstico sacerdotal, ראה indica inspeção cuidadosa, não apenas o ato de ver.
- source_word: אַחֲרֵי הֻכַּבֵּס אֶת הַנֶּגַע
  choice: Depois de lavada a área afetada
  rationale: A forma passiva de כבס indica que a parte afetada foi lavada; a construção portuguesa mantém essa relação sem identificar indevidamente um agente.
- source_word: הַנֶּגַע
  choice: a área afetada
  rationale: Neste contexto de tecido ou couro, נגע designa a manifestação ou região atingida; esta opção evita tanto uma diagnose moderna quanto o termo médico inadequado 'doença'.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: não tiver mudado de aparência
  rationale: O hebraísmo literalmente menciona o 'olho' da área e se refere ao aspecto visível, possivelmente à cor; 'aparência' preserva a amplitude sem literalismo obscuro.
- source_word: לֹא פָשָׂה
  choice: nem tiver se espalhado
  rationale: פשה indica que a afecção se estende ou se alastra.
- source_word: טָמֵא הוּא
  choice: o objeto está impuro
  rationale: טמא é o termo técnico da legislação de pureza. O sujeito é explicitado em português como o objeto inspecionado, evitando sugerir que apenas a mancha tenha esse estado.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Queime-o no fogo
  rationale: O imperfeito de segunda pessoa tem força normativa; o pronome retoma o objeto afetado.
- source_word: פְּחֶתֶת
  choice: uma deterioração corrosiva
  rationale: O substantivo raro parece descrever um processo destrutivo ou corrosivo no material; a formulação não impõe uma identificação microbiológica moderna.
- source_word: בְּקָרַחְתּוֹ א֥וֹ בְגַבַּחְתּוֹ
  choice: seja no lado gasto, seja no lado exposto
  rationale: Os termos, literalmente associados a tipos de calvície, são metafóricos e obscuros quando aplicados ao material. A tradução oferece um sentido contextual possível e sinaliza a dificuldade em nota.
