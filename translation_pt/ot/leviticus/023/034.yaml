base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: pt
  text: '“Fale aos filhos de Israel: No décimo quinto dia deste sétimo mês será a Festa das Cabanas[a], em honra de Yahweh, durante sete dias.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “Festa dos Tabernáculos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: 'Fale aos filhos de Israel:'
  rationale: Mantém o imperativo formal e a expressão hebraica tradicional. Os dois-pontos exprimem naturalmente em português a função introdutória de לֵאמֹר, sem o pesado literalismo de “dizendo”.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: No décimo quinto dia deste sétimo mês
  rationale: Reproduz com clareza e naturalidade a fórmula hebraica de data, preservando o demonstrativo “deste”.
- source_word: חַג הַסֻּכּוֹת
  choice: Festa das Cabanas
  rationale: “Cabanas” comunica de modo transparente as habitações temporárias designadas por סֻכּוֹת e é um nome reconhecível da festa em português; a forma tradicional alternativa é registrada em nota.
- source_word: שִׁבְעַת יָמִים
  choice: celebrada durante sete dias
  rationale: Explicita idiomaticamente a duração da festa sem alterar o conteúdo do sintagma hebraico.
- source_word: לַיהוָה
  choice: em honra de Yahweh
  rationale: Neste contexto festivo, ל indica que a celebração é dedicada a Yahweh. “Em honra de” soa natural em português e evita a construção menos idiomática “festa para Yahweh”.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. A transliteração “Yahweh” preserva o nome da aliança e segue a decisão doutrinária fornecida, sem substituí-lo por um título.
- issue: Nome da festa סֻכּוֹת
  choice: Festa das Cabanas
  alternative: Festa dos Tabernáculos
  rationale: A tradução principal expressa o sentido concreto do termo hebraico; a denominação tradicional é mantida em nota para reconhecimento, sem substituir a evidência lexical do original.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A formulação preserva o tom legislativo divino, mas substitui o hebraísmo quotativo “dizendo” por pontuação natural. O marcador [a] aparece imediatamente após o nome da festa.
