  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: pt
  text: E ofereçam um bode como oferta pelo pecado[a] e dois cordeiros de um ano como sacrifício de paz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de purificação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sacrifício de comunhão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Ofereçam também
  rationale: Embora o verbo signifique literalmente “fazer”, no contexto sacrificial “oferecer” comunica naturalmente a ação exigida. “Também” expressa aqui o valor continuativo da forma verbal na sequência das prescrições.
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: um bode
  rationale: A expressão designa um caprino macho, e o numeral é preservado diretamente. “Bode” é claro, atual e específico em português.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: Mantém a designação tradicional e amplamente compreensível da categoria sacrificial, sem ocultar a alternativa funcional “oferta de purificação”, registrada em nota.
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: e dois cordeiros
  rationale: O substantivo hebraico refere-se a cordeiros e, neste contexto sacrificial, a animais machos. Em português, “cordeiros” já é masculino e preserva a especificação sem redundância.
- source_word: בְּנֵי שָׁנָה
  choice: de um ano
  rationale: Tradução natural do idioma hebraico que especifica a idade dos animais.
- source_word: לְזֶבַח שְׁלָמִים
  choice: como sacrifício de ofertas de paz
  rationale: Preserva tanto זֶבַח, “sacrifício”, quanto o plural שְׁלָמִים, nome da categoria sacrificial. A formulação fica próxima da estrutura hebraica, ainda que menos idiomática que o singular coletivo.
theological_decisions:
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: “Oferta pelo pecado” conserva a designação tradicional e inteligível; “oferta de purificação” destaca uma função cultual defendida lexicalmente. Como o versículo não resolve toda a relação entre pecado e purificação, a alternativa é mantida em nota.
- issue: Sentido de שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão
  rationale: “Ofertas de paz” permanece mais próxima da associação lexical com integridade, bem-estar e paz, enquanto “ofertas de comunhão” explicita uma dimensão relacional e participativa. A tradução principal evita restringir o termo a uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa natural para a instrução dirigida à comunidade. A tradução conserva a terminologia cultual e as alternativas lexicais relevantes sem introduzir explicações confessionais.
