  source_fidelity: A tradução transmite adequadamente os animais, os números, a idade e as duas categorias sacrificiais. Contudo, “também” não é exigido por וְ e acrescenta uma nuance continuativa que o versículo isolado não especifica. A construção “como sacrifício de ofertas de paz” é excessivamente literal e pouco natural em português; o hebraico זֶבַח שְׁלָמִים designa uma categoria sacrificial.
  naturalness: “E ofereçam” é uma forma imperativa plural clara e apropriada. “Sacrifício de paz” é uma designação cultual compreensível e mais idiomática do que “sacrifício de ofertas de paz”.
