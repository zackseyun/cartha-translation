  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: pt
  text: Estes são os tempos determinados de Yahweh[a], as convocações sagradas[b], que vocês proclamarão nos seus tempos determinados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “festas determinadas” ou “tempos fixados”. O termo hebraico מוֹעֲדֵי é mais amplo que festividades e se refere a tempos determinados por Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Ou “assembleias sagradas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O demonstrativo plural introduz a lista seguinte; em português, a cópula torna a frase natural.
- source_word: מוֹעֲדֵי
  choice: tempos determinados
  rationale: מוֹעֵד designa um tempo ou encontro marcado. Aqui é mais amplo que festas com refeições e mantém a ênfase temporal, retomada no fim do versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: convocações sagradas
  rationale: A expressão construta indica reuniões santas formalmente convocadas; “convocações” preserva a ideia de chamamento público.
- source_word: תִּקְרְאוּ
  choice: vocês proclamarão
  rationale: Neste contexto, קרא se refere a anunciar ou convocar publicamente as observâncias, não apenas a lhes dar um nome.
- source_word: אֹתָם
  choice: que
  rationale: O pronome objeto retoma os tempos determinados, identificados também como convocações sagradas; a construção relativa portuguesa expressa essa relação sem ambiguidade artificial.
- source_word: בְּמוֹעֲדָם
  choice: nos tempos determinados para elas
  rationale: A expressão indica a ocasião própria fixada para cada observância. A formulação distributiva em português mantém a repetição de מוֹעֵד e esclarece o referente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada sem o substituir por “SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” expressa com naturalidade a segunda pessoa do plural. A repetição de “tempos determinados” reproduz a ligação lexical do hebraico, enquanto “para elas” comunica o valor distributivo da ocasião própria de cada convocação.
