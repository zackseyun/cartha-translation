  source_fidelity: 'A tradução mantém adequadamente a sequência e o sentido do hebraico: a apresentação da oferta a Yahweh durante sete dias, a assembleia sagrada no sétimo dia e a proibição de trabalho. “Oferta feita pelo fogo” representa de modo defensável אִשֶּׁה sem restringi-lo a um tipo sacrificial específico; a nota registra a alternativa relevante. “Trabalho habitual” comunica de forma adequada a qualificação de מְלֶאכֶת עֲבֹדָה, sem ampliar a proibição para toda atividade.'
