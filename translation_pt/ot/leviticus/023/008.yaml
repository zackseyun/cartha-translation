id: LEV.23.8
reference: Leviticus 23:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: pt
  text: Durante sete dias, apresentarão a Yahweh uma oferta feita pelo fogo.[a] No sétimo dia haverá uma assembleia sagrada; não farão nenhum trabalho habitual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma oferta pelo fogo”. O termo hebraico também tem sido entendido como “oferta de alimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: apresentarão
  rationale: O hifil de קרב, em contexto sacrificial, significa trazer ou apresentar uma oferta. “Apresentarão” conserva a ação cultual em português natural.
- source_word: אִשֶּׁה
  choice: uma oferta feita pelo fogo
  rationale: O termo sacerdotal designa uma oferta destinada ao fogo sacrificial. Esta formulação preserva essa associação sem sugerir especificamente um holocausto, embora a etimologia e a nuance exata do substantivo sejam discutidas.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário ou a dedicação da oferta; “a Yahweh” mantém esse sentido direto.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A expressão indica o período ao longo do qual as ofertas devem ser apresentadas.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: no sétimo dia
  rationale: Tradução temporal direta e idiomática.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma assembleia sagrada
  rationale: A expressão fixa designa uma reunião sagrada oficialmente convocada. “Assembleia sagrada” é clara e conserva o caráter comunitário e cultual.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: nenhum trabalho habitual
  rationale: A construção se refere ao trabalho comum ou ocupacional proibido nos dias festivos, e não necessariamente a toda e qualquer atividade. “Habitual” comunica isso sem o arcaísmo de “servil”.
- source_word: לֹא תַעֲשׂוּ
  choice: não farão
  rationale: Mantém a forma verbal da proibição dirigida à comunidade, em formulação natural e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e não impõe a substituição tradicional por um título.
- issue: Alcance da proibição de trabalho
  choice: nenhum trabalho habitual
  alternative: nenhum trabalho penoso; nenhum trabalho servil
  rationale: A expressão hebraica qualifica o tipo de trabalho proibido. A tradução evita ampliar a proibição para toda atividade concebível e também evita decidir questões posteriores sobre sua aplicação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem inicial com “Durante sete dias” destaca a duração expressa no hebraico. “Assembleia sagrada” evita o tecnicismo menos corrente “santa convocação”, e “trabalho habitual” transmite o sentido cultual sem recorrer ao arcaico “trabalho servil”.
