  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: pt
  text: Ele moverá o feixe diante de Yahweh, para a aceitação de vocês[a]; no dia seguinte ao sábado, o sacerdote o moverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que vocês sejam aceitos”. A expressão hebraica pode indicar a aceitação dos adoradores diante de Yahweh por meio da oferta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: moverá
  rationale: O hifil de נוּף designa aqui o gesto ritual de mover ou apresentar a oferta. “Moverá” preserva a ação cultual e sua repetição no fim do versículo.
- source_word: הָעֹמֶר
  choice: o feixe
  rationale: Neste contexto, עֹמֶר é o feixe das primícias levado para apresentação, não simplesmente uma unidade de medida.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa a apresentação cultual na presença de Deus, mantendo o nome divino explícito no hebraico.
- source_word: לִרְצֹנְכֶם
  choice: para que vocês sejam aceitos
  rationale: A expressão indica a aceitação dos ofertantes por meio da apresentação do feixe. Esta formulação é natural em português e explicita o referente humano do sufixo plural.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: no dia seguinte ao sábado
  rationale: Tradução direta e corrente da expressão temporal hebraica.
- source_word: יְנִיפֶנּוּ הַכֹּהֵן
  choice: o sacerdote ... o moverá
  rationale: Preserva o mesmo verbo ritual e identifica corretamente o sacerdote como sujeito e o feixe como objeto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Sentido cultual de לִרְצֹנְכֶם
  choice: para que vocês sejam aceitos
  alternative: para a aceitação de vocês
  rationale: O hebraico permite entender a frase como finalidade ou resultado referente à aceitação dos adoradores. A tradução principal é idiomática, e a nota conserva a alternativa nominal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para deixar “o sacerdote” como sujeito explícito desde o início, sem alterar o conteúdo. A repetição de “mover” conserva a estrutura ritual do hebraico.
