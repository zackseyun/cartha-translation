  terminology: «Feixe», «diante de Yahweh», «sacerdote» e «sábado» são adequados. «Yahweh» reproduz de maneira consistente o nome divino. A nota deve apresentar «para que vocês sejam aceitos» como alternativa interpretativa, e não o contrário.
