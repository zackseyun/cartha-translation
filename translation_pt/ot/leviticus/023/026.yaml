base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o Tetragrama; também representado como “Jeová”.'
    reason: Identifica o Tetragrama hebraico e registra uma forma alternativa de representação do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר com waw consecutivo introduz um novo ato de fala. “Falou” é a formulação natural em português e, diante da introdução do discurso direto, evita a redundância de “disse, dizendo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; “a” é a correspondência natural na construção “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵּאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz o conteúdo da fala. Em português atual, os dois-pontos reproduzem naturalmente essa função sem a fórmula pouco idiomática “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e mantém a distinção entre nome e título, enquanto a nota registra formas alternativas conhecidas.
translation_notes:
  register: 'Português moderno, digno e acessível. A fórmula hebraica foi vertida de modo natural: o conteúdo do discurso é introduzido por dois-pontos, em vez de se conservar literalmente “dizendo”.'
