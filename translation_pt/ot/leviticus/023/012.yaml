  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: pt
  text: No dia em que moverem o feixe[a], ofereçam um cordeiro macho de um ano, sem defeito, como holocausto a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ômer”; aqui, o termo provavelmente se refere ao feixe apresentado no rito, e não apenas a uma medida de volume para produtos secos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: ofereçam
  rationale: Embora עשה signifique em sentido amplo “fazer”, no contexto sacrificial designa a realização ou oferta do sacrifício; “ofereçam” expressa naturalmente esse uso cultual.
- source_word: בְּיוֹם
  choice: No dia
  rationale: A construção temporal é vertida de forma direta e natural em português.
- source_word: הֲנִיפְכֶם
  choice: moverem ... diante de Deus
  rationale: O hifil de נוף indica o gesto ritual de mover ou apresentar a oferta perante Deus. A formulação explicita o caráter cultual sem recorrer ao pouco natural “abanar”.
- source_word: הָעֹמֶר
  choice: o feixe
  rationale: Neste contexto da colheita, עֹמֶר provavelmente designa o feixe apresentado no rito, e não apenas uma unidade de medida seca.
- source_word: כֶּבֶשׂ
  choice: um cordeiro macho
  rationale: כֶּבֶשׂ designa um cordeiro, e o masculino do substantivo no contexto sacrificial permite tornar explícito que se trata de um animal macho.
- source_word: תָּמִים
  choice: sem defeito
  rationale: Na legislação sacrificial, תמים indica um animal livre de defeito; “sem defeito” é claro e corrente.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: A expressão idiomática hebraica especifica a idade do animal; “de um ano” é a formulação portuguesa mais natural.
- source_word: לְעֹלָה
  choice: como holocausto
  rationale: עֹלָה é o termo técnico para a oferta inteiramente queimada; “holocausto” preserva a categoria sacrificial tradicional e compreensível.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica que a oferta é dirigida a YHWH; o nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Natureza do gesto expresso por נוף
  choice: mover o feixe diante de Deus
  alternative: agitar o feixe; apresentar o feixe como oferta movida
  rationale: A expressão mantém o gesto ritual sem definir com precisão um movimento cuja forma exata não é descrita no versículo. “Diante de Deus” torna claro o sentido cultual implícito no verbo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário cultual tradicional. A sintaxe foi ajustada ao imperativo português, correspondente à força normativa do hebraico.
