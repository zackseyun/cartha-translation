id: LEV.23.18
reference: Leviticus 23:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: pt
  text: 'Junto com os pães[a], apresentem sete cordeiros machos de um ano, sem defeito, um novilho e dois carneiros. Eles serão um holocausto a Yahweh, com sua oferta de cereal e suas ofertas de bebida: uma oferta feita no fogo[b], de aroma agradável a Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “além dos pães”; aqui a preposição hebraica indica acompanhamento ou acréscimo, não que os animais fossem colocados sobre os pães.
    reason: lexical_alternative
  - marker: b
    text: Ou “oferta de alimento”; o termo hebraico designa uma oferta apresentada por meio do fogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: apresentem
  rationale: O hifil de קרב, em contexto sacrificial, indica levar ou apresentar uma oferta. A forma prescritiva portuguesa comunica naturalmente a instrução dirigida ao povo.
- source_word: עַל הַלֶּחֶם
  choice: junto com os pães
  rationale: A preposição עַל pode indicar acompanhamento ou acréscimo nesta fórmula sacrificial, sem sugerir que os animais fossem colocados fisicamente sobre os pães. O plural retoma naturalmente os dois pães mencionados no versículo anterior.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: sete cordeiros machos de um ano, sem defeito
  rationale: כֶּבֶשׂ designa cordeiro e a forma masculina sustenta a explicitação de que eram machos; בְּנֵי שָׁנָה é uma expressão idiomática de idade, e תְּמִימִם é o termo ritual para animais sem defeito.
- source_word: וּפַר בֶּן־בָּקָר אֶחָד
  choice: um novilho
  rationale: A expressão designa um bovino macho jovem. “Novilho” é conciso, natural em português e adequado ao inventário sacrificial.
- source_word: וְאֵילִם שְׁנָיִם
  choice: e dois carneiros
  rationale: אַיִל designa especificamente o carneiro adulto, distinguindo-o dos cordeiros já enumerados.
- source_word: יִהְיוּ עֹלָה לַיהוָה
  choice: Eles serão um holocausto a Yahweh
  rationale: עֹלָה é o termo técnico para a oferta inteiramente queimada e está no singular com sentido coletivo para o conjunto de animais.
- source_word: וּמִנְחָתָם
  choice: com a oferta de cereal correspondente
  rationale: No contexto levítico, מִנְחָה é a oferta de cereal que acompanha o holocausto. “Correspondente” explicita de modo natural a relação indicada pelo sufixo possessivo plural.
- source_word: וְנִסְכֵּיהֶם
  choice: e as ofertas de bebida correspondentes
  rationale: נֶסֶךְ é uma oferta líquida derramada. “Oferta de bebida” é acessível e mantém a natureza cultual do termo.
- source_word: אִשֵּׁה
  choice: uma oferta feita no fogo
  rationale: O termo designa uma oferta apresentada por meio do fogo. Esta formulação preserva o elemento ígneo sem confundi-la com o termo técnico específico para holocausto.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: A expressão ritual descreve um aroma que agrada ou apazigua; “aroma agradável” é claro, digno e não acrescenta uma explicação teológica ausente do texto.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O texto traz o nome divino יהוה; “Yahweh” preserva o nome próprio da aliança em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Sentido coletivo de עֹלָה
  choice: um holocausto para o conjunto dos animais
  alternative: holocaustos
  rationale: Embora vários animais sejam enumerados, o substantivo hebraico está no singular e apresenta o conjunto como uma só oferta sacrificial.
- issue: Natureza de אִשֵּׁה
  choice: oferta feita no fogo
  alternative: oferta de alimento
  rationale: A tradução principal conserva a referência tradicional ao fogo, enquanto a nota registra a alternativa lexical sem impor ao texto uma concepção material de alimento para Deus.
translation_notes:
  register: Português moderno, claro e solene, com vocabulário sacrificial estável. Preferiu-se “apresentem” à tradução excessivamente literal “façam chegar”, “sem defeito” ao arcaizante “sem mácula” e “ofertas de bebida” ao termo menos acessível “libações”.
