source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: pt
  text: '“Fale aos filhos de Israel: No sétimo mês, no primeiro dia do mês, haverá para vocês um descanso solene, um memorial de toques de trombeta[a] e uma santa convocação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um memorial de sons retumbantes”. O termo hebraico pode designar, de forma mais ampla, um forte sinal sonoro, incluindo aclamações, gritos ou toques de chifre ou trombeta.
    reason: alternativa lexical
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a expressão familiar masculina do hebraico, empregada coletivamente para a comunidade da aliança, sem substituí-la por uma designação mais genérica.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: No sétimo mês
  rationale: Reproduz de modo direto e natural a expressão temporal hebraica.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: Explicita em português o sentido convencional do idioma hebraico, literalmente “no um do mês”.
- source_word: יִהְיֶה לָכֶם
  choice: haverá para vocês
  rationale: Preserva tanto o valor futuro e existencial do verbo quanto a relação expressa por “para vocês”.
- source_word: שַׁבָּתוֹן
  choice: um descanso solene
  rationale: Comunica uma cessação especialmente observada, distinguindo o termo de uma simples menção ao sábado semanal.
- source_word: זִכְרוֹן
  choice: um memorial
  rationale: Conserva a ideia de algo instituído como lembrança ou comemoração no contexto litúrgico.
- source_word: תְּרוּעָה
  choice: toques de trombeta
  rationale: No contexto do calendário festivo, entende-se naturalmente como sinais sonoros produzidos por trombeta ou chifre; a nota preserva a amplitude semântica do termo.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: Mantém o sentido formal de uma reunião convocada e separada como santa.
theological_decisions:
- issue: Natureza de תְּרוּעָה na designação da celebração
  choice: toques de trombeta
  alternative: clamor, aclamação ou som retumbante
  rationale: O contexto litúrgico favorece sinais de trombeta ou chifre, mas o substantivo hebraico não identifica necessariamente um instrumento e também pode designar um forte clamor; a nota evita eliminar essa ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formulação de leitura natural no Brasil. A estrutura enumerativa e o vocabulário cultual do hebraico foram preservados sem arcaísmo excessivo.
