source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: pt
  text: Vocês a celebrarão como uma festa para Yahweh durante sete dias por ano. Esse será um estatuto permanente[a] ao longo de suas gerações; no sétimo mês vocês a celebrarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estatuto perpétuo” ou “estatuto eterno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: vocês celebrarão / vocês a celebrarão
  rationale: O verbo חָגַג indica celebrar ou observar uma festa, especialmente uma festa de peregrinação. “Celebrar” é natural em português atual e mantém a repetição verbal do hebraico.
- source_word: אֹתוֹ
  choice: essa festa / a
  rationale: O pronome retoma a festa mencionada no contexto. Na primeira ocorrência, “essa festa” evita ambiguidade em português; na segunda, o pronome “a” retoma naturalmente “festa”.
- source_word: חַג
  choice: festa
  rationale: חַג designa uma festa ou festival, frequentemente com caráter de peregrinação. “Festa” é claro e tradicional no contexto das celebrações levíticas.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: 'A preposição ל marca dedicação ou orientação: a festa é celebrada em honra de Yahweh. “Para Yahweh” preserva essa relação sem inserir explicação.'
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Expressa de modo idiomático a duração indicada pelo hebraico.
- source_word: בַּשָּׁנָה
  choice: por ano
  rationale: O hebraico diz literalmente “no ano”, indicando aqui a periodicidade anual. “Por ano” é conciso e natural, sem explicitar além do necessário a ideia distributiva.
- source_word: חֻקַּת עוֹלָם
  choice: estatuto permanente
  rationale: חֻקָּה é uma prescrição ou estatuto, e עוֹלָם comunica duração contínua ou indefinida. “Permanente” preserva a força duradoura sem impor uma afirmação filosófica de atemporalidade absoluta.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: A expressão indica vigência contínua ao longo das gerações sucessivas do povo.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: no sétimo mês
  rationale: Tradução direta da expressão temporal que determina o mês da celebração.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama. “Yahweh” preserva o nome divino pactual em vez de substituí-lo por um título.
- issue: Alcance temporal de עוֹלָם na legislação cultual
  choice: permanente
  alternative: eterno; perpétuo
  rationale: O termo afirma duração contínua e vinculante, mas o contexto legal não exige que a tradução resolva a questão como uma declaração metafísica de duração absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural dirigido à comunidade. A repetição de חָגַג foi preservada por formas de “celebrar”. O marcador [a] aparece imediatamente após a expressão a que se refere.
