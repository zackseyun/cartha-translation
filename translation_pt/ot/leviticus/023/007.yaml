base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: pt
  text: No primeiro dia, haverá para vocês uma santa convocação[a]; não farão nenhum trabalho habitual[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma assembleia sagrada” ou “uma santa assembleia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “obra de trabalho/serviço”; isto é, trabalho comum. Tradicionalmente: “trabalho servil”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: No primeiro dia
  rationale: Expressa de modo natural e fiel a indicação temporal formada pela preposição, o substantivo definido e o ordinal.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: Preserva tanto o caráter sagrado de קֹדֶשׁ quanto a nuance de convocação ou reunião pública presente em מִקְרָא no contexto cultual.
- source_word: יִהְיֶה לָכֶם
  choice: vocês terão
  rationale: É uma formulação portuguesa clara e natural para a construção hebraica que determina o que haverá para a comunidade, sem alterar o sentido normativo.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: nenhum trabalho habitual
  rationale: A negação com כָּל exige uma proibição abrangente, enquanto a locução מְלֶאכֶת עֲבֹדָה aponta para o trabalho comum ou ocupacional, e não necessariamente para toda e qualquer atividade.
- source_word: לֹא תַעֲשׂוּ
  choice: não farão
  rationale: O futuro em português preserva adequadamente a força prescritiva da proibição legal hebraica.
theological_decisions:
- issue: Extensão da proibição em מְלֶאכֶת עֲבֹדָה
  choice: A proibição abrange o trabalho habitual ou ocupacional.
  alternative: A proibição abrange absolutamente toda atividade.
  rationale: A expressão específica מְלֶאכֶת עֲבֹדָה é mais delimitada do que uma proibição simples de toda מְלָאכָה; a tradução mantém essa nuance sem definir além do que o texto permite.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário cultual compreensível. “Santa convocação” conserva o registro formal de Levítico; “trabalho habitual” evita tanto o arcaísmo potencialmente enganoso de “trabalho servil” quanto a ampliação para toda atividade concebível.
