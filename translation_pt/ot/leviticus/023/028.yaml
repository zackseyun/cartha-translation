  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: pt
  text: Não façam trabalho algum neste exato dia, pois este é o Dia da Expiação[a], para fazer expiação por vocês diante de Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Dia das Expiações”. Em português, o nome da festa é tradicionalmente traduzido como “Dia da Expiação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ
  choice: Não façam trabalho algum
  rationale: A construção negativa com כָּל מְלָאכָה proíbe toda forma de trabalho abrangida pela legislação festiva. A formulação é natural em português e preserva a força jurídica.
- source_word: בְּ/עֶצֶם הַ/יּ֣וֹם הַ/זֶּ֑ה
  choice: neste exato dia
  rationale: O idioma hebraico enfatiza o próprio dia em questão; “neste exato dia” comunica essa precisão temporal com clareza.
- source_word: כִּ֣י
  choice: pois
  rationale: Introduz a razão da proibição, mantendo uma ligação explicativa concisa.
- source_word: י֤וֹם כִּפֻּרִים֙
  choice: o Dia da Expiação
  rationale: É a designação corrente e inteligível da festa em português. O hebraico apresenta literalmente o plural “expiações”, preservado em nota.
- source_word: לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם
  choice: para fazer expiação por vocês
  rationale: Mantém o sentido cultual do piel de כפר e apresenta עַל como referência às pessoas em favor das quais se realiza a expiação.
- source_word: לִ/פְנֵ֖י
  choice: diante de
  rationale: Expressa naturalmente a ideia de presença perante Deus no contexto cultual.
- source_word: יְהוָ֥ה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי/כֶֽם
  choice: seu Deus
  rationale: No contexto da fórmula da aliança, o substantivo com sufixo de segunda pessoa plural tem sentido singular. “Seu” é amplamente compreensível e concorda semanticamente com o plural “vocês”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino. “Yahweh” preserva sua função como nome e evita substituí-lo por um título.
- issue: Sentido cultual de כפר e כִּפֻּרִים
  choice: expiação / Dia da Expiação
  alternative: purificação; cobertura; Dia das Expiações
  rationale: “Expiação” conserva o peso cultual e reconciliatório do termo sem impor uma teoria posterior específica. A forma plural do nome hebraico é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal direta. Emprega “vocês” para a segunda pessoa plural e “seu Deus” em concordância semântica. A expressão “fazer expiação” preserva o vocabulário cultual; a nota registra o plural literal do nome da festa.
