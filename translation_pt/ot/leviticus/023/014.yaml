base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: pt
  text: Não comam pão, grãos torrados nem grãos frescos até este mesmo dia, até que tenham trazido a oferta ao seu Deus. Isto é um estatuto permanente[a] por todas as suas gerações, em todos os lugares onde vocês morarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um estatuto perpétuo” ou “um estatuto eterno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: pão
  rationale: O sentido concreto de pão ou produto assado de cereal é preferível ao sentido mais amplo de alimento neste contexto da colheita.
- source_word: קָלִי
  choice: grãos torrados
  rationale: Designa cereal preparado pelo calor; a expressão é clara em português moderno e mantém a especificidade agrícola.
- source_word: כַרְמֶל
  choice: grãos frescos
  rationale: No conjunto com pão e grãos torrados, refere-se a cereal recém-amadurecido ou a espigas frescas, não ao topônimo Carmelo.
- source_word: לֹא תֹאכְלוּ
  choice: não comam
  rationale: A forma verbal negada tem força de proibição legal; o imperativo negativo é natural e inequívoco em português.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: até este mesmo dia
  rationale: A expressão com עֶצֶם enfatiza o dia determinado; “este mesmo dia” preserva essa ênfase sem artificialidade.
- source_word: עַד הֲבִיאֲכֶם
  choice: até que tenham trazido
  rationale: Expressa a ação concluída que funciona como condição temporal para o consumo.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: a oferta ao seu Deus
  rationale: קָרְבָּן é uma oferta levada ou apresentada a Deus; “ao seu Deus” comunica naturalmente em português a direção implícita no ato de trazer, sem especificar indevidamente o tipo de sacrifício.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: Preserva o caráter duradouro da determinação legal em linguagem atual, sem decidir debates posteriores sobre sua aplicação.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Reproduz a continuidade da norma através das gerações sucessivas.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: em todos os lugares onde vocês morarem
  rationale: Tradução natural e abrangente dos locais de residência, mais clara ao leitor comum do que o literal “em todas as suas habitações”.
theological_decisions:
- issue: Força de חֻקַּת עוֹלָם na legislação mosaica
  choice: “um estatuto permanente”, mantendo a força duradoura da norma em seu contexto legal e pactual
  alternative: “um estatuto eterno” ou “um estatuto perpétuo”
  rationale: A tradução conserva a reivindicação de duração do hebraico, mas não impõe uma conclusão teológica sobre a continuidade ou descontinuidade posterior da legislação cerimonial mosaica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo das formas hebraicas. A ordem das duas expressões com “até” foi mantida para preservar a estrutura e a ênfase do original.
