source:
  edition: WLC
  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: pt
  text: Mas, no décimo dia deste sétimo mês, será o Dia da Expiação.[a] Será uma santa convocação para vocês; vocês se afligirão[b] e apresentarão ao SENHOR uma oferta feita pelo fogo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Dia das Expiações”.'
    reason: alternative_reading
  - marker: b
    text: Ou “vocês se humilharão” ou “vocês se privarão”.
    reason: lexical_alternative
  - marker: c
    text: Ou “oferta de alimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Marca uma transição enfática e parcialmente restritiva em relação às instruções festivas anteriores, sem sobrecarregar a frase.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: no décimo dia deste sétimo mês
  rationale: Explicita naturalmente “dia”, subentendido no hebraico, e preserva o demonstrativo “deste”.
- source_word: יוֹם הַכִּפֻּרִים
  choice: o Dia da Expiação
  rationale: Emprega o título consagrado e natural em português; a forma morfologicamente plural do hebraico é registrada em nota.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: Preserva o caráter técnico de uma reunião sagrada oficialmente convocada.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: vocês se afligirão
  rationale: Mantém a amplitude do idioma hebraico de autonegação penitencial sem reduzi-lo apenas ao jejum nem entender נֶפֶשׁ como uma parte imaterial da pessoa.
- source_word: וְהִקְרַבְתֶּם
  choice: apresentarão
  rationale: No contexto sacrificial, o hifil de קרב indica trazer ou apresentar algo como oferta.
- source_word: אִשֶּׁה
  choice: uma oferta feita pelo fogo
  rationale: Reflete a designação cultual de uma oferta consumida ou preparada no fogo, evitando identificá-la indevidamente com uma categoria sacrificial mais estreita.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Segue a convenção reverente e amplamente reconhecida em português para o Tetragrama.
theological_decisions:
- issue: Título tradicional no singular em contraste com a forma hebraica plural
  choice: Dia da Expiação
  alternative: Dia das Expiações
  rationale: O singular é o título idiomático consolidado em português, enquanto a nota preserva a transparência quanto ao plural כִּפֻּרִים no texto hebraico.
- issue: Sentido da aflição de si mesmo
  choice: vocês se afligirão
  alternative: vocês se humilharão; vocês se privarão
  rationale: A tradução principal conserva a amplitude ritual e penitencial da expressão, sem especificar somente jejum ou apenas uma atitude interior.
- issue: Sentido cultual de אִשֶּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A opção principal mantém a associação explícita do termo com o fogo no uso sacerdotal; a alternativa funcional é registrada sem substituir a imagem cultual.
translation_notes:
  register: Português moderno, claro e solene, com formas de tratamento amplamente compreensíveis no Brasil e em outros contextos lusófonos. Os marcadores foram colocados junto às expressões a que suas notas se referem.
