base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: pt
  text: para que as suas gerações saibam que fiz os filhos de Israel[b] habitar em cabanas[a], quando os tirei da terra do Egito. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «abrigos». O hebraico sukkot refere-se a cabanas ou abrigos temporários; tradicionalmente, o nome da festa também é traduzido como «Festa dos Tabernáculos».
    reason: lexical_alternative
  - marker: b
    text: Ou «os israelitas» ou «o povo de Israel». Literalmente, «os filhos de Israel».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz propósito e é a forma natural de preservar essa força em português.
- source_word: יֵדְעוּ
  choice: saibam
  rationale: O subjuntivo após «para que» expressa adequadamente o resultado pretendido.
- source_word: דֹרֹתֵיכֶם
  choice: as suas gerações
  rationale: Preserva de perto a expressão hebraica e seu alcance multigeracional, sem reduzi-la apenas a «descendentes».
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo que as gerações devem saber.
- source_word: בַסֻּכּוֹת
  choice: em tendas
  rationale: סֻכּוֹת designa abrigos temporários. «Tendas» é claro e corrente em português; a nota registra alternativas e a natureza temporária dessas estruturas.
- source_word: הוֹשַׁבְתִּי
  choice: fiz ... habitar
  rationale: Preserva o valor causativo do hifil de ישׁב e mantém um registro bíblico digno e compreensível.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica literalmente e conserva sua forma corporativa tradicional; a nota oferece equivalentes idiomáticos.
- source_word: בְּהוֹצִיאִי
  choice: quando os tirei
  rationale: O infinitivo construto com בְּ indica circunstância temporal; esta formulação é idiomática em português.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém o substantivo explícito «terra» e traduz naturalmente a origem marcada por מִן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Expressa claramente a segunda pessoa do plural em português de ampla legibilidade, evitando a possível ambiguidade de «seu Deus».
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. «Yahweh» o representa explicitamente sem substituí-lo por um título.
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A escolha preserva a forma masculina plural e corporativa do hebraico, enquanto a nota reconhece traduções portuguesas mais idiomáticas.
- issue: Natureza das סֻכּוֹת no êxodo
  choice: tendas
  alternative: abrigos; cabanas
  rationale: O termo pode designar estruturas temporárias sem especificar com precisão sua construção. A tradução não resolve além do que o hebraico permite, e a nota conserva a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» para tornar inequívoco o plural do hebraico. Mantém «habitar» e «filhos de Israel» por proximidade formal, apoiados por notas onde necessário.
