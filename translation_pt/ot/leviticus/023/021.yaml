  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: pt
  text: Nesse mesmo dia, proclamem uma santa convocação[a]; não façam nenhum trabalho servil[b]. Será um estatuto permanente[c] em todos os lugares onde vocês morarem, por todas as suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma assembleia sagrada” ou “uma santa assembleia”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “nenhum trabalho de serviço”; isto é, nenhum trabalho comum ou servil.'
    reason: lexical_alternative
  - marker: c
    text: Ou “um estatuto perpétuo” ou “um estatuto duradouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: proclamem
  rationale: No contexto cultual, קרא indica anunciar ou convocar oficialmente; “proclamem” preserva o caráter público e solene.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Nesse mesmo dia
  rationale: A expressão enfatiza o dia exato; esta formulação conserva a ênfase em português natural.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: A expressão cultual fixa designa uma reunião sagrada formalmente convocada. A nota registra alternativas mais correntes.
- source_word: יִהְיֶה לָכֶם
  choice: integrado em “proclamem uma santa convocação”
  rationale: A construção portuguesa comunica naturalmente que a convocação deve existir para a comunidade, sem repetição artificial.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: nenhum trabalho servil
  rationale: A expressão distingue trabalho de serviço ou ocupação comum de toda e qualquer atividade; “servil” mantém a nuance tradicional sem ampliar a proibição para absolutamente todo ato.
- source_word: לֹא תַעֲשׂוּ
  choice: não façam
  rationale: Imperativo negativo natural em português, adequado ao discurso legal dirigido ao povo.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: No formulário legal, עוֹלָם expressa duração contínua ou indefinida; “permanente” evita impor uma leitura metafísica absoluta.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: em todos os lugares onde vocês morarem
  rationale: Explicita com clareza moderna o alcance distributivo a todas as localidades de residência.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Preserva a aplicação continuada às gerações sucessivas em português idiomático.
theological_decisions:
- issue: Alcance da proibição de trabalho na legislação da festa
  choice: “nenhum trabalho servil”
  alternative: “nenhum trabalho”; “nenhum trabalho habitual”; “nenhum trabalho profissional”
  rationale: מְלֶאכֶת עֲבֹדָה se refere ao trabalho ordinário ligado a serviço ou ocupação, e não necessariamente a toda atividade imaginável. A tradução evita tornar a proibição mais abrangente do que o hebraico.
- issue: Duração expressa por חֻקַּת עוֹלָם
  choice: “estatuto permanente”
  alternative: “estatuto perpétuo”; “estatuto eterno”
  rationale: Mantém a força duradoura da fórmula jurídica sem decidir além do texto se עוֹלָם deve ser entendido em sentido metafisicamente ilimitado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo. A ordem das notas foi ajustada para acompanhar sua ocorrência no texto.
