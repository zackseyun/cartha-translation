revisions:
- from: Pois toda pessoa que não se humilhar nesse mesmo dia será eliminada do seu povo.[a]
  to: Pois toda pessoa que não se humilhar neste mesmo dia será extirpada do seu povo.[a]
  rationale: A revisão substitui um termo que pode determinar a natureza da pena por uma fórmula portuguesa tradicional que conserva a ambiguidade de וְנִכְרְתָה. Também ajusta o demonstrativo temporal e aperfeiçoa a redação da nota, sem alterar o sentido da passagem.
