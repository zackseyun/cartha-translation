  revision_rationale: A revisão substitui um termo que pode determinar a natureza da pena por uma fórmula portuguesa tradicional que conserva a ambiguidade de וְנִכְרְתָה. Também ajusta o demonstrativo temporal e aperfeiçoa a redação da nota, sem alterar o sentido da passagem.
