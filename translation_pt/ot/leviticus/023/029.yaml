  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: pt
  text: Pois toda pessoa que não se humilhar neste mesmo dia será extirpada do seu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não afligir a si mesma”. A expressão idiomática hebraica refere-se à abnegação ou à auto-humilhação, tradicionalmente associada ao jejum.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da ordem anterior e mantém com naturalidade o encadeamento jurídico em português.
- source_word: כָל הַנֶּפֶשׁ
  choice: toda pessoa
  rationale: נֶפֶשׁ designa aqui a pessoa ou o indivíduo, não especificamente uma alma imaterial. A formulação é clara e natural em português.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: que não se humilhar
  rationale: Neste contexto do Dia da Expiação, a forma verbal exprime autoaflição, abnegação ou humilhação voluntária, tradicionalmente associada ao jejum. “Humilhar-se” comunica de modo natural a postura penitencial sem limitar a expressão a sofrimento físico.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: nesse mesmo dia
  rationale: A expressão com עֶצֶם intensifica a referência temporal. “Nesse mesmo dia” preserva a ênfase de modo idiomático.
- source_word: וְנִכְרְתָה
  choice: será eliminada
  rationale: A forma passiva de כרת constitui uma fórmula de sanção da legislação da aliança. “Será eliminada do seu povo” preserva seu peso jurídico sem definir se o meio é morte, expulsão ou juízo divino.
- source_word: מֵעַמֶּיהָ
  choice: do seu povo
  rationale: O sufixo feminino concorda gramaticalmente com נֶפֶשׁ e, em português, também se harmoniza naturalmente com “pessoa”. A expressão mantém a relação comunitária indicada pelo hebraico.
theological_decisions:
- issue: Sentido da ordem de afligir ou humilhar a si mesmo no Dia da Expiação
  choice: Traduzir no texto principal como “não se humilhar”.
  alternative: “não afligir a si mesma” ou “não praticar abnegação”
  rationale: O idioma hebraico aponta para autoaflição ligada à penitência e ao jejum. “Humilhar-se” transmite a postura pactual sem sugerir apenas dano físico; a alternativa mais formal é preservada em nota.
- issue: Natureza da sanção expressa por וְנִכְרְתָה
  choice: Manter a fórmula “será eliminada do seu povo” sem explicar seu mecanismo.
  alternative: “será excluída” ou “será retirada”
  rationale: O versículo não esclarece se a sanção é morte, expulsão da comunidade ou juízo divino. A tradução conserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A concordância no feminino decorre naturalmente de “pessoa”, sem restringir a norma a mulheres.
