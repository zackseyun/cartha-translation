review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a apresentação ritual, o pão das primícias, os dois cordeiros e a dupla relação de consagração a Yahweh e destinação sacerdotal. Contudo, a posição atual da nota em “Yahweh[a]” não corresponde ao elemento hebraico que ela esclarece (as duas ocorrências de עַל).
  naturalness: “Os moverá como oferta movida” é compreensível, mas soa tautológico e pouco idiomático em português moderno. “Os ներկայացará como oferta movida” evita a repetição e conserva o sentido técnico do rito.
  terminology: “Oferta movida”, “primícias”, “cordeiros” e “Yahweh” são escolhas adequadas. “Destinados ao sacerdote” expressa de forma natural o valor de לַכֹּהֵן, sem negar que as ofertas são santas para Yahweh.
  issues:
  - severity: medium
    issue: 'Construção tautológica: “os moverá como oferta movida”.'
    rationale: O verbo e o substantivo repetem a mesma ideia de modo pouco natural em português. O hifil de נוף pode ser vertido com segurança por “apresentará” quando o substantivo técnico “oferta movida” é mantido.
  - severity: medium
    issue: Âncora da nota lexical está ligada a “Yahweh”.
    rationale: A nota trata das preposições עַל em relação ao pão das primícias e aos dois cordeiros, não do nome divino. A âncora deve acompanhar a primeira expressão traduzida por “com”.
