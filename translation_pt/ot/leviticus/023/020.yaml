  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: pt
  text: O sacerdote os apresentará como oferta movida diante de Yahweh, com o pão das primícias[a] e os dois cordeiros. Serão santos para Yahweh e destinados ao sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre o pão das primícias” e “sobre os dois cordeiros”. A preposição hebraica pode ter sentido espacial, mas aqui provavelmente indica que eram apresentados juntos no ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: moverá
  rationale: O hifil de נוּף, em contexto sacrificial, designa o gesto ritual de mover ou apresentar a oferta; combinado com תְּנוּפָה, “moverá como oferta movida” mantém a terminologia cultual.
- source_word: אֹתָם
  choice: os
  rationale: Preserva a referência anafórica masculina plural aos elementos prescritos no contexto anterior sem especificá-los além do hebraico.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: junto com o pão das primícias
  rationale: Embora עַל possa significar literalmente “sobre”, neste contexto ritual provavelmente indica apresentação associada; “junto com” é natural e evita afirmar uma disposição física incerta.
- source_word: תְּנוּפָה
  choice: como oferta movida
  rationale: Termo técnico para uma oferta ritualmente movida ou apresentada diante de Deus; a formulação conserva a imagem da ação ritual.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa de modo direto a ação cultual realizada na presença de Deus e preserva o nome divino.
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: e os dois cordeiros
  rationale: Na coordenação iniciada por “junto com”, traduz a segunda ocorrência de עַל como associação ritual, sem sugerir necessariamente que algo era colocado fisicamente sobre os cordeiros.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: Serão santos
  rationale: Mantém a construção predicativa e o estatuto cultual dos elementos, sem expandi-la desnecessariamente para “coisas santas”.
- source_word: לַיהוָה לַכֹּהֵן
  choice: para Yahweh e pertencerão ao sacerdote
  rationale: 'Explicita em português a relação concisa dos dois dativos: consagração a Yahweh e destinação sacerdotal, sem confundir a santidade divina com a posse prática do sacerdote.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Relação entre a consagração a Yahweh e a destinação ao sacerdote
  choice: “Serão santos para Yahweh e pertencerão ao sacerdote”
  alternative: “Serão santos para Yahweh, para o sacerdote”
  rationale: A tradução explicita a função de לַכֹּהֵן como destinação ou direito sacerdotal, ao mesmo tempo que conserva a consagração primeira a Yahweh; não sugere que o sacerdote seja objeto da santidade.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O original emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e a distinção entre nome e título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se o termo cultual “oferta movida”; “junto com” comunica a associação ritual sem eliminar em nota a possibilidade espacial do hebraico.
