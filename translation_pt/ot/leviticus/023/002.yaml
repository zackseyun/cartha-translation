  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: pt
  text: 'Fale aos filhos de Israel e diga-lhes: As ocasiões sagradas designadas por Yahweh[a], que vocês proclamarão como santas convocações[b] — estas são as minhas ocasiões designadas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os tempos designados por Yahweh” ou “as festas designadas por Yahweh”; o termo hebraico abrange ocasiões sagradas fixadas e não apenas festas.
    reason: lexical_alternative
  - marker: b
    text: Ou “assembleias sagradas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel ordena que Moisés se dirija diretamente ao povo; “fale” é natural e digno em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a forma hebraica convencional e sua função coletiva como designação do povo da aliança.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Mantém a sequência formal de ordens e a referência explícita aos destinatários.
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: ocasiões determinadas / minhas ocasiões determinadas
  rationale: מוֹעֵד designa tempos ou ocasiões fixados; a formulação é suficientemente ampla para incluir o sábado, além das festas, e representa o sufixo de primeira pessoa no fim do versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: que vocês proclamarão
  rationale: קרא, neste contexto público e cultual, indica anunciar ou proclamar oficialmente.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: santas convocações
  rationale: Preserva tanto a ideia de reunião formalmente convocada quanto seu caráter consagrado.
- source_word: אֵלֶּה הֵם
  choice: estas são
  rationale: Reproduz com naturalidade a construção identificadora e enfática do hebraico.
theological_decisions:
- issue: Representação do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome próprio presente no texto hebraico sem o substituir por um título ou impor uma tradição denominacional.
- issue: Alcance semântico de מוֹעֵד
  choice: ocasiões determinadas
  alternative: festas; festivais; tempos determinados
  rationale: Evita restringir o termo a celebrações festivas, pois o contexto imediato também inclui o sábado.
- issue: Forma coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: Conserva a expressão masculina convencional do hebraico, que funciona coletivamente para o povo de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da frase acompanha o hebraico, e o travessão preserva a força da identificação final.
