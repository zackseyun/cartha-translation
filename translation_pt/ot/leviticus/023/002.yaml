  source_fidelity: 'A estrutura e os elementos essenciais do hebraico estão bem representados: o duplo imperativo dirigido a Moisés, «filhos de Israel», o nome Yahweh, a proclamação pública, «santas convocações» e a identificação final com «minhas». Contudo, «ocasiões determinadas por Yahweh» tende a apresentar Yahweh apenas como agente determinante, ao passo que o construto מוֹעֲדֵי יְהוָה também expressa, de modo direto, que são as ocasiões que lhe pertencem. «Ocasiões designadas de Yahweh» não é natural em português; por isso, uma formulação que una designação e pertença é mais fiel e clara.'
