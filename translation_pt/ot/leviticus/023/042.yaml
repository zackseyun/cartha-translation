  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: pt
  text: Durante sete dias vocês morarão em cabanas[a]; todos os israelitas nativos morarão em cabanas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abrigos” ou “abrigos temporários”; o termo hebraico se refere às construções temporárias usadas durante a festa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: em cabanas
  rationale: סֻכּוֹת designa abrigos temporários usados na festa. “Cabanas” preserva a imagem concreta e é a designação bíblica tradicional e clara em português.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: vocês morarão / morará
  rationale: ישׁב pode significar “sentar-se”, mas neste contexto de habitação significa residir ou morar. “Morar” comunica naturalmente a permanência temporária ordenada no versículo.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A preposição “durante” expressa com clareza o acusativo hebraico de duração.
- source_word: כָּל הָאֶזְרָח
  choice: todo natural
  rationale: אֶזְרָח indica o membro nativo da comunidade, em contraste com o estrangeiro residente. “Natural” evita introduzir a categoria política moderna de cidadania e não restringe indevidamente o referente aos homens.
- source_word: בְּיִשְׂרָאֵל
  choice: de Israel
  rationale: No sintagma português “natural de Israel”, a preposição “de” expressa de modo idiomático a pertença à comunidade de Israel.
theological_decisions:
- issue: Alcance de הָאֶזְרָח, substantivo masculino singular com sentido representativo
  choice: todo natural de Israel
  alternative: todo homem natural de Israel
  rationale: O masculino hebraico tem força genérica neste contexto. A tradução conserva esse alcance sem acrescentar uma restrição exclusivamente masculina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “cabanas” e do verbo de habitação reproduz a estrutura enfática do hebraico.
