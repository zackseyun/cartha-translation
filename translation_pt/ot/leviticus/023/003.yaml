base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: pt
  text: Durante seis dias, o trabalho poderá ser feito, mas o sétimo dia é um sábado de descanso completo[a], uma convocação sagrada. Não façam trabalho algum; é sábado para Yahweh, em todas as suas moradias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um repouso sabático” ou “um sábado de descanso solene”. A expressão hebraica intensifica a ideia de descanso e cessação do trabalho.
    reason: lexical_alternative
  - marker: b
    text: Ou “em todas as suas comunidades estabelecidas”. O termo hebraico pode se referir a moradias ou a comunidades de residência.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: poderá ser feito
  rationale: Preserva a forma passiva do nifal e, no contexto, a ideia permissiva ou normativa, sem transformar a frase em uma ordem direta para trabalhar.
- source_word: מְלָאכָה
  choice: trabalho
  rationale: É o equivalente natural e abrangente para o termo usado na legislação do sábado.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: sábado de descanso completo
  rationale: Expressa a intensificação hebraica e comunica uma cessação plena do trabalho sem acrescentar elaboração doutrinária.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma convocação sagrada
  rationale: Mantém tanto o caráter sagrado da reunião quanto a ideia de uma assembleia oficialmente convocada.
- source_word: לֹא תַעֲשׂוּ
  choice: Não façam trabalho algum
  rationale: Reproduz com clareza a proibição direta na segunda pessoa do plural.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: é sábado para Yahweh
  rationale: Preserva a construção com a preposição ל, deixando aberta sua nuance de pertença, dedicação ou orientação a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: em todos os lugares onde vocês morarem
  rationale: Comunica em português atual o alcance geográfico da expressão, que pode indicar lugares de moradia ou comunidades estabelecidas.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: mas o sétimo dia
  rationale: O valor contrastivo de “mas” torna explícita em português a oposição contextual entre os seis dias de trabalho e o sétimo dia de descanso.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o nome divino; “Yahweh” procura representar o Tetragrama sem substituí-lo por um título.
- issue: Força da expressão שַׁבַּת שַׁבָּתוֹן
  choice: sábado de descanso completo
  alternative: sábado de descanso solene
  rationale: A expressão intensifica a ideia de cessação ou repouso. “Descanso completo” conserva essa força legal e teológica sem especificar além do texto.
- issue: Sentido da preposição em שַׁבָּת הִוא לַיהוָה
  choice: sábado para Yahweh
  alternative: sábado dedicado a Yahweh
  rationale: “Para Yahweh” preserva a abertura semântica da preposição, que pode sugerir pertença, dedicação ou orientação, sem resolver a nuance de modo indevido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para marcar naturalmente o plural do hebraico, evita linguagem denominacional e conserva a formulação aberta “para Yahweh”.
