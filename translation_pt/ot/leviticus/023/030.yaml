  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: pt
  text: E toda pessoa que fizer qualquer trabalho neste mesmo dia — eu destruirei essa pessoa do meio do seu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu cortarei essa pessoa do meio do seu povo”. O verbo hebraico empregado aqui significa “destruir/fazer perecer”; não é o verbo normalmente usado para “cortar”, embora o sentido de remoção por juízo seja próximo.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: pessoa
  rationale: Na prosa legal e pactual, נֶפֶשׁ frequentemente designa o indivíduo inteiro, não especificamente uma alma imaterial. “Pessoa” é natural em português e serve para as duas ocorrências.
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: fizer qualquer trabalho
  rationale: Com מְלָאכָה, o verbo עשה tem o sentido comum de fazer ou realizar. “Fizer qualquer trabalho” preserva de modo idiomático a abrangência de כָּל.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: neste mesmo dia
  rationale: A expressão intensifica a referência temporal. “Neste mesmo dia” comunica a ênfase sem sugerir necessariamente o dia em que o enunciado foi pronunciado.
- source_word: וְהַאֲבַדְתִּי
  choice: eu destruirei
  rationale: O hifil de אבד significa causar a perda ou a morte, destruir. “Destruirei” reflete diretamente o verbo empregado, em vez de substituí-lo pelo termo técnico associado a כרת.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: do meio do seu povo
  rationale: A expressão indica remoção do interior da comunidade. O possessivo “seu” é inclusivo quanto ao gênero e evita reproduzir mecanicamente o feminino gramatical que concorda com נֶפֶשׁ.
theological_decisions:
- issue: Natureza da pena expressa por וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ
  choice: eu destruirei essa pessoa do meio do seu povo
  alternative: eu eliminarei essa pessoa do meio do seu povo
  rationale: O hebraico usa אבד no hifil (“destruir/fazer perecer”), e não כרת, o verbo habitual de “eliminar/cortar”. A tradução principal conserva essa distinção lexical; a nota registra a alternativa contextual sem determinar além do texto o mecanismo exato da pena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase conserva a estrutura enfática do hebraico, e o pronome “eu” torna explícita a ênfase da forma verbal na declaração divina.
