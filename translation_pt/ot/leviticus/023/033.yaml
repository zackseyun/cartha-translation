lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דִּבֵּר, com o waw que dá sequência à narrativa, introduz um novo pronunciamento. “Falou” preserva a fórmula recorrente de comunicação divina e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; “a Moisés” é uma construção corrente e digna em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz as palavras apresentadas no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o caráter de nome próprio sem substituí-lo por “SENHOR”; a variante tradicional “Jeová” é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene. Conserva-se a fórmula introdutória “falou a Moisés, dizendo”, com dois-pontos para indicar que o conteúdo da fala vem a seguir.
