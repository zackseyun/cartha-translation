id: LEV.23.31
reference: Leviticus 23:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹֽשְׁבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: pt
  text: Não façam trabalho algum. Este é um estatuto permanente[a], por todas as suas gerações, em todos os lugares onde vocês morarem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um estatuto para sempre” ou “um estatuto perpétuo”. O termo hebraico עוֹלָם pode indicar duração contínua, indefinida ou perpétua.
    reason: lexical_alternative
  - marker: b
    text: Ou “em todas as suas povoações” ou “onde quer que vocês morem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Não façam trabalho algum
  rationale: A construção proibitiva com כָּל מְלָאכָה nega de modo abrangente a realização de trabalho. “Trabalho algum” expressa essa totalidade em português natural e mantém o tom legal.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: חֻקָּה designa uma norma ou prescrição estabelecida, e עוֹלָם indica duração contínua ou indefinida. “Estatuto permanente” conserva o caráter jurídico sem impor uma definição filosófica de eternidade absoluta.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: A expressão indica vigência contínua ao longo das sucessivas gerações.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: em todos os lugares onde vocês morarem
  rationale: מוֹשָׁב pode designar lugar de moradia ou povoação. A formulação escolhida preserva a abrangência locativa em português claro e atual.
theological_decisions:
- issue: Duração da norma cultual
  choice: estatuto permanente
  alternative: estatuto para sempre; estatuto perpétuo
  rationale: O hebraico עוֹלָם comunica validade duradoura e contínua no contexto da aliança, mas sua extensão exata deve permanecer aberta. “Permanente” mantém a força da norma sem resolver além do texto a questão de duração absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção jurídica clara. O plural “vocês” favorece a legibilidade brasileira sem regionalismo forte; “trabalho algum” preserva a abrangência da proibição.
