  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: Informa a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דָּבַר, com waw consecutivo, introduz um novo ato de fala. “Falou” reproduz de modo natural e digno a fórmula narrativa hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino YHWH; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; em português, “falar a alguém” é uma construção adequada neste registro bíblico.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula de introdução do discurso, o infinitivo hebraico anuncia diretamente a fala subsequente. Em português atual, os dois-pontos cumprem essa função com mais naturalidade do que a tradução literal “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta explicitamente o Tetragrama. A forma “Yahweh” preserva o nome divino, enquanto “SENHOR” representa a substituição tradicional por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Os dois-pontos introduzem a fala que começa no versículo seguinte.
