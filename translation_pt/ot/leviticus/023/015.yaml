  source_fidelity: O texto preserva adequadamente a força diretiva de וּסְפַרְתֶּם, o dativo pessoal לָכֶם, os dois marcos temporais, o feixe da oferta movida e a formulação deliberadamente literal «sete sábados completos». A revisão apenas torna mais clara em português a relação entre os dois sintagmas temporais e posiciona a âncora da nota junto ao termo a que ela se refere.
