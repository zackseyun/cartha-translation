source:
  edition: WLC
  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: pt
  text: 'Contem para vocês, a partir do dia seguinte ao sábado, do dia em que trouxerem o feixe da oferta movida: serão sete sábados[a] completos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão sete semanas completas”. O hebraico diz literalmente “sete sábados completos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: Contem
  rationale: O perfeito qal com conjunção, neste contexto legal, tem força de ordem. O imperativo português comunica a instrução de modo natural e direto.
- source_word: לָכֶם
  choice: para vocês
  rationale: Preserva o dativo de interesse e sua nuance pessoal sem recorrer ao menos natural 'para si mesmos' numa ordem dirigida ao plural.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: a partir do dia seguinte ao sábado
  rationale: Expressa claramente o ponto inicial indicado por מִן e mantém 'sábado' como o termo cúltico específico do hebraico.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: desde o dia em que trouxerem
  rationale: Reproduz o ponto inicial temporal em português natural; o futuro do subjuntivo se ajusta à referência prospectiva da instrução.
- source_word: עֹמֶר
  choice: feixe
  rationale: Neste contexto, designa o feixe de cereal levado para apresentação, e não apenas uma unidade de medida.
- source_word: הַתְּנוּפָה
  choice: da oferta movida
  rationale: Mantém a especificidade ritual de uma oferta movimentada ou apresentada diante de YHWH, usando terminologia bíblica portuguesa reconhecível.
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: sete sábados
  rationale: Conserva no texto principal o termo hebraico explícito 'sábados', sem resolver a possível função calendárica como 'semanas'.
- source_word: תְּמִימֹת
  choice: completos
  rationale: No contexto de contagem temporal, indica períodos inteiros ou completos, não perfeição moral nem ausência de defeito.
- source_word: תִּהְיֶינָה
  choice: serão
  rationale: Verte de maneira concisa e natural a forma verbal feminina plural, concordando semanticamente com os sete períodos contados.
theological_decisions:
- issue: Interpretação de שַׁבָּת / שַׁבָּתוֹת na instrução calendárica
  choice: Manter 'sábado' e 'sábados' no texto principal.
  alternative: Traduzir como 'semana' ou 'semanas', entendendo o termo como períodos de sete dias.
  rationale: O hebraico emprega explicitamente o termo para sábado. Mantê-lo preserva a ambiguidade e a tensão interpretativa relativas ao início da contagem e ao sentido calendárico do plural; a alternativa comum é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo plural 'Contem' evita a rigidez de 'contareis'; 'oferta movida' preserva a linguagem ritual sem longa explicação no corpo do versículo. O marcador [a] aparece no texto principal.
