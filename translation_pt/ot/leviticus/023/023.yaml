base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/023.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; também traduzido como “Jeová”.'
    reason: Leitura alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, com waw consecutivo, introduz um novo ato de fala. “Falou” é natural e preserva a fórmula narrativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; “a” é a forma portuguesa natural na construção “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula introdutória, o infinitivo hebraico anuncia o conteúdo da fala que vem a seguir. Em português corrente, os dois-pontos expressam essa função com mais naturalidade do que “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e representa uma transliteração amplamente aceita; a nota registra a alternativa tradicional em português.
translation_notes:
  register: Português moderno, claro e digno. A coordenação inicial com “E” preserva a continuidade narrativa. Os dois-pontos reproduzem naturalmente a função introdutória de לֵאמֹר, visto que o discurso começa no versículo seguinte.
