source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: pt
  text: 'Estas são as festas determinadas do SENHOR, que vocês proclamarão como santas assembleias, para apresentar ao SENHOR uma oferta feita pelo fogo: holocausto e oferta de cereal, sacrifício e ofertas de bebida, o que cabe a cada dia no seu próprio dia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: festas determinadas
  rationale: No contexto do calendário cultual de Levítico 23, o termo designa ocasiões festivas fixadas; a formulação mantém tanto a ideia de festa quanto a de tempo determinado.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o Tetragrama por SENHOR em versaletes/maiúsculas.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: santas assembleias
  rationale: Expressa reuniões convocadas e separadas para uso sagrado, em linguagem natural e digna.
- source_word: אִשֶּׁה
  choice: oferta feita pelo fogo
  rationale: O termo cultual está ligado a uma oferta queimada no altar; evita a leitura mais interpretativa de 'oferta de alimento', embora o sentido exato e a etimologia sejam discutidos.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo cultual português tradicional para a oferta inteiramente queimada, ainda amplamente reconhecível em contexto bíblico.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Neste contexto sacrificial, designa a oferta vegetal, geralmente preparada com farinha ou cereal.
- source_word: נְסָכִים
  choice: ofertas derramadas
  rationale: Comunica a ação ritual de derramar a bebida, com maior transparência para leitores comuns do que o termo técnico 'libações'.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: o que cabe a cada dia no seu próprio dia
  rationale: 'Preserva o caráter distributivo da expressão hebraica: a obrigação prescrita para cada dia deve ser apresentada naquele dia.'
theological_decisions:
- issue: Sentido cultual de אִשֶּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A escolha mantém a associação textual recorrente com o fogo e não resolve de modo categórico a discussão lexical em favor da interpretação de alimento oferecido a Deus.
- issue: Relação entre as ofertas enumeradas
  choice: manter a sequência sem acrescentar conectivos explicativos
  alternative: explicitar que todas são tipos da oferta feita pelo fogo
  rationale: O hebraico apresenta uma enumeração compacta cuja estrutura exata admite alguma tensão; a tradução evita impor uma taxonomia teológica não explicitada.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantêm-se termos cultuais reconhecidos quando úteis, enquanto 'ofertas derramadas' torna נְסָכִים imediatamente compreensível. O plural 'vocês' traduz naturalmente a forma verbal plural.
