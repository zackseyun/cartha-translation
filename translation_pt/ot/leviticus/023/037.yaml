    issue: «ofertas derramadas» para נְסָכִים
    rationale: Embora aluda ao gesto ritual, a expressão não comunica claramente que se trata de ofertas líquidas/de bebida. נְסָכִים designa libações, isto é, ofertas de bebida; «ofertas de bebida» conserva o sentido e é mais natural para leitores modernos.
