id: LEV.23.5
reference: Leviticus 23:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: pt
  text: No primeiro mês, no décimo quarto dia do mês, ao entardecer[a], é a Páscoa de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “entre as tardes”, expressão hebraica para o período do crepúsculo em torno do pôr do sol.
    reason: lexical_alternative
  - marker: b
    text: Ou “é a oferta pascal para Yahweh” ou “é o sacrifício pascal para Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: No primeiro mês
  rationale: Em contexto de calendário, חֹדֶשׁ significa normalmente “mês”; com o ordinal, indica o primeiro mês do ano religioso.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: no décimo quarto dia do mês
  rationale: Explicita “dia”, subentendido no hebraico, e expressa a data com clareza em português atual.
- source_word: בֵּין הָעַרְבָּיִם
  choice: ao entardecer
  rationale: Traduz naturalmente a expressão idiomática hebraica, literalmente “entre as tardes”, sem definir com excessiva precisão o período em torno do pôr do sol.
- source_word: פֶּסַח
  choice: a Páscoa
  rationale: Mantém o sentido amplo da celebração ou rito pascal no calendário festivo; a possível referência à oferta ou ao sacrifício é preservada em nota.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: A preposição ל marca aqui relação, pertença ou dedicação. “De Yahweh” é natural em português para designar a celebração dedicada a ele.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Emprega o nome da aliança diretamente, conforme a forma representada pelo Tetragrama, sem substituí-lo por um título.
- issue: Sentido de פֶּסַח no contexto ritual
  choice: a Páscoa
  alternative: a oferta pascal; o sacrifício pascal
  rationale: O termo pode designar a celebração, o rito ou a vítima sacrificial. O texto principal conserva o termo amplo, e a nota registra a nuance sacrificial sem eliminar a ambiguidade.
- issue: Relação expressa por ל em לַיהוָה
  choice: de Yahweh
  alternative: para Yahweh
  rationale: A construção pode indicar dedicação ou pertença. “De Yahweh” é idiomático e não exclui que a Páscoa seja celebrada para ele.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Ao entardecer” evita regionalismos; “Páscoa” conserva o termo bíblico tradicional. Todos os marcadores de nota aparecem no texto principal.
