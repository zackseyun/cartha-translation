  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: pt
  text: Dos lugares onde vocês moram, trarão dois pães para a oferta movida. Eles serão feitos com dois décimos de efa[a] de farinha fina e assados com fermento[b], como primícias para Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dois décimos”; isto é, dois décimos de um efa.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “assados como pão fermentado”. O hebraico destaca que esses pães de primícias eram levedados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: Das suas comunidades
  rationale: מוֹשָׁב designa lugar de moradia ou povoado; “comunidades” comunica naturalmente que os pães eram trazidos dos lugares onde o povo vivia.
- source_word: תָּבִיאוּ
  choice: vocês trarão
  rationale: O hifil de בוא tem aqui força diretiva em instrução cultual; o futuro preserva em português o tom prescritivo.
- source_word: לֶחֶם תְּנוּפָה שְׁתַּיִם
  choice: dois pães como oferta movida
  rationale: Embora לֶחֶם esteja formalmente no singular, שְׁתַּיִם exige sentido plural. “Oferta movida” preserva o termo ritual תְּנוּפָה sem explicar além do texto.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dois décimos de efa
  rationale: עִשָּׂרוֹן é uma medida correspondente à décima parte de um efa nos textos sacerdotais; explicitar “efa” torna a medida compreensível.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente corrente e preciso para a farinha refinada usada nas ofertas de cereal.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: assados com fermento
  rationale: A expressão indica que os pães deviam ser assados em condição levedada; a formulação é clara e natural em português.
- source_word: בִּכּוּרִים
  choice: como primeiros frutos
  rationale: O termo identifica os pães como oferta proveniente dos primeiros produtos da colheita.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל marca destinação ou dedicação, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome da aliança presente explicitamente no texto hebraico, sem substituí-lo por um título.
- issue: Termo cultual תְּנוּפָה
  choice: oferta movida
  alternative: oferta apresentada com movimento ritual; oferta de apresentação
  rationale: “Oferta movida” mantém uma designação técnica tradicional e deixa em aberto a forma exata do gesto ritual, que o versículo não descreve.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo. Mantiveram-se os termos cultuais sem acrescentar uma interpretação do movimento ritual.
