id: LEV.23.40
reference: Leviticus 23:40
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: pt
  text: No primeiro dia, vocês tomarão para si frutos de árvores formosas[a], ramos de palmeiras, galhos de árvores frondosas e salgueiros dos ribeiros; e se alegrarão diante de Yahweh, seu Deus, durante sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, segundo a tradição judaica posterior, “cidras” (etrogues). Literalmente, o hebraico diz “fruto de árvore formosa/esplêndida”.
    reason: Preserva a identificação ritual tradicional como possibilidade sem restringir no texto principal o sentido mais amplo do hebraico e corrige a indicação da forma singular literal.
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: vocês tomarão para si
  rationale: Mantém a força prescritiva da forma verbal no contexto legal e representa explicitamente לָכֶם, em português atual e claro.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: No primeiro dia
  rationale: Traduz diretamente a expressão temporal sem acrescentar “da festa”, informação fornecida pelo contexto, mas ausente desta frase.
- source_word: פְּרִי עֵץ הָדָר
  choice: frutos de árvores formosas
  rationale: הָדָר comunica beleza, esplendor ou imponência. A formulação genérica conserva a amplitude do hebraico sem inserir no texto principal a identificação tradicional com a cidra.
- source_word: כַּפֹּת תְּמָרִים
  choice: ramos de palmeiras
  rationale: Expressão natural em português para a folhagem da palmeira e próxima da forma hebraica.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: galhos de árvores frondosas
  rationale: עָבֹת sugere espessura ou densidade, provavelmente da folhagem; “frondosas” comunica esse sentido com naturalidade.
- source_word: וְעַרְבֵי נָחַל
  choice: salgueiros dos ribeiros
  rationale: Representa עֲרָבָה como salgueiro e נַחַל como ribeiro ou curso de água, sem especificidade geográfica indevida.
- source_word: וּשְׂמַחְתֶּם
  choice: se alegrarão
  rationale: Preserva o sentido direto de alegrar-se e, em paralelo com “tomarão”, a força instrutiva do contexto.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: diante de Yahweh, seu Deus
  rationale: “Diante de” traduz naturalmente לִפְנֵי, e “Yahweh” representa o nome divino יהוה.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A preposição “durante” expressa naturalmente em português a extensão temporal indicada pelo hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; a forma “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Identificação de פְּרִי עֵץ הָדָר
  choice: 'expressão genérica: “frutos de árvores formosas”'
  alternative: cidras; frutos da cidreira
  rationale: A identificação com a cidra ou etrog pertence à tradição judaica posterior, enquanto a expressão hebraica permanece lexicalmente mais ampla; a alternativa é preservada em nota.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural explícito dirigido à comunidade. A pontuação divide com clareza a coleta dos elementos e a ordem de alegrar-se.
