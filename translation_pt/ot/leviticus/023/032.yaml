base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: pt
  text: Será para vocês um sábado de completo descanso, e vocês se afligirão[a]. No dia nove do mês, ao entardecer, de entardecer a entardecer[b], vocês guardarão o seu sábado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vocês se humilharão” ou “se privarão”. A expressão hebraica refere-se à autoaflição em uma observância penitencial, tradicionalmente associada ao jejum.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de entardecer a entardecer”, conforme a contagem israelita do dia.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: um sábado de descanso completo
  rationale: A construção intensifica a ideia de cessação e repouso. A formulação mantém o termo religioso “sábado” e explicita o caráter completo do descanso sem introduzir “solene”, ideia não expressa diretamente.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: vocês se afligirão
  rationale: A expressão hebraica ordena aflição ou humilhação de si no contexto penitencial do Dia da Expiação. A tradução direta preserva sua amplitude e não a reduz explicitamente ao jejum.
- source_word: נַפְשֹׁתֵיכֶם
  choice: se
  rationale: Aqui נֶפֶשׁ integra uma construção reflexiva referente à pessoa inteira; traduzir por “suas almas” poderia sugerir uma distinção antropológica que o idioma hebraico não exige.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: No dia nove do mês, ao entardecer
  rationale: Reproduz com clareza a data e o momento inicial da observância, mantendo a sequência do hebraico.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: de uma tarde à outra
  rationale: Mantém a referência literal às duas tardes e soa natural em português; evita substituir interpretativamente “tarde” por “pôr do sol”.
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: vocês guardarão o seu sábado
  rationale: Expressa idiomaticamente a observância do descanso sabático, evitando a reprodução pouco natural “descansarão o seu descanso”.
theological_decisions:
- issue: Sentido da autoaflição no contexto ritual
  choice: vocês se afligirão
  alternative: vocês jejuarão; vocês se humilharão; vocês se negarão a si mesmos
  rationale: Embora a tradição associe a ordem ao jejum, o hebraico não menciona explicitamente o jejum neste versículo. A tradução preserva a abrangência e a tensão da expressão original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas pronominais naturais no Brasil. Mantêm-se “sábado” como termo bíblico e “afligirão” por precisão cultual, com apoio explicativo em nota.
