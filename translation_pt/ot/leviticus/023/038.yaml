base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: pt
  text: além dos sábados de Yahweh[a], além das suas dádivas, além de todos os seus votos e além de todas as suas ofertas voluntárias, que vocês derem a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “à parte de”; a mesma alternativa vale para cada repetição de “além de”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: além de
  rationale: A expressão indica que esses dias e dádivas são adicionais às ofertas festivas mencionadas anteriormente. A repetição foi preservada para refletir a estrutura enfática do hebraico.
- source_word: שַׁבְּתֹת יְהוָה
  choice: os sábados de Yahweh
  rationale: Mantém o plural hebraico e a relação de pertencimento expressa pela construção nominal, sem converter o nome divino em título.
- source_word: מַתְּנוֹתֵיכֶם
  choice: as suas dádivas
  rationale: “Dádivas” expressa presentes dados a Deus e mantém a amplitude do substantivo hebraico sem especificar uma modalidade sacrificial não explicitada.
- source_word: כָּל נִדְרֵיכֶם
  choice: todos os seus votos
  rationale: Preserva o sentido direto de נֶדֶר e a possível referência tanto aos compromissos assumidos como, no contexto, ao que foi prometido por voto.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: todas as suas ofertas voluntárias
  rationale: No contexto cultual, a expressão designa ofertas apresentadas espontaneamente, em contraste com obrigações fixas.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: que vocês derem a Yahweh
  rationale: O relativo pode abranger os elementos coordenados anteriores; “derem” traduz de modo simples o verbo נתן e o futuro do subjuntivo é natural em português para a referência geral.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Alcance de מִלְּבַד na relação com as ofertas festivas
  choice: além de
  alternative: à parte de
  rationale: No contexto, a frase esclarece que os sábados, votos e ofertas voluntárias não substituem as celebrações e ofertas prescritas. “Além de” comunica essa relação aditiva, embora a expressão hebraica também possa ser formulada como “à parte de”.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”, amplamente compreensível no Brasil e em outros contextos lusófonos. A repetição de “além de” conserva o ritmo enumerativo do hebraico.
