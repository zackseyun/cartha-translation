  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: pt
  text: Durante sete dias, vocês apresentarão uma oferta apresentada pelo fogo[a] a Yahweh. No oitavo dia, haverá para vocês uma convocação sagrada, e vocês apresentarão uma oferta apresentada pelo fogo a Yahweh. É uma assembleia solene; não façam nenhum trabalho habitual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta pelo fogo”. O hebraico אִשֶּׁה é um termo técnico sacrificial para uma oferta apresentada pelo fogo.
    reason: Esclarece o sentido técnico de אִשֶּׁה sem sugerir que a expressão descreva o preparo da oferta ou que toda a oferta fosse necessariamente consumida.
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Durante sete dias
  rationale: Expressa de modo natural a duração indicada pela frase hebraica.
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: vocês apresentarão / apresentarão
  rationale: No hifil, קרב tem aqui o sentido cultual de apresentar uma oferta. “Apresentar” preserva essa nuance sacrificial em português corrente.
- source_word: אִשֶּׁה
  choice: oferta feita no fogo
  rationale: O termo sacerdotal designa uma oferta sacrificial apresentada por meio do fogo. A formulação evita sugerir que toda oferta dessa categoria fosse necessariamente consumida por completo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica direção ou dedicação da oferta; “a Yahweh” é conciso e natural no contexto sacrificial.
- source_word: מִקְרָא קֹדֶשׁ
  choice: convocação sagrada
  rationale: A expressão festiva indica uma reunião sagrada oficialmente convocada; “convocação” preserva tanto o ato de convocar quanto a reunião resultante.
- source_word: עֲצֶרֶת
  choice: assembleia solene
  rationale: Designa uma assembleia festiva especial, neste contexto conclusiva, associada à interrupção das atividades comuns.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: nenhum trabalho habitual
  rationale: A expressão proíbe o trabalho regular ou ocupacional da vida cotidiana, sem afirmar que absolutamente toda atividade estivesse vedada.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: No oitavo dia
  rationale: Tradução temporal direta e idiomática.
- source_word: יִהְיֶה לָכֶם
  choice: vocês terão
  rationale: Reproduz naturalmente em português a construção existencial hebraica com היה + ל.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio de Deus. “Yahweh” preserva explicitamente o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês” para tornar explícito o plural hebraico. Mantém o vocabulário cultual necessário, mas evita formulações excessivamente arcaicas ou literais.
