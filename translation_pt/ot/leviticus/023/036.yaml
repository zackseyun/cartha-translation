revisions:
- from: Durante sete dias, vocês apresentarão uma oferta feita no fogo[a] a Yahweh. No oitavo dia, vocês terão uma convocação sagrada e apresentarão uma oferta feita no fogo a Yahweh. É uma assembleia solene; não façam nenhum trabalho habitual.
  to: Durante sete dias, vocês apresentarão uma oferta apresentada pelo fogo[a] a Yahweh. No oitavo dia, haverá para vocês uma convocação sagrada, e vocês apresentarão uma oferta apresentada pelo fogo a Yahweh. É uma assembleia solene; não façam nenhum trabalho habitual.
  rationale: A revisão substitui uma formulação potencialmente enganosa por “oferta apresentada pelo fogo”, que conserva a referência cultual do hebraico אִשֶּׁה. Também simplifica a nota, removendo explicações históricas não exigidas pelo termo, e torna mais direta a construção existencial de יִהְיֶה לָכֶם.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:56:08Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a duração, a dupla apresentação da oferta, a convocação sagrada, a assembleia solene e a proibição de trabalho regular. Contudo, “oferta feita no fogo” pode descrever a preparação da oferta, em vez de reproduzir o termo técnico sacrificial אִשֶּׁה, ‘oferta pelo fogo’/‘oferta apresentada pelo fogo’.
  naturalness: O texto é claro e de registro apropriado. “Haverá para vocês uma convocação sagrada” exprime mais diretamente a construção hebraica do que “vocês terão uma convocação sagrada”, sem perder fluidez moderna.
  terminology: “Yahweh”, “convocação sagrada”, “assembleia solene” e “trabalho habitual” são escolhas adequadas. A terminologia para אִשֶּׁה deve evitar a sugestão de que a oferta era simplesmente confeccionada no fogo.
  issues:
  - severity: medium
    issue: “oferta feita no fogo” é impreciso para אִשֶּׁה.
    rationale: A expressão portuguesa tende a significar uma oferta preparada ou produzida no fogo. O hebraico é um termo técnico para uma oferta sacrificial apresentada pelo fogo; não define, por si só, o modo de preparo.
  - severity: low
    issue: A nota acrescenta que a oferta era “levada ao altar”.
    rationale: Esse pormenor não é expresso pelo termo em si nem é necessário para esclarecer o versículo. A nota deve limitar-se ao sentido lexical e à alternativa de tradução.
  revised_text: Durante sete dias, vocês apresentarão uma oferta apresentada pelo fogo[a] a Yahweh. No oitavo dia, haverá para vocês uma convocação sagrada, e vocês apresentarão uma oferta apresentada pelo fogo a Yahweh. É uma assembleia solene; não façam nenhum trabalho habitual.
