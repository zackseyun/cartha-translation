  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a] e diga-lhes: “Quando vocês entrarem na terra que eu lhes dou e colherem a safra dela, deverão levar ao sacerdote o feixe[b] das primícias da colheita de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “israelitas”. Em hebraico, literalmente, “filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ômer”. O termo hebraico pode indicar aqui um feixe, mas também é usado como termo técnico e como nome de uma medida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a forma explícita e tradicional do hebraico, que funciona como designação coletiva do povo da aliança; a alternativa idiomática é registrada em nota.
- source_word: כִּי תָבֹאוּ
  choice: Quando vocês entrarem
  rationale: כִּי introduz aqui a circunstância futura em que a ordem passa a vigorar; “quando” expressa isso sem acrescentar sentido causal ou condicional indevido.
- source_word: הָאָרֶץ אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: na terra que eu lhes dou
  rationale: “Terra” mantém o sentido geográfico e pactual, enquanto o presente “dou” representa de modo natural o particípio hebraico, que apresenta a dádiva divina como vigente ou iminente.
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: e colherem a safra dela
  rationale: Reproduz a ação agrícola e mantém explícito que a safra pertence à terra mencionada, evitando em português a repetição pouco natural “colherem a colheita”.
- source_word: וַהֲבֵאתֶם
  choice: deverão levar
  rationale: No contexto legislativo, a forma verbal encadeada comunica a obrigação que se segue à entrada na terra e à colheita; “deverão” torna natural essa força normativa.
- source_word: עֹמֶר
  choice: feixe
  rationale: Neste contexto agrícola e ritual, o termo designa de modo plausível um feixe da colheita levado ao sacerdote. A transliteração técnica “ômer” é preservada em nota por causa da amplitude lexical do termo.
- source_word: רֵאשִׁית קְצִירְכֶם
  choice: as primícias da colheita de vocês
  rationale: “Primícias” expressa tanto a precedência temporal quanto a função cultual da primeira porção da colheita.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente português corrente e preciso para o ofício cultual indicado por כֹּהֵן.
theological_decisions:
- issue: Forma coletiva e marcada pelo gênero em בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A redação principal conserva a forma masculina coletiva do hebraico sem redefinir sua abrangência pactual; a forma portuguesa mais idiomática aparece em nota.
- issue: Natureza do objeto ritual עֹמֶר
  choice: feixe
  alternative: ômer
  rationale: O cenário imediato favorece o objeto agrícola concreto levado ao sacerdote, mas o termo também pode ser entendido como designação técnica; por isso, a alternativa transliterada é mantida sem resolver além da evidência a possível nuance.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. Emprega “vocês” para o plural, “lhes” como complemento indireto natural e formulação normativa clara, sem perder os elementos formais e cultuais do hebraico.
