id: LEV.23.6
reference: Leviticus 23:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: pt
  text: E no décimo quinto dia deste mês haverá a Festa dos Pães sem Fermento dedicada a Yahweh[a]. Durante sete dias vocês comerão pão sem fermento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pertencente a Yahweh”. A preposição hebraica pode indicar dedicação ou pertencimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: E no décimo quinto dia
  rationale: Reproduz em português natural a expressão hebraica de data e mantém a ligação com o versículo anterior.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: deste mês
  rationale: Expressa de modo idiomático a localização do dia dentro do mês em questão.
- source_word: חַג הַמַּצּוֹת
  choice: a Festa dos Pães sem Fermento
  rationale: Trata a expressão como o nome de uma celebração e traduz מַצּוֹת de forma clara para leitores de português amplo.
- source_word: לַיהוָה
  choice: dedicada a Yahweh
  rationale: Torna natural em português a relação marcada por ל, sem apagar seu possível sentido de dedicação ou pertencimento.
- source_word: שִׁבְעַת יָמִים
  choice: Durante sete dias
  rationale: Comunica claramente a duração abrangida pela prescrição.
- source_word: מַצּוֹת תֹּאכֵלוּ
  choice: vocês comerão pão sem fermento
  rationale: O futuro em contexto legal transmite a força prescritiva do imperfeito hebraico sem recorrer ao pouco natural 'comereis'; o substantivo plural é vertido como expressão alimentar coletiva.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Representa diretamente o nome da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido da preposição ל em לַיהוָה
  choice: dedicada a Yahweh
  alternative: para Yahweh; pertencente a Yahweh
  rationale: No contexto cultual, a preposição pode indicar dedicação ou pertencimento. A tradução principal explicita a dedicação, enquanto a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para a segunda pessoa plural e evita formas arcaicas. A repetição entre o nome da festa e o alimento prescrito acompanha a repetição do hebraico.
