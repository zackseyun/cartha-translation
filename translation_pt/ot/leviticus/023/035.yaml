  text: בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן מִקְרָא קֹ֑דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: pt
  text: No primeiro dia haverá uma santa convocação[a]; não façam nenhum trabalho habitual[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma assembleia sagrada”. A expressão hebraica מִקְרָא קֹדֶשׁ é um termo formal para uma reunião santa convocada.
    reason: lexical_alternative
  - marker: b
    text: Ou “trabalho de serviço” ou “trabalho ocupacional”. A expressão se refere ao trabalho comum ligado ao serviço ou à ocupação.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: No primeiro dia
  rationale: A preposição בְּ com יוֹם forma uma expressão temporal, e o ordinal definido הָרִאשׁוֹן indica naturalmente “no primeiro dia”.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: A expressão cultual fixa designa uma reunião sagrada oficialmente convocada. “Santa convocação” preserva tanto a santidade da ocasião quanto a ideia de chamamento formal.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: nenhum trabalho habitual
  rationale: A construção se refere ao trabalho comum ligado ao serviço ou à ocupação, e não necessariamente a toda e qualquer atividade. “Trabalho habitual” comunica isso em português atual sem o tom arcaico de “trabalho servil”.
- source_word: לֹא תַעֲשׂוּ
  choice: não façam
  rationale: O imperfeito de segunda pessoa do plural em instrução legal expressa proibição. O imperativo negativo é natural, claro e mantém o destinatário no plural.
