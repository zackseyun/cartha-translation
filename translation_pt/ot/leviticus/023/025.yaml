  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: pt
  text: Não façam nenhum trabalho regular e apresentem a Yahweh uma oferta de alimento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma oferta pelo fogo” ou “uma oferta feita pelo fogo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: Não façam nenhum
  rationale: A construção hebraica expressa uma proibição total. Em português corrente, “não façam nenhum” preserva essa abrangência e o plural da segunda pessoa.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: trabalho regular
  rationale: A expressão designa o trabalho ordinário ligado ao labor ou serviço, e não toda e qualquer atividade. “Trabalho regular” comunica isso em linguagem atual, sem o tom arcaico e socialmente ambíguo de “trabalho servil” nem a possível ideia de esforço físico intenso de “trabalho laborioso”.
- source_word: וְהִקְרַבְתֶּם
  choice: e apresentem
  rationale: No hifil e em contexto sacrificial, קרב significa trazer ou apresentar algo como oferta. “Apresentem” é natural e conserva o sentido cultual.
- source_word: אִשֶּׁה
  choice: uma oferta de alimento
  rationale: No vocabulário sacerdotal, o termo nomeia uma oferta apresentada no fogo e concebida como oferta de alimento. A tradução principal comunica a categoria cultual, enquanto a nota conserva a alternativa tradicional ligada ao fogo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O texto traz diretamente o nome divino יהוה; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração “Yahweh” representa diretamente o Tetragrama e evita substituir o nome próprio por um título.
- issue: Sentido cultual de אִשֶּׁה
  choice: oferta de alimento
  alternative: oferta feita pelo fogo; oferta queimada
  rationale: A etimologia e o uso exato do termo admitem formulações distintas. O texto principal expressa sua função na linguagem sacerdotal, e a nota mantém visível a tradução tradicional associada ao fogo sem resolver em excesso a questão lexical.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural. “Trabalho regular” evita tanto o arcaísmo de “servil” quanto a interpretação excessivamente física de “laborioso”. O marcador da nota foi colocado após “oferta de alimento”, termo ao qual a alternativa lexical efetivamente se refere.
