  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: pt
  text: Contudo, no décimo quinto dia do sétimo mês, quando tiverem recolhido a produção da terra, vocês celebrarão durante sete dias a festa[a] de Yahweh. No primeiro dia haverá descanso solene[b], e no oitavo dia também haverá descanso solene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “festival”. A palavra hebraica pode indicar uma celebração festiva, muitas vezes uma festa de peregrinação.
    reason: lexical_alternative
  - marker: b
    text: Ou “descanso sabático”. O termo hebraico designa um descanso especial ligado a uma observância sagrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Marca uma transição ou ressalva em relação às instruções anteriores. “Contudo” conserva essa função discursiva sem reduzir o termo a mera ênfase.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: no décimo quinto dia do sétimo mês
  rationale: Expressão idiomática e precisa para a data hebraica.
- source_word: בְּאָסְפְּכֶם
  choice: quando tiverem recolhido
  rationale: O infinitivo construto com בְּ expressa circunstância temporal; a forma verbal comunica que o recolhimento da produção antecede a celebração.
- source_word: תְּבוּאַת הָאָרֶץ
  choice: a produção da terra
  rationale: תְּבוּאָה abrange o produto ou rendimento agrícola, sem se limitar aos cereais.
- source_word: תָּחֹגּוּ
  choice: vocês celebrarão
  rationale: O verbo חגג indica celebrar ou observar uma festa, frequentemente ligada à peregrinação. A formulação é atual e mantém o sentido festivo.
- source_word: חַג יְהוָה
  choice: a festa de Yahweh
  rationale: חַג designa uma celebração festiva, muitas vezes uma festa de peregrinação; a expressão preserva sua relação direta com Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Expressa com clareza a duração da celebração.
- source_word: שַׁבָּתוֹן
  choice: descanso solene
  rationale: O termo indica cessação especial do trabalho associada à observância sagrada, sem necessariamente identificar o dia com o sábado semanal.
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: e no oitavo dia
  rationale: Mantém a distinção explícita entre os sete dias da festa e o oitavo dia, também marcado por descanso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de שַׁבָּתוֹן na legislação festiva
  choice: descanso solene
  alternative: descanso sabático; descanso completo
  rationale: A expressão comunica uma cessação sagrada ligada à festa, mas evita confundi-la automaticamente com o sábado semanal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O plural “vocês” torna explícito o destinatário coletivo indicado pelas formas hebraicas. A repetição de “descanso solene” no final preserva a simetria enfática do original.
