  source_fidelity: 'O sentido central está preservado: a oferta de cereal associada ao cordeiro consiste em dois décimos de efa de farinha fina misturada com azeite, apresentada a Yahweh com aroma agradável, e inclui uma libação de vinho de um quarto de him. Contudo, «oferta derramada» não é o equivalente cultual mais natural e estabelecido para נֶסֶךְ; «oferta de bebida» preserva melhor o termo semântico e o registro ritual.'
  naturalness: «Que o acompanhará» é compreensível, mas é uma expansão repetida e um pouco pesada para os sufixos possessivos hebraicos. «Sua oferta de cereal» e «sua oferta de bebida» são mais diretas, naturais e mantêm a referência contextual ao cordeiro. «Oferta queimada» é a formulação cultual portuguesa mais idiomática para אִשֶּׁה neste contexto.
  terminology: Mantêm-se «oferta de cereal», «efa», «farinha fina», «azeite», «Yahweh», «aroma agradável», «oferta de bebida», «vinho» e «him». «Oferta queimada» traduz o caráter de oferta por fogo de אִשֶּׁה sem adotar a alternativa interpretativa «oferta de alimento».
  issues:
