    issue: «oferta derramada» para וְנִסְכֹּה
    rationale: Embora remeta ao ato de verter, a expressão não é o termo ritual usual em português e pode designar a própria ação em vez da oferta líquida. «Oferta de bebida» é transparente, convencional e corresponde a נֶסֶךְ.
  - severity: low
    issue: Repetição de «que o acompanhará»
    rationale: A expansão explicativa é possível, mas torna a frase menos fluida e acrescenta uma construção que não é necessária para expressar os sufixos possessivos. «Sua» preserva a ligação contextual de modo mais econômico.
  - severity: low
    issue: «oferta preparada no fogo» para אִשֶּׁה
    rationale: A redação pode sugerir apenas o modo de preparo. «Oferta queimada» é mais idiomática no registro bíblico-cultual e comunica de maneira mais direta a apresentação por fogo.
  revised_text: Sua oferta de cereal será de dois décimos de efa de farinha fina misturada com azeite, uma oferta queimada para Yahweh, de aroma agradável; e sua oferta de bebida será de um quarto de him de vinho.
