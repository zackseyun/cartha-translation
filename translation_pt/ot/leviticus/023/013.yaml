source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: pt
  text: Sua oferta de cereal será de dois décimos de efa de farinha fina misturada com azeite, uma oferta queimada para Yahweh, de aroma agradável; e sua oferta de bebida será de um quarto de him de vinho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: A oferta de cereal que o acompanhará
  rationale: No contexto sacrificial, מִנְחָה designa uma oferta de cereal. O sufixo masculino singular retoma o cordeiro mencionado no versículo anterior; a formulação explicita essa relação com naturalidade em português.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dois décimos de efa
  rationale: A expressão significa literalmente “dois décimos”; na legislação sacerdotal, trata-se de décimos de efa. A unidade implícita é explicitada para clareza.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente corrente e claro para o termo cultual que indica farinha refinada usada nas ofertas.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo descreve a farinha combinada com óleo. “Azeite” é natural no contexto bíblico mediterrânico e especifica adequadamente o óleo de oliva pressuposto.
- source_word: אִשֶּׁה לַיהוָה
  choice: oferta preparada no fogo para Yahweh
  rationale: אִשֶּׁה é um termo técnico para uma oferta apresentada por meio do fogo. Esta tradução preserva a referência ao fogo sem adotar a interpretação lexical discutível de “oferta de alimento”.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Expressão sacrificial fixa que retrata a oferta como aceitável a Deus, mantendo a metáfora concreta do aroma.
- source_word: וְנִסְכֹּה
  choice: e a oferta derramada que o acompanhará
  rationale: נֶסֶךְ denota uma oferta líquida vertida. A formulação é transparente em português, e o sufixo é relacionado ao cordeiro mediante “que o acompanhará”.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente lexical direto.
- source_word: רְבִיעִת הַהִין
  choice: um quarto de him
  rationale: Traduz-se a fração e conserva-se a antiga unidade líquida hebraica. A forma portuguesa tradicional da medida é “him”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e segue a decisão doutrinária fornecida, sem substituí-lo por um título.
- issue: Sentido de אִשֶּׁה
  choice: oferta preparada no fogo
  alternative: oferta de alimento; oferta queimada
  rationale: O termo cultual se relaciona à apresentação no fogo, mas sua etimologia e nuance exata são discutidas. A opção escolhida comunica o meio ritual sem sugerir que toda a oferta fosse necessariamente queimada nem resolver o termo como “alimento”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as unidades antigas “efa” e “him” e o nome divino “Yahweh”. A repetição de “que o acompanhará” torna claros os sufixos hebraicos sem produzir uma leitura excessivamente literal.
