id: LEV.23.16
reference: Leviticus 23:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: pt
  text: Contem cinquenta dias[a] até o dia seguinte ao sétimo sábado; então apresentem uma nova oferta de cereais a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o dia seguinte à sétima semana”. O hebraico diz literalmente “o dia seguinte ao sétimo sábado”, e há divergência sobre como essa contagem festiva deve ser expressa em termos de calendário.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מִמָּחֳרַת
  choice: até o dia seguinte
  rationale: Expressa de modo natural em português o limite temporal indicado pela combinação de עַד com מִמָּחֳרַת.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: ao sétimo sábado
  rationale: Preserva o termo hebraico explícito שַׁבָּת e evita substituí-lo no texto principal pela interpretação calendárica «semana».
- source_word: תִּסְפְּרוּ חֲמִשִּׁים יוֹם
  choice: Contem cinquenta dias
  rationale: O imperfeito plural tem força de instrução, e a construção numeral é vertida de forma direta e idiomática.
- source_word: וְהִקְרַבְתֶּם
  choice: então apresentem
  rationale: No contexto sacrificial, o verbo indica levar ou apresentar uma oferta; «então» explicita naturalmente a sequência sem alterar seu sentido.
- source_word: מִנְחָה חֲדָשָׁה
  choice: uma nova oferta de cereal
  rationale: מִנְחָה é o termo levítico para uma oferta feita de produtos vegetais, geralmente cereais; חֲדָשָׁה significa «nova».
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino do texto hebraico e traduz a preposição conforme o contexto de apresentação da oferta.
theological_decisions:
- issue: Forma de traduzir o nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém no texto o nome próprio da aliança representado pelo Tetragrama, sem substituí-lo por um título.
- issue: Sentido calendárico de הַשַּׁבָּת הַשְּׁבִיעִת
  choice: o sétimo sábado
  alternative: a sétima semana
  rationale: O hebraico emprega explicitamente שַׁבָּת. A tradução principal conserva essa forma, enquanto a nota registra a interpretação alternativa sem resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na terceira pessoa do plural, de ampla legibilidade brasileira. «Oferta de cereal» mantém a terminologia cultual de modo compreensível; «sábado» conserva a formulação hebraica e a nota registra a ambiguidade calendárica.
