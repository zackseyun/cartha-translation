  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: pt
  text: Assim, Moisés anunciou os tempos determinados por Yahweh aos filhos de Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas”. O hebraico diz “aos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: anunciou
  rationale: Neste resumo conclusivo, o piel de דבר indica que Moisés comunicou publicamente o calendário sagrado. “Anunciou” é natural em português com objeto direto e conserva melhor essa força do que o simples “falou”.
- source_word: מֹעֲדֵי
  choice: os tempos determinados
  rationale: מוֹעֵד designa tempos ou ocasiões fixados. A expressão abrange todo o calendário sagrado de Levítico 23, inclusive o sábado, e por isso é mais ampla do que “festas”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: aos
  rationale: A preposição assinala diretamente os destinatários do anúncio de Moisés.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a expressão hebraica masculina representativa; “os israelitas” é uma alternativa portuguesa mais idiomática.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto, sem substituí-lo pelo título “SENHOR”.
- issue: Escopo de מֹעֲדֵי
  choice: tempos determinados
  alternative: festas determinadas
  rationale: O capítulo inclui não apenas festas, mas também o sábado; portanto, a formulação mais ampla evita restringir indevidamente o calendário sagrado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para maior naturalidade em português, sem alterar as relações sintáticas do hebraico.
