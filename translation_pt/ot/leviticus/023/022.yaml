revisions:
- from: Quando vocês fizerem a colheita da sua terra, não colham tudo até a extremidade[a] do campo, nem recolham o que ficar espalhado da colheita. Deixem isso para o pobre e para o estrangeiro residente[b]. Eu sou Yahweh, o Deus de vocês.
  to: Quando vocês fizerem a colheita da terra de vocês, não colham a borda[a] do campo por completo, nem recolham os restos da colheita. Deixem-nos para o pobre e para o estrangeiro residente[b]. Eu sou Yahweh, o Deus de vocês.
  rationale: A revisão esclarece que a parcela deixada sem colher é a borda do campo, preservando a força de “por completo”, e amplia “o que ficar espalhado” para “os restos da colheita”, que representa leqeṭ sem restringi-lo. Também ajusta os pronomes e o objeto em “Deixem-nos” para uma retomada gramaticalmente precisa dos dois elementos deixados.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:56:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite corretamente a estrutura geral da norma: a colheita não deve esgotar a borda do campo, os restos da colheita não devem ser recolhidos, e ambos devem ser deixados ao pobre e ao estrangeiro residente. Contudo, “não colham tudo até a extremidade” pode sugerir que se proíbe colher toda a extensão até a borda, em vez de proibir colher a própria borda por completo. “O que ficar espalhado” também restringe leqeṭ a material disperso, enquanto o termo abrange os restos recolhíveis da colheita de modo mais amplo.'
  naturalness: O registro é claro e atual. A reformulação proposta torna a primeira proibição mais idiomática e inequívoca em português e substitui uma perífrase um pouco imprecisa por “os restos da colheita”, expressão natural e suficientemente ampla.
  terminology: “Yahweh” reproduz adequadamente o Tetragrama conforme a decisão editorial indicada. “Estrangeiro residente” é uma solução clara para גֵּר, e a nota preserva a alternativa lexical. “Pobre” corresponde bem a עָנִי. A nota sobre פֵּאָה deve acompanhar “borda”, termo principal mais direto neste contexto agrícola.
  issues:
  - severity: medium
    issue: Ambiguidade em “não colham tudo até a extremidade do campo”
    rationale: A formulação pode ser entendida como uma proibição de colher toda a área do campo até sua extremidade. O hebraico proíbe levar a colheita da borda/extremidade do campo até o fim; “não colham a borda do campo por completo” expressa isso mais precisamente.
  - severity: low
    issue: Restrição indevida em “o que ficar espalhado da colheita”
    rationale: לֶקֶט designa os restos que podem ser apanhados após a colheita, não apenas aquilo que esteja espacialmente espalhado. “Os restos da colheita” mantém o alcance sem recorrer a tecnicismo.
