base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: pt
  text: Quando vocês fizerem a colheita da terra de vocês, não colham a borda[a] do campo por completo, nem recolham os restos da colheita. Deixem-nos para o pobre e para o estrangeiro residente[b]. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “extremidade”, “lado” ou “canto”. O termo hebraico pode indicar a borda, o lado ou o canto do campo.
    reason: lexical_alternative
  - marker: b
    text: Ou “forasteiro residente”. O termo hebraico se refere a um não israelita que vivia entre o povo de Israel sob a proteção de suas leis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: Quando vocês fizerem a colheita da sua terra
  rationale: A construção com infinitivo introduz uma circunstância temporal. A formulação é natural em português e mantém o plural do texto hebraico.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ
  choice: não colham tudo até a extremidade do campo
  rationale: O Piel de כלה expressa completar ou levar ao fim, e פאה indica a borda, lado ou canto. A tradução comunica a proibição de colher até o limite do campo sem exigir uma formulação artificial.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: nem recolham o que ficar espalhado da colheita
  rationale: לקט designa os restos dispersos que poderiam ser apanhados depois da colheita principal. Esta expressão é mais imediatamente compreensível que o termo técnico menos corrente “respiga” e evita especificar apenas espigas.
- source_word: לֶעָנִי
  choice: para o pobre
  rationale: עני indica a pessoa pobre, necessitada ou economicamente vulnerável; “o pobre” é direto e preserva o singular hebraico.
- source_word: וְלַגֵּר
  choice: para o estrangeiro residente
  rationale: גר é o não israelita que vive de modo estável entre Israel e está abrangido pelas proteções sociais da lei; “estrangeiro residente” explicita essa condição sem reduzi-lo a um visitante.
- source_word: תַּעֲזֹב אֹתָם
  choice: Deixem isso
  rationale: עזב significa aqui deixar para que outros recolham. “Isso” retoma coletivamente tanto a parte não colhida como os restos espalhados.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Eu sou Yahweh, o Deus de vocês
  rationale: A tradução preserva o nome divino expresso pelo Tetragrama e o plural do sufixo em “Deus de vocês”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o nome da aliança. “Yahweh” o representa como nome próprio, sem substituí-lo por um título.
- issue: Sentido social e jurídico de גֵּר
  choice: estrangeiro residente
  alternative: forasteiro; peregrino; estrangeiro
  rationale: A escolha preserva tanto a origem estrangeira como a residência entre Israel, sem tratar a pessoa apenas como visitante ou viajante.
- issue: Alternância entre plural e singular na instrução hebraica
  choice: plural ao longo da ordem em português
  alternative: reproduzir literalmente a mudança de “vocês” para “você” e depois novamente para “vocês”
  rationale: A alternância hebraica dirige a lei à comunidade e, no núcleo, ao agricultor representativo. Uniformizar no plural produz português natural sem mudar o alcance comunitário ou individual da obrigação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para representar o plural comunitário e evita vocabulário agrícola excessivamente técnico. Os marcadores [a] e [b] estão posicionados junto aos termos que explicam.
