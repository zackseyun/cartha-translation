  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo wayyiqtol de דבר dá sequência à narrativa e introduz a fala divina. “Falou” reproduz naturalmente a fórmula em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; “a” é a forma idiomática na construção “falar a alguém”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula, o infinitivo introduz o conteúdo da fala que vem a seguir. Em português atual, os dois-pontos exprimem essa função com mais naturalidade do que o literal “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título tradicional, sem afirmar como absolutamente certa a vocalização antiga.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira. A fórmula hebraica foi vertida de modo natural: a conjunção narrativa foi preservada por “E”, enquanto לֵאמֹר foi representado pelos dois-pontos, pois a fala começa no versículo seguinte.'
