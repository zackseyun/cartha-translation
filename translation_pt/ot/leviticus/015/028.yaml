id: LEV.15.28
reference: Leviticus 15:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: pt
  text: Mas, se ela ficar limpa do seu corrimento[a], contará para si sete dias; depois disso, estará limpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficar purificada do seu corrimento [...] depois disso, será purificada”. O hebraico emprega a mesma raiz nas duas orações: primeiro para a cessação do corrimento e depois para o estado ritual resultante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o estado descrito anteriormente; “Mas, se” expressa com naturalidade a força contextual da conjunção seguida da partícula condicional.
- source_word: טָהֲרָה
  choice: ela ficar limpa
  rationale: O qal perfeito de טהר indica aqui a passagem para uma condição em que o corrimento cessou. “Ficar limpa” conserva o vínculo lexical com a declaração final, sem sugerir limpeza moral.
- source_word: מִזּוֹבָהּ
  choice: do seu corrimento
  rationale: זוֹב designa, neste contexto legal, um corrimento corporal anormal. “Corrimento” é claro e corrente em português; a preposição “de” expressa o afastamento dessa condição.
- source_word: וְסָפְרָה לָּהּ
  choice: contará para si
  rationale: Mantém a progressão da instrução e representa o dativo לָהּ, indicando que a contagem do período diz respeito à própria mulher.
- source_word: שִׁבְעַת יָמִים
  choice: sete dias
  rationale: Tradução direta da construção numeral.
- source_word: וְאַחַר
  choice: depois disso
  rationale: Marca de modo natural a etapa seguinte ao período contado, sem acrescentar conteúdo.
- source_word: תִּטְהָר
  choice: estará limpa
  rationale: Expressa o estado ritual alcançado depois dos sete dias e conserva a repetição da raiz טהר presente no hebraico.
theological_decisions:
- issue: Terminologia de pureza ritual
  choice: Traduzir טהר por “ficar/estar limpa” em sentido ritual.
  alternative: “ser purificada” ou “ficar pura”
  rationale: Levítico 15 trata de condição ritual associada a corrimentos corporais, não de culpa moral. A formulação escolhida preserva essa categoria e a repetição lexical do hebraico sem introduzir condenação ética.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura legal permanece concisa; “corrimento” é o termo corporal explícito adequado ao contexto, e “limpa” deve ser entendido como condição ritual.
