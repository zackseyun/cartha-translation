base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: pt
  text: Toda cama em que o homem com o corrimento se deitar ficará impura, e todo objeto[a] em que ele se sentar ficará impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo utensílio em que ele se sentar”. A palavra hebraica pode designar de modo amplo um objeto, utensílio, artigo ou recipiente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: cama
  rationale: מִשְׁכָּב designa um lugar em que alguém se deita; “cama” é a equivalência mais natural neste contexto, sem excluir o sentido funcional do termo.
- source_word: הַזָּב
  choice: o homem com o corrimento
  rationale: O particípio substantivado masculino זָב refere-se, neste contexto, ao homem que apresenta um corrimento corporal; a formulação mantém explícitos tanto o sexo do referente quanto sua condição.
- source_word: יִשְׁכַּב עָלָיו
  choice: em que ... se deitar
  rationale: A locução expressa deitar-se sobre algo. O futuro do subjuntivo é natural em português para uma condição genérica dentro de legislação.
- source_word: יִטְמָא
  choice: ficará impuro/impura
  rationale: O verbo declara a condição de impureza resultante do contato. “Ficará” comunica naturalmente a consequência jurídica-ritual sem acrescentar culpa moral.
- source_word: הַכְּלִי
  choice: objeto
  rationale: כְּלִי é um termo amplo para objeto, utensílio, artigo ou recipiente. Como aqui se trata de algo sobre o qual alguém pode sentar-se, “objeto” evita o sentido indevidamente restrito que “vasilha” teria em português.
- source_word: יֵשֵׁב עָלָיו
  choice: em que ele se sentar
  rationale: ישׁב com עַל significa sentar-se sobre algo; a construção escolhida é idiomática e preserva o caráter genérico da disposição legal.
theological_decisions:
- issue: Natureza da linguagem de impureza
  choice: impuro/impura
  alternative: ritualmente impuro/impura; contaminado/contaminada
  rationale: O contexto trata do estado de impureza levítica, não necessariamente de culpa moral. “Impuro” traduz diretamente a categoria do texto, enquanto “ritualmente” acrescentaria uma explicação ausente do hebraico e “contaminado” poderia sugerir outros sentidos.
- issue: Representação do sexo do sujeito
  choice: “o homem com o corrimento” e “ele”
  alternative: “a pessoa com o corrimento”
  rationale: As formas hebraicas são masculinas singulares, e o contexto imediato trata de um corrimento masculino. A tradução conserva essa referência em vez de neutralizá-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Emprega “corrimento” como termo corporal corrente e “objeto” para preservar a amplitude semântica de כְּלִי. A concordância de “impura/impuro” segue os substantivos portugueses.
