    rationale: O hebraico ערב, nesta fórmula levítica, refere-se ao entardecer ou anoitecer. Em português contemporâneo, “a tarde” pode terminar antes desse marco; “até o anoitecer” comunica melhor o limite temporal sem acrescentar interpretação.
