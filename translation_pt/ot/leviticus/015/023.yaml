  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: pt
  text: E, se estiver sobre a cama ou sobre o objeto em que ela se senta[a], quando ele tocar nisso, ficará impuro até o anoitecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “utensílio” ou “recipiente” em vez de “objeto”. O termo hebraico כְּלִי pode designar genericamente um artigo, utensílio ou recipiente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva tanto a ligação com a legislação precedente quanto a condição, em português natural.
- source_word: עַל הַמִּשְׁכָּב
  choice: sobre a cama
  rationale: מִשְׁכָּב designa aqui uma cama ou lugar de deitar; “cama” é claro e adequado ao contexto.
- source_word: הוּא
  choice: estiver
  rationale: O pronome masculino retoma algo implícito no contexto. Em português, a construção impessoal evita introduzir um referente mais específico do que o hebraico explicita neste versículo.
- source_word: עַל הַכְּלִי
  choice: sobre o objeto
  rationale: כְּלִי é um termo amplo para objeto, utensílio, recipiente ou artigo; “objeto” conserva melhor essa amplitude no contexto.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: em que ela se senta
  rationale: Reproduz naturalmente a oração relativa e o valor durativo ou habitual do particípio hebraico.
- source_word: בְּנָגְעוֹ בוֹ
  choice: quando ele tocar nisso
  rationale: A preposição ב com o infinitivo construto exprime circunstância temporal. “Ele” preserva a forma masculina singular, enquanto “nisso” retoma sem rigidez o local ou objeto mencionado.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: O imperfeito exprime o resultado jurídico-ritual do contato; “ficará impuro” é corrente e não sugere necessariamente culpa moral.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Mantém a fórmula levítica de duração da impureza e reproduz o substantivo hebraico com artigo.
theological_decisions:
- issue: Natureza de טָמֵא na legislação de pureza levítica
  choice: impureza ritual, expressa simplesmente como “impuro”
  alternative: “ritualmente impuro” ou “cerimonialmente impuro”
  rationale: O contexto trata de condição ritual, não necessariamente de culpa moral. Acrescentar um qualificador explicativo tornaria explícito algo que o hebraico deixa ao contexto.
- issue: Referente de הוּא e בוֹ
  choice: manter o referente relativamente aberto por meio de “estiver” e “nisso”
  alternative: explicitar “o fluxo”, “a mancha” ou limitar o toque ao objeto
  rationale: A construção hebraica é difícil e depende do contexto anterior. A tradução não deve resolver silenciosamente se o referente é a impureza, o fluxo, a mancha ou o objeto sobre o qual ela está.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Ficará impuro” soa mais natural do que uma formulação jurídica arcaizante e preserva o sentido ritual. A repetição de “sobre” acompanha a estrutura do hebraico sem tornar a frase excessivamente literal.
