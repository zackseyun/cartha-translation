source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֔עַ בְּ/כָל כְּלִ֖י אֲשֶׁר תֵּשֵׁ֣ב עָלָ֑י/ו יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: pt
  text: E todo aquele que tocar em qualquer objeto sobre o qual ela se sentar deverá lavar as suas roupas, banhar-se em água e ficará impuro até o anoitecer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: E todo aquele que tocar
  rationale: A construção com כָל e o particípio substantivado abrange genericamente qualquer pessoa; a forma portuguesa é natural e preserva o alcance universal.
- source_word: בְּכָל כְּלִי
  choice: em qualquer objeto
  rationale: כְּלִי é um termo amplo para objeto, utensílio, recipiente ou artigo. “Objeto” evita restringir indevidamente o referente neste contexto.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: sobre o qual ela se sentar
  rationale: A oração modifica כְּלִי, e o sujeito feminino remete à mulher mencionada no contexto anterior.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: deverá lavar as suas roupas
  rationale: O verbo com בְּגָדִים indica lavar as roupas; “deverá” comunica com clareza a força normativa da instrução.
- source_word: וְרָחַץ בַּמַּיִם
  choice: banhar-se em água
  rationale: Na legislação de pureza, רָחַץ indica a lavagem do corpo; “banhar-se” torna isso explícito sem acrescentar conteúdo.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: e ficará impuro até o anoitecer
  rationale: A expressão descreve o estado ritual resultante e sua duração. “Até o anoitecer” é corrente e corresponde ao limite temporal hebraico.
theological_decisions:
- issue: Natureza da impureza na legislação levítica
  choice: Traduzir טָמֵא por “impuro”, preservando a categoria ritual.
  alternative: “contaminado” ou “imundo”
  rationale: O texto trata de impureza ritual decorrente do contato, não atribui culpa moral. “Impuro” comunica a categoria cultual sem sugerir pecado pessoal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o caráter jurídico da passagem sem recorrer a linguagem excessivamente arcaica.
