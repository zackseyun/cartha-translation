  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: pt
  text: 'E esta será a sua impureza quanto ao seu corrimento: quando o seu corpo deixa correr o corrimento ou quando fica obstruído quanto ao corrimento, essa é a sua impureza.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: a sua impureza
  rationale: No contexto das leis levíticas, o termo designa impureza ritual, não culpa moral. “Impureza” é claro e corrente em português.
- source_word: זוֹב
  choice: corrimento
  rationale: Neste contexto, refere-se a uma secreção genital anormal. “Corrimento” é clínico, compreensível e adequado ao referente corporal.
- source_word: רָר
  choice: deixe correr
  rationale: Expressa a emissão ativa do corrimento e mantém o contraste com a condição obstruída.
- source_word: בְּשָׂרוֹ
  choice: seu órgão
  rationale: Embora בשר signifique literalmente “carne”, aqui, em conexão com uma secreção genital masculina, funciona como referência discreta ao órgão corporal envolvido. A nota preserva a forma literal.
- source_word: הֶחְתִּים
  choice: fique obstruído
  rationale: O verbo indica fechamento ou bloqueio, em contraste com o livre escoamento do corrimento.
- source_word: מִזּוֹבוֹ
  choice: pelo corrimento
  rationale: A construção hebraica é difícil e admite mais de uma relação semântica. Em português, “pelo corrimento” comunica naturalmente que o órgão está obstruído em relação ou em consequência dele, sem detalhar além do texto.
- source_word: וְזֹאת תִּהְיֶה
  choice: E esta será
  rationale: Preserva a conjunção e o tom formular e jurídico do hebraico.
- source_word: אוֹ
  choice: quer ... quer
  rationale: Apresenta com clareza as duas condições alternativas às quais se aplica a mesma classificação ritual.
theological_decisions:
- issue: Natureza da impureza
  choice: “impureza” sem linguagem de culpa ou pecado
  alternative: “contaminação” ou formulação moralizante
  rationale: O versículo define uma condição de impureza ritual dentro da legislação levítica; não declara que a condição corporal seja, em si, culpa moral.
translation_notes:
  register: Português moderno, digno e direto, com terminologia clínica moderada. “Órgão” torna explícito o referente contextual sem empregar uma designação anatômica mais específica do que o hebraico. A repetição de “impureza” preserva a estrutura jurídica e enfática do original.
