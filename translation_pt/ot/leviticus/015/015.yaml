  text: וְ/עָשָׂ֤ה אֹתָ/ם֙ הַ/כֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה מִ/זּוֹבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: pt
  text: 'O sacerdote oferecerá as duas aves: uma como oferta pelo pecado[a] e a outra como holocausto. O sacerdote fará expiação por ele diante de Yahweh, por causa do seu corrimento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חַטָּאת pode designar a oferta usada para remover a impureza ritual, e não somente uma oferta relacionada ao pecado moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: oferecerá as duas aves
  rationale: No contexto sacrificial, עשה significa realizar ritualmente ou oferecer. O referente de אֹתָם são as duas aves mencionadas no versículo anterior; explicitá-lo evita em português um pronome ambíguo.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כהן na legislação cultual.
- source_word: אֶחָד חַטָּאת
  choice: uma como oferta pelo pecado
  rationale: Mantém a designação tradicional e reconhecível de חטאת, enquanto a nota registra o sentido técnico possível de oferta de purificação neste contexto de impureza ritual.
- source_word: וְהָאֶחָד עֹלָה
  choice: e a outra como holocausto
  rationale: עֹלָה designa a oferta inteiramente queimada; 'holocausto' é o termo bíblico português consagrado e compreensível.
- source_word: וְכִפֶּר עָלָיו
  choice: fará expiação por ele
  rationale: Preserva a força cultual de כפר sem definir de modo indevido o mecanismo da expiação.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Tradução natural da expressão de presença cultual, mantendo o nome divino segundo o padrão do projeto.
- source_word: מִזּוֹבוֹ
  choice: por causa do seu corrimento
  rationale: מן indica aqui a condição em razão da qual se requer expiação; 'corrimento' corresponde ao vocabulário médico-ritual do contexto.
theological_decisions:
- issue: Sentido de חַטָּאת em contexto de pureza ritual
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: A expressão tradicional continua semanticamente possível, mas חטאת neste contexto não implica necessariamente uma transgressão moral; a alternativa técnica é preservada em nota para não apagar essa nuance.
- issue: Tradução de כפר
  choice: fará expiação
  alternative: fará purificação ritual / fará propiciação
  rationale: '''Fará expiação'' conserva a amplitude teológica e cultual do verbo, sem restringi-lo a uma teoria específica nem reduzir seu sentido apenas à purificação.'
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe levemente explicitada para esclarecer que o pronome hebraico se refere às duas aves do versículo anterior. Mantêm-se 'holocausto', 'expiação' e 'Yahweh' como termos cultuais do projeto.
