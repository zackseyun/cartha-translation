base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: pt
  text: Toda peça de roupa e todo artigo de couro em que houver uma emissão de sêmen deverão ser lavados com água e ficarão impuros até o entardecer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda pele”. O termo pode referir-se a uma pele de animal ou a um objeto feito de couro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: peça de roupa
  rationale: O termo designa de modo amplo uma veste ou artigo de vestuário. “Peça de roupa” é claro e natural em português moderno.
- source_word: עוֹר
  choice: couro
  rationale: Neste contexto, o termo provavelmente se refere a uma pele de animal ou a um objeto feito dela. “Couro” comunica naturalmente esse sentido contextual; a nota preserva a possibilidade mais literal.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: sobre os quais houver
  rationale: Preserva o sentido locativo da construção hebraica e concorda naturalmente com os dois antecedentes em português.
- source_word: שִׁכְבַת זָרַע
  choice: uma emissão de sêmen
  rationale: O idiomatismo se refere ao sêmen emitido. A formulação é explícita, exata e adequada ao contexto das leis de pureza.
- source_word: וְכֻבַּס בַּמַּיִם
  choice: deverão ser lavados com água
  rationale: Expressa a instrução legal passiva com naturalidade e mantém a água como meio da lavagem.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: e ficarão impuros até a tarde
  rationale: “Ficarão impuros” indica o estado ritual continuado dos objetos até o limite temporal especificado, sem sugerir culpa moral.
theological_decisions:
- issue: Natureza da impureza na lei levítica
  choice: Traduzir טָמֵא por “impuros” em sentido ritual, sem acrescentar a ideia de culpa moral.
  alternative: “contaminados” ou “imundos”
  rationale: Em Levítico 15, o termo descreve uma condição de impureza ritual. “Impuros” preserva essa categoria com clareza e sem expansão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A redação mantém o caráter jurídico da instrução sem arcaísmos.
