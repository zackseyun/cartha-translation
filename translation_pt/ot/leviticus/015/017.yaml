revisions:
- from: Toda peça de roupa e todo couro sobre os quais houver uma emissão de sêmen deverão ser lavados com água e ficarão impuros até a tarde.[a]
  to: Toda peça de roupa e todo artigo de couro em que houver uma emissão de sêmen deverão ser lavados com água e ficarão impuros até o entardecer.[a]
  rationale: A revisão substitui o limite temporal impreciso “até a tarde” por “até o entardecer”, correspondente a עַד הָעָרֶב. Também torna “couro” explicitamente um artigo/objeto, como pede o contexto, e simplifica a oração relativa sem alterar o sentido locativo. A nota preserva a alternativa literal “pele”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:51Z'
review_pass:
  verdict: revise
  source_fidelity: A redação transmite corretamente a instrução de lavagem e a condição de impureza ritual. Contudo, “até a tarde” é temporalmente menos preciso que o hebraico עַד הָעָרֶב, que indica o entardecer/noite; “até o entardecer” preserva melhor o limite temporal. “Todo couro” também soa como referência a material, não a um item, e pode ser esclarecido como “todo artigo de couro”, com nota para a leitura literal.
  naturalness: A frase é clara, mas “todo couro sobre os quais” é pouco idiomático, pois “couro” tende a designar a matéria. “Em que houver” evita a construção relativa marcada e soa mais natural. “Até o entardecer” é natural e mais exato que “até a tarde” neste contexto.
  terminology: “Peça de roupa”, “emissão de sêmen”, “lavados com água” e “impuros” são escolhas adequadas. “Impuros” mantém corretamente a categoria ritual sem sugerir culpa moral. “Artigo de couro” torna explícito que se trata de um objeto feito de pele/couro, sem eliminar a alternativa literal na nota.
  issues:
  - severity: medium
    issue: “até a tarde” para עַד הָעָרֶב
    rationale: O hebraico se refere ao entardecer/evening. “Tarde” pode denotar um período anterior ao anoitecer e, portanto, é menos preciso.
  - severity: low
    issue: “todo couro sobre os quais”
    rationale: Embora compreensível, “couro” normalmente designa material em português, e a relativa plural é pesada. “Todo artigo de couro em que houver” expressa com maior naturalidade o objeto pressuposto pelo contexto.
  revised_text: Toda peça de roupa e todo artigo de couro em que houver uma emissão de sêmen deverão ser lavados com água e ficarão impuros até o entardecer.[a]
