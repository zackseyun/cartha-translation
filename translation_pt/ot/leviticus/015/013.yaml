  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: pt
  text: Quando o homem que tem o corrimento ficar livre dele, contará sete dias para a sua purificação, lavará as suas roupas e banhará o corpo em água corrente; então ficará puro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזָּב
  choice: o homem que tem o corrimento
  rationale: O particípio substantivado designa o homem acometido pelo corrimento corporal descrito no capítulo; a formulação é clara, natural e preserva a referência masculina do contexto.
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: ficar livre dele
  rationale: No contexto, a expressão indica que o corrimento cessou, dando início ao procedimento ritual. Esta formulação evita sugerir que o homem já alcançou a pureza ritual completa antes dos sete dias e das lavagens.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: contará sete dias
  rationale: Reproduz com concisão a sequência prescritiva do hebraico em registro jurídico atual.
- source_word: לְטָהֳרָתוֹ
  choice: para a sua purificação
  rationale: Expressa o processo de restauração da pureza ritual, sem confundi-lo com higiene comum ou perdão moral.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lavará as suas roupas
  rationale: Equivalente moderno e direto para a lavagem das vestes.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: banhará o corpo
  rationale: בשר significa literalmente 'carne', mas aqui se refere ao corpo submetido à lavagem ritual; 'banhará o corpo' é natural e distingue essa ação da lavagem das roupas.
- source_word: בְּמַיִם חַיִּים
  choice: em água corrente
  rationale: A expressão literal 'águas vivas' designa água natural em movimento ou proveniente de fonte. 'Água corrente' comunica o sentido contextual sem introduzir associações teológicas posteriores.
- source_word: וְטָהֵר
  choice: então ficará puro
  rationale: Indica o resultado ritual ao fim da sequência; 'então' torna explícita a progressão já presente no hebraico.
theological_decisions:
- issue: Terminologia de pureza ritual sem conotação automática de culpa moral
  choice: purificação / puro
  alternative: limpeza / limpo
  rationale: O versículo trata do estado cultual decorrente de uma condição corporal, não declara culpa ou pecado pessoal. 'Purificação' e 'puro' preservam essa categoria ritual em português.
- issue: Relação entre a cessação do corrimento e a pureza final
  choice: distinguir 'ficar livre do corrimento' de 'ficar puro'
  alternative: traduzir יִטְהַר e וְטָהֵר pelo mesmo verbo 'purificar-se'
  rationale: 'A distinção deixa clara a sequência textual: primeiro cessa o corrimento; depois vêm a contagem e as lavagens; por fim, o homem fica ritualmente puro.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega futuro prescritivo para acompanhar o registro legal do texto, sem arcaísmos. Não há marcadores de nota porque nenhuma nota é necessária para esta redação.
