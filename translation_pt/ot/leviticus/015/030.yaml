base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: pt
  text: Então o sacerdote oferecerá uma como oferta pelo pecado[a] e a outra como holocausto; e o sacerdote fará expiação por ela diante de Yahweh, por causa de seu corrimento impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”; o termo hebraico também pode destacar a função purificadora desse sacrifício no ritual levítico.
    reason: Alternativa lexical para חַטָּאת, cuja designação sacrificial pode ser traduzida segundo a associação com o pecado ou segundo sua função purificadora.
lexical_decisions:
- source_word: וְעָשָׂה
  choice: oferecerá
  rationale: Embora o verbo signifique em sentido amplo “fazer”, o contexto sacrificial e os complementos que nomeiam as ofertas tornam “oferecerá” a expressão natural e precisa em português.
- source_word: הָאֶחָד ... חַטָּאת
  choice: uma das aves como oferta pelo pecado
  rationale: O contexto anterior identifica duas aves; explicitar “aves” evita uma formulação truncada. חַטָּאת designa aqui a categoria sacrificial tradicionalmente chamada “oferta pelo pecado”, sem excluir sua função purificadora.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: e a outra como holocausto
  rationale: A repetição distributiva de הָאֶחָד indica a outra das duas aves. “Holocausto” é a designação portuguesa corrente da oferta inteiramente queimada.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: o sacerdote fará expiação por ela
  rationale: “Fazer expiação” preserva a força ritual e teológica de כפר; “por ela” traduz naturalmente o sufixo feminino em עָלֶיהָ.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” mantém a ideia de presença e cenário cultual, enquanto “Yahweh” representa diretamente o nome divino יהוה.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: por causa do seu fluxo impuro
  rationale: זוֹב é um fluxo ou corrimento corporal, e טֻמְאָה o caracteriza como impuro. A formulação conserva a relação causal expressa por מִן e soa natural em português.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o nome divino pessoal, em consonância com a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido sacrificial de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo identifica uma categoria sacrificial e pode salientar sua função purificadora nos textos levíticos. Mantém-se a expressão tradicional e inteligível no texto, registrando-se a alternativa em nota.
- issue: Natureza da impureza
  choice: fluxo impuro
  alternative: fluxo da sua impureza
  rationale: A impureza é ritual no contexto levítico; a tradução não a redefine como culpa moral. A forma escolhida comunica a construção hebraica em português corrente sem eliminar sua dimensão cultual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Uma das aves” recupera o referente imediato do contexto, enquanto “assim” organiza a consequência ritual sem acrescentar conteúdo teológico. A nota preserva a ambiguidade funcional de חַטָּאת.
