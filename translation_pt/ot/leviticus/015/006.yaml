id: LEV.15.6
reference: Leviticus 15:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: pt
  text: Quem se sentar sobre o objeto[a] em que o homem com o corrimento se sentou lavará suas roupas, se banhará em água e ficará impuro até a tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “utensílio”, “recipiente” ou “artigo”; o termo hebraico é amplo e pode designar diversos tipos de objeto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: Quem se sentar
  rationale: O particípio substantivado com artigo tem sentido genérico, literalmente “e aquele que se senta”. “Quem se sentar” é natural em uma norma legal e preserva esse valor geral.
- source_word: הַכְּלִי
  choice: o objeto
  rationale: כְּלִי pode designar recipiente, utensílio, artigo ou objeto. Como aqui se trata de algo sobre o qual alguém se senta, “objeto” preserva melhor a amplitude do termo sem sugerir necessariamente um recipiente.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: em que ... se sentou
  rationale: A oração relativa identifica o objeto pelo contato anterior. O pretérito é natural em português neste contexto, embora a forma hebraica permita certa flexibilidade contextual.
- source_word: הַזָּב
  choice: o homem com o corrimento
  rationale: O particípio substantivado masculino se refere, nesta seção, ao homem que tem um corrimento corporal. A formulação explicita o referente masculino sem acrescentar diagnóstico não presente no texto.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavará suas roupas
  rationale: כִּבֵּס é o verbo usual para lavar roupas. O futuro do indicativo exprime de modo digno e natural a determinação legal em português.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se banhará em água
  rationale: Em contextos de pureza, רָחַץ indica lavagem corporal. “Banhar-se em água” comunica isso claramente e permanece próximo da expressão hebraica.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: e ficará impuro até a tarde
  rationale: A expressão declara o estado de impureza resultante do contato e seu limite temporal. “Ficará impuro” é claro e não acrescenta culpa moral.
theological_decisions:
- issue: Natureza da impureza
  choice: impuro
  alternative: cerimonialmente impuro; contaminado
  rationale: O contexto trata das normas levíticas de pureza, não necessariamente de culpa moral. “Impuro” traduz o estado de forma direta; “cerimonialmente” explicaria além do texto, e “contaminado” poderia intensificar indevidamente o sentido.
- issue: Referência masculina de הַזָּב
  choice: o homem com o corrimento
  alternative: a pessoa com o corrimento
  rationale: A seção de Levítico 15.2–15 e as formas hebraicas identificam um referente masculino. A tradução mantém essa informação gramatical e contextual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O futuro do indicativo preserva o tom normativo sem recorrer a formulações excessivamente jurídicas. A ordem das ações segue de perto o hebraico.
