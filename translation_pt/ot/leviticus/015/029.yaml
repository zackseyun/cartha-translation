  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: pt
  text: No oitavo dia, ela tomará para si duas rolas ou dois pombinhos e os levará ao sacerdote, à entrada da Tenda do Encontro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “ao sacerdote, para a entrada da Tenda do Encontro”. O hebraico repete a preposição direcional antes de “a entrada”; em português, depois de “ao sacerdote”, ela pode ser expressa de modo mais natural por “à entrada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: No oitavo dia
  rationale: Expressa naturalmente a circunstância temporal; a conjunção ו marca a sequência da instrução legal, mas não exige um “e” inicial em português.
- source_word: תִּקַּח לָהּ
  choice: ela tomará para si
  rationale: O imperfeito hebraico tem valor prescritivo neste contexto legal, e לָהּ acrescenta a nuance benefactiva/reflexiva “para si”.
- source_word: שְׁתֵּי תֹרִים
  choice: duas rolas
  rationale: “Rolas” é a designação portuguesa corrente para as aves indicadas por תֹרִים e preserva a construção numeral do hebraico.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dois pombinhos
  rationale: A expressão construta, literalmente “filhos de pomba”, refere-se a pombos novos; “pombinhos” é a formulação sacrificial tradicional, clara e concisa em português.
- source_word: וְהֵבִיאָה אֹתָם
  choice: e os levará
  rationale: O perfeito com ו continua a prescrição anterior. “Os levará” comunica naturalmente o movimento até o sacerdote e concorda com as duas alternativas de aves.
- source_word: אֶל הַכֹּהֵן
  choice: ao sacerdote
  rationale: O artigo hebraico indica o sacerdote oficiante previsto pelo rito.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da Tenda do Encontro
  rationale: Depois de “ao sacerdote”, o segundo אֶל é expresso de modo locativo e natural por “à entrada”. “Tenda do Encontro” traduz a designação cultual אֹהֶל מוֹעֵד.
