revisions:
- from: Se uma mulher tiver um fluxo de sangue por muitos dias, fora do período da sua impureza menstrual[a], ou se o fluxo continuar além da sua impureza menstrual[b], durante todos os dias do seu fluxo impuro ela ficará impura, como nos dias da sua impureza menstrual.
  to: Se uma mulher tiver um fluxo de sangue por muitos dias, fora do período da sua impureza menstrual[a], ou se tiver um fluxo além do período da sua impureza menstrual[b], durante todos os dias do seu fluxo impuro ela será impura, como nos dias da sua impureza menstrual.
  rationale: A revisão substitui “o fluxo continuar” por uma construção que mantém o verbo hebraico “ter um fluxo” e preserva a ambiguidade contextual de עַל (“além de/sobre”), sem deixar de explicitar na tradução principal a leitura temporal mais natural. Também troca “ficará” por “será” para refletir com maior precisão o estatuto ritual expresso no texto legal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:56Z'
review_pass:
  verdict: revise
  source_fidelity: A primeira condição transmite bem o fluxo de sangue por muitos dias fora do tempo da impureza menstrual. Na segunda, porém, “o fluxo continuar” restringe o hebraico תָזוּב + עַל, que pode indicar um fluxo adicional/sobreposto ou um fluxo que se estende além do período; “tiver um fluxo além...” preserva melhor essa formulação e sua nuance.
  naturalness: O texto é claro e adequado ao registro legal-ritual. “Será impura” exprime mais diretamente o estatuto legal contínuo indicado por תהיה do que “ficará impura”, que pode sugerir sobretudo a passagem para esse estado.
  terminology: “Impureza menstrual” e “impura” mantêm corretamente a terminologia de pureza ritual sem atribuir culpa moral. “Fluxo impuro” é compreensível e reflete a construção hebraica que associa o fluxo à impureza ritual.
