    issue: A expressão “se o fluxo continuar” na segunda alternativa é mais específica que o hebraico.
    rationale: O texto hebraico diz literalmente que ela “tiver um fluxo sobre/além de sua impureza menstrual”. O contexto permite extensão além do período normal, mas também comporta a ideia de um fluxo adicional; a redação deve evitar decidir apenas pela continuidade.
  - severity: low
    issue: “Ficará impura” pode enfatizar uma mudança de estado.
    rationale: 'No enunciado legal, “será impura” representa de modo mais direto o valor normativo de תהיה: ela permanece/em tal situação é ritualmente impura durante todos aqueles dias.'
