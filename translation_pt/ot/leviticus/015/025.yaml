  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: pt
  text: Se uma mulher tiver um fluxo de sangue por muitos dias, fora do período da sua impureza menstrual[a], ou se tiver um fluxo além do período da sua impureza menstrual[b], durante todos os dias do seu fluxo impuro ela será impura, como nos dias da sua impureza menstrual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fora da época da sua menstruação”. O termo hebraico inclui o estado de impureza ritual associado à menstruação, e não apenas o sangramento.
    reason: lexical_alternative
  - marker: b
    text: Ou “se tiver um fluxo além de sua impureza menstrual”, isto é, um fluxo adicional ou que se prolonga além do período menstrual normal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: tiver um fluxo / o fluxo continuar
  rationale: A combinação do verbo e do substantivo da raiz זוּב descreve um fluxo corporal anormal. “Ter um fluxo” é natural em português, e “continuar” explicita, sem exagerar, a extensão indicada no segundo caso.
- source_word: דָּמָהּ
  choice: de sangue
  rationale: Embora o sufixo signifique literalmente “seu sangue”, depois de “fluxo” a formulação idiomática em português é “fluxo de sangue”.
- source_word: יָמִים רַבִּים
  choice: por muitos dias
  rationale: A preposição “por” expressa com clareza a duração indicada pela construção hebraica.
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: fora do período da sua impureza menstrual
  rationale: עֵת indica o tempo ou período, enquanto נִדָּה, neste contexto legal, abrange tanto a menstruação quanto o estado de impureza ritual associado a ela.
- source_word: נִדָּה
  choice: impureza menstrual
  rationale: A expressão conserva a dimensão ritual do termo no contexto de Levítico, sem reduzi-lo ao fenômeno biológico da menstruação.
- source_word: עַל נִדָּתָהּ
  choice: além da sua impureza menstrual
  rationale: Neste contexto, עַל pode indicar que o fluxo se prolonga para além do período menstrual normal; a nota preserva a possibilidade de entendê-lo como algo adicional.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: durante todos os dias do seu fluxo impuro
  rationale: A formulação comunica tanto o fluxo quanto a condição de impureza ritual ligada a ele, em linguagem clara e concisa.
- source_word: טְמֵאָה
  choice: impura
  rationale: “Impura” é o termo corrente para a categoria ritual levítica e, no contexto, não sugere necessariamente culpa moral.
- source_word: כִּימֵי נִדָּתָהּ
  choice: como nos dias da sua impureza menstrual
  rationale: A repetição mantém a correspondência lexical e deixa claro que o estado ritual durante o fluxo anormal é comparado ao dos dias da impureza menstrual.
theological_decisions:
- issue: Expressar a terminologia de pureza ritual sem sugerir culpa moral
  choice: Usar “impura” e “impureza menstrual” como termos de condição ritual
  alternative: Usar apenas “menstruação” ou “período menstrual”, omitindo a referência explícita à impureza
  rationale: O versículo trata da condição cerimonial estabelecida pela legislação levítica, não de uma afirmação de pecado pessoal. A tradução preserva essa categoria cultual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação mantém a linguagem ritual de Levítico, evita conotações de culpa moral e preserva a possível nuance de extensão ou acréscimo em עַל.
