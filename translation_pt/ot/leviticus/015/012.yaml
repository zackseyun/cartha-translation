  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: pt
  text: Todo recipiente de barro que for tocado por aquele que tem o corrimento[a] deverá ser quebrado, e todo recipiente de madeira deverá ser lavado com água.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aquele que tem o corrimento”, termo técnico das leis de pureza para uma pessoa afetada por uma secreção corporal.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “deverá ser enxaguado com água”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: recipiente de barro
  rationale: A combinação designa um objeto ou recipiente feito de material cerâmico. “Recipiente de barro” é natural em português e preserva a distinção material relevante para a lei de pureza.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: em que tocar
  rationale: O verbo נגע no qal significa normalmente “tocar”. A construção portuguesa mantém de modo direto a relação entre a pessoa e o recipiente.
- source_word: הַזָּב
  choice: aquele que tem o corrimento
  rationale: É um termo técnico das leis de pureza para a pessoa afetada por uma secreção corporal. “Corrimento” mantém a terminologia do contexto sem especificar além do que esta expressão diz.
- source_word: יִשָּׁבֵר
  choice: deverá ser quebrado
  rationale: O nifal expressa aqui uma instrução legal passiva. “Deverá ser quebrado” comunica obrigação de maneira clara e atual.
- source_word: כָל כְּלִי עֵץ
  choice: todo recipiente de madeira
  rationale: A expressão refere-se a qualquer objeto ou utensílio feito de madeira; “recipiente” preserva o paralelismo com o objeto de barro sem ampliar desnecessariamente o sentido.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: deverá ser lavado com água
  rationale: שטף indica lavar ou enxaguar por meio de água. “Lavado com água” é idiomático em português e conserva a ação ritual sem impor uma técnica mais específica.
theological_decisions: []
translation_notes:
