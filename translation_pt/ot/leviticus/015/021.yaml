  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: pt
  text: E todo aquele que tocar na cama dela deverá lavar suas roupas e banhar-se em água[a]; ficará impuro até o entardecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no lugar onde ela se deita” ou “na roupa de cama dela”. O termo hebraico se refere ao lugar onde ela se deita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: E todo aquele que tocar
  rationale: A construção generaliza a norma e o particípio de נגע descreve qualquer pessoa que entre em contato; esta formulação preserva o alcance universal em português natural.
- source_word: בְּמִשְׁכָּבָהּ
  choice: na cama dela
  rationale: מִשְׁכָּב designa o lugar onde alguém se deita. “Cama” é a opção concreta e mais clara, enquanto a nota registra a amplitude lexical.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: deverá lavar suas roupas
  rationale: כבס refere-se especificamente à lavagem de tecidos; “deverá” comunica a força normativa da legislação sem arcaísmo.
- source_word: וְרָחַץ בַּמַּיִם
  choice: e banhar-se em água
  rationale: רחץ, neste contexto, indica a lavagem do corpo, distinguindo-a da lavagem das roupas mencionada antes.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: ficará impuro até o entardecer
  rationale: A construção indica o estado ritual resultante e sua duração. “Impuro” expressa a categoria ritual sem sugerir automaticamente culpa moral.
theological_decisions:
- issue: Natureza da impureza
  choice: impuro
  alternative: imundo
  rationale: No contexto de Levítico 15, טמא designa condição ritual. “Impuro” mantém essa categoria e evita que o leitor a confunda necessariamente com sujeira física ou culpa moral.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Deverá” preserva o tom jurídico; “entardecer” traduz o limite temporal de modo natural. O pronome masculino genérico exigido pela sequência hebraica não foi explicitado na última oração, pois “ficará” permanece naturalmente ligado a “todo aquele”.
