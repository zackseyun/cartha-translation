base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: pt
  text: Quem tocar na carne[a] do homem que tem o corrimento deverá lavar suas roupas, banhar-se em água e ficará impuro até a tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no corpo do homem que tem o corrimento”. O hebraico diz literalmente: “na carne daquele que tem o corrimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: Quem tocar
  rationale: O particípio com artigo tem sentido substantivado e genérico, “aquele que toca”. “Quem tocar” expressa com naturalidade a aplicação geral da norma.
- source_word: בִּבְשַׂר
  choice: na carne
  rationale: בָּשָׂר significa literalmente “carne” e, neste contexto, pode designar concretamente o corpo. A escolha preserva a formulação hebraica e sua possível amplitude.
- source_word: הַזָּב
  choice: do homem que tem o corrimento
  rationale: O particípio de זוּב designa aqui o homem que apresenta o corrimento corporal tratado no contexto. “Que tem o corrimento” é claro, atual e mantém o referente masculino singular.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: deverá lavar suas roupas
  rationale: כִּבֵּס refere-se normalmente à lavagem de roupas. “Deverá” comunica a força prescritiva da legislação em português corrente.
- source_word: וְרָחַץ בַּמַּיִם
  choice: banhar-se em água
  rationale: רָחַץ indica aqui a lavagem do corpo. A forma reflexiva “banhar-se” é idiomática e explicita naturalmente o objeto implícito.
- source_word: וְטָמֵא
  choice: e ficará impuro
  rationale: טָמֵא indica estado de impureza ritual. “Ficará impuro” exprime o estado resultante do contato sem sugerir culpa moral.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: A expressão delimita a duração da impureza. “Até a tarde” é natural em português e corresponde ao hebraico com artigo.
theological_decisions:
- issue: Natureza da linguagem de impureza
  choice: Traduzir טָמֵא como “impuro”, em sentido ritual, sem acrescentar linguagem de culpa moral.
  alternative: “Imundo” ou “contaminado”.
  rationale: Levítico 15 trata do estado ritual no sistema de pureza de Israel. “Impuro” é claro no português moderno e evita sugerir que o contato seja, por si só, pecado moral.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção legal é prescritiva sem soar arcaica; “corrimento” mantém a terminologia do contexto imediato.
