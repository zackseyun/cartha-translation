id: LEV.15.16
reference: Leviticus 15:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: pt
  text: Se um homem tiver uma emissão de sêmen[a], lavará todo o seu corpo com água e ficará impuro até o entardecer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma descarga seminal”; mais literalmente, “uma emissão de semente”.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “impuro” se refere à impureza ritual segundo as leis de pureza de Levítico, não necessariamente à culpa moral.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: O referente é especificamente masculino, pois a lei trata de uma emissão seminal.
- source_word: כִּי
  choice: se
  rationale: Neste contexto de legislação casuística, introduz a situação condicional.
- source_word: תֵצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: tiver uma emissão de sêmen
  rationale: Expressa em português natural a descarga seminal indicada pela formulação hebraica, literalmente algo como 'sair dele uma emissão de semente'.
- source_word: וְרָחַץ בַּמַּיִם
  choice: lavará ... com água
  rationale: O perfeito com waw na sequência legal expressa a ação exigida; 'com água' é idiomático em português.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: todo o seu corpo
  rationale: Embora בָּשָׂר signifique literalmente 'carne', neste contexto a expressão designa o corpo inteiro.
- source_word: וְטָמֵא
  choice: e ficará impuro
  rationale: Indica o estado de impureza decorrente da emissão; a nota esclarece seu caráter ritual sem acrescentar culpa moral.
- source_word: עַד הָעָרֶב
  choice: até o entardecer
  rationale: Reproduz com naturalidade o limite temporal hebraico.
theological_decisions:
- issue: Natureza de טָמֵא na legislação de pureza
  choice: impuro, entendido no contexto como ritualmente impuro
  alternative: moralmente impuro; cerimonialmente contaminado
  rationale: O contexto trata das leis levíticas de pureza corporal. O texto principal preserva o termo conciso 'impuro', e a nota evita que ele seja indevidamente interpretado como declaração de culpa moral.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação jurídica é mantida sem rigidez excessiva; 'todo o seu corpo' comunica naturalmente o sentido contextual de 'toda a sua carne'.
