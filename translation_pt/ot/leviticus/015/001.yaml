  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: pt
  text: 'Então Yahweh[a] falou a Moisés e a Arão:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol de דבר faz avançar a narrativa. “Então ... falou” expressa a sequência de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A preposição אֶל indica os destinatários. Em português, a repetição antes do segundo nome não é necessária e sua omissão produz uma formulação mais natural sem alterar o sentido.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz a fala direta que começa no versículo seguinte; os dois-pontos cumprem essa função de maneira idiomática e concisa em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título; “Jeová” representa uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa foi preservada, e a fórmula introdutória לֵאמֹר foi vertida idiomaticamente por dois-pontos.
