  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗/הּ וּ/תְהִ֤י נִדָּתָ/הּ֙ עָלָ֔י/ו וְ/טָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְ/כָל הַ/מִּשְׁכָּ֛ב אֲשֶׁר יִשְׁכַּ֥ב עָלָ֖י/ו יִטְמָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: pt
  text: Se um homem tiver relações sexuais com ela[a], e a impureza menstrual dela passar para ele, ele ficará impuro durante sete dias; e toda cama em que ele se deitar ficará impura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “se um homem de fato se deitar com ela”, expressão que aqui se refere à relação sexual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב אִישׁ אֹתָהּ
  choice: um homem tiver relações sexuais com ela
  rationale: A construção hebraica emprega o idioma «deitar-se com» em referência clara à relação sexual. Em português atual, a formulação explícita comunica naturalmente o sentido; a nota preserva a forma mais literal e a intensificação do infinitivo absoluto.
- source_word: נִדָּתָהּ
  choice: a impureza menstrual dela
  rationale: No contexto das leis de pureza de Levítico, נִדָּה designa a condição de impureza ritual associada à menstruação, e não culpa moral.
- source_word: וּתְהִי ... עָלָיו
  choice: passar para ele
  rationale: A expressão é literalmente «estar/vir sobre ele». Aqui ela indica que o homem passa a compartilhar a condição de impureza; «passar para ele» torna essa relação clara sem atribuir culpa moral.
- source_word: וְטָמֵא
  choice: ele ficará impuro
  rationale: Depois da condição inicial, a forma verbal declara o estado resultante. «Ficará impuro» é natural em português e adequado ao contexto jurídico-ritual.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Tradução direta, com a preposição exigida naturalmente em português para indicar duração.
- source_word: הַמִּשְׁכָּב
  choice: cama
  rationale: O substantivo denota um lugar onde alguém se deita; «cama» é a opção comum e adequada neste contexto.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: em que ele se deitar
  rationale: Reproduz com clareza a oração relativa hebraica e mantém a referência ao ato de deitar-se sobre a cama.
- source_word: יִטְמָא
  choice: ficará impura
  rationale: O imperfeito expressa a consequência jurídica da condição descrita. A concordância feminina corresponde a «cama».
theological_decisions:
- issue: Linguagem de impureza ritual sem implicar culpa moral
  choice: Traduzir טמא por «impuro» e נִדָּה por «impureza menstrual»
  alternative: Empregar «contaminado», «profanado» ou linguagem que sugira pecado moral
  rationale: O versículo trata do estado de pureza ritual. A tradução mantém essa categoria sem afirmar culpa pessoal ou degradação moral.
- issue: Sentido de וּתְהִי נִדָּתָהּ עָלָיו
  choice: «a impureza menstrual dela passar para ele»
  alternative: «a menstruação dela vier sobre ele» ou «a impureza menstrual dela estiver sobre ele»
  rationale: A formulação escolhida comunica o estado ritual compartilhado pelo homem, preservando a imagem relacional do hebraico sem tornar a frase obscura ou biologicamente enganosa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita juridiquês excessivo, conserva a terminologia ritual de Levítico e explicita com discrição o idioma sexual hebraico.
