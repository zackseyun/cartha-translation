source:
  edition: WLC
  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: pt
  text: Quando uma mulher tiver um fluxo, e o fluxo em seu corpo for sangue, ela estará em estado de impureza menstrual durante sete dias[a]; todo aquele que tocar nela ficará impuro até o entardecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Impureza menstrual” refere-se a uma condição de impureza ritual segundo a lei levítica, não necessariamente a culpa ou pecado moral.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: tiver um fluxo / o fluxo
  rationale: O verbo זוּב descreve um fluxo ou corrimento corporal. “Fluxo” é natural em português no contexto da menstruação e mantém a ligação lexical entre as duas ocorrências.
- source_word: דָּם
  choice: sangue
  rationale: Equivalente direto e inequívoco no contexto.
- source_word: בִּבְשָׂרָהּ
  choice: em seu corpo
  rationale: Embora בשר possa significar literalmente “carne”, aqui designa o corpo da mulher; “em seu corpo” conserva a preposição hebraica e evita uma formulação pouco natural.
- source_word: שִׁבְעַת יָמִים
  choice: sete dias
  rationale: Tradução direta da expressão numérica.
- source_word: בְנִדָּתָהּ
  choice: em sua impureza menstrual
  rationale: No contexto das leis levíticas, נִדָּה indica o estado de impureza ritual associado à menstruação, não apenas o fenômeno biológico.
- source_word: וְכָל הַנֹּגֵעַ בָּהּ
  choice: todo aquele que tocar nela
  rationale: Expressa naturalmente o sujeito geral indicado por כל com o particípio e preserva o contato direto indicado pelo hebraico.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: Comunica o estado ritual resultante do contato sem sugerir culpa moral.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Forma corrente e digna em português para o limite temporal indicado pelo hebraico, isto é, até o entardecer.
theological_decisions:
- issue: Terminologia da impureza ritual sem associação automática com culpa moral
  choice: “impureza menstrual” e “ficará impuro” como termos de condição ritual
  alternative: “menstruação” e “ficará contaminado”
  rationale: Levítico 15 regulamenta estados de pureza ritual. A tradução preserva essa categoria legal e cultual sem afirmar que a mulher ou quem a toca cometeu pecado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem da frase acompanha de perto o hebraico sem sacrificar a naturalidade. O marcador [a] aparece imediatamente após o termo que requer esclarecimento.
