revisions:
- from: Quando uma mulher tiver um fluxo, e o fluxo em seu corpo for sangue, ela permanecerá sete dias em sua impureza menstrual[a]; todo aquele que tocar nela ficará impuro até a tarde.
  to: Quando uma mulher tiver um fluxo, e o fluxo em seu corpo for sangue, ela estará em estado de impureza menstrual durante sete dias[a]; todo aquele que tocar nela ficará impuro até o entardecer.
  rationale: A revisão preserva a estrutura e os referentes do hebraico, inclusive a repetição de “fluxo”, mas substitui “até a tarde” por “até o entardecer”, equivalente mais exato de הָעָרֶב. Também ajusta a expressão da condição ritual para uma formulação portuguesa mais natural, sem alterar o sentido nem introduzir avaliação moral.
