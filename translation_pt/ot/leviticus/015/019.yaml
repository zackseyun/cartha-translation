review_pass:
  verdict: revise
  source_fidelity: A tradução identifica corretamente o fluxo como sangue, o período de sete dias, a condição de impureza ritual e a impureza de quem toca a mulher. Contudo, “até a tarde” pode indicar a tarde diurna, enquanto עַד הָעָרֶב significa “até o entardecer/noite”; a correção é necessária.
  naturalness: O texto é claro e de registro apropriado. “Ela estará em estado de impureza menstrual” soa mais natural em português do que “ela permanecerá ... em sua impureza menstrual”, preservando o sentido legal do hebraico.
  terminology: “Fluxo”, “impureza menstrual” e “ficará impuro” são escolhas adequadas para a terminologia ritual, sem implicar culpa moral. “Entardecer” é o equivalente temporal mais preciso de הָעָרֶב neste contexto.
  issues:
  - severity: medium
    issue: “Até a tarde” para עַד הָעָרֶב
    rationale: Em português, “a tarde” normalmente designa o período após o meio-dia, não o início da noite. O hebraico refere-se ao entardecer, limite ritual recorrente na legislação levítica.
  - severity: low
    issue: “Permanecerá ... em sua impureza menstrual”
    rationale: A formulação é compreensível, mas o hebraico afirma que ela estará nessa condição por sete dias. “Estará em estado de impureza menstrual” é mais idiomático e mantém o valor jurídico-ritual.
  revised_text: Quando uma mulher tiver um fluxo, e o fluxo em seu corpo for sangue, ela estará em estado de impureza menstrual durante sete dias[a]; todo aquele que tocar nela ficará impuro até o entardecer.
  revised_footnotes:
