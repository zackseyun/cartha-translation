review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a condição legal, a relação sexual, a emissão seminal, a lavagem de ambos e a impureza temporária. Contudo, עַד הָעָרֶב é mais precisamente «até o anoitecer» (ou «até a noite») do que «até a tarde», que em português pode indicar apenas o período vespertino.
  naturalness: «Se um homem se deitar com uma mulher e houver emissão de sêmen» é uma formulação natural, clara e de registro apropriado. «Ambos se lavarão com água» também é idiomático e explicita corretamente o referente plural.
  terminology: «Sêmen» é preciso e atual; «impuros» preserva o termo conciso do hebraico sem imputar culpa moral. A nota a, porém, não deve apresentar «deitar-se de semente» como tradução literalmente segura de שִׁכְבַת זָרַע; a expressão é idiomática e designa emissão seminal.
  issues:
  - severity: medium
    issue: «até a tarde» para עַד הָעָרֶב
    rationale: No uso português contemporâneo, «tarde» normalmente se refere ao período antes do anoitecer. O hebraico estabelece o limite ritual no entardecer/anoitecer.
  - severity: medium
    issue: Glosa literal imprecisa na nota a
    rationale: «Deitar-se de semente» não representa de modo confiável a estrutura e o valor idiomático da expressão hebraica. É preferível explicar que a expressão, literalmente composta de termos ligados a deitar-se e semente, refere-se à emissão seminal.
  revised_text: Se um homem se deitar com uma mulher e houver emissão de sêmen[a], ambos se lavarão com água e ficarão impuros até o anoitecer[b].
