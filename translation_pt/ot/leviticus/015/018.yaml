base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: pt
  text: Se um homem se deitar com uma mulher e houver emissão de sêmen[a], ambos se lavarão com água e ficarão impuros até o anoitecer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica se refere especificamente à emissão seminal; literalmente, emprega termos ligados a “deitar-se” e “semente”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, ritualmente impuros até o anoitecer; o versículo descreve um estado de impureza ritual, não declara culpa moral.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר
  choice: Se ... uma mulher
  rationale: No contexto de legislação casuística, a construção com conjunção, substantivo e oração relativa tem força condicional; esta formulação é natural em português e preserva a mulher como participante da situação descrita.
- source_word: יִשְׁכַּב אִישׁ אֹתָהּ
  choice: um homem se deitar com uma mulher
  rationale: שׁכב com objeto feminino é um eufemismo convencional para relação sexual. “Deitar-se com” conserva o caráter idiomático e o registro digno da lei hebraica sem explicitação desnecessária.
- source_word: שִׁכְבַת זָרַע
  choice: houver emissão de sêmen
  rationale: A expressão hebraica designa especificamente emissão seminal. A construção impessoal evita atribuir ao hebraico uma coordenação verbal explícita e produz português claro; “sêmen” comunica o sentido fisiológico de זֶרַע neste contexto.
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: ambos se lavarão com água
  rationale: O verbo plural abrange os dois participantes; “ambos” torna o referente claro. “Com água” é a formulação idiomática em português para o meio da lavagem, sem especificar imersão ou banho completo.
- source_word: וְטָמְאוּ עַד הָעָרֶב
  choice: ficarão impuros até a tarde
  rationale: טמא indica aqui um estado temporário de impureza no sistema levítico. “Ficarão impuros” expressa o resultado sem introduzir culpa moral, e “até a tarde” acompanha de perto o limite temporal hebraico.
theological_decisions:
- issue: Natureza da impureza levítica
  choice: “impuros” no texto, com esclarecimento ritual em nota
  alternative: “ritualmente impuros” ou “cerimonialmente impuros” no corpo do versículo
  rationale: O hebraico emprega apenas טמא. A tradução preserva essa concisão e não associa o ato a culpa moral; a nota fornece o contexto ritual necessário ao leitor moderno.
- issue: Agente da emissão seminal
  choice: 'construção impessoal: “houver emissão de sêmen”'
  alternative: “o homem tiver emissão de sêmen”
  rationale: Embora a fisiologia torne evidente a origem da emissão, a sintaxe compacta שִׁכְבַת זָרַע não apresenta um verbo com sujeito expresso. A formulação escolhida mantém essa reserva e evita explicitar mais do que o texto.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. Mantém o eufemismo bíblico “deitar-se com”, usa terminologia fisiológica precisa e evita linguagem arcaica ou denominacional.
