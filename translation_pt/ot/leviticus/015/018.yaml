revisions:
- from: Se um homem se deitar com uma mulher e houver emissão de sêmen[a], ambos se lavarão com água e ficarão impuros até a tarde[b].
  to: Se um homem se deitar com uma mulher e houver emissão de sêmen[a], ambos se lavarão com água e ficarão impuros até o anoitecer[b].
  rationale: A revisão substitui «até a tarde» por «até o anoitecer», correspondente mais exato do limite temporal hebraico, e corrige a explicação etimológico-literal da nota a sem alterar o sentido do versículo. Mantêm-se a construção impessoal para a emissão, o eufemismo «deitar-se com» e «impuros» como tradução não moralizante de טמא.
