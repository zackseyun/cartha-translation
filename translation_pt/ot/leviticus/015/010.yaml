  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: pt
  text: Todo aquele que tocar em qualquer coisa que tenha estado debaixo dele ficará impuro até a tarde.[a] Quem carregar essas coisas[b] lavará suas roupas, se banhará em água e ficará impuro até a tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em qualquer coisa que estiver debaixo dele”. O hebraico pode ser traduzido mais literalmente no presente, mas o sentido passado se ajusta ao contexto das coisas que estiveram anteriormente sob a pessoa afetada.'
    reason: lexical_alternative
  - marker: b
    text: O pronome hebraico traduzido por “essas coisas” está no plural e se refere coletivamente aos objetos associados ao que esteve debaixo dele.
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: todo aquele que tocar
  rationale: O particípio de נגע indica contato físico; a formulação preserva o sentido genérico da norma e soa natural em português.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: em qualquer coisa que tenha estado debaixo dele
  rationale: A expressão designa qualquer objeto que esteve sob a pessoa afetada. O pretérito composto se ajusta ao contexto processual, sem ocultar a possibilidade de uma tradução mais literal no presente.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: Em legislação de pureza, טמא expressa o estado ritual de impureza. O futuro comunica com clareza a consequência jurídica da ação.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Equivalente natural que preserva o limite temporal indicado pelo hebraico com artigo.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: quem carregar essas coisas
  rationale: נשא aqui significa carregar ou transportar. O demonstrativo explicita de modo natural o referente coletivo do pronome plural hebraico, sem especificar objetos além do que o contexto permite.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavará suas roupas
  rationale: Formulação clara e atual para a lavagem das peças de vestuário exigida pelo rito.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se banhará em água
  rationale: רחץ nesta fórmula de purificação indica lavar o corpo; “se banhará em água” comunica isso sem acrescentar um método específico.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: e ficará impuro até a tarde
  rationale: Mantém a consequência ritual e seu prazo, coordenando-a naturalmente com as ações anteriores.
