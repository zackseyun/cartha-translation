  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: pt
  text: E todo aquele que tocar neles ficará impuro[a]; lavará as suas roupas, banhará o corpo em água e ficará impuro até o entardecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os objetos ligados à impureza dela mencionados no contexto anterior, como aquilo sobre o qual ela se deita ou se senta.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: E todo aquele que tocar
  rationale: A combinação de כָּל com o particípio substantivado expressa uma referência universal indefinida. A formulação é natural em português e preserva o alcance abrangente.
- source_word: בָּ/ם
  choice: neles
  rationale: O sufixo pronominal masculino plural retoma os objetos ligados à impureza da mulher no contexto anterior. O pronome preserva a remissão do hebraico sem explicitar demais no texto principal.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: Neste contexto legal de Levítico, טמא indica a entrada em estado de impureza ritual. “Ficará impuro” comunica a mudança de estado sem sugerir culpa moral.
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: lavará as suas roupas
  rationale: כִּבֶּס designa a lavagem de peças de vestuário. “Roupas” é claro e corrente no português moderno.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: banhará o corpo em água
  rationale: רחץ, neste contexto, refere-se à lavagem corporal. A explicitação de “o corpo” torna essa distinção clara em português, sem acrescentar conteúdo estranho ao sentido.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: e ficará impuro até o entardecer
  rationale: A cláusula determina a duração do estado de impureza ritual. “Até o entardecer” traduz de modo natural o limite temporal indicado pelo hebraico.
theological_decisions:
- issue: Natureza da linguagem de impureza em Levítico
  choice: Traduzir טמא como “ficar impuro”, em sentido ritual.
  alternative: “ser contaminado” ou uma formulação que sugira culpa moral
  rationale: O contexto trata das normas de pureza ritual. A tradução preserva essa categoria cultual sem transformar o contato descrito em pecado moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o pronome “neles” no texto para preservar a coesão e a relativa concisão do hebraico; a nota esclarece o referente contextual.
