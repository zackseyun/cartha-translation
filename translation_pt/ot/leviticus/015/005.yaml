  naturalness: O registro é claro e moderno. «Até o entardecer» é natural, e o futuro tem boa adequação a uma norma legal. «Lavar-se com água» é ligeiramente mais direto e menos sugestivo de uma modalidade específica de banho do que «banhar-se com água».
  terminology: «Impuro» é o termo adequado para טָמֵא, desde que a nota preserve seu sentido ritual, não moral. «Cama» é uma boa tradução principal de מִשְׁכָּב; a nota deve apresentar uma alternativa lexical que corresponda diretamente ao termo.
