base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: pt
  text: Quem tocar na cama daquele homem[a] deverá lavar as suas roupas, lavar-se com água e ficará impuro[b] até o entardecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no leito daquele homem». O termo hebraico pode referir-se de modo mais amplo ao lugar ou objeto em que ele se deita, não apenas a uma cama.
    reason: lexical_alternative
  - marker: b
    text: Isto é, impuro no sentido ritual, segundo as normas de pureza.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: O homem que
  rationale: Mantém o singular masculino explícito do hebraico e introduz naturalmente a oração relativa em português; o waw funciona aqui como conexão dentro da sequência legal e não precisa ser reproduzido por um «e» inicial.
- source_word: יִגַּע
  choice: tocar
  rationale: Verbo direto e corrente para o contato físico expresso por נגע.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: na cama dele
  rationale: מִשְׁכָּב designa aquilo ou o lugar em que alguém se deita. «Cama» é a equivalência mais natural, enquanto «dele» deixa claro que o sufixo se refere ao homem com fluxo mencionado no contexto, não necessariamente ao homem que toca.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: lavará suas roupas
  rationale: כִּבֵּס indica a lavagem de tecidos ou vestes; o futuro do indicativo é natural em prescrições legais portuguesas e preserva o sufixo possessivo.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: se banhará com água
  rationale: O reflexivo explicita que se trata da lavagem do corpo. A preposição ב pode indicar o meio empregado; «com água» evita sugerir que a imersão seja necessariamente especificada.
- source_word: וְ/טָמֵא
  choice: e ficará impuro
  rationale: Expressa o estado ritual resultante sem sugerir culpa moral; «ficará» é idiomático no encadeamento da norma.
- source_word: עַד הָ/עָרֶב
  choice: até o entardecer
  rationale: Indica o limite temporal da impureza e reproduz de modo natural a referência hebraica ao período da tarde.
theological_decisions:
- issue: Natureza da impureza em טָמֵא
  choice: impuro, entendido no contexto como estado ritual
  alternative: cerimonialmente impuro
  rationale: O texto trata do estatuto de pureza levítico, não de culpa moral. A tradução conserva a categoria concisa do hebraico, e a nota fornece a informação cultural necessária sem inseri-la no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com futuro do indicativo para a formulação legal. A colocação dos marcadores segue imediatamente os termos que explicam. «Na cama dele» evita a possível ambiguidade de «sua cama» quanto ao referente do possessivo.
