source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: pt
  text: Assim, vocês advertirão os filhos de Israel acerca de sua impureza, para que não morram em sua impureza ao contaminarem o meu tabernáculo, que está entre eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”.
    reason: Registra a alternativa idiomática em português para a designação coletiva hebraica “os filhos de Israel”.
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: vocês manterão ... afastados
  rationale: A forma é mais naturalmente entendida como hifil de נזר, com o sentido causativo de separar ou manter afastado. A escolha preserva essa ideia preventiva e se encaixa na finalidade expressa na oração seguinte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora a expressão signifique literalmente “os filhos de Israel”, em português contemporâneo ela funciona como designação coletiva do povo e é comunicada com naturalidade por “os israelitas”.
- source_word: מִטֻּמְאָתָם
  choice: de sua impureza
  rationale: A preposição מִן acompanha a ideia de afastamento, e טֻמְאָה designa aqui a condição de impureza ritual tratada no capítulo.
- source_word: בְּטֻמְאָתָם
  choice: em seu estado de impureza
  rationale: A formulação explicita que בְּ marca a condição em que a morte poderia ocorrer, sem converter a impureza ritual em culpa moral genérica.
- source_word: בְּטַמְּאָם
  choice: por contaminarem
  rationale: 'O infinitivo de טמא com בְּ expressa o meio ou a circunstância do perigo: a contaminação do tabernáculo pela impureza do povo.'
- source_word: מִשְׁכָּנִי
  choice: o meu tabernáculo
  rationale: No contexto do Pentateuco, מִשְׁכָּן se refere concretamente à habitação sagrada de Deus, para a qual “tabernáculo” é o termo português tradicional e preciso.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: que está no meio deles
  rationale: A expressão preserva a ênfase na presença da habitação divina entre o povo.
theological_decisions:
- issue: Natureza da impureza em Levítico 15
  choice: impureza
  alternative: imundícia; pecado
  rationale: O contexto trata de uma categoria ritual e cultual. “Impureza” preserva essa categoria sem sugerir que todas as condições descritas no capítulo sejam pecados morais.
- issue: Sentido do verbo inicial
  choice: manter afastados
  alternative: advertir
  rationale: A vocalização e a forma consonantal apontam mais naturalmente para o hifil de נזר, “separar/manter afastado”, e não para o hifil de זהר, “advertir”. A tradução segue prioritariamente o texto hebraico apresentado.
- issue: Relação entre a morte e a contaminação do tabernáculo
  choice: não morram em seu estado de impureza por contaminarem
  alternative: não morram por causa de sua impureza quando contaminarem
  rationale: A redação mantém tanto a condição de impureza marcada por בְּ quanto a ligação instrumental ou causal do infinitivo seguinte, sem reduzir toda a advertência a uma afirmação moral genérica.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” adequado ao sujeito plural implícito (Moisés e Arão). A terminologia cultual é mantida de forma consistente e compreensível.
