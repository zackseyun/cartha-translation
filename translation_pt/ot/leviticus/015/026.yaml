  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: pt
  text: Toda cama em que ela se deitar durante todos os dias do seu corrimento será para ela como a cama da sua menstruação[a]; e todo objeto[b] em que ela se sentar será impuro, como a impureza da sua menstruação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como a cama da sua impureza menstrual”. O termo hebraico também pode designar o estado menstrual com a separação ritual associada.'
    reason: lexical_alternative
  - marker: b
    text: “Objeto” traduz um termo hebraico amplo para utensílio, artigo ou objeto; aqui não se limita a um recipiente.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: cama
  rationale: Designa o lugar onde alguém se deita; “cama” é natural em português e adequado ao contexto ritual.
- source_word: תִּשְׁכַּב עָלָיו
  choice: ela se deitar
  rationale: O verbo שׁכב com עַל indica deitar-se sobre algo; a formulação é idiomática em português.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: durante todos os dias do seu corrimento
  rationale: זוֹב designa aqui o corrimento corporal prolongado ou anormal; “corrimento” é claro e preserva o sentido contextual.
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  choice: como a cama da sua menstruação
  rationale: נִדָּה refere-se neste contexto ao estado menstrual e à separação ritual associada; a tradução concreta mantém a comparação do texto.
- source_word: יִהְיֶה לָּהּ
  choice: será para ela
  rationale: Preserva a construção hebraica que atribui à cama, em relação a ela, a mesma condição ritual da cama usada durante a menstruação.
- source_word: כְּלִי
  choice: objeto
  rationale: כְּלִי é um termo amplo para utensílio, artigo ou objeto. Como se trata de algo sobre o qual ela se senta, “objeto” evita a ideia estreita de recipiente sugerida por “vaso” em português.
- source_word: תֵּשֵׁב עָלָיו
  choice: ela se sentar
  rationale: ישׁב com עַל expressa sentar-se sobre algo; a forma escolhida é natural em português.
- source_word: טָמֵא
  choice: impuro
  rationale: No sistema levítico, indica condição ritual, não culpa moral; “impuro” é corrente e claro em português bíblico moderno.
- source_word: כְּטֻמְאַת נִדָּתָהּ
  choice: como na impureza da sua menstruação
  rationale: Mantém a ligação lexical entre טָמֵא e טֻמְאָה e expressa a comparação com a condição ritual associada à menstruação.
theological_decisions:
- issue: Natureza da linguagem de impureza na lei levítica
  choice: Traduzir טָמֵא / טֻמְאָה como “impuro/impureza” em sentido ritual.
  alternative: “Imundo/imundícia” ou linguagem que possa sugerir culpa moral.
  rationale: O versículo trata do estado cerimonial dentro das normas de pureza de Israel, não de pecado pessoal ou inferioridade moral.
- issue: Sentido de נִדָּה
  choice: Traduzir concretamente como “menstruação” no texto principal.
  alternative: “Impureza menstrual” ou “estado de separação menstrual”.
  rationale: O referente físico é claro no contexto, mas o termo também inclui a condição ritual associada; essa amplitude é registrada em nota sem sobrecarregar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo legal hebraico, distingue impureza ritual de culpa moral e usa “objeto” para preservar a amplitude de כְּלִי sem recorrer ao potencialmente enganoso “vaso”.
