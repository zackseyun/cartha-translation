  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: pt
  text: 'Esta é a lei referente àquele que tem um corrimento e àquele de quem sai uma emissão de sêmen, tornando-se impuro por causa dela:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Esta é a lei referente a
  rationale: A fórmula introduz um resumo das prescrições. “Lei” corresponde ao uso jurídico de תּוֹרָה em Levítico, e “referente a” expressa naturalmente a relação construta em português.
- source_word: הַזָּב
  choice: àquele que tem um corrimento
  rationale: O particípio substantivado designa a pessoa que sofre um fluxo corporal. “Corrimento” é claro e preserva a natureza geral do termo sem especificar além do hebraico.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ
  choice: e àquele de quem sai
  rationale: Mantém a construção relativa e a imagem concreta do verbo “sair”, com sintaxe natural em português.
- source_word: שִׁכְבַת זֶרַע
  choice: uma emissão de sêmen
  rationale: A expressão idiomática se refere à emissão seminal; esta tradução é precisa, atual e compreensível, sem recorrer a eufemismo arcaico.
- source_word: לְטָמְאָה בָהּ
  choice: tornando-se impuro por causa dela
  rationale: O infinitivo pode indicar resultado ou finalidade. A formulação comunica o resultado sem o tornar excessivamente explícito, e “dela” retoma a emissão.
theological_decisions:
- issue: Valor de לְטָמְאָה como finalidade ou resultado
  choice: tornando-se impuro por causa dela
  alternative: para se tornar impuro por causa dela
  rationale: O hebraico admite nuance de resultado ou finalidade. O gerúndio preserva melhor essa abertura contextual e evita sugerir que a emissão tenha uma finalidade intencional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário ritual coerente. A pontuação final com dois-pontos preserva a função do versículo como início de uma recapitulação que continua nos versículos seguintes.
