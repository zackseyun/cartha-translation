id: LEV.15.8
reference: Leviticus 15:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יָרֹ֛ק הַ/זָּ֖ב בַּ/טָּה֑וֹר וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: pt
  text: E, se o homem que tem o corrimento cuspir sobre uma pessoa pura[a], essa pessoa lavará suas roupas, se banhará em água e ficará impura até a tarde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, uma pessoa ritualmente pura.
    reason: lexical_alternative
  - marker: b
    text: A impureza mencionada aqui é ritual e temporária; não significa necessariamente culpa moral.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִֽי
  choice: E, se
  rationale: Mantém tanto a ligação com a sequência legal quanto o valor condicional da expressão hebraica.
- source_word: יָרֹק
  choice: cuspir sobre
  rationale: O verbo significa «cuspir»; a preposição hebraica בְּ indica aqui a pessoa atingida.
- source_word: הַ/זָּב
  choice: o homem que tem o corrimento
  rationale: Expressa naturalmente o particípio substantivado masculino e mantém «corrimento», termo já adequado ao contexto legal de Levítico 15.
- source_word: בַּ/טָּהוֹר
  choice: sobre uma pessoa pura
  rationale: O adjetivo substantivado designa alguém em estado de pureza ritual; «pessoa» explicita o referente sem restringir seu sexo.
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: essa pessoa lavará suas roupas
  rationale: O sujeito natural das ações é a pessoa pura atingida pela saliva. O demonstrativo evita em português a ambiguidade pronominal sobre quem deve lavar-se.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: se banhará em água
  rationale: No contexto ritual, רָחַץ indica lavagem corporal; a forma reflexiva é natural em português.
- source_word: וְ/טָמֵא
  choice: e ficará impura
  rationale: Indica a aquisição temporária de impureza ritual como resultado do contato, e concorda com «pessoa».
- source_word: עַד הָ/עָרֶב
  choice: até a tarde
  rationale: Reproduz a fórmula temporal recorrente em Levítico para a duração do estado de impureza.
theological_decisions:
- issue: Terminologia de pureza
  choice: pura / impura
  alternative: limpa / impura; ritualmente pura / ritualmente impura no corpo do texto
  rationale: Em português, «pura/impura» comunica melhor uma condição ritual do que «limpa/suja». A nota esclarece que não se trata necessariamente de culpa moral.
- issue: Sujeito das ações de purificação
  choice: A pessoa pura sobre quem o homem cuspiu
  alternative: O homem que tem o corrimento
  rationale: A sintaxe e a lógica das leis de contato apontam para a pessoa atingida como sujeito de «lavará», «se banhará» e «ficará impura». A repetição de «essa pessoa» torna isso claro sem alterar o conteúdo.
translation_notes:
  register: Português moderno, claro e digno, com construção legal fluida. «Corrimento» preserva a terminologia do capítulo; «essa pessoa» elimina uma ambiguidade pronominal que seria forte em português. Todos os marcadores aparecem no texto.
