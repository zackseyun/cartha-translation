base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: pt
  text: e para a mulher indisposta durante sua impureza menstrual,[a] para quem tem um corrimento, seja homem ou mulher, e para o homem que se deita com uma mulher impura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mulher que está enferma em sua impureza menstrual”. A expressão hebraica se refere, neste contexto, à mulher em seu estado menstrual.'
    reason: lexical_alternative
  - marker: b
    text: “Impura” refere-se aqui à impureza ritual segundo a lei levítica, não à impureza moral.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: a mulher em sua impureza menstrual
  rationale: No contexto, a expressão designa a mulher durante seu estado menstrual. Esta formulação evita acrescentar a noção de doença, que não precisa ser explicitada, e preserva a categoria ritual indicada por נִדָּה.
- source_word: הַזָּב אֶת זוֹבוֹ
  choice: quem tem um corrimento
  rationale: A construção cognata hebraica é expressa naturalmente em português por uma oração verbal. O contexto do capítulo indica um corrimento corporal anormal.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: seja homem ou mulher
  rationale: A expressão esclarece que a legislação referente ao corrimento abrange ambos os sexos; a tradução é natural e mantém esse alcance distributivo.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: que se deita com
  rationale: Preserva o eufemismo sexual do hebraico sem tornar a formulação excessivamente explícita.
- source_word: טְמֵאָה
  choice: uma mulher impura
  rationale: Mantém a terminologia de pureza levítica. Neste contexto, 'impura' descreve um estado ritual, não o valor moral ou pessoal da mulher.
theological_decisions:
- issue: Terminologia de pureza ritual
  choice: impureza menstrual; mulher impura
  alternative: menstruação; mulher moralmente contaminada
  rationale: נִדָּה e טְמֵאָה pertencem aqui ao sistema levítico de pureza ritual. A tradução preserva essa categoria sem transformar o estado ritual em condenação moral.
- issue: Possível sentido de enfermidade em הַדָּוָה
  choice: a mulher em sua impureza menstrual
  alternative: a mulher enferma em sua impureza menstrual
  rationale: Embora a forma possa evocar debilidade ou enfermidade, a combinação com בְּנִדָּתָהּ identifica diretamente o estado menstrual. Explicitar 'enferma' em português pode sugerir uma doença não necessariamente afirmada pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordenada preserva o caráter conclusivo do versículo, que encerra a seção legislativa iniciada anteriormente.
