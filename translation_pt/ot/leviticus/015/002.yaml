base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: pt
  text: 'Falem aos filhos de Israel[a] e digam-lhes: Quando qualquer homem tiver um corrimento do seu corpo[b], seu corrimento é impuro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas”; literalmente, “aos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da sua carne”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Falem
  rationale: O imperativo plural dirige a ordem a Moisés e Arão; “Falem” preserva de modo natural o caráter formal da instrução.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a forma masculina e a expressão tradicional correspondente ao hebraico literal, com uma nota indicando a alternativa idiomática.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: e digam-lhes
  rationale: Reproduz a fórmula sequencial de ordem do discurso legal hebraico em português digno e corrente.
- source_word: אִישׁ אִישׁ
  choice: algum homem
  rationale: A repetição distributiva significa “qualquer homem”; o substantivo masculino é apropriado porque o contexto imediato trata de uma descarga corporal masculina.
- source_word: כִּי יִהְיֶה
  choice: Quando ... tiver
  rationale: “Quando” expressa adequadamente a formulação casuística da lei, sem sugerir dúvida quanto à possibilidade do caso.
- source_word: זָב
  choice: tiver um corrimento
  rationale: “Corrimento” é um termo corrente e suficientemente preciso para uma descarga corporal no contexto legal e médico.
- source_word: מִבְּשָׂרוֹ
  choice: do seu corpo
  rationale: Embora בשר signifique literalmente “carne”, aqui “corpo” comunica com mais clareza a origem corporal da descarga e evita associações teológicas indevidas.
- source_word: זוֹבוֹ
  choice: seu corrimento
  rationale: Repete “corrimento” para preservar a ligação lexical com o particípio זָב e a ênfase jurídica na condição.
- source_word: טָמֵא הוּא
  choice: é impuro
  rationale: “Impuro” indica o estado de impureza ritual estabelecido pela legislação levítica, sem implicar necessariamente culpa moral.
theological_decisions:
- issue: Terminologia da impureza ritual
  choice: impuro
  alternative: imundo
  rationale: “Impuro” é claro no português moderno e comunica uma categoria ritual, não necessariamente uma avaliação moral; “imundo” poderia soar mais pejorativo ou higiênico.
- issue: Referente gramatical de טָמֵא הוּא
  choice: seu corrimento é impuro
  alternative: ele é impuro
  rationale: O pronome masculino singular pode retomar o corrimento, também masculino em hebraico, e essa leitura acompanha a estrutura imediata da frase. A construção preserva a tensão do texto sem ampliar a afirmação para além do enunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo verbal “Falem... e digam-lhes” conserva a cadência da fórmula legal hebraica; as notas registram as alternativas literais sem sobrecarregar o texto principal.
