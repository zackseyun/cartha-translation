base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: pt
  text: E toda pessoa em quem o homem com corrimento tocar, sem que ele tenha lavado as mãos com água[a], lavará as suas roupas, banhará o corpo em água e ficará impura até a tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se ele não tiver enxaguado as mãos com água”. A oração hebraica pode ser entendida como a condição sob a qual o toque transmite impureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: o homem com o corrimento
  rationale: O particípio substantivado refere-se, neste contexto legal, a um homem que apresenta fluxo corporal. A formulação mantém explícita a referência masculina e é clara em português atual.
- source_word: כֹל אֲשֶׁר יִגַּע בּוֹ
  choice: toda pessoa em quem ... tocar
  rationale: כֹל אֲשֶׁר tem sentido distributivo e pessoal, enquanto נגע com ב indica contato físico. A construção preserva a direção do toque expressa pelo hebraico.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: sem ter lavado as mãos com água
  rationale: A oração é entendida circunstancialmente, referindo-se ao homem com o corrimento. 'Lavado' é natural em português; a nota registra a possível leitura condicional e o valor mais específico de enxaguar.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lavará as suas roupas
  rationale: כּבס designa a lavagem de tecidos ou roupas. O futuro com valor prescritivo comunica naturalmente a obrigação legal.
- source_word: וְרָחַץ בַּמַּיִם
  choice: banhará o corpo em água
  rationale: רחץ, neste contexto de pureza, indica a lavagem corporal. A explicitação de 'o corpo' evita que a expressão seja confundida com a lavagem das roupas e não acrescenta uma exigência alheia ao sentido.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: e ficará impura até a tarde
  rationale: טמא indica impureza ritual, não culpa moral. A concordância com 'pessoa' mantém a formulação inclusiva quanto a quem recebe o toque.
theological_decisions:
- issue: Natureza da impureza em טמא
  choice: impura
  alternative: contaminada
  rationale: O contexto trata de impureza ritual decorrente de contato, removida mediante lavagem e passagem do tempo; 'impura' conserva a categoria cultual sem sugerir culpa moral.
- issue: Relação da oração sobre lavar as mãos com o toque
  choice: A falta de lavagem das mãos descreve a condição do homem com o corrimento ao tocar outra pessoa.
  alternative: 'Ler a oração de forma mais rigidamente coordenada ou como condição explícita: ''se ele não tiver enxaguado as mãos em água''.'
  rationale: A sintaxe hebraica permite valor circunstancial ou condicional. O texto principal oferece a leitura contextual mais natural, enquanto a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'corrimento' no sentido corporal, 'roupas' em vez de 'vestes' e futuro prescritivo próprio de texto legal. A nota preserva a ambiguidade sintática e a nuance de שׁטף.
