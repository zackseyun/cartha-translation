  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: pt
  text: No oitavo dia, ele tomará para si duas rolas ou dois pombinhos, virá perante Yahweh[a], à entrada da tenda do encontro, e os entregará ao sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino, tradicionalmente traduzido por “SENHOR”; aqui, “Yahweh”.'
    reason: Esclarece a forma hebraica do nome divino, a convenção tradicional e a opção adotada na tradução.
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: No oitavo dia
  rationale: Expressa naturalmente em português a sequência temporal do procedimento legal; a conjunção hebraica não precisa ser reproduzida por um “e” inicial.
- source_word: יִקַּח לוֹ
  choice: ele tomará para si
  rationale: O futuro comunica a força prescritiva da instrução legal, e “para si” preserva o pronome dativo לוֹ.
- source_word: שְׁתֵּי תֹרִים
  choice: duas rolas
  rationale: “Rolas” é a designação portuguesa corrente das aves תֹרִים usadas como oferta.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: ou dois pombinhos
  rationale: A expressão idiomática hebraica indica pombos jovens; “pombinhos” é uma formulação bíblica tradicional, clara e concisa em português.
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: irá à presença de Yahweh
  rationale: Representa a continuação da sequência legal e o sentido espacial-relacional de לִפְנֵי, preservando o nome divino pessoal.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: “Entrada” traduz פֶּתַח, e “tenda do encontro” comunica de modo transparente a função de אֹהֶל מוֹעֵד.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: e os entregará ao sacerdote
  rationale: “Entregará” expressa com naturalidade a transferência direta das aves ao sacerdote indicada por נתן.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio, enquanto a nota registra a representação hebraica e a tradução tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro verbal mantém o tom prescritivo do texto legal, sem rigidez arcaizante.
