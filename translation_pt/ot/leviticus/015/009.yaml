  text: וְ/כָל הַ/מֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: pt
  text: E toda sela em que o homem que tem o corrimento cavalgar ficará impura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tudo aquilo sobre o qual ele cavalgar”; o termo hebraico pode indicar, de modo mais amplo, aquilo que serve de montaria ou assento, e não apenas uma sela em sentido estrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: E toda
  rationale: Preserva tanto a ligação de וְ com as normas anteriores quanto o alcance distributivo de כָּל, em português natural.
- source_word: הַ/מֶּרְכָּב
  choice: sela
  rationale: מֶרְכָּב designa algo sobre o qual se monta. Neste contexto, “sela” expressa de modo natural o equipamento ou assento de montaria, enquanto a nota preserva o alcance lexical mais amplo.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: sobre a qual ... montar
  rationale: Reproduz com clareza a oração relativa e o sentido espacial de עַל. O futuro do subjuntivo é natural em uma disposição legal geral.
- source_word: הַ/זָּב
  choice: o homem que tem o corrimento
  rationale: O particípio substantivado masculino indica o homem acometido pelo corrimento corporal descrito no capítulo; a formulação é clara, atual e mantém a referência masculina.
- source_word: יִטְמָא
  choice: ficará impura
  rationale: Expressa o estado ritual resultante sem sugerir culpa moral. A concordância feminina corresponde a “sela”.
theological_decisions:
- issue: Natureza da linguagem de impureza em Levítico
  choice: Traduzir טמא como “impura” em sentido ritual e legal
  alternative: “contaminada” ou “imunda”
  rationale: O versículo trata do estado cerimonial decorrente de um corrimento corporal, não necessariamente de pecado pessoal ou corrupção moral. “Impura” comunica essa distinção com clareza em português contemporâneo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o caráter legal do texto sem arcaísmos desnecessários.
