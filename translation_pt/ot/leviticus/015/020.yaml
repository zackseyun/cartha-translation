  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: pt
  text: Tudo aquilo sobre o qual ela se deitar durante sua impureza menstrual ficará impuro[a], e tudo aquilo sobre o qual ela se sentar ficará impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “durante sua menstruação”. O termo hebraico inclui a ideia de impureza ritual associada à menstruação, não apenas o ciclo físico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: impureza menstrual
  rationale: No contexto de Levítico 15, designa o estado de impureza ritual associado à menstruação, e não apenas o processo biológico.
- source_word: תִּשְׁכַּב
  choice: se deitar
  rationale: Expressa deitar-se ou ficar deitada sobre algo, sem implicar necessariamente dormir.
- source_word: תֵּשֵׁב
  choice: se sentar
  rationale: Traduz diretamente o ato de sentar-se sobre um objeto.
- source_word: עָלָיו
  choice: sobre o qual
  rationale: Retoma o objeto que fica debaixo dela e forma uma oração relativa natural em português.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: Indica que o objeto passa a estar em condição de impureza ritual; o futuro também preserva o tom normativo do texto legal.
- source_word: וְכֹל אֲשֶׁר
  choice: tudo aquilo sobre o qual
  rationale: Preserva a abrangência da construção hebraica e se ajusta naturalmente às ações de deitar e sentar.
theological_decisions:
- issue: Natureza da impureza na lei levítica de pureza
  choice: Empregar linguagem de impureza ritual sem sugerir culpa moral
  alternative: Usar termos que possam fazer a menstruação parecer pecado ou contaminação moral
  rationale: O versículo trata do estado ritual estabelecido pelas leis de pureza de Israel, não afirma que a menstruação seja uma transgressão moral.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo hebraico e distingue impureza ritual de culpa moral.
