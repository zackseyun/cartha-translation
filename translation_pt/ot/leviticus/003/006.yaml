source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: pt
  text: E, se a sua oferta a Yahweh como sacrifício de comunhão for um animal do rebanho[a], macho ou fêmea, ele o oferecerá sem defeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como sacrifício pacífico”. O termo hebraico שְׁלָמִים pode evocar paz, bem-estar e comunhão na refeição sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva tanto a ligação com as instruções anteriores quanto o valor condicional da expressão hebraica.
- source_word: מִן הַצֹּאן
  choice: vier do rebanho
  rationale: צֹאן designa coletivamente animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” mantém essa abrangência sem especificar uma única espécie.
- source_word: קָרְבָּנוֹ
  choice: a sua oferta
  rationale: קָרְבָּן é o termo sacrificial comum para aquilo que é apresentado; “oferta” é claro e natural neste contexto.
- source_word: לְזֶבַח שְׁלָמִים
  choice: como sacrifício de comunhão
  rationale: זֶבַח indica sacrifício, enquanto שְׁלָמִים é um termo técnico relacionado a paz, bem-estar e participação numa refeição sacrificial. “Sacrifício de comunhão” comunica naturalmente o caráter compartilhado, sem eliminar a alternativa tradicional indicada em nota.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição marca o destinatário ou a dedicação da oferta, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: זָכָר אוֹ נְקֵבָה
  choice: seja macho ou fêmea
  rationale: Reproduz diretamente a distinção sexual permitida para o animal sacrificial.
- source_word: תָּמִים
  choice: sem defeito
  rationale: No contexto sacrificial, תָּמִים descreve um animal livre de defeito físico; “sem defeito” é preciso e corrente em português.
- source_word: יַקְרִיבֶנּוּ
  choice: ele a oferecerá
  rationale: O hifil de קרב significa apresentar ou oferecer ritualmente; o pronome feminino retoma “oferta” em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança, conforme a decisão doutrinária fornecida.
- issue: Sentido de שְׁלָמִים
  choice: sacrifício de comunhão
  alternative: sacrifício pacífico; sacrifício de paz
  rationale: O termo admite associações com paz, integridade, bem-estar e comunhão sacrificial. A tradução principal destaca a participação compartilhada, enquanto a nota conserva a formulação tradicional e a tensão lexical.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem dos elementos acompanha de perto o hebraico sem sacrificar a naturalidade. O marcador [a] aparece no texto e corresponde à nota lexical.
