id: LEV.3.7
reference: Leviticus 3:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: pt
  text: Se ele apresentar uma ovelha como sua oferta[a], deverá apresentá-la diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um cordeiro como sua oferta”.'
    reason: 'Alternativa lexical: כֶּשֶׂב pode designar uma ovelha ou, conforme o contexto, um cordeiro.'
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz um caso condicional nas instruções sacrificiais; “se” preserva diretamente essa estrutura.
- source_word: כֶּשֶׂב
  choice: ovelha
  rationale: O termo pode designar uma ovelha e, conforme o contexto, um cordeiro. “Ovelha” evita especificar uma idade que o hebraico não exige.
- source_word: מַקְרִיב
  choice: apresentar
  rationale: No hifil, קרב expressa fazer chegar perto, isto é, trazer ou apresentar como oferta. Em português, “apresentar” é claro e adequado ao contexto cultual.
- source_word: קָרְבָּנוֹ
  choice: sua oferta
  rationale: קָרְבָּן é o termo geral para aquilo que se leva ou aproxima de Deus; “oferta” preserva essa amplitude.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: deverá apresentá-la
  rationale: A forma verbal tem força instrutiva neste texto legal. O pronome feminino concorda naturalmente com “ovelha” em português.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa a apresentação do animal perante a presença de Yahweh, em linguagem cultual natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico contém o nome divino. “Yahweh” preserva seu caráter de nome próprio sem substituí-lo por um título.
- issue: Amplitude semântica de כֶּשֶׂב
  choice: ovelha, com nota alternativa “cordeiro”
  alternative: cordeiro no texto principal
  rationale: A idade do animal não é inequívoca neste termo isolado; a tradução principal mantém o sentido mais amplo e a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica instrutiva. A repetição de “apresentar” reflete a repetição hebraica de קרב e mantém a coesão lexical do versículo.
