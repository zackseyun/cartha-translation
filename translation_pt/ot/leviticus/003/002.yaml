revisions:
- from: Ele porá a mão sobre a cabeça da sua oferta e a matará à entrada da tenda do encontro[a]. Então os filhos de Arão, os sacerdotes, lançarão o sangue contra o altar, ao redor[b].
  to: Ele porá a mão sobre a cabeça da sua oferta e a abaterá à entrada da Tenda do Encontro[a]; os filhos de Arão, os sacerdotes, lançarão o sangue contra o altar, por todos os lados[b].
  rationale: A revisão substitui o genérico «matará» por «abaterá», que reproduz mais adequadamente o verbo sacrificial hebraico, e explicita o alcance de סָבִיב com «por todos os lados». Também remove «Então», que não é exigido pela coordenação hebraica. A capitalização de «Tenda do Encontro» trata a expressão como designação estabelecida do santuário.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:57:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva os elementos essenciais do hebraico: a imposição de uma mão, a oferta, o local à entrada da Tenda do Encontro e a aplicação do sangue pelos filhos sacerdotais de Arão. Contudo, «matará» é mais genérico do que שחט no contexto sacrificial, e «ao redor» fica sintaticamente solto, sem explicitar com clareza que se refere ao altar e à sua circunferência.'
  naturalness: «A abaterá» é uma formulação moderna, clara e adequada ao contexto sacrificial sem recorrer a jargão excessivamente técnico. «Por todos os lados» torna natural e inequívoca a expressão final. A coordenação em uma única frase com ponto e vírgula acompanha melhor a sequência do versículo sem introduzir o conector interpretativo «Então».
  terminology: «Oferta», «Tenda do Encontro», «filhos de Arão, os sacerdotes», «altar» e «lançarão o sangue contra o altar» são escolhas consistentes com o hebraico e com registro bíblico moderno. «Abaterá» representa melhor o abate sacrificial expresso por שחט do que «matará».
