  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וּ/שְׁחָט֕/וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: pt
  text: Ele porá a mão sobre a cabeça da sua oferta e a abaterá à entrada da Tenda do Encontro[a]; os filhos de Arão, os sacerdotes, lançarão o sangue contra o altar, por todos os lados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto à abertura da Tenda do Encontro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “arremessarão o sangue contra o altar, por todos os lados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: porá
  rationale: No contexto sacrificial, סמך descreve pôr ou apoiar a mão sobre o animal. “Porá” é natural e mantém a amplitude do verbo sem especificar indevidamente o grau de pressão.
- source_word: יָדוֹ
  choice: a mão
  rationale: O hebraico emprega o substantivo singular com sufixo masculino singular; o possessivo fica claro pelo sujeito em português.
- source_word: רֹאשׁ
  choice: a cabeça
  rationale: Referência anatômica concreta, traduzida diretamente.
- source_word: קָרְבָּנוֹ
  choice: sua oferta
  rationale: קָרְבָּן é um termo geral para aquilo que é apresentado a Deus; “oferta” preserva essa abrangência melhor que “sacrifício”.
- source_word: וּשְׁחָטוֹ
  choice: e a matará
  rationale: שׁחט designa o abate do animal, especialmente em contexto sacrificial. “Matará” é claro e idiomático em português; o contexto fornece o sentido ritual de abate.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: פֶּתַח indica a abertura ou entrada, e אֹהֶל מוֹעֵד é a designação do santuário portátil. “Tenda do encontro” conserva o sentido hebraico sem importar terminologia do templo posterior.
- source_word: וְזָרְקוּ
  choice: lançarão
  rationale: זרק indica lançar ou arremessar o sangue, não necessariamente aspergi-lo em gotículas. “Lançarão” preserva a ação ritual sem confundi-la com outro modo de aplicação.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: os filhos de Arão, os sacerdotes
  rationale: Mantém a construção apositiva que identifica os filhos de Arão como sacerdotes.
- source_word: אֶת הַדָּם
  choice: o sangue
  rationale: Tradução direta do objeto definido; a partícula de objeto direto não requer equivalente.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contra o altar
  rationale: Com זרק, “contra o altar” comunica que o sangue é lançado sobre as faces ou superfícies do altar, e não apenas colocado no topo.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa a distribuição do sangue em torno do altar de modo conciso e natural.
theological_decisions:
- issue: Modo ritual de aplicação do sangue
  choice: lançarão o sangue contra o altar, ao redor
  alternative: aspergirão o sangue sobre o altar, ao redor
  rationale: O verbo זרק denota mais naturalmente lançar ou arremessar. Evita-se “aspergir”, que pode sugerir uma ação ritual distinta e mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. O futuro verbal preserva o caráter prescritivo. A divisão em duas frases evita uma coordenação excessivamente longa sem alterar a sequência ritual.
