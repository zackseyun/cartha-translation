    rationale: Embora não seja falso, o verbo hebraico designa o abate, particularmente em contexto sacrificial. «Abaterá» mantém esse traço sem impor uma interpretação ritual além do texto.
  - severity: medium
    issue: «ao redor» não explicita o referente e soa elíptico após «contra o altar».
    rationale: סָבִיב descreve a aplicação em torno do altar. «Por todos os lados» comunica claramente a abrangência espacial e evita uma construção final pendente.
  - severity: low
    issue: «Então» explicita uma relação temporal que não é necessária no hebraico.
    rationale: A simples coordenação preserva a progressão narrativa/instrucional sem acrescentar ênfase temporal.
