  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: pt
  text: Mas, se a oferta dele for uma cabra, ele a apresentará diante de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, o nome divino; tradicionalmente traduzido por “SENHOR”.'
    reason: Informa a forma do texto-fonte e a alternativa tradicional de tradução.
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz o próximo caso na sequência das instruções sacrificiais, com uma transição natural e leve contraste em relação às opções anteriores.
- source_word: עֵז
  choice: uma cabra
  rationale: O substantivo singular designa uma cabra; o artigo indefinido é necessário para uma formulação natural em português.
- source_word: קָרְבָּנוֹ
  choice: a oferta dele
  rationale: קָרְבָּן é um termo amplo para aquilo que é levado ou apresentado como oferta; evita restringir o sentido a “sacrifício”.
- source_word: וְהִקְרִיבוֹ
  choice: ele a apresentará
  rationale: O hifil de קרב indica fazer chegar, trazer ou apresentar, aqui no contexto ritual; o futuro expressa adequadamente a força normativa da instrução.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressão portuguesa corrente para a linguagem espacial e cultual de apresentação na presença de alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio, enquanto “SENHOR” o substitui por um título; “Jeová” é uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe normativa natural. “A oferta dele” evita a possível ambiguidade de “sua oferta” e mantém explícita a referência ao ofertante.
