source:
  edition: WLC
  text: וְ/הִקְטִיר֥/וֹ הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֥חֶם אִשֶּׁ֖ה לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/011.yaml
  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: pt
  text: O sacerdote o queimará sobre o altar como alimento[a], uma oferta feita pelo fogo a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pão de uma oferta feita pelo fogo”; aqui, “pão” é usado no sistema sacrificial com o sentido de alimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: o queimará
  rationale: No contexto sacrificial, o hifil de קטר indica queimar sobre o altar, fazendo a oferta subir em fumaça. A formulação é clara e natural em português.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão de כֹּהֵן no contexto do culto.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: O he direcional, combinado com o procedimento sacrificial, indica que a porção é queimada sobre o altar.
- source_word: לֶחֶם
  choice: alimento
  rationale: Embora לֶחֶם frequentemente signifique “pão”, aqui funciona no idioma sacrificial como alimento, isto é, a porção destinada ao altar, sem implicar que se trate literalmente de pão.
- source_word: אִשֶּׁה
  choice: uma oferta feita pelo fogo
  rationale: O termo técnico designa uma oferta apresentada por meio do fogo. Esta tradução mantém o sentido ritual em português claro.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל expressa o destinatário ou a dedicação da oferta; o nome divino é transliterado como Yahweh, conforme a orientação doutrinária fornecida.
theological_decisions:
- issue: Sentido da expressão sacrificial לֶחֶם אִשֶּׁה
  choice: como alimento, uma oferta feita pelo fogo
  alternative: como alimento da oferta feita pelo fogo; como pão, uma oferta de fogo
  rationale: A tradução conserva os dois elementos cultuais da expressão hebraica, mas usa “alimento” para evitar a impressão equivocada de pão literal. A linguagem é analógica e descreve a porção do altar, não uma necessidade física de Deus.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do hebraico sem sacrificar a naturalidade. “Yahweh” preserva o nome divino conforme a orientação do projeto.
