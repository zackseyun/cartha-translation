    issue: Construção condicional e expressão para bovinos
    rationale: O hebraico repete אִם («se») para introduzir a especificação da oferta bovina. «E se» reflete isso melhor do que «e ele». «Gado» traduz naturalmente בָּקָר; «animais do rebanho bovino» é redundante.
  - severity: low
    issue: Antecedente de «sem defeito»
    rationale: No hebraico, תָּמִים descreve o animal oferecido. Explicitar «um animal do gado» evita que «sem defeito» pareça qualificar a «oferta» abstrata.
  revised_text: Se a sua oferta for um sacrifício de ofertas de paz[a], se ele apresentar um animal do gado, macho ou fêmea, deverá apresentá-lo sem defeito diante de Yahweh.
