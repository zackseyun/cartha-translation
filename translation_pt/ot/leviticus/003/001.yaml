id: LEV.3.1
reference: Leviticus 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: pt
  text: Se a sua oferta for um sacrifício de ofertas de paz[a], se ele apresentar um animal do gado, macho ou fêmea, deverá apresentá-lo sem defeito diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma oferta de paz» ou «um sacrifício de comunhão». Literalmente, o hebraico diz «um sacrifício de ofertas de paz».
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: um sacrifício de ofertas de paz
  rationale: 'Mantém os dois elementos da construção hebraica: זֶבַח, “sacrifício”, e שְׁלָמִים, o tipo de oferta. “Ofertas de paz” conserva a designação tradicional sem reduzir o campo semântico à ideia de comunhão.'
- source_word: קָרְבָּנוֹ
  choice: a sua oferta
  rationale: קָרְבָּן designa aquilo que é apresentado ou trazido perante Deus; “oferta” é claro, natural e apropriado ao contexto sacrificial.
- source_word: מִן הַבָּקָר
  choice: dentre os animais do rebanho bovino
  rationale: בָּקָר se refere a animais bovinos de criação. A formulação distingue essa categoria dos rebanhos de ovelhas e cabras mencionados depois, sem sugerir que o rebanho inteiro seja oferecido.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: apresentar / deverá apresentá-la
  rationale: No hifil, קרב significa fazer chegar perto e, em contexto ritual, apresentar ou oferecer. “Apresentar” preserva essa nuance e evita repetição excessiva de “oferta/oferecer”.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: seja macho ou fêmea
  rationale: Reproduz naturalmente em português a construção distributiva אִם ... אִם e mantém explícito que ambos os sexos são permitidos.
- source_word: תָּמִים
  choice: sem defeito
  rationale: No contexto sacrificial, תָּמִים descreve um animal íntegro, livre de defeito físico; “sem defeito” é preciso e corrente.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa “diante de” ou “na presença de”, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Designação de שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão; ofertas de bem-estar
  rationale: “Ofertas de paz” é uma tradução tradicional e lexicalmente defensável, suficientemente ampla para não limitar o termo a apenas uma de suas possíveis associações. As alternativas interpretativas são registradas em nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção jurídica clara. O feminino pronominal em “apresentá-la” retoma “oferta”. A expressão mais explícita “rebanho bovino” evita a ambiguidade de “gado” e prepara a distinção das categorias animais nos versículos seguintes.
