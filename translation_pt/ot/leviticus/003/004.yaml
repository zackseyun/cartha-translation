base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: pt
  text: e os dois rins, e a gordura que está sobre eles, junto aos lombos, e o apêndice[a] sobre o fígado; ele o removerá junto com os rins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lobo do fígado”. O termo hebraico para essa parte anatômica é incerto; “apêndice” evita uma precisão que o texto não permite assegurar.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: os dois rins
  rationale: O hebraico designa claramente os rins como órgãos anatômicos; a expressão é direta e natural em português.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: No contexto sacrificial levítico, refere-se às porções gordurosas reservadas para a oferta. “Gordura” é claro e mantém o vocabulário ritual recorrente.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: que está sobre eles
  rationale: A oração relativa modifica “gordura” e conserva a indicação espacial em relação aos rins.
- source_word: הַכְּסָלִים
  choice: os lombos
  rationale: O termo indica a região dos lombos ou flancos; “lombos” se ajusta ao registro anatômico e sacrificial.
- source_word: הַיֹּתֶרֶת
  choice: o apêndice
  rationale: O termo anatômico é incerto e parece indicar uma parte saliente associada ao fígado. “Apêndice” evita afirmar com precisão indevida que se trata de um lobo.
- source_word: עַל הַכָּבֵד
  choice: sobre o fígado
  rationale: Mantém o valor espacial básico da preposição sem acrescentar a ideia interpretativa de que a parte esteja necessariamente presa ao fígado.
- source_word: עַל הַכְּלָיוֹת
  choice: junto com os rins
  rationale: Na fórmula sacrificial, a expressão comunica que o apêndice deve ser retirado juntamente com os rins; uma tradução estritamente espacial seria anatomicamente obscura em português.
- source_word: יְסִירֶנָּה
  choice: ele o removerá
  rationale: O hifil de סור expressa a instrução ritual de retirar essa parte. O futuro conserva em português o valor prescritivo do texto legal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de instrução ritual. A coordenação inicial foi preservada porque o versículo continua a enumeração do contexto anterior. O marcador da nota foi colocado junto de “apêndice”, termo ao qual a dúvida lexical realmente se refere.
