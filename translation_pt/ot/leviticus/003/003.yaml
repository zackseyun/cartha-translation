base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: pt
  text: Do sacrifício de comunhão, ele apresentará a Yahweh, como oferta feita por fogo,[a] a gordura que cobre as vísceras e toda a gordura que está sobre as vísceras,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de alimento”.
    reason: Alternativa lexical para אִשֶּׁה; esta pode ressaltar a oferta como dádiva cultual, enquanto o texto principal explicita a associação primária do termo com o fogo.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ele apresentará
  rationale: O hifil de קרב, em contexto sacrificial, indica a apresentação ritual da oferta. “Apresentará” conserva esse sentido formal e soa natural em português.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: do sacrifício de paz
  rationale: זֶבַח designa um sacrifício com abate, e שְׁלָמִים é a categoria tradicionalmente chamada de sacrifício ou oferta de paz. A formulação concisa preserva a categoria cultual e sua associação semântica com paz, bem-estar e comunhão.
- source_word: אִשֶּׁה
  choice: oferta de alimento
  rationale: No vocabulário sacerdotal, o termo designa uma dádiva oferecida a Deus e transformada em fumaça pelo fogo. “Oferta de alimento” comunica sua função cultual sem sugerir que o fogo seja a matéria da oferta; as traduções centradas no fogo são registradas em nota.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O texto traz diretamente o nome divino יהוה; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: Na legislação sacrificial, חֵלֶב refere-se às porções gordurosas do animal reservadas para a oferta.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: que cobre as vísceras
  rationale: O particípio הַמְכַסֶּה descreve a gordura que recobre os órgãos internos; “vísceras” é preciso e corrente em contexto anatômico.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: toda a gordura que está sobre elas
  rationale: A expressão distingue a gordura que cobre as vísceras de toda a gordura aderida a elas. O pronome evita repetição sem perder o referente anatômico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega o Tetragrama. A transliteração “Yahweh” mantém explicitamente o nome divino e evita substituí-lo por um título.
- issue: Sentido cultual de אִשֶּׁה
  choice: oferta de alimento
  alternative: oferta feita no fogo; oferta queimada
  rationale: A expressão pode enfatizar a dádiva cultual apresentada a Deus ou o meio pelo qual ela sobe em fumaça. O texto principal segue a leitura funcional, enquanto a nota conserva a alternativa ligada ao fogo sem eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e solene, com terminologia sacrificial compreensível. “Sacrifício de paz” mantém a designação tradicional da categoria; “vísceras” oferece precisão anatômica sem arcaísmo. A vírgula final reflete a continuidade sintática do versículo no contexto imediato.
