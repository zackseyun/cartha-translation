id: LEV.3.16
reference: Leviticus 3:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְטִירָ֥/ם הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֤חֶם אִשֶּׁה֙ לְ/רֵ֣יחַ נִיחֹ֔חַ כָּל חֵ֖לֶב לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: pt
  text: E o sacerdote os queimará sobre o altar como alimento, uma oferta feita pelo fogo, de aroma agradável. Toda a gordura é para Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Toda a gordura pertence a Yahweh».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: E o sacerdote os queimará
  rationale: O hifil de קטר, em contexto sacrificial, descreve a queima no altar, da qual sobe fumaça. O pronome «os» preserva o sufixo masculino plural e retoma as porções sacrificiais do contexto.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: A terminação direcional/locativa indica idiomaticamente o altar como lugar da queima; «sobre o altar» é natural e preciso em português.
- source_word: לֶחֶם אִשֶּׁה
  choice: como alimento, uma oferta feita pelo fogo
  rationale: לֶחֶם tem aqui o sentido amplo de alimento, não especificamente pão. A formulação conserva tanto a imagem de alimento como o caráter ígneo da oferta, sem tornar a expressão artificial.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Preserva a metáfora cultual de um aroma aceitável a Deus sem substituí-la por uma explicação teológica.
- source_word: כָּל חֵלֶב
  choice: Toda a gordura
  rationale: Mantém a força abrangente de כָּל e se refere às porções gordurosas sacrificiais reservadas a Deus.
- source_word: לַיהוָה
  choice: é para Yahweh
  rationale: A preposição ל pode indicar destinação ou pertença. A tradução formal «é para Yahweh» preserva essa amplitude melhor do que explicitar apenas posse.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome da aliança sem substituí-lo por um título.
- issue: Fórmula sacrificial לְרֵיחַ נִיחֹחַ
  choice: de aroma agradável
  alternative: de aroma suave; de aroma apaziguador
  rationale: A escolha mantém a metáfora e a ideia de aceitação, sem afirmar além do hebraico que o aroma apazigua Deus.
- issue: Sentido de לַיהוָה
  choice: é para Yahweh
  alternative: pertence a Yahweh
  rationale: A forma escolhida retém a tensão entre destinação sacrificial e pertença, sem resolver a preposição exclusivamente como posse.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem do hebraico foi ajustada apenas o necessário para a fluência, e a concisão da fórmula ritual foi preservada.
