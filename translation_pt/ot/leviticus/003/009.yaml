  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: pt
  text: 'Do sacrifício de comunhão[a], ele apresentará a Yahweh uma oferta feita pelo fogo: a gordura do animal, a cauda gorda inteira[b], que removerá junto à coluna vertebral[c], a gordura que cobre as vísceras e toda a gordura que está sobre as vísceras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “sacrifício de paz” ou “sacrifício de bem-estar”.
    reason: lexical_alternative
  - marker: b
    text: Trata-se da cauda larga e gordurosa de certas raças de ovelhas, retirada inteira para o sacrifício.
    reason: cultural_note
  - marker: c
    text: Ou “diante da coluna vertebral” ou “na base da espinha”. A expressão hebraica indica o ponto de remoção da cauda, mas sua localização anatômica exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifício de comunhão
  rationale: O termo técnico שְׁלָמִים pode envolver paz, bem-estar e comunhão. “Sacrifício de comunhão” é claro em português atual e comunica a dimensão relacional da oferta sem apagar as demais possibilidades, registradas em nota.
- source_word: אִשֶּׁה
  choice: oferta feita pelo fogo
  rationale: Designa uma oferta apresentada no altar mediante o fogo. A formulação preserva o caráter ritual sem sugerir alimento humano comum.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando seu caráter de nome próprio da aliança.
- source_word: חֶלְבּוֹ
  choice: a gordura do animal
  rationale: O sufixo pronominal remete ao animal sacrificado. A explicitação evita que “sua gordura” pareça referir-se ao ofertante.
- source_word: הָאַלְיָה תְמִימָה
  choice: a cauda gorda inteira
  rationale: אַלְיָה é a cauda larga e gordurosa de certas raças de ovelhas, e תְמִימָה indica que deve ser retirada inteira ou intacta.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: junto à coluna vertebral
  rationale: A expressão situa o ponto em que a cauda deve ser retirada em relação à espinha ou ao cóccix. “Junto à coluna vertebral” é anatômico e compreensível, enquanto a nota preserva outras leituras possíveis.
- source_word: יְסִירֶנָּה
  choice: que removerá
  rationale: O hifil de סור significa retirar ou remover; a oração relativa liga naturalmente a ação à cauda mencionada.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: a gordura que cobre as vísceras
  rationale: No contexto anatômico-sacrificial, קֶרֶב refere-se às partes internas ou vísceras. A tradução é concreta e mantém a imagem do hebraico.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: toda a gordura que está sobre as vísceras
  rationale: Mantém a distinção entre a gordura que cobre as vísceras e toda a gordura aderida ou situada sobre elas, além de repetir o termo por fidelidade ao hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva a função de nome próprio e evita substituí-lo por um título.
- issue: Sentido de זֶבַח הַשְּׁלָמִים
  choice: sacrifício de comunhão
  alternative: sacrifício de paz; sacrifício de bem-estar
  rationale: O termo reúne associações de paz, integridade, bem-estar e comunhão. A tradução principal favorece clareza ritual e relacional, enquanto a nota conserva a amplitude sem impor uma interpretação teológica exclusiva.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com terminologia ritual concreta. “Vísceras” é corrente e preciso; “coluna vertebral” oferece clareza anatômica. A ordem do hebraico foi levemente ajustada para fluência, sem eliminar as relações de aposição nem a repetição enfática de “gordura” e “vísceras”.
