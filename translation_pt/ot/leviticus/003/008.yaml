revisions:
- from: Porá a mão sobre a cabeça da sua oferta e a matará diante da tenda do encontro. Então os filhos de Arão lançarão o sangue contra o altar, ao redor.[a]
  to: Porá a mão sobre a cabeça da sua oferta e a abaterá diante da tenda do encontro; e os filhos de Arão lançarão o seu sangue contra o altar, por todos os lados.[a]
  rationale: A revisão conserva a ordem, os participantes e a linguagem ritual do hebraico. Substitui-se a conexão temporal interpretativa por coordenação, emprega-se «abaterá» para o animal sacrificial e esclarece-se que a ação com o sangue alcança todos os lados do altar. A nota foi ajustada para apresentar uma alternativa lexical direta, sem alterar o sentido do rito.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:35Z'
