  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: pt
  text: Porá a mão sobre a cabeça da sua oferta e a abaterá diante da tenda do encontro; e os filhos de Arão lançarão o seu sangue contra o altar, por todos os lados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arremessarão”. O verbo hebraico indica lançar o sangue com força numa ação ritual, e não uma aspersão suave.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Porá
  rationale: No contexto sacrificial, o verbo descreve o ato ritual de pôr ou apoiar a mão sobre a cabeça do animal. A formulação é natural e não acrescenta uma interpretação simbólica.
- source_word: יָדוֹ
  choice: a mão
  rationale: Mantém o substantivo no singular, conforme o hebraico; o possessivo fica claro pelo sujeito e pela expressão seguinte.
- source_word: רֹאשׁ
  choice: a cabeça
  rationale: Sentido anatômico normal nas instruções sacrificiais.
- source_word: קָרְבָּנוֹ
  choice: da sua oferta
  rationale: קָרְבָּן designa aquilo que é apresentado a Deus. “Oferta” preserva a amplitude do termo melhor que o mais restrito “sacrifício”.
- source_word: וְשָׁחַט
  choice: a matará
  rationale: O verbo é o termo técnico para matar um animal sacrificial. Em português corrente, “matará” comunica a ação com clareza, enquanto o contexto preserva seu caráter ritual; “abaterá” também seria possível.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa adequadamente a relação espacial e cultual de estar perante ou em frente à tenda.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução transparente da designação hebraica, natural em português e sem substituir o termo por uma explicação interpretativa.
- source_word: וְזָרְקוּ
  choice: lançarão
  rationale: זרק indica arremessar ou lançar o sangue em uma ação ritual vigorosa, não simplesmente aspergi-lo de maneira leve.
- source_word: בְּנֵי אַהֲרֹן
  choice: os filhos de Arão
  rationale: Reproduz com precisão a expressão familiar masculina do hebraico, sem ampliá-la para “descendentes” nem substituí-la por “sacerdotes”.
- source_word: דָּמוֹ
  choice: o sangue
  rationale: O referente é o animal da oferta. Em português, o artigo definido é natural e evita um possessivo desnecessário sem perder a referência.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contra o altar
  rationale: Com זרק, “contra o altar” comunica que o sangue é lançado sobre suas faces ou superfície, e não meramente colocado no topo.
- source_word: סָבִיב
  choice: ao redor
  rationale: Indica a distribuição do sangue em torno do altar, preservando de modo conciso o valor espacial do advérbio.
theological_decisions:
- issue: Imposição da mão no contexto sacrificial
  choice: Descrever simplesmente que o ofertante põe a mão sobre a cabeça da oferta.
  alternative: Usar uma formulação interpretativa que indique transferência de culpa ou identificação.
  rationale: O versículo prescreve a ação ritual, mas não explica aqui seu significado teológico. A tradução evita resolver essa questão por acréscimo.
- issue: Expressão masculina בְּנֵי אַהֲרֹן
  choice: os filhos de Arão
  alternative: os descendentes de Arão; os sacerdotes de Arão
  rationale: O hebraico diz especificamente “filhos”. Preservar essa forma evita neutralização ou explicação não expressa no texto.
- issue: Modo de aplicação do sangue
  choice: lançarão o sangue contra o altar
  alternative: aspergirão o sangue sobre o altar
  rationale: A escolha mantém a força concreta de זרק e distingue esta ação de verbos hebraicos usados mais especificamente para aspergir.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe acompanha de perto a sequência ritual do hebraico sem soar arcaica. O marcador [a] foi colocado após a oração referente ao lançamento do sangue, que é o ponto lexical explicado pela nota.
