source:
  edition: WLC
  text: חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶ֑ם כָּל חֵ֥לֶב וְ/כָל דָּ֖ם לֹ֥א תֹאכֵֽלוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: pt
  text: 'Este será um estatuto permanente[a], por todas as suas gerações, em todos os lugares onde vocês morarem: vocês não comerão gordura alguma nem sangue algum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estatuto perpétuo” ou “estatuto eterno”. Em contextos legais, o hebraico עוֹלָם frequentemente indica validade duradoura e contínua.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת
  choice: estatuto
  rationale: Preserva o caráter de norma fixa e vinculante da fórmula legal-covenantal, em linguagem clara e digna.
- source_word: עוֹלָם
  choice: permanente
  rationale: Comunica validade contínua e duradoura no contexto legal, sem impor necessariamente a ideia filosófica de duração absoluta e sem fim.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Mantém a expressão covenantal de continuidade da norma entre gerações sucessivas.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: em todos os lugares onde vocês morarem
  rationale: Expressa de modo natural e abrangente que a proibição se aplica em todo lugar de residência.
- source_word: כָּל חֵלֶב
  choice: gordura alguma
  rationale: No âmbito da proibição, 'alguma' transmite naturalmente a força abrangente de כָּל.
- source_word: וְכָל דָּם
  choice: nem sangue algum
  rationale: Mantém o paralelismo e a abrangência total da proibição.
- source_word: לֹא תֹאכֵלוּ
  choice: vocês não comerão
  rationale: O imperfeito com לֹא em material legal funciona como proibição; o futuro português conserva o tom estatutário.
theological_decisions:
- issue: Duração da ordem expressa por עוֹלָם
  choice: estatuto permanente
  alternative: estatuto perpétuo; estatuto eterno
  rationale: A fórmula legal hebraica enfatiza validade duradoura ao longo das gerações e em todos os locais de residência. 'Permanente' preserva essa força sem resolver indevidamente se o termo implica duração metafisicamente ilimitada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o tom jurídico da prescrição e explicita naturalmente a aplicação em todos os lugares de residência.
