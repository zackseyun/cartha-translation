  source_fidelity: 'A estrutura e os participantes correspondem ao hebraico: o ofertante põe uma só mão sobre a cabeça do animal, abate-o diante da Tenda do Encontro, e os filhos de Arão aplicam o sangue ao altar. Contudo, “matará” é mais genérico que שָׁחַט, verbo próprio de abate sacrificial, e “contra o altar, ao redor” deixa algo solta a distribuição indicada por סָבִיב.'
  naturalness: O texto é claro e de registro apropriado. A formulação final pode soar mais natural e precisa em português com “por todos os lados”, ligado explicitamente ao altar.
  terminology: “Tenda do Encontro”, “filhos de Arão” e “altar” são adequados. “Abaterá” preserva melhor o valor ritual de שָׁחַט sem arcaísmo. A capitalização de “Tenda do Encontro” trata a expressão como a designação cultual estabelecida.
