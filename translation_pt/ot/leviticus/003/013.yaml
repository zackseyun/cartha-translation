    rationale: “Contra o altar, por todos os lados” torna explícita a aplicação do sangue em torno do altar, sem especificar além do hebraico.
  revised_text: Porá a mão sobre a cabeça do animal e o abaterá diante da Tenda do Encontro; então os filhos de Arão lançarão o sangue contra o altar, por todos os lados.
