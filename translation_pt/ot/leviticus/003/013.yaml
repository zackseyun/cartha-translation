base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: pt
  text: Porá a mão sobre a cabeça do animal e o abaterá diante da Tenda do Encontro; então os filhos de Arão lançarão o sangue contra o altar, por todos os lados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ
  choice: Porá a mão
  rationale: A expressão hebraica descreve o gesto ritual de pôr ou apoiar a mão sobre o animal. O singular explícito de יָדוֹ foi preservado.
- source_word: עַל־רֹאשׁוֹ
  choice: sobre a cabeça do animal
  rationale: O sufixo remete ao animal oferecido. Explicitar “do animal” evita, em português, a possível leitura de que a cabeça seria da própria pessoa.
- source_word: וְשָׁחַט אֹתוֹ
  choice: e o matará
  rationale: שׁחט designa o abate, especialmente em contexto sacrificial. “Matará” é natural e claro; o contexto comunica o caráter ritual sem exigir o termo mais técnico “abaterá”.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: diante da tenda do encontro
  rationale: “Diante de” preserva a relação espacial, e “tenda do encontro” traduz de modo direto a designação cultual אֹהֶל מוֹעֵד.
- source_word: וְזָרְקוּ
  choice: lançarão
  rationale: זרק indica lançar ou arremessar o sangue na aplicação ritual. “Lançarão” preserva a força concreta do verbo e evita confundi-lo com verbos hebraicos específicos para aspergir.
- source_word: בְּנֵי אַהֲרֹן
  choice: os filhos de Arão
  rationale: Mantém a designação sacerdotal formal e a relação construta do hebraico.
- source_word: אֶת־דָּמוֹ
  choice: o sangue
  rationale: Em português, o artigo definido é suficiente para retomar naturalmente o sangue do animal já mencionado.
- source_word: עַל־הַמִּזְבֵּחַ סָבִיב
  choice: contra o altar, ao redor
  rationale: Com זרק, “contra o altar” comunica a aplicação lançada do sangue; “ao redor” preserva a distribuição em torno do altar.
