base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: pt
  text: e os dois rins, a gordura que há sobre eles, que está sobre os lombos, e o apêndice sobre o fígado[a], ele o removerá com os rins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lobo sobre o fígado”. O termo hebraico para essa parte anatômica é incerto; por isso, o texto usa “apêndice” sem pretender uma identificação mais precisa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre os rins”. Aqui, a expressão provavelmente indica que essa parte deve ser retirada junto com os rins.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: os dois rins
  rationale: A expressão designa claramente os dois rins na anatomia sacrificial; o numeral é preservado.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: No contexto sacrificial levítico, refere-se às porções gordurosas separadas para a oferta. “A gordura” é claro e natural em português.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: que há sobre eles
  rationale: Mantém a relação espacial da oração hebraica com os rins, em formulação portuguesa natural.
- source_word: הַכְּסָלִים
  choice: os lombos
  rationale: O termo indica a região lombar ou dos flancos. “Lombos” conserva a designação anatômica tradicional sem excluir a amplitude do hebraico.
- source_word: הַיֹּתֶרֶת
  choice: o apêndice
  rationale: A identificação anatômica exata é incerta; “apêndice” expressa uma parte saliente ou anexa sem alegar precisão indevida.
- source_word: עַל הַכָּבֵד
  choice: do fígado
  rationale: Embora עַל seja literalmente “sobre”, em português “apêndice do fígado” expressa naturalmente a associação anatômica. A incerteza sobre a parte específica é indicada em nota.
- source_word: עַל הַכְּלָיֹת
  choice: com os rins
  rationale: No contexto processual, a expressão provavelmente indica que a parte associada ao fígado deve ser retirada juntamente com os rins; a nota preserva o sentido espacial literal.
- source_word: יְסִירֶנָּה
  choice: ele o removerá
  rationale: O hifil de סור indica remoção. O pronome singular retoma o apêndice, como na forma hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente reorganizada para deixar claro que o pronome singular de “removerá” se refere ao apêndice, preservando a sequência dos elementos sacrificiais e as incertezas anatômicas do hebraico.
