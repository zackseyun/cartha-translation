  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: pt
  text: E os filhos de Arão o queimarão sobre o altar, por cima do holocausto que está sobre a lenha que está sobre o fogo. É uma oferta feita pelo fogo[a], de aroma agradável para Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “oferta de alimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוּ אֹתוֹ
  choice: o queimarão
  rationale: O hifil de קטר, em contexto sacrificial, indica queimar no altar, fazendo a oferta subir em fumaça. A forma futura expressa a instrução ritual, e o pronome retoma a porção descrita no versículo anterior.
- source_word: בְנֵי אַהֲרֹן
  choice: os filhos de Arão
  rationale: Tradução direta e natural do construto hebraico, preservando a designação familiar e sacerdotal.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Expressa o destino e o local da queima sacrificial; a terminação direcional hebraica não exige formulação separada em português.
- source_word: עַל הָעֹלָה
  choice: em cima do holocausto
  rationale: O uso de עַל indica mais naturalmente a colocação sobre o holocausto; 'holocausto' é o termo bíblico consagrado e ainda compreensível para עֹלָה.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: que está sobre a lenha que está sobre o fogo
  rationale: Mantém a descrição encadeada da disposição no altar e traduz עֵצִים sem especificá-la indevidamente como toras.
- source_word: אִשֵּׁה
  choice: oferta de alimento
  rationale: O termo é uma expressão sacrificial técnica associada à porção oferecida a Yahweh no altar. 'Oferta de alimento' comunica essa categoria cultual, enquanto a alternativa tradicional ligada ao fogo é preservada em nota.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma agradável
  rationale: Expressa de modo natural a fórmula sacrificial que indica agrado e aceitação, sem sugerir necessariamente um efeito calmante.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino explícito יהוה e representa naturalmente a relação marcada pela preposição ל.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de אִשֵּׁה na fórmula sacrificial
  choice: oferta de alimento
  alternative: oferta queimada; oferta feita pelo fogo
  rationale: O termo admite discussão etimológica e cultual. No uso levítico, 'oferta de alimento' destaca a porção do altar sem implicar consumo divino literal; a tradução tradicional relacionada ao fogo permanece em nota para preservar a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de 'sobre' e da oração relativa foi mantida para refletir a disposição ritual cuidadosamente encadeada no hebraico.
