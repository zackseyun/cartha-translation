  verdict: revise
  source_fidelity: A instrução ritual, a referência à porção previamente indicada, a disposição «sobre o holocausto ... sobre a lenha ... sobre o fogo» e o nome Yahweh estão bem representados. Contudo, אִשֶּׁה é um termo técnico cuja referência ao fogo é lexicalmente mais segura do que «oferta de alimento» como tradução principal; esta última depende de uma explicação cultual/etimológica discutida.
  naturalness: O texto é claro e de registro bíblico moderno. «Por cima do» é um pouco mais natural e menos coloquial que «em cima do» neste contexto ritual, e «para Yahweh» exprime mais idiomaticamente a dedicação da oferta.
  terminology: «Holocausto», «altar», «filhos de Arão» e «Yahweh» são adequados. «Oferta feita pelo fogo» preserva o caráter técnico de אִשֶּׁה sem impor a interpretação de que se trata literalmente de alimento divino; a possibilidade de «oferta de alimento» deve ficar em nota.
