base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: pt
  text: e os dois rins, a gordura que está sobre eles, que está sobre os lombos, e o apêndice sobre o fígado[a], que ele removerá com os rins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o lobo sobre o fígado”. O termo hebraico para essa parte anatômica (יֹתֶרֶת) é incerto; “apêndice” evita dar uma precisão maior do que o texto permite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: os dois rins
  rationale: O hebraico designa diretamente os rins na anatomia sacrificial.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: a gordura que os cobre
  rationale: No contexto sacrificial, חֵלֶב é a gordura interna reservada para a oferta; 'que os cobre' expressa naturalmente sua posição sobre os rins.
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: junto aos lombos
  rationale: כְּסָלִים indica a região dos lombos ou flancos; a formulação preserva a localização sem sugerir precisão anatômica excessiva.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: o apêndice do fígado
  rationale: O termo יֹתֶרֶת é anatomicamente incerto e pode indicar um apêndice ou lobo associado ao fígado; 'apêndice' evita especificidade indevida.
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: que ele removerá com os rins
  rationale: A expressão comunica a retirada conjunta dessa parte e dos rins, mantendo o futuro prescritivo da instrução ritual.
