  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: pt
  text: 'Da sua oferta apresentará a Yahweh uma oferta feita no fogo[a]: a gordura que cobre as vísceras e toda a gordura que está sobre as vísceras,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de alimento”. O sentido exato do termo hebraico é discutido; tradicionalmente ele é entendido como uma oferta feita no fogo.
    reason: Alternativa lexical para אִשֶּׁה.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: apresentará
  rationale: O hifil de קרב, em contexto sacrificial, indica apresentar formalmente uma oferta; “apresentará” conserva o sentido ritual e soa natural em português.
- source_word: מִמֶּנּוּ
  choice: Dela
  rationale: O sufixo retoma o animal sacrificial mencionado no contexto; o feminino concorda naturalmente com “oferta” ou “vítima” subentendida em português.
- source_word: קָרְבָּנוֹ
  choice: sua oferta
  rationale: קָרְבָּן é um termo sacrificial técnico, para o qual “oferta” é o equivalente português claro e consagrado.
- source_word: אִשֶּׁה
  choice: uma oferta feita no fogo
  rationale: A expressão comunica o caráter sacrificial do termo sem pressupor que ele signifique simplesmente “alimento”; a nota registra a alternativa lexical legítima.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da apresentação sacrificial, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: No ritual sacrificial, חֵלֶב designa as porções gordurosas reservadas para serem queimadas no altar.
- source_word: הַמְכַסֶּה
  choice: que cobre
  rationale: O particípio modifica “a gordura” e é expresso naturalmente por uma oração relativa.
- source_word: הַקֶּרֶב
  choice: as vísceras
  rationale: Neste contexto anatômico, קֶרֶב se refere às partes ou aos órgãos internos da cavidade abdominal; “vísceras” é preciso e corrente.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: e toda a gordura que está sobre as vísceras
  rationale: A tradução preserva a abrangência de כָּל e a relação espacial expressa por עַל.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama, e “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de אִשֶּׁה na terminologia sacrificial
  choice: oferta feita no fogo
  alternative: oferta de alimento
  rationale: O termo admite discussão lexical. A tradução principal conserva sua associação tradicional ao fogo sacrificial, enquanto a nota mantém disponível a leitura “oferta de alimento”, sem resolver indevidamente a questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com terminologia ritual clara. A vírgula final foi preservada porque o versículo continua sintaticamente no versículo seguinte.
