source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: pt
  text: Todo homem da descendência de Arão que tiver uma doença de pele[a] ou um corrimento não comerá das coisas sagradas até ficar puro. E quem tocar em qualquer coisa impura por causa de um morto[b], ou em um homem que tiver uma emissão de sêmen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “lepra”. O termo hebraico abrange uma afecção cutânea que causava impureza ritual, não necessariamente a hanseníase moderna.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em qualquer pessoa que tenha ficado impura por causa de um cadáver”. A expressão hebraica é idiomática e se refere à impureza relacionada a um morto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Todo homem
  rationale: A repetição idiomática tem sentido distributivo, “todo e qualquer homem”; a formulação mantém o referente masculino exigido pelo contexto dos descendentes sacerdotais de Arão.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: da descendência de Arão
  rationale: זֶרַע designa aqui linhagem ou descendentes, não semente em sentido literal.
- source_word: צָרוּעַ
  choice: tiver uma doença de pele
  rationale: O termo designa uma afecção cutânea que causa impureza ritual e não deve ser identificado de modo restrito com a hanseníase moderna.
- source_word: זָב
  choice: tiver um corrimento
  rationale: Refere-se a uma secreção corporal que produz impureza ritual; “corrimento” é claro, conciso e digno em português.
- source_word: בַּקֳּדָשִׁים
  choice: das coisas sagradas
  rationale: A expressão abrange as porções consagradas que podiam servir de alimento aos sacerdotes.
- source_word: לֹא יֹאכַל
  choice: não comerá
  rationale: Mantém o registro jurídico da proibição sem recorrer a uma construção arcaizante.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: até ficar puro
  rationale: O verbo indica a passagem ao estado de pureza ritual; “ficar puro” expressa essa mudança de estado.
- source_word: וְהַנֹּגֵעַ
  choice: Isso também se aplica a quem tocar
  rationale: O particípio substantivado introduz outro caso de impedimento. A formulação explicita de maneira natural a ligação jurídica com a proibição anterior, sem alterar seu conteúdo.
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: em qualquer coisa impura por causa de um morto
  rationale: A expressão é compacta e idiomática, relacionando a impureza ao contato com um cadáver; a tradução preserva sua amplitude e a nota registra outra análise possível.
- source_word: שִׁכְבַת זָרַע
  choice: uma emissão de sêmen
  rationale: Tradução direta e atual do idioma hebraico, sem eufemismo nem vulgaridade.
- source_word: תֵּצֵא מִמֶּנּוּ
  choice: tiver
  rationale: Em português natural, “um homem que tiver uma emissão de sêmen” comunica o evento expresso literalmente como algo que sai dele.
theological_decisions:
- issue: Terminologia de impureza ritual sem pressupostos médicos posteriores
  choice: “doença de pele” e “ficar puro”
  alternative: “lepra” e “ser curado/purificado”
  rationale: O texto regula a aptidão ritual dos sacerdotes; não apresenta diagnóstico médico moderno nem caracteriza a condição como culpa moral.
- issue: Sujeito masculino da legislação
  choice: “Todo homem da descendência de Arão”
  alternative: “Qualquer pessoa descendente de Arão”
  rationale: O masculino é tanto gramatical quanto contextual, pois a norma trata dos descendentes arônicos do sexo masculino que exerciam o sacerdócio.
- issue: Sentido da impureza associada a נֶפֶשׁ
  choice: Manter a referência ampla a algo impuro por causa de um morto
  alternative: Especificar “uma pessoa que ficou impura por contato com um cadáver”
  rationale: A construção hebraica é idiomática e admite discussão quanto ao referente imediato; o texto principal evita restringi-la silenciosamente, e a nota apresenta a leitura alternativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário ritual consistente. A vírgula final foi mantida porque o período e a enumeração continuam no versículo seguinte. Os marcadores foram colocados junto aos termos efetivamente explicados por suas notas.
