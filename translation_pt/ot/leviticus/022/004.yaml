  naturalness: O português é claro e de registro apropriado. A substituição por “E quem tocar” é mais próxima da sintaxe deliberadamente continuada do hebraico e preserva naturalmente a vírgula final, pois a enumeração prossegue no versículo seguinte.
  terminology: “Doença de pele”, “corrimento”, “coisas sagradas”, “puro” e “emissão de sêmen” são escolhas adequadas e atuais. As notas preservam corretamente a ressalva contra identificar a condição com hanseníase moderna e registram a dificuldade de בְּכָל טְמֵא נֶפֶשׁ.
