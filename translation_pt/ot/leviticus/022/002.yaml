  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: pt
  text: Fale a Arão e a seus filhos para que se abstenham das coisas sagradas dos filhos de Israel[a] — coisas que os israelitas consagram para mim[b] — e não profanem o meu santo nome. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do povo de Israel” ou “dos israelitas”. “Filhos de Israel” reproduz a expressão formal hebraica.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as coisas sagradas que os israelitas consagram a Yahweh.
    reason: referent_clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel de דבר introduz a ordem divina dirigida a Moisés. “Fale” é direto, natural e preserva o caráter discursivo da fórmula.
- source_word: וְיִנָּזְרוּ
  choice: para que se abstenham
  rationale: O nifal de נזר expressa afastamento voluntário ou abstenção em relação às coisas sagradas. “Abstenham-se” comunica o sentido reflexivo e cultual sem sugerir uma separação física permanente.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: das coisas sagradas dos filhos de Israel
  rationale: “Coisas sagradas” mantém a amplitude de קָדְשֵׁי, que pode abranger diferentes ofertas ou dádivas consagradas, sem restringir indevidamente o referente.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão nacional e pactual formal do hebraico. Uma nota oferece equivalentes idiomáticos que deixam explícito que se trata do povo de Israel.
- source_word: יְחַלְּלוּ
  choice: profanem
  rationale: No contexto de santidade sacerdotal, o piel de חלל significa tratar como comum ou profanar. “Profanem” conserva o registro cultual e teológico.
- source_word: שֵׁם קָדְשִׁי
  choice: o meu santo nome
  rationale: Tradução natural da construção hebraica, preservando a importância pactual do nome divino.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: coisas que os israelitas consagram para mim
  rationale: 'A formulação explicita o referente mais provável da oração relativa: as coisas sagradas consagradas pelos israelitas. “Consagram” preserva o vocabulário de santidade, e “para mim” expressa a destinação indicada por לִי.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Referente de אֲשֶׁר הֵם מַקְדִּשִׁים לִי (“que eles consagram para mim”)
  choice: A oração se refere às coisas sagradas dos filhos de Israel.
  alternative: A oração pode ser associada, na sequência superficial da frase, ao “meu santo nome”.
  rationale: O contexto cultual e o verbo “consagrar” favorecem como objeto implícito as coisas sagradas oferecidas por Israel. A repetição explicativa “coisas que os israelitas...” evita que, em português, “eles” seja entendido como Arão e seus filhos.
- issue: Força da ordem de afastamento
  choice: “Abstenham-se” sem acrescentar no corpo do versículo a condição específica de impureza.
  alternative: Explicitar “quando estiverem impuros” com base no contexto subsequente.
  rationale: Os versículos seguintes esclarecem as condições da proibição, mas essa qualificação não aparece expressamente em 22:2 e, por isso, não deve ser importada para o texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção foi levemente reorganizada por travessões para ligar claramente a oração relativa às coisas sagradas, sem perder a coordenação da ordem. O termo cultual “profanem” foi mantido por sua precisão.
