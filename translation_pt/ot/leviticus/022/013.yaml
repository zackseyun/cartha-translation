source:
  edition: WLC
  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: pt
  text: Mas, se a filha de um sacerdote ficar viúva ou divorciada, não tiver descendência e voltar para a casa de seu pai, como na juventude, poderá comer do alimento de seu pai[a]. Porém, nenhuma pessoa não autorizada poderá comer dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do pão de seu pai”. Aqui, “pão” provavelmente se refere de modo mais amplo às provisões alimentares da família sacerdotal.
    reason: lexical_alternative
  - marker: b
    text: Ou “nenhuma pessoa de fora”. O termo hebraico indica alguém fora do círculo sacerdotal autorizado, não necessariamente um estrangeiro por etnia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: Mas, se a filha de um sacerdote
  rationale: A conjunção introduz contraste com o contexto anterior, e כִּי estabelece a condição; esta formulação é natural em português e preserva a relação familiar e sacerdotal.
- source_word: כִּי תִהְיֶה אַלְמָנָה וּ/גְרוּשָׁה
  choice: ficar viúva ou divorciada
  rationale: היה indica a passagem ou chegada a essa condição. Embora o hebraico coordene os termos com וּ, eles representam situações legais alternativas, adequadamente expressas por “ou” em português.
- source_word: וְ/זֶרַע אֵין לָהּ
  choice: não tiver descendência
  rationale: זֶרַע significa literalmente “semente”, mas aqui designa prole ou descendência; “descendência” preserva melhor sua amplitude do que “filho”.
- source_word: וְ/שָׁבָה אֶל בֵּית אָבִיהָ
  choice: e voltar para a casa de seu pai
  rationale: שׁוב expressa retorno à família paterna; “voltar” é claro e corrente.
- source_word: כִּ/נְעוּרֶיהָ
  choice: como na juventude
  rationale: Mantém a comparação com sua condição anterior, antes do casamento, sem acrescentar uma explicação não expressa no texto.
- source_word: מִ/לֶּחֶם אָבִיהָ תֹּאכֵל
  choice: poderá comer do alimento de seu pai
  rationale: לֶחֶם é literalmente “pão”, mas pode designar alimento em sentido amplo. O modal “poderá” comunica a permissão legal implícita no contexto.
- source_word: וְ/כָל זָר
  choice: Porém, nenhuma pessoa não autorizada
  rationale: זָר, na legislação sacerdotal, designa quem está fora do círculo autorizado, não necessariamente um estrangeiro étnico. A expressão explicita essa distinção sem restringi-la indevidamente.
- source_word: לֹא יֹאכַל בּוֹ
  choice: poderá comer dele
  rationale: Com a negação precedente, a formulação expressa proibição legal. “Dele” retoma o alimento do pai.
theological_decisions:
- issue: Sentido de לֶחֶם no contexto das provisões sacerdotais
  choice: alimento
  alternative: pão
  rationale: No contexto de Levítico 22, o termo abrange as provisões das quais a família sacerdotal está autorizada a comer. “Alimento” comunica esse sentido sem especificar além do texto.
- issue: Identidade de זָר
  choice: pessoa não autorizada
  alternative: estrangeiro ou pessoa de fora
  rationale: O critério no contexto é a falta de autorização para participar do alimento sacerdotal, não a origem étnica; a tradução evita uma leitura nacional ou étnica indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe legal foi mantida clara; evitou-se linguagem arcaica e preservaram-se o caráter condicional e o alcance contextual dos termos sacerdotais.
