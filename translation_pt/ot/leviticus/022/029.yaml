source:
  edition: WLC
  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: pt
  text: Quando vocês sacrificarem a Yahweh uma oferta de gratidão[a], sacrifiquem-na para que seja aceita em favor de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sacrifício de ação de graças” ou “um sacrifício de gratidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Quando
  rationale: No contexto legal, introduz a ocasião em que a instrução se aplica; em português, “Quando” expressa naturalmente esse valor temporal-condicional.
- source_word: תִזְבְּחוּ
  choice: sacrificarem
  rationale: O verbo זבח é o termo sacrificial apropriado; “sacrificar” mantém o sentido cultual e permite conservar a repetição hebraica.
- source_word: זֶבַח תּוֹדָה
  choice: uma oferta de gratidão
  rationale: Designa um sacrifício caracterizado pela ação de graças. A expressão é clara e corrente, enquanto a alternativa mais formal é registrada em nota.
- source_word: לַ/יהוָה
  choice: a Yahweh
  rationale: A preposição indica o destinatário da oferta, e o nome divino é transliterado como “Yahweh”.
- source_word: לִֽ/רְצֹנְ/כֶם
  choice: de modo que sejam aceitos
  rationale: No contexto sacrificial, רָצוֹן aponta para aceitação ou favor, não primariamente para a vontade subjetiva dos ofertantes. A formulação portuguesa comunica que o sacrifício deve resultar na aceitação deles.
- source_word: תִּזְבָּחוּ
  choice: sacrifiquem-na
  rationale: Mantém a repetição enfática do verbo no hebraico; o pronome retoma naturalmente a oferta.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido de לִרְצֹנְכֶם no contexto sacrificial
  choice: de modo que sejam aceitos
  alternative: para a aceitação de vocês; segundo a vontade de vocês
  rationale: A leitura de aceitação cultual é a mais adequada ao contexto, mas a tradução evita especificar além do texto quem efetua a aceitação ou formular uma teoria particular da eficácia do sacrifício.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento plural por “vocês”. A repetição de “sacrificar” reflete a ênfase do hebraico. “De modo que sejam aceitos” é mais natural em português do que o substantivo abstrato “para a aceitação de vocês” e preserva o sentido cultual provável.
