lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, nesta fórmula narrativa de comunicação divina, é traduzido naturalmente por “falou”, preservando a ideia de um novo ato de fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; “a” é a construção portuguesa natural com o verbo “falar”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que liga a declaração introdutória ao discurso direto iniciado no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título; a nota registra a tradução tradicional.
translation_notes:
  register: Português moderno, claro e digno. A construção “falou a Moisés, dizendo” conserva deliberadamente a fórmula solene e recorrente do hebraico, embora seja um pouco mais formal que a fala cotidiana.
