  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: pt
  text: E da mão de um estrangeiro, não apresentem nenhum desses animais como alimento do seu Deus[a], pois a deformidade deles está neles; há neles um defeito[b]. Eles não serão aceitos em favor de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pão do seu Deus». Aqui, «pão» é uma expressão sacrificial hebraica para o alimento apresentado a Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou «uma mancha». O termo hebraico se refere a um defeito que desqualifica um animal para o sacrifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: Da mão de
  rationale: Preserva o idioma hebraico que indica a procedência da oferta e continua compreensível em português.
- source_word: בֶּן נֵכָר
  choice: um estrangeiro
  rationale: A expressão hebraica, literalmente «filho de estrangeiro», designa de modo idiomático uma pessoa estrangeira ou não israelita.
- source_word: תַקְרִיבוּ
  choice: não apresentem
  rationale: No contexto sacrificial, o hifil de קרב significa apresentar ou oferecer; «apresentem» comunica o ato cultual com naturalidade.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: alimento do seu Deus
  rationale: Embora לֶחֶם signifique literalmente «pão», na linguagem sacerdotal pode designar de modo mais amplo o alimento apresentado a Deus.
- source_word: מִכָּל אֵלֶּה
  choice: nenhum desses animais
  rationale: Explicita o referente contextual — os animais impróprios mencionados anteriormente — e transmite a força partitiva da expressão.
- source_word: מָשְׁחָתָם
  choice: sua corrupção
  rationale: Mantém a ideia de deterioração, dano ou deformação que torna os animais impróprios, sem fundi-la com a menção seguinte ao defeito.
- source_word: מוּם
  choice: um defeito
  rationale: É o termo habitual nesta seção para uma falha física que desqualifica um animal para o sacrifício.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: não serão aceitos em favor de vocês
  rationale: Expressa o sentido sacrificial do nifal de רצה e preserva לָכֶם, indicando que os animais não obterão aceitação em benefício dos ofertantes.
theological_decisions:
- issue: Expressão cultual para a dádiva sacrificial
  choice: alimento do seu Deus
  alternative: pão do seu Deus
  rationale: «Alimento» comunica o uso sacerdotal amplo de לֶחֶם sem sugerir que o texto esteja falando somente de pão, enquanto a nota preserva a forma literal.
- issue: Aceitação sacrificial em relação aos ofertantes
  choice: não serão aceitos em favor de vocês
  alternative: não serão aceitáveis para vocês
  rationale: A formulação preserva a relação entre a aceitação da oferta e os ofertantes sem explicar além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais naturais no plural. A expressão «da mão de» conserva o idioma hebraico; «em favor de vocês» mantém a dimensão relacional da aceitação sacrificial. A repetição entre «corrupção» e «defeito» foi preservada por corresponder à formulação enfática do texto-fonte.
