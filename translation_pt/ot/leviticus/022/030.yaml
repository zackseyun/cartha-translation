source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: pt
  text: Naquele mesmo dia[a] deverá ser comido; não deixem nada dele até a manhã. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “naquele dia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: naquele mesmo dia
  rationale: A expressão significa literalmente “naquele dia”; “mesmo” explicita de modo natural a restrição ao próprio dia da oferta, sem alterar o sentido contextual.
- source_word: יֵאָכֵל
  choice: deverá ser comido
  rationale: O nifal imperfeito tem aqui valor passivo e prescritivo. A formulação conserva tanto a voz passiva quanto o tom legal.
- source_word: לֹא תוֹתִירוּ
  choice: não deixem nada
  rationale: O hifil de יתר significa deixar como sobra. Esta formulação comunica com clareza a proibição dirigida ao plural.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: O sufixo pronominal retoma o sacrifício ou seu alimento; depois de “nada”, “dele” é a equivalência portuguesa mais concisa.
- source_word: עַד בֹּקֶר
  choice: até a manhã
  rationale: Expressão temporal comum que proíbe guardar qualquer porção durante a noite.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Mantém a fórmula hebraica de autoidentificação e representa diretamente o nome divino יהוה.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com tom jurídico-prescritivo. O plural de תוֹתִירוּ é expresso por “não deixem”. A nota inglesa b não foi reproduzida porque identifica como alternativa uma expressão que já consta no texto e parece resultar de desalinhamento editorial.
