  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: pt
  text: e assim os farão incorrer em culpa que exige reparação[a], ao comerem suas coisas sagradas[b], pois eu sou Yahweh, que os santifica[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e trariam sobre eles a culpa”. A expressão hebraica é difícil e pode enfatizar a responsabilidade decorrente de uma transgressão que exige reparação.'
    reason: lexical_alternative
  - marker: b
    text: “Suas coisas sagradas” refere-se a porções ou ofertas consagradas.
    reason: cultural_note
  - marker: c
    text: 'Ou: “que os torna santos” ou “que os consagra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: e assim os fariam carregar
  rationale: 'O hifil de נשׂא tem sentido causativo: fazer alguém carregar ou incorrer em algo. “E assim” expressa a ligação consequencial com a proibição anterior sem ampliar indevidamente o texto.'
- source_word: עֲוֺן אַשְׁמָה
  choice: culpa que exige reparação
  rationale: A combinação de עָוֹן com אַשְׁמָה indica culpa ou responsabilidade por uma transgressão no contexto cultual, possivelmente com obrigação reparatória; a formulação comunica essa força jurídica e religiosa.
- source_word: בְּאָכְלָם
  choice: ao comerem
  rationale: A preposição בְּ com o infinitivo construto indica circunstância ou meio. “Ao comerem” mantém de modo natural a relação exata sem decidir além do necessário se a nuance é temporal ou instrumental.
- source_word: קָדְשֵׁיהֶם
  choice: suas coisas sagradas
  rationale: Tradução próxima do sentido literal, “as coisas sagradas deles”. No contexto, trata-se de porções ou ofertas consagradas, esclarecidas em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מְקַדְּשָׁם
  choice: que os santifica
  rationale: O particípio piel de קדשׁ significa santificar, tornar santo ou consagrar. “Santifica” preserva o registro cultual e teológico de Levítico.
theological_decisions:
- issue: Referente de “os” em “que os santifica”
  choice: Manter o pronome masculino plural sem explicitar o referente
  alternative: Explicitar “que santifica os sacerdotes/israelitas” ou entender que Yahweh santifica as coisas sagradas
  rationale: O sufixo hebraico remete mais naturalmente às pessoas em vista no contexto, mas a tradução pronominal preserva a sintaxe e evita impor no texto principal uma identificação mais estreita do que o hebraico exige.
- issue: Força cultual de עֲוֺן אַשְׁמָה
  choice: culpa que exige reparação
  alternative: culpa; culpa por sacrilégio; castigo pela transgressão
  rationale: A expressão reúne culpa e responsabilidade cultual. A tradução conserva a implicação reparatória sem afirmar de forma categórica que o texto menciona especificamente uma oferta pela culpa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “ao comerem” conserva a concisão e alguma ambiguidade do hebraico quanto à relação circunstancial ou instrumental; “coisas sagradas” mantém a formulação concreta do original, apoiada por nota explicativa.
