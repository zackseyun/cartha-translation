  text: for your acceptance, it must be a sound male from the cattle, the sheep, or the goats.
translation:
  language: pt
  text: Para que seja aceito em favor de vocês, deverá ser um macho sem defeito, dentre o gado bovino, as ovelhas ou as cabras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: Para que seja aceito em favor de vocês
  rationale: Expressa a finalidade ligada à aceitação da oferta e preserva a referência aos ofertantes, sem reduzir o termo à ideia moderna de vontade ou agrado.
- source_word: תָּמִים
  choice: sem defeito
  rationale: No contexto sacrificial, indica integridade física e ausência de defeito desqualificador; esta formulação é natural e precisa em português.
- source_word: זָכָר
  choice: macho
  rationale: Mantém diretamente a exigência de sexo do animal.
- source_word: בַּבָּקָר
  choice: dentre os bovinos
  rationale: Designa animais do gado bovino de modo abrangente, sem limitar indevidamente a bois adultos.
- source_word: בַּכְּשָׂבִים וּבָעִזִּים
  choice: os carneiros ou os bodes
  rationale: Como זָכָר já exige um macho, os nomes masculinos comunicam naturalmente animais machos dos rebanhos ovino e caprino.
theological_decisions:
- issue: Sentido de aceitação em לִרְצֹנְכֶם
  choice: Para que seja aceito em favor de vocês
  alternative: conforme a vontade de vocês
  rationale: O contexto imediato trata das condições para que uma oferta seja aceita; a tradução evita transformar a expressão numa simples preferência pessoal dos ofertantes.
- issue: Qualidade sacrificial de תָּמִים
  choice: sem defeito
  alternative: perfeito / sadio
  rationale: “Sem defeito” preserva o sentido cultual objetivo sem sugerir perfeição absoluta nem restringir o requisito apenas à saúde.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção mantém a finalidade da oferta e a sequência das três categorias de animais do hebraico.
