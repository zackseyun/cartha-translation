id: LEV.22.12
reference: Leviticus 22:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: pt
  text: Mas, se a filha de um sacerdote se casar com alguém de fora da família sacerdotal[a], não comerá da contribuição das coisas sagradas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com alguém que não pertence ao sacerdócio”; literalmente, “com um homem de fora”. Neste contexto, trata-se de alguém de fora da família sacerdotal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “das ofertas sagradas” ou “dos presentes sagrados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת כֹּהֵן
  choice: Mas, se a filha de um sacerdote
  rationale: O waw é entendido como adversativo no contraste com as regras anteriores, e a relação de construto é expressa naturalmente como “a filha de um sacerdote”.
- source_word: כִּי תִהְיֶה לְאִישׁ זָר
  choice: se casar com alguém de fora da família sacerdotal
  rationale: A construção indica que a filha passa à condição de casada. זָר designa aqui alguém fora do círculo sacerdotal, não necessariamente um estrangeiro étnico.
- source_word: בִּתְרוּמַת הַקֳּדָשִׁים
  choice: da contribuição das coisas sagradas
  rationale: “Contribuição” conserva o sentido de algo separado e entregue, enquanto “coisas sagradas” mantém a abrangência do plural hebraico.
- source_word: לֹא תֹאכֵל
  choice: não comerá
  rationale: O futuro em formulação legal portuguesa transmite a força prescritiva do imperfeito hebraico negado.
theological_decisions:
- issue: Sentido de זָר na legislação sacerdotal
  choice: alguém de fora da família sacerdotal
  alternative: estrangeiro; leigo; não sacerdote
  rationale: O contexto trata do direito de participar dos alimentos sagrados no âmbito da casa sacerdotal. A tradução evita transformar a distinção cultual e familiar em distinção étnica, sem restringi-la simplesmente à ordenação sacerdotal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação legal “não comerá” preserva o tom normativo; as notas registram alternativas lexicais genuínas sem sobrecarregar o versículo.
