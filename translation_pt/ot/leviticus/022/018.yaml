  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: pt
  text: '“Fale a Arão, aos filhos dele e a todos os filhos de Israel[a] e diga-lhes: Qualquer homem da casa de Israel ou do estrangeiro residente em Israel[b] que apresentar sua oferta em cumprimento de qualquer dos seus votos ou como uma de suas ofertas voluntárias[c] a Yahweh, como holocausto —”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, “todos os israelitas”. O hebraico diz literalmente “todos os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico גֵּר designa um não israelita que residia entre o povo de Israel sob sua ordem comunitária.
    reason: lexical_clarification
  - marker: c
    text: Também pode ser entendido como “em cumprimento de qualquer das suas ofertas de voto ou de suas ofertas voluntárias”.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo intensivo introduz uma instrução divina direta; “fale” mantém o tom formal e natural do discurso legal.
- source_word: בָּנָיו
  choice: os filhos dele
  rationale: O hebraico especifica os filhos homens de Arão no contexto sacerdotal; a forma também evita uma sequência ambígua de possessivos.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: Preserva a linguagem de parentesco da expressão hebraica, enquanto a nota registra a equivalência idiomática.
- source_word: אִישׁ אִישׁ
  choice: Qualquer homem
  rationale: A repetição distributiva significa “qualquer homem” ou “cada homem”; a tradução conserva a forma masculina do texto legal.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: da casa de Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico sem reduzi-la simplesmente a “Israel”.
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: dos estrangeiros residentes em Israel
  rationale: גֵּר designa o não israelita estabelecido entre o povo e sujeito à sua ordem comunitária; o plural coletivo soa natural depois da construção distributiva.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: apresentar sua oferta
  rationale: No contexto sacrificial, a forma causativa de קרב indica levar ou apresentar uma oferta; “apresentar” evita redundância e conserva o ato cultual.
- source_word: לְכָל נִדְרֵיהֶם
  choice: por qualquer dos seus votos
  rationale: Mantém a estrutura do hebraico e deixa em aberto, no texto principal, se a referência é aos votos em geral ou mais especificamente às ofertas vinculadas a eles.
- source_word: נִדְבוֹתָם
  choice: suas ofertas voluntárias
  rationale: Expressa a categoria sacrificial de contribuições dadas espontaneamente.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino explícito יהוה, preservando seu caráter de nome próprio.
- source_word: לְעֹלָה
  choice: como holocausto
  rationale: “Holocausto” é o termo técnico português tradicional para a oferta inteiramente queimada, correspondente a עֹלָה.
theological_decisions:
- issue: Linguagem masculina representativa na instrução legal
  choice: Qualquer homem
  alternative: Qualquer pessoa; quem quer que
  rationale: O hebraico usa אִישׁ אִישׁ, uma construção distributiva masculina. A tradução conserva a forma textual sem afirmar além dela quem poderia fazer cada tipo de oferta.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Relação entre votos e ofertas
  choice: por qualquer dos seus votos
  alternative: por qualquer das suas ofertas de voto
  rationale: A construção pode referir-se aos votos ou, por metonímia, às ofertas ligadas a eles. O texto principal preserva a formulação mais aberta, e a nota registra a leitura específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se a cadência jurídica, a expressão pactual “casa de Israel” e o final suspenso do versículo, cuja oração continua no contexto seguinte. Os travessões organizam a longa frase sem eliminar sua estrutura.
