revisions:
- from: '“Fale a Arão, aos filhos dele e a todos os filhos de Israel[a] e diga-lhes: Qualquer homem da casa de Israel ou dos estrangeiros residentes em Israel[b] que apresentar sua oferta — por qualquer dos seus votos ou por qualquer das suas ofertas voluntárias[c] —, a qual apresentarem a Yahweh como holocausto,”'
  to: '“Fale a Arão, aos filhos dele e a todos os filhos de Israel[a] e diga-lhes: Qualquer homem da casa de Israel ou do estrangeiro residente em Israel[b] que apresentar sua oferta em cumprimento de qualquer dos seus votos ou como uma de suas ofertas voluntárias[c] a Yahweh, como holocausto —”'
  rationale: A revisão resolve a discordância entre o relativo singular e o verbo plural, torna natural a referência ao residente estrangeiro e mantém o sentido sacrificial. «Em cumprimento de qualquer dos seus votos» conserva a possível referência aos votos, enquanto a nota preserva a leitura alternativa segundo a qual se trata mais especificamente de ofertas de voto. O travessão final mantém a dependência sintática com o versículo seguinte.
