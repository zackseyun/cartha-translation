revisions:
- from: Quando nascer um novilho, um cordeiro ou um cabrito, ficará sete dias debaixo de sua mãe. Do oitavo dia em diante, será aceito como oferta feita pelo fogo a Yahweh.
  to: Quando nascer um bovino, uma ovelha ou uma cabra, ficará sete dias com sua mãe; do oitavo dia em diante, será aceito como oferta apresentada pelo fogo a Yahweh.
  rationale: A revisão elimina restrições de sexo e idade que não são exigidas pelos termos hebraicos, torna natural o idiomatismo relativo à mãe e melhora a formulação da oferta de fogo. Não é necessária nota, pois a redação principal preserva a ambiguidade lexical relevante sem alegar que se trate especificamente de uma «oferta de alimento».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:56:07Z'
review_pass:
  verdict: revise
  source_fidelity: A tríade hebraica designa categorias de animais sacrificiais (bovino, ovino e caprino), não especificando que sejam machos jovens. «Novilho» e «cabrito» acrescentam sexo e faixa etária; embora o nascimento situe o animal no início da vida, a tradução deve conservar o caráter categorial dos substantivos. «Com sua mãe» transmite adequadamente o idiomatismo תַּחַת אִמּוֹ neste contexto, sem a estranheza física de «debaixo de sua mãe».
  naturalness: O texto revisto mantém registro bíblico moderno e claro. «Oferta apresentada pelo fogo» é mais fluente que «oferta feita pelo fogo» e conserva o valor cultual de אִשֶּׁה sem identificar a expressão com um tipo sacrificial mais específico.
  terminology: «Yahweh» corresponde ao Tetragrama. «Oferta apresentada pelo fogo» preserva a associação de אִשֶּׁה com o fogo e evita a interpretação mais discutida «oferta de alimento».
  issues:
  - severity: medium
    issue: «Novilho» e «cabrito» restringem indevidamente os animais.
    rationale: שור, כשב e עז funcionam aqui como designações de espécies/categorias sacrificiais. «Novilho» e «cabrito» introduzem juventude e, em uso normal, masculino; o hebraico não exige essas restrições.
  - severity: low
    issue: «Debaixo de sua mãe» é excessivamente literal e pouco idiomático em português.
    rationale: No contexto de uma cria recém-nascida, תחת אמו indica que ela permanece com a mãe. «Com sua mãe» comunica o sentido contextual sem perder informação relevante.
  - severity: low
    issue: «Oferta feita pelo fogo» soa pouco natural.
    rationale: «Oferta apresentada pelo fogo» expressa de maneira mais idiomática a formulação cultual, sem resolver de modo dogmático o debate lexical sobre אִשֶּׁה.
  revised_text: Quando nascer um bovino, uma ovelha ou uma cabra, ficará sete dias com sua mãe; do oitavo dia em diante, será aceito como oferta apresentada pelo fogo a Yahweh.
  revised_footnotes: []
