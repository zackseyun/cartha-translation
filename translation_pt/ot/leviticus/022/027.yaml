id: LEV.22.27
reference: Leviticus 22:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: pt
  text: Quando nascer um bovino, uma ovelha ou uma cabra, ficará sete dias com sua mãe; do oitavo dia em diante, será aceito como oferta apresentada pelo fogo a Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹר
  choice: novilho
  rationale: Neste contexto, designa um bovino recém-nascido destinado potencialmente ao sacrifício; “novilho” é natural em português e evita “boi”, que costuma sugerir um macho adulto ou castrado.
- source_word: כֶשֶׂב
  choice: cordeiro
  rationale: Embora o substantivo possa designar uma ovelha, a oração trata do animal desde o nascimento; “cordeiro” comunica naturalmente o filhote ovino sem restringir o sexo.
- source_word: עֵז
  choice: cabrito
  rationale: Aqui funciona como categoria caprina, e o contexto imediato do nascimento favorece o nome do filhote em português, sem especificar sexo.
- source_word: כִּי יִוָּלֵד
  choice: quando nascer
  rationale: Em legislação casuística, כִּי introduz naturalmente a situação prevista; o nifal de ילד indica nascimento.
- source_word: וְהָיָה שִׁבְעַת יָמִים
  choice: ficará sete dias
  rationale: Expressa em português corrente a permanência do recém-nascido durante o período determinado.
- source_word: תַּחַת אִמּוֹ
  choice: debaixo de sua mãe
  rationale: Preserva a imagem literal hebraica, compreensível como permanência junto à mãe e sob seus cuidados.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: Do oitavo dia em diante
  rationale: Reproduz de modo natural o marco temporal inclusivo a partir do oitavo dia.
- source_word: יֵרָצֶה
  choice: será aceito
  rationale: O nifal de רצה exprime aceitação cultual do animal para o sacrifício.
- source_word: לְקָרְבַּן
  choice: como oferta
  rationale: קָרְבָּן é o termo geral para algo apresentado ou aproximado como oferta a Deus.
- source_word: אִשֶּׁה
  choice: feita pelo fogo
  rationale: Preserva a associação lexical com fogo e o modo sacrificial, sem adotar como certa a interpretação discutida “oferta de alimento”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica o destinatário da oferta, e o nome próprio preserva o Tetragrama presente no texto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio e segue a camada de consulta fornecida.
- issue: Sentido sacrificial de אִשֶּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A etimologia e o uso ligam o termo ao fogo, enquanto a interpretação como alimento sacrificial permanece debatida; a tradução principal conserva a formulação menos interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A escolha dos nomes dos filhotes acompanha o contexto explícito de nascimento; a imagem “debaixo de sua mãe” foi mantida por fidelidade ao hebraico.
