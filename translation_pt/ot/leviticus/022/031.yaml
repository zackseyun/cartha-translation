  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: pt
  text: Portanto, guardem os meus mandamentos e cumpram-nos. Eu sou Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH (tradicionalmente traduzido por “o SENHOR”; também transliterado “Yahweh”).'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Portanto, guardem
  rationale: שׁמר, em contexto legal e de aliança, significa guardar ou observar. “Guardem” conserva a formulação bíblica corrente, e “Portanto” expressa a ligação discursiva do וּ inicial com o contexto anterior.
- source_word: מִצְוֺתַי
  choice: os meus mandamentos
  rationale: מִצְוָה designa mandamento ou ordem. “Mandamentos” mantém o tom jurídico e pactual do texto.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: e cumpram-nos
  rationale: A expressão hebraica significa literalmente “e façam-nos”. Em português, “cumpram-nos” é natural quando o objeto são mandamentos e preserva a distinção entre guardá-los e colocá-los em prática.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Preserva a fórmula enfática de autoidentificação e translitera diretamente o nome divino representado pelo Tetragrama.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O hebraico emprega diretamente o nome pactual יְהוָה. A transliteração “Yahweh” o distingue do título אֲדֹנָי e evita ocultar o nome presente no texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural adequados à exortação dirigida à comunidade. “Cumpram-nos” oferece legibilidade brasileira e ampla compreensão internacional sem apagar o paralelismo entre guardar e fazer.
