base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: pt
  text: Se um homem[a] comer por engano[b] uma coisa santa[c], acrescentará um quinto a ela[d] e dará ao sacerdote a coisa santa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alguém” ou “uma pessoa”. O hebraico diz literalmente “um homem”, forma masculina singular que pode ter sentido genérico em textos legais.
    reason: lexical_alternative
  - marker: b
    text: Ou “sem intenção”, “inadvertidamente”.
    reason: lexical_alternative
  - marker: c
    text: “Coisa santa” refere-se aqui a alimento ou bem consagrado, reservado ao uso sacerdotal.
    reason: cultural_note
  - marker: d
    text: 'Hebraico: “acrescentará um quinto dela a ela”.'
    reason: translation_clarity
lexical_decisions:
- source_word: וְאִישׁ
  choice: um homem
  rationale: Preserva a forma masculina singular אִישׁ da formulação legal hebraica; uma nota informa que, nesse tipo de lei, a expressão pode ter sentido genérico.
- source_word: כִּי
  choice: se
  rationale: Introduz um caso condicional na formulação casuística da lei.
- source_word: יֹאכַל
  choice: comer
  rationale: O verbo descreve o consumo da coisa consagrada; o infinitivo flexionado após “se” é natural em português.
- source_word: קֹדֶשׁ
  choice: uma coisa santa / a coisa santa
  rationale: Mantém a amplitude do substantivo hebraico e sua repetição, sem restringi-lo indevidamente a “alimento” ou “porção”.
- source_word: בִּשְׁגָגָה
  choice: por engano
  rationale: Expressa ação inadvertida, não deliberada, em linguagem corrente e juridicamente clara.
- source_word: וְיָסַף
  choice: acrescentará
  rationale: Comunica a obrigação resultante do caso legal, preservando o sentido de adicionar algo à restituição principal.
- source_word: חֲמִשִׁיתוֹ עָלָיו
  choice: acrescentará a ela um quinto
  rationale: É uma formulação portuguesa clara para a adição de um quinto ao montante principal, evitando a repetição pouco natural de pronomes.
- source_word: וְנָתַן
  choice: e dará
  rationale: Mantém o sentido básico de נתן, sem explicitar “pagará”, embora o contexto seja de restituição.
- source_word: לַכֹּהֵן
  choice: ao sacerdote
  rationale: Reproduz a referência definida ao destinatário sacerdotal apropriado.
- source_word: אֶת הַקֹּדֶשׁ
  choice: a coisa santa
  rationale: Repete o termo usado anteriormente, como no hebraico, e conserva a possível referência ao bem consagrado ou ao que deve ser restituído por ele.
theological_decisions:
- issue: Masculino singular em uma formulação legal
  choice: Manter “um homem” no texto principal
  alternative: “alguém” ou “uma pessoa”
  rationale: O hebraico usa אִישׁ, masculino singular. A formulação é preservada sem negar que, no discurso legal, ela possa funcionar genericamente.
- issue: Natureza do objeto consagrado e da restituição
  choice: Traduzir קֹדֶשׁ como “coisa santa” nas duas ocorrências
  alternative: “alimento santo”, “porção santa” ou explicitar “o valor da coisa santa”
  rationale: O termo hebraico é amplo. O contexto envolve algo consagrado que foi consumido, mas o versículo não especifica por si só se a restituição final deve ser descrita como o próprio objeto, uma porção equivalente ou seu valor; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com construção jurídica simples. “Por engano” é mais corrente do que “inadvertidamente”; “coisa santa” preserva deliberadamente a amplitude e a repetição de קֹדֶשׁ. O futuro do indicativo comunica a prescrição legal sem recorrer a linguagem arcaica.
