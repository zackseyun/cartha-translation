  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: pt
  text: Mas um boi ou uma ovelha que tenha um membro comprido ou curto demais[a] pode ser apresentado como oferta voluntária, mas não será aceito como oferta de voto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais geral, “deformado ou atrofiado”. Os termos hebraicos provavelmente descrevem tipos opostos de desproporção corporal.
    reason: Alternativa lexical decorrente da incerteza quanto ao sentido anatômico exato de שָׂרוּעַ e קָלוּט.
lexical_decisions:
- source_word: וְשׁוֹר
  choice: um boi
  rationale: שׁוֹר designa um bovino; “boi” é natural no singular e adequado à legislação sacrificial.
- source_word: וָשֶׂה
  choice: ou uma ovelha
  rationale: שֶׂה pode indicar um animal do rebanho miúdo, ovelha ou cabra; “ovelha” mantém a formulação tradicional e o contraste com o bovino, sem especificar idade.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: que tenha um membro comprido ou curto demais
  rationale: 'Os termos parecem formar um par de defeitos opostos, provavelmente desproporções de um membro: alongado e contraído ou reduzido. A formulação concreta preserva esse contraste, e a incerteza é registrada em nota.'
- source_word: נְדָבָה תַּעֲשֶׂה אֹתוֹ
  choice: pode ser apresentado como oferta voluntária
  rationale: Embora תַּעֲשֶׂה seja literalmente “farás”, no contexto cultual a expressão indica destinar ou apresentar o animal como oferta. A construção passiva em português é natural e evita sugerir que se “faz” o próprio animal.
- source_word: וּלְנֵדֶר
  choice: mas ... como oferta de voto
  rationale: נֵדֶר designa um voto e, neste contexto, a oferta vinculada ao seu cumprimento. “Oferta de voto” torna explícito o valor cultual sem acrescentar uma obrigação alheia ao texto.
- source_word: לֹא יֵרָצֶה
  choice: não será aceito
  rationale: O nifal de רצה, em contexto sacrificial, expressa aceitação favorável da oferta; “não será aceito” comunica isso de forma clara e concisa.
theological_decisions:
- issue: Sentido dos defeitos שָׂרוּעַ e קָלוּט
  choice: Traduzir o par como um membro comprido ou curto demais.
  alternative: deformado ou atrofiado; com uma parte grande ou pequena demais
  rationale: Os termos provavelmente descrevem formas opostas de desproporção corporal, mas sua precisão anatômica é incerta. O texto principal conserva a oposição concreta e a nota preserva a alternativa mais geral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Oferta voluntária” e “oferta de voto” mantêm a distinção cultual entre uma dádiva espontânea e uma oferta vinculada a voto.
