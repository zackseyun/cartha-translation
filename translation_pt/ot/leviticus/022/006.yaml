  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: pt
  text: A pessoa que tocar nisso ficará impura até o entardecer e não comerá das coisas sagradas[a], a menos que tenha lavado o corpo com água[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das ofertas sagradas” ou “das coisas consagradas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “tenha lavado sua carne em água”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: a pessoa
  rationale: No contexto legal, o termo designa o indivíduo, não uma alma imaterial; “a pessoa” preserva o singular e é natural em português.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: que tocar nisso
  rationale: O verbo feminino concorda gramaticalmente com נֶפֶשׁ e não indica o sexo da pessoa. “Nisso” remete de modo neutro à fonte de impureza mencionada no contexto anterior, sem pressupor que o referente seja humano.
- source_word: וְטָמְאָה
  choice: ficará impura
  rationale: Expressa o estado de impureza ritual resultante do contato, com formulação clara e adequada à sequência legal.
- source_word: עַד הָעָרֶב
  choice: até o entardecer
  rationale: Representa o limite temporal da impureza ritual em português corrente e digno.
- source_word: וְלֹא יֹאכַל
  choice: e não comerá
  rationale: O imperfeito em contexto legal comunica a proibição ou consequência normativa; o futuro mantém o tom jurídico sem tornar a frase excessivamente pesada.
- source_word: מִן הַקֳּדָשִׁים
  choice: das coisas sagradas
  rationale: O plural substantivado refere-se ao que foi consagrado, especialmente ao alimento sagrado no contexto. “Das” preserva naturalmente a força partitiva da preposição.
- source_word: כִּי אִם
  choice: a menos que
  rationale: A locução introduz a condição necessária para que a pessoa possa comer das coisas sagradas.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: lave o corpo com água
  rationale: Embora בָּשָׂר signifique literalmente “carne”, aqui designa concretamente o corpo. A tradução comunica com clareza a lavagem ritual sem perder a ação física.
theological_decisions:
- issue: Natureza da linguagem de impureza
  choice: impureza ritual
  alternative: impureza moral
  rationale: O contexto trata da aptidão cultual para comer coisas sagradas após contato contaminante e lavagem. “Impura” conserva a categoria ritual sem acrescentar culpa moral.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém um registro legal digno, usa linguagem inclusiva por meio de “a pessoa” e conserva a referência neutra ao antecedente contextual com “nisso”.
