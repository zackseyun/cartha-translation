source:
  edition: WLC
  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: pt
  text: ou um homem que tocar em qualquer animal rastejante que o torne impuro[a], ou em uma pessoa que o torne impuro, qualquer que seja a sua impureza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “qualquer criatura que se move em enxames”. O termo hebraico se refere a pequenos animais que pululam ou se movem junto ao chão.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega formas masculinas singulares em sentido jurídico genérico. A referência de “sua impureza” é expressa de modo conciso no original.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: ou
  rationale: Conjunção disjuntiva simples que dá continuidade à lista iniciada no versículo anterior.
- source_word: אִישׁ
  choice: um homem
  rationale: Reflete a forma masculina singular do hebraico, embora a norma legal tenha aplicação genérica.
- source_word: יִגַּע
  choice: tocar
  rationale: É a expressão corrente e precisa para נגע nas leis de pureza ritual.
- source_word: בְּכָל שֶׁרֶץ
  choice: em qualquer animal rastejante
  rationale: שֶׁרֶץ designa de modo amplo pequenos animais que pululam ou se movem junto ao chão; a formulação evita uma identificação zoológica excessivamente específica.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: que o torne impuro
  rationale: Expressa naturalmente em português o resultado do contato, mantendo o foco na impureza ritual adquirida.
- source_word: בְאָדָם
  choice: em uma pessoa
  rationale: אָדָם indica aqui um ser humano como fonte de impureza; “pessoa” comunica o sentido genérico com naturalidade.
- source_word: אֲשֶׁר יִטְמָא לוֹ לְכֹל טֻמְאָתוֹ
  choice: que o torne impuro, qualquer que seja a impureza dela
  rationale: Preserva a construção compacta e a referência ambígua do hebraico, entendendo que qualquer tipo de impureza da pessoa pode ser transmitido pelo contato.
- source_word: טֻמְאָה
  choice: impureza
  rationale: Termo consagrado e claro em português para o estado ritual descrito pelas leis levíticas, além de manter a conexão lexical com “impuro”.
theological_decisions:
- issue: Natureza da linguagem de impureza na legislação levítica
  choice: “impuro/impureza” em sentido ritual
  alternative: Linguagem moralizante, como “pecaminoso/culpa”
  rationale: O contexto trata de pureza sacerdotal e ritual, não necessariamente de culpa moral.
- issue: Referente do sufixo em טֻמְאָתוֹ
  choice: “a impureza dela”, referindo-se à pessoa tocada
  alternative: “a impureza dele”, referindo-se ao homem que toca
  rationale: A leitura adotada comunica a provável fonte humana da impureza, mas a concisão do hebraico permite tensão referencial; por isso, a nota registra a formulação mais literal e ambígua.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “impuro/impureza” preserva a ligação lexical do hebraico e deixa claro o caráter ritual da disposição.
