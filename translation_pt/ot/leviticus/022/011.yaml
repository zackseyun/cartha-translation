source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: pt
  text: Mas, se um sacerdote comprar uma pessoa como sua propriedade com seu dinheiro[a], essa pessoa poderá comer dele[b], e os nascidos em sua casa poderão comer de seu alimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma pessoa, aquisição do seu dinheiro”, isto é, alguém comprado com seu dinheiro.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “poderá comer dele”. O contexto indica o alimento sagrado reservado aos sacerdotes.
    reason: referent_clarification
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: Mas, se um sacerdote
  rationale: A conjunção dá continuidade contrastiva ao caso legal anterior, e כִּי introduz aqui uma situação condicional.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: comprar uma pessoa
  rationale: Neste contexto, קנה indica aquisição por compra, e נֶפֶשׁ designa um ser humano, não uma alma imaterial.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: como sua propriedade com seu dinheiro
  rationale: A formulação conserva explicitamente tanto a aquisição mediante dinheiro quanto a condição jurídica de propriedade, sem suavizar a linguagem do hebraico.
- source_word: הוּא יֹאכַל בּוֹ
  choice: essa pessoa poderá comer do alimento sagrado
  rationale: הוּא retoma a pessoa comprada; explicitá-la evita que o pronome seja entendido como referência ao sacerdote. O objeto implícito é o alimento sagrado em discussão no contexto.
- source_word: וִילִיד בֵּיתוֹ
  choice: os nascidos em sua casa
  rationale: A expressão designa coletivamente pessoas nascidas no domicílio do sacerdote, como mostram o pronome e o verbo no plural, sem especificar além do texto sua idade ou relação familiar.
- source_word: הֵם יֹאכְלוּ בְלַחְמוֹ
  choice: também ... poderão comer do alimento dele
  rationale: O imperfeito tem valor permissivo na legislação. לֶחֶם pode significar literalmente 'pão', mas aqui abrange a porção de alimento sagrado pertencente ao sacerdote.
theological_decisions:
- issue: Linguagem jurídica relacionada à escravidão e à propriedade
  choice: como sua propriedade com seu dinheiro
  alternative: comprada com seu dinheiro
  rationale: A tradução mantém a dimensão de propriedade expressa por קִנְיַן כַּסְפּוֹ. Trata-se de transparência lexical e histórica, não de aprovação ética da instituição descrita.
- issue: Referente do pronome הוּא
  choice: essa pessoa
  alternative: ele
  rationale: Embora o hebraico empregue um pronome singular, a explicitação preserva seu referente — a pessoa comprada — e evita a leitura ambígua de que o sacerdote seria o sujeito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação conserva a linguagem jurídica incômoda do original e explicita apenas os referentes necessários à clareza.
