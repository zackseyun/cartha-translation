  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: pt
  text: Não apresentem nada que tenha defeito[a], pois não será aceito em seu favor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «imperfeição». O termo hebraico costuma indicar uma falha física que desqualifica uma oferta.
    reason: lexical_alternative
  - marker: b
    text: Ou «não será considerado aceitável para vocês».
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: nenhum animal que tenha defeito
  rationale: A expressão hebraica é abrangente, literalmente «tudo aquilo em que houver defeito». No contexto imediato, refere-se aos animais apresentados como oferta; explicitar «animal» produz português natural sem alterar o referente.
- source_word: מוּם
  choice: defeito
  rationale: No contexto sacrificial, o termo indica uma falha física que desqualifica o animal. «Defeito» é claro e corrente em português; a nota registra «imperfeição» como alternativa.
- source_word: לֹא תַקְרִיבוּ
  choice: Não apresentem
  rationale: O hifil de קרב, em contexto sacrificial, significa levar ou apresentar algo como oferta. «Apresentem» preserva essa nuance sem antecipar uma etapa ritual específica.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão da proibição; «pois» mantém o estilo jurídico e a ligação causal.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: ele não será aceito em favor de vocês
  rationale: לְרָצוֹן expressa aceitação favorável no culto, e לָכֶם pode indicar que essa aceitação seria em benefício ou em favor dos ofertantes. A formulação conserva tanto a recepção da oferta quanto sua relação com eles.
theological_decisions:
- issue: Linguagem de aceitação cultual
  choice: não será aceito em favor de vocês
  alternative: não será aceitável para vocês
  rationale: O texto trata da recepção favorável da oferta perante Deus, e não apenas de sua conformidade com um padrão abstrato. «Em favor de vocês» preserva a possível força representativa de לָכֶם sem desenvolver uma doutrina posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância no plural conforme o verbo hebraico. «Animal» explicita o referente dado pelo contexto sacrificial imediato. Os marcadores aparecem no texto em ordem alfabética.
