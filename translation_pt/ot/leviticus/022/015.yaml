id: LEV.22.15
reference: Leviticus 22:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: pt
  text: Não profanarão as coisas sagradas[a] dos filhos de Israel, que eles apresentam[b] a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as ofertas sagradas”.'
    reason: Alternativa contextual para קָדְשֵׁי, que pode referir-se especificamente aos dons consagrados trazidos por Israel.
  - marker: b
    text: 'Ou: “erguem” ou “oferecem”.'
    reason: O verbo רום significa literalmente levantar ou erguer e, no uso cultual, pode indicar apresentar uma contribuição.
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: profanarão
  rationale: O piel de חלל, neste contexto cultual, indica tratar como comum aquilo que é santo; “profanar” preserva diretamente o contraste entre o sagrado e o comum.
- source_word: קָדְשֵׁי
  choice: coisas sagradas
  rationale: O plural em estado construto designa aquilo que foi consagrado. “Coisas sagradas” mantém a amplitude lexical do hebraico sem restringi-lo apenas a uma classe específica de ofertas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz o etnônimo pactual hebraico de modo tradicional e inteligível em português, sem neutralizar a forma da expressão original.
- source_word: אֲשֶׁר יָרִימוּ
  choice: que eles apresentam
  rationale: O hifil de רום pode conservar a imagem de erguer, mas, no contexto de contribuições cultuais, significa também apresentar ou oferecer. “Apresentam” comunica naturalmente esse uso sem acrescentar uma modalidade sacrificial não expressa.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome pactual em vez de substituí-lo por um título.
- source_word: וְלֹא
  choice: Não
  rationale: A forma negativa com o imperfeito tem força normativa no contexto legal. Em português, o futuro “não profanarão” mantém o tom legislativo; a conjunção inicial pode ficar implícita num versículo apresentado isoladamente.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” conserva o nome pactual e evita substituí-lo por um título.
- issue: Amplitude de קָדְשֵׁי
  choice: coisas sagradas
  alternative: ofertas sagradas
  rationale: Embora o contexto diga respeito ao culto e às contribuições de Israel, o substantivo hebraico permanece amplo. A tradução evita limitar desnecessariamente o referente.
- issue: Referente do sujeito em יָרִימוּ
  choice: eles
  alternative: os filhos de Israel
  rationale: O hebraico deixa o sujeito implícito e o contexto aponta naturalmente para os filhos de Israel. Manter o pronome preserva a forma e uma pequena margem de ambiguidade, em vez de explicitar o referente no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe legislativa concisa. “Profinarão” foi evitado; empregou-se a forma correta “profanarão”. A formulação mantém o vocabulário cultual sem soar excessivamente técnico.
