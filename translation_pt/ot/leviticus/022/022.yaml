    rationale: Embora אִשֶּׁה esteja associado ao fogo sacrificial, «oferta queimada» pode ser entendido como a categoria técnica עֹלָה. «Oferta pelo fogo» ou «oferta feita pelo fogo» preserva melhor a alternativa tradicional.
