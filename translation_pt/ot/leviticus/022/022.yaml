source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: pt
  text: Não apresentem a Yahweh animais cegos, fraturados, mutilados ou com verruga, sarna ou doença de pele; nem coloquem nenhum deles sobre o altar como oferta de alimento[a] a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta pelo fogo” ou “oferta feita pelo fogo”.'
    reason: Preserva alternativas tradicionais para אִשֶּׁה, termo sacrificial associado ao fogo, sem identificá-lo indevidamente com a oferta integralmente queimada.
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: animal cego
  rationale: O termo feminino singular descreve, no contexto, um animal com cegueira; explicitar “animal” torna a referência natural e inequívoca em português.
- source_word: שָׁבוּר
  choice: com algum osso quebrado
  rationale: O particípio indica uma fratura ou membro quebrado; esta formulação evita sugerir que o animal inteiro esteja despedaçado.
- source_word: חָרוּץ
  choice: mutilado
  rationale: O termo denota algo cortado ou fendido, provavelmente uma mutilação corporal; “mutilado” comunica a gravidade do defeito sem falsa precisão anatômica.
- source_word: יַבֶּלֶת
  choice: verruga
  rationale: Designa um crescimento anormal visível na pele; “verruga” é corrente e acessível.
- source_word: גָרָב
  choice: sarna
  rationale: Denota uma afecção cutânea; “sarna” é uma equivalência tradicional e concreta, embora a identificação médica exata não seja segura.
- source_word: יַלֶּפֶת
  choice: doença de pele
  rationale: A afecção dermatológica exata é incerta; a expressão geral preserva essa incerteza e evita um diagnóstico moderno específico.
- source_word: תַקְרִיבוּ
  choice: apresentem
  rationale: No uso sacrificial, o hifil de קרב significa trazer ou apresentar uma oferta; “apresentar” conserva o sentido cultual e distingue esta ação da colocação no altar.
- source_word: וְאִשֶּׁה
  choice: como oferta de alimento
  rationale: No vocabulário sacerdotal, אִשֶּׁה designa uma oferta associada ao fogo e pode ser entendida como alimento sacrificial; a alternativa tradicional é preservada em nota.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: coloquem nenhum deles sobre o altar
  rationale: Expressa de modo natural a ação cultual concreta e conserva o sentido distributivo de מֵהֶם.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama e traduz naturalmente a preposição no contexto de apresentação sacrificial.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituir o termo por um título.
- issue: Sentido sacrificial de אִשֶּׁה
  choice: oferta de alimento
  alternative: oferta queimada; oferta feita pelo fogo
  rationale: “Oferta de alimento” comunica a concepção sacerdotal da oferta apresentada a Deus, enquanto a nota conserva a associação lexical tradicional com o fogo e evita ocultar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A proibição foi formulada diretamente no plural, e “animal” foi explicitado uma vez para esclarecer o referente da lista. A pontuação mantém unidas as duas ações cultuais proibidas.
