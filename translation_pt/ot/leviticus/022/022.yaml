revisions:
- from: Não apresentem a Yahweh nenhum animal cego, com algum osso quebrado, mutilado, com verruga, sarna ou doença de pele; nem coloquem nenhum deles sobre o altar como oferta de alimento[a] a Yahweh.
  to: Não apresentem a Yahweh animais cegos, fraturados, mutilados ou com verruga, sarna ou doença de pele; nem coloquem nenhum deles sobre o altar como oferta de alimento[a] a Yahweh.
  rationale: A revisão elimina a especificação não expressa de «osso» e corrige a alternativa de nota para não confundir אִשֶּׁה com uma categoria sacrificial diferente. Mantêm-se o nome divino, a sequência dos defeitos, o plural imperativo e a leitura principal «oferta de alimento», com a ambiguidade lexical devidamente sinalizada.
