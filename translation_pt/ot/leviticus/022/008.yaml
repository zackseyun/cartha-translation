  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: pt
  text: Não comerá nenhum animal encontrado morto ou dilacerado por feras[a], tornando-se impuro por causa dele. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não comerá o que morreu por si mesmo nem o que foi dilacerado por feras.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: animal encontrado morto
  rationale: O termo designa a carcaça de um animal, especialmente a de um animal que morreu sem o abate apropriado. A formulação comunica esse sentido com clareza no contexto das leis alimentares.
- source_word: וּטְרֵפָה
  choice: ou dilacerado por feras
  rationale: טְרֵפָה refere-se a um animal dilacerado por predadores; explicitar o agente implícito produz uma expressão natural e precisa em português.
- source_word: לֹא יֹאכַל
  choice: Não comerá
  rationale: O imperfeito negado tem força proibitiva no texto legal. O futuro mantém essa força normativa em português bíblico corrente, sem recorrer a uma construção excessivamente arcaica.
- source_word: לְטָמְאָה בָהּ
  choice: tornando-se impuro por causa dele
  rationale: 'A construção expressa o resultado ou propósito ligado ao ato de comer: isso tornaria o sacerdote ritualmente impuro. “Impuro” preserva a terminologia ritual de טמא.'
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: A tradução preserva o nome divino expresso pelo Tetragrama, em conformidade com a camada inglesa auditada e sem substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome próprio na fórmula pactual.
- issue: Natureza da impureza
  choice: impuro
  alternative: contaminado
  rationale: “Impuro” conserva a linguagem técnico-ritual do contexto levítico e evita sugerir apenas sujeira física ou contaminação material.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário ritual consistente. A construção legal “Não comerá” preserva a concisão e a força normativa do hebraico.
