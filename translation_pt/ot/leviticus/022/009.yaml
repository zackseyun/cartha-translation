source:
  edition: WLC
  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: pt
  text: Guardarão o meu encargo[a], para que não carreguem pecado por causa dele[b] e morram por causa dele[c] ao profaná-lo[d]. Eu sou Yahweh, que os santifica[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumprirão o dever que lhes confiei”.'
    reason: Alternativa lexical para מִשְׁמַרְתִּי, explicitando a ideia de responsabilidade confiada.
  - marker: b
    text: 'Ou: “incorram em culpa por causa dele”. A expressão hebraica traduzida literalmente por “carregar pecado” também pode indicar tornar-se culpado ou sujeito à culpa.'
    reason: Esclarecimento do idioma hebraico נשׂא חטא.
  - marker: c
    text: 'Hebraico: “morram nele”; isto é, morram por causa dele.'
    reason: Registro da forma mais literal da preposição hebraica e de seu sentido causal no contexto.
  - marker: d
    text: 'Ou: “ao tratá-lo como comum” ou “ao dessacralizá-lo”.'
    reason: Alternativas lexicais que tornam explícito o contraste entre santo e comum em חלל.
  - marker: e
    text: 'Ou: “que os torna santos”.'
    reason: Alternativa em linguagem comum para o particípio מְקַדְּשָׁם.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Guardarão
  rationale: O verbo שׁמר significa guardar, observar ou cumprir. No contexto legal e sacerdotal, o futuro em português expressa de modo digno e natural a obrigação prescrita.
- source_word: מִשְׁמַרְתִּי
  choice: o meu encargo
  rationale: מִשְׁמֶרֶת designa uma responsabilidade ou obrigação confiada para ser observada. “Encargo” preserva tanto a ideia de dever quanto a de algo posto sob os cuidados dos sacerdotes.
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: carreguem pecado por causa dele
  rationale: A formulação mantém a imagem hebraica de “carregar pecado” e traduz עָלָיו sem definir além do texto o referente do pronome. A nota registra o sentido idiomático de incorrer em culpa.
- source_word: וּמֵתוּ בוֹ
  choice: e morram por causa dele
  rationale: A preposição בְּ indica aqui a ligação causal entre a transgressão e a morte. “Por causa dele” é mais claro em português corrente do que o excessivamente literal “nele”, sem eliminar a conexão pronominal do hebraico.
- source_word: יְחַלְּלֻהוּ
  choice: ao profaná-lo
  rationale: חלל, no vocabulário de santidade de Levítico, significa profanar, dessacralizar ou tratar como comum. “Profanar” preserva o contraste cultual entre santo e comum.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino יהוה é transliterado como “Yahweh”, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: מְקַדְּשָׁם
  choice: que os santifica
  rationale: O particípio de קדשׁ apresenta Yahweh como aquele que os torna santos ou os separa como santos. “Santifica” conserva o vocabulário central de santidade do livro.
theological_decisions:
- issue: Referente dos pronomes masculinos singulares em עָלָיו, בּוֹ e יְחַלְּלֻהוּ
  choice: Manter a referência pronominal genérica com “dele” e “-lo”, sem substituir o pronome por um substantivo específico.
  alternative: Explicitar “as coisas sagradas”, “o alimento sagrado” ou “o encargo”.
  rationale: O hebraico emprega pronomes singulares sem repetir um substantivo. O contexto imediato trata das coisas sagradas, enquanto o próprio versículo menciona o encargo de Yahweh. Manter os pronomes preserva essa ambiguidade real.
- issue: Relação expressa por כִּי antes de יְחַלְּלֻהוּ
  choice: Traduzir de modo circunstancial-causal por “ao profaná-lo”.
  alternative: “porque o profanarem” ou “quando o profanarem”.
  rationale: כִּי pode introduzir causa, e a construção também descreve a circunstância em que a morte ocorreria. “Ao profaná-lo” comunica ambas as relações sem escolher rigidamente apenas uma.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Conserva-se o vocabulário cultual de Levítico (“encargo”, “profanar”, “santificar”), enquanto as notas oferecem equivalentes mais explicativos. A ordem sintática foi levemente naturalizada sem eliminar os pronomes ambíguos do hebraico.
