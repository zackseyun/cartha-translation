id: LEV.22.21
reference: Leviticus 22:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: pt
  text: E, se um homem apresentar a Yahweh um sacrifício de paz[a], para cumprir um voto[b] ou como oferta voluntária, seja do gado ou do rebanho, o animal deverá ser sem defeito para ser aceito; não haverá nele defeito algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “sacrifício de comunhão”. O termo hebraico está relacionado a paz, integridade e bem-estar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para executar um voto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי יַקְרִיב
  choice: E, se um homem apresentar
  rationale: A construção introduz um caso legal condicional. אִישׁ é masculino singular, preservado como “um homem”, e o Hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer.
- source_word: זֶבַח שְׁלָמִים
  choice: um sacrifício de paz
  rationale: A expressão designa uma categoria sacrificial. “Sacrifício de paz” preserva de modo conciso a ligação lexical de שְׁלָמִים com paz/bem-estar, sem impor a interpretação mais específica “comunhão”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O nome divino יהוה é transliterado como “Yahweh”, preservando o nome próprio da aliança presente no texto hebraico.
- source_word: לְפַלֵּא נֶדֶר
  choice: para cumprir um voto
  rationale: No contexto das ofertas, a expressão indica levar a efeito ou satisfazer aquilo que foi prometido em voto. “Cumprir um voto” é natural e preciso em português.
- source_word: אוֹ לִנְדָבָה
  choice: ou como oferta voluntária
  rationale: נְדָבָה designa uma oferta dada espontaneamente, em contraste com uma oferta devida por voto.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: seja do gado ou do rebanho
  rationale: 'Os termos abrangem as duas grandes classes de animais domésticos oferecidos: animais do gado e animais do rebanho.'
- source_word: תָּמִים יִהְיֶה לְרָצוֹן
  choice: o animal deverá ser sem defeito para ser aceito
  rationale: תָּמִים, na legislação sacrificial, descreve um animal íntegro, livre de defeito físico; לְרָצוֹן expressa sua aceitabilidade como oferta.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: não haverá nele defeito algum
  rationale: A formulação conserva a força categórica da exigência hebraica e evita ambiguidade quanto à ausência de qualquer defeito desqualificador.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido de זֶבַח שְׁלָמִים
  choice: sacrifício de paz
  alternative: sacrifício de comunhão
  rationale: “Comunhão” explicita uma possível dimensão teológica e ritual, mas é mais interpretativo. “Paz” mantém a associação lexical e deixa aberta a amplitude de paz, bem-estar e comunhão.
- issue: Sujeito masculino אִישׁ na formulação legal
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: O texto hebraico emprega o masculino singular como sujeito representativo do caso legal; a tradução conserva essa forma sem ampliar nem restringir além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe jurídica clara. “O animal” foi explicitado na segunda oração para evitar que “ele” pareça referir-se ao homem ou ao sacrifício como ato. Os marcadores de nota foram posicionados junto às expressões a que de fato se referem.
