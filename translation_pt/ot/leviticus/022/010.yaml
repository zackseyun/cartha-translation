base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: pt
  text: Nenhuma pessoa não autorizada comerá da porção sagrada[a]; nem o residente ligado a um sacerdote[b] nem o trabalhador contratado comerão da porção sagrada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do alimento sagrado” ou “da coisa santa”. O singular hebraico se refere aqui a alimento proveniente de ofertas sagradas, destinado ao consumo autorizado na casa sacerdotal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o residente de um sacerdote”, “o hóspede de um sacerdote” ou “o residente temporário de um sacerdote”. O termo designa alguém residente ou dependente ligado à casa de um sacerdote; sua condição exata não é especificada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: pessoa não autorizada
  rationale: No contexto das porções sacerdotais, designa quem não tem direito de participar delas, e não necessariamente um estrangeiro étnico. A expressão comunica essa exclusão cultual sem sugerir apenas procedência estrangeira.
- source_word: קֹדֶשׁ
  choice: porção sagrada
  rationale: Embora o hebraico use o singular geral, literalmente 'coisa santa', o contexto indica alimento proveniente das ofertas e reservado ao consumo sacerdotal. 'Porção sagrada' é natural e mantém a referência concreta.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: residente ligado a um sacerdote
  rationale: A expressão indica um residente ou dependente vinculado à casa de um sacerdote, mas que não integra por isso o grupo autorizado a comer. 'Ligado a' preserva a relação sem definir em excesso sua condição jurídica.
- source_word: שָׂכִיר
  choice: trabalhador contratado
  rationale: O termo se refere a alguém que trabalha por remuneração. A formulação é moderna e distingue esse trabalhador do residente mencionado antes.
- source_word: לֹא יֹאכַל
  choice: não comerá
  rationale: O imperfeito negado tem força proibitiva na legislação. O futuro com valor normativo é claro e digno em português jurídico-bíblico.
- source_word: וְכָל
  choice: nenhuma
  rationale: Com a negação verbal seguinte, a construção hebraica é expressa naturalmente em português por 'nenhuma... comerá', evitando a tradução rígida 'todo... não comerá'.
theological_decisions: []
