  text: וְ/שׁ֖וֹר אוֹ שֶׂ֑ה אֹת֣/וֹ וְ/אֶת בְּנ֔/וֹ לֹ֥א תִשְׁחֲט֖וּ בְּ/י֥וֹם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: pt
  text: Seja boi, seja ovelha, não abatam o animal e sua cria[a] no mesmo dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “ele e seu filho”. A expressão se refere a um animal e sua cria.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “em um dia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: boi
  rationale: O termo designa um animal bovino. “Boi” é a forma singular corrente no português bíblico e jurídico, sem recorrer ao coletivo “gado”.
- source_word: שֶׂה
  choice: ovelha
  rationale: O termo pode designar um animal do rebanho miúdo, especialmente ovelha ou cabra conforme o contexto. “Ovelha” oferece aqui um representante singular claro em contraste com “boi”, sem a especificação etária de “cordeiro”.
- source_word: וְשׁוֹר אוֹ שֶׂה
  choice: Seja boi, seja ovelha
  rationale: A construção portuguesa exprime com naturalidade a alternativa legal introduzida pela conjunção e por אוֹ, sem reproduzir de modo rígido o “e” inicial do hebraico.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: o animal e sua cria
  rationale: O hebraico diz literalmente “ele e seu filho”. “O animal e sua cria” é idiomático em português e evita atribuir sexo ou idade além do que a proibição exige.
- source_word: תִשְׁחֲטוּ
  choice: não abatam
  rationale: שׁחט é o verbo próprio para o abate de animais, sobretudo em contexto sacrificial e legal. “Abater” conserva esse sentido técnico melhor que o genérico “matar”.
- source_word: בְּיוֹם אֶחָד
  choice: no mesmo dia
  rationale: Embora a expressão seja literalmente “em um dia”, no contexto da proibição seu sentido idiomático é que o animal e sua cria não sejam abatidos dentro do mesmo dia.
