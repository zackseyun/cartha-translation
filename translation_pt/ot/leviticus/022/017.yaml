  yaml_path: translation/ot/leviticus/022/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר com waw consecutivo introduz um novo ato de fala; “falou” preserva de modo natural a fórmula narrativa hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal divino, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; “a” é a forma idiomática em “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz convencionalmente o discurso direto que vem a seguir; “dizendo” conserva a cadência e a função da fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; a forma “Jeová” é uma alternativa tradicional, mas reflete uma vocalização posterior.
translation_notes:
  register: Português moderno, digno e claro, com a fórmula hebraica preservada de maneira natural. Não se acrescentou nota, pois o próprio texto apresenta “Yahweh” diretamente e não há marcador necessário nesta versão.
