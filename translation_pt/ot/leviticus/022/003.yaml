reference: Leviticus 22:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: pt
  text: 'Diga-lhes: “Em todas as suas gerações, qualquer homem entre os seus descendentes que se aproximar das coisas sagradas que os israelitas consagrarem a Yahweh, enquanto a sua impureza estiver sobre ele, será eliminado da minha presença.[a] Eu sou Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Será eliminado” traduz uma fórmula penal pactual. O texto não especifica aqui se ela indica morte, exclusão da comunidade ou outra forma de remoção.
    reason: Preservar a ambiguidade jurídica e teológica da fórmula hebraica כרת.
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: Diga-lhes
  rationale: Reproduz de modo direto e natural o imperativo singular dirigido a Moisés, seguido do pronome referente aos sacerdotes.
- source_word: לְדֹרֹתֵיכֶם
  choice: em todas as suas gerações
  rationale: Mantém a fórmula legal que expressa validade contínua ao longo das gerações sucessivas.
- source_word: כָּל אִישׁ אֲשֶׁר ... מִכָּל זַרְעֲכֶם
  choice: qualquer homem entre os seus descendentes que
  rationale: Preserva o masculino אִישׁ, pertinente no contexto dos descendentes sacerdotais de Arão, e verte זֶרַע como linhagem ou descendência, sem o literalismo pouco natural de “semente”.
- source_word: יִקְרַב
  choice: se aproximar
  rationale: Conserva o sentido espacial e ritual de chegar perto das coisas consagradas, sem pressupor especificamente que sejam comidas.
- source_word: הַקֳּדָשִׁים
  choice: as coisas sagradas
  rationale: Mantém a abrangência do plural cultual, que pode incluir ofertas e outros bens consagrados, sem restringi-lo indevidamente.
- source_word: יַקְדִּישׁוּ
  choice: consagrarem
  rationale: Expressa o sentido causativo de separar ou dedicar algo como santo, em registro cultual claro.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Equivalente português natural da designação étnica hebraica “filhos de Israel”, sem alterar o referente.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: enquanto a sua impureza estiver sobre ele
  rationale: Preserva a imagem hebraica da impureza ritual como condição que permanece sobre a pessoa, em vez de reduzi-la simplesmente a “estar impuro”.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: será eliminado
  rationale: Verte a fórmula penal de כרת aplicada à pessoa sem definir além do texto se o meio é morte, exclusão comunitária ou ação divina de outra natureza.
- source_word: מִלְּפָנַי
  choice: da minha presença
  rationale: Expressa idiomaticamente a construção hebraica “de diante de mim” e mantém Deus como referência da remoção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal indicado pelo Tetragrama, preservando sua função pactual no texto.
theological_decisions:
- issue: Sentido da fórmula penal וְנִכְרְתָה
  choice: será eliminado
  alternative: será morto; será excluído da comunidade; será extirpado
  rationale: O mecanismo preciso da pena não é especificado neste versículo e permanece discutido. A tradução mantém a indeterminação sem identificar a fórmula exclusivamente com morte, excomunhão ou perda de posição pactual.
- issue: Relação de מִלְּפָנַי com a pena
  choice: da minha presença
  alternative: de diante de mim
  rationale: A formulação escolhida preserva a remoção em relação à presença divina, mas usa português corrente e digno.
- issue: Identidade dos destinatários abrangidos por כָּל אִישׁ
  choice: qualquer homem entre os seus descendentes
  alternative: qualquer pessoa entre os seus descendentes
  rationale: O contexto imediato trata de Arão e de seus filhos, e o hebraico emprega אִישׁ no masculino. A tradução evita ampliar silenciosamente o caso legal para além da forma expressa no texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o tom solene e jurídico do texto sacerdotal, usando vocabulário cultual compreensível. “Coisas sagradas” e “a sua impureza estiver sobre ele” retêm a amplitude e a imagem do hebraico sem explicitação interpretativa excessiva.
