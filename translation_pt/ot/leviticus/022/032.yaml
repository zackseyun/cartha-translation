source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: pt
  text: Não profanem o meu santo nome, e serei reconhecido como santo no meio dos israelitas. Eu sou Yahweh, que os santifica.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: profanem
  rationale: O piel de חלל significa aqui profanar ou tratar como comum aquilo que é santo. “Profanar” preserva de modo conciso a força cultual e teológica do hebraico.
- source_word: שֵׁם קָדְשִׁי
  choice: o meu santo nome
  rationale: Expressão natural em português que mantém tanto “nome” quanto o atributo de santidade.
- source_word: וְנִקְדַּשְׁתִּי
  choice: serei reconhecido como santo
  rationale: O nifal de קדשׁ indica que Deus deve ser reconhecido, tratado ou manifestado como santo. Esta formulação comunica naturalmente o sentido passivo sem sugerir que Deus passe a adquirir santidade.
- source_word: בְּתוֹךְ
  choice: no meio de
  rationale: Preserva claramente o sentido locativo e relacional da atuação de Deus dentro da comunidade da aliança.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora literalmente “filhos de Israel”, a expressão hebraica é uma designação convencional de todo o povo de Israel; “os israelitas” é natural, exato quanto ao referente e inclusivo em português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: מְקַדִּשְׁכֶם
  choice: que os santifica
  rationale: O particípio expressa a ação característica e contínua de Deus. “Santifica” preserva a ligação lexical com קדשׁ e a precisão teológica.
theological_decisions:
- issue: Sentido de וְנִקְדַּשְׁתִּי aplicado a Deus
  choice: serei reconhecido como santo
  alternative: serei santificado
  rationale: Deus não se torna santo por ação alheia; o nifal descreve seu reconhecimento ou sua manifestação como santo entre o povo. A tradução mantém o passivo e evita uma inferência enganosa.
- issue: Representatividade de בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  alternative: os filhos de Israel
  rationale: A expressão designa coletivamente o povo da aliança, mulheres e homens. A forma idiomática portuguesa comunica o referente sem restringi-lo aos descendentes masculinos.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o Tetragrama como nome pessoal; a transliteração preserva essa distinção em relação a um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O imperativo plural foi vertido por “não profanem”, evitando o arcaísmo “não profaneis”. O waw entre as duas orações foi expresso por ponto e vírgula, que mantém a coordenação sem impor uma relação adversativa inexistente no hebraico.
