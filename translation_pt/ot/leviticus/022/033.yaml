  text: הַ/מּוֹצִ֤יא אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: pt
  text: que tirou vocês da terra do Egito para ser o Deus de vocês. Eu sou Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH (tradicionalmente traduzido por «SENHOR»; também transliterado «Yahweh»).'
    reason: Registra a forma hebraica e a alternativa tradicional de tradução do nome divino.
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: que tirou
  rationale: O particípio hifil de יצא descreve Yahweh como aquele que fez o povo sair. Em português corrente, a oração relativa com verbo no passado expressa naturalmente a referência ao êxodo já realizado.
- source_word: אֶתְכֶם
  choice: vocês
  rationale: O sufixo de segunda pessoa masculina plural é expresso com clareza pelo plural corrente «vocês», de ampla legibilidade brasileira.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Preserva a fórmula do êxodo e o substantivo אֶרֶץ, sem reduzi-la simplesmente a «do Egito».
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: para ser o Deus de vocês
  rationale: Reproduz de modo natural a fórmula relacional da aliança, היה + ל + אֱלֹהִים, sem enfraquecê-la nem explicá-la além do texto.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: A frase nominal hebraica é vertida idiomaticamente com «sou», e o nome divino é transliterado como «Yahweh».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração conserva o nome próprio da aliança presente no hebraico, enquanto a nota registra a forma tradicional sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e direto, com «vocês» para tornar explícito o plural hebraico. A inicial minúscula preserva a continuidade sintática com o versículo anterior. O marcador da nota foi colocado após «Yahweh», termo ao qual a nota se refere.
