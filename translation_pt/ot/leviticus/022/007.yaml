base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: pt
  text: Quando o sol se puser, ficará puro; depois disso, poderá comer das coisas sagradas[b], pois é o seu alimento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «pois isso é o seu pão». Aqui, «pão» significa o alimento que lhe cabe das porções sagradas.
    reason: lexical_alternative
  - marker: b
    text: Ou «das ofertas sagradas».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: Quando o sol se puser
  rationale: A expressão hebraica, literalmente «o sol entrar», é um modo idiomático de indicar o pôr do sol. A formulação portuguesa comunica com naturalidade o momento prescrito.
- source_word: וְטָהֵר
  choice: ele estará puro
  rationale: O verbo indica a restauração da pureza ritual. «Estará puro» preserva o valor sequencial sem transformar a declaração em pureza moral.
- source_word: וְאַחַר
  choice: depois disso
  rationale: Marca de modo claro a etapa seguinte da sequência ritual.
- source_word: יֹאכַל
  choice: poderá comer
  rationale: Neste contexto legal, a forma verbal expressa permissão após a restauração da pureza.
- source_word: מִן הַקֳּדָשִׁים
  choice: das coisas sagradas
  rationale: Mantém a amplitude do plural hebraico e evita especificar «ofertas» no texto principal, embora essa seja uma interpretação contextual plausível.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a razão da permissão.
- source_word: לַחְמוֹ הוּא
  choice: esse é o seu alimento
  rationale: O hebraico traz literalmente «ele/isso é o seu pão». O demonstrativo singular preserva a construção hebraica e retoma coletivamente a porção sagrada, enquanto «alimento» comunica o sentido amplo de לֶחֶם neste contexto.
theological_decisions:
- issue: Natureza da linguagem de pureza
  choice: pureza ritual
  alternative: pureza moral ou espiritual
  rationale: O contexto trata do acesso sacerdotal ao alimento sagrado depois de um estado de impureza. «Puro» conserva a linguagem do texto sem introduzir culpa moral.
- issue: Referência singular em לַחְמוֹ הוּא
  choice: «esse é o seu alimento», com referência coletiva às coisas sagradas
  alternative: «elas são o seu alimento»
  rationale: A opção mantém o singular explícito do hebraico sem impedir que o referente contextual sejam as porções sagradas mencionadas no plural.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A terminologia mantém o caráter ritual e jurídico do contexto levítico.
