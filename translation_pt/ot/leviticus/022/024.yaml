id: LEV.22.24
reference: Leviticus 22:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: pt
  text: Não apresentem a Yahweh nenhum animal que tenha os testículos machucados[a], esmagados, arrancados ou cortados; e não façam isso em sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “machucado, esmagado, arrancado ou cortado”, sem nomear a parte do corpo; pelo contexto, os quatro termos descrevem danos aos testículos do animal.
    reason: Explicita que “testículos” é um referente implícito e preserva a forma compacta e ambígua da expressão hebraica.
lexical_decisions:
- source_word: מָעוּךְ
  choice: machucados
  rationale: Indica dano causado por pressão. “Machucados” é claro e corrente, além de permitir distinguir o termo seguinte, mais forte, traduzido por “esmagados”.
- source_word: כָתוּת
  choice: esmagados
  rationale: Designa algo golpeado ou triturado; “esmagados” preserva a concretude e a intensidade do defeito físico.
- source_word: נָתוּק
  choice: arrancados
  rationale: Refere-se a algo separado por tração ou arrancamento. A escolha comunica a forma de mutilação sem confundi-la com o corte indicado pelo termo seguinte.
- source_word: כָרוּת
  choice: cortados
  rationale: Deriva do verbo comum para cortar ou eliminar por corte e descreve aqui uma condição de mutilação.
- source_word: תַקְרִיבוּ
  choice: apresentem
  rationale: No contexto sacrificial, o hifil significa apresentar ou levar uma oferta. “Apresentem” não restringe o ato apenas à queima no altar.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino pessoal expresso pelo tetragrama, em consonância com a convenção do projeto.
- source_word: בְאַרְצְכֶם
  choice: em sua terra
  rationale: Mantém a referência à terra pertencente à comunidade destinatária em português moderno e amplamente compreensível.
- source_word: תַעֲשׂוּ
  choice: não façam isso
  rationale: O verbo é amplo e elíptico. “Isso” retoma os atos descritos sem restringir indevidamente o alcance da proibição.
- source_word: objeto implícito dos quatro particípios
  choice: testículos
  rationale: O contexto de animais machos para sacrifício indica que os quatro defeitos dizem respeito aos órgãos sexuais masculinos. “Testículos” é anatomicamente claro e evita eufemismos arcaicos.
- source_word: objeto implícito de תַקְרִיבוּ
  choice: nenhum animal
  rationale: Os particípios funcionam de modo substantivado no hebraico; o contexto imediato trata de animais oferecidos, por isso o referente é explicitado para produzir português natural.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome divino pessoal em vez de substituí-lo por um título, seguindo a convenção declarada do projeto.
- issue: Alcance da proibição final וּבְאַרְצְכֶם לֹא תַעֲשׂוּ
  choice: proibição ampla de praticar na terra a mutilação descrita
  alternative: proibição apenas de oferecer ou preparar para sacrifício animais nessa condição
  rationale: O verbo “fazer” é amplo e elíptico e retoma mais naturalmente os atos de mutilação anteriores. “Não façam isso” preserva essa amplitude sem explicar além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e direto, com formas verbais dirigidas a “vocês”, naturais no Brasil e compreensíveis internacionalmente. A terminologia anatômica é clara, sem vulgaridade nem eufemismo arcaico.
