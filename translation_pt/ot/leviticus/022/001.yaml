base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido por “o SENHOR”; também vertido como “Javé”.'
    reason: Registra a forma hebraica e as principais tradições de tradução do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O waw consecutivo com דבר abre uma nova unidade de discurso. “Falou” reproduz de modo natural e digno a fórmula hebraica de introdução da fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; “a” é a formulação portuguesa natural com o verbo “falar”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz o conteúdo da fala. Em português moderno, os dois-pontos cumprem essa função com mais naturalidade do que a reprodução explícita “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a vocalização acadêmica amplamente aceita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula hebraica foi mantida de forma concisa; os dois-pontos introduzem naturalmente a fala que segue no versículo seguinte.
