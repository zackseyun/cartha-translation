id: LEV.18.21
reference: Leviticus 18:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: pt
  text: Não entregue nenhum dos seus descendentes[a] para fazê-lo passar a Moloque[b], nem profane o nome do seu Deus. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nenhum dos seus filhos”. O hebraico diz literalmente “da sua semente”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, para um rito associado a Moloque. Muitos entendem a expressão como referência ao sacrifício de crianças, descrito em outros textos como fazê-las “passar pelo fogo”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: nenhum dos seus descendentes
  rationale: זֶרַע significa literalmente “semente”, mas aqui designa a descendência. A formulação preserva o valor partitivo de מִן dentro da proibição e não restringe o referente a uma faixa etária.
- source_word: תִתֵּן
  choice: não entregue
  rationale: נתן é o verbo comum para “dar”. Neste contexto ritual, “entregar” soa natural em português e conserva a ideia de colocar um descendente à disposição do rito.
- source_word: לְהַעֲבִיר
  choice: para fazê-lo passar
  rationale: O hifil de עבר significa “fazer passar”. A tradução mantém a construção causativa e evita acrescentar “pelo fogo”, expressão que não ocorre neste versículo.
- source_word: לַמֹּלֶךְ
  choice: a Moloque
  rationale: A vocalização massorética e a interpretação tradicional favorecem o nome próprio da entidade ligada ao rito proibido. “Moloque” é a forma portuguesa corrente.
- source_word: תְחַלֵּל
  choice: profane
  rationale: No piel, חלל significa “profanar” ou “dessacralizar”. “Profanar” mantém o registro religioso e jurídico apropriado quando o objeto é o nome de Deus.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: o nome do seu Deus
  rationale: A formulação preserva o peso teológico de “nome” como expressão da honra e reputação revelada de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Natureza da proibição relacionada a Moloque
  choice: Manter no texto principal a expressão causativa “fazê-lo passar”, sem explicitar sacrifício ou fogo.
  alternative: “sacrificá-lo a Moloque” ou “fazê-lo passar pelo fogo a Moloque”
  rationale: Embora outros textos associem a prática ao fogo e ela seja amplamente entendida como sacrifício de crianças, este versículo não menciona explicitamente nem “sacrificar” nem “fogo”. A nota informa a interpretação provável sem eliminar a cautela lexical do hebraico.
- issue: Referente de זֶרַע nesta lei
  choice: descendentes
  alternative: filhos; semente
  rationale: O termo hebraico é mais amplo que “filhos” e literalmente significa “semente”. “Descendentes” comunica naturalmente o sentido familiar sem impor uma idade específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular “fazê-lo” retoma distributivamente “nenhum dos seus descendentes”. Mantém-se a parataxe e o tom direto da legislação, sem arcaísmos como “tua descendência” ou “não darás”.
