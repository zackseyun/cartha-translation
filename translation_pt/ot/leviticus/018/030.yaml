    issue: «o dever que lhes confiei» explicita uma ideia não dita.
    rationale: מִשְׁמַרְתִּי designa a ordem, incumbência ou obrigação de Deus a ser observada, mas não afirma aqui o ato de confiá-la aos destinatários.
  - severity: medium
    issue: A estrutura «não praticando ... para que não se tornem» altera a coordenação diretiva do original.
    rationale: O hebraico apresenta o propósito «para não praticarem» seguido de «e não se contaminem». A revisão conserva mais claramente ambas as exortações.
