source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: pt
  text: Observem a minha ordem, para não praticarem nenhum dos costumes detestáveis que foram praticados antes de vocês e não se contaminem com eles. Eu sou Yahweh, o Deus de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh é o nome divino representado pelas quatro consoantes hebraicas YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: divine_name
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמַרְתִּי
  choice: cumpram o dever que lhes confiei
  rationale: A combinação de שׁמר com מִשְׁמֶרֶת expressa a observância de uma responsabilidade ou incumbência. Esta formulação comunica em português natural tanto o dever quanto seu caráter confiado, sem reduzi-lo a um único mandamento.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: não praticando
  rationale: 'A construção indica finalidade ou prevenção. O gerúndio ligado ao imperativo contextual expressa de modo natural como se cumpre o dever: abstendo-se dessas práticas.'
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: nenhum dos costumes detestáveis
  rationale: O מִן partitivo sustenta 'nenhum dos'. חֻקּוֹת pode designar prescrições, usos estabelecidos ou costumes; no contexto das condutas das nações, 'costumes' é mais natural que 'estatutos'. תּוֹעֵבֹת mantém a forte avaliação moral e cultual com 'detestáveis'.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: que eram praticados antes de vocês
  rationale: O passivo refere-se às práticas dos habitantes anteriores. 'Antes de vocês' conserva o sentido temporal contextual, e 'eram praticados' comunica conduta habitual.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: para que não se tornem impuros por meio deles
  rationale: A forma verbal tem sentido reflexivo de tornar-se impuro, enquanto בָּהֶם indica o meio. A formulação preserva ambos sem pressupor apenas impureza ritual ou apenas moral.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Eu sou Yahweh, o Deus de vocês
  rationale: Mantém a fórmula de autoidentificação da aliança e representa diretamente o nome divino יהוה como Yahweh.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' representa o nome pessoal sem substituí-lo por um título; a nota registra a convenção tradicional amplamente conhecida.
- issue: Amplitude moral e cultual de תּוֹעֵבֹת e טמא
  choice: detestáveis; impuros
  alternative: abomináveis; contaminados
  rationale: As escolhas preservam a forte reprovação e a linguagem de impureza do texto, sem resolver indevidamente se cada aspecto é exclusivamente moral, ritual ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural 'vocês' torna explícito o destinatário coletivo. 'Dever que lhes confiei' evita o pouco idiomático 'guardar minha guarda', enquanto preserva a ideia de incumbência. O marcador [a] aparece no texto principal.
