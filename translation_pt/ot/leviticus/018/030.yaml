review_pass:
  verdict: revise
  source_fidelity: A revisão é necessária. «Portanto» introduz uma inferência que o hebraico não expressa, e «o dever que lhes confiei» acrescenta explicitamente a ideia de Deus ter confiado esse dever. Além disso, a combinação «não praticando ... para que» enfraquece e reorganiza as duas formas diretivas coordenadas do hebraico. A revisão preserva a incumbência/ordem divina, a finalidade de evitar tais costumes e a proibição de contaminar-se com eles.
  naturalness: O texto revisto emprega português moderno e claro, com «vocês» adequado ao público-alvo. «Observem a minha ordem» é mais natural do que uma reprodução literal de «guardem minha incumbência», sem introduzir a noção adicional de algo confiado.
  terminology: «Costumes detestáveis» representa adequadamente a amplitude de חֻקּוֹת הַתּוֹעֵבֹת neste contexto; «contaminem» conserva a linguagem de impureza sem decidir se ela é apenas ritual ou moral. «Yahweh» corresponde diretamente ao Tetragrama, e a nota explicativa permanece apropriada.
  issues:
