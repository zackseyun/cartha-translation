id: LEV.18.9
reference: Leviticus 18:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: pt
  text: Não descubra a nudez de sua irmã, seja ela filha de seu pai ou filha de sua mãe, nascida em casa ou fora dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nascida no âmbito da família ou fora dele”. O hebraico contrapõe o nascimento “em casa” ao nascimento “fora”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: a nudez de ...
  rationale: Em Levítico 18, עֶרְוָה integra a fórmula jurídica para relações sexuais proibidas. “Descobrir a nudez” preserva o caráter idiomático e jurídico do hebraico sem reduzir a expressão a mera vergonha.
- source_word: אֲחוֹתְךָ
  choice: sua irmã
  rationale: Termo direto de parentesco, dirigido no singular a um homem, conforme o estilo jurídico do capítulo.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: filha de seu pai / filha de sua mãe
  rationale: Mantém a simetria e a precisão familiar das expressões hebraicas, incluindo irmãs por parte de pai ou de mãe.
- source_word: מוֹלֶדֶת
  choice: nascida
  rationale: Expressa de modo claro e natural a condição de ter nascido no âmbito indicado pelas locuções seguintes.
- source_word: בַּיִת / חוּץ
  choice: em casa / fora dela
  rationale: Conserva o contraste espacial e doméstico do hebraico entre “casa” e “fora”, sem decidir além do que o texto especifica.
- source_word: לֹא תְגַלֶּה
  choice: Não descubra
  rationale: Imperativo negativo natural no português moderno que preserva o verbo da fórmula hebraica “descobrir a nudez”.
- source_word: אוֹ ... אוֹ
  choice: seja ... ou
  rationale: Representa naturalmente as alternativas classificatórias apresentadas pelo hebraico.
theological_decisions:
- issue: Alcance da relação proibida
  choice: A proibição abrange a irmã que seja filha do mesmo pai ou da mesma mãe, tenha nascido em casa ou fora dela.
  alternative: As qualificações finais podem ser entendidas mais especificamente como distinção entre irmãs criadas no lar e irmãs nascidas ou residentes fora dele.
  rationale: A formulação hebraica amplia a categoria de “irmã” e não autoriza restringir a proibição. A tradução mantém a amplitude e preserva a ambiguidade concreta do contraste entre casa e exterior.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fórmula jurídica bíblica “descobrir a nudez” foi mantida; evitou-se linguagem arcaizante e também uma paráfrase sexual mais explícita do que o original.
