  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: pt
  text: Não descubra a nudez do irmão de seu pai; não se aproxime da mulher dele[a]. Ela é sua tia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aproximar-se”; neste contexto, o verbo tem sentido sexual dentro da fórmula das leis sobre relações incestuosas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: a nudez de
  rationale: Em Levítico 18, a expressão fixa “descobrir a nudez” é um eufemismo jurídico para relações sexuais proibidas. A formulação concreta preserva a linguagem recorrente do hebraico sem reduzir o texto a uma paráfrase.
- source_word: אֲחִי אָבִיךָ
  choice: o irmão de seu pai
  rationale: Reproduz de modo direto e natural a cadeia de parentesco hebraica, mantendo a especificidade do vínculo paterno.
- source_word: לֹא תְגַלֵּה
  choice: não descubra
  rationale: O piel de גלה integra a fórmula jurídica “descobrir a nudez”. O imperativo negativo é natural em português e conserva o tom de proibição.
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: não se aproxime da mulher dele
  rationale: קרב com אֶל significa literalmente “aproximar-se”. Neste contexto, tem sentido sexual, mas a tradução conserva o eufemismo contido do original; “dele” identifica com clareza o referente.
- source_word: דֹּדָתְךָ
  choice: sua tia
  rationale: דּוֹדָה designa a tia; aqui, especificamente, a esposa do irmão do pai, como esclarece a oração anterior.
- source_word: הִוא
  choice: Ela é
  rationale: 'O pronome funciona como sujeito de uma oração nominal: “Ela é sua tia”. Não se acrescenta um nexo causal que o hebraico apenas poderia sugerir pelo contexto.'
theological_decisions:
- issue: Tradução do eufemismo jurídico relativo ao incesto
  choice: Manter “descobrir a nudez” no texto principal.
  alternative: Explicitar como “ter relações sexuais com”.
  rationale: A expressão é uma fórmula recorrente no capítulo. Preservá-la mantém a coesão literária e a transparência ao hebraico, enquanto o contexto deixa claro seu sentido sexual.
- issue: Identificação exata do parentesco
  choice: Traduzir דֹּדָתְךָ por “sua tia”.
  alternative: Repetir “a mulher do irmão de seu pai” ou usar “tia por afinidade”.
  rationale: O hebraico emprega o termo comum para “tia”, depois de já especificar a relação familiar. A tradução concisa preserva essa progressão sem introduzir terminologia técnica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação preserva o paralelismo jurídico e os eufemismos do hebraico. Emprega-se “seu” de modo coerente com o tratamento dirigido ao leitor; “mulher dele” evita a possível ambiguidade de “sua mulher”.
