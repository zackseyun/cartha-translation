    rationale: לָלֶכֶת בָּהֶם diz literalmente “andar neles” e funciona como metáfora de conduta. “Segundo eles” é interpretativo e perde essa imagem, embora a nota já permita oferecer “viver de acordo com eles” como alternativa idiomática.
