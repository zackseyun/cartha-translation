  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: pt
  text: Cumpram as minhas normas e guardem os meus estatutos, para andarem neles[a]. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para viverem de acordo com eles”. O hebraico diz literalmente: “para andarem neles”, uma expressão para conduzir a vida de acordo com os mandamentos de Deus.'
    reason: Registra a alternativa idiomática sem retirar do texto principal a metáfora hebraica nem acrescentar uma interpretação mais forte.
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: as minhas normas
  rationale: מִשְׁפָּטַי designa aqui determinações ou normas de caráter jurídico. “Normas” comunica essa função com clareza em português atual e permanece distinto de “estatutos”.
- source_word: תַּעֲשׂוּ
  choice: Cumpram
  rationale: Embora עשה signifique literalmente “fazer”, no contexto de mandamentos “cumprir” expressa de modo natural a prática efetiva das normas.
- source_word: חֻקֹּתַי
  choice: os meus estatutos
  rationale: חֻקָּה refere-se a prescrições estabelecidas. “Estatutos” conserva o registro legal e a distinção em relação a מִשְׁפָּטַי.
- source_word: תִּשְׁמְרוּ
  choice: guardem
  rationale: שׁמר significa guardar, vigiar ou observar. “Guardem” preserva a linguagem pactual e a ideia de observância cuidadosa.
- source_word: לָלֶכֶת בָּהֶם
  choice: para andarem segundo eles
  rationale: A expressão indica conduzir a vida conforme as normas. “Andarem segundo eles” mantém a metáfora hebraica do andar, mas soa mais natural em português do que o literal “andarem neles”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: A construção com sufixo de segunda pessoa masculina plural expressa diretamente “o Deus de vocês”; essa forma tem ampla legibilidade brasileira e é compreensível internacionalmente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Sentido de לָלֶכֶת בָּהֶם
  choice: para andarem segundo eles
  alternative: para viverem de acordo com eles; para andarem neles
  rationale: A escolha conserva a metáfora ética do caminhar e não transforma a frase na afirmação teologicamente mais forte de obter vida por meio da obediência.
translation_notes:
  register: Português atual, digno e acessível, com imperativos no plural. “Normas” e “estatutos” mantêm dois termos jurídicos distintos; “andar segundo” preserva a metáfora hebraica em formulação natural.
