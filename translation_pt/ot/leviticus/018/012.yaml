  text: עֶרְוַ֥ת אֲחוֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה שְׁאֵ֥ר אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: pt
  text: Não descubra a nudez da irmã de seu pai[a]; ela é uma parente de sangue de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Descobrir a nudez” é uma expressão jurídica usada em Levítico para exposição sexual ou relações sexuais proibidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: Não descubra a nudez de
  rationale: Preserva a fórmula jurídica recorrente de Levítico 18, em vez de explicitar no texto principal algo além da expressão hebraica.
- source_word: אֲחוֹת אָבִיךָ
  choice: a irmã de seu pai
  rationale: Reproduz diretamente a relação de parentesco e é mais transparente que o termo técnico “tia paterna”.
- source_word: שְׁאֵר
  choice: parente de sangue
  rationale: No contexto de parentesco, designa alguém unido por consanguinidade. A expressão comunica o sentido com naturalidade, sem a obscuridade que “carne de seu pai” teria em português.
- source_word: הִוא
  choice: ela é
  rationale: Mantém de modo simples e natural a identificação enfática da mulher com o grau de parentesco proibido.
theological_decisions:
- issue: Tradução do idioma jurídico relativo à nudez
  choice: Manter “não descubra a nudez” no texto principal.
  alternative: “Não tenha relações sexuais com”.
  rationale: A formulação conserva a linguagem jurídica e a coerência interna de Levítico 18; a nota esclarece seu alcance sem transformar a tradução em paráfrase.
- issue: Sentido de שְׁאֵר na cláusula de parentesco
  choice: “parente de sangue”.
  alternative: “carne” ou “parente próxima”.
  rationale: “Parente de sangue” expressa a consanguinidade indicada pelo termo no contexto. “Carne” seria formalmente mais literal, mas pouco clara em português, enquanto “parente próxima” não explicita tão bem a relação consanguínea.
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa negativa natural. A fórmula hebraica foi preservada no texto e esclarecida em nota.
