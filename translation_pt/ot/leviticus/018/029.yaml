source:
  edition: WLC
  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: pt
  text: Pois todos os que praticarem qualquer uma destas abominações[a] serão cortados do meio do seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão mortos” ou “serão excluídos da comunidade”. O hebraico diz literalmente “serão cortados”, sem especificar a forma exata do julgamento.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou consequência das proibições anteriores, com valor causal-explicativo natural em português.
- source_word: כָּל אֲשֶׁר
  choice: todo aquele que
  rationale: Expressa a relação indefinida e universal do hebraico, abrangendo qualquer pessoa que pratique tais atos.
- source_word: יַעֲשֶׂה / הָעֹשֹׂת
  choice: praticar / praticarem
  rationale: O verbo básico significa 'fazer'; neste contexto de condutas enumeradas, 'praticar' soa natural sem acrescentar uma qualificação moral inexistente no verbo.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: qualquer uma destas abominações
  rationale: Preserva o sentido partitivo de מִן e o alcance abrangente de כֹּל em português idiomático.
- source_word: תּוֹעֵבוֹת
  choice: abominações
  rationale: Mantém a gravidade moral e ritual do termo no contexto das leis de santidade, além de sua formulação bíblica reconhecível.
- source_word: וְנִכְרְתוּ
  choice: serão eliminadas
  rationale: Comunica a imagem de serem retiradas do corpo comunitário sem determinar no texto principal se isso ocorre por morte, juízo divino ou exclusão; a ambiguidade é explicitada na nota.
- source_word: הַנְּפָשׁוֹת
  choice: as pessoas
  rationale: Em contexto jurídico, נֶפֶשׁ designa indivíduos ou pessoas, não uma 'alma' separada do corpo.
- source_word: מִקֶּרֶב עַמָּם
  choice: do meio do seu povo
  rationale: Reproduz com naturalidade a fórmula comunitária hebraica e conserva a referência coletiva de עַמָּם.
theological_decisions:
- issue: Sentido da fórmula penal וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  choice: serão eliminadas do meio do seu povo
  alternative: serão mortas; serão excluídas da comunidade; serão cortadas do meio do seu povo
  rationale: A fórmula hebraica não especifica aqui se a pena consiste em morte, juízo divino ou expulsão. A tradução conserva a indeterminação, e a nota registra as principais possibilidades sem escolher uma delas.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. O travessão preserva a retomada enfática entre a declaração universal e a consequência jurídica; a nota mantém aberta a ambiguidade da fórmula penal hebraica.
