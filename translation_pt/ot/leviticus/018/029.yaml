  to: Pois todos os que praticarem qualquer uma destas abominações[a] serão cortados do meio do seu povo.
  rationale: A revisão substitui «eliminadas» por «cortados», preservando a formulação jurídica e a ambiguidade da pena no texto principal. Também reestrutura a frase no plural («todos os que ... serão») para refletir naturalmente «as pessoas que fazem» e evitar a quebra sintática do rascunho. A nota mantém as possibilidades interpretativas sem as impor.
