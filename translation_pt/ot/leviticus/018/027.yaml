id: LEV.18.27
reference: Leviticus 18:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: pt
  text: Pois os habitantes da terra que vieram antes de vocês praticaram todas essas abominações, e a terra ficou impura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra foi contaminada”.'
    reason: Alternativa lexical para וַתִּטְמָא, preservando a possibilidade de traduzir טמא por “contaminar” em vez de “ficar impuro”.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão explicativa da advertência anterior e mantém a ligação argumentativa em português natural.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: todas essas abominações
  rationale: Preserva a força moral e pactual de תּוֹעֵבָה, bem como o plural e a referência demonstrativa às práticas enumeradas.
- source_word: עָשׂוּ
  choice: praticaram
  rationale: O verbo עשה significa literalmente “fazer”; neste contexto, “praticaram” é a combinação mais natural em português com “abominações”, sem lhe atribuir um sentido técnico.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: os habitantes da terra
  rationale: A expressão hebraica funciona coletivamente para designar a população anterior do território. “Habitantes” comunica esse valor idiomático com clareza e evita que “homens da terra” seja entendido como proprietários rurais.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: que vieram antes de vocês
  rationale: Expressa de modo natural a anterioridade temporal dos habitantes em relação aos destinatários.
- source_word: וַתִּטְמָא
  choice: ficou impura
  rationale: Comunica o estado resultante expresso pelo verbo טמא sem decidir se a impureza deve ser entendida como exclusivamente ritual, moral ou metafórica.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se ao território habitado antes de Israel, e não ao planeta inteiro.
theological_decisions:
- issue: Natureza da impureza da terra
  choice: a terra ficou impura
  alternative: a terra foi contaminada
  rationale: A tradução mantém a ligação teológica entre os atos humanos e a impureza da terra, sem reduzir essa impureza a uma categoria exclusivamente ritual ou figurada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” traduz o plural de segunda pessoa; “habitantes da terra” reproduz o sentido coletivo da expressão hebraica de maneira idiomática.
