source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: pt
  text: para que a terra não vomite vocês quando a contaminarem,[a] assim como vomitou a nação que esteve ali antes de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando a tornarem impura”. O hebraico emprega a imagem vívida da terra vomitando, isto é, expulsando seus habitantes por ter sido contaminada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: vomite / vomitou
  rationale: Preserva a imagem vívida do hebraico, em que a terra expulsa seus habitantes como quem vomita, sem suavizá-la para uma ideia abstrata de expulsão.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto, refere-se especificamente à terra de Canaã, não ao planeta inteiro.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: quando a contaminarem
  rationale: A construção com בְּ e infinitivo pode ter valor temporal ou circunstancial. Esta formulação é natural em português e mantém a ideia causativa de tornar a terra impura.
- source_word: הַגּוֹי
  choice: a nação
  rationale: Conserva o substantivo coletivo singular e evita acrescentar a conotação posterior de 'gentios'.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: que esteve ali antes de vocês
  rationale: Explicita de modo natural que se trata da nação que ocupava anteriormente a terra, sem alterar o sentido temporal da expressão.
- source_word: וְלֹא
  choice: para que ... não
  rationale: No contexto, a expressão introduz uma consequência a ser evitada; a construção escolhida comunica esse valor de maneira corrente em português.
theological_decisions:
- issue: Personificação da terra como agente do juízo
  choice: Manter a terra como sujeito gramatical que 'vomita' seus habitantes.
  alternative: Explicitar Deus como aquele que expulsa os habitantes por meio da terra.
  rationale: O hebraico personifica expressamente a terra reagindo à contaminação. Preservar a imagem mantém a tensão teológica do texto entre impureza moral, contaminação da terra e expulsão, sem inserir uma explicação causal que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' reproduz naturalmente a segunda pessoa plural do hebraico. A metáfora forte de 'vomitar' foi mantida, e 'esteve ali' esclarece a anterioridade dos habitantes sem tornar a frase excessivamente literal.
