source:
  edition: WLC
  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: pt
  text: Não se aproxime de uma mulher durante a impureza menstrual dela para descobrir a nudez dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “durante a impureza da menstruação dela”. O hebraico emprega linguagem de pureza ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה
  choice: de uma mulher
  rationale: Com תִקְרַב, a preposição אֶל integra a construção idiomática “aproximar-se de”. אִשָּׁה é aqui genérico e não possessivo, portanto “uma mulher”, e não “uma esposa”.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: durante a impureza da menstruação dela
  rationale: נִדָּה indica a condição relacionada à menstruação, e טֻמְאָה pertence ao vocabulário levítico de pureza ritual. A formulação preserva essa categoria e permanece compreensível em português atual.
- source_word: לֹא תִקְרַב
  choice: Não se aproxime
  rationale: O imperfeito com לֹא formula uma proibição legal. “Não se aproxime” reproduz naturalmente em português tanto a força proibitiva quanto o eufemismo contextual.
- source_word: לְ/גַלּוֹת
  choice: para descobrir
  rationale: O infinitivo expressa finalidade. “Descobrir” mantém o sentido literal e o eufemismo jurídico recorrente do capítulo.
- source_word: עֶרְוָתָהּ
  choice: a sua nudez
  rationale: “Nudez” é a correspondência formal e contextual de עֶרְוָה e preserva, sem explicitação excessiva, o eufemismo sexual “descobrir a nudez”.
theological_decisions:
- issue: Se a linguagem de impureza deve ser entendida como ritual ou reduzida a uma condição médica ou higiênica
  choice: impureza da menstruação
  alternative: período menstrual
  rationale: טֻמְאָה é linguagem de pureza ritual em Levítico. A tradução conserva a categoria própria do texto sem sugerir que a menstruação seja, em si, culpa moral ou mera questão médica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A proibição foi formulada no imperativo negativo natural do português; o eufemismo legal hebraico foi preservado.
