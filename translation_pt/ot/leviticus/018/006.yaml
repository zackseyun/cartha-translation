  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: pt
  text: Nenhum homem dentre vocês se aproxime de qualquer parente próximo para descobrir a nudez[a]. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “descobrir a nudez” é uma expressão jurídica usada neste capítulo para se referir à exposição sexual ou a relações sexuais proibidas com um parente próximo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Nenhum de vocês
  rationale: 'A repetição tem sentido distributivo: a proibição se aplica a cada pessoa. Em português, a formulação negativa expressa isso naturalmente sem acrescentar um referente masculino ausente da aplicação contextual.'
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: qualquer parente próximo
  rationale: A expressão hebraica literalmente ligada à carne designa parentesco próximo. A tradução comunica a relação de parentesco em português corrente sem impor a noção moderna mais restrita de parentesco apenas consanguíneo.
- source_word: לֹא תִקְרְבוּ
  choice: se aproxime
  rationale: O verbo sob negação formula uma proibição legal. 'Aproximar-se' preserva o caráter deliberadamente indireto da expressão hebraica e combina com o infinitivo de finalidade seguinte.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: para lhe descobrir a nudez
  rationale: Mantém a imagem e o idioma jurídico-sexual recorrente no capítulo. O pronome 'lhe' torna clara e natural em português a relação com o parente mencionado, enquanto a nota explica o alcance do idioma.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Preserva a fórmula enfática de autoidentificação e representa diretamente o nome divino expresso no texto hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome próprio divino. 'Yahweh' o preserva de forma transparente, em vez de substituí-lo por um título.
- issue: Grau de explicitação da expressão sexual
  choice: manter 'descobrir a nudez' no texto principal
  alternative: ter relações sexuais; expor sexualmente
  rationale: A expressão hebraica é deliberadamente idiomática e se repete ao longo do capítulo. Mantê-la preserva a unidade literária e a amplitude do idioma, enquanto a nota esclarece seu sentido jurídico-sexual sem reduzi-lo silenciosamente a uma única paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com formulação proibitiva natural. Conserva-se o idioma concreto do hebraico, acompanhado de nota explicativa. A pontuação separa a fórmula divina conclusiva.
