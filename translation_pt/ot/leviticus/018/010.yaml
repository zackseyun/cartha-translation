id: LEV.18.10
reference: Leviticus 18:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: pt
  text: Não descubra a nudez da filha do seu filho nem da filha da sua filha[a], pois elas são a sua própria nudez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “Não tenha relações sexuais com a filha do seu filho nem com a filha da sua filha”. A expressão hebraica é literalmente “descobrir a nudez”.'
    reason: lexical_alternative
  - marker: b
    text: A oração final é literalmente “pois elas são a sua nudez”. Ela apresenta essas descendentes próximas como uma extensão da própria família e, por isso, sexualmente proibidas.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: nudez
  rationale: Preserva o termo recorrente e o eufemismo jurídico-sexual do capítulo. Na oração final, mantém a formulação deliberadamente incomum do hebraico, sem substituí-la por uma explicação interpretativa.
- source_word: בַּת בִּנְךָ
  choice: a filha do seu filho
  rationale: Reproduz com precisão a relação de parentesco pela linha do filho e mantém o paralelismo bilateral da lei.
- source_word: בַת בִּתְּךָ
  choice: a filha da sua filha
  rationale: Reproduz com precisão a relação de parentesco pela linha da filha, sem reduzir as duas expressões a um termo genérico.
- source_word: לֹא תְגַלֶּה
  choice: Não descubra
  rationale: Emprega uma proibição direta em português atual e conserva a imagem jurídica recorrente de 'descobrir a nudez'.
- source_word: כִּי
  choice: pois
  rationale: Expressa de modo natural o valor causal-explicativo da conjunção hebraica.
- source_word: הֵנָּה
  choice: elas são
  rationale: Mantém a predicação feminina plural que retoma as duas descendentes mencionadas.
theological_decisions:
- issue: Sentido da justificativa final כִּי עֶרְוָתְךָ הֵנָּה
  choice: pois elas são a sua própria nudez
  alternative: pois a nudez delas é como a sua própria nudez
  rationale: A tradução conserva a identificação familiar direta e incomum expressa pelo hebraico. Não a transforma em 'sua própria carne' nem insere uma comparação ausente, preservando a tensão conceitual do texto.
translation_notes:
  register: Português moderno, claro e digno, com proibição direta. A formulação tradicional “descobrir a nudez” foi mantida por sua função estrutural em Levítico 18, enquanto a nota esclarece seu sentido sexual. “Nem” torna natural em português a coordenação negativa das duas relações de parentesco.
