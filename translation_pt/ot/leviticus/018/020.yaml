  text: וְ/אֶל אֵ֨שֶׁת֙ עֲמִֽיתְ/ךָ֔ לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/זָ֑רַע לְ/טָמְאָה בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/020.yaml
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: pt
  text: Não tenha relações sexuais[a] com a mulher do seu próximo, tornando-se impuro com ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Não dê a sua emissão de sêmen à mulher do seu próximo”.'
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: a mulher do seu próximo
  rationale: Neste contexto legal, עָמִית designa outro membro da comunidade. “A mulher do seu próximo” é uma formulação clara, idiomática e adequada ao registro bíblico em português.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: Não tenha relações sexuais
  rationale: A expressão hebraica descreve literalmente a entrega do derramamento sexual como sêmen, mas funciona como referência ao ato sexual. A tradução comunica diretamente a proibição, enquanto a imagem concreta do original é preservada na nota.
- source_word: לְטָמְאָה בָהּ
  choice: contaminando-se com ela
  rationale: O infinitivo expressa a contaminação resultante do ato. “Contaminando-se” preserva a linguagem de impureza sem limitar o sentido, de maneira indevida, apenas à impureza ritual.
theological_decisions:
- issue: Natureza da proibição e da linguagem de impureza
  choice: Proibição de relações sexuais com a mulher do próximo, pelas quais o homem se contamina.
  alternative: Manter no texto principal a expressão literal sobre o derramamento seminal ou traduzir o resultado exclusivamente como impureza ritual.
  rationale: O idioma hebraico refere-se claramente ao ato sexual, e a frase final declara a contaminação do destinatário. A tradução conserva tanto a clareza da proibição quanto a amplitude da linguagem de impureza.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Relações sexuais” torna explícito o sentido do idioma hebraico; “mulher do seu próximo” mantém a formulação jurídica e relacional do texto.
