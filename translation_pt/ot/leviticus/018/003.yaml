source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: pt
  text: Não façam como fazem na terra do Egito[a], onde vocês moraram, nem façam como fazem na terra de Canaã, para onde eu os estou levando. Não sigam os estatutos deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não ajam segundo as práticas da terra do Egito [...] nem segundo as práticas da terra de Canaã”. O idioma hebraico fala literalmente dos “atos” ou das “práticas” da terra.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não andem segundo os estatutos deles”. A expressão hebraica usa “andar” como metáfora da conduta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: como se faz
  rationale: Expressa de modo natural a comparação hebraica, literalmente ligada aos “atos” ou “práticas” da terra, sem atribuir ação ao solo nem especificar além do texto quem pratica tais atos.
- source_word: אֶרֶץ מִצְרַיִם
  choice: a terra do Egito
  rationale: Preserva a construção geográfica explícita do hebraico e soa natural em português bíblico contemporâneo.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: onde vocês moraram
  rationale: Traduz com clareza a oração relativa e o verbo no passado, identificando o Egito como a antiga morada dos destinatários.
- source_word: לֹא תַעֲשׂוּ
  choice: não façam
  rationale: O imperativo negativo é a forma mais natural e direta de exprimir em português a proibição legal marcada por לֹא com o imperfeito.
- source_word: וּכְמַעֲשֵׂה אֶרֶץ כְּנַעַן
  choice: nem façam como se faz na terra de Canaã
  rationale: Mantém o paralelismo com a primeira proibição e usa “nem” para ligar naturalmente duas proibições coordenadas.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: para onde eu os estou levando
  rationale: O particípio מֵבִיא comunica ação em curso ou iminente; “estou levando” preserva essa nuance e שָׁמָּה é representado por “para onde”.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: os estatutos deles
  rationale: “Estatutos” preserva o caráter normativo de חֻקּוֹת e a ligação lexical com a linguagem legal do contexto; a construção portuguesa acompanha naturalmente o verbo “seguir”.
- source_word: לֹא תֵלֵכוּ
  choice: não sigam
  rationale: Traduz idiomaticamente a metáfora hebraica de “andar” segundo normas, evitando a expressão pouco natural “andar nos estatutos” no português corrente.
theological_decisions:
- issue: Se as práticas proibidas devem ser explicitamente atribuídas aos habitantes do Egito e de Canaã
  choice: como se faz na terra do Egito/Canaã
  alternative: segundo as práticas da terra do Egito/Canaã
  rationale: A formulação impessoal comunica que se trata do comportamento praticado nesses lugares, sem transformar a terra em agente e sem inserir explicitamente “os habitantes”, termo apenas implícito.
- issue: Como representar חֻקֹּתֵיהֶם no contraste com as ordenanças do SENHOR
  choice: estatutos
  alternative: costumes
  rationale: “Estatutos” mantém a força normativa do termo e o contraste legal no contexto. “Costumes” é possível, mas pode sugerir hábitos meramente sociais.
- issue: Se deve ser preservada literalmente a metáfora de andar em לֹא תֵלֵכוּ
  choice: não sigam
  alternative: não andem segundo
  rationale: “Sigam” transmite o sentido comportamental da metáfora em português natural. A alternativa conserva mais diretamente a imagem, mas exige uma complementação que já interpreta a relação sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo indicado pelas formas verbais hebraicas. Evitou-se tanto uma literalidade pouco natural quanto uma explicitação indevida dos habitantes; preservou-se “terra” e o vocabulário jurídico “estatutos”.
