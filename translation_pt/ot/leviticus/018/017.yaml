  terminology: “Perversidade” representa bem זִמָּה como qualificação moral grave. A nota sobre “descobrir a nudez” explica corretamente o hebraísmo. A nota de [b] registra a alternativa literal e esclarece seu valor de parentesco; a de [c] oferece alternativas plausíveis para זִמָּה. Os marcadores estão todos ancorados e coerentes.
