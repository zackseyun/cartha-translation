id: LEV.18.17
reference: Leviticus 18:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: pt
  text: Não descubra a nudez de uma mulher e da filha dela.[a] Não tome a filha do filho dela nem a filha da filha dela para descobrir a nudez daquela mulher; elas são parentes de sangue.[b] Isso é uma perversidade.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Descobrir a nudez” é uma expressão hebraica para manter relações sexuais proibidas.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “elas são a carne dela”, isto é, parentes próximas.'
    reason: lexical_alternative
  - marker: c
    text: Ou “infâmia”, “indecência” ou “ato vergonhoso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה / לְגַלּוֹת עֶרְוָתָהּ
  choice: descobrir a nudez de / para descobrir a nudez daquela mulher
  rationale: Mantém o idioma jurídico recorrente de Levítico e sua ligação intertextual. A nota esclarece que se trata de relações sexuais proibidas. Na segunda ocorrência, “daquela mulher” torna natural em português a referência feminina singular, sem substituí-la por uma interpretação distributiva.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O substantivo pode significar “mulher” ou “esposa”; “mulher” preserva o sentido mais amplo, pois o texto não exige que haja casamento.
- source_word: וּבִתָּהּ
  choice: e da filha dela
  rationale: Expressa de modo claro a relação possessiva com a mulher mencionada e evita a possível ambiguidade de “sua filha” em português.
- source_word: תִקַּח
  choice: tome
  rationale: Preserva a amplitude do verbo hebraico, que neste contexto pode envolver união matrimonial ou sexual, sem restringir a proibição apenas ao casamento formal.
- source_word: בַּת בְּנָהּ
  choice: a filha do filho dela
  rationale: Conserva a estrutura específica de parentesco do hebraico e distingue a descendência pela linha do filho.
- source_word: בַּת בִּתָּהּ
  choice: a filha da filha dela
  rationale: Conserva a estrutura específica de parentesco do hebraico e distingue a descendência pela linha da filha.
- source_word: שַׁאֲרָה הֵנָּה
  choice: elas são parentes de sangue
  rationale: Comunica naturalmente a ideia de vínculo carnal ou consanguíneo; a nota registra a expressão mais literal, “são a carne dela”.
- source_word: זִמָּה
  choice: uma perversidade
  rationale: Expressa a grave condenação moral, especialmente sexual, do termo hebraico sem recorrer a vocabulário arcaico.
- source_word: הִוא
  choice: isso é
  rationale: Retoma o ato proibido como um todo, de maneira idiomática em português.
theological_decisions:
- issue: Referente do sufixo singular em לְגַלּוֹת עֶרְוָתָהּ
  choice: 'Manter a referência à mulher inicialmente mencionada: “daquela mulher”.'
  alternative: Entender o sufixo distributivamente, como referente a cada uma das descendentes.
  rationale: O sufixo hebraico é feminino singular, e o contexto parte da nudez da mulher e de sua filha para estender a proibição às netas. A formulação preserva essa ligação sem desenvolver além do que o texto diz.
- issue: Alcance de תִקַּח neste mandamento
  choice: Usar “tome”, sem limitar o verbo ao casamento.
  alternative: “case-se com” ou “tome por esposa”.
  rationale: A proibição trata da união sexual dentro do parentesco, e não somente da formalização matrimonial. A oração seguinte explicita a natureza sexual do ato.
- issue: Sentido jurídico do idioma “descobrir a nudez”
  choice: Conservar o idioma no texto e explicá-lo em nota.
  alternative: Traduzir diretamente como “ter relações sexuais”.
  rationale: A conservação do idioma mantém a linguagem jurídica e as repetições internas de Levítico, enquanto a nota garante compreensão moderna.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construções naturais também para leitores brasileiros. Emprega “dela” para evitar ambiguidades pronominais, conserva o idioma jurídico central de Levítico e esclarece em notas os hebraísmos e as alternativas lexicais.
