  source_fidelity: 'A tradução acompanha com precisão a estrutura e o sentido do hebraico: conserva o idiomático jurídico “descobrir a nudez”, distingue filha, neta por meio do filho e neta por meio da filha, mantém a amplitude de תִקַּח em “tome” e preserva a referência singular da segunda ocorrência de “nudez” à mulher inicialmente mencionada. “Parentes de sangue” comunica adequadamente שַׁאֲרָה הֵנָּה neste contexto.'
