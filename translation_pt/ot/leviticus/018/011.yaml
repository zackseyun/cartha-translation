  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: pt
  text: Não descubra a nudez da filha da mulher de seu pai, que seu pai gerou; ela é sua irmã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela é sua meia-irmã”. O hebraico diz literalmente “ela é sua irmã”; a descrição anterior especifica o parentesco.'
    reason: Alternativa lexical e esclarecimento de parentesco.
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: a nudez de... / a sua nudez
  rationale: Em Levítico 18, עֶרְוָה integra a fórmula jurídica e sexual “descobrir a nudez”. A tradução preserva o idioma recorrente e evita substituir a expressão por uma paráfrase mais interpretativa.
- source_word: בַּת אֵשֶׁת אָבִיךָ
  choice: a filha da mulher de seu pai
  rationale: Mantém as relações familiares expressas no hebraico. “Filha de sua madrasta” seria mais conciso, mas pressuporia que a mulher não fosse a mãe do destinatário e estreitaria desnecessariamente a formulação.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: gerada por seu pai
  rationale: Expressa a descendência biológica paterna indicada pelo hebraico. “Nascida de seu pai” seria menos natural em português, enquanto “gerada por seu pai” é clara e concisa.
- source_word: אֲחוֹתְךָ הִוא
  choice: ela é sua irmã
  rationale: Reproduz diretamente a conclusão hebraica sem acrescentar “meia-”, deixando que a descrição anterior especifique o parentesco.
- source_word: לֹא תְגַלֶּה
  choice: Não descubra
  rationale: Preserva a fórmula proibitiva do capítulo em português claro e mantém a ligação idiomática com “nudez”.
theological_decisions:
- issue: Se o texto principal deve especificar “meia-irmã”
  choice: Manter “ela é sua irmã” no texto principal.
  alternative: “ela é sua meia-irmã”
  rationale: O hebraico diz literalmente “ela é sua irmã”; a descrição anterior já delimita a relação pelo lado paterno. Acrescentar “meia-” esclareceria a inferência, mas resolveria no texto principal algo que a fonte deixa na descrição genealógica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção preserva o registro jurídico e a fórmula sexual recorrente de Levítico 18 sem recorrer a eufemismo explicativo.
