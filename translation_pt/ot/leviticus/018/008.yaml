  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: pt
  text: Não descubra a nudez da esposa de seu pai[a]; é a nudez de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: «Não tenha relações sexuais com a esposa de seu pai». O hebraico diz literalmente: «descobrir a nudez de».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: a nudez de
  rationale: Em Levítico 18, o substantivo integra a fórmula jurídica recorrente «descobrir a nudez», eufemismo para relações sexuais ilícitas. A tradução preserva a metáfora e a repetição do original.
- source_word: אֵשֶׁת
  choice: mulher
  rationale: No construto «mulher de seu pai», אִשָּׁה designa a mulher ligada ao pai por casamento. Em português, «mulher de seu pai» é natural e mantém a formulação relacional, embora «esposa de seu pai» também seja possível.
- source_word: לֹא תְגַלֵּה
  choice: não descubra
  rationale: A forma verbal negada expressa uma proibição jurídica. O imperativo negativo é corrente e claro em português, e «descobrir» conserva o eufemismo hebraico.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Tradução direta do substantivo com sufixo possessivo, mantida nas duas ocorrências.
- source_word: הִוא
  choice: é
  rationale: O pronome feminino retoma עֶרְוָה, «nudez». Em português, a cópula basta para a formulação natural «é a nudez de seu pai».
theological_decisions:
- issue: Se o eufemismo jurídico deve ser explicitado como proibição de relações sexuais
  choice: Manter no texto principal a expressão «descobrir a nudez»
  alternative: «Não tenha relações sexuais com a mulher de seu pai»
  rationale: O hebraico emprega uma fórmula eufemística repetida ao longo do capítulo. Preservá-la mantém a coesão lexical e o registro jurídico do texto, enquanto a nota esclarece seu sentido contextual sem eliminar a forma original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A proibição usa «não descubra» em vez do mais solene «não descobrirás». O eufemismo hebraico é preservado no texto e explicado em nota.
