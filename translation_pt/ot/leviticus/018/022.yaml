source:
  edition: WLC
  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: pt
  text: Não se deite com alguém do sexo masculino como se deita com uma mulher[a]; isso é uma abominação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “os leitos de uma mulher”, expressão idiomática que se refere a relações sexuais com uma mulher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: alguém do sexo masculino
  rationale: O substantivo hebraico designa um ser humano do sexo masculino sem especificar idade. Esta formulação preserva essa abrangência melhor que “homem” e evita o tom desumanizador que “macho” pode ter no português atual.
- source_word: תִשְׁכַּב
  choice: se deite
  rationale: O verbo שׁכב significa literalmente deitar-se, mas aqui funciona como eufemismo sexual. “Se deite” conserva a figura hebraica, cuja referência sexual fica clara pela expressão seguinte.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: como se deita com uma mulher
  rationale: A construção plural hebraica, literalmente “os leitos de uma mulher”, é idiomática e se refere a relações sexuais com uma mulher. A tradução comunica o sentido e mantém a forma comparativa do original.
- source_word: תּוֹעֵבָה
  choice: abominação
  rationale: O termo expressa forte repulsa e caracteriza algo detestável no contexto do código de santidade. “Abominação” preserva o peso da expressão e sua formulação substantiva.
- source_word: הִוא
  choice: isso é
  rationale: O pronome feminino retoma o ato proibido e concorda, no hebraico, com תּוֹעֵבָה. Em português, “isso é” retoma naturalmente toda a ação precedente.
theological_decisions:
- issue: Natureza da proibição no contexto do código de santidade
  choice: Traduzir como proibição direta de relação sexual entre uma pessoa do sexo masculino e outra do sexo masculino, sem acrescentar qualificações ausentes do hebraico.
  alternative: Restringir interpretativamente a proibição a práticas cúlticas, exploratórias ou a outra categoria específica.
  rationale: O texto proíbe diretamente deitar-se com alguém do sexo masculino “como se deita com uma mulher” e chama o ato de תּוֹעֵבָה. A tradução não deve inserir limitações nem ampliar a formulação além do que o versículo declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o eufemismo corporal do hebraico, enquanto a nota esclarece seu sentido sexual. “Alguém do sexo masculino” foi preferido a “macho” e “homem” para preservar a abrangência lexical de זָכָר sem produzir tom clínico ou pejorativo.
