base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: pt
  text: Não tome uma mulher juntamente com a irmã dela como esposa rival, para descobrir a nudez dela enquanto a irmã dela ainda estiver viva.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não tome uma mulher juntamente com a irmã dela, para torná-la rival da irmã”. O hebraico é compacto; o sentido é não tomar a irmã de uma mulher como esposa adicional enquanto a primeira irmã ainda vive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה
  choice: uma mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”. Neste contexto legal, “tomar uma mulher” comunica a relação matrimonial sem transformar prematuramente o substantivo em “esposa”.
- source_word: אֶל אֲחֹתָהּ
  choice: juntamente com a irmã dela
  rationale: A construção compacta indica que a segunda mulher é tomada além da irmã, isto é, em relação matrimonial simultânea com ela. A formulação preserva essa relação sem atribuir ao sintagma preposicional, por si só, a ideia de rivalidade.
- source_word: לֹא תִקָּח
  choice: não tome
  rationale: O imperfeito com לֹא expressa proibição legal. O imperativo negativo é natural em português atual e mantém o tom normativo.
- source_word: לִצְרֹר
  choice: fazendo dela uma rival
  rationale: O infinitivo de צרר aponta para a criação de rivalidade ou hostilidade. A forma resultativa explicita em português o efeito da união sem restringir indevidamente o sentido a uma denominação técnica de esposa.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: para descobrir a sua nudez
  rationale: Mantém o eufemismo levítico para relações sexuais e a transparência em relação ao hebraico, em vez de substituí-lo por uma paráfrase interpretativa.
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: enquanto a irmã ainda estiver viva
  rationale: No contexto, o conjunto estabelece que a segunda união não deve ocorrer durante a vida da primeira irmã. A explicitação de “a irmã” evita ambiguidade pronominal excessiva em português.
theological_decisions:
- issue: Alcance da proibição quanto ao casamento com duas irmãs
  choice: A proibição diz respeito a tomar a irmã de uma mulher como esposa adicional enquanto a primeira irmã ainda vive.
  alternative: Entender o versículo como proibição absoluta de casar com duas irmãs, mesmo depois da morte da primeira, ou como proibição genérica de qualquer união que produza rivalidade.
  rationale: לִצְרֹר e בְּחַיֶּיהָ vinculam a rivalidade à simultaneidade durante a vida da primeira irmã. A tradução não estende a norma além do que o versículo declara, mas preserva a tensão entre a formulação literal e seu sentido matrimonial contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não tome” conserva o caráter legal sem o arcaísmo de “não tomarás”. O eufemismo “descobrir a nudez” foi mantido por coerência com a linguagem de Levítico.
