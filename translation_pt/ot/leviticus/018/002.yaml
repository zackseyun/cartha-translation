  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a] e diga-lhes: “Eu sou Yahweh[b], o Deus de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas”. Em hebraico, literalmente, “aos filhos de Israel”, expressão familiar e pactual que designa o povo de Israel.
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo introduz a ordem divina dirigida a Moisés; “Fale” é direto, natural e preserva a sequência do hebraico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a expressão familiar e pactual literalmente masculina do hebraico, que aqui designa coletivamente o povo de Israel.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Reproduz a continuação coordenada da ordem e a introdução direta das palavras divinas.
- source_word: אֲנִי
  choice: Eu sou
  rationale: A cópula exigida em português expressa naturalmente a fórmula hebraica de autoidentificação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo pelo título tradicional “SENHOR”.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: O substantivo refere-se no singular ao Deus de Israel; o sufixo masculino plural é expresso de modo claro e amplamente compreensível por “de vocês”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo silenciosamente por um título.
- issue: Representação de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha conserva a metáfora familiar e pactual do hebraico, embora a expressão se refira coletivamente ao povo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Diga-lhes” mantém uma cadência bíblica natural sem ser arcaico; “o Deus de vocês” comunica com clareza o sufixo plural e evita a ambiguidade regional de “vosso”.
