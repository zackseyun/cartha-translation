  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: pt
  text: Não descubra a nudez da irmã de sua mãe[a], pois ela é parente próxima de sua mãe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Não tenha relações sexuais com a irmã de sua mãe”. O hebraico diz literalmente: “Não descubra a nudez da irmã de sua mãe”.'
    reason: lexical_alternative
  - marker: b
    text: “Parente próxima” traduz o hebraico שְׁאֵר (she’er), termo de parentesco que indica alguém da mesma carne, isto é, uma parenta consanguínea próxima.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: Não descubra a nudez de
  rationale: Preserva o eufemismo jurídico hebraico recorrente em Levítico 18, em vez de explicitar no texto principal seu sentido sexual.
- source_word: אֲחוֹת אִמְּךָ
  choice: a irmã de sua mãe
  rationale: Reproduz diretamente a relação de parentesco e é clara em português; evita substituir a formulação hebraica pelo termo mais interpretativo “tia materna”.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a justificativa da proibição, mantendo o tom legal.
- source_word: שְׁאֵר אִמְּךָ
  choice: parente próxima de sua mãe
  rationale: שְׁאֵר é um termo de parentesco ligado à ideia de carne e designa aqui uma parenta consanguínea próxima; a formulação comunica o sentido sem o literalismo obscuro “carne de sua mãe”.
theological_decisions:
- issue: Tradução do eufemismo jurídico para relações sexuais proibidas
  choice: Manter “descobrir a nudez” no texto principal
  alternative: Traduzir dinamicamente como “ter relações sexuais”
  rationale: A expressão hebraica é repetida ao longo de Levítico 18. Mantê-la preserva a unidade literária, o registro jurídico e o caráter eufemístico, enquanto a nota esclarece seu sentido contextual.
translation_notes:
  register: Português moderno, claro e digno, com forma proibitiva natural. Conserva-se no texto principal o eufemismo jurídico do hebraico e esclarece-se seu sentido em nota.
