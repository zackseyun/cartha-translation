language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/כָל בְּהֵמָ֛ה לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/טָמְאָה בָ֑/הּ וְ/אִשָּׁ֗ה לֹֽא תַעֲמֹ֞ד לִ/פְנֵ֧י בְהֵמָ֛ה לְ/רִבְעָ֖/הּ תֶּ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: pt
  text: Não terás relações sexuais com animal algum, tornando-te impuro com ele[a]. A mulher não se colocará diante de um animal para que ele a cubra[b]. Isso é uma perversão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não darás o teu deitar para te tornares impuro com ele”; a expressão se refere a relações sexuais com um animal.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que ele a monte”; o verbo hebraico se refere à monta ou à cópula.
    reason: lexical_alternative
  - marker: c
    text: Ou “uma violação da ordem”, “um ultraje”; o termo hebraico descreve uma grave desordem, especialmente no âmbito sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: com animal algum
  rationale: בְּהֵמָה designa amplamente um animal, embora muitas vezes doméstico; na construção negativa, “animal algum” expressa com naturalidade a abrangência de כָּל.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: não terás relações sexuais
  rationale: A expressão hebraica é literalmente próxima de “não darás teu deitar”, um idiomatismo sexual que seria opaco e pouco natural em português. A tradução explicita o sentido contextual sem especificar detalhes fisiológicos incertos.
- source_word: לְטָמְאָה בָהּ
  choice: tornando-te impuro com ele
  rationale: Conserva a categoria bíblica de impureza e entende o infinitivo como resultado ou propósito associado ao ato, sem limitá-lo à impureza meramente ritual.
- source_word: וְאִשָּׁה
  choice: A mulher
  rationale: אִשָּׁה é genérico neste contexto e significa “mulher”, não especificamente “esposa”.
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: não se colocará diante de um animal
  rationale: “Colocar-se diante” comunica de modo natural a ação deliberada indicada pelo hebraico, mantendo a imagem espacial da expressão.
- source_word: לְרִבְעָהּ
  choice: para que ele a cubra
  rationale: O verbo רבע refere-se à monta ou cópula animal, e o sufixo feminino apresenta a mulher como objeto da ação. “Cobrir” preserva essa direção e é um termo português tradicional para a monta de animais.
- source_word: תֶּבֶל הוּא
  choice: Isso é uma perversão
  rationale: תֶּבֶל caracteriza o ato como violação grave da ordem apropriada, especialmente no âmbito sexual. “Perversão” transmite melhor essa avaliação do que o hoje ambíguo “confusão”.
theological_decisions:
- issue: Linguagem de impureza sexual
  choice: tornando-te impuro com ele
  alternative: para te contaminares com ele
  rationale: “Impuro” preserva a categoria lexical e teológica do texto, sem reduzi-la ao cerimonial nem substituí-la por uma categoria doutrinária posterior.
- issue: Sentido de תֶּבֶל
  choice: perversão
  alternative: confusão; ultraje; violação da ordem
  rationale: O termo avalia a união proibida como grave desordem. “Perversão” mantém essa força moral, enquanto as alternativas ou enfraquecem o sentido ou exigem maior paráfrase.
- issue: Direção da ação em לְרִבְעָהּ
  choice: para que ele a cubra
  alternative: para acasalar com ele
  rationale: O sufixo feminino no hebraico indica a mulher como objeto da monta. A formulação escolhida conserva essa distinção sem linguagem gráfica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento na segunda pessoa singular preserva a forma da legislação hebraica. O idiomatismo sexual masculino foi tornado explícito no texto, enquanto a nota registra sua forma literal; na cláusula sobre a mulher, manteve-se a direção gramatical da ação por meio de “para que ele a cubra”.
