  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: pt
  text: Não descubra a nudez de sua nora[a]. Ela é a mulher de seu filho; não descubra a nudez dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “descobrir a nudez”, eufemismo jurídico recorrente em Levítico para relações sexuais proibidas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: a nudez de
  rationale: No idioma jurídico recorrente de Levítico 18, עֶרְוָה com גלה funciona como eufemismo para relações sexuais proibidas. “Nudez” preserva a imagem e a coerência interna do capítulo.
- source_word: כַּלָּתְךָ
  choice: sua nora
  rationale: O substantivo com sufixo de segunda pessoa masculina singular designa diretamente a nora do destinatário.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: não descubra
  rationale: O Piel de גלה com עֶרְוָה compõe a fórmula proibitiva repetida no capítulo. O imperativo negativo em português comunica naturalmente a força normativa do hebraico.
- source_word: אֵשֶׁת בִּנְךָ
  choice: a mulher de seu filho
  rationale: A oração explica a relação familiar que fundamenta a proibição. “Mulher” conserva o sentido de esposa no contexto e soa natural em português amplo.
- source_word: הִוא
  choice: ela é
  rationale: O pronome retoma enfaticamente a mulher mencionada e introduz a explicação de sua identidade familiar.
- source_word: עֶרְוָתָהּ
  choice: a nudez dela
  rationale: A repetição conserva o estilo jurídico enfático do hebraico e a correspondência com a primeira oração.
theological_decisions:
- issue: Tradução do idioma “descobrir a nudez” no contexto de proibições sexuais
  choice: Manter “descobrir a nudez”
  alternative: ter relações sexuais com
  rationale: O hebraico emprega em todo o capítulo um eufemismo jurídico estável. Preservá-lo mantém a imagem, a repetição e as conexões textuais, enquanto a nota esclarece sua função sem transformar a explicação em tradução.
translation_notes:
  register: Português moderno, digno e acessível, com construção normativa natural. Emprega “sua” de modo amplamente compreensível no português internacional e brasileiro; a repetição deliberada acompanha o estilo legal do original.
