  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: pt
  text: Mas vocês mesmos guardarão os meus estatutos e as minhas normas e não praticarão nenhuma destas abominações. Nem o nascido na terra nem o estrangeiro residente que vive entre vocês as praticarão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: vocês mesmos guardarão
  rationale: O verbo שׁמר, no contexto legal da aliança, significa guardar ou observar. O pronome independente אַתֶּם acrescenta ênfase, preservada por “vocês mesmos”; o futuro mantém o tom diretivo e solene.
- source_word: חֻקֹּתַי
  choice: os meus estatutos
  rationale: חֻקִּים designa prescrições estabelecidas; “estatutos” conserva o registro jurídico da Torá.
- source_word: מִשְׁפָּטַי
  choice: as minhas normas
  rationale: מִשְׁפָּטִים pode indicar decisões, juízos ou regras legais. “Normas” comunica com naturalidade as determinações jurídicas aqui exigidas, sem confundi-las com atos de julgamento.
- source_word: וְלֹא תַעֲשׂוּ מִכֹּל
  choice: e não farão nenhuma
  rationale: Com a negação, מִן + כֹּל tem sentido abrangente de “nenhuma dentre”; “farão” traduz diretamente עשה sem acrescentar habitualidade.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: destas abominações
  rationale: תּוֹעֵבָה expressa forte repulsa moral ou cultual. “Abominações” mantém a intensidade avaliativa e a referência aos atos anteriormente enumerados.
- source_word: הָאֶזְרָח
  choice: o natural da terra
  rationale: אֶזְרָח é o membro nativo da terra ou comunidade. A expressão evita a possível conotação moderna e estritamente política de “cidadão”.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: o estrangeiro residente que vive entre vocês
  rationale: גֵּר designa um não nativo estabelecido na comunidade, não um visitante passageiro. “Estrangeiro residente” explicita esse estatuto, e “que vive entre vocês” traduz naturalmente o particípio correlato גָּר.
theological_decisions:
- issue: Alcance da proibição para nativos e estrangeiros residentes
  choice: A proibição abrange tanto o natural da terra como o estrangeiro residente que vive no meio da comunidade.
  alternative: Entender a expressão final apenas como uma identificação parentética dos destinatários, sem ressaltar a aplicação comum aos dois grupos.
  rationale: A sintaxe apresenta הָאֶזְרָח e הַגֵּר como os dois grupos aos quais se aplica a proibição, sem estabelecer distinção entre eles quanto a essas práticas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Conserva-se o paralelismo jurídico de “estatutos” e “normas”, a ênfase de אַתֶּם por “vocês mesmos” e a força de “abominações”. “Estrangeiro residente” é preferido a “peregrino” porque comunica com maior precisão o estatuto social de גֵּר ao leitor atual.
