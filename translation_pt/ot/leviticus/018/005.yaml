source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: pt
  text: Portanto, vocês guardarão os meus estatutos e as minhas normas; o homem que os praticar viverá por meio deles[a]. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “viverá neles”. A preposição hebraica pode indicar tanto o meio (“por meio deles”) como a esfera em que se vive (“neles”). “O homem” traduz uma expressão hebraica masculina singular de sentido representativo e pode referir-se a qualquer pessoa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Portanto, vocês guardarão
  rationale: O perfeito com conjunção tem força injuntiva no contexto legal. “Guardarão” conserva a forma solene da instrução, e “portanto” liga o versículo às proibições anteriores.
- source_word: חֻקֹּתַי
  choice: os meus estatutos
  rationale: O termo designa prescrições estabelecidas; “estatutos” preserva seu caráter jurídico e a distinção em relação a מִשְׁפָּטַי.
- source_word: מִשְׁפָּטַי
  choice: as minhas normas
  rationale: Neste contexto, מִשְׁפָּטִים são determinações ou regras jurídicas. “Normas” é claro em português moderno e mantém um termo distinto de “estatutos”.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם
  choice: A pessoa que os praticar
  rationale: הָאָדָם é uma expressão singular representativa, não uma referência exclusiva ao sexo masculino. “A pessoa” comunica naturalmente esse alcance; “praticar” expressa a obediência concreta indicada por עשה.
- source_word: וָחַי
  choice: viverá
  rationale: Tradução direta que não define se a vida prometida é temporal, pactual ou escatológica.
- source_word: בָּהֶם
  choice: por meio deles
  rationale: Explicita a leitura instrumental possível da preposição ב sem atribuir aos estatutos um sentido teológico mais específico; a leitura locativa é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Alcance de “viverá por meio deles”
  choice: Manter a promessa ampla, sem definir a natureza da vida.
  alternative: “viverá neles” ou uma formulação que especifique vida terrena, pactual ou eterna
  rationale: O hebraico não determina explicitamente o alcance da vida mencionada; a tradução preserva essa tensão teológica.
- issue: Sentido de בָּהֶם
  choice: “por meio deles” no texto, com “neles” em nota
  alternative: “neles”
  rationale: A preposição admite valor instrumental ou de esfera. A opção principal é idiomática em português, enquanto a nota preserva a alternativa genuína.
- issue: Valor representativo de הָאָדָם
  choice: “a pessoa”
  alternative: “o homem”
  rationale: No contexto, o singular הָאָדָם tem referência humana genérica. “A pessoa” reproduz o alcance sem sugerir indevidamente exclusividade masculina.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário jurídico acessível. A construção mantém o tom solene da legislação, evita arcaísmos e preserva a ambiguidade da promessa de vida.
