source:
  edition: WLC
  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: pt
  text: Não se tornem impuros por nenhuma dessas práticas[a], pois foi por todas elas que se tornaram impuras as nações que estou expulsando da presença de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não se contaminem com nenhuma dessas coisas [...], pois com todas elas se contaminaram as nações”.'
    reason: Alternativa lexical para טמא e tradução mais concreta de אֵלֶּה como “coisas”.
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: Não se tornem impuros
  rationale: A construção com אַל expressa proibição, e o hitpael de טמא indica envolvimento reflexivo ou entrada em estado de impureza. A formulação preserva o vocabulário levítico de pureza sem recorrer a linguagem excessivamente técnica.
- source_word: בְּכָל אֵלֶּה
  choice: por nenhuma dessas práticas
  rationale: Sob a negação, כָל é naturalmente expresso por “nenhuma”. O demonstrativo retoma os atos proibidos anteriormente; “práticas” explicita esse referente de modo natural, enquanto “por” comunica o valor instrumental de ב.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição e mantém clara a relação explicativa entre as duas orações.
- source_word: בְכָל אֵלֶּה נִטְמְאוּ
  choice: foi por todas elas que se tornaram impuras
  rationale: O nifal de טמא descreve a entrada em um estado de impureza. A construção enfática preserva o contraste hebraico entre “nenhuma dessas” na proibição e “todas elas” na explicação.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: No contexto, refere-se aos povos não israelitas que habitavam a terra. “Nações” é a correspondência ampla e evita o possível anacronismo de “gentios”.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: que estou expulsando
  rationale: Embora שׁלח tenha como sentido básico “enviar”, neste contexto de retirada da terra significa fazer sair ou expulsar.
- source_word: מִפְּנֵיכֶם
  choice: da presença de vocês
  rationale: Representa mais diretamente o elemento מִן, “de”, e a expressão espacial פְּנֵי, comunicando que as nações são removidas de diante de Israel.
theological_decisions:
- issue: Terminologia de impureza ritual e moral em Levítico 18
  choice: tornar-se impuro
  alternative: contaminar-se / ser contaminado
  rationale: “Impuro” conserva a categoria levítica de טמא e permite que o contexto reúna suas dimensões ritual e moral sem reduzi-la a uma delas. “Contaminar” é uma alternativa legítima, registrada em nota, mas tem carga retórica um pouco diferente em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Vocês” evita uma forma regionalmente marcada; “práticas” torna explícito o referente contextual sem acrescentar uma categoria estranha ao capítulo.
