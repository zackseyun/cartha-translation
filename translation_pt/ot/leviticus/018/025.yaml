source:
  edition: WLC
  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: pt
  text: Assim, a terra tornou-se impura[a]; eu a castiguei por sua iniquidade[b], e a terra vomitou os seus habitantes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi contaminada”. O verbo hebraico pode descrever tanto o fato de a terra ter-se tornado impura quanto o de ter sido contaminada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “visitei sobre ela a sua iniquidade”, expressão hebraica que significa pedir contas da culpa e aplicar juízo.
    reason: lexical_alternative
  - marker: c
    text: Ou, de modo menos figurado, “expulsou”. O hebraico usa a imagem forte de vomitar para retratar a terra livrando-se de seus habitantes por causa da impureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: tornou-se impura
  rationale: O verbo טמא descreve aqui a terra entrando num estado de impureza em razão das práticas abomináveis mencionadas no contexto. “Tornou-se impura” preserva o sentido resultativo e a linguagem de pureza sem especificar além do hebraico se a impureza é ritual, moral ou ambas.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Embora אֶרֶץ também possa significar “mundo” ou “solo”, o contexto trata da terra de Canaã. “A terra” é a forma natural e contextualmente precisa.
- source_word: וָאֶפְקֹד
  choice: eu a castiguei
  rationale: Com עָוֹן, o verbo פקד expressa a ação de pedir contas e aplicar juízo. “Eu a castiguei” comunica claramente a força idiomática e mantém Deus como agente direto do julgamento.
- source_word: עֲוֺנָהּ
  choice: por sua iniquidade
  rationale: עָוֹן pode indicar iniquidade, culpa ou a consequência da culpa. “Iniquidade” conserva o peso moral do termo e deixa a nota registrar a construção hebraica mais literal.
- source_word: וַתָּקִא
  choice: vomitou
  rationale: קיא significa literalmente “vomitar”. A escolha mantém a personificação forte e deliberadamente gráfica da terra, sem suavizá-la para “expulsou”.
- source_word: יֹשְׁבֶיהָ
  choice: os seus habitantes
  rationale: O particípio de ישב designa coletivamente os que moram na terra. “Os seus habitantes” é conciso, claro e fiel.
theological_decisions:
- issue: Personificação da terra diante da impureza
  choice: Manter a imagem concreta de a terra “vomitar” os seus habitantes.
  alternative: Traduzir de forma atenuada como “expulsar” os seus habitantes.
  rationale: O hebraico apresenta a terra como reagindo à contaminação. Preservar a metáfora mantém a ligação textual entre pecado, impureza, juízo divino e expulsão, sem reduzi-la a uma simples mudança política.
- issue: Natureza do juízo em וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  choice: 'Expressar o sentido idiomático como castigo direto de Deus: “eu a castiguei por sua iniquidade”.'
  alternative: 'Reproduzir mais literalmente: “visitei sobre ela a sua iniquidade” ou “pedi contas de sua iniquidade contra ela”.'
  rationale: A formulação escolhida torna inteligível em português o valor judicial de פקד com עָוֹן, preservando a agência divina e a gravidade moral. A nota conserva a forma e a amplitude da expressão hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe é natural, enquanto “iniquidade” mantém o registro moral e bíblico do original. A metáfora gráfica de “vomitou” foi preservada intencionalmente.
