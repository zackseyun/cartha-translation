  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: pt
  text: Não descubra a nudez da esposa do seu irmão[a]; é a nudez do seu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Não tenha relações sexuais com a esposa do seu irmão”. O hebraico usa a expressão “descobrir a nudez”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: a nudez de
  rationale: Em Levítico 18, עֶרְוָה na expressão גלה ערוה é um eufemismo jurídico estabelecido para exposição ou relações sexuais proibidas. “Descobrir a nudez” preserva a imagem, a repetição lexical e o teor legal do hebraico.
- source_word: אֵשֶׁת אָחִיךָ
  choice: a mulher do seu irmão
  rationale: אֵשֶׁת, em construção com “seu irmão”, designa a esposa dele. “Mulher do seu irmão” é uma expressão natural e amplamente compreensível em português para essa relação conjugal.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Tradução direta do termo de parentesco masculino singular, preservando o destinatário masculino da formulação legal.
- source_word: לֹא תְגַלֶּה
  choice: não descubra
  rationale: O imperfeito precedido de לֹא formula uma proibição. O imperativo negativo é natural no português moderno e conserva a força normativa do texto.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: é a nudez do seu irmão
  rationale: A tradução mantém a repetição deliberada de עֶרְוָה e a lógica jurídica da cláusula, sem explicar além do que o hebraico afirma.
theological_decisions:
- issue: Se o eufemismo jurídico deve ser explicitado como proibição direta de relações sexuais
  choice: Manter no texto principal a expressão hebraica “descobrir a nudez”
  alternative: “Não tenha relações sexuais com a mulher do seu irmão”
  rationale: O hebraico emprega um eufemismo jurídico convencional. Preservá-lo mantém a proximidade com a fonte, a dignidade do registro e a coerência terminológica ao longo de Levítico 18; a nota esclarece seu sentido.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação preserva o eufemismo legal e a repetição do original, enquanto a nota oferece a equivalência explícita.
