id: LEV.18.7
reference: Leviticus 18:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: pt
  text: Não descubra a nudez de seu pai[a], isto é, a nudez de sua mãe. Ela é sua mãe; não descubra a nudez dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Não descubra a nudez de seu pai e a nudez de sua mãe”. O versículo explica a referência à mãe com as palavras: “Ela é sua mãe”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: a nudez de
  rationale: Preserva a expressão jurídica eufemística recorrente גלה ערוה em Levítico 18, sem explicitar além do hebraico sua referência a relações sexuais proibidas.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: não descubra
  rationale: Reproduz de modo natural em português a fórmula proibitiva com o verbo 'descobrir', mantendo a repetição e a imagem jurídica do original.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Tradução direta do termo de parentesco com sufixo de segunda pessoa masculina singular.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: isto é, a nudez de sua mãe
  rationale: Entende a coordenação como explicativa à luz da frase seguinte, mas registra em nota a tradução formal com 'e', preservando a ambiguidade sintática genuína.
- source_word: הִוא
  choice: Ela é
  rationale: O pronome feminino singular retoma enfaticamente a mãe.
- source_word: אִמְּךָ
  choice: sua mãe
  rationale: Mantém o termo de parentesco e sua repetição enfática para clareza jurídica.
theological_decisions:
- issue: Sentido de “a nudez de seu pai” em relação à mãe
  choice: Tratar “a nudez de sua mãe” como explicação de “a nudez de seu pai”.
  alternative: 'Traduzir formalmente: “a nudez de seu pai e a nudez de sua mãe”.'
  rationale: A continuação “Ela é sua mãe” favorece a leitura segundo a qual a referência imediata é à mãe e a violação dela também atinge a honra ou os direitos conjugais do pai. Como a conjunção hebraica pode ser vertida literalmente por “e”, a alternativa é mantida em nota em vez de ser apagada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo negativo “não descubra” expressa naturalmente a proibição hebraica e conserva o eufemismo legal do capítulo.
