base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, com a forma narrativa prefixada por waw, faz a narrativa avançar e introduz a fala divina; «falou» é a correspondência natural e precisa em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição assinala o destinatário da fala; «a» é natural na construção «falou a Moisés».
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo da fala; «dizendo» preserva de modo claro a fórmula narrativa hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. «Yahweh» preserva o nome pessoal em transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional «Jeová».
translation_notes:
  register: Português moderno, claro e digno, com a fórmula narrativa hebraica preservada. Não se acrescentou nota, pois o texto hebraico não apresenta aqui uma variante que altere o sentido; a pontuação com dois-pontos prepara naturalmente a fala que segue.
