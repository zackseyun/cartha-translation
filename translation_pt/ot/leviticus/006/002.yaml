  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: pt
  text: 'Ordene a Arão e a seus filhos: “Esta é a lei[a] do holocausto: o próprio holocausto ficará no lugar de queima[b], sobre o altar, durante toda a noite, até de manhã, e o fogo do altar será mantido aceso nele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “instrução”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a área de combustão ou lareira do altar.
    reason: lexical_clarification
lexical_decisions:
- source_word: צַו
  choice: Ordene
  rationale: O imperativo de צוה expressa uma ordem direta; “ordene” preserva essa força.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: Arão e a seus filhos
  rationale: Tradução direta do nome próprio e de בנים; no contexto, refere-se aos filhos homens que serviam como sacerdotes.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português atual, os dois-pontos introduzem a fala ordenada com mais naturalidade do que o decalque “dizendo”.
- source_word: זֹאת תּוֹרַת
  choice: Esta é a lei de
  rationale: תּוֹרָה introduz aqui a norma que rege o sacrifício. “Lei” mantém o tom jurídico e formular, enquanto a nota registra “instrução” como alternativa legítima.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo sacrificial consagrado em português para עֹלָה, uma oferta inteiramente queimada.
- source_word: הִוא הָעֹלָה
  choice: o próprio holocausto
  rationale: A expressão retoma o substantivo com pronome enfático; “o próprio holocausto” comunica essa ênfase sem literalismo desajeitado.
- source_word: עַל מוֹקְדָה
  choice: ficará no lugar de queima
  rationale: מוֹקְדָה designa o local onde o sacrifício arde, isto é, a área de combustão ou lareira do altar. “Lugar de queima” é concreto e amplamente compreensível.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: Tradução direta da localização do sacrifício.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: durante toda a noite, até de manhã
  rationale: Reproduz com naturalidade a duração contínua indicada pelo hebraico.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: e o fogo do altar será mantido aceso nele
  rationale: A forma verbal passiva indica que o fogo deve ser mantido ardendo. O pronome masculino “nele” retoma naturalmente “altar”, também masculino no hebraico e em português.
theological_decisions:
- issue: Sentido de תּוֹרָה na legislação sacrificial
  choice: lei
  alternative: instrução; regulamento
  rationale: “Lei” conserva o registro jurídico da fórmula sem fazer do termo, neste ponto, um título para todo o cânon mosaico. A alternativa “instrução” permanece lexicalmente possível e é registrada em nota.
- issue: Caráter da ordem acerca do fogo do altar
  choice: será mantido aceso
  alternative: arderá
  rationale: A forma hebraica apresenta a manutenção do fogo como exigência prescrita, não apenas como descrição de um fogo que arde.
- issue: Referente do sufixo em בּוֹ
  choice: o altar (“nele”)
  alternative: o holocausto ou o lugar de queima
  rationale: O gênero masculino do sufixo favorece מִזְבֵּחַ, “altar”, enquanto עֹלָה e מוֹקְדָה são femininos. A tradução torna essa ligação gramaticalmente natural sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário sacrificial tradicional. A fala direta é introduzida por dois-pontos para evitar o pouco natural “dizendo”. Todos os marcadores de nota aparecem no texto.
