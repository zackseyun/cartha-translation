source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: pt
  text: E tirará dela um punhado da farinha fina da oferta de cereal e do azeite dela,[a] juntamente com todo o olíbano que estiver sobre a oferta de cereal; e queimará no altar a sua porção memorial,[b] como aroma agradável a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levantará dela, com o seu punhado”. O verbo e o substantivo hebraicos juntos destacam a retirada da porção designada com a mão.'
    reason: lexical_alternative
  - marker: b
    text: “Porção memorial” traduz um termo sacrificial técnico para a parte representativa da oferta de cereal que era queimada no altar.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: tirará dela, com a mão em concha, uma porção
  rationale: O hifil de רום indica retirar ou erguer a porção designada, enquanto בְּקֻמְצוֹ descreve o gesto ou a quantidade recolhida com a mão. A formulação preserva ambos os elementos sem sugerir apenas um punhado impreciso.
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: da farinha fina da oferta de cereal
  rationale: סֹלֶת designa farinha fina, e מִנְחָה, neste contexto levítico, é a oferta feita de cereal.
- source_word: וּמִשַּׁמְנָהּ
  choice: e do seu azeite
  rationale: 'A preposição מִן mantém o sentido partitivo: retira-se uma porção também do azeite da oferta. ''Azeite'' é natural em português no contexto alimentar e sacrificial antigo.'
- source_word: וְאֵת כָּל הַלְּבֹנָה
  choice: junto com todo o incenso
  rationale: לְבֹנָה é olíbano, isto é, incenso aromático. 'Incenso' oferece clareza ampla; a nota registra a identificação mais específica.
- source_word: וְהִקְטִיר הַמִּזְבֵּחַ
  choice: e queimará no altar
  rationale: No contexto sacrificial, קטר indica queimar a oferta no altar, fazendo-a subir em fumaça.
- source_word: אַזְכָּרָתָהּ
  choice: a porção memorial dela
  rationale: Trata-se de um termo sacrificial técnico para a parte representativa da oferta que era queimada no altar.
- source_word: רֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: A expressão cultual fixa comunica que a oferta é recebida favoravelmente, sem tornar explícita uma explicação teológica que o hebraico deixa implícita.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino pessoal expresso pelo Tetragrama e a direção da oferta indicada pela preposição לְ.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o caráter de nome próprio em vez de substituí-lo por um título.
- issue: Sentido cultual de רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador
  rationale: A opção preserva a linguagem antropomórfica e a ideia de aceitação divina sem impor a noção específica de que o sacrifício apazigua a ira.
- issue: Função de אַזְכָּרָתָהּ
  choice: porção memorial
  alternative: oferta memorial
  rationale: A expressão se refere à porção representativa que é queimada, não necessariamente a uma oferta distinta; a tradução mantém essa precisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o caráter instrutivo do texto legal, e os termos cultuais são mantidos com notas breves onde necessário.
