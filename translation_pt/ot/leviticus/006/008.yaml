  naturalness: A redação é compreensível, mas “com a mão em concha, uma porção” soa pouco idiomática e excessivamente explicativa. “Um punhado” é natural, claro e conserva o caráter técnico da ação ritual.
  terminology: “Oferta de cereal”, “farinha fina”, “azeite”, “altar”, “porção memorial” e “Yahweh” são adequados. “Olíbano” deve substituir “incenso”, pois é o referente lexical específico; assim, a explicação suplementar da nota b deixa de ser necessária.
