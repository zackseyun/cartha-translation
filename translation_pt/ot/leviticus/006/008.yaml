  to: E tirará dela um punhado da farinha fina da oferta de cereal e do azeite dela,[a] juntamente com todo o olíbano que estiver sobre a oferta de cereal; e queimará no altar a sua porção memorial,[b] como aroma agradável a Yahweh.
