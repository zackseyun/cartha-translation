  text: אֵ֗שׁ תָּמִ֛יד תּוּקַ֥ד עַל הַ/מִּזְבֵּ֖חַ לֹ֥א תִכְבֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/006.yaml
  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
translation:
  language: pt
  text: O fogo deverá ser mantido aceso continuamente sobre o altar[a]; não se apagará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um fogo contínuo arderá sobre o altar; não se apagará.”'
    reason: 'Alternativa lexical e sintática: «contínuo» pode traduzir תָּמִיד como adjetivo, e «arderá» expressa de modo mais conciso o efeito prescrito por תּוּקַד.'
lexical_decisions:
- source_word: אֵשׁ
  choice: fogo
  rationale: É o equivalente literal e usual no contexto do altar e dos sacrifícios.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Expressa a continuidade exigida para o fogo; em português, o advérbio ligado a «mantenha-se aceso» soa mais natural que «fogo contínuo».
- source_word: תּוּקַד
  choice: mantenha-se aceso
  rationale: O hofal de יקד tem valor passivo/causativo e, no contexto, indica que o fogo deve ser mantido queimando, não apenas que deve arder espontaneamente.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: Preserva a relação espacial e o artigo definido; «sobre» é natural e digno neste contexto cultual.
- source_word: לֹא תִכְבֶּה
  choice: não se apagará
  rationale: Reproduz de modo direto o sentido de o fogo não deixar de arder, sem acrescentar um agente responsável por extingui-lo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com construção imperativa impessoal adequada ao contexto legal. A repetição «fogo... ele» mantém explícito o referente da segunda oração.
