  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: pt
  text: Todo homem entre os filhos de Arão poderá comer dela. Esta é uma norma permanente para todas as suas gerações, referente às ofertas feitas no fogo para Yahweh. Tudo o que tocar nelas se tornará santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será consagrado”. O hebraico pode indicar que algo se torna santo pelo contato; alguns entendem a frase de modo mais restritivo, como se somente aquilo que é santo pudesse tocar nessas ofertas.'
    reason: Registra a alternativa lexical e a leitura restritiva da transferência de santidade sem substituir o sentido mais direto no texto principal.
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Todo homem
  rationale: No contexto sacerdotal, designa distributivamente cada pessoa do sexo masculino. “Todo homem” é natural em português e mantém a restrição de gênero expressa pelo hebraico.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: entre os filhos de Arão
  rationale: Preserva a designação familiar e sacerdotal do texto, sem ampliá-la explicitamente para todos os descendentes.
- source_word: יֹאכֲלֶנָּה
  choice: poderá comer dela
  rationale: O imperfeito, em contexto legal, comunica a autorização concedida aos sacerdotes; o pronome feminino retoma a oferta mencionada no contexto anterior.
- source_word: חָק עוֹלָם
  choice: uma norma permanente
  rationale: Expressa a força legal e duradoura da fórmula em linguagem portuguesa atual, sem sugerir necessariamente infinitude metafísica.
- source_word: לְדֹרֹתֵיכֶם
  choice: para todas as suas gerações
  rationale: Mantém a fórmula que indica vigência continuada ao longo das gerações sucessivas.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: referente às ofertas feitas no fogo para Yahweh
  rationale: אִשֶּׁה designa ofertas sacrificiais apresentadas no fogo. A formulação evita tratar o termo simplesmente como comida e comunica o modo sacrificial de apresentação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: Tudo o que tocar nelas
  rationale: A construção hebraica não restringe o referente a pessoas nem a objetos; “tudo o que” preserva essa abrangência.
- source_word: יִקְדָּשׁ
  choice: se tornará santo
  rationale: O verbo pode indicar aquisição de santidade como resultado do contato. A tradução explicita a mudança de estado sem definir todas as suas consequências rituais.
theological_decisions:
- issue: Sentido da transmissão de santidade na oração final
  choice: O contato com as ofertas santas faz com que aquilo que as toca se torne santo.
  alternative: 'A oração pode ser entendida de modo restritivo: somente aquilo que já é santo pode tocá-las; também pode indicar que o contato põe a pessoa ou o objeto sob obrigações de consagração.'
  rationale: A sequência verbal hebraica favorece naturalmente um resultado decorrente do contato, mas a nota preserva a tensão interpretativa e não determina quais consequências rituais esse estado acarreta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a linguagem jurídica e ritual do contexto sem arcaísmos desnecessários. O marcador [a] foi colocado na oração a que a nota efetivamente se refere.
