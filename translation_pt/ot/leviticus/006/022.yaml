  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכַ֣ל אֹתָ֑/הּ קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: pt
  text: Todo homem entre os sacerdotes poderá comê-la; ela é santíssima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “santidade de santidades”, expressão que significa “santíssima”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Todo homem
  rationale: A construção distributiva indica cada indivíduo do sexo masculino. Em português corrente, “todo homem” soa mais natural neste contexto humano e cultual do que “todo macho”, sem alterar o critério expresso pelo hebraico.
- source_word: בַּכֹּהֲנִים
  choice: entre os sacerdotes
  rationale: A preposição marca pertencimento ao grupo sacerdotal; “entre os sacerdotes” preserva esse sentido com naturalidade.
- source_word: יֹאכַל
  choice: poderá comer
  rationale: No contexto jurídico-cultual, o imperfeito expressa ação autorizada ou regulamentada, não necessariamente uma ordem dirigida a cada sacerdote.
- source_word: אֹתָהּ
  choice: comê-la
  rationale: O pronome feminino retoma a oferta mencionada no contexto; o clítico feminino português preserva essa referência sem expansão interpretativa.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssima
  rationale: A expressão literalmente repetitiva funciona como superlativo hebraico e indica o grau máximo de santidade.
- source_word: הִוא
  choice: ela é
  rationale: O pronome feminino concorda com o antecedente implícito, a oferta, e a cópula precisa ser explicitada em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Homem” evita o uso pouco natural de “macho” para uma pessoa, enquanto o contexto deixa claro que a elegibilidade cultual é masculina. O superlativo sintético “santíssima” comunica com concisão o idioma hebraico.
