  text: וְ/הַ/נּוֹתֶ֣רֶת מִמֶּ֔/נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּ/בָנָ֑י/ו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּ/מָק֣וֹם קָדֹ֔שׁ בַּ/חֲצַ֥ר אֹֽהֶל מוֹעֵ֖ד יֹאכְלֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: pt
  text: O que restar dela, Arão e seus filhos comerão[a]. Será comido sem fermento[c], em lugar santo[b]; eles o comerão no pátio da Tenda do Encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a porção restante” ou “o que sobrar”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em lugar santo”, não “no lugar santo”; a oração seguinte especifica esse lugar como o pátio da Tenda do Encontro.'
    reason: lexical_alternative
  - marker: c
    text: Ou “como pães sem fermento”. O hebraico indica que a oferta deve ser comida em forma não fermentada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: O que restar dela
  rationale: O particípio feminino substantivado designa a porção restante da oferta. A formulação é natural em português e mantém a referência pronominal feminina.
- source_word: יֹאכְלוּ
  choice: comerão
  rationale: O imperfeito, no contexto legal, tem força prescritiva. O futuro simples comunica a determinação com concisão e dignidade.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Arão e seus filhos
  rationale: בנים refere-se aqui aos filhos homens de Arão que exercem funções sacerdotais.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: Será comido sem fermento
  rationale: A construção passiva prescreve que a porção seja consumida em forma não fermentada, sem acrescentar uma categoria como pão, bolo ou pães.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: em lugar santo
  rationale: O hebraico não traz artigo definido em מָקוֹם; a cláusula seguinte identifica especificamente o lugar.
- source_word: בַּחֲצַר
  choice: no pátio
  rationale: חצר é a área cercada ao redor da tenda; 'pátio' é claro e corrente em português.
- source_word: אֹהֶל מוֹעֵד
  choice: Tenda do Encontro
  rationale: A expressão preserva a imagem e o sentido da designação hebraica do santuário.
- source_word: יֹאכְלוּהָ
  choice: eles o comerão
  rationale: Mantém a repetição enfática do hebraico. O pronome masculino retoma, em português, 'o que restar' como conteúdo consumido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a cadência prescritiva do texto legal, a repetição final do verbo e a ausência do artigo em “lugar santo”.
