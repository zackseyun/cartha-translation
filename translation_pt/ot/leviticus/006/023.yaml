id: LEV.6.23
reference: Leviticus 6:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל חַטָּ֡את אֲשֶׁר֩ יוּבָ֨א מִ/דָּמָ֜/הּ אֶל אֹ֧הֶל מוֹעֵ֛ד לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ לֹ֣א תֵאָכֵ֑ל בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: pt
  text: E toda oferta pelo pecado, da qual uma parte do sangue for levada para dentro da tenda do encontro, a fim de fazer expiação no lugar santo, não será comida[a]; será queimada no fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação” em vez de “oferta pelo pecado”; em Levítico, o termo hebraico חַטָּאת pode designar o sacrifício que trata da impureza e do pecado.
    reason: Registra uma alternativa lexical legítima e preserva a amplitude ritual e teológica do termo hebraico.
lexical_decisions:
- source_word: וְכָל
  choice: E toda
  rationale: Preserva a ligação com as instruções anteriores e o alcance abrangente de כָל, sem impor uma força adversativa que o contexto não exige.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: No contexto sacrificial, o termo designa a oferta relacionada ao pecado; esta formulação é clara, tradicional e inteligível, sem excluir sua função purificadora.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: da qual uma parte do sangue for levada
  rationale: 'Explicita o sentido partitivo da preposição מִן: parte do sangue, e não necessariamente todo ele, é levada para o santuário.'
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: para dentro da tenda do encontro
  rationale: Indica com naturalidade o movimento do sangue para o interior da estrutura sagrada e mantém a designação cultual reconhecível.
- source_word: לְכַפֵּר
  choice: a fim de fazer expiação
  rationale: Mantém a linguagem ritual e teológica do verbo כפר sem especificar uma teoria particular da expiação.
- source_word: בַּקֹּדֶשׁ
  choice: no lugar santo
  rationale: Representa a expressão concreta hebraica e distingue o espaço sagrado da santidade em sentido abstrato.
- source_word: לֹא תֵאָכֵל
  choice: não será comida
  rationale: Conserva a construção passiva e o registro normativo do texto hebraico.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: será queimada no fogo
  rationale: Preserva a ênfase explícita no fogo, formulada em português natural e digno.
theological_decisions:
- issue: Sentido de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O referente é claramente o sacrifício. A opção principal mantém o termo cultual mais reconhecível, enquanto a nota registra a legítima dimensão purificadora do vocábulo.
- issue: Quantidade do sangue levada ao santuário
  choice: uma parte do sangue
  alternative: o sangue
  rationale: A preposição מִן anexada a 'sangue' favorece uma leitura partitiva; explicitá-la preserva um detalhe ritual relevante sem afirmar que todo o sangue era levado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o caráter legal e ritual do versículo, evita arcaísmos desnecessários e mantém a ambiguidade lexical relevante em nota.
