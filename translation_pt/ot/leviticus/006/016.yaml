  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: pt
  text: E toda oferta de cereal de um sacerdote será queimada por inteiro[a]; não será comida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será uma oferta inteira”. O adjetivo hebraico pode indicar que a oferta é inteira ou completa; aqui, o sentido prático é que ela não deve ser comida, mas inteiramente entregue no altar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: E toda
  rationale: O וְ dá continuidade às instruções legais, e כָּל com o substantivo singular tem força distributiva; “E toda” preserva ambas.
- source_word: מִנְחַת
  choice: oferta de cereal
  rationale: Em Levítico, מִנְחָה é o termo técnico para a oferta feita de produtos dos cereais, não uma oferta genérica.
- source_word: כֹּהֵן
  choice: de um sacerdote
  rationale: A cadeia construta מִנְחַת כֹּהֵן significa “oferta de cereal de um sacerdote”; o artigo indefinido expressa naturalmente o valor distributivo no contexto.
- source_word: כָּלִיל תִּהְיֶה
  choice: será queimada por inteiro
  rationale: כָּלִיל indica algo inteiro ou totalmente entregue, e no contexto sacrificial implica que nada é reservado para consumo. A formulação explicita de modo natural em português a queima pressuposta pelo contexto.
- source_word: לֹא תֵאָכֵל
  choice: não será comida
  rationale: O imperfeito nifal é passivo e, no texto legal, expressa proibição. A tradução mantém a sintaxe concisa do hebraico.
