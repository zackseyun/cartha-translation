translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial consistente. “Será” conserva o tom prescritivo legal; “queimada por inteiro” comunica de forma natural a implicação contextual de כָּלִיל sem apagar a alternativa mais formal, registrada em nota.
