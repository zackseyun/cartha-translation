  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: pt
  text: 'Esta é a oferta de Arão e de seus filhos, que eles apresentarão a Javé no dia em que ele for ungido[a]: um décimo de efa de farinha fina como oferta regular de cereal, metade pela manhã e metade à tarde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no dia da sua unção”. O hebraico emprega aqui um pronome no singular (“ele”), embora mencione “Arão e seus filhos”.'
    reason: Preservar a forma singular e informar a ambiguidade de referência presente no texto hebraico.
lexical_decisions:
- source_word: קָרְבַּן
  choice: oferta
  rationale: Termo sacrificial amplo; “oferta” é natural, claro e adequado ao contexto ritual.
- source_word: יַקְרִיבוּ
  choice: apresentarão
  rationale: No hiphil e em contexto sacrificial, o verbo designa o ato formal de apresentar ou oferecer algo diante de Deus.
- source_word: לַיהוָה
  choice: a Javé
  rationale: Representa o nome divino יהוה como nome próprio, em forma reconhecível e corrente em português.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: no dia em que ele for ungido
  rationale: Conserva tanto o valor temporal da construção quanto o pronome masculino singular do texto hebraico, sem harmonizá-lo com “Arão e seus filhos”.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: um décimo de efa
  rationale: Expressão direta e precisa para a medida antiga; mantém “efa” como unidade histórica.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente tradicional e compreensível para a farinha refinada empregada nas ofertas.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: No contexto levítico, identifica especificamente a oferta feita com produtos do cereal.
- source_word: תָּמִיד
  choice: regular
  rationale: Expressa recorrência constante e prescrita sem sugerir necessariamente ação física ininterrupta.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: metade ... e metade
  rationale: Reproduz com naturalidade a divisão da oferta em duas porções iguais.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: pela manhã ... à tarde
  rationale: Formulação temporal natural em português, correspondente aos dois momentos diários indicados no hebraico.
theological_decisions:
- issue: Referência do pronome singular em “no dia em que ele for ungido” após “Arão e seus filhos”
  choice: Manter o pronome no singular, como no texto massorético.
  alternative: Entender distributivamente e traduzir “no dia em que forem ungidos”, ou tornar explícita uma referência coletiva a Arão e seus filhos.
  rationale: O hebraico traz o pronome objeto no singular. A tradução preserva essa tensão gramatical e possível referência representativa a Arão ou ao sacerdote ungido, sem impor uma harmonização.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe mantém o caráter prescritivo e ritual sem recorrer a arcaísmos; a ambiguidade do pronome hebraico é preservada no texto e explicada em nota.
