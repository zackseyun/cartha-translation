id: LEV.6.10
reference: Leviticus 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: pt
  text: Não será assada com fermento. Eu a dei como porção deles, dentre as minhas ofertas feitas pelo fogo[a]. Ela é santíssima, como a oferta pelo pecado e a oferta pela culpa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das minhas ofertas de alimento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a oferta de reparação”; tradicionalmente, “a oferta pela transgressão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה
  choice: será assada
  rationale: O nifal imperfeito, sob a negação לֹא, tem sentido passivo em uma proibição legal; “não será assada” preserva tanto a voz quanto o tom normativo.
- source_word: חָמֵץ
  choice: com fermento
  rationale: No contexto do ato de assar, a expressão indica que a oferta não deve ser fermentada, sem especificá-la indevidamente como pão.
- source_word: חֶלְקָם
  choice: porção deles
  rationale: Mantém a ideia de parte atribuída aos sacerdotes e preserva o sufixo possessivo plural.
- source_word: נָתַתִּי אֹתָהּ
  choice: Eu a dei
  rationale: O perfeito apresenta como estabelecida a concessão divina; o pronome feminino retoma a oferta mencionada no contexto.
- source_word: מֵאִשָּׁי
  choice: dentre as minhas ofertas feitas pelo fogo
  rationale: אִשֶּׁה é uma designação sacrificial ligada à apresentação no fogo; a formulação é transparente em português, enquanto a alternativa “ofertas de alimento” fica registrada em nota.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssima
  rationale: A construção intensiva hebraica indica o grau máximo de santidade; “santíssima” é natural e digna em português.
- source_word: כַּחַטָּאת
  choice: como a oferta pelo pecado
  rationale: O prefixo comparativo כְּ classifica esta porção no mesmo grau de santidade da oferta pelo pecado.
- source_word: וְכָאָשָׁם
  choice: e a oferta pela culpa
  rationale: Em contexto sacrificial, אָשָׁם designa a oferta associada à culpa e à reparação; a tradução principal usa a designação portuguesa mais reconhecível.
theological_decisions:
- issue: Sentido do termo sacrificial אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação; tradicionalmente, oferta pela transgressão
  rationale: “Oferta pela culpa” identifica com clareza a categoria sacrificial sem impor uma teoria doutrinária específica; a nota preserva as outras maneiras plausíveis de destacar seu caráter reparador ou transgressivo.
- issue: Sentido do termo técnico אִשֶּׁה
  choice: ofertas feitas pelo fogo
  alternative: ofertas de alimento
  rationale: A tradução principal preserva a associação evidente do termo com o fogo sacrificial. A alternativa reconhece que, no sistema sacerdotal, o termo também pode apresentar a oferta como alimento oferecido a Deus, sem resolver indevidamente a nuance lexical.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe jurídica simples. “Santíssima” conserva a força superlativa sem recorrer à expressão locativa “Santo dos Santos”. Os marcadores foram colocados junto aos termos aos quais suas respectivas alternativas se referem.
