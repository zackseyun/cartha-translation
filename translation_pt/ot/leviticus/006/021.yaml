id: LEV.6.21
reference: Leviticus 6:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל בּ֖/וֹ יִשָּׁבֵ֑ר וְ/אִם בִּ/כְלִ֤י נְחֹ֨שֶׁת֙ בֻּשָּׁ֔לָה וּ/מֹרַ֥ק וְ/שֻׁטַּ֖ף בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: pt
  text: O recipiente de barro em que ela for cozida deverá ser quebrado; mas, se for cozida num recipiente de bronze[a], este deverá ser esfregado e enxaguado com água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recipiente de cobre”. O hebraico נְחֹשֶׁת pode designar cobre ou bronze, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: recipiente de barro
  rationale: כְלִי designa um utensílio ou recipiente, e חֶרֶשׂ especifica cerâmica feita de barro. A expressão é clara e natural em português e preserva a distinção de material relevante para a instrução.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: for cozida
  rationale: O verbo בשׁל, neste contexto sacrificial, indica cozinhar, frequentemente por fervura. “For cozida” mantém a voz passiva e soa mais natural em português do que uma formulação restrita a “fervida”, sem excluir o modo de cocção pressuposto pelo contexto.
- source_word: בּוֹ
  choice: em que
  rationale: A preposição com sufixo retoma o recipiente e expressa a relação locativa. “Em que” reproduz isso de modo idiomático.
- source_word: יִשָּׁבֵר
  choice: deverá ser quebrado
  rationale: O nifal imperfeito tem força normativa no texto legal. “Deverá ser quebrado” comunica obrigação com registro digno e atual.
- source_word: כְלִי נְחֹשֶׁת
  choice: recipiente de bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze. “Bronze” é uma tradução contextualmente adequada para um recipiente metálico antigo, enquanto a alternativa genuína “cobre” é preservada em nota.
- source_word: וּמֹרַק
  choice: deverá ser esfregado
  rationale: מרק indica limpeza vigorosa por fricção, podendo envolver polir ou esfregar. “Esfregado” é compreensível e adequado à limpeza de um recipiente metálico.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: e enxaguado com água
  rationale: שטף sugere lavar ou enxaguar com água corrente. “Enxaguado com água” distingue esta etapa da fricção anterior e preserva a sequência de limpeza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A referência feminina em “ela for cozida” preserva o objeto sacrificial implícito no contexto imediato, enquanto “este” torna inequívoco que a limpeza se aplica ao recipiente metálico.
