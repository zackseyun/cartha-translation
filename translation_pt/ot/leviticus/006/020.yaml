  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: pt
  text: Tudo o que tocar na carne dela se tornará santo; e, se parte do sangue dela respingar sobre uma veste, você lavará a veste sobre a qual o sangue respingou, em lugar santo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi aspergido”. O verbo hebraico pode indicar aspersão ritual; aqui, “respingar” se ajusta ao sangue que atinge uma veste e precisa ser lavado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tudo o que
  rationale: Expressa naturalmente em português a construção indefinida e abrangente, sem restringi-la a pessoas.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: tocar na carne dela
  rationale: Mantém o sentido concreto de בָּשָׂר no contexto sacrificial; o pronome feminino retoma a oferta pelo pecado.
- source_word: יִקְדָּשׁ
  choice: se tornará santo
  rationale: Indica a entrada numa condição de santidade por contato, sem sugerir um rito formal de consagração não expresso no texto.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: e, se um pouco do sangue dela respingar
  rationale: Reproduz a projeção de sangue sobre a veste e se ajusta ao contexto da lavagem; a alternativa ritual 'for aspergido' é preservada em nota.
- source_word: עַל הַבֶּגֶד
  choice: numa veste
  rationale: A formulação indefinida é natural em linguagem legal casuística, e 'veste' é precisa e digna.
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: a parte sobre a qual ele respingou
  rationale: Explicita de modo natural que se deve lavar a área atingida da veste, preservando o referente do pronome hebraico.
- source_word: תְּכַבֵּס
  choice: você lavará
  rationale: Conserva a instrução legal direta na segunda pessoa e o sentido de lavar uma peça de tecido.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: num lugar santo
  rationale: Não identifica indevidamente o local com o santuário interior e mantém a ausência de artigo na expressão hebraica.
theological_decisions:
- issue: Santidade transmitida pelo contato com a carne da oferta pelo pecado
  choice: se tornará santo
  alternative: ficará reservado ao uso sagrado
  rationale: O contexto trata de santidade ritual, não necessariamente de transformação moral. A tradução mantém a formulação do texto sem definir além dela as consequências desse estado santo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe legal foi preservada sem rigidez excessiva; 'veste' mantém o caráter cultual, e a nota conserva a ambiguidade lexical do verbo נזה.
