  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: pt
  text: O fogo sobre o altar será mantido aceso; não se apagará. Todas as manhãs,[a] o sacerdote queimará lenha sobre ele, disporá sobre ele o holocausto e queimará sobre ele as porções de gordura das ofertas de paz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «manhã após manhã». O hebraico repete a palavra «manhã» para indicar uma ação que se repete diariamente.
    reason: lexical_alternative
  - marker: b
    text: Também «ofertas de bem-estar» ou «ofertas de comunhão».
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: será mantido aceso
  rationale: O Hofal de יקד indica que o fogo deve permanecer em estado de combustão; a formulação comunica a manutenção contínua exigida pelo rito.
- source_word: בּוֹ
  choice: sobre o altar (implícito em português)
  rationale: O referente é o altar. Para evitar a formulação pouco natural «aceso nele», o português expressa o local na frase inicial e deixa o pronome implícito, sem alterar o sentido.
- source_word: לֹא תִכְבֶּה
  choice: não se apagará
  rationale: Expressão natural e direta para a exigência de que o fogo do altar não cesse.
- source_word: וּבִעֵר ... עֵצִים
  choice: queimará lenha sobre ele
  rationale: Mantém o verbo explícito do hebraico e apresenta a ação diária do sacerdote de alimentar o fogo com lenha, sem sugerir que ele acenda um fogo novo.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: todas as manhãs
  rationale: A repetição de «manhã» tem sentido distributivo e indica uma ação diária.
- source_word: וְעָרַךְ
  choice: disporá
  rationale: No contexto sacrificial, ערך indica colocar ordenadamente a oferta sobre o altar.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: «Holocausto» é o termo sacrificial tradicional e amplamente reconhecido em português para a oferta inteiramente queimada.
- source_word: וְהִקְטִיר
  choice: queimará
  rationale: No uso sacrificial, o Hifil de קטר descreve fazer a oferta subir em fumaça no altar; «queimará» é claro e natural no contexto.
- source_word: חֶלְבֵי
  choice: as porções de gordura
  rationale: Refere-se especificamente às partes gordurosas reservadas para serem queimadas, e não genericamente às melhores partes.
- source_word: הַשְּׁלָמִים
  choice: as ofertas de paz
  rationale: Preserva a designação sacrificial tradicional, enquanto a nota registra alternativas que refletem outras nuances do termo hebraico.
theological_decisions:
- issue: Terminologia dos sacrifícios
  choice: Usar os termos reconhecidos «holocausto» e «ofertas de paz», mantendo explícitas as ações rituais.
  alternative: Empregar formulações mais etimológicas ou explicativas, como «oferta de ascensão», «ofertas de bem-estar» ou «ofertas de comunhão».
  rationale: O texto é uma instrução cultual. Termos reconhecíveis preservam as categorias sacrificiais e evitam impor uma interpretação doutrinária; as nuances legítimas de שְׁלָמִים são conservadas em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe acompanha a sequência ritual do hebraico sem reproduzir construções pronominais pouco naturais. Os marcadores foram posicionados junto às expressões a que as respectivas notas se referem.
