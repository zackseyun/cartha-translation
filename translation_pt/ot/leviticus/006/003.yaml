base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: pt
  text: O sacerdote vestirá sua veste de linho e porá roupas íntimas de linho sobre o corpo.[a] Então retirará as cinzas do holocausto que o fogo consumiu sobre o altar[b] e as colocará ao lado do altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sobre o corpo” significa literalmente “sobre sua carne”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “as cinzas que o fogo consumiu do holocausto”. A expressão hebraica é compacta e admite várias traduções semelhantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: sua roupa de linho
  rationale: No contexto das vestes sacerdotais, מִדּוֹ designa uma peça oficial, e בַד especifica o linho. “Roupa” evita definir além do que o hebraico permite o corte exato da peça.
- source_word: מִכְנְסֵי בַד
  choice: roupas íntimas de linho
  rationale: Designa a peça sacerdotal da parte inferior do corpo, usada diretamente sobre a pele. A expressão é atual e comunica sua função sem recorrer ao arcaico “calções”.
- source_word: עַל בְּשָׂרוֹ
  choice: sobre o corpo
  rationale: Literalmente, “sobre sua carne”. Em português, “sobre o corpo” expressa de modo natural que a peça era vestida diretamente no corpo.
- source_word: וְהֵרִים
  choice: retirará
  rationale: Embora o verbo tenha o sentido básico de levantar, neste procedimento ritual indica retirar as cinzas do altar.
- source_word: הַדֶּשֶׁן
  choice: as cinzas
  rationale: No contexto sacrificial, refere-se ao resíduo deixado pelo material consumido no altar.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: às quais o fogo reduziu o holocausto
  rationale: A construção hebraica é compacta e literalmente fala do fogo consumindo o holocausto. A formulação portuguesa esclarece que as cinzas são o resultado dessa combustão, sem eliminar a ambiguidade sintática da expressão.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo cultual consagrado em português bíblico para עֹלָה e indica a oferta inteiramente queimada, sem importar o sentido moderno não cultual para o contexto.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: ao lado do altar
  rationale: Expressa com clareza a proximidade lateral indicada por אֵצֶל.
