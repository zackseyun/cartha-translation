base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: pt
  text: 'Fale a Arão e aos seus filhos, dizendo: “Esta é a lei da oferta pelo pecado[a]: no lugar onde se abate o holocausto, será abatida a oferta pelo pecado diante de Yahweh. Ela é santíssima.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חַטָּאת pode designar tanto o pecado quanto a oferta associada à purificação dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel introduz uma instrução divina; “Fale” preserva o tom formal e direto da fórmula legislativa.
- source_word: אֶל אַהֲרֹן וְאֶל בָּנָיו
  choice: a Arão e aos seus filhos
  rationale: Mantém as duas preposições do hebraico e identifica com clareza os destinatários sacerdotais.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz de modo conciso a fórmula hebraica que introduz o discurso citado.
- source_word: זֹאת תּוֹרַת
  choice: Esta é a lei da
  rationale: Neste contexto sacrificial, תּוֹרָה designa uma instrução ou norma; “lei” conserva o peso legislativo e é facilmente compreensível.
- source_word: הַחַטָּאת
  choice: oferta pelo pecado
  rationale: No contexto levítico, o termo designa o sacrifício relacionado ao pecado e à purificação; a alternativa legítima é registrada em nota.
- source_word: בִּמְקוֹם
  choice: no lugar
  rationale: Tradução natural e direta da expressão locativa.
- source_word: אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: onde se abate o holocausto
  rationale: “Abater” expressa com precisão o ato sacrificial, e “holocausto” é o termo português tradicional e reconhecível para עֹלָה.
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: será abatida a oferta pelo pecado
  rationale: O imperfeito tem força prescritiva; o futuro em português comunica a determinação legal e preserva o paralelismo.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” reproduz o idioma cultual, enquanto “Yahweh” representa diretamente o nome divino.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssima
  rationale: A construção superlativa hebraica indica o mais alto grau de santidade; a forma feminina concorda naturalmente com “oferta”.
- source_word: הִוא
  choice: Ela é
  rationale: O pronome feminino retoma הַחַטָּאת, representada em português por “oferta”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pactual e segue a decisão fornecida, sem substituí-lo por um título.
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: “Oferta pelo pecado” é reconhecível e mantém a ligação lexical com o pecado, enquanto a nota preserva a dimensão de purificação ritual que o termo também pode expressar.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário sacrificial amplamente reconhecível. A sintaxe conserva o caráter legislativo do hebraico sem soar excessivamente arcaica.
