base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: pt
  text: O sacerdote que fizer expiação com ela[a] deverá comê-la. Ela deverá ser comida num lugar santo, no pátio da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que a oferece como oferta pelo pecado”. O particípio hebraico pode designar, mais especificamente, o sacerdote que realiza o rito da oferta pelo pecado.'
    reason: alternativa lexical
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: O sacerdote
  rationale: Tradução padrão de כֹּהֵן, preservando o artigo definido.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: que a oferecer como oferta pelo pecado
  rationale: 'O particípio piel de חטא tem aqui sentido ritual especializado: o sacerdote realiza o rito da oferta pelo pecado. A formulação é clara em português e mantém a ligação explícita com o pecado, sem tentar resolver toda a amplitude semântica do verbo.'
- source_word: יֹאכֲלֶנָּה
  choice: comerá dela
  rationale: O imperfeito expressa prescrição na legislação ritual. Em português, “comerá dela” comunica naturalmente que o sacerdote comerá parte da oferta.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: num lugar santo
  rationale: Preserva a ausência de artigo definido em hebraico e mantém a terminologia cultual de santidade.
- source_word: תֵּאָכֵל
  choice: Ela deverá ser comida
  rationale: Mantém a voz passiva do nifal e expressa claramente a força prescritiva da instrução.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: no pátio da tenda do encontro
  rationale: “Pátio” é natural e preciso para חָצֵר; “tenda do encontro” é uma tradução clara e consolidada de אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Sentido cultual de חטא na legislação sacrificial
  choice: que a oferecer como oferta pelo pecado
  alternative: que fizer expiação com ela; que realizar com ela o rito da oferta pelo pecado; que a purificar
  rationale: O verbo pode descrever purificação ou a realização do rito da oferta pelo pecado. A tradução principal identifica a função sacrificial sem inserir uma explicação doutrinária mais específica; a nota preserva a alternativa ligada à expiação.
- issue: Referência dos sufixos femininos
  choice: a; dela; ela
  alternative: isso; dela; isso
  rationale: Os pronomes retomam a oferta ou vítima sacrificial, substantivo naturalmente feminino em português. Essa concordância mantém a referência clara sem atribuir relevância teológica ao gênero gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o caráter jurídico-cultual do versículo, evita linguagem denominacional e registra em nota a ambiguidade do verbo hebraico.
