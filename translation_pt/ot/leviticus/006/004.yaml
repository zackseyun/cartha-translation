  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: pt
  text: Então tirará suas vestes, vestirá outras vestes e levará[a] as cinzas para fora do acampamento, a um lugar puro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tirará as cinzas” ou “fará sair as cinzas”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “puro” se refere à pureza ritual no sentido levítico.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: Então tirará
  rationale: No contexto de troca de roupa, פשט significa tirar as vestes. “Então” expressa naturalmente a sequência do procedimento indicada pelo waw.
- source_word: בְּגָדָיו
  choice: as suas vestes
  rationale: בגד é o termo comum para roupa; “vestes” mantém um registro digno e apropriado ao contexto sacerdotal.
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: vestirá outras
  rationale: לבש descreve o ato de vestir, e אחרים indica vestes diferentes das que foram retiradas. A elipse de “vestes” evita repetição sem perder clareza.
- source_word: וְהוֹצִיא
  choice: e levará
  rationale: O hifil de יצא significa fazer sair, tirar ou levar para fora. “Levará” comunica de modo natural o transporte físico das cinzas até outro lugar, preservando em nota alternativas possíveis.
- source_word: הַדֶּשֶׁן
  choice: as cinzas
  rationale: Neste contexto, דשן designa os resíduos do holocausto retirados do altar. “Cinzas”, no plural, é a forma idiomática em português.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: A expressão indica movimento para além dos limites do acampamento; esta formulação é direta e natural em português.
- source_word: אֶל מָקוֹם טָהוֹר
  choice: a um lugar puro
  rationale: טָהוֹר pertence aqui ao vocabulário levítico de pureza ritual. “Puro” preserva a categoria textual sem inserir explicação interpretativa no corpo do versículo.
theological_decisions:
- issue: Nuance ritual de טָהוֹר
  choice: lugar puro
  alternative: lugar ritualmente puro; lugar limpo
  rationale: “Puro” conserva a linguagem característica das distinções levíticas e permite que o contexto estabeleça seu sentido ritual. A nota esclarece que não se trata apenas de limpeza física.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação mantém a sequência procedural do hebraico, evita arcaísmos e conserva a terminologia de pureza ritual sem sobrecarregar o texto principal.
