base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: pt
  text: 'O sacerdote ungido, dentre os filhos dele, que o suceder deverá prepará-la[a]. É um estatuto permanente[b] para o SENHOR: ela será inteiramente transformada em fumaça[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ocupar o lugar dele”; literalmente, “estar debaixo dele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estatuto perpétuo” ou “decreto para sempre”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “será feita subir em fumaça por inteiro”; isto é, a oferta será totalmente consumida no altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: o sacerdote ungido
  rationale: Mantém a designação cultual do sacerdote consagrado por unção para o ofício, sem sugerir aqui um título messiânico.
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: que, dentre os filhos dele, o suceder
  rationale: Expressa naturalmente a sucessão sacerdotal e preserva a indicação de que o sucessor procede de seus filhos; a nota registra a formulação hebraica mais literal.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: deverá prepará-la
  rationale: O verbo עשה é amplo, mas, neste procedimento sacrificial, 'preparar' comunica a execução ritual sem acrescentar que neste ponto específico a oferta já seja apresentada ou queimada.
- source_word: חָק עוֹלָם
  choice: estatuto permanente
  rationale: Comunica a força normativa e duradoura da expressão em português atual, sem recorrer a linguagem arcaica.
- source_word: לַיהוָה
  choice: para o SENHOR
  rationale: Emprega a forma tradicional portuguesa para o tetragrama e entende a preposição como indicação de dedicação ao SENHOR.
- source_word: כָּלִיל תָּקְטָר
  choice: será inteiramente transformada em fumaça
  rationale: Preserva tanto a totalidade indicada por כָּלִיל quanto a imagem sacrificial específica de fazer a oferta subir em fumaça, em vez de reduzi-la ao sentido genérico de 'queimar'.
theological_decisions:
- issue: Identidade do 'sacerdote ungido'
  choice: o sacerdote ungido para o ofício que sucede ao sacerdote anterior
  alternative: qualquer sacerdote ungido, ou uma figura messiânica
  rationale: O contexto cultual e a expressão de sucessão dentre os filhos apontam para a continuidade do ofício sacerdotal, sem transformar a frase em título messiânico.
- issue: Representação do tetragrama יהוה
  choice: o SENHOR
  alternative: Yahweh; Jeová
  rationale: Segue a convenção reverente e amplamente reconhecida em traduções portuguesas, com versaletes representados aqui por maiúsculas.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário cultual acessível. A construção 'dentre os filhos dele' evita uma referência possessiva ambígua, e as notas preservam alternativas lexicais genuínas do hebraico.
