base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: Informa a forma hebraica por trás de “Yahweh” e a tradução tradicional.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O wayyiqtol de דבר dá continuidade à narrativa. “E ... falou” preserva esse fluxo e distingue o verbo de אמר (“dizer”).
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; “falar a Moisés” é uma construção natural e digna em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula introdutória, o infinitivo “dizendo” anuncia o discurso direto que vem a seguir. Em português atual, os dois-pontos cumprem naturalmente essa função sem perda de sentido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título; a nota informa a tradição de vertê-lo por “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a coordenação narrativa com “E”; os dois-pontos introduzem de modo natural a fala iniciada no versículo seguinte.
