base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/012.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH. Tradicionalmente traduzido como «SENHOR»; também representado em português como «Javé» ou «Jeová».'
    reason: Explica a forma do nome divino e registra traduções tradicionais e alternativas.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דִּבֵּר, precedido pelo waw narrativo, introduz um novo ato de fala. «Falou» é a forma natural e digna em português para esta fórmula narrativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título. A nota registra a tradução tradicional e a forma aportuguesada conhecida.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; em «falou a Moisés», esta é uma construção portuguesa clara e fiel.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o conteúdo da fala e prepara naturalmente a declaração seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o nome próprio divino, não o título אֲדֹנָי. «Yahweh» o representa diretamente sem substituir o nome por um título; a nota informa as convenções alternativas sem impor uma reconstrução da pronúncia como absolutamente certa.
translation_notes:
  register: Português atual, claro e solene, com sintaxe próxima da fórmula hebraica. O marcador foi colocado imediatamente após o nome divino a que a nota se refere.
