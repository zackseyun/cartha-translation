  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: pt
  text: Sobre uma chapa, com óleo, será preparada[a], bem misturada; você a levará. Como oferta de cereal assada[b], em pedaços, você a apresentará como aroma agradável a Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em óleo”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “assada” é raro e pode designar uma preparação assada feita na chapa.
    reason: lexical_alternative
  - marker: c
    text: “Aroma agradável” é uma expressão sacrificial tradicional para uma oferta recebida favoravelmente por Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: chapa
  rationale: Designa uma superfície ou panela rasa usada no preparo da oferta; “chapa” comunica de modo claro e atual a ideia de uma superfície plana para assar.
- source_word: בַּשֶּׁמֶן
  choice: com óleo
  rationale: A preposição pode indicar “em” ou “com”; aqui, “com óleo” expressa naturalmente o meio ou ingrediente do preparo sem eliminar a alternativa lexical.
- source_word: תֵּעָשֶׂה
  choice: será preparada
  rationale: O nifal de עשה é passivo; “preparada” soa mais natural em uma instrução culinária e cultual do que o literal “feita”.
- source_word: מֻרְבֶּכֶת
  choice: bem misturada
  rationale: O termo descreve provavelmente a oferta ou massa misturada ao óleo; a formulação evita especificar indevidamente um processo culinário incerto.
- source_word: תְּבִיאֶנָּה
  choice: você a levará
  rationale: Preserva o sentido básico de “trazer/levar” e o sufixo feminino que retoma a oferta.
- source_word: תֻּפִינֵי
  choice: porções assadas
  rationale: É um termo culinário raro, provavelmente relacionado ao assamento; “porções assadas” preserva a incerteza quanto à forma exata do alimento.
- source_word: מִנְחַת
  choice: oferta de cereal
  rationale: Expressa a natureza específica da oferta feita de farinha ou cereal no contexto levítico.
- source_word: פִּתִּים
  choice: em pedaços
  rationale: Refere-se a partes ou pedaços; a tradução concisa evita acrescentar se foram necessariamente quebrados antes ou depois do cozimento.
- source_word: תַּקְרִיב
  choice: apresentará
  rationale: No contexto sacrificial, o hifil de קרב significa fazer chegar perto, apresentar ou oferecer; “apresentará” mantém o tom cultual.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma agradável
  rationale: Preserva a fórmula sacrificial de aceitação divina em linguagem corrente, sem reduzi-la a uma descrição meramente olfativa.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando seu caráter de nome próprio no texto-fonte.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido cultual de רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador; aroma suave
  rationale: A expressão formulaica indica que a oferta é recebida favoravelmente por Deus; a tradução mantém a imagem hebraica sem explicar além do texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o caráter instrutivo do texto cultual, enquanto as notas preservam a ambiguidade culinária e explicam brevemente a fórmula sacrificial.
