  yaml_path: translation/ot/leviticus/006/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O wayyiqtol de דבר abre uma nova unidade de fala e a conecta à narrativa anterior. “E ... falou” preserva essa ligação sem impor uma sequência temporal mais explícita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; “falar a alguém” é uma construção natural e digna em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso direto e prepara naturalmente os versículos seguintes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” conserva o nome pessoal em transliteração, sem substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, claro e solene, com estrutura próxima à fórmula hebraica. Não se acrescenta nota, pois não há marcador necessário no texto e a opção por “Yahweh” é apresentada diretamente.
