id: LEV.6.7
reference: Leviticus 6:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: pt
  text: 'E esta é a lei[a] da oferta de cereal: os filhos de Arão a apresentarão diante de Yahweh, em frente ao altar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrução referente à” ou “regulamento da” oferta de cereal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: E esta é
  rationale: Mantém a força conectiva de וְ e introduz naturalmente, em português, uma nova seção de instruções.
- source_word: תּוֹרַת
  choice: a lei
  rationale: No contexto sacrificial, תּוֹרָה designa a norma ou instrução prescrita para a oferta. “Lei” conserva o caráter jurídico-litúrgico, enquanto a nota registra alternativas legítimas.
- source_word: הַמִּנְחָה
  choice: da oferta de cereal
  rationale: Em Levítico, מִנְחָה é a oferta feita de produtos cerealíferos, e não uma oferta genérica. “Oferta de cereal” é clara e corrente.
- source_word: הַקְרֵב אֹתָהּ
  choice: a apresentarão
  rationale: Expressa a ação ritual de fazer a oferta aproximar-se e apresentá-la. O futuro com valor prescritivo é natural em legislação portuguesa.
- source_word: בְּנֵי אַהֲרֹן
  choice: os filhos de Arão
  rationale: Preserva de perto a designação familiar e sacerdotal do hebraico.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” comunica apresentação na presença divina, e “Yahweh” representa diretamente o nome da aliança.
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: em frente ao altar
  rationale: Mantém a indicação espacial concreta e a distingue de “diante de Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido de תּוֹרָה na legislação sacrificial
  choice: lei
  alternative: instrução; regulamento
  rationale: “Lei” mantém o caráter normativo da passagem, mas a nota preserva a amplitude semântica do termo e evita excluir as ideias de instrução e regulamento.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe normativa natural. A repetição espacial foi preservada por meio de “diante de Yahweh” e “em frente ao altar”.
