  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: pt
  text: E, se a sua oferta a Yahweh for um holocausto de aves, ele apresentará a sua oferta de rolas ou de pombos jovens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva tanto a ligação com as instruções anteriores quanto a introdução de um novo caso condicional.
- source_word: מִן הָעוֹף
  choice: de aves
  rationale: עוֹף designa aves; esta formulação é natural em português e mantém a ideia de procedência ou categoria da oferta.
- source_word: עֹלָה
  choice: holocausto
  rationale: É o termo sacrificial tradicional e ainda compreensível em português bíblico para a oferta inteiramente queimada, sem reduzir o termo à etimologia de algo que sobe.
- source_word: קָרְבָּנוֹ
  choice: a oferta que ele apresenta / como oferta
  rationale: קָרְבָּן é aquilo que se traz ou aproxima como oferta. A primeira ocorrência foi explicitada naturalmente, e a repetição final foi preservada sem rigidez.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário da apresentação sacrificial, e o nome divino é transliterado como Yahweh.
- source_word: וְהִקְרִיב
  choice: deverá apresentar
  rationale: O hifil de קרב exprime fazer chegar ou trazer à presença; 'apresentar' comunica com naturalidade a ação ritual.
- source_word: מִן הַתֹּרִים
  choice: uma rola
  rationale: תֹּרִים designa rolas. Embora o hebraico empregue plural genérico, em português o singular concorda naturalmente com a escolha de um animal para a oferta.
- source_word: אוֹ
  choice: ou
  rationale: Mantém a alternativa simples entre as duas espécies permitidas.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: um pombinho
  rationale: A expressão idiomática significa literalmente 'filhos da pomba' e designa pombos novos; 'pombinho' comunica idade jovem de modo conciso e natural.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. 'Yahweh' preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido técnico de עֹלָה
  choice: holocausto
  alternative: oferta queimada; oferta de ascensão
  rationale: O contexto estabelece uma categoria sacrificial específica. 'Holocausto' preserva o termo técnico consagrado, embora a raiz hebraica também evoque a ideia de subir.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário sacrificial bíblico reconhecível. A sintaxe evita literalismo excessivo, mas conserva a condição, o destinatário divino e as duas opções de aves.
