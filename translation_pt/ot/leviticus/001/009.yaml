base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: pt
  text: Ele, porém, lavará com água as vísceras e as pernas do animal; e o sacerdote fará tudo subir em fumaça sobre o altar, como holocausto, oferta feita pelo fogo[a], aroma agradável a Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de alimento”. O sentido exato do termo hebraico é discutido; tradicionalmente ele também é traduzido como “oferta queimada” ou “oferta pelo fogo”.
    reason: lexical_alternative
  - marker: b
    text: “Aroma agradável” é uma fórmula sacrificial que apresenta a oferta como agradável e aceitável a Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: as vísceras
  rationale: No contexto sacrificial, קֶרֶב designa as partes ou órgãos internos do animal. “Vísceras” é concreto, claro e adequado à lavagem ritual.
- source_word: כְרָעָיו
  choice: as pernas do animal
  rationale: O termo se refere aos membros inferiores do animal. A explicitação “do animal” evita que o possessivo hebraico fique ambíguo em português.
- source_word: יִרְחַץ בַּמָּיִם
  choice: lavará com água
  rationale: Reproduz de modo natural em português tanto a ação de lavar quanto o meio indicado pela preposição hebraica.
- source_word: וְהִקְטִיר
  choice: fará tudo subir em fumaça
  rationale: No vocabulário sacrificial, o verbo indica que a oferta é consumida no altar e sobe em fumaça, sentido mais específico do que simplesmente “queimar”.
- source_word: אֶת־הַכֹּל
  choice: tudo
  rationale: Mantém a ênfase hebraica na totalidade do animal preparado para o holocausto.
- source_word: הַמִּזְבֵּחָה
  choice: no altar
  rationale: Formulação corrente e natural em português para o destino sacrificial indicado pelo hebraico.
- source_word: עֹלָה
  choice: holocausto
  rationale: É o termo sacrificial tradicional e amplamente reconhecido em português para a oferta inteiramente queimada, sem depender do sentido moderno não bíblico da palavra.
- source_word: אִשֵּׁה
  choice: oferta feita pelo fogo
  rationale: A formação e o sentido exato do termo são discutidos. “Oferta feita pelo fogo” preserva sua associação evidente com o fogo sacrificial, enquanto a nota registra a alternativa “oferta de alimento”.
- source_word: רֵיחַ נִיחוֹחַ
  choice: aroma agradável
  rationale: Preserva a metáfora da fórmula sacrificial hebraica em linguagem natural, sem explicar além do que o texto afirma.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama e mantém a direção ou referência indicada pela preposição לְ.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” representa o nome próprio, sem substituí-lo por um título.
- issue: Sentido de אִשֵּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A evidência lexical admite discussão. O texto principal conserva a associação formal com o fogo, e a nota mantém visível a alternativa sem resolver indevidamente a questão.
- issue: Sentido teológico de רֵיחַ נִיחוֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador
  rationale: A tradução conserva a imagem e sua tensão própria, sem transformá-la em uma afirmação de necessidade física divina nem reduzir a expressão apenas a uma explicação abstrata de aceitação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário sacrificial reconhecível. “Ele, porém” expressa a transição contrastiva do contexto; “do animal” esclarece o referente dos sufixos hebraicos. Os dois-pontos introduzem naturalmente a sequência apositiva do original.
