  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: pt
  text: Ele o abaterá no lado norte do altar, diante de Yahweh, e os filhos de Arão, os sacerdotes, lançarão o sangue do animal contra o altar, por todos os lados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arremessarão o sangue do animal contra o altar, por todos os lados”. O verbo hebraico indica que o sangue era lançado com força, não apenas aspergido levemente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט אֹתוֹ
  choice: Ele o matará
  rationale: שׁחט é o verbo próprio para o abate de animais, sobretudo em contexto sacrificial. Em português, “matará” é natural e claro; o contexto ritual já especifica que se trata de abate sacrificial.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: no lado norte do altar
  rationale: יֶרֶךְ significa literalmente “lado” ou “flanco”, e צָפֹנָה localiza a ação ao norte. A formulação escolhida é idiomática e preserva a precisão espacial.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão cultual indica a presença de Yahweh. “Diante de” preserva a formulação concreta e solene do hebraico.
- source_word: וְזָרְקוּ
  choice: lançarão
  rationale: זרק denota lançar ou arremessar. No rito do sangue, descreve sua aplicação vigorosa ao altar, não uma aspersão leve.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: os filhos de Arão, os sacerdotes
  rationale: Mantém a estrutura apositiva do hebraico, identificando tanto a linhagem quanto a função sacerdotal.
- source_word: אֶת דָּמוֹ
  choice: o sangue do animal
  rationale: O sufixo remete ao animal sacrificado. A explicitação evita a ambiguidade que “seu sangue” poderia produzir em português.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contra todos os lados do altar
  rationale: Com זרק, עַל indica o alvo contra o qual o sangue é lançado; סָבִיב comunica distribuição ao redor, pelos lados do altar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome divino, não um título. “Yahweh” o representa diretamente, sem substituí-lo por “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário ritual compreensível. O futuro do presente preserva o caráter prescritivo da instrução legal. A repetição de “altar” mantém a clareza e acompanha a estrutura hebraica.
