base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: pt
  text: Ele o cortará em pedaços, junto com a cabeça e a gordura[a], e o sacerdote os disporá sobre a lenha que está sobre o fogo que está sobre o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sebo” ou “a gordura que recobre as entranhas”. O termo hebraico se refere à gordura associada ao animal sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: Ele o cortará em pedaços
  rationale: No contexto sacrificial, נתח indica cortar o animal em partes. A formulação é natural em português e mantém o caráter prescritivo da instrução.
- source_word: רֹאשׁוֹ
  choice: a cabeça
  rationale: Equivalente anatômico direto; o artigo definido soa mais natural em português, pois a relação possessiva com o animal já está clara.
- source_word: פִּדְרוֹ
  choice: a gordura
  rationale: פדר designa tecido adiposo associado ao animal sacrificial. “Gordura” é claro e atual; uma nota registra alternativas mais específicas sem impor uma precisão contestável ao texto principal.
- source_word: וְעָרַךְ
  choice: colocará em ordem
  rationale: ערך descreve a disposição ordenada dos elementos do sacrifício. A expressão conserva essa nuance ritual melhor do que apenas “colocará”.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução padrão e amplamente compreensível de כהן no contexto levítico.
- source_word: עַל הָעֵצִים
  choice: sobre a lenha
  rationale: Embora עֵצִים seja formalmente plural, “lenha” é o coletivo natural em português para a madeira usada no fogo do altar.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: que está sobre o fogo que está sobre o altar
  rationale: Mantém as duas orações relativas e a descrição espacial encadeada do hebraico, sem fundi-las interpretativamente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima da sequência ritual hebraica. O futuro do indicativo expressa a força prescritiva própria da legislação. A repetição de “que está sobre” foi mantida para preservar a estrutura espacial em camadas do original.
