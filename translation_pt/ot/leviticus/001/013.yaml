source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: pt
  text: Lavará com água as vísceras e as pernas. Então o sacerdote apresentará tudo e fará tudo subir em fumaça sobre o altar. É um holocausto, uma oferta feita pelo fogo[a], de aroma agradável a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “oferta de alimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: as vísceras
  rationale: No contexto sacrificial, refere-se às partes internas do animal; “vísceras” é concreto, claro e natural em português.
- source_word: הַכְּרָעַיִם
  choice: as pernas
  rationale: Designa as pernas do animal, especialmente suas partes inferiores. “Pernas” é a forma mais acessível sem impor precisão anatômica além do hebraico.
- source_word: יִרְחַץ בַּמָּיִם
  choice: lavará com água
  rationale: Preserva tanto o sentido direto de רחץ quanto a expressão instrumental explícita “com água”.
- source_word: וְהִקְרִיב
  choice: apresentará
  rationale: O hifil de קרב indica fazer chegar ou apresentar a oferta. “Apresentará” mantém essa etapa distinta do ato seguinte de fazê-la subir em fumaça.
- source_word: אֶת־הַכֹּל
  choice: tudo
  rationale: Expressa a totalidade das partes preparadas de modo conciso e idiomático.
- source_word: וְהִקְטִיר
  choice: fará tudo subir em fumaça
  rationale: O verbo sacrificial é mais específico que simplesmente “queimar” e descreve a oferta sendo consumida no altar e subindo em fumaça.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Representa naturalmente em português o local para o qual a oferta é levada e onde é queimada.
- source_word: עֹלָה
  choice: um holocausto
  rationale: “Holocausto” é o equivalente técnico consagrado em português para a oferta inteiramente queimada, embora a raiz hebraica evoque aquilo que sobe.
- source_word: אִשֵּׁה
  choice: uma oferta feita pelo fogo
  rationale: Mantém a associação explícita e tradicional do termo com o fogo, sem confundi-lo com o termo anterior, “holocausto”; a possível interpretação como oferta de alimento é registrada em nota.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Preserva a metáfora sensorial hebraica de aceitação divina em linguagem portuguesa natural.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino presente no texto hebraico e segue a forma adotada no texto de consulta fornecido.
theological_decisions:
- issue: Linguagem antropomórfica em רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  alternative: de aroma apaziguador
  rationale: A tradução conserva a imagem sensorial ligada à aceitação do sacrifício sem transformá-la numa explicação sobre a fisiologia divina nem acrescentar a ideia explícita de apaziguamento.
- issue: Sentido cultual de אִשֵּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A relação tradicional do termo com אֵשׁ, “fogo”, é lexicalmente transparente e adequada ao contexto imediato. Como há discussão sobre sua formação e sobre a possibilidade de designar alimento sacrificial, a alternativa é mantida em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantêm-se os termos cultuais “altar” e “holocausto”; a sequência ritual é expressa em frases claras. O nome divino é transliterado como “Yahweh”, em conformidade com a camada inglesa de consulta.
