  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: pt
  text: Então, tirará a pele do holocausto[a] e o cortará em partes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esfolará o holocausto”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o cortará em suas partes”; refere-se a dividir o animal em seções para o sacrifício.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: tirará a pele
  rationale: O hifil de פשט, neste contexto sacrificial, indica remover a pele do animal. A expressão é clara e natural em português atual.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עֹלָה é o termo ritual para a oferta inteiramente queimada. “Holocausto” é a designação bíblica tradicional e amplamente reconhecida em português.
- source_word: וְנִתַּח
  choice: e o cortará
  rationale: נתח descreve o corte do animal em porções destinadas ao sacrifício. “Cortará” preserva a ação concreta sem acrescentar tecnicismo.
- source_word: לִנְתָחֶיהָ
  choice: em seus pedaços
  rationale: O substantivo נתח designa uma parte ou seção cortada; a construção indica a divisão do animal nas partes que o compõem.
- source_word: וְ
  choice: Depois
  rationale: A conjunção introduz a etapa seguinte do procedimento. “Depois” expressa de modo natural a sequência narrativa em português.
