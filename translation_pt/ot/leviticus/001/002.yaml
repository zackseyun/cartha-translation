  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: pt
  text: '“Fale aos filhos de Israel[a] e diga-lhes: Quando um homem dentre vocês[b] trouxer uma oferta a Yahweh, vocês deverão trazer sua oferta dentre os animais domésticos: do gado bovino ou dos rebanhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “o povo de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “alguém dentre vocês” ou “uma pessoa dentre vocês”. O hebraico emprega “um homem” (adam) em sentido representativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a fórmula hebraica de tratamento e sua forma masculina, enquanto a nota registra alternativas mais naturais em português.
- source_word: אָדָם
  choice: um homem
  rationale: O singular introduz um caso individual representativo. A tradução conserva a forma masculina do hebraico sem negar seu alcance geral, esclarecido na nota.
- source_word: יַקְרִיב
  choice: trouxer
  rationale: No contexto sacrificial, o hifil de קרב indica levar ou apresentar uma oferta; “trouxer” conserva a imagem concreta e soa natural em português.
- source_word: מִכֶּם
  choice: dentre vocês
  rationale: 'Expressa o sentido partitivo: um indivíduo pertencente à comunidade dos destinatários.'
- source_word: קָרְבָּן
  choice: oferta
  rationale: É um termo amplo e adequado para aquilo que é levado e apresentado a Deus; “sacrifício” seria mais restrito neste enunciado introdutório.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome próprio da aliança.
- source_word: הַבְּהֵמָה
  choice: os animais domésticos
  rationale: Designa aqui a categoria abrangente dos animais domesticados dos quais se poderia trazer a oferta.
- source_word: הַבָּקָר
  choice: o gado bovino
  rationale: Identifica com clareza os bovinos, uma das duas categorias de animais mencionadas.
- source_word: הַצֹּאן
  choice: os rebanhos
  rationale: Mantém o termo coletivo para o gado miúdo, sobretudo ovelhas e cabras, sem inserir essa explicitação no corpo do versículo.
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  choice: vocês deverão trazer sua oferta
  rationale: Conserva a mudança do sujeito singular do caso hipotético para a instrução comunitária na segunda pessoa do plural e mantém a ligação verbal com יַקְרִיב.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Linguagem masculina representativa em אָדָם e בְּנֵי יִשְׂרָאֵל
  choice: “um homem” e “filhos de Israel”
  alternative: “alguém” ou “uma pessoa”; “israelitas” ou “povo de Israel”
  rationale: A tradução principal conserva as formas masculinas e a expressão idiomática do hebraico. As notas registram o sentido representativo e as alternativas naturais, sem restringir indevidamente a aplicação do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a estrutura jurídica do hebraico, inclusive a passagem do indivíduo singular para a comunidade no plural. “Gado bovino” evita a ambiguidade de “gado”, e “rebanhos” mantém de modo conciso a categoria coletiva de ovelhas e cabras.
