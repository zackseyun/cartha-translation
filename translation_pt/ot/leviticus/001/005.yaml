base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: pt
  text: Ele abaterá o novilho[a] diante de Yahweh. Então os filhos de Arão, os sacerdotes, apresentarão o sangue e lançarão[b] o sangue contra o altar, em toda a volta, que fica à entrada da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filho do gado”, expressão idiomática para um bovino; aqui, “novilho”.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir “aspergirão o sangue” ou “arremessarão o sangue”. O verbo hebraico descreve o ato de lançar o sangue em sua aplicação ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: abaterá
  rationale: No contexto de instruções sacrificiais, a forma verbal comunica a ação prescrita. “Abater” expressa com precisão a matança de um animal sem a imprecisão do genérico “matar”.
- source_word: בֶּן הַבָּקָר
  choice: o novilho
  rationale: A expressão significa literalmente “filho do gado/rebanho bovino”. “Novilho” é uma forma natural de indicar aqui o bovino jovem e masculino, conforme o contexto imediato do sacrifício.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva de modo conciso a linguagem espacial e ritual do hebraico e translitera o nome divino.
- source_word: וְהִקְרִיבוּ
  choice: apresentarão
  rationale: O hifil de קרב significa fazer chegar perto ou apresentar. Com “o sangue” como objeto, “apresentar” é claro e evita sugerir que os sacerdotes oferecem novamente todo o animal.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: os filhos de Arão, os sacerdotes
  rationale: Mantém tanto a designação familiar quanto a aposição que identifica sua função sacerdotal.
- source_word: וְזָרְקוּ
  choice: o lançarão
  rationale: O verbo זרק descreve o ato de lançar ou arremessar o sangue na aplicação ritual. O pronome evita uma repetição pesada em português, sem eliminar o referente explícito.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contra o altar, ao redor
  rationale: “Contra” comunica a aplicação do sangue às superfícies laterais do altar, e “ao redor” preserva סָבִיב sem especificar além do texto exatamente como a distribuição era feita.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente da expressão hebraica, mais direta que o termo tradicional “tabernáculo”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Intensidade da aplicação ritual do sangue em זרק
  choice: lançar contra o altar
  alternative: aspergir sobre o altar
  rationale: “Lançar” conserva a força física mais provável do verbo hebraico, enquanto “aspergir” pode sugerir gotas leves e confundir זרק com outros verbos rituais. A nota registra a formulação tradicional sem resolver em excesso a modalidade exata.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “o altar” no fim esclarece que a oração relativa descreve a localização do altar, não a do sangue ou do ato de lançá-lo.
