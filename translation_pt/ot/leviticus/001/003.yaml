id: LEV.1.3
reference: Leviticus 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: pt
  text: Se a sua oferta for um holocausto do gado, deverá oferecer um macho sem defeito. Ele o apresentará à entrada da tenda do encontro, para que o ofertante seja aceito diante de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que o apresente de livre vontade diante de Yahweh”.'
    reason: A expressão hebraica לִרְצֹנוֹ pode ser entendida como referente à aceitação do ofertante ou como indicação de voluntariedade.
lexical_decisions:
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo sacrificial estabelecido em português para a oferta inteiramente consumida no altar; é conciso e reconhecível no contexto de Levítico.
- source_word: קָרְבָּנוֹ
  choice: a sua oferta
  rationale: קָרְבָּן designa aquilo que é apresentado a Deus; “oferta” é natural e adequado ao contexto sacrificial.
- source_word: מִן הַבָּקָר
  choice: do gado
  rationale: Refere-se ao gado bovino, em contraste com os animais do rebanho mencionados depois; “do gado” é a formulação corrente em português.
- source_word: זָכָר תָּמִים
  choice: um macho sem defeito
  rationale: Preserva tanto a exigência relativa ao sexo do animal quanto sua integridade física para o sacrifício.
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: deverá oferecer / Ele o apresentará
  rationale: O hifil de קרב tem sentido cultual de levar e apresentar uma oferta. A variação em português evita repetição pesada sem apagar a repetição instrutiva do hebraico.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Tradução direta e natural da expressão que identifica o local de acesso ao santuário.
- source_word: לִרְצֹנוֹ
  choice: para que seja aceito
  rationale: Expressa o provável sentido cultual de obter aceitação, sem expandir indevidamente a frase. A interpretação tradicional ligada à voluntariedade é registrada em nota.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” traduz naturalmente a ideia de presença, e “Yahweh” representa o nome divino explícito no texto hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de לִרְצֹנוֹ
  choice: para que seja aceito
  alternative: de livre vontade; para sua aceitação
  rationale: A construção admite discussão entre aceitação cultual e voluntariedade. O texto principal adota o sentido de aceitação, provável neste contexto, e conserva a alternativa histórica em nota.
translation_notes:
  register: Português moderno, claro e solene, com terminologia sacrificial tradicional onde ela continua compreensível. A construção impessoal “para que seja aceito” mantém concisão e evita explicitar além do hebraico o referente preciso da aceitação.
