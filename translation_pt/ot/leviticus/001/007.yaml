  text: וְ֠/נָתְנוּ בְּנֵ֨י אַהֲרֹ֧ן הַ/כֹּהֵ֛ן אֵ֖שׁ עַל הַ/מִּזְבֵּ֑חַ וְ/עָרְכ֥וּ עֵצִ֖ים עַל הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/007.yaml
  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: pt
  text: Os filhos de Arão, o sacerdote, colocarão fogo sobre o altar e disporão lenha sobre o fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: colocarão
  rationale: נתן pode significar “dar”, “pôr” ou “colocar”. No contexto de uma instrução ritual, “colocarão” expressa com naturalidade a ação concreta e o valor prescritivo da forma verbal.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: os filhos do sacerdote Arão
  rationale: A construção identifica Arão, no singular, como sacerdote, e seus filhos como os agentes da ação. Esta ordem é clara e natural em português, sem sugerir que o singular “sacerdote” qualifique os filhos.
- source_word: אֵשׁ
  choice: fogo
  rationale: O substantivo designa literalmente o fogo usado no procedimento sacrificial.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: “Sobre” traduz de modo natural a posição indicada por עַל neste contexto ritual.
- source_word: וְעָרְכוּ
  choice: e arrumarão
  rationale: ערך denota dispor ou pôr em ordem. “Arrumarão” é corrente e compreensível, preservando a ideia de disposição ordenada da lenha.
- source_word: עֵצִים
  choice: a lenha
  rationale: Embora a forma hebraica seja plural, “lenha” é o substantivo coletivo idiomático em português para a madeira destinada ao fogo; “madeiras” seria pouco natural e “toras” seria específico demais.
- source_word: עַל הָאֵשׁ
  choice: sobre o fogo
  rationale: A repetição da expressão preposicional acompanha a sequência concreta do hebraico e é preservada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação normativa adequada à legislação sacrificial. A ordem “do sacerdote Arão” evita a possível leitura equivocada de que “sacerdote”, no singular, descreva coletivamente os filhos. Não se acrescentou nota, pois a sintaxe e o sentido lexical podem ser representados diretamente no texto.
