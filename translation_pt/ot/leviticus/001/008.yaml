base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: pt
  text: E os filhos de Arão, os sacerdotes, disporão os pedaços, a cabeça e a gordura[a] sobre a lenha que está sobre o fogo que está sobre o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sebo” ou “a cobertura gordurosa”; o termo hebraico se refere a uma porção gordurosa do animal usada na oferta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: E ... disporão
  rationale: O verbo ערך, em contexto sacrificial, indica pôr ou organizar em determinada ordem. “Disporão” preserva o caráter procedural, e “E” representa a conjunção inicial.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: os filhos de Arão, os sacerdotes
  rationale: A pontuação deixa claro que “os sacerdotes” está em aposição a “os filhos de Arão”, sem acrescentar interpretação.
- source_word: הַנְּתָחִים
  choice: os pedaços
  rationale: O termo designa as partes em que o animal foi cortado no procedimento anterior. “Pedaços” é concreto, natural e não explicita além do hebraico.
- source_word: הָרֹאשׁ
  choice: a cabeça
  rationale: Tradução anatômica direta do termo hebraico.
- source_word: הַפָּדֶר
  choice: a gordura
  rationale: O termo se refere a uma porção gordurosa do animal, possivelmente o sebo ou a cobertura gordurosa. “Gordura” é a opção mais clara no texto principal, enquanto a incerteza anatômica é preservada em nota.
- source_word: עַל הָעֵצִים
  choice: sobre a lenha
  rationale: עֵצִים tem aqui sentido coletivo e designa a madeira usada como combustível. “Lenha” é natural e preciso em português.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: que está sobre o fogo que está sobre o altar
  rationale: Mantém as duas orações relativas sucessivas e a descrição espacial em camadas do hebraico, sem suavizar sua repetição procedural.
