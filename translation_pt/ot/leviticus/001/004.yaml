source:
  edition: WLC
  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: pt
  text: Porá a mão sobre a cabeça do holocausto, e este será aceito em seu favor[a], para fazer expiação por ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ele será aceito” — o passivo hebraico pode ser entendido como referência mais direta ao ofertante, e não ao holocausto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Porá
  rationale: No contexto sacrificial, סמך descreve o ato ritual de pôr ou apoiar a mão sobre o animal. “Porá” é natural e não especifica indevidamente a intensidade da pressão.
- source_word: יָדוֹ
  choice: a mão
  rationale: Mantém o singular do hebraico; o possessivo fica claro pelo sujeito implícito em português.
- source_word: עַל רֹאשׁ
  choice: sobre a cabeça
  rationale: Reproduz com naturalidade a relação espacial do gesto ritual.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo cultual tradicional em português para a oferta inteiramente queimada; evita transformar a etimologia de עֹלָה em uma explicação dentro do texto.
- source_word: וְנִרְצָה
  choice: e este será aceito
  rationale: Conserva a voz passiva e toma o holocausto como referente contextual mais próximo, sem ocultar em nota a possível referência mais direta ao ofertante.
- source_word: לוֹ
  choice: em seu favor
  rationale: Expressa a ideia de benefício ou vantagem indicada pela preposição לְ.
- source_word: לְכַפֵּר
  choice: para fazer expiação
  rationale: Preserva o peso cultual e teológico de כפר sem impor uma teoria específica da expiação.
- source_word: עָלָיו
  choice: por ele
  rationale: No uso sacrificial com כפר, indica a pessoa em favor de quem se faz expiação; a formulação concisa também preserva a estrutura do hebraico.
theological_decisions:
- issue: Referente do verbo passivo וְנִרְצָה
  choice: O holocausto será aceito
  alternative: O ofertante será aceito
  rationale: O holocausto é o referente sacrificial mais próximo e se encaixa naturalmente na sequência do rito. Como a forma hebraica também pode ser entendida como aceitação mais direta do ofertante, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com terminologia cultual estabelecida. O futuro simples mantém o caráter prescritivo da instrução legal; a nota conserva a ambiguidade legítima do hebraico.
