  naturalness: O texto é claro e de registro apropriado. “Oferta queimada” soa mais idiomático e conciso em português bíblico moderno do que “oferta feita pelo fogo”.
  terminology: “Holocausto”, “altar”, “aroma agradável” e “Yahweh” são escolhas adequadas. Para אִשֶּׁה, “oferta queimada” mantém a referência cultual ao fogo; a alternativa “oferta de alimento” pode permanecer em nota, sem alegar uma incerteza indevida sobre todo o termo.
