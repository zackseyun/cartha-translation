base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: pt
  text: Ele o rasgará pelas asas, mas não o separará; então o sacerdote o queimará no altar, sobre a lenha que está no fogo. É um holocausto, uma oferta queimada, de aroma agradável a Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁסַּע
  choice: o rasgará
  rationale: Expressa a ação de abrir a ave rasgando-a e mantém a ligação com a ordem seguinte de não a separar completamente.
- source_word: בִכְנָפָיו
  choice: pelas asas
  rationale: Preserva a imagem concreta e admite a nuance locativa ou instrumental da preposição hebraica.
- source_word: לֹא יַבְדִּיל
  choice: sem separá-lo em duas partes
  rationale: Torna explícito em português natural que a ave deve ser aberta, mas não completamente dividida.
- source_word: וְהִקְטִיר
  choice: o queimará
  rationale: No contexto do altar, comunica de modo claro o ato sacrificial de queimar e fazer subir em fumaça.
- source_word: הַמִּזְבֵּחָה
  choice: no altar
  rationale: Terminologia cultual corrente e natural em português.
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: sobre a lenha que está no fogo
  rationale: Conserva a disposição descrita no hebraico e sua repetição espacial sem tornar a frase pesada.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo bíblico consolidado em português para a oferta inteiramente queimada, adequado ao contexto levítico.
- source_word: אִשֵּׁה
  choice: oferta feita pelo fogo
  rationale: Reflete diretamente a provável relação do termo com fogo e evita impor o sentido discutível de alimento; a alternativa possível é registrada em nota.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma agradável
  rationale: Reproduz a metáfora cultual e comunica aceitação divina em linguagem moderna, sem explicá-la teologicamente.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino expresso no texto hebraico e representa naturalmente a relação marcada pela preposição ל.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta o Tetragrama; a forma Yahweh preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido da fórmula cultual רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador
  rationale: Mantém a metáfora de agrado ou aceitação sem introduzir a ideia mais específica de apaziguamento, que não precisa ser resolvida no texto.
- issue: Interpretação de אִשֵּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A etimologia e o uso exato do termo são discutidos. A redação principal conserva sua associação tradicional com fogo, enquanto a nota registra a alternativa lexical relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura ritual foi preservada sem arcaísmos desnecessários; “holocausto” foi mantido como termo cultual consolidado.
