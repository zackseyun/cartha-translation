    rationale: Embora haja debate lexical e “oferta de alimento” seja uma alternativa defendida, o contexto cultual e o uso tradicional permitem uma tradução principal segura associada ao fogo. A nota deve apresentar a alternativa sem uma declaração ampla de incerteza.
