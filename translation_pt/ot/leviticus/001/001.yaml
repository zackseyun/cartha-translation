id: LEV.1.1
reference: Leviticus 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: pt
  text: 'Então, Yahweh[a] chamou Moisés e falou com ele da tenda do encontro, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino יהוה (YHWH), aqui representado por “Yahweh”; tradicionalmente, esse nome é substituído por “SENHOR”.
    reason: Esclarecer a forma do nome divino e a convenção tradicional de substituí-lo por um título.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: O verbo קרא introduz aqui a fala divina dirigida a Moisés. “Chamou” é natural em português e não acrescenta a ideia mais forte de convocação formal.
- source_word: אֶל־מֹשֶׁה
  choice: Moisés
  rationale: Com o verbo “chamar”, o português emprega naturalmente o objeto direto; a relação expressa por אֶל permanece clara sem uma preposição artificial.
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: Preserva a ideia de comunicação verbal formal e mantém distinção em relação a לֵאמֹר, traduzido por “dizendo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo silenciosamente por um título.
- source_word: אֵלָיו
  choice: com ele
  rationale: Em português, “falou com ele” expressa de modo natural que Yahweh dirigiu sua fala a Moisés.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: da tenda do encontro
  rationale: Reproduz de modo claro o nome do santuário como lugar do encontro designado, sem introduzir o termo tradicional “tabernáculo”, ausente da expressão hebraica.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula hebraica que introduz o conteúdo da fala, apresentado no versículo seguinte.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz a narrativa avançar a partir do final de Êxodo; “Então” comunica essa sequência naturalmente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o tetragrama, nome próprio do Deus de Israel. “Yahweh” preserva esse nome; a nota registra a convenção tradicional “SENHOR” sem inseri-la no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem soar rígida; os dois verbos de fala foram preservados.
