  text: וְ/הֵסִ֥יר אֶת מֻרְאָת֖/וֹ בְּ/נֹצָתָ֑/הּ וְ/הִשְׁלִ֨יךְ אֹתָ֜/הּ אֵ֤צֶל הַ/מִּזְבֵּ֨חַ֙ קֵ֔דְמָ/ה אֶל מְק֖וֹם הַ/דָּֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: pt
  text: Ele retirará o papo da ave[a] com as penas[b] e o lançará ao lado do altar, a leste, no lugar das cinzas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o inglúvio da ave”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “com as suas penas”; algumas traduções entendem a expressão como “com o seu conteúdo impuro”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: Ele retirará
  rationale: O hifil de סור indica fazer com que algo seja removido. “Retirará” é natural em português e mantém o caráter prescritivo da instrução ritual.
- source_word: מֻרְאָתוֹ
  choice: o papo da ave
  rationale: Neste contexto, o substantivo designa o órgão digestivo da ave conhecido como papo ou inglúvio. “Papo” é o termo mais acessível ao leitor comum; “da ave” explicita naturalmente o referente do sufixo hebraico.
- source_word: בְּנֹצָתָהּ
  choice: com as penas
  rationale: A expressão é difícil, mas a forma consonantal se relaciona naturalmente a נוצה, “pena, plumagem”. A tradução preserva o sentido lexical mais direto sem ocultar a interpretação alternativa tradicional.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: e o lançará
  rationale: O hifil de שלך significa lançar ou atirar. O pronome masculino em português retoma “papo”, embora o pronome hebraico seja feminino por concordar com o substantivo hebraico.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: ao lado do altar
  rationale: אצל indica proximidade lateral. “Ao lado do altar” comunica com precisão a localização prescrita.
- source_word: קֵדְמָה
  choice: a leste
  rationale: O advérbio direcional indica o lado oriental. “A leste” é conciso e natural em português.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: no lugar das cinzas
  rationale: Em contexto sacrificial, דשן pode designar as cinzas gordurosas do altar. “Lugar das cinzas” preserva a formulação espacial do hebraico sem acrescentar uma especificação incerta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta de instrução ritual. “Papo” favorece a compreensão comum, enquanto a nota registra o termo anatômico “inglúvio”. A ambiguidade de בְּנֹצָתָהּ é mantida em nota, sem substituir a leitura lexical mais direta no texto.
