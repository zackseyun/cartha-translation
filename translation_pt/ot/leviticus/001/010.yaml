id: LEV.1.10
reference: Leviticus 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: pt
  text: E, se a sua oferta for do rebanho, das ovelhas ou das cabras, para holocausto,[a] oferecerá um macho sem defeito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como holocausto”.'
    reason: lexical_alternative
  - marker: b
    text: “Sem defeito” significa livre de defeito físico, condição exigida para este sacrifício.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Introduz o próximo caso condicional e preserva tanto a conexão de וְ quanto a condição expressa por אִם.
- source_word: מִן הַצֹּאן
  choice: do rebanho
  rationale: צֹאן é um termo coletivo para animais domésticos de pequeno porte, sobretudo ovelhas e cabras; o contexto especifica essas duas categorias em seguida.
- source_word: קָרְבָּנוֹ
  choice: a sua oferta
  rationale: קָרְבָּן designa aquilo que é apresentado no culto; “oferta” é claro, corrente e adequado ao contexto sacrificial.
- source_word: מִן הַכְּשָׂבִים
  choice: das ovelhas
  rationale: כְּשָׂבִים refere-se à espécie ovina sem exigir aqui uma restrição de idade; “ovelhas” mantém o contraste com cabras.
- source_word: אוֹ מִן הָעִזִּים
  choice: ou das cabras
  rationale: עִזִּים é o plural comum para caprinos; “cabras” é a forma coletiva natural em português.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה é o termo sacrificial consagrado para a oferta inteiramente queimada. “Holocausto” é a designação bíblica tradicional e concisa em português, sem explicação teológica adicional.
- source_word: זָכָר
  choice: um macho
  rationale: Preserva a exigência explícita quanto ao sexo do animal.
- source_word: תָּמִים
  choice: sem defeito
  rationale: No contexto sacrificial, תָּמִים indica um animal livre de defeito físico; a expressão é clara e natural em português atual.
- source_word: יַקְרִיבֶנּוּ
  choice: oferecerá
  rationale: O hifil de קרב, no contexto sacrificial, significa apresentar ou oferecer. O objeto é expresso pela locução “um macho sem defeito”, tornando desnecessário repetir um pronome.
theological_decisions:
- issue: Tradução do termo sacrificial עֹלָה
  choice: holocausto
  alternative: oferta queimada; oferta de ascensão
  rationale: “Holocausto” identifica de modo reconhecível a categoria levítica da oferta totalmente queimada. A alternativa etimológica “oferta de ascensão” é possível, mas pouco transparente ao leitor comum.
- issue: Exigência do sexo do animal
  choice: um macho
  alternative: animal macho
  rationale: O hebraico especifica expressamente o sexo do animal; a tradução mantém essa informação sem generalizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a estrutura condicional e a terminologia sacrificial, evitando tanto arcaísmo sintático quanto paráfrase explicativa no corpo do versículo.
