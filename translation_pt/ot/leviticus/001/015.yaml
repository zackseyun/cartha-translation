  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרִיב֤/וֹ הַ/כֹּהֵן֙ אֶל הַ/מִּזְבֵּ֔חַ וּ/מָלַק֙ אֶת רֹאשׁ֔/וֹ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/נִמְצָ֣ה דָמ֔/וֹ עַ֖ל קִ֥יר הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: pt
  text: O sacerdote levará a ave ao altar, lhe romperá a cabeça[a] e a queimará sobre o altar; o sangue dela será espremido contra a lateral do altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe arrancará a cabeça”. O verbo hebraico é um termo técnico para a ação com que o sacerdote matava uma ave oferecida em sacrifício.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “contra a parede do altar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: levará a ave
  rationale: O hifil de קרב indica fazer chegar perto ou apresentar. Com אֶל הַמִּזְבֵּחַ, “levará a ave ao altar” expressa de modo natural o movimento concreto; “a ave” explicita em português o referente pronominal vindo do contexto.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כֹּהֵן no contexto do culto sacrificial.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: ao altar
  rationale: אֶל marca movimento em direção ao destino; “ao altar” é direto e idiomático.
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: lhe torcerá a cabeça
  rationale: מלק é um termo técnico para matar ritualmente uma ave mediante ação exercida na região da cabeça ou do pescoço. “Torcerá” comunica a ação física sem introduzir no texto principal uma explicação excessivamente específica; a nota preserva alternativas lexicais.
- source_word: וְהִקְטִיר
  choice: e a queimará
  rationale: No uso sacrificial, קטר descreve queimar sobre o altar, fazendo a oferta subir em fumaça. O pronome feminino mantém a referência à ave e também não elimina totalmente a possível proximidade sintática com “cabeça”.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Neste contexto ritual, a forma direcional é expressa naturalmente em português por “sobre o altar”, local onde se realiza a queima.
- source_word: וְנִמְצָה דָמוֹ
  choice: o sangue dela será espremido
  rationale: O nifal de מצה descreve o sangue sendo extraído por pressão. “Será espremido” preserva tanto a voz passiva quanto o modo físico da ação, mais precisamente que o simples “será derramado”.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: contra a lateral do altar
  rationale: קִיר significa literalmente “parede”, mas “lateral do altar” é mais natural para uma estrutura desse tipo; “contra” comunica o contato indicado por עַל neste contexto.
theological_decisions:
- issue: Se מלק exige afirmar que a cabeça era completamente arrancada
  choice: lhe torcerá a cabeça
  alternative: lhe arrancará a cabeça
  rationale: O verbo é técnico e raro, e Levítico 5:8 distingue um procedimento em que a cabeça não devia ser completamente separada. A tradução evita resolver além do necessário a mecânica exata do rito, enquanto a nota registra a alternativa.
- issue: Objeto implícito de וְהִקְטִיר
  choice: e a queimará
  alternative: e queimará a cabeça
  rationale: O hebraico não repete um objeto explícito. O pronome feminino português pode retomar a ave no contexto e evita inserir a interpretação mais restrita de que somente a cabeça é o objeto da queima.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe adequada à legislação ritual. “Ave” torna explícito o referente exigido pelo contexto, “lhe torcerá a cabeça” evita uma formulação arcaica como “destroncará”, e as notas preservam a literalidade e a incerteza técnica do hebraico.
