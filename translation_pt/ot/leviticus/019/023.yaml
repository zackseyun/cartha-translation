base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: pt
  text: Quando vocês entrarem na terra e plantarem qualquer árvore frutífera, considerem incircunciso o fruto dela.[a] Durante três anos, o fruto será incircunciso para vocês; não deverá ser comido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “incircunciso”. O termo é empregado metaforicamente para indicar que, durante os três primeiros anos, não é permitido comer o fruto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל־הָאָרֶץ
  choice: Quando vocês entrarem na terra
  rationale: Em contexto legal, וְכִי introduz uma circunstância futura. “Entrarem na terra” expressa naturalmente בוא + אֶל sem especificar “Canaã”, ausente neste versículo.
- source_word: וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל
  choice: e plantarem qualquer árvore frutífera
  rationale: A expressão designa árvores destinadas a produzir alimento; “qualquer árvore frutífera” é idiomático e conserva o valor distributivo de כָּל.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ
  choice: considerem incircunciso o seu fruto
  rationale: A construção atribui metaforicamente ao fruto a condição de incircunciso. “Considerem” comunica o estatuto legal sem transformar a imagem em ação física.
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: Durante três anos, ele será incircunciso para vocês
  rationale: Mantém a repetição da raiz ערל e a expressão relacional לָכֶם. O singular “ele” retoma coletivamente “fruto”, apesar da oscilação de número no hebraico.
- source_word: לֹא יֵאָכֵל
  choice: não deverá ser comido
  rationale: Preserva a formulação passiva do nifal e expressa a força proibitiva da instrução.
theological_decisions:
- issue: Preservar ou explicar no texto principal a metáfora do fruto “incircunciso”
  choice: Preservar “incircunciso” no texto principal
  alternative: Traduzir como “proibido” ou “impróprio”
  rationale: O hebraico emprega deliberadamente ערל/ערלה, linguagem associada à incircuncisão, para caracterizar o fruto nos três primeiros anos. Substituí-la por “proibido” transmitiria o efeito jurídico, mas eliminaria a imagem; uma nota esclarece sua função.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A metáfora incomum foi mantida por transparência ao hebraico e esclarecida em nota.
