id: LEV.19.14
reference: Leviticus 19:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: pt
  text: 'Não amaldiçoe um homem surdo[a], nem ponha obstáculo diante de um homem cego; mas tema o seu Deus: Eu sou Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma pessoa surda” e “uma pessoa cega”. O hebraico usa formas masculinas singulares como exemplos jurídicos representativos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְקַלֵּל
  choice: amaldiçoe
  rationale: No piel, קלל pode significar amaldiçoar ou tratar com desprezo. “Amaldiçoar” preserva de modo direto a força verbal e moral da proibição.
- source_word: חֵרֵשׁ
  choice: um homem surdo
  rationale: O hebraico emprega uma forma masculina singular como exemplo jurídico representativo; a tradução conserva essa forma.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém o sentido espacial da expressão e soa natural neste contexto legal.
- source_word: עִוֵּר
  choice: um homem cego
  rationale: A forma masculina singular é preservada como caso representativo na instrução legal.
- source_word: תִתֵּן
  choice: ponha
  rationale: Embora נתן signifique literalmente “dar”, “pôr” é a construção idiomática em português com “pedra de tropeço”.
- source_word: מִכְשֹׁל
  choice: uma pedra de tropeço
  rationale: Preserva a imagem concreta de algo que faz tropeçar e também sua ressonância ética mais ampla.
- source_word: וְיָרֵאתָ
  choice: mas tema
  rationale: 'O waw introduz aqui a motivação contrastiva: ainda que o abuso possa escapar à percepção humana, deve-se temer a Deus. “Mas” expressa essa função discursiva sem alterar o conteúdo.'
- source_word: מֵאֱלֹהֶיךָ
  choice: o seu Deus
  rationale: Com ירא, a preposição מן marca idiomaticamente o objeto do temor; em português, a forma natural é “temer o seu Deus”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Formas masculinas representativas na legislação
  choice: Conservar os exemplos masculinos singulares (“um homem surdo”, “um homem cego”)
  alternative: “uma pessoa surda”, “uma pessoa cega” ou “os surdos”, “os cegos”
  rationale: O hebraico usa formas masculinas singulares em casos jurídicos representativos. A tradução preserva a forma textual, enquanto a nota esclarece seu caráter representativo.
- issue: Força da cláusula final de motivação
  choice: “mas tema o seu Deus”
  alternative: “e tema o seu Deus”
  rationale: A cláusula fundamenta as proibições na reverência a Deus, diante de quem abusos ocultos contra pessoas vulneráveis não ficam encobertos. “Mas” comunica o contraste contextual possível no waw.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no singular coerentes com o destinatário singular hebraico. “Pedra de tropeço” conserva a imagem bíblica concreta; “Yahweh” preserva o nome divino.
