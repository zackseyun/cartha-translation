source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a slave woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: pt
  text: Se um homem se deitar com uma mulher e houver emissão de sêmen, e ela for uma escrava destinada a um homem[a], mas não tiver sido resgatada nem lhe tiver sido dada liberdade, haverá uma apuração[b]. Eles não serão mortos, porque ela não foi libertada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prometida a um homem” ou “noiva de um homem”. O termo hebraico provavelmente indica que a escrava havia sido destinada ou prometida a um homem, embora sua condição jurídica não fosse a de uma esposa livre.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “apuração” é raro e de sentido incerto; também pode significar “punição” ou “compensação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o referente masculino singular próprio da formulação jurídica casuística.
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: se deitar com uma mulher e houver emissão de sêmen
  rationale: Expressa tanto a relação sexual indicada pelo idioma quanto a referência explícita à emissão de sêmen, relevante para a precisão jurídica do texto.
- source_word: שִׁפְחָה
  choice: escrava
  rationale: Preserva claramente a condição de escravidão, essencial para a distinção jurídica estabelecida pelo versículo.
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: designada a um homem
  rationale: O particípio é raro e difícil; esta formulação comunica uma vinculação ou promessa sem afirmar de modo indevido que se tratava de um noivado pleno entre pessoas livres.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: ainda não tiver sido resgatada
  rationale: Transmite a libertação mediante resgate no contexto jurídico-econômico; 'ainda' representa naturalmente a ênfase da construção hebraica.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: nem tiver recebido a liberdade
  rationale: Formulação natural em português que conserva o sentido jurídico de concessão da liberdade.
- source_word: בִּקֹּרֶת
  choice: apuração
  rationale: O substantivo é raro e de sentido incerto. 'Apuração' preserva a possibilidade de exame oficial sem impor uma pena específica.
- source_word: לֹא יוּמְתוּ
  choice: eles não serão mortos
  rationale: Conserva o plural e o sentido judicial passivo da forma hebraica.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: porque ela ainda não havia sido libertada
  rationale: Relaciona explicitamente a razão apresentada à permanência da mulher na condição de escrava.
theological_decisions:
- issue: Condição jurídica expressa por נֶחֱרֶפֶת לְאִישׁ
  choice: designada a um homem
  alternative: noiva de um homem; prometida a um homem
  rationale: A mulher permanece escrava, não resgatada e não liberta. A tradução evita equiparar sem ressalvas sua condição à de uma mulher livre formalmente noiva, mas mantém a vinculação indicada pelo texto.
- issue: Sentido de בִּקֹּרֶת
  choice: haverá uma apuração
  alternative: haverá punição; haverá compensação
  rationale: Como o termo é raro e discutido, o texto principal adota uma opção não excessivamente específica e a nota conserva as principais alternativas, sem resolver artificialmente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém a especificidade corporal e jurídica do hebraico, explicando em notas as duas expressões de maior incerteza lexical.
