  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: pt
  text: O estrangeiro residente que vive com vocês será tratado como um natural da terra entre vocês[a]. Ame-o como a si mesmo, pois vocês foram estrangeiros residentes na terra do Egito. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um nativo entre vocês”. O termo hebraico se refere a alguém natural da terra, em contraste com o estrangeiro residente.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: como um natural da terra entre vocês
  rationale: אֶזְרָח designa o habitante nativo ou membro natural da comunidade; a formulação preserva a comparação introduzida por כְּ e evita o anacronismo de “cidadão”.
- source_word: הַגֵּר
  choice: o estrangeiro residente
  rationale: גֵּר refere-se aqui a um não israelita que vive de modo estável entre Israel, não meramente a um visitante. “Estrangeiro residente” comunica essa condição social e jurídica em português atual.
- source_word: הַגָּר אִתְּכֶם
  choice: que vive com vocês
  rationale: O particípio indica residência entre a comunidade. Uma repetição cognata como “o residente que reside” seria pouco natural em português; a relação lexical é preservada pelo contexto.
- source_word: יִהְיֶה לָכֶם
  choice: será tratado
  rationale: A construção determina como a comunidade deve considerar e receber o estrangeiro. A explicitação de “tratado” comunica naturalmente essa força normativa.
- source_word: וְאָהַבְתָּ לוֹ
  choice: Ame-o
  rationale: Embora a forma hebraica possa ser vertida literalmente por “e você o amará”, no contexto legal ela expressa uma ordem. O imperativo português conserva essa força e o destinatário singular coletivo.
- source_word: כָּמוֹךָ
  choice: como a si mesmo
  rationale: Expressão idiomática que mantém a ligação verbal e temática com Levítico 19:18.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: pois vocês foram estrangeiros residentes
  rationale: A repetição de “estrangeiros residentes” mantém a conexão lexical com הַגֵּר e fundamenta a ordem na experiência histórica de Israel.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Preserva a expressão bíblica completa e sua ressonância histórico-covenantal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Reproduz com clareza a fórmula de aliança ligada ao nome divino e concorda com o plural do sufixo hebraico.
theological_decisions:
- issue: Sentido de גֵּר no contexto jurídico e ético
  choice: estrangeiro residente
  alternative: forasteiro; estrangeiro; imigrante
  rationale: O termo indica um não nativo estabelecido entre Israel e abrangido pelas proteções da comunidade. “Estrangeiro residente” preserva essa nuance sem equipará-lo diretamente a categorias migratórias modernas.
- issue: Forma de tratamento exigida por יִהְיֶה לָכֶם כְּאֶזְרָח
  choice: será tratado como um natural da terra
  alternative: será para vocês como um natural da terra
  rationale: A tradução explicita a dimensão normativa implícita na construção hebraica, sem acrescentar uma condição jurídica moderna específica.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta o Tetragrama como nome pessoal; “Yahweh” o conserva por transliteração, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “vocês” para o destinatário coletivo. “Estrangeiro residente” é mais preciso que “forasteiro”, enquanto “natural da terra” evita o anacronismo político de “cidadão”. O imperativo “Ame-o” comunica de modo natural a força prescritiva do hebraico.
