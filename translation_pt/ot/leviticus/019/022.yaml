revisions:
- from: E o sacerdote fará expiação por ele diante de Yahweh, com o carneiro da oferta pela culpa[a], por causa do pecado que ele cometeu; e ele será perdoado pelo pecado que cometeu.
  to: E o sacerdote fará expiação por ele diante de Yahweh, com o carneiro da oferta pela culpa[a], pelo pecado que ele cometeu; e lhe será perdoado o pecado que cometeu.
  rationale: A revisão elimina uma ambiguidade sintática em português na cláusula final, mantendo o agente divino implícito e a estrutura passiva do hebraico. Também substitui "por causa do" por "pelo" na referência à expiação, para uma correspondência mais direta e natural, sem alterar o sentido.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a sequência e os elementos centrais do hebraico: a expiação realizada pelo sacerdote, o carneiro da oferta de אָשָׁם, a realização diante de Yahweh, o pecado cometido e a declaração de perdão. A nota lexical para אָשָׁם é pertinente e não resolve indevidamente a amplitude do termo.'
  naturalness: A formulação "ele será perdoado pelo pecado" é ambígua e pouco natural em português atual, pois "pelo pecado" pode ser entendido como causa do perdão. "Lhe será perdoado o pecado" é idiomático, conserva a voz passiva e exprime com maior precisão a fórmula hebraica. "Por causa do pecado" é possível, mas "pelo pecado" é mais conciso e corresponde melhor à relação cultual expressa no texto.
  terminology: '"Sacerdote", "expiação", "carneiro", "oferta pela culpa" e "Yahweh" são escolhas adequadas ao registro cultual e à orientação para o Tetragrama. A alternativa "oferta de reparação" na nota representa bem o aspecto reparador de אָשָׁם.'
  issues:
  - severity: medium
    issue: '"e ele será perdoado pelo pecado que cometeu"'
    rationale: Em português, a preposição "pelo" após "ser perdoado" pode sugerir que o pecado é o motivo pelo qual a pessoa é perdoada, e não aquilo que é perdoado. A construção "lhe será perdoado o pecado" comunica sem ambiguidade o sentido da fórmula hebraica וְנִסְלַח לוֹ מֵחַטָּאתוֹ.
  - severity: low
    issue: '"por causa do pecado"'
    rationale: A expressão é semanticamente aceitável, mas é mais causal do que a formulação cultual direta do hebraico. "Pelo pecado" mantém melhor a concisão e a relação da expiação com a falta.
  revised_text: E o sacerdote fará expiação por ele diante de Yahweh, com o carneiro da oferta pela culpa[a], pelo pecado que ele cometeu; e lhe será perdoado o pecado que cometeu.
