  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: pt
  text: E o sacerdote fará expiação por ele diante de Yahweh, com o carneiro da oferta pela culpa[a], pelo pecado que ele cometeu; e lhe será perdoado o pecado que cometeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de reparação”. O termo hebraico אָשָׁם pode indicar tanto a culpa quanto o aspecto compensatório ou reparador desse sacrifício.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: fará expiação
  rationale: Em contexto sacerdotal e sacrificial, כפר designa o ato ritual de efetuar expiação em favor de alguém. A expressão é corrente, digna e preserva o sentido cultual.
- source_word: עָלָיו
  choice: por ele
  rationale: Com כפר, a preposição על indica aqui a pessoa em cujo favor se realiza a expiação.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão para o agente cultual, preservando o artigo definido.
- source_word: בְּאֵיל הָאָשָׁם
  choice: com o carneiro da oferta pela culpa
  rationale: איל significa especificamente 'carneiro', e o beth tem valor instrumental. אָשָׁם denomina uma oferta relacionada tanto à culpa quanto à reparação; a alternativa é registrada em nota.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a linguagem espacial e cultual de לפני e translitera o nome divino indicado pelo Tetragrama.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: por causa do pecado que ele cometeu
  rationale: Expressa a relação da expiação com a transgressão e verte naturalmente a construção cognata hebraica sem eliminar sua referência explícita ao pecado cometido.
- source_word: וְנִסְלַח לוֹ
  choice: e ele será perdoado
  rationale: O nifal de סלח exprime perdão em voz passiva. A formulação mantém implícito o agente divino, como no hebraico.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: pelo pecado que cometeu
  rationale: Embora מן tenha sentido básico de origem ou afastamento, nesta fórmula de perdão o português idiomático pede 'perdoado pelo pecado'; evita-se a forma artificial 'perdoado do pecado'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. 'Yahweh' preserva o nome pactual e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido sacrificial de אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: O termo abrange culpa e dimensão reparadora. A tradução principal usa a designação mais reconhecível, enquanto a nota conserva a alternativa lexical legítima.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A coordenação hebraica foi preservada, com ponto e vírgula para tornar nítida a passagem da expiação ao perdão. A repetição de 'pecado que cometeu' foi mantida por corresponder à ênfase do original.
