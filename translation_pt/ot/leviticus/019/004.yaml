id: LEV.19.4
reference: Leviticus 19:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: pt
  text: Não se voltem para os ídolos[a] nem façam para vocês deuses de metal fundido[b]. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolos inúteis”; o termo hebraico pode ter sentido depreciativo.
    reason: lexical_alternative
  - marker: b
    text: Ou “deuses fundidos” ou “ídolos de metal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: se voltem
  rationale: Preserva o sentido básico de פנה com אֶל, isto é, voltar-se ou dirigir-se para algo, sem restringir a proibição ao ato explícito de adoração.
- source_word: אֱלִילִים
  choice: ídolos
  rationale: É a tradução portuguesa mais clara e corrente; a possível nuance depreciativa de inutilidade é registrada em nota.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: deuses de metal fundido
  rationale: Mantém o plural 'deuses' e torna explícito que se trata de imagens metálicas produzidas por fundição.
- source_word: תַעֲשׂוּ לָכֶם
  choice: façam para vocês
  rationale: 'Expressa naturalmente o valor benefactivo de לָכֶם: fabricar algo para uso ou posse próprios.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Embora אֱלֹהִים tenha forma plural, aqui designa o único Deus de Israel na fórmula da aliança; o artigo produz uma formulação portuguesa natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o tetragrama; 'Yahweh' conserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Se o ato de voltar-se aos ídolos deve ser explicitado como adoração
  choice: Não se voltem para os ídolos
  alternative: Não adorem os ídolos
  rationale: פנה não significa por si só 'adorar'. A tradução mantém a abrangência e a tensão do original, que pode envolver atenção, recurso, lealdade ou culto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' corresponde ao destinatário coletivo do hebraico. A redação evita o pouco natural 'voltai-vos' e preserva a estrutura paralela das duas proibições.
