  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: pt
  text: Não façam cortes na própria carne por causa de um morto[a], nem façam em vocês mesmos uma marca de tatuagem[b]. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por uma pessoa morta”. A expressão hebraica é idiomática e normalmente se refere a uma prática de luto pelos mortos.
    reason: lexical_alternative
  - marker: b
    text: Ou “marca gravada” ou “tatuagem”. A expressão hebraica é rara e provavelmente designa uma marca permanente no corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: cortes
  rationale: O substantivo designa corte ou incisão no corpo. “Cortes” é natural em português e não especifica indevidamente o instrumento nem a gravidade.
- source_word: לָנֶפֶשׁ
  choice: por causa de um morto
  rationale: Neste contexto legal e ritual, נֶפֶשׁ refere-se provavelmente a uma pessoa morta, e a expressão indica uma prática relacionada ao luto.
- source_word: בִּבְשַׂרְכֶם
  choice: na própria carne
  rationale: Preserva a linguagem corporal concreta de בָּשָׂר e expressa naturalmente em português que os cortes seriam feitos no corpo dos próprios destinatários.
- source_word: כְתֹבֶת קַעֲקַע
  choice: marca de tatuagem
  rationale: A expressão rara parece indicar uma inscrição ou marca permanente feita no corpo. A tradução comunica o referente provável sem tratar os dois substantivos como duas ações distintas.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: nem façam em vocês
  rationale: Neste contexto, נתן com ב expressa aplicar ou produzir uma marca no corpo. A formulação é direta e natural em português.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Mantém o nome divino como nome próprio e preserva a fórmula de autoidentificação do texto hebraico.
theological_decisions:
- issue: Alcance da proibição referente às marcas corporais
  choice: Traduzir diretamente a proibição dos cortes relacionados a um morto e da marca de tatuagem, sem definir sua aplicação posterior
  alternative: Restringir ambas as proibições exclusivamente a ritos pagãos de luto, ou apresentar o versículo como proibição explícita de toda tatuagem em qualquer cultura
  rationale: O hebraico liga expressamente a primeira prática a um morto, mas não repete essa qualificação na segunda. A tradução preserva essa estrutura e não amplia nem restringe silenciosamente o alcance do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Carne” preserva a concretude do hebraico; “marca de tatuagem” mantém a cautela exigida pela raridade da expressão original.
