base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: pt
  text: Deverá ser comido no dia em que vocês oferecerem o sacrifício e no dia seguinte; mas o que restar até o terceiro dia deverá ser queimado no fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: no dia em que vocês oferecerem o sacrifício
  rationale: A construção temporal é expressa de modo natural em português, e o substantivo verbal זֶבַח é apresentado no contexto do ato de oferecer o sacrifício, sem restringir indevidamente seu sentido cultual.
- source_word: יֵאָכֵל
  choice: deverá ser comido
  rationale: O nifal imperfeito é passivo e, no contexto legal, comunica uma determinação, não mera possibilidade.
- source_word: וּמִמָּחֳרָת
  choice: e no dia seguinte
  rationale: מָחֳרָת indica o dia posterior; esta formulação é clara e corrente em português, enquanto evita o arcaísmo «no dia de amanhã».
- source_word: וְהַנּוֹתָר
  choice: mas o que restar
  rationale: O particípio designa a porção que fica; «mas» explicita naturalmente o contraste entre o período permitido para comer e a ordem relativa ao restante.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: até o terceiro dia
  rationale: Preserva diretamente o limite temporal indicado por עַד, sem decidir além do que a expressão hebraica afirma.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: deverá ser queimado no fogo
  rationale: Mantém a voz passiva e o caráter prescritivo do texto, bem como a imagem concreta do fogo.
