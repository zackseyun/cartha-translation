translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural «vocês» torna explícito o sufixo de segunda pessoa plural. A redação conserva o paralelismo jurídico entre «deverá ser comido» e «deverá ser queimado».
