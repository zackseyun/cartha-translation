source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: pt
  text: Tenham balanças justas[a], pesos justos, um efa justo[b] e um him justo[c]. Eu sou Yahweh, o Deus de vocês, que os tirei da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “balanças honestas, pesos honestos”; a palavra hebraica repetida é צֶדֶק, muitas vezes traduzida como “justiça” ou “retidão”, aqui aplicada a pesos e medidas comerciais.
    reason: lexical_alternative
  - marker: b
    text: O efa era uma antiga unidade de capacidade usada para produtos secos.
    reason: cultural_note
  - marker: c
    text: O him era uma antiga unidade de capacidade usada para líquidos.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: balanças honestas
  rationale: מֹאזְנַיִם designa balanças usadas para pesar, e צֶדֶק, neste contexto comercial, exige conformidade com o que é justo. “Honestas” comunica com naturalidade a dimensão ética sem reduzir a expressão à mera precisão técnica.
- source_word: אַבְנֵי צֶדֶק
  choice: pesos honestos
  rationale: אַבְנֵי significa literalmente “pedras”, mas aqui se refere às pedras padronizadas usadas como pesos. A tradução explicita o referente e mantém o valor ético do repetido צֶדֶק.
- source_word: אֵיפַת צֶדֶק
  choice: um efa honesto
  rationale: אֵיפָה é uma antiga unidade de capacidade para produtos secos. A forma portuguesa “efa” preserva a especificidade histórica, enquanto “honesto” mantém a repetição e a exigência de justiça nas medições.
- source_word: וְהִין צֶדֶק
  choice: e um him honesto
  rationale: הִין é uma antiga unidade de capacidade para líquidos. A transliteração tradicional portuguesa “him” preserva a unidade antiga, e “honesto” expressa o uso comercial justo.
- source_word: יִהְיֶה לָכֶם
  choice: Tenham
  rationale: A expressão significa literalmente “haverá para vocês” ou “será de vocês”; no contexto legal, o imperativo “Tenham” transmite de modo claro e natural a obrigação dirigida à comunidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado em vez de ser substituído por um título, preservando sua função de nome pessoal no texto hebraico.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Na fórmula da aliança, אֱלֹהֵיכֶם tem sentido singular. “De vocês” torna explícito o referente plural do sufixo hebraico e possui ampla legibilidade no português moderno.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: que os tirei da terra do Egito
  rationale: A tradução conserva a primeira pessoa da fórmula do êxodo e apresenta o ato libertador como fundamento da ordem dada.
theological_decisions:
- issue: Sentido do repetido צֶדֶק no contexto de comércio
  choice: honesto
  alternative: justo; exato
  rationale: “Justo” refletiria mais diretamente a amplitude lexical de צֶדֶק, mas aplicado quatro vezes a instrumentos e unidades soa menos natural em português corrente. “Honesto” preserva a exigência moral de integridade comercial; a nota registra a alternativa sem apagar o vínculo com justiça.
- issue: Tratamento das antigas unidades de medida
  choice: manter “efa” e “him”
  alternative: medida para secos; medida para líquidos; conversões modernas aproximadas
  rationale: As unidades específicas são preservadas para evitar equivalências modernas imprecisas. Notas breves fornecem a informação cultural necessária.
- issue: Fundamentação da ordem na identidade e no ato de Yahweh
  choice: preservar a fórmula em primeira pessoa
  alternative: reformular em terceira pessoa
  rationale: “Eu sou Yahweh... que os tirei” mantém a voz direta de Deus e a ligação teológica entre a ética comunitária, a aliança e a libertação do Egito.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Tenham” oferece uma formulação direta para a norma comunitária. A repetição de “honesto” reproduz deliberadamente a cadência ética do hebraico. Empregam-se as formas tradicionais portuguesas “efa” e “him”, explicadas em notas.
