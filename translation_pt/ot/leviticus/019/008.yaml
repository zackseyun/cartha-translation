id: LEV.19.8
reference: Leviticus 19:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: pt
  text: Quem o comer carregará sua culpa[a], porque profanou o que é santo para Yahweh[b]; e essa pessoa[c] será eliminada do meio do seu povo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carregará sua iniquidade”. O idioma hebraico pode abranger tanto a culpa quanto as consequências dela.'
    reason: lexical_alternative
  - marker: b
    text: “O que é santo para Yahweh” refere-se ao que foi consagrado a Yahweh; neste contexto, à carne do sacrifício.
    reason: cultural_note
  - marker: c
    text: Literalmente, “essa alma”. Em linguagem jurídica hebraica, “alma” designa aqui a pessoa.
    reason: lexical_alternative
  - marker: d
    text: “Será eliminada” traduz uma fórmula penal da aliança. Neste versículo, o texto não especifica se isso significa morte, expulsão da comunidade ou juízo divino direto.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: Quem o comer
  rationale: O particípio com sufixo pronominal designa qualquer pessoa que coma a carne sacrificial mencionada no contexto anterior. A formulação mantém a referência genérica e é natural em português.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: carregará sua culpa
  rationale: O idioma hebraico abrange tanto a culpabilidade pelo pecado quanto as consequências decorrentes dela. A tradução conserva a imagem de carregar sem restringi-la apenas à punição.
- source_word: כִּי
  choice: porque
  rationale: Introduz diretamente a razão da responsabilidade e da penalidade.
- source_word: קֹדֶשׁ יְהוָה
  choice: o que é santo para Yahweh
  rationale: A expressão indica algo consagrado a Yahweh — no contexto, a carne sacrificial — sem acrescentar ao texto deste versículo o substantivo específico 'oferta'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o do título 'Senhor'.
- source_word: חִלֵּל
  choice: profanou
  rationale: O piel de חלל descreve tratar como comum aquilo que é santo. 'Profanou' preserva esse contraste cultual em linguagem corrente e digna.
- source_word: וְנִכְרְתָה
  choice: será eliminada
  rationale: Expressa a fórmula penal da aliança em português natural, sem definir no corpo do texto se a eliminação ocorre por morte, expulsão ou juízo divino direto.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: essa pessoa
  rationale: Embora נֶפֶשׁ possa ser traduzido literalmente por 'alma', aqui funciona como termo jurídico para a pessoa inteira.
- source_word: מֵעַמֶּיהָ
  choice: do meio do seu povo
  rationale: Mantém a relação comunitária indicada pelo hebraico. O sufixo feminino concorda gramaticalmente com נֶפֶשׁ, mas refere-se à pessoa infratora de modo genérico.
theological_decisions:
- issue: Sentido da fórmula penal וְנִכְרְתָה, 'ser eliminada/cortada'
  choice: Manter uma fórmula ampla — 'será eliminada do meio do seu povo' — sem especificar o modo da penalidade.
  alternative: Será executada; será expulsa da comunidade; será removida por juízo divino.
  rationale: O versículo não esclarece se a penalidade é morte, exclusão comunitária ou intervenção divina. A tradução preserva essa tensão jurídica e teológica, e a nota explicita a amplitude interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem da frase acompanha o encadeamento causal do hebraico. Preservam-se a imagem de 'carregar' a culpa, o caráter consagrado do objeto e a indefinição deliberada da fórmula penal.
