  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: pt
  text: E no quinto ano vocês poderão comer o fruto dessas árvores, para que a produção delas aumente para vocês. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: E no quinto ano
  rationale: A conjunção וּ dá continuidade à sequência legal dos versículos anteriores; em português, “E no quinto ano” preserva esse encadeamento com naturalidade.
- source_word: תֹּאכְלוּ
  choice: vocês poderão comer
  rationale: O imperfeito na sequência jurídica comunica permissão após a proibição anterior. “Poderão comer” expressa essa força permissiva em português corrente.
- source_word: אֶת־פִּרְיוֹ
  choice: o fruto dessas árvores
  rationale: פְּרִי significa “fruto”. Embora o hebraico use singular com sufixo (“seu fruto”), o referente coletivo contextual são as árvores frutíferas; a explicitação no plural evita em português a ambiguidade de “seu” sem alterar o sentido.
- source_word: לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: para que elas aumentem a produção para vocês
  rationale: O infinitivo com לְ apresenta finalidade ou resultado. A formulação mantém a ligação textual entre a observância da instrução e o aumento da produção, sem tentar explicar o mecanismo.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Eu sou Yahweh, o Deus de vocês
  rationale: Preserva o nome divino expresso no hebraico e a fórmula solene de autoidentificação. “O Deus de vocês” é claro, digno e natural para leitores modernos.
theological_decisions:
- issue: Sentido da promessa ou finalidade em לְהוֹסִיף
  choice: para que elas aumentem a produção para vocês
  alternative: para aumentar para vocês a produção delas
  rationale: O hebraico permite perceber a construção como finalidade ou resultado, e há alguma abertura quanto ao agente implícito do aumento. A tradução conserva a relação final/resultativa e não introduz uma explicação teológica ausente do texto.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. O uso de “vocês” corresponde ao plural hebraico e evita a ambiguidade possessiva de “seu”. A redação permanece digna e adequada ao contexto legal.
