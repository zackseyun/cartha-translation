  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: pt
  text: Quando vocês fizerem a colheita da sua terra, não colham completamente a extremidade[a] do seu campo nem recolham as espigas caídas da sua colheita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o canto”. O termo hebraico pode indicar uma extremidade, um lado ou um canto; aqui se refere à parte externa do campo que deve ficar sem ser colhida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: Quando vocês colherem
  rationale: A preposição com o infinitivo construto introduz uma circunstância temporal; esta formulação é natural em português e mantém a segunda pessoa do plural do hebraico.
- source_word: קְצִיר אַרְצְכֶם
  choice: a safra da sua terra
  rationale: קְצִיר designa aqui a produção colhida, e אֶרֶץ se refere à terra em sentido agrícola, não a um país como entidade política.
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: não colham por completo
  rationale: O piel de כלה expressa completar ou acabar; com o infinitivo קצר, a formulação proíbe colher integralmente a parte indicada do campo.
- source_word: פְּאַת שָׂדְךָ
  choice: a extremidade do seu campo
  rationale: פאה pode significar extremidade, lado ou canto. 'Extremidade' comunica de modo claro a parte externa do campo sem restringir indevidamente o termo a um canto geométrico.
- source_word: לֶקֶט קְצִירְךָ
  choice: o que cair durante a colheita
  rationale: Neste contexto legal, לֶקֶט designa o produto disperso ou caído que poderia ser recolhido depois da passagem dos ceifeiros. A formulação é mais compreensível ao leitor comum do que o termo técnico 'rebusco'.
- source_word: לֹא תְלַקֵּט
  choice: nem recolham
  rationale: לקט significa juntar ou apanhar itens dispersos. 'Recolham' expressa naturalmente essa ação e o paralelismo negativo é bem representado por 'nem'.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e vocabulário agrícola acessível. O plural foi mantido em toda a frase para produzir uma instrução coletiva natural em português; no hebraico, a abertura está no plural e as proibições passam ao singular distributivo.
