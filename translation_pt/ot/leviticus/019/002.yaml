id: LEV.19.2
reference: Leviticus 19:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: pt
  text: 'Fale a toda a comunidade dos israelitas[a] e diga-lhes: “Sejam santos[b], porque eu, Yahweh, o Deus de vocês, sou santo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “toda a comunidade dos filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “Vocês devem ser santos” ou “Vocês serão santos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel dirige a Moisés uma ordem direta; “Fale” é natural e mantém a solenidade do discurso legal.
- source_word: כָּל עֲדַת
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade reunida de Israel. “Toda a comunidade” comunica o sentido coletivo em português atual sem excessivo tom eclesiástico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos israelitas
  rationale: Embora a forma hebraica seja literalmente “filhos de Israel”, neste contexto ela designa idiomaticamente o povo israelita em conjunto. A forma literal é preservada em nota.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Reproduz com clareza a sequência de ordens do hebraico e evita repetir “falar” de modo pouco natural.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: Sejam santos
  rationale: O adjetivo predicativo com o imperfeito de היה tem aqui força normativa. “Sejam santos” expressa naturalmente a ordem em português; as nuances de obrigação e formulação futura são registradas em nota.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: “Santo” é o equivalente estabelecido e semanticamente amplo, preservando tanto a separação quanto a qualidade moral e cultual sem reduzir o termo a “separado”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Expressa de maneira clara e amplamente compreensível o sufixo de segunda pessoa do plural e mantém a fórmula da relação de aliança.
theological_decisions:
- issue: Sentido corporativo de בְּנֵי יִשְׂרָאֵל
  choice: dos israelitas
  alternative: dos filhos de Israel
  rationale: A expressão hebraica é filial e masculina na forma, mas funciona como designação coletiva do povo. O texto principal usa o equivalente idiomático abrangente, enquanto a nota conserva a forma literal.
- issue: Força normativa de קְדֹשִׁים תִּהְיוּ
  choice: Sejam santos
  alternative: Vocês serão santos; Vocês devem ser santos
  rationale: A construção pode ser vertida como ordem direta, obrigação ou futuro de tom legal. “Sejam santos” é natural e preserva a força exortativa, sem eliminar as demais possibilidades, apresentadas em nota.
- issue: Fundamento da santidade do povo
  choice: porque eu, Yahweh, o Deus de vocês, sou santo
  alternative: pois santo sou eu, Yahweh, o Deus de vocês
  rationale: A ordem portuguesa natural conserva a ligação causal explícita entre a santidade divina e a exigência dirigida à comunidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento comunitário usa “vocês”, evitando regionalismos; “diga-lhes” preserva o tom solene. As duas notas têm marcadores correspondentes no texto principal.
