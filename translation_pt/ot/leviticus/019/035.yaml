  text: לֹא תַעֲשׂ֥וּ עָ֖וֶל בַּ/מִּשְׁפָּ֑ט בַּ/מִּדָּ֕ה בַּ/מִּשְׁקָ֖ל וּ/בַ/מְּשׂוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: pt
  text: Não cometam injustiça no julgamento, nas medidas de comprimento, no peso ou no volume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não pratiquem injustiça no julgamento, na medida, no peso ou na medida de capacidade.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: Não cometam
  rationale: O hebraico traz uma proibição na segunda pessoa do plural. A forma direta é natural no português moderno e preserva a força normativa.
- source_word: עָוֶל
  choice: injustiça
  rationale: O termo designa erro, injustiça ou fraude; “injustiça” abrange adequadamente o contexto judicial e comercial.
- source_word: בַּמִּשְׁפָּט
  choice: ao julgar
  rationale: מִשְׁפָּט pode indicar julgamento, justiça ou decisão. A expressão verbal é idiomática em português e preserva aqui o sentido judicial, sem confundi-lo com as medições seguintes.
- source_word: בַּמִּדָּה
  choice: ao medir comprimento
  rationale: מִדָּה é medida ou dimensão. Como o texto distingue peso e medida de capacidade, “comprimento” explicita de modo claro a categoria provável.
- source_word: בַּמִּשְׁקָל
  choice: peso
  rationale: מִשְׁקָל significa peso ou pesagem; “peso” é direto e adequado ao contexto comercial.
- source_word: וּבַמְּשׂוּרָה
  choice: volume
  rationale: מְשׂוּרָה designa uma medida de capacidade. “Volume” é uma expressão moderna, clara e não restringe o termo apenas a líquidos ou secos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com proibição direta no plural. A repetição hebraica da preposição foi expressa por “ao... nem ao...”, e a nota preserva uma tradução mais formal e a amplitude lexical de מִשְׁפָּט e מְשׂוּרָה.
