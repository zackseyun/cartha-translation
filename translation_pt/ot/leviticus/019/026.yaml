source:
  edition: WLC
  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: pt
  text: Não comam sobre o sangue.[a] Não pratiquem adivinhação nem interpretem presságios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com o sangue”. A expressão hebraica é difícil e pode referir-se a comer carne ainda com sangue ou a participar de uma refeição ritual relacionada ao sangue.
    reason: alternative_reading
  - marker: b
    text: O verbo hebraico também pode significar “praticar prognosticação” ou, conforme a tradução tradicional, “observar tempos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: Não comam
  rationale: O imperfeito negado, em contexto legal, expressa proibição. O imperativo negativo é claro e natural em português moderno, sem perder a força normativa.
- source_word: עַל הַדָּם
  choice: sobre o sangue
  rationale: A expressão hebraica é difícil e seu referente exato permanece incerto. A tradução relativamente formal preserva a preposição e evita decidir se a proibição trata de carne ainda com sangue ou de uma refeição ritual relacionada ao sangue.
- source_word: תְנַחֲשׁוּ
  choice: pratiquem adivinhação
  rationale: O verbo נחשׁ no piel designa uma prática divinatória. Esta formulação é atual, clara e suficientemente abrangente.
- source_word: תְעוֹנֵנוּ
  choice: interpretem presságios
  rationale: O sentido provável é a leitura de sinais ou presságios, embora a palavra seja lexicalmente incerta. A tradução comunica uma distinção plausível em relação a נחשׁ sem recorrer à formulação tradicional e obscura “observar tempos”.
theological_decisions:
- issue: Especificidade da proibição עַל הַדָּם
  choice: Manter “sobre o sangue” no texto principal
  alternative: “com o sangue”; “enquanto o sangue ainda estiver na carne”; “numa refeição ritual ligada ao sangue”
  rationale: O hebraico não identifica com segurança a prática condenada. A redação preserva essa ambiguidade genuína, enquanto a nota apresenta as principais possibilidades sem impor uma interpretação ritual ou alimentar específica.
- issue: Relação entre תְנַחֲשׁוּ e תְעוֹנֵנוּ
  choice: “pratiquem adivinhação nem interpretem presságios”
  alternative: “pratiquem adivinhação ou prognosticação”; “adivinhem nem observem tempos”
  rationale: Os dois verbos parecem nomear práticas ocultistas relacionadas, mas não necessariamente idênticas. A tradução mantém dois termos distintos e evita fundi-los em uma única proibição.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais na terceira pessoa do plural para leitura ampla no Brasil e em outros contextos lusófonos. A construção incomum “sobre o sangue” é mantida deliberadamente por fidelidade à ambiguidade do hebraico e esclarecida em nota.
