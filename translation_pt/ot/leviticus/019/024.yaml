  text: וּ/בַ/שָּׁנָה֙ הָ/רְבִיעִ֔ת יִהְיֶ֖ה כָּל פִּרְי֑/וֹ קֹ֥דֶשׁ הִלּוּלִ֖ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: pt
  text: Mas, no quarto ano, todo o seu fruto será santo[a], para louvor a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “santo, louvores a Yahweh” ou “santo, para louvor a Yahweh”. A expressão hebraica é rara e pode enfatizar o louvor festivo prestado com o fruto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה
  choice: Mas, no ... ano
  rationale: 'A conjunção ו pode assumir valor contrastivo no contexto: depois dos três anos em que o fruto não devia ser comido, o quarto ano recebe tratamento diferente; ב introduz a expressão temporal.'
- source_word: הָרְבִיעִת
  choice: quarto
  rationale: Ordinal que modifica diretamente “ano”.
- source_word: יִהְיֶה
  choice: será
  rationale: Futuro copulativo natural em português, adequado ao estilo da instrução legal.
- source_word: כָּל פִּרְיוֹ
  choice: todo o seu fruto
  rationale: כָּל com o substantivo singular e o sufixo de terceira pessoa masculina indica a totalidade da produção da árvore.
- source_word: קֹדֶשׁ
  choice: santo
  rationale: Predicativo que designa o fruto como consagrado ou separado para uso sagrado; “santo” conserva o peso cultual do termo.
- source_word: הִלּוּלִים
  choice: para louvor
  rationale: O substantivo plural raro está ligado a louvor e celebração. A formulação natural “para louvor” evita introduzir a ideia lexicalmente mais específica de uma oferta e conserva a possível função celebrativa.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל expressa direção ou dedicação, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Sentido da expressão cultual rara קֹדֶשׁ הִלּוּלִים
  choice: santo, para louvor a Yahweh
  alternative: santo, louvores a Yahweh; santo, para celebrar Yahweh
  rationale: A sintaxe e o sentido exato de הִלּוּלִים são incomuns. O texto principal comunica dedicação celebrativa sem transformar o fruto explicitamente em “oferta”, enquanto a nota preserva alternativas mais formais.
- issue: Representação do Tetragrama יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto o nome divino pessoal presente no hebraico.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, mas “para louvor” oferece uma construção idiomática sem eliminar a ambiguidade da expressão cultual rara.
