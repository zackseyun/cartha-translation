  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: pt
  text: Mas, se for de fato comido no terceiro dia, é algo repugnante[a]; não será aceito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisa imprópria” ou “coisa contaminada”. O termo hebraico refere-se, neste contexto, à carne sacrificial tornada inaceitável por ser comida depois do prazo permitido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A conjunção introduz uma condição que contrasta com a ordem anterior; “Mas, se” preserva tanto o contraste quanto a força condicional.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: for de fato comido
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “De fato” comunica essa ênfase de modo natural, sem acrescentar uma ideia de quantidade.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: Tradução temporal direta, precisa e idiomática em português.
- source_word: פִּגּוּל
  choice: algo repugnante
  rationale: No contexto sacrificial, o termo designa aquilo que se tornou ofensivo e inaceitável por ter ultrapassado o prazo permitido. “Algo repugnante” conserva a avaliação forte sem confundi-lo com outros termos hebraicos normalmente traduzidos por “abominação”.
- source_word: הוּא
  choice: será algo
  rationale: O pronome funciona de modo predicativo e enfático. A construção portuguesa expressa com clareza o estado resultante no contexto da condição.
- source_word: לֹא יֵרָצֶה
  choice: não será aceito
  rationale: No uso sacrificial, o nifal de רצה indica que uma oferta não recebe aceitação. Esta formulação preserva o sentido cultual de maneira clara.
theological_decisions:
- issue: Status daquilo que é comido no terceiro dia
  choice: A violação do prazo torna o sacrifício ou sua carne ritualmente repugnante e não aceito.
  alternative: Entender o termo apenas como referência à deterioração física da carne ou como uma “abominação” em sentido moral mais amplo.
  rationale: O contexto imediato trata das regras e da aceitação do sacrifício. A frase final aponta para a inaceitabilidade cultual, sem excluir a linguagem forte de repulsa nem ampliá-la para outra categoria teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A omissão do sujeito explícito acompanha o hebraico e evita decidir de forma desnecessária entre o sacrifício e sua carne; as formas masculinas se ligam naturalmente ao “sacrifício” do contexto anterior.
