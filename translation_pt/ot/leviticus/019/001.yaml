base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Informa a forma hebraica subjacente e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O imperfeito com waw consecutivo introduz um novo ato de fala na narrativa. “Falou” é a formulação natural e digna em português para דבר nesta fórmula de discurso divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo tetragrama no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; “falou a Moisés” é uma construção corrente e adequada em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Na fórmula hebraica de introdução do discurso, לֵאמֹר anuncia as palavras que vêm em seguida. Em português moderno, os dois-pontos expressam essa função com mais naturalidade do que o decalque “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal no texto, enquanto “SENHOR” o substitui por um título e “Jeová” representa uma vocalização tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os dois-pontos antecipam naturalmente o discurso do versículo seguinte; o marcador [a] foi colocado após “Moisés” para acompanhar a camada inglesa fornecida, embora a nota se refira ao nome “Yahweh”.
