  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: pt
  text: Não recorram aos médiuns nem aos que consultam os espíritos; não os procurem[a], para não se tornarem impuros por meio deles. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os termos hebraicos também podem ser entendidos como “necromantes” e “adivinhos” ou como referências aos espíritos por eles consultados. Ambos estão ligados a práticas proibidas de consulta aos espíritos ou aos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: recorram
  rationale: No contexto da proibição, פנה indica voltar-se para alguém em busca de auxílio ou consulta. “Recorrer” comunica isso naturalmente em português sem explicitar além do necessário o ato de consultar.
- source_word: הָאֹבֹת
  choice: médiuns
  rationale: Nestes contextos legais, אוֹב pode designar o espírito evocado ou, por metonímia, seu praticante. O paralelismo com יִדְּעֹנִים favorece aqui categorias de praticantes; “médiuns” é claro e atual.
- source_word: הַיִּדְּעֹנִים
  choice: os que consultam os espíritos
  rationale: יִדְּעֹנִי designa alguém associado a conhecimento oculto obtido por espíritos. A expressão descritiva evita termos portugueses ambíguos ou antiquados e preserva a distinção aproximada em relação a “médiuns”.
- source_word: תְּבַקְשׁוּ
  choice: os procurem
  rationale: בקש significa “buscar, procurar”. Com o referente pessoal retomado pelo pronome, “não os procurem” expressa de modo direto a busca intencional por esses praticantes.
- source_word: לְטָמְאָה בָהֶם
  choice: para não se tornarem impuros por meio deles
  rationale: O infinitivo de טמא pode indicar propósito ou resultado. A formulação portuguesa preserva a ideia de entrar em estado de impureza por envolvimento com eles, sem restringi-la ao âmbito apenas ritual ou apenas moral.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Mantém a relação pactual e o destinatário na segunda pessoa do plural, em português amplamente legível.
theological_decisions:
- issue: Natureza da impureza causada pela prática proibida
  choice: “se tornarem impuros”, sem qualificação adicional
  alternative: “se tornarem ritualmente impuros” ou “se corromperem moralmente”
  rationale: טמא em Levítico pode reunir dimensões rituais e morais. A tradução não reduz deliberadamente o alcance do termo a apenas uma delas.
- issue: Referentes de אוֹב e יִדְּעֹנִי
  choice: Traduzir ambos como tipos de praticantes ligados à consulta dos mortos ou dos espíritos
  alternative: Entendê-los diretamente como os próprios espíritos evocados
  rationale: O paralelismo e os verbos “recorrer” e “procurar” favorecem praticantes neste contexto, embora os termos hebraicos também possam estar associados aos espíritos consultados; a nota registra essa complexidade lexical.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Recorrer” evita uma tradução excessivamente literal de פנה, enquanto “os que consultam os espíritos” torna inteligível um termo hebraico raro sem recorrer a “espíritas”, palavra que no português moderno pode sugerir especificamente uma identidade religiosa contemporânea.
