id: LEV.19.21
reference: Leviticus 19:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֶת אֲשָׁמ/וֹ֙ לַֽ/יהוָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: pt
  text: 'Ele levará a Yahweh sua oferta pela culpa[a], à entrada da tenda do encontro: um carneiro como oferta pela culpa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua oferta de reparação”. O termo hebraico אָשָׁם pode se referir tanto à culpa quanto à oferta apresentada para repará-la.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Ele levará
  rationale: Em contexto legal, a forma verbal tem força prescritiva. O futuro simples é natural em português legislativo e preserva essa força.
- source_word: אֲשָׁמוֹ
  choice: sua oferta pela culpa
  rationale: אָשָׁם pode indicar tanto a culpa quanto a oferta reparadora ligada a ela; aqui, o contexto sacrificial requer o sentido de oferta.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica o destinatário da apresentação, e o nome divino יהוה é transliterado como Yahweh.
- source_word: אֶל פֶּתַח
  choice: à entrada
  rationale: פֶּתַח designa a entrada ou abertura; 'à entrada' é claro e natural no contexto do santuário.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente da designação do santuário, mantendo a ideia de encontro sem acrescentar uma interpretação não expressa.
- source_word: אֵיל
  choice: um carneiro
  rationale: אֵיל designa especificamente um carneiro.
- source_word: אָשָׁם
  choice: como oferta pela culpa
  rationale: A expressão final identifica, em aposição, a função sacrificial do carneiro; a formulação preserva a repetição do termo hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome próprio divino sem substituí-lo por um título.
- issue: Amplitude semântica de אָשָׁם
  choice: oferta pela culpa, com nota sobre reparação
  alternative: oferta de reparação
  rationale: A escolha mantém a associação lexical com culpa, enquanto a nota preserva a dimensão reparadora do termo sem reduzir sua ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com futuro de valor prescritivo. A repetição de 'oferta pela culpa' reflete deliberadamente a repetição hebraica.
