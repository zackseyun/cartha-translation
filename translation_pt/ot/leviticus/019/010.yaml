  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: pt
  text: Não colha tudo da sua vinha[a], nem recolha as uvas caídas da sua vinha[b]. Deixe-as para o pobre e para o estrangeiro residente[c]. Eu sou Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não repasse a sua vinha para colher o que restou”. O verbo hebraico se refere a voltar às videiras depois da colheita principal para retirar os cachos restantes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as sobras da sua vinha”. O hebraico se refere às uvas que caem ou ficam para trás durante a colheita.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “imigrante”. O termo hebraico designa uma pessoa não nativa que vivia entre os israelitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: sua vinha
  rationale: כֶּרֶם designa uma vinha; esta é a forma portuguesa natural e precisa para o contexto agrícola.
- source_word: תְעוֹלֵל
  choice: Não colham até o último cacho
  rationale: Neste contexto, o verbo descreve repassar as videiras para retirar o que restou da colheita principal. A formulação comunica com clareza a proibição da colheita exaustiva.
- source_word: פֶּרֶט
  choice: as uvas que caírem
  rationale: פֶּרֶט se refere ao que se desprende ou cai durante a colheita; a expressão torna concreto o referente no contexto da vinha.
- source_word: תְלַקֵּט
  choice: recolham
  rationale: לקט significa juntar ou apanhar. 'Recolher' é natural para uvas caídas e distingue esta ação da colheita dos cachos nas videiras.
- source_word: לֶעָנִי
  choice: para o pobre
  rationale: עָנִי designa a pessoa pobre ou necessitada; 'o pobre' é direto e convencional neste contexto legal.
- source_word: וְלַגֵּר
  choice: e para o estrangeiro residente
  rationale: גֵּר designa um não israelita estabelecido entre o povo, e não simplesmente qualquer visitante ou estrangeiro. A expressão preserva esse caráter residencial e jurídico-social.
- source_word: תַּעֲזֹב אֹתָם
  choice: Deixem-nas
  rationale: עזב aqui significa deixar algo para que outros o recolham. O pronome feminino retoma naturalmente 'uvas' em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Expressa de modo natural a fórmula pactual e preserva o plural do sufixo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal, enquanto 'SENHOR' o substitui por um título.
- issue: Identidade social do גֵּר
  choice: estrangeiro residente
  alternative: estrangeiro
  rationale: A expressão evita reduzir גֵּר a qualquer pessoa de outra nacionalidade e preserva a referência a alguém não nativo que vivia no meio de Israel.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural para refletir que o mandamento é dirigido à comunidade. 'Até o último cacho' evita o uso técnico e potencialmente ambíguo de 'respigar' na primeira oração. A repetição de 'sua vinha' foi reduzida na segunda oração por naturalidade, sem perda de sentido.
