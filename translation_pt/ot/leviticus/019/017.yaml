review_pass:
  verdict: revise
  source_fidelity: A primeira proibição e os termos relacionais são bem traduzidos. Contudo, «para que» transforma a oração final, que no hebraico é coordenada por «e», numa finalidade explícita da repreensão. Embora a relação esteja implicada no contexto e seja possível interpretativamente, a coordenação deve ser preservada. A ênfase de הוֹכֵחַ תּוֹכִיחַ também é mais bem mantida por «repreenda francamente».
  naturalness: «Não odeie o seu irmão em seu coração. Repreenda francamente o seu próximo e não incorra em pecado por causa dele» é português moderno, claro e de registro apropriado. Evita atribuir à sintaxe uma relação de finalidade que o texto não formula diretamente.
  terminology: «Irmão», «próximo», «repreenda» e «incorra em pecado» refletem adequadamente os termos hebraicos e o registro ético-jurídico. A nota deve apresentar a expressão final como idiomática, sem sugerir que «o pecado dele» seja a única leitura literal ou interpretativa.
  issues:
  - severity: medium
    issue: A locução «para que» explicita uma finalidade que não está expressa na coordenação hebraica.
    rationale: O texto traz «e não...» (וְלֹא), não uma oração final. A consequência moral pode ser inferida, mas não deve substituir a forma coordenada da fonte.
  - severity: low
    issue: A formulação alternativa da nota «não leve sobre si o pecado dele» pode sugerir, de modo excessivamente específico, que se trata de carregar o pecado pertencente ao outro.
    rationale: A construção נָשָׂא ... חֵטְא com עָלָיו é idiomática e comporta a ideia de incorrer em culpa por causa dele; a nota deve preservar essa abertura.
