  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: pt
  text: Não odeie o seu irmão em seu coração. Repreenda francamente o seu próximo e não incorra em pecado por causa dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se torne culpado por causa dele” ou “não participe do pecado dele”. A expressão hebraica é idiomática e pode indicar que alguém se torna culpado por deixar de confrontar o erro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: odeie
  rationale: O verbo שׂנא expressa diretamente ódio; “odiar” conserva a força moral da proibição.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Mantém a imagem familiar e comunitária do hebraico, que pode designar tanto um irmão quanto um membro da comunidade da aliança.
- source_word: בִּלְבָבֶךָ
  choice: no coração
  rationale: Reproduz a expressão hebraica natural em português e destaca a disposição interior.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: repreenda com franqueza
  rationale: A construção enfática com infinitivo absoluto exige uma correção clara e efetiva; esta formulação comunica a ênfase de modo natural.
- source_word: עֲמִיתֶךָ
  choice: seu próximo
  rationale: Designa alguém da mesma comunidade; “próximo” é idiomático e se harmoniza com o contexto imediato de Levítico 19.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: incorra em pecado por causa dele
  rationale: נשא חטא é uma expressão idiomática para contrair culpa ou tornar-se culpado; com עָלָיו, indica culpabilidade relacionada ao outro, possivelmente por não confrontar seu erro.
theological_decisions:
- issue: Alcance da linguagem de parentesco na ética da aliança
  choice: Manter “seu irmão” e “seu próximo” no masculino singular.
  alternative: “seu semelhante” ou “outro israelita”
  rationale: As formas masculinas singulares do hebraico têm força representativa. A tradução preserva a linguagem relacional da fonte sem restringir explicitamente sua aplicação.
- issue: Relação entre repreensão e culpa
  choice: 'Traduzir a última oração como consequência a evitar: “para que você não incorra em pecado por causa dele”.'
  alternative: “e não leve sobre si o pecado dele” ou “e não participe do pecado dele”
  rationale: A sintaxe e o idioma hebraico admitem mais de uma nuance. A formulação escolhida comunica a provável ideia de tornar-se culpado, inclusive por omissão, sem identificar de forma absoluta como essa culpa ocorre.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Não odeie” e “repreenda” dão forma natural aos mandamentos; “com franqueza” expressa a intensidade da construção hebraica sem recorrer ao pouco idiomático “certamente repreenda”.
