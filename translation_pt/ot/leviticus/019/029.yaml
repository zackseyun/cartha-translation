  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: pt
  text: Não profane sua filha, fazendo-a prostituir-se[a], para que a terra não se prostitua[b] nem se encha de depravação[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levando-a à prostituição” ou “fazendo dela uma prostituta”. O verbo hebraico está na forma causativa.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para que a terra não pratique prostituição”. A expressão é metafórica e descreve a corrupção moral da comunidade na terra.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “perversidade”, “infâmia” ou “maldade”. O termo hebraico indica grave depravação moral, frequentemente em contexto sexual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: profane
  rationale: O piel de חלל significa aqui tratar como profano ou violar a santidade. “Profane” preserva o vocabulário de santidade característico de Levítico melhor que termos mais gerais, como “desonre”.
- source_word: בִּתְּךָ
  choice: sua filha
  rationale: Reproduz diretamente o substantivo singular com sufixo de segunda pessoa masculina singular.
- source_word: לְהַזְנוֹתָהּ
  choice: levando-a à prostituição
  rationale: O infinitivo hifil de זנה com sufixo feminino singular tem sentido causativo. A formulação comunica que o pai faz com que a filha entre na prostituição, sem acrescentar ao texto uma modalidade específica, como venda ou coerção física.
- source_word: תִזְנֶה הָאָרֶץ
  choice: a terra não se prostitua
  rationale: Mantém a personificação e a metáfora sexual do hebraico, em vez de reduzi-las à ideia genérica de corrupção moral.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: e não se encha
  rationale: No contexto da proibição e de sua consequência, a forma verbal expressa o resultado que deve ser evitado. A repetição explícita de “a terra” pode ser naturalmente retomada pelo pronome reflexivo em português.
- source_word: זִמָּה
  choice: depravação
  rationale: O termo designa conduta moral ultrajante, muitas vezes de caráter sexual. “Depravação” preserva sua intensidade e amplitude sem restringi-lo apenas à imoralidade sexual.
theological_decisions:
- issue: Como traduzir a terra que “se prostitui”
  choice: 'Conservar a metáfora: “para que a terra não se prostitua”.'
  alternative: “para que a terra não se corrompa” ou “não caia na imoralidade”.
  rationale: A imagem vincula a prática individual à corrupção de toda a comunidade e faz parte da força retórica do texto. Mantê-la evita apagar uma tensão deliberada do hebraico.
- issue: Como representar חלל no contexto da santidade
  choice: Usar “profane”.
  alternative: “desonre” ou “contamine”.
  rationale: Levítico organiza seu discurso em torno da distinção entre santo e profano. “Profane” mantém esse registro conceitual, enquanto as alternativas tornam a expressão mais genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o registro de santidade em “profane”, a força causativa da ação contra a filha e a metáfora deliberada da terra que se prostitui.
