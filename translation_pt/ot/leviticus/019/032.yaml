  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: pt
  text: Levante-se diante de alguém de cabelos brancos[a], honre um ancião[b] e tema o seu Deus; eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na presença de cabelos brancos”. O hebraico usa a imagem concreta dos cabelos brancos para se referir à velhice.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “honre o rosto de um ancião”; a expressão significa demonstrar honra a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: diante de quem tem cabelos brancos
  rationale: A expressão combina a ideia espacial de estar diante de alguém com a imagem concreta dos cabelos brancos; em português, esta formulação preserva ambas de modo natural.
- source_word: תָּקוּם
  choice: levante-se
  rationale: O imperfeito hebraico tem força de mandamento e descreve o ato de se levantar como sinal público de respeito.
- source_word: וְהָדַרְתָּ פְּנֵי זָקֵן
  choice: honre a pessoa idosa
  rationale: O verbo exige demonstrar honra. A tradução comunica naturalmente o sentido do idioma hebraico, que literalmente menciona o rosto de um idoso.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: e tema o seu Deus
  rationale: “Temer” conserva a força de ירא e sua tensão entre temor, reverência e submissão diante de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Alcance de זָקֵן, masculino singular
  choice: a pessoa idosa
  alternative: o homem idoso; o ancião
  rationale: Embora a forma hebraica seja masculina singular, neste mandamento geral ela designa a pessoa de idade avançada. A formulação portuguesa evita limitar indevidamente o dever de honra aos homens, sem transformar o termo em um título de liderança.
- issue: Sentido do temor de Deus
  choice: tema o seu Deus
  alternative: reverencie o seu Deus
  rationale: “Tema” preserva a intensidade teológica e a amplitude semântica do hebraico, sem reduzir o conceito a simples respeito.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original emprega explicitamente o tetragrama; a transliteração preserva o nome próprio e o distingue de um título.
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais para o destinatário singular. A imagem concreta dos cabelos brancos foi preservada, enquanto o segundo idioma hebraico foi expresso de modo compreensível. A pontuação mantém a declaração divina final enfática.
