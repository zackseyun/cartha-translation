  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: pt
  text: Não cometam injustiça ao julgar. Não favoreçam o pobre nem sejam parciais com o poderoso; julguem o seu próximo com retidão.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “julguem o seu próximo com justiça”.'
    reason: lexical_alternative
  - marker: b
    text: As expressões idiomáticas hebraicas dizem literalmente “levantar o rosto do pobre” e “honrar o rosto do poderoso”; no contexto judicial, referem-se a favorecer alguém ou tratá-lo com deferência parcial.
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: injustiça ao julgar
  rationale: Expressa de modo natural o sentido jurídico de praticar injustiça no exercício do julgamento, sem restringir a frase a um procedimento técnico específico.
- source_word: תִשָּׂא פְנֵי דָל
  choice: favoreçam o pobre
  rationale: Traduz o sentido do idioma hebraico, literalmente 'levantar o rosto do pobre', como favoritismo indevido em um julgamento.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: sejam parciais com o poderoso
  rationale: Comunica a deferência parcial proibida pelo texto. 'Poderoso' representa aqui a pessoa de posição elevada ou influência social, sem limitar o termo aos ricos.
- source_word: בְּצֶדֶק
  choice: com retidão
  rationale: Preserva a dimensão moral de צֶדֶק e se ajusta ao contexto judicial; a alternativa contextual 'com justiça' é mantida em nota.
- source_word: תִּשְׁפֹּט
  choice: julguem
  rationale: Imperativo português natural que reproduz a força injuntiva da forma hebraica no discurso legal.
- source_word: עֲמִיתֶךָ
  choice: o seu próximo
  rationale: Designa o semelhante ou membro da comunidade e mantém a ligação lexical e temática com o contexto de Levítico 19.
theological_decisions:
- issue: Sentido de צֶדֶק no contexto jurídico e ético
  choice: com retidão
  alternative: com justiça
  rationale: O termo reúne dimensões moral e judicial. 'Com retidão' conserva o peso ético no texto principal, enquanto a nota registra a tradução judicial igualmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural para refletir o destinatário coletivo. A formulação evita literalismos obscuros no corpo do versículo, mas conserva a imagem hebraica em nota.
