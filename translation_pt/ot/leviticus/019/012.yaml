  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: pt
  text: Não jurem falsamente pelo meu nome, nem profanem o nome do seu Deus.[a] Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Não jurem pelo meu nome para a falsidade.”'
    reason: Preserva o valor mais literal de לַשָּׁקֶר (“para a falsidade”), enquanto o texto principal emprega o português idiomático “falsamente”. A nota não atribui indevidamente à forma hebraica uma segunda negação explícita.
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: não jurem
  rationale: O nifal de שׁבע, neste contexto legal e ético, significa jurar ou prestar juramento. A forma imperativa negativa comunica naturalmente em português a proibição dirigida ao povo.
- source_word: בִשְׁמִי
  choice: pelo meu nome
  rationale: Em fórmulas de juramento, a preposição ב com 'nome' indica aquilo que é invocado como garantia; 'pelo meu nome' é a expressão portuguesa natural.
- source_word: לַשָּׁקֶר
  choice: falsamente
  rationale: Embora a construção seja mais literalmente 'para a falsidade', ela tem valor adverbial no contexto e é bem expressa por 'jurar falsamente'.
- source_word: וְחִלַּלְתָּ
  choice: profanando assim
  rationale: O piel de חלל significa profanar ou tornar impuro no âmbito sagrado. 'Assim' explicita com moderação a relação consequencial possível entre o juramento falso e a profanação, enquanto a nota preserva uma leitura mais estritamente coordenada.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: o nome do seu Deus
  rationale: Mantém a imagem teologicamente significativa do 'nome' como identidade e honra reveladas de Deus. אֱלֹהִים, embora formalmente plural, tem aqui referente singular e recebe corretamente 'Deus'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. 'Yahweh' preserva o nome pessoal e é uma transliteração academicamente difundida, sem substituí-lo por um título.
- issue: Relação entre o juramento falso e a profanação
  choice: 'relação consequencial: ''profanando assim'''
  alternative: 'coordenação simples: ''e não profanem'''
  rationale: O waw pode ligar diretamente os atos ou apresentar o segundo como resultado do primeiro. A tradução principal comunica a consequência ética natural, e a nota registra a alternativa formal para preservar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega o plural 'vocês' implícito em 'jurem', coerente com o destinatário coletivo no hebraico, e 'seu' em referência distributiva ao povo. A construção participial evita uma sequência menos natural de proibições e mantém a ligação estreita entre os dois atos.
