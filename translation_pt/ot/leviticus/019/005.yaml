reference: Leviticus 19:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: pt
  text: Quando vocês sacrificarem um sacrifício de comunhão a Yahweh, sacrifiquem-no de modo que sejam aceitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “para a aceitação de vocês”.'
    reason: A nota registra a forma nominal mais próxima do hebraico לִרְצֹנְכֶם, enquanto o texto principal expressa seu sentido idiomático no contexto sacrificial.
lexical_decisions:
- source_word: וְכִי
  choice: Quando
  rationale: No contexto legal, כִּי introduz o caso em que a instrução se aplica. “Quando” é natural em português e preserva o valor temporal-condicional sem apresentar o sacrifício como mera hipótese.
- source_word: תִזְבְּחוּ
  choice: vocês sacrificarem
  rationale: O verbo זבח designa o ato de sacrificar ou abater ritualmente. “Sacrificarem” é claro, apropriado ao contexto cultual e mantém a ligação lexical com o substantivo seguinte.
- source_word: זֶבַח שְׁלָמִים
  choice: um sacrifício de comunhão
  rationale: A expressão designa uma categoria sacrificial. “Sacrifício de comunhão” é compreensível e evita fazer de “paz” uma descrição simplista do rito; o substantivo זֶבַח permanece expresso.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição לְ indica o destinatário ou a dedicação do sacrifício, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: לִרְצֹנְכֶם
  choice: de modo que sejam aceitos
  rationale: No contexto sacrificial, רָצוֹן diz respeito à aceitação ou aceitabilidade diante de Deus. A formulação comunica o sentido idiomático sem sugerir que o rito deva ser realizado segundo a preferência dos ofertantes.
- source_word: תִּזְבָּחֻהוּ
  choice: sacrifiquem-no
  rationale: A repetição do verbo e o sufixo masculino singular retomam זֶבַח. A tradução conserva tanto a repetição quanto a força normativa da instrução.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido de לִרְצֹנְכֶם na legislação sacrificial
  choice: de modo que sejam aceitos
  alternative: para a aceitação de vocês; conforme a vontade de vocês
  rationale: O sentido cultual de aceitação é o mais adequado ao contexto. A alternativa ligada à vontade ou preferência dos ofertantes é possível em outros contextos lexicais, mas aqui enfraqueceria a noção de aceitabilidade diante de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A repetição “sacrificarem um sacrifício” é deliberada, pois reflete a repetição lexical hebraica; “sacrifício de comunhão” funciona como termo cultual sem exigir linguagem excessivamente técnica.
