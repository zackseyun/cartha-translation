id: LEV.19.33
reference: Leviticus 19:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יָג֧וּר אִתְּ/ךָ֛ גֵּ֖ר בְּ/אַרְצְ/כֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: pt
  text: Quando um estrangeiro[a] residir com você na terra de vocês, não o maltratem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Estrangeiro” traduz o hebraico ger, uma pessoa não nativa que residia entre os israelitas; também pode ser traduzido por “residente estrangeiro”.
    reason: cultural_note
  - marker: b
    text: Ou “não o oprimam”, “não o prejudiquem” ou “não o tratem injustamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Quando
  rationale: Introduz a situação prevista pela lei; “quando” é natural em português jurídico e não acentua uma incerteza ausente do contexto.
- source_word: יָגוּר
  choice: residir
  rationale: O verbo גור descreve a residência de quem vive fora de seu grupo ou lugar de origem; “residir” exprime permanência sem o tom arcaico de “peregrinar”.
- source_word: אִתְּךָ
  choice: com você
  rationale: Traduz diretamente a preposição com sufixo singular. A alternância com o plural em “terra de vocês” conserva a mudança de número do hebraico.
- source_word: גֵּר
  choice: estrangeiro
  rationale: Designa aqui um não nativo que reside no meio de Israel. “Estrangeiro” é claro e atual, enquanto a residência é explicitada pelo verbo; uma nota esclarece o sentido social específico.
- source_word: בְּאַרְצְכֶם
  choice: na terra de vocês
  rationale: Preserva o substantivo “terra” e o sufixo plural, que dirige a norma à comunidade inteira.
- source_word: לֹא תוֹנוּ
  choice: não o maltratem
  rationale: O Hifil de ינה pode indicar tratar injustamente, oprimir ou lesar. “Maltratar” é amplo, natural e compreensível, sem restringir o dano a uma única forma.
- source_word: אֹתוֹ
  choice: o
  rationale: Mantém o objeto masculino singular, retomando גֵּר.
theological_decisions:
- issue: Sentido de גֵּר na legislação de santidade de Israel
  choice: estrangeiro
  alternative: residente estrangeiro; imigrante; peregrino
  rationale: O termo não indica mero visitante, mas uma pessoa não nativa estabelecida entre os israelitas e sujeita à proteção jurídica da comunidade. A tradução mantém a condição estrangeira no texto e explica a dimensão residencial em nota.
- issue: Extensão da proibição expressa por ינה
  choice: maltratar
  alternative: oprimir; prejudicar; tratar injustamente
  rationale: O verbo admite uma gama de abusos e injustiças. A escolha não limita indevidamente a ordem à opressão institucional nem elimina a possibilidade desse sentido mais forte.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A alternância entre “você” e “vocês” é deliberada: reproduz o singular de אִתְּךָ e o plural de בְּאַרְצְכֶם/תוֹנוּ sem tornar a frase artificial.'
