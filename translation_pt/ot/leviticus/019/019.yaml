  text: אֶֽת חֻקֹּתַ/י֮ תִּשְׁמֹרוּ֒ בְּהֶמְתְּ/ךָ֙ לֹא תַרְבִּ֣יעַ כִּלְאַ֔יִם שָׂדְ/ךָ֖ לֹא תִזְרַ֣ע כִּלְאָ֑יִם וּ/בֶ֤גֶד כִּלְאַ֨יִם֙ שַֽׁעַטְנֵ֔ז לֹ֥א יַעֲלֶ֖ה עָלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: pt
  text: Guardem os meus estatutos. Não cruzem os seus animais com animais de tipos diferentes; não semeiem o seu campo com sementes de tipos diferentes; e não vistam roupa de tecido misto, shaatnez[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico shaatnez é um termo técnico para um tecido misto proibido, tradicionalmente entendido como uma mistura de lã e linho; compare Deuteronômio 22:11.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: os meus estatutos
  rationale: Preserva o caráter jurídico de חֻקָּה em linguagem bíblica clara e corrente.
- source_word: תִּשְׁמֹרוּ
  choice: Guardem
  rationale: No contexto legal da aliança, שׁמר significa guardar ou observar; o imperativo reproduz naturalmente a força do yiqtol injuntivo.
- source_word: בְּהֶמְתְּךָ
  choice: os seus animais
  rationale: בְּהֵמָה abrange animais domésticos; 'animais' é amplo e natural, e o contexto deixa claro que se trata dos animais pertencentes ao povo.
- source_word: תַרְבִּיעַ כִּלְאַיִם
  choice: cruzem os seus animais com animais de outra espécie
  rationale: O hifil de רבע indica fazer acasalar, enquanto כִּלְאַיִם indica tipos distintos; 'cruzar' comunica o sentido agropecuário sem afirmar mais do que o texto.
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: não semeiem o seu campo com duas espécies de semente
  rationale: '''Semear'' corresponde precisamente a זרע, e a explicitação de ''semente'' torna natural o כִּלְאָיִם elíptico no contexto.'
- source_word: בֶגֶד כִּלְאַיִם
  choice: roupa feita de dois tipos de material
  rationale: בֶּגֶד designa roupa ou veste; a formulação comunica a composição mista sem antecipar no texto principal a identificação tradicional das fibras.
- source_word: שַׁעַטְנֵז
  choice: shaatnez
  rationale: Mantém transliterado o raro termo técnico hebraico, cuja identificação tradicional é explicada em nota.
- source_word: לֹא יַעֲלֶה עָלֶיךָ
  choice: não vistam
  rationale: A expressão literal 'não subirá sobre vocês' é idiomática para uma peça colocada sobre o corpo; 'não vistam' transmite com clareza a proibição, sem uma construção artificial em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural para refletir o destinatário coletivo. Emprega-se 'seus' em vez de 'vosso' para ampla legibilidade brasileira e internacional. A repetição das proibições e a distinção entre animais, sementes e tecido foram preservadas.
