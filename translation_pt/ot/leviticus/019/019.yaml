revisions:
- from: Guardem os meus estatutos. Não cruzem os seus animais com animais de outra espécie; não semeiem o seu campo com duas espécies de semente; e não vistam roupa feita de dois tipos de material[a], isto é, shaatnez.
  to: Guardem os meus estatutos. Não cruzem os seus animais com animais de tipos diferentes; não semeiem o seu campo com sementes de tipos diferentes; e não vistam roupa de tecido misto, shaatnez[a].
  rationale: A revisão preserva as proibições e a linguagem jurídica do original, substitui categorias biológicas modernas por «tipos diferentes» e mantém shaatnez como termo técnico em aposição, sem convertê-lo em uma definição no texto principal. A nota conserva a explicação tradicional e a referência cruzada.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:55Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura tripla das proibições e o sentido geral de כלאים como mistura de tipos distintos. Contudo, «isto é, shaatnez» transforma a aposição hebraica em uma definição inequívoca e pode sugerir que o termo técnico significa simplesmente “roupa feita de dois tipos de material”. Convém conservar «shaatnez» como designação técnica e deixar sua explicação para a nota. Também é preferível evitar «espécie» como equivalente rígido de כלאים, pois o hebraico se refere a tipos/kinds, sem impor uma categoria biológica moderna.
  naturalness: O texto é claro e de registro apropriado. «Animais de outra espécie» e «duas espécies de semente» soam um pouco técnicos e menos naturais do que «animais de tipos diferentes» e «sementes de tipos diferentes». A formulação final revista continua direta e idiomática.
  terminology: «Estatutos», «semear» e «shaatnez» são escolhas adequadas. «Tecido misto» comunica naturalmente o referente de בגד כלאים sem especificar indevidamente as fibras; a nota mantém a identificação tradicional com lã e linho como interpretação tradicional, não como definição absoluta.
  issues:
  - severity: medium
    issue: «isto é, shaatnez» apresenta shaatnez como definição inequívoca de “roupa feita de dois tipos de material”.
    rationale: No hebraico, שעטנז é um termo técnico em aposição a «garment of mixed kinds». Seu alcance exato é especializado e a associação com lã e linho deve permanecer qualificada na nota, não ser reduzida no texto a uma explicação exaustiva.
  - severity: low
    issue: «espécie» pode ser excessivamente taxonômico para כלאים.
    rationale: O termo hebraico indica tipos ou espécies heterogêneas, mas não fornece uma classificação biológica moderna. «Tipos diferentes» conserva melhor a amplitude do original.
  revised_text: Guardem os meus estatutos. Não cruzem os seus animais com animais de tipos diferentes; não semeiem o seu campo com sementes de tipos diferentes; e não vistam roupa de tecido misto, shaatnez[a].
  revised_footnotes:
  - marker: a
    text: O hebraico shaatnez é um termo técnico para um tecido misto proibido, tradicionalmente entendido como uma mistura de lã e linho; compare Deuteronômio 22:11.
    reason: lexical_alternative
  revision_rationale: A revisão preserva as proibições e a linguagem jurídica do original, substitui categorias biológicas modernas por «tipos diferentes» e mantém shaatnez como termo técnico em aposição, sem convertê-lo em uma definição no texto principal. A nota conserva a explicação tradicional e a referência cruzada.
