reference: Leviticus 19:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֣א תַקִּ֔פוּ פְּאַ֖ת רֹאשְׁ/כֶ֑ם וְ/לֹ֣א תַשְׁחִ֔ית אֵ֖ת פְּאַ֥ת זְקָנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: pt
  text: Não arredondem o cabelo nas laterais da cabeça[a][b] e não desfigurem as extremidades da barba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os cantos da cabeça”. O termo hebraico pode significar “extremidade”, “lado” ou “canto”.'
    reason: lexical_alternative
  - marker: b
    text: Provavelmente se refere a raspar ou aparar de forma arredondada o cabelo nas laterais da cabeça.
    reason: cultural_note
  - marker: c
    text: 'Ou: “destruam”, “estraguem” ou “danifiquem as extremidades da barba”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: arredondem
  rationale: O hifil de נקף, neste contexto, indica cortar o cabelo de modo arredondado ao redor da borda da cabeça. “Arredondem” preserva a ação concreta sem definir além do que o hebraico permite.
- source_word: פְּאַת רֹאשְׁכֶם
  choice: o cabelo nas laterais da cabeça
  rationale: פֵּאָה pode significar extremidade, lado ou canto. A formulação explicita naturalmente em português que a ordem diz respeito ao cabelo situado nas laterais da cabeça, mantendo o sentido distributivo do possessivo plural hebraico.
- source_word: תַשְׁחִית
  choice: desfigurem
  rationale: O hifil de שׁחת pode significar destruir, arruinar ou estragar. No contexto da barba, “desfigurem” expressa uma alteração danificadora sem especificar indevidamente o método.
- source_word: פְּאַת זְקָנֶךָ
  choice: as extremidades da barba
  rationale: פֵּאָה volta a designar as bordas ou extremidades; o plural em português é idiomático para as diversas extremidades da barba, embora o substantivo hebraico esteja no singular.
- source_word: לֹא ... וְלֹא
  choice: Não ... e não ...
  rationale: O imperativo negativo com “não” comunica diretamente a força proibitiva da instrução legal em português moderno, sem recorrer ao menos natural “não deverão”.
theological_decisions:
- issue: Natureza da proibição
  choice: Uma proibição concreta de determinadas formas de cortar o cabelo e alterar a barba, sem inserir no texto uma explicação do motivo.
  alternative: Uma proibição especificamente ligada a ritos pagãos de luto, ou mais amplamente a estilos de aparência associados aos povos vizinhos.
  rationale: O versículo declara as ações proibidas, mas não explicita sua motivação. A tradução conserva essa contenção e não transforma hipóteses culturais em parte do texto.
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa plural de ampla legibilidade brasileira. A redação mantém a concretude da lei e preserva a incerteza quanto à prática exata e à sua motivação cultural.
