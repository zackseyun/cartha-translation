  text: לֹֽא תַעֲשֹׁ֥ק אֶת רֵֽעֲ/ךָ֖ וְ/לֹ֣א תִגְזֹ֑ל לֹֽא תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּ/ךָ֖ עַד בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: pt
  text: Não oprima o seu próximo nem o roube. O salário de um trabalhador contratado não deve permanecer com você até a manhã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: oprima
  rationale: O verbo abrange opressão, exploração e retenção injusta do que é devido; “oprimir” preserva essa amplitude no contexto econômico.
- source_word: רֵעֲךָ
  choice: o seu próximo
  rationale: Em contexto ético-jurídico, designa o semelhante ou membro da comunidade; “próximo” mantém a formulação reconhecível da Torá.
- source_word: תִגְזֹל
  choice: o roube
  rationale: O verbo indica tomar injustamente, muitas vezes por força; “roubar” expressa isso de modo claro e conciso.
- source_word: תָלִין
  choice: não fique
  rationale: A forma verbal concorda com o substantivo feminino “salário” e significa passar a noite ou permanecer até o dia seguinte; a formulação conserva o salário como sujeito.
- source_word: פְּעֻלַּת
  choice: O salário
  rationale: Embora possa significar trabalho ou recompensa, a construção com o trabalhador contratado e a proibição de reter o pagamento exige aqui o sentido de remuneração.
- source_word: שָׂכִיר
  choice: do trabalhador contratado
  rationale: Refere-se a alguém contratado mediante remuneração; a expressão é atual, clara e inclusiva quanto ao tipo de trabalho.
- source_word: אִתְּךָ
  choice: com você
  rationale: Traduz diretamente a ideia de que o empregador continua de posse do salário.
- source_word: עַד בֹּקֶר
  choice: até a manhã
  rationale: Preserva o limite temporal concreto estabelecido pelo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais na primeira oração e formulação jurídica na segunda. O singular “você” reflete o destinatário masculino singular do hebraico sem recorrer ao registro lusitano de “tu”.
