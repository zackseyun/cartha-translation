id: LEV.19.18
reference: Leviticus 19:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: pt
  text: Não se vingue nem guarde rancor contra os filhos do seu povo[a], mas ame o seu próximo como a si mesmo. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os do seu próprio povo». Hebraico: «os filhos do seu povo».'
    reason: Alternativa lexical que esclarece o sentido coletivo da expressão hebraica sem apagar sua forma literal no texto principal.
lexical_decisions:
- source_word: תִקֹּם
  choice: se vingue
  rationale: O verbo נקם expressa a ação de tomar vingança ou revidar. A forma pronominal «vingar-se» é natural em português e preserva o sentido ativo de retaliação.
- source_word: תִטֹּר
  choice: guarde rancor
  rationale: Neste contexto, נטר significa conservar ressentimento. «Guardar rancor» reproduz naturalmente em português esse aspecto durativo.
- source_word: בְּנֵי עַמֶּךָ
  choice: os filhos do seu povo
  rationale: Mantém a forma concreta e gramaticalmente masculina do hebraico, que designa membros do próprio povo, sem substituir silenciosamente a expressão por uma formulação mais ampla.
- source_word: וְאָהַבְתָּ
  choice: ame
  rationale: O perfeito com waw tem força injuntiva neste contexto legal. O imperativo português harmoniza-se com as proibições anteriores e comunica claramente a força do mandamento.
- source_word: לְרֵעֲךָ
  choice: o seu próximo
  rationale: רֵעַ pode indicar companheiro, semelhante ou membro próximo da comunidade. «Próximo» é uma equivalência consagrada, natural e adequada ao contexto ético, sem definir além do texto o alcance do termo.
- source_word: כָּמוֹךָ
  choice: como a si mesmo
  rationale: Expressa de modo idiomático a comparação do hebraico e preserva a própria pessoa como termo de comparação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Alcance dos destinatários da proibição e do mandamento
  choice: Preservar «os filhos do seu povo» e traduzir רֵעַ por «o seu próximo».
  alternative: Generalizar ambas as expressões como referência indistinta a todas as pessoas.
  rationale: O hebraico emprega duas expressões distintas. A tradução conserva a referência comunitária explícita da primeira e a abertura lexical de «próximo» na segunda, sem impor expansões ou restrições interpretativas.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal יהוה presente no texto hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se o tratamento «seu» e o imperativo negativo de terceira pessoa. A coordenação «mas ame» torna explícito em português o contraste entre as proibições e o mandamento positivo; a pontuação final separa naturalmente a fórmula divina.
