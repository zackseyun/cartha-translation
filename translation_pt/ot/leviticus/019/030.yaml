source:
  edition: WLC
  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: pt
  text: Guardem os meus sábados e reverenciem o meu santuário[a]. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “temam o meu santuário”. O verbo hebraico pode significar tanto “temer” como “reverenciar”; aqui indica tratar com santo respeito o lugar sagrado de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: os meus sábados
  rationale: Preserva o plural explícito do hebraico e designa as observâncias sabáticas pertencentes a Yahweh.
- source_word: תִּשְׁמֹרוּ
  choice: Guardem
  rationale: שׁמר pode significar guardar, observar ou cumprir. “Guardem” mantém a imagem de cuidado fiel e soa natural no contexto de mandamento.
- source_word: מִקְדָּשִׁי
  choice: o meu santuário
  rationale: מִקְדָּשׁ designa um lugar santo ou santuário; a tradução não especifica indevidamente tabernáculo ou templo.
- source_word: תִּירָאוּ
  choice: reverenciem
  rationale: ירא abrange temor e reverência. Em relação ao santuário, “reverenciem” comunica respeito santo sem reduzir o sentido a mero medo, enquanto a nota preserva a alternativa lexical.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Reproduz a fórmula enfática de autoidentificação e translitera diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio. “Yahweh” conserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido de ירא diante do santuário
  choice: reverenciem o meu santuário
  alternative: temam o meu santuário
  rationale: O contexto pede uma atitude de santo respeito pelo lugar consagrado a Deus. A tradução principal usa português natural, e a nota mantém a amplitude semântica do verbo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural adequados ao discurso dirigido à comunidade. “Sábados” preserva o plural hebraico; “santuário” mantém a referência ampla ao espaço sagrado.
