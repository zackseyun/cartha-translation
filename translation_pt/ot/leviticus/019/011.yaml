  text: לֹ֖א תִּגְנֹ֑בוּ וְ/לֹא תְכַחֲשׁ֥וּ וְ/לֹֽא תְשַׁקְּר֖וּ אִ֥ישׁ בַּ/עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: pt
  text: Não roubem, não ajam falsamente e não mintam uns aos outros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um homem ao seu companheiro” ou, distributivamente, “cada um ao seu próximo”.
    reason: Registra a construção distributiva hebraica אִישׁ בַּעֲמִיתוֹ e alternativas para עמית, vertida idiomaticamente no texto como “uns aos outros”.
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: não roubem
  rationale: O qal imperfeito com לֹא tem força proibitiva. “Roubar” expressa de modo direto e comum o sentido de גנב, sem introduzir a distinção jurídica moderna entre roubo e furto.
- source_word: תְכַחֲשׁוּ
  choice: não ajam com falsidade
  rationale: O piel de כחש pode indicar enganar, negar ou proceder falsamente. A formulação escolhida preserva essa amplitude e evita restringir a proibição apenas à mentira verbal.
- source_word: תְשַׁקְּרוּ
  choice: não mintam
  rationale: O piel de שקר denota aqui mentir ou agir falsamente. “Mentir” é a expressão portuguesa mais natural no contexto interpessoal e mantém a distinção em relação à proibição anterior.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: uns aos outros
  rationale: A expressão, literalmente distributiva, tem sentido recíproco neste contexto. “Uns aos outros” comunica isso com naturalidade e sem sugerir que a ordem se limita aos homens.
- source_word: עֲמִית
  choice: outros (na expressão “uns aos outros”)
  rationale: עמית designa um companheiro, semelhante ou membro da comunidade. Integrado à construção recíproca, “uns aos outros” transmite idiomaticamente a relação interpessoal.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ ... עֲמִיתוֹ
  choice: 'Tradução inclusiva e recíproca: “uns aos outros”'
  alternative: “cada homem ao seu próximo” ou “um homem ao seu companheiro”
  rationale: O masculino singular hebraico tem função representativa e distributiva, não restringindo a proibição aos homens. A tradução comunica o alcance geral sem apagar a forma literal, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com imperativos negativos diretos. A coordenação compacta preserva a sequência enfática de três proibições do hebraico.
