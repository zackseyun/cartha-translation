  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: pt
  text: Portanto, observem todos os meus estatutos e todos os meus juízos[a] e cumpram-nos. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus decretos” em vez de “meus estatutos”, e “minhas normas” ou “minhas ordenanças” em vez de “meus juízos”. O hebraico emprega dois termos jurídicos distintos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Portanto, observem
  rationale: שׁמר, em contexto jurídico e pactual, significa guardar ou observar. “Observem” é natural no português atual quando o objeto são leis. “Portanto” expressa a função conclusiva e resumidora do versículo, embora a conjunção também possa ser traduzida simplesmente por “E”.
- source_word: כָּל
  choice: todos
  rationale: Preserva a abrangência do hebraico nas duas ocorrências e concorda com os substantivos masculinos plurais em português.
- source_word: חֻקֹּתַי
  choice: meus estatutos
  rationale: חֻקִּים designa prescrições ou disposições estabelecidas. “Estatutos” mantém o registro jurídico e a distinção em relação a מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: meus juízos
  rationale: מִשְׁפָּטִים pode indicar juízos, decisões jurídicas ou normas. “Juízos” preserva a distinção entre os dois termos legais hebraicos sem restringir indevidamente o sentido.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: e cumpram-nos
  rationale: עשה com prescrições legais significa fazer, executar ou cumprir. “Cumpram-nos” comunica naturalmente a prática efetiva das determinações e conserva o objeto plural explícito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como o nome pessoal divino; “Yahweh” o translitera, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Relação entre observar e praticar as determinações
  choice: “observem” e “cumpram-nos” como ações coordenadas
  alternative: Fundir as duas expressões em “obedeçam”
  rationale: A tradução mantém a tensão e a ênfase do hebraico entre conservar cuidadosamente as determinações e efetivamente colocá-las em prática.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na terceira pessoa do plural, de ampla legibilidade brasileira. O registro jurídico é preservado sem recorrer a construções excessivamente arcaicas.
