id: LEV.19.3
reference: Leviticus 19:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: pt
  text: Cada homem[a] deve temer[b] sua mãe e seu pai; e vocês devem guardar os meus sábados. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Cada pessoa”. O hebraico diz literalmente “cada homem”, usando o masculino singular de modo distributivo para se referir aos membros da comunidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “deve reverenciar”. O verbo hebraico pode indicar temor no sentido de reverência ou profundo respeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Cada homem
  rationale: O substantivo masculino singular introduz distributivamente a ordem dirigida à comunidade. A tradução conserva a forma masculina representativa do hebraico; a abrangência comunitária é indicada em nota.
- source_word: אִמּוֹ וְאָבִיו
  choice: sua mãe e seu pai
  rationale: Mantém os dois termos de parentesco e a ordem marcada do hebraico, que menciona a mãe antes do pai, sem reduzi-los a “pais”.
- source_word: תִּירָאוּ
  choice: deve temer
  rationale: O verbo ירא pode expressar temor, reverência ou assombro respeitoso. “Temer” preserva sua força lexical e ética, enquanto a nota esclarece a nuance reverencial possível.
- source_word: שַׁבְּתֹתַי
  choice: os meus sábados
  rationale: Conserva tanto o plural explícito quanto o possessivo divino, apresentando esses tempos sagrados como pertencentes a Yahweh.
- source_word: תִּשְׁמֹרוּ
  choice: devem guardar
  rationale: שׁמר abrange guardar, observar e cumprir cuidadosamente. “Guardar os sábados” é uma formulação bíblica inteligível e preserva a ideia de observância atenta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função pessoal na fórmula da aliança.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Neste contexto, אֱלֹהִים se refere no singular ao Deus de Israel; o sufixo plural é representado naturalmente por “de vocês”.
theological_decisions:
- issue: Força afetiva da ordem relativa aos pais
  choice: temer sua mãe e seu pai
  alternative: reverenciar sua mãe e seu pai
  rationale: “Temer” mantém a amplitude e a força de ירא sem decidir que o termo significa apenas respeito; a nota registra a leitura reverencial adequada ao contexto.
- issue: Representação de gênero no singular distributivo inicial
  choice: Cada homem
  alternative: Cada pessoa
  rationale: O hebraico emprega אִישׁ, masculino singular, de modo distributivo. A forma é preservada no texto, e a abrangência comunitária é explicitada em nota.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o tetragrama יהוה. A transliteração preserva o nome próprio no lugar de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. “Deve/devem” expressa a força normativa sem recorrer ao futuro jurídico mais rígido. A mudança de “Cada homem” para “vocês” acompanha de modo natural a perspectiva distributiva inicial e a forma plural dos verbos hebraicos.
