source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: pt
  text: Não ande espalhando calúnias no meio do seu povo. Não se ponha contra o sangue do seu próximo.[a] Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não fique parado enquanto o sangue do seu próximo é derramado.”'
    reason: Leitura alternativa da expressão hebraica, que pode proibir a omissão diante de perigo mortal ou de derramamento de sangue.
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: ande espalhando calúnias
  rationale: A combinação idiomática descreve alguém que circula pela comunidade divulgando acusações ou relatos prejudiciais. A formulação mantém a imagem de movimento de הלך e expressa com naturalidade a gravidade de רָכִיל.
- source_word: בְּעַמֶּיךָ
  choice: no meio do seu povo
  rationale: A preposição בְּ indica atuação dentro da comunidade; “no meio do seu povo” é claro e idiomático em português.
- source_word: תַעֲמֹד עַל
  choice: se levante contra
  rationale: עמד significa basicamente “ficar de pé/levantar-se”, e על pode aqui indicar oposição. A tradução conserva a imagem hebraica e sua formulação tensa, sem eliminar a leitura alternativa de omissão passiva.
- source_word: דַּם
  choice: sangue
  rationale: A escolha mantém a concretude do hebraico, no qual “sangue” pode representar a vida, o derramamento de sangue ou a responsabilidade por uma morte.
- source_word: רֵעֶךָ
  choice: seu próximo
  rationale: Neste contexto ético e comunitário, רֵעַ designa o semelhante ou membro da comunidade; “próximo” é uma tradução estabelecida e adequada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  choice: Proibição de se colocar contra o sangue, e portanto contra a vida, do próximo, mantendo no texto a linguagem concreta e concisa do hebraico.
  alternative: Proibição de ficar passivamente parado enquanto o sangue do próximo é derramado; também se propõe a leitura de não depor contra o próximo num caso capital.
  rationale: A expressão hebraica é breve e admite nuances de ação hostil, cumplicidade ou omissão diante de perigo mortal. O texto principal preserva “sangue” e traduz על como “contra”; a leitura amplamente reconhecida de omissão é registrada em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Ande espalhando calúnias” evita o arcaísmo de “mexeriqueiro” e comunica a circulação ativa de relatos danosos. A segunda frase conserva deliberadamente uma formulação marcada para refletir a concisão e a ambiguidade do hebraico.
