  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: pt
  text: Não se aproximará de nenhum cadáver[a]; nem mesmo por seu pai ou por sua mãe se tornará impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corpo morto”. A expressão hebraica, literalmente “pessoas mortas”, é um modo de se referir a um cadáver nas leis de pureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל ... לֹא יָבֹא
  choice: não se aproximará
  rationale: Com בוא e עַל neste contexto de pureza sacerdotal, a expressão proíbe aproximar-se de um morto, e não apenas ir a determinado lugar. O futuro com valor prescritivo preserva o tom jurídico.
- source_word: כָּל
  choice: nenhum
  rationale: Sob negação, “nenhum” expressa de modo natural em português a abrangência total da proibição.
- source_word: נַפְשֹׁת מֵת
  choice: cadáver
  rationale: A expressão, literalmente relacionada a uma pessoa ou vida morta, funciona nas leis de pureza como referência metonímica ao corpo humano morto. “Cadáver” é claro e evita a leitura enganosa de “alma do morto”.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: por seu pai ou por sua mãe
  rationale: A preposição indica a pessoa em razão de quem alguém poderia contrair impureza. “Ou” comunica naturalmente o sentido distributivo.
- source_word: לֹא יִטַּמָּא
  choice: não se tornará impuro
  rationale: A forma reflexiva de טמא indica que ele não deve incorrer em impureza. A formulação preserva a categoria ritual sem sugerir necessariamente culpa moral.
- source_word: ordem das palavras / ênfase implícita
  choice: nem mesmo
  rationale: A menção do pai e da mãe após a proibição geral nega até a exceção familiar mais próxima; “nem mesmo” torna essa ênfase natural em português.
theological_decisions:
- issue: Terminologia de impureza ritual
  choice: tornar-se impuro
  alternative: contaminar-se; tornar-se cerimonialmente impuro
  rationale: “Impuro” mantém a categoria bíblica de pureza sacerdotal sem transformá-la em linguagem de pecado moral. “Cerimonialmente” explicaria além do que o texto afirma explicitamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Cadáver” é preciso no contexto legal, enquanto “não se aproximará” e “não se tornará impuro” preservam o caráter prescritivo e ritual do hebraico.
