base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: pt
  text: Nenhum homem da descendência do sacerdote Arão que tenha algum defeito se aproximará para apresentar as ofertas de alimento de Yahweh.[a] Ele tem um defeito; não se aproximará para apresentar o pão de seu Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as ofertas queimadas de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: “O pão de seu Deus” é uma expressão sacerdotal para o alimento apresentado a Deus em sacrifício; também pode ser traduzido como “o alimento de seu Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: Nenhum homem
  rationale: A combinação do sujeito universal com a negação na oração principal expressa uma proibição abrangente. “Homem” preserva a forma masculina e o contexto do sacerdócio aarônico.
- source_word: מוּם
  choice: defeito
  rationale: Neste contexto sacerdotal, designa uma condição corporal que impedia o exercício de determinadas funções cultuais. “Defeito” é atual e direto, sem acrescentar especificações ausentes do hebraico.
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: da descendência do sacerdote Arão
  rationale: זֶרַע indica linhagem ou descendência; a formulação portuguesa é natural e mantém הַכֹּהֵן ligado a Arão.
- source_word: יִגַּשׁ
  choice: se aproximará
  rationale: No contexto cultual, נגשׁ descreve aproximar-se para exercer o serviço sacrificial. A mesma tradução é repetida nas duas ocorrências.
- source_word: לְהַקְרִיב
  choice: para apresentar
  rationale: No uso sacrificial, הקריב significa fazer chegar ou apresentar uma oferta. “Apresentar” preserva a relação etimológica e contextual com o ato de aproximação sem soar artificial.
- source_word: אִשֵּׁי יְהוָה
  choice: as ofertas de alimento de Yahweh
  rationale: אִשֶּׁה é um termo sacrificial tradicionalmente associado ao fogo, mas provavelmente ligado aqui às ofertas destinadas a Deus. “Ofertas de alimento” mantém o paralelismo com לֶחֶם אֱלֹהָיו; a tradução tradicional é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לֶחֶם אֱלֹהָיו
  choice: o pão de seu Deus
  rationale: לֶחֶם significa literalmente “pão” e, na linguagem sacerdotal, pode designar de modo mais amplo o alimento sacrificial apresentado a Deus. O idioma cultual é preservado no texto e explicado em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome pessoal divino; “Yahweh” o representa diretamente, sem converter o nome em título.
- issue: Sentido cultual de אִשֵּׁי יְהוָה
  choice: ofertas de alimento de Yahweh
  alternative: ofertas queimadas de Yahweh
  rationale: A escolha mantém a relação semântica com “o pão de seu Deus” na segunda metade do versículo, enquanto a nota preserva a tradução tradicional ligada ao fogo.
- issue: Alcance de מוּם
  choice: defeito
  alternative: defeito físico
  rationale: Embora o contexto anterior descreva condições corporais, não se acrescenta “físico” neste versículo, preservando a concisão e a formulação do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Conservam-se a repetição jurídica de “defeito” e “se aproximará” e o idioma sacerdotal “pão de seu Deus”.
