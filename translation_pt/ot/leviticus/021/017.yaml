  text: דַּבֵּ֥ר אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אִ֣ישׁ מִֽ/זַּרְעֲ/ךָ֞ לְ/דֹרֹתָ֗/ם אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְ/הַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: pt
  text: 'Fale a Arão, dizendo: Qualquer homem dentre os seus descendentes, por todas as gerações, que tiver algum defeito[a] não se aproximará para oferecer o alimento[b] de seu Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “imperfeição”. O hebraico mum refere-se aqui a uma condição física que desqualificava a pessoa para esta função sacerdotal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o pão de seu Deus”. Neste contexto sacerdotal, “pão” designa de modo mais amplo o alimento das ofertas sacrificiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: Fale a Arão, dizendo
  rationale: Mantém a fórmula hebraica que introduz uma ordem, com linguagem clara e digna em português.
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: Qualquer homem dentre os seus descendentes
  rationale: O masculino singular refere-se aos descendentes homens de Arão que poderiam exercer o sacerdócio; “descendentes” comunica a linhagem de modo natural.
- source_word: לְדֹרֹתָם
  choice: por todas as gerações
  rationale: Expressa a vigência contínua da norma nas sucessivas gerações da linhagem sacerdotal.
- source_word: מוּם
  choice: defeito
  rationale: No contexto sacerdotal, designa uma condição física que impedia o exercício desta função ritual. “Defeito” é claro e menos sujeito a sugerir algo meramente cosmético do que “mancha”.
- source_word: לֹא יִקְרַב
  choice: não se aproximará
  rationale: Preserva tanto a força normativa do futuro hebraico quanto a linguagem técnica de aproximação no culto.
- source_word: לְהַקְרִיב
  choice: para oferecer
  rationale: O infinitivo causativo de קרב refere-se aqui à apresentação de ofertas; “oferecer” é a expressão portuguesa mais idiomática nesse contexto.
- source_word: לֶחֶם אֱלֹהָיו
  choice: o alimento de seu Deus
  rationale: Embora לֶחֶם signifique literalmente “pão”, neste contexto sacerdotal a expressão abrange o alimento apresentado em ofertas sacrificiais.
theological_decisions:
- issue: Restrição cultual relativa a sacerdotes com condições físicas
  choice: Apresentar a norma como restrição ao ato sacerdotal de aproximar-se para oferecer o alimento sacrificial.
  alternative: Empregar linguagem que sugira culpa moral, menor dignidade pessoal ou exclusão geral da aliança.
  rationale: O versículo limita uma função sacerdotal específica; não afirma culpa moral nem menor valor humano.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação conserva a linguagem jurídica e cultual do hebraico sem atribuir à condição física qualquer sentido moral não expresso no texto.
