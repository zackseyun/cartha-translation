  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: pt
  text: 'Yahweh disse a Moisés: “Fale aos sacerdotes, filhos de Arão, e diga-lhes: Nenhum deles se tornará impuro[a] por causa de uma pessoa morta[b] entre o seu povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se tornará ritualmente impuro” ou “se contaminará”. O hebraico se refere à impureza ritual causada pelo contato com os mortos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por uma נֶפֶשׁ (néfesh)”. Neste contexto das leis de pureza, a palavra é uma expressão para uma pessoa morta ou um cadáver.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: Fale ... e diga-lhes
  rationale: Preserva a repetição do verbo אמר e mantém uma formulação natural em português.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: os sacerdotes, filhos de Arão
  rationale: Mantém a aposição que identifica os sacerdotes como filhos ou descendentes de Arão.
- source_word: לְנֶפֶשׁ
  choice: por causa de uma pessoa morta
  rationale: No contexto das leis de pureza, נֶפֶשׁ designa idiomaticamente uma pessoa morta ou um cadáver, não uma 'alma'.
- source_word: יִטַּמָּא
  choice: se tornará impuro
  rationale: Expressa a impureza ritual contraída pelo contato com os mortos, sem sugerir necessariamente culpa moral.
- source_word: בְּעַמָּיו
  choice: entre o seu povo
  rationale: Reproduz de modo direto a referência ao povo ou grupo de parentesco do sacerdote; os versículos seguintes especificam as exceções familiares.
theological_decisions:
- issue: Natureza da impureza na legislação sacerdotal
  choice: se tornará impuro
  alternative: se contaminará / se profanará
  rationale: O contexto trata de impureza ritual decorrente de contato com mortos, e não afirma diretamente uma contaminação moral.
- issue: Referência individual dentro da ordem coletiva
  choice: Nenhum deles
  alternative: Ele não se tornará impuro
  rationale: A ordem é dirigida aos sacerdotes no plural, mas o verbo hebraico está no singular e aplica a proibição a cada sacerdote individualmente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição hebraica foi mantida em “Fale ... e diga-lhes”, e a formulação “Nenhum deles” torna natural a aplicação distributiva da proibição.
