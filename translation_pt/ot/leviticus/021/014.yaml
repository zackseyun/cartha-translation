reference: Leviticus 21:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: pt
  text: 'Não tomará por esposa nenhuma destas: viúva, divorciada, mulher profanada[a] ou prostituta. Tomará por esposa somente uma virgem dentre o seu povo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulher desonrada”; o termo hebraico indica uma mulher cuja condição era considerada incompatível com as exigências de santidade para o casamento sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: viúva
  rationale: Equivalente direto e corrente do substantivo hebraico no contexto de restrições matrimoniais.
- source_word: גְרוּשָׁה
  choice: divorciada
  rationale: O particípio passivo designa uma mulher que foi mandada embora no sentido jurídico-conjugal, isto é, divorciada.
- source_word: חֲלָלָה
  choice: mulher profanada[a]
  rationale: Mantém a ligação do termo com a ideia de profanação e de condição incompatível com a santidade sacerdotal; a nota registra alternativas para este termo técnico.
- source_word: זֹנָה
  choice: prostituta
  rationale: Equivalente contemporâneo, claro e não arcaico para o substantivo hebraico.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: Não tomará por esposa nenhuma destas
  rationale: Explicita o sentido matrimonial do verbo 'tomar' e conserva a referência coletiva do demonstrativo às categorias enumeradas.
- source_word: כִּי אִם
  choice: somente
  rationale: Após a proibição, a expressão introduz a única alternativa permitida.
- source_word: בְּתוּלָה
  choice: uma virgem
  rationale: Expressa de modo preciso o sentido do termo neste contexto de legislação matrimonial.
- source_word: מֵעַמָּיו
  choice: dentre o seu povo
  rationale: Conserva a ideia de procedência de dentro do grupo ao qual ele pertence, sem especificar além do texto.
- source_word: יִקַּח אִשָּׁה
  choice: Tomará por esposa
  rationale: Reproduz de forma natural em português o idioma hebraico de tomar uma mulher como esposa.
theological_decisions:
- issue: Sentido de חֲלָלָה na restrição matrimonial sacerdotal
  choice: mulher profanada
  alternative: mulher desonrada; mulher de condição sacerdotalmente desqualificada
  rationale: O termo pertence ao campo semântico da profanação em contraste com a santidade, mas sua aplicação exata à condição da mulher é técnica e discutida. O texto principal preserva a imagem hebraica, e a nota esclarece a implicação jurídica sem atribuir uma causa específica não declarada no versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação jurídica conserva o futuro prescritivo e explicita 'por esposa' para comunicar o sentido matrimonial de לָקַח.
