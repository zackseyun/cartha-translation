review_pass:
  verdict: revise
  source_fidelity: A tradução identifica corretamente o sumo sacerdote, a unção com óleo, as vestes e as duas proibições. Contudo, “cuja mão foi cheia” é um decalque que não funciona de modo inteligível em português moderno; o idiomatismo hebraico designa a consagração/instalação sacerdotal. “O maior entre seus irmãos” também pode sugerir tamanho ou excelência genérica, em vez de precedência hierárquica.
  naturalness: O texto é em geral claro e de registro adequado, mas “cuja mão foi cheia para usar as vestes” é muito artificial e interrompe a leitura. “Não deixará o cabelo solto” transmite naturalmente o gesto de luto sem apresentar “desgrenhado” como uma especificação excessivamente certa.
  terminology: “Sumo sacerdote”, “óleo da unção” e “vestes” são termos estabelecidos e apropriados. “Consagrado” é uma tradução idiomática segura para a fórmula hebraica de encher a mão, com a formulação literal preservada em nota.
  issues:
  - severity: medium
    issue: O idiomatismo de ordenação foi vertido literalmente como “cuja mão foi cheia”.
    rationale: Embora a nota o explique, a expressão não é um idiomatismo português e, na oração “foi cheia para usar as vestes”, não comunica de forma natural a consagração sacerdotal indicada pelo hebraico. Uma tradução idiomática no texto, com nota literal, preserva tanto o sentido quanto a auditabilidade.
  - severity: low
    issue: “O maior entre seus irmãos” é potencialmente ambíguo em português.
    rationale: A comparação hebraica assinala a posição superior do sacerdote entre seus pares. “Superior a seus irmãos” comunica essa relação mais diretamente, sem alterar o referente masculino e corporativo.
  - severity: low
    issue: “Cabelo desgrenhado” torna a interpretação cultural um pouco mais específica do que o texto hebraico.
    rationale: O verbo se refere ao cabelo deixado solto ou sem arranjo como sinal de luto. “Cabelo solto”, com nota explicativa, mantém melhor essa margem semântica.
  revised_text: O sumo sacerdote, que é superior a seus irmãos, sobre cuja cabeça foi derramado o óleo da unção e que foi consagrado para vestir as vestes[a], não deixará o cabelo solto[b] nem rasgará suas vestes.
