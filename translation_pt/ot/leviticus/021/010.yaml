    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não deixará sua cabeça solta”. A expressão se refere a deixar o cabelo solto ou sem cuidado, um sinal costumeiro de luto.
    reason: cultural_note
  revision_rationale: A revisão substitui o decalque português ininteligível do idiomatismo hebraico por “foi consagrado”, conservando a expressão literal e sua explicação na nota. Também torna explícita a relação de precedência em מֵאֶחָיו e escolhe uma formulação um pouco menos interpretativa para o sinal de luto. O sentido, o paralelismo e os dois pontos de ancoragem das notas são preservados.
