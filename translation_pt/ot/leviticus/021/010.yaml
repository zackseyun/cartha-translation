base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: pt
  text: O sumo sacerdote, que é superior a seus irmãos, sobre cuja cabeça foi derramado o óleo da unção e que foi consagrado para vestir as vestes[a], não deixará o cabelo solto[b] nem rasgará suas vestes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cuja mão foi cheia”. Em hebraico, é uma expressão idiomática para ser ordenado ou investido no serviço sacerdotal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não deixará sua cabeça solta”. A expressão se refere a deixar o cabelo solto ou sem cuidado, um sinal costumeiro de luto.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: O sumo sacerdote, o maior entre seus irmãos
  rationale: “Sumo sacerdote” é a designação corrente e precisa do ofício em português. A expressão comparativa “o maior entre seus irmãos” preserva מֵאֶחָיו e indica sua posição elevada entre os demais sacerdotes, sem substituir “irmãos” por uma expressão neutra.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: sobre cuja cabeça foi derramado o óleo da unção
  rationale: Mantém a construção passiva e a imagem ritual concreta do óleo sendo derramado sobre a cabeça.
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: cuja mão foi cheia
  rationale: Preserva no texto o idiomatismo cultual hebraico, enquanto a nota esclarece seu sentido de ordenação ou investidura sacerdotal.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: para usar as vestes
  rationale: Expressa naturalmente o infinitivo e evita a repetição pouco elegante “vestir as vestes”, sem acrescentar “sacerdotais”, que já está implícito no contexto.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: não deixará o cabelo desgrenhado
  rationale: 'Comunica em português atual o provável sentido do gesto de luto: deixar solto ou sem cuidado o cabelo da cabeça. A nota preserva a forma concreta e a margem de ambiguidade da expressão hebraica.'
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: nem rasgará suas vestes
  rationale: Tradução direta e clara do gesto convencional de luto, mantendo o paralelismo com a proibição anterior.
theological_decisions:
- issue: Tradução do idiomatismo de ordenação מִלֵּא אֶת יָדוֹ
  choice: Manter “cuja mão foi cheia” no texto e explicar o sentido em nota.
  alternative: “que foi ordenado” ou “que foi investido”
  rationale: A formulação literal conserva uma imagem ritual teologicamente significativa do hebraico; a nota oferece ao leitor o sentido idiomático sem apagar a expressão original.
- issue: Identidade e posição do sacerdote em הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: “O sumo sacerdote, o maior entre seus irmãos”
  alternative: “O sacerdote principal entre seus irmãos”
  rationale: A escolha mantém a designação tradicional e contextualmente precisa do ofício, além da comparação explícita com seus irmãos, isto é, os demais sacerdotes.
- issue: Sentido do sinal de luto em אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: “não deixará o cabelo desgrenhado”
  alternative: “não descobrirá a cabeça” ou “não deixará o cabelo solto”
  rationale: O contexto de luto favorece cabelo solto ou sem cuidado, mas a nota reconhece a formulação metonímica do hebraico e evita apresentar uma reconstrução cultural excessivamente específica como indiscutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva-se o termo bíblico corrente “sumo sacerdote” e o idiomatismo ritual “cuja mão foi cheia”, esclarecido em nota. Evitaram-se arcaísmos como “fará lamentação” ou “rasgará as suas vestiduras”.
