lexical_decisions:
- source_word: אוֹ
  choice: ou
  rationale: Conjunção disjuntiva simples que dá continuidade à lista de condições físicas desqualificadoras.
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo hebraico masculino singular refere-se, neste contexto legal sacerdotal, a um sacerdote do sexo masculino.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: que tenha
  rationale: A construção significa literalmente «em quem houver», mas «que tenha» expressa a condição de modo natural e fiel em português.
- source_word: שֶׁבֶר
  choice: quebrado / quebrada
  rationale: O substantivo denota quebra ou fratura. A formulação com «quebrado» é corrente, clara e menos clínica que «fraturado», com concordância de gênero em português.
- source_word: רָגֶל
  choice: pé
  rationale: «Pé» é o sentido lexical básico; embora o termo possa, em certos contextos, abranger a perna, nada aqui exige essa ampliação.
- source_word: שֶׁבֶר יָד
  choice: a mão quebrada
  rationale: Preserva a repetição da construção hebraica e traduz יָד diretamente como «mão»; não há necessidade contextual de ampliar o sentido para «braço».
