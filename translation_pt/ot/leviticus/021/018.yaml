source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: pt
  text: 'Pois nenhum homem que tenha algum defeito não se aproximará[a]: homem cego, ou manco, ou com alguma parte do rosto mutilada[b], ou com um membro desproporcional[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, «aproximar-se» refere-se à aproximação para o serviço sacerdotal.
    reason: cultural_note
  - marker: b
    text: O termo hebraico é raro e pode indicar mais especificamente um nariz mutilado ou malformado.
    reason: lexical_alternative
  - marker: c
    text: Ou «com um membro alongado ou deformado». O hebraico provavelmente se refere a uma parte do corpo desproporcional.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da restrição precedente e soa natural em português.
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: nenhum homem que tenha algum defeito
  rationale: A construção com negação equivale a “nenhum homem”; “homem” preserva o referente masculino no contexto dos sacerdotes aarônicos, e “defeito” expressa מוּם como condição física desqualificadora neste âmbito ritual.
- source_word: לֹא יִקְרָב
  choice: poderá se aproximar para o serviço sacerdotal
  rationale: קרב indica aqui a aproximação cultual própria do sacerdote. A explicitação evita que a frase seja entendida como proibição geral de proximidade social.
- source_word: אִישׁ עִוֵּר
  choice: nenhum homem cego
  rationale: Tradução direta e corrente da expressão hebraica, mantendo explícito o referente humano.
- source_word: פִסֵּחַ
  choice: manco
  rationale: Equivalente atual e conciso para uma pessoa cuja locomoção é afetada, sem recorrer a formulação mais pejorativa.
- source_word: חָרֻם
  choice: com alguma parte do rosto mutilada
  rationale: O termo raro provavelmente indica mutilação ou malformação, tradicionalmente associada ao nariz ou ao rosto; a formulação comunica o sentido provável sem impor precisão indevida.
- source_word: שָׂרוּעַ
  choice: com algum membro desproporcional
  rationale: O termo provavelmente descreve uma parte do corpo alongada, excessiva ou deformada; “desproporcional” preserva essa amplitude sem especificar com certeza que o membro era longo.
theological_decisions:
- issue: Natureza da restrição na legislação sacerdotal
  choice: Apresentar a aproximação como serviço sacerdotal, isto é, uma qualificação cultual.
  alternative: Deixar “aproximar-se” sem explicação, o que poderia ser entendido como exclusão social geral.
  rationale: O contexto restringe a norma ao exercício sacerdotal diante do santuário; ela não formula um juízo sobre valor pessoal ou condição moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução explicita apenas no ponto necessário o âmbito sacerdotal, evita linguagem socialmente excludente além do texto e conserva a incerteza dos dois termos físicos raros por meio de notas.
