  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: pt
  text: Não farão uma área calva na cabeça, não rasparão a borda da barba[a] nem farão cortes na própria carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a extremidade”, “o lado” ou “o canto da barba”. O termo hebraico pode indicar extremidade, borda, lado ou canto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: farão uma calva
  rationale: A combinação de verbo e substantivo descreve a produção intencional de uma área sem cabelo, não a calvície natural. A formulação é concreta, concisa e compreensível em português.
- source_word: בְּרֹאשָׁם
  choice: na cabeça
  rationale: O hebraico emprega o substantivo no singular com sufixo plural; o singular distributivo é natural em português e mantém de perto a forma da fonte.
- source_word: פְאַת זְקָנָם
  choice: a extremidade da barba
  rationale: פאה pode indicar extremidade, borda, lado ou canto. “Extremidade” preserva a imagem sem definir com precisão indevida o padrão de corte.
- source_word: יְגַלֵּחוּ
  choice: rasparão
  rationale: O piel indica a remoção dos pelos; “raspar” expressa com naturalidade essa ação em relação à barba.
- source_word: וּבִבְשָׂרָם
  choice: na própria carne
  rationale: בשר significa literalmente “carne”. A inclusão de “própria” torna clara a referência distributiva aos corpos dos sacerdotes sem enfraquecer a concretude do hebraico.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: farão cortes
  rationale: A construção de verbo e substantivo denota incisões ou lacerações corporais. “Farão cortes” é direto e evita linguagem excessivamente clínica.
theological_decisions:
- issue: Natureza da proibição
  choice: Apresentar as ações corporais proibidas sem acrescentar sua possível relação com ritos de luto pelos mortos.
  alternative: Explicitar “por causa de um morto” com base em Levítico 19:28 e Deuteronômio 14:1.
  rationale: O versículo proíbe concretamente essas ações, mas não contém a explicação presente em passagens paralelas. A tradução não deve importar essa informação para o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com singular distributivo natural. “Carne” conserva a concretude do original, e “extremidade” mantém aberta a localização exata indicada por פאה.
