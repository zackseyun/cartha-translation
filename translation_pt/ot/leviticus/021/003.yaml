  text: וְ/לַ/אֲחֹת֤/וֹ הַ/בְּתוּלָה֙ הַ/קְּרוֹבָ֣ה אֵלָ֔י/ו אֲשֶׁ֥ר לֹֽא הָיְתָ֖ה לְ/אִ֑ישׁ לָ֖/הּ יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: pt
  text: e por sua irmã virgem, próxima dele[a], que não teve marido[b], ele poderá tornar-se impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que lhe é próxima”. A expressão hebraica indica proximidade de parentesco.
    reason: Preserva a imagem de proximidade da expressão hebraica sem substituir “irmã” por “parenta” nem reduzi-la a proximidade emocional ou espacial.
  - marker: b
    text: Ou “que não se uniu a homem algum”. A expressão hebraica é idiomática e pode referir-se a não ter entrado em casamento ou união com um homem.
    reason: Registra a amplitude da locução hebraica e evita restringi-la indevidamente a uma única leitura.
lexical_decisions:
- source_word: וְ/לַ/אֲחֹתוֹ
  choice: e por sua irmã
  rationale: A conjunção e a preposição acrescentam outro caso permitido à lista; o sufixo pronominal é expresso naturalmente por “sua irmã”.
- source_word: הַבְּתוּלָה
  choice: virgem
  rationale: Preserva diretamente a referência à condição sexual da irmã, relevante para a delimitação legal.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: próxima dele
  rationale: Mantém a imagem hebraica de proximidade, entendida no contexto como vínculo familiar próximo, sem reduzi-la apenas a proximidade emocional ou espacial.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: que ainda não se uniu a homem algum
  rationale: Expressa em português corrente a locução hebraica idiomática, que indica não ter entrado em união conjugal ou sexual com um homem; “ainda” torna natural a condição descrita sem alterar seu sentido.
- source_word: לָהּ
  choice: incorporado idiomaticamente em “se uniu”
  rationale: A relação gramatical é absorvida pela construção portuguesa, evitando uma reprodução literal ininteligível.
- source_word: יִטַּמָּא
  choice: ele poderá tornar-se impuro
  rationale: O contexto autoriza ao sacerdote contrair impureza por causa do cadáver de uma parenta próxima. “Tornar-se impuro” comunica condição ritual, e “poderá” expressa a permissão contextual.
theological_decisions:
- issue: Natureza da impureza na legislação sacerdotal
  choice: “tornar-se impuro”, no sentido ritual
  alternative: “contaminar-se” ou “profanar-se”, com possível conotação moral
  rationale: O contexto trata da impureza sacerdotal decorrente do contato com mortos, não de corrupção moral ou pecado pessoal.
- issue: Alcance de אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: união com um homem, deixando explícita em nota a possível dimensão conjugal ou sexual
  alternative: restringir a expressão a “não se casou” ou traduzi-la formalmente como “não pertenceu a um homem”
  rationale: A formulação hebraica é idiomática e admite referência ao casamento e à união sexual. O texto principal deve ser compreensível sem encerrar indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A construção evita linguagem arcaica e preserva a categoria levítica de impureza ritual.
