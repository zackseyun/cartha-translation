base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/024.yaml
  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: pt
  text: Assim, Moisés falou a Arão, aos filhos de Arão e a todos os filhos de Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”, uma designação coletiva comum para o povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Assim, Moisés falou
  rationale: A forma narrativa com waw faz o relato avançar e, neste encerramento de seção, tem força conclusiva ou resumitiva. “Assim” expressa essa função de modo natural; “falou” traduz diretamente דּבר.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz os destinatários da fala de Moisés; “a” é a correspondência direta e idiomática neste contexto.
- source_word: בָּנָיו
  choice: aos seus filhos
  rationale: O substantivo está no plural masculino com sufixo de terceira pessoa masculina singular e se refere especificamente aos filhos de Arão. A coordenação com “a Arão” torna natural em português a referência de “seus” a Arão.
- source_word: כָּל
  choice: todos
  rationale: Preserva o sentido abrangente de כָּל e concorda naturalmente com o grupo mencionado em seguida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de perto a forma hebraica, literalmente “filhos de Israel”, e preserva o caráter tradicional e pactual da designação. A alternativa idiomática “os israelitas” é registrada em nota.
theological_decisions:
- issue: Tradução da designação pactual בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A expressão funciona coletivamente como designação do povo de Israel, mas sua forma hebraica masculina e filial é preservada no texto. A nota esclarece tanto a equivalência idiomática quanto o alcance corporativo, sem impor uma interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Assim” comunica o caráter conclusivo do versículo; a construção mantém a concisão e a repetição estrutural do hebraico.
