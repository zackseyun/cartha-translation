  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: pt
  text: Ele poderá comer do alimento de seu Deus[a], tanto das coisas santíssimas como das coisas santas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do pão de seu Deus”. Aqui, “pão” é usado em sentido amplo para as porções de alimento destinadas aos sacerdotes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: alimento
  rationale: Embora o sentido básico seja “pão”, neste contexto sacrificial e legal o termo abrange as porções alimentares sacerdotais. “Alimento” comunica o valor idiomático sem restringi-lo a pão assado.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Preserva o sufixo possessivo masculino singular e a formulação relacional do hebraico.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: das coisas santíssimas
  rationale: A construção expressa o grau superlativo de santidade e designa a categoria cultual mais sagrada.
- source_word: וּמִן הַקֳּדָשִׁים
  choice: como das coisas santas
  rationale: Mantém a ligação lexical com a raiz קדש e o contraste legal entre as duas categorias de porções sagradas; “tanto... como...” expressa naturalmente a coordenação em português.
- source_word: יֹאכֵל
  choice: poderá comer
  rationale: 'No contexto legal, o imperfeito indica permissão: apesar da restrição sacerdotal precedente, ele continua autorizado a comer dessas porções.'
theological_decisions:
- issue: Força do imperfeito legal יֹאכֵל na legislação sacerdotal
  choice: permissão (“poderá comer”)
  alternative: futuro simples (“comerá”) ou obrigação (“deverá comer”)
  rationale: O contexto contrasta aquilo que o sacerdote com deficiência não pode fazer com aquilo que ainda lhe é permitido. A formulação permissiva preserva esse contraste sem transformar a autorização em obrigação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Coisas santíssimas” e “coisas santas” preservam a terminologia cultual e a distinção interna do hebraico.
