id: LEV.21.23
reference: Leviticus 21:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: pt
  text: Contudo, ele não irá até o véu[a] nem se aproximará do altar, pois há nele um defeito[b], para que não profane os meus santuários[c], porque eu sou Yahweh, que os santifica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “cortina”. O termo hebraico designa o véu do santuário.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “há nele uma deficiência física”. O hebraico se refere a uma condição corporal que o impedia dessa aproximação sacerdotal, não a uma falha moral.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico traz “meus santuários”, no plural; algumas traduções empregam o singular, “meu santuário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Introduz a restrição que contrasta com a permissão do versículo anterior, em linguagem natural e digna.
- source_word: הַפָּרֹכֶת
  choice: o véu
  rationale: Designa a cortina do santuário; “véu” preserva o termo cultual tradicional sem perder clareza.
- source_word: יָבֹא אֶל
  choice: irá até
  rationale: Preserva o sentido direcional de vir/entrar até o véu sem confundi-lo com o verbo seguinte, que significa aproximar-se.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente corrente e preciso no contexto sacerdotal.
- source_word: יִגַּשׁ
  choice: se aproximará
  rationale: Expressa com naturalidade a linguagem sacerdotal de aproximação ao altar.
- source_word: מוּם בּוֹ
  choice: há nele um defeito
  rationale: Mantém a formulação hebraica e indica uma condição física que, nesta lei, impede determinada função sacerdotal, não uma culpa moral.
- source_word: יְחַלֵּל
  choice: profane
  rationale: Preserva o contraste sacerdotal entre o que é santo e aquilo que é tratado como comum.
- source_word: מִקְדָּשַׁי
  choice: os meus santuários
  rationale: Mantém explicitamente o plural do texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מְקַדְּשָׁם
  choice: que os santifica
  rationale: Conserva a terminologia de santidade e toma o sufixo plural como referência aos “santuários”, seu antecedente gramatical mais próximo.
theological_decisions:
- issue: Referente do sufixo em מְקַדְּשָׁם
  choice: “os” refere-se aos “meus santuários”
  alternative: O sufixo pode ser entendido de modo mais amplo como referência aos sacerdotes ou ao povo.
  rationale: “Meus santuários” é o antecedente plural mais próximo e combina diretamente com o contexto imediato dos espaços santos.
- issue: Sentido de מוּם na legislação sacerdotal
  choice: defeito
  alternative: “Deficiência” ou “imperfeição física”.
  rationale: O termo descreve uma condição corporal que restringe a aproximação cultual neste contexto; não indica pecado, culpa moral ou menor dignidade humana.
- issue: Relação expressa por וְלֹא יְחַלֵּל
  choice: “para que não profane”
  alternative: “e não profanará”.
  rationale: A formulação final pode expressar a finalidade ou consequência da restrição. A tradução escolhida reproduz essa conexão sem transformar a condição física em profanação automática.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A coordenação “não... nem...” é natural em português. Mantiveram-se o plural “santuários”, o nome Yahweh e a distinção lexical entre ir até o véu e aproximar-se do altar.
