  terminology: “Véu”, “altar”, “defeito”, “profane”, “santuários” e “santifica” são escolhas consistentes com o vocabulário cultual e de santidade do contexto. As notas explicam apropriadamente que o defeito em questão não é uma falha moral e preservam tanto a alternativa “cortina” quanto o plural hebraico de מִקְדָּשַׁי.
