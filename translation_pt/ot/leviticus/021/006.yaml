  to: Serão santos para o seu Deus e não profanarão o nome do seu Deus, pois apresentam as ofertas feitas pelo fogo a Yahweh, o alimento do seu Deus; e serão santos.
  rationale: A única alteração retira a inferência explícita introduzida por «por isso» e preserva a coordenação e a repetição enfática da santidade presentes no hebraico. Não são necessárias notas para a compreensão ou para resolver ambiguidade textual nesta formulação.
