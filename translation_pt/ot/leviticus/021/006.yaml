review_pass:
  verdict: revise
  source_fidelity: A tradução representa adequadamente a santidade exigida aos sacerdotes, a proibição de profanar o nome de Deus e a razão cultual dada pelo hebraico. «Ofertas feitas pelo fogo a Yahweh» comunica de modo compreensível o termo técnico אִשֵּׁי. Contudo, o וְ em וְהָיוּ קֹדֶשׁ é coordenativo e retoma a exigência de santidade; «por isso» impõe uma inferência que o texto não explicita.
  naturalness: O português é moderno, claro e adequado ao registro legislativo-cultual. A substituição de «por isso» por «e» torna o encerramento mais próximo do hebraico e igualmente natural.
  terminology: «Santos», «profanarão», «Yahweh», «ofertas feitas pelo fogo» e «alimento do seu Deus» preservam bem os termos cultuais e teológicos. «Alimento» transmite o uso amplo de לֶחֶם no contexto sacrificial sem restringi-lo a pão.
  issues:
  - severity: low
    issue: «por isso» em «por isso, serão santos»
    rationale: O hebraico traz simplesmente a conjunção וְ, que pode coordenar e reiterar a obrigação. A formulação inferencial é possível como interpretação discursiva, mas acrescenta uma relação conclusiva mais forte do que a marcada no original.
