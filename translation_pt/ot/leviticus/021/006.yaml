  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: pt
  text: Serão santos para o seu Deus e não profanarão o nome do seu Deus, pois apresentam as ofertas feitas pelo fogo a Yahweh, o alimento do seu Deus; e serão santos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ לֵאלֹהֵיהֶם
  choice: Serão santos para o seu Deus
  rationale: Preserva o valor prescritivo do imperfeito no contexto legal e a relação de consagração expressa por ל, em português natural.
- source_word: יְחַלְּלוּ
  choice: profanarão
  rationale: Mantém o contraste cultual entre o santo e o comum, central no contexto de Levítico.
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: o nome do seu Deus
  rationale: Tradução direta da construção hebraica, preservando sua dignidade e relevância pactual.
- source_word: אִשֵּׁי יְהוָה
  choice: as ofertas feitas pelo fogo a Yahweh
  rationale: Traduz explicitamente o termo sacrificial אִשִּׁים, ligado a ofertas consumidas ou apresentadas pelo fogo, sem reduzi-lo apenas à ideia genérica de alimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: o alimento do seu Deus
  rationale: Embora לֶחֶם possa significar literalmente 'pão', neste contexto sacrificial designa alimento em sentido mais amplo.
- source_word: מַקְרִיבִם
  choice: apresentam
  rationale: Expressa o sentido causativo de קרב, 'fazer chegar perto' ou apresentar como oferta, em linguagem cultual clara.
- source_word: וְהָיוּ קֹדֶשׁ
  choice: por isso, serão santos
  rationale: A conjunção é entendida em continuidade lógica com a oração causal anterior; 'por isso' torna essa relação natural em português sem eliminar a possibilidade de simples coordenação.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico traz o Tetragrama como nome próprio. 'Yahweh' preserva sua função de nome e corresponde diretamente à forma adotada na camada de consulta.
- issue: Sentido da expressão cultual אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם
  choice: as ofertas feitas pelo fogo a Yahweh, o alimento do seu Deus
  alternative: as ofertas de alimento de Yahweh, o pão do seu Deus
  rationale: A tradução mantém tanto o componente do fogo no termo técnico אִשִּׁים quanto a metáfora cultual do alimento, sem sugerir que Deus necessite literalmente de comida.
- issue: Força de וְהָיוּ קֹדֶשׁ
  choice: por isso, serão santos
  alternative: e serão santos
  rationale: A leitura inferencial se ajusta à sequência introduzida por 'pois', embora o ו hebraico também possa ser traduzido simplesmente por 'e'.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva o vocabulário de santidade e profanação e explicita com naturalidade a terminologia sacrificial. Nenhum marcador de nota foi usado, pois todas as informações necessárias foram integradas ao texto.
