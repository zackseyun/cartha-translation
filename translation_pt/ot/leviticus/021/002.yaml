  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: pt
  text: 'a não ser por seu parente, o que lhe é mais próximo[a]: por sua mãe, por seu pai, por seu filho, por sua filha e por seu irmão —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico שְׁאֵר tem literalmente o sentido de “carne” ou “parentela”; por isso, a expressão também poderia ser traduzida como “parente consanguíneo” ou “parente de sua própria carne”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: a não ser por
  rationale: No contexto legal, a expressão introduz uma exceção à proibição do versículo anterior; esta formulação comunica com naturalidade seu valor restritivo.
- source_word: שְׁאֵרוֹ
  choice: seu parente próximo
  rationale: שְׁאֵר designa parentesco e tem literalmente a ideia de “carne”. “Parente próximo” expressa claramente o sentido familiar sem introduzir uma formulação artificial.
- source_word: הַקָּרֹב אֵלָיו
  choice: o mais chegado a ele
  rationale: A expressão qualifica o parente segundo a proximidade familiar. “O mais chegado a ele” preserva essa força de parentesco estreito e evita sugerir apenas proximidade física.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: por sua mãe, por seu pai, por seu filho, por sua filha e por seu irmão
  rationale: A repetição de “por” representa a cadeia anafórica da preposição לְ e deixa explícitas as pessoas por causa das quais a exceção é permitida.
