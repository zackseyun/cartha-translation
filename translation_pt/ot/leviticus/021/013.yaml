base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/013.yaml
  text: And he shall take a wife in her virginity[a].
translation:
  language: pt
  text: E ele tomará por esposa uma mulher virgem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma mulher em sua virgindade”. O hebraico diz literalmente “em sua virgindade”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְהוּא
  choice: E ele
  rationale: Preserva a continuidade marcada pela conjunção e o pronome sujeito explícito, com sua leve ênfase, sem a intensificar indevidamente.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O substantivo significa literalmente “mulher”; a expressão “tomará por esposa” deixa claro o contexto matrimonial e mantém a ordem natural em português.
- source_word: בִּבְתוּלֶיהָ
  choice: na sua virgindade
  rationale: Reproduz de perto a construção hebraica com a preposição ב e o substantivo de estado com sufixo feminino, preservando sua formulação incomum e a alternativa “virgem” em nota.
- source_word: יִקָּח
  choice: tomará por esposa
  rationale: Conserva o sentido básico de לקח, “tomar”, ao mesmo tempo que expressa de modo inequívoco e idiomático em português seu sentido matrimonial neste contexto legal.
theological_decisions:
- issue: Terminologia matrimonial na legislação sacerdotal
  choice: Manter o idioma de “tomar por esposa”
  alternative: Ele se casará com uma mulher virgem
  rationale: A formulação escolhida preserva a textura jurídica e formulaica do hebraico sem reduzir a expressão ao verbo mais interpretativo “casar-se”.
- issue: Descrição do estado da mulher
  choice: na sua virgindade
  alternative: virgem
  rationale: A tradução retém a expressão nominal do hebraico e não elimina sua peculiaridade; a formulação portuguesa mais direta é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com registro jurídico moderado. “Tomará por esposa” esclarece o idioma matrimonial hebraico, enquanto “na sua virgindade” preserva deliberadamente a forma da expressão original.
