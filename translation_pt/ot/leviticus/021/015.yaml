base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: pt
  text: Não profanará a sua descendência no meio do seu povo,[a] pois eu sou Yahweh, que o santifica.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, no contexto, ao desobedecer às restrições matrimoniais, ele traria profanação sobre a sua linhagem dentro da comunidade. “Profanar” também pode ser entendido como “tornar impura” ou “desonrar”, embora o verbo hebraico destaque tornar profano aquilo que deveria ser santo.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Ou: “que o torna santo” ou “que o consagra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: profanará
  rationale: O piel de חלל, no contexto sacerdotal de santidade, indica tornar profano aquilo que deveria ser santo. “Profanar” preserva com precisão essa dimensão cultual.
- source_word: זַרְעוֹ
  choice: a sua descendência
  rationale: זֶרַע pode significar semente, prole ou descendência. Aqui, as restrições matrimoniais e a continuidade da linhagem sacerdotal favorecem “descendência”, expressão natural e coletiva em português.
- source_word: בְּעַמָּיו
  choice: no meio do seu povo
  rationale: A construção com בְּ e עַם indica o âmbito comunitário em que ocorreria a profanação. “No meio do seu povo” é natural e mantém o contexto social e pactual sem especificá-lo além do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מְקַדְּשׁוֹ
  choice: que o santifica
  rationale: O particípio de קדשׁ apresenta Yahweh como aquele que torna santo ou separa para si. “Santifica” conserva o vocabulário de santidade e a correspondência conceitual com “profanará”.
theological_decisions:
- issue: Sentido da profanação da descendência
  choice: Manter a formulação ampla de que o sacerdote não deve profanar sua descendência no meio do povo.
  alternative: Explicitar que um casamento proibido desqualificaria sua linhagem para o sacerdócio.
  rationale: O contexto imediato trata das restrições matrimoniais do sumo sacerdote, mas o versículo não declara expressamente a desqualificação para o ofício. A tradução preserva a amplitude e a tensão do texto hebraico; a nota fornece o vínculo contextual sem inseri-lo no corpo do versículo.
- issue: Agente e objeto da santificação
  choice: Yahweh é aquele que santifica o sacerdote referido pelo sufixo masculino singular.
  alternative: Traduzir “que o consagra”, enfatizando mais especificamente a investidura sacerdotal.
  rationale: “Santifica” é semanticamente mais amplo e reproduz melhor a linguagem recorrente de santidade em Levítico, sem restringi-la ao rito de consagração.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e compreensão internacional. A ordem foi ajustada naturalmente ao português, mantendo a linguagem sacerdotal de santidade. “Descendência” evita o literalismo pouco natural de “semente” e comunica o sentido genealógico coletivo.
