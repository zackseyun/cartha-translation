base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O wayyiqtol de דבר introduz um novo ato narrativo de fala; “falou” é natural e preserva a fórmula de discurso divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição assinala o destinatário da fala; “falar a alguém” é construção corrente e digna em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula introdutória, o infinitivo hebraico anuncia as palavras que vêm a seguir; em português moderno, os dois-pontos expressam essa função de modo mais natural do que “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e a distinção entre nome e título, enquanto a nota informa a tradução tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação inicial com “E” mantém a continuidade narrativa. Os dois-pontos traduzem idiomaticamente לֵאמֹר e indicam que o conteúdo da fala começa no versículo seguinte.
