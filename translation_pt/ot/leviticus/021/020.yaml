base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: pt
  text: ou corcunda[a], ou de corpo mirrado[b], ou com uma anomalia no olho[c], ou com uma afecção da pele que causa coceira, ou com uma erupção cutânea[d], ou com os testículos esmagados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com as costas curvadas”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é incerto; pode indicar uma pessoa de corpo atrofiado, franzino ou definhado.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “com uma mancha no olho”; não se sabe ao certo qual alteração ocular está em vista.'
    reason: lexical_alternative
  - marker: d
    text: Os dois termos hebraicos deste trecho provavelmente designam afecções da pele diferentes, mas não é possível determinar com segurança seus diagnósticos modernos.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: corcunda
  rationale: Expressa de modo direto e corrente uma deformidade ou curvatura acentuada das costas, sem recorrer a terminologia médica moderna.
- source_word: דַק
  choice: de corpo mirrado
  rationale: O sentido exato é incerto; a expressão pode indicar corpo atrofiado, franzino ou definhado e evita limitar o termo necessariamente ao nanismo.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: com uma anomalia no olho
  rationale: Mantém a referência a uma alteração ocular sem identificar de maneira indevidamente precisa uma condição como catarata ou mancha.
- source_word: גָרָב
  choice: com sarna
  rationale: Representa uma afecção cutânea pruriginosa tradicionalmente associada ao termo, embora o diagnóstico moderno exato permaneça incerto.
- source_word: יַלֶּפֶת
  choice: com uma doença de pele escamosa
  rationale: Distingue esta segunda afecção cutânea da anterior sem impor um diagnóstico moderno específico.
- source_word: מְרֹחַ אָשֶׁךְ
  choice: com os testículos esmagados
  rationale: Traduz explicitamente a lesão testicular indicada pela expressão hebraica, sem eufemismo que obscureça a anatomia.
- source_word: אוֹ
  choice: ou
  rationale: Preserva de maneira consistente a estrutura disjuntiva da lista hebraica.
theological_decisions:
- issue: Terminologia de condições corporais numa lei sacerdotal de santidade
  choice: Empregar linguagem física direta, sem atribuir culpa moral às condições descritas.
  alternative: Suavizar as condições com eufemismos ou interpretá-las como sinais de falha moral.
  rationale: O texto trata de condições corporais relacionadas à elegibilidade sacerdotal para o serviço, não declara que essas condições sejam pecados ou indiquem culpa pessoal.
translation_notes:
  register: Português moderno, claro e digno, com repetição de “ou” para conservar o ritmo da lista legal. A tradução evita tanto eufemismos quanto diagnósticos médicos excessivamente específicos; “de corpo mirrado” preserva a incerteza de דַק.
