  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: pt
  text: Não se tornará impuro, sendo marido entre o seu povo, profanando-se assim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não se tornará impuro como homem de destaque entre o seu povo, profanando-se assim”. A cláusula hebraica é difícil; alguns a entendem de modo mais geral, como uma proibição de o sacerdote tornar-se impuro em sua posição de destaque, e não especificamente como marido.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: se tornará impuro
  rationale: O hitpael imperfeito de טמא indica aqui a impureza ritual contraída pelo contato com um morto. “Tornar-se impuro” comunica com clareza o estado ritual em vista e preserva o vocabulário do contexto sacerdotal.
- source_word: בַּעַל
  choice: marido
  rationale: Nesta cláusula difícil, בַּעַל pode ter o sentido relacional de “marido”, coerente com o contexto imediato das exceções de luto baseadas em parentesco. Como também pode significar “senhor” ou designar um homem de destaque, a alternativa é registrada em nota.
- source_word: בְּעַמָּיו
  choice: entre o seu povo
  rationale: Reproduz de modo natural o sentido literal “entre o seu povo”; no contexto, a expressão pode envolver o grupo de parentesco.
- source_word: לְהֵחַלּוֹ
  choice: profanando-se assim
  rationale: O infinitivo de חלל expressa finalidade ou resultado. A formulação conserva a linguagem de profanação própria do contexto de santidade sacerdotal, sem decidir rigidamente entre propósito e consequência.
theological_decisions:
- issue: Interpretação da cláusula difícil בַּעַל בְּעַמָּיו
  choice: A proibição se refere ao sacerdote tornar-se impuro na condição de marido entre o seu povo.
  alternative: “Não se tornará impuro como homem de destaque entre o seu povo, profanando-se assim”; ou, mais genericamente, “Não se tornará impuro entre o seu povo, para não se profanar”.
  rationale: A sintaxe hebraica é condensada e admite interpretações diferentes. O sentido comum de בַּעַל como “marido” e o contexto de parentes próximos favorecem a leitura principal, mas a ambiguidade genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém a concisão legal do hebraico e explicita apenas o necessário para soar natural.
