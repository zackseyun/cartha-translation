  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִ/זְנ֑וֹת אֶת אָבִ֨י/הָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: pt
  text: E, se a filha de um sacerdote se profanar[a], prostituindo-se[b], ela profana seu pai; será queimada no fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começar”. Nesse caso, a frase pode ser entendida como “começar a prostituir-se”. O verbo hebraico também pode ter esse sentido, embora aqui a leitura “se profanar” se ajuste melhor ao contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “comportando-se como prostituta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: E, se a filha de um sacerdote
  rationale: A expressão hebraica significa idiomaticamente “a filha de um sacerdote”. A conjunção inicial foi preservada, e כִּי foi vertido como “se” por introduzir um caso legal condicional.
- source_word: תֵחֵל
  choice: se profanar
  rationale: O nifal de חלל, neste contexto de santidade sacerdotal, indica tornar-se profana ou profanar-se. A forma reflexiva é natural em português e preserva o vocabulário cultual; a possível leitura “começar” é registrada em nota.
- source_word: לִזְנוֹת
  choice: prostituindo-se
  rationale: O infinitivo de זנה especifica como ocorre a profanação. A tradução mantém o sentido sexual concreto e a relação circunstancial expressa no hebraico.
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: ela profana seu pai
  rationale: A tradução conserva o verbo da mesma raiz חלל empregado anteriormente e mantém o peso cultual da afirmação. O pronome explícito הִיא é representado por “ela”.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: será queimada no fogo
  rationale: O nifal imperfeito expressa a pena prescrita. “No fogo” reproduz de modo claro e solene a fórmula penal sem especificar detalhes de execução que o texto não fornece.
theological_decisions:
- issue: Vocabulário de profanação em uma lei de santidade sacerdotal
  choice: Manter “profanar” nas duas ocorrências da raiz חלל
  alternative: Empregar “desonrar” ou “contaminar” em uma ou nas duas ocorrências
  rationale: A repetição preserva a ligação lexical e teológica entre a conduta da filha e a profanação do pai sacerdote, sem reduzir a ideia a mera desonra social nem acrescentar uma interpretação doutrinária.
- issue: Natureza da pena expressa por בָּאֵשׁ תִּשָּׂרֵף
  choice: Traduzir diretamente como “será queimada no fogo”
  alternative: Especificar se a queima ocorre como método de execução ou depois da morte
  rationale: O hebraico prescreve a queima, mas este versículo isoladamente não explicita esses pormenores; a tradução preserva essa falta de especificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal adequada tanto à leitura brasileira quanto ao uso internacional. A formulação conserva o tom conciso e jurídico do original e repete deliberadamente “profanar” para refletir a repetição da raiz hebraica חלל.
