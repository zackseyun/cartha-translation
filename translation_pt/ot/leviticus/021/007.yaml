  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: pt
  text: Não tomarão por esposa uma mulher que se prostitui ou que foi profanada, nem tomarão por esposa uma mulher divorciada de seu marido, pois cada sacerdote é santo para o seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה זֹנָה
  choice: uma mulher que se prostitui
  rationale: Expressa de modo natural o particípio/substantivo ligado à prostituição, sem acrescentar uma classificação além do texto.
- source_word: חֲלָלָה
  choice: que foi profanada
  rationale: Preserva a raiz חלל e a ideia de profanação ou desonra do estado da mulher; evita reduzir o termo apenas a impureza ritual ou moral.
- source_word: יִקָּחוּ
  choice: tomarão por esposa
  rationale: Neste contexto de restrições matrimoniais sacerdotais, 'tomar' significa contrair casamento; a explicitação evita ambiguidade pouco natural em português.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ
  choice: divorciada de seu marido
  rationale: Representa diretamente a mulher despedida ou divorciada de seu homem/marido.
- source_word: קָדֹשׁ הוּא לֵאלֹהָיו
  choice: cada sacerdote é santo para o seu Deus
  rationale: O hebraico passa do sujeito plural dos verbos ao pronome singular, provavelmente distributivo e referente ao sacerdote; 'cada sacerdote' torna essa referência inteligível sem mudar seu sentido.
theological_decisions:
- issue: Sentido de חֲלָלָה
  choice: que foi profanada
  alternative: desonrada; contaminada
  rationale: A tradução mantém a linguagem de santidade/profanação característica do capítulo e não define além do hebraico a causa ou a natureza precisa dessa condição.
- issue: Mudança do plural para o singular em כִּי קָדֹשׁ הוּא
  choice: pois cada sacerdote é santo
  alternative: pois ele é santo
  rationale: A formulação distributiva conserva o singular hebraico e esclarece seu antecedente no contexto, sem fazer uma afirmação sobre outro personagem.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de 'tomarão por esposa' acompanha a estrutura enfática do hebraico; 'se prostitui' evita um rótulo excessivamente substantivado, e 'profanada' preserva a tensão lexical do texto.
