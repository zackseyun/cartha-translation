source:
  edition: WLC
  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: pt
  text: Não sairá do santuário nem profanará o santuário de seu Deus, pois a consagração[a] pelo óleo da unção de seu Deus está sobre ele. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a coroa do óleo da unção de seu Deus”. O termo hebraico pode significar “coroa”, “diadema” ou “consagração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ לֹא יֵצֵא
  choice: Não sairá do santuário
  rationale: Preserva o sentido concreto de יָצָא com מִן e emprega “santuário” para מִקְדָּשׁ, de modo natural no contexto da legislação sacerdotal.
- source_word: וְלֹא יְחַלֵּל
  choice: nem profanará
  rationale: O piel de חלל indica tornar profano ou tratar como profano aquilo que é santo; “profanará” mantém o contraste cultual.
- source_word: אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: o santuário de seu Deus
  rationale: Reproduz a repetição de מִקְדָּשׁ e a relação possessiva do hebraico, preservando a ênfase legal.
- source_word: כִּי
  choice: pois
  rationale: Introduz de maneira clara e digna a razão das proibições anteriores.
- source_word: נֵזֶר
  choice: a consagração
  rationale: Neste contexto, o termo aponta para a condição consagrada do sumo sacerdote, embora também possa significar “coroa” ou “diadema”; essa ambiguidade é preservada em nota.
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: o óleo da unção de seu Deus
  rationale: Representa toda a cadeia construta hebraica em português corrente e mantém a expressão cultual tradicional.
- source_word: עָלָיו
  choice: está sobre ele
  rationale: Conserva a imagem e o estado contínuo expressos pela preposição hebraica.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Translitera o nome divino pessoal e preserva a fórmula recorrente de autenticação divina em Levítico.
theological_decisions:
- issue: Sentido de נֵזֶר em relação ao estado do sumo sacerdote
  choice: “a consagração”, com a alternativa literal em nota
  alternative: “a coroa” ou “o diadema” do óleo da unção
  rationale: A frase fundamenta as restrições impostas ao sumo sacerdote em sua condição consagrada. “Consagração” comunica essa função contextual sem apagar a imagem possível de coroa, registrada na nota.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica concisa. A repetição de “santuário” foi mantida por refletir a ênfase do hebraico; o marcador da nota foi colocado junto de “consagração”, termo ao qual a alternativa lexical se refere.
