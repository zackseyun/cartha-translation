id: LEV.21.8
reference: Leviticus 21:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: pt
  text: Você o tratará como santo, porque ele oferece o alimento[a] do seu Deus. Ele será santo para você, pois eu, Yahweh, que santifico vocês, sou santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o pão do seu Deus”. Aqui, “pão” provavelmente se refere, de modo mais amplo, às ofertas alimentares apresentadas a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: Você o tratará como santo
  rationale: O piel de קדשׁ com sufixo pronominal manda reconhecer e tratar o sacerdote como alguém separado para a santidade. Esta formulação é natural em português e preserva a força normativa do hebraico.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: o alimento do seu Deus
  rationale: Embora לֶחֶם signifique literalmente “pão”, no contexto sacerdotal pode designar de modo mais amplo as ofertas alimentares apresentadas a Deus. A nota conserva a alternativa literal.
- source_word: מַקְרִיב
  choice: oferece
  rationale: O particípio hifil de קרב, em contexto sacrificial, indica apresentar uma oferta; “oferece” é a equivalência portuguesa mais clara.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: Ele será santo para você
  rationale: Mantém a afirmação de status, a relação expressa por לְ e a repetição do vocabulário de santidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função de nome pessoal no texto hebraico.
- source_word: מְקַדִּשְׁכֶם
  choice: que santifico vocês
  rationale: “Santifico” preserva a ligação lexical com “santo”; “vocês” explicita que o sufixo hebraico é plural, embora o início do versículo se dirija ao indivíduo no singular.
theological_decisions:
- issue: Sentido cultual de לֶחֶם אֱלֹהֶיךָ
  choice: o alimento do seu Deus
  alternative: o pão do seu Deus
  rationale: No contexto do serviço sacerdotal, לֶחֶם abrange provavelmente as ofertas alimentares, não apenas pão literal. A alternativa permanece na nota para conservar a imagem hebraica.
- issue: Repetição da linguagem de santidade da raiz קדשׁ
  choice: santo / santifico
  alternative: consagrado / consagro
  rationale: 'A tradução conserva a coesão lexical e teológica do versículo: o sacerdote deve ser considerado santo, isso se fundamenta na santidade de Yahweh e na ação pela qual ele santifica o povo.'
- issue: Mudança do singular para o plural
  choice: seu Deus / para você / santifico vocês
  alternative: vosso Deus / para vós / vos santifico
  rationale: O hebraico passa de formas singulares, dirigidas ao israelita individual, para um sufixo plural no final, dirigido à comunidade. A tradução preserva essa mudança sem arcaísmo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “você/vocês” para reproduzir claramente a mudança hebraica de singular para plural; mantém “santo/santifico” para refletir a repetição da raiz קדשׁ. O marcador [a] foi colocado junto a “alimento”, ao qual a nota lexical se refere.
