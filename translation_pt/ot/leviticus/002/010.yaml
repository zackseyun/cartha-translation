  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: pt
  text: E o que restar da oferta de cereal será para Arão e seus filhos; é santíssima dentre as ofertas apresentadas pelo fogo a Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: E o que restar
  rationale: O particípio com artigo funciona como substantivo e indica a parte restante; esta formulação é natural em português e preserva o sentido.
- source_word: מִן הַמִּנְחָה
  choice: da oferta de cereal
  rationale: Em Levítico 2, מִנְחָה designa especificamente a oferta preparada com cereais, e não uma oferta genérica.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: será para Arão e seus filhos
  rationale: A preposição לְ marca destinação ou posse; o futuro mantém o caráter prescritivo da legislação.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: é santíssimo
  rationale: O idioma superlativo hebraico expressa o grau máximo de santidade. A forma portuguesa mantém a predicação sem acrescentar o substantivo 'porção'.
- source_word: מֵאִשֵּׁי
  choice: entre as ofertas queimadas
  rationale: 'אִשֶּׁה refere-se a ofertas apresentadas por meio do fogo. Aqui, מן pode ser entendido partitivamente: o restante é santíssimo entre as ofertas queimadas de Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido da expressão sacrificial מֵאִשֵּׁי יְהוָה
  choice: entre as ofertas queimadas de Yahweh
  alternative: das ofertas de alimento de Yahweh
  rationale: A tradução escolhida conserva a relação explícita com o fogo e entende מִן em sentido partitivo, sem impor a interpretação metafórica de 'alimento'. A alternativa é lexicalmente possível no vocabulário sacerdotal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém a concisão e a estrutura predicativa do hebraico, evitando tanto o arcaísmo 'oblação' quanto a explicitação não presente no texto de 'uma porção santíssima'.
