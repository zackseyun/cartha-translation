revisions:
- from: E o que restar da oferta de cereal será para Arão e seus filhos; é santíssimo entre as ofertas queimadas de Yahweh.
  to: E o que restar da oferta de cereal será para Arão e seus filhos; é santíssima dentre as ofertas apresentadas pelo fogo a Yahweh.
  rationale: A revisão limita-se à expressão sacrificial final. «Dentre» conserva a classificação partitiva, enquanto «ofertas apresentadas pelo fogo a Yahweh» comunica o sentido técnico de אִשֵּׁי יְהוָה com maior precisão do que «ofertas queimadas», sem acrescentar uma interpretação doutrinária ou uma «porção» não expressa.
