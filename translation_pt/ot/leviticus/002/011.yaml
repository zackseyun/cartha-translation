id: LEV.2.11
reference: Leviticus 2:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: pt
  text: Nenhuma oferta de cereal que vocês apresentarem a Yahweh será preparada com fermento, pois não queimarão no altar fermento algum nem mel algum[a] como oferta feita pelo fogo[b] a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No uso antigo, “mel” também podia incluir xarope de frutas, e não apenas mel de abelha.
    reason: cultural_note
  - marker: b
    text: Expressão hebraica para uma oferta apresentada no altar por meio da queima.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: oferta de cereal
  rationale: Em Levítico 2, מִנְחָה designa especificamente a oferta preparada com farinha ou cereal; esta expressão evita o sentido excessivamente amplo de “oferta”.
- source_word: תַּקְרִיבוּ
  choice: apresentarem
  rationale: O hifil de קרב, em contexto sacrificial, indica trazer e apresentar uma oferta diante de Deus.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: será preparada com fermento
  rationale: Expressa em português natural que a oferta não pode ser produzida em estado fermentado.
- source_word: שְׂאֹר
  choice: fermento
  rationale: Refere-se ao agente de fermentação; “fermento” é corrente e não restringe o sentido ao fermento industrial moderno.
- source_word: דְּבַשׁ
  choice: mel
  rationale: É o sentido lexical usual, mantendo-se em nota a possibilidade de incluir xaropes de frutas no uso antigo.
- source_word: תַקְטִירוּ
  choice: queimarão no altar
  rationale: No uso sacrificial, o verbo indica fazer subir em fumaça; a menção do altar torna a ação cultual clara sem confundi-la com uma queima comum.
- source_word: אִשֶּׁה
  choice: oferta feita pelo fogo
  rationale: Preserva a categoria sacrificial ligada à queima, sem impor a interpretação lexical mais discutível de “oferta de alimento”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה e a orientação da apresentação sacrificial.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” representa o nome próprio sem substituí-lo por um título.
- issue: Sentido cultual de אִשֶּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento; oferta queimada
  rationale: A formulação conserva o vínculo explícito com a queima sacrificial e evita decidir que o substantivo significa propriamente “alimento”.
- issue: Construção negativa כָּל ... לֹא
  choice: Nenhuma oferta de cereal
  alternative: Toda oferta de cereal ... não
  rationale: Em português, “nenhuma” comunica naturalmente o alcance universal da proibição hebraica sem sugerir uma negação parcial.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural hebraico. “Queimarão no altar” explicita o contexto sacrificial inerente ao verbo, e os marcadores [a] e [b] aparecem imediatamente após os termos que esclarecem.
