base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: pt
  text: Se a sua oferta de cereal for preparada numa chapa[a], será de farinha fina misturada com azeite, sem fermento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa frigideira rasa”. O termo hebraico se refere a uma superfície ou utensílio plano usado para preparar esta oferta de cereal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Em Levítico 2, o termo designa especificamente a oferta feita de farinha ou cereais, e não uma dádiva genérica.
- source_word: עַל הַמַּחֲבַת
  choice: preparada numa chapa
  rationale: A expressão indica o preparo sobre uma superfície plana de cocção; “chapa” é clara e natural em português, sem pressupor um recipiente fundo.
- source_word: קָרְבָּנְךָ
  choice: a sua oferta
  rationale: Mantém a referência direta ao ofertante e representa o termo amplo para aquilo que é apresentado, sem criar repetição desnecessária.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o equivalente tradicional e preciso para farinha de alta qualidade e moagem fina usada nas ofertas.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: Expressa claramente a combinação da farinha com óleo; “azeite” é o termo natural no contexto bíblico do antigo Israel.
- source_word: מַצָּה
  choice: sem fermento
  rationale: O adjetivo descreve a condição exigida da oferta; esta formulação é mais corrente em português do que “ázima” e não o transforma em substantivo.
- source_word: תִהְיֶה
  choice: será
  rationale: Preserva de forma natural o valor prescritivo do imperfeito hebraico no contexto legal.
