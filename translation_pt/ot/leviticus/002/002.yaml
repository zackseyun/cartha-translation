  verdict: revise
  source_fidelity: A tradução acompanha bem a sequência ritual, os referentes e os termos principais do hebraico. Contudo, «incenso» é mais genérico do que לְבוֹנָה, que designa especificamente o olíbano; uma nota pode preservar a legibilidade do texto e registrar essa precisão. A redação da nota atual também apresenta «oferta feita pelo fogo» como se fosse distinta da tradução principal, embora seja essencialmente a mesma formulação.
  naturalness: O português é moderno e claro. «Um punhado cheio» comunica adequadamente מְלֹא קֻמְצוֹ, e «porção memorial» preserva de modo compreensível o uso técnico. A pequena revisão da nota melhora a precisão sem tornar o texto mais pesado.
  terminology: «Yahweh», «farinha fina», «azeite», «porção memorial» e «oferta feita pelo fogo» são escolhas defensáveis. «Olíbano» é o referente específico de לְבוֹנָה; mantê-lo em nota como esclarecimento de «incenso» equilibra exatidão lexical e uso corrente.
  issues:
  - severity: low
    issue: «Incenso» é um termo genérico para לְבוֹנָה.
    rationale: לְבוֹנָה se refere ao olíbano (frankincense). No texto corrente, «incenso» é aceitável e natural, mas a especificidade deve ser registrada em nota.
  - severity: low
    issue: A nota repete a tradução principal entre as alternativas.
    rationale: «Oferta feita pelo fogo» já é a formulação do texto. A nota deve indicar alternativas genuínas e, se necessário, o caráter técnico disputado de אִשֶּׁה.
