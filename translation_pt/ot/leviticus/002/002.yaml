source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: pt
  text: Ele a levará aos filhos de Arão, os sacerdotes, e pegará dali um punhado cheio da sua farinha fina e do seu azeite, junto com todo o seu incenso[a]. Então o sacerdote queimará no altar essa porção memorial, como oferta feita pelo fogo, de aroma agradável a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «olíbano». O hebraico designa especificamente essa resina aromática.
    reason: Esclarece a referência específica de לְבוֹנָה sem substituir no texto corrente o termo mais amplamente compreensível.
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Ele a levará
  rationale: O hifil de בוא expressa levar ou trazer a oferta; o futuro mantém o estilo prescritivo do texto legal, e o pronome feminino retoma a oferta de cereal.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: aos filhos de Arão, os sacerdotes
  rationale: Preserva tanto a relação familiar quanto a identificação sacerdotal em aposição.
- source_word: וְקָמַץ מִשָּׁם מְלֹא קֻמְצוֹ
  choice: e pegará dali um punhado cheio
  rationale: מִשָּׁם é representado diretamente por “dali”; “um punhado cheio” comunica o conteúdo de מְלֹא קֻמְצוֹ sem recorrer à formulação pouco natural “a plenitude do seu punho”.
- source_word: מִסָּלְתָּהּ וּמִשַּׁמְנָהּ
  choice: da sua farinha fina e do seu azeite
  rationale: סֹלֶת designa farinha fina própria para a oferta, e שֶׁמֶן, neste contexto, é naturalmente “azeite”. As preposições indicam aquilo de que se retira a porção.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: junto com todo o seu incenso
  rationale: A expressão inclui toda a porção de incenso com o punhado retirado da farinha e do azeite.
- source_word: אַזְכָּרָתָהּ
  choice: essa porção memorial
  rationale: Mantém o valor técnico da parcela representativa que é queimada no altar; “essa” retoma de modo natural o punhado recém-descrito.
- source_word: וְהִקְטִיר ... הַמִּזְבֵּחָה
  choice: queimará no altar
  rationale: No contexto sacrificial, o hifil de קטר significa queimar como oferta, e o he direcional de הַמִּזְבֵּחָה indica o altar como destino ou local da ação.
- source_word: אִשֵּׁה
  choice: oferta feita pelo fogo
  rationale: Tradução formal e transparente do termo sacerdotal, que conserva explicitamente o elemento do fogo sem impor como sentido principal a interpretação alimentar.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Expressa em português atual o idioma sacrificial que apresenta a oferta como aceitável e agradável a Deus.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto contém o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título; “Javé” é uma forma portuguesa tradicional, mas menos próxima da transliteração adotada.
- issue: Sentido do termo sacrificial אִשֵּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: O termo admite discussão quanto à sua relação com fogo e alimento. O texto principal conserva a associação cultual com o fogo, claramente presente também no ato de queimar, enquanto a nota registra a alternativa alimentar sem resolver indevidamente a questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro verbal preserva o caráter prescritivo. Mantêm-se termos cultuais necessários, como “porção memorial”, com sintaxe corrente. O pronome sujeito de “pegará” permanece sem identificação adicional, acompanhando a forma masculina singular do hebraico e evitando inserir “um dos sacerdotes” no texto.
