  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
translation:
  language: pt
  text: Parta-a em pedaços e derrame óleo sobre ela[a]; é uma oferta de cereais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “divida-a em porções” ou “em fragmentos”. O hebraico enfatiza que a oferta deve ser partida em pedaços menores antes que o óleo seja derramado sobre ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּת֤וֹת אֹתָ/הּ֙ פִּתִּ֔ים
  choice: Parta-a em pedaços
  rationale: O infinitivo absoluto de פתת tem força imperativa, e פִּתִּים expressa o resultado da ação. “Parta-a em pedaços” é natural e preserva a ênfase hebraica na divisão da oferta em partes menores.
- source_word: וְ/יָצַקְתָּ֥
  choice: e derrame
  rationale: A forma verbal na sequência de instruções tem força diretiva. “E derrame” mantém o fluxo do procedimento em português atual.
- source_word: עָלֶ֖י/הָ
  choice: sobre ela
  rationale: A preposição על indica que o óleo é aplicado à oferta; o pronome feminino retoma a oferta mencionada no contexto.
- source_word: שָׁ֑מֶן
  choice: óleo
  rationale: O hebraico diz apenas “óleo”. Embora provavelmente se trate de azeite, especificar isso acrescentaria informação não expressa no texto.
- source_word: מִנְחָ֖ה
  choice: oferta de cereal
  rationale: Neste contexto cultual de Levítico 2, מִנְחָה designa especificamente uma oferta preparada com cereais. A expressão é clara e contextualmente precisa.
- source_word: הִֽוא
  choice: é
  rationale: O pronome independente identifica o item descrito como oferta de cereal; em português, a cópula sem pronome explícito produz uma frase natural e fiel.
