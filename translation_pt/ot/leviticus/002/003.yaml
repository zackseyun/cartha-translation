base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: pt
  text: 'O que restar da oferta de cereal será de Arão e de seus filhos: uma porção santíssima dentre as ofertas de alimento de Yahweh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre as ofertas apresentadas pelo fogo a Yahweh”; ou: “dentre as ofertas queimadas de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: O que restar
  rationale: O particípio com artigo funciona como substantivo e designa a parte remanescente; esta formulação é natural e precisa em português.
- source_word: מִן הַמִּנְחָה
  choice: da oferta de cereal
  rationale: Neste contexto levítico, מִנְחָה designa especificamente uma oferta feita de produtos cereais, não uma dádiva genérica.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: será de Arão e de seus filhos
  rationale: O לְ indica destinação ou posse; a formulação expressa claramente que a parte restante cabe aos sacerdotes.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: uma porção santíssima
  rationale: A construção intensiva indica o grau máximo de santidade. 'Porção' explicita naturalmente que a classificação se refere ao restante da oferta, sem sugerir o recinto chamado Santo dos Santos.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: das ofertas de Yahweh preparadas no fogo
  rationale: אִשֶּׁה é uma expressão sacrificial técnica ligada ao fogo. A tradução preserva esse elemento lexical sem sugerir que toda a porção sacerdotal seja queimada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Classificação cultual קֹדֶשׁ קָדָשִׁים
  choice: uma porção santíssima
  alternative: algo santíssimo; santo dos santos
  rationale: A expressão classifica o restante da oferta no grau mais elevado de santidade cultual. A redação escolhida evita confundi-la com um lugar do santuário.
- issue: Sentido da expressão אִשֵּׁי יְהוָה
  choice: ofertas de Yahweh preparadas no fogo
  alternative: ofertas queimadas de Yahweh; ofertas de alimento de Yahweh
  rationale: A relação exata entre o termo técnico, o fogo e a ideia de alimento sacrificial admite mais de uma formulação. O texto principal conserva a associação explícita com o fogo, e a nota registra as principais alternativas sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A divisão em duas frases esclarece a referência de קֹדֶשׁ קָדָשִׁים, e o marcador [a] aparece no texto principal.
