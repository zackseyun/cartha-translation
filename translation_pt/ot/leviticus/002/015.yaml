  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: pt
  text: Ponha óleo sobre ela[a] e coloque olíbano sobre ela; é uma oferta de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os verbos hebraicos também podem ser traduzidos por “dar”, “pôr” ou “dispor”. “Olíbano” é uma resina aromática, também chamada de franquincenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Ponha
  rationale: נתן é um verbo amplo, com sentidos como “dar”, “pôr” e “colocar”. Neste contexto ritual, “ponha” expressa naturalmente a aplicação do azeite e mantém a força instrutiva da sequência hebraica.
- source_word: עָלֶיהָ
  choice: sobre ela
  rationale: A preposição על com sufixo feminino singular indica que os elementos são postos sobre a oferta mencionada no contexto. “Sobre ela” é claro e natural em português.
- source_word: שֶׁמֶן
  choice: azeite
  rationale: שמן significa “óleo”; no contexto sacrificial israelita, trata-se de azeite. “Azeite” é a designação portuguesa corrente e natural, sem precisar acrescentar “de oliva” ao texto.
- source_word: וְשַׂמְתָּ
  choice: e coloque
  rationale: שׂים significa “pôr”, “colocar” ou “dispor”. “Coloque” representa a ação ritual deliberada e evita repetição estilística desnecessária de “ponha”.
- source_word: לְבֹנָה
  choice: incenso puro
  rationale: לבנה designa especificamente o olíbano, uma resina aromática usada como incenso. “Incenso puro” é uma expressão bíblica compreensível em português amplo; a nota registra o termo técnico alternativo.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Na legislação sacrificial de Levítico, מנחה designa a oferta preparada com produtos de cereal, e não uma oferta genérica. “Oferta de cereal” é clara, precisa e internacionalmente compreensível.
- source_word: הִוא
  choice: é
  rationale: O pronome feminino retoma a oferta descrita. Em português, “é uma oferta de cereal” preserva a predicação simples do hebraico sem exigir a explicitação de “ela”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção direta própria de instrução ritual. “Oferta de cereal” evita o regionalismo de “oferta de manjares”. O referente feminino de “ela” é recuperado do contexto imediato. A alternância “ponha/coloque” reflete os dois verbos hebraicos sem sugerir uma diferença técnica excessiva.
