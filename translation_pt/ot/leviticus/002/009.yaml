id: LEV.2.9
reference: Leviticus 2:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: pt
  text: 'Então o sacerdote retirará da oferta de cereal a porção memorial e a queimará sobre o altar: uma oferta feita pelo fogo, de aroma agradável a Yahweh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵרִים
  choice: retirará
  rationale: No contexto ritual, o hifil de רום indica retirar ou separar da oferta uma porção para ser queimada. “Retirará” comunica naturalmente a ação em português sem acrescentar um gesto de elevação incerto.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão e claro de כֹּהֵן em contexto cultual.
- source_word: מִן הַמִּנְחָה
  choice: da oferta de cereal
  rationale: Em Levítico 2, מִנְחָה designa especificamente uma oferta preparada com produtos de cereal. A formulação é clara e evita restringi-la indevidamente a grãos inteiros.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: a porção memorial
  rationale: No uso sacrificial, אַזְכָּרָה é a parte representativa queimada no altar. “Porção memorial” deixa claro que não se trata da oferta inteira.
- source_word: וְהִקְטִיר
  choice: e a queimará
  rationale: O hifil de קטר descreve a queima sacrificial no altar, com produção de fumaça. “Queimará” é direto, natural e adequado ao contexto.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: O hebraico direcional integra uma expressão ritual cujo equivalente idiomático em português é “sobre o altar”.
- source_word: אִשֵּׁה
  choice: uma oferta feita pelo fogo
  rationale: A etimologia e o uso cultual do termo são discutidos. Esta tradução conserva a associação explícita com o fogo sem impor a interpretação mais específica de “oferta de alimento”.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: A expressão sacrificial fixa retrata a oferta como aceita por Deus, mantendo a imagem antropomórfica do aroma em português corrente.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, distinguindo-o do título “Senhor” e preservando sua condição de nome próprio no texto hebraico.
theological_decisions:
- issue: Sentido da fórmula sacrificial אִשֵּׁה רֵיחַ נִיחֹחַ
  choice: uma oferta feita pelo fogo, de aroma agradável a Yahweh
  alternative: uma oferta de alimento, aroma agradável a Yahweh
  rationale: A tradução principal preserva a conexão lexical e ritual com o fogo e mantém a imagem de aceitação expressa pelo aroma, sem transformar a metáfora em explicação teológica. A alternativa “oferta de alimento” é possível no vocabulário sacerdotal, mas é mais interpretativa.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino. “Yahweh” o representa diretamente e evita confundi-lo com o título אֲדֹנָי; “SENHOR” permanece uma alternativa tradicional baseada na leitura reverencial judaica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe direta. “Oferta de cereal” favorece legibilidade brasileira e compreensão internacional. A pontuação apresenta a fórmula final como explicação ritual da queima, sem resolver além do hebraico sua relação sintática exata.
