  terminology: “Oferta”, “primícias” e “Yahweh” são escolhas consistentes com o hebraico, com o contexto de Levítico 2 e com a trilha de auditoria fornecida. A nota oferece uma alternativa legítima para os termos agrícolas e não introduz interpretação confessional.
