id: LEV.2.14
reference: Leviticus 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: pt
  text: Se você apresentar a Yahweh uma oferta das primícias, deverá apresentar sua oferta das primícias na forma de espigas novas tostadas no fogo, grãos triturados da nova colheita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espigas verdes tostadas no fogo, cereal triturado da colheita nova”.'
    reason: Registra alternativas legítimas para os termos agrícolas raros אָבִיב, גֶּרֶשׂ e כַּרְמֶל, cuja combinação admite pequenas diferenças de formulação.
lexical_decisions:
- source_word: מִנְחַת
  choice: oferta
  rationale: Em Levítico 2, מִנְחָה designa uma oferta feita de produtos agrícolas. “Oferta” mantém o termo ritual sem tornar redundante a expressão “oferta das primícias”.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: primícias
  rationale: Termo cultual consagrado e ainda compreensível para os primeiros produtos maduros dedicados a Deus.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino pessoal יהוה, em conformidade com a evidência direta do texto hebraico e com a camada inglesa auditada.
- source_word: אָבִיב
  choice: espigas novas
  rationale: Refere-se ao cereal ainda novo, na espiga, antes de estar plenamente seco. A expressão conserva a imagem agrícola sem recorrer ao sentido potencialmente ambíguo de “espigas verdes” no texto principal.
- source_word: קָלוּי בָּאֵשׁ
  choice: tostadas no fogo
  rationale: Comunica de modo natural o preparo do cereal pelo fogo, preservando tanto a ação quanto o meio indicado no hebraico.
- source_word: גֶּרֶשׂ
  choice: grãos triturados
  rationale: O substantivo denota cereal quebrado ou triturado; “grãos triturados” é concreto, claro e amplamente compreensível.
- source_word: כַּרְמֶל
  choice: da nova colheita
  rationale: Neste contexto agrícola, indica cereal fresco ou recém-colhido, não o topônimo Carmelo. “Nova colheita” expressa esse valor contextual sem falsa precisão.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: apresentar ... deverá apresentar
  rationale: Mantém a repetição do verbo ritual no período condicional e soa natural em português contemporâneo.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e segue a decisão teológica explicitada na camada inglesa mais recente, sem substituí-lo por um título.
- issue: Natureza da מִנְחָה neste versículo
  choice: oferta das primícias
  alternative: oferta de cereal das primícias
  rationale: O material cerealífero é explicitado na segunda metade do versículo. A formulação escolhida evita acrescentar ao sintagma inicial uma especificação que, embora correta no contexto do capítulo, não está lexicalmente expressa ali.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A construção condicional e a repetição ritual foram preservadas; “primícias” foi mantido como termo bíblico estabelecido, e a nota conserva a incerteza lexical da descrição agrícola.
