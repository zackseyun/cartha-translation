  text: וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ֗/הּ מִ/גִּרְשָׂ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ אִשֶּׁ֖ה לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: pt
  text: E o sacerdote queimará no altar a sua porção memorial, tirada dos grãos triturados e do azeite[a], junto com todo o olíbano — uma oferta feita pelo fogo a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos grãos quebrados” ou “dos grãos moídos grosseiramente”; o hebraico se refere a grãos triturados preparados para a oferta de cereal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: queimará no altar
  rationale: No contexto sacrificial, o hifil de קטר descreve queimar a oferta no altar, fazendo-a subir em fumaça. A explicitação de “no altar” comunica naturalmente o sentido ritual implícito.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כהן na legislação cultual.
- source_word: אַזְכָּרָתָהּ
  choice: como porção memorial
  rationale: Preserva o caráter técnico da porção representativa da oferta de cereal que era queimada no altar, sem definir além do que o hebraico permite a natureza exata do memorial.
- source_word: מִגִּרְשָׂהּ
  choice: parte dos grãos triturados
  rationale: גרש designa grãos ou sementes quebrados, triturados ou moídos grosseiramente. “Grãos triturados” é claro em português moderno; “parte de” expressa o valor partitivo de מן.
- source_word: וּמִשַּׁמְנָהּ
  choice: e do azeite
  rationale: O מן indica que a porção memorial é tomada também do azeite. “Azeite” é o termo natural no contexto de ofertas de cereal.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: junto com todo o incenso
  rationale: 'Neste rito, על indica acompanhamento: a porção memorial é queimada juntamente com todo o incenso.'
- source_word: אִשֶּׁה
  choice: uma oferta feita pelo fogo
  rationale: Mantém o termo sacrificial e sua ligação explícita com o fogo, evitando a possível impressão indevida de que se trate literalmente de alimento para Deus.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O lamed marca o destinatário ou a dedicação da oferta, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e corresponde à vocalização acadêmica amplamente aceita, sem substituí-lo por um título.
- issue: Sentido de אַזְכָּרָה no rito
  choice: porção memorial
  alternative: oferta memorial; porção de lembrança
  rationale: A expressão é mantida como termo cultual, sem decidir se o “memorial” serve primordialmente para recordar o ofertante diante de Deus ou para outra função memorial específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para tornar explícito que a porção memorial é retirada dos grãos e do azeite. O travessão conserva a aposição conclusiva do hebraico.
