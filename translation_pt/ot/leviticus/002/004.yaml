id: LEV.2.4
reference: Leviticus 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: pt
  text: 'E, se você apresentar uma oferta de cereal assada no forno, ela deverá ser feita de farinha fina: pães sem fermento amassados com óleo ou[a] discos finos sem fermento untados com óleo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e discos finos sem fermento”. O hebraico traz a conjunção “e”, mas aqui ela provavelmente introduz outra forma possível da oferta assada no forno.
    reason: alternativa lexical e preservação da ambiguidade sintática
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Mantém tanto a ligação com as instruções anteriores quanto a introdução de um novo caso condicional no discurso legal.
- source_word: תַקְרִב קָרְבַּן
  choice: você apresentar uma oferta
  rationale: O hifil de קרב expressa levar ou trazer para apresentação. “Apresentar uma oferta” comunica naturalmente o ato ritual sem reproduzir uma redundância pouco idiomática em português.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Neste contexto levítico, designa a categoria ritual preparada com farinha e azeite, e não uma dádiva ou tributo em sentido geral.
- source_word: מַאֲפֵה תַנּוּר
  choice: assada no forno
  rationale: Expressa de modo claro e corrente o método de preparo indicado pela construção hebraica.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Designa farinha de qualidade, finamente preparada para uso sacrificial.
- source_word: חַלּוֹת מַצּוֹת
  choice: pães sem fermento
  rationale: חַלּוֹת indica porções ou pães em forma de bolo; “pães” evita em português moderno a associação indevida de “bolos” com preparo doce.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: amassados com azeite
  rationale: Comunica que o azeite era incorporado à massa, em contraste com sua aplicação externa na preparação seguinte.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: ou discos finos sem fermento
  rationale: רְקִיקִים eram preparações finas; “discos finos” é mais transparente que “hóstias” e menos ambíguo que “bolachas”. O valor alternativo atribuído à conjunção é sinalizado em nota.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: untados com azeite
  rationale: No contexto culinário e ritual, משׁח descreve a aplicação de azeite sobre a superfície; “untados” preserva esse sentido concreto sem sugerir necessariamente uma cerimônia distinta de unção.
theological_decisions:
- issue: Sentido de מִנְחָה no contexto cultual
  choice: oferta de cereal
  alternative: oferta de tributo; dádiva
  rationale: Levítico 2 descreve uma categoria sacrificial feita de farinha e azeite. A tradução contextual preserva essa especificidade ritual sem acrescentar uma interpretação denominacional.
- issue: Relação entre os pães e os discos finos
  choice: ou
  alternative: e
  rationale: As duas preparações são mais naturalmente entendidas como formas alternativas da oferta assada no forno; contudo, como o hebraico emprega literalmente a conjunção “e”, a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Preferiu-se “apresentar” a uma reprodução literal de “fazer chegar perto”; “pães” e “discos finos” tornam as duas formas de preparo compreensíveis sem recorrer a vocabulário eclesiástico potencialmente carregado.
