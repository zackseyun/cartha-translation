  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: pt
  text: Leve a Yahweh[a] a oferta de cereal preparada com estas coisas; ele a apresentará ao sacerdote e a levará até o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para Yahweh”. A preposição hebraica pode indicar dedicação, além de direção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Leve
  rationale: O hifil perfeito com waw, neste contexto legal e instrutivo, funciona como ordem. O imperativo é a forma mais natural e direta em português.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: Em Levítico 2, מִנְחָה designa especificamente a oferta preparada com produtos cerealíferos, não uma oferta genérica.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: preparada com uma dessas coisas
  rationale: O nifal de עשה tem sentido passivo, e מֵאֵלֶּה remete às modalidades ou preparações descritas anteriormente. 'Uma dessas coisas' mantém a referência demonstrativa sem especificá-la além do hebraico.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל pode indicar direção ou dedicação. A tradução principal conserva a construção direcional no contexto de levar a oferta, enquanto a nota registra a alternativa dedicatória.
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: Apresente-a ao sacerdote
  rationale: O hifil de קרב exprime fazer chegar perto ou apresentar. O português 'apresentar ao sacerdote' comunica naturalmente esta etapa do rito.
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: e ele a levará até o altar
  rationale: O hifil de נגשׁ significa fazer aproximar. 'Levar até o altar' preserva o movimento e evita uma repetição pouco natural de 'apresentar'.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Valor da preposição ל em לַיהוָה
  choice: a Yahweh
  alternative: para Yahweh
  rationale: A preposição admite tanto direção quanto dedicação. A tradução principal acompanha a linguagem de movimento, e a nota preserva a ambiguidade legítima.
- issue: Sujeito de וְהִקְרִיבָהּ e וְהִגִּישָׁהּ
  choice: o ofertante apresenta a oferta ao sacerdote; o sacerdote a leva ao altar
  alternative: o sacerdote realiza ambas as ações
  rationale: A sequência ritual favorece a mudança de sujeito após a entrega ao sacerdote. A redação portuguesa explicita apenas o necessário para evitar a ambiguidade pronominal artificial, sem alterar a ordem das ações.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo 'Leve' reproduz naturalmente a força injuntiva da legislação. 'Oferta de cereal' mantém precisão cultual; a nota conserva a ambiguidade de לַיהוָה.
