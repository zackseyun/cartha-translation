  source_fidelity: A redação muda indevidamente o sujeito expresso pelas formas verbais fornecidas no texto hebraico. Depois de «Leve», o hebraico apresentado traz formas de terceira pessoa masculina com o sufixo «a oferta»; a tradução deve conservar essa mudança, ainda que o antecedente de «ele» permaneça não explicitado. Além disso, מֵאֵלֶּה é plural («destas/estas coisas»), não «uma dessas coisas».
  naturalness: «Oferta de cereal» é claro e adequado em português moderno. A sequência com «ele» é um pouco menos fluida por refletir uma referência não explicitada no texto-fonte, mas é preferível a transformar a ação em novo imperativo dirigido ao ofertante.
  terminology: «Yahweh» reproduz de modo consistente o Tetragrama, e «oferta de cereal» comunica adequadamente o sentido técnico de מִנְחָה neste contexto. A nota preserva de modo apropriado a alternativa semântica de לַיהוָה.
  issues:
