  - severity: low
    issue: «uma dessas coisas» restringe o demonstrativo plural.
    rationale: מֵאֵלֶּה significa «destas/estas coisas»; não há no hebraico o numeral ou a individualização «uma».
  revised_text: Leve a Yahweh[a] a oferta de cereal preparada com estas coisas; ele a apresentará ao sacerdote e a levará até o altar.
