id: LEV.2.12
reference: Leviticus 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: pt
  text: Como oferta das primícias, vocês poderão apresentá-los a Yahweh, mas eles não deverão subir ao altar como aroma agradável.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: oferta das primícias
  rationale: Expressa naturalmente a relação construta entre a oferta e as primícias, preservando o sentido cultual.
- source_word: תַּקְרִיבוּ
  choice: vocês poderão apresentar
  rationale: No contexto, o hifil de קרב indica apresentar algo como oferta; o valor permissivo contrasta essa apresentação permitida com a proibição de fazê-lo subir ao altar.
- source_word: אֹתָם
  choice: apresentá-los / eles
  rationale: O pronome masculino plural retoma os elementos mencionados no versículo anterior, isto é, produtos com fermento ou mel.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica direção ou dedicação, e o nome divino é transliterado para preservar o nome pactual presente no hebraico.
- source_word: לֹא יַעֲלוּ
  choice: não deverão subir
  rationale: Mantém a imagem verbal de עלה, 'subir', que no contexto sacrificial alude a ser colocado ou queimado sobre o altar, sem explicitar além do original.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: Preserva a metáfora sacrificial tradicional em português atual e comunica que se trata de um aroma que agrada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome próprio pactual sem substituí-lo por um título.
- issue: Sentido cultual de לֹא יַעֲלוּ
  choice: não deverão subir ao altar
  alternative: não deverão ser oferecidos sobre o altar
  rationale: A formulação escolhida conserva a imagem e a tensão do hebraico, enquanto o contexto esclarece que se trata da apresentação sacrificial no altar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronome explícito no plural para clareza. A redação mantém a metáfora hebraica de 'subir ao altar' e evita linguagem excessivamente técnica ou arcaica.
