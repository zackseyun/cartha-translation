  text: וְ/אִם מִנְחַ֥ת מַרְחֶ֖שֶׁת קָרְבָּנֶ֑/ךָ סֹ֥לֶת בַּ/שֶּׁ֖מֶן תֵּעָשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/007.yaml
  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
translation:
  language: pt
  text: E, se a sua oferta for uma oferta de cereal preparada numa panela[a], ela será feita de farinha fina com azeite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chapa”, “panela funda” ou “utensílio de cozinha”; não se sabe ao certo que tipo de recipiente o termo hebraico designa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva tanto a conjunção quanto a condição que introduzem mais um caso na sequência das instruções sacrificiais.
- source_word: מִנְחַת
  choice: oferta de cereal
  rationale: Em Levítico 2, o termo designa especificamente a oferta composta de produtos agrícolas, sobretudo farinha; esta expressão é clara e evita o sentido genérico de 'oferta'.
- source_word: מַרְחֶשֶׁת
  choice: panela
  rationale: Designa um utensílio usado no preparo da oferta, mas seu formato exato é incerto; 'panela' é natural e suficientemente abrangente em português.
- source_word: קָרְבָּנֶךָ
  choice: a sua oferta
  rationale: Expressa de modo natural o termo geral para aquilo que é apresentado a Deus e conserva o sufixo possessivo.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente claro e tradicional para a farinha refinada prescrita como ingrediente cultual.
- source_word: בַּשֶּׁמֶן
  choice: com azeite
  rationale: A preposição indica acompanhamento ou material de preparo sem exigir a interpretação mais específica 'misturada com'; no contexto bíblico alimentar, 'azeite' comunica naturalmente óleo de oliva.
- source_word: תֵּעָשֶׂה
  choice: ela será feita
  rationale: Mantém a voz passiva e o tom prescritivo da forma verbal hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção prescritiva natural. O referente feminino de 'ela' é 'oferta'. O marcador de nota foi mantido junto ao termo lexicalmente incerto.
