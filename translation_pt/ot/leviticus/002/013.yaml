base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: pt
  text: Toda oferta de cereal você temperará com sal.[a] Não deixe faltar, em sua oferta de cereal, o sal da aliança do seu Deus.[b] Com todas as suas ofertas, apresente sal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “com sal você salgará”.'
    reason: lexical_alternative
  - marker: b
    text: “O sal da aliança do seu Deus” traduz literalmente uma expressão associada, no contexto sacrificial, à fidelidade e à permanência.
    reason: cultural_note
  - marker: c
    text: 'Ou: “Sobre todas as suas ofertas, apresente sal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן
  choice: oferta
  rationale: Termo sacrificial amplo; “oferta” é natural, digno e adequado às duas ocorrências.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Em Levítico 2, designa especificamente a oferta feita de produtos cerealíferos, não uma oferta genérica.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: tempere com sal
  rationale: Expressa naturalmente em português a construção hebraica enfática, literalmente “com sal salgarás”, sem sugerir intensidade não explicitada.
- source_word: תַשְׁבִּית
  choice: não deixe faltar
  rationale: O hifil de שבת indica fazer cessar, retirar ou permitir que falte; esta formulação preserva claramente a proibição.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: o sal da aliança do seu Deus
  rationale: Mantém a cadeia genitiva e a imagem pactual do hebraico sem explicar além do que o texto declara.
- source_word: מֵעַל
  choice: à sua oferta de cereal
  rationale: A construção portuguesa “não deixar faltar algo a” comunica de modo idiomático a ideia hebraica de não retirar ou omitir o sal de sobre a oferta.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: com todas as suas ofertas
  rationale: “Com” expressa naturalmente que o sal deve acompanhar cada oferta; a alternativa mais literal “sobre” permanece em nota.
- source_word: תַּקְרִיב
  choice: apresente
  rationale: No contexto sacrificial, o hifil de קרב significa apresentar ou oferecer; “apresente” evita repetição excessiva de “oferta”.
theological_decisions:
- issue: Se a expressão pactual deve ser mantida literalmente ou explicada por paráfrase
  choice: Manter “o sal da aliança do seu Deus” no texto principal
  alternative: “o sal que simboliza a aliança do seu Deus”
  rationale: O hebraico não explica aqui o simbolismo do sal. A tradução preserva a imagem cultual, sua ambiguidade e sua tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega imperativos diretos e vocabulário sacrificial consistente, preservando no texto a imagem incomum do “sal da aliança”.
