id: LEV.2.1
reference: Leviticus 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: pt
  text: Quando alguém apresentar a Yahweh[a] uma oferta de cereais[b], a sua oferta será de farinha fina; derramará óleo sobre ela e colocará olíbano sobre ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao SENHOR”. “Yahweh” representa o nome divino יהוה.
    reason: divine_name
  - marker: b
    text: A expressão hebraica designa aqui uma oferta vegetal feita de cereal, neste caso, de farinha fina.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: alguém
  rationale: Embora o substantivo possa significar literalmente “ser vivente” ou “pessoa”, aqui designa qualquer indivíduo numa disposição legal. “Alguém” expressa com naturalidade esse valor indefinido.
- source_word: תַקְרִיב
  choice: apresentar
  rationale: O hifil de קרב descreve fazer chegar ou trazer uma oferta à presença de Deus. “Apresentar” conserva o sentido cultual sem soar técnico demais.
- source_word: קָרְבַּן מִנְחָה
  choice: uma oferta de cereais
  rationale: קָרְבַּן é o termo geral para aquilo que se apresenta como oferta, e מִנְחָה, neste contexto levítico, designa uma oferta vegetal feita de cereal.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל é representada por “a”, e o nome divino יהוה é transliterado como “Yahweh”, preservando-o como nome próprio.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: O termo designa farinha de qualidade, finamente moída e apropriada para ofertas.
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: a sua oferta será
  rationale: A construção especifica de que deve consistir a oferta. O possessivo singular do hebraico é preservado de forma natural em português.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: derramará óleo sobre ela
  rationale: A forma verbal tem força instrutiva na sequência legal. “Óleo” mantém a amplitude lexical de שֶׁמֶן, e “sobre ela” retoma a oferta.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: e colocará incenso sobre ela
  rationale: לְבֹנָה é a resina aromática conhecida como olíbano, usada como incenso. “Incenso” é a forma corrente e compreensível em português neste contexto cultual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama. A transliteração preserva o nome divino e evita substituí-lo por um título.
- issue: Gênero e número na instrução legal
  choice: alguém ... a sua oferta ... derramará ... colocará
  alternative: uma pessoa ... a oferta dela ... ela derramará ... colocará
  rationale: O hebraico apresenta um indivíduo singular em formulação representativa. “Alguém” mantém o singular e a abrangência da norma sem introduzir uma especificação de gênero inexistente no referente נֶפֶשׁ.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. Mantém-se o paralelismo instrutivo dos verbos e evita-se vocabulário excessivamente técnico; “incenso” é preferido a “olíbano” por sua maior acessibilidade.
