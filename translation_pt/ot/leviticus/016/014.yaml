  to: Em seguida, pegará um pouco do sangue do novilho e o aspergirá com seu dedo sobre a face oriental do propiciatório[a]; diante do propiciatório, aspergirá com seu dedo um pouco do sangue sete vezes.
  rationale: A revisão substitui uma perífrase espacial pouco natural por «face oriental», que comunica de modo conciso a face do propiciatório voltada para o leste. Também explicita o possessivo associado a «dedo». O restante conserva o valor prescritivo, a porção de sangue, os dois locais distintos da aspersão e o número de sete repetições.
