  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: pt
  text: Em seguida, pegará um pouco do sangue do novilho e o aspergirá com seu dedo sobre a face oriental do propiciatório[a]; diante do propiciatório, aspergirá com seu dedo um pouco do sangue sete vezes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tampa da expiação”. O hebraico kappóret designa a tampa da arca, o lugar associado à expiação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Depois, pegará
  rationale: O qatal com waw, no contexto de instruções rituais sequenciais, tem valor prescritivo; o futuro do indicativo expressa naturalmente em português a ação a ser realizada.
- source_word: מִדַּם הַפָּר
  choice: um pouco do sangue do novilho
  rationale: A preposição מִן tem sentido partitivo, indicando que se usa uma porção do sangue. “Novilho” é uma designação natural do animal sacrificial neste contexto.
- source_word: וְהִזָּה / יַזֶּה
  choice: aspergirá
  rationale: O verbo נזה, em contexto ritual sacerdotal, descreve a aplicação do sangue por aspersão. “Aspergir” é preciso, digno e corrente na linguagem cultual bíblica.
- source_word: בְאֶצְבָּעוֹ
  choice: com o dedo
  rationale: A preposição בְּ marca o instrumento usado; a formulação portuguesa é direta e natural.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה
  choice: sobre a parte da frente do propiciatório, voltada para o leste
  rationale: A tradução mantém tanto a aplicação sobre o objeto quanto sua orientação oriental, sem confundir essa ação com a aspersão feita diante dele na oração seguinte.
- source_word: הַכַּפֹּרֶת
  choice: propiciatório
  rationale: “Propiciatório” é o termo cultual reconhecível em português para a tampa da arca associada à expiação. Uma alternativa mais concreta é preservada em nota.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: e diante do propiciatório
  rationale: לִפְנֵי indica posição diante de ou em frente a; a escolha distingue este segundo local da aspersão feita sobre o propiciatório.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: O número explícito é preservado por sua função precisa no procedimento ritual.
theological_decisions:
- issue: Tradução de הַכַּפֹּרֶת
  choice: propiciatório
  alternative: tampa da expiação
  rationale: O termo designa concretamente a tampa da arca e está ligado à expiação no ritual. O texto principal conserva o termo cultual tradicional em português, enquanto a nota esclarece o sentido físico e mantém a alternativa lexical sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com futuro prescritivo próprio das instruções rituais. A sintaxe diferencia cuidadosamente a aspersão sobre a parte oriental do propiciatório daquela realizada diante dele.
