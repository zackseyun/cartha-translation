source:
  edition: WLC
  text: וְ/נָשָׂ֨א הַ/שָּׂעִ֥יר עָלָ֛י/ו אֶת כָּל עֲוֺנֹתָ֖/ם אֶל אֶ֣רֶץ גְּזֵרָ֑ה וְ/שִׁלַּ֥ח אֶת הַ/שָּׂעִ֖יר בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: pt
  text: O bode levará sobre si todas as iniquidades deles para uma terra isolada[a]; e o homem enviará o bode para o deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para uma terra separada”, “para uma terra inacessível” ou “para uma terra desolada”. O hebraico provavelmente indica um lugar isolado, separado das áreas habitadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: levará
  rationale: נשא significa carregar ou levar. “Levará” soa natural em português e preserva a imagem concreta de transportar as iniquidades para longe.
- source_word: הַשָּׂעִיר
  choice: o bode
  rationale: שָׂעִיר designa aqui um caprino macho; “bode” expressa isso de modo claro e corrente em português.
- source_word: עָלָיו
  choice: sobre si
  rationale: A expressão indica que as iniquidades ficam sobre o próprio bode. “Sobre si” preserva tanto a relação espacial quanto a referência reflexiva.
- source_word: כָּל עֲוֺנֹתָם
  choice: todas as iniquidades deles
  rationale: עָוֹן pode abranger iniquidade e culpa. “Iniquidades” mantém o peso moral e ritual do termo, sem reduzi-lo ao sentido mais genérico de “pecados”.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: para uma terra isolada
  rationale: גְּזֵרָה é um termo raro e difícil, associado à ideia de separação ou corte. “Terra isolada” comunica naturalmente um lugar separado da habitação, enquanto a nota conserva alternativas plausíveis.
- source_word: וְשִׁלַּח
  choice: e o homem soltará
  rationale: שׁלח pode significar enviar, deixar ir ou soltar. Como o sujeito implícito retoma o homem encarregado no versículo anterior, ele foi explicitado para evitar que o bode pareça ser o agente; “soltará” convém ao ato ritual.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר denota região erma, deserto ou zona não cultivada. “No deserto” é claro, corrente e adequado ao cenário ritual.
theological_decisions:
- issue: A imagem do bode que carrega as iniquidades
  choice: 'Manter a linguagem concreta: o bode leva sobre si as iniquidades do povo.'
  alternative: Parafrasear como “leva embora os pecados deles”.
  rationale: O hebraico descreve vividamente a transferência e remoção ritual das iniquidades. A formulação concreta preserva o simbolismo do texto sem impor conclusões doutrinárias posteriores.
- issue: Sentido de אֶרֶץ גְּזֵרָה
  choice: Traduzir no texto como “uma terra isolada” e registrar alternativas em nota.
  alternative: “uma terra separada”, “uma terra inacessível” ou “uma terra desolada”.
  rationale: A expressão é lexicalmente incerta. “Isolada” preserva a noção provável de separação e é idiomática em português, sem resolver de modo excessivo a ambiguidade.
- issue: Sujeito de וְשִׁלַּח
  choice: Explicitar “o homem”, retomando o encarregado mencionado no contexto imediato.
  alternative: Usar apenas “ele”, reproduzindo mais formalmente o sujeito implícito do hebraico.
  rationale: Em português, depois de “o bode levará”, um simples “ele soltará” poderia ser entendido como referência ao bode. A explicitação evita ambiguidade gramatical sem alterar o agente indicado pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a imagem ritual concreta e preserva em nota a incerteza do raro termo גְּזֵרָה.
