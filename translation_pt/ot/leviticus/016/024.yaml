  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: pt
  text: Lavará o corpo[a] com água em um lugar santo[b], vestirá as suas roupas, sairá e oferecerá o seu holocausto e o holocausto do povo, e fará expiação[c] por si mesmo e pelo povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a sua carne».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «em um lugar santo»; não necessariamente no Lugar Santo, o compartimento interior do santuário.'
    reason: lexical_alternative
  - marker: c
    text: Também pode ser traduzido por «fará expiação» ou, em certos contextos rituais, «fará purificação».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: Lavará
  rationale: O perfeito com waw numa sequência de instruções legais tem aqui valor prescritivo; o futuro do português expressa essa determinação com naturalidade.
- source_word: בְּשָׂרוֹ
  choice: o corpo
  rationale: Embora o hebraico diga literalmente «a sua carne», «o corpo» comunica com mais naturalidade a referência física no contexto de lavagem ritual.
- source_word: בַּמַּיִם
  choice: com água
  rationale: É a construção idiomática mais natural em português com o verbo «lavar».
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: num lugar santo
  rationale: A expressão hebraica não traz artigo definido em מָקוֹם; esta tradução evita identificá-la indevidamente com o compartimento técnico chamado Lugar Santo.
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: vestirá as suas roupas
  rationale: Formulação atual e clara que preserva a ação ritual de tornar a vestir suas próprias roupas.
- source_word: וְיָצָא
  choice: sairá
  rationale: Reproduz de modo direto o movimento para fora do lugar onde ocorreu a lavagem e a troca de roupas.
- source_word: וְעָשָׂה
  choice: oferecerá
  rationale: Diante de «holocausto», o verbo «oferecer» exprime naturalmente em português a realização do sacrifício.
- source_word: עֹלָתוֹ / עֹלַת הָעָם
  choice: o seu holocausto e o holocausto do povo
  rationale: «Holocausto» é o termo sacrificial tradicional e preciso para עֹלָה, e a construção mantém o paralelismo do hebraico.
- source_word: וְכִפֶּר
  choice: fará expiação
  rationale: Preserva o sentido ritual amplo de כפר sem restringi-lo a uma única teoria teológica; «expiação» é corrente e inteligível em português bíblico.
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: por si mesmo e pelo povo
  rationale: Expressa de forma concisa e natural a ação realizada em favor do sacerdote e do povo.
theological_decisions:
- issue: Sentido de כפר na legislação sacrificial levítica
  choice: fará expiação
  alternative: fará propiciação; realizará a purificação ritual
  rationale: «Fará expiação» conserva a amplitude do termo no contexto do Dia da Expiação e não decide entre explicações teológicas concorrentes. A nota registra outras nuances possíveis.
translation_notes:
  register: Português moderno, claro e digno, com futuro prescritivo adequado à sequência legal. «Roupas» favorece a legibilidade contemporânea, enquanto «holocausto» e «expiação» preservam o registro sacrificial bíblico. Os marcadores foram posicionados junto aos termos a que suas notas se referem.
