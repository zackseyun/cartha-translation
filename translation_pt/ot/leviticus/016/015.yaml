source:
  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: pt
  text: 'Então ele imolará o bode da oferta pelo pecado que é para o povo, levará o sangue para dentro do véu e fará com esse sangue como fez com o sangue do novilho: ele o aspergirá sobre a tampa da expiação[a] e diante dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, «propiciatório».
    reason: Registra a tradução histórica de כַּפֹּרֶת sem substituir no texto principal a formulação mais transparente e ligada ao objeto físico.
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Então ele sacrificará
  rationale: O verbo descreve o abate ritual; «sacrificará» é natural em português no contexto cultual, e «Então» expressa a progressão do waw.
- source_word: שְׂעִיר הַחַטָּאת
  choice: o bode da oferta pelo pecado
  rationale: Preserva a relação construta e identifica o animal ligado à oferta pelo pecado.
- source_word: אֲשֶׁר לָעָם
  choice: que é para o povo
  rationale: Distingue este bode do novilho oferecido por Arão e mantém explícito o beneficiário da oferta.
- source_word: אֶל מִבֵּית לַפָּרֹכֶת
  choice: para dentro do véu
  rationale: Expressa de modo idiomático o ingresso no espaço situado além do véu, sem acrescentar identificação interpretativa.
- source_word: וְעָשָׂה אֶת דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: fará com esse sangue como fez com o sangue do novilho
  rationale: Mantém a formulação elíptica do hebraico com clareza suficiente em português; «esse sangue» evita ambiguidade pronominal.
- source_word: הַפָּר
  choice: o novilho
  rationale: No contexto sacrificial, «novilho» é uma designação portuguesa corrente para פַּר e retoma o animal mencionado anteriormente.
- source_word: וְהִזָּה אֹתוֹ
  choice: ele o aspergirá
  rationale: «Aspergir» é o termo ritual consagrado e preciso; o pronome retoma o sangue.
- source_word: עַל הַכַּפֹּרֶת
  choice: sobre a tampa da expiação
  rationale: Identifica o objeto como a tampa da arca e conserva a associação lexical e ritual com expiação, evitando a opacidade de uma tradução meramente tradicional.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: e diante dela
  rationale: Preserva a distinção espacial entre aspergir sobre a tampa e diante dela, sem repetição pesada.
theological_decisions:
- issue: Tradução de כַּפֹּרֶת
  choice: tampa da expiação
  alternative: propiciatório
  rationale: «Tampa da expiação» torna clara a natureza física do objeto e preserva sua relação com o rito expiatório. «Propiciatório» é a forma tradicional, mas pode ser pouco transparente e sugerir uma interpretação teológica mais específica do que o termo exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe acompanha a sequência ritual do hebraico. O marcador [a] foi colocado imediatamente após a expressão explicada.
