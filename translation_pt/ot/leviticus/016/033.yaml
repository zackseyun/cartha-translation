  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: pt
  text: Assim, fará expiação pelo santuário santo[a] e pela Tenda do Encontro; fará expiação pelo altar; e fará expiação pelos sacerdotes e por todo o povo da assembleia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto ritual, o verbo hebraico כפר pode incluir a purificação, ou remoção da impureza, além da ideia de expiação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: fará expiação
  rationale: O verbo כפר tem aqui sentido técnico ritual. “Fazer expiação” preserva sua força cultual e permite manter o mesmo termo tanto para os espaços e objetos sagrados quanto para as pessoas, sem restringi-lo a uma teoria específica da expiação.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: o santuário santo
  rationale: Mantém os dois elementos da expressão hebraica — “santuário” e “santo/santidade” — sem especificar indevidamente “Lugar Santíssimo”, interpretação possível no contexto, mas não exigida pela forma da expressão.
- source_word: אֹהֶל מוֹעֵד
  choice: a Tenda do Encontro
  rationale: Tradução clara e consagrada que preserva tanto a imagem da tenda quanto sua função como lugar de encontro.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente português direto e natural para o termo cultual.
- source_word: עַל
  choice: por
  rationale: Com כפר, “por” expressa naturalmente em português a pessoa ou coisa em favor da qual, ou a respeito da qual, se realiza a expiação.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Tradução padrão e contextualmente inequívoca do plural hebraico.
- source_word: כָּל עַם הַקָּהָל
  choice: todo o povo da assembleia
  rationale: Conserva a formulação explícita do hebraico, que identifica o povo como pertencente à comunidade reunida; “assembleia” é atual e amplamente compreensível.
theological_decisions:
- issue: Aplicação da linguagem de expiação tanto a lugares e objetos sagrados quanto a pessoas
  choice: Manter “fará expiação” para o santuário, a Tenda, o altar, os sacerdotes e o povo.
  alternative: Usar “purificará” para os espaços e objetos sagrados e “fará expiação” para as pessoas.
  rationale: O hebraico repete intencionalmente כפר para todos os referentes. A uniformidade em português preserva a unidade ritual e a tensão semântica do texto, embora a remoção da impureza esteja incluída no rito.
translation_notes:
  register: Português moderno, digno e de leitura natural, com terminologia cultual estável. A ordem foi levemente ajustada para fluidez, sem alterar os referentes nem a repetição teológica central.
