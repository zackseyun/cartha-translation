  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: pt
  text: Aquele que enviar o bode para Azazel[a] lavará suas roupas, banhará o corpo em água e, depois disso, poderá entrar no acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destinado a Azazel”. O termo hebraico é controverso. Pode ser entendido como nome ou designação própria, ou interpretado de modo funcional, em referência à remoção, daí a expressão tradicional “bode expiatório”.
    reason: Leitura alternativa para um termo hebraico de sentido disputado.
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: Aquele que soltar
  rationale: O particípio com artigo funciona como substantivo e identifica a pessoa encarregada de soltar o bode. A formulação é natural em português e mantém o caráter prescritivo do contexto.
- source_word: הַשָּׂעִיר
  choice: o bode
  rationale: O substantivo designa aqui o bode macho já identificado no ritual; “o bode” é claro, preciso e idiomático.
- source_word: לַעֲזָאזֵל
  choice: para Azazel
  rationale: O termo hebraico é controverso. A transliteração preserva a ambiguidade, enquanto “para” pode expressar direção ou destinação sem impor uma interpretação específica.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavará as suas roupas
  rationale: Expressa de modo atual e digno a lavagem ritual exigida; o futuro tem valor prescritivo neste texto legal.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: banhará o corpo em água
  rationale: Embora בָּשָׂר signifique literalmente “carne”, “corpo” comunica naturalmente a referência à pessoa no contexto de purificação ritual, mantendo “em água” do hebraico.
- source_word: וְאַחֲרֵי כֵן
  choice: e, depois disso
  rationale: Reproduz com clareza a sequência temporal indicada pelo hebraico.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: poderá entrar no acampamento
  rationale: No encadeamento ritual, a forma verbal indica que a entrada volta a ser permitida após a lavagem, e não necessariamente uma nova ordem para entrar.
theological_decisions:
- issue: Sentido de לַעֲזָאזֵל no ritual do Dia da Expiação
  choice: Tratar Azazel como designação própria e transliterar o termo
  alternative: Traduzir como “para remoção”, “para o bode expiatório” ou relacioná-lo explicitamente a uma figura do deserto
  rationale: A origem e o sentido do termo são disputados. A transliteração evita decidir no texto principal entre interpretações funcionais, geográficas ou pessoais e preserva a tensão do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega futuro prescritivo no estilo legal e evita vocabulário excessivamente técnico. O marcador da nota aparece imediatamente após o termo explicado.
