  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: pt
  text: Arão imporá ambas as mãos sobre a cabeça do bode vivo e confessará sobre ele todas as iniquidades dos filhos de Israel[a], todas as suas transgressões e todos os seus pecados; ele os colocará sobre a cabeça do bode e o enviará ao deserto por meio de um homem designado para essa tarefa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas” ou “o povo de Israel”. O hebraico diz literalmente “filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por meio de um homem preparado para a ocasião”. O termo hebraico é incomum e pode destacar que o homem estava pronto, designado ou apto para a tarefa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: porá
  rationale: No contexto sacrificial, סמך designa o ato ritual de pôr ou apoiar as mãos sobre a vítima. “Porá” é natural em português e não especifica indevidamente o grau de pressão.
- source_word: שְׁתֵּי יָדוֹ
  choice: as duas mãos
  rationale: Reproduz claramente a expressão dual hebraica e destaca que Arão usa ambas as mãos.
- source_word: הַשָּׂעִיר הַחַי
  choice: o bode vivo
  rationale: Identifica de modo idiomático o bode que permanece vivo no ritual do Dia da Expiação.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: confessará sobre ele
  rationale: Preserva tanto o sentido de “confessar” quanto a relação espacial e ritual expressa por עַל.
- source_word: עֲוֺנֹת
  choice: iniquidades
  rationale: Mantém o peso moral e cultual do termo e o distingue dos outros dois vocábulos para pecado no versículo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Conserva a forma filial do hebraico, expressão corporativa tradicional e compreensível em português.
- source_word: פִּשְׁעֵיהֶם
  choice: suas transgressões
  rationale: Expressa violações ou atos de rebeldia e preserva a distinção dentro da tríade de termos.
- source_word: לְכָל חַטֹּאתָם
  choice: todos os seus pecados
  rationale: 'Neste encadeamento, a expressão funciona naturalmente como o terceiro item abrangente da enumeração: iniquidades, transgressões e pecados.'
- source_word: וְנָתַן אֹתָם
  choice: os colocará
  rationale: O pronome retoma coletivamente os males confessados, representados como postos ritualmente sobre a cabeça do bode.
- source_word: וְשִׁלַּח
  choice: enviará o bode
  rationale: Conserva a ideia de expulsão ou envio para longe; a repetição de “o bode” evita ambiguidade pronominal em português.
- source_word: בְּיַד אִישׁ עִתִּי
  choice: aos cuidados de um homem designado para essa tarefa
  rationale: Traduz idiomaticamente a agência de בְּיַד e adota para o difícil עִתִּי o sentido contextual de alguém preparado ou designado para a ocasião, sem ocultar a incerteza, registrada em nota.
- source_word: הַמִּדְבָּרָה
  choice: ao deserto
  rationale: A terminação direcional indica movimento para o deserto ou região erma; “ao deserto” é claro e natural.
theological_decisions:
- issue: Distinção da terminologia tríplice do pecado
  choice: iniquidades / transgressões / pecados
  alternative: pecados / rebeliões / faltas
  rationale: O hebraico acumula três termos próximos para expressar a totalidade do mal de Israel. Mantê-los distintos preserva a força retórica e teológica sem fazê-los parecer categorias técnicas rígidas.
- issue: Forma corporativa בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas / povo de Israel
  rationale: A opção conserva a imagem genealógica do original. A nota esclarece que a expressão designa corporativamente o povo, evitando restringi-la apenas aos homens.
- issue: Transferência ritual dos pecados para o bode
  choice: os colocará sobre a cabeça do bode
  alternative: simbolicamente os colocará sobre a cabeça do bode
  rationale: A tradução conserva a linguagem concreta do texto e não acrescenta “simbolicamente”, deixando intacta a formulação e sua tensão teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém a cadência ritual do hebraico, mas emprega futuro simples natural para a prescrição. Os marcadores [a] e [b] aparecem no texto exatamente nos pontos esclarecidos pelas notas.
