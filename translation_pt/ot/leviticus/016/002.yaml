base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Diga a Arão, seu irmão, que ele não entre a qualquer momento no santuário, para além do véu, diante da tampa da expiação[a] que está sobre a arca, para que não morra; pois aparecerei na nuvem, sobre a tampa da expiação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “propiciatório”, tradução tradicional de “tampa da expiação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: Diga a Arão, seu irmão
  rationale: Expressa naturalmente em português a ordem dirigida a Moisés e conserva explícita a relação fraterna.
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: que não entre a qualquer momento
  rationale: A construção negativa proíbe o acesso irrestrito, sem sugerir que Arão entrava continuamente.
- source_word: הַקֹּדֶשׁ
  choice: o Lugar Santo
  rationale: Designa aqui o recinto sagrado para dentro do véu; a forma consagrada continua clara ao leitor moderno.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: para dentro do véu
  rationale: Indica o espaço situado no lado interior do véu, preservando a perspectiva espacial do hebraico.
- source_word: הַכַּפֹּרֶת
  choice: a tampa da expiação
  rationale: Identifica concretamente a cobertura da arca e mantém sua associação ritual com a expiação.
- source_word: אֶל פְּנֵי
  choice: diante de
  rationale: Reproduz de modo idiomático a localização em frente à tampa.
- source_word: הָאָרֹן
  choice: a arca
  rationale: Mantém a forma breve do original, sem acrescentar “da aliança”.
- source_word: וְלֹא יָמוּת
  choice: para que não morra
  rationale: Comunica com clareza a consequência que deve ser evitada.
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: pois aparecerei na nuvem
  rationale: Mantém a forma verbal de aparição e a nuvem como esfera ou meio dessa manifestação, sem explicação adicional.
theological_decisions:
- issue: Sentido cultual de כַּפֹּרֶת
  choice: tampa da expiação
  alternative: propiciatório
  rationale: A escolha deixa claro que se trata da tampa da arca e preserva sua ligação com a expiação; a alternativa tradicional é registrada em nota.
- issue: Alcance de בְּכָל עֵת
  choice: proibição de entrar a qualquer momento
  alternative: não entrar em todo tempo
  rationale: O contexto trata de acesso não autorizado ao santuário interior, e não de uma entrada contínua.
- issue: Localização indicada por הַקֹּדֶשׁ מִבֵּית לַפָּרֹכֶת
  choice: Lugar Santo, para dentro do véu
  alternative: santuário, atrás do véu
  rationale: Preserva a formulação espacial do texto e evita introduzir uma designação técnica mais específica do que o substantivo hebraico isoladamente exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “A qualquer momento” comunica acesso irrestrito; “para dentro do véu” preserva a localização interna; a repetição de “tampa da expiação” acompanha a repetição hebraica.
