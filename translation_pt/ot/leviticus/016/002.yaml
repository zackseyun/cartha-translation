revisions:
- from: 'E Yahweh disse a Moisés: “Diga a Arão, seu irmão, que não entre a qualquer momento no Lugar Santo, para dentro do véu, diante da tampa da expiação[a] que está sobre a arca, para que não morra, pois aparecerei na nuvem sobre a tampa da expiação.”'
  to: 'E Yahweh disse a Moisés: “Diga a Arão, seu irmão, que ele não entre a qualquer momento no santuário, para além do véu, diante da tampa da expiação[a] que está sobre a arca, para que não morra; pois aparecerei na nuvem, sobre a tampa da expiação.”'
  rationale: A revisão substitui uma expressão espacial pouco idiomática por “para além do véu”, que comunica o lado interior do véu sem impor a designação técnica “Santo dos Santos”. Também reordena a cláusula final para tornar explícita a aparição na nuvem sobre a tampa, preservando a sintaxe e o sentido do hebraico. A nota lexical é mantida.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:56:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a proibição, a referência à arca e à tampa da expiação, bem como a razão ligada à manifestação divina. Contudo, “para dentro do véu” não expressa de modo natural nem suficientemente claro a localização indicada por מִבֵּית לַפָּרֹכֶת: o referente é o espaço para além/atrás do véu, não um movimento meramente ‘para dentro’ dele. A ordem final também deve manter clara a relação entre a nuvem e a manifestação sobre a tampa.'
  naturalness: O registro é geralmente claro e digno. “No Lugar Santo, para dentro do véu” é pouco idiomático em português e pode confundir a disposição espacial do santuário. “No santuário, para além do véu” é mais natural e claro para leitores internacionais, sem acrescentar uma designação técnica não presente no hebraico.
  terminology: “Yahweh”, “Arão”, “arca” e “tampa da expiação” são escolhas consistentes com o texto-fonte e com o audit trail. A nota que registra “propiciatório” como alternativa tradicional é apropriada.
  issues:
  - severity: medium
    issue: Localização expressa por “para dentro do véu”
    rationale: מִבֵּית לַפָּרֹכֶת indica a área interior, do outro lado do véu. Em português, “para dentro do véu” soa como se o véu fosse o destino ou como se se entrasse nele, em vez de indicar o recinto para além dele.
  - severity: low
    issue: Ordem da oração sobre a nuvem
    rationale: '“Aparecerei na nuvem sobre a tampa” pode fazer “sobre a tampa” modificar apenas “nuvem”. Reordenar para “na nuvem, sobre a tampa” reflete de maneira mais nítida a construção hebraica: a aparição ocorre na nuvem e é sobre a tampa.'
  revised_text: 'E Yahweh disse a Moisés: “Diga a Arão, seu irmão, que ele não entre a qualquer momento no santuário, para além do véu, diante da tampa da expiação[a] que está sobre a arca, para que não morra; pois aparecerei na nuvem, sobre a tampa da expiação.”'
  revised_footnotes:
