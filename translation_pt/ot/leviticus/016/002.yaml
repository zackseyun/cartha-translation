    text: Ou “propiciatório”, tradução tradicional de “tampa da expiação”.
    reason: lexical_alternative
  revision_rationale: A revisão substitui uma expressão espacial pouco idiomática por “para além do véu”, que comunica o lado interior do véu sem impor a designação técnica “Santo dos Santos”. Também reordena a cláusula final para tornar explícita a aparição na nuvem sobre a tampa, preservando a sintaxe e o sentido do hebraico. A nota lexical é mantida.
