source:
  edition: WLC
  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: pt
  text: 'E Arão lançará sortes sobre os dois bodes: uma sorte para o SENHOR e outra para Azazel[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «outra sorte para o bode expiatório». O sentido do termo hebraico «Azazel» é discutido; ele pode ser entendido como nome próprio, como referência à função do bode ou como termo relacionado à remoção.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: lançará
  rationale: Embora o verbo signifique literalmente «dar/pôr», em combinação com «sortes» e «sobre» exprime o ato ritual de lançar ou atribuir sortes; «lançará» é natural em português.
- source_word: עַל
  choice: sobre
  rationale: Preserva a imagem espacial e ritual da preposição hebraica sem substituí-la pela formulação mais interpretativa «para os dois bodes».
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: os dois bodes
  rationale: שָׂעִיר designa aqui o bode macho; «bodes» é preciso, corrente e adequado ao contexto ritual.
- source_word: גּוֹרָלוֹת
  choice: sortes
  rationale: Termo português tradicional e inteligível para o meio ou resultado empregado na determinação ritual por sorteio.
- source_word: גּוֹרָל אֶחָד
  choice: uma sorte
  rationale: Reproduz diretamente a expressão singular reiterada no hebraico e concorda naturalmente com o gênero do substantivo em português.
- source_word: לַיהוָה
  choice: para o SENHOR
  rationale: A preposição indica a atribuição da sorte; o tetragrama é vertido segundo a convenção portuguesa amplamente reconhecida como «o SENHOR».
- source_word: לַעֲזָאזֵל
  choice: para Azazel
  rationale: Como o sentido de עֲזָאזֵל é controverso, a transliteração preserva no texto principal a possibilidade de nome próprio e evita decidir entre interpretações concorrentes.
theological_decisions:
- issue: Sentido de עֲזָאזֵל no ritual do Dia da Expiação
  choice: Azazel, transliterado no texto principal
  alternative: o bode expiatório; remoção completa; uma figura pessoal associada ao deserto
  rationale: O próprio versículo não determina inequivocamente se o termo nomeia o bode ou sua função, um destino, ou um ser pessoal. A transliteração conserva a ambiguidade textual e evita impor uma interpretação doutrinária; a leitura tradicional «bode expiatório» aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Mantém o paralelismo conciso do hebraico e usa «bodes» para explicitar adequadamente o sexo indicado pelo substantivo hebraico.
