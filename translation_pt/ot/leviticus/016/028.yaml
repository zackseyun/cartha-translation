source:
  edition: WLC
  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/ם יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: pt
  text: Aquele que os queimar lavará as suas roupas e banhará o seu corpo em água[a]; depois disso, poderá entrar no acampamento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a sua carne”. Nesta expressão de lavagem, o sentido é “o seu corpo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “entrará no acampamento”. O verbo hebraico pode ser entendido como futuro simples, embora aqui provavelmente indique que a pessoa tem permissão para voltar a entrar depois de se lavar.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף אֹתָם
  choice: Aquele que os queimar
  rationale: O particípio com artigo designa a pessoa encarregada de queimar o novilho e o bode, ou seus restos, mencionados no contexto imediato. A construção portuguesa com futuro do subjuntivo é natural em legislação e mantém a referência indefinida.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavará as suas roupas
  rationale: O imperfeito tem força prescritiva neste contexto ritual. “Roupas” é atual e claro, sem perder o sentido de vestimentas.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ
  choice: e banhará o seu corpo
  rationale: Embora בשר signifique literalmente “carne”, nesta expressão de lavagem ritual refere-se ao corpo da pessoa. “Banhará” distingue a lavagem corporal da lavagem das roupas.
- source_word: בַּמָּיִם
  choice: em água
  rationale: A preposição ב integra a expressão hebraica de banhar-se em água; a tradução preserva de perto a formulação da fonte.
- source_word: וְאַחֲרֵי כֵן
  choice: depois disso
  rationale: A expressão indica a sequência temporal posterior às lavagens exigidas.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: poderá entrar no acampamento
  rationale: No contexto das normas de pureza, a entrada ocorre após a lavagem e representa reingresso permitido. “Entrar” exprime naturalmente o movimento para dentro do acampamento.
theological_decisions:
- issue: Força ritual da cláusula final
  choice: poderá entrar no acampamento
  alternative: entrará no acampamento
  rationale: O contexto favorece a noção de reingresso permitido após a purificação, mas o imperfeito hebraico também admite uma leitura simples ou prescritiva; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o tom prescritivo da legislação ritual e registra em notas tanto o sentido literal de בשר quanto a ambiguidade modal de יָבֹא.
