  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: pt
  text: Então, sairá e irá ao altar que está diante de Yahweh e fará expiação por ele[a]. Tomará um pouco do sangue do novilho e do sangue do bode e o colocará nos chifres do altar, em todos os lados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o purificará ritualmente”; em contextos sacerdotais, o verbo hebraico também pode destacar a remoção da impureza ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Depois, sairá
  rationale: O waw com a forma verbal perfeita dá continuidade à sequência ritual prescrita. O futuro em português expressa naturalmente a instrução, e “Depois” deixa claro o avanço do procedimento.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: o altar que está diante de Yahweh
  rationale: Mantém a identificação espacial do altar e traduz לִפְנֵי de forma próxima e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְכִפֶּר עָלָיו
  choice: e fará expiação por ele
  rationale: “Fazer expiação” conserva o sentido ritual e teológico amplo de כפר. O pronome “ele” retoma corretamente “altar”, substantivo masculino em português.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: Tomará um pouco do sangue do novilho e do sangue do bode
  rationale: A preposição מִן repetida tem valor partitivo, expresso naturalmente por “um pouco do sangue”. A coordenação reproduz as duas fontes de sangue.
- source_word: הַפָּר
  choice: novilho
  rationale: “Novilho” é a designação sacrificial corrente e compreensível em português para פַּר, sem necessidade de uma formulação mais longa.
- source_word: הַשָּׂעִיר
  choice: bode
  rationale: שָׂעִיר designa aqui o caprino macho já identificado no contexto; “bode” é preciso e natural.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: e o porá sobre as pontas do altar, ao redor
  rationale: “Porá” corresponde ao verbo comum נָתַן. “Pontas” comunica de modo acessível as projeções do altar chamadas literalmente de “chifres”; “ao redor” preserva סָבִיב. O objeto singular reflete a gramática hebraica após a menção dos dois sangues.
theological_decisions:
- issue: Sentido de כפר quando o altar é o objeto do rito
  choice: fará expiação por ele
  alternative: o purificará ritualmente
  rationale: A expressão tradicional “fazer expiação” preserva a amplitude cultual do verbo sem impor uma teoria específica da expiação. Como o objeto é o altar, a dimensão de purificação ritual é relevante e fica registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe acompanha a sequência do ritual sem rigidez excessiva; o nome Yahweh é mantido, e a nota preserva a nuance purificadora de כפר.
