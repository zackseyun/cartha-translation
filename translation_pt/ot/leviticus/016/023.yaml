  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: pt
  text: Então Arão entrará na tenda do encontro, tirará as vestes de linho que pôs quando entrou no lugar santo[a] e as deixará ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «santuário»; alguns entendem, com base no contexto mais amplo do Dia da Expiação, que se trata especificamente do Lugar Santíssimo.
    reason: Registra a amplitude semântica de הַקֹּדֶשׁ e uma interpretação contextual mais específica sem incorporá-la ao texto principal.
lexical_decisions:
- source_word: וּבָא
  choice: Então ... entrará
  rationale: No contexto de instruções rituais, o qatal com waw indica a etapa seguinte do procedimento. «Entrará» expressa naturalmente o movimento para dentro da tenda.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Designação clara e corrente da estrutura do santuário, mantendo a ideia de encontro presente no hebraico.
- source_word: וּפָשַׁט
  choice: tirará
  rationale: Equivalente português natural para retirar peças de roupa, sem a aspereza de «despir» ou a formalidade de «remover».
- source_word: בִּגְדֵי הַבָּד
  choice: as vestes de linho
  rationale: Preserva tanto o sentido de peças de vestuário quanto a especificação ritual do material.
- source_word: אֲשֶׁר לָבַשׁ
  choice: que pôs
  rationale: Representa o ato de vestir indicado por לבש e liga diretamente as vestes à entrada anterior.
- source_word: בְּבֹאוֹ
  choice: quando entrou
  rationale: O infinitivo construto com בְּ expressa circunstância temporal; «quando entrou» é idiomático e mantém o movimento para o interior.
- source_word: הַקֹּדֶשׁ
  choice: o lugar santo
  rationale: Tradução transparente do substantivo adjetivado, sem especificar no texto principal uma área arquitetônica mais precisa do que o hebraico explicita.
- source_word: וְהִנִּיחָם שָׁם
  choice: e as deixará ali
  rationale: Expressa com clareza a ordem de deixar as vestes naquele local, sem acrescentar um modo específico de depositá-las.
theological_decisions:
- issue: Referente de הַקֹּדֶשׁ
  choice: lugar santo
  alternative: santuário; Lugar Santíssimo
  rationale: O hebraico diz literalmente «o santo» ou «o lugar santo» e não emprega aqui a expressão mais completa que designaria inequivocamente o recinto interior. A tradução mantém essa amplitude, e a nota registra as interpretações possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência verbal no futuro preserva o caráter prescritivo e processual do rito; a redação evita capitalização interpretativa no texto principal.
