id: LEV.16.19
reference: Leviticus 16:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: pt
  text: Com o dedo, aspergirá sobre ele um pouco do sangue sete vezes e, assim, o purificará[a] e o consagrará[b] das impurezas dos filhos de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tornará ritualmente puro”. O verbo hebraico é um termo sacerdotal para remover a impureza ritual.
    reason: lexical_alternative
  - marker: b
    text: Ou “o santificará”, isto é, o tornará santo.
    reason: lexical_alternative
  - marker: c
    text: Isto é, os israelitas ou o povo de Israel; literalmente, “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: aspergirá
  rationale: O hifil de נזה, em contexto ritual, indica aspergir sangue. “Aspergirá” é o termo corrente e digno em português bíblico, sem ser obscuro.
- source_word: עָלָיו
  choice: sobre ele
  rationale: O pronome retoma o altar do versículo anterior; o masculino explícito evita ambiguidade em português.
- source_word: מִן־הַדָּם
  choice: um pouco do sangue
  rationale: 'Expressa naturalmente o valor partitivo da preposição מִן: sangue retirado da quantidade disponível para a aspersão.'
- source_word: בְּאֶצְבָּעוֹ
  choice: com o dedo
  rationale: A preposição בְּ tem valor instrumental. O possessivo pode ser omitido naturalmente em português porque o sujeito e o contexto deixam claro que se trata do dedo do sacerdote.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Preserva com exatidão a especificidade numérica do rito.
- source_word: וְטִהֲרוֹ
  choice: e, assim, o purificará
  rationale: טהר, no uso sacerdotal, significa tornar ritualmente puro. “Purificará” comunica melhor em português atual a ação ritual aplicada ao altar; “assim” explicita sem ampliar indevidamente a relação resultante entre o rito e os verbos seguintes.
- source_word: וְקִדְּשׁוֹ
  choice: e o consagrará
  rationale: קדש aqui significa tornar santo ou separar para uso sagrado. “Consagrará” é preciso, inteligível e adequado ao objeto cultual.
- source_word: מִטֻּמְאֹת
  choice: das impurezas
  rationale: Mantém o plural hebraico e a noção sacerdotal de impurezas rituais. A construção portuguesa “purificar das impurezas” preserva a relação indicada por מִן.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica masculina e coletiva de modo tradicional, transparente e amplamente compreensível em português.
theological_decisions:
- issue: Linguagem de purificação ritual aplicada ao altar
  choice: O altar é purificado e consagrado das impurezas rituais de Israel.
  alternative: Traduzir os verbos como “limpar” e “santificar”.
  rationale: 'O contexto é sacerdotal e cultual: não descreve conversão moral do altar, mas a remoção ritual da contaminação associada às impurezas do povo. “Purificar” e “consagrar” preservam essa distinção.'
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A escolha conserva a forma masculina e a expressão pactual coletiva do hebraico, sem excluir a referência ao conjunto da comunidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com terminologia ritual acessível. A ordem foi levemente ajustada para fluidez (“Com o dedo”), mantendo todos os componentes do hebraico. Os marcadores aparecem junto aos termos que esclarecem.
