source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: pt
  text: Yahweh falou a Moisés depois da morte dos dois filhos de Arão, quando eles se aproximaram diante de Yahweh[a] e morreram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando se aproximaram perante Yahweh”. Mais literalmente: “em sua aproximação diante de Yahweh”.'
    reason: Registra a construção com infinitivo e sufixo em בְּקָרְבָתָם e a locução לִפְנֵי יְהוָה, preservando sua nuance cultual.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: Na fórmula narrativa de introdução à fala divina, “falou” traduz diretamente דבר e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אַחֲרֵי מוֹת
  choice: depois da morte
  rationale: Expressa de modo idiomático a locução construta; o singular apresenta a morte dos dois filhos como um único acontecimento.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: os dois filhos de Arão
  rationale: Mantém de forma clara tanto o numeral quanto a relação familiar.
- source_word: בְּקָרְבָתָם
  choice: quando eles se aproximaram
  rationale: O ב prefixado ao infinitivo construto tem valor temporal; “se aproximaram” preserva a ideia verbal e sua possível conotação cultual.
- source_word: לִפְנֵי יְהוָה
  choice: da presença de Yahweh
  rationale: Em ligação com “se aproximaram”, esta formulação é natural em português e conserva a referência espacial e cultual à presença divina.
- source_word: וַיָּמֻתוּ
  choice: e morreram
  rationale: Reproduz diretamente a continuação narrativa e a concisão enfática do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” conserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Relação entre a aproximação à presença divina e a morte
  choice: quando eles se aproximaram da presença de Yahweh e morreram
  alternative: quando se apresentaram diante de Yahweh e morreram
  rationale: A tradução mantém a sequência e a tensão concisa do hebraico, sem explicitar uma causa nem acrescentar detalhes sobre a transgressão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem sacrificar a naturalidade; o marcador foi colocado junto à expressão que a nota esclarece.
