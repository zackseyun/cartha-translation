id: LEV.16.17
reference: Leviticus 16:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: pt
  text: Ninguém estará na tenda do encontro desde o momento em que ele entrar para fazer expiação no santuário até que saia. Ele fará expiação por si mesmo, por sua casa e por toda a assembleia de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל־אָדָם לֹא יִהְיֶה
  choice: Ninguém estará
  rationale: A construção hebraica significa literalmente que nenhuma pessoa deve estar presente. “Ninguém” comunica de modo natural e inclusivo a proibição, sem restringi-la indevidamente a homens adultos.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente da designação cultual hebraica, em linguagem corrente e digna.
- source_word: לְכַפֵּר
  choice: para fazer expiação
  rationale: Preserva o termo cultual central da passagem e sua relação com o rito do Dia da Expiação.
- source_word: בַּקֹּדֶשׁ
  choice: no santuário
  rationale: Neste contexto, o termo designa o espaço sagrado em que se realiza o rito; “santuário” preserva a abrangência do hebraico sem especificar além do texto.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: por si mesmo, por sua casa
  rationale: Mantém a sequência e o sentido representativo do hebraico; “casa” pode abranger família e unidade doméstica.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: toda a assembleia de Israel
  rationale: “Assembleia” traduz adequadamente קהל como a comunidade de Israel reunida ou considerada coletivamente.
theological_decisions:
- issue: Alcance de כָּל־אָדָם na proibição
  choice: Ninguém
  alternative: Nenhum homem
  rationale: אָדָם pode designar o ser humano ou qualquer pessoa. No contexto, a regra exclui toda e qualquer pessoa da tenda durante o rito; “ninguém” evita introduzir uma limitação de sexo que o hebraico não exige.
- issue: Referente de “ele”
  choice: Manter o pronome sem inserir “Arão”
  alternative: Quando Arão entrar... Arão fará expiação
  rationale: O referente contextual é Arão, mas o versículo hebraico usa sufixos pronominais. Manter “ele” preserva a coesão com o contexto e não acrescenta um nome ausente neste versículo.
- issue: Sentido de expiação
  choice: Preservar “fazer expiação” sem explicação interpretativa no corpo do texto
  alternative: purificar / obter perdão / reconciliar
  rationale: O verbo כפר tem dimensão ritual complexa neste capítulo. Uma paráfrase escolheria apenas um aspecto e poderia resolver indevidamente sua tensão teológica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e ampla compreensão internacional. A repetição pesada do inglês foi suavizada por “desde o momento em que... até que”, sem perda da delimitação temporal do hebraico.
