  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: pt
  text: Então Arão apresentará o bode sobre o qual caiu a sorte para Yahweh[a] e fará dele uma oferta pelo pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o bode para o qual saiu a sorte para Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: apresentará
  rationale: No contexto sacrificial, o hifil de קרב indica trazer para perto ou apresentar para a ação ritual. “Apresentará” é natural e não antecipa indevidamente o ato sacrificial expresso no fim da frase.
- source_word: הַשָּׂעִיר
  choice: o bode
  rationale: שׂעיר designa aqui um caprino macho; “bode” comunica essa especificidade de modo claro e conciso em português.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: sobre o qual caiu a sorte
  rationale: A expressão preserva a relação sintática do hebraico e emprega a formulação idiomática portuguesa “cair a sorte sobre” para a designação por sorteio.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל marca a destinação ou designação do bode, enquanto “Yahweh” translitera o nome divino expresso no texto hebraico.
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: e fará dele uma oferta pelo pecado
  rationale: Na legislação sacrificial, חטאת designa a oferta pelo pecado. “Fará dele” conserva o verbo עשה e deixa claro que o bode será destinado e tratado como essa oferta.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pactual e segue a decisão fornecida, sem substituí-lo por um título.
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: sacrifício pelo pecado; pecado
  rationale: Neste contexto ritual, o substantivo se refere à oferta sacrificial, não ao pecado em abstrato. “Oferta pelo pecado” conserva a categoria cultual sem impor uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém a sequência ritual do hebraico e preserva a alternativa idiomática relativa ao sorteio em nota.
