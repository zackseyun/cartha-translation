base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: pt
  text: Arão apresentará o novilho da oferta pelo pecado, que é para si mesmo[a], e fará expiação por si e por sua casa[b]; então abaterá o novilho da oferta pelo pecado, que é para si mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o novilho destinado à oferta pelo pecado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “por si e por sua casa”; aqui, “casa” se refere aos membros de sua casa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: apresentará
  rationale: O hifil de קרב, em contexto sacrificial, indica fazer chegar ou apresentar diante de Deus. “Apresentará” preserva a etapa ritual sem confundi-la com o sacrifício completo, pois o abate ocorre depois.
- source_word: פַּר הַחַטָּאת
  choice: o novilho da oferta pelo pecado
  rationale: A construção liga o novilho à oferta pelo pecado. Esta formulação mantém a terminologia sacrificial de modo claro e digno.
- source_word: אֲשֶׁר לוֹ
  choice: que é para si mesmo
  rationale: No contexto, a expressão indica que o animal se destina a Arão e à expiação em seu favor, não apenas que lhe pertence.
- source_word: וְכִפֶּר
  choice: fará expiação
  rationale: Em textos sacerdotais, כפר designa a realização ritual de expiação. A tradução conserva o sentido tradicional sem impor uma teoria específica sobre seu mecanismo.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: por si e por sua casa
  rationale: בעד indica benefício ou representação. “Sua casa” preserva de perto a imagem hebraica, cujo sentido contextual é o conjunto das pessoas de sua família ou casa.
- source_word: וְשָׁחַט
  choice: então matará
  rationale: O verbo designa o abate sacrificial. “Então” expressa naturalmente a progressão ritual indicada pela conjunção e pela sequência dos atos.
- source_word: פַּר הַחַטָּאת אֲשֶׁר לוֹ
  choice: o novilho da oferta pelo pecado, que é para si mesmo
  rationale: A repetição é mantida para refletir a ênfase e a estrutura ritual do hebraico.
theological_decisions:
- issue: Tradução da linguagem sacrificial de כפר
  choice: fará expiação
  alternative: fará purificação ritual
  rationale: “Fará expiação” preserva a amplitude convencional do termo sacerdotal e não reduz seu sentido à purificação nem introduz uma explicação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a repetição ritual do original e a expressão “sua casa”, esclarecida em nota. “Oferta pelo pecado” mantém terminologia bíblica reconhecível; “novilho” é natural para o animal sacrificial indicado por פַּר.
