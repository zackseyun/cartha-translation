id: LEV.16.31
reference: Leviticus 16:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: pt
  text: É um sábado de descanso completo para vocês, e vocês deverão se humilhar[a]; é um estatuto permanente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deverão afligir a si mesmos”; tradicionalmente entendido como incluindo jejum e autonegação.'
    reason: Alternativa lexical que preserva a formulação mais literal e informa a compreensão ritual tradicional sem restringir o texto principal.
lexical_decisions:
- source_word: שַׁבַּת
  choice: sábado
  rationale: Mantém a designação cultual e teológica estabelecida na Torá, em vez de reduzi-la à ideia genérica de um dia de descanso.
- source_word: שַׁבָּתוֹן
  choice: descanso completo
  rationale: Expressa a força intensiva da construção שַׁבַּת שַׁבָּתוֹן em português natural e atual.
- source_word: הִיא לָכֶם
  choice: É ... para vocês
  rationale: Preserva a declaração predicativa dirigida à comunidade com formulação clara e natural.
- source_word: וְעִנִּיתֶם
  choice: vocês deverão se humilhar
  rationale: Comunica o sentido ritual de humilhação e autonegação sem sugerir necessariamente violência física nem restringir o mandamento ao jejum.
- source_word: נַפְשֹׁתֵיכֶם
  choice: se
  rationale: Na expressão hebraica, נֶפֶשׁ tem função idiomática reflexiva; traduzi-la literalmente por “almas” poderia sugerir uma distinção antropológica ausente do contexto.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: Transmite de modo acessível a força duradoura da fórmula legislativa hebraica.
theological_decisions:
- issue: Sentido do mandamento de autonegação no Dia da Expiação
  choice: vocês deverão se humilhar
  alternative: vocês deverão se afligir; vocês deverão jejuar
  rationale: O hebraico emprega a expressão ampla ענה + נפשׁ, tradicionalmente associada ao jejum e à autonegação, mas não usa o verbo específico para jejuar. A tradução principal preserva essa amplitude, e a alternativa mais literal aparece em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Sábado” conserva o termo técnico da Torá; “vocês deverão” torna explícita a força normativa da forma verbal. A nota está posicionada imediatamente após a expressão a que se refere.
