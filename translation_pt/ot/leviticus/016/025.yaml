  text: וְ/אֵ֛ת חֵ֥לֶב הַֽ/חַטָּ֖את יַקְטִ֥יר הַ/מִּזְבֵּֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: pt
  text: E queimará sobre o altar a gordura da oferta pelo pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de purificação”. O termo hebraico pode designar a oferta usada para a purificação em relação ao pecado ou à impureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: E
  rationale: A conjunção liga esta ação à sequência ritual anterior; o marcador de objeto direto אֵת não recebe representação separada em português.
- source_word: חֵלֶב
  choice: a gordura
  rationale: O termo designa a gordura sacrificial reservada para ser oferecida; a tradução direta evita acrescentar uma especificação ausente neste versículo.
- source_word: הַחַטָּאת
  choice: da oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa tradicionalmente a oferta pelo pecado. A alternativa funcional «oferta de purificação» é preservada em nota.
- source_word: יַקְטִיר
  choice: queimará
  rationale: O hifil de קטר, em contexto sacrificial, indica queimar sobre o altar, fazendo subir fumaça. «Queimará» é natural e preciso neste contexto.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Embora a terminação direcional possa ser formalmente vertida como «ao altar», o contexto indica o lugar onde a gordura é queimada; «sobre o altar» expressa isso naturalmente.
theological_decisions:
- issue: Tradução de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo hebraico pode designar tanto o pecado quanto a oferta relacionada à purificação do pecado ou da impureza. A formulação tradicional permanece clara, enquanto a alternativa relevante é mantida em nota para não eliminar a nuance ritual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e terminologia sacrificial amplamente reconhecível. O futuro simples preserva o valor prescritivo da forma verbal hebraica.
