base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: pt
  text: Arão apresentará o novilho da oferta pelo pecado[a], destinado a ele, e fará expiação por si e por sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de purificação”. O termo hebraico חַטָּאת pode designar a oferta pelo pecado, com ênfase, em alguns contextos, na purificação ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: apresentará
  rationale: No contexto sacrificial, o hifil de קרב indica trazer ou apresentar a vítima diante de Deus. “Apresentará” preserva o caráter ritual sem antecipar todo o ato do sacrifício.
- source_word: פַּר
  choice: o novilho
  rationale: פַּר designa um bovino macho usado como vítima sacrificial. “Novilho” é corrente e apropriado na linguagem bíblica em português.
- source_word: הַחַטָּאת
  choice: da oferta pelo pecado
  rationale: Neste contexto, חַטָּאת designa a oferta sacrificial, não o pecado em sentido abstrato. A alternativa “oferta de purificação” é registrada em nota para preservar a possível ênfase ritual.
- source_word: אֲשֶׁר לוֹ
  choice: que é para si
  rationale: A expressão identifica o novilho como a oferta destinada ao próprio Arão, em contraste com as ofertas do povo. A formulação mantém o valor funcional da preposição sem reduzi-la à mera posse.
- source_word: וְכִפֶּר
  choice: e fará expiação
  rationale: Em legislação sacerdotal, כפר expressa a realização ritual de expiação. “Fará expiação” conserva sua força cultual e teológica sem especificar além do hebraico o mecanismo envolvido.
- source_word: בַּעֲדוֹ
  choice: por si
  rationale: בְּעַד com sufixo indica atuação em favor de ou em benefício de alguém. “Por si” é conciso e natural neste contexto.
- source_word: וּבְעַד בֵּיתוֹ
  choice: e por sua casa
  rationale: בַּיִת pode designar a família ou unidade doméstica. “Sua casa” preserva a expressão hebraica e, no contexto, é naturalmente entendida como a casa de Arão, isto é, seu grupo familiar.
theological_decisions:
- issue: Sentido de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O contexto exige que o termo denote uma oferta. A tradução tradicional “oferta pelo pecado” é clara e reconhecível, enquanto a nota preserva a leitura que destaca a função purificadora do rito.
- issue: Alcance de בֵּיתוֹ
  choice: sua casa
  alternative: sua família / os de sua casa
  rationale: “Casa” mantém a figura coletiva do hebraico e pode abranger a família ou unidade doméstica de Arão, sem restringir o referente a uma construção nem definir de modo excessivo sua extensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Emprega-se “novilho” como termo sacrificial corrente, “fará expiação” para conservar a linguagem cultual e “sua casa” para preservar a expressão coletiva do hebraico.
