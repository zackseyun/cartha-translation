revisions:
- from: Pegará um incensário cheio de brasas do altar que está diante de Yahweh, e também as duas mãos cheias de incenso aromático finamente moído, e os levará para o lado de dentro do véu.[a]
  to: Pegará um incensário cheio de brasas tiradas do altar diante de Yahweh e uma porção de incenso aromático finamente moído que encha ambas as mãos; levará tudo para dentro do véu.[a]
  rationale: A revisão torna explícito que a segunda quantidade é uma porção de incenso que enche ambas as mãos, preservando o dual hebraico e evitando a impressão de que as mãos são o objeto tomado. “Levará tudo” retoma de forma inequívoca o incensário e o incenso. “Tiradas do altar” mantém a origem espacial das brasas com português natural.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:56:02Z'
