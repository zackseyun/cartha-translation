source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: pt
  text: Pegará um incensário cheio de brasas tiradas do altar diante de Yahweh e uma porção de incenso aromático finamente moído que encha ambas as mãos; levará tudo para dentro do véu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para além do véu”. A expressão hebraica indica o espaço atrás da cortina, isto é, o santuário interior.'
    reason: alternativa lexical e esclarecimento espacial
lexical_decisions:
- source_word: וְלָקַח
  choice: Pegará
  rationale: O perfeito qal com waw, nesta sequência de prescrições rituais, expressa a próxima ação ordenada. O futuro do indicativo é natural em português jurídico e preserva o tom prescritivo.
- source_word: מְלֹא הַמַּחְתָּה
  choice: um incensário cheio
  rationale: A construção significa literalmente a capacidade cheia do recipiente. “Um incensário cheio” comunica com naturalidade tanto o objeto quanto a quantidade.
- source_word: גַּחֲלֵי אֵשׁ
  choice: brasas
  rationale: Em português, “brasas” já designa carvões ardentes; acrescentar “de fogo” seria pouco natural e redundante.
- source_word: מֵעַל הַמִּזְבֵּחַ מִלִּפְנֵי יְהוָה
  choice: do altar que está diante de Yahweh
  rationale: A formulação conserva a origem das brasas e deixa claro que “diante de Yahweh” caracteriza a localização do altar.
- source_word: וּמְלֹא חָפְנָיו
  choice: e também as duas mãos cheias de
  rationale: חָפְנָיו remete às duas mãos em concha. A formulação explicita o valor dual e mantém a imagem concreta da medida tomada com ambas as mãos.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: incenso aromático finamente moído
  rationale: סַמִּים indica substâncias aromáticas, e דַּקָּה descreve o material reduzido a partículas finas. A expressão é clara e preserva o detalhe ritual.
- source_word: וְהֵבִיא
  choice: e os levará
  rationale: O hifil de בוא indica fazer entrar ou levar. O pronome plural retoma naturalmente o incensário com brasas e o incenso.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: para o lado de dentro do véu
  rationale: A expressão espacial aponta para a entrada no espaço situado além da cortina. Esta tradução comunica a direção sem transformar “véu” em “santuário interior” no texto principal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. “Yahweh” preserva o caráter de nome próprio sem recorrer à substituição tradicional por um título.
- issue: Destino do incensário e do incenso em מִבֵּית לַפָּרֹכֶת
  choice: para o lado de dentro do véu
  alternative: para além do véu; dentro do véu
  rationale: A construção hebraica é espacialmente compacta, mas o contexto ritual indica movimento para o espaço atrás da cortina. A tradução conserva a referência ao véu e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O futuro mantém o estilo prescritivo; “as duas mãos cheias” preserva a medida corporal concreta do hebraico. O marcador [a] foi colocado junto à expressão que a nota explica.
