  source_fidelity: 'A versão identifica corretamente os elementos rituais: o incensário cheio de brasas retiradas do altar diante de Yahweh, a quantidade de incenso correspondente às duas mãos e a entrada para trás do véu. Contudo, a coordenação de “as duas mãos cheias” como objeto de “Pegará” pode sugerir que o sacerdote pega as próprias mãos, em vez de expressar a medida de incenso.'
  naturalness: O texto é geralmente claro e de registro apropriado. A construção “Pegará ... as duas mãos cheias de incenso ... e os levará” é sintaticamente pouco natural em português, e o pronome “os” fica com antecedente algo impreciso. Uma formulação que apresente explicitamente a porção de incenso melhora a legibilidade sem perder a medida corporal hebraica.
  terminology: “Incensário”, “brasas”, “altar”, “incenso aromático finamente moído”, “véu” e “Yahweh” são escolhas adequadas. “Para dentro do véu” preserva a imagem do hebraico; a nota esclarece legitimamente que se trata do espaço atrás da cortina.
