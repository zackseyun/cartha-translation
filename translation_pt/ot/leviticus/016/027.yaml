base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: pt
  text: O novilho da oferta pelo pecado e o bode da oferta pelo pecado, cujo sangue foi levado para dentro a fim de fazer expiação no santuário, ele os levará para fora do acampamento; e queimarão[a] no fogo as peles, a carne e o excremento deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa do singular (“ele os levará”) para o plural (“queimarão”), talvez distinguindo o oficiante das pessoas que o auxiliavam.
    reason: cultural_note
lexical_decisions:
- source_word: פַּר הַחַטָּאת
  choice: o novilho da oferta pelo pecado
  rationale: Expressa com clareza a função sacrificial do animal; “novilho” é natural no registro ritual de Levítico.
- source_word: שְׂעִיר הַחַטָּאת
  choice: o bode da oferta pelo pecado
  rationale: Mantém o paralelismo com o novilho e a categoria ritual tradicional de חַטָּאת.
- source_word: הוּבָא אֶת־דָּמָם
  choice: cujo sangue foi levado para dentro
  rationale: Preserva a voz passiva e explicita de modo natural o movimento de entrada no espaço sagrado.
- source_word: לְכַפֵּר
  choice: a fim de fazer expiação
  rationale: “Fazer expiação” é linguagem cultual reconhecível e não restringe indevidamente o alcance de כפר.
- source_word: בַּקֹּדֶשׁ
  choice: no santuário
  rationale: Neste contexto, designa o espaço sagrado onde o sangue foi introduzido.
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: ele os levará para fora do acampamento
  rationale: Verte naturalmente o hifil causativo e a direção indicada pela expressão hebraica; o pronome “os” torna explícitos em português os dois animais já mencionados.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: e queimarão no fogo
  rationale: Mantém a mudança do singular para o plural presente no hebraico e conserva a referência explícita ao fogo.
- source_word: עֹרֹתָם
  choice: o couro ... deles
  rationale: “Couro” é preciso para a pele retirada ou pertencente a animais nesse contexto; o singular coletivo é idiomático em português.
- source_word: בְּשָׂרָם
  choice: a carne ... deles
  rationale: “Carne” é a equivalência corrente e adequada para tecido animal em contexto sacrificial.
- source_word: פִּרְשָׁם
  choice: o excremento deles
  rationale: O termo se refere ao conteúdo excrementício, não simplesmente às entranhas; “excremento” é exato e digno.
theological_decisions:
- issue: Terminologia sacrificial de חַטָּאת e כפר
  choice: “oferta pelo pecado” e “fazer expiação”
  alternative: “oferta de purificação” e “purificar”
  rationale: A formulação escolhida é reconhecível ao leitor comum e preserva a função ritual sem resolver a tensão lexical em favor de uma teoria específica.
- issue: Mudança de número entre יוֹצִיא e וְשָׂרְפוּ
  choice: “ele os levará ... e queimarão”
  alternative: “ele os levará ... e os queimará”
  rationale: Conserva a mudança hebraica do singular para o plural, possivelmente distinguindo quem ordena ou conduz a remoção daqueles que executam a queima.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe foi naturalizada sem apagar a mudança de singular para plural do texto hebraico. “Para fora do acampamento” evita uma reprodução artificial da dupla marca direcional hebraica.
