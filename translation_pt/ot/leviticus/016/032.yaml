source:
  edition: WLC
  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: pt
  text: O sacerdote que for ungido e consagrado[a] para exercer o sacerdócio no lugar de seu pai fará a expiação e vestirá as roupas de linho, as roupas sagradas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “cuja mão ele encher”, expressão que indica a consagração ou investidura no serviço sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: fará a expiação
  rationale: No contexto ritual sacerdotal, כפר designa a realização do rito de expiação. A formulação preserva o sentido cultual sem explicar além do texto.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: O hebraico diz literalmente “o sacerdote”; embora o contexto aponte para o sumo sacerdote, o título mais específico não é acrescentado.
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: que for ungido
  rationale: A construção passiva é natural em português e expressa a identificação do sucessor devidamente ungido, preservando o valor prospectivo ou genérico do imperfeito.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: e consagrado
  rationale: A expressão hebraica “encher a mão” é um idioma de investidura no ofício sacerdotal. “Consagrado” comunica isso de modo claro no contexto, enquanto a forma literal é registrada em nota.
- source_word: לְכַהֵן
  choice: para exercer o sacerdócio
  rationale: Expressa de maneira natural a função oficial indicada pelo infinitivo hebraico, sem reduzir o sentido a uma ação isolada.
- source_word: תַּחַת אָבִיו
  choice: no lugar de seu pai
  rationale: תחת indica substituição ou sucessão no ofício; a tradução mantém essa relação sem convertê-la simplesmente em sequência temporal.
- source_word: וְלָבַשׁ
  choice: e vestirá
  rationale: O verbo descreve o ato ritual de vestir as roupas prescritas. “Vestirá” é conciso, digno e natural.
- source_word: בִּגְדֵי הַבָּד
  choice: as roupas de linho
  rationale: בד designa o linho das vestes sacerdotais; “roupas de linho” é claro para leitores comuns.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: as roupas sagradas
  rationale: A repetição em aposição identifica as roupas de linho como separadas para uso sagrado e preserva o vínculo com קדשׁ.
theological_decisions:
- issue: Traduzir הַכֹּהֵן como “o sacerdote” ou explicitar “o sumo sacerdote”
  choice: o sacerdote
  alternative: o sumo sacerdote
  rationale: O contexto trata do sucessor no ofício sumo sacerdotal, mas o texto hebraico emprega “o sacerdote” e o identifica por sua unção, consagração e sucessão. Mantém-se a expressão da fonte.
- issue: Como traduzir o idioma de ordenação “encher a mão”
  choice: consagrado
  alternative: cuja mão for cheia; ordenado; investido
  rationale: A tradução literal seria obscura em português moderno. “Consagrado” comunica a investidura sacerdotal no contexto, e a nota preserva o idioma hebraico e sua ambiguidade lexical.
- issue: Valor temporal dos verbos na descrição do sucessor
  choice: que for ungido e consagrado... fará... vestirá
  alternative: que é ungido e consagrado... deve fazer... deve vestir
  rationale: As formas hebraicas permitem uma descrição genérica com orientação futura. O futuro do subjuntivo seguido do futuro do indicativo soa natural em português e mantém o caráter prescritivo e sucessório.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “roupas” a “vestes” por clareza corrente, sem perder o tom ritual. A nota foi colocada após a frase inteira para não interromper a extensa identificação do sacerdote; seu conteúdo aponta inequivocamente para “consagrado”.
