base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: pt
  text: Pois, neste dia, será feita expiação por vocês[a], para purificá-los de todos os seus pecados; diante de Yahweh[b], vocês ficarão puros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele fará expiação por vocês”. O verbo hebraico está no singular, mas o sujeito não é declarado explicitamente nesta oração.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido como “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a ordem anterior e mantém uma ligação natural com o contexto.
- source_word: בַיּוֹם הַזֶּה
  choice: neste dia
  rationale: Reproduz de modo direto a expressão temporal e o demonstrativo hebraico.
- source_word: יְכַפֵּר עֲלֵיכֶם
  choice: será feita expiação por vocês
  rationale: Preserva o sentido ritual de כפר e evita determinar no texto principal o sujeito singular que não é expresso nesta oração.
- source_word: לְטַהֵר אֶתְכֶם
  choice: para purificá-los
  rationale: Expressa a finalidade ou o resultado da expiação e conserva o sentido de purificação ritual em português corrente.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: de todos os seus pecados
  rationale: Neste contexto, חטאת se refere aos pecados dos israelitas, dos quais eles são purificados, e não às ofertas pelo pecado.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Traduz לִפְנֵי como presença ou posição diante de alguém e apresenta diretamente o nome divino.
- source_word: תִּטְהָרוּ
  choice: vocês ficarão puros
  rationale: Distingue o estado resultante, expresso pelo qal, do ato anterior de purificar, expresso pelo piel.
theological_decisions:
- issue: Sujeito não expresso de יְכַפֵּר
  choice: 'Construção passiva: “será feita expiação”'
  alternative: “ele fará expiação”
  rationale: O verbo hebraico está no singular, mas o sujeito não aparece explicitamente nesta oração. A construção passiva evita identificar o agente no texto principal, enquanto a nota preserva a forma alternativa.
- issue: Nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração comunica o nome próprio da aliança presente no hebraico, sem substituí-lo por um título.
- issue: Sentido cultual de כפר
  choice: expiação
  alternative: purificação ritual
  rationale: “Expiação” conserva a categoria sacrificial do texto sem impor uma teoria posterior específica sobre seu mecanismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. O ponto e vírgula preserva a progressão entre a purificação dos pecados e o estado de pureza diante de Yahweh.
