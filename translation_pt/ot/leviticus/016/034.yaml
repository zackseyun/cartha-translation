  source_fidelity: A tradução transmite adequadamente a disposição duradoura, a expiação em favor dos filhos de Israel, a abrangência de seus pecados, a periodicidade anual e o sujeito masculino não expresso na frase final. A construção com dois-pontos, porém, apresenta o infinitivo «fazer expiação» como aposição explicativa de «estatuto», em vez de marcar claramente a finalidade expressa por לְכַפֵּר.
  naturalness: O registro é moderno e digno. «Para fazer expiação» integra de modo mais natural e sintaticamente claro a finalidade da norma. «Conforme Yahweh havia ordenado a Moisés» é compreensível e aceitável no contexto narrativo.
  terminology: «Estatuto permanente», «fazer expiação», «filhos de Israel» e «Yahweh» são escolhas consistentes com o hebraico e com as decisões terminológicas do projeto. «Por todos os seus pecados» preserva de forma idiomática a relação da expiação com os pecados, sem resolver indevidamente a nuance de purificação implicada em מִן.
