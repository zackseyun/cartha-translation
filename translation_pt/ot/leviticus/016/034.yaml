base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: pt
  text: Isto será para vocês um estatuto permanente, para fazer expiação pelos filhos de Israel, por todos os seus pecados, uma vez por ano. E ele fez conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת
  choice: Isto será
  rationale: Reproduz a introdução legal prospectiva do hebraico em português claro e solene.
- source_word: לָכֶם
  choice: para vocês
  rationale: Indica que o estatuto se aplica aos destinatários coletivos; é natural no português moderno.
- source_word: לְחֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: חֻקָּה designa uma prescrição estabelecida, e עוֹלָם expressa duração contínua no contexto da aliança.
- source_word: לְכַפֵּר
  choice: fazer expiação
  rationale: Preserva o sentido ritual e teológico de כפר no contexto sacerdotal de Levítico 16.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: pelos filhos de Israel
  rationale: Mantém a forma do etnônimo coletivo hebraico e expressa que a expiação é feita em favor deles.
- source_word: מִכָּל חַטֹּאתָם
  choice: por todos os seus pecados
  rationale: É uma formulação natural que conserva a relação da expiação com a totalidade dos pecados, sem excluir a possível nuance de purificação ou remoção.
- source_word: אַחַת בַּשָּׁנָה
  choice: uma vez por ano
  rationale: Expressa de modo idiomático e exato a periodicidade anual.
- source_word: וַיַּעַשׂ
  choice: E ele fez
  rationale: Mantém implícito o sujeito masculino singular, como no hebraico, sem inserir o nome de Arão.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: Expressa a conformidade com a ordem divina; o mais-que-perfeito composto esclarece naturalmente que a ordem precedeu seu cumprimento.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: Translitera o nome próprio da aliança presente no texto, sem substituí-lo por um título.
- issue: Sentido ritual de כפר
  choice: fazer expiação
  alternative: purificar; remover a culpa
  rationale: Conserva o termo teológico abrangente e evita limitar o verbo a apenas uma das nuances debatidas de purificação, reparação ou remoção.
- issue: Identidade do sujeito de וַיַּעַשׂ
  choice: ele
  alternative: Arão
  rationale: Embora o contexto favoreça Arão, o versículo não nomeia o sujeito; a tradução preserva essa implicitude.
- issue: Forma coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: Preserva de perto o etnônimo hebraico tradicional sem negar seu referente coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a linguagem jurídica e ritual do versículo sem arcaísmos desnecessários. Não há marcadores de nota porque nenhuma nota é indispensável para esta redação.
