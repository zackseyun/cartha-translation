reference: Leviticus 16:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: pt
  text: E da comunidade dos filhos de Israel ele pegará dois bodes para oferta pelo pecado[a] e um carneiro para holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. Em Levítico, o termo hebraico חַטָּאת pode designar a oferta que trata do pecado e da impureza ritual.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: E da
  rationale: 'Preserva a conjunção de continuidade e a ideia de procedência: os animais são tomados da comunidade.'
- source_word: עֲדַת
  choice: comunidade
  rationale: עֵדָה designa a comunidade coletiva de Israel; “comunidade” é natural, atual e apropriado ao contexto ritual.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a forma masculina representativa explícita do hebraico, que aqui designa corporativamente o povo de Israel.
- source_word: יִקַּח
  choice: ele pegará
  rationale: O imperfeito tem força prescritiva na legislação ritual; o futuro do indicativo expressa essa instrução com naturalidade em português.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: dois bodes
  rationale: A expressão especifica caprinos machos; “bodes” comunica de modo conciso tanto a espécie quanto o sexo.
- source_word: לְחַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת nomeia a oferta que trata do pecado e da impureza ritual. A formulação tradicional permanece clara, enquanto a alternativa funcional consta em nota.
- source_word: וְאַיִל אֶחָד
  choice: e um carneiro
  rationale: אַיִל denota especificamente um carneiro; o numeral é preservado de maneira natural.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה é a oferta inteiramente queimada; “holocausto” é o termo bíblico estabelecido em português para esse sacrifício.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas / povo de Israel
  rationale: A redação mantém a expressão masculina representativa do texto hebraico sem negar seu referente corporativo, isto é, o povo de Israel.
- issue: Tradução de חַטָּאת no sistema sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: “Oferta pelo pecado” é uma designação tradicional e inteligível, mas o termo também destaca a remoção de impureza ritual; a nota preserva essa dimensão sem resolver indevidamente a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Comunidade” evita o tom eclesiástico potencial de “congregação”; “filhos de Israel” preserva a forma da fonte. O marcador [a] aparece imediatamente após a expressão a que se refere.
