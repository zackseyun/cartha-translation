  source_fidelity: A tradução representa com precisão os quatro itens de vestuário, a designação cultual das vestes, a lavagem com água e o ato posterior de vesti-las. «Sobre o corpo» e «lavará o corpo» são equivalentes idiomáticos adequados de עַל־בשרו e את־בשרו, sem perda material de sentido.
  naturalness: O português é moderno, claro e de registro apropriado para instrução ritual. «Roupas de baixo» é uma solução corrente e compreensível para a peça inferior, e «enrolará em torno da cabeça o turbante» comunica bem a ação de envolver própria do verbo hebraico.
  terminology: «Túnica», «linho», «faixa», «turbante» e «vestes sagradas» são termos consistentes e adequados. A opção por «sagrado/a», em vez de «santo/a», preserva de modo natural o caráter separado das peças para uso cultual, sem introduzir interpretação adicional.
