base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: pt
  text: Vestirá a túnica sagrada de linho, e terá sobre o corpo as roupas de baixo de linho; amarrará em torno de si a faixa de linho e enrolará em torno da cabeça o turbante de linho. Essas são vestes sagradas. Lavará o corpo com água e então as vestirá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: túnica sagrada de linho
  rationale: Mantém a relação natural entre a túnica, seu material e seu caráter separado para o serviço sacerdotal. Em português, «sagrada» evita a leitura pouco natural de que o próprio tecido seja «santo».
- source_word: בַּד
  choice: linho
  rationale: No contexto das vestes sacerdotais, designa tecido de linho; «linho fino» acrescentaria uma qualidade não explicitada aqui.
- source_word: מִכְנְסֵי בַד
  choice: roupas de baixo de linho
  rationale: Expressa em linguagem atual a peça sacerdotal usada diretamente sobre o corpo, sem o arcaísmo de «calções» ou «ceroulas».
- source_word: עַל בְּשָׂרוֹ
  choice: sobre o corpo
  rationale: O hebraico diz literalmente «sobre sua carne», mas «sobre o corpo» comunica com naturalidade a localização concreta da roupa.
- source_word: אַבְנֵט
  choice: faixa
  rationale: Refere-se à faixa de tecido enrolada ou presa ao redor do corpo; é mais precisa no contexto cerimonial do que «cinto».
- source_word: מִצְנֶפֶת
  choice: turbante
  rationale: É o equivalente corrente e específico para a cobertura sacerdotal da cabeça.
- source_word: יִצְנֹף
  choice: enrolará em torno da cabeça
  rationale: Preserva a ideia verbal de enrolar ou envolver própria do uso do turbante e torna explícito em português o referente corporal naturalmente pressuposto.
- source_word: בִּגְדֵי קֹדֶשׁ
  choice: vestes sagradas
  rationale: Traduz a condição cultual das roupas como separadas para o serviço sacerdotal, em registro bíblico claro e digno.
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ
  choice: Lavará o corpo com água
  rationale: Conserva o ato ritual concreto; «corpo» é mais natural em português do que o literal «carne» neste contexto.
- source_word: וּלְבֵשָׁם
  choice: e então as vestirá
  rationale: O sufixo plural retoma as vestes, e a sequência hebraica indica que a lavagem antecede o ato de vesti-las; «então» torna essa progressão clara.
theological_decisions:
- issue: Natureza da santidade das vestes
  choice: «sagrada(s)» descreve as peças como separadas para uso sacerdotal
  alternative: «santa(s)»
  rationale: A tradução preserva a afirmação cultual do texto sem acrescentar simbolismo ou desenvolvimento doutrinário posterior.
- issue: Sentido de בשרו no contexto ritual
  choice: «corpo»
  alternative: «carne»
  rationale: Trata-se de uma escolha idiomática, não de uma reinterpretação teológica; «corpo» transmite com clareza tanto o contato da roupa quanto a lavagem ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega futuro prescritivo para refletir as instruções hebraicas. Não há notas de rodapé, pois as alternativas lexicais não são necessárias para preservar ambiguidade relevante neste versículo.
