  text: וְ/נָתַ֧ן אֶֽת הַ/קְּטֹ֛רֶת עַל הָ/אֵ֖שׁ לִ/פְנֵ֣י יְהוָ֑ה וְ/כִסָּ֣ה עֲנַ֣ן הַ/קְּטֹ֗רֶת אֶת הַ/כַּפֹּ֛רֶת אֲשֶׁ֥ר עַל הָ/עֵד֖וּת וְ/לֹ֥א יָמֽוּת־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: pt
  text: Ele porá o incenso sobre o fogo diante de Yahweh, para que a nuvem do incenso cubra a tampa da expiação[a] que está sobre o Testemunho e ele não morra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “propiciatório”. O termo hebraico se refere à tampa da arca, especialmente em sua função nos ritos de expiação.'
    reason: Alternativa lexical tradicional e esclarecimento do referente.
lexical_decisions:
- source_word: וְנָתַן
  choice: Ele porá
  rationale: No contexto de instruções rituais, a forma verbal tem valor prescritivo ou futuro. “Ele porá” conserva esse valor com linguagem natural e digna.
- source_word: הַקְּטֹרֶת
  choice: o incenso
  rationale: O substantivo designa o incenso empregado no rito do santuário; não é necessário explicitar no texto principal que se trata de uma mistura.
- source_word: עַל הָאֵשׁ
  choice: sobre o fogo
  rationale: Representa diretamente a colocação do incenso no fogo ou nas brasas, sem acrescentar uma explicação interpretativa.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão indica presença e proximidade cultual. “Diante de” é corrente em português e preserva a formulação hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְכִסָּה
  choice: para que ... cubra
  rationale: No encadeamento ritual, a oração apresenta o resultado pretendido da colocação do incenso sobre o fogo.
- source_word: עֲנַן הַקְּטֹרֶת
  choice: a nuvem do incenso
  rationale: Preserva de modo direto a construção hebraica e sua imagem, sem definir além do texto a relação entre a nuvem e o incenso.
- source_word: הַכַּפֹּרֶת
  choice: a tampa da expiação
  rationale: A expressão identifica a tampa da arca segundo sua função central nos ritos de expiação. É mais transparente ao leitor moderno do que o termo tradicional “propiciatório”.
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: que está sobre o Testemunho
  rationale: Mantém a designação cultual concisa do hebraico, sem expandi-la interpretativamente para “tábuas do Testemunho” ou “documento da aliança”.
- source_word: וְלֹא יָמוּת
  choice: assim, ele não morrerá
  rationale: Expressa a consequência protetora do rito em português natural. A formulação preserva a ligação com a oração anterior sem recorrer ao mais arcaico “para que não morra”.
theological_decisions:
- issue: Tradução de הַכַּפֹּרֶת no contexto do santuário e da expiação
  choice: tampa da expiação
  alternative: propiciatório
  rationale: “Tampa da expiação” conserva tanto o referente concreto — a cobertura da arca — quanto sua associação ritual com a expiação. O termo tradicional é registrado em nota por sua ampla presença na tradição bíblica em português.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva no texto o nome pessoal divino, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Relação lógica de וְלֹא יָמוּת com o rito precedente
  choice: 'consequência: “assim, ele não morrerá”'
  alternative: 'finalidade: “para que ele não morra”'
  rationale: A conjunção hebraica permite uma relação coordenada ou consequencial. A tradução explicita com moderação a consequência protetora do rito, sem transformar a afirmação em uma explicação teológica adicional.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e claro, com terminologia cultual transparente. A maiúscula em “Testemunho” sinaliza seu uso como designação específica no contexto do santuário.
