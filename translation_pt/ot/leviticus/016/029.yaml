  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: pt
  text: 'Isto será para vocês um estatuto permanente: no sétimo mês, no décimo dia do mês, vocês — tanto o nativo como o estrangeiro residente que vive entre vocês — se humilharão[a] e não farão trabalho algum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “afligirão a si mesmos”. Tradicionalmente, entende-se que a expressão inclui o jejum.
    reason: Preservar a alternativa lexical mais literal e esclarecer a associação tradicional sem restringir o texto principal.
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Isto será
  rationale: A fórmula legal aponta para as instruções anteriores; “isto” torna a referência natural em português sem acrescentar conteúdo.
- source_word: לְחֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: חֻקָּה designa uma prescrição ou norma estabelecida, e עוֹלָם expressa duração contínua no contexto da aliança.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: no sétimo mês
  rationale: חֹדֶשׁ tem aqui seu sentido calendárico comum de “mês”.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: no décimo dia do mês
  rationale: Explicita de modo idiomático o hebraico “no décimo do mês”.
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: vocês se humilharão
  rationale: A expressão indica humilhação ou abnegação pessoal e não deve ser limitada, no texto principal, apenas ao jejum.
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: não farão trabalho algum
  rationale: מְלָאכָה denota trabalho ou atividade laboral; a formulação preserva a proibição enfática.
- source_word: הָאֶזְרָח
  choice: o nativo
  rationale: אֶזְרָח é o membro nativo da comunidade, em contraste com o estrangeiro residente.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: o estrangeiro residente que vive entre vocês
  rationale: גֵּר designa um estrangeiro estabelecido na comunidade. A formulação conserva a repetição enfática entre o substantivo e o verbo, mas em português natural.
theological_decisions:
- issue: Sentido da ordem de abnegação no Dia da Expiação
  choice: vocês se humilharão
  alternative: vocês se afligirão; vocês jejuarão
  rationale: O hebraico possui alcance mais amplo que uma única prática ritual. Embora tradicionalmente inclua o jejum, traduzi-lo diretamente como “jejuarão” estreitaria o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O marcador da nota foi colocado junto à expressão que ele explica.
