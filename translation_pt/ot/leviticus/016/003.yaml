  text: בְּ/זֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל הַ/קֹּ֑דֶשׁ בְּ/פַ֧ר בֶּן בָּקָ֛ר לְ/חַטָּ֖את וְ/אַ֥יִל לְ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: pt
  text: 'Com isto Arão entrará no santuário: com um novilho do gado para oferta pelo pecado[a] e um carneiro para holocausto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico pode destacar tanto a relação com o pecado quanto a purificação ritual.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/זֹאת
  choice: Com isto
  rationale: A construção pode indicar meio ou modo. “Com isto” introduz naturalmente os sacrifícios exigidos para a entrada de Arão.
- source_word: יָבֹא
  choice: entrará
  rationale: O imperfeito, em contexto legal, tem força prescritiva; o futuro em português expressa adequadamente a instrução.
- source_word: אֶל הַ/קֹּדֶשׁ
  choice: no Lugar Santo
  rationale: No contexto do Dia da Expiação, designa o espaço sagrado no qual Arão entraria; “Lugar Santo” mantém a terminologia cultual reconhecível.
- source_word: בְּ/פַר בֶּן בָּקָר
  choice: com um novilho do gado
  rationale: A expressão hebraica é literalmente “um touro, filho do gado”, um idiomatismo que identifica um bovino; “novilho do gado” é natural e mantém a especificação da espécie.
- source_word: לְ/חַטָּאת
  choice: para oferta pelo pecado
  rationale: Em legislação sacrificial, חַטָּאת designa tradicionalmente a oferta pelo pecado, embora também possa destacar a função de purificação ritual; essa nuance é preservada em nota.
- source_word: וְ/אַיִל
  choice: e um carneiro
  rationale: אַיִל significa diretamente “carneiro”.
- source_word: לְ/עֹלָה
  choice: para holocausto
  rationale: עֹלָה é o termo habitual para o sacrifício inteiramente queimado; “holocausto” é a designação bíblica tradicional e corrente em português.
theological_decisions:
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: “Oferta pelo pecado” é uma tradução estabelecida e adequada, enquanto “oferta de purificação” evidencia sua função ritual. A alternativa é registrada sem eliminar a tensão semântica.
translation_notes:
  register: Português moderno, claro e digno, com terminologia cultual reconhecível. A sintaxe preserva a estrutura prescritiva e a enumeração do hebraico sem reproduzir literalmente seu idiomatismo bovino.
