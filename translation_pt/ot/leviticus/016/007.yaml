  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: pt
  text: Então pegará os dois bodes e os colocará diante de Yahweh, à entrada da tenda do encontro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Então pegará
  rationale: O perfeito qal com conjunção, no contexto de instruções rituais sequenciais, tem valor prospectivo; “Então pegará” expressa naturalmente a próxima ação prescrita.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: os dois bodes
  rationale: שָׂעִיר designa aqui um bode; o masculino específico é pertinente ao ritual e “bodes” é corrente em português.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: e os colocará
  rationale: O hifil de עמד significa fazer ficar de pé, posicionar ou apresentar. “Colocará” preserva a ação concreta sem acrescentar uma ideia cerimonial não explícita.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica posição ou presença diante de alguém; o nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: פֶּתַח
  choice: à entrada de
  rationale: פֶּתַח denota abertura ou entrada; “à entrada de” é idiomático e preciso para a localização.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: A expressão preserva os componentes hebraicos “tenda” e “encontro”, evitando substituir a designação original por um termo arquitetônico posterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pactual em forma transliterada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e força prescritiva adequada à sequência ritual. Não há marcadores de nota, pois nenhuma nota é necessária para esta redação.
