  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: pt
  text: Assim, fará expiação pelo santuário, por causa das impurezas dos filhos de Israel e de suas transgressões, por todos os seus pecados; e fará o mesmo pela tenda do encontro, que permanece com eles no meio das suas impurezas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: fará expiação
  rationale: No contexto ritual de Levítico 16, כפר designa a ação expiatória que também purifica o santuário; a expressão preserva a amplitude cultual do termo.
- source_word: עַל הַקֹּדֶשׁ
  choice: pelo santuário
  rationale: הַקֹּדֶשׁ refere-se aqui ao recinto sagrado afetado pelas impurezas de Israel; 'santuário' é claro e adequado ao contexto.
- source_word: מִטֻּמְאֹת
  choice: por causa das impurezas
  rationale: A preposição מן indica aquilo que torna necessária a expiação. O plural preserva as diversas impurezas rituais abrangidas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma corporativa hebraica, que continua compreensível em português bíblico contemporâneo.
- source_word: וּמִפִּשְׁעֵיהֶם
  choice: e das transgressões deles
  rationale: פשע expressa violações graves, por vezes com nuance de rebeldia; 'transgressões' conserva a gravidade sem tornar explícita uma nuance que pode permanecer implícita.
- source_word: לְכָל חַטֹּאתָם
  choice: isto é, de todos os seus pecados
  rationale: חטאות significa aqui 'pecados', em paralelo com impurezas e transgressões. 'Isto é' explicita em português a relação abrangente ou explicativa possível da construção.
- source_word: וְכֵן יַעֲשֶׂה
  choice: e fará o mesmo
  rationale: Expressa de modo natural a repetição da ação ritual em relação à tenda do encontro.
- source_word: לְאֹהֶל מוֹעֵד
  choice: pela tenda do encontro
  rationale: Tradução transparente da designação hebraica אֹהֶל מוֹעֵד, sem recorrer ao termo tradicional menos literal 'tabernáculo'.
- source_word: הַשֹּׁכֵן אִתָּם
  choice: que habita com eles
  rationale: Preserva o particípio singular que, gramaticalmente, modifica a tenda e ressalta sua permanência junto ao povo.
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: no meio das suas impurezas
  rationale: Conserva a imagem espacial e o plural hebraico, destacando que a tenda permanece entre um povo sujeito à impureza ritual.
theological_decisions:
- issue: Sentido de כפר no Dia da Expiação
  choice: fará expiação
  alternative: purificará; eliminará a impureza de
  rationale: A ação trata tanto da contaminação ritual do santuário quanto dos pecados do povo. 'Fará expiação' evita reduzir o rito somente à purificação.
- issue: Relação de לְכָל חַטֹּאתָם com as transgressões
  choice: isto é, de todos os seus pecados
  alternative: por todos os seus pecados
  rationale: A construção pode ser entendida como abrangente ou explicativa. A formulação adotada lê 'todos os seus pecados' como especificação do alcance das transgressões, sem identificar חטאות como ofertas pelo pecado.
- issue: Referente de הַשֹּׁכֵן
  choice: a tenda do encontro, que habita com eles
  alternative: a presença divina que habita com eles
  rationale: O particípio masculino singular concorda formalmente com אֹהֶל, também masculino. Não se introduz um referente divino não expresso, embora a linguagem da habitação possa evocá-lo teologicamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se os termos cultuais 'expiação', 'santuário', 'impurezas' e 'tenda do encontro'. A repetição de 'impurezas' preserva a moldura ritual do hebraico.
