revisions:
- from: Assim, fará expiação pelo santuário, por causa das impurezas dos filhos de Israel e das transgressões deles, isto é, de todos os seus pecados; e fará o mesmo pela tenda do encontro, que habita com eles no meio das suas impurezas.
  to: Assim, fará expiação pelo santuário, por causa das impurezas dos filhos de Israel e de suas transgressões, por todos os seus pecados; e fará o mesmo pela tenda do encontro, que permanece com eles no meio das suas impurezas.
  rationale: Substitui-se «isto é» por «por todos» a fim de não resolver como equivalência uma construção hebraica cuja relação exata é mais aberta, preservando simultaneamente «transgressões» e «pecados». «Permanece com eles» oferece uma formulação portuguesa mais natural para a tenda, mantendo o valor de habitação/residência do particípio hebraico.
