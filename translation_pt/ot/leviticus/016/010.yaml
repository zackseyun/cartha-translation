  source_fidelity: 'O texto reproduz adequadamente a estrutura e os elementos centrais do hebraico: o bode selecionado pela sorte para Azazel, sua apresentação vivo diante de Yahweh, a expiação ligada a ele e seu envio ao deserto para Azazel. A transliteração de “Azazel” preserva corretamente a incerteza lexical e interpretativa.'
  naturalness: O português é atual, claro e de registro bíblico apropriado. “Será apresentado vivo diante de Yahweh” é uma formulação natural para o passivo causativo hebraico. A sequência final “enviá-lo ao deserto, para Azazel” mantém deliberadamente a dupla relação direcional do original, embora seja um pouco marcada, o que é aceitável em tradução formal.
  terminology: “Bode”, “sorte”, “expiação”, “deserto” e “Azazel” são escolhas consistentes com o contexto ritual e com uma equivalência ótima. “Fazer expiação sobre ele” preserva, de maneira incomum mas inteligível, a abertura semântica de עָלָיו; a nota oferece de modo adequado a alternativa mais idiomática “por ele”.
