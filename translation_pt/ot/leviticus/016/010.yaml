  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: pt
  text: Mas o bode sobre o qual caiu a sorte para Azazel[a] será apresentado vivo diante de Yahweh, para fazer expiação sobre ele[b] e enviá-lo ao deserto, para Azazel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o bode emissário”. O sentido do termo hebraico “Azazel” é discutido; pode ser um nome próprio ou um termo associado à remoção.'
    reason: Leitura alternativa de um termo hebraico de sentido incerto.
  - marker: b
    text: 'Ou: “para fazer expiação por ele”.'
    reason: Alternativa lexical para a preposição hebraica.
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: Mas o bode
  rationale: שָׂעִיר designa aqui um bode, no contexto ritual. A conjunção foi vertida por “Mas” para marcar o contraste com o bode mencionado anteriormente.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: sobre o qual caiu a sorte
  rationale: Expressão portuguesa natural para o resultado do sorteio, preservando a imagem e a construção relacional do hebraico.
- source_word: לַעֲזָאזֵל
  choice: para Azazel
  rationale: O sentido de עֲזָאזֵל é controverso. A transliteração evita decidir se o termo é nome próprio, designação ritual ou expressão ligada à remoção.
- source_word: יָעֳמַד חַי
  choice: será apresentado vivo
  rationale: A forma verbal causativa-passiva indica que o bode é posto de pé ou apresentado; “será apresentado vivo” comunica isso naturalmente e ressalta o contraste com o bode morto.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” expressa com clareza a apresentação cultual, e “Yahweh” representa o nome divino no texto hebraico.
- source_word: לְכַפֵּר עָלָיו
  choice: para fazer expiação sobre ele
  rationale: “Fazer expiação” preserva o vocabulário sacrificial; “sobre ele” mantém a força de עַל sem determinar se o bode é beneficiário, objeto ritual ou instrumento da expiação.
- source_word: לְשַׁלַּח אֹתוֹ
  choice: e enviá-lo
  rationale: O infinitivo indica um propósito adicional. A coordenação com “e” torna natural em português a sequência “para fazer... e enviar...”.
- source_word: הַמִּדְבָּרָה
  choice: ao deserto
  rationale: A terminação direcional hebraica expressa movimento em direção ao deserto; “ao deserto” transmite esse sentido de forma concisa.
theological_decisions:
- issue: Sentido de עֲזָאזֵל
  choice: Azazel (transliteração)
  alternative: o bode emissário; remoção completa
  rationale: A identidade ou função de Azazel é discutida. Manter o termo transliterado preserva a ambiguidade do hebraico e evita impor uma interpretação sobre ser, lugar ou função ritual.
- issue: Força de לְכַפֵּר עָלָיו
  choice: fazer expiação sobre ele
  alternative: fazer expiação por ele
  rationale: A preposição עַל pode ser entendida de mais de uma maneira neste contexto. “Sobre ele” conserva a formulação hebraica e não resolve indevidamente a relação exata do bode com a expiação.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar as ambiguidades cultuais do hebraico. O marcador [a] foi colocado junto de “Azazel”, termo ao qual a nota se refere.
