id: LEV.16.20
reference: Leviticus 16:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: pt
  text: Quando terminar de fazer expiação[c] pelo santuário[a], pela tenda do encontro e pelo altar, apresentará[b] o bode vivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugar santo”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “fará chegar” ou “trará para perto”; isto é, apresentará para a próxima ação ritual.'
    reason: lexical_alternative
  - marker: c
    text: Neste contexto, “fazer expiação” também pode ser entendido como realizar purificação ou remoção ritual da impureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה
  choice: Quando terminar
  rationale: A forma verbal expressa a conclusão da ação anterior e, seguida de מִכַּפֵּר, introduz naturalmente em português uma oração temporal que marca a sequência ritual.
- source_word: מִכַּפֵּר
  choice: de fazer expiação
  rationale: כפר é um termo ritual central em Levítico. “Fazer expiação” preserva sua amplitude cultual e teológica sem limitar o sentido a uma única explicação do mecanismo envolvido.
- source_word: הַקֹּדֶשׁ
  choice: o santuário
  rationale: Neste contexto do Dia da Expiação, o termo designa o espaço sagrado. “Santuário” é claro e natural, embora “lugar santo” também seja lexicalmente possível.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução direta e reconhecível da expressão hebraica, sem substituí-la pelo termo interpretativo mais amplo “tabernáculo”.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente português direto e corrente para o termo cultual hebraico.
- source_word: וְהִקְרִיב
  choice: apresentará
  rationale: O verbo significa literalmente “fazer chegar” ou “trazer para perto” e, no contexto ritual, indica apresentar o animal para a ação seguinte.
- source_word: הַשָּׂעִיר הֶחָי
  choice: o bode vivo
  rationale: A expressão distingue este bode daquele que já foi morto; “o bode vivo” é conciso, natural e mantém esse contraste.
theological_decisions:
- issue: Sentido de כפר no contexto sacrificial
  choice: fazer expiação
  alternative: realizar a purificação ritual
  rationale: “Fazer expiação” conserva o peso sacrificial e a amplitude semântica do termo, sem impor uma teoria específica da expiação. Uma ideia de purificação ou remoção ritual pode estar presente no contexto e é registrada em nota.
- issue: Identificação de הַקֹּדֶשׁ
  choice: o santuário
  alternative: o lugar santo
  rationale: “Santuário” comunica com clareza a referência ao espaço sagrado neste contexto, enquanto a alternativa mais formal permanece legítima e é indicada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A estrutura temporal explicita naturalmente a sequência ritual do hebraico. Mantiveram-se os termos cultuais tradicionais “expiação”, “santuário” e “altar”, acompanhados de notas onde há ambiguidade lexical genuína.
