base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: pt
  text: Então o puseram sob custódia, para que se lhes declarasse[a], segundo a palavra de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que se lhes esclarecesse”. O verbo hebraico pode indicar tornar algo explícito, explicar ou declarar de modo distinto; o objeto do esclarecimento não é expresso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: Então o mantiveram
  rationale: A forma causativa de נוח pode significar pôr ou deixar alguém em determinado estado ou lugar. Com “sob custódia”, “o mantiveram” expressa naturalmente a detenção, enquanto “Então” dá continuidade à narrativa.
- source_word: בַּמִּשְׁמָר
  choice: sob custódia
  rationale: מִשְׁמָר designa aqui guarda ou confinamento. “Sob custódia” é claro, atual e adequado ao contexto jurídico.
- source_word: לִפְרֹשׁ
  choice: para que isso lhes fosse esclarecido
  rationale: O infinitivo de פרשׁ significa tornar claro, explicar ou declarar distintamente. A construção passiva em português evita definir quem faria o esclarecimento; “isso” supre naturalmente o objeto não expresso no hebraico sem especificar se se tratava de decisão, pena ou procedimento.
- source_word: לָהֶם
  choice: lhes
  rationale: O pronome se refere aos que aguardavam a orientação; o objeto indireto “lhes” reproduz a relação de modo conciso e natural.
- source_word: עַל־פִּי
  choice: segundo a palavra de
  rationale: O idioma, literalmente “segundo a boca de”, indica conformidade com uma declaração autorizada. “Segundo a palavra de” conserva tanto o caráter verbal quanto a autoridade da revelação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é vertido pelo nome divino “Yahweh”, em vez de ser substituído por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título.
- issue: Conteúdo do esclarecimento aguardado
  choice: isso lhes fosse esclarecido
  alternative: a decisão lhes fosse esclarecida
  rationale: O hebraico não explicita o objeto de לִפְרֹשׁ. “Isso” preserva essa abertura, ao passo que “a decisão” introduziria uma especificação jurídica plausível, mas não expressa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sob custódia” mantém o contexto jurídico sem soar excessivamente técnico; a formulação preserva a indefinição do objeto no hebraico.
