  source_fidelity: A tradução conserva adequadamente a repetição distributiva de בְּיוֹם הַשַּׁבָּת, o objeto singular coletivo de יַעַרְכֶנּוּ, a apresentação diante de Yahweh, a recorrência indicada por תָּמִיד, a relação de מֵאֵת com os filhos de Israel e a expressão explícita בְּרִית עוֹלָם. “Da parte dos filhos de Israel” preserva de modo prudente a relação sem resolver além do necessário a nuance entre procedência e representação.
