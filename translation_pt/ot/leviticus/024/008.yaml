  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/י֨וֹם הַ/שַּׁבָּ֜ת בְּ/י֣וֹם הַ/שַּׁבָּ֗ת יַֽעַרְכֶ֛/נּוּ לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד מֵ/אֵ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: pt
  text: A cada sábado[a], ele o colocará em ordem[b] diante de Yahweh, continuamente, da parte dos filhos de Israel[c], como aliança perpétua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no dia do sábado, no dia do sábado”, expressão que significa “a cada sábado” ou “sábado após sábado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele o disporá”. O pronome singular trata coletivamente a disposição dos pães.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “proveniente dos filhos de Israel”. A expressão hebraica pode indicar procedência ou participação da comunidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: A cada sábado
  rationale: A repetição hebraica tem força distributiva e indica a recorrência semanal. A formulação comunica o sentido idiomático em português atual.
- source_word: יַעַרְכֶנּוּ
  choice: ele o colocará em ordem
  rationale: O verbo ערך denota dispor ou organizar cuidadosamente. O pronome singular provavelmente retoma coletivamente a disposição dos pães.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a expressão cultual de apresentação na presença divina e mantém o nome próprio representado pelo Tetragrama.
- source_word: תָּמִיד
  choice: continuamente
  rationale: No contexto sacerdotal, indica observância contínua e regular; a periodicidade concreta já foi definida por 'a cada sábado'.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: da parte dos filhos de Israel
  rationale: מֵאֵת pode marcar procedência ou agência. 'Da parte de' preserva a relação com Israel sem decidir de modo excessivo entre oferta proveniente deles e observância em nome deles.
- source_word: בְּרִית עוֹלָם
  choice: como aliança perpétua
  rationale: Mantém diretamente a linguagem de aliança e o sentido duradouro de עוֹלָם, sem acrescentar a noção interpretativa de 'obrigação'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega o Tetragrama; 'Yahweh' preserva o nome pactual de acordo com a convenção do projeto.
- issue: Sentido de בְּרִית עוֹלָם na legislação ritual
  choice: como aliança perpétua
  alternative: como obrigação permanente da aliança
  rationale: A tradução conserva tanto a categoria explícita de aliança quanto sua duração, sem transformar a frase em uma explicação jurídica mais específica do que o hebraico.
- issue: Expressão corporativa בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A opção conserva a forma masculina e genealógica do hebraico, usada aqui em sentido corporativo.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível. A tradução mantém a cadência ritual, o nome Yahweh e a linguagem explícita de aliança, ao mesmo tempo que registra em notas as ambiguidades lexicais relevantes.
