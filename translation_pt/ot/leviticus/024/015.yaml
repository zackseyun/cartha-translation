  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֥ישׁ אִ֛ישׁ כִּֽי יְקַלֵּ֥ל אֱלֹהָ֖י/ו וְ/נָשָׂ֥א חֶטְאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: pt
  text: 'E diga aos filhos de Israel[a]: “Se qualquer homem[b] amaldiçoar o seu Deus, levará sobre si o seu pecado[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão se refere coletivamente ao povo de Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “quem quer que seja”. O hebraico repete “homem” para dar ênfase distributiva: “homem, homem”.'
    reason: lexical_alternative
  - marker: c
    text: “Levar sobre si o seu pecado” é uma expressão hebraica que significa arcar com a culpa ou com a responsabilidade pela ofensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: E você dirá aos filhos de Israel
  rationale: Mantém a conjunção, o destinatário e a expressão familiar masculina do hebraico. “Filhos de Israel” designa coletivamente o povo de Israel; “você dirá” comunica em português atual a instrução legal dirigida a Moisés.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: Em português, os dois-pontos introduzem naturalmente a fala e evitam o pouco idiomático “dizendo”, sem perder a função quotativa do infinitivo hebraico.
- source_word: אִישׁ אִישׁ
  choice: qualquer homem
  rationale: A repetição de אִישׁ tem força distributiva. “Qualquer homem” preserva tanto essa força quanto a forma masculina singular da formulação legal.
- source_word: כִּי יְקַלֵּל
  choice: Se ... amaldiçoar
  rationale: כִּי introduz o caso legal condicional, e o piel de קלל expressa amaldiçoar ou tratar com desprezo. “Amaldiçoar” evita antecipar o termo mais específico do versículo seguinte.
- source_word: אֱלֹהָיו
  choice: o seu Deus
  rationale: Preserva o possessivo e o sentido singular mais provável no contexto, sem substituir a expressão hebraica por “o SENHOR”.
- source_word: וְ/נָשָׂא חֶטְאוֹ
  choice: levará sobre si o seu pecado
  rationale: Conserva de modo compreensível o idioma hebraico de carregar o próprio pecado, isto é, responder pela culpa decorrente da ofensa.
theological_decisions:
- issue: Alcance de אֱלֹהָיו
  choice: o seu Deus
  alternative: o SENHOR; Deus; seus deuses
  rationale: O texto usa a designação possessiva e não o nome divino. Mantê-la preserva a distinção entre este enunciado e a infração mais específica tratada no versículo seguinte.
- issue: Sujeito masculino da lei
  choice: qualquer homem
  alternative: qualquer pessoa; quem quer que
  rationale: A formulação conserva o masculino singular repetido distributivamente no hebraico, sem restringir ou ampliar silenciosamente a expressão do texto.
- issue: Sentido de “levar o pecado”
  choice: manter o idioma no texto e explicá-lo em nota
  alternative: será culpado; sofrerá a pena por seu pecado
  rationale: O hebraico pode abranger culpa e responsabilidade pelas consequências. A tradução mantém essa amplitude, em vez de reduzi-la apenas à culpa moral ou à pena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para soar natural, e a fórmula quotativa hebraica foi representada por dois-pontos. Preservaram-se a expressão “filhos de Israel”, o sujeito legal masculino e a tensão semântica do idioma “levar sobre si o pecado”.
