id: LEV.24.21
reference: Leviticus 24:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: pt
  text: Quem matar um animal deverá fazer restituição por ele; mas quem matar uma pessoa será morto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode significar “golpear” ou “ferir”; aqui, as penalidades indicam que o golpe causa a morte.
    reason: ambiguity
lexical_decisions:
- source_word: מַכֵּה
  choice: quem matar
  rationale: O particípio hifil de נכה pode designar quem golpeia ou fere; neste contexto, as consequências previstas mostram que o golpe é fatal. “Quem matar” comunica com clareza essa força letal e mantém a formulação geral da lei. A mesma expressão é repetida nas duas orações, acompanhando a repetição hebraica.
- source_word: בְהֵמָה
  choice: um animal
  rationale: O termo designa um animal, muitas vezes doméstico. “Animal” é amplo, claro e atual; “gado” seria indevidamente restrito.
- source_word: יְשַׁלְּמֶנָּה
  choice: deverá fazer restituição por ele
  rationale: O piel de שלם indica compensar ou reparar a perda. A construção explicita a restituição devida pelo animal morto sem definir além do texto a forma exata da compensação.
- source_word: אָדָם
  choice: uma pessoa
  rationale: No contraste com o animal, אָדָם designa um ser humano individual. “Uma pessoa” preserva naturalmente em português a abrangência humana do termo, sem sugerir que a norma se limite ao sexo masculino.
- source_word: יוּמָת
  choice: será morto
  rationale: A forma hofal expressa que o culpado será levado à morte. “Será morto” preserva a voz passiva e a concisão jurídica do hebraico, sem substituir a pena enunciada por mera condenação judicial.
theological_decisions:
- issue: Alcance de אָדָם na formulação legal
  choice: uma pessoa
  alternative: um homem
  rationale: Embora a construção hebraica seja singular e assuma forma gramatical masculina, אָדָם aqui contrapõe qualquer ser humano ao animal. O português “uma pessoa” exprime esse alcance sem resolver o texto segundo uma distinção denominacional.
- issue: Sentido letal de מַכֵּה
  choice: quem matar
  alternative: quem ferir / quem golpear
  rationale: Isoladamente, o verbo pode significar golpear ou ferir; porém, a restituição pelo animal e a morte do agressor humano mostram que este versículo trata de golpes fatais. A nota registra a amplitude lexical sem enfraquecer o sentido contextual.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica concisa. A repetição “quem matar” reproduz o paralelismo hebraico; “mas” torna explícito o contraste marcado pela segunda conjunção. A nota foi posicionada ao fim do versículo porque se aplica às duas ocorrências do mesmo particípio hebraico.
