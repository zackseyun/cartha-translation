  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: pt
  text: E, se um homem ferir mortalmente qualquer ser humano[b][a], certamente será morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “qualquer vida/pessoa humana”. Aqui, a expressão se refere a um ser humano ou à vida humana, não especificamente a uma “alma” imaterial.
    reason: lexical_alternative
  - marker: b
    text: Ou “matar qualquer pessoa”. O verbo hebraico significa literalmente “ferir” ou “golpear”, mas aqui indica um golpe mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: E, se um homem
  rationale: Mantém o וְ de ligação, traduz כִּי como condição e preserva o substantivo masculino singular אִישׁ, sem obscurecer a força representativa da norma.
- source_word: יַכֶּה
  choice: ferir mortalmente
  rationale: O hifil de נכה significa literalmente “ferir/golpear”; neste contexto, o objeto e a pena de morte indicam um golpe fatal. A formulação preserva a imagem concreta e explicita o resultado letal.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: qualquer ser humano
  rationale: נֶפֶשׁ designa aqui a pessoa viva, não especificamente uma alma imaterial; אָדָם tem referência humana genérica. A expressão portuguesa evita tratar a vítima como uma abstração.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: A construção com infinitivo absoluto e forma passiva intensifica a certeza da pena. A tradução conserva tanto a ênfase quanto a voz passiva da fórmula jurídica hebraica.
theological_decisions:
- issue: Sentido de נֶפֶשׁ em כָּל נֶפֶשׁ אָדָם
  choice: ser humano
  alternative: vida humana; alma humana
  rationale: Neste contexto jurídico, a expressão se refere à pessoa que recebe o golpe fatal. “Alma” poderia importar uma distinção antropológica que o texto não exige, enquanto “vida humana” poderia soar abstrato.
- issue: Forma masculina de אִישׁ
  choice: um homem
  alternative: alguém; qualquer pessoa
  rationale: O texto-fonte emprega o masculino singular. A tradução o conserva, sem concluir que a identidade da vítima, expressa genericamente por אָדָם, seja masculina.
- issue: Força jurídica de מוֹת יוּמָת
  choice: certamente será morto
  alternative: deverá ser morto; será condenado à morte
  rationale: A escolha preserva a intensificação e a passividade do hebraico sem especificar um procedimento judicial além do que o versículo declara.
translation_notes:
  register: Português moderno, claro e digno, com cadência jurídica. “Ferir mortalmente” comunica o sentido contextual sem substituir inteiramente a imagem verbal hebraica por “matar”. Os marcadores seguem a ordem herdada do texto de consulta ([b][a]).
