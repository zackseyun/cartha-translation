  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: pt
  text: Coloque incenso puro sobre cada fileira[a]; ele será, em favor dos pães, uma porção memorial, uma oferta apresentada pelo fogo a Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre a disposição”; no contexto, trata-se das fileiras ordenadas de pães.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma oferta de alimento”. O sentido exato do termo hebraico é discutido; tradicionalmente, ele é entendido como oferta feita por meio do fogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Ponha
  rationale: O perfeito qal com waw, neste contexto de instrução ritual, expressa uma ordem. “Ponha” é direto e natural em português.
- source_word: עַל הַמַּעֲרֶכֶת
  choice: sobre cada fileira
  rationale: 'מַעֲרֶכֶת designa a disposição ordenada. À luz das duas fileiras mencionadas no versículo anterior, o singular tem sentido distributivo: o incenso é posto sobre cada fileira.'
- source_word: לְבֹנָה זַכָּה
  choice: incenso puro
  rationale: לְבֹנָה é a resina aromática tradicionalmente chamada incenso ou olíbano; זַכָּה destaca sua pureza adequada ao uso ritual. “Incenso puro” é claro e corrente.
- source_word: וְהָיְתָה לַלֶּחֶם
  choice: ele servirá, em favor dos pães
  rationale: O pronome masculino acompanha o gênero de “incenso” em português. לַלֶּחֶם indica que o incenso exerce uma função representativa em relação aos pães; “em favor dos pães” comunica essa relação sem identificar o incenso com eles.
- source_word: לְאַזְכָּרָה
  choice: como porção memorial
  rationale: O termo cultual designa a parte representativa oferecida para memória diante de Deus. “Porção memorial” preserva tanto a função sacrificial quanto a ideia de lembrança.
- source_word: אִשֶּׁה
  choice: uma oferta apresentada pelo fogo
  rationale: O termo sacerdotal é tradicionalmente relacionado a uma oferta feita no fogo. A formulação evita sugerir que todo o pão fosse queimado, pois, neste caso, o incenso funcionava como sua porção memorial. A alternativa lexical “oferta de alimento” é registrada em nota.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יהוה como nome próprio e mantém a direção da oferta indicada pela preposição לְ.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Função memorial do incenso em relação aos pães
  choice: o incenso serve, em favor dos pães, como porção memorial
  alternative: o incenso e os pães formam conjuntamente a porção memorial
  rationale: A construção לַלֶּחֶם לְאַזְכָּרָה apresenta o incenso como a porção representativa vinculada aos pães. A tradução mantém essa relação sem explicar além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com forma imperativa natural. “Pães” explicita o valor coletivo de לֶחֶם no contexto. As vírgulas preservam a relação entre a porção memorial e a oferta sem tornar a frase excessivamente técnica.
