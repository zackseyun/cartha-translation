revisions:
- from: Ponha incenso puro sobre cada fileira[a]; ele servirá, em favor dos pães, como porção memorial, uma oferta apresentada pelo fogo[b] a Yahweh.
  to: Coloque incenso puro sobre cada fileira[a]; ele será, em favor dos pães, uma porção memorial, uma oferta apresentada pelo fogo a Yahweh[b].
  rationale: A revisão conserva todas as escolhas lexicais essenciais e os marcadores de nota, mas melhora a naturalidade e torna explícita a relação appositiva entre a porção memorial e a oferta. «Em favor dos pães» mantém a ligação representativa expressa por לַלֶּחֶם sem reduzir o termo coletivo a um único pão.
