  text: וּ/מַכֵּ֥ה נֶֽפֶשׁ בְּהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: pt
  text: 'E quem matar um animal deverá fazer restituição por ele: vida por vida[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “vida por vida”. Neste contexto de restituição por um animal, a expressão indica reparação equivalente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה
  choice: E quem matar
  rationale: O particípio hifil introduz uma regra geral. Como o objeto é a vida de um animal, a ação é letal; “matar” comunica isso com clareza e naturalidade em português.
- source_word: נֶפֶשׁ בְּהֵמָה
  choice: um animal
  rationale: Neste contexto, נֶפֶשׁ indica a vida do animal, não uma “alma” imaterial. A expressão hebraica descreve, idiomaticamente, matar um animal.
- source_word: יְשַׁלְּמֶנָּה
  choice: deverá dar compensação por ele
  rationale: O piel de שלם exprime pagamento, restituição ou compensação. A formulação mantém a obrigação legal sem determinar um meio de ressarcimento que o versículo não explicita.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: vida por vida
  rationale: Preserva a fórmula hebraica concisa e sua ideia de equivalência, deixando que o contexto de compensação oriente sua aplicação.
theological_decisions:
- issue: Sentido da fórmula de retribuição na lei referente a um animal
  choice: Manter “vida por vida” como fórmula de compensação equivalente, sem especificar o mecanismo exato.
  alternative: Entender que a norma exige especificamente a entrega de outro animal em substituição ao que foi morto.
  rationale: O verbo precedente exige compensação, mas o texto não define aqui se ela deve ocorrer mediante outro animal, dinheiro ou outro equivalente. A tradução preserva essa abertura.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “Dar compensação” evita tanto o tecnicismo excessivo quanto a impressão de que o culpado deve compensar o próprio animal; “por ele” retoma o animal como objeto da perda.
