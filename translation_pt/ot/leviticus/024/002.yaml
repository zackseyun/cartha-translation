source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: pt
  text: Ordene aos filhos de Israel[a] que lhe tragam azeite puro de azeitonas esmagadas[b] para a iluminação, a fim de manter uma lâmpada acesa continuamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” ou “ao povo de Israel”. O hebraico diz literalmente “aos filhos de Israel”, designação pactual convencional.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “azeite de oliva puro, obtido por esmagamento”. O hebraico especifica azeite puro produzido de azeitonas esmagadas ou batidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Ordene
  rationale: O imperativo de צוה introduz uma ordem direta; “ordene” preserva sua força autoritativa em português natural.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a forma hebraica convencional da designação pactual, sem ocultar sua expressão masculina plural.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: que lhe tragam
  rationale: Embora לקח costume significar “tomar”, com אֵלֶיךָ o sentido contextual é trazer ou fornecer algo ao destinatário.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: azeite puro de azeitonas esmagadas
  rationale: Expressa a matéria-prima, a pureza e o processo indicado por כָּתִית, em formulação compreensível no português atual.
- source_word: לַמָּאוֹר
  choice: para a iluminação
  rationale: Reproduz a finalidade do óleo sem identificar indevidamente o termo com o candelabro.
- source_word: לְהַעֲלֹת נֵר
  choice: a fim de manter uma lâmpada acesa
  rationale: Traduz de modo idiomático a construção causativa aplicada à lâmpada e, junto de תָּמִיד, comunica sua manutenção acesa.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Preserva a ideia de continuidade ou regularidade permanente do serviço cultual sem especificá-la além do hebraico.
theological_decisions:
- issue: Designação pactual marcada por gênero em בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas / povo de Israel
  rationale: A expressão hebraica é literalmente masculina plural e funciona como designação convencional do povo da aliança. A tradução principal conserva essa forma, enquanto a nota apresenta equivalentes coletivos idiomáticos.
- issue: Sentido cultual de תָּמִיד
  choice: continuamente
  alternative: regularmente
  rationale: O termo pode destacar continuidade ou recorrência regular no culto. “Continuamente” mantém a formulação tradicional e a tensão sem definir um mecanismo temporal não explicitado no versículo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Lhe tragam” evita uma forma de tratamento regionalmente marcada; “lâmpada”, e não “vela”, corresponde ao objeto do contexto antigo.
