id: LEV.24.3
reference: Leviticus 24:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: pt
  text: Do lado de fora do véu do testemunho[a], na tenda do encontro, Arão o disporá desde a tarde até a manhã, diante de Yahweh, continuamente.[b] Este é um estatuto permanente[c] ao longo de suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da cortina do testemunho”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “continuamente” se refere à observância regular e contínua do rito, especificada como “desde a tarde até a manhã”.
    reason: cultural_note
  - marker: c
    text: Ou “um estatuto perpétuo” ou “um estatuto eterno”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: Do lado de fora do véu do testemunho
  rationale: A expressão indica localização exterior ao véu interior do santuário. “Véu” mantém o termo cultual tradicional, e “testemunho” preserva a designação hebraica sem explicá-la excessivamente.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: É uma tradução clara e corrente da designação do santuário móvel onde Yahweh se encontrava com Israel.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: o disporá
  rationale: O verbo ערך significa pôr em ordem ou dispor. A formulação conserva o pronome masculino singular e, portanto, não explicita além do hebraico o referente retomado do contexto anterior.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: desde a tarde até a manhã
  rationale: Reproduz diretamente o intervalo temporal indicado no hebraico e o liga à ação de Arão.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” expressa a presença cultual, e “Yahweh” translitera o nome divino em vez de substituí-lo por um título.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Mantém a força de continuidade ou regularidade do termo, enquanto o próprio versículo delimita a prática como ocorrendo da tarde até a manhã.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: Comunica uma prescrição duradoura. “Perpétuo” e “eterno” continuam sendo alternativas possíveis para עוֹלָם.
- source_word: לְדֹרֹתֵיכֶם
  choice: ao longo de suas gerações
  rationale: Expressa a aplicação continuada da prescrição às sucessivas gerações dos destinatários.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o tetragrama como nome próprio. A transliteração preserva essa função sem substituí-lo por um título.
- issue: Sentido de תָּמִיד no rito das lâmpadas
  choice: continuamente
  alternative: regularmente; continuamente a cada noite
  rationale: O termo pode indicar observância contínua no sentido de prática regular. A tradução mantém essa amplitude, e a nota esclarece sua relação com a expressão “desde a tarde até a manhã” sem resolver a tensão de modo indevido.
- issue: Duração expressa por חֻקַּת עוֹלָם
  choice: estatuto permanente
  alternative: estatuto perpétuo; estatuto eterno
  rationale: “Permanente” comunica a vigência duradoura da prescrição no horizonte das gerações mencionado pelo próprio texto, sem impor uma definição filosófica de eternidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se os termos cultuais “véu”, “testemunho” e “tenda do encontro”, bem como o nome divino “Yahweh”. A sintaxe acompanha de perto a ordem hebraica sem soar artificial.
