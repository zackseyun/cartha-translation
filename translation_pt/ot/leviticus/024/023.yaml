base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: pt
  text: Então Moisés falou aos filhos de Israel, e eles levaram para fora do acampamento aquele que havia amaldiçoado[a] e o apedrejaram com pedras. Assim, os filhos de Israel fizeram conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o blasfemador”. O particípio hebraico significa literalmente “aquele que amaldiçoou” e se refere ao homem que amaldiçoou o Nome divino no contexto anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O piel de דבר significa normalmente “falar”; “falou” expressa com naturalidade que Moisés se dirigiu ao povo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente o idioma hebraico e sua forma masculina plural, sem perder a compreensão em português.
- source_word: וַיּוֹצִיאוּ
  choice: levaram para fora
  rationale: O hifil de יצא significa “fazer sair, levar para fora”; esta formulação comunica claramente o movimento para fora do acampamento.
- source_word: הַמְקַלֵּל
  choice: aquele que havia amaldiçoado
  rationale: O particípio de קלל retoma o homem que amaldiçoou no contexto anterior. A forma verbal mantém o sentido lexical direto sem introduzir no texto principal o termo mais interpretativo “blasfemador”.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: A expressão indica movimento até o exterior do acampamento; em combinação com “levaram”, esta é uma formulação natural e precisa em português.
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: o apedrejaram
  rationale: O verbo português “apedrejar” já incorpora naturalmente o uso de pedras expresso pela construção hebraica, evitando a redundância pouco idiomática “apedrejaram-no com pedras”.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: fizeram conforme ... havia ordenado
  rationale: A fórmula resume a obediência a uma ordem anterior; “havia ordenado” deixa clara essa relação temporal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Se הַמְקַלֵּל deve ser traduzido pelo termo teologicamente mais carregado “blasfemador”
  choice: aquele que havia amaldiçoado
  alternative: o blasfemador
  rationale: Embora o contexto trate de uma maldição contra o Nome divino, a forma lexical neste versículo é o particípio de קלל, “amaldiçoar”. O texto principal conserva esse sentido direto, enquanto a nota registra a interpretação contextual possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “filhos de Israel” por transparência formal e usa construções verbais naturais em português.
