base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: pt
  text: fratura por fratura, olho por olho, dente por dente; assim como alguém causa uma lesão[a] a uma pessoa[b], assim também uma lesão lhe será causada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “der um defeito”. O hebraico emprega “dar” com “defeito/lesão” numa expressão aqui traduzida por “causar uma lesão”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em um ser humano”. O termo é empregado aqui no singular representativo próprio da legislação de casos.'
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר
  choice: fratura
  rationale: Neste contexto jurídico de dano corporal, o substantivo designa uma quebra ou fratura; “fratura” é preciso e natural em português.
- source_word: תַּחַת
  choice: por
  rationale: Na fórmula de talião, expressa correspondência ou equivalência. “Por” preserva de modo idiomático a repetição jurídica.
- source_word: עַיִן
  choice: olho
  rationale: Termo anatômico direto, mantido literalmente na fórmula legal.
- source_word: שֵׁן
  choice: dente
  rationale: Termo anatômico direto, mantido literalmente na fórmula legal.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: assim como ... assim também
  rationale: Reproduz a estrutura comparativa e a correspondência enfática entre o dano causado e a consequência.
- source_word: יִתֵּן מוּם
  choice: causar uma lesão
  rationale: Embora נתן signifique literalmente “dar” ou “pôr”, sua combinação com מוּם é idiomática. “Causar uma lesão” comunica naturalmente o sentido jurídico sem restringi-lo a mero defeito estético.
- source_word: אָדָם
  choice: pessoa
  rationale: O substantivo refere-se genericamente a um ser humano neste caso jurídico; “pessoa” é natural e exato em português atual.
- source_word: יִנָּתֶן בּוֹ
  choice: essa lesão lhe será causada
  rationale: Preserva a voz passiva do hebraico e torna explícito em português o referente implícito, a lesão anteriormente mencionada.
theological_decisions:
- issue: Natureza da fórmula de talião
  choice: 'Manter a fórmula concreta: “fratura por fratura, olho por olho, dente por dente”.'
  alternative: Parafrasear como indenização ou reparação proporcional ao dano.
  rationale: O hebraico enuncia reciprocidade em termos concretos. A tradução não deve decidir se a aplicação exigia dano corporal literal ou compensação equivalente, questão pertencente à interpretação jurídica.
- issue: Sentido de מוּם neste contexto
  choice: lesão
  alternative: defeito, deformidade ou desfiguração
  rationale: “Lesão” abrange naturalmente o dano físico no contexto, enquanto as alternativas poderiam estreitar indevidamente o sentido. A nota conserva a forma mais literal e sua amplitude.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição da fórmula jurídica foi preservada; “assim como ... assim também” mantém o paralelismo hebraico sem introduzir uma interpretação denominacional ou jurisprudencial específica.
