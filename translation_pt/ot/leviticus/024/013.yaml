  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/013.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa naturalmente a sequência em português, e “falou” introduz o discurso que vem a seguir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Equivalente português natural da preposição direcional neste contexto, na construção “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Na fórmula hebraica de introdução do discurso, o infinitivo assinala que o conteúdo vem em seguida. Em português atual, os dois-pontos comunicam essa função com naturalidade e evitam o artificial “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. Os dois-pontos representam idiomaticamente a fórmula hebraica לֵאמֹר e apontam para a fala do versículo seguinte.
