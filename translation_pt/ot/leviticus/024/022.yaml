  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: pt
  text: Haverá para vocês uma só norma de justiça, tanto para o estrangeiro residente como para o natural da terra, pois eu sou o SENHOR, o Deus de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: uma só norma de justiça
  rationale: A expressão indica uma regra jurídica única e igual para todos; “norma de justiça” comunica tanto o aspecto legal de מִשְׁפָּט quanto sua aplicação imparcial.
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Designa o estrangeiro que vive no meio da comunidade, não um visitante passageiro; a expressão é clara em português contemporâneo.
- source_word: אֶזְרָח
  choice: natural da terra
  rationale: Refere-se ao membro nativo da população, em contraste com o estrangeiro residente, sem introduzir o conceito político moderno de cidadania.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para representar o nome divino, distinguindo-o graficamente do título comum “Senhor”.
theological_decisions:
- issue: Igualdade jurídica entre estrangeiro residente e natural da terra
  choice: “tanto para o estrangeiro residente como para o natural da terra”
  alternative: “para o estrangeiro e para o nativo”
  rationale: Preserva a força comparativa do hebraico e explicita que a mesma norma se aplica aos dois grupos, sem ampliar a categoria גֵּר a todo e qualquer estrangeiro.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário jurídico acessível. A formulação mantém a ordem lógica do hebraico e a fundamentação final na identidade do SENHOR como Deus do povo.
