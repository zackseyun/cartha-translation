  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: pt
  text: O filho da israelita pronunciou o Nome e amaldiçoou[a]. Então o levaram a Moisés. O nome de sua mãe era Selomite, filha de Dibri, da tribo de Dã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “blasfemou contra o Nome e amaldiçoou”. O verbo hebraico pode ter o sentido de “pronunciar distintamente” ou, neste contexto, ser entendido como parte do ato de blasfemar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: pronunciou
  rationale: O verbo נקב pode indicar especificar ou proferir distintamente. Com “o Nome” como objeto e seguido por um verbo separado, “amaldiçoar”, a tradução preserva a sequência verbal sem fundir antecipadamente os dois atos.
- source_word: בֶּן הָאִשָּׁה הַיִּשְׂרְאֵלִית
  choice: O filho da israelita
  rationale: Forma natural e concisa em português para a identificação narrativa, mantendo a referência à mulher israelita já mencionada no contexto.
- source_word: אֶת הַשֵּׁם
  choice: o Nome
  rationale: O artigo e o contexto apontam para o nome divino. A inicial maiúscula indica essa referência reverente sem inserir o tetragrama no texto.
- source_word: וַיְקַלֵּל
  choice: e proferiu uma maldição
  rationale: O piel de קלל significa amaldiçoar. Como o hebraico não expressa aqui um objeto, esta formulação portuguesa preserva a indefinição e evita acrescentar quem ou o que foi amaldiçoado.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: Então o levaram a Moisés
  rationale: Mantém o plural ativo com sujeito não especificado e usa uma ligação narrativa natural em português.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Apresenta com clareza a informação parentética de identificação familiar.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: Selomite, filha de Dibri
  rationale: Translitera os nomes próprios em formas legíveis em português e conserva a relação genealógica.
- source_word: לְמַטֵּה דָן
  choice: da tribo de Dã
  rationale: Equivalente idiomático claro para a afiliação tribal.
theological_decisions:
- issue: Sentido de נקב diante de “o Nome” num contexto de blasfêmia
  choice: Entender o verbo como pronunciar explicitamente o Nome, seguido pelo ato distinto de proferir uma maldição.
  alternative: Entender o próprio verbo como “blasfemar”, resultando em “blasfemou contra o Nome e amaldiçoou”.
  rationale: O hebraico emprega dois verbos, נקב e קלל. Conservá-los como ações verbalmente distintas preserva a ambiguidade lexical e a tensão jurídica do relato, sem negar que o conjunto constitua blasfêmia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Israelita” funciona naturalmente como substantivo feminino; “proferiu uma maldição” evita impor ao segundo verbo um objeto que o hebraico não explicita.
