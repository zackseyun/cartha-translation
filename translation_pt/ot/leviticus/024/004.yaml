  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: pt
  text: No candelabro puro, ele disporá as lâmpadas diante de Yahweh continuamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “regularmente”. O hebraico também pode indicar uma prática contínua e regularmente mantida.'
    reason: ambiguidade_lexical
lexical_decisions:
- source_word: עַל
  choice: Sobre
  rationale: Indica a posição das lâmpadas em relação ao candelabro e corresponde naturalmente ao hebraico.
- source_word: הַמְּנֹרָה הַטְּהֹרָה
  choice: o candelabro puro
  rationale: מְנוֹרָה designa o candelabro cultual, e טָהוֹר o qualifica como puro no contexto sacerdotal.
- source_word: יַעֲרֹךְ
  choice: ele colocará em ordem
  rationale: Preserva o sentido de dispor ou organizar ordenadamente, sem ampliá-lo para a manutenção geral das lâmpadas.
- source_word: הַנֵּרוֹת
  choice: as lâmpadas
  rationale: Refere-se às lâmpadas individuais dispostas no candelabro.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי é uma expressão cultual que significa diante de ou na presença de; o nome divino é transliterado como Yahweh.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Mantém a ideia de continuidade ou regularidade permanente do rito sem explicitação interpretativa adicional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Nuance de תָּמִיד
  choice: continuamente
  alternative: regularmente
  rationale: A forma escolhida conserva a possível tensão entre continuidade e observância ritual recorrente, sem restringir o termo a apenas uma dessas nuances.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário cultual compreensível. “Colocará em ordem” reproduz a ação ordenadora do hebraico; “Yahweh” preserva o nome divino.
