  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: pt
  text: Leve para fora do acampamento aquele que amaldiçoou[a]. Que todos os que o ouviram ponham as mãos sobre a cabeça dele[b], e que toda a comunidade o apedreje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o blasfemador” ou “aquele que blasfemou”. O hebraico se refere literalmente àquele que amaldiçoou.'
    reason: alternative_reading
  - marker: b
    text: Aqui, a imposição das mãos provavelmente marca a identificação formal do infrator pelas testemunhas, embora alguns também atribuam ao gesto um significado simbólico.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: Leve para fora
  rationale: O imperativo no causativo de יצא ordena fazer alguém sair. Em português, “leve para fora” expressa com naturalidade tanto a ação quanto o destino indicado em seguida.
- source_word: הַמְקַלֵּל
  choice: aquele que amaldiçoou
  rationale: O particípio de קלל identifica o infrator do contexto. A formulação preserva o sentido lexical de “amaldiçoar” sem introduzir no texto principal a interpretação mais específica “blasfemou”.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: Expressão espacial corrente que mantém o cenário comunitário e judicial do texto.
- source_word: וְסָמְכוּ
  choice: ponham
  rationale: סמך, quando usado com mãos e cabeça, significa pôr ou impor as mãos. “Ponham as mãos” é claro e natural, e a construção com “que” comunica a força injuntiva da sequência.
- source_word: כָל הַשֹּׁמְעִים
  choice: todos os que o ouviram
  rationale: O particípio designa os ouvintes, isto é, as testemunhas da ofensa. O pronome “o” torna explícito em português o referente naturalmente recuperado do contexto, sem especificar o conteúdo ouvido.
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: as mãos sobre a cabeça dele
  rationale: Mantém o plural hebraico “mãos” e traduz literalmente a relação espacial. “Dele” evita uma sequência potencialmente menos fluida de pronomes possessivos.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: o apedreje
  rationale: רגם é o verbo próprio para executar por apedrejamento. A forma singular concorda com o coletivo “toda a comunidade” no português corrente.
- source_word: כָל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade reunida de Israel. “Comunidade” é atual, amplamente inteligível e preserva o caráter coletivo sem sugerir especificamente uma congregação de culto.
theological_decisions:
- issue: Traduzir o infrator como “aquele que amaldiçoou” ou “o blasfemador”
  choice: aquele que amaldiçoou
  alternative: o blasfemador / aquele que blasfemou
  rationale: O termo imediato é um particípio de קלל, “amaldiçoar”. Embora o contexto trate da maldição contra o Nome divino, manter o valor lexical no texto principal evita resolver interpretativamente a expressão; a alternativa contextual aparece em nota.
- issue: Sentido da imposição das mãos pelas testemunhas
  choice: Manter apenas a ação literal no texto principal
  alternative: Explicá-la como identificação formal do infrator ou como transferência simbólica de culpa
  rationale: O versículo ordena o gesto, mas não explica expressamente seu significado. A nota informa a interpretação judicial provável sem transformar uma inferência em afirmação textual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sequência de ordens foi articulada com “que” para soar natural, e os marcadores [a] e [b] aparecem junto às expressões a que se referem.
