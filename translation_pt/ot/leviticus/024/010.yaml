source:
  edition: WLC
  text: וַ/יֵּצֵא֙ בֶּן אִשָּׁ֣ה יִשְׂרְאֵלִ֔ית וְ/הוּא֙ בֶּן אִ֣ישׁ מִצְרִ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּנָּצוּ֙ בַּֽ/מַּחֲנֶ֔ה בֶּ֚ן הַ/יִּשְׂרְאֵלִ֔ית וְ/אִ֖ישׁ הַ/יִּשְׂרְאֵלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: pt
  text: O filho de uma mulher israelita — ele era filho de um egípcio — saiu para o meio dos filhos de Israel[a]. No acampamento, o filho da israelita e um homem israelita brigaram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos israelitas”. O hebraico diz literalmente “dos filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “discutiram”. O verbo pode indicar uma discussão ou uma briga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Traduz o movimento narrativo de יצא sem especificar de onde ele saiu, informação que o hebraico não fornece.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: o filho de uma mulher israelita
  rationale: Preserva a identificação do homem pela linhagem materna e prepara a designação repetida na segunda oração.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: ele era filho de um egípcio
  rationale: Mantém explícita a ascendência paterna e segue de perto a estrutura hebraica, com travessões para dar naturalidade em português.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: para o meio dos filhos de Israel
  rationale: בְּתוֹךְ indica posição no meio de um grupo; a formulação conserva a expressão nacional e pactual בְּנֵי יִשְׂרָאֵל.
- source_word: וַיִּנָּצוּ
  choice: brigaram
  rationale: O nifal de נצה pode indicar tanto discussão quanto confronto; “brigaram” mantém em português essa amplitude melhor do que uma opção exclusivamente verbal ou física.
- source_word: בַּמַּחֲנֶה
  choice: no acampamento
  rationale: É a tradução locativa direta e idiomática de בַּמַּחֲנֶה.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: o filho da israelita
  rationale: Conserva a designação repetida e a forma feminina do gentílico, sem acrescentar informação ausente.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: e um homem israelita
  rationale: Expressa naturalmente o contraste entre o homem de ascendência mista e o outro homem identificado como israelita.
theological_decisions:
- issue: Designação étnica e pactual בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A opção principal preserva a forma tradicional e concreta da expressão hebraica, que aqui funciona como designação nacional, sem impedir que a alternativa idiomática seja registrada em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Os travessões acomodam a oração explicativa sem apagar a sintaxe enfática do hebraico. A repetição de “filho” e “israelita” foi mantida por sua função identificadora e contrastiva.
