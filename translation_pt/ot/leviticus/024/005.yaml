  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: pt
  text: Pegue farinha fina e asse com ela doze pães[a]; cada pão terá dois décimos de efa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “doze bolos”. O termo hebraico pode designar unidades de pão assado usadas em contextos rituais.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dois décimos”. Na linguagem sacerdotal de medidas, isso significa dois décimos de efa para cada pão.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Pegue
  rationale: O perfeito com waw, neste contexto de instruções rituais, tem força de ordem em sequência. O imperativo é natural e claro em português.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o termo cúltico usual para farinha refinada; a tradução evita especificar o cereal, que não é indicado no hebraico.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: e asse com ela
  rationale: O pronome feminino retoma a farinha. 'Com ela' comunica naturalmente que os pães devem ser preparados a partir dessa farinha.
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: doze pães
  rationale: חַלּוֹת designa unidades de pão assado, especialmente em contexto ritual. 'Pães' é claro e idiomático, enquanto a nota preserva a alternativa lexical 'bolos'.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dois décimos de efa
  rationale: Literalmente, 'dois décimos'; no sistema de medidas sacerdotal, trata-se de décimos de efa. A unidade implícita é explicitada para compreensão moderna.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: cada pão terá
  rationale: 'A expressão literal ''o pão, um'' tem sentido distributivo: a quantidade indicada se aplica individualmente a cada pão.'
