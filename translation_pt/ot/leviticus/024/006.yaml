source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: pt
  text: Você os colocará em duas fileiras[a], seis em cada fileira, sobre a mesa pura[b], diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em dois arranjos” ou “em duas pilhas”; o termo hebraico indica uma disposição ordenada dos pães.
    reason: lexical_alternative
  - marker: b
    text: Ou “mesa limpa”; aqui, “pura” tem sentido ritual, não apenas o de limpeza física.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Você os colocará
  rationale: O verbo שׂוּם significa “pôr, colocar, dispor”. O futuro em português expressa naturalmente a instrução dirigida à segunda pessoa do singular; o pronome “os” representa o objeto direto אוֹתָם e retoma os doze pães do versículo anterior.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: em duas fileiras
  rationale: מַעֲרָכָה designa um conjunto ordenadamente disposto. “Fileiras” é claro e natural para a disposição dos pães, embora “arranjos” ou “pilhas” também sejam possíveis.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: seis em cada fileira
  rationale: 'A construção hebraica, literalmente próxima de “seis, a fileira”, tem sentido distributivo: seis pães em cada um dos dois conjuntos.'
- source_word: עַל הַשֻּׁלְחָן הַטָּהֹר
  choice: sobre a mesa pura
  rationale: עַל indica posição sobre a mesa. Em contexto cultual, טָהוֹר comunica pureza ou condição ritual adequada, não apenas limpeza física.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa “diante de, na presença de”. O nome divino יהוה é transliterado como “Yahweh”, preservando sua forma de nome próprio.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título, sem resolver além da evidência a discussão sobre sua pronúncia antiga.
- issue: Sentido cultual de הַטָּהֹר
  choice: mesa pura
  alternative: mesa limpa
  rationale: No contexto do santuário, “pura” mantém o valor ritual do adjetivo. “Limpa” poderia ser entendida como referência somente à higiene física.
translation_notes:
  register: Português atual, digno e acessível, com ampla legibilidade brasileira. A formulação conserva a instrução no singular, a disposição distributiva dos doze pães e o vocabulário cultual do hebraico.
