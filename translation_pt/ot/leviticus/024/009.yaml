revisions:
- from: Ela pertencerá a Arão e a seus filhos, e eles a comerão num lugar santo, pois é coisa santíssima para ele, dentre as ofertas feitas pelo fogo a Yahweh[a]. É uma prescrição permanente.
  to: Isto pertencerá a Arão e a seus filhos, e eles o comerão em lugar santo, pois é coisa santíssima para ele, dentre as ofertas de Yahweh apresentadas pelo fogo[a]. É uma prescrição permanente.
  rationale: A revisão limita-se a evitar a harmonização do objeto masculino de «eles o comerão» com o feminino de «pertencerá». «Isto» oferece um referente neutro em português, enquanto «o» conserva a observação formal relevante do hebraico. Também se ajusta a ordem de «ofertas de Yahweh apresentadas pelo fogo» para exprimir com maior transparência que as ofertas pertencem a Yahweh, sem mudar o sentido.
  reviewer_model: gpt-5.6-terra
