base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: pt
  text: Isto pertencerá a Arão e a seus filhos, e eles o comerão em lugar santo, pois é coisa santíssima para ele, dentre as ofertas de Yahweh apresentadas pelo fogo[a]. É uma prescrição permanente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre as ofertas de alimento de Yahweh”. O termo hebraico designa tradicionalmente ofertas apresentadas pelo fogo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: Ela pertencerá a Arão e a seus filhos
  rationale: A construção היה com לְ indica posse ou porção atribuída. O pronome feminino retoma naturalmente a oferta de pão do contexto.
- source_word: וַאֲכָלֻהוּ
  choice: e eles a comerão
  rationale: Mantém a forma da instrução legal e identifica os filhos de Arão como participantes da ação.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: num lugar santo
  rationale: O hebraico não traz artigo; esta formulação evita identificar indevidamente um recinto específico do santuário.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: coisa santíssima
  rationale: Expressa o superlativo hebraico e deixa claro que se trata da porção ofertada, não do recinto chamado Santo dos Santos.
- source_word: הוּא לוֹ
  choice: é coisa santíssima para ele
  rationale: Preserva o singular לֹו, embora Arão e seus filhos tenham sido mencionados, sem suavizar a tensão gramatical do texto.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: dentre as ofertas feitas pelo fogo a Yahweh
  rationale: אִשֶּׁה designa tradicionalmente uma oferta apresentada pelo fogo. A tradução explicita essa associação sacrificial sem sugerir que Deus literalmente se alimente.
- source_word: חָק עוֹלָם
  choice: uma prescrição permanente
  rationale: Comunica uma norma legal duradoura em português atual e digno.
theological_decisions:
- issue: Referente do singular לֹו após a menção de Arão e seus filhos
  choice: para ele
  alternative: para eles
  rationale: O singular hebraico é mantido, permitindo que Arão seja entendido como representante da linhagem sacerdotal sem transformar silenciosamente o número gramatical.
- issue: Sentido de אִשֵּׁי
  choice: ofertas feitas pelo fogo
  alternative: ofertas de alimento
  rationale: A opção preserva a ligação tradicional e etimológica com o fogo sacrificial; a nota registra a alternativa lexical possível.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conservam-se o nome divino Yahweh, a referência específica aos filhos de Arão e o singular inesperado “para ele”.
