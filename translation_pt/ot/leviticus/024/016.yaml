source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: pt
  text: Quem blasfemar o nome de Yahweh certamente será morto[a]; toda a congregação certamente o apedrejará[b]. Tanto o estrangeiro residente como o nascido na terra, quando blasfemar o Nome, será morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pronunciar o nome de Yahweh” ou “amaldiçoar o nome de Yahweh”. Neste contexto, o verbo hebraico pode ter o sentido de enunciar distintamente ou de ultrajar.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega uma construção enfática: “certamente o apedrejará”.'
    reason: source_form
lexical_decisions:
- source_word: וְנֹקֵב
  choice: quem blasfemar
  rationale: נקב pode significar pronunciar ou enunciar distintamente e, neste contexto, também ultrajar. “Blasfemar” expressa naturalmente a profanação judicialmente punida sem afirmar que a mera pronúncia seja necessariamente o delito; a ambiguidade lexical fica registrada em nota.
- source_word: שֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: שֵׁם significa “nome”, e o tetragrama é transliterado como “Yahweh”, preservando o nome divino presente no hebraico.
- source_word: מוֹת יוּמָת
  choice: certamente será morto
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a fórmula jurídica passiva, comunicando certeza e obrigação da pena capital.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: o apedrejará
  rationale: A construção intensiva exige a execução por apedrejamento. Em português, a força obrigatória já está clara no contexto jurídico e na fórmula anterior; uma tradução mecanicamente duplicada soaria pesada.
- source_word: כָּל הָעֵדָה
  choice: toda a congregação
  rationale: עֵדָה designa a comunidade reunida de Israel; “congregação” conserva o caráter coletivo e jurídico.
- source_word: כַּגֵּר
  choice: o estrangeiro residente
  rationale: גֵּר é o não israelita estabelecido no meio da comunidade, não simplesmente um visitante ou estranho ocasional.
- source_word: כָּאֶזְרָח
  choice: o natural da terra
  rationale: אֶזְרָח contrasta com o estrangeiro residente e indica quem pertence por nascimento à terra ou comunidade.
- source_word: בְּנָקְבוֹ שֵׁם
  choice: quando blasfemar o Nome
  rationale: A preposição com o infinitivo construto tem valor temporal ou circunstancial. “O Nome” traduz o uso absoluto e reverencial de שֵׁם nesta segunda ocorrência.
- source_word: יוּמָת
  choice: será morto
  rationale: Mantém a fórmula jurídica passiva repetida no encerramento do versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de נקב em relação ao nome divino
  choice: blasfemar
  alternative: pronunciar; amaldiçoar
  rationale: No contexto legal, “blasfemar” comunica a profanação do nome sem concluir que a simples pronúncia fosse o crime. A incerteza lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém o tom jurídico, usa “estrangeiro residente” para esclarecer a condição do גֵּר e reserva “o Nome” para a ocorrência absoluta e reverencial.
