  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: pt
  text: Se um homem causar uma lesão a seu próximo[a], conforme fez, assim lhe será feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “causar um defeito ou uma deformidade a seu próximo”. Ou “a seu compatriota”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Se um homem
  rationale: Na formulação casuística da lei, כִּי introduz naturalmente uma condição; אִישׁ é o substantivo masculino singular “homem”.
- source_word: יִתֵּן מוּם
  choice: causar uma lesão
  rationale: A expressão significa literalmente “dar um defeito/uma deformidade”. Neste contexto de dano físico, “causar uma lesão” comunica com clareza o sentido jurídico sem perder a noção de dano corporal.
- source_word: בַּעֲמִיתוֹ
  choice: em seu compatriota
  rationale: עָמִית designa alguém do mesmo povo ou comunidade. “Compatriota” preserva essa relação comunitária; “próximo” também é possível.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: conforme fez
  rationale: A oração comparativa estabelece a correspondência entre o dano causado e a consequência aplicada.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: assim lhe será feito
  rationale: O nifal expressa ação passiva e mantém indeterminado o agente que aplica a sanção, em consonância com o tom jurídico do texto.
theological_decisions:
- issue: Formulação da retribuição proporcional no contexto legal
  choice: Manter a construção passiva “assim lhe será feito” como princípio jurídico de correspondência.
  alternative: Explicitar uma ordem de vingança ou retaliação pessoal.
  rationale: O hebraico enuncia a consequência de modo passivo e não identifica o executor. A tradução preserva essa indeterminação e não introduz a ideia de vingança privada.
translation_notes:
  register: Português atual, claro e digno, com formulação concisa própria de texto legal. “Lhe será feito” conserva o paralelismo e a voz passiva do hebraico sem soar excessivamente arcaico.
