  naturalness: O texto é claro e conciso. A redação da nota a, porém, é pouco natural em português («der um defeito ou uma deformidade em»).
  terminology: «Lesão» é uma boa atualização contextual de מוּם. «Próximo» é uma opção estabelecida e natural para עָמִית neste contexto; a nota registra a alternativa mais estrita de pertença comunitária.
