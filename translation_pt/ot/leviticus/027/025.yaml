  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: pt
  text: E cada avaliação sua será conforme o siclo do santuário[a]; o siclo será de vinte geras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo o siclo sagrado”. O hebraico se refere ao siclo-padrão usado nas avaliações relacionadas ao santuário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: avaliação que você fizer
  rationale: No contexto de Levítico 27, עֵרֶךְ designa o valor oficialmente atribuído a pessoas ou coisas ligadas a votos. A formulação preserva o sentido técnico e expressa naturalmente o sufixo de segunda pessoa do singular.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: pelo siclo do santuário
  rationale: A expressão indica o siclo-padrão usado nas avaliações relacionadas ao santuário. “Pelo” comunica a ideia de cálculo segundo esse padrão, sem reduzir הַקֹּדֶשׁ a uma qualidade moral abstrata.
- source_word: גֵּרָה
  choice: geras
  rationale: Gera é uma antiga unidade hebraica de peso, sem equivalente moderno direto; por isso, mantém-se a transliteração tradicional em português.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: o siclo será de vinte geras
  rationale: A frase define o peso do siclo e mantém o caráter prescritivo do imperfeito hebraico em linguagem portuguesa natural.
- source_word: וְכָל
  choice: E toda
  rationale: 'Preserva tanto a conjunção quanto o sentido distributivo do quantificador: cada avaliação deve seguir o mesmo padrão.'
- source_word: יִהְיֶה
  choice: será calculada / será
  rationale: Neste texto legal, o imperfeito tem força normativa. O futuro em português expressa essa prescrição com dignidade e clareza.
