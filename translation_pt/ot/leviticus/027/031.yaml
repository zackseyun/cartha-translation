base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/031.yaml
  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: pt
  text: Mas, se um homem resgatar[a] alguma parte do seu dízimo, acrescentará a ela um quinto do seu valor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “se de fato resgatar”, construção que dá ênfase ao verbo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma hipótese dentro da sequência legal; “Mas, se” expressa com naturalidade a transição condicional.
- source_word: גָּאֹל יִגְאַל
  choice: resgatar
  rationale: A construção com infinitivo absoluto reforça o verbo. Em português, a forma simples é mais natural no período legal, e a ênfase formal é registrada em nota para não produzir uma expressão artificial.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o substantivo masculino singular do hebraico, usado genericamente neste texto legal.
- source_word: מִמַּעַשְׂרוֹ
  choice: alguma parte do seu dízimo
  rationale: 'Torna claro o valor partitivo da preposição מן: trata-se de resgatar uma porção daquilo que foi separado como dízimo.'
- source_word: חֲמִשִׁיתוֹ
  choice: um quinto do seu valor
  rationale: O sufixo remete ao dízimo resgatado; explicitar “do seu valor” comunica naturalmente que o acréscimo corresponde a vinte por cento do valor principal.
- source_word: יֹסֵף עָלָיו
  choice: acrescentará a ela
  rationale: O hifil de יסף significa “acrescentar”, e עַל indica que a quinta parte deve ser adicionada ao montante devido pelo resgate.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica natural. O pronome “ela” retoma “alguma parte”; “do seu valor” explicita o referente econômico implícito sem alterar a exigência legal.
