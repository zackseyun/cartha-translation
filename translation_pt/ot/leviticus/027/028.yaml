  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: pt
  text: Contudo, toda coisa consagrada[a] que um homem consagrar ao SENHOR, dentre tudo o que lhe pertence — quer seja uma pessoa, um animal ou um campo de sua propriedade hereditária —, não será vendida nem resgatada. Toda coisa consagrada é santíssima ao SENHOR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico ḥērem, termo técnico para algo separado irrevogavelmente para o SENHOR; em certos contextos, também pode indicar algo posto sob interdição ou destinado à destruição.
    reason: Alternativa lexical necessária para preservar a amplitude semântica e a possível nuance de interdição do termo hebraico.
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Marca uma transição restritiva ou contrastiva em relação às regras anteriores sobre coisas votadas que podiam ser resgatadas.
- source_word: חֵרֶם / יַחֲרִם
  choice: coisa consagrada / consagrar
  rationale: O substantivo e o verbo cognato designam algo separado irrevogavelmente para o SENHOR, por vezes sob interdição. A formulação mantém no texto a relação lexical entre os dois termos sem impor ali a ideia de destruição.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o masculino singular da linguagem jurídica hebraica, empregado aqui com força representativa.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Representa o nome divino YHWH segundo a convenção portuguesa tradicional, distinguindo-o pela grafia em versaletes.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: dentre tudo o que lhe pertence
  rationale: Expressa com clareza o conjunto dos bens do homem do qual podia proceder aquilo que era consagrado.
- source_word: מֵאָדָם
  choice: ser humano
  rationale: No contraste categorial com animais, traduz אָדָם de modo genérico e inequívoco.
- source_word: וּבְהֵמָה
  choice: animal
  rationale: Termo amplo e corrente para a categoria animal indicada pelo hebraico.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: ou campo de sua propriedade hereditária
  rationale: Comunica a nuance jurídica de אֲחֻזָּה como terra patrimonial recebida dentro da herança familiar ou tribal.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: não poderá ser vendida nem resgatada
  rationale: Formula naturalmente a proibição jurídica e conserva “resgatada” como termo técnico do contexto.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssima
  rationale: A construção hebraica intensiva indica o grau máximo de santidade; “santíssima” é conciso e idiomático em português.
- source_word: הוּא לַיהוָה
  choice: é santíssima ao SENHOR
  rationale: Preserva a relação consecratória expressa pela construção hebraica sem acrescentar explicitamente uma noção de posse.
theological_decisions:
- issue: Sentido de חֵרֶם neste contexto jurídico
  choice: No texto principal, “coisa consagrada”, entendida como irrevogavelmente separada para o SENHOR.
  alternative: “coisa destinada à destruição” ou “coisa posta sob interdição”.
  rationale: Embora o grupo lexical חרם possa envolver interdição e destruição em outros contextos, este versículo enfatiza que a coisa não pode ser vendida nem resgatada e que é santíssima ao SENHOR. A nota conserva a amplitude sem resolver indevidamente a tensão.
- issue: Masculino genérico na linguagem jurídica
  choice: “um homem” para אִישׁ.
  alternative: “alguém” ou “uma pessoa”.
  rationale: Mantém a forma masculina singular da fonte, que neste gênero jurídico tem função representativa, sem alterar o referente para linguagem neutra.
- issue: Relação da coisa consagrada com YHWH
  choice: “santíssima ao SENHOR”.
  alternative: “pertence inteiramente ao SENHOR”.
  rationale: A tradução mantém a expressão relacional concisa do hebraico e evita explicitar posse onde o texto ressalta sobretudo a santidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe jurídica é mantida sem arcaísmos; “propriedade hereditária” explicita a natureza patrimonial da terra, e o travessão organiza a enumeração. O marcador [a] aparece no texto principal e corresponde à única nota.
