  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: pt
  text: E, se aquele que a consagrou resgatar a sua casa[a], acrescentará um quinto do valor em prata da sua avaliação, e a casa será dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que a dedicou” ou “aquele que a santificou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: aquele que a consagrou
  rationale: O particípio designa quem separou a casa como santa para o SENHOR. “Consagrou” preserva o sentido cultual e permanece natural em português.
- source_word: יִגְאַל
  choice: resgatar
  rationale: Neste contexto jurídico e sagrado, o verbo indica recuperar a propriedade mediante pagamento; “resgatar” conserva a terminologia característica do texto.
- source_word: בֵּיתוֹ
  choice: a sua casa
  rationale: Tradução direta do substantivo com sufixo possessivo, adequada ao contexto de avaliação de um imóvel.
- source_word: וְיָסַף חֲמִישִׁית
  choice: acrescentará ... um quinto
  rationale: A construção exprime a obrigação decorrente da condição, e “um quinto” mantém a forma antiga de expressar a proporção sem modernizá-la para porcentagem.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: a prata da avaliação feita por você
  rationale: “Prata” conserva o meio concreto de pagamento; a formulação explicita naturalmente em português que o sufixo de segunda pessoa se refere à avaliação realizada pelo sacerdote.
- source_word: עָלָיו
  choice: a ela
  rationale: No contexto, a preposição indica adição ao montante da avaliação; o pronome feminino retoma “avaliação” em português.
- source_word: וְהָיָה לוֹ
  choice: e ela será dele
  rationale: 'A oração declara o resultado jurídico do resgate: a casa voltará a pertencer ao homem.'
theological_decisions:
- issue: Terminologia cultual para uma propriedade separada para Deus
  choice: consagrou
  alternative: dedicou; santificou
  rationale: “Consagrou” comunica que a casa foi separada como santa no sistema de votos e avaliações de Levítico 27, sem enfraquecer o caráter sagrado nem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com formulação jurídico-cultual clara. O tratamento “você” torna explícita a segunda pessoa singular dirigida ao sacerdote no contexto, enquanto as notas preservam as alternativas lexicais e esclarecem o cálculo exigido.
