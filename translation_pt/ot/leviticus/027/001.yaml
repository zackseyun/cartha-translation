  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, com o waw narrativo, introduz a fórmula de discurso. “Falou” é natural em português e, ao lado dos demais elementos da frase, evita a redundância pouco idiomática de “falou... dizendo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala e corresponde naturalmente a “a” em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala. Em português atual, os dois-pontos desempenham essa função de modo mais natural do que a reprodução formal “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome divino e evita substituí-lo pelo título tradicional “SENHOR”; “Jeová” reflete uma vocalização posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Os dois-pontos substituem idiomaticamente a fórmula hebraica equivalente a “dizendo”, pois a fala começa no versículo seguinte.
