source:
  edition: WLC
  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: pt
  text: Não examinará se é bom ou ruim[a], nem o trocará. E, se de fato o trocar[b], tanto o animal original como o que o substituir serão santos; nenhum dos dois poderá ser resgatado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não fará distinção entre bom e ruim”. A expressão hebraica se refere à avaliação da qualidade do animal para fins de seleção.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico intensifica o verbo: “se realmente o trocar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר
  choice: examinará
  rationale: O piel de בקר, no contexto do dízimo dos animais, indica examinar com a finalidade de avaliar ou selecionar; «examinar» mantém esse sentido jurídico e concreto.
- source_word: בֵּין טוֹב לָרַע
  choice: se é bom ou ruim
  rationale: Expressa a distinção qualitativa entre animais; a formulação idiomática em português comunica a avaliação sem perder o contraste hebraico.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: o trocará / se de fato o trocar
  rationale: A raiz מור é o termo técnico para pôr outro animal no lugar do primeiro. A construção intensiva com infinitivo absoluto é representada por «de fato».
- source_word: תְמוּרָתוֹ
  choice: o que o substituir
  rationale: Designa o animal colocado no lugar do original; a formulação é clara e natural em português.
- source_word: קֹדֶשׁ
  choice: santo
  rationale: Preserva a linguagem cultual de algo consagrado e separado para Deus, característica de Levítico.
- source_word: לֹא יִגָּאֵל
  choice: não poderá ser resgatado
  rationale: O nifal de גאל indica que o animal não pode ser readquirido de sua condição consagrada; «resgatado» mantém a terminologia jurídico-cultual.
- source_word: הוּא וּתְמוּרָתוֹ
  choice: tanto o animal original como o que o substituir
  rationale: Torna explícito, de maneira idiomática, que os dois animais passam a ter condição santa.
theological_decisions:
- issue: Força cultual e jurídica da linguagem de consagração
  choice: Empregar «santo» e «resgatado» em sentido jurídico-cultual.
  alternative: Empregar termos mais genéricos, como «sagrado» e «comprado de volta».
  rationale: O contexto trata de animais consagrados no culto de Israel. Esses termos preservam a carga teológica do hebraico sem acrescentar uma interpretação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário jurídico-cultual coerente com Levítico. «Ruim» é usado como contraste natural de «bom»; a referência explícita ao animal evita ambiguidade quanto aos dois que se tornam santos.
