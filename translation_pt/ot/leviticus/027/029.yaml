source:
  edition: WLC
  text: כָּל חֵ֗רֶם אֲשֶׁ֧ר יָחֳרַ֛ם מִן הָ/אָדָ֖ם לֹ֣א יִפָּדֶ֑ה מ֖וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: pt
  text: Nenhuma pessoa dentre os seres humanos que for posta sob interdição[a] poderá ser resgatada; certamente será morta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «for consagrada» ou «for destinada à destruição». O termo hebraico designa alguém ou algo posto sob ḥérem, isto é, separado de modo definitivo e, em certos contextos, destinado à destruição.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרֶם / יָחֳרַם
  choice: consagrada irrevogavelmente
  rationale: 'O substantivo e o verbo pertencem à mesma raiz e designam aquilo que é colocado sob ḥérem: separado de modo irreversível, por vezes destinado à destruição. A formulação mantém a linguagem sacral sem reduzir o termo apenas à execução, enquanto a cláusula final explicita a consequência neste caso.'
- source_word: מִן הָאָדָם
  choice: dentre os seres humanos
  rationale: A expressão indica que o objeto do ḥérem é uma pessoa pertencente à humanidade. Esta tradução comunica naturalmente o valor partitivo de מִן e evita o português pouco claro «do homem».
- source_word: יִפָּדֶה
  choice: poderá ser resgatada
  rationale: פדה significa resgatar ou remir mediante pagamento. «Resgatada» é claro no contexto legal de avaliações e resgates em Levítico 27.
- source_word: מוֹת יוּמָת
  choice: certamente será morta
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. «Certamente» preserva essa ênfase, e a voz passiva corresponde à fórmula hebraica.
theological_decisions:
- issue: Sentido de חֵרֶם quando o referente é humano
  choice: Manter no texto a noção técnica de consagração irrevogável, deixando que a sentença de morte esclareça seu efeito neste caso.
  alternative: «Toda pessoa destinada à destruição dentre os seres humanos...»
  rationale: A alternativa explicita um sentido frequente de ḥérem, mas pode apagar a tensão entre a linguagem sacral de dedicação/interdição e sua consequência judicial. A nota registra essa possibilidade sem impô-la ao texto principal.
- issue: Identidade do referente de כָּל־חֵרֶם
  choice: «Toda pessoa»
  alternative: «Tudo o que for consagrado»
  rationale: Embora חֵרֶם seja formalmente um substantivo abrangente, מִן־הָאָדָם e a fórmula de execução mostram que aqui o referente é humano. «Toda pessoa» evita uma construção artificial em português sem alterar o referente contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Seres humanos» exprime o sentido coletivo de אָדָם; «morta» concorda com «pessoa». A repetição lexical da raiz חרם é parcialmente condensada para evitar a construção pouco natural «toda coisa consagrada que for consagrada».
