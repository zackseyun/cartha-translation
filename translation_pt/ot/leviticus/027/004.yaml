  text: וְ/אִם נְקֵבָ֖ה הִ֑וא וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ שְׁלֹשִׁ֥ים שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: pt
  text: Mas, se for do sexo feminino[a], o valor que você atribuir será de trinta siclos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, se ela for do sexo feminino...”'
    reason: Registra uma tradução mais formal da conjunção וְ e do pronome feminino הִוא, preservando a alternativa sintática do hebraico.
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A conjunção com a partícula condicional introduz um caso contrastante em relação ao versículo anterior; “Mas, se” expressa esse contraste com naturalidade.
- source_word: נְקֵבָה הִוא
  choice: for do sexo feminino
  rationale: נְקֵבָה designa o sexo feminino em geral, não especificamente uma mulher adulta. A formulação evita limitar indevidamente a idade da pessoa e traduz o pronome feminino de modo natural em português.
- source_word: וְהָיָה
  choice: será
  rationale: Na formulação legal, o verbo introduz o resultado da condição. O futuro “será” comunica de modo claro a determinação decorrente.
- source_word: עֶרְכְּךָ
  choice: o valor que você atribuir
  rationale: A expressão preserva o sentido técnico de avaliação e torna explícito que o sufixo de segunda pessoa se refere a quem estabelece o valor, evitando a possível ambiguidade de “sua avaliação” em português.
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: trinta siclos
  rationale: O substantivo hebraico permanece no singular após o numeral, mas o português requer o plural. “Siclos” conserva a unidade monetária ou de peso sem acrescentar “de prata”, que não está explícito neste versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica natural. “Do sexo feminino” é preferido a “uma mulher” por abranger com precisão todas as faixas etárias contempladas no contexto.
