  source_fidelity: 'A redação transmite corretamente a condição, a impureza ritual, a impossibilidade de apresentar uma oferta proveniente do animal a Yahweh e a ação de pôr o animal diante do sacerdote. Contudo, «o dono» não está expresso no hebraico: o verbo está na terceira pessoa masculina singular e retoma o sujeito legal do contexto sem identificá-lo lexicalmente como proprietário.'
  naturalness: «Mas, se for qualquer animal impuro» é compreensível, mas «Mas, se for algum animal impuro» é mais idiomático no português moderno nesta construção condicional. «Ele colocará» é claro e mantém a referência aberta do hebraico.
  terminology: «Animal impuro», «oferta», «Yahweh» e «diante do sacerdote» são adequados ao contexto cultual e ao registro da passagem.
