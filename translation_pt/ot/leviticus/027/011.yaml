    rationale: O texto hebraico traz apenas um verbo na terceira pessoa masculina singular, sem o substantivo «dono». Embora o contexto possa sugerir quem fez o voto, introduzir «dono» restringe interpretativamente uma referência que o texto deixa implícita.
  - severity: low
    issue: «se for qualquer animal» é formulação menos natural.
    rationale: Em português contemporâneo, «se for algum animal impuro» expressa com maior fluência o valor indefinido de כָּל nesta cláusula, sem alterar o sentido.
