  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: pt
  text: Mas, se for algum animal impuro, do qual não se pode apresentar uma oferta a Yahweh, ele colocará o animal diante do sacerdote,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição que contrasta com o caso anterior; a formulação é natural em português e preserva a progressão legal.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: qualquer animal impuro
  rationale: כָּל com o substantivo singular tem sentido indefinido. No contexto levítico, טָמֵא indica impureza ritual, não sujeira física.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: do qual não se pode apresentar uma oferta
  rationale: A construção impessoal portuguesa representa naturalmente o plural hebraico de sentido geral, e “do qual” preserva מִמֶּנָּה. “Apresentar uma oferta” mantém a nuance cultual de הקריב e קָרְבָּן.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, de acordo com a orientação fornecida.
- source_word: וְהֶעֱמִיד
  choice: o dono colocará
  rationale: O hifil significa fazer ficar de pé ou pôr em posição. “Colocará” é idiomático; “o dono” explicita de modo contextual o sujeito singular subentendido sem o confundir com o impessoal anterior.
- source_word: לִפְנֵי הַכֹּהֵן
  choice: diante do sacerdote
  rationale: Equivalência direta e natural que preserva o cenário formal da avaliação sacerdotal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio e segue a orientação doutrinária fornecida.
- issue: Sentido de טְמֵאָה
  choice: impuro
  alternative: não puro para o sacrifício
  rationale: “Impuro” mantém a categoria ritual levítica sem ampliar a redação para uma explicação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção impessoal “não se pode” evita um plural artificial em português. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
