source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: pt
  text: Estes são os mandamentos que Yahweh ordenou a Moisés para os filhos de Israel[a], no monte Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos filhos de Israel” ou “para os israelitas”.
    reason: alternativa lexical para אֶל בְּנֵי יִשְׂרָאֵל
lexical_decisions:
- source_word: אֵלֶּה הַמִּצְוֺת
  choice: Estes são os mandamentos
  rationale: A cópula é suprida naturalmente em português, e “mandamentos” preserva a força jurídica de מִצְוֺת na fórmula conclusiva.
- source_word: אֲשֶׁר צִוָּה
  choice: que ... ordenou
  rationale: Reproduz a ideia verbal de dar uma ordem e mantém a relação lexical com “mandamentos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Embora אֶת marque o objeto direto em hebraico, o verbo “ordenar” neste sentido pede naturalmente objeto indireto em português.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: “Para” expressa que os mandamentos confiados a Moisés se destinavam a Israel, conservando também a forma representativa masculina do hebraico.
- source_word: בְּהַר סִינָי
  choice: no monte Sinai
  rationale: É uma forma portuguesa natural de indicar o local associado à entrega dos mandamentos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o tetragrama; a transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido representativo de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução conserva a expressão masculina plural do hebraico, que designa coletivamente o povo de Israel sem afirmar que apenas homens estejam em vista.
- issue: Relação expressa por אֶל antes de בְּנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  alternative: aos filhos de Israel
  rationale: “Para” apresenta os israelitas como destinatários finais dos mandamentos dados a Moisés, sem eliminar a possibilidade lexical de entender a preposição como “a”.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima da fórmula conclusiva hebraica. A repetição “mandamentos ... ordenou” foi mantida para refletir o vínculo lexical do original.
