  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: pt
  text: Todo dízimo da terra[a], proveniente das sementes da terra e dos frutos das árvores, pertence a Yahweh; é santo para Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Todo dízimo da terra, proveniente da semente da terra e do fruto da árvore, é de Yahweh; é santo para Yahweh.”'
    reason: Alternativa lexical e sintática que reproduz mais de perto os singulares coletivos e as construções nominais do hebraico.
lexical_decisions:
- source_word: וְכָל מַעְשַׂר
  choice: Todo dízimo
  rationale: כָּל com um substantivo singular em construção tem sentido distributivo. “Todo dízimo” é natural em português e mantém o termo cultual מַעְשַׂר, a décima parte da produção.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: No contexto agrícola, אֶרֶץ designa a terra cultivada e sua produção, não o planeta inteiro.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: proveniente das sementes da terra
  rationale: Mantém a imagem concreta de זֶרַע, “semente”, enquanto “proveniente de” torna clara a relação expressa pela preposição מִן. O plural é natural em português para a referência agrícola coletiva.
- source_word: מִפְּרִי הָעֵץ
  choice: e dos frutos das árvores
  rationale: Os singulares hebraicos “fruto” e “árvore” têm valor coletivo. O plural em português comunica naturalmente a produção frutífera sem alterar o referente.
- source_word: לַיהוָה הוּא
  choice: pertence a Yahweh
  rationale: A preposição לְ indica aqui posse ou dedicação. “Pertence a” explicita esse sentido com clareza em português moderno.
- source_word: קֹדֶשׁ לַיהוָה
  choice: é santo para Yahweh
  rationale: 'Preserva a fórmula de consagração e a força cultual de קֹדֶשׁ: o dízimo está separado para Yahweh. Não se emprega “santíssimo”, pois o hebraico não contém a construção superlativa.'
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Sentido de קֹדֶשׁ לַיהוָה
  choice: é santo para Yahweh
  alternative: é sagrado para Yahweh; é consagrado a Yahweh
  rationale: “Santo” conserva a terminologia teológica e cultual do hebraico, sem reduzir a expressão apenas à ideia funcional de consagração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação principal usa plurais coletivos naturais em português; a nota registra uma versão mais formal e próxima da estrutura hebraica.
