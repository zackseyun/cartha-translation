  text: and the priest shall assess it[a], whether good or bad; as the priest assesses it, so it shall be.
translation:
  language: pt
  text: O sacerdote avaliará o animal[a], seja bom ou ruim; conforme a avaliação do sacerdote, assim será.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, mais literalmente: “O sacerdote a avaliará, entre bom e ruim; conforme a tua avaliação, o sacerdote, assim será”. A expressão hebraica contém literalmente um sufixo de segunda pessoa; no contexto, indica que a avaliação do sacerdote é a que vigora.'
    reason: A construção hebraica de כְּעֶרְכְּךָ הַכֹּהֵן é sintaticamente incomum; a nota preserva sua forma sem impor uma análise sintática discutível.
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: avaliará
  rationale: O hifil de ערך, neste contexto legal, indica determinar oficialmente o valor do animal consagrado. “Avaliará” é claro, atual e adequado à atuação sacerdotal.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente de כֹּהֵן; o artigo definido do hebraico foi preservado.
- source_word: אֹתָהּ
  choice: o animal
  rationale: Embora o pronome hebraico seja feminino singular, ele retoma o animal mencionado no contexto. Repetir “o animal” dá clareza em português sem alterar o referente.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: seja bom ou ruim
  rationale: Expressa naturalmente em português a avaliação da qualidade abrangida pelo merismo hebraico, sem sugerir apenas uma posição intermediária.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: o valor determinado pelo sacerdote
  rationale: A construção hebraica traz literalmente “segundo a tua avaliação, o sacerdote”, com sufixo de segunda pessoa e aposição. A formulação portuguesa comunica que a avaliação oficial é a do sacerdote, enquanto a nota registra a forma incomum do original.
- source_word: כֵּן יִהְיֶה
  choice: será o valor estabelecido
  rationale: 'Transmite a força vinculante da fórmula legal: a avaliação sacerdotal permanece válida e fixa o valor.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário jurídico não excessivamente técnico. A repetição de “valor” explicita a consequência legal da avaliação, e a nota conserva a peculiaridade formal do hebraico.
