id: LEV.27.26
reference: Leviticus 27:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: pt
  text: Contudo, o primogênito entre os animais domésticos, que, por ser primogênito, pertence a Yahweh, ninguém poderá consagrá-lo[a]. Seja boi, seja animal do rebanho[b], ele pertence a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um homem não o consagrará”; “ninguém poderá consagrá-lo” expressa o sentido genérico da frase.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode designar uma ovelha ou uma cabra.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Introduz uma ressalva às regras anteriores, preservando a força restritiva e adversativa do hebraico em português natural.
- source_word: בְּכוֹר
  choice: o primogênito
  rationale: Designa o primeiro filhote macho de um animal; “primogênito” conserva o termo jurídico-cultual recorrente nas Escrituras.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: que, por ser primogênito, pertence a Yahweh
  rationale: O passivo de בכר expressa aqui a condição de primogênito, não uma ação humana. A formulação torna clara a consequência jurídica dessa condição sem tratá-la como uma nova consagração.
- source_word: בִּבְהֵמָה
  choice: entre os animais domésticos
  rationale: בהמה é um coletivo para animais domesticados; esta expressão é clara e suficientemente ampla no contexto de gado sujeito a voto ou oferta.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: ninguém poderá consagrá-lo
  rationale: O hifil de קדש significa consagrar ou dedicar. “Ninguém” comunica naturalmente o uso genérico de אִישׁ, enquanto “consagrar” preserva o sentido cultual.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: seja boi, seja animal do rebanho
  rationale: A construção significa “seja... seja...”. שׁוֹר indica um bovino, enquanto שֶׂה pode indicar tanto uma ovelha quanto uma cabra; “animal do rebanho” preserva essa amplitude.
- source_word: לַיהוָה הוּא
  choice: ele pertence a Yahweh
  rationale: A frase declara que o animal já está destinado a Yahweh ou sob seu direito; “pertence” comunica com clareza a força jurídica do contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Razão pela qual o primogênito não pode ser consagrado por voto
  choice: Não pode ser novamente consagrado porque, como primogênito, já pertence a Yahweh.
  alternative: A condição de primogênito constitui uma consagração em si, sem ênfase específica em posse jurídica.
  rationale: A oração final, “ele pertence a Yahweh”, sustenta a ideia de uma reivindicação divina anterior, mas a tradução mantém a relação ligada à própria condição de primogênito.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe jurídica clara. “Animais domésticos” evita restringir בהמה apenas a bovinos, e “animal do rebanho” mantém a abrangência de שֶׂה.
