  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: pt
  text: A avaliação que você estabelecer para a pessoa do sexo masculino, de vinte a sessenta anos, será de cinquenta siclos de prata, segundo o siclo do santuário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O siclo era uma unidade de peso. Neste caso, a quantia de prata era medida segundo o padrão de peso usado no santuário.
    reason: Esclarece a unidade antiga e a função de בְּשֶׁקֶל הַקֹּדֶשׁ como padrão de medição.
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: a avaliação que você estabelecer
  rationale: Expressa o valor fixado no contexto legal e ritual dos votos, e não o valor intrínseco da pessoa; a formulação também preserva o sufixo de segunda pessoa.
- source_word: הַזָּכָר
  choice: uma pessoa do sexo masculino
  rationale: Mantém explicitamente a categoria sexual masculina do hebraico sem restringir o referente a um homem adulto, pois a classificação do capítulo também abrange outras faixas etárias.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: de vinte a sessenta anos
  rationale: Reproduz de modo natural e conciso a faixa etária indicada pelo idioma hebraico, sem acrescentar uma precisão de inclusão ou exclusão que a expressão não explicita por si só.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: cinquenta siclos de prata
  rationale: Preserva a unidade antiga de peso e a referência explícita à prata.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: Indica que o cálculo deve seguir o padrão de peso oficial associado ao santuário; evita entender 'santo' apenas como uma qualidade abstrata.
- source_word: וְהָיָה ... וְהָיָה
  choice: será
  rationale: Em português, o futuro expressa com naturalidade a determinação normativa da formulação legal hebraica.
theological_decisions:
- issue: Categoria de avaliação diferenciada por sexo
  choice: uma pessoa do sexo masculino
  alternative: um homem
  rationale: O texto estabelece uma categoria legal por sexo e idade. A tradução conserva essa distinção sem transformar a avaliação ritual em afirmação sobre dignidade pessoal e sem limitar indevidamente o termo a um adulto.
- issue: Natureza de עֵרֶךְ em Levítico 27
  choice: avaliação
  alternative: valor
  rationale: Trata-se do montante fixado para fins de voto e resgate no sistema do santuário, não de uma declaração sobre o valor inerente ou comercial da pessoa.
translation_notes:
  register: Português moderno, claro e digno, com construção legal natural. A expressão técnica “siclo do santuário” foi preservada e explicada em nota; evitou-se linguagem excessivamente arcaica.
