revisions:
- from: Então o sacerdote calculará para ele a parte proporcional da avaliação estipulada por você até o Ano do Jubileu; e, naquele dia, ele entregará o valor da avaliação como oferta santa a Yahweh.[a]
  to: Então o sacerdote calculará para ele a quantia da tua avaliação até o Ano do Jubileu; e, naquele dia, ele entregará o valor da tua avaliação, como algo consagrado a Yahweh.[a]
  rationale: A revisão elimina a inferência de que a avaliação foi “estipulada por você” e substitui “oferta santa” por uma formulação que expressa diretamente a consagração a Yahweh. Mantém-se “ele” para não explicitar além do necessário o sujeito implícito de וְנָתַן, cuja identificação é fornecida pelo contexto.
