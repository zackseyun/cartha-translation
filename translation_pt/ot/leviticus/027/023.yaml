  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: pt
  text: Então o sacerdote calculará para ele a quantia da tua avaliação até o Ano do Jubileu; e, naquele dia, ele entregará o valor da tua avaliação, como algo consagrado a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “santo para Yahweh”.'
    reason: Alternativa lexical mais formal para קֹדֶשׁ לַיהוָה.
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Então ... calculará
  rationale: O piel de חשׁב indica calcular ou determinar uma quantia; “Então” expressa com naturalidade a sequência da legislação.
- source_word: לּוֹ
  choice: para ele
  rationale: Preserva o dativo, indicando a pessoa em cujo caso ou benefício o sacerdote faz o cálculo.
- source_word: מִכְסַת
  choice: a parte proporcional
  rationale: מִכְסָה designa uma quantia ou porção determinada; aqui, trata-se do valor proporcional ao período restante até o Jubileu.
- source_word: הָעֶרְכְּךָ
  choice: da avaliação estipulada por você / o valor da avaliação
  rationale: עֵרֶךְ é termo técnico para a avaliação estabelecida no contexto dos votos. A primeira ocorrência preserva o sufixo de segunda pessoa; na segunda, “valor da avaliação” evita uma formulação portuguesa artificial sem perder o referente.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: até o Ano do Jubileu
  rationale: Marca o limite temporal do cálculo proporcional e trata o Jubileu como instituição definida.
- source_word: וְנָתַן
  choice: ele entregará
  rationale: נתן significa amplamente “dar” ou “entregar”. “Entregará” soa natural para o pagamento de uma quantia sem especificar além do texto a forma da transferência.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Tradução direta da expressão temporal hebraica.
- source_word: קֹדֶשׁ לַיהוָה
  choice: como oferta santa a Yahweh
  rationale: A expressão significa literalmente “santo para Yahweh”. “Como oferta santa” explicita de modo moderado que o valor entregue é consagrado, e a forma literal é mantida em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Sujeito implícito de וְנָתַן
  choice: Manter “ele entregará”, entendendo contextualmente que se refere ao homem que dedica ou resgata o campo
  alternative: Entender que o sacerdote é quem entrega
  rationale: O hebraico não repete o sujeito. O contexto distingue o sacerdote, que calcula, da pessoa responsável por entregar o valor; o pronome em português conserva a forma não explicitada do original, embora o contexto favoreça esta última pessoa.
- issue: Sentido de קֹדֶשׁ לַיהוָה
  choice: Expressar a consagração cultual como “oferta santa a Yahweh”
  alternative: Traduzir formalmente “santo para Yahweh”
  rationale: A expansão mínima torna clara em português a função da quantia entregue, enquanto a nota conserva a construção formal e sua concisão.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia técnica moderada. “Ano do Jubileu” identifica claramente a instituição levítica; “parte proporcional” comunica o rateio até esse ano. A pontuação mantém em uma só frase as duas ações coordenadas do hebraico.
