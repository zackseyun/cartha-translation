  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: pt
  text: Mas, se aquele que consagrou o campo de fato o resgatar, acrescentará mais um quinto ao valor da avaliação[a], e o campo será dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um quinto da prata da tua avaliação”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e o campo lhe pertencerá”; literalmente, “e ficará estabelecido para ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição que contrasta com a possibilidade apresentada no contexto anterior, mantendo a continuidade da legislação.
- source_word: גָּאֹל יִגְאַל
  choice: realmente o resgatar
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ação; “realmente” conserva essa ênfase em português natural.
- source_word: הַשָּׂדֶה
  choice: o campo
  rationale: Refere-se ao campo específico consagrado no contexto imediato.
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: aquele que consagrou o campo
  rationale: O particípio identifica quem separou o campo para uso sagrado. A repetição de “o campo” evita uma sequência pronominal ambígua em português.
- source_word: וְיָסַף
  choice: acrescentará
  rationale: No contexto legal, expressa a ação exigida como consequência da condição.
- source_word: חֲמִשִׁית כֶּסֶף עֶרְכְּךָ
  choice: um quinto do valor calculado
  rationale: Comunica naturalmente o montante adicional, literalmente “um quinto da prata da tua avaliação”; o possessivo de segunda pessoa pertence à formulação dirigida a Moisés ou à autoridade avaliadora.
- source_word: עָלָיו
  choice: ao valor calculado (implícito em “acrescentará um quinto do valor”)
  rationale: Indica que o quinto é acrescentado sobre o valor da avaliação; a construção portuguesa torna essa relação compreensível sem repetição pesada.
- source_word: וְקָם לוֹ
  choice: o campo ficará sendo dele
  rationale: Expressa o resultado jurídico de o campo ficar estabelecido como pertencente à pessoa que o resgatou, preservando a ideia do idioma hebraico.
theological_decisions:
- issue: Sentido cultual de הַמַּקְדִּישׁ
  choice: consagrou
  alternative: dedicou; santificou
  rationale: “Consagrou” preserva a ideia de separar a propriedade para finalidade sagrada, sem reduzir o ato a uma doação meramente secular.
- issue: Força jurídica da sequência verbal
  choice: futuro prescritivo e resultativo (“acrescentará... ficará”)
  alternative: futuro meramente preditivo; narrativa passada
  rationale: O contexto é legislação ritual e patrimonial; as formas indicam a obrigação decorrente da condição e seu resultado legal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Resgatar” mantém o vocabulário jurídico-cultual do capítulo; “valor calculado” torna clara a avaliação monetária sem apagar a formulação literal, registrada em nota.
