  to: Mas, se aquele que consagrou o campo de fato o resgatar, acrescentará mais um quinto ao valor da avaliação[a], e o campo será dele[b].
  rationale: A revisão torna explícito que o quinto é acrescentado ao valor avaliado, não apenas calculado como uma fração dele, e substitui uma construção possessiva pouco idiomática por uma formulação portuguesa natural. Mantêm-se a ênfase do hebraico em “de fato”, o sentido cultual de “consagrou” e as alternativas literais nas notas.
