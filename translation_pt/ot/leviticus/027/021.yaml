base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: pt
  text: Mas, quando o campo for liberado no Jubileu, será santo para Yahweh, como um campo consagrado irrevogavelmente[a]; será propriedade do sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um campo sujeito ao anátema”. O termo hebraico designa algo entregue irrevogavelmente a Yahweh e retirado do uso humano comum; em alguns contextos, isso envolve destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הַשָּׂדֶה
  choice: Mas ... o campo ... será
  rationale: O waw dá continuidade ao caso legal e, no contexto, introduz o resultado contrastante em relação à possibilidade de resgate mencionada anteriormente. “Mas” expressa essa relação com naturalidade.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: quando o campo for liberado no Jubileu
  rationale: A expressão significa literalmente “ao sair no Jubileu”, mas, nesta legislação fundiária, descreve a liberação da propriedade por ocasião do Jubileu. A explicitação de “o campo” evita a ambiguidade pronominal em português.
- source_word: קֹדֶשׁ לַיהוָה
  choice: santo para Yahweh
  rationale: Preserva a fórmula de consagração e representa diretamente o nome divino יהוה como Yahweh.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: como um campo consagrado irrevogavelmente
  rationale: Neste contexto de propriedade, חֵרֶם indica algo retirado de modo definitivo do uso comum e entregue a Deus. A formulação comunica a irrevogabilidade sem sugerir indevidamente que o próprio campo seria destruído, pois ele passa à posse sacerdotal.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: será propriedade do sacerdote
  rationale: A construção atribui o campo ao sacerdote como posse fundiária. “Propriedade” transmite de modo conciso o sentido jurídico de אֲחֻזָּה.
theological_decisions:
- issue: Sentido de חֵרֶם na legislação de santidade
  choice: campo consagrado irrevogavelmente
  alternative: campo sujeito ao anátema; campo destinado à destruição
  rationale: 'חֵרֶם pode envolver destruição em outros contextos, mas aqui o campo não é destruído: ele se torna posse do sacerdote. A tradução principal conserva a gravidade e a irreversibilidade da dedicação sem resolver o termo pela acepção destrutiva; a nota registra a alternativa tradicional.'
translation_notes:
  register: Português moderno, claro e digno, com terminologia jurídica acessível. “Jubileu” mantém o termo bíblico tradicional; “liberado” comunica o efeito legal da expressão hebraica sem reproduzir literalmente o pouco natural “sair”.
