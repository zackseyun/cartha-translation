  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: pt
  text: Mas, se ele de fato resgatar o animal[a], acrescentará um quinto ao valor que você determinou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se ele resgatar o animal” / “se ele certamente resgatar o animal”. O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase.'
