lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição contrastante em relação ao caso anterior, com fluidez natural em português.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: ele de fato resgatar o animal
  rationale: A construção com infinitivo absoluto e verbo finito dá ênfase ao resgate. “De fato” preserva essa força; “o animal” explicita naturalmente o referente feminino hebraico no contexto.
- source_word: וְיָסַף
  choice: acrescentará
  rationale: Neste contexto jurídico, a forma verbal expressa a consequência obrigatória da condição.
- source_word: חֲמִישִׁתוֹ
  choice: um quinto
  rationale: Designa o acréscimo proporcional de vinte por cento; o complemento é entendido a partir do valor determinado.
- source_word: עַל עֶרְכֶּךָ
  choice: ao valor que você determinou
  rationale: עַל com o verbo “acrescentar” indica adição, e עֶרְכֶּךָ é a avaliação feita pelo destinatário masculino singular, o sacerdote no contexto.
