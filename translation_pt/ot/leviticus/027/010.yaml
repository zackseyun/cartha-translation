base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: pt
  text: Não o substituirá nem o trocará[a], um bom por um ruim ou um ruim por um bom; e, se de fato trocar um animal por outro[b], tanto o animal original quanto o seu substituto serão santos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega dois verbos relacionados, mas distintos, que podem ser traduzidos por “substituir” e “trocar”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico dá ênfase ao verbo: “se de fato trocar” ou “se certamente trocar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: não o trocará
  rationale: O hifil de חלף indica trocar ou repor o animal consagrado por outro. “Trocar” é natural em português e mantém alguma distinção em relação ao verbo seguinte.
- source_word: יָמִיר אֹתוֹ
  choice: nem o substituirá
  rationale: מור, neste contexto legal, designa a substituição de um animal por outro. “Substituir” comunica claramente o ato proibido e preserva os dois verbos hebraicos relacionados, mas distintos.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: um bom por um ruim ou um ruim por um bom
  rationale: Os adjetivos têm valor substantivo e se referem aos animais. A inclusão de “um” torna o contraste natural e inequívoco em português.
- source_word: וְאִם הָמֵר יָמִיר
  choice: Mas, se de fato substituir
  rationale: O infinitivo absoluto seguido do verbo finito intensifica ou enfatiza a ação. “De fato” preserva essa ênfase em português corrente.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: um animal por outro
  rationale: Expressão idiomática em português que representa com clareza a substituição recíproca indicada pelo hebraico.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: tanto o animal original como o seu substituto
  rationale: 'Explicita os referentes do pronome e de תְּמוּרָה sem alterar o sentido: os dois animais passam a ter o mesmo estatuto sagrado.'
- source_word: קֹדֶשׁ
  choice: serão santos
  rationale: קֹדֶשׁ atribui aos dois animais uma condição sagrada, pertencente a Deus. “Santos” é a correspondência mais direta e preserva a terminologia teológica do texto.
theological_decisions:
- issue: Condição do animal original e do substituto depois de uma troca indevida
  choice: Tanto o animal original como o substituto tornam-se santos.
  alternative: Somente o substituto se torna santo, ou a frase apenas declara inválida a troca.
  rationale: A construção “ele e o seu substituto serão santos” atribui explicitamente condição sagrada aos dois animais. A tradução torna os dois referentes claros sem acrescentar uma conclusão doutrinária externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação legal foi preservada sem rigidez excessiva; “animal original” explicita o referente pronominal para evitar ambiguidade em português.
