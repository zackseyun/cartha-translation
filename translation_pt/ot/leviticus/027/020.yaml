id: LEV.27.20
reference: Leviticus 27:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: pt
  text: Mas, se ele não resgatar o campo ou se tiver vendido o campo a outro homem[a], o campo não poderá mais ser resgatado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a outra pessoa”. Hebraico: “a outro homem”.'
    reason: Registra o possível valor genérico de איש, preservando no texto principal sua forma masculina lexical.
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se / ou se
  rationale: A primeira ocorrência dá continuidade à condição anterior com leve força adversativa; a segunda coordena uma condição alternativa. A formulação é natural em português e preserva a estrutura do hebraico.
- source_word: יִגְאַל / יִגָּאֵל
  choice: resgatar / ser resgatado
  rationale: O verbo גאל tem aqui o sentido jurídico-sacral de recuperar mediante resgate uma propriedade consagrada. “Resgatar” conserva esse valor técnico e permite reproduzir a alternância entre as formas ativa e passiva.
- source_word: הַשָּׂדֶה
  choice: o campo
  rationale: שׂדה designa o campo específico tratado nas leis de avaliação, e não uma região ou território em sentido amplo.
- source_word: מָכַר
  choice: vender
  rationale: Na oração condicional portuguesa, “se o vender” expressa de modo idiomático a venda que produzirá a consequência jurídica declarada, sem perder a referência ao campo pelo pronome “o”.
- source_word: לְאִישׁ אַחֵר
  choice: a outro homem
  rationale: A tradução mantém o substantivo masculino איש de forma lexicalmente precisa. A nota registra a possibilidade de entendê-lo genericamente como “outra pessoa” no contexto jurídico.
- source_word: עוֹד
  choice: mais
  rationale: Com a negação, “não poderá mais” comunica naturalmente que, depois dessas condições, já não haverá possibilidade posterior de resgate.
theological_decisions:
- issue: Masculino genérico na formulação jurídica
  choice: outro homem
  alternative: outra pessoa
  rationale: O hebraico emprega איש, substantivo masculino singular. O texto preserva essa forma, enquanto a nota reconhece seu possível uso genérico sem decidir silenciosamente a abrangência jurídica.
- issue: Força jurídico-sacral de גאל
  choice: resgatar
  alternative: comprar de volta; recuperar
  rationale: “Resgatar” mantém o sentido técnico da recuperação de propriedade consagrada em Levítico 27 e evita reduzir o termo a uma simples transação comercial.
- issue: Referente do sujeito e da proibição final
  choice: manter “ele” sem identificar além do contexto e explicitar “o campo” como sujeito da passiva final
  alternative: identificar o sujeito como proprietário ou sacerdote; usar apenas “não poderá mais ser resgatado”
  rationale: O hebraico não nomeia novamente o sujeito dos verbos ativos. A tradução não acrescenta uma identificação interpretativa. Na oração final, repetir “o campo” evita ambiguidade pronominal em português e corresponde ao objeto em discussão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe jurídica permanece concisa; “o campo” é repetido na oração final para clareza. O marcador [a] foi colocado junto à expressão a que a nota realmente se refere.
