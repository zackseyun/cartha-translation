  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: pt
  text: 'Se um homem consagrar a Yahweh parte do campo de sua propriedade[a], a tua avaliação será conforme a quantidade de semente necessária para semeá-lo: por um hômer de semente de cevada, cinquenta siclos de prata.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “parte do campo de sua herança”. A expressão hebraica refere-se a terra mantida como propriedade hereditária, e o prefixo hebraico מִן, traduzido por “parte do”, sugere que somente uma porção do campo é consagrada.'
    reason: Alternativa lexical que preserva o sentido hereditário de אֲחֻזָּה e a nuance partitiva do מִן prefixado.
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: parte do campo de sua propriedade
  rationale: O מִן prefixado a “campo” indica uma porção retirada do campo, enquanto אֲחֻזָּה designa uma propriedade fundiária, frequentemente hereditária.
- source_word: יַקְדִּישׁ
  choice: consagrar
  rationale: No contexto de Levítico 27, o verbo descreve separar algo como santo para Yahweh, sujeito a avaliação.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o masculino singular do texto hebraico e sua função representativa na legislação.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino explícito יהוה e preserva sua função como nome próprio da aliança.
- source_word: עֶרְכְּךָ
  choice: a avaliação
  rationale: Expressa o valor oficialmente fixado no contexto legal; o português dispensa tornar explícito o pronome de segunda pessoa sem perder o sentido da instrução.
- source_word: לְפִי זַרְעוֹ
  choice: proporcional à quantidade de semente necessária para semeá-lo
  rationale: Esclarece que a medida depende da quantidade de semente necessária para semear o campo, não de sua produção.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: a área semeada com um ômer de cevada
  rationale: Comunica em português natural que o ômer de cevada funciona como medida de semente e, por extensão, da área que essa quantidade semeia.
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: cinquenta siclos de prata
  rationale: Mantém a unidade monetária e o material especificados pelo hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; “Yahweh” o preserva de modo direto e evita substituí-lo por um título.
- issue: Masculino genérico אִישׁ na legislação
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: Preserva a forma masculina singular da fonte sem negar o caráter representativo da norma.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia jurídica e cultual clara. “Siclos” e “ômer” preservam as unidades antigas; a formulação explicita a função agrícola da quantidade de semente sem converter as medidas.
