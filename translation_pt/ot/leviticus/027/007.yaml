base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: pt
  text: Se a pessoa tiver sessenta anos ou mais, o valor estipulado será de quinze siclos, se for do sexo masculino, e de dez siclos, se for do sexo feminino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: tiver sessenta anos ou mais
  rationale: Expressa de modo natural em português o limite etário inclusivo indicado pelo idioma hebraico, sem alterar seu alcance.
- source_word: זָכָר
  choice: do sexo masculino
  rationale: Mantém a referência ao sexo da pessoa, em vez de restringir o termo a um homem adulto.
- source_word: עֶרְכְּךָ
  choice: o valor estipulado
  rationale: Comunica o sentido técnico da avaliação fixada pela legislação dos votos em Levítico 27, com linguagem clara e corrente.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: quinze siclos
  rationale: Tradução direta do numeral e da unidade de peso monetário usada no texto.
- source_word: לַנְּקֵבָה
  choice: se for do sexo feminino
  rationale: Forma um paralelo preciso com 'do sexo masculino' e deixa claro que se trata da classificação da pessoa avaliada.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: dez siclos
  rationale: Tradução direta do numeral e da unidade.
