base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: pt
  text: Mas, se for um animal impuro[a], ele poderá resgatá-lo pelo valor que você determinar e acrescentará um quinto a esse valor[b]; se não for resgatado, será vendido pelo valor que você determinar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, um animal ritualmente impuro; também se pode traduzir: “do gado impuro”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “acrescentará o seu quinto sobre ele”; isto é, acrescentará vinte por cento ao valor avaliado.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: um dos animais impuros
  rationale: 'A construção com בְּ é entendida em sentido partitivo ou classificatório: o bem consagrado pertence à categoria dos animais ritualmente impuros. “Animais” é claro e natural no contexto.'
- source_word: וּפָדָה
  choice: poderá ser resgatado
  rationale: פדה significa resgatar ou readquirir mediante pagamento. No contexto legal, a forma apresenta o resgate como opção disponível; a voz passiva em português evita especificar um agente que o hebraico não torna explícito nesta oração.
- source_word: בְעֶרְכֶּךָ
  choice: pelo valor que você determinar
  rationale: עֵרֶךְ designa a avaliação fixada pelo sacerdote em Levítico 27. A formulação conserva a segunda pessoa do singular e soa mais natural do que “pela sua avaliação” em português corrente.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: acrescentando-se a esse valor um quinto
  rationale: O idioma hebraico ordena acrescentar um quinto sobre o valor avaliado, isto é, vinte por cento. A tradução explicita o referente do acréscimo sem converter a fração em porcentagem no texto principal.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: se não for resgatado
  rationale: O nifal de גאל deixa o agente sem expressão. A passiva preserva essa indeterminação.
- source_word: וְנִמְכַּר
  choice: será vendido
  rationale: O nifal funciona como passiva legal, indicando o procedimento aplicável quando não houver resgate.
theological_decisions:
- issue: Sentido de “impuro”
  choice: impureza ritual
  alternative: impureza moral ou condição física
  rationale: No sistema levítico, טָמֵא classifica o animal quanto à pureza ritual; a nota evita que o leitor entenda o termo como juízo moral.
- issue: Força modal de וּפָדָה
  choice: possibilidade de resgate (“poderá”)
  alternative: obrigação de resgate (“deverá”)
  rationale: A sequência legal admite que o animal não seja resgatado e então seja vendido; por isso, a primeira cláusula é melhor entendida como opção de resgate, não como ordem absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Resgatado” mantém a terminologia jurídica e cultual do capítulo; “pelo valor que você determinar” comunica naturalmente a avaliação sacerdotal e preserva a referência direta ao sacerdote.
