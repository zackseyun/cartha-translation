base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: pt
  text: Se ele consagrar[a] o seu campo desde o ano do jubileu, a avaliação que você fizer permanecerá válida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dedicar”. O verbo hebraico transmite a ideia de separar algo como sagrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Partícula condicional padrão que introduz o caso legal.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: a partir do ano do jubileu
  rationale: A preposição מִן indica o ponto inicial; a formulação também se ajusta ao cálculo segundo o tempo restante até o jubileu seguinte.
- source_word: יַקְדִּישׁ
  choice: consagrar
  rationale: O hifil de קדשׁ indica separar algo como santo, aqui destinando o campo ao âmbito sagrado; “consagrar” preserva essa dimensão cultual.
- source_word: שָׂדֵהוּ
  choice: o seu campo
  rationale: Reproduz diretamente o substantivo com sufixo possessivo de terceira pessoa.
- source_word: כְּעֶרְכְּךָ
  choice: a sua avaliação
  rationale: Mantém a referência à avaliação atribuída ao interlocutor singular no contexto legal, sem explicitar no texto uma identidade que o hebraico não declara neste versículo.
- source_word: יָקוּם
  choice: permanecerá válida
  rationale: Neste contexto jurídico-administrativo, קום expressa a validade ou vigência da avaliação; a formulação é natural em português e conserva o tom legal.
theological_decisions:
- issue: Verbo cultual empregado para destinar uma propriedade ao âmbito sagrado
  choice: consagrar
  alternative: dedicar
  rationale: “Consagrar” comunica mais claramente que o campo é separado como santo, sem acrescentar conteúdo doutrinário além do sentido do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica natural. O tratamento por “você” preserva a segunda pessoa singular de כְּעֶרְכְּךָ e favorece ampla legibilidade brasileira. O marcador foi colocado junto ao verbo a que a nota lexical se refere.
