id: LEV.27.8
reference: Leviticus 27:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם מָ֥ךְ הוּא֙ מֵֽ/עֶרְכֶּ֔/ךָ וְ/הֶֽעֱמִיד/וֹ֙ לִ/פְנֵ֣י הַ/כֹּהֵ֔ן וְ/הֶעֱרִ֥יךְ אֹת֖/וֹ הַ/כֹּהֵ֑ן עַל פִּ֗י אֲשֶׁ֤ר תַּשִּׂיג֙ יַ֣ד הַ/נֹּדֵ֔ר יַעֲרִיכֶ֖/נּוּ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: pt
  text: Mas, se ele for pobre demais para o valor estipulado por você[a], deverá ser apresentado diante do sacerdote, e o sacerdote lhe fixará o valor. O sacerdote fixará esse valor conforme os recursos de quem fez o voto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pobre em relação ao valor estipulado por você”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “conforme o que alcançar a mão de quem fez o voto”, expressão hebraica que indica sua capacidade financeira.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ
  choice: pobre demais
  rationale: O adjetivo indica condição econômica baixa; com מֵעֶרְכֶּךָ, a expressão comunica que a pessoa não tem condições de pagar o valor estabelecido.
- source_word: מֵעֶרְכֶּךָ
  choice: para o valor estipulado por você
  rationale: עֵרֶךְ é o valor monetário fixado na legislação dos votos de Levítico 27. A formulação conserva o sufixo de segunda pessoa sem tornar a frase excessivamente literal.
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  choice: deverá ser apresentado diante do sacerdote
  rationale: A construção causativa de עמד descreve a apresentação formal da pessoa à autoridade sacerdotal. A voz passiva evita identificar um agente que o hebraico não nomeia.
- source_word: וְהֶעֱרִיךְ אֹתוֹ
  choice: o sacerdote lhe fixará o valor
  rationale: Neste capítulo, ערך é o termo técnico para determinar um valor monetário. A expressão é clara em português e evita sugerir uma avaliação do valor intrínseco da pessoa.
- source_word: עַל פִּי אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר
  choice: conforme os recursos de quem fez o voto
  rationale: A expressão idiomática hebraica, literalmente relacionada ao que a mão alcança, indica a capacidade financeira da pessoa que fez o voto.
- source_word: יַעֲרִיכֶנּוּ
  choice: fixará esse valor
  rationale: Repete o verbo técnico ערך e mantém a coesão do procedimento jurídico, com referência explícita ao valor monetário já mencionado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica acessível. “Fixará o valor” preserva o sentido técnico do capítulo; “deverá ser apresentado” mantém indefinido o agente da ação.
