  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: pt
  text: No ano do jubileu, o campo voltará àquele de quem o comprou, àquele a quem pertence a propriedade fundiária.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “àquele a quem pertence a propriedade hereditária da terra”. O hebraico refere-se a uma propriedade ou posse de terra que, neste contexto, corresponde à porção original da família.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: No ano do jubileu
  rationale: Expressa naturalmente em português a indicação temporal e mantém a referência ao ano específico previsto na legislação de Levítico.
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: o campo voltará
  rationale: O imperfeito indica aqui a consequência jurídica estabelecida; o futuro simples é natural em português e preserva essa força normativa.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: àquele de quem foi comprado
  rationale: Identifica o proprietário anterior sem introduzir no português um sujeito pronominal potencialmente ambíguo para o ato da compra.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: àquele a quem pertence a posse da terra
  rationale: Mantém o sentido jurídico de אֲחֻזָּה como posse ou propriedade fundiária, sem tornar explícita no texto principal a noção contextual de hereditariedade.
theological_decisions:
- issue: Natureza de אֲחֻזַּת הָאָרֶץ na legislação do jubileu
  choice: a posse da terra
  alternative: a propriedade hereditária da terra
  rationale: Embora o contexto trate da porção familiar original, o substantivo hebraico designa diretamente uma posse fundiária. A tradução principal conserva essa formulação, e a nota esclarece a nuance contextual.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica compreensível. O futuro simples transmite a consequência normativa sem recorrer ao mais pesado “deverá voltar”.
