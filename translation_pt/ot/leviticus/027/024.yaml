  source_fidelity: 'A oração hebraica קָנָהוּ מֵאִתּוֹ tem verbo ativo: “de quem ele o comprou”, não uma construção passiva. A formulação atual omite esse dado. Além disso, אֲחֻזַּת הָאָרֶץ designa uma propriedade ou posse fundiária, isto é, uma parcela de terra possuída, e não simplesmente “a posse da terra” em sentido abstrato.'
  naturalness: “Àquele de quem o comprou” é português moderno, conciso e natural; o sujeito elíptico é recuperável do contexto legal. “Propriedade fundiária” comunica com maior precisão e naturalidade o sentido técnico de posse de terra.
  terminology: “Jubileu” e “campo” são adequados. “Propriedade fundiária” preserva o caráter de bem/posse de terra de אֲחֻזָּה sem tornar a hereditariedade explícita no texto principal.
