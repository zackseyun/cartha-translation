id: LEV.27.2
reference: Leviticus 27:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: pt
  text: '“Fale aos filhos de Israel[b] e diga-lhes: Quando um homem fizer um voto especial, envolvendo a avaliação de pessoas para Yahweh,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando alguém fizer um voto extraordinário, segundo a sua avaliação de pessoas para Yahweh”. A expressão hebraica que inclui “sua avaliação” é difícil; o sentido parece ser um voto relativo a pessoas às quais se atribui o valor estabelecido nos versículos seguintes.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “filhos de Israel”, expressão pactual comum para designar o povo de Israel; também se pode traduzir por “israelitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel introduz a fórmula solene de incumbência divina; “fale” é natural em português e preserva o caráter direto da ordem.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão pactual e familiar do hebraico; a nota registra a alternativa idiomática “israelitas”.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém a forma masculina singular da formulação jurídica hebraica, embora ela possa ter força representativa.
- source_word: יַפְלִא נֶדֶר
  choice: fizer um voto especial
  rationale: O hifil de פלא caracteriza o voto como distinto ou excepcional; esta formulação comunica isso de modo claro sem exagerar o sentido.
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: envolvendo a avaliação de pessoas
  rationale: A construção hebraica é difícil. Em vista dos versículos seguintes, refere-se a pessoas às quais se atribui uma avaliação determinada; “pessoas” evita o sentido inadequado de almas imateriais.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Preserva o nome divino e expressa que o voto e a avaliação são destinados a Yahweh.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Masculino singular jurídico אִישׁ
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: A tradução conserva a forma masculina do hebraico sem negar sua possível função representativa na legislação.
- issue: Sentido da difícil construção בְּעֶרְכְּךָ נְפָשֹׁת
  choice: envolvendo a avaliação de pessoas
  alternative: segundo a sua avaliação de pessoas
  rationale: A opção escolhida preserva a relação entre o voto e a tabela de avaliações exposta a seguir, sem sugerir indevidamente que Moisés faria pessoalmente cada avaliação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se a textura jurídica e pactual do hebraico, enquanto a construção mais obscura é apresentada com clareza moderada e sua ambiguidade é registrada em nota.
