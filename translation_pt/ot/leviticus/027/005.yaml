  verdict: revise
  source_fidelity: O intervalo etário, os montantes e a distinção entre as duas categorias sexuadas são transmitidos corretamente. Contudo, «o valor da sua avaliação» introduz uma redundância que não está no hebraico, cujo termo עֶרְכְּךָ designa diretamente a avaliação/valor fixado.
  naturalness: A frase é compreensível, mas «o valor da sua avaliação» é pesada e tautológica. «A sua avaliação será» é mais direta e natural no registro jurídico-cultual. «Pessoa do sexo masculino/feminino» deixa claro que a norma se refere à pessoa enquadrada na categoria, não ao sexo como abstração.
  terminology: «Siclos» é a forma portuguesa tradicional adequada para שְׁקָלִים. A formulação «pessoa do sexo masculino/feminino» preserva as categorias singulares do hebraico sem pressupor que se trate de adultos, o que «homem/mulher» poderia sugerir no intervalo de cinco a vinte anos.
