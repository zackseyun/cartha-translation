  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: pt
  text: E, se tiver de cinco a vinte anos, a sua avaliação será de vinte siclos para a pessoa do sexo masculino e de dez siclos para a pessoa do sexo feminino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva tanto a ligação com os casos anteriores quanto a condição, em formulação jurídica natural em português.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: a idade for de cinco a vinte anos
  rationale: Expressa de modo claro e corrente o intervalo etário indicado pela construção hebraica com בֶּן.
- source_word: וְהָיָה
  choice: será
  rationale: No contexto prescritivo, o futuro comunica naturalmente a determinação legal sem recorrer ao pouco idiomático 'deverá ser'.
- source_word: עֶרְכְּךָ
  choice: o valor da sua avaliação
  rationale: Mantém a referência à avaliação fixada no contexto dos votos e explicita que se trata do montante atribuído.
- source_word: הַזָּכָר
  choice: o sexo masculino
  rationale: Representa a categoria sexual singular do texto legal sem transformar a expressão em um grupo social plural.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: vinte siclos
  rationale: Conserva a unidade histórica de peso e valor, na forma portuguesa tradicional.
- source_word: וְלַנְּקֵבָה
  choice: para o sexo feminino
  rationale: Mantém o paralelismo entre as duas categorias sexuais da tabela de avaliação.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: dez siclos
  rationale: Tradução direta do numeral e da unidade, preservando o contraste estabelecido no texto.
theological_decisions:
- issue: Categorias de avaliação baseadas no sexo em um texto legal e cultual
  choice: o sexo masculino ... o sexo feminino
  alternative: o homem ... a mulher; um indivíduo do sexo masculino ... um indivíduo do sexo feminino
  rationale: A redação preserva as categorias sexuais singulares da norma sem ampliá-las para afirmações sociais gerais nem introduzir linguagem denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e terminologia adequada ao caráter legal e cultual do capítulo. Não foram necessárias notas de rodapé.
