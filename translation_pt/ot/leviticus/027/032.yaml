  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: pt
  text: 'Todo dízimo do gado bovino e dos rebanhos: cada décimo animal que passar sob a vara será santo para Yahweh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cajado”. A expressão refere-se à contagem dos animais, que passavam um a um sob a vara.
    reason: Nota cultural e alternativa lexical.
lexical_decisions:
- source_word: מַעְשַׂר
  choice: dízimo
  rationale: Mantém o termo técnico para a décima parte separada como pertencente a Deus.
- source_word: בָּקָר וָצֹאן
  choice: gado bovino e rebanhos
  rationale: Distingue o gado bovino do termo coletivo para animais de pequeno porte, sobretudo ovelhas e cabras, sem tornar a frase excessivamente técnica.
- source_word: כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: todo décimo animal que passar debaixo da vara
  rationale: Expressa a contagem individual dos animais ao passarem sob a vara do pastor; “animal” explicita o referente implícito de “o décimo”.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: será santo
  rationale: Preserva diretamente a categoria de santidade e a construção predicativa do hebraico.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Indica consagração e pertencimento, preservando no texto o nome divino do original.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” representa o nome pessoal e pactual sem substituí-lo por um título.
- issue: Explicitação do substantivo implícito em הָעֲשִׂירִי
  choice: todo décimo animal
  alternative: o décimo
  rationale: O contexto deixa claro que se trata dos animais contados um a um. A explicitação torna a norma compreensível em português sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Isto é” torna explícita a relação explicativa entre o dízimo dos rebanhos e cada décimo animal contado.
