revisions:
- from: Se um homem consagrar sua casa como santa a Yahweh, o sacerdote a avaliará, seja ela boa ou ruim[a]. Conforme o sacerdote a avaliar[b], assim ficará estabelecido o valor.
  to: Se um homem consagrar sua casa como algo santo para Yahweh, o sacerdote a avaliará, seja ela boa ou ruim[a]. Conforme o sacerdote a avaliar[b], assim ficará estabelecida a avaliação.
  rationale: A revisão elimina uma ambiguidade sintática na expressão da consagração e melhora a precisão jurídica da cláusula final, mantendo o sentido, a repetição do verbo hebraico de avaliação e os marcadores de nota. A nota lexical foi ajustada para evitar a conotação indevida de preço de mercado.
