  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: pt
  text: Se um homem consagrar sua casa como algo santo para Yahweh, o sacerdote a avaliará, seja ela boa ou ruim[a]. Conforme o sacerdote a avaliar[b], assim ficará estabelecida a avaliação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, qualquer que seja o estado ou a qualidade da casa para fins da avaliação sacerdotal.
    reason: cultural_note
  - marker: b
    text: 'Ou: “determinar seu valor” ou “atribuir-lhe um valor”. O mesmo verbo hebraico é usado nas duas ocorrências.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Se um homem
  rationale: Introduz um caso jurídico condicional; mantém o singular masculino de אִישׁ e verte כִּי de modo idiomático.
- source_word: יַקְדִּשׁ
  choice: consagrar
  rationale: O hifil de קדשׁ indica separar algo e atribuir-lhe condição sagrada; “consagrar” é claro e adequado ao contexto cultual.
- source_word: בֵּיתוֹ
  choice: sua casa
  rationale: Refere-se à casa como imóvel sujeito a avaliação, e não apenas ao lar em sentido afetivo.
- source_word: קֹדֶשׁ לַיהוָה
  choice: como santa a Yahweh
  rationale: Preserva a condição sagrada atribuída à casa e apresenta o nome divino explícito do texto hebraico.
- source_word: וְהֶעֱרִיכוֹ
  choice: o sacerdote a avaliará
  rationale: Neste capítulo, o hifil de ערך denota a avaliação oficial feita pelo sacerdote para determinar o valor do bem consagrado.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: seja ela boa ou ruim
  rationale: Reproduz a expressão polar hebraica, que abrange o estado ou a qualidade da casa.
- source_word: כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן
  choice: Conforme o sacerdote a avaliar
  rationale: Mantém a repetição do verbo ערך e a autoridade determinante da avaliação sacerdotal.
- source_word: כֵּן יָקוּם
  choice: assim ficará estabelecido o valor
  rationale: Expressa o sentido jurídico de que a avaliação permanece válida; “o valor” torna explícito o referente implícito no contexto sem alterar a norma.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O hebraico traz o nome próprio divino; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Natureza da consagração da casa
  choice: como santa a Yahweh
  alternative: dedicar a casa a Yahweh
  rationale: A formulação conserva tanto o ato de consagrar quanto o predicativo קֹדֶשׁ, evitando reduzir o texto a uma simples doação.
translation_notes:
  register: Português moderno, claro e digno, com construção jurídica compreensível. Mantém-se “um homem” por correspondência com o singular masculino do caso legal, e usa-se “Yahweh” para o nome divino. A repetição de “avaliar” reflete deliberadamente a repetição hebraica.
