  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: pt
  text: Mas, se ele consagrar a Yahweh um campo que comprou[a], que não faz parte da sua propriedade hereditária,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um campo adquirido por compra”, em contraste com a terra pertencente à sua herança ancestral.'
    reason: Alternativa lexical que explicita a natureza jurídica da aquisição.
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz um novo caso condicional em continuidade e leve contraste com a legislação anterior.
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: um campo que comprou
  rationale: Expressa com naturalidade que se trata de terra adquirida, em contraste com a propriedade hereditária.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: que não faz parte da sua propriedade hereditária
  rationale: Comunica o sentido jurídico de uma terra que não pertence à posse ancestral recebida por herança; em português, 'faz parte de' representa naturalmente a relação indicada por מִן.
- source_word: יַקְדִּישׁ
  choice: consagrar
  rationale: Preserva o sentido cultual e jurídico de separar algo como santo para Deus.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino expresso pelo Tetragrama e traduz a preposição conforme o contexto de consagração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome pactual sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação conserva o caráter condicional e jurídico do versículo sem reproduzir de modo artificial os sintagmas nominais hebraicos.
