base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: pt
  text: Se a pessoa tiver de um mês a cinco anos de idade, a sua avaliação será de cinco siclos de prata para o sexo masculino e de três siclos de prata para o sexo feminino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: de um mês a cinco anos de idade
  rationale: Traduz naturalmente as expressões idiomáticas hebraicas de idade e mantém os limites da faixa legal sem acrescentar uma definição sobre a inclusão exata do limite superior.
- source_word: עֶרְכְּךָ
  choice: a avaliação que você fará
  rationale: Mantém o sentido técnico da quantia fixada no contexto dos votos e expressa o sufixo de segunda pessoa masculina singular, dirigido ao responsável pela avaliação.
- source_word: הַזָּכָר
  choice: para o sexo masculino
  rationale: O hebraico classifica a pessoa pelo sexo, sem empregar um termo etário como 'menino'; esta formulação soa natural em uma tabela legal que inclui crianças pequenas.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: cinco siclos de prata
  rationale: Reproduz diretamente a unidade de peso monetário e o material especificado.
- source_word: וְלַנְּקֵבָה
  choice: para o sexo feminino
  rationale: Preserva o paralelismo da classificação legal e evita introduzir um termo etário ausente no original.
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: três siclos de prata
  rationale: Tradução direta e coerente com a quantia paralela anterior.
- source_word: וְהָיָה
  choice: será
  rationale: No contexto legislativo, comunica a força prescritiva da forma verbal com dignidade e naturalidade no português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com registro jurídico moderado. A repetição hebraica de עֶרְכְּךָ foi condensada na coordenação das duas quantias para evitar rigidez desnecessária, sem perda de conteúdo. 'Siclos' preserva a unidade antiga, e 'de prata' mantém explícito o material usado na avaliação.
