  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: pt
  text: Mas, se ele consagrar o seu campo depois do Jubileu[a], o sacerdote calculará para ele a quantia[b] de acordo com os anos que restarem até o ano do Jubileu, e ela será deduzida da sua avaliação[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois do ano do Jubileu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o sacerdote avaliará para ele o preço”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a sua avaliação será reduzida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: depois do Jubileu
  rationale: אַחַר indica sequência temporal, e הַיֹּבֵל designa a instituição ou o ano do Jubileu. A forma com inicial maiúscula apresenta Jubileu como o nome dessa instituição em Levítico.
- source_word: יַקְדִּישׁ
  choice: consagrar
  rationale: No contexto legal e cultual de Levítico 27, קדשׁ significa separar algo como santo. “Consagrar” preserva essa dimensão melhor do que o termo mais genérico “dedicar”.
- source_word: שָׂדֵהוּ
  choice: o seu campo
  rationale: Reproduz de modo natural a construção possessiva hebraica e indica que o homem consagra o campo que lhe pertence.
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: o sacerdote calculará para ele a quantia
  rationale: חשב, neste contexto jurídico, expressa cálculo ou apuração. הַכֶּסֶף é literalmente “a prata/o dinheiro”, mas aqui se refere à quantia monetária da avaliação.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: de acordo com os anos que restarem
  rationale: A expressão עַל־פִּי significa “de acordo com” ou “com base em”; os anos restantes determinam proporcionalmente a quantia.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: até o ano do Jubileu
  rationale: A expressão estabelece o limite final do período usado no cálculo.
- source_word: וְנִגְרַע
  choice: e ela será deduzida
  rationale: O nifal de גרע indica redução ou dedução. O pronome “ela” retoma naturalmente “a quantia” no contexto monetário.
- source_word: מֵעֶרְכֶּךָ
  choice: da sua avaliação
  rationale: עֶרְכֶּךָ remete à avaliação prevista anteriormente e contém um sufixo de segunda pessoa do singular, preservado por “sua”.
theological_decisions:
- issue: Manutenção da segunda pessoa do singular em מֵעֶרְכֶּךָ
  choice: da sua avaliação
  alternative: da avaliação; da avaliação do campo
  rationale: O hebraico emprega diretamente a segunda pessoa do singular. Preservá-la mantém o estilo de instrução legal e a ligação com a avaliação mencionada no contexto, sem tornar o texto impessoal.
- issue: Terminologia cultual para יַקְדִּישׁ
  choice: consagrar
  alternative: dedicar; santificar
  rationale: Como o campo é separado dentro de um contexto de santidade e legislação cultual, “consagrar” conserva a dimensão sagrada sem acrescentar uma interpretação doutrinária específica.
- issue: Referente implícito de וְנִגְרַע
  choice: a quantia será deduzida da sua avaliação
  alternative: a sua avaliação será reduzida
  rationale: A forma verbal permite expressar uma redução no valor. A redação escolhida liga a dedução à quantia calculada, de modo coerente com o contexto econômico, enquanto a nota preserva a formulação alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário jurídico-cultual claro. Mantém-se “Jubileu” como nome da instituição, “consagrar” para o ato sagrado e a segunda pessoa singular do texto hebraico. Os marcadores [a], [b] e [c] aparecem no texto principal.
