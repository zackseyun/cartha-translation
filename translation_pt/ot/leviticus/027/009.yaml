id: LEV.27.9
reference: Leviticus 27:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: pt
  text: E, se for um animal do qual se apresenta uma oferta a Yahweh[a], tudo o que dele for dado a Yahweh será santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que pode ser apresentado como oferta a Yahweh”. A expressão hebraica pode descrever tanto um animal do qual se apresenta efetivamente uma oferta como um animal apropriado para ser apresentado como oferta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Mantém a ligação com a legislação anterior e introduz naturalmente a condição.
- source_word: בְּהֵמָה
  choice: animal
  rationale: Termo genérico, claro e adequado ao contexto sacrificial.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: do qual se apresenta uma oferta
  rationale: O verbo no hifil tem sentido cultual de trazer ou apresentar, e מִמֶּנָּה pode indicar que a oferta procede do animal ou que ele pertence à classe oferecida; a nota preserva essa ambiguidade.
- source_word: קָרְבָּן
  choice: oferta
  rationale: Equivalente corrente e compreensível para o termo sacrificial.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico.
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: tudo o que dele for dado
  rationale: A construção impessoal soa natural em português, preserva o referente genérico e não introduz um agente masculino específico.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: será santo
  rationale: Preserva o registro teológico e jurídico da consagração a Deus.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido da oração relativa sobre o animal
  choice: do qual se apresenta uma oferta
  alternative: que pode ser apresentado como oferta
  rationale: A sintaxe hebraica admite referência tanto à procedência efetiva da oferta quanto à classe de animais apropriada para oferta. O texto principal segue de perto a formulação hebraica, e a nota explicita a alternativa sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e acessível, com formulação jurídica clara. A voz impessoal evita especificar um agente não expresso e mantém a generalidade da norma.
