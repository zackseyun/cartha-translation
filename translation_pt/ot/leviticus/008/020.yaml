base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/020.yaml
  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: pt
  text: Depois, ele cortou o carneiro em pedaços, e Moisés fez subir em fumaça a cabeça, os pedaços e a gordura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sebo”. O termo hebraico designa uma porção gordurosa do animal sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: o carneiro
  rationale: No contexto sacrificial, אַיִל designa um carneiro adulto, e não apenas genericamente um ovino macho.
- source_word: נִתַּח לִנְתָחָיו
  choice: cortou ... em pedaços
  rationale: A construção com verbo e substantivo cognatos descreve o esquartejamento do animal em suas partes; esta formulação é clara e natural em português.
- source_word: וַיַּקְטֵר
  choice: fez subir em fumaça
  rationale: O hifil de קטר, em contexto sacrificial, indica fazer a oferta subir em fumaça. A formulação preserva esse sentido cultual, evitando reduzi-lo ao simples ato de queimar.
- source_word: הָרֹאשׁ
  choice: a cabeça
  rationale: Equivalente anatômico direto e adequado ao contexto.
- source_word: הַנְּתָחִים
  choice: os pedaços
  rationale: Retoma o substantivo cognato da primeira oração e mantém a coerência lexical.
- source_word: הַפָּדֶר
  choice: a gordura
  rationale: פָּדֶר refere-se a uma porção gordurosa do animal sacrificial. 'Gordura' é exato e compreensível sem especificar indevidamente a cauda gorda.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A alternância entre o sujeito implícito na primeira oração e “Moisés” explicitamente nomeado na segunda acompanha a estrutura hebraica. Evitou-se acrescentar “no altar”, embora o contexto o pressuponha.
