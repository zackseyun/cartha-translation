source:
  edition: WLC
  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Então Moisés fez os filhos de Arão se aproximarem[a], vestiu-os com túnicas, cingiu-os com faixas[b] e prendeu-lhes os gorros à cabeça, conforme Yahweh[c] havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apresentou os filhos de Arão”. O verbo hebraico pode significar “fazer aproximar” ou, em contexto ritual, “apresentar”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “com uma faixa”; o singular tem sentido distributivo, isto é, cada filho recebeu sua própria faixa sacerdotal.
    reason: lexical_alternative
  - marker: c
    text: O nome divino em hebraico é YHWH, tradicionalmente representado por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fez ... se aproximarem
  rationale: O hifil de קרב significa fazer chegar perto ou apresentar. A formulação preserva a ideia de aproximação ritual sem impor um termo técnico mais específico.
- source_word: בְּנֵי אַהֲרֹן
  choice: os filhos de Arão
  rationale: Tradução direta e natural da construção hebraica, preservando a referência familiar masculina.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: vestiu-os com túnicas
  rationale: O hifil de לבשׁ indica vestir alguém, e כֻּתֳּנֹת designa vestes compridas semelhantes a camisas; 'túnicas' é claro e apropriado ao contexto sacerdotal.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: cingiu-os com faixas
  rationale: 'חגר descreve o ato de cingir, e אַבְנֵט é uma faixa sacerdotal de tecido. O plural em português explicita naturalmente o sentido distributivo do singular hebraico: uma faixa para cada filho.'
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: prendeu-lhes os gorros à cabeça
  rationale: חבשׁ envolve prender ou ajustar uma cobertura à cabeça. 'Gorros' distingue as coberturas dos sacerdotes comuns do turbante de Arão e é compreensível em português atual.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: Tudo foi feito conforme Yahweh havia ordenado a Moisés
  rationale: A formulação comunica a conformidade exata expressa pela fórmula hebraica recorrente. A divisão em nova oração evita uma sequência excessivamente longa em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando seu caráter de nome pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome divino e representa uma vocalização acadêmica amplamente reconhecida, enquanto a nota informa a tradição de substituí-lo por 'SENHOR'.
- issue: Sentido ritual de וַיַּקְרֵב
  choice: fez ... se aproximarem
  alternative: apresentou
  rationale: A escolha mantém a possível ideia espacial e ritual do verbo sem decidir que se trata exclusivamente de uma fórmula técnica de apresentação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. 'Cingiu-os' conserva a precisão ritual em registro digno; 'faixas' e 'gorros' evitam vocabulário excessivamente arcaico. A última fórmula foi apresentada como oração independente para melhorar a fluidez sem alterar seu conteúdo.
