id: LEV.8.4
reference: Leviticus 8:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: pt
  text: Moisés fez como Yahweh lhe havia ordenado, e a comunidade se reuniu[a] à entrada da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi reunida”. A forma hebraica também pode ser expressa por uma construção passiva.
    reason: alternativa lexical e de voz verbal
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה tem sentido amplo de fazer ou realizar; neste contexto, “fez” expressa de modo direto a obediência de Moisés.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Introduz a conformidade da ação de Moisés com a ordem divina, de maneira concisa e natural em português.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: צוה indica uma ordem dotada de autoridade; o mais-que-perfeito composto deixa clara a anterioridade da ordem em relação à ação de Moisés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֹתוֹ
  choice: lhe
  rationale: O pronome retoma Moisés como destinatário da ordem; “lhe havia ordenado” é a construção idiomática em português.
- source_word: וַתִּקָּהֵל
  choice: se reuniu
  rationale: A forma nifal de קהל descreve a comunidade vindo a reunir-se; a construção pronominal é natural em português, embora também possa admitir formulação passiva.
- source_word: הָעֵדָה
  choice: a comunidade
  rationale: עֵדָה designa aqui a comunidade coletiva de Israel. “Comunidade” é atual e abrangente, sem sugerir apenas uma reunião local de culto.
- source_word: אֶל פֶּתַח
  choice: à entrada
  rationale: Embora אֶל marque direção, com פֶּתַח o português expressa naturalmente o destino e a posição resultante como “à entrada”.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Preserva tanto a estrutura física, “tenda”, quanto sua função como lugar de encontro designado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém a sequência narrativa e evita vocabulário excessivamente eclesiástico.
