  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: pt
  text: Então derramou um pouco do óleo da unção sobre a cabeça de Arão e o ungiu para consagrá-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: derramou
  rationale: O verbo יצק descreve naturalmente o ato de derramar um líquido; «derramou» é claro e corrente em português.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: um pouco do óleo da unção
  rationale: 'A preposição מִן tem aqui sentido partitivo: foi derramada uma porção do óleo. «Óleo da unção» preserva a expressão ritual hebraica em linguagem bíblica compreensível.'
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: sobre a cabeça de Arão
  rationale: Tradução locativa direta e natural; «Arão» é a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: וַיִּמְשַׁח
  choice: o ungiu
  rationale: «Ungir» é o equivalente habitual de משׁח e conserva o sentido ritual e teológico da ação.
- source_word: לְקַדְּשׁוֹ
  choice: para consagrá-lo
  rationale: No contexto da instalação sacerdotal, קדשׁ indica separar alguém para o serviço sagrado; «consagrar» comunica esse sentido cultual com clareza.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz avançar a sequência narrativa; «Então» expressa essa progressão de modo natural.
theological_decisions:
- issue: Tradução de קדשׁ no contexto da instalação sacerdotal
  choice: para consagrá-lo
  alternative: para santificá-lo; para torná-lo santo
  rationale: O ato separa Arão para o serviço sacerdotal. «Consagrá-lo» preserva a dimensão ritual e vocacional sem acrescentar uma interpretação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla legibilidade brasileira. A formulação mantém a sequência ritual e a terminologia sacerdotal sem arcaísmos desnecessários.
