id: LEV.8.34
reference: Leviticus 8:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: pt
  text: Assim como se fez neste dia, Yahweh ordenou que se fizesse, para fazer expiação por vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Introduz a comparação entre o ritual já realizado e aquilo que Yahweh ordenou, preservando a força comparativa do hebraico.
- source_word: עָשָׂה
  choice: se fez
  rationale: Embora a forma seja morfologicamente masculina singular, o agente não é expresso; a construção impessoal em português evita acrescentar um sujeito e remete naturalmente ao ritual realizado.
- source_word: בַּיּוֹם הַזֶּה
  choice: neste dia
  rationale: Mantém de perto a expressão temporal hebraica e combina com o registro cerimonial do contexto.
- source_word: צִוָּה
  choice: ordenou
  rationale: O pretérito perfeito expressa com naturalidade a ordem dada que fundamenta o ritual presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לַעֲשֹׂת
  choice: que se fizesse
  rationale: Retoma o verbo anterior e preserva o agente não especificado por meio de uma construção impessoal natural em português.
- source_word: לְכַפֵּר
  choice: para fazer expiação
  rationale: Reproduz a linguagem sacerdotal de כפר sem restringir o termo a uma teoria específica do mecanismo da expiação.
- source_word: עֲלֵיכֶם
  choice: por vocês
  rationale: Com כפר, a preposição על indica aqui o benefício ou referência pessoal da expiação; esta formulação é clara e idiomática.
theological_decisions:
- issue: Sentido de כפר no contexto sacrificial
  choice: para fazer expiação por vocês
  alternative: para expiar por vocês; para realizar expiação em favor de vocês
  rationale: “Fazer expiação” conserva o sentido cultual tradicional e a amplitude teológica do termo hebraico, sem impor categorias mais estreitas como propiciação ou purificação.
- issue: Agente dos verbos עשה
  choice: 'construções impessoais: “se fez” e “que se fizesse”'
  alternative: “ele fez” e “fazer”
  rationale: O hebraico não identifica explicitamente o agente neste enunciado. A tradução impessoal preserva essa abertura e evita decidir se a referência imediata é a Moisés ou, de modo mais amplo, à execução do ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “fez/fizesse” é mantida para refletir a repetição de עשה no hebraico. Não se acrescentou nota, pois a alternativa inglesa indicada representa sobretudo uma reorganização sintática e não uma diferença textual ou semântica que exija registro na edição portuguesa.
