  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: pt
  text: Então ele o imolou. Moisés pegou o sangue e, com o dedo, colocou-o sobre os chifres do altar, ao redor, e purificou o altar.[a] Depois derramou o sangue na base do altar e o consagrou, para fazer expiação por ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “limpou ritualmente o altar”. Neste contexto, o verbo hebraico indica purificação de impureza, não o sentido de “fazer pecar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “realizar sobre ele o rito de expiação” ou “purificá-lo ritualmente”. O verbo hebraico abrange sentidos de expiação e de purificação sacrificial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: ele o imolou
  rationale: No contexto sacrificial, שׁחט designa o abate ritual; “imolou” comunica essa ação cultual com precisão e concisão.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: os chifres do altar
  rationale: Mantém o termo concreto para as projeções em forma de chifre existentes no altar.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa a distribuição do sangue nos chifres em torno do altar sem tornar a frase pesada.
- source_word: בְּאֶצְבָּעוֹ
  choice: com o dedo
  rationale: Reproduz naturalmente o singular e o valor instrumental do hebraico.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: purificou o altar
  rationale: No piel e neste contexto sacerdotal, חטא indica purificação ritual, não o ato de levar o altar a pecar.
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: derramou o restante do sangue junto à base do altar
  rationale: “Base” é o equivalente cultual natural de יְסוֹד. “Restante” explicita, a partir da sequência da ação, que se trata do sangue não aplicado aos chifres, sem alterar o sentido.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: e o consagrou
  rationale: קדשׁ aqui significa separar o altar como santo e próprio para o uso sagrado.
- source_word: לְכַפֵּר עָלָיו
  choice: para fazer expiação por ele
  rationale: “Fazer expiação” preserva o peso cultual de כפר; “por ele” apresenta o altar como objeto do rito em português natural.
theological_decisions:
- issue: Sentido de חטא no rito sacerdotal
  choice: purificou o altar
  alternative: limpou o altar
  rationale: A tradução indica remoção ritual de impureza sem sugerir que o altar tivesse cometido pecado.
- issue: Sentido de כפר aplicado ao altar
  choice: fazer expiação por ele
  alternative: realizar sobre ele o rito de expiação; purificá-lo ritualmente
  rationale: A formulação mantém a expressão teologicamente significativa e a tensão do hebraico, no qual o próprio altar recebe o rito, sem impor uma explicação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação hebraica foi moderadamente reorganizada em períodos naturais. “Imolou”, “chifres do altar”, “consagrou” e “expiação” preservam o registro sacrificial técnico sem arcaísmo excessivo.
