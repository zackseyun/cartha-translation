  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: pt
  text: E o que restar da carne e do pão queimarão no fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: E o que restar
  rationale: O particípio nifal substantivado expressa aquilo que permanece ou sobra. A formulação é natural em português e, no contexto da instrução, o futuro do subjuntivo combina adequadamente com a oração principal diretiva.
- source_word: בַּבָּשָׂר
  choice: da carne
  rationale: בָּשָׂר significa literalmente carne ou corpo carnal; neste contexto sacrificial, “carne” designa de modo claro a parte comestível do animal sem eliminar o sentido lexical básico.
- source_word: וּבַלָּחֶם
  choice: e do pão
  rationale: לֶחֶם é o termo comum para pão, e a construção mantém o paralelismo com “da carne”.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: A preposição ב pode indicar esfera ou meio. “No fogo” é idiomático em português e representa diretamente a ação de queimar aquilo que restar.
- source_word: תִּשְׂרֹפוּ
  choice: vocês queimarão
  rationale: O imperfeito na segunda pessoa masculina plural tem força diretiva neste contexto legal. “Vocês queimarão” conserva o tom solene de instrução e tem ampla clareza moderna.
