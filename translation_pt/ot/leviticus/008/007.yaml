base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: pt
  text: Vestiu-o com a túnica, amarrou-lhe a faixa à cintura, vestiu-o com o manto e colocou-lhe o éfode. Amarrou-lhe ao corpo a faixa habilmente tecida do éfode[a] e, por meio dela, prendeu-lhe o éfode.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “faixa trabalhada do éfode” ou “cinturão do éfode”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico, raro e derivado da palavra “éfode”, provavelmente indica que o éfode foi preso à pessoa por meio de sua própria faixa.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: túnica
  rationale: Designa a veste básica usada junto ao corpo; “túnica” é claro, tradicional e preciso em português atual.
- source_word: אַבְנֵט
  choice: faixa
  rationale: Refere-se a uma faixa de tecido presa em torno da cintura, termo adequado às vestes sacerdotais.
- source_word: מְעִיל
  choice: manto
  rationale: Indica a veste exterior colocada sobre a túnica; “manto” é natural e preserva o caráter cerimonial.
- source_word: אֵפֹד
  choice: éfode
  rationale: Termo técnico para uma veste sacerdotal sem equivalente português exato; a transliteração preserva sua especificidade cultual.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: faixa tecida do próprio éfode
  rationale: No contexto das vestes sacerdotais, designa a faixa confeccionada como parte do éfode ou associada a ele; “tecida” conserva seu caráter artesanal sem impor ornamentação não explicitada.
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: amarrou-lhe a faixa à cintura
  rationale: Expressa de modo natural a ação de envolver e prender a faixa ao redor da cintura.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: com ela, o ajustou firmemente
  rationale: O verbo denominativo raro, derivado de “éfode”, descreve a fixação da veste por meio de sua faixa. O pronome “o” retoma o éfode no contexto imediato.
theological_decisions:
- issue: Terminologia das vestes sacerdotais
  choice: Manter “éfode” como termo cultual técnico e traduzir as demais peças por termos portugueses correntes
  alternative: Traduzir אֵפֹד descritivamente como “veste semelhante a um avental”
  rationale: A transliteração evita uma identificação excessivamente específica da forma da peça e preserva a terminologia sacerdotal, enquanto “túnica”, “faixa” e “manto” mantêm a leitura acessível.
- issue: Referente e sentido do verbo final וַיֶּאְפֹּד
  choice: Entender que o éfode foi ajustado ao corpo por meio de sua faixa
  alternative: Verter de modo mais literal e obscuro como “cingiu-o com ela”
  rationale: A construção é incomum, mas o contexto da colocação das vestes indica a fixação do éfode com a faixa. A tradução explicita apenas a relação instrumental indicada por בּוֹ, sem acrescentar significado doutrinário.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe fluida. Evita o arcaísmo “cingir” no texto principal, mas conserva a precisão da sequência ritual. Os pronomes mantêm o participante referido no hebraico sem inserir nomes ausentes neste versículo.
