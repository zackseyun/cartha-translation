revisions:
- from: Vestiu-o com a túnica, amarrou-lhe a faixa à cintura, cobriu-o com o manto e colocou sobre ele o éfode. Depois, prendeu o éfode ao seu corpo com a faixa tecida do próprio éfode[a] e, com ela, o ajustou firmemente.[b]
  to: Vestiu-o com a túnica, amarrou-lhe a faixa à cintura, vestiu-o com o manto e colocou-lhe o éfode. Amarrou-lhe ao corpo a faixa habilmente tecida do éfode[a] e, por meio dela, prendeu-lhe o éfode.[b]
  rationale: A revisão restabelece a sequência sintática do hebraico e distingue a ação de amarrar a faixa do éfode da ação final de prender o éfode mediante essa faixa. Mantém os termos técnicos e o sentido instrumental sem resolver além do necessário a construção rara do verbo final.
