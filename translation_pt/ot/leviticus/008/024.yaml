base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: pt
  text: Então Moisés fez os filhos de Arão se aproximarem e pôs um pouco do sangue no lóbulo da orelha direita deles, no polegar da mão direita e no dedão do pé direito. Depois, Moisés lançou o sangue contra o altar, por todos os lados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fez ... se aproximarem
  rationale: 'O hifil expressa ação causativa: Moisés fez com que os filhos de Arão se aproximassem; a formulação é natural em português e mantém essa nuance.'
- source_word: תְּנוּךְ
  choice: lóbulo
  rationale: No contexto ritual, designa a extremidade ou o lóbulo da orelha; 'lóbulo' é claro e tradicional sem acrescentar interpretação teológica.
- source_word: בֹּהֶן
  choice: polegar / dedão
  rationale: O mesmo termo hebraico indica o dedo principal da mão e do pé; em português, os equivalentes naturais diferem conforme o membro.
- source_word: וַיִּזְרֹק
  choice: lançou ... contra
  rationale: O verbo descreve lançar ou aspergir o sangue contra o altar. 'Lançou ... contra' preserva a força concreta do hebraico sem especificar um método ritual além do texto.
- source_word: סָבִיב
  choice: contra todos os lados
  rationale: Comunica que o sangue foi lançado ao redor do altar, isto é, em seu contorno, com expressão corrente em português.
