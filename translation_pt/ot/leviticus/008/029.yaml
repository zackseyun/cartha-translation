base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Então Moisés tomou o peito e o moveu como oferta movida diante de Yahweh. Essa foi a porção de Moisés, do carneiro da ordenação[a], conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do carneiro da consagração”.'
    reason: Alternativa lexical legítima para מִלֻּאִים no contexto da instalação sacerdotal.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então Moisés pegou
  rationale: O wayyiqtol dá sequência à narrativa; “Então” expressa essa progressão com naturalidade, e “pegou” traduz o sentido simples do verbo.
- source_word: הֶחָזֶה
  choice: o peito
  rationale: No contexto sacrificial, חָזֶה designa a porção do peito do animal; “peito” é a forma culticamente precisa e corrente em português.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: o moveu como oferta movida
  rationale: A construção combina o verbo נוּף com o substantivo cognato תְּנוּפָה, indicando o gesto ritual de mover ou apresentar a oferta. A formulação preserva tanto a ação quanto o termo sacrificial.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: A expressão indica apresentação na presença de Yahweh e mantém a formulação cultual concisa do hebraico.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: tirada do carneiro da ordenação
  rationale: אֵיל significa “carneiro”, e מִלֻּאִים, neste contexto sacerdotal, refere-se ao rito de investidura ou ordenação. “Tirada” torna explícita em português a relação indicada pela preposição מִן.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: Essa foi a porção de Moisés
  rationale: מָנָה é uma parte ou porção atribuída a alguém. A frase comunica naturalmente que essa parte do sacrifício coube a Moisés.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: A fórmula declara que a ação correspondeu a uma ordem divina anterior; o mais-que-perfeito composto expressa essa anterioridade com clareza.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido cultual de מִלֻּאִים
  choice: ordenação
  alternative: consagração
  rationale: No contexto da instalação sacerdotal de Levítico 8, “ordenação” comunica adequadamente a investidura no ofício. Como “consagração” também é lexicalmente possível, a alternativa foi preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém-se o termo técnico “oferta movida” e o nome divino “Yahweh”; a repetição de “Moisés” segue a ênfase e a clareza do hebraico.
