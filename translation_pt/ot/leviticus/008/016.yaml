base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: pt
  text: Ele pegou toda a gordura que estava sobre as vísceras, o lobo do fígado[a], os dois rins e a gordura deles; então Moisés os queimou[b] sobre o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o apêndice do fígado”; o termo hebraico se refere a uma parte específica do fígado retirada na preparação do sacrifício.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico pode significar mais especificamente “transformar em fumaça” ou “oferecer em fumaça” em contextos sacrificiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Ele pegou
  rationale: O wayyiqtol de לקח expressa a ação seguinte na narrativa. O pronome retoma naturalmente Moisés, identificado no contexto, sem acrescentar seu nome antes de ele aparecer no segundo verbo hebraico.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: toda a gordura que estava sobre as vísceras
  rationale: חֵלֶב designa aqui as porções gordurosas destinadas ao sacrifício, e קֶרֶב se refere às partes internas do animal. A formulação é concreta e compreensível em português atual.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: o lobo do fígado
  rationale: A expressão designa uma parte específica do fígado retirada na preparação sacrificial. “Lobo do fígado” é claro e idiomático, enquanto a nota preserva a alternativa anatômica “apêndice do fígado”.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: os dois rins
  rationale: Tradução anatômica direta que preserva o dual hebraico.
- source_word: חֶלְבְּהֶן
  choice: a gordura deles
  rationale: O sufixo pronominal retoma os rins; “deles” mantém essa relação explícita.
- source_word: וַיַּקְטֵר
  choice: fez tudo isso queimar
  rationale: No contexto sacrificial, קטר descreve a queima da oferta no altar, com a ideia de fazê-la subir em fumaça. A expressão distingue a ação ritual de uma simples combustão, e “tudo isso” explicita em português o objeto implícito formado pela lista anterior.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: A terminação direcional/locativa indica o lugar para o qual as partes foram levadas e onde foram queimadas; “sobre o altar” é natural neste contexto ritual.
