  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: pt
  text: Do cesto dos pães sem fermento que estava diante de Yahweh, ele pegou um bolo sem fermento, um bolo de pão com óleo[a] e um pão fino; então os colocou sobre as porções de gordura e sobre a coxa direita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um bolo misturado com óleo”. A expressão hebraica descreve um pão preparado com óleo, mas não explicita o modo exato de preparo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  choice: Do cesto dos pães sem fermento
  rationale: A preposição מִן indica a origem dos itens retirados, e מַצּוֹת designa aqui os pães sem fermento contidos no cesto ritual.
- source_word: חַלַּת מַצָּה אַחַת
  choice: um bolo sem fermento
  rationale: חַלָּה indica uma unidade de pão ou bolo; מַצָּה especifica que era sem fermento. “Bolo” distingue essa peça do pão fino mencionado em seguida.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: um bolo de pão com óleo
  rationale: A construção associa o pão ao óleo, mas não explicita se o óleo era misturado à massa ou aplicado de outra forma; “com óleo” conserva essa abertura.
- source_word: רָקִיק אֶחָד
  choice: um pão fino
  rationale: רָקִיק designa uma peça fina e achatada de pão ritual. “Pão fino” é claro e atual, sem recorrer ao menos comum “obreia”.
- source_word: הַחֲלָבִים
  choice: as porções de gordura
  rationale: No contexto sacrificial, o plural se refere às partes gordurosas separadas para o rito, não à gordura em sentido genérico.
- source_word: שׁוֹק הַיָּמִין
  choice: a coxa direita
  rationale: שׁוֹק designa a parte da perna ou coxa do animal; “coxa direita” é uma formulação consagrada e adequada ao contexto sacrificial.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome da aliança e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário ritual compreensível. Evitou-se “obreia”, hoje pouco comum, em favor de “pão fino”. O marcador [a] foi colocado junto à expressão que a nota esclarece.
