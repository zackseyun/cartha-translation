  text: וְ/אֶת הַ/קֶּ֥רֶב וְ/אֶת הַ/כְּרָעַ֖יִם רָחַ֣ץ בַּ/מָּ֑יִם וַ/יַּקְטֵר֩ מֹשֶׁ֨ה אֶת כָּל הָ/אַ֜יִל הַ/מִּזְבֵּ֗חָ/ה עֹלָ֨ה ה֤וּא לְ/רֵֽיחַ נִיחֹ֨חַ֙ אִשֶּׁ֥ה הוּא֙ לַ/יהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Lavou as vísceras e as pernas com água, e Moisés queimou o carneiro inteiro sobre o altar. Era um holocausto de aroma agradável, uma oferta feita pelo fogo[a] a Yahweh, conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma oferta de alimento”. O sentido exato do termo hebraico é discutido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: as vísceras
  rationale: Designa as partes internas do animal sacrificial; “vísceras” é concreto, preciso e natural em português.
- source_word: הַכְּרָעַיִם
  choice: as pernas
  rationale: No contexto sacrificial, refere-se aos membros, especialmente à parte inferior das pernas; “pernas” oferece clareza sem precisão anatômica excessiva.
- source_word: רָחַץ בַּמָּיִם
  choice: lavou ... com água
  rationale: Reproduz tanto o verbo “lavar” quanto a menção explícita à água, preservando a concretude ritual.
- source_word: וַיַּקְטֵר
  choice: queimou
  rationale: No uso sacerdotal, indica fazer a oferta subir em fumaça no altar; “queimou” é natural em português e o contexto sacrificial conserva a nuance cultual.
- source_word: כָּל הָאַיִל
  choice: o carneiro inteiro
  rationale: Expressa claramente que a totalidade do animal foi queimada.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Representa naturalmente o sentido locativo da forma hebraica neste contexto.
- source_word: עֹלָה
  choice: holocausto
  rationale: É o termo português tradicional e ainda reconhecível para a oferta inteiramente queimada; a expressão anterior esclarece concretamente seu sentido.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Preserva a metáfora sensorial e a ideia de aceitação divina sem explicá-la além do texto.
- source_word: אִשֶּׁה
  choice: oferta feita pelo fogo
  rationale: A etimologia e o uso do termo são discutidos, mas neste contexto “oferta feita pelo fogo” comunica de modo transparente sua associação sacrificial com o fogo e evita introduzir “alimento”, ausente de forma explícita no termo.
- source_word: לַיהוָה / יְהוָה
  choice: a Yahweh / Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: A fórmula ressalta a plena conformidade do ato com a ordem divina; o mais-que-perfeito composto é natural na sequência narrativa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituir silenciosamente o nome por um título.
- issue: Sentido da fórmula cultual לְרֵיחַ נִיחֹחַ
  choice: de aroma agradável
  alternative: de aroma apaziguador; de aroma suave
  rationale: A opção mantém a imagem sensorial e a noção de agrado ou aceitação sem resolver se a linguagem deve ser entendida literal, ritual ou metaforicamente.
- issue: Tradução de אִשֶּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A relação lexical exata do termo é discutida. A tradução escolhida corresponde ao uso sacrificial imediato e não impõe a interpretação de “alimento”; a nota registra a alternativa relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém terminologia ritual reconhecível (“altar”, “holocausto”) e sintaxe narrativa fluente. O marcador [a] aparece no texto junto à expressão que recebe a alternativa lexical.
