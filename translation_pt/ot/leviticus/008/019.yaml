  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: pt
  text: E ele o abateu, e Moisés lançou o sangue sobre o altar, por todos os lados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atirou o sangue contra o altar, por todos os lados”. O verbo hebraico indica uma aplicação vigorosa do sangue sacrificial, não uma aspersão leve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: ele o matou
  rationale: No contexto sacrificial, שׁחט designa matar o animal mediante abate. O pronome retoma o carneiro mencionado no versículo anterior; “matou” é natural e digno em português.
- source_word: וַיִּזְרֹק
  choice: lançou
  rationale: זרק descreve a aplicação vigorosa do sangue contra o altar. “Lançou” preserva a ideia básica de arremessar e evita a impressão de uma aspersão leve.
- source_word: הַדָּם
  choice: o sangue
  rationale: Tradução direta do substantivo definido.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente português padrão de מִזְבֵּחַ em contexto sacrificial.
- source_word: סָבִיב
  choice: ao redor
  rationale: Indica que o sangue foi aplicado em torno do altar, sobre seus lados.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
