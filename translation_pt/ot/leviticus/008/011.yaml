id: LEV.8.11
reference: Leviticus 8:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: pt
  text: Então aspergiu um pouco do óleo sobre o altar sete vezes e ungiu o altar e todos os seus utensílios, bem como a bacia e seu suporte, para consagrá-los.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּז
  choice: aspergiu
  rationale: No hifil de נזה e em contexto ritual, indica aspergir um líquido; “aspergiu” preserva com clareza o registro cultual.
- source_word: מִמֶּנּוּ
  choice: um pouco do óleo
  rationale: Literalmente, “dele”; o referente contextual é o óleo da unção mencionado no versículo anterior. A explicitação evita em português um pronome de referência pouco natural.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente consagrado e preciso de מִזְבֵּחַ no contexto sacrificial.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Expressão numérico-adverbial direta, indicando a repetição do ato ritual.
- source_word: וַיִּמְשַׁח
  choice: e ungiu
  rationale: משׁח designa a unção ritual; “ungiu” mantém o sentido técnico e teológico sem explicações adicionais.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: כְּלִי abrange objetos e instrumentos; “utensílios” é atual, compreensível e adequado ao equipamento do santuário.
- source_word: הַכִּיֹּר
  choice: a bacia
  rationale: Refere-se ao recipiente destinado às lavagens no pátio do tabernáculo; “bacia” é mais corrente do que “lavatório” ou o arcaísmo “pia de bronze” como termo técnico.
- source_word: כַּנּוֹ
  choice: seu suporte
  rationale: כֵּן indica a estrutura que sustentava a bacia; “suporte” é claro e não pressupõe uma forma específica.
- source_word: לְקַדְּשָׁם
  choice: para consagrá-los
  rationale: O infinitivo de קדשׁ expressa separar esses objetos como santos para o uso sagrado; “consagrar” comunica bem o sentido cultual.
theological_decisions:
- issue: Terminologia cultual para ações e objetos sagrados
  choice: Empregar “ungiu” e “consagrá-los”, termos rituais estabelecidos e ainda compreensíveis.
  alternative: Usar “passou óleo” e “torná-los santos”, ou vocabulário mais tradicional e técnico.
  rationale: A redação conserva a importância ritual da unção e da separação para uso santo, sem importar sentidos doutrinários posteriores nem tornar a linguagem excessivamente arcaica.
- issue: Referente de מִמֶּנּוּ
  choice: Explicitar “do óleo” com base no contexto imediato.
  alternative: Traduzir formalmente “dele”.
  rationale: O hebraico remete ao óleo da unção de Levítico 8:10. A explicitação torna a frase natural em português e não altera o conteúdo referencial.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A coordenação hebraica foi preservada de modo fluente por meio de “bem como”. Não foram necessárias notas, pois as alternativas lexicais não criam ambiguidade relevante para o leitor.
