base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/036.yaml
  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: pt
  text: Arão e seus filhos fizeram tudo o que Yahweh havia ordenado por meio de Moisés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Moisés”, expressão que significa “por meio de Moisés” ou “tendo Moisés como mediador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fizeram
  rationale: O verbo עשה resume de modo direto a obediência de Arão e seus filhos; “fizeram” é natural em português e concorda com o sujeito composto.
- source_word: וּבָנָיו
  choice: e seus filhos
  rationale: No contexto sacerdotal, בנים designa especificamente os filhos homens de Arão.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: tudo
  rationale: דברים pode significar palavras, assuntos ou coisas. Aqui se refere ao conjunto das instruções executadas; “tudo” comunica isso de modo claro e natural.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto expressa naturalmente que a ordem precedeu seu cumprimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: A expressão hebraica literalmente “pela mão de Moisés” é um idioma de agência ou mediação; “por meio de Moisés” conserva esse sentido em português corrente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio divino; “Yahweh” o preserva sem substituí-lo pelo título tradicional.
- issue: Papel de Moisés em בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  alternative: pela mão de Moisés
  rationale: A formulação apresenta Moisés como agente ou mediador da ordem divina sem definir além do que o idioma hebraico permite.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão narrativa do hebraico e explicita em nota o idioma semítico.
