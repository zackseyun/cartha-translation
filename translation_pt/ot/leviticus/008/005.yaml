  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: pt
  text: 'Então Moisés disse à congregação: “Isto é o que Yahweh ordenou que fosse feito.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Isto é o que Yahweh ordenou fazer”, traduzindo o infinitivo hebraico de modo mais literal. No contexto, ele também pode ser entendido em sentido impessoal: “que fosse feito”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa essa progressão de modo natural em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל הָעֵדָה
  choice: à congregação
  rationale: עֵדָה designa aqui a comunidade israelita reunida. “Congregação” conserva o sentido coletivo e solene adequado ao contexto cultual.
- source_word: זֶה הַדָּבָר
  choice: Isto é o que
  rationale: Embora a estrutura seja literalmente “esta é a coisa”, a formulação escolhida comunica o mesmo sentido em português atual, sem rigidez desnecessária.
- source_word: צִוָּה
  choice: ordenou
  rationale: O perfeito hebraico aponta para uma ordem dada anteriormente e agora prestes a ser cumprida; o pretérito perfeito é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לַעֲשׂוֹת
  choice: que fosse feito
  rationale: 'O infinitivo hebraico tem forma ativa, mas neste contexto admite sentido impessoal: trata-se daquilo que foi ordenado e deve ser executado. A construção passiva é clara e idiomática em português.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio, sem substituí-lo pelo título tradicional.
- issue: Agente implícito da ação ordenada
  choice: Não explicitar quem deve executar a ordem
  alternative: Acrescentar “vocês” ou identificar Moisés e Arão como agentes
  rationale: O hebraico não nomeia o agente em לַעֲשׂוֹת. A formulação impessoal preserva essa abertura e evita acrescentar uma identificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A tradução mantém o tom narrativo e comunitário do contexto sacerdotal.
