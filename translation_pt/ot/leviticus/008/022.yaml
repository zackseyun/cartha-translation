base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: pt
  text: Então Moisés apresentou o segundo carneiro[a], o carneiro da ordenação, e Arão e seus filhos puseram as mãos sobre a cabeça do carneiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o carneiro da consagração”. A expressão hebraica é um termo sacerdotal técnico referente ao rito de investidura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Então Moisés trouxe para perto
  rationale: O hifil de קרב significa fazer chegar perto ou apresentar. “Trouxe para perto” preserva o sentido ritual; “Moisés” explicita o sujeito recuperado do contexto imediato, evitando ambiguidade pouco natural em português.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: o segundo carneiro
  rationale: אַיִל significa “carneiro”, e הַשֵּׁנִי é o ordinal “segundo”, identificando o animal na sequência ritual.
- source_word: אֵיל הַמִּלֻּאִים
  choice: o carneiro da ordenação
  rationale: מִלֻּאִים relaciona-se literalmente a “enchimentos”, mas funciona aqui como termo sacerdotal técnico para a investidura no ofício. “Ordenação” comunica com clareza essa instalação sacerdotal.
- source_word: וַיִּסְמְכוּ
  choice: e ... puseram
  rationale: Em contexto sacrificial, סמך descreve o ato de pôr ou apoiar as mãos sobre a oferta. “Puseram” é claro, natural e mantém o gesto ritual.
- source_word: אֶת יְדֵיהֶם
  choice: as mãos
  rationale: Mantém o plural do hebraico e, com o possuidor expresso no sujeito composto, soa natural em português.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: sobre a cabeça do carneiro
  rationale: Tradução direta da locução preposicional, preservando com clareza o gesto sacrificial.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Arão e seus filhos
  rationale: בָּנִים designa aqui os filhos homens de Arão que participavam da ordenação sacerdotal; a tradução é precisa quanto ao contexto.
theological_decisions:
- issue: Tradução do termo sacerdotal técnico מִלֻּאִים no contexto ritual
  choice: o carneiro da ordenação
  alternative: o carneiro da consagração
  rationale: As duas opções são defensáveis. “Ordenação” destaca a instalação de Arão e seus filhos no ofício sacerdotal, enquanto a nota conserva “consagração” como alternativa legítima.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A formulação preserva a sequência narrativa e o caráter ritual do texto, sem recorrer a literalismo obscuro.
