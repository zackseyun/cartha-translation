base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: pt
  text: Pôs sobre ele o peitoral[a] e colocou no peitoral o Urim e o Tumim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a peça do peito”. O hebraico חֹשֶׁן se refere à peça usada no peito pelo sumo sacerdote; aqui, “peitoral” não indica uma peça de armadura.
    reason: lexical_alternative
  - marker: b
    text: “Urim” e “Tumim” são termos rituais hebraicos tradicionalmente transliterados. Sua forma exata e seu modo de uso são incertos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Pôs
  rationale: שׂוּם significa pôr, colocar ou assentar. “Pôs” é natural e conciso no contexto da investidura cerimonial.
- source_word: עָלָיו
  choice: sobre ele
  rationale: A preposição עַל com sufixo tem sentido espacial e se refere a Arão, sobre quem a peça foi posta.
- source_word: הַחֹשֶׁן
  choice: o peitoral
  rationale: חֹשֶׁן designa a peça usada no peito pelo sumo sacerdote. “Peitoral” é a forma portuguesa corrente e permite manter o mesmo termo nas duas ocorrências.
- source_word: וַיִּתֵּן
  choice: colocou
  rationale: נָתַן pode significar dar, pôr ou colocar. Aqui descreve a introdução dos objetos no peitoral; “colocou” expressa naturalmente esse sentido.
- source_word: אֶל הַחֹשֶׁן
  choice: no peitoral
  rationale: Embora אֶל frequentemente signifique “para”, neste contexto indica que os objetos foram depositados no interior ou compartimento do peitoral. “No peitoral” é idiomático e não especifica além do necessário a sua construção física.
- source_word: הָאוּרִים
  choice: o Urim
  rationale: אוּרִים é um termo ritual técnico de forma e funcionamento incertos. A transliteração preserva a designação hebraica sem impor a interpretação etimológica “luzes”.
- source_word: הַתֻּמִּים
  choice: o Tumim
  rationale: תֻּמִּים é o termo ritual técnico emparelhado com Urim. A transliteração evita traduções especulativas como “perfeições” e representa o artigo hebraico com o artigo português.
theological_decisions:
- issue: Tradução dos objetos sacerdotais אוּרִים וְתֻּמִּים
  choice: Transliterar como “o Urim e o Tumim”
  alternative: “as luzes e as perfeições” ou “os sortes sagrados”
  rationale: A natureza exata e o modo de uso desses objetos permanecem incertos, embora estivessem ligados à consulta sacerdotal. A transliteração conserva a especificidade do texto e sua ambiguidade histórica sem adotar uma explicação disputada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação simples acompanha a sequência narrativa hebraica. “Peitoral” preserva a terminologia bíblica corrente, enquanto a nota evita a possível associação indevida com armadura.
