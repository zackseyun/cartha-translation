  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”. Uma forma alternativa é “Jeová”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar. “Então” expressa naturalmente a sequência em português, e “falou” traduz דּבר sem confundi-lo com a fórmula introdutória לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל marca o destinatário da fala; “a Moisés” é uma construção natural e fiel em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Neste contexto, o infinitivo formulaico introduz a fala direta que começa no versículo seguinte. Os dois-pontos cumprem essa função com maior naturalidade em português do que o literal “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo silenciosamente pelo título tradicional, sem excluir outras formas conhecidas, registradas em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A pontuação introduz naturalmente o discurso dos versículos seguintes.
source_grounding:
  english_pob_role: consult_only
