  text: וַ/יִּקַּ֞ח אֶת הַ/חֵ֣לֶב וְ/אֶת הָֽ/אַלְיָ֗ה וְ/אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וְ/אֵ֖ת שׁ֥וֹק הַ/יָּמִֽין־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: pt
  text: Então ele pegou a gordura, a cauda gorda, toda a gordura que estava sobre as vísceras, o lóbulo do fígado[a], os dois rins com a gordura deles e a coxa direita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o apêndice do fígado”. O termo hebraico se refere a uma parte específica retirada durante o procedimento sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ele pegou
  rationale: O waw consecutivo dá prosseguimento à sequência narrativa; “Então” expressa essa progressão com naturalidade.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: É o equivalente comum para as porções gordurosas reservadas no procedimento sacrificial.
- source_word: הָאַלְיָה
  choice: a cauda gorda
  rationale: Designa especificamente a cauda adiposa de certas ovelhas, e não apenas uma cauda em sentido genérico.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: toda a gordura que estava sobre as vísceras
  rationale: קֶרֶב refere-se aqui aos órgãos internos; “vísceras” é concreto, atual e apropriado ao contexto anatômico sacrificial.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: o lóbulo do fígado
  rationale: A expressão indica uma parte específica do fígado removida no sacrifício; “lóbulo” oferece uma formulação anatômica clara, embora a identificação exata admita outra descrição.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: os dois rins
  rationale: Tradução anatômica direta que preserva explicitamente a quantidade.
- source_word: חֶלְבְּהֶן
  choice: com a gordura deles
  rationale: Preserva a relação possessiva entre os rins e a gordura associada a eles, em português claro.
- source_word: שׁוֹק הַיָּמִין
  choice: a coxa direita
  rationale: שׁוֹק designa a porção da perna, frequentemente entendida como coxa no contexto do corte sacrificial.
