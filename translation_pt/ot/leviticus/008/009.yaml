  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Pôs o turbante na cabeça de Arão e, na parte da frente do turbante, colocou a lâmina de ouro, a coroa sagrada[a], assim como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o diadema sagrado”.'
    reason: Alternativa lexical para נֵזֶר הַקֹּדֶשׁ; “diadema” expressa mais especificamente um ornamento régio ou cerimonial para a cabeça, mas é menos comum que “coroa”.
lexical_decisions:
- source_word: מִּצְנֶפֶת
  choice: turbante
  rationale: Designa a cobertura distintiva usada pelo sumo sacerdote. “Turbante” é claro, corrente e adequado ao contexto das vestes sacerdotais.
- source_word: אֶל מוּל פָּנָיו
  choice: na parte da frente do turbante
  rationale: O idioma indica o lado frontal da cobertura, onde o ornamento foi fixado, e não apenas uma posição diante do rosto de Arão.
- source_word: צִיץ
  choice: lâmina
  rationale: Neste contexto sacerdotal, refere-se ao ornamento de ouro fixado ao turbante. “Lâmina de ouro” comunica de modo natural uma peça fina e metálica, em consonância com Êxodo 28:36.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: a coroa sagrada
  rationale: A expressão, em aposição, identifica a lâmina de ouro como emblema sagrado da consagração sacerdotal. “Coroa sagrada” é acessível e mantém de perto a imagem hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: Pôs ... colocou
  rationale: A leve variação evita repetição pesada em português, sem alterar o fato de que o mesmo verbo hebraico descreve as duas ações.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: assim como Yahweh havia ordenado a Moisés
  rationale: “Assim como” ressalta a plena conformidade da ação com a ordem divina; o mais-que-perfeito composto situa naturalmente a ordem antes de sua execução.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança, sem substituí-lo por um título.
- issue: Relação entre צִיץ e נֵזֶר הַקֹּדֶשׁ
  choice: “a coroa sagrada” como aposição explicativa de “a lâmina de ouro”
  alternative: Tratar os termos como dois objetos distintos
  rationale: A sintaxe apresenta “a coroa sagrada” como outra designação da lâmina de ouro, não como uma segunda peça separada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Na cabeça de Arão” explicita o referente do pronome hebraico conforme o contexto imediato. O marcador da nota foi colocado junto à expressão a que a alternativa lexical se refere.
