source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: pt
  text: E vocês permanecerão à entrada da tenda do encontro, dia e noite, durante sete dias, e cumprirão o encargo de Yahweh, para que não morram[a], pois assim me foi ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não morrerão”; também pode ser entendido como “para não morrerem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶתַח אֹהֶל מוֹעֵד
  choice: À entrada da tenda do encontro
  rationale: פֶתַח indica a entrada ou abertura; a formulação preserva o sentido locativo e verte naturalmente a designação cultual אֹהֶל מוֹעֵד.
- source_word: תֵּשְׁבוּ
  choice: vocês permanecerão
  rationale: Embora ישב possa significar literalmente sentar-se ou habitar, neste contexto ritual expressa a obrigação de permanecer no lugar continuamente.
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: dia e noite durante sete dias
  rationale: Mantém a expressão temporal contínua e explicita a duração de modo idiomático em português.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: e cumprirão o encargo de Yahweh
  rationale: A construção שמר + משמרת refere-se a observar fielmente uma incumbência prescrita. “Cumprir o encargo” conserva o caráter ritual sem soar artificial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְלֹא תָמֻתוּ
  choice: para que não morram
  rationale: Expressa naturalmente a consequência evitada pela obediência, embora a coordenação hebraica também permita uma formulação mais literal.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: pois assim me foi ordenado
  rationale: Preserva a voz passiva e mostra que Moisés comunica uma ordem que ele próprio recebeu.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, e a transliteração preserva sua condição de nome pessoal sem importar uma substituição tradicional por título.
- issue: Relação sintática da advertência de morte
  choice: para que não morram
  alternative: e não morrerão; para não morrerem; do contrário, morrerão
  rationale: A formulação escolhida comunica propósito ou resultado evitado e mantém a advertência ligada à obediência. A nota registra a ambiguidade real da coordenação hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural e terminologia cultual clara. A ordem dos elementos foi mantida próxima do hebraico sem sacrificar a fluência.
