base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: pt
  text: Então, Moisés tomou o óleo da unção, ungiu o tabernáculo e tudo o que havia nele e os consagrou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os santificou” ou “os tornou santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então Moisés pegou
  rationale: O wayyiqtol dá continuidade à sequência narrativa. “Então” expressa essa progressão em português natural, e “pegou” preserva o sentido simples do verbo.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: o óleo da unção
  rationale: A construção designa o óleo usado para ungir. A formulação é corrente e não acrescenta a ideia de “sagrado”, que não está explícita aqui.
- source_word: וַיִּמְשַׁח
  choice: ungiu
  rationale: É o verbo cultual padrão para aplicar óleo a fim de separar algo para uso sagrado; “ungiu” preserva tanto o ato ritual quanto sua significação.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Termo técnico estabelecido para a estrutura do santuário no contexto de Êxodo–Levítico.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: tudo o que havia nele
  rationale: Abrange o conteúdo e os utensílios do tabernáculo, com formulação clara e próxima do hebraico.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: e os consagrou
  rationale: No contexto sacerdotal, קדשׁ indica separar como santo. O pronome plural retoma conjuntamente o tabernáculo e tudo o que nele havia.
theological_decisions:
- issue: Tradução de קדשׁ em contexto ritual sacerdotal
  choice: consagrou
  alternative: santificou; tornou santos
  rationale: “Consagrou” comunica com clareza a separação ritual para uso sagrado, sem impor uma nuance doutrinária posterior. A nota preserva as alternativas lexicais legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com terminologia cultual estabelecida. Mantém a sequência narrativa do hebraico e explicita por nota a amplitude semântica de קדשׁ.
