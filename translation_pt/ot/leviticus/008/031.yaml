  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: pt
  text: 'Moisés disse a Arão e a seus filhos: “Cozinhem a carne à entrada da tenda do encontro. Ali vocês a comerão, bem como o pão que está no cesto das ofertas de ordenação[a], conforme ordenei, dizendo: ‘Arão e seus filhos devem comê-la.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cesto das ofertas de consagração”. O termo hebraico se refere às ofertas ligadas ao rito de instalação dos sacerdotes.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: Cozinhem
  rationale: O verbo pode significar cozinhar, especialmente em água, no contexto sacrificial. “Cozinhem” é natural e claro em português moderno; evita a possível ambiguidade gráfica de “cozam” e a estranheza de “fervam a carne”.
- source_word: הַבָּשָׂר
  choice: a carne
  rationale: No contexto culinário e sacrificial, “carne” expressa naturalmente a parte comestível do animal.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Preserva tanto o local ritual indicado por פֶּתַח quanto a designação cultual אֹהֶל מוֹעֵד em linguagem clara.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: Ali vocês a comerão
  rationale: A colocação inicial de “Ali” mantém a ênfase espacial de שָׁם; “a” retoma naturalmente “a carne”.
- source_word: הַלֶּחֶם
  choice: o pão
  rationale: É a correspondência direta e contextualmente adequada para o alimento que acompanha o rito.
- source_word: סַל הַמִּלֻּאִים
  choice: cesto das ofertas de ordenação
  rationale: מִלֻּאִים designa aqui o rito de instalação sacerdotal. A expressão comunica a função ritual em português atual, sem sugerir estruturas eclesiásticas posteriores.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: conforme ordenei, dizendo
  rationale: Mantém a estrutura formal do hebraico e introduz de modo claro a ordem citada.
- source_word: יֹאכְלֻהוּ
  choice: devem comê-la
  rationale: O imperfeito, no discurso citado, tem força diretiva. “Devem” comunica obrigação sem tratá-lo como simples previsão futura; o pronome feminino retoma naturalmente “a carne” ou, de modo coletivo, a porção prescrita.
theological_decisions:
- issue: Sentido de מִלֻּאִים no rito de instalação sacerdotal
  choice: ofertas de ordenação
  alternative: ofertas de consagração
  rationale: “Ordenação” explicita a instalação de Arão e seus filhos no sacerdócio, enquanto “consagração” também é lexicalmente possível e foi preservada em nota. A escolha não importa uma doutrina posterior de ordenação.
- issue: Força modal de יֹאכְלֻהוּ
  choice: devem comê-la
  alternative: a comerão
  rationale: No contexto de uma ordem ritual citada, a forma verbal expressa instrução ou obrigação, embora a forma hebraica também possa ser vertida com um futuro de valor diretivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tenda do encontro” mantém o nome cultual de forma transparente. O tratamento por “vocês” evita a forma regional “vós” e concorda com o plural dirigido a Arão e seus filhos.
