  terminology: “Tenda do encontro”, “carne”, “pão” e “ofertas de ordenação” são escolhas consistentes e compreensíveis. A nota apresenta de modo útil “ofertas de consagração” como alternativa e explica o âmbito ritual sem impor uma leitura confessional.
