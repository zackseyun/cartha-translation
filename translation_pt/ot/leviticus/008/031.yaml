  source_fidelity: 'O texto preserva adequadamente a sequência e as relações do hebraico: a ordem dirigida a Arão e seus filhos, o preparo da carne à entrada da tenda do encontro, o consumo naquele local da carne e do pão, e a ordem citada. “Cozinhem” é um pouco mais amplo que o sentido frequentemente específico de “cozer/ferventar” de בָּשַׁל neste contexto, mas é uma opção semanticamente defensável e idiomática em português moderno.'
