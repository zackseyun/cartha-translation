  text: Então Moisés fez Arão e seus filhos se aproximarem e os lavou com água.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fez ... se aproximarem
  rationale: 'O hifil de קרב tem sentido causativo: fazer chegar perto, trazer para perto ou apresentar. A formulação escolhida preserva o movimento concreto no cenário ritual e soa natural em português.'
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma bíblica tradicional e amplamente reconhecida do nome em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: Neste contexto de ordenação sacerdotal, בנים designa especificamente os filhos homens de Arão.
- source_word: וַיִּרְחַץ
  choice: lavou
  rationale: רחץ significa lavar ou banhar. “Lavou” é natural e não especifica além do que o texto declara a extensão do ato ritual.
- source_word: אֹתָם
  choice: os
  rationale: Pronome objeto que retoma conjuntamente Arão e seus filhos.
- source_word: בַּמָּיִם
  choice: com água
  rationale: A preposição ב indica aqui o meio empregado; “com água” é a expressão idiomática mais natural em português.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz a narrativa avançar; “Então” comunica com clareza a sequência dos acontecimentos.
