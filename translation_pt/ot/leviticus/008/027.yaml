base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: pt
  text: Ele colocou todas as porções nas palmas das mãos de Arão e nas palmas das mãos de seus filhos[a] e as moveu como oferta movida diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre as palmas das mãos de Arão e sobre as palmas das mãos de seus filhos”. A preposição hebraica significa literalmente “sobre”, embora o sentido seja que as porções foram colocadas nas mãos abertas.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: colocou
  rationale: Neste contexto ritual, נתן descreve a colocação física das porções nas mãos, sem necessariamente indicar transferência de posse.
- source_word: אֶת הַכֹּל
  choice: todas essas porções
  rationale: A expressão retoma coletivamente os elementos mencionados no versículo anterior. A formulação plural também esclarece o referente do pronome plural אֹתָם.
- source_word: עַל כַּפֵּי
  choice: nas palmas das mãos de
  rationale: כַּף designa a palma ou a mão. Embora עַל signifique literalmente “sobre”, “nas palmas das mãos” é natural em português e comunica que as porções foram depositadas nas mãos abertas.
- source_word: וַיָּנֶף אֹתָם
  choice: e as moveu
  rationale: O hifil de נוף designa o gesto ritual de mover ou apresentar a oferta; “as” retoma claramente as porções, não Arão e seus filhos.
- source_word: תְּנוּפָה
  choice: como oferta movida
  rationale: Mantém o termo sacrificial técnico e reproduz, tanto quanto possível, a ligação lexical entre o verbo נוף e o substantivo תְּנוּפָה.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa a ação ritual realizada na presença de Deus e translitera diretamente o nome divino.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração “Yahweh” representa diretamente o nome divino e segue a orientação do projeto sem inserir uma substituição reverencial.
- issue: Sentido de בָנָיו
  choice: seus filhos
  alternative: seus descendentes; seus filhos e filhas
  rationale: O contexto da ordenação sacerdotal trata especificamente dos filhos homens de Arão; a tradução preserva essa especificidade.
- issue: Sentido ritual de נוף / תְּנוּפָה
  choice: moveu como oferta movida
  alternative: apresentou como oferta de apresentação
  rationale: A escolha conserva a ação física indicada pela raiz hebraica sem definir de modo excessivo a forma exata do gesto ritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Oferta movida” mantém a terminologia ritual tradicional; a repetição de “moveu” e “movida” reflete deliberadamente a repetição da mesma raiz no hebraico.
