base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: pt
  text: E reúna toda a congregação à entrada da tenda do encontro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reúna toda a assembleia”. O termo hebraico עֵדָה pode ser traduzido como “congregação”, “assembleia” ou “comunidade”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: E
  rationale: וְ liga esta ordem à anterior; אֵת é o marcador do objeto direto definido e não precisa ser traduzido em português.
- source_word: כָּל
  choice: toda
  rationale: 'Com o substantivo definido, כָּל expressa totalidade: a congregação inteira deve ser reunida.'
- source_word: הָ/עֵדָה
  choice: a congregação
  rationale: עֵדָה designa aqui a comunidade reunida de Israel. “Congregação” preserva o sentido coletivo e o contexto cultual, embora “assembleia” também seja possível.
- source_word: הַקְהֵל
  choice: reúna
  rationale: O imperativo hifil de קהל significa fazer reunir. “Reúna” é natural, claro e mantém a força da ordem dirigida a Moisés.
- source_word: אֶל
  choice: à
  rationale: Diante de פֶּתַח, a construção indica o lugar para o qual a congregação deve ser reunida; em português, “à entrada” expressa isso de modo idiomático.
- source_word: פֶּתַח
  choice: entrada
  rationale: פֶּתַח refere-se à abertura ou ao acesso da tenda; “entrada” é claro e natural em português moderno.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: A expressão designa a tenda em que ocorre o encontro determinado com Deus. “Tenda do encontro” é transparente e evita tornar explícita uma interpretação adicional.
