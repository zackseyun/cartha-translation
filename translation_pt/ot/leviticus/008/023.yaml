- from: Ele o abateu; então Moisés pegou um pouco do sangue e o pôs no lóbulo[a] da orelha direita de Arão, no polegar da mão direita e no dedão do pé direito.
  to: Ele o abateu; então Moisés pegou um pouco do sangue dele e o pôs no lóbulo[a] da orelha direita de Arão, no polegar da mão direita de Arão e no dedo grande do pé direito de Arão.
  rationale: A revisão explicita a posse indicada por מִדָּמוֹ e a referência repetida a Arão nos três membros, evitando ambiguidade sem acrescentar interpretação. “Dedo grande do pé” substitui a formulação mais coloquial, preservando o sentido anatômico preciso e um registro internacionalmente neutro.
