base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: pt
  text: Ele o abateu; então Moisés pegou um pouco do sangue dele e o pôs no lóbulo[a] da orelha direita de Arão, no polegar da mão direita de Arão e no dedo grande do pé direito de Arão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: na ponta da orelha direita de Arão.'
    reason: Alternativa lexical para תְּנוּךְ אֹזֶן, cuja referência anatômica exata admite “lóbulo” ou “ponta”.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Ele o abateu
  rationale: Em contexto sacrificial, שׁחט indica abate ritual. O pronome objeto retoma naturalmente o carneiro mencionado no contexto, enquanto o sujeito implícito é mantido sem identificação adicional.
- source_word: מִדָּמוֹ
  choice: um pouco do sangue
  rationale: A preposição מִן indica que Moisés tomou uma porção do sangue, não necessariamente todo ele.
- source_word: תְּנוּךְ אֹזֶן
  choice: lóbulo da orelha
  rationale: A expressão designa uma extremidade externa da orelha; “lóbulo” é claro e natural, embora “ponta” também seja lexicalmente possível.
- source_word: הַיְמָנִית
  choice: direita / direito
  rationale: A concordância portuguesa exige formas adequadas a “orelha”, “mão” e “pé”, preservando a especificação do lado direito.
- source_word: בֹּהֶן יָדוֹ
  choice: polegar da mão
  rationale: בֹּהֶן, quando se refere à mão, designa especificamente o polegar.
- source_word: בֹּהֶן רַגְלוֹ
  choice: dedão do pé
  rationale: Quando se refere ao pé, בֹּהֶן designa o dedo grande. “Dedão do pé” é corrente, claro e amplamente compreensível em português.
- source_word: וַיִּתֵּן עַל
  choice: o pôs no
  rationale: A formulação traduz de modo direto e natural o ato de colocar o sangue sobre as partes indicadas.
theological_decisions:
- issue: Aplicação ritual do sangue sacrificial às extremidades de Arão
  choice: Descrever apenas o ato ritual narrado
  alternative: Acrescentar no texto uma explicação simbólica sobre consagração sacerdotal
  rationale: O versículo relata a ação sem explicar seu simbolismo; a tradução não deve inserir uma interpretação teológica ausente do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Abateu” preserva o contexto sacrificial sem recorrer a linguagem excessivamente técnica. O ponto e vírgula distingue o primeiro verbo, de sujeito implícito, da oração que nomeia Moisés. O marcador foi colocado junto de “lóbulo”, termo ao qual a nota lexical se refere.
