  revision_rationale: A revisão explicita a posse indicada por מִדָּמוֹ e a referência repetida a Arão nos três membros, evitando ambiguidade sem acrescentar interpretação. “Dedo grande do pé” substitui a formulação mais coloquial, preservando o sentido anatômico preciso e um registro internacionalmente neutro.
