  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: pt
  text: Então Moisés os tirou das mãos deles e os queimou sobre o altar, por cima do holocausto. Eram ofertas de ordenação[a], de aroma agradável; tratava-se de uma oferta feita pelo fogo[b] para Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de consagração”. O hebraico מִלֻּאִים é um termo técnico para as ofertas usadas no rito de instalação dos sacerdotes.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “oferta de alimento”, isto é, uma dádiva apresentada no altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: O verbo לקח expressa aqui a ação narrativa comum de tomar; “tomou” mantém a sequência ritual concreta.
- source_word: מֵעַל כַּפֵּיהֶם
  choice: das palmas das mãos deles
  rationale: Preserva a referência específica às palmas (כַּפִּים) sem perder a naturalidade em português.
- source_word: וַיַּקְטֵר
  choice: queimou
  rationale: No contexto sacrificial, o hifil de קטר indica fazer a oferta subir em fumaça no altar. “Queimou” é claro e natural, embora “fez subir em fumaça” seja mais explícito.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: A terminação direcional, junto ao verbo sacrificial, aponta para o altar como lugar onde as porções foram queimadas.
- source_word: עַל הָעֹלָה
  choice: em cima do holocausto
  rationale: עַל significa naturalmente “sobre”; a formulação comunica que as porções foram queimadas sobre o holocausto.
- source_word: מִלֻּאִים
  choice: oferta de ordenação
  rationale: Termo técnico ligado à instalação sacerdotal, literalmente associado a “encher as mãos”. “Ordenação” comunica a função ritual sem reproduzir literalmente uma expressão obscura.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Expressão sacrificial convencional que comunica aceitação ou agrado, preservando a imagem do aroma.
- source_word: אִשֶּׁה
  choice: oferta feita pelo fogo
  rationale: Mantém o sentido sacrificial técnico e a ligação lexical com o fogo, sem adotar como texto principal a interpretação mais específica “oferta de alimento”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה de modo reconhecível e coerente com a camada de consulta fornecida.
theological_decisions:
- issue: Sentido do termo técnico מִלֻּאִים
  choice: oferta de ordenação
  alternative: oferta de consagração
  rationale: O contexto é a instalação de Arão e seus filhos no sacerdócio. “Ordenação” explicita essa função, enquanto “consagração” permanece uma alternativa legítima e menos específica.
- issue: Sentido sacrificial de אִשֶּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A etimologia e o uso cultual sustentam uma oferta apresentada por meio do fogo. “Oferta de alimento” é uma interpretação possível da oferta como dádiva do altar, mas é mais específica do que o termo hebraico exige.
- issue: Imagem de לְרֵיחַ נִיחֹחַ
  choice: de aroma agradável
  alternative: de aroma apaziguador
  rationale: “Agradável” preserva a linguagem de aceitação divina sem definir de modo excessivo como o aroma atua; “apaziguador” poderia sugerir uma explicação teológica mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “palmas das mãos” conserva a precisão concreta do hebraico; “holocausto” mantém o termo sacrificial tradicional e ainda corrente. Os marcadores foram colocados junto aos termos que efetivamente explicam.
