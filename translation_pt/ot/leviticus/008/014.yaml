base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: pt
  text: Então ele apresentou o novilho da oferta pelo pecado[a], e Arão e seus filhos puseram as mãos sobre a cabeça do novilho da oferta pelo pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trouxe para perto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: trouxe
  rationale: No hifil, נגשׁ indica fazer aproximar ou apresentar. “Trouxe” é natural em português e, no contexto ritual, comunica que Moisés fez o animal chegar para a apresentação; a nota registra alternativas mais explícitas.
- source_word: פַּר
  choice: novilho
  rationale: Em contexto sacrificial, פַּר designa um bovino macho, frequentemente jovem. “Novilho” é a forma tradicional, clara e idiomática em português para esse animal sacrificial.
- source_word: הַחַטָּאת
  choice: oferta pelo pecado
  rationale: Aqui חַטָּאת não designa simplesmente o pecado, mas o sacrifício relacionado ao pecado. “Oferta pelo pecado” preserva o sentido cultual sem explicar além do texto o mecanismo teológico do rito.
- source_word: וַיִּסְמֹךְ
  choice: puseram
  rationale: No ritual sacrificial, סמך descreve o ato de apoiar ou colocar a mão sobre o animal. “Puseram as mãos” é natural e descritivo, sem especificar indevidamente o grau de pressão.
- source_word: יְדֵיהֶם
  choice: as mãos
  rationale: Mantém o plural hebraico e expressa naturalmente em português o gesto realizado por Arão e seus filhos.
- source_word: עַל רֹאשׁ
  choice: sobre a cabeça de
  rationale: Equivalência espacial direta e digna, adequada ao contexto ritual.
theological_decisions:
- issue: Sentido da imposição das mãos no ritual sacrificial
  choice: Descrever apenas o gesto, sem explicar seu mecanismo teológico.
  alternative: Interpretá-lo explicitamente como identificação com a oferta, transferência de culpa ou designação do animal para o sacrifício.
  rationale: O versículo narra a ação, mas não define seu significado teológico específico. A tradução conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Arão”, “novilho” e “oferta pelo pecado” mantêm terminologia bíblica amplamente reconhecível; a sintaxe permanece próxima do hebraico sem soar artificial.
