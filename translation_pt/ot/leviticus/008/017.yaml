  text: וְ/אֶת הַ/פָּ֤ר וְ/אֶת עֹר/וֹ֙ וְ/אֶת בְּשָׂר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Mas queimou no fogo, fora do acampamento, o novilho[a], com o couro, a carne e os excrementos[b], exatamente como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “touro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “esterco”. O hebraico se refere especificamente a excrementos, e não a resíduos em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּר
  choice: o novilho
  rationale: פַּר designa um bovino macho, muitas vezes jovem, oferecido em sacrifício. “Novilho” é corrente e natural neste contexto; a alternativa “touro” é registrada em nota para preservar a amplitude lexical.
- source_word: עֹרוֹ
  choice: o couro
  rationale: עוֹר significa pele ou couro. Em referência à parte retirada de um animal, “couro” é a expressão mais natural e precisa em português.
- source_word: בְּשָׂרוֹ
  choice: a carne
  rationale: בָּשָׂר significa carne. A escolha mantém o sentido concreto da carcaça sem recorrer ao menos natural “sua carne” em cada item da lista.
- source_word: פִּרְשׁוֹ
  choice: os excrementos
  rationale: פֶּרֶשׁ refere-se especificamente ao conteúdo excrementício, não a resíduos em geral. “Excrementos” é claro, preciso e adequado ao registro; “esterco” permanece como alternativa lexical.
- source_word: שָׂרַף בָּאֵשׁ
  choice: queimou no fogo
  rationale: A formulação conserva tanto o verbo שׂרף, “queimar”, quanto a menção explícita ao fogo, sem usar o termo técnico “incinerou”.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: Tradução direta e idiomática da expressão espacial hebraica.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: exatamente como ... havia ordenado
  rationale: כַּאֲשֶׁר expressa conformidade entre a ação e a ordem. “Exatamente como” comunica essa correspondência, e o mais-que-perfeito situa naturalmente a ordem antes da execução.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: o novilho, com o couro, a carne e os excrementos
  rationale: A construção portuguesa preserva a enumeração cumulativa dos objetos sem reproduzir de modo rígido a repetição hebraica da conjunção e do marcador de objeto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico apresenta o tetragrama como nome próprio. “Yahweh” o representa diretamente e evita substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem dos constituintes foi ajustada para evitar uma abertura ambígua e manter unidos o animal e suas partes. O sujeito permanece implícito, como no hebraico, sendo recuperável do contexto.
