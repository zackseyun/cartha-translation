  text: וַ/יַּקְרֵ֕ב אֵ֖ת אֵ֣יל הָ/עֹלָ֑ה וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: pt
  text: Então Moisés apresentou o carneiro do holocausto, e Arão e seus filhos puseram as mãos sobre a cabeça do carneiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apoiaram as mãos”. O verbo hebraico descreve o gesto ritual de colocar ou apoiar as mãos sobre o animal destinado ao sacrifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Então Moisés apresentou
  rationale: O hifil de קרב significa fazer chegar, trazer para perto ou apresentar. “Apresentou” expressa naturalmente o ato ritual em português; “Moisés” explicita o referente do sujeito, claro no contexto imediato.
- source_word: אֵיל הָעֹלָה
  choice: o carneiro do holocausto
  rationale: אֵיל designa o carneiro, e עֹלָה é o termo sacrificial tradicionalmente vertido por “holocausto”, isto é, a oferta totalmente queimada. A construção com “do” acompanha de perto a relação hebraica e indica o animal destinado a esse sacrifício.
- source_word: וַיִּסְמְכוּ ... אֶת יְדֵיהֶם
  choice: puseram as mãos
  rationale: No contexto sacrificial, סמך descreve o gesto ritual de apoiar, colocar ou impor as mãos sobre o animal. “Puseram as mãos” é claro e atual, sem acrescentar ao gesto um significado teológico não declarado pelo versículo.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: sobre a cabeça do carneiro
  rationale: Tradução direta e natural da locução preposicional, preservando a repetição de “carneiro” presente no hebraico.
theological_decisions:
- issue: Sentido do gesto ritual das mãos sobre o animal
  choice: puseram as mãos sobre a cabeça do carneiro
  alternative: apoiaram as mãos sobre a cabeça do carneiro; impuseram as mãos sobre a cabeça do carneiro
  rationale: A tradução descreve o gesto sem afirmar transferência de culpa, identificação ou outro significado teológico que este versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Holocausto” preserva a terminologia bíblica sacrificial amplamente reconhecida. O nome “Moisés” foi explicitado para evitar a ambiguidade de um pronome sem antecedente dentro do versículo isolado.
