id: LEV.8.33
reference: Leviticus 8:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: pt
  text: Não saiam da entrada da tenda do encontro durante sete dias, até se completarem os dias da ordenação de vocês, pois durante sete dias ele os ordenará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “encherá a mão de vocês”, expressão hebraica para ordenar ou instalar alguém no serviço sacerdotal.
    reason: Explica o idioma técnico sacerdotal preservando sua formulação literal para consulta.
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: da entrada
  rationale: פֶּתַח designa a abertura ou entrada; “entrada” é claro e natural em português. A conjunção inicial não precisa ser reproduzida mecanicamente no começo de uma instrução contínua.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Reproduz de modo transparente a designação hebraica do santuário, sem recorrer ao termo tradicional menos imediatamente compreensível “tabernáculo”.
- source_word: לֹא תֵצְאוּ
  choice: Não saiam
  rationale: O imperfeito negado tem força de proibição. O imperativo negativo comunica essa força com naturalidade em português moderno.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A preposição “durante” explicita naturalmente a duração associada tanto à permanência quanto ao processo de ordenação.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: até se completarem os dias da ordenação de vocês
  rationale: Expressa o limite temporal e o sentido de conclusão de מלא sem reproduzir a construção nominal hebraica de maneira artificial. מִלֻּאִים é termo técnico para a instalação sacerdotal.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição em registro digno e corrente.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: ele os ordenará
  rationale: A expressão literalmente ligada a “encher a mão” é um idioma técnico de instalação no sacerdócio. A tradução no corpo do texto comunica seu sentido, enquanto a nota preserva a forma concreta do hebraico. O pronome “ele” mantém o sujeito masculino singular não nomeado no versículo.
theological_decisions:
- issue: Expressão sacerdotal מלא את־יד
  choice: Traduzir no texto como “ele os ordenará”, com a forma literal em nota.
  alternative: “ele encherá a mão de vocês” ou “ele os instalará”
  rationale: A tradução idiomática evita uma frase opaca em português, sem apagar a imagem ritual hebraica, que é registrada na nota. “Ordenará” também mantém a ligação com “ordenação” na oração anterior.
- issue: Sujeito de יְמַלֵּא
  choice: Manter “ele” sem identificar o referente.
  alternative: Explicitar “Moisés” ou “o SENHOR”
  rationale: A forma verbal indica um sujeito masculino singular, mas este versículo não o nomeia. Explicitar um referente resolveria uma ambiguidade contextual que o hebraico preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento brasileiras de leitura natural. A sintaxe foi alisada sem eliminar a repetição temática entre os sete dias e a ordenação.
