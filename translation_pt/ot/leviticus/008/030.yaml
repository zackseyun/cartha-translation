  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: pt
  text: Então Moisés pegou um pouco do óleo da unção e do sangue que estava sobre o altar e os aspergiu sobre Arão, sobre suas vestes, sobre seus filhos e sobre as vestes de seus filhos que estavam com ele. Assim, consagrou Arão, suas vestes, seus filhos e as vestes de seus filhos que estavam com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: pegou um pouco do óleo ... e do sangue
  rationale: O verbo significa “pegar/tomar”, e as duas ocorrências de מִן indicam que Moisés tomou uma porção de cada substância. A formulação é natural em português e não sugere que ele tenha tomado todo o óleo ou todo o sangue.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: do óleo da unção
  rationale: Mantém a expressão cultual hebraica com uma formulação consagrada e clara em português moderno.
- source_word: וּמִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: e do sangue que estava sobre o altar
  rationale: A oração relativa reproduz diretamente אֲשֶׁר; “sobre o altar” preserva a relação locativa expressa por עַל.
- source_word: וַיַּז
  choice: e os aspergiu
  rationale: O hifil de נזה designa a aspersão ritual. O pronome plural retoma naturalmente, em português, o óleo e o sangue mencionados como duas substâncias, sem afirmar explicitamente que fossem uma mistura.
- source_word: בְּגָדָיו
  choice: suas vestes
  rationale: “Vestes” corresponde ao sentido de בֶּגֶד e mantém o registro ritual digno sem especificar indevidamente vestimentas sacerdotais técnicas.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O masculino plural refere-se especificamente aos filhos homens de Arão envolvidos no rito sacerdotal.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: as vestes de seus filhos que estavam com ele
  rationale: A expressão אִתּוֹ liga-se mais naturalmente aos filhos, não às vestes. A oração relativa elimina uma possível leitura absurda em português, preservando o sentido de que os filhos estavam com Arão.
- source_word: וַיְקַדֵּשׁ
  choice: Assim, consagrou
  rationale: No contexto da instalação sacerdotal, קדשׁ indica separar como santo para o serviço sagrado. “Consagrou” comunica esse sentido ritual em português corrente.
theological_decisions:
- issue: Sentido de קדשׁ no rito de instalação sacerdotal
  choice: consagrou
  alternative: santificou / tornou santo
  rationale: “Consagrou” expressa a separação ritual de Arão, seus filhos e suas vestes para o serviço sagrado, sem introduzir categorias doutrinárias posteriores.
- issue: Referência de gênero em בָּנָיו
  choice: seus filhos
  alternative: seus descendentes / suas crianças
  rationale: O texto se refere especificamente aos filhos homens de Arão que participavam da instalação sacerdotal; a tradução mantém essa referência explícita.
- issue: Número do objeto implícito de וַיַּז
  choice: os aspergiu
  alternative: aspergiu isso / aspergiu a mistura
  rationale: O hebraico deixa o objeto implícito após mencionar óleo e sangue. O plural português retoma ambas as substâncias sem resolver a ambiguidade afirmando que formavam uma mistura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A repetição de “sobre” e da lista final foi preservada por seu valor ritual e enfático. Não se acrescentou nota, pois a alternativa “santificou” para וַיְקַדֵּשׁ não constitui uma variante textual nem altera substancialmente o sentido no contexto.
