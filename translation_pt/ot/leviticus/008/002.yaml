reference: Leviticus 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: pt
  text: Tome Arão e, com ele, seus filhos, as vestes, o óleo da unção, o novilho da oferta pelo pecado[a], os dois carneiros e o cesto de pães sem fermento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o novilho da oferta de purificação”. O termo hebraico pode designar a oferta relacionada ao pecado e à purificação ritual.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Tome
  rationale: Imperativo masculino singular de לקח. “Tome” preserva a forma direta da ordem e é natural neste contexto ritual, sem acrescentar explicitamente a ideia de deslocamento contida em “traga”.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
- source_word: בָּנָיו אִתּוֹ
  choice: e, com ele, seus filhos
  rationale: Conserva tanto “seus filhos” quanto o elemento explícito אִתּוֹ, cujo referente natural é Arão, evitando que “com ele” pareça modificar os demais objetos da lista.
- source_word: הַבְּגָדִים
  choice: as vestes
  rationale: “Vestes” é uma tradução lexicalmente adequada e digna para בגדים, além de se ajustar ao contexto sacerdotal sem impor um tecnicismo mais específico do que o hebraico.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: o óleo da unção
  rationale: Reproduz naturalmente em português a construção hebraica “óleo de unção” e mantém seu significado ritual.
- source_word: פַּר הַחַטָּאת
  choice: o novilho da oferta pelo pecado
  rationale: פַּר designa um bovino macho usado no sacrifício; “novilho” é a forma bíblica corrente e natural em português. חַטָּאת tem aqui sentido sacrificial, traduzido por “oferta pelo pecado”, sem excluir em nota a dimensão de purificação.
- source_word: שְׁנֵי הָאֵילִים
  choice: os dois carneiros
  rationale: Correspondência direta da expressão numeral mais substantivo no contexto sacrificial.
- source_word: סַל הַמַּצּוֹת
  choice: o cesto de pães sem fermento
  rationale: מַצּוֹת refere-se coletivamente a produtos de pão sem fermento. “Pães sem fermento” é claro para leitores modernos e evita o termo menos transparente “ázimos”.
theological_decisions:
- issue: Tradução de חַטָּאת no contexto sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo designa aqui uma oferta sacrificial e pode ser entendido com ênfase no pecado ou na purificação ritual. A leitura tradicional e amplamente inteligível fica no texto principal, enquanto a alternativa preserva a amplitude funcional do termo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A enumeração hebraica foi mantida, mas sem repetir a conjunção antes de cada item, o que soaria pesado em português. A colocação parentética de “com ele” esclarece sua ligação com Arão e seus filhos.
