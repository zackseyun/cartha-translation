base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/020.yaml
  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: pt
  text: Puseram os pedaços de gordura sobre os peitos, e ele queimou os pedaços de gordura no altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “fez os pedaços de gordura subir em fumaça no altar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Puseram
  rationale: O verbo שׂים significa pôr, colocar ou dispor. “Puseram” é natural e preserva o sujeito plural do hebraico.
- source_word: הַחֲלָבִים
  choice: os pedaços de gordura / a gordura
  rationale: O plural חֲלָבִים designa as porções de gordura reservadas para o sacrifício. A primeira ocorrência explicita que se trata de pedaços; na segunda, “a gordura” evita repetição pesada sem alterar o referente.
- source_word: עַל הֶחָזוֹת
  choice: sobre os peitos
  rationale: No vocabulário sacrificial, חָזֶה é a porção do peito do animal. “Peitos” mantém a referência anatômica e ritual do plural hebraico.
- source_word: וַיַּקְטֵר
  choice: queimou
  rationale: No contexto sacerdotal, קטר descreve a queima ritual sobre o altar, com a ideia de fazer subir fumaça. “Queimou” é claro e idiomático; a nuance é registrada em nota.
- source_word: הַמִּזְבֵּחָה
  choice: no altar
  rationale: Embora a forma tenha terminação direcional, com קטר a expressão indica idiomaticamente o local em que a oferta foi queimada.
