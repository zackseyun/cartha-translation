revisions:
- from: Então saiu fogo de diante de Yahweh[a] e consumiu, sobre o altar, o holocausto e as porções de gordura. Todo o povo viu, deu gritos de alegria[b] e se prostrou com o rosto em terra.
  to: Então saiu fogo de diante de Yahweh[a] e consumiu, sobre o altar, o holocausto e as porções de gordura. Todo o povo viu isso, gritou de alegria[b] e se prostrou com o rosto em terra.
  rationale: Acrescentou-se apenas “isso” após “viu” para obter uma construção idiomática em português. O pronome retoma a saída do fogo e seu consumo das ofertas, conteúdo já expresso no contexto imediato. Também se preferiu “gritou de alegria” a “deu gritos de alegria” por maior concisão, preservando o singular coletivo de “todo o povo” e o sentido jubilante de וַיָּרֹנּוּ.
