  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: pt
  text: Então saiu fogo de diante de Yahweh[a] e consumiu, sobre o altar, o holocausto e as porções de gordura. Todo o povo viu isso, gritou de alegria[b] e se prostrou com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da presença de Yahweh”; literalmente, “de diante de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou “soltou um grito de júbilo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: saiu fogo
  rationale: Reproduz diretamente o movimento para fora expresso por יצא e mantém a vivacidade da sequência narrativa.
- source_word: מִלִּפְנֵי יְהוָה
  choice: de diante de Yahweh
  rationale: Preserva a imagem espacial do hebraico לִפְנֵי e comunica que o fogo procedeu da presença divina; o nome da aliança יְהוָה é transliterado como Yahweh.
- source_word: וַתֹּאכַל
  choice: consumiu
  rationale: Embora o verbo possa significar literalmente “comeu”, “consumiu” é a expressão portuguesa natural para a ação do fogo sobre uma oferta.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: Equivalente claro e corrente da expressão preposicional, indicando onde estavam as ofertas consumidas.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: Termo sacrificial tradicional e preciso em português para a oferta inteiramente queimada.
- source_word: הַחֲלָבִים
  choice: as porções de gordura
  rationale: O plural, no contexto sacrificial, designa as partes gordurosas específicas oferecidas no altar, não gordura em sentido genérico.
- source_word: וַיַּרְא כָּל הָעָם
  choice: Todo o povo viu
  rationale: Tradução direta e natural da reação coletiva do povo.
- source_word: וַיָּרֹנּוּ
  choice: deu gritos de alegria
  rationale: רנן descreve um clamor vibrante de júbilo; a formulação transmite a reação espontânea sem pressupor canto formal.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: se prostrou com o rosto em terra
  rationale: Expressa em português natural a postura concreta de cair com o rosto no chão, associada a reverência e assombro.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido da prostração
  choice: se prostrou com o rosto em terra
  alternative: caiu com o rosto em terra
  rationale: A tradução conserva o gesto corporal sem acrescentar explicitamente “adorou”, finalidade teológica que o hebraico não declara neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o vocabulário sacrificial consagrado (“altar”, “holocausto”) e a imagem concreta da prostração. A concordância no singular acompanha o sujeito coletivo “todo o povo”.
