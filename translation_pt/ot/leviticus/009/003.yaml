source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: pt
  text: 'E diga aos filhos de Israel: “Tomem um bode para oferta pelo pecado[a], e um bezerro e um cordeiro, ambos de um ano, sem defeito, para holocausto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”; em contextos sacrificiais sacerdotais, o hebraico חַטָּאת também pode ser entendido assim.
    reason: Alternativa lexical que preserva a possível nuance purificadora do termo sacrificial hebraico.
lexical_decisions:
- source_word: וְאֶל בְּנֵי יִשְׂרָאֵל
  choice: E aos filhos de Israel
  rationale: Mantém a ligação com o contexto anterior e reproduz de modo transparente a designação hebraica corporativa.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: você dirá
  rationale: Expressa a força diretiva do imperfeito dirigido a Moisés; os dois-pontos introduzem naturalmente a fala indicada por לֵאמֹר.
- source_word: קְחוּ
  choice: Peguem
  rationale: Traduz diretamente o imperativo masculino plural de לקח sem acrescentar a ideia de destino que haveria em “tragam”.
- source_word: שְׂעִיר עִזִּים
  choice: um bode
  rationale: O sintagma designa especificamente um caprino macho; “bode” é a forma portuguesa clara e corrente.
- source_word: לְחַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa uma categoria de oferta. A formulação tradicional é acessível, enquanto a possível nuance de purificação é preservada em nota.
- source_word: וְעֵגֶל וָכֶבֶשׂ
  choice: e um bezerro e um cordeiro
  rationale: Reproduz os dois animais distintos com seus equivalentes lexicais comuns, sem interpretar עֵגֶל mais especificamente como novilho.
- source_word: בְּנֵי שָׁנָה תְּמִימִם
  choice: cada um de um ano e sem defeito
  rationale: O plural abrange o bezerro e o cordeiro; “cada um” torna clara essa distribuição, e “sem defeito” comunica o requisito sacrificial de integridade.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: “Holocausto” é o termo bíblico português estabelecido para a oferta inteiramente queimada, sentido cultual de עֹלָה.
theological_decisions:
- issue: Forma de traduzir בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A opção conserva a forma masculina e genealógica do hebraico, sem neutralizá-la nem substituir a designação da aliança por uma forma meramente gentílica.
- issue: Sentido sacrificial de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo identifica claramente uma categoria sacrificial, mas sua relação semântica com purificação em textos sacerdotais é genuína; por isso, a alternativa é registrada sem resolver indevidamente a nuance.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A construção mantém a solenidade da instrução sem recorrer a formas excessivamente arcaicas.
