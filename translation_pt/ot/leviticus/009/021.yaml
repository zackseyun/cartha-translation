  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: pt
  text: E Arão moveu os peitos e a coxa direita como oferta movida diante de Yahweh, conforme Moisés havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: os peitos
  rationale: No contexto sacrificial, חָזֶה designa a porção do peito do animal. O plural hebraico é preservado porque se trata das porções dos animais oferecidos.
- source_word: שׁוֹק הַיָּמִין
  choice: a coxa direita
  rationale: שׁוֹק designa a parte superior da perna ou coxa; “coxa direita” é uma formulação tradicional, clara e adequada ao contexto sacrificial.
- source_word: הֵנִיף ... תְּנוּפָה
  choice: moveu ... como oferta movida
  rationale: O verbo e o substantivo pertencem à mesma raiz e descrevem a apresentação ritual das porções mediante movimento. A formulação preserva tanto o ato quanto o caráter técnico da oferta.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa literalmente a realização do rito perante ou na presença de Yahweh.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: conforme Moisés havia ordenado
  rationale: Indica que a ação de Arão correspondeu à ordem anterior dada por Moisés; o mais-que-perfeito composto torna clara essa anterioridade em português corrente.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A expressão técnica “oferta movida” foi mantida para refletir a terminologia ritual e a repetição da raiz hebraica, sem acrescentar uma explicação interpretativa ao corpo do versículo.
