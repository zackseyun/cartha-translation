source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: pt
  text: Os filhos de Arão lhe trouxeram o sangue[a]. Ele molhou o dedo no sangue, aplicou-o sobre os chifres do altar[b] e derramou o sangue na base do altar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe apresentaram o sangue”; o verbo hebraico pode ter o sentido de “trazer para perto” em contexto ritual.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os chifres do altar”, isto é, as saliências em seus cantos.
    reason: cultural_note
  - marker: c
    text: Ou “no fundamento do altar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: trouxeram
  rationale: O hifil de קרב significa fazer chegar, trazer para perto ou apresentar. “Trouxeram” expressa naturalmente o movimento até Arão, enquanto a nota preserva a possível nuance ritual de apresentação.
- source_word: בְּנֵי אַהֲרֹן
  choice: Os filhos de Arão
  rationale: Reproduz de modo direto e natural a construção hebraica e mantém a identificação familiar e sacerdotal.
- source_word: הַדָּם
  choice: o sangue
  rationale: Mantém a determinação do hebraico e identifica o sangue específico do sacrifício já mencionado no contexto.
- source_word: אֵלָיו
  choice: lhe
  rationale: Preserva a referência pronominal do hebraico. Pelo contexto imediato, o antecedente mais natural é Arão.
- source_word: וַיִּטְבֹּל אֶצְבָּעוֹ
  choice: molhou o dedo
  rationale: טבל pode significar mergulhar ou molhar por imersão. “Molhou o dedo no sangue” descreve a ação com naturalidade em português sem sugerir necessariamente uma imersão completa.
- source_word: וַיִּתֵּן עַל
  choice: aplicou-o às
  rationale: Neste rito, נתן com על descreve a aplicação do sangue. “Aplicou-o” é claro, digno e evita a formulação menos natural “pôs o sangue sobre”.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: pontas do altar
  rationale: As קַרְנוֹת eram saliências semelhantes a chifres nos cantos do altar. “Pontas” comunica melhor sua forma ao leitor comum; a nota registra a expressão literal.
- source_word: יָצַק
  choice: derramou
  rationale: O verbo significa verter ou derramar e descreve de forma direta a ação ritual.
- source_word: אֶת הַדָּם
  choice: o restante do sangue
  rationale: '“Restante” é uma explicitação contextual: depois de parte do sangue ser aplicada às pontas, o sangue referido como derramado é o que ficou. Não altera a sequência do rito.'
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: na base do altar
  rationale: יְסוֹד pode significar fundamento ou base. No contexto do altar, “base” é a opção mais clara; a preposição portuguesa “na” exprime naturalmente o destino do derramamento.
theological_decisions:
- issue: Referente do pronome אֵלָיו
  choice: O sangue foi trazido a Arão.
  alternative: O sangue foi levado ao altar ou a outro referente implícito.
  rationale: O contexto imediato apresenta os filhos auxiliando Arão, que executa o rito, de modo que Arão é o antecedente mais natural. A tradução mantém, porém, a forma pronominal do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação segue de perto a sequência hebraica, mas emprega vocabulário ritual natural. Todos os marcadores de nota aparecem no texto em ordem.
