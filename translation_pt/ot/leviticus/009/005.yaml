  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: pt
  text: Então levaram para diante da tenda do encontro o que Moisés havia ordenado. Toda a comunidade se aproximou e pôs-se de pé diante de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: levaram
  rationale: Embora לקח costume significar “tomar” ou “pegar”, o destino expresso por אֶל־פְּנֵי indica movimento até a tenda; “levaram” comunica isso naturalmente em português.
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: o que Moisés havia ordenado
  rationale: A expressão remete ao que foi especificado anteriormente; o mais-que-perfeito deixa clara a anterioridade da ordem sem acrescentar conteúdo.
- source_word: אֶל־פְּנֵי
  choice: para a frente de
  rationale: Aqui a locução tem sentido espacial e indica a área diante da tenda, distinguindo-se de לִפְנֵי יְהוָה no fim do versículo.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente da expressão hebraica, natural em português e menos marcada por tradição eclesiástica que “tabernáculo”.
- source_word: וַיִּקְרְבוּ
  choice: se aproximou
  rationale: קרב expressa aproximação. O singular concorda naturalmente com o coletivo “toda a comunidade” em português.
- source_word: כָּל־הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade reunida de Israel. “Comunidade” é atual, abrangente e legível, preservando o sentido coletivo.
- source_word: וַיַּעַמְדוּ
  choice: ficou em pé
  rationale: עמד significa estar ou pôr-se de pé. A formulação se liga naturalmente ao sujeito coletivo singular e não implica apenas permanência.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva simultaneamente o aspecto espacial e o sentido de presença divina, mantendo o nome próprio representado pelo Tetragrama.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a decisão editorial indicada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A sintaxe foi dividida em duas frases para fluidez, sem alterar a sequência narrativa. O coletivo “toda a comunidade” rege verbos no singular, conforme o uso natural do português.
