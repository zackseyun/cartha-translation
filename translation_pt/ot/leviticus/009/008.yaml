  text: וַ/יִּקְרַ֥ב אַהֲרֹ֖ן אֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁחַ֛ט אֶת עֵ֥גֶל הַ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: pt
  text: Então Arão se aproximou do altar e abateu o bezerro da oferta pelo pecado destinada a ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o bezerro da oferta de purificação”. O termo hebraico pode designar a oferta relacionada à remoção do pecado e da impureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: se aproximou
  rationale: Expressa de modo natural o movimento concreto de Arão em direção ao altar, preservando o sentido cultual de קרב.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente padrão e claro de מִזְבֵּחַ em contexto sacrificial.
- source_word: וַיִּשְׁחַט
  choice: abateu
  rationale: Em contexto sacrificial, שׁחט indica o abate do animal. “Abateu” é preciso, corrente e mais específico que “matou”.
- source_word: עֵגֶל
  choice: o bezerro
  rationale: עֵגֶל designa um bovino jovem; “bezerro” é o equivalente português direto e corresponde ao animal especificado no contexto.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: Aqui חַטָּאת designa a categoria sacrificial. “Oferta pelo pecado” é uma formulação consagrada e inteligível, enquanto a possível nuance de purificação é preservada em nota.
- source_word: אֲשֶׁר לוֹ
  choice: que era para si mesmo
  rationale: No contexto, distingue a oferta do próprio Arão das ofertas pelo povo. A formulação explicita sua destinação sacrificial sem sugerir apenas posse.
theological_decisions:
- issue: Tradução de חַטָּאת no contexto sacrificial sacerdotal
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo hebraico nomeia a categoria sacrificial e pode destacar tanto sua relação com o pecado quanto sua função purificadora. O texto principal mantém a designação tradicional e clara, e a nota registra a alternativa legítima sem resolver indevidamente a questão interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário sacrificial preciso. A ordem narrativa do hebraico foi preservada de maneira natural.
