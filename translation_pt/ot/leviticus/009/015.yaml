  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: pt
  text: Então ele apresentou a oferta do povo, tomou o bode da oferta pelo pecado destinado ao povo, abateu-o e ofereceu-o como oferta pelo pecado[a], como fizera com o primeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “purificou-o”. O verbo hebraico também pode ter o sentido de purificar ou remover a impureza em contextos rituais sacerdotais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: apresentou
  rationale: No contexto sacrificial, o hifil de קרב indica trazer para perto ou apresentar uma oferta. “Apresentou” comunica naturalmente o ato ritual sem o equiparar a todo o processo de oferecimento.
- source_word: קָרְבַּן הָעָם
  choice: a oferta do povo
  rationale: קָרְבָּן é um termo geral para aquilo que é trazido como oferta; a construção hebraica expressa aqui a oferta pertencente ao povo ou apresentada em seu favor.
- source_word: שְׂעִיר הַחַטָּאת
  choice: o bode da oferta pelo pecado
  rationale: שְׂעִיר designa um bode, e חַטָּאת, neste contexto ritual, designa a oferta pelo pecado, não apenas o conceito abstrato de pecado.
- source_word: אֲשֶׁר לָעָם
  choice: destinado ao povo
  rationale: A preposição ל indica que o animal estava designado em favor do povo, e não meramente que lhe pertencia.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: abateu-o
  rationale: שׁחט é o verbo usual para o abate de animais sacrificiais. “Abateu-o” preserva melhor essa nuance ritual do que o genérico “matou-o”.
- source_word: וַיְחַטְּאֵהוּ
  choice: realizou com ele o rito da oferta pelo pecado
  rationale: O piel de חטא pode indicar executar o rito de purificação ou da oferta pelo pecado. A formulação funcional evita sugerir de modo enganoso que o próprio bode foi moralmente purificado e preserva a natureza ritual do ato.
- source_word: כָּרִאשׁוֹן
  choice: como havia feito com o primeiro
  rationale: A expressão remete à oferta pelo pecado apresentada anteriormente e indica a repetição do mesmo procedimento.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto sacrificial
  choice: oferta pelo pecado
  alternative: pecado
  rationale: Em Levítico 9, o contexto e o uso sacerdotal do termo apontam para o sacrifício chamado oferta pelo pecado, não para o pecado em sentido abstrato.
- issue: Sentido de וַיְחַטְּאֵהוּ
  choice: realizou com ele o rito da oferta pelo pecado
  alternative: purificou-o; ofereceu-o pelo pecado
  rationale: O verbo admite uma nuance de purificação ou expurgação ritual, mas seu objeto é o bode. A tradução funcional mantém essa ambiguidade em nota e evita importar o termo teológico mais específico “fez expiação”, que não corresponde diretamente ao verbo empregado.
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial consistente. “Destinado ao povo” explicita naturalmente a relação expressa por ל, e a formulação do último rito preserva a dificuldade lexical do hebraico sem recorrer a linguagem denominacional.
