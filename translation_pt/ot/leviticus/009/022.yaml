  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: pt
  text: Então Arão levantou as mãos em direção ao povo e o abençoou[a]. Depois de oferecer a oferta pelo pecado[b], o holocausto e as ofertas de comunhão[c], ele desceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sua mão”; a expressão é geralmente entendida como referência ao gesto de levantar as mãos para abençoar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “oferta de purificação”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “ofertas de paz” ou “ofertas de bem-estar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: levantou
  rationale: Com יָדוֹ, o verbo נשׂא descreve o gesto físico de levantar a mão ou as mãos para abençoar; “levantou” é natural e fiel em português.
- source_word: יָדוֹ
  choice: as mãos
  rationale: A forma hebraica é singular, “sua mão”, mas a expressão é normalmente compreendida como o gesto sacerdotal realizado com as mãos; a alternativa literal é registrada em nota.
- source_word: אֶל הָעָם
  choice: em direção ao povo
  rationale: אֶל expressa direção e aqui indica a orientação do gesto de Arão.
- source_word: וַיְבָרְכֵם
  choice: e o abençoou
  rationale: O verbo ברך no piel significa diretamente “abençoar”; o pronome singular coletivo retoma “o povo” com naturalidade em português.
- source_word: וַיֵּרֶד
  choice: ele desceu
  rationale: ירד significa descer. A formulação preserva o movimento espacial sem especificar de onde Arão desceu além do que o texto declara.
- source_word: מֵעֲשֹׂת
  choice: Depois de oferecer
  rationale: A construção מן + infinitivo indica que a descida ocorreu após a conclusão da atividade sacrificial; “depois de oferecer” exprime essa relação naturalmente.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: Termo sacrificial tradicional e reconhecível em português; “oferta de purificação” explicita outra nuance possível e consta em nota.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo técnico bíblico tradicional em português para a oferta inteiramente queimada, mantendo concisão e consistência intertextual.
- source_word: הַשְּׁלָמִים
  choice: as ofertas de comunhão
  rationale: O termo שׁלמים designa sacrifícios associados à comunhão, paz e bem-estar. “Ofertas de comunhão” é claro no português atual, enquanto alternativas legítimas são registradas em nota.
theological_decisions:
- issue: Terminologia dos sacrifícios levíticos
  choice: “oferta pelo pecado”, “holocausto” e “ofertas de comunhão”
  alternative: “oferta de purificação”, “oferta totalmente queimada” e “ofertas de paz/bem-estar”
  rationale: As escolhas principais mantêm categorias cultuais reconhecíveis e linguagem natural em português. As notas preservam as nuances funcionais possíveis sem impor uma interpretação teológica única.
- issue: Relação temporal de מֵעֲשֹׂת com וַיֵּרֶד
  choice: “Depois de oferecer..., ele desceu”
  alternative: “ele desceu de oferecer...”
  rationale: A ordem portuguesa explicita de modo natural a conclusão dos sacrifícios antes da descida, sem acrescentar local ou circunstância não declarados no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com termos sacrificiais reconhecíveis. A sintaxe foi reorganizada levemente para expressar com naturalidade a sequência temporal do hebraico. Todos os marcadores de nota aparecem no texto principal.
