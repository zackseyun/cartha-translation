  text: וַ/יַּקְרֵ֖ב אֶת הָ/עֹלָ֑ה וַֽ/יַּעֲשֶׂ֖/הָ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/016.yaml
  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: pt
  text: Então ele apresentou o holocausto e o ofereceu conforme o que estava prescrito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme a norma estabelecida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: apresentou
  rationale: O hifil de קרב significa fazer chegar perto ou apresentar. No contexto sacrificial, “apresentou” conserva o sentido ritual e evita confundi-lo com o verbo seguinte.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עֹלָה é o termo sacrificial usual para a oferta inteiramente queimada. “Holocausto” é a designação bíblica tradicional e corrente em português.
- source_word: וַיַּעֲשֶׂהָ
  choice: o ofereceu
  rationale: Embora עשה seja literalmente amplo (“fazer”), aqui se refere à execução do rito sacrificial. “O ofereceu” comunica naturalmente essa ação no contexto, sem a vagueza de “o fez”.
- source_word: כַּמִּשְׁפָּט
  choice: conforme o que estava prescrito
  rationale: מִשְׁפָּט indica aqui a norma ou maneira ritual estabelecida. A formulação preserva a força normativa e soa natural em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial reconhecível. “Então” reproduz naturalmente a progressão narrativa do waw consecutivo; o pronome em “o ofereceu” retoma sem ambiguidade o holocausto.
