base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: pt
  text: Então ele abateu o holocausto, e os filhos de Arão lhe trouxeram o sangue; ele o lançou[a] contra o altar, ao redor dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arremessou-o”. O verbo hebraico indica lançar o sangue com certa força, não apenas borrifá-lo levemente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Então ele abateu
  rationale: No contexto sacrificial, שׁחט indica o abate ritual. “Abateu” é mais específico que “matou”, enquanto “então” expressa naturalmente a sequência narrativa.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo cultual estabelecido em português para a oferta totalmente queimada, sem acrescentar explicação ao texto.
- source_word: וַיַּמְצִאוּ ... אֵלָיו אֶת הַדָּם
  choice: lhe trouxeram o sangue
  rationale: A expressão descreve os filhos de Arão levando o sangue até ele para a aplicação sacerdotal; “lhe trouxeram” é natural e preserva a direção da ação.
- source_word: בְּנֵי אַהֲרֹן
  choice: Os filhos de Arão
  rationale: Forma clara e digna que mantém tanto o vínculo familiar quanto a identificação sacerdotal.
- source_word: וַיִּזְרְקֵהוּ
  choice: ele o lançou
  rationale: זרק descreve o lançamento ou arremesso do sangue, uma ação mais vigorosa que uma leve aspersão. “Lançou” preserva essa força sem soar excessivamente violento.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contra o altar, ao redor
  rationale: “Contra” comunica a aplicação do sangue nas superfícies do altar, e “ao redor” preserva o sentido de distribuição em torno dele.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário cultual tradicional. A divisão em duas frases evita uma sequência pesada sem alterar a progressão do hebraico. O marcador da nota foi colocado junto ao verbo a que a explicação lexical efetivamente se refere.
