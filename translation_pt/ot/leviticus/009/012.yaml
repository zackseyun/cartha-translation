review_pass:
  verdict: revise
  source_fidelity: 'O texto traduz corretamente a sequência ritual: o abate da oferta, a entrega do sangue pelos filhos de Arão e sua aplicação no altar. Contudo, a nota chama «aspergiu» de alternativa, embora esse verbo tenda a sugerir uma aspersão fina e não reflita tão bem a força de זָרַק; além disso, «contra o altar, ao redor» fica sintaticamente solto em português.'
  naturalness: «Então ele abateu o holocausto» é claro e adequado. A formulação «ao redor do altar» é mais natural e inequívoca que «contra o altar, ao redor». Manter a sequência numa só frase também espelha melhor a coordenação narrativa, sem prejudicar a leitura.
  terminology: «Holocausto», «filhos de Arão», «sangue» e «altar» são termos cultuais estabelecidos e apropriados. «Lançou» é uma boa equivalência para o ato indicado por זָרַק neste contexto.
  issues:
  - severity: medium
    issue: A nota apresenta «aspergiu-o» como alternativa principal.
    rationale: «Aspergir» pode ser usado em linguagem ritual, mas normalmente evoca gotas ou borrifamento e enfraquece o valor de lançamento/difusão vigorosa de זָרַק. Uma alternativa como «arremessou-o» explica melhor a nuance sem distorção.
  - severity: low
    issue: «contra o altar, ao redor» é pouco fluente e deixa o escopo de «ao redor» menos explícito.
    rationale: O hebraico indica a aplicação do sangue em volta do altar. «Contra o altar, ao redor dele» preserva isso com maior clareza em português.
  revised_text: Então ele abateu o holocausto, e os filhos de Arão lhe trouxeram o sangue; ele o lançou[a] contra o altar, ao redor dele.
