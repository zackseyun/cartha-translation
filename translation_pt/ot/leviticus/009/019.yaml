  terminology: “Porções de gordura” comunica bem o plural técnico sacrificial. “Carneiro”, “rins” e “lóbulo do fígado” são adequados. Substitui-se “novilho” por “touro”, com nota alternativa para “boi”, a fim de não introduzir a especificação etária ausente no hebraico e de refletir a amplitude lexical de שׁוֹר.
