  source_fidelity: 'A lista anatômica é fiel ao hebraico: as porções gordurosas, a cauda gorda, a gordura de cobertura, os rins e a porção do fígado são adequadamente representados. Contudo, “novilho” restringe שׁוֹר a um animal jovem e a justificativa o associa indevidamente à oferta pelo pecado de 9:2; neste contexto, o animal mencionado é o da oferta de paz de 9:18. O hebraico permite uma designação mais ampla, normalmente traduzida como “touro” ou “boi” no contexto sacrificial.'
