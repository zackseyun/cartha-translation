  text: וְ/אֶת הַ/חֲלָבִ֖ים מִן הַ/שּׁ֑וֹר וּ/מִן הָ/אַ֔יִל הָֽ/אַלְיָ֤ה וְ/הַֽ/מְכַסֶּה֙ וְ/הַ/כְּלָיֹ֔ת וְ/יֹתֶ֖רֶת הַ/כָּבֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: pt
  text: 'e as porções de gordura do touro[a] e do carneiro: a cauda gorda, a gordura que cobre as vísceras, os rins e o lóbulo do fígado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: boi. O hebraico shor pode designar de modo mais amplo um bovino macho; no contexto sacrificial, pode ser traduzido como “touro” ou “boi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: e as porções de gordura
  rationale: O plural sacrificial חֲלָבִים designa as partes gordurosas determinadas para a oferta; “porções de gordura” é claro e evita a expressão pouco natural “as gorduras”.
- source_word: מִן הַשּׁוֹר
  choice: do novilho
  rationale: שׁוֹר é termo amplo para um bovino; no contexto imediato, refere-se ao animal da oferta pelo pecado, anteriormente identificado como um bezerro macho. “Novilho” mantém naturalidade sem sugerir um boi castrado.
- source_word: וּמִן הָאַיִל
  choice: e do carneiro
  rationale: אַיִל designa de modo direto um carneiro adulto no contexto sacrificial.
- source_word: הָאַלְיָה
  choice: a cauda gorda
  rationale: O termo designa a cauda rica em gordura de certas ovelhas, uma porção sacrificial específica.
- source_word: וְהַמְכַסֶּה
  choice: a gordura que cobre as vísceras
  rationale: O particípio de כסה, “cobrir”, funciona aqui como designação abreviada da gordura de cobertura; explicitar “as vísceras” torna a referência anatômica compreensível e corresponde às listas sacrificiais paralelas.
- source_word: וְהַכְּלָיֹת
  choice: os rins
  rationale: Equivalente anatômico direto e corrente de כְּלָיוֹת.
- source_word: וְיֹתֶרֶת הַכָּבֵד
  choice: e o lóbulo do fígado
  rationale: A expressão designa uma parte ou apêndice ligado ao fígado. “Lóbulo do fígado” é uma formulação anatômica clara, embora a identificação exata permaneça discutida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial concreta. O versículo é mantido como continuação sintática do anterior. Não se acrescentou nota para שׁוֹר, pois “novilho” se apoia no referente imediato de Levítico 9:2; também se evitou reproduzir a nota inglesa, cujo marcador aparece deslocado após “fat tail” embora trate de “ox/bull”.
