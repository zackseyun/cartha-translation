base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: pt
  text: No oitavo dia, aconteceu que Moisés chamou Arão, seus filhos e os anciãos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “convocou”, em vez de “chamou”; neste contexto, o verbo hebraico pode ter qualquer um desses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: No oitavo dia
  rationale: Em português, o início direto com a expressão temporal comunica com naturalidade a progressão narrativa marcada por וַיְהִי, sem recorrer à fórmula mais pesada “E aconteceu que”.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: no oitavo dia
  rationale: Reproduz a expressão temporal sem acrescentar “depois disso”, informação inferida do contexto, mas não expressa no hebraico.
- source_word: קָרָא
  choice: chamou
  rationale: É o equivalente direto e natural; o verbo também pode ter o sentido contextual de “convocou”, preservado em nota.
- source_word: לְאַהֲרֹן
  choice: Arão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּלְבָנָיו
  choice: seus filhos
  rationale: No contexto sacerdotal, בָּנָיו se refere aos descendentes masculinos de Arão que participavam do sacerdócio.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: e os anciãos de Israel
  rationale: Expressão portuguesa corrente para os líderes ou representantes reconhecidos de Israel.
