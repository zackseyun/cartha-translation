id: LEV.9.2
reference: Leviticus 9:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: pt
  text: 'E disse a Arão: “Tome para você um bezerro, cria do gado,[a] como oferta pelo pecado, e um carneiro como holocausto, ambos sem defeito, e apresente-os diante de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “um bezerro, filho do gado”, isto é, um bovino jovem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico sem tornar explícita uma sequência temporal além do que o texto afirma.
- source_word: אֶל אַהֲרֹן
  choice: a Arão
  rationale: Reproduz de modo direto e natural o destinatário indicado por אֶל.
- source_word: קַח לְךָ
  choice: Tome para você
  rationale: Mantém a força do imperativo e a nuance pessoal/reflexiva do dativo לְךָ.
- source_word: עֵגֶל בֶּן בָּקָר
  choice: um bezerro, cria do gado
  rationale: Conserva a estrutura apositiva e o sentido de um bovino jovem, em português compreensível.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta ritual, não apenas o pecado em sentido abstrato.
- source_word: וְאַיִל
  choice: e um carneiro
  rationale: אַיִל é o termo comum para o macho adulto da espécie ovina em contextos sacrificiais.
- source_word: לְעֹלָה
  choice: como holocausto
  rationale: Holocausto é o termo sacrificial tradicional e inteligível para עֹלָה, oferta inteiramente queimada.
- source_word: תְּמִימִם
  choice: ambos sem defeito
  rationale: O plural hebraico qualifica os dois animais; “ambos” torna essa referência inequívoca em português.
- source_word: וְהַקְרֵב
  choice: e apresente-os
  rationale: O hifil de קרב indica fazer chegar ou apresentar no âmbito do culto; evita antecipar os procedimentos do sacrifício descritos depois.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa a ideia cultual de estar na presença divina e translitera o nome próprio da aliança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido sacrificial de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: “Oferta pelo pecado” mantém a designação cultual tradicional e a ligação lexical com pecado, sem excluir as funções purificadoras que o termo pode assumir no contexto levítico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativo de tratamento por “você”. A formulação conserva elementos da estrutura hebraica quando permanecem naturais, mas usa terminologia sacrificial corrente. O marcador da nota foi colocado junto à expressão que ela explica.
