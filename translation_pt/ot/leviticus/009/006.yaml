id: LEV.9.6
reference: Leviticus 9:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: pt
  text: 'E Moisés disse: “Isto é o que Yahweh ordenou que vocês façam, para que a glória de Yahweh apareça a vocês[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E a glória de Yahweh aparecerá a vocês.”'
    reason: Leitura alternativa possível para a oração final hebraica, entendendo-a como promessa futura coordenada, e não como propósito ou resultado.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “E ... disse” preserva de modo simples a continuidade do relato.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: זֶה הַדָּבָר
  choice: Isto é o que
  rationale: Embora literalmente seja “esta é a coisa/palavra”, esta formulação comunica o sentido com naturalidade no português moderno sem perder a referência ao ato prescrito.
- source_word: צִוָּה
  choice: ordenou
  rationale: O verbo צוה indica uma ordem dotada de autoridade; “ordenou” é corrente, digno e adequado ao contexto cultual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: תַּעֲשׂוּ
  choice: que vocês fizessem
  rationale: Representa a segunda pessoa masculina plural e se encaixa naturalmente como conteúdo da ordem em português de ampla legibilidade brasileira.
- source_word: וְיֵרָא
  choice: para que ... apareça
  rationale: Expressa a possível relação de propósito ou resultado entre o cumprimento da ordem e a manifestação da glória divina; a leitura coordenada como promessa futura permanece na nota.
- source_word: אֲלֵיכֶם
  choice: a vocês
  rationale: A preposição אֶל com o verbo de aparecimento indica aqueles a quem a manifestação se apresenta.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Reproduz claramente a construção hebraica e conserva a conhecida linguagem bíblica da majestade divina manifesta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Força da oração final וְיֵרָא אֲלֵיכֶם כְּבוֹד יְהוָה
  choice: 'final/consecutiva: “para que a glória de Yahweh apareça a vocês”'
  alternative: 'futuro coordenado: “e a glória de Yahweh aparecerá a vocês”'
  rationale: No contexto de uma ação ordenada, o imperfeito nifal precedido por waw pode exprimir propósito ou resultado, mas também admite a leitura de uma promessa futura coordenada; a nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para tornar explícito o destinatário plural e mantém “Yahweh” como nome divino. O marcador [a] foi colocado após o verbo introdutório, acompanhando a tradição editorial fornecida, embora a nota diga respeito à oração final.
