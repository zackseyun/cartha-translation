  text: וְ/אֶת הָ/עֹלָ֗ה הִמְצִ֧יאוּ אֵלָ֛י/ו לִ/נְתָחֶ֖י/הָ וְ/אֶת הָ/רֹ֑אשׁ וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: pt
  text: Trouxeram-lhe o holocausto, pedaço por pedaço[a], e a cabeça; e ele os queimou sobre o altar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em seus pedaços”. O hebraico indica que as partes em que o animal foi cortado foram levadas a Arão em partes.'
    reason: lexical_alternative
  - marker: b
    text: Em contexto sacrificial, o verbo pode ser expresso mais especificamente como “fez subir em fumaça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: Em contexto levítico, עֹלָה designa a oferta inteiramente queimada no altar. “Holocausto” é o termo sacrificial tradicional, conciso e amplamente reconhecido em português.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: entregaram-lhe
  rationale: O hifil de מצא indica aqui fazer chegar ou levar até alguém. No contexto, os auxiliares passam as partes da oferta a Arão; “entregaram-lhe” exprime essa ação com naturalidade.
- source_word: לִנְתָחֶיהָ
  choice: pedaço por pedaço
  rationale: נֶתַח refere-se às partes em que o animal foi cortado, e a construção indica sua apresentação em partes. A formulação portuguesa é clara sem ocultar a alternativa mais formal “em seus pedaços”.
- source_word: הָרֹאשׁ
  choice: a cabeça
  rationale: Tradução anatômica direta; o texto distingue a cabeça das demais partes cortadas.
- source_word: וַיַּקְטֵר
  choice: ele os queimou
  rationale: No uso sacrificial, קטר descreve a queima no altar, com a oferta subindo em fumaça. “Queimou” é natural no texto principal, enquanto uma nota preserva a nuance cultual mais específica.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: Equivalente português corrente e preciso da expressão cultual hebraica.
