  text: וַ/יִּרְחַ֥ץ אֶת הַ/קֶּ֖רֶב וְ/אֶת הַ/כְּרָעָ֑יִם וַ/יַּקְטֵ֥ר עַל הָ/עֹלָ֖ה הַ/מִּזְבֵּֽחָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: pt
  text: Ele lavou as vísceras e as pernas e as fez subir em fumaça no altar, sobre o holocausto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: lavou
  rationale: O verbo רחץ, neste contexto sacrificial, indica lavar com água; “lavou” é claro, natural e ritualisticamente adequado.
- source_word: הַקֶּרֶב
  choice: as vísceras
  rationale: No contexto dos sacrifícios, קֶרֶב designa as partes internas do animal; “vísceras” é específico e corrente em português.
- source_word: הַכְּרָעָיִם
  choice: as pernas
  rationale: כְּרָעַיִם refere-se às pernas ou canelas do animal. “Pernas” é natural em português e mantém a referência anatômica sem impor precisão além da evidência.
- source_word: וַיַּקְטֵר
  choice: as fez subir em fumaça
  rationale: O hifil de קטר, em contexto sacerdotal, descreve fazer a oferta subir em fumaça no altar, e não apenas queimá-la genericamente.
- source_word: עַל
  choice: sobre
  rationale: A preposição indica que essas partes foram colocadas e queimadas sobre o holocausto que já estava no altar.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עֹלָה é o termo sacrificial convencionalmente vertido por “holocausto”, isto é, a oferta totalmente queimada.
- source_word: הַמִּזְבֵּחָה
  choice: no altar
  rationale: A forma direcional de מִזְבֵּחַ integra-se naturalmente em português à expressão “no altar”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial consagrada. A formulação “fez subir em fumaça” preserva a nuance ritual do verbo hebraico; “pernas” evita uma especificidade anatômica não absolutamente certa.
