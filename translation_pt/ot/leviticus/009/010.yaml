  - severity: low
    issue: Retomada pronominal pesada em “ele os fez subir”.
    rationale: Depois da enumeração antecipada, o pronome resumitivo é possível, mas não é necessário e torna a frase menos direta. A ordem verbal proposta mantém o registro formal e a clareza.
  revised_text: Da oferta pelo pecado[a], ele fez subir em fumaça sobre o altar a gordura, os rins e o lóbulo do fígado, conforme Yahweh havia ordenado a Moisés.
