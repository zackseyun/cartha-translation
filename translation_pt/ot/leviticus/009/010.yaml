base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Da oferta pelo pecado[a], ele fez subir em fumaça sobre o altar a gordura, os rins e o lóbulo do fígado, conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de purificação”. O termo hebraico pode destacar a função da oferta de remover a impureza, além de tratar do pecado.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: gordura
  rationale: No contexto sacrificial, designa a gordura, especialmente as porções gordurosas reservadas para o altar; “gordura” é direto e natural em português.
- source_word: כְּלָיֹת
  choice: rins
  rationale: Preserva com clareza a referência anatômica concreta do ritual.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: lóbulo do fígado
  rationale: Expressa de modo compreensível a porção ou apêndice associado ao fígado que era retirado no sacrifício, sem impor uma identificação anatômica excessivamente técnica.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: É a designação cultual tradicional e amplamente compreensível; a possível ênfase na purificação é preservada em nota.
- source_word: הִקְטִיר
  choice: fez subir em fumaça
  rationale: O hifil de קטר descreve especificamente fazer a oferta subir em fumaça no altar, e não apenas queimá-la de modo genérico.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Embora a forma tenha terminação direcional, com o verbo sacrificial o sentido idiomático é que as porções foram queimadas sobre o altar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode ressaltar tanto o pecado quanto a função purificadora da oferta. O texto principal mantém a designação conhecida, enquanto a nota conserva a alternativa legítima sem resolver indevidamente a nuance.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe que mantém a lista enfática do hebraico. O pronome “os” explicita naturalmente em português que as três partes foram feitas subir em fumaça. A expressão ritual “fez subir em fumaça” preserva a especificidade cultual do verbo hebraico.
