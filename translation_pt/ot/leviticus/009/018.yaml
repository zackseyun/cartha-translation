  text: וַ/יִּשְׁחַ֤ט אֶת הַ/שּׁוֹר֙ וְ/אֶת הָ/אַ֔יִל זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לָ/עָ֑ם וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת הַ/דָּם֙ אֵלָ֔י/ו וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: pt
  text: Depois, ele matou o novilho e o carneiro[a], o sacrifício de ofertas de comunhão que era pelo povo. Os filhos de Arão lhe trouxeram o sangue, e ele o aspergiu sobre o altar, ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sacrifício de ofertas de paz” ou “o sacrifício de ofertas de bem-estar”. O termo hebraico שְׁלָמִים traz associações de paz, integridade, bem-estar e comunhão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Depois, ele matou
  rationale: O waw consecutivo faz a narrativa avançar; “Depois” expressa naturalmente a sequência. “Matou” é claro e digno no contexto sacrificial, sem sugerir abate profano.
- source_word: הַשּׁוֹר
  choice: o novilho
  rationale: שׁוֹר designa um bovino; “novilho” é corrente no vocabulário sacrificial em português e evita o sentido moderno frequente de “boi” como animal castrado.
- source_word: הָאַיִל
  choice: o carneiro
  rationale: אַיִל designa especificamente um carneiro adulto.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: o sacrifício de ofertas de comunhão
  rationale: A expressão identifica a categoria sacrificial שְׁלָמִים. “Ofertas de comunhão” comunica sua dimensão relacional, enquanto a nota preserva as associações também possíveis de paz e bem-estar.
- source_word: אֲשֶׁר לָעָם
  choice: que era pelo povo
  rationale: A construção indica que o sacrifício era apresentado em favor do povo; a formulação mantém a oração relativa do hebraico.
- source_word: וַיַּמְצִאוּ
  choice: trouxeram
  rationale: No procedimento ritual, o verbo descreve a entrega ou apresentação do sangue ao sacerdote oficiante; “trouxeram” é simples e natural.
- source_word: אֶת הַדָּם אֵלָיו
  choice: lhe trouxeram o sangue
  rationale: O pronome remete a Arão. A colocação pronominal portuguesa mantém a referência sem repetição desnecessária do nome.
- source_word: וַיִּזְרְקֵהוּ
  choice: ele o aspergiu
  rationale: זָרַק descreve a aplicação do sangue lançando-o contra ou sobre o altar. “Aspergiu” é o termo ritual mais natural em português, embora possa soar mais leve que a ação hebraica.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: sobre o altar, ao redor
  rationale: A tradução acompanha de perto עַל e conserva o sentido distributivo de סָבִיב, indicando a aplicação do sangue em torno do altar.
theological_decisions:
- issue: Sentido de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz; ofertas de bem-estar
  rationale: O termo hebraico reúne associações de paz, integridade, bem-estar e comunhão. O texto principal escolhe uma expressão compreensível no contexto ritual, e a nota mantém aberta a amplitude semântica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém-se a sequência narrativa, o vocabulário sacrificial e a ambiguidade lexical de שְׁלָמִים por meio de nota.
