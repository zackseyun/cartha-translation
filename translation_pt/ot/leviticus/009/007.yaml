source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: pt
  text: 'Então Moisés disse a Arão: “Aproxime-se do altar e ofereça a sua oferta pelo pecado[a] e o seu holocausto, e faça expiação por você e pelo povo. Depois, ofereça a oferta do povo e faça expiação por eles, conforme Yahweh ordenou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חַטָּאת pode designar a oferta pelo pecado, com ênfase, em certos contextos, na purificação da impureza.
    reason: Alternativa lexical que preserva a amplitude semântica do termo sacrificial hebraico.
lexical_decisions:
- source_word: קְרַב
  choice: Aproxime-se
  rationale: O imperativo de קרב, neste contexto cultual, convoca Arão a chegar junto ao altar; “aproxime-se” é natural, direto e preserva o sentido de aproximação.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente cultual padrão, mantendo a determinação do hebraico.
- source_word: וַעֲשֵׂה
  choice: ofereça
  rationale: Embora עשה signifique literalmente “fazer”, quando rege sacrifícios neste contexto expressa idiomaticamente a realização ou apresentação da oferta.
- source_word: חַטָּאתְךָ
  choice: a sua oferta pelo pecado
  rationale: חַטָּאת designa aqui o sacrifício relacionado ao pecado e à impureza. A formulação é clara e consagrada, enquanto a alternativa “oferta de purificação” fica registrada em nota.
- source_word: עֹלָתֶךָ
  choice: o seu holocausto
  rationale: No uso sacrificial, עֹלָה é a oferta inteiramente queimada; “holocausto” é o termo bíblico corrente e preciso em português.
- source_word: וְכַפֵּר
  choice: faça expiação
  rationale: Preserva a amplitude ritual e teológica de כפר sem impor uma teoria específica sobre o mecanismo da expiação.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: por você e pelo povo
  rationale: בְּעַד indica atuação em favor ou em nome de alguém; “por” comunica isso de modo natural em português.
- source_word: קָרְבַּן הָעָם
  choice: a oferta do povo
  rationale: קָרְבָּן é um termo geral para aquilo que é apresentado como oferta; a construção mantém claramente a relação com o povo.
- source_word: בַּעֲדָם
  choice: por eles
  rationale: Mantém de forma concisa a mesma força representativa de בְּעַד usada anteriormente.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: conforme Yahweh ordenou
  rationale: כַּאֲשֶׁר expressa conformidade com a ordem divina, e יְהוָה é vertido pelo nome pessoal “Yahweh”.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode destacar tanto o pecado quanto a função purificadora do rito. O texto principal emprega a expressão familiar e contextualmente válida, e a nota preserva a alternativa lexical legítima.
- issue: Sentido de כפר
  choice: fazer expiação
  alternative: purificar; realizar expiação
  rationale: “Fazer expiação” conserva a densidade ritual e teológica do verbo sem restringi-lo a uma explicação doutrinária específica.
- issue: Referente de בַּעַד הָעָם na primeira ordem
  choice: pelo povo
  alternative: em favor do povo
  rationale: Mantém a formulação abrangente do hebraico, sem tentar harmonizar ou redefinir a relação entre esta expiação e a oferta do povo mencionada em seguida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “Arão”, “holocausto” e “expiação” como termos bíblicos correntes, preservando “Yahweh” como nome divino. A coordenação e a progressão das ordens seguem de perto o hebraico sem produzir uma frase artificial.
