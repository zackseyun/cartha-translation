  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: pt
  text: Depois apresentou a oferta de cereal, encheu a mão com parte dela[a] e a queimou sobre o altar, além do holocausto da manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “encheu a mão com parte dela”; uma expressão para tomar na mão uma porção da oferta de cereal a fim de queimá-la sobre o altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: apresentou
  rationale: No contexto sacrificial, o hifil de קרב significa fazer chegar ou apresentar uma oferta. “Apresentou” conserva o sentido ritual sem acrescentar uma ação não expressa no hebraico.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: Na legislação sacrificial de Levítico, מִנְחָה designa especificamente a oferta feita de produtos agrícolas, sobretudo farinha e grãos, e não uma oferta genérica.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: pegou dela uma porção que lhe encheu a mão
  rationale: A formulação mantém a imagem concreta do hebraico, literalmente “encheu a palma/mão com parte dela”, mas expressa em português natural que ele retirou uma porção da oferta.
- source_word: וַיַּקְטֵר
  choice: queimou essa porção
  rationale: No uso sacrificial, o hifil de קטר indica queimar no altar, fazendo a oferta subir em fumaça. A explicitação de “essa porção” torna claro o objeto implícito sem alterar o sentido.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: É uma tradução locativa direta e corrente no contexto ritual.
- source_word: מִלְּבַד
  choice: além de
  rationale: 'Aqui a preposição indica acréscimo: a oferta de cereal foi queimada em adição ao holocausto regular da manhã.'
- source_word: עֹלַת הַבֹּקֶר
  choice: o holocausto da manhã
  rationale: עֹלָה é o termo técnico habitual para a oferta inteiramente queimada; “holocausto da manhã” é conciso e reconhecível em português bíblico moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial consolidada. A sintaxe foi levemente ajustada para explicitar que somente a porção retirada foi queimada, preservando a imagem hebraica da mão cheia.
