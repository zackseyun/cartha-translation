id: LEV.9.4
reference: Leviticus 9:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: pt
  text: e um boi e um carneiro como ofertas de comunhão[a], para sacrificá-los diante de Yahweh[b], e uma oferta de cereal misturada com óleo; pois hoje Yahweh aparecerá a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de paz” ou “ofertas de bem-estar”.
    reason: lexical_alternative
  - marker: b
    text: O nome divino em hebraico é יהוה (YHWH).
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: boi
  rationale: Termo comum para um bovino; é natural em português e evita tornar a formulação técnica, embora o hebraico não exija aqui uma especificação mais estreita.
- source_word: אַיִל
  choice: carneiro
  rationale: Designa especificamente o macho adulto da ovelha e é o termo habitual em contextos sacrificiais.
- source_word: שְׁלָמִים
  choice: ofertas de comunhão
  rationale: Expressa a dimensão relacional desse sacrifício e mantém em nota as alternativas tradicionais ligadas à paz e ao bem-estar.
- source_word: לִזְבֹּחַ
  choice: para sacrificá-los
  rationale: Comunica a ação ritual de oferecer os animais em sacrifício; o pronome explicita naturalmente em português que a ação recai sobre os dois animais.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva o sentido de 'perante/na presença de' e translitera o nome divino presente no hebraico.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: No contexto levítico, designa a oferta preparada com produtos de cereal, não uma oferta genérica.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: misturada com óleo
  rationale: Reproduz de modo claro e atual a preparação indicada pelo particípio hebraico sem especificar 'azeite', pois o substantivo hebraico significa óleo de modo mais amplo.
- source_word: כִּי הַיּוֹם
  choice: pois hoje
  rationale: Mantém tanto a relação causal introduzida por כִּי quanto a ênfase temporal de הַיּוֹם.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: aparecerá a vocês
  rationale: Embora a forma verbal seja um perfeito nifal, o contexto lhe dá força iminente ou futura; a manifestação ainda é aguardada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome da aliança sem substituí-lo por um título.
- issue: Sujeito e tempo da manifestação divina
  choice: Yahweh aparecerá a vocês
  alternative: a glória de Yahweh aparecerá a vocês; Yahweh apareceu a vocês
  rationale: Este versículo nomeia o próprio Yahweh, sem a expressão 'a glória de Yahweh' usada no versículo seguinte. O contexto prospectivo favorece o futuro, sem importar palavras do contexto próximo.
translation_notes:
  register: Português moderno, claro e digno, com construção fluente para leitores brasileiros e compreensão internacional. Emprega 'vocês' por ser amplamente inteligível e adequado ao plural hebraico. O marcador sobre o nome divino foi colocado junto à primeira ocorrência de 'Yahweh', em vez de junto à expressão sobre o óleo.
