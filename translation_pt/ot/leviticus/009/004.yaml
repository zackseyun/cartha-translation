  source_fidelity: 'O texto traduz com precisão os elementos do hebraico: שׁוֹר e אַיִל como «boi» e «carneiro»; o propósito sacrificial dos animais; a oferta de cereal misturada com óleo; e a declaração causal de que Yahweh aparecerá ao povo naquele dia. O futuro «aparecerá» reproduz adequadamente a força prospectiva do perfeito nifal no contexto, sem introduzir «a glória de Yahweh», expressão ausente deste versículo.'
