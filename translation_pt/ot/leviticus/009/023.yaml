  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: pt
  text: Moisés e Arão entraram na tenda do encontro; depois saíram e abençoaram o povo. E a glória de Yahweh apareceu a todo o povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Preserva o sentido técnico do local de encontro cultual e mantém uma formulação clara e corrente em português.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: entraram ... saíram
  rationale: Expressa naturalmente o movimento para dentro da tenda e a saída subsequente. Embora a primeira forma verbal hebraica esteja no singular, o sujeito coordenado e os verbos plurais seguintes indicam que Moisés e Arão participam da ação.
- source_word: וַיְבָרֲכוּ
  choice: abençoaram
  rationale: Equivalente direto e natural, sem especificar além do texto a forma da bênção.
- source_word: הָעָם / כָּל הָעָם
  choice: o povo / todo o povo
  rationale: Refere-se à comunidade reunida; “povo” é amplo, claro e fiel ao contexto.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Conserva o sentido de manifestação divina de כָּבוֹד e representa diretamente o nome pactual יְהוָה como “Yahweh”.
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: A forma nifal indica manifestação visível; “apareceu” é idiomático e adequado ao contexto teofânico.
- source_word: אֶל כָּל הָעָם
  choice: a todo o povo
  rationale: Reproduz de modo natural a direção da manifestação sem acrescentar detalhes interpretativos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Relação temporal entre as ações
  choice: depois ... E
  alternative: quando ... Então
  rationale: A sequência narrativa hebraica apresenta ações sucessivas. “Depois” torna clara a progressão, enquanto o “E” final preserva a coordenação sem impor uma relação causal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A pontuação divide a longa cadeia narrativa hebraica sem alterar a ordem dos acontecimentos.
