base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: pt
  text: Mas a carne e o couro ele queimou no fogo, fora do acampamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E a carne e a pele ele queimou no fogo, fora do acampamento.”'
    reason: Alternativas lexicais e discursivas para וְ, עוֹר e בָּאֵשׁ.
lexical_decisions:
- source_word: וְ/אֶת
  choice: Mas
  rationale: A conjunção dá continuidade à sequência, mas aqui também marca o contraste com o que foi queimado sobre o altar no versículo anterior; o marcador de objeto אֵת não é traduzido separadamente.
- source_word: הַ/בָּשָׂר
  choice: a carne
  rationale: בָּשָׂר designa a carne do animal. Em português atual, “carne” é natural e preciso neste contexto sacrificial.
- source_word: הָ/עוֹר
  choice: o couro
  rationale: עוֹר refere-se à pele retirada do animal; “couro” é adequado ao contexto, embora “pele” também seja possível.
- source_word: שָׂרַף
  choice: ele queimou
  rationale: O verbo expressa diretamente a ação de queimar, sem exigir uma nuance adicional de consumo completo.
- source_word: בָּ/אֵשׁ
  choice: no fogo
  rationale: A expressão hebraica pode indicar o meio ou âmbito da queima; “no fogo” é idiomático e preserva a formulação concreta.
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: fora do acampamento
  rationale: A expressão indica o espaço exterior ao acampamento israelita e mantém sua importância ritual e geográfica.
theological_decisions:
- issue: Linguagem de descarte ritual no contexto sacrificial
  choice: Descrever concretamente a queima da carne e do couro fora do acampamento.
  alternative: Inserir na tradução uma interpretação tipológica baseada em associações bíblicas posteriores.
  rationale: O hebraico relata o procedimento sacerdotal sem explicitar seu simbolismo; a tradução não deve acrescentar uma interpretação teológica ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “a carne e o couro ele queimou” conserva a topicalização e a ênfase do hebraico; “acampamento” mantém a terminologia ritual tradicional sem soar arcaica.
