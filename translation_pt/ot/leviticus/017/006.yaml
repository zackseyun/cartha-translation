source:
  edition: WLC
  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: pt
  text: E o sacerdote lançará o sangue[a] contra o altar de Yahweh, à entrada da tenda do encontro, e queimará a gordura como aroma agradável[b] a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “aspergirá” ou “arremessará” o sangue sobre o altar; o verbo hebraico se refere à aplicação ritual do sangue pelo sacerdote.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “aroma agradável”; tradicionalmente também traduzido por “aroma suave” ou “aroma de cheiro agradável”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: lançará
  rationale: No contexto sacrificial, זָרַק indica a aplicação ritual do sangue por um movimento de arremesso ou lançamento, mais forte que uma aspersão leve. “Lançará” preserva essa ação concreta em português natural.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente de כֹּהֵן, preservando o artigo definido.
- source_word: הַדָּם
  choice: o sangue
  rationale: Tradução direta do objeto definido no contexto do sacrifício.
- source_word: עַל מִזְבַּח יְהוָה
  choice: contra o altar de Yahweh
  rationale: Com זָרַק, עַל pode indicar o sangue lançado sobre ou contra o altar. “Contra” comunica melhor o movimento físico da aplicação ritual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliteração do nome divino, preservando o nome pessoal expresso no texto hebraico em vez de substituí-lo por um título.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: פֶּתַח designa a entrada ou abertura; “tenda do encontro” traduz de modo claro e formal אֹהֶל מוֹעֵד.
- source_word: וְהִקְטִיר
  choice: e queimará
  rationale: No vocabulário sacerdotal, o verbo se refere a queimar a oferta no altar, fazendo-a subir em fumaça. “Queimará” é conciso e compreensível.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: Refere-se às porções de gordura reservadas para serem queimadas no altar; “a gordura” mantém a formulação concreta do hebraico.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: A expressão sacrificial tradicional indica um aroma aceito ou agradável a Deus. Esta formulação é digna, clara e natural em português atual.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição apresenta o aroma como dirigido a Yahweh; a construção é direta e natural em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto sem substituí-lo por um título.
- issue: Sentido de רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma suave; aroma apaziguador
  rationale: A tradução mantém a linguagem antropomórfica e cultual do original sem explicar a frase como se descrevesse necessariamente propiciação ou mudança emocional em Deus.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A coordenação e a sequência ritual do hebraico foram preservadas; evitou-se vocabulário excessivamente técnico ou arcaico.
