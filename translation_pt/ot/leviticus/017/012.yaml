reference: Leviticus 17:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: pt
  text: 'Por isso, eu disse aos filhos de Israel[a]: “Nenhuma pessoa entre vocês comerá sangue, e o estrangeiro residente entre vocês não comerá sangue.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” ou “aos descendentes de Israel”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão baseada na razão apresentada no contexto anterior.
- source_word: אָמַרְתִּי
  choice: eu disse
  rationale: Mantém o valor básico do verbo e o aspecto passado da formulação hebraica.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a expressão masculina representativa do hebraico, que é compreensível e tradicional em português.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: Nenhuma pessoa entre vocês
  rationale: נֶפֶשׁ designa aqui cada indivíduo, não a 'alma' como parte imaterial; a formulação comunica claramente a proibição distributiva.
- source_word: לֹא תֹאכַל דָּם
  choice: comerá sangue
  rationale: Com 'nenhuma pessoa', o futuro com valor legal expressa a proibição sem parafrasear a referência explícita ao sangue.
- source_word: הַגֵּר
  choice: o estrangeiro residente
  rationale: גֵּר refere-se a um não israelita estabelecido no meio da comunidade, e não simplesmente a alguém de passagem ou de outra nacionalidade.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: entre vocês
  rationale: A ideia de residir já está expressa em 'estrangeiro residente'; esta formulação evita a repetição artificial, mantendo o sentido locativo da frase hebraica.
- source_word: לֹא יֹאכַל דָּם
  choice: não comerá sangue
  rationale: Reproduz a proibição legal paralela aplicada ao estrangeiro residente.
theological_decisions:
- issue: Designação pactual masculina em לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  alternative: aos israelitas; aos descendentes de Israel
  rationale: A escolha conserva a forma do hebraico sem afirmar que a norma se restringia aos homens, pois a expressão funciona como designação coletiva do povo.
translation_notes:
  register: Português moderno, claro e digno, com tom de legislação solene. 'Estrangeiro residente' comunica melhor o estatuto comunitário de גֵּר no português internacional contemporâneo; evitou-se o burocrático 'alienígena residente' e o impreciso 'forasteiro'.
