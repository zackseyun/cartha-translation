source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: pt
  text: Se qualquer homem da casa de Israel, ou qualquer estrangeiro residente entre eles[a], comer sangue de qualquer espécie, voltarei o meu rosto contra a pessoa que comer o sangue[b] e a eliminarei do meio do seu povo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “imigrante que mora entre eles”. O termo hebraico indica um estrangeiro estabelecido no meio da comunidade, não apenas alguém de passagem.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a néfesh que come”; neste contexto, néfesh significa a pessoa, isto é, o indivíduo infrator.'
    reason: lexical_alternative
  - marker: c
    text: “Eliminar do meio do seu povo” é uma fórmula de penalidade pactual. O texto não especifica aqui se significa morte, expulsão ou outra forma de juízo divino.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: Se qualquer homem
  rationale: A repetição idiomática de אִישׁ tem força distributiva, expressa naturalmente por “qualquer homem”; a construção condicional em português acomoda a oração relativa e a consequência.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: da casa de Israel
  rationale: Preserva a expressão formal e pactual hebraica sem reduzi-la simplesmente a “Israel”.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: ou qualquer estrangeiro residente entre eles
  rationale: גֵּר designa um não israelita estabelecido no meio da comunidade, não um visitante passageiro. “Estrangeiro residente” comunica essa condição em português atual.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: comer sangue de qualquer espécie
  rationale: Mantém o verbo comum “comer” e torna explícita a abrangência de כָּל דָּם, isto é, sangue de qualquer tipo.
- source_word: וְנָתַתִּי פָנַי
  choice: voltarei o meu rosto contra
  rationale: Preserva a imagem antropomórfica e o sentido idiomático de oposição e juízo divinos.
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: contra a pessoa que comer
  rationale: Neste contexto jurídico, נֶפֶשׁ indica o indivíduo infrator; “pessoa” evita a possível leitura metafísica indevida de “alma”.
- source_word: אֶת הַדָּם
  choice: o sangue
  rationale: O artigo retoma o sangue cuja ingestão acabou de ser proibida.
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: e a eliminarei
  rationale: O pronome feminino retoma “a pessoa”. “Eliminar do meio” conserva a gravidade da fórmula sem definir se o meio do juízo é morte, expulsão ou outra ação divina.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: do meio do seu povo
  rationale: Reproduz de modo natural o sentido de retirada do interior da comunidade à qual o infrator pertence.
theological_decisions:
- issue: Sentido da fórmula penal וְהִכְרַתִּי (“cortar/eliminar”)
  choice: “a eliminarei do meio do seu povo”, sem especificar o mecanismo
  alternative: “a executarei”, “a expulsarei” ou “farei que seja extirpada por juízo divino”
  rationale: O versículo anuncia um grave juízo pactual, mas não define aqui se ele consiste em morte, expulsão ou outra forma de ação divina. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se “casa de Israel” e a imagem de Deus voltar o rosto contra alguém, enquanto expressões jurídicas potencialmente obscuras são vertidas com naturalidade e esclarecidas em notas.
