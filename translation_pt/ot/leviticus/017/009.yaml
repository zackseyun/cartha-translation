id: LEV.17.9
reference: Leviticus 17:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: pt
  text: e não o levar à entrada da tenda do encontro para oferecê-lo a Yahweh[a], esse homem será eliminado do meio do seu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “para fazê-lo para Yahweh”; neste contexto, a expressão hebraica se refere à apresentação do sacrifício.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica traduzida como “será eliminado” é uma fórmula jurídica cuja pena exata não é especificada aqui; pode indicar exclusão da comunidade da aliança ou juízo divino direto.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: entrada
  rationale: Designa a abertura ou o ponto de acesso; “entrada” é natural em português e adequado ao contexto do santuário.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Designação tradicional e transparente do santuário móvel; preserva a ideia de encontro associada a מוֹעֵד.
- source_word: יְבִיאֶנּוּ
  choice: o levar
  rationale: O sufixo retoma o animal sacrificial do contexto anterior. A forma pronominal mantém a ação concreta sem acrescentar interpretação ritual.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: para oferecê-lo a Yahweh
  rationale: Literalmente, “para fazê-lo para Yahweh”; no contexto sacrificial, עשה funciona idiomaticamente para realizar ou apresentar o sacrifício. A formulação escolhida comunica esse sentido com clareza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וְנִכְרַת
  choice: será eliminado
  rationale: A forma passiva expressa a exclusão ou supressão indicada pela fórmula jurídica, sem determinar o mecanismo exato da pena; a nota preserva sua amplitude interpretativa.
- source_word: הָאִישׁ הַהוּא
  choice: esse homem
  rationale: Reproduz o masculino singular e o valor demonstrativo da expressão jurídica hebraica.
- source_word: מֵעַמָּיו
  choice: do meio do seu povo
  rationale: Expressa de modo idiomático em português a separação do indivíduo de sua comunidade, preservando o referente coletivo.
theological_decisions:
- issue: Sentido da pena וְנִכְרַת (“ser cortado”)
  choice: “será eliminado do meio do seu povo”, com nota explicativa que não especifica o mecanismo
  alternative: “será excluído do seu povo”; “será morto”; “será extirpado”
  rationale: A fórmula jurídica hebraica não define aqui se a sanção ocorre por exclusão comunitária, morte ou juízo divino. A tradução evita restringi-la, e a nota explicita a ambiguidade genuína.
- issue: Gênero de הָאִישׁ הַהוּא
  choice: “esse homem”
  alternative: “essa pessoa”; “esse indivíduo”
  rationale: O hebraico emprega uma expressão jurídica masculina singular; a tradução conserva essa forma sem generalização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a continuidade com o versículo anterior. O nome divino é transliterado como “Yahweh”, e a linguagem jurídica preserva a ambiguidade da pena.
