  text: אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל אֲשֶׁ֨ר יִשְׁחַ֜ט שׁ֥וֹר אוֹ כֶ֛שֶׂב אוֹ עֵ֖ז בַּֽ/מַּחֲנֶ֑ה א֚וֹ אֲשֶׁ֣ר יִשְׁחַ֔ט מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: pt
  text: Qualquer homem da casa de Israel que abater um boi, uma ovelha ou uma cabra no acampamento, ou que abater um deles fora do acampamento —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Qualquer homem
  rationale: 'A repetição idiomática do substantivo tem força distributiva: “qualquer homem” ou “cada homem”. A tradução preserva a forma masculina do hebraico e sua função genérica no âmbito da sociedade israelita.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: da casa de Israel
  rationale: Mantém literalmente o idioma nacional e pactual “casa de Israel”, sem reduzi-lo a uma simples designação étnica.
- source_word: יִשְׁחַט
  choice: abater
  rationale: O verbo denota o abate de um animal, muitas vezes em contexto sacrificial. “Abater” é corrente em português e comunica melhor esse sentido específico do que o termo geral “matar”.
- source_word: שׁוֹר
  choice: boi
  rationale: Designação singular natural para o bovino nessa lista de animais passíveis de sacrifício, sem restringir indevidamente o termo a “touro” nem usar o coletivo “gado”.
- source_word: כֶשֶׂב
  choice: ovelha
  rationale: O termo designa genericamente um animal ovino, não necessariamente um filhote; por isso, “ovelha” é preferível a “cordeiro”.
- source_word: עֵז
  choice: cabra
  rationale: Equivalente português comum e preciso para o caprino mencionado em contextos sacrificiais.
- source_word: בַּמַּחֲנֶה
  choice: no acampamento
  rationale: Tradução locativa direta, natural e precisa.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: Expressa de modo idiomático o local externo ao acampamento indicado pelo hebraico.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: que ... ou que
  rationale: Preserva o paralelismo da formulação legal hebraica e soa natural em português.
- source_word: '[objeto implícito após o segundo יִשְׁחַט]'
  choice: a abater
  rationale: O pronome retoma a série singular de animais, cujo referente mais próximo, “cabra”, é feminino em português. Sua inclusão esclarece a elipse hebraica sem acrescentar conteúdo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura jurídica preservada. O travessão final mantém a frase aberta para a consequência legal no versículo seguinte. Não se acrescentou nota à expressão “qualquer homem”, pois a própria tradução comunica adequadamente sua força distributiva; a referência genérica permanece transparente no contexto.
