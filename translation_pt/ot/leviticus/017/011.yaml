  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: pt
  text: Pois a vida[a] da carne está no sangue, e eu o dei a vocês sobre o altar para fazer expiação pelas vidas de vocês, pois é o sangue que faz expiação pela vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico néfesh pode significar “vida”, “ser”, “pessoa” ou, em certos contextos, “alma”. Neste versículo, o sentido é “vida”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois o sangue faz expiação por meio da vida que há nele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ / נַפְשֹׁתֵיכֶם / בַּנֶּפֶשׁ
  choice: vida / vidas / pela vida
  rationale: Neste contexto sacrificial, נֶפֶשׁ designa a vida animada, não necessariamente uma alma imaterial. A repetição de “vida” mantém o vínculo lexical e argumentativo entre a vida, o sangue e a expiação.
- source_word: הַבָּשָׂר
  choice: a carne
  rationale: “Carne” é a correspondência direta e tradicional, referindo-se aqui à existência corpórea da criatura viva.
- source_word: בַּדָּם
  choice: no sangue
  rationale: Reproduz naturalmente a preposição com artigo e expressa que a vida da carne está no sangue.
- source_word: נְתַתִּיו לָכֶם
  choice: eu o dei a vocês
  rationale: O pronome masculino retoma “sangue”. O perfeito hebraico é vertido pelo pretérito perfeito, natural em português e adequado ao ato divino de provisão exposto no contexto.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: Preserva o cenário cultual e a relação espacial indicada pelo hebraico.
- source_word: לְכַפֵּר / יְכַפֵּר
  choice: fazer expiação / faz expiação
  rationale: Mantém consistente a terminologia cultual de כפר sem impor uma teoria específica sobre o mecanismo da expiação.
- source_word: בַּנֶּפֶשׁ
  choice: pela vida
  rationale: Conserva de forma compacta a ambiguidade da preposição ב, que pode indicar meio, fundamento ou associação. A nota apresenta uma explicitação instrumental possível sem incorporá-la obrigatoriamente ao texto.
theological_decisions:
- issue: Sentido de נֶפֶשׁ na legislação sacrificial
  choice: vida
  alternative: alma; pessoa; ser
  rationale: O argumento do versículo relaciona diretamente נֶפֶשׁ ao sangue como portador da vida. “Alma” poderia sugerir uma distinção antropológica posterior que o texto hebraico não exige.
- issue: Força de בַּנֶּפֶשׁ na oração final
  choice: pela vida
  alternative: por meio da vida que há nele; por causa da vida; em virtude da vida
  rationale: 'A construção hebraica é concisa e discutida. A formulação principal mantém sua tensão: o sangue faz expiação em relação à vida vinculada a ele. A nota registra uma leitura instrumental plausível.'
- issue: Referente do pronome em נְתַתִּיו
  choice: o sangue
  alternative: a vida
  rationale: A forma pronominal hebraica é masculina, favorecendo “o sangue” como referente, embora a proximidade temática entre sangue e vida permaneça central.
translation_notes:
  register: Português moderno, claro e solene, com “vocês” para ampla legibilidade brasileira. A expressão deliberadamente marcada “faz expiação pela vida” preserva a concisão e a ambiguidade do hebraico; a leitura mais explicitamente instrumental é oferecida em nota.
