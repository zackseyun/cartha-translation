  rationale: 'A única alteração necessária é idiomática e semântica: «após os quais» transmite o uso hebraico de «prostituir-se após» como seguimento infiel no culto, enquanto evita a conotação espacial predominante de «atrás dos quais». As âncoras das notas foram preservadas e a nota b foi atualizada para refletir exatamente o texto revisto.'
