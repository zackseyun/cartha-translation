  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: pt
  text: Não sacrificarão mais os seus sacrifícios aos demônios em forma de bode[a], após os quais se prostituem[b]. Este será para eles um estatuto permanente[c], por todas as suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos ídolos em forma de bode” ou “aos sátiros”; o termo hebraico se refere a seres semelhantes a bodes associados ao culto ilícito.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “após os quais se prostituem”; metáfora de infidelidade religiosa ou idolatria.'
    reason: cultural_note
  - marker: c
    text: Ou “um estatuto perpétuo” ou “um estatuto para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: sacrificarão ... os seus sacrifícios
  rationale: A construção legal negativa é expressa como proibição, e a repetição cognata do verbo e do substantivo hebraicos é preservada.
- source_word: עוֹד
  choice: não ... mais
  rationale: No contexto, indica a interrupção de uma prática anterior ou corrente.
- source_word: לַשְּׂעִירִם
  choice: aos demônios em forma de bode
  rationale: O termo significa literalmente seres peludos ou bodes, mas neste contexto cultual provavelmente designa entidades demoníacas associadas à figura do bode; a formulação evita a associação greco-romana específica de 'sátiros'.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: atrás dos quais se prostituem
  rationale: Preserva tanto a imagem hebraica de seguir outros objetos de culto quanto a metáfora sexual de infidelidade religiosa.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: Expressa duração continuada na fórmula legal da aliança sem fazer 'eterno' carregar uma precisão metafísica maior que a exigida pelo idioma.
- source_word: לְדֹרֹתָם
  choice: por todas as suas gerações
  rationale: Formulação natural em português para a aplicação continuada às sucessivas gerações.
theological_decisions:
- issue: Referente de שְּׂעִירִם no culto ilícito
  choice: seres demoníacos com forma ou imagem de bode
  alternative: bodes literais, ídolos-bodes ou sátiros
  rationale: O contexto sacrificial e a acusação de prostituição cultual favorecem um referente sobrenatural ou idolátrico, mas a nota registra as alternativas lexicais.
- issue: Força da metáfora זֹנִים
  choice: manter explicitamente 'se prostituem'
  alternative: são infiéis ou praticam idolatria
  rationale: O hebraico emprega linguagem sexual forte para a infidelidade religiosa; substituí-la por uma abstração eliminaria parte da tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se a repetição deliberada de 'sacrificar/sacrifícios' e a metáfora incisiva de prostituição religiosa. A expressão 'demônios em forma de bode' privilegia clareza sem importar a mitologia específica sugerida por 'sátiros'.
