  text: וְ/אִם֙ לֹ֣א יְכַבֵּ֔ס וּ/בְשָׂר֖/וֹ לֹ֣א יִרְחָ֑ץ וְ/נָשָׂ֖א עֲוֺנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: pt
  text: Mas, se não lavar as suas roupas nem banhar o seu corpo[a], levará sobre si a sua culpa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a sua carne». Aqui, a expressão se refere a banhar o corpo.
    reason: lexical_alternative
  - marker: b
    text: Ou «carregará a sua iniquidade» ou «sofrerá a pena pela sua iniquidade». A expressão jurídica hebraica pode incluir tanto a culpa quanto sua consequência.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: No contexto, a conjunção introduz o caso negativo em contraste com o procedimento de purificação do versículo anterior; «Mas, se» expressa naturalmente essa força adversativa e condicional.
- source_word: יְכַבֵּס
  choice: lavar as suas roupas
  rationale: O piel de כבס normalmente se refere à lavagem de roupas. Embora o objeto esteja elíptico no hebraico, ele é recuperado do versículo anterior e do uso normal do verbo nesta fórmula legal.
- source_word: וּבְשָׂרוֹ
  choice: o seu corpo
  rationale: בשר significa literalmente «carne», mas, em contextos de lavagem ritual, refere-se idiomaticamente ao corpo da pessoa. A escolha é clara e natural em português moderno.
- source_word: יִרְחָץ
  choice: banhar
  rationale: רחץ indica aqui lavar o corpo. «Banhar» distingue essa ação da lavagem das roupas e comunica com clareza o procedimento ritual.
- source_word: וְנָשָׂא
  choice: levará sobre si
  rationale: A construção apresenta a consequência de não cumprir as lavagens exigidas. «Levará sobre si» mantém o caráter jurídico da expressão e se liga naturalmente a «culpa».
- source_word: עֲוֹנוֹ
  choice: a sua culpa
  rationale: עון pode denotar iniquidade, culpa ou a responsabilidade e consequência decorrentes do pecado. «A sua culpa» é natural em português, enquanto a nota preserva a amplitude da expressão hebraica.
theological_decisions:
- issue: Sentido da fórmula jurídica «levar עון»
  choice: «levará sobre si a sua culpa», sem especificar uma pena concreta
  alternative: «carregará a sua iniquidade» ou «sofrerá a pena pela sua iniquidade»
  rationale: A expressão hebraica pode abranger tanto a culpabilidade quanto sua consequência. A tradução conserva essa tensão jurídica e teológica sem reduzi-la apenas à falta moral nem explicitar uma penalidade não declarada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom jurídico do texto e explicita apenas o objeto elíptico «roupas», recuperado do contexto imediato.
