id: LEV.17.5
reference: Leviticus 17:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: pt
  text: para que os filhos de Israel[a] tragam seus sacrifícios, que oferecem em campo aberto, e os levem a Yahweh, à entrada da tenda do encontro e ao sacerdote, e os sacrifiquem como ofertas de paz[b] a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ofertas de comunhão” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: para que
  rationale: Introduz a finalidade da ordem anterior de modo natural em português, preservando a força intencional da construção hebraica.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar hebraica e sua forma masculina plural; “os israelitas” é uma alternativa idiomática.
- source_word: זִבְחֵיהֶם
  choice: os sacrifícios
  rationale: Expressa com clareza o sentido cultual do substantivo זֶבַח; o possessivo é recuperado pelo contexto e pela construção verbal em português.
- source_word: אֲשֶׁר הֵם זֹבְחִים
  choice: que oferecem
  rationale: Em contexto sacrificial, “oferecem” comunica naturalmente a ação habitual do particípio sem produzir a repetição pesada de “sacrifícios que sacrificam”.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: em campo aberto
  rationale: Representa idiomaticamente a ação realizada fora da área do santuário, sem reproduzir de forma obscura o hebraísmo “sobre a face do campo”.
- source_word: וְהֱבִיאֻם
  choice: e os levem
  rationale: Prossegue a oração de finalidade e explicita o sufixo pronominal, cujo referente são os sacrifícios.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando sua função como nome próprio da aliança.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Tradução clara da localização do santuário; “tenda do encontro” preserva a ideia de encontro designado associada a מוֹעֵד.
- source_word: אֶל הַכֹּהֵן
  choice: ao sacerdote
  rationale: Conserva o artigo definido do hebraico e aponta para o sacerdote oficiante no santuário.
- source_word: וְזָבְחוּ
  choice: e os sacrifiquem
  rationale: Mantém o sentido cultual específico do verbo זבח e a coordenação com os verbos anteriores dentro da oração de finalidade.
- source_word: זִבְחֵי שְׁלָמִים
  choice: ofertas de paz
  rationale: Designa de forma tradicional e compreensível essa categoria sacrificial, preservando sua associação lexical com paz, integridade e bem-estar.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Sentido de זִבְחֵי שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão; ofertas de bem-estar
  rationale: A expressão nomeia uma categoria sacrificial cujo alcance pode envolver paz, bem-estar e comunhão. A opção principal não restringe esse sacrifício a uma formulação doutrinária específica, e a nota registra alternativas legítimas.
- issue: Referência de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A forma masculina plural é conservada como expressão coletiva tradicional do povo da aliança, sem afirmar que a aplicação do texto se limitava conceitualmente a indivíduos do sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe preserva a ligação final com o versículo anterior. Os marcadores foram colocados junto às expressões às quais suas notas se referem.
