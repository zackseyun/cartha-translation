  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O wayyiqtol de דבר introduz um novo ato de fala. “Falou” é natural em português e adequado à fórmula narrativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; “a” é a forma idiomática na construção “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula, o infinitivo introduz o conteúdo da fala. Em português atual, os dois-pontos expressam naturalmente essa função e evitam a formulação pouco idiomática “falou... dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e segue uma transliteração acadêmica amplamente aceita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno. Os dois-pontos reproduzem de modo idiomático a função introdutória de לֵאמֹר; o versículo permanece aberto, pois a fala continua no versículo seguinte.
