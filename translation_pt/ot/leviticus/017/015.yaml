  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: pt
  text: Toda pessoa que comer um animal encontrado morto ou dilacerado por feras[a], seja nativa, seja estrangeira residente[b], deverá lavar suas roupas, banhar-se em água e ficará impura até o entardecer; depois ficará pura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma carcaça ou um animal dilacerado”. O primeiro termo hebraico se refere a um animal que morreu sem ter sido devidamente abatido.
    reason: lexical_alternative
  - marker: b
    text: Isto é, uma estrangeira ou um estrangeiro estabelecido no meio da comunidade; também se pode traduzir por “imigrante residente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: pessoa
  rationale: No contexto jurídico, designa o indivíduo, não especificamente uma alma imaterial; “pessoa” é natural e mantém a construção inclusiva do hebraico.
- source_word: נְבֵלָה
  choice: animal encontrado morto
  rationale: Expressa a carcaça de um animal que morreu sem o abate apropriado, comunicando a categoria ritual com mais clareza do que o termo técnico “carcaça” isoladamente.
- source_word: טְרֵפָה
  choice: dilacerado por feras
  rationale: O termo se refere a um animal atacado e despedaçado por predadores; a formulação preserva tanto o estado do animal quanto a causa implícita.
- source_word: בָּאֶזְרָח
  choice: natural da terra
  rationale: Designa quem pertence por nascimento à comunidade de Israel. A expressão é compreensível em português e evita a conotação política moderna de “cidadão”.
- source_word: בַגֵּר
  choice: estrangeiro residente
  rationale: גֵּר indica um estrangeiro estabelecido no meio da comunidade, e não um visitante de passagem; “estrangeiro residente” transmite essa condição jurídica e social.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: deverá lavar suas roupas
  rationale: Apresenta com clareza a ação ritual exigida, em linguagem jurídica atual e natural.
- source_word: וְרָחַץ בַּמַּיִם
  choice: banhar-se em água
  rationale: O verbo se refere à lavagem do corpo; “banhar-se” preserva esse sentido sem acrescentar detalhes não expressos.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: ficará impura até o entardecer
  rationale: “Impura” concorda naturalmente com “pessoa” e preserva a categoria ritual temporária indicada pelo hebraico.
- source_word: וְטָהֵר
  choice: depois ficará pura
  rationale: Indica a passagem subsequente para o estado de pureza após a lavagem e o período determinado; “depois” torna natural a sequência implícita.
theological_decisions:
- issue: Natureza da impureza na legislação levítica
  choice: Traduzir טָמֵא/טָהֵר por “impura/pura” em sentido ritual.
  alternative: “contaminada/purificada”
  rationale: O texto trata do estado cultual temporário decorrente do consumo, sem afirmar por esses termos, em si mesmos, culpa moral ou depravação pessoal.
- issue: Alcance social da norma
  choice: Manter a aplicação tanto ao natural da terra quanto ao estrangeiro residente.
  alternative: Generalizar como “qualquer habitante”
  rationale: A distinção jurídica do hebraico é relevante e mostra explicitamente que a exigência abrange os dois grupos, sem apagar suas designações próprias.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação preserva o estilo jurídico do texto, mas evita construções excessivamente arcaicas. O feminino em “impura/pura” decorre da concordância com “pessoa”, sem restringir a norma a mulheres.
