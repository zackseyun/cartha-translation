base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: pt
  text: 'Pois a vida de toda carne é o seu sangue; o seu sangue está em sua vida[a]. Por isso eu disse aos filhos de Israel[b]: “Não comam o sangue de carne alguma, pois a vida de toda carne é o seu sangue.” Todo aquele que o comer será cortado[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é condensado e também pode ser traduzido por “em sua vida ele está”, referindo-se ao sangue, ou, de modo mais interpretativo, “seu sangue é sua vida”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, os israelitas, o povo de Israel.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica não especifica aqui se a pessoa seria morta, excluída da comunidade ou atingida por juízo divino.
    reason: theological_ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: vida
  rationale: Neste contexto alimentar e sacrificial, designa a vida que anima a criatura, não uma “alma” imaterial. “Vida” preserva a lógica da proibição do sangue.
- source_word: בָּשָׂר
  choice: carne
  rationale: Mantém a expressão hebraica repetida “toda carne” e seu sentido abrangente de seres vivos em sua existência corpórea.
- source_word: דָּם / דָּמוֹ
  choice: sangue / seu sangue
  rationale: Tradução direta do termo central tanto para a proibição quanto para sua justificativa.
- source_word: בְנַפְשׁוֹ הוּא
  choice: nele está sua vida
  rationale: Expressa em português compreensível a ligação estreita entre sangue e vida, ao mesmo tempo que a nota preserva a formulação hebraica comprimida e suas alternativas.
- source_word: וָאֹמַר
  choice: Por isso eu disse
  rationale: O conectivo faz avançar o argumento do princípio sobre sangue e vida para a ordem dada a Israel.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a forma hebraica tradicional; a nota oferece o equivalente idiomático e coletivo.
- source_word: לֹא תֹאכֵלוּ
  choice: Não comam
  rationale: Forma direta, atual e inequívoca de expressar a proibição dirigida ao plural, sem rigidez arcaica.
- source_word: אֹכְלָיו
  choice: Todo aquele que o comer
  rationale: Reproduz o valor distributivo do particípio e identifica naturalmente o sangue como referente do pronome.
- source_word: יִכָּרֵת
  choice: será cortado
  rationale: Preserva a fórmula jurídica pactual sem definir se a sanção significa morte, exclusão comunitária ou juízo divino.
theological_decisions:
- issue: Sentido de נֶפֶשׁ em relação ao sangue
  choice: “Vida”, apresentando o sangue como inseparavelmente ligado à vida da criatura.
  alternative: “Alma”, em sentido metafísico.
  rationale: O versículo fundamenta a proibição na relação entre vida e sangue, não em uma antropologia desenvolvida da alma.
- issue: Relação sintática em דָּמוֹ בְנַפְשׁוֹ הוּא
  choice: “seu sangue; nele está sua vida”, com nota que conserva a ambiguidade da construção.
  alternative: “seu sangue está em sua vida” ou “seu sangue é sua vida”.
  rationale: A construção hebraica é comprimida. O texto principal comunica a ligação sem transformar silenciosamente uma das análises possíveis na única leitura.
- issue: Natureza da pena expressa por יִכָּרֵת
  choice: Manter a expressão “será cortado”.
  alternative: “será executado”, “será excluído” ou “será eliminado”.
  rationale: O texto não especifica aqui o mecanismo da sanção; uma formulação mais explícita resolveria indevidamente uma questão debatida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa imperativo atual (“Não comam”) e conserva as expressões bíblico-jurídicas “toda carne”, “filhos de Israel” e “será cortado”, explicando em notas os pontos em que a literalidade poderia obscurecer a ambiguidade do hebraico.
