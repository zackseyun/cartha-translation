base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: pt
  text: 'e não o trouxer à entrada da tenda do encontro, para apresentá-lo como oferta a Yahweh diante do tabernáculo de Yahweh, sangue lhe será imputado[a]: derramou sangue. Esse homem será eliminado do meio do seu povo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “sangue será considerado para aquele homem”; isto é, ele será responsabilizado por derramamento de sangue. Outra tradução possível: “será considerado culpado de derramamento de sangue”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida por “será eliminado” não especifica aqui se a pena é morte, expulsão ou outra forma de remoção da comunidade da aliança.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: entrada da tenda do encontro
  rationale: Traduz פֶּתַח de modo natural como “entrada” e mantém אֹהֶל מוֹעֵד como a designação cultual “tenda do encontro”.
- source_word: הֱבִיאוֹ
  choice: o trouxer
  rationale: O hifil de בוא significa “trazer”; o pronome retoma o animal abatido mencionado no versículo anterior.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: para apresentá-lo como oferta
  rationale: Expressa o ato sacrificial de fazer chegar/apresentar uma oferta sem a repetição pouco natural “oferecer uma oferta”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Representa diretamente o nome divino יהוה, conforme a camada inglesa fornecida e sem substituí-lo por um título.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: diante do tabernáculo de Yahweh
  rationale: לִפְנֵי tem sentido espacial de “diante de”, e מִשְׁכָּן é o santuário ou tabernáculo.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: será considerado culpado de derramamento de sangue
  rationale: Comunica em português corrente a força jurídica do hebraísmo literalmente construído como “sangue será considerado para aquele homem”, mantendo a ligação com a frase seguinte.
- source_word: דָּם שָׁפָךְ
  choice: derramou sangue
  rationale: Preserva a expressão hebraica direta e sua força jurídico-moral.
- source_word: וְנִכְרַת
  choice: será eliminado
  rationale: Traduz a exclusão expressa pelo nifal de כרת sem determinar o mecanismo específico da pena.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: do meio do seu povo
  rationale: Formulação natural e fiel para a expressão de remoção da comunidade.
theological_decisions:
- issue: Sentido jurídico de דָּם יֵחָשֵׁב
  choice: será considerado culpado de derramamento de sangue
  alternative: sangue lhe será imputado
  rationale: A escolha torna inteligível a responsabilidade por sangue em português moderno; a nota conserva a forma literal e a alternativa mais formal.
- issue: Natureza da pena expressa por וְנִכְרַת
  choice: será eliminado do meio do seu povo
  alternative: será cortado do meio do seu povo
  rationale: O texto não esclarece se se trata de morte, expulsão ou outra forma de remoção da aliança; a tradução evita especificar o mecanismo, e a nota registra essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase continua a condição iniciada no versículo anterior. Mantém-se o masculino singular “esse homem”, correspondente ao hebraico, e preserva-se a ambiguidade jurídica da pena.
