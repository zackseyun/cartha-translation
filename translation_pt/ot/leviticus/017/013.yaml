revisions:
- from: Se algum homem dos filhos de Israel, ou algum estrangeiro residente que vive no meio deles, caçar um animal selvagem ou uma ave que se pode comer, derramará o sangue e o cobrirá com terra.[a]
  to: Todo homem dentre os filhos de Israel, ou o estrangeiro residente que vive entre eles, que caçar um animal selvagem ou uma ave que for comestível derramará o seu sangue e o cobrirá com terra.[a][b]
  rationale: A revisão substitui «algum homem» por «todo homem» para refletir a força distributiva da duplicação hebraica, ajusta a coordenação para maior transparência e acrescenta uma nota para o termo ger. Mantém-se o futuro de valor prescritivo, a referência provável do pronome ao sangue e a opção «terra» para עפר.
