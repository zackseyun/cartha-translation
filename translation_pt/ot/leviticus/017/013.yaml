  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: pt
  text: Todo homem dentre os filhos de Israel, ou o estrangeiro residente que vive entre eles, que caçar um animal selvagem ou uma ave que for comestível derramará o seu sangue e o cobrirá com terra.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o estrangeiro que reside entre eles». O hebraico ger designa um não israelita residente na comunidade.'
    reason: lexical_alternative
  - marker: b
    text: O pronome em «o cobrirá» refere-se mais naturalmente ao sangue. «Terra» também pode ser traduzido por «pó».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: algum homem
  rationale: A repetição distributiva expressa qualquer indivíduo do grupo; “algum homem” preserva o referente masculino e soa natural na formulação jurídica.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Mantém a linguagem familiar e pactual do hebraico sem substituí-la pelo gentílico mais geral “israelitas”.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: algum estrangeiro residente que vive no meio deles
  rationale: גר designa um não israelita estabelecido na comunidade; a formulação comunica a categoria jurídica em português atual e conserva, de modo natural, a relação entre o substantivo e o verbo hebraicos.
- source_word: יָצוּד צֵיד
  choice: caçar
  rationale: O cognato verbo-substantivo hebraico é expresso idiomaticamente pelo verbo “caçar”; o objeto seguinte especifica a caça.
- source_word: חַיָּה אוֹ עוֹף
  choice: um animal selvagem ou uma ave
  rationale: No contexto de caça, חיה indica animal selvagem; “ave” é a equivalência natural e digna de עוף.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: que se pode comer
  rationale: Expressa o passivo/permissivo, isto é, uma espécie apta ou permitida para alimento, sem definir além do que o contexto afirma.
- source_word: וְשָׁפַךְ אֶת דָּמוֹ
  choice: derramará o sangue
  rationale: O perfeito com waw tem força prescritiva no contexto legal. Em português bíblico-jurídico, o futuro comunica a obrigação sem exigir a inserção de “deverá”.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: e o cobrirá com terra
  rationale: O pronome retoma mais naturalmente “sangue”; עפר pode indicar pó ou terra solta, e “terra” é mais natural para o ato concreto de cobrir.
theological_decisions:
- issue: Referente do sufixo em וְכִסָּהוּ
  choice: o sangue deve ser coberto
  alternative: o animal deve ser coberto ou enterrado
  rationale: O antecedente mais próximo e natural é “sangue”. A tradução mantém o pronome, enquanto a nota explicita a referência mais provável e reconhece a ambiguidade gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção legal conserva certa solenidade, mas evita arcaísmos e terminologia migratória contemporânea potencialmente anacrônica.
