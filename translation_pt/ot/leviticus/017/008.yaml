  text: וַ/אֲלֵ/הֶ֣ם תֹּאמַ֔ר אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל וּ/מִן הַ/גֵּ֖ר אֲשֶׁר יָג֣וּר בְּ/תוֹכָ֑/ם אֲשֶׁר יַעֲלֶ֥ה עֹלָ֖ה אוֹ זָֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: pt
  text: 'E diga-lhes: Qualquer homem da casa de Israel[a], ou qualquer estrangeiro residente que vive entre eles[b], que oferecer um holocausto ou um sacrifício—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “qualquer homem” traduz uma expressão distributiva repetida (“homem, homem”), fórmula jurídica que considera cada caso individual.
    reason: lexical_alternative
  - marker: b
    text: Ou “forasteiro”; o hebraico se refere a um não israelita que residia entre o povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: E diga-lhes
  rationale: O waw mantém a ligação com a instrução anterior, enquanto o imperfeito tem força diretiva. Em português atual, o imperativo comunica essa ordem com naturalidade e dignidade.
- source_word: אִישׁ אִישׁ
  choice: Qualquer homem
  rationale: A repetição distributiva de אִישׁ é uma fórmula jurídica que abrange cada homem individualmente; “qualquer homem” preserva tanto o gênero gramatical quanto a força distributiva.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: da casa de Israel
  rationale: Preserva a expressão coletiva e pactual “casa de Israel”, sem reduzi-la simplesmente a “Israel”.
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: ou dos estrangeiros residentes que vivem entre eles
  rationale: גֵּר designa o não israelita estabelecido no meio de Israel. “Estrangeiros residentes” expressa essa categoria social e jurídica, enquanto “vivem entre eles” traduz naturalmente a oração relativa ligada a גּוּר.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: que oferecer
  rationale: O hifil de עלה, com objetos sacrificiais, significa apresentar algo como oferta; “oferecer” é a formulação sacrificial natural em português.
- source_word: עֹלָה
  choice: um holocausto
  rationale: “Holocausto” é o termo bíblico português estabelecido para a oferta inteiramente queimada, distinguindo-a de outros sacrifícios.
- source_word: אוֹ זָבַח
  choice: ou um sacrifício
  rationale: Aqui זָבַח funciona nominalmente e indica um sacrifício de animal, em contraste com o holocausto; “sacrifício” é conciso e não restringe indevidamente sua espécie.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ אִישׁ
  choice: Qualquer homem
  alternative: Qualquer pessoa; quem quer que
  rationale: A forma hebraica é masculina singular e distributiva em linguagem jurídica. A tradução conserva essa forma representativa sem apagar o gênero expresso no texto.
- issue: Categoria social e cultual גֵּר
  choice: estrangeiros residentes
  alternative: forasteiros; peregrinos
  rationale: O termo se refere a não israelitas que residiam entre Israel e estavam sujeitos a essas normas cultuais. “Estrangeiros residentes” evita sugerir mero visitante ou viajante e não acrescenta uma identidade teológica ausente do termo.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Mantém a estrutura de uma norma jurídica e o travessão final, pois a frase continua no versículo seguinte.
