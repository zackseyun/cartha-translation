  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: pt
  text: 'Fale a Arão, a seus filhos e a todos os filhos de Israel[a] e diga-lhes: “Esta é a palavra que Yahweh ordenou[b], dizendo:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os israelitas”.'
    reason: lexical_alternative
  - marker: b
    text: “Esta é a palavra” também pode ser traduzido por “Esta é a coisa” ou “Este é o assunto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O piel imperativo masculino singular dirige a Moisés uma ordem direta; “Fale” é natural, claro e preserva a força imperativa.
- source_word: בָּנָיו
  choice: os filhos dele
  rationale: Refere-se especificamente aos filhos homens de Arão; “dele” evita qualquer ambiguidade momentânea sobre o referente do possessivo.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: Mantém a forma familiar do etnônimo hebraico, sem ocultar sua expressão masculina plural; a nota registra a alternativa idiomática.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Reproduz a segunda instrução coordenada com uma forma imperativa natural em português.
- source_word: זֶה הַדָּבָר
  choice: Esta é a ordem
  rationale: דָּבָר pode significar palavra, assunto ou coisa; neste contexto, introduz especificamente aquilo que Yahweh ordenou, e “ordem” comunica essa função com naturalidade.
- source_word: צִוָּה
  choice: deu
  rationale: Com “ordem” como núcleo nominal, “deu” expressa idiomaticamente o perfeito de צוה e apresenta a determinação divina que será enunciada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo que começa no versículo seguinte; em português atual, os dois-pontos desempenham naturalmente essa função sem a fórmula pesada “dizendo”.
theological_decisions:
- issue: Representação do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva sem substituí-lo por um título.
- issue: Forma familiar בני ישראל
  choice: todos os filhos de Israel
  alternative: todos os israelitas
  rationale: A tradução principal conserva a imagem genealógica e a forma masculina do hebraico, enquanto a nota oferece o equivalente étnico idiomático.
- issue: Valor de זֶה הַדָּבָר na fórmula introdutória
  choice: Esta é a ordem
  alternative: Esta é a palavra; Este é o assunto; Esta é a coisa
  rationale: A amplitude lexical de דָּבָר é real, mas a oração relativa “que Yahweh deu” e o discurso legislativo favorecem aqui a referência à ordem divina, sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação substitui o hebraísmo final “dizendo” por uma introdução natural ao discurso que continua no versículo seguinte.
