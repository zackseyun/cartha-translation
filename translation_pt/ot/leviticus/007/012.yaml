revisions:
- from: Se alguém a oferecer como oferta de gratidão[a], junto com o sacrifício de gratidão oferecerá pães sem fermento misturados com azeite, lâminas de pão sem fermento untadas com azeite[b] e pães de farinha fina bem amassada com azeite[c].
  to: Se alguém a oferecer como oferta de gratidão[a], com o sacrifício de gratidão oferecerá pães sem fermento misturados com azeite, bolachas sem fermento untadas com azeite[b] e bolos de farinha fina bem trabalhada, misturados com azeite[c].
  rationale: A revisão conserva o sentido sacrificial e a ambiguidade culinária do hebraico. Ela torna explícito que os bolos, e não necessariamente o preparo designado por “bem trabalhada”, são misturados com azeite; substitui uma especificação culinária excessiva por formulação cautelosa; e emprega uma designação mais natural para os pães finos sem fermento.
