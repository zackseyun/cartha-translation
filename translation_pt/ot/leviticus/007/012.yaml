  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: pt
  text: Se alguém a oferecer como oferta de gratidão[a], com o sacrifício de gratidão oferecerá pães sem fermento misturados com azeite, bolachas sem fermento untadas com azeite[b] e bolos de farinha fina bem trabalhada, misturados com azeite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “oferta de ação de graças”. O hebraico תּוֹדָה refere-se aqui a uma oferta apresentada em gratidão.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ungidas com azeite”; neste contexto, a expressão descreve a aplicação de azeite ao pão durante o preparo, não uma unção ritual de pessoas ou objetos.
    reason: lexical_alternative
  - marker: c
    text: O preparo exato indicado pelo termo hebraico traduzido por “bem trabalhada” é incerto; pode referir-se a uma forma particular de preparar a farinha fina.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: oferta de gratidão
  rationale: No contexto sacrificial, o termo designa uma modalidade da oferta de comunhão apresentada em gratidão; esta formulação é clara e conserva o valor semântico do hebraico.
- source_word: יַקְרִיבֶנּוּ
  choice: a oferecer
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer; o pronome feminino retoma naturalmente a oferta mencionada no contexto.
- source_word: זֶבַח הַתּוֹדָה
  choice: sacrifício de gratidão
  rationale: Reproduz de maneira natural a relação construta entre o sacrifício e sua finalidade ou modalidade de gratidão.
- source_word: חַלּוֹת מַצּוֹת
  choice: pães sem fermento
  rationale: Expressa tanto os produtos de pão quanto sua condição não fermentada em português corrente.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: misturados com azeite
  rationale: בלל indica mistura dos ingredientes; 'misturados' é idiomático, e 'azeite' é a designação contextual adequada para o óleo usado nas ofertas.
- source_word: רְקִיקֵי מַצּוֹת
  choice: lâminas de pão sem fermento
  rationale: רְקִיקִים designa peças finas de pão; 'lâminas de pão' comunica melhor essa forma do que 'bolachas', que pode sugerir um produto moderno.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: untadas com azeite
  rationale: O particípio de משׁח significa literalmente ungidas ou besuntadas; no preparo de alimentos, 'untadas' preserva a ação sem sugerir indevidamente uma unção pessoal ou cerimonial.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É a designação habitual e precisa da farinha refinada usada nas ofertas.
- source_word: מֻרְבֶּכֶת
  choice: bem amassada
  rationale: O termo culinário é raro e sua preparação exata é incerta; 'bem amassada' comunica um preparo trabalhado sem especificar uma técnica não demonstrável.
- source_word: חַלֹּת
  choice: pães
  rationale: O substantivo designa unidades de pão ou bolos; 'pães' é natural e evita a associação moderna de 'bolos' com alimentos doces.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'azeite' no sentido contextual de azeite de oliva, evita vocabulário culinário excessivamente moderno e registra em nota as incertezas lexicais genuínas.
