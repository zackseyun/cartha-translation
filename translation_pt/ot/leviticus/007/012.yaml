    rationale: Em “pães de farinha fina bem amassada com azeite”, “com azeite” parece qualificar a farinha/amassamento, enquanto no hebraico בְּלוּלֹת בַּשָּׁמֶן qualifica os bolos. Além disso, o sentido técnico de מֻרְבֶּכֶת é incerto, de modo que “bem amassada” é mais específico do que os dados permitem.
  - severity: low
    issue: “Lâminas de pão” é pouco natural para רְקִיקֵי מַצּוֹת.
    rationale: O termo designa pães ou bolos finos; “bolachas sem fermento” é mais idiomático e mantém a noção de peça fina.
