  text: וְ/הִקְטִ֧יר הַ/כֹּהֵ֛ן אֶת הַ/חֵ֖לֶב הַ/מִּזְבֵּ֑חָ/ה וְ/הָיָה֙ הֶֽ/חָזֶ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: pt
  text: O sacerdote queimará a gordura sobre o altar[a], e o peito pertencerá a Arão e a seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fará a gordura subir em fumaça sobre o altar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: queimará
  rationale: No hifil, em contexto sacrificial, קטר indica queimar no altar, fazendo a oferta subir em fumaça. “Queimará” é claro e natural; a nuance da fumaça fica registrada em nota.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão de כֹּהֵן em contexto cultual; o singular do hebraico foi mantido.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: Na legislação sacrificial levítica, חֵלֶב designa as porções de gordura reservadas para serem queimadas no altar.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Embora a terminação direcional possa sugerir movimento em direção ao altar, com הִקְטִיר o sentido ritual natural é que a gordura seja queimada sobre o altar.
- source_word: וְהָיָה
  choice: pertencerá
  rationale: A construção literalmente significa “será”, mas aqui expressa atribuição ou posse da porção sacerdotal; “pertencerá” comunica naturalmente esse valor jurídico.
- source_word: הֶחָזֶה
  choice: o peito
  rationale: Na legislação sacrificial, חָזֶה designa a porção do peito do animal destinada aos sacerdotes.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: a Arão e a seus filhos
  rationale: O לְ marca posse ou destinação. A formulação preserva a atribuição da porção a Arão e aos seus filhos.
