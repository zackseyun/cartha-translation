base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: pt
  text: Dela, apresentará uma porção de cada oferta como contribuição ao SENHOR[a]. Essa porção pertencerá ao sacerdote que aspergir[b] o sangue dos sacrifícios de paz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como oferta separada para o SENHOR”. O termo hebraico indica uma parte reservada para Deus e destinada ao sacerdote.
    reason: lexical_alternative
  - marker: b
    text: Ou “lançar” ou “espargir”. O verbo hebraico descreve o lançamento ritual do sangue sobre o altar.
    reason: lexical_alternative
  - marker: c
    text: “Sacrifícios de paz” também pode ser traduzido como “sacrifícios de comunhão” ou “sacrifícios de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: apresentará
  rationale: O hifil de קרב indica fazer chegar ou apresentar algo como oferta. “Apresentará” conserva o sentido cultual sem acrescentar uma ação ritual não expressa.
- source_word: מִמֶּנּוּ
  choice: Dela
  rationale: O sufixo hebraico singular retoma como unidade o conjunto da oferta de gratidão descrito anteriormente. O feminino concorda naturalmente com “oferta” em português.
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: uma porção de cada oferta
  rationale: 'O hebraico diz literalmente “uma de cada oferta”. “Porção” explicita apenas o referente implícito exigido pelo português e comunica com clareza a distribuição: uma dentre cada espécie apresentada.'
- source_word: תְּרוּמָה
  choice: contribuição
  rationale: Designa uma parte separada para Deus e atribuída ao sacerdote. “Contribuição” é atual e compreensível; a alternativa técnica é registrada em nota.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Emprega a forma portuguesa tradicional para o nome divino YHWH e preserva o valor dedicatório da preposição ל.
- source_word: הַזֹּרֵק
  choice: que aspergir
  rationale: No ritual sacrificial, זרק descreve lançar ou espargir o sangue sobre o altar. “Aspergir” é natural no registro cultual português, enquanto a nota preserva a força mais concreta do verbo.
- source_word: דַּם הַשְּׁלָמִים
  choice: o sangue dos sacrifícios de paz
  rationale: “Sacrifícios de paz” mantém a categoria sacrificial reconhecível sem restringir שְׁלָמִים apenas à comunhão ou ao bem-estar.
- source_word: לוֹ יִהְיֶה
  choice: Essa porção pertencerá ao sacerdote
  rationale: A construção hebraica expressa posse ou direito de recebimento. A repetição de “porção” evita a ambiguidade pronominal em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma em versalete segue a convenção bíblica portuguesa amplamente reconhecida e distingue o nome divino do título comum, sem introduzir uma vocalização no texto principal.
- issue: Sentido de שְׁלָמִים
  choice: sacrifícios de paz
  alternative: sacrifícios de comunhão; sacrifícios de bem-estar
  rationale: A escolha preserva a designação sacrificial tradicional e deixa em nota as nuances legítimas de comunhão e bem-estar, sem decidir entre elas.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário cultual compreensível. A repetição de “porção” esclarece o referente sem alterar a relação jurídica expressa no hebraico.
