  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: pt
  text: Toda oferta de cereal assada no forno, e toda a que for preparada numa panela funda ou numa chapa, pertencerá ao sacerdote que a apresentar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: No contexto sacrificial de Levítico, o termo designa uma oferta feita de cereais, não uma oferta genérica. A expressão é clara e corrente em português.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: assada no forno
  rationale: Preserva o sentido passivo do verbo e emprega uma formulação natural em português; o artigo tem valor genérico neste contexto.
- source_word: נַעֲשָׂה
  choice: for preparada
  rationale: O verbo hebraico é amplo ('feita'), e 'preparada' exprime naturalmente o contexto culinário sem especificar além do texto.
- source_word: מַרְחֶשֶׁת
  choice: panela funda
  rationale: O utensílio parece ser um recipiente relativamente fundo; a tradução também mantém sua provável distinção em relação a מַחֲבַת.
- source_word: מַחֲבַת
  choice: chapa
  rationale: O termo parece indicar uma superfície ou frigideira mais plana. 'Chapa' preserva de modo conciso o contraste provável com a panela funda.
- source_word: לַכֹּהֵן ... לוֹ תִהְיֶה
  choice: pertencerá ao sacerdote
  rationale: A construção hebraica indica atribuição ou posse legal; esta formulação transmite isso com clareza e dignidade em português moderno.
- source_word: הַמַּקְרִיב אֹתָהּ
  choice: que a apresentar
  rationale: No contexto ritual, o particípio Hifil de קרב significa apresentar ou oferecer. 'Apresentar' evita repetição com 'oferta' e conserva o caráter cultual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A provável diferença entre os dois utensílios hebraicos foi explicitada no texto como 'panela funda' e 'chapa', sem introduzir terminologia técnica desnecessária.
