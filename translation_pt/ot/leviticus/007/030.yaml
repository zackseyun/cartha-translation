  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: pt
  text: Com as próprias mãos, ele trará as ofertas do SENHOR feitas pelo fogo. Trará a gordura sobre o peito, para mover o peito como oferta movida diante do SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: Com as próprias mãos
  rationale: Expressa a ênfase do hebraico em que o próprio ofertante deve trazer as porções.
- source_word: אִשֵּׁי יְהוָה
  choice: as ofertas feitas pelo fogo ao SENHOR
  rationale: Mantém o sentido cultual de אִשֶּׁה como oferta apresentada pelo fogo, sem reduzi-lo simplesmente a alimento.
- source_word: הַחֵלֶב עַל־הֶחָזֶה
  choice: a gordura junto com o peito
  rationale: A preposição עַל pode indicar associação ou posição; 'junto com' comunica naturalmente que ambas as partes são trazidas, sem impor uma disposição física específica.
- source_word: לְהָנִיף ... תְּנוּפָה
  choice: para mover ... como oferta movida
  rationale: Preserva a repetição etimológica e a ação ritual, usando terminologia cultual portuguesa compreensível.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção editorial portuguesa de representar o nome divino pelo título em versaletes.
theological_decisions:
- issue: Natureza de אִשֵּׁי יְהוָה
  choice: ofertas feitas pelo fogo ao SENHOR
  alternative: ofertas de alimento do SENHOR
  rationale: O termo deriva do campo semântico do fogo e designa ofertas queimadas; a tradução escolhida evita sugerir que Deus necessite literalmente de alimento.
- issue: Finalidade de trazer o peito
  choice: para mover o peito
  alternative: para que o peito seja movido
  rationale: O infinitivo hebraico expressa propósito; a forma ativa mantém a responsabilidade ritual sem acrescentar um agente não expresso.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário cultual consistente. A construção foi dividida em duas frases para clareza, preservando o paralelismo e a progressão do hebraico.
