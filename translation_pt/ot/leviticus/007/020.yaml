- from: Mas a pessoa que comer carne do sacrifício de ofertas de paz que pertence a Yahweh, enquanto estiver com sua impureza sobre si, essa pessoa será eliminada do meio do seu povo.[a]
  to: Mas a pessoa que comer carne do sacrifício de paz que pertence a Yahweh, enquanto sua impureza estiver sobre ela, essa pessoa será removida do meio do seu povo.[a]
