  - severity: low
    issue: “Sacrifício de ofertas de paz” é uma construção pouco natural.
    rationale: A expressão pode dar a impressão de que um sacrifício é feito “de ofertas”. “Sacrifício de paz” comunica com maior naturalidade a categoria sacrificial hebraica.
