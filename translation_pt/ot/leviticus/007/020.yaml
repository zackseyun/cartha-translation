review_pass:
  verdict: revise
  source_fidelity: A estrutura jurídica, a condição de impureza ritual e a repetição enfática de “pessoa” refletem bem o hebraico. Contudo, “será eliminada” tende a sugerir morte ou aniquilação e interpreta mais do que a fórmula וְנִכְרְתָה permite. “Será removida” preserva melhor a indeterminação quanto ao modo da sanção.
  naturalness: O texto é claro e de registro apropriado. “Sacrifício de ofertas de paz” é compreensível, mas soa pouco idiomático em português; “sacrifício de paz” é mais fluente e mantém a designação cultual sem impor a interpretação “comunhão”. A formulação da impureza pode ficar mais direta sem perder a imagem hebraica.
  terminology: “Pessoa”, “carne”, “Yahweh” e “impureza” são adequados. “Sacrifício de paz” é a forma recomendável para זֶבַח הַשְּׁלָמִים neste registro. A fórmula penal deve conservar uma expressão de remoção, com a alternativa formal “ser cortada” explicada em nota.
