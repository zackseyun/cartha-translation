source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: pt
  text: Mas a pessoa que comer carne do sacrifício de paz que pertence a Yahweh, enquanto sua impureza estiver sobre ela, essa pessoa será removida do meio do seu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será cortada do meio do seu povo”. A expressão hebraica pode referir-se à exclusão ou à morte, mas aqui não especifica o meio pelo qual a pessoa será removida.'
    reason: Preserva a formulação hebraica e a ambiguidade quanto à natureza ou ao mecanismo da penalidade.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: a pessoa
  rationale: No contexto jurídico, נֶפֶשׁ designa o indivíduo, não especificamente uma alma imaterial. “Pessoa” é claro e natural em português.
- source_word: תֹּאכַל
  choice: que comer
  rationale: O imperfeito apresenta um caso geral da legislação casuística; o futuro do subjuntivo português expressa naturalmente essa condição.
- source_word: בָּשָׂר
  choice: carne
  rationale: No contexto de alimento sacrificial, “carne” comunica o sentido concreto e corrente do termo.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: do sacrifício de ofertas de paz
  rationale: Mantém a categoria sacrificial tradicional de שְׁלָמִים e a relação com זֶבַח, sem substituir o termo por uma interpretação específica como “comunhão”.
- source_word: אֲשֶׁר לַיהוָה
  choice: que pertence a Yahweh
  rationale: A construção indica que o sacrifício é consagrado a Yahweh; “pertence a” comunica claramente essa relação.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: enquanto estiver com sua impureza sobre si
  rationale: Preserva a imagem hebraica da impureza que está “sobre” a pessoa, mantendo ao mesmo tempo uma construção compreensível em português.
- source_word: וְנִכְרְתָה
  choice: será eliminada
  rationale: O nifal de כרת exprime remoção severa da comunidade. “Será eliminada” conserva a força da fórmula sem determinar se o meio é expulsão ou morte.
- source_word: מֵעַמֶּיהָ
  choice: do meio do seu povo
  rationale: A forma feminina do sufixo concorda gramaticalmente com נֶפֶשׁ e não define o sexo da pessoa. “Seu povo” mantém a referência genérica.
theological_decisions:
- issue: Sentido da fórmula penal וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: será eliminada do meio do seu povo
  alternative: será excluída do seu povo; será morta
  rationale: A fórmula indica uma remoção grave da comunidade da aliança, mas o versículo não especifica se ocorre por expulsão, ação divina ou morte. A tradução principal preserva essa indeterminação, e a nota explicita as possibilidades.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. O nome divino foi transliterado como “Yahweh”. A sintaxe jurídica foi mantida clara, e a repetição de “pessoa” reproduz a ênfase do hebraico.
