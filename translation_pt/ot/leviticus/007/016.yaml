source:
  edition: WLC
  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: pt
  text: Mas, se o sacrifício de sua oferta for por voto ou uma oferta voluntária[a], será comido no dia em que a pessoa apresentar o seu sacrifício; e, no dia seguinte, o que restar dele poderá ser comido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta votiva” para “por voto”. O hebraico distingue o sacrifício ligado a um voto da oferta apresentada espontaneamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  choice: oferta de voto
  rationale: Neste contexto, נֶדֶר designa um sacrifício ligado a um voto ou oferecido em cumprimento dele. “Oferta de voto” explicita naturalmente em português a categoria sacrificial sem confundi-la com o ato verbal de fazer um voto.
- source_word: נְדָבָה
  choice: oferta voluntária
  rationale: נְדָבָה indica uma oferta apresentada espontaneamente, não por obrigação decorrente de voto. “Oferta voluntária” é clara e corrente em português.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: o sacrifício da sua oferta
  rationale: 'A formulação preserva os dois substantivos hebraicos: זֶבַח, “sacrifício”, e קָרְבָּן, “oferta” ou “dádiva apresentada”.'
- source_word: בְּיוֹם הַקְרִיבוֹ
  choice: no dia em que a pessoa apresentar
  rationale: O hifil de קרב tem aqui o sentido cultual de apresentar ou oferecer. “Apresentar” conserva a ideia de levar a oferta diante de Deus; “a pessoa” evita um masculino genérico pouco natural, sem mudar o referente.
- source_word: יֵאָכֵל
  choice: será comido / poderá ser comido
  rationale: A mesma forma nifal aparece duas vezes. Na primeira ocorrência, o futuro prescritivo comunica a regra; na segunda, “poderá” torna explícita a permissão de consumir o restante no dia seguinte.
- source_word: וּמִמָּחֳרָת
  choice: no dia seguinte
  rationale: מָחֳרָת indica o dia posterior. A expressão escolhida é direta e idiomática em português moderno.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: o que restar dele
  rationale: A expressão reproduz de modo natural o particípio substantivado, isto é, aquilo que sobrar do sacrifício.
theological_decisions:
- issue: Distinção entre sacrifício ligado a voto e oferta espontânea
  choice: 'Manter as duas categorias distintas: “oferta de voto” e “oferta voluntária”.'
  alternative: Traduzir ambas genericamente como ofertas voluntárias.
  rationale: O hebraico contrapõe נֶדֶר e נְדָבָה, distinguindo uma oferta associada a um voto de outra apresentada livremente, sem essa obrigação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário cultual acessível. A alternância entre “será comido” e “poderá ser comido” expressa, respectivamente, a prescrição e a permissão contextual, sem alterar a forma verbal hebraica subjacente.
