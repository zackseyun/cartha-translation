  terminology: “Oferta voluntária” é adequado para נְדָבָה. “Por voto” traduz de modo natural נֶדֶר nesta construção sacrificial, sem confundir o voto com o sacrifício oferecido em seu cumprimento. A nota conserva, de maneira útil, a alternativa “oferta votiva”.
