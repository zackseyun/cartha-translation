  text: וְ/כָל מִנְחָ֥ה בְלוּלָֽה בַ/שֶּׁ֖מֶן וַ/חֲרֵבָ֑ה לְ/כָל בְּנֵ֧י אַהֲרֹ֛ן תִּהְיֶ֖ה אִ֥ישׁ כְּ/אָחִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: pt
  text: E toda oferta de cereais misturada com azeite, ou seca, pertencerá a todos os filhos de Arão, em partes iguais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cada homem como seu irmão”; a expressão hebraica indica distribuição igual entre os filhos de Arão.
    reason: idioma_hebraico
lexical_decisions:
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: No contexto sacrificial de Levítico, o termo designa especificamente uma oferta preparada com produtos de cereal, não uma oferta genérica.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: Expressa de modo natural e atual a forma de preparo indicada pelo particípio passivo e pela locução preposicional.
- source_word: חֲרֵבָה
  choice: seca
  rationale: Mantém de forma concisa o contraste lexical com a oferta misturada com azeite, sem explicitar interpretativamente 'sem azeite'.
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: pertencerá a todos os filhos de Arão
  rationale: A construção com ל e היה indica posse ou destinação; 'pertencerá' comunica com clareza o sentido jurídico da porção sacerdotal.
- source_word: בְּנֵי אַהֲרֹן
  choice: filhos de Arão
  rationale: Preserva os termos masculinos de parentesco usados no texto hebraico para os sacerdotes.
- source_word: אִישׁ כְּאָחִיו
  choice: a cada um tanto quanto a seu irmão
  rationale: Conserva a comparação e o caráter distributivo masculino do idioma hebraico, ao mesmo tempo que comunica a igualdade das porções em português natural.
theological_decisions:
- issue: Linguagem masculina relativa ao sacerdócio
  choice: filhos de Arão ... a cada um ... seu irmão
  alternative: descendentes de Arão ... igualmente
  rationale: O hebraico emprega explicitamente termos masculinos de parentesco num contexto jurídico-sacerdotal; a tradução os preserva sem neutralização.
- issue: Distribuição da oferta entre os sacerdotes
  choice: a cada um tanto quanto a seu irmão
  alternative: cada um como seu irmão
  rationale: A formulação comunica a igualdade de participação implícita no idioma hebraico, sem determinar detalhes adicionais sobre o método de divisão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega 'azeite' no sentido contextual de azeite de oliva e mantém a terminologia cultual 'oferta de cereal'.
