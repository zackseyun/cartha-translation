  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יַקְרִ֣יב מִמֶּ֑/נּוּ אֵ֚ת הָֽ/אַלְיָ֔ה וְ/אֶת הַ/חֵ֖לֶב הַֽ/מְכַסֶּ֥ה אֶת הַ/קֶּֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: pt
  text: 'E apresentará[a], do animal, toda a sua gordura: a cauda gorda[b] e a gordura que cobre as vísceras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferecerá”. O verbo hebraico pode indicar a apresentação ou a oferta de uma porção sacrificial.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a cauda adiposa da ovelha, uma porção específica de gordura destinada ao sacrifício.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: sua gordura / a gordura
  rationale: Em contexto sacrificial, חֵלֶב designa as porções de gordura reservadas para a oferta. “Gordura” é a tradução direta e tradicional, sem perder a especificidade dada pela lista anatômica.
- source_word: יַקְרִיב
  choice: apresentará
  rationale: O hifil de קרב na legislação sacrificial pode significar apresentar ou oferecer. “Apresentará” conserva o sentido ritual sem determinar além do texto a etapa exata do rito.
- source_word: מִמֶּנּוּ
  choice: do animal
  rationale: O sufixo se refere mais naturalmente ao animal sacrificial mencionado no contexto. A explicitação evita a ambiguidade pouco natural de “dele” em português.
- source_word: הָאַלְיָה
  choice: a cauda gorda
  rationale: אַלְיָה designa a cauda adiposa de certas ovelhas, uma porção sacrificial específica. “Cauda gorda” é concreta e precisa.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: que cobre as vísceras
  rationale: קֶרֶב refere-se aqui aos órgãos internos do animal. “Vísceras” é claro, atual e anatomicamente adequado.
- source_word: כָּל
  choice: toda
  rationale: כָּל ressalta a totalidade da gordura sacrificial especificada.
theological_decisions: []
