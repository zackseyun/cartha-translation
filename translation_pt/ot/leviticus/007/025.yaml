  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: pt
  text: Pois qualquer pessoa que comer gordura de um animal do qual se apresenta ao SENHOR uma oferta feita pelo fogo[a] será eliminada do seu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma oferta queimada pelo fogo”. O termo hebraico se refere a uma oferta consumida pelo fogo no altar.'
    reason: lexical_alternative
  - marker: b
    text: “Será eliminada” preserva uma fórmula jurídica hebraica. A pena exata é discutida; pode indicar expulsão, morte ou juízo divino.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da proibição anterior e mantém de modo natural a ligação discursiva.
- source_word: כָּל אֹכֵל
  choice: qualquer pessoa que comer
  rationale: Expressa um caso geral e universal em português claro, sem restringir o sexo do infrator.
- source_word: חֵלֶב
  choice: gordura
  rationale: Designa a gordura animal, em especial as porções reservadas na legislação sacrificial.
- source_word: מִן הַבְּהֵמָה
  choice: de um animal
  rationale: בְּהֵמָה refere-se aqui a um animal pertencente às espécies usadas em sacrifício; a formulação é simples e abrangente.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: do qual se apresenta
  rationale: O verbo hebraico tem sujeito indefinido; a construção com «se» reproduz essa indefinição com naturalidade.
- source_word: אִשֶּׁה
  choice: uma oferta queimada no altar
  rationale: Comunica que se trata de uma oferta consumida pelo fogo sacrificial, sem restringir indevidamente o termo a alimento.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Emprega a convenção portuguesa tradicional para o Tetragrama e preserva a ideia de apresentação ou dedicação.
- source_word: וְנִכְרְתָה
  choice: será eliminada
  rationale: Mantém a força da fórmula jurídica hebraica sem determinar por qual mecanismo a pessoa é retirada do povo.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: essa pessoa
  rationale: נֶפֶשׁ designa aqui o indivíduo responsável; a retomada evita a tradução literal e inadequada «alma».
- source_word: מֵעַמֶּיהָ
  choice: do meio do seu povo
  rationale: O sufixo feminino concorda gramaticalmente com נֶפֶשׁ, mas a referência é genérica; «seu» preserva naturalmente essa referência em português.
theological_decisions:
- issue: Sentido da fórmula penal וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: será eliminada do meio do seu povo
  alternative: será excluída do seu povo; será morta
  rationale: A natureza exata da pena é discutida e pode envolver expulsão comunitária, morte ou juízo divino. A tradução conserva a amplitude da fórmula, e a nota explicita a incerteza sem resolvê-la.
- issue: Referência genérica do infrator
  choice: qualquer pessoa ... essa pessoa ... seu povo
  alternative: todo aquele ... seu povo
  rationale: Embora נֶפֶשׁ e seu sufixo sejam gramaticalmente femininos, a lei abrange qualquer infrator. A formulação portuguesa é genérica sem alterar o número singular do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A ordem foi ajustada à sintaxe natural do português, preservando a relação causal, a generalidade da proibição e a ambiguidade da sanção.
