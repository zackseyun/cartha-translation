base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: pt
  text: 'A oferta pelo pecado é como a oferta pela culpa: há uma só lei[a] para ambas. O sacerdote que fizer expiação com ela a terá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma só instrução”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: Assim como a oferta pelo pecado, assim também a oferta pela culpa
  rationale: Os dois prefixos comparativos כ formam uma comparação entre as ofertas. No contexto sacrificial, חַטָּאת designa a oferta pelo pecado, e אָשָׁם, a oferta pela culpa ou reparação. A construção portuguesa conserva o paralelismo e é clara.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: há uma só lei para ambas
  rationale: תּוֹרָה tem aqui sentido de norma ou instrução ritual. “Uma só lei” preserva a força jurídica e a unidade do procedimento; “para ambas” explicita naturalmente que o pronome plural retoma as duas ofertas.
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֵּר בּוֹ
  choice: O sacerdote que fizer expiação com ela
  rationale: כפר mantém seu peso sacrificial em “fizer expiação”. A preposição בּ com o pronome apresenta a oferta como meio, adequadamente vertida por “com ela”, sem acrescentar um beneficiário não expresso.
- source_word: לוֹ יִהְיֶה
  choice: ficará com ela
  rationale: O idioma hebraico indica posse ou atribuição ao sacerdote oficiante. “Ficará com ela” comunica de modo natural que a oferta lhe pertence.
theological_decisions:
- issue: Sentido de כפר na legislação sacrificial
  choice: fizer expiação
  alternative: realizar a purificação; efetuar a expiação
  rationale: “Fazer expiação” conserva a amplitude cultual e teológica do verbo sem impor uma teoria específica sobre o mecanismo da expiação.
- issue: Natureza de אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: “Oferta pela culpa” é transparente e tradicionalmente reconhecível, enquanto “oferta de reparação” destaca um aspecto real do termo. O texto não deve ser reduzido exclusivamente a um desses aspectos; a alternativa é registrada na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo hebraico foi preservado, e a formulação evita especificar além do original quem recebe o benefício da expiação.
