base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/028.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O waw consecutivo com דבר introduz uma nova unidade de fala e dá continuidade à narrativa. “E ... falou” preserva essa progressão e distingue דבר de אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; “a” é a forma portuguesa natural nesta construção.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz o discurso direto, de modo natural e digno em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título e “Jeová” reflete uma vocalização tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com a cadência da fórmula hebraica preservada. A forma “falou a Moisés” é amplamente compreensível no português internacional e tem boa legibilidade brasileira.
