base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: pt
  text: Esta é a lei referente ao holocausto, à oferta de cereal, à oferta pelo pecado[a], à oferta pela culpa[b], aos ritos de ordenação[c] e ao sacrifício das ofertas de comunhão[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico pode enfatizar tanto a remoção da impureza quanto o tratamento do pecado.
    reason: lexical_alternative
  - marker: b
    text: Ou “oferta de reparação”. O termo hebraico pode destacar a responsabilidade e a restituição exigida.
    reason: lexical_alternative
  - marker: c
    text: Ou “oferta de ordenação” ou “ritos de consagração”. O termo hebraico está no plural e se refere aos procedimentos de instalação dos sacerdotes.
    reason: lexical_alternative
  - marker: d
    text: Ou “ofertas de paz” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Esta é a lei
  rationale: O demonstrativo introduz uma declaração resumitiva; no contexto das prescrições sacrificiais, תּוֹרָה designa a lei ou instrução que as rege.
- source_word: לָעֹלָה
  choice: referente ao holocausto
  rationale: A preposição לְ marca o âmbito da lei. “Holocausto” é a designação portuguesa tradicional e concisa da oferta inteiramente queimada.
- source_word: לַמִּנְחָה
  choice: à oferta de cereal
  rationale: Neste contexto levítico, מִנְחָה é a oferta composta de produtos de cereal; a expressão é clara e atual.
- source_word: וְלַחַטָּאת
  choice: à oferta pelo pecado
  rationale: חַטָּאת pode indicar o pecado ou a oferta que trata do pecado e da impureza. A formulação tradicional permanece no texto, e a alternativa lexical é registrada em nota.
- source_word: וְלָאָשָׁם
  choice: à oferta pela culpa
  rationale: אָשָׁם envolve culpa ou responsabilidade e a oferta correspondente; a nota preserva a nuance reparatória.
- source_word: וְלַמִּלּוּאִים
  choice: aos ritos de ordenação
  rationale: O plural hebraico se refere aos procedimentos de instalação e consagração sacerdotal; “ritos” conserva melhor o número e a abrangência do termo do que uma oferta singular.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: ao sacrifício das ofertas de comunhão
  rationale: זֶבַח significa “sacrifício”, enquanto שְׁלָמִים nomeia uma categoria associada à comunhão, paz e bem-estar. “Ofertas de comunhão” é natural em português, com alternativas preservadas em nota.
theological_decisions:
- issue: Sentido de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo abrange tanto o tratamento do pecado quanto a remoção de impureza; a tradução principal mantém a expressão reconhecível sem excluir a alternativa.
- issue: Sentido de אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação
  rationale: A expressão principal destaca a responsabilidade diante da culpa, enquanto a alternativa explicita a dimensão de compensação ou restituição.
- issue: Abrangência de מִלּוּאִים
  choice: ritos de ordenação
  alternative: oferta de ordenação; ritos de consagração
  rationale: O plural e o contexto sacerdotal favorecem a referência ao conjunto dos procedimentos de instalação, não necessariamente a uma única oferta.
- issue: Sentido de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz; ofertas de bem-estar
  rationale: O hebraico permite nuances de paz, integridade, bem-estar e comunhão; nenhuma delas deve ser tratada como interpretação exclusiva.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial reconhecível. Emprega-se “referente a” para tornar explícito o valor de âmbito da preposição hebraica e “ritos de ordenação” para preservar o plural e a abrangência do original.
