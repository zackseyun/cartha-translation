id: LEV.7.6
reference: Leviticus 7:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכְלֶ֑/נּוּ בְּ/מָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: pt
  text: Todo homem entre os sacerdotes poderá comê-la; ela será comida em lugar santo. É coisa santíssima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “santo de santos”, expressão que significa “santíssimo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: Todo homem entre os sacerdotes
  rationale: כָּל tem sentido distributivo, e זָכָר especifica o sexo masculino. Em português corrente, “todo homem entre os sacerdotes” preserva a restrição cultual sem sugerir apenas masculinidade gramatical.
- source_word: יֹאכְלֶנּוּ
  choice: poderá comê-la
  rationale: O imperfeito, neste contexto legal, expressa autorização ou direito de consumo, não mera previsão futura. O pronome feminino retoma a oferta pela culpa mencionada no contexto.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: em lugar santo
  rationale: A expressão não tem artigo definido e indica um local ritualmente santo sem identificá-lo necessariamente como “o Santo Lugar” do santuário.
- source_word: יֵאָכֵל
  choice: ela será comida
  rationale: O nifal apresenta uma instrução passiva sobre o local de consumo. A formulação mantém a força normativa da disposição legal.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: coisa santíssima
  rationale: A construção superlativa hebraica, literalmente “santo de santos”, classifica a oferta no grau máximo de santidade. “Coisa santíssima” é clara e evita confusão com o compartimento chamado Santo dos Santos.
- source_word: הוּא
  choice: É coisa
  rationale: Embora o pronome hebraico seja masculino por concordar com o predicado hebraico, a referência contextual é à oferta pela culpa; a formulação portuguesa natural explicita sua classificação ritual.
theological_decisions:
- issue: Restrição do consumo aos homens pertencentes ao sacerdócio
  choice: Todo homem entre os sacerdotes poderá comê-la
  alternative: Todo sacerdote poderá comê-la
  rationale: O hebraico contém explicitamente זָכָר, “macho/homem do sexo masculino”; omiti-lo ampliaria a autorização além do que a norma cultual declara.
- issue: Força modal de יֹאכְלֶנּוּ
  choice: poderá comê-la
  alternative: deverá comê-la
  rationale: O contexto estabelece quem tem autorização para consumir a porção, ao passo que a oração seguinte determina onde ela deve ser consumida. A tradução conserva essa distinção sem eliminar a possível nuance normativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Homem” foi preferido a “macho” para pessoas, mantendo a precisão da restrição sexual. A repetição passiva reflete a estrutura legal hebraica; “coisa santíssima” comunica uma categoria ritual, não o recinto Santo dos Santos.
