  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: pt
  text: que Yahweh ordenou a Moisés no monte Sinai, no dia em que ordenou aos filhos de Israel[a] que apresentassem suas ofertas a Yahweh no deserto do Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos israelitas” ou “ao povo de Israel”. O hebraico diz literalmente “aos filhos de Israel”.'
    reason: Registra alternativas idiomáticas para a expressão hebraica בְּנֵי יִשְׂרָאֵל, enquanto o texto principal preserva sua forma literal.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz uma oração relativa ligada ao resumo das prescrições no versículo anterior, preservando de modo natural a conexão sintática.
- source_word: צִוָּה
  choice: ordenou
  rationale: Mantém a força normativa do verbo צוה no contexto legal e cultual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּהַר סִינָי
  choice: no monte Sinai
  rationale: É a forma portuguesa natural de indicar o lugar e preserva a referência geográfica.
- source_word: בְּיוֹם צַוֺּתוֹ
  choice: no dia em que ordenou
  rationale: Expressa de maneira corrente a construção temporal hebraica, mantendo sua referência explícita ao dia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Conserva a expressão familiar e formal do hebraico; uma nota registra equivalentes idiomáticos possíveis.
- source_word: לְהַקְרִיב
  choice: que apresentassem
  rationale: No contexto sacrificial, o hifil de קרב indica fazer chegar ou apresentar uma oferta; a oração com subjuntivo é natural após “ordenou” em português.
- source_word: קָרְבְּנֵיהֶם
  choice: suas ofertas
  rationale: קרבן é um termo sacrificial amplo; “ofertas” abrange adequadamente os diversos tipos resumidos pelo versículo.
- source_word: בְּמִדְבַּר סִינָי
  choice: no deserto do Sinai
  rationale: Traduz מִדְבָּר de forma clara e corrente, preservando a designação geográfica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome próprio divino sem substituí-lo por um título.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A escolha mantém a forma familiar masculina do hebraico sem negar que, no uso coletivo, as alternativas sejam equivalentes idiomáticos legítimos.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e terminologia cultual ampla. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
