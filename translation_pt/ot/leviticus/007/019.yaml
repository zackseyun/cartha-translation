  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: pt
  text: Mas a carne que tocar em qualquer coisa impura[a] não deverá ser comida; deverá ser queimada no fogo. Quanto à carne, qualquer pessoa que estiver pura poderá comê-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que entrar em contato com qualquer coisa impura”. O hebraico é abrangente e se refere à impureza ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: Mas a carne
  rationale: Neste contexto sacrificial, בָּשָׂר designa a carne destinada ao consumo. A conjunção foi vertida por “Mas” para marcar o contraste com a carne que pode ser comida.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: que tocar em qualquer coisa impura
  rationale: יִגַּע indica contato, e כָּל טָמֵא abrange qualquer coisa ritualmente impura sem especificar indevidamente sua natureza.
- source_word: לֹא יֵאָכֵל
  choice: não deverá ser comida
  rationale: O nifal imperfeito tem sentido passivo e força normativa; “não deverá ser comida” comunica a proibição em português atual e digno.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: deverá ser queimada no fogo
  rationale: Preserva tanto a obrigação legal quanto a imagem concreta do fogo como meio de eliminação da carne contaminada.
- source_word: וְהַבָּשָׂר
  choice: Quanto à carne
  rationale: A repetição introduz uma retomada tópica e contrasta a carne apta para consumo com a carne impura mencionada antes.
- source_word: כָּל טָהוֹר
  choice: qualquer pessoa que estiver pura
  rationale: O adjetivo substantivado refere-se a pessoas em estado ritual de pureza; a formulação torna explícito o referente humano sem acrescentar uma categoria moral.
- source_word: יֹאכַל בָּשָׂר
  choice: poderá comê-la
  rationale: O contexto indica permissão, não ordem. O pronome retoma naturalmente “a carne” e evita uma repetição pouco idiomática em português.
theological_decisions:
- issue: Natureza de טָמֵא e טָהוֹר na legislação sacrificial
  choice: “impura” e “pura” como estados rituais
  alternative: “contaminada” e “limpa”; ou categorias de impureza e pureza moral
  rationale: Em Levítico, os termos aqui descrevem primordialmente a condição ritual. A tradução mantém a terminologia tradicional de pureza sem equipará-la a culpa ou virtude moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Carne” é natural no contexto alimentar e sacrificial. O futuro perifrástico com “deverá” preserva a força legal, enquanto “poderá” expressa permissão. O marcador [a] aparece imediatamente após a expressão esclarecida.
