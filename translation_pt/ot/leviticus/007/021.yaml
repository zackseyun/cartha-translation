id: LEV.7.21
reference: Leviticus 7:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: pt
  text: Se alguém tocar em algo impuro — na impureza de uma pessoa[a], num animal impuro ou em qualquer coisa impura e repugnante — e comer da carne do sacrifício de comunhão que pertence ao SENHOR, essa pessoa será cortada do meio do seu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “impureza humana”. A expressão refere-se à impureza ritual associada a uma pessoa; o versículo não especifica a sua causa.'
    reason: Preserva o sentido relacional de טֻמְאַת אָדָם sem introduzir uma causa específica.
  - marker: b
    text: “Será cortada” é uma fórmula de sanção da aliança. Pode envolver exclusão ou juízo divino; o hebraico não especifica aqui o modo exato.
    reason: Preserva a ambiguidade teológica e jurídica da fórmula hebraica.
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: alguém / essa pessoa
  rationale: No contexto jurídico, נֶפֶשׁ designa a pessoa individual, não uma “alma” imaterial. A variação evita repetição pesada e mantém a referência genérica.
- source_word: תִגַּע בְּכָל טָמֵא
  choice: tocar em qualquer coisa impura
  rationale: Mantém o sentido concreto de contato ritual expresso por נגע e o alcance abrangente da expressão hebraica.
- source_word: טֻמְאַת אָדָם
  choice: impureza humana
  rationale: Refere-se à impureza ritual associada a um ser humano; “humana” é genérico e não limita o texto ao sexo masculino.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: um animal impuro
  rationale: בְּהֵמָה tem aqui referência ampla, e “animal” é claro e natural em português.
- source_word: שֶׁקֶץ טָמֵא
  choice: qualquer coisa impura e repugnante
  rationale: שֶׁקֶץ expressa algo ritualmente detestável ou repulsivo; “repugnante” conserva essa força sem restringir indevidamente a categoria.
- source_word: וְאָכַל מִבְּשַׂר
  choice: e comer da carne
  rationale: A construção com מִן é partitiva; em português, “comer da carne” comunica naturalmente que se trata de uma porção.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifício de comunhão
  rationale: “Comunhão” oferece uma designação sacrificial clara e corrente em português para שְׁלָמִים, embora “sacrifício de paz” também seja possível.
- source_word: אֲשֶׁר לַיהוָה
  choice: que pertence ao SENHOR
  rationale: A formulação comunica que o sacrifício é consagrado ou destinado a YHWH.
- source_word: יהוה
  choice: SENHOR
  rationale: Emprega a convenção portuguesa tradicional para representar o nome divino YHWH.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: será cortada do meio do seu povo
  rationale: Preserva a metáfora e o peso da fórmula de sanção da aliança, sem determinar por tradução se o resultado ocorre por exclusão comunitária, morte ou juízo divino.
theological_decisions:
- issue: Sentido da sanção וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: manter a fórmula “será cortada do meio do seu povo”
  alternative: “será excluída do seu povo” ou “será morta”
  rationale: O hebraico não especifica aqui o modo exato da sanção. Uma formulação mais explícita resolveria uma ambiguidade genuína do texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e terminologia ritual consistente. A construção “será cortada” é deliberadamente mais formal por reproduzir uma fórmula jurídica da aliança; a nota impede que a metáfora seja entendida de modo estreito. Todos os marcadores de nota aparecem no texto.
