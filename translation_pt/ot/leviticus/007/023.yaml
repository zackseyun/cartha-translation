  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a], dizendo: Não comam nenhuma gordura de boi, ovelha ou cabra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais idiomática, “aos israelitas”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel masculino singular dirige a Moisés uma ordem direta; “Fale” preserva a fórmula legal e é natural em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Reproduz de perto a expressão hebraica e sua forma masculina representativa, ao passo que a nota oferece a alternativa coletiva mais idiomática.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a estrutura formal da fórmula hebraica de introdução do discurso.
- source_word: כָּל חֵלֶב
  choice: nenhuma gordura
  rationale: Sob negação, “nenhuma gordura” expressa naturalmente em português o alcance abrangente de כָּל com o substantivo חֵלֶב.
- source_word: שׁוֹר
  choice: boi
  rationale: Termo corrente para o bovino singular nesta lista legal, sem restringir indevidamente o referente a um touro.
- source_word: כֶשֶׂב
  choice: ovelha
  rationale: Representa a categoria genérica de animal ovino sem especificar cordeiro ou carneiro.
- source_word: עֵז
  choice: cabra
  rationale: Equivalente português comum para o caprino genérico nesta enumeração de animais domésticos.
- source_word: לֹא תֹאכֵלוּ
  choice: Não comam
  rationale: A proibição dirigida ao povo está no plural; o imperativo negativo é claro, atual e preserva a força normativa do hebraico.
