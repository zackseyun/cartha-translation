  naturalness: «Porção da unção de Arão» é pouco idiomático em português moderno e ambíguo. «A porção de Arão e a porção de seus filhos» é claro, solene e mantém a repetição do hebraico. «Ofertas de alimento de Yahweh» conserva de modo conciso a construção de origem, enquanto a nota registra a formulação tradicional.
  terminology: Arão e Yahweh estão adequados. «Servirem como sacerdotes a Yahweh» comunica bem לְכַהֵן לַיהוָה. A nota lexical deve apresentar «porção da unção» como alternativa, e não fazer de «porção devida» a alternativa principal, pois a tradução revista já expressa o sentido contextual de porção atribuída.
