base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: pt
  text: Esta é a porção de Arão e a porção de seus filhos[a], proveniente das ofertas de alimento de Yahweh[b], no dia em que ele os apresentou para servirem como sacerdotes a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a porção da unção de Arão e a porção da unção de seus filhos”. O termo hebraico está ligado à unção, mas, neste contexto, provavelmente designa a quota sacerdotal atribuída em conexão com a consagração.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “das ofertas feitas pelo fogo a Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: porção da unção
  rationale: Mantém a ligação lexical com a unção e, no contexto das quotas sacerdotais, comunica uma porção atribuída em conexão com a consagração. A nota registra a possibilidade de explicitar apenas a ideia de porção devida.
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: a porção da unção de Arão e a porção da unção de seus filhos
  rationale: Preserva a repetição enfática do substantivo no hebraico, sem condensar as duas quotas numa única expressão.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: proveniente das ofertas de alimento apresentadas a Yahweh
  rationale: Expressa em linguagem atual a categoria cultual das ofertas destinadas a Yahweh, mantendo a relação indicada por מִן, “proveniente de”. A formulação tradicional ligada ao fogo é preservada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Reproduz de modo idiomático a expressão temporal hebraica.
- source_word: הִקְרִיב אֹתָם
  choice: ele os apresentou
  rationale: O hifil de קרב significa fazer aproximar ou apresentar. Como os objetos são Arão e seus filhos, “apresentou” evita sugerir que eles próprios foram sacrificados. O pronome “ele” preserva o sujeito singular não nomeado neste versículo.
- source_word: לְכַהֵן לַיהוָה
  choice: para servirem como sacerdotes a Yahweh
  rationale: Comunica a função verbal de exercer o sacerdócio e mantém Yahweh como aquele a quem o serviço é prestado.
theological_decisions:
- issue: Sentido de מִשְׁחַת na legislação sacerdotal
  choice: porção da unção
  alternative: porção devida; porção atribuída por ocasião da unção
  rationale: A expressão pode apontar tanto para a ligação formal com a unção quanto, no contexto imediato, para a quota sacerdotal resultante da consagração. O texto conserva a ligação lexical, e a nota evita resolver silenciosamente a tensão.
- issue: Referente do sujeito de הִקְרִיב
  choice: manter o sujeito apenas como “ele”
  alternative: explicitar “Moisés”
  rationale: O verbo hebraico está no singular, mas o sujeito não é nomeado neste versículo. Não se acrescenta uma identificação contextual ao texto principal.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. A repetição do original foi mantida; evitou-se explicitar como “Moisés” o sujeito não nomeado no versículo.
