base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: pt
  text: os dois rins, a gordura que está sobre eles, sobre os lombos, e o apêndice sobre o fígado[a], que ele removerá com os rins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lobo do fígado”. O termo hebraico para essa parte anatômica é técnico, e sua referência exata é discutida.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: os dois rins
  rationale: A expressão designa claramente os rins na anatomia sacrificial; esta é a forma corrente e precisa em português.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: No contexto sacrificial levítico, refere-se às porções gordurosas reservadas para a oferta. “Gordura” é claro e natural, sem restringir indevidamente o sentido.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: que está sobre eles
  rationale: Reproduz diretamente a relação expressa por עַל, sem acrescentar a interpretação de que a gordura cobre completamente os rins.
- source_word: הַכְּסָלִים
  choice: junto aos lombos
  rationale: כְּסָלִים indica a região dos lombos ou flancos próxima aos rins. “Lombos” mantém a referência anatômica, e “junto a” produz uma formulação natural no contexto.
- source_word: הַיֹּתֶרֶת
  choice: o apêndice
  rationale: Trata-se de um termo anatômico técnico cujo referente exato é discutido. “Apêndice” mantém a concretude sem identificar com certeza excessiva uma estrutura específica.
- source_word: עַל הַכָּבֵד
  choice: sobre o fígado
  rationale: Traduz de modo direto o sentido espacial mais simples de עַל.
- source_word: עַל הַכְּלָיֹת
  choice: com os rins
  rationale: Na fórmula sacrificial, a expressão liga a retirada do apêndice à retirada dos rins. “Com os rins” preserva a relação sem impor uma localização anatômica mais precisa.
- source_word: יְסִירֶנָּה
  choice: ele removerá
  rationale: O hifil de סור exprime a retirada prescrita dessas partes. O futuro português funciona naturalmente como instrução legal neste contexto.
