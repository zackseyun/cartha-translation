id: LEV.7.1
reference: Leviticus 7:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הָ/אָשָׁ֑ם קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: pt
  text: 'Esta é a lei da oferta pela culpa: ela é santíssima[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “oferta de reparação” ou “oferta de compensação”. O termo hebraico asham designa um sacrifício associado à culpa e à restituição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Esta é
  rationale: A conjunção com o demonstrativo introduz uma nova instrução. Em português, “Esta é” marca naturalmente a abertura da seção sem acrescentar um advérbio temporal ausente do hebraico.
- source_word: תּוֹרַת
  choice: a lei da
  rationale: Neste contexto, תּוֹרָה designa a regulamentação prescrita para o sacrifício. “A lei da” é clara, tradicional e próxima da construção hebraica.
- source_word: הָ/אָשָׁם
  choice: oferta pela culpa
  rationale: אָשָׁם é o nome de uma categoria sacrificial ligada à culpa e à reparação. “Oferta pela culpa” preserva a designação cultual já reconhecida, enquanto a nota registra outras nuances possíveis.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssima
  rationale: A construção superlativa hebraica indica o grau máximo de santidade. “Santíssima” é natural e evita a possível confusão de “santo dos santos” com o recinto do santuário.
- source_word: הוּא
  choice: ela é
  rationale: O pronome funciona de modo predicativo e retoma a oferta, substantivo feminino em português; por isso, a formulação natural é “ela é”.
theological_decisions:
- issue: Tradução do termo sacrificial אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação; oferta de compensação
  rationale: O versículo classifica um sacrifício levítico específico. “Oferta pela culpa” conserva a categoria cultual e sua dimensão moral sem reduzir o termo à restituição econômica; as nuances de reparação e compensação são preservadas em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a concisão e a estrutura classificatória do hebraico, sem introduzir marcador temporal ou explicação doutrinária.
