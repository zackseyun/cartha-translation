  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a], dizendo: Aquele que apresenta seu sacrifício de paz[b] ao SENHOR trará sua oferta ao SENHOR de seu sacrifício de paz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «aos israelitas». Hebraico: «aos filhos de Israel».'
    reason: lexical_alternative
  - marker: b
    text: Ou «sacrifício de bem-estar» ou «sacrifício de comunhão». O termo hebraico designa uma categoria sacrificial associada à paz, à integridade e ao bem-estar.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo introduz uma instrução divina direta a Moisés; “Fale” é natural e preserva a força da ordem.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a expressão hebraica literal e seu sentido coletivo e pactual.
- source_word: הַמַּקְרִיב
  choice: Aquele que apresenta
  rationale: O Hifil de קרב descreve fazer chegar ou apresentar uma oferta; “apresenta” conserva essa imagem cultual sem se limitar ao ato de matar a vítima.
- source_word: זֶבַח שְׁלָמָיו
  choice: o seu sacrifício de comunhão
  rationale: זֶבַח designa um sacrifício, enquanto שְׁלָמִים é o nome técnico da categoria associada a bem-estar, paz e comunhão. A expressão é clara em português e a nota registra alternativas legítimas.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Emprega a convenção portuguesa consolidada para o Tetragrama, em versaletes representados aqui por maiúsculas.
- source_word: יָבִיא
  choice: trará
  rationale: O imperfeito em contexto legal tem força prescritiva; o futuro simples preserva o tom normativo com naturalidade em português bíblico.
- source_word: קָרְבָּנוֹ
  choice: a sua oferta
  rationale: קרבן é o termo geral para aquilo que é levado e apresentado a Deus; “oferta” é o equivalente moderno mais claro.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: do seu sacrifício de comunhão
  rationale: A preposição מִן indica que a oferta apresentada ao SENHOR procede do próprio sacrifício mencionado.
theological_decisions:
- issue: Representação de יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção reverente e amplamente reconhecida das Bíblias portuguesas, distinguindo o nome divino por maiúsculas.
- issue: Terminologia de שְׁלָמִים
  choice: sacrifício de comunhão
  alternative: sacrifício de paz; oferta de paz; sacrifício de bem-estar
  rationale: “Comunhão” comunica uma dimensão importante dessa categoria sacrificial, mas não esgota sua amplitude semântica; por isso, as alternativas mais literais são preservadas em nota.
- issue: Forma coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: Conserva a forma masculina explícita e a formulação pactual do hebraico, sem negar seu referente coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve registro jurídico-cultual. A ordem dos complementos foi ajustada para evitar ambiguidade em português, preservando a repetição enfática de “ao SENHOR” e “sacrifício de comunhão” presente no hebraico.
