source:
  edition: WLC
  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: pt
  text: Junto com bolos de pão fermentado, apresentará a sua oferta com o sacrifício de ação de graças das suas ofertas de paz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de comunhão” ou “ofertas de bem-estar”.
    reason: Alternativas lexicais legítimas para o termo sacrificial hebraico שְׁלָמִים.
lexical_decisions:
- source_word: עַל
  choice: junto com
  rationale: Neste contexto, עַל indica acompanhamento ou adição, não posição física; “junto com” expressa naturalmente essa relação.
- source_word: חַלֹּת לֶחֶם
  choice: bolos de pão
  rationale: חַלּוֹת designa pães ou bolos moldados; “bolos de pão” preserva a forma específica dos itens apresentados no contexto sacrificial.
- source_word: חָמֵץ
  choice: fermentado
  rationale: É o termo cultual para pão levedado e mantém o contraste com os itens sem fermento dos versículos anteriores.
- source_word: יַקְרִיב
  choice: apresentará
  rationale: O hifil de קרב, em contexto sacrificial, significa trazer para apresentação ou oferecer; “apresentará” distingue o verbo do substantivo קָרְבָּן.
- source_word: קָרְבָּנוֹ
  choice: a sua oferta
  rationale: קָרְבָּן é o termo geral para algo levado e apresentado a Deus; “oferta” é claro e corrente.
- source_word: זֶבַח
  choice: sacrifício
  rationale: Em legislação cultual, זֶבַח indica um sacrifício abatido; “sacrifício” é a equivalência portuguesa natural neste contexto.
- source_word: תּוֹדַת
  choice: de ação de graças
  rationale: A construção caracteriza o sacrifício como expressão de gratidão; “ação de graças” é clara e preserva o valor nominal do hebraico.
- source_word: שְׁלָמָיו
  choice: suas ofertas de paz
  rationale: שְׁלָמִים é um termo sacrificial técnico relacionado semanticamente a paz, integridade e bem-estar. “Ofertas de paz” preserva essa ligação lexical, enquanto as alternativas ficam registradas em nota.
theological_decisions:
- issue: Tradução do termo sacrificial שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão; ofertas de bem-estar
  rationale: O termo designa uma classe de sacrifícios associada à paz, à integridade e à participação em comunhão. A opção principal mantém a ligação lexical com “paz” sem excluir os demais aspectos semânticos, preservados na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe próxima da estrutura hebraica sem sacrificar a naturalidade. O marcador da nota foi colocado imediatamente após o termo a que se refere.
