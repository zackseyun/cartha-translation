base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: pt
  text: que Yahweh ordenou que lhes fosse dado pelos filhos de Israel no dia em que os ungiu. Isto é um estatuto perpétuo por todas as suas gerações.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelos israelitas”. O hebraico diz literalmente “pelos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “estatuto permanente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz uma oração relativa ligada às porções sacerdotais mencionadas no contexto anterior.
- source_word: צִוָּה
  choice: ordenou
  rationale: Conserva a força jurídica e autoritativa da ordem divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לָתֵת לָהֶם
  choice: que lhes fosse dado
  rationale: A construção passiva é natural em português e deixa claro que as porções deveriam ser entregues aos sacerdotes.
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: no dia em que os ungiu
  rationale: Preserva a expressão temporal concreta e o sentido específico de ungir; o sujeito implícito é naturalmente Yahweh.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: pelos filhos de Israel
  rationale: A preposição marca a fonte de quem procederia a dádiva; a formulação conserva a expressão pactual hebraica, com alternativa idiomática em nota.
- source_word: חֻקַּת עוֹלָם
  choice: estatuto perpétuo
  rationale: Expressa uma determinação cultual duradoura sem converter עוֹלָם em uma afirmação filosófica abstrata sobre eternidade.
- source_word: לְדֹרֹתָם
  choice: por todas as suas gerações
  rationale: Comunica a vigência continuada através das gerações sucessivas de Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o tetragrama; a transliteração preserva o nome pactual em vez de substituí-lo por um título.
- issue: Alcance de עוֹלָם na legislação sacerdotal
  choice: perpétuo
  alternative: permanente
  rationale: Mantém o peso jurídico de continuidade duradoura no âmbito das gerações de Israel, sem resolver além do texto questões teológicas posteriores.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e inteligibilidade internacional. Mantém-se “filhos de Israel” no texto por sua força pactual, esclarecendo-se a alternativa corrente em nota.
