  text: וְ/הִקְטִ֨יר אֹתָ֤/ם הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה אִשֶּׁ֖ה לַ/יהוָ֑ה אָשָׁ֖ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: pt
  text: O sacerdote os queimará no altar como oferta queimada para Yahweh[a]. É uma oferta pela culpa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta feita pelo fogo para Yahweh”. O termo hebraico designa uma oferta apresentada por meio do fogo.
    reason: lexical_alternative
  - marker: b
    text: Ou “oferta de reparação”; tradicionalmente, “oferta pela transgressão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: queimará
  rationale: O hifil de קטר, em contexto sacrificial, indica fazer a oferta subir em fumaça no altar. “Queimará” é claro e natural, e o contexto do altar comunica a função ritual.
- source_word: אֹתָם
  choice: os
  rationale: Pronome de objeto direto que retoma as porções do sacrifício mencionadas no contexto imediatamente anterior.
- source_word: הַכֹּהֵן
  choice: O sacerdote
  rationale: Substantivo definido singular, vertido pelo termo corrente da legislação cultual.
- source_word: הַמִּזְבֵּחָה
  choice: no altar
  rationale: Embora a forma direcional possa ser expressa literalmente como “para o altar”, a ação sacrificial é comunicada naturalmente em português por “no altar”.
- source_word: אִשֶּׁה
  choice: oferta preparada no fogo
  rationale: Termo técnico para uma oferta apresentada por meio do fogo. A formulação mantém explícito o elemento do fogo sem sugerir que a oferta seja alimento de Deus.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição indica que a oferta é destinada ou dedicada a Yahweh; “para” exprime isso naturalmente em português.
- source_word: אָשָׁם
  choice: oferta pela culpa
  rationale: Aqui o substantivo designa uma categoria sacrificial formal. “Oferta pela culpa” é uma expressão clara e estabelecida, enquanto “oferta de reparação” ressalta apenas um aspecto do rito.
- source_word: הוּא
  choice: É
  rationale: O pronome forma uma oração nominal que classifica o sacrifício; em português, a cópula sem pronome explícito é a construção mais natural.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido do termo sacrificial אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação; oferta pela transgressão
  rationale: O versículo identifica a oferta por sua categoria cultual. A escolha preserva a terminologia tradicional e compreensível, enquanto a nota registra alternativas que destacam outras dimensões sem resolver em excesso a amplitude do termo.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural e vocabulário sacrificial consistente. Os marcadores foram colocados junto aos termos a que suas notas se referem.
