  text: כָּל נֶ֖פֶשׁ אֲשֶׁר תֹּאכַ֣ל כָּל דָּ֑ם וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּֽי/הָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: pt
  text: Toda pessoa que comer qualquer sangue, essa pessoa será cortada do meio do seu povo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alma”. O hebraico nefesh designa aqui a pessoa, o indivíduo.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “será cortada” é uma fórmula usual de sanção da aliança; pode indicar remoção da comunidade ou juízo divino, e o hebraico não especifica aqui o modo exato da sanção.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: pessoa
  rationale: No contexto jurídico, נֶפֶשׁ designa o indivíduo inteiro, não especificamente uma alma imaterial. “Pessoa” é natural e exato em português.
- source_word: תֹּאכַל
  choice: comer
  rationale: O imperfeito na oração relativa apresenta um caso geral. A construção “que comer” expressa de modo idiomático essa condição legal em português.
- source_word: כָּל דָּם
  choice: qualquer sangue
  rationale: 'Com um substantivo incontável, כָּל tem aqui sentido distributivo: sangue de qualquer tipo, e não a totalidade de certo sangue.'
- source_word: וְנִכְרְתָה
  choice: será eliminada
  rationale: O nifal de כרת integra uma fórmula de sanção da aliança. “Será eliminada” conserva a ideia de remoção sem determinar se ocorre por exclusão comunitária, morte ou juízo divino.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: '[retomada pelo sujeito elíptico de “será eliminada”]'
  rationale: O hebraico retoma enfaticamente o infrator como “essa pessoa”. Em português, a repetição seria pesada; o sujeito já expresso em “toda pessoa” permanece claro, embora a nota registre a formulação literal.
- source_word: מֵעַמֶּיהָ
  choice: do meio do seu povo
  rationale: O sufixo feminino concorda gramaticalmente com נֶפֶשׁ e não restringe o preceito às mulheres. “Seu povo” é inclusivo e identifica a comunidade à qual a pessoa pertence.
theological_decisions:
- issue: Sentido da sanção da aliança expressa por וְנִכְרְתָה
  choice: 'Manter uma formulação ampla: “será eliminada do meio do seu povo”.'
  alternative: “será morta”, “será excluída da comunidade” ou “será destruída por Deus”
  rationale: A fórmula hebraica não especifica neste versículo o agente nem o modo da sanção. A tradução preserva essa ambiguidade jurídica e teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Qualquer sangue” preserva o alcance distributivo da proibição; “do meio do seu povo” soa natural no registro jurídico-bíblico. As duas notas têm marcadores correspondentes no texto principal.
