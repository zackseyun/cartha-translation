source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: pt
  text: Esta é a lei do sacrifício de paz que alguém apresentar a Yahweh:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifício de bem-estar”; tradicionalmente, “sacrifício pacífico”.
    reason: Registra a amplitude semântica de שְׁלָמִים, que pode evocar paz, integridade e bem-estar, bem como a designação tradicional em português.
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Esta
  rationale: O demonstrativo introduz uma nova seção. O ו funciona como ligação discursiva e não precisa ser traduzido por uma conjunção explícita em português.
- source_word: תּוֹרַת
  choice: a lei do
  rationale: No contexto sacerdotal, תּוֹרָה designa uma prescrição ritual; “lei” conserva o caráter normativo e a relação de estado construto.
- source_word: זֶבַח הַ/שְּׁלָמִים
  choice: sacrifício de paz
  rationale: זֶבַח é um sacrifício que envolve abate, e שְׁלָמִים é um termo sacrificial técnico ligado semanticamente a paz, integridade e bem-estar. A expressão no singular é natural em português como nome da categoria ritual.
- source_word: אֲשֶׁר יַקְרִיב
  choice: que alguém apresentar
  rationale: O hifil de קרב significa apresentar ou trazer para perto em contexto sacrificial. A forma masculina singular tem valor genérico na legislação; “alguém” preserva esse caráter sem restringir a norma a um homem específico. O futuro do subjuntivo é idiomático após a relativa de referência genérica.
- source_word: לַ/יהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário ou a dedicação do sacrifício, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Tradução do termo sacrificial שְׁלָמִים
  choice: sacrifício de paz
  alternative: sacrifício de bem-estar; sacrifício de comunhão; sacrifício pacífico
  rationale: “Sacrifício de paz” mantém uma formulação tradicional e compreensível, sem reduzir o campo semântico do termo a comunhão ou prosperidade. A alternativa ligada a bem-estar é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa e preserva o caráter jurídico-ritual do hebraico. O dois-pontos mantém a função introdutória do versículo para as prescrições seguintes.
