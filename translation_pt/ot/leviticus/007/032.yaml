  text: וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין תִּתְּנ֥וּ תְרוּמָ֖ה לַ/כֹּהֵ֑ן מִ/זִּבְחֵ֖י שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: pt
  text: E vocês darão ao sacerdote, como contribuição, a coxa direita dentre os sacrifícios das suas ofertas de comunhão.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a perna direita».
    reason: lexical_alternative
  - marker: b
    text: Ou «como oferta»; tradicionalmente, «como oferta alçada».
    reason: lexical_alternative
  - marker: c
    text: Ou «sacrifícios de ofertas de paz» ou «sacrifícios de ofertas de bem-estar».
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: coxa
  rationale: O termo designa a parte superior da perna do animal; «coxa» é anatomicamente mais preciso no contexto sacrificial, embora «perna» também seja possível.
- source_word: הַיָּמִין
  choice: direita
  rationale: Indica explicitamente o lado direito e identifica a porção reservada.
- source_word: תִּתְּנוּ
  choice: vocês darão
  rationale: O imperfeito na segunda pessoa do plural tem força diretiva em legislação; o futuro em português expressa adequadamente essa prescrição.
- source_word: תְרוּמָה
  choice: como contribuição
  rationale: Refere-se a uma porção separada e entregue; «contribuição» é claro e evita a expressão tradicional, porém pouco transparente, «oferta alçada».
- source_word: לַכֹּהֵן
  choice: ao sacerdote
  rationale: Mantém o destinatário no singular conforme o hebraico.
- source_word: מִזִּבְחֵי
  choice: dos seus sacrifícios
  rationale: A preposição indica a origem da porção, e o sufixo de segunda pessoa do plural é representado por «seus».
- source_word: שַׁלְמֵיכֶם
  choice: ofertas de comunhão
  rationale: Expressa o caráter relacional de שְׁלָמִים em português corrente, sem eliminar as alternativas legítimas «ofertas de paz» e «ofertas de bem-estar».
- source_word: וְאֵת
  choice: E
  rationale: A conjunção liga a instrução ao contexto anterior; o marcador de objeto direto não requer tradução independente.
theological_decisions: []
