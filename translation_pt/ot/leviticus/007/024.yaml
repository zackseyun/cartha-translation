source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: pt
  text: A gordura de um animal que morreu sem ser devidamente abatido[a] e a gordura de um animal dilacerado por feras[b] poderão ser usadas para qualquer uso; mas de modo nenhum vocês deverão comê-las.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico refere-se a um animal que morreu sem ser devidamente abatido. Outra tradução possível é “animal encontrado morto”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “animal dilacerado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: gordura
  rationale: Termo comum e natural para a gordura animal no contexto das leis alimentares e sacrificiais; evita tecnicismo desnecessário.
- source_word: נְבֵלָה
  choice: animal encontrado morto
  rationale: Expressa que o animal morreu sem o abate apropriado, sem limitar a causa a uma morte estritamente natural.
- source_word: טְרֵפָה
  choice: animal dilacerado por feras
  rationale: Comunica o sentido de um animal atacado e despedaçado por predadores, preservando o agente provável.
- source_word: יֵעָשֶׂה לְכָל מְלָאכָה
  choice: poderão ser usadas para qualquer outra finalidade
  rationale: No contexto, permite empregar essas gorduras em usos não alimentares; “outra finalidade” torna explícito o contraste com comer sem restringir o tipo de uso.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: mas de modo nenhum vocês deverão comê-las
  rationale: A construção com infinitivo absoluto intensifica a proibição; “de modo nenhum” preserva essa ênfase em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural para corresponder aos destinatários coletivos. A repetição de “a gordura” no hebraico é parcialmente condensada em português, e o pronome plural “comê-las” retoma as duas ocorrências.
