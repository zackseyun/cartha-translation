id: LEV.7.26
reference: Leviticus 7:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: pt
  text: E não comam sangue algum em nenhum dos lugares onde vocês morarem[a], seja de ave, seja de animal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “em todos os lugares onde vocês morarem” ou “em todos os seus assentamentos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “para ave e para animal”; o sentido é o sangue pertencente a aves e animais ou proveniente deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: E ... algum
  rationale: A conjunção liga a proibição às instruções anteriores; com a negação, כָּל é expresso naturalmente em português por “não... algum”.
- source_word: דָּם
  choice: sangue
  rationale: Equivalente direto e corrente de דָּם.
- source_word: לֹא תֹאכְלוּ
  choice: não comam
  rationale: O imperfeito de segunda pessoa masculina plural tem força proibitiva no contexto legal. O imperativo negativo é claro, atual e preserva essa força.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: em nenhum dos lugares onde vocês morarem
  rationale: Sob a negação, a formulação comunica de modo natural o alcance distributivo da proibição em todos os locais de residência de Israel.
- source_word: לָ/עוֹף
  choice: de ave
  rationale: O לְ indica aqui a categoria à qual o sangue pertence; “de ave” expressa essa relação sem restringi-la indevidamente.
- source_word: וְ/לַ/בְּהֵמָה
  choice: seja de animal
  rationale: בְּהֵמָה designa a categoria dos animais terrestres no contexto. A construção “seja... seja...” apresenta naturalmente em português as duas categorias abrangidas.
theological_decisions:
- issue: Alcance da proibição do sangue
  choice: A proibição abrange qualquer sangue de aves ou de animais em todos os lugares onde Israel morar.
  alternative: Traduzir mais literalmente a frase final como “para ave e para animal”, sem explicitar a relação de pertencimento ou origem.
  rationale: A sintaxe hebraica enumera mais naturalmente as categorias às quais pertence o sangue proibido. A tradução não acrescenta uma explicação teológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícita a segunda pessoa plural do hebraico; “não comam” evita o tom arcaico de uma formulação jurídica com “não comereis”.
