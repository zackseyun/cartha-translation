source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: pt
  text: Pois tomei dos filhos de Israel[c] o peito da oferta movida e a coxa da contribuição[a], dentre os seus sacrifícios de paz[b], e os dei a Arão, o sacerdote, e a seus filhos, como estatuto permanente da parte dos filhos de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a coxa da oferta elevada”. O termo hebraico designa uma porção separada e apresentada como oferta.
    reason: lexical_alternative
  - marker: b
    text: Ou “sacrifícios de comunhão”.
    reason: lexical_alternative
  - marker: c
    text: Ou “israelitas”, nas duas ocorrências. O hebraico diz literalmente “filhos de Israel”, uma designação pactual habitual.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: o peito da oferta movida
  rationale: חֲזֵה designa a porção do peito do animal, enquanto תְּנוּפָה identifica sua apresentação ritual por movimento. A formulação mantém o termo sacrificial técnico sem perder a clareza.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: a coxa da contribuição
  rationale: שׁוֹק refere-se à porção da coxa ou perna, e תְּרוּמָה a algo separado e apresentado como contribuição. “Coxa” é anatomicamente preciso; “contribuição” é atual e preserva a distinção em relação à oferta movida.
- source_word: לָקַחְתִּי
  choice: tomei
  rationale: O perfeito hebraico declara a ação divina que fundamenta a norma. O pretérito perfeito em português é natural e mantém a força jurídica da declaração.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz a designação pactual formal do hebraico e conserva sua repetição enfática no versículo.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: seus sacrifícios de paz
  rationale: Mantém visíveis tanto זֶבַח, “sacrifício”, quanto a categoria שְׁלָמִים. “De paz” preserva a terminologia cultual e evita limitar o sentido à ideia interpretativa de comunhão.
- source_word: וָאֶתֵּן אֹתָם
  choice: e os dei
  rationale: O pronome plural retoma conjuntamente o peito e a coxa. O pretérito perfeito acompanha naturalmente “tomei” e apresenta a concessão como ato estabelecido.
- source_word: לְחָק עוֹלָם
  choice: como estatuto permanente
  rationale: Expressa uma prescrição legal duradoura em linguagem moderna e digna, sem recorrer ao mais arcaizante “estatuto perpétuo”.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: da parte dos filhos de Israel
  rationale: Na ocorrência final, מֵאֵת indica a parte de quem procede regularmente a porção sacerdotal. “Da parte de” comunica essa relação melhor do que uma repetição portuguesa potencialmente ambígua de “dos”.
theological_decisions:
- issue: Designação pactual בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A expressão literal preserva a forma tradicional e pactual do texto hebraico. A nota reconhece a alternativa coletiva idiomática sem apagar a formulação da fonte.
- issue: Sentido da categoria sacrificial שְׁלָמִים
  choice: sacrifícios de paz
  alternative: sacrifícios de comunhão
  rationale: “Paz” mantém maior transparência lexical e continuidade cultual. “Comunhão” é possível, mas realça uma dimensão teológica e social sem esgotar a possível amplitude do termo.
- issue: Duração de חָק עוֹלָם
  choice: estatuto permanente
  alternative: estatuto perpétuo
  rationale: “Permanente” comunica a força duradoura da ordenança no âmbito em que é dada, sem resolver no próprio vocábulo questões teológicas sobre sua aplicação posterior.
translation_notes:
  register: Português contemporâneo, formal e acessível, com legibilidade brasileira e vocabulário cultual consistente. A ordem foi levemente ajustada para fluidez, mas a repetição de “filhos de Israel”, os dois atos divinos e as duas porções sacerdotais foram preservados.
