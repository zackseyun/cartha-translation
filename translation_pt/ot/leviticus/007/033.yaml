  text: הַ/מַּקְרִ֞יב אֶת דַּ֧ם הַ/שְּׁלָמִ֛ים וְ/אֶת הַ/חֵ֖לֶב מִ/בְּנֵ֣י אַהֲרֹ֑ן ל֧/וֹ תִהְיֶ֛ה שׁ֥וֹק הַ/יָּמִ֖ין לְ/מָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: pt
  text: Aquele dentre os filhos de Arão que apresentar o sangue das ofertas de paz[a] e a gordura receberá a coxa direita como sua porção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofertas de comunhão”.'
    reason: Alternativa lexical para שְׁלָמִים, que pode destacar a dimensão de comunhão da oferta.
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: aquele ... que apresentar
  rationale: O particípio hifil de קרב indica quem traz ou apresenta ritualmente a oferta; a construção preserva o valor participial e soa natural em português jurídico-sacerdotal.
- source_word: דַּם
  choice: sangue
  rationale: Correspondência direta e adequada ao contexto sacrificial.
- source_word: הַשְּׁלָמִים
  choice: ofertas de paz
  rationale: Mantém a designação tradicional e a associação lexical com paz e integridade, sem incorporar ao texto principal a interpretação relacional de comunhão.
- source_word: הַחֵלֶב
  choice: gordura
  rationale: Tradução direta; no contexto, refere-se às porções gordurosas determinadas para o sacrifício.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: dentre os filhos de Arão
  rationale: Expressa a seleção de um membro do grupo sacerdotal e conserva a formulação familiar masculina explícita do hebraico.
- source_word: לוֹ תִהְיֶה
  choice: receberá
  rationale: Comunica de modo natural o direito legal à porção; literalmente, a coxa 'será para ele'.
- source_word: שׁוֹק הַיָּמִין
  choice: coxa direita
  rationale: שׁוֹק designa aqui a parte superior da perna destinada à distribuição sacrificial; 'coxa' é mais precisa que 'perna'.
- source_word: לְמָנָה
  choice: como sua porção
  rationale: Expressa a ideia de parte atribuída ou quinhão legal.
theological_decisions:
- issue: Tradução de בְּנֵי אַהֲרֹן na legislação sacerdotal
  choice: filhos de Arão
  alternative: descendentes de Arão; família de Arão
  rationale: O hebraico emprega uma expressão masculina plural concreta para os sacerdotes dessa linhagem; preservá-la evita neutralizar ou ampliar silenciosamente a referência.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe jurídica clara. 'Arão' segue a forma bíblica corrente em português; 'apresentar' mantém o caráter ritual sem recorrer a linguagem excessivamente técnica.
