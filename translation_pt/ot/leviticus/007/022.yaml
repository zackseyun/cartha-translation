  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O waw consecutivo com דבר inicia uma nova unidade de discurso. “Falou” é natural em português e mantém a distinção possível em relação à fórmula seguinte לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; “a” é a forma idiomática em português na construção “falar a alguém”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula introdutória, o infinitivo hebraico anuncia as palavras que vêm a seguir. Em português atual, os dois-pontos expressam essa função com mais naturalidade do que “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título tradicional “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os dois-pontos reproduzem de modo idiomático a função de לֵאמֹר e indicam que o conteúdo da fala começa no versículo seguinte.
