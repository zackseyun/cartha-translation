  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: pt
  text: A carne de seu sacrifício de comunhão em ação de graças[a] será comida no dia em que ele a oferecer; ele não deixará nada dela até a manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu sacrifício pacífico em ação de graças”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשַׂר
  choice: A carne
  rationale: בשר designa a carne do animal; “carne” é natural em português e apropriado ao contexto sacrificial.
- source_word: זֶבַח
  choice: do sacrifício
  rationale: זבח se refere ao animal sacrificado ou ao sacrifício resultante do abate ritual; “sacrifício” preserva com clareza o registro cultual.
- source_word: תּוֹדַת שְׁלָמָיו
  choice: de sua oferta de comunhão em ação de graças
  rationale: A cadeia construta identifica uma oferta de comunhão da modalidade de ação de graças. A formulação mantém a categoria sacrificial e expressa a função de תודה sem criar um composto pouco natural em português.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: no dia em que ele a oferecer
  rationale: A expressão significa literalmente “no dia de sua oferta/apresentação”; a oração verbal é mais clara em português e entende corretamente o sufixo masculino como referência ao ofertante.
- source_word: יֵאָכֵל
  choice: será comida
  rationale: O Nifal imperfeito é passivo e, no contexto legal, expressa uma determinação; o futuro preserva essa força normativa sem explicitação excessiva.
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: não deixará nada dela
  rationale: O Hifil de נוח significa “deixar”; “nada dela” comunica idiomaticamente que nenhuma porção deve permanecer.
- source_word: עַד בֹּקֶר
  choice: até a manhã
  rationale: Tradução direta da expressão temporal, natural neste contexto em português.
theological_decisions:
- issue: Tradução da categoria sacrificial שְׁלָמִים
  choice: oferta de comunhão
  alternative: oferta pacífica
  rationale: O termo nomeia uma categoria sacrificial específica cuja etimologia e função exata não devem ser excessivamente definidas pela tradução. “Oferta de comunhão” é compreensível ao leitor moderno e evita que “pacífica” seja tomada apenas no sentido de ausência de conflito; a alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial consistente. A sintaxe foi levemente descompactada para clareza, sem eliminar a relação entre a ação de graças e a categoria de שְׁלָמִים.
