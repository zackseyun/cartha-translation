id: LEV.7.18
reference: Leviticus 7:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: pt
  text: Mas, se alguma parte da carne do seu sacrifício de comunhão[a] for comida no terceiro dia, o sacrifício não será aceito nem levado em conta a favor de quem o ofereceu. Será algo repugnante[b], e quem comer dele levará sobre si a sua culpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “sacrifício pacífico” ou “sacrifício de bem-estar”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é uma palavra técnica do culto para carne sacrificial que se tornou inaceitável e repulsiva; também pode ser traduzido como “carne contaminada” ou “coisa abominável”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com a regra anterior, preservando a força contextual da conjunção.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: for comida
  rationale: O infinitivo absoluto com o imperfeito intensifica a ideia verbal; em português, a passiva simples comunica a condição naturalmente sem duplicação artificial.
- source_word: מִבְּשַׂר
  choice: alguma parte da carne
  rationale: Expressa o valor partitivo de מִן e mantém o vocabulário sacrificial de בשר.
- source_word: זֶבַח שְׁלָמָיו
  choice: seu sacrifício de comunhão
  rationale: Identifica a categoria sacrificial e torna perceptível sua dimensão relacional; 'sacrifício pacífico' e 'sacrifício de bem-estar' também são possíveis.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: Equivalência temporal direta e idiomática.
- source_word: לֹא יֵרָצֶה
  choice: o sacrifício não será aceito
  rationale: No contexto cultual, o nifal de רצה indica que a oferta não obtém aceitação; a explicitação do sujeito evita ambiguidade em português.
- source_word: הַמַּקְרִיב אֹתוֹ לֹא יֵחָשֵׁב לוֹ
  choice: nem levado em conta a favor de quem o ofereceu
  rationale: Preserva a linguagem de avaliação ou contabilização de חשב com ל, sem impor uma noção teológica posterior de imputação.
- source_word: פִּגּוּל
  choice: algo repugnante
  rationale: Comunica a forte avaliação negativa do termo técnico sacrificial, cuja amplitude é explicada em nota.
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: e quem comer dele
  rationale: נפש designa aqui a pessoa; a formulação com 'quem' é natural, singular e inclusiva em português.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: levará sobre si a sua culpa
  rationale: Mantém o idioma hebraico de portar a própria culpa e sua possível responsabilidade penal sem reduzir explicitamente um sentido ao outro.
theological_decisions:
- issue: Sentido de זֶבַח שְׁלָמִים
  choice: sacrifício de comunhão
  alternative: sacrifício pacífico; sacrifício de bem-estar
  rationale: O termo nomeia uma categoria sacrificial associada a integridade, paz e refeição compartilhada. A opção principal é clara em português moderno, enquanto a nota conserva alternativas legítimas.
- issue: Alcance de עָוֹן na expressão נשא עון
  choice: levará sobre si a sua culpa
  alternative: carregará sua iniquidade; sofrerá a punição por sua culpa
  rationale: O hebraico pode abranger culpa e responsabilidade pelas consequências. A tradução conserva essa tensão em vez de identificar o termo exclusivamente com culpa moral ou punição.
- issue: Referência genérica de נֶפֶשׁ
  choice: quem comer dele
  alternative: a pessoa que comer dele
  rationale: A construção evita atribuir sexo ao referente genérico e representa naturalmente a pessoa individual indicada pelo substantivo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o caráter jurídico-sacrificial do versículo, evita arcaísmos como 'será imputado' e preserva em notas as alternativas lexicais genuínas.
