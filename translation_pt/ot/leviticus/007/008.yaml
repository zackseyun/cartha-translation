  source_fidelity: A redação transmite corretamente o sacerdote oficiante, o holocausto de um homem, a pele e a atribuição da pele ao mesmo sacerdote. Contudo, “ficará para si com a pele” não expressa de modo idiomático a fórmula possessiva hebraica לַכֹּהֵן לוֹ יִהְיֶה.
