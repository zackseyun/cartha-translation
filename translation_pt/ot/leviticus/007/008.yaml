source:
  edition: WLC
  text: וְ/הַ֨/כֹּהֵ֔ן הַ/מַּקְרִ֖יב אֶת עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽ/עֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: pt
  text: Quanto ao sacerdote que apresentar o holocausto de um homem[b], a pele[a] do holocausto que apresentou será dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a pele do animal; não couro já curtido.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o holocausto de um homem”; o masculino singular foi preservado, em vez de ser generalizado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução padrão de כֹּהֵן na legislação sacrificial, preservando o artigo definido.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: apresentar / apresentou
  rationale: No hifil, קרב tem aqui o sentido cultual de apresentar ou oferecer. “Apresentar” conserva a ideia de levar a oferta diante de Deus sem tornar a expressão excessivamente técnica.
- source_word: עֹלַת אִישׁ
  choice: o holocausto de um homem
  rationale: עֹלָה designa a oferta inteiramente queimada, tradicionalmente chamada “holocausto”; אִישׁ é singular masculino, preservado como “um homem”.
- source_word: עֹור
  choice: a pele
  rationale: Refere-se à pele do animal sacrificado. “Pele” é natural e amplamente compreensível em português; “couro” poderia sugerir material já curtido.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: Mantém a terminologia cultual consagrada e consistente para עֹלָה.
- source_word: אֲשֶׁר הִקְרִיב
  choice: que apresentou
  rationale: A oração relativa identifica o holocausto específico apresentado pelo sacerdote; o pretérito perfeito português expressa adequadamente a ação concluída.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: ficará para si
  rationale: Expressa de modo natural a construção enfática hebraica, literalmente “será para o sacerdote, para ele”, indicando que a pele pertence ao sacerdote oficiante.
theological_decisions:
- issue: Representação de gênero em אִישׁ
  choice: de um homem
  alternative: de uma pessoa / de alguém
  rationale: O hebraico emprega explicitamente o substantivo masculino singular אִישׁ. A tradução conserva essa forma sem generalizá-la silenciosamente.
- issue: Terminologia cultual de עֹלָה
  choice: holocausto
  alternative: oferta queimada / oferta de ascensão
  rationale: “Holocausto” é o termo bíblico português estabelecido para a oferta inteiramente consumida no altar. A alternativa etimológica “oferta de ascensão” seria menos reconhecível e poderia introduzir interpretação desnecessária.
- issue: Destinatário da pele
  choice: ficará para si
  alternative: pertencerá ao sacerdote
  rationale: O pronome לוֹ enfatiza que a pele cabe ao mesmo sacerdote que apresenta o sacrifício; a formulação escolhida preserva essa relação sem sugerir que pertença genericamente ao sacerdócio.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial tradicional. A ordem foi levemente ajustada à sintaxe natural do português, mantendo a repetição de “holocausto” e a identificação do sacerdote oficiante.
