source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: pt
  text: No lugar onde se abate o holocausto, será abatida a oferta pela culpa[a], e o sacerdote lançará o sangue dela contra todos os lados do altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de reparação” ou “oferta de compensação”. O termo hebraico ressalta tanto a culpa quanto a reparação do dano.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: No lugar onde
  rationale: Reproduz com naturalidade a indicação locativa específica do procedimento sacrificial.
- source_word: יִשְׁחֲטוּ / יִשְׁחֲטוּ
  choice: se abate / será abatida
  rationale: No contexto sacrificial, שׁחט indica o abate ritual. A construção impessoal em português preserva a referência não especificada do plural hebraico e evita um 'eles' sem antecedente explícito.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: Termo tradicional, conciso e amplamente reconhecido em português para a oferta inteiramente queimada.
- source_word: הָאָשָׁם
  choice: a oferta pela culpa
  rationale: Identifica a categoria sacrificial e preserva o vínculo lexical com culpa, sem ocultar em nota sua dimensão reparatória.
- source_word: דָּמוֹ
  choice: o sangue dela
  rationale: O sufixo remete ao animal da oferta pela culpa; a forma feminina concorda naturalmente com 'oferta'.
- source_word: יִזְרֹק
  choice: lançará
  rationale: זרק descreve o lançamento ou arremesso ritual do sangue, ação mais vigorosa que uma simples aspersão.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: contra o altar, ao redor
  rationale: Expressa a aplicação do sangue contra a superfície do altar em toda a sua volta.
theological_decisions:
- issue: Sentido do termo sacrificial אָשָׁם
  choice: oferta pela culpa
  alternative: oferta de reparação ou oferta de compensação
  rationale: A expressão principal mantém a categoria convencional ligada à culpa, enquanto a nota preserva a dimensão de reparação ou restituição sem reduzir o termo a apenas um de seus aspectos.
- issue: Sujeito singular de יִזְרֹק
  choice: o sacerdote lançará
  alternative: ele lançará
  rationale: O hebraico traz um verbo singular cujo agente é entendido pelo contexto ritual como o sacerdote. Explicitá-lo evita um pronome sem antecedente claro em português, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial reconhecível. Emprega construção impessoal no abate para representar naturalmente o plural hebraico sem antecedente expresso e explicita o sacerdote na ação ritual singular para assegurar clareza.
