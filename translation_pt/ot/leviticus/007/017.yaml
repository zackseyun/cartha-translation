base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: pt
  text: Mas o que restar da carne do sacrifício no terceiro dia será queimado no fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Mas o que restar
  rationale: O waw dá continuidade à prescrição anterior e pode ter leve força contrastiva; a forma substantivada do particípio é expressa naturalmente por “o que restar”.
- source_word: מִבְּשַׂר
  choice: da carne
  rationale: Embora בָּשָׂר também possa ser traduzido literalmente como “carne” no sentido corporal, aqui designa a carne do animal destinada ao consumo sacrificial; “carne” é claro e idiomático em português.
- source_word: הַזָּבַח
  choice: do sacrifício
  rationale: זֶבַח designa o animal sacrificado ou o próprio sacrifício; “sacrifício” preserva de modo direto o contexto ritual.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: É a correspondência temporal direta e natural da expressão hebraica.
- source_word: בָּאֵשׁ
  choice: no fogo
  rationale: Mantém a construção hebraica com ב e expressa de modo natural o meio e âmbito da queima.
- source_word: יִשָּׂרֵף
  choice: será queimado
  rationale: Preserva a voz passiva do nifal e comunica o valor prescritivo do imperfeito no registro legal.
