id: LEV.10.11
reference: Leviticus 10:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: pt
  text: e ensinar aos filhos de Israel todos os estatutos que Yahweh lhes declarou pela mão de Moisés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de Moisés”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: e ensinar
  rationale: A conjunção e o infinitivo causativo dão continuidade aos deveres sacerdotais mencionados no versículo anterior. “Ensinar” é claro e expressa adequadamente a instrução autorizada.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar hebraica e sua forma masculina, usada aqui coletivamente para o povo da aliança.
- source_word: כָּל הַחֻקִּים
  choice: todos os estatutos
  rationale: “Estatutos” mantém o registro jurídico e pactual de חֻקִּים, indicando prescrições estabelecidas.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: que Yahweh lhes declarou
  rationale: “Declarou” conserva a ideia de comunicação verbal de דִּבֶּר e produz uma construção natural em português com “estatutos”, sem transformar silenciosamente o verbo em “dar” ou “ordenar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: pela mão de Moisés
  rationale: Mantém a imagem idiomática hebraica e destaca o papel mediador de Moisés; a formulação mais corrente consta na nota.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido coletivo de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A tradução conserva a expressão masculina e familiar do hebraico, entendida corporativamente como referência ao povo da aliança.
- issue: Mediação expressa por בְּיַד מֹשֶׁה
  choice: pela mão de Moisés
  alternative: por meio de Moisés
  rationale: A expressão literal preserva a textura do original sem negar seu sentido instrumental ou mediador, explicitado na nota.
translation_notes:
  register: Português moderno, claro e digno, com leve preservação da textura jurídica e idiomática do hebraico. “Declarou” evita a combinação pouco natural “falou estatutos” sem acrescentar a noção específica de dar ou ordenar.
