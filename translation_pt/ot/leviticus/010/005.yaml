  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: pt
  text: Então se aproximaram e os carregaram em suas túnicas[a] para fora do acampamento, conforme Moisés havia dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelas suas túnicas”. A preposição hebraica também pode indicar o meio empregado; assim, talvez os tenham transportado segurando-os ou usando suas túnicas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: eles se aproximaram
  rationale: O qal wayyiqtol de קרב indica que se achegaram aos corpos para cumprir a ordem do versículo anterior. “Aproximaram-se” preserva o movimento sem acrescentar uma conotação ritual específica.
- source_word: וַיִּשָּׂאֻם
  choice: os levaram
  rationale: נשׂא com sufixo de objeto plural refere-se a Nadabe e Abiú. No contexto da remoção dos corpos, “levaram” é natural e implica transportá-los, sem a rigidez de “carregaram” como única possibilidade lexical.
- source_word: בְּכֻתֳּנֹתָם
  choice: ainda vestidos com suas túnicas
  rationale: כֻּתֹּנֶת designa uma túnica, e ב pode marcar circunstância ou meio. A formulação principal expressa a leitura circunstancial — os mortos foram levados com as túnicas vestidas — e a nota preserva a leitura instrumental.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: A combinação אֶל מִחוּץ expressa movimento até um local exterior ao acampamento. “Para fora do acampamento” reproduz naturalmente essa direção em português.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: conforme Moisés havia ordenado
  rationale: דבר significa literalmente “falou”, mas o contexto imediato é uma instrução explícita de Moisés. “Havia ordenado” torna clara a referência retrospectiva e a força pragmática da fala, sem alterar seu conteúdo.
