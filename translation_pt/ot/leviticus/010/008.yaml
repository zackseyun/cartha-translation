  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/008.yaml
  text: And Yahweh spoke to Aaron[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Arão[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, o nome divino, transliterado aqui como “Yahweh”; outra forma é “Jeová”.
    reason: Esclarece a representação do tetragrama e distingue a forma adotada de uma forma alternativa.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O waw consecutivo dá continuidade à narrativa, e דִּבֵּר indica o ato de falar. A formulação preserva a introdução convencional do discurso divino em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; “falar a alguém” é uma construção portuguesa correta, concisa e adequada ao registro bíblico.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz o conteúdo da fala. Em português atual, os dois-pontos desempenham naturalmente essa função e evitam a fórmula menos idiomática “dizendo” antes do discurso direto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino mediante uma transliteração acadêmica amplamente aceita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com a concisão da fórmula hebraica. Os dois-pontos introduzem o discurso que começa no versículo seguinte.
