source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: pt
  text: Vocês devem comê-la num lugar santo, pois ela é a sua porção e a porção de seus filhos, proveniente das ofertas de alimento de Yahweh[a], porque assim me foi ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das ofertas feitas pelo fogo a Yahweh”.'
    reason: Registra uma tradução mais literal e tradicional de אִשֵּׁי, preservando a possível associação explícita com o fogo.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתָהּ
  choice: Vocês devem comê-la
  rationale: O verbo se dirige a um grupo masculino plural e, neste contexto instrutivo, expressa obrigação. “Devem comê-la” soa natural em português e mantém o pronome feminino que retoma a oferta mencionada.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: num lugar santo
  rationale: A expressão hebraica não tem artigo definido. “Num lugar santo” evita identificar indevidamente um recinto específico e preserva o sentido cultual de קָדֹשׁ.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: a porção que cabe a você e a seus filhos
  rationale: Neste contexto sacerdotal, חֹק designa a parte atribuída por direito. A formulação explicita esse sentido concreto, preservando “filhos”, pois o hebraico se refere especificamente aos descendentes masculinos de Arão.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: proveniente das ofertas de alimento de Yahweh
  rationale: אִשֶּׁה designa uma categoria de oferta sacrificial associada ao altar. “Ofertas de alimento” comunica o uso cultual em linguagem atual; a tradução tradicional ligada ao fogo é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título, preservando sua função como nome próprio no texto hebraico.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: porque assim me foi ordenado
  rationale: Mantém tanto a relação explicativa introduzida por כִּי quanto a voz passiva, pela qual Moisés declara ter recebido a ordem.
theological_decisions:
- issue: Sentido de חֹק no contexto sacerdotal
  choice: porção que cabe
  alternative: estatuto; direito; cota
  rationale: O contexto trata da parte da oferta destinada aos sacerdotes, não primariamente de uma norma abstrata. A tradução escolhida expressa a atribuição concreta sem acrescentar uma doutrina posterior.
- issue: Sentido cultual de אִשֵּׁי יְהוָה
  choice: ofertas de alimento de Yahweh
  alternative: ofertas feitas pelo fogo a Yahweh
  rationale: A expressão identifica ofertas apresentadas a Yahweh no culto. A redação principal privilegia clareza moderna, enquanto a nota conserva a associação lexical tradicional com o fogo e deixa visível a questão tradutória.
- issue: Mudança entre destinatários plurais e sufixos singulares
  choice: Vocês ... a você e a seus filhos
  alternative: Vocês ... a vocês e a seus filhos
  rationale: O verbo plural inclui Arão e seus filhos, mas os sufixos singulares de חָקְךָ e בָּנֶיךָ se dirigem especificamente a Arão. A mudança de número foi preservada, em vez de ser uniformizada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para tornar explícito o destinatário plural e “você” para conservar a mudança hebraica ao singular referente a Arão. O marcador da nota foi colocado junto à expressão que ele explica.
