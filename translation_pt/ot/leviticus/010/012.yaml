base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: pt
  text: 'Então Moisés disse a Arão e a Eleazar e a Itamar, seus filhos que restaram: “Peguem a oferta de cereal que resta das ofertas apresentadas pelo fogo a Yahweh[a] e comam-na sem fermento junto ao altar, pois ela é santíssima.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das ofertas de alimento de Yahweh”.'
    reason: Alternativa lexical para אִשֵּׁי, termo cultual associado a ofertas apresentadas no fogo e possivelmente entendido como ofertas de alimento.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então Moisés disse
  rationale: O waw consecutivo dá continuidade à narrativa. “Então” expressa a sequência de modo natural em português, e “disse” introduz adequadamente a fala direta.
- source_word: הַנּוֹתָרִים
  choice: seus filhos que restaram
  rationale: O particípio indica os filhos de Arão que ficaram depois da morte de Nadabe e Abiú. A formulação preserva essa relação contextual sem tornar explícita demais a ideia de sobrevivência.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: No contexto sacrificial de Levítico, מִנְחָה designa a oferta feita de produtos do cereal, e não uma oferta genérica.
- source_word: הַנּוֹתֶרֶת
  choice: que resta
  rationale: O particípio feminino modifica “oferta de cereal” e se refere à porção restante depois da parte oferecida a Yahweh.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: das ofertas apresentadas pelo fogo a Yahweh
  rationale: A expressão cultual אִשֵּׁי está ligada a ofertas apresentadas no fogo. A tradução conserva essa imagem sem sugerir que toda a oferta necessariamente fosse consumida pelas chamas; uma alternativa semântica é registrada em nota.
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: e comam-na sem fermento
  rationale: מַצּוֹת funciona de modo predicativo ou adverbial, especificando que a oferta devia ser comida sem fermento.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: junto ao altar
  rationale: אֵצֶל expressa proximidade. “Junto ao altar” é claro e natural em português.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssima
  rationale: A construção hebraica é superlativa e indica o mais elevado grau de santidade. Como se refere à oferta, o feminino “santíssima” é natural e preciso.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Sentido cultual de אִשֵּׁי
  choice: ofertas apresentadas pelo fogo
  alternative: ofertas de alimento
  rationale: A tradução principal conserva a associação explícita do termo com o fogo sacrificial, enquanto a nota reconhece sua possível extensão semântica como ofertas de alimento apresentadas a Deus.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantiveram-se a terminologia sacrificial e o nome Yahweh; evitou-se “ofertas queimadas”, que poderia sugerir incorretamente que as ofertas eram sempre consumidas por inteiro.
