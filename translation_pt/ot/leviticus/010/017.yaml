source:
  edition: WLC
  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: pt
  text: Por que vocês não comeram a oferta pelo pecado[a] no lugar santo? Ela é santíssima, e ele a deu a vocês para carregarem a iniquidade da comunidade e fazerem expiação pela comunidade diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de purificação”. O termo hebraico חַטָּאת pode designar a oferta relacionada tanto ao pecado quanto à remoção de impureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Interrogativo direto de causa, natural em português e adequado ao tom de repreensão.
- source_word: לֹא אֲכַלְתֶּם
  choice: vocês não comeram
  rationale: O perfeito hebraico se refere ao ato passado que motiva a repreensão; o pretérito perfeito é natural em português.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: No contexto, o termo designa certamente uma oferta sacrificial. A tradução tradicional é clara, enquanto a dimensão de purificação é preservada em nota.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: no lugar santo
  rationale: Designa a área sagrada determinada para o consumo sacerdotal, sem confundi-la necessariamente com o recinto interior.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssima
  rationale: Expressa de modo idiomático o superlativo hebraico aplicado à oferta.
- source_word: וְאֹתָהּ נָתַן לָכֶם
  choice: e ele a deu a vocês
  rationale: Mantém o verbo na voz ativa e o sujeito masculino implícito, contextualmente Deus, sem explicitá-lo além do hebraico.
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: para carregarem a iniquidade da comunidade
  rationale: Preserva a metáfora de נשא e a amplitude moral e cultual de עָוֹן, sem definir de modo excessivo o mecanismo envolvido.
- source_word: הָעֵדָה
  choice: a comunidade
  rationale: Termo corrente e abrangente para a coletividade de Israel; evita a possível conotação exclusivamente eclesiástica de 'congregação'.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: fazerem expiação por eles
  rationale: Conserva a terminologia sacrificial estabelecida e não especifica além do texto o mecanismo da expiação.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Traduz diretamente o nome divino e preserva o sentido cultual de atuação na presença de Yahweh.
theological_decisions:
- issue: Sentido de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O referente sacrificial é inequívoco, mas o termo pode destacar tanto o pecado quanto a remoção de impureza; a alternativa é mantida em nota.
- issue: Sujeito de נָתַן
  choice: ele a deu a vocês
  alternative: ela foi dada a vocês
  rationale: O hebraico apresenta um verbo masculino singular sem sujeito expresso. O contexto aponta para Deus, mas o pronome não é expandido para 'Deus', preservando a forma e a discrição do original.
- issue: Função sacerdotal em לָשֵׂאת אֶת עֲוֺן
  choice: carregarem a iniquidade
  alternative: levarem a culpa
  rationale: A formulação mantém a tensão representativa e cultual da expressão hebraica sem reduzi-la apenas a culpa subjetiva, punição ou remoção ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por 'vocês'. A sintaxe conserva o tom direto da repreensão de Moisés e a terminologia sacrificial, evitando formulações denominacionais.
