  naturalness: O registro é moderno, direto e adequado. «Por que vocês» e «oferta pelo pecado» são naturais. A substituição de «por eles» por «pela comunidade» melhora a coesão referencial em português.
  terminology: «Oferta pelo pecado», «lugar santo», «santíssima», «iniquidade» e «expiação» são escolhas fiéis e apropriadas ao contexto sacrificial. A nota preserva corretamente a alternativa lexical «oferta de purificação». «Yahweh» está coerente com o texto inglês de auditoria fornecido.
