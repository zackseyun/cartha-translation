base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: pt
  text: 'Moisés disse a Arão e a Eleazar e Itamar, filhos de Arão: “Não deixem os cabelos soltos[a] nem rasguem as suas roupas, para que vocês não morram e ele não se ire contra toda a comunidade. Mas os irmãos de vocês, toda a casa de Israel, chorarão pelo incêndio que Yahweh ateou[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não descubram a cabeça” ou “Não deixem o cabelo desalinhado”. O hebraico se refere a um sinal de luto relacionado à cabeça ou ao cabelo.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “a queima que Yahweh queimou”. A tradução emprega uma expressão natural em português, preservando a ação direta de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: Não deixem os cabelos soltos
  rationale: O verbo פרע descreve aqui deixar o cabelo solto ou desarrumado, como sinal de luto. A formulação comunica o gesto em português atual sem pressupor especificamente a retirada de uma cobertura da cabeça.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: nem rasguem as suas roupas
  rationale: פרם indica rasgar as vestes, especialmente como manifestação de luto; esta é uma formulação clara e natural em português.
- source_word: וְלֹא תָמֻתוּ
  choice: para que vocês não morram
  rationale: A oração exprime a consequência que as proibições visam evitar, preservando a força solene da advertência.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: e ele não se ire contra toda a comunidade
  rationale: O verbo está no singular e seu sujeito implícito, no contexto, é Yahweh. O pronome mantém essa referência implícita sem substituir o verbo por um substantivo abstrato como 'ira'.
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: os irmãos de vocês, toda a casa de Israel
  rationale: Mantém tanto o masculino plural do hebraico quanto a expressão coletiva e pactual 'toda a casa de Israel'.
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: chorarão pelo incêndio
  rationale: שְׂרֵפָה designa concretamente a queima causada pelo fogo divino; 'incêndio' conserva essa imagem sem a reinterpretar como simples desastre ou juízo.
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: que Yahweh ateou
  rationale: O verbo 'atear' combina naturalmente com 'incêndio' em português e atribui diretamente a ação a Yahweh, evitando a repetição pouco idiomática 'a queima que queimou'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de o substituir por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal e pactual.
- issue: Sujeito implícito de יִקְצֹף
  choice: ele não se ire contra toda a comunidade
  alternative: a ira não venha sobre toda a comunidade
  rationale: O hebraico traz um verbo singular sem sujeito expresso. No contexto, Yahweh é o referente implícito; o pronome conserva essa relativa implicitude e evita transformar a ação pessoal em um substantivo abstrato.
- issue: Alcance da negação na advertência
  choice: para que vocês não morram e ele não se ire
  alternative: para que vocês não morram, e ele se ire
  rationale: Em português, repete-se a negação para deixar claro que tanto a morte dos sacerdotes quanto a ira contra a comunidade são consequências a evitar. Isso expressa a força contextual da coordenação hebraica sem fazer da ira um resultado desejado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais como “vocês” e “suas roupas”. A expressão tradicional “casa de Israel” foi mantida por seu valor coletivo, histórico e pactual.
