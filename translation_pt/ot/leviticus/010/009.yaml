base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: pt
  text: Você e seus filhos não bebam vinho nem bebida alcoólica[a] quando entrarem na tenda do encontro, para que não morram[b]. Este é um estatuto permanente[c] por todas as suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bebida forte”. O hebraico refere-se de modo amplo a bebida alcoólica além do vinho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sob pena de morrerem”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “estatuto perpétuo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן
  choice: vinho
  rationale: Termo hebraico comum para vinho de uvas; o contexto não exige ampliação nem restrição do sentido.
- source_word: שֵׁכָר
  choice: bebida forte
  rationale: Designa bebida alcoólica além do vinho. A expressão é tradicional, compreensível e suficientemente ampla; a nota esclarece o alcance.
- source_word: אַל תֵּשְׁתְּ
  choice: não bebam
  rationale: אַל com a forma verbal expressa proibição. O imperativo negativo é natural em português e mantém a força direta da ordem.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: Você e seus filhos com você
  rationale: Preserva os destinatários explícitos e também אִתָּךְ, enfatizando que tanto Arão quanto seus filhos estão abrangidos.
- source_word: בְּבֹאֲכֶם
  choice: quando entrarem
  rationale: O infinitivo com בְּ indica a circunstância temporal da entrada; a construção portuguesa é natural e precisa.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução transparente da designação cultual, em linguagem digna e acessível.
- source_word: וְלֹא תָמֻתוּ
  choice: para que não morram
  rationale: Expressa naturalmente a consequência fatal a ser evitada, sem transformar a sequência hebraica em uma fórmula causal mais rígida do que o texto permite.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: Fórmula jurídica que indica uma ordenança duradoura. 'Permanente' comunica o valor temporal em português atual.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Expressa a continuidade da norma entre gerações sucessivas.
theological_decisions:
- issue: Força da cláusula de morte
  choice: para que não morram
  alternative: sob pena de morrerem; e não morrerão
  rationale: A formulação conserva a nuance preventiva e a advertência de consequência mortal, sem decidir além do que a sintaxe hebraica exige.
- issue: Âmbito da proibição
  choice: A proibição é vinculada à entrada na tenda do encontro.
  alternative: Abstinência total dos sacerdotes em todas as circunstâncias.
  rationale: A expressão temporal 'quando entrarem' delimita explicitamente a situação; não se importa para o versículo uma proibição universal.
- issue: Duração do estatuto
  choice: estatuto permanente
  alternative: estatuto perpétuo
  rationale: '''Permanente'' preserva a força duradoura de עוֹלָם em linguagem atual, enquanto a alternativa mais literal é registrada em nota.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a repetição enfática 'com você', embora seja menos usual, por corresponder ao hebraico. A formulação legal evita arcaísmos desnecessários e conserva a delimitação cultual da ordem.
