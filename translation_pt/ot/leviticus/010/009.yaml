  - severity: low
    issue: «Bebida forte» pode estreitar o sentido de שֵׁכָר.
    rationale: Em português atual, a expressão pode evocar sobretudo bebidas destiladas. O termo hebraico abrange bebida intoxicante além do vinho; «bebida alcoólica» preserva melhor essa amplitude.
