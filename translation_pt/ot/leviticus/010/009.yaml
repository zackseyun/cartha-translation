revisions:
- from: Você e seus filhos com você não bebam vinho nem bebida forte[a] quando entrarem na tenda do encontro, para que não morram[b]. Este é um estatuto permanente[c] por todas as suas gerações.
  to: Você e seus filhos não bebam vinho nem bebida alcoólica[a] quando entrarem na tenda do encontro, para que não morram[b]. Este é um estatuto permanente[c] por todas as suas gerações.
  rationale: A revisão corrige a formulação pouco idiomática do destinatário coletivo sem alterar seu alcance e adota uma designação portuguesa mais ampla para שֵׁכָר. Mantêm-se a nuance preventiva de «para que não morram», a restrição à entrada na tenda e as três âncoras de nota.
