base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: pt
  text: 'Então Moisés chamou Misael e Elzafã, filhos de Uziel, tio de Arão, e lhes disse: “Aproximem-se e carreguem seus irmãos[a] de diante do santuário[b] para fora do acampamento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “irmãos” também pode designar parentes próximos do sexo masculino; aqui se refere a Nadabe e Abiú, que eram primos de Misael e Elzafã.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do lugar santo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Neste contexto narrativo, קרא indica chamar alguém para lhe dirigir uma ordem; “chamou” é direto e natural.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: filhos de Uziel
  rationale: A construção identifica Misael e Elzafã diretamente como filhos de Uziel, não apenas como seus descendentes.
- source_word: דֹּד אַהֲרֹן
  choice: tio de Arão
  rationale: דּוֹד designa naturalmente um tio neste contexto de parentesco; a expressão está em aposição a Uziel.
- source_word: קִרְבוּ
  choice: Aproximem-se
  rationale: O imperativo conserva o sentido espacial de chegar perto ou se aproximar, adequado ao cenário junto ao santuário.
- source_word: שְׂאוּ
  choice: carreguem
  rationale: נשא pode significar levantar, carregar ou levar; aqui se refere à remoção dos corpos, e “carreguem” preserva concretamente a ação.
- source_word: אֲחֵיכֶם
  choice: seus irmãos
  rationale: Embora Nadabe e Abiú fossem primos deles, אָח pode designar parentes próximos do sexo masculino. A tradução mantém a linguagem de parentesco do hebraico, esclarecida em nota.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: de diante do santuário
  rationale: A expressão preserva o valor espacial de פְּנֵי, “diante de”, e entende הַקֹּדֶשׁ como o recinto sagrado neste contexto.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: A formulação comunica claramente o movimento em direção a um lugar situado fora do acampamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas nominais bíblicas correntes no uso brasileiro. A ordem solene foi mantida sem linguagem excessivamente arcaica; a coordenação dos dois imperativos produz uma frase natural sem eliminar sua força própria.
