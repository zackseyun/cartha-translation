source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: pt
  text: 'Então Moisés disse a Arão: “Foi isto que Yahweh disse: ‘Entre os que se aproximam de mim, mostrarei que sou santo[a], e diante de todo o povo serei glorificado[b]’.” E Arão ficou em silêncio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por aqueles que se aproximam de mim, serei tratado como santo”. O hebraico pode indicar tanto a manifestação da santidade de Deus quanto o fato de ele ser reconhecido e tratado como santo pelos que se aproximam dele.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “serei honrado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה לֵאמֹר
  choice: Foi isto que Yahweh disse
  rationale: Reproduz naturalmente a fórmula identificadora e o verbo de fala, sem a redundância pouco idiomática de “falou, dizendo” em português.
- source_word: בִּקְרֹבַי
  choice: Entre os que se aproximam de mim
  rationale: Expressa tanto a proximidade quanto o sentido cultual de aproximar-se de Deus, sem restringir indevidamente a referência aos sacerdotes.
- source_word: אֶקָּדֵשׁ
  choice: mostrarei que sou santo
  rationale: Comunica em português corrente a manifestação da santidade divina sugerida pelo nifal, enquanto a nota preserva a possibilidade de reconhecimento ou tratamento de Deus como santo.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: e diante de todo o povo
  rationale: Equivalente idiomático da expressão hebraica, mantendo o caráter público da declaração.
- source_word: אֶכָּבֵד
  choice: serei glorificado
  rationale: Preserva o peso teológico e a forma passiva do verbo, com “serei honrado” registrado como alternativa lexical.
- source_word: וַיִּדֹּם אַהֲרֹן
  choice: E Arão ficou em silêncio
  rationale: Transmite de modo claro e solene o silêncio ou a imobilidade responsiva de Arão.
theological_decisions:
- issue: Como expressar a santidade de Deus em relação aos que se aproximam dele
  choice: Entre os que se aproximam de mim, mostrarei que sou santo
  alternative: Por aqueles que se aproximam de mim, serei tratado como santo
  rationale: O hebraico admite tanto a manifestação da santidade de Deus quanto seu reconhecimento pelos que se aproximam. A redação principal é natural e mantém a iniciativa divina; a nota conserva a outra nuance sem resolver silenciosamente a tensão.
- issue: Como traduzir אֶכָּבֵד no contexto da honra pública de Deus
  choice: serei glorificado
  alternative: serei honrado
  rationale: “Glorificado” conserva a ressonância teológica de כבד e o paralelismo com a santidade, enquanto “honrado” explicita uma alternativa lexical legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Evita o potencialmente enganoso “serei santificado”, que em português pode sugerir que Deus se torna santo, mas preserva a ambiguidade legítima em nota. Os marcadores [a] e [b] aparecem junto às expressões a que se referem.
