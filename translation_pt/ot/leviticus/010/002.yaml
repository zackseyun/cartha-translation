  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: pt
  text: Então saiu fogo da presença de Yahweh[a] e os consumiu; e eles morreram diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “de diante de Yahweh”; também: “da presença de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Então saiu
  rationale: O wayyiqtol de יצא dá sequência à narrativa. “Saiu” preserva o movimento a partir da presença divina; “então” expressa naturalmente a progressão narrativa, sem acrescentar relação causal explícita.
- source_word: אֵשׁ
  choice: fogo
  rationale: O substantivo denota fogo, apresentado aqui como agente do juízo imediato.
- source_word: מִלִּפְנֵי יְהוָה
  choice: da presença de Yahweh
  rationale: A expressão significa literalmente “de diante da face/presença de Yahweh”. “Da presença de Yahweh” comunica com clareza a origem do fogo e preserva o sentido espacial e teológico.
- source_word: וַתֹּאכַל
  choice: e os consumiu
  rationale: Embora אכל tenha o sentido básico de “comer”, quando o sujeito é fogo, “consumir” é a expressão portuguesa natural e mantém a força destrutiva do verbo.
- source_word: אֹתָם
  choice: os
  rationale: O pronome de objeto direto retoma Nadabe e Abiú no contexto imediato.
- source_word: וַיָּמֻתוּ
  choice: e eles morreram
  rationale: A forma de מות é ativa e intransitiva. A tradução declara o resultado sem substituí-lo por uma formulação passiva interpretativa como “foram mortos”.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” reproduz de modo natural a locução hebraica e conserva a repetição solene da referência à presença de Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Se וַיָּמֻתוּ deve ser traduzido como resultado simples ou causação passiva
  choice: eles morreram
  alternative: foram mortos
  rationale: O hebraico emprega um verbo ativo intransitivo, enquanto a oração anterior já indica a causa. A formulação simples evita explicitação além do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O ponto e vírgula separa o ato consumidor de seu resultado sem eliminar a repetição coordenada do hebraico. A primeira ocorrência de לִפְנֵי é vertida como “presença”, e a segunda como “diante de”, preservando o sentido em português natural; a nota registra a forma mais literal da primeira expressão.
