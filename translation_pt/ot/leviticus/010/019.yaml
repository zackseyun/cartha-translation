  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: pt
  text: 'Então Arão disse a Moisés: “Veja, hoje eles apresentaram diante de Yahweh a oferta pelo pecado[a] e o holocausto deles, e coisas como estas me aconteceram[b]. Se hoje eu tivesse comido a oferta pelo pecado, isso teria sido bom aos olhos de Yahweh[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação” (também na segunda ocorrência). O hebraico חַטָּאת pode designar o pecado ou o sacrifício relacionado à purificação do pecado ou da impureza; em Levítico, “oferta pelo pecado” é a tradução convencional.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e coisas como estas me aconteceram”. Arão se refere às calamidades daquele dia, especialmente à morte de seus filhos.
    reason: cultural_note
  - marker: c
    text: Ou “isso teria agradado a Yahweh?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Veja
  rationale: Partícula que chama a atenção para a explicação de Arão; “Veja” é atual e conserva sua força discursiva.
- source_word: הִקְרִיבוּ
  choice: apresentaram
  rationale: No hifil de קרב e em contexto sacrificial, indica apresentar ou oferecer diante de Deus.
- source_word: חַטָּאתָם / חַטָּאת
  choice: a oferta pelo pecado deles / a oferta pelo pecado
  rationale: Em Levítico, חַטָּאת designa habitualmente o sacrifício associado ao pecado ou à purificação, não o pecado abstrato.
- source_word: עֹלָתָם
  choice: o holocausto deles
  rationale: Termo sacrificial convencional e conciso em português para a oferta inteiramente queimada.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Conserva a expressão cultual de apresentação na presença divina e translitera o nome próprio.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: coisas como estas me aconteceram
  rationale: Expressa naturalmente as calamidades daquele dia sem determinar além do texto sua relação ritual precisa.
- source_word: וְאָכַלְתִּי
  choice: Se ... eu tivesse comido
  rationale: Embora formalmente seja waw mais qatal, o contexto da pergunta retórica favorece uma construção contrafactual em português.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: isso teria sido bom aos olhos de Yahweh
  rationale: Preserva o idioma hebraico de aprovação divina e a forma interrogativa, sem substituí-lo diretamente por “teria agradado”.
theological_decisions:
- issue: Natureza da defesa retórica de Arão por não comer a oferta
  choice: Arão pergunta se, diante das calamidades daquele dia, comer a oferta teria sido bom aos olhos de Yahweh.
  alternative: Entender a fala apenas como expressão de luto pessoal, ou como dúvida específica sobre sua aptidão ritual para comer.
  rationale: O hebraico liga a pergunta aos acontecimentos trágicos, mas não especifica se o problema é luto, condição cerimonial ou conveniência mais ampla; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém terminologia sacrificial convencional, o nome Yahweh e o caráter retórico da fala de Arão, sem resolver a causa ritual ou emocional implícita.
