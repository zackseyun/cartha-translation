  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: pt
  text: Trarão a coxa[a] da contribuição[b] e o peito da oferta movida[c], com as ofertas queimadas das porções de gordura, para apresentá-los ritualmente como oferta movida diante de Yahweh[d]. Isso pertencerá a você e a seus filhos com você, como estatuto permanente, conforme Yahweh ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perna”.
    reason: lexical_alternative
  - marker: b
    text: “Contribuição” é tradicionalmente traduzida por “oferta alçada”.
    reason: lexical_alternative
  - marker: c
    text: “Oferta movida” designa uma apresentação ritual diante de Yahweh; também pode ser traduzido de modo mais geral por “oferta de apresentação”.
    reason: cultural_note
  - marker: d
    text: O hebraico traz o nome divino YHWH, aqui representado por “Yahweh”; muitas traduções usam “SENHOR”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: coxa
  rationale: No contexto sacrificial, designa a parte superior da perna traseira do animal; “coxa” é mais precisa do que o termo amplo “perna”.
- source_word: תְּרוּמָה
  choice: contribuição
  rationale: Designa uma porção separada e entregue; “contribuição” comunica isso em linguagem atual sem recorrer ao jargão tradicional “oferta alçada”.
- source_word: חָזֶה
  choice: peito
  rationale: É o termo anatômico claro e convencional para essa porção do sacrifício.
- source_word: תְּנוּפָה
  choice: oferta movida
  rationale: Preserva a relação entre o substantivo ritual e o verbo cognato הניף. A nota esclarece que se trata de uma apresentação ritual diante de Yahweh.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: junto com as ofertas feitas no fogo das porções de gordura
  rationale: Expressa a associação das porções sacerdotais com as porções gordurosas destinadas ao fogo, preservando a linguagem sacrificial sem sugerir gordura em sentido abstrato.
- source_word: יָבִיאוּ
  choice: Trarão
  rationale: O imperfeito tem força prescritiva neste contexto legal; o futuro português transmite naturalmente a instrução.
- source_word: לְהָנִיף תְּנוּפָה
  choice: para movê-los como oferta movida
  rationale: Mantém o verbo e o substantivo cognatos do hebraico e torna explícito, pelo pronome, que as duas porções são submetidas ao gesto ritual.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Formulação natural que preserva o sentido cultual de realização na presença divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ
  choice: Isso pertencerá a você e a seus filhos com você
  rationale: Comunica o direito sacerdotal às porções. “Isso” preserva o singular hebraico, entendido como referência ao conjunto da concessão.
- source_word: לְחָק עוֹלָם
  choice: como estatuto permanente
  rationale: Expressa uma determinação duradoura em linguagem moderna, sem a possível conotação metafísica de “eterno”.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: conforme Yahweh ordenou
  rationale: Indica que a prática corresponde à ordem divina anteriormente dada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título; a nota registra a tradição de tradução.
- issue: Terminologia do rito de תְּנוּפָה
  choice: oferta movida
  alternative: oferta de apresentação
  rationale: “Oferta movida” preserva o vínculo formal entre o nome do rito e o verbo cognato, sem definir com precisão indevida a forma física do gesto; a nota apresenta a alternativa funcional.
- issue: Alcance de חָק עוֹלָם
  choice: estatuto permanente
  alternative: estatuto perpétuo; direito eterno
  rationale: A formulação mantém a força duradoura da prescrição dentro da ordem cultual de Israel sem acrescentar uma conclusão sobre sua aplicação fora desse contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém termos cultuais necessários, mas os esclarece em notas; evita formas arcaicas como “oferta alçada” no texto principal e preserva a repetição técnica entre o verbo e o substantivo de תְּנוּפָה.
