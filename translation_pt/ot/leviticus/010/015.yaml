review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente as porções sacrificiais, a apresentação ritual diante de Yahweh e a concessão duradoura aos sacerdotes. Contudo, a formulação “para movê-los como oferta movida” introduz um pronome plural não expresso e soa pouco natural em português; uma redação que descreva a apresentação ritual preserva melhor a construção hebraica sem especificar indevidamente o gesto.
  naturalness: O registro é moderno e claro. “Oferta movida” é um termo cultual aceitável, especialmente com nota explicativa, mas “movê-los como oferta movida” é artificial. Também se corrige a concordância em uma nota.
  terminology: “Coxa”, “peito”, “contribuição”, “oferta movida”, “ofertas queimadas” e “estatuto permanente” são escolhas adequadas. “Ofertas queimadas das porções de gordura” exprime de modo mais direto אִשֵּׁי הַחֲלָבִים do que “ofertas feitas no fogo das porções de gordura”.
  issues:
  - severity: medium
    issue: Formulação do ato ritual
    rationale: “Para movê-los como oferta movida” é pouco idiomático e o pronome plural não está expresso no hebraico. “Para apresentá-los ritualmente como oferta movida” comunica a função de הניף/תנופה sem alegar uma descrição física precisa do rito.
  - severity: low
    issue: Formulação de אִשֵּׁי הַחֲלָבִים
    rationale: “Ofertas queimadas das porções de gordura” é uma formulação portuguesa mais direta para as ofertas feitas por fogo relativas às partes gordurosas.
  - severity: low
    issue: Concordância na nota b
    rationale: O núcleo “contribuição” é feminino; portanto, “traduzida”, não “traduzido”.
