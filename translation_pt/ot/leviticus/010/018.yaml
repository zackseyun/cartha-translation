  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: pt
  text: 'Vejam: o sangue dela não foi levado para dentro do santuário.[a] Vocês certamente deviam tê-la comido[b] no lugar santo, conforme ordenei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ao santuário, para dentro”. O hebraico combina o termo para a área sagrada com uma palavra que enfatiza seu interior.
    reason: lexical_alternative
  - marker: b
    text: A construção hebraica repete o verbo — literalmente, “comer, vocês comerão” — para intensificar a obrigação. No contexto, a repreensão se refere a uma ação que não foi realizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Chama enfaticamente a atenção dos ouvintes para o fato seguinte. “Vejam” é natural em português atual e preserva a força dêitica da partícula.
- source_word: הוּבָא
  choice: foi levado
  rationale: 'O hofal de בוא exprime ação passiva: o sangue não foi levado para o interior do espaço sagrado.'
- source_word: דָּמָהּ
  choice: o sangue dela
  rationale: O sufixo feminino singular retoma a oferta pelo pecado. A forma explícita evita a possível ambiguidade de “seu sangue” em português.
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: para dentro do santuário
  rationale: Expressa tanto o movimento em direção ao espaço sagrado quanto a ideia de interioridade indicada por פְּנִימָה, em formulação portuguesa clara e natural.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: certamente deviam tê-la comido
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. Como Moisés repreende uma omissão já ocorrida, “deviam tê-la comido” transmite a obrigação passada, e “certamente” preserva a ênfase.
- source_word: אֹתָהּ
  choice: tê-la
  rationale: O pronome objeto feminino singular retoma a oferta pelo pecado; a forma pronominal mantém essa referência sem repetição desnecessária.
- source_word: בַּקֹּדֶשׁ
  choice: no lugar santo
  rationale: Designa o espaço sagrado determinado para os sacerdotes comerem a oferta e mantém a terminologia cultual sem identificá-lo indevidamente com uma área mais específica.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: conforme ordenei
  rationale: Reproduz diretamente a oração comparativa que remete à instrução anterior de Moisés.
theological_decisions:
- issue: Terminologia espacial do culto
  choice: Distinguir “para dentro do santuário” do local de consumo, “no lugar santo”.
  alternative: Traduzir as duas expressões simplesmente como “no lugar santo” ou especificar a primeira como “além do véu”.
  rationale: As expressões hebraicas são relacionadas, mas não idênticas. A primeira inclui movimento para o interior e o termo פְּנִימָה; a segunda indica o espaço sagrado em que a oferta devia ser comida. A distinção preserva a lógica ritual sem acrescentar uma localização não declarada no versículo.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outras comunidades lusófonas. O plural “vocês” torna explícito que a repreensão se dirige a mais de um ouvinte; “Vejam” conserva a chamada enfática sem recorrer ao arcaizante “eis”. Os marcadores [a] e [b] aparecem no texto nos pontos correspondentes.
