  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: pt
  text: Não saiam da entrada da tenda do encontro, para que não morram, pois o óleo da unção de Yahweh está sobre vocês. E eles fizeram conforme a palavra de Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: da entrada
  rationale: פֶּתַח designa a entrada da tenda; em português, “da entrada” expressa naturalmente o ponto a partir do qual eles não deveriam sair.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Expressão cultual que designa o santuário onde Yahweh se encontrava com Israel; esta forma é clara, reconhecível e próxima do hebraico.
- source_word: לֹא תֵצְאוּ
  choice: Não saiam
  rationale: A construção negativa tem força proibitiva. O imperativo negativo é a forma mais natural e direta em português moderno.
- source_word: פֶּן תָּמֻתוּ
  choice: para que não morram
  rationale: פֶּן introduz o resultado temido ou a consequência advertida. A formulação preserva essa relação sem tornar a morte uma consequência mecanicamente explícita.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: o óleo da unção de Yahweh
  rationale: Mantém a cadeia nominal do hebraico e identifica o óleo sagrado associado à consagração determinada por Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲלֵיכֶם
  choice: está sobre vocês
  rationale: Reproduz a imagem concreta do óleo sobre os sacerdotes e, simultaneamente, seu estado de consagração.
- source_word: וַיַּעֲשׂוּ כִּדְבַר מֹשֶׁה
  choice: E eles fizeram conforme a palavra de Moisés
  rationale: Conserva a progressão narrativa e a ideia de que agiram em conformidade com a ordem verbal de Moisés.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido do óleo sobre os sacerdotes
  choice: Manter a expressão concreta “está sobre vocês”
  alternative: Explicitar como “vocês foram consagrados”
  rationale: A imagem do óleo sobre eles fundamenta a proibição e implica consagração, mas o texto não troca a imagem por uma explicação abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” explicita o número do hebraico sem recorrer a “vós”. A tradução mantém a solenidade da advertência e a formulação cultual do original.
