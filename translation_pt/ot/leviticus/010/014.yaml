  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: pt
  text: E você comerá, junto com seus filhos e suas filhas, em lugar puro, o peito da oferta movida[a] e a coxa da contribuição[b], pois foram dadas como sua porção e a porção de seus filhos, dentre os sacrifícios das ofertas de paz[c] dos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o peito da oferta de apresentação”. O termo hebraico se refere à porção ritualmente movida ou apresentada diante do SENHOR.
    reason: lexical_alternative
  - marker: b
    text: Ou “a coxa da oferta alçada”. O termo hebraico traduzido por “contribuição” designa literalmente algo erguido ou separado como porção devida aos sacerdotes.
    reason: lexical_alternative
  - marker: c
    text: “Ofertas de paz” também pode ser traduzido como “ofertas de comunhão”; o termo hebraico pode abranger paz, integridade ou bem-estar.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: o peito da oferta movida
  rationale: חֲזֶה designa a parte do peito do animal, e תְּנוּפָה, sua apresentação ritual por movimento diante do SENHOR. “Oferta movida” preserva a terminologia sacrificial e permite explicar a ação em nota.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: a coxa da contribuição
  rationale: שׁוֹק designa a coxa ou perna, enquanto תְּרוּמָה é algo separado ou apresentado como contribuição, aqui uma porção devida aos sacerdotes. A tradução mantém a distinção em relação à oferta movida.
- source_word: תֹּאכְלוּ
  choice: comerão
  rationale: O imperfeito tem força instrutiva no contexto legal. O futuro português comunica a determinação sem acrescentar uma ideia meramente permissiva.
- source_word: בְּמָקוֹם טָהוֹר
  choice: em lugar puro
  rationale: טָהוֹר indica pureza ritual no contexto levítico. “Lugar puro” é conciso e preserva o termo-chave sem inserir uma explicação no corpo do versículo.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: a porção destinada a você e a seus filhos
  rationale: חֹק pode indicar prescrição, direito ou porção atribuída. Aqui se refere à parte sacerdotal estabelecida; “porção destinada” expressa tanto a atribuição quanto seu caráter permanente.
- source_word: זִבְחֵי שַׁלְמֵי
  choice: sacrifícios das ofertas de paz
  rationale: שְׁלָמִים pertence ao campo semântico de paz, integridade e bem-estar. “Ofertas de paz” preserva essa amplitude melhor que a alternativa interpretativa “ofertas de comunhão”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: A expressão filial masculina plural é mantida formalmente, como no hebraico, embora funcione como designação coletiva do povo de Israel.
theological_decisions:
- issue: Sentido de שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão
  rationale: “Ofertas de paz” mantém o sentido amplo de paz, plenitude e bem-estar, enquanto “ofertas de comunhão” explicita apenas uma possível dimensão do sacrifício.
- issue: Designação coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A forma do original é preservada sem negar seu uso corporativo para o povo de Israel.
- issue: Participação das filhas na refeição sacerdotal
  choice: seus filhos e suas filhas com você
  alternative: sua família com você
  rationale: O hebraico menciona explicitamente filhos e filhas; a tradução conserva essa inclusão e também mantém “com você”.
translation_notes:
  register: Português moderno, digno e de leitura natural, com terminologia sacrificial relativamente formal. A ordem foi levemente ajustada para fluência, sem perder os participantes explicitamente mencionados nem as distinções entre תְּנוּפָה e תְּרוּמָה.
