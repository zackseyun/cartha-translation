  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: pt
  text: para distinguir entre o santo e o comum[a], e entre o impuro e o puro[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o santo e o profano”. O contraste hebraico é entre aquilo que foi separado como santo e aquilo que não é santo; aqui se usa “comum” para não sugerir irreverência deliberada.
    reason: lexical_alternative
  - marker: b
    text: Isto é, entre o ritualmente impuro e o ritualmente puro.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: para distinguir
  rationale: O infinitivo com לְ expressa propósito em continuação do versículo anterior. “Distinguir” comunica naturalmente a função de discernir entre categorias, sem a conotação espacial de “separar”.
- source_word: בֵּין
  choice: entre
  rationale: A preposição introduz os dois pares de categorias contrastantes; “entre” reproduz com precisão a construção hebraica repetida.
- source_word: הַקֹּדֶשׁ
  choice: o santo
  rationale: O substantivo designa aqui a categoria daquilo que foi separado como santo. A forma substantivada “o santo” preserva esse sentido sem especificar indevidamente pessoas ou objetos.
- source_word: הַחֹל
  choice: o comum
  rationale: Na linguagem sacerdotal, o termo indica aquilo que não pertence à esfera santa, não necessariamente algo irreverente ou perverso. “O comum” mantém esse contraste categorial.
- source_word: הַטָּמֵא
  choice: o impuro
  rationale: No contexto levítico, o termo designa sobretudo uma condição ritual. “Impuro” é claro em português e, junto da nota, evita identificá-lo automaticamente com culpa moral.
- source_word: הַטָּהוֹר
  choice: o puro
  rationale: “Puro” forma o par natural com “impuro” e expressa a categoria ritual correspondente no contexto sacerdotal.
theological_decisions:
- issue: Contraste sacerdotal entre חֹל e קֹדֶשׁ
  choice: o santo e o comum
  alternative: o santo e o profano
  rationale: O texto contrapõe o que foi consagrado ao que não é santo. “Comum” evita a possível ideia moderna de irreverência deliberada associada a “profano”, sem apagar a distinção cultual.
- issue: Natureza das categorias טָמֵא e טָהוֹר
  choice: o impuro e o puro, entendidos como categorias rituais
  alternative: o imundo e o limpo
  rationale: Em Levítico, esses termos indicam primariamente condições de pureza ritual, não uma avaliação moral automática. “Impuro” e “puro” preservam essa distinção com linguagem atual e digna.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura paralela do hebraico foi preservada, bem como o caráter categorial de “o santo”, “o comum”, “o impuro” e “o puro”.
