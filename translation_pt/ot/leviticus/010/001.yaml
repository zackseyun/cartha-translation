  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: pt
  text: Então Nadabe e Abiú, filhos de Arão, pegaram, cada um, o seu incensário, puseram fogo em seus incensários, colocaram incenso sobre cada um deles e apresentaram diante de Yahweh fogo não autorizado[a], que ele não lhes havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fogo estranho” ou “fogo alheio”. A expressão hebraica indica fogo que não havia sido autorizado por Yahweh, como explica a oração seguinte.
    reason: Registra traduções mais literais de אֵשׁ זָרָה e preserva sua amplitude lexical.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: pegaram
  rationale: O verbo לקח é um verbo narrativo comum; “pegaram” é natural e claro neste contexto.
- source_word: בְנֵי אַהֲרֹן
  choice: filhos de Arão
  rationale: Reproduz diretamente a relação familiar expressa pela construção hebraica.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadabe e Abiú
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis dos nomes próprios.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: cada um o seu incensário
  rationale: אִישׁ tem sentido distributivo, e מַחְתָּה designa o recipiente usado para brasas e incenso; “incensário” é a designação portuguesa corrente no contexto cultual.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: puseram fogo nele
  rationale: A formulação distributiva em português retoma no singular o incensário de cada um, embora o hebraico use aqui um pronome plural.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: colocaram incenso sobre o fogo
  rationale: Explicita o referente funcional de עָלֶיהָ de modo natural e evita a possível impressão de que o incenso foi posto sobre a parte externa do recipiente.
- source_word: וַיַּקְרִבוּ
  choice: apresentaram
  rationale: O hifil de קרב em contexto ritual significa trazer ou apresentar como oferta; “apresentaram” preserva esse valor cultual sem acrescentar interpretação.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Traduz a expressão cultual לִפְנֵי de modo direto e conserva o nome divino.
- source_word: אֵשׁ זָרָה
  choice: fogo não autorizado
  rationale: No contexto sacerdotal, זָרָה indica algo alheio ao que foi permitido ou prescrito; a cláusula seguinte esclarece que esse fogo não havia sido ordenado.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: que ele não lhes havia ordenado
  rationale: Mantém a oração relativa explicativa e representa explicitamente o objeto plural אֹתָם de maneira idiomática em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido de אֵשׁ זָרָה
  choice: fogo não autorizado
  alternative: fogo estranho; fogo alheio
  rationale: A escolha comunica a transgressão ritual indicada pela oração seguinte, sem especificar de que maneira concreta o fogo diferia do prescrito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sequência narrativa foi mantida, e a construção distributiva foi ajustada ao uso natural do português.
