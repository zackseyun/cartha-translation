base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: pt
  text: 'Moisés procurou cuidadosamente o bode da oferta pelo pecado[a], e eis que estava queimado[b]. Então ficou irado com Eleazar e Itamar, os filhos de Arão que restavam[c], e lhes disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Moisés procurou e procurou o bode da oferta pelo pecado”. O hebraico usa um infinitivo absoluto com um verbo finito para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estava totalmente queimado”. O hebraico descreve o bode no estado de queimado em que foi encontrado.'
    reason: lexical_alternative
  - marker: c
    text: “Os filhos de Arão que restavam” são Eleazar e Itamar, que ficaram depois da morte de Nadabe e Abiú (Lv 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: o bode da oferta pelo pecado
  rationale: שְׂעִיר designa um bode, e חַטָּאת, neste contexto ritual, designa a oferta pelo pecado. A formulação é natural e preserva a categoria sacrificial.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: procurou cuidadosamente
  rationale: A construção com infinitivo absoluto e verbo finito dá ênfase à ação. “Procurou cuidadosamente” comunica essa intensidade em português corrente sem reproduzir de modo artificial a repetição hebraica.
- source_word: וְהִנֵּה
  choice: e constatou que
  rationale: הִנֵּה chama a atenção para aquilo que Moisés descobriu. No contexto, “constatou que” transmite naturalmente a descoberta, embora a alternativa mais formal “e eis que” seja possível.
- source_word: שֹׂרָף
  choice: havia sido queimado
  rationale: O particípio passivo descreve o estado em que o bode foi encontrado. O mais-que-perfeito composto torna clara a anterioridade da queima sem afirmar no texto principal, além do necessário, que ele foi inteiramente consumido.
- source_word: וַיִּקְצֹף
  choice: ficou irado
  rationale: O verbo expressa ira. “Ficou irado” preserva a força e o tom digno do relato sem exagerá-la.
- source_word: הַנּוֹתָרִם
  choice: restantes
  rationale: O particípio identifica Eleazar e Itamar como os filhos que restaram depois da morte de Nadabe e Abiú. “Restantes” é conciso e evita tornar explícita no corpo do versículo uma referência apenas contextual.
- source_word: לֵאמֹר
  choice: 'e lhes disse:'
  rationale: O introdutor de discurso conduz à fala do versículo seguinte. Em português, “e lhes disse:” é mais natural que o decalque “dizendo”, e o pronome deixa claro quem são os destinatários.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução usa equivalência ótima: conserva os termos sacrificiais e a ênfase do hebraico, mas emprega sintaxe portuguesa natural. Os marcadores foram posicionados junto às expressões que explicam.'
