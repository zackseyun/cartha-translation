  naturalness: O português é claro e de registro apropriado. “Os filhos de Arão que restavam” é mais fluente e inequívoco do que “os filhos restantes de Arão”, sem alterar o referente.
  terminology: “Bode da oferta pelo pecado” preserva adequadamente o macho caprino e a categoria sacrificial. “Irado” é proporcional para וַיִּקְצֹף. A nota sobre a forma intensiva da busca torna explícita uma nuance importante do hebraico.
