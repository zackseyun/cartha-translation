  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּיטַ֖ב בְּ/עֵינָֽי/ו׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: pt
  text: Moisés ouviu, e isso lhe pareceu bom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e foi bom aos seus olhos”; isto é, ele considerou aceitável o que ouviu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O qal de שׁמע significa normalmente “ouvir”. No contexto, Moisés ouve a explicação de Arão; “ouviu” preserva a sequência narrativa sem explicitar além do hebraico que ele compreendeu ou concordou plenamente.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico מֹשֶׁה.
- source_word: וַיִּיטַב בְּעֵינָיו
  choice: isso lhe pareceu bom
  rationale: A expressão indica que o que Moisés ouviu foi considerado bom, aceitável ou satisfatório por ele. A formulação portuguesa transmite o valor avaliativo do idioma hebraico de maneira natural, enquanto a nota preserva sua imagem literal.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla. “Isso lhe pareceu bom” evita a construção pouco natural “foi bom aos seus olhos”, sem reduzir a resposta de Moisés à formulação mais explícita “ele aprovou”.
