id: LEV.4.31
reference: Leviticus 4:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: pt
  text: Ele retirará toda a gordura dela, assim como se retira a gordura do sacrifício de comunhão[a]. O sacerdote a queimará sobre o altar, como aroma agradável[b] ao SENHOR. O sacerdote fará expiação por essa pessoa, e ela será perdoada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifício de paz”.
    reason: lexical_alternative
  - marker: b
    text: “Aroma agradável” é uma fórmula sacrificial que indica uma oferta aceita pelo SENHOR.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: gordura / gordura dela
  rationale: O termo designa a gordura sacrificial retirada e queimada no altar. A tradução simples preserva o sentido lexical sem acrescentar “partes gordurosas”.
- source_word: יָסִיר
  choice: retirará
  rationale: O hifil de סור indica fazer retirar. O futuro em português comunica de modo natural a instrução legal e ritual.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: assim como se retira
  rationale: A formulação impessoal descreve o procedimento ritual estabelecido e reproduz adequadamente a comparação do hebraico.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifício de comunhão
  rationale: Expressão corrente e compreensível para a categoria sacrificial שְׁלָמִים; a alternativa tradicional “sacrifício de paz” é preservada em nota.
- source_word: וְהִקְטִיר
  choice: a queimará
  rationale: No contexto sacrificial, o verbo indica queimar a oferta sobre o altar. O pronome retoma a gordura.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Equivalente natural da forma direcional hebraica neste contexto ritual.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: Preserva a metáfora da fórmula sacrificial e expressa aceitação sem explicar além do texto.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Emprega a convenção portuguesa consagrada para o nome divino יהוה e mantém a relação direcional da expressão sacrificial.
- source_word: וְכִפֶּר עָלָיו
  choice: O sacerdote fará expiação por essa pessoa
  rationale: “Fará expiação” mantém a terminologia cultual; “por essa pessoa” evita o masculino genérico pouco claro sem alterar o referente.
- source_word: וְנִסְלַח לוֹ
  choice: e ela será perdoada
  rationale: Mantém a voz passiva do hebraico e apresenta de modo natural o perdão como resultado, sem explicitar um agente não nomeado.
theological_decisions:
- issue: Relação entre a expiação sacerdotal e o perdão
  choice: O sacerdote fará expiação por essa pessoa, e ela será perdoada.
  alternative: O sacerdote fará expiação em favor dela, e lhe será perdoado.
  rationale: A tradução conserva a sequência textual entre o rito de expiação e o perdão, sem introduzir uma explicação doutrinária do mecanismo nem identificar expressamente o agente do passivo.
- issue: Sentido da fórmula לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável ao SENHOR
  alternative: como aroma apaziguador ao SENHOR
  rationale: “Aroma agradável” preserva a imagem e a noção de aceitação, evitando sugerir que Deus precise ser acalmado ou que a expressão descreva literalmente uma reação física.
translation_notes:
  register: Português atual, digno e de leitura ampla, com períodos moderadamente curtos. O texto preserva a linguagem ritual de “expiação” e a metáfora do aroma, enquanto as notas registram a alternativa lexical de שְׁלָמִים e esclarecem a fórmula sacrificial. Todos os marcadores aparecem no texto nas expressões a que suas notas se referem.
