id: LEV.4.18
reference: Leviticus 4:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: pt
  text: Ele porá parte[a] do sangue sobre os chifres do altar que está diante de Yahweh e que fica na tenda do encontro; e derramará todo o sangue na base do altar do holocausto, que fica à entrada da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «do sangue ele porá». «Parte» explicita o sentido partitivo, em contraste com «todo o sangue» mais adiante no versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: Do sangue ele porá um pouco
  rationale: A construção hebraica é literalmente partitiva, «do sangue porá»; «um pouco» explicita em português que apenas parte do sangue é posta nos chifres, em contraste com «todo o sangue» na sequência.
- source_word: יִתֵּן
  choice: porá
  rationale: O verbo נתן tem o sentido comum de dar ou pôr. «Porá» mantém a formulação concreta do procedimento ritual sem introduzir o tecnicismo interpretativo «aplicará».
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: os chifres do altar
  rationale: «Chifres» preserva a designação literal e tradicional das saliências nos cantos do altar.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: que está diante de Yahweh
  rationale: A expressão לִפְנֵי comunica aqui primariamente posição espacial, sem perder a ideia de presença.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: «Tenda do encontro» é uma tradução transparente da designação hebraica do santuário; a oração relativa pode ser expressa naturalmente em português como locução adverbial.
- source_word: וְאֵת כָּל הַדָּם
  choice: e derramará todo o sangue
  rationale: Mantém o «todo» explícito do hebraico, embora no contexto se trate do sangue que resta após a aplicação anterior.
- source_word: יִשְׁפֹּךְ
  choice: derramará
  rationale: שפך significa derramar; a forma simples é natural em português e adequada ao procedimento ritual.
- source_word: אֶל יְסוֹד
  choice: na base
  rationale: Embora a preposição hebraica possa ser vertida por «para», «na base» expressa de modo idiomático o local onde o sangue é derramado.
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: «Holocausto» é o termo português estabelecido para a oferta inteiramente queimada, עֹלָה.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: que fica à entrada da tenda do encontro
  rationale: «Entrada» traduz naturalmente פֶּתַח, e «fica» torna fluida a descrição espacial em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal e a forma de transliteração adotada, sem substituí-lo por um título.
- issue: Sentido de «todo o sangue» depois de parte dele ser posta no altar
  choice: Preservar «todo o sangue»
  alternative: todo o restante do sangue
  rationale: O contexto implica o sangue restante, mas o hebraico diz literalmente «todo o sangue». A tradução preserva a expressão textual sem resolver silenciosamente essa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os termos cultuais «chifres do altar», «holocausto» e «tenda do encontro». A ordem inicial ligeiramente marcada, «Do sangue ele porá um pouco», conserva a estrutura partitiva e a ênfase do hebraico sem perder clareza.
