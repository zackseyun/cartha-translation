  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: pt
  text: Então o sacerdote pegará um pouco do sangue da cabra[a] com o seu dedo e o porá sobre os chifres do altar do holocausto[b]; e derramará todo o sangue dela à base do altar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do sangue dela”. Neste contexto, a expressão hebraica indica uma porção do sangue.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os chifres do altar do holocausto”, isto é, as projeções em forma de chifre nos cantos do altar.'
    reason: cultural_note
  - marker: c
    text: Embora o hebraico diga “todo o sangue dela”, a sequência indica o sangue restante, depois de uma porção ter sido aplicada com o dedo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: No contexto de instrução ritual, a forma verbal expressa o passo prescrito seguinte. O futuro em português comunica naturalmente essa força normativa, e “então” marca a sequência.
- source_word: מִדָּמָהּ
  choice: um pouco do sangue da cabra
  rationale: 'A preposição מִן tem sentido partitivo neste contexto: o sacerdote pega uma porção do sangue. O referente feminino é a cabra mencionada no versículo anterior; explicitá-lo evita a formulação pouco natural “seu sangue” sem alterar o referente.'
- source_word: בְּאֶצְבָּעוֹ
  choice: com o dedo
  rationale: O בְּ é instrumental e indica o meio pelo qual o sacerdote pega e aplica o sangue.
- source_word: וְנָתַן
  choice: e o porá
  rationale: נתן tem o sentido amplo de pôr ou colocar. “Porá” é claro, atual e preserva a formulação concreta sem interpretar excessivamente o gesto.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: sobre as pontas do altar do holocausto
  rationale: קֶרֶן significa literalmente “chifre”, mas aqui designa as projeções semelhantes a chifres nos cantos do altar. “Pontas” oferece boa inteligibilidade no texto principal, enquanto a nota preserva a imagem hebraica. עֹלָה é traduzido pelo termo cultual estabelecido “holocausto”.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: e ... todo o sangue dela
  rationale: Preserva o abrangente כָּל (“todo”), sem substituir no texto por “o restante”, embora a sequência ritual deixe claro que se trata do sangue que permanece depois da aplicação de uma porção.
- source_word: יִשְׁפֹּךְ
  choice: derramará
  rationale: שׁפך, em contexto sacrificial, significa derramar. O futuro mantém a instrução ritual.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: junto à base do altar
  rationale: יְסוֹד designa a base ou fundação. A preposição אֶל indica direção; “junto à base” comunica de modo natural o local para onde o sangue é derramado sem impor precisão espacial maior que a do hebraico.
theological_decisions:
- issue: Aspecto verbal na instrução ritual
  choice: 'Sequência traduzida como prescrição futura: “pegará ... porá ... derramará”'
  alternative: 'Narrativa no passado: “pegou ... pôs ... derramou”'
  rationale: O gênero legal e ritual exige leitura prescritiva. O futuro simples é uma forma natural e digna de expressar essa instrução em português.
- issue: Terminologia das projeções do altar
  choice: “pontas” no texto, com explicação literal “chifres” em nota
  alternative: “chifres” diretamente no texto principal
  rationale: A escolha mantém o referente cultual compreensível para leitores comuns, sem apagar a forma e a imagem específicas do hebraico, registradas na nota.
- issue: Relação entre “um pouco do sangue” e “todo o sangue”
  choice: Manter “todo o sangue” no texto e explicar na nota que se trata do sangue restante
  alternative: Traduzir interpretativamente “o restante do sangue”
  rationale: 'A formulação conserva a tensão lexical do original: primeiro uma porção é aplicada, depois כָּל דָּמָהּ é derramado. A nota esclarece a sequência sem substituir a expressão hebraica.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário cultual amplamente reconhecível. A sintaxe acompanha a sequência ritual sem rigidez excessiva. Os três marcadores de nota aparecem no texto principal.
