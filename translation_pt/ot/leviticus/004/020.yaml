reference: Leviticus 4:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָשָׂ֣ה לַ/פָּ֔ר כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/פַ֣ר הַֽ/חַטָּ֔את כֵּ֖ן יַעֲשֶׂה לּ֑/וֹ וְ/כִפֶּ֧ר עֲלֵ/הֶ֛ם הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: pt
  text: Ele fará com o novilho exatamente o que fez com o novilho da oferta pelo pecado[a]; assim fará com ele. O sacerdote fará expiação por eles, e eles serão perdoados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico pode designar a oferta que trata do pecado efetuando purificação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: Ele fará com o novilho
  rationale: O verbo עשה, com ל neste contexto ritual, descreve o procedimento realizado com o animal; a formulação é natural em português e mantém o caráter prescritivo.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: exatamente o que fez
  rationale: A expressão introduz uma comparação explícita com o rito anterior; “exatamente” comunica a correspondência indicada pelo hebraico.
- source_word: לְפַר הַחַטָּאת
  choice: com o novilho da oferta pelo pecado
  rationale: Identifica o novilho do rito anteriormente descrito. “Oferta pelo pecado” é a designação tradicional e amplamente compreensível, sem eliminar a alternativa lexical indicada em nota.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: assim fará com ele
  rationale: כֵּן assinala a mesma maneira de proceder, e o pronome retoma o novilho.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: O sacerdote fará expiação por eles
  rationale: כפר é um termo ritual central em Levítico; “fará expiação” preserva seu peso cultual, enquanto עֲלֵהֶם indica os beneficiários da ação sacerdotal.
- source_word: וְנִסְלַח לָהֶם
  choice: e eles serão perdoados
  rationale: O nifal de סלח expressa o resultado passivo do perdão concedido ao povo; a construção pessoal é clara e fiel em português.
theological_decisions:
- issue: Sentido de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode designar a oferta que trata do pecado e também enfatizar a purificação produzida pelo rito. A tradução principal conserva a designação reconhecível, enquanto a nota preserva a alternativa lexical legítima sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e solene, com terminologia ritual consistente. O marcador foi colocado imediatamente após “oferta pelo pecado”, expressão à qual a nota lexical se refere.
