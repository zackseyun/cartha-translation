id: LEV.4.13
reference: Leviticus 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: pt
  text: Se toda a comunidade de Israel pecar sem intenção[a], e o fato passar despercebido aos olhos da assembleia[b], e ela fizer alguma das coisas que Yahweh ordenou que não fossem feitas, tornando-se assim culpada,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cometer um erro”. O verbo hebraico indica aqui um pecado cometido por engano ou inadvertência, não uma afronta deliberada.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica diz literalmente que o fato “ficou oculto aos olhos da assembleia”, isto é, escapou à percepção da comunidade.
    reason: cultural_note
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: comunidade de Israel
  rationale: עֵדָה designa a comunidade ou congregação reunida. “Comunidade” é natural em português e permite distinguir o termo de הַקָּהָל, traduzido depois por “assembleia”.
- source_word: יִשְׁגּוּ
  choice: pecar sem intenção
  rationale: No contexto sacrificial de Levítico 4, שׁגה indica pecado cometido por engano ou inadvertência, não rebelião deliberada.
- source_word: וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל
  choice: o fato passar despercebido aos olhos da assembleia
  rationale: A formulação conserva a imagem hebraica dos “olhos” e comunica naturalmente que a infração não foi percebida pela assembleia.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: eles fizerem alguma das coisas que Yahweh ordenou que não fossem feitas
  rationale: A tradução expressa uma ação dentre a totalidade das proibições divinas, evitando a formulação portuguesa pouco natural “uma de todos os mandamentos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: וְאָשֵׁמוּ
  choice: tornando-se assim culpados
  rationale: O verbo indica a condição de culpa ou responsabilidade resultante da infração; “assim” explicita apenas a relação consequencial já presente na sequência hebraica.
theological_decisions:
- issue: Natureza do pecado descrito por שׁגה
  choice: pecar sem intenção
  alternative: errar; desviar-se
  rationale: Em Levítico 4, o verbo pertence à categoria legal de infrações inadvertidas. A tradução não estende a provisão a uma afronta deliberada.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal no texto sem substituí-lo por um título.
- issue: Culpa decorrente de uma infração inicialmente desconhecida
  choice: tornando-se assim culpados
  alternative: e forem culpados; e incorrerem em culpa
  rationale: 'A redação mantém a tensão do texto: a falta de intenção e de percepção não elimina a culpa resultante.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Comunidade” e “assembleia” preservam a distinção entre עֵדָה e קָהָל. A frase permanece aberta porque o período condicional continua nos versículos seguintes.
