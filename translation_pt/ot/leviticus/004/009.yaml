base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: pt
  text: e os dois rins, a gordura que está sobre eles, que está sobre os lombos, e o apêndice sobre o fígado[a]; ele o retirará junto com os rins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lóbulo do fígado”. O termo hebraico para essa estrutura anatômica é incerto; “apêndice” é uma tradução cautelosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: os dois rins
  rationale: Referência anatômica direta; preserva a especificidade numérica do hebraico em português natural.
- source_word: הַחֵלֶב
  choice: a gordura
  rationale: No contexto sacrificial levítico, designa as porções gordurosas reservadas para a oferta; “gordura” é claro e acessível.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: que está sobre eles
  rationale: A oração relativa modifica “a gordura” e retoma “os rins”, mantendo de perto a relação espacial do hebraico.
- source_word: הַכְּסָלִים
  choice: os lombos
  rationale: O termo indica a região dos lombos ou flancos; “lombos” conserva o sentido anatômico tradicional sem excessiva tecnicidade.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: o apêndice sobre o fígado
  rationale: O referente anatômico exato de יֹתֶרֶת é incerto. “Apêndice” evita identificar com precisão indevida uma estrutura que também pode ser entendida como lóbulo.
- source_word: עַל הַכְּלָיוֹת
  choice: junto com os rins
  rationale: Nesta fórmula ritual, a expressão indica que o apêndice é retirado em associação com os rins; a tradução comunica naturalmente esse agrupamento.
- source_word: יְסִירֶנָּה
  choice: ele o retirará
  rationale: O hifil de סור indica remoção. Em português, o pronome retoma naturalmente “o apêndice”, o elemento singular mais próximo, sem apagar a sequência das demais partes a retirar.
