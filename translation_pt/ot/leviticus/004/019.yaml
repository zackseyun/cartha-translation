  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יָרִ֣ים מִמֶּ֑/נּוּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/019.yaml
  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: pt
  text: Ele retirará do animal toda a gordura e a queimará sobre o altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “e a fará subir em fumaça sobre o altar”. O verbo hebraico designa especificamente a queima de uma oferta em contexto sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Ele
  rationale: A conjunção dá continuidade à sequência ritual; em português, a ligação é expressa naturalmente pela sequência verbal, enquanto o pronome explicita o sacerdote como sujeito, conforme o contexto imediato. O marcador de objeto direto não tem tradução independente.
- source_word: כָּל
  choice: toda
  rationale: Expressa a totalidade da gordura designada, não apenas uma parte.
- source_word: חֶלְבּוֹ
  choice: a gordura
  rationale: No contexto sacrificial de Levítico, חֵלֶב designa as porções gordurosas reservadas para serem queimadas no altar.
- source_word: יָרִים
  choice: retirará
  rationale: O hifil de רום pode significar levantar ou remover; aqui descreve a retirada ritual da gordura do animal.
- source_word: מִמֶּנּוּ
  choice: do animal
  rationale: A preposição indica separação. Explicitar o referente evita a repetição pouco natural e potencialmente ambígua de 'dela' em português.
- source_word: וְהִקְטִיר
  choice: e a queimará
  rationale: No vocabulário sacerdotal, הקטיר indica fazer a oferta subir em fumaça. 'Queimará' é natural e claro no texto, enquanto a nota preserva a nuance sacrificial específica.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Embora a terminação direcional possa sugerir movimento em direção ao altar, com הקטיר a expressão indica o local onde a gordura é queimada; 'sobre o altar' é idiomático e preciso.
