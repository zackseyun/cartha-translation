  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַ֤ט אֹתָ/הּ֙ לְ/חַטָּ֔את בִּ/מְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: pt
  text: Porá a mão sobre a cabeça da oferta pelo pecado e a abaterá como oferta pelo pecado, no lugar onde se abate o holocausto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação” nas duas ocorrências de “oferta pelo pecado”; o termo hebraico pode designar a oferta que trata do pecado e da impureza ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Porá
  rationale: No contexto sacrificial, סמך descreve pôr ou apoiar a mão sobre o animal. “Porá” é natural e mantém a ação ritual sem definir seu simbolismo.
- source_word: יָדוֹ
  choice: a mão
  rationale: O hebraico traz o substantivo no singular com sufixo masculino singular; o português naturalmente recupera o possuidor pelo sujeito implícito.
- source_word: עַל רֹאשׁ
  choice: sobre a cabeça
  rationale: Tradução direta e idiomática da locução hebraica.
- source_word: הַחַטָּאת / לְחַטָּאת
  choice: oferta pelo pecado / como oferta pelo pecado
  rationale: חטאת designa aqui o sacrifício relacionado ao pecado e à purificação. A formulação tradicional e inteligível “oferta pelo pecado” fica no texto, enquanto a alternativa relevante é registrada em nota.
- source_word: וְשָׁחַט
  choice: e a matará
  rationale: שׁחט é o verbo técnico para abater um animal sacrificial. “Matará” é claro e corrente em português; o contexto sacrificial fornece a especificidade ritual.
- source_word: אֹתָהּ
  choice: a
  rationale: O pronome feminino retoma a oferta, cujo referente concreto é o animal sacrificial.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: no lugar onde se mata
  rationale: A construção impessoal com “se” expressa com naturalidade a prática ritual habitual indicada pelo imperfeito hebraico de terceira pessoa masculina singular.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo bíblico português estabelecido para עֹלָה, a oferta inteiramente queimada.
theological_decisions:
- issue: Sentido de חטאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode salientar tanto o pecado quanto a purificação ritual. O texto principal usa a designação mais reconhecível em português, sem excluir a nuance alternativa, preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com redação legal-procedimental natural. Mantém a mão no singular e evita acrescentar uma interpretação simbólica ao gesto.
