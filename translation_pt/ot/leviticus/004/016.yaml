id: LEV.4.16
reference: Leviticus 4:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵבִ֛יא הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר אֶל אֹ֖הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: pt
  text: Então o sacerdote ungido levará um pouco do sangue do novilho para dentro da tenda do encontro[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente, “do sangue do novilho”. Em hebraico, a expressão provavelmente tem sentido partitivo: apenas uma parte do sangue é levada para dentro.'
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “tabernáculo”, em vez de “tenda do encontro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: Então ... levará
  rationale: O perfeito hifil com a conjunção dá continuidade à sequência ritual. “Então ... levará” comunica com naturalidade a progressão da instrução legal.
- source_word: הַ/כֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente de כֹּהֵן neste contexto cultual.
- source_word: הַ/מָּשִׁיחַ
  choice: ungido
  rationale: O termo descreve o sacerdote investido no ofício por meio da unção; aqui não funciona como o título “Messias”.
- source_word: מִ/דַּם
  choice: um pouco do sangue
  rationale: 'A preposição מִן tem provavelmente sentido partitivo: apenas parte do sangue é levada para o interior. A formulação escolhida é clara e idiomática em português.'
- source_word: הַ/פָּר
  choice: do novilho
  rationale: פַּר designa o bovino macho usado no sacrifício. “Novilho” é a designação bíblica e ritual corrente em português, sem exigir uma precisão etária além do contexto.
- source_word: אֶל
  choice: para dentro de
  rationale: Embora אֶל possa significar simplesmente “para”, o movimento ritual tem como destino o interior do santuário; “para dentro de” torna explícita essa direção contextual.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução transparente da designação hebraica do santuário, mais diretamente ligada à expressão original do que o termo tradicional “tabernáculo”.
theological_decisions:
- issue: Sentido de הַמָּשִׁיחַ no contexto sacerdotal
  choice: ungido
  alternative: consagrado; Messias
  rationale: Neste contexto, a palavra identifica o sacerdote que recebeu a unção para o ofício. “Consagrado” seria mais interpretativo, enquanto “Messias” sugeriria indevidamente um título cristológico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Mantém linguagem ritual clara sem arcaísmos desnecessários; as notas preservam a forma mais literal e a terminologia tradicional.
