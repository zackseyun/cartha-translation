source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: pt
  text: Quando um líder[a] pecar e fizer involuntariamente[b] alguma das coisas que Yahweh, seu Deus, ordenou que não fossem feitas, e se tornar culpado,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe”, “governante” ou “príncipe”; o hebraico נָשִׂיא designa um líder ou chefe reconhecido.
    reason: lexical_alternative
  - marker: b
    text: Ou “por engano” ou “sem intenção”; o hebraico se refere a uma transgressão não intencional.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: líder
  rationale: O termo designa um chefe ou dirigente reconhecido, sem implicar necessariamente um príncipe de linhagem real. “Líder” é claro e adequado ao contexto da legislação sacrificial.
- source_word: יֶחֱטָא
  choice: pecar
  rationale: O verbo חטא é o termo comum para cometer pecado; o verbo português preserva a formulação direta do hebraico.
- source_word: וְעָשָׂה אַחַת מִכָּל
  choice: fazendo ... alguma das coisas
  rationale: A expressão indica a prática de um ato dentre o conjunto das proibições. A formulação portuguesa mantém o sentido partitivo sem reproduzir de modo rígido a sintaxe hebraica.
- source_word: מִצְוֺת יְהוָה אֱלֹהָיו אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: alguma das coisas que Yahweh, seu Deus, ordenou que não fossem feitas
  rationale: A tradução explicita de maneira natural que se trata de atos proibidos pelos mandamentos, preservando tanto o nome divino quanto o pronome “seu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Preserva o sufixo pronominal e a relação expressa no texto entre o líder e Deus.
- source_word: בִּשְׁגָגָה
  choice: involuntariamente
  rationale: No contexto levítico, o termo caracteriza uma transgressão não intencional, cometida por engano ou inadvertência.
- source_word: וְאָשֵׁם
  choice: e se tornar culpado
  rationale: A forma verbal descreve o estado de culpa resultante da transgressão. “Se tornar culpado” conserva essa nuance consequencial sem acrescentar uma explicação doutrinária.
theological_decisions:
- issue: Forma de representar o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Relação entre transgressão involuntária e culpa
  choice: “involuntariamente” e “se tornar culpado” são mantidos lado a lado
  alternative: Atenuar a culpa por se tratar de um ato não intencional
  rationale: O versículo afirma simultaneamente a falta de intenção e a culpa resultante. A tradução conserva essa tensão teológica sem resolvê-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A oração permanece aberta ao versículo seguinte, como no contexto hebraico. Os marcadores foram colocados junto aos termos que efetivamente explicam.
