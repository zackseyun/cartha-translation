base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: pt
  text: Levará o novilho inteiro para fora do acampamento, a um lugar limpo[a], ao depósito de cinzas[b], e o queimará sobre lenha, no fogo. No depósito de cinzas ele será queimado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente, “um lugar cerimonialmente puro”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “lugar onde se despejam as cinzas”; isto é, o local destinado ao depósito das cinzas do altar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Levará para fora
  rationale: O hifil de יצא expressa a ação causativa de fazer sair, isto é, levar para fora; a construção portuguesa também preserva a direção indicada pelo hebraico.
- source_word: כָּל הַפָּר
  choice: o novilho inteiro
  rationale: כָּל com o substantivo definido ressalta a totalidade do animal. “Novilho inteiro” é natural e preciso neste contexto sacrificial.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: A expressão indica um destino além dos limites do acampamento.
- source_word: מָקוֹם טָהוֹר
  choice: um lugar limpo
  rationale: טָהוֹר pode indicar pureza ritual no contexto levítico. “Limpo” mantém uma formulação clara sem explicitar no texto principal mais do que o hebraico diz; a nota registra a nuance cerimonial.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: depósito de cinzas
  rationale: A expressão designa o local onde as cinzas eram despejadas. “Depósito de cinzas” comunica de modo natural um lugar determinado para esse descarte, sem sugerir apenas um monte casual.
- source_word: וְשָׂרַף אֹתוֹ
  choice: e o queimará
  rationale: שׂרף é o verbo comum para queimar; o futuro mantém o estilo prescritivo da instrução legal.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: sobre lenha, no fogo
  rationale: A tradução preserva tanto o combustível ou suporte, “sobre lenha”, quanto a expressão בָּאֵשׁ, “no fogo”, sem fundi-los numa única ideia.
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: No depósito de cinzas ele será queimado
  rationale: A frase final repete e enfatiza o lugar determinado. “No” é a forma locativa mais natural em português, e a voz passiva reflete o hebraico.
theological_decisions:
- issue: Nuance ritual de טָהוֹר
  choice: um lugar limpo
  alternative: um lugar cerimonialmente puro
  rationale: O contexto sacrificial torna provável uma referência à pureza ritual, mas o adjetivo hebraico não inclui por si só uma explicação. A formulação concisa permanece no texto, e a nota esclarece a nuance possível.
- issue: Natureza do local שֶׁפֶךְ הַדֶּשֶׁן
  choice: depósito de cinzas
  alternative: lugar onde se despejam as cinzas
  rationale: Trata-se de um local estabelecido para depositar as cinzas do altar. A escolha evita tanto uma paráfrase longa quanto a ideia imprecisa de um mero monte de cinzas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “depósito de cinzas” foi mantida por corresponder à ênfase jurídica e ritual do hebraico. A pontuação separa a repetição final sem enfraquecê-la.
