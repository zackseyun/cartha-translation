id: LEV.4.35
reference: Leviticus 4:35
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: pt
  text: Retirará toda a gordura dela, assim como se retira a gordura do cordeiro do sacrifício das ofertas de paz. O sacerdote queimará essas porções sobre o altar, sobre as ofertas feitas pelo fogo a Yahweh.[a] Assim, o sacerdote fará expiação por ele quanto ao pecado que cometeu, e ele será perdoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre as ofertas de alimento de Yahweh”. A expressão hebraica é um termo técnico sacrificial, tradicionalmente associado a ofertas feitas pelo fogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: gordura
  rationale: Designa a gordura do animal reservada para remoção e oferta no rito; “gordura” preserva o sentido lexical simples.
- source_word: יָסִיר / יוּסַר
  choice: retirará / se retira
  rationale: O Hifil de סור descreve a retirada ritual da gordura; a formulação é natural em português e mantém a relação ativa/passiva do hebraico.
- source_word: הַכֶּשֶׂב
  choice: cordeiro
  rationale: No contexto sacrificial, o termo se refere adequadamente ao cordeiro, opção mais específica do que “ovelha”.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifício das ofertas de paz
  rationale: Preserva זֶבַח como “sacrifício” e o nome tradicional da categoria ritual שְׁלָמִים sem substituir sua amplitude por uma interpretação única.
- source_word: וְהִקְטִיר
  choice: queimará
  rationale: No uso sacrificial, o verbo indica queimar no altar, produzindo fumaça; “queimará” é claro e idiomático.
- source_word: אֹתָם
  choice: essas porções
  rationale: O pronome hebraico é masculino plural e aponta para os diversos pedaços de gordura. “Essas porções” explicita o referente plural sem alterar o procedimento.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Embora a terminação direcional possa indicar movimento em direção ao altar, a ação sacrificial em português é naturalmente descrita como ocorrendo “sobre o altar”.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: sobre as ofertas feitas pelo fogo a Yahweh
  rationale: אִשֵּׁי é uma expressão sacrificial técnica. A tradução mantém a associação tradicional com o fogo e preserva עַל como “sobre”; a possível nuance de oferta de alimento é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְכִפֶּר עָלָיו
  choice: fará expiação por ele
  rationale: Mantém a linguagem ritual e teológica abrangente de כפר sem impor uma teoria específica da expiação.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: quanto ao pecado que cometeu
  rationale: Expressa de forma idiomática a relação entre a expiação e a transgressão, evitando a repetição pouco natural “pecado que pecou”.
- source_word: וְנִסְלַח לוֹ
  choice: e ele será perdoado
  rationale: Comunica com clareza o resultado passivo do rito expresso pelo Nifal de סלח.
theological_decisions:
- issue: Linguagem da expiação sacrificial
  choice: fará expiação por ele
  alternative: fará propiciação por ele / fará purificação por ele
  rationale: “Fará expiação” conserva a amplitude cultual de כפר e não resolve no texto uma questão teológica que o versículo não especifica.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto hebraico apresenta o nome próprio divino; “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Efeito do rito e perdão
  choice: e ele será perdoado
  alternative: e isso lhe será perdoado
  rationale: A formulação mantém o perdão como resultado declarado do procedimento, sem acrescentar condições ou uma explicação sistemática ausentes do versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantiveram-se os termos cultuais estabelecidos “ofertas de paz” e “expiação”. O sujeito implícito na abertura acompanha naturalmente o contexto anterior. “Essas porções” torna inteligível o pronome plural hebraico sem fazer a gordura parecer gramaticalmente plural em português.
