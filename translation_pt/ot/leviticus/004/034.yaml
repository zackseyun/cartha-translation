id: LEV.4.34
reference: Leviticus 4:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: pt
  text: Então o sacerdote pegará um pouco do sangue da oferta pelo pecado[a] com o dedo e o colocará sobre os chifres do altar do holocausto; derramará todo o sangue dela na base do altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico pode designar o sacrifício oferecido em relação ao pecado e à purificação ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw com o qatal dá continuidade à sequência ritual; “Então” e o futuro em português exprimem naturalmente a instrução procedimental.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução direta do substantivo definido que designa o oficiante.
- source_word: מִדַּם
  choice: um pouco do sangue
  rationale: 'A preposição מִן tem sentido partitivo no contexto: apenas uma porção do sangue é aplicada com o dedo.'
- source_word: הַחַטָּאת
  choice: oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta relacionada ao pecado e à purificação; esta forma é tradicional, clara e não reduz o termo ao pecado abstrato.
- source_word: בְּאֶצְבָּעוֹ
  choice: com o dedo
  rationale: O bet indica o instrumento empregado pelo sacerdote.
- source_word: וְנָתַן
  choice: e o colocará
  rationale: נתן significa aqui pôr ou aplicar; o pronome retoma naturalmente o sangue.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: sobre as pontas do altar do holocausto
  rationale: “Pontas” comunica em português atual as projeções do altar chamadas literalmente de “chifres”, enquanto “altar do holocausto” identifica o altar segundo seu uso cultual.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: e ... todo o sangue dela
  rationale: Preserva a totalidade expressa por כָּל e o referente feminino da oferta, sem explicitar “o restante”, embora isso esteja implícito na sequência.
- source_word: יִשְׁפֹּךְ
  choice: derramará
  rationale: Expressa o ato ritual deliberado de verter o sangue.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: junto à base do altar
  rationale: יְסוֹד denota a base ou fundação; “junto à base” é claro e adequado ao movimento indicado por אֶל.
theological_decisions:
- issue: Tradução de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O contexto exige o sentido de uma oferta sacrificial, mas o termo pode destacar tanto sua relação com o pecado quanto sua função purificadora. A leitura principal emprega a formulação mais reconhecível, e a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a sequência ritual do hebraico. “Pontas” foi preferido a “chifres” para clareza comum, sem perder a referência às projeções do altar.
