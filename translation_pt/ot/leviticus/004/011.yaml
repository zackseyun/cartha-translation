  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: pt
  text: Mas o couro[a] do touro[b], toda a sua carne, com a cabeça, as pernas, as vísceras[c] e o esterco—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “novilho”.
    reason: lexical_alternative
  - marker: c
    text: Ou “partes internas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: couro
  rationale: No contexto de um animal abatido, “couro” expressa de modo natural e específico a pele retirada, sem perder o sentido concreto do hebraico.
- source_word: הַפָּר
  choice: o touro
  rationale: פַּר designa um touro ou novilho; “touro” é claro e suficiente no contexto, enquanto a possível nuance etária é registrada em nota.
- source_word: כָּל בְּשָׂרוֹ
  choice: toda a sua carne
  rationale: Mantém a concretude anatômica e sacrificial de בָּשָׂר; “corpo” seria mais amplo e menos literal.
- source_word: עַל רֹאשׁוֹ
  choice: com a cabeça
  rationale: Nesta enumeração, עַל tem valor inclusivo; “com” comunica isso naturalmente em português, sem sugerir que a carne esteja fisicamente sobre a cabeça.
- source_word: וְעַל כְּרָעָיו
  choice: as pernas
  rationale: כְּרָעַיִם refere-se às pernas ou canelas do animal; “as pernas” é a expressão moderna mais clara dentro da lista.
- source_word: וְקִרְבּוֹ
  choice: as vísceras
  rationale: No contexto da anatomia sacrificial, קֶרֶב indica as partes internas; “vísceras” oferece um equivalente concreto e compreensível.
- source_word: וּפִרְשׁוֹ
  choice: o esterco
  rationale: פֶּרֶשׁ refere-se especificamente ao excremento ou conteúdo fecal, distinto das vísceras; “esterco” é direto e adequado ao contexto animal.
