id: LEV.4.6
reference: Leviticus 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: pt
  text: O sacerdote mergulhará o dedo no sangue e aspergirá um pouco do sangue sete vezes diante de Yahweh, em frente à cortina do santuário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante da cortina do Lugar Santo”.'
    reason: Alternativa lexical e sintática para a orientação espacial da aspersão e para הַקֹּדֶשׁ.
lexical_decisions:
- source_word: וְטָבַל
  choice: molhará
  rationale: O waw com qatal dá continuidade à sequência de instruções rituais. “Molhar o dedo no sangue” é natural em português e expressa o sentido de טבל neste contexto.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Substantivo definido singular que designa o sacerdote oficiante.
- source_word: אֶצְבָּעוֹ
  choice: o dedo
  rationale: O substantivo singular com sufixo de terceira pessoa masculina é retomado naturalmente em português com o artigo definido, pois o possuidor já é o sujeito da oração.
- source_word: בַּדָּם
  choice: no sangue
  rationale: A preposição בְּ indica a substância na qual o dedo é molhado.
- source_word: וְהִזָּה
  choice: aspergirá
  rationale: No contexto sacerdotal, o hifil de נזה descreve a aspersão ritual; “aspergir” é preciso e corrente em linguagem bíblica digna.
- source_word: מִן־הַדָּם
  choice: um pouco do sangue
  rationale: 'מִן tem sentido partitivo: somente parte do sangue é aspergida.'
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Reprodução direta da expressão numérica adverbial.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica posição ou orientação cultual na presença de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: em frente à cortina do santuário
  rationale: A construção com פְּנֵי indica a parte frontal ou a orientação para o objeto. פָּרֹכֶת é a cortina interior, e הַקֹּדֶשׁ identifica o espaço sagrado a ela associado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem o substituir por um título.
- issue: Relação sintática entre לִפְנֵי יְהוָה e אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: diante de Yahweh, em frente à cortina do santuário
  alternative: diante da cortina do Lugar Santo
  rationale: 'A tradução principal conserva ambas as expressões do hebraico: a ação ocorre diante de Yahweh e orientada para a frente da cortina. A formulação alternativa é registrada em nota por refletir uma possível compreensão da orientação espacial.'
- issue: Sentido de פָּרֹכֶת הַקֹּדֶשׁ
  choice: cortina do santuário
  alternative: cortina do Lugar Santo; véu do santuário
  rationale: “Cortina” é acessível e descreve o objeto cultual, enquanto “santuário” preserva a referência ao espaço sagrado sem impor uma distinção arquitetônica excessivamente específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro do presente mantém o tom prescritivo da instrução ritual. “Aspergirá” preserva a precisão cultual sem tornar a frase obscura.
