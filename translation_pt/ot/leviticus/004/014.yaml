    issue: Construção verbal incompleta em «o pecado que cometeram se tornar conhecido».
    rationale: Após o sujeito, «se tornar» no infinitivo não forma uma oração finita. O hebraico introduz a situação em que o pecado vem a ser conhecido; «quando se tornar conhecido o pecado» exprime isso com gramática e fluência portuguesas.
  - severity: low
    issue: «Um novilho, um animal da manada» soa redundante e pouco idiomático.
    rationale: A segunda aposição não acrescenta uma distinção clara e torna a frase pesada. «Um novilho do rebanho» conserva a identificação do animal como bovino do gado.
