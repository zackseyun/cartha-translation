review_pass:
  verdict: revise
  source_fidelity: A distinção entre a primeira ocorrência de חַטָּאת, «pecado», e a segunda, «oferta pelo pecado», é correta. «Assembleia», «apresentará» e «diante da tenda do encontro» reproduzem adequadamente os termos e a progressão cultual do hebraico. «Novilho do rebanho» expressa naturalmente פַּר בֶּן־בָּקָר sem a aposição pouco idiomática do rascunho.
  naturalness: A construção «o pecado ... se tornar conhecido» é gramaticalmente inadequada neste contexto. A oração temporal «quando se tornar conhecido o pecado» é natural em português e reproduz o valor condicional-temporal da forma hebraica. A redação «um novilho, um animal da manada» é redundante e artificial; «um novilho do rebanho» é mais fluida.
  terminology: «Oferta pelo pecado» é uma designação estabelecida e clara para o segundo uso de חַטָּאת. «Tenda do encontro» mantém a terminologia cultual de modo direto. A nota lexical está correta e permanece adequadamente ancorada.
