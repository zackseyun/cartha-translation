  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: pt
  text: E, quando se tornar conhecido[a] o pecado que cometeram, a assembleia apresentará um novilho do rebanho como oferta pelo pecado e o levará diante da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A mesma palavra hebraica, חַטָּאת (ḥaṭṭā’t), aparece duas vezes neste versículo: primeiro com o sentido de “pecado” e depois com o sentido de “oferta pelo pecado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: se tornar conhecido
  rationale: O nifal de ידע exprime aqui que o pecado passa a ser conhecido, sem especificar quem o descobre ou o torna conhecido.
- source_word: הַחַטָּאת
  choice: o pecado
  rationale: A oração relativa seguinte, “que cometeram”, exige aqui o sentido de pecado, e não o de oferta sacrificial.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: que cometeram
  rationale: Em português corrente, “cometer um pecado” transmite naturalmente a construção hebraica sem reproduzir de modo artificial a preposição על.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: “Assembleia” preserva o caráter coletivo e jurídico-cultual de קהל sem associações eclesiásticas desnecessárias.
- source_word: וְהִקְרִיבוּ
  choice: apresentará
  rationale: No contexto sacrificial, o hifil de קרב indica apresentar ou fazer chegar a oferta. “Apresentará” também mantém a distinção em relação ao verbo seguinte, “levará”.
- source_word: פַּר בֶּן בָּקָר
  choice: um novilho, um animal da manada
  rationale: “Novilho” identifica naturalmente o bovino macho, enquanto a expressão explicativa “um animal da manada” procura representar בֶּן בָּקָר sem o literalismo pouco natural “filho do gado”.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: Nesta segunda ocorrência, חטאת designa claramente a categoria sacrificial destinada ao tratamento ritual do pecado.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: e o levará
  rationale: O verbo hifil de בוא significa levar ou trazer; o pronome retoma o novilho, e o sujeito coletivo singular “assembleia” pede concordância no singular em português.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: diante da tenda do encontro
  rationale: Tradução direta e inteligível da expressão cultual, sem substituir “tenda” pelo termo tradicional mais interpretativo “tabernáculo”.
theological_decisions:
- issue: Os dois sentidos de חטאת no mesmo versículo
  choice: Traduzir a primeira ocorrência como “pecado” e a segunda como “oferta pelo pecado”.
  alternative: Uniformizar ambas como “pecado” ou “oferta pelo pecado”, ou usar “oferta de purificação” na segunda ocorrência.
  rationale: 'O contexto atribui sentidos distintos ao mesmo substantivo: primeiro, o ato cometido e posteriormente conhecido; depois, o sacrifício prescrito. A distinção preserva a polissemia hebraica sem impor uma interpretação denominacional. A nota registra que se trata da mesma palavra hebraica.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se “tenda do encontro” como expressão cultual transparente. A sintaxe inicia com “e” porque o versículo continua a condição começada no contexto anterior.
