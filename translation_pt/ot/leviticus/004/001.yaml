base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também representado em português como “Javé” ou “Jeová”.'
    reason: Registra a forma hebraica do nome divino e transliterações alternativas correntes.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O waw consecutivo introduz uma nova unidade de discurso, e דִּבֵּר descreve o ato de falar. A formulação preserva a ligação narrativa e a fórmula recorrente da fala divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino YHWH, não um título. “Yahweh” o representa por transliteração, enquanto a nota registra formas alternativas conhecidas em português.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica o destinatário da fala; “a Moisés” é uma formulação natural e fiel em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz o conteúdo da fala. “Dizendo” conserva de modo claro e conciso a fórmula hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; Jeová; SENHOR
  rationale: O hebraico emprega explicitamente o Tetragrama. A transliteração preserva o caráter de nome próprio sem substituí-lo por um título; a nota reconhece as principais formas alternativas em português.
translation_notes:
  register: Português moderno, claro e digno, com a cadência tradicional da fórmula de introdução do discurso. Mantém-se “dizendo” porque a fala propriamente dita vem nos versículos seguintes.
