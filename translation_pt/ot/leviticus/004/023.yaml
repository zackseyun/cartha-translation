  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: pt
  text: ou, se lhe for dado a conhecer o pecado que cometeu[a], trará como sua oferta um bode, macho e sem defeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “se lhe for dado a conhecer o seu pecado, que cometeu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ
  choice: ou
  rationale: Conjunção disjuntiva simples que dá continuidade ao caso legal iniciado no versículo anterior.
- source_word: הוֹדַע אֵלָיו
  choice: se lhe for dado a conhecer
  rationale: 'O hofal de ידע expressa sentido passivo: o conhecimento da transgressão chega até ele. A formulação preserva essa passividade sem sugerir que ele apenas a percebe por conta própria.'
- source_word: חַטָּאתוֹ
  choice: o pecado
  rationale: Neste contexto, חַטָּאת designa a transgressão, não a oferta pelo pecado, como mostra a oração relativa seguinte. O possessivo é recuperado pelo contexto e explicitado na nota como alternativa mais formal.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: que cometeu
  rationale: A expressão hebraica com חטא e בָּהּ é idiomática. Em português natural, 'o pecado que cometeu' transmite o sentido sem reproduzir artificialmente a preposição.
- source_word: וְהֵבִיא
  choice: trará
  rationale: O waw seguido do perfeito, neste texto legal, apresenta a consequência prescrita. O futuro normativo português comunica adequadamente essa obrigação.
- source_word: קָרְבָּנוֹ
  choice: como sua oferta
  rationale: קָרְבָּן é aquilo que se apresenta ou aproxima como oferta a Deus. A expressão é clara e se encaixa naturalmente após o verbo 'trará'.
- source_word: שְׂעִיר עִזִּים
  choice: um bode
  rationale: A expressão denota um caprino macho. 'Bode' é o termo português corrente e específico.
- source_word: זָכָר
  choice: macho
  rationale: O texto especifica expressamente o sexo do animal; embora 'bode' já o indique lexicalmente, 'macho' preserva a especificação separada do hebraico.
- source_word: תָּמִים
  choice: sem defeito
  rationale: Expressão sacrificial clara e tradicional para um animal íntegro, sem imperfeição física que o desqualifique.
theological_decisions:
- issue: Sentido de חַטָּאת neste versículo
  choice: pecado/transgressão
  alternative: oferta pelo pecado
  rationale: Embora חַטָּאת possa designar tanto o pecado como a oferta pelo pecado em Levítico, a oração 'que cometeu' identifica aqui a transgressão. A oferta é mencionada separadamente por קָרְבָּנוֹ.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com futuro de valor normativo próprio da legislação. A ordem foi levemente ajustada para fluidez, preservando a voz passiva e a terminologia sacrificial.
