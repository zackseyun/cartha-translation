  naturalness: O português é claro, moderno e apropriado ao registro jurídico-cultual. “Se lhe for dado a conhecer” é um pouco formal, mas é natural neste registro e representa bem a passividade hebraica. A sequência “um bode, macho e sem defeito” é compreensível, ainda que marcada pela tentativa legítima de espelhar a explicitação do sexo no hebraico.
