  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: pt
  text: Porá a mão sobre a cabeça da oferta pelo pecado e abaterá a oferta pelo pecado no lugar do holocausto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חטאת pode designar a oferta relacionada ao pecado e à purificação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  choice: Porá a mão
  rationale: No contexto das instruções sacrificiais, סמך descreve pôr ou apoiar a mão sobre o animal. O singular de יָדוֹ é preservado, e o futuro em português expressa naturalmente a prescrição ritual.
- source_word: עַל רֹאשׁ
  choice: sobre a cabeça de
  rationale: Equivalente direto e natural da expressão hebraica, preservando a localização precisa do gesto ritual.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: Aqui חטאת designa tecnicamente o sacrifício relacionado ao pecado. Esta formulação é clara, tradicional e acessível, enquanto a alternativa ligada à purificação é registrada em nota.
- source_word: וְשָׁחַט
  choice: a matará
  rationale: שחט denota o abate do animal sacrificial. Em português bíblico corrente, “matar” comunica com clareza a ação ritual sem o possível tom industrial ou brutal de “abater”.
- source_word: בִּמְקוֹם הָעֹלָה
  choice: no lugar onde se mata o holocausto
  rationale: O hebraico diz literalmente “no lugar do holocausto”; a formulação explicita de modo natural que se trata do local habitual do abate, conforme o contexto ritual, sem confundir a expressão com substituição.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: Termo técnico consagrado em português para a oferta totalmente queimada, sendo mais reconhecível do que uma tradução etimológica como “oferta de subida”.
theological_decisions:
- issue: Sentido sacrificial de חטאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O contexto trata de um animal apresentado e morto como sacrifício. “Oferta pelo pecado” preserva a associação lexical explícita com pecado sem negar a função purificadora do rito; a alternativa legítima é mantida em nota.
- issue: Força verbal das formas consecutivas em legislação ritual
  choice: Porá ... e a matará
  alternative: Pôs ... e a matou
  rationale: Embora as formas hebraicas possam ter aparência narrativa, a unidade apresenta um procedimento prescrito. O futuro do presente é uma forma portuguesa natural e digna de transmitir essa força normativa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantém os termos sacrificiais reconhecíveis, o singular “a mão” e a sequência prescritiva. O referente implícito do segundo חטאת é retomado pelo pronome feminino “a”, evitando repetição pesada sem perder clareza.
