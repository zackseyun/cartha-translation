base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: pt
  text: Ele levará o novilho para fora do acampamento e o queimará, assim como queimou o primeiro novilho. É a oferta pelo pecado[a] da assembleia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico pode enfatizar tanto a função da oferta na remoção da impureza quanto seu papel em relação ao pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Ele levará ... para fora
  rationale: O hifil de יצא expressa fazer sair ou levar para fora. A formulação comunica naturalmente o deslocamento do animal para além do acampamento.
- source_word: הַפָּר
  choice: o novilho
  rationale: פַּר designa um bovino macho, frequentemente um novilho em contextos sacrificiais. “Novilho” é claro e corrente na linguagem levítica em português.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: A sequência preposicional indica movimento até um lugar além dos limites do acampamento.
- source_word: וְשָׂרַף אֹתוֹ
  choice: e o queimará
  rationale: שׂרף é o verbo comum para queimar; o futuro mantém em português o valor prescritivo da sequência verbal.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: assim como queimou
  rationale: כַּאֲשֶׁר introduz a comparação com o procedimento já descrito, preservada de modo natural por “assim como”.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: o primeiro novilho
  rationale: רִאשׁוֹן remete ao novilho anteriormente mencionado no capítulo; “primeiro” preserva a referência direta.
- source_word: חַטַּאת
  choice: oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת identifica a oferta ligada ao tratamento do pecado. A expressão é reconhecível e acessível, enquanto a nota registra a possível ênfase purificadora.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: קָהָל designa a coletividade reunida. “Assembleia” conserva o sentido corporativo sem acrescentar uma conotação denominacional.
- source_word: הוּא
  choice: É
  rationale: O pronome tem função identificadora e liga o novilho à oferta da assembleia; em português, “É” expressa isso com concisão e naturalidade.
theological_decisions:
- issue: Sentido de חַטַּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode destacar tanto o pecado quanto a função purificadora do sacrifício. O texto principal usa a designação tradicional e compreensível, sem apagar a alternativa lexical, que é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção prescritiva natural. “Novilho”, “acampamento” e “assembleia” preservam o registro sacrificial e comunitário sem arcaísmo excessivo.
