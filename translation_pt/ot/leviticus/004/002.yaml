source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a]: Se alguém pecar sem intenção[b] contra algum dos mandamentos de Yahweh, fazendo uma das coisas que não devem ser feitas,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos descendentes de Israel” ou “aos israelitas”; literalmente, em hebraico, “aos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por engano” ou “inadvertidamente”; o hebraico se refere a pecado cometido sem intenção, não a um ato deliberado de desafio.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo introduz a instrução divina direta a Moisés; “Fale” é natural e mantém a força do hebraico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar literal do hebraico, sem a reduzir simplesmente a “israelitas”.
- source_word: נֶפֶשׁ
  choice: alguém
  rationale: Neste contexto jurídico, נֶפֶשׁ designa uma pessoa, não especificamente a alma imaterial; “alguém” produz uma condição natural em português.
- source_word: תֶחֱטָא בִשְׁגָגָה
  choice: pecar sem intenção
  rationale: Expressa um pecado cometido inadvertidamente ou por engano, em contraste com uma transgressão deliberada e desafiadora.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: transgredindo algum dos mandamentos de Yahweh
  rationale: A construção com מִן indica infração referente aos mandamentos; “transgredindo” explicita com clareza a relação jurídica sem alterar o sentido.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: a respeito do que não deve ser feito
  rationale: Mantém a formulação impessoal da cláusula hebraica e identifica os mandamentos como proibições.
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: e fizer uma dessas coisas
  rationale: Retoma naturalmente os atos proibidos mencionados na oração anterior.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual e segue a decisão fornecida, sem substituí-lo por um título.
- issue: Natureza do pecado expiado nesta seção
  choice: sem intenção
  alternative: por engano; inadvertidamente
  rationale: A tradução preserva a distinção textual entre erro ou inadvertência e transgressão deliberada, sem definir além do que o termo hebraico permite.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação jurídica foi mantida sem rigidez excessiva; “filhos de Israel” conserva a imagem familiar do original, e “Yahweh” translitera o nome divino.
