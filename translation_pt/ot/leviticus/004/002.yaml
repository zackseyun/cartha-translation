  source_fidelity: 'O sentido geral está bem preservado: trata-se de pecado cometido inadvertidamente em relação a mandamentos de Yahweh que proíbem certos atos. Contudo, «a respeito do que não deve ser feito» pode soar como se os mandamentos tratassem genericamente de algo, em vez de qualificar os atos proibidos; «coisas que não devem ser feitas» reproduz mais diretamente a construção hebraica. A nota b está ancorada em «coisas», mas a alternativa diz respeito a «sem intenção» (בִּשְׁגָגָה), exigindo realocação do marcador.'
  naturalness: «Fale aos filhos de Israel» é natural em registro bíblico-formal; a sequência condicional é clara. «Coisas que não devem ser feitas» é mais idiomático e menos abstrato do que «a respeito do que não deve ser feito».
  terminology: «Yahweh», «filhos de Israel», «pecar» e «sem intenção» são escolhas adequadas. «Transgredindo» é aceitável como explicitação jurídica de pecado contra os mandamentos, embora «contra» seja mais próximo e mais conciso.
