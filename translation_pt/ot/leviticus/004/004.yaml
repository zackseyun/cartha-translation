id: LEV.4.4
reference: Leviticus 4:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: pt
  text: Ele levará o touro à entrada[a] da tenda do encontro, diante de Yahweh[b], porá a mão sobre a cabeça do touro e o abaterá diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à abertura da tenda do encontro”.
    reason: lexical_alternative
  - marker: b
    text: Expressão cultual que também pode significar “na presença de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Ele levará
  rationale: O hifil de בוא instrui o ofertante a levar o animal. O futuro simples expressa com naturalidade o caráter prescritivo da sequência ritual.
- source_word: הַפָּר
  choice: o touro
  rationale: פַּר designa um touro, às vezes entendido como jovem em contextos sacrificiais. “Touro” preserva o sentido sem acrescentar uma idade que o versículo não explicita.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: פֶּתַח é a abertura ou entrada; אֹהֶל מוֹעֵד é a designação do santuário. “Tenda do encontro” é clara e mantém a ideia de encontro marcada por מוֹעֵד.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי pode significar “diante de” ou “na presença de”. A formulação concisa preserva a expressão cultual hebraica e sua noção de presença.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração comunica o nome divino pessoal presente no hebraico, em vez de substituí-lo por um título.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: Porá a mão sobre a cabeça do touro
  rationale: סמך descreve o gesto ritual de colocar ou apoiar a mão sobre o animal. A tradução apresenta a ação sem definir no texto seu significado simbólico.
- source_word: וְשָׁחַט
  choice: e o abaterá
  rationale: שׁחט é o verbo técnico para matar um animal, especialmente em contexto sacrificial. “Abater” é natural em português para o ato de matar um animal e conserva a distinção em relação ao verbo genérico “matar”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Significado da imposição da mão no ritual
  choice: Traduzir somente a ação física
  alternative: Explicitar identificação com a vítima ou transferência de culpa
  rationale: O versículo ordena o gesto, mas não explica aqui todo o seu significado teológico. A tradução evita impor uma interpretação específica.
- issue: Sentido cultual de לִפְנֵי יְהוָה
  choice: diante de Yahweh
  alternative: na presença de Yahweh
  rationale: “Diante de” mantém a forma concisa da expressão hebraica sem excluir a noção de estar na presença divina.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Tenda do encontro” mantém a designação cultual; “touro” evita acrescentar idade; “abater” comunica a morte ritual do animal sem recorrer ao menos comum “imolar”.
