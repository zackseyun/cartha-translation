  text: וְ/אִם כֶּ֛בֶשׂ יָבִ֥יא קָרְבָּנ֖/וֹ לְ/חַטָּ֑את נְקֵבָ֥ה תְמִימָ֖ה יְבִיאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: pt
  text: E, se trouxer uma cordeira como sua oferta pelo pecado[a], deverá trazê-la sem defeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חַטָּאת pode designar o sacrifício que trata do pecado e da impureza ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Mantém a ligação com as instruções anteriores e introduz naturalmente uma alternativa em português.
- source_word: כֶּבֶשׂ
  choice: um cordeiro
  rationale: Designa aqui um animal do rebanho; “cordeiro” é a forma convencional e adequada no contexto sacrificial.
- source_word: יָבִיא
  choice: trouxer
  rationale: O hifil de בוא expressa concretamente o ato de trazer; o futuro do subjuntivo é natural após “se”.
- source_word: קָרְבָּנוֹ
  choice: sua oferta
  rationale: קָרְבָּן é aquilo que se apresenta a Deus; “oferta” é claro e preserva o sufixo possessivo.
- source_word: לְחַטָּאת
  choice: como sua oferta pelo pecado
  rationale: Identifica a categoria sacrificial tradicional sem eliminar a possível nuance de oferta de purificação, registrada em nota.
- source_word: נְקֵבָה
  choice: uma fêmea
  rationale: Explicita o sexo exigido para o animal em linguagem direta e natural.
- source_word: תְמִימָה
  choice: sem defeito
  rationale: No contexto sacrificial, תמים descreve um animal livre de defeito físico; “sem defeito” é preciso e corrente.
- source_word: יְבִיאֶנָּה
  choice: deverá trazer
  rationale: Preserva a força instrutiva do verbo e remete naturalmente à fêmea já especificada.
theological_decisions:
- issue: Tradução de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: “Oferta pelo pecado” é a designação tradicional e amplamente inteligível da categoria, enquanto “oferta de purificação” expressa uma nuance lexical legítima relacionada à remoção de pecado e impureza ritual; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção condicional usa o futuro do subjuntivo, e “deverá” comunica a exigência legal sem arcaísmo.
