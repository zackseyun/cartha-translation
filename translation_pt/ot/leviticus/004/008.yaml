source:
  edition: WLC
  text: וְ/אֶת כָּל חֵ֛לֶב פַּ֥ר הַֽ/חַטָּ֖את יָרִ֣ים מִמֶּ֑/נּוּ אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה עַל הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: pt
  text: 'E ele retirará do novilho da oferta pelo pecado toda a gordura: a gordura que cobre as vísceras e toda a gordura que está sobre as vísceras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de purificação”. O termo hebraico חַטָּאת pode designar tanto o “pecado” quanto a oferta relacionada à remoção do pecado ou da impureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: toda
  rationale: Preserva a força abrangente do hebraico, indicando a totalidade da gordura especificada para remoção.
- source_word: חֵלֶב
  choice: gordura
  rationale: É a tradução direta e natural para as porções adiposas sacrificiais; as expressões anatômicas seguintes esclarecem seu sentido ritual específico.
- source_word: פַּר הַחַטָּאת
  choice: novilho da oferta pelo pecado
  rationale: 'Expressa naturalmente a relação construta: o novilho destinado à oferta pelo pecado.'
- source_word: יָרִים
  choice: retirará
  rationale: Embora o verbo possa significar literalmente levantar, neste procedimento sacrificial indica separar e remover as porções designadas.
- source_word: מִמֶּנּוּ
  choice: do novilho
  rationale: Explicita em português o referente do pronome hebraico, evitando a ambiguidade pouco natural de 'dele' neste contexto procedural.
- source_word: הַמְכַסֶּה
  choice: que cobre
  rationale: A oração relativa reproduz com clareza a função atributiva do particípio hebraico.
- source_word: קֶרֶב
  choice: vísceras
  rationale: Designa de modo concreto e preciso os órgãos internos no contexto anatômico-sacrificial, sem a imprecisão de 'partes internas'.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: que está sobre as vísceras
  rationale: Mantém a relação espacial de עַל e distingue esta gordura daquela que cobre as vísceras.
theological_decisions:
- issue: Tradução de חַטָּאת no contexto sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: A tradução tradicional e amplamente compreensível preserva a associação lexical com pecado, enquanto a nota registra a nuance ritual de purificação sem resolver indevidamente a amplitude semântica do termo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe procedural clara. Emprega-se “novilho”, termo corrente em traduções bíblicas e adequado ao animal sacrificial; “vísceras” oferece precisão anatômica sem excesso de tecnicismo.
