id: LEV.4.24
reference: Leviticus 4:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: pt
  text: Ele porá a mão sobre a cabeça do bode e o abaterá no lugar onde se abate o holocausto, diante de Yahweh. É uma oferta pelo pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É uma oferta de purificação”. O termo hebraico חַטָּאת pode denotar tanto o “pecado” quanto a oferta associada à remoção do pecado ou da impureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Ele porá a mão
  rationale: A expressão ritual סמך יד é vertida de modo natural e claro; mantém-se a mão no singular, como no hebraico.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: sobre a cabeça do bode
  rationale: שָׂעִיר designa aqui o bode macho empregado no sacrifício; “bode” é preciso e corrente em português.
- source_word: וְשָׁחַט אֹתוֹ
  choice: e o abaterá
  rationale: “Abater” expressa a matança sacrificial com dignidade e naturalidade, sendo mais específico que “matar”.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת הָעֹלָה
  choice: no lugar onde se abate o holocausto
  rationale: A construção impessoal portuguesa representa naturalmente o sujeito não especificado do verbo hebraico ativo e conserva o caráter procedural da frase.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: “Holocausto” é o termo tradicional e amplamente reconhecido em português para a oferta inteiramente queimada.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” preserva a fórmula cultual, e “Yahweh” representa diretamente o nome divino יהוה.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: No contexto, o termo identifica uma categoria sacrificial. “Oferta pelo pecado” é claro e estabelecido, enquanto a possível nuance de purificação é registrada em nota.
- source_word: הוּא
  choice: É
  rationale: A cópula com sujeito implícito produz em português uma identificação predicativa natural e enfática do sacrifício.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva no texto o nome pessoal da aliança, em vez de substituí-lo por um título.
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo hebraico pode designar tanto o pecado quanto o sacrifício relacionado à remoção do pecado ou da impureza. O texto principal usa a designação mais reconhecível, sem ocultar a alternativa lexical, que aparece na nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe jurídica ritual clara. Emprega-se “bode”, “abater” e “holocausto” por serem termos naturais e reconhecíveis no contexto levítico.
