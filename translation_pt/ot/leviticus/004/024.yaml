  source_fidelity: 'O texto traduz com precisão os elementos centrais do hebraico: o gesto ritual de pôr a mão sobre a cabeça do bode, o abate, o lugar prescrito para o holocausto, a referência a Yahweh e a identificação do sacrifício como חַטָּאת. O singular de “mão” foi preservado. A construção impessoal “onde se abate” transmite adequadamente o imperfeito ativo hebraico de sujeito não expresso/especificado.'
