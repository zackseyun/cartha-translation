base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: pt
  text: Ou, se o pecado que cometeu for levado ao seu conhecimento,[a] então trará uma cabra sem defeito como sua oferta pelo pecado que cometeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «se vier a saber do pecado que cometeu» ou «se alguém o informar do pecado que cometeu». A forma passiva hebraica pode indicar tanto que a pessoa tomou consciência do pecado como que outra pessoa o comunicou a ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Ou, se
  rationale: Introduz um caso alternativo na sequência legal; em português, «Ou, se» explicita de modo natural o valor condicional do enunciado.
- source_word: הוֹדַ֣ע אֵלָ֔יו
  choice: for levado ao seu conhecimento
  rationale: Preserva a força passiva do hofal de ידע sem decidir se a pessoa percebeu o pecado por si mesma ou se alguém a informou.
- source_word: חַטָּאתוֹ
  choice: o pecado que cometeu
  rationale: Neste contexto, חטאת designa o ato pecaminoso, e não a oferta de purificação; a oração relativa torna a expressão idiomática em português.
- source_word: וְהֵבִיא
  choice: então trará
  rationale: Expressa a consequência prescrita na formulação legal, mantendo a sequência entre a condição e a ação exigida.
- source_word: קָרְבָּנוֹ
  choice: como sua oferta
  rationale: קרבן é aquilo que se apresenta ou traz como oferta; a formulação evita confundi-lo com o pecado mencionado em seguida.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: uma cabra
  rationale: A forma feminina «cabra» comunica naturalmente em português que se trata de um animal fêmea, sem redundância artificial.
- source_word: תְּמִימָה
  choice: sem defeito
  rationale: É a expressão sacrificial clara e corrente para um animal livre de defeito físico.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: pelo pecado que cometeu
  rationale: «Pelo» expressa de forma natural a relação da oferta com o pecado, sem transformar חטאת em nome da oferta.
theological_decisions:
- issue: Sentido de חַטָּאת nas duas ocorrências
  choice: Traduzir ambas como «pecado»
  alternative: Traduzir a segunda ocorrência como «oferta pelo pecado» ou «oferta de purificação»
  rationale: O animal já é identificado por קָרְבָּנוֹ como a oferta; as duas ocorrências de חַטָּאתוֹ referem-se ao ato cometido, conforme mostra a oração אֲשֶׁר חָטָא.
- issue: Modo pelo qual o pecado chega ao conhecimento da pessoa
  choice: Manter uma construção passiva e aberta
  alternative: Traduzir especificamente como percepção pessoal («perceber») ou informação recebida de outra pessoa («ser avisado»)
  rationale: O hofal de ידע permite que o pecado tenha sido percebido pela própria pessoa ou comunicado a ela; a tradução não deve resolver essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe jurídica compreensível. «Cabra» já indica naturalmente uma fêmea. A repetição de «pecado que cometeu» foi mantida por corresponder à repetição enfática do texto hebraico.
