  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: pt
  text: Queimará toda a gordura do animal sobre o altar, como se faz com a gordura do sacrifício de comunhão[a]. Assim, o sacerdote fará expiação por ele, por seu pecado[b], e ele será perdoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifício de paz” ou “sacrifício de bem-estar”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “oferta pelo pecado”; aqui, provavelmente se refere ao pecado da pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: a gordura do animal
  rationale: חֵלֶב designa as porções de gordura reservadas para serem queimadas no rito. Explicitar “do animal” torna claro o referente do sufixo masculino sem alterar o sentido.
- source_word: יַקְטִיר
  choice: queimará
  rationale: No hifil e em contexto sacrificial, קטר indica queimar sobre o altar, fazendo a oferta subir em fumaça. “Queimará” é natural e o contexto preserva o sentido ritual.
- source_word: הַמִּזְבֵּחָה
  choice: sobre o altar
  rationale: Embora a forma contenha ה direcional, a expressão idiomática portuguesa para a ação sacrificial é “queimar sobre o altar”.
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: como se faz com a gordura do sacrifício de comunhão
  rationale: A comparação diz respeito ao procedimento já estabelecido para a gordura do זֶבַח הַשְּׁלָמִים. A formulação natural explicita esse procedimento sem acrescentar conteúdo material.
- source_word: וְכִפֶּר עָלָיו
  choice: o sacerdote fará expiação por ele
  rationale: כפר no contexto sacerdotal designa a ação ritual de expiar em favor de alguém. “Fará expiação” conserva a terminologia cultual sem impor uma teoria específica da expiação.
- source_word: מֵחַטָּאתוֹ
  choice: por causa do seu pecado
  rationale: חַטָּאת pode significar “pecado” ou “oferta pelo pecado”. Aqui, após כפר e antes da declaração de perdão, o referente mais provável é a transgressão da pessoa; “por causa de” expressa com naturalidade a relação marcada por מִן.
- source_word: וְנִסְלַח לוֹ
  choice: e ele será perdoado
  rationale: O nifal de סלח com ל indica a pessoa que recebe o perdão. A forma passiva preserva a referência implícita a Deus como aquele que perdoa.
theological_decisions:
- issue: Sentido do termo sacrificial שְׁלָמִים
  choice: sacrifício de comunhão
  alternative: sacrifício de paz; sacrifício de bem-estar
  rationale: שְׁלָמִים abrange ideias de paz, integridade, bem-estar e comunhão. “Sacrifício de comunhão” é compreensível no português moderno e destaca a refeição compartilhada ligada à oferta, enquanto a nota preserva as alternativas lexicais legítimas.
- issue: Sentido de חַטָּאת em מֵחַטָּאתוֹ
  choice: seu pecado
  alternative: sua oferta pelo pecado
  rationale: O termo é genuinamente polissêmico em Levítico, mas a construção “fará expiação por ele” seguida de “será perdoado” favorece a transgressão como referente. A alternativa permanece registrada em nota, sem eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a terminologia ritual “altar”, “sacrifício” e “expiação”, evitando arcaísmos. Os marcadores [a] e [b] aparecem no texto principal.
