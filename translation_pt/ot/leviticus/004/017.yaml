revisions:
- from: Então o sacerdote molhará o dedo em um pouco do sangue e aspergirá um pouco do sangue sete vezes diante de Yahweh, em frente à cortina[a].
  to: Então o sacerdote mergulhará o dedo no sangue e o aspergirá sete vezes diante de Yahweh, em frente à cortina[a].
  rationale: A revisão substitui “molhará” por “mergulhará”, equivalente mais preciso de טבל no contexto ritual. Também usa o pronome “o” para retomar naturalmente o sangue como objeto implícito de וְהִזָּה, mantendo a clareza e reduzindo repetição. “No sangue” é idiomático em português e não exige inferir imersão de outra parte do corpo além do dedo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:55:33Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a sequência ritual, o sacerdote, o número de sete aspersões, Yahweh e a cortina. Contudo, “molhará” enfraquece o sentido de טבל, que denota imergir/mergulhar; “mergulhará” é mais exato sem perder naturalidade.
  naturalness: O texto é claro e de registro adequado. “Mergulhará o dedo no sangue” é a formulação portuguesa mais idiomática para a ação ritual. A repetição de “um pouco do sangue” é desnecessariamente pesada, pois o objeto da aspersão é claro pelo contexto.
  terminology: “Sacerdote”, “aspergirá”, “Yahweh” e “cortina” são escolhas adequadas. A nota lexical em “cortina” está corretamente ancorada e conserva “véu” como alternativa.
  issues:
  - severity: medium
    issue: “molhará” para וְטָבַל
    rationale: “Molhar” pode indicar apenas umedecer, enquanto o verbo hebraico descreve o ato de mergulhar/dip o dedo no sangue. “Mergulhará” representa melhor a ação prescrita.
  - severity: low
    issue: Repetição explícita de “um pouco do sangue”
    rationale: O hebraico deixa o objeto de “aspergirá” implícito. Em português, “aspergirá sete vezes” retoma naturalmente o sangue recém-mencionado e evita uma repetição pouco fluida; a formulação também não introduz uma divisão quantitativa além do que o texto exige.
  revised_text: Então o sacerdote mergulhará o dedo no sangue e o aspergirá sete vezes diante de Yahweh, em frente à cortina[a].
  revised_footnotes:
  - marker: a
    text: 'Ou: “véu”. O termo hebraico se refere à cortina do santuário que separava o espaço sagrado.'
    reason: lexical_alternative
