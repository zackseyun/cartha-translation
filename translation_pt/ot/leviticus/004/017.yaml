source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: pt
  text: Então o sacerdote mergulhará o dedo no sangue e o aspergirá sete vezes diante de Yahweh, em frente à cortina[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “véu”. O termo hebraico se refere à cortina do santuário que separava o espaço sagrado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: Então ... molhará
  rationale: O verbo טבל significa mergulhar ou molhar em um líquido. Neste procedimento ritual, “molhará o dedo” expressa de modo natural a ação limitada indicada pelo contexto, enquanto “Então” comunica a sequência narrativa do waw consecutivo.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente de כֹּהֵן em legislação sacrificial; o artigo definido foi preservado.
- source_word: אֶצְבָּעוֹ
  choice: o dedo
  rationale: Tradução direta do substantivo singular com sufixo possessivo; em português, a relação com o sacerdote fica clara pelo sujeito da oração.
- source_word: מִן הַדָּם
  choice: em um pouco do sangue
  rationale: Após טבל, a preposição מִן pode ter sentido partitivo. A formulação indica que o dedo toca uma porção do sangue, sem sugerir que a mão inteira seja imersa.
- source_word: וְהִזָּה
  choice: e aspergirá um pouco do sangue
  rationale: No uso ritual sacerdotal, נזה designa aspergir líquido, especialmente sangue. Como o objeto está implícito no hebraico, ele foi explicitado em português a partir do contexto imediato.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Correspondência direta e idiomática do numeral com o substantivo plural.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa “diante de” ou “na presença de”; “diante de” é conciso e natural no contexto ritual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: em frente à cortina
  rationale: A expressão refere-se à face ou parte frontal da cortina do santuário. “Em frente à cortina” é clara e natural em português moderno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “SENHOR”.
- issue: Tradução de פָּרֹכֶת
  choice: cortina
  alternative: véu
  rationale: O termo designa a cortina interna que delimitava o espaço sagrado. “Cortina” é acessível e arquitetonicamente clara; “véu” permanece em nota como alternativa tradicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O futuro do indicativo apresenta a instrução ritual, e a repetição de “sangue” explicita com clareza o objeto implícito do segundo verbo.
