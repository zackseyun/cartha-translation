  terminology: «Oferta pelo pecado» é uma tradução estabelecida e adequada para חַטָּאת, com a alternativa «oferta de purificação» corretamente preservada em nota. «Altar do holocausto» é convencional no português bíblico. «Chifres do altar» é o termo mais fiel e reconhecível para קַרְנֹת.
