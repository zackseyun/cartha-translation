  to: Então o sacerdote tomará, com o dedo, um pouco do sangue da oferta pelo pecado[a] e o porá sobre os chifres do altar do holocausto; derramará o restante do sangue na base do altar do holocausto.
  rationale: A revisão substitui «pontas» por «chifres», preservando o referente arquitetônico e a imagem lexical do hebraico. Também ajusta discretamente a ordem de «com o dedo» e simplifica a formulação final para maior fluidez. «O restante do sangue» mantém uma explicitação segura, já sustentada pela porção tomada anteriormente.
