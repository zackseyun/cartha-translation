id: LEV.4.25
reference: Leviticus 4:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: pt
  text: Então o sacerdote tomará, com o dedo, um pouco do sangue da oferta pelo pecado[a] e o porá sobre os chifres do altar do holocausto; derramará o restante do sangue na base do altar do holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico pode designar a oferta relacionada tanto à remoção da impureza quanto ao pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw com qatal dá continuidade à sequência ritual. “Então” expressa naturalmente em português o avanço para a etapa seguinte.
- source_word: מִדַּם
  choice: um pouco do sangue
  rationale: 'A preposição מִן tem sentido partitivo: apenas parte do sangue é tomada para ser aplicada com o dedo.'
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta ligada ao pecado ou à purificação, e não o conceito abstrato de pecado. “Oferta pelo pecado” é clara e tradicional, sem determinar uma teoria específica de expiação.
- source_word: בְּאֶצְבָּעוֹ
  choice: com o dedo
  rationale: A preposição בְּ indica o instrumento usado pelo sacerdote.
- source_word: וְנָתַן עַל
  choice: e o porá sobre
  rationale: Mantém a ação concreta do hebraico e soa natural no registro ritual em português.
- source_word: קַרְנֹת
  choice: as pontas
  rationale: Refere-se às projeções semelhantes a chifres nos cantos do altar. “Pontas” comunica a forma arquitetônica com maior clareza ao leitor comum; a nota não é necessária neste versículo.
- source_word: מִזְבַּח הָעֹלָה
  choice: o altar do holocausto
  rationale: É a designação convencional e concisa do altar associado às ofertas totalmente queimadas.
- source_word: וְאֶת דָּמוֹ יִשְׁפֹּךְ
  choice: o restante do sangue, ele o derramará
  rationale: Como uma parte do sangue já foi tomada, “o restante” torna explícita a implicação contextual do partitivo מִדַּם. A retomada pronominal preserva a ênfase marcada no objeto hebraico.
- source_word: אֶל יְסוֹד
  choice: junto à base
  rationale: יְסוֹד indica a base ou fundação do altar; “junto à base” expressa naturalmente o local em que o sangue é derramado.
theological_decisions:
- issue: Tradução de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo hebraico pode destacar o pecado ou a função purificadora do rito. Neste contexto, refere-se claramente à oferta sacrificial. A tradução principal mantém a categoria tradicional e amplamente compreensível, enquanto a alternativa preserva a legítima nuance ritual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe ritual sequencial. “Holocausto” é mantido como termo bíblico estabelecido para a oferta totalmente queimada. O marcador [a] aparece imediatamente após a expressão a que se refere.
