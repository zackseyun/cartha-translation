source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: pt
  text: O sacerdote porá parte do sangue sobre os chifres do altar do incenso aromático[b], que está diante de Yahweh, na tenda do encontro; e derramará todo o sangue do novilho[a] na base do altar do holocausto, que fica à entrada da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “todo o sangue do novilho”; no contexto, refere-se ao sangue restante depois que uma parte foi aplicada aos chifres do altar.
    reason: lexical_alternative
  - marker: b
    text: Ou, de forma mais breve, “altar do incenso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן הַכֹּהֵן מִן הַדָּם
  choice: O sacerdote porá um pouco do sangue
  rationale: O verbo נתן tem o sentido amplo de pôr ou colocar; מן é partitivo neste contexto, por isso “um pouco do sangue” comunica naturalmente que apenas uma porção é aplicada aos chifres.
- source_word: קַרְנוֹת
  choice: chifres
  rationale: Mantém o termo cultual concreto para as projeções nos cantos do altar.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: altar do incenso aromático
  rationale: Preserva tanto a identificação do altar quanto a referência aos ingredientes aromáticos do incenso; a nota registra a forma portuguesa mais breve.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” conserva o sentido espacial e litúrgico, e “Yahweh” translitera o nome divino.
- source_word: אֲשֶׁר בְּאֹהֶל מוֹעֵד
  choice: altar que está na tenda do encontro
  rationale: A repetição de “altar” elimina uma possível ambiguidade gramatical em português sem alterar o referente da oração relativa.
- source_word: וְאֵת כָּל דַּם הַפָּר יִשְׁפֹּךְ
  choice: Depois derramará todo o sangue do novilho
  rationale: Segue de perto a formulação hebraica “todo o sangue do novilho”. “Depois” expressa a sequência marcada pela conjunção sem inserir a palavra “restante” no texto principal.
- source_word: אֶל יְסוֹד מִזְבַּח הָעֹלָה
  choice: na base do altar do holocausto
  rationale: “Base” traduz יְסוֹד de modo natural, e “altar do holocausto” é a designação cultual consagrada para o altar da oferta totalmente queimada.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: que fica à entrada da tenda do encontro
  rationale: Reproduz de modo idiomático a localização do altar exterior junto à entrada da tenda.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o Tetragrama como nome próprio. A transliteração preserva essa função sem substituí-lo por um título.
- issue: Sentido de כָּל דַּם הַפָּר depois do uso prévio de parte do sangue
  choice: todo o sangue do novilho, com nota explicativa
  alternative: todo o restante do sangue do novilho
  rationale: A redação principal conserva a expressão literal e sua tensão com a ação anterior; a nota esclarece que, na sequência ritual, trata-se do sangue que restou, sem inserir no texto uma palavra ausente do hebraico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Mantêm-se os termos cultuais tradicionais “chifres”, “holocausto” e “tenda do encontro”. As notas foram posicionadas junto às expressões que de fato explicam.
