  to: O sacerdote porá parte do sangue sobre os chifres do altar do incenso aromático[b], que está diante de Yahweh, na tenda do encontro; e derramará todo o sangue do novilho[a] na base do altar do holocausto, que fica à entrada da tenda do encontro.
