source:
  edition: WLC
  text: וְ/לָקַ֛ח הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר וְ/הֵבִ֥יא אֹת֖/וֹ אֶל אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: pt
  text: Então o sacerdote ungido pegará um pouco do sangue do novilho e o levará para dentro da tenda do encontro[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente, “do sangue do novilho”. Em hebraico, a expressão provavelmente tem sentido partitivo: o sacerdote pega uma porção do sangue.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “para a tenda do encontro”. “Para dentro” reflete o contexto ritual, pois as ações seguintes ocorrem no interior do santuário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw seguido de qatal, neste procedimento sacrificial, expressa a próxima ação prescrita. “Então” torna clara a sequência, e o futuro mantém o valor instrucional natural em português.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: o sacerdote ungido
  rationale: Traduz diretamente o título hebraico e preserva a condição sacerdotal decorrente da unção, sem substituí-lo pelo título interpretativo “sumo sacerdote” nem introduzir conotações cristológicas indevidas.
- source_word: מִדַּם הַפָּר
  choice: um pouco do sangue do novilho
  rationale: 'A preposição מִן tem provável sentido partitivo: o sacerdote pega uma porção do sangue, não todo ele. “Novilho” é uma designação portuguesa corrente e adequada para o bovino macho sacrificial פַּר.'
- source_word: וְהֵבִיא אֹתוֹ
  choice: e o levará
  rationale: O pronome retoma “sangue”, masculino em português. O futuro continua a sequência de instruções rituais.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: para dentro da tenda do encontro
  rationale: Embora אֶל possa ser traduzido literalmente por “para”, o contexto ritual indica entrada na tenda, pois as ações seguintes ocorrem em seu interior. “Tenda do encontro” traduz os elementos da expressão hebraica de modo claro e natural.
theological_decisions:
- issue: Tradução de הַכֹּהֵן הַמָּשִׁיחַ em uma Bíblia cristã
  choice: o sacerdote ungido
  alternative: o sacerdote consagrado; o sumo sacerdote
  rationale: A opção conserva o sentido lexical de מָשִׁיחַ, “ungido”, e evita tanto apagar a formulação hebraica quanto atribuir automaticamente ao título levítico um sentido messiânico posterior.
- issue: Direção indicada por אֶל em relação à tenda
  choice: para dentro da tenda do encontro
  alternative: até a tenda do encontro; para a tenda do encontro
  rationale: A entrada é sustentada pelo desenvolvimento do ritual nos versículos seguintes, mas a nota registra que a preposição hebraica, isoladamente, é menos específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pegar” comunica de modo direto a ação ritual; “levar” é idiomático para o transporte do sangue. As notas preservam a forma mais literal e a pequena margem de ambiguidade da preposição hebraica.
