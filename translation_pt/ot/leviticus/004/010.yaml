base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/010.yaml
  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: pt
  text: assim como é retirada do boi do sacrifício de ofertas de paz[a], o sacerdote as queimará sobre o altar do holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “é levantada do boi do sacrifício de ofertas de paz”. O verbo hebraico evoca a retirada e a elevação das porções que seriam oferecidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Introduz com clareza a comparação entre este procedimento e o prescrito para as ofertas de paz.
- source_word: יוּרַם
  choice: é retirada
  rationale: O hofal de רום significa literalmente ser levantado, mas, neste contexto ritual, descreve a retirada das porções destinadas ao altar; a nota preserva a imagem de elevação.
- source_word: מִשּׁוֹר
  choice: do boi
  rationale: שׁוֹר designa um bovino; “boi” é uma tradução corrente e direta, sem especificar além do que o termo exige aqui.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifício de ofertas de paz
  rationale: Mantém tanto זֶבַח, “sacrifício”, quanto o plural הַשְּׁלָמִים, além da associação lexical tradicional com paz, sem substituir o termo por uma interpretação como “comunhão”.
- source_word: וְהִקְטִירָם
  choice: as queimará
  rationale: No uso sacrificial, o hifil de קטר indica queimar as porções no altar, fazendo-as subir em fumaça. O pronome plural retoma as porções de gordura enumeradas no versículo anterior.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente português padrão para o oficiante do culto.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: sobre o altar do holocausto
  rationale: Expressão cultual corrente em português para o altar associado à oferta totalmente queimada; “sobre” representa diretamente עַל.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial tradicional. A formulação preserva o caráter de continuação sintática do versículo anterior e a alternância do referente implícito singular em “é retirada” para as porções plurais retomadas por “as”.
