  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: pt
  text: Os anciãos da congregação porão as mãos sobre a cabeça do touro diante de Yahweh, e alguém abaterá[a] o touro diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico passa do sujeito plural «os anciãos» para um verbo no singular, sem identificar expressamente quem abate o touro. Também se pode traduzir: «e o touro será abatido diante de Yahweh».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: porão
  rationale: No contexto sacrificial, סמך designa o gesto ritual de pôr ou apoiar as mãos sobre a oferta. “Porão as mãos” é claro, natural e mantém a ação concreta.
- source_word: זִקְנֵי הָעֵדָה
  choice: os anciãos da congregação
  rationale: זִקְנֵי significa “anciãos de”, e עֵדָה se refere à comunidade reunida. “Congregação” preserva o caráter coletivo e formal do texto.
- source_word: אֶת יְדֵיהֶם
  choice: as mãos
  rationale: Mantém o plural do hebraico e, com o sujeito já expresso, o artigo definido é mais natural em português do que o possessivo.
- source_word: עַל רֹאשׁ הַפָּר
  choice: sobre a cabeça do touro
  rationale: Tradução direta da expressão espacial; פַּר designa aqui o bovino macho oferecido em sacrifício.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa “diante de” ou “na presença de”; “diante de” é conciso e apropriado à legislação sacrificial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְשָׁחַט
  choice: então ele abaterá
  rationale: A forma verbal é masculina singular, embora o sujeito anterior, “anciãos”, seja plural. O pronome explicita em português o número verbal e conserva a mudança, sem identificar quem é o agente.
- source_word: הַפָּר
  choice: o touro
  rationale: פַּר pode designar um touro ou novilho; “touro” traduz de modo simples sem acrescentar uma indicação etária.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; a transliteração preserva sua função como nome da aliança sem substituí-lo por um título.
- issue: Mudança do sujeito plural para o verbo singular וְשָׁחַט
  choice: 'manter o singular: “ele abaterá”'
  alternative: “o touro será abatido” ou “eles abaterão”
  rationale: O hebraico passa de “os anciãos” no plural para um verbo singular. Manter “ele” deixa aberta a possibilidade de um representante não identificado e evita harmonizar silenciosamente o número; a nota registra a alternativa passiva natural.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe própria da legislação ritual. “Congregação” mantém o tom comunitário de Levítico; “abater” é mais preciso no contexto sacrificial do que o termo genérico “matar”.
