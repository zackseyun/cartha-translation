revisions:
- from: Os anciãos da congregação porão as mãos sobre a cabeça do touro diante de Yahweh; então ele abaterá o touro diante de Yahweh.[a]
  to: Os anciãos da congregação porão as mãos sobre a cabeça do touro diante de Yahweh, e alguém abaterá[a] o touro diante de Yahweh.
  rationale: A revisão substitui o pronome sem antecedente claro por um agente indefinido, conserva o singular e a identificação não expressa do agente, e remove a sequência temporal acrescentada por «então». A nota é mantida e reposicionada junto ao verbo a que se refere.
