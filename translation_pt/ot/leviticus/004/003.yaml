id: LEV.4.3
reference: Leviticus 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: pt
  text: Se o sacerdote ungido pecar[a], trazendo culpa sobre o povo, apresentará, pelo pecado que cometeu, um novilho[b] sem defeito ao SENHOR como oferta pelo pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sumo sacerdote ungido”. O hebraico diz literalmente “o sacerdote ungido”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “um touro, filho do gado”; isto é, um bovino macho do rebanho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: o sacerdote ungido
  rationale: Reproduz diretamente a expressão hebraica, sem acrescentar o título interpretativo “sumo sacerdote”.
- source_word: יֶחֱטָא
  choice: pecar
  rationale: 'No período condicional introduzido por אִם, o imperfeito expressa naturalmente a hipótese legal: “se ... pecar”.'
- source_word: לְאַשְׁמַת הָעָם
  choice: trazendo culpa sobre o povo
  rationale: Expressa a consequência comunitária sugerida pela construção hebraica compacta sem definir além do texto o mecanismo dessa culpa.
- source_word: וְהִקְרִיב
  choice: apresentará
  rationale: No contexto sacrificial, הקריב indica trazer ou apresentar a oferta; “apresentará” mantém o sentido ritual e é natural em português.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: pelo pecado que cometeu
  rationale: Conserva a referência explícita à transgressão pela qual se oferece o sacrifício, evitando a repetição pouco natural “o pecado que pecou”.
- source_word: פַּר בֶּן בָּקָר
  choice: um novilho
  rationale: É uma forma portuguesa concisa e corrente para o bovino macho indicado pela expressão hebraica; a formulação mais literal é registrada em nota.
- source_word: תָּמִים
  choice: sem defeito
  rationale: Expressão clara e precisa para a integridade ritual exigida do animal sacrificial.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Emprega a convenção portuguesa tradicional para o tetragrama, em versalete textual representado aqui por maiúsculas.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: Neste contexto, חַטָּאת designa a oferta sacrificial relacionada ao pecado, não apenas o pecado em si.
theological_decisions:
- issue: Identificação de הַכֹּהֵן הַמָּשִׁיחַ
  choice: o sacerdote ungido
  alternative: o sumo sacerdote ungido
  rationale: Embora o referente contextual possa ser o sacerdote principal, o hebraico diz literalmente “o sacerdote ungido”; a tradução evita inserir um título que não aparece lexicalmente no versículo.
- issue: Sentido de לְאַשְׁמַת הָעָם
  choice: trazendo culpa sobre o povo
  alternative: resultando na culpa do povo
  rationale: A redação preserva a implicação coletiva do pecado do sacerdote, mas não explica de modo dogmático como essa culpa se relaciona com o povo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário sacrificial consistente. A ordem da frase foi ajustada apenas o necessário para soar natural, preservando a condição legal, a consequência coletiva e a função da oferta.
