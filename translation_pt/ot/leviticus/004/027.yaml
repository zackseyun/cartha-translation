  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: pt
  text: E, se uma pessoa do povo comum[a] pecar sem intenção, ao fazer uma das coisas proibidas pelos mandamentos de Yahweh, e assim se tornar culpada[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do povo da terra”. Aqui, a expressão se refere a um membro comum da comunidade, em contraste com o sacerdote ou o líder nas disposições próximas.
    reason: lexical_alternative
  - marker: b
    text: Ou “e incorrer em culpa” ou “e ser culpada”. O verbo hebraico pode expressar tanto a entrada em um estado de culpa como a condição de carregar culpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: uma pessoa
  rationale: Em linguagem jurídica, נֶפֶשׁ designa aqui um indivíduo. “Uma pessoa” preserva o singular e soa natural em português.
- source_word: תֶּחֱטָא
  choice: pecar
  rationale: O verbo חטא tem aqui seu sentido corrente de cometer pecado; a forma verbal direta é clara e fiel.
- source_word: בִשְׁגָגָה
  choice: sem intenção
  rationale: No contexto das leis sacrificiais, o termo indica uma transgressão não deliberada. “Sem intenção” comunica isso em português corrente.
- source_word: מֵעַם הָאָרֶץ
  choice: do povo comum
  rationale: Neste contexto, a expressão distingue uma pessoa comum da comunidade do sacerdote ou do líder mencionados nas leis próximas. A nota preserva a forma mais literal.
- source_word: בַּעֲשֹׂתָהּ
  choice: fazendo
  rationale: O infinitivo com ב expressa a circunstância ou o meio pelo qual a pessoa peca.
- source_word: אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: fazendo algo que Yahweh ordenou que não se fizesse
  rationale: A construção hebraica refere-se a uma dentre as proibições expressas nos mandamentos de Yahweh. Esta formulação evita a impressão pouco natural de que se “faz um mandamento” e mantém a força normativa da oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וְאָשֵׁם
  choice: e assim se tornar culpada
  rationale: O verbo pode indicar entrar em estado de culpa ou incorrer em culpa. “Assim” torna clara a consequência sem acrescentar uma categoria teológica externa.
theological_decisions:
- issue: Sentido de מֵעַם הָאָרֶץ na legislação sacrificial
  choice: do povo comum
  alternative: do povo da terra
  rationale: No contexto imediato, a expressão funciona como categoria social e jurídica para um membro comum da comunidade, em contraste com o sacerdote ungido, a congregação e o líder. A alternativa literal é mantida em nota.
- issue: Força de וְאָשֵׁם
  choice: e assim se tornar culpada
  alternative: e ser culpada / e incorrer em culpa
  rationale: A tradução conserva o movimento entre a transgressão e o estado de culpa, sem decidir além do hebraico se o foco recai sobre tornar-se culpado ou sobre assumir a culpa.
- issue: Relação entre o mandamento e o ato proibido
  choice: fazendo algo que Yahweh ordenou que não se fizesse
  alternative: fazendo um dos mandamentos de Yahweh que não devem ser feitos
  rationale: O hebraico usa uma expressão partitiva, mas o sentido contextual é cometer um ato proibido por um dos mandamentos. A formulação escolhida comunica esse sentido com clareza e preserva a proibição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase mantém a continuidade sintática do versículo com o que segue. Emprega “pessoa” e retoma o referente no feminino gramatical (“culpada”).
