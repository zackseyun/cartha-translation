source:
  edition: WLC
  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: pt
  text: A força de vocês se esgotará em vão,[a] a sua terra não dará o seu produto, e as árvores da terra não darão os seus frutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “A força de vocês se consumirá para o vazio”; e “a árvore da terra não dará o seu fruto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: se esgotará
  rationale: O verbo תמם indica que a força será consumida até o fim; “se esgotará” é natural em português e preserva essa ideia.
- source_word: לָרִיק
  choice: em vão
  rationale: A expressão comunica inutilidade e ausência de resultado, sentido bem expresso pela locução portuguesa “em vão”.
- source_word: כֹּחֲכֶם
  choice: a força de vocês
  rationale: כח designa força ou vigor; no contexto de trabalho agrícola, “força” é claro e mantém o plural da segunda pessoa de modo amplamente compreensível.
- source_word: תִתֵּן
  choice: dará
  rationale: O sentido básico do verbo נתן é “dar”. Em português, “a terra dar produto” e “as árvores dar frutos” são expressões naturais e preservam a imagem hebraica.
- source_word: אַרְצְכֶם
  choice: a sua terra
  rationale: Aqui ארץ se refere à terra pertencente ao povo e cultivada por ele; “a sua terra” é natural no português moderno.
- source_word: יְבוּלָהּ
  choice: o seu produto
  rationale: יבול é aquilo que a terra produz, isto é, seu produto ou sua produção. “Produto” mantém a abrangência do termo.
- source_word: וְעֵץ הָאָרֶץ
  choice: as árvores da terra
  rationale: Embora עץ esteja no singular, tem valor coletivo. O plural em português comunica naturalmente essa referência coletiva.
- source_word: פִּרְיוֹ
  choice: os seus frutos
  rationale: O sufixo hebraico é singular e concorda com o coletivo עץ; ao traduzir esse coletivo no plural, ajusta-se também “fruto” ao plural para fluência e concordância em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com uso de “vocês” para a segunda pessoa plural. A tradução conserva o paralelismo agrícola e a imagem concreta de a terra e as árvores “darem” sua produção.
