id: LEV.26.37
reference: Leviticus 26:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָשְׁל֧וּ אִישׁ בְּ/אָחִ֛י/ו כְּ/מִ/פְּנֵי חֶ֖רֶב וְ/רֹדֵ֣ף אָ֑יִן וְ/לֹא תִֽהְיֶ֤ה לָ/כֶם֙ תְּקוּמָ֔ה לִ/פְנֵ֖י אֹֽיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: pt
  text: Tropeçarão uns nos outros, como diante de uma espada[a], embora ninguém os persiga; e vocês não terão como manter-se firmes[b] diante dos seus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “cada um contra seu irmão”; aqui, a expressão retrata pessoas chocando-se ou tropeçando umas nas outras em pânico.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “vocês não poderão resistir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: Tropeçarão
  rationale: Preserva a imagem concreta de כשל, que neste contexto descreve o tropeço causado pelo pânico e pela desordem.
- source_word: אִישׁ בְּאָחִיו
  choice: uns nos outros
  rationale: A construção distributiva, literalmente “cada um contra seu irmão”, indica aqui que as pessoas se chocam ou tropeçam umas nas outras; a formulação escolhida é natural em português.
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: como diante de uma espada
  rationale: Mantém a comparação do hebraico sem explicitar a ação de fugir, que está sugerida pelo contexto, mas não é expressa pelo verbo.
- source_word: וְרֹדֵף אָיִן
  choice: embora ninguém os persiga
  rationale: Expressa naturalmente em português o contraste contextual entre o pânico de quem parece estar sob perseguição e a inexistência de um perseguidor.
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: vocês não terão como manter-se firmes
  rationale: תְּקוּמָה pode indicar a capacidade de levantar-se, permanecer de pé ou resistir. A tradução conserva a imagem de firmeza e comunica a incapacidade de sustentar posição contra o inimigo.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: diante dos seus inimigos
  rationale: Equivalente direto e idiomático de לִפְנֵי neste contexto de confronto hostil.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês”. A redação preserva a imagem hebraica do tropeço e da incapacidade de permanecer firme, sem acrescentar explicitamente a ideia de fuga.
