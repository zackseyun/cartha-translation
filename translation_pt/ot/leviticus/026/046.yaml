    rationale: Embora possa descrever o resultado jurídico do ato, נָתַן é «deu». A tradução direta preserva melhor a formulação do hebraico e o audit trail inglês.
  - severity: low
    issue: «entre si e os filhos de Israel» pode ser ambíguo
    rationale: Em português, «si» pode tornar menos clara a referência a Yahweh. «Entre ele e os filhos de Israel» é mais claro sem alterar o sentido.
  - severity: low
    issue: «decisões» para מִשְׁפָּטִים
    rationale: «Decisões» é possível, mas «juízos» mantém mais precisamente o termo jurídico tradicional e o paralelismo formal com «estatutos» e «leis».
  revised_text: Estes são os estatutos, os juízos e as leis que Yahweh deu entre ele e os filhos de Israel, no monte Sinai, por meio de Moisés[a].
