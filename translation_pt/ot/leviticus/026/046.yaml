base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: pt
  text: Estes são os estatutos, os juízos e as leis que Yahweh deu entre ele e os filhos de Israel, no monte Sinai, por meio de Moisés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «pela mão de Moisés», expressão que significa «por meio de Moisés». «Filhos de Israel» também pode ser traduzido como «israelitas».'
    reason: Nota lexical e cultural sobre o idioma hebraico de mediação e a designação do povo.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: Abertura dêitica natural em português, apresentando a síntese do material da aliança.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: Preserva o registro jurídico-aliancista de prescrições fixas.
- source_word: הַמִּשְׁפָּטִים
  choice: as decisões
  rationale: Expressa decisões ou determinações jurídicas e mantém distinção em relação a 'estatutos' e 'leis'.
- source_word: הַתּוֹרֹת
  choice: as leis
  rationale: No plural e nesta tríade jurídica, 'leis' comunica de modo claro corpos de instrução normativa.
- source_word: אֲשֶׁר נָתַן
  choice: que ... estabeleceu
  rationale: Embora נָתַן signifique literalmente 'deu', com 'entre si e' o português pede uma formulação relacional; 'estabeleceu' comunica a instituição dessas normas entre as partes da aliança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, sem substituí-lo por um título.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: entre si e os filhos de Israel
  rationale: Preserva tanto a relação expressa por 'entre' quanto a forma hebraica tradicional בְּנֵי יִשְׂרָאֵל.
- source_word: בְּהַר סִינַי
  choice: no monte Sinai
  rationale: Forma locativa corrente e natural em português.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Traduz diretamente o sentido mediador do idioma hebraico, evitando a pouco natural expressão literal 'pela mão de Moisés' no corpo do texto.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; a transliteração preserva o nome próprio e evita substituí-lo por um título.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A forma principal conserva a expressão hebraica, enquanto a alternativa idiomática é registrada em nota.
- issue: Relação expressa por נָתַן ... בֵּינוֹ וּבֵין
  choice: estabeleceu entre si e
  alternative: deu entre si e
  rationale: A tradução literal de נָתַן produz uma construção pouco natural em português. 'Estabeleceu' preserva o sentido de instituição das normas na relação de aliança, sem definir mais precisamente a natureza dessa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A enumeração jurídica mantém a textura formal do hebraico; a expressão idiomática final é vertida pelo seu sentido natural.
