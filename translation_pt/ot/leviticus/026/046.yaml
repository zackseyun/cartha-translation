  source_fidelity: A revisão é necessária porque נָתַן significa diretamente «deu»; «estabeleceu» explicita um efeito possível no contexto da aliança, mas não é a tradução mais fiel do verbo. A expressão final «por meio de Moisés» transmite adequadamente o sentido mediador de בְּיַד מֹשֶׁה.
  naturalness: «Entre ele e os filhos de Israel» evita a possível ambiguidade reflexiva de «entre si e os filhos de Israel» e permanece natural em português. «Juízos» conserva o registro jurídico e a distinção da tríade hebraica de modo mais próximo que «decisões».
  terminology: «Yahweh» preserva o tetragrama. «Estatutos, juízos e leis» reflete de forma consistente חֻקִּים, מִשְׁפָּטִים e תּוֹרוֹת. «Filhos de Israel» mantém a expressão hebraica, com a alternativa idiomática anotada.
