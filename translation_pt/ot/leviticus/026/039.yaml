  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: pt
  text: Os que restarem entre vocês definharão[a] por causa da sua iniquidade nas terras dos seus inimigos; e também, por causa das iniquidades de seus pais, definharão com eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se consumirão” ou “apodrecerão”; o verbo hebraico transmite a ideia de definhar ou deteriorar-se sob juízo.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “com eles” é concisa e ambígua. Pode indicar que as iniquidades de seus pais continuam com eles ou que eles definham juntamente com essas iniquidades ancestrais, ainda atuantes sobre eles.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: Os que restarem entre vocês
  rationale: Expressa naturalmente o particípio de שׁאר e mantém a ideia de pessoas deixadas do grupo diretamente interpelado.
- source_word: יִמַּקּוּ
  choice: definharão
  rationale: O nifal de מקק descreve deterioração ou enfraquecimento progressivo sob juízo. “Definharão” é corrente, solene e aplicável às duas ocorrências.
- source_word: בַּעֲוֺנָם
  choice: por causa da sua iniquidade
  rationale: Mantém עָוֹן no singular e entende בְּ em sentido causal, sem excluir a associação semântica entre pecado, culpa e suas consequências.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: nas terras dos seus inimigos
  rationale: Conserva o plural hebraico “terras” e o cenário de dispersão em territórios inimigos.
- source_word: וְאַף
  choice: e também
  rationale: Reproduz a força aditiva e intensificadora da expressão de modo natural em português.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: por causa das iniquidades de seus pais
  rationale: Preserva o plural “iniquidades” e traduz אבותם diretamente como “seus pais”, sem diluí-lo em paráfrase.
- source_word: אִתָּם
  choice: que estão com eles
  rationale: Mantém a noção compacta de presença ou associação expressa por “com eles”, deixando a nota registrar a ambiguidade sintática do hebraico.
theological_decisions:
- issue: Culpa e juízo entre gerações
  choice: Manter tanto a iniquidade da geração sobrevivente como as iniquidades de seus pais, sem explicar como ambas se relacionam.
  alternative: Limitar o sentido às consequências dos pecados ancestrais ou afirmar explicitamente que os sobreviventes repetem os mesmos pecados.
  rationale: O hebraico menciona distintamente “sua iniquidade” e “as iniquidades de seus pais”. A tradução conserva essa tensão teológica em vez de harmonizá-la.
- issue: Sentido de אִתָּם (“com eles”)
  choice: Vincular a expressão às iniquidades dos pais como algo que está com os sobreviventes, indicando em nota a leitura alternativa.
  alternative: Entender que eles definham junto com as iniquidades ancestrais que ainda os afetam.
  rationale: A construção hebraica é breve e ambígua; o texto principal precisa ser inteligível, mas a nota preserva a abertura interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Iniquidade” conserva a linguagem moral e judicial do contexto da aliança; “definharão” comunica deterioração progressiva sem coloquialismo.
