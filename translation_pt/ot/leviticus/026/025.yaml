  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: pt
  text: Trarei contra vocês uma espada que executará a vingança da aliança[a], e vocês serão reunidos em suas cidades. Então enviarei a peste no meio de vocês, e vocês serão entregues na mão do inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “uma espada que executa a vingança em defesa da aliança”, “uma espada que executa a vingança prevista pela aliança” ou, de modo mais fluente, “uma espada que vinga a aliança”. Em hebraico, a expressão é literalmente “uma espada que vinga a vingança da aliança”, uma construção enfática que liga a espada ao juízo da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם
  choice: Trarei contra vocês
  rationale: O hifil de בוא indica que Deus fará a espada vir sobre o povo; “trarei contra” expressa com naturalidade tanto a causação quanto o caráter hostil de עַל.
- source_word: חֶרֶב
  choice: uma espada
  rationale: O substantivo sem artigo apresenta a espada como instrumento de guerra e juízo; o artigo indefinido é natural em português.
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: uma espada que executará a vingança da aliança
  rationale: A construção com particípio e substantivo cognato é enfática. “Executará a vingança” evita a repetição pouco natural “vingará a vingança”, preservando o caráter judicial e a ligação explícita com a aliança.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: e vocês serão reunidos em suas cidades
  rationale: O nifal de אסף é mantido como passivo. “Em suas cidades” comunica o movimento para dentro dos centros urbanos no contexto de cerco.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: Então enviarei a peste para o meio de vocês
  rationale: דֶבֶר designa uma epidemia devastadora nas fórmulas de maldição da aliança. “Peste” é claro, corrente e solene; “para o meio de vocês” mantém a noção espacial de בְּתוֹכְכֶם.
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: e vocês serão entregues nas mãos do inimigo
  rationale: O nifal de נתן exprime entrega ou sujeição. A expressão portuguesa “nas mãos do inimigo” transmite naturalmente o idioma hebraico de cair sob o poder inimigo, embora o hebraico use “mão” no singular.
theological_decisions:
- issue: Sentido de “vingança da aliança”
  choice: Manter a aliança como complemento da vingança, sem explicar no corpo do versículo a relação exata.
  alternative: “vingança em defesa da aliança” ou “castigo previsto pela aliança”
  rationale: O construto hebraico permite entender a aliança como fundamento, objeto representado ou âmbito das sanções do juízo. A formulação preserva essa tensão e deixa claro que o juízo divino está ligado à aliança violada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “vocês” para o plural e evita arcaísmos, preservando ao mesmo tempo o tom solene e judicial do texto.
