  terminology: “Espada”, “vingança da aliança”, “peste” e “inimigo” são escolhas adequadas. “Executará a vingança da aliança” transmite de modo claro a força judicial da construção hebraica, sem resolver indevidamente a relação precisa entre vingança e aliança.
