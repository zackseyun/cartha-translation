base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: pt
  text: 'Também eu farei isto a vocês: porei sobre vocês terror repentino, doença debilitante e febre, que consomem os olhos e fazem a vida definhar[a]. Vocês semearão em vão a sua semente, e os seus inimigos a comerão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que fazem os olhos perder o vigor e a vida definhar”. A expressão hebraica descreve o desgaste provocado pelas enfermidades.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Também eu
  rationale: Preserva a ênfase do pronome independente e o valor continuativo e retributivo de אַף, em formulação portuguesa natural.
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: farei isto a vocês
  rationale: Expressa uma ação dirigida aos ouvintes no contexto de juízo; “a vocês” mantém boa legibilidade internacional e brasileira.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: porei sobre vocês
  rationale: O hifil de פקד pode indicar designar, impor ou trazer sobre alguém. “Porei sobre” conserva a imagem de um castigo imposto sem recorrer ao arcaico “visitarei sobre”.
- source_word: בֶּהָלָה
  choice: terror repentino
  rationale: Comunica tanto o terror ou pânico quanto o caráter súbito sugerido pelo termo e pelo contexto.
- source_word: הַשַּׁחֶפֶת
  choice: doença debilitante
  rationale: A identificação médica exata é incerta. A tradução descreve uma enfermidade que consome as forças sem especificar indevidamente tuberculose ou outra doença.
- source_word: הַקַּדַּחַת
  choice: febre
  rationale: Equivalente moderno e claro para a ideia de ardor febril.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: que consomem os olhos
  rationale: Mantém a imagem vívida de כלה, aplicada ao enfraquecimento ou definhamento dos olhos.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: fazem a vida definhar
  rationale: נפש designa aqui a vida ou vitalidade da pessoa; a formulação evita impor uma antropologia dualista e conserva a ideia de definhamento.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: Vocês semearão em vão a sua semente
  rationale: Reproduz a repetição etimológica entre o verbo semear e o substantivo semente, bem como a inutilidade expressa por לָרִיק.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: e os seus inimigos a comerão
  rationale: Mantém diretamente a conjunção hebraica e faz o pronome retomar “semente”, gramaticalmente feminina em português.
theological_decisions:
- issue: Sentido de נָפֶשׁ no contexto da maldição
  choice: vida
  alternative: alma
  rationale: Neste contexto de enfermidade e perda de vigor, “vida” representa a vitalidade do ser vivo sem introduzir uma afirmação doutrinária sobre uma alma imaterial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva as imagens hebraicas sem arcaísmos desnecessários; a incerteza do nome da doença não é convertida em diagnóstico médico específico.
