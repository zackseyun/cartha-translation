  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: pt
  text: A debulha se prolongará até a colheita das uvas, e a colheita das uvas se prolongará até a época da semeadura. Vocês comerão seu pão até ficarem satisfeitos e habitarão em segurança na sua terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשִּׂיג ... דַּיִשׁ אֶת־בָּצִיר
  choice: A debulha se prolongará até a colheita das uvas
  rationale: O verbo נׂשג, literalmente 'alcançar', descreve aqui a abundância pela qual uma atividade agrícola dura até a seguinte; 'se prolongará até' comunica naturalmente essa relação temporal.
- source_word: וּבָצִיר יַשִּׂיג אֶת־זָרַע
  choice: a colheita das uvas se prolongará até a época da semeadura
  rationale: בָּצִיר é especificamente a vindima/colheita de uvas, enquanto זֶרַע, neste contexto do calendário agrícola, designa a semeadura; explicitar 'época' produz português natural sem mudar o sentido.
- source_word: וַאֲכַלְתֶּם לַחְמְכֶם לָשֹׂבַע
  choice: Vocês comerão seu pão até ficarem satisfeitos
  rationale: לֶחֶם pode referir-se ao pão e, por extensão, ao alimento; conserva-se 'pão', imagem concreta do texto, e לָשֹׂבַע é expresso de maneira idiomática.
- source_word: וִישַׁבְתֶּם לָבֶטַח
  choice: viverão em segurança
  rationale: ישׁב pode significar sentar-se, habitar ou viver; neste contexto, 'viverão' é claro e natural, e לָבֶטַח indica segurança ou confiança.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa plural correntes no Brasil ('vocês') e vocabulário agrícola acessível. A repetição entre as duas colheitas foi preservada para refletir a estrutura e a promessa enfática do hebraico.
