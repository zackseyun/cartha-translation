base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: pt
  text: e se rejeitarem os meus estatutos, e se vocês tiverem aversão[a] aos meus juízos[b], de modo que não cumpram todos os meus mandamentos, quebrando assim a minha aliança[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “a alma de vocês abominar”. Aqui, “alma” pode referir-se à pessoa inteira.'
    reason: lexical_alternative
  - marker: b
    text: “Juízos” também pode ser traduzido por “normas” ou “ordenanças”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “violando assim a minha aliança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: os meus estatutos
  rationale: Preserva o registro jurídico da aliança e distingue חֻקִּים de מִשְׁפָּטִים na oração seguinte.
- source_word: תִּמְאָסוּ
  choice: rejeitarem
  rationale: Expressa a recusa, que no hebraico pode envolver desprezo, em linguagem atual e clara.
- source_word: מִשְׁפָּטַי
  choice: os meus juízos
  rationale: Mantém a nuance jurídico-decisória de מִשְׁפָּטִים e sua distinção em relação a estatutos e mandamentos.
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: a alma de vocês abominar
  rationale: Conserva נֶפֶשׁ como sujeito gramatical e a forte repulsa expressa por געל, sem reduzir a expressão a um simples 'vocês rejeitarem'.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: a ponto de não cumprirem
  rationale: Comunica naturalmente a relação de resultado entre a aversão e a desobediência; 'cumprir' é idiomático para mandamentos em português.
- source_word: כָּל מִצְוֺתַי
  choice: todos os meus mandamentos
  rationale: Mantém o vocabulário jurídico e pactual tradicional e compreensível.
- source_word: לְהַפְרְכֶם
  choice: quebrando assim
  rationale: Expressa a consequência da desobediência e o sentido de invalidar ou romper a aliança.
- source_word: בְּרִיתִי
  choice: a minha aliança
  rationale: É a equivalência portuguesa precisa e estabelecida para o termo pactual בְּרִית.
theological_decisions:
- issue: Manutenção do termo antropológico נֶפֶשׁ numa expressão idiomática
  choice: a alma de vocês abominar
  alternative: vocês abominarem; todo o ser de vocês abominar
  rationale: O hebraico faz de נֶפֶשׁ o sujeito explícito. A tradução mantém a imagem e a intensidade sem definir aqui uma doutrina técnica sobre a composição humana.
- issue: Distinção entre os termos da lei da aliança
  choice: estatutos / juízos / mandamentos / aliança
  alternative: decretos / normas / ordens / aliança
  rationale: A sequência hebraica emprega termos distintos; preservá-los reproduz a textura jurídica do texto e evita fundir categorias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural foi vertido por “vocês”; manteve-se “alma” para refletir a construção hebraica, com esclarecimento em nota. A pontuação final conserva a continuidade sintática com o versículo seguinte.
