  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: pt
  text: E quebrarei o orgulho da força de vocês e tornarei os seus céus[a] como ferro e a sua terra como bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o céu de vocês como ferro”. O hebraico traz “céus”, uma forma plural frequentemente usada para o céu acima.
    reason: lexical_alternative
  - marker: b
    text: Ou “cobre”. O termo hebraico pode referir-se ao cobre ou ao bronze.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Quebrarei
  rationale: שׁבר significa normalmente “quebrar” ou “despedaçar”. “Quebrarei” preserva a imagem e soa natural sem intensificá-la além do hebraico.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: o orgulho da força de vocês
  rationale: גָּאוֹן pode indicar orgulho, exaltação ou majestade, e עֹז, força ou poder. No contexto da maldição da aliança, “orgulho” comunica a autoconfiança arrogante, enquanto a construção genitiva hebraica permanece perceptível.
- source_word: וְנָתַתִּי
  choice: e tornarei
  rationale: Embora נתן signifique literalmente “dar” ou “pôr”, nesta construção indica fazer com que algo assuma determinada condição. “Tornarei” expressa esse resultado com naturalidade.
- source_word: שְׁמֵיכֶם
  choice: os seus céus
  rationale: O hebraico emprega a forma plural “céus”, frequentemente usada para o céu visível. A tradução conserva essa forma e acrescenta em nota a alternativa contextual no singular.
- source_word: כַּבַּרְזֶל
  choice: como ferro
  rationale: A comparação retrata os céus como duros e inflexíveis, incapazes de dar chuva; “como ferro” preserva diretamente a metáfora.
- source_word: אַרְצְכֶם
  choice: a sua terra
  rationale: אֶרֶץ pode significar terra, país ou solo. “Terra” abrange adequadamente tanto o território quanto o solo agrícola neste contexto.
- source_word: כַּנְּחֻשָׁה
  choice: como bronze
  rationale: נְחֻשָׁה pode designar cobre ou bronze. “Bronze” é a formulação tradicional e natural para a imagem de uma terra endurecida, sem excluir a alternativa lexical indicada em nota.
theological_decisions:
- issue: Força metafórica da imagem da maldição
  choice: Manter a imagem dos céus como ferro e da terra como bronze, evocando seca e esterilidade agrícola.
  alternative: Explicitar no texto que não choverá e que a terra ficará improdutiva.
  rationale: O contexto das maldições da aliança sustenta a referência à seca, mas o versículo a comunica por metáfora. Preservá-la evita transformar uma implicação contextual em explicação inserida no texto.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural e formas possessivas naturais ao leitor brasileiro. A estrutura conserva o paralelismo e as metáforas compactas do hebraico.
