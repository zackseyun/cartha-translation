base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: pt
  text: E vocês comerão a carne de seus filhos e comerão a carne de suas filhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Vocês comerão
  rationale: O Qal na segunda pessoa masculina plural, no contexto das maldições da aliança, tem força preditiva. O futuro do indicativo transmite isso naturalmente em português; o waw não precisa ser representado por um «e» inicial.
- source_word: בְּשַׂר
  choice: a carne
  rationale: בָּשָׂר designa a carne corporal. «Carne» é a correspondência direta e mantém sem eufemismo o horror concreto da advertência.
- source_word: בְּנֵיכֶם
  choice: de seus filhos
  rationale: O substantivo masculino plural significa especificamente «filhos» e deve permanecer distinto de «filhas», mencionado em seguida.
- source_word: וּבְשַׂר
  choice: e ... a carne
  rationale: A repetição de «carne» preserva o paralelismo e a ênfase sombria do hebraico.
- source_word: בְּנֹתֵיכֶם
  choice: de suas filhas
  rationale: Tradução direta que conserva o par explícito «filhos/filhas».
- source_word: תֹּאכֵלוּ
  choice: comerão
  rationale: A repetição do verbo no hebraico foi mantida, preservando a estrutura paralela e sua força retórica.
theological_decisions:
- issue: Declaração de canibalismo como maldição da aliança
  choice: 'Advertência preditiva direta: «Vocês comerão a carne de seus filhos e comerão a carne de suas filhas.»'
  alternative: Uma formulação suavizada ou eufemística
  rationale: O texto apresenta de modo explícito a consequência extrema do juízo da aliança. A tradução mantém essa gravidade sem suavizá-la nem acrescentar explicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para a segunda pessoa plural e futuro do indicativo para a força preditiva. A repetição de «comerão» e «a carne» conserva o paralelismo enfático do original.
