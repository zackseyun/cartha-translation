base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: pt
  text: Então a terra desfrutará dos seus sábados durante todos os dias de sua desolação[a], enquanto vocês estiverem na terra dos seus inimigos; então a terra descansará e desfrutará dos seus sábados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “receberá compensação por seus sábados”. O verbo hebraico, neste contexto, pode transmitir a ideia de receber o que era devido pelos sábados não observados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca temporalmente a consequência do juízo descrito anteriormente e preserva a repetição nas duas orações.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: compensará
  rationale: Neste contexto, רצה indica que a terra receberá o que lhe era devido pelos sábados antes negados. A mesma escolha nas duas ocorrências preserva a repetição hebraica.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se à terra da aliança, não ao planeta inteiro; esta é a formulação contextual padrão e natural em português.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: os seus sábados
  rationale: Designa os descansos sabáticos da terra, sobretudo os anos sabáticos no contexto. A expressão mantém a concisão e a personificação do hebraico.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: durante todos os dias em que estiver desolada
  rationale: Comunica a duração completa do estado de desolação da terra e explicita naturalmente em português que o sufixo se refere a ela.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: enquanto vocês estiverem na terra dos seus inimigos
  rationale: Expressa o valor circunstancial e temporal da oração com linguagem moderna e amplamente compreensível.
- source_word: תִּשְׁבַּת
  choice: descansará
  rationale: O verbo שבת descreve a cessação do cultivo e o descanso da terra, preservando o tema sabático.
theological_decisions:
- issue: Relação da terra com seus sábados durante o exílio
  choice: A terra compensará os sábados que lhe foram negados, descansando durante a desolação.
  alternative: A terra desfrutará dos seus sábados ou se agradará deles.
  rationale: 'O contexto das maldições da aliança favorece uma dimensão compensatória: durante o exílio, a terra recebe os descansos sabáticos que lhe eram devidos. A nota conserva a alternativa lexical mais tradicional e a ambiguidade genuína de רצה.'
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. “Vocês” evita uma forma regional ou arcaizante; “compensará” comunica o valor contextual sem eliminar a alternativa “desfrutará”, registrada em nota.
