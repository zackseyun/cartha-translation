  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: pt
  text: Mas, em favor deles, me lembrarei da aliança com os seus antepassados[a], os quais tirei da terra do Egito à vista das nações, para ser o Deus deles. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a aliança com os anteriores”. O hebraico diz literalmente “a aliança [com] os primeiros”, referindo-se às gerações anteriores da aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Mas ... me lembrarei
  rationale: O waw pode ser traduzido por “e”, mas aqui introduz uma virada contrastiva no contexto; “mas” comunica naturalmente essa função discursiva.
- source_word: לָהֶם
  choice: em favor deles
  rationale: Preserva a preposição ל e explicita que a lembrança atua em benefício deles, sem sugerir apenas que Deus se lembra das pessoas.
- source_word: בְּרִית רִאשֹׁנִים
  choice: a aliança com os seus antepassados
  rationale: רִאשֹׁנִים, literalmente “os primeiros/anteriores”, funciona como substantivo e designa a geração anterior ligada à aliança; “antepassados” é claro e natural em português, enquanto a nota preserva a formulação mais literal.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: os quais tirei
  rationale: A oração relativa retoma as pessoas mencionadas, não a aliança. “Os quais” evita ambiguidade gramatical em português.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Mantém a fórmula histórica e pactual do texto hebraico.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: à vista das nações
  rationale: Expressa de modo natural o sentido literal de um acontecimento público, realizado diante dos olhos das nações.
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: para ser o Deus deles
  rationale: Reproduz com clareza a fórmula da aliança e mantém a relação possessiva expressa no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Referente de בְּרִית רִאשֹׁנִים
  choice: A aliança com os antepassados, isto é, com a geração anterior que Deus tirou do Egito
  alternative: A aliança dos primeiros ou a aliança com as gerações anteriores
  rationale: A construção hebraica é condensada, mas a oração “os quais tirei da terra do Egito” aponta para pessoas como referente. A tradução conserva essa leitura sem identificar a expressão com uma formulação teológica posterior.
- issue: Valor de “lembrar” aplicado a Deus
  choice: Manter “me lembrarei”
  alternative: Agirei de acordo com a aliança
  rationale: O verbo bíblico implica ação fiel à aliança, mas explicitar essa implicação no corpo do versículo eliminaria parte da linguagem e da tensão próprias do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Em favor deles” preserva a força de לָהֶם; “à vista das nações” mantém a imagem pública do êxodo. O marcador [a] aparece junto à expressão anotada.
