  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִֽ/הְיֹ֥ת לָ/הֶ֖ם עֲבָדִ֑ים וָ/אֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּ/כֶ֔ם וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֖ם קֽוֹמְמִיּֽוּת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their slaves[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: pt
  text: Eu sou Yahweh, o Deus de vocês. Eu os tirei da terra do Egito, livrando-os de ser escravos deles. Quebrei as barras[a] do jugo de vocês e os fiz andar eretos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as hastes do jugo de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de cabeça erguida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função pessoal na fórmula da aliança.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: No contexto da fórmula da aliança, a forma hebraica refere-se no singular a Yahweh; “de vocês” oferece leitura atual e clara.
- source_word: הוֹצֵאתִי
  choice: Eu os tirei
  rationale: O hifil de יצא indica fazer sair ou tirar; a formulação conserva o motivo do êxodo e explicita naturalmente o sujeito em português.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Preserva a expressão geográfica e pactual do hebraico em português corrente.
- source_word: מִהְיוֹת לָהֶם עֲבָדִים
  choice: livrando-os de ser escravos deles
  rationale: Expressa a libertação da condição de escravidão sem suavizar עֲבָדִים como simples serviço. “Deles” mantém a referência contextual aos egípcios.
- source_word: וָאֶשְׁבֹּר
  choice: Quebrei
  rationale: Equivalente direto de שבר, mantendo em primeiro plano a ação libertadora de Deus.
- source_word: מֹטֹת עֻלְּכֶם
  choice: as barras do jugo de vocês
  rationale: Mantém a imagem concreta das peças do jugo que simbolizam a sujeição; “hastes” é alternativa lexical possível.
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: os fiz andar
  rationale: Preserva o valor causativo do hifil de הלך, em vez de reduzi-lo simplesmente a “conduzi”.
- source_word: קוֹמְמִיּוּת
  choice: eretos
  rationale: Conserva a imagem física de postura levantada e, ao mesmo tempo, a conotação de dignidade restaurada.
theological_decisions:
- issue: Condição de Israel no Egito
  choice: escravos
  alternative: servos
  rationale: O contexto é de sujeição opressiva, por isso “escravos” comunica com precisão a condição vinculada de עֲבָדִים e evita suavizá-la.
- issue: Imagem final da libertação
  choice: os fiz andar eretos
  alternative: os fiz andar de cabeça erguida
  rationale: A opção principal preserva a combinação hebraica de movimento causativo e postura ereta, sem eliminar a dimensão concreta nem transformar a imagem em mera explicação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A divisão após a fórmula inicial evita uma construção relativa artificial em português, sem alterar a sequência nem o agente das ações divinas. Os pronomes no plural deixam claro que Yahweh se dirige coletivamente a Israel.
