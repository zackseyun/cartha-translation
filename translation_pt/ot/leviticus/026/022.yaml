source:
  edition: WLC
  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: pt
  text: Enviarei contra vocês os animais selvagens[a], que os deixarão sem filhos[b], exterminarão os seus rebanhos e reduzirão o número de vocês; e as suas estradas ficarão desertas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os animais do campo”; também pode ser traduzido por “as feras do campo”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico significa privar alguém de filhos, deixando-o enlutado.
    reason: idiom_clarification
  - marker: c
    text: 'Ou: “os seus caminhos ficarão desolados”. Aqui, provavelmente se refere às estradas ou rotas que ficarão sem viajantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: Enviarei contra vocês
  rationale: O hifil de שלח expressa o ato de enviar, e ב, neste contexto hostil, é naturalmente traduzido por “contra”. A formulação preserva claramente a ação divina.
- source_word: חַיַּת הַשָּׂדֶה
  choice: os animais selvagens
  rationale: A expressão designa os animais não domesticados que vivem fora dos assentamentos. Em português atual, “animais selvagens” comunica o sentido sem o tom arcaizante de “feras do campo”.
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: que os deixarão sem filhos
  rationale: No piel, שׁכל indica privar alguém de filhos. A tradução explicita o objeto convencionalmente implícito no idioma hebraico, evitando a expressão pouco natural “enlutarão vocês”.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: exterminarão os seus rebanhos
  rationale: הכרית denota eliminar ou exterminar, enquanto בְּהֵמָה abrange os animais domésticos. “Rebanhos” é uma forma natural e coletiva de referir-se ao gado e demais animais de criação neste contexto.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: reduzirão o número de vocês
  rationale: O hifil de מעט significa tornar poucos ou diminuir. Esta formulação expressa com clareza a redução da população.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: e as suas estradas ficarão desertas
  rationale: נשׁם indica desolação, e דְּרָכִים, no quadro de despovoamento, refere-se mais naturalmente a estradas ou rotas sem circulação.
theological_decisions:
- issue: Objeto implícito na cláusula de privação
  choice: Explicitar “sem filhos” no texto
  alternative: Traduzir de modo formal como “os privarão” ou “os deixarão enlutados”, sem identificar a perda
  rationale: Embora “filhos” não apareça como substantivo separado no hebraico, o verbo שׁכל convencionalmente denota a perda de filhos. A explicitação torna o idioma compreensível em português sem introduzir uma afirmação teológica alheia ao texto.
- issue: Referente de דַּרְכֵיכֶם
  choice: Entender como estradas ou rotas literais
  alternative: Traduzir genericamente como “os seus caminhos”
  rationale: A sequência descreve morte, perda de animais e redução populacional; nesse contexto, estradas desertas são a consequência social concreta mais provável. A nota preserva a alternativa lexical mais ampla.
translation_notes:
  register: 'Português moderno, claro e digno, com uso de “vocês” para o plural. A coordenação foi ajustada para fluidez: os animais selvagens são o sujeito das ações intermediárias. Os marcadores de nota aparecem junto às expressões correspondentes, e a pontuação distingue a consequência final referente às estradas.'
