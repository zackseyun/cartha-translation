  text: וְ/נָתַתִּ֥י מִשְׁכָּנִ֖/י בְּ/תוֹכְ/כֶ֑ם וְ/לֹֽא תִגְעַ֥ל נַפְשִׁ֖/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/011.yaml
  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: pt
  text: Porei a minha morada no meio de vocês, e a minha alma não terá repulsa por vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: a minha morada
  rationale: O termo מִשְׁכָּן designa o lugar onde Deus habita e também pode referir-se ao tabernáculo. “Morada” preserva aqui a ideia central de presença divina entre o povo sem restringir indevidamente o sentido ao edifício cultual.
- source_word: בְּתוֹכְכֶם
  choice: no meio de vocês
  rationale: Expressa de modo natural e fiel a presença de Deus dentro da comunidade, mantendo ampla legibilidade em português moderno.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Mantém a formulação enfática e antropomórfica do hebraico, em vez de reduzi-la simplesmente a “eu”.
- source_word: תִגְעַל
  choice: terá repulsa por
  rationale: Reproduz o sentido forte de sentir aversão ou rejeição, com construção natural em português.
theological_decisions:
- issue: Atribuição de נֶפֶשׁ a Deus
  choice: Preservar literalmente “a minha alma”
  alternative: “não rejeitarei vocês” ou “não terei repulsa por vocês”
  rationale: A expressão hebraica genuinamente diz “minha alma”; mantê-la conserva a força e a tensão antropomórfica do texto sem impor uma explicação teológica.
- issue: Sentido de מִשְׁכָּן
  choice: “morada”
  alternative: “tabernáculo”
  rationale: Neste contexto de promessa, o termo ressalta que Deus estabelecerá sua habitação entre o povo. “Morada” preserva esse sentido abrangente, enquanto “tabernáculo” poderia limitar a referência à estrutura cultual.
translation_notes:
  register: Português moderno, digno e direto, com “vocês” para a segunda pessoa plural, favorecendo legibilidade brasileira e compreensão internacional. A ordem das duas orações e a expressão “a minha alma” acompanham de perto o hebraico.
