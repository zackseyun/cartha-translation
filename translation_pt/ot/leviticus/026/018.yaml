source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: pt
  text: E, se, apesar de tudo isso[a], vocês não me ouvirem, continuarei a discipliná-los sete vezes[b] por causa dos seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mesmo depois de tudo isso”. A expressão hebraica indica que o povo continua desobediente apesar dos juízos anteriores.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica pode indicar uma disciplina intensificada, e não necessariamente uma contagem numérica exata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Preserva a força conectiva de וְ e introduz naturalmente a continuação condicional das advertências da aliança.
- source_word: עַד אֵלֶּה
  choice: apesar de tudo isso
  rationale: No contexto, a expressão indica persistência na desobediência apesar dos juízos anteriores, e não simplesmente um limite temporal.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: vocês não me ouvirem
  rationale: Mantém a imagem auditiva de שׁמע, deixando implícita, como no hebraico, a ideia contextual de ouvir com obediência.
- source_word: וְיָסַפְתִּי
  choice: continuarei
  rationale: Expressa de modo natural a ideia de prosseguir ou acrescentar novas medidas disciplinares.
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: a discipliná-los
  rationale: יסר reúne correção e punição; “disciplinar” preserva essa amplitude sem reduzir o sentido a mera retribuição.
- source_word: שֶׁבַע
  choice: sete vezes mais
  rationale: Reproduz a fórmula hebraica de intensificação em português corrente, sem eliminar a possível leitura quantitativa.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: por causa dos seus pecados
  rationale: Torna explícita de maneira natural a relação causal indicada por עַל.
theological_decisions:
- issue: Natureza de יָסַר no contexto das sanções da aliança
  choice: discipliná-los
  alternative: puni-los; castigá-los
  rationale: As sanções são punitivas, mas também têm dimensão corretiva dentro da relação de aliança. “Disciplinar” preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”. A formulação conserva a estrutura condicional e o caráter cumulativo das advertências, evitando tanto arcaísmo quanto explicação excessiva no corpo do versículo.
