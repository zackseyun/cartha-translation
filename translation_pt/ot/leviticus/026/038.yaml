  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: pt
  text: Vocês perecerão entre as nações, e a terra dos seus inimigos os consumirá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os comerá”; também pode ser traduzido por “os devorará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: vocês perecerão
  rationale: O Qal de אבד, na sequência das maldições da aliança, indica ruína ou desaparecimento. “Perecerão” preserva a gravidade sem especificar indevidamente uma forma de morte.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa nações ou povos. “Entre as nações” é natural em português e se ajusta ao contexto de dispersão, sem importar o sentido posterior de “gentios”.
- source_word: וְאָכְלָה
  choice: consumirá
  rationale: אכל significa literalmente “comer”. Tendo “a terra” como sujeito, forma uma metáfora de absorção e destruição; “consumirá” mantém a imagem de modo claro e natural.
- source_word: אֶתְכֶם
  choice: os
  rationale: O marcador de objeto direto com sufixo de segunda pessoa masculina plural é expresso naturalmente pelo pronome objeto “os”, retomando “vocês”.
- source_word: אֶרֶץ
  choice: a terra
  rationale: Neste contexto de exílio, אֶרֶץ se refere à terra ou território em que os destinatários estarão sob o domínio inimigo.
- source_word: אֹיְבֵיכֶם
  choice: dos seus inimigos
  rationale: A construção hebraica modifica “terra”; “dos seus inimigos” é direta, clara e preserva a relação expressa no original.
theological_decisions:
- issue: Força metafórica de “a terra dos seus inimigos os consumirá”
  choice: Manter a terra como sujeito da ação metafórica de consumir os exilados.
  alternative: Explicitar como “a terra dos seus inimigos os destruirá”.
  rationale: O hebraico personifica a terra mediante o verbo comum “comer”. Preservar essa imagem mantém a severidade e a tensão literária da maldição da aliança sem acrescentar uma interpretação sobre o mecanismo da destruição.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural e construções de ampla legibilidade brasileira. A metáfora hebraica foi preservada sem tornar a frase artificial.
