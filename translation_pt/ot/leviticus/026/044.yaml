  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: pt
  text: Mesmo assim, quando estiverem na terra dos seus inimigos, não os rejeitarei nem os detestarei, a ponto de exterminá-los[a] e romper a minha aliança com eles, pois eu sou Yahweh, o Deus deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dar cabo deles” ou “consumi-los por completo”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz YHWH, o nome divino tradicionalmente representado por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: Mesmo assim
  rationale: A combinação introduz uma forte concessão diante dos juízos anteriores. “Mesmo assim” comunica de modo natural que a promessa permanece válida apesar dessas circunstâncias.
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: quando estiverem na terra dos seus inimigos
  rationale: O infinitivo construto com בְּ expressa circunstância temporal. O futuro do subjuntivo é natural em português no contexto prospectivo do exílio.
- source_word: לֹא מְאַסְתִּים
  choice: não os rejeitarei
  rationale: מָאַס indica rejeitar ou repudiar. “Rejeitarei” preserva o sentido relacional e pactual, e o futuro comunica a força promissória no contexto.
- source_word: וְלֹא גְעַלְתִּים
  choice: nem os tratarei com repulsa
  rationale: גָּעַל exprime forte aversão ou repulsa. A formulação conserva a intensidade sem recorrer ao pouco corrente “abominarei” aplicado diretamente a pessoas.
- source_word: לְכַלֹּתָם
  choice: a ponto de exterminá-los
  rationale: O infinitivo com לְ pode indicar propósito ou resultado. “A ponto de” preserva essa relação com os dois verbos anteriores, e “exterminá-los” comunica a ideia de dar cabo deles completamente.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: e romper a minha aliança com eles
  rationale: הֵפֵר, com “aliança”, significa quebrar, invalidar ou anular. “Romper” é claro e idiomático em português e mantém a gravidade pactual.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: pois eu sou Yahweh, o Deus deles
  rationale: כִּי apresenta a razão da promessa. O nome divino é transliterado, e o artigo antes de “Deus” produz português natural sem alterar a relação possessiva.
theological_decisions:
- issue: Forma verbal dos dois qatal no contexto prospectivo
  choice: 'futuro: “não os rejeitarei nem os tratarei com repulsa”'
  alternative: 'pretérito perfeito: “não os rejeitei nem os tratei com repulsa”; presente: “não os rejeito...”'
  rationale: Embora as formas hebraicas sejam qatal, o contexto descreve Israel na terra dos inimigos e afirma o compromisso contínuo de Deus. O futuro português expressa adequadamente a força promissória sem atribuir ao qatal um valor temporal rígido.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração torna visível o nome pactual presente no hebraico, sem substituí-lo por um título. A nota registra a tradição gráfica alternativa.
- issue: Relação dos infinitivos לְכַלֹּתָם e לְהָפֵר com os verbos anteriores
  choice: 'resultado ou limite: “a ponto de exterminá-los e romper...”'
  alternative: 'propósito direto: “para exterminá-los e romper...”'
  rationale: A construção pode ser entendida em termos de propósito ou resultado. “A ponto de” preserva a nuance de que a rejeição e a repulsa não chegarão à destruição total nem à ruptura da aliança.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. Preferiu-se “terra” a “país” para manter a linguagem territorial recorrente em Levítico; “aliança” preserva o vocabulário bíblico central.
