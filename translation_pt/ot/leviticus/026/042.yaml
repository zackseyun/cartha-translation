base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: pt
  text: Então me lembrarei da minha aliança com Jacó[a], e também da minha aliança com Isaque; e também da minha aliança com Abraão me lembrarei; e da terra me lembrarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E me lembrarei”. A conjunção hebraica pode ser traduzida simplesmente por “e”; “então” reflete a ligação deste versículo com o contexto anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Então me lembrarei
  rationale: O verbo זכר, em contexto de aliança, sugere lembrar com a disposição de agir, mas a tradução mantém o verbo simples. A conjunção וְ pode ser vertida por “e”; aqui, “então” explicita naturalmente a ligação com o contexto anterior.
- source_word: בְּרִיתִי
  choice: minha aliança
  rationale: בְּרִית é o termo bíblico consagrado para o vínculo pactuado e solene de Deus com os patriarcas; “aliança” é claro, preciso e amplamente reconhecido em português.
- source_word: וְאַף
  choice: também / e também
  rationale: אַף possui aqui força aditiva e enfática. A formulação portuguesa preserva essa progressão sem rigidez desnecessária.
- source_word: יַעֲקֹב / יִצְחָק / אַבְרָהָם
  choice: Jacó / Isaque / Abraão
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: אֶזְכֹּר
  choice: me lembrarei
  rationale: A repetição do verbo é preservada porque dá peso retórico à lembrança da aliança com Abraão e, em seguida, da terra.
- source_word: וְהָאָרֶץ
  choice: E ... da terra
  rationale: אֶרֶץ refere-se, neste contexto da aliança, à terra prometida. “A terra” conserva a referência e a concisão do hebraico.
theological_decisions:
- issue: Ordem e ênfase das alianças patriarcais
  choice: Manter a ordem hebraica Jacó, Isaque e Abraão, repetindo “minha aliança”.
  alternative: Reordenar para Abraão, Isaque e Jacó ou condensar em “a aliança com Abraão, Isaque e Jacó”.
  rationale: A ordem inversa e a repetição são características expressas do texto hebraico e devem ser mantidas, sem substituí-las por uma fórmula tradicional mais familiar.
- issue: Sentido da lembrança divina
  choice: Traduzir זכר por “lembrar”, sem explicitar a ação decorrente.
  alternative: “Recordarei e agirei” ou “renovarei”.
  rationale: No contexto da aliança, a lembrança divina implica disposição para agir, mas o texto diz “lembrar”. Preservar o termo mantém a tensão teológica sem acrescentar uma interpretação à tradução.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas reconhecidas no Brasil e inteligíveis internacionalmente. A repetição e a ordem marcada do hebraico foram preservadas deliberadamente.
