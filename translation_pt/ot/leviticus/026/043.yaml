base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: pt
  text: Mas a terra será abandonada por eles e desfrutará de seus sábados enquanto estiver desolada, sem eles; e eles aceitarão a punição por sua iniquidade[a], pois — justamente porque — rejeitaram meus juízos, e sua alma abominou meus estatutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aceitarão sua iniquidade” ou “suportarão a pena por sua iniquidade”. A expressão hebraica admite mais de uma interpretação; aqui ela é traduzida em sentido judicial, no contexto da punição decorrente da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב מֵהֶם
  choice: será deixada por eles
  rationale: Preserva o passivo do nifal de עזב e a referência à retirada do povo, sem acrescentar uma causa não expressa.
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: desfrutará seus sábados
  rationale: No contexto dos descansos sabáticos da terra, רצה indica que ela receberá ou desfrutará o repouso que lhe era devido.
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: enquanto estiver desolada, sem eles
  rationale: Expressa tanto o estado de desolação da terra quanto a ausência do povo.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: aceitarão a punição por sua iniquidade
  rationale: No contexto judicial das maldições da aliança, a expressão provavelmente se refere a aceitar ou suportar a consequência penal da iniquidade; a nota conserva outras possibilidades do idioma hebraico.
- source_word: יַעַן וּבְיַעַן
  choice: porque — sim, porque —
  rationale: A repetição enfática da expressão causal é mantida de modo claro e natural em português.
- source_word: בְּמִשְׁפָּטַי
  choice: meus juízos
  rationale: Mantém o sentido jurídico e pactual de מִשְׁפָּטִים e o distingue de חֻקּוֹת.
- source_word: חֻקֹּתַי
  choice: meus estatutos
  rationale: Termo jurídico adequado para os decretos prescritos, preservando a distinção lexical do texto.
- source_word: גָּעֲלָה נַפְשָׁם
  choice: a alma deles abominou
  rationale: Conserva a formulação coletiva no singular e a força antropológica de נֶפֶשׁ, além da intensa aversão expressa por געל.
theological_decisions:
- issue: Sentido de עָוֹן em יִרְצוּ אֶת עֲוֺנָם
  choice: 'sentido penal: “aceitarão a punição por sua iniquidade”'
  alternative: “aceitarão sua iniquidade” ou “expiarão sua iniquidade”
  rationale: O contexto imediato é o juízo da aliança, o exílio e a compensação dos descansos sabáticos da terra. A tradução principal explicita a provável consequência judicial sem sugerir que o povo obtenha expiação meritória; a nota registra a ambiguidade real do idioma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os termos pactuais “sábados”, “juízos” e “estatutos”, bem como a expressão coletiva “a alma deles”. O ponto e vírgula esclarece a progressão entre o repouso da terra e a punição do povo.
