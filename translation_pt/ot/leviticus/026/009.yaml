source:
  edition: WLC
  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: pt
  text: Eu me voltarei para vocês e os tornarei fecundos e numerosos; e confirmarei a minha aliança com vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estabelecerei a minha aliança com vocês”. O verbo hebraico pode indicar estabelecer, confirmar ou fazer permanecer uma aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: Eu me voltarei para vocês
  rationale: Preserva a imagem concreta do hebraico פנה com a direção marcada por אֶל, ao mesmo tempo que o contexto de bênção comunica favor divino.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: os tornarei fecundos
  rationale: O hifil de פרה é causativo. “Tornarei fecundos” expressa a ação divina e mantém a linguagem bíblica de fecundidade.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: e numerosos
  rationale: O hifil de רבה significa fazer aumentar ou tornar numeroso. A construção coordenada “os tornarei fecundos e numerosos” é natural em português e conserva a fórmula de bênção.
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי
  choice: e confirmarei a minha aliança
  rationale: No contexto, a aliança já está em vigor; por isso, קום no hifil é vertido por “confirmarei”, que comunica sua manutenção ou ratificação sem sugerir necessariamente a criação de uma nova aliança.
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: Expressa de modo direto e natural a relação da aliança com os destinatários.
theological_decisions:
- issue: Explicitar ou não o sentido favorável de Deus voltar-se para o povo
  choice: Manter “Eu me voltarei para vocês” no texto principal
  alternative: “Olharei com favor para vocês”
  rationale: O contexto indica favor, mas o verbo hebraico conserva a imagem de voltar-se para alguém. A tradução evita transformar a implicação contextual no significado lexical explícito.
- issue: Sentido de וַהֲקִימֹתִי aplicado a uma aliança já existente
  choice: “confirmarei a minha aliança”
  alternative: “estabelecerei a minha aliança”
  rationale: Como o discurso se dirige ao povo que já vive sob a aliança, “confirmarei” se ajusta bem ao sentido de fazer permanecer ou cumprir. A alternativa “estabelecerei” também é lexicalmente possível.
- issue: Preservação da fórmula de fecundidade e multiplicação
  choice: “os tornarei fecundos e numerosos”
  alternative: “farei com que vocês deem muitos descendentes e se multipliquem”
  rationale: A formulação escolhida conserva a linguagem tradicional de bênção sem restringi-la por explicação excessiva a uma leitura apenas demográfica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A estrutura foi levemente ajustada para evitar o pouco natural “multiplicarei vocês”, sem perder o paralelismo hebraico.
