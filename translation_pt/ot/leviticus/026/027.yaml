  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: pt
  text: Mas se, apesar disso, vocês não me ouvirem[a] e andarem em oposição a mim[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não me obedecerem». O verbo hebraico também envolve a ideia de atender ao que se ouve.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «andarem comigo em oposição». O termo traduzido por «oposição» é difícil e também pode indicar hostilidade ou resistência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma nova etapa condicional e adversativa na sequência das advertências da aliança.
- source_word: בְּזֹאת
  choice: apesar disso
  rationale: 'No contexto, retoma as medidas disciplinares anteriores com valor concessivo: mesmo depois de tudo isso.'
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: vocês não me ouvirem
  rationale: Preserva a imagem auditiva de שׁמע, que aqui também implica dar atenção e obedecer.
- source_word: וַהֲלַכְתֶּם
  choice: continuarem a andar
  rationale: O verbo descreve figuradamente a conduta; «continuarem» expressa naturalmente a persistência prevista nesta etapa progressiva da advertência.
- source_word: עִמִּי בְּקֶרִי
  choice: em oposição a mim
  rationale: Traduz o sentido relacional da expressão inteira, sem reproduzir de modo obscuro o hebraico literal «comigo em oposição/hostilidade».
theological_decisions:
- issue: Expressão de oposição na advertência da aliança
  choice: continuarem a andar em oposição a mim
  alternative: agirem com hostilidade contra mim
  rationale: Mantém a metáfora de «andar» e a dimensão relacional da ruptura da aliança, sem reduzir a expressão a mera desobediência nem determinar em excesso o difícil termo קֶרִי.
translation_notes:
  register: Português moderno, claro e digno, com plural «vocês» de ampla legibilidade brasileira. A formulação conserva a metáfora bíblica de andar como modo de viver, esclarecendo a relação de oposição sem eliminar a ambiguidade lexical de קֶרִי.
