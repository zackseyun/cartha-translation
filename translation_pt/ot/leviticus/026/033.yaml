  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: pt
  text: Eu os espalharei entre as nações e desembainharei a espada em perseguição a vocês.[a] A terra de vocês ficará desolada, e as suas cidades ficarão em ruínas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “esvaziarei a espada atrás de vocês”, expressão idiomática para tirar a espada da bainha e persegui-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָרֶה
  choice: espalharei
  rationale: O hifil de זרה expressa dispersar ou espalhar. “Espalharei” é natural em português e preserva a imagem do juízo da aliança.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa nações ou povos; aqui se refere aos povos estrangeiros entre os quais Israel seria disperso. “Nações” evita conotações posteriores associadas a “gentios”.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: desembainharei a espada
  rationale: A expressão idiomática descreve o ato de tirar a espada da bainha para usá-la. “Desembainharei” conserva a imagem militar concreta e é claro em português.
- source_word: אַחֲרֵיכֶם
  choice: atrás de vocês
  rationale: A expressão significa literalmente “atrás de vocês” e, neste contexto, sugere perseguição hostil. A formulação preserva tanto a imagem espacial quanto sua força contextual.
- source_word: שְׁמָמָה
  choice: desolada
  rationale: Embora o hebraico use um substantivo, o adjetivo predicativo produz uma frase mais natural em português e comunica com precisão o estado de devastação.
- source_word: חָרְבָּה
  choice: em ruínas
  rationale: O termo indica um estado de ruína ou devastação. “Ficarão em ruínas” é idiomático em português quando se refere a cidades.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: ficará ... ficarão
  rationale: 'Neste contexto, היה tem sentido resultativo: a terra e as cidades passarão a um estado de desolação e ruína.'
theological_decisions:
- issue: Atribuição direta a Deus do juízo da aliança, incluindo dispersão e perseguição militar
  choice: 'Manter a ação divina explícita na primeira pessoa: “Eu os espalharei” e “desembainharei”'
  alternative: Empregar construções passivas ou impessoais que atenuem a agência divina
  rationale: O hebraico atribui diretamente a Deus essas sanções da aliança. A tradução preserva essa força teológica sem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Vocês” representa o plural de segunda pessoa do hebraico. A ordem das ações e a linguagem solene de juízo foram preservadas.
