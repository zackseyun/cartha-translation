id: LEV.26.1
reference: Leviticus 26:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: pt
  text: Não façam ídolos para vocês, nem ergam para vocês uma imagem esculpida ou uma coluna de pedra. Não coloquem em sua terra uma pedra com figuras[a] para se prostrarem diante dela, pois eu sou Yahweh[b], o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedra esculpida” ou “pedra com uma imagem”. O sentido exato da expressão hebraica אֶבֶן מַשְׂכִּית é discutido, mas ela se refere a um objeto de pedra associado ao culto proibido.
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH; tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: ídolos
  rationale: É a forma moderna e direta de designar objetos de culto falso; o possível tom pejorativo de inutilidade não precisa ser explicitado no texto principal.
- source_word: פֶסֶל
  choice: imagem esculpida
  rationale: Preserva a ideia concreta de uma imagem produzida por entalhe ou escultura e mantém este termo distinto dos demais objetos cultuais enumerados.
- source_word: מַצֵּבָה
  choice: coluna de pedra
  rationale: Expressa de modo claro e natural um monumento ou pilar erguido, sem acrescentar ao substantivo a qualificação interpretativa de 'sagrada'.
- source_word: אֶבֶן מַשְׂכִּית
  choice: pedra com figuras
  rationale: Comunica uma pedra que apresenta figura ou representação e evita confundi-la com a 'imagem esculpida' anterior; como a nuance exata é discutida, outras possibilidades são registradas em nota.
- source_word: תַעֲשׂוּ לָכֶם
  choice: façam ídolos para vocês
  rationale: Mantém tanto o verbo 'fazer' quanto a força reflexiva-benefactiva de לָכֶם em ordem natural no português.
- source_word: תָקִימוּ לָכֶם
  choice: ergam para vocês
  rationale: O hifil de קום indica levantar ou instalar objetos; 'ergam' combina naturalmente com imagem e coluna.
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: coloquem em sua terra
  rationale: נתן com indicação de lugar assume aqui o sentido de colocar; 'em sua terra' preserva o contexto territorial da aliança.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: para se prostrarem diante dela
  rationale: O infinitivo indica finalidade. 'Prostrar-se diante dela' preserva o gesto corporal e seu sentido cultual, sem impor a leitura menos provável de adorar sobre a pedra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título tradicional.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: pois eu sou Yahweh, o Deus de vocês
  rationale: כִּי fundamenta as proibições; 'pois' conserva essa relação, e a aposição com artigo é idiomática em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal da aliança, enquanto a nota informa a substituição tradicional por um título.
- issue: Distinção entre os objetos cultuais proibidos
  choice: ídolos, imagem esculpida, coluna de pedra e pedra com figuras
  alternative: Reunir todos sob termos genéricos como 'ídolos' ou 'imagens'
  rationale: A sequência hebraica emprega termos diferentes. Mantê-los distintos respeita a especificidade jurídica e cultual do texto sem acrescentar uma classificação denominacional.
- issue: Referente de עָלֶיהָ
  choice: diante dela, referindo-se à pedra
  alternative: sobre ela
  rationale: A preposição pode suscitar discussão, mas no contexto a leitura mais provável é que a pedra seja o objeto diante do qual a pessoa se prostra. A formulação não amplia o texto para uma teoria específica do culto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “para vocês” preserva a ênfase do hebraico sem tornar a frase excessivamente rígida. “Prostrarem” mantém o gesto cultual concreto e permanece amplamente compreensível.
