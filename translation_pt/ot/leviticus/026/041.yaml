- from: Eu também agirei contra eles e os levarei para a terra dos seus inimigos. Ou então, o coração incircunciso deles se humilhará[a], e eles aceitarão a punição pela sua iniquidade[b].
  to: Eu também andarei contra eles e os levarei à terra dos seus inimigos. Ou então, o coração incircunciso deles será humilhado[a], e então aceitarão a punição pela sua iniquidade[b].
  rationale: A revisão retém a imagem de «andar» presente na fórmula hebraica recorrente, restabelece o segundo «então» e torna a primeira nota mais exata, sem eliminar a ambiguidade sintática de «Ou então» nem impor uma interpretação doutrinária à expressão sobre a iniquidade.
