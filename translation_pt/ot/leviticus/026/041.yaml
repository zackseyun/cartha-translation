base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: pt
  text: Eu também andarei contra eles e os levarei à terra dos seus inimigos. Ou então, o coração incircunciso deles será humilhado[a], e então aceitarão a punição pela sua iniquidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se humilhará”. “Coração incircunciso” é uma metáfora da aliança para obstinação e impureza interiores.
    reason: lexical_alternative
  - marker: b
    text: Ou “repararão sua iniquidade” ou “sua iniquidade será paga”. O idioma hebraico se refere a aceitar ou suportar a consequência devida da culpa.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Eu também
  rationale: Preserva a ênfase e a reciprocidade da ação divina em português natural.
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: agirei contra eles
  rationale: Comunica a oposição ou hostilidade expressa pela fórmula recorrente do capítulo sem reproduzir de modo artificial o hebraísmo 'andarei'.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: e os levarei para a terra dos seus inimigos
  rationale: Expressa naturalmente o sentido causativo de בוא e conserva o cenário de exílio.
- source_word: אוֹ אָז
  choice: Ou então
  rationale: Mantém a força disjuntiva da expressão hebraica difícil, sem resolver sua relação sintática de maneira indevida.
- source_word: יִכָּנַע
  choice: se humilhará
  rationale: No contexto de 'coração', a forma reflexiva comunica humilhação interior; a nota registra a alternativa passiva formal.
- source_word: לְבָבָם הֶעָרֵל
  choice: o coração incircunciso deles
  rationale: Conserva a metáfora pactual explícita e suas conexões com outras passagens bíblicas.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: e eles aceitarão a punição pela sua iniquidade
  rationale: Torna inteligível o idioma judicial, indicando que suportam ou aceitam a consequência de sua culpa, sem sugerir expiação meritória.
theological_decisions:
- issue: Metáfora de הֶעָרֵל aplicada ao coração
  choice: Manter 'coração incircunciso'
  alternative: coração obstinado; coração impenitente
  rationale: A metáfora pactual tem peso próprio e vínculos intertextuais que seriam apagados por uma paráfrase interpretativa.
- issue: Sentido de יִרְצוּ אֶת עֲוֺנָם
  choice: aceitarão a punição pela sua iniquidade
  alternative: repararão sua iniquidade; sua iniquidade será paga
  rationale: A expressão aponta para aceitar ou suportar a consequência devida da culpa, sem importar categorias doutrinárias posteriores.
- issue: Voz e nuance de יִכָּנַע
  choice: se humilhará
  alternative: será humilhado
  rationale: Com o coração como sujeito, a formulação reflexiva soa natural e pode indicar contrição; a alternativa passiva permanece possível e é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva a difícil disjunção 'Ou então' e a metáfora 'coração incircunciso', ao mesmo tempo que verte o hebraísmo verbal de modo natural.
