  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: pt
  text: Caminharei no meio de vocês[a], serei o Deus de vocês, e vocês serão o meu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “andarei entre vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: Caminharei
  rationale: O hitpael de הלך expressa aqui movimento e presença contínua entre o povo. “Caminharei” preserva a imagem concreta do hebraico sem substituí-la pela interpretação mais ampla “habitarei”.
- source_word: בְּתוֹכְכֶם
  choice: no meio de vocês
  rationale: A expressão indica presença no meio da comunidade. Esta formulação é natural em português e evita a possível leitura de interioridade individual sugerida por “dentro de vocês”.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: serei o Deus de vocês
  rationale: Esta é uma fórmula de aliança. A construção possessiva comunica de modo idiomático a relação expressa por היה + ל, mantendo a referência definida ao Deus de Israel.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: e vocês serão o meu povo
  rationale: A formulação preserva a reciprocidade da fórmula da aliança e é mais natural em português do que a versão formal “serão para mim um povo”.
theological_decisions:
- issue: Tradução da fórmula da aliança
  choice: serei o Deus de vocês, e vocês serão o meu povo
  alternative: serei Deus para vocês, e vocês serão para mim um povo
  rationale: A opção escolhida conserva a relação recíproca estabelecida no hebraico, com linguagem portuguesa natural, sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” representa o plural hebraico e “no meio de vocês” preserva a presença comunitária indicada pelo original.
