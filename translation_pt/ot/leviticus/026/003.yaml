  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: pt
  text: Se vocês andarem nos meus estatutos[a], guardarem os meus mandamentos e os cumprirem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «viverem de acordo com os meus estatutos». O hebraico diz literalmente «andarem nos meus estatutos», expressão da aliança que significa orientar a vida de acordo com eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz explicitamente a condição da formulação da aliança; «se» preserva essa força melhor que «quando».
- source_word: בְּחֻקֹּתַי
  choice: nos meus estatutos
  rationale: חֻקּוֹת designa prescrições ou estatutos. Com הלך, a preposição ב integra a expressão «andar nos», isto é, orientar a conduta de acordo com eles.
- source_word: תֵּלֵכוּ
  choice: andarem
  rationale: הלך significa literalmente «andar» e, neste contexto da aliança, descreve a maneira de viver. A escolha conserva a metáfora hebraica sem impedir a compreensão.
- source_word: מִצְוֺתַי
  choice: os meus mandamentos
  rationale: מִצְוָה significa mandamento ou ordem; «mandamentos» mantém o registro jurídico da passagem.
- source_word: תִּשְׁמְרוּ
  choice: guardarem
  rationale: שׁמר, aplicado a mandamentos, significa observá-los fielmente. «Guardar» é corrente no português bíblico e mantém a nuance de cuidado obediente.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: e os cumprirem
  rationale: A expressão indica pôr os mandamentos em prática. «Cumprir» soa mais natural em português com «mandamentos» que a reprodução rígida «fazê-los», preservando a ênfase na execução.
theological_decisions:
- issue: Metáfora da obediência à aliança
  choice: Conservar «andarem nos meus estatutos»
  alternative: viverem de acordo com os meus estatutos; seguirem os meus estatutos
  rationale: A formulação mantém a metáfora hebraica de ordenar toda a vida segundo os estatutos divinos, sem reduzir a obediência a um ato isolado. A nota esclarece o sentido idiomático sem resolver ou apagar a imagem do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a metáfora bíblica «andar nos estatutos» e a estrutura condicional, deixando a oração aberta porque o versículo introduz as consequências apresentadas a seguir.
