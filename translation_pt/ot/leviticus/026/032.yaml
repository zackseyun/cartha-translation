  source_fidelity: A tradução preserva adequadamente o hifil enfático de וַהֲשִׁמֹּתִי (“Eu mesmo devastarei”), o referente contextual de הָאָרֶץ como “a terra”, e a reação de espanto/horror expressa por וְשָׁמְמוּ. A coordenação por “e” reflete o וְ hebraico sem acrescentar uma relação de finalidade ou resultado. “Diante dela” comunica de modo aceitável a relação de reação à terra devastada indicada por עָלֶיהָ.
