id: LEV.26.32
reference: Leviticus 26:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: pt
  text: Eu mesmo devastarei a terra, e os inimigos de vocês que nela morarem ficarão estarrecidos[a] diante dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficarão espantados” ou “ficarão horrorizados”. O verbo hebraico pode expressar espanto acompanhado de horror diante da devastação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: devastarei
  rationale: 'O hifil de שׁמם tem sentido causativo: tornar desolado, devastar. “Devastarei” expressa essa ação de modo claro, forte e natural em português.'
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome independente, além da pessoa já indicada pelo verbo, acrescenta ênfase; “Eu mesmo” preserva essa força.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto das maldições da aliança, refere-se à terra em que Israel habita, não necessariamente ao mundo inteiro. “A terra” é natural em português e preserva o alcance contextual.
- source_word: וְשָׁמְמוּ
  choice: ficarão estarrecidos
  rationale: No qal, שׁמם pode descrever espanto ou horror diante de uma devastação. Como o sujeito são os inimigos que passam a morar na terra, “ficarão estarrecidos” comunica a reação deles sem sugerir que eles próprios serão devastados.
- source_word: עָלֶיהָ
  choice: diante dela
  rationale: Com שׁמם, עַל assinala aquilo que provoca o espanto. “Diante dela” apresenta a terra devastada como a realidade que causa essa reação.
- source_word: אֹיְבֵיכֶם
  choice: os inimigos de vocês
  rationale: Reproduz diretamente o substantivo com o sufixo possessivo plural e mantém ampla legibilidade em português.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: que nela morarem
  rationale: O particípio de ישׁב indica residir ou habitar. A construção portuguesa no futuro do subjuntivo encaixa-se naturalmente no anúncio profético dos inimigos que vierem a morar ali.
theological_decisions:
- issue: Referente de הָאָרֶץ no contexto do juízo da aliança
  choice: a terra, isto é, a terra de Israel/Canaã no contexto
  alternative: a Terra, entendida como o mundo inteiro
  rationale: O contexto imediato trata das maldições da aliança sobre a terra habitada por Israel. A tradução evita universalizar um juízo cujo âmbito contextual é essa terra.
- issue: Sentido de וְשָׁמְמוּ aplicado aos inimigos
  choice: reação de espanto horrorizado diante da devastação
  alternative: os próprios inimigos ficarão desolados
  rationale: O sujeito é formado pelos inimigos que moram na terra devastada; nesse contexto, o verbo descreve de modo mais coerente a reação deles ao estado da terra, embora sua amplitude lexical seja indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eu mesmo” conserva a ênfase do hebraico; “morarem” é mais corrente que “habitarem”, e “estarrecidos” comunica tanto o choque quanto o horror sem eliminar a ambiguidade lexical, registrada na nota.
