  text: וְ/נָתַתִּ֤י פָנַ/י֙ בָּ/כֶ֔ם וְ/נִגַּפְתֶּ֖ם לִ/פְנֵ֣י אֹיְבֵי/כֶ֑ם וְ/רָד֤וּ בָ/כֶם֙ שֹֽׂנְאֵי/כֶ֔ם וְ/נַסְתֶּ֖ם וְ/אֵין רֹדֵ֥ף אֶתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: pt
  text: Porei o meu rosto contra vocês[a], e vocês serão derrotados diante dos seus inimigos. Os que odeiam vocês dominarão vocês, e vocês fugirão sem que ninguém os persiga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica que indica oposição determinada em juízo.
    reason: cultural_note
  - marker: b
    text: 'Ou: «vocês fugirão, embora ninguém os persiga».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּכֶם
  choice: Voltarei o meu rosto contra vocês
  rationale: Mantém a imagem hebraica da face de Deus dirigida contra o povo, expressão de oposição pessoal e determinada em juízo. Em português, «voltar o rosto contra» comunica o sentido com naturalidade sem reduzir a imagem a «opor-me».
- source_word: וְנִגַּפְתֶּם
  choice: vocês serão derrotados
  rationale: O nifal de נגף, neste contexto militar, indica sofrer derrota ou ser abatido. «Serão derrotados» é claro e natural; «serão abatidos» preservaria maior vivacidade, mas poderia sugerir exclusivamente morte.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: diante dos seus inimigos
  rationale: Representa diretamente a expressão espacial e militar hebraica, indicando derrota perante os inimigos.
- source_word: וְרָדוּ בָכֶם
  choice: dominarão sobre vocês
  rationale: רדה denota exercer domínio ou governar. No contexto da maldição, «dominarão sobre» expressa subjugação hostil sem acrescentar a ideia mais específica de tirania.
- source_word: שֹׂנְאֵיכֶם
  choice: Os que odeiam vocês
  rationale: Preserva o valor participial e mantém a distinção lexical em relação a אֹיְבֵיכֶם, «seus inimigos», na oração anterior.
- source_word: וְנַסְתֶּם
  choice: vocês fugirão
  rationale: נוס é o verbo comum para fugir e se ajusta naturalmente ao cenário de terror e derrota.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: sem que ninguém os persiga
  rationale: Expressa de modo natural a ausência de qualquer perseguidor real. A relação pode ser entendida circunstancialmente ou concessivamente; a formulação portuguesa evita decidir de modo excessivo entre «quando» e «embora».
theological_decisions:
- issue: Linguagem antropomórfica do juízo divino
  choice: Conservar a imagem «Voltarei o meu rosto contra vocês»
  alternative: Eu me oporei a vocês
  rationale: A imagem hebraica apresenta a oposição de Deus como pessoal e relacional dentro da aliança. Conservá-la mantém a força literária e teológica do original.
- issue: Natureza do domínio inimigo na maldição
  choice: dominarão sobre vocês
  alternative: governarão vocês; tiranizarão vocês
  rationale: O texto afirma a sujeição do povo aos que o odeiam, mas não especifica neste verbo toda a intensidade ou crueldade desse domínio. «Dominarão» transmite a força contextual sem importar um detalhe não expresso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para o plural e conserva a imagem concreta do rosto divino. A pontuação divide as consequências do juízo em duas frases para maior clareza.
