revisions:
- from: Voltarei o meu rosto contra vocês[a], e vocês serão derrotados diante dos seus inimigos. Os que odeiam vocês dominarão sobre vocês, e vocês fugirão sem que ninguém os persiga.[b]
  to: Porei o meu rosto contra vocês[a], e vocês serão derrotados diante dos seus inimigos. Os que odeiam vocês dominarão vocês, e vocês fugirão sem que ninguém os persiga.[b]
  rationale: A revisão substitui «Voltarei» por «Porei», reproduzindo com maior precisão o verbo hebraico e evitando uma possível leitura contrária ao sentido. Também ajusta «dominarão sobre vocês» para «dominarão vocês», mais natural em português contemporâneo, sem alterar o sentido de sujeição hostil. As notas preservam a explicação do idiomatismo e a alternativa concessiva para a oração final.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T21:56:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite adequadamente as quatro consequências: oposição divina, derrota diante dos inimigos, sujeição aos que odeiam o povo e fuga sem perseguidor. Contudo, «Voltarei o meu rosto contra vocês» pode sugerir que Deus desvia o rosto ou retorna o rosto, enquanto o hebraico idiomático וְנָתַתִּי פָנַי בָּכֶם significa literalmente «porei/fixarei o meu rosto contra vocês».'
  naturalness: O registro é claro e moderno. «Dominarão sobre vocês», porém, é menos natural no português atual do que «dominarão vocês»; a revisão também mantém a concordância regular com «vocês».
  terminology: «Rosto», «derrotados», «inimigos», «os que odeiam vocês» e «fugirão» são escolhas apropriadas. «Porei o meu rosto contra vocês» conserva a imagem antropomórfica hebraica sem transformá-la em uma interpretação abstrata.
  issues:
  - severity: medium
    issue: «Voltarei o meu rosto contra vocês»
    rationale: A formulação pode ser entendida como afastar ou desviar o rosto. «Porei o meu rosto contra vocês» corresponde mais diretamente ao verbo נתן («pôr») e preserva o idiomatismo de oposição deliberada.
  - severity: low
    issue: «dominarão sobre vocês»
    rationale: Embora compreensível, a construção é menos idiomática no português moderno. «Dominarão vocês» exprime o mesmo domínio/subjugação de רדה com maior naturalidade.
