base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: pt
  text: Destruirei os seus lugares altos e derrubarei os seus altares de incenso[a]; porei os seus cadáveres sobre os cadáveres dos seus ídolos[b], e a minha alma terá repulsa por vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus pilares solares”. O termo hebraico designa objetos de culto associados à adoração ilícita; sua forma e função exatas são discutidas.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa “cadáveres” tanto para as pessoas como para os ídolos, ressaltando que os ídolos são inertes e estão entregues à desonra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁמַדְתִּי
  choice: Destruirei
  rationale: O hifil de שׁמד expressa destruição causada; “destruirei” é forte, natural e adequado aos objetos de culto mencionados.
- source_word: בָּמֹתֵיכֶם
  choice: os seus lugares altos
  rationale: במות designa com frequência locais elevados de culto. “Lugares altos” é uma expressão bíblica reconhecível e preserva a referência espacial e cultual.
- source_word: וְהִכְרַתִּי
  choice: derrubarei
  rationale: כרת significa literalmente cortar ou eliminar. Diante de instalações cultuais, “derrubarei” comunica de modo natural a ação física sem repetir simplesmente “destruirei”.
- source_word: חַמָּנֵיכֶם
  choice: os seus altares de incenso
  rationale: חמנים designa objetos cultuais cuja forma e função exatas são discutidas, talvez ligados ao culto solar ou ao incenso. A opção funcional é clara no texto, e a incerteza é registrada em nota.
- source_word: וְנָתַתִּי
  choice: porei
  rationale: נתן pode significar dar, pôr ou colocar; “porei” é direto e idiomático com a preposição “sobre”.
- source_word: פִּגְרֵיכֶם
  choice: os seus cadáveres
  rationale: פגר refere-se a cadáver ou carcaça. “Cadáveres” é apropriado para os mortos humanos e mantém a severidade da sentença.
- source_word: עַל
  choice: sobre
  rationale: A preposição indica colocação física de uma coisa por cima de outra; “sobre” é o equivalente português natural.
- source_word: פִּגְרֵי גִּלּוּלֵיכֶם
  choice: os cadáveres dos seus ídolos
  rationale: A repetição de פגר aplica a mesma designação aos mortos e aos ídolos, retratando estes como objetos mortos e desonrados; repetir “cadáveres” preserva esse efeito.
- source_word: גִּלּוּלֵיכֶם
  choice: seus ídolos
  rationale: גלולים é um termo fortemente depreciativo para ídolos. “Ídolos” oferece máxima clareza, enquanto o contexto e a nota preservam sua carga de desprezo.
- source_word: וְגָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: e a minha alma terá repulsa por vocês
  rationale: A formulação mantém נַפְשִׁי, “minha alma”, e traduz געלה com uma expressão portuguesa natural e intensa, sem reduzir a construção a um simples “eu rejeitarei vocês”.
theological_decisions:
- issue: Expressão antropopática da repulsa divina
  choice: a minha alma terá repulsa por vocês
  alternative: eu terei repulsa por vocês
  rationale: A tradução conserva a referência explícita à “minha alma”, mantendo a intensidade antropopática e a tensão teológica da formulação hebraica em vez de a simplificar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação verbal direta preserva o ritmo solene da sentença. “A minha alma” foi mantido deliberadamente, apesar de não ser a formulação cotidiana mais comum, para conservar a imagem e a tensão do original.
