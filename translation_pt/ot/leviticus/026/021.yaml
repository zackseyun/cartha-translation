  naturalness: 'A redação proposta substitui a sequência pouco idiomática "aumentarei sete vezes os golpes contra vocês" por uma construção clara e moderna: "acrescentarei sobre vocês golpes sete vezes maiores". "Conforme os seus pecados" preserva de modo natural a ideia de correspondência expressa por כְּ.'
