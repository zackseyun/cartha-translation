  text: וְ/אִם תֵּֽלְכ֤וּ עִמִּ/י֙ קֶ֔רִי וְ/לֹ֥א תֹאב֖וּ לִ/שְׁמֹ֣עַֽ לִ֑/י וְ/יָסַפְתִּ֤י עֲלֵי/כֶם֙ מַכָּ֔ה שֶׁ֖בַע כְּ/חַטֹּאתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: pt
  text: E, se vocês andarem em oposição a mim[a] e não quiserem me ouvir, acrescentarei sobre vocês golpes sete vezes maiores, conforme os seus pecados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “andarem com hostilidade contra mim”. A expressão hebraica é difícil e indica aqui uma postura de oposição, não mero acaso.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “acrescentarei sobre vocês um castigo sete vezes maior, de acordo com os seus pecados”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: em oposição
  rationale: Neste capítulo, o termo ocorre na expressão idiomática de “andar” com Deus em qeri e indica uma postura de resistência ou hostilidade. “Em oposição” comunica esse sentido sem sugerir mero acaso.
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: andarem em oposição a mim
  rationale: “Andar” é mantido como metáfora de conduta, enquanto “em oposição a mim” torna compreensível a difícil expressão hebraica.
- source_word: תֹאבוּ
  choice: não quiserem
  rationale: O verbo expressa falta de disposição ou consentimento, e não apenas ausência de ação.
- source_word: לִשְׁמֹעַ לִי
  choice: me ouvir
  rationale: Preserva o sentido lexical de ouvir ou escutar, deixando implícita, como no hebraico, a dimensão de obedecer.
- source_word: וְיָסַפְתִּי
  choice: aumentarei
  rationale: O verbo significa acrescentar ou aumentar. No contexto da intensificação progressiva das sanções, “aumentarei” transmite naturalmente a ideia de juízo adicional.
- source_word: מַכָּה
  choice: os golpes
  rationale: O substantivo pode designar golpe, ferida ou praga. “Golpes” mantém sua amplitude e o caráter punitivo sem restringi-lo a uma enfermidade.
- source_word: שֶׁבַע
  choice: sete vezes
  rationale: O numeral tem valor adverbial ou intensificador na fórmula repetida deste capítulo.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: de acordo com os seus pecados
  rationale: A preposição כ indica correspondência ou proporção, nuance mais bem preservada por “de acordo com” do que por uma formulação apenas causal.
theological_decisions:
- issue: Natureza da fórmula de punição da aliança
  choice: Apresentar o juízo como intensificado e correspondente aos pecados do povo, sem especificar um mecanismo particular.
  alternative: Traduzir מַכָּה especificamente como “praga” ou entender כְּחַטֹּאתֵיכֶם apenas como “por causa dos seus pecados”.
  rationale: O contexto anuncia sanções progressivas da aliança. A tradução preserva tanto a intensificação quanto a correspondência com os pecados, sem limitar o castigo a uma forma não exigida pelo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês”. Mantém-se a metáfora bíblica de “andar” para a conduta, esclarecida pela expressão natural “em oposição”. A construção da segunda metade prioriza legibilidade sem ocultar a dificuldade sintática do hebraico, registrada em nota.
