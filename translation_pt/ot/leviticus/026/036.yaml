  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: pt
  text: Quanto aos que restarem de vocês, porei fraqueza no coração deles nas terras dos seus inimigos. O som de uma folha levada pelo vento[a] os perseguirá; eles fugirão como quem foge da espada e cairão sem que ninguém os persiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o som de uma folha impelida”.'
    reason: Alternativa lexical que preserva mais estritamente a forma passiva de נִדָּף sem explicitar o vento como agente.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: os que restarem de vocês
  rationale: Expressa o particípio como o grupo que permanecerá depois do juízo e preserva a referência direta ao povo indicada por בָּכֶם.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: porei fraqueza no coração deles
  rationale: O hifil de בוא tem sentido causativo, enquanto מֹרֶךְ indica perda de coragem ou debilidade interior. Esta formulação comunica a ação divina sem restringir o termo a simples medo.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: nas terras dos seus inimigos
  rationale: Mantém o plural hebraico e o cenário de dispersão em territórios inimigos.
- source_word: קוֹל עָלֶה נִדָּף
  choice: o som de uma folha levada pelo vento
  rationale: קוֹל é 'som', עָלֶה é 'folha' e נִדָּף descreve algo impelido ou soprado. A expressão é clara em português; a nota registra uma alternativa mais formal, sem agente explícito.
- source_word: וְרָדַף אֹתָם
  choice: os perseguirá
  rationale: Preserva a personificação irônica do som como perseguidor.
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: eles fugirão como quem foge da espada
  rationale: Torna natural em português a construção de modo, mantendo a comparação com a fuga diante da espada.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: cairão sem que ninguém os persiga
  rationale: Conserva a concisão e a ambiguidade de נפל, além de destacar o contraste de que não existe perseguidor real.
theological_decisions:
- issue: Natureza do juízo descrito
  choice: terror e colapso da coragem provocados por Deus no exílio
  alternative: mera perseguição militar externa ou simples inquietação metafórica
  rationale: O texto atribui explicitamente a Deus a debilidade interior e retrata uma fuga irracional causada por um ruído insignificante. A tradução preserva tanto a agência divina quanto a dimensão psicológica, sem acrescentar categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação em duas frases torna clara a progressão do juízo sem alterar as relações do hebraico.
