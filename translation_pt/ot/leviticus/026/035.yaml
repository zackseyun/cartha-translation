  text: כָּל יְמֵ֥י הָשַּׁמָּ֖/ה תִּשְׁבֹּ֑ת אֵ֣ת אֲשֶׁ֧ר לֹֽא שָׁבְתָ֛ה בְּ/שַׁבְּתֹתֵי/כֶ֖ם בְּ/שִׁבְתְּ/כֶ֥ם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: pt
  text: Durante todos os dias de sua desolação, ela descansará — o descanso que não teve durante os sábados de vocês[a], enquanto vocês habitavam nela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “os sábados de vocês” se refere aos descansos sabáticos devidos à terra, especialmente aos anos sabáticos no contexto próximo.
    reason: cross_reference
  - marker: b
    text: 'Mais literalmente: “ela descansará aquilo que não descansou durante os sábados de vocês”. O hebraico repete o verbo “descansar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: Durante todos os dias de sua desolação
  rationale: Preserva a expressão temporal abrangente e explicita que a desolação pertence à terra, referente feminino no contexto.
- source_word: תִּשְׁבֹּת
  choice: ela descansará
  rationale: Traduz diretamente o verbo שׁבת e mantém a terra como sujeito feminino, em linguagem natural.
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: o descanso que não teve
  rationale: Torna idiomática em português a construção hebraica difícil, retendo a repetição conceitual do verbo 'descansar' sem lhe impor uma interpretação adicional.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: durante os sábados de vocês
  rationale: Mantém a forma plural e o possessivo do hebraico; uma nota esclarece que, neste contexto, se trata dos descansos sabáticos devidos à terra.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: enquanto vocês habitavam nela
  rationale: Expressa naturalmente a circunstância temporal da residência de Israel sobre a terra e conserva o referente feminino.
theological_decisions:
- issue: Sentido de 'os sábados de vocês'
  choice: Manter a expressão literal no texto e explicar seu referente contextual em nota
  alternative: Traduzir diretamente como 'anos sabáticos' ou 'descansos sabáticos da terra'
  rationale: O hebraico diz literalmente 'seus sábados'; o contexto imediato aponta para os repousos da terra, sobretudo os anos sabáticos, mas o texto principal não deve eliminar a forma nem estreitar silenciosamente sua referência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome feminino “ela” e “nela” retoma “a terra” no contexto. A ordem das notas acompanha sua ocorrência e função no texto.
