  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: pt
  text: então darei a vocês as chuvas no tempo certo[a]; a terra dará a sua produção, e as árvores do campo[b] darão os seus frutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na época própria” ou “no devido tempo”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “a árvore do campo” no singular, com sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: darei
  rationale: Verte diretamente o verbo comum נתן, preservando a promessa divina e a repetição de “dar” ao longo do versículo.
- source_word: גִשְׁמֵיכֶם
  choice: a vocês as chuvas
  rationale: O plural “chuvas” reflete a forma hebraica e o padrão sazonal de precipitação; “a vocês” expressa de modo natural que elas são concedidas em benefício de Israel.
- source_word: בְּעִתָּם
  choice: no tempo certo
  rationale: Expressa o momento apropriado das chuvas em português atual, sem restringir a referência a uma única estação.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: a terra dará
  rationale: Mantém tanto “terra” no contexto agrícola e pactual quanto a repetição deliberada do verbo נתן.
- source_word: יְבוּלָהּ
  choice: a sua produção
  rationale: “Produção” abrange o rendimento agrícola da terra sem especificar indevidamente apenas cereais ou alguma cultura particular.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: as árvores do campo
  rationale: O singular hebraico tem sentido coletivo; o plural é a forma mais natural em português para representar o conjunto das árvores, com a forma original registrada em nota.
- source_word: יִתֵּן פִּרְיוֹ
  choice: darão os seus frutos
  rationale: Preserva o verbo “dar” e ajusta número e posse ao plural coletivo natural em português.
theological_decisions:
- issue: Linguagem de bênção da aliança ligada à produtividade agrícola
  choice: Apresentar diretamente a promessa de chuvas oportunas e fertilidade da terra.
  alternative: Generalizar como promessa universal de prosperidade material ou espiritualizar a linguagem agrícola.
  rationale: O contexto imediato trata de chuva e produção agrícola concretas como bênçãos da aliança; a tradução não deve acrescentar aplicações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “a vocês” evita o possessivo potencialmente ambíguo “suas chuvas”; o plural “árvores” comunica naturalmente o singular coletivo hebraico.
