  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: pt
  text: Mas, se confessarem a sua iniquidade e a iniquidade de seus pais, na infidelidade com que foram infiéis contra mim[a], e também que procederam com hostilidade contra mim[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “na traição com que agiram traiçoeiramente contra mim”. O hebraico emprega um substantivo e um verbo da mesma raiz para enfatizar a quebra de fidelidade: literalmente, “na infidelidade com que foram infiéis contra mim”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “andaram em oposição a mim”. A expressão hebraica usa um termo difícil, repetido neste capítulo, que indica conduta contrária ou hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Mas, se confessarem
  rationale: O hitpael de ידה significa “confessar”. No fluxo condicional iniciado no contexto anterior, “se confessarem” é natural em português; “mas” expressa a transição adversativa contextual sem transformar o versículo numa frase independente.
- source_word: עֲוֺנָם
  choice: a sua iniquidade
  rationale: עָוֹן pode indicar iniquidade, culpa ou consequência da culpa. Aqui designa a conduta culpável que deve ser confessada; “iniquidade” conserva seu peso moral.
- source_word: עֲוֺן אֲבֹתָם
  choice: a iniquidade de seus pais
  rationale: Reproduz diretamente a cadeia construta e mantém a dimensão corporativa e ancestral explícita no hebraico.
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: bem como a infidelidade que cometeram contra mim
  rationale: מַעַל e o verbo cognato descrevem quebra de fidelidade, especialmente no âmbito da aliança. “Infidelidade” comunica essa dimensão; “cometeram” evita uma repetição pouco natural em português, enquanto a nota registra a figura etimológica hebraica.
- source_word: וְאַף
  choice: e também
  rationale: Acrescenta outro aspecto a ser reconhecido ou confessado, sem intensificação excessiva.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: procederam com hostilidade contra mim
  rationale: הלך descreve aqui a maneira de agir, e o difícil קֶרִי indica conduta antagônica ou contrária. “Procederam com hostilidade” é idiomático e preserva a força relacional da oposição.
theological_decisions:
- issue: Confissão corporativa que inclui a iniquidade ancestral
  choice: Manter “a iniquidade de seus pais” no texto principal.
  alternative: “os pecados de seus antepassados” ou uma formulação que limite a referência às consequências desses pecados.
  rationale: O hebraico inclui expressamente a iniquidade dos pais ao lado da iniquidade dos confessantes. A tradução preserva essa dimensão corporativa da aliança sem explicar ou resolver sua relação com a responsabilidade individual.
- issue: Natureza da ofensa contra Deus
  choice: Traduzir מַעַל como “infidelidade” e קֶרִי como “hostilidade”.
  alternative: “transgressão” e “oposição/contrariedade”.
  rationale: 'A combinação mantém distintos os dois conceitos: quebra de fidelidade para com Deus e conduta hostil contra ele, sem reduzir ambos a um termo genérico como “pecado”.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Seus pais” mantém a referência masculina ancestral do hebraico. “Procederam” traduz idiomaticamente o uso figurado de “andar”. A vírgula final conserva o fato de que o período sintático continua no versículo 41.
