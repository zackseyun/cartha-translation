source:
  edition: WLC
  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: pt
  text: Cinco de vocês perseguirão cem[a], e cem de vocês perseguirão dez mil[b]; os seus inimigos cairão diante de vocês pela espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir “irão no encalço de”; o mesmo vale para a segunda ocorrência de “perseguirão”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode significar “dez mil” ou “uma miríade”; aqui, “dez mil” se ajusta ao paralelismo numérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: perseguirão
  rationale: O verbo רדף significa perseguir ou ir no encalço. “Perseguir” é natural em português e preserva o sentido militar nas duas orações.
- source_word: מִכֶּם
  choice: de vocês
  rationale: 'A preposição מן com o sufixo tem sentido partitivo: cinco e cem dentre o povo referido.'
- source_word: חֲמִשָּׁה מֵאָה
  choice: Cinco de vocês perseguirão cem
  rationale: Mantém diretamente os números e a desproporção expressa pelo hebraico.
- source_word: רְבָבָה
  choice: dez mil
  rationale: Embora possa designar uma multidão ou miríade, aqui o valor numérico concreto se ajusta ao paralelismo crescente com cem.
- source_word: וְנָפְלוּ
  choice: cairão
  rationale: Preserva a imagem literal de נפל, que no contexto de guerra comunica derrota e morte sem explicitação adicional.
- source_word: אֹיְבֵיכֶם
  choice: os seus inimigos
  rationale: Equivalente corrente e preciso para אֹיֵב com o sufixo de segunda pessoa plural.
- source_word: לִפְנֵיכֶם
  choice: diante de vocês
  rationale: Reproduz a expressão hebraica de derrota na presença ou perante o povo.
- source_word: לֶחָרֶב
  choice: pela espada
  rationale: Expressa idiomaticamente o instrumento de queda em combate e conserva a imagem marcial.
theological_decisions:
- issue: 'Promessa militar da bênção da aliança: hipérbole ou quantidade literal'
  choice: Manter a promessa militar concreta e os números do texto sem decidir se são hiperbólicos.
  alternative: Generalizar como mera garantia de vitória ou interpretar explicitamente os números como literais ou figurados.
  rationale: O contexto apresenta bênçãos da aliança e promete vitória desproporcional. A tradução deve preservar tanto a concretude quanto a possível força retórica, sem resolver uma questão que o verso não explica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a estrutura paralela, a imagem da espada e a segunda pessoa plural explícita por meio de “vocês”.
