  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: pt
  text: Guardem os meus sábados e reverenciem o meu santuário.[a] Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “temam o meu santuário” ou “tenham temor reverente diante do meu santuário”. O verbo hebraico pode expressar temor, reverência ou profundo respeito, conforme o contexto.
    reason: alternativa lexical
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: os meus sábados
  rationale: Mantém o plural hebraico, que pode abranger o conjunto dos tempos sabáticos sagrados, e emprega uma expressão natural em português.
- source_word: תִּשְׁמֹרוּ
  choice: Guardem
  rationale: No contexto de mandamentos e tempos sagrados, שׁמר comunica observar com cuidado e fidelidade. “Guardem” preserva essa força pactual sem perder clareza.
- source_word: וּמִקְדָּשִׁי
  choice: o meu santuário
  rationale: מִקְדָּשׁ designa o lugar santo consagrado à presença de Deus; “santuário” é o equivalente cultual corrente e preciso.
- source_word: תִּירָאוּ
  choice: reverenciem
  rationale: ירא pode expressar temor, reverência ou assombro. Aqui, “reverenciem” comunica a atitude de profundo respeito exigida diante do santuário, enquanto a nota preserva a amplitude lexical.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Reproduz a fórmula enfática de autoidentificação e conserva o nome divino expresso pelo Tetragrama.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” conserva o nome pessoal pactual em vez de substituí-lo por um título.
- issue: Sentido de ירא em relação ao santuário
  choice: reverenciem
  alternative: temam; fiquem admirados diante de
  rationale: O contexto requer santo respeito pelo santuário. “Reverenciem” é natural e evita reduzir a ordem ao medo, enquanto a nota registra os outros matizes legítimos.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na terceira pessoa do plural, de ampla legibilidade brasileira. O marcador da nota foi colocado imediatamente após a expressão a que se refere.
