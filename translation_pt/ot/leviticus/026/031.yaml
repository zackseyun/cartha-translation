revisions:
- from: Farei das suas cidades um lugar em ruínas e devastarei os seus santuários; não aspirarei o aroma agradável das suas ofertas.[a]
  to: Farei das suas cidades ruínas e devastarei os seus santuários; não sentirei o aroma agradável das suas ofertas.[a]
  rationale: A revisão elimina uma construção pouco natural com “um lugar” aplicado a várias cidades e substitui “aspirarei” por “sentirei”, que representa melhor o verbo hebraico no português atual. Mantêm-se o tom solene, os termos cultuais, a pluralidade dos santuários e a linguagem sensorial, sem converter a cláusula em uma paráfrase interpretativa de rejeição sacrificial.
