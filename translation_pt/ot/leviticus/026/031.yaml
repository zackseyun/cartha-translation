source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: pt
  text: Farei das suas cidades ruínas e devastarei os seus santuários; não sentirei o aroma agradável das suas ofertas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não sentirei o seu aroma agradável”. A expressão é uma fórmula sacrificial que indica a aceitação divina; “das suas ofertas” foi acrescentado para esclarecer o referente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־עָרֵיכֶם חָרְבָּה
  choice: Farei das suas cidades um lugar em ruínas
  rationale: 'נתן, com o objeto “suas cidades” e o predicativo חָרְבָּה, tem sentido causativo: fazer com que as cidades fiquem arruinadas. A formulação é natural em português e preserva a força da construção hebraica.'
- source_word: וַהֲשִׁמּוֹתִי
  choice: e devastarei
  rationale: O hifil de שמם expressa a ação de tornar desolado. “Devastarei” comunica isso com clareza e vigor em português atual.
- source_word: מִקְדְּשֵׁיכֶם
  choice: os seus santuários
  rationale: O plural de מִקְדָּשׁ designa lugares sagrados ou santuários. Mantém-se o plural e o sentido cultual específico.
- source_word: וְלֹא אָרִיחַ
  choice: não aspirarei
  rationale: O verbo ריח significa literalmente sentir ou aspirar um cheiro. “Aspirarei” conserva a imagem antropomórfica e soa mais deliberado e cultual do que a simples formulação “sentirei o cheiro”.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: o aroma agradável das suas ofertas
  rationale: רֵיחַ נִיחוֹחַ é uma expressão sacrificial consagrada, aqui vertida como “aroma agradável”. “Das suas ofertas” explicita o referente cultual implícito no contexto, evitando que “seu aroma agradável” pareça descrever o odor das próprias pessoas.
theological_decisions:
- issue: Traduzir a cláusula final como linguagem sensorial literal ou como rejeição interpretativa dos sacrifícios
  choice: 'Conservar a imagem: “não aspirarei o aroma agradável das suas ofertas”'
  alternative: “não aceitarei as suas ofertas” ou “não terei prazer nos seus sacrifícios”
  rationale: O hebraico emprega explicitamente o verbo “cheirar/aspirar” e a fórmula sacrificial “aroma agradável”. Preservar essa linguagem mantém a textura cultual e a antropomorfia do texto sem reduzir a frase à sua consequência interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A colocação de “suas” evita formas excessivamente regionais; “santuários” conserva o registro cultual. O ponto e vírgula evidencia a progressão entre a devastação dos lugares e a rejeição das ofertas.
