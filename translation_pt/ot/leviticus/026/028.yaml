  yaml_path: translation/ot/leviticus/026/028.yaml
  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: pt
  text: Então também andarei contra vocês com furor de hostilidade[a], e eu mesmo os disciplinarei[b] sete vezes por causa dos seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “andarei com vocês no furor da oposição”. O sentido exato de קֶרִי é incerto; tradicionalmente, “andarei em sentido contrário a vocês com furor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os castigarei sete vezes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי עִמָּכֶם
  choice: andarei contra vocês
  rationale: Preserva a imagem hebraica de “andar”, enquanto “contra” comunica o sentido adversativo que a expressão assume neste contexto de maldições da aliança.
- source_word: בַּחֲמַת קֶרִי
  choice: com hostilidade furiosa
  rationale: חֵמָה expressa furor ou ira, e קֶרִי é um termo difícil e recorrente neste capítulo, com o sentido aproximado de oposição, contrariedade ou hostilidade. A formulação escolhida é clara em português sem apagar a intensidade.
- source_word: וְיִסַּרְתִּי
  choice: os disciplinarei
  rationale: O verbo יסר pode envolver correção, castigo ou disciplina. “Disciplinarei” mantém essa amplitude melhor do que uma formulação exclusivamente retributiva.
- source_word: אַף אֲנִי
  choice: também ... eu mesmo
  rationale: Reproduz tanto a ideia adicional de אַף quanto a ênfase explícita em אֲנִי.
- source_word: שֶׁבַע
  choice: sete vezes
  rationale: O numeral funciona adverbialmente, indicando intensificação. “Sete vezes” é natural e mantém a forma concreta do hebraico.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: por causa dos seus pecados
  rationale: עַל indica aqui o fundamento ou a causa da disciplina.
theological_decisions:
- issue: Natureza da resposta divina na maldição da aliança
  choice: Manter tanto a oposição relacional quanto a linguagem de disciplina.
  alternative: Traduzir toda a resposta apenas em termos de punição, ou atenuar a oposição como simples desagrado.
  rationale: O hebraico reúne a imagem adversativa de Deus andar em relação a Israel e o verbo יסר, que pode denotar disciplina ou correção. A tradução preserva essa tensão sem impor uma leitura exclusivamente punitiva ou excessivamente branda.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem de “andar” foi mantida por sua importância na fórmula repetida ao longo de Levítico 26.
