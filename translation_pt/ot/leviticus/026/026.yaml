base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: pt
  text: Quando eu quebrar o suprimento de pão de vocês[a], dez mulheres assarão o pão de vocês num só forno e o devolverão por peso. Vocês comerão, mas não ficarão satisfeitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o cajado de pão”, um idiomatismo para o suprimento de pão que sustenta a vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: Quando eu quebrar
  rationale: O infinitivo construto com בְּ introduz uma oração temporal. “Quebrar” preserva a imagem vívida do juízo sem sugerir que o pão seja literalmente despedaçado.
- source_word: מַטֵּה לֶחֶם
  choice: o sustento do pão de vocês
  rationale: A expressão significa literalmente “cajado do pão” e retrata o pão como aquilo que sustenta a vida. “Sustento do pão” conserva parte da metáfora e comunica a ideia de provisão essencial; a forma literal aparece na nota.
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: dez mulheres assarão
  rationale: Mantém o sujeito feminino explicitamente presente no hebraico e expressa o valor futuro da sequência de juízo.
- source_word: בְּתַנּוּר אֶחָד
  choice: num só forno
  rationale: 'Formulação natural que ressalta a extrema escassez: o pão de dez famílias poderá ser assado em apenas um forno.'
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: e o devolverão por peso
  rationale: O hifil de שׁוב indica trazer ou devolver, e בַּמִּשְׁקָל descreve a entrega de porções pesadas, sinal de racionamento.
- source_word: וְלֹא תִשְׂבָּעוּ
  choice: mas não ficarão satisfeitos
  rationale: שׂבע descreve ficar saciado depois de comer. A tradução é natural em português e mantém a ênfase na fome que não é aliviada.
