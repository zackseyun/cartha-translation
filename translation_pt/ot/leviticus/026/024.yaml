  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: pt
  text: então também eu andarei em oposição a vocês[a] e eu mesmo os ferirei sete vezes[b] por causa dos seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com hostilidade para com vocês”. O termo hebraico traduzido como “em oposição” repete-se em Levítico 26 para descrever a oposição recíproca entre Israel e o SENHOR.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sete vezes por seus pecados”. A expressão hebraica também comunica a intensidade da punição no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הָלַכְתִּי
  choice: então ... andarei
  rationale: Mantém o sentido concreto de הלך, “andar”, e preserva o idioma recorrente no capítulo; “então” expressa naturalmente em português a progressão condicional das advertências.
- source_word: אַף אֲנִי
  choice: também eu
  rationale: Conserva a ênfase e a reciprocidade da resposta divina, com uma ordem de palavras natural e enfática em português.
- source_word: עִמָּ/כֶם בְּ/קֶרִי
  choice: em oposição a vocês
  rationale: קרי é um termo-chave repetido em Levítico 26 e descreve uma postura contrária ou hostil. A formulação preserva a reciprocidade do texto sem reduzir o termo a um estado emocional.
- source_word: וְ/הִכֵּיתִי
  choice: e ... ferirei
  rationale: נכה designa o ato de ferir ou golpear. “Ferirei” mantém a força punitiva da ação e evita uma paráfrase interpretativa como “castigarei”.
- source_word: גַּם אָ֔נִי
  choice: eu mesmo
  rationale: Torna explícita a ênfase da segunda referência divina, destacando que o próprio SENHOR executará o juízo.
- source_word: שֶׁבַע
  choice: sete vezes
  rationale: Reproduz a expressão hebraica elíptica e sua intensidade retórica sem decidir além do texto se o número deve ser entendido de maneira estritamente aritmética.
- source_word: עַל חַטֹּאתֵי/כֶם
  choice: por causa dos seus pecados
  rationale: 'Expressa claramente o valor causal de עַל: os pecados são a razão do juízo.'
theological_decisions:
- issue: O idioma de reciprocidade pactual expresso por בְּקֶרִי
  choice: em oposição a vocês
  alternative: com hostilidade para com vocês
  rationale: “Em oposição” preserva a relação literária entre a conduta de Israel e a resposta do SENHOR sem interpretar o termo apenas como hostilidade emocional.
- issue: A intensidade da fórmula de punição שֶׁבַע
  choice: sete vezes
  alternative: sete vezes mais
  rationale: A tradução mantém a formulação numérica e a intensidade da advertência, mas evita acrescentar o comparativo “mais”, que não está expresso no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem “também eu” e a repetição “eu mesmo” preservam a ênfase hebraica. O verbo “andar” foi mantido por sua função literária recorrente no capítulo, apesar de a expressão ser menos comum na fala cotidiana.
