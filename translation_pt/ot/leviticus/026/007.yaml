base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/007.yaml
  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: pt
  text: Vocês perseguirão os seus inimigos, e eles cairão diante de vocês pela espada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cairão diante de vocês à espada”. A expressão hebraica admite mais de uma formulação idiomática em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: Vocês perseguirão
  rationale: O verbo רדף significa normalmente “perseguir”. O futuro expressa com naturalidade, em português, a promessa no contexto da aliança.
- source_word: אֹיְבֵיכֶם
  choice: os seus inimigos
  rationale: אויב é o termo comum para “inimigo”, e o sufixo de segunda pessoa plural é representado por “seus”.
- source_word: וְנָפְלוּ
  choice: e eles cairão
  rationale: נפל significa literalmente “cair”. Em contexto de batalha, pode implicar derrota ou morte, mas “cairão” preserva a imagem hebraica.
- source_word: לִפְנֵיכֶם
  choice: diante de vocês
  rationale: לפני com o sufixo significa idiomaticamente “diante de” ou “na presença de”; aqui, “diante de vocês” é claro e natural.
- source_word: לֶחָרֶב
  choice: pela espada
  rationale: Neste contexto militar, לְ com חרב pode indicar meio ou resultado. “Pela espada” comunica que cairão em combate sem eliminar a concisão do hebraico.
