  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: pt
  text: E, se, apesar dessas coisas, vocês não se deixarem corrigir por mim, mas andarem em oposição a mim[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “andarem em hostilidade contra mim”. Literalmente, “andarem comigo em qeri”. O raro termo hebraico qeri pode indicar oposição, hostilidade ou obstinação.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: mesmo com essas coisas
  rationale: A preposição בְּ tem sentido instrumental e remete aos castigos já mencionados. “Com essas coisas” mantém essa ligação; “mesmo” explicita naturalmente, em português, a persistência apesar delas.
- source_word: תִוָּסְרוּ לִי
  choice: não se deixarem corrigir por mim
  rationale: O nifal de יסר indica receber disciplina ou correção. A construção pronominal “se deixarem corrigir” preserva a ideia de que os castigos ocorreram, mas não produziram a resposta pretendida; “por mim” expressa de modo natural a relação indicada por לִי.
- source_word: וַהֲלַכְתֶּם
  choice: mas andarem
  rationale: O verbo הלך significa literalmente “andar” e, aqui, descreve a conduta contínua. “Mas” comunica o contraste contextual entre receber correção e persistir numa postura hostil.
- source_word: עִמִּי קֶרִי
  choice: andarem em hostilidade contra mim
  rationale: A expressão combina “comigo” com o substantivo raro קֶרִי, que neste capítulo indica oposição ou hostilidade. A formulação portuguesa conserva a metáfora de andar e torna clara a direção relacional da hostilidade.
theological_decisions:
- issue: Sentido da expressão pactual עִמִּי קֶרִי
  choice: andarem em hostilidade contra mim
  alternative: andarem em oposição a mim; procederem com obstinação diante de mim
  rationale: A expressão retrata uma postura relacional de antagonismo para com o SENHOR, não apenas uma infração isolada. Como קֶרִי é raro e seu matiz exato é discutido, a tradução adota “hostilidade” no texto e registra alternativas na nota sem reduzir a tensão a uma categoria teológica posterior.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural “vocês”, amplamente compreensível no Brasil e no contexto internacional. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
