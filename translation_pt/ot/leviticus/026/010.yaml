  text: וַ/אֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְ/יָשָׁ֕ן מִ/פְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: pt
  text: Vocês comerão das provisões antigas, guardadas por muito tempo[a], e retirarão as antigas por causa das novas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Vocês comerão do antigo, há muito guardado, e retirarão o antigo por causa do novo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Vocês comerão
  rationale: O perfeito qal com waw, na sequência das bênçãos da aliança, tem sentido futuro. “Vocês” oferece leitura natural e amplamente compreensível em português.
- source_word: יָשָׁן
  choice: provisões antigas
  rationale: O adjetivo é empregado substantivamente e se refere ao produto armazenado de safras anteriores. “Provisões” torna explícito o referente implícito sem restringi-lo a cereais.
- source_word: נוֹשָׁן
  choice: guardadas por muito tempo
  rationale: A forma reforça a antiguidade das provisões; esta expressão comunica armazenamento prolongado sem a conotação negativa de alimento estragado.
- source_word: וְיָשָׁן
  choice: as antigas
  rationale: A segunda ocorrência também é substantivada e retoma naturalmente “provisões antigas”, evitando repetição pesada.
- source_word: מִפְּנֵי
  choice: por causa das
  rationale: 'A locução indica causa ou deslocamento: as provisões antigas são retiradas diante da chegada das novas. A formulação preserva a relação expressa pelo hebraico sem acrescentar explicitamente “para dar lugar”.'
- source_word: חָדָשׁ
  choice: novas
  rationale: O adjetivo substantivado se refere às provisões da nova safra; a concordância com “provisões” torna isso claro em português.
- source_word: תּוֹצִיאוּ
  choice: retirarão
  rationale: O hifil de יצא significa fazer sair, trazer para fora ou retirar. “Retirarão” é natural no contexto e preserva melhor a amplitude do verbo do que uma paráfrase como “esvaziarão”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e uso de “vocês” para o plural. A tradução explicita o alimento armazenado como “provisões”, mas a nota preserva a construção substantivada e compacta do hebraico. O marcador [a] aparece no texto principal.
