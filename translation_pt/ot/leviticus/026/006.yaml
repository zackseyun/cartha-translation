id: LEV.26.6
reference: Leviticus 26:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: pt
  text: Darei paz na terra, e vocês se deitarão sem que ninguém os faça temer. Farei desaparecer da terra os animais perigosos[a], e a espada[b] não passará pela terra de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “animais ferozes”. A expressão hebraica se refere a animais que representam perigo na terra.
    reason: lexical_alternative
  - marker: b
    text: “A espada” é uma figura hebraica para guerra ou invasão armada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Darei
  rationale: Traduz diretamente o sentido comum de נתן e apresenta a paz como bênção concedida por Deus.
- source_word: שָׁלוֹם
  choice: paz
  rationale: Neste contexto de bênçãos da aliança, abrange segurança e bem-estar, sem reduzir o sentido a uma experiência apenas interior.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Preserva a referência territorial concreta à terra da aliança.
- source_word: וּשְׁכַבְתֶּם
  choice: vocês se deitarão
  rationale: Mantém a imagem concreta de repousar em segurança, sem restringi-la necessariamente ao sono.
- source_word: וְאֵין מַחֲרִיד
  choice: sem que ninguém os faça temer
  rationale: 'Expressa de modo natural em português a força causativa do particípio: não haverá quem lhes cause medo.'
- source_word: וְהִשְׁבַּתִּי
  choice: Farei desaparecer
  rationale: O hifil de שׁבת significa fazer cessar; no contexto, a formulação comunica que os animais ameaçadores deixarão de estar presentes na terra.
- source_word: חַיָּה רָעָה
  choice: animais perigosos
  rationale: חַיָּה designa animais, e רָעָה caracteriza aqui o perigo ou dano que causam, não uma maldade moral.
- source_word: מִן הָאָרֶץ
  choice: da terra
  rationale: Reproduz com clareza a ideia de remoção para fora do território.
- source_word: וְחֶרֶב
  choice: e a espada
  rationale: Conserva a imagem hebraica da espada, que neste contexto representa guerra ou invasão armada.
- source_word: לֹא תַעֲבֹר
  choice: não passará
  rationale: Tradução direta de עבר, adequada à imagem de uma força hostil atravessando o território.
- source_word: בְּאַרְצְכֶם
  choice: pela terra de vocês
  rationale: Mantém tanto a noção territorial quanto o sufixo possessivo dirigido ao povo de Israel.
theological_decisions:
- issue: Alcance da paz prometida
  choice: A promessa descreve segurança concreta na terra de Israel, incluindo descanso sem medo, ausência de animais perigosos e proteção contra invasão militar.
  alternative: Entender a paz como exclusivamente interior ou, no outro extremo, apenas política.
  rationale: Os elementos concretos do versículo apontam para uma bênção integral, mas materialmente situada; a tradução não espiritualiza nem estreita indevidamente a promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural dirigido ao povo e preserva as imagens concretas do hebraico. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
