base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: pt
  text: Mas, se vocês não me escutarem[a] e não cumprirem todos estes mandamentos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não me obedecerem”. O verbo hebraico pode indicar uma escuta obediente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: No contexto, a conjunção introduz contraste com as bênçãos anteriores e mantém a condição expressa por אִם.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: vocês não me escutarem
  rationale: Preserva a imagem hebraica de escutar o SENHOR sem reduzir de antemão seu sentido à obediência; a oração seguinte explicita o fazer.
- source_word: וְלֹא תַעֲשׂוּ
  choice: e não cumprirem
  rationale: Embora עשה signifique literalmente «fazer», «cumprir» é natural em português com «mandamentos» e expressa a execução prática exigida pelo contexto legal.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: todos estes mandamentos
  rationale: Reproduz a totalidade indicada por כָּל, o sentido jurídico-pactual de מִצְוֺת e o demonstrativo הָאֵלֶּה.
theological_decisions:
- issue: Se שׁמע ל deve ser traduzido como «escutar» ou interpretado diretamente como «obedecer»
  choice: escutarem
  alternative: obedecerem
  rationale: O hebraico fala literalmente em escutar e depois distingue essa ação de cumprir os mandamentos. A escolha conserva essa estrutura e sua tensão sem ocultar que a escuta implica obediência.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com «vocês» para marcar naturalmente a segunda pessoa do plural. A vírgula final conserva o caráter incompleto da prótase, cuja consequência aparece nos versículos seguintes.
