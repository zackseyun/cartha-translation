revisions:
- from: E acontecerá que, se vocês ouvirem atentamente os meus mandamentos que hoje lhes ordeno[a], amando Yahweh, seu Deus, e servindo-o de todo o coração e com todo o seu ser[b],
  to: E será que, se vocês de fato derem ouvidos aos meus mandamentos que hoje lhes ordeno[a], para amarem Yahweh, o Deus de vocês, e o servirem com todo o coração e com todo o ser de vocês[b],
  rationale: A revisão conserva a abertura condicional que continua no versículo seguinte e todos os elementos lexicais centrais, mas usa uma construção portuguesa mais natural para a escuta e restaura de modo mais claro a função dos infinitivos «amar» e «servir». As notas foram mantidas nos mesmos pontos sem introduzir uma leitura doutrinária.
