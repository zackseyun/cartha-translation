base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: pt
  text: E será que, se vocês de fato derem ouvidos aos meus mandamentos que hoje lhes ordeno[a], para amarem Yahweh, o Deus de vocês, e o servirem com todo o coração e com todo o ser de vocês[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica é intensiva: literalmente, «se de fato ouvirem». Neste contexto, também pode ter o sentido de ouvir com atenção obediente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «com toda a sua alma» ou «com toda a sua vida». O termo hebraico pode indicar a pessoa inteira, a vida ou o ser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: E acontecerá que, se
  rationale: Preserva o marcador discursivo e a abertura da condição que continua no versículo seguinte, sem tornar a frase excessivamente rígida.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: ouvirem atentamente
  rationale: A construção com infinitivo absoluto intensifica שמע. Em português, «ouvirem atentamente» conserva tanto a imagem da escuta quanto a ênfase; no contexto da aliança, essa escuta implica acolhimento obediente.
- source_word: אֶל מִצְוֺתַי
  choice: os meus mandamentos
  rationale: «Mandamentos» mantém o sentido de obrigações ordenadas no contexto da aliança.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: que hoje lhes ordeno
  rationale: Expressão natural em português que preserva o ato presente da ordem e a ênfase temporal de «hoje».
- source_word: לְאַהֲבָה
  choice: amando
  rationale: O gerúndio liga naturalmente o amor e o serviço ao conteúdo ou propósito da escuta obediente, sem eliminar a relação sintática possível entre os elementos.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, seu Deus
  rationale: Translitera o nome divino e preserva a designação relacional da aliança. «Seu» concorda naturalmente com o tratamento plural «vocês» no português brasileiro.
- source_word: וּלְעָבְדוֹ
  choice: e servindo-o
  rationale: «Servir» mantém a amplitude de עבד, que neste contexto abrange devoção, obediência e culto, sem reduzi-lo apenas a «adorar».
- source_word: בְּכָל לְבַבְכֶם
  choice: de todo o coração
  rationale: Equivalente idiomático e digno para a totalidade da vontade, do pensamento e das afeições.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: e com todo o seu ser
  rationale: נפש pode significar vida, pessoa ou ser vivente; «todo o seu ser» comunica melhor ao leitor moderno a integralidade da pessoa do que o termo potencialmente dualista «alma».
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio da aliança; «Yahweh» o representa diretamente, enquanto «SENHOR» é a substituição tradicional por um título.
- issue: Força semântica de שָׁמֹעַ תִּשְׁמְעוּ
  choice: ouvirem atentamente
  alternative: obedecerem fielmente
  rationale: A expressão intensiva envolve escuta com resposta obediente. A tradução principal conserva a metáfora auditiva, enquanto a nota explicita a dimensão de obediência.
- issue: Sentido de נפש
  choice: todo o seu ser
  alternative: toda a sua alma
  rationale: No hebraico bíblico, נפש frequentemente designa a vida ou a pessoa inteira. A escolha evita impor uma antropologia dualista, sem negar que «alma» seja uma tradução tradicional possível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O plural é expresso por «vocês/lhes/seu». A vírgula final sinaliza que a oração condicional continua no versículo 14.
