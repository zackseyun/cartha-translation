base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: pt
  text: Todo lugar em que a planta do pé de vocês pisar será de vocês; desde o deserto e o Líbano, desde o rio, o rio Eufrates, até o mar ocidental[a], será a fronteira de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o mar de trás” ou “o último mar”; tradicionalmente entendido como o mar Mediterrâneo, situado a oeste.
    reason: Preserva o sentido literal de הַיָּם הָאַחֲרוֹן e explica sua tradução geográfica.
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: Todo lugar
  rationale: Expressa naturalmente o sentido distributivo de cada lugar, sem transformar a frase em referência a uma única área total.
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: em que a planta do pé de vocês pisar
  rationale: Preserva a imagem concreta da planta do pé e traduz דרך pelo verbo corrente «pisar».
- source_word: לָכֶם יִהְיֶה
  choice: será de vocês
  rationale: Formulação possessiva clara e natural, que mantém o caráter de promessa.
- source_word: מִן הַמִּדְבָּר
  choice: desde o deserto
  rationale: «Deserto» é uma tradução corrente e amplamente compreensível de מִדְבָּר neste contexto geográfico.
- source_word: וְהַלְּבָנוֹן
  choice: e o Líbano
  rationale: Mantém a coordenação hebraica dos marcos geográficos, sem inserir uma preposição interpretativa ausente do texto.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: desde o rio, o rio Eufrates
  rationale: Conserva a designação genérica «o rio» seguida da identificação apositiva «o rio Eufrates».
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: até o mar ocidental[a]
  rationale: Traduz o valor geográfico de אַחֲרוֹן na orientação hebraica, preservando em nota seu sentido mais literal e a identificação tradicional.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: será o território de vocês
  rationale: Neste contexto, גְּבוּל pode designar não apenas a linha limítrofe, mas a extensão territorial delimitada; «território» evita a construção pouco natural de uma série de regiões ser «a fronteira».
theological_decisions:
- issue: Linguagem da promessa geográfica
  choice: Apresentar diretamente a promessa de posse e sua extensão territorial
  alternative: Defini-la como fronteira idealizada ou como posse perpétua e incondicional
  rationale: O versículo enuncia a promessa territorial, mas não resolve no próprio texto debates posteriores sobre seu cumprimento, duração ou tipologia.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O plural «vocês» torna explícito o destinatário coletivo indicado pelas formas hebraicas plurais. O ponto e vírgula separa a promessa geral da descrição de sua extensão.
