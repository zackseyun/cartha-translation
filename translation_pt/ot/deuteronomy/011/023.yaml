  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: pt
  text: então Yahweh expulsará da presença de vocês todas estas nações, e vocês desapossarão nações maiores e mais fortes do que vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: expulsará
  rationale: O hifil de ירשׁ tem sentido causativo de remover alguém de sua posse; “expulsará” é natural no contexto da conquista e mantém o contraste com o qal seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: todas estas nações
  rationale: Preserva o alcance de כָּל, o demonstrativo e o sentido político-étnico de גּוֹיִם neste contexto.
- source_word: מִלִּפְנֵיכֶם
  choice: da presença de vocês
  rationale: Expressa de modo claro a construção literalmente relacionada ao que está diante da face ou presença dos destinatários.
- source_word: וִירִשְׁתֶּם
  choice: vocês desapossarão
  rationale: Como o objeto direto são nações, e não a terra, “desapossarão” comunica que esses povos serão privados de sua posse; evita transformar o objeto em território não expresso.
- source_word: גְּדֹלִים וַעֲצֻמִים
  choice: maiores e mais fortes
  rationale: Os comparativos são explicitados naturalmente em português à luz de מִכֶּם; “mais fortes” é atual e claro para עֲצֻמִים.
- source_word: מִכֶּם
  choice: do que vocês
  rationale: Representa o uso comparativo de מִן com o sufixo da segunda pessoa do plural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Sentido de וִירִשְׁתֶּם com גּוֹיִם como objeto
  choice: vocês desapossarão nações
  alternative: vocês tomarão posse de nações
  rationale: A formulação preserva a tensão do texto de conquista e respeita o objeto humano/coletivo expresso, sem inserir “terra” como objeto implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e mantém a repetição de “nações” do hebraico. “Da presença de vocês” é ligeiramente formal, mas transparente e próxima da imagem da fonte.
