base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: pt
  text: uma terra de que Yahweh, seu Deus, cuida[a]; os olhos de Yahweh, seu Deus, estão continuamente sobre ela, desde o início do ano até o fim do ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “busca” ou “zela por”. O verbo hebraico pode indicar buscar, indagar ou cuidar; aqui transmite a atenção ativa de Yahweh para com a terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: terra
  rationale: No contexto de Deuteronômio, refere-se à terra ou território prometido, não ao planeta; “terra” é a opção natural e precisa em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a forma com sufixo de segunda pessoa masculina singular; “seu” é amplamente compreensível e natural no português internacional com legibilidade brasileira.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: cuida
  rationale: O verbo pode significar buscar, indagar ou ocupar-se de algo. Com a terra como objeto, “cuida” comunica a atenção ativa de Yahweh sem eliminar a amplitude lexical, registrada em nota.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Expressa constância ou continuidade e preserva o registro elevado, porém corrente, do texto.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: os olhos de Yahweh, seu Deus, estão continuamente sobre ela
  rationale: Mantém a imagem antropomórfica hebraica de vigilância e atenção. “Sobre ela” é idiomático em português nesse sentido.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: desde o início do ano até o fim do ano
  rationale: Comunica com clareza e naturalidade todo o período indicado pelos dois extremos temporais.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título nem adotar outra forma tradicional.
- issue: Imagem dos olhos de Deus sobre a terra
  choice: preservar literalmente a imagem
  alternative: parafrasear como “Yahweh a vigia” ou “está sempre atento a ela”
  rationale: A formulação hebraica atribui olhos a Yahweh como imagem de atenção contínua. Mantê-la conserva a força poética e não exige uma interpretação ontológica da linguagem figurada.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do hebraico sem rigidez artificial. A repetição de “Yahweh, seu Deus” e a imagem dos olhos foram preservadas. O marcador [a] foi colocado após a oração cuja expressão lexical ele esclarece.
