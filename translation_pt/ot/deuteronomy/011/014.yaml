  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: pt
  text: 'então darei chuva para a terra de vocês no tempo certo: a chuva do início da estação e a chuva do fim da estação[a]. E cada um de vocês recolherá seus cereais, seu vinho novo[b] e seu azeite[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir os dois termos como “chuva temporã e chuva serôdia”; referem-se às primeiras e às últimas chuvas do ciclo agrícola.
    reason: lexical_alternative
  - marker: b
    text: Isto é, vinho recém-produzido; ou simplesmente “vinho”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, azeite de oliva.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: então darei
  rationale: O perfeito qal na primeira pessoa, ligado por conjunção à condição anterior, expressa o resultado prometido; “então” torna clara essa relação sem enfraquecer a fala divina em primeira pessoa.
- source_word: מְטַר אַרְצְכֶם
  choice: chuva à terra de vocês
  rationale: A expressão descreve a chuva concedida para beneficiar o território agrícola de Israel. “Terra” preserva melhor o sentido contextual de אֶרֶץ do que “país”.
- source_word: בְּעִתּוֹ
  choice: no tempo certo
  rationale: Indica o tempo apropriado para a chuva. A formulação é natural em português e comunica a regularidade sazonal sem impor uma data específica.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: a chuva do início da estação e a chuva do fim da estação
  rationale: Os termos designam, respectivamente, as primeiras chuvas do ciclo agrícola e as chuvas posteriores. A tradução torna o contraste temporal inteligível sem depender dos termos tradicionais menos transparentes “temporã” e “serôdia”.
- source_word: וְאָסַפְתָּ
  choice: E você recolherá
  rationale: O verbo significa juntar ou recolher a produção. “Recolherá” preserva o sentido agrícola sem transformar o verbo explicitamente em “ceifará” ou “colherá”.
- source_word: דְגָנֶךָ
  choice: o seu cereal
  rationale: דָּגָן é um termo abrangente para a produção de grãos. “Cereal” é claro e evita associações regionais indevidas de outros termos.
- source_word: וְתִירֹשְׁךָ
  choice: o seu vinho novo
  rationale: תִּירוֹשׁ costuma indicar vinho recém-produzido ou produto fresco da uva; “vinho novo” conserva essa especificidade, enquanto a nota registra a alternativa mais geral.
- source_word: וְיִצְהָרֶךָ
  choice: o seu azeite
  rationale: No trio agrícola tradicional — cereal, vinho e יִצְהָר — o referente é o azeite de oliva. Em português, “azeite” exprime isso com naturalidade.
theological_decisions:
- issue: A bênção agrícola no contexto da aliança
  choice: Apresentar o versículo como promessa concreta de chuvas sazonais e produção agrícola para Israel na terra.
  alternative: Interpretar as chuvas principalmente como símbolos espirituais, sacramentais, escatológicos ou como promessa geral de prosperidade.
  rationale: O hebraico descreve diretamente a provisão agrícola ligada à aliança. A tradução não deve inserir aplicações teológicas posteriores no texto principal.
- issue: Alternância entre destinatário plural e singular
  choice: Preservar “a terra de vocês” e depois “você recolherá”.
  alternative: Uniformizar todo o versículo no plural ou no singular.
  rationale: O hebraico usa sufixo plural em אַרְצְכֶם e passa ao singular em וְאָסַפְתָּ e nos sufixos seguintes. Embora incomum em português, a alternância reflete o tratamento de Israel tanto como comunidade quanto como destinatário coletivo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Evitaram-se os termos tradicionais pouco transparentes “temporã” e “serôdia” no texto principal, mantendo-os em nota. A alternância de número do hebraico foi preservada deliberadamente.
