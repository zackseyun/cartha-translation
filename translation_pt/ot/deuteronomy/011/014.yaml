review_pass:
  verdict: revise
  source_fidelity: O texto transmite adequadamente a promessa divina de chuva sazonal e a consequente colheita. Contudo, “chuva à terra de vocês” é uma construção pouco natural para o hebraico מְטַר אַרְצְכֶם, que significa chuva dada em benefício da terra deles. A mudança hebraica do plural (“vossa terra”) para o singular (“tu recolherás”) é melhor comunicada em português por uma formulação distributiva explícita.
  naturalness: “Darei chuva para a terra de vocês” é mais idiomático do que “darei chuva à terra de vocês”. “Cada um de vocês recolherá” conserva com clareza a passagem do destinatário coletivo ao individual, sem a alternância abrupta e pouco natural entre “vocês” e “você”. “Cereais” é mais natural neste contexto agrícola do que “cereal”, que pode sugerir um alimento específico em português contemporâneo.
  terminology: “Chuva do início da estação” e “chuva do fim da estação” expressam de modo claro יוֹרֶה e מַלְקוֹשׁ; a nota preserva os termos tradicionais “temporã” e “serôdia”. “Vinho novo” traduz bem תִּירוֹשׁ, e “azeite” é o equivalente adequado de יִצְהָר no tríade agrícola.
  issues:
  - severity: medium
    issue: Construção “darei chuva à terra de vocês”
    rationale: Embora compreensível, “dar chuva a uma terra” soa pouco idiomático em português. “Darei chuva para a terra de vocês” preserva a relação de benefício expressa pelo hebraico e é mais natural.
  - severity: medium
    issue: Alternância direta entre “vocês” e “você”
    rationale: O singular hebraico após o plural deve ser levado a sério, mas a reprodução literal em português moderno soa como mudança indevida de interlocutor. “Cada um de vocês” comunica naturalmente o valor distributivo do singular.
  - severity: low
    issue: “O seu cereal”
    rationale: O singular coletivo é possível, mas “seus cereais” é mais idiomático em português atual para a produção de grãos e não altera o sentido abrangente de דָּגָן.
