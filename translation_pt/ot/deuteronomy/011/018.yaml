base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: pt
  text: Portanto, ponham estas minhas palavras no coração de vocês e na alma de vocês. Amarrem-nas como sinal sobre a mão de vocês, e elas serão como frontais[a] entre os olhos de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filactérios”. O termo hebraico é raro e sua nuance exata é incerta; mais tarde, foi associado a pequenos recipientes com trechos das Escrituras usados na prática judaica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: Portanto, ponham
  rationale: שׂים significa pôr ou colocar. “Ponham” conserva a imagem concreta e a força exortativa; “portanto” liga o versículo ao contexto anterior.
- source_word: דְּבָרַי אֵלֶּה
  choice: estas minhas palavras
  rationale: Mantém o demonstrativo e o sufixo possessivo de primeira pessoa em uma construção natural e enfática em português.
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: no coração e na alma de vocês
  rationale: “Coração” e “alma” preservam os termos e a linguagem antropológica do hebraico; a preposição “em” é a forma idiomática em português sem eliminar a imagem de interiorização.
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: Amarrem-nas
  rationale: קשׁר denota amarrar ou atar. O pronome retoma “palavras” e mantém aberta a possibilidade de sentido literal, simbólico ou ambos.
- source_word: לְאוֹת עַל יֶדְכֶם
  choice: como sinal na mão
  rationale: אוֹת é sinal, marca ou emblema; “como sinal” preserva a função simbólica, e “mão” traduz o sentido comum de יָד.
- source_word: וְהָיוּ
  choice: e elas serão
  rationale: Expressa a continuação da sequência instrutiva sem transformar a oração em uma ordem independente.
- source_word: לְטוֹטָפֹת
  choice: como frontais
  rationale: טוֹטָפֹת é um termo raro, associado a algo usado na parte frontal da cabeça. “Frontais” conserva a referência concreta e a incerteza lexical sem introduzir diretamente o nome da prática judaica posterior.
- source_word: בֵּין עֵינֵיכֶם
  choice: entre os olhos de vocês
  rationale: Segue literalmente a expressão hebraica e evita substituí-la pela interpretação “na testa”.
theological_decisions:
- issue: Caráter literal ou figurado de amarrar as palavras na mão e entre os olhos
  choice: Manter a linguagem física concreta sem determinar se a instrução é literal, figurada ou ambas.
  alternative: Explicitar apenas uma exortação figurada à memória e à prática, ou apresentar diretamente a prática ritual dos filactérios.
  rationale: O texto hebraico sustenta a imagem concreta, mas o próprio versículo não resolve sua aplicação. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural é expresso por “vocês”; a repetição de “de vocês” evita formas possessivas ambíguas. O marcador da nota foi colocado junto de “frontais”, termo ao qual a nota lexical efetivamente se refere.
