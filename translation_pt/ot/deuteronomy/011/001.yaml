  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: pt
  text: Portanto, ame Yahweh, seu Deus, e cumpra o que ele requer[a], seus estatutos, seus juízos[b] e seus mandamentos, todos os dias da sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ame Yahweh, seu Deus”. A conjunção hebraica também pode ser traduzida simplesmente por “e”; aqui foi entendida com valor de conclusão a partir do contexto anterior.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “suas ordenanças”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: Portanto, ame
  rationale: O verbo אָהַב significa “amar”. Embora a conjunção וְ possa ser traduzida simplesmente por “e”, aqui ela pode ter força conclusiva em relação ao contexto anterior; “portanto” expressa naturalmente essa ligação. O imperativo “ame” comunica em português a força normativa da forma hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: A forma construta com sufixo de segunda pessoa masculina singular expressa “seu Deus” e preserva a relação pactual.
- source_word: וְ/שָׁמַרְתָּ
  choice: e cumpra
  rationale: שׁמר pode significar guardar, observar ou cumprir. Diante da série de termos legais, “cumpra” é idiomático e comunica obediência contínua.
- source_word: מִשְׁמַרְתּוֹ
  choice: o que ele requer
  rationale: מִשְׁמֶרֶת designa uma incumbência, obrigação ou aquilo que deve ser guardado. “O que ele requer” é claro em português corrente sem perder o sentido.
- source_word: חֻקֹּתָיו
  choice: seus estatutos
  rationale: Mantém o caráter jurídico de חֻקּוֹת e sua distinção em relação aos demais termos legais da enumeração.
- source_word: וּמִשְׁפָּטָיו
  choice: seus juízos
  rationale: מִשְׁפָּטִים pode designar juízos, decisões legais ou ordenanças. “Juízos” preserva proximidade lexical e a distinção entre as categorias legais.
- source_word: וּמִצְוֺתָיו
  choice: seus mandamentos
  rationale: מִצְוָה é o termo usual para mandamento e se ajusta ao registro jurídico do versículo.
- source_word: כָּל הַיָּמִים
  choice: todos os dias da sua vida
  rationale: A expressão significa literalmente “todos os dias”. A formulação explicita de modo idiomático em português a duração vital indicada pelo contexto pessoal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o tetragrama. A transliteração preserva o nome pessoal do Deus de Israel sem substituí-lo por um título.
- issue: Força da conjunção inicial וְ
  choice: Portanto
  alternative: E
  rationale: O contexto permite entender a conjunção como inferencial, concluindo e aplicando o argumento anterior. Como o hebraico também admite a ligação simples, a alternativa é preservada em nota.
- issue: Nuance de מִשְׁפָּטָיו
  choice: seus juízos
  alternative: suas ordenanças
  rationale: “Juízos” mantém a distinção lexical dentro da sequência de termos legais, embora “ordenanças” também seja uma tradução possível sem alteração doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “seu/sua” para a segunda pessoa singular e preserva a enumeração jurídica do hebraico sem tornar a frase excessivamente técnica.
