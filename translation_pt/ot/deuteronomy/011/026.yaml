  text: רְאֵ֗ה אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּ֑וֹם בְּרָכָ֖ה וּ/קְלָלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: pt
  text: Vejam[a], hoje eu ponho diante de vocês uma bênção e uma maldição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz o imperativo no singular, dirigido a Israel como um todo; em português, o plural concorda naturalmente com «vocês» no restante da frase. Também se pode traduzir: «Veja».'
    reason: number_and_collective_address
lexical_decisions:
- source_word: רְאֵה
  choice: Vejam
  rationale: O imperativo hebraico está morfologicamente no singular, mas se dirige coletivamente a Israel, como mostra o plural em לִפְנֵיכֶם. Em português corrente, o plural explicita naturalmente os destinatários sem recorrer ao arcaico «eis». O verbo funciona discursivamente para chamar a atenção.
- source_word: אָנֹכִי
  choice: eu, expresso na forma verbal «ponho»
  rationale: O pronome independente dá algum destaque ao sujeito. Em português, a primeira pessoa já está marcada em «ponho»; acrescentar «eu mesmo» exageraria a ênfase, e explicitar «eu» tornaria a frase um pouco menos fluida.
- source_word: נֹתֵן
  choice: ponho
  rationale: נתן pode significar dar, pôr ou colocar. Com «diante de vocês», «ponho» reproduz de modo natural a apresentação das duas alternativas, mantendo o aspecto presente do particípio no contexto do discurso.
- source_word: לִפְנֵיכֶם
  choice: diante de vocês
  rationale: Equivalente idiomático atual de «perante/em frente de vocês», adequado à apresentação retórica das alternativas.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Tradução direta e natural do advérbio temporal, sem o tom mais tradicional de «neste dia».
- source_word: בְּרָכָה
  choice: uma bênção
  rationale: O substantivo singular sem artigo apresenta uma das duas alternativas; o artigo indefinido é natural em português.
- source_word: וּקְלָלָה
  choice: e uma maldição
  rationale: Mantém o paralelismo antitético com «uma bênção» e apresenta claramente a segunda alternativa.
theological_decisions:
- issue: Natureza da formulação de bênção e maldição
  choice: Apresentar bênção e maldição como alternativas colocadas diante de Israel, sem explicação doutrinária adicional.
  alternative: Interpretar a frase como um princípio moral geral de recompensa e punição.
  rationale: O versículo introduz alternativas da aliança no contexto de Deuteronômio. A tradução conserva essa apresentação formal sem ampliar o texto por meio de paráfrase interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» evita regionalismos e formas arcaicas. Os dois-pontos após o chamado inicial marcam com naturalidade a introdução solene das alternativas.
