source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: pt
  text: E saibam hoje que não estou falando com seus filhos, que não conheceram nem viram a disciplina de Yahweh, seu Deus[a], sua grandeza, sua mão forte[b] e seu braço estendido—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é elíptico; literalmente, “pois, não [a] seus filhos, que não conheceram nem viram...”. O sentido é que Moisés se dirige aos que haviam testemunhado os atos de Yahweh, em contraste com seus filhos.
    reason: alternative_reading
  - marker: b
    text: Ou “mão poderosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: E reconheçam
  rationale: O perfeito qal de segunda pessoa masculina plural, ligado pela conjunção, funciona no contexto como exortação. “Reconheçam” comunica não apenas conhecimento intelectual, mas a consideração consciente daquilo que os ouvintes vivenciaram.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Mantém de forma natural a referência temporal e a urgência do discurso de Moisés.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: que não estou falando com os seus filhos
  rationale: O hebraico é elíptico, literalmente “pois não os seus filhos”. A complementação explicita em português o contraste discursivo entre os ouvintes de Moisés e os filhos deles, sem alterar o conteúdo do contraste.
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: que não conheceram nem viram
  rationale: Os verbos descrevem a ausência de conhecimento por experiência e de testemunho ocular. “Nem” coordena naturalmente as duas negações em português.
- source_word: מוּסַר
  choice: disciplina
  rationale: O termo abrange formação, correção e disciplina. “Disciplina” preserva essa amplitude melhor que uma formulação limitada a castigo.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, o seu Deus
  rationale: Preserva o nome divino e expressa com clareza a relação pactual indicada pelo sufixo de segunda pessoa plural.
- source_word: גָּדְלוֹ
  choice: a sua grandeza
  rationale: Tradução direta que aponta para a grandeza de Yahweh manifestada em seus atos.
- source_word: יָדוֹ הַחֲזָקָה
  choice: a sua mão forte
  rationale: Reproduz de maneira transparente o adjetivo חֲזָקָה e mantém a imagem hebraica do poder divino em ação.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: e o seu braço estendido
  rationale: Mantém a conhecida imagem hebraica da atuação poderosa de Deus e soa natural em português bíblico contemporâneo.
theological_decisions:
- issue: Contraste elíptico com “seus filhos”
  choice: Explicitar a elipse como “não estou falando com os seus filhos”
  alternative: “pois não foram os seus filhos que conheceram e viram”
  rationale: O texto hebraico omite o elemento que rege “seus filhos”. A opção adotada torna inteligível em português o contraste entre a geração à qual Moisés se dirige e a geração seguinte, sem transformar a afirmação em uma alegação de que todos os ouvintes, sem exceção, presenciaram cada acontecimento.
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla legibilidade brasileira. O travessão final preserva a continuidade sintática com o versículo seguinte; os pronomes possessivos retomam Yahweh sem repetição pesada.
