base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: pt
  text: Pois a terra em que você está entrando para tomar posse dela não é como a terra do Egito, de onde vocês saíram, onde você semeava a sua semente e irrigava[a] com o pé[b], como uma horta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde você semeava a sua semente e regava com o pé”. As formas verbais provavelmente descrevem a prática habitual no Egito.'
    reason: lexical_alternative
  - marker: b
    text: “Com o pé” pode se referir a um mecanismo de irrigação acionado com o pé ou ao ato de abrir, fechar ou direcionar pequenos canais de água usando o pé.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ligada à exortação anterior e mantém a conexão discursiva de modo natural em português.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Preserva o termo geográfico e temático recorrente em Deuteronômio.
- source_word: בָא שָׁמָּה
  choice: está entrando
  rationale: Expressa o movimento iminente indicado pelo particípio, sem reproduzir de modo artificial o advérbio שָׁמָּה.
- source_word: לְרִשְׁתָּהּ
  choice: para tomar posse
  rationale: Comunica o sentido de ירשׁ neste contexto de ocupação da terra com mais naturalidade do que o simples verbo 'possuir'.
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: de onde vocês saíram
  rationale: Mantém o idioma do êxodo, 'sair do Egito', e preserva a mudança do singular para o plural presente no hebraico.
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ וְהִשְׁקִיתָ
  choice: onde você semeava a sua semente e a regava
  rationale: O imperfeito português expressa adequadamente a prática agrícola habitual evocada no contraste com a nova terra; 'semente' conserva a imagem concreta do hebraico.
- source_word: בְרַגְלְךָ
  choice: com o pé
  rationale: Mantém a imagem concreta e o singular do hebraico, deixando a explicação da prática de irrigação para a nota.
- source_word: כְּגַן הַיָּרָק
  choice: como uma horta
  rationale: '''Horta'' é uma expressão portuguesa natural e concisa para um terreno pequeno de verduras que exige irrigação cuidadosa.'
theological_decisions:
- issue: Idioma do êxodo no contexto da aliança
  choice: de onde vocês saíram
  alternative: que vocês deixaram
  rationale: A formulação preserva a linguagem característica do êxodo sem acrescentar interpretação teológica ao texto.
- issue: Alternância entre singular e plural na referência a Israel
  choice: você ... vocês ... você
  alternative: uniformizar tudo no plural
  rationale: A alternância reproduz uma característica real do discurso hebraico, no qual Israel é tratado tanto coletivamente no singular quanto como comunidade no plural.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'você/vocês' para conservar a alternância hebraica entre o singular coletivo e o plural, evitando o caráter regional ou excessivamente solene que 'tu/vós' teria para muitos leitores.
