base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: pt
  text: e a maldição, se vocês não ouvirem os mandamentos de Yahweh, seu Deus, e se desviarem do caminho que hoje ordeno a vocês, seguindo outros deuses que vocês não conheceram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se vocês não obedecerem aos mandamentos de Yahweh, seu Deus”. Em contextos de aliança, o verbo hebraico traduzido como “ouvir” frequentemente inclui a ideia de ouvir com obediência.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: e a maldição
  rationale: Mantém o substantivo definido e o paralelismo com “a bênção” do versículo anterior; “maldição” é o equivalente pactual natural em português.
- source_word: אִם לֹא תִשְׁמְעוּ אֶל
  choice: se vocês não ouvirem
  rationale: Preserva a construção condicional e o sentido básico de שׁמע com אֶל. No contexto da aliança, ouvir implica responder com obediência, nuance indicada em nota.
- source_word: מִצְוֺת
  choice: os mandamentos
  rationale: Termo corrente, claro e de peso adequado para as exigências da aliança.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, seu Deus
  rationale: Translitera diretamente o nome divino e traduz o sufixo plural por uma construção portuguesa natural dirigida ao grupo.
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: e se desviarem do caminho
  rationale: Conserva a metáfora de abandonar o caminho prescrito e coordena naturalmente a segunda condição com a primeira.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: que hoje ordeno a vocês
  rationale: Expressa a ação presente da fala de Moisés em português natural, mantendo a ênfase temporal de “hoje”.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: seguindo
  rationale: Comunica idiomaticamente a ideia de ir atrás de alguém em lealdade ou culto; evita a formulação pouco natural “ir após” sem perder o vínculo com o desvio do caminho.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Equivalente direto e tradicional da expressão deuteronômica.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: que vocês não conheceram
  rationale: Mantém o perfeito hebraico e a amplitude de “conhecer”, sem reduzi-lo a mero conhecimento intelectual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama como nome próprio; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Se שׁמע deve ser explicitado como obediência
  choice: ouvirem
  alternative: obedecerem
  rationale: A tradução principal preserva o sentido lexical de ouvir, enquanto o contexto da aliança permite a nuance de obediência sem torná-la a única leitura; a nota esclarece essa força pragmática.
- issue: Sentido de ידע em relação aos outros deuses
  choice: conheceram
  alternative: reconheceram; serviram
  rationale: “Conheceram” conserva a formulação aberta do hebraico, que pode envolver familiaridade ou relação, sem inserir no texto uma interpretação mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A sintaxe foi levemente ajustada para fluência, mantendo o paralelismo condicional, a metáfora do caminho e a ambiguidade significativa de “ouvir” e “conhecer”.
