id: DEU.11.31
reference: Deuteronomy 11:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: pt
  text: Pois vocês estão atravessando o Jordão para entrar e tomar posse da terra que Yahweh, o Deus de vocês, está dando a vocês[a]; vocês tomarão posse dela e habitarão nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação anterior e preserva naturalmente a força conectiva do hebraico.
- source_word: עֹבְרִים אֶת הַיַּרְדֵּן
  choice: estão atravessando o Jordão
  rationale: O particípio qal apresenta a ação como presente ou iminente; a formulação mantém essa vivacidade sem explicitar além do contexto.
- source_word: לָבֹא
  choice: para entrar
  rationale: Expressa a entrada na terra após a travessia do Jordão, de modo direto e natural em português.
- source_word: לָרֶשֶׁת / וִירִשְׁתֶּם אֹתָהּ
  choice: tomar posse / tomarão posse dela
  rationale: No contexto de Deuteronômio, ירשׁ indica adquirir e manter a posse da terra; a repetição conserva a correspondência lexical do versículo.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: É a designação contextual e tradicionalmente clara da terra prometida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Representa o substantivo em construção com o sufixo de segunda pessoa do plural e mantém ampla clareza no português internacional com legibilidade brasileira.
- source_word: נֹתֵן לָכֶם
  choice: está dando a vocês
  rationale: O particípio comunica uma dádiva apresentada como presente ou iminente.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: habitarão nela
  rationale: ישׁב aqui descreve a residência na terra; 'habitar' preserva o sentido com registro digno e corrente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o caráter de nome pessoal e a distinção entre nome e título, sem impor uma substituição confessional.
- issue: Relação entre dádiva divina e tomada de posse humana
  choice: manter ambas as afirmações sem harmonização explicativa
  alternative: parafrasear de modo que a dádiva elimine ou subordine lexicalmente a tomada de posse
  rationale: O hebraico afirma tanto que Deus dá a terra quanto que Israel toma posse dela; a tradução preserva essa tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por 'vocês' para a segunda pessoa plural. A sequência 'entrar e tomar posse' reproduz com naturalidade os dois infinitivos hebraicos. O ponto e vírgula evita uma coordenação excessivamente longa e mantém a progressão do original.
