base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: pt
  text: Ensinem-nas aos seus filhos[a], falando delas quando estiverem sentados em casa, quando andarem pelo caminho, quando se deitarem e quando se levantarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus filhos homens”. O plural masculino hebraico também pode representar os filhos em geral, incluindo filhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: Ensinem
  rationale: O piel de למד significa normalmente “ensinar”. O contexto dirige a ordem ao povo no plural; o imperativo em português comunica naturalmente a força normativa da forma hebraica com waw.
- source_word: אֹתָם
  choice: -nas
  rationale: O pronome objeto masculino plural retoma as palavras mencionadas no contexto. O português preserva a referência pronominal sem explicitar novamente o antecedente.
- source_word: אֶת־בְּנֵיכֶם
  choice: a seus filhos
  rationale: בנים pode designar especificamente “filhos homens” ou, de modo representativo, os descendentes em geral. “Filhos” é natural em português e pode ter sentido inclusivo neste contexto; a nota registra a alternativa mais explícita.
- source_word: לְדַבֵּר בָּם
  choice: falando delas
  rationale: O infinitivo com ל descreve a prática que acompanha o ensino. “Falando delas” expressa de maneira idiomática o conteúdo da fala e mantém a referência às palavras.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: quando estiverem sentados em casa
  rationale: A preposição ב com infinitivo construto introduz uma circunstância temporal. O singular distributivo hebraico ocorre dentro de uma exortação coletiva; o plural em português mantém concordância natural com “ensinem”.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: quando andarem pelo caminho
  rationale: הלך indica andar ou ir, e בַדֶּרֶךְ situa a ação no caminho. A formulação é atual e preserva a imagem concreta do hebraico.
- source_word: וּבְשָׁכְבְּךָ
  choice: quando se deitarem
  rationale: A construção indica o momento de deitar-se, sem exigir a paráfrase mais específica “ir dormir”.
- source_word: וּבְקוּמֶךָ
  choice: quando se levantarem
  rationale: קום forma com “deitar-se” um par cotidiano. “Levantar-se” preserva o sentido e soa natural em português moderno.
theological_decisions:
- issue: Alcance de gênero de בְּנֵיכֶם
  choice: seus filhos
  alternative: seus filhos e suas filhas; seus filhos homens
  rationale: O masculino plural בנים pode funcionar representativamente para os descendentes em geral. “Seus filhos” conserva a forma concisa e tradicionalmente inclusiva em português, enquanto a nota torna explícito que o hebraico também pode ser vertido literalmente como “filhos homens”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Emprega-se a segunda pessoa discursiva no plural por meio do imperativo “ensinem” e das formas correspondentes, evitando regionalismos. A cadência das quatro situações cotidianas do hebraico foi preservada.
