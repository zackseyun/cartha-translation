  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: pt
  text: e o que ele fez por vocês no deserto, até que chegaram a este lugar—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: e o que
  rationale: Dá continuidade à enumeração dos atos que Israel presenciou e preserva o valor relativo da expressão hebraica.
- source_word: עָשָׂה
  choice: fez
  rationale: É o equivalente direto e natural do verbo comum עשה neste contexto dos atos de Deus.
- source_word: לָכֶם
  choice: por vocês
  rationale: Expressa naturalmente a ação de Deus em favor do povo; «a vocês» seria possível, mas menos idiomático aqui.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português bíblico corrente, «deserto» designa com clareza a região erma da peregrinação de Israel, sem exigir que seja apenas uma extensão de areia.
- source_word: עַד
  choice: até que
  rationale: A primeira ocorrência assinala a extensão temporal dos atos de Deus até a chegada do povo.
- source_word: בֹּאֲכֶם
  choice: chegaram
  rationale: O infinitivo construto com sufixo é vertido naturalmente como oração finita; «chegaram» se ajusta ao destino geral indicado a seguir.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: a este lugar
  rationale: A segunda ocorrência de עַד tem sentido espacial; em português, «chegar a este lugar» exprime o destino de modo idiomático sem repetir artificialmente «até».
theological_decisions:
- issue: Sujeito implícito de «fez»
  choice: «ele», retomando o SENHOR no contexto
  alternative: repetir explicitamente «o SENHOR»
  rationale: O contexto identifica o SENHOR como sujeito. O pronome preserva a coesão da frase e não acrescenta uma repetição ausente do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» representa naturalmente o plural de segunda pessoa. O travessão final foi mantido porque o versículo continua a estrutura sintática e a enumeração do contexto.
