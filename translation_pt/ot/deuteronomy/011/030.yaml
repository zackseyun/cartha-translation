  - severity: medium
    issue: Formulação ambígua de “caminho do pôr do sol”
    rationale: A expressão portuguesa pode sugerir um caminho pertencente ao pôr do sol. Uma formulação que identifique a estrada como dirigida ao poente reproduz melhor a relação de דֶּרֶךְ com מְבוֹא הַשֶּׁמֶשׁ.
