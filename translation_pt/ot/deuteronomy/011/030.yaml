base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: pt
  text: Não estão eles do outro lado do Jordão[a], para além da estrada que vai em direção ao pôr do sol[b], na terra dos cananeus que habitam na Arabá, em frente de Gilgal, junto aos carvalhos de Moré[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além do Jordão”. A expressão hebraica é um modo geográfico de dizer cuja referência exata depende do ponto de vista.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “depois da estrada da entrada do sol”; isto é, em direção ao oeste.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “terebintos de Moré”. O termo hebraico pode designar árvores grandes de qualquer uma dessas espécies.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: Não ficam eles
  rationale: A partícula introduz uma pergunta retórica que espera resposta afirmativa, e o pronome masculino plural retoma os dois montes do versículo anterior. O verbo “ficam” expressa naturalmente a localização em português.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: Expressão geográfica idiomática natural em português; a nota preserva a dependência do ponto de vista.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: além do caminho do pôr do sol
  rationale: Mantém tanto a relação espacial de אַחֲרֵי quanto a imagem do caminho e do sol que entra ou se põe, sem reduzir silenciosamente a expressão apenas a “oeste”.
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: na terra dos cananeus
  rationale: O gentílico hebraico singular tem sentido coletivo; o plural é a forma corrente em português.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: que habitam na Arabá
  rationale: O particípio singular concorda semanticamente com o povo coletivo. “Arabá” é mantido como nome geográfico, sem generalizá-lo para “planície”.
- source_word: מוּל הַגִּלְגָּל
  choice: diante de Gilgal
  rationale: Transmite a relação espacial de estar defronte ou em frente a um lugar, em linguagem atual.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: junto aos carvalhos de Moré
  rationale: “Junto a” comunica proximidade. אֵלוֹן pode designar carvalho ou terebinto; “carvalhos” oferece uma leitura clara, com a alternativa botânica registrada em nota.
