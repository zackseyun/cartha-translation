base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: pt
  text: 'e o que fez a Datã e Abirão, filhos de Eliabe, filho de Rúben: como a terra abriu a boca e os engoliu, suas famílias[a], suas tendas e tudo o que estava aos pés deles[b], no meio de todo o Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “suas casas”. O hebraico pode referir-se às moradias físicas ou, em sentido mais amplo, às suas famílias ou unidades domésticas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todo o que subsistia e estava aos pés deles”. A expressão pode abranger as pessoas, os animais e os bens que lhes pertenciam ou os acompanhavam.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: fez
  rationale: O verbo comum significa “fazer”; aqui introduz naturalmente a recordação do que Deus fez a Datã e Abirão.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: filhos de Eliabe, filho de Rúben
  rationale: Mantém a formulação genealógica do hebraico, sem convertê-la em um gentílico interpretativo.
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: a terra abriu a boca
  rationale: Preserva a imagem vívida e personificada do texto hebraico.
- source_word: וַתִּבְלָעֵם
  choice: os engoliu
  rationale: Reproduz o sentido concreto usual do verbo בלע e dá continuidade à imagem da boca da terra.
- source_word: בָּתֵּיהֶם
  choice: suas famílias
  rationale: Embora o sentido literal seja “suas casas”, o termo pode designar as unidades familiares; essa leitura também evita redundância com “suas tendas”. A alternativa literal é registrada em nota.
- source_word: אָהֳלֵיהֶם
  choice: suas tendas
  rationale: Tradução direta e natural, adequada ao contexto do deserto.
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: tudo o que estava aos pés deles
  rationale: Mantém a expressão concreta e a amplitude do hebraico, sem decidir se ela abrange pessoas, animais, bens ou tudo o que os acompanhava.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: no meio de todo o Israel
  rationale: Conserva o sentido espacial e público do acontecimento entre o povo inteiro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção acompanha a sequência do discurso iniciado nos versículos anteriores; os dois-pontos introduzem a explicação de “o que fez”. As metáforas hebraicas foram mantidas, e a expressão final ambígua não foi reduzida a uma única categoria.
