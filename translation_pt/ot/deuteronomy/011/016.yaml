base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: pt
  text: Tenham cuidado para que o coração de vocês não seja enganado[a], e vocês se desviem, sirvam a outros deuses e se prostrem diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não seja seduzido”. O verbo hebraico pode ter o sentido de ser persuadido, seduzido ou enganado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Tenham cuidado
  rationale: A fórmula reflexiva de advertência é expressa de modo natural e direto em português; acrescentar “com vocês mesmos” seria desnecessário e pouco idiomático.
- source_word: פֶּן
  choice: para que ... não
  rationale: Introduz uma advertência negativa e, nesta construção, soa mais natural em português atual do que “para não acontecer que”.
- source_word: יִפְתֶּה
  choice: seja enganado
  rationale: O verbo pode indicar ser persuadido, seduzido ou enganado. A forma passiva preserva o coração como sujeito e mantém aberta a natureza do agente.
- source_word: לְבַבְכֶם
  choice: o coração de vocês
  rationale: “Coração” preserva a imagem hebraica da interioridade, abrangendo entendimento, vontade e desejos.
- source_word: וְסַרְתֶּם
  choice: e vocês se desviem
  rationale: Expressa o afastamento do caminho e da lealdade da aliança em português claro, sem explicitação interpretativa excessiva.
- source_word: וַעֲבַדְתֶּם
  choice: sirvam
  rationale: Mantém o sentido próprio de עבד aplicado à devoção religiosa e não o confunde com o gesto concreto indicado pelo verbo seguinte.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Tradução direta da expressão hebraica, sem restringi-la ao sentido mais interpretativo de “deuses estrangeiros”.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: e se prostrem diante deles
  rationale: Preserva a ação concreta de curvar-se em homenagem ou adoração; “prostrar-se diante de” é digno e compreensível em português contemporâneo.
theological_decisions:
- issue: Natureza da advertência contra a apostasia
  choice: Preservar a progressão do engano interior ao desvio, ao serviço de outros deuses e à prostração diante deles.
  alternative: Resumir a sequência como uma advertência contra ser seduzido à idolatria.
  rationale: A formulação escolhida acompanha os movimentos distintos do hebraico e evita reduzir a advertência a uma única categoria teológica abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo indicado pelas formas hebraicas, enquanto “coração” permanece no singular conforme o texto-fonte.
