base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: pt
  text: Quando Yahweh, seu Deus, levar você para a terra em que está entrando para tomar posse dela, você colocará a bênção no monte Gerizim e a maldição no monte Ebal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você proclamará a bênção no monte Gerizim e a maldição no monte Ebal”. O hebraico diz literalmente “dará/colocará”; a ação cerimonial exata é esclarecida pelo contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quando
  rationale: A fórmula introduz uma circunstância futura; em português, “Quando” transmite naturalmente a relação temporal sem reproduzir de modo rígido o hebraico.
- source_word: יְבִיאֲךָ
  choice: levar você para
  rationale: O hifil de בוא é causativo, com o sentido de fazer entrar ou levar para dentro. A forma escolhida é natural e mantém essa força.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente a construção com sufixo de segunda pessoa masculina singular e sua dimensão relacional.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto de Deuteronômio, refere-se à terra prometida; “a terra” é corrente e contextualmente preciso.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: em que está entrando
  rationale: O particípio בָא com o elemento direcional שָׁמָּה indica a entrada iminente; esta formulação é clara e preserva o movimento para dentro da terra.
- source_word: לְרִשְׁתָּהּ
  choice: para tomar posse dela
  rationale: ירשׁ frequentemente designa tomar posse da terra em Deuteronômio. A expressão explicita o referente pronominal e evita a possível leitura meramente estática de “possuir”.
- source_word: וְנָתַתָּה
  choice: você colocará
  rationale: נתן tem o sentido básico de dar, pôr ou colocar. “Colocará” preserva a imagem concreta sem definir além do texto a forma exata da ação cerimonial.
- source_word: הַבְּרָכָה
  choice: a bênção
  rationale: Mantém o substantivo definido e sua referência à bênção da aliança no contexto.
- source_word: עַל הַר גְּרִזִים
  choice: sobre o monte Gerizim
  rationale: Traduz עַל de maneira formalmente próxima e adequada à associação cerimonial com o monte.
- source_word: הַקְּלָלָה
  choice: a maldição
  rationale: É o equivalente natural do substantivo definido, em paralelo antitético com “a bênção”.
- source_word: עַל הַר עֵיבָל
  choice: sobre o monte Ebal
  rationale: Mantém o paralelismo com a expressão referente ao monte Gerizim.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino. “Yahweh” preserva-o por transliteração, sem substituí-lo por um título.
- issue: Natureza da ação relativa à bênção e à maldição
  choice: você colocará a bênção... e a maldição...
  alternative: você proclamará a bênção... e a maldição...
  rationale: O hebraico usa נתן, “dar/pôr/colocar”. A tradução conserva essa expressão concreta e não determina antecipadamente se a ação consiste especificamente em proclamar; o contexto circundante esclarece o rito.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção dirigida ao singular (“você”), conforme os sufixos hebraicos. “Monte” aparece em minúscula como designação geográfica comum. A nota preserva a alternativa cerimonial sem resolver a ambiguidade lexical no corpo do texto.
