revisions:
- from: Quando Yahweh, seu Deus, levar você para a terra em que está entrando para tomar posse dela, você colocará a bênção sobre o monte Gerizim e a maldição sobre o monte Ebal.[a]
  to: Quando Yahweh, seu Deus, levar você para a terra em que está entrando para tomar posse dela, você colocará a bênção no monte Gerizim e a maldição no monte Ebal.[a]
  rationale: A única alteração substitui “sobre o monte” por “no monte”, para uma formulação portuguesa mais idiomática e geograficamente natural. Ela não altera a ambiguidade do verbo נתן nem transforma a ação em proclamação; essa alternativa continua devidamente assinalada na nota.
