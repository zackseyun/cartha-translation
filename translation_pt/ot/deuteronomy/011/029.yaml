    issue: Locução “sobre o monte” no texto principal
    rationale: Embora formalmente possível, é menos natural em português neste contexto e pode sugerir uma colocação material no cume. “No monte” expressa naturalmente a associação/localização cerimonial indicada por עַל, sem resolver a natureza da ação.
  revised_text: Quando Yahweh, seu Deus, levar você para a terra em que está entrando para tomar posse dela, você colocará a bênção no monte Gerizim e a maldição no monte Ebal.[a]
