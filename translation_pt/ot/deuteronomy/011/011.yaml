revisions:
- from: Mas a terra que vocês estão atravessando para possuir é uma terra de montes e vales; ela bebe água da chuva dos céus.
  to: Mas a terra para a qual vocês estão passando, a fim de tomar posse dela, é uma terra de montes e vales; ela bebe água da chuva dos céus.
  rationale: Ajustada apenas a construção que expressa o movimento para a terra, preservando o sentido direcional do hebraico e tornando a frase inequívoca em português. A formulação “tomar posse dela” também torna explícito o pronome sufixado em לְרִשְׁתָּהּ, sem alteração de sentido.
