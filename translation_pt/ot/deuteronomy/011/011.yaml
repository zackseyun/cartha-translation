base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: pt
  text: Mas a terra para a qual vocês estão passando, a fim de tomar posse dela, é uma terra de montes e vales; ela bebe água da chuva dos céus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Mas a terra
  rationale: O waw estabelece contraste com a descrição do Egito no versículo anterior; “Mas” expressa essa função discursiva com naturalidade.
- source_word: עֹבְרִים שָׁמָּה
  choice: que vocês estão atravessando
  rationale: O particípio indica o movimento em curso ou iminente rumo à terra. Em português, o destino fica claro pelo contexto, sem necessidade de traduzir שָׁמָּה separadamente como “para lá”.
- source_word: לְרִשְׁתָּהּ
  choice: para possuir
  rationale: O verbo ירשׁ inclui a ideia de tomar posse e, em contexto pactual, pode também evocar herança. “Possuir” preserva aqui o aspecto ativo da entrada de Israel.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: uma terra de montes e vales
  rationale: A expressão descreve o relevo. “Montes e vales” traduz diretamente o contraste topográfico e soa natural em português.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: da chuva dos céus
  rationale: A preposição indica a fonte ou o meio pelo qual a terra recebe água. “Dos céus” mantém o plural hebraico e a imagem bíblica sem prejudicar a clareza.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: ela bebe água
  rationale: Mantém a personificação vívida da terra presente no hebraico, em vez de reduzi-la a “é regada” ou “recebe água”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O pronome “vocês” torna explícito o plural de אַתֶּם. A metáfora da terra que bebe foi preservada, assim como o plural “céus”.
