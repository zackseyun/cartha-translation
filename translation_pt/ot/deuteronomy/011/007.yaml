  text: כִּ֤י עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֶת כָּל מַעֲשֵׂ֥ה יְהוָ֖ה הַ/גָּדֹ֑ל אֲשֶׁ֖ר עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: pt
  text: Pois os próprios olhos de vocês viram toda a grande obra que Yahweh fez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “os olhos de vocês, os que veem” — construção enfática que ressalta que eles foram testemunhas oculares.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a exortação anterior, preservando de modo natural a força causal do hebraico.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: os próprios olhos de vocês viram
  rationale: A construção hebraica enfatiza os olhos dos destinatários como testemunhas diretas. Em português, o verbo finito no pretérito e o intensificador «próprios» comunicam essa ênfase com naturalidade.
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: toda a ... obra
  rationale: O substantivo singular com «toda» apresenta coletivamente a totalidade da atuação divina, e «obra» conserva esse sentido amplo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הַגָּדֹל
  choice: grande
  rationale: Traduz diretamente o adjetivo que qualifica a obra e destaca sua magnitude, sem explicitar uma ideia de poder que aqui permanece implícita.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ... fez
  rationale: Reproduz de maneira simples e corrente a oração relativa e o perfeito hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal mediante transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação natural no Brasil. «Vocês» expressa sem ambiguidade o plural hebraico; «os próprios olhos» preserva a ênfase testemunhal da construção participial sem reproduzir sua rigidez sintática.
