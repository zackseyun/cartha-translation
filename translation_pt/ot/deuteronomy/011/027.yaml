base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: pt
  text: a bênção, se vocês ouvirem[a] os mandamentos de Yahweh, seu Deus, que hoje lhes ordeno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ouvir” também pode ser traduzido como “obedecer”, pois o verbo hebraico frequentemente indica ouvir e responder com obediência.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: a bênção
  rationale: Mantém a frase nominal como objeto elíptico, em continuidade com o versículo anterior, sem acrescentar um verbo ausente do hebraico.
- source_word: אֲשֶׁר
  choice: se
  rationale: Embora seja formalmente uma partícula relativa, aqui assume valor condicional e introduz a condição associada à bênção.
- source_word: תִּשְׁמְעוּ אֶל
  choice: vocês ouvirem
  rationale: Preserva o sentido básico de ouvir ou escutar, deixando que o contexto da aliança comunique a resposta obediente implícita.
- source_word: מִצְוֺת
  choice: os mandamentos
  rationale: Termo natural e preciso para instruções divinas em contexto legal e pactual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: O sufixo hebraico é de segunda pessoa do plural; no português brasileiro corrente, 'seu' concorda com o tratamento plural 'vocês'.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: que hoje lhes ordeno
  rationale: Expressa de modo natural o ato de fala presente de Moisés; a posição de 'hoje' evita a possível leitura de que os mandamentos se destinam apenas ao dia em questão.
theological_decisions:
- issue: Valor de שׁמע no contexto da aliança
  choice: ouvirem, com nota sobre a obediência implícita
  alternative: obedecerem
  rationale: A tradução conserva a imagem lexical de ouvir sem eliminar a força de resposta obediente que o verbo frequentemente possui neste contexto.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio da aliança; a transliteração o preserva de maneira explícita.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento plural por “vocês”. A construção condicional reproduz a função contextual da partícula hebraica, e a nota preserva a amplitude semântica de “ouvir”.
