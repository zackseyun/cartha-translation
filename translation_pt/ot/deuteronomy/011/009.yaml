  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: pt
  text: para que vocês vivam por muito tempo na terra que Yahweh jurou dar a eles e à sua descendência[b] — aos seus pais[a] —, uma terra que mana leite e mel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “antepassados”. O hebraico diz literalmente “pais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “semente”. O termo hebraico pode designar coletivamente a prole ou, de modo mais amplo, os descendentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: para que
  rationale: Introduz naturalmente em português a finalidade ou o resultado expresso pela construção hebraica.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: vocês vivam por muito tempo
  rationale: Expressa com clareza o sentido do idioma hebraico, literalmente ligado a prolongar os dias, sem produzir uma formulação artificial em português.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: No contexto de Deuteronômio, refere-se ao território prometido, e não apenas ao solo; “na terra” é a formulação portuguesa mais natural.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: que Yahweh jurou
  rationale: Mantém explícitos tanto o juramento solene quanto o nome divino presente no hebraico.
- source_word: לַאֲבֹתֵיכֶם
  choice: aos seus pais
  rationale: Traduz diretamente o termo hebraico e conserva sua forma masculina concreta, deixando “antepassados” como alternativa em nota.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: dar a eles e à sua descendência
  rationale: “Descendência” funciona como coletivo em português e representa bem a amplitude de זֶרַע sem recorrer ao menos natural “semente”.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: que mana leite e mel
  rationale: Formulação tradicional, compreensível e imagética que preserva a descrição hebraica de fertilidade e abundância.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Alcance de זֶרַע
  choice: descendência
  alternative: semente; descendentes
  rationale: A escolha conserva o valor coletivo do termo e não restringe indevidamente sua referência a indivíduos determinados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para a segunda pessoa do plural e mantém a imagem bíblica tradicional “mana leite e mel”.
