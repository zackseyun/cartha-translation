  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: pt
  text: Tenham o cuidado de cumprir todos os decretos e todas as normas que hoje ponho diante de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “que hoje dou diante de vocês”; a expressão hebraica significa “que hoje ponho diante de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: Tenham o cuidado de cumprir
  rationale: A construção de שׁמר com o infinitivo עשה expressa a ideia de cuidar para realizar algo. A formulação comunica a força diretiva e soa natural em português.
- source_word: כָּל הַחֻקִּים
  choice: todos os decretos
  rationale: חֻקִּים designa determinações prescritas. “Decretos” conserva o registro jurídico da aliança e distingue o termo de מִשְׁפָּטִים.
- source_word: וְאֶת הַמִּשְׁפָּטִים
  choice: e todas as normas
  rationale: מִשְׁפָּטִים pode indicar decisões, regras ou disposições jurídicas. “Normas” é claro no português atual e mantém uma distinção lexical adequada em relação a “decretos”; a repetição de “todas” explicita naturalmente o alcance de כָּל sobre os dois substantivos coordenados.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִפְנֵיכֶם
  choice: que hoje ponho diante de vocês
  rationale: Embora נתן signifique literalmente “dar”, sua combinação com לִפְנֵי forma aqui o idioma “pôr diante de”. O presente “ponho” preserva o valor participial de נֹתֵן, e “vocês” oferece leitura brasileira clara e amplamente compreensível.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Mantém de modo direto a urgência temporal do discurso da aliança.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com registro jurídico acessível. O imperativo “Tenham” reproduz naturalmente a força diretiva da forma hebraica no contexto. A colocação de “hoje” junto ao verbo evita a possível leitura de que apenas os destinatários presentes naquele dia estariam em vista.
