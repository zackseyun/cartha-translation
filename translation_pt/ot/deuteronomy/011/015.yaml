reference: Deuteronomy 11:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י עֵ֥שֶׂב בְּ/שָׂדְ/ךָ֖ לִ/בְהֶמְתֶּ֑/ךָ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: pt
  text: E darei erva[a] no seu campo para os seus animais; você comerá e ficará satisfeito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vegetação” ou “plantas”; o termo hebraico pode indicar de modo amplo o que cresce, mas aqui provavelmente se refere ao alimento dos animais.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficará saciado”. O verbo hebraico indica ficar cheio ou satisfeito depois de comer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E darei
  rationale: O perfeito qal na primeira pessoa do singular, ligado por conjunção e inserido nesta promessa, tem valor futuro. “E” preserva a sequência do contexto anterior.
- source_word: עֵשֶׂב
  choice: erva
  rationale: O termo designa vegetação ou plantas rasteiras e, neste contexto, alimento para os animais. “Erva” mantém o sentido concreto sem transformar a vegetação no próprio campo de pastagem.
- source_word: בְּשָׂדְךָ
  choice: no seu campo
  rationale: Preserva o singular e o cenário agrícola concreto de שָׂדֶה.
- source_word: לִבְהֶמְתֶּךָ
  choice: para os seus animais
  rationale: בְּהֵמָה tem aqui sentido coletivo, referindo-se aos animais domésticos. “Animais” é natural e evita restringir indevidamente o termo a bovinos.
- source_word: וְאָכַלְתָּ
  choice: você comerá
  rationale: Mantém a segunda pessoa do singular do discurso da aliança e expressa naturalmente o valor futuro da promessa.
- source_word: וְשָׂבָעְתָּ
  choice: e ficará satisfeito
  rationale: O verbo indica ficar saciado ou plenamente satisfeito depois de comer. A formulação é corrente e conserva a ideia de suficiência.
theological_decisions:
- issue: Tratamento de Israel no singular representativo
  choice: 'Manter a segunda pessoa do singular: “seu campo”, “seus animais”, “você comerá”'
  alternative: 'Pluralizar: “seus campos... vocês comerão”'
  rationale: O hebraico emprega consistentemente a segunda pessoa masculina singular, dirigindo-se a Israel como unidade representativa. A tradução conserva essa força retórica.
- issue: Natureza da bênção prometida
  choice: Traduzir como provisão agrícola concreta da aliança
  alternative: Explicitar a promessa como prosperidade ou abundância geral
  rationale: O texto promete vegetação para os animais e alimento que traz saciedade; não se amplia a afirmação para uma doutrina geral de prosperidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. O pronome “você” torna explícita a segunda pessoa singular no uso brasileiro atual. O ponto e vírgula separa a provisão destinada aos animais de seu resultado para o destinatário humano, sem acrescentar relação causal ausente do hebraico.
