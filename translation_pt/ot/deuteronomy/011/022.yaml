base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: pt
  text: Pois, se vocês guardarem com todo o cuidado[a] todo este mandamento[b] que eu lhes ordeno cumprir — amar Yahweh, o Deus de vocês, andar em todos os seus caminhos e apegar-se a ele[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “guardar, vocês guardarão”, construção que intensifica o verbo. Também pode ser traduzido por “guardarem diligentemente”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa o singular, “todo este mandamento”, provavelmente como expressão coletiva para o conjunto da incumbência da aliança.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “apegar-se firmemente a ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Introduz a condição e, ao mesmo tempo, mantém a ligação explicativa com o versículo anterior.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: guardarem com todo o cuidado
  rationale: A construção com infinitivo absoluto intensifica o verbo; esta formulação comunica tanto a ênfase quanto a atenção cuidadosa exigida.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: todo este mandamento
  rationale: Preserva o singular coletivo do hebraico e apresenta a ordem da aliança como uma incumbência unificada.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: que eu lhes ordeno cumprir
  rationale: Reflete o ato de ordenar em curso e traduz de modo natural o sentido concreto de fazer ou pôr em prática o mandamento.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: amar Yahweh, seu Deus
  rationale: Mantém a sequência de infinitivos que explicita o conteúdo da obediência e preserva o nome divino.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: andar em todos os seus caminhos
  rationale: Conserva a metáfora bíblica do andar como modo de vida, sem reduzi-la a uma paráfrase interpretativa.
- source_word: וּלְדָבְקָה בוֹ
  choice: e apegar-se a ele
  rationale: Expressa proximidade, lealdade e adesão contínua em português atual, preservando a força relacional do verbo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o nome da aliança; sua transliteração preserva a distinção entre o nome pessoal e um título.
- issue: Linguagem metafórica da aliança em “andar” e “apegar-se”
  choice: Preservar as metáforas no texto principal
  alternative: Viver de acordo com os caminhos de Deus e permanecer fiel a ele
  rationale: As metáforas hebraicas comportam dimensões éticas, relacionais e pactuais; uma explicitação interpretativa estreitaria sua amplitude.
- issue: Relação dos infinitivos com o mandamento
  choice: Apresentá-los após travessão como conteúdo explicativo
  alternative: 'Traduzir com valor instrumental: “amando..., andando... e apegando-se...”'
  rationale: O hebraico admite matizes de propósito, conteúdo ou maneira. A sequência em infinitivo preserva essa abertura melhor do que uma formulação exclusivamente instrumental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de leitura natural no Brasil. O singular coletivo “mandamento” e as metáforas “andar” e “apegar-se” foram preservados. O travessão final mantém a oração condicional aberta, pois sua consequência continua no versículo seguinte.
