base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/020.yaml
  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: pt
  text: Escreva-as nos batentes[a] da porta de sua casa e nos seus portões[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas ombreiras”. O termo hebraico se refere aos postes laterais da entrada.
    reason: lexical_alternative
  - marker: b
    text: Ou “junto aos seus portões”. O hebraico pode se referir tanto aos portões quanto à área da entrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Escreva-as
  rationale: O perfeito qal com conjunção dá continuidade, neste contexto instrutivo, à série de mandamentos. O imperativo em português expressa naturalmente essa força, e o pronome feminino plural retoma as palavras mencionadas antes.
- source_word: עַל
  choice: nos
  rationale: A preposição indica colocação sobre uma superfície; sua combinação com o artigo em “nos batentes” é natural em português.
- source_word: מְזוּזוֹת
  choice: batentes das portas
  rationale: O substantivo designa os postes laterais de uma entrada. “Batentes das portas” é claro ao leitor moderno e evita importar o sentido religioso posterior de “mezuzá”.
- source_word: בֵּיתֶךָ
  choice: da sua casa
  rationale: בַּיִת significa normalmente “casa”; a escolha conserva o sentido concreto e o contexto doméstico.
- source_word: וּבִשְׁעָרֶיךָ
  choice: e nos seus portões
  rationale: שַׁעַר designa normalmente um portão e, por extensão, a área da entrada. “Portões” mantém a tradução direta, enquanto a nota registra a possível referência ao local junto deles.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa natural. “Batentes das portas” privilegia compreensão ampla; as alternativas lexicais genuínas são preservadas em notas.
