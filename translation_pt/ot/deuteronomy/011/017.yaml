  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: pt
  text: Então a ira de Yahweh se acenderá contra vocês[a], e ele fechará os céus, de modo que não haverá chuva; o solo não dará a sua produção, e vocês desaparecerão rapidamente da boa terra que Yahweh lhes está dando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a ira de Yahweh arderá contra vocês”; literalmente, “o nariz/a ira de Yahweh arderá contra vocês”, expressão hebraica que indica ira intensa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: Então a ira de Yahweh se acenderá contra vocês
  rationale: A construção חרה אף é uma expressão idiomática que descreve a ira como algo que se acende. A formulação preserva essa metáfora e usa “Então” para expressar naturalmente a consequência no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: e ele fechará os céus
  rationale: Preserva a imagem hebraica do fechamento dos céus como causa da ausência de chuva, em linguagem portuguesa natural.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: de modo que não haverá chuva
  rationale: Explicita a relação de resultado implícita entre fechar os céus e não haver chuva.
- source_word: וְהָאֲדָמָה
  choice: o solo
  rationale: אֲדָמָה designa aqui o solo cultivável e assim permanece distinto de הָאָרֶץ, traduzido depois como “terra”.
- source_word: לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: não dará a sua produção
  rationale: Mantém a imagem verbal de “dar” e comunica com clareza o rendimento agrícola.
- source_word: וַאֲבַדְתֶּם
  choice: e vocês desaparecerão
  rationale: אבד pode indicar perecer, ser eliminado ou desaparecer. No contexto, a construção com מֵעַל aponta especialmente para o desaparecimento ou remoção do povo da terra, sem especificar além do hebraico o mecanismo dessa perda.
- source_word: מְהֵרָה
  choice: rapidamente
  rationale: Expressa diretamente a rapidez indicada pelo advérbio hebraico.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: da boa terra
  rationale: Em português, “desaparecer da boa terra” transmite naturalmente a ideia de deixar de estar sobre ela, sem reproduzir de modo artificial a sequência preposicional hebraica.
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: que Yahweh lhes está dando
  rationale: O presente progressivo representa o particípio נֹתֵן e destaca a dádiva em curso no horizonte narrativo de Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome pessoal divino. “Yahweh” preserva esse nome sem substituí-lo por um título.
- issue: Expressão antropomórfica da ira
  choice: a ira de Yahweh se acenderá contra vocês
  alternative: Yahweh ficará irado com vocês
  rationale: A opção escolhida preserva a metáfora hebraica da ira que arde ou se acende, sem acrescentar uma explicação teológica que amenize ou intensifique o texto.
- issue: Sentido de אבד no contexto da terra
  choice: vocês desaparecerão rapidamente da boa terra
  alternative: vocês perecerão rapidamente na/da boa terra; vocês serão rapidamente eliminados da boa terra
  rationale: “Desaparecerão da” conserva a possibilidade de morte, eliminação ou remoção da terra e evita decidir silenciosamente entre aniquilação e exílio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e distingue “solo” (אֲדָמָה) de “terra” (הָאָרֶץ). A pontuação organiza a cadeia de consequências sem enfraquecer sua gravidade.
