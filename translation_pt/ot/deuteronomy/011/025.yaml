  terminology: «Yahweh» preserva adequadamente o Tetragrama. «Medo e pavor» mantém a intensificação de פַּחַד e מוֹרָא sem os reduzir a um único termo. «Ninguém» é uma boa tradução funcional do singular representativo sob negação, sem impor uma limitação de sexo.
