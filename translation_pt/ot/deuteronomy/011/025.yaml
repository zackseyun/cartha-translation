  text: לֹא יִתְיַצֵּ֥ב אִ֖ישׁ בִּ/פְנֵי/כֶ֑ם פַּחְדְּ/כֶ֨ם וּ/מֽוֹרַאֲ/כֶ֜ם יִתֵּ֣ן יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם עַל פְּנֵ֤י כָל הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תִּדְרְכוּ בָ֔/הּ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: pt
  text: Ninguém poderá resistir a vocês[a]. Yahweh, o Deus de vocês, porá o medo e o pavor de vocês sobre toda a terra em que vocês pisarem[b], conforme lhes disse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Nenhum homem se colocará diante de vocês”. Em hebraico, “colocar-se diante de” pode significar resistir ou fazer oposição com sucesso.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sobre a face de toda a terra”. Aqui, “terra” se refere ao território em que Israel pisaria; a expressão também pode ser traduzida por “por toda a terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: Ninguém poderá resistir a vocês
  rationale: A expressão hebraica retrata alguém que se põe diante de Israel, mas, neste contexto, significa conseguir resistir ou fazer oposição. A formulação explicita esse sentido idiomático em português natural; אִישׁ tem aqui valor representativo, por isso 'ninguém' comunica melhor o alcance da negação.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: o medo e o pavor de vocês
  rationale: Os dois substantivos são próximos, porém não idênticos. 'Medo' e 'pavor' preservam o paralelismo intensificador e indicam o temor que Israel causará nos habitantes da terra.
- source_word: יִתֵּן ... עַל־פְּנֵי
  choice: espalhará ... por toda a extensão
  rationale: Embora נתן signifique literalmente 'dar, pôr', combinado com 'sobre a face de toda a terra' descreve a difusão do temor pelo território. 'Espalhará ... por toda a extensão' conserva a imagem espacial em português claro.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, o Deus de vocês
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama e expressa naturalmente em português a relação pactual indicada pelo possessivo plural.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: por toda a extensão da terra
  rationale: A expressão literal é 'sobre a face de toda a terra'. O contexto restringe אֶרֶץ ao território em que Israel pisará, e 'toda a extensão' preserva o alcance espacial sem sugerir necessariamente o planeta inteiro.
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: em que vocês pisarem
  rationale: Preserva a imagem concreta do verbo דרך, 'pisar, calcar', e se liga com naturalidade ao território mencionado.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: conforme lhes disse
  rationale: Traduz דבר pelo sentido comum de 'dizer/falar', sem tornar explícita como 'promessa' uma força pragmática que o contexto permite inferir.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o nome pactual. 'Yahweh' o apresenta como nome próprio e evita substituí-lo por um título; 'Javé' é uma forma portuguesa tradicional possível.
- issue: Valor representativo de אִישׁ sob negação
  choice: Ninguém
  alternative: Homem algum
  rationale: 'Embora אִישׁ seja morfologicamente masculino singular, a construção negativa tem referência geral: nenhuma pessoa adversária poderá resistir. ''Ninguém'' preserva esse alcance sem introduzir uma restrição ao sexo masculino.'
- issue: Força de דִּבֶּר na declaração divina
  choice: disse
  alternative: prometeu
  rationale: O contexto pode ter força de promessa, mas o verbo significa literalmente 'falou/disse'. A tradução não resolve de modo indevido essa nuance teológica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega ''vocês'' para o plural hebraico e evita tanto arcaísmos como coloquialismos excessivos. A tradução prioriza equivalência ótima: explicita o idioma inicial no texto e registra a imagem literal em nota.'
