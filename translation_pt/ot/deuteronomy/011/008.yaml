  to: Portanto, guardem todo o mandamento[a] que hoje lhes ordeno, para que se fortaleçam[b], entrem e tomem posse[c] da terra que estão atravessando para tomar posse dela.
  rationale: A revisão substitui uma formulação potencialmente imprecisa da travessia por “estão atravessando” e torna mais explícita a ligação do infinitivo final com a terra (“tomar posse dela”). Também ajusta a tradução de תֶּחֶזְקוּ para uma formulação dinâmica mais próxima do qal hebraico. As demais escolhas, incluindo o singular coletivo “todo o mandamento” e o plural português para Israel como coletivo, foram preservadas.
