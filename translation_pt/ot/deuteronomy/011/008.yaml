base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: pt
  text: Portanto, guardem todo o mandamento[a] que hoje lhes ordeno, para que se fortaleçam[b], entrem e tomem posse[c] da terra que estão atravessando para tomar posse dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “todo o mandamento”. O singular “mandamento” tem sentido coletivo e se refere ao conjunto completo das ordens.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sejam fortes”. O verbo hebraico pode indicar tornar-se forte ou mostrar-se forte neste contexto.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “herdem” ou “possuam”. O mesmo verbo hebraico está por trás de “tomem posse” e “tomar posse dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Portanto, guardem
  rationale: Em contexto legal e pactual, שׁמר significa guardar, observar ou cumprir. “Guardem” preserva a imagem hebraica e é corrente em português; “portanto” expressa a continuidade inferencial da conjunção com o contexto anterior.
- source_word: כָּל הַמִּצְוָה
  choice: todo o mandamento
  rationale: Mantém o singular coletivo do hebraico, que abrange o conjunto completo das ordens, sem o transformar silenciosamente em plural.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhes ordeno
  rationale: Expressa de modo natural a ação presente de ordenar. O pronome plural segue o público coletivo indicado pelos verbos plurais do versículo, sem reproduzir de forma artificial a alternância hebraica entre singular corporativo e plural.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz naturalmente em português a finalidade ou o resultado pretendido.
- source_word: תֶּחֶזְקוּ
  choice: sejam fortes
  rationale: O qal de חזק pode indicar tornar-se forte ou mostrar-se forte. A formulação escolhida conserva essa amplitude sem restringi-la apenas à coragem militar.
- source_word: וּבָאתֶם
  choice: entrem
  rationale: No contexto da chegada à terra, בוא significa entrar. “Entrem” é mais direto e natural em português do que uma reprodução deítica como “venham para dentro”.
- source_word: וִירִשְׁתֶּם
  choice: tomem posse
  rationale: ירשׁ pode significar herdar, possuir ou tomar posse. Neste contexto de entrada na terra, “tomem posse” comunica tanto a aquisição quanto a ocupação efetiva.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: “Terra” preserva o sentido geográfico e pactual recorrente em Deuteronômio.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: para a qual estão passando
  rationale: A expressão hebraica descreve a travessia em direção à terra. “Estão passando” conserva o movimento para o outro lado sem a falta de naturalidade de “estão atravessando para lá” em português.
- source_word: לְרִשְׁתָּהּ
  choice: a fim de possuí-la
  rationale: O infinitivo indica a finalidade da entrada e repete a raiz ירשׁ. “Possuí-la” mantém a ligação lexical com a tomada de posse, evitando repetição pesada.
theological_decisions:
- issue: Alternância entre singular corporativo e plural na forma de dirigir-se a Israel
  choice: Empregar formas plurais naturais em português (“guardem”, “lhes”, “sejam”, “entrem”)
  alternative: 'Reproduzir a alternância literalmente: “que hoje ordeno a você” seguida de verbos plurais'
  rationale: O sufixo singular hebraico trata Israel como unidade coletiva, enquanto os demais verbos se dirigem ao povo no plural. Como o português exige marcar o número e a alternância literal soaria como mudança de destinatário, o plural preserva com clareza o referente coletivo sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva “mandamento” como singular coletivo, evita regionalismos e mantém a tensão lexical de חזק e ירשׁ nas notas.
