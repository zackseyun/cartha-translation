  terminology: “Exército”, “carros de guerra”, “Yahweh” e “mar Vermelho” são escolhas adequadas. A nota preserva corretamente a alternativa lexical “mar de juncos”; convém usar minúscula em “juncos”, por ser substantivo comum.
