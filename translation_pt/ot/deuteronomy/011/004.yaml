base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: pt
  text: e o que fez ao exército do Egito, aos seus cavalos e aos seus carros de guerra, quando fez as águas do mar Vermelho[a] inundá-los enquanto perseguiam vocês, e Yahweh os destruiu até hoje,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mar de juncos”. Tradicionalmente traduzido como “mar Vermelho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: exército
  rationale: Neste contexto militar, acompanhado de cavalos e carros de guerra, o termo designa as forças armadas do Egito, não riqueza ou capacidade em sentido geral.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: aos seus cavalos e aos seus carros de guerra
  rationale: Os sufixos retomam coletivamente o Egito. “Carros de guerra” comunica com clareza o sentido militar de רֶכֶב no português atual.
- source_word: הֵצִיף אֶת מֵי ... עַל־פְּנֵיהֶם
  choice: fez as águas ... inundá-los
  rationale: A construção preserva o valor causativo do hifil e expressa naturalmente que Deus fez as águas cobrirem as forças egípcias.
- source_word: מֵי יַם סוּף
  choice: as águas do mar Vermelho
  rationale: “Mar Vermelho” é a designação geográfica tradicional e amplamente reconhecida em português; a tradução lexical “mar de Juncos” é registrada em nota.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: enquanto perseguiam vocês
  rationale: A preposição com o infinitivo construto indica ação contemporânea. “Enquanto” preserva essa relação temporal, e “vocês” representa o plural hebraico.
- source_word: וַיְאַבְּדֵם
  choice: os destruiu
  rationale: O verbo aqui expressa que Yahweh levou os perseguidores à destruição; “destruiu” é claro, direto e adequado ao contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Reproduz o idioma hebraico que salienta o resultado duradouro da destruição desde o acontecimento até o presente do discurso.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o nome divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Tradução de יַם סוּף
  choice: mar Vermelho
  alternative: mar de Juncos
  rationale: A designação tradicional é mantida no texto principal para reconhecimento geográfico, enquanto o sentido lexical do hebraico é preservado em nota, sem eliminar a questão tradutória.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O plural “vocês” deixa explícito o referente coletivo. “Carros de guerra” evita a possível leitura moderna de automóveis. A vírgula final foi mantida porque o versículo integra uma oração iniciada nos versículos anteriores e continuada no seguinte.
