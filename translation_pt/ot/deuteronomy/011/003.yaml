  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão final preserva a continuidade sintática com o versículo seguinte. A repetição de “contra” evita ambiguidade estrutural e expressa naturalmente a direção hostil dos atos no contexto.
