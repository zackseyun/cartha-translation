  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: pt
  text: e os seus sinais[a] e os seus feitos, que realizou no meio do Egito[b], ao faraó, rei do Egito, e a toda a sua terra[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prodígios”.
    reason: lexical_alternative
  - marker: b
    text: Ou simplesmente “no Egito”; o hebraico diz mais literalmente “no meio do Egito”.
    reason: lexical_alternative
  - marker: c
    text: Ou “contra o faraó [...] e contra toda a sua terra”; literalmente, “ao faraó [...] e a toda a sua terra”. O contexto é de atos de juízo dirigidos a eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: os seus sinais
  rationale: אוֹת designa um sinal, uma marca ou um portento. “Sinais” é direto, amplo e não acrescenta explicitamente o caráter milagroso já evidente no contexto.
- source_word: מַעֲשָׂיו
  choice: os seus feitos
  rationale: מַעֲשֶׂה refere-se ao que alguém faz, isto é, um ato ou feito. “Feitos” conserva o sentido concreto e combina naturalmente com os sinais mencionados em paralelo.
- source_word: אֲשֶׁר עָשָׂה
  choice: que realizou
  rationale: A oração relativa modifica “sinais” e “feitos”. “Realizou” evita a repetição pouco elegante de “feitos que fez”, sem alterar o sentido.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: no meio do Egito
  rationale: בְּתוֹךְ significa literalmente “no meio de”. A formulação preserva a ênfase espacial do hebraico e continua clara em português atual.
- source_word: לְפַרְעֹה ... וּלְכָל אַרְצוֹ
  choice: contra o faraó ... e contra toda a sua terra
  rationale: Embora לְ seja literalmente uma preposição ampla, equivalente muitas vezes a “a/para”, aqui introduz os alvos dos atos divinos de juízo. “Contra” torna essa relação natural e explícita em português, mantendo em nota a forma mais literal.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: rei do Egito
  rationale: Tradução direta e convencional da construção hebraica.
- source_word: וּלְכָל אַרְצוֹ
  choice: e contra toda a sua terra
  rationale: אֶרֶץ pode significar “terra” ou “país”. “Toda a sua terra” conserva a abrangência territorial e o sufixo possessivo do hebraico.
- source_word: וְאֶת ... וְאֶת
  choice: e ... e
  rationale: Os objetos coordenados dão continuidade à frase do versículo anterior. A repetição de “e” preserva essa coordenação cumulativa.
