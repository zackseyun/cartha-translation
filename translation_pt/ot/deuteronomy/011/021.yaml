  text: לְמַ֨עַן יִרְבּ֤וּ יְמֵי/כֶם֙ וִ/ימֵ֣י בְנֵי/כֶ֔ם עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵי/כֶ֖ם לָ/תֵ֣ת לָ/הֶ֑ם כִּ/ימֵ֥י הַ/שָּׁמַ֖יִם עַל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: pt
  text: para que os seus dias e os dias dos seus filhos se multipliquem na terra que Yahweh jurou aos seus pais dar-lhes, como os dias dos céus sobre a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto os céus estiverem sobre a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz naturalmente em português a finalidade ou o resultado das ordens anteriores.
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: os seus dias se multipliquem
  rationale: Conserva a imagem hebraica do aumento dos dias sem explicá-la como simplesmente 'vivam muito'.
- source_word: וִימֵי בְנֵיכֶם
  choice: e os dias dos seus filhos
  rationale: בנים pode designar filhos ou descendentes; 'filhos' é natural e mantém a linguagem familiar do texto.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: No contexto de Deuteronômio, refere-se à terra prometida; 'na terra' é a forma idiomática em português.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: que Yahweh jurou
  rationale: Preserva de modo direto a linguagem de juramento e o nome divino.
- source_word: לַאֲבֹתֵיכֶם
  choice: aos seus pais
  rationale: Mantém a linguagem familiar e pactual do hebraico, embora 'antepassados' seja uma interpretação contextual possível.
- source_word: לָתֵת לָהֶם
  choice: dar a eles
  rationale: Reproduz o pronome plural hebraico sem acrescentar o objeto implícito 'a terra'.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: como os dias dos céus sobre a terra
  rationale: Preserva a formulação poética e sua imagem, deixando em nota a leitura temporal idiomática.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o Tetragrama; 'Yahweh' representa o nome pactual sem substituí-lo por um título.
- issue: Sentido de בְנֵיכֶם
  choice: seus filhos
  alternative: seus descendentes; suas crianças
  rationale: A forma hebraica é masculina plural e sua referência pode abranger a geração seguinte; 'filhos' conserva tanto a forma quanto uma possível abrangência representativa.
- issue: Força da comparação final
  choice: como os dias dos céus sobre a terra
  alternative: enquanto os céus estiverem sobre a terra
  rationale: A tradução principal mantém a imagem hebraica incomum; a nota registra o provável valor idiomático de duração sem eliminar a ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe preserva a imagem poética do hebraico; 'dar a eles' é deliberadamente explícito, e a nota esclarece a leitura temporal da expressão final.
