base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/019.yaml
  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: pt
  text: Somente suas esposas, suas crianças pequenas[a] e seu gado — sei que vocês têm muito gado — ficarão nas cidades[b] que lhes dei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus dependentes”. O termo hebraico se refere a crianças pequenas ou a dependentes.
    reason: lexical_alternative
  - marker: b
    text: Ou “povoados”. A palavra hebraica pode designar assentamentos de diferentes tamanhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Marca a exceção à ordem anterior e preserva de modo conciso sua força restritiva.
- source_word: נְשֵׁיכֶם
  choice: suas mulheres
  rationale: No contexto, refere-se às mulheres das famílias, sobretudo às esposas; a formulação portuguesa mantém o sentido coletivo sem tornar explícita uma especificação maior que a do termo hebraico.
- source_word: טַפְּכֶם
  choice: seus filhos pequenos
  rationale: טַף designa crianças pequenas ou dependentes; esta expressão comunica naturalmente o referente familiar imediato.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: seus rebanhos / muitos rebanhos
  rationale: מִקְנֶה abrange animais domésticos possuídos, não apenas bovinos. 'Rebanhos' é natural em português e a repetição acompanha o hebraico.
- source_word: יָדַעְתִּי כִּי
  choice: sei que
  rationale: Preserva diretamente a afirmação em primeira pessoa; os travessões integram a explicação sem acrescentar uma relação lógica ausente.
- source_word: יֵשְׁבוּ
  choice: ficarão
  rationale: Embora o verbo possa significar sentar-se, habitar ou permanecer, aqui contrasta os que ficam nas cidades com os homens que atravessam para a guerra.
- source_word: בְּעָרֵיכֶם
  choice: nas cidades
  rationale: עִיר pode indicar cidade ou povoado. 'Cidades' é corrente na linguagem bíblica portuguesa, enquanto a nota preserva a variação de escala possível.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: que lhes dei
  rationale: O perfeito hebraico apresenta a concessão como concluída; o pretérito perfeito é direto e natural em português.
