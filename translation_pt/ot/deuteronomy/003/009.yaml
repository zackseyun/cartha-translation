  yaml_path: translation/ot/deuteronomy/003/009.yaml
  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: pt
  text: Os sidônios chamam o Hermom de Siriom, e os amorreus o chamam de Senir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִידֹנִים
  choice: os sidônios
  rationale: Gentílico masculino plural referente ao povo de Sidom; o artigo definido é natural em português.
- source_word: יִקְרְאוּ
  choice: chamam
  rationale: O qal imperfeito de קרא, construído com ל, expressa nomeação; o presente habitual se ajusta ao contexto.
- source_word: לְחֶרְמוֹן
  choice: o Hermom
  rationale: Nome próprio do monte. A preposição ל integra a construção de nomeação e é expressa naturalmente por «chamar X de Y». Não se acrescenta «monte», ausente no hebraico deste versículo.
- source_word: שִׂרְיֹן
  choice: Siriom
  rationale: Transliteração portuguesa do nome usado pelos sidônios para o Hermom.
- source_word: וְהָאֱמֹרִי
  choice: e os amorreus
  rationale: Embora o gentílico esteja morfologicamente no singular, tem sentido coletivo, confirmado pelo verbo no plural e pelo paralelismo com «os sidônios».
- source_word: יִקְרְאוּ לוֹ
  choice: o chamam de
  rationale: O pronome retoma Hermom; esta é a construção portuguesa natural para indicar o nome atribuído a algo.
- source_word: שְׂנִיר
  choice: Senir
  rationale: Transliteração consagrada em português do nome amorreu do Hermom.
