base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: pt
  text: 'Naquele tempo, conquistamos todas as suas cidades. Não houve cidade que não tomássemos deles[a]: sessenta cidades, toda a região de Argobe, o reino de Ogue em Basã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “deles”, provavelmente referindo-se ao povo ou às forças de Ogue, e não apenas a Ogue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: conquistamos
  rationale: O verbo לכד descreve a tomada militar de um lugar; “conquistamos” expressa isso de modo natural e claro em português.
- source_word: כָּל עָרָיו
  choice: todas as cidades dele
  rationale: עיר pode designar cidade ou povoação; “cidades” mantém a terminologia corrente, e o sufixo singular remete a Ogue.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Expressão temporal natural e digna, equivalente ao hebraico.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: Não houve cidade que não tomássemos deles
  rationale: Preserva a negação enfática e a oração relativa do hebraico sem tornar a frase artificial em português.
- source_word: מֵאִתָּם
  choice: deles
  rationale: Mantém o sufixo pronominal plural explícito no hebraico, provavelmente referente ao povo ou às forças de Ogue.
- source_word: שִׁשִּׁים עִיר
  choice: sessenta cidades
  rationale: Tradução direta do numeral e do substantivo, em coerência com as ocorrências anteriores.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: toda a região de Argobe
  rationale: חבל designa aqui um território ou distrito; “região” é claro e corrente.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: o reino de Ogue em Basã
  rationale: Reproduz a cadeia construta que identifica a região como parte do reino de Ogue localizado em Basã.
