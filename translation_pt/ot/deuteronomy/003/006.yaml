base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: pt
  text: Nós os consagramos à destruição[a], assim como havíamos feito com Seom, rei de Hesbom, destruindo completamente cada cidade, com todos os seus homens, mulheres e crianças.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pusemos sob o anátema”. O hebraico usa o verbo חרם, termo técnico que significa consagrar algo ou alguém à destruição.'
    reason: Alternativa lexical que esclarece o sentido técnico do termo hebraico.
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: consagramos à destruição
  rationale: O hifil de חרם é um termo técnico que indica colocar pessoas ou coisas sob ḥerem, destinando-as à destruição. A formulação mantém tanto a ideia de consagração quanto seu resultado destrutivo, sem reduzi-la ao simples verbo “destruir”.
- source_word: כַּאֲשֶׁר עָשִׂינוּ
  choice: assim como havíamos feito
  rationale: A oração comparativa remete à ação anterior contra Seom; o mais-que-perfeito composto expressa naturalmente essa perspectiva retrospectiva em português.
- source_word: לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: com Seom, rei de Hesbom
  rationale: Depois de עשה, a preposição ל marca aqui aquele que recebeu a mesma ação. “Fazer com” é a construção portuguesa mais natural neste contexto.
- source_word: הַחֲרֵם
  choice: destruindo completamente
  rationale: O infinitivo absoluto intensifica e explicita a ação de חרם. Esta formulação comunica a totalidade da destruição em português corrente.
- source_word: כָּל עִיר
  choice: cada cidade
  rationale: O singular distributivo com כָּל é representado naturalmente por “cada cidade”.
- source_word: מְתִם
  choice: homens
  rationale: O substantivo designa pessoas do sexo masculino e aparece em uma enumeração distinta de mulheres e crianças; por isso, é mantido como substantivo, sem ser convertido em adjetivo como “habitada”.
- source_word: הַנָּשִׁים
  choice: mulheres
  rationale: Correspondência lexical direta e natural.
- source_word: וְהַטָּף
  choice: e crianças
  rationale: טף designa sobretudo crianças pequenas ou dependentes. “Crianças” é claro e natural para leitores modernos, embora seja um pouco mais amplo que “pequeninos”.
theological_decisions:
- issue: Tradução de חרם no contexto de guerra e juízo
  choice: consagramos à destruição
  alternative: destruímos completamente; pusemos sob o anátema
  rationale: A tradução não suaviza a violência descrita, mas também preserva o caráter técnico de חרם, que vai além da mera destruição. A nota registra uma alternativa tradicional sem impor uma interpretação denominacional.
- issue: Alcance da destruição na enumeração final
  choice: cada cidade — homens, mulheres e crianças
  alternative: cada cidade habitada, com as mulheres e as crianças
  rationale: מְתִם funciona como substantivo na enumeração com mulheres e crianças. Mantê-lo como “homens” preserva a estrutura severa e abrangente do texto, sem transformar o termo em “habitada”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Seom” e “Hesbom” seguem formas portuguesas tradicionais. O travessão preserva a enumeração enfática do hebraico sem atenuar seu conteúdo.
