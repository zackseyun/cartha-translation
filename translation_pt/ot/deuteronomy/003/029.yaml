  yaml_path: translation/ot/deuteronomy/003/029.yaml
  text: So we stayed in the valley opposite Beth-peor[a].
translation:
  language: pt
  text: Assim, ficamos no vale em frente a Bete-Peor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E permanecemos no vale diante de Bete-Peor.”'
    reason: Alternativa lexical para וַנֵּשֶׁב e מוּל, preservando a continuação narrativa e a possibilidade de expressar a relação espacial por «diante de».
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: Assim, ficamos
  rationale: O verbo יָשַׁב, no imperfeito consecutivo da primeira pessoa do plural, dá continuidade à narrativa e descreve permanência em um lugar. “Ficamos” é natural no português atual; “Assim” expressa a ligação narrativa e conclusiva com o contexto.
- source_word: בַּגָּיְא
  choice: no vale
  rationale: גַּיְא pode designar vale, ravina ou desfiladeiro. “Vale” preserva o sentido topográfico amplo sem especificar demais o relevo.
- source_word: מוּל
  choice: diante de
  rationale: מוּל indica posição em frente ou defronte de algo. “Diante de” é claro e digno, embora “em frente a” também seja possível.
- source_word: בֵּית פְּעוֹר
  choice: Bete-Peor
  rationale: Trata-se de um topônimo, por isso é transliterado, não traduzido. “Bete-Peor” segue uma forma portuguesa legível e próxima da estrutura hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém a concisão do hebraico e não explicita além do texto se a permanência foi breve ou prolongada.
