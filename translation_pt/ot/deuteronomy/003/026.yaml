base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: pt
  text: 'Mas Yahweh se indignou comigo por causa de vocês[a] e não me escutou. Yahweh me disse: “Basta para você[b]! Não volte a falar comigo sobre este assunto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por conta de vocês” ou “em consideração a vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Basta para você”, expressão breve e incisiva de repreensão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: se indignou
  rationale: O hitpael de עבר nesta expressão comunica ira intensa. “Se indignou” é natural e digno, sem ampliar o sentido para além do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בִּי
  choice: comigo
  rationale: Com a expressão de ira, “indignou-se comigo” é construção idiomática em português.
- source_word: לְמַעַנְכֶם
  choice: por causa de vocês
  rationale: No contexto, indica que a reação de Yahweh contra Moisés ocorreu por causa do povo; a nota preserva a alternativa semântica possível.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: e não me atendeu
  rationale: שׁמע com אֶל, no contexto de uma súplica, significa escutar no sentido de acolher ou atender o pedido.
- source_word: רַב לָךְ
  choice: Basta para você
  rationale: Mantém de perto o idiomatismo hebraico breve e incisivo, cuja força de repreensão é esclarecida em nota.
- source_word: אַל תּוֹסֶף דַּבֵּר ... עוֹד
  choice: Não volte a falar
  rationale: A combinação de יסף com infinitivo e עוֹד proíbe a repetição ou continuação da fala; esta formulação é clara e natural em português.
- source_word: בַּדָּבָר הַזֶּה
  choice: sobre este assunto
  rationale: דבר designa aqui a questão tratada, isto é, o pedido de Moisés para atravessar a terra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, sem substituí-lo por um título.
- issue: Responsabilidade indicada por לְמַעַנְכֶם
  choice: por causa de vocês
  alternative: por amor de vocês; por causa da situação de vocês
  rationale: A leitura causal se ajusta ao discurso de Moisés, mas a amplitude da preposição é preservada na nota, sem eliminar a tensão sobre a relação entre a conduta do povo e a punição de Moisés.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural e preserva a concisão e a severidade da fala divina.
