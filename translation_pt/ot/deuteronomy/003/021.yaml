  text: וְ/אֶת יְהוֹשׁ֣וּעַ צִוֵּ֔יתִי בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר עֵינֶ֣י/ךָ הָ/רֹאֹ֗ת אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֤ה אֱלֹהֵי/כֶם֙ לִ/שְׁנֵי֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה כֵּֽן יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל הַ/מַּמְלָכ֔וֹת אֲשֶׁ֥ר אַתָּ֖ה עֹבֵ֥ר שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: pt
  text: 'Naquele tempo, dei esta ordem a Josué: “Os seus próprios olhos viram tudo o que Yahweh, o Deus de vocês, fez com esses dois reis. Yahweh fará o mesmo com todos os reinos pelos quais você passar.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “todos os reinos para os quais você está atravessando”. O hebraico diz literalmente “pelos quais você está passando para lá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת־יְהוֹשׁוּעַ צִוֵּיתִי
  choice: dei esta ordem a Josué
  rationale: Expressa de modo natural a autoridade do verbo צוה, sem perder a ideia de uma ordem direta dada por Moisés.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Equivalente temporal corrente e digno para a expressão hebraica.
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: Os seus próprios olhos viram
  rationale: Preserva a formulação vívida e enfática do hebraico, destacando Josué como testemunha ocular.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, o Deus de vocês
  rationale: Mantém o nome divino e reproduz o sufixo plural em “Deus de vocês”, embora Josué seja o destinatário singular imediato.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: com esses dois reis
  rationale: Em português, “o que fez com esses dois reis” comunica naturalmente a ação de Yahweh sobre eles sem explicitar além do hebraico o sentido hostil fornecido pelo contexto.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: Yahweh fará o mesmo
  rationale: 'Torna clara e concisa a comparação marcada por כֵּן: o tratamento dado aos dois reis será o padrão para os demais reinos.'
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: pelos quais você passar
  rationale: Formulação natural em português para o movimento de Josué pelos territórios, preservando o destinatário singular; a nota registra mais de perto a expressão direcional hebraica.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Alternância entre destinatário singular e referência plural
  choice: “seus próprios olhos” e “você” para Josué; “Deus de vocês” para Israel
  alternative: Uniformizar tudo no singular
  rationale: O hebraico dirige a fala a Josué no singular, mas chama Yahweh de “Deus de vocês” no plural. A tradução mantém essa mudança significativa em vez de harmonizá-la.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Evitou-se o arcaísmo “tu/vós”; a combinação “você” e “vocês” permite conservar a distinção hebraica entre o destinatário singular, Josué, e a comunidade de Israel.
