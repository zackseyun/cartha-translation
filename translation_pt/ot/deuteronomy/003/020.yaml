  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: pt
  text: até que Yahweh dê descanso aos seus irmãos, como deu a vocês,[a] e eles também tomem posse da terra que Yahweh, o Deus de vocês, lhes dá do outro lado do Jordão.[b] Então cada um de vocês poderá voltar para a propriedade que dei a vocês.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos demais israelitas, assim como a vocês”. O hebraico diz literalmente “aos seus irmãos” e deixa elíptico o verbo da comparação.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a oeste do Jordão, do ponto de vista de Moisés, que estava a leste do rio.
    reason: spatial_clarification
  - marker: c
    text: 'Ou: “para a herança que dei a vocês”. Aqui, “propriedade” designa a terra recebida como herança ou lote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: dê descanso
  rationale: O hifil de נוח expressa causar descanso ou alívio. “Dê descanso” preserva o tema de segurança estabelecida na terra e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לַאֲחֵיכֶם
  choice: aos seus irmãos
  rationale: Preserva o termo masculino de parentesco empregado para os demais membros de Israel; a abrangência coletiva é esclarecida em nota.
- source_word: כָכֶם
  choice: como deu a vocês
  rationale: 'Explicita de modo natural a comparação elíptica: Yahweh dará aos demais israelitas o descanso já concedido aos destinatários.'
- source_word: וְיָרְשׁוּ
  choice: tomem posse de
  rationale: Comunica a aquisição concreta da terra no contexto de sua distribuição, sem reduzir o verbo à ideia de herança passiva.
- source_word: גַם הֵם
  choice: eles também
  rationale: Mantém a ênfase de que os israelitas do lado ocidental igualmente receberão sua terra.
- source_word: נֹתֵן
  choice: lhes dá
  rationale: O presente português expressa naturalmente a ação divina apresentada pelo particípio hebraico como certa e em curso.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: Expressão espacial natural em português e relativa à posição de Moisés, a leste do rio.
- source_word: וְשַׁבְתֶּם
  choice: Então ... poderá voltar
  rationale: Marca a sequência e expressa a permissão contextual para regressar depois de cumprida a obrigação militar.
- source_word: אִישׁ
  choice: cada um de vocês
  rationale: Reproduz de modo idiomático o valor distributivo do substantivo, cujo referente são os homens interpelados.
- source_word: לִירֻשָּׁתוֹ
  choice: para a propriedade
  rationale: Expressa a posse territorial recebida por lote; “herança” continua sendo uma alternativa legítima.
- source_word: נָתַתִּי לָכֶם
  choice: que lhes dei
  rationale: O perfeito hebraico aponta para a concessão já realizada da terra a leste do Jordão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Linguagem masculina em לַאֲחֵיכֶם e אִישׁ
  choice: Manter “irmãos” e traduzir אִישׁ distributivamente como “cada um de vocês”
  alternative: “demais israelitas” e “cada homem”
  rationale: “Irmãos” conserva a forma masculina representativa da fonte, enquanto “cada um de vocês” transmite naturalmente a distribuição individual sem alterar o grupo masculino interpelado.
- issue: Agente da concessão final da propriedade
  choice: 'Preservar a primeira pessoa: “que lhes dei”'
  alternative: 'Harmonizar como concessão divina: “que Yahweh lhes deu”'
  rationale: O texto massorético muda para a primeira pessoa singular, referindo-se mais naturalmente à concessão feita por Moisés; a mudança de pessoa não deve ser eliminada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “Yahweh”, a imagem do descanso, o parentesco masculino do hebraico e a mudança final para a primeira pessoa de Moisés. A pontuação das notas foi ajustada para que todos os marcadores apareçam claramente no texto principal.
