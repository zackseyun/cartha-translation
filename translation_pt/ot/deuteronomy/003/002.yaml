base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: pt
  text: 'E Yahweh me disse: “Não tenha medo dele, pois eu o entreguei em sua mão, juntamente com todo o seu povo e sua terra. Você fará com ele exatamente como fez com Seom, rei dos amorreus, que morava em Hesbom.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Não tenha medo dele
  rationale: Expressa de modo natural em português a proibição e mantém explícito o objeto masculino presente no hebraico.
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: eu o entreguei em suas mãos
  rationale: Mantém a imagem hebraica das mãos como esfera de poder, usando uma formulação corrente em português; o perfeito apresenta a entrega como já realizada da perspectiva divina.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: com todo o seu povo e a sua terra
  rationale: Preserva a abrangência de עַם como povo, sem restringi-lo ao exército, e traduz אֶרֶץ diretamente como terra.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Você fará com ele exatamente como fez
  rationale: Conserva o verbo amplo עשה sem explicitar além do texto qual ação será praticada, enquanto a comparação fornece seu conteúdo.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: com Seom, rei dos amorreus
  rationale: Usa as formas portuguesas tradicionais dos nomes e mantém a construção apositiva do hebraico.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: que morava em Hesbom
  rationale: Traduz o particípio de ישב como residência habitual em linguagem moderna e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome divino pessoal sem substituí-lo por um título ou adotar a forma híbrida tradicional Jeová.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para o singular dirigido a Moisés e preserva a imagem semítica de entrega “nas mãos” sem tornar a frase artificial.
