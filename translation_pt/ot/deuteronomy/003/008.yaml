base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: pt
  text: Naquele tempo, tomamos das mãos dos dois reis dos amorreus que estavam além do Jordão a terra, desde o vale do Arnom[a] até o monte Hermom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde o ribeiro do Arnom” ou “desde o rio Arnom”. A palavra hebraica נחל pode indicar um vale, o leito de uma corrente ou um curso de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: tomamos
  rationale: O qal narrativo de לקח indica que Israel tomou posse do território; “tomamos” é natural e não acrescenta uma ênfase militar ausente do verbo.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Expressão temporal corrente, clara e adequada à retomada narrativa.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se ao território delimitado conquistado dos reis amorreus; “a terra” preserva o termo amplo do hebraico.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Mantém a imagem idiomática hebraica de posse ou domínio, que também é compreensível em português.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: os dois reis dos amorreus
  rationale: Reproduz naturalmente a construção hebraica e identifica o povo sobre o qual reinavam.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: que ficava além do Jordão
  rationale: O relativo concorda mais naturalmente com “a terra”; “além do Jordão” conserva a perspectiva geográfica do original.
- source_word: מִנַּחַל אַרְנֹן
  choice: desde o vale do Arnom
  rationale: נחל pode designar vale, leito de corrente ou curso de água. “Vale” é inteligível em português e evita pressupor um rio perene; a nota preserva as alternativas.
- source_word: עַד הַר חֶרְמוֹן
  choice: até o monte Hermom
  rationale: Expressa de modo direto o limite territorial marcado por עַד e usa as formas portuguesas correntes dos topônimos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preservou-se a imagem semítica “das mãos”, enquanto a oração relativa foi ligada explicitamente à terra para evitar a impressão de que os reis estavam geograficamente além do Jordão.
