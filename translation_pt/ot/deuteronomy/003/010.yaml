base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/010.yaml
  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: pt
  text: todas as cidades do planalto[a], toda Gileade e todo Basã, até Salca e Edrei, as cidades do reino de Ogue em Basã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da planície” ou “do platô”. O termo hebraico se refere à região elevada e relativamente plana a leste do Jordão.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: todas as cidades do planalto
  rationale: O quantificador abrange a totalidade das cidades, e מִישׁוֹר designa aqui a região elevada e relativamente plana a leste do Jordão; “planalto” comunica melhor essa topografia do que o genérico “planície”.
- source_word: וְכָל הַגִּלְעָד
  choice: toda Gileade
  rationale: Mantém o valor abrangente de כֹּל e usa a forma tradicional e reconhecível do topônimo em português.
- source_word: וְכָל הַבָּשָׁן
  choice: e todo Basã
  rationale: Preserva a coordenação e a abrangência territorial do hebraico, com a forma portuguesa consagrada do topônimo.
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: até Salca e Edrei
  rationale: עַד indica o limite da extensão geográfica; “até” é natural e preciso. Os topônimos seguem formas legíveis em português.
- source_word: עָרֵי מַמְלֶכֶת עוֹג
  choice: as cidades do reino de Ogue
  rationale: Reproduz a cadeia construta de modo transparente; o artigo explicita naturalmente em português a aposição que identifica as cidades mencionadas.
- source_word: בַּבָּשָׁן
  choice: em Basã
  rationale: 'A preposição בְּ marca localização: o reino de Ogue situava-se em Basã.'
