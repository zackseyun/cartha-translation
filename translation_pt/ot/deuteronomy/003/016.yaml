  text: וְ/לָ/רֻאוּבֵנִ֨י וְ/לַ/גָּדִ֜י נָתַ֤תִּי מִן הַ/גִּלְעָד֙ וְ/עַד נַ֣חַל אַרְנֹ֔ן תּ֥וֹךְ הַ/נַּ֖חַל וּ/גְבֻ֑ל וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: pt
  text: Aos rubenitas e aos gaditas dei território desde Gileade até o vale do Arnom, tendo o meio do vale como limite, e até o vale do Jaboque[a], a fronteira dos filhos de Amom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico נחל pode indicar um riacho, um uádi ou o vale associado a ele. Aqui se usa “vale” por causa da referência ao “meio do vale” como limite.
    reason: lexical_alternative
  - marker: b
    text: Ou “a fronteira dos amonitas”. O hebraico diz literalmente “os filhos de Amom”, expressão de parentesco que designa o povo de Amom.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי
  choice: aos rubenitas
  rationale: O gentílico hebraico designa o grupo tribal descendente de Rúben; “rubenitas” é conciso e corrente em português bíblico.
- source_word: לַגָּדִי
  choice: aos gaditas
  rationale: O gentílico refere-se ao grupo tribal de Gade, não apenas ao ancestral individual.
- source_word: נָתַתִּי
  choice: dei
  rationale: Mantém o sentido básico de נתן sem acrescentar a nuance interpretativa de “designei” ou “concedi”.
- source_word: מִן הַגִּלְעָד
  choice: o território que vai desde Gileade
  rationale: O hebraico marca o ponto inicial da extensão territorial. A explicitação de “o território que vai” produz uma frase natural em português sem alterar o referente implícito.
- source_word: עַד נַחַל אַרְנֹן
  choice: até o vale do Arnom
  rationale: נחל pode indicar curso de água, uádi ou o vale associado; “vale” harmoniza com a referência seguinte ao meio desse acidente geográfico, sem pressupor um rio perene.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: tendo o meio do vale como limite
  rationale: Expressa de modo idiomático a função limítrofe do meio do vale, preservando a formulação topográfica do hebraico.
- source_word: עַד יַבֹּק הַנַּחַל
  choice: até o vale do Jaboque
  rationale: Mantém נחל coerentemente como “vale” na segunda ocorrência e conserva a descrição geográfica da fronteira.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: a fronteira dos filhos de Amom
  rationale: Preserva a expressão hebraica de parentesco בְּנֵי עַמּוֹן, enquanto a nota esclarece seu valor étnico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e amplamente reconhecíveis dos topônimos bíblicos. A sintaxe foi levemente explicitada com “o território que vai” para evitar a construção pouco natural “dei desde Gileade”, sem resolver além do necessário a descrição dos limites.
