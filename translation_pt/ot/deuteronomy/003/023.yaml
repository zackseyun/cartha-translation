  text: וָ/אֶתְחַנַּ֖ן אֶל יְהוָ֑ה בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: pt
  text: 'E, naquele tempo, supliquei a Yahweh[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido por “SENHOR”; alternativamente, “Jeová”.'
    reason: Registra a forma hebraica e as principais convenções de tradução do nome divino.
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: supliquei
  rationale: O hitpael de חנן expressa um pedido insistente por favor ou misericórdia. “Supliquei” é natural em português, mantém a intensidade do verbo e, no pretérito perfeito, corresponde ao fluxo narrativo.
- source_word: אֶל
  choice: a
  rationale: A preposição indica a pessoa a quem a súplica é dirigida. Em português, “suplicar a” é uma construção natural e fiel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Equivalente idiomático e claro da expressão temporal hebraica, sem precisar indevidamente o momento.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a fala direta continuada no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título; “Jeová” representa uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Naquele tempo” favorece a fluidez sem alterar o sentido. A conjunção narrativa וַ־ não recebe um “E” explícito, pois a continuidade é naturalmente expressa pelo contexto em português.
