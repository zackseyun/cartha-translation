  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: pt
  text: E o restante de Gileade e toda Basã, o reino de Ogue, dei à meia tribo de Manassés — toda a região de Argobe, isto é, toda Basã. Essa região é chamada terra dos refains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “terra dos gigantes”. “Refains” é o nome hebraico de um povo antigo associado a essa região.
    reason: Registra a alternativa interpretativa tradicional sem substituir, no texto principal, o nome étnico hebraico.
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: o restante de Gileade
  rationale: Expressa a parte de Gileade que restava depois da concessão mencionada anteriormente, em linguagem natural e fiel.
- source_word: כָל הַבָּשָׁן
  choice: toda Basã
  rationale: Preserva a força abrangente de כָל e usa a forma portuguesa tradicional do topônimo.
- source_word: מַמְלֶכֶת עוֹג
  choice: o reino de Ogue
  rationale: Reproduz diretamente a construção hebraica e emprega a forma portuguesa corrente do nome próprio.
- source_word: נָתַתִּי
  choice: dei
  rationale: Mantém a primeira pessoa e o sentido básico de concessão territorial sem explicitação interpretativa desnecessária.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: à meia tribo de Manassés
  rationale: É uma formulação concisa e reconhecível para a metade da tribo estabelecida nessa região.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: toda a região de Argobe
  rationale: Neste contexto, חֶבֶל designa um território ou distrito, não uma corda; “região” é claro e preciso.
- source_word: לְכָל הַבָּשָׁן
  choice: isto é, toda Basã
  rationale: Entende a expressão como explicativa ou apositiva no contexto, sem acrescentar uma relação geográfica mais específica do que o texto oferece.
- source_word: יִקָּרֵא
  choice: é chamada
  rationale: O imperfeito passivo pode indicar uma designação habitual; o presente português comunica naturalmente que esse era o nome atribuído à região.
- source_word: אֶרֶץ רְפָאִים
  choice: terra dos refains
  rationale: Mantém רְפָאִים como nome de um povo antigo, evitando impor no texto principal a interpretação tradicional “gigantes”.
theological_decisions:
- issue: Se רְפָאִים deve ser traduzido como nome de povo ou interpretado como “gigantes”
  choice: terra dos refains
  alternative: terra dos gigantes
  rationale: No versículo, o termo funciona como designação étnica ligada à região. A transliteração preserva a transparência lexical e deixa a interpretação tradicional para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas bíblicas consolidadas dos nomes próprios. O demonstrativo foi explicitado como “Essa região” para evitar ambiguidade de referência em português. O marcador da nota foi colocado junto a “refains”, termo ao qual a nota efetivamente se refere.
