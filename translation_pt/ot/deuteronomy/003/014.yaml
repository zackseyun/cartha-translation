  text: יָאִ֣יר בֶּן מְנַשֶּׁ֗ה לָקַח֙ אֶת כָּל חֶ֣בֶל אַרְגֹּ֔ב עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּֽעֲכָתִ֑י וַ/יִּקְרָא֩ אֹתָ֨/ם עַל שְׁמ֤/וֹ אֶת הַ/בָּשָׁן֙ חַוֺּ֣ת יָאִ֔יר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: pt
  text: 'Jair, filho de Manassés, tomou toda a região de Argobe, até a fronteira dos gesuritas e dos maacatitas, e chamou esses lugares — isto é, Basã — pelo seu próprio nome: Havote-Jair, até o dia de hoje.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e chamou-os pelo seu próprio nome, a Basã, Havote-Jair”. A sintaxe hebraica é condensada e pode ser entendida de maneiras ligeiramente diferentes.'
    reason: alternative_reading
  - marker: b
    text: Havote-Jair provavelmente significa “aldeias de Jair” ou “acampamentos de tendas de Jair”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבֶל
  choice: região
  rationale: Neste contexto geográfico, designa uma extensão definida de terra. “Região” é natural em português atual e conserva o sentido territorial.
- source_word: אַרְגֹּב
  choice: Argobe
  rationale: Nome geográfico vertido segundo a forma tradicional e naturalizada em português.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: até a fronteira dos gesuritas e dos maacatitas
  rationale: גְּבוּל indica fronteira ou limite; as formas gentílicas são adequadamente expressas como nomes dos povos.
- source_word: וַיִּקְרָא אֹתָם
  choice: chamou esses lugares
  rationale: O sufixo hebraico é masculino plural (“os”). “Esses lugares” preserva o plural e fornece em português um referente compreensível sem o transformar em singular.
- source_word: עַל שְׁמוֹ
  choice: pelo seu próprio nome
  rationale: A expressão idiomática indica que Jair deu aos lugares um nome derivado do seu próprio nome.
- source_word: אֶת הַבָּשָׁן
  choice: a Basã
  rationale: A construção é sintaticamente comprimida e provavelmente identifica, em aposição, a área à qual se deu o nome. A formulação principal mantém essa aposição, e a nota registra a dificuldade.
- source_word: חַוֹּת יָאִיר
  choice: Havote-Jair
  rationale: Trata-se de um topônimo formado por חַוֹּת e Jair. A transliteração preserva sua função como nome geográfico; os possíveis sentidos do primeiro elemento aparecem em nota.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Expressão portuguesa corrente que indica a permanência do nome até o tempo do narrador.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas geográficas legíveis para o público brasileiro e internacional. O plural do objeto hebraico foi conservado por meio de “esses lugares”, enquanto os travessões sinalizam a aposição difícil sem resolver em excesso a ambiguidade do original.
