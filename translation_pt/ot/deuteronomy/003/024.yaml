  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: pt
  text: Ó Senhor Yahweh[a], começaste a mostrar ao teu servo a tua grandeza e a tua mão forte. Pois que deus há nos céus ou na terra que possa realizar feitos como os teus e atos poderosos como os teus?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Adonai YHWH, isto é, «Senhor YHWH». «Yahweh» é uma representação comum do nome divino; sua pronúncia antiga exata não é inteiramente certa. Na leitura judaica, YHWH é tradicionalmente substituído por «Adonai»; nesta combinação, em que «Adonai» já aparece antes do nome, costuma-se ler «Elohim».'
    reason: Esclarece a combinação dos dois títulos/nome, a incerteza legítima quanto à pronúncia do Tetragrama e a leitura tradicional específica desta combinação.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Ó Senhor Yahweh
  rationale: Mantém distintos o título אֲדֹנָי, “Senhor”, e o nome divino יהוה, transliterado como “Yahweh”, sem produzir a sequência ambígua “Senhor SENHOR”.
- source_word: הַחִלּוֹתָ
  choice: começaste
  rationale: O hifil perfeito expressa o início de uma ação já realizada; no contexto da oração de Moisés, o pretérito perfeito é natural e preserva a ideia de que a revelação das obras divinas apenas começou.
- source_word: לְהַרְאוֹת
  choice: a mostrar
  rationale: O hifil de ראה tem sentido causativo, “mostrar” ou “fazer ver”; “mostrar” é direto e idiomático.
- source_word: עַבְדְּךָ
  choice: ao teu servo
  rationale: “Servo” comunica adequadamente a relação de submissão e serviço de Moisés diante de Deus neste contexto de oração.
- source_word: גָּדְלְךָ
  choice: a tua grandeza
  rationale: Tradução direta do substantivo, preservando sua referência ampla à magnitude e majestade divinas.
- source_word: יָדְךָ הַחֲזָקָה
  choice: a tua mão forte
  rationale: Preserva de perto a metáfora hebraica tradicional para o poder divino em ação e traduz חֲזָקָה diretamente como “forte”.
- source_word: מִי אֵל
  choice: que deus há
  rationale: Formula naturalmente em português a pergunta retórica sobre a existência de qualquer divindade comparável.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: nos céus ou na terra
  rationale: “Céus” reflete a forma plural hebraica; “ou” explicita em português o alcance distributivo da pergunta retórica sem alterar seu sentido totalizante.
- source_word: יַעֲשֶׂה
  choice: possa realizar
  rationale: Embora a forma seja imperfeita, a pergunta retórica focaliza capacidade ou possibilidade; “possa realizar” expressa essa força modal.
- source_word: כְמַעֲשֶׂיךָ
  choice: feitos como os teus
  rationale: “Feitos” traduz מַעֲשִׂים de modo claro e evita uma repetição pouco natural, mantendo a comparação explícita.
- source_word: וְכִגְבוּרֹתֶיךָ
  choice: e atos poderosos como os teus
  rationale: Expressa as manifestações concretas de poder indicadas por גְּבוּרוֹת e conserva o paralelismo com “feitos”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Ó Senhor Yahweh
  alternative: Ó Senhor DEUS; Ó Senhor, o SENHOR
  rationale: A escolha conserva simultaneamente o título reverencial e o nome pessoal divino presente no hebraico. A nota registra a forma original e a pronúncia tradicional sem impor uma reconstrução totalmente indiscutida.
- issue: Referência retórica a outros deuses em מִי אֵל
  choice: que deus há
  alternative: quem é Deus
  rationale: O substantivo אֵל aparece sem artigo e a pergunta compara qualquer suposta divindade com Yahweh; a tradução preserva essa retórica sem afirmar equivalência real entre elas.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa singular coerentes com a oração dirigida diretamente a Deus. A construção mantém o paralelismo hebraico, mas evita rigidez excessiva.
