  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: pt
  text: também a Arabá, tendo o Jordão como fronteira, desde Quinerete até o mar da Arabá, o mar Salgado[a], abaixo das encostas de Pisga, a leste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o Mar Morto.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: a Arabá
  rationale: Mantém o nome geográfico da região do vale do Jordão, em vez do sentido genérico de «planície».
- source_word: הַיַּרְדֵּן
  choice: o Jordão
  rationale: Usa o nome geográfico consagrado; «rio» está implícito e não precisa ser acrescentado.
- source_word: גְבֻל
  choice: como fronteira
  rationale: Explicita de modo natural a relação elíptica do hebraico sem ampliar seu sentido.
- source_word: מִכִּנֶּרֶת
  choice: desde Quinerete
  rationale: Translitera o topônimo sem especificar se o referente é a cidade, a região ou o lago, preservando a concisão do hebraico.
- source_word: יָם הָעֲרָבָה
  choice: o mar da Arabá
  rationale: Reproduz a designação hebraica e conserva sua relação com a explicação seguinte.
- source_word: יָם הַמֶּלַח
  choice: o mar de Sal
  rationale: Traduz diretamente a expressão hebraica; o nome moderno mais conhecido é indicado em nota.
- source_word: תַּחַת
  choice: abaixo
  rationale: Expressa a relação topográfica sem convertê-la indevidamente em uma direção cardinal.
- source_word: אַשְׁדֹּת
  choice: as encostas de
  rationale: No contexto geográfico, designa declives ou encostas; esta opção é clara e adequada ao relevo de Pisga.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Trata o termo como topônimo e emprega uma transliteração natural em português.
- source_word: מִזְרָחָה
  choice: a leste
  rationale: Conserva a orientação geográfica em português corrente, sem determinar além do que o hebraico permite.
