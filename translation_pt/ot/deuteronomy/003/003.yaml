source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: pt
  text: Assim, Yahweh, nosso Deus, também entregou em nossas mãos Ogue, rei de Basã, e todo o seu povo; nós o golpeamos, sem lhe deixar sobrevivente algum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “até não deixar sobrevivente algum para ele”.'
    reason: 'A construção hebraica exprime o resultado da ação contra Ogue: nenhum sobrevivente lhe foi deixado.'
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: entregou
  rationale: No contexto militar, נתן com בְּיָד expressa a entrega do inimigo ao poder de alguém. “Entregou em nossas mãos” conserva a imagem hebraica e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בְּיָדֵנוּ
  choice: em nossas mãos
  rationale: Mantém o idioma hebraico de sujeição ou domínio militar; o plural é a forma idiomática corrente em português.
- source_word: גַּם
  choice: também
  rationale: Expressa a força aditiva que liga a derrota de Ogue à vitória anterior sobre Seom.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogue, rei de Basã
  rationale: Emprega as formas portuguesas correntes do nome próprio e da região, com o título real em aposição.
- source_word: כָּל עַמּוֹ
  choice: todo o seu povo
  rationale: עַם é mais amplo que “exército”; embora o contexto seja militar, a tradução não restringe indevidamente o referente.
- source_word: וַנַּכֵּהוּ
  choice: Nós o derrotamos
  rationale: Em narrativa de guerra, נכה pode indicar golpear ou derrotar. “Derrotamos” comunica naturalmente o resultado militar, enquanto o pronome singular preserva Ogue como objeto representativo.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: até não lhe deixarmos sobrevivente algum
  rationale: Preserva a construção final/resultativa, o pronome referente a Ogue e a afirmação enfática de que nenhum sobrevivente permaneceu.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A forma escolhida preserva o nome pessoal presente no texto hebraico, sem o substituir por um título.
- issue: Extensão da linguagem de derrota
  choice: até não lhe deixarmos sobrevivente algum
  alternative: até que não lhe restou sobrevivente algum
  rationale: A tradução mantém sem atenuação a totalidade da destruição militar descrita no hebraico, mas não acrescenta explicação teológica nem especifica além do que diz o texto.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A pontuação divide as duas ações principais para evitar uma frase excessivamente longa. “Em nossas mãos” e “sobrevivente algum” conservam as imagens e a ênfase do hebraico sem rigidez artificial.
