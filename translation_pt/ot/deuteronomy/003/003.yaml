revisions:
- from: Assim, Yahweh, nosso Deus, também entregou em nossas mãos Ogue, rei de Basã, e todo o seu povo. Nós o derrotamos, até não lhe deixarmos sobrevivente algum.[a]
  to: Assim, Yahweh, nosso Deus, também entregou em nossas mãos Ogue, rei de Basã, e todo o seu povo; nós o golpeamos, sem lhe deixar sobrevivente algum.[a]
  rationale: A revisão substitui um termo mais genérico de vitória por «golpeamos», que corresponde mais de perto ao verbo hebraico de combate, e reformula a oração final para um português moderno mais fluente. A nota preserva a estrutura resultativa mais literal, incluindo a referência a Ogue em «para ele».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:02:30Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva Yahweh, a entrega militar «em nossas mãos», a identificação de Ogue e de todo o seu povo, bem como a afirmação de que não restou sobrevivente. Contudo, «derrotamos» é mais abstrato que וַנַּכֵּהוּ, que conserva a imagem de golpear/ferir em contexto de batalha.
  naturalness: «Até não lhe deixarmos sobrevivente algum» é compreensível, mas a construção com infinitivo pessoal após «até» soa um pouco rígida no português moderno. «Sem lhe deixar sobrevivente algum» é mais fluente e mantém o resultado total expresso pela construção hebraica.
  terminology: «Yahweh», «Ogue», «Basã» e «todo o seu povo» são adequados ao registro e à fidelidade lexical. «Golpeamos» preserva melhor o verbo de combate do que «derrotamos», sem introduzir interpretação adicional.
  issues:
  - severity: low
    issue: «Derrotamos» atenua a imagem verbal de combate.
    rationale: נכה significa primariamente golpear/ferir e, neste contexto, descreve a ação militar contra Ogue. «Golpeamos» preserva melhor essa formulação.
  - severity: low
    issue: A sequência «até não lhe deixarmos» é pouco idiomática no português moderno.
    rationale: Embora defensável como reprodução da estrutura hebraica, «sem lhe deixar» comunica com mais naturalidade o resultado absoluto da ação.
  revised_text: Assim, Yahweh, nosso Deus, também entregou em nossas mãos Ogue, rei de Basã, e todo o seu povo; nós o golpeamos, sem lhe deixar sobrevivente algum.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “até não deixar sobrevivente algum para ele”.'
    reason: 'A construção hebraica exprime o resultado da ação contra Ogue: nenhum sobrevivente lhe foi deixado.'
  revision_rationale: A revisão substitui um termo mais genérico de vitória por «golpeamos», que corresponde mais de perto ao verbo hebraico de combate, e reformula a oração final para um português moderno mais fluente. A nota preserva a estrutura resultativa mais literal, incluindo a referência a Ogue em «para ele».
