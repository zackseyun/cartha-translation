  text: כָּל אֵ֜לֶּה עָרִ֧ים בְּצֻר֛וֹת חוֹמָ֥ה גְבֹהָ֖ה דְּלָתַ֣יִם וּ/בְרִ֑יחַ לְ/בַ֛ד מֵ/עָרֵ֥י הַ/פְּרָזִ֖י הַרְבֵּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/005.yaml
  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
translation:
  language: pt
  text: Todas essas eram cidades fortificadas, com muralha alta, portas duplas e trancas, além de muitíssimas povoações sem muralhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “povoações em campo aberto”. O hebraico contrasta esses assentamentos com as cidades fortificadas descritas anteriormente.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻר֛וֹת
  choice: fortificadas
  rationale: O adjetivo derivado de בצר descreve cidades protegidas e reforçadas contra ataques; “fortificadas” é preciso e natural em português.
- source_word: חוֹמָ֥ה גְבֹהָ֖ה
  choice: com muralha alta
  rationale: Preserva o singular hebraico e expressa de modo natural a principal defesa que cercava cada cidade.
- source_word: דְּלָתַ֣יִם
  choice: portas duplas
  rationale: A forma dual indica literalmente duas folhas de porta; “portas duplas” conserva essa nuance, embora no contexto sejam portas de acesso à cidade.
- source_word: וּבְרִ֑יחַ
  choice: e trancas
  rationale: בריח designa a barra usada para travar portas; o plural português funciona coletivamente para as diversas entradas das cidades.
- source_word: לְבַ֛ד
  choice: além de
  rationale: A expressão introduz assentamentos adicionais, não incluídos entre as cidades fortificadas.
- source_word: מֵעָרֵ֥י הַפְּרָזִ֖י
  choice: povoações sem muralhas
  rationale: O sintagma contrasta assentamentos abertos com as cidades fortificadas. “Povoações sem muralhas” torna explícito e claro o contraste lexical, preservando em nota a alternativa ligada ao campo aberto.
- source_word: הַרְבֵּ֥ה מְאֹֽד
  choice: muitíssimas
  rationale: O superlativo sintético transmite de maneira concisa e natural a forte intensificação quantitativa do hebraico.
- source_word: כָּל אֵ֜לֶּה עָרִ֧ים
  choice: Todas essas eram cidades
  rationale: O verbo copulativo exigido pelo português é suprido sem alterar a ênfase inicial de “todas essas”.
