  text: וּ/לְ/מָכִ֖יר נָתַ֥תִּי אֶת הַ/גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/015.yaml
  text: And to Machir I gave Gilead[a].
translation:
  language: pt
  text: E a Maquir dei Gileade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o Gileade”, com artigo definido; em português, o nome do lugar é normalmente expresso simplesmente como “Gileade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: E a Maquir
  rationale: A conjunção וּ liga esta declaração à distribuição narrada no contexto, e a preposição לְ indica o destinatário. O nome pessoal מָכִיר é transliterado na forma portuguesa tradicional, “Maquir”.
- source_word: נָתַתִּי
  choice: dei
  rationale: O qal perfeito na primeira pessoa do singular de נתן expressa aqui uma ação passada na recordação narrativa; “dei” é a correspondência mais direta e natural.
- source_word: אֶת
  choice: '[marcador de objeto direto não traduzido]'
  rationale: A partícula assinala o objeto direto definido e não requer equivalente independente em português.
- source_word: הַגִּלְעָד
  choice: Gileade
  rationale: Embora o hebraico traga o artigo definido, em português o topônimo estabelecido “Gileade” ocorre naturalmente sem artigo neste contexto. A forma evita acrescentar a especificação interpretativa “região montanhosa”.
theological_decisions: []
translation_notes:
  register: Tradução concisa, digna e corrente, com sintaxe natural em português e preservação da ligação narrativa marcada pela conjunção inicial.
