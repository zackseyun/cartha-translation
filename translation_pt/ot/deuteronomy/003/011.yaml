source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: pt
  text: Pois somente Ogue, rei de Basã, havia restado do remanescente dos refains[a]. Eis o seu leito, um leito de ferro. Não está ele em Rabá dos amonitas? Tinha nove côvados de comprimento e quatro côvados de largura[b], segundo o côvado de um homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gigantes”. O hebraico diz “refains”, provavelmente o nome de um povo antigo associado a grande estatura.
    reason: alternative_reading
  - marker: b
    text: Ou “segundo o côvado comum”. O hebraico diz literalmente “segundo o côvado de um homem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: somente
  rationale: 'Expressa a exclusividade: Ogue era o único que havia restado desse remanescente.'
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: havia restado do remanescente
  rationale: Reproduz de modo natural em português o verbo de permanência e a relação com o restante dos refains.
- source_word: הָרְפָאִים
  choice: os refains
  rationale: Preserva como designação de um povo ou grupo antigo o termo hebraico, sem impor no texto principal a interpretação 'gigantes'.
- source_word: הִנֵּה
  choice: Vejam
  rationale: Mantém a força demonstrativa que chama a atenção para o objeto apresentado como evidência, em linguagem moderna.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: seu leito era um leito
  rationale: Conserva a repetição enfática do substantivo hebraico; 'leito' é digno e natural neste contexto.
- source_word: בַּרְזֶל
  choice: ferro
  rationale: Tradução direta do material mencionado.
- source_word: הֲלֹה הִוא
  choice: Não está ele
  rationale: Preserva a pergunta retórica que apela para um objeto conhecido dos leitores.
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: em Rabá dos amonitas
  rationale: Usa a forma portuguesa tradicional do topônimo e verte idiomaticamente a referência aos filhos de Amom.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: nove côvados ... quatro côvados
  rationale: Mantém a unidade antiga, evitando conversão moderna com falsa precisão.
- source_word: בְּאַמַּת אִישׁ
  choice: segundo o côvado de um homem
  rationale: Preserva de perto a expressão hebraica e deixa sua possível referência ao côvado comum explicitada em nota.
theological_decisions:
- issue: Se הָרְפָאִים deve ser traduzido interpretativamente como 'gigantes' ou preservado como nome de grupo
  choice: os refains
  alternative: os gigantes
  rationale: O termo hebraico designa um povo ou categoria conhecida no Antigo Testamento. A transliteração evita transformar em tradução uma inferência sobre sua grande estatura.
- issue: Se עֶרֶשׂ designa aqui um leito ou um objeto funerário
  choice: leito
  alternative: esquife ou sarcófago
  rationale: As dimensões do objeto servem naturalmente para destacar o tamanho extraordinário de Ogue; sentidos funerários são possíveis em discussões lexicais, mas não são exigidos pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantêm-se o nome étnico 'refains', a antiga unidade 'côvado', a repetição de 'leito' e a pergunta retórica do hebraico.
