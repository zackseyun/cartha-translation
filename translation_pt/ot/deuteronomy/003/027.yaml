  text: עֲלֵ֣ה רֹ֣אשׁ הַ/פִּסְגָּ֗ה וְ/שָׂ֥א עֵינֶ֛י/ךָ יָ֧מָּ/ה וְ/צָפֹ֛נָ/ה וְ/תֵימָ֥נָ/ה וּ/מִזְרָ֖חָ/ה וּ/רְאֵ֣ה בְ/עֵינֶ֑י/ךָ כִּי לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: pt
  text: Suba ao topo do Pisga e erga os olhos para o oeste[a], para o norte, para o sul e para o leste. Veja com os próprios olhos, pois você não atravessará este Jordão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “em direção ao mar”, modo convencional de dizer “para o oeste”.
    reason: cultural_note
  - marker: b
    text: Ou “este rio Jordão”. O hebraico diz simplesmente “este Jordão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Suba
  rationale: O imperativo qal de עלה ordena um movimento para cima. “Suba” é natural, direto e preserva a força direcional.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: ao topo do Pisga
  rationale: רֹאשׁ significa “cabeça/topo”, e הַפִּסְגָּה designa Pisga. “Topo do Pisga” é idiomático e mantém a referência geográfica.
- source_word: וְשָׂא עֵינֶיךָ
  choice: erga os olhos
  rationale: A expressão hebraica indica dirigir o olhar. “Erga os olhos” conserva sua qualidade concreta e literária em português atual.
- source_word: יָמָּה
  choice: para o oeste
  rationale: A forma direcional derivada de ים, “mar”, convencionalmente indica o oeste no contexto geográfico israelita. A tradução explicita a direção pretendida.
- source_word: וְצָפֹנָה
  choice: para o norte
  rationale: Forma direcional que significa “para o norte”; integra naturalmente a sequência dos pontos cardeais.
- source_word: וְתֵימָנָה
  choice: para o sul
  rationale: Neste contexto, a forma de תימן indica claramente o ponto cardeal sul, não a região de Temã.
- source_word: וּמִזְרָחָה
  choice: para o leste
  rationale: A forma direcional de מזרח indica o leste, literalmente associado ao nascer do sol. “Para o leste” é claro e corrente.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: Veja com os próprios olhos
  rationale: Mantém a repetição enfática de “olhos” no hebraico. “Próprios” torna natural em português a ênfase do original sem eliminar sua força.
- source_word: כִּי לֹא תַעֲבֹר
  choice: pois você não atravessará
  rationale: כִּי introduz a razão da ordem anterior, e עבר, em relação ao Jordão, significa naturalmente “atravessar”.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: este Jordão
  rationale: Preserva o demonstrativo הַזֶּה e a formulação concisa do hebraico, que não explicita a palavra “rio”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a sequência enfática dos quatro pontos cardeais, a repetição de “olhos” e o demonstrativo “este”, evitando solenidade arcaizante.
