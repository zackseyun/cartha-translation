base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: pt
  text: Então nos viramos e subimos pelo caminho de Basã[a]. Ogue, rei de Basã, saiu ao nosso encontro com todo o seu povo para a batalha em Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela estrada para Basã”. O idioma hebraico diz literalmente “o caminho de Basã”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Então nos viramos
  rationale: O verbo פנה indica virar ou mudar de direção; “Então” expressa naturalmente a sequência narrativa do wayyiqtol.
- source_word: וַנַּעַל
  choice: subimos
  rationale: עלה preserva a ideia direcional de subir, sem recorrer ao mais formal “ascendemos”.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: pelo caminho de Basã
  rationale: Mantém de perto o idioma hebraico, que pode designar a rota para a região ou através dela; a ambiguidade é registrada em nota.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: יצא significa sair; o contexto já explicita a finalidade militar, portanto não se acrescenta “marchou”.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogue, rei de Basã
  rationale: A cadeia construta é vertida por aposição natural em português, com a forma portuguesa tradicional e legível do nome próprio.
- source_word: לִקְרָאתֵנוּ
  choice: ao nosso encontro
  rationale: Preserva o sentido básico da expressão לקראת; “para a batalha” torna explícito que o encontro era hostil.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: com todo o seu povo
  rationale: עם é o termo amplo “povo”; evita-se restringi-lo interpretativamente a “exército” ou “tropas”. O português natural expressa a participação conjunta com “com”.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: מלחמה pode significar guerra ou batalha; aqui se refere ao confronto específico.
- source_word: אֶדְרֶעִי
  choice: em Edrei
  rationale: Embora sem preposição expressa, o topônimo final funciona adverbialmente como local do confronto.
theological_decisions: []
