base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: pt
  text: Mas dê ordens a Josué[a], fortaleça-o e encoraje-o[b], pois ele atravessará à frente deste povo e fará com que eles recebam como herança[c] a terra que você verá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encarregue Josué”. O verbo hebraico pode indicar a atribuição formal de uma responsabilidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “torne-o forte e corajoso”. Os dois verbos formam uma exortação à firmeza e à coragem.
    reason: lexical_alternative
  - marker: c
    text: 'Ou “dará a eles a terra como herança”. O verbo hebraico é causativo: Josué será o agente por meio de quem o povo tomará posse de sua herança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: encarregue Josué
  rationale: O piel imperativo de צוה pode expressar uma incumbência formal. “Encarregue” comunica a atribuição oficial de responsabilidade e liderança sem restringir o sentido a uma ordem isolada.
- source_word: וְחַזְּקֵהוּ וְאַמְּצֵהוּ
  choice: fortaleça-o e encoraje-o
  rationale: A combinação preserva as ideias complementares de tornar firme e infundir coragem, em português natural.
- source_word: כִּי הוּא יַעֲבֹר
  choice: pois ele atravessará
  rationale: עבר se refere aqui à travessia do Jordão; “atravessará” é direto e contextualmente claro.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: à frente deste povo
  rationale: Preserva tanto a noção espacial quanto a possível implicação de liderança de לִפְנֵי, sem explicitá-la além do hebraico.
- source_word: וְהוּא יַנְחִיל אוֹתָם
  choice: e fará com que eles recebam como herança
  rationale: 'Expressa o valor causativo do hiphil de נחל: Josué será o agente por meio de quem o povo receberá sua herança.'
- source_word: אֶת הָאָרֶץ אֲשֶׁר תִּרְאֶה
  choice: a terra que você verá
  rationale: Mantém a referência simples à terra e traduz o imperfeito de ראה naturalmente como futuro no contexto do que Moisés ainda verá.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A forma de tratamento “você” torna natural a referência singular a Moisés. A redação conserva a repetição enfática de “ele” apenas onde necessária em português e mantém a ambiguidade espacial e de liderança em “à frente deste povo”.
