base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: pt
  text: Deixa-me, por favor, atravessar e ver a boa terra que fica além do Jordão, esta boa região montanhosa[a] e o Líbano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este bom monte”. O hebraico pode referir-se tanto a um monte específico como à região montanhosa a oeste do Jordão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Deixa-me atravessar
  rationale: O coortativo qal na primeira pessoa expressa o pedido e o desejo de Moisés, não um simples futuro. A formulação preserva essa nuance volitiva em português natural.
- source_word: נָּא
  choice: por favor
  rationale: A partícula torna o pedido mais suplicante. “Por favor” comunica esse tom de modo atual e claro.
- source_word: וְאֶרְאֶה
  choice: e ver
  rationale: O segundo coortativo, coordenado ao primeiro, indica o propósito ou resultado desejado da travessia. O infinitivo depois de “deixa-me” produz uma construção natural em português.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: a boa terra
  rationale: No contexto territorial de Deuteronômio, אֶרֶץ designa a terra prometida. “Boa terra” mantém a expressão característica do livro.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: que fica além do Jordão
  rationale: A expressão indica a região do outro lado do Jordão, vista da posição de Moisés a leste do rio. “Além do Jordão” é conciso, natural e mantém o ponto de vista geográfico.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: esta boa região montanhosa
  rationale: הָר pode designar tanto um monte específico como, coletivamente, uma região montanhosa. Neste contexto de descrição territorial, o sentido regional parece mais provável, sem eliminar a alternativa por meio de nota.
- source_word: וְהַלְּבָנוֹן
  choice: e o Líbano
  rationale: O topônimo é vertido segundo sua forma portuguesa estabelecida, com o artigo normalmente usado em português.
theological_decisions:
- issue: 'Sentido geográfico de הָהָר: monte específico ou região montanhosa'
  choice: esta boa região montanhosa
  alternative: este bom monte
  rationale: O singular hebraico pode ter valor coletivo e referir-se às terras altas de Canaã. A descrição ampla da terra e a menção do Líbano favorecem o sentido regional, mas a nota preserva a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. “Deixa-me, por favor” conserva o tom pessoal e suplicante sem recorrer a linguagem arcaica. A nota foi colocada imediatamente após a expressão ambígua a que se refere.
