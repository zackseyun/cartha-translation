base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: pt
  text: Naquele tempo, tomamos posse desta terra[a], desde Aroer, que fica junto ao vale do Arnom, até a metade da região montanhosa de Gileade, com suas cidades[b]; eu a dei aos rubenitas e aos gaditas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Naquele tempo, passamos a possuir esta terra”. O verbo hebraico pode indicar tomar posse, ocupar ou possuir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a metade do monte Gileade”. Em descrições territoriais, o hebraico הַר também pode designar uma região montanhosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: tomamos posse
  rationale: No contexto de conquista e distribuição territorial, ירשׁ indica adquirir ou ocupar efetivamente a terra, não apenas herdá-la de modo passivo.
- source_word: הָאָרֶץ הַזֹּאת
  choice: desta terra
  rationale: “Terra” é claro e natural para o território conquistado; a contração com “de” integra a expressão ao português corrente.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Expressão temporal idiomática que preserva o sentido direto do hebraico.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: desde Aroer, que fica junto ao vale do Arnom
  rationale: Mantém o topônimo e a oração relativa. “Junto ao vale do Arnom” expressa עַל de modo geograficamente natural sem afirmar que a cidade ficava dentro do vale.
- source_word: נַחַל
  choice: vale
  rationale: Neste contexto geográfico, נחל pode indicar o vale ou desfiladeiro de um curso sazonal; “vale” é acessível, enquanto “uádi” é mais técnico.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: até a metade da região montanhosa de Gileade
  rationale: הַר pode designar uma região elevada, não somente um monte isolado. “Região montanhosa” se ajusta à descrição territorial. “Até” explicita em português a extensão iniciada por מִן, sem mudar os limites descritos.
- source_word: וְעָרָיו
  choice: com suas cidades
  rationale: O sufixo remete à região de Gileade; “com suas cidades” é uma formulação territorial natural em português.
- source_word: נָתַתִּי
  choice: eu a dei
  rationale: Preserva a mudança da primeira pessoa do plural para a primeira do singular e retoma “terra” pelo pronome feminino.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: aos rubenitas e aos gaditas
  rationale: As formas gentílicas singulares têm sentido coletivo e designam os grupos tribais.
