source:
  edition: WLC
  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: pt
  text: 'Naquele tempo, ordenei a vocês: “Yahweh, o Deus de vocês, deu a vocês esta terra para tomarem posse dela. Todos vocês, homens aptos para a guerra[c], atravessem armados[a] à frente de seus irmãos, os filhos de Israel[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “preparados para a batalha”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, seus compatriotas israelitas; o hebraico diz literalmente “seus irmãos, os filhos de Israel”.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica designa homens capazes de servir como combatentes, não apenas homens interiormente corajosos.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם
  choice: ordenei a vocês
  rationale: צוה expressa uma ordem ou incumbência. A formulação é direta, natural em português e mantém o destinatário plural.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Expressão temporal narrativa corrente, equivalente ao hebraico sem restringi-la a um único momento pontual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נָתַן לָכֶם
  choice: deu-lhes
  rationale: O perfeito hebraico apresenta a dádiva como ação concluída; o pretérito perfeito é claro e idiomático em português.
- source_word: לְרִשְׁתָּהּ
  choice: para que tomem posse dela
  rationale: ירשׁ, neste contexto territorial e militar, significa adquirir e manter a posse; a formulação evita a possível ideia de recebimento meramente passivo sugerida por 'herdar'.
- source_word: חֲלוּצִים
  choice: armados
  rationale: O termo descreve homens preparados e equipados para ação militar. 'Armados' é conciso, enquanto a alternativa é registrada em nota.
- source_word: תַּעַבְרוּ
  choice: atravessem
  rationale: O imperfeito ocorre em contexto de ordem direta e, por isso, é vertido pelo presente do subjuntivo com força imperativa.
- source_word: לִפְנֵי
  choice: à frente de
  rationale: No movimento militar, indica avançar diante dos demais, não apenas estar fisicamente perante eles.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: seus irmãos, os filhos de Israel
  rationale: Mantém a metáfora familiar e a aposição masculina do hebraico, deixando em nota o sentido contextual de compatriotas israelitas.
- source_word: כָּל בְּנֵי חָיִל
  choice: Todos vocês, homens aptos para a guerra
  rationale: בני חיל designa aqui os homens capazes de servir como combatentes. A tradução comunica a função militar, evitando reduzir a expressão a coragem interior.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. A transliteração preserva essa distinção sem substituir o nome por um título.
- issue: Linguagem masculina em אֲחֵיכֶם, בְּנֵי יִשְׂרָאֵל e בְּנֵי חָיִל
  choice: seus irmãos, os filhos de Israel; homens aptos para a guerra
  alternative: seus compatriotas israelitas; combatentes
  rationale: O contexto dirige a ordem aos homens mobilizados para a guerra. A tradução conserva a forma masculina e a relação familiar do texto, mas esclarece em nota o alcance nacional de 'irmãos'.
- issue: Força verbal de תַּעַבְרוּ
  choice: atravessem
  alternative: vocês atravessarão; vocês deverão atravessar
  rationale: Como o verbo integra a ordem introduzida por 'ordenei', a forma imperativa transmite melhor sua força sem transformar a fala em mera previsão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construções naturais tanto no Brasil quanto em outros contextos lusófonos. Emprega-se 'vocês' para explicitar o plural hebraico e 'deu-lhes' para evitar repetição pesada. A ordem dos constituintes foi levemente ajustada para que 'todos vocês, homens aptos para a guerra' identifique com clareza quem deve atravessar.
