  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: pt
  text: Não tenham medo deles[a], pois Yahweh, o Deus de vocês, é quem luta por vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não os temam.”'
    reason: Alternativa lexical mais formal e concisa para ירא com sufixo pronominal.
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: Não tenham medo deles
  rationale: A negação com o imperfeito expressa proibição. A formulação comunica naturalmente em português o sentido de ירא com o sufixo de terceira pessoa masculina plural.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição; “pois” preserva a relação explicativa em linguagem corrente e digna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: אֱלֹהִים refere-se aqui, no singular, ao Deus de Israel; o sufixo é de segunda pessoa plural. “De vocês” torna inequívoco o plural em português internacional com boa legibilidade brasileira.
- source_word: הוּא הַנִּלְחָם
  choice: é quem luta
  rationale: O pronome independente acrescenta ênfase, e o particípio apresenta Yahweh como aquele que combate em favor do povo.
- source_word: לָכֶם
  choice: por vocês
  rationale: 'A preposição indica benefício ou representação: Yahweh luta em favor deles.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino. “Yahweh” o preserva por transliteração, sem trocá-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, de alcance internacional e leitura natural no Brasil. O plural “vocês” evita a ambiguidade numérica de “seu Deus”; “é quem luta” conserva a ênfase do pronome hebraico.
