  text: וְ/כָל הַ/בְּהֵמָ֛ה וּ/שְׁלַ֥ל הֶ/עָרִ֖ים בַּזּ֥וֹנוּ לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/007.yaml
  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: pt
  text: Mas todos os animais de criação e os despojos das cidades nós tomamos como despojo para nós mesmos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E todos os animais de criação e os despojos das cidades nós saqueamos para nós mesmos.”'
    reason: Alternativa que traduz o waw como simples coordenação (“E”) e usa “saqueamos” para o verbo hebraico בזז.
lexical_decisions:
- source_word: וְ/כָל
  choice: Mas todos
  rationale: 'O waw liga o versículo à destruição mencionada anteriormente e, no contexto, tem leve força adversativa: as pessoas foram destruídas, mas os bens foram preservados como despojo. “Todos” traduz a abrangência de כָּל.'
- source_word: הַ/בְּהֵמָה
  choice: os rebanhos
  rationale: בְּהֵמָה designa aqui os animais domésticos pertencentes às cidades. “Rebanhos” é natural em português e comunica coletivamente os animais de criação, sem restringi-los apenas ao gado bovino.
- source_word: וּ/שְׁלַל
  choice: e os despojos
  rationale: שָׁלָל refere-se aos bens tomados na guerra. “Despojos” conserva o sentido militar e é corrente em registro bíblico digno.
- source_word: הֶ/עָרִים
  choice: das cidades
  rationale: Preserva diretamente a relação construta hebraica, indicando os despojos pertencentes às cidades ou delas retirados.
- source_word: בַּזּוֹנוּ
  choice: nós saqueamos
  rationale: O verbo בזז significa saquear ou tomar como despojo. “Saqueamos” expressa de modo claro e conciso a ação militar, evitando uma formulação redundante com “despojos”.
- source_word: לָֽ/נוּ
  choice: para nós mesmos
  rationale: A preposição com o pronome da primeira pessoa do plural identifica os beneficiários da ação e ressalta que os bens foram tomados para a posse dos israelitas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Despojos” mantém o registro militar bíblico; “saqueamos” torna a ação imediatamente compreensível. O marcador [a] aparece no texto principal.
