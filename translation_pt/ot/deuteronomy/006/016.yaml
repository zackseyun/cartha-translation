  text: לֹ֣א תְנַסּ֔וּ אֶת יְהוָ֖ה אֱלֹהֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר נִסִּיתֶ֖ם בַּ/מַּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: pt
  text: Não ponham Yahweh, o Deus de vocês, à prova,[b] como vocês o puseram à prova em Massá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Massá foi o lugar onde Israel pôs Yahweh à prova no deserto (Êxodo 17:1–7); o nome está associado à ideia de “pôr à prova”.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Não testem Yahweh, o Deus de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תְנַסּוּ
  choice: Não ponham à prova
  rationale: A negação com o imperfeito piel na segunda pessoa do plural expressa uma proibição. “Pôr à prova” comunica naturalmente o ato de testar Deus e preserva a força da advertência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: O substantivo com sufixo de segunda pessoa masculina plural significa literalmente “Deus de vocês”; “seu Deus” é natural e amplamente compreensível no português moderno.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Introduz a comparação com a ação anterior de Israel.
- source_word: נִסִּיתֶם
  choice: vocês o puseram à prova
  rationale: Repete o mesmo verbo נסה; a repetição de “puseram à prova” preserva o vínculo lexical explícito do hebraico. O pronome “o” retoma Yahweh de modo natural em português.
- source_word: בַּמַּסָּה
  choice: em Massá
  rationale: Mantém o topônimo hebraico sem inserir no texto principal sua associação etimológica com o ato de pôr à prova.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva esse nome em transliteração, sem substituí-lo por um título.
- issue: Explicitação da alusão a Êxodo 17
  choice: Manter apenas o topônimo “Massá” no texto principal
  alternative: “no lugar da provação” ou “em Massá, o lugar da provação”
  rationale: O hebraico emprega o nome do lugar sem explicação. A relação com Êxodo 17 e com a raiz “pôr à prova” pertence à nota, evitando ampliação interpretativa no texto.
- issue: Objeto de נִסִּיתֶם na oração comparativa
  choice: Explicitar “o”, retomando Yahweh
  alternative: “como fizeram em Massá”
  rationale: Embora o hebraico não repita um objeto expresso após o verbo, o contexto identifica Yahweh como aquele que Israel pôs à prova. O pronome torna a frase idiomática em português sem resolver uma tensão teológica adicional.
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com formas de segunda pessoa plural em “vocês”. A repetição de “pôr à prova” reproduz a repetição da raiz hebraica נסה. Os marcadores aparecem junto aos elementos que explicam: [b] após a formulação principal e [a] após Massá.'
