base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: pt
  text: Ame Yahweh, seu Deus, com todo o seu coração, com toda a sua alma[a] e com toda a sua força[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida como «alma» (néfesh) também pode significar «vida» ou «a própria pessoa».
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida como «força» (me’od) está ligada à ideia de «muito» ou «abundância» e pode abranger capacidade, intensidade e recursos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: Ame
  rationale: O qatal de segunda pessoa com conjunção tem força injuntiva neste contexto de exortação pactual. O imperativo português comunica a ordem com naturalidade e dignidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Embora אֱלֹהִים tenha forma plural, aqui o referente singular e o contexto identificam claramente o Deus de Israel.
- source_word: בְּכָל
  choice: com todo o / com toda a
  rationale: A construção expressa totalidade de dedicação. A repetição de «com todo» preserva a ênfase do hebraico, com concordância natural em português.
- source_word: לְבָבְךָ
  choice: seu coração
  rationale: No hebraico bíblico, לֵבָב abrange o ser interior, incluindo pensamento e vontade, e não somente emoções. «Coração» mantém essa imagem tradicional sem estreitá-la a «mente».
- source_word: נַפְשְׁךָ
  choice: sua alma
  rationale: נֶפֶשׁ pode significar alma, vida ou a própria pessoa. «Alma» conserva a formulação reconhecível e a amplitude antropológica, enquanto a nota registra alternativas legítimas.
- source_word: מְאֹדֶךָ
  choice: sua força
  rationale: מְאֹד, normalmente associado a «muito», aparece aqui de modo substantivado e indica a totalidade da capacidade, intensidade ou recursos. «Força» é clara e idiomática em português, sem pretender esgotar o termo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal pactual em vez de substituí-lo por um título.
- issue: Relação entre coração, alma e força
  choice: Preservar os três termos sobrepostos
  alternative: Explicá-los como faculdades psicológicas distintas ou parafraseá-los como «todo o seu ser»
  rationale: Os termos hebraicos descrevem holisticamente a dedicação da pessoa, mas não constituem necessariamente uma divisão técnica de partes humanas. A tradução conserva tanto a tríade quanto sua tensão sem impor um esquema antropológico posterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega o imperativo «Ame» para a força injuntiva e repete a estrutura «com todo/com toda» para conservar a cadência enfática do hebraico.
