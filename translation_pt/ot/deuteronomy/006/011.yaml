  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: pt
  text: e casas cheias de toda espécie de bens que você não encheu, cisternas escavadas[a] que você não escavou, vinhedos e oliveiras que você não plantou; e você comerá e ficará satisfeito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poços”. O termo hebraico, neste contexto, refere-se mais precisamente a cisternas talhadas na rocha para armazenar água.
    reason: lexical_alternative
  - marker: b
    text: Ou “e você comerá e ficará saciado”. Os verbos hebraicos dão continuidade à sequência do que acontecerá quando Israel entrar na terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָתִּים
  choice: casas
  rationale: Equivalente concreto e comum, adequado à lista de bens materiais recebidos na terra.
- source_word: מְלֵאִים כָּל טוּב
  choice: cheias de todo tipo de bens
  rationale: Expressa a abundância de coisas boas e úteis sem limitar טוּב à bondade moral; soa natural em português atual.
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: que você não encheu
  rationale: Mantém a oração relativa, o contraste com aquilo que Israel não produziu e o tratamento hebraico na segunda pessoa do singular.
- source_word: בֹרֹת חֲצוּבִים
  choice: cisternas escavadas
  rationale: בֹרֹת designa aqui reservatórios de água, provavelmente abertos na rocha; חֲצוּבִים indica que foram cortados ou escavados.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: que você não escavou
  rationale: Preserva a repetição lexical da raiz חצב e a ênfase no trabalho que o destinatário não realizou.
- source_word: כְּרָמִים
  choice: vinhedos
  rationale: Refere-se a áreas cultivadas com videiras, não apenas a plantas individuais.
- source_word: זֵיתִים
  choice: oliveiras
  rationale: Neste contexto de recursos plantados, o plural designa naturalmente as árvores, não somente seus frutos.
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: que você não plantou
  rationale: Tradução direta que mantém o padrão repetido dos bens não produzidos pelo destinatário.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: e você comerá e ficará satisfeito
  rationale: Os verbos dão continuidade à sequência futura do contexto. A formulação comunica tanto o ato de comer quanto a saciedade resultante.
theological_decisions:
- issue: Natureza da abundância prometida
  choice: Apresentar os bens materiais como provisões recebidas por Israel, sem inserir a advertência do versículo seguinte
  alternative: Acrescentar já neste versículo uma avaliação moral ou uma advertência contra o esquecimento
  rationale: O texto enumera casas, reservatórios e plantações que Israel não produziu. A advertência explícita aparece no versículo seguinte e não deve ser antecipada por paráfrase.
- issue: Segunda pessoa do singular
  choice: Manter o singular por meio de “você”
  alternative: Converter a referência ao plural, como “vocês”
  rationale: O hebraico se dirige a Israel no singular coletivo, característico da linguagem da aliança em Deuteronômio. “Você” conserva formalmente esse número e oferece boa legibilidade brasileira.
- issue: Valor temporal dos verbos finais
  choice: 'Explicitar a continuação futura: “comerá e ficará satisfeito”'
  alternative: 'Usar presente vívido ou construir uma oração temporal: “quando comer e ficar satisfeito”'
  rationale: No contexto iniciado pela entrada futura na terra, as formas verbais prosseguem a sequência do que acontecerá. O futuro em português deixa essa relação clara sem eliminar a ligação com a advertência subsequente.
translation_notes:
  register: Português atual, digno e de leitura natural no Brasil, sem regionalismos marcados. O uso de “você” preserva a segunda pessoa singular do hebraico com conjugação amplamente compreensível. Os pontos e vírgulas tornam clara a longa enumeração, e o travessão final indica que a frase continua no versículo seguinte.
