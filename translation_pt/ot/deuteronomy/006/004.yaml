  text: שְׁמַ֖ יִשְׂרָאֵ֑ל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יְהוָ֥ה אֶחָֽ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/004.yaml
  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: pt
  text: 'Ouça, Israel: Yahweh, nosso Deus, Yahweh é um.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh é nosso Deus, somente Yahweh”; alternativamente: “Yahweh, nosso Deus, é um só Yahweh”. A formulação hebraica é compacta e permite mais de uma tradução sintaticamente plausível.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Ouça
  rationale: Imperativo singular dirigido a Israel como povo coletivo. “Ouça” conserva tanto o sentido auditivo quanto o chamado pactual a prestar atenção e obedecer, em português atual e digno.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio do povo da aliança, mantido na forma portuguesa consagrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo pelo título tradicional “SENHOR”.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Embora אֱלֹהִים tenha forma morfologicamente plural, aqui, com o sufixo da primeira pessoa do plural e em referência ao Deus de Israel, funciona como singular.
- source_word: אֶחָד
  choice: um
  rationale: Mantém o sentido adjetival e numeral básico do hebraico. O contexto pode comunicar unicidade ou exclusividade, mas “um” evita resolver no texto principal uma ambiguidade sintática genuína.
theological_decisions:
- issue: Sintaxe e sentido da declaração final do Shemá
  choice: Yahweh, nosso Deus, Yahweh é um
  alternative: 'Yahweh é nosso Deus, somente Yahweh; ou: Yahweh, nosso Deus, é um só Yahweh'
  rationale: A estrutura hebraica compacta, com orações nominais sem verbo expresso, admite mais de uma análise. A opção principal preserva a afirmação monoteísta tradicional com expansão mínima; as leituras plausíveis de exclusividade e de predicação são registradas em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “Ouça” em vez do mais solene ou regionalmente marcado “Ouve”, conserva o nome divino “Yahweh” e mantém a concisão e a ambiguidade do hebraico.
