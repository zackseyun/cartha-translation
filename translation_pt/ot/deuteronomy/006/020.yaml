  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: pt
  text: 'Quando, no futuro[a], seu filho lhe perguntar: “O que são os testemunhos, os estatutos e as decisões que Yahweh, nosso Deus, ordenou a vocês?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “amanhã”; aqui, a palavra hebraica se refere de modo idiomático a um tempo futuro.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz uma situação futura esperada no contexto de instrução, mais naturalmente expressa por “quando” do que por “se”.
- source_word: יִשְׁאָלְךָ
  choice: lhe perguntar
  rationale: Expressa de modo natural o ato de perguntar e conserva o objeto singular da segunda pessoa.
- source_word: בִנְךָ
  choice: seu filho
  rationale: O hebraico emprega explicitamente o masculino singular; a tradução preserva essa especificidade.
- source_word: מָחָר
  choice: no futuro
  rationale: Embora literalmente signifique “amanhã”, aqui o termo é idiomático e se refere a um tempo futuro não especificado.
- source_word: לֵאמֹר
  choice: introduzido diretamente pelos dois-pontos
  rationale: O infinitivo hebraico introduz o conteúdo da fala. Em português atual, os dois-pontos fazem isso com naturalidade, sem a fórmula mais pesada “dizendo”.
- source_word: מָה
  choice: O que são
  rationale: Mantém a formulação direta e a ambiguidade do hebraico, sem explicitar que a pergunta seja apenas sobre o significado das normas.
- source_word: הָעֵדֹת
  choice: os testemunhos
  rationale: Preserva a identidade deste termo pactual e o distingue dos outros dois termos jurídicos da sequência.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: Equivalente jurídico corrente que mantém a distinção em relação a “testemunhos” e “decisões”.
- source_word: הַמִּשְׁפָּטִים
  choice: as decisões
  rationale: Comunica o sentido de decisões ou determinações jurídicas de מִשְׁפָּטִים em português moderno, sem confundi-lo com os estatutos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz diretamente a construção possessiva e sua dimensão relacional.
- source_word: צִוָּה ... אֶתְכֶם
  choice: ordenou a vocês
  rationale: Torna explícito em português que o objeto é plural, contraste relevante porque o filho pergunta a um indivíduo sobre aquilo que foi ordenado à comunidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva como nome, sem substituí-lo por um título.
- issue: Especificidade de gênero em בִנְךָ
  choice: seu filho
  alternative: seu filho ou sua filha; sua criança
  rationale: O substantivo hebraico é masculino singular, e não há razão contextual para neutralizá-lo.
- issue: Sentido da pergunta introduzida por מָה
  choice: O que são
  alternative: O que significam
  rationale: A forma direta conserva a abertura da pergunta hebraica, que pode solicitar identidade, conteúdo e significado, sem limitar antecipadamente sua abrangência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula hebraica לֵאמֹר foi incorporada pela pontuação para evitar rigidez desnecessária. “A vocês” explicita o plural do objeto hebraico, distinguindo-o do “lhe” singular dirigido ao pai.
