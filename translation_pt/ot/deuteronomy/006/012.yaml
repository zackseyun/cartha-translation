  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of slaves.
translation:
  language: pt
  text: Tenha cuidado para não se esquecer de Yahweh, que tirou você da terra do Egito, da casa de escravos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “da casa da escravidão”. O hebraico diz literalmente “da casa de escravos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Tenha cuidado
  rationale: A construção reflexiva de advertência pede que o destinatário fique de sobreaviso. “Tenha cuidado” é natural em português e preserva a força do imperativo dirigido ao indivíduo.
- source_word: פֶּן תִּשְׁכַּח
  choice: para não se esquecer
  rationale: פֶּן introduz o perigo que deve ser evitado. Esta formulação corrente preserva a advertência negativa, enquanto o uso pronominal de “esquecer-se de” soa natural com um complemento pessoal em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הוֹצִיאֲךָ
  choice: tirou você
  rationale: O hifil de יצא significa “fazer sair/tirar” e, neste contexto, descreve diretamente a libertação do Egito. A forma mantém explícito o objeto singular masculino do hebraico.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Mantém o substantivo אֶרֶץ, presente no texto hebraico, com uma construção idiomática em português.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Reproduz a expressão concreta do hebraico, literalmente “casa de escravos”, e mantém explícita a condição das pessoas escravizadas; a nota registra a alternativa portuguesa mais idiomática.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva sua função como nome e evita substituí-lo silenciosamente por um título.
- issue: Sentido concreto de עֲבָדִים na fórmula do êxodo
  choice: escravos
  alternative: escravidão; servos
  rationale: O plural concreto caracteriza o Egito como uma “casa de escravos”. A tradução não suaviza a realidade da escravização nem transforma sem indicação o substantivo concreto em abstrato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular do discurso hebraico foi mantido em “você”. A expressão concreta “casa de escravos” foi preservada no texto, com a alternativa idiomática em nota.
