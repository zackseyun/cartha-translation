  yaml_path: translation/ot/deuteronomy/006/019.yaml
  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: pt
  text: para expulsar todos os seus inimigos de diante de você[b], como Yahweh falou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disse”. O verbo hebraico significa literalmente “falou” e se refere a uma palavra divina anterior que continua válida.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de diante de você”, expressão que indica retirar os inimigos do caminho ou da presença de Israel.'
    reason: cultural_note
lexical_decisions:
- source_word: לַהֲדֹף
  choice: para expulsar
  rationale: O infinitivo com לְ expressa propósito ou resultado em continuidade com o versículo anterior. No hifil, נדף indica fazer recuar ou remover; “expulsar” é claro e natural no contexto de conflito.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: O marcador hebraico de objeto direto definido não possui equivalente lexical necessário em português.
- source_word: כָּל
  choice: todos
  rationale: Preserva a abrangência total de כָּל diante do substantivo plural.
- source_word: אֹיְבֶיךָ
  choice: os seus inimigos
  rationale: Tradução direta do substantivo com sufixo de segunda pessoa masculina singular, mantendo o discurso dirigido a Israel como uma unidade.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: Conserva a imagem hebraica de retirar os inimigos da frente ou da presença do povo, sem apagar a preposição מִן.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Expressa de modo conciso a correspondência entre a expulsão dos inimigos e a palavra divina anterior.
- source_word: דִּבֶּר
  choice: falou
  rationale: O pretérito perfeito traduz naturalmente o perfeito hebraico e mantém o sentido lexical de דבר, sem explicitar como “promessa” aquilo que o texto apenas chama de palavra pronunciada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e sua função pactual.
- issue: Força de דִּבֶּר no contexto da aliança
  choice: falou
  alternative: prometeu
  rationale: “Falou” preserva o valor lexical do verbo e deixa que o contexto comunique a validade contínua da palavra divina; “prometeu” tornaria explícita uma inferência contextual.
translation_notes:
  register: Português moderno, claro e digno, com tratamento no singular (“você”) para refletir a forma hebraica dirigida coletivamente a Israel. A expressão “de diante de você” foi mantida para preservar a imagem do original, embora seja ligeiramente mais formal que “da sua frente”.
