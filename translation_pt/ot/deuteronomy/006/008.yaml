  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: pt
  text: Você as amarrará como sinal na sua mão, e elas serão como faixas entre os seus olhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filactérios”, referência a pequenos estojos usados na prática judaica posterior. O termo hebraico é raro e parece designar, mais literalmente, faixas ou ornamentos usados na testa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: Você as amarrará
  rationale: O perfeito qal com conjunção, nesta sequência de instruções, tem força prescritiva. “Amarrará” conserva a ação concreta e o sufixo feminino plural “as” retoma as palavras do contexto anterior.
- source_word: לְאוֹת
  choice: como sinal
  rationale: אוֹת significa normalmente “sinal” ou “marca”; “como sinal” expressa naturalmente a função designativa do לְ sem explicar em excesso seu simbolismo.
- source_word: עַל יָדֶךָ
  choice: na sua mão
  rationale: יָד tem como sentido comum “mão”. Embora possa abranger o braço em certos contextos, “mão” preserva aqui a formulação direta do hebraico.
- source_word: וְהָיוּ
  choice: e elas serão
  rationale: O verbo prossegue a sequência prescritiva e mantém o paralelismo com a primeira oração; o feminino plural em português concorda com “palavras”, retomadas do contexto.
- source_word: לְטֹטָפֹת
  choice: como faixas na testa
  rationale: טֹטָפֹת é um termo raro, relacionado tradicionalmente a algo usado na parte frontal da cabeça. “Faixas na testa” é compreensível em português e evita inserir no texto principal a identificação historicamente mais específica com filactérios.
- source_word: בֵּין עֵינֶיךָ
  choice: entre os seus olhos
  rationale: A tradução conserva literalmente a imagem hebraica, sem substituí-la pela explicação interpretativa “na testa”.
theological_decisions:
- issue: Se a ordem deve ser traduzida como prática corporal literal, metáfora de lembrança constante ou ambas
  choice: Manter a linguagem corporal concreta sem decidir entre leitura literal, simbólica ou combinada
  alternative: Explicitar uma metáfora de lembrança constante ou identificar diretamente os objetos com os filactérios da prática judaica posterior
  rationale: O hebraico emprega imagens corporais concretas, mas não resolve por si só a relação entre prática física e significado simbólico. A tradução preserva essa tensão e registra a identificação tradicional apenas em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção prescritiva natural. A repetição dos pronomes possessivos preserva o caráter pessoal da exortação. “Faixas na testa” torna inteligível o termo raro sem eliminar a nota sobre sua identificação tradicional.
