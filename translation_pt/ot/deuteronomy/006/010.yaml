base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: pt
  text: E acontecerá que, quando Yahweh, seu Deus, levar você à terra que jurou a seus pais — a Abraão[a], a Isaque e a Jacó — dar a você cidades grandes e boas que você não construiu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus antepassados”. O hebraico diz “seus pais”, e o contexto cita especificamente Abraão, Isaque e Jacó.
    reason: Alternativa lexical para לַאֲבֹתֶיךָ, explicando a formulação literal e sua referência contextual.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Conserva a perspectiva futura e a ligação discursiva da construção hebraica, sem deixar de ser compreensível em português atual.
- source_word: יְבִיאֲךָ
  choice: levar você à
  rationale: O hifil de בוא tem sentido causativo, isto é, fazer entrar ou levar para dentro; a formulação escolhida é natural e mantém esse valor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente a forma com sufixo possessivo de segunda pessoa do singular.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém o termo característico das promessas da aliança em Deuteronômio.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: que jurou
  rationale: Preserva de forma concisa o sentido de jurar ou prestar juramento.
- source_word: לַאֲבֹתֶיךָ
  choice: a seus pais
  rationale: Mantém o substantivo masculino plural do hebraico e sua referência específica aos patriarcas nomeados em seguida.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: a Abraão, a Isaque e a Jacó
  rationale: Emprega as formas portuguesas usuais dos nomes e conserva a preposição repetida para clareza e correspondência retórica.
- source_word: לָתֶת לָךְ
  choice: dar a você
  rationale: Expressa o infinitivo de propósito e deixa claro que a terra é o objeto a ser dado ao destinatário.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: cidades grandes e boas
  rationale: Permanece próxima dos adjetivos hebraicos, evitando especificar de modo indevido prosperidade, beleza ou fortificação.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: que você não construiu
  rationale: Traduz diretamente a oração relativa negativa na segunda pessoa do singular.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Termo de parentesco em לַאֲבֹתֶיךָ
  choice: seus pais
  alternative: seus antepassados
  rationale: O hebraico diz literalmente “seus pais” e o próprio contexto identifica esses pais como Abraão, Isaque e Jacó; uma nota registra a alternativa idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva a abertura futura do hebraico e a continuidade da frase para o versículo seguinte. O singular “você” reflete a segunda pessoa masculina singular dirigida coletivamente a Israel.
