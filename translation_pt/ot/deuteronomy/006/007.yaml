base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: pt
  text: Ensine-as com dedicação[a] a seus filhos[b] e fale delas quando estiver sentado em sua casa, quando andar pelo caminho, quando se deitar e quando se levantar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico tem literalmente o sentido de “afiar”; aqui é uma metáfora para incutir por meio de ensino cuidadoso e repetido.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus filhos” no masculino; por extensão, a instrução pode abranger os filhos e a casa de modo mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: Ensine-as com dedicação
  rationale: O verbo שׁנן tem o sentido literal de afiar, mas aqui é usado metaforicamente para ensinar de modo cuidadoso, repetido e persistente. A formulação comunica essa força pedagógica em português natural.
- source_word: לְבָנֶיךָ
  choice: a seus filhos
  rationale: בנים é o plural masculino de “filho”, com sufixo de segunda pessoa do singular. “Filhos” preserva a forma masculina do hebraico sem excluir a possível extensão da instrução ao conjunto dos filhos e da casa.
- source_word: וְדִבַּרְתָּ בָּם
  choice: e fale delas
  rationale: Depois de דבר, a preposição ב com o pronome é entendida naturalmente como “falar delas” ou “a respeito delas”. “Fale delas” mantém proximidade com o hebraico e um registro digno e corrente.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: quando estiver sentado em sua casa
  rationale: O infinitivo construto com ב expressa uma circunstância temporal habitual. Esta tradução é clara e idiomática em português.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: quando andar pelo caminho
  rationale: דרך significa “caminho” ou “estrada”. A expressão preserva a imagem concreta do deslocamento cotidiano e soa natural em português.
- source_word: וּבְשָׁכְבְּךָ
  choice: quando se deitar
  rationale: A expressão indica o ato ou momento de deitar-se, em especial para dormir. A forma reflexiva é a construção portuguesa natural.
- source_word: וּבְקוּמֶךָ
  choice: quando se levantar
  rationale: A expressão indica levantar-se, especialmente depois do sono, e forma um par natural com “quando se deitar”.
theological_decisions:
- issue: Termo filial masculino na instrução da aliança
  choice: a seus filhos
  alternative: a suas crianças
  rationale: O hebraico emprega explicitamente o plural masculino בנים, “filhos”. O texto principal conserva essa forma, enquanto a nota registra que a instrução pode ter alcance doméstico mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega-se o imperativo polido no singular para reproduzir a força injuntiva da sequência hebraica sem recorrer a formas excessivamente arcaicas. O paralelismo das quatro circunstâncias cotidianas foi preservado.
