  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: pt
  text: E ele nos tirou de lá para nos fazer entrar e nos dar a terra que havia jurado dar aos nossos pais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos nossos antepassados”. Hebraico: “aos nossos pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוֹתָנוּ הוֹצִיא
  choice: E ele nos tirou
  rationale: A construção destaca o objeto “nos”; em português, a ordem natural preserva a continuidade com “E” e traduz o hifil de יצא de modo claro. “Tirou” também prepara o contraste com “fazer entrar”.
- source_word: מִשָּׁם
  choice: de lá
  rationale: Equivalente locativo direto, natural e exato.
- source_word: לְמַעַן
  choice: para
  rationale: Introduz com clareza a finalidade da saída, sem tornar a frase pesada.
- source_word: הָבִיא אֹתָנוּ
  choice: nos fazer entrar
  rationale: O hifil de בוא expressa causação de entrada. Esta formulação mantém o contraste hebraico entre tirar de um lugar e fazer entrar em outro.
- source_word: לָתֵת לָנוּ
  choice: e nos dar
  rationale: Representa o infinitivo de finalidade associado à entrada; a coordenação em português torna explícita e natural a relação entre os dois propósitos.
- source_word: אֶת־הָאָרֶץ
  choice: a terra
  rationale: Tradução tradicional e contextualmente precisa para a terra prometida a Israel.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: que havia jurado dar
  rationale: “Jurado” preserva a força do compromisso solene. O verbo “dar”, elíptico no hebraico após “jurou”, é explicitado em português para completar naturalmente a regência e ligar o juramento à terra.
- source_word: לַאֲבֹתֵינוּ
  choice: aos nossos pais
  rationale: Mantém a forma masculina e a ligação pactual com os antepassados de Israel; uma alternativa mais abrangente é registrada em nota.
theological_decisions:
- issue: Referência pactual masculina em לַאֲבֹתֵינוּ
  choice: aos nossos pais
  alternative: aos nossos antepassados
  rationale: O hebraico diz literalmente “nossos pais” e, no contexto, evoca os pais de Israel. A tradução conserva essa formulação, enquanto a nota registra a alternativa sem neutralizar silenciosamente o texto.
- issue: Linguagem de juramento em נִשְׁבַּע
  choice: havia jurado
  alternative: havia prometido
  rationale: “Jurado” conserva o caráter solene e pactual do compromisso divino, mais específico do que uma promessa em sentido geral.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação preserva o movimento contrastivo de saída e entrada e mantém a linguagem solene do juramento.
