  text: וַ/יִּתֵּ֣ן יְהוָ֡ה אוֹתֹ֣ת וּ֠/מֹפְתִים גְּדֹלִ֨ים וְ/רָעִ֧ים בְּ/מִצְרַ֛יִם בְּ/פַרְעֹ֥ה וּ/בְ/כָל בֵּית֖/וֹ לְ/עֵינֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: pt
  text: E Yahweh realizou no Egito grandes e terríveis sinais e prodígios contra o faraó e toda a sua casa, diante dos nossos olhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: realizou
  rationale: Embora נתן signifique literalmente “dar” ou “pôr”, com “sinais e prodígios” o português natural pede “realizou”; a escolha comunica o ato sem acrescentar a noção mais específica de “operar milagres”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: sinais e prodígios
  rationale: É uma combinação portuguesa corrente e digna, que preserva os dois termos hebraicos sem reduzir מֹפְתִים simplesmente a “milagres”.
- source_word: גְּדֹלִים וְרָעִים
  choice: grandes e terríveis
  rationale: “Grandes” expressa magnitude; “terríveis” comunica o caráter calamitoso e devastador de רָעִים sem atribuir maldade moral aos atos de Deus.
- source_word: בְּמִצְרַיִם
  choice: no Egito
  rationale: Preserva o sentido locativo mais direto da preposição ב; o contexto deixa claro que os atos também constituíram juízo sobre o Egito.
- source_word: בְּפַרְעֹה וּבְכָל־בֵּיתוֹ
  choice: contra o faraó e toda a sua casa
  rationale: Aqui o paralelismo e o contexto favorecem o sentido de alvo afetado. “Casa” conserva a expressão hebraica e pode abranger família, corte ou casa real.
- source_word: לְעֵינֵינוּ
  choice: diante dos nossos olhos
  rationale: Reproduz de modo natural e vívido o idiomatismo hebraico de testemunho direto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome pessoal, e a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido de וְרָעִים aplicado aos sinais e prodígios
  choice: terríveis
  alternative: maus; nocivos; calamitosos
  rationale: A palavra descreve o efeito severo e devastador dos atos sobre o Egito; “terríveis” mantém a força sem sugerir que os atos divinos fossem moralmente maus.
- issue: Valor da preposição בְּ em בְּמִצְרַיִם
  choice: no Egito
  alternative: contra o Egito
  rationale: A leitura locativa é a mais direta e preserva a ambiguidade contextual, sem negar que os sinais funcionaram como juízos dirigidos ao Egito.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O artigo em “o faraó” é natural em português. “Realizou” evita o pouco idiomático “deu sinais e prodígios”, enquanto “casa” conserva a imagem e a amplitude do hebraico.
