base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: pt
  text: Guardem cuidadosamente os mandamentos de Yahweh, o Deus de vocês,[a] bem como seus testemunhos[b] e seus estatutos, que ele ordenou a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Guardem com todo o cuidado” ou “Certamente guardem”. O hebraico reforça o verbo para dar ênfase à ordem.'
    reason: lexical_alternative
  - marker: b
    text: “Testemunhos” também pode ser traduzido como “decretos” ou “estipulações da aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: Guardem cuidadosamente
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ordem. “Guardem cuidadosamente” comunica tanto a obrigação quanto a ênfase em português natural.
- source_word: מִצְוֺת
  choice: os mandamentos
  rationale: O termo designa obrigações ordenadas e mantém o tom formal e pactual do contexto legal de Deuteronômio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Integra a fórmula pactual “Yahweh, seu Deus”; no português brasileiro, “seu” concorda naturalmente com o tratamento plural “vocês”, expresso aqui pela flexão verbal.
- source_word: עֵדֹתָיו
  choice: os seus testemunhos
  rationale: É a correspondência lexical mais direta e preserva a distinção entre os termos legais próximos, embora “decretos” também seja possível.
- source_word: חֻקָּיו
  choice: os seus estatutos
  rationale: Expressa prescrições estabelecidas e distingue este termo de “mandamentos” e “testemunhos”.
- source_word: אֲשֶׁר צִוָּךְ
  choice: que ele lhes ordenou
  rationale: A oração relativa é entendida como referente coletivamente aos termos legais anteriores. “Lhes” explicita em português o destinatário plural indicado pelo contexto e pela forma verbal principal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pactual em forma transliterada, sem substituí-lo por um título.
- issue: Alcance da oração relativa final
  choice: Refere-se coletivamente aos mandamentos, testemunhos e estatutos
  alternative: Refere-se apenas aos estatutos
  rationale: Embora a proximidade permita uma ligação gramatical mais estreita com “estatutos”, o sentido e a estrutura legal favorecem a aplicação da oração ao conjunto das exigências mencionadas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O imperativo plural “guardem” evita uma construção excessivamente literal, enquanto “cuidadosamente” preserva a intensidade hebraica. Os três termos legais foram mantidos distintos.
