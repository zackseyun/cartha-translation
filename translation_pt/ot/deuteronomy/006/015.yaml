  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: pt
  text: pois Yahweh, seu Deus, está no meio de vocês e é um Deus ciumento[a]. Do contrário, a ira de Yahweh, seu Deus, se acenderá contra vocês, e ele os destruirá da face da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um Deus zeloso”. O hebraico enfatiza a reivindicação exclusiva de Yahweh sobre seu povo na aliança.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de sobre a face do solo”; expressão que indica remoção completa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição do versículo anterior e mantém uma ligação causal natural em português.
- source_word: אֵל קַנָּא
  choice: Deus ciumento
  rationale: Preserva a ideia da reivindicação exclusiva de Yahweh sobre o povo da aliança e a tensão da metáfora hebraica; não se trata de inveja pecaminosa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Representa a forma com sufixo de segunda pessoa masculina singular; o plural português no restante do texto expressa naturalmente o destinatário coletivo.
- source_word: בְּקִרְבֶּךָ
  choice: que está no meio de vocês
  rationale: Comunica a presença de Deus entre o povo, evitando a leitura individualizante de 'dentro de você'.
- source_word: פֶּן
  choice: Do contrário
  rationale: Introduz com clareza moderna a consequência advertida pelo texto.
- source_word: יֶחֱרֶה אַף
  choice: a ira ... se acenderá
  rationale: Conserva a metáfora hebraica da ira que arde ou se acende em formulação idiomática portuguesa.
- source_word: בָּךְ
  choice: contra vocês
  rationale: Com a ira, a preposição hebraica tem sentido adversativo.
- source_word: וְהִשְׁמִידְךָ
  choice: e ele os destruirá
  rationale: Expressa a força causativa do verbo, indicando destruição ou eliminação, sem recorrer a uma formulação coloquial.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: da face da terra
  rationale: Mantém a imagem e o idioma hebraicos de remoção completa da terra habitada.
theological_decisions:
- issue: O ciúme divino
  choice: Deus ciumento
  alternative: Deus zeloso
  rationale: O hebraico descreve a exclusividade da aliança e a intolerância de Yahweh à adoração de rivais. 'Ciumento' preserva a categoria bíblica e sua tensão, enquanto a nota impede que seja entendida como inveja pecaminosa.
- issue: O nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o tetragrama; a transliteração preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Número do destinatário
  choice: vocês / os
  alternative: você / o
  rationale: Embora as formas hebraicas sejam gramaticalmente singulares, dirigem-se a Israel como povo. O plural é mais natural e evita que leitores modernos entendam a advertência como dirigida apenas a um indivíduo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega 'vocês' para tornar explícito o referente coletivo do singular hebraico. Mantém a metáfora da ira que se acende e o termo teologicamente tenso 'ciumento', esclarecido em nota.
