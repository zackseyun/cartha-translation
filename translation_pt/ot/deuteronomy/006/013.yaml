base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: pt
  text: Tema Yahweh, seu Deus[a], e a ele sirva[b]; jure pelo nome dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Reverencie Yahweh, seu Deus”. O verbo hebraico inclui temor reverente e reverência, não apenas terror.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e o adore”. O verbo hebraico normalmente significa “servir” e, neste contexto, inclui serviço prestado em adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: A forma com sufixo de segunda pessoa masculina singular é expressa naturalmente em português como “seu Deus”.
- source_word: תִּירָא
  choice: Tema
  rationale: “Temer” conserva a amplitude do hebraico, que neste contexto reúne temor reverente, assombro e seriedade diante de Deus.
- source_word: וְאֹתוֹ
  choice: somente a ele
  rationale: O pronome objeto recebe ênfase pela construção hebraica. “Somente” explicita em português a força focal e a exclusividade exigida pelo contexto imediato, embora não corresponda a um advérbio hebraico separado.
- source_word: תַעֲבֹד
  choice: sirva
  rationale: “Servir” preserva a amplitude lexical de עבד, incluindo obediência e serviço de caráter cultual, sem restringir o sentido a atos litúrgicos.
- source_word: וּבִשְׁמוֹ
  choice: e jure pelo nome dele
  rationale: Em fórmulas de juramento, בִּ indica o nome invocado como garantia ou autoridade; “pelo nome dele” é claro e idiomático.
- source_word: תִּשָּׁבֵעַ
  choice: jure
  rationale: O nifal de שׁבע significa prestar juramento; o singular imperativo de sentido normativo acompanha naturalmente “tema” e “sirva”.
- source_word: אֶת
  choice: não traduzido separadamente
  rationale: É um marcador de objeto direto sem equivalente lexical autônomo em português; sua função é representada pela sintaxe.
theological_decisions:
- issue: A natureza do temor devido a Deus
  choice: Manter “Tema” no texto principal
  alternative: “Reverencie” ou “tenha temor reverente de”
  rationale: “Tema” preserva a tensão do hebraico entre reverência, assombro, obediência e santo temor; “reverencie” poderia suavizar indevidamente o termo.
- issue: O sentido religioso de עבד
  choice: Traduzir por “sirva”
  alternative: “adore”
  rationale: “Sirva” mantém a amplitude do verbo, que abrange lealdade e serviço cultual; “adore” é uma interpretação contextual válida, mas mais estreita.
- issue: A exclusividade do serviço a Yahweh
  choice: Expressar “somente a ele”
  alternative: “e a ele sirva”
  rationale: A exclusividade é sustentada pela focalização do pronome hebraico e pelo contexto de Deuteronômio 6. A nota informa que “somente” explicita essa força contextual, não um advérbio independente.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no singular coerentes com o destinatário hebraico. “Yahweh” preserva o nome divino. A formulação evita linguagem arcaica, e as notas conservam as alternativas lexicais relevantes.
