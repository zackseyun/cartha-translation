source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: pt
  text: Faça o que é reto e bom aos olhos de Yahweh, para que tudo corra bem com você, e para que você entre e tome posse[a] da boa terra que Yahweh jurou dar aos seus pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “herde”. O verbo hebraico pode significar “herdar”, “possuir” ou “tomar posse”. Aqui se refere à entrada de Israel na terra prometida e à sua posse.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Faça
  rationale: Neste contexto de instrução pactual, a forma verbal tem força diretiva. O imperativo em português comunica a ordem com naturalidade e dignidade.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: o que é reto e bom
  rationale: 'Preserva os dois termos éticos coordenados: יָשָׁר como aquilo que é reto ou correto, e טוֹב como aquilo que é bom.'
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora avaliativa hebraica em uma expressão clara e corrente em português.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: para que tudo corra bem com você
  rationale: Expressa propósito ou resultado e comunica bem-estar de modo amplo, sem restringir o sentido à prosperidade material.
- source_word: וּבָאתָ
  choice: para que você entre
  rationale: Retrata o movimento de entrada na terra e integra naturalmente o verbo à oração de propósito iniciada por לְמַעַן.
- source_word: וְיָרַשְׁתָּ
  choice: tome posse
  rationale: Neste contexto, ירשׁ descreve Israel entrando na terra prometida e passando a possuí-la. A nota preserva a alternativa lexical 'herdar'.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: a boa terra
  rationale: Tradução direta que conserva a avaliação positiva do hebraico sem especificá-la como fertilidade ou prazer.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ
  choice: que Yahweh jurou dar aos seus pais
  rationale: נשבע indica juramento, não uma promessa genérica. 'Dar' torna explícito em português o complemento exigido pela construção natural e já indicado pelo contexto da terra prometida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Termo de parentesco לַאֲבֹתֶיךָ
  choice: aos seus pais
  alternative: aos seus antepassados
  rationale: O hebraico usa o substantivo masculino plural 'pais', que neste contexto remete especificamente aos pais ligados às promessas patriarcais. A tradução mantém essa forma histórica sem generalizá-la.
- issue: Complemento do juramento divino
  choice: jurou dar
  alternative: jurou aos seus pais
  rationale: O hebraico deixa o conteúdo do juramento dependente do antecedente 'terra'. Em português, acrescentar 'dar' explicita a relação sintática implícita sem alterar o conteúdo da promessa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O tratamento singular 'você' torna explícito o destinatário singular do hebraico; a repetição de 'para que' esclarece a relação de propósito sem eliminar a sequência verbal do original.
