  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: pt
  text: Escreva-as nos batentes da porta de sua casa e nos seus portões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos batentes dos seus portões” ou “junto aos seus portões”. O termo hebraico pode referir-se ao portão, à sua estrutura de entrada ou à área do portão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Escreva-as
  rationale: O perfeito qal com conjunção, nesta sequência de mandamentos, tem força injuntiva. O pronome “-as” retoma as palavras mencionadas no contexto anterior.
- source_word: עַל מְזוּזֹת בֵּיתֶךָ
  choice: nos batentes das portas da sua casa
  rationale: מְזוּזוֹת designa especificamente os postes laterais de uma entrada. “Batentes das portas” é claro e natural em português e mantém a referência à estrutura física da casa.
- source_word: וּבִשְׁעָרֶיךָ
  choice: e nos seus portões
  rationale: שְׁעָרִים pode designar os portões ou a área estrutural das entradas. “Portões” preserva a formulação concreta e o plural do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativo natural para a força injuntiva do hebraico. Evitou-se transliterar o termo hebraico מְזוּזוֹת, que aqui se refere aos batentes, não ao objeto ritual posteriormente chamado mezuzá.
