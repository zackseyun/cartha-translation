source:
  edition: WLC
  text: לֹ֣א תֵֽלְכ֔וּ/ן אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים מֵ/אֱלֹהֵי֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר סְבִיבוֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: pt
  text: Não sigam outros deuses[a], os deuses dos povos que estão ao redor de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, preservando mais literalmente a expressão hebraica: “Não vão atrás de outros deuses”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵלְכוּן
  choice: Não sigam
  rationale: A construção com לֹא e o imperfeito de הלך expressa proibição. Em português, o imperativo negativo comunica isso naturalmente.
- source_word: אַחֲרֵי
  choice: sigam
  rationale: Com הלך, forma a expressão idiomática 'ir atrás de/seguir', que neste contexto indica adesão e lealdade religiosa. 'Sigam' é claro e natural.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Tradução direta que designa divindades além do Deus de Israel, sem acrescentar a nuance não explícita de 'estrangeiros'.
- source_word: מֵאֱלֹהֵי
  choice: os deuses dos
  rationale: O מ־ pode ser entendido em sentido partitivo ('dentre os deuses de'), mas, no contexto, a expressão funciona naturalmente como uma identificação dos 'outros deuses'. A aposição evita em português uma formulação rígida ou potencialmente ambígua.
- source_word: הָעַמִּים
  choice: os povos
  rationale: '''Povos'' corresponde de perto ao sentido lexical e é apropriado para os grupos vizinhos em vista.'
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: que estão ao redor de vocês
  rationale: Preserva a oração relativa e o sentido espacial dos povos circunvizinhos, em linguagem amplamente compreensível.
theological_decisions:
- issue: Natureza da proibição
  choice: Proibição de seguir outros deuses, no sentido de adesão e lealdade religiosa
  alternative: Proibição limitada ao deslocamento físico em direção a santuários pagãos
  rationale: Em Deuteronômio, a expressão הלך אחרי costuma indicar seguir em lealdade e culto, não apenas movimento físico. 'Sigam' conserva o alcance do idioma sem restringi-lo ou parafraseá-lo simplesmente como 'adorem'.
- issue: Relação entre 'outros deuses' e 'os deuses dos povos'
  choice: 'Aposição identificadora: ''outros deuses, os deuses dos povos'''
  alternative: 'Leitura partitiva explícita: ''outros deuses dentre os deuses dos povos'''
  rationale: Embora o מ־ admita valor partitivo, a construção no contexto identifica os deuses proibidos como os das populações vizinhas. A nota registra a possibilidade formal sem impor uma distinção teológica adicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O plural 'vocês' torna explícito o destinatário coletivo do hebraico. A formulação principal privilegia a naturalidade, enquanto a nota preserva o idioma hebraico mais literalmente.
