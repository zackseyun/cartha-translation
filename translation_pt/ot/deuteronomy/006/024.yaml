base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: pt
  text: E o SENHOR nos ordenou que cumpríssemos todos estes estatutos e temêssemos o SENHOR, nosso Deus, para o nosso bem todos os dias e para nos manter vivos, como no dia de hoje.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַוֵּנוּ
  choice: E o SENHOR nos ordenou
  rationale: Mantém a ligação narrativa do waw e expressa naturalmente em português a ordem divina dirigida ao povo.
- source_word: לַעֲשׂוֹת אֶת כָּל־הַחֻקִּים הָאֵלֶּה
  choice: que cumpríssemos todos estes estatutos
  rationale: Neste contexto, עשה significa pôr em prática ou observar; “cumprir” é natural e preserva a força normativa de חֻקִּים, traduzido por “estatutos”.
- source_word: לְיִרְאָה אֶת־יְהוָה אֱלֹהֵינוּ
  choice: e temêssemos o SENHOR, nosso Deus
  rationale: “Temer” conserva a formulação teológica hebraica, que pode abranger reverência, lealdade e temor, sem reduzir sua amplitude.
- source_word: לְטוֹב לָנוּ כָּל־הַיָּמִים
  choice: para o nosso bem em todos os tempos
  rationale: Representa literalmente a finalidade benéfica e a duração expressa por כָּל־הַיָּמִים, sem limitar a frase apenas à vida individual.
- source_word: לְחַיֹּתֵנוּ כְּהַיּוֹם הַזֶּה
  choice: para nos conservar vivos, como hoje se vê
  rationale: O infinitivo causativo é bem expresso por “conservar vivos”; a expressão final indica a sobrevivência evidente na situação presente.
theological_decisions:
- issue: Relação entre obediência, temor e benefício
  choice: 'Manter as duas finalidades coordenadas: o bem do povo e sua preservação em vida'
  alternative: Fundir as finalidades numa promessa geral de prosperidade
  rationale: O hebraico distingue לְטוֹב לָנוּ de לְחַיֹּתֵנוּ; a tradução não deve ampliar “bem” para uma doutrina específica de prosperidade.
- issue: Sentido de “temer o SENHOR”
  choice: Preservar o verbo “temer” sem paráfrase explicativa
  alternative: Traduzir exclusivamente como “reverenciar” ou “adorar”
  rationale: A expressão hebraica possui amplitude teológica e afetiva que uma paráfrase mais estreita resolveria indevidamente.
- issue: Representação do nome divino יהוה
  choice: SENHOR em versaletes convencionais
  alternative: Yahweh
  rationale: Segue a tradição portuguesa amplamente reconhecida e a camada de consulta adjudicada, sem introduzir uma forma denominacional específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe fluente. “Estatutos” preserva o vocabulário jurídico da aliança; “como hoje se vê” torna idiomática a expressão hebraica de evidência presente.
