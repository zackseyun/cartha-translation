    issue: «Portanto» acrescenta uma relação inferencial.
    rationale: O hebraico começa com waw coordenativo; neste ponto, «Portanto» não é necessário e pode fortalecer indevidamente a ligação lógica com o versículo anterior.
  - severity: medium
