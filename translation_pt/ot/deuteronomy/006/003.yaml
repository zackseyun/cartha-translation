- from: Portanto, ouça, Israel, e tenha o cuidado de cumprir tudo isso, para que tudo vá bem com você e vocês se multipliquem muito, conforme Yahweh, o Deus de seus pais, lhe prometeu[a], numa terra que mana leite e mel.
  to: Ouça, Israel, e tenha o cuidado de praticar, para que tudo vá bem para você e vocês se multipliquem muito, conforme Yahweh, o Deus de seus pais, lhe falou[a], numa terra que mana leite e mel.
  rationale: 'A revisão segue mais de perto o hebraico: retira a inferência de «Portanto», não acrescenta «tudo isso», substitui a interpretação «prometeu» por «falou» e desloca a nota para a ambiguidade efetiva da oração final. Mantém-se a alternância singular/plural, o nome Yahweh e «pais» para אֲבֹתֶיךָ.'
