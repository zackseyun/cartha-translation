base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: pt
  text: Ouça, Israel, e tenha o cuidado de praticar, para que tudo vá bem para você e vocês se multipliquem muito, conforme Yahweh, o Deus de seus pais, lhe falou[a], numa terra que mana leite e mel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «conforme Yahweh, o Deus de seus pais, lhe falou sobre uma terra que mana leite e mel». O hebraico é condensado: «uma terra que mana leite e mel» pode ligar-se ao conteúdo da fala de Yahweh ou ao lugar em que Israel prosperará e se multiplicará.'
    reason: Preserva a ambiguidade sintática da frase hebraica e traduz דִּבֶּר pelo sentido lexical básico, «falou».
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: ouça
  rationale: Preserva o sentido básico de ouvir e deixa a ideia de obediência emergir da oração seguinte, que exige guardar e praticar.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: tenha o cuidado de cumprir tudo isso
  rationale: Expressa de modo natural a observância cuidadosa que resulta em ação; “tudo isso” explicita o objeto implícito, isto é, as instruções do contexto.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: para que tudo vá bem com você
  rationale: Reproduz em português corrente o idioma deuteronômico de bem-estar e benefício.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: e vocês se multipliquem muito
  rationale: O plural verbal passa a dirigir-se ao povo coletivamente; “multipliquem” mantém a ideia de grande aumento populacional.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: conforme ... lhe prometeu
  rationale: No contexto da dádiva da terra, “prometeu” comunica o valor pragmático de “falou”, embora a nota preserve o sentido verbal mais estrito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: o Deus de seus pais
  rationale: Mantém o termo masculino explícito do hebraico, em português natural.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: uma terra que mana leite e mel
  rationale: Usa a formulação portuguesa consagrada e preserva a imagem de abundância.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal de Deus; a transliteração preserva sua função como nome da aliança.
- issue: Relação sintática de “uma terra que mana leite e mel”
  choice: ligação ao lugar em que Israel prosperaria e se multiplicaria
  alternative: aposição ao conteúdo daquilo que Yahweh falou ou prometeu
  rationale: A construção hebraica é comprimida e admite mais de uma ligação. O texto principal escolhe uma leitura natural em português, enquanto a nota registra a alternativa.
- issue: Termo de parentesco אֲבֹתֶיךָ
  choice: seus pais
  alternative: seus antepassados
  rationale: “Pais” representa formalmente o substantivo masculino hebraico, embora no contexto possa abranger os antepassados de Israel.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A alternância entre o singular “você/lhe” e o plural “vocês” reflete a mudança presente no hebraico entre a interpelação coletiva no singular e o verbo plural “multipliquem”. O nome Yahweh é mantido como nome próprio.
