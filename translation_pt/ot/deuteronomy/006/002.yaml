source:
  edition: WLC
  text: לְמַ֨עַן תִּירָ֜א אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ֠/שְׁמֹר אֶת כָּל חֻקֹּתָ֣י/ו וּ/מִצְוֺתָי/ו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ/ךָ֒ אַתָּה֙ וּ/בִנְ/ךָ֣ וּ/בֶן בִּנְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וּ/לְמַ֖עַן יַאֲרִכֻ֥/ן יָמֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: pt
  text: para que você tema Yahweh, seu Deus[a], guardando todos os seus estatutos e mandamentos que eu lhe ordeno — você, seu filho e o filho de seu filho[b] — durante todos os dias da sua vida, e para que os seus dias se prolonguem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reverencie Yahweh, seu Deus”. O verbo hebraico pode abranger temor, reverência e assombro.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão hebraica diz literalmente: “você, seu filho e o filho de seu filho”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os seus dias sejam longos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz propósito ou resultado e corresponde naturalmente à construção hebraica.
- source_word: תִּירָא
  choice: você tema
  rationale: Preserva o sentido de temor, reverência e assombro diante de Deus sem reduzir a tensão lexical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente o substantivo com sufixo de segunda pessoa singular e conserva a linguagem de relação da aliança.
- source_word: לִשְׁמֹר
  choice: guardando
  rationale: Expressa de modo natural o meio pelo qual o temor a Yahweh se manifesta; também preserva o sentido bíblico de observar e cumprir.
- source_word: חֻקֹּתָיו
  choice: seus estatutos
  rationale: Mantém a referência a prescrições estabelecidas e a distingue de מִצְוֺתָיו.
- source_word: מִצְוֺתָיו
  choice: mandamentos
  rationale: Conserva o registro da aliança e a distinção lexical em relação a 'estatutos'.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: que eu lhe ordeno
  rationale: Representa com naturalidade em português o ato de ordenar no discurso presente, sem acrescentar 'hoje', ausente deste versículo.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: você, seu filho e o filho de seu filho
  rationale: Mantém explicitamente as três gerações e preserva a formulação hebraica, sem generalizá-la para todos os descendentes.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: durante todos os dias da sua vida
  rationale: Preserva a extensão temporal e a imagem dos 'dias' em português corrente.
- source_word: וּלְמַעַן
  choice: e para que
  rationale: Conserva a conjunção e introduz a segunda cláusula de propósito ou resultado.
- source_word: יַאֲרִכֻן יָמֶיךָ
  choice: os seus dias se prolonguem
  rationale: Mantém a imagem hebraica de dias tornados longos sem parafraseá-la simplesmente como viver muito.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o Tetragrama como nome próprio; a transliteração preserva essa forma em vez de substituí-la por um título.
- issue: Sentido de ירא diante de Deus
  choice: tema
  alternative: reverencie
  rationale: '''Tema'' conserva a amplitude de temor, reverência e assombro e evita suavizar a tensão teológica do original.'
- issue: Relação entre temer e guardar os mandamentos
  choice: guardando
  alternative: para guardar
  rationale: O infinitivo pode indicar a maneira ou o meio pelo qual o temor se expressa; o gerúndio comunica essa relação sem transformar obediência e temor em conceitos desconectados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'você' para o singular hebraico e mantém termos formais transparentes da linguagem da aliança. Os travessões destacam naturalmente a sequência de três gerações.
