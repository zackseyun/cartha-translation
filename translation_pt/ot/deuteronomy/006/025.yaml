  text: וּ/צְדָקָ֖ה תִּֽהְיֶה לָּ֑/נוּ כִּֽי נִשְׁמֹ֨ר לַ/עֲשׂ֜וֹת אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵ֖י/נוּ כַּ/אֲשֶׁ֥ר צִוָּֽ/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: pt
  text: E isso será justiça para nós[a], se tivermos o cuidado de cumprir todo este mandamento[b] diante de Yahweh, nosso Deus, conforme ele nos ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retidão para nós”. O termo hebraico pode designar aquilo que é correto ou justo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “este mandamento inteiro”. O singular provavelmente apresenta a instrução como um todo unificado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: justiça
  rationale: צְדָקָה designa aquilo que é justo ou correto. “Justiça” preserva a amplitude moral e forense do termo no contexto da aliança, sem introduzir uma formulação teológica posterior.
- source_word: תִּהְיֶה לָּנוּ
  choice: isso será ... para nós
  rationale: Mantém a construção predicativa hebraica e evita explicitar ideias como “será creditado”, que não aparecem no texto.
- source_word: כִּי
  choice: se
  rationale: Neste contexto, introduz a condição ligada à declaração anterior; “se” expressa essa relação com clareza em português.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: tivermos o cuidado de cumprir
  rationale: A combinação de שׁמר com o infinitivo de עשה comunica observância atenta. “Tivermos o cuidado de cumprir” é natural em português e conserva ambas as ideias.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: todo este mandamento
  rationale: Preserva o singular coletivo e apresenta a instrução como um todo unificado.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa estar perante ou na presença de Deus, preservando o sentido de agir sob seu olhar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Preserva diretamente a relação pactual expressa pelo sufixo possessivo.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: conforme ele nos ordenou
  rationale: Expressa naturalmente em português a conformidade com a ordem divina já dada.
theological_decisions:
- issue: Sentido de “justiça” no contexto da obediência à aliança
  choice: A obediência descrita será “justiça para nós”, mantendo a ligação real estabelecida pelo texto entre obediência pactual e justiça.
  alternative: Entender o termo como mera justiça social ou explicá-lo tecnicamente como justiça creditada.
  rationale: O hebraico afirma a relação sem definir um mecanismo teológico posterior; a tradução conserva essa tensão e não a resolve de modo denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva de propósito a estrutura incomum, mas significativa, “será justiça para nós” e mantém o singular coletivo “mandamento”.
