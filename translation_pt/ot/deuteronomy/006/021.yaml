source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לְ/בִנְ/ךָ֔ עֲבָדִ֛ים הָיִ֥ינוּ לְ/פַרְעֹ֖ה בְּ/מִצְרָ֑יִם וַ/יּוֹצִיאֵ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were slaves to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: pt
  text: 'Então[a] você dirá ao seu filho: “Éramos escravos do faraó no Egito, e Yahweh nos tirou do Egito com mão forte[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E você dirá”. A conjunção hebraica pode ser traduzida simplesmente por “e”; “então” explicita a sequência instrutiva iniciada no versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com mão poderosa”. A expressão hebraica se refere ao poderoso ato de libertação realizado por Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Então você dirá
  rationale: A conjunção וְ dá continuidade à sequência instrutiva do versículo anterior, e o perfeito tem força diretiva neste contexto. “Então” torna clara essa sequência em português, enquanto “você dirá” preserva a forma verbal e o tom de instrução.
- source_word: לְבִנְךָ
  choice: ao seu filho
  rationale: O hebraico é explicitamente masculino singular; por isso, “filho” preserva a referência gramatical sem neutralizá-la.
- source_word: עֲבָדִים
  choice: escravos
  rationale: No contexto do êxodo, o termo descreve pessoas submetidas à servidão. “Escravos” comunica melhor o peso da opressão do que “servos”.
- source_word: לְפַרְעֹה
  choice: do faraó
  rationale: A preposição לְ expressa aqui relação de sujeição ou pertencimento. Em português, “escravos do faraó” comunica essa relação de modo natural.
- source_word: בְּמִצְרָיִם
  choice: no Egito
  rationale: A preposição בְּ tem sentido locativo direto.
- source_word: וַיּוֹצִיאֵנוּ
  choice: e ... nos tirou
  rationale: O hifil de יצא significa fazer sair ou tirar. “Nos tirou do Egito” é natural e preserva a ação libertadora; a conjunção “e” mantém a coordenação do hebraico sem introduzir um contraste explícito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é vertido como nome próprio, preservando o nome divino presente no texto hebraico em vez de substituí-lo por um título.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: A preposição מִן indica origem ou ponto de partida; “do Egito” é a formulação idiomática após “tirou”.
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: A tradução mantém de perto a imagem hebraica e comunica a atuação poderosa de Yahweh; “mão poderosa” também é possível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino, sem substituí-lo por um título; “Javé” é uma adaptação portuguesa possível, mas menos próxima da forma adotada pelo projeto.
- issue: Intensidade da condição expressa por עֲבָדִים
  choice: escravos
  alternative: servos
  rationale: A narrativa do êxodo descreve sujeição opressiva ao faraó. “Escravos” preserva o peso histórico e teológico da libertação, ao passo que “servos” poderia suavizar indevidamente essa condição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para o singular hebraico, “faraó” como título em minúscula e preserva a imagem semítica “mão forte”, esclarecida em nota.
