  text: וְ/הָי֞וּ הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם עַל לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: pt
  text: E estas palavras que hoje ordeno a você estarão sobre o seu coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no seu coração”. O hebraico diz literalmente “sobre o seu coração”, expressão que indica conservar continuamente estas palavras na vida interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: estarão
  rationale: O perfeito qal com conjunção, no contexto de exortação, tem valor prospectivo/injuntivo. “Estarão” preserva essa forma sem tornar a frase excessivamente imperativa.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: “Palavras” corresponde diretamente a דְּבָרִים e mantém a referência ao que acaba de ser ordenado sem substituí-la pela interpretação mais específica “mandamentos”.
- source_word: אֲשֶׁר
  choice: que
  rationale: É o conector relativo natural em português neste contexto.
- source_word: אָנֹכִי
  choice: eu, expresso na forma verbal “ordeno”
  rationale: O pronome independente pode acrescentar ênfase, mas o português dispensa sua explicitação; a primeira pessoa já está claramente marcada no verbo.
- source_word: מְצַוְּךָ
  choice: ordeno a você
  rationale: O particípio expressa o ato presente de ordenar. A construção é clara em português internacional e evita o regionalismo de “te ordeno” quanto à colocação pronominal.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente moderno e direto, preservando a imediatez temporal do discurso.
- source_word: עַל לְבָבֶךָ
  choice: sobre o seu coração
  rationale: Preserva a imagem hebraica com עַל, embora “no seu coração” seja a formulação idiomática mais natural em português; a nota esclarece a alternativa.
theological_decisions:
- issue: Expressão antropológica de לְבָב
  choice: coração
  alternative: mente; íntimo
  rationale: No hebraico bíblico, “coração” abrange pensamento, vontade e afeto. Manter o termo preserva essa amplitude e evita restringir o sentido apenas à cognição.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A ordem “ordeno a você” é natural no Brasil e amplamente inteligível. A tradução mantém deliberadamente a imagem menos usual “sobre o seu coração”, apoiada por nota.
