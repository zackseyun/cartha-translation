revisions:
- from: Este é o mandamento — os estatutos e as ordenanças — que Yahweh, o Deus de vocês, ordenou que lhes fosse ensinado, para que vocês os cumpram na terra para a qual estão atravessando, a fim de tomarem posse dela.[a]
  to: Este é o mandamento[a] — os estatutos e as ordenanças — que Yahweh, o Deus de vocês, ordenou ensinar-lhes, para que vocês os cumpram na terra para a qual estão passando, a fim de tomarem posse dela.[b]
  rationale: A revisão substitui a passiva por um infinitivo ativo impessoal, que mantém o agente do ensino não explicitado sem alterar a voz do verbo hebraico. Também torna mais idiomática a expressão do movimento rumo à terra e separa as notas para que suas âncoras correspondam aos termos comentados.
