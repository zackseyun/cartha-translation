base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: pt
  text: Este é o mandamento[a] — os estatutos e as ordenanças — que Yahweh, o Deus de vocês, ordenou ensinar-lhes, para que vocês os cumpram na terra para a qual estão passando, a fim de tomarem posse dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E este é o mandamento — os estatutos e os julgamentos”. A conjunção inicial também pode ser traduzida por “E”, e “ordenanças” pode ser traduzido por “julgamentos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “herdarem-na” ou “possuírem-na”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Este é
  rationale: Introduz a nova seção em ligação com o contexto anterior; em português, a conexão pode permanecer implícita sem acrescentar um marcador temporal ausente do hebraico.
- source_word: הַמִּצְוָה
  choice: o mandamento
  rationale: Mantém o singular do hebraico, provavelmente usado como título coletivo para a instrução pactual desenvolvida nas categorias seguintes.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: Termo jurídico claro e tradicional para prescrições fixadas, preservando a distinção em relação a מִשְׁפָּטִים.
- source_word: וְהַמִּשְׁפָּטִים
  choice: e as ordenanças
  rationale: Comunica decisões ou normas jurídicas em português corrente e digno; evita a possível leitura estritamente forense de 'julgamentos'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Representa naturalmente o sufixo de segunda pessoa plural e tem ampla legibilidade brasileira.
- source_word: לְלַמֵּד אֶתְכֶם
  choice: que lhes fosse ensinado
  rationale: A construção deixa claro, em português, que o conteúdo ordenado por Yahweh deve ser ensinado ao povo, sem identificar explicitamente o agente do ensino, que o hebraico não nomeia aqui.
- source_word: לַעֲשׂוֹת
  choice: para que vocês os cumpram
  rationale: Expressa a finalidade e o sentido prático de 'fazer' normas, usando 'os' como referência aos estatutos e às ordenanças.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: para a qual estão atravessando
  rationale: Preserva o movimento em direção à terra e o aspecto iminente expresso pelo particípio com o elemento direcional.
- source_word: לְרִשְׁתָּהּ
  choice: a fim de tomarem posse dela
  rationale: Traduz o sentido de ירשׁ neste contexto de entrada e ocupação da terra, sem reduzir o verbo à ideia de herança passivamente recebida.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio divino; a transliteração preserva essa forma e evita substituí-la silenciosamente por um título.
- issue: Relação entre o singular 'mandamento' e os plurais 'estatutos' e 'ordenanças'
  choice: Manter o singular como cabeçalho coletivo, seguido da explicação em plurais
  alternative: 'Uniformizar tudo no plural: ''mandamentos, estatutos e ordenanças'''
  rationale: A diferença de número pertence ao texto hebraico e provavelmente apresenta uma instrução una que se desdobra em categorias jurídicas; uniformizá-la eliminaria essa tensão genuína.
- issue: Agente implícito do ensino
  choice: 'Usar construção passiva sem nomear o agente: ''que lhes fosse ensinado'''
  alternative: 'Entender Moisés como agente explícito: ''que eu ensinasse a vocês'''
  rationale: O infinitivo hebraico não explicita seu agente nesta oração; a formulação escolhida preserva essa abertura sem atribuir diretamente a fala a Moisés.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega 'vocês' para o plural e mantém o registro jurídico-pactual sem arcaísmos excessivos. O travessão apresenta 'os estatutos e as ordenanças' como explicação do singular coletivo 'o mandamento'.
