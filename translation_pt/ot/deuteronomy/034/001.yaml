  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: pt
  text: 'Então Moisés subiu das planícies de Moabe ao monte Nebo, ao cume de Pisga, que fica em frente de Jericó. E Yahweh lhe mostrou toda a terra: Gileade até Dã.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: O verbo עלה indica movimento para cima; “subiu” é natural e preserva diretamente o sentido direcional.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: das planícies de Moabe
  rationale: עַרְבוֹת designa a região de planícies ou estepes; “planícies de Moabe” é claro e geograficamente adequado.
- source_word: הַר נְבוֹ
  choice: monte Nebo
  rationale: A construção הַר seguida de topônimo corresponde naturalmente, em português, a “monte” mais o nome próprio.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: ao cume de Pisga
  rationale: רֹאשׁ significa literalmente “cabeça”, mas neste contexto topográfico designa o cume; a formulação é concisa e digna.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: que fica diante de Jericó
  rationale: A expressão geográfica עַל־פְּנֵי pode indicar algo situado defronte de ou voltado para outro lugar; “diante de” preserva essa relação sem impor precisão adicional.
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: Yahweh lhe mostrou
  rationale: O hifil de ראה tem valor causativo, “fazer ver”, expresso naturalmente em português por “mostrar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: Neste contexto, הָאָרֶץ se refere à terra avistada, não ao planeta; “toda a terra” mantém o alcance contextual.
- source_word: אֶת הַגִּלְעָד עַד דָּן
  choice: Gileade até Dã
  rationale: A frase inicia a especificação territorial do que Moisés viu; “até” reproduz adequadamente o limite indicado por עַד.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa por transliteração e evita substituí-lo silenciosamente por um título.
- issue: Valor causativo de וַיַּרְאֵהוּ
  choice: lhe mostrou
  alternative: fez com que ele visse; deixou-o ver
  rationale: “Mostrou” comunica de modo natural o causativo hebraico sem decidir além do texto como se deu a visão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e formas toponímicas correntes. A pontuação com dois-pontos apresenta “Gileade até Dã” como início da especificação de “toda a terra”. Não se acrescentou nota, pois as alternativas lexicais relevantes podem ser representadas adequadamente no texto principal sem perda significativa.
