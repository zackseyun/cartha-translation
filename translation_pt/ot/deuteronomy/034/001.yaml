    issue: Relação geográfica traduzida por «diante de Jericó»
    rationale: Embora possível, «diante de» é menos idiomático no português moderno para localização geográfica e pode ser mais amplo do que a noção de «em frente de/oposto a» do hebraico על־פני. «Em frente de Jericó» preserva a ambiguidade direcional sem tornar a formulação arcaizante.
