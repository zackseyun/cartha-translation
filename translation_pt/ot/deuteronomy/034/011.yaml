    rationale: Cada um dos três termos—faraó, seus servos e sua terra—é introduzido pela preposição לְ. Em português, «diante do faraó, de todos...» faz «todos os seus servos» e «toda a sua terra» dependerem de «de», em vez de os coordenar como destinatários/esferas relacionais dos sinais.
