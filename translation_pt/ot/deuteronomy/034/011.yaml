  naturalness: O registro é claro e solene. «Ao faraó, a todos os seus servos e a toda a sua terra» é uma formulação formal, mas natural e suficientemente direta para reproduzir a relação abrangente e deliberadamente pouco especificada do hebraico.
  terminology: «Yahweh», «sinais e prodígios», «faraó» e «terra do Egito» são escolhas adequadas e consistentes. A nota deve distinguir as alternativas contextuais sem apresentar uma construção portuguesa defeituosa.
  issues:
