base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: pt
  text: por todos os sinais e prodígios que Yahweh o enviou para realizar na terra do Egito, ao faraó, a todos os seus servos e a toda a sua terra[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra o faraó, todos os seus servos e toda a sua terra”; ou “perante o faraó e todos os seus servos, e por toda a sua terra”. A preposição hebraica pode expressar diferentes tipos de relação neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: por todos os sinais e prodígios
  rationale: A preposição לְ mantém a ligação sintática com o versículo anterior e introduz o âmbito em que Moisés não teve igual. “Sinais e prodígios” reproduz a dupla tradicional sem tornar explícita uma interpretação além do texto.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה
  choice: que Yahweh o enviou
  rationale: Conserva de modo direto o verbo שׁלח e o sufixo que identifica Moisés como aquele que Yahweh enviou para executar esses atos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לַעֲשׂוֹת
  choice: para realizar
  rationale: “Realizar” é natural em português com “sinais e prodígios” e comunica o sentido amplo de עשה sem acrescentar conteúdo.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Reflete plenamente a expressão hebraica e preserva o registro narrativo solene.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: diante do faraó, de todos os seus servos e de toda a sua terra
  rationale: “Diante de” apresenta em português corrente a relação dos sinais com o faraó, seus servos e sua terra. Como a preposição לְ admite outras relações contextuais, a nota registra as principais alternativas sem resolver indevidamente a ambiguidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino em forma transliterada.
- issue: Relação dos sinais com o faraó e o Egito
  choice: diante do faraó, de todos os seus servos e de toda a sua terra
  alternative: contra o faraó, todos os seus servos e toda a sua terra
  rationale: O contexto permite uma força adversativa, mas a preposição hebraica לְ é relacional e não exige que ela seja explicitada. A tradução principal evita fechar a tensão, e a nota conserva a leitura adversativa e a ideia de extensão territorial.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O início em minúscula e a vírgula final preservam a dependência sintática deste versículo em relação aos versículos 10 e 12.
