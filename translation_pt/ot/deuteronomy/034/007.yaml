base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: pt
  text: Moisés tinha cento e vinte anos quando morreu; sua vista não havia enfraquecido[a], nem seu vigor havia desaparecido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «seu olho não havia enfraquecido»; isto é, sua visão não havia perdido a acuidade.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como «sua vitalidade não havia diminuído». O termo hebraico se refere ao frescor ou vigor físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: Moisés
  rationale: O waw dá continuidade à narrativa, mas não exige um conectivo explícito em português neste versículo.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: tinha cento e vinte anos
  rationale: Traduz naturalmente o idioma hebraico de idade, literalmente «filho de cento e vinte anos».
- source_word: בְּמֹתוֹ
  choice: quando morreu
  rationale: Expressa de modo idiomático o valor temporal da preposição בְּ com «morte» e o sufixo pronominal.
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: sua vista não havia enfraquecido
  rationale: כָּהָה indica perder a acuidade ou tornar-se fraco/opaco. «Vista» comunica naturalmente em português o sentido idiomático do singular hebraico «olho».
- source_word: וְלֹא נָס לֵחֹה
  choice: nem seu vigor havia desaparecido
  rationale: לֵחַ pode indicar frescor, vitalidade ou vigor corporal; com נוּס, a frase afirma que essa vitalidade não se perdera. A tradução mantém o sentido sem impor uma interpretação médica específica.
theological_decisions: []
