  text: וַ/יִּקְבֹּ֨ר אֹת֤/וֹ בַ/גַּיְ֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב מ֖וּל בֵּ֣ית פְּע֑וֹר וְ/לֹֽא יָדַ֥ע אִישׁ֙ אֶת קְבֻ֣רָת֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: pt
  text: E ele o sepultou no vale, na terra de Moabe,[a] em frente de Bete-Peor; e ninguém sabe onde fica a sepultura dele até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito de «ele o sepultou» não é nomeado neste versículo; o contexto anterior aponta para o SENHOR.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: E ele o sepultou
  rationale: O verbo está no qal, terceira pessoa masculina singular, com sentido ativo. O sujeito não é expresso neste versículo; o pronome «ele» preserva essa forma sem inserir explicitamente «o SENHOR» nem recorrer à voz passiva.
- source_word: בַגַּיְ
  choice: no vale
  rationale: גַּיְ pode designar um vale ou desfiladeiro. «Vale» é natural, claro e adequado ao contexto.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: na terra de Moabe
  rationale: Mantém a expressão concreta do hebraico, em vez de reduzi-la simplesmente a «em Moabe».
- source_word: מוּל
  choice: em frente de
  rationale: Expressa a posição espacial correspondente indicada por מוּל e soa natural no português contemporâneo.
- source_word: בֵּית פְּעוֹר
  choice: Bete-Peor
  rationale: Transliteração portuguesa tradicional e inteligível do topônimo hebraico.
- source_word: וְלֹא יָדַע אִישׁ
  choice: e ninguém sabe
  rationale: Embora אִישׁ seja literalmente «homem», aqui tem valor genérico. «Ninguém sabe» comunica esse sentido com naturalidade e sem sugerir indevidamente que apenas homens estão em vista. O perfeito hebraico, dentro da expressão temporal que chega ao presente do narrador, é idiomaticamente vertido pelo presente.
- source_word: קְבֻרָתוֹ
  choice: onde fica a sepultura dele
  rationale: No contexto, o substantivo se refere ao local do sepultamento. Esta formulação deixa claro que o desconhecido é a localização da sepultura, preservando o sentido contextual.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente português corrente que preserva a continuidade até o tempo do narrador.
theological_decisions:
- issue: Identidade do sujeito de «ele o sepultou»
  choice: Manter «ele» sem identificar explicitamente o sujeito no texto principal.
  alternative: Traduzir «o SENHOR o sepultou» com base no contexto anterior, ou usar a passiva «ele foi sepultado».
  rationale: O contexto imediato aponta fortemente para o SENHOR, mas o sujeito não é nomeado neste versículo. A tradução conserva a ambiguidade gramatical e registra a inferência contextual em nota.
- issue: Masculino genérico אִישׁ
  choice: Traduzir como «ninguém».
  alternative: Traduzir literalmente como «nenhum homem».
  rationale: Neste enunciado, אִישׁ tem força genérica. «Ninguém» reproduz com precisão o alcance semântico em português moderno e evita uma restrição masculina inexistente no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a construção ativa e a referência pronominal ambígua do hebraico. O topônimo segue a forma portuguesa «Bete-Peor».
