base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/002.yaml
  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: pt
  text: e toda a região de Naftali, a terra de Efraim e Manassés e toda a terra de Judá, até o mar ocidental[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o mar de trás” ou “o último mar”, modo hebraico de se referir ao mar que fica a oeste, isto é, o mar Mediterrâneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: toda a região de Naftali
  rationale: A expressão designa toda a extensão associada à tribo de Naftali. Em português, “toda a região de Naftali” comunica naturalmente o sentido geográfico sem confundi-lo com a totalidade das pessoas da tribo.
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: a terra de Efraim e Manassés
  rationale: אֶרֶץ indica terra ou território. A coordenação dos dois nomes tribais permite uma única expressão, fluente em português, sem necessidade de repetir “de”.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: toda a terra de Judá
  rationale: Mantém explicitamente o elemento אֶרֶץ e o enfoque geográfico do hebraico.
- source_word: עַד
  choice: até
  rationale: Neste panorama territorial, עַד indica o limite ou alcance da visão; “até” é a forma direta e natural em português.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: o mar ocidental
  rationale: A expressão hebraica significa literalmente “o mar de trás” ou “o último mar” e funciona como designação direcional do mar a oeste. “Mar ocidental” transmite esse sentido sem substituir a expressão pelo nome interpretativo “mar Mediterrâneo” no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição moderada de “terra” preserva o caráter geográfico da enumeração. O marcador da nota foi colocado após “mar ocidental”, expressão à qual a nota lexical se refere.
