base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: pt
  text: 'E Yahweh lhe disse: “Esta é a terra que jurei dar a Abraão, a Isaque e a Jacó, dizendo: ‘Eu a darei à sua descendência[a].’ Fiz com que você a visse com os próprios olhos, mas você não atravessará para lá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semente”. O hebraico emprega um substantivo coletivo no singular.
    reason: Registra a forma e a alternativa lexical do hebraico זֶרַע sem sacrificar a naturalidade do texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva diretamente o nome divino do texto hebraico e segue a convenção do projeto.
- source_word: זֹאת הָאָרֶץ
  choice: Esta é a terra
  rationale: No contexto da promessa patriarcal, אֶרֶץ designa a terra prometida, e não apenas um território genérico.
- source_word: נִשְׁבַּעְתִּי
  choice: jurei dar
  rationale: O verbo expressa juramento; a inclusão de “dar” antecipa de modo natural em português o conteúdo da oração citada, sem alterar seu sentido.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: a Abraão, a Isaque e a Jacó
  rationale: Mantém todos os três destinatários do juramento e reproduz a cadência solene em português natural.
- source_word: לֵאמֹר
  choice: quando declarei
  rationale: Introduz idiomaticamente em português o conteúdo do juramento, evitando a construção pouco natural “dizendo” depois de “jurei dar”.
- source_word: לְזַרְעֲךָ
  choice: à sua descendência
  rationale: זֶרַע é singular na forma, mas coletivo neste contexto; “descendência” preserva essa característica e é corrente em português.
- source_word: אֶתְּנֶנָּה
  choice: Eu a darei
  rationale: Expressa de maneira direta a promessa futura, com o pronome feminino retomando “terra”.
- source_word: הֶרְאִיתִיךָ
  choice: Fiz com que você a visse
  rationale: Torna perceptível o valor causativo do hifil de ראה sem perder clareza.
- source_word: בְּעֵינֶיךָ
  choice: com os próprios olhos
  rationale: Reproduz a ênfase idiomática na visão direta e pessoal de Moisés.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: mas você não atravessará para lá
  rationale: “Mas” explicita o contraste contextual, enquanto “atravessará” conserva a imagem espacial de passar para a terra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome da aliança segundo a convenção adotada pelo projeto, em vez de substituí-lo por um título.
- issue: Sentido de זֶרַע na promessa patriarcal
  choice: descendência
  alternative: semente; descendentes
  rationale: O substantivo hebraico tem forma singular e sentido coletivo. “Descendência” mantém essa tensão sem impor uma referência exclusivamente singular ou plural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” para o singular dirigido a Moisés, evitando tanto arcaísmo quanto regionalismo excessivo. O marcador [a] foi colocado junto de “descendência”, expressão à qual a nota efetivamente se refere.
