base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: pt
  text: E nunca mais se levantou em Israel profeta como Moisés[a], a quem Yahweh conhecia face a face.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ainda”; com a negação, o advérbio hebraico indica que, até o tempo do narrador, não havia surgido em Israel profeta como Moisés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: E nunca
  rationale: A conjunção dá continuidade à conclusão narrativa, e a negação combina naturalmente com עוֹד na expressão portuguesa “nunca mais”.
- source_word: קָם
  choice: se levantou
  rationale: O verbo קום descreve aqui o surgimento de um profeta; “se levantou” preserva a imagem hebraica e é uma formulação bíblica clara em português.
- source_word: נָבִיא
  choice: profeta
  rationale: Equivalente comum e direto do substantivo hebraico.
- source_word: עוֹד
  choice: mais
  rationale: Em combinação com a negação, indica que, desde então, não surgiu outro profeta comparável a Moisés. A alternativa temporal “até hoje” é explicitada em nota por causa da possível perspectiva do narrador.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Expressa naturalmente o âmbito em que nenhum profeta comparável surgiu.
- source_word: כְּמֹשֶׁה
  choice: como Moisés
  rationale: Reproduz diretamente a comparação introduzida por כ.
- source_word: אֲשֶׁר יְדָעוֹ
  choice: a quem ... conhecia
  rationale: Moisés é o objeto do verbo ידע. O imperfeito hebraico, nesta caracterização, pode transmitir uma relação contínua ou habitual; “conhecia” é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: פָּנִים אֶל פָּנִים
  choice: face a face
  rationale: Preserva a imagem concreta e a ressonância intertextual da expressão hebraica de encontro direto.
theological_decisions:
- issue: Linguagem antropomórfica na relação de Yahweh com Moisés
  choice: Manter “face a face” sem explicação redutora
  alternative: “conhecia pessoalmente” ou “conhecia diretamente”
  rationale: O hebraico emprega linguagem relacional concreta. A tradução conserva a imagem e a tensão teológica sem definir além do texto a natureza dessa proximidade.
- issue: Sentido relacional de ידע
  choice: “conhecia”
  alternative: “reconhecia” ou “tinha conhecido”
  rationale: “Conhecia” mantém a amplitude semântica do verbo e permite que “face a face” caracterize a singularidade da relação e da revelação, sem impor uma interpretação doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, preservando a comparação com Moisés e a expressão concreta “face a face”.
