base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: pt
  text: Os filhos de Israel choraram por Moisés nas planícies de Moabe durante trinta dias. Então se completaram os dias de choro e luto por Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: choraram
  rationale: O verbo בכה indica chorar ou derramar lágrimas; “choraram” é natural em português e mantém o ato distinto do luto mencionado depois.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica tradicional e continua clara para leitores modernos, sem reduzi-la simplesmente a “os israelitas”.
- source_word: אֶת מֹשֶׁה
  choice: por Moisés
  rationale: Com בכה, a partícula introduz a pessoa cuja morte provoca o choro; em português, a regência idiomática é “chorar por alguém”.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: nas planícies de Moabe
  rationale: עֲרָבוֹת designa terras planas ou de estepe; “planícies de Moabe” é uma designação geográfica clara e consagrada.
- source_word: שְׁלֹשִׁים יוֹם
  choice: durante trinta dias
  rationale: A preposição “durante” torna explícito, de modo natural, o valor de duração da expressão temporal hebraica.
- source_word: וַיִּתְּמוּ
  choice: se completaram
  rationale: O verbo תם expressa que o período chegou ao seu termo; “se completaram” conserva o aspecto resultativo sem soar excessivamente técnico.
- source_word: יְמֵי בְכִי אֵבֶל מֹשֶׁה
  choice: os dias de choro e luto por Moisés
  rationale: A sequência hebraica compacta associa o choro ao período de luto por Moisés. A coordenação com “e” comunica essa relação de forma natural, sem acrescentar conteúdo.
