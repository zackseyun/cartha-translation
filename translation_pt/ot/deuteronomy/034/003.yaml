  text: וְ/אֶת הַ/נֶּ֗גֶב וְֽ/אֶת הַ/כִּכָּ֞ר בִּקְעַ֧ת יְרֵח֛וֹ עִ֥יר הַ/תְּמָרִ֖ים עַד צֹֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/003.yaml
  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: pt
  text: e o Neguebe[a], e a planície, o vale de Jericó[b], a cidade das palmeiras, até Zoar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o sul». O termo hebraico pode funcionar tanto como nome da região do Neguebe quanto como indicação geográfica ou direcional.
    reason: lexical_alternative
  - marker: b
    text: Ou «a planície de Jericó». O termo hebraico designa um vale amplo ou uma planície.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: o Neguebe
  rationale: Neste inventário geográfico, o termo funciona como nome da região meridional; a forma consagrada em português preserva esse valor toponímico.
- source_word: הַכִּכָּר
  choice: a planície
  rationale: No uso geográfico, o termo designa a planície ou distrito do vale do Jordão; «a planície» é natural e mantém aberta sua relação apositiva com a expressão seguinte.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: o vale de Jericó
  rationale: בִּקְעָה indica um vale amplo ou planície. «Vale» diferencia a expressão de הַכִּכָּר sem perder o sentido topográfico.
- source_word: עִיר הַתְּמָרִים
  choice: a cidade das palmeiras
  rationale: Tradução direta e idiomática do epíteto conhecido de Jericó, preservando sua imagem concreta.
- source_word: עַד צֹעַר
  choice: até Zoar
  rationale: עַד assinala o limite ou alcance da região mostrada; «até Zoar» expressa isso de modo conciso em português.
- source_word: וְאֶת ... וְאֶת
  choice: e ... e
  rationale: A repetição de «e» conserva o ritmo cumulativo da enumeração hebraica sem reproduzir o marcador de objeto, que não tem equivalente direto em português.
