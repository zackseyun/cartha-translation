  source_fidelity: 'A tradução capta adequadamente o caráter público dos atos de Moisés e o sentido de poder e temor das expressões hebraicas. Contudo, “atos de mão poderosa” não é uma formulação portuguesa natural e mantém a metáfora de modo impreciso: no hebraico, “mão forte” é uma expressão de poder atuante, não uma categoria de atos “de mão”. A revisão a verte de modo idiomático, sem perder o sentido metafórico indicado em nota.'
  naturalness: “Atos de mão poderosa” é pouco idiomático no português moderno. “Atos poderosos” e “grandes feitos que inspiravam temor” são claros, dignos e naturais, preservando a repetição enfática de כָּל (“todos”).
  terminology: “Moisés”, “Israel” e “à vista de todo o Israel” são adequados. “Temor” é preferível a “temíveis” neste contexto, pois expressa mais diretamente o valor de מוֹרָא como aquilo que produz temor/awe, sem reduzir a expressão a uma qualidade genérica dos feitos.
