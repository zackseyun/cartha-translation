  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: pt
  text: e por todos os atos poderosos e por todos os grandes feitos que inspiravam temor que Moisés realizou à vista de todo o Israel[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “toda a mão forte”. “Mão” pode representar poder ou ação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todo o grande terror” ou “toda grande manifestação que inspirava temor”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “diante dos olhos de todo o Israel”, isto é, publicamente, perante toda a nação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל הַיָּד הַחֲזָקָה
  choice: e por todos os atos de mão poderosa
  rationale: A expressão hebraica é literalmente “e por toda a mão forte”. Como “mão” representa poder e ação, a formulação escolhida conserva a imagem hebraica, mas explicita de modo natural em português que se trata dos atos poderosos realizados por Moisés.
- source_word: וּלְכֹל הַמּוֹרָא הַגָּדוֹל
  choice: e por todos os feitos grandiosos e temíveis
  rationale: מוֹרָא pode designar terror, algo temível ou uma manifestação que inspira temor. O plural idiomático “feitos” torna natural a ligação com עָשָׂה e comunica o caráter assombroso das ações sem restringir o termo a mero terror psicológico.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: que Moisés realizou
  rationale: עָשָׂה significa amplamente “fazer”. Com “atos” e “feitos”, “realizou” oferece uma construção portuguesa corrente e digna.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: à vista de todo o Israel
  rationale: Reproduz o sentido público da expressão literalmente ligada aos “olhos”, indicando que os acontecimentos ocorreram diante de toda a nação.
theological_decisions:
- issue: Natureza dos atos de Moisés na conclusão do livro
  choice: Apresentá-los como atos poderosos e temíveis realizados publicamente por Moisés.
  alternative: 'Traduzir de modo estritamente literal: “toda a mão forte” e “todo o grande terror”.'
  rationale: A tradução mantém o elogio conclusivo à atuação extraordinária de Moisés, sem especificar além do hebraico a origem, o mecanismo ou uma interpretação doutrinária posterior desses atos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém a imagem da “mão poderosa”, mas evita o português pouco natural de dizer que Moisés “fez uma mão” ou “fez terror”.
