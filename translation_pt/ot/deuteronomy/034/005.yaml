reference: Deuteronomy 34:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֨מָת שָׁ֜ם מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה בְּ/אֶ֥רֶץ מוֹאָ֖ב עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: pt
  text: Assim, Moisés, servo de Yahweh, morreu ali, na terra de Moabe, conforme a palavra de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre a boca de Yahweh”; a expressão também pode ser traduzida como “por ordem de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O wayyiqtol de מות dá sequência à narrativa. Em português, o pretérito perfeito expressa naturalmente o acontecimento; “assim” representa de modo idiomático a progressão narrativa.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio retoma o lugar mencionado no contexto anterior. “Ali” conserva sua força dêitica e soa natural em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: Embora עֶבֶד também possa significar “escravo”, aqui integra um título honorífico que destaca a relação de serviço e missão de Moisés perante Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: na terra de Moabe
  rationale: Mantém o substantivo אֶרֶץ e a ênfase geográfica explícita do hebraico.
- source_word: עַל פִּי יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: Expressa de forma natural o sentido idiomático de agir ou ocorrer de acordo com a palavra ou determinação de alguém, sem apagar na nota a imagem literal de “boca” nem a alternativa “por ordem”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Nuance de עֶבֶד no título de Moisés
  choice: servo
  alternative: escravo
  rationale: Neste contexto, o termo funciona como título honorífico de fidelidade e missão. “Escravo” destacaria indevidamente a condição jurídica de cativeiro.
- issue: Sentido de עַל פִּי יְהוָה
  choice: conforme a palavra de Yahweh
  alternative: por ordem de Yahweh; literalmente, sobre a boca de Yahweh
  rationale: A expressão é idiomática e pode indicar conformidade com a palavra ou ordem divina. A tradução mantém a referência à “palavra”, enquanto a nota preserva a imagem literal e a alternativa sem decidir além do que o hebraico exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o hebraico sem rigidez; as vírgulas destacam naturalmente o título de Moisés e os adjuntos. O nome divino é transliterado como “Yahweh”, e a ambiguidade idiomática da expressão final é preservada em nota.
