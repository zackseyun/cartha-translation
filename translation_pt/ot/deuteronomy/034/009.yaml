source:
  edition: WLC
  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: pt
  text: Josué, filho de Num, estava cheio do espírito de sabedoria[a], porque Moisés havia imposto as mãos sobre ele. Por isso, os filhos de Israel lhe deram ouvidos e fizeram como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava cheio do Espírito de sabedoria”. O hebraico pode ser entendido de modo mais geral como um espírito de sabedoria ou, mais especificamente, como capacitação divina.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: estava cheio do espírito de sabedoria
  rationale: A construção com o adjetivo מָלֵא é reproduzida naturalmente por “estava cheio de”. “Espírito de sabedoria” conserva a forma e a ambiguidade do hebraico, sem decidir se se trata explicitamente do Espírito Santo ou, de modo mais geral, de uma capacitação divina.
- source_word: רוּחַ
  choice: espírito
  rationale: Neste contexto, רוּחַ indica espírito ou capacitação associada à sabedoria. A inicial minúscula evita identificar de maneira inequívoca o termo com o Espírito Santo, algo que o hebraico não exige.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: havia imposto as mãos sobre ele
  rationale: “Impor as mãos” é a expressão portuguesa corrente para o ato formal descrito pelo idioma hebraico e mantém o valor ritual e comissionador do gesto.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: lhe deram ouvidos
  rationale: A expressão comunica escuta atenta com implicação de obediência, enquanto a oração seguinte explicita que o povo agiu de acordo com a ordem divina.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e pactual literalmente masculina do hebraico, em vez de reduzi-la ao gentílico “israelitas”.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: fizeram como Yahweh havia ordenado a Moisés
  rationale: Formulação portuguesa natural que preserva a conformidade das ações de Israel com a ordem anteriormente dada por Yahweh a Moisés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e o distingue de títulos como “Senhor”.
theological_decisions:
- issue: Se רוּחַ em “espírito de sabedoria” é uma referência direta ao Espírito Santo
  choice: “espírito de sabedoria”, com inicial minúscula
  alternative: “Espírito de sabedoria”, como identificação explícita com o Espírito Santo
  rationale: O contexto indica capacitação divina de Josué, mas a expressão hebraica não obriga uma identificação explícita. A tradução e a nota preservam essa tensão.
- issue: Como traduzir בְּנֵי יִשְׂרָאֵל quanto ao gênero e à linguagem familiar
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A escolha mantém a forma masculina e a imagem familiar e pactual do texto hebraico, embora em português a expressão designe coletivamente o povo de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lhe deram ouvidos” preserva a relação entre escutar e obedecer; “imposto as mãos” emprega a expressão ritual consagrada sem linguagem excessivamente arcaica.
