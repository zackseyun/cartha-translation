  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: pt
  text: Eles também eram considerados refains[a], como os anaquins; mas os moabitas os chamam de emins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «gigantes», para «refains», embora o hebraico preserve mais naturalmente o nome de um antigo povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: refains
  rationale: Mantém o termo como nome de um antigo povo, que é seu sentido mais natural neste contexto, sem impor a interpretação mais específica «gigantes».
- source_word: יֵחָשְׁבוּ
  choice: eram considerados
  rationale: O nifal de חשׁב expressa aqui classificação ou reconhecimento como parte de uma categoria; o imperfeito recebe valor passado no contexto narrativo.
- source_word: אַף הֵם
  choice: também eles
  rationale: 'Preserva a ênfase inclusiva da expressão hebraica: esse povo igualmente era classificado entre os refains.'
- source_word: כָּעֲנָקִים
  choice: como os anaquins
  rationale: A preposição כ־ indica comparação; «como os anaquins» é natural em português e conserva anaquins como designação étnica.
- source_word: וְהַמֹּאָבִים
  choice: mas os moabitas
  rationale: O waw introduz aqui um contraste discursivo entre a classificação geral e o nome usado pelos moabitas; «mas» explicita naturalmente essa relação.
- source_word: יִקְרְאוּ לָהֶם
  choice: os chamavam
  rationale: A construção קרא ל significa chamar ou dar um nome; o imperfeito é vertido no passado habitual de acordo com o contexto.
- source_word: אֵמִים
  choice: emins
  rationale: Translitera o nome dado pelos moabitas a esse povo e não acrescenta artigo ausente no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas étnicas aportuguesadas e correntes («refains», «anaquins», «moabitas», «emins»). A ordem «Também eles» conserva a ênfase do hebraico sem soar excessivamente arcaica.
