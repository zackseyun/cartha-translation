  source_fidelity: A tradução conserva adequadamente a sequência temporal, a tomada de todas as cidades, o verbo técnico חרם, a enumeração de homens, mulheres e crianças pequenas, e a afirmação de que não ficou sobrevivente. Contudo, o travessão em “cada cidade — os homens...” cria uma aposição imprecisa, como se homens, mulheres e crianças fossem equivalentes à cidade, em vez de serem as pessoas incluídas na destruição.
  naturalness: “Naquele tempo”, “conquistamos” e “Não deixamos nenhum sobrevivente” são claros e naturais. A construção revista com “com os homens, as mulheres e as crianças pequenas” torna a relação sintática e semântica mais fluente em português moderno.
  terminology: “Consagramos à destruição” é uma boa reprodução do caráter técnico-sacral de חרם. A nota, porém, deve evitar “anátema”, termo que pode sugerir categorias posteriores e não é a alternativa portuguesa mais precisa neste contexto. “ḥerem” na nota explica o conceito sem o importar para o texto principal.
