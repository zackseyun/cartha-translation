base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: pt
  text: Naquele tempo, conquistamos todas as suas cidades e consagramos à destruição[a] cada cidade, com os homens, as mulheres e as crianças pequenas. Não deixamos nenhum sobrevivente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “submetemos cada cidade ao ḥerem”. O verbo hebraico expressa a ideia de destinar algo à destruição sob o ḥerem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: conquistamos
  rationale: O verbo לכד é usado para a tomada militar de cidades. “Conquistamos” é natural em português e mantém claramente o contexto de guerra.
- source_word: כָּל עָרָיו
  choice: todas as suas cidades
  rationale: Preserva tanto a abrangência de כָּל como a referência possessiva; “cidades” é adequado ao contexto de conquista.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Tradução direta, corrente e digna da expressão temporal hebraica.
- source_word: וַנַּחֲרֵם
  choice: consagramos à destruição
  rationale: O hifil de חרם expressa a aplicação do ḥerem, isto é, a destinação irrevogável à destruição. A formulação conserva a dimensão técnico-sacral sem reduzir o termo a “destruímos completamente”.
- source_word: כָּל עִיר מְתִם
  choice: cada cidade — os homens
  rationale: A construção hebraica é condensada, e מְתִם designa os homens entre os habitantes. O travessão introduz naturalmente, em português, a enumeração de homens, mulheres e crianças abrangidos pela ação.
- source_word: וְהַנָּשִׁים וְהַטָּף
  choice: as mulheres e as crianças pequenas
  rationale: Mantém as categorias explicitamente distinguidas no hebraico; טף se refere especialmente a crianças pequenas ou dependentes jovens.
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: Não deixamos nenhum sobrevivente
  rationale: “Sobrevivente” comunica com clareza o sentido de שָׂרִיד no contexto militar e resulta idiomático em português.
theological_decisions:
- issue: Linguagem de חרם no relato de conquista
  choice: consagramos à destruição
  alternative: destruímos completamente; colocamos sob o anátema
  rationale: A opção principal preserva a dimensão sacral e judicial do termo técnico hebraico sem suavizar a violência narrada nem acrescentar uma explicação teológica externa ao versículo.
- issue: Especificidade de מְתִם na enumeração
  choice: os homens, as mulheres e as crianças pequenas
  alternative: os habitantes, incluindo mulheres e crianças
  rationale: O hebraico distingue expressamente homens, mulheres e crianças. A tradução conserva essa distinção em vez de generalizá-la como “habitantes” ou “pessoas”.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Conquistamos” evita uma formulação excessivamente literal; “consagramos à destruição” mantém o caráter técnico de חרם. O travessão torna compreensível a construção hebraica condensada sem apagar a menção específica aos homens.
