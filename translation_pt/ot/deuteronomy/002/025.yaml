  text: הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ תֵּ֤ת פַּחְדְּ/ךָ֙ וְ/יִרְאָ֣תְ/ךָ֔ עַל פְּנֵי֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָ֑יִם אֲשֶׁ֤ר יִשְׁמְעוּ/ן֙ שִׁמְעֲ/ךָ֔ וְ/רָגְז֥וּ וְ/חָל֖וּ מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: pt
  text: Hoje começarei a pôr o pavor e o medo de você sobre os povos debaixo de todos os céus. Eles ouvirão notícias a seu respeito[a], tremerão e se contorcerão[b] por causa de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouvirão falar da sua fama” ou “ouvirão relatos sobre você”. A expressão hebraica pode indicar uma notícia ou relato que produz reputação.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficarão angustiados” ou “se contorcerão como uma mulher em trabalho de parto”. O verbo hebraico evoca intenso sofrimento físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחֵל תֵּת
  choice: começarei a pôr
  rationale: A construção idiomática com o hifil de חלל e o infinitivo de נתן significa começar a dar ou pôr. “Pôr” combina naturalmente com “pavor e medo” em português.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: o pavor e o medo de você
  rationale: 'Mantém os dois termos hebraicos distintos e deixa claro o sentido objetivo: trata-se do pavor e do medo causados pela pessoa interpelada, não dos sentimentos dela própria.'
- source_word: עַל פְּנֵי הָעַמִּים
  choice: sobre os povos
  rationale: A expressão é literalmente “sobre a face dos povos”, mas “sobre os povos” comunica o valor idiomático com naturalidade e evita sugerir apenas o rosto físico das pessoas.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: debaixo de todos os céus
  rationale: Conserva o plural hebraico e a abrangência universal da expressão.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: Eles ouvirão notícias a seu respeito
  rationale: שֵׁמַע pode indicar notícia, relato ou fama. “Notícias a seu respeito” preserva essa amplitude sem restringir o sentido à fama já estabelecida.
- source_word: וְרָגְזוּ
  choice: tremerão
  rationale: O verbo descreve tremor ou agitação provocados pelo medo; “tremerão” é claro e natural no contexto.
- source_word: וְחָלוּ
  choice: se contorcerão
  rationale: O verbo evoca aflição física intensa, inclusive a imagem de contorções como as dores de parto, sem exigir que essa comparação seja explicitada no texto principal.
- source_word: מִפָּנֶיךָ
  choice: por causa de você
  rationale: Embora a expressão seja literalmente “diante da sua face/presença”, neste contexto indica a causa do terror dos povos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para conservar o destinatário gramatical singular do hebraico sem recorrer ao mais regional ou solene “tu”. A divisão em duas frases melhora a fluidez sem alterar a progressão do original.
