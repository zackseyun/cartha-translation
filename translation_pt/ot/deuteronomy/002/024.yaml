  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: pt
  text: 'Levantem-se, partam e atravessem o vale do Arnom.[a] Vê: entreguei em tua mão Seom, rei de Hesbom, o amorreu, e sua terra. Começa a tomar posse dela[b] e entra em guerra contra ele.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o uádi do Arnom”, “o leito da torrente do Arnom” ou “o ribeiro do Arnom”; o termo hebraico pode indicar um vale, um leito de curso d’água ou uma torrente.
    reason: lexical_alternative
  - marker: b
    text: Ou “Começa a possuí-la”. O verbo também pode ter o sentido de “despossuir”, mas o objeto mencionado imediatamente antes é a terra de Seom.
    reason: lexical_alternative
  - marker: c
    text: Ou “trava combate contra ele”, “contende com ele em guerra” ou “provoca-o à guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ
  choice: Levantem-se
  rationale: Imperativo plural de קום. A forma é natural em português atual e mantém a força do chamado à ação.
- source_word: סְּע֗וּ
  choice: partam
  rationale: No contexto de deslocamento, נסע ordena que o povo prossiga viagem; “partam” é conciso e idiomático.
- source_word: וְ/עִבְרוּ֮
  choice: e atravessem
  rationale: עבר com um acidente geográfico indica atravessá-lo; a tradução conserva o movimento espacial.
- source_word: נַ֣חַל אַרְנֹן
  choice: o vale do Arnom
  rationale: נחל pode designar vale, leito de torrente ou curso d’água sazonal. “Vale do Arnom” é claro e acessível, enquanto a nota preserva as alternativas geográficas.
- source_word: רְאֵ֣ה
  choice: Vejam
  rationale: Embora o hebraico tenha imperativo singular, o discurso em português dirige-se naturalmente ao povo no plural, em harmonia com os imperativos plurais ao redor; mantém-se a função de chamar atenção.
- source_word: נָתַ֣תִּי בְ֠/יָדְ/ךָ
  choice: entreguei nas mãos de vocês
  rationale: Mantém tanto o perfeito hebraico, que apresenta a concessão como realizada, quanto a imagem idiomática de colocar alguém sob o poder de outro.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י
  choice: Seom, rei de Hesbom, o amorreu
  rationale: Conserva a sequência apositiva do hebraico, identificando Seom por seu reino e por seu povo.
- source_word: וְ/אֶת אַרְצ֖/וֹ
  choice: e a terra dele
  rationale: אֶרֶץ designa aqui o território governado por Seom; “terra” é direto e preserva a formulação bíblica.
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: Comecem a tomar posse dela
  rationale: החל introduz o começo da ação, e ירש pode significar possuir ou despossuir. Como “a terra dele” é o objeto expresso imediatamente antes, “tomar posse dela” comunica bem a construção sem eliminar a alternativa lexical.
- source_word: וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה
  choice: e entrem em guerra contra ele
  rationale: A expressão denota iniciar hostilidades ou travar combate. Esta formulação é clara em português e evita reduzir o sentido a mera provocação verbal.
theological_decisions:
- issue: Dádiva divina e ação humana na conquista
  choice: Preservar a concessão divina como já efetuada (“entreguei”) e, ao mesmo tempo, as ordens para tomar posse e entrar em guerra.
  alternative: Traduzir o perfeito como promessa futura (“entregarei”) ou destacar sobretudo a ideia de despossuir.
  rationale: O hebraico justapõe a ação soberana de Deus e a resposta ativa exigida de Israel. A tradução mantém essa tensão sem transformar a concessão em simples previsão nem intensificar além do necessário a linguagem de conquista.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com concordância no plural para o povo interpelado. Emprega “vocês” apenas dentro da expressão idiomática “nas mãos de vocês”, favorecendo legibilidade brasileira sem regionalismos marcados. As notas preservam a amplitude semântica dos termos geográfico e militares.
