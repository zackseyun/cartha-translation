base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: pt
  text: Em Seir, os horeus habitavam antigamente, mas os filhos de Esaú os desalojaram[a], destruíram-nos da presença deles[b] e passaram a habitar no lugar deles, assim como Israel fez com a terra de sua herança[c], que Yahweh lhes deu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os expulsaram e tomaram posse da terra deles”. O verbo hebraico pode indicar tomar posse mediante a remoção dos habitantes anteriores.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de diante deles”, expressão que indica removê-los de sua presença.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a terra de sua possessão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: os horeus
  rationale: Emprega o nome étnico convencional em português para o povo que habitava Seir.
- source_word: לְפָנִים
  choice: antigamente
  rationale: Expressa claramente o sentido temporal do advérbio neste contexto.
- source_word: יִירָשׁוּם
  choice: os despojaram de sua terra
  rationale: O verbo ירשׁ, em contexto de conquista, combina a tomada de posse com a remoção dos habitantes anteriores. A explicitação de 'sua terra' torna esse sentido natural em português sem alterar a referência.
- source_word: וַיַּשְׁמִידוּם
  choice: destruíram-nos
  rationale: Preserva a força de שׁמד sem especificar, além do hebraico, a extensão exata da destruição.
- source_word: מִפְּנֵיהֶם
  choice: de diante de si
  rationale: Mantém a imagem do idioma hebraico e deixa claro que os horeus foram removidos da presença dos filhos de Esaú.
- source_word: תַּחְתָּם
  choice: no lugar deles
  rationale: Comunica naturalmente a substituição dos antigos habitantes pelos descendentes de Esaú.
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: assim como Israel fez
  rationale: Reproduz diretamente a fórmula comparativa e seu valor narrativo.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: com a terra de sua possessão
  rationale: Conserva o singular coletivo referente a Israel e o sentido de יְרֻשָּׁה como território recebido e possuído.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לָהֶם
  choice: lhes
  rationale: Preserva a mudança do singular coletivo 'Israel/sua' para o plural que se refere aos israelitas.
theological_decisions:
- issue: Ponto histórico de referência da comparação com o que Israel fez
  choice: Manter a comparação histórica tal como aparece no texto recebido
  alternative: Reformular a oração para evitar a impressão de que Israel já havia tomado posse da terra, ou tratá-la como glosa posterior
  rationale: O hebraico apresenta diretamente a ação de Israel como termo da comparação. A tradução não resolve debates cronológicos ou crítico-literários que o próprio versículo deixa em aberto.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o paralelismo narrativo e a mudança de número entre o Israel coletivo e o povo no plural; notas breves registram alternativas lexicais genuínas.
