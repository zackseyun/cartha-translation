base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: pt
  text: Além disso, a mão de Yahweh esteve contra eles, para lançá-los em confusão[a] e fazê-los desaparecer do meio do acampamento, até que desaparecessem por completo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desbaratá-los” ou “pô-los em debandada”; o verbo hebraico pode descrever pânico, confusão ou desordem causados como ato de juízo divino.
    reason: lexical_alternative
  - marker: b
    text: Ou “até que chegassem ao fim”, “até que fossem consumidos” ou “até que perecessem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: Expressa de modo natural a força aditiva e enfática que liga o versículo à declaração anterior.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Mantém a imagem hebraica da mão como poder e ação divina e translitera o nome próprio representado pelo Tetragrama.
- source_word: בָם
  choice: contra eles
  rationale: Neste contexto de juízo, a preposição indica ação hostil dirigida contra o grupo.
- source_word: לְהֻמָּם
  choice: para desbaratá-los
  rationale: O verbo pode indicar causar pânico, confusão ou desordem. “Desbaratar” preserva essa ideia e também se ajusta ao contexto de derrota coletiva, sem reduzi-lo simplesmente a “matar”.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: do meio do acampamento
  rationale: Conserva a expressão concreta do hebraico e a noção de retirada ou desaparecimento de dentro da comunidade acampada.
- source_word: עַד תֻּמָּם
  choice: até que fossem eliminados
  rationale: Comunica o término completo do grupo sob juízo, preservando o valor resultativo da expressão hebraica em português claro.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Natureza da ação divina em לְהֻמָּם
  choice: desbaratá-los
  alternative: destruí-los
  rationale: A escolha conserva a dimensão de pânico, confusão ou debandada própria do verbo, sem antecipar no verbo a eliminação final expressa pela última oração.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A expressão idiomática “a mão de Yahweh” foi preservada, enquanto “desbaratar” mantém a ambiguidade lexical entre confundir, causar debandada e derrotar.
