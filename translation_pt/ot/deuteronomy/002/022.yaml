  text: כַּ/אֲשֶׁ֤ר עָשָׂה֙ לִ/בְנֵ֣י עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת הַ/חֹרִי֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּֽירָשֻׁ/ם֙ וַ/יֵּשְׁב֣וּ תַחְתָּ֔/ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: pt
  text: assim como fez pelos descendentes de Esaú que vivem em Seir, quando destruiu os horeus diante deles,[a] e eles os desapossaram e se estabeleceram no lugar deles até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser entendida como “da presença deles”, isto é, Deus removeu os horeus de diante dos descendentes de Esaú e do território que estes ocuparam.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Introduz a comparação com a ação divina mencionada no contexto anterior, preservando com naturalidade a força comparativa.
- source_word: עָשָׂה
  choice: fez
  rationale: Mantém a referência elíptica e ampla à ação de Deus sem especificar além do hebraico.
- source_word: לִבְנֵי עֵשָׂו
  choice: pelos descendentes de Esaú
  rationale: A expressão hebraica designa aqui o grupo étnico descendente de Esaú; esta forma é mais clara no português atual do que a tradução literal 'filhos de Esaú'.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: que vivem em Seir
  rationale: Traduz o particípio com linguagem corrente e digna, sem o tom arcaizante de 'habitam' ou 'moram' como única possibilidade.
- source_word: אֲשֶׁר הִשְׁמִיד
  choice: quando destruiu
  rationale: Expressa de modo natural o valor circunstancial da oração relativa, mantendo Deus como sujeito implícito conforme o contexto.
- source_word: הִשְׁמִיד
  choice: destruiu
  rationale: Reproduz a força do causativo hebraico sem intensificação retórica indevida.
- source_word: הַחֹרִי
  choice: os horeus
  rationale: Emprega a forma tradicional e reconhecível em português para o nome desse povo.
- source_word: מִפְּנֵיהֶם
  choice: diante deles
  rationale: Preserva o idioma espacial hebraico de remoção da presença ou do território deles; uma nota esclarece o sentido contextual.
- source_word: וַיִּירָשֻׁם
  choice: eles os desapossaram
  rationale: No contexto de conquista, ירשׁ indica tomar posse mediante a perda da posse pelos habitantes anteriores; 'desapossaram' preserva essa relação e os pronomes do texto.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: e se estabeleceram no lugar deles
  rationale: Comunica a ocupação estável do lugar anteriormente habitado pelos horeus.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: É a formulação portuguesa natural e consagrada para a expressão temporal hebraica.
theological_decisions:
- issue: Sujeito dos verbos referentes à destruição
  choice: Deus permanece como sujeito implícito de 'fez' e 'destruiu'.
  alternative: Construção impessoal ou sujeito menos definido, apenas recuperado pelo contexto.
  rationale: Os verbos hebraicos estão na terceira pessoa masculina singular e o contexto imediato os refere à ação providencial do SENHOR em favor de Edom; o português permite conservar o sujeito implícito sem introduzir uma identificação denominacional.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. Preferiu-se ''descendentes de Esaú'' à forma potencialmente ambígua ''filhos de Esaú''; ''vivem'' e ''se estabeleceram'' evitam arcaísmo. A ordem dos sujeitos foi preservada: Deus destrói os horeus, e os descendentes de Esaú os desapossam e ocupam seu lugar.'
