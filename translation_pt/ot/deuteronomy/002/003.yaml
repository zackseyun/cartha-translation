  text: רַב לָ/כֶ֕ם סֹ֖ב אֶת הָ/הָ֣ר הַ/זֶּ֑ה פְּנ֥וּ לָ/כֶ֖ם צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: pt
  text: Vocês já rodearam esta região montanhosa por tempo suficiente[a]; voltem-se para o norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta montanha”. O termo hebraico הַר pode indicar uma montanha ou uma região montanhosa; aqui, o contexto mais amplo da viagem favorece “região montanhosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  choice: por tempo suficiente
  rationale: A expressão idiomática indica que a ação já durou o bastante. Em português, a locução ligada a “rodearam” comunica com naturalidade a ideia de suficiência.
- source_word: סֹב
  choice: rodearam
  rationale: O infinitivo de סבב descreve o deslocamento ao redor de uma área. O pretérito, em combinação com “por tempo suficiente”, expressa adequadamente o olhar retrospectivo do contexto.
- source_word: הָהָר הַזֶּה
  choice: esta região montanhosa
  rationale: הַר pode designar tanto uma montanha quanto uma área montanhosa. O contexto de viagem favorece a referência regional, sem excluir em nota a alternativa mais literal.
- source_word: פְּנוּ לָכֶם
  choice: agora sigam
  rationale: O imperativo פנה ordena uma mudança de direção. “Sigam” é natural para uma instrução de viagem; “agora” explicita a transição implícita, enquanto o dativo לָכֶם não exige tradução separada em português.
- source_word: צָפֹנָה
  choice: para o norte
  rationale: A terminação direcional indica movimento em direção ao norte; “para o norte” preserva esse valor de modo idiomático.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com plural “vocês” de ampla legibilidade brasileira. A formulação conserva o comando direto e o sentido geográfico, evitando reproduzir de forma artificial o dativo hebraico.
