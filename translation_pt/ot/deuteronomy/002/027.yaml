base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: pt
  text: Deixe-me passar pela sua terra. Irei somente pela estrada[a]; não me desviarei nem para a direita nem para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela estrada, pela estrada”; a repetição enfática indica que Israel permaneceria rigorosamente na rota.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Deixe-me passar
  rationale: O coortativo qal na primeira pessoa do singular expressa aqui um pedido diplomático. “Deixe-me passar” comunica naturalmente essa petição em português.
- source_word: בְאַרְצֶךָ
  choice: pela sua terra
  rationale: Depois do verbo עבר, a preposição ב indica passagem através de um território. “Pela sua terra” é natural e evita sugerir permanência no local.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: somente pela estrada
  rationale: A repetição hebraica tem valor enfático e promete adesão estrita à rota. “Somente pela estrada” preserva essa força sem reproduzir uma repetição pouco natural em português.
- source_word: אֵלֵךְ
  choice: Seguirei
  rationale: Neste contexto de deslocamento por uma rota, “seguirei” traduz הלך com naturalidade e se liga claramente à estrada mencionada.
- source_word: לֹא אָסוּר
  choice: não me desviarei
  rationale: O verbo סור significa afastar-se ou desviar-se. A forma reflexiva “me desviarei” é idiomática em português para o abandono de uma rota.
- source_word: יָמִין וּשְׂמֹאול
  choice: nem para a direita nem para a esquerda
  rationale: Mantém a imagem direcional hebraica e, em combinação com a negação, o par correlativo “nem... nem...” é claro e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla compreensão internacional e boa legibilidade brasileira. A repetição literal foi explicitada em nota, enquanto seu valor enfático foi preservado no texto por “somente”.
