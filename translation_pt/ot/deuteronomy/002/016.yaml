revisions:
- from: E aconteceu que, quando todos os homens de guerra acabaram de morrer dentre o povo,[a]
  to: E, quando todos os homens de guerra tinham morrido dentre o povo,[a]
  rationale: Substituí «acabaram de morrer» por «tinham morrido» para eliminar a falsa sugestão de recência e exprimir naturalmente, em uma oração temporal de anterioridade, que a morte de todos os homens de guerra se havia completado. Simplifiquei a fórmula de abertura para «E, quando», preservando a conexão narrativa e a sintaxe suspensa que continua no versículo seguinte.
