lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: E aconteceu que, quando
  rationale: Mantém a fórmula narrativa וַיְהִי e representa כַאֲשֶׁר como uma oração temporal, sem reduzir a construção apenas a uma conjunção.
- source_word: תַּמּוּ ... לָמוּת
  choice: acabaram de morrer
  rationale: A construção expressa que o processo de morte daquele grupo chegou ao fim. Em português, «acabaram de morrer» preserva mais diretamente a ideia de conclusão, embora também possa sugerir recência; o contexto esclarece o sentido.
- source_word: כָּל
  choice: todos
  rationale: Conserva explicitamente a abrangência total do quantificador hebraico.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  rationale: Tradução próxima da expressão hebraica, preservando tanto a referência masculina quanto o caráter militar.
- source_word: מִקֶּרֶב הָעָם
  choice: dentre o povo
  rationale: Expressa a retirada por morte do interior da comunidade; «dentre» é conciso, digno e semanticamente adequado.
