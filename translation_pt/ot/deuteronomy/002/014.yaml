  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: pt
  text: O período em que viajamos de Cades-Barneia até atravessarmos o ribeiro de Zerede[a] foi de trinta e oito anos, até que toda a geração, os homens de guerra, desapareceu do meio do acampamento, conforme Yahweh lhes havia jurado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uádi de Zerede” ou “torrente de Zerede”. O termo hebraico pode indicar um curso de água, um leito sazonal ou um ribeiro.
    reason: alternativa lexical e esclarecimento geográfico
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: O período
  rationale: Embora a forma hebraica diga literalmente “os dias”, aqui ela indica a duração total da viagem; “o período” comunica essa função temporal com naturalidade em português.
- source_word: הָלַכְנוּ
  choice: viajamos
  rationale: No contexto de itinerário, o verbo expressa deslocamento ao longo do tempo; “viajamos” é claro e idiomático.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: de Cades-Barneia
  rationale: Emprega a forma portuguesa tradicional e reconhecível do topônimo composto.
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: até atravessarmos
  rationale: Com um curso de água como objeto, עבר significa naturalmente “atravessar”; o infinitivo flexionado produz uma construção portuguesa fluente.
- source_word: נַחַל זֶרֶד
  choice: o ribeiro de Zerede
  rationale: נַחַל pode designar um curso de água, leito sazonal ou uádi. “Ribeiro” é compreensível em português amplo, enquanto a nota registra a variação geográfica possível.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: trinta e oito anos
  rationale: Forma numérica corrente em português.
- source_word: עַד תֹּם
  choice: até que ... desapareceu
  rationale: Expressa a consumação daquela geração no acampamento sem reduzir a frase a um mero limite cronológico; “desapareceu” comunica que ela deixou de existir no meio da comunidade.
- source_word: כָּל הַדּוֹר
  choice: toda aquela geração
  rationale: O demonstrativo implícito pelo contexto é expresso naturalmente em português, referindo-se à geração anteriormente condenada.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: os homens de guerra
  rationale: Preserva a referência masculina explícita e o caráter militar da expressão hebraica.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: do meio do acampamento
  rationale: Mantém a imagem hebraica de sua eliminação dentre os que compunham o acampamento.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: conforme Yahweh lhes havia jurado
  rationale: Conserva tanto o nome divino quanto a linguagem explícita de juramento; o mais-que-perfeito situa o juramento antes do período narrado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” representa o nome de aliança em vez de substituí-lo por um título.
- issue: Referência masculina em אַנְשֵׁי הַמִּלְחָמָה
  choice: os homens de guerra
  alternative: os combatentes; os guerreiros
  rationale: A expressão hebraica é explicitamente masculina e, neste contexto, aponta para os homens de idade militar daquela geração; a tradução evita neutralizar essa referência.
- issue: Sentido de תֹּם aplicado à geração condenada
  choice: desapareceu do meio do acampamento
  alternative: chegou ao fim no meio do acampamento; foi exterminada do meio do acampamento
  rationale: “Desapareceu” preserva o resultado — a geração deixou de estar presente — sem acrescentar ao verbo uma especificação indevida sobre o modo da morte. “Foi exterminada” seria mais forte e interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe foi aliviada por travessões explicativos, sem romper a progressão temporal do hebraico. O marcador [a] aparece imediatamente após “trinta e oito anos”, conforme solicitado.
