  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: pt
  text: Não entrem em conflito com eles[a], pois não darei a vocês nada da terra deles, nem mesmo um lugar para pisar com a planta do pé, porque dei a região montanhosa de Seir[c] a Esaú como propriedade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não os provoquem” ou “Não os ataquem”.'
    reason: lexical_alternative
  - marker: b
    text: “Como propriedade” também pode ser traduzido por “como herança” ou “como posse”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “monte Seir”; a expressão também pode designar a região montanhosa ou as terras altas de Seir.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: Não provoquem os edomitas
  rationale: O hitpael de גרה com ב expressa provocação ou envolvimento em confronto hostil. “Não provoquem” preserva a proibição de iniciar hostilidades; “os edomitas” explicita o referente contextual do pronome sem definir a ação exclusivamente como batalha.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: não darei a vocês porção alguma da terra deles
  rationale: 'A preposição מן tem sentido partitivo: nenhuma parte da terra seria concedida. A formulação é natural em português e mantém esse valor.'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: nem mesmo o espaço em que caiba a planta de um pé
  rationale: A expressão descreve figuradamente uma porção mínima de terra e conserva a imagem concreta da planta do pé em português inteligível.
- source_word: יְרֻשָּׁה
  choice: como propriedade
  rationale: O substantivo pode indicar propriedade, possessão ou herança. Neste contexto, “propriedade” destaca a concessão territorial sem excluir em nota a alternativa “herança”.
- source_word: לְעֵשָׂו
  choice: a Esaú
  rationale: Mantém o nome pessoal tradicional em português e o destinatário da concessão divina.
- source_word: הַר שֵׂעִיר
  choice: a região montanhosa de Seir
  rationale: Embora literalmente possa ser vertido como “monte Seir”, a expressão pode designar toda a região montanhosa de Seir; essa leitura geográfica se ajusta à concessão territorial do contexto, preservando a forma tradicional em nota.
theological_decisions:
- issue: Concessão divina do território de Edom
  choice: A proibição é fundamentada no fato de Deus ter concedido Seir a Esaú.
  alternative: Tratar a ordem apenas como uma proibição política, sem destacar a distribuição divina da terra.
  rationale: 'As duas orações introduzidas por כִּי apresentam as razões da ordem: Deus não dará a Israel parte daquela terra porque já a concedeu a Esaú. A tradução mantém essa lógica sem acrescentar uma teoria sobre a natureza da concessão.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem direta favorece a clareza; “a vocês” evita regionalismo excessivo. Os marcadores aparecem junto aos termos pertinentes e em sequência conceitual.
