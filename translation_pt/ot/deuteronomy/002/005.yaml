  naturalness: A redação é clara e de registro apropriado. A revisão melhora a fluência do idiomatismo territorial e evita a construção um tanto mecânica «o espaço em que caiba». «Nada da terra deles» expressa com naturalidade o valor partitivo de מִן.
  terminology: «Esaú», «Seir» e «região montanhosa» são adequados. «Como propriedade» é defensável para יְרֻשָּׁה; a nota deve usar «posse», não «possessão», como alternativa portuguesa corrente.
