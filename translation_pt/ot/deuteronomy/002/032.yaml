base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/032.yaml
  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: pt
  text: Então Seom saiu ao nosso encontro[a], ele e todo o seu povo, para a batalha em Jaza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “ao nosso encontro” indica que Seom avançou contra Israel para lutar.
    reason: lexical_alternative
  - marker: b
    text: O nome deste lugar também é transliterado como “Jaás” ou “Jasa” em algumas tradições.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא, na forma narrativa, descreve Seom deixando seu lugar para o confronto; “saiu” é direto e natural em narrativa militar.
- source_word: סִיחֹן
  choice: Seom
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: לִקְרָאתֵנוּ
  choice: ao nosso encontro
  rationale: Reproduz de perto a ideia de deslocar-se para encontrar alguém, sem inserir no próprio sintagma uma hostilidade que o contexto militar já deixa clara.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: ele e todo o seu povo
  rationale: Mantém o pronome independente, que destaca o próprio Seom, e traduz עַם por “povo”, sem restringi-lo indevidamente a um exército profissional.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: Expressa com clareza a finalidade militar do movimento.
- source_word: יָהְצָה
  choice: em Jaza
  rationale: Adota a forma portuguesa do topônimo e verte a indicação local de modo idiomático; o destino do movimento é também o lugar do confronto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do hebraico sem rigidez. “Ao nosso encontro” preserva a expressão do original, enquanto “para a batalha” explicita no próprio versículo o caráter hostil. Os marcadores foram colocados junto às expressões às quais suas notas se referem.
