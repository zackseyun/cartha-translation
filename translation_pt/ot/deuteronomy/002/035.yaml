base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/035.yaml
  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: pt
  text: Apenas tomamos para nós, como despojo, o gado[a] e os despojos das cidades que capturamos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saqueamos para nós o gado”.'
    reason: Alternativa lexical que traduz בזז de modo mais direto, embora menos fluido no conjunto da frase.
lexical_decisions:
- source_word: רַק
  choice: Apenas
  rationale: Marca a limitação em contraste com a destruição das pessoas mencionada no versículo anterior.
- source_word: הַבְּהֵמָה
  choice: os rebanhos
  rationale: No contexto de despojos de guerra, designa coletivamente os animais domésticos; “rebanhos” é natural e claro em português.
- source_word: בָּזַזְנוּ לָנוּ
  choice: tomamos para nós, como despojo
  rationale: Preserva tanto o sentido de saquear de בזז quanto a ideia de benefício próprio expressa por לָנוּ, em formulação idiomática.
- source_word: וּשְׁלַל
  choice: e os despojos
  rationale: שָׁלָל designa bens tomados em guerra; “despojos” mantém com precisão o contexto militar.
- source_word: הֶעָרִים
  choice: das cidades
  rationale: עִיר pode indicar cidade ou povoado; “cidades” é a opção contextual e tradicionalmente adequada aqui.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: que conquistamos
  rationale: לכד, em contexto militar e tendo cidades por objeto, significa capturar ou conquistar; “conquistamos” soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A repetição de “despojo/despojos” foi mantida para distinguir a ação verbal de saquear dos bens capturados e refletir os dois termos hebraicos relacionados.
