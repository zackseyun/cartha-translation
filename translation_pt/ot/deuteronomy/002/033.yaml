base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: pt
  text: E Yahweh, nosso Deus, o entregou em nossas mãos[a], e o derrotamos, juntamente com seus filhos[b] e todo o seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “diante de nós”; neste contexto, a expressão significa que Yahweh o entregou ao poder de Israel.
    reason: lexical_alternative
  - marker: b
    text: O texto consonantal hebraico traz “seu filho”; muitos entendem a expressão coletivamente como “seus filhos” neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: o entregou em nossas mãos
  rationale: A construção com נתן e לְפָנֵינוּ, em contexto de guerra, indica que Deus pôs Seom sob o poder de Israel. A expressão portuguesa comunica naturalmente o sentido, enquanto a nota preserva a forma literal do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Representa diretamente o substantivo com o sufixo de primeira pessoa do plural.
- source_word: וַנַּךְ אֹתוֹ
  choice: nós o derrotamos
  rationale: Em narrativa militar, נכה pode indicar vencer ou abater decisivamente. 'Derrotamos' é natural em português e não explicita além do texto se o golpe em si matou o rei.
- source_word: בנו
  choice: seus filhos
  rationale: Embora a escrita consonantal possa ser lida como singular, o contexto e a leitura tradicional favorecem o plural; a nota registra a ambiguidade textual.
- source_word: כָּל עַמּוֹ
  choice: todo o seu povo
  rationale: Tradução direta de עַם com o sufixo possessivo, sem restringi-lo interpretativamente a 'exército'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto hebraico apresenta o nome próprio divino; 'Yahweh' o preserva por transliteração sem substituí-lo por um título.
- issue: Número de בנו
  choice: seus filhos
  alternative: seu filho
  rationale: A forma consonantal admite a leitura singular, mas a tradição de leitura e o contexto do relato de batalha sustentam o plural. A alternativa permanece visível em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Em nossas mãos' explicita idiomaticamente a entrega ao poder de Israel; 'juntamente com' mantém clara a coordenação dos objetos. Os marcadores aparecem imediatamente após as expressões a que se referem.
