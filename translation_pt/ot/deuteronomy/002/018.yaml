  text: אַתָּ֨ה עֹבֵ֥ר הַ/יּ֛וֹם אֶת גְּב֥וּל מוֹאָ֖ב אֶת עָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: pt
  text: Hoje você está atravessando a fronteira de Moabe, em Ar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fronteira de Moabe, isto é, Ar”. O hebraico repete o marcador de objeto antes de “Ar”, que pode identificar, em aposição, a região fronteiriça ou a cidade de Moabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: está atravessando
  rationale: O particípio qal masculino singular, com o pronome independente אַתָּה, apresenta a ação como imediata e em curso; a locução progressiva é natural em português.
- source_word: הַיּוֹם
  choice: Hoje
  rationale: Uso adverbial temporal comum, com o sentido de “hoje”; a posição inicial conserva a ênfase temporal e soa natural em português.
- source_word: גְּבוּל
  choice: fronteira
  rationale: No contexto territorial de Moabe, designa a linha ou região limítrofe; “fronteira” é clara e idiomática.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: עָר
  choice: Ar
  rationale: Nome próprio de lugar, preservado por transliteração.
- source_word: אֶת ... אֶת
  choice: a fronteira de Moabe, em Ar
  rationale: A repetição do marcador de objeto introduz primeiro “a fronteira de Moabe” e depois “Ar”, permitindo uma relação appositiva ou geográfica. “Em Ar” oferece leitura natural sem eliminar a alternativa appositiva, registrada em nota.
- source_word: אַתָּה
  choice: você
  rationale: Pronome de segunda pessoa masculina singular, dirigido corporativamente a Israel. “Você” preserva o singular e oferece ampla legibilidade brasileira, sem explicitar interpretativamente o referente.
theological_decisions:
- issue: Tratamento singular de Israel
  choice: Manter o singular “você” sem expansão explicativa
  alternative: “Vocês estão atravessando...” ou “Você, Israel, está atravessando...”
  rationale: O hebraico se dirige a Israel como uma unidade coletiva por meio do singular. A tradução mantém essa forma retórica sem convertê-la em plural nem acrescentar o nome do destinatário.
- issue: Relação sintática entre a fronteira de Moabe e Ar
  choice: Traduzir “em Ar” no texto e preservar a leitura appositiva em nota
  alternative: “a fronteira de Moabe, isto é, Ar”
  rationale: A repetição de אֶת admite que “Ar” identifique em aposição a fronteira ou região moabita, mas a relação exata permanece algo ambígua. A formulação principal é idiomática e a nota conserva a alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” é usado para reproduzir o singular hebraico dirigido corporativamente a Israel; “Moabe” segue a forma bíblica portuguesa tradicional. A ambiguidade sintática relativa a Ar é preservada por nota.
