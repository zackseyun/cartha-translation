  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa naturalmente a sequência. “Falou” representa דִּבֵּר e o distingue da fórmula לֵאמֹר que vem em seguida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: comigo
  rationale: Embora אֶל indique literalmente direção (“a mim”), em português “falou comigo” é a construção natural para o ato de dirigir a palavra a alguém e mantém o sentido de endereço direto.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz o discurso direto; “dizendo” preserva de modo formal e inteligível essa fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo pelo título tradicional “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno. A formulação conserva a sequência narrativa e a fórmula introdutória do discurso, ainda que “falou comigo, dizendo” seja mais formal que a fala cotidiana.
