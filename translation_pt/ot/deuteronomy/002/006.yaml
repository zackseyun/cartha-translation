  text: אֹ֣כֶל תִּשְׁבְּר֧וּ מֵֽ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וַ/אֲכַלְתֶּ֑ם וְ/גַם מַ֜יִם תִּכְר֧וּ מֵ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וּ/שְׁתִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: pt
  text: Comprem deles alimento com prata[a], para que comam; comprem também deles água com prata, para que bebam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “e comam” / “e bebam”. A sequência hebraica pode ser traduzida de modo mais literal, mas aqui pode expressar o resultado ou propósito pretendido da compra das provisões.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: alimento
  rationale: Termo geral para aquilo que se come ou provisões; “alimento” é claro, abrangente e não restringe o sentido a cereais.
- source_word: תִּשְׁבְּרוּ
  choice: comprem
  rationale: Aqui שׁבר tem o sentido comercial de comprar alimento mediante pagamento.
- source_word: מֵאִתָּם
  choice: deles
  rationale: 'Indica a fonte das provisões: elas deveriam ser obtidas dos habitantes locais, e não tomadas deles.'
- source_word: בַּכֶּסֶף
  choice: com prata
  rationale: Preserva a expressão concreta do hebraico para o meio de pagamento; “com dinheiro” seria mais interpretativo.
- source_word: וַאֲכַלְתֶּם
  choice: para que comam
  rationale: No contexto instrutivo, a sequência com waw + perfeito pode comunicar o resultado ou propósito pretendido da compra, de modo natural em português.
- source_word: וְגַם
  choice: também
  rationale: Mantém a força aditiva ao introduzir a instrução paralela sobre a água.
- source_word: מַיִם
  choice: água
  rationale: Equivalente lexical direto.
- source_word: תִּכְרוּ
  choice: comprem
  rationale: Embora כרה possa significar “cavar” em outros contextos, o paralelismo comercial e a menção do pagamento mostram que aqui significa adquirir água por compra.
- source_word: וּשְׁתִיתֶם
  choice: para que bebam
  rationale: Assim como na oração sobre o alimento, expressa de modo idiomático o propósito ou resultado pretendido da compra.
theological_decisions:
- issue: Força ética da ordem relativa aos recursos de Edom
  choice: Israel deve pagar pelo alimento e pela água, em vez de tomá-los sem compensação.
  alternative: Uma tradução mais formal poderia dizer “e comam” e “e bebam”, deixando menos explícita a relação de propósito ou resultado.
  rationale: O contexto estabelece a obtenção legítima de provisões mediante pagamento. A formulação com “para que” torna natural em português a relação contextual sem acrescentar uma obrigação alheia ao texto.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural coerentes com a ordem dirigida a Israel. “Com prata” conserva a concretude do hebraico, enquanto “alimento” evita restringir indevidamente o referente a cereais.
