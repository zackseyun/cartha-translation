base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: pt
  text: Então mudamos de direção e partimos para o deserto pelo caminho do Mar Vermelho[a], conforme Yahweh me havia dito, e viajamos ao redor do monte Seir por muitos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mar de juncos”. O nome hebraico Yam Suf pode ser traduzido mais literalmente dessa maneira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Então mudamos de direção
  rationale: O qal consecutivo de פנה indica virar ou mudar de direção. A formulação preserva a sequência narrativa sem acrescentar a ideia não explícita de voltar.
- source_word: וַנִּסַּע
  choice: partimos
  rationale: Em contextos de viagem, נסע frequentemente descreve levantar acampamento e pôr-se a caminho; “partimos” comunica isso de modo natural e conciso.
- source_word: הַמִּדְבָּרָה
  choice: para o deserto
  rationale: O ה direcional indica movimento em direção ao deserto, expresso naturalmente pela preposição “para”.
- source_word: דֶּרֶךְ יַם סוּף
  choice: pelo caminho do mar Vermelho
  rationale: דֶּרֶךְ designa caminho ou rota. “Mar Vermelho” conserva a designação geográfica tradicional, enquanto a tradução lexical alternativa de יַם סוּף é registrada em nota.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלָי
  choice: conforme Yahweh me havia dito
  rationale: כַּאֲשֶׁר introduz conformidade, e דִּבֶּר אֶל significa falar a alguém. “Havia dito” indica com naturalidade que a fala precedeu a viagem narrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino pessoal representado pelo Tetragrama.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: andamos ao redor do monte Seir
  rationale: סבב descreve deslocamento ao redor de um lugar. A expressão portuguesa evita sugerir necessariamente uma única circunvolução completa.
- source_word: יָמִים רַבִּים
  choice: por muitos dias
  rationale: A expressão funciona como acusativo de duração e é reproduzida diretamente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título, sem inserir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A tradução mantém a sequência narrativa e a linguagem geográfica do hebraico sem tornar explícito que o povo “voltou”, nuance que o verbo não exige por si só.
