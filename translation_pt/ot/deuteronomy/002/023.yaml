base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: pt
  text: Quanto aos aveus, que moravam em povoados[a] até Gaza, os caftoritas, que saíram de Caftor, os exterminaram e se estabeleceram no lugar deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “aldeias” ou “acampamentos”; o termo pode designar assentamentos possivelmente sem muralhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: os aveus
  rationale: Etnônimo vertido pela forma tradicional e reconhecível em português, sem tentar explicar a identidade do povo no corpo do texto.
- source_word: הַיֹּשְׁבִים
  choice: que moravam
  rationale: ישב indica residência; “moravam” é natural em português atual e preserva a ideia de habitação.
- source_word: בַּחֲצֵרִים
  choice: em povoados
  rationale: חֲצֵרִים pode designar aldeias sem muralhas, pequenos núcleos habitados ou acampamentos. “Povoados” mantém essa amplitude melhor que uma opção mais específica.
- source_word: עַד עַזָּה
  choice: até Gaza
  rationale: Expressa de modo natural o limite geográfico indicado por עַד.
- source_word: כַּפְתֹּרִים
  choice: os caftoritas
  rationale: Forma portuguesa clara para o etnônimo derivado de Caftor.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: vindos de Caftor
  rationale: Comunica naturalmente a procedência e o movimento expresso por יצא, sem a rigidez de “que saíram de”.
- source_word: הִשְׁמִידֻם
  choice: os exterminaram
  rationale: O hifil de שׁמד denota destruição completa de um povo; “exterminaram” preserva a força do verbo no contexto.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: e se estabeleceram no lugar deles
  rationale: A expressão indica que os caftoritas passaram a ocupar o território dos habitantes anteriores; a formulação preserva residência e substituição.
