source:
  edition: WLC
  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: pt
  text: Somente vocês não se aproximaram da terra dos filhos de Amom[a], de nenhuma parte junto ao ribeiro de Jaboque[b], nem das cidades da região montanhosa, nem de tudo a respeito do que Yahweh, nosso Deus, havia dado ordem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da terra dos amonitas”. Literalmente: “da terra dos filhos de Amom”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “toda a mão do ribeiro de Jaboque”; expressão idiomática referente ao lado, à margem ou à região junto ao Jaboque.'
    reason: cultural_note
  - marker: c
    text: O hebraico deixa implícito o conteúdo da ordem e também pode ser entendido como “nem de tudo o que Yahweh, nosso Deus, havia ordenado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Introduz a exceção à descrição anterior, de modo conciso e natural.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: da terra dos filhos de Amom
  rationale: Preserva a construção hebraica e o nome ancestral; a forma idiomática “terra dos amonitas” é registrada em nota.
- source_word: לֹא קָרָבְתָּ
  choice: não se aproximaram
  rationale: Conserva o sentido espacial de קרב sem especificar indevidamente uma ação militar. O plural português trata Israel coletivamente de forma natural, embora o hebraico use o singular coletivo.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: de nenhum lugar ao longo do vale do Jaboque
  rationale: Sob o alcance da negação, כָּל tem valor distributivo; יַד é um uso idiomático para o lado, a margem ou a região junto ao curso de água.
- source_word: וְעָרֵי הָהָר
  choice: nem das cidades da região montanhosa
  rationale: הָהָר designa aqui as terras altas ou a região montanhosa, não necessariamente um monte isolado.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: nem de qualquer lugar a respeito do qual ... havia dado ordem
  rationale: Torna compreensível a elipse hebraica no contexto, sem explicitar se a ordem era não se aproximar, não atacar ou outra delimitação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Correspondência direta e natural da designação pactual com sufixo possessivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome pessoal divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Conteúdo implícito da ordem divina
  choice: “a respeito do qual ... havia dado ordem”
  alternative: “que Yahweh ... havia proibido que atacássemos”
  rationale: O hebraico não declara aqui o conteúdo da ordem. A formulação escolhida mantém a elipse e evita restringi-la a uma proibição de ataque.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por formas correntes no Brasil sem regionalismos marcados. O plural “não se aproximaram” representa naturalmente o destinatário coletivo Israel, expresso no hebraico por singular coletivo.
