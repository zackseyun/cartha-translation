  text: עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִ֑ים וַ/יַּשְׁמִידֵ֤/ם יְהוָה֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּירָשֻׁ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: pt
  text: um povo grande, numeroso e de alta estatura, como os anaquins.[a] Yahweh os destruiu diante deles; eles os desapossaram e habitaram no lugar deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como os descendentes de Anaque”.'
    reason: Alternativa lexical para o nome gentílico עֲנָקִים.
lexical_decisions:
- source_word: עַם גָּדוֹל
  choice: um povo grande
  rationale: Mantém o substantivo coletivo singular e o registro elevado do hebraico; o adjetivo seguinte, “numeroso”, esclarece que os dois termos não são simples sinônimos.
- source_word: רַב
  choice: numeroso
  rationale: Expressa naturalmente a grande quantidade de pessoas e preserva a distinção em relação a גָּדוֹל.
- source_word: רָם
  choice: de alta estatura
  rationale: No contexto da comparação com os anaquins, refere-se à altura física; esta formulação é mais natural em português do que dizer que um povo era “alto”.
- source_word: כָּעֲנָקִים
  choice: como os anaquins
  rationale: A preposição כְּ marca comparação, e “anaquins” translitera de forma reconhecível o nome do povo.
- source_word: וַיַּשְׁמִידֵם
  choice: os destruiu
  rationale: O hifil de שׁמד comunica destruição ou eliminação, sem exigir aqui uma formulação que explicite aniquilação absoluta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִפְּנֵיהֶם
  choice: diante deles
  rationale: Reproduz de modo natural o idioma hebraico de remover um povo da presença ou do caminho de outro.
- source_word: וַיִּירָשֻׁם
  choice: eles os desapossaram
  rationale: Neste contexto, ירשׁ indica tomar posse mediante a remoção dos habitantes anteriores; “desapossaram” conserva essa dupla ideia de forma concisa.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: habitaram no lugar deles
  rationale: Expressa claramente a ocupação substitutiva indicada por תַחְתָּם, mantendo um registro digno e acessível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem o substituir por um título.
- issue: Referentes dos pronomes plurais
  choice: manter “deles/os” conforme o encadeamento hebraico
  alternative: explicitar “os descendentes de Esaú” e “os emins”
  rationale: O contexto identifica os grupos, mas o versículo emprega pronomes. Mantê-los evita inserir explicações no corpo do texto e preserva a estrutura e a dependência contextual do original.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção “de alta estatura” evita a pouco natural concordância de “povo alto”. O ponto e vírgula separa a ação divina das ações subsequentes do povo sem desfazer sua ligação narrativa.
