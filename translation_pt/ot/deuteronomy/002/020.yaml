base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: pt
  text: Essa terra também é considerada uma terra dos refains[a]. Antigamente, os refains habitavam nela[b], mas os amonitas os chamam de zanzumins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a terra dos refains».'
    reason: lexical_alternative
  - marker: b
    text: O termo «refains» pode designar um povo antigo tradicionalmente associado a grande estatura; algumas traduções usam «gigantes» aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: terra dos refains
  rationale: Preserva אֶרֶץ como «terra» e translitera רְפָאִים como nome de um povo. Em português, a construção sem artigo após «considerada» mantém com naturalidade a indefinição possível do hebraico.
- source_word: תֵּחָשֵׁב
  choice: é considerada
  rationale: 'Reproduz o sentido passivo do nifal de חשׁב: ser tida, reputada ou classificada como.'
- source_word: אַף הִוא
  choice: Também essa terra
  rationale: Retoma de modo explícito e natural a terra mencionada no contexto e expressa o valor aditivo de אַף.
- source_word: רְפָאִים
  choice: refains
  rationale: Mantém o termo como etnônimo, sem adotar a interpretação mais específica «gigantes».
- source_word: יָשְׁבוּ בָהּ
  choice: habitavam nela
  rationale: Expressa naturalmente o sentido de residir ou viver em determinado território.
- source_word: לְפָנִים
  choice: Antigamente
  rationale: Indica com clareza uma época anterior.
- source_word: וְהָעַמֹּנִים
  choice: mas os amonitas
  rationale: Embora וְ possa ser traduzido por «e», «mas» torna clara a mudança entre o nome usado pelo narrador e o nome usado pelos amonitas.
- source_word: יִקְרְאוּ לָהֶם
  choice: os chamam
  rationale: O imperfeito pode indicar uma designação habitual; o presente português preserva esse valor.
- source_word: זַמְזֻמִּים
  choice: zamzumins
  rationale: Translitera o nome do povo em uma forma adaptada à leitura e ao plural em português.
