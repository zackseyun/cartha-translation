base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: pt
  text: 'E Yahweh me disse: “Veja, comecei a entregar Seom e a terra dele a você.[a] Comece a tomar posse da terra dele.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante de você”. No contexto, a expressão indica que Yahweh está colocando Seom e sua terra sob o poder de Israel.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete a raiz verbal traduzida por “tomar posse”: literalmente, “Comece a tomar posse, para tomar posse da terra dele”. A repetição dá ênfase à ordem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רְאֵה
  choice: Veja
  rationale: O imperativo funciona como chamado direto à atenção; “Veja” é atual e preserva sua força.
- source_word: הַחִלֹּתִי תֵּת
  choice: comecei a entregar
  rationale: Reproduz o sentido incoativo de הַחִלֹּתִי e usa “entregar” para נתן no contexto de colocar Siom sob o poder de Israel.
- source_word: לְפָנֶיךָ
  choice: a você
  rationale: Expressa de modo natural o valor contextual da locução, isto é, a entrega de Siom e de sua terra ao poder de Israel; a forma literal é registrada em nota.
- source_word: הָחֵל
  choice: Comece
  rationale: Preserva o paralelo deliberado entre a ação que Yahweh começou e a ação que Israel deve começar.
- source_word: רָשׁ לָרֶשֶׁת
  choice: a tomar posse
  rationale: Comunica em português natural a construção enfática formada pela repetição da raiz ירש, sem criar uma duplicação artificial no texto principal.
- source_word: אַרְצוֹ
  choice: sua terra / terra dele
  rationale: “Terra” é a tradução habitual e adequada para o território governado por Siom; “dele” na segunda ocorrência evita possível ambiguidade em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Agência divina e resposta humana na conquista
  choice: Preservar o paralelo “comecei... Comece”
  alternative: Fundir as duas ações numa única declaração
  rationale: O hebraico mantém em tensão a iniciativa de Yahweh, que começa a entregar, e a ordem para Israel começar a tomar posse.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” por corresponder ao singular do hebraico e mantém frases diretas. A repetição hebraica de ירש é explicada em nota para evitar formulação pouco natural no texto principal.
