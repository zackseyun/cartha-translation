base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: pt
  text: Os emins antigamente habitavam ali[a], um povo grande, numeroso e alto como os anaquins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em tempos passados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵמִים
  choice: os emins
  rationale: Translitera o etnônimo hebraico em forma portuguesa reconhecível, sem tentar traduzi-lo.
- source_word: לְפָנִים
  choice: antigamente
  rationale: A expressão tem sentido temporal, isto é, “em tempos passados”, e não espacial.
- source_word: יָשְׁבוּ בָהּ
  choice: habitavam ali
  rationale: ישׁב com ב indica residência; “ali” retoma naturalmente a terra ou região feminina mencionada no contexto.
- source_word: עַם
  choice: um povo
  rationale: Preserva o coletivo singular que designa um grupo étnico.
- source_word: גָּדוֹל
  choice: grande
  rationale: Mantém o sentido amplo de tamanho e imponência na série descritiva.
- source_word: וְרַב
  choice: numeroso
  rationale: Neste contexto, descreve a grande quantidade de integrantes do povo.
- source_word: וָרָם
  choice: alto
  rationale: A comparação com os anaquins indica estatura física.
- source_word: כָּעֲנָקִים
  choice: como os anaquins
  rationale: A preposição comparativa כ expressa semelhança, e o etnônimo é transliterado em forma portuguesa.
