base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: pt
  text: Desde Aroer, que fica à beira do vale do Arnom, e a cidade que fica no vale, até Gileade, não houve cidade alta demais para nós[a]; Yahweh, nosso Deus, nos entregou tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forte demais para nós” ou “inacessível para nós”. Literalmente, o hebraico diz que nenhuma cidade “era alta demais para nós”, usando a altura como imagem de força defensiva ou inacessibilidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: Desde Aroer
  rationale: A preposição מִן marca o ponto inicial da extensão geográfica; “desde” expressa naturalmente esse valor em português.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: à beira do vale do Arnom
  rationale: שָׂפָה significa literalmente “lábio”, daí “beira/margem”; נַחַל pode indicar o vale ou leito de um curso sazonal. “Vale” é claro e evita tecnicismo desnecessário.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: e a cidade que fica no vale
  rationale: Mantém a conjunção simples e o detalhe geográfico sem acrescentar uma segunda preposição “desde”, ausente no hebraico.
- source_word: וְעַד הַגִּלְעָד
  choice: até Gileade
  rationale: עַד assinala o limite final da extensão territorial.
- source_word: קִרְיָה
  choice: cidade
  rationale: O termo designa uma cidade ou povoação; “cidade” é natural no contexto de assentamentos conquistados e preserva a terminologia corrente em português.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: alta demais para nós
  rationale: Preserva a metáfora hebraica de altura, que no contexto comunica força defensiva ou inacessibilidade, deixando as implicações explícitas em nota.
- source_word: אֶת־הַכֹּל
  choice: tudo
  rationale: O singular coletivo abrange a totalidade das cidades ou do território descrito, sem impor um referente exclusivamente plural.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, nosso Deus
  rationale: Translitera o nome divino expresso pelo Tetragrama e traduz diretamente o sufixo possessivo.
- source_word: לְפָנֵינוּ
  choice: diante de nós
  rationale: Conserva o idioma hebraico da entrega para conquista, sem explicitar além do texto “em nosso poder”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido militar da metáfora שָׂגְבָה מִמֶּנּוּ
  choice: alta demais para nós
  alternative: forte demais para nós / inacessível para nós
  rationale: A tradução mantém a imagem concreta e sua tensão sem escolher silenciosamente apenas uma de suas implicações militares.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem geográfica e a metáfora do hebraico foram preservadas; a nota esclarece alternativas legítimas sem resolver indevidamente a ambiguidade.
