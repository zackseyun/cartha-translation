  source_fidelity: 'O texto reproduz com precisão a estrutura e o conteúdo do hebraico: Yahweh fala a Moisés; há duas proibições relativas a Moabe; Yahweh não concederá sequer uma parte de sua terra; e Ar foi dada aos filhos de Ló como propriedade. Contudo, “provoque os moabitas à guerra” pode sugerir levar os moabitas a iniciarem uma guerra, em vez de proibir Israel de se envolver em hostilidades contra eles.'
