  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: pt
  text: 'E Yahweh me disse: “Não hostilize Moabe nem entre em guerra com eles[a], pois não lhe darei nenhuma parte da terra de Moabe como propriedade[b], porque dei Ar aos filhos de Ló como propriedade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não aflija Moabe nem entre em combate com eles.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como herança”, nas duas ocorrências de “como propriedade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: Não hostilize Moabe
  rationale: O verbo צרר, nesta proibição, indica exercer pressão hostil ou tratar como inimigo; “hostilizar” preserva esse sentido sem implicar necessariamente guerra aberta.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: nem provoque os moabitas à guerra
  rationale: A construção expressa incitação ou envolvimento em hostilidades. “Os moabitas” explicita de modo natural o referente plural de בָּם depois do nome coletivo Moabe.
- source_word: מֵאַרְצוֹ
  choice: nenhuma parte da terra de Moabe
  rationale: “Nenhuma parte” comunica a força partitiva de מִן; repetir “Moabe” evita a ambiguidade de um pronome possessivo em português.
- source_word: יְרֻשָּׁה
  choice: como propriedade
  rationale: Designa uma terra recebida e mantida como posse atribuída; a mesma tradução é usada nas duas ocorrências.
- source_word: לִבְנֵי לוֹט
  choice: aos filhos de Ló
  rationale: Preserva a formulação genealógica literal, que neste contexto se refere aos descendentes de Ló.
- source_word: עָר
  choice: Ar
  rationale: Transliteração convencional do nome próprio do lugar ou território moabita.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama. A forma “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de יְרֻשָּׁה
  choice: propriedade
  alternative: herança
  rationale: “Propriedade” ressalta a posse territorial concedida por Deus sem excluir a ideia contextual de herança; a alternativa é registrada em nota para preservar a amplitude lexical.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Moabe” funciona como nome coletivo; na segunda proibição, “os moabitas” torna natural o pronome plural do hebraico. A repetição de “terra de Moabe” evita ambiguidade pronominal.
