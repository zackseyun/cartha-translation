  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: pt
  text: Mas Seom, rei de Hesbom, não quis nos deixar passar por sua terra, porque Yahweh, seu Deus, havia endurecido o espírito dele e tornado o seu coração obstinado[a], a fim de entregá-lo em sua mão, como se vê hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fortalecido o seu coração”. O verbo hebraico pode significar “tornar forte”, mas, neste contexto, provavelmente indica que o coração foi tornado obstinado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: não quis
  rationale: Expressa de modo natural a falta de disposição ou consentimento de Seom, preservando a nuance volitiva do verbo.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: nos deixar passar por sua terra
  rationale: O hifil de עבר indica permitir ou fazer passar; no contexto, o sufixo em בּוֹ se refere ao território de Seom, sentido explicitado naturalmente em português.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: havia endurecido o espírito dele
  rationale: Mantém tanto a força causativa de 'endurecer' quanto o termo antropológico hebraico 'espírito', sem eliminar sua ressonância teológica.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: e tornado obstinado o seu coração
  rationale: אמץ pode significar fortalecer ou tornar firme; neste contexto de resistência e endurecimento, 'tornar obstinado' comunica a força contextual, enquanto a alternativa lexical é registrada em nota.
- source_word: לְמַעַן
  choice: a fim de
  rationale: Marca com clareza a relação de propósito expressa no hebraico.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: entregá-lo em suas mãos
  rationale: Reproduz de forma inteligível o idioma hebraico de colocar alguém sob o poder de outra pessoa, conservando a imagem das mãos.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê hoje
  rationale: Comunica o estado de coisas presente e evidente indicado pela fórmula deuteronômica, em português atual e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Endurecimento divino e falta de disposição humana
  choice: Manter tanto a recusa voluntária de Seom quanto a ação de Yahweh ao endurecer seu espírito e tornar obstinado seu coração.
  alternative: Atenuar a ação divina como mera permissão, ou atribuir o endurecimento somente a Seom.
  rationale: O hebraico afirma explicitamente os dois aspectos. A tradução preserva essa tensão teológica sem tentar resolvê-la.
- issue: Força semântica de וְאִמֵּץ אֶת לְבָבוֹ
  choice: tornado obstinado o seu coração
  alternative: fortalecido o seu coração
  rationale: O sentido básico de tornar forte permanece possível, mas o contexto apresenta essa firmeza como resistência obstinada. A nota conserva a alternativa formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'Seom' e 'Hesbom', formas portuguesas correntes; usa 'suas mãos' para o singular hebraico coletivo/idiomático dirigido a Israel. O marcador [a] aparece imediatamente após a expressão a que a nota se refere.
