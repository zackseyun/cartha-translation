base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: pt
  text: Venda-me alimento por prata[a], para que eu coma, e dê-me água por prata, para que eu beba; apenas deixe-me passar a pé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por dinheiro”. O hebraico diz literalmente “por/com a prata”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com os meus próprios pés”. O hebraico diz literalmente “sobre/com os meus pés”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: alimento
  rationale: Termo geral para comida ou mantimento; “alimento” preserva a amplitude do hebraico e mantém registro digno e claro.
- source_word: בַּכֶּסֶף
  choice: por prata
  rationale: Mantém o termo concreto כֶּסֶף e expressa o pagamento; a alternativa idiomática “por dinheiro” é registrada em nota.
- source_word: תַּשְׁבִּרֵנִי
  choice: vender alimento a mim
  rationale: O hifil de שׁבר, neste contexto comercial, significa vender ou fornecer alimento mediante pagamento; na frase, o objeto pronominal é expresso naturalmente por “me vender”.
- source_word: וְאָכַלְתִּי
  choice: para que eu coma
  rationale: Comunica o resultado ou propósito pretendido da venda, sem reduzir a forma a simples previsão futura.
- source_word: וּמַיִם
  choice: água
  rationale: Equivalente lexical direto.
- source_word: תִּתֶּן לִי
  choice: me dar
  rationale: Tradução simples e natural de נתן com o complemento לִי.
- source_word: וְשָׁתִיתִי
  choice: para que eu beba
  rationale: Expressa o resultado ou propósito pretendido, em paralelo com “para que eu coma”.
- source_word: רַק
  choice: apenas
  rationale: Restringe o pedido ao direito de passagem; “apenas” é natural no português moderno.
- source_word: אֶעְבְּרָה
  choice: deixe-me passar
  rationale: O cohortativo tem aqui força de pedido permissivo, adequadamente representada por “deixe-me”.
- source_word: בְרַגְלָי
  choice: a pé
  rationale: É a expressão portuguesa natural para o hebraico literalmente “sobre/com os meus pés”; não acrescenta a ideia de posse ou ocupação territorial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o tom de petição do cohortativo e o paralelismo entre comer e beber. “A pé” traduz naturalmente o idioma hebraico sem necessidade de nota, enquanto “por prata” conserva a concretude lexical do original.
