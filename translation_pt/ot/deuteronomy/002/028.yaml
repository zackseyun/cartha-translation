    issue: “Você poderá” não exprime adequadamente o valor peticional da fala.
    rationale: Em português moderno, a perífrase normalmente significa que o interlocutor terá permissão ou capacidade para vender, ao passo que o hebraico, em contexto de solicitação, pede que se venda e se dê provisões.
  - severity: low
    issue: Falta a âncora e a nota correspondente à expressão final “a pé”.
    rationale: O inglês auditado registra uma nota lexical para בְרַגְלָי; acrescentá-la permite documentar a literalidade hebraica, embora “a pé” seja a tradução idiomática correta no texto.
  revised_text: Venda-me alimento por prata[a], para que eu coma, e dê-me água por prata, para que eu beba; apenas deixe-me passar a pé[b].
