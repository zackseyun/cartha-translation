source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: pt
  text: Quando você chegar em frente aos filhos de Amom[a], não os hostilize[b] nem os provoque, pois não lhe darei nenhuma parte da terra dos filhos de Amom como propriedade[c], porque eu a dei como propriedade aos filhos de Ló.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos amonitas” em todo o versículo.
    reason: lexical_alternative
  - marker: b
    text: Ou “não os ataque”. O hebraico pode proibir ações hostis em sentido amplo, não apenas um cerco formal.
    reason: lexical_alternative
  - marker: c
    text: Ou “como herança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: Quando você se aproximar
  rationale: Expressa com naturalidade a aproximação indicada por קָרַב; o contexto territorial torna desnecessário reproduzir מוּל por uma formulação pouco idiomática como “diante de” ou “em frente de”.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Preserva a expressão hebraica de parentesco e sua correspondência com “filhos de Ló” no fim do versículo.
- source_word: אַל תְּצֻרֵם
  choice: não os hostilize
  rationale: Mantém o sentido amplo de ação hostil contra o povo sem restringi-lo necessariamente a um cerco formal ou a um ataque específico.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: nem provoque
  rationale: Reproduz a ideia de incitar conflito ou entrar em contenda, sem acrescentar explicitamente “à guerra”, expressão ausente do hebraico.
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: nenhuma parte da terra dos filhos de Amom
  rationale: 'Torna explícita em português a força partitiva de מִן sob negação: nenhuma porção daquela terra seria concedida.'
- source_word: יְרֻשָּׁה
  choice: como propriedade
  rationale: No contexto da concessão territorial, “propriedade” comunica uma posse concedida e evita limitar o termo à noção familiar de herança.
- source_word: לִבְנֵי לוֹט נְתַתִּיהָ
  choice: eu a dei como propriedade aos filhos de Ló
  rationale: Preserva o aspecto de concessão divina já realizada e a linguagem de parentesco do original.
theological_decisions:
- issue: Termos de parentesco em designações nacionais
  choice: filhos de Amom / filhos de Ló
  alternative: amonitas / descendentes de Ló
  rationale: A formulação conserva o paralelismo genealógico do hebraico e a ênfase na concessão territorial feita à linhagem de Ló, sem substituir silenciosamente essa linguagem por rótulos étnicos.
- issue: Alcance da proibição אַל תְּצֻרֵם
  choice: não os hostilize
  alternative: não os ataque / não os sitie
  rationale: O verbo admite ação hostil em sentido amplo neste contexto. A tradução evita decidir que se trate exclusivamente de ataque direto ou cerco militar.
- issue: Sentido de יְרֻשָּׁה
  choice: propriedade
  alternative: herança
  rationale: Ambas as leituras são lexicalmente possíveis; “propriedade” se ajusta à distribuição territorial, enquanto a alternativa é registrada em nota para preservar a amplitude do termo.
translation_notes:
  register: Português atual, digno e acessível, com concordância no singular para o destinatário coletivo representado por Israel. “Hostilize” preserva a amplitude da proibição, e as expressões “filhos de Amom” e “filhos de Ló” mantêm o enquadramento genealógico do hebraico.
