  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: pt
  text: Assim, seguimos adiante, deixando para trás nossos irmãos, os filhos de Esaú, que moram em Seir, e nos afastando do caminho da Arabá, de Elate e de Eziom-Geber; então mudamos de direção e seguimos pelo caminho do deserto de Moabe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: seguimos adiante, deixando para trás
  rationale: No contexto de viagem, עבר com מֵאֵת descreve a continuação do percurso para além de um grupo de pessoas, não necessariamente uma travessia.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: nossos irmãos, os filhos de Esaú
  rationale: Preserva literalmente a linguagem de parentesco e a identificação genealógica dos edomitas, importantes no contexto de Deuteronômio.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: que moram em Seir
  rationale: O particípio de ישב indica residência estabelecida; 'moram' é atual e natural em português.
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: nos afastando do caminho da Arabá
  rationale: Mantém דרך como 'caminho' e Arabá como topônimo; a preposição מן expressa afastamento ou procedência.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: de Elate e de Eziom-Geber
  rationale: Emprega formas tradicionais e legíveis em português para os topônimos, preservando a repetição da preposição hebraica.
- source_word: וַנֵּפֶן
  choice: mudamos de direção
  rationale: Expressa claramente a mudança de rumo indicada por פנה, evitando sugerir apenas um movimento corporal.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: seguimos pelo caminho do deserto de Moabe
  rationale: Reproduz o movimento da viagem e preserva a cadeia nominal 'caminho do deserto de Moabe' de modo natural.
theological_decisions:
- issue: Linguagem de parentesco referente a Edom
  choice: nossos irmãos, os filhos de Esaú
  alternative: nossos parentes, os descendentes de Esaú
  rationale: A formulação escolhida conserva a força concreta do hebraico e a apresentação dos edomitas como irmãos de Israel, sem reduzir essa relação a parentesco genérico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'caminho' acompanha דרך no texto hebraico, e os topônimos são mantidos sem explicações intrusivas.
