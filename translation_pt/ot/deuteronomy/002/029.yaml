  text: כַּ/אֲשֶׁ֨ר עָֽשׂוּ לִ֜/י בְּנֵ֣י עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר וְ/הַ/מּ֣וֹאָבִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/עָ֑ר עַ֤ד אֲשֶֽׁר אֶֽעֱבֹר֙ אֶת הַ/יַּרְדֵּ֔ן אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: pt
  text: assim como fizeram por mim os filhos de Esaú que vivem em Seir e os moabitas que vivem em Ar,[a] até que eu atravesse o Jordão e entre na terra que Yahweh, nosso Deus, está nos dando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me trataram”. O hebraico diz literalmente “fizeram por mim” e, no contexto, refere-se a permitir a passagem e fornecer mantimentos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Preserva de modo natural a força comparativa da expressão hebraica.
- source_word: עָשׂוּ לִי
  choice: fizeram por mim
  rationale: Reproduz de perto a construção hebraica sem especificar além do texto; no contexto, alude à concessão de passagem e à venda de mantimentos.
- source_word: בְּנֵי עֵשָׂו
  choice: os filhos de Esaú
  rationale: Mantém a expressão familiar hebraica e seu enquadramento de parentesco, embora designe coletivamente os descendentes de Esaú.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: que vivem em Seir
  rationale: Expressa residência estabelecida em português moderno e corrente.
- source_word: וְהַמּוֹאָבִים
  choice: e os moabitas
  rationale: Tradução direta do gentílico plural.
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: que vivem em Ar
  rationale: Mantém a construção paralela anterior e translitera o topônimo.
- source_word: עַד אֲשֶׁר אֶעֱבֹר אֶת הַיַּרְדֵּן
  choice: até que eu atravesse o Jordão
  rationale: Com o Jordão como objeto, 'atravesse' comunica naturalmente o movimento de cruzar.
- source_word: אֶל הָאָרֶץ
  choice: e entre na terra
  rationale: No contexto de atravessar uma fronteira, explicita de modo natural em português o movimento para dentro da terra, sem alterar o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Tradução direta da designação pactual.
- source_word: נֹתֵן לָנוּ
  choice: está nos dando
  rationale: Preserva o aspecto presente e progressivo do particípio, bem como a certeza da dádiva.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em transliteração, sem substituí-lo pelo título 'SENHOR'.
- issue: Sentido de עָשׂוּ לִי no contexto histórico
  choice: fizeram por mim
  alternative: me trataram
  rationale: A formulação escolhida preserva a relativa abertura lexical do hebraico. A nota esclarece a referência contextual sem inserir no corpo do versículo uma harmonização excessivamente específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva o paralelismo das duas orações relativas, a expressão de parentesco 'filhos de Esaú' e a ambiguidade controlada de עָשׂוּ לִי. O versículo começa em minúscula porque sintaticamente continua a fala iniciada no versículo anterior.
