base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: pt
  text: Pois Yahweh, seu Deus, abençoou você em todo o trabalho das suas mãos. Ele conhece o seu caminhar por este grande deserto.[a] Durante estes quarenta anos, Yahweh, seu Deus, esteve com você; nada lhe faltou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele tem cuidado da sua jornada por este grande deserto”. O verbo hebraico significa literalmente “conhecer”, mas, neste contexto, pode sugerir atenção e cuidado constantes.'
    reason: Registra a possível força contextual de יָדַע sem eliminar do texto principal sua formulação lexical básica e sua ambiguidade.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּרַכְךָ
  choice: abençoou você
  rationale: Preserva o sentido religioso e pactual de ברך; o pretérito perfeito é natural na retrospectiva de Moisés.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: em todo o trabalho das suas mãos
  rationale: Expressa em português corrente o idiomatismo hebraico referente ao trabalho e às realizações da pessoa, mantendo a imagem concreta das mãos.
- source_word: יָדַע
  choice: conhece
  rationale: Mantém o sentido lexical básico de ידע e sua abertura semântica; no contexto, o conhecimento pode envolver atenção e cuidado contínuos.
- source_word: לֶכְתְּךָ
  choice: o seu caminhar
  rationale: Conserva a imagem verbal de הלך, referindo-se à marcha ou jornada de Israel, sem reduzi-la a uma viagem pontual.
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: por este grande deserto
  rationale: A preposição 'por' explicita de modo natural em português o espaço atravessado durante a caminhada.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: Durante estes quarenta anos
  rationale: Verte de forma idiomática a expressão temporal hebraica e deixa clara a duração da presença divina.
- source_word: עִמָּךְ
  choice: esteve com você
  rationale: Supre o verbo exigido em português e comunica a presença sustentada de Deus ao longo do período mencionado.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: nada lhe faltou
  rationale: É a formulação portuguesa natural para a suficiência completa expressa pelo idiomatismo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o nome pactual; a transliteração o preserva como nome próprio, sem substituí-lo por um título.
- issue: Sentido contextual de יָדַע
  choice: conhece
  alternative: cuida de; acompanha atentamente
  rationale: A tradução principal conserva o sentido básico e a tensão semântica do verbo, enquanto a nota informa a possível implicação de cuidado providencial sem torná-la explícita demais no texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. O tratamento singular por “você” evita formas regionais mais marcadas; “o seu caminhar” preserva a imagem hebraica sem soar excessivamente arcaico.
