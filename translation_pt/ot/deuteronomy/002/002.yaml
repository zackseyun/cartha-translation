  yaml_path: translation/ot/deuteronomy/002/002.yaml
  text: Then Yahweh said to me[a], saying,
translation:
  language: pt
  text: 'Então Yahweh me disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa naturalmente a sequência, e “disse” preserva o verbo simples de fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: me
  rationale: Em português natural, o pronome átono em “me disse” comunica o sentido de “disse a mim” sem rigidez desnecessária.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz a fala direta do versículo seguinte. Em português, os dois-pontos cumprem essa função de modo natural e evitam a repetição pouco idiomática “disse, dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com construção natural tanto no Brasil quanto em outros contextos lusófonos. Os dois-pontos mantêm a função introdutória de לֵאמֹר, cuja fala vem no versículo seguinte.
