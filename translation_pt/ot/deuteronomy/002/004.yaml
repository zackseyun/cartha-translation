base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: pt
  text: 'E ordene ao povo: “Vocês estão prestes a passar[a] pelo território[b] de seus irmãos, os filhos de Esaú, que moram em Seir. Eles terão medo de vocês. Portanto, tenham muito cuidado.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês estão passando” ou “vocês passarão”. O particípio hebraico pode expressar uma ação iminente.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “território” também pode significar “fronteira” ou “limite”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Guardem-se com muito cuidado” ou “vigiem-se cuidadosamente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: ordene
  rationale: O imperativo de צוה expressa uma ordem autorizada; “ordene” preserva essa força com naturalidade em português.
- source_word: הָעָם
  choice: o povo
  rationale: עם designa aqui Israel coletivamente; “o povo” é a correspondência mais direta e corrente.
- source_word: אַתֶּם עֹבְרִים
  choice: vocês estão prestes a passar
  rationale: O particípio acompanhado do pronome independente tem, neste contexto, valor iminente ou futuro. A formulação comunica claramente que a passagem está próxima, sem excluir as demais possibilidades aspectuais.
- source_word: בִּגְבוּל
  choice: pelo território
  rationale: גְּבוּל pode indicar tanto limite ou fronteira quanto o território delimitado. No contexto de deslocamento, “pelo território” expressa melhor o domínio geográfico atravessado.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: seus irmãos, os filhos de Esaú
  rationale: A tradução mantém tanto a linguagem explícita de parentesco quanto a expressão genealógica do hebraico.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: que moram em Seir
  rationale: O particípio de ישב indica residência estabelecida; “moram” é natural, atual e claro.
- source_word: וְיִירְאוּ מִכֶּם
  choice: Eles terão medo de vocês
  rationale: ירא com מן expressa medo diante de Israel. “Terão medo de vocês” preserva o sentido preditivo e é idiomático em português.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: Portanto, tenham muito cuidado
  rationale: 'O nifal de שמר tem aqui força reflexiva: guardar-se, acautelar-se. “Tenham muito cuidado” comunica o aviso e preserva a ênfase de מְאֹד; “portanto” explicita a relação consequencial sugerida pelo contexto.'
theological_decisions:
- issue: Linguagem de parentesco referente a Edom
  choice: seus irmãos, os filhos de Esaú
  alternative: seus parentes, os descendentes de Esaú
  rationale: O texto fundamenta a relação de Israel com Edom em parentesco genealógico. Manter “irmãos” preserva essa conexão histórica e teológica sem reduzi-la a uma referência étnica genérica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento no plural por “vocês” distingue naturalmente o povo de Israel. A sequência foi dividida em frases para favorecer a leitura sem alterar as relações do hebraico. Os marcadores de nota aparecem no texto principal junto às expressões a que se referem.
