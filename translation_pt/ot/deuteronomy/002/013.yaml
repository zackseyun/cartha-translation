base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: pt
  text: Agora, levantem-se e atravessem o uádi de Zerede[a]. E atravessamos o uádi de Zerede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ribeiro de Zerede” ou “o vale de Zerede”. O termo hebraico נחל pode indicar um uádi, uma ravina ou o leito de um curso d’água, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a transição temporal para a ação ordenada e preserva a imediaticidade do hebraico em português natural.
- source_word: קֻמוּ
  choice: levantem-se
  rationale: Imperativo plural de קום; é claro, digno e mantém a força explícita da ordem.
- source_word: וְעִבְרוּ
  choice: e atravessem
  rationale: Neste contexto de deslocamento, עבר indica passar de um lado para o outro; “atravessem” expressa isso naturalmente.
- source_word: לָכֶם
  choice: —
  rationale: O dativo ético reforça idiomaticamente a ordem, mas sua tradução literal (“para vocês mesmos”) seria artificial; seu valor é absorvido pelo imperativo.
- source_word: נַחַל
  choice: uádi
  rationale: Pode designar um vale estreito ou leito de curso d’água, muitas vezes sazonal. “Uádi” conserva bem a realidade geográfica do contexto desértico.
- source_word: זָרֶד
  choice: Zerede
  rationale: Nome geográfico transliterado segundo uma forma portuguesa clara e tradicional.
- source_word: וַנַּעֲבֹר
  choice: E atravessamos
  rationale: O wayyiqtol na primeira pessoa do plural relata o cumprimento subsequente da ordem, sem tornar explícita uma relação de resultado além do que a conjunção hebraica exige.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega-se “uádi” como termo geográfico preciso, acompanhado de nota para leitores que conheçam alternativas como “ribeiro” ou “vale”.
