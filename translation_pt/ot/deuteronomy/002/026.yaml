  text: וָ/אֶשְׁלַ֤ח מַלְאָכִים֙ מִ/מִּדְבַּ֣ר קְדֵמ֔וֹת אֶל סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: pt
  text: 'Então enviei mensageiros do deserto de Quedemote a Seom, rei de Hesbom, com palavras de paz[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com propostas de paz”. O hebraico diz literalmente “palavras de paz”, expressão que pode indicar uma iniciativa diplomática pacífica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Então enviei
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência, e a primeira pessoa do singular é preservada.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto diplomático, o termo designa representantes humanos, não seres celestiais. “Mensageiros” é claro e menos interpretativo que “emissários”.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: do deserto de Quedemote
  rationale: מִדְבָּר indica aqui uma região árida ou desértica. “Deserto” é natural e amplamente compreensível em português; Quedemote segue a forma tradicional portuguesa do topônimo.
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: a Seom, rei de Hesbom
  rationale: A preposição marca o destinatário da missão. A aposição “rei de Hesbom” reproduz diretamente o título, e os nomes seguem formas portuguesas bíblicas reconhecíveis.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: com palavras de paz
  rationale: A tradução mantém de perto a expressão hebraica literal e sua abertura semântica, que pode indicar tanto linguagem pacífica quanto uma proposta diplomática de paz.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Fórmula hebraica que introduz a fala seguinte; “dizendo:” é corrente, preserva a continuidade e pede dois-pontos em português.
theological_decisions: []
