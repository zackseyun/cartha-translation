base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: pt
  text: Como as nações que Yahweh está destruindo diante de vocês, assim vocês perecerão, porque não ouvirão a voz de Yahweh, seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque não obedecerão a Yahweh, seu Deus”. A expressão hebraica significa literalmente “ouvir a voz de” e muitas vezes inclui a ideia de obedecer.'
    reason: alternativa lexical e esclarecimento de um idioma hebraico
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: Como as nações
  rationale: כְּ introduz uma comparação, e גּוֹיִם designa aqui as nações da terra. “Como as nações” é claro e preserva a estrutura comparativa do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é vertido como nome próprio, preservando o nome pessoal do Deus de Israel em vez de substituí-lo por um título.
- source_word: מַאֲבִיד
  choice: está destruindo
  rationale: 'O particípio hifil de אבד expressa ação causativa em curso: Yahweh está fazendo perecer, isto é, destruindo, essas nações.'
- source_word: מִפְּנֵיכֶם
  choice: diante de vocês
  rationale: A expressão significa literalmente “de diante de vocês” e, no contexto, descreve as nações sendo removidas à medida que Israel avança. A forma escolhida é natural em português.
- source_word: כֵּן תֹאבֵדוּן
  choice: assim vocês perecerão
  rationale: כֵּן corresponde à comparação inicial, formando “Como... assim...”. O qal de אבד indica que os israelitas perecerão, mantendo a ligação lexical com a destruição das nações.
- source_word: עֵקֶב
  choice: porque
  rationale: Introduz a causa ou fundamento do juízo anunciado; “porque” comunica essa relação diretamente.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: não ouvirão a voz de
  rationale: A construção שׁמע בקול significa literalmente ouvir a voz e, idiomaticamente, implica obedecer. O futuro preserva o valor prospectivo do imperfeito no contexto da advertência.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Com Yahweh como referente e o sufixo plural dirigido ao povo, a expressão significa o Deus de vocês. “Seu Deus” evita a repetição pesada e é inequívoco no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico apresenta o nome divino; transliterá-lo como “Yahweh” preserva seu caráter de nome pessoal e a linguagem da aliança.
- issue: Sentido de שׁמע בקול
  choice: ouvirão a voz de
  alternative: obedecerão a
  rationale: A formulação principal conserva a imagem explícita da voz e a textura da linguagem da aliança, enquanto a nota informa o sentido idiomático de obediência sem eliminar a amplitude da expressão.
- issue: Valor temporal de לֹא תִשְׁמְעוּן
  choice: não ouvirão
  alternative: não ouviram ou não ouvem
  rationale: O imperfeito, dentro da advertência futura “vocês perecerão”, é naturalmente prospectivo. A tradução mantém esse paralelismo sem transformar a declaração em referência exclusiva ao passado.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural e futuro simples para conservar o tom solene da advertência. A ordem “Como... assim...” reproduz a correlação hebraica sem soar obscura.
