base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: pt
  text: que alimentou você com maná no deserto, alimento que seus pais[a] não tinham conhecido, para humilhar você e pôr você à prova, para fazer bem a você no fim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus antepassados”. O hebraico diz literalmente “seus pais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “mais tarde”, “no futuro” ou “em seu desfecho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: que [...] alimentou você
  rationale: O particípio hifil com sufixo de segunda pessoa masculina singular continua a descrição de Deus no versículo anterior. A oração relativa é natural em português e conserva o sentido causativo de dar alimento.
- source_word: מָן
  choice: maná
  rationale: Forma tradicional e amplamente reconhecida em português para o alimento do deserto.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma ou desértica. “Deserto” é claro, corrente e adequado ao contexto do êxodo.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: algo que seus pais não tinham conhecido
  rationale: “Algo” esclarece que a oração relativa se refere ao maná, evitando que “que” pareça retomar “deserto”. O mais-que-perfeito composto expressa a anterioridade e a falta de experiência dos pais com esse alimento.
- source_word: אֲבֹתֶיךָ
  choice: seus pais
  rationale: Mantém o substantivo masculino plural explícito do hebraico. “Seus antepassados” é uma alternativa contextual possível e aparece em nota.
- source_word: לְמַעַן עַנֹּתְךָ
  choice: para humilhar você
  rationale: לְמַעַן introduz propósito, e ענה no piel pode significar humilhar ou afligir. “Humilhar” corresponde ao tema pedagógico imediato sem eliminar a dureza da experiência.
- source_word: וּלְמַעַן נַסֹּתֶךָ
  choice: e pôr você à prova
  rationale: נסָה indica testar ou provar. “Pôr à prova” é idiomático e conserva a ideia de avaliação no deserto.
- source_word: לְהֵיטִבְךָ
  choice: fazer-lhe o bem
  rationale: O hifil de יטב expressa fazer bem ou beneficiar alguém. A formulação mantém a referência pessoal do sufixo.
- source_word: בְּאַחֲרִיתֶךָ
  choice: no fim
  rationale: אַחֲרִית pode indicar fim, resultado posterior ou futuro. “No fim” é natural em português e preserva a orientação para o desfecho sem definir com maior precisão qual horizonte temporal está em vista.
theological_decisions:
- issue: Finalidade das dificuldades no deserto
  choice: A alimentação, a humilhação e a prova são apresentadas como ações intencionais que visam, por fim, ao bem de Israel.
  alternative: Entender a humilhação e a prova apenas como castigo punitivo.
  rationale: As duas expressões de propósito culminam em לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ. A tradução conserva tanto a severidade de “humilhar” e “pôr à prova” quanto a finalidade benéfica, sem dissolver essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A colocação de “no deserto” evita ambiguidade sintática, e “algo” explicita que a oração relativa retoma “maná”. Mantém-se a segunda pessoa singular por meio de “você”, coerente com o hebraico dirigido coletivamente a Israel.
