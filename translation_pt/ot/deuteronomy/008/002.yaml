source:
  edition: WLC
  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: pt
  text: 'Lembre-se de todo o caminho pelo qual Yahweh, seu Deus, conduziu você durante estes quarenta anos no deserto, a fim de humilhar você, pôr você à prova e saber o que havia em seu coração[a]: se você guardaria os mandamentos dele ou não.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para revelar o que havia em seu coração”. O hebraico diz literalmente “saber o que havia em seu coração”, expressão preservada no texto principal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Lembre-se
  rationale: O perfeito qal com conjunção, neste discurso de instrução, tem força exortativa. O imperativo em português é natural e preserva essa função.
- source_word: כָּל הַדֶּרֶךְ
  choice: todo o caminho
  rationale: דֶּרֶךְ abrange o percurso e toda a experiência da jornada no deserto; a formulação mantém a imagem hebraica sem deixar de ser compreensível.
- source_word: הֹלִיכֲךָ
  choice: conduziu você
  rationale: O hifil de הלך é causativo. 'Conduziu' expressa de modo natural a ação divina de guiar Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a construção possessiva e a linguagem da relação de aliança.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: durante estes quarenta anos
  rationale: Expressa em português corrente a duração indicada pela construção hebraica.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: '''Deserto'' é a forma corrente e amplamente inteligível em português para o ambiente ermo da peregrinação de Israel.'
- source_word: לְמַעַן
  choice: a fim de
  rationale: Marca claramente a finalidade das ações que seguem.
- source_word: עַנֹּתְךָ
  choice: humilhar você
  rationale: ענה, no contexto, descreve o ato de rebaixar ou humilhar por meio da privação, em consonância com o versículo seguinte.
- source_word: לְנַסֹּתְךָ
  choice: pôr você à prova
  rationale: Expressa o sentido avaliativo de נסה em português natural.
- source_word: לָדַעַת
  choice: saber
  rationale: Traduz diretamente o infinitivo de ידע e preserva a linguagem antropomórfica e sua tensão teológica.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: o que havia em seu coração
  rationale: '''Coração'' mantém a imagem hebraica do interior da pessoa, incluindo pensamento, vontade e intenção.'
- source_word: הֲתִשְׁמֹר מצותו אִם לֹא
  choice: se você guardaria os mandamentos dele ou não
  rationale: A oração interrogativa indireta é vertida com naturalidade, e 'guardar' preserva a linguagem bíblica de observar fielmente os mandamentos.
theological_decisions:
- issue: Linguagem antropomórfica em לָדַעַת, 'saber o que havia em seu coração'
  choice: Manter 'saber' no texto principal
  alternative: revelar / tornar manifesto o que havia em seu coração
  rationale: O hebraico diz literalmente 'saber'. A tradução conserva a tensão relativa ao conhecimento divino, sem resolvê-la por interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega tratamento por 'você' para representar o singular hebraico dirigido coletivamente a Israel. Mantém 'Yahweh' como nome divino e conserva imagens centrais como 'caminho', 'coração' e 'guardar os mandamentos'.
