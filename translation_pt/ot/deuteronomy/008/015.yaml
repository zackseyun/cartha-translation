base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: pt
  text: que te conduziu pelo grande e temível deserto, com serpentes abrasadoras[a], escorpiões e terra ressequida[b], onde não havia água; que fez sair água para ti da rocha de pederneira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serpentes venenosas”. A expressão hebraica tradicionalmente traduzida por “serpentes abrasadoras” pode referir-se a serpentes cuja mordida causava uma sensação de ardor.
    reason: lexical_alternative
  - marker: b
    text: Ou “seca” ou “sede”. O termo hebraico indica aridez extrema num lugar sem água.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: que te conduziu
  rationale: O particípio hifil com sufixo de segunda pessoa masculina singular tem função atributiva no período maior. A oração relativa mantém essa relação e expressa naturalmente, em português, a ação passada do SENHOR.
- source_word: בַּמִּדְבָּר
  choice: pelo ... deserto
  rationale: מִדְבָּר designa uma região desértica ou erma, não necessariamente arenosa. “Pelo deserto” comunica tanto o lugar quanto o percurso.
- source_word: הַגָּדֹל וְהַנּוֹרָא
  choice: grande e temível
  rationale: Preserva os dois adjetivos e traduz נוֹרָא como aquilo que causa temor, em linguagem digna e atual.
- source_word: נָחָשׁ שָׂרָף
  choice: serpentes abrasadoras
  rationale: Mantém a imagem hebraica de serpentes associadas ao ardor, provavelmente em referência ao efeito de sua mordida, sem decidir no texto principal que o termo significa apenas “venenosas”.
- source_word: וְעַקְרָב
  choice: e escorpiões
  rationale: Equivalente lexical direto, no plural coletivo apropriado à enumeração dos perigos.
- source_word: וְצִמָּאוֹן
  choice: e por terra ressequida
  rationale: O substantivo indica secura extrema ou sede. “Terra ressequida” torna concreta a condição ambiental e se liga naturalmente à explicação de que não havia água.
- source_word: אֲשֶׁר אֵין מָיִם
  choice: onde não havia água
  rationale: A oração relativa esclarece a condição do lugar em português natural.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: que fez sair água para ti
  rationale: O particípio hifil de יצא indica ação causativa. “Fez sair” preserva essa força e a imagem concreta da água saindo da rocha.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: da rocha de pederneira
  rationale: צוּר é “rocha”, e חַלָּמִישׁ denota pederneira ou pedra muito dura. A expressão conserva a dureza extraordinária da fonte da qual Deus fez sair água.
theological_decisions:
- issue: Natureza dos perigos enumerados no deserto
  choice: Apresentar serpentes, escorpiões e terra ressequida como perigos concretos da jornada histórica de Israel.
  alternative: Interpretar as serpentes como metáfora ou generalizar toda a lista como perigos do deserto.
  rationale: O hebraico enumera realidades concretas e recorda a condução e a provisão divinas no deserto; a tradução não introduz uma leitura alegórica.
- issue: Sentido de נָחָשׁ שָׂרָף
  choice: Preservar no texto a imagem “serpentes abrasadoras” e explicar a possível referência ao efeito da mordida em nota.
  alternative: Resolver a expressão diretamente como “serpentes venenosas”.
  rationale: A formulação hebraica conserva a ideia de ardor, mas não determina de modo explícito se descreve a espécie, o veneno ou a sensação provocada pela mordida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o caráter de oração relativa do versículo no período maior. “Temível” evita tanto o arcaísmo quanto a possível ambiguidade moderna de “terrível”; “rocha de pederneira” preserva a imagem tradicional e a noção de extrema dureza.
