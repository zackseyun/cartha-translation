base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: pt
  text: Portanto, você guardará[a] os mandamentos de Yahweh, seu Deus, caminhando nos seus caminhos e temendo-o.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E você guardará”. A conjunção hebraica pode indicar simples coordenação, embora aqui provavelmente tenha sentido inferencial com base no contexto anterior.'
    reason: lexical_alternative
  - marker: b
    text: “Temendo-o” expressa temor reverente diante de Deus; outra tradução possível é “reverenciando-o”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Assim, você guardará
  rationale: שׁמר, no contexto da aliança, significa guardar ou observar os mandamentos. “Assim” expressa a provável força inferencial da conjunção em relação ao contexto anterior, enquanto o futuro mantém em português a forma verbal hebraica sem transformá-la diretamente em imperativo.
- source_word: מִצְוֺת
  choice: os mandamentos
  rationale: O plural construto designa as obrigações ordenadas por Deus; “mandamentos” conserva a nuance jurídica e pactual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz naturalmente em português o substantivo com sufixo possessivo de segunda pessoa do singular.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: andando em seus caminhos
  rationale: Mantém a metáfora hebraica de caminhar nos caminhos de Deus e apresenta essa conduta como modo concreto de guardar os mandamentos.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: e temendo-o
  rationale: Preserva a força lexical de ירא, que inclui temor diante de Deus, sem reduzi-la apenas a respeito; neste contexto, trata-se de temor reverente ligado à fidelidade à aliança.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o nome da aliança. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido do temor dirigido a Deus
  choice: temendo-o
  alternative: reverenciando-o
  rationale: “Temendo-o” conserva tanto a força lexical quanto a tensão teológica do hebraico. A nota esclarece o caráter reverente do temor sem suavizar o texto principal.
- issue: Força da conjunção inicial
  choice: Assim
  alternative: E
  rationale: O contexto favorece uma relação inferencial, mas a conjunção hebraica também pode funcionar como simples coordenação; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” reflete a segunda pessoa singular do hebraico sem recorrer ao mais regional ou arcaizante “tu guardarás”. A formulação mantém as imagens bíblicas de guardar mandamentos, andar nos caminhos de Deus e temê-lo.
