base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/013.yaml
  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: pt
  text: e o seu gado e os seus rebanhos se multiplicarem[a], e sua prata e seu ouro aumentarem[b], e tudo o que é seu aumentar—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico distingue o gado bovino dos rebanhos de animais menores, sobretudo ovelhas e cabras.
    reason: lexical_clarification
  - marker: b
    text: Literalmente, “a prata e o ouro aumentarem para você”.
    reason: literal_rendering
lexical_decisions:
- source_word: וּבְקָרְךָ וְצֹאנְךָ
  choice: e o seu gado e os seus rebanhos
  rationale: בקר designa coletivamente o gado bovino, enquanto צאן designa os animais menores de rebanho, sobretudo ovelhas e cabras. “Gado” e “rebanhos” mantêm a distinção de modo natural e conciso em português.
- source_word: יִרְבְּיוּן
  choice: se multiplicarem
  rationale: O verbo רבה indica aumento numérico e, aplicado aos animais, “multiplicar-se” é claro e idiomático.
- source_word: וְכֶסֶף וְזָהָב יִרְבֶּה לָּךְ
  choice: e você tiver cada vez mais prata e ouro
  rationale: A formulação natural em português comunica tanto o aumento da prata e do ouro quanto o valor possessivo do dativo לָךְ, sem recorrer à expressão pouco idiomática “aumentarem para você”.
- source_word: וְכֹל אֲשֶׁר לְךָ יִרְבֶּה
  choice: e tudo o que é seu aumentar
  rationale: Reproduz de forma concisa a construção possessiva e conserva a repetição de רבה, agora com o sentido abrangente de aumento dos bens.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva o caráter de continuação da frase por meio do “e” inicial e do travessão final.
