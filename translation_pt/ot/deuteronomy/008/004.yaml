base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: pt
  text: Sua roupa não se gastou[a], e seu pé não inchou[b] durante estes quarenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sua veste não se gastou».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «seu pé não ficou inchado»; alguns entendem o verbo mais especificamente como referência à formação de bolhas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: sua roupa
  rationale: שִׂמְלָה designa uma peça de vestir ou roupa exterior. O singular coletivo «sua roupa» é natural em português e não restringe o sentido a um manto específico.
- source_word: בָלְתָה
  choice: não se gastou
  rationale: A forma de בלה indica ficar gasto ou deteriorar-se pelo uso. «Não se gastou» é idiomático e preciso no contexto.
- source_word: מֵעָלֶיךָ
  choice: sobre você
  rationale: A expressão significa literalmente «de sobre você». Com roupa, «sobre você» preserva a imagem do hebraico sem sugerir que a roupa deixou o corpo.
- source_word: וְרַגְלְךָ
  choice: e seu pé
  rationale: Mantém o singular do hebraico, que funciona naturalmente como referência representativa.
- source_word: בָצֵקָה
  choice: não inchou
  rationale: O verbo é tradicionalmente entendido como inchar. A tradução concisa preserva essa leitura, enquanto a nota registra a possibilidade mais específica de formação de bolhas.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: durante estes quarenta anos
  rationale: A construção hebraica combina o demonstrativo com uma expressão de duração. «Durante estes quarenta anos» comunica claramente tanto a duração quanto a perspectiva retrospectiva do demonstrativo.
