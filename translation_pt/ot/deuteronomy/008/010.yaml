base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: pt
  text: Você comerá e ficará satisfeito, e bendirá Yahweh, seu Deus, pela boa terra que ele lhe deu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: você comerá
  rationale: O perfeito qal com conjunção, nesta sequência exortativa, expressa o resultado futuro esperado; o futuro em português é natural e mantém o tom solene.
- source_word: וְשָׂבָעְתָּ
  choice: ficará satisfeito
  rationale: O verbo indica ficar saciado, ter comido o bastante. A formulação comunica plenitude sem restringir o sentido à sensação física de estar cheio.
- source_word: וּבֵרַכְתָּ
  choice: bendirá
  rationale: Quando Deus é o objeto, ברך significa bendizer, isto é, falar bem dele em gratidão e louvor. “Bendizer” preserva o idioma bíblico e sua amplitude sem exigir nota lexical.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente a construção com o sufixo possessivo de segunda pessoa masculina singular.
- source_word: עַל
  choice: pela
  rationale: Neste contexto, introduz o motivo pelo qual Yahweh deve ser bendito.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: a boa terra
  rationale: Tradução direta que conserva o motivo pactual da terra sem especificar indevidamente em que consiste sua bondade.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: que ele lhe deu
  rationale: O perfeito נָתַן apresenta a terra como dádiva divina; o pretérito perfeito é claro e natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome pessoal divino; “Yahweh” o preserva como nome, em vez de substituí-lo por um título.
- issue: Sentido de ברך quando Deus é o objeto
  choice: bendirá
  alternative: agradecerá; louvará
  rationale: “Bendizer” conserva o idioma hebraico e abrange gratidão e louvor, sem reduzir o ato a apenas um desses aspectos.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. O futuro simples preserva a sequência exortativa; “bendirá” mantém o idioma bíblico de modo claro. Não são necessárias notas de rodapé.
