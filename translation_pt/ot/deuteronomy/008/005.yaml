  text: וְ/יָדַעְתָּ֖ עִם לְבָבֶ֑/ךָ כִּ֗י כַּ/אֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת בְּנ֔/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מְיַסְּרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: pt
  text: Saiba, pois, em seu coração que, assim como um homem disciplina[a] seu filho, Yahweh, seu Deus, disciplina você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “castiga” ou “corrige”; o verbo hebraico pode incluir tanto o castigo corretivo quanto a instrução formativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Saiba, pois
  rationale: O perfeito qal com a conjunção, à luz do contexto, tem força exortativa e conclusiva. “Saiba, pois” expressa essa continuidade de modo natural, sem tratá-lo como simples passado.
- source_word: עִם לְבָבֶךָ
  choice: em seu coração
  rationale: O idiomatismo hebraico indica reconhecimento ou convicção interior; “em seu coração” é a formulação natural em português.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que Israel deve reconhecer.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Explicita naturalmente a comparação entre a disciplina humana e a divina.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: disciplina
  rationale: A raiz יסר abrange correção, castigo corretivo e formação. “Disciplina” conserva essa amplitude, e a repetição do mesmo termo nas duas orações reproduz a repetição hebraica.
- source_word: אִישׁ
  choice: um homem
  rationale: O hebraico diz explicitamente “um homem”; a relação paterna é indicada por “seu filho”.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O substantivo hebraico é especificamente “filho”, não o termo mais geral “criança”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Representa de modo direto a designação pactual ligada ao nome divino.
theological_decisions:
- issue: Natureza da disciplina divina
  choice: disciplina
  alternative: castiga ou corrige
  rationale: “Disciplina” preserva tanto a dimensão corretiva quanto a formativa da ação, sem limitá-la ao castigo nem reduzi-la à mera instrução.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva no texto o nome pessoal e pactual usado no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “pois” após o verbo evita rigidez, e “disciplina você” mantém clareza sem recorrer a uma forma excessivamente formal.
