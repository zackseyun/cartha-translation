  text: a land of wheat and barley[a], of vines and fig trees and pomegranates, a land of olive oil and honey,
translation:
  language: pt
  text: uma terra de trigo e cevada, de videiras, figueiras e romãs, uma terra de azeite de oliva e mel[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “xarope de tâmaras” em vez de “mel”. O termo hebraico pode designar de modo amplo um xarope doce em descrições dos produtos da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: uma terra de
  rationale: Introduz a descrição dos produtos da terra prometida. A expressão é natural em português e preserva a estrutura descritiva do hebraico.
- source_word: חִטָּה
  choice: trigo
  rationale: Equivalente comum e preciso para o cereal mencionado.
- source_word: שְׂעֹרָה
  choice: cevada
  rationale: Equivalente comum e preciso, formando com “trigo” o par de cereais do texto.
- source_word: גֶּפֶן
  choice: videiras
  rationale: O singular hebraico tem sentido coletivo. “Videiras” expressa naturalmente a cultura agrícola sem substituir a planta pelo fruto.
- source_word: תְּאֵנָה
  choice: figueiras
  rationale: O substantivo designa normalmente a árvore, e o plural português transmite o valor coletivo do singular hebraico.
- source_word: רִמּוֹן
  choice: romãs
  rationale: O termo pode indicar a romã ou a romãzeira; nesta lista de produtos da terra, “romãs” é claro e natural.
- source_word: אֶרֶץ
  choice: uma terra de
  rationale: A repetição foi mantida porque estrutura a segunda parte da lista e dá ênfase retórica no hebraico.
- source_word: זֵית שֶׁמֶן
  choice: azeite de oliva
  rationale: A construção reúne “oliva” e “óleo”. “Azeite de oliva” comunica de modo claro e idiomático o produto agrícola referido, especialmente para leitores brasileiros.
- source_word: דְּבָשׁ
  choice: mel
  rationale: “Mel” é o sentido comum do termo, embora em descrições dos produtos da terra ele também possa abranger um xarope doce, possivelmente de tâmaras; a alternativa é preservada em nota.
