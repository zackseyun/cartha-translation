base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/012.yaml
  text: lest[a], when you have eaten and are satisfied, and have built good houses and lived in them,
translation:
  language: pt
  text: para que não, quando comeres e ficares satisfeito[a], construíres boas casas e morares nelas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ficares saciado». O verbo hebraico pode enfatizar tanto estar fisicamente cheio quanto plenamente satisfeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: para que não aconteça que
  rationale: Introduz uma advertência dependente do contexto anterior. Esta formulação preserva a força preventiva sem recorrer ao pouco corrente «para que não» isolado.
- source_word: תֹּאכַל
  choice: depois de comer
  rationale: O imperfeito de segunda pessoa masculina singular integra uma sequência futura de circunstâncias temidas; em português, o infinitivo após «depois de» expressa essa relação com naturalidade.
- source_word: וְשָׂבָעְתָּ
  choice: e ficar satisfeito
  rationale: שׂבע pode indicar tanto saciedade física quanto satisfação plena; «ficar satisfeito» é natural e mantém essa amplitude, com a alternativa explicitada em nota.
- source_word: וּבָתִּים טוֹבִים
  choice: boas casas
  rationale: Reproduz diretamente o sentido de טוֹבִים e comunica casas de boa qualidade sem exagerar a ideia de luxo.
- source_word: תִּבְנֶה
  choice: construir
  rationale: Coordena-se com os demais infinitivos da oração temporal e apresenta a ação dentro do cenário da advertência.
- source_word: וְיָשָׁבְתָּ
  choice: e morar nelas
  rationale: ישׁב, no contexto de casas, significa habitá-las. «Nelas» torna explícito em português o referente naturalmente subentendido no hebraico.
