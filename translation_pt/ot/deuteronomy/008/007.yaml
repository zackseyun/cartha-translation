  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: pt
  text: Pois Yahweh, seu Deus, está levando você para uma boa terra, uma terra de riachos[a], nascentes e águas profundas[b], que brotam no vale e na região montanhosa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “torrentes” ou “cursos de água sazonais”; o termo hebraico pode designar riachos, torrentes ou uádis.
    reason: lexical_alternative
  - marker: b
    text: Ou “profundezas”; o hebraico pode se referir a águas subterrâneas ou às profundezas aquáticas.
    reason: lexical_alternative
  - marker: c
    text: Ou “na planície e nas montanhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa do conectivo em relação à exortação anterior e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de modo natural a expressão pactual com sufixo de segunda pessoa masculina singular.
- source_word: מְבִיאֲךָ
  choice: está levando você
  rationale: O particípio apresenta a ação como vigente ou iminente; a locução preserva essa vivacidade em português corrente.
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: para uma boa terra
  rationale: Expressa naturalmente o movimento em direção à terra sem acrescentar conteúdo ao qualificativo hebraico.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: uma terra de riachos
  rationale: Comunica claramente a presença de cursos de água; a nota preserva os sentidos alternativos de torrentes e cursos sazonais.
- source_word: עֲיָנֹת
  choice: nascentes
  rationale: Designa fontes naturais de água em linguagem portuguesa atual e inequívoca.
- source_word: וּתְהֹמֹת
  choice: e águas profundas
  rationale: Mantém a imagem de águas profundas ou subterrâneas sem impor uma descrição hidrológica precisa.
- source_word: יֹצְאִים
  choice: que brotam
  rationale: Expressa águas que saem ou emergem de suas fontes e concorda com a enumeração plural precedente.
- source_word: בַּבִּקְעָה
  choice: nos vales
  rationale: בִּקְעָה pode indicar vale ou planície; o plural naturaliza o provável sentido topográfico coletivo sem eliminar a alternativa, registrada em nota.
- source_word: וּבָהָר
  choice: e nas regiões montanhosas
  rationale: Embora formalmente singular, הָר pode designar coletivamente o terreno elevado; esta formulação comunica isso com naturalidade.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal da aliança sem substituí-lo por um título nem escolher a forma aportuguesada tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Você” torna explícito o singular do hebraico; “regiões montanhosas” evita o pouco natural “no monte” e preserva o valor topográfico coletivo. Os marcadores foram colocados junto às expressões às quais suas notas efetivamente se referem.
