base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: pt
  text: Mas lembre-se de Yahweh, seu Deus, pois é ele quem lhe dá força para adquirir riqueza[a], a fim de estabelecer a aliança que jurou aos seus pais[b], como se vê hoje[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “produzir riqueza”, “obter prosperidade” ou, em sentido mais amplo, “alcançar êxito”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, os pais ancestrais de Israel, especialmente os patriarcas aos quais a aliança foi jurada.
    reason: cultural_note
  - marker: c
    text: Literalmente, “como neste dia”; expressão hebraica que significa “como hoje se evidencia” ou “como agora se vê”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Mas lembre-se
  rationale: A forma verbal tem força de ordem ou exortação no discurso. “Mas” expressa o contraste com a autossuficiência advertida no versículo anterior.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Preserva o nome divino do texto hebraico e a linguagem da relação pactual expressa por “seu Deus”.
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: pois é ele quem lhe dá
  rationale: “Pois” introduz a razão da exortação, e “é ele quem” conserva a ênfase do pronome hebraico הוּא.
- source_word: כֹּחַ
  choice: força
  rationale: O termo designa força, capacidade ou poder. “Força” é natural em português e, com o infinitivo seguinte, comunica a capacidade concedida por Deus.
- source_word: לַעֲשׂוֹת חָיִל
  choice: para adquirir riqueza
  rationale: No contexto imediato de Deuteronômio 8:17–18, o idioma se refere principalmente à obtenção de bens ou prosperidade, sem excluir seu sentido mais amplo de alcançar êxito.
- source_word: לְמַעַן הָקִים אֶת־בְּרִיתוֹ
  choice: a fim de confirmar a aliança
  rationale: לְמַעַן marca finalidade. O hifil de קום apresenta Deus fazendo sua aliança permanecer válida e efetiva na história; “confirmar” evita sugerir que a aliança só então passou a existir.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: que jurou aos seus pais
  rationale: Mantém o masculino plural do hebraico e sua referência específica aos pais ancestrais ligados à aliança.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê hoje
  rationale: Traduz de modo natural o idioma deuteronômico que aponta para uma realidade presente e observável, enquanto a forma literal é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz o nome pessoal divino. A transliteração “Yahweh” o preserva, em vez de substituí-lo por um título.
- issue: Sentido de חָיִל no contexto
  choice: riqueza
  alternative: êxito ou prosperidade
  rationale: O versículo anterior menciona a riqueza que Israel poderia atribuir à própria força. “Riqueza” mantém essa ligação discursiva, e a nota conserva a amplitude lexical.
- issue: Força de הָקִים em relação à aliança
  choice: confirmar
  alternative: estabelecer, manter ou fazer cumprir
  rationale: A expressão descreve Deus fazendo permanecer e realizando historicamente a aliança já jurada. “Confirmar” preserva esse aspecto sem implicar a criação de uma aliança inteiramente nova.
- issue: Referente de אֲבֹתֶיךָ
  choice: seus pais
  alternative: seus antepassados
  rationale: “Pais” conserva a forma masculina e a referência pactual específica aos patriarcas, embora “antepassados” seja semanticamente possível.
translation_notes:
  register: Português moderno, digno e de leitura amplamente acessível, com construção natural tanto no Brasil quanto em outros contextos lusófonos. Emprega “lhe dá” e “aos seus pais” para clareza sem coloquialismo excessivo. As ambiguidades relevantes de חָיִל, הָקִים e do idioma final são preservadas nas notas.
