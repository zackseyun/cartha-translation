  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: pt
  text: Tenham o cuidado de cumprir todo o mandamento[a] que hoje lhes ordeno, para que vivam, se multipliquem, entrem na terra e tomem posse dela[b], a terra que Yahweh jurou a seus pais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mandamento inteiro”. O hebraico emprega uma expressão coletiva no singular: “todo o mandamento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a herdem”. O verbo hebraico pode significar herdar ou tomar posse, conforme o contexto.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, os antepassados ou patriarcas de Israel.
    reason: lexical_clarification
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: todo o mandamento
  rationale: Mantém a forma coletiva singular do hebraico e expressa a totalidade da instrução, embora em português também seja possível dizer «todos os mandamentos».
- source_word: מְצַוְּךָ
  choice: lhes ordeno
  rationale: O sufixo hebraico é singular e trata Israel como unidade coletiva, enquanto os verbos ao redor estão no plural. O português exige uma escolha mais explícita; «lhes» acompanha as exortações plurais dirigidas ao povo.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: Tenham o cuidado de cumprir
  rationale: Reúne o sentido de guardar atentamente e pôr em prática, evitando a construção pouco natural «guardar para fazer».
- source_word: לְמַעַן
  choice: para que
  rationale: Marca de modo natural a relação de propósito ou resultado.
- source_word: תִּחְיוּן
  choice: vivam
  rationale: Tradução direta que pode incluir viver e continuar vivos no contexto da aliança.
- source_word: וּרְבִיתֶם
  choice: se multipliquem
  rationale: Conserva o sentido de tornar-se numeroso e a ressonância da linguagem da aliança.
- source_word: וּבָאתֶם
  choice: entrem na terra
  rationale: Em português, explicitar «na terra» torna natural a coordenação com o verbo seguinte, cujo objeto aparece no hebraico uma só vez.
- source_word: וִירִשְׁתֶּם
  choice: tomem posse dela
  rationale: Expressa o ato de adquirir e conservar a posse da terra, preservando em nota a alternativa «herdar».
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Preserva o termo recorrente e sua ressonância pactual em Deuteronômio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נִשְׁבַּע
  choice: jurou dar
  rationale: «Jurou» preserva a força do juramento. «Dar» é uma complementação idiomática indicada pelo contexto da terra prometida, sem alterar o beneficiário expresso.
- source_word: אֲבֹתֵיכֶם
  choice: seus pais
  rationale: Mantém o substantivo masculino do hebraico e seu sentido de antepassados ou patriarcas de Israel.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. A transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Singular coletivo em כָּל הַמִּצְוָה
  choice: todo o mandamento
  alternative: todos os mandamentos
  rationale: A opção principal conserva a forma singular e permite que o termo se refira à instrução ordenada como um todo, sem decidir que se trata apenas de um preceito isolado.
- issue: Sentido de ירשׁ na relação de Israel com a terra
  choice: tomem posse
  alternative: herdem
  rationale: O verbo admite as ideias de herdar e tomar posse. «Tomem posse» corresponde bem à entrada na terra, enquanto a alternativa é preservada em nota.
- issue: Referente de אֲבֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A tradução conserva a linguagem masculina da fonte; a nota esclarece que se trata dos antepassados ou patriarcas de Israel.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A colocação pronominal e a sintaxe evitam regionalismos marcados. «Tenham o cuidado de cumprir» comunica tanto a atenção exigida por שׁמר quanto a prática indicada por עשה.
