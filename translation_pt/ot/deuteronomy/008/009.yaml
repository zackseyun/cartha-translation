base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: pt
  text: uma terra onde você não comerá pão na pobreza[a] e onde não lhe faltará coisa alguma; uma terra cujas pedras são ferro e de cujas colinas você extrairá cobre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na escassez” ou “na privação”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode significar “cobre” ou “bronze”; aqui, prefere-se “cobre” porque o versículo fala de material extraído das colinas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: na pobreza
  rationale: O substantivo indica pobreza, privação ou escassez. “Na pobreza” conserva a condição de necessidade expressa pelo hebraico sem duplicar a oração seguinte.
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém o sentido concreto básico do termo hebraico, embora no contexto possa representar o alimento em geral.
- source_word: תֶחְסַר כֹּל
  choice: não lhe faltará coisa alguma
  rationale: Expressa de modo natural em português a suficiência completa indicada pelo idioma hebraico.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: cujas pedras são ferro
  rationale: Preserva a formulação hebraica breve e vívida, provavelmente alusiva a pedras ou minério que contêm ferro.
- source_word: תַּחְצֹב
  choice: extrairá
  rationale: Comunica com clareza a retirada do metal das colinas; é natural em português e evita sugerir que o cobre seja cortado em blocos como pedra de pedreira.
- source_word: נְחֹשֶׁת
  choice: cobre
  rationale: O termo pode designar cobre ou bronze. Como se trata de um recurso natural extraído das colinas, “cobre” é mais preciso, pois o bronze é uma liga metálica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A segunda pessoa singular foi vertida por “você”, em harmonia com o uso corrente brasileiro, mantendo a referência singular do hebraico. A imagem literal das pedras que “são ferro” foi preservada.
