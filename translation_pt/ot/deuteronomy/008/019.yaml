base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: pt
  text: E se você de fato se esquecer[a] de Yahweh, seu Deus, e seguir outros deuses, servi-los e prostrar-se diante deles, hoje dou testemunho contra vocês[b] de que certamente perecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “esquecendo, você se esquecerá”, construção enfática que pode ser entendida como “de fato” ou “certamente se esquecer”.'
    reason: lexical_alternative
  - marker: b
    text: Até este ponto, o hebraico se dirige a uma pessoa no singular; aqui passa ao plural, tratando o povo coletivamente.
    reason: source_text_feature
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: E, se
  rationale: Introduz a advertência condicional e mantém a continuidade do discurso em português natural, sem a rigidez de uma reprodução literal como “E acontecerá que, se”.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: você de fato se esquecer
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “De fato” comunica a ênfase sem especificá-la excessivamente como esquecimento completo.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Preserva o nome divino expresso no hebraico e a relação pactual indicada pelo sufixo singular “seu”.
- source_word: וְהָלַכְתָּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: e seguir outros deuses
  rationale: “Seguir” expressa em português corrente a ideia idiomática de ir atrás deles e lhes prestar lealdade, enquanto “outros” traduz diretamente o adjetivo hebraico.
- source_word: וַעֲבַדְתָּם
  choice: servi-los
  rationale: Mantém o sentido próprio de servir e evita fundi-lo com o verbo seguinte, que descreve o ato de prostrar-se em homenagem ou culto.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: e curvar-se diante deles
  rationale: Conserva tanto o gesto físico de prostração quanto sua força cultual, sem reduzir o verbo simplesmente a “adorar”.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: hoje dou testemunho contra vocês
  rationale: Reproduz a força jurídica do hifil de עוד e o valor adverso de בָכֶם. A mudança para o plural presente no hebraico é preservada em “vocês”.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: de que certamente perecerão
  rationale: A construção com infinitivo absoluto e verbo finito exprime forte certeza. “Certamente perecerão” mantém a ênfase e o sentido resultativo sem impor a leitura passiva “serão destruídos”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e segue a convenção lexical do projeto, sem substituí-lo por um título.
- issue: Natureza da condenação em אָבֹד תֹּאבֵדוּן
  choice: certamente perecerão
  alternative: certamente serão destruídos
  rationale: A forma hebraica afirma enfaticamente o perecimento, mas não explicita aqui se o verbo deve ser entendido de modo estritamente intransitivo ou passivo. A tradução escolhida evita resolver além do texto a natureza exata da ação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Emprega “você/seu” e “vocês” para tornar perceptível a mudança deliberada do singular para o plural no hebraico. Mantém “servir” e “curvar-se” como ações distintas e conserva a força jurídica de “dar testemunho contra”.
