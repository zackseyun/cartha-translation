  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: pt
  text: Ele humilhou você, fez você passar fome e alimentou você com o maná, que nem você nem seus antepassados conheciam, para que você soubesse que o ser humano[b] não vive somente de pão, mas vive de tudo o que sai da boca de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “de cada palavra que vem da boca de Yahweh”. A expressão hebraica significa literalmente “de tudo o que sai da boca de Yahweh” e é mais ampla que “palavra” por si só.
    reason: lexical_alternative
  - marker: b
    text: “O ser humano” refere-se aqui à humanidade em geral, não apenas aos homens.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: Ele humilhou você
  rationale: O piel de ענה pode significar humilhar ou afligir. No contexto da provação e instrução no deserto, “humilhou” expressa a ação disciplinadora sem restringi-la ao sofrimento físico.
- source_word: וַיַּרְעִבֶךָ
  choice: fez você passar fome
  rationale: Preserva de modo natural em português a força causativa do hiphil de רעב e a agência divina.
- source_word: וַיַּאֲכִלְךָ אֶת הַמָּן
  choice: o alimentou com o maná
  rationale: “Alimentou” é o equivalente português natural para a forma causativa de אכל; “maná” conserva o nome tradicional desse alimento.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: que nem você nem seus antepassados conheciam
  rationale: A formulação natural preserva a negação aplicada tanto à geração presente quanto às anteriores. “Conheciam” indica experiência ou familiaridade, não apenas conhecimento intelectual.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: para que você soubesse
  rationale: Expressa com fluência a finalidade pedagógica da forma causativa de ידע, isto é, Deus levou Israel a reconhecer a verdade apresentada a seguir.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: אדם tem aqui sentido genérico e representativo. “O ser humano” comunica esse alcance universal em português atual sem sugerir que a afirmação se restrinja aos homens.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: somente de pão
  rationale: Equivalente idiomático claro que mantém o contraste entre o pão e aquilo que procede da boca de Deus.
- source_word: כָּל מוֹצָא פִי יְהוָה
  choice: tudo o que sai da boca de Yahweh
  rationale: מוֹצָא designa literalmente aquilo que sai ou procede. A tradução mantém a amplitude da expressão hebraica, sem limitá-la silenciosamente a “palavra”, e conserva a imagem da boca divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: o ser humano não vive ... mas vive
  rationale: Mantém a repetição verbal e o equilíbrio retórico das duas orações hebraicas.
theological_decisions:
- issue: Sentido genérico de הָאָדָם na afirmação sobre a vida humana
  choice: o ser humano
  alternative: o homem
  rationale: A palavra hebraica está no singular e representa a humanidade em geral. “O ser humano” preserva o singular representativo e torna explícito o alcance genérico, sem alterar a substância teológica.
- issue: Amplitude de מוֹצָא פִי יְהוָה
  choice: tudo o que sai da boca de Yahweh
  alternative: cada palavra que vem da boca de Yahweh
  rationale: A expressão hebraica é mais ampla que “palavra” isoladamente, embora no contexto possa incluir a fala ou ordem divina. A opção escolhida preserva essa amplitude e a imagem concreta do original.
- issue: Agência divina na fome e no sustento de Israel
  choice: fez você passar fome e o alimentou
  alternative: deixou você passar fome e lhe deu de comer
  rationale: As formas causativas hebraicas atribuem a Deus tanto a experiência da fome quanto a provisão do maná. A tradução mantém essa tensão sem atenuar a primeira ação nem exagerá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O pronome singular “você” conserva o tratamento de Israel como uma unidade coletiva no hebraico. A repetição de “vive” foi mantida para refletir a estrutura retórica do original.
