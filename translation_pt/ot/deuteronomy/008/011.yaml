source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: pt
  text: Tenha cuidado para não se esquecer de Yahweh, seu Deus, deixando de guardar seus mandamentos, suas ordenanças e seus estatutos, que hoje lhe ordeno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Tenha cuidado
  rationale: A forma de advertência pede uma exortação direta; esta expressão é natural em português e preserva a força do imperativo.
- source_word: פֶּן תִּשְׁכַּח
  choice: para não se esquecer
  rationale: Expressa de modo corrente o perigo que deve ser evitado, sem enfraquecer a advertência.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Mantém o nome divino pessoal presente no hebraico e traduz de forma direta a designação pactual.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: deixando de guardar
  rationale: Representa a falta de observância como manifestação concreta de esquecer-se de Yahweh e soa natural em português.
- source_word: מִצְוֺתָיו
  choice: seus mandamentos
  rationale: Equivalente consagrado e claro para o termo da legislação da aliança.
- source_word: מִשְׁפָּטָיו
  choice: suas ordenanças
  rationale: Preserva o sentido jurídico-normativo sem sugerir aqui atos de condenação judicial, possível associação de 'juízos'.
- source_word: חֻקֹּתָיו
  choice: seus estatutos
  rationale: Mantém a distinção formal entre os três termos legais e o tom pactual de Deuteronômio.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhe ordeno
  rationale: Português idiomático que preserva a fala direta de Moisés e a ênfase deuteronômica em 'hoje'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; a transliteração preserva essa forma em vez de substituí-la por um título.
- issue: Relação entre esquecer-se de Yahweh e não guardar seus mandamentos
  choice: deixando de guardar
  alternative: a ponto de não guardar
  rationale: A construção pode indicar a maneira ou a expressão concreta do esquecimento. A tradução escolhida mantém essa relação sem afirmar uma formulação causal mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se três termos legais distintos — mandamentos, ordenanças e estatutos — e o singular de tratamento dirigido a Israel como interlocutor coletivo.
