base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: pt
  text: 'e diga no seu coração: “A minha força e o vigor da minha mão me proporcionaram esta riqueza[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta prosperidade”. O termo hebraico também pode designar recursos, força ou capacidade, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: e diga
  rationale: O perfeito qal com conjunção, neste contexto de advertência, expressa uma possibilidade a ser evitada. O subjuntivo mantém a ligação com a exortação do contexto e soa natural em português.
- source_word: בִּלְבָבֶךָ
  choice: no seu coração
  rationale: Preserva a metáfora hebraica para pensamento interior ou fala consigo mesmo, sem perder clareza em português atual.
- source_word: כֹּחִי
  choice: a minha força
  rationale: כֹּחַ denota força, poder ou capacidade; “força” é claro e mantém a ênfase na capacidade pessoal alegada.
- source_word: וְעֹצֶם יָדִי
  choice: e o vigor da minha mão
  rationale: עֹצֶם exprime força ou vigor. A formulação conserva a imagem concreta da mão como símbolo da ação e capacidade humanas, evitando repetir “força”.
- source_word: עָשָׂה לִי
  choice: conquistaram para mim
  rationale: Embora עשה signifique basicamente “fazer”, com לִי e “riqueza” indica produzir, obter ou adquirir para si. “Conquistaram para mim” comunica naturalmente a atribuição do êxito ao próprio esforço. O plural segue a concordância portuguesa com o sujeito composto.
- source_word: הַחַיִל הַזֶּה
  choice: esta riqueza
  rationale: No contexto imediato de abundância material em Deuteronômio 8, חַיִל se refere principalmente aos bens ou recursos adquiridos; o demonstrativo singular é vertido por “esta”.
theological_decisions:
- issue: Sentido de חַיִל na advertência da aliança
  choice: riqueza
  alternative: prosperidade; recursos; capacidade
  rationale: O contexto trata de casas, rebanhos, prata, ouro e multiplicação de bens. “Riqueza” expressa melhor o referente imediato, enquanto a nota preserva a amplitude lexical do termo e evita restringi-lo de modo absoluto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A metáfora “no seu coração” e a imagem “da minha mão” foram mantidas por serem claras e importantes para a forma do hebraico.
