  text: וְ/רָ֖ם לְבָבֶ֑/ךָ וְ/שָֽׁכַחְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of slaves.
translation:
  language: pt
  text: então seu coração se elevará, e você se esquecerá de Yahweh, seu Deus, que o tirou da terra do Egito, da casa de escravos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «da casa da escravidão» ou «da casa de servidão». O hebraico diz literalmente «da casa de escravos».'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: seu coração se elevará
  rationale: Preserva a metáfora hebraica do coração que se ergue em arrogância, sem substituir diretamente a imagem pela interpretação «ficará orgulhoso». O futuro se ajusta naturalmente, em português, à sequência de advertência iniciada no contexto.
- source_word: וְשָׁכַחְתָּ
  choice: você se esquecerá
  rationale: O qatal dá continuidade à sequência condicional/resultante do contexto. O futuro em português expressa com clareza o resultado advertido, sem tratá-lo como fato passado.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Mantém o nome divino expresso pelo Tetragrama e traduz de modo direto a relação possessiva e pactual de אֱלֹהֶיךָ.
- source_word: הַמּוֹצִיאֲךָ
  choice: que o tirou
  rationale: O particípio com artigo identifica Yahweh por seu ato de libertação. A oração relativa é natural em português e preserva o motivo do êxodo.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Reproduz a formulação hebraica completa, em vez de reduzi-la simplesmente a «do Egito».
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Conserva a imagem concreta do hebraico e o substantivo plural עֲבָדִים, «escravos», sem o abstrair como «escravidão».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração «Yahweh» preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Sentido de מִבֵּית עֲבָדִים
  choice: da casa de escravos
  alternative: da casa da escravidão; da casa de servidão
  rationale: A escolha mantém a referência concreta aos escravos e a força social da libertação do Egito, embora as formas abstratas sejam possíveis em português.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «você» para o singular de segunda pessoa e «o tirou» como objeto anafórico, evitando regionalismos marcados. A metáfora do coração elevado e a expressão concreta «casa de escravos» foram preservadas.
