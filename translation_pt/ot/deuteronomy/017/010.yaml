- from: Você agirá de acordo com a palavra que eles lhe declararem naquele lugar que Yahweh escolherá[a] e terá o cuidado de fazer tudo conforme eles lhe instruírem.
  to: Você agirá de acordo com a palavra que eles lhe declararem a partir daquele lugar que Yahweh escolherá[a] e terá o cuidado de fazer de acordo com tudo o que eles lhe ensinarem.
  rationale: A revisão restitui a noção de procedência de מִן הַמָּקוֹם e substitui uma construção final pouco natural por uma formulação portuguesa fluente que conserva a instrução legal abrangente do hebraico. A ambiguidade de דָּבָר e a nota correspondente são mantidas.
