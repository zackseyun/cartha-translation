  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: pt
  text: Você agirá de acordo com a palavra que eles lhe declararem a partir daquele lugar que Yahweh escolherá[a] e terá o cuidado de fazer de acordo com tudo o que eles lhe ensinarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de acordo com a decisão que eles lhe declararem”. A palavra hebraica דָּבָר pode significar “palavra”, “questão” ou, em contexto judicial, “decisão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Você agirá
  rationale: O verbo עשה é amplo, podendo significar “fazer” ou “agir”. Neste contexto jurídico, “agirá” combina naturalmente com “de acordo com” e mantém a força normativa da forma verbal.
- source_word: עַל פִּי הַדָּבָר
  choice: de acordo com a palavra
  rationale: A expressão עַל־פִּי indica conformidade ou autoridade, e דָּבָר pode significar “palavra”, “questão” ou, em contexto judicial, “decisão”. A tradução principal preserva a imagem hebraica, enquanto a nota registra a alternativa contextual.
- source_word: יַגִּידוּ לְךָ
  choice: eles lhe declararem
  rationale: O hifil de נגד significa “declarar” ou “dar a conhecer”. “Declararem” comunica o caráter formal e autorizado do pronunciamento.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: naquele lugar que Yahweh escolherá
  rationale: Em português, “declararem naquele lugar” expressa naturalmente a origem situacional indicada por מִן sem sugerir que as autoridades venham fisicamente do lugar. O futuro “escolherá” corresponde ao horizonte prospectivo de Deuteronômio.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: terá o cuidado de fazer
  rationale: A construção שׁמר com infinitivo expressa observância cuidadosa. Esta formulação é clara e preserva a ênfase em cumprir com atenção.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּךָ
  choice: tudo conforme eles lhe instruírem
  rationale: כְּכֹל אֲשֶׁר exige conformidade abrangente, e o hifil de ירה designa instrução ou orientação autorizada, especialmente em âmbito legal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio. “Yahweh” preserva explicitamente o nome divino sem substituí-lo por um título.
- issue: Natureza da fala das autoridades
  choice: palavra
  alternative: decisão
  rationale: דָּבָר permanece semanticamente aberto entre “palavra” e uma “decisão” judicial. O texto principal conserva a formulação mais ampla, e a nota explicita a leitura jurídica sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. Mantém a segunda pessoa de tratamento por “você”, evita juridiquês desnecessário e preserva a repetição normativa e a ambiguidade lexical do hebraico.
