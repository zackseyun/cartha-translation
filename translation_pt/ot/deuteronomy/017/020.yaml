base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: pt
  text: para que o seu coração não se eleve acima de seus irmãos[a] e para que ele não se desvie do mandamento, nem para a direita nem para a esquerda, a fim de que prolongue os seus dias no seu reino, ele e seus filhos, no meio de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acima de seus compatriotas israelitas”. O hebraico diz literalmente “acima de seus irmãos”, empregando linguagem de parentesco da aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי
  choice: para que... não
  rationale: Expressa naturalmente em português a finalidade preventiva da construção hebraica com infinitivo.
- source_word: רוּם לְבָבוֹ
  choice: o seu coração não se eleve
  rationale: Preserva a imagem hebraica do coração que se ergue em orgulho, sem explicitar além do texto.
- source_word: מֵאֶחָיו
  choice: acima de seus irmãos
  rationale: Mantém a linguagem de parentesco da aliança e a ideia de elevação sobre os seus pares.
- source_word: סוּר מִן הַמִּצְוָה
  choice: se desvie do mandamento
  rationale: Reproduz a linguagem comum de afastamento da obediência à ordem divina; o singular definido é preservado.
- source_word: יָמִין וּשְׂמֹאול
  choice: nem para a direita nem para a esquerda
  rationale: Conserva a metáfora hebraica de desvio em qualquer direção em formulação idiomática portuguesa.
- source_word: לְמַעַן
  choice: a fim de que
  rationale: Marca com clareza a finalidade ou o resultado pretendido.
- source_word: יַאֲרִיךְ יָמִים
  choice: prolongue os seus dias
  rationale: Preserva o idioma hebraico de prolongar os dias e continua compreensível em português atual.
- source_word: עַל מַמְלַכְתּוֹ
  choice: no seu reino
  rationale: Comunica a permanência no exercício régio sem impor a leitura mais abstrata de 'reinado'.
- source_word: הוּא וּבָנָיו
  choice: ele e seus filhos
  rationale: Mantém o hebraico explícito 'filhos', relevante ao contexto de sucessão dinástica.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: no meio de Israel
  rationale: Preserva a expressão espacial hebraica e situa a continuidade régia dentro da comunidade de Israel.
theological_decisions:
- issue: Linguagem de parentesco na lei do rei
  choice: seus irmãos
  alternative: seus compatriotas israelitas
  rationale: O hebraico emprega literalmente 'irmãos' como linguagem de parentesco da aliança. A tradução conserva essa forma e esclarece o referente em nota.
- issue: Formulação da continuidade dinástica
  choice: ele e seus filhos
  alternative: ele e seus descendentes
  rationale: O texto diz especificamente 'filhos'. Ampliar para 'descendentes' resolveria interpretativamente o alcance dinástico, mas ultrapassaria a forma lexical.
- issue: Sentido de עַל מַמְלַכְתּוֹ
  choice: no seu reino
  alternative: sobre o seu reino / no seu reinado
  rationale: A construção admite relação com reino, domínio ou exercício régio. 'No seu reino' preserva a formulação concreta e evita reduzir a expressão exclusivamente à duração do reinado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os principais idiomas hebraicos — coração elevado, direita e esquerda, prolongar os dias e no meio de Israel — sem tornar a frase excessivamente literal.
