base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: pt
  text: Não deverá tomar para si muitas esposas[a], para que o seu coração não se desvie; também não deverá acumular para si prata e ouro em grande quantidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o seu coração não deverá se desviar”. O hebraico também pode ser entendido como uma proibição coordenada, em vez de uma oração explícita de finalidade ou resultado.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה ... נָשִׁים
  choice: tomar para si muitas mulheres
  rationale: Neste contexto de casamento régio, נָשִׁים designa mulheres tomadas como esposas. A formulação é natural em português e comunica a proibição de aumentar excessivamente seu número, sem sugerir uma proibição geral de convívio com mulheres.
- source_word: יָסוּר
  choice: se desvie
  rationale: סור indica afastar-se ou desviar-se. “Se desvie” preserva a metáfora e não acrescenta um objeto, como “do SENHOR”, ausente do hebraico.
- source_word: לְבָבוֹ
  choice: o seu coração
  rationale: “Coração” conserva a antropologia bíblica referente à vontade, às afeições e à orientação interior.
- source_word: כֶסֶף וְזָהָב
  choice: prata e ouro
  rationale: Mantém os substantivos concretos e o par tradicional do hebraico, sem reduzir כֶסֶף ao sentido de dinheiro.
- source_word: יַרְבֶּה ... מְאֹד
  choice: acumular ... em grande quantidade
  rationale: No contexto de bens preciosos, “acumular em grande quantidade” expressa de modo idiomático tanto a ideia causativa de רבה quanto a intensificação de מְאֹד.
- source_word: וְלֹא ... וְלֹא ... לֹא
  choice: Não deverá ... para que ... não; também não deverá
  rationale: A sequência mantém o tom jurídico das proibições e apresenta a oração intermediária em sua leitura provável de finalidade ou resultado, sem apagar a alternativa sintática.
theological_decisions:
- issue: Relação entre tomar muitas mulheres e o desvio do coração
  choice: 'A oração intermediária é vertida como finalidade ou resultado: “para que o seu coração não se desvie”.'
  alternative: “e o seu coração não deverá se desviar”, como proibição coordenada.
  rationale: A sintaxe hebraica admite as duas relações. O fluxo da lei régia favorece a leitura da oração como explicação do perigo ligado à multiplicação de mulheres, mas a nota preserva a ambiguidade genuína e não especifica de que ou de quem o coração se desviaria.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Não deverá” mantém o caráter normativo; “tomar para si muitas mulheres” evita o pouco natural “multiplicar mulheres” e explicita pelo contexto a relação conjugal sem inserir o termo técnico “esposas” onde o hebraico usa נָשִׁים.
