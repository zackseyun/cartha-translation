base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: pt
  text: e vai, serve outros deuses e se curva diante deles, ou diante do sol, da lua ou de todo o exército dos céus[a], que eu não ordenei[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «de toda a hoste celestial». A expressão pode designar o conjunto dos corpos celestes e, em certos contextos, também pode evocar seres celestiais.
    reason: lexical_alternative
  - marker: b
    text: A expressão «que eu não ordenei» pode referir-se especificamente a «todo o exército dos céus» ou, de modo mais amplo, a todo o ato de prestar culto a outros deuses.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: vai
  rationale: No contexto condicional e jurídico iniciado no versículo anterior, o wayyiqtol dá continuidade à hipótese; o presente é natural em português.
- source_word: וַיַּעֲבֹד
  choice: serve
  rationale: עבד, quando tem divindades como objeto, indica serviço cultual. “Serve” preserva essa nuance e deixa ao verbo seguinte a expressão do gesto de adoração.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Tradução direta, sem acrescentar a conotação étnica de “deuses estrangeiros”.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: se curva diante deles
  rationale: O verbo descreve o ato de inclinar-se ou prostrar-se. A formulação é clara e preserva o gesto físico sem reduzi-lo ao termo geral “adora”.
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ א֛וֹ לְכָל צְבָא הַשָּׁמַיִם
  choice: diante do sol, da lua ou de todo o exército dos céus
  rationale: A construção é apresentada como especificação dos objetos diante dos quais a pessoa se curva. “Exército dos céus” conserva o caráter coletivo de צבא e não define além do texto se a expressão abrange apenas astros ou também seres celestiais.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: coisa que eu não ordenei
  rationale: Mantém a afirmação de que Deus não ordenou isso, sem substituí-la pela ideia mais explícita de proibição. “Coisa que” permite que a oração retome a prática descrita sem eliminar sua possível ligação gramatical com o antecedente imediato.
theological_decisions:
- issue: Alcance da oração relativa אֲשֶׁר לֹא צִוִּיתִי
  choice: “coisa que eu não ordenei”, com referência natural ao culto idólatra descrito
  alternative: A oração pode modificar especificamente “todo o exército dos céus”.
  rationale: O antecedente imediato favorece uma ligação com “exército dos céus”, enquanto o contexto permite entender a frase como repúdio de toda a conduta descrita. A tradução e a nota preservam as duas possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase permanece como continuação sintática do contexto legal anterior; por isso começa com minúscula e termina com vírgula. Os travessões tornam clara a enumeração explicativa sem apagar a ambiguidade da oração final.
