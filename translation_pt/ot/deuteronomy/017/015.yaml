source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: pt
  text: Você deverá, sem falta, estabelecer sobre si um rei que Yahweh, seu Deus, escolher. Dentre os seus irmãos[a], você estabelecerá sobre si um rei; não poderá pôr sobre si um homem estrangeiro[b], alguém que não seja seu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” é linguagem de parentesco para os membros de Israel; isto é, alguém dentre o próprio povo.
    reason: lexical_alternative
  - marker: b
    text: Ou, de modo mais conciso, “um estrangeiro”. O hebraico diz literalmente “um homem estrangeiro”.
    reason: alternative_reading
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: deverá, sem falta, estabelecer
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a determinação. “Sem falta” transmite a ênfase de modo natural em português.
- source_word: עָלֶיךָ
  choice: sobre si
  rationale: Preserva a ideia reflexiva de Israel estabelecer uma autoridade sobre si mesmo, embora o povo seja tratado coletivamente no singular.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente direto e corrente do substantivo hebraico.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: que Yahweh, seu Deus, escolher
  rationale: O futuro do subjuntivo é natural em português para a escolha ainda não determinada no contexto legal e mantém Yahweh como aquele que escolhe o rei.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: dentre os seus irmãos
  rationale: Mantém a linguagem de parentesco do hebraico e expressa com naturalidade a seleção de alguém pertencente ao próprio povo.
- source_word: לֹא תוּכַל לָתֵת
  choice: não poderá pôr
  rationale: Conserva a forma modal do hebraico, que no contexto jurídico funciona como proibição, sem eliminar totalmente sua formulação literal de impossibilidade.
- source_word: אִישׁ נָכְרִי
  choice: um homem estrangeiro
  rationale: Preserva tanto o substantivo אִישׁ, apropriado ao candidato masculino ao reinado, quanto o qualificativo נָכְרִי.
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: alguém que não seja seu irmão
  rationale: Mantém a explicação em termos de parentesco pactual, usando “alguém” para evitar uma repetição pouco natural de “homem”.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; a transliteração preserva essa função sem substituí-lo por um título.
- issue: Linguagem de parentesco אַחֶיךָ / אָחִיךָ
  choice: irmãos / irmão
  alternative: compatriotas / membro do seu povo
  rationale: A tradução conserva a imagem familiar masculina do original. A nota esclarece que, aqui, ela identifica um membro do povo de Israel.
- issue: Força jurídica de לֹא תוּכַל
  choice: não poderá
  alternative: não deverá; não terá permissão para
  rationale: “Não poderá” comunica a proibição legal e, ao mesmo tempo, mantém mais de perto a formulação modal hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção enfática inicial foi vertida de maneira idiomática; a linguagem de parentesco e a formulação modal da proibição foram preservadas.
