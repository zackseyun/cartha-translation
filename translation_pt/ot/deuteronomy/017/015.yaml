  source_fidelity: 'A tradução representa com precisão os elementos centrais do hebraico: a ênfase de שׂוֹם תָּשִׂים em “deverá, sem falta”; a designação de um rei escolhido por Yahweh; a exigência de que ele provenha dentre os “irmãos”; e a proibição jurídica de colocar um homem estrangeiro sobre o povo. “Sobre si” preserva adequadamente o singular coletivo do destinatário hebraico.'
  naturalness: O português é moderno, claro e apropriado a um registro jurídico-escritural. “Você deverá, sem falta” e “não poderá” soam naturais nesse gênero. A repetição deliberada de “sobre si” acompanha a repetição do hebraico sem se tornar excessivamente pesada.
  terminology: “Yahweh” segue a decisão terminológica do projeto para o Tetragrama. “Irmãos/irmão” conserva a linguagem de parentesco do original, com nota explicativa adequada. “Homem estrangeiro” reproduz de modo fiel a construção איש נכרי e é esclarecido pela nota como alternativa mais concisa.
