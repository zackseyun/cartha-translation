base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: pt
  text: Você irá aos sacerdotes levitas e ao juiz que estiver em exercício naqueles dias. Consultará, e eles lhe declararão a decisão judicial.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a palavra do juízo”. A expressão hebraica se refere à decisão judicial autorizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Você irá
  rationale: O perfeito qal com conjunção tem força diretiva na instrução legal. Em português, “irá” expressa naturalmente a ordem e o deslocamento até o tribunal autorizado.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  rationale: A expressão identifica os sacerdotes como levitas, sem sugerir que todos os levitas fossem sacerdotes. A formulação é clara e institucional em português.
- source_word: הַשֹּׁפֵט
  choice: o juiz
  rationale: É a correspondência direta e corrente para o oficial que exerce função judicial.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: que estiver em exercício naqueles dias
  rationale: A oração aponta para quem ocupar o cargo no tempo em questão. “Em exercício” torna explícito o sentido institucional sem identificar uma pessoa específica.
- source_word: וְדָרַשְׁתָּ
  choice: Fará a consulta
  rationale: No contexto judicial, o verbo indica buscar uma orientação ou decisão autorizada. “Fará a consulta” comunica esse procedimento com clareza.
- source_word: וְהִגִּידוּ לְךָ
  choice: eles lhe declararão
  rationale: O hifil de נגד indica a comunicação formal da decisão. “Declararão” preserva o tom jurídico e solene.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: a decisão judicial
  rationale: Literalmente, “a palavra do juízo/julgamento”. No contexto, a expressão designa o pronunciamento judicial autorizado; “decisão judicial” transmite esse sentido em português atual, enquanto a nota preserva a forma mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com registro jurídico moderado. A divisão em duas frases evita uma sequência excessiva de conjunções sem enfraquecer a progressão legal do hebraico. O marcador da nota foi colocado junto à expressão que ele explica.
