  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: pt
  text: 'Porém, ele não deverá aumentar para si o número de cavalos[a], nem fazer o povo voltar ao Egito[b] a fim de aumentar o número de cavalos, pois Yahweh disse a vocês: “Nunca mais voltem por este caminho”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “adquirir muitos cavalos para si”. O verbo hebraico significa “tornar numeroso” ou “aumentar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “levar o povo de volta ao Egito”. O verbo hebraico está na forma causativa: o rei é proibido de provocar esse retorno.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente, algo como: “Vocês não acrescentarão a voltar por este caminho novamente”. Trata-se de uma expressão idiomática que significa: “Nunca mais voltem por este caminho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: Neste contexto, a partícula introduz uma restrição contrastante à conduta do rei. “Contudo” comunica essa transição com naturalidade em português.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: não deverá aumentar para si o número de cavalos
  rationale: Preserva o sentido causativo de רבה, “tornar numeroso, aumentar”, e o interesse próprio expresso por לּוֹ, sem sugerir especificamente a reprodução dos animais.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: nem fazer o povo voltar ao Egito
  rationale: A construção “fazer ... voltar” preserva explicitamente o valor causativo do Hifil de שוב e mantém “o povo” como objeto.
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: a fim de aumentar o número de cavalos
  rationale: A locução expressa finalidade e repete a formulação anterior, conservando a ligação lexical presente no hebraico.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֹא תֹסִפוּן לָשׁוּב ... עוֹד
  choice: Nunca mais voltem
  rationale: O idioma formado por יסף com o infinitivo e reforçado por עוֹד proíbe uma nova ocorrência; “nunca mais voltem” transmite sua força em português corrente.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: por este caminho
  rationale: “Caminho” preserva o sentido concreto e figurado de דֶּרֶךְ; com a preposição, a expressão indica a rota pela qual se volta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de o substituir pelo título tradicional.
- issue: Agente responsável pelo retorno ao Egito
  choice: O rei não deve fazer o povo voltar
  alternative: O povo não deve voltar por iniciativa própria
  rationale: A forma causativa יָשִׁיב atribui ao rei a responsabilidade por provocar o retorno, enquanto a fala divina subsequente dirige a proibição ao povo no plural.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Emprega “vocês” para marcar o plural hebraico e evita linguagem excessivamente arcaica. A repetição de “aumentar o número de cavalos” conserva deliberadamente a ligação verbal do original.
