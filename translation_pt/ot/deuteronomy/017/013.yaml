  text: וְ/כָל הָ/עָ֖ם יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹ֥א יְזִיד֖וּ/ן עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: pt
  text: E todo o povo ouvirá e temerá, e não voltará a agir com presunção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não voltará a agir arrogantemente” ou “não tornará a proceder com insolência”. O verbo hebraico transmite a ideia de desafio deliberado, insolente e presunçoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: E todo o povo
  rationale: Preserva a conjunção e traduz literalmente a expressão hebraica, sem acrescentar “de Israel”, que não aparece neste versículo.
- source_word: יִשְׁמְעוּ
  choice: ouvirá
  rationale: O verbo שמע tem aqui o sentido comum de ouvir, provavelmente tomar conhecimento da sentença; o futuro mantém a força consequencial da formulação legal.
- source_word: וְיִרָאוּ
  choice: e temerá
  rationale: Mantém a concisão do hebraico e não especifica indevidamente se o temor é de Deus, da pena ou de ambos.
- source_word: וְלֹא יְזִידוּן
  choice: e não voltará a agir com presunção
  rationale: O hifil de זיד expressa conduta deliberadamente insolente, arrogante ou presunçosa. “Agir com presunção” comunica essa rebeldia intencional em português natural.
- source_word: עוֹד
  choice: não voltará a
  rationale: Neste contexto, עוֹד indica que tal conduta não se repetirá. A construção “não voltará a” é idiomática e clara.
theological_decisions:
- issue: Natureza do temor produzido pela sentença
  choice: “temerá”, sem objeto expresso
  alternative: “temerá o SENHOR” ou “terá medo da punição”
  rationale: O hebraico não declara o objeto do temor. A tradução conserva a ambiguidade entre temor de Deus, temor da pena ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular coletivo em “todo o povo ouvirá e temerá” reproduz naturalmente a concordância do português, embora os verbos hebraicos estejam no plural.
