revisions:
- from: Ela ficará com ele, e ele a lerá todos os dias da sua vida, para que aprenda a temer Yahweh, seu Deus,[a] a guardar todas as palavras desta lei e estes estatutos, cumprindo-os.
  to: Ela estará com ele, e ele a lerá todos os dias da sua vida, para que aprenda a temer Yahweh, seu Deus,[a] a guardar todas as palavras desta lei e estes estatutos e a cumpri-los.
  rationale: A revisão é limitada à maior proximidade com o valor de «estar com» no hebraico e à restauração explícita da finalidade de praticar os mandamentos e estatutos. Mantêm-se as escolhas terminológicas e a nota lexical existentes.
  reviewer_model: gpt-5.6-terra
