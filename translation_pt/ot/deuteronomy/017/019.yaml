  text: וְ/הָיְתָ֣ה עִמּ֔/וֹ וְ/קָ֥רָא ב֖/וֹ כָּל יְמֵ֣י חַיָּ֑י/ו לְמַ֣עַן יִלְמַ֗ד לְ/יִרְאָה֙ אֶת יְהוָ֣ה אֱלֹהָ֔י/ו לִ֠/שְׁמֹר אֶֽת כָּל דִּבְרֵ֞י הַ/תּוֹרָ֥ה הַ/זֹּ֛את וְ/אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה לַ/עֲשֹׂתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: pt
  text: Ela estará com ele, e ele a lerá todos os dias da sua vida, para que aprenda a temer Yahweh, seu Deus,[a] a guardar todas as palavras desta lei e estes estatutos e a cumpri-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a reverenciar Yahweh, seu Deus”. Neste contexto, “temer” inclui reverência e submissão obediente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: Ela ficará com ele
  rationale: O pronome feminino retoma a cópia da lei mencionada no versículo anterior; “ficará com ele” comunica posse e acesso contínuos.
- source_word: וְקָרָא בוֹ
  choice: e ele a lerá
  rationale: Embora o hebraico diga literalmente “lerá nela”, em português moderno “a lerá” é mais natural e preserva o sentido de ler a cópia escrita.
- source_word: כָּל יְמֵי חַיָּיו
  choice: todos os dias da sua vida
  rationale: Mantém a expressão hebraica e sua ênfase na duração por toda a vida.
- source_word: לְמַעַן יִלְמַד
  choice: para que aprenda
  rationale: Expressa claramente a finalidade da leitura contínua.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: a temer Yahweh, seu Deus
  rationale: “Temer” preserva a amplitude de ירא, que inclui temor, reverência e submissão obediente; o nome divino é transliterado como Yahweh.
- source_word: לִשְׁמֹר
  choice: a guardar
  rationale: No contexto da aliança, “guardar” conserva o idioma bíblico de observar fielmente as exigências dadas.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: todas as palavras desta lei
  rationale: “Lei” é transparente para o leitor comum e adequado ao contexto jurídico e pactual de Deuteronômio.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: estes estatutos
  rationale: “Estatutos” mantém o caráter legal do termo hebraico חֻקִּים.
- source_word: לַעֲשֹׂתָם
  choice: cumprindo-os
  rationale: Expressa de modo natural em português a ideia concreta de pôr em prática a lei e os estatutos, sem reduzi-la apenas a assentimento.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio da aliança; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Amplitude de ירא no contexto da aliança
  choice: temer
  alternative: reverenciar
  rationale: “Temer” preserva a tensão entre temor, reverência e submissão obediente, sem limitar o termo a simples respeito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A referência feminina “Ela” retoma explicitamente a cópia da lei do versículo anterior. A sintaxe foi levemente naturalizada, mantendo o encadeamento entre leitura, temor, guarda e prática.
