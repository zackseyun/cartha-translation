source:
  edition: WLC
  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: pt
  text: 'Quando você entrar na terra que Yahweh, seu Deus, lhe dá, e tomar posse dela, habitar nela e disser: “Nomearei um rei para me governar,[a] como todas as nações que estão ao meu redor”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porei sobre mim um rei.” O hebraico diz literalmente: “Porei sobre mim um rei.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Quando você entrar
  rationale: כִּי introduz aqui uma situação futura prevista, e בוא com אֶל הָאָרֶץ significa naturalmente entrar na terra. “Quando” comunica melhor essa expectativa do que “se”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto de Deuteronômio, refere-se à terra prometida; “a terra” é a formulação consagrada e adequada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a segunda pessoa do singular e a linguagem da relação de aliança.
- source_word: נֹתֵן לָךְ
  choice: lhe dá
  rationale: O particípio apresenta a dádiva divina como ação em curso ou certa. Em português, o presente “lhe dá” é natural nessa oração prospectiva e mantém a agência divina.
- source_word: וִירִשְׁתָּהּ
  choice: tomar posse dela
  rationale: ירשׁ, em contexto territorial, indica adquirir ou tomar posse da terra, mais especificamente do que simplesmente “possuir” ou “herdar”.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: e nela habitar
  rationale: ישׁב denota residência estabelecida. “Habitar” é claro, digno e corrente no registro bíblico moderno.
- source_word: וְאָמַרְתָּ
  choice: e disser
  rationale: O futuro do subjuntivo integra naturalmente, em português, a sequência iniciada por “quando”, sem alterar a natureza prospectiva do hebraico.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: Estabelecerei sobre mim um rei
  rationale: Mantém de perto o sentido de שׂים, “pôr/estabelecer”, e preserva a expressão עָלַי, “sobre mim”, sem decidir além do texto o modo exato da instituição real.
- source_word: כְּכָל הַגּוֹיִם
  choice: como todas as nações
  rationale: גּוֹיִם designa aqui os povos politicamente organizados ao redor de Israel; “nações” evita uma leitura teológica posterior de “gentios”.
- source_word: אֲשֶׁר סְבִיבֹתָי
  choice: ao meu redor
  rationale: Expressa de modo natural a localização das nações vizinhas e preserva a primeira pessoa da fala citada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em forma transliterada, sem substituí-lo por um título.
- issue: Caráter da futura instituição de um rei
  choice: Tradução neutra da declaração do povo
  alternative: Formulação que apresente o pedido como aprovação ou condenação explícita
  rationale: O versículo prevê que o povo desejará um rei como as nações vizinhas, mas nesta frase não declara por si só aprovação nem condenação. A tradução preserva essa tensão para o contexto imediato desenvolver.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você/seu/lhe” preserva o destinatário singular do hebraico. A ordem das ações foi mantida, e a nota registra tanto a forma mais literal quanto uma alternativa idiomática.
