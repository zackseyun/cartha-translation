  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: pt
  text: Se for encontrado entre vocês, em uma de suas cidades[a] que Yahweh, seu Deus, lhes dá, um homem ou uma mulher que faça o que é mau aos olhos de Yahweh, seu Deus, violando sua aliança[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “em um dos seus portões”. Neste contexto, “portões” pode referir-se às cidades ou à sua jurisdição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “transgredindo sua aliança” ou “quebrando sua aliança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִמָּצֵא
  choice: Se for encontrado
  rationale: A construção introduz a condição de um caso jurídico, e o nifal de מצא pede uma formulação passiva.
- source_word: בְקִרְבְּךָ
  choice: entre vocês
  rationale: Expressa de modo natural a presença de alguém no meio da comunidade da aliança.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: em alguma das cidades
  rationale: Embora literalmente diga 'em um dos seus portões', em Deuteronômio 'portões' funciona por metonímia para as cidades ou comunidades sob sua jurisdição.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: que Yahweh, seu Deus, lhes dá
  rationale: Preserva a fórmula da aliança e o valor presente do particípio, ajustando em português a concordância de número com 'vocês'.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: um homem ou uma mulher
  rationale: Mantém explicitamente o par de gêneros presente no hebraico.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת הָרַע
  choice: que faça o que é mau
  rationale: Traduz naturalmente o idiomatismo hebraico 'fazer o mal', mantendo sua força moral.
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: aos olhos de Yahweh, seu Deus
  rationale: Conserva a metáfora hebraica de avaliação divina, clara também em português.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: violando a aliança dele
  rationale: O gerúndio expressa a relação circunstancial com o ato mau; 'violar' comunica com clareza a transgressão da aliança sem especificar antecipadamente a infração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Natureza da violação da aliança
  choice: violando a aliança dele
  alternative: transgredindo a aliança dele; quebrando a aliança dele
  rationale: O texto caracteriza o ato de modo geral como violação da aliança, enquanto o versículo seguinte especifica a conduta. A tradução não antecipa essa especificação nem impõe uma construção teológica posterior.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. O plural 'vocês/lhes' torna natural o tratamento comunitário do singular coletivo hebraico. A frase permanece aberta, com vírgula final, porque a condição jurídica continua nos versículos seguintes.
