  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: pt
  text: Mas o homem que agir com presunção[a], recusando-se a dar ouvidos[b] ao sacerdote que está ali para servir a Yahweh[c], seu Deus, ou ao juiz, esse homem morrerá. Assim, você eliminará o mal do meio de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “com arrogância”, “com insolência” ou “deliberadamente”. A expressão hebraica indica uma atitude consciente e desafiadora, não uma falha acidental.
    reason: lexical_alternative
  - marker: b
    text: Ou “recusando-se a obedecer”. No uso jurídico, o verbo hebraico “ouvir” frequentemente inclui a ideia de atender ou obedecer.
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” representa o nome divino יהוה (YHWH), tradicionalmente traduzido por “o SENHOR”; outra forma conhecida é “Jeová”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: Mas o homem
  rationale: O וְ dá continuidade à instrução anterior e introduz o caso de desobediência; “Mas” expressa bem esse contraste. אִישׁ é masculino singular e designa o infrator individual.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: agir com presunção
  rationale: A expressão descreve uma atitude deliberada, arrogante e desafiadora, não uma falha acidental. “Com presunção” conserva o tom jurídico e moral do hebraico.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: recusando-se a dar ouvidos
  rationale: שׁמע significa literalmente ouvir, mas neste contexto jurídico inclui atender e obedecer. A formulação portuguesa comunica uma recusa consciente sem reduzir o verbo simplesmente a “obedecer”.
- source_word: אֶל הַכֹּהֵן
  choice: ao sacerdote
  rationale: כֹּהֵן designa diretamente o sacerdote; não há necessidade de ampliar para um título administrativo.
- source_word: הָעֹמֵד לְשָׁרֵת שָׁם אֶת יְהוָה אֱלֹהֶיךָ
  choice: que está ali para servir a Yahweh, seu Deus
  rationale: A construção descreve a função oficial exercida pelo sacerdote naquele lugar. “Servir” reproduz o verbo cultual שׁרת, e “ali” preserva שָׁם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: ou ao juiz
  rationale: שֹׁפֵט é a autoridade judicial prevista no procedimento legal; “juiz” é a tradução direta e corrente.
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: esse homem morrerá
  rationale: No contexto legal, a forma verbal enuncia a consequência penal. O futuro em português mantém a força solene da determinação sem acrescentar modalidade ausente do texto.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: Assim, você eliminará o mal de Israel
  rationale: בער integra uma fórmula jurídica de Deuteronômio para remover o mal da comunidade. “Eliminará” é claro e natural em português, enquanto “de Israel” conserva a concisão de מִיִּשְׂרָאֵל.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o translitera de modo reconhecível e evita substituí-lo silenciosamente por um título; a nota registra a tradição alternativa.
- issue: Linguagem masculina singular para o infrator
  choice: o homem / esse homem
  alternative: a pessoa; quem
  rationale: O hebraico emprega אִישׁ e retoma o mesmo indivíduo por הָאִישׁ הַהוּא. A tradução preserva essa forma masculina singular sem transformá-la em formulação neutra.
- issue: Sentido de שׁמע na recusa à autoridade religiosa ou judicial
  choice: dar ouvidos
  alternative: ouvir; obedecer
  rationale: A expressão mantém a imagem hebraica de ouvir, ao mesmo tempo que, no contexto jurídico, comunica a ideia de atender à decisão. A nota preserva a amplitude entre audição e obediência.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A sintaxe conserva o caráter jurídico do versículo, mas evita construções excessivamente arcaicas. “Você” mantém o destinatário singular do hebraico; “morrerá” expressa a sanção legal de modo direto.
