  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: pt
  text: Se uma questão para julgamento for difícil demais para você decidir, entre um caso de derramamento de sangue e outro[a], entre uma causa e outra[b] ou entre uma lesão e outra[c], em questões de disputa nas suas portas[d], então levante-se e suba ao lugar que Yahweh, seu Deus, escolher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre sangue e sangue”. A expressão se refere à distinção entre diferentes casos de derramamento de sangue, provavelmente incluindo homicídio ou culpa de sangue.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “entre um caso jurídico e outro” ou “entre uma demanda e outra”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “entre uma aflição e outra” ou “entre uma praga e outra”.'
    reason: lexical_alternative
  - marker: d
    text: As “portas” eram locais habituais de julgamento nas cidades; por isso, a expressão se refere aos tribunais locais.
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא
  choice: for difícil demais para você
  rationale: O nifal de פלא indica aqui algo que ultrapassa a capacidade da autoridade local de decidir. A formulação comunica com clareza essa dificuldade prática no contexto judicial.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: uma questão a ser julgada
  rationale: דָבָר é amplo, e sua combinação com מִשְׁפָּט identifica uma questão jurídica que exige decisão, sem restringi-la a um tipo específico de processo.
- source_word: בֵּין דָּם לְדָם
  choice: entre um caso de derramamento de sangue e outro
  rationale: A expressão literal, 'entre sangue e sangue', distingue casos relativos a homicídio, morte violenta ou culpa de sangue. A tradução explicita o contexto jurídico sem eliminar a imagem concreta, registrada também na nota.
- source_word: בֵּין דִּין לְדִין
  choice: entre uma causa judicial e outra
  rationale: דִּין pode designar causa, demanda, alegação ou decisão judicial. 'Causa judicial' preserva a amplitude forense sem confundi-la com a questão geral mencionada no início.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: ou entre uma lesão e outra
  rationale: נֶגַע pode indicar golpe, lesão, aflição ou praga. 'Lesão' se ajusta naturalmente à sequência de litígios, enquanto as demais possibilidades permanecem na nota.
- source_word: דִּבְרֵי רִיבֹת
  choice: questões de disputa
  rationale: A expressão indica matérias litigiosas ou controvérsias que exigem julgamento. A formulação é clara e mantém o caráter contencioso.
- source_word: בִּשְׁעָרֶיךָ
  choice: nas suas portas
  rationale: A tradução conserva a referência concreta às portas das cidades, locais tradicionais de julgamento, em vez de substituí-la interpretativamente por 'nas suas cidades'.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: levante-se e suba
  rationale: Os dois verbos exprimem ação decidida e deslocamento ascendente ao santuário central. A formulação mantém a cadência e a direção do hebraico.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: o lugar que ... escolher
  rationale: O yiqtol tem orientação futura no contexto de Deuteronômio e aponta para o lugar que Deus ainda designaria.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, preservando o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e distingue-o do título אֲדֹנָי.
- issue: Alcance de נֶגַע no contexto jurídico
  choice: lesão, com alternativas em nota
  alternative: aflição; praga
  rationale: O contexto pode apontar para dano corporal, mas o termo hebraico é mais amplo. A nota evita transformar uma escolha contextual em certeza exegética.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe mantém o caráter solene da instrução legal sem recorrer a construções arcaicas. Os termos jurídicos são compreensíveis ao leitor comum, e as notas preservam as ambiguidades lexicais relevantes do hebraico.
