    issue: 'Construção pouco natural e semanticamente opaca: «A mão das testemunhas será a primeira contra essa pessoa».'
    rationale: O hebraico usa «mão» como idioma de ação e responsabilidade. Em português, «ser a primeira contra» não comunica adequadamente essa ação. Acrescentar «a agir» torna o sentido jurídico compreensível sem alterar a sequência nem especificar o método de execução.
  revised_text: A mão das testemunhas será a primeira a agir contra ele, para matá-lo; depois, a mão de todo o povo.[a] Assim, você eliminará o mal do seu meio.[b]
