  rationale: 'A revisão corrige a única dificuldade relevante de fluência e inteligibilidade: torna explícita a agência implícita no idioma hebraico «a mão de», conservando a imagem, a prioridade das testemunhas e a participação posterior da comunidade. As notas permanecem corretamente ancoradas e o sentido da passagem não é modificado.'
