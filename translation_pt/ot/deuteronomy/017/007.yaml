  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: pt
  text: A mão das testemunhas será a primeira a agir contra ele, para matá-lo; depois, a mão de todo o povo.[a] Assim, você eliminará o mal do seu meio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a mão das testemunhas... e a mão de todo o povo”, expressão jurídica que atribui às testemunhas a responsabilidade inicial de executar a sentença.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “do meio de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד
  choice: mão
  rationale: Mantém a imagem hebraica e o idioma jurídico de agência e responsabilidade na execução da sentença.
- source_word: הָעֵדִים
  choice: as testemunhas
  rationale: Designa testemunhas em contexto judicial, não simplesmente acusadores.
- source_word: בּוֹ
  choice: contra essa pessoa
  rationale: Com “mão” em contexto punitivo, “contra” comunica ação judicial dirigida ao condenado; a formulação inclusiva evita impor gênero em português onde o referente contextual não exige isso.
- source_word: בָרִאשֹׁנָה
  choice: será a primeira
  rationale: Expressa a prioridade da ação das testemunhas.
- source_word: לַהֲמִיתוֹ
  choice: para matá-la
  rationale: Traduz diretamente o infinitivo causativo de מות no contexto da aplicação de uma sentença de morte.
- source_word: וְיַד כָּל הָעָם
  choice: depois, virá a mão de todo o povo
  rationale: Preserva a imagem e o singular coletivo do hebraico, deixando clara a participação posterior da comunidade.
- source_word: בָאַחֲרֹנָה
  choice: depois
  rationale: Marca naturalmente a sequência em contraste com a ação inicial das testemunhas.
- source_word: וּבִעַרְתָּ
  choice: você eliminará
  rationale: No formulário jurídico de Deuteronômio, בער indica remover ou extirpar o mal, sem referência necessária a queimar literalmente.
- source_word: הָרָע
  choice: o mal
  rationale: Conserva a amplitude da fórmula hebraica sem reduzi-la apenas ao malfeitor.
- source_word: מִקִּרְבֶּךָ
  choice: do seu meio
  rationale: Reproduz de modo natural a expressão comunitária e pactual do hebraico.
theological_decisions:
- issue: Sentido da fórmula deuteronômica וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Assim, você eliminará o mal do seu meio
  alternative: Assim, você eliminará o malfeitor do meio de vocês
  rationale: O hebraico diz literalmente “o mal” e pode abranger tanto a transgressão quanto sua presença corruptora na comunidade; a tradução evita restringi-lo ao indivíduo.
- issue: Responsabilidade das testemunhas na execução da sentença
  choice: Preservar “a mão das testemunhas” e “a mão de todo o povo”
  alternative: As testemunhas serão as primeiras, seguidas por todo o povo
  rationale: A imagem hebraica atribui às testemunhas responsabilidade direta e inicial, seguida pela participação comunitária, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O singular “você” acompanha a forma hebraica dirigida coletivamente a Israel; “essa pessoa” evita discordância de gênero e mantém o referente judicial. As notas foram reposicionadas para corresponder corretamente ao conteúdo que explicam.
