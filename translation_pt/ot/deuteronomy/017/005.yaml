  text: וְ/הֽוֹצֵאתָ֣ אֶת הָ/אִ֣ישׁ הַ/ה֡וּא אוֹ֩ אֶת הָ/אִשָּׁ֨ה הַ/הִ֜וא אֲשֶׁ֣ר עָ֠שׂוּ אֶת הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֶל שְׁעָרֶ֔י/ךָ אֶת הָ/אִ֕ישׁ א֖וֹ אֶת הָ/אִשָּׁ֑ה וּ/סְקַלְתָּ֥/ם בָּ/אֲבָנִ֖ים וָ/מֵֽתוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: pt
  text: então você levará aos portões da sua cidade[a] aquele homem ou aquela mulher que tiver praticado esse ato mau[b] — o homem ou a mulher — e os apedrejará com pedras, e eles morrerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos seus portões”. Os portões da cidade eram o lugar público habitual de julgamentos e outros procedimentos legais no antigo Israel.
    reason: cultural_note
  - marker: b
    text: Ou “essa coisa má” ou “esse assunto mau”. A palavra hebraica pode significar “coisa”, “assunto” ou “caso”, especialmente em contexto jurídico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: então você levará
  rationale: O waw ligado ao perfeito dá continuidade à instrução jurídica. “Então” comunica a etapa seguinte do procedimento, e o futuro mantém o tom prescritivo.
- source_word: הָאִישׁ הַהוּא אוֹ אֶת־הָאִשָּׁה הַהִוא
  choice: aquele homem ou aquela mulher
  rationale: Preserva a especificidade da construção com artigo e demonstrativo, bem como a menção explícita de ambos os sexos.
- source_word: אֲשֶׁר עָשׂוּ
  choice: que tiver praticado
  rationale: O singular distributivo em português concorda naturalmente com “aquele homem ou aquela mulher”; o pretérito composto do subjuntivo situa o ato como já apurado no procedimento descrito.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: essa coisa má
  rationale: דָּבָר pode designar “coisa” ou “assunto/caso”. “Coisa má” conserva a formulação ampla e concreta, sem intensificar רָע.
- source_word: אֶל־שְׁעָרֶיךָ
  choice: até os portões da sua cidade
  rationale: “Portões” conserva a imagem hebraica; “da sua cidade” torna explícito, em português natural, o referente comunitário implícito no uso de שַׁעַר em Deuteronômio.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: e os apedrejará
  rationale: O verbo português “apedrejar” já incorpora semanticamente o uso de pedras; repetir “com pedras” seria pouco natural e redundante em português, embora corresponda formalmente à expressão hebraica.
- source_word: וָמֵתוּ
  choice: e eles morrerão
  rationale: Mantém a coordenação e apresenta diretamente o resultado da execução, sem acrescentar finalidade ou obrigação modal.
theological_decisions:
- issue: Formulação jurídica marcada por sexo
  choice: aquele homem ou aquela mulher
  alternative: aquela pessoa
  rationale: O hebraico nomeia explicitamente homem e mulher; a tradução conserva essa precisão em vez de neutralizá-la.
- issue: Local judicial nos portões
  choice: até os portões da sua cidade
  alternative: até o lugar público de julgamento
  rationale: A tradução mantém a imagem histórica dos portões, sem substituí-la por uma interpretação funcional, e esclarece seu sentido cultural em nota.
- issue: Resultado da pena
  choice: e eles morrerão
  alternative: até que morram
  rationale: A coordenação hebraica é preservada, evitando transformar explicitamente o resultado em finalidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição “o homem ou a mulher” foi mantida entre travessões por refletir a ênfase jurídica do hebraico. O tratamento por “você” acompanha o singular hebraico e favorece legibilidade ampla.
