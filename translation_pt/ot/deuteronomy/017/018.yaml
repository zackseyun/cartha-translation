base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: pt
  text: Quando ele se assentar no trono do seu reino, escreverá para si, em um livro, uma cópia desta lei, de diante dos sacerdotes levitas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de diante dos sacerdotes levitas”. A expressão provavelmente se refere a um exemplar mantido diante deles ou sob sua guarda; também pode ser entendida como escrita na presença deles ou sob sua supervisão.
    reason: Preserva a formulação hebraica e sua ambiguidade, esclarecendo sem impor como texto principal a interpretação de um exemplar sacerdotal.
  - marker: b
    text: 'Hebraico: “os sacerdotes, os levitas”; tradicionalmente, “os sacerdotes levitas”.'
    reason: Registra a forma appositiva do hebraico e a alternativa mais formalmente literal.
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: Quando se assentar
  rationale: A construção introduz a circunstância temporal da prescrição. “Quando se assentar” é natural em português e pode indicar tanto tomar assento como passar a exercer o governo, sem explicitar além do hebraico.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: no trono do seu reino
  rationale: Preserva a imagem concreta do trono e a relação genitiva expressa no hebraico, sem condensá-la em “trono real”.
- source_word: וְכָתַב לוֹ
  choice: escreverá para si
  rationale: O verbo dá continuidade à prescrição legal, e לּוֹ indica que o rei deve preparar a cópia para seu próprio uso.
- source_word: מִשְׁנֵה הַתּוֹרָה הַזֹּאת
  choice: uma cópia desta lei
  rationale: מִשְׁנֵה designa aqui uma cópia ou duplicata; תּוֹרָה, no contexto jurídico imediato, é adequadamente traduzida por “lei”.
- source_word: עַל סֵפֶר
  choice: num livro
  rationale: סֵפֶר pode designar livro, rolo ou documento escrito. “Num livro” mantém a formulação tradicional e é imediatamente compreensível, sem exigir que o suporte material seja especificado.
- source_word: מִלִּפְנֵי
  choice: a partir do exemplar que está diante de
  rationale: A expressão significa literalmente “de diante de”. No contexto, aponta provavelmente para o texto-modelo mantido diante dos sacerdotes ou sob sua guarda; a tradução torna essa relação inteligível, enquanto a nota preserva a formulação literal e outra leitura possível.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  rationale: Expressa de modo natural em português a relação entre os dois substantivos; a segmentação formal “os sacerdotes, os levitas” é registrada em nota.
theological_decisions:
- issue: Alcance de תּוֹרָה no contexto da lei referente ao rei
  choice: desta lei
  alternative: desta instrução; desta Torá
  rationale: “Lei” corresponde ao contexto jurídico e pactual imediato sem afirmar mais do que o versículo acerca da extensão canônica do documento.
- issue: Relação entre a cópia do rei e o texto diante dos sacerdotes
  choice: a partir do exemplar que está diante dos sacerdotes
  alternative: de diante dos sacerdotes; na presença dos sacerdotes
  rationale: A leitura escolhida comunica o sentido contextual provável de um exemplar autorizado associado à custódia sacerdotal, mas a nota mantém visíveis tanto a expressão hebraica literal como a possibilidade de referência à presença ou supervisão dos sacerdotes.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe jurídica clara. “Escreverá” comunica a obrigação no contexto legal sem recorrer ao mais pesado “deverá escrever”. A redação mantém a imagem do trono e evita terminologia confessional.
