source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: pt
  text: Com base no depoimento de duas testemunhas ou de três testemunhas[a], aquele que tiver de morrer[b] será executado; não será executado com base no depoimento de uma só testemunha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela boca de duas testemunhas ou de três testemunhas”. No hebraico, essa expressão idiomática se refere ao depoimento ou à prova apresentados em juízo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “aquele que está sujeito à morte”, isto é, a pessoa passível de pena capital.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: com base no depoimento de
  rationale: A expressão significa literalmente “pela boca de”, mas funciona aqui como idioma jurídico para testemunho ou prova. “Com base no depoimento de” comunica naturalmente tanto o fundamento probatório quanto o contexto legal.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: duas testemunhas ou de três testemunhas
  rationale: Mantém a repetição de “testemunhas” presente no hebraico e preserva o estilo formal da disposição legal.
- source_word: יוּמַת
  choice: será executado
  rationale: A forma causativa passiva de מות indica que a pessoa será levada à morte, não apenas que morrerá. “Será executado” torna explícito o sentido judicial do contexto.
- source_word: הַמֵּת
  choice: aquele que tiver de morrer
  rationale: A expressão participial é elíptica e se refere à pessoa passível de pena capital, não a alguém já morto. A formulação conserva parte da tensão e da concisão do hebraico sem antecipar excessivamente a conclusão jurídica.
- source_word: לֹא יוּמַת
  choice: não será executado
  rationale: Repete o mesmo verbo da primeira oração e expressa a proibição legal de executar alguém com prova insuficiente.
- source_word: עֵד אֶחָד
  choice: uma só testemunha
  rationale: “Uma só” realça naturalmente em português a insuficiência do testemunho único e mantém o contraste com duas ou três testemunhas.
theological_decisions:
- issue: Referente e força de הַמֵּת no contexto de uma lei sobre pena capital
  choice: 'A expressão se refere à pessoa passível de execução: “aquele que tiver de morrer”.'
  alternative: “o condenado” ou, de modo estritamente lexical mas contextualmente inadequado, “o morto”
  rationale: O versículo estabelece o padrão probatório necessário para aplicar a pena de morte. “O morto” não se ajusta ao contexto, enquanto “o condenado” introduziria de maneira mais explícita do que o hebraico uma sentença já proferida.
translation_notes:
  register: Português moderno, claro e digno, com registro jurídico acessível. A repetição de “testemunhas” reflete a formulação legal do hebraico; “será executado” evita que o verbo seja entendido como simples morte natural.
