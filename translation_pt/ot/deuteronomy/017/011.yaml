  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: pt
  text: Conforme a instrução que eles lhe derem[a] e conforme a sentença que lhe comunicarem, você deverá agir. Não se desvie da palavra que eles lhe declararem[b], nem para a direita nem para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a lei” ou “o ensino” (hebraico torah).
    reason: lexical_alternative
  - marker: b
    text: Ou “da questão” ou “da decisão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: Conforme
  rationale: A expressão idiomática significa “de acordo com” ou “em conformidade com”; “conforme” comunica de modo natural a obrigação de seguir a decisão.
- source_word: הַתּוֹרָה
  choice: a instrução
  rationale: Torah pode significar instrução, ensino ou lei. Neste contexto judicial, “instrução” preserva a amplitude do termo sem o restringir necessariamente a uma lei codificada.
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: que eles lhe derem
  rationale: O hifil de ירה significa instruir ou orientar. Com o substantivo “instrução”, “derem” evita repetição e forma uma expressão natural em português.
- source_word: הַמִּשְׁפָּט
  choice: a sentença
  rationale: Neste contexto, mishpat designa uma decisão judicial. “Sentença” explicita adequadamente o caráter jurídico sem ampliar o alcance da autoridade.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: que lhe comunicarem
  rationale: O verbo comum “dizer” aqui se refere à transmissão da sentença; “comunicarem” é natural e mantém o registro jurídico.
- source_word: תַּעֲשֶׂה
  choice: você deverá agir
  rationale: O imperfeito tem força de obrigação. “Deverá agir” preserva o tom prescritivo e retoma tanto a instrução quanto a sentença.
- source_word: לֹא תָסוּר
  choice: Não se desvie
  rationale: סור significa afastar-se ou desviar-se. “Não se desvie” combina naturalmente com a imagem direcional que encerra o versículo.
- source_word: הַדָּבָר
  choice: da palavra
  rationale: Davar pode significar palavra, assunto ou decisão. “Palavra” preserva a expressão singular e sua solenidade, enquanto o contexto indica tratar-se do pronunciamento judicial.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: que eles lhe declararem
  rationale: O hifil de נגד significa declarar, anunciar ou tornar conhecido. “Declararem” corresponde ao contexto formal e distingue este verbo do anterior.
- source_word: יָמִין וּשְׂמֹאל
  choice: nem para a direita nem para a esquerda
  rationale: A expressão indica não se desviar em direção alguma. A construção correlativa “nem... nem...” é idiomática em português após uma proibição.
theological_decisions:
- issue: Alcance da obediência à autoridade sacerdotal e judicial
  choice: Apresentar como obrigatória a instrução e a sentença proferidas no caso judicial em questão.
  alternative: Interpretar o versículo como afirmação de autoridade religiosa absoluta ou infalível de instituições posteriores.
  rationale: O contexto é o processo judicial da aliança de Israel. A tradução mantém a força da ordem sem introduzir conclusões eclesiológicas que o hebraico não enuncia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna explícito o singular hebraico sem arcaísmo; “sentença” e “declararem” mantêm o registro judicial. Todos os marcadores de nota aparecem no texto.
