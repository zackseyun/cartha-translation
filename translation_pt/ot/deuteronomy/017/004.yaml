  to: 'e isso lhe for comunicado, e você ouvir falar disso, investigue cuidadosamente. E eis que o fato é verdadeiro e confirmado: essa abominação foi cometida em Israel,'
  rationale: A revisão conserva a forma casuística exigida pelo contexto (“lhe for comunicado ... investigue”), mas restaura a progressão da frase hebraica após a investigação. “E eis que” representa o marcador discursivo וְהִנֵּה, e “o fato é verdadeiro e confirmado” torna explícito o sujeito de אֱמֶת נָכוֹן הַדָּבָר sem perder a dupla confirmação. A vírgula final é mantida, pois a instrução judicial continua no versículo seguinte.
