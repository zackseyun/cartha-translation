  source_fidelity: 'A revisão é necessária porque a versão proposta altera a progressão do hebraico: transforma a constatação introduzida por וְהִנֵּה em uma nova condição com “Se” e substitui a afirmação de confirmação por construções no subjuntivo. O texto hebraico apresenta a informação recebida, a investigação diligente e a constatação de que o fato é verdadeiro e confirmado.'
  naturalness: “Ficar sabendo” é compreensível, mas é mais coloquial que o registro jurídico-digno do contexto. “Ouvir falar disso” é natural e mantém o sentido de tomar conhecimento. A pontuação abaixo preserva a frase aberta para a continuação da determinação legal no versículo seguinte.
  terminology: “Abominação” é uma boa e consistente tradução de תּוֹעֵבָה. “Comunicado” evita a especificação indevida de uma denúncia formal em “denunciado”, embora o contexto possa envolver uma acusação. “Verdadeiro e confirmado” preserva os dois elementos da fórmula אֱמֶת נָכוֹן הַדָּבָר.
