  text: וְ/הֻֽגַּד לְ/ךָ֖ וְ/שָׁמָ֑עְתָּ וְ/דָרַשְׁתָּ֣ הֵיטֵ֔ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: pt
  text: 'e isso lhe for comunicado, e você ouvir falar disso, investigue cuidadosamente. E eis que o fato é verdadeiro e confirmado: essa abominação foi cometida em Israel,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: e isso lhe for denunciado
  rationale: O hofal de נגד apresenta a informação como levada passivamente ao conhecimento do destinatário. No contexto judicial, “denunciado” comunica uma acusação formal sem tornar explícito quem a apresenta.
- source_word: וְשָׁמָעְתָּ
  choice: e você ficar sabendo
  rationale: שׁמע significa literalmente “ouvir”, mas aqui se refere a tomar conhecimento da denúncia. “Ficar sabendo” é natural em português e mantém a ligação com a oração anterior.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: investigue cuidadosamente
  rationale: Em contexto judicial, דרש indica averiguar ou investigar, e הֵיטֵב intensifica a diligência exigida.
- source_word: וְהִנֵּה
  choice: Se
  rationale: No encadeamento condicional do contexto, הִנֵּה introduz o resultado constatado pela investigação. “Se” expressa naturalmente em português a condição de que a denúncia seja confirmada, sem acrescentar certeza antes da averiguação.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: for verdade e estiver confirmado
  rationale: 'A fórmula judicial emprega dois termos complementares: אֱמֶת indica veracidade, e נָכוֹן, firme confirmação. A tradução conserva ambos sem a rigidez de “verdadeiro, estabelecido o fato”.'
- source_word: נֶעֶשְׂתָה
  choice: foi cometida
  rationale: O nifal de עשה apresenta o ato como realizado. Com um delito ou ato condenável, “cometida” é idiomático e preserva a voz passiva.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: essa abominação
  rationale: “Abominação” mantém a forte avaliação moral e pactual de תּוֹעֵבָה em Deuteronômio; “essa” retoma o ato descrito no contexto anterior.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: A expressão situa o ato dentro da comunidade de Israel e é direta e idiomática em português.
theological_decisions:
- issue: Fórmula judicial אֱמֶת נָכוֹן הַדָּבָר
  choice: Se for verdade e estiver confirmado
  alternative: se o fato for verdadeiro e comprovado
  rationale: A formulação conserva a dupla ênfase na veracidade e na confirmação judicial, sem fundir os termos nem introduzir interpretação doutrinária.
- issue: Força moral de תּוֹעֵבָה
  choice: abominação
  alternative: ato detestável
  rationale: “Abominação” preserva a gravidade do termo no discurso deuteronômico, sem suavizar a avaliação expressa pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sequência verbal foi vertida como condição e ordem no contexto legal. O versículo permanece aberto por vírgula porque a determinação judicial continua no versículo seguinte.
