- from: Não sacrifique a Yahweh, seu Deus, um boi ou uma ovelha[a] que tenha algum defeito, qualquer coisa ruim, pois isso é uma abominação para Yahweh, seu Deus.
  to: Não sacrifique a Yahweh, seu Deus, um boi ou uma ovelha[a] que tenha algum defeito ou qualquer outra coisa má, pois isso é uma abominação para Yahweh, seu Deus.
  rationale: A revisão limita-se a tornar natural e clara, em português, a expressão ampla que segue «defeito». Não altera o sentido sacrificial, o nome divino, a referência ao animal do rebanho nem a força de «abominação».
