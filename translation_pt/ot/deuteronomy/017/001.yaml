    text: O termo hebraico שֶׂה é mais amplo e pode se referir a uma ovelha ou a uma cabra.
    reason: alternativa lexical
  revision_rationale: A revisão limita-se a tornar natural e clara, em português, a expressão ampla que segue «defeito». Não altera o sentido sacrificial, o nome divino, a referência ao animal do rebanho nem a força de «abominação».
