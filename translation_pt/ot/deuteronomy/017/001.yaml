base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: pt
  text: Não sacrifique a Yahweh, seu Deus, um boi ou uma ovelha[a] que tenha algum defeito ou qualquer outra coisa má, pois isso é uma abominação para Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico שֶׂה é mais amplo e pode se referir a uma ovelha ou a uma cabra.
    reason: alternativa lexical
lexical_decisions:
- source_word: תִזְבַּח
  choice: sacrifique
  rationale: No contexto cultual, זבח indica oferecer um animal em sacrifício, não apenas abatê-lo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יְהוָה e preserva sua função como nome pessoal da aliança.
- source_word: שׁוֹר
  choice: boi
  rationale: Termo singular corrente para gado bovino, sem especificar além do que o hebraico exige.
- source_word: שֶׂה
  choice: ovelha
  rationale: É uma forma natural e tradicional em português; como o hebraico também pode designar uma cabra, essa extensão lexical é registrada em nota.
- source_word: מוּם
  choice: defeito
  rationale: Expressa com clareza uma imperfeição física que desqualificava o animal para o sacrifício.
- source_word: כֹּל דָּבָר רָע
  choice: qualquer coisa ruim
  rationale: Mantém a formulação ampla do hebraico e sua relação apositiva com 'defeito', sem restringi-la interpretativamente a 'defeito grave'.
- source_word: תוֹעֲבַת
  choice: uma abominação
  rationale: Preserva a força do termo hebraico para algo detestável perante Deus e seu uso bíblico consagrado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; a transliteração 'Yahweh' o preserva sem substituí-lo por um título.
- issue: Alcance de כֹּל דָּבָר רָע
  choice: qualquer coisa ruim
  alternative: qualquer defeito grave
  rationale: A tradução conserva a amplitude e a aspereza da expressão hebraica, em vez de resolver seu sentido exclusivamente como uma qualificação técnica do defeito.
translation_notes:
  register: Português moderno, claro e digno, com imperativo na forma de tratamento corrente no Brasil. A construção 'qualquer coisa ruim' é deliberadamente próxima do hebraico, embora menos idiomática, para preservar sua amplitude. O marcador da nota foi colocado após 'ovelha', o termo ao qual a observação lexical se refere.
