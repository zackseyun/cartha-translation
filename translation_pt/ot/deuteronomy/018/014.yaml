  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: pt
  text: Pois estas nações, que você está desapossando[a], dão ouvidos aos que interpretam presságios[b] e aos adivinhos; quanto a você, porém, Yahweh, seu Deus, não lhe deu isso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das quais você está tomando posse”. O verbo hebraico pode abranger tanto tomar posse quanto desapossar os habitantes anteriores.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduz um termo para pessoas que procuram orientação mediante a interpretação de sinais, presságios ou augúrios.
    reason: cultural_note
  - marker: c
    text: 'Hebraico, literalmente: “mas você, não assim Yahweh, seu Deus, lhe deu”. O objeto — “isso”, isto é, tais práticas — fica implícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação das proibições anteriores e reproduz naturalmente o valor causal-explicativo da conjunção.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: estas nações
  rationale: Designa os povos não israelitas da terra; “nações” é corrente e adequado ao contexto.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אֹתָם
  choice: das quais você está tomando posse
  rationale: ירשׁ pode indicar tomar posse de uma terra e, por implicação, desapossar seus habitantes. A formulação portuguesa conserva o foco da construção hebraica sem eliminar essa amplitude.
- source_word: אֶל מְעֹנְנִים
  choice: aos que interpretam presságios
  rationale: מְעֹנְנִים designa praticantes de leitura de sinais ou augúrios. A expressão é clara em português moderno e evita restringir o termo a uma técnica específica.
- source_word: וְאֶל קֹסְמִים
  choice: e aos adivinhos
  rationale: קֹסְמִים refere-se aos que praticam adivinhação; “adivinhos” é a correspondência direta e natural.
- source_word: יִשְׁמָעוּ
  choice: dão ouvidos
  rationale: Preserva o sentido básico de ouvir, incluindo aqui a ideia contextual de atender ou seguir esses praticantes.
- source_word: וְאַתָּה לֹא כֵן
  choice: quanto a você, porém, ... não
  rationale: Mantém o contraste enfático e a construção elíptica do hebraico, completada pela oração seguinte.
- source_word: נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus, não lhe concedeu isso
  rationale: “Concedeu” conserva o núcleo de נתן (“dar”) e funciona de modo natural com o objeto implícito “isso”, sem transformar a frase explicitamente em uma fórmula de permissão.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Reproduz o nome pessoal divino presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Objeto implícito de נָתַן
  choice: não lhe concedeu isso
  alternative: não permitiu que você fizesse isso; não lhe deu tais pessoas para ouvir
  rationale: O hebraico não declara o objeto. “Isso” remete às práticas mencionadas e mantém parte da concisão e da ambiguidade originais, ao passo que “permitiu que fizesse” explicitaria mais do que o texto diz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você/seu/lhe” reflete o destinatário israelita singular do hebraico. “Dão ouvidos” mantém o campo semântico de ouvir e soa natural; “interpretam presságios” esclarece uma prática antiga sem recorrer a vocabulário excessivamente técnico.
