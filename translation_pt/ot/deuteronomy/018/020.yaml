  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: pt
  text: Mas o profeta que, por presunção[a], falar em meu nome uma palavra que eu não lhe ordenei falar, ou que falar em nome de outros deuses — esse profeta morrerá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “agir com arrogância” ou “atrever-se arrogantemente”. O verbo hebraico indica presunção deliberada e transgressão arrogante dos limites.
    reason: lexical_alternative
  - marker: b
    text: Ou “deverá morrer” ou “será morto”. O hebraico apresenta de forma sucinta a sentença legal de morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Introduz o forte contraste entre o profeta legítimo mencionado antes e aquele que reivindica falsamente autoridade divina.
- source_word: יָזִיד
  choice: por presunção
  rationale: O hifil de זיד expressa ação deliberadamente presunçosa, uma transgressão arrogante dos limites; a locução é clara e conserva a força moral e jurídica.
- source_word: לְדַבֵּר דָּבָר
  choice: falar [...] uma palavra
  rationale: Conserva a construção verbal-nominal hebraica sem deixar o português excessivamente artificial.
- source_word: בִּשְׁמִי
  choice: em meu nome
  rationale: Expressa a alegação de autoridade e representação divina e mantém a primeira pessoa do discurso direto.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: uma palavra que eu não lhe ordenei falar
  rationale: Mantém tanto a oração relativa como a linguagem explícita de ordem divina.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: ou que falar
  rationale: Embora ו possa ser aditivo, o contexto apresenta uma segunda infração alternativa; “ou” comunica naturalmente que qualquer uma delas incorre na pena.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: em nome de outros deuses
  rationale: Tradução direta e idiomática da reivindicação de autoridade de outras divindades.
- source_word: וּמֵת
  choice: morrerá
  rationale: Reproduz de forma breve a fórmula jurídica hebraica sem acrescentar explicitamente um agente executor que a forma verbal não declara.
- source_word: הַנָּבִיא הַהוּא
  choice: esse profeta
  rationale: O demonstrativo retoma e identifica enfaticamente o profeta descrito na oração anterior.
theological_decisions:
- issue: Referência ao nome divino no discurso em primeira pessoa
  choice: Manter “em meu nome”
  alternative: Expandir para “em nome do SENHOR”
  rationale: O hebraico contém discurso divino direto na primeira pessoa; substituir o pronome pelo nome divino acrescentaria uma formulação ausente do versículo.
- issue: Sentido da fórmula penal וּמֵת
  choice: “morrerá”
  alternative: “deverá morrer” ou “será morto”
  rationale: A forma hebraica declara de modo sucinto a pena de morte, mas não explicita aqui seu agente ou mecanismo. A tradução principal mantém essa concisão, e a nota registra as possibilidades jurídicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para ligar “por presunção” ao ato de falar, evitando a forma menos natural “presunçosamente falar”. O travessão preserva a ênfase conclusiva de “esse profeta”.
