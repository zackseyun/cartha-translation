revisions:
- from: E acontecerá que o homem que não ouvir as minhas palavras, que ele falar em meu nome, eu mesmo lhe pedirei contas.[a]
  to: E acontecerá que eu mesmo pedirei contas ao homem que não ouvir as minhas palavras que o profeta falar em meu nome.[a]
  rationale: A revisão torna explícito que quem fala em nome de Deus é o profeta, conserva «o homem» para o singular masculino representativo, preserva a ênfase de אָנֹכִי em «eu mesmo» e mantém a advertência judicial sem definir a natureza da sanção. A nota foi corrigida para não atribuir ao hebraico um objeto direto expresso.
