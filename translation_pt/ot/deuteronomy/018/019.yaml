  text: וְ/הָיָ֗ה הָ/אִישׁ֙ אֲשֶׁ֤ר לֹֽא יִשְׁמַע֙ אֶל דְּבָרַ֔/י אֲשֶׁ֥ר יְדַבֵּ֖ר בִּ/שְׁמִ֑/י אָנֹכִ֖י אֶדְרֹ֥שׁ מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: pt
  text: E acontecerá que eu mesmo pedirei contas ao homem que não ouvir as minhas palavras que o profeta falar em meu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu mesmo exigirei isso dele”. O hebraico diz mais literalmente: “eu requererei dele”; a expressão indica que Deus responsabilizará quem não der ouvidos às palavras do profeta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Mantém a fórmula hebraica que introduz a consequência futura, com naturalidade e solenidade em português.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Reproduz o substantivo hebraico masculino singular, usado aqui com valor representativo.
- source_word: לֹא יִשְׁמַע אֶל
  choice: não ouvir
  rationale: Preserva a ideia de escutar, incluindo no contexto a implicação de dar ouvidos, sem explicitar demais como 'não obedecer'.
- source_word: דְּבָרַי
  choice: as minhas palavras
  rationale: Corresponde diretamente ao plural hebraico com sufixo de primeira pessoa.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: que ele falar
  rationale: O futuro do subjuntivo é natural na construção portuguesa e mantém a referência às palavras que o profeta proferirá.
- source_word: בִּשְׁמִי
  choice: em meu nome
  rationale: Conserva a expressão hebraica e sua ideia de representação e autoridade divinas.
- source_word: אָנֹכִי
  choice: eu mesmo
  rationale: Expressa a ênfase conferida pelo pronome independente hebraico.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: lhe pedirei contas
  rationale: Verte de modo idiomático o sentido judicial de exigir responsabilidade, sem definir a forma específica da punição.
theological_decisions:
- issue: Natureza da resposta divina à recusa das palavras do profeta
  choice: eu mesmo lhe pedirei contas
  alternative: eu mesmo exigirei isso dele
  rationale: A formulação comunica responsabilização e juízo divinos, mas não acrescenta ao texto uma modalidade específica de castigo.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do hebraico sem perder a naturalidade. A repetição de “que” conserva as relações do original, e “lhe pedirei contas” torna inteligível a expressão judicial hebraica.
