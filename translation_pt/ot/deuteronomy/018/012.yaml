base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: pt
  text: Pois todo aquele que pratica essas coisas é uma abominação para Yahweh; e, por causa dessas abominações, Yahweh, seu Deus, está expulsando essas nações diante de você[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está tirando dessas nações a posse da terra”. O verbo hebraico pode destacar tanto a expulsão dessas nações como o fato de elas perderem a posse da terra.'
    reason: alternativa lexical
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão das proibições anteriores e mantém com naturalidade a força explicativa da conjunção.
- source_word: תוֹעֲבַת יְהוָה
  choice: uma abominação para Yahweh
  rationale: Preserva a construção nominal e a forte ideia de algo moral e cultualmente repulsivo aos olhos de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: todo aquele que pratica essas coisas
  rationale: Expressa o alcance universal de כָּל com o particípio; “pratica” comunica bem a realização das ações mencionadas no contexto.
- source_word: וּבִגְלַל
  choice: e, por causa de
  rationale: Indica claramente que as abominações são a causa do juízo descrito a seguir.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: essas abominações
  rationale: Mantém a continuidade lexical com תוֹעֲבַת e remete às práticas proibidas nos versículos anteriores.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Conserva o tratamento direto a Israel na segunda pessoa do singular, em português moderno e amplamente compreensível.
- source_word: מוֹרִישׁ אֹתָם
  choice: está expulsando essas nações
  rationale: O hiphil de ירש pode descrever tanto expulsar povos como fazê-los perder a posse da terra. O referente pronominal foi explicitado pelo contexto para maior clareza.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: Conserva de modo inteligível a imagem hebraica de remoção da presença e do caminho de Israel.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto contém o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Força de תוֹעֵבַת aplicada à pessoa que pratica esses atos
  choice: é uma abominação para Yahweh
  alternative: é detestável para Yahweh
  rationale: A tradução conserva a forma nominal e a intensidade do hebraico, sem reduzir a afirmação apenas a uma avaliação branda das práticas.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla legibilidade brasileira. Mantém a segunda pessoa singular por meio de “você/seu”, preserva a repetição de “abominação/abominações” e explicita “essas nações” como referente contextual de “as”.
