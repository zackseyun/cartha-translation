  text: וְ/שֵׁרֵ֕ת בְּ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו כְּ/כָל אֶחָי/ו֙ הַ/לְוִיִּ֔ם הָ/עֹמְדִ֥ים שָׁ֖ם לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: pt
  text: então poderá ministrar em nome de Yahweh, seu Deus,[a] como todos os seus irmãos levitas[b] que estão ali diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “então ministrará em nome de Yahweh, seu Deus”. O imperfeito hebraico pode expressar permissão ou ter força futura mais direta neste contexto legal.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus irmãos, os levitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: então poderá ministrar
  rationale: O piel de שׁרת indica serviço ministerial, especialmente no culto. No contexto legal, o imperfeito admite sentido permissivo; “então” liga naturalmente esta consequência à condição do versículo anterior.
- source_word: בְּשֵׁם
  choice: em nome de
  rationale: Expressa atuação sob a autoridade do nome ou mediante sua invocação; “em nome de” é a forma idiomática natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Reproduz diretamente a construção possessiva hebraica.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: como todos os seus irmãos levitas
  rationale: Preserva a comparação, o termo masculino de parentesco e a identificação explícita dos irmãos como levitas, com sintaxe natural em português.
- source_word: הָעֹמְדִים שָׁם
  choice: que estão ali
  rationale: O particípio de עמד significa literalmente “os que estão”; em português, “que estão ali” evita a formulação pouco natural “que ficam de pé ali” sem converter implicitamente o verbo em “servem”.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Equivalente formal e natural da expressão hebraica para estar na presença de Deus, especialmente em contexto de culto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Força modal do imperfeito וְשֵׁרֵת no contexto legal
  choice: poderá ministrar
  alternative: ministrará; ministre
  rationale: A provisão dos versículos anteriores apresenta uma situação em que o levita recebe permissão de participar. A forma hebraica também pode ter força futura mais direta, por isso a alternativa é registrada em nota.
- issue: Termo de parentesco אֶחָיו
  choice: seus irmãos levitas
  alternative: seus companheiros levitas
  rationale: A tradução mantém o masculino explícito do hebraico, enquanto “levitas” esclarece imediatamente a relação em vista.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ministrar” conserva o caráter cultual do serviço levítico. A ordem da frase foi ajustada com pontuação natural, e a ambiguidade modal do hebraico foi preservada por meio de nota.
