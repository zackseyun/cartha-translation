  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: pt
  text: 'E Yahweh me disse: “Eles falaram bem”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Fizeram bem no que disseram”.'
    reason: A nota preserva a forma mais literal da construção הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ, enquanto o texto principal emprega português idiomático.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol de אמר dá continuidade à sequência narrativa; “E ... disse” preserva esse fluxo de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלָי
  choice: me disse
  rationale: A preposição אֶל com o sufixo da primeira pessoa significa “a mim”; em português corrente, o pronome átono em “me disse” expressa isso naturalmente.
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: Eles falaram bem
  rationale: A construção avalia favoravelmente aquilo que o povo disse. Esta formulação idiomática preserva o sentido sem reproduzir de forma artificial a sintaxe hebraica.
- source_word: דִּבֵּרוּ
  choice: falaram
  rationale: O piel perfeito de דבר indica a fala já proferida; “falaram” é direto e natural no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em forma transliterada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e o discurso direto foram mantidos; a expressão hebraica foi vertida idiomaticamente, com a forma literal registrada em nota.
