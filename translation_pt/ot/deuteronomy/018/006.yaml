id: DEU.18.6
reference: Deuteronomy 18:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: pt
  text: E, se o levita vier de uma das suas cidades, de qualquer parte de Israel[a], onde estiver residindo, e for, com todo o desejo da sua alma[b], ao lugar que Yahweh escolher,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de um dos seus portões, de todo Israel”. Aqui, “portões” designa, por metonímia, as cidades ou comunidades; a expressão indica qualquer parte de Israel.
    reason: cultural_note
  - marker: b
    text: 'Ou: “com todo o anseio da sua alma” ou “com todo o desejo do seu coração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Mantém tanto a ligação com a legislação anterior quanto a força condicional do caso apresentado.
- source_word: יָבֹא הַלֵּוִי
  choice: o levita vier
  rationale: O imperfeito qal funciona naturalmente como condição eventual; o artigo hebraico é preservado em sentido genérico.
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: de uma das suas cidades
  rationale: Embora שׁער signifique literalmente “portão”, aqui o termo designa metonimicamente a cidade ou comunidade associada a ele; “cidades” comunica o referente com clareza.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: de qualquer parte de Israel
  rationale: 'Expressa de modo natural o sentido distributivo: o levita pode proceder de qualquer localidade dentro de Israel.'
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: onde estiver residindo
  rationale: גור indica residência sem exigir aqui a classificação mais forte de “estrangeiro residente”; a forma verbal se ajusta ao período condicional.
- source_word: וּבָא
  choice: e for
  rationale: Preserva o segundo movimento verbal do hebraico — partir da cidade e dirigir-se ao lugar escolhido — sem a repetição pouco natural de “vier” em português.
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: com todo o desejo da sua alma
  rationale: Mantém a intensidade de כּל, a ideia de desejo ou anseio em אַוה e o termo נפש, sem reduzir a expressão a uma disposição apenas intelectual.
- source_word: אֶל הַמָּקוֹם
  choice: ao lugar
  rationale: Conserva a formulação não explicitada do hebraico, sem inserir “santuário” ou “lugar de culto” no texto principal.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: que Yahweh escolher
  rationale: O futuro do subjuntivo é idiomático na oração relativa ligada a uma condição futura; o nome divino é transliterado como Yahweh.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Identificação de הַמָּקוֹם
  choice: o lugar
  alternative: o santuário; o lugar de culto
  rationale: Embora o contexto aponte para o local central de culto, o hebraico diz apenas “o lugar”; a tradução mantém essa formulação e não torna explícito o que permanece implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva o caráter jurídico condicional do versículo e termina com vírgula porque a oração continua no versículo seguinte.
