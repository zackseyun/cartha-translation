base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: pt
  text: 'Esta será a porção devida aos sacerdotes, da parte do povo, isto é, dos que oferecem um sacrifício: seja boi, seja ovelha, quem o oferecer dará ao sacerdote a espádua[a], as bochechas[b] e o estômago[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a perna dianteira”. A palavra hebraica significa literalmente “braço” e, aqui, indica a parte dianteira do animal.
    reason: lexical_alternative
  - marker: b
    text: Ou “os maxilares”. O hebraico está na forma dual, isto é, “as duas bochechas”.
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, “o bucho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: direito
  rationale: Neste contexto legal e cultual, indica a porção prescrita que cabe aos sacerdotes, não um julgamento abstrato.
- source_word: הַכֹּהֲנִים
  choice: dos sacerdotes
  rationale: Conserva o plural e expressa naturalmente a relação com a porção devida.
- source_word: מֵאֵת הָעָם מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: sobre o que vem do povo, daqueles que oferecem sacrifícios
  rationale: Mantém a relação entre o povo e o grupo específico dos ofertantes, evitando em português a repetição pouco natural 'sacrificam sacrifício'.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: seja boi, seja ovelha
  rationale: Reproduz a construção alternativa do hebraico com vocabulário comum e adequado ao contexto sacrificial.
- source_word: וְנָתַן
  choice: o ofertante dará
  rationale: O singular hebraico tem sentido distributivo. O substantivo explícito evita o masculino genérico pronominal e esclarece que quem sacrifica entrega a porção.
- source_word: הַזְּרֹעַ
  choice: a espádua
  rationale: Embora o sentido básico seja 'braço', na anatomia do animal designa a porção do membro dianteiro ou ombro; 'espádua' é preciso no contexto.
- source_word: הַלְּחָיַיִם
  choice: as duas faces
  rationale: Preserva explicitamente o dual hebraico; pode referir-se às faces ou aos maxilares do animal.
- source_word: הַקֵּבָה
  choice: o estômago
  rationale: É uma tradução moderna e clara do órgão animal, sem recorrer ao tradicionalismo menos corrente 'bucho' nem a especificação anatômica excessiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação legal clara. 'Espádua' é menos frequente na fala cotidiana, mas oferece precisão anatômica; a nota apresenta a alternativa mais transparente. A repetição etimológica hebraica em זֹבְחֵי הַזֶּבַח foi suavizada para naturalidade, sem perda do referente sacrificial.
