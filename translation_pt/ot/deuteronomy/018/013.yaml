  text: תָּמִ֣ים תִּֽהְיֶ֔ה עִ֖ם יְהוָ֥ה אֱלֹהֶֽי/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/013.yaml
  text: You shall be blameless with Yahweh your God[a].
translation:
  language: pt
  text: Seja íntegro com Yahweh, seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irrepreensível”, “completo” ou “inteiramente dedicado” a Yahweh, seu Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: íntegro
  rationale: O termo abrange inteireza, integridade e ausência de defeito. No contraste imediato com adivinhação e práticas ocultas, “íntegro” comunica fidelidade moral e devoção não dividida sem sugerir perfeição sem pecado.
- source_word: תִּהְיֶה
  choice: seja
  rationale: O imperfeito qal de segunda pessoa masculina singular tem aqui força injuntiva. O presente do subjuntivo usado como exortação é natural e digno em português.
- source_word: עִם
  choice: com
  rationale: Reproduz diretamente a preposição e preserva sua nuance relacional, sem substituí-la pela interpretação mais específica “diante de”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: No contexto da aliança e em aposição a Yahweh, a forma se refere inequivocamente ao Deus de Israel no singular; o sufixo é de segunda pessoa masculina singular.
theological_decisions:
- issue: Sentido de תָּמִים na exortação da aliança
  choice: integridade e devoção inteira a Deus, sem implicar perfeição sem pecado
  alternative: “completo”, “irrepreensível” ou “de todo o coração” com Yahweh
  rationale: O contexto de Deuteronômio 18:9–14 contrapõe a fidelidade a Yahweh às práticas ocultas das nações. “Íntegro” mantém juntas as dimensões ética e relacional do termo, enquanto a nota preserva suas alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A forma singular de segunda pessoa acompanha o hebraico. “Yahweh” preserva o nome divino, e “íntegro” evita tanto uma formulação pouco idiomática quanto a ideia de impecabilidade absoluta.
