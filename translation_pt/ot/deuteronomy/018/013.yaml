  source_fidelity: 'A tradução reproduz adequadamente a exortação injuntiva singular e preserva a relação expressa por עִם: “Seja íntegro com Yahweh, seu Deus.” “Íntegro” comunica de modo apropriado o campo semântico de תָּמִים — inteireza, integridade e fidelidade — sem exigir a noção de perfeição sem pecado.'
