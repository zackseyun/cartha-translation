source:
  edition: WLC
  text: וְ/כִ֥י תֹאמַ֖ר בִּ/לְבָבֶ֑/ךָ אֵיכָה֙ נֵדַ֣ע אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: pt
  text: 'E, se você disser no seu coração: “Como saberemos qual é a palavra[a] que Yahweh não falou?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensagem” ou “questão”. O termo hebraico davar pode designar uma palavra, mensagem, assunto ou questão; neste contexto profético, “palavra” é a opção mais adequada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Mantém a ligação com o contexto anterior e o sentido condicional da construção hebraica.
- source_word: תֹאמַר בִּלְבָבֶךָ
  choice: você disser no seu coração
  rationale: Preserva a segunda pessoa do singular e a imagem hebraica do coração como sede do pensamento, sem reduzi-la a uma paráfrase como “pensar consigo mesmo”.
- source_word: אֵיכָה נֵדַע
  choice: Como saberemos
  rationale: Expressa naturalmente a pergunta deliberativa sobre o modo de reconhecer a origem da declaração.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: No contexto profético, דָּבָר designa adequadamente uma palavra ou mensagem proclamada; “palavra” preserva a formulação bíblica e a ligação verbal com “falou”.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: que ... não falou
  rationale: Mantém a oração relativa e a negação do hebraico, sem transformar a pergunta em uma formulação mais interpretativa sobre profecia falsa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal do Deus de Israel no texto e evita substituí-lo por um título.
- issue: Critério para reconhecer uma palavra não dita por Yahweh
  choice: Manter a pergunta aberta neste versículo
  alternative: Antecipar no texto o critério apresentado no versículo seguinte
  rationale: O versículo 21 formula a pergunta, enquanto a resposta vem no contexto subsequente; antecipá-la aqui apagaria a progressão do discurso.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e compreensão internacional. A expressão “no seu coração” conserva a imagem da fonte; “qual é a palavra” oferece uma sintaxe portuguesa natural sem eliminar a relação entre דָּבָר e o ato de falar. O marcador da nota foi colocado após “palavra”, termo ao qual a nota lexical se refere.
