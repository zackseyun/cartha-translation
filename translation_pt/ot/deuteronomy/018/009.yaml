id: DEU.18.9
reference: Deuteronomy 18:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: pt
  text: Quando você entrar na terra que Yahweh, seu Deus, lhe dá, não aprenda a praticar abominações como as daquelas nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a agir conforme as abominações daquelas nações». A preposição hebraica pode indicar comparação ou conformidade.'
    reason: alternativa lexical
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto, introduz a circunstância temporal em que a proibição passa a se aplicar, e não uma explicação causal.
- source_word: בָּא אֶל־הָאָרֶץ
  choice: entrar na terra
  rationale: A construção expressa o ingresso iminente de Israel na terra; «entrar» é natural em português e comunica diretamente o movimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz o substantivo com o sufixo possessivo masculino singular, dirigindo a ordem individualmente ao ouvinte representativo.
- source_word: נֹתֵן לָךְ
  choice: lhe dá
  rationale: O particípio apresenta a dádiva como ação vigente e certa. O presente idiomático em português preserva essa perspectiva sem exigir uma forma progressiva pouco natural.
- source_word: לֹא תִלְמַד
  choice: não aprenda
  rationale: O imperfeito negado tem força proibitiva. O imperativo negativo é claro e natural em português contemporâneo.
- source_word: לַעֲשׂוֹת
  choice: a praticar
  rationale: No contexto dos costumes religiosos enumerados em seguida, «praticar» expressa naturalmente o fazer habitual, sem limitar antecipadamente quais atos estão em vista.
- source_word: כְּתוֹעֲבֹת
  choice: abominações como as
  rationale: Preserva tanto a forte avaliação moral e cultual de תּוֹעֵבָה quanto a ideia comparativa ou conformativa da preposição כְּ.
- source_word: הַגּוֹיִם הָהֵם
  choice: daquelas nações
  rationale: Mantém o sentido coletivo de גּוֹיִם e a referência distal do demonstrativo הָהֵם.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. «Yahweh» o representa diretamente, sem substituí-lo por um título.
- issue: Força de תּוֹעֵבָה
  choice: abominações
  alternative: práticas detestáveis
  rationale: «Abominações» conserva a intensidade da condenação moral e religiosa e evita restringir o termo antes da enumeração nos versículos seguintes.
- issue: Relação expressa pela preposição כְּ
  choice: como as
  alternative: conforme as; segundo as
  rationale: A preposição pode marcar comparação ou conformidade. A tradução principal comunica comparação de modo natural, enquanto a nota registra a possibilidade conformativa.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por «você» para o singular hebraico. A ordem foi formulada de modo natural, sem perder a força proibitiva nem suavizar o termo «abominações».
