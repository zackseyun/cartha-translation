base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: pt
  text: Não se encontre entre vocês quem faça seu filho ou sua filha passar pelo fogo[a], quem pratique adivinhação, prediga o futuro[b], interprete presságios[c] ou pratique feitiçaria[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “queime seu filho ou sua filha no fogo” ou “ofereça seu filho ou sua filha no fogo”. O hebraico diz literalmente “faça seu filho ou sua filha passar pelo fogo”.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico é de sentido difícil; também pode ser traduzido por “observador dos tempos” (em versões mais antigas) ou “agoureiro”.
    reason: lexical_alternative
  - marker: c
    text: Ou “pratique agouros” ou “adivinhe por meio de sinais”.
    reason: lexical_alternative
  - marker: d
    text: Ou “pratique magia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: Não se encontre entre vocês
  rationale: O nifal imperfeito negado tem força proibitiva. “Entre vocês” expressa de modo natural o sentido comunitário de בְךָ.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: quem faça seu filho ou sua filha passar pelo fogo
  rationale: Mantém a expressão hebraica com o hifil de עבר e evita definir além do texto a forma exata do ritual proibido.
- source_word: קֹסֵם קְסָמִים
  choice: quem pratique adivinhação
  rationale: A construção com particípio e objeto cognato designa a prática de adivinhação; a formulação é clara e idiomática em português.
- source_word: מְעוֹנֵן
  choice: prediga o futuro
  rationale: O termo é lexicalmente difícil. Esta escolha comunica uma prática ocultista de prognóstico em linguagem atual sem a confundir por completo com a adivinhação mais ampla da expressão anterior.
- source_word: מְנַחֵשׁ
  choice: interprete presságios
  rationale: O verbo se relaciona à obtenção de indicações por sinais ou agouros; “interprete presságios” transmite esse provável sentido e o distingue dos termos vizinhos.
- source_word: מְכַשֵּׁף
  choice: pratique feitiçaria
  rationale: O particípio piel descreve quem se dedica às artes mágicas. A expressão é natural, digna e amplamente compreensível em português.
theological_decisions:
- issue: Natureza da proibição relativa a filhos e fogo
  choice: Conservar no texto principal a expressão “faça seu filho ou sua filha passar pelo fogo”.
  alternative: “queime seu filho ou sua filha no fogo” ou “ofereça seu filho ou sua filha no fogo”.
  rationale: O contexto condena um ritual pagão envolvendo filhos e fogo, mas esta formulação hebraica não explicita por si só todos os detalhes do ato. Preservar o idioma evita resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A sequência participial foi preservada por meio de orações coordenadas, e as incertezas lexicais relevantes foram registradas em notas.
