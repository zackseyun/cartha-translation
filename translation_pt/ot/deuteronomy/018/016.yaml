base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: pt
  text: 'conforme tudo o que você pediu ao SENHOR, seu Deus, em Horebe, no dia da assembleia, quando disse: “Que eu não continue ouvindo a voz do SENHOR, meu Deus, nem torne a ver este grande fogo, para que eu não morra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ מֵעִם
  choice: conforme tudo o que você pediu ao
  rationale: Reproduz a ideia de correspondência expressa por כְּכֹל e mantém o sentido de solicitar algo a alguém, em português natural.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o nome divino YHWH por SENHOR em versaletes.
- source_word: בְּיוֹם הַקָּהָל
  choice: no dia da assembleia
  rationale: Traduz הַקָּהָל de modo direto, preservando a referência ao povo reunido em Horebe.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: Que eu não continue ouvindo
  rationale: O verbo יסף com infinitivo indica não voltar a ou não continuar realizando a ação; esta formulação preserva essa amplitude no contexto.
- source_word: וְאֶת הָאֵשׁ הַגְּדֹלָה הַזֹּאת לֹא אֶרְאֶה עוֹד
  choice: nem torne a ver este grande fogo
  rationale: Traduz עוֹד idiomaticamente como repetição futura, sem perder a negação enfática do pedido.
- source_word: וְלֹא אָמוּת
  choice: para que eu não morra
  rationale: No encadeamento do discurso, a conjunção expressa a consequência temida; a formulação portuguesa torna clara essa relação sem acrescentar conteúdo doutrinário.
theological_decisions:
- issue: Representação do nome divino
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma tradicional é amplamente inteligível e conserva a distinção editorial mediante versaletes, sem impor uma vocalização do tetragrama.
- issue: Natureza do pedido feito em Horebe
  choice: Manter o temor de morrer como motivo declarado pelo povo
  alternative: Explicitar uma interpretação sobre mediação profética
  rationale: O versículo relata as palavras do povo; não se acrescenta aqui uma conclusão teológica além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” no singular conforme o hebraico. A ordem foi levemente ajustada para fluência, preservando a estrutura causal e o discurso direto.
