  text: חֵ֥לֶק כְּ/חֵ֖לֶק יֹאכֵ֑לוּ לְ/בַ֥ד מִמְכָּרָ֖י/ו עַל הָ/אָבֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/008.yaml
  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: pt
  text: Comerão porções iguais[a], além do que receberem da venda de seu patrimônio familiar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além do que receberem pela venda de bens da família”. O hebraico da oração final é difícil e pode referir-se, de modo mais geral, à renda ligada à sua casa ancestral.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: porções iguais
  rationale: A expressão idiomática hebraica, literalmente “porção como porção”, indica participação em igualdade de condições; “porções iguais” comunica isso com clareza em português.
- source_word: יֹאכֵלוּ
  choice: comerão
  rationale: Mantém o sentido concreto do verbo hebraico e a imagem das provisões sacerdotais consumidas pelos levitas.
- source_word: לְבַד
  choice: além de
  rationale: Introduz algo separado e adicional à porção igual, de modo natural em português.
- source_word: מִמְכָּרָיו
  choice: o que lhe vier da venda
  rationale: Pode designar vendas ou o produto delas. A formulação expressa a provável ideia de recursos provenientes de venda sem restringi-la indevidamente a dinheiro.
- source_word: עַל הָאָבוֹת
  choice: de seu patrimônio familiar
  rationale: A expressão é elíptica e literalmente relacionada aos “pais/antepassados”; no contexto, provavelmente aponta para bens ou direitos ligados à família ancestral.
theological_decisions:
- issue: Interpretação de מִמְכָּרָיו עַל הָאָבוֹת
  choice: Renda derivada da venda de patrimônio familiar, adicional à porção sacerdotal igual.
  alternative: O que ele recebe pela venda de bens da família; renda ligada à sua casa ancestral; vendas feitas segundo os pais.
  rationale: O hebraico da oração final é sintaticamente difícil e admite mais de uma leitura. O texto principal apresenta uma interpretação contextual plausível, enquanto a nota preserva a incerteza e uma formulação mais geral.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural tanto no Brasil quanto em outros contextos lusófonos. Conserva-se o verbo concreto “comer” e sinaliza-se em nota a ambiguidade genuína da oração final.
