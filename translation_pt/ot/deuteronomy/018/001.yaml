id: DEU.18.1
reference: Deuteronomy 18:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: pt
  text: Os sacerdotes levitas — toda a tribo de Levi — não terão parte nem herança com Israel. Eles se alimentarão das ofertas de alimento apresentadas a Yahweh[a] e da sua herança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “as ofertas de Yahweh feitas pelo fogo”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “sua herança”. O possessivo pode referir-se a Yahweh ou, coletivamente, a Levi. Compare o versículo 2, onde Yahweh é chamado de herança de Levi.
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: Os sacerdotes levitas
  rationale: A aposição hebraica identifica os sacerdotes como levitas. A formulação é concisa e natural em português, sem sugerir dois grupos separados.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: toda a tribo de Levi
  rationale: Preserva a ênfase abrangente de כָּל e esclarece que a declaração alcança a tribo inteira.
- source_word: חֵלֶק וְנַחֲלָה
  choice: parte nem herança
  rationale: Os termos quase sinônimos dizem respeito à participação e à propriedade recebida por sorteio. Com a negação, “nem” produz uma coordenação natural em português.
- source_word: עִם יִשְׂרָאֵל
  choice: com Israel
  rationale: Expressa de modo direto que Levi não receberia propriedade juntamente com o restante de Israel.
- source_word: אִשֵּׁי יְהוָה
  choice: ofertas de alimento apresentadas a Yahweh
  rationale: אִשִּׁים designa ofertas sacrificiais destinadas a Yahweh e associadas ao altar, das quais os levitas receberiam sustento. A tradução comunica a função alimentar, enquanto a nota preserva a expressão tradicional ligada ao fogo.
- source_word: וְנַחֲלָתוֹ
  choice: e da sua herança
  rationale: Mantém a conjunção simples e o sufixo masculino singular do hebraico sem transformar explicitamente a segunda expressão em explicação da primeira. O possessivo português preserva a ambiguidade do referente.
- source_word: יֹאכֵלוּן
  choice: Eles se alimentarão
  rationale: O imperfeito tem valor normativo ou habitual no contexto legal. “Se alimentarão de” comunica naturalmente que essas ofertas constituiriam o sustento do grupo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Referente do sufixo em וְנַחֲלָתוֹ
  choice: Manter “sua herança” ambíguo
  alternative: Explicitar “a herança de Yahweh” ou “a herança de Levi”
  rationale: O sufixo hebraico está no masculino singular e seu referente não é inequívoco. Pode apontar para Yahweh, mencionado imediatamente antes, ou para Levi entendido coletivamente; Deuteronômio 18:2 acrescenta que Yahweh é a herança de Levi. A tradução não resolve silenciosamente essa tensão.
- issue: Relação entre אִשֵּׁי יְהוָה e וְנַחֲלָתוֹ
  choice: Coordenar com “e”
  alternative: 'Interpretar em aposição: “isto é, a sua herança”'
  rationale: O texto hebraico usa a conjunção וְ, que permite simples coordenação. Embora uma leitura explicativa seja possível, inserir “isto é” fecharia uma relação sintática que o original não explicita.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O original apresenta o nome próprio da aliança. “Yahweh” o representa diretamente e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Os travessões preservam a força explicativa de “toda a tribo de Levi”; a segunda frase evita um período excessivamente longo. A tradução conserva as ambiguidades reais da coordenação e do possessivo.
