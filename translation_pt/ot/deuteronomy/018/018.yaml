  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: pt
  text: Farei surgir para eles um profeta como você, do meio de seus irmãos[a]. Porei minhas palavras na boca dele, e ele lhes falará tudo o que eu lhe ordenar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus parentes” ou “seus compatriotas israelitas”; literalmente, “seus irmãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: um profeta
  rationale: Tradução usual do termo hebraico para quem fala em nome de Deus; o substantivo sem artigo é naturalmente expresso com o artigo indefinido em português.
- source_word: אָקִים
  choice: Farei surgir
  rationale: O hifil de קום indica fazer levantar ou surgir; a formulação preserva a iniciativa divina e soa natural em português.
- source_word: לָהֶם
  choice: para eles
  rationale: A preposição ל expressa aqui provisão em favor do povo.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: do meio de seus irmãos
  rationale: Mantém tanto a ideia espacial e comunitária de מִקֶּרֶב quanto o termo masculino de parentesco אֲחֵיהֶם, sem explicitar no texto principal uma identificação além do hebraico.
- source_word: כָּמוֹךָ
  choice: como você
  rationale: Preserva de modo direto a comparação explícita com Moisés, usando tratamento corrente e amplamente compreensível.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: Porei minhas palavras na boca dele
  rationale: Conserva a metáfora concreta da comissão profética e evita a ambiguidade pronominal que 'sua boca' poderia produzir em português.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: e ele lhes falará
  rationale: Expressa a ação futura e o destinatário de forma concisa e natural.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: tudo o que eu lhe ordenar
  rationale: Comunica a abrangência de כָּל e, dentro da moldura futura da promessa, representa naturalmente o imperfeito hebraico.
theological_decisions:
- issue: Possível especificidade messiânica do profeta prometido
  choice: O texto mantém a promessa de um profeta como Moisés sem identificar explicitamente seu referente.
  alternative: Uma sucessão coletiva de profetas; ou um profeta escatológico singular cumprido no Messias.
  rationale: O versículo emprega o singular 'um profeta como você', mas não identifica por si só a figura. A tradução preserva essa tensão interpretativa sem inserir uma conclusão cristológica ou coletiva no texto principal.
- issue: Sentido de אֲחֵיהֶם
  choice: seus irmãos
  alternative: seus parentes; seus compatriotas israelitas
  rationale: A tradução retém o termo masculino de parentesco do hebraico. A nota esclarece seu possível alcance comunitário no contexto sem neutralizar o texto principal.
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa legibilidade brasileira. 'Você' torna explícita a referência singular a Moisés; 'dele' evita ambiguidade. A ordem das orações e as metáforas centrais do hebraico foram preservadas sem rigidez excessiva.
source_grounding:
  english_pob_role: consult_only
