id: DEU.18.4
reference: Deuteronomy 18:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רֵאשִׁ֨ית דְּגָֽנְ/ךָ֜ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֗/ךָ וְ/רֵאשִׁ֛ית גֵּ֥ז צֹאנְ/ךָ֖ תִּתֶּן לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: pt
  text: Dê a ele as primícias dos seus cereais, do seu vinho novo[a] e do seu azeite, bem como a primeira porção da lã tosquiada do seu rebanho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico se refere geralmente ao vinho recém-produzido.
    reason: cultural_note
  - marker: b
    text: 'Ou: “a primeira parte da tosquia do seu rebanho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: primícias / primeira porção
  rationale: O termo indica a parte inicial ou prioritária. “Primícias” é natural para os produtos agrícolas; diante da lã, “primeira porção” comunica melhor o mesmo sentido em português.
- source_word: דָּגָן
  choice: cereais
  rationale: Designa de modo amplo a produção de grãos; “cereais” mantém esse valor coletivo e é claro em português internacional.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: O termo costuma designar vinho recém-produzido, e “vinho novo” preserva essa distinção sem excluir seu caráter de vinho.
- source_word: יִצְהָר
  choice: azeite
  rationale: No contexto israelita, refere-se normalmente a óleo de oliva. “Azeite” é a forma natural e específica em português.
- source_word: גֵּז
  choice: lã tosquiada
  rationale: Pode indicar a tosquia ou seu produto. O que se dá ao sacerdote é mais naturalmente entendido como a lã resultante da tosquia, sem apagar a alternativa lexical.
- source_word: צֹאן
  choice: rebanho
  rationale: É um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” mantém a abrangência do hebraico.
- source_word: תִּתֶּן לּוֹ
  choice: Dê a ele
  rationale: O imperfeito tem força de prescrição legal. O imperativo português transmite essa obrigação de forma atual e digna, preservando o pronome singular.
theological_decisions:
- issue: Referente de לּוֹ (“a ele”)
  choice: manter o pronome singular “a ele”
  alternative: explicitar “ao sacerdote” ou entender o singular como referência coletiva à classe sacerdotal
  rationale: O contexto imediato identifica o destinatário sacerdotal, mas o versículo usa um pronome singular. A tradução conserva a forma gramatical e evita especificar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da enumeração e o caráter prescritivo foram preservados. “Bem como” marca com naturalidade a passagem dos produtos agrícolas para a lã.
