base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: pt
  text: Quando o profeta falar em nome de Yahweh[a] e a palavra não se realizar nem se cumprir[b], essa é a palavra que Yahweh não falou. O profeta disse isso com presunção[c]; não tenha medo dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh representa o nome divino יהוה (YHWH), tradicionalmente vertido por “SENHOR”.
    reason: translation_convention
  - marker: b
    text: 'Ou: “não acontecer nem ocorrer”.'
    reason: lexical_alternative
  - marker: c
    text: '“Com presunção” indica uma atitude arrogante e deliberada: o profeta falou sem autorização de Yahweh.'
    reason: cultural_note
lexical_decisions:
- source_word: יְדַבֵּר
  choice: falar
  rationale: O imperfeito hebraico integra uma situação legal condicional; o futuro do subjuntivo português, “falar”, expressa isso naturalmente.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Mantém o artigo definido hebraico e apresenta o profeta como figura representativa no caso legal descrito.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Fórmula idiomática que indica a alegação de falar sob a autoridade divina; o nome pessoal יהוה é transliterado como “Yahweh”.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: דָּבָר pode designar a mensagem proferida e também o fato anunciado. “Palavra” preserva melhor o vínculo com o ato de falar, enquanto a nota registra a amplitude semântica.
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: não se realizar nem se cumprir
  rationale: Preserva a expressão verbal dupla do hebraico em português natural e comunica o não cumprimento da palavra profética.
- source_word: הוּא הַדָּבָר
  choice: essa é a palavra
  rationale: Reproduz a identificação enfática e mantém a repetição lexical de דָּבָר.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: que Yahweh não falou
  rationale: Segue de perto a formulação hebraica sem acrescentar explicações sobre inspiração ou autorização.
- source_word: בְּזָדוֹן דִּבְּרוֹ הַנָּבִיא
  choice: O profeta disse isso com presunção
  rationale: “Isso” representa o sufixo objeto hebraico, e “com presunção” comunica a atitude deliberada e arrogante de falar sem autorização.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: não tenha medo dele
  rationale: Expressa de modo corrente e direto a proibição de temer ou deixar-se intimidar pelo falso porta-voz.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Alcance do teste profético
  choice: Manter o critério objetivo de não cumprimento apresentado no versículo
  alternative: Expandir o texto numa doutrina geral sobre todas as formas de profecia
  rationale: A tradução conserva o foco legal do versículo e não acrescenta conclusões teológicas que ele não explicita.
- issue: Sentido de בְּזָדוֹן
  choice: com presunção
  alternative: arrogantemente; de modo insolente
  rationale: “Com presunção” preserva a combinação de arrogância e ação deliberada envolvida em falar sem autorização divina.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. O futuro do subjuntivo preserva a estrutura condicional da instrução legal; evitou-se linguagem arcaica e também qualquer expansão denominacional.
