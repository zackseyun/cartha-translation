base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: pt
  text: O SENHOR, seu Deus, levantará para você um profeta como eu[b], do seu meio, dentre os seus irmãos[a]. Vocês devem ouvi-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” é um termo masculino de parentesco que, neste contexto, se refere aos membros do povo de Israel em geral.
    reason: lexical_alternative
  - marker: b
    text: No Novo Testamento, este versículo é aplicado ao Messias; aqui, porém, o hebraico diz simplesmente “um profeta como eu”.
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: um profeta
  rationale: O substantivo singular sem artigo é vertido naturalmente como indefinido, sem especificar no texto principal uma identidade que o hebraico não explicita.
- source_word: מִקִּרְבְּךָ
  choice: do seu meio
  rationale: Preserva de modo claro a ideia de que o profeta surgiria de dentro do próprio povo de Israel.
- source_word: מֵאַחֶיךָ
  choice: dentre os seus irmãos
  rationale: Mantém o termo masculino de parentesco do hebraico, usado aqui em sentido comunitário para os membros de Israel; a nota esclarece esse alcance.
- source_word: כָּמֹנִי
  choice: como eu
  rationale: Expressa diretamente a comparação com Moisés, sem acrescentar uma identificação interpretativa.
- source_word: יָקִים לְךָ
  choice: levantará para você
  rationale: A forma causativa de קום pode indicar fazer surgir ou designar alguém. “Levantará” conserva a imagem verbal e “para você” preserva o valor benefativo.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: O SENHOR, seu Deus
  rationale: Emprega a forma portuguesa convencional “SENHOR” para o nome divino e mantém a relação pactual expressa por “seu Deus”.
- source_word: אֵלָיו תִּשְׁמָעוּן
  choice: Vocês devem ouvi-lo
  rationale: שׁמע abrange ouvir, escutar e atender. A formulação transmite a força obrigatória sem ampliar silenciosamente o sentido para “obedecer”.
theological_decisions:
- issue: Possível especificidade messiânica de “um profeta como eu”
  choice: Manter no texto principal a expressão indefinida “um profeta como eu”.
  alternative: Traduzir de modo explicitamente messiânico, como “o Profeta”, ou entender a expressão apenas como referência coletiva à instituição profética.
  rationale: O hebraico não traz artigo nem identifica explicitamente o profeta como o Messias neste versículo. A tradução preserva a formulação imediata e registra em nota sua aplicação posterior no Novo Testamento.
- issue: Sentido representativo de אַח, “irmão”
  choice: Conservar “irmãos” no texto principal e explicar seu alcance em nota.
  alternative: Verter como “compatriotas”, “israelitas” ou “irmãos e irmãs”.
  rationale: “Irmãos” corresponde à forma masculina plural do hebraico, enquanto a nota deixa claro que, neste contexto, o termo se refere aos membros do povo de Israel em geral.
- issue: Alternância entre destinatário singular e plural
  choice: Preservar “para você/seu” e depois “vocês”.
  alternative: Uniformizar toda a frase no singular ou no plural.
  rationale: Os sufixos anteriores são singulares e tratam Israel coletivamente, enquanto תִּשְׁמָעוּן é plural. A alternância em português conserva essa mudança do texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservou-se a alternância hebraica entre o tratamento coletivo singular (“você”, “seu”) e a forma plural final (“vocês”).
