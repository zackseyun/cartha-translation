base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: pt
  text: Não terá herança entre seus irmãos[a]; Yahweh é a sua herança, como lhe disse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus parentes”. O hebraico diz literalmente “seus irmãos” e se refere aos outros israelitas, especialmente às demais tribos.
    reason: lexical_alternative
  - marker: b
    text: Ou “como lhe falou”. O verbo hebraico é o termo comum para “falar” ou “dizer”; “como lhe prometeu” é possível por implicação, mas é mais interpretativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: herança / sua herança
  rationale: Em contextos de distribuição da terra em Deuteronômio, נַחֲלָה designa uma herança ou parte hereditária concedida. Repetir “herança” preserva tanto o sentido territorial da primeira oração quanto o sentido metafórico e pactual da segunda.
- source_word: בְּקֶרֶב
  choice: entre
  rationale: Na expressão בְּקֶרֶב אֶחָיו, “entre” comunica de modo natural o sentido relacional de estar no meio dos demais membros de Israel.
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: O hebraico traz o masculino plural literal “seus irmãos”. A formulação preserva a imagem do texto; no contexto, refere-se aos outros israelitas, especialmente às demais tribos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando o nome pessoal presente no texto hebraico.
- source_word: הוּא
  choice: é
  rationale: O pronome independente confere ênfase a Yahweh. Em português, a estrutura direta “Yahweh é a sua herança” transmite essa identificação sem acrescentar uma formulação artificial.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: conforme lhe falou
  rationale: דִּבֶּר é o verbo comum para falar. “Conforme lhe falou” acompanha de perto o hebraico e evita explicitar “prometeu”, ideia possível no contexto, mas não codificada pelo verbo em si.
theological_decisions:
- issue: Referente dos pronomes masculinos no singular
  choice: Manter o singular representativo, com referência ao levita ou sacerdote levítico como representante da tribo.
  alternative: Entender os pronomes como referência específica ao ancestral Levi ou, distributivamente, a cada sacerdote individual.
  rationale: O contexto imediato trata dos sacerdotes levíticos e da tribo de Levi, e o hebraico pode empregar o singular de maneira coletiva ou representativa. A tradução conserva essa forma sem restringir indevidamente o referente.
- issue: Natureza da afirmação “Yahweh é a sua herança”
  choice: Preservar a afirmação metafórica e pactual sem explicação adicional.
  alternative: Expandir interpretativamente para dizer que Yahweh é a parte concedida aos levitas em lugar de terras.
  rationale: O hebraico afirma de forma concisa que o próprio Yahweh é a herança. Manter essa linguagem conserva sua riqueza e tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o singular representativo e repete “herança” para refletir o vínculo lexical e teológico do hebraico. “Conforme lhe falou” preserva a formulação do original, embora tenha tom discretamente formal.
