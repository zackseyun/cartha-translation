revisions:
- from: Pois Yahweh, seu Deus, o escolheu dentre todas as suas tribos para estar de pé e servir em nome de Yahweh, ele e seus filhos, todos os dias.[a]
  to: Pois Yahweh, teu Deus, o escolheu dentre todas as tuas tribos, para que ele e seus filhos estejam de pé e sirvam em nome de Yahweh todos os dias[a].
  rationale: A revisão resolve a construção sintática solta ao expressar em português que «ele e seus filhos» são os sujeitos de «estejam de pé e sirvam». Conserva-se a imagem concreta de estar de pé, o nome divino, a referência masculina a filhos e a ambiguidade legítima da expressão temporal, explicada na nota.
