  verdict: revise
  source_fidelity: 'O sentido central é bem preservado: Yahweh escolhe o levita dentre as tribos para o serviço cultual em seu nome, com referência a ele e a seus filhos e à duração contínua desse serviço. A revisão torna explícita em português a coordenação de «ele e seus filhos» com os verbos, sem alterar a amplitude de כָּל־הַיָּמִים.'
  naturalness: 'A redação atual é compreensível, mas «para estar de pé e servir em nome de Yahweh, ele e seus filhos, todos os dias» fica sintaticamente truncada em português: «ele e seus filhos» aparece como aposto solto, e a expressão temporal se liga com pouca clareza. A construção com oração final plural é mais natural e mantém o registro formal.'
  terminology: «Yahweh», «servir em nome de Yahweh» e «filhos» são escolhas adequadas. «Teu Deus» e «tuas tribos» refletem com maior transparência a segunda pessoa do hebraico e evitam a possível ambiguidade de «seu/suas» no português brasileiro.
  issues:
  - severity: medium
    issue: Coordenação pouco clara de «ele e seus filhos»
    rationale: No texto proposto, a sequência «..., ele e seus filhos, todos os dias» não se integra naturalmente aos infinitivos «estar de pé e servir». Uma oração final com verbos no plural deixa claro que ambos são os agentes do serviço, como no hebraico.
  - severity: low
    issue: Pronomes possessivos potencialmente ambíguos
    rationale: «Seu Deus» e «suas tribos» podem ser lidos, no português brasileiro, como referência a uma terceira pessoa. «Teu Deus» e «tuas tribos» tornam explícita a segunda pessoa do texto-fonte.
  - severity: low
    issue: Posição da chamada de nota
    rationale: A chamada deve ficar imediatamente após «todos os dias», expressão que a nota esclarece, e não depois do ponto final.
