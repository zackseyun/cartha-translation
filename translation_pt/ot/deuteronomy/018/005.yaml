base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: pt
  text: Pois Yahweh, teu Deus, o escolheu dentre todas as tuas tribos, para que ele e seus filhos estejam de pé e sirvam em nome de Yahweh todos os dias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuamente” ou “para sempre”. A expressão hebraica significa literalmente “todos os dias” e, neste contexto, pode indicar um serviço sacerdotal contínuo e duradouro.'
    reason: alternativa lexical e esclarecimento da expressão temporal
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da legislação precedente e mantém naturalmente o valor explicativo da conjunção.
- source_word: בּוֹ בָּחַר
  choice: o escolheu
  rationale: Com בחר, a preposição ב marca a pessoa escolhida; em português, o objeto direto é a forma idiomática.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: dentre todas as suas tribos
  rationale: Expressa com clareza a escolha de uma pessoa ou linhagem no conjunto das tribos de Israel.
- source_word: לַעֲמֹד
  choice: para estar de pé
  rationale: Preserva a imagem concreta da postura de quem comparece para exercer serviço sacerdotal.
- source_word: לְשָׁרֵת
  choice: e servir
  rationale: O verbo descreve serviço oficial ou cultual; “servir” é claro, digno e não acrescenta uma função ausente do hebraico.
- source_word: בְּשֵׁם יְהוָה
  choice: em nome de Yahweh
  rationale: Mantém a formulação hebraica e sua ideia de serviço exercido sob o nome e a autoridade de Yahweh.
- source_word: הוּא וּבָנָיו
  choice: ele e seus filhos
  rationale: Conserva a referência masculina explícita à descendência sacerdotal, sem neutralizá-la.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Reproduz de perto a expressão hebraica e deixa que a nota indique seu possível sentido duradouro ou contínuo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Linguagem masculina da sucessão sacerdotal
  choice: ele e seus filhos
  alternative: ele e seus descendentes; ele e seus filhos e filhas
  rationale: O hebraico diz explicitamente “filhos” e o contexto trata da continuidade masculina do serviço levítico; a tradução não amplia nem neutraliza essa referência.
- issue: Duração do serviço sacerdotal
  choice: todos os dias
  alternative: continuamente; para sempre
  rationale: A formulação literal preserva a tensão entre a continuidade cotidiana e a duração permanente da função, sem decidir silenciosamente entre esses matizes.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem próxima do hebraico preserva “ele e seus filhos” como explicitação da linhagem escolhida; “estar de pé” mantém a imagem sacerdotal concreta, e a nota conserva a amplitude semântica da expressão final.
