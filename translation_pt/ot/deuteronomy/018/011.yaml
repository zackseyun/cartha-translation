  yaml_path: translation/ot/deuteronomy/018/011.yaml
  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: pt
  text: nem quem faça encantamentos[a], nem quem consulte um médium[b], nem um ocultista[c], nem quem consulte os mortos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “quem ata uma atadura”; expressão hebraica para quem formula ou profere um encantamento. Outra tradução possível: “encantador”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “quem consulte um espírito”; o termo hebraico pode designar tanto o espírito de um morto como o médium associado à sua consulta.
    reason: lexical_ambiguity
  - marker: c
    text: O termo hebraico designa um praticante ligado a conhecimento ou práticas ocultas. Traduções tradicionais incluem “mago”, mas essa palavra pode sugerir associações modernas inadequadas.
    reason: lexical_alternative
  - marker: d
    text: Também pode ser traduzido como “quem recorra aos mortos” ou “quem busque orientação junto aos mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: quem faça encantamentos
  rationale: O idioma hebraico repete a raiz ligada a “atar” ou “ligar”, mas, neste catálogo de práticas ocultas, designa a formulação ou execução de encantamentos. A expressão escolhida comunica a prática com clareza sem recorrer a linguagem de fantasia.
- source_word: שֹׁאֵל אוֹב
  choice: quem consulte um médium
  rationale: אוֹב pode indicar o espírito de um morto ou a pessoa que serve de médium para consultá-lo. “Consulte um médium” expressa de modo natural a prática proibida, enquanto a nota conserva a outra análise lexical.
- source_word: יִדְּעֹנִי
  choice: adivinho ocultista
  rationale: O termo designa alguém associado a conhecimento oculto e costuma aparecer ao lado de אוֹב. “Adivinho ocultista” distingue essa figura do médium sem importar o sentido fantástico que “mago” pode ter nem identificar a prática com uma religião moderna específica.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: quem consulte os mortos
  rationale: A expressão refere-se claramente à busca de informação ou orientação junto aos mortos. “Consulte os mortos” torna explícito esse sentido necromântico em português natural.
- source_word: וְ
  choice: nem
  rationale: Como continuação de uma lista legal negativa iniciada no contexto anterior, as conjunções são vertidas por “nem”, forma idiomática em português para coordenar os itens proibidos.
theological_decisions:
- issue: Terminologia para práticas ocultas sem importar folclore posterior ou identidades religiosas modernas
  choice: Empregar “encantamentos”, “médium” e “adivinho ocultista”, com notas para as ambiguidades lexicais.
  alternative: Usar termos tradicionais como “encantador”, “mago” ou “espírita”.
  rationale: A escolha descreve as práticas mencionadas no hebraico de maneira compreensível, sem associá-las indevidamente à fantasia moderna ou a uma tradição religiosa contemporânea. As notas preservam a tensão entre o espírito consultado e o praticante que atua como médium.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Nem” mantém a ligação com a proibição iniciada nos versículos anteriores. Evitou-se “espírita” por sua associação específica, no português contemporâneo, com movimentos religiosos modernos; evitou-se também “mago” por suas fortes conotações de fantasia.
