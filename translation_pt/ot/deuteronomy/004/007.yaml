base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: pt
  text: Pois que grande nação há que tenha deuses tão próximos dela como Yahweh, nosso Deus, está perto de nós sempre que o invocamos?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “deuses”. O versículo compara retoricamente as divindades das outras nações com Yahweh, o Deus de Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sempre que clamamos a ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a exortação anterior, preservando a força argumentativa do hebraico.
- source_word: מִי גוֹי גָּדוֹל
  choice: que grande nação há
  rationale: Reproduz de maneira natural em português a pergunta retórica hebraica.
- source_word: אֲשֶׁר לוֹ
  choice: que tenha
  rationale: Expressa idiomaticamente a construção hebraica de posse ou associação.
- source_word: אֱלֹהִים קְרֹבִים
  choice: deuses tão próximos
  rationale: O adjetivo plural קְרֹבִים favorece o sentido plural de אֱלֹהִים; “tão” comunica a ênfase comparativa da pergunta.
- source_word: אֵלָיו
  choice: dela
  rationale: O pronome retoma “nação”; o feminino singular concorda naturalmente em português.
- source_word: כַּיהוָה
  choice: como Yahweh
  rationale: A partícula כְּ marca comparação, e o nome divino é transliterado para preservar o nome pessoal presente no texto hebraico.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Neste contexto, a forma designa singularmente o Deus de Israel.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: sempre que o invocamos
  rationale: A construção indica circunstância repetida; “invocar” comunica com naturalidade o ato de dirigir-se a Deus em oração.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de אֱלֹהִים na primeira oração
  choice: deuses, em referência genérica às divindades das nações
  alternative: Deus; seres divinos
  rationale: A concordância plural de קְרֹבִים e a comparação com Yahweh, o Deus de Israel, sustentam a leitura plural, sem afirmar como reais as pretensões dessas divindades.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A formulação conserva a pergunta retórica, o plural “deuses” e a comparação teologicamente tensa do original.
