revisions:
- from: 'o dia em que você esteve diante de Yahweh, seu Deus, em Horebe, quando Yahweh me disse: “Reúna o povo diante de mim, e farei com que ouçam as minhas palavras, para que aprendam a me temer durante todos os dias em que viverem sobre a terra[a] e ensinem seus filhos.”'
  to: 'o dia em que você esteve diante de Yahweh, seu Deus, em Horebe, quando Yahweh me disse: “Reúna para mim o povo, e farei com que ouçam as minhas palavras, para que aprendam a me temer durante todos os dias em que viverem sobre a terra[a] e para que ensinem seus filhos.”'
  rationale: A revisão aproxima a tradução de לִי (“para mim”) sem importar uma locação adicional, explicita a segunda oração de finalidade e ajusta a nota para conservar a amplitude lexical de אֲדָמָה. Não há alteração de sentido teológico ou interpretativo.
