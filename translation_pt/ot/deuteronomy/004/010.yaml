  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: pt
  text: 'o dia em que você esteve diante de Yahweh, seu Deus, em Horebe, quando Yahweh me disse: “Reúna para mim o povo, e farei com que ouçam as minhas palavras, para que aprendam a me temer durante todos os dias em que viverem sobre a terra[a] e para que ensinem seus filhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na terra”. O termo hebraico אֲדָמָה pode se referir à terra ou ao solo em geral, ou à terra em sentido mais específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: o dia em que
  rationale: Preserva a construção temporal relativa e liga naturalmente o versículo à exortação do contexto anterior.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: você esteve diante de
  rationale: Mantém a cena concreta e solene de Israel na presença de Deus; “esteve” soa natural em português na recordação de um acontecimento passado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente a construção possessiva e sua linguagem de relação pactual.
- source_word: בְּחֹרֵב
  choice: em Horebe
  rationale: É a forma idiomática em português para situar o acontecimento nesse lugar.
- source_word: בֶּאֱמֹר
  choice: quando ... disse
  rationale: Expressa de modo natural a simultaneidade indicada pelo infinitivo hebraico com preposição.
- source_word: הַקְהֶל לִי אֶת הָעָם
  choice: Reúna o povo diante de mim
  rationale: Comunica a ordem pública de congregar o povo e verte לִי de maneira natural no contexto da assembleia perante Deus.
- source_word: וְאַשְׁמִעֵם
  choice: e farei com que ouçam
  rationale: Preserva claramente o sentido causativo do Hifil de שמע sem transformar a expressão em mera proclamação.
- source_word: דְּבָרָי
  choice: as minhas palavras
  rationale: Mantém o plural concreto das declarações divinas.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: para que aprendam a me temer
  rationale: Expressa a finalidade e conserva o peso de temor, reverência e obediência do verbo ירא.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: durante todos os dias em que viverem
  rationale: Preserva a duração vitalícia da expressão hebraica em português corrente e digno.
- source_word: עַל הָאֲדָמָה
  choice: sobre a terra
  rationale: Mantém o sentido geral de solo/terra sem restringir antecipadamente a referência à terra prometida; a leitura mais específica é registrada em nota.
- source_word: בְּנֵיהֶם
  choice: seus filhos
  rationale: Neste contexto, o plural masculino designa a descendência de modo geral; “filhos” é natural e inclusivo no uso português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de ירא no contexto da aliança
  choice: me temer
  alternative: me reverenciar
  rationale: “Temer” preserva a tensão teológica entre temor, reverência e obediência, sem reduzir o termo a uma explicação interpretativa.
- issue: Abrangência de בְּנֵיהֶם
  choice: seus filhos
  alternative: seus filhos homens
  rationale: O contexto trata da transmissão entre gerações, e não exclusivamente a descendentes do sexo masculino.
- issue: Referência de אֲדָמָה
  choice: terra
  alternative: terra natal / território
  rationale: A palavra pode indicar a terra ou o solo em geral e também uma terra específica; o texto principal conserva a leitura ampla e a nota registra a alternativa contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O início em minúscula conserva a relação sintática com o contexto anterior. A nota foi colocada junto de “terra”, expressão à qual pertence lexicalmente.
