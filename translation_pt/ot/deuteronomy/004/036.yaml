base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: pt
  text: Do céu, ele fez você ouvir sua voz para disciplinar você[a]; e, na terra, mostrou a você seu grande fogo, e você ouviu suas palavras do meio do fogo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para instruir você” ou “para corrigir você”; o verbo hebraico pode incluir tanto a correção quanto a formação.
    reason: lexical_alternative
  - marker: b
    text: Ou “de dentro do fogo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: Do céu
  rationale: Expressa de modo natural a origem espacial e preserva o contraste com “na terra”.
- source_word: הִשְׁמִיעֲךָ
  choice: fez você ouvir
  rationale: Mantém explicitamente a força causativa do Hifil de שׁמע em português corrente.
- source_word: קֹלוֹ
  choice: a sua voz
  rationale: “Voz” é o equivalente natural no contexto da fala e da autorrevelação divina.
- source_word: לְיַסְּרֶךָּ
  choice: para discipliná-lo
  rationale: Preserva o campo semântico de formação, correção e instrução sem restringi-lo a castigo.
- source_word: וְעַל הָאָרֶץ
  choice: na terra
  rationale: Formulação idiomática em português que conserva o contraste cósmico com “do céu”.
- source_word: הֶרְאֲךָ
  choice: mostrou a você
  rationale: Equivalente português natural para a forma causativa de ראה.
- source_word: אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: o seu grande fogo
  rationale: Reproduz diretamente a imagem concreta do hebraico sem ampliação interpretativa.
- source_word: וּדְבָרָיו
  choice: as suas palavras
  rationale: Conserva o plural explícito, referente ao conteúdo articulado da fala divina.
- source_word: שָׁמַעְתָּ
  choice: você ouviu
  rationale: Traduz diretamente a percepção auditiva efetiva indicada pelo Qal perfeito.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: do meio do fogo
  rationale: Preserva a ideia espacial de procedência desde o interior do fogo em linguagem clara e solene.
theological_decisions:
- issue: Finalidade pedagógica divina em לְיַסְּרֶךָּ
  choice: para discipliná-lo
  alternative: para instruí-lo; para corrigi-lo; para castigá-lo
  rationale: “Disciplinar” mantém juntas as dimensões formativa e corretiva do verbo, sem reduzir o sentido a mera instrução nem acentuar indevidamente a punição.
- issue: Linguagem concreta da autorrevelação divina
  choice: a sua voz; o seu grande fogo; as suas palavras
  alternative: paráfrases abstratas da manifestação divina
  rationale: A tradução conserva as imagens concretas do hebraico, sem explicar ou suavizar a forma pela qual o texto descreve a revelação de Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O uso de “você” torna explícito o destinatário singular do hebraico; a construção “fez você ouvir” mantém a causalidade do original sem artificialidade excessiva. O ponto e vírgula evidencia o paralelismo entre céu e terra.
