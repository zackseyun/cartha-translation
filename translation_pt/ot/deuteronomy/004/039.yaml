base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: pt
  text: 'Portanto, reconheça hoje e leve isso ao coração[a]: Yahweh, ele é Deus nos céus acima e na terra embaixo; não há outro[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “faça voltar ao seu coração” ou “leve ao coração”; expressão para reconhecer interiormente e acolher como verdadeira uma realidade.
    reason: lexical_alternative
  - marker: b
    text: Ou, em formulação mais literal ou formal, “não há nenhum outro” ou “não há outro além dele”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: reconheça hoje
  rationale: O perfeito qal de segunda pessoa, ligado por conjunção, tem força exortativa neste contexto. “Reconheça” comunica não apenas aquisição de informação, mas admissão consciente da verdade demonstrada; “hoje” preserva a urgência temporal.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: leve isso ao coração
  rationale: A construção com o hifil de שוב e “ao seu coração” é idiomática e descreve trazer uma verdade para dentro, refletir nela e acolhê-la. A formulação conserva a imagem hebraica do coração sem reduzir seu sentido à atividade intelectual.
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: Yahweh, ele é Deus
  rationale: “Yahweh” translitera o nome divino. O pronome explícito הוּא é mantido como “ele” para conservar a ênfase identificadora do hebraico, embora a repetição seja mais marcada em português.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: nos céus, lá em cima, e sobre a terra, aqui embaixo
  rationale: Mantém o plural hebraico “céus” e o contraste espacial que expressa a totalidade do domínio cósmico. “Lá em cima” e “aqui embaixo” tornam naturais os advérbios relacionais em português.
- source_word: אֵין עוֹד
  choice: não há outro
  rationale: Formulação concisa e idiomática que preserva a afirmação absoluta de exclusividade, sem acrescentar uma especificação ausente do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal revelado a Israel, em vez de substituí-lo por um título.
- issue: Ênfase de יְהוָה הוּא הָאֱלֹהִים
  choice: Yahweh, ele é Deus
  alternative: Yahweh é Deus
  rationale: A retenção do pronome explícito preserva a ênfase da identificação no hebraico, sem expandi-la em uma formulação doutrinária posterior.
- issue: Exclusividade expressa por אֵין עוֹד
  choice: não há outro
  alternative: não existe nenhum além dele
  rationale: A tradução mantém a afirmação de que nenhum outro é Deus em toda a extensão dos céus e da terra, mas evita explicitar mais do que o texto diz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação enfática “Yahweh, ele é Deus” é deliberadamente marcada para refletir o pronome hebraico explícito. Os marcadores foram posicionados junto às expressões que explicam.
