- from: 'Portanto, reconheça hoje e leve isso ao coração[a]: Yahweh, ele é Deus nos céus, lá em cima, e sobre a terra, aqui embaixo; não há outro[b].'
  to: 'Portanto, reconheça hoje e leve isso ao coração[a]: Yahweh, ele é Deus nos céus acima e na terra embaixo; não há outro[b].'
  rationale: A revisão elimina os dêiticos não expressos no hebraico, torna o paralelismo cósmico mais conciso e direto e ajusta a nota final para comunicar a exclusividade de אֵין עוֹד sem uma possível nuance temporal ou quantitativa indevida. Mantêm-se a força exortativa, a linguagem do coração, o pronome enfático e a transliteração do nome divino.
