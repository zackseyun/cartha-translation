base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: pt
  text: Algum povo já ouviu a voz de Deus falando do meio do fogo, como você ouviu, e viveu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente «e viveu». Também pode ser entendido como «e sobreviveu»; o contexto ressalta que o povo permaneceu vivo depois de ouvir Deus falar do fogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: Algum povo já ouviu...?
  rationale: A partícula interrogativa com o perfeito introduz uma pergunta retórica. Em português, «já ouviu» expressa naturalmente a ideia de experiência até o momento do discurso.
- source_word: עָם
  choice: povo
  rationale: O substantivo designa um grupo humano coletivo; «povo» é natural no contraste retórico com Israel.
- source_word: קוֹל
  choice: voz
  rationale: Com o particípio «falando», «voz» comunica uma declaração divina inteligível melhor que «som».
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O particípio singular e o contexto da aliança em Horebe indicam referência singular ao Deus de Israel.
- source_word: מְדַבֵּר
  choice: falando
  rationale: O particípio descreve Deus em ação por meio de sua voz; «falando» preserva o aspecto contínuo e é corrente em português.
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: do meio do fogo
  rationale: Preserva a imagem espacial específica do hebraico em formulação clara e natural.
- source_word: כַּ/אֲשֶׁר
  choice: como
  rationale: Introduz diretamente a comparação entre a experiência de qualquer povo e a de Israel.
- source_word: שָׁמַעְתָּ אַתָּה
  choice: como você ouviu
  rationale: O pronome independente hebraico dá ênfase ao destinatário. «Você» oferece ampla legibilidade brasileira sem alterar o singular do texto.
- source_word: וַ/יֶּחִי
  choice: e continuou vivo
  rationale: O verbo significa «viver». A expressão portuguesa conserva esse sentido e torna natural, sem chegar ao grau interpretativo de «sobreviveu», a ideia contextual de permanecer com vida após ouvir Deus.
theological_decisions:
- issue: Tradução de אֱלֹהִים no relato da autorrevelação divina
  choice: Deus
  alternative: um deus; deuses
  rationale: O particípio singular e o contexto imediato da aliança em Horebe exigem a referência singular, sem acrescentar elaboração doutrinária.
- issue: Explicitação do contraste implícito entre ouvir Deus e permanecer vivo
  choice: e continuou vivo
  alternative: e sobreviveu; e ainda assim viveu
  rationale: A coordenação simples do hebraico é mantida, sem acrescentar um adversativo. «Continuou vivo» comunica de modo natural a preservação da vida, enquanto a nota registra a tradução mais estritamente literal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A pergunta retórica e a imagem «do meio do fogo» foram preservadas; evitou-se elevar o registro com formulações pouco correntes como «do seio do fogo».
