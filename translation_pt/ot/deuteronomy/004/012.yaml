  naturalness: O texto é claro, moderno e apropriado ao registro. “Vocês ouviam ... mas não viam” é possível, mas “Vocês ouviram ... mas não viram” é mais idiomático neste relato de um acontecimento passado e mais direto para leitores brasileiros e internacionais.
  terminology: '“Javé”, “do meio do fogo”, “forma” e “apenas uma voz” são escolhas fiéis e naturais. A nota b deve espelhar melhor a expressão escolhida no texto: “som de palavras” é a formulação mais transparente para קוֹל דְּבָרִים, enquanto “voz de palavras” pode ser indicada como mais literal.'
