  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֲלֵי/כֶ֖ם מִ/תּ֣וֹךְ הָ/אֵ֑שׁ ק֤וֹל דְּבָרִים֙ אַתֶּ֣ם שֹׁמְעִ֔ים וּ/תְמוּנָ֛ה אֵינְ/כֶ֥ם רֹאִ֖ים זוּלָתִ֥י קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: pt
  text: Então Javé falou com vocês do meio do fogo.[a] Vocês ouviram o som de palavras,[b] mas não viram forma alguma[c] — apenas uma voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de dentro do fogo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “som de palavras”; mais literalmente, “voz de palavras”. Também pode ser entendido como “o som da fala”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “semelhança”, “figura” ou “aparência”. O termo hebraico ressalta que nenhuma forma visível foi vista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome da aliança, preservando-o como nome próprio.
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: דבר significa normalmente “falar”; o pretérito traduz com naturalidade a forma narrativa hebraica.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: do meio do fogo
  rationale: Preserva a ideia espacial de que a fala procedeu de dentro do fogo, sem tornar a expressão pesada.
- source_word: קוֹל דְּבָרִים
  choice: o som de palavras
  rationale: Mantém a construção hebraica e salienta que foram ouvidas palavras articuladas, não mero ruído.
- source_word: שֹׁמְעִים
  choice: ouviam
  rationale: O particípio descreve a experiência em curso naquele momento; o imperfeito português expressa naturalmente esse aspecto.
- source_word: תְמוּנָה
  choice: forma
  rationale: Designa forma, figura ou representação visível. “Forma” é conciso e preserva a oposição entre o que se ouviu e o que não se viu.
- source_word: אֵינְכֶם רֹאִים
  choice: não viam forma alguma
  rationale: Reproduz de modo idiomático a negação da percepção visual e mantém o paralelismo com “ouviam”.
- source_word: זוּלָתִי קוֹל
  choice: apenas uma voz
  rationale: 'זוּלָתִי introduz a única exceção: não havia forma visível, somente a realidade audível da voz.'
theological_decisions:
- issue: Linguagem representacional na manifestação de Deus
  choice: Manter o contraste entre a revelação audível e a ausência de qualquer forma visível.
  alternative: Explicitar “nenhuma representação visível de Deus”.
  rationale: O texto afirma que Israel ouviu palavras, mas não viu תְמוּנָה. A tradução conserva essa tensão sem acrescentar uma formulação doutrinária posterior nem identificar além do texto o tipo de “forma” em questão.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Javé” preserva o nome divino; os imperfeitos “ouviam” e “viam” refletem os particípios hebraicos e apresentam as duas percepções como simultâneas. O travessão reforça, sem explicar em excesso, a conclusão enfática “apenas uma voz”.
