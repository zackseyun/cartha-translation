source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: pt
  text: Quando você tiver filhos e netos[a], e vocês envelhecerem na terra[b], se corromperem, fizerem uma imagem esculpida na forma de qualquer coisa[c] e praticarem o que é mau aos olhos de Yahweh, seu Deus, provocando-o à ira—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos e filhos de filhos”. O hebraico usa termos masculinos de descendência, aqui provavelmente com sentido abrangente entre gerações.
    reason: lexical_alternative
  - marker: b
    text: Ou “estiverem há muito tempo na terra”. O verbo pode destacar tanto o envelhecimento quanto a longa permanência.
    reason: lexical_alternative
  - marker: c
    text: Ou “a semelhança de qualquer coisa” ou “qualquer forma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste aviso, introduz uma situação futura que leva à declaração do versículo seguinte; “quando” expressa naturalmente essa relação temporal e condicional.
- source_word: תוֹלִיד
  choice: você tiver
  rationale: O Hifil de ילד significa literalmente gerar ou fazer nascer. Em português corrente, “tiver filhos” comunica com naturalidade a ideia de gerar descendência, sem o tom técnico ou exclusivamente paterno de “gerar”.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: filhos e netos
  rationale: A expressão hebraica usa termos masculinos de descendência, mas neste contexto geracional abrange provavelmente os descendentes em geral. “Filhos e netos” preserva a progressão entre gerações.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: vocês envelhecerem na terra
  rationale: O verbo pode indicar envelhecer ou permanecer por muito tempo. A tradução mantém a imagem verbal do hebraico, enquanto a nota registra a nuance de longa permanência.
- source_word: וְהִשְׁחַתֶּם
  choice: se corromperem
  rationale: No contexto, o verbo descreve corrupção moral e pactual manifestada na idolatria. A forma pronominal é natural em português e transmite a deterioração do comportamento.
- source_word: פֶּסֶל
  choice: uma imagem esculpida
  rationale: Designa concretamente uma imagem produzida por entalhe ou escultura; esta escolha é mais próxima do termo hebraico que o termo interpretativo “ídolo”.
- source_word: תְּמוּנַת כֹּל
  choice: com a forma de qualquer coisa
  rationale: Reproduz o sentido abrangente da construção hebraica e liga de modo natural a forma representada à imagem esculpida.
- source_word: הָרַע בְּעֵינֵי
  choice: o que é mau aos olhos de
  rationale: Preserva a metáfora avaliativa do hebraico em linguagem clara e idiomática em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְהַכְעִיסוֹ
  choice: provocando-o à ira
  rationale: Mantém tanto a força causativa do infinitivo quanto a referência explícita à ira provocada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual em forma transliterada, sem substituí-lo por um título.
- issue: Linguagem masculina de descendência em בָּנִים וּבְנֵי בָנִים
  choice: filhos e netos
  alternative: filhos homens e netos homens; descendentes
  rationale: Embora os substantivos sejam formalmente masculinos, aqui a advertência abrange a continuidade das gerações. A formulação escolhida conserva os termos familiares concretos sem restringir indevidamente a aplicação aos homens.
- issue: Alternância entre destinatário singular e plural
  choice: você tiver ... vocês envelhecerem
  alternative: vocês tiverem ... vocês envelhecerem
  rationale: O hebraico passa do singular em תוֹלִיד ao plural nos verbos seguintes, tratando primeiro o destinatário de modo individual ou coletivo-personificado e depois a comunidade. A tradução conserva essa mudança, apesar de ela ser mais perceptível em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a alternância hebraica do singular para o plural (“você”/“vocês”), bem como o travessão final, pois a consequência da advertência vem no versículo seguinte.
