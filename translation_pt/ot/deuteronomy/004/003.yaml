  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: pt
  text: 'Vocês viram com os próprios olhos o que Yahweh fez em Baal-Peor: Yahweh, o seu Deus, eliminou do meio de vocês todo homem que seguiu Baal-Peor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: Vocês viram com os próprios olhos
  rationale: Reproduz em português natural a ênfase hebraica no testemunho ocular direto.
- source_word: עָשָׂה
  choice: fez
  rationale: O verbo se refere à ação histórica de Yahweh em juízo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama.
- source_word: בְּבַעַל פְּעוֹר
  choice: em Baal-Peor
  rationale: A preposição situa a ação no episódio ou local associado a Baal-Peor.
- source_word: כִּי
  choice: ':'
  rationale: Os dois-pontos expressam com naturalidade que a oração seguinte explica o que Yahweh fez, sem exigir uma conjunção portuguesa artificial.
- source_word: כָּל הָאִישׁ
  choice: todo homem
  rationale: Mantém o masculino singular distributivo do hebraico.
- source_word: הָלַךְ אַחֲרֵי
  choice: seguiu
  rationale: Comunica de modo natural a ideia idiomática de seguir em lealdade ou culto.
- source_word: הִשְׁמִידוֹ
  choice: eliminou
  rationale: Expressa a destruição total ou remoção causada por Yahweh e permite que o objeto distributivo apareça naturalmente antes da oração relativa.
- source_word: אֱלֹהֶיךָ
  choice: o seu Deus
  rationale: Conserva a designação pactual em aposição ao nome divino; o singular hebraico se refere coletivamente a Israel.
- source_word: מִקִּרְבֶּךָ
  choice: do meio de vocês
  rationale: Expressa claramente a remoção de dentro da comunidade de Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome divino, não apenas um título; a transliteração preserva essa distinção.
- issue: Masculino distributivo כָּל הָאִישׁ
  choice: todo homem
  alternative: todos; toda pessoa
  rationale: A opção mantém a forma masculina singular do texto, usada distributivamente, sem neutralizá-la.
- issue: Referente de בַּעַל פְּעוֹר
  choice: Baal-Peor
  alternative: Baal de Peor
  rationale: A forma composta preserva a ambiguidade contextual entre o nome ligado ao episódio/local e a divindade cultuada, sem impor uma explicação no corpo do versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' torna explícito o destinatário coletivo indicado pela alternância hebraica entre plural e singular coletivo. A ordem da segunda oração foi ajustada para evitar um objeto pronominal redundante e preservar com clareza a relação distributiva.
