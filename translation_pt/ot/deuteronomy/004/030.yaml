reference: Deuteronomy 4:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/צַּ֣ר לְ/ךָ֔ וּ/מְצָא֕וּ/ךָ כֹּ֖ל הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה בְּ/אַחֲרִית֙ הַ/יָּמִ֔ים וְ/שַׁבְתָּ֙ עַד יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׁמַעְתָּ֖ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: pt
  text: Quando você estiver em aflição e todas estas coisas o alcançarem, nos últimos dias[a], você voltará para Yahweh, seu Deus, e ouvirá a sua voz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em dias futuros”. A expressão hebraica “nos últimos dias” pode referir-se de modo amplo a um tempo futuro e não precisa ser limitada a um esquema específico do fim dos tempos.
    reason: alternative_reading
  - marker: b
    text: “Ouvirá a sua voz” também pode ser traduzido como “obedecerá à sua voz”, pois a expressão hebraica frequentemente inclui a ideia de atender com obediência.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: quando você estiver em aflição
  rationale: A construção indica estar em uma situação de aperto ou aflição. A forma temporal explicita naturalmente em português a relação com os acontecimentos seguintes, sem acrescentar conteúdo.
- source_word: וּמְצָאוּךָ
  choice: o alcançarem
  rationale: Embora מצא possa significar literalmente “encontrar”, quando acontecimentos adversos são o sujeito, “alcançar” comunica de modo idiomático que eles chegam à pessoa.
- source_word: כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas coisas
  rationale: דְּבָרִים pode significar palavras, coisas ou acontecimentos. Aqui retoma os acontecimentos e juízos anunciados no contexto; “coisas” preserva a amplitude do termo.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  rationale: Mantém a expressão temporal hebraica e sua ressonância bíblica, sem restringi-la por si só a um esquema escatológico específico.
- source_word: וְשַׁבְתָּ עַד
  choice: você voltará para
  rationale: שׁוּב com עַד expressa voltar-se ou retornar a alguém. “Voltará para” preserva a dimensão relacional e pactual sem inserir explicitamente o conceito interpretativo de arrependimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando o nome pessoal presente no texto hebraico.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente a forma com sufixo de segunda pessoa singular e conserva o caráter pessoal da relação pactual.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: e ouvirá a sua voz
  rationale: A expressão frequentemente inclui a ideia de atender ou obedecer. “Ouvirá a sua voz” conserva a metáfora auditiva do hebraico, enquanto a nota registra a nuance de obediência.
theological_decisions:
- issue: Alcance temporal de בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  alternative: em dias futuros
  rationale: A expressão pode apontar amplamente para um tempo futuro e não exige, isoladamente, uma leitura limitada a um esquema específico do fim dos tempos. A tradução conserva a tensão e a linguagem bíblica.
- issue: Sentido pactual de וְשַׁבְתָּ עַד יְהוָה
  choice: você voltará para Yahweh, seu Deus
  alternative: você se arrependerá e se voltará para Yahweh, seu Deus
  rationale: “Voltará” preserva o movimento relacional de retorno a Deus sem tornar explícita uma formulação doutrinária mais desenvolvida do que o verbo hebraico, por si só, requer.
- issue: Nuance de obediência em וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: ouvirá a sua voz
  alternative: obedecerá à sua voz
  rationale: A escolha mantém a imagem do original, mas a nota reconhece que, neste idioma hebraico, ouvir envolve frequentemente atender e obedecer.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “você” para a segunda pessoa singular e mantém “Yahweh” como nome divino. As notas foram posicionadas junto às expressões que explicam.
