lexical_decisions:
- source_word: וְכָל
  choice: e toda
  rationale: Preserva a conjunção e o alcance abrangente da expressão hebraica.
- source_word: הָעֲרָבָה
  choice: a Arabá
  rationale: Mantém o nome geográfico da região do vale tectônico do Jordão, em vez de reduzi-lo ao sentido genérico de “planície”.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: Expressão geográfica natural em português que conserva o sentido relacional de território situado além do Jordão segundo o ponto de referência do discurso.
- source_word: מִזְרָחָה
  choice: a leste
  rationale: Forma idiomática e clara em português para indicar o lado oriental.
- source_word: יָם הָעֲרָבָה
  choice: o mar da Arabá
  rationale: Traduz de perto a designação hebraica sem substituí-la silenciosamente pelo nome convencional posterior “mar Morto”; a identificação é dada em nota.
- source_word: תַּחַת
  choice: abaixo de
  rationale: Expressa naturalmente a relação topográfica indicada no contexto.
- source_word: אַשְׁדֹּת
  choice: as encostas de
  rationale: No uso geográfico, o termo designa declives ou encostas de uma elevação.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Transliteração portuguesa corrente do nome geográfico.
