  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: pt
  text: E toda a Arabá do outro lado do Jordão, a leste, até o mar da Arabá[a], abaixo das encostas do Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o corpo de água geralmente identificado como o Mar Morto.
