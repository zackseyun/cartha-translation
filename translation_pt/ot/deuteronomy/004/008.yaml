  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: pt
  text: E que grande nação há que tenha estatutos e juízos tão justos quanto os de toda esta lei que hoje ponho diante de vocês?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “instrução”, em vez de “lei” (hebraico: torá), embora aqui o contexto seja especificamente jurídico: “estatutos e juízos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: E que ... há
  rationale: Expressa de modo natural em português a pergunta retórica comparativa introduzida pelo hebraico, em concordância com גּוֹי, “nação”.
- source_word: גּוֹי גָּדוֹל
  choice: grande nação
  rationale: Preserva o sentido político e coletivo do hebraico e a ligação com a comparação entre os povos.
- source_word: חֻקִּים
  choice: estatutos
  rationale: Mantém o caráter formal de prescrições estabelecidas no contexto legal.
- source_word: וּמִשְׁפָּטִים
  choice: e juízos
  rationale: Conserva a dimensão judicial e distingue o termo de חֻקִּים, embora “decisões judiciais” também seja possível.
- source_word: צַדִּיקִם
  choice: tão justos
  rationale: “Justos” comunica a conformidade moral e jurídica com o que é reto; “tão” torna explícita em português a força da comparação com כְּכֹל.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: como toda esta lei
  rationale: O contexto imediato de estatutos e juízos favorece “lei”; “toda” preserva a abrangência de כֹּל, sem eliminar em nota o sentido mais amplo de תּוֹרָה.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: ponho diante de vocês
  rationale: Reproduz naturalmente a expressão hebraica de apresentar algo ao povo, sem recorrer à tradução literal pouco idiomática “dou diante”.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Mantém de forma clara e atual a ênfase temporal do hebraico.
theological_decisions:
- issue: Sentido de תּוֹרָה
  choice: lei
  alternative: instrução
  rationale: A referência explícita a “estatutos e juízos” favorece o sentido jurídico de “lei” neste versículo. A alternativa “instrução” é registrada em nota para preservar a amplitude semântica genuína do termo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “que grande nação há que tenha” preserva a forma de pergunta retórica; “vocês” comunica naturalmente o plural do hebraico.
