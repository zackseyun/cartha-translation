  to: E que grande nação há que tenha estatutos e juízos tão justos quanto os de toda esta lei que hoje ponho diante de vocês?[a]
  rationale: Apenas a construção comparativa foi ajustada para uma leitura mais clara e idiomática em português. A revisão mantém a extensão de «toda» e deixa explícito que «os de» retoma os estatutos e juízos implícitos na lei, como requer o paralelismo comparativo hebraico.
