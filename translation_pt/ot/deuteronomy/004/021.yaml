base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: pt
  text: E Yahweh se irou contra mim por causa das palavras de vocês[a] e jurou que eu não atravessaria o Jordão nem entraria na boa terra que Yahweh, o Deus de vocês, está dando a vocês como herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do que vocês disseram”.'
    reason: Alternativa idiomática para a expressão hebraica literal “por causa das palavras de vocês”.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o do título “Senhor” e seguindo a forma adotada pelo projeto.
- source_word: הִתְאַנֶּף בִּי
  choice: ficou irado comigo
  rationale: O verbo expressa ira dirigida contra alguém. “Ficou irado comigo” é claro, digno e natural em português, sem intensificar indevidamente o hebraico.
- source_word: עַל דִּבְרֵיכֶם
  choice: por causa de vocês
  rationale: No contexto, a expressão atribui a situação de Moisés ao povo; esta formulação é idiomática em português. A referência explícita a דִּבְרֵי, literalmente “palavras”, é preservada em nota como alternativa lexical genuína.
- source_word: וַיִּשָּׁבַע
  choice: e jurou
  rationale: Expressa diretamente o ato de prestar juramento e mantém a sequência narrativa do hebraico.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: que eu não atravessaria o Jordão
  rationale: 'Apresenta de modo natural em português o conteúdo do juramento: Moisés não atravessaria o rio.'
- source_word: וּלְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: nem entraria na ... terra
  rationale: “Nem” reproduz com fluidez a segunda negação coordenada, e “entraria” corresponde naturalmente ao verbo בוא neste contexto.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: a boa terra
  rationale: Tradução direta que conserva a avaliação positiva e a linguagem pactual sem especificar fertilidade ou beleza não explicitadas.
- source_word: נֹתֵן לְךָ
  choice: está dando a vocês
  rationale: O progressivo preserva o valor presente ou iminente do particípio. O plural em português torna explícito que o singular hebraico se dirige coletivamente a Israel.
- source_word: נַחֲלָה
  choice: como herança
  rationale: Comunica a terra como bem concedido e recebido por herança, preservando o tema pactual.
theological_decisions:
- issue: A relação entre a exclusão de Moisés e a responsabilidade de Israel
  choice: por causa de vocês
  alternative: por causa das palavras de vocês / por causa do que vocês disseram
  rationale: A tradução mantém a atribuição presente no versículo sem explicar como ela se relaciona com outras passagens sobre a responsabilidade de Moisés. A nota conserva a forma lexical mais literal e evita resolver a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” representa o povo de Israel como destinatário coletivo; evita-se a alternância pouco natural entre plural e singular que reproduziria mecanicamente a mudança de número nos sufixos hebraicos.
