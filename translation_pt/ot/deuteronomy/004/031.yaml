base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: pt
  text: Pois Yahweh, seu Deus, é um Deus compassivo[a]; ele não o abandonará[b], nem o destruirá, nem se esquecerá da aliança de seus pais[c], que jurou a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um Deus misericordioso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não o desamparará” ou “não o soltará”.
    reason: lexical_alternative
  - marker: c
    text: Ou “seus antepassados”. O hebraico diz literalmente “seus pais”, referindo-se aos antepassados de Israel ligados à aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação anterior e preserva com naturalidade o valor explicativo do hebraico.
- source_word: אֵל רַחוּם
  choice: um Deus compassivo
  rationale: רַחוּם expressa compaixão ou misericórdia; “compassivo” é atual, claro e preserva a ternura atribuída a Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a designação pactual e o sufixo de segunda pessoa masculina singular, dirigido individualmente a Israel.
- source_word: לֹא יַרְפְּךָ
  choice: não abandonará você
  rationale: O hifil de רפה pode indicar soltar, desamparar ou abandonar; esta escolha comunica claramente a garantia de que Deus não deixará Israel entregue a si mesmo.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: nem o destruirá
  rationale: O hifil de שׁחת significa destruir ou arruinar; “destruir” é direto e adequado ao contexto das advertências da aliança.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: nem se esquecerá da aliança
  rationale: Mantém a imagem hebraica teologicamente significativa de Deus não se esquecer de sua aliança, sem suavizá-la para “negligenciar”.
- source_word: אֲבֹתֶיךָ
  choice: seus pais
  rationale: Conserva a forma masculina e a referência histórico-pactual aos antepassados de Israel; em português bíblico corrente, “pais” pode designar os patriarcas ou antepassados.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: a qual jurou a eles
  rationale: Preserva a linguagem solene de juramento do verbo נשבע e explicita que a aliança é o referente da oração relativa.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo pelo título tradicional “SENHOR”.
- issue: Referente pactual de אֲבֹתֶיךָ
  choice: seus pais
  alternative: seus antepassados
  rationale: “Seus pais” preserva a expressão masculina do hebraico e sua possível referência específica aos pais da aliança, sem eliminar a possibilidade mais ampla de antepassados.
- issue: Alcance das formas de segunda pessoa singular
  choice: você / seu
  alternative: tu / teu; vocês / seu
  rationale: O hebraico se dirige a Israel no singular coletivo. A tradução mantém o singular, preservando a personificação da nação, com formas amplamente compreensíveis no português moderno.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. Mantém o singular coletivo dirigido a Israel, usa “Yahweh” para o nome divino e conserva a tríplice negação do hebraico. Os marcadores foram posicionados junto aos termos efetivamente comentados.
