  text: כִּ֣י אָנֹכִ֥י מֵת֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את אֵינֶ֥/נִּי עֹבֵ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֙ עֹֽבְרִ֔ים וִֽ/ירִשְׁתֶּ֕ם אֶת הָ/אָ֥רֶץ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: pt
  text: Pois eu vou morrer nesta terra[a]; não atravessarei o Jordão. Vocês, porém, atravessarão e tomarão posse[b] desta boa terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estou para morrer nesta terra”. O particípio hebraico pode indicar uma ação futura iminente.
    reason: lexical_alternative
  - marker: b
    text: Ou “possuirão” ou “herdarão”. O verbo hebraico pode designar a tomada de posse da terra como herança.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a advertência anterior, preservando de modo natural a força causal ou explicativa da conjunção.
- source_word: אָנֹכִי
  choice: eu
  rationale: O pronome independente dá certa ênfase ao falante; em português, o contraste explícito com “vocês” comunica essa ênfase sem acrescentar “eu mesmo”.
- source_word: מֵת
  choice: vou morrer
  rationale: O particípio aponta, no contexto, para a morte iminente de Moisés. “Vou morrer” exprime essa iminência de forma natural em português, sem tratá-la como morte já em curso.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: nesta terra
  rationale: “Terra” mantém o vocabulário recorrente de Deuteronômio e, aqui, designa o território a leste do Jordão onde Moisés morrerá.
- source_word: אֵינֶנִּי עֹבֵר
  choice: não atravessarei
  rationale: A construção negativa com particípio expressa que a travessia não acontecerá. O futuro é mais idiomático em português neste contexto de iminência.
- source_word: אֶת הַיַּרְדֵּן
  choice: o Jordão
  rationale: A forma tradicional e clara em português dispensa a explicitação de “rio”.
- source_word: וְאַתֶּם עֹבְרִים
  choice: Vocês, porém, atravessarão
  rationale: A conjunção estabelece contraste entre o destino de Moisés e o do povo. “Porém” torna esse contraste explícito, e o futuro comunica naturalmente a travessia iminente.
- source_word: וִירִשְׁתֶּם
  choice: tomarão posse
  rationale: No contexto da promessa da terra, o verbo indica entrar na posse do território, com possível nuance de herança. “Tomar posse” preserva o aspecto ativo sem eliminar essa nuance.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: desta boa terra
  rationale: Mantém tanto o demonstrativo quanto a avaliação positiva, preservando uma expressão característica de Deuteronômio.
theological_decisions: []
