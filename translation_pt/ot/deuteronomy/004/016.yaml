  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: pt
  text: para que não ajam de modo corrupto e façam para vocês mesmos uma imagem esculpida[a], na forma de qualquer figura, à semelhança de homem ou mulher—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que não se corrompam e façam para vocês mesmos uma imagem esculpida, uma forma de qualquer figura, uma semelhança de macho ou fêmea».'
    reason: Alternativa lexical e sintática para o hifil de שׁחת e para a formulação das categorias sexuais.
lexical_decisions:
- source_word: פֶּן
  choice: para que não
  rationale: Introduz a advertência contra um resultado indesejável e, em português, liga-se naturalmente à exortação do contexto.
- source_word: תַּשְׁחִתוּן
  choice: ajam de modo corrupto
  rationale: O hifil de שׁחת exprime aqui conduta corrupta e ruinosa na desobediência à aliança; a formulação preserva o sentido moral e ativo.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: fazendo para vocês mesmos
  rationale: Mantém o valor benefactivo-reflexivo de לָכֶם e expressa naturalmente a ação que concretizaria a corrupção advertida.
- source_word: פֶּסֶל
  choice: uma imagem esculpida
  rationale: Designa uma imagem fabricada, especialmente talhada ou esculpida; evita tanto o arcaísmo quanto a interpretação antecipada de 'ídolo'.
- source_word: תְּמוּנַת
  choice: com a forma de
  rationale: Indica forma ou aparência e introduz de maneira idiomática a expressão seguinte, sem confundi-la com תַּבְנִית.
- source_word: כָּל סָמֶל
  choice: qualquer figura
  rationale: סֶמֶל pode designar imagem ou figura com possível uso cultual; 'figura' preserva a referência visual sem estreitá-la obrigatoriamente a 'ídolo'.
- source_word: תַּבְנִית
  choice: a representação de
  rationale: Denota padrão, modelo ou semelhança; 'representação' distingue este termo de תְּמוּנָה e se ajusta às categorias que seguem.
- source_word: זָכָר אֹו נְקֵבָה
  choice: alguém do sexo masculino ou feminino
  rationale: Os termos hebraicos indicam sexo masculino e feminino, não especificamente homem e mulher adultos; esta redação torna explícita a referência pessoal sugerida pela sequência.
theological_decisions:
- issue: Terminologia relativa às imagens proibidas
  choice: Traduzir פֶּסֶל por 'imagem esculpida' e סָמֶל por 'figura'
  alternative: Traduzir respectivamente por 'imagem esculpida' e 'ídolo'
  rationale: O contexto é inequivocamente anti-idolátrico, mas os termos hebraicos sobrepõem vocabulário visual e cultual. 'Figura' conserva a amplitude lexical de סָמֶל e evita resolver no próprio substantivo aquilo que o contexto já estabelece.
- issue: Valor de תַּשְׁחִתוּן
  choice: 'Entender como ação moralmente corrupta: ''ajam de modo corrupto'''
  alternative: 'Entender reflexivamente: ''se corrompam'''
  rationale: A forma hifil admite a expressão de ação ruinosa ou corruptora. A opção escolhida preserva o caráter ativo da advertência sem negar a alternativa reflexiva.
translation_notes:
  register: Português moderno, claro e digno, com plural de tratamento em 'vocês', de ampla legibilidade brasileira. A construção participial evita uma coordenação portuguesa ambígua após 'para que não' e mostra que fabricar a imagem é a manifestação concreta da conduta corrupta. O travessão final mantém a continuidade sintática com os versículos seguintes.
