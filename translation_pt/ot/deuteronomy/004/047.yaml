  text: וַ/יִּֽירְשׁ֨וּ אֶת אַרְצ֜/וֹ וְ/אֶת אֶ֣רֶץ ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן שְׁנֵי֙ מַלְכֵ֣י הָֽ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִזְרַ֖ח שָֽׁמֶשׁ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: pt
  text: e tomaram posse da terra dele e da terra de Ogue, rei de Basã — os dois reis dos amorreus que estavam além do Jordão[a], na direção do nascer do sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do outro lado do Jordão”. A expressão hebraica é uma fórmula geográfica cujo ponto de referência depende da perspectiva narrativa.
    reason: lexical_alternative
  - marker: b
    text: Isto é, para o leste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: tomaram posse
  rationale: Em contexto de conquista territorial, ירשׁ indica ocupar ou adquirir a posse da terra, muitas vezes após desalojar seus antigos ocupantes. “Tomaram posse” comunica esse sentido com naturalidade, sem sugerir necessariamente uma herança.
- source_word: אַרְצוֹ
  choice: a terra dele
  rationale: O sufixo masculino singular retoma Seom no contexto anterior. “A terra dele” é direto, claro e mantém a repetição de “terra” presente no hebraico.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: a terra de Ogue, rei de Basã
  rationale: Reproduz de modo natural a cadeia construta hebraica e mantém “terra” em paralelo com o objeto anterior.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: os dois reis dos amorreus
  rationale: Segue de perto a construção hebraica e identifica coletivamente Seom e Ogue como reis amorreus.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: além do Jordão
  rationale: Preserva a expressão geográfica convencional e sua dependência do ponto de vista narrativo, sem fixar indevidamente qual margem está em foco.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: na direção do nascer do sol
  rationale: Conserva a imagem concreta do hebraico e, no contexto, indica claramente o leste.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução conserva a imagem hebraica do nascer do sol e a ambiguidade perspectivística da expressão relativa ao Jordão. Os marcadores foram posicionados junto às expressões que explicam.
