  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: pt
  text: desde Aroer, que fica à margem do vale do Arnom[a], até o monte Siom, isto é, Hermom[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto ao uádi do Arnom” ou “à margem do vale do Arnom”. O termo hebraico נַחַל muitas vezes designa um leito de riacho ou uma ravina, não necessariamente um rio perene.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Siom”. Compare com Deuteronômio 3:9, onde esse monte também é chamado de Siriom pelos sidônios. Aqui o próprio texto identifica Siom com Hermom.'
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: desde Aroer
  rationale: A preposição מִן indica o ponto inicial da extensão territorial; o topônimo é transliterado.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente em português a oração relativa que modifica Aroer.
- source_word: עַל שְׂפַת
  choice: à margem de
  rationale: שָׂפָה significa literalmente 'lábio, borda'; no contexto geográfico, 'à margem de' é uma equivalência idiomática.
- source_word: נַחַל אַרְנֹן
  choice: vale do Arnom
  rationale: נַחַל pode designar um vale, ravina ou leito de curso d’água, não necessariamente um rio perene; 'vale do Arnom' preserva a amplitude topográfica.
- source_word: וְ/עַד
  choice: até
  rationale: Marca o ponto final da extensão territorial de modo claro e natural.
- source_word: הַר שִׂיאֹן
  choice: monte Siom
  rationale: הַר com topônimo corresponde naturalmente a 'monte'; Siom translitera שִׂיאֹן sem confundi-lo com o conhecido topônimo Sião, escrito de outra forma em hebraico.
- source_word: הוּא
  choice: isto é
  rationale: O pronome tem aqui função explicativa, identificando o monte Siom com Hermom.
- source_word: חֶרְמוֹן
  choice: Hermom
  rationale: Forma portuguesa tradicional e reconhecível do topônimo hebraico.
