source:
  edition: WLC
  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: pt
  text: Ou será que algum deus já tentou ir tomar para si uma nação do meio de outra nação, por meio de provações, de sinais e maravilhas, de guerra, de mão poderosa e braço estendido e de grandes atos aterradores[a], tal como Yahweh, o Deus de vocês, fez por vocês no Egito, diante dos seus olhos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grandes terrores” ou “grandes feitos que causam temor”. A expressão hebraica se refere a atos que inspiram medo e assombro.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: já tentou
  rationale: Neste contexto, נסה significa tentar ou empreender uma ação. A formulação preserva a força da pergunta retórica sem sugerir que a tentativa de Deus pudesse fracassar.
- source_word: אֱלֹהִים
  choice: algum deus
  rationale: 'O substantivo funciona aqui numa comparação retórica com Yahweh e tem sentido indefinido: qualquer divindade. A inicial minúscula preserva essa força.'
- source_word: לָבוֹא לָקַחַת
  choice: ir tomar
  rationale: A sequência de infinitivos expressa movimento intencional seguido da ação de tomar para si. A expressão é direta e natural em português.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: uma nação do meio de outra nação
  rationale: Mantém a repetição marcante do hebraico e a imagem de retirar um povo de dentro de outra entidade nacional.
- source_word: בְּמַסֹּת
  choice: por meio de provações
  rationale: O termo se refere a acontecimentos de prova ou juízo ligados ao êxodo. “Provações” preserva essa amplitude sem sugerir tentações morais.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: sinais, maravilhas
  rationale: 'Preserva a combinação tradicional e semanticamente distinta: atos que assinalam algo e feitos extraordinários que causam admiração.'
- source_word: וּבְמִלְחָמָה
  choice: guerra
  rationale: Mantém o substantivo singular e a dimensão bélica da libertação do Egito.
- source_word: וּבְיָד חֲזָקָה
  choice: mão poderosa
  rationale: Expressão recorrente do êxodo que comunica poder divino de modo natural em português.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: braço estendido
  rationale: Preserva a imagem hebraica tradicional da intervenção ativa e poderosa de Deus.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: grandes atos aterradores
  rationale: O substantivo designa coisas ou atos que inspiram temor e assombro. Esta formulação torna explícito que se trata dos feitos, sem eliminar a alternativa mais literal “grandes terrores”, registrada em nota.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: como tudo o que ... fez
  rationale: Liga diretamente a pergunta retórica à totalidade dos atos de Yahweh vivenciados por Israel, em português corrente.
- source_word: לְעֵינֶיךָ
  choice: diante dos seus próprios olhos
  rationale: Conserva a ideia enfática de experiência ocular direta. O possessivo se refere coletivamente a Israel, embora a forma hebraica seja singular.
theological_decisions:
- issue: Referência a אֱלֹהִים na comparação retórica
  choice: algum deus
  alternative: Deus
  rationale: A pergunta contrapõe os atos redentores únicos de Yahweh a qualquer outra divindade; “algum deus” preserva a força polêmica sem identificar o primeiro sujeito como o Deus de Israel.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração representa o nome divino pessoal no texto hebraico e o distingue do título “Deus”.
- issue: Número gramatical na fala dirigida a Israel
  choice: vocês / seus próprios olhos
  alternative: vós / teus olhos
  rationale: O hebraico alterna o plural em “Deus de vocês” e “por vocês” com o singular coletivo em “teus olhos”. O português moderno usa “vocês” para a comunidade e mantém a referência coletiva natural sem apagar a ênfase testemunhal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “nação” e as imagens tradicionais do êxodo foram preservadas; a longa enumeração hebraica foi mantida com coordenação natural em português. O marcador da nota foi colocado junto à expressão que ele explica.
