base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: pt
  text: Pois Yahweh, seu Deus, é fogo consumidor, Deus ciumento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Deus zeloso”. O hebraico enfatiza a reivindicação exclusiva de Yahweh sobre seu povo no âmbito da aliança, especialmente no contexto da idolatria.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da advertência anterior e preserva de modo natural a força explicativa do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz o sufixo possessivo masculino singular e mantém a forma direta da aliança com Israel.
- source_word: אֵשׁ אֹכְלָה
  choice: fogo consumidor
  rationale: Preserva a imagem hebraica vívida de um fogo que consome, com formulação corrente e dignificada em português.
- source_word: הוּא
  choice: é
  rationale: A cópula portuguesa expressa naturalmente a predicação; a repetição explícita do pronome resultaria menos natural.
- source_word: אֵל
  choice: Deus
  rationale: Neste contexto, funciona como título divino em aposição à descrição precedente.
- source_word: קַנָּא
  choice: ciumento
  rationale: Comunica a reivindicação exclusiva de Yahweh sobre seu povo e sua intolerância à adoração rival, sem suavizar a tensão do termo hebraico.
theological_decisions:
- issue: Tradução do ciúme divino
  choice: Deus ciumento
  alternative: Deus zeloso
  rationale: No contexto da proibição da idolatria, “ciumento” preserva melhor a exclusividade relacional e pactual do hebraico. A alternativa “zeloso” é possível, mas pode enfraquecer essa tensão.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira e compreensão internacional. A construção concisa conserva o paralelismo e a força metafórica do hebraico.
