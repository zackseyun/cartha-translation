base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: pt
  text: Vocês se aproximaram e ficaram de pé ao sopé do monte, enquanto o monte ardia em fogo até o coração dos céus[a]—trevas, nuvem e escuridão profunda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até o meio do céu”. Em hebraico, literalmente, “até o coração dos céus”, expressão que pode indicar o meio ou as alturas do céu.
    reason: lexical_alternative
  - marker: b
    text: Ou “densas trevas” ou “profunda escuridão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: vocês se aproximaram
  rationale: O Qal consecutivo na segunda pessoa masculina plural expressa o movimento de chegar perto; a formulação é natural em português e preserva o valor narrativo.
- source_word: וַתַּעַמְדוּן
  choice: ficaram
  rationale: Neste contexto, עמד indica que o povo tomou posição e permaneceu ao pé do monte. “Ficaram” soa natural junto ao complemento locativo, sem exigir o mais rígido “permaneceram de pé”.
- source_word: תַּחַת הָהָר
  choice: ao pé do monte
  rationale: Embora תַּחַת possa significar literalmente “debaixo de”, no contexto topográfico indica a base do monte. A expressão portuguesa comunica esse sentido com clareza.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: enquanto o monte ardia em fogo
  rationale: A conjunção tem força circunstancial, e o particípio בֹּעֵר descreve uma ação contínua. “Ardia em fogo” conserva a menção explícita ao fogo e a vivacidade da cena.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: até o coração dos céus
  rationale: Mantém a imagem concreta de לֵב, “coração”, e o plural de שָׁמַיִם. A nota esclarece o sentido idiomático sem apagar a metáfora hebraica.
- source_word: חֹשֶׁךְ עָנָן וַעֲרָפֶל
  choice: trevas, nuvem e escuridão profunda
  rationale: Preserva os três elementos distintos da descrição teofânica. “Escuridão profunda” diferencia עֲרָפֶל de חֹשֶׁךְ e comunica sua densidade.
theological_decisions:
- issue: Descrição da manifestação divina no Sinai
  choice: Preservar as imagens concretas de fogo, trevas, nuvem e escuridão profunda
  alternative: Reduzir a descrição a fenômenos atmosféricos genéricos
  rationale: O texto apresenta uma manifestação divina solene e aterradora. A tradução mantém suas imagens sobrepostas sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa plural foi vertida por “vocês”, e “monte” preserva o registro bíblico corrente. A metáfora “coração dos céus” foi mantida no texto e esclarecida em nota.
