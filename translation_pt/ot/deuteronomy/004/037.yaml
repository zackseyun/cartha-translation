  terminology: “Antepassados” é o equivalente contextual mais seguro para “pais/fathers” neste uso patriarcal. “Descendência” reproduz bem o coletivo זרע. “Presença” é uma representação interpretativamente responsável de בְּפָנָיו no contexto.
