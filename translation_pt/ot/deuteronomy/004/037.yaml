base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: pt
  text: E, porque amou os seus antepassados e escolheu a descendência deles depois deles[a], ele tirou você do Egito com a sua presença[b], com o seu grande poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a descendência dele depois dele”. O hebraico emprega sufixos no singular, provavelmente tratando “seus antepassados” como um referente coletivo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por sua face” ou “diante dele”; aqui, a expressão comunica a própria presença de Deus ao tirar Israel do Egito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: E, porque
  rationale: A expressão introduz a causa do que precede; esta formulação conserva a ligação causal e soa natural em português.
- source_word: אָהַב
  choice: amou
  rationale: Tradução direta do verbo, sem acrescentar uma nuance não expressa na forma hebraica.
- source_word: אֲבֹתֶיךָ
  choice: os seus pais
  rationale: Preserva a referência masculina plural e o sentido pactual dos antepassados; no contexto, refere-se aos patriarcas.
- source_word: וַיִּבְחַר
  choice: escolheu
  rationale: Equivalente claro e corrente, sem transformar a escolha em terminologia teológica técnica posterior.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: a descendência deles depois deles
  rationale: Comunica em português o sentido coletivo contextual de זרע e ajusta os pronomes ao antecedente plural, enquanto a nota registra a forma singular do hebraico.
- source_word: וַיּוֹצִאֲךָ
  choice: ele tirou você
  rationale: A forma causativa de יצא significa fazer sair ou tirar; a segunda pessoa singular foi mantida de maneira explícita e legível.
- source_word: בְּפָנָיו
  choice: com a sua presença
  rationale: A expressão literalmente ligada à 'face' de Deus comunica aqui sua presença pessoal na libertação.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: com o seu grande poder
  rationale: Reproduz diretamente a ideia instrumental de força ou poder e o adjetivo 'grande'.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Com o verbo 'tirar', esta é a formulação idiomática natural em português para a saída do Egito.
theological_decisions:
- issue: Sufixos singulares coletivos em בְּזַרְעוֹ אַחֲרָיו
  choice: a descendência deles depois deles
  alternative: a descendência dele depois dele
  rationale: Embora os sufixos hebraicos sejam singulares, o antecedente 'seus pais' é plural e pode ser tratado coletivamente. O plural em português evita sugerir que apenas um patriarca esteja em vista, e a nota preserva a ambiguidade formal.
- issue: Sentido de בְּפָנָיו
  choice: com a sua presença
  alternative: diante dele / com a sua face
  rationale: No contexto, a expressão indica a presença pessoal de Deus no êxodo. A tradução escolhida conserva esse peso sem recorrer a um literalismo obscuro.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A segunda pessoa masculina singular do hebraico é expressa por “você”; “pais” mantém a forma do original, enquanto “descendência” preserva o valor coletivo de זרע.
