  text: וְ/אַתֶּם֙ הַ/דְּבֵקִ֔ים בַּ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם חַיִּ֥ים כֻּלְּ/כֶ֖ם הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/004.yaml
  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: pt
  text: Mas vocês que se apegam a Yahweh, seu Deus, estão todos vivos hoje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “permanecem unidos a” ou “estão ligados a”; a expressão indica apego estreito e lealdade a Yahweh na relação de aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Mas ... vocês
  rationale: A conjunção com o pronome independente estabelece contraste com os que morreram por causa de Baal-Peor no versículo anterior.
- source_word: הַ/דְּבֵקִים
  choice: que permanecem unidos
  rationale: O particípio de דבק descreve apego contínuo e lealdade estreita; esta formulação natural preserva tanto o aspecto presente quanto a ideia de vínculo de aliança.
- source_word: בַּ/יהוָה
  choice: a Yahweh
  rationale: A preposição marca aquele a quem o povo está unido, e o nome divino é transliterado como Yahweh.
- source_word: אֱלֹהֵי/כֶם
  choice: seu Deus
  rationale: Preserva a aposição hebraica e identifica Yahweh como o Deus dos israelitas interpelados.
- source_word: חַיִּים
  choice: estão vivos
  rationale: Expressa naturalmente em português o predicado que descreve a condição presente dos destinatários.
- source_word: כֻּלְּ/כֶם
  choice: todos vocês
  rationale: Mantém a ênfase na totalidade dos sobreviventes.
- source_word: הַ/יּוֹם
  choice: hoje
  rationale: Equivalente moderno e direto que conserva a referência temporal dêitica.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome da aliança presente diretamente no texto hebraico, sem substituir o nome por um título.
- issue: Sentido de דבק na relação com Yahweh
  choice: permanecem unidos
  alternative: se apegam; permanecem fiéis
  rationale: A escolha conserva a imagem relacional de apego estreito sem reduzir o termo apenas a obediência ou resolver toda a sua dimensão de aliança em uma paráfrase teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A colocação de “todos vocês” antes da oração relativa reproduz a ênfase contrastiva do hebraico sem soar arcaica.
