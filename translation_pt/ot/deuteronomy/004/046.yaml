base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: pt
  text: do outro lado do Jordão, no vale em frente de Bete-Peor, na terra de Seom, rei dos amorreus, que morava em Hesbom e a quem Moisés e os filhos de Israel[a] derrotaram quando saíram do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.'
    reason: Registra o equivalente coletivo idiomático sem ocultar a forma masculina plural do texto hebraico.
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: Expressa naturalmente a região além do Jordão a partir da perspectiva do orador, sem fixar uma direção geográfica que o hebraico não explicita.
- source_word: בַּגַּיְא
  choice: no vale
  rationale: גַּיְא designa um vale ou ravina; “vale” é claro e adequado à descrição topográfica.
- source_word: מוּל בֵּית פְּעוֹר
  choice: em frente de Bete-Peor
  rationale: מוּל indica posição diante ou em face de algo; a formulação é geográfica e natural em português. O topônimo é transliterado na forma portuguesa corrente.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: na terra de Seom
  rationale: אֶרֶץ pode significar terra ou território; “terra” preserva a formulação ampla e tradicional do contexto histórico-geográfico.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: rei dos amorreus
  rationale: A cadeia construta identifica Seom como rei do povo amorreu; o plural coletivo é idiomático em português.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: que morava em Hesbom
  rationale: O particípio יוֹשֵׁב denota residência habitual. “Morava” é atual e claro, sem o arcaísmo de “habitava” ou “residia”.
- source_word: אֲשֶׁר הִכָּה
  choice: a quem ... derrotaram
  rationale: נכה descreve aqui uma ação militar contra Seom. “Derrotaram” comunica o sentido contextual com naturalidade, sem exigir que o verbo isolado especifique a maneira de sua morte.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: e os filhos de Israel
  rationale: Preserva a forma masculina plural da expressão hebraica e seu valor como designação tradicional do povo; a alternativa coletiva mais idiomática é registrada em nota.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: quando saíram do Egito
  rationale: O infinitivo construto com בְּ exprime circunstância temporal. A tradução é fluente e mantém explícita a referência ao êxodo.
theological_decisions:
- issue: Designação pactual com gênero em וּבְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A redação principal conserva a expressão masculina plural do hebraico, enquanto a nota reconhece seu uso coletivo como nome do povo, sem alterar silenciosamente a forma da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas onomásticas correntes em português (Jordão, Bete-Peor, Seom e Hesbom). A frase mantém a continuidade sintática do versículo, que começa como complemento do contexto anterior. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
