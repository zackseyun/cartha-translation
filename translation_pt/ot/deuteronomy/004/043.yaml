base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: pt
  text: Bezer, no deserto[a], na região do planalto, para os rubenitas; Ramote, em Gileade, para os gaditas; e Golã, em Basã, para os manassitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na região erma”. O termo hebraico pode indicar deserto, estepe ou território pouco habitado.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Nome próprio de cidade, transliterado em forma consagrada e próxima do hebraico.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma ou estepe; “deserto” é natural em português e adequado ao contexto geográfico da Transjordânia.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: na região do planalto
  rationale: מִישֹׁר indica terreno nivelado ou planáltico. “Região do planalto” evita sugerir uma planície baixa e representa melhor as terras altas a leste do Jordão.
- source_word: לָרֻאוּבֵנִי
  choice: para os rubenitas
  rationale: O gentílico singular hebraico tem sentido coletivo ou distributivo; o plural português expressa com naturalidade a tribo beneficiária.
- source_word: רָאמֹת
  choice: Ramote
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
- source_word: בַּגִּלְעָד
  choice: em Gileade
  rationale: Forma portuguesa estabelecida para o nome regional.
- source_word: לַגָּדִי
  choice: para os gaditas
  rationale: O singular gentílico hebraico representa coletivamente os membros da tribo de Gade; o plural é idiomático em português.
- source_word: גּוֹלָן
  choice: Golã
  rationale: Transliteração portuguesa corrente do nome próprio, com marcação da tonicidade final.
- source_word: בַּבָּשָׁן
  choice: em Basã
  rationale: Forma portuguesa tradicional e reconhecível do nome regional.
- source_word: לַמְנַשִּׁי
  choice: para os manassitas
  rationale: O gentílico singular hebraico é coletivo no contexto tribal; o plural mantém o paralelismo natural com rubenitas e gaditas.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: enumeração coordenada por ponto e vírgula e “e”
  rationale: A partícula de objeto direto não possui equivalente lexical em português; sua função sintática aparece na enumeração das três cidades.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas geográficas bíblicas reconhecíveis. Empregou-se o plural nos gentílicos tribais para comunicar naturalmente o valor coletivo dos singulares hebraicos. A estrutura elíptica preserva o caráter de continuação da lista iniciada no contexto anterior.
