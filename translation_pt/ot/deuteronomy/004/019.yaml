base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: pt
  text: Tenha cuidado para que, ao levantar os olhos para o céu e ver o sol, a lua e as estrelas — todo o exército dos céus —, você não seja desviado, não se curve diante deles nem os sirva. Yahweh, seu Deus, os repartiu[a] entre todos os povos debaixo de todos os céus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destinou” ou “distribuiu”. O hebraico diz que Yahweh “repartiu” esses corpos celestes entre todos os povos; a formulação, por si só, não afirma que ele tenha aprovado que fossem adorados.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “debaixo de todos os céus”; o idioma também pode ser expresso como “debaixo de todo o céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: Tenha cuidado para que... não
  rationale: A combinação da conjunção com פן introduz uma advertência contra um possível resultado. Esta formulação expressa com naturalidade a força admonitória em português.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: ao levantar os olhos para o céu
  rationale: Preserva a imagem hebraica de erguer os olhos e, com a construção temporal, deixa claro que o simples ato de olhar não é o objeto da proibição.
- source_word: הַשֶּׁמֶשׁ ... הַיָּרֵחַ ... הַכּוֹכָבִים
  choice: o sol, a lua e as estrelas
  rationale: Equivalência lexical direta e natural para os corpos celestes enumerados.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: todo o exército dos céus
  rationale: צָבָא significa exército ou hoste e, neste contexto, designa o conjunto dos corpos celestes. A tradução preserva a metáfora sem restringi-la a seres angelicais.
- source_word: וְנִדַּחְתָּ
  choice: você não seja desviado
  rationale: O nifal de נדח comunica ser afastado ou desencaminhado. A voz passiva conserva a forma e a abertura do hebraico quanto ao agente ou à força da sedução.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: não se curve diante deles
  rationale: Preserva o gesto concreto de prostração, enquanto a expressão seguinte completa o sentido de culto idólatra.
- source_word: וַעֲבַדְתָּם
  choice: nem os sirva
  rationale: עבד pode significar servir e, em contexto cultual, prestar culto. 'Sirva' mantém o valor lexical e a combinação hebraica entre curvar-se e servir.
- source_word: אֲשֶׁר חָלַק
  choice: os repartiu
  rationale: חלק denota dividir, repartir ou atribuir. 'Repartiu' conserva a ideia distributiva sem acrescentar aprovação do culto aos astros.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Forma corrente e fiel da expressão pactual dirigida diretamente a Israel.
- source_word: לְכֹל הָעַמִּים
  choice: entre todos os povos
  rationale: Com o verbo 'repartir', 'entre' expressa naturalmente a distribuição indicada por לְ, e 'povos' corresponde ao plural עַמִּים sem introduzir a noção moderna de Estado-nação.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: debaixo de todos os céus
  rationale: Mantém a forma abrangente e enfática do idioma hebraico, ainda que o português também possa dizer 'debaixo de todo o céu'.
theological_decisions:
- issue: Sentido da afirmação de que Yahweh repartiu os corpos celestes entre todos os povos
  choice: Manter a linguagem de repartição sem dizer que Deus aprovou o culto aos astros
  alternative: Interpretar explicitamente que Deus destinou os astros ao uso dos povos ou que entregou os povos ao culto deles como juízo
  rationale: O verbo חלק sustenta o sentido de repartir ou atribuir, mas a frase não explica plenamente a natureza dessa atribuição. Como o contexto imediato proíbe a idolatria, a tradução conserva a tensão sem inserir aprovação divina nem desenvolver um motivo de juízo que não está expresso no versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção inicial distingue o ato de olhar para o céu do perigo de ser desviado à idolatria. Mantiveram-se o nome Yahweh, a metáfora 'exército dos céus' e a sequência concreta 'curvar-se... servir'.
