base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: pt
  text: Naquele tempo, Yahweh me ordenou que ensinasse a vocês decretos e juízos[a], para que os cumprissem na terra para onde vocês estão passando, a fim de tomarem posse dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estatutos e ordenanças”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a fim de herdá-la”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹתִי
  choice: me
  rationale: O objeto antecipado dá leve ênfase a Moisés; em português natural, essa ênfase é suficientemente preservada em «Yahweh me ordenou», sem a construção pesada «quanto a mim».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צִוָּה
  choice: ordenou
  rationale: Expressa instrução dotada de autoridade e se ajusta ao contexto legal e pactual.
- source_word: לְלַמֵּד
  choice: que ensinasse
  rationale: Reproduz de modo natural em português a comissão dada a Moisés para transmitir as normas a Israel.
- source_word: חֻקִּים
  choice: decretos
  rationale: Termo corrente e digno para prescrições estabelecidas, mantendo-o distinto de מִשְׁפָּטִים.
- source_word: מִשְׁפָּטִים
  choice: juízos
  rationale: Preserva a nuance jurídica e a distinção lexical do par hebraico, embora «ordenanças» também seja possível.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: para que os cumprissem
  rationale: Traduz a finalidade da instrução; «cumprir» comunica naturalmente em português o fazer efetivo de prescrições legais.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Mantém o termo geográfico e pactual característico de Deuteronômio.
- source_word: עֹבְרִים שָׁמָּה
  choice: para a qual vocês estão atravessando
  rationale: Preserva a ação iminente de atravessar para o outro lado, com o destino explicitado naturalmente em português.
- source_word: לְרִשְׁתָּהּ
  choice: a fim de tomarem posse dela
  rationale: Expressa a finalidade e o sentido de adquirir ou ocupar a terra; a possível nuance de herança é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal no texto hebraico, sem substituí-lo por um título.
- issue: Nuance de לְרִשְׁתָּהּ
  choice: tomarem posse dela
  alternative: herdá-la
  rationale: O verbo admite as ideias de possuir e herdar. O contexto imediato enfatiza a entrada e ocupação da terra, mas a tradução não exclui seu caráter de dádiva pactual; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Vocês» representa o plural dirigido a Israel; «decretos e juízos» conserva a distinção dos dois termos legais hebraicos.
