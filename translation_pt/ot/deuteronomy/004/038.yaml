  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: pt
  text: para expulsar de diante de você nações maiores e mais poderosas do que você[a], para fazer você entrar e dar a você a terra delas como herança, como hoje se vê[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para desalojar” ou “para fazer tomar posse mediante a expulsão”. O verbo hebraico pode reunir as ideias de remover os ocupantes anteriores e fazer com que outro receba a terra.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “como neste dia”, expressão que significa “como hoje se vê” ou “como é a situação hoje”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: expulsar
  rationale: No hifil, ירשׁ aqui indica retirar ou desalojar os ocupantes anteriores; como o objeto é “nações”, “expulsar” comunica com clareza a ação sem apagar sua relação com a transferência da terra.
- source_word: גּוֹיִם
  choice: nações
  rationale: É o sentido usual do termo e se ajusta ao contexto político e territorial de Deuteronômio.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: maiores e mais poderosas do que você
  rationale: A preposição מן introduz a comparação com Israel; a formulação portuguesa explicita naturalmente tanto a grandeza quanto o poder superiores.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: Preserva a imagem espacial do hebraico, indicando que as nações seriam removidas da presença e do avanço de Israel.
- source_word: לַהֲבִיאֲךָ
  choice: para fazê-lo entrar
  rationale: O hifil de בוא tem sentido causativo. “Entrar” explicita em português a ideia contextual de ser conduzido para dentro da terra.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: dar a você a terra delas
  rationale: Mantém a sintaxe direta e o destaque do texto para a terra como dádiva.
- source_word: נַחֲלָה
  choice: como herança
  rationale: Expressa uma propriedade recebida e preserva a importante linguagem da herança da terra em Deuteronômio.
- source_word: כַּיּוֹם הַזֶּה
  choice: como hoje se vê
  rationale: Traduz de modo natural o idioma deuteronômico que aponta para uma realidade presente e publicamente constatável.
theological_decisions:
- issue: Terminologia da terra da aliança em נַחֲלָה
  choice: como herança
  alternative: como propriedade
  rationale: “Herança” conserva a dimensão de dádiva recebida e a conexão lexical com o tema da terra em Deuteronômio, sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” no singular para refletir o destinatário coletivo personificado. A repetição de “para” preserva a sequência das construções de finalidade do hebraico; “como hoje se vê” evita um literalismo pouco natural sem perder a referência à evidência presente.
