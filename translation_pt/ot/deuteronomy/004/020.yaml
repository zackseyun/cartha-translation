base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: pt
  text: Mas Javé tomou vocês e os tirou da fornalha de ferro, do Egito, para serem para ele um povo de herança[a], como hoje se vê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu próprio povo” ou “um povo que lhe pertence”. O hebraico diz literalmente “para serem para ele um povo de herança”.
    reason: A expressão hebraica pode ser vertida de forma mais idiomática como linguagem de posse, mas o texto emprega literalmente o termo “herança”.
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera o nome divino pessoal de modo reconhecível em português e preserva seu caráter pactual.
- source_word: לָקַח
  choice: tomou
  rationale: Mantém o sentido verbal direto do hebraico, deixando que o contexto comunique também a ideia de escolha e apropriação sem explicitá-la indevidamente.
- source_word: וַיּוֹצִא
  choice: os tirou
  rationale: Expressa naturalmente em português o hifil de יצא e seu sentido causativo no contexto do êxodo.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: da fornalha de ferro
  rationale: Conserva a metáfora hebraica de um lugar de opressão intensa; 'fornalha' é uma formulação clara e tradicional em português.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Identifica explicitamente o Egito como o lugar do qual Javé tirou o povo e preserva a aposição do texto hebraico.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: para serem para ele um povo de herança
  rationale: Preserva os elementos formais da expressão — 'ser', 'para ele', 'povo' e 'herança' — sem reduzir a linguagem pactual a uma única interpretação mais fluente.
- source_word: כַּיּוֹם הַזֶּה
  choice: como são hoje
  rationale: Comunica em português atual que a condição descrita permanece uma realidade observável no presente do discurso.
theological_decisions:
- issue: Linguagem pactual de posse em לְעַם נַחֲלָה
  choice: um povo de herança
  alternative: seu próprio povo; um povo que lhe pertence
  rationale: A tradução mantém o substantivo 'herança' e a construção 'para ele', preservando a tensão entre herança, posse e pertença sem converter o texto em uma paráfrase doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição formal da expressão 'para ele' foi mantida para representar לוֹ, embora seja menos idiomática. O marcador da nota foi colocado junto à expressão que ela esclarece.
