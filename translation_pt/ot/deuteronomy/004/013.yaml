  naturalness: A redação atual deixa a aposição “as Dez Palavras” sintaticamente solta depois de “que lhes ordenou cumprir”, e a sequência de vírgulas torna a frase difícil de processar em português. Travessões delimitam a aposição e permitem que o pronome “as” retome inequivocamente “as Dez Palavras”.
  terminology: “Aliança” é o termo estabelecido e apropriado para בְּרִית. “As Dez Palavras” conserva a designação literal hebraica; a nota registra de modo apropriado a forma tradicional “os Dez Mandamentos”. “Cumprir” é uma tradução natural e suficientemente fiel de לַעֲשׂוֹת neste contexto.
