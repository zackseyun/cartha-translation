  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: pt
  text: Ele lhes declarou a sua aliança — as Dez Palavras —, que lhes ordenou cumprir, e as escreveu em duas tábuas de pedra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: declarou
  rationale: O hifil de נגד significa tornar conhecido ou declarar. “Declarou” preserva o tom solene e pactual sem soar arcaico.
- source_word: בְּרִיתוֹ
  choice: a sua aliança
  rationale: “Aliança” é o equivalente português estabelecido para בְּרִית e comunica um vínculo solene e obrigatório, sem reduzi-lo a um tratado meramente político.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: que lhes ordenou cumprir
  rationale: “Ordenou” representa צִוָּה, enquanto “cumprir” expressa de modo natural em português a execução exigida por לַעֲשׂוֹת no contexto da aliança. Evita a formulação pouco idiomática “ordenou fazer” sem enfraquecer a obrigação.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: as Dez Palavras
  rationale: A expressão hebraica significa literalmente “as dez palavras”. Esta forma preserva a designação do texto de origem; a expressão tradicional “Dez Mandamentos” é mantida em nota.
- source_word: וַיִּכְתְּבֵם
  choice: e as escreveu
  rationale: כתב é o verbo comum para “escrever”. O pronome feminino retoma naturalmente “as Dez Palavras” em português.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: duas tábuas de pedra
  rationale: A construção indica duas tábuas feitas de pedra. A tradução é clara, idiomática e preserva a cadência tradicional.
theological_decisions:
- issue: Tradução de עֲשֶׂרֶת הַדְּבָרִים
  choice: as Dez Palavras
  alternative: os Dez Mandamentos
  rationale: O texto hebraico chama as estipulações da aliança de “as Dez Palavras”. A tradução principal segue essa nomenclatura original, enquanto a forma tradicional e amplamente conhecida é registrada em nota, sem ser imposta ao texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O uso de “lhes” traduz o plural לָכֶם/אֶתְכֶם sem regionalizar excessivamente a forma de tratamento. A sequência apositiva do hebraico foi preservada, sem inserir uma explicação interpretativa como “isto é”.
