  text: וְ/שָׁמַרְתָּ֞ אֶת חֻקָּ֣י/ו וְ/אֶת מִצְוֺתָ֗י/ו אֲשֶׁ֨ר אָנֹכִ֤י מְצַוְּ/ךָ֙ הַ/יּ֔וֹם אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וּ/לְ/בָנֶ֖י/ךָ אַחֲרֶ֑י/ךָ וּ/לְמַ֨עַן תַּאֲרִ֤יךְ יָמִים֙ עַל הַ֣/אֲדָמָ֔ה אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: pt
  text: Portanto, guarde os estatutos e os mandamentos dele que hoje ordeno a você, para que tudo vá bem com você[a] e com seus filhos depois de você[b], e para que você prolongue os seus dias na terra[c] que Yahweh, seu Deus, lhe dá por todos os seus dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “para que seja bom para você”. A expressão hebraica significa que as coisas irão bem com a pessoa.
    reason: lexical_alternative
  - marker: b
    text: “Filhos” também pode ser traduzido como “filhos homens” ou, em sentido mais amplo, “descendentes”, conforme a abrangência do termo neste contexto.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sobre a terra”. Em português, “na terra” é a forma mais natural desta expressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Portanto, guarde
  rationale: O verbo שׁמר, em contexto de aliança, significa guardar ou observar. O imperativo português comunica a força exortativa da forma hebraica, e “portanto” liga a ordem à argumentação anterior.
- source_word: חֻקָּיו וְאֶת־מִצְוֺתָיו
  choice: os estatutos e os mandamentos dele
  rationale: “Estatutos” preserva a ideia de prescrições estabelecidas em חֻקִּים, enquanto “mandamentos” traduz מִצְוֹת e mantém a distinção lexical entre os dois termos.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje ordeno a você
  rationale: A formulação é natural em português, conserva a situação imediata do discurso e deixa claro que Moisés é quem transmite as ordens divinas mencionadas.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: para que tudo vá bem com você
  rationale: A expressão hebraica ייטב לְ indica bem-estar ou que as coisas corram bem. Esta formulação transmite o sentido idiomático sem restringi-lo a prosperidade material.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: e com seus filhos depois de você
  rationale: בָּנִים pode designar filhos, filhos homens ou descendentes. “Filhos” é natural e preserva certa amplitude, enquanto a nota registra as alternativas.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: e para que você prolongue os seus dias
  rationale: A tradução conserva a imagem hebraica de “tornar longos os dias”, compreensível em português e mais formalmente correspondente do que simplesmente “viva muito”.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: Embora עַל seja literalmente “sobre”, “na terra” é a expressão idiomática natural em português para habitação no território concedido por Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: נֹתֵן לְךָ
  choice: lhe dá
  rationale: O presente português expressa naturalmente a ação participial de Deus ao conceder a terra, sem decidir de forma excessiva entre ação em curso e dádiva iminente.
- source_word: כָּל הַיָּמִים
  choice: por todos os seus dias
  rationale: A expressão comunica duração por toda a vida e preserva a ênfase temporal do hebraico, embora o possessivo esteja implícito no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em forma transliterada, sem substituí-lo por um título.
- issue: Relação entre obediência, bem-estar e longevidade
  choice: Manter as duas orações de finalidade sem explicação doutrinária adicional
  alternative: Explicitar uma promessa automática ou condicionar as bênçãos com linguagem interpretativa
  rationale: O hebraico associa a observância dos mandamentos ao bem-estar geracional e à duração dos dias na terra. A tradução mantém essa tensão pactual sem transformá-la numa regra universal de prosperidade nem enfraquecer a promessa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta e vocabulário pactual reconhecível. Emprega “a você/lhe” para evitar regionalismo excessivo e mantém a imagem “prolongue os seus dias”, sem sacrificar a compreensão.
