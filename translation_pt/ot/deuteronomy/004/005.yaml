source:
  edition: WLC
  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: pt
  text: Vejam[a], eu lhes ensinei estatutos e juízos[b], conforme Yahweh, meu Deus, me ordenou, para que vocês os cumpram no meio da terra[c] para a qual estão indo, a fim de tomar posse dela[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz o imperativo no singular, dirigindo-se a Israel como um todo: «Veja».'
    reason: grammatical_number
  - marker: b
    text: Também pode ser traduzido por «decretos e ordenanças».
    reason: lexical_alternative
  - marker: c
    text: Muitas traduções simplificam a expressão hebraica para «na terra».
    reason: lexical_alternative
  - marker: d
    text: 'Ou: «para herdá-la». O hebraico também explicita a direção «para lá», aqui expressa por «para a qual estão indo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Vejam
  rationale: O imperativo hebraico está no singular e se dirige a Israel como unidade coletiva. O plural «Vejam» transmite naturalmente em português a exortação dirigida ao povo, enquanto a nota registra a forma gramatical do original.
- source_word: לִמַּדְתִּי אֶתְכֶם
  choice: eu lhes ensinei
  rationale: O perfeito apresenta o ensino de Moisés como já realizado e relevante para a exortação presente. «Lhes» representa os destinatários plurais sem tornar a frase pesada.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: estatutos e juízos
  rationale: Mantém o registro jurídico e distingue as prescrições estabelecidas dos juízos ou determinações legais, sem reduzir ambos a um termo genérico como «leis».
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Expressa que o ensino de Moisés corresponde ao que Deus lhe ordenou; é mais natural aqui do que a construção mais enfática «assim como».
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, meu Deus
  rationale: Translitera o nome divino expresso no texto hebraico e conserva a relação pessoal indicada por «meu Deus».
- source_word: לַעֲשׂוֹת כֵּן
  choice: para que vocês os cumpram
  rationale: O infinitivo indica a finalidade prática do ensino. «Os» retoma naturalmente «estatutos e juízos», e «cumpram» é idiomático para pôr normas em prática, embora o hebraico diga literalmente «fazer assim».
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: no meio da terra
  rationale: Preserva a expressão espacial בְּקֶרֶב, em vez de simplificá-la para apenas «na terra».
- source_word: אֲשֶׁר אַתֶּם בָּאִים שָׁמָּה
  choice: em que estão entrando
  rationale: A construção portuguesa integra de modo natural o relativo e a ideia de movimento para o lugar; o valor direcional de שָׁמָּה fica implícito em «entrando».
- source_word: לְרִשְׁתָּהּ
  choice: para tomar posse dela
  rationale: ירשׁ, no contexto da terra, pode significar possuir, tomar posse ou herdar. «Tomar posse» conserva a ação de entrar para possuir sem impor exclusivamente a nuance de herança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. «Yahweh» preserva o nome pactual e evita substituí-lo por um título, sem introduzir uma interpretação denominacional.
- issue: Agência humana em לַעֲשׂוֹת כֵּן
  choice: para que vocês os cumpram
  alternative: para fazer assim
  rationale: A construção foi entendida como finalidade do ensino dirigido ao povo. Isso não acrescenta uma tese teológica sobre mérito ou capacidade humana; apenas explicita o sujeito contextual da obediência.
- issue: Sentido de ירשׁ na posse da terra
  choice: tomar posse dela
  alternative: herdá-la
  rationale: O verbo admite a ideia de herdar ou possuir. A opção escolhida mantém aberta a dimensão de dom prometido e a ação histórica de ocupar a terra, sem resolver a tensão em favor de apenas uma delas.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas correntes no Brasil («vocês», «lhes»). O plural natural em «Vejam» e «vocês» representa a fala ao povo, enquanto a nota preserva o singular coletivo hebraico. A formulação mantém o registro jurídico de «estatutos e juízos» e evita a redundância pouco natural de uma versão estritamente literal de שָׁמָּה e do sufixo em לְרִשְׁתָּהּ.
