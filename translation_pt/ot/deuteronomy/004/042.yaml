base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: pt
  text: para que aquele que matar o seu próximo sem intenção[a], e que antes não o odiava[b], possa fugir para uma dessas cidades e viva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sem conhecimento”; neste contexto jurídico, indica que a morte não foi intencional.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de ontem ou de anteontem”, expressão idiomática que significa “anteriormente” ou “antes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: para que ... possa fugir
  rationale: O infinitivo construto com ל expressa propósito e retoma a separação das cidades no versículo anterior; a oração final é natural em português.
- source_word: רוֹצֵחַ אֲשֶׁר יִרְצַח
  choice: aquele que matar
  rationale: Neste contexto de cidades de refúgio, o substantivo não implica necessariamente assassinato culpável. Esta formulação jurídica evita tanto o arcaísmo quanto a atribuição indevida de culpa.
- source_word: רֵעֵהוּ
  choice: seu próximo
  rationale: “Próximo” preserva o sentido relacional e jurídico usual de רֵעַ.
- source_word: בִּבְלִי דַעַת
  choice: sem intenção, sem ter conhecimento
  rationale: A expressão significa literalmente “sem conhecimento”; no contexto legal, indica que a morte não foi deliberada. A formulação mantém tanto o sentido contextual quanto a forma lexical.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: e que ... não o odiava
  rationale: O particípio descreve uma disposição contínua anterior, expressa naturalmente pelo imperfeito em português.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: antes
  rationale: O idioma hebraico, literalmente relacionado a “ontem e anteontem”, significa anteriormente ou de longa data neste contexto.
- source_word: אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: para uma dessas cidades
  rationale: Mantém o demonstrativo e a referência imediata às cidades designadas.
- source_word: וָחָי
  choice: e continuar vivo
  rationale: 'Explicita em português corrente o resultado jurídico de alcançar a cidade: ter a vida preservada.'
