  terminology: «Aquele que matar» evita corretamente atribuir culpa homicida ao refugiado. «Próximo» é adequado para רֵעֵהוּ. A nota sobre o idiomatismo temporal deve dizer «de ontem ou de anteontem», não «desde ontem e anteontem».
