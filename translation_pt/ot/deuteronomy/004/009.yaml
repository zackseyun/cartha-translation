base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: pt
  text: Apenas guarde-se e cuide de si com todo o cuidado,[a] para que você não se esqueça das coisas que os seus olhos viram e para que elas não se afastem do seu coração durante todos os dias da sua vida. Faça com que seus filhos e os filhos de seus filhos as conheçam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guarde a sua vida com todo o cuidado”. A palavra hebraica traduzida por “si” também pode designar a vida; aqui se refere à pessoa inteira, não necessariamente a uma alma imaterial.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a seus filhos e aos filhos de seus filhos”. O termo hebraico masculino pode referir-se especificamente a filhos homens ou, neste contexto, aos filhos e descendentes em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק הִשָּׁמֶר לְךָ
  choice: Apenas tenha muito cuidado consigo mesmo
  rationale: רַק dá forte ênfase restritiva, e a construção reflexiva הִשָּׁמֶר לְךָ exige vigilância pessoal. A formulação é clara e natural em português, sem enfraquecer a advertência.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: e guarde bem a sua vida
  rationale: נֶפֶשׁ pode designar a vida ou a própria pessoa, não necessariamente uma alma imaterial. “Guarde bem a sua vida” conserva a imagem de proteção e evita impor uma dicotomia antropológica.
- source_word: פֶּן תִּשְׁכַּח ... וּפֶן יָסוּרוּ
  choice: para que você não se esqueça ... nem permita que elas se afastem
  rationale: פֶּן introduz aquilo que deve ser evitado. A segunda oração hebraica diz literalmente que as coisas não devem afastar-se; a formulação portuguesa preserva a metáfora e torna clara a responsabilidade do ouvinte.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: as coisas que os seus olhos viram
  rationale: דְּבָרִים aqui se refere a acontecimentos ou coisas observáveis. A expressão mantém a ênfase hebraica no testemunho ocular direto.
- source_word: מִלְּבָבְךָ
  choice: do seu coração
  rationale: Mantém a metáfora hebraica; neste contexto, coração abrange memória, entendimento e vontade, não apenas emoções.
- source_word: וְהוֹדַעְתָּם
  choice: Faça ... que ... as conheçam
  rationale: O Hifil de ידע significa fazer saber ou dar a conhecer. A construção comunica essa causalidade com naturalidade em português.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: seus filhos e os filhos de seus filhos
  rationale: בָּנִים pode referir-se a filhos ou, de modo representativo, à descendência. A formulação preserva a estrutura intergeracional do hebraico sem restringir necessariamente o ensino aos descendentes homens.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: “sua vida”
  alternative: “sua alma” ou “a si mesmo”
  rationale: Neste contexto, נֶפֶשׁ designa a vida ou a pessoa inteira. “Vida” preserva uma opção lexical direta sem sugerir que o mandamento se limita a uma parte imaterial do ser humano.
- issue: Alcance de בָנֶיךָ
  choice: “seus filhos” em sentido inclusivo ou representativo
  alternative: “seus filhos homens”
  rationale: O masculino plural hebraico pode referir-se à descendência em geral. O contexto trata da transmissão da memória da aliança entre gerações, sem estabelecer uma exclusão explícita das filhas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática das duas ordens de vigilância foi mantida, mas expressa sem rigidez excessiva. “Coração” conserva a imagem cultural hebraica, esclarecida pela decisão lexical sem substituir o termo no texto.
