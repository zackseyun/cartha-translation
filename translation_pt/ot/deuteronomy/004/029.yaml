  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: pt
  text: Mas, de lá, vocês procurarão Yahweh, seu Deus, e o encontrarão[a], se o buscarem de todo o coração e de toda a alma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “e você encontrará”. O hebraico não repete aqui o pronome objeto (“o”) e passa do plural (“vocês procurarão”) para o singular (“você encontrará... buscar”). Essa alternância pode apresentar Israel como coletividade e, ao mesmo tempo, como uma unidade ou dirigir a palavra a cada pessoa.
    reason: textual_grammar
  - marker: b
    text: “Alma” também pode ser traduzida aqui por “vida” ou “ser inteiro”; o hebraico néfesh muitas vezes se refere à pessoa viva como um todo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: Mas ... vocês procurarão
  rationale: O verbo בּקש indica procurar ou buscar. “Procurarão” soa natural em português e permite distinguir este verbo de דרש na oração condicional. “Mas” expressa o contraste com a dispersão descrita no contexto anterior, enquanto o futuro preserva o valor prospectivo.
- source_word: מִשָּׁם
  choice: de lá
  rationale: 'Representa diretamente a ideia locativa: mesmo a partir do lugar de dispersão entre as nações, Israel procurará Deus.'
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: “Yahweh” translitera o nome divino da aliança, e “seu Deus” mantém a fórmula pactual em linguagem portuguesa corrente.
- source_word: וּמָצָאתָ
  choice: e o encontrarão
  rationale: O objeto pronominal “o” é recuperado do referente explícito anterior, Yahweh, embora não seja repetido no hebraico. O plural produz português natural com “vocês”; a mudança hebraica para o singular é registrada em nota.
- source_word: כִּי
  choice: se
  rationale: Neste contexto, כִּי introduz a condição para encontrar Deus. “Se” preserva essa relação sem converter a condição em certeza temporal.
- source_word: תִדְרְשֶׁנּוּ
  choice: o buscarem
  rationale: דרש, em contexto de relação com Deus, comunica busca intencional e sincera. “Buscar” conserva essa força religiosa e relacional; o pronome hebraico é expresso por “o”.
- source_word: בְּכָל לְבָבְךָ
  choice: de todo o coração
  rationale: Expressão idiomática e clara para a dedicação integral da vontade, dos pensamentos e dos afetos indicada por לֵבָב.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: e de toda a alma
  rationale: “Alma” preserva a fórmula deuteronômica tradicional e compreensível, sem excluir o sentido mais amplo de vida ou ser inteiro, registrado em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e pactual revelado por Deus, sem substituí-lo por um título.
- issue: Sentido antropológico de נֶפֶשׁ
  choice: alma
  alternative: vida; ser inteiro
  rationale: Na fórmula de dedicação total, “alma” conserva a ressonância literária e teológica tradicional, enquanto a nota reconhece que נֶפֶשׁ pode designar a pessoa viva em sua totalidade.
- issue: Alternância entre plural e singular na forma de dirigir-se a Israel
  choice: Plural natural no texto, com a alternância hebraica documentada em nota
  alternative: Reproduzir literalmente “vocês procurarão ... você encontrará ... se você buscar”
  rationale: O hebraico passa do plural para o singular, dirigindo-se a Israel tanto coletivamente quanto como uma unidade pactual ou a cada membro individualmente. Reproduzir a mudança de modo literal seria artificial e potencialmente confuso em português; a nota preserva o dado textual sem impor uma única explicação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Emprega “vocês” em vez de “vós”, mantém o nome Yahweh e diferencia naturalmente os dois verbos hebraicos de busca por “procurar” e “buscar”.
