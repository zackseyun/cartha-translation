  text: תַּבְנִ֕ית כָּל רֹמֵ֖שׂ בָּ/אֲדָמָ֑ה תַּבְנִ֛ית כָּל דָּגָ֥ה אֲשֶׁר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/018.yaml
  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: pt
  text: a figura de qualquer animal que rasteja sobre o chão, a figura de qualquer peixe que está nas águas debaixo da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “debaixo da terra” retoma a linguagem bíblica tradicional para as águas abaixo da terra; compare Êxodo 20:4.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: figura
  rationale: No contexto da proibição de imagens, designa a forma visível ou representação de um ser. “Figura” é natural em português e não restringe o sentido a um ídolo esculpido.
- source_word: כָּל
  choice: qualquer
  rationale: Com os substantivos coletivos no singular, comunica de modo idiomático a abrangência distributiva da proibição.
- source_word: רֹמֵשׂ
  choice: animal que rasteja
  rationale: Expressa de maneira clara a categoria de criaturas que se deslocam junto ao solo, sem limitar indevidamente o termo a répteis.
- source_word: בָּאֲדָמָה
  choice: sobre o chão
  rationale: Aqui אֲדָמָה indica a superfície do solo onde esses animais se movem.
- source_word: דָּגָה
  choice: peixe
  rationale: O substantivo hebraico tem valor coletivo; no português, o singular após “qualquer” transmite naturalmente esse sentido.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: que vive nas águas
  rationale: Mantém a oração relativa e explicita de modo natural a existência do peixe nas águas, sem acrescentar conteúdo interpretativo relevante.
- source_word: מִתַּחַת לָאָרֶץ
  choice: debaixo da terra
  rationale: Preserva a expressão cosmológica bíblica e sua ressonância com a formulação da proibição de imagens em Êxodo 20:4.
theological_decisions:
- issue: Linguagem representacional no contexto da idolatria
  choice: a figura de qualquer...
  alternative: a semelhança de qualquer...; uma imagem de qualquer...
  rationale: “Figura” conserva a referência à forma ou representação sem restringi-la a um meio específico nem inserir no versículo a palavra “ídolo”; a força anti-idolátrica vem do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “a figura de qualquer” reproduz a estrutura enfática do hebraico. Não se acrescentou nota lexical para תַּבְנִית porque “figura” transmite adequadamente o campo semântico no texto; alternativas legítimas ficam registradas nas decisões lexicais.
