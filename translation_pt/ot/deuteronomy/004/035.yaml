  - marker: b
    text: 'Hebraico: “Yahweh, ele é Deus”; o pronome acrescenta ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: A você foi mostrado
  rationale: 'O hofal de ראה tem sentido passivo-causativo: Israel não apenas viu, mas recebeu a demonstração. A construção preserva esse valor, embora o português também admita a forma mais idiomática indicada na nota.'
- source_word: לָדַעַת
  choice: para que soubesse
  rationale: O infinitivo construto com ל expressa propósito ou resultado; esta formulação comunica naturalmente a finalidade.
- source_word: כִּי
  choice: que
  rationale: Aqui a conjunção introduz o conteúdo daquilo que Israel deveria saber, e não uma causa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: הוּא
  choice: ele
  rationale: Mantém o pronome independente e sua força enfática, sem antecipar a exclusividade expressa na oração seguinte.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: Como predicativo, identifica Yahweh como Deus; em português, omitir o artigo é a forma natural.
- source_word: אֵין עוֹד
  choice: não há outro
  rationale: Reproduz de modo claro e atual a negação de qualquer outra divindade.
- source_word: מִלְבַדּוֹ
  choice: além dele
  rationale: Expressa diretamente a exclusão indicada pela locução hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. A transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Força da afirmação de exclusividade
  choice: não há outro além dele
  alternative: não existe nenhum outro fora dele
  rationale: Preserva a afirmação monoteísta do hebraico sem acrescentar uma elaboração filosófica que não está explicitada no versículo.
- issue: Ênfase do pronome הוּא
  choice: ele é Deus
  alternative: é Deus
  rationale: A retenção do pronome reflete a ênfase sintática do hebraico sem convertê-la interpretativamente em “somente ele”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem marcada “Yahweh, ele é Deus” foi preservada para refletir a ênfase do hebraico. A formulação passiva inicial é deliberadamente próxima da estrutura da fonte; a nota oferece uma alternativa mais idiomática.
