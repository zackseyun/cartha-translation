  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: pt
  text: Tudo isso foi mostrado[a] a você, para que soubesse que Yahweh, ele é Deus[b]; não há outro além dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você foi levado a ver essas coisas”; o hebraico emprega uma forma passiva-causativa, indicando que Israel foi levado a vê-las.'
