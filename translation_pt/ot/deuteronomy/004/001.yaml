  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: pt
  text: E agora, Israel, escute os estatutos e as ordenanças[a] que eu lhes ensino a cumprir, para que vocês vivam, entrem e tomem posse[b] da terra que Yahweh[c], o Deus de seus pais, lhes dá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os decretos e as decisões judiciais”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “possuam” ou “herdem”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Mantém explícita a transição discursiva e a ligação da exortação com o relato anterior.
- source_word: שְׁמַע אֶל
  choice: escute
  rationale: Expressa atenção cuidadosa sem reduzir o verbo a mera audição nem antecipar a ideia de obediência, já presente em 'cumprir'.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: Termo jurídico claro que preserva a distinção em relação a מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: as ordenanças
  rationale: Conserva o campo jurídico e distingue o termo de 'estatutos'; 'decisões judiciais' seria possível, mas menos natural neste contexto abrangente.
- source_word: מְלַמֵּד
  choice: ensino
  rationale: O presente português comunica naturalmente a instrução em curso de Moisés.
- source_word: לַעֲשׂוֹת
  choice: a cumprir
  rationale: Em contexto legal, comunica a execução prática das determinações com mais naturalidade do que o literal 'fazer'.
- source_word: לְמַעַן תִּחְיוּ
  choice: para que vocês vivam
  rationale: Preserva claramente a relação de finalidade expressa no hebraico.
- source_word: וּבָאתֶם
  choice: entrem
  rationale: Expressa de modo natural o movimento para dentro da terra prometida.
- source_word: וִירִשְׁתֶּם
  choice: tomem posse
  rationale: Reflete o sentido concreto de ירשׁ no contexto da ocupação da terra, sem excluir totalmente suas conotações de herança.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém o termo tradicional e pactual adequado à promessa da terra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: o Deus de seus pais
  rationale: Preserva a fórmula ancestral pactual e o referente masculino específico de אָבוֹת.
- source_word: נֹתֵן
  choice: lhes dá
  rationale: O presente retrata a dádiva como ação vigente e certa no discurso, sem acrescentar aspecto futuro ausente da forma hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; 'Yahweh' conserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de ירשׁ na promessa da terra
  choice: tomem posse
  alternative: herdem; possuam
  rationale: O contexto enfatiza a entrada e apropriação concreta da terra, embora o verbo também possa trazer conotações de herança; a nota preserva essa amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular vocativo 'Israel' é seguido por formas plurais porque Moisés se dirige coletivamente ao povo. A coordenação 'vivam, entrem e tomem posse' preserva a sequência compacta do hebraico.
