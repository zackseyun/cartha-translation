  text: תַּבְנִ֕ית כָּל בְּהֵמָ֖ה אֲשֶׁ֣ר בָּ/אָ֑רֶץ תַּבְנִית֙ כָּל צִפּ֣וֹר כָּנָ֔ף אֲשֶׁ֥ר תָּע֖וּף בַּ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/017.yaml
  text: the form of any animal that is on the earth[a], the form of any winged bird that flies in the heavens[b],
translation:
  language: pt
  text: a figura[a] de qualquer animal que há sobre a terra, a figura de qualquer ave alada que voa nos céus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semelhança”, “imagem” ou “forma”. O termo hebraico se refere aqui a uma representação feita para culto.
    reason: lexical_alternative
  - marker: b
    text: Ou “no céu”. O hebraico emprega a forma plural “céus”, que também pode designar o céu visível.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: figura
  rationale: No contexto da proibição de imagens, designa a forma ou representação visível de um ser. “Figura” é natural em português e mantém a repetição do hebraico.
- source_word: כָּל
  choice: qualquer
  rationale: Diante de substantivos singulares nesta enumeração, expressa de modo idiomático qualquer integrante da categoria.
- source_word: בְּהֵמָה
  choice: animal
  rationale: O termo tem aqui sentido amplo de animal terrestre, não apenas de gado ou animal doméstico.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: que há sobre a terra
  rationale: Mantém a classificação espacial dos seres pela terra, pelos céus e, no contexto seguinte, pelas águas.
- source_word: צִפּוֹר כָּנָף
  choice: ave alada
  rationale: Reproduz naturalmente a expressão descritiva hebraica, ainda que toda ave seja normalmente entendida como dotada de asas.
- source_word: תָּעוּף
  choice: voa
  rationale: O presente exprime naturalmente uma característica geral da classe mencionada.
- source_word: בַּשָּׁמַיִם
  choice: nos céus
  rationale: Preserva o plural hebraico e o registro elevado; no contexto imediato, refere-se ao céu visível onde as aves voam.
theological_decisions:
- issue: Sentido de תַּבְנִית no contexto da idolatria
  choice: figura
  alternative: semelhança; imagem; forma
  rationale: “Figura” comunica uma representação visível sem restringir o termo a uma técnica específica nem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e a repetição de “figura” foram preservadas; “céus” mantém a forma plural do hebraico sem negar o sentido concreto de céu visível.
