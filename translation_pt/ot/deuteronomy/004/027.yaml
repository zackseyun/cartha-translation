base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: pt
  text: Yahweh espalhará vocês entre os povos, e vocês ficarão reduzidos a poucos entre as nações para onde Yahweh os levará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conduzirá” ou “impelirá”. O verbo hebraico pode significar levar, conduzir ou impelir; neste contexto de juízo e exílio, pode sugerir deslocamento forçado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: espalhará
  rationale: O hifil de פוץ expressa dispersão causada. “Espalhará” é natural em português e comunica adequadamente o juízo da dispersão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּעַמִּים
  choice: entre os povos
  rationale: עַמִּים designa povos ou grupos humanos; esta escolha também preserva a distinção lexical em relação a גּוֹיִם na sequência.
- source_word: וְנִשְׁאַרְתֶּם
  choice: vocês serão deixados
  rationale: A forma nifal apresenta o grupo como o remanescente resultante do juízo; a construção passiva conserva essa nuance.
- source_word: מְתֵי מִסְפָּר
  choice: em pequeno número
  rationale: Expressa de modo idiomático a ideia hebraica de pessoas tão poucas que podem ser contadas.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Neste contexto, גּוֹיִם se refere às nações estrangeiras em geral.
- source_word: אֲשֶׁר יְנַהֵג ... שָׁמָּה
  choice: para onde ... os expulsará
  rationale: A expressão locativa é vertida naturalmente por “para onde”. נהג pode significar conduzir ou impelir; “expulsará” ressalta o deslocamento forçado no contexto de juízo e exílio.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o nome divino; mantê-lo preserva sua função de nome pessoal e pactual.
- issue: Agência divina na dispersão e no exílio
  choice: Yahweh espalha e expulsa o povo
  alternative: Uma formulação impessoal da dispersão
  rationale: Os verbos hebraicos apresentam explicitamente Yahweh como agente do juízo; a tradução conserva essa tensão teológica sem suavizá-la.
- issue: Sentido de נהג no destino do exílio
  choice: expulsará
  alternative: conduzirá
  rationale: O contexto favorece deslocamento coercivo, mas a amplitude lexical do verbo é reconhecida em nota.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês”, amplamente compreensível no Brasil e em outros contextos lusófonos. Mantém-se a distinção entre “povos” e “nações” e evita-se linguagem denominacional.
