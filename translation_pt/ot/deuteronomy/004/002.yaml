  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: pt
  text: Não acrescentem nada à palavra que eu lhes ordeno, nem tirem nada dela, para que guardem os mandamentos de Yahweh, seu Deus, que eu lhes ordeno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: acrescentem nada à
  rationale: A construção com יסף no hifil e עַל proíbe adicionar algo ao conteúdo ordenado. A formulação negativa com “nada” é idiomática em português e mantém a força do hebraico.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: דָּבָר pode significar “palavra”, “assunto” ou “coisa”; aqui designa coletivamente a instrução de Moisés. “A palavra” preserva o singular e sua dimensão verbal.
- source_word: מְצַוֶּה
  choice: ordeno
  rationale: O particípio retrata a ação em curso na situação discursiva. O presente do indicativo é a forma mais natural em português.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: tirem nada dela
  rationale: גרע indica diminuir ou retirar. “Tirar dela” forma um contraste natural com “acrescentar à” e o pronome feminino retoma “palavra”.
- source_word: לִשְׁמֹר
  choice: para que guardem
  rationale: O infinitivo com ל expressa propósito ou resultado. “Para que guardem” conserva essa relação sem resolver mais precisamente a possível nuance entre finalidade e consequência.
- source_word: מִצְוֺת
  choice: os mandamentos
  rationale: No contexto legal e pactual, “mandamentos” é a tradução corrente e digna do plural מצות.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa diretamente o nome divino no texto hebraico, sem substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Na fórmula pactual com YHWH, אֱלֹהִים tem referente singular. “Seu Deus” é natural e mantém a referência coletiva aos ouvintes.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio יהוה. “Yahweh” o representa diretamente; “SENHOR” é a substituição tradicional por um título, mas não foi adotada no texto principal.
translation_notes:
  register: Português moderno, claro e solene, com imperativos na terceira pessoa do plural (“não acrescentem”, “nem tirem”), amplamente compreensíveis no Brasil e em outras comunidades lusófonas. A repetição de “eu lhes ordeno” conserva a ênfase do hebraico.
