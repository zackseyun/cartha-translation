  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: pt
  text: E esta é a lei que Moisés pôs diante dos filhos de Israel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “o povo de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Esta é
  rationale: O conjunto formado pela conjunção e pelo demonstrativo introduz uma nova seção. Em português, “Esta é” mantém com naturalidade a força de apresentação; a ligação com o contexto pode ficar implícita.
- source_word: הַתּוֹרָה
  choice: a lei
  rationale: Embora תּוֹרָה também possa significar “instrução”, aqui funciona como título para a lei ou instrução pactual apresentada por Moisés. “A lei” é clara, tradicional e adequada ao contexto.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo simples reproduz de modo natural a relação sintática do hebraico.
- source_word: שָׂם
  choice: pôs diante
  rationale: שׂוּם significa pôr, colocar ou estabelecer. Com לִפְנֵי, “pôs diante” preserva a imagem hebraica da apresentação pública da lei.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Neste contexto, indica que a lei foi apresentada à audiência; “diante de” é conciso e idiomático.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: A expressão masculina plural é preservada formalmente, ao mesmo tempo que funciona no contexto como designação coletiva do povo descendente de Israel.
theological_decisions:
- issue: Designação nacional de gênero em בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A formulação conserva a forma masculina e a linguagem de descendência presentes no hebraico, sem negar que a expressão designa coletivamente a nação inteira. A nota registra alternativas mais idiomáticas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A redação preserva a concisão e o caráter de cabeçalho do hebraico. O marcador [a] aparece no texto principal.
