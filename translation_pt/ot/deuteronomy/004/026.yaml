base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: pt
  text: 'Hoje tomo os céus e a terra por testemunhas contra vocês[a]: vocês certamente desaparecerão depressa da terra que estão atravessando o Jordão para possuir. Vocês não prolongarão os seus dias nela[b], pois certamente serão destruídos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Hoje invoco os céus e a terra para testemunhar contra vocês”.'
    reason: Alternativa lexical para a fórmula jurídica הַעִידֹתִי בָכֶם.
  - marker: b
    text: 'Ou: “Vocês não viverão muito tempo nela”.'
    reason: Alternativa idiomática para a expressão hebraica “prolongar os dias”.
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: tomo ... por testemunhas contra vocês
  rationale: 'O hifil de עוּד, com בָכֶם, tem aqui sentido jurídico e adversativo: convocar ou tomar testemunhas contra alguém. A formulação portuguesa preserva a linguagem de aliança e processo legal sem soar arcaica.'
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: os céus e a terra
  rationale: Preserva o plural morfológico de שָׁמַיִם e a fórmula solene em que a criação é chamada como testemunha.
- source_word: אָבֹד תֹּאבֵדוּן מַהֵר מֵעַל הָאָרֶץ
  choice: vocês certamente desaparecerão depressa da terra
  rationale: O infinitivo absoluto com o verbo finito intensifica a certeza. 'Desaparecerão ... da terra' comunica tanto a ruína quanto a remoção do território expressa por מֵעַל, sem confundi-la com simples morte ocorrida dentro da terra.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: que estão atravessando o Jordão para possuir
  rationale: A frase apresenta a terra como destino da travessia e objeto de posse. 'Possuir' expressa ירשׁ de modo conciso no contexto da terra da aliança.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: não prolongarão os seus dias nela
  rationale: Mantém a imagem hebraica de 'prolongar dias', ainda clara em português, e traduz עָלֶיהָ naturalmente por 'nela'.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: certamente serão destruídos
  rationale: A construção com infinitivo absoluto intensifica a ameaça. 'Certamente' conserva essa ênfase sem ampliar o sentido para aniquilação absoluta.
theological_decisions:
- issue: Fórmula de testemunho da aliança envolvendo os céus e a terra
  choice: Apresentar os céus e a terra como testemunhas contra Israel
  alternative: Parafrasear como uma advertência feita pelos céus e pela terra
  rationale: A construção pertence à linguagem jurídica da aliança. A tradução conserva esse caráter forense sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A redação mantém a solenidade jurídica da passagem, as duas construções enfáticas do hebraico e a imagem de prolongar os dias, evitando tanto arcaísmos quanto explicações doutrinárias inseridas no texto.
