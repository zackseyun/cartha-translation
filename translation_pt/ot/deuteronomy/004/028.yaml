  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: pt
  text: Ali vocês servirão a deuses, obra de mãos humanas, de madeira e de pedra, que não veem, não ouvem, não comem nem percebem cheiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: que não podem ver, ouvir, comer nem perceber cheiros.'
    reason: Alternativa que explicita a incapacidade implícita dos deuses feitos de madeira e pedra.
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: vocês servirão
  rationale: O verbo עבד pode indicar serviço ou culto. Neste aviso profético, o futuro em português comunica naturalmente a sequência hebraica e preserva a ideia de prestar culto aos falsos deuses.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo que remete às terras das nações mencionadas no contexto anterior.
- source_word: אֱלֹהִים
  choice: deuses
  rationale: Mantém o sentido lexical plural. Traduzir por “ídolos” anteciparia de modo interpretativo a descrição seguinte, que já esclarece serem objetos fabricados.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: obra de mãos humanas
  rationale: Reproduz de forma clara a cadeia construta e entende אָדָם genericamente, sem restringir a referência a pessoas do sexo masculino.
- source_word: עֵץ וָאֶבֶן
  choice: de madeira e de pedra
  rationale: No contexto, עֵץ e אֶבֶן designam os materiais de que os deuses são feitos. A preposição explicita essa relação natural em português sem alterar o sentido.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: que não veem, não ouvem, não comem nem cheiram
  rationale: Preserva as quatro negações e o ritmo cumulativo do hebraico. A formulação descreve diretamente a inatividade dos falsos deuses, sem transformar explicitamente a negação em incapacidade.
- source_word: יְרִיחֻן
  choice: cheiram
  rationale: O verbo expressa o ato de perceber pelo olfato; “cheiram” é direto, corrente e adequado à enumeração dos sentidos.
theological_decisions:
- issue: Sentido de אֱלֹהִים no contexto de idolatria
  choice: deuses
  alternative: ídolos
  rationale: “Deuses” preserva a designação do texto, enquanto a aposição “obra de mãos humanas, de madeira e de pedra” revela a crítica à idolatria sem substituir o termo por uma interpretação.
- issue: Negação simples ou incapacidade dos deuses
  choice: não veem, não ouvem, não comem nem cheiram
  alternative: não podem ver, ouvir, comer nem cheirar
  rationale: O hebraico formula cada ação com לֹא, isto é, negação simples. A incapacidade está implicada pela descrição de objetos fabricados, mas não precisa ser explicitada no texto principal.
- issue: Referência genérica de אָדָם
  choice: mãos humanas
  alternative: mãos do homem
  rationale: אָדָם é genérico aqui e se refere à fabricação por seres humanos, não especificamente por homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícito o plural da forma verbal hebraica. A repetição de “não” conserva a força retórica da denúncia, e “nem” fecha naturalmente a enumeração.
