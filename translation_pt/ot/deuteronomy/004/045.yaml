  yaml_path: translation/ot/deuteronomy/004/045.yaml
  text: These are the testimonies[a], the statutes, and the judgments that Moses spoke to the sons of Israel when they came out from Egypt.
translation:
  language: pt
  text: Estes são os testemunhos, os estatutos e as ordenanças que Moisés falou aos israelitas[a] quando eles saíram do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O demonstrativo plural introduz as categorias legais seguintes; em português, a cópula expressa torna a oração nominal natural.
- source_word: הָעֵדֹת
  choice: os testemunhos
  rationale: Preserva o sentido de testemunhos ou estipulações que dão testemunho da aliança, sem explicitar além do hebraico.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: Equivalente corrente e formal para prescrições estabelecidas em contexto jurídico.
- source_word: הַמִּשְׁפָּטִים
  choice: as ordenanças
  rationale: Comunica normas ou decisões jurídicas e mantém distinção natural em português em relação a 'estatutos'; 'julgamentos' seria possível, mas pode sugerir sobretudo atos judiciais ou condenações ao leitor moderno.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que Moisés apresentou
  rationale: דבר significa literalmente 'falou', mas, com leis como objeto, 'apresentou' exprime em português natural o ato de comunicar essas disposições, sem acrescentar solenidade indevida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos israelitas
  rationale: Equivalente idiomático e inclusivo para o etnônimo hebraico literal 'filhos de Israel'; a forma da expressão original é registrada em nota.
- source_word: בְּצֵאתָם
  choice: quando eles saíram
  rationale: A preposição com infinitivo construto e sufixo tem valor temporal; esta formulação preserva claramente esse sentido.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Expressão portuguesa natural de origem após o verbo 'sair'.
