base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: pt
  text: Tenham cuidado para não se esquecerem da aliança que Yahweh, o Deus de vocês, fez com vocês, nem fazerem para si uma imagem esculpida, à semelhança de qualquer coisa que Yahweh, seu Deus, lhes ordenou não fazer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “que Yahweh, teu Deus, te ordenou”. A proibição (“não fazer”) está implícita no contexto; compare Deuteronômio 4:16.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Tenham cuidado
  rationale: 'O imperativo nifal com לָכֶם é uma advertência reflexiva: estar alerta e guardar a si mesmo. “Tenham cuidado” expressa isso de modo natural e digno em português.'
- source_word: פֶּן
  choice: para não
  rationale: Introduz o resultado negativo contra o qual se adverte. “Para não” é claro e corrente, sem o tom arcaizante de “para que não suceda que”.
- source_word: תִּשְׁכְּחוּ
  choice: se esquecerem
  rationale: O imperfeito após פֶּן exprime a possibilidade que deve ser evitada. A construção pronominal é natural em português.
- source_word: בְּרִית
  choice: aliança
  rationale: “Aliança” é o termo português consagrado para בְּרִית e preserva seu sentido relacional e pactuário.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם / אֱלֹהֶיךָ
  choice: o Deus de vocês / seu Deus
  rationale: Representa a relação possessiva. A formulação portuguesa mantém a referência coletiva de modo fluente, embora o hebraico passe da forma plural para a singular na cláusula final.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: que ... fez com vocês
  rationale: כרת ברית é a expressão idiomática para fazer ou estabelecer uma aliança; a tradução literal “cortou” seria opaca em português.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: nem fazerem para si
  rationale: “Para si” preserva a força reflexiva-benefactiva de לָכֶם, enquanto “nem” liga naturalmente esta segunda ação à advertência negativa.
- source_word: פֶּסֶל
  choice: uma imagem esculpida
  rationale: O termo designa uma imagem produzida por entalhe ou escultura. A escolha mantém o sentido concreto sem recorrer ao arcaico “imagem de escultura”.
- source_word: תְּמוּנַת כֹּל
  choice: à semelhança de qualquer coisa
  rationale: תְּמוּנָה indica forma, aparência ou representação; “à semelhança de qualquer coisa” conserva o caráter representativo da imagem.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: que Yahweh, seu Deus, lhes ordenou não fazer
  rationale: O texto hebraico transmitido não contém uma negação expressa nesta cláusula, mas o contexto imediato torna a proibição implícita. A negação é explicitada para evitar que o português afirme o sentido contrário, e isso é documentado em nota.
theological_decisions:
- issue: Negação implícita na cláusula relativa final
  choice: Explicitar “não fazer” no texto principal.
  alternative: Traduzir formalmente “que Yahweh, seu Deus, lhes ordenou”, deixando a proibição implícita.
  rationale: Deuteronômio 4:16 e o argumento imediato proíbem a fabricação de imagens. Sem a negação, a tradução portuguesa sugeriria equivocadamente que Deus mandou fazer a imagem. A nota preserva a transparência quanto à elipse do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” traduz o povo interpelado; “seu Deus” permite uma formulação natural apesar da passagem do plural para o singular no sufixo hebraico final. O marcador [a] foi colocado junto à negação explicitada, à qual a nota efetivamente se refere.
