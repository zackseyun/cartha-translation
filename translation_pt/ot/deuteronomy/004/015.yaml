language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹׁתֵי/כֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כָּל תְּמוּנָ֔ה בְּ/י֗וֹם דִּבֶּ֨ר יְהוָ֧ה אֲלֵי/כֶ֛ם בְּ/חֹרֵ֖ב מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: pt
  text: Tenham, pois, muito cuidado consigo mesmos[b], porque vocês não viram forma alguma[a] no dia em que Yahweh lhes falou em Horebe, do meio do fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vocês não viram semelhança alguma” ou “vocês não viram imagem alguma”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “guardem-se muito quanto às suas vidas”, expressão idiomática que significa ter extremo cuidado consigo mesmos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: Tenham, pois, muito cuidado consigo mesmos
  rationale: A construção hebraica, literalmente associada a guardar-se intensamente quanto à própria vida/pessoa, funciona aqui como uma advertência reflexiva enfática. A formulação escolhida comunica isso em português natural sem transformar נֶפֶשׁ em uma afirmação técnica sobre a alma.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da advertência e mantém clara a relação causal com o fato de Israel não ter visto forma alguma.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: vocês não viram forma alguma
  rationale: תְּמוּנָה pode indicar forma, semelhança ou imagem. “Forma” preserva a referência ampla a uma manifestação visível sem restringir antecipadamente o termo a um ídolo fabricado.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Preserva a expressão temporal hebraica de maneira idiomática em português.
- source_word: דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: Yahweh lhes falou
  rationale: Mantém o nome divino e traduz אֶל de modo natural como o destinatário da fala.
- source_word: בְּחֹרֵב
  choice: em Horebe
  rationale: Forma geográfica consagrada e natural em português.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: do meio do fogo
  rationale: Reproduz a especificidade e a força visual de מִתּוֹךְ, em vez de simplificar para apenas “do fogo”.
theological_decisions:
- issue: Nuance antropológica de נֶפֶשׁ em לְנַפְשֹׁתֵיכֶם
  choice: 'expressão reflexiva: “tenham muito cuidado consigo mesmos”'
  alternative: “guardem muito as suas almas”
  rationale: No contexto, a frase é uma expressão idiomática de vigilância pessoal intensa, não uma distinção doutrinária entre alma e corpo.
- issue: Sentido de תְּמוּנָה na teofania do Horebe
  choice: “forma”
  alternative: “semelhança” ou “imagem”
  rationale: O texto destaca que nenhuma representação visível de Yahweh foi vista. “Forma” mantém a amplitude lexical e sustenta o argumento contra imagens nos versículos seguintes sem identificar o termo, já neste verso, exclusivamente com um objeto idolátrico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” explicita o destinatário coletivo. “Yahweh” preserva o nome divino; “Horebe” segue a forma portuguesa tradicional.
