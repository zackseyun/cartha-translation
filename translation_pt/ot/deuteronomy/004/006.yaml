    rationale: O hebraico começa com וְ, uma ligação coordenativa, não com um conectivo explicitamente conclusivo. «Assim» ou a omissão de conectivo evita reforçar uma inferência além do texto.
  - severity: low
    issue: A oração sobre ouvir os estatutos foi separada de «os povos».
    rationale: אֲשֶׁר יִשְׁמְעוּן («que ouvirão») modifica diretamente «os povos». Mantê-la na mesma frase reproduz melhor a estrutura e o encadeamento da fala deles.
