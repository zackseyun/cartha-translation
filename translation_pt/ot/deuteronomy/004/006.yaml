base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: pt
  text: 'Assim, observem-nos e ponham-nos em prática, pois isso é a sabedoria e o entendimento de vocês perante os povos que ouvirão todos estes estatutos[a] e dirão: “Sem dúvida[b], esta grande nação é um povo sábio e entendido”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Estatutos” traduz חֻקִּים, termo jurídico que também pode ser traduzido como “decretos” ou “ordenanças”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Somente esta grande nação é um povo sábio e entendido”. O termo hebraico רַק significa mais literalmente “somente”, mas aqui pode funcionar como exclamação enfática: “Sem dúvida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם
  choice: observem-nos e ponham-nos em prática
  rationale: No contexto da aliança, שׁמר indica observar fielmente, enquanto עשה enfatiza a execução concreta. A formulação preserva os dois aspectos em português natural.
- source_word: כִּי הִוא
  choice: pois isso é
  rationale: O pronome feminino singular retoma coletivamente as determinações mencionadas no contexto. “Isso” torna essa referência coletiva clara sem especificá-la além do hebraico.
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: a sabedoria e o entendimento de vocês
  rationale: Mantém distintos os conceitos paralelos de חכמה e בינה e conserva a ligação lexical com “sábio e entendido” no fim do versículo.
- source_word: לְעֵינֵי הָעַמִּים
  choice: perante os povos
  rationale: Expressa de modo natural o sentido literal de “aos olhos dos povos” e destaca o caráter público e observável dessa sabedoria.
- source_word: הָעַמִּים
  choice: os povos
  rationale: Preserva a distinção lexical entre עמים, aqui, e גוי, traduzido como “nação” mais adiante.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: todos estes estatutos
  rationale: “Estatutos” comunica a força jurídica de חֻקִּים e é um equivalente formal corrente.
- source_word: רַק
  choice: Sem dúvida
  rationale: Embora רַק costume significar “somente”, neste contexto pode introduzir uma conclusão enfática. “Sem dúvida” reproduz essa força exclamativa, enquanto a leitura mais literal é preservada em nota.
- source_word: עַם חָכָם וְנָבוֹן
  choice: um povo sábio e entendido
  rationale: Conserva o paralelismo com “sabedoria e entendimento” e evita fundir os dois conceitos.
theological_decisions:
- issue: Relação entre obediência e sabedoria
  choice: A observância e a prática dos estatutos manifestam publicamente a sabedoria e o entendimento de Israel.
  alternative: Os estatutos, considerados independentemente de sua prática, são a sabedoria e o entendimento de Israel.
  rationale: A sequência sintática liga a ordem de observar e praticar à declaração “pois isso é a sabedoria e o entendimento de vocês”. A tradução mantém a abrangência de “isso” e não acrescenta afirmações sobre mérito ou superioridade inerente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícita a segunda pessoa plural; “observem-nos e ponham-nos em prática” evita uma formulação artificial sem perder a dupla ênfase do hebraico. A distinção entre “povos” e “nação” foi mantida.
