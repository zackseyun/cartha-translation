  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: pt
  text: 'Pois pergunte agora sobre os dias passados, que existiram antes de você, desde o dia em que Deus criou o homem[a] na terra e de uma extremidade dos céus até a outra: acaso já aconteceu algo como este grande acontecimento, ou já se ouviu falar de algo semelhante?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a humanidade”. Neste contexto da criação, o hebraico אָדָם (“homem”) pode representar toda a humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: pergunte agora
  rationale: O imperativo com נָא expressa um apelo enfático. “Pergunte agora” preserva a exortação de modo claro e natural.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: acerca dos dias antigos
  rationale: A expressão aponta para o passado remoto. “Dias antigos” mantém a imagem temporal do hebraico e um registro digno.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: que vieram antes de você
  rationale: Comunica o sentido temporal de gerações e acontecimentos anteriores ao ouvinte coletivo.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: desde o dia em que ... criou
  rationale: Marca com clareza o ponto inicial de todo o período histórico examinado.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: É a tradução padrão neste contexto, em referência ao único Criador.
- source_word: אָדָם
  choice: o homem
  rationale: Neste contexto da criação, o singular hebraico pode representar a humanidade. “O homem” preserva essa forma representativa, enquanto a alternativa semântica é registrada em nota.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Reproduz naturalmente o valor locativo da expressão hebraica.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: e desde uma extremidade dos céus até a outra
  rationale: A formulação conserva o merismo de abrangência total, o plural “céus” e a repetição conceitual sem soar artificial em português.
- source_word: הֲנִהְיָה
  choice: acaso já aconteceu algo
  rationale: A pergunta com היה indaga se algo semelhante alguma vez ocorreu. “Acaso” reforça naturalmente o caráter retórico.
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: algo como este grande acontecimento
  rationale: דָּבָר designa aqui uma ocorrência ou acontecimento, não apenas uma palavra. A tradução mantém tanto a comparação quanto a ênfase em sua grandeza.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: ou já se ouviu falar de algo semelhante?
  rationale: O Nifal de שׁמע tem aqui o sentido de algo ter sido ouvido, relatado ou conhecido. A expressão escolhida é idiomática e mantém a força retórica.
theological_decisions:
- issue: Sentido de אָדָם no contexto da criação
  choice: o homem
  alternative: a humanidade; Adão
  rationale: O versículo percorre a história desde a criação. O singular אָדָם pode funcionar representativamente para a humanidade inteira; “o homem” preserva essa forma, e “a humanidade” permanece em nota como alternativa legítima. O nome próprio “Adão” é possível em outros contextos, mas aqui é menos provável porque o foco recai sobre a criação humana na terra.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe conserva a longa pergunta retórica do hebraico, enquanto “acaso” sinaliza sua força. O marcador [a] foi colocado imediatamente após o termo a que a nota se refere.
