revisions:
- from: 'Pois pergunte agora acerca dos dias antigos, que vieram antes de você, desde o dia em que Deus criou o homem[a] sobre a terra, e desde uma extremidade dos céus até a outra: acaso já aconteceu algo como este grande acontecimento, ou já se ouviu falar de algo semelhante?'
  to: 'Pois pergunte agora sobre os dias passados, que existiram antes de você, desde o dia em que Deus criou o homem[a] na terra e de uma extremidade dos céus até a outra: acaso já aconteceu algo como este grande acontecimento, ou já se ouviu falar de algo semelhante?'
  rationale: 'A revisão é estilística e de precisão semântica: substitui uma personificação pouco natural dos “dias” por uma expressão de anterioridade temporal mais direta e ajusta a coordenação da extensão espacial. Mantêm-se a ambiguidade representativa de אָדָם, o plural «céus», o sentido de «grande acontecimento» para דָּבָר e a força retórica das perguntas.'
  reviewer_model: gpt-5.6-terra
