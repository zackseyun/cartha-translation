  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: pt
  text: E Yahweh me deu as duas tábuas de pedra, escritas pelo dedo de Deus, e nelas estavam todas as palavras que Yahweh havia falado a vocês no monte, do meio do fogo, no dia da assembleia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino da aliança expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּתֵּן
  choice: deu
  rationale: Equivalente direto, natural e contextualmente adequado do verbo נתן.
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: as duas tábuas de pedra
  rationale: Formulação clara e corrente em português, fiel à construção hebraica.
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: escritas pelo dedo de Deus
  rationale: Mantém a imagem antropomórfica concreta; 'pelo' expressa naturalmente o valor instrumental da preposição בְּ em português.
- source_word: וַעֲלֵיהֶם
  choice: e nelas estavam
  rationale: Supre uma cópula para a oração nominal hebraica sem acrescentar a repetição interpretativa de 'escritas'.
- source_word: כְּכָל הַדְּבָרִים
  choice: todas as palavras
  rationale: No contexto das palavras pronunciadas e registradas nas tábuas, 'palavras' comunica adequadamente o sentido de דְּבָרִים.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: que Yahweh havia falado a vocês
  rationale: O mais-que-perfeito composto situa a fala antes da entrega das tábuas; 'a vocês' é idiomático em português para a fala dirigida ao povo, embora עִם literalmente possa sugerir 'com vocês'.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: do meio do fogo
  rationale: Preserva a especificidade espacial e a solenidade da expressão hebraica.
- source_word: בְּיוֹם הַקָּהָל
  choice: no dia da assembleia
  rationale: Mantém o sentido coletivo formal de קָהָל sem transformar a expressão em uma paráfrase.
theological_decisions:
- issue: Expressão antropomórfica da ação divina
  choice: pelo dedo de Deus
  alternative: pelo poder de Deus
  rationale: O hebraico emprega explicitamente a imagem do dedo de Deus; interpretá-la como 'poder' eliminaria a concretude e a tensão teológica do texto.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva o nome próprio presente no texto-fonte, distinguindo-o de títulos divinos.
- issue: Sentido de דִּבֶּר ... עִמָּכֶם
  choice: havia falado a vocês
  alternative: havia falado com vocês
  rationale: Embora עִם tenha o sentido básico de 'com', o contexto descreve palavras divinas dirigidas à assembleia; 'falado a vocês' é natural e não implica necessariamente um diálogo recíproco.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se a sequência narrativa, a imagem do 'dedo de Deus' e a expressão formal 'dia da assembleia', evitando arcaísmos e explicações doutrinárias inseridas no texto.
