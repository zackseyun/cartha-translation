  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: pt
  text: 'um povo grande e alto, os filhos de Anaque[a], que você conhece e sobre quem ouviu dizer: “Quem poderá resistir diante dos filhos de Anaque?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os anaquins”. O hebraico diz literalmente “os filhos de Anaque”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: povo
  rationale: Designa aqui um grupo étnico; “povo” é a tradução portuguesa mais natural e direta.
- source_word: גָּדוֹל וָרָם
  choice: grande e alto
  rationale: No contexto, os adjetivos descrevem o porte físico e a estatura do povo, preservando a formulação enfática do hebraico.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: os filhos de Anaque
  rationale: Mantém a expressão familiar literal do hebraico e a ligação com Anaque como nome ancestral, sem reduzi-la silenciosamente a um gentílico.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: que você conhece
  rationale: Reproduz de modo natural a referência direta a um povo já conhecido pelo interlocutor.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: e sobre quem ouviu dizer
  rationale: Liga naturalmente o ato de ouvir à declaração citada que vem em seguida, sem acrescentar conteúdo substancial.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: Quem poderá resistir diante de
  rationale: O verbo no contexto exprime manter-se firme ou fazer frente a um adversário; “resistir diante de” comunica o sentido idiomático e preserva a imagem espacial.
