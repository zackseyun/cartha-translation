  yaml_path: translation/ot/deuteronomy/009/015.yaml
  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: pt
  text: Então me virei e desci do monte, e o monte ardia em fogo, e as duas tábuas da aliança estavam nas minhas duas mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre as minhas duas mãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן וָאֵרֵד
  choice: Então me virei e desci
  rationale: Os verbos no wayyiqtol apresentam ações narrativas sucessivas. “Então” expressa naturalmente a progressão, e “me virei e desci” preserva os dois movimentos.
- source_word: מִן הָהָר
  choice: do monte
  rationale: הַר designa aqui o monte específico no qual Moisés estava; “monte” é a forma tradicional e corrente em português neste contexto.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: enquanto o monte ardia em fogo
  rationale: A oração descreve a circunstância simultânea à descida. “Ardia em fogo” mantém a menção explícita ao fogo e o vigor da expressão hebraica.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: e as duas tábuas da aliança
  rationale: “Tábuas” é o termo claro e consagrado para לֻחֹת neste contexto, e הַבְּרִית significa “a aliança”.
- source_word: עַל שְׁתֵּי יָדָי
  choice: estavam nas minhas duas mãos
  rationale: Embora עַל signifique literalmente “sobre”, a expressão descreve Moisés carregando as tábuas. “Nas minhas duas mãos” comunica isso com naturalidade e preserva a referência explícita às duas mãos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva a repetição enfática de “monte” e a menção explícita ao fogo. “Enquanto” representa a leitura circunstancial provável da conjunção hebraica sem alterar o conteúdo da cena.
