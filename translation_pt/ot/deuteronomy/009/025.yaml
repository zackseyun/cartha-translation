  source_fidelity: 'O texto português representa todos os elementos relevantes do hebraico, inclusive a retomada temporal em אֲשֶׁר הִתְנַפָּלְתִּי: “em que fiquei prostrado”. “Prostrei-me” traduz adequadamente o hitpael de נפל neste contexto de intercessão, sem sugerir uma queda acidental. “Durante os quarenta dias e as quarenta noites”, “porque” e “havia dito que destruiria vocês” refletem de modo fiel duração, causalidade, anterioridade contextual e a ação expressa por לְהַשְׁמִיד. O uso de “Yahweh” está de acordo com a decisão terminológica indicada.'
