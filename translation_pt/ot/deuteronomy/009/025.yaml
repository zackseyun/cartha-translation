  text: וָֽ/אֶתְנַפַּ֞ל לִ/פְנֵ֣י יְהוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַ/יּ֛וֹם וְ/אֶת אַרְבָּעִ֥ים הַ/לַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי אָמַ֥ר יְהוָ֖ה לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: pt
  text: Assim, prostrei-me diante de Yahweh durante os quarenta dias e as quarenta noites[a] em que fiquei prostrado, porque Yahweh havia dito que destruiria vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lancei-me por terra diante de Yahweh durante os quarenta dias e as quarenta noites”. O verbo hebraico pode destacar a prostração de Moisés em intercessão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל ... אֲשֶׁר הִתְנַפָּלְתִּי
  choice: Assim, prostrei-me ... em que fiquei prostrado
  rationale: O hitpael de נפל descreve Moisés lançando-se ao chão diante de Yahweh em intercessão. “Prostrei-me” expressa essa postura com dignidade e naturalidade. A segunda ocorrência foi mantida, pois o hebraico repete deliberadamente o verbo, mas foi variada para “fiquei prostrado” a fim de produzir português corrente sem apagar a repetição.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica presença ou posição diante de alguém. O nome divino יְהוָה é transliterado como “Yahweh”, preservando o nome da aliança presente no texto.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה
  choice: durante os quarenta dias e as quarenta noites
  rationale: Os acusativos indicam duração. “Durante” comunica isso naturalmente, e os artigos definidos refletem o período já conhecido no contexto.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da prostração e intercessão de Moisés.
- source_word: אָמַר יְהוָה
  choice: Yahweh havia dito
  rationale: O mais-que-perfeito torna clara em português a anterioridade da declaração divina em relação à prostração narrada.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: que destruiria vocês
  rationale: O infinitivo com ל após אָמַר exprime a ação que Yahweh declarou que realizaria. “Destruir” preserva a força de השמיד sem ampliá-la indevidamente para “aniquilar”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Natureza da ação de Moisés
  choice: prostrei-me ... fiquei prostrado
  alternative: caí ... caí
  rationale: Neste contexto, a forma reflexiva/intensiva de נפל indica prostração intencional em intercessão, não uma queda acidental. A tradução conserva a dimensão corporal sem explicitar no corpo do texto uma interpretação teológica além do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição do verbo hebraico foi preservada de modo idiomático, evitando tanto a redundância rígida quanto sua omissão.
