  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: pt
  text: Lembre-se — não se esqueça — de como você provocou a ira de Yahweh, seu Deus, no deserto.[a] Desde o dia em que você saiu da terra do Egito até a chegada de vocês a este lugar, vocês têm sido rebeldes contra Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de como você deixou Yahweh, seu Deus, irado no deserto”.'
    reason: Alternativa lexical para o causativo הִקְצַפְתָּ.
  - marker: b
    text: 'Literalmente, “com Yahweh”; neste contexto, a expressão tem sentido adversativo: “contra Yahweh”.'
    reason: Registra o valor básico de עִם e sua interpretação contextual após o verbo de rebelião.
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: Lembre-se — não se esqueça
  rationale: Preserva os dois verbos e a ênfase da ordem hebraica, com formulação natural em português.
- source_word: אֵת אֲשֶׁר הִקְצַפְתָּ
  choice: de como você provocou a ira de
  rationale: Expressa o conteúdo a ser lembrado e mantém a nuance causativa do hifil de קצף.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de modo direto a forma com sufixo de segunda pessoa masculina singular.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: É a expressão corrente e compreensível em português para a região erma da tradição do êxodo, sem exigir a ideia exclusiva de dunas arenosas.
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ
  choice: Desde o dia em que você saiu
  rationale: Marca naturalmente o ponto inicial do período e preserva a segunda pessoa singular.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: até a chegada de vocês a este lugar
  rationale: Preserva a mudança do singular para o plural no hebraico e representa o infinitivo construto com sufixo plural sem tornar a frase artificial.
- source_word: מַמְרִים הֱיִיתֶם
  choice: vocês têm sido rebeldes
  rationale: Comunica um padrão contínuo de rebelião ao longo do período indicado, além de preservar o plural.
- source_word: עִם יְהוָה
  choice: contra Yahweh
  rationale: Embora עִם normalmente signifique “com”, depois de מרה a relação é adversativa; “contra” comunica o sentido contextual.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Duração da rebelião de Israel
  choice: vocês têm sido rebeldes
  alternative: vocês foram rebeldes
  rationale: O período desde a saída do Egito até o local presente sugere uma conduta reiterada e contínua; o pretérito perfeito composto comunica essa duração sem ir além do texto.
- issue: Mudança de número gramatical
  choice: você ... vocês
  alternative: uniformizar tudo no plural ou no singular
  rationale: O hebraico passa do singular, que trata Israel coletivamente, ao plural. A tradução conserva essa alternância, apesar da leve mudança discursiva em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a repetição enfática inicial, o nome Yahweh e a mudança hebraica do singular para o plural. Os marcadores [a] e [b] aparecem no texto principal.
