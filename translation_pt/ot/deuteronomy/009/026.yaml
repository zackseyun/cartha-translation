  text: וָ/אֶתְפַּלֵּ֣ל אֶל יְהוָה֮ וָ/אֹמַר֒ אֲדֹנָ֣/י יְהוִ֗ה אַל תַּשְׁחֵ֤ת עַמְּ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּ/גָדְלֶ֑/ךָ אֲשֶׁר הוֹצֵ֥אתָ מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: pt
  text: 'Então orei a Yahweh e disse: “Senhor Yahweh, não destruas o teu povo e a tua herança, que resgataste por tua grandeza[a] e tiraste do Egito com mão forte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “por teu grande poder”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל־יְהוָה וָאֹמַר
  choice: Então orei a Yahweh e disse
  rationale: O encadeamento narrativo dos verbos com waw é expresso naturalmente por “Então”; אֶל indica a quem a oração é dirigida, e o nome divino é transliterado como “Yahweh”.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Preserva os dois elementos do título hebraico sem substituir nem repetir artificialmente o nome divino.
- source_word: אַל־תַּשְׁחֵת
  choice: não destruas
  rationale: Reproduz a proibição enfática sem especificar um modo de destruição não indicado no hebraico.
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: o teu povo e a tua herança
  rationale: “Herança” mantém a imagem pactual de Israel como povo que pertence a Yahweh.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: que resgataste
  rationale: פדה descreve libertação mediante resgate; “resgataste” é claro em português e preserva a linguagem de redenção do êxodo.
- source_word: בְּגָדְלֶךָ
  choice: por tua grandeza
  rationale: Traduz diretamente o substantivo גֹּדֶל, conservando sua amplitude sem reduzi-lo apenas a poder.
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם
  choice: e tiraste do Egito
  rationale: Expressa de modo natural a fórmula do êxodo; a coordenação com “e” evita uma sequência pesada de orações relativas sem alterar a relação entre as ações.
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: Mantém de perto a metáfora hebraica e o sentido básico de חָזָק.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e o distingue do título אֲדֹנָי.
- issue: Tradução do título composto אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: “Senhor Yahweh” representa de forma transparente tanto o título אֲדֹנָי quanto o nome יהוה, sem ocultar a distinção existente no original.
- issue: Referência da oração relativa אֲשֶׁר פָּדִיתָ
  choice: Mantida em relação ao conjunto “povo e herança”
  alternative: Aplicá-la somente a “herança”
  rationale: A forma hebraica permite que a oração caracterize o povo designado pelos dois termos; a tradução não restringe indevidamente seu referente.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de segunda pessoa singular para manter a invocação direta e solene. “Herança”, “resgataste” e “mão forte” preservam as imagens centrais do hebraico sem explicitação doutrinária adicional.
