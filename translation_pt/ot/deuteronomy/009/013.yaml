  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: pt
  text: 'Então Yahweh me disse: “Vi este povo, e eis que é um povo de pescoço duro.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: me disse
  rationale: A construção portuguesa “me disse” traduz naturalmente o sentido de “disse a mim”.
- source_word: לֵאמֹר
  choice: não expresso separadamente
  rationale: A fórmula hebraica introdutória “dizendo” é redundante depois de “me disse”; os dois-pontos introduzem a fala de modo natural.
- source_word: רָאִיתִי
  choice: Tenho observado
  rationale: O perfeito apresenta uma percepção já formada e relevante no momento da fala; “tenho observado” comunica uma avaliação baseada no que Yahweh viu, sem reduzi-la a um único instante.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o substantivo coletivo singular e o demonstrativo do hebraico.
- source_word: וְהִנֵּה
  choice: e ... mesmo
  rationale: “Mesmo” preserva, em português corrente, a força enfática e confirmatória de הִנֵּה sem recorrer ao mais arcaizante “eis”.
- source_word: קְשֵׁה עֹרֶף
  choice: de pescoço duro
  rationale: Preserva a metáfora hebraica de obstinação e resistência, em vez de substituí-la apenas pela interpretação “teimoso”.
- source_word: הוּא
  choice: ele é
  rationale: Concorda com o substantivo coletivo singular “povo” e mantém a predicação singular do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por título.
- issue: Força da expressão קְשֵׁה עֹרֶף
  choice: povo de pescoço duro
  alternative: povo teimoso
  rationale: A tradução mantém a imagem corporal deliberada do hebraico e sua tensão entre metáfora e significado moral.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala foi introduzida por dois-pontos, evitando o redundante “dizendo”. A expressão “pescoço duro” conserva a metáfora bíblica, embora seja menos comum na fala cotidiana.
