  naturalness: O português é claro, atual e apropriado a leitores brasileiros e internacionais. «E eis que» mantém um registro bíblico sóbrio sem ser obscuro. «Haviam se desviado» é natural e torna coerente a sequência verbal.
  terminology: «Yahweh» segue a decisão terminológica fornecida. «Bezerro de metal fundido» transmite adequadamente עֵגֶל מַסֵּכָה, e a nota registra a alternativa tradicional sem impor uma interpretação adicional.
