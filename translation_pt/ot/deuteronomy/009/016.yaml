base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: pt
  text: 'Olhei, e eis que vocês haviam pecado contra Yahweh, seu Deus: tinham feito para si um bezerro de metal fundido.[a] Vocês haviam se desviado depressa do caminho que Yahweh lhes havia ordenado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um bezerro fundido”. A expressão hebraica se refere a um bezerro feito por fundição de metal.'
    reason: Registra uma alternativa lexical mais tradicional e esclarece o processo de fabricação indicado por מַסֵּכָה.
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Olhei
  rationale: O verbo ראה normalmente significa “ver”, mas “olhei” preserva aqui o movimento narrativo que introduz a constatação marcada por וְהִנֵּה, evitando a sequência menos natural “vi, e eis que”.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: הִנֵּה chama a atenção para o que Moisés constatou. “E eis que” conserva sua força enfática e combina com o tom solene da narrativa.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: vocês haviam pecado contra Yahweh, seu Deus
  rationale: O mais-que-perfeito composto expressa adequadamente a ação anterior que Moisés recorda. Neste contexto, ל com חטא é traduzido naturalmente por “contra”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: tinham feito para si
  rationale: A construção עשה + ל indica que fizeram o objeto para uso próprio. “Para si” mantém esse valor benefactivo e concorda com o sujeito coletivo.
- source_word: עֵגֶל מַסֵּכָה
  choice: um bezerro de metal fundido
  rationale: מַסֵּכָה designa um objeto ou imagem produzido por fundição. A expressão explicita em português moderno tanto o material quanto o processo, sem reduzir o referente a uma imagem genérica.
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: Vocês se desviaram depressa do caminho
  rationale: “Desviar-se do caminho” preserva a metáfora ética e pactual de סור e דרך; “depressa” comunica a rapidez indicada por מַהֵר em linguagem natural.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: que Yahweh lhes havia ordenado
  rationale: A oração relativa modifica “caminho”. O mais-que-perfeito mantém a perspectiva retrospectiva, e “lhes” representa o objeto plural de צוה sem acrescentar ao texto a ideia explícita de “seguir”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual e representa a forma acadêmica amplamente aceita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo; “seu Deus” é natural em português brasileiro com “vocês”, embora a referência seja plural. A formulação conserva a metáfora do caminho e a estrutura enfática da constatação de Moisés.
