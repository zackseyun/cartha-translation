base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: pt
  text: Mas eles são o teu povo e a tua herança,[a] que tiraste com o teu grande poder e com o teu braço estendido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eles são o teu povo e a tua herança”. A conjunção hebraica também pode ser traduzida simplesmente por “e”; “mas” expressa o provável contraste na súplica de Moisés.'
    reason: lexical_alternative
  - marker: b
    text: “Braço estendido” é uma expressão recorrente no relato do êxodo para a poderosa ação libertadora do SENHOR.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: Mas eles são
  rationale: 'Embora ו possa significar simplesmente “e”, o contexto da intercessão de Moisés favorece valor adversativo: apesar do pecado de Israel, eles continuam sendo o povo de Deus. “Mas” expressa esse contraste com naturalidade.'
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: עַם designa aqui Israel como povo pertencente ao SENHOR; “o teu povo” é preciso, natural e preserva a linguagem da aliança.
- source_word: וְנַחֲלָתֶךָ
  choice: e a tua herança
  rationale: נַחֲלָה pode indicar herança, patrimônio ou posse atribuída. “Herança” mantém a imagem bíblica e sua força relacional sem reduzi-la à mera propriedade.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: que tiraste de lá
  rationale: O hifil de יצא significa fazer sair ou tirar. O complemento “de lá”, recuperável do contexto imediato do êxodo do Egito, torna a construção natural em português sem especificar além do contexto.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: com o teu grande poder
  rationale: A preposição בְּ tem valor instrumental, e כֹּחַ com גָּדוֹל corresponde diretamente a “grande poder”.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: e com o teu braço estendido
  rationale: A tradução conserva a metáfora antropomórfica e a fórmula característica do êxodo, na qual o braço estendido representa a atuação poderosa de Deus.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Manter literalmente “o teu braço estendido”.
  alternative: Parafrasear como “os teus atos poderosos”.
  rationale: O hebraico emprega deliberadamente uma imagem corporal recorrente na linguagem do êxodo. Preservá-la mantém sua força literária e teológica sem explicar indevidamente a metáfora.
- issue: Israel como נַחֲלָה de Deus
  choice: Traduzir por “tua herança”.
  alternative: “teu patrimônio” ou “tua posse”.
  rationale: “Herança” conserva a linguagem pactual e a imagem bíblica do povo como porção pertencente ao SENHOR, sem impor uma interpretação denominacional.
- issue: Valor da conjunção inicial וְ
  choice: Usar “Mas” para expressar o contraste contextual.
  alternative: “E eles são o teu povo e a tua herança.”
  rationale: A conjunção hebraica é ampla e pode ser apenas aditiva. No fluxo da súplica de Moisés, porém, a relação adversativa é provável; a nota preserva a alternativa formalmente possível.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes (“teu”, “tiraste”). A formulação preserva as imagens bíblicas de “herança” e “braço estendido”. Os marcadores aparecem no texto em ordem de ocorrência.
