base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: pt
  text: 'Escute, Israel: hoje você está atravessando o Jordão para entrar e desapossar[a] nações maiores e mais poderosas do que você, com cidades grandes e fortificadas até os céus[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomar posse do território de”. O verbo hebraico pode significar herdar ou tomar posse; neste contexto de conquista, também implica desapossar os habitantes anteriores.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “até os céus”, expressão hiperbólica que descreve fortificações muito altas.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע
  choice: Escute
  rationale: O imperativo singular dirige-se a Israel como uma entidade coletiva. “Escute” preserva o chamado solene à atenção em linguagem moderna e natural.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma consagrada do nome próprio em português.
- source_word: עֹבֵר הַיּוֹם
  choice: hoje você está atravessando
  rationale: O particípio com “hoje” comunica uma ação presente ou iminente e mantém a ênfase temporal do hebraico.
- source_word: אֶת־הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma geográfica convencional em português; o acréscimo de “rio” não é necessário.
- source_word: לָבֹא
  choice: para entrar
  rationale: Após a travessia do Jordão, o infinitivo indica a entrada na terra; “entrar” expressa isso de modo conciso e idiomático.
- source_word: לָרֶשֶׁת
  choice: desapossar
  rationale: No contexto de conquista, ירשׁ pode indicar tomar posse mediante a remoção dos ocupantes anteriores. “Desapossar” também se ajusta ao objeto direto “nações”, enquanto a nota conserva a alternativa lexical.
- source_word: גּוֹיִם
  choice: nações
  rationale: Equivalente usual para grupos nacionais distintos em Deuteronômio.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: maiores e mais poderosas do que você
  rationale: Preserva os dois comparativos, relativos à grandeza e à força, bem como a comparação direta com Israel.
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת
  choice: cidades grandes e fortificadas
  rationale: Formulação natural em português que mantém a descrição das cidades pertencentes às nações mencionadas.
- source_word: בַּשָּׁמָיִם
  choice: até os céus
  rationale: Mantém a imagem hiperbólica hebraica da altura extraordinária das fortificações.
theological_decisions:
- issue: Sentido de ירשׁ no contexto da conquista
  choice: desapossar
  alternative: tomar posse do território de
  rationale: O contexto favorece a ideia de remover os habitantes anteriores, mas o verbo também pode destacar a tomada de posse. A nota preserva essa amplitude sem ocultar a tensão do texto.
- issue: Descrição hiperbólica das fortificações
  choice: fortificadas até os céus
  alternative: fortificadas até o céu; fortificadas a uma altura imensa
  rationale: A tradução conserva a imagem retórica do hebraico em vez de reduzi-la a uma explicação prosaica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. O singular “você” acompanha o tratamento de Israel como entidade coletiva. As imagens e ambiguidades relevantes do hebraico foram preservadas.
