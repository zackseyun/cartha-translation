source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: pt
  text: Então me prostrei diante de Yahweh, como da primeira vez[a], durante quarenta dias e quarenta noites. Não comi pão nem bebi água, por causa de todo o pecado que vocês cometeram ao fazer o que era mau aos olhos de Yahweh, provocando-o à ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “como antes” ou “como anteriormente”. A expressão hebraica remete ao período anterior em que Moisés passou quarenta dias diante de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Então me prostrei
  rationale: O hitpael de נפל descreve Moisés lançando-se ao chão diante de Deus. “Prostrei-me” comunica com naturalidade a postura física e o contexto de intercessão; “então” representa a progressão narrativa do waw consecutivo.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica posição ou presença relacional, e “diante de” é a formulação portuguesa mais natural. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: כָּרִאשֹׁנָה
  choice: como da primeira vez
  rationale: A expressão compara esta prostração e este jejum ao período anterior de quarenta dias. A tradução mantém a referência retrospectiva sem torná-la excessivamente explícita.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: durante quarenta dias e quarenta noites
  rationale: Tradução direta da duração; “durante” torna clara e natural em português sua relação com a prostração.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: Não comi pão
  rationale: Mantém o substantivo explícito לֶחֶם, “pão”, sem generalizá-lo para “alimento” ou “nada”.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: nem bebi água
  rationale: A coordenação negativa com “nem” é idiomática em português e preserva o conteúdo direto do hebraico.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: por causa de todo o pecado de vocês
  rationale: עַל apresenta aqui a razão da prostração e do jejum. O singular חַטָּאת foi mantido com sentido coletivo.
- source_word: אֲשֶׁר חֲטָאתֶם
  choice: que vocês cometeram
  rationale: Em português, “cometer pecado” expressa naturalmente a construção em que o verbo cognato retoma o substantivo “pecado”.
- source_word: לַעֲשׂוֹת הָרַע
  choice: ao fazer o que era mau
  rationale: A formulação comunica a ação que constituiu o pecado e preserva a avaliação moral do hebraico.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora hebraica convencional de avaliação divina, plenamente compreensível em português.
- source_word: לְהַכְעִיסוֹ
  choice: provocando-o à ira
  rationale: O hiphil de כעס tem sentido causativo, “provocar à ira”. O gerúndio preserva a relação estreita com a ação anterior sem decidir rigidamente entre propósito e resultado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Relação expressa por לְהַכְעִיסוֹ
  choice: provocando-o à ira
  alternative: para provocá-lo à ira
  rationale: A construção pode apresentar propósito ou resultado/efeito. O gerúndio evita atribuir inequivocamente aos israelitas a intenção consciente de irar Yahweh, sem eliminar o vínculo causal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e preserva imagens hebraicas naturais em português, como “aos olhos de Yahweh”.
