base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: pt
  text: Deixe-me em paz[a], para que eu os destrua e apague o nome deles de debaixo dos céus[b]; e farei de você uma nação mais poderosa e mais numerosa do que ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Deixe-me em paz, e eu os destruirei e apagarei o nome deles de debaixo dos céus».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «de debaixo dos céus»; a expressão indica a eliminação deles da terra, isto é, da existência e da memória humanas.'
    reason: cultural_note
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: Deixe-me em paz
  rationale: O imperativo de רפה com מן e sufixo pronominal é idiomático e pede que Moisés cesse de intervir ou deixe Deus agir. A expressão é natural em português e não acrescenta uma ação específica ao texto.
- source_word: וְאַשְׁמִידֵם
  choice: para que eu os destrua
  rationale: שׁמד denota destruir ou aniquilar. Depois do imperativo, o waw pode expressar finalidade ou resultado; «para que» reproduz com naturalidade essa relação, preservando em nota a coordenação possível.
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: e apague o nome deles
  rationale: מחה significa apagar ou eliminar; com «nome», a expressão comunica a remoção da existência e da memória. «Apagar o nome» é claro, corrente e mantém a imagem hebraica.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: de debaixo dos céus
  rationale: A tradução conserva o plural hebraico הַשָּׁמַיִם e a construção espacial, ainda compreensível em português, enquanto a nota explica o sentido idiomático.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: e farei de você uma nação
  rationale: A construção עשה + objeto + ל indica transformar ou constituir alguém como algo. «Farei de você uma nação» é a formulação portuguesa natural e preserva esse sentido.
- source_word: עָצוּם וָרָב מִמֶּנּוּ
  choice: mais poderosa e mais numerosa do que eles
  rationale: עָצוּם expressa força ou poder, e רַב, neste contexto, grandeza numérica. O comparativo traduz מִמֶּנּוּ; «eles» retoma naturalmente o povo tratado coletivamente no hebraico.
theological_decisions:
- issue: Declaração divina de juízo e promessa de fazer de Moisés uma nação maior
  choice: Apresentar a fala como uma declaração direta e real dentro da narrativa, sem atenuar a ameaça nem explicar sua intenção.
  alternative: Sinalizar na tradução que a fala é apenas retórica ou um teste para Moisés.
  rationale: O hebraico formula diretamente o juízo e a promessa. A tradução deve preservar a tensão narrativa e teológica, deixando a interpretação da intenção divina fora do texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento «você» evita formas regionais marcadas; «Deixe-me em paz» comunica o idioma hebraico de modo corrente, e o paralelismo da sentença foi preservado.
