  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: pt
  text: Yahweh ficou muito irado com Arão[a], para destruí-lo; e naquele tempo também orei por Arão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra Arão”; neste contexto, a preposição hebraica admite as duas formas de expressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: com Arão
  rationale: Com verbo de ira, a preposição בְ pode marcar a pessoa contra quem a ira se dirige. “Com Arão” é idiomático em português; “contra Arão” permanece uma alternativa legítima.
- source_word: הִתְאַנַּף ... מְאֹד
  choice: ficou muito irado
  rationale: Reproduz o valor verbal de הִתְאַנַּף e a intensificação de מְאֹד em linguagem natural e digna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְהַשְׁמִידוֹ
  choice: a ponto de destruí-lo
  rationale: שׁמד no hifil indica causar destruição. A construção portuguesa expressa naturalmente que a ira chegou ao ponto de visar a destruição de Arão, sem especificar o modo.
- source_word: וָאֶתְפַּלֵּל
  choice: e ... orei
  rationale: O hitpael de פלל significa normalmente “orar”. O contexto e a expressão “por Arão” deixam claro o caráter intercessório sem tornar explícito além do hebraico.
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: também orei por Arão
  rationale: גַּם acrescenta a oração por Arão à intercessão anterior, e בְּעַד indica oração em favor de alguém.
- source_word: בָּעֵת הַהִוא
  choice: naquele tempo
  rationale: Equivalente temporal direto, natural em português e referencialmente ligado ao episódio narrado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” preserva-o por transliteração, sem substituí-lo pelo título “SENHOR”.
- issue: Alcance de לְהַשְׁמִידוֹ
  choice: a ponto de destruí-lo
  alternative: para destruí-lo
  rationale: A formulação preserva a severidade da ira divina sem decidir se o infinitivo deve ser entendido estritamente como propósito ou como resultado pretendido/iminente.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Irado” conserva dignidade bíblica sem soar arcaico; a ordem temporal foi ajustada levemente para fluência.
