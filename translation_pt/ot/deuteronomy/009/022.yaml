  text: וּ/בְ/תַבְעֵרָה֙ וּ/בְ/מַסָּ֔ה וּ/בְ/קִבְרֹ֖ת הַֽתַּאֲוָ֑ה מַקְצִפִ֥ים הֱיִיתֶ֖ם אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: pt
  text: E em Taberá, em Massá e em Quibrote-Hataavá[a], vocês continuaram provocando a ira de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quibrote-Hataavá significa literalmente “sepulturas do desejo” ou “sepulturas da cobiça”.
    reason: Explica o significado lexical do topônimo sem deixar de apresentá-lo como nome de lugar no texto.
lexical_decisions:
- source_word: וּבְתַבְעֵרָה
  choice: E em Taberá
  rationale: A preposição בְּ indica localização; o topônimo é transliterado em sua forma portuguesa corrente.
- source_word: וּבְמַסָּה
  choice: em Massá
  rationale: A preposição marca o lugar, e o nome próprio é preservado por transliteração. A conjunção hebraica repetida é acomodada à coordenação natural em português.
- source_word: וּבְקִבְרֹת הַתַּאֲוָה
  choice: e em Quibrote-Hataavá
  rationale: A expressão funciona como topônimo fixo e é transliterada; seu sentido literal é informado em nota.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: vocês continuaram provocando a ira
  rationale: A construção de היה com particípio expressa ação contínua ou reiterada no passado. 'Continuaram provocando' comunica esse aspecto, e 'a ira de' expressa naturalmente em português a força causativa de קצף no hifil.
- source_word: אֶת יְהוָה
  choice: de Yahweh
  rationale: O nome divino é vertido como 'Yahweh'. Embora a sintaxe portuguesa formule o resultado como 'provocando a ira de Yahweh', Yahweh continua sendo aquele cuja ira foi provocada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pactual sem substituir o nome por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os topônimos seguem formas transliteradas usuais em português. A repetição hebraica de וּבְ é levemente acomodada para evitar uma coordenação artificial, sem perder a enumeração enfática dos lugares.
