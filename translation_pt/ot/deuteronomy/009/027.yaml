  text: זְכֹר֙ לַ/עֲבָדֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב אַל תֵּ֗פֶן אֶל קְשִׁי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/אֶל רִשְׁע֖/וֹ וְ/אֶל חַטָּאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: pt
  text: Lembra-te dos teus servos, Abraão, Isaque e Jacó. Não voltes a tua atenção[a] para a teimosia[b] deste povo, nem para a sua maldade, nem para o seu pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não olhes para” ou “não consideres”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dureza” ou “obstinação”; não é a expressão específica traduzida em outros lugares por “dura cerviz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Lembra-te
  rationale: O imperativo dirige-se a Deus na intercessão de Moisés. “Lembra-te” é natural em português e preserva a linguagem de oração e aliança.
- source_word: לַעֲבָדֶיךָ
  choice: dos teus servos
  rationale: עבד pode indicar servo ou escravo; aqui funciona como designação reverente dos patriarcas em sua relação com Deus, sem destacar uma condição de escravidão.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abraão, Isaque e Jacó
  rationale: Empregam-se as formas tradicionais dos nomes, amplamente reconhecidas no português bíblico brasileiro.
- source_word: אַל תֵּפֶן אֶל
  choice: Não voltes a tua atenção para
  rationale: פנה com אֶל significa literalmente voltar-se para e, neste contexto, dar atenção ou consideração. A tradução conserva a metáfora e comunica seu sentido com clareza.
- source_word: קְשִׁי
  choice: teimosia
  rationale: O substantivo denota dureza ou obstinação. “Teimosia” expressa o sentido moral em linguagem corrente sem importar a imagem distinta de “dura cerviz” usada em outras construções hebraicas.
- source_word: הָעָם הַזֶּה
  choice: deste povo
  rationale: עם designa o povo, e o demonstrativo hebraico é preservado de modo idiomático pela contração “deste”.
- source_word: רִשְׁעוֹ
  choice: a sua maldade
  rationale: רשע indica maldade ou perversidade moral. O sufixo singular concorda com o coletivo “povo”, estrutura que permanece natural em português.
- source_word: חַטָּאתוֹ
  choice: o seu pecado
  rationale: חטאת designa aqui o pecado como ofensa moral. O possessivo singular mantém a referência coletiva ao povo e é idiomático em português.
theological_decisions:
- issue: Sentido de עבד aplicado aos patriarcas
  choice: teus servos
  alternative: teus escravos
  rationale: No contexto da oração, o termo é uma designação relacional e reverente de Abraão, Isaque e Jacó diante de Deus; a condição social de escravidão não está em primeiro plano.
- issue: Pedido para Deus não considerar o pecado do povo
  choice: Não voltes a tua atenção para
  alternative: Não consideres
  rationale: A formulação preserva a imagem verbal do hebraico sem explicar o modo pelo qual Deus atende à intercessão nem resolver a tensão teológica envolvida.
- issue: Sufixos coletivos singulares em רִשְׁעוֹ e חַטָּאתוֹ
  choice: a sua maldade ... o seu pecado
  alternative: a maldade deles ... o pecado deles
  rationale: O hebraico emprega sufixos singulares referentes ao coletivo “povo”. Em português, o singular também é natural e preserva mais diretamente essa estrutura.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. A sintaxe conserva o paralelismo triplo do hebraico (“teimosia... maldade... pecado”), e as notas registram alternativas lexicais genuínas sem sobrecarregar o texto.
