source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: pt
  text: 'E, quando Yahweh enviou vocês de Cades-Barneia, dizendo: “Subam e tomem posse da terra que lhes dei”, vocês se rebelaram contra a ordem de Yahweh, seu Deus,[a] e não creram nele[b] nem deram ouvidos à sua voz.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “contra a boca de Yahweh, seu Deus”; “boca” é uma expressão para sua ordem ou palavra.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não confiaram nele”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não obedeceram à sua voz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: E, quando ... enviou
  rationale: A construção com infinitivo introduz uma circunstância temporal; esta formulação conserva a conjunção e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: de Cades-Barneia
  rationale: Emprega a forma portuguesa tradicional e reconhecível do topônimo composto.
- source_word: עֲלוּ וּרְשׁוּ
  choice: Subam e tomem posse
  rationale: Preserva o movimento expresso por עלה e traduz ירשׁ, no contexto da entrada na terra, como apropriação efetiva, sem reduzir o sentido a uma herança passiva.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי לָכֶם
  choice: a terra que lhes dei
  rationale: O perfeito apresenta a dádiva divina como estabelecida. O pretérito perfeito é claro e natural em português, mantendo a força de uma concessão já feita.
- source_word: וַתַּמְרוּ
  choice: vocês se rebelaram
  rationale: מרה indica rebelião ou desafio deliberado à autoridade.
- source_word: אֶת־פִּי יְהוָה אֱלֹהֵיכֶם
  choice: contra a ordem de Yahweh, seu Deus
  rationale: A expressão literalmente relacionada à 'boca' é um idiomatismo para a declaração ou ordem autorizada de Deus; 'ordem' comunica seu sentido em português corrente.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: e não creram nele
  rationale: אמן no hifil com ל pode expressar crer ou confiar. 'Creram nele' mantém essa amplitude, enquanto a nota registra a nuance alternativa.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: nem deram ouvidos à sua voz
  rationale: A expressão שׁמע בקול envolve escutar de modo responsivo e, por implicação, obedecer. A formulação portuguesa conserva a imagem da voz e deixa perceptível a dimensão de obediência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o nome próprio divino. A transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Amplitude de הֶאֱמַנְתֶּם לוֹ
  choice: não creram nele
  alternative: não confiaram nele
  rationale: O verbo pode destacar tanto a aceitação da palavra de Deus quanto a confiança nele. O texto principal conserva 'crer', e a nota mantém explícita a nuance de confiança.
- issue: Valor do perfeito נָתַתִּי na promessa da terra
  choice: que lhes dei
  alternative: que tenho dado a vocês; que lhes estou dando
  rationale: O perfeito descreve a concessão como realizada ou firmemente estabelecida, sem exigir que a tradução resolva além do texto a relação entre promessa e posse histórica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas naturais para leitores brasileiros. O plural “vocês” explicita o destinatário coletivo. Mantiveram-se a imagem da subida, o nome divino transliterado e, com notas, as ambiguidades entre crer/confiar e ouvir/obedecer.
