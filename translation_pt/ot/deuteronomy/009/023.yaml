    issue: Inconsistência de tratamento pronominal
    rationale: “os enviou” seguido de “vocês se rebelaram” mistura padrões de referência. Não compromete o sentido, mas “enviou vocês” melhora a coesão no português brasileiro contemporâneo.
  - severity: low
    issue: Precisão explicativa da nota a
    rationale: “Contra a boca de Yahweh” é o idiomatismo que designa sua ordem, palavra ou pronunciamento; não significa por si só “rebelar-se contra”. A nota deve distinguir o idiomatismo da ação de rebeldia expressa pelo verbo principal.
