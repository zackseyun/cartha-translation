  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: pt
  text: 'Do contrário, a terra da qual nos tiraste dirá[a]: “Yahweh não foi capaz de levá-los à terra sobre a qual lhes havia falado[b] e, por odiá-los, tirou-os para fazê-los morrer no deserto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “a terra da qual nos tiraste”; aqui, “a terra” representa seus habitantes.
    reason: cultural_note
  - marker: b
    text: 'Ou, em sentido contextual: “à terra que lhes havia prometido”. Literalmente, o hebraico diz que ele “falou a eles” sobre a terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Do contrário
  rationale: Introduz de modo natural a consequência temida da possível destruição de Israel, preservando a força preventiva do hebraico.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: a terra da qual nos tiraste
  rationale: Mantém a formulação hebraica, na qual “a terra” representa metonimicamente seus habitantes, sem explicitar essa interpretação no corpo do texto.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: Yahweh não foi capaz
  rationale: Expressa diretamente a alegação de incapacidade atribuída aos habitantes da terra; trata-se da acusação que eles fariam, não de uma afirmação do narrador.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: à terra sobre a qual lhes havia falado
  rationale: Preserva o verbo hebraico “falar” e sua leve indeterminação quanto ao conteúdo, enquanto a nota registra a interpretação contextual como promessa.
- source_word: וּמִשִּׂנְאָתוֹ אוֹתָם
  choice: e, por odiá-los
  rationale: 'Reproduz de maneira concisa a relação causal expressa pela preposição hebraica: o ódio seria, na acusação das nações, o motivo do êxodo.'
- source_word: הוֹצִיאָם
  choice: tirou-os de lá
  rationale: Mantém o verbo do êxodo e torna explícita em português a origem já indicada no início da frase.
- source_word: לַהֲמִתָם בַּמִּדְבָּר
  choice: para fazê-los morrer no deserto
  rationale: Conserva o valor causativo do Hifil de מות e traduz מִדְבָּר pelo termo corrente e contextual “deserto”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de דִּבֶּר לָהֶם em relação à terra
  choice: sobre a qual lhes havia falado
  alternative: que lhes havia prometido
  rationale: A tradução principal mantém o verbo “falar” e a ambiguidade formal do hebraico. A ideia de promessa é adequada ao contexto da aliança, mas é apresentada em nota para não resolver silenciosamente a formulação da fonte.
- issue: Alegação de incapacidade e ódio divinos
  choice: mantida como fala atribuída aos habitantes da terra
  alternative: paráfrase que negasse explicitamente a alegação
  rationale: O versículo apresenta a acusação temida por Moisés. Preservar suas palavras mantém a tensão retórica sem transformá-las em afirmação do narrador nem inserir uma refutação ausente deste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal combina naturalidade com registro bíblico moderado. As aspas identificam claramente a fala hipotética dos habitantes da terra.
