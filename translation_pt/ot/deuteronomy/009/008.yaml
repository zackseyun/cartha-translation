  text: וּ/בְ/חֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת יְהוָ֑ה וַ/יִּתְאַנַּ֧ף יְהוָ֛ה בָּ/כֶ֖ם לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: pt
  text: Até em Horebe[a] vocês provocaram a ira de Yahweh, e Yahweh ficou irado contra vocês para destruir vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “Em Horebe” ou “E em Horebe”; a conjunção hebraica pode apenas dar continuidade ao relato, embora aqui provavelmente acrescente ênfase.
    reason: lexical_alternative
  - marker: b
    text: Ou “Yahweh ficou irado contra vocês a ponto de destruir vocês”. O hebraico liga diretamente a ira de Yahweh à destruição ameaçada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: Até em Horebe
  rationale: A conjunção וּ pode apenas dar continuidade ao relato, mas, no contexto, provavelmente acrescenta ênfase. “Até em Horebe” expressa essa força de modo natural, mantendo o topônimo tradicional.
- source_word: הִקְצַפְתֶּם
  choice: vocês provocaram a ira de
  rationale: 'O hifil de קצף tem sentido causativo: provocar ou fazer alguém irar-se. A formulação preserva tanto essa causalidade quanto a gravidade da ofensa.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa diretamente o nome divino do texto hebraico, em conformidade com a orientação editorial fornecida.
- source_word: וַיִּתְאַנַּף ... בָּכֶם
  choice: ficou irado contra vocês
  rationale: O verbo אנף indica ira intensa, e בָּכֶם marca aqui o alvo dessa ira. “Contra vocês” comunica claramente essa direção em português.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: a ponto de destruí-los
  rationale: O infinitivo hifil de שׁמד liga a ira à destruição pretendida ou ameaçada. A expressão portuguesa conserva essa relação estreita sem afirmar que a destruição chegou a ocorrer.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a decisão doutrinária editorial informada, sem substituir o nome por um título.
- issue: Relação entre a ira divina e a destruição
  choice: a ponto de destruí-los
  alternative: para destruí-los; com a intenção de destruí-los
  rationale: A construção לְהַשְׁמִיד associa diretamente a ira à destruição ameaçada, mas pode ser entendida em termos de propósito ou consequência. A tradução evita resolver de maneira excessiva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e evita linguagem excessivamente arcaica ou coloquial.
