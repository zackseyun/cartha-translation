base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: pt
  text: Então, peguei as duas tábuas, atirei-as de minhas duas mãos e as quebrei diante dos olhos de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as despedacei”. O verbo hebraico pode ser traduzido de modo mais simples por “quebrei”; “despedacei” explicita a possível extensão da quebra no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: peguei
  rationale: O verbo תפשׂ indica pegar ou agarrar. “Peguei” é natural e claro em português, sem acrescentar a violência que “arranquei” ou “agarrei com força” poderia sugerir.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: as duas tábuas
  rationale: לֻחוֹת designa tábuas; o contexto já as identifica, e “de pedra” não está explícito neste versículo.
- source_word: וָאַשְׁלִכֵם
  choice: lancei-as
  rationale: שלך significa lançar ou atirar. “Lancei-as” preserva a ação deliberada e mantém um registro digno e corrente.
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: das minhas duas mãos
  rationale: A expressão hebraica é literalmente “de sobre as minhas duas mãos”. A tradução conserva a ênfase explícita nas duas mãos, embora “das minhas mãos” fosse mais idiomático.
- source_word: וָאֲשַׁבְּרֵם
  choice: as quebrei
  rationale: שׁבר significa quebrar. “Quebrei” traduz diretamente o verbo sem pressupor o grau exato de fragmentação das tábuas.
- source_word: לְעֵינֵיכֶם
  choice: diante dos olhos de vocês
  rationale: A expressão idiomática significa à vista dos ouvintes. Esta formulação preserva a imagem concreta do hebraico e tem ampla legibilidade brasileira.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem narrativa e a repetição dos pronomes foram preservadas. “Vocês” comunica naturalmente o plural de לְעֵינֵיכֶם; “diante dos olhos” mantém a imagem hebraica.
