language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: pt
  text: Saiba, pois, hoje que Yahweh, seu Deus, é aquele que passa à sua frente[a], um fogo consumidor[b]. Ele os destruirá e os subjugará diante de você; então você os desapossará[c] e os fará perecer rapidamente, conforme Yahweh lhe disse.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vai à sua frente”. O particípio hebraico retrata Yahweh como aquele que passa adiante de Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fogo devorador”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os expulsará”. O verbo também envolve privá-los da posse da terra.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “conforme Yahweh falou a você”. A frase remete à palavra anteriormente dada por Yahweh a Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: Saiba, pois, hoje
  rationale: 'O perfeito com valor exortativo, ligado pelo וְ ao contexto anterior, é expresso naturalmente como uma conclusão ou consequência: “Saiba, pois, hoje”.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Expressão pactual direta e corrente, dirigida a Israel no singular coletivo.
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: é quem atravessa à sua frente
  rationale: Mantém o particípio vívido de עבר e sua possível ligação concreta com a travessia para a terra, sem reduzi-lo ao sentido mais geral de simplesmente ir adiante.
- source_word: אֵשׁ אֹכְלָה
  choice: fogo consumidor
  rationale: Preserva a metáfora hebraica forte da presença divina que consome e julga; a construção sem artigo funciona como caracterização em aposição.
- source_word: יַשְׁמִידֵם
  choice: Ele os destruirá
  rationale: Representa diretamente o hifil de שׁמד, sem recorrer a termos modernos mais técnicos ou carregados.
- source_word: יַכְנִיעֵם
  choice: os subjugará
  rationale: No contexto militar, o hifil de כנע indica abater ou colocar os povos sob domínio; “subjugar” conserva esse sentido.
- source_word: וְהוֹרַשְׁתָּם
  choice: você os desapossará
  rationale: 'Conserva a dimensão territorial do hifil de ירשׁ: privar os povos de sua posse para tomar a terra.'
- source_word: וְהַאֲבַדְתָּם
  choice: os fará perecer
  rationale: Expressa a força causativa do hifil de אבד e distingue este verbo do שׁמד anterior, traduzido como “destruir”.
- source_word: מַהֵר
  choice: rapidamente
  rationale: Mantém o sentido adverbial de rapidez, sem harmonizá-lo com outras descrições da conquista.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: conforme Yahweh lhe disse
  rationale: Indica correspondência com uma palavra divina anterior sem explicitar “prometeu”, ideia possível no contexto, mas não lexicalmente necessária.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o tetragrama como nome pessoal. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Imagem divina de אֵשׁ אֹכְלָה
  choice: fogo consumidor
  alternative: fogo devorador
  rationale: A formulação mantém sem suavização a imagem da presença santa e destrutiva de Deus, sem acrescentar uma explicação doutrinária.
- issue: Relação entre a ação divina e a ação de Israel
  choice: Ele os destruirá e subjugará; você os desapossará e fará perecer
  alternative: Paráfrase que atribua toda a ação exclusivamente a Deus ou exclusivamente a Israel
  rationale: A tradução conserva a tensão e a sequência do hebraico, no qual a ação decisiva de Yahweh e a atuação subsequente de Israel são ambas afirmadas.
- issue: Rapidez indicada por מַהֵר
  choice: rapidamente
  alternative: em breve; omissão ou harmonização com uma conquista gradual
  rationale: O advérbio é mantido em seu sentido direto, sem resolver silenciosamente sua relação com passagens que descrevem um processo gradual.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade, com uso de “você” para o singular coletivo dirigido a Israel. A ordem das ações e a repetição de “diante/à frente de você” preservam o caráter espacial e militar do hebraico. O travessão marca a aposição enfática “fogo consumidor” sem inserir um comparativo ausente no original.
