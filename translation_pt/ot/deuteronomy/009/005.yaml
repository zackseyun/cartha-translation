  source_fidelity: A tradução transmite com precisão a dupla negação inicial, a entrada para tomar posse da terra, a perversidade das nações como razão apresentada e a finalidade de confirmar a palavra jurada aos patriarcas. “Yahweh” corresponde adequadamente a יהוה. Convém, porém, tornar mais explícita em português a segunda finalidade introduzida por וּלְמַעַן, que se coordena com a expulsão das nações.
  naturalness: O texto é moderno, claro e adequado ao registro. A sequência final “..., e para confirmar...” fica levemente suspensa após a oração causal; “também para confirmar” dá à frase uma ligação mais natural e deixa clara a coordenação presente no hebraico. “Aos seus pais” é a construção mais corrente neste registro.
  terminology: “Justiça”, “retidão”, “perversidade”, “tomar posse”, “palavra”, “pais” e os nomes Abraão, Isaque e Jacó estão bem empregados. A alternativa da nota a é melhor formulada como “fazendo-as perder a posse da terra”, pois “desapossar” é menos idiomático e pode soar impreciso sem complemento.
