source:
  edition: WLC
  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: pt
  text: Não é por causa da sua justiça nem da retidão do seu coração que você está entrando para tomar posse da terra deles. Ao contrário, é por causa da perversidade destas nações que Yahweh, seu Deus, as está expulsando de diante de você[a] e também para confirmar a palavra[b] que Yahweh jurou aos seus pais[c], a Abraão, a Isaque e a Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazendo-as perder a posse da terra diante de você”. O verbo hebraico pode enfatizar que Yahweh faz essas nações perderem a posse da terra, e não apenas que as expulsa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a promessa”. Em um contexto de juramento, “palavra” tem o sentido de palavra empenhada.'
    reason: lexical_alternative
  - marker: c
    text: 'Aqui, “seus pais” se refere especificamente aos patriarcas nomeados em seguida: Abraão, Isaque e Jacó.'
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: por causa da sua justiça
  rationale: O בְּ tem sentido causal no contexto, e צְדָקָה designa aqui justiça ou retidão moral; a negação rejeita isso como fundamento da posse da terra.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: nem da retidão do seu coração
  rationale: יֹשֶׁר expressa retidão, e לֵבָב se refere à disposição moral interior. A formulação conserva a imagem hebraica de modo natural em português.
- source_word: בָא לָרֶשֶׁת אֶת־אַרְצָם
  choice: está entrando para tomar posse da terra deles
  rationale: בוא com o infinitivo לָרֶשֶׁת indica entrada com propósito; “tomar posse” expressa adequadamente ירשׁ neste contexto.
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: por causa da perversidade destas nações
  rationale: רִשְׁעָה denota perversidade, maldade ou culpa, e o בְּ é novamente causal. “Nações” traduz diretamente גּוֹיִם no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: as está expulsando de diante de você
  rationale: O hifil de ירשׁ pode indicar expulsar ou fazer perder a posse. A escolha principal comunica naturalmente a remoção das nações, enquanto a nota preserva a nuance de desapossamento.
- source_word: וּלְמַעַן הָקִים
  choice: e para confirmar
  rationale: לְמַעַן marca finalidade, e הֵקִים com דָּבָר em contexto de juramento pode significar estabelecer, confirmar ou cumprir uma palavra empenhada.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: a palavra que Yahweh jurou
  rationale: “Palavra” mantém a amplitude de דָּבָר; o verbo “jurou” deixa claro que se trata de uma palavra empenhada, isto é, uma promessa juramentada.
- source_word: לַאֲבֹתֶיךָ
  choice: a seus pais
  rationale: O referente masculino plural é especificado imediatamente como Abraão, Isaque e Jacó; “pais” preserva essa referência direta aos patriarcas.
theological_decisions:
- issue: Fundamentos declarados para Israel receber a terra
  choice: Preservar tanto a perversidade das nações quanto a fidelidade de Yahweh à palavra jurada aos patriarcas.
  alternative: Destacar apenas a perversidade das nações ou apenas a promessa da aliança.
  rationale: O hebraico apresenta explicitamente os dois elementos por meio de כִּי e וּלְמַעַן; nenhum deles deve ser absorvido pelo outro.
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz o nome próprio divino; a transliteração “Yahweh” preserva esse dado textual.
- issue: Relação entre mérito humano e concessão da terra
  choice: A posse não é atribuída à justiça nem à retidão interior de Israel.
  alternative: Entender a conquista como recompensa pela virtude de Israel.
  rationale: A dupla negação inicial do hebraico exclui expressamente a justiça e a retidão de coração de Israel como causa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por se tratar de uma fala dirigida ao Israel coletivo no singular. Mantém “Yahweh” como nome próprio e conserva a expressão hebraica “retidão do seu coração” sem tornar a frase artificial.
