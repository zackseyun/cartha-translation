    issue: Formulação da nota lexical sobre מורישם
    rationale: “Desapossando” é possível, mas é menos natural em português contemporâneo. A explicação “fazendo-as perder a posse da terra” comunica diretamente o valor causativo do hifil sem alterar a alternativa interpretativa.
