  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: pt
  text: Portanto, saiba que não é por causa da sua justiça que Yahweh, seu Deus, lhe dá esta boa terra para que tome posse dela[a], pois você é um povo obstinado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para que a herde”. O verbo hebraico pode indicar receber uma herança, mas em Deuteronômio frequentemente inclui a ideia de tomar posse da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Portanto, saiba
  rationale: O perfeito qal de ידע tem força exortativa no contexto, e a conjunção liga a afirmação como conclusão do argumento anterior.
- source_word: לֹא בְצִדְקָתְךָ
  choice: não é por causa da sua justiça
  rationale: A preposição ב indica aqui fundamento ou motivo, não instrumento; a formulação nega que a justiça de Israel seja a razão da dádiva.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Preserva o nome divino e traduz diretamente a relação pactual expressa pelo sufixo de segunda pessoa singular.
- source_word: נֹתֵן לְךָ
  choice: lhe dá
  rationale: O particípio apresenta a ação divina como atual ou iminente; o presente português é natural e mantém essa perspectiva.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: esta boa terra
  rationale: Mantém o demonstrativo, a avaliação positiva e o termo tradicional do contexto da promessa da terra.
- source_word: לְרִשְׁתָּהּ
  choice: para que tome posse dela
  rationale: ירשׁ em Deuteronômio frequentemente envolve entrar na terra e assumir sua posse; a expressão explicita o objeto pronominal presente no hebraico.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: um povo obstinado
  rationale: O idioma hebraico descreve resistência teimosa e rebelde. 'Obstinado' comunica o sentido com naturalidade no português moderno, embora não retenha a imagem corporal.
theological_decisions:
- issue: Razão pela qual Israel recebe a terra
  choice: Negar explicitamente que a justiça de Israel seja o fundamento da dádiva de Yahweh.
  alternative: Reduzir o texto a uma advertência geral contra o orgulho.
  rationale: O hebraico contrapõe diretamente a justiça alegada de Israel, a ação doadora de Deus e a obstinação do povo, sem desenvolver além disso uma doutrina mais ampla.
- issue: Tratamento corporativo no singular
  choice: Usar 'você' e 'seu/sua' para Israel como entidade coletiva, seguido de 'um povo'.
  alternative: Empregar formas plurais, como 'vocês'.
  rationale: O hebraico mantém a segunda pessoa masculina singular e trata Israel corporativamente; a tradução conserva essa estrutura compreensível em português.
- issue: Metáfora de קְשֵׁה עֹרֶף
  choice: Traduzir o sentido idiomático como 'obstinado'.
  alternative: Conservar literalmente 'de dura cerviz'.
  rationale: '''De dura cerviz'' preserva a metáfora, mas é pouco transparente para muitos leitores atuais; ''obstinado'' transmite com clareza a acusação moral sem intensificá-la.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o contraste do hebraico foram preservados, evitando linguagem excessivamente arcaica. O nome divino foi transliterado como Yahweh.
