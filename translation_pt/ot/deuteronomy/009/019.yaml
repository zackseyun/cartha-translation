source:
  edition: WLC
  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: pt
  text: Pois tive medo da ira e do furor com que Yahweh se irou contra vocês[a], para destruí-los. Mas Yahweh me ouviu também naquela ocasião.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da ira e do furor que Yahweh sentiu contra vocês”.'
    reason: Alternativa sintática para a construção hebraica que combina os termos de ira com o verbo קצף.
  - marker: b
    text: No contexto da intercessão de Moisés, “me ouviu” implica que Yahweh lhe deu ouvidos e respondeu favoravelmente.
    reason: Esclarecimento do sentido contextual de שׁמע com אֶל, sem substituir no texto a expressão hebraica por uma paráfrase mais interpretativa.
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: tive medo
  rationale: O qal perfeito na primeira pessoa expressa medo ou pavor. “Tive medo” é direto, natural e mantém a força pessoal da declaração de Moisés.
- source_word: מִפְּנֵי
  choice: da
  rationale: Neste contexto, a locução indica a causa do medo. Em português, “tive medo da” comunica naturalmente esse valor causal.
- source_word: הָאַף וְהַחֵמָה
  choice: a ira e o furor
  rationale: Os dois substantivos formam uma expressão intensificada de indignação. “Ira” e “furor” preservam os dois termos sem recorrer aos sentidos literais inadequados de “nariz” e “calor”.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: com que Yahweh se irou contra vocês
  rationale: A formulação conserva a terceira expressão hebraica de ira e a orientação contra o povo. A repetição é mantida porque pertence à intensidade retórica do original.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: disposto a destruí-los
  rationale: O infinitivo com לְ indica aqui a destruição visada pela ira de Yahweh. “Disposto a” torna clara a relação sintática sem afirmar que a destruição chegou a ocorrer.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Mas Yahweh me ouviu
  rationale: שׁמע com אֶל, no contexto da intercessão, indica que Yahweh deu ouvidos a Moisés. “Mas” explicita a virada contrastiva natural do relato.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: também naquela ocasião
  rationale: Preserva a força aditiva de גַּם e traduz פַּעַם de modo idiomático no contexto de um episódio anterior.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Intensidade da ira divina
  choice: a ira e o furor com que Yahweh se irou
  alternative: a grande ira de Yahweh
  rationale: A tradução mantém a acumulação de אַף, חֵמָה e קצף, inclusive sua repetição retórica, sem amenizar nem ampliar teologicamente a linguagem do texto.
- issue: Sentido favorável de Yahweh ouvir Moisés
  choice: Yahweh me ouviu
  alternative: Yahweh atendeu ao meu pedido
  rationale: “Ouviu” conserva a forma do hebraico e a tensão entre o ato de escutar e sua consequência favorável; a nota esclarece a implicação contextual sem inseri-la de modo explícito no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O plural “vocês” representa com clareza a segunda pessoa plural. A repetição “ira... furor... se irou” foi preservada deliberadamente por refletir a intensidade do hebraico, enquanto “naquela ocasião” evita uma formulação excessivamente literal.
