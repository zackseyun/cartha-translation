  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: pt
  text: 'E Yahweh me disse: “Levante-se, desça depressa daqui, pois o seu povo, que você tirou do Egito, corrompeu-se. Eles rapidamente se desviaram do caminho que lhes ordenei seguir; fizeram para si uma imagem de metal fundido[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “imagem fundida”. O termo hebraico se refere a uma imagem feita pela fundição de metal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva seu caráter pessoal e pactual, sem substituí-lo por um título.
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: Levante-se, desça depressa daqui
  rationale: Reproduz a sequência abrupta de imperativos e a urgência do hebraico em português natural.
- source_word: שִׁחֵת
  choice: corrompeu-se
  rationale: Expressa a deterioração moral e religiosa do povo; a forma pronominal é idiomática em português e conserva a força contextual do verbo.
- source_word: עַמְּךָ אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: o seu povo, que você tirou do Egito
  rationale: Mantém a atribuição dirigida a Moisés e o distanciamento retórico presente na repreensão divina.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: logo se desviaram do caminho
  rationale: Conserva a metáfora do caminho e comunica que o desvio ocorreu rapidamente; “logo” é fluente neste segundo uso de מַהֵר.
- source_word: אֲשֶׁר צִוִּיתִם
  choice: que eu lhes ordenei
  rationale: Traduz a autoridade do mandamento de modo natural, entendendo o caminho como a conduta ordenada ao povo.
- source_word: מַסֵּכָה
  choice: uma imagem de metal fundido
  rationale: Explicita com precisão que se trata de uma imagem produzida por fundição, sem reduzir o termo ao genérico “ídolo”.
theological_decisions:
- issue: Distanciamento retórico em “o seu povo, que você tirou do Egito”
  choice: Preservar literalmente a atribuição a Moisés
  alternative: Suavizar para “meu povo, que tirei do Egito” ou “o povo que saiu do Egito”
  rationale: O hebraico formula deliberadamente a repreensão como “seu povo” e “que você tirou”; a tradução mantém essa tensão sem corrigi-la teologicamente.
- issue: Natureza do objeto idólatra מַסֵּכָה
  choice: imagem de metal fundido
  alternative: ídolo; imagem esculpida
  rationale: O termo identifica o modo de fabricação da imagem. A tradução preserva esse dado concreto e evita confundi-la com uma imagem talhada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna claro que Yahweh se dirige diretamente a Moisés. A repetição de מַהֵר é representada por “depressa” e “logo”, preservando a urgência sem produzir uma repetição pouco elegante.
