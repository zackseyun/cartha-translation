revisions:
- from: 'E Yahweh me disse: “Levante-se, desça depressa daqui, pois o seu povo, que você tirou do Egito, corrompeu-se. Eles logo se desviaram do caminho que eu lhes ordenei; fizeram para si uma imagem de metal fundido[a]”.'
  to: 'E Yahweh me disse: “Levante-se, desça depressa daqui, pois o seu povo, que você tirou do Egito, corrompeu-se. Eles rapidamente se desviaram do caminho que lhes ordenei seguir; fizeram para si uma imagem de metal fundido[a]”.'
  rationale: A revisão limita-se a explicitar em português o sentido de rapidez da segunda ocorrência de מַהֵר e a tornar mais natural a relação entre o “caminho” e a ordem divina. Mantêm-se o nome divino, o tom de repreensão, a atribuição retórica do povo a Moisés e o sentido concreto de uma imagem produzida por fundição.
  reviewer_model: gpt-5.6-terra
