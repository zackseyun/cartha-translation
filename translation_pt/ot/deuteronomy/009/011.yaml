  text: וַ/יְהִ֗י מִ/קֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵ֛י לֻחֹ֥ת הָ/אֲבָנִ֖ים לֻח֥וֹת הַ/בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/011.yaml
  text: And at the end of forty days and forty nights[a], Yahweh gave me the two stone tablets, the tablets of the covenant.
translation:
  language: pt
  text: E, ao fim de quarenta dias e quarenta noites, Yahweh me deu as duas tábuas de pedra, as tábuas da aliança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ao fim
  rationale: A forma narrativa introduz a circunstância temporal; em português natural, não é necessário reproduzir mecanicamente «e aconteceu».
- source_word: מִקֵּץ
  choice: ao fim de
  rationale: Expressa o ponto em que se completa o período, com mais precisão que o simples «depois de».
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: quarenta dias e quarenta noites
  rationale: Reproduz diretamente a expressão temporal hebraica em português corrente.
- source_word: נָתַן
  choice: deu
  rationale: Mantém o sentido comum e não marcado do verbo, sem acrescentar a ideia de entrega formal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: me
  rationale: Com «deu», o pronome átono é a forma idiomática de expressar o destinatário em português.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: as duas tábuas de pedra
  rationale: Preserva a referência ao par definido e expressa naturalmente o material das tábuas.
- source_word: לֻחוֹת הַבְּרִית
  choice: as tábuas da aliança
  rationale: Mantém a repetição appositiva do hebraico e sua ênfase no caráter pactual das tábuas.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino. «Yahweh» o preserva como nome, sem substituí-lo por um título nem adotar a forma híbrida tradicional «Jeová».
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção hebraica וַיְהִי não foi vertida de modo rígido como «e aconteceu», pois a locução temporal já desempenha naturalmente a transição narrativa. A nota da camada inglesa («Or ‘Yahweh gave me.’») não foi incluída, porque não apresenta uma leitura realmente distinta nem corresponde a uma ambiguidade identificável no texto hebraico deste versículo.
