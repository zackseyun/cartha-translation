  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: pt
  text: Quando subi ao monte para receber[a] as tábuas de pedra[b], as tábuas da aliança que Yahweh fez[c] com vocês, permaneci no monte quarenta dias e quarenta noites; não comi pão nem bebi água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “tomar”. Neste contexto, “receber” expressa o sentido de Moisés subir para que as tábuas lhe fossem dadas.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as tábuas das pedras”, expressão hebraica que indica tábuas feitas de pedra.
    reason: lexical_clarification
  - marker: c
    text: Literalmente, “cortou com vocês”, expressão idiomática hebraica usada para fazer ou firmar uma aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי
  choice: Quando subi
  rationale: A construção com ב mais o infinitivo de עלה e o sufixo da primeira pessoa tem sentido temporal. “Quando subi” é natural em português e preserva o movimento de ascensão.
- source_word: הָהָרָה
  choice: ao monte
  rationale: O substantivo definido com o ה direcional indica movimento em direção ao monte específico do contexto, isto é, Sinai/Horebe.
- source_word: לָקַחַת
  choice: para receber
  rationale: Embora לקח costume significar “tomar”, aqui Moisés sobe para receber de Deus as tábuas. “Receber” expressa naturalmente esse sentido contextual sem ocultar a alternativa literal, registrada em nota.
- source_word: לוּחֹת הָאֲבָנִים
  choice: as tábuas de pedra
  rationale: A expressão construta identifica o material das tábuas. “Tábuas de pedra” é clara, corrente e próxima da forma hebraica.
- source_word: לוּחֹת הַבְּרִית
  choice: as tábuas da aliança
  rationale: A repetição em aposição identifica as tábuas de pedra como as tábuas da aliança. A tradução conserva essa ênfase estrutural.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִמָּכֶם
  choice: que Yahweh fez com vocês
  rationale: כרת, literalmente “cortar”, integra a expressão idiomática hebraica usada para firmar ou fazer uma aliança. “Fez” comunica o sentido em português, enquanto a nota preserva a imagem literal.
- source_word: וָאֵשֵׁב
  choice: permaneci
  rationale: ישב pode significar sentar-se, habitar ou permanecer. Como o foco recai sobre a duração da estadia no monte, “permaneci” é a escolha contextual mais adequada.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: quarenta dias e quarenta noites
  rationale: Tradução direta da expressão hebraica de duração, natural em português.
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: não comi pão
  rationale: לֶחֶם pode designar pão especificamente ou alimento em sentido mais amplo. A tradução mantém o termo concreto do texto hebraico.
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: nem bebi água
  rationale: “Nem” liga naturalmente as duas negações em português e preserva o paralelismo entre não comer pão e não beber água.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama יְהוָה. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Expressão idiomática כרת aplicada à aliança
  choice: fez com vocês
  alternative: cortou com vocês; firmou com vocês
  rationale: A tradução idiomática “fez” evita uma formulação incompreensível em português, enquanto a nota conserva a imagem hebraica de “cortar” uma aliança sem impor uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva a repetição enfática “as tábuas de pedra, as tábuas da aliança”, o nome divino “Yahweh” e os termos concretos “pão” e “água”. Usa “vocês” como plural corrente e internacionalmente compreensível.
