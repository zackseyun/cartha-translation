  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: pt
  text: Vocês têm sido rebeldes contra Yahweh[a] desde o dia em que os conheci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com Yahweh”; neste contexto, a expressão indica oposição a ele, daí “contra Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: rebeldes
  rationale: O termo, da raiz מרה, expressa rebelião ou resistência à autoridade. Com הֱיִיתֶם, a construção predicativa é bem representada por “têm sido rebeldes”.
- source_word: הֱיִיתֶם
  choice: têm sido
  rationale: O perfeito qal na segunda pessoa masculina plural resume uma conduta persistente de Israel até o momento do discurso; o pretérito perfeito composto comunica essa continuidade em português.
- source_word: עִם
  choice: contra
  rationale: Embora a preposição signifique literalmente “com”, junto de מרה ela indica oposição; “contra” transmite de modo natural o sentido contextual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִיּוֹם
  choice: desde o dia
  rationale: Marca o ponto inicial da conduta descrita e preserva de perto a expressão temporal hebraica.
- source_word: דַּעְתִּי אֶתְכֶם
  choice: em que os conheci
  rationale: Traduz diretamente o verbo ידע com seu objeto plural. No contexto, refere-se ao início da convivência de Moisés com o povo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz o nome pessoal divino. “Yahweh” o preserva como nome próprio, sem substituí-lo por um título.
- issue: Sentido relacional de עִם após מרה
  choice: contra Yahweh
  alternative: com Yahweh
  rationale: “Com” preservaria a forma mais literal, mas poderia sugerir companhia em português. O contexto exige oposição, expressa naturalmente por “contra”, enquanto a nota registra a forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”, amplamente compreensível no Brasil e em outras comunidades lusófonas. A formulação conserva a acusação enfática e a extensão temporal do hebraico.
