source:
  edition: WLC
  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: pt
  text: 'Não diga em seu coração, quando Yahweh, seu Deus, as expulsar de diante de você: “Foi por causa da minha justiça que Yahweh me trouxe para tomar posse[a] desta terra”. Pelo contrário, é por causa da perversidade dessas nações que Yahweh as desaloja de diante de você.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para herdar”. O verbo hebraico também pode ter o sentido de herdar ou receber como posse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: Não diga em seu coração
  rationale: אַל com o imperfeito expressa proibição, e a locução «em seu coração» preserva a metáfora hebraica de pensamento ou fala interior, sendo compreensível em português.
- source_word: בַּהֲדֹף
  choice: quando ... expulsar
  rationale: O infinitivo construto com בְּ indica circunstância temporal; «expulsar» comunica com naturalidade a ideia de impelir para longe no contexto da conquista.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Mantém o nome divino expresso pelo Tetragrama e verte de modo direto a fórmula relacional אֱלֹהֶיךָ.
- source_word: מִלְּפָנֶיךָ / מִפָּנֶיךָ
  choice: de diante de você
  rationale: Preserva a imagem espacial do hebraico sem recorrer a uma paráfrase excessiva.
- source_word: בְּצִדְקָתִי
  choice: por causa da minha justiça
  rationale: Expressa o valor causal da preposição e conserva «justiça», termo que aqui designa a suposta retidão ou mérito de Israel.
- source_word: הֱבִיאַנִי
  choice: me trouxe
  rationale: O hifil de בוא significa fazer entrar ou trazer; o contexto de entrada na terra torna «me trouxe» claro e natural.
- source_word: לָרֶשֶׁת
  choice: para tomar posse
  rationale: ירשׁ neste contexto indica entrar na posse da terra. A formulação é atual e mantém na nota a alternativa tradicional «herdar».
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: Pelo contrário, é por causa da perversidade dessas nações
  rationale: O waw introduz aqui uma correção contrastiva à alegação de mérito de Israel. «Perversidade» traduz רִשְׁעָה como conduta moralmente má.
- source_word: מוֹרִישָׁם
  choice: as desaloja
  rationale: O hifil de ירשׁ apresenta Yahweh retirando dessas nações a posse da terra; «desaloja» distingue esse verbo do anterior הֲדֹף, traduzido por «expulsar».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração «Yahweh» preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Possível alegação de que Israel mereceu a terra
  choice: Foi por causa da minha justiça que Yahweh me trouxe
  alternative: Por minha justiça Yahweh me trouxe
  rationale: A formulação conserva a alegação causal de mérito que Moisés proíbe, sem atenuar o termo «justiça» nem antecipar além do texto a refutação apresentada na segunda parte do versículo.
- issue: Relação lógica da oração final
  choice: Pelo contrário, é por causa da perversidade dessas nações
  alternative: e por causa da perversidade dessas nações
  rationale: O waw hebraico admite tradução mais formal por «e», mas no contexto a oração corrige a falsa conclusão de Israel. «Pelo contrário» explicita essa força contrastiva sem alterar a causa declarada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva a metáfora «em seu coração», o termo teológico «justiça», o nome Yahweh e a repetição espacial «de diante de você». A alternância «expulsar/desalojar» reflete os dois verbos hebraicos distintos.
