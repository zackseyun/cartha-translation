  text: וְֽ/אֶת חַטַּאתְ/כֶ֞ם אֲשֶׁר עֲשִׂיתֶ֣ם אֶת הָ/עֵ֗גֶל לָקַחְתִּי֮ וָ/אֶשְׂרֹ֣ף אֹת֣/וֹ בָּ/אֵשׁ֒ וָ/אֶכֹּ֨ת אֹת֤/וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר דַּ֖ק לְ/עָפָ֑ר וָֽ/אַשְׁלִךְ֙ אֶת עֲפָר֔/וֹ אֶל הַ/נַּ֖חַל הַ/יֹּרֵ֥ד מִן הָ/הָֽר־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: pt
  text: Quanto ao pecado de vocês, o bezerro que tinham feito, eu o peguei e o queimei no fogo. Depois o esmaguei, moendo-o muito bem, até que ficasse reduzido a pó fino, e lancei o seu pó no riacho[a] que desce do monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “torrente” ou “uádi”. O termo hebraico pode indicar uma corrente de água, seu leito ou um vale por onde ela corre.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: o pecado de vocês
  rationale: Preserva a identificação direta e severa do bezerro com o pecado de Israel, sem reinterpretá-lo como oferta pelo pecado.
- source_word: הָעֵגֶל
  choice: o bezerro
  rationale: É o sentido comum do termo e identifica naturalmente o ídolo do episódio.
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: eu o queimei no fogo
  rationale: Reproduz de modo natural em português a expressão hebraica e mantém a concretude da ação.
- source_word: וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב
  choice: o esmaguei, moendo-o muito bem
  rationale: Mantém tanto a ação de golpear ou triturar quanto a explicação modal do hebraico, com o intensificador הֵיטֵב.
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: até que ficasse reduzido a pó fino
  rationale: Comunica o grau extremo de pulverização de forma clara e idiomática.
- source_word: עֲפָרוֹ
  choice: o seu pó
  rationale: Refere-se aos restos pulverizados e mantém a ligação lexical com a oração anterior, sem restringir o sentido a cinzas.
- source_word: הַנַּחַל
  choice: o riacho
  rationale: É uma opção acessível para נחל neste contexto, embora o termo hebraico também possa designar uma torrente, um leito de corrente ou um uádi.
- source_word: הַיֹּרֵד מִן הָהָר
  choice: que desce do monte
  rationale: Preserva com concisão a força descritiva do particípio hebraico.
theological_decisions:
- issue: Identificação do bezerro como o pecado de Israel
  choice: o pecado de vocês, o bezerro que tinham feito
  alternative: a coisa pecaminosa de vocês, o bezerro que tinham feito
  rationale: A aposição hebraica identifica de modo contundente o ídolo com o pecado do povo. A tradução conserva essa tensão teológica em vez de suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Quanto ao” explicita naturalmente o marcador de objeto destacado no início hebraico; “vocês” evita regionalismo e mantém referência plural inequívoca. A sequência das ações e a ênfase na destruição completa do ídolo foram preservadas.
