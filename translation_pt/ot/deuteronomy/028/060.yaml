  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: pt
  text: E ele fará voltar sobre vocês todas as doenças do Egito que vocês temiam, e elas se apegarão a vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיב בְּךָ
  choice: fará voltar sobre vocês
  rationale: O hifil de שוב tem sentido causativo, “fazer voltar” ou “trazer de volta”; com בְּךָ, a expressão comunica que as doenças tornarão a recair sobre o povo.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: todas as doenças do Egito
  rationale: מַדְוֶה designa doença ou enfermidade. “Doenças” é direto, natural e não especifica além do hebraico.
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: que vocês temiam
  rationale: יגר expressa temor ou pavor. “Temiam” preserva o sentido sem intensificá-lo indevidamente; o pronome plural retoma as doenças.
- source_word: וְדָבְקוּ בָּךְ
  choice: e elas se apegarão a vocês
  rationale: דבק descreve aderência persistente, “apegar-se” ou “grudar-se”. “Se apegarão” mantém a imagem e oferece leitura digna e corrente.
