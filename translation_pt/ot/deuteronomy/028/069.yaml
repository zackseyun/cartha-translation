base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: pt
  text: Estas são as palavras da aliança que Yahweh ordenou a Moisés que firmasse[a] com os filhos de Israel na terra de Moabe, além da aliança que firmou com eles em Horebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «cortar uma aliança»; no fim do versículo, «cortou com eles».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: Estas são as palavras da aliança
  rationale: Mantém a fórmula demonstrativa e o sentido verbal de דִבְרֵי, com uma construção natural em português; “palavras” também preserva melhor que “termos” a amplitude possível de דָּבָר.
- source_word: צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: Yahweh ordenou a Moisés
  rationale: צִוָּה expressa uma ordem, e a regência com objeto direto e infinitivo é vertida naturalmente como “ordenou a Moisés que”. O nome divino é transliterado como Yahweh, em vez de ser substituído por um título.
- source_word: לִכְרֹת ... הַבְּרִית / כָּרַת
  choice: firmasse ... havia firmado
  rationale: O hebraico emprega literalmente o verbo “cortar” na expressão idiomática de estabelecer uma aliança. “Firmar uma aliança” comunica o sentido corrente em português, enquanto a nota conserva a imagem literal. O mais-que-perfeito composto na segunda ocorrência esclarece naturalmente que a aliança em Horebe era anterior.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de perto a forma hebraica e sua designação corporativa tradicional, sem reduzi-la a uma referência meramente genealógica.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: na terra de Moabe
  rationale: Preserva a formulação geográfica completa do hebraico.
- source_word: מִלְּבַד
  choice: além de
  rationale: Marca que a aliança em Moabe é apresentada em distinção da aliança anteriormente firmada em Horebe, sem especificar além do texto a natureza exata dessa relação.
- source_word: בְּחֹרֵב
  choice: em Horebe
  rationale: Mantém o topônimo hebraico Horebe, sem harmonizá-lo com Sinai; “em” é a preposição natural em português para o lugar do acontecimento.
theological_decisions:
- issue: Relação entre a aliança em Moabe e a aliança em Horebe
  choice: além da aliança
  alternative: à parte da aliança / em adição à aliança
  rationale: A tradução conserva a distinção expressa por מִלְּבַד, sem decidir se se trata de uma aliança inteiramente nova, de renovação ou de extensão da anterior.
- issue: Forma corporativa בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas / o povo de Israel
  rationale: A escolha mantém visível a forma do original. No contexto, a expressão designa coletivamente Israel, mas a tradução não neutraliza desnecessariamente o substantivo “filhos”.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Javé / Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Firmar uma aliança” soa natural no registro bíblico-jurídico sem ocultar, graças à nota, o idioma hebraico literal. O marcador [a] aparece no texto principal.
