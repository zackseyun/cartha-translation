lexical_decisions:
- source_word: אָרוּר
  choice: Malditos serão
  rationale: O particípio passivo introduz uma fórmula de maldição sem verbo expresso. A construção no futuro reproduz com naturalidade o caráter declaratório das maldições da aliança; o plural concorda com os dois objetos coordenados.
- source_word: טַנְאֲךָ
  choice: o seu cesto
  rationale: טֶנֶא designa um cesto, frequentemente usado para produtos colhidos. “Cesto” preserva o sentido amplo sem especificar indevidamente o conteúdo.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: e a sua vasilha de amassar
  rationale: מִשְׁאֶרֶת é um recipiente no qual se amassa a massa. “Vasilha de amassar” é claro, atual e não pressupõe formato ou tamanho específicos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação declaratória adequada à sequência de maldições da aliança. O possessivo “seu/sua” favorece ampla legibilidade internacional e brasileira.
