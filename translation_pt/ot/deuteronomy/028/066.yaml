  text: וְ/הָי֣וּ חַיֶּ֔י/ךָ תְּלֻאִ֥ים לְ/ךָ֖ מִ/נֶּ֑גֶד וּ/פָֽחַדְתָּ֙ לַ֣יְלָה וְ/יוֹמָ֔ם וְ/לֹ֥א תַאֲמִ֖ין בְּ/חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: pt
  text: Sua vida ficará suspensa diante de você[a]; você terá medo noite e dia e não terá certeza de que continuará vivo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Sua vida ficará pendente diante de você”. A imagem hebraica apresenta a vida como suspensa de modo precário, exprimindo incerteza contínua quanto à sobrevivência.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “não confiará em sua vida” ou “não estará seguro de sua vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: sua vida
  rationale: Embora a forma hebraica seja plural, trata-se de uma expressão idiomática referente à vida ou sobrevivência da pessoa; o singular é natural em português.
- source_word: תְּלֻאִים
  choice: ficará suspensa
  rationale: Preserva a imagem do verbo תלה, “pendurar, suspender”, segundo a qual a vida permanece precariamente pendente e a sobrevivência é incerta.
- source_word: לְךָ מִנֶּגֶד
  choice: diante de você
  rationale: Mantém a metáfora espacial do hebraico, de algo posto à frente da pessoa como ameaça constante.
- source_word: וּפָחַדְתָּ
  choice: você terá medo
  rationale: Expressa de modo direto o temor ou pavor indicado pelo verbo פחד, sem intensificação indevida.
- source_word: לַיְלָה וְיוֹמָם
  choice: noite e dia
  rationale: Conserva a ordem hebraica e comunica medo contínuo.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: não terá certeza de que continuará vivo
  rationale: Neste contexto, אמן com ב não trata de fé teológica, mas da ausência de confiança ou segurança quanto à própria sobrevivência. A formulação torna esse sentido claro em português atual.
theological_decisions: []
