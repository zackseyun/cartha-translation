base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: pt
  text: Yahweh fará de você a cabeça, e não a cauda; você estará somente acima, e não abaixo, se escutar[a] os mandamentos de Yahweh, seu Deus, que hoje lhe ordeno guardar e cumprir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se obedecer aos mandamentos de Yahweh, seu Deus”. O hebraico diz literalmente “se escutar”, mas, neste contexto da aliança, escutar inclui obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: Yahweh fará de você
  rationale: O verbo נתן significa literalmente “dar, pôr, estabelecer”, mas, com os predicativos “cabeça” e “cauda”, tem sentido causativo. “Fará de você” expressa isso com naturalidade em português.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: a cabeça, e não a cauda
  rationale: Preserva a metáfora hebraica de proeminência em contraste com posição inferior ou subordinada.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: você estará somente por cima, e não por baixo
  rationale: Mantém o contraste espacial usado metaforicamente para posição e conserva a força exclusiva de רַק, “somente”.
- source_word: כִּי תִשְׁמַע אֶל
  choice: se escutar
  rationale: כִּי introduz aqui a condição da bênção. “Escutar” preserva o sentido lexical de שמע, enquanto o contexto e os verbos “guardar e cumprir” deixam claro que se trata de ouvir com obediência.
- source_word: מִצְוֺת
  choice: os mandamentos
  rationale: Termo claro e tradicional para as estipulações da aliança designadas por מִצְוֺת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhe ordeno
  rationale: Expressa com naturalidade a fala presente de Moisés e mantém “hoje”, elemento recorrente e significativo em Deuteronômio.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: guardar e cumprir
  rationale: 'Conserva os dois verbos distintos: observar cuidadosamente e colocar em prática.'
theological_decisions:
- issue: Valor de כִּי na condição da bênção da aliança
  choice: se escutar
  alternative: porque escuta
  rationale: No contexto das bênçãos de Deuteronômio 28, a oração apresenta a condição ligada à promessa; “se” comunica essa relação sem acrescentar uma teoria de mérito.
- issue: Sentido obediencial de שמע אל
  choice: escutar os mandamentos
  alternative: obedecer aos mandamentos
  rationale: A tradução mantém a imagem lexical do ouvir, sem eliminar seu sentido de obediência no contexto da aliança; esse sentido é reforçado por “guardar e cumprir” e esclarecido em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as metáforas concretas do hebraico e o nome divino Yahweh. O singular “você” representa o destinatário coletivo singular de Israel.
