base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: pt
  text: Javé ferirá você com as úlceras do Egito, com tumores[a], com crostas e com coceira, de que você não poderá ser curado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hemorroidas”; o termo hebraico é incerto e talvez se refira mais especificamente a inchaços na região anal.
    reason: Alternativa lexical para o obscuro עפלים, preservando a possível acepção mais específica sem inseri-la no texto principal.
lexical_decisions:
- source_word: יַכְּכָה
  choice: ferirá você
  rationale: O hifil de נכה expressa um golpe ou aflição direta. “Ferirá você” conserva essa força e é claro em português atual.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera o nome divino em sua forma portuguesa amplamente reconhecida, em vez de substituí-lo por um título.
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: com as úlceras do Egito
  rationale: שְׁחִין designa uma erupção inflamada, úlcera ou furúnculo. O plural é idiomático para a enfermidade, e “do Egito” preserva a ligação genitiva e a provável alusão às pragas.
- source_word: וּבְעפלים
  choice: com tumores
  rationale: O termo é lexicalmente incerto. “Tumores” conserva uma referência ampla a inchaços sem impor a localização mais específica sugerida por “hemorroidas”.
- source_word: וּבַגָּרָב
  choice: com sarna
  rationale: גָּרָב indica uma doença cutânea caracterizada por crostas; “sarna” é uma equivalência tradicional, concreta e compreensível, sem recorrer a uma descrição longa.
- source_word: וּבֶחָרֶס
  choice: com coceira
  rationale: חֶרֶס parece designar uma afecção cutânea pruriginosa. “Coceira” comunica o sintoma central sem especificar um diagnóstico moderno incerto.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: dos quais você não poderá ser curado
  rationale: Mantém a noção de incurabilidade e a voz passiva do nifal. O plural retoma naturalmente o conjunto de males enumerados.
theological_decisions:
- issue: Representação do nome divino YHWH
  choice: Javé
  alternative: SENHOR; Yahweh; Jeová
  rationale: “Javé” preserva o nome pessoal do texto hebraico numa forma natural e tradicional em português, sem substituí-lo pelo título “SENHOR” nem adotar uma vocalização tardia como “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A enumeração direta reproduz o tom solene da maldição. “Você” corresponde ao singular hebraico e mantém a interpelação individual/coletiva a Israel.
