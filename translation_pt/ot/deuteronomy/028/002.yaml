  text: וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/בְּרָכ֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֻ֑/ךָ כִּ֣י תִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: pt
  text: E todas estas bênçãos virão sobre você e o alcançarão, se você obedecer à voz de Yahweh, seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se você escutar a voz de Yahweh, seu Deus”. A expressão hebraica “ouvir/escutar a voz” frequentemente implica responder com obediência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: virão sobre você
  rationale: O perfeito com וְ, neste contexto de bênçãos condicionais, expressa consequência futura; עַל indica que as bênçãos vêm sobre o destinatário.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: todas estas bênçãos
  rationale: Tradução direta e natural do sintagma quantificado, preservando o vocabulário pactual do contexto.
- source_word: וְהִשִּׂיגֻךָ
  choice: e o alcançarão
  rationale: O hifil de נשׂג retrata as bênçãos chegando até o destinatário, como quem o alcança; esta formulação conserva a imagem sem soar artificial em português.
- source_word: כִּי
  choice: se
  rationale: No contexto imediato, a partícula introduz a condição associada às bênçãos prometidas.
- source_word: תִשְׁמַע בְּקוֹל
  choice: obedecer à voz de
  rationale: A expressão hebraica significa ouvir com resposta obediente. A formulação mantém tanto o sentido de obediência quanto a referência explícita à voz.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente o sufixo possessivo masculino singular e a relação pactual do discurso.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido de שׁמע בְּקוֹל no contexto da aliança
  choice: obedecer à voz de
  alternative: escutar a voz de; ouvir a voz de
  rationale: A expressão envolve escuta que resulta em obediência. A escolha torna explícita essa força sem eliminar a imagem hebraica da voz.
- issue: Relação expressa por כִּי
  choice: se
  alternative: porque; quando
  rationale: A estrutura das bênçãos em Deuteronômio 28 apresenta a obediência como condição; por isso, o valor condicional é o mais adequado aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” reproduz o destinatário gramatical singular; “o alcançarão” preserva a imagem vívida das bênçãos que chegam até ele.
