base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: pt
  text: Yahweh o estabelecerá como seu povo santo[a], conforme lhe jurou, se você guardar os mandamentos de Yahweh, seu Deus, e andar nos caminhos dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque você guarda os mandamentos de Yahweh, seu Deus”. A conjunção hebraica também pode ter sentido causal, embora o contexto aqui favoreça “se”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: estabelecerá você
  rationale: O hifil de קום indica aqui fazer permanecer ou estabelecer numa condição de aliança, e não levantar fisicamente.
- source_word: לּוֹ
  choice: para si
  rationale: 'Preserva a ideia de pertencimento: Yahweh estabelece o povo como pertencente a ele.'
- source_word: לְעַם קָדוֹשׁ
  choice: como povo santo
  rationale: Expressa a condição resultante e mantém a linguagem de identidade e consagração da aliança.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: conforme jurou a você
  rationale: Indica que o estabelecimento corresponde à promessa anteriormente confirmada por juramento.
- source_word: כִּי
  choice: se
  rationale: No contexto das bênçãos e maldições da aliança, a conjunção introduz mais provavelmente uma condição, embora a leitura causal seja possível.
- source_word: תִשְׁמֹר אֶת מִצְוֺת
  choice: guardar os mandamentos
  rationale: שׁמר com mandamentos significa observá-los ou cumpri-los; 'guardar' conserva a expressão bíblica sem perder clareza em português.
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: e andar nos caminhos dele
  rationale: Mantém a metáfora hebraica comum para uma conduta moldada pela vontade revelada de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a fórmula relacional da aliança e a referência inequívoca ao Deus de Israel.
theological_decisions:
- issue: Força condicional da cláusula de obediência
  choice: se você guardar... e andar
  alternative: porque você guarda... e anda
  rationale: A estrutura das bênçãos e maldições em Deuteronômio favorece uma condição real ligada à obediência da aliança, mas a nota preserva a possibilidade causal de כִּי.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação mantém a metáfora 'andar nos caminhos', o nome Yahweh e a tensão sintática de כִּי por meio de nota.
