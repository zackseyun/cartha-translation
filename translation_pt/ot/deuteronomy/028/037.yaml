base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: pt
  text: Você se tornará objeto de horror[a], provérbio e alvo de zombaria[b] entre todos os povos para onde Yahweh o conduzir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “motivo de espanto”. O termo hebraico pode indicar algo tão devastado ou terrível que provoca horror ou espanto.
    reason: lexical_alternative
  - marker: b
    text: Ou “dito de escárnio”. O hebraico emprega dois termos distintos, mas relacionados, para um provérbio ou dito proverbial e para uma expressão mordaz de zombaria pública.
    reason: lexical_alternative
  - marker: c
    text: Ou “para onde Yahweh o levar”. O verbo pode significar “conduzir”, “levar” ou “impelir”; neste contexto de exílio, pode sugerir uma condução forçada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Você se tornará
  rationale: O perfeito com waw nesta sequência de maldições tem valor futuro e resultativo. “Se tornará” expressa com naturalidade o estado que virá como resultado do juízo.
- source_word: לְשַׁמָּה
  choice: motivo de horror
  rationale: שַׁמָּה, em contextos de juízo, pode designar algo tão arruinado ou terrível que provoca horror ou espanto. A expressão deixa claro que o destinatário se torna objeto dessa reação.
- source_word: לְמָשָׁל
  choice: provérbio
  rationale: מָשָׁל significa com frequência “provérbio” ou “dito proverbial”. “Provérbio” conserva a correspondência lexical direta; o caráter depreciativo é esclarecido pelo contexto e pelo termo seguinte.
- source_word: וְלִשְׁנִינָה
  choice: alvo de zombaria
  rationale: שְׁנִינָה indica uma expressão mordaz ou insultuosa, usada para ridicularizar. “Alvo de zombaria” comunica de modo claro e natural que a pessoa será publicamente escarnecida, sem duplicar “provérbio”.
- source_word: בְּכֹל הָעַמִּים
  choice: entre todos os povos
  rationale: עַמִּים é o plural de “povo”. A tradução mantém a distinção lexical e soa natural em português.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: para onde Yahweh o expulsar
  rationale: O verbo נהג pode significar conduzir, levar ou impelir. No contexto coercivo de exílio previsto nas maldições, “expulsar” expressa melhor a remoção forçada; “para onde” incorpora naturalmente a ideia de destino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é preservado como nome pessoal divino, em vez de ser substituído por um título.
- source_word: שָׁמָּה
  choice: para onde
  rationale: O advérbio “ali/lá” é incorporado idiomaticamente à construção de destino “para onde”, evitando uma repetição artificial em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal revelado a Israel, sem substituí-lo pelo título tradicional.
- issue: Força do verbo נהג no contexto da maldição
  choice: expulsar
  alternative: conduzir
  rationale: Embora o verbo também possa descrever condução sem coerção, o contexto de exílio e dispersão favorece a ideia de remoção forçada. A nota preserva a alternativa lexical.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construção natural para leitores brasileiros. O singular masculino do hebraico é representado por “você” e “o”. “Alvo de zombaria” evita uma formulação excessivamente literal e obscura, preservando a dimensão de escárnio verbal. As três notas mantêm as ambiguidades lexicais relevantes.
