  yaml_path: translation/ot/deuteronomy/028/041.yaml
  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: pt
  text: Você gerará filhos e filhas, mas eles não serão seus[a], porque irão para o cativeiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ficarão com você”. Mais literalmente: “não serão para você”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “irão para o exílio”. O hebraico fala especificamente de cativeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: O hebraico nomeia explicitamente descendentes dos dois sexos; a expressão preserva esse par e a força retórica da maldição.
- source_word: תּוֹלִיד
  choice: você gerará
  rationale: O hifil de ילד, dirigido a um interlocutor masculino singular, expressa gerar descendência. “Gerará” é preciso, atual e mais próximo do hebraico do que o genérico “terá”.
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: mas eles não serão seus
  rationale: A construção significa literalmente que eles não serão para o destinatário. Esta formulação preserva a concisão e a ambiguidade relacional ou possessiva, enquanto o contexto esclarece que serão perdidos para o cativeiro.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a causa de os filhos e as filhas não serem do destinatário.
- source_word: יֵלְכוּ
  choice: irão
  rationale: O qal de הלך é ativo, “ir”. A tradução evita introduzir a forma passiva “serão levados”, embora o contexto implique deportação forçada.
- source_word: בַּשֶּׁבִי
  choice: para o cativeiro
  rationale: שֶׁבִי designa cativeiro, especialmente ligado à guerra e à deportação. “Para o cativeiro” é direto e idiomático após “irão”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A segunda pessoa masculina singular do hebraico é representada por “você”; “gerará” preserva o sentido de gerar sem recorrer ao arcaísmo “engendrará”.
