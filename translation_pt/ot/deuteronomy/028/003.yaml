  yaml_path: translation/ot/deuteronomy/028/003.yaml
  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: pt
  text: Você será abençoado na cidade[a], e será abençoado no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você é abençoado na cidade, e é abençoado no campo.”'
    reason: Alternativa possível para a oração nominal hebraica, que não contém verbo expresso.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito
  rationale: Adjetivo participial passivo de ברך em contexto de bênçãos da aliança. “Bendito” preserva o sentido declarativo e teológico, sem reduzi-lo à mera felicidade ou boa sorte.
- source_word: אַתָּה
  choice: você
  rationale: Pronome masculino singular que se dirige a Israel como destinatário coletivo representado no singular. “Você” é claro, atual e amplamente compreensível no português brasileiro.
- source_word: בָּעִיר
  choice: na cidade
  rationale: A preposição ב com עִיר indica localização. “Na cidade” reproduz diretamente o âmbito urbano em contraste com o campo.
- source_word: וּבָרוּךְ
  choice: e bendito
  rationale: Mantém a conjunção e a repetição intencional do predicado, preservando o paralelismo equilibrado do hebraico.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: שׂדה pode designar campo, zona rural ou terra agrícola. “No campo” conserva a imagem concreta e o contraste com a cidade.
theological_decisions:
- issue: Tradução da fórmula nominal de bênção sem verbo expresso
  choice: Bendito será você... e bendito será você...
  alternative: Bendito é você... e bendito é você...
  rationale: Embora o hebraico não expresse o verbo, o contexto das bênçãos prometidas em Deuteronômio 28 favorece em português a formulação futura “será”, sem eliminar a possibilidade gramatical de uma declaração no presente, registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição foi preservada para refletir o paralelismo hebraico; “você” comunica naturalmente o destinatário singular representativo.
