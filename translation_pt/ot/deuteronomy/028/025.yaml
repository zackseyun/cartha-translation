base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: pt
  text: Yahweh fará com que você seja derrotado diante dos seus inimigos. Por um só caminho você sairá contra eles, e por sete caminhos fugirá diante deles; você se tornará um horror[a] para todos os reinos da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “objeto de horror”. O termo hebraico pode indicar o horror ou pavor, bem como aquilo que o provoca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ יְהוָה נִגָּף
  choice: Yahweh fará com que você seja derrotado
  rationale: A construção combina נתן, “dar/entregar”, com o particípio נִגָּף, que descreve o estado de quem foi vencido. Em português, “fará com que você seja derrotado” comunica naturalmente o resultado militar sem a formulação pouco idiomática “entregará você derrotado”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: diante dos seus inimigos
  rationale: Preserva a expressão espacial hebraica, que no contexto militar indica ser vencido ou posto em fuga perante o inimigo.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: por um só caminho
  rationale: Mantém a imagem concreta e o contraste numérico entre o avanço unificado por um caminho e a fuga dispersa por sete.
- source_word: תֵּצֵא אֵלָיו
  choice: você sairá contra eles
  rationale: No contexto militar, יצא + אל indica sair para enfrentar alguém. O pronome hebraico é singular coletivo, mas o plural em português retoma naturalmente “seus inimigos”.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: mas por sete caminhos
  rationale: Conserva a imagem hebraica da dispersão completa e torna explícito, por meio de “mas”, o contraste já presente no paralelismo.
- source_word: תָּנוּס לְפָנָיו
  choice: fugirá diante deles
  rationale: Traduz diretamente נוס, “fugir”, e mantém a linguagem de derrota perante o inimigo; o plural concorda com o antecedente coletivo em português.
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: você se tornará causa de horror
  rationale: זַעֲוָה pode designar horror, pavor ou aquilo que o provoca. “Causa de horror” é natural em português e preserva o efeito público e aterrador da maldição.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: para todos os reinos da terra
  rationale: A expressão tem alcance internacional neste contexto e é adequadamente representada por “reinos da terra”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido da imagem לְזַעֲוָה
  choice: causa de horror
  alternative: objeto de horror
  rationale: A escolha mantém a força da maldição pública sem decidir de modo excessivamente estreito se Israel causa horror ou se torna algo horrendo aos olhos dos reinos; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo entre “um só caminho” e “sete caminhos” foi preservado, assim como a segunda pessoa do singular dirigida coletivamente a Israel.
