  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: pt
  text: Você servirá aos seus inimigos, que Yahweh enviará contra você, com fome, com sede, sem roupa e privado de tudo. Ele colocará um jugo de ferro sobre o seu pescoço, até destruir você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico também pode ser entendido com o inimigo como sujeito: “O inimigo colocará um jugo de ferro sobre o seu pescoço, até destruir você”. O texto principal entende que Yahweh continua sendo o sujeito.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ
  choice: Você servirá
  rationale: O verbo עבד indica aqui serviço imposto aos inimigos, não culto. O futuro expressa com naturalidade a consequência anunciada na maldição da aliança.
- source_word: אֹיְבֶיךָ
  choice: aos seus inimigos
  rationale: Tradução direta e corrente do substantivo que designa inimigos ou adversários.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: que Yahweh enviará contra você
  rationale: A construção indica que Yahweh enviará o inimigo para agir hostilmente contra o povo; “contra você” comunica com clareza o valor adversativo de בְּ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama.
- source_word: בְּרָעָב וּבְצָמָא
  choice: com fome, com sede
  rationale: Descreve as condições de privação em que o serviço será prestado e mantém o paralelismo acumulativo do hebraico.
- source_word: וּבְעֵירֹם
  choice: sem roupa
  rationale: Expressa em português atual e direto a nudez ou falta de vestuário indicada pelo termo hebraico.
- source_word: וּבְחֹסֶר כֹּל
  choice: e privado de tudo
  rationale: Comunica a carência total expressa por חֹסֶר כֹּל sem recorrer à formulação pouco natural “na falta de tudo”.
- source_word: וְנָתַן עֹל בַּרְזֶל עַל צַוָּארֶךָ
  choice: Ele colocará um jugo de ferro sobre o seu pescoço
  rationale: Mantém a imagem concreta da submissão opressiva. O pronome “Ele” permite a leitura principal com Yahweh como sujeito sem apagar por completo a possível referência ao inimigo.
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: até destruir você
  rationale: O infinitivo português preserva a ligação com o sujeito da oração anterior e traduz a severidade do Hifil de שׁמד sem intensificação indevida.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama; “Yahweh” representa o nome da aliança sem substituí-lo por um título.
- issue: Sujeito de וְנָתַן e de הִשְׁמִידוֹ
  choice: Yahweh continua sendo o sujeito
  alternative: O inimigo é o sujeito que põe o jugo e destrói
  rationale: Yahweh é o sujeito singular explícito mais próximo, e a sequência verbal pode naturalmente continuar com ele. Contudo, o hebraico admite que o inimigo enviado passe a ser o sujeito; essa possibilidade é preservada em nota.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira e compreensão internacional. O singular “você” conserva o destinatário gramatical singular do hebraico, que representa coletivamente Israel. A repetição das privações foi mantida, mas expressa de modo idiomático.
