  - severity: medium
    issue: A nota atual não é uma alternativa formal portuguesa satisfatória.
    rationale: «A visão dos seus olhos, que você verá» reproduz a repetição hebraica de forma pouco idiomática e semanticamente opaca. Não é necessária para a tradução revista, que já preserva o conteúdo relevante sem criar uma falsa impressão de literalidade.
