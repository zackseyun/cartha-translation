  to: E você ficará enlouquecido por causa do que seus olhos verão.
  rationale: A revisão conserva o futuro resultativo e o sentido passivo de «enlouquecido», mas torna inequívoca a relação causal expressa por מִן. A nota é retirada porque sua formulação mais literal não funciona bem em português e não acrescenta uma alternativa interpretativa necessária.
