base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/034.yaml
  text: And you will be driven mad by the sight your eyes see[a].
translation:
  language: pt
  text: E você ficará enlouquecido por causa do que seus olhos verão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: E você ficará
  rationale: O perfeito qal com conjunção, dentro da sequência de maldições, tem valor futuro e resultativo. “Ficará” comunica naturalmente a mudança de estado.
- source_word: מְשֻׁגָּע
  choice: enlouquecido
  rationale: O particípio passivo de שׁגע indica ser levado à loucura. “Enlouquecido” preserva o sentido passivo/resultativo sem recorrer a linguagem clínica moderna.
- source_word: מִמַּרְאֵה
  choice: com o que ... verão
  rationale: A preposição מִן exprime aqui a causa da loucura. Em português, “ficar enlouquecido com o que se vê” transmite essa relação de modo idiomático.
- source_word: עֵינֶיךָ
  choice: seus olhos
  rationale: Mantém a imagem concreta e sensorial do hebraico.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: verão
  rationale: O verbo no imperfeito assume valor futuro no contexto preditivo. A formulação conserva a referência explícita ao ato de ver, evitando a redundância pouco natural de “a visão ... que você verá” no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” representa o destinatário individual da forma hebraica; a nota preserva a construção e a repetição mais formais do original.
