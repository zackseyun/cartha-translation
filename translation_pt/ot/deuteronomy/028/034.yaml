  source_fidelity: 'O sentido central está correto: a sequência de maldição tem valor futuro, מְשֻׁגָּע expressa o estado resultante de ser levado à loucura, e מִן introduz a causa. Contudo, «por causa do que seus olhos verão» explicita de modo mais preciso a relação causal do que «com o que seus olhos verão».'
  naturalness: «Você ficará enlouquecido» é português moderno, claro e conserva adequadamente o aspecto resultativo/passivo. «Por causa do que seus olhos verão» é natural em registro bíblico contemporâneo e evita a causalidade mais solta de «com».
  terminology: «Enlouquecido» é apropriado e não introduz terminologia clínica. Não há termos teológicos ou nomes próprios a padronizar.
