  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: pt
  text: Você comerá o fruto do seu ventre[a], a carne de seus filhos e de suas filhas, que Yahweh, seu Deus, lhe deu, durante o cerco e a aflição[b] com que seu inimigo o oprimirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a descendência do seu corpo”. Em hebraico, literalmente, “o fruto do seu ventre”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a angústia” ou “o aperto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Você comerá
  rationale: O perfeito qal com conjunção tem valor futuro no contexto das maldições. A forma com “você” conserva o singular e oferece leitura natural no português brasileiro moderno.
- source_word: פְרִי בִטְנְךָ
  choice: o fruto do seu ventre
  rationale: 'Preserva a imagem hebraica solene e chocante, ao mesmo tempo que a nota esclarece seu sentido idiomático: a descendência da pessoa.'
- source_word: בְּשַׂר בָּנֶיךָ וּבְנֹתֶיךָ
  choice: a carne de seus filhos e de suas filhas
  rationale: “Carne” comunica com precisão a crueza do contexto de canibalismo, e “filhos e filhas” mantém a referência explícita aos dois sexos.
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: que Yahweh, seu Deus, lhe deu
  rationale: Mantém a oração relativa e o contraste terrível entre os filhos como dádiva divina e o juízo descrito.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: durante o cerco e a aflição
  rationale: “Cerco” expressa a situação militar; “aflição” preserva a noção ampla de aperto, angústia ou dificuldade extrema sem restringi-la indevidamente.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: com que seu inimigo o oprimirá
  rationale: O hifil de צוּק denota pressionar, constranger ou oprimir. “Oprimirá” transmite de modo claro a pressão hostil exercida pelo inimigo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pactual e segue a política indicada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, solene e claro, com boa legibilidade brasileira. O singular da interpelação hebraica foi mantido por meio de “você/seu/lhe/o”. A formulação conserva a imagem corporal e a dureza deliberada da maldição, sem suavizar o conteúdo.
