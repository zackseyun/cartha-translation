  naturalness: O texto é claro, solene e natural para o português moderno. “Olhará com maus olhos” é uma forma idiomática portuguesa compreensível; a nota explica com utilidade o sentido mais forte do hebraico.
  terminology: “Terna e delicada”, “planta do pé”, “marido que ela abraça” e a menção explícita a “seu filho e sua filha” são escolhas adequadas. A nota sobre “o homem do seu regaço” preserva a expressão íntima subjacente sem exigir uma formulação pouco natural no corpo do texto.
