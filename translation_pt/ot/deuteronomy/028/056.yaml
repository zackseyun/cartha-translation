base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: pt
  text: A mulher terna e delicada que houver entre vocês, que nunca se aventurou a pôr a planta do pé no chão por causa de seu luxo e de sua delicadeza, olhará com maus olhos[a] para o marido que ela abraça[b], para seu filho e para sua filha—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expressão hebraica: “seu olho será mau para”, isto é, ela os tratará com hostilidade ou egoísmo ressentido.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o homem do seu regaço”, expressão íntima que se refere ao marido.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה
  choice: terna
  rationale: Preserva a ideia de suavidade e fragilidade expressa por רך, em linguagem portuguesa natural e digna.
- source_word: וְהָעֲנֻגָּה
  choice: delicada
  rationale: Comunica a condição refinada ou mimada sugerida pelo particípio passivo de ענג, sem impor uma avaliação além do texto.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: que nunca se aventurou a pôr a planta do pé no chão
  rationale: Reproduz a imagem concreta e entende נִסְּתָה no sentido de tentar ou aventurar-se, mantendo a descrição de extrema delicadeza.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: tão delicada e sensível que
  rationale: Expressa naturalmente em português a relação causal entre sua condição delicada e o fato de não pôr o pé no chão. “Sensível” evita a repetição pouco elegante de “terna”, embora retenha a noção de suavidade.
- source_word: תֵּרַע עֵינָהּ
  choice: olhará com maus olhos
  rationale: Mantém a imagem do olho mau em uma expressão portuguesa inteligível, deixando que a nota esclareça seu alcance de hostilidade ou egoísmo ressentido.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: para o marido que ela abraça
  rationale: Identifica naturalmente o referente conjugal de אִישׁ e conserva a intimidade da expressão literal “homem do seu regaço” por meio da imagem do abraço.
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: para seu filho e para sua filha
  rationale: Preserva a menção individual e explícita ao filho e à filha, sem generalizá-los como “filhos”.
