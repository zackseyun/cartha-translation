base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: pt
  text: Você plantará vinhas e as cultivará, mas não beberá o vinho nem o recolherá[a], porque o verme o comerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o armazenará”. O verbo hebraico pode significar recolher, juntar ou armazenar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  choice: vinhedos
  rationale: Plural de כֶּרֶם, no sentido agrícola direto de plantações de videiras.
- source_word: תִּטַּע
  choice: você plantará
  rationale: O imperfeito qal de נטע tem valor futuro na sequência de maldições; a forma com “você” é clara e natural em português moderno.
- source_word: וְעָבָדְתָּ
  choice: e os cultivará
  rationale: עבד, em contexto agrícola, significa trabalhar ou cultivar a terra; o pronome explicita o objeto implícito, os vinhedos.
- source_word: יַיִן
  choice: o vinho
  rationale: Designa o produto esperado dos vinhedos; o artigo é natural em português neste contexto.
- source_word: לֹא תִשְׁתֶּה
  choice: não beberá
  rationale: Imperfeito negado, vertido como futuro por integrar a sequência profética das maldições da aliança.
- source_word: וְלֹא תֶאֱגֹר
  choice: nem o recolherá
  rationale: אגר pode significar recolher, juntar ou armazenar. “Recolher” preserva o sentido agrícola sem restringi-lo indevidamente, e a nota registra a alternativa.
- source_word: כִּי
  choice: porque
  rationale: Introduz diretamente a causa da perda da produção.
- source_word: תֹאכְלֶנּוּ
  choice: o comerá
  rationale: O verbo אכל conserva aqui seu sentido concreto de comer; o pronome retoma o produto masculino, o vinho.
- source_word: הַתֹּלָעַת
  choice: o verme
  rationale: O substantivo indica uma criatura destrutiva semelhante a verme ou larva; “verme” evita especificar uma espécie que o hebraico não identifica.
