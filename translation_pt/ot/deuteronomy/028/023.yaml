  yaml_path: translation/ot/deuteronomy/028/023.yaml
  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: pt
  text: Os céus acima da sua cabeça serão de bronze[a], e a terra debaixo de você será de ferro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O céu acima da sua cabeça será de cobre, e o solo debaixo de você, de ferro”.'
    reason: Alternativas lexicais legítimas para שָׁמַיִם, נְחֹשֶׁת e אֶרֶץ no contexto.
lexical_decisions:
- source_word: וְהָיוּ
  choice: serão
  rationale: O perfeito qal com conjunção, no contexto das maldições da aliança, tem valor futuro; “serão” expressa com naturalidade a previsão solene.
- source_word: שָׁמֶיךָ
  choice: os céus
  rationale: שָׁמַיִם pode significar “céus” ou “céu”. “Os céus” preserva a forma hebraica e a ressonância bíblica, enquanto a expressão seguinte comunica a referência ao céu sobre a pessoa.
- source_word: אֲשֶׁר עַל רֹאשְׁךָ
  choice: acima da sua cabeça
  rationale: Forma natural e clara de preservar a relação espacial e o paralelismo vertical do hebraico.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze. “Bronze” comunica bem a imagem de dureza e forma o par tradicional com “ferro”, sem eliminar a alternativa lexical registrada em nota.
- source_word: וְהָאָרֶץ
  choice: e a terra
  rationale: אֶרֶץ pode significar “terra”, “solo” ou “país”. O contraste com “os céus” e a indicação “debaixo de você” favorecem “terra” no texto principal.
- source_word: אֲשֶׁר תַּחְתֶּיךָ
  choice: debaixo de você
  rationale: Expressão corrente, compreensível no português internacional e brasileiro, que preserva o paralelismo com “acima da sua cabeça”.
- source_word: בַּרְזֶל
  choice: ferro
  rationale: Equivalente direto e usual do termo hebraico, mantendo a imagem do chão duro e improdutivo.
theological_decisions:
- issue: Força metafórica da imagem da maldição
  choice: Manter literalmente as imagens de “bronze” e “ferro”, sem explicar no texto principal a seca e a dureza implícitas.
  alternative: Parafrasear como céu sem chuva e solo endurecido pela seca.
  rationale: O hebraico apresenta uma metáfora vívida da maldição da aliança. Preservar a imagem mantém sua força e evita introduzir no texto uma explicação que, embora contextual, não está expressa no versículo.
- issue: Alcance de אֶרֶץ
  choice: Traduzir por “terra” no texto principal.
  alternative: Traduzir por “solo”.
  rationale: “Terra” conserva o contraste formal com “os céus”, enquanto a nota registra a leitura contextual “solo” sem restringir indevidamente a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é direta e mantém o paralelismo entre o que está acima da cabeça e o que está debaixo da pessoa. O marcador [a] aparece imediatamente após “bronze”, conforme exigido.
