base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: pt
  text: Entre aquelas nações, você não encontrará descanso[a], nem haverá lugar de repouso para a planta do seu pé. Ali Yahweh lhe dará um coração trêmulo, olhos que definham[b] e angústia de alma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “você não terá sossego”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “definhamento dos olhos”; também pode indicar olhos que desfalecem.
    reason: lexical_alternative
  - marker: c
    text: Ou “tristeza de alma” ou “dor de alma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: você não encontrará descanso
  rationale: O hifil de רגע, neste contexto, expressa conseguir sossegar ou estar em repouso. “Não encontrará descanso” é natural em português e se ajusta ao contexto da maldição do exílio.
- source_word: מָנוֹחַ
  choice: lugar de repouso
  rationale: O substantivo pode indicar tanto repouso quanto um lugar onde repousar. A expressão seguinte, “para a planta do seu pé”, favorece aqui o sentido concreto.
- source_word: לְכַף רַגְלֶךָ
  choice: para a planta do seu pé
  rationale: כַּף, em associação com רֶגֶל, designa a parte inferior do pé. A tradução preserva com clareza a imagem hebraica.
- source_word: וְנָתַן יְהוָה לְךָ שָׁם
  choice: Ali Yahweh lhe dará
  rationale: A posição inicial de “Ali” mantém a ênfase hebraica no lugar do desterro, com sintaxe natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵב רַגָּז
  choice: um coração trêmulo
  rationale: רַגָּז comunica tremor, agitação ou inquietação. “Coração trêmulo” conserva a imagem física e emocional do hebraico.
- source_word: כִּלְיוֹן עֵינַיִם
  choice: olhos que se consomem
  rationale: כִּלְיוֹן sugere definhamento, esgotamento ou falência. A formulação conserva a imagem intensa sem limitar indevidamente sua causa a deficiência visual.
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: angústia de alma
  rationale: דַּאֲבוֹן pode denotar dor, tristeza ou angústia. “Angústia de alma” preserva a intensidade da expressão e mantém נֶפֶשׁ como “alma”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o paralelismo, as imagens corporais e a intensidade psicológica do hebraico sem esclarecer além do que o original permite.
