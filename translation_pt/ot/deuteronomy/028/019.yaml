  text: אָר֥וּר אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וְ/אָר֥וּר אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: pt
  text: Maldito será você ao entrar[a], e maldito será você ao sair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em seu entrar... em seu sair”; expressão hebraica que abrange todo o curso da vida cotidiana.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: O particípio/adjetivo passivo significa “amaldiçoado, maldito”. “Maldito” preserva a força solene e a posição enfática da fórmula de maldição da aliança.
- source_word: אַתָּה
  choice: você
  rationale: Pronome masculino singular de segunda pessoa. “Você” é claro e amplamente compreensível no português moderno, mantendo a interpelação singular a Israel como parte da formulação da aliança.
- source_word: בְּבֹאֶךָ
  choice: ao entrar
  rationale: A preposição בְּ com o infinitivo construto de בוא e sufixo de segunda pessoa masculina singular significa literalmente “em teu entrar”. “Ao entrar” reproduz de modo natural a relação temporal e mantém o paralelismo.
- source_word: וְ
  choice: e
  rationale: Conjunção simples que liga as duas orações paralelas.
- source_word: בְּצֵאתֶךָ
  choice: ao sair
  rationale: A preposição בְּ com o infinitivo construto de יצא e sufixo de segunda pessoa masculina singular significa literalmente “em teu sair”. “Ao sair” é natural e conserva a expressão pareada com “ao entrar”.
theological_decisions:
- issue: Reprodução da fórmula de maldição da aliança com sua ênfase e solenidade
  choice: Maldito será você ao entrar, e maldito será você ao sair.
  alternative: Você será amaldiçoado ao entrar e ao sair.
  rationale: O hebraico antepõe אָרוּר nas duas orações, dando ênfase à condição de maldito. A tradução escolhida conserva essa ordem e a repetição solene sem recorrer a linguagem arcaica, enquanto a alternativa achata o paralelismo e a ênfase.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A estrutura paralela e a repetição de “maldito” preservam a cadência solene do hebraico; “você” expressa com clareza a segunda pessoa singular.
