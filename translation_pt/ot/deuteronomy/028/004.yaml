base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: pt
  text: 'Bendito será o fruto do seu ventre, o fruto da sua terra e o fruto dos seus animais: as crias das suas manadas e os filhotes dos seus rebanhos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a multiplicação do seu gado e as crias do seu rebanho”. As expressões hebraicas שְׁגַר אֲלָפֶיךָ e עַשְׁתְּרֹת צֹאנֶךָ são termos tradicionais referentes ao aumento dos animais por reprodução.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito será
  rationale: Mantém a fórmula de bênção em valor futuro/resultativo no contexto das bênçãos da aliança, com cadência natural e solene em português.
- source_word: פְּרִי
  choice: fruto
  rationale: A repetição de “fruto” nas três ocorrências preserva o paralelismo e a unidade retórica do hebraico, ainda que a terceira ocorrência seja metafórica.
- source_word: בִטְנְךָ
  choice: seu ventre
  rationale: Neste contexto, refere-se ao ventre como origem dos filhos. A formulação é concreta, tradicional e compreensível em português.
- source_word: אַדְמָתְךָ
  choice: sua terra
  rationale: Designa o solo produtivo ou cultivado; “terra” é mais natural em português corrente do que “solo” nesta fórmula de bênção.
- source_word: בְהֶמְתֶּךָ
  choice: seus animais
  rationale: É um termo abrangente para animais domésticos. “Animais” evita restringir indevidamente o sentido a bovinos, e as expressões seguintes especificam manadas e rebanhos.
- source_word: שְׁגַר
  choice: crias
  rationale: No estado construto com אֲלָפֶיךָ, indica aquilo que os animais dão à luz, isto é, sua descendência ou aumento reprodutivo.
- source_word: אֲלָפֶיךָ
  choice: suas manadas
  rationale: Embora o substantivo possa designar bois ou gado bovino, “manadas” expressa naturalmente o coletivo em contraste paralelo com “rebanhos”.
- source_word: עַשְׁתְּרֹת
  choice: filhotes
  rationale: Na expressão tradicional ligada a צֹאן, denota as crias ou o aumento do rebanho. “Filhotes” comunica claramente o sentido sem repetição estilística desnecessária.
- source_word: צֹאנֶךָ
  choice: seus rebanhos
  rationale: Termo coletivo que abrange especialmente ovelhas e cabras; “rebanhos” preserva essa abrangência e faz bom paralelo com “manadas”.
