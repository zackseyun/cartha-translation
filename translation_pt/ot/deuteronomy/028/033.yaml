base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: pt
  text: Um povo que você não conheceu comerá o fruto da sua terra[a] e tudo o que resultou do seu trabalho[b]; e você será apenas oprimido e esmagado durante todos os seus dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a produção da sua terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todo o seu trabalho” ou “todo o seu esforço”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: o fruto da sua terra
  rationale: Preserva a imagem agrícola concreta do hebraico e soa natural em português; a expressão também pode abranger toda a produção da terra.
- source_word: כָל יְגִיעֲךָ
  choice: tudo o que resultou do seu trabalho
  rationale: Como יֹאכַל rege também esta expressão, o contexto favorece o produto obtido pelo trabalho, não o ato abstrato de trabalhar. A formulação torna essa relação inteligível sem especificar além do texto.
- source_word: יֹאכַל
  choice: comerá
  rationale: Mantém o verbo hebraico comum e sua imagem direta de um povo estrangeiro consumindo a produção.
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  choice: um povo que você não conheceu
  rationale: Reflete o coletivo singular עַם e o perfeito de ידע, indicando um povo até então desconhecido pelo destinatário.
- source_word: רַק
  choice: continuamente
  rationale: No conjunto com כָּל הַיָּמִים, comunica que a opressão será a condição exclusiva e persistente do destinatário; evita o português pouco natural de 'será somente oprimido'.
- source_word: עָשׁוּק
  choice: oprimido
  rationale: Expressa com clareza a condição passiva de sofrer opressão, injustiça ou exploração.
- source_word: רָצוּץ
  choice: esmagado
  rationale: Conserva a força da imagem de ser quebrantado ou esmagado, formando um paralelo vigoroso com 'oprimido'.
- source_word: כָל הַיָּמִים
  choice: continuamente
  rationale: Traduz idiomaticamente a duração persistente da expressão hebraica neste contexto, sem sugerir necessariamente apenas o período de uma vida individual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para o singular hebraico. A redação mantém as imagens agrícolas e violentas do original, enquanto explicita de modo natural que יְגִיעַ pode designar aquilo que o trabalho produziu. Todos os marcadores de nota aparecem no texto.
