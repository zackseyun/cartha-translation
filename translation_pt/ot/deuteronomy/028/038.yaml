  text: זֶ֥רַע רַ֖ב תּוֹצִ֣יא הַ/שָּׂדֶ֑ה וּ/מְעַ֣ט תֶּאֱסֹ֔ף כִּ֥י יַחְסְלֶ֖/נּוּ הָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: pt
  text: Você levará muita semente ao campo[a], mas recolherá pouco, porque o gafanhoto a consumirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você semeará muita semente no campo, mas colherá pouco.” Mais literalmente, o hebraico diz “levará muita semente ao campo” e “recolherá pouco”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: muita semente
  rationale: זֶרַע designa semente, especialmente para semeadura, e רַב indica grande quantidade. A expressão preserva a imagem agrícola concreta e é natural em português.
- source_word: תּוֹצִיא
  choice: levará
  rationale: O hifil de יצא significa literalmente fazer sair, trazer ou levar para fora. No contexto, refere-se a levar a semente ao campo para semeá-la; “levará” conserva a imagem hebraica sem explicitar em excesso a ação de semear.
- source_word: הַשָּׂדֶה
  choice: ao campo
  rationale: שָׂדֶה é o termo comum para campo ou terra cultivada. A contração “ao” expressa com naturalidade o destino indicado no contexto.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: mas recolherá pouco
  rationale: אָסַף significa reunir ou recolher e, neste contexto agrícola, alude à colheita. “Recolherá pouco” mantém o verbo concreto e o contraste entre muita semente e pouco produto.
- source_word: כִּי
  choice: porque
  rationale: כִּי introduz aqui a causa do pequeno resultado da colheita; “porque” é o conector causal mais claro.
- source_word: יַחְסְלֶנּוּ
  choice: a consumirá
  rationale: חסל comunica a ideia de consumir ou acabar completamente. O pronome feminino “a” retoma naturalmente “semente”, embora no contexto possa abranger aquilo que dela brotar.
- source_word: הָאַרְבֶּה
  choice: o gafanhoto
  rationale: אַרְבֶּה é o termo habitual para gafanhoto migratório. O singular definido pode ter sentido coletivo; “o gafanhoto” conserva essa forma e continua compreensível em português.
