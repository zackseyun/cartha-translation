base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: pt
  text: Ela consumirá as crias dos seus animais e o produto da sua terra, até que você seja destruído. Não lhe deixará cereal, vinho novo nem azeite, nem os bezerros do seu gado ou os cordeiros do seu rebanho[a], até que ela o destrua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as crias do seu rebanho”. A expressão hebraica עַשְׁתְּרֹת צֹאנֶךָ refere-se à produção reprodutiva do rebanho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: Ela consumirá
  rationale: O verbo significa literalmente “comer”, mas, neste contexto de invasão e esgotamento de recursos, “consumirá” comunica melhor a ação devastadora. O pronome feminino retoma naturalmente “a nação” do contexto anterior.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: as crias dos seus animais
  rationale: פְּרִי, literalmente “fruto”, refere-se aqui à descendência dos animais; בְּהֵמָה é um termo amplo para animais domésticos.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: o produto da sua terra
  rationale: A expressão designa a produção agrícola da terra, e esta formulação é clara e natural em português.
- source_word: עַד הִשָּׁמְדָךְ
  choice: até que você seja destruído
  rationale: A construção indica o ponto final da devastação. A voz passiva preserva a forma e a gravidade do hebraico sem ampliar o sentido para “aniquilado”.
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: Não lhe deixará
  rationale: Expressa de modo idiomático a privação total descrita pela oração relativa hebraica.
- source_word: דָּגָן
  choice: cereal
  rationale: O termo abrange os grãos cultivados em geral. “Cereal” evita a possível leitura restrita de “grão” como unidade ou semente individual.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: O termo costuma designar vinho recém-produzido ou mosto; “vinho novo” mantém a distinção tradicional e contextual.
- source_word: יִצְהָר
  choice: azeite
  rationale: Na tríade agrícola com cereal e vinho novo, o termo se refere ao óleo de oliva. “Azeite” é preciso e natural em português.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: os bezerros do seu gado
  rationale: שְׁגַר denota a cria ou produção do gado bovino; “bezerros” expressa naturalmente o referente concreto no contexto.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: os cordeiros do seu rebanho[a]
  rationale: No paralelismo sobre a produção dos animais, a expressão aponta para a descendência ou aumento do rebanho. “Cordeiros” é claro no texto, enquanto a amplitude lexical é registrada em nota.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: até acabar com você
  rationale: O hifil de אבד é causativo, “fazer perecer” ou “destruir”. “Acabar com você” preserva a severidade e evita a repetição estilisticamente pesada de “destruído” na mesma frase.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com preferência por vocabulário amplamente compreensível no Brasil e internacionalmente. O tratamento por “você” mantém clareza contemporânea; “lhe” evita repetição. A repetição hebraica de destruição é parcialmente variada sem atenuar a intensidade da maldição.
