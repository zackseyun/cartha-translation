base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: pt
  text: Ele lhe emprestará[a], mas você não emprestará a ele; ele será a cabeça, e você será a cauda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o estrangeiro residente mencionado no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: lhe emprestará / emprestará a ele
  rationale: O Hiphil de לוה neste contexto indica emprestar, estabelecendo a assimetria entre credor e devedor. A formulação preserva o paralelismo e a reversão da dependência econômica.
- source_word: הוּא
  choice: ele
  rationale: O pronome masculino singular retoma o estrangeiro residente mencionado no versículo anterior e conserva a forma representativa do hebraico.
- source_word: לְרֹאשׁ
  choice: a cabeça
  rationale: Mantém a metáfora hebraica de proeminência ou domínio e sua ligação com a linguagem anterior das bênçãos e maldições da aliança.
- source_word: לְזָנָב
  choice: a cauda
  rationale: Preserva a contraparte vívida de “a cabeça”, exprimindo posição subordinada.
- source_word: יִהְיֶה / תִּהְיֶה
  choice: será
  rationale: Expressa naturalmente em português o estado futuro resultante anunciado pela maldição.
- source_word: וְאַתָּה
  choice: mas você / e você
  rationale: A primeira ocorrência recebe valor adversativo explícito; a segunda mantém a coordenação, preservando o contraste enfático do paralelismo.
theological_decisions:
- issue: Referência masculina singular
  choice: Manter “ele” e “você” no singular
  alternative: Empregar formas plurais ou repetir “o estrangeiro” no texto principal
  rationale: O hebraico usa o masculino singular e retoma de modo representativo o estrangeiro residente do versículo anterior. O singular conserva tanto a referência gramatical quanto o estilo pronominal do original, sem tornar explícito no corpo do texto o que está apenas implícito.
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Você” comunica diretamente o singular hebraico; as metáforas “cabeça” e “cauda” foram preservadas. Não se incluiu a nota lexical inglesa associada a [b], pois ela parece deslocada: sua explicação trata do verbo “emprestar”, não de “cabeça”; a alternativa relevante já é adequadamente representada no texto e nas decisões lexicais.'
