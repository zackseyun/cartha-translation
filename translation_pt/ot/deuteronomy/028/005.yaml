- source_word: בָּרוּךְ
  choice: Benditos serão
  rationale: O particípio passivo de ברך tem valor predicativo numa fórmula de bênção. No contexto das bênçãos da aliança, o futuro em português comunica seu caráter declarativo, sem convertê-lo em mero desejo.
- source_word: טַנְאֲךָ
  choice: o seu cesto
  rationale: טֶנֶא designa um cesto, especialmente para transportar produtos agrícolas. “Cesto” é natural e fiel sem acrescentar uma especificação ausente no hebraico.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: e a sua tigela de amassar
  rationale: מִשְׁאֶרֶת designa um recipiente usado no preparo e amassamento da massa. “Tigela de amassar” é claro em português moderno e preserva a função do objeto.
