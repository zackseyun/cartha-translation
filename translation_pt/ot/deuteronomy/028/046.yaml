base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: pt
  text: E elas[b] estarão sobre você e sobre a sua descendência[a], como sinal e prodígio, para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sobre os seus descendentes»; o hebraico usa «semente», termo que pode designar coletivamente os filhos ou a posteridade de alguém.
    reason: lexical_alternative
  - marker: b
    text: «Elas» se refere às maldições descritas no contexto anterior.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: E elas ficarão
  rationale: O perfeito qal com a conjunção dá continuidade às consequências futuras anunciadas no contexto. “Ficarão” expressa tanto a projeção futura quanto a permanência dessas consequências.
- source_word: בְךָ
  choice: sobre você
  rationale: A preposição indica que as maldições recaem sobre o destinatário e permanecem ligadas a ele. “Sobre você” preserva essa imagem de imposição.
- source_word: לְאוֹת
  choice: como sinal
  rationale: אוֹת designa um sinal ou marca indicativa. “Como sinal” é natural e mantém sua função de evidência visível.
- source_word: וּלְמוֹפֵת
  choice: e prodígio
  rationale: מוֹפֵת pode significar prodígio, maravilha ou portento. “Prodígio” preserva a associação tradicional e semanticamente ampla com “sinal”, sem explicitar além do texto seu caráter ameaçador.
- source_word: וּבְזַרְעֲךָ
  choice: e sobre a sua descendência
  rationale: זֶרַע, literalmente “semente”, refere-se coletivamente à posteridade. “Descendência” é corrente em português e preserva o valor coletivo; a repetição de “sobre” mantém o paralelismo hebraico.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: A expressão indica duração contínua e indefinida. “Para sempre” é o equivalente português usual, sem acrescentar uma definição filosófica de eternidade.
theological_decisions:
- issue: Referente de “elas”
  choice: O pronome feminino plural remete contextualmente às maldições descritas nos versículos anteriores.
  alternative: Explicitar no texto principal “essas maldições” ou entender a referência de modo mais amplo como todas as sanções da aliança.
  rationale: O hebraico emprega o verbo no plural sem repetir o sujeito. O pronome preserva essa forma, enquanto a nota esclarece o referente mais provável sem inseri-lo interpretativamente no texto.
- issue: Alcance de עַד עוֹלָם
  choice: “para sempre”, sem definir se a duração é metafisicamente ilimitada.
  alternative: “perpetuamente” ou “por todas as gerações”.
  rationale: No discurso da aliança, a expressão comunica duração persistente. A tradução mantém seu equivalente normal sem transformá-la numa afirmação doutrinária mais específica do que o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo “sobre você e sobre a sua descendência” reproduz a estrutura hebraica; “sinal e prodígio” mantém a dupla expressão sem eliminar sua tensão semântica.
