  naturalness: O texto é em geral claro e digno. “Se consumirão de saudade por eles” é compreensível, mas “se consumirão de saudade deles” é mais natural no português brasileiro e internacional. A coordenação com “enquanto” expressa melhor a relação durativa do hebraico.
