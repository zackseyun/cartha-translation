base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: pt
  text: Seus filhos e suas filhas serão entregues a outro povo; enquanto seus olhos os verão e se consumirão de saudade deles o dia inteiro, não haverá poder em sua mão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isso não estará em seu poder”. Literalmente, “não haverá poder para sua mão”; é uma expressão hebraica de incapacidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: Seus filhos e suas filhas
  rationale: O hebraico nomeia explicitamente os descendentes de ambos os sexos; a tradução preserva essa forma e a força pessoal da maldição.
- source_word: נְתֻנִים
  choice: serão entregues
  rationale: O particípio passivo tem valor predicativo e, no contexto das maldições futuras, é expresso naturalmente pelo futuro passivo. “Entregues” comunica melhor que se trata de serem postos sob o poder de outrem.
- source_word: לְעַם אַחֵר
  choice: a outro povo
  rationale: Reproduz de perto עַם e אַחֵר sem acrescentar a nuance política de “nação” nem explicitar além do texto que se trata de um povo estrangeiro.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: seus olhos verão isso
  rationale: Mantém a imagem hebraica dos próprios olhos testemunhando a perda; “isso” torna o objeto implícito claro em português sem ampliar o conteúdo.
- source_word: וְכָלוֹת אֲלֵיהֶם
  choice: e se consumirão de saudade por eles
  rationale: כלה descreve os olhos que se esgotam ou definham voltados para os filhos. A formulação conserva a metáfora corporal e torna explícito o anseio indicado pelo contexto.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Equivalente português natural que preserva a duração contínua da expressão hebraica.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: mas não haverá força em suas mãos
  rationale: Traduz de modo claro a expressão idiomática hebraica de incapacidade, preservando a imagem das mãos e evitando que לְאֵל seja entendido indevidamente como referência à divindade.
theological_decisions:
- issue: Sentido de וְאֵין לְאֵל יָדֶךָ
  choice: mas não haverá força em suas mãos
  alternative: mas isso não estará em seu poder
  rationale: A expressão indica ausência de capacidade para intervir, não faz uma afirmação sobre Deus. A tradução escolhida preserva a imagem hebraica das mãos sem produzir uma leitura teológica enganosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e as imagens concretas do hebraico foram preservados, enquanto a sintaxe foi ajustada para fluência natural.
