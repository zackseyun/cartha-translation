base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: pt
  text: Maldito será o fruto do seu ventre e o fruto do seu solo, as crias do seu gado e os filhotes dos seus rebanhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito será
  rationale: Mantém a fórmula declarativa de maldição e a cadência do contexto da aliança.
- source_word: פְּרִי בִטְנְךָ
  choice: o fruto do seu ventre
  rationale: Preserva a metáfora hebraica tradicional para os descendentes, com linguagem clara e digna em português.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: e o fruto do seu solo
  rationale: Conserva o paralelismo lexical com “fruto do seu ventre”; “solo” expressa a terra cultivável indicada por אֲדָמָה.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: as crias do seu gado
  rationale: Expressa de modo natural os animais nascidos do gado bovino, sem recorrer a linguagem arcaica.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: e os filhotes dos seus rebanhos
  rationale: Comunica o aumento ou as crias dos rebanhos de animais menores e evita uma associação indevida com o nome Astarote.
