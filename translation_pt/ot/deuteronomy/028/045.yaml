  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: pt
  text: E todas estas maldições virão sobre você, o perseguirão e o alcançarão, até que você seja destruído, porque não ouviu a voz de Yahweh, seu Deus[a], para guardar os mandamentos e os estatutos que ele lhe ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque você não obedeceu a Yahweh, seu Deus, guardando os seus mandamentos e os seus estatutos”. O hebraico diz literalmente “não ouviu a voz de”.'
    reason: Registra o sentido idiomático de obediência sem retirar do texto principal a metáfora auditiva do hebraico.
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: virão sobre você
  rationale: O perfeito com waw, neste contexto de advertência da aliança, tem sentido futuro; “sobre você” preserva o movimento hostil expresso por עַל.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: todas estas maldições
  rationale: Tradução direta e natural da expressão no contexto das bênçãos e maldições de Deuteronômio.
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: o perseguirão e o alcançarão
  rationale: 'Mantém a sequência figurativa hebraica: as maldições perseguem a pessoa e finalmente a alcançam.'
- source_word: עַד הִשָּׁמְדָךְ
  choice: até que você seja destruído
  rationale: Expressa de modo idiomático o ponto final indicado pelo infinitivo com sufixo, sem acrescentar um agente explícito da destruição.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: porque não ouviu a voz
  rationale: Preserva a metáfora auditiva do hebraico, embora a expressão também comunique a ideia de obedecer.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Translitera o nome divino da aliança e traduz naturalmente a relação possessiva.
- source_word: לִשְׁמֹר
  choice: para guardar
  rationale: Conserva o valor infinitivo e a ligação formal com o ato de ouvir a voz, sem determinar de modo excessivo se a nuance é propósito, resultado ou conteúdo da obediência.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: os mandamentos e os estatutos
  rationale: Mantém a distinção entre os dois termos jurídicos e o registro da aliança.
- source_word: אֲשֶׁר צִוָּךְ
  choice: que ele lhe ordenou
  rationale: Reproduz a oração relativa e deixa explícita a origem divina das prescrições.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de שׁמע בקול
  choice: não ouviu a voz
  alternative: não obedeceu
  rationale: A expressão implica obediência, mas a redação principal mantém a imagem hebraica de escutar a voz; a nota registra a tradução dinâmica possível.
- issue: Relação do infinitivo לִשְׁמֹר com o ato de ouvir
  choice: para guardar
  alternative: guardando; de modo a guardar
  rationale: “Para guardar” conserva a construção infinitiva e sua possível amplitude, evitando reduzir a relação apenas a modo ou instrumento.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “você” para clareza e naturalidade brasileira. A formulação preserva o paralelismo solene da advertência e usa “estatutos” para manter o registro jurídico da aliança.
