base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: pt
  text: Mas, se você não ouvir a voz de Yahweh, seu Deus[a], para guardar e cumprir todos os seus mandamentos e estatutos que hoje lhe ordeno[b], todas estas maldições virão sobre você e o alcançarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ouvir a voz de”. A expressão inclui a ideia de ouvir com obediência; outra tradução possível é “obedecer a Yahweh, seu Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “guardando e cumprindo todos os seus mandamentos e estatutos que hoje lhe ordeno”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: Mas, se
  rationale: Introduz naturalmente em português a condição negativa que contrasta com a seção anterior de bênçãos, sem reproduzir de modo rígido a fórmula hebraica.
- source_word: תִשְׁמַע בְּקוֹל
  choice: ouvir a voz de
  rationale: Preserva a imagem auditiva e pactual do idioma hebraico, que no contexto implica ouvir com obediência; a nota registra a alternativa mais explícita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de maneira direta a expressão pactual com sufixo de segunda pessoa masculina singular.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: guardando e cumprindo
  rationale: Mantém os dois elementos hebraicos — observar cuidadosamente e pôr em prática — em uma construção portuguesa natural, sem acrescentar o advérbio 'cuidadosamente'.
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: todos os seus mandamentos e estatutos
  rationale: Conserva a distinção do vocabulário jurídico-pactual entre mandamentos e estatutos.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhe ordeno
  rationale: Expressa com clareza e dignidade a ordem dada no presente discurso, mantendo a ênfase temporal em 'hoje'.
- source_word: וּבָאוּ עָלֶיךָ
  choice: virão sobre você
  rationale: Tradução natural do idioma que descreve as maldições sobrevindo à pessoa.
- source_word: וְהִשִּׂיגוּךָ
  choice: e o alcançarão
  rationale: Preserva a imagem vívida de perseguição, segundo a qual as maldições alcançam o desobediente.
theological_decisions:
- issue: Representação do nome pactual יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o nome divino; a transliteração preserva sua condição de nome pessoal sem trocá-lo por um título.
- issue: Grau de explicitação do idioma de obediência תִשְׁמַע בְּקוֹל
  choice: ouvir a voz de
  alternative: obedecer
  rationale: A formulação escolhida conserva a textura do hebraico e sua associação entre ouvir e obedecer, enquanto a nota torna explícito o sentido idiomático sem eliminar a imagem original.
- issue: Relação de לִשְׁמֹר לַעֲשׂוֹת com o ato de ouvir
  choice: guardando e cumprindo
  alternative: para guardar e cumprir
  rationale: O gerúndio apresenta a observância prática como expressão do ouvir obediente. A nota preserva a possibilidade de representar mais formalmente os dois infinitivos hebraicos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para a segunda pessoa singular do discurso e “lhe/o” como complementos. Mantém o paralelismo jurídico-pactual e a imagem concreta das maldições que vêm e alcançam.
