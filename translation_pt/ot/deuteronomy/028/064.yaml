base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: pt
  text: E Yahweh espalhará você entre todos os povos, de uma extremidade da terra à outra[a]. Ali você servirá a outros deuses que nem você nem seus antepassados conheceram — madeira e pedra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de uma extremidade do país à outra”. A palavra hebraica אֶרֶץ pode significar “terra” em sentido amplo ou “terra, país, território”. Aqui, “terra” em sentido amplo é favorecido pela dispersão entre todos os povos.'
    reason: lexical_alternative
  - marker: b
    text: “Madeira e pedra” refere-se a ídolos feitos desses materiais.
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: espalhará você
  rationale: O hifil de פוץ expressa fazer alguém dispersar-se. “Espalhará você” é natural em português e mantém a força da maldição da aliança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּכָל הָעַמִּים
  choice: entre todos os povos
  rationale: עַמִּים designa povos; “entre” comunica de modo idiomático a dispersão no meio deles.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: de uma extremidade da terra à outra
  rationale: Reproduz o sentido de extensão geográfica total sem a repetição pouco natural de “extremidade da terra” em português. “Terra” preserva a possível referência ao mundo, favorecida pelo contexto.
- source_word: וְעָבַדְתָּ
  choice: você servirá
  rationale: Mantém o sentido básico de עבד e deixa que o objeto “outros deuses” comunique a dimensão cultual e idólatra.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Equivalente direto da expressão hebraica, sem acrescentar a ideia mais específica de deuses estrangeiros.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: que nem você nem seus antepassados conheceram
  rationale: Conserva o verbo ידע como “conhecer” e expressa de forma corrente a negação correlativa. “Antepassados” é mais abrangente e claro no português atual do que “pais” neste contexto.
- source_word: עֵץ וָאָבֶן
  choice: madeira e pedra
  rationale: Mantém a aposição concisa do hebraico, identificando metonimicamente os deuses como ídolos feitos desses materiais.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Alcance de הָאָרֶץ na fórmula de dispersão
  choice: terra, no sentido amplo
  alternative: terra, no sentido de território ou país
  rationale: אֶרֶץ permite ambos os sentidos. A dispersão “entre todos os povos” favorece aqui o alcance mais amplo, mas a alternativa lexical genuína é registrada em nota.
- issue: Natureza do serviço a outros deuses
  choice: servirá
  alternative: adorará
  rationale: “Servirá” preserva a formulação hebraica e sua amplitude, embora no contexto o serviço seja religioso e implique culto idólatra.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “você” para o singular hebraico e “antepassados” para evitar a possível leitura restrita de “pais”. O travessão preserva a força da aposição final.
