  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: pt
  text: a ponto de não dar a nenhum deles nada da carne de seus filhos[a], que ele está comendo, porque não lhe restou coisa alguma, no cerco e na aflição com que o seu inimigo o oprimirá em todas as suas cidades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz especificamente “filhos”, no masculino, e não emprega o termo mais geral para “crianças”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em todos os seus portões”; os portões representam as cidades onde o povo mora.'
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: a ponto de não dar a nenhum deles
  rationale: A construção com מִן e o infinitivo de נתן continua a frase do versículo anterior e comunica retenção ou recusa. A formulação escolhida preserva essa continuidade e soa natural em português.
- source_word: מִבְּשַׂר בָּנָיו
  choice: nada da carne dos filhos
  rationale: Mantém o termo concreto e chocante בָּשָׂר, “carne”, e traduz בָּנָיו como “filhos”, que no hebraico está no masculino.
- source_word: אֲשֶׁר יֹאכֵל
  choice: que está comendo
  rationale: O imperfeito descreve vividamente a ação no cenário profético do cerco; o presente progressivo comunica bem a simultaneidade em português.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: porque não lhe restou coisa alguma
  rationale: 'A expressão explica a recusa em repartir: nada permanece para ele. “Coisa alguma” preserva a totalidade de כֹּל com clareza.'
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: no cerco e na aflição
  rationale: “Cerco” traduz diretamente מָצוֹר; “aflição” expressa a pressão extrema de מָצוֹק sem limitar o termo a uma emoção interior.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: com que o seu inimigo o oprimirá
  rationale: O Hifil de צוּק indica causar aperto ou aflição; “oprimirá” transmite a pressão hostil exercida pelo inimigo durante o cerco.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: em todas as suas cidades
  rationale: Literalmente, “em todos os seus portões”; aqui “portões” funciona metonimicamente para as cidades ou localidades fortificadas. A tradução no corpo do texto comunica diretamente o referente ao leitor moderno.
