base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male slaves and female slaves, but there will be no buyer.
translation:
  language: pt
  text: 'E Yahweh levará vocês de volta ao Egito em navios, pelo caminho a respeito do qual eu lhes disse: “Vocês nunca mais voltarão a ver o Egito”. Ali vocês se oferecerão aos seus inimigos como escravos e escravas[a], mas não haverá quem os compre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ali vocês serão vendidos aos seus inimigos como escravos e escravas”. O verbo hebraico pode ser entendido em sentido reflexivo (“oferecer-se para venda”) ou, de modo mais geral, como entrada na escravidão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: levará vocês de volta
  rationale: O hifil de שוב é causativo; esta formulação natural em português preserva a ideia de Yahweh fazer o povo retornar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Forma portuguesa convencional do topônimo.
- source_word: בָּאֳנִיּוֹת
  choice: em navios
  rationale: Expressa de modo direto o meio de transporte indicado por בְּ com o plural de 'navio'.
- source_word: בַּדֶּרֶךְ אֲשֶׁר אָמַרְתִּי לְךָ
  choice: pelo caminho a respeito do qual eu lhes disse
  rationale: Mantém a ligação sintática entre 'caminho' e a declaração anterior, sem decidir se דרך enfatiza rota ou modo.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: Vocês nunca mais voltarão a vê-lo
  rationale: Reproduz naturalmente a construção idiomática de יסף com עוד, que nega a repetição futura da ação; o pronome retoma 'caminho'.
- source_word: וְהִתְמַכַּרְתֶּם
  choice: vocês se oferecerão
  rationale: A forma hitpael admite sentido reflexivo ou médio. 'Se oferecerão' combina com a ausência posterior de comprador e evita pressupor uma venda concluída.
- source_word: לְאֹיְבֶיךָ
  choice: aos seus inimigos
  rationale: A preposição לְ marca aqueles a quem o povo procura se oferecer.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: como escravos e escravas
  rationale: Preserva de maneira clara e concisa o par hebraico masculino e feminino e a realidade de escravidão.
- source_word: וְאֵין קֹנֶה
  choice: mas não haverá quem os compre
  rationale: Expressa idiomaticamente o hebraico literal 'e não há comprador'; 'mas' explicita o contraste contextual sem alterar seu sentido.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. A transliteração 'Yahweh' o preserva, em vez de substituí-lo pelo título 'Senhor'.
- issue: Agência em וְהִתְמַכַּרְתֶּם
  choice: 'sentido reflexivo/médio: ''vocês se oferecerão'''
  alternative: 'sentido passivo ou mais geral: ''vocês serão vendidos'''
  rationale: A forma verbal permite mais de uma compreensão. O texto principal conserva a nuance reflexiva e a nota registra a leitura passiva, sem transformar uma possibilidade lexical em afirmação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' representa naturalmente o destinatário coletivo expresso no hebraico pelo singular. A redação preserva a dureza da imagem de escravidão e a ambiguidade do verbo hitpael por meio de nota.
