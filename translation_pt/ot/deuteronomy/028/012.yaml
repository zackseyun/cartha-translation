base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: pt
  text: Javé abrirá para você seu bom tesouro[a], os céus, para dar chuva à sua terra no tempo certo e para abençoar todo o trabalho de suas mãos. Você emprestará a muitas nações, mas não tomará emprestado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu bom depósito”. O termo hebraico pode indicar um depósito ou um tesouro; “tesouro” é mais natural em português, enquanto a referência aos céus mantém o contexto de chuva e colheita.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma portuguesa corrente o nome divino, preservando seu caráter pessoal e pactual.
- source_word: יִפְתַּח
  choice: abrirá
  rationale: O imperfeito qal tem valor futuro no contexto das bênçãos e mantém a metáfora concreta de abrir.
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: o seu bom depósito
  rationale: אוֹצָר pode designar depósito ou tesouro; “depósito” se ajusta melhor ao contexto de chuva e produção agrícola, enquanto “bom” preserva o adjetivo hebraico.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Mantém a forma plural e identifica, em aposição, o depósito de Javé.
- source_word: לָתֵת מְטַר אַרְצְךָ
  choice: para dar chuva à sua terra
  rationale: Expressa naturalmente em português a construção de finalidade e a relação entre a chuva e a terra, sem alterar o sentido.
- source_word: בְּעִתּוֹ
  choice: no tempo certo
  rationale: O sufixo provavelmente retoma a chuva; a expressão comunica de modo natural que ela virá na época apropriada.
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: todo o trabalho das suas mãos
  rationale: Preserva o idioma corporal ligado ao labor, usando o plural natural em português.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: Você emprestará a muitas nações
  rationale: O hifil de לוה significa emprestar, e גּוֹיִם designa nações neste contexto nacional e pactual.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: mas não tomará emprestado
  rationale: No qal, לוה significa tomar emprestado; “mas” explicita em português o contraste presente entre as duas orações.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Javé” é uma forma portuguesa amplamente reconhecível que preserva o nome pactual, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva a metáfora do depósito celestial e a oposição entre emprestar e tomar emprestado, evitando literalismos pouco naturais.
