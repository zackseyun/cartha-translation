  text: אִם לֹ֨א תִשְׁמֹ֜ר לַ/עֲשׂ֗וֹת אֶת כָּל דִּבְרֵי֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את הַ/כְּתוּבִ֖ים בַּ/סֵּ֣פֶר הַ/זֶּ֑ה לְ֠/יִרְאָה אֶת הַ/שֵּׁ֞ם הַ/נִּכְבָּ֤ד וְ/הַ/נּוֹרָא֙ הַ/זֶּ֔ה אֵ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: pt
  text: Se você não tiver o cuidado de cumprir todas as palavras desta lei, escritas neste livro[a], para temer este nome glorioso e temível — Yahweh, seu Deus[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “neste rolo”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: não tiver o cuidado de cumprir
  rationale: A construção שׁמר + infinitivo expressa atenção cuidadosa voltada à prática. A formulação portuguesa preserva tanto a vigilância quanto a obediência efetiva.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: todas as palavras desta lei
  rationale: Mantém o sentido literal de דִּבְרֵי, “palavras”, e traduz תּוֹרָה como “lei” por se tratar aqui do corpo legal da aliança em Deuteronômio.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: escritas neste livro
  rationale: Reproduz naturalmente em português o particípio passivo e a localização do texto escrito; “rolo” continua sendo uma alternativa histórica possível.
- source_word: לְיִרְאָה
  choice: temendo
  rationale: O gerúndio liga o cumprimento da lei ao propósito ou resultado de temer o nome divino, sem reduzir ירא apenas a reverência.
- source_word: הַשֵּׁם
  choice: nome
  rationale: Preserva a referência reverencial à identidade e reputação reveladas de Deus, sem substituí-la por uma paráfrase.
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: glorioso e temível
  rationale: “Glorioso” comunica honra e peso; “temível” conserva a dimensão de temor de נורא com linguagem digna e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Representa diretamente o sufixo masculino singular e mantém a linguagem da relação de aliança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Amplitude semântica de ירא
  choice: temendo
  alternative: reverenciando
  rationale: “Temer” mantém a tensão teológica entre reverência e medo, enquanto “reverenciar” poderia suavizar indevidamente o termo.
- issue: Relação sintática de לְיִרְאָה com a obediência precedente
  choice: temendo
  alternative: a fim de temer
  rationale: A forma escolhida conserva a ligação de propósito ou resultado sem decidir rigidamente entre essas duas nuances possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura permanece aberta porque o versículo introduz a condição cuja consequência vem no versículo seguinte. “Temível” preserva a força de temor e assombro sem recorrer a linguagem arcaica.
