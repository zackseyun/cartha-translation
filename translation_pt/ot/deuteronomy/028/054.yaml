base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: pt
  text: O homem sensível entre vocês, e muito delicado, voltará um olhar hostil[a] contra seu irmão, contra a esposa que ele abraça e contra os demais filhos que lhe restarem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu olho será mau para com”. O idioma hebraico pode expressar hostilidade, avareza ou recusa ressentida de repartir.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que ele deixar”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִישׁ
  choice: O homem
  rationale: O substantivo é singular e masculino e, em paralelo com a mulher mencionada no versículo seguinte, designa especificamente um homem.
- source_word: הָרַךְ בְּךָ
  choice: mais sensível entre vocês
  rationale: רַךְ comunica brandura, sensibilidade ou falta de resistência; a formulação comparativa exprime com naturalidade aquele que se destaca entre o povo por essa característica.
- source_word: וְהֶעָנֹג מְאֹד
  choice: e muito delicado
  rationale: Preserva a intensificação e a ideia de alguém habituado ao conforto, sem acrescentar a noção mais interpretativa de ter sido mimado.
- source_word: תֵּרַע עֵינוֹ
  choice: olhará com hostilidade
  rationale: O hebraico diz literalmente que o olho dele será mau; a tradução comunica o sentido contextual de hostilidade e recusa rancorosa, enquanto a nota conserva o idioma hebraico.
- source_word: בְאָחִיו
  choice: para seu irmão
  rationale: Mantém o sentido comum e direto de אָח, sem ampliar desnecessariamente para parentes em geral.
- source_word: אֵשֶׁת חֵיקוֹ
  choice: a esposa que ele acolhe nos braços
  rationale: Expressa em português atual a imagem íntima da mulher do seu regaço, evitando tanto o arcaísmo de 'regaço' quanto uma paráfrase puramente afetiva.
- source_word: יֶתֶר בָּנָיו
  choice: os demais filhos
  rationale: בָּנִים pode designar filhos de modo inclusivo; 'demais' comunica o restante deles com concisão.
- source_word: אֲשֶׁר יוֹתִיר
  choice: que lhe restarem
  rationale: O verbo indica deixar de sobra ou permanecer; no contexto, refere-se aos filhos que ainda lhe restam.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução evita o arcaísmo 'esposa do seu regaço', mas preserva sua imagem de intimidade por meio de 'acolhe nos braços'. O idioma do 'olho mau' é traduzido pelo sentido no texto principal e documentado em nota.
