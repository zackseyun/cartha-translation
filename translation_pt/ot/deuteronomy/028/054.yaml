    text: Literalmente, “seu olho será mau para com”. O idioma hebraico pode expressar hostilidade, avareza ou recusa ressentida de repartir.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que ele deixar”.'
    reason: alternative_reading
  revision_rationale: A revisão remove a comparação acrescentada em «mais sensível», conserva a intensidade de «muito delicado», torna mais natural a expressão do idiomatismo hebraico do «olho mau» e corrige a nota b para que ela reflita apenas a alternativa semântica segura de «deixar/restar», sem acrescentar «com vida».
