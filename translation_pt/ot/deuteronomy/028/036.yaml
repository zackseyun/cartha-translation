base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: pt
  text: Yahweh levará você e o rei que você estabelecer sobre si para uma nação que nem você nem seus pais conheceram; e ali você servirá a outros deuses[a], de madeira e pedra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adorará a outros deuses”; o verbo hebraico significa literalmente “servir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: levará
  rationale: O hifil de הלך tem sentido causativo, isto é, fazer alguém ir. “Levará” é natural em português e não explicita “exílio” além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: o rei que você estabelecer sobre si
  rationale: O hifil de קום, neste contexto, indica constituir ou instalar um governante; a formulação preserva também a construção com עַל.
- source_word: גּוֹי
  choice: uma nação
  rationale: גוי designa aqui uma nação ou grupo nacional estrangeiro; “nação” é a correspondência direta e contextual.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: que nem você nem seus pais conheceram
  rationale: Mantém a ênfase na nação desconhecida tanto pelo destinatário quanto por seus pais e conserva o termo masculino explícito do hebraico.
- source_word: וְעָבַדְתָּ שָׁם
  choice: e ali você servirá
  rationale: עבד, quando tem deuses por objeto, pode denotar serviço cultual; “servirá” preserva o sentido lexical e a possível nuance de adoração.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É a tradução direta da expressão pactual, sem interpretar como “deuses estrangeiros”.
- source_word: עֵץ וָאָבֶן
  choice: madeira e pedra
  rationale: Preserva a aposição hebraica abrupta, que identifica depreciativamente os deuses por seus materiais, sem acrescentar “feitos de”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por “SENHOR”.
- issue: Sentido cultual de עבד
  choice: servirá
  alternative: adorará
  rationale: “Servirá” conserva a amplitude lexical do verbo hebraico, embora neste contexto o serviço prestado a outros deuses implique culto.
- issue: Expressão וַאֲבֹתֶיךָ
  choice: seus pais
  alternative: seus antepassados
  rationale: “Pais” corresponde formalmente ao substantivo masculino hebraico e mantém a linguagem histórico-pactual, sem neutralizá-la.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento por “você”. A ordem e as imagens do hebraico foram preservadas sempre que naturais; a aposição final “madeira e pedra” permanece deliberadamente abrupta. Não se incluiu nota sobre “estabelecer”, pois a alternativa “nomear” não altera substancialmente o sentido e a redação principal já representa adequadamente o hebraico.
