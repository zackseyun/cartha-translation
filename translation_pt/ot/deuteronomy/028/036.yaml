    rationale: Embora reflita a aposição concisa do hebraico, o português normalmente exige a preposição para expressar que os deuses são caracterizados por seus materiais. “Outros deuses, de madeira e pedra” conserva a força depreciativa e a concisão, sem afirmar mais do que o texto.
