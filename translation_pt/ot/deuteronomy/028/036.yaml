  naturalness: O registro é moderno e claro, e o tratamento por “você” é consistente. “De madeira e pedra” preserva o valor caracterizador da aposição hebraica em português idiomático, sem introduzir conteúdo interpretativo relevante.
  terminology: “Yahweh”, “nação”, “outros deuses” e “servirá” são escolhas adequadas. “Seus pais” é uma formulação bíblica tradicional possível para אבותיך e pode ser mantida no contexto; a nota sobre “servirá” preserva apropriadamente a alternativa cultual “adorará”.
  issues:
