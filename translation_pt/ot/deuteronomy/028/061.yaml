base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: pt
  text: Também, Yahweh trará sobre você toda doença e toda aflição[a] que não estão escritas no livro desta lei, até que você seja destruído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praga”; o termo hebraico pode designar golpe, ferida, praga ou calamidade que atinge alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Também
  rationale: Mantém a força aditiva que introduz mais um elemento na lista de maldições.
- source_word: כָּל חֳלִי
  choice: toda doença
  rationale: חֳלִי designa doença ou enfermidade; “doença” é ampla, clara e natural em português atual.
- source_word: וְכָל מַכָּה
  choice: e toda aflição
  rationale: מַכָּה pode indicar golpe, ferida, praga ou calamidade. “Aflição” conserva aqui a amplitude do termo sem restringi-lo a epidemias.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: que não estiver escrita
  rationale: Reproduz a oração relativa e ajusta a concordância ao referente mais próximo, “aflição”, sem alterar o alcance distributivo de כָּל sobre ambos os substantivos.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: no livro desta lei
  rationale: Expressa naturalmente a relação construta hebraica e preserva a ideia do documento da aliança.
- source_word: יַעְלֵם
  choice: trará
  rationale: O hifil de עלה com sufixo pronominal significa fazer subir ou trazer; com עָלֶיךָ, o português idiomático é “trará sobre você”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עָלֶיךָ
  choice: sobre você
  rationale: Com “trará”, comunica de modo natural a imposição do juízo.
- source_word: עַד הִשָּׁמְדָךְ
  choice: até que você seja destruído
  rationale: O infinitivo construto com sufixo marca o ponto final do processo; esta formulação preserva sua severidade sem intensificá-la.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor
  rationale: O texto hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal e pactual em vez de o substituir por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe permanece próxima do hebraico, mas evita rigidez; o singular “você” preserva o destinatário coletivo tratado gramaticalmente no singular.
