  text: יַדְבֵּ֧ק יְהוָ֛ה בְּ/ךָ֖ אֶת הַ/דָּ֑בֶר עַ֚ד כַּלֹּת֣/וֹ אֹֽתְ/ךָ֔ מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: pt
  text: Yahweh fará com que a peste se apegue a você, até que ele tenha exterminado você da terra em que está entrando para tomar posse[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a epidemia”. O termo hebraico pode designar uma doença epidêmica mortal enviada como juízo.
    reason: lexical_alternative
  - marker: b
    text: Ou “até que ela tenha exterminado você”, entendendo “a peste” como o sujeito implícito da oração.
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: fará com que ... se apegue
  rationale: O hifil de דבק é causativo, “fazer apegar-se/aderir”. A formulação preserva tanto a força causativa quanto a imagem vívida de uma aflição persistente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּךָ
  choice: a você
  rationale: Com דבק, a preposição indica ligação estreita; “apegar-se a você” é natural em português.
- source_word: הַדָּבֶר
  choice: a peste
  rationale: דבר, neste contexto de maldições da aliança, denota peste ou epidemia mortal. “Peste” é corrente, grave e semanticamente precisa.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: até que ele tenha exterminado você
  rationale: כלה pode indicar levar ao fim, consumir ou destruir completamente. “Exterminado” comunica a totalidade; o sujeito implícito é entendido como Yahweh, sujeito da oração principal.
- source_word: מֵעַל הָאֲדָמָה
  choice: da terra
  rationale: Embora אֲדָמָה também possa significar solo, aqui o contexto da posse territorial favorece “terra”; מֵעַל expressa a remoção dela.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: em que está entrando
  rationale: בוא com שמה exprime idiomaticamente entrar ou ir para lá; a formulação mantém o sentido de entrada iminente.
- source_word: לְרִשְׁתָּהּ
  choice: para tomar posse
  rationale: ירש em Deuteronômio frequentemente significa tomar posse da terra. Esta formulação é natural e preserva a ação, sem reduzir o termo a mera ocupação.
theological_decisions:
- issue: Sentido de דֶּבֶר na maldição da aliança
  choice: a peste
  alternative: a epidemia; a pestilência
  rationale: “Peste” transmite uma doença epidêmica mortal no contexto do juízo, sem especificar além do hebraico.
- issue: Sujeito de כַּלֹּתוֹ
  choice: até que ele tenha exterminado você
  alternative: até que ela tenha exterminado você
  rationale: A leitura principal toma Yahweh, sujeito da oração precedente, como sujeito implícito. A sintaxe também permite entender “a peste” como agente, possibilidade preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a imagem concreta de a peste apegar-se à pessoa, o nome divino transliterado e a ambiguidade sintática relevante em nota.
