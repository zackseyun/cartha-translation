  text: יַכְּ/כָ֣ה יְ֠הוָה בַּ/שַּׁחֶ֨פֶת וּ/בַ/קַּדַּ֜חַת וּ/בַ/דַּלֶּ֗קֶת וּ/בַֽ/חַרְחֻר֙ וּ/בַ/חֶ֔רֶב וּ/בַ/שִּׁדָּפ֖וֹן וּ/בַ/יֵּרָק֑וֹן וּ/רְדָפ֖וּ/ךָ עַ֥ד אָבְדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: pt
  text: Yahweh ferirá você com doença debilitante[a], com febre, com inflamação, com calor abrasador, com a espada, com crestamento e com míldio; e esses males[b] perseguirão você até que pereça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “doença consumptiva”; o termo hebraico indica uma enfermidade que debilita e definha a pessoa.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico está no plural e retoma as aflições e calamidades enumeradas anteriormente.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: ferirá você
  rationale: O hifil de נכה significa “ferir, golpear”. A formulação mantém a força punitiva e a referência direta à segunda pessoa do singular em português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שַׁחֶפֶת
  choice: doença debilitante
  rationale: O termo indica uma enfermidade consumptiva que enfraquece progressivamente; evita tanto o arcaísmo “tísica” quanto a especificidade indevida de “tuberculose”.
- source_word: קַּדַּחַת
  choice: febre
  rationale: Equivalente moderno, claro e não excessivamente específico para uma enfermidade febril.
- source_word: דַּלֶּקֶת
  choice: inflamação
  rationale: Preserva a associação do substantivo com ardor e inflamação, distinguindo-o dos termos vizinhos.
- source_word: חַרְחֻר
  choice: calor abrasador
  rationale: O termo raro provavelmente descreve calor intenso ou ardente; esta tradução conserva a imagem sem impor um diagnóstico médico.
- source_word: חֶרֶב
  choice: espada
  rationale: Sentido lexical direto, que no contexto também pode representar guerra e morte violenta.
- source_word: שִׁדָּפוֹן
  choice: crestamento
  rationale: Designa dano destrutivo às plantações, associado a calor ou vento abrasador. “Crestamento” é um termo agrícola inteligível e o distingue do míldio.
- source_word: יֵרָקוֹן
  choice: míldio
  rationale: No contexto agrícola, indica uma doença ou amarelecimento da vegetação; “míldio” é a equivalência tradicional e contextual.
- source_word: וּרְדָפוּךָ
  choice: e esses males perseguirão você
  rationale: O verbo está no plural e retoma naturalmente as aflições e calamidades enumeradas; explicitar “esses males” torna o referente claro sem perder a personificação hebraica.
- source_word: עַד אָבְדֶךָ
  choice: até que pereça
  rationale: Expressa de modo conciso a ruína ou morte do destinatário, preservando a força da advertência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Agente da perseguição na oração final
  choice: esses males perseguirão você
  alternative: eles perseguirão você
  rationale: O plural hebraico remete às aflições e calamidades anteriores. A tradução mantém essa personificação e evita atribuir a perseguição exclusivamente a Yahweh ou a apenas uma calamidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a segunda pessoa sem ambiguidade por meio de “você”, conserva a sequência acumulativa das calamidades e explicita apenas o referente exigido pelo verbo plural. Todos os marcadores de nota aparecem no texto.
