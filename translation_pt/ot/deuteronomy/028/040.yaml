base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: pt
  text: Você terá oliveiras por todo o seu território, mas não se ungirá com azeite, porque as suas azeitonas cairão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as azeitonas da sua colheita cairão” ou “a sua oliveira perderá seus frutos”. O hebraico usa “a sua oliveira/azeitona” em sentido coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: oliveiras
  rationale: O contexto descreve árvores espalhadas pelo território, não apenas frutos já colhidos.
- source_word: יִהְיוּ לְךָ
  choice: você terá
  rationale: Expressa de modo natural em português a construção hebraica de posse.
- source_word: בְּכָל גְּבוּלֶךָ
  choice: por todo o seu território
  rationale: גְּבוּל pode indicar limite ou território; aqui se refere à extensão inteira da terra.
- source_word: וְשֶׁמֶן
  choice: azeite
  rationale: Embora o hebraico diga literalmente 'óleo', o contexto das oliveiras especifica naturalmente o azeite em português.
- source_word: לֹא תָסוּךְ
  choice: não se ungirá
  rationale: Preserva a ideia de aplicar azeite ao corpo, uma prática cotidiana antiga, sem acrescentar finalidade cerimonial.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a causa da privação.
- source_word: יִשַּׁל
  choice: cairão
  rationale: Comunica de forma direta a queda dos frutos, provavelmente antes que possam ser aproveitados.
- source_word: זֵיתֶךָ
  choice: as suas azeitonas
  rationale: O singular hebraico é coletivo e, com o verbo de cair, pode referir-se naturalmente aos frutos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Azeite” foi preferido a “óleo” por ser a designação comum do óleo de oliva neste contexto. A ambiguidade coletiva de זֵיתֶךָ foi preservada em nota.
