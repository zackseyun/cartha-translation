  text: The cricket shall take possession of all your trees and the fruit of your ground[a].
translation:
  language: pt
  text: O inseto zumbidor tomará posse de todas as suas árvores e de todos os frutos do seu solo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grilo”, “gafanhoto” ou, mais genericamente, “inseto zumbidor”; não se sabe ao certo qual inseto o termo hebraico צְלָצַל designa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: todas
  rationale: O quantificador abrange a totalidade das árvores e, por extensão coordenada, dos frutos mencionados.
- source_word: עֵצְךָ
  choice: suas árvores
  rationale: עֵץ designa naturalmente árvores neste contexto agrícola; o plural coletivo é idiomático em português.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: e dos frutos do seu solo
  rationale: Mantém a imagem concreta de פְּרִי, 'fruto', e אַדָמָה, 'solo/terra'. A contração 'dos' coordena naturalmente ambos os objetos de 'tomará posse'.
- source_word: יְיָרֵשׁ
  choice: tomará posse de
  rationale: Preserva o sentido marcante de ירשׁ, tomar posse ou desapossar, sem reduzi-lo interpretativamente a 'comer' ou 'destruir'.
- source_word: הַצְּלָצַל
  choice: o inseto zumbidor
  rationale: A identificação zoológica exata é incerta. A expressão reproduz a provável associação sonora do termo e evita escolher sem segurança entre grilo, gafanhoto e outros insetos.
