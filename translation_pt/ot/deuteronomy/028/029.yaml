base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: pt
  text: Você tateará ao meio-dia, como o cego tateia na escuridão[a], e não terá êxito em seus caminhos[b]. Será apenas oprimido e roubado todos os dias, sem que haja quem o salve[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apalpará”; o verbo hebraico indica buscar pelo tato porque não se pode ver.
    reason: lexical_alternative
  - marker: b
    text: Ou “não prosperará em seus caminhos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “quem o livre” ou “um libertador”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: tateará / tateia
  rationale: O verbo descreve procurar ou avançar pelo tato por não poder ver. “Tatear” preserva tanto a ação física quanto a desorientação figurada.
- source_word: בַּצָּהֳרַיִם
  choice: ao meio-dia
  rationale: Designa a parte mais clara do dia e mantém o contraste irônico com a escuridão.
- source_word: הָעִוֵּר
  choice: o cego
  rationale: O adjetivo hebraico masculino singular é usado como substantivo. A tradução mantém sua forma representativa sem acrescentar elementos ausentes do texto.
- source_word: בָּאֲפֵלָה
  choice: na escuridão
  rationale: Expressão clara e natural que preserva o contraste com “ao meio-dia”.
- source_word: תַצְלִיחַ
  choice: não terá êxito
  rationale: No Hifil, o verbo pode significar prosperar ou ter sucesso. “Ter êxito” comunica o fracasso dos empreendimentos sem restringir a ideia à prosperidade material.
- source_word: אֶת דְּרָכֶיךָ
  choice: em seus caminhos
  rationale: Mantém a imagem hebraica dos caminhos como o curso da vida e as iniciativas da pessoa.
- source_word: אַךְ
  choice: apenas
  rationale: A partícula tem força restritiva e enfatiza que opressão e roubo caracterizarão continuamente a condição descrita.
- source_word: עָשׁוּק
  choice: oprimido
  rationale: O particípio passivo indica sofrer opressão, extorsão ou injustiça; “oprimido” conserva a amplitude do termo.
- source_word: גָזוּל
  choice: roubado
  rationale: O particípio passivo descreve alguém privado de seus bens por roubo ou tomada violenta. “Roubado” é direto e atual.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Reproduz a duração contínua expressa literalmente por “todos os dias”, sem acrescentar o possessivo ausente no hebraico.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: sem que haja quem o salve
  rationale: Expressa naturalmente a inexistência de alguém capaz de prestar socorro, preservando o sentido pessoal do particípio.
theological_decisions:
- issue: Sentido de מוֹשִׁיעַ no contexto das maldições da aliança
  choice: quem o salve
  alternative: quem o livre / quem o socorra
  rationale: A raiz יָשַׁע aqui indica salvamento ou livramento em sentido amplo. “Salve” mantém esse campo sem transformar o particípio em título messiânico nem importar uma afirmação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para o singular hebraico e mantém a imagem concreta dos caminhos, o contraste entre meio-dia e escuridão e a sequência enfática de opressão, roubo e ausência de socorro.
