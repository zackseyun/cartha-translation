  text: הַ/גֵּר֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/ךָ֔ יַעֲלֶ֥ה עָלֶ֖י/ךָ מַ֣עְלָ/ה מָּ֑עְלָ/ה וְ/אַתָּ֥ה תֵרֵ֖ד מַ֥טָּה מָּֽטָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: pt
  text: O estrangeiro que vive no meio de vocês subirá cada vez mais acima de vocês[a], enquanto vocês descerão cada vez mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o imigrante residente”. O termo hebraico גֵּר refere-se a uma pessoa não nativa que vive no meio de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: o estrangeiro
  rationale: גֵּר designa aqui uma pessoa não israelita que reside no meio de Israel. “Estrangeiro” é claro e natural em português; a nota registra opções que explicitam melhor sua condição de residente.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: que vive no meio de vocês
  rationale: A expressão situa o estrangeiro dentro da comunidade. O verbo “vive”, implícito em português, esclarece que se trata de presença residente, não meramente passageira.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: subirá ... acima de vocês
  rationale: Mantém a metáfora hebraica de ascensão comparativa e sua amplitude social, econômica ou política, sem restringi-la a uma única esfera.
- source_word: מַעְלָה מָּעְלָה
  choice: cada vez mais acima
  rationale: Reproduz de modo idiomático a progressão intensificada pela repetição do advérbio hebraico.
- source_word: וְאַתָּה
  choice: enquanto vocês
  rationale: O waw introduz um contraste contextual entre a ascensão do estrangeiro e a descida de Israel. “Enquanto” expressa essa contraposição simultânea com naturalidade.
- source_word: תֵרֵד
  choice: descerão
  rationale: Preserva o antônimo direto de “subirá” e a metáfora abrangente de declínio.
- source_word: מַטָּה מָּטָּה
  choice: cada vez mais
  rationale: Em combinação com “descerão”, comunica a descida progressiva indicada pela repetição hebraica sem a construção pouco natural “mais e mais para baixo”.
theological_decisions:
- issue: Inversão de condição social no contexto das maldições da aliança
  choice: Manter a imagem ampla na qual o residente não israelita sobe acima de Israel, enquanto Israel desce.
  alternative: Limitar a imagem exclusivamente à prosperidade econômica ou ao domínio político.
  rationale: Os verbos hebraicos descrevem uma inversão progressiva de condição, mas não especificam uma única esfera. A tradução conserva essa amplitude e a tensão da maldição da aliança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” torna explícito que o singular hebraico se dirige coletivamente a Israel. A estrutura paralela preserva o contraste entre subir e descer.
