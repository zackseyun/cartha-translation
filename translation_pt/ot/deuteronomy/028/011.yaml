base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: pt
  text: 'Yahweh lhe concederá abundância para o seu bem[a]: no fruto do seu ventre[b], no fruto dos seus animais e no fruto do seu solo[c], na terra que Yahweh jurou a seus antepassados que daria a você.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fará você prosperar”, “lhe dará abundância para o seu bem” ou “para o seu bem-estar”.
    reason: lexical_alternative
  - marker: b
    text: Expressão hebraica que se refere aos filhos ou descendentes.
    reason: lexical_alternative
  - marker: c
    text: Ou “na produção da sua terra” ou “na colheita do seu solo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ לְטוֹבָה
  choice: fará você ter abundância para o seu bem
  rationale: O hifil de יתר tem força causativa e comunica abundância ou excedente; לְטוֹבָה acrescenta a ideia de benefício. A formulação preserva ambos os elementos sem reduzir a expressão apenas a prosperidade financeira.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בִּפְרִי בִטְנְךָ
  choice: no fruto do seu ventre
  rationale: Mantém a imagem hebraica e a repetição deliberada de פְרִי, ao mesmo tempo que permanece compreensível como referência aos descendentes.
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: no fruto dos seus rebanhos
  rationale: בְּהֵמָה designa coletivamente os animais domésticos; 'rebanhos' é natural no contexto agropecuário e conserva a estrutura repetida 'fruto de'.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: no fruto do seu solo
  rationale: אֲדָמָה aponta aqui para o solo cultivado. A tradução conserva a imagem agrícola e a repetição do hebraico.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: Neste ponto, אֲדָמָה se refere à terra prometida como o lugar em que a bênção se concretizará; 'na terra' é idiomático em português.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: que Yahweh jurou aos seus antepassados dar a você
  rationale: Preserva de modo conciso a relação entre o juramento feito aos antepassados e a terra dada ao destinatário presente.
theological_decisions:
- issue: Forma portuguesa do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Interpretação de 'fruto do ventre'
  choice: Manter a expressão figurada
  alternative: filhos; descendentes
  rationale: A expressão é inteligível em português e conserva o paralelismo entre fecundidade humana, animal e agrícola.
- issue: Sentido de לְטוֹבָה junto ao causativo de יתר
  choice: abundância para o seu bem
  alternative: prosperidade; grande abundância
  rationale: A escolha mantém separadas a ideia de abundância causada por Yahweh e sua finalidade ou efeito benéfico, sem restringir o bem-estar a riqueza material.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento no singular por “você”. A repetição de “fruto” reproduz o paralelismo do hebraico. “Antepassados” evita a possível leitura exclusivamente masculina de “pais” sem alterar a referência aos ancestrais de Israel.
