id: DEU.28.49
reference: Deuteronomy 28:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: pt
  text: Yahweh trará contra você uma nação de longe, dos confins da terra[a], como a águia que se lança velozmente[b] — uma nação cuja língua você não entenderá.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos confins da terra habitada” ou “da extremidade do território”. O hebraico אֶרֶץ pode significar “terra”, “país” ou “território”; aqui a expressão enfatiza uma origem muito distante.
    reason: lexical_alternative
  - marker: b
    text: Ou “como a águia voa” ou “como a águia arremete”. O verbo hebraico destaca um movimento rápido. O termo traduzido por “águia” também pode designar uma grande ave de rapina, inclusive um abutre.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “cuja língua você não ouvirá”; o sentido é que você não compreenderá o idioma dessa nação.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא ... עָלֶיךָ
  choice: trará contra você
  rationale: Embora נשׂא tenha o sentido básico de “levantar/carregar”, nesta construção indica fazer vir uma nação contra alguém. “Trará contra você” expressa de modo natural a ação direta de Yahweh e a força hostil da expressão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: גּוֹי
  choice: nação
  rationale: No contexto da maldição da aliança, designa uma potência estrangeira invasora, não apenas um grupo étnico.
- source_word: מֵרָחוֹק
  choice: de longe
  rationale: Forma corrente e concisa que preserva a ideia de grande distância.
- source_word: מִקְצֵה הָאָרֶץ
  choice: dos confins da terra
  rationale: Reproduz a imagem hebraica de uma origem extremamente distante. “Confins” é idiomático em português e mantém a linguagem espacial do texto.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: como a águia que se lança velozmente
  rationale: O verbo דאה retrata movimento aéreo rápido, como voar, arremeter ou lançar-se. A formulação conserva a velocidade e a ameaça da comparação sem acrescentar explicitamente uma presa ausente do hebraico.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: cuja língua você não entenderá
  rationale: Literalmente, a expressão fala em não “ouvir” a língua, mas שמע nesse contexto comunica não compreender a fala. “Língua” preserva o substantivo hebraico e é natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome da aliança. “Yahweh” preserva-o como nome próprio, sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O singular “você” reflete o pronome hebraico singular dirigido coletivamente a Israel. O travessão mantém a aposição enfática da última oração.
