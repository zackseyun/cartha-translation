base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: pt
  text: Então todos os povos da terra verão que o nome de Yahweh é invocado sobre você[a] e temerão você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que você é chamado pelo nome de Yahweh”. Literalmente, o hebraico diz que o nome de Yahweh “é invocado sobre” você, expressão que indica identificação e pertencimento à aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: Então ... verão
  rationale: O perfeito com conjunção, na sequência de bênçãos, expressa uma consequência futura; “então” comunica naturalmente esse fluxo.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: todos os povos da terra
  rationale: “Povos” mantém o plural de עַמִּים, e “terra” corresponde ao alcance internacional do contexto.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo daquilo que os povos verão.
- source_word: שֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: Preserva a construção hebraica e translitera o nome divino יְהוָה como Yahweh.
- source_word: נִקְרָא עָלֶיךָ
  choice: é invocado sobre você
  rationale: Mantém a voz passiva e a imagem de algo pronunciado sobre alguém; o idioma indica identificação pública e pertencimento, sem explicitar apenas uma interpretação.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: e terão medo de você
  rationale: Comunica o temor provocado pela identificação de Israel com Yahweh, preservando a força ampla de ירא e o objeto marcado por מִן.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido da expressão נִקְרָא עָלֶיךָ
  choice: o nome de Yahweh é invocado sobre você
  alternative: você é chamado pelo nome de Yahweh; o nome de Yahweh é proclamado sobre você
  rationale: A formulação conserva a imagem e a ambiguidade genuína do hebraico, ao mesmo tempo que a nota explica sua ideia de identificação e pertencimento.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O singular “você” reflete o destinatário coletivo singular do hebraico. A expressão incomum “invocado sobre você” foi mantida para preservar a imagem original, com esclarecimento em nota.
