  naturalness: O português é geralmente claro e moderno. “Por causa do pavor em seu coração, que você sentirá” é natural, conserva o caráter interior da expressão hebraica e evita a expansão interpretativa de “tomará conta”.
  terminology: “Pavor” comunica adequadamente a intensidade de פַּחַד; “espetáculo” comunica de modo idiomático o מַרְאֵה aterrador que os olhos verão. “Quem dera fosse” preserva a fórmula optativa sem introduzir o intensificador não expresso “já”.
