  text: בַּ/בֹּ֤קֶר תֹּאמַר֙ מִֽי יִתֵּ֣ן עֶ֔רֶב וּ/בָ/עֶ֥רֶב תֹּאמַ֖ר מִֽי יִתֵּ֣ן בֹּ֑קֶר מִ/פַּ֤חַד לְבָֽבְ/ךָ֙ אֲשֶׁ֣ר תִּפְחָ֔ד וּ/מִ/מַּרְאֵ֥ה עֵינֶ֖י/ךָ אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: pt
  text: 'Pela manhã você dirá[a]: “Quem dera fosse noite!” e, à noite, dirá: “Quem dera fosse manhã!”, por causa do pavor em seu coração, que você sentirá[b], e por causa do espetáculo que os seus olhos verão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “Quem dará noite/manhã?” Trata-se de uma expressão de forte desejo, daí “Quem dera fosse noite/manhã!”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “por causa do pavor do seu coração, que você temerá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Pela manhã
  rationale: Expressão temporal definida, natural em português e paralela a “à noite”.
- source_word: תֹּאמַר
  choice: você dirá
  rationale: O imperfeito qal de segunda pessoa masculina singular, no contexto das maldições, expressa uma consequência futura, não uma ordem.
- source_word: מִי יִתֵּן
  choice: Quem dera já fosse
  rationale: A fórmula hebraica literalmente pergunta “Quem dará...?”, mas funciona idiomaticamente como expressão de desejo intenso. “Quem dera” preserva esse valor; “já” torna natural a ansiedade pela chegada do outro período do dia.
- source_word: עֶרֶב / בֹּקֶר
  choice: noite / manhã
  rationale: Os substantivos temporais formam um paralelismo antitético. Neste contexto, עֶרֶב é naturalmente expresso como “noite” em português corrente.
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: por causa do pavor que tomará conta do seu coração
  rationale: מִן tem sentido causal. A formulação comunica o intenso medo interior e evita em português a repetição pouco natural “o pavor que você temerá”, sem eliminar o vínculo entre pavor e coração.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: e por causa do que os seus olhos verão
  rationale: מַרְאֶה designa aqui aquilo que é visto, uma visão ou espetáculo aterrador. A redação conserva a imagem concreta dos olhos vendo e soa natural em português.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” mantém a segunda pessoa singular do hebraico de modo natural. A tradução privilegia equivalência ótima: conserva o paralelismo manhã/noite, a intensidade de פַּחַד e a imagem dos olhos, enquanto esclarece em nota a forma literal do desejo hebraico e uma alternativa mais formal para a oração sobre o coração.'
