  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: pt
  text: Yahweh enviará sobre você a maldição, a confusão e a repreensão em tudo o que você empreender[a], até que você seja destruído e até que pereça rapidamente, por causa da maldade dos seus atos, pelos quais você me abandonou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «em todo estender da sua mão», isto é, em tudo o que você se dispuser a fazer.'
    reason: Explica o idioma hebraico subjacente a «empreender» e preserva sua imagem da mão.
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: enviará
  rationale: O piel imperfeito de שׁלח apresenta Yahweh como agente direto das sanções da aliança; “enviará” é natural e mantém essa agência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּךָ
  choice: sobre você
  rationale: Com o verbo “enviar”, a preposição indica o alvo sobre o qual recaem as sanções.
- source_word: הַמְּאֵרָה
  choice: a maldição
  rationale: Designa aqui a maldição da aliança como sanção concreta.
- source_word: הַמְּהוּמָה
  choice: a confusão
  rationale: O substantivo pode indicar confusão, tumulto ou pânico; “confusão” conserva sua amplitude no contexto da desorganização das atividades.
- source_word: הַמִּגְעֶרֶת
  choice: a repreensão
  rationale: Mantém o sentido de censura forte, especialmente divina, ligado à raiz גער.
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: em tudo o que você puser a mão para fazer
  rationale: Expressa naturalmente em português o idioma hebraico acerca de tudo aquilo que alguém empreende, preservando a imagem da mão.
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: até que você seja destruído e pereça rapidamente
  rationale: Preserva os dois verbos paralelos, distinguindo destruição de perecimento, e mantém a rapidez indicada por מַהֵר.
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ
  choice: por causa da maldade dos seus atos
  rationale: מִפְּנֵי tem valor causal, e מַעֲלָלִים se refere aos atos ou práticas do destinatário.
- source_word: אֲשֶׁר עֲזַבְתָּנִי
  choice: pelos quais você me abandonou
  rationale: Conserva a formulação relacional do hebraico e liga os atos maus ao abandono de Yahweh sem explicitar além do texto.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Agência do juízo da aliança
  choice: “Yahweh enviará” preserva a agência divina direta
  alternative: Formulação impessoal, como “a maldição virá”
  rationale: Yahweh é explicitamente o sujeito do verbo hebraico; a tradução não suaviza nem obscurece essa agência.
- issue: Relação entre os atos maus e o abandono de Yahweh
  choice: “atos, pelos quais você me abandonou”
  alternative: “atos, porque você me abandonou”
  rationale: A construção relativa hebraica permite associar os atos ao abandono; a tradução mantém essa relação sem decidir se a frase deve ser entendida apenas como causa separada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” corresponde ao destinatário masculino singular do hebraico. A imagem idiomática da mão foi mantida no corpo do texto e esclarecida em nota.
