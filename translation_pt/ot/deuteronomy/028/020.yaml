revisions:
- from: Yahweh enviará sobre você a maldição, a confusão e a repreensão em tudo o que você puser a mão para fazer[a], até que você seja destruído e pereça rapidamente, por causa da maldade dos seus atos, pelos quais você me abandonou.
  to: Yahweh enviará sobre você a maldição, a confusão e a repreensão em tudo o que você empreender[a], até que você seja destruído e até que pereça rapidamente, por causa da maldade dos seus atos, pelos quais você me abandonou.
  rationale: A revisão torna a expressão de empreendimento mais idiomática em português contemporâneo, mantendo seu sentido por meio da nota, e reproduz a dupla cláusula temporal do hebraico. Não altera a agência divina, o teor do juízo nem a relação entre os atos maus e o abandono de Yahweh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:07:17Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a agência direta de Yahweh, a sequência das três sanções, o alcance de «em todo empreendimento», o duplo desfecho de destruição e perecimento e a razão causal ligada aos maus atos e ao abandono de Yahweh. A repetição de עַד («até») é, porém, melhor preservada explicitamente.
  naturalness: «Em tudo o que você puser a mão para fazer» é compreensível, mas soa menos natural em português moderno do que «em tudo o que você empreender». A nota pode preservar a imagem hebraica da mão. A repetição de «até que» também torna o período mais claro e equilibrado.
  terminology: «Yahweh», «maldição», «confusão» e «repreensão» são escolhas defensáveis e adequadas ao registro. «Repreensão» mantém o valor de censura/rebuke sem estreitar indevidamente o termo hebraico.
  issues:
  - severity: low
    issue: Formulação idiomática de מִשְׁלַח יָד
    rationale: «Puser a mão para fazer» é uma reprodução algo pesada do idioma hebraico. «Empreender» comunica de forma natural o sentido de tudo aquilo a que a pessoa se dedica; a imagem literal pode ficar na nota.
  - severity: low
    issue: Repetição de עַד
    rationale: O hebraico traz «até ... e até ...». Repetir «até que» em português preserva melhor o paralelismo e separa claramente os dois resultados.
  revised_text: Yahweh enviará sobre você a maldição, a confusão e a repreensão em tudo o que você empreender[a], até que você seja destruído e até que pereça rapidamente, por causa da maldade dos seus atos, pelos quais você me abandonou.
  revised_footnotes:
