    reason: Explica o idioma hebraico subjacente a «empreender» e preserva sua imagem da mão.
  revision_rationale: A revisão torna a expressão de empreendimento mais idiomática em português contemporâneo, mantendo seu sentido por meio da nota, e reproduz a dupla cláusula temporal do hebraico. Não altera a agência divina, o teor do juízo nem a relação entre os atos maus e o abandono de Yahweh.
