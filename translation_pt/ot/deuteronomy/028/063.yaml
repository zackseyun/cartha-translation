  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: pt
  text: E acontecerá que, assim como Yahweh se alegrou em fazer-lhes o bem e multiplicá-los, assim Yahweh se alegrará em destruí-los e exterminá-los; e vocês serão arrancados da terra[a] em que você está entrando para tomar posse dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão desarraigados da terra”.'
    reason: lexical_alternative
  - marker: b
    text: Neste trecho final, o hebraico passa para “você” no singular, dirigindo-se a Israel como um só povo.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Introduz a consequência futura de modo natural em português, preservando a função da fórmula hebraica.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: assim como ... assim
  rationale: Mantém de forma clara o paralelismo entre a bênção anterior e o juízo futuro.
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: se alegrou / se alegrará
  rationale: Repete a mesma raiz portuguesa nas duas ocorrências e conserva a força inquietante do paralelo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino conforme a prática do projeto.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: em fazer-lhes o bem
  rationale: Expressa o sentido amplo do hifil de יטב sem limitá-lo à prosperidade material.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: e multiplicá-los
  rationale: Preserva a linguagem pactual tradicional de aumento numérico.
- source_word: לְהַאֲבִיד אֶתְכֶם
  choice: em destruí-los
  rationale: Representa com força e clareza o causativo de אבד no contexto das maldições da aliança.
- source_word: וּלְהַשְׁמִיד אֶתְכֶם
  choice: e exterminá-los
  rationale: Distingue o segundo verbo de destruição do primeiro e preserva sua intensidade.
- source_word: וְנִסַּחְתֶּם
  choice: e vocês serão arrancados
  rationale: Comunica remoção violenta e admite a imagem de desarraigamento sem torná-la obrigatoriamente botânica.
- source_word: מֵעַל הָאֲדָמָה
  choice: da terra
  rationale: É a formulação portuguesa natural para a remoção de sobre a terra, sem reproduzir de modo artificial a preposição composta hebraica.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: em que você está entrando para tomar posse dela
  rationale: Preserva a mudança para a segunda pessoa singular, trata Israel como um só povo e traduz explicitamente o sufixo pronominal final.
theological_decisions:
- issue: A alegria divina no juízo
  choice: Yahweh se alegrará em destruí-los e exterminá-los
  alternative: Yahweh terá prazer em destruí-los e exterminá-los
  rationale: A redação mantém o paralelo explícito entre a alegria de Yahweh ao abençoar e sua alegria ao julgar, sem atenuar nem explicar a tensão teológica.
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Segue a convenção do projeto de apresentar o nome pactual por transliteração.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. A alternância deliberada entre “vocês” e “você” reproduz a mudança do plural para o singular no hebraico; a nota esclarece essa aparente irregularidade.
