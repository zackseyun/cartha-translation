base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/028.yaml
  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: pt
  text: Javé atingirá você com loucura, cegueira e confusão do coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perplexidade do coração” ou “consternação do coração”.
    reason: Alternativas lexicais para תִמְהוֹן לֵבָב, cuja nuance pode abranger confusão, perplexidade e consternação.
lexical_decisions:
- source_word: יַכְּכָה
  choice: atingirá você
  rationale: O hifil de נכה expressa golpear ou ferir, inclusive mediante praga ou juízo. “Atingirá você” é natural em português moderno e conserva a força da linguagem de maldição da aliança.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera em forma consagrada e legível em português o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּשִׁגָּעוֹן
  choice: com loucura
  rationale: שִׁגָּעוֹן denota loucura ou perturbação mental; “loucura” é a correspondência direta e idiomática neste contexto.
- source_word: וּבְעִוָּרוֹן
  choice: cegueira
  rationale: עִוָּרוֹן denota literalmente cegueira. A tradução evita acrescentar “mental”, pois o hebraico não explicita essa qualificação.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: e confusão do coração
  rationale: תִמְהוֹן pode indicar confusão, perplexidade ou consternação, enquanto לֵבָב abrange coração, mente e interioridade. A formulação preserva a imagem hebraica e sua ambiguidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Javé
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama. “Javé” preserva o nome pessoal da aliança em forma amplamente reconhecida no português contemporâneo, sem substituí-lo por “SENHOR”.
- issue: Sentido de לֵבָב na expressão תִמְהוֹן לֵבָב
  choice: coração
  alternative: mente
  rationale: “Coração” conserva a antropologia e a imagem do hebraico, sem restringir o termo apenas à faculdade intelectual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação foi levemente ajustada à fluidez portuguesa sem alterar a sequência dos três males.
