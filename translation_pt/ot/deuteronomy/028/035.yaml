source:
  edition: WLC
  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֣ין רָ֗ע עַל הַ/בִּרְכַּ֨יִם֙ וְ/עַל הַ/שֹּׁקַ֔יִם אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵ֑א מִ/כַּ֥ף רַגְלְ/ךָ֖ וְ/עַ֥ד קָדְקֳדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: pt
  text: Yahweh ferirá você com úlceras graves nos joelhos e nas pernas[a], das quais você não poderá ser curado, desde a planta do pé até o alto da cabeça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “canelas”; o termo hebraico se refere mais especificamente à parte inferior das pernas.
    reason: Alternativa lexical que preserva a precisão anatômica de שׁוֹק.
lexical_decisions:
- source_word: יַכְּכָה
  choice: ferirá você
  rationale: O hifil de נכה expressa ação direta de golpear ou afligir. “Ferirá você” conserva essa força e soa natural no português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: בִּשְׁחִין רָע
  choice: com úlceras graves
  rationale: שְׁחִין designa uma erupção inflamada, úlcera ou furúnculo; embora esteja no singular, pode ter sentido coletivo. רָע caracteriza a afecção como grave ou maligna.
- source_word: עַל הַבִּרְכַּיִם
  choice: nos joelhos
  rationale: Equivalente anatômico direto e corrente.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: e nas pernas
  rationale: שׁוֹק se refere mais especificamente à parte inferior da perna. “Pernas” é natural e abrangente; a precisão anatômica alternativa é preservada em nota.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: das quais você não poderá ser curado
  rationale: A construção passiva preserva o foco do hebraico na impossibilidade de cura.
- source_word: מִכַּף רַגְלְךָ
  choice: desde a planta do pé
  rationale: כַּף, em referência ao pé, designa idiomaticamente a planta.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: até o alto da cabeça
  rationale: קָדְקֹד indica o topo ou ponto mais alto da cabeça; a expressão conserva a abrangência corporal total do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” preserva o nome pessoal no texto, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “você” mantém a interpelação singular do hebraico; “úlceras” explicita naturalmente o sentido coletivo do substantivo singular.
