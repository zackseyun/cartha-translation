base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: pt
  text: Você ficará comprometido em casamento com uma mulher[a], mas outro homem se deitará com ela[b]; construirá uma casa, mas não morará nela; plantará uma vinha, mas não começará a consumir seus frutos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “ficará noivo de uma mulher”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico é um termo sexual grosseiro. Algumas traduções o vertem de forma mais forte, como “a violentará”, mas essa forma verbal, por si só, não explicita o uso de força.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “não a tornará comum”. É uma expressão para começar a consumir normalmente os frutos de uma vinha.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ אִשָּׁה
  choice: ficará noivo de uma mulher
  rationale: O verbo ארשׂ indica o compromisso formal de casamento, e אִשָּׁה designa aqui a mulher destinada a ser esposa. A formulação é atual e preserva a etapa anterior à vida conjugal, sem reduzi-la ao sentido mais amplo de “casar-se”.
- source_word: אִישׁ אַחֵר
  choice: outro homem
  rationale: Tradução direta e natural, que mantém o contraste entre o destinatário e o terceiro homem.
- source_word: ישגלנה
  choice: terá relações sexuais com ela
  rationale: O verbo שׁגל é um termo sexual direto e grosseiro. A tradução explicita o ato sexual sem acrescentar à forma verbal, por si só, uma afirmação inequívoca sobre uso de força.
- source_word: תֵשֵׁב בּוֹ
  choice: morará nela
  rationale: No contexto de uma casa, ישב significa residir ou morar. “Morar” é corrente e preciso em português.
- source_word: כֶּרֶם
  choice: uma vinha
  rationale: “Vinha” é a designação portuguesa comum para uma plantação de videiras e corresponde diretamente a כֶּרֶם.
- source_word: תְחַלְּלֶנּוּ
  choice: não começará a consumir seus frutos
  rationale: O piel de חלל aplicado a uma vinha indica torná-la disponível para uso comum, isto é, iniciar o consumo normal de sua produção. A formulação comunica o sentido idiomático e técnico em vez de reproduzir literalmente “profanar”.
