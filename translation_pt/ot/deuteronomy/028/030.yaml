translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento na segunda pessoa foi expresso por “você”, coerente com o singular do hebraico. A sintaxe paralela conserva a sucessão das três perdas anunciadas no versículo; as notas preservam tanto a crueza lexical do verbo sexual quanto o caráter idiomático do verbo aplicado à vinha.
