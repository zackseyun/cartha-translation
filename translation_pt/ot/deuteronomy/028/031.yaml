  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: pt
  text: O seu boi será abatido diante dos seus olhos, mas você não comerá nada dele; o seu jumento será tomado à força diante de você[a] e não lhe será devolvido; o seu rebanho será entregue aos seus inimigos, e não haverá quem o salve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será roubado diante de você”; o hebraico indica apropriação violenta ou roubo.
    reason: lexical_alternative
  - marker: b
    text: Ou “você não terá quem o livre” ou “não haverá libertador para você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: o seu boi
  rationale: שׁוֹר designa um bovino, muitas vezes usado no trabalho; “boi” é a equivalência singular mais natural neste contexto de perda de animais domésticos.
- source_word: טָבוּחַ
  choice: será abatido
  rationale: O particípio passivo de טבח indica o abate de um animal, especialmente para consumo, e recebe valor futuro na sequência de maldições.
- source_word: לְעֵינֶיךָ
  choice: diante dos seus olhos
  rationale: Preserva a expressão vívida de que o fato ocorrerá abertamente na presença do proprietário.
- source_word: מִמֶּנּוּ
  choice: nada dele
  rationale: Depois de “comer”, esta formulação portuguesa expressa naturalmente que o proprietário não usufruirá porção alguma do animal abatido.
- source_word: חֲמֹרְךָ
  choice: o seu jumento
  rationale: “Jumento” é uma designação corrente e clara do animal em português.
- source_word: גָּזוּל
  choice: será tomado à força
  rationale: O particípio de גזל comunica apropriação violenta ou roubo; “tomado à força” preserva essa intensidade sem limitar o sentido a furto clandestino.
- source_word: מִלְּפָנֶיךָ
  choice: diante de você
  rationale: Representa literalmente a retirada da presença ou de diante da face do proprietário, reforçando sua impotência ao presenciar o ato.
- source_word: יָשׁוּב לָךְ
  choice: não lhe será devolvido
  rationale: Embora o hebraico diga literalmente “não voltará para você”, a forma passiva é idiomática em português no contexto de um animal tomado e não restituído.
- source_word: צֹאנְךָ
  choice: o seu rebanho
  rationale: צֹאן pode abranger ovelhas e cabras; “rebanho” mantém essa abrangência sem especificar apenas ovelhas.
- source_word: נְתֻנוֹת
  choice: será entregue
  rationale: O particípio passivo de נתן indica que o rebanho será dado ou entregue aos inimigos; “entregue” transmite naturalmente a transferência hostil.
- source_word: לְאֹיְבֶיךָ
  choice: aos seus inimigos
  rationale: Equivalente direto e corrente de אֹיֵב no contexto das maldições da aliança.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: não haverá quem o salve
  rationale: מוֹשִׁיעַ é “alguém que salva ou livra”; a formulação preserva o léxico de salvação e é natural, sem implicar necessariamente salvação eterna.
theological_decisions:
- issue: Emprego de linguagem de salvação na cláusula final
  choice: não haverá quem o salve
  alternative: você não terá quem o livre
  rationale: A raiz ישׁע designa salvar ou livrar. Aqui se refere ao socorro histórico diante da perda causada pelos inimigos, mas não convém enfraquecer o termo nem resolver sua ressonância teológica por meio de paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O tratamento por “você” evita formas regionais ou arcaizantes; os pronomes oblíquos mantêm concisão e dignidade. As notas preservam alternativas lexicais reais do hebraico.
