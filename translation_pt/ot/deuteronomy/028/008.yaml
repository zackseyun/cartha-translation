  text: יְצַ֨ו יְהוָ֤ה אִתְּ/ךָ֙ אֶת הַ/בְּרָכָ֔ה בַּ/אֲסָמֶ֕י/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֣ח יָדֶ֑/ךָ וּ/בֵ֣רַכְ/ךָ֔ בָּ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: pt
  text: Yahweh ordenará que a bênção esteja com você em seus depósitos[a] e em todo o trabalho das suas mãos[b]; e abençoará você na terra que Yahweh, seu Deus, está lhe dando[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seus celeiros” ou “em seus granários”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “em todo o envio da sua mão”, expressão que se refere a todo trabalho ou empreendimento.'
    reason: lexical_alternative
  - marker: c
    text: Ou “lhe dá” ou “lhe dará”. O particípio hebraico admite mais de uma tradução neste contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו
  choice: ordenará
  rationale: O piel de צוה normalmente significa “ordenar”. A formulação conserva a imagem vívida de Yahweh dando ordem para que a bênção acompanhe Israel, em vez de suavizá-la para “enviar” ou “conceder”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal do Deus da aliança, em vez de substituí-lo por um título.
- source_word: אִתְּךָ אֶת הַבְּרָכָה
  choice: que a bênção esteja com você
  rationale: A construção com צוה e אֵת, seguida da bênção e de אִתְּךָ, apresenta a bênção como aquilo que Yahweh ordena que esteja com o destinatário. A oração completiva é natural em português e mantém essa relação.
- source_word: בַּאֲסָמֶיךָ
  choice: em seus depósitos
  rationale: אָסָם designa um lugar de armazenamento, especialmente de produtos agrícolas. “Depósitos” é abrangente e compreensível; as opções agrícolas mais específicas são registradas em nota.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: e em todo o trabalho das suas mãos
  rationale: A expressão hebraica, literalmente relacionada ao “envio” ou emprego da mão, é um idiomatismo para o trabalho e os empreendimentos de alguém. A tradução mantém a imagem concreta das mãos sem deixar de ser clara.
- source_word: וּבֵרַכְךָ
  choice: e abençoará você
  rationale: O perfeito com waw dá continuidade ao sentido futuro do verbo anterior. Em português, o sujeito Yahweh permanece claro pelo contexto.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: “Terra” preserva o termo característico de Deuteronômio e sua ressonância de dádiva da aliança, sem explicitar além do texto que se trata da terra prometida.
- source_word: נֹתֵן לָךְ
  choice: está lhe dando
  rationale: O particípio נֹתֵן pode retratar a ação como presente, em andamento ou iminente. “Está lhe dando” conserva seu aspecto progressivo e a proximidade da dádiva no contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: “Yahweh” preserva o nome pessoal do Deus da aliança. Não se substitui o nome por um título nem se introduz uma forma portuguesa tradicional cuja vocalização é secundária.
- issue: Nuance da aliança em בָּאָרֶץ
  choice: na terra
  alternative: no país
  rationale: Em Deuteronômio, “a terra” tem recorrente significado pactual. A escolha preserva essa ressonância sem inserir uma explicação interpretativa no corpo do versículo.
- issue: Agência divina na bênção
  choice: Yahweh ordenará que a bênção esteja com você
  alternative: Yahweh lhe concederá a bênção
  rationale: A tradução mantém a linguagem forte e pessoal do hebraico, segundo a qual a bênção obedece à ordem de Yahweh, sem transformar a frase numa formulação teológica mais abstrata.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Empregou-se “você” para o destinatário singular, em consonância com o hebraico. A formulação conserva a imagem hebraica da bênção ordenada por Yahweh e a expressão concreta “trabalho das suas mãos”, explicando em notas as alternativas lexicais e aspectuais.
