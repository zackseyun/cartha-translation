base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: pt
  text: E acontecerá que, se você obedecer com diligência à voz de Yahweh, seu Deus, tendo o cuidado de cumprir todos os seus mandamentos que hoje lhe ordeno, então Yahweh, seu Deus, colocará você acima de todas as nações da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Mantém a fórmula hebraica que introduz a condição e sua consequência futura, em português natural e solene.
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: se você der ouvidos com toda a atenção à voz
  rationale: A construção com infinitivo absoluto intensifica o verbo 'ouvir', e a expressão, no contexto da aliança, implica escuta obediente. 'Dar ouvidos' preserva essa ligação sem eliminar a imagem hebraica da voz.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: cuidando de cumprir
  rationale: Expressa tanto a atenção diligente de guardar como a realização concreta dos mandamentos, sem reproduzir de modo artificial os dois infinitivos hebraicos.
- source_word: כָּל מִצְוֺתָיו
  choice: todos os seus mandamentos
  rationale: Conserva o alcance total de כָּל e o registro pactual e jurídico de מִצְוֹת.
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: então ... colocará você acima
  rationale: Neste contexto, נָתַן indica colocar ou estabelecer em posição elevada; 'então' explicita em português a consequência da condição.
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: acima de todas as nações da terra
  rationale: Preserva a comparação abrangente com as nações e entende הָאָרֶץ aqui como 'a terra' em sentido amplo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio da aliança. A transliteração 'Yahweh' o distingue do título אֲדֹנָי sem impor uma substituição tradicional.
- issue: Sentido pactual de שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: der ouvidos com toda a atenção à voz
  alternative: obedecer fielmente; ouvir atentamente
  rationale: A expressão une escuta e obediência. A redação escolhida preserva a imagem concreta de ouvir a voz, enquanto o contexto imediato — cuidar de cumprir os mandamentos — torna clara sua dimensão obediente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” conserva o singular hebraico dirigido coletivamente a Israel; a formulação evita arcaísmos, mas mantém o tom solene e pactual.
