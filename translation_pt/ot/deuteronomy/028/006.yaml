  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: pt
  text: Você será bendito[a] ao entrar[b], e você será bendito ao sair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega a segunda pessoa masculina singular; Israel é interpelado coletivamente como um só povo.
    reason: cultural_note
  - marker: b
    text: Ou “em sua entrada... em sua saída”; a expressão provavelmente abrange todo o curso da vida e das atividades.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito será você
  rationale: O particípio passivo de ברך tem função predicativa numa seção que anuncia as bênçãos da aliança. A construção com futuro comunica esse valor prospectivo e mantém a cadência solene da fórmula.
- source_word: אַתָּה
  choice: você
  rationale: Pronome de segunda pessoa masculina singular. Em português de ampla legibilidade brasileira, “você” expressa naturalmente o destinatário singular; aqui Israel é interpelado coletivamente no singular.
- source_word: בְּבֹאֶךָ
  choice: ao entrar
  rationale: A preposição בְּ com o infinitivo construto de בוא e sufixo de segunda pessoa singular indica a circunstância da entrada. “Ao entrar” é natural, conciso e próximo da forma hebraica.
- source_word: וּבָרוּךְ
  choice: e bendito será você
  rationale: A repetição integral da fórmula reproduz o paralelismo e o equilíbrio retórico do hebraico.
- source_word: בְּצֵאתֶךָ
  choice: ao sair
  rationale: A preposição בְּ com o infinitivo construto de יצא e sufixo de segunda pessoa singular indica a circunstância da saída. O par “entrar/sair” preserva tanto o movimento literal quanto seu possível sentido abrangente.
theological_decisions:
- issue: Israel interpelado coletivamente no singular
  choice: Manter “você” no singular, sem convertê-lo em plural nem substituir o destinatário por “Israel”.
  alternative: “Benditos serão vocês...” ou “Bendito será Israel...”
  rationale: O hebraico emprega a segunda pessoa masculina singular, forma pactual comum de dirigir-se a Israel como um povo. A tradução preserva esse traço sem acrescentar uma explicação interpretativa ao texto.
- issue: Alcance da expressão “entrar e sair”
  choice: Conservar literalmente o par “ao entrar... ao sair”, indicando em nota seu provável valor abrangente.
  alternative: Parafrasear como “em tudo o que você fizer” ou “durante toda a sua vida”.
  rationale: O par pode funcionar como merismo para todo o curso da vida e das atividades, mas a redação literal também permite referência concreta aos movimentos cotidianos. Mantê-la preserva essa amplitude e a tensão do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem “Bendito será você” conserva a cadência formal da bênção e o paralelismo hebraico; “ao entrar... ao sair” evita linguagem arcaica e preserva a imagem original.
