base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: pt
  text: Não se desviem de nenhuma das palavras que hoje lhes ordeno, nem para a direita nem para a esquerda, indo atrás de outros deuses[a] para servi-los[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seguindo outros deuses”. A expressão hebraica significa literalmente “indo atrás de”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “adorá-los”. O verbo pode indicar o serviço prestado a uma divindade e, nesse contexto, tem sentido de culto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: se desviem
  rationale: O verbo סור significa afastar-se, desviar-se ou sair do caminho. “Desviar-se” preserva tanto a imagem de abandonar o caminho quanto o sentido pactual de deixar a instrução ordenada.
- source_word: מִכָּל הַדְּבָרִים
  choice: de nenhuma das palavras
  rationale: Sob a negação, מִכָּל expressa que não se deve abandonar palavra alguma. “Palavras” traduz diretamente דְּבָרִים, enquanto a oração seguinte explicita que se trata do que Moisés ordena.
- source_word: מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: que hoje lhes ordeno
  rationale: O particípio comunica a ação presente de Moisés, e “hoje” conserva a imediaticidade da renovação da aliança. A ordem natural do português favorece a colocação de “hoje” antes do pronome e do verbo.
- source_word: יָמִין וּשְׂמֹאול
  choice: nem para a direita nem para a esquerda
  rationale: A expressão espacial indica desvio em qualquer direção. A correlação “nem... nem” liga naturalmente a frase à proibição anterior.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: indo atrás de
  rationale: A formulação conserva a imagem verbal do hebraico, literalmente “ir atrás de”, ao mesmo tempo que soa natural em português. “Seguindo” é uma alternativa contextual mais direta.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É a correspondência direta da expressão hebraica e preserva a retórica deuteronômica sem acrescentar uma explicação sobre a natureza desses deuses.
- source_word: לְעָבְדָם
  choice: para servi-los
  rationale: עבד aplicado a divindades abrange serviço religioso e culto. “Servi-los” mantém o equivalente lexical mais amplo; “adorá-los” explicita sua força cultual.
theological_decisions:
- issue: Referência a outras divindades na advertência da aliança
  choice: outros deuses
  alternative: deuses estrangeiros
  rationale: O texto adverte contra seguir “outros deuses”. A tradução mantém essa linguagem sem resolver uma questão ontológica que o próprio versículo não discute.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “se desviem/lhes” trata os ouvintes como a comunidade de Israel e evita uma alternância de número pouco natural em português. A metáfora do caminho e a linguagem de serviço religioso foram preservadas.
