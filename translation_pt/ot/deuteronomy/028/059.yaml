  text: וְ/הִפְלָ֤א יְהוָה֙ אֶת מַכֹּ֣תְ/ךָ֔ וְ/אֵ֖ת מַכּ֣וֹת זַרְעֶ֑/ךָ מַכּ֤וֹת גְּדֹלוֹת֙ וְ/נֶ֣אֱמָנ֔וֹת וָ/חֳלָיִ֥ם רָעִ֖ים וְ/נֶאֱמָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: pt
  text: então Yahweh fará com que as suas pragas e as pragas de seus descendentes sejam extraordinárias[a] — pragas grandes e persistentes[b], e doenças graves e persistentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espantosas”. O verbo hebraico pode significar tornar algo extraordinário ou notável; aqui descreve a severidade excepcional do juízo.
    reason: lexical_alternative
  - marker: b
    text: “Persistentes” traduz um termo hebraico que significa firme, duradouro ou contínuo; a mesma palavra é usada tanto para as pragas como para as doenças.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: fará com que ... sejam extraordinárias
  rationale: O hifil de פלא indica tornar algo extraordinário ou espantoso. No contexto de maldição, a expressão comunica o caráter excepcional das pragas sem sugerir admiração positiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: as suas pragas / pragas
  rationale: מכה pode designar golpe ou praga; neste contexto de maldições da aliança, “pragas” expressa adequadamente aflições impostas e mantém o paralelismo com as doenças.
- source_word: זַרְעֶךָ
  choice: seus descendentes
  rationale: Expressa com clareza e naturalidade o sentido coletivo de זרע neste contexto.
- source_word: גְּדֹלוֹת
  choice: grandes
  rationale: Preserva o sentido básico do adjetivo e, no contexto, indica a magnitude das pragas.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: persistentes
  rationale: O termo derivado de אמן comunica aqui firmeza e continuidade. “Persistentes” é natural para pragas e doenças e preserva a repetição hebraica.
- source_word: חֳלָיִם
  choice: doenças
  rationale: Equivalente corrente e claro para enfermidades ou estados de doença.
- source_word: רָעִים
  choice: graves
  rationale: Embora o sentido básico seja “maus”, aplicado a doenças o adjetivo indica seu caráter nocivo ou severo; “graves” é idiomático em português.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: Mantém o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Força de פלא em contexto de juízo
  choice: fará com que ... sejam extraordinárias
  alternative: tornará ... espantosas
  rationale: Conserva a ideia de caráter excepcional sem acrescentar uma reação emocional específica nem dar ao verbo uma conotação positiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção explicita naturalmente o valor causativo do verbo hebraico, preserva a repetição de “pragas” e verte as duas ocorrências de נֶאֱמָן de modo consistente.
