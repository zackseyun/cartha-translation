base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: pt
  text: O seu cadáver[a] se tornará alimento para todas as aves do céu e para os animais da terra[b], e não haverá quem os espante[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu corpo morto”. O termo hebraico tem sentido degradante neste contexto de juízo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ave do céu” e “animais da terra”; essa combinação de céu e terra enfatiza a exposição e a desonra completas.
    reason: cultural_note
  - marker: c
    text: Isto é, ninguém afugentará as aves e os animais que estiverem devorando o cadáver.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: servirá de
  rationale: Neste contexto de maldição, a forma verbal expressa uma consequência futura. A construção “servirá de alimento” reproduz naturalmente em português o sentido predicativo de tornar-se comida.
- source_word: נִבְלָתְךָ
  choice: o seu cadáver
  rationale: נְבֵלָה designa um corpo morto e, neste contexto de juízo, tem sentido degradante. “Cadáver” preserva a dureza da imagem sem soar artificial em português.
- source_word: לְמַאֲכָל
  choice: de alimento
  rationale: O substantivo indica comida ou aquilo que é comido; em português, “servir de alimento para” comunica com naturalidade o resultado expresso pela preposição לְ.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: para todas as aves do céu
  rationale: עוֹף é coletivo e abrange criaturas voadoras; “aves” é uma tradução natural neste contexto. “Do céu” preserva a imagem hebraica e evita confusão com o céu como morada divina.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: e para os animais da terra
  rationale: בְּהֵמָה funciona coletivamente para animais terrestres. “Animais da terra” é claro, digno e mantém o paralelismo entre céu e terra.
- source_word: וְאֵין מַחֲרִיד
  choice: e não haverá quem os espante
  rationale: O particípio causativo de חרד indica fazer tremer ou assustar. O contexto fornece como objeto implícito as aves e os animais; “os espante” expressa isso de modo conciso e natural.
