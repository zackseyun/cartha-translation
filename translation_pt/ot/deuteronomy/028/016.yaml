  text: אָר֥וּר אַתָּ֖ה בָּ/עִ֑יר וְ/אָר֥וּר אַתָּ֖ה בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/016.yaml
  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: pt
  text: Maldito é você na cidade[a], e maldito é você no campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você está sob maldição”.'
    reason: Alternativa lexical que explicita אָרוּר como estado de estar debaixo de maldição, sem introduzir valor futuro.
lexical_decisions:
- source_word: אָרוּר
  choice: maldito será
  rationale: O particípio passivo funciona predicativamente numa fórmula de sanção da aliança. Em português, “maldito será você” preserva o caráter declarativo e a força do juízo, sem reduzi-lo a mero desejo.
- source_word: אַתָּה
  choice: você
  rationale: O pronome independente masculino singular está explícito e recebe destaque. “Você” oferece ampla legibilidade brasileira e mantém a interpelação direta individual, usada de modo representativo no contexto.
- source_word: בָּעִיר
  choice: na cidade
  rationale: A preposição indica localização; “na cidade” é a formulação direta e natural, em contraste com “no campo”.
- source_word: וְ
  choice: e
  rationale: A conjunção simples liga as duas declarações paralelas e conserva sua força cumulativa.
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: שָׂדֶה designa o campo ou terreno agrícola. “No campo” mantém o contraste concreto com a cidade e o merismo que abrange os âmbitos comuns da vida.
theological_decisions:
- issue: Fórmula de maldição da aliança e valor temporal
  choice: “Maldito será você” nas duas orações
  alternative: “Você é maldito”; “Que você seja maldito”; “Você estará sob maldição”
  rationale: O hebraico apresenta uma construção predicativa sem verbo, repetindo particípio e pronome. Em português, o futuro conserva a formulação tradicional e, no contexto das sanções anunciadas, comunica uma declaração de condição resultante, não um simples desejo optativo. A nota registra a alternativa lexical sem resolver excessivamente a nuance.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. O paralelismo entre cidade e campo foi preservado, assim como a repetição enfática da fórmula de maldição.
