base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: pt
  text: Yahweh entregará os seus inimigos que se levantarem contra você, derrotados diante de você.[a] Eles sairão contra você por um só caminho,[b] mas fugirão de diante de você por sete caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh fará que os seus inimigos que se levantarem contra você sejam derrotados diante de você”.'
    reason: lexical_alternative
  - marker: b
    text: 'Em hebraico, “por um caminho [...] por sete caminhos”: imagem de inimigos que chegam unidos, mas fogem dispersos em muitas direções.'
    reason: cultural_note
lexical_decisions:
- source_word: יִתֵּן
  choice: entregará
  rationale: Embora נתן signifique normalmente “dar”, em contexto militar também pode significar “entregar” ou “dar nas mãos de alguém”. “Entregará” comunica naturalmente esse sentido em português e se combina com o predicativo “derrotados”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֹיְבֶיךָ
  choice: os inimigos
  rationale: Equivalente direto do substantivo plural com sufixo de segunda pessoa; a relação possessiva é expressa naturalmente pela oração e pelo contexto.
- source_word: הַקָּמִים עָלֶיךָ
  choice: que se levantarem contra você
  rationale: קום com על, em contexto hostil, indica levantar-se contra alguém. O futuro do subjuntivo soa natural depois de uma referência futura sem reduzir a expressão simplesmente a “atacarem”.
- source_word: נִגָּפִים
  choice: derrotados
  rationale: O particípio nifal comunica que os inimigos são feridos ou vencidos. “Derrotados” preserva o resultado militar sem especificar que todos serão mortos.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: Mantém o idioma espacial e relacional hebraico, adequado tanto à derrota quanto à fuga na presença de Israel.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: por um só caminho
  rationale: Preserva a imagem concreta e o contraste numérico com “sete caminhos”, indicando uma aproximação unida.
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: sairão contra você
  rationale: Em contexto de batalha, יצא com אל descreve sair ou avançar contra alguém; “contra” torna explícita a hostilidade já presente no contexto.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: por sete caminhos
  rationale: Conserva o paralelismo com “um só caminho” e a imagem de uma fuga dispersa; não explicita no corpo do texto se sete também sugere totalidade.
- source_word: יָנוּסוּ
  choice: fugirão
  rationale: Equivalente natural e vigoroso para נוס, que descreve fuga, não apenas uma retirada ordenada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, sem inserir uma interpretação denominacional.
- issue: Força da promessa de vitória
  choice: “entregará ... derrotados”
  alternative: “fará que ... sejam derrotados”
  rationale: A formulação mantém a ação soberana atribuída a Yahweh e o estado resultante dos inimigos, sem definir o meio da derrota nem ampliar a promessa para além do que o verso declara.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Emprega “você” para o masculino singular hebraico, evita construções excessivamente literais e mantém a repetição intencional de “diante de você” e o contraste entre um e sete caminhos.
