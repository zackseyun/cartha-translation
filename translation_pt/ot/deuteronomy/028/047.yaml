  text: תַּ֗חַת אֲשֶׁ֤ר לֹא עָבַ֨דְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/שִׂמְחָ֖ה וּ/בְ/ט֣וּב לֵבָ֑ב מֵ/רֹ֖ב כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: pt
  text: porque você não serviu a Yahweh, seu Deus, com alegria e de coração contente[a], por causa da abundância de tudo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com bondade de coração”; a expressão também pode ser entendida como “com coração alegre”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em meio à abundância de tudo” ou “quando você tinha abundância de tudo”. A expressão também pode ser entendida como “por causa da abundância de tudo”; o contexto contrasta essa falta de serviço com a provisão abundante.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: porque
  rationale: Neste contexto de maldição da aliança, a expressão introduz a causa e é traduzida naturalmente por “porque”.
- source_word: עָבַדְתָּ
  choice: serviu
  rationale: Com Deus como objeto, o verbo abrange serviço, devoção e obediência à aliança; “serviu” preserva essa amplitude.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz diretamente o substantivo e o sufixo masculino singular, dirigido a Israel coletivamente.
- source_word: בְּשִׂמְחָה
  choice: com alegria
  rationale: Expressa de modo claro e natural a maneira pela qual o serviço deveria ter sido prestado.
- source_word: וּבְטוּב לֵבָב
  choice: e de coração contente
  rationale: A expressão hebraica fala literalmente do “bem/bondade do coração”, mas aqui denota uma disposição interior positiva e alegre. A formulação portuguesa é natural sem simplesmente repetir “alegria”.
- source_word: מֵרֹב כֹּל
  choice: em meio à abundância de tudo
  rationale: Preserva a ideia circunstancial de que a desobediência ocorreu apesar da provisão abundante, evitando sugerir que a abundância foi mecanicamente a causa da falha.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino; “Yahweh” o preserva como nome, sem substituí-lo por um título.
- issue: Amplitude do serviço da aliança em עבד
  choice: serviu
  alternative: adorou
  rationale: “Serviu” inclui adoração, devoção e obediência, sem restringir o termo apenas a atos cultuais.
- issue: Relação de מֵרֹב כֹּל com a falta de serviço
  choice: em meio à abundância de tudo
  alternative: por causa da abundância de tudo; quando você tinha abundância de tudo
  rationale: A tradução mantém a tensão sintática e comunica que Israel deixou de servir adequadamente mesmo cercado de provisão abundante, sem afirmar inequivocamente que a abundância causou a infidelidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” conserva o tratamento hebraico de Israel como unidade coletiva. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto seguinte.
