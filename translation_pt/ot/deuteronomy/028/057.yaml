  terminology: “Placenta” é preciso e compreensível; a nota registra adequadamente “secundinas”. “Filhos” é uma opção defensável para בָּנִים no contexto. “Cerco” e “aflição” representam bem o par hebraico. A nota sobre “portões” explica corretamente o valor urbano da expressão.
