base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: pt
  text: e contra a placenta que sair de entre as suas pernas[a], e contra os filhos que der à luz, pois os comerá às escondidas, por falta de tudo[b], durante o cerco e a aflição com que o seu inimigo o oprimirá nas suas cidades[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as secundinas”. O termo hebraico designa aquilo que é expelido depois do bebê no parto, especialmente a placenta.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, por causa da privação extrema de todas as coisas durante o cerco.
    reason: lexical_clarification
  - marker: c
    text: 'Literalmente: “nos seus portões”. A expressão refere-se às cidades ou povoações fortificadas, não apenas às estruturas dos portões.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: a placenta
  rationale: O substantivo designa a placenta ou as secundinas expelidas no parto. “Placenta” é claro, preciso e corrente em português; a alternativa mais ampla é registrada em nota.
- source_word: הַיֹּצֵת מִבֵּין רַגְלֶיהָ
  choice: que sair de entre as suas pernas
  rationale: Mantém a descrição física direta do hebraico. Neste contexto, רַגְלַיִם refere-se naturalmente às pernas, não apenas aos pés.
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: e os filhos que der à luz
  rationale: “Filhos” pode abranger a descendência de ambos os sexos neste contexto, e “der à luz” expressa naturalmente o verbo ילד.
- source_word: כִּי תֹאכְלֵם
  choice: pois os comerá
  rationale: כִּי introduz a razão da atitude descrita no contexto anterior, e אכל é preservado pelo verbo concreto “comer”, sem atenuar o horror da maldição.
- source_word: בַּסָּתֶר
  choice: às escondidas
  rationale: Expressa de modo natural o sentido adverbial de uma ação praticada secretamente.
- source_word: בְּחֹסֶר כֹּל
  choice: por falta de tudo
  rationale: Comunica a privação total provocada pelo cerco em português idiomático, sem reduzir a abrangência de כֹּל.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: durante o cerco e a aflição
  rationale: 'Preserva os dois termos coordenados: o primeiro designa o cerco militar; o segundo, a pressão, angústia ou aflição resultante.'
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: com que o seu inimigo a oprimirá
  rationale: O Hifil de צוּק indica pressão severa imposta pelo inimigo. O pronome feminino explicita em português que o destinatário imediato desta oração é a mulher mencionada no contexto.
- source_word: בִּשְׁעָרֶיךָ
  choice: dentro das suas cidades
  rationale: Literalmente “em/dentro dos seus portões”, expressão hebraica que, no contexto de cerco, designa as cidades cercadas. A imagem literal é preservada em nota.
theological_decisions: []
