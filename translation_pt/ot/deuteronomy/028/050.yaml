  text: גּ֖וֹי עַ֣ז פָּנִ֑ים אֲשֶׁ֨ר לֹא יִשָּׂ֤א פָנִים֙ לְ/זָקֵ֔ן וְ/נַ֖עַר לֹ֥א יָחֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/050.yaml
  text: a fierce-faced nation[c][b][a], one that shows no regard for the old and shows no favor to the young.
translation:
  language: pt
  text: uma nação de rosto feroz[a], que não respeitará o idoso[b] nem mostrará favor ao jovem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma nação forte de rosto”. Também pode ser traduzido por “uma nação de semblante feroz”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não levantará o rosto do idoso”; isto é, não lhe mostrará consideração ou respeito.
    reason: lexical_alternative
  - marker: c
    text: Ou “não terá misericórdia do jovem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹי
  choice: nação
  rationale: No contexto da maldição da aliança, designa um povo estrangeiro invasor; “nação” é claro e natural em português.
- source_word: עַז פָּנִים
  choice: de rosto feroz
  rationale: Preserva a imagem hebraica do rosto e comunica uma aparência ou disposição dura e ameaçadora sem reduzir a expressão apenas a insolência.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente, em português, a oração relativa que caracteriza a nação.
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: não respeitará o idoso
  rationale: A expressão idiomática “levantar o rosto” pode indicar consideração, favor ou deferência; diante de זָקֵן, “respeitará” expressa bem a falta de consideração pelos idosos.
- source_word: זָקֵן
  choice: o idoso
  rationale: O singular hebraico tem valor genérico. “O idoso” mantém esse caráter representativo e é corrente em português.
- source_word: וְנַעַר
  choice: nem ... ao jovem
  rationale: נַעַר abrange desde criança até jovem; em contraste com “idoso”, “jovem” preserva melhor a oposição etária sem especificar demais.
- source_word: לֹא יָחֹן
  choice: nem mostrará favor
  rationale: Mantém o sentido básico de חנן, “ser gracioso, mostrar favor”, e preserva sua distinção lexical em relação à oração anterior.
