base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: pt
  text: Yahweh fará a chuva da sua terra virar pó e poeira[a]; dos céus, cairá sobre você até que você seja destruído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pó e terra”. O hebraico reúne dois termos relacionados para material seco e solto (אָבָק, עָפָר), intensificando a imagem da chuva transformada em seca e devastação.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יִתֵּן
  choice: fará ... virar
  rationale: Embora o verbo signifique literalmente “dar”, neste contexto a construção indica que a chuva esperada se tornará pó e poeira; esta formulação explicita naturalmente essa relação em português.
- source_word: מְטַר אַרְצְךָ
  choice: a chuva da sua terra
  rationale: Mantém de modo claro e natural a relação da cadeia construta hebraica.
- source_word: אָבָק
  choice: pó
  rationale: Designa partículas finas e secas e permite preservar o par de termos hebraicos relacionados.
- source_word: וְעָפָר
  choice: e poeira
  rationale: Distingue o segundo termo do primeiro sem perder a intensificação produzida pelos quase sinônimos.
- source_word: מִן הַשָּׁמַיִם
  choice: dos céus
  rationale: Conserva a forma plural hebraica e o registro elevado da maldição da aliança.
- source_word: יֵרֵד עָלֶיךָ
  choice: isso cairá sobre você
  rationale: Expressa de forma idiomática a descida do material seco mencionado antes; “isso” retoma coletivamente o pó e a poeira sem impor uma referência gramatical mais precisa do que o contexto permite.
- source_word: עַד הִשָּׁמְדָךְ
  choice: até que você seja destruído
  rationale: Comunica claramente o limite final da maldição sem inserir um agente explícito que não aparece nesta oração.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” preserva o nome divino no corpo do texto sem substituí-lo por um título.
- issue: Agente da destruição na oração final
  choice: voz passiva sem agente explícito
  alternative: até que ele destrua você
  rationale: O hebraico exprime de maneira compacta o processo ou resultado da destruição; a passiva conserva essa indeterminação e evita acrescentar um sujeito gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a imagem forte e paradoxal de uma chuva que se torna material seco, mantendo o paralelismo lexical do hebraico.
