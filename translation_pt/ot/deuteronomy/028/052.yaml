  text: וְ/הֵצַ֨ר לְ/ךָ֜ בְּ/כָל שְׁעָרֶ֗י/ךָ עַ֣ד רֶ֤דֶת חֹמֹתֶ֨י/ךָ֙ הַ/גְּבֹה֣וֹת וְ/הַ/בְּצֻר֔וֹת אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בָּ/הֵ֖ן בְּ/כָל אַרְצֶ֑/ךָ וְ/הֵצַ֤ר לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ בְּ/כָ֨ל אַרְצְ/ךָ֔ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: pt
  text: Ele cercará você em todas as suas cidades[a], até que, em toda a sua terra, caiam as muralhas altas e fortificadas nas quais você confia. Ele cercará você em todas as suas cidades, por toda a terra que Yahweh, seu Deus, lhe deu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em todos os seus portões”; os portões representam aqui as cidades.
    reason: A nota preserva a imagem concreta do hebraico enquanto o texto principal comunica com clareza o referente metonímico no contexto de um cerco.
lexical_decisions:
- source_word: וְהֵצַר
  choice: cercará
  rationale: O hifil de צור, no contexto militar de muralhas e portas urbanas, descreve a ação de sitiar ou cercar uma população; “cercará” é claro e natural em português e foi mantido nas duas ocorrências.
- source_word: שְׁעָרֶיךָ
  choice: suas cidades
  rationale: Literalmente, “seus portões”, mas aqui os portões representam metonimicamente as cidades submetidas ao cerco. “Em todas as suas cidades” comunica naturalmente o sentido contextual; a imagem literal é preservada em nota.
- source_word: עַד רֶדֶת
  choice: até que ... caiam
  rationale: O infinitivo de ירד significa literalmente “descer”; aplicado a muralhas sob cerco, indica sua queda. “Caiam” expressa com clareza o resultado sem acrescentar o agente.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: as muralhas altas e fortificadas
  rationale: Preserva o substantivo e os dois qualificativos do hebraico, mantendo a concreta imagem defensiva.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: nas quais você confia
  rationale: בטח com ב expressa confiança ou dependência depositada em algo. A tradução conserva a tensão teológica da confiança humana nas defesas.
- source_word: בְּכָל אַרְצֶךָ
  choice: em toda a sua terra / por toda a terra
  rationale: A construção indica alcance distributivo e total. A pequena variação estilística evita rigidez sem alterar o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: que Yahweh, seu Deus, lhe deu
  rationale: Reproduz naturalmente a oração relativa e o perfeito hebraico como uma dádiva já realizada.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Objeto da confiança de Israel
  choice: “muralhas ... nas quais você confia”
  alternative: “muralhas ... nas quais você se apoia”
  rationale: “Confia” preserva explicitamente a linguagem de confiança do hebraico sem explicar ou resolver a crítica teológica implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O pronome “você” mantém o singular de segunda pessoa dirigido a Israel coletivamente. A repetição de “Ele cercará você” conserva a ênfase estrutural do hebraico.
