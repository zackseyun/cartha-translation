  naturalness: O português é moderno, claro e de registro apropriado. “Ele cercará você” é compreensível e mantém o destinatário singular coletivo do hebraico; a repetição soa intencional, como no original. A ordenação da primeira frase é natural e deixa claro que as muralhas cairão em toda a terra.
