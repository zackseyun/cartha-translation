base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: pt
  text: E vocês ficarão reduzidos a bem poucos[a], embora vocês tenham se tornado tão numerosos quanto as estrelas do céu[b], porque você não ouviu a voz de Yahweh, seu Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pessoas de pouco número”, um idiomatismo que significa “muito poucos em número”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao passo que vocês tinham sido tão numerosos quanto as estrelas do céu”.'
    reason: alternative_reading
  - marker: c
    text: A expressão “ouvir a voz” também implica atender e obedecer, especialmente no contexto da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: vocês ficarão reduzidos
  rationale: 'O nifal de שׁאר indica o resultado de perdas ou juízo: restará apenas uma parcela do povo. A formulação preserva esse sentido resultativo e passivo em português natural.'
- source_word: בִּמְתֵי מְעָט
  choice: a bem poucos
  rationale: A expressão idiomática significa que o povo ficará em número muito pequeno, sem restringir a referência a homens do sexo masculino.
- source_word: תַּחַת אֲשֶׁר
  choice: embora
  rationale: Neste contexto, a locução introduz o contraste entre a grande população anterior e sua futura redução; a conjunção concessiva comunica esse contraste com clareza.
- source_word: הֱיִיתֶם
  choice: tivessem se tornado
  rationale: Expressa o estado alcançado pela multiplicação de Israel antes do juízo, em contraste com a redução anunciada.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: tão numerosos quanto as estrelas do céu
  rationale: Reproduz de modo idiomático a comparação quantitativa e conserva sua ressonância nas promessas da aliança.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: porque você não ouviu a voz
  rationale: Mantém a imagem lexical de ouvir a voz, embora no contexto da aliança a expressão também implique atender e obedecer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Forma portuguesa natural para a expressão da aliança, mantendo o possessivo singular do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Mudança do plural para o singular coletivo em לֹא שָׁמַעְתָּ e אֱלֹהֶיךָ
  choice: 'manter a mudança: “vocês” e depois “você/seu”'
  alternative: uniformizar toda a frase no plural
  rationale: A alternância de número é característica do discurso de Deuteronômio, no qual Israel é tratado tanto como comunidade plural quanto como unidade coletiva. Mantê-la preserva um traço significativo do original.
- issue: Sentido pactual de שׁמע בקול
  choice: “ouviu a voz”, com nota explicativa
  alternative: “obedeceu”
  rationale: A tradução conserva a metáfora explícita do hebraico sem apagar a implicação de obediência própria do contexto da aliança.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “vocês” no plural e “você” no singular coletivo para reproduzir a alternância hebraica. “Céu” é mais natural em português do que o plural literal “céus” nesta comparação.
