  text: הַ/יּ֣וֹם הַ/זֶּ֗ה יְהוָ֨ה אֱלֹהֶ֜י/ךָ מְצַוְּ/ךָ֧ לַ/עֲשׂ֛וֹת אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה וְ/אֶת הַ/מִּשְׁפָּטִ֑ים וְ/שָׁמַרְתָּ֤ וְ/עָשִׂ֨יתָ֙ אוֹתָ֔/ם בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: pt
  text: Neste dia[a], Yahweh, seu Deus, ordena que você cumpra estes estatutos e estas normas[b]; e você deve guardá-los e cumpri-los com todo o seu coração e com toda a sua alma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Hoje”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser traduzido como “decisões judiciais”, “ordenanças” ou “juízos”.
    reason: lexical_alternative
  - marker: c
    text: “Alma” traduz o hebraico néfesh, que também pode significar “vida”, “pessoa” ou “o próprio ser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: Neste dia
  rationale: Preserva a ênfase temporal e a solenidade pactual da expressão hebraica, sem deixar de soar natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz o sufixo de segunda pessoa singular e a relação pactual indicada no hebraico.
- source_word: מְצַוְּךָ
  choice: ordena
  rationale: O presente transmite a força atual e imediata do particípio hebraico de modo natural em português.
- source_word: לַעֲשׂוֹת
  choice: que você cumpra
  rationale: Neste contexto legal, “cumprir” comunica de maneira natural a execução dos mandamentos, sem ampliar indevidamente o sentido de עשה.
- source_word: הַחֻקִּים
  choice: estatutos
  rationale: Termo formal e corrente em contextos legais e pactuais, mantendo a distinção em relação a מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: normas
  rationale: Expressa com clareza moderna as prescrições legais abrangidas pelo termo, cuja variedade semântica é registrada em nota.
- source_word: וְשָׁמַרְתָּ
  choice: e você deve guardá-los
  rationale: “Deve” torna explícita em português a força exortativa da construção, enquanto “guardar” conserva a linguagem pactual de שמר.
- source_word: וְעָשִׂיתָ אֹתָם
  choice: e cumpri-los
  rationale: Mantém a repetição conceitual de עשה e a dupla ênfase em guardar e pôr em prática.
- source_word: בְּכָל לְבָבְךָ
  choice: com todo o seu coração
  rationale: Equivalente natural que abrange vontade, pensamento e afeto no uso deuteronômico.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: e com toda a sua alma
  rationale: Preserva a formulação tradicional e a ressonância do paralelismo, enquanto a amplitude de נֶפֶשׁ é esclarecida em nota.
theological_decisions:
- issue: Tradução do nome pactual יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Força da segunda pessoa masculina singular
  choice: você/seu, no singular
  alternative: vocês ou acréscimo explícito de “Israel”
  rationale: O singular mantém a maneira direta pela qual Israel é interpelado como unidade pactual, sem introduzir uma explicação ausente do texto.
- issue: Força de וְשָׁמַרְתָּ וְעָשִׂיתָ
  choice: obrigação expressa por “deve”
  alternative: 'futuro simples: “guardará e cumprirá”'
  rationale: No contexto, as formas têm força injuntiva. “Deve” evita que o leitor moderno as entenda apenas como previsão, sem transformá-las em imperativos mais abruptos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o tom pactual e legal sem recorrer a formas excessivamente arcaicas; “você” explicita o singular do hebraico.
