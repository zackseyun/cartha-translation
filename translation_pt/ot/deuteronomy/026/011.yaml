  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: pt
  text: E você se alegrará com todo o bem que Yahweh, seu Deus, deu a você e à sua família, junto com o levita e o estrangeiro residente[a] que está no seu meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico designa uma pessoa de origem estrangeira que residia entre os israelitas sob a proteção da comunidade.
    reason: Esclarecimento do sentido jurídico-social de גֵּר.
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: E você se alegrará
  rationale: O perfeito qal com a conjunção, neste contexto de instrução ritual, tem valor injuntivo ou futuro. “Se alegrará” conserva tanto a alegria quanto o caráter festivo da ocasião.
- source_word: בְכָל הַטּוֹב
  choice: com todo o bem
  rationale: A preposição בְּ indica aquilo em relação ao qual se deve alegrar. “Com todo o bem” é natural em português e evita transformar explicitamente a expressão em causa, embora esse sentido esteja implícito.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: que ... deu a você
  rationale: Traduz de modo direto a oração relativa e o dativo hebraico, mantendo a ação concluída de dar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a formulação pactual e o sufixo pronominal da segunda pessoa do singular.
- source_word: וּלְבֵיתֶךָ
  choice: e à sua família
  rationale: Neste contexto, בַּיִת designa a unidade familiar ou doméstica, não apenas uma construção. “Família” comunica esse sentido com clareza corrente.
- source_word: אַתָּה
  choice: você
  rationale: O pronome explícito é mantido para refletir sua função enfática e sua posição no início da enumeração dos participantes.
- source_word: הַלֵּוִי
  choice: o levita
  rationale: É a designação precisa e tradicional para um membro da tribo de Levi, especialmente relevante neste contexto social e cultual.
- source_word: הַגֵּר
  choice: o estrangeiro residente
  rationale: גֵּר designa uma pessoa não nativa estabelecida entre Israel e acolhida sob a proteção da comunidade. “Estrangeiro residente” expressa melhor essa condição jurídico-social do que apenas “estrangeiro” ou “forasteiro”.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: que está no seu meio
  rationale: Mantém a imagem espacial e comunitária do hebraico e preserva a segunda pessoa do singular.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o representa diretamente; “SENHOR” o substituiria por um título, e “Javé” é uma forma portuguesa tradicional, mas menos transparente como transliteração.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. A segunda pessoa do singular foi vertida por “você”, forma corrente no Brasil; “no seu meio” conserva o referente singular do hebraico. O travessão torna clara a enumeração explicativa sem acrescentar uma relação ausente do original.
