base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: pt
  text: 'Olha da tua santa morada, dos céus, e abençoa o teu povo, Israel, e o solo que nos deste, conforme juraste aos nossos pais[a]: uma terra que mana leite e mel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos nossos antepassados”. O hebraico diz “aos nossos pais”, referindo-se aos patriarcas.
    reason: Alternativa lexical que esclarece o alcance genealógico da expressão sem apagar a forma masculina do texto hebraico.
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: Olha lá do alto
  rationale: O imperativo pede que Deus dirija o olhar desde sua posição celestial. A expressão é natural em português e comunica a perspectiva elevada sem acrescentar um objeto ausente no hebraico.
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: da tua santa morada
  rationale: מָעוֹן designa lugar de habitação. “Santa morada” conserva o sentido espacial e sagrado com linguagem digna e corrente.
- source_word: מִן הַשָּׁמַיִם
  choice: dos céus
  rationale: Mantém o plural formal da expressão hebraica, que também é idiomático e compreensível em português.
- source_word: וּבָרֵךְ
  choice: e abençoa
  rationale: Tradução direta e transparente do imperativo de ברך.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: o teu povo, Israel
  rationale: A vírgula torna explícita a aposição pela qual Israel identifica o povo de Deus.
- source_word: הָאֲדָמָה
  choice: o solo
  rationale: “Solo” preserva a nuance agrícola de אֲדָמָה e sua distinção lexical de אֶרֶץ, traduzido depois por “terra”.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: que nos deste
  rationale: O pretérito perfeito expressa de modo natural a ação divina concluída de dar o solo ao povo.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: conforme juraste aos nossos pais
  rationale: “Conforme” exprime a correspondência com o juramento; “pais” conserva o masculino explícito do hebraico e a fórmula pactual referente aos patriarcas.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: uma terra que mana leite e mel
  rationale: “Manar leite e mel” é uma formulação portuguesa tradicional, clara e viva para a imagem hebraica de fertilidade e abundância.
theological_decisions:
- issue: Sentido de לַאֲבֹתֵינוּ na fórmula da aliança
  choice: aos nossos pais
  alternative: aos nossos antepassados
  rationale: O hebraico emprega explicitamente o substantivo masculino “pais”, aqui associado aos patriarcas. A tradução principal conserva essa forma, enquanto a nota registra o sentido genealógico mais amplo possível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação preserva a distinção entre אֲדָמָה (“solo”) e אֶרֶץ (“terra”), bem como a aposição “o teu povo, Israel”. O marcador da nota foi colocado junto de “pais”, termo ao qual a nota efetivamente se refere.
