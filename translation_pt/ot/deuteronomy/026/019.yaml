  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: pt
  text: e para colocar você acima de todas as nações que ele fez, para louvor, renome[a] e esplendor[b], e para que você seja um povo santo para o SENHOR, seu Deus, conforme ele falou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fama”; literalmente, “nome”.
    reason: lexical_alternative
  - marker: b
    text: Ou “glória” ou “beleza”.
    reason: lexical_alternative
  - marker: c
    text: Ou “conforme prometeu”; literalmente, “conforme falou”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: e para colocar você acima de todas as nações
  rationale: Conserva a construção de propósito ou resultado com נתן e o sentido comparativo de עֶלְיוֹן עַל. O singular “você” preserva a forma hebraica, que se dirige coletivamente a Israel.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ele fez
  rationale: Traduz diretamente o verbo comum עשה sem intensificá-lo para “criou”.
- source_word: לִתְהִלָּה
  choice: para louvor
  rationale: Mantém o substantivo abstrato e a sequência de finalidade marcada por לְ.
- source_word: וּלְשֵׁם
  choice: renome
  rationale: Neste contexto, שֵׁם comunica nome reputado, fama ou renome; “renome” expressa naturalmente essa força em português.
- source_word: וּלְתִפְאָרֶת
  choice: esplendor
  rationale: תִּפְאֶרֶת pode indicar beleza, esplendor ou glória. “Esplendor” preserva sua dimensão estética sem reduzir o termo apenas a honra.
- source_word: וְלִהְיֹתְךָ עַם קָדוֹשׁ
  choice: e para que você seja um povo santo
  rationale: Reproduz a continuação da série de propósitos e mantém o destinatário coletivo no singular.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para o SENHOR, seu Deus
  rationale: A preposição לְ indica relação ou pertencimento. “SENHOR” segue a convenção editorial para o nome divino יהוה.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: conforme ele falou
  rationale: Permanece próximo do sentido lexical de דבר e não torna explícita a ideia contextual de promessa.
theological_decisions:
- issue: Se a oração final deve ser explicitamente apresentada como promessa
  choice: conforme ele falou
  alternative: conforme ele prometeu
  rationale: O verbo hebraico significa literalmente “falou”; embora o contexto da aliança permita entender a fala como promessa, o texto não emprega um verbo específico para prometer.
- issue: Representação de יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção editorial indicada para o nome divino sem alterar sua referência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. O singular “você” reflete o destinatário coletivo singular do hebraico; “renome” e “esplendor” comunicam de modo natural os sentidos contextuais, enquanto as notas preservam as alternativas lexicais.
