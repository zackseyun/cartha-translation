base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: pt
  text: Não comi nada dele enquanto estava de luto[a], não retirei nada dele[b] enquanto estava impuro e não dei nada dele aos mortos[c]. Obedeci à voz de Yahweh, meu Deus; fiz tudo conforme me ordenaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em meu luto”, “em tristeza” ou “em aflição”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não queimei nada dele” ou “não eliminei nada dele”. O verbo hebraico pode se referir a queimar ou retirar.
    reason: lexical_alternative
  - marker: c
    text: Ou “a um morto” ou “em relação aos mortos”; o uso proibido exato não é especificado.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: enquanto estava de luto
  rationale: O substantivo אֹנִי pode indicar luto, tristeza ou aflição. Neste contexto ritual, a formulação escolhida comunica naturalmente a condição de luto sem eliminar as alternativas lexicais, registradas em nota.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: não retirei nada dele
  rationale: No Piel, בער pode significar queimar, consumir, eliminar ou retirar. “Retirei” preserva o sentido amplo e evita especificar um modo de descarte que o contexto não determina.
- source_word: בְּטָמֵא
  choice: enquanto estava impuro
  rationale: A expressão indica uma condição de impureza, provavelmente ritual, durante o manejo da porção consagrada. A tradução mantém a referência ao estado do declarante.
- source_word: לְמֵת
  choice: aos mortos
  rationale: A expressão hebraica é breve e não define se se trata de oferta funerária, uso ligado a um cadáver ou outra prática relacionada aos mortos. A tradução conserva essa amplitude.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: Obedeci à voz
  rationale: A locução hebraica significa ouvir com resposta obediente. “Obedeci à voz” preserva tanto o valor idiomático quanto a imagem concreta da voz divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Emprega-se a transliteração do nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: fiz tudo conforme me ordenaste
  rationale: A formulação expressa conformidade abrangente com tudo o que foi ordenado e mantém o tom solene da declaração.
theological_decisions:
- issue: Natureza do uso proibido expresso por לְמֵת
  choice: Manter a formulação ampla “aos mortos” sem definir a prática.
  alternative: “para ritos funerários”, “a um morto” ou “em relação a um cadáver”
  rationale: O hebraico não especifica a natureza exata do uso. Uma formulação ampla evita introduzir uma explicação ritual ou doutrinária que o próprio versículo não fornece.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda pessoa singular em “ordenaste” preserva a interpelação direta a Deus no contexto litúrgico. Os marcadores de nota aparecem imediatamente após as expressões às quais se referem.
