  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: pt
  text: Então clamamos a Yahweh, o Deus de nossos pais, e Yahweh ouviu a nossa voz e viu a nossa aflição, o nosso trabalho penoso e a opressão que sofríamos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: clamamos
  rationale: O verbo expressa um clamor urgente por socorro; “clamamos” preserva essa intensidade e é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: o Deus de nossos pais
  rationale: Mantém a fórmula pactual e a referência masculina específica aos antepassados de Israel no hebraico.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: ouviu a nossa voz
  rationale: Conserva a expressão concreta do hebraico, que nesse contexto significa atender ao clamor do povo.
- source_word: וַיַּרְא
  choice: viu
  rationale: Reproduz o verbo simples sem explicitar além do texto a ideia implícita de atenção e cuidado.
- source_word: עָנְיֵנוּ
  choice: a nossa aflição
  rationale: Expressa a condição de sofrimento e humilhação indicada pelo substantivo.
- source_word: עֲמָלֵנוּ
  choice: o nosso trabalho penoso
  rationale: Preserva o componente de labor árduo de עָמָל e o distingue tanto da aflição quanto da opressão.
- source_word: לַחֲצֵנוּ
  choice: a opressão que sofríamos
  rationale: Comunica naturalmente a pressão coerciva exercida contra Israel, evitando a possível leitura possessiva de que a opressão fosse praticada pelo povo.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência dos três sofrimentos foi mantida com termos distintos. Não foram incluídas notas porque as alternativas lexicais não são necessárias para compreender este versículo isoladamente.
