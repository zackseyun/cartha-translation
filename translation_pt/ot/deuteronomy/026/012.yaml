  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: pt
  text: Quando você terminar de separar todo o dízimo da sua produção no terceiro ano, o ano do dízimo, entregue-o ao levita, ao estrangeiro residente, ao órfão e à viúva. Eles comerão dentro das suas cidades[a] até ficarem satisfeitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dentro dos seus portões”.
    reason: A expressão hebraica usa os portões como referência às cidades ou comunidades locais.
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz aqui a circunstância temporal que antecede a instrução principal.
- source_word: תְכַלֶּה לַעְשֵׂר
  choice: terminar de separar... o dízimo
  rationale: Expressa a conclusão do ato de destinar a décima parte, mantendo no contexto o termo técnico «dízimo».
- source_word: כָּל מַעְשַׂר תְּבוּאָתְךָ
  choice: todo o dízimo da sua produção
  rationale: Preserva a construção enfática e traduz תְּבוּאָה de maneira abrangente para o rendimento agrícola.
- source_word: שְׁנַת הַמַּעֲשֵׂר
  choice: o ano do dízimo
  rationale: Reproduz de modo claro e conciso a expressão construta hebraica.
- source_word: וְנָתַתָּה
  choice: entregue-o
  rationale: O imperativo português comunica naturalmente a sequência normativa; o pronome retoma o dízimo.
- source_word: לַגֵּר
  choice: ao estrangeiro residente
  rationale: גֵּר designa um não israelita estabelecido na comunidade, não simplesmente qualquer desconhecido ou viajante.
- source_word: לַיָּתוֹם
  choice: ao órfão
  rationale: Termo corrente e digno em português para a categoria social vulnerável indicada no hebraico.
- source_word: בִשְׁעָרֶיךָ
  choice: dentro das suas cidades
  rationale: No contexto legal de Deuteronômio, «portões» funciona como metonímia dos povoados ou cidades; a nota preserva a forma literal.
- source_word: וְשָׂבֵעוּ
  choice: até ficarem satisfeitos
  rationale: Comunica que comerão até a saciedade, sentido natural do verbo שׂבע neste contexto.
theological_decisions:
- issue: Categorias beneficiárias do dízimo
  choice: levita, estrangeiro residente, órfão e viúva
  alternative: trabalhadores religiosos, imigrantes e demais necessitados
  rationale: Mantêm-se as categorias concretas da legislação da aliança sem convertê-las em abstrações sociais modernas.
- issue: Sentido de בִשְׁעָרֶיךָ
  choice: dentro das suas cidades
  alternative: dentro dos seus portões
  rationale: A tradução principal comunica o referente comunitário da expressão idiomática, enquanto a nota registra sua imagem literal.
translation_notes:
  register: Português moderno, claro e digno, com formas de ampla compreensão no Brasil. A repetição ligada a «dízimo» foi parcialmente preservada, e a longa frase hebraica foi dividida para maior legibilidade sem alterar sua progressão lógica.
