source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: pt
  text: Quando você entrar na terra que Yahweh, seu Deus, está lhe dando como herança, e tomar posse dela[a] e morar nela[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “possuí-la”; em alguns contextos, o verbo hebraico também pode ser traduzido por “herdá-la”, mas aqui se refere a tomar posse da terra.
    reason: lexical_alternative
  - marker: b
    text: Ou “habitar nela” ou “estabelecer-se nela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quando
  rationale: A fórmula hebraica introduz uma circunstância futura. “Quando” expressa com naturalidade sua força temporal em português, sem a rigidez de “e acontecerá que, quando”.
- source_word: תָבֹוא אֶל־הָאָרֶץ
  choice: você entrar na terra
  rationale: בוא com אֶל indica ingresso. “Entrar na terra” é mais idiomático em português do que “vir para dentro da terra” e preserva o tratamento na segunda pessoa do singular.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva o sufixo de segunda pessoa do singular e o caráter pessoal da declaração.
- source_word: נֹתֵן לְךָ
  choice: está lhe dando
  rationale: O particípio hebraico apresenta a dádiva como ação em curso ou iminente. A forma progressiva conserva essa nuance e continua natural em português.
- source_word: נַחֲלָה
  choice: como herança
  rationale: O termo designa uma herança ou propriedade atribuída. “Como herança” mantém a dimensão da terra concedida por Deus.
- source_word: וִירִשְׁתָּהּ
  choice: tomar posse dela
  rationale: No contexto da terra, ירשׁ indica assumir ou obter sua posse. A formulação comunica o sentido ativo e evita repetir “herança”.
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: e morar nela
  rationale: ישׁב pode significar habitar, residir ou estabelecer-se. “Morar nela” é atual, claro e adequado à ideia de residência estável.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo pelo título “SENHOR”.
- issue: Relação entre a dádiva divina e a posse humana da terra
  choice: Manter distintas a ação de Deus (“está lhe dando”) e a ação posterior de Israel (“tomar posse dela e morar nela”)
  alternative: Resumir toda a sequência como simples recebimento da terra
  rationale: O hebraico apresenta em sequência a entrada na terra, a dádiva divina, a tomada de posse e a residência. Preservar esses elementos mantém tanto a iniciativa divina quanto a ação humana, sem eliminar a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento “você” torna explícita a segunda pessoa masculina singular do hebraico sem recorrer ao registro mais solene e regionalmente variável de “tu”. A vírgula final foi mantida porque o versículo introduz a oração que prossegue no contexto seguinte.
