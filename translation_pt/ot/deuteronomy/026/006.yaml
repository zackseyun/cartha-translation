base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: pt
  text: E os egípcios nos maltrataram, nos oprimiram e impuseram sobre nós trabalho pesado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: nos maltrataram
  rationale: O hifil de רעע expressa causar dano ou tratar alguém mal. “Nos maltrataram” é natural em português e mantém o sentido amplo sem especificar uma forma de violência não indicada pelo verbo.
- source_word: הַמִּצְרִים
  choice: os egípcios
  rationale: Designação definida do povo do Egito como agente da opressão narrada.
- source_word: וַיְעַנּוּנוּ
  choice: nos oprimiram
  rationale: O piel de ענה pode indicar afligir, oprimir ou humilhar. No contexto da servidão no Egito, “oprimiram” comunica com clareza a imposição de sofrimento e permanece distinto de “maltrataram”.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: impuseram sobre nós
  rationale: A construção נתן על significa pôr ou impor algo sobre alguém. “Impuseram sobre nós” reproduz a imagem do fardo e soa digna e corrente.
- source_word: עֲבֹדָה קָשָׁה
  choice: trabalhos pesados
  rationale: עֲבֹדָה denota trabalho ou serviço, e קָשָׁה, algo duro, severo ou penoso. O plural idiomático “trabalhos pesados” é claro em português e expressa a carga extenuante da servidão.
theological_decisions:
- issue: Distinção entre as três expressões da opressão
  choice: Preservar a progressão com “nos maltrataram”, “nos oprimiram” e “impuseram sobre nós trabalhos pesados”.
  alternative: Fundir os dois primeiros verbos em uma única ideia ou empregar terminologia explícita de escravidão em todas as orações.
  rationale: O hebraico apresenta três ações relacionadas, mas não idênticas. Mantê-las distintas preserva a progressão retórica sem acrescentar especificações além das expressas no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “nos” conserva a cadência da sequência hebraica; “impuseram sobre nós” mantém a imagem de carga, embora “impuseram-nos” fosse mais compacto e formal.
