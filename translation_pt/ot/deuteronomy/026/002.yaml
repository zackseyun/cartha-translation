  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: pt
  text: Pegue uma parte das primícias de toda a produção da terra que você trouxer da sua terra, a qual Yahweh, seu Deus, lhe dá; coloque-a num cesto e vá ao lugar que Yahweh, seu Deus, escolher para fazer habitar ali o seu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para fazer habitar ali o seu nome”. Esta é uma fórmula característica de Deuteronômio para o lugar que Yahweh escolher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ מֵרֵאשִׁית
  choice: pegue uma parte das primícias
  rationale: A sequência verbal tem força de instrução. מִן com רֵאשִׁית indica uma porção dos primeiros produtos, não necessariamente a totalidade; “uma parte das primícias” preserva isso com clareza.
- source_word: כָּל פְּרִי הָאֲדָמָה
  choice: de todos os frutos da terra
  rationale: “Frutos da terra” mantém a imagem agrícola e, neste contexto, abrange os produtos do solo em geral.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: que você recolher da terra
  rationale: O Hifil de בוא expressa trazer ou recolher para dentro. A formulação portuguesa comunica a entrada da produção sem restringir o sentido ao ato técnico de colher.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: que Yahweh, seu Deus, lhe dá
  rationale: O particípio נֹתֵן apresenta a dádiva divina como contínua ou característica. O presente natural em português preserva essa ênfase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: coloque-a num cesto
  rationale: טֶּנֶא é um cesto para transportar produtos agrícolas. O pronome feminino retoma naturalmente “uma parte”.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: e vá ao lugar
  rationale: Traduz naturalmente a ordem sequencial e preserva “o lugar”, expressão característica de Deuteronômio.
- source_word: אֲשֶׁר יִבְחַר
  choice: que ... escolher
  rationale: O imperfeito tem orientação futura em relação ao discurso de Moisés; o futuro do subjuntivo é idiomático após “que” em português.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para ali fazer habitar o seu nome
  rationale: Mantém o valor causativo de שכן e a fórmula teológica deuteronômica, sem reduzi-la à ideia de simples posse ou designação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino. “Yahweh” preserva essa função e evita substituí-lo por um título.
- issue: Fórmula do santuário לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para ali fazer habitar o seu nome
  alternative: para ali pôr o seu nome
  rationale: 'A tradução mantém a causalidade verbal e a tensão teológica da expressão: é o nome de Deus que habita no lugar escolhido, sem afirmar de maneira simplista que Deus esteja espacialmente contido ali.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna explícito o singular hebraico e mantém a instrução direta. A formulação conserva a repetição de “Yahweh, seu Deus” e a linguagem do lugar escolhido.
