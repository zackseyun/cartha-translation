  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: pt
  text: 'Então dirás diante de Yahweh, teu Deus: “Retirei de casa a porção consagrada[a] e também a dei ao levita, ao estrangeiro residente[b], ao órfão e à viúva, conforme tudo o que me ordenaste. Não transgredi nenhum dos teus mandamentos, nem me esqueci deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a porção sagrada” ou “a coisa santa”; o hebraico se refere à porção consagrada, separada para distribuição.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao forasteiro”; trata-se do estrangeiro que residia entre o povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Então você dirá
  rationale: O perfeito com waw dá continuidade à sequência ritual. “Então” expressa com naturalidade essa progressão, e o futuro mantém o caráter prescritivo.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: diante de Yahweh, seu Deus
  rationale: לִפְנֵי significa “diante de/na presença de”; “diante de” é natural e conciso. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: בִּעַרְתִּי
  choice: Retirei
  rationale: Neste contexto, בער indica eliminar ou retirar de casa a porção consagrada, não queimá-la literalmente.
- source_word: הַקֹּדֶשׁ
  choice: a porção consagrada
  rationale: Literalmente, “a coisa santa”; no contexto, designa a parte separada para distribuição. “Porção consagrada” esclarece o referente sem eliminar seu caráter sagrado.
- source_word: מִן הַבַּיִת
  choice: de casa
  rationale: Embora o hebraico diga literalmente “da casa”, a expressão portuguesa “de casa” comunica naturalmente que se trata da casa do declarante.
- source_word: וְגַם נְתַתִּיו
  choice: e também a dei
  rationale: O sufixo pronominal retoma a porção consagrada. O pretérito perfeito apresenta a ação como concluída na declaração ritual.
- source_word: לַלֵּוִי
  choice: ao levita
  rationale: Mantém a categoria social explicitamente nomeada, sem restringi-la indevidamente aos sacerdotes.
- source_word: לַגֵּר
  choice: ao estrangeiro residente
  rationale: גֵּר designa um forasteiro que vive de modo estável entre Israel. “Estrangeiro residente” preserva melhor essa condição do que apenas “estrangeiro” ou “peregrino”.
- source_word: לַיָּתוֹם
  choice: ao órfão
  rationale: “Órfão” é a forma atual e amplamente compreensível para a categoria social vulnerável indicada por יָתוֹם.
- source_word: וְלָאַלְמָנָה
  choice: à viúva
  rationale: Equivalente direto, natural e preciso.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: conforme tudo o que me ordenaste
  rationale: Reproduzir literalmente “todo o teu mandamento que me ordenaste” seria pesado em português. A formulação conserva a abrangência e a relação com a ordem divina.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: Não transgredi nenhum dos teus mandamentos
  rationale: עבר מן significa ultrapassar ou violar. “Nenhum dos” explicita de maneira idiomática o alcance negativo diante do plural “mandamentos”.
- source_word: וְלֹא שָׁכָחְתִּי
  choice: nem me esqueci deles
  rationale: A referência aos mandamentos é recuperada naturalmente pelo pronome plural, preservando o paralelismo da declaração.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: A transliteração “Yahweh” preserva o nome pessoal da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido ritual de הַקֹּדֶשׁ
  choice: porção consagrada
  alternative: coisa santa; porção sagrada; dízimo
  rationale: A expressão se refere àquilo que foi separado como santo, no contexto à porção destinada aos beneficiários mencionados. Evita-se reduzir o termo simplesmente a “dízimo”, embora esse seja o referente contextual.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com tratamento misto deliberado: “você/seu” na moldura narrativa dirigida ao israelita e “tu/teus/ordenaste” dentro da declaração dirigida a Deus. A formulação evita arcaísmos desnecessários, preserva o caráter ritual e mantém concisão formal.'
