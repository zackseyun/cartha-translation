  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן הַ/טֶּ֖נֶא מִ/יָּדֶ֑/ךָ וְ/הִ֨נִּיח֔/וֹ לִ/פְנֵ֕י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: pt
  text: Então o sacerdote pegará o cesto da sua mão e o colocará diante do altar de Yahweh, seu Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: Informa a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O perfeito qal com conjunção, numa sequência ritual e legal, indica a etapa seguinte do procedimento. O futuro do indicativo é natural em português para essa prescrição, e “Então” explicita o valor sequencial.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Substantivo definido singular que designa o sacerdote oficiante.
- source_word: הַטֶּנֶא
  choice: o cesto
  rationale: טֶּנֶא designa o recipiente em que eram levadas as primícias; “cesto” é claro e corrente.
- source_word: מִיָּדֶךָ
  choice: da sua mão
  rationale: Mantém a imagem concreta da transferência do cesto das mãos do ofertante para o sacerdote e preserva o tratamento pessoal no singular.
- source_word: וְהִנִּיחוֹ
  choice: e o colocará
  rationale: O hifil de נוח significa aqui pôr ou colocar; o pronome retoma “o cesto”. “Colocará” evita acrescentar uma ênfase desnecessária em pô-lo no chão.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Equivalente espacial e cultual natural para indicar a posição em relação ao altar.
- source_word: מִזְבַּח
  choice: o altar
  rationale: Termo comum para o altar sacrificial, determinado pela expressão seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Conserva o sufixo de segunda pessoa masculina singular e o caráter direto da alocução da aliança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o tetragrama YHWH. “Yahweh” preserva o nome pessoal no texto principal; a forma tradicional por título é informada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O futuro apresenta a instrução ritual como etapa prescrita; a formulação mantém a imagem concreta do cesto recebido da mão do ofertante.
