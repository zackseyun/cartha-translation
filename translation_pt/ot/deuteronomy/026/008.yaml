  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: pt
  text: E Yahweh nos tirou do Egito com mão forte e braço estendido, com grande terror[a], com sinais e maravilhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com grande temor”, “com grande assombro” ou “com feitos que causam grande assombro”. O termo hebraico pode indicar medo, terror ou uma manifestação que produz reverência e assombro.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: nos tirou
  rationale: O hifil de יצא expressa fazer sair ou tirar para fora. “Nos tirou do Egito” é natural em português e preserva o motivo do êxodo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Com o verbo “tirou”, a contração “do” expressa naturalmente a saída de dentro do Egito.
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: Mantém de perto a imagem hebraica e comunica a ação poderosa de Deus sem explicá-la em excesso.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: e braço estendido
  rationale: Preserva a metáfora tradicional e transparente do poder divino em ação; a preposição “com” rege os dois membros coordenados.
- source_word: וּבְמֹרָא גָּדֹל
  choice: com grande terror
  rationale: מוֹרָא pode indicar medo, terror ou uma manifestação que causa assombro. “Grande terror” preserva a intensidade e a tensão lexical do contexto do êxodo.
- source_word: וּבְאֹתוֹת
  choice: com sinais
  rationale: Traduz diretamente אוֹתוֹת sem acrescentar “miraculosos”, ideia já sugerida pelo contexto.
- source_word: וּבְמֹפְתִים
  choice: e maravilhas
  rationale: Preserva a conhecida associação hebraica “sinais e maravilhas” e distingue o termo de “sinais”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz explicitamente o tetragrama. A transliteração “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Nuance de מוֹרָא na fórmula do êxodo
  choice: grande terror
  alternative: grande temor; grande assombro; feitos que causam grande assombro
  rationale: O substantivo admite medo ou terror e também aquilo que provoca reverência ou assombro. O texto principal mantém a força concreta de “terror”, enquanto a nota registra a ambiguidade sem a resolver por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva as imagens hebraicas “mão forte” e “braço estendido” e mantém a sequência enfática dos meios pelos quais ocorreu a libertação.
