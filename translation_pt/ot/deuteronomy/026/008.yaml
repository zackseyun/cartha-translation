  source_fidelity: 'A tradução acompanha de perto a cadeia de complementos introduzidos por בְ: Yahweh tira Israel do Egito por meio de «mão forte», «braço estendido», «grande terror», «sinais» e «maravilhas». «Nos tirou do Egito» reproduz adequadamente o hifil de יצא. «Grande terror» é uma opção lexical legítima para מוֹרָא גָּדוֹל e não elimina a ambiguidade, que é devidamente indicada na nota.'
  naturalness: O texto é claro, digno e natural em português moderno. A elipse de «com» em «com mão forte e braço estendido» é idiomática e conserva o paralelismo da expressão bíblica. A repetição posterior de «com» mantém a enumeração enfática sem tornar a frase pesada.
  terminology: «Yahweh» preserva de modo consistente o tetragrama. «Mão forte», «braço estendido» e «sinais e maravilhas» são equivalentes estabelecidos, transparentes e adequados ao registro. A nota lexical para «grande terror» registra alternativas pertinentes sem impor uma leitura doutrinária.
