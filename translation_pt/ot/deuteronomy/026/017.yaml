  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: pt
  text: Hoje você declarou Yahweh como seu Deus e que andará nos caminhos dele, guardará os seus estatutos, os seus mandamentos e as suas normas, e obedecerá à sua voz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “escutará a sua voz”; neste contexto, escutar implica obedecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֶאֱמַרְתָּ
  choice: você declarou
  rationale: O hifil incomum de אמר tem aqui força solene e pactual; “declarou” comunica uma afirmação formal sem recorrer a vocabulário arcaico.
- source_word: הַיּוֹם
  choice: Hoje
  rationale: Reproduz de modo natural e enfático a referência temporal do hebraico.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: que Yahweh é o seu Deus
  rationale: Expressa em português corrente a relação pactual indicada pela construção infinitiva, sem alterar sua substância.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: e que andará nos caminhos dele
  rationale: Mantém a metáfora bíblica de andar nos caminhos de Deus e explicita naturalmente sua dependência da declaração inicial.
- source_word: חֻקָּיו
  choice: os seus estatutos
  rationale: Termo jurídico-pactual tradicional e inteligível que distingue חֻקִּים dos demais termos legais da sequência.
- source_word: מִצְוֺתָיו
  choice: os seus mandamentos
  rationale: Preserva o registro formal e a referência às ordens divinas.
- source_word: מִשְׁפָּטָיו
  choice: as suas normas
  rationale: Neste contexto legal, “normas” comunica prescrições ou determinações jurídicas e evita o possível sentido exclusivamente judicial de “julgamentos” no português moderno.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: e obedecerá à sua voz
  rationale: שמע בקול designa escutar com resposta obediente; “obedecer à sua voz” preserva tanto a imagem da voz quanto a nuance pactual de obediência.
theological_decisions:
- issue: Fórmula de declaração pactual e agência de Israel
  choice: Apresentar o versículo como a declaração formal de Israel de que Yahweh é seu Deus, incluindo os compromissos decorrentes dessa declaração.
  alternative: 'Reproduzir mais rigidamente a série de infinitivos: “para ser o seu Deus, para andar... e para guardar...”'
  rationale: A formulação portuguesa torna clara a relação sintática entre o verbo solene הֶאֱמַרְתָּ e os compromissos infinitivos, sem acrescentar conteúdo teológico externo.
- issue: Sentido de ouvir a voz divina
  choice: “obedecerá à sua voz”
  alternative: “escutará a sua voz”
  rationale: O hebraico conserva lexicalmente a ideia de ouvir, mas a construção שמע בקול frequentemente implica obediência. A tradução escolhida torna essa força contextual explícita, enquanto a nota registra a formulação literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome singular “você” reflete o destinatário singular coletivo do hebraico. Mantém-se “andar nos caminhos” como metáfora pactual; “dele” evita a sequência potencialmente ambígua “seus caminhos”.
