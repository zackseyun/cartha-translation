revisions:
- from: Hoje você declarou que Yahweh é o seu Deus e que andará nos caminhos dele, guardará os seus estatutos, os seus mandamentos e as suas normas, e obedecerá à sua voz.[a]
  to: Hoje você declarou Yahweh como seu Deus e que andará nos caminhos dele, guardará os seus estatutos, os seus mandamentos e as suas normas, e obedecerá à sua voz.[a]
  rationale: A revisão limita-se a ajustar a expressão da declaração pactual, aproximando-a da sintaxe e da semântica do hebraico sem sacrificar a naturalidade. Mantêm-se as demais escolhas, inclusive a nota que assinala a tensão entre o sentido literal de «escutar» e a implicação contextual de obediência.
