source:
  edition: WLC
  text: וַֽ/יהוָ֞ה הֶאֱמִֽירְ/ךָ֣ הַ/יּ֗וֹם לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/לִ/שְׁמֹ֖ר כָּל מִצְוֺתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: pt
  text: 'E Yahweh declarou hoje que você será para ele um povo precioso[a], conforme lhe prometeu[b], e que guardará todos os seus mandamentos.


    [a] Ou: “um povo que é sua propriedade preciosa”. Hebraico: “um povo, uma propriedade preciosa”.

    [b] Ou: “conforme lhe falou”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um povo que é sua propriedade preciosa”. Hebraico: “um povo, uma propriedade preciosa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “conforme lhe falou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: E Yahweh
  rationale: Mantém o nome divino pessoal representado pelo tetragrama, em continuidade com a camada inglesa fornecida, e preserva a conjunção narrativa hebraica.
- source_word: הֶאֱמִירְךָ
  choice: declarou
  rationale: O raro hifil de אמר, no contexto pactual de Deuteronômio 26:17–18, indica uma declaração solene. “Declarou” comunica esse caráter performativo sem acrescentar explicitamente a ideia de eleição.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente direto e natural que preserva a imediaticidade da declaração da aliança.
- source_word: לִהְיוֹת לוֹ
  choice: que você será para ele
  rationale: Expressa em português natural a relação indicada pelo infinitivo hebraico e preserva tanto o pertencimento a Yahweh quanto a orientação resultante da declaração.
- source_word: לְעַם סְגֻלָּה
  choice: um povo precioso
  rationale: Conserva explicitamente עַם, “povo”, e transmite o valor especial de סְגֻלָּה. A nota registra a nuance mais concreta de posse ou propriedade.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: conforme lhe prometeu
  rationale: No contexto da aliança, o falar divino remete ao compromisso anteriormente assumido. “Prometeu” comunica essa força de modo idiomático, enquanto a tradução mais literal é preservada em nota.
- source_word: וְלִשְׁמֹר
  choice: e que guardará
  rationale: שׁמר, quando rege mandamentos, significa guardá-los ou observá-los. A coordenação com a oração anterior preserva a ligação sintática dos infinitivos.
- source_word: כָּל מִצְוֺתָיו
  choice: todos os seus mandamentos
  rationale: Tradução direta que mantém o registro da lei da aliança e a totalidade expressa por כָּל.
theological_decisions:
- issue: Força pactual do verbo raro הֶאֱמִיר
  choice: declaração divina solene sobre a condição de Israel
  alternative: linguagem explícita de escolha ou eleição
  rationale: “Declarou” preserva o ato formal da aliança sem inserir uma formulação doutrinária mais específica do que a redação hebraica exige.
- issue: Relação entre a condição de povo precioso e a guarda dos mandamentos
  choice: manter as duas afirmações coordenadas sob a declaração divina
  alternative: explicitar a guarda dos mandamentos como condição causal para pertencer a Yahweh
  rationale: O hebraico coordena os infinitivos, mas não explicita aqui uma relação causal. A tradução evita resolver essa tensão teológica além do texto.
translation_notes:
  register: Português moderno, claro e digno, com “você” singular para refletir o tratamento coletivo de Israel no hebraico. A formulação evita arcaísmos como “avocar” e conserva o nome divino Yahweh.
