  source_fidelity: 'A tradução preserva adequadamente a estrutura da declaração pactual: Yahweh declara, no presente dia, que o destinatário coletivo lhe será um povo precioso e que guardará todos os seus mandamentos. “Declarou”, “hoje”, “povo precioso” e “guardará” representam bem os termos hebraicos e sua coordenação. “Conforme lhe prometeu” é uma explicitação contextual aceitável de כַּאֲשֶׁר דִּבֶּר לָךְ, cuja alternativa mais literal foi devidamente anotada.'
  naturalness: O texto é claro, moderno e fluente para leitores brasileiros e internacionais. O singular “você” mantém deliberadamente o tratamento coletivo singular do hebraico, conforme a nota de registro do projeto, sem gerar ambiguidade relevante no versículo.
  terminology: “Yahweh” está coerente com a opção editorial fornecida. “Povo precioso” conserva a identidade corporativa expressa por עַם e comunica o valor de סְגֻלָּה; a nota registra de modo útil a nuance de posse. “Mandamentos” mantém o registro jurídico-pactual de מִצְוֺת.
