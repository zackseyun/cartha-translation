  source_fidelity: 'O texto preserva adequadamente a sequência e o sentido do hebraico: a transição ritual (“E agora”), a partícula de apresentação (“eis que”), a oferta das primícias, o reconhecimento de Yahweh como doador, a colocação da oferta diante dele e a prostração. A forma instrutiva em português para os dois verbos finais é apropriada ao contexto procedimental.'
