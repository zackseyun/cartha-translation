  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: pt
  text: E agora, eis que trouxe as primícias do fruto do solo[a] que tu me deste, ó Yahweh. Então as colocarás diante de Yahweh, teu Deus, e te prostrarás[b] diante de Yahweh, teu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “a primeira porção do produto da terra”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico se refere especificamente ao ato de curvar-se ou prostrar-se; “adorarás” é uma tradução interpretativa mais ampla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Mantém a ligação discursiva entre a confissão recitada e o ato presente de apresentar a oferta.
- source_word: הִנֵּה
  choice: eis que
  rationale: Conserva a função dêitica de chamar a atenção para a oferta, em registro digno e ainda corrente.
- source_word: הֵבֵאתִי
  choice: trouxe
  rationale: Expressa naturalmente em português a ação concluída indicada pelo perfeito hebraico no contexto da declaração ritual.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: as primícias do fruto do solo
  rationale: Emprega o termo português reconhecível para a primeira porção oferecida, preservando também a relação explícita com o fruto produzido pelo solo.
- source_word: הָאֲדָמָה
  choice: solo
  rationale: Destaca a terra cultivável de onde provém a produção agrícola, sem deslocar o sentido para o território nacional.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: que tu me deste
  rationale: Mantém a oração relativa e o reconhecimento direto de que a produção é dádiva de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְהִנַּחְתּוֹ
  choice: Então as colocarás
  rationale: No contexto procedimental, a forma verbal tem força instrutiva. O pronome plural concorda naturalmente em português com 'primícias', embora o hebraico retome a oferta com sufixo singular.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva tanto a ideia espacial quanto a apresentação cultual na presença de Deus.
- source_word: אֱלֹהֶיךָ
  choice: teu Deus
  rationale: Mantém a designação pactual na segunda pessoa do singular e concorda com o tratamento por 'tu'.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: e te prostrarás
  rationale: Representa o gesto corporal específico de inclinar-se até o chão, sem reduzi-lo ao conceito mais amplo de adoração.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz diretamente o tetragrama; 'Yahweh' preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de וְהִשְׁתַּחֲוִיתָ
  choice: te prostrarás
  alternative: adorarás
  rationale: A tradução escolhida conserva a ação corporal expressa pelo verbo. A adoração está implicada no contexto, mas o termo mais amplo poderia ocultar a imagem concreta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento uniforme por “tu”, comum no registro bíblico e inteligível para leitores brasileiros. “Eis que” preserva a solenidade ritual sem recorrer a formulações obscuras. Os marcadores foram posicionados junto às expressões a que as notas realmente se referem.
