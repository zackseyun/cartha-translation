base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: pt
  text: 'Você irá ao sacerdote que estiver exercendo o ofício naqueles dias[a] e lhe dirá: “Hoje declaro[b] a Yahweh, seu Deus, que entrei na terra que Yahweh jurou aos nossos pais[c] para nos dar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “que estará naqueles dias”, isto é, o sacerdote que então estiver servindo ou exercendo o ofício.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Hoje declarei”. A forma hebraica provavelmente tem sentido performativo: a pessoa faz a declaração ao pronunciá-la.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “nossos antepassados”. O hebraico diz “nossos pais” e, neste contexto, provavelmente se refere em especial aos patriarcas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Você irá
  rationale: O verbo בוא pode indicar vir, ir ou entrar conforme o ponto de vista. Aqui, o movimento é em direção ao sacerdote; “irá” é natural em português e preserva a força instrutiva da sequência legal.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כֹּהֵן neste contexto ritual.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: que estiver exercendo o ofício naqueles dias
  rationale: A formulação literal é “que estiver naqueles dias”. No contexto, refere-se ao sacerdote que então estiver servindo; “exercendo o ofício” explicita esse sentido sem identificar um cargo mais específico do que o hebraico permite.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: e lhe dirá
  rationale: Mantém a construção coordenada e a força de instrução futura própria do texto legal.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: Hoje declaro
  rationale: 'O perfeito hebraico pode ter função performativa: o ofertante realiza a declaração ao pronunciá-la. O presente português comunica isso com naturalidade, enquanto a nota conserva a alternativa formal.'
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: a Yahweh, seu Deus
  rationale: 'Preserva o nome divino e a segunda pessoa singular: o ofertante fala ao sacerdote e chama Yahweh de “seu Deus”, sem harmonizar para “nosso Deus”.'
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: que cheguei à terra
  rationale: “Cheguei à terra” expressa a chegada já realizada e com relevância presente, sem forçar a imagem mais específica de entrada física.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: que Yahweh jurou
  rationale: Preserva de modo direto a linguagem de juramento vinculada à promessa da terra.
- source_word: לַאֲבֹתֵינוּ
  choice: aos nossos pais
  rationale: Mantém o substantivo masculino do hebraico e sua provável referência aos pais patriarcais no contexto deuteronômico; a alternativa mais abrangente é registrada em nota.
- source_word: לָתֶת לָנוּ
  choice: que nos daria
  rationale: A oração portuguesa liga naturalmente o conteúdo do juramento à dádiva prometida e preserva tanto o destinatário plural quanto a terra como dom.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Referência de לַאֲבֹתֵינוּ
  choice: aos nossos pais
  alternative: aos nossos antepassados
  rationale: Embora “antepassados” seja possível, o masculino explícito e o contexto da promessa da terra favorecem a referência aos pais patriarcais. A tradução mantém essa possibilidade sem tornar a expressão mais genérica.
- issue: Valor verbal de הִגַּדְתִּי
  choice: Hoje declaro
  alternative: Hoje declarei
  rationale: A forma perfeita admite leitura formal de ação concluída, mas, nesta fala ritual, provavelmente funciona de modo performativo. A alternativa permanece documentada para preservar a tensão gramatical.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro do indicativo preserva o tom de instrução legal; “lhe dirá” evita repetição pesada. As notas mantêm as ambiguidades lexical, verbal e referencial relevantes.
