base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: pt
  text: Ele nos trouxe a este lugar e nos deu esta terra, uma terra que mana leite e mel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “uma terra abundante em leite e mel”; a expressão hebraica retrata fertilidade e abundância.
    reason: lexical_alternative
  - marker: b
    text: Em alguns contextos, “mel” pode incluir xaropes, como o xarope de tâmaras, e não somente mel de abelhas.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: Ele nos trouxe
  rationale: O hifil de בוא com sufixo de primeira pessoa do plural expressa movimento causativo; “nos trouxe” comunica isso de modo natural.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: a este lugar
  rationale: A preposição אֶל indica movimento em direção ao destino, e הַמָּקוֹם הַזֶּה significa literalmente “este lugar”.
- source_word: וַיִּתֶּן לָנוּ
  choice: e nos deu
  rationale: נתן com לָנוּ exprime dar algo a nós; “nos deu” é direto e idiomático.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: Neste contexto, אֶרֶץ designa o território dado a Israel; “terra” preserva o sentido contextual e a formulação tradicional.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: uma terra que mana leite e mel
  rationale: A construção participial retrata a terra como abundante e fértil. “Mana leite e mel” conserva a imagem hebraica em português natural e digno.
- source_word: דְבָשׁ
  choice: mel
  rationale: דְבָשׁ normalmente significa “mel”, embora em certos contextos possa abranger xaropes de frutas, como o de tâmaras; essa possibilidade fica registrada em nota.
theological_decisions:
- issue: Referência ao sujeito divino na confissão histórica
  choice: Ele
  alternative: O SENHOR
  rationale: Os verbos hebraicos estão na terceira pessoa do singular, sem sujeito nominal explícito neste versículo, retomando o SENHOR do contexto anterior. O pronome preserva a coesão e evita inserir aqui o nome divino.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a metáfora hebraica tradicional “mana leite e mel”, sem explicá-la no corpo do versículo. Os marcadores seguem imediatamente a expressão a que se referem.
