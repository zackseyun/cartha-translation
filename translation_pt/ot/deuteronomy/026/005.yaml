base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: pt
  text: 'Você responderá e dirá diante de Yahweh, seu Deus: “Meu pai era um arameu errante[a]. Ele desceu ao Egito e ali viveu como estrangeiro, com pouca gente; e ali se tornou uma nação grande, poderosa e numerosa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu pai era um arameu que estava perecendo”. O particípio hebraico pode ter o sentido de “errante” ou de “que estava perecendo”.'
    reason: Preserva a ambiguidade lexical genuína de אֹבֵד.
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: você declarará
  rationale: A fórmula hebraica introduz uma recitação litúrgica formal. Em português atual, “declarará” comunica naturalmente essa função sem a estranheza de “responderá e dirá”.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: diante de Yahweh, seu Deus
  rationale: “Diante de” reproduz naturalmente לִפְנֵי, e “Yahweh” translitera o nome divino.
- source_word: אֲרַמִּי אֹבֵד אָבִי
  choice: Meu pai era um arameu errante
  rationale: A leitura toma “meu pai” como sujeito e אֹבֵד como particípio. “Errante” se ajusta ao contexto migratório, enquanto a possibilidade lexical “que estava perecendo” é preservada em nota.
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: Ele desceu ao Egito
  rationale: Mantém o verbo direcional hebraico e o modo tradicional de descrever a ida ao Egito.
- source_word: וַיָּגָר שָׁם
  choice: ali viveu como estrangeiro
  rationale: גור indica residência como estrangeiro ou forasteiro; a formulação é mais clara no português moderno do que “peregrinou” ou “morou temporariamente”.
- source_word: בִּמְתֵי מְעָט
  choice: com pouca gente
  rationale: Expressa de forma idiomática que o grupo era pequeno, sem restringi-lo indevidamente a homens adultos.
- source_word: וַיְהִי שָׁם לְגוֹי גָּדוֹל עָצוּם וָרָב
  choice: mas ali se tornou uma nação grande, poderosa e numerosa
  rationale: Preserva o sujeito singular representativo e a tríade que destaca grandeza, força e número. “Mas” explicita o contraste contextual implícito entre o pequeno grupo inicial e a grande nação resultante.
theological_decisions:
- issue: Sentido de אֲרַמִּי אֹבֵד אָבִי
  choice: Meu pai era um arameu errante
  alternative: Meu pai era um arameu que estava perecendo; Um arameu procurou destruir meu pai
  rationale: Segundo a vocalização massorética, a construção mais direta toma “meu pai” como sujeito e אֹבֵד como particípio. “Errante” combina com a síntese da migração ancestral. Como אֹבֵד também pode indicar alguém que perece, essa ambiguidade legítima é registrada em nota. A leitura com o arameu como agente destruidor exige uma interpretação menos direta da sintaxe.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o caráter de confissão litúrgica sem reproduzir mecanicamente uma fórmula hebraica pouco natural em português.
