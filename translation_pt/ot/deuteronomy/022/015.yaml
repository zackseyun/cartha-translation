  text: then the young woman’s father and her mother shall take and bring out the evidence of the young woman’s virginity to the elders of the city at the gate[a].
translation:
  language: pt
  text: Então o pai da jovem e a mãe dela tomarão as evidências da virgindade da jovem e as apresentarão aos anciãos da cidade, à porta da cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as virgindades da jovem”, expressão idiomática que se refere a evidências, sinais ou objetos apresentados como prova de virgindade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: pegarão
  rationale: O perfeito qal com waw, nesta sequência legal, tem valor procedimental futuro. O plural em português ajusta a concordância ao sujeito composto, o pai e a mãe.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: o pai e a mãe da jovem
  rationale: נַעֲרָה designa aqui uma jovem em idade de casar. “Jovem” é atual e evita tanto o sentido infantil de “menina” quanto o tom arcaico de “donzela”.
- source_word: וְהוֹצִיאוּ
  choice: apresentarão
  rationale: O hifil de יצא significa fazer sair ou trazer para fora; no contexto judicial, trata-se de apresentar formalmente as provas perante os anciãos.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: as provas da virgindade da jovem
  rationale: A expressão literalmente plural, “as virgindades da jovem”, funciona como idioma para os sinais ou objetos apresentados como prova de virgindade. A formulação escolhida comunica com clareza o sentido jurídico.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: aos anciãos da cidade
  rationale: אֶל indica direção para o corpo de autoridades locais; “aos anciãos da cidade” preserva essa relação de modo natural.
- source_word: הַשַּׁעְרָה
  choice: junto ao portão
  rationale: A terminação direcional pode significar “para o portão”, mas o portão da cidade é também o local do julgamento. “Junto ao portão” expressa naturalmente esse lugar sem acrescentar “da cidade”, já implícito no contexto.
