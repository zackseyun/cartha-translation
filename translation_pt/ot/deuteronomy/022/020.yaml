  text: וְ/אִם אֱמֶ֣ת הָיָ֔ה הַ/דָּבָ֖ר הַ/זֶּ֑ה לֹא נִמְצְא֥וּ בְתוּלִ֖ים ל/נער־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/020.yaml
  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: pt
  text: Mas, se essa alegação for verdadeira e não forem encontradas provas de virgindade da jovem,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sinais de virgindade». O hebraico usa בְּתוּלִים, literalmente «virgindade» ou «sinais/provas de virgindade», no contexto de um antigo costume jurídico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A combinação da conjunção com a partícula condicional contrasta este caso com a hipótese anterior; “Mas, se” reproduz esse fluxo com naturalidade.
- source_word: אֱמֶת הָיָה
  choice: for verdadeiro
  rationale: אֱמֶת funciona como predicativo, e o perfeito הָיָה é expresso naturalmente no português de uma condição jurídica geral pelo futuro do subjuntivo.
- source_word: הַדָּבָר הַזֶּה
  choice: esse fato
  rationale: דָּבָר é amplo, mas aqui se refere à alegação ou ao caso recém-mencionado. “Esse fato” mantém a referência contextual sem especificar além do hebraico.
- source_word: לֹא נִמְצְאוּ
  choice: não forem encontradas
  rationale: O verbo hebraico está no plural em concordância com בְּתוּלִים; a formulação portuguesa conserva o plural por traduzir o termo como “provas”.
- source_word: בְּתוּלִים
  choice: provas de virgindade
  rationale: No contexto do antigo procedimento jurídico, o plural designa sinais ou evidências de virgindade. “Provas de virgindade” comunica o sentido contextual em linguagem moderna.
- source_word: לַנַּעֲרָ
  choice: da jovem
  rationale: נַעֲרָה indica uma jovem em idade de casar. Embora ל possa ser literalmente “para”, em português “provas de virgindade da jovem” é a construção mais natural neste contexto.
