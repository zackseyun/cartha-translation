    issue: Construção redundante na identificação dos dois condenados
    rationale: '“Ambos morrerão — tanto o homem ... como a mulher” duplica a estrutura correlativa. “Ambos morrerão: o homem ... e a mulher” é mais natural e conserva a precisão jurídica.'
  - severity: low
    issue: Nota a simplifica excessivamente o valor formal de בְעֻלַת בַּעַל
    rationale: “Uma mulher que tem marido” comunica o sentido, mas não registra a construção matrimonial passiva/idiomática. “Casada com um marido” mantém, como alternativa formal, a ênfase da expressão.
  - severity: low
    issue: Nota b inclui uma paráfrase que não é alternativa tradutória imediata
    rationale: “Serão condenados à morte” descreve um procedimento judicial, enquanto o hebraico diz que ambos morrerão. A nota pode esclarecer a pena legal e mencionar apenas “serão mortos” como explicitação possível.
