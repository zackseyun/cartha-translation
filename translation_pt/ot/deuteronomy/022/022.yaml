review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite corretamente os elementos centrais do hebraico: descoberta do ato, relação sexual, condição matrimonial da mulher, pena aplicada a ambos e a fórmula de remoção do mal de Israel. “Tendo relações sexuais” explicita adequadamente o eufemismo שֹׁכֵב עִם em português moderno.'
  naturalness: O texto é claro, mas “ambos morrerão — tanto o homem ... como a mulher” é redundante e menos fluente em português jurídico. Uma enumeração direta após dois-pontos preserva a repetição enfática do hebraico com melhor legibilidade.
  terminology: “Mulher casada”, “morrerão” e “extirpará o mal” são escolhas adequadas. A nota a deve caracterizar com mais precisão a formulação hebraica, e a nota b não deve apresentar “serão condenados à morte” como alternativa tradutória direta, pois isso introduz o ato de condenação, ausente da frase hebraica.
  issues:
