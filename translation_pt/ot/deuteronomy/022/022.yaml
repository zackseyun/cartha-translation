base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: pt
  text: 'Se um homem for encontrado tendo relações sexuais com uma mulher casada[a], ambos morrerão: o homem que teve relações com a mulher e a mulher[b]. Assim, você extirpará o mal de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais literal, “uma mulher casada com um marido”.
    reason: lexical_alternative
  - marker: b
    text: “Morrerão” expressa aqui a pena de morte estabelecida pela lei; também se pode traduzir “serão mortos”.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: for encontrado
  rationale: O nifal de מצא indica que o ato é descoberto. “For encontrado” mantém a forma passiva e se ajusta ao registro jurídico.
- source_word: שֹׁכֵב עִם
  choice: tendo relações sexuais com
  rationale: A expressão hebraica é um eufemismo inequívoco para relação sexual. Esta formulação comunica o sentido com clareza no português atual, sem o tom coloquial de “dormindo com” nem a possível leitura meramente literal de “deitado com”.
- source_word: בְעֻלַת בַּעַל
  choice: uma mulher casada
  rationale: A expressão designa uma mulher vinculada a um marido pelo casamento. “Mulher casada” é a forma natural em português; a construção mais literal é registrada em nota.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: ambos morrerão
  rationale: No contexto legal, a forma verbal prescreve a pena de morte. “Morrerão” acompanha de perto a redação hebraica sem acrescentar à linha principal a formulação causativa “serão mortos”.
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה וְהָאִשָּׁה
  choice: tanto o homem que teve relações com a mulher como a mulher
  rationale: A repetição preserva a precisão e a ênfase jurídica do hebraico quanto às duas pessoas abrangidas pela sentença.
- source_word: וּבִעַרְתָּ הָרָע
  choice: Assim, você extirpará o mal
  rationale: בער, nesta fórmula jurídica de Deuteronômio, expressa a remoção decisiva do mal da comunidade. “Extirpar” conserva essa força melhor que o mais neutro “retirar”.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: A preposição indica a esfera da qual o mal deve ser removido; “de Israel” reproduz a concisão do hebraico.
theological_decisions:
- issue: Sentido da expressão marital בְעֻלַת בַּעַל
  choice: uma mulher casada
  alternative: uma mulher que tem marido
  rationale: A tradução principal comunica naturalmente o vínculo matrimonial sem introduzir linguagem de propriedade. A nota conserva a forma mais literal e a ênfase hebraica na existência de um marido.
- issue: Explicitação da pena judicial
  choice: ambos morrerão
  alternative: ambos serão mortos / ambos serão condenados à morte
  rationale: O contexto legal estabelece uma pena capital, mas a redação hebraica diz literalmente que ambos morrerão. A tradução mantém essa forma, e a nota esclarece sua força jurídica sem resolver a expressão por expansão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “você” para o destinatário coletivo singular representado por Israel, evitando o arcaísmo de “tu” com flexão futura. A expressão sexual é tornada semanticamente explícita para evitar uma leitura literal equivocada, enquanto as notas preservam particularidades formais relevantes do hebraico.
