  source_fidelity: A tradução representa com precisão a construção casuística כִּי יִהְיֶה como “Se houver”, preserva a caracterização da mulher como jovem e virgem, e traduz adequadamente מְאֹרָשָׂה לְאִישׁ como um compromisso matrimonial formal. “Outro homem” é uma explicitação contextual legítima para distinguir o homem mencionado daquele a quem ela está prometida. “Se deitar com ela” mantém, sem acrescentar coerção ou consentimento, o eufemismo sexual não especificado do hebraico.
