  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: pt
  text: Se houver uma jovem virgem, prometida em casamento a um homem,[a] e outro homem a encontrar na cidade e se deitar com ela,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, formalmente comprometida a casar-se com ele; esse compromisso era juridicamente vinculante.
    reason: Esclarece que o termo hebraico designa um compromisso matrimonial formal, mais vinculante que muitos noivados modernos.
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Se houver
  rationale: Introduz de modo natural uma hipótese de legislação casuística, preservando a força condicional do hebraico.
- source_word: נער
  choice: uma jovem
  rationale: O texto consonantal apresenta נער, mas a tradição de leitura e a concordância feminina do contexto indicam נַעֲרָה, uma mulher jovem em idade de casar. “Jovem” é atual e evita tanto o tom arcaico de “donzela” quanto a possível ideia de pouca idade em “menina”.
- source_word: בְתוּלָה
  choice: virgem
  rationale: Mantém explicitamente a condição indicada pelo termo hebraico e sua relevância jurídica no contexto.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: prometida em casamento a um homem
  rationale: Comunica em português corrente um compromisso matrimonial formal e juridicamente vinculante, mais forte que um noivado informal moderno.
- source_word: וּמְצָאָהּ אִישׁ
  choice: e outro homem a encontrar
  rationale: O hebraico diz literalmente “e um homem a encontrar”; “outro” esclarece naturalmente que não se trata do homem a quem ela está prometida, sem alterar o sentido contextual.
- source_word: בָּעִיר
  choice: na cidade
  rationale: Equivalente direto e natural, preservando a localização relevante para o desenvolvimento jurídico do versículo seguinte.
- source_word: וְשָׁכַב עִמָּהּ
  choice: e se deitar com ela
  rationale: Preserva o eufemismo sexual do hebraico e não acrescenta uma especificação de consentimento ou coerção ausente nesta oração.
theological_decisions:
- issue: Se o ato sexual deve ser explicitamente caracterizado como coercitivo neste versículo
  choice: Traduzir de forma não especificada como “se deitar com ela”
  alternative: “estuprá-la” ou “forçá-la a se deitar com ele”
  rationale: A formulação deste versículo não contém, por si só, um verbo que especifique coerção. A tradução mantém a tensão e deixa que as distinções jurídicas do contexto sejam expressas pelos versículos adjacentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “Se houver” conserva o estilo jurídico; “se deitar com ela” mantém o eufemismo do original. O marcador [a] foi colocado imediatamente após a expressão que explica.
