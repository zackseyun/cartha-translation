  text: וְ/כֵ֧ן תַּעֲשֶׂ֣ה לַ/חֲמֹר֗/וֹ וְ/כֵ֣ן תַּעֲשֶׂה֮ לְ/שִׂמְלָת/וֹ֒ וְ/כֵ֣ן תַּעֲשֶׂ֜ה לְ/כָל אֲבֵדַ֥ת אָחִ֛י/ךָ אֲשֶׁר תֹּאבַ֥ד מִמֶּ֖/נּוּ וּ/מְצָאתָ֑/הּ לֹ֥א תוּכַ֖ל לְ/הִתְעַלֵּֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: pt
  text: Assim também você fará com o jumento dele; assim também fará com a capa dele; e assim fará com qualquer objeto de seu irmão que se perder e que você encontrar. Você não poderá ignorá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “você não poderá se esconder” ou “não poderá fingir que não viu”.
    reason: Preserva a imagem lexical de לְהִתְעַלֵּם, cujo sentido reflexivo sugere ocultar-se ou esquivar-se, além do valor contextual de ignorar.
lexical_decisions:
- source_word: וְכֵן
  choice: Assim também
  rationale: Expressa a continuidade com o versículo anterior e conserva a repetição característica da formulação legal hebraica.
- source_word: תַּעֲשֶׂה
  choice: você fará
  rationale: O imperfeito tem força diretiva neste contexto jurídico. O futuro em português mantém o tom de determinação legal sem recorrer a uma forma arcaica.
- source_word: לַחֲמֹרוֹ
  choice: com o jumento dele
  rationale: A preposição introduz aquilo a que se deve aplicar a mesma conduta. “Jumento” é corrente e preciso para חֲמוֹר.
- source_word: לְשִׂמְלָתוֹ
  choice: com a capa dele
  rationale: שִׂמְלָה pode indicar uma veste, em especial uma peça exterior; “capa” oferece aqui uma imagem concreta e natural.
- source_word: לְכָל אֲבֵדַת אָחִיךָ
  choice: com qualquer objeto de seu irmão que se perder
  rationale: A expressão amplia a norma para toda espécie de objeto perdido. “Objeto” evita a rigidez de “coisa perdida”, e “que se perder” conserva a forma não agentiva do hebraico.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Preserva o termo masculino singular de parentesco e sua moldura comunitária no texto de Deuteronômio, sem substituí-lo por uma explicação interpretativa.
- source_word: וּמְצָאתָהּ
  choice: e que você encontrar
  rationale: Transmite diretamente a ação subsequente de encontrar o objeto, com referência clara ao antecedente.
- source_word: לֹא תוּכַל
  choice: você não poderá
  rationale: Mantém a forma do idioma hebraico e, no contexto legal, comunica uma proibição, não mera incapacidade física.
- source_word: לְהִתְעַלֵּם
  choice: ignorá-lo
  rationale: Comunica em português atual o efeito prático do hitpael, que literalmente evoca esconder-se ou furtar-se à responsabilidade; essa imagem é preservada em nota.
theological_decisions:
- issue: Sentido comunitário de אָחִיךָ
  choice: seu irmão
  alternative: seu compatriota israelita; seu parente
  rationale: Embora o termo possa funcionar no âmbito da comunidade da aliança, a tradução retém a imagem explícita de parentesco empregada pelo texto, sem ampliar ou restringir silenciosamente sua referência.
- issue: Força de לֹא תוּכַל לְהִתְעַלֵּם
  choice: Você não poderá ignorá-lo
  alternative: Você não poderá se esconder; você não deverá fingir que não viu
  rationale: No contexto jurídico, a expressão proíbe que alguém se esquive da responsabilidade. A tradução principal apresenta esse sentido de modo natural, enquanto a nota conserva a metáfora mais literal e sua tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “assim também fará” foi mantida para refletir o estilo jurídico enfático do hebraico. O pronome “você” torna explícito o destinatário singular e evita formas verbais percebidas como arcaicas por muitos leitores.
