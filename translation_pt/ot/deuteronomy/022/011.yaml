  text: You shall not wear cloth made of wool and linen together[a].
translation:
  language: pt
  text: Não use roupa feita de lã e linho misturados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “shaatnez, lã e linho juntos”. O raro termo “shaatnez” designa um material feito dessa combinação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: Não use
  rationale: A negação com o imperfeito verbal em contexto legal expressa uma proibição direta; “não use” é natural e claro em português.
- source_word: שַׁעַטְנֵז
  choice: roupa feita de ... misturados
  rationale: O termo raro designa um material misto proibido, especificado em seguida como lã e linho; a tradução explicita o sentido sem depender de transliteração.
- source_word: צֶמֶר
  choice: lã
  rationale: Equivalente comum e preciso no contexto de tecidos.
- source_word: וּפִשְׁתִּים
  choice: e linho
  rationale: Embora o substantivo possa indicar a planta do linho, no contexto de vestuário refere-se naturalmente à fibra ou ao tecido de linho.
- source_word: יַחְדָּו
  choice: misturados
  rationale: Expressa que lã e linho estão combinados numa mesma roupa, de modo mais explícito e idiomático que apenas “juntos”.
