source:
  edition: WLC
  text: ו/ל/נער לֹא תַעֲשֶׂ֣ה דָבָ֔ר אֵ֥ין ל/נער חֵ֣טְא מָ֑וֶת כִּ֡י כַּ/אֲשֶׁר֩ יָק֨וּם אִ֤ישׁ עַל רֵעֵ֨/הוּ֙ וּ/רְצָח֣/וֹ נֶ֔פֶשׁ כֵּ֖ן הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: pt
  text: Mas não faça nada à jovem; ela não cometeu pecado que mereça a morte. Pois este caso é como quando um homem se levanta contra o seu próximo e o assassina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “assim é este caso”. Isto é, o caso é comparável ao assassinato de alguém mediante agressão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: Mas ... à jovem
  rationale: O ו marca o contraste com a pena aplicada ao homem no versículo anterior; נַעַר, conforme a vocalização massorética e o contexto, refere-se à jovem mencionada no caso legal.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: não faça nada
  rationale: Preserva a proibição jurídica absoluta e o tratamento na segunda pessoa do singular; o complemento 'à jovem' já aparece no início da oração.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: ela não cometeu pecado que mereça a morte
  rationale: Expressa em português natural o idioma hebraico literalmente próximo de 'não há para a jovem pecado de morte', mantendo seu sentido jurídico de culpa passível da pena capital.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: como quando um homem se levanta contra o seu próximo
  rationale: Mantém a estrutura comparativa e a imagem concreta do hebraico sem reduzir desde logo a expressão ao verbo mais interpretativo 'atacar'.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: e o assassina
  rationale: רצח indica homicídio ilícito; o sufixo pronominal aponta para o próximo como vítima. נֶפֶשׁ é idiomático nessa construção e não requer tradução separada no corpo do texto.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: este caso é como
  rationale: Reformula naturalmente a conclusão hebraica, literalmente 'assim é este assunto', como a comparação jurídica que ela estabelece.
theological_decisions:
- issue: Natureza da inocência da jovem na analogia jurídica
  choice: A jovem não cometeu pecado que mereça a morte.
  alternative: A jovem não tem culpa de nenhum crime capital.
  rationale: A formulação preserva a linguagem moral de חֵטְא e, ao mesmo tempo, a força jurídica de מָוֶת, sem ampliar a declaração para uma alegação de inocência moral absoluta em todos os sentidos.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Conserva-se a imagem hebraica 'se levanta contra' e esclarece-se em nota a forma literal da conclusão comparativa.
