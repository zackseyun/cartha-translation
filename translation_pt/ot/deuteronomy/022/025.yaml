base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: pt
  text: Mas, se, em campo aberto, um homem encontrar uma jovem prometida em casamento, agarrá-la[a] e se deitar com ela, somente o homem que se deitou com ela deverá morrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dominá-la” ou “violentá-la”. O hebraico usa o verbo “agarrá-la”, e a lei no contexto deixa claro que o ato ocorre sem o consentimento dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz um caso condicional em contraste com a situação anterior, preservando a força adversativa do contexto.
- source_word: בַּשָּׂדֶה
  choice: em campo aberto
  rationale: שׂדה significa “campo”; “campo aberto” torna natural em português a situação de isolamento relevante para a distinção jurídica do contexto.
- source_word: יִמְצָא הָאִישׁ
  choice: um homem encontrar
  rationale: Mantém o sentido direto de מצא e apresenta naturalmente em português o homem envolvido no caso jurídico.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: uma jovem prometida em casamento
  rationale: “Jovem” comunica a referência feminina sem tom arcaico ou infantil; “prometida em casamento” expressa o vínculo legal de ארשׂ com mais precisão do que o uso moderno e informal de “noiva” ou “comprometida”.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: agarrá-la
  rationale: O hifil de חזק com ב indica que o homem toma a jovem à força. “Agarrá-la” preserva a ação coercitiva sem substituir o verbo hebraico por uma explicitação interpretativa completa.
- source_word: וְשָׁכַב עִמָּהּ
  choice: se deitar com ela
  rationale: Reproduz com dignidade e clareza o eufemismo hebraico convencional para relação sexual.
- source_word: וּמֵת
  choice: deverá morrer
  rationale: No contexto legal, a forma verbal enuncia a consequência judicial; “deverá morrer” comunica seu caráter prescritivo em português atual.
- source_word: לְבַדּוֹ
  choice: somente o homem
  rationale: 'Expressa a exclusividade da pena: ela recai apenas sobre o homem, não sobre a jovem.'
theological_decisions:
- issue: Se a violência sexual deve ser explicitada no texto principal para além do conteúdo lexical de חזק
  choice: Manter “agarrá-la” no texto e esclarecer em nota que o ato é coercitivo.
  alternative: Traduzir diretamente por “violentá-la”, “estuprá-la” ou “forçá-la”.
  rationale: O contexto jurídico deixa claro que a jovem não consentiu, mas חזק significa propriamente agarrar, apoderar-se ou dominar, não sendo um verbo técnico que por si só signifique “estuprar”. A formulação escolhida conserva a transparência lexical e a nota impede que a coerção seja obscurecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi condensada para evitar a repetição pouco natural de “o homem”, sem perder a identificação do único culpado ao final. O marcador [a] foi colocado junto ao verbo a que a nota se refere.
