  text: וְ/שָׂ֥ם לָ/הּ֙ עֲלִילֹ֣ת דְּבָרִ֔ים וְ/הוֹצִ֥יא עָלֶ֖י/הָ שֵׁ֣ם רָ֑ע וְ/אָמַ֗ר אֶת הָ/אִשָּׁ֤ה הַ/זֹּאת֙ לָקַ֔חְתִּי וָ/אֶקְרַ֣ב אֵלֶ֔י/הָ וְ/לֹא מָצָ֥אתִי לָ֖/הּ בְּתוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: pt
  text: 'e lhe atribuir acusações difamatórias, dando-lhe má fama[a], e disser: “Tomei esta mulher por esposa e, quando me aproximei dela[b], não encontrei nela sinais de virgindade[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fazendo sair sobre ela um mau nome”; isto é, difamando-a.
    reason: lexical_alternative
  - marker: b
    text: “Aproximei-me dela” é um eufemismo hebraico para ter relações sexuais.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “não encontrei virgindade para ela”. Neste contexto, a expressão se refere aos sinais ou às provas de virgindade mencionados nos versículos seguintes.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: lhe atribuir acusações difamatórias
  rationale: A construção idiomática descreve acusações lançadas contra a mulher. “Difamatórias” comunica sua força prejudicial sem inserir no texto principal, de modo categórico, a ideia de falsidade, que o contexto jurídico poderá comprovar.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: dando-lhe má fama
  rationale: Preserva a imagem hebraica do “mau nome” em formulação portuguesa natural e indica dano à reputação.
- source_word: אֶת הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: Tomei esta mulher por esposa
  rationale: לקח, neste contexto matrimonial, significa tomar uma mulher como esposa. A expansão “por esposa” torna inequívoco o sentido em português sem apagar o tom demonstrativo e distanciado de “esta mulher”.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: quando me aproximei dela
  rationale: Mantém o eufemismo discreto do hebraico para a relação sexual; a nota esclarece o sentido contextual.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: não encontrei nela sinais de virgindade
  rationale: O plural בְּתוּלִים, neste procedimento legal e à luz dos versículos seguintes, aponta para sinais ou provas alegados da virgindade, não apenas para uma qualidade abstrata.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva os eufemismos e a linguagem reputacional do hebraico, mas explicita o sentido matrimonial de לקח para evitar a leitura moderna de “tomar” como mero ato físico.
