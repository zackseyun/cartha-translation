  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: pt
  text: 'Então o pai da jovem dirá aos anciãos: “Dei minha filha a este homem como esposa, e ele a odeia.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passou a odiá-la”. O verbo hebraico significa simplesmente “odiar”; o contexto permite expressar tanto o estado presente (“a odeia”) como o desenvolvimento dessa atitude (“passou a odiá-la”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Então ... dirá
  rationale: No contexto jurídico e processual, a forma verbal introduz o próximo ato previsto no caso; o futuro em português comunica naturalmente essa função.
- source_word: אֲבִי הַנַּעַר
  choice: o pai da jovem
  rationale: A expressão designa o pai da mulher jovem em idade de casar; “jovem” é atual e adequado ao contexto matrimonial.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: Neste contexto, refere-se aos líderes reconhecidos da comunidade com função cívica e judicial, e não apenas a homens idosos.
- source_word: אֶת בִּתִּי
  choice: minha filha
  rationale: בִּתִּי significa diretamente “minha filha”; o marcador de objeto אֶת não recebe tradução independente.
- source_word: נָתַתִּי
  choice: Dei
  rationale: No contexto matrimonial, נָתַן descreve dar a filha em casamento; “Dei” preserva de modo direto a formulação hebraica.
- source_word: לָאִישׁ הַזֶּה
  choice: a este homem
  rationale: Mantém o sentido lexical de אִישׁ e identifica o marido acusado, enquanto a expressão seguinte esclarece a relação matrimonial.
- source_word: לְאִשָּׁה
  choice: como esposa
  rationale: É uma expressão matrimonial convencional e natural em português, preservando a relação indicada pelo hebraico.
- source_word: וַיִּשְׂנָאֶהָ
  choice: mas ele a odeia
  rationale: שָׂנֵא significa “odiar”. A conjunção adversativa explicita em português o contraste contextual sem alterar a afirmação; o presente descreve a atitude atual do marido.
