  text: לֹא תִרְאֶה֩ אֶת חֲמ֨וֹר אָחִ֜י/ךָ א֤וֹ שׁוֹר/וֹ֙ נֹפְלִ֣ים בַּ/דֶּ֔רֶךְ וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: pt
  text: Se vir o jumento ou o boi de seu irmão caídos no caminho, não os ignore; você deve certamente levantá-los com ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ajudá-lo a levantá-los”. Literalmente, “levantá-los com ele”, indicando que a pessoa deve cooperar com o dono.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: de seu irmão
  rationale: Preserva a formulação familiar do hebraico e sua força comunitária; no contexto da lei deuteronômica, “irmão” normalmente designa outro membro da comunidade da aliança.
- source_word: חֲמוֹר
  choice: jumento
  rationale: Termo corrente e claro em português para o animal doméstico mencionado.
- source_word: שׁוֹרוֹ
  choice: o boi
  rationale: Equivalente natural de שׁוֹר neste contexto jurídico de animais de trabalho.
- source_word: נֹפְלִים
  choice: caídos
  rationale: Expressa diretamente o estado dos animais, sem especificar se caíram por causa da carga, exaustão ou outro motivo não declarado no texto.
- source_word: בַּדֶּרֶךְ
  choice: no caminho
  rationale: Tradução natural que conserva a referência ao local onde os animais são encontrados.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: e os ignore
  rationale: O hitpael de עלם tem aqui o sentido idiomático de desconsiderar deliberadamente ou fingir não ver; o pronome plural é mantido em referência aos animais.
- source_word: הָקֵם תָּקִים
  choice: você deve, sem falta, levantá-los
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ordem; “sem falta” comunica essa ênfase em português natural.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Mantém a formulação explícita do hebraico, indicando ação conjunta com o dono dos animais, em vez de substituí-la silenciosamente por uma paráfrase.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe jurídica direta. “Irmão” foi preservado em vez de ser expandido para “compatriota” ou “companheiro israelita”, e a construção enfática hebraica foi comunicada por “sem falta”.
