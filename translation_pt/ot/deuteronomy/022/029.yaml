base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: pt
  text: Então o homem que se deitou com ela dará ao pai da jovem cinquenta siclos de prata, e ela se tornará sua mulher, porque ele a violou[a]. Ele não poderá mandá-la embora[b] por toda a vida dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser traduzido mais literalmente como “humilhou” ou “degradou”; neste contexto, refere-se a uma violação sexual.
    reason: lexical_alternative
  - marker: b
    text: “Mandá-la embora” significa repudiá-la ou divorciar-se dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Então ... dará
  rationale: Em material jurídico, o waw com a forma verbal faz avançar a prescrição. “Então” explicita a sequência legal, e o futuro em português comunica a obrigação normativa.
- source_word: הַשֹּׁכֵב עִמָּהּ
  choice: que se deitou com ela
  rationale: A construção participial identifica o homem pelo ato sexual. A expressão é clara, sóbria e adequada ao registro jurídico bíblico.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: ao pai da jovem
  rationale: נַעֲרָה designa uma moça ou jovem em idade de casar. “Jovem” evita infantilizar a mulher e preserva a indicação geral de idade e condição.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: cinquenta siclos de prata
  rationale: O hebraico diz literalmente “cinquenta de prata”, mas, neste contexto econômico e jurídico, trata-se convencionalmente de siclos, uma medida de peso.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: e ela se tornará sua mulher
  rationale: A cláusula estabelece a condição matrimonial resultante. “Sua mulher” é natural em português e não acrescenta uma ideia de propriedade além da relação conjugal.
- source_word: תַּחַת אֲשֶׁר
  choice: porque
  rationale: A locução introduz a razão da determinação legal; “porque” é o equivalente causal mais claro e natural.
- source_word: עִנָּהּ
  choice: ele a violou
  rationale: No piel e neste contexto sexual, ענה descreve tratamento degradante e violador. “Violou” transmite a gravidade sem impor ao verbo, isoladamente, uma especificidade maior do que a forma hebraica expressa.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: Ele não poderá mandá-la embora
  rationale: A tradução conserva a imagem verbal do hebraico. No contexto matrimonial, a expressão se refere a repudiá-la ou divorciar-se dela.
- source_word: כָּל יָמָיו
  choice: durante toda a sua vida
  rationale: A expressão hebraica “todos os seus dias” é um idiomatismo de duração vitalícia; esta formulação comunica seu sentido com naturalidade em português.
theological_decisions:
- issue: Como traduzir עִנָּהּ sem minimizar a violência sexual nem especificar além do que o verbo desta cláusula afirma
  choice: ele a violou
  alternative: ele a humilhou / ele a desonrou / ele a estuprou
  rationale: “Violou” expressa um grave abuso sexual e degradante. “Humilhou” pode soar fraco ou obscuro ao leitor moderno, enquanto “estuprou”, embora possível à luz do contexto mais amplo, torna esta cláusula isolada mais específica do que seu verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o caráter jurídico da passagem, esclarece os idiomatismos hebraicos e mantém a tensão lexical em torno de ענה por meio de nota.
