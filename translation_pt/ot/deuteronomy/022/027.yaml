base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: pt
  text: Pois ele a encontrou no campo[a]; a jovem prometida em casamento gritou, mas não havia quem a socorresse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em campo aberto”. A expressão hebraica indica uma área rural, afastada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não havia quem a salvasse”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da decisão jurídica apresentada no contexto anterior, com fluidez natural em português.
- source_word: בַשָּׂדֶה
  choice: no campo
  rationale: Reproduz diretamente o cenário rural e isolado relevante para a lógica jurídica do versículo.
- source_word: מְצָאָהּ
  choice: ele a encontrou
  rationale: Mantém o sentido comum de מצא e a referência pronominal feminina do hebraico.
- source_word: צָעֲקָה
  choice: gritou
  rationale: Expressa um grito de aflição ou pedido de ajuda sem acrescentar explicitamente palavras ausentes do texto.
- source_word: הַנַּעַר
  choice: a jovem
  rationale: O contexto, o artigo e a qualificação feminina identificam a pessoa como uma jovem mulher; a tradução é clara e atual.
- source_word: הַמְאֹרָשָׂה
  choice: prometida em casamento
  rationale: Comunica de modo acessível o vínculo matrimonial formal antigo, mais forte juridicamente que o noivado moderno comum.
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: mas não havia quem a socorresse
  rationale: O adversativo explicita naturalmente a relação contextual, enquanto 'socorresse' transmite a ação concreta de livrá-la do perigo.
theological_decisions:
- issue: Status jurídico-social de הַמְאֹרָשָׂה
  choice: prometida em casamento
  alternative: noiva; desposada
  rationale: Preserva a seriedade formal do compromisso matrimonial israelita sem equipará-lo de maneira simples ao noivado moderno nem recorrer a vocabulário pouco corrente.
- issue: Gênero de הַנַּעַר no contexto
  choice: a jovem
  alternative: a moça
  rationale: A referência é feminina segundo o contexto e a expressão qualificadora; a tradução torna isso claro sem impor uma idade mais específica que o hebraico.
- issue: Sentido de מוֹשִׁיעַ
  choice: socorresse
  alternative: salvasse; livrasse
  rationale: No contexto jurídico imediato, trata-se de auxílio diante de uma agressão. 'Socorrer' evita uma possível leitura exclusivamente soteriológica, sem negar o sentido básico de resgate.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com legibilidade brasileira. A formulação conserva o encadeamento explicativo do hebraico e o cenário jurídico, sem amenizar a situação nem acrescentar detalhes não expressos.
