base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: pt
  text: Então eles o multarão em cem siclos de prata e os entregarão ao pai da jovem, porque ele difamou uma virgem de Israel. Ela será sua mulher; ele não poderá mandá-la embora[a] durante toda a sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “divorciar-se dela”; o hebraico diz literalmente “mandá-la embora”, expressão que, em contextos jurídicos matrimoniais, pode designar o divórcio.
    reason: Alternativa lexical e esclarecimento do idioma jurídico matrimonial.
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: eles o multarão
  rationale: No contexto jurídico, o verbo indica a imposição de uma penalidade monetária, não apenas uma punição genérica.
- source_word: מֵאָה כֶסֶף
  choice: cem siclos de prata
  rationale: O hebraico diz literalmente “cem de prata”; a unidade de peso monetário fica implícita e é explicitada como “siclos” para tornar a quantia inteligível.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: ao pai da jovem
  rationale: נַעֲרָה designa aqui uma jovem em idade de casar; “jovem” é natural, atual e não acrescenta uma conotação infantil.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: porque ele fez cair má fama
  rationale: A expressão conserva a imagem hebraica de produzir ou fazer circular um “mau nome”, sem reduzi-la silenciosamente ao termo interpretativo “caluniar”.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: sobre uma virgem de Israel
  rationale: “Virgem” corresponde ao sentido de בְּתוּלָה no contexto da acusação legal, e “de Israel” preserva a vinculação à comunidade de Israel.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Ela será sua mulher
  rationale: A formulação expressa diretamente a condição matrimonial determinada pela lei, sem acrescentar “permanecer” ou outra explicação ausente do texto.
- source_word: לֹא יוּכַל
  choice: ele não poderá
  rationale: No texto legal, a construção comunica incapacidade ou proibição jurídica, bem expressa em português por “não poderá”.
- source_word: לְשַׁלְּחָהּ
  choice: mandá-la embora
  rationale: A tradução preserva o sentido verbal básico de “mandar embora”, enquanto a nota registra que, neste contexto matrimonial, a expressão pode significar divórcio.
- source_word: כָּל יָמָיו
  choice: durante toda a sua vida
  rationale: É a forma idiomática e clara de transmitir em português a expressão hebraica literal “todos os seus dias”.
theological_decisions:
- issue: Expressão jurídica para dissolução do casamento
  choice: mandá-la embora
  alternative: divorciar-se dela
  rationale: O hebraico usa uma expressão mais ampla, “mandar embora”, que em legislação matrimonial pode funcionar como termo para divórcio. O texto principal preserva a forma da fonte, e a nota apresenta a interpretação jurídica explícita sem eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O período conserva o tom prescritivo da legislação e evita linguagem arcaica. O marcador da nota foi colocado após a expressão a que de fato se refere.
