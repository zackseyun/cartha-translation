revisions:
- from: Então eles o multarão em cem siclos de prata e os entregarão ao pai da jovem, porque ele fez cair má fama sobre uma virgem de Israel. Ela será sua mulher; ele não poderá mandá-la embora[a] durante toda a sua vida.
  to: Então eles o multarão em cem siclos de prata e os entregarão ao pai da jovem, porque ele difamou uma virgem de Israel. Ela será sua mulher; ele não poderá mandá-la embora[a] durante toda a sua vida.
  rationale: A única alteração necessária substitui um decalque pouco natural do idiomatismo hebraico por «difamou», equivalente português claro para a acusação de mau nome/reputação no contexto legal. Mantêm-se a estrutura, o sentido jurídico, a ambiguidade controlada de «mandá-la embora» e a nota correspondente.
  reviewer_model: gpt-5.6-terra
