  source_fidelity: A tradução preserva bem a estrutura condicional, o encontro fortuito, as localizações possíveis, a mãe sobre os filhotes ou ovos e a proibição de tomar mãe e cria juntas. Contudo, “em alguma árvore” sugere uma árvore indeterminada, ao passo que בְּכָל עֵץ significa “em qualquer árvore”.
  naturalness: O português é claro, moderno e adequado ao registro jurídico-casuístico. “Ninho de ave”, “filhotes” e “não pegue” são compreensíveis internacionalmente, com boa legibilidade brasileira.
  terminology: Os termos principais são adequados. “Pousada” comunica de modo natural a posição da ave sem restringir o sentido a “chocando”. A nota b deve apresentar com maior precisão o trecho literal completo, incluindo a proibição, antes de explicar o uso idiomático de “sobre”.
