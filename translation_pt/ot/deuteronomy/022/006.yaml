base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: pt
  text: Se, pelo caminho, você encontrar por acaso um ninho de ave[a], em qualquer árvore ou no chão, com filhotes ou ovos, e a mãe estiver pousada sobre os filhotes ou sobre os ovos, não pegue a mãe junto com os filhotes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se você se deparar com um ninho de ave”. O verbo hebraico sugere um encontro fortuito, não uma busca deliberada.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não pegue a mãe sobre os filhos”. Neste contexto, a expressão significa pegar a mãe juntamente com sua prole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz a condição de uma lei casuística; “Se” é natural em português e preserva o caráter condicional.
- source_word: יִקָּרֵא
  choice: encontrar por acaso
  rationale: O nifal de קרא indica aqui um encontro fortuito, não uma busca deliberada.
- source_word: קַן צִפּוֹר
  choice: um ninho de ave
  rationale: Tradução natural da construção hebraica, mantendo a referência genérica a uma ave.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: pelo caminho, você encontrar
  rationale: Expressa de modo idiomático algo que surge diante da pessoa durante seu percurso, sem restringir דֶּרֶךְ a uma estrada pavimentada.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: em alguma árvore ou no chão
  rationale: Indica com clareza os dois possíveis locais do ninho; הָאָרֶץ tem aqui o sentido concreto de chão.
- source_word: אֶפְרֹחִים
  choice: filhotes
  rationale: Termo corrente e abrangente para as crias que estão no ninho, sem especificar indevidamente espécie ou estágio de desenvolvimento.
- source_word: בֵיצִים
  choice: ovos
  rationale: Equivalente direto e inequívoco.
- source_word: וְהָאֵם
  choice: e a mãe
  rationale: Mantém a concisão do hebraico; o contexto deixa claro que se trata da ave-mãe.
- source_word: רֹבֶצֶת
  choice: estiver pousada
  rationale: Descreve naturalmente a posição da ave sobre os filhotes ou ovos, sem impor o sentido mais específico de “chocando”.
- source_word: לֹא תִקַּח
  choice: não pegue
  rationale: Proibição direta em linguagem atual; preserva o sentido amplo de tomar ou capturar.
- source_word: הָאֵם עַל הַבָּנִים
  choice: a mãe junto com os filhotes
  rationale: No contexto, עַל exprime a tomada da mãe juntamente com sua prole; “filhotes” evita o sentido humano que “filhos” poderia sugerir.
