  text: כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְ/עָשִׂ֥יתָ מַעֲקֶ֖ה לְ/גַגֶּ֑/ךָ וְ/לֹֽא תָשִׂ֤ים דָּמִים֙ בְּ/בֵיתֶ֔/ךָ כִּֽי יִפֹּ֥ל הַ/נֹּפֵ֖ל מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: pt
  text: Quando você construir uma casa nova, faça um parapeito[a] em volta do seu telhado, para que não incorra em culpa de sangue[b] sobre a sua casa, caso alguém caia dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grade de proteção” ou “guarda-corpo”. O termo hebraico designa uma barreira protetora ao redor de um telhado plano, que podia ser usado como terraço.
    reason: lexical_alternative
  - marker: b
    text: Isto é, responsabilidade pela morte de alguém.
    reason: clarification
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz aqui uma situação típica de lei casuística, não uma explicação causal. “Quando” expressa com naturalidade o cenário previsto.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: você construir uma casa nova
  rationale: Tradução direta e idiomática do verbo, do objeto e do adjetivo, preservando o contexto jurídico concreto.
- source_word: וְעָשִׂיתָ
  choice: faça
  rationale: Nesse contexto legal, a forma verbal tem força de ordem. O imperativo “faça” comunica a obrigação de modo claro e atual.
- source_word: מַעֲקֶה
  choice: parapeito
  rationale: Designa uma barreira protetora na borda de um teto plano. “Parapeito” é preciso, enquanto alternativas modernas são registradas em nota.
- source_word: לְגַגֶּךָ
  choice: no seu terraço
  rationale: As casas antigas tinham tetos planos utilizados como terraços. Esta formulação comunica naturalmente o local da barreira protetora sem perder o referente arquitetônico.
- source_word: וְלֹא תָשִׂים דָּמִים
  choice: para não trazer culpa de sangue
  rationale: A expressão idiomática hebraica, literalmente relacionada a “pôr sangues”, indica incorrer em responsabilidade moral e jurídica por uma morte evitável.
- source_word: בְּבֵיתֶךָ
  choice: sobre a sua casa
  rationale: Mantém a imagem da culpa recaindo sobre a casa, isto é, sobre a propriedade e seu responsável.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: caso alguém caia
  rationale: A construção hebraica refere-se de modo genérico a uma possível vítima. “Caso alguém caia” preserva a contingência sem reproduzir uma repetição pouco natural em português.
- source_word: מִמֶּנּוּ
  choice: dali
  rationale: Retoma naturalmente o terraço como o lugar do qual alguém poderia cair, evitando ambiguidade pronominal em português.
theological_decisions:
- issue: Sentido de דָּמִים no contexto jurídico
  choice: culpa de sangue
  alternative: derramamento de sangue; responsabilidade por uma morte
  rationale: O versículo trata da responsabilidade moral e jurídica por uma morte evitável, e não apenas do sangue físico. “Culpa de sangue” conserva a força jurídica e pactual da expressão sem acrescentar uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com formas de ampla compreensão no Brasil e no restante do mundo lusófono. O imperativo “faça” transmite diretamente a força normativa. “Terraço” explicita a configuração do teto plano pressuposta pelo contexto antigo, e “culpa de sangue” preserva o idioma jurídico-teológico hebraico, esclarecido em nota.
