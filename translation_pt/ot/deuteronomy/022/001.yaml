source:
  edition: WLC
  text: לֹֽא תִרְאֶה֩ אֶת שׁ֨וֹר אָחִ֜י/ךָ א֤וֹ אֶת שֵׂי/וֹ֙ נִדָּחִ֔ים וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖/ם לְ/אָחִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: pt
  text: Se você vir o boi ou a ovelha de seu irmão desgarrados, não finja não vê-los; você certamente deverá devolvê-los a seu irmão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Preserva o termo de parentesco e solidariedade comunitária do hebraico, sem restringi-lo por paráfrase.
- source_word: שֵׂיוֹ
  choice: a ovelha
  rationale: O substantivo pode designar um animal do rebanho miúdo; neste par com o boi, 'ovelha' é uma forma natural e tradicional em português.
- source_word: נִדָּחִים
  choice: desgarrados
  rationale: O particípio descreve animais afastados, dispersos ou desviados. 'Desgarrados' preserva a condição resultante sem decidir se foram expulsos por um agente ou apenas se perderam.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: e os ignore
  rationale: Expressa o ato deliberado de desviar a atenção ou não prestar auxílio, em português corrente.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: você deverá levá-los de volta
  rationale: O infinitivo absoluto com o verbo finito intensifica a obrigação. 'Deverá' comunica a ordem enfática, enquanto 'levá-los de volta' é idiomático para devolver animais encontrados.
theological_decisions:
- issue: Alcance de 'irmão'
  choice: Manter 'seu irmão' no texto
  alternative: seu compatriota / seu próximo
  rationale: O hebraico emprega explicitamente אָחִיךָ. A tradução não amplia nem restringe silenciosamente a obrigação comunitária.
- issue: Causa do afastamento dos animais
  choice: desgarrados
  alternative: expulsos / levados embora / perdidos
  rationale: O hebraico permite a ideia de terem sido afastados ou dispersos, mas o verso não identifica claramente um agente. A escolha preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com construção proibitiva natural. O imperativo enfático foi expresso como obrigação categórica, sem formulação excessivamente arcaica.
