  text: לֹֽא תַחֲרֹ֥שׁ בְּ/שׁוֹר וּ/בַ/חֲמֹ֖ר יַחְדָּֽו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: pt
  text: Não lavre com um boi e um jumento juntos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você não deve lavrar com um boi e um jumento juntos.”'
    reason: Alternativa de formulação que explicita o valor proibitivo do imperfeito hebraico em registro jurídico.
lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: Não lavre
  rationale: A negação com o imperfeito qal de segunda pessoa masculina singular expressa uma proibição direta. O imperativo negativo é natural em português e preserva a força jurídica do hebraico.
- source_word: בְּשׁוֹר
  choice: com um boi
  rationale: שׁוֹר designa um bovino e, no contexto agrícola de lavrar, “boi” é a escolha mais natural para o animal de tração.
- source_word: וּבַחֲמֹר
  choice: e um jumento
  rationale: חֲמוֹר é o termo comum para esse animal. “Jumento” é claro, corrente e adequado ao registro bíblico em português.
- source_word: יַחְדָּו
  choice: juntos
  rationale: O advérbio indica que os dois animais são empregados conjuntamente na mesma lavra; “juntos” reproduz isso de modo direto e idiomático.
theological_decisions:
- issue: Força da proibição na lei da aliança
  choice: 'Traduzir como proibição direta: “Não lavre...”'
  alternative: “Você não deve lavrar...”
  rationale: A forma direta conserva a força normativa da instrução legal sem recorrer a uma construção rígida ou arcaizante. O versículo não exige resolver nenhuma questão doutrinária controversa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lavre” mantém a imagem agrícola concreta e a concisão da norma hebraica.
