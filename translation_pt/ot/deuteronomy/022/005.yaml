base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: pt
  text: A mulher não usará nenhum objeto próprio de homem[a], e o homem não vestirá roupa de mulher, pois todo aquele que faz essas coisas é uma abominação para Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “roupa de homem”. Na primeira oração, o hebraico usa um termo mais amplo, que pode significar objeto, utensílio ou equipamento; na segunda, emprega uma palavra específica para roupa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: nenhum artigo de homem
  rationale: כְלִי é mais amplo que vestimenta e pode designar objeto, utensílio, equipamento ou artigo. “Artigo” preserva essa amplitude e mantém a distinção em relação a שִׂמְלָה, o termo específico para roupa na segunda oração.
- source_word: עַל אִשָּׁה
  choice: a mulher não usará
  rationale: A construção literal “estar sobre uma mulher”, neste contexto, indica portar ou usar algo no corpo. “Usará” expressa o sentido idiomático em português corrente sem restringi-lo exclusivamente a roupa.
- source_word: יִלְבַּשׁ
  choice: vestirá
  rationale: O verbo significa vestir-se ou pôr uma roupa. “Vestirá” é natural, conciso e adequado ao substantivo específico da segunda oração.
- source_word: שִׂמְלַת אִשָּׁה
  choice: roupa de mulher
  rationale: שִׂמְלָה designa roupa ou peça de vestuário, muitas vezes exterior. “Roupa” é clara e moderna, sem especificar indevidamente uma peça como manto.
- source_word: גֶּבֶר
  choice: homem
  rationale: O termo designa homem em contraste explícito com mulher; a tradução conserva essa oposição de gênero presente no hebraico.
- source_word: אִשָּׁה
  choice: mulher
  rationale: O termo designa mulher em contraste com גֶּבֶר, e “mulher” é o equivalente natural em português.
- source_word: תוֹעֲבַת יְהוָה
  choice: abominável para Yahweh
  rationale: תוֹעֵבָה exprime algo fortemente detestável perante Deus. A construção adjetival “é abominável para” comunica com naturalidade o valor predicativo da frase, enquanto “Yahweh” representa o nome divino explícito no texto-fonte.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: todo aquele que faz essas coisas
  rationale: A construção participial com כָּל generaliza e abrange cada pessoa que pratica os atos mencionados; esta formulação preserva sua força distributiva.
theological_decisions:
- issue: Alcance da primeira proibição (כְלִי גבר)
  choice: Traduzir de modo amplo como “nenhum artigo de homem”, sem limitar o sentido a vestimenta.
  alternative: “roupa de homem” ou “equipamento/arma de homem”
  rationale: O hebraico emprega na primeira oração um substantivo amplo e, na segunda, um termo específico para roupa. Preservar a diferença evita decidir silenciosamente se a primeira proibição se refere apenas a vestuário ou também a outros objetos ou equipamentos associados ao homem.
- issue: Linguagem marcada por gênero
  choice: Manter “mulher” e “homem”.
  alternative: Empregar termos neutros como “pessoa” ou “alguém”.
  rationale: O texto hebraico estabelece expressamente o contraste entre mulher e homem; neutralizá-lo apagaria uma característica semântica relevante.
- issue: Representação do nome divino יהוה
  choice: Usar “Yahweh”.
  alternative: “SENHOR”
  rationale: O texto-fonte traz o nome próprio divino. “Yahweh” o representa diretamente e também mantém a opção adotada na camada inglesa fornecida, sem substituir o nome por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação preserva o paralelismo das duas proibições, mas não elimina a distinção lexical entre כְלִי e שִׂמְלָה. O marcador [a] aparece junto à expressão explicada.
