  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: pt
  text: Não semeie na sua vinha duas espécies de sementes, para que toda a produção não fique consagrada[a] — tanto a semente que você semear como o fruto da vinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, separada do uso comum e, portanto, indisponível ao proprietário; também se pode traduzir: “seja perdida” ou “seja confiscada”.'
    reason: A nota esclarece a consequência jurídica provável de תִּקְדַּשׁ sem apagar do texto seu sentido literal de consagração.
lexical_decisions:
- source_word: לֹא תִזְרַע
  choice: Não semeie
  rationale: A proibição hebraica é expressa naturalmente em português pelo imperativo negativo; זרע significa especificamente semear.
- source_word: כַּרְמְךָ
  choice: na sua vinha
  rationale: כרם é o termo comum para vinha ou vinhedo; “vinha” é corrente e adequado ao contexto agrícola.
- source_word: כִּלְאָיִם
  choice: duas espécies de semente
  rationale: כלאים designa uma mistura proibida de tipos distintos. Esta formulação explicita a pluralidade de espécies sem reduzir o termo a uma mistura já preparada.
- source_word: פֶּן
  choice: para que ... não
  rationale: פן introduz uma consequência negativa que se deseja evitar; esta construção é clara e idiomática em português.
- source_word: תִּקְדַּשׁ
  choice: fique consagrada
  rationale: Preserva o sentido lexical de קדש, “tornar-se santo/consagrado, ser separado”, sem resolver no texto a consequência jurídica exata.
- source_word: הַמְלֵאָה
  choice: toda a produção
  rationale: O substantivo refere-se à plenitude ou totalidade da produção; “toda a produção” comunica o sentido agrícola naturalmente.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: a semente que você semear
  rationale: Mantém a especificação e a repetição do verbo presentes no hebraico.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: como o fruto da vinha
  rationale: תבואה denota produto ou colheita. “Fruto da vinha” é natural e distingue a produção das videiras da semente semeada entre elas.
theological_decisions:
- issue: Sentido de תִּקְדַּשׁ no contexto desta lei
  choice: Manter “fique consagrada” no texto e explicar a implicação em nota
  alternative: “seja confiscada” ou “fique perdida”
  rationale: O verbo literalmente pertence ao campo de “santo/consagrado”. Embora aqui provavelmente indique que a produção fica separada do uso comum e, assim, perdida para o proprietário, traduzir diretamente por “confiscada” eliminaria uma ambiguidade genuína e introduziria um destinatário da perda que o verso não explicita.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível tanto no Brasil como em outros contextos lusófonos. O tratamento por “você” favorece a leitura brasileira; “vinha”, “semente” e “consagrada” mantêm o registro bíblico sem arcaísmo excessivo.
