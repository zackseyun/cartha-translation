  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הוֹצִ֨יאוּ אֶת ה/נער אֶל פֶּ֣תַח בֵּית אָבִ֗י/הָ וּ/סְקָלוּ/הָ֩ אַנְשֵׁ֨י עִירָ֤/הּ בָּ/אֲבָנִים֙ וָ/מֵ֔תָה כִּֽי עָשְׂתָ֤ה נְבָלָה֙ בְּ/יִשְׂרָאֵ֔ל לִ/זְנ֖וֹת בֵּ֣ית אָבִ֑י/הָ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: pt
  text: Então levarão a jovem[a] para a entrada da casa de seu pai, e os homens de sua cidade a apedrejarão com pedras, e ela morrerá, porque cometeu uma infâmia[b] em Israel, prostituindo-se[c] na casa de seu pai. Desse modo, eliminarás o mal do teu meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a moça”. Neste contexto, o hebraico נַעַר designa uma pessoa jovem do sexo feminino; a nuance exata depende do contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “um ato vergonhoso” ou “um ato vil”. O hebraico נְבָלָה indica uma afronta moralmente chocante.
    reason: lexical_alternative
  - marker: c
    text: Ou “cometendo imoralidade sexual”. O verbo hebraico זנה evoca literalmente prostituição, mas muitas vezes é usado de modo mais amplo para conduta sexual ilícita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: a jovem
  rationale: Embora a forma נַעַר possa designar uma pessoa jovem do sexo feminino neste contexto, “a jovem” é natural, digna e adequada ao contexto jurídico, sem acrescentar uma faixa etária mais precisa do que o hebraico permite.
- source_word: פֶּתַח
  choice: a entrada
  rationale: O termo indica a abertura ou entrada de um lugar. “Entrada” comunica o sentido concreto com naturalidade em português atual.
- source_word: בֵּית אָבִיהָ
  choice: a casa de seu pai / na casa de seu pai
  rationale: A expressão significa literalmente “casa de seu pai”. “Casa” preserva tanto o local concreto quanto a possível dimensão familiar, sem reduzir a frase a apenas “família” ou “domicílio”.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: a apedrejarão com pedras
  rationale: A construção conserva o verbo e seu complemento explícito, reproduzindo a formulação enfática do texto jurídico hebraico, embora haja certa redundância em português.
- source_word: אַנְשֵׁי עִירָהּ
  choice: os homens de sua cidade
  rationale: A expressão hebraica diz literalmente “os homens da cidade dela”. A tradução mantém a referência masculina e o vínculo da jovem com a cidade.
- source_word: נְבָלָה
  choice: uma infâmia
  rationale: Neste contexto moral e jurídico, o substantivo designa um ato vergonhoso e chocante, não simples insensatez. “Infâmia” preserva a forte censura comunitária em linguagem concisa e digna.
- source_word: לִזְנוֹת
  choice: prostituindo-se
  rationale: O infinitivo de זנה evoca prostituição, mas também pode caracterizar de modo mais amplo uma conduta sexual ilícita. A tradução mantém a imagem forte do hebraico e registra a amplitude semântica em nota.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Desse modo, eliminarás o mal do teu meio
  rationale: Esta fórmula jurídica recorrente em Deuteronômio exige a remoção do mal da comunidade. “Eliminarás” transmite sua força sem reproduzir de modo indevidamente literal a possível imagem de consumir ou queimar.
theological_decisions:
- issue: Terminologia jurídico-sexual sem suavização nem especificação excessiva
  choice: Manter “infâmia” e “prostituindo-se”, com nota sobre a amplitude de זנה.
  alternative: Empregar apenas “imoralidade sexual” ou uma formulação eufemística como “procedendo indevidamente”.
  rationale: A redação preserva a gravidade moral e jurídica do hebraico sem importar categorias doutrinárias posteriores nem afirmar que se tratava necessariamente de prostituição comercial.
- issue: Identidade dos participantes na execução da sentença
  choice: Traduzir אַנְשֵׁי עִירָהּ como “os homens de sua cidade”.
  alternative: Neutralizar como “o povo de sua cidade” ou “os moradores da cidade”.
  rationale: O hebraico emprega uma expressão masculina explícita; mantê-la evita uma generalização que o texto não formula.
- issue: Caráter comunitário da fórmula de remoção do mal
  choice: 'Preservar o destinatário coletivo expresso gramaticalmente no singular: “eliminarás o mal do teu meio”.'
  alternative: 'Converter para o plural moderno: “vocês eliminarão o mal do meio de vocês”.'
  rationale: O singular conserva a forma da exortação dirigida a Israel como corpo coletivo e a ligação com a fórmula deuteronômica recorrente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e as repetições juridicamente relevantes foram preservadas, enquanto “Desse modo” e “eliminarás” evitam literalismo áspero. Os marcadores [a], [b] e [c] aparecem no texto na ordem correspondente às notas.
