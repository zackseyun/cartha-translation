  text: וְ/אִם לֹ֨א קָר֥וֹב אָחִ֛י/ךָ אֵלֶ֖י/ךָ וְ/לֹ֣א יְדַעְתּ֑/וֹ וַ/אֲסַפְתּ/וֹ֙ אֶל תּ֣וֹךְ בֵּיתֶ֔/ךָ וְ/הָיָ֣ה עִמְּ/ךָ֗ עַ֣ד דְּרֹ֤שׁ אָחִ֨י/ךָ֙ אֹת֔/וֹ וַ/הֲשֵׁבֹת֖/וֹ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: pt
  text: Mas, se o seu irmão não estiver perto de você[a], e você não o conhecer[b], recolha-o para dentro de sua casa, e ele ficará com você até que seu irmão o procure; então devolva-o a ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Deuteronômio, “seu irmão” frequentemente se refere a outro membro da comunidade de Israel, e não apenas a um irmão biológico.
    reason: cultural_note
  - marker: b
    text: Isto é, se você não souber quem é o dono; literalmente, “não o conhecer”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “restitua-o a ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Preserva a linguagem de parentesco do hebraico. No contexto jurídico de Deuteronômio, a expressão pode designar de modo mais amplo um membro da comunidade da aliança.
- source_word: קָרוֹב אֵלֶיךָ
  choice: morar perto de você
  rationale: O contexto pressupõe que o proprietário não está nas proximidades ou não é localmente identificável. A formulação é natural em português e expressa a proximidade física indicada pelo hebraico.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: você não o conhecer
  rationale: Mantém o objeto masculino singular do hebraico, que retoma o irmão, sem eliminar a implicação contextual de que o dono não é conhecido.
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: leve o que foi perdido para dentro de sua casa
  rationale: Explicita com naturalidade o referente do sufixo masculino — o animal ou objeto perdido mencionado no versículo anterior — e preserva o movimento para dentro da casa.
- source_word: וְהָיָה עִמְּךָ
  choice: Isso ficará com você
  rationale: Comunica o sentido durativo de permanecer sob os cuidados de quem encontrou o bem.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: até que seu irmão o procure
  rationale: דרש pode significar procurar, indagar por ou reclamar. “Procure” preserva a imagem da busca sem restringir o sentido à apresentação formal de uma reivindicação.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: então devolva-o a ele
  rationale: Expressa diretamente o hifil de שוב, isto é, fazer voltar ou restituir ao proprietário.
theological_decisions:
- issue: Alcance de “seu irmão” na lei deuteronômica
  choice: Manter “seu irmão” no texto e esclarecer seu alcance provável em nota
  alternative: Traduzir diretamente como “seu compatriota israelita” ou “membro do seu povo”
  rationale: A opção preserva a metáfora familiar e a forma masculina do original, sem ocultar que, neste contexto legal, ela provavelmente abrange um membro da comunidade da aliança e não apenas um irmão biológico.
translation_notes:
  register: Português moderno, digno e de leitura natural, com imperativos adequados ao discurso legal. O referente inicialmente implícito foi expresso como “o que foi perdido” para evitar ambiguidade pronominal excessiva em português, mantendo as ambiguidades relevantes em notas.
