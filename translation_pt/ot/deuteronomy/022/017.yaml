  text: וְ/הִנֵּה ה֡וּא שָׂם֩ עֲלִילֹ֨ת דְּבָרִ֜ים לֵ/אמֹ֗ר לֹֽא מָצָ֤אתִי לְ/בִתְּ/ךָ֙ בְּתוּלִ֔ים וְ/אֵ֖לֶּה בְּתוּלֵ֣י בִתִּ֑/י וּ/פָֽרְשׂוּ֙ הַ/שִּׂמְלָ֔ה לִ/פְנֵ֖י זִקְנֵ֥י הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: pt
  text: 'E eis que ele lançou contra ela acusações difamatórias, dizendo: “Não encontrei virgindade em sua filha”.[a] Mas aqui estão as evidências da virgindade de minha filha.[b] Então estenderão a veste[c] diante dos anciãos da cidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não encontrei virgindades para sua filha”; trata-se de uma expressão idiomática que alega que ela não era virgem ou que não foram encontrados os sinais esperados de virgindade.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “os sinais” ou “as provas da virgindade de minha filha”.
    reason: lexical_alternative
  - marker: c
    text: A veste é o tecido apresentado como evidência legal neste caso.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém a função discursiva de chamar a atenção para a acusação, em registro digno e reconhecível no português bíblico, sem omitir sua força demonstrativa.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: lançou contra ela acusações difamatórias
  rationale: Expressa o ato de formular acusações que prejudicam a reputação da mulher e preserva o caráter forense da cena. “Contra ela” é explicitado pelo contexto.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: Não encontrei virgindade em sua filha
  rationale: Reproduz de modo inteligível o idiomatismo hebraico sem decidir no texto se a alegação se refere diretamente à condição da filha ou à ausência de sinais usados como evidência.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: Mas aqui estão as evidências da virgindade de minha filha
  rationale: O plural idiomático בְּתוּלִים, no contexto judicial, aponta para sinais ou evidências apresentados em defesa da filha. “Mas” explicita o contraste contextual introduzido pelo waw.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: Então estenderão a veste
  rationale: Conserva o sentido amplo de שִׂמְלָה como peça de tecido ou vestimenta e apresenta a ação seguinte como parte do procedimento legal.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: diante dos anciãos da cidade
  rationale: Mantém a fórmula judicial que indica a apresentação da evidência às autoridades cívicas locais.
