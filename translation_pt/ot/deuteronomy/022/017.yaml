  source_fidelity: 'O texto representa adequadamente a progressão do hebraico: o marcador enfático “E eis que”, a acusação formal e difamatória, a alegação relativa à virgindade da filha, a apresentação de evidências e o ato processual perante os anciãos. “Não encontrei virgindade em sua filha” conserva, de modo deliberado e legítimo, a margem semântica do idiomatismo hebraico בין condição de virgindade e seus sinais apresentados como prova.'
