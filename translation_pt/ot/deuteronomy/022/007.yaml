base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: pt
  text: Deixe a mãe ir, sem falta[a], mas você pode pegar a prole para si[b], para que tudo lhe vá bem e você tenha vida longa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Você certamente deixará a mãe ir”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os filhos”; no contexto do ninho, refere-se à prole, incluindo os filhotes ou os ovos mencionados no versículo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: Deixe ... ir, sem falta
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ordem. “Sem falta” comunica essa ênfase de modo natural e atual.
- source_word: הָאֵם
  choice: a mãe
  rationale: O contexto identifica a mãe como uma ave; não é necessário acrescentar “ave” ao texto.
- source_word: הַבָּנִים
  choice: os filhotes
  rationale: Literalmente, “os filhos”; no contexto de um ninho, refere-se à prole da ave. “Filhotes” é claro e natural, embora o versículo anterior também mencione ovos.
- source_word: תִּקַּח לָךְ
  choice: você pode pegar para si
  rationale: Na sequência da ordem de soltar a mãe, a forma verbal tem sentido permissivo. “Para si” preserva לָךְ.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: para que tudo lhe vá bem
  rationale: Expressa em português corrente a fórmula de propósito ou resultado ligada à bênção da obediência.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: e você tenha vida longa
  rationale: A expressão hebraica é literalmente “e prolongue dias”; “tenha vida longa” transmite seu sentido idiomático com naturalidade.
theological_decisions:
- issue: Natureza do resultado prometido
  choice: Apresentar a bênção ou o resultado pactual sem explicá-lo como garantia mecânica de longevidade em cada caso individual.
  alternative: Traduzir de modo que pareça uma promessa incondicional de longevidade individual.
  rationale: A fórmula hebraica declara o resultado associado à obediência, mas a tradução não deve resolver nem ampliar a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “sem falta” preserva a ênfase sem recorrer a linguagem arcaica; “você” torna clara a segunda pessoa singular do hebraico.
