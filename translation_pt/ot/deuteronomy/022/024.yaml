  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: pt
  text: 'Então levareis ambos para fora, até à porta daquela cidade[a], e os apedrejareis com pedras, e eles morrerão: a jovem[b], porque não gritou na cidade; e o homem, porque violou[c] a esposa do seu próximo. Assim eliminarás o mal do teu meio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A porta da cidade era o lugar público habitual para processos judiciais e julgamentos.
    reason: cultural_note
  - marker: b
    text: Ou “a moça”. A forma hebraica aqui está escrita sem a letra he final da grafia feminina mais explícita, mas o verbo seguinte, “não gritou”, está no feminino.
    reason: textual_lexical_note
  - marker: c
    text: Ou “humilhou” ou “afligiu”. Neste contexto, o verbo hebraico pode indicar violação sexual acompanhada de humilhação; “violou” expressa isso com clareza em português atual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתֶם אֶת שְׁנֵיהֶם
  choice: levareis os dois
  rationale: O hifil de יצא expressa fazer sair ou levar para fora. “Levareis os dois” é natural em português e preserva a referência explícita a ambas as pessoas.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: à porta daquela cidade
  rationale: “Porta” traduz שַׁעַר e mantém a referência ao local público e judicial da cidade antiga sem inserir a explicação cultural no corpo do versículo.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים
  choice: os apedrejareis com pedras
  rationale: A formulação conserva a menção explícita às pedras no hebraico, apesar da leve redundância em português, mantendo o caráter formal da disposição legal.
- source_word: וָמֵתוּ
  choice: e eles morrerão
  rationale: Reproduz diretamente a sequência coordenada do hebraico, apresentando a morte como resultado sem reformulá-la explicitamente como finalidade.
- source_word: הנער
  choice: a jovem
  rationale: Embora a forma consonantal esteja escrita sem o he final da grafia feminina mais explícita, o verbo feminino צָעֲקָה mostra que se trata de uma mulher. “A jovem” é claro e evita sugerir uma idade infantil.
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: porque não gritou na cidade
  rationale: “Porque” transmite de modo natural a razão jurídica introduzida por עַל דְּבַר, e “gritou” mantém a ação expressa pelo texto sem acrescentar palavras interpretativas.
- source_word: עִנָּה
  choice: violou
  rationale: Neste contexto sexual e jurídico, o verbo pode envolver aflição e humilhação sexual. “Violou” comunica a gravidade sem restringir o termo a uma categoria jurídica moderna mais específica.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: a esposa do seu próximo
  rationale: “Esposa” explicita o sentido conjugal de אֵשֶׁת, e “próximo” preserva a categoria social e pactual de רֵעֵהוּ.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Assim eliminarás o mal do teu meio
  rationale: Mantém a fórmula jurídica recorrente de Deuteronômio em linguagem portuguesa clara e solene. “Do teu meio” preserva a imagem comunitária do hebraico.
theological_decisions:
- issue: Fundamento jurídico declarado para a culpa da jovem
  choice: porque não gritou na cidade
  alternative: por não ter pedido socorro na cidade
  rationale: A tradução conserva o fundamento apresentado pelo próprio texto — a ausência de um grito no contexto urbano — sem acrescentar conclusões éticas, psicológicas ou doutrinárias que o versículo não formula.
- issue: Sentido de עִנָּה no contexto de legislação sexual
  choice: violou
  alternative: humilhou; afligiu
  rationale: “Violou” preserva a gravidade sexual e a dimensão de humilhação do verbo sem resolver a tensão por meio de um termo jurídico moderno mais específico do que a forma hebraica exige.
- issue: Alternância entre formas verbais plurais e singular
  choice: levareis… apedrejareis… eliminarás
  alternative: levarás… apedrejarás… eliminarás
  rationale: A alternância reproduz a mudança do plural para o singular presente no hebraico, em vez de uniformizar silenciosamente o destinatário coletivo da lei.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a solenidade jurídica, a repetição hebraica “apedrejareis com pedras” e a alternância original entre segunda pessoa do plural e do singular. Os marcadores foram ordenados conforme sua primeira ocorrência no texto.
