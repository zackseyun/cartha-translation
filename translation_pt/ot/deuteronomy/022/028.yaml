base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: pt
  text: Se um homem encontrar uma jovem virgem que não esteja prometida em casamento[a], e a agarrar[b] e se deitar com ela, e ambos forem descobertos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que não esteja desposada”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico pode significar “agarrar”, “apoderar-se de” ou “segurar”. Alguns entendem que, neste contexto, a expressão implica estupro; outros consideram que essa conclusão jurídica deve ser inferida do contexto mais amplo, e não apenas deste verbo.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz a hipótese de uma lei casuística; “se” é natural e preciso em português jurídico e narrativo.
- source_word: יִמְצָא
  choice: encontrar
  rationale: Reproduz diretamente o sentido comum do verbo, sem acrescentar a ideia de encontro fortuito.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o substantivo masculino singular específico do hebraico.
- source_word: נער בְתוּלָה
  choice: uma jovem virgem
  rationale: Preserva tanto a referência à juventude quanto a afirmação de virgindade, em linguagem atual e não arcaica.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: que não esteja prometida em casamento
  rationale: Expressa o compromisso formal de casamento pressuposto pelo verbo hebraico, com maior clareza internacional do que o uso isolado de “noiva”.
- source_word: וּתְפָשָׂהּ
  choice: agarrá-la
  rationale: O verbo denota agarrar, apoderar-se ou segurar. “Agarrá-la” conserva a ação física forte sem converter o verbo, por si só, em uma qualificação jurídica completa.
- source_word: וְשָׁכַב עִמָּהּ
  choice: e se deitar com ela
  rationale: Mantém o conhecido eufemismo hebraico para relação sexual, que permanece compreensível em português.
- source_word: וְנִמְצָאוּ
  choice: e os dois forem descobertos
  rationale: O plural passivo refere-se a ambos; “os dois” explicita naturalmente o sujeito plural em português sem alterar o sentido.
theological_decisions:
- issue: Se a ação deve ser designada explicitamente como estupro no texto principal
  choice: Conservar a formulação lexical “agarrá-la e se deitar com ela”
  alternative: “estuprá-la” ou a formulação mais branda “tomá-la”
  rationale: תפשׂ indica uma ação física de agarrar ou apoderar-se, mas o alcance jurídico e a questão do consentimento são discutidos à luz do contexto. A tradução mantém a força do verbo sem encerrar no texto principal uma interpretação mais específica do que a expressão hebraica, e registra a questão em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Prometida em casamento” evita o caráter arcaico de “desposada”, que fica preservado em nota. A sintaxe mantém o versículo aberto, pois a sentença legal continua no versículo seguinte.
