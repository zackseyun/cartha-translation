- source_word: כִּי
  choice: Se
  rationale: Introduz um caso jurídico hipotético; “Se” assinala naturalmente a condição em português.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: um homem tomar uma mulher por esposa
  rationale: Preserva o sentido matrimonial da construção sem recorrer ao pouco natural “tomar uma esposa”.
- source_word: וּבָא אֵלֶיהָ
  choice: tiver relações sexuais com ela
  rationale: O idioma hebraico é um eufemismo convencional para relações sexuais; uma tradução explícita e respeitosa comunica seu sentido com clareza no português atual.
- source_word: וּשְׂנֵאָהּ
  choice: e depois passar a odiá-la
  rationale: Mantém o forte sentido de “odiar” e expressa a progressão do caso; “passar a” soa natural para a mudança de atitude implícita na sequência.
