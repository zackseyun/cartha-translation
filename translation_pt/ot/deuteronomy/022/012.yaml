base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/012.yaml
  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: pt
  text: Faça borlas para si[a] nos quatro cantos da sua cobertura[b] com que você se cobre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cordões trançados” ou “franjas”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sua cobertura”; também pode ser traduzido por “sua veste” ou “seu manto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: borlas
  rationale: O substantivo designa adereços pendentes presos à roupa. “Borlas” é natural em português e preserva a referência concreta; “cordões trançados” explicita mais a possível formação, e “franjas” é uma alternativa tradicional.
- source_word: תַּעֲשֶׂה לָּךְ
  choice: Faça para você
  rationale: O imperfeito qal tem força injuntiva no contexto legal, enquanto לָּךְ indica interesse pessoal. A formulação mantém ambos os elementos sem tornar a frase excessivamente solene.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: nos quatro cantos
  rationale: Embora כָּנָף possa significar “asa” ou “extremidade”, no contexto de uma peça de tecido refere-se aos cantos. “Nos” expressa naturalmente em português a colocação das borlas nesses pontos.
- source_word: כְּסוּתְךָ
  choice: da cobertura
  rationale: “Cobertura” permanece próxima do sentido amplo do hebraico e não determina indevidamente se o objeto é uma veste ou um manto; essas possibilidades são registradas em nota.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: com que você se cobre
  rationale: A oração relativa descreve a função da cobertura e conserva a ligação lexical entre כְּסוּת e o verbo כסה.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma injuntiva direta. A repetição “cobertura... se cobre” preserva deliberadamente a ligação lexical presente no hebraico. Todos os marcadores de nota aparecem no texto principal.
