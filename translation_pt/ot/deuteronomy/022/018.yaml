  text: וְ/לָֽקְח֛וּ זִקְנֵ֥י הָֽ/עִיר הַ/הִ֖וא אֶת הָ/אִ֑ישׁ וְ/יִסְּר֖וּ אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/018.yaml
  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: pt
  text: Então, os anciãos daquela cidade tomarão o homem e o castigarão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o disciplinarão” ou, possivelmente, “o açoitarão”. O verbo hebraico tem sentido amplo de correção ou castigo; por si só, não especifica a forma da punição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: tomarão
  rationale: O qal de לקח significa normalmente “tomar”. No contexto jurídico, “tomarão” preserva a formulação ampla do hebraico sem especificar à força uma apreensão violenta.
- source_word: זִקְנֵי
  choice: os anciãos
  rationale: Neste contexto cívico-jurídico, זקנים designa líderes reconhecidos da comunidade, não apenas homens idosos. “Anciãos” conserva essa função institucional.
- source_word: הָעִיר הַהִוא
  choice: daquela cidade
  rationale: A expressão mantém tanto a referência à jurisdição local quanto a especificidade do demonstrativo hebraico.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Embora o contexto identifique esse homem como o marido acusado nos versículos anteriores, “o homem” segue mais de perto o substantivo איש sem explicitar no texto o que o contexto já informa.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: e o disciplinarão
  rationale: O verbo יסר abrange correção, disciplina ou castigo. Como o verbo não determina por si só a forma da sanção, “disciplinarão” preserva sua amplitude sem afirmar especificamente que houve açoite.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica simples. “Anciãos” mantém o caráter institucional do termo, e “disciplinarão” conserva a amplitude lexical do hebraico. O marcador [a] aparece no texto principal.
