  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: pt
  text: Não coma pão fermentado com ele. Durante sete dias, coma com ele pães sem fermento, o pão da aflição[a], pois você saiu às pressas da terra do Egito, para que se lembre, todos os dias da sua vida, do dia em que saiu da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o pão da pobreza” ou “o pão da miséria”. A expressão hebraica pode enfatizar o sofrimento, a privação ou a aflição associados ao êxodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: com ele
  rationale: A preposição עַל, no contexto da refeição pascal, indica acompanhamento; “com ele” retoma naturalmente o sacrifício da Páscoa mencionado no contexto.
- source_word: חָמֵץ
  choice: pão fermentado
  rationale: No contexto alimentar, refere-se ao pão com fermento, não apenas ao agente fermentador.
- source_word: מַצּוֹת
  choice: pães sem fermento
  rationale: Expressa de modo claro e corrente o alimento ritual; o plural acompanha a forma hebraica.
- source_word: לֶחֶם עֹנִי
  choice: o pão da aflição
  rationale: Preserva o peso de עֹנִי e sua associação com sofrimento e privação, sem restringir o sentido à pobreza econômica.
- source_word: בְחִפָּזוֹן
  choice: às pressas
  rationale: Transmite de modo idiomático a urgência da saída do Egito sem acrescentar a ideia específica de medo ou fuga.
- source_word: לְמַעַן תִּזְכֹּר
  choice: para que se lembre
  rationale: Mantém a relação de finalidade marcada por לְמַעַן e o valor verbal subsequente.
- source_word: יוֹם צֵאתְךָ
  choice: o dia em que saiu
  rationale: Formulação natural em português que conserva a referência concreta ao dia da saída.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: todos os dias da sua vida
  rationale: Preserva a força distributiva e a ideia de lembrança ao longo de toda a vida.
theological_decisions:
- issue: Sentido de לֶחֶם עֹנִי no memorial do êxodo
  choice: o pão da aflição
  alternative: o pão da pobreza; o pão da miséria
  rationale: A expressão pode envolver sofrimento, privação e condição humilde. “Aflição” mantém essa amplitude e a tensão entre o sofrimento vivido e a libertação recordada, sem reduzir o sentido ao aspecto econômico.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos na terceira pessoa (“não coma”, “coma”) e referência singular ao ouvinte, conforme o hebraico. A ordem final foi ajustada para soar natural em português sem perder a ênfase temporal de “todos os dias da sua vida”.
