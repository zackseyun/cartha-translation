base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: pt
  text: Nomeie juízes e oficiais em todas as suas portas — que Yahweh, seu Deus, lhe dá — segundo as suas tribos; e eles julgarão o povo com julgamento justo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou “com justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: juízes
  rationale: Designa aqueles que proferem decisões judiciais; “juízes” é o equivalente direto e natural neste contexto legal.
- source_word: שֹׁטְרִים
  choice: oficiais
  rationale: Refere-se a agentes administrativos ligados à ordem jurídica, sem que o texto defina mais precisamente suas funções; “oficiais” evita especificação indevida.
- source_word: תִּתֶּן לְךָ
  choice: nomeie para você
  rationale: Embora o verbo tenha o sentido básico de “dar” ou “colocar”, aqui expressa a designação de pessoas para cargos. A formulação conserva o pronome reflexivo do hebraico e comunica a força institucional.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: em todas as suas portas
  rationale: Mantém a imagem literal das portas das cidades, que serviam como centros cívicos e judiciais; uma nota explica a referência cultural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִשְׁבָטֶיךָ
  choice: segundo as suas tribos
  rationale: Preserva a ideia de distribuição ou organização tribal sem decidir além do que permite a construção hebraica.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: e eles julgarão o povo
  rationale: O verbo tem sentido propriamente judicial no contexto e retoma naturalmente os juízes e oficiais nomeados.
- source_word: מִשְׁפַּט צֶדֶק
  choice: com julgamento justo
  rationale: A expressão combina a decisão jurídica com sua conformidade à justiça; esta tradução é clara e preserva ambas as dimensões.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A imagem histórica das portas foi preservada no texto principal e explicada em nota. A colocação de “segundo as suas tribos” mantém a concisão e parte da flexibilidade sintática do hebraico.
