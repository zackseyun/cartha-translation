base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male slave, your female slave, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: pt
  text: E você se alegrará diante de Yahweh, seu Deus — você, seu filho, sua filha, seu escravo, sua escrava, o levita que estiver dentro das suas cidades,[a] o estrangeiro residente,[b] o órfão e a viúva que estiverem em seu meio —, no lugar que Yahweh, seu Deus, escolher para fazer seu nome habitar ali.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dentro dos seus portões”; aqui, a expressão se refere às cidades ou comunidades locais.
    reason: Esclarecimento do idioma jurídico e geográfico hebraico.
  - marker: b
    text: Ou “o imigrante”. O hebraico se refere a um não israelita que vivia entre os israelitas sob sua ordem social.
    reason: Alternativa lexical e esclarecimento da condição social de גֵּר.
  - marker: c
    text: 'A expressão hebraica é causativa: “fazer seu nome habitar ali”.'
    reason: Preservação da forma e da fórmula teológica do original.
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: E você se alegrará
  rationale: Preserva o valor injuntivo do perfeito consecutivo no contexto legal e o tom festivo-litúrgico de שׂמח.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa de modo natural a ideia de estar na presença de Yahweh em contexto de culto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: seu escravo, sua escrava
  rationale: Mantém a condição social indicada pelos termos e a distinção de gênero do par hebraico, sem suavizá-los como serviço genérico.
- source_word: בִּשְׁעָרֶיךָ
  choice: dentro das suas cidades
  rationale: No uso deuteronômico, literalmente 'em seus portões', a expressão designa as localidades sob a jurisdição do destinatário; 'cidades' comunica o referente em português corrente.
- source_word: וְהַגֵּר
  choice: o estrangeiro residente
  rationale: Comunica que גֵּר é um não israelita estabelecido entre Israel e integrado à sua ordem social, não simplesmente um visitante.
- source_word: וְהַיָּתוֹם
  choice: o órfão
  rationale: É a formulação portuguesa natural para o dependente privado de proteção paterna; a extensão exata do termo pode ser explicitada em nota se necessário.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para fazer seu nome habitar ali
  rationale: Reflete a forma causativa de שׁכן e conserva a fórmula teológica deuteronômica sem reduzi-la a simplesmente 'pôr' o nome.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio da aliança; a transliteração o preserva e evita substituí-lo por um título.
- issue: Condição social de עבד e אמה
  choice: escravo / escrava
  alternative: servo / serva
  rationale: Neste quadro doméstico e jurídico, 'escravo/escrava' torna visível a condição de dependência e propriedade que 'servo/serva' poderia atenuar, sem acrescentar uma teoria específica sobre a instituição.
- issue: Fórmula do santuário לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para fazer seu nome habitar ali
  alternative: para que seu nome habite ali; para colocar ali seu nome
  rationale: A escolha retém o sentido causativo e a tensão própria de Deuteronômio entre a transcendência de Deus e a presença do seu nome no lugar escolhido.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O singular inicial acompanha o destinatário individual do hebraico, enquanto “no meio de vocês” reproduz a mudança textual para uma referência comunitária. Travessões organizam a longa enumeração; as notas explicam apenas expressões cuja literalidade poderia obscurecer o sentido.
