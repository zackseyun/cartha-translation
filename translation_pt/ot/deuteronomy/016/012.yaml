  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a slave in Egypt[a], and keep and do these statutes.
translation:
  language: pt
  text: Lembre-se de que você foi escravo no Egito[a]; observe e cumpra estes decretos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O termo hebraico עֶבֶד pode designar servo ou escravo, mas aqui “escravo” retrata melhor a servidão de Israel no Egito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Lembre-se
  rationale: O perfeito qal com conjunção, neste contexto de instrução, tem força de ordem. A forma pronominal é natural no português moderno.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo daquilo que deve ser lembrado, não uma explicação causal.
- source_word: עֶבֶד
  choice: escravo
  rationale: Embora o termo possa designar servo ou escravo, aqui o contexto é a servidão coercitiva de Israel no Egito.
- source_word: הָיִיתָ
  choice: você foi
  rationale: Expressa o estado passado do destinatário coletivo, representado pelo singular hebraico.
- source_word: בְּמִצְרָיִם
  choice: no Egito
  rationale: Tradução direta da expressão preposicional, sem acrescentar 'terra', que não aparece no texto.
- source_word: וְשָׁמַרְתָּ
  choice: obedeça
  rationale: No contexto da aliança e da lei, שׁמר significa observar ou guardar prescrições; 'obedecer' comunica esse sentido com naturalidade.
- source_word: וְעָשִׂיתָ
  choice: cumpra-os
  rationale: Mantém distinta a ênfase na execução efetiva dos decretos e evita a formulação pouco natural 'faça os decretos'.
- source_word: הַחֻקִּים
  choice: decretos
  rationale: חֻקִּים designa determinações prescritas. 'Decretos' é claro, digno e corrente em português bíblico moderno.
- source_word: הָאֵלֶּה
  choice: estes
  rationale: Reproduz diretamente o demonstrativo que modifica 'decretos'.
theological_decisions:
- issue: Sentido de עֶבֶד na lembrança da permanência de Israel no Egito
  choice: escravo
  alternative: servo
  rationale: A memória histórica evocada é a de sujeição coercitiva no Egito; 'escravo' expressa melhor essa realidade, sem negar que o termo hebraico tenha amplitude semântica maior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O singular 'você' conserva a interpelação individual do hebraico ao membro do povo. A dupla verbal שׁמר/עשׂה foi vertida de modo idiomático como 'obedeça... e cumpra-os', preservando a distinção entre observar e executar.
