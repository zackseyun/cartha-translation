  text: שִׁבְעַ֣ת יָמִ֗ים תָּחֹג֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה כִּ֣י יְבָרֶכְ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹ֤ל תְּבוּאָֽתְ/ךָ֙ וּ/בְ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔י/ךָ וְ/הָיִ֖יתָ אַ֥ךְ שָׂמֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: pt
  text: Durante sete dias, você celebrará uma festa para Yahweh, seu Deus, no lugar que Yahweh escolher, porque Yahweh, seu Deus, abençoará você em toda a sua produção e em todo o trabalho das suas mãos; e você ficará plenamente alegre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você ficará somente alegre” ou “certamente se alegrará”. A expressão hebraica enfatiza uma alegria plena, sem mistura.'
    reason: Alternativas lexicais para o valor enfático ou restritivo de אַךְ na oração final.
lexical_decisions:
- source_word: תָּחֹג
  choice: celebrará uma festa
  rationale: O verbo חָגַג se refere à celebração de uma festa de peregrinação, e não apenas a uma alegria genérica. A expressão conserva o caráter festivo em português natural.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica que a festa é dirigida ou dedicada a Yahweh. “Para Yahweh” preserva essa orientação sem acrescentar uma explicação interpretativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de ser substituído por um título, preservando o nome pessoal presente no texto hebraico.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: no lugar que Yahweh escolher
  rationale: Tradução direta e natural da referência ao local de culto escolhido por Yahweh.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a razão para a celebração e a alegria ordenadas.
- source_word: יְבָרֶכְךָ
  choice: abençoará você
  rationale: Preserva a linguagem bíblica e pactual de bênção divina sem reduzi-la apenas à prosperidade material.
- source_word: תְּבוּאָתְךָ
  choice: toda a sua produção
  rationale: תְּבוּאָה designa a produção ou rendimento agrícola de modo amplo; “produção” evita restringir o sentido somente aos cereais.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: o trabalho das suas mãos
  rationale: Mantém o conhecido idioma hebraico para o trabalho de uma pessoa e seus resultados, de modo compreensível em português atual.
- source_word: וְהָיִיתָ
  choice: e você ficará
  rationale: Expressa o estado resultante da bênção e da celebração, preservando a sequência da oração hebraica.
- source_word: אַךְ
  choice: plenamente
  rationale: No contexto, o termo enfatiza a plenitude da alegria. “Plenamente” comunica essa força, embora o hebraico também possa ser entendido de maneira mais literalmente restritiva.
- source_word: שָׂמֵחַ
  choice: alegre
  rationale: O adjetivo predicativo descreve o estado da pessoa; “alegre” é direto, atual e semanticamente próximo.
theological_decisions:
- issue: Forma de representar o nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Sentido de וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: e você ficará plenamente alegre
  alternative: e você ficará somente alegre; e certamente se alegrará
  rationale: אַךְ admite uma formulação de aparência restritiva (“somente”) ou uma leitura enfática. O contexto da bênção, da produção e da festa favorece a ênfase numa alegria plena, mas a nota conserva as alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para o singular hebraico de segunda pessoa e mantém o paralelismo e os principais idiomas do original sem arcaísmos desnecessários.
