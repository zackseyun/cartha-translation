  yaml_path: translation/ot/deuteronomy/016/007.yaml
  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: pt
  text: Cozinhe-o e coma-o no lugar que o SENHOR, seu Deus, escolher. Pela manhã, volte para as suas tendas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: Cozinhe-o
  rationale: O verbo בשל denota preparar pelo calor e pode significar cozinhar ou ferver. “Cozinhe” preserva aqui a amplitude lexical sem impor um método específico; o objeto, implícito no hebraico pelo contexto, é explicitado pelo pronome para dar naturalidade em português.
- source_word: וּפָנִיתָ
  choice: volte
  rationale: Literalmente, “vire-se”; neste contexto de partida matinal, “volte” comunica naturalmente o movimento de regresso.
- source_word: לְאֹהָלֶיךָ
  choice: para as suas tendas
  rationale: Mantém a imagem concreta e o plural do hebraico, sem substituí-los interpretativamente por “casas”.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa consagrada de representar o tetragrama por “SENHOR” em versaletes/maiúsculas.
theological_decisions:
- issue: Relação do verbo בשל com a exigência de assar a Páscoa em Êxodo 12:9
  choice: “Cozinhe-o”, em sentido amplo
  alternative: “Ferva-o”
  rationale: O sentido mais específico “ferver” criaria uma harmonização ou tensão desnecessariamente definida com Êxodo 12:9. O contexto permite o termo abrangente “cozinhar”, preservando a evidência lexical sem resolver além do texto o modo exato de preparo.
- issue: Referente do sufixo בּוֹ após “escolher”
  choice: Não explicitá-lo separadamente em português
  alternative: “escolher para isso” ou “escolher nele”
  rationale: No hebraico, בּוֹ retoma idiomaticamente “o lugar” na construção “o lugar que o SENHOR escolher”. Explicitá-lo produziria português pouco natural ou sugeriria que Deus escolhe o lugar especificamente “para isso”, nuance não exigida pela sintaxe.
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais em lugar de uma reprodução rígida da forma verbal hebraica. A pontuação divide as duas ações temporais sem alterar sua sequência.
