  text: וְ/זָבַ֥חְתָּ פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ צֹ֣אן וּ/בָקָ֑ר בַּ/מָּקוֹם֙ אֲשֶׁר יִבְחַ֣ר יְהוָ֔ה לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: pt
  text: E você sacrificará a Páscoa[a] a Yahweh, seu Deus, com animais do rebanho e do gado, no lugar que Yahweh escolher para ali fazer habitar o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “a Páscoa” aparece ligada a animais “do rebanho e do gado”. Alguns entendem que a expressão abrange não só a vítima pascal propriamente dita, mas também os sacrifícios festivos associados à Páscoa e à Festa dos Pães sem Fermento.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: E você sacrificará
  rationale: O verbo זבח indica abate sacrificial. “Sacrificará” comunica a ação cultual e mantém a força instrutiva da forma hebraica.
- source_word: פֶּסַח
  choice: a Páscoa
  rationale: פֶּסַח pode designar a celebração, o rito ou a vítima pascal. Como objeto de “sacrificará”, “a Páscoa” preserva a formulação compacta e a ambiguidade do hebraico.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: a Yahweh, seu Deus
  rationale: A preposição ל marca o destinatário ou a dedicação do sacrifício. O nome divino יהוה é transliterado como “Yahweh”.
- source_word: צֹאן וּבָקָר
  choice: com animais do rebanho e do gado
  rationale: Os substantivos coletivos abrangem os animais de pequeno e grande porte. A formulação explicita em português a relação entre os animais e o sacrifício sem restringir indevidamente as espécies.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: no lugar que Yahweh escolher
  rationale: “No lugar” é natural para o local de culto designado, e o futuro “escolher” corresponde à perspectiva do discurso de Moisés.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para ali fazer habitar o seu nome
  rationale: A forma causativa de שכן é preservada por “fazer habitar”. A expressão mantém o idioma teológico do nome divino associado à presença e à reivindicação de Deus sobre o lugar.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva no texto o nome da aliança expresso diretamente pelo Tetragrama.
- issue: Alcance de “Páscoa” diante de “rebanho e gado”
  choice: Manter a amplitude da formulação hebraica e explicar a questão em nota
  alternative: Interpretar no texto como “o sacrifício pascal e as ofertas da festa”
  rationale: A referência ao gado é mais ampla do que a vítima pascal propriamente dita. O texto não deve resolver por harmonização uma tensão genuína; a nota apresenta a interpretação possível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe conserva o caráter legal e cultual do versículo sem soar arcaica; a expressão “fazer habitar o seu nome” mantém deliberadamente o idioma teológico do hebraico.
