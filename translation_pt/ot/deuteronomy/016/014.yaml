  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male slave and your female slave, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: pt
  text: Alegre-se na sua festa — você, seu filho, sua filha, seu escravo, sua escrava, o levita, o estrangeiro residente[a], o órfão[b] e a viúva que vivem nas suas cidades[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o não israelita que morava de forma estável entre o povo; também se pode traduzir por “forasteiro residente”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode destacar especificamente quem não tinha pai e, portanto, carecia de sua proteção social.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “dentro dos seus portões”; expressão hebraica que se refere às cidades ou comunidades em que viviam.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Alegre-se
  rationale: O perfeito qal com waw, neste contexto de instrução legal, tem força imperativa. A forma pronominal é natural em português e mantém o tom de mandamento.
- source_word: בְּחַגֶּךָ
  choice: na sua festa
  rationale: חַג designa uma festa religiosa, especialmente uma celebração de peregrinação. “Na sua festa” preserva tanto o evento quanto a participação alegre nele.
- source_word: אַתָּה
  choice: você
  rationale: O pronome independente é enfático e abre a enumeração dos participantes. “Você” oferece leitura natural e amplamente compreensível.
- source_word: וּבִנְךָ וּבִתֶּךָ
  choice: seu filho, sua filha
  rationale: Correspondência direta aos termos filiais, empregados no singular distributivo na legislação.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: seu escravo, sua escrava
  rationale: Os termos designam pessoas de condição servil ou escravizada no âmbito doméstico. “Escravo” e “escrava” preservam a condição social explícita sem suavizá-la como simples serviço.
- source_word: וְהַלֵּוִי
  choice: o levita
  rationale: Tradução tradicional e precisa do título tribal e cultual.
- source_word: וְהַגֵּר
  choice: o estrangeiro residente
  rationale: גֵּר é o não israelita estabelecido entre Israel, não meramente um visitante nem qualquer estrangeiro. A expressão explicita sua residência na comunidade.
- source_word: וְהַיָּתוֹם
  choice: o órfão
  rationale: “Órfão” é natural em português e comunica a categoria social vulnerável; a nota registra a possível ênfase específica na ausência do pai.
- source_word: וְהָאַלְמָנָה
  choice: a viúva
  rationale: Equivalente direto e corrente para a categoria social mencionada.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: que vivem nas suas cidades
  rationale: “Nos seus portões” é um idiomatismo hebraico para as localidades ou comunidades sob a jurisdição do destinatário. A tradução pelo sentido evita uma imagem enganosa em português.
theological_decisions:
- issue: Condição social expressa por עֶבֶד e אָמָה
  choice: escravo / escrava
  alternative: servo / serva
  rationale: No contexto da lista doméstica e social, a condição de dependência coercitiva é relevante. A escolha não ameniza essa realidade histórica nem acrescenta uma avaliação doutrinária.
- issue: Identidade do גֵּר
  choice: estrangeiro residente
  alternative: forasteiro
  rationale: A expressão identifica uma pessoa de origem não israelita que reside entre o povo. Evita tanto a ideia de visitante passageiro quanto categorias migratórias modernas demasiado específicas.
- issue: Sentido social de יָתוֹם
  choice: órfão
  alternative: órfão de pai
  rationale: O termo pode salientar a perda da proteção paterna no mundo social da Torá. O texto principal usa a forma portuguesa corrente, enquanto a nota preserva essa nuance.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A enumeração e o pronome enfático do hebraico foram preservados; o idiomatismo final foi traduzido pelo sentido e explicado em nota.
