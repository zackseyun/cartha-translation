base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: pt
  text: Durante seis dias comerás pão sem fermento, e no sétimo dia haverá uma assembleia solene[a] para Yahweh, teu Deus; não farás trabalho algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assembleia sagrada” ou “assembleia de encerramento”. O termo hebraico indica uma reunião festiva formal, provavelmente com a nuance de uma assembleia conclusiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Durante seis dias
  rationale: A expressão indica duração; “durante seis dias” transmite isso de modo claro e natural em português.
- source_word: תֹּאכַל
  choice: comerás
  rationale: O imperfeito tem força instrutiva neste contexto legal. O futuro simples preserva o caráter prescritivo com linguagem digna e concisa.
- source_word: מַצּוֹת
  choice: pão sem fermento
  rationale: É o sentido usual no contexto da Páscoa e a formulação mais imediatamente compreensível para leitores modernos.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: e no sétimo dia
  rationale: Traduz o waw como conjunção simples, sem introduzir um contraste que o hebraico não exige.
- source_word: עֲצֶרֶת
  choice: assembleia solene
  rationale: Designa uma reunião festiva formal e sagrada, possivelmente com a nuance de encerramento; a nota preserva as alternativas sem fixar indevidamente uma só nuance.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para Yahweh, teu Deus
  rationale: “Para” mantém a relação de dedicação indicada pela preposição ל, e “Yahweh” representa diretamente o nome divino יהוה.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: não farás trabalho algum
  rationale: Expressa de maneira natural e enfática a proibição de realizar trabalho.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido cultual de עֲצֶרֶת
  choice: assembleia solene
  alternative: assembleia sagrada; assembleia de encerramento
  rationale: A escolha comunica o caráter formal e festivo da reunião, enquanto a nota conserva a possível nuance conclusiva sem a impor ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com construção prescritiva adequada ao gênero legal. O marcador da nota foi colocado após “assembleia solene”, expressão à qual a nota lexical efetivamente se refere.
