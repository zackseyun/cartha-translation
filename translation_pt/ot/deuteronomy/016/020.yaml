base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: pt
  text: É justiça, justiça que você deve buscar, para que você viva e tome posse da terra que Yahweh, seu Deus, está dando a você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: Justiça, justiça
  rationale: A repetição enfática do substantivo é preservada. No contexto imediato de juízes, parcialidade e suborno, “justiça” expressa melhor o sentido público e judicial, sem excluir a dimensão mais ampla de retidão.
- source_word: תִּרְדֹּף
  choice: você deve buscar
  rationale: O verbo רדף significa literalmente perseguir ou ir atrás. “Deve buscar” comunica em português atual a ação persistente exigida e a força normativa da instrução.
- source_word: לְמַעַן תִּחְיֶה
  choice: para que viva
  rationale: Preserva de modo direto a relação de propósito ou resultado marcada por לְמַעַן e mantém a amplitude do verbo חיה, sem acrescentar prosperidade explicitamente.
- source_word: וְיָרַשְׁתָּ
  choice: e tome posse
  rationale: ירשׁ pode indicar herdar ou tomar posse. Neste contexto da terra dada por Deus, “tome posse” é natural e conserva a ideia de entrar na posse da terra; a alternativa “herde” é registrada em nota.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: “Terra” preserva o termo central da linguagem da aliança em Deuteronômio e sua referência à terra prometida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz o construto com sufixo de segunda pessoa masculina singular e mantém o tratamento pactual dirigido a Israel como unidade.
- source_word: נֹתֵן לָךְ
  choice: está dando a você
  rationale: O particípio נֹתֵן apresenta a dádiva divina de forma vívida e em curso; a formulação é clara em português internacional com boa legibilidade brasileira.
theological_decisions:
- issue: Sentido de צֶדֶק no contexto judicial
  choice: justiça
  alternative: retidão
  rationale: O contexto imediato trata da administração judicial íntegra, por isso “justiça” é o sentido principal. A nota preserva a sobreposição semântica com “retidão”.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome pessoal divino; “Yahweh” preserva esse nome em vez de substituí-lo por um título.
- issue: Nuance de וְיָרַשְׁתָּ
  choice: tome posse
  alternative: herde
  rationale: Ambas as ideias pertencem ao campo semântico do verbo. “Tome posse” se ajusta ao ingresso de Israel na terra, enquanto “herde” preserva melhor a ressonância de herança e por isso aparece na nota.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para representar com clareza a segunda pessoa singular do hebraico. A repetição enfática foi mantida, assim como o nome divino Yahweh. Evitou-se linguagem excessivamente jurídica ou arcaica.
