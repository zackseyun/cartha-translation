    rationale: A sequência “Justiça, justiça você deve buscar” reproduz de perto a ordem hebraica, mas não é a forma mais natural em português moderno. “É justiça, justiça que você deve buscar” conserva tanto a duplicação enfática quanto a força focal.
  - severity: low
    issue: Sujeito elíptico na oração de finalidade.
    rationale: “Para que viva e tome posse” é gramatical, mas, em um texto que adotou “você”, “para que você viva e tome posse” oferece maior clareza e fluência para leitores internacionais e brasileiros.
