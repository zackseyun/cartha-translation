review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a repetição enfática de צֶדֶק, o sentido judicial de “justiça”, a força normativa de תִּרְדֹּף, a finalidade expressa por לְמַעַן, a posse/herança da terra e o nome divino Yahweh. A revisão proposta apenas melhora a sintaxe portuguesa e explicita de modo natural o sujeito já indicado por “você”.
  naturalness: “Justiça, justiça você deve buscar” é compreensível, mas soa como uma inversão pouco natural no português moderno. Uma construção clivada mantém a ênfase e a repetição sem sacrificar fluidez. “Para que você viva e tome posse” também evita que os subjuntivos sem sujeito expresso soem excessivamente elípticos após a oração principal.
  terminology: “Justiça”, “tomar posse”, “terra”, “Yahweh” e “seu Deus” são escolhas adequadas e consistentes com o hebraico e com o contexto de Deuteronômio. A alternativa “retidão” deve permanecer em nota; para ירשׁ, a nota deve formular a alternativa completa e idiomática “herdar a terra”.
  issues:
