  text: לֹֽא תִטַּ֥ע לְ/ךָ֛ אֲשֵׁרָ֖ה כָּל עֵ֑ץ אֵ֗צֶל מִזְבַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה לָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: pt
  text: Não plante para si uma Aserá de qualquer espécie de árvore junto ao altar de Yahweh, seu Deus, que você fizer para si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um poste de Aserá”. O termo hebraico אֲשֵׁרָה pode se referir a um objeto cultual associado à deusa Aserá, e não somente à própria deusa.
    reason: Leitura alternativa necessária para preservar a ambiguidade lexical e cultual do hebraico.
lexical_decisions:
- source_word: תִטַּע
  choice: plante
  rationale: O verbo נטע significa normalmente “plantar”. Embora o objeto seja cultual e “instalar” seja possível por sentido, “plantar” preserva a imagem concreta do hebraico e sua possível referência a uma árvore viva ou a um objeto de madeira.
- source_word: אֲשֵׁרָה
  choice: Aserá
  rationale: A transliteração conserva a ambiguidade entre a deusa e o objeto cultual associado a ela, sem impor a interpretação mais específica de “poste sagrado”.
- source_word: כָּל עֵץ
  choice: de nenhuma espécie de árvore
  rationale: A expressão significa literalmente “toda/qualquer árvore”. Nesta proibição, “de nenhuma espécie de árvore” comunica a abrangência e liga naturalmente a expressão a “Aserá”.
- source_word: אֵצֶל
  choice: ao lado de
  rationale: Expressa proximidade espacial concreta e corresponde de modo natural ao hebraico.
- source_word: מִזְבַּח
  choice: altar
  rationale: Equivalente português padrão para מִזְבַּח.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva o sufixo de segunda pessoa masculina singular e o caráter pactual da declaração.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: que você fizer para si
  rationale: “Fizer” mantém a amplitude de עשה, e “para si” representa o dativo לָּךְ sem restringir o verbo a “construir”.
theological_decisions:
- issue: Se אֲשֵׁרָה designa a deusa ou um objeto cultual
  choice: Manter “Aserá” por transliteração no texto principal.
  alternative: “poste de Aserá” ou “objeto de madeira dedicado a Aserá”
  rationale: O termo hebraico pode designar Aserá ou um objeto cultual ligado à sua adoração. A transliteração, acompanhada de nota, preserva essa tensão sem resolver indevidamente a referência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção negativa “Não plante” reproduz naturalmente a proibição. “Para você” e “para si” mantêm os dois elementos לְךָ e לָּךְ do texto hebraico, ainda que a repetição soe deliberadamente marcada.
