  text: וְ/לֹֽא תָקִ֥ים לְ/ךָ֖ מַצֵּבָ֑ה אֲשֶׁ֥ר שָׂנֵ֖א יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: pt
  text: Não levante para si uma coluna[a], que Yahweh, seu Deus, odeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedra erguida” ou “coluna cultual”. O termo hebraico se refere a uma pedra colocada em posição vertical, aqui associada ao culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִים
  choice: erga
  rationale: O hifil de קום significa fazer ficar de pé, isto é, levantar ou instalar um objeto. “Erga” é direto e natural no contexto.
- source_word: לְךָ
  choice: para você
  rationale: Preserva o dativo pessoal e sua possível nuance reflexiva sem tornar a frase artificial em português.
- source_word: מַצֵּבָה
  choice: coluna
  rationale: Designa uma pedra colocada em posição vertical, frequentemente ligada ao culto. “Coluna” mantém o texto conciso; a nota esclarece o referente e as alternativas sem inserir “sagrada” no corpo do versículo.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente em português a oração relativa que modifica “coluna”.
- source_word: שָׂנֵא
  choice: odeia
  rationale: Reproduz de modo direto a forte aversão expressa pelo verbo hebraico, sem atenuá-la.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a segunda pessoa singular e a formulação relacional da aliança.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome próprio divino. “Yahweh” o preserva como nome, sem substituí-lo pelo título “SENHOR”.
- issue: Valor cultual de מַצֵּבָה
  choice: coluna, com nota explicativa
  alternative: coluna sagrada; pedra erguida; coluna cultual
  rationale: O termo designa uma pedra vertical que pode funcionar como monumento ou objeto cultual. O contexto indica uso religioso, mas acrescentar “sagrada” ao texto principal explicitaria uma nuance contextual não lexicalmente marcada; a nota preserva ambas as informações.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Erga” evita a possível impressão arquitetônica de “construa”, e a vírgula em “Yahweh, seu Deus,” apresenta “seu Deus” como aposto natural.
