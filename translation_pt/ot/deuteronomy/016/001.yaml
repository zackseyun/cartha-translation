source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: pt
  text: Observe o mês de Abibe[a] e celebre a Páscoa a Yahweh, seu Deus, pois foi no mês de Abibe que Yahweh, seu Deus, tirou você do Egito à noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abibe é o nome do mês associado ao início do amadurecimento dos grãos; também se pode traduzir por “mês da primavera”.
    reason: alternativa lexical e explicação calendárica
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Observe
  rationale: O imperativo exige o cumprimento atento de uma determinação do calendário religioso; “observe” preserva a força legal e soa natural em português.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: o mês de abibe
  rationale: No contexto, a expressão funciona como designação calendárica. Mantém-se “abibe”, em vez de generalizar para “primavera”, com nota sobre seu sentido lexical.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: e celebre a Páscoa
  rationale: A expressão literalmente significa “fazer a Páscoa”, isto é, realizar sua observância ritual. “Celebre” comunica esse sentido de modo atual e digno, sem sugerir mera fabricação.
- source_word: לַיהוָה
  choice: em honra de Yahweh
  rationale: A preposição marca orientação ou dedicação da observância a Yahweh. “Em honra de” é idiomático em português e explicita essa relação sem alterar o referente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: הוֹצִיאֲךָ
  choice: tirou você
  rationale: É a forma causativa do verbo e integra a fórmula do êxodo. “Tirou você” é clara, direta e natural.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Com “tirou”, a construção “do Egito” expressa naturalmente a origem da saída.
- source_word: לָיְלָה
  choice: de noite
  rationale: Indica a circunstância temporal da saída. “De noite” conserva a concisão e a possível relação com o evento do êxodo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de אָבִיב
  choice: abibe como designação calendárica
  alternative: primavera; época das espigas novas
  rationale: Neste contexto legal e festivo, a expressão identifica o mês da Páscoa e do êxodo. A nota preserva a ligação lexical com os grãos em fase inicial de amadurecimento.
- issue: Alcance temporal de לָיְלָה
  choice: ligado à ação de tirar do Egito
  alternative: entendido de modo mais amplo à luz das etapas diurnas e noturnas do êxodo
  rationale: A sintaxe associa “de noite” ao verbo “tirou”. A tradução mantém essa formulação sem harmonizá-la explicitamente com outras descrições narrativas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular hebraico dirigido a Israel foi vertido por “você/seu”, preservando o número gramatical. “Páscoa” mantém a designação tradicional e reconhecível da festa; “Yahweh” preserva o nome divino.
