  text: לֹ֥א תוּכַ֖ל לִ/זְבֹּ֣חַ אֶת הַ/פָּ֑סַח בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: pt
  text: Você não poderá sacrificar a Páscoa[a] em nenhuma das cidades[b] que Yahweh, seu Deus, está dando a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sacrifício da Páscoa”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “portões”; no hebraico, expressão frequentemente usada para representar cidades ou povoações.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Você não poderá
  rationale: A construção com יכל + infinitivo tem força proibitiva neste contexto legal. A formulação conserva a expressão hebraica de possibilidade sem ser entendida como simples incapacidade.
- source_word: לִזְבֹּחַ
  choice: sacrificar
  rationale: Em contexto cultual, זבח designa o abate ou a oferta sacrificial; “sacrificar” é claro e conciso.
- source_word: הַפָּסַח
  choice: a Páscoa
  rationale: פסח pode designar a celebração ou o sacrifício pascal. Com “sacrificar”, a expressão portuguesa preserva a concisão e a ambiguidade lexical do hebraico; a alternativa explícita aparece em nota.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: em nenhuma das cidades
  rationale: Na proibição, בְּאַחַד equivale naturalmente a “em nenhuma”. שְׁעָרֶיךָ, literalmente “seus portões”, funciona aqui como metonímia para cidades ou povoações; o sentido é dado no texto e a imagem hebraica é registrada em nota.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: que Yahweh, seu Deus, está dando a você
  rationale: O particípio נֹתֵן apresenta a dádiva como em curso ou característica. “Está dando” reproduz esse aspecto, e “Yahweh” representa diretamente o nome divino.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Referente de הַפָּסַח
  choice: a Páscoa
  alternative: o sacrifício da Páscoa
  rationale: O termo pode indicar a festa, a vítima ou a oferta pascal. O verbo “sacrificar” orienta o sentido, enquanto a nota mantém explícita a alternativa sem eliminar a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” para o singular hebraico e evita um literalismo opaco em “portões”, preservando a imagem original em nota.
