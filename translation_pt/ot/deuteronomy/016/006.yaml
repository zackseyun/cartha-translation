base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: pt
  text: mas somente no lugar que Yahweh, seu Deus, escolher para fazer habitar ali o seu nome[a]—ali você sacrificará a Páscoa[b], ao entardecer, ao pôr do sol, no tempo determinado da sua saída do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para que o seu nome habite ali” ou “para pôr ali o seu nome”.
    reason: lexical_alternative
  - marker: b
    text: Ou “abaterá o sacrifício da Páscoa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: mas somente
  rationale: A expressão introduz uma restrição enfática em contraste com a proibição do versículo anterior; “mas somente” comunica essa força de modo natural.
- source_word: הַמָּקוֹם
  choice: o lugar
  rationale: Equivalente corrente e adequado ao uso deuteronômico referente ao local de culto escolhido por Deus.
- source_word: יִבְחַר
  choice: escolher
  rationale: O imperfeito tem sentido futuro neste contexto legal; o futuro é expresso pela locução verbal “que ... escolher” após a referência ao lugar ainda a ser designado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para que o seu nome habite ali
  rationale: Preserva a imagem do nome divino habitando no lugar escolhido, em português natural, sem definir metafisicamente a maneira da presença de Deus; a forma causativa mais explícita consta em nota.
- source_word: תִּזְבַּח
  choice: você sacrificará
  rationale: O verbo designa aqui o abate sacrificial; “sacrificará” deixa claro o caráter ritual, enquanto a alternativa “abaterá” é registrada em nota.
- source_word: הַפֶּסַח
  choice: a Páscoa
  rationale: Como objeto de “sacrificará”, o termo se refere à oferta pascal, mas a formulação tradicional e concisa preserva a amplitude do substantivo.
- source_word: בָּעָרֶב
  choice: ao entardecer
  rationale: Expressão temporal natural que indica o período vespertino sem confundi-lo com a frase seguinte, mais específica.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: ao pôr do sol
  rationale: Equivalente idiomático preciso da expressão hebraica referente à entrada ou descida do sol.
- source_word: מוֹעֵד
  choice: no tempo determinado
  rationale: Comunica uma ocasião fixada ou designada, conservando a ideia de precisão temporal.
- source_word: צֵאתְךָ מִמִּצְרַיִם
  choice: da sua saída do Egito
  rationale: Mantém a construção nominal hebraica e sua ligação com o tempo determinado, em linguagem portuguesa clara.
theological_decisions:
- issue: Fórmula do nome divino na linguagem de centralização do culto em Deuteronômio
  choice: para que o seu nome habite ali
  alternative: para fazer o seu nome habitar ali; para pôr ali o seu nome
  rationale: A formulação conserva a tensão entre a transcendência de Deus e sua presença pactual no lugar escolhido, sem transformar a expressão em uma afirmação de localização física da própria essência divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para explicitar o destinatário singular do hebraico. Mantém “Yahweh” como nome pessoal e preserva a imagem de seu nome habitando no lugar escolhido. Os marcadores de nota foram colocados junto às expressões que explicam.
