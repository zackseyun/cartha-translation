  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: pt
  text: Não se encontrará fermento em todo o seu território durante sete dias; e não ficará nada da carne[a] que você sacrificar ao entardecer, no primeiro dia[b], até a manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico significa literalmente “carne” e é comum em contextos sacrificiais; aqui se refere à carne do animal sacrificado.
    reason: esclarecimento_lexical
  - marker: b
    text: “No primeiro dia” pode se referir especificamente ao sacrifício da Páscoa, no início da festa, embora o hebraico não diga explicitamente “cordeiro pascal” neste versículo.
    reason: leitura_alternativa
lexical_decisions:
- source_word: יֵרָאֶה
  choice: se verá
  rationale: O nifal de ראה tem sentido passivo. A construção impessoal preserva a forma e a força da proibição em português natural.
- source_word: שְׂאֹר
  choice: fermento
  rationale: No contexto da Páscoa, designa o agente fermentador. “Fermento” é claro e mais abrangente que uma referência específica ao fermento biológico moderno.
- source_word: בְּכָל גְּבֻלְךָ
  choice: em todo o seu território
  rationale: גְּבוּל pode indicar limite ou território; aqui a expressão define a extensão geográfica da proibição.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Expressa de modo idiomático a duração indicada pelo hebraico.
- source_word: יָלִין
  choice: ficará durante a noite
  rationale: O verbo לין indica passar ou permanecer durante a noite; a formulação comunica claramente a proibição de conservar a carne até o dia seguinte.
- source_word: מִן הַבָּשָׂר
  choice: nada da carne
  rationale: A construção partitiva מִן pede aqui “nada da”; בָּשָׂר significa literalmente “carne” e é termo comum em contextos sacrificiais.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: que você sacrificar
  rationale: Em contexto cultual, זבח descreve o abate sacrificial, bem expresso pelo verbo “sacrificar”.
- source_word: בָּעֶרֶב
  choice: ao entardecer
  rationale: Equivalente temporal natural que mantém a referência ao período vespertino.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: no primeiro dia
  rationale: O texto hebraico diz apenas “no primeiro dia”; evita-se acrescentar “da festa” ou identificar explicitamente o sacrifício pascal.
- source_word: לַבֹּקֶר
  choice: até a manhã
  rationale: Neste contexto, לְ marca o limite temporal até o qual a carne não deve permanecer.
theological_decisions:
- issue: Referente da carne sacrificada no primeiro dia
  choice: Manter a referência genérica à carne sacrificada, sem especificar “cordeiro pascal” no texto principal.
  alternative: Entender a expressão especificamente como referência ao sacrifício ou cordeiro da Páscoa, ou de modo mais amplo aos sacrifícios festivos do início da celebração.
  rationale: O hebraico menciona somente “a carne que você sacrificar ao entardecer, no primeiro dia”. A tradução preserva essa formulação e deixa em aberto a extensão exata da referência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você/seu” representa o destinatário singular do hebraico sem recorrer ao registro hoje menos corrente de “tu/teu”. Mantém-se a ordem lógica do original e sua ambiguidade quanto ao sacrifício mencionado.
