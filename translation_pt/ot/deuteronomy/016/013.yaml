base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: pt
  text: Celebre a Festa das Cabanas durante sete dias[a], quando recolher o produto da sua eira e do seu lagar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também chamada “Festa dos Tabernáculos” ou “Festa das Tendas”. O termo hebraico se refere literalmente a cabanas ou abrigos temporários.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: Festa das Cabanas
  rationale: חַג designa uma festa religiosa, e סֻכּוֹת significa literalmente cabanas ou abrigos temporários. “Festa das Cabanas” comunica o sentido concreto em português atual sem confundir essas estruturas com o santuário.
- source_word: תַּעֲשֶׂה לְךָ
  choice: Celebre
  rationale: Embora עשה signifique literalmente “fazer”, com חַג a expressão significa realizar, observar ou celebrar uma festa. O imperativo “Celebre” transmite com naturalidade a obrigação dirigida ao israelita.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A formulação expressa de maneira natural e precisa a duração indicada pelo hebraico.
- source_word: בְּאָסְפְּךָ
  choice: quando recolher
  rationale: A preposição בְּ com o infinitivo construto tem valor temporal. “Quando recolher” preserva essa relação sem impor a leitura mais específica de que a festa começaria somente depois de concluído todo o recolhimento.
- source_word: מִגָּרְנְךָ
  choice: o produto da sua eira
  rationale: גֹּרֶן é a eira, mas o verbo “recolher” toma como objeto implícito aquilo que dela provém. A explicitação de “o produto” conserva a imagem concreta e produz uma frase natural em português.
- source_word: וּמִיִּקְבֶךָ
  choice: e do seu lagar
  rationale: יֶקֶב designa o lagar ou recipiente associado à prensagem das uvas. “Lagar” é o equivalente português direto e tradicional, mantendo o cenário agrícola.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega-se “você” de forma implícita, mediante o imperativo “Celebre” e os possessivos “sua/seu”. “Eira” e “lagar” preservam as imagens agrícolas do hebraico; embora sejam termos menos cotidianos, continuam precisos e reconhecíveis no registro bíblico.
