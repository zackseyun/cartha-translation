  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: pt
  text: Então celebre a Festa das Semanas para Yahweh, seu Deus, com uma oferta voluntária[a] que você mesmo dará, em proporção à bênção que Yahweh, seu Deus, lhe conceder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “com a medida da oferta voluntária de sua mão, que você dará”. A expressão hebraica ressalta que a dádiva é voluntária, pessoal e proporcional ao que Deus concedeu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Então celebre
  rationale: Com חַג, o verbo עשה significa celebrar ou observar uma festa; “então” expressa naturalmente a sequência contextual do waw.
- source_word: חַג שָׁבֻעוֹת
  choice: a Festa das Semanas
  rationale: Nome tradicional e claro da festa de peregrinação, ligado à contagem das semanas no contexto.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para Yahweh, seu Deus
  rationale: A preposição ל indica dedicação ou orientação a Yahweh; o nome divino é transliterado conforme a diretriz fornecida.
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: com uma oferta voluntária de sua própria mão
  rationale: A construção hebraica é incomum e pode envolver medida, suficiência ou tributo. O texto principal preserva a voluntariedade e o caráter pessoal da dádiva, enquanto a nota registra explicitamente a leitura proporcional.
- source_word: אֲשֶׁר תִּתֵּן
  choice: dada
  rationale: A forma participial em português integra com naturalidade a oração relativa “que você dará” sem alterar sua referência à oferta.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: na medida em que ... o abençoar
  rationale: A expressão estabelece a bênção divina como medida proporcional da oferta; o futuro do subjuntivo é natural em instrução legal geral.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Mantém a fórmula pactual repetida e o nome divino de modo consistente.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: A fonte emprega diretamente o Tetragrama, e a camada inglesa auditada determina “Yahweh”; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Relação entre a oferta voluntária e a bênção recebida
  choice: A dádiva é voluntária, mas sua medida corresponde à bênção concedida por Deus.
  alternative: Uma quantia fixa obrigatória ou uma oferta sem qualquer noção de proporcionalidade.
  rationale: נִדְבָה ressalta a voluntariedade, enquanto מִסַּת e כַּאֲשֶׁר indicam medida ou proporção. A tradução conserva ambas as ideias sem transformar a passagem em fórmula matemática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular de segunda pessoa foi vertido por “você/seu/o”, evitando formas regionais marcadas. “De sua própria mão” conserva de modo inteligível a imagem hebraica da participação pessoal; a nota preserva a ambiguidade lexical de מִסַּת.
