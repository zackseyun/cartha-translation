    issue: Tempo verbal «lhe tiver dado»
    rationale: O hebraico אֲשֶׁר נָתַן לָךְ traz um perfeito que se refere à bênção concedida por Yahweh. O futuro perfeito português sugere indevidamente uma dádiva futura e não é exigido pelo imperativo precedente.
  - severity: low
    issue: Pessoa e referência em «seu Deus, lhe»
    rationale: Embora possível em tratamento formal, «seu» pode ser ambíguo em português brasileiro e a combinação é menos transparente. «Teu Deus, te deu» explicita a segunda pessoa singular presente no sufixo hebraico.
  revised_text: Cada homem dará conforme o que sua mão puder oferecer[a], conforme a bênção que Yahweh, teu Deus, te deu.
  revised_footnotes:
