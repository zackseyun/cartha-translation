base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: pt
  text: Cada homem dará conforme o que sua mão puder oferecer[a], conforme a bênção que Yahweh, teu Deus, te deu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “conforme o dom de sua mão”; expressão que se refere ao que cada um tem condições de oferecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Cada homem
  rationale: O substantivo singular tem sentido distributivo no contexto; “cada homem” preserva a referência masculina explícita e expressa essa distribuição.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: conforme o que sua mão puder oferecer
  rationale: A preposição כְּ indica proporção, e a expressão literal “o dom de sua mão” é uma maneira idiomática de falar do que está ao alcance de alguém oferecer. A formulação mantém a imagem da mão sem soar obscura em português.
- source_word: כְּבִרְכַּת
  choice: conforme a bênção
  rationale: 'A preposição כְּ volta a indicar proporção: a oferta deve corresponder à bênção recebida.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a fórmula pactual dirigida ao indivíduo no singular.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: que ... lhe tiver dado
  rationale: A construção retoma “bênção”; o futuro composto ajusta naturalmente a ação já realizada por Deus à orientação futura do contexto, sem mudar seu sentido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A imagem hebraica da mão foi parcialmente preservada e esclarecida no próprio texto; a nota registra a forma mais literal.
