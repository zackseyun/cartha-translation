  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: pt
  text: 'Três vezes por ano, todos os homens dentre vocês comparecerão[a] diante de Yahweh, o Deus de vocês, no lugar que ele escolher: na Festa dos Pães sem Fermento, na Festa das Semanas e na Festa das Cabanas[b]. Ninguém comparecerá diante de Yahweh de mãos vazias[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão vistos diante de Yahweh”. A forma verbal hebraica é literalmente passiva ou reflexiva, mas, neste contexto, funciona como expressão para apresentar-se diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: A “Festa das Cabanas” é tradicionalmente chamada de “Festa dos Tabernáculos”.
    reason: alternative_reading
  - marker: c
    text: “De mãos vazias” significa comparecer sem uma dádiva ou oferta.
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: comparecerão
  rationale: O nifal de ראה pode ser entendido literalmente como “ser visto”, mas aqui funciona como expressão cultual para apresentar-se diante de Deus. “Comparecerão” é natural em português e conserva o caráter obrigatório da peregrinação.
- source_word: כָל זְכוּרְךָ
  choice: todos os homens entre vocês
  rationale: A expressão hebraica especifica os indivíduos do sexo masculino sujeitos à obrigação legal. A tradução preserva essa delimitação sem recorrer ao pouco natural “todos os seus machos”.
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: diante de Yahweh, seu Deus
  rationale: A expressão “à face de” indica estar na presença de alguém. “Diante de” comunica o idioma com clareza e mantém o nome divino e a relação pactual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: no lugar que ele escolher
  rationale: Mantém a ação divina de escolher o lugar de culto e o valor prospectivo do imperfeito no contexto.
- source_word: חַג הַמַּצּוֹת
  choice: Festa dos Pães sem Fermento
  rationale: Expressa em linguagem corrente o sentido de מַצּוֹת, pães preparados sem fermento, e preserva o nome festivo.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: Festa das Semanas
  rationale: Reproduz o nome hebraico da festa sem introduzir o nome posterior “Pentecostes”.
- source_word: חַג הַסֻּכּוֹת
  choice: Festa das Cabanas
  rationale: “Cabanas” traduz de modo transparente סֻכּוֹת e é mais imediatamente compreensível do que o termo tradicional “Tabernáculos”.
- source_word: וְלֹא יֵרָאֶה אֶת־פְּנֵי יְהוָה רֵיקָם
  choice: Ninguém comparecerá diante de Yahweh de mãos vazias
  rationale: A formulação portuguesa transmite o sentido cultual de não se apresentar sem a dádiva ou oferta requerida, sem especificar além do texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título.
- issue: Obrigação masculina em כָל זְכוּרְךָ
  choice: todos os homens entre vocês
  alternative: todos vocês; todo o povo
  rationale: O hebraico delimita expressamente aos homens a obrigação de comparecer nas festas. A tradução não neutraliza essa referência legal.
- issue: Ambiguidade formal de יֵרָאֶה
  choice: comparecerão, com nota sobre “serão vistos”
  alternative: serão vistos diante de Yahweh
  rationale: No contexto, a forma verbal funciona idiomaticamente como comparecer ou apresentar-se perante Deus; a nota preserva sua forma passiva/reflexiva e a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Comparecer” preserva o tom jurídico-cultual; os nomes das festas são transparentes, e o nome divino é transliterado como “Yahweh”. Todos os marcadores de nota aparecem no texto na ordem correspondente.
