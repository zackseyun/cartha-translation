  yaml_path: translation/ot/deuteronomy/016/009.yaml
  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: pt
  text: Conte sete semanas[a]. A partir do momento em que se puser a foice no cereal em pé, comece a contar sete semanas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «sete setes» (isto é, sete grupos de sete). Neste contexto, o termo hebraico designa semanas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת
  choice: sete semanas
  rationale: שָׁבֻעֹת é o termo hebraico normal para semanas. No contexto do calendário festivo, “sete semanas” comunica naturalmente o sentido, sem obscurecer a estrutura da contagem.
- source_word: תִּסְפָּר לָךְ
  choice: Conte para você
  rationale: O imperfeito qal de ספר tem força instrutiva, e לָךְ explicita a referência pessoal. A formulação conserva ambos os elementos, embora em português também fosse possível dizer apenas “Conte”.
- source_word: מֵהָחֵל
  choice: Desde que ... começar
  rationale: A preposição מִן com o infinitivo construto indica o ponto inicial da contagem; “Desde que ... começar” reproduz essa relação temporal com clareza.
- source_word: חֶרְמֵשׁ
  choice: a foice
  rationale: חֶרְמֵשׁ designa a foice usada na colheita; o artigo definido é natural na referência genérica ao início da ceifa.
- source_word: בַּקָּמָה
  choice: ao cereal em pé
  rationale: קָמָה indica o cereal ou a plantação ainda em pé. “Cereal em pé” é preciso e compreensível, evitando restringir o referente a uma espécie não nomeada no hebraico.
- source_word: תָּחֵל לִסְפֹּר
  choice: comece a contar
  rationale: A construção com o hifil de חלל seguido do infinitivo de ספר exprime o início da ação de contar; o imperativo português transmite naturalmente a força instrutiva do hebraico.
- source_word: שִׁבְעָה שָׁבֻעוֹת
  choice: sete semanas
  rationale: A repetição foi mantida de modo consistente, como no texto hebraico.
