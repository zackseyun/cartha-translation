revisions:
- from: Conte para você sete semanas. Desde que a foice começar a ser aplicada ao cereal em pé, comece a contar sete semanas.
  to: Conte sete semanas[a]. A partir do momento em que se puser a foice no cereal em pé, comece a contar sete semanas.
  rationale: A revisão torna explícito o marco inicial da contagem e substitui uma construção passiva pouco natural por uma expressão idiomática que preserva a imagem da foice sendo posta no cereal em pé. Mantém-se a repetição de «sete semanas» e acrescenta-se a nota lexical correspondente ao registro de auditoria em inglês.
