translation_notes:
  register: Português moderno, claro e digno, com construção imperativa natural. “Cereal em pé” preserva a generalidade agrícola de קָמָה. A locução “ser aplicada” conserva a imagem hebraica da foice iniciando seu trabalho sobre a plantação, sem acrescentar uma data ou identificação ritual não expressa no versículo.
