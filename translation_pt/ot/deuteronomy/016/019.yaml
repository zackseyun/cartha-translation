  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: pt
  text: Não perverta a justiça, não mostre parcialidade[a] e não aceite suborno, pois o suborno cega os olhos dos sábios e distorce as palavras dos justos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “reconhecer rostos”, expressão idiomática que significa favorecer alguém ou agir com parcialidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “distorce a causa dos justos”. O hebraico pode referir-se às palavras deles ou, no contexto jurídico, à causa que apresentam.
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: perverta a justiça
  rationale: O hifil de נטה com מִשְׁפָּט expressa desviar ou torcer o julgamento correto. “Perverter a justiça” preserva com naturalidade a força jurídica e moral da expressão.
- source_word: תַכִּיר פָּנִים
  choice: mostre parcialidade
  rationale: A expressão significa literalmente “reconhecer rostos”, mas funciona como um idiomatismo jurídico para favorecer alguém. “Mostrar parcialidade” comunica claramente esse sentido.
- source_word: שֹׁחַד
  choice: suborno
  rationale: Neste contexto jurídico, designa um pagamento corrupto destinado a influenciar uma decisão; “suborno” transmite essa força com precisão.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: cega os olhos dos sábios
  rationale: A formulação mantém a imagem vívida e transparente do hebraico, bem como o efeito corruptor atribuído ao suborno.
- source_word: חֲכָמִים
  choice: os sábios
  rationale: O plural masculino é genérico e descreve pessoas sábias; “os sábios” é a forma portuguesa natural e tradicional, sem restringir necessariamente a referência a homens.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: distorce as palavras dos justos
  rationale: סלף significa torcer ou distorcer. דִּבְרֵי pode indicar palavras, declarações ou, no contexto jurídico, a causa defendida. O texto principal conserva o sentido lexical direto, e a nota registra a ambiguidade forense.
- source_word: צַדִּיקִם
  choice: os justos
  rationale: Aqui a palavra pode referir-se aos moralmente justos ou aos que têm razão em uma causa. “Os justos” preserva essa amplitude melhor do que “os inocentes”.
