base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: pt
  text: 'Pois nunca deixará de haver necessitados na terra. Por isso, eu lhe ordeno: “Abra a sua mão sem reservas ao seu irmão[a], ao pobre[b] e ao necessitado na sua terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu compatriota israelita”. O hebraico diz “seu irmão”, empregando linguagem de parentesco da aliança com sentido representativo.
    reason: lexical_alternative
  - marker: b
    text: O termo traduzido por “pobre” também pode designar alguém humilde, de condição baixa ou afligido.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a ordem anterior e mantém de modo natural a relação explicativa.
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: nunca deixará de haver necessitados
  rationale: A forma negativa com o imperfeito descreve uma realidade contínua; o singular hebraico tem sentido genérico ou coletivo.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: no meio da terra
  rationale: Preserva o valor de קֶרֶב, ‘meio’, e entende הָאָרֶץ no contexto deuteronômico como a terra da aliança, não o planeta em abstrato.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa com clareza a conclusão prática derivada da afirmação anterior.
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: 'eu lhe ordeno:'
  rationale: Mantém a força direta e presente da ordem; os dois-pontos representam de forma idiomática o introdutor hebraico לֵאמֹר.
- source_word: פָּתֹחַ תִּפְתַּח אֶת יָדְךָ
  choice: Abra de todo a mão
  rationale: A construção intensiva exige uma abertura decidida e plena. A expressão conserva a metáfora hebraica da mão aberta para a generosidade.
- source_word: לְאָחִיךָ
  choice: para seu irmão
  rationale: Preserva a linguagem masculina singular de parentesco da aliança, que neste contexto representa o compatriota israelita.
- source_word: לַעֲנִיֶּךָ
  choice: para o pobre
  rationale: עָנִי pode designar alguém pobre, humilde ou afligido. ‘Pobre’ é claro no contexto socioeconômico, sem eliminar a amplitude lexical, registrada em nota.
- source_word: וּלְאֶבְיֹנְךָ
  choice: e para o necessitado
  rationale: Distingue אֶבְיוֹן do termo precedente e ressalta a condição de carência.
- source_word: בְּאַרְצֶךָ
  choice: em sua terra
  rationale: Reflete o âmbito concreto da terra de Israel pressuposto no discurso de Deuteronômio.
theological_decisions:
- issue: Linguagem representativa de parentesco
  choice: seu irmão
  alternative: seu compatriota israelita
  rationale: O hebraico emprega linguagem de parentesco no masculino singular com força representativa dentro da comunidade da aliança. A tradução mantém essa imagem e explica seu alcance em nota.
- issue: Âmbito de הָאָרֶץ e אַרְצֶךָ
  choice: terra / sua terra
  alternative: país / seu país; mundo
  rationale: O contexto imediato é a terra da aliança dada a Israel. ‘Terra’ conserva esse cenário sem transformar a frase em uma afirmação geográfica abstrata sobre o planeta.
- issue: Distinção entre עָנִי e אֶבְיוֹן
  choice: pobre e necessitado
  alternative: afligido e pobre
  rationale: Os termos se sobrepõem, mas não são idênticos. A dupla escolhida é natural em português e mantém alguma diferenciação sem impor categorias sociais rígidas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora da mão aberta foi preservada; a intensidade da construção hebraica aparece em “de todo”. Os marcadores de nota foram posicionados junto às palavras efetivamente comentadas.
