  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: pt
  text: Contudo[a], não haverá nenhum pobre entre vocês, porque Yahweh certamente os abençoará na terra que Yahweh, o Deus de vocês, lhes dá como herança para que tomem posse dela,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “No entanto”, “Todavia” ou “Exceto que”. O termo hebraico אֶפֶס introduz uma ressalva à instrução anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: Contudo
  rationale: Introduz uma ressalva ou limitação à instrução anterior sobre a remissão das dívidas; “contudo” expressa naturalmente essa mudança discursiva sem tornar o contraste absoluto.
- source_word: אֶבְיוֹן
  choice: pobre
  rationale: Designa alguém em necessidade econômica; “pobre” é amplo, claro e natural em português.
- source_word: כִּי
  choice: porque
  rationale: O segundo כִּי apresenta a bênção de Yahweh como fundamento da afirmação anterior, e “porque” explicita adequadamente a relação causal.
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: certamente os abençoará
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação; “certamente” preserva a ênfase sem acrescentar a ideia específica de abundância.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נֹתֵן
  choice: dá
  rationale: O particípio pode apresentar a dádiva como ação em curso, iminente ou característica. No contexto da promessa, o presente “dá” é natural e conserva essa perspectiva.
- source_word: נַחֲלָה
  choice: herança
  rationale: Preserva o sentido jurídico e pactual da terra concedida como porção a Israel.
- source_word: לְרִשְׁתָּהּ
  choice: para que tomem posse dela
  rationale: Expressa claramente a finalidade e o sentido de ירשׁ, evitando a repetição pouco natural de “herdar” logo após “herança”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação entre a ausência de pobres e a bênção divina
  choice: Manter a formulação prospectiva e causal do versículo
  alternative: Transformá-la em garantia absoluta e incondicional de que jamais haveria pobreza
  rationale: O versículo afirma que não deveria haver pobres porque Yahweh certamente abençoaria o povo; o contexto seguinte acrescenta condições e reconhece a persistência da pobreza. A tradução não resolve essa tensão por meio de explicação inserida no texto.
translation_notes:
  register: Português moderno, digno e acessível, com plural brasileiro (“vocês”, “os”, “lhes”). “Não deverá haver” comunica uma expectativa normativa sem converter a frase simplesmente em previsão. A vírgula final foi mantida porque o versículo continua sintaticamente no versículo seguinte.
