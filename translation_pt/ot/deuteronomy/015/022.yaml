  text: בִּ/שְׁעָרֶ֖י/ךָ תֹּאכֲלֶ֑/נּוּ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יַחְדָּ֔ו כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: pt
  text: Você poderá comê-lo dentro das suas cidades[a]; tanto a pessoa ritualmente impura como a pura poderão comê-lo[b], como se come a gazela e o cervo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dentro dos seus portões”, expressão que se refere às cidades ou comunidades locais.'
    reason: cultural_note
  - marker: b
    text: Isto é, tanto quem estivesse ritualmente impuro como quem estivesse ritualmente puro poderia comer dessa carne.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: dentro das suas cidades
  rationale: A expressão significa literalmente “dentro dos seus portões”, mas funciona como idioma para as cidades ou comunidades sob jurisdição local. A tradução comunica diretamente o sentido, e a nota preserva a imagem hebraica.
- source_word: תֹּאכֲלֶנּוּ
  choice: Você poderá comê-lo
  rationale: O imperfeito na segunda pessoa masculina singular, com objeto masculino singular, tem força permissiva neste contexto e retoma o animal mencionado anteriormente.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: tanto a pessoa ritualmente impura como a pura
  rationale: Os termos indicam condição ritual, não caráter moral. A inclusão de “ritualmente” evita uma leitura ética equivocada, enquanto “pessoa” explicita o referente humano natural em português.
- source_word: יַחְדָּו
  choice: tanto... como
  rationale: Nesse contexto, o advérbio inclui igualmente as duas categorias, sem exigir que comam simultaneamente.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: como se come a gazela e o cervo
  rationale: צְבִי designa a gazela, e אַיָּל, um cervo, possivelmente o macho. A formulação explicita que a comparação diz respeito ao modo permissível de consumir esses animais, evitando a impressão de que pessoas comem “como” os animais comem.
theological_decisions:
- issue: Condição ritual dos participantes
  choice: Explicitar “ritualmente impura” no texto
  alternative: “a impura e a pura”
  rationale: A oposição hebraica trata da condição cerimonial de pessoas, não de pureza moral. A explicitação oferece clareza moderna sem introduzir uma distinção denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para o singular hebraico e “cidades” para tornar natural o idioma dos portões, preservado em nota. A repetição de “poderá” mantém explícita a permissão para comer e para a participação de ambas as categorias rituais.
