  source_fidelity: A tradução preserva adequadamente a força permissiva de תֹּאכֲלֶנּוּ, o sentido idiomático local de בִּשְׁעָרֶיךָ, a oposição de condição ritual entre “impura” e “pura”, a inclusão igual de ambas as categorias em יַחְדָּו e a comparação com a gazela e o cervo. “Como se come a gazela e o cervo” torna explícita, de modo legítimo e contextual, a elipse hebraica quanto ao consumo de caça.
  naturalness: O português é claro, moderno e fluente. “Dentro das suas cidades” comunica naturalmente o sentido do idioma hebraico, enquanto a nota conserva a formulação literal. A construção “tanto ... como ... poderão” é natural e deixa claro que ambas as pessoas podem participar.
  terminology: “Ritualmente impura” evita corretamente uma leitura moral de הטמא. Embora “pura” não repita “ritualmente”, o paralelismo imediato torna inequívoco que também se trata de condição ritual. “Gazela” e “cervo” são escolhas adequadas e acessíveis.
