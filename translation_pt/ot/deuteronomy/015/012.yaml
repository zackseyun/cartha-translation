  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: pt
  text: Se um irmão seu, homem hebreu ou mulher hebreia, for vendido a você e o servir durante seis anos, no sétimo ano você deverá deixá-lo partir livre, para longe de você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Depois de mencionar “homem hebreu ou mulher hebreia”, o hebraico prossegue com uma forma masculina singular, usada aqui de modo genérico para a pessoa libertada. A lei se aplica tanto ao homem hebreu quanto à mulher hebreia.
    reason: Esclarecer que o pronome masculino reproduz a forma gramatical hebraica e não restringe o alcance da lei.
lexical_decisions:
- source_word: יִמָּכֵר
  choice: for vendido
  rationale: Mantém o valor passivo do nifal sem especificar se a pessoa vendeu a si mesma ou foi vendida por outro mecanismo.
- source_word: אָחִיךָ
  choice: um irmão seu
  rationale: Preserva a linguagem familiar e pactual do hebraico, sem reduzi-la a uma designação apenas étnica ou social.
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: homem hebreu ou mulher hebreia
  rationale: Expressa distintamente as formas hebraicas masculina e feminina, que identificam a pessoa como hebreia e não são, por si mesmas, os termos usuais para escravo ou escrava.
- source_word: וַעֲבָדְךָ
  choice: e o servir
  rationale: Traduz עבד pelo sentido amplo de prestar serviço, adequado ao contexto legal, sem acrescentar detalhes sobre a natureza do trabalho.
- source_word: שֵׁשׁ שָׁנִים
  choice: durante seis anos
  rationale: Representa diretamente a duração indicada no texto.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: no sétimo ano
  rationale: Mantém a sequência temporal da obrigação legal em português natural.
- source_word: תְּשַׁלְּחֶנּוּ
  choice: você deverá deixá-lo ir embora
  rationale: No contexto de alforria, 'deixar ir' comunica naturalmente o sentido de שלח; 'ir embora' também preserva a ideia de afastamento presente em מֵעִמָּךְ.
- source_word: חָפְשִׁי
  choice: como pessoa livre
  rationale: Torna explícito que se trata da condição jurídica e social de liberdade, não apenas de uma saída sem impedimento.
- source_word: מֵעִמָּךְ
  choice: ir embora
  rationale: A locução portuguesa comunica de modo idiomático que a pessoa deixa o domínio e o serviço do destinatário, evitando o pouco natural 'livre de junto de você'.
theological_decisions:
- issue: Forma masculina singular após a menção de homem hebreu ou mulher hebreia
  choice: Manter a forma masculina singular em 'o servir' e 'deixá-lo', com esclarecimento em nota.
  alternative: Empregar formas duplas ('servir você... deixá-lo ou deixá-la') ou reformular no plural inclusivo.
  rationale: O hebraico menciona explicitamente tanto o homem como a mulher, mas prossegue com formas masculinas singulares. A tradução conserva essa característica gramatical sem sugerir que a lei se limite aos homens.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção legal usa 'você deverá' para comunicar obrigação, e 'como pessoa livre' explicita naturalmente a condição expressa por חָפְשִׁי.
