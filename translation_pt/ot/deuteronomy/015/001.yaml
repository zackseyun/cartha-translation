  text: At the end of every seven years you shall make a release[a].
translation:
  language: pt
  text: Ao fim de cada período de sete anos, vocês farão uma remissão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma liberação» ou «um cancelamento»; o termo hebraico שְׁמִטָּה refere-se à remissão prevista na lei das dívidas do sétimo ano.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: Ao fim de
  rationale: Reproduz o valor temporal da expressão hebraica sem decidir de modo excessivamente preciso se o ato ocorre somente depois do período ou quando o ciclo de sete anos chega ao fim.
- source_word: שֶׁבַע שָׁנִים
  choice: cada sete anos
  rationale: Embora a expressão signifique literalmente «sete anos», o contexto legal indica uma instituição recorrente; «cada sete anos» comunica esse caráter cíclico em português natural.
- source_word: תַּעֲשֶׂה
  choice: vocês deverão realizar
  rationale: O verbo עשה é amplo, «fazer» ou «realizar». Com o substantivo «remissão», «realizar» expressa de modo natural a promulgação da medida e conserva a força prescritiva da forma verbal hebraica. O plural «vocês» torna explícito em português corrente o destinatário coletivo indicado pelo singular hebraico dirigido a Israel.
- source_word: שְׁמִטָּה
  choice: uma remissão
  rationale: O termo designa a liberação ou o deixar cair uma obrigação e, neste contexto, refere-se à remissão de dívidas do sétimo ano. «Remissão» é conciso e preserva amplitude suficiente para que os versículos seguintes definam a medida.
