  text: וְ/לָקַחְתָּ֣ אֶת הַ/מַּרְצֵ֗עַ וְ/נָתַתָּ֤ה בְ/אָזְנ/וֹ֙ וּ/בַ/דֶּ֔לֶת וְ/הָיָ֥ה לְ/ךָ֖ עֶ֣בֶד עוֹלָ֑ם וְ/אַ֥ף לַ/אֲמָתְ/ךָ֖ תַּעֲשֶׂה כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your slave permanently. And you shall do the same for your female slave.
translation:
  language: pt
  text: Então pegue o furador e, com ele, perfure a orelha do escravo contra a porta; assim ele será seu escravo permanentemente[a]. Faça o mesmo com sua escrava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para sempre”; neste contexto jurídico, também pode ter o sentido de “por toda a vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: o furador
  rationale: מַרְצֵעַ designa um instrumento pontiagudo usado para perfurar. “Furador” é claro no português atual e evita o termo menos conhecido “sovela”.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: com ele, perfure a orelha do escravo contra a porta
  rationale: A formulação hebraica diz literalmente para pôr o instrumento na orelha dele e na porta. No contexto ritual, trata-se de perfurar a orelha apoiada contra a porta; a redação escolhida torna a ação compreensível sem acrescentar finalidade ao rito.
- source_word: עֶבֶד
  choice: escravo
  rationale: Neste contexto jurídico, o termo indica uma condição formal de sujeição, e “escravo” preserva essa força social e legal melhor que “servo”.
- source_word: עוֹלָם
  choice: permanentemente
  rationale: Aqui עוֹלָם expressa uma condição duradoura no âmbito jurídico. “Permanentemente” preserva essa força sem sugerir necessariamente uma duração metafisicamente infinita; a alternativa literal é registrada em nota.
- source_word: אֲמָתְךָ
  choice: sua escrava
  rationale: אָמָה designa uma escrava ou serva. “Escrava” mantém a coerência com עֶבֶד e explicita a condição jurídica comum aos dois.
- source_word: וְאַף ... תַּעֲשֶׂה כֵּן
  choice: Faça o mesmo
  rationale: A expressão estende à escrava a instrução anterior. “Faça o mesmo” é natural, direta e conserva o valor aditivo da frase.
theological_decisions:
- issue: Terminologia da escravidão na legislação israelita
  choice: Empregar “escravo” e “escrava”
  alternative: “servo” e “serva”
  rationale: O versículo trata de uma condição vinculante formalizada por um rito jurídico. A terminologia mais forte preserva a realidade social do texto, sem suavizá-la nem equipará-la automaticamente a formas posteriores de escravidão.
- issue: Alcance temporal de עוֹלָם
  choice: Traduzir por “permanentemente”, com nota sobre a forma literal
  alternative: “para sempre” ou “por toda a vida”
  rationale: O termo admite a ideia de duração indefinida ou permanente, mas, neste contexto legal, “para sempre” pode ser entendido como infinitude absoluta. A tradução e a nota conservam a tensão lexical sem decidir além do que o texto permite.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Furador” foi preferido a “sovela” por ser mais acessível; a construção “contra a porta” comunica de modo conciso o procedimento indicado pelo hebraico.
