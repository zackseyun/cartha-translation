  text: וְ/כִֽי תְשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ לֹ֥א תְשַׁלְּחֶ֖/נּוּ רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: pt
  text: E, quando você o deixar partir livre de você[a], não o mande embora de mãos vazias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, se você o deixar partir livre de você”. A conjunção hebraica pode ser entendida em sentido condicional (“se”) ou temporal (“quando”).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: E, quando
  rationale: A combinação pode introduzir uma oração temporal ou condicional. Neste contexto legal, “quando” expressa de modo natural a libertação prevista, enquanto a alternativa “se” é preservada em nota.
- source_word: תְשַׁלְּחֶנּוּ
  choice: você o deixar partir / o mande embora
  rationale: O piel de שלח com sufixo masculino singular significa mandar embora, despedir ou deixar partir. A pequena variação em português evita uma formulação pouco natural, sem mudar o sentido repetido do hebraico.
- source_word: חָפְשִׁי
  choice: livre
  rationale: O adjetivo indica liberdade em contraste com a servidão; “livre” é direto e adequado ao contexto de emancipação.
- source_word: מֵעִמָּךְ
  choice: de sua casa
  rationale: A expressão significa literalmente “de junto de você”. No contexto doméstico da servidão, “de sua casa” comunica naturalmente a separação, embora seja um pouco mais explícito que o hebraico.
- source_word: לֹא
  choice: não
  rationale: Com o imperfeito, a negação expressa uma proibição legal; em português, o imperativo negativo “não o mande” transmite essa força com naturalidade.
- source_word: רֵיקָם
  choice: de mãos vazias
  rationale: O advérbio significa “vazio” ou “sem nada”; a expressão idiomática portuguesa comunica que a pessoa liberta não deve sair sem provisões.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” no singular. A formulação mantém o caráter jurídico da instrução sem recorrer a linguagem excessivamente arcaica.
