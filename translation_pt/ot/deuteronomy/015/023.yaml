  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: pt
  text: Apenas não coma o sangue dele; derrame-o no chão como água.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Expressa a restrição à permissão anterior de modo conciso, preservando a força exceptiva do hebraico.
- source_word: אֶת דָּמוֹ
  choice: o sangue dele
  rationale: O sufixo masculino singular remete ao animal mencionado no contexto; esta formulação é clara e natural em português e evita a interpretação adicional de «sangue vital».
- source_word: לֹא תֹאכֵל
  choice: não coma
  rationale: O presente do subjuntivo com valor imperativo negativo comunica diretamente a proibição legal em português moderno.
- source_word: עַל הָאָרֶץ
  choice: no chão
  rationale: Neste contexto concreto, indica a superfície do solo sobre a qual o sangue deve ser derramado.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: derrame-o
  rationale: Reproduz o ato de verter o sangue e mantém explícito o objeto pronominal.
- source_word: כַּמָּיִם
  choice: como água
  rationale: Preserva de maneira direta e idiomática a comparação hebraica.
theological_decisions:
- issue: Tratamento do sangue na lei alimentar
  choice: Traduzir de forma direta a proibição de consumir o sangue do animal e a ordem de derramá-lo.
  alternative: Empregar «sangue vital» para explicitar a associação entre sangue e vida.
  rationale: O versículo apresenta a ordem concreta, mas não enuncia aqui sua fundamentação teológica; a tradução não deve acrescentá-la.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção «Somente não coma» conserva a ligação restritiva com a permissão do contexto anterior; os imperativos mantêm a instrução legal direta.
