  text: כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בֵּֽרַכְ/ךָ֔ כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/הַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְ/אַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּ/מָֽשַׁלְתָּ֙ בְּ/גוֹיִ֣ם רַבִּ֔ים וּ/בְ/ךָ֖ לֹ֥א יִמְשֹֽׁלוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: pt
  text: Pois Yahweh, seu Deus, abençoou vocês, como lhes prometeu[a]. Vocês emprestarão a muitas nações, mas não tomarão emprestado; dominarão muitas nações, mas elas não dominarão vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como lhes falou”. O hebraico diz literalmente “falou”, mas, neste contexto da aliança, a expressão tem o sentido de promessa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בֵּרַכְךָ
  choice: abençoou vocês
  rationale: O perfeito hebraico apresenta a bênção como fato assegurado que fundamenta os resultados seguintes; o contexto coletivo permite explicitar o referente como plural em português.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: como lhes prometeu
  rationale: Embora דִּבֶּר signifique literalmente 'falou', no contexto da aliança a fala divina tem força de promessa; a alternativa literal é preservada em nota.
- source_word: וְהַעֲבַטְתָּ
  choice: emprestarão
  rationale: O Hifil de עבט significa conceder empréstimos; a forma simples é natural e mantém o contraste com tomar emprestado.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: O contexto é econômico e político, favorecendo 'nações' em vez de 'povos'.
- source_word: לֹא תַעֲבֹט
  choice: não tomarão emprestado
  rationale: O Qal de עבט designa receber empréstimo e forma uma antítese direta com emprestar.
- source_word: וּמָשַׁלְתָּ
  choice: dominarão
  rationale: משׁל denota exercer domínio ou governo sobre outros; 'dominar' conserva a força e permite repetir naturalmente a antítese.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: elas não dominarão vocês
  rationale: O sujeito plural retoma as muitas nações; o pronome explícito torna essa relação clara em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: Preserva por transliteração o nome da aliança presente no texto hebraico, sem substituí-lo por um título.
- issue: Força de דִּבֶּר no contexto da aliança
  choice: prometeu
  alternative: falou
  rationale: A tradução principal comunica a função contextual da fala divina como promessa, enquanto a nota mantém visível o sentido lexical mais literal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O referente hebraico está morfologicamente no singular coletivo, dirigido a Israel; empregou-se 'vocês' para tornar natural em português a referência à comunidade inteira. Mantiveram-se as duas antíteses econômicas e políticas do verso.
