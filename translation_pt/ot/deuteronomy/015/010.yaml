  text: נָת֤וֹן תִּתֵּן֙ ל֔/וֹ וְ/לֹא יֵרַ֥ע לְבָבְ/ךָ֖ בְּ/תִתְּ/ךָ֣ ל֑/וֹ כִּ֞י בִּ/גְלַ֣ל הַ/דָּבָ֣ר הַ/זֶּ֗ה יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָֽל מַעֲשֶׂ֔/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: pt
  text: Dê a ele, sem falta, e não fique com o coração pesaroso ao dar-lhe[a], pois, por causa disso, Yahweh[b], seu Deus, abençoará você em todo o seu trabalho e em tudo a que puser a mão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “não dê de má vontade”, “não fique ressentido” ou “não fique pesaroso ao dar-lhe”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz o nome divino YHWH, aqui transliterado “Yahweh”; tradicionalmente, também se traduz “SENHOR”.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “em todo envio da sua mão”; isto é, em tudo o que você empreender.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: Dê a ele, sem falta
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ordem. “Sem falta” comunica a ênfase sem acrescentar a ideia específica de quantidade ou generosidade.
- source_word: לּוֹ
  choice: a ele / dar-lhe
  rationale: O sufixo hebraico é masculino singular e retoma o necessitado mencionado no contexto imediato.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: não fique de coração pesaroso
  rationale: A expressão descreve uma reação interior negativa diante do ato de dar. A formulação conserva a imagem do coração e pode abranger pesar, relutância ou ressentimento sem limitar o sentido a apenas um deles.
- source_word: בְּתִתְּךָ לוֹ
  choice: ao dar-lhe
  rationale: A preposição com o infinitivo construto tem valor temporal ou circunstancial; “ao dar-lhe” é natural e próximo da estrutura hebraica.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: pois, por causa disso
  rationale: בגלל expressa causa, e “disso” retoma de modo natural o ato de dar ordenado na frase anterior.
- source_word: יְבָרֶכְךָ
  choice: abençoará você
  rationale: ברך é o verbo comum para “abençoar”; o objeto singular da bênção é mantido explicitamente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: em todo o seu trabalho
  rationale: מעשה abrange aquilo que a pessoa faz ou produz; “trabalho” se ajusta ao contexto econômico e é corrente em português.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: em tudo a que puser a mão
  rationale: A expressão idiomática portuguesa comunica o sentido de toda atividade empreendida, preservando também a imagem hebraica da mão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Gênero e número do destinatário da dádiva
  choice: a ele / lhe
  alternative: à pessoa necessitada
  rationale: O hebraico usa um pronome masculino singular, que retoma o necessitado do contexto. A tradução conserva essa forma sem ampliar ou neutralizar o referente.
- issue: Relação entre a dádiva e a bênção divina
  choice: por causa disso ... abençoará
  alternative: por isso ... abençoará
  rationale: A relação causal explícita no hebraico é mantida sem explicar a bênção como mérito, recompensa contratual ou princípio automático além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O tratamento por “você” torna explícito o singular do hebraico. A formulação “de coração pesaroso” preserva a imagem semítica e a amplitude da reação interior; “em tudo a que puser a mão” verte o idioma final de modo natural, com esclarecimento literal em nota.
