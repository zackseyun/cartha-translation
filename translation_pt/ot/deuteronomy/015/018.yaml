base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: pt
  text: Não considere penoso deixá-lo partir livre de você, pois o serviço que ele lhe prestou durante seis anos valeu o equivalente ao dobro do salário de um trabalhador contratado.[a] E Yahweh, seu Deus, abençoará você em tudo o que fizer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois ele lhe prestou, durante seis anos, o dobro do serviço de um trabalhador contratado”. A expressão hebraica compara os seis anos de serviço ao trabalho remunerado, podendo ser entendida em termos do valor salarial ou da quantidade de serviço.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: Não considere penoso
  rationale: O idioma hebraico, literalmente “não seja difícil aos seus olhos”, descreve algo visto como oneroso ou motivo de ressentimento. A formulação escolhida transmite essa avaliação de modo natural e digno em português.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: deixá-lo partir livre de você
  rationale: A expressão indica libertação real, não simples dispensa. “De você” conserva a relação espacial e social de מֵעִמָּךְ sem especificar além do texto se a saída é do serviço ou da casa.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: pelo equivalente ao dobro do salário de um trabalhador contratado
  rationale: מִשְׁנֶה indica uma porção dupla, e שְׂכַר שָׂכִיר é o pagamento de um trabalhador contratado. “Pelo equivalente” evita sugerir que o servo recebeu literalmente esse salário e expressa a comparação de valor, cuja construção admite outra compreensão registrada em nota.
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: ele serviu você durante seis anos
  rationale: A forma verbal enfatiza o serviço prestado; o contexto legal já estabelece a condição de servidão. “Durante” explicita naturalmente a duração em português.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: E Yahweh, seu Deus, abençoará você
  rationale: A forma verbal tem sentido promissório neste contexto. O nome divino é transliterado como “Yahweh”, preservando o nome da aliança presente no hebraico.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: em tudo o que fizer
  rationale: Tradução ampla e idiomática que abrange todas as atividades e iniciativas do destinatário.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Explicitação da condição servil no verbo עֲבָדְךָ
  choice: ele serviu você
  alternative: seu escravo serviu você; seu servo trabalhou para você
  rationale: A forma é verbal e destaca o trabalho prestado. Como a condição de servidão está estabelecida no contexto imediato da lei, não é necessário inserir aqui um substantivo que o hebraico desta oração não emprega.
- issue: Sentido da comparação מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: o serviço de seis anos equivale ao dobro do salário de um trabalhador contratado
  alternative: ele prestou o dobro do serviço de um trabalhador contratado
  rationale: A leitura principal entende a expressão como comparação do valor econômico do serviço prestado. Como a sintaxe hebraica é compacta e permite formular a comparação em termos de valor ou quantidade de serviço, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível a leitores brasileiros e compreensível internacionalmente. Emprega “você” em coerência com o singular hebraico e evita linguagem excessivamente arcaica. A nota mantém a ambiguidade real da comparação econômica.
