    issue: A cláusula «ele serviu você durante seis anos, pelo equivalente ao dobro do salário» é sintaticamente e semanticamente imprecisa.
    rationale: O hebraico compara o serviço de seis anos com «o dobro do salário de um trabalhador contratado». Em português, «serviu ... pelo equivalente» pode ser lido como remuneração recebida pelo homem liberto. «O serviço que ele lhe prestou ... valeu o equivalente» expressa a comparação de valor sem atribuir-lhe esse pagamento.
