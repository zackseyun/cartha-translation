  naturalness: “Para que seus olhos não sejam maus” é pouco natural em português, além de pluralizar a imagem hebraica, que está no singular. “Você será culpado de pecado” é compreensível, mas “você incorrerá em pecado” é mais idiomático e conserva a consequência expressa pelo original.
  terminology: “Yahweh”, “irmão necessitado” e “ano da remissão” são escolhas defensáveis. A expressão idiomática hebraica do “olho mau” deve ser vertida de modo inteligível no texto e explicada literalmente em nota, sem perder seu sentido de má vontade ou avareza.
