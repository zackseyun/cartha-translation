source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: pt
  text: 'Tenha cuidado para que não haja em seu coração um pensamento perverso[a], dizendo: “O sétimo ano, o ano da remissão[b], está próximo”, e para que você não olhe com má vontade para seu irmão necessitado[c] e não deixe de lhe dar nada. Então ele clamará contra você a Yahweh, e você incorrerá em pecado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida como “um propósito indigno” ou, mais literalmente, “uma coisa perversa”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “o ano da liberação” ou “o ano do cancelamento”.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente, “seu olho seja mau”: expressão hebraica que, neste contexto, indica avareza, mesquinhez ou má vontade para com alguém necessitado. Aqui, “irmão” se refere a outro membro da comunidade da aliança, não necessariamente a um irmão biológico.'
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Tenha cuidado
  rationale: O imperativo nifal com pronome dativo adverte a pessoa a vigiar a própria atitude. “Tenha cuidado” é natural e mantém a força da advertência.
- source_word: פֶּן
  choice: para que não
  rationale: Introduz aquilo que deve ser evitado. A formulação é corrente em português e se ajusta à sequência de advertências do versículo.
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: surja em seu coração um pensamento perverso
  rationale: דָבָר pode significar palavra, assunto ou coisa; no contexto interior, seguido de “dizendo”, refere-se a um pensamento ou propósito. בְלִיַּעַל tem aqui valor qualitativo, indicando perversidade ou indignidade, e não funciona como nome próprio.
- source_word: קָרְבָה שְׁנַת הַשֶּׁבַע
  choice: Está próximo o sétimo ano
  rationale: O perfeito expressa a proximidade já percebida do ano sabático. A ordem escolhida conserva o tom da fala interior sem soar excessivamente rígida.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: o ano da remissão
  rationale: שְׁמִטָּה designa a liberação ou remissão ligada ao sétimo ano, especialmente a suspensão ou cancelamento de obrigações conforme o contexto de Deuteronômio 15. “Remissão” preserva a amplitude jurídica do termo.
- source_word: וְרָעָה עֵינְךָ
  choice: e para que seus olhos não sejam maus
  rationale: Mantém no texto a imagem hebraica do “olho mau”, que neste contexto expressa avareza, mesquinhez ou má vontade diante da necessidade alheia. A nota esclarece o idioma.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: para com seu irmão necessitado
  rationale: “Irmão” preserva a linguagem familiar da comunidade da aliança, sem limitar o sentido a irmão biológico. “Necessitado” comunica a falta concreta indicada por אֶבְיוֹן.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: levando você a não lhe dar nada
  rationale: A formulação explicita a ligação entre o olhar avarento e a recusa prática, conservando a negação do ato de dar.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: Então ele clamará contra você a Yahweh
  rationale: “Clamar contra” preserva a ideia de uma apelação acusatória diante de Deus. O nome divino é transliterado como “Yahweh”.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: e você será culpado de pecado
  rationale: A expressão literalmente associa o pecado à pessoa. Em português, “ser culpado de pecado” transmite de modo claro a responsabilidade moral e jurídica decorrente da recusa.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Preservação da expressão idiomática do “olho mau”
  choice: seus olhos não sejam maus
  alternative: você não olhe com avareza; você não seja mesquinho
  rationale: A imagem hebraica foi preservada por seu valor literário e moral, enquanto a nota fornece o sentido idiomático para leitores modernos.
- issue: Sentido comunitário de אָחִיךָ
  choice: seu irmão
  alternative: seu compatriota; outro membro do seu povo
  rationale: “Irmão” mantém a metáfora familiar e a forma masculina singular do original. A nota evita que o termo seja entendido apenas como parentesco biológico.
- issue: Relação entre pecado e culpa em וְהָיָה בְךָ חֵטְא
  choice: você será culpado de pecado
  alternative: haverá pecado em você; isso será pecado para você
  rationale: A escolha comunica a responsabilidade imputável presente na expressão hebraica sem especificar pena, mecanismo de imputação ou consequência além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O texto conserva a imagem hebraica do “olho mau”, mas esclarece seu sentido em nota. Emprega “remissão” no corpo por sua precisão jurídica, oferecendo alternativas mais correntes em nota. A sintaxe foi levemente reorganizada para que a cadeia de advertência permaneça clara em português.
