  text: וְ/כִֽי יִהְיֶ֨ה ב֜/וֹ מ֗וּם פִּסֵּ֨חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔/נּוּ לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: pt
  text: Mas, se ele tiver algum defeito — for manco ou cego, ou tiver qualquer defeito grave — não o sacrifique a Yahweh, seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Mas, se
  rationale: Introduz uma condição em contraste com a ordem anterior sobre os animais primogênitos; a formulação é natural em português e conserva ambas as forças.
- source_word: יִהְיֶה בּוֹ מוּם
  choice: ele tiver algum defeito
  rationale: A expressão hebraica é literalmente 'houver nele um defeito'; em português, a construção com 'ter' comunica o mesmo sentido com naturalidade.
- source_word: פִּסֵּחַ
  choice: manco
  rationale: Designa um animal com mobilidade comprometida e corresponde de modo direto ao termo hebraico.
- source_word: עִוֵּר
  choice: cego
  rationale: Equivalente direto e claro do qualificativo físico hebraico.
- source_word: כֹּל מוּם רָע
  choice: qualquer defeito grave
  rationale: רָע qualifica aqui um defeito físico inaceitável para o sacrifício, não um mal moral. 'Grave' transmite essa força contextual, enquanto a nota preserva a formulação mais literal.
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: não o sacrifique
  rationale: Traduz a proibição legal em português corrente; 'sacrificar' preserva o sentido cultual, e 'o' representa o sufixo de objeto.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: a Yahweh, seu Deus
  rationale: Mantém o nome divino expresso no hebraico e a relação pactual indicada por 'seu Deus'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; 'Yahweh' representa o nome pactual sem substituí-lo por um título.
- issue: Sentido de רָע em כֹּל מוּם רָע
  choice: grave
  alternative: mau
  rationale: Neste contexto sacrificial, o adjetivo descreve a gravidade ou inaceitabilidade física do defeito, e não maldade moral. A nota registra a correspondência literal para preservar a textura do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular direto foi mantido por meio de 'seu', e a proibição foi formulada no imperativo negativo natural. Os travessões organizam os exemplos e a ampliação da categoria sem apagar a estrutura do hebraico.
