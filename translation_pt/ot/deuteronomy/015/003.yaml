  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: pt
  text: Do estrangeiro você poderá exigir pagamento[a], mas abrirá mão[b] do que for seu e estiver com seu irmão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “cobrar do estrangeiro”. O verbo hebraico se refere a pressionar ou exigir pagamento no contexto de uma dívida.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua mão soltará [isso]”. A expressão significa deixar de exercer ou remitir o direito de cobrança no ano da remissão.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “irmão” se refere a outro membro do povo de Israel, a comunidade da aliança.
    reason: cultural_note
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: o estrangeiro
  rationale: נָכְרִי designa, neste contexto jurídico, uma pessoa de fora da comunidade da aliança. “O estrangeiro” conserva a distinção social e legal do hebraico e soa natural em português.
- source_word: תִּגֹּשׂ
  choice: você poderá exigir o pagamento
  rationale: No contexto de dívidas, נגשׂ significa pressionar o devedor ou cobrar dele o pagamento. A formulação escolhida comunica claramente a força jurídica sem sugerir violência física.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: do que ... lhe dever
  rationale: A expressão hebraica é aberta — literalmente, algo como “aquilo que for seu” — e, no contexto, refere-se ao crédito ou valor devido ao credor. A redação explicita apenas o sentido exigido pelo contexto imediato.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Mantém o termo familiar e pactual do hebraico. Neste corpo de leis, ele designa um membro do próprio povo de Israel, sentido esclarecido em nota.
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: abrirá mão
  rationale: O idioma, literalmente relacionado a soltar ou deixar cair a mão, indica renunciar à cobrança ou liberar o crédito no ano da remissão. “Abrirá mão” preserva a imagem de renúncia de modo natural em português.
theological_decisions:
- issue: Alcance de “seu irmão” na legislação deuteronômica
  choice: Conservar “seu irmão” no texto principal
  alternative: seu compatriota israelita
  rationale: A escolha preserva a metáfora familiar e pactual do texto, sem apagar a distinção expressa entre o estrangeiro e o membro da comunidade de Israel. A nota esclarece o alcance social da expressão.
- issue: Natureza da liberação exigida
  choice: Traduzir o idioma como renúncia à cobrança, sem definir além do contexto se a dívida é cancelada permanentemente ou apenas não cobrada naquele momento
  alternative: perdoará definitivamente a dívida
  rationale: O verbo שׁמט indica soltar ou remitir a reivindicação, mas esta frase isolada não deve receber uma definição técnica mais estreita do que permite o contexto da lei do ano da remissão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações acompanha o contraste do hebraico. “Exigir o pagamento” expressa com naturalidade o contexto de cobrança, e “abrirá mão” comunica o idioma jurídico sem reproduzir uma construção pouco inteligível em português. O termo “irmão” foi mantido no texto e explicado em nota.
