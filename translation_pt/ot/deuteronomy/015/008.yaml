  yaml_path: translation/ot/deuteronomy/015/008.yaml
  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: pt
  text: Pelo contrário, você deve abrir a mão para ele e certamente lhe emprestar o suficiente para suprir o que lhe faltar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “abrir, você abrirá ... emprestar, você emprestará” — construções com repetição verbal que dão ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pelo contrário
  rationale: No contexto, introduz um contraste com a proibição de endurecer o coração e fechar a mão no versículo anterior; a expressão explicita naturalmente essa relação adversativa.
- source_word: פָתֹחַ תִּפְתַּח
  choice: você deve abrir bem
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ordem. “Deve abrir bem” comunica obrigação e ênfase em português natural, preservando a imagem concreta da mão aberta.
- source_word: יָדְךָ
  choice: a mão
  rationale: Mantém a metáfora hebraica de generosidade, que também é compreensível em português.
- source_word: לוֹ
  choice: para ele
  rationale: Indica diretamente a pessoa necessitada como beneficiária da ação.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: e não deixar de lhe emprestar
  rationale: A construção enfática com infinitivo absoluto expressa obrigação firme. “Não deixar de” comunica essa força sem interpretar a ênfase como descrição do modo de emprestar.
- source_word: דֵּי
  choice: o suficiente
  rationale: Expressa a ideia de suficiência, isto é, a quantidade necessária para atender à carência.
- source_word: מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ
  choice: para suprir qualquer necessidade que ele tiver
  rationale: Reúne de modo idiomático a expressão hebraica sobre a carência e aquilo que falta à pessoa, preservando seu alcance aberto sem repetição artificial em português.
theological_decisions: []
