source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a slave in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: pt
  text: Lembre-se de que você foi escravo na terra do Egito[a] e de que Yahweh, seu Deus, o resgatou[b]. Por isso, hoje eu lhe ordeno isto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”; o termo hebraico pode ter ambos os sentidos, mas, no contexto da opressão no Egito, “escravo” é a tradução mais forte.
    reason: lexical_alternative
  - marker: b
    text: Ou “redimiu”. O verbo hebraico transmite a ideia de resgatar ou libertar alguém da servidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Lembre-se
  rationale: No contexto de instrução legal, a forma verbal tem força de exortação. O imperativo reflexivo é natural em português e conserva essa força.
- source_word: עֶבֶד
  choice: escravo
  rationale: Embora o termo também possa significar “servo”, a servidão opressiva no Egito torna “escravo” a tradução mais adequada ao contexto.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Mantém a formulação histórico-pactual concreta do hebraico, sem reduzi-la simplesmente a “no Egito”.
- source_word: וַיִּפְדְּךָ
  choice: o resgatou
  rationale: O verbo פדה expressa libertação mediante resgate ou redenção. “Resgatou” é claro no português corrente e preserva a imagem subjacente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em conformidade com a prática do projeto.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Tradução direta do substantivo com sufixo de segunda pessoa do singular.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e claro a inferência entre o resgate de Israel e a ordem dada.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: eu lhe ordeno
  rationale: A construção com pronome explícito e particípio apresenta a ordem como ato presente do locutor; o presente do indicativo transmite isso naturalmente em português.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: isto
  rationale: No contexto, refere-se à instrução em curso. “Isto” preserva a referência demonstrativa sem o pouco natural “esta coisa”.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente direto e idiomático do marcador temporal hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Condição social expressa por עֶבֶד
  choice: escravo
  alternative: servo
  rationale: A lembrança da opressão egípcia destaca uma condição de cativeiro, de modo que “escravo” comunica melhor a força histórica e moral do termo.
- issue: Sentido de פדה
  choice: resgatou
  alternative: redimiu
  rationale: Ambas as opções são possíveis. “Resgatou” comunica com clareza a libertação da escravidão e mantém a noção de resgate, sem exigir terminologia teológica especializada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” e pronomes oblíquos correspondentes. A ordem das orações foi ajustada levemente para evitar ambiguidade e produzir fluência natural. “Hoje” foi colocado no início da oração final, posição que pode modificar naturalmente o ato de ordenar, como no hebraico.
