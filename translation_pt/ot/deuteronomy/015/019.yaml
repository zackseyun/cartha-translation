base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: pt
  text: Todo primogênito macho que nascer do seu gado e do seu rebanho você consagrará a Yahweh, seu Deus. Não use para o trabalho o primogênito do seu boi, nem tosquie o primogênito do seu rebanho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַבְּכוֹר
  choice: Todo primogênito
  rationale: כָּל com o substantivo singular tem sentido distributivo; “todo primogênito” é natural em português e preserva esse valor.
- source_word: אֲשֶׁר יִוָּלֵד
  choice: que nascer
  rationale: O nifal de ילד descreve o animal que vem a nascer; o futuro do subjuntivo é idiomático após “todo ... que”.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: do seu gado e do seu rebanho
  rationale: בקר designa o gado de grande porte, enquanto צאן designa os animais de rebanho de pequeno porte; a formulação mantém a distinção sem restringir indevidamente as espécies.
- source_word: הַזָּכָר
  choice: macho
  rationale: Especifica que o mandamento se aplica aos primogênitos do sexo masculino.
- source_word: תַּקְדִּישׁ
  choice: você consagrará
  rationale: O hifil de קדש significa separar como santo; “consagrará” conserva o sentido cultual.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: a Yahweh, seu Deus
  rationale: Reproduz o nome divino יהוה como Yahweh e mantém a relação de dedicação expressa pela preposição.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: Não use para o trabalho o primogênito do seu gado
  rationale: עבד com ב proíbe empregar o animal no trabalho. “Gado” evita o português menos corrente “boi primogênito” e se ajusta ao bovino indicado por שׁוֹר.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: nem tosquie o primogênito do seu rebanho
  rationale: גזז significa tosquiar; “rebanho” preserva a abrangência de צאן, embora a tosquia se aplique sobretudo às ovelhas.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa de modo explícito sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” no singular. A tradução mantém a distinção entre gado de grande porte e animais de rebanho, evita arcaísmos e conserva o caráter prescritivo do hebraico.
