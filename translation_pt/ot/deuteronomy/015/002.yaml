  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: pt
  text: 'E esta é a norma da remissão[a]: todo credor abrirá mão do que emprestou ao seu próximo. Não exigirá pagamento de seu próximo nem de seu irmão[b], porque foi proclamada uma remissão para Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “liberação” ou “cancelamento”. O hebraico shemittah designa o abandono formal das reivindicações de dívida no ano sabático; a formulação, por si só, não explicita todos os efeitos jurídicos ou sua duração.
    reason: lexical_alternative
  - marker: b
    text: “Irmão” refere-se aqui a outro membro da comunidade da aliança; algumas traduções vertem de modo mais interpretativo como “compatriota israelita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: a norma da remissão
  rationale: דָּבָר introduz aqui a disposição ou regra que define a remissão. “Norma” comunica o caráter jurídico da formulação sem reduzi-la a uma simples palavra ou declaração.
- source_word: הַשְּׁמִטָּה / שְׁמִטָּה
  choice: remissão
  rationale: O substantivo designa o deixar cair ou abandonar reivindicações de dívida no ano sabático. “Remissão” preserva o caráter jurídico-econômico e permite registrar em nota as alternativas “liberação” e “cancelamento”.
- source_word: שָׁמוֹט
  choice: abrirá mão
  rationale: O infinitivo absoluto reforça a obrigação expressa pelo verbo. “Abrirá mão” reproduz naturalmente em português a ideia de deixar cair a reivindicação, sem tentar imitar a repetição hebraica.
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: todo credor
  rationale: A expressão idiomática descreve quem detém um direito decorrente de empréstimo. “Credor” identifica com clareza essa função jurídica.
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: a dívida que emprestou ao seu próximo
  rationale: A formulação torna explícito em português o objeto da renúncia e comunica de modo natural que a dívida surgiu de um empréstimo, sem conservar artificialmente o hebraísmo “de sua mão”.
- source_word: לֹא יִגֹּשׂ
  choice: não exigirá pagamento
  rationale: O verbo significa pressionar ou cobrar o devedor. A expressão escolhida explicita a cobrança no contexto financeiro sem acrescentar um mecanismo específico de coerção.
- source_word: רֵעֵהוּ
  choice: seu próximo
  rationale: “Próximo” é uma equivalência tradicional e ainda compreensível para o membro da comunidade com quem se mantém uma relação social e jurídica.
- source_word: אָחִיו
  choice: seu irmão
  rationale: Mantém o substantivo masculino singular do hebraico e sua força de solidariedade dentro da comunidade da aliança; a abrangência comunitária é esclarecida em nota.
- source_word: כִּי קָרָא
  choice: porque foi proclamada
  rationale: O perfeito sem agente expresso tem valor impessoal. A passiva portuguesa comunica naturalmente que a remissão recebeu proclamação pública.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Preserva a preposição e o nome divino, sem decidir silenciosamente se a relação deve ser entendida sobretudo como dedicação, pertencimento ou proclamação em honra de Yahweh.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido jurídico de שְׁמִטָּה
  choice: remissão
  alternative: liberação; cancelamento; suspensão da cobrança
  rationale: “Remissão” mantém a imagem jurídica de abandono da reivindicação sem resolver além do texto, no corpo do versículo, todas as questões sobre a duração e os efeitos exatos da medida sabática.
- issue: Alcance comunitário de אָחִיו
  choice: irmão
  alternative: compatriota israelita; membro da comunidade da aliança
  rationale: A tradução conserva a forma concreta do hebraico, enquanto a nota esclarece seu sentido social e pactual, evitando substituir o termo por uma interpretação mais estreita no texto principal.
- issue: Relação expressa por לַיהוָה
  choice: para Yahweh
  alternative: de Yahweh; em honra de Yahweh
  rationale: A preposição ל pode admitir mais de uma nuance neste contexto. A formulação formal preserva a tensão entre dedicação a Yahweh e caracterização da remissão como pertencente a ele.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A redação mantém tom jurídico sem arcaísmos. “Exigirá pagamento” esclarece o contexto financeiro; “para Yahweh” conserva deliberadamente a relação preposicional aberta do hebraico.
