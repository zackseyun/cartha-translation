revisions:
- from: Se houver entre vocês algum pobre, um de seus irmãos, em qualquer das suas cidades[a], na terra que Yahweh, seu Deus, lhes dá, não endureçam o coração nem fechem a mão para seu irmão pobre.[b]
  to: Se houver entre vocês um pobre, um de seus irmãos, em uma de suas cidades[a], na terra que Yahweh, seu Deus, lhes dá, não endureçam o coração nem fechem a mão contra seu irmão pobre.[b]
  rationale: A revisão corrige a relação expressa pela última preposição, para que a mão fechada seja claramente uma recusa contra o irmão necessitado, e faz um pequeno ajuste de fluência em «um pobre». Mantêm-se a metonímia de «portões» em nota, a linguagem de parentesco e a designação Yahweh.
