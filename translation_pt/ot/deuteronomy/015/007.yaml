review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz corretamente a estrutura condicional, a referência a um necessitado dentre os «irmãos», o âmbito das cidades na terra dada por Yahweh e as duas imagens hebraicas do coração e da mão. «Cidades», com nota sobre «portões», é uma boa explicitação da metonímia. Contudo, «fechem a mão para seu irmão pobre» enfraquece e pode inverter pragmaticamente a direção da recusa; o hebraico apresenta o fechar da mão em oposição ao irmão necessitado.
  naturalness: O português é claro, atual e adequado ao registro legal. «Um pobre» é mais direto e idiomático que «algum pobre» neste enunciado. A substituição de «para» por «contra» torna a última imagem mais inequívoca e mais próxima do texto-fonte.
  terminology: «Irmãos/irmão», «Yahweh» e «coração» preservam adequadamente os termos e imagens relevantes. A nota sobre os portões como referência metonímica à cidade ou povoação é apropriada. A nota sobre a linguagem familiar da comunidade da aliança é útil e não impõe uma leitura denominacional.
  issues:
  - severity: medium
    issue: Direção semântica de «para seu irmão pobre»
    rationale: Em «não fechem a mão para seu irmão pobre», «para» pode soar como direção favorável ou finalidade, quando o hebraico מֵאָחִיךָ apresenta a mão fechada como recusa em relação ao irmão pobre. «Contra seu irmão pobre» preserva melhor essa oposição e a imagem da negativa de ajuda.
  - severity: low
    issue: «Algum pobre»
    rationale: Embora correto, «um pobre» é mais natural e conciso na formulação condicional portuguesa, sem alterar o singular masculino representativo do hebraico.
