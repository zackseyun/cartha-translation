  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: pt
  text: Se houver entre vocês um pobre, um de seus irmãos, em uma de suas cidades[a], na terra que Yahweh, seu Deus, lhes dá, não endureçam o coração nem fechem a mão contra seu irmão pobre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em um dos seus portões”. Os portões se referem aqui, por metonímia, à cidade ou povoação.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” e “irmão” são termos familiares para os membros da comunidade da aliança; a instrução abrange os necessitados dessa comunidade.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Se houver
  rationale: Expressa naturalmente em português a situação condicional própria da formulação legal, sem impor um sentido estritamente futuro.
- source_word: אֶבְיוֹן
  choice: algum pobre
  rationale: Mantém a referência substantivada a uma pessoa em situação de pobreza e preserva o singular masculino representativo do texto legal.
- source_word: מֵאַחַד אַחֶיךָ
  choice: um de seus irmãos
  rationale: Conserva a linguagem familiar que descreve os membros da comunidade da aliança.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: em qualquer das suas cidades
  rationale: O hebraico diz literalmente 'em um dos seus portões', expressão metonímica para as cidades; a forma escolhida comunica claramente o sentido contextual, com a imagem literal registrada em nota.
- source_word: בְּאַרְצְךָ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: na terra que Yahweh, seu Deus, lhes dá
  rationale: Preserva a terra como dádiva divina e traduz o particípio נֹתֵן de modo natural como ação presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: não endureçam o coração
  rationale: Equivalente português claro e consagrado para a imagem hebraica de tornar o coração insensível ou inflexível.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: nem fechem a mão
  rationale: Preserva a imagem concreta de recusar ajuda por fechar a mão.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: para seu irmão pobre
  rationale: A preposição indica o fechamento da mão diante ou em relação ao necessitado; 'para' produz em português uma formulação natural sem perder a força relacional.
theological_decisions:
- issue: Linguagem de parentesco da aliança em אַחֶיךָ / אָחִיךָ
  choice: irmãos / irmão
  alternative: parentes; compatriotas; outros israelitas
  rationale: A tradução mantém a metáfora familiar pela qual a obrigação econômica é situada dentro da comunidade da aliança. A nota esclarece seu referente comunitário sem eliminar a forma do original.
- issue: Representatividade do masculino singular e plural
  choice: algum pobre; irmãos; irmão pobre
  alternative: alguma pessoa pobre; membros da comunidade; pessoa pobre
  rationale: Preserva o gênero gramatical e a linguagem do texto hebraico, esclarecendo em nota que a instrução legal se refere aos membros necessitados da comunidade, sem restringir indevidamente sua aplicação apenas a homens.
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome próprio revelado no texto hebraico e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “vocês” explicita que o hebraico se dirige ao povo coletivamente, embora empregue formas de segunda pessoa do singular. A repetição de “irmão” e as imagens do coração endurecido e da mão fechada foram preservadas.
