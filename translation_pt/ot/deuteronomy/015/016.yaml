translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” adequado à legibilidade brasileira. Conservou-se a forma direta e relacional do hebraico, enquanto as notas esclarecem o sentido jurídico de “sair” e o uso social de “casa”. A vírgula final mantém a continuidade sintática com o versículo seguinte.
