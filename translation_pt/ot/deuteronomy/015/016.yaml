base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: pt
  text: 'E, se ele disser a você: “Não sairei da sua companhia[a]”, porque ama você e a sua casa[b] e porque é bom para ele estar com você,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “não deixarei você” ou “não sairei livre”. O hebraico diz literalmente que ele não “sairá” de estar com você; no contexto, trata-se de não aceitar a libertação.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “casa” designa o conjunto familiar e doméstico ligado ao senhor, não apenas o edifício.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E, se
  rationale: A fórmula jurídico-condicional hebraica introduz um caso possível. “E, se” preserva a continuidade com o contexto e soa natural em português atual.
- source_word: יֹאמַר אֵלֶיךָ
  choice: ele lhe disser
  rationale: O imperfeito hebraico tem valor eventual neste contexto legal. O futuro do subjuntivo português expressa com naturalidade essa condição.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: Não sairei de junto de você
  rationale: A formulação mantém a imagem de “sair” e também a nuance relacional de afastar-se da convivência com alguém. A nota registra alternativas mais idiomáticas e a implicação jurídica da libertação.
- source_word: כִּי אֲהֵבְךָ
  choice: porque ama você
  rationale: כִּי apresenta a razão da decisão do servo. A construção é clara e corrente, sem acrescentar um sujeito lexical ausente no hebraico.
- source_word: וְאֶת בֵּיתֶךָ
  choice: e a sua casa
  rationale: “Casa” preserva a amplitude de בַּיִת, que aqui pode abranger família, dependentes e ambiente doméstico, e não apenas uma edificação. A nota esclarece esse uso.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: e porque é bom para ele estar com você
  rationale: A tradução conserva a segunda oração causal e torna explícita, em português natural, a relação expressa literalmente por “é bom para ele com você”.
