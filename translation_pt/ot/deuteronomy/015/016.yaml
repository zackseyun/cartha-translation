  naturalness: “E, se ele lhe disser” é compreensível, mas “E, se ele disser a você” é mais transparente para leitores de português brasileiro e evita a alternância algo marcada entre “lhe” e “você”. A principal melhoria necessária é substituir a locução pouco natural “de junto de você”, inclusive na nota.
