base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: pt
  text: Você certamente o suprirá[a] com bens do seu rebanho, da sua eira e do seu lagar; daquilo com que Yahweh, seu Deus, abençoou você, lhe dará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você o proverá generosamente”. O hebraico emprega uma construção verbal enfática que pode indicar uma provisão ampla por ocasião da libertação.'
    reason: Alternativa lexical para הַעֲנֵיק תַּעֲנִיק, preservando tanto a ênfase gramatical quanto a possível nuance de liberalidade.
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: certamente o suprirá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ordem. “Certamente” conserva a ênfase, enquanto “suprirá” comunica a obrigação de fornecer recursos ao servo liberto sem inserir no texto principal uma medida de abundância discutível.
- source_word: מִצֹּאנְךָ
  choice: com o que tirar do seu rebanho
  rationale: צֹאן designa coletivamente o gado miúdo, sobretudo ovelhas e cabras. “Rebanho” é natural em português, e “com o que tirar de” explicita de modo idiomático a preposição de origem מִן.
- source_word: וּמִגָּרְנְךָ
  choice: da sua eira
  rationale: גֹּרֶן é literalmente a eira e, por metonímia, seus cereais. A tradução mantém a imagem agrícola concreta e a tríade do hebraico.
- source_word: וּמִיִּקְבֶךָ
  choice: do seu lagar
  rationale: יֶקֶב refere-se ao lagar ou tanque onde se pisa e recolhe o produto das uvas. “Lagar” preserva a imagem agrícola de modo conciso e tradicionalmente compreensível.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: daquilo com que Yahweh, seu Deus, o abençoou
  rationale: A oração relativa apresenta a bênção divina recebida como fonte daquilo que será dado. A formulação conserva essa relação sem definir de maneira excessiva se ela também determina proporcionalmente a quantidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: תִּתֶּן לוֹ
  choice: você lhe dará
  rationale: A formulação reproduz a reafirmação final e mantém de forma natural em português a ideia de dar algo ao servo liberto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Grau de abundância exigido por הַעֲנֵיק תַּעֲנִיק
  choice: Manter a ênfase da obrigação no texto e registrar a possível ideia de liberalidade em nota
  alternative: Traduzir no texto principal como “dará generosamente” ou “suprirá com liberalidade”
  rationale: A construção é enfática, e o verbo pode sugerir provisão ampla; contudo, tornar “generosamente” explícito no corpo poderia resolver além do necessário a nuance lexical. A nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O futuro do presente conserva o tom jurídico da instrução. “Eira” e “lagar” mantêm as imagens agrícolas concretas do hebraico; o contexto e a nota evitam que a concisão apague a força enfática da ordem.
