base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: pt
  text: Você e os da sua casa o comerão, ano após ano, diante de Yahweh, seu Deus, no lugar que Yahweh escolher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na presença de Yahweh, seu Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: diante de
  rationale: A locução expressa estar perante ou na presença de alguém; “diante de” é natural, concisa e preserva o sentido cultual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: O substantivo com sufixo de segunda pessoa masculina singular forma a expressão pactual “Yahweh, seu Deus”.
- source_word: תֹאכֲלֶנּוּ
  choice: o comerão
  rationale: O objeto masculino singular retoma o primogênito mencionado no contexto. Embora o verbo hebraico esteja no singular, o sujeito composto “você e os da sua casa” pede o plural em português.
- source_word: שָׁנָה בְּשָׁנָה
  choice: ano após ano
  rationale: Reproduz de modo corrente a força distributiva e reiterativa da expressão hebraica.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: no lugar que Yahweh escolher
  rationale: Preserva a fórmula deuteronômica do lugar escolhido por Yahweh e a orientação futura do imperfeito.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: você e os da sua casa
  rationale: Comunica a unidade doméstica abrangida por בַּיִת sem sugerir apenas o edifício; também conserva mais de perto a imagem hebraica do que “família”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido cultual de לִפְנֵי יְהוָה
  choice: diante de Yahweh
  alternative: na presença de Yahweh
  rationale: As duas formulações são lexicalmente possíveis. “Diante de” mantém a concisão e a linguagem espacial/cultual sem resolver além do que o hebraico expressa.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. O futuro com valor instrutivo preserva o tom legal do contexto.
