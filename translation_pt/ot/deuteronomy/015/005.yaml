  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: pt
  text: somente se você ouvir atentamente a voz do SENHOR, seu Deus, e tiver o cuidado de cumprir todo este mandamento que hoje lhe ordeno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: contanto que
  rationale: Expressa naturalmente a condição enfática no contexto, sem transformar a frase em mero desejo.
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: ouça atentamente
  rationale: A construção hebraica intensifica o verbo 'ouvir' e, no contexto da aliança, implica atenção obediente.
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  choice: a voz do SENHOR, seu Deus
  rationale: Mantém a imagem concreta de ouvir a voz; SENHOR segue a convenção portuguesa para o tetragrama.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: tenha o cuidado de cumprir
  rationale: Reproduz a combinação de guardar/cuidar e fazer em português natural, sem omitir a ideia de diligência.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: todo este mandamento
  rationale: Preserva o singular coletivo do hebraico, que apresenta a instrução como uma unidade.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhe ordeno
  rationale: Mantém o presente discursivo e a ênfase temporal de 'hoje' com sintaxe portuguesa fluente.
theological_decisions:
- issue: Força condicional de רַק אִם
  choice: contanto que
  alternative: se ao menos
  rationale: No encadeamento de Deuteronômio 15:4-6, a expressão introduz a condição associada à promessa; 'contanto que' comunica essa função sem apagar sua ênfase.
- issue: Ouvir como resposta obediente
  choice: ouça atentamente ... e tenha o cuidado de cumprir
  alternative: obedeça plenamente
  rationale: Evita fundir os verbos em uma interpretação única e preserva tanto a metáfora da escuta quanto a exigência explícita de ação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a estrutura condicional, o singular coletivo 'mandamento' e a distinção entre ouvir e cumprir.
