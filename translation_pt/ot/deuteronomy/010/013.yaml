  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: pt
  text: guardar[a] os mandamentos de Yahweh e os seus estatutos que hoje ordeno a você para o seu bem?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “observar” ou “cumprir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: guardar
  rationale: O infinitivo com לְ expressa o conteúdo do que Yahweh requer no versículo anterior. “Guardar” é uma formulação corrente no registro bíblico e abrange observar atentamente e cumprir, sem reduzir o termo apenas à obediência exterior.
- source_word: מִצְוֺת
  choice: os mandamentos
  rationale: O plural construto de מִצְוָה designa as obrigações ordenadas por Yahweh. “Mandamentos” preserva com clareza o registro jurídico e pactual de Deuteronômio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חֻקֹּתָיו
  choice: os seus estatutos
  rationale: O termo designa prescrições estabelecidas e forma, com “mandamentos”, um par jurídico-pactual natural em português.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhe ordeno
  rationale: A oração relativa pode abranger tanto “mandamentos” quanto “estatutos”. A formulação mantém a ênfase deuteronômica em “hoje” e comunica naturalmente o ato presente de ordenar.
- source_word: לְטוֹב לָךְ
  choice: para o seu bem
  rationale: A expressão indica finalidade ou resultado benéfico para o destinatário. “Para o seu bem” é conciso, natural e semanticamente fiel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação das exigências divinas com o bem de Israel
  choice: para o seu bem
  alternative: para o seu benefício
  rationale: A tradução conserva a afirmação de que os mandamentos visam ao bem do povo, sem especificar indevidamente a natureza desse bem nem resolver se a expressão enfatiza finalidade ou resultado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O início em minúscula e o ponto de interrogação preservam a continuidade sintática da pergunta iniciada no versículo anterior. Evitou-se pontuação interna desnecessária para manter o fluxo do hebraico.
