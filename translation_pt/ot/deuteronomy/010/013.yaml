    issue: Clareza e idiomaticidade de «que hoje lhe ordeno».
    rationale: Embora gramaticalmente possível em registro formal, a expressão é menos direta para o português moderno e não explicita tão claramente o complemento «a você» correspondente ao sufixo hebraico de segunda pessoa singular. «Que hoje ordeno a você» preserva o sentido e evita ambiguidade de construção.
  revised_text: guardar[a] os mandamentos de Yahweh e os seus estatutos que hoje ordeno a você para o seu bem?
