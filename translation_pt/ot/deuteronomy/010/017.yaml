id: DEU.10.17
reference: Deuteronomy 10:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: pt
  text: Pois Yahweh, o Deus de vocês, é o Deus dos deuses e o Senhor dos senhores, o Deus grande, poderoso e temível[a], que não age com parcialidade nem aceita suborno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que inspira reverente temor»; o termo hebraico descreve aquele que desperta assombro e temor profundo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta a exortação anterior, preservando a força causal e o fluxo do discurso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: O sufixo de segunda pessoa masculina plural dirige-se a Israel; esta formulação é clara e natural em português amplo.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: o Deus dos deuses
  rationale: Mantém a cadeia construta hebraica e sua afirmação de supremacia sem definir a natureza dos demais chamados deuses.
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: e o Senhor dos senhores
  rationale: Preserva o paralelismo solene com «Deus dos deuses» e expressa soberania.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר וְהַנּוֹרָא
  choice: o Deus grande, poderoso e temível
  rationale: Conserva a sequência de títulos e atributos; «temível» comunica que Deus inspira temor profundo, enquanto a nota registra a nuance reverente.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: que não age com parcialidade
  rationale: Traduz de modo idiomático a expressão hebraica literalmente relacionada a «levantar/aceitar rostos», isto é, favorecer pessoas.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: nem aceita suborno
  rationale: Expressa com clareza e concisão a força jurídica e ética da oração hebraica.
theological_decisions:
- issue: A fórmula «Deus dos deuses e Senhor dos senhores» pode ser interpretada como reconhecimento ontológico de outros deuses.
  choice: Manter a fórmula hebraica de supremacia.
  alternative: Parafrasear como «Deus acima de todos os chamados deuses e senhores».
  rationale: A forma literal preserva a retórica de incomparabilidade e soberania sem inserir no texto uma explicação filosófica que o hebraico não explicita.
- issue: Representação do nome divino יהוה.
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, evitando substituí-lo por um título.
- issue: Nuance de וְהַנּוֹרָא.
  choice: temível
  alternative: impressionante ou aquele que inspira reverente temor
  rationale: «Temível» preserva a tensão entre assombro, reverência e temor, sem reduzir o termo a mera admiração nem torná-lo necessariamente aterrorizante.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. «De vocês» explicita naturalmente o destinatário plural; «nem aceita suborno» mantém a concisão do paralelismo negativo.
