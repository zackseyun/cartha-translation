  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: pt
  text: 'E Yahweh me disse: “Levante-se e ponha-se a caminho à frente do povo[a], para que eles entrem e tomem posse[b] da terra que jurei aos antepassados deles[c] que lhes daria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante do povo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “entrem e possuam”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “pais deles”; isto é, seus antepassados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: קוּם לֵךְ לְמַסַּע
  choice: Levante-se e ponha-se a caminho
  rationale: Expressa de modo natural em português a sequência imperativa e a ideia de partir em viagem contida em מַסַּע.
- source_word: לִפְנֵי הָעָם
  choice: à frente do povo
  rationale: Conserva o sentido espacial de ir diante do povo e sua possível nuance de liderança.
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: para que eles entrem e tomem posse
  rationale: A construção comunica propósito ou resultado; ירשׁ indica aqui a ocupação efetiva da terra prometida.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: É a designação contextual e tradicional da terra prometida.
- source_word: נִשְׁבַּעְתִּי
  choice: jurei
  rationale: Preserva de forma direta a linguagem solene de juramento.
- source_word: לַאֲבֹתָם
  choice: aos antepassados deles
  rationale: Neste contexto, אָבוֹת se refere aos patriarcas ou ancestrais, não apenas aos pais imediatos; a nota registra a forma mais literal.
- source_word: לָתֵת לָהֶם
  choice: que lhes daria
  rationale: Reformula naturalmente em português a construção hebraica com infinitivo, sem alterar a promessa de dar a terra a seus descendentes.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Mantém o nome pessoal presente no texto hebraico sem substituí-lo por um título.
- issue: Sentido de לַאֲבֹתָם
  choice: antepassados deles
  alternative: pais deles
  rationale: “Antepassados” esclarece a referência histórica aos patriarcas, enquanto a nota preserva o valor literal masculino de “pais”.
- issue: Força de ירשׁ
  choice: tomem posse
  alternative: possuam; herdem
  rationale: “Tomem posse” conserva o caráter ativo da entrada e ocupação da terra, sem reduzir o termo apenas à noção jurídica de herança.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ponha-se a caminho” evita a formulação pouco natural “vá para a jornada”, e “antepassados” evita que “pais” seja entendido apenas como os genitores imediatos.
