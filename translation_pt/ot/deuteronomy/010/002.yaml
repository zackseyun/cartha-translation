  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: pt
  text: E escreverei nas tábuas as palavras que estavam nas primeiras tábuas[a], que você quebrou; e você as colocará na arca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os mandamentos»; literalmente, «as palavras».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: E escreverei
  rationale: O qal imperfeito na primeira pessoa do singular, com a conjunção, expressa aqui a ação futura prometida por Deus.
- source_word: הַלֻּחֹת
  choice: nas tábuas
  rationale: לוח designa tábuas ou placas; o contexto informa que são de pedra, mas o versículo não repete esse detalhe.
- source_word: הַדְּבָרִים
  choice: as palavras
  rationale: Mantém o sentido básico de דבר e a formulação da aliança sem ampliar interpretativamente para «mandamentos».
- source_word: אֲשֶׁר הָיוּ
  choice: que estavam
  rationale: A oração relativa indica que as palavras se encontravam inscritas nas tábuas anteriores; «estavam» é natural em português.
- source_word: הָרִאשֹׁנִים
  choice: as primeiras
  rationale: Distingue o primeiro conjunto de tábuas daquele que o substituirá.
- source_word: שִׁבַּרְתָּ
  choice: você quebrou
  rationale: O piel perfeito na segunda pessoa masculina singular descreve de modo direto a quebra das tábuas, sem intensificação desnecessária.
- source_word: וְשַׂמְתָּם
  choice: depois você as colocará
  rationale: O perfeito com waw, na sequência das instruções futuras, indica a ação subsequente; «as» retoma naturalmente «tábuas» em português.
- source_word: בָּאָרוֹן
  choice: na arca
  rationale: ארון é a arca sagrada feita no contexto imediato; «arca» é a designação bíblica estabelecida em português.
theological_decisions:
- issue: Referente do sufixo pronominal em וְשַׂמְתָּם
  choice: O pronome retoma as tábuas.
  alternative: O pronome poderia, gramaticalmente, retomar as palavras ou os mandamentos escritos nelas.
  rationale: Embora ambos os antecedentes sejam masculinos plurais em hebraico, a ação física de colocar algo na arca e o contexto de Deuteronômio 10:1-5 favorecem claramente as tábuas. Em português, o feminino «as» explicita essa relação exigida pela concordância.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva «palavras» no texto principal e registra a alternativa interpretativa em nota. O ponto e vírgula separa com clareza a promessa divina da instrução dada a Moisés.
