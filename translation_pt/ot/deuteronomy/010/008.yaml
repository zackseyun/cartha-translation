revisions:
- from: Naquele tempo, Yahweh separou a tribo de Levi para carregar a arca da aliança de Yahweh, para estar diante de Yahweh, a fim de servi-lo e abençoar em seu nome, como fazem até hoje.
  to: Naquele tempo, Yahweh separou a tribo de Levi para carregar a arca da aliança de Yahweh, para estar diante de Yahweh, para servi-lo e para abençoar em seu nome, até o dia de hoje.
  rationale: A revisão limita-se ao segmento final. «Até o dia de hoje» traduz diretamente a expressão temporal hebraica e preserva sua ligação potencialmente ampla com a designação e os deveres levíticos, sem introduzir uma afirmação explícita de que eles «fazem» essas funções no presente do narrador.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:02:24Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a nomeação da tribo de Levi, as três funções indicadas pelos infinitivos e a repetição do nome Yahweh. Contudo, «como fazem até hoje» introduz um sujeito plural explícito e a noção verbal de continuação («fazem») que não constam no hebraico; embora seja uma inferência contextual possível, estreita e explicita indevidamente o alcance de עַד הַיּוֹם הַזֶּה.
  naturalness: O português é claro e de registro apropriado. A substituição da paráfrase final por «até o dia de hoje» mantém uma formulação natural e mais próxima do enunciado hebraico, sem decidir sintaticamente a qual função a expressão temporal se liga.
  terminology: «Yahweh», «tribo de Levi», «arca da aliança de Yahweh» e «servi-lo» são consistentes com o texto-fonte e com o registro solicitado. «Estar diante de Yahweh» preserva de modo sóbrio o idioma cultual, sem acrescentar explicações institucionais.
  issues:
  - severity: medium
    issue: «como fazem até hoje» acrescenta conteúdo interpretativo ao fecho temporal.
    rationale: עַד הַיּוֹם הַזֶּה significa literalmente «até este dia» / «até o dia de hoje». O hebraico não traz o verbo «fazem» nem um sujeito plural expresso. A paráfrase resolve uma possível ambiguidade de escopo que o original deixa aberta.
  revised_text: Naquele tempo, Yahweh separou a tribo de Levi para carregar a arca da aliança de Yahweh, para estar diante de Yahweh, para servi-lo e para abençoar em seu nome, até o dia de hoje.
  revised_footnotes: []
