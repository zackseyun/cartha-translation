  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: pt
  text: Naquele tempo, Yahweh separou a tribo de Levi para carregar a arca da aliança de Yahweh, para estar diante de Yahweh, para servi-lo e para abençoar em seu nome, até o dia de hoje.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Equivalente natural e direto da expressão temporal hebraica.
- source_word: הִבְדִּיל
  choice: separou
  rationale: Expressa a distinção da tribo para funções específicas; o complemento final deixa clara a finalidade dessa separação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: a tribo de Levi
  rationale: Preserva naturalmente o nome tribal e a relação construta do hebraico.
- source_word: לָשֵׂאת
  choice: para carregar
  rationale: É o verbo corrente e preciso para a tarefa levítica relacionada à arca.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: 'Mantém explícita toda a cadeia construta: a arca vinculada à aliança de Yahweh.'
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: para estar diante de Yahweh
  rationale: Preserva o idioma hebraico de comparecer ou permanecer na presença divina para o serviço sagrado, sem explicá-lo em excesso.
- source_word: לְשָׁרְתוֹ
  choice: a fim de servi-lo
  rationale: Conserva o sentido amplo de serviço sagrado e traduz explicitamente o sufixo pronominal masculino.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: e abençoar em seu nome
  rationale: Mantém a formulação hebraica e sua ideia de bênção pronunciada sob a autoridade do nome divino.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: como fazem até hoje
  rationale: Comunica a continuidade das funções desde a nomeação até o tempo do narrador; o acréscimo verbal implícito evita que a expressão temporal pareça modificar apenas o ato imediatamente anterior.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto apresenta o tetragrama como nome próprio. A transliteração preserva essa condição sem substituí-lo por um título.
- issue: Natureza do serviço levítico em לַעֲמֹד ... לְשָׁרְתוֹ
  choice: estar diante de Yahweh, a fim de servi-lo
  alternative: estar diante de Yahweh para ministrar a ele
  rationale: A redação conserva o contexto de serviço sagrado sem importar estruturas ministeriais ou sacerdotais posteriores.
- issue: Alcance de עַד הַיּוֹם הַזֶּה
  choice: como fazem até hoje
  alternative: até hoje
  rationale: A formulação entende a expressão como continuidade da comissão levítica em seu conjunto, leitura natural no contexto, sem restringi-la apenas à bênção.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a repetição de “Yahweh” presente no hebraico e evita terminologia confessional específica.
