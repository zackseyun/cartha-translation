    issue: «as mesmas palavras da primeira inscrição»
    rationale: A expressão introduz «mesmas palavras», que não está formulado no hebraico. כַּמִּכְתָּב הָרִאשׁוֹן significa «como a primeira escrita/inscrição»; embora a identidade do conteúdo seja contextual, ela não deve ser explicitada como se fosse uma afirmação lexical do versículo.
  - severity: low
    issue: «Então Yahweh as entregou a mim»
    rationale: «Então» é possível para o wayyiqtol, mas a conjunção simples «e» preserva melhor a coordenação narrativa. «Deu» é a equivalência mais direta de נתן; «entregou» pode sugerir uma nuance que o verbo não exige.
  revised_text: Ele escreveu nas tábuas, como na primeira inscrição, as Dez Palavras[a] que Yahweh havia falado a vocês no monte, do meio do fogo, no dia da assembleia; e Yahweh as deu a mim.
