revisions:
- from: 'E ele escreveu nas tábuas as mesmas palavras da primeira inscrição: as Dez Palavras[a] que Yahweh havia falado a vocês no monte, do meio do fogo, no dia da assembleia. Então Yahweh as entregou a mim.'
  to: Ele escreveu nas tábuas, como na primeira inscrição, as Dez Palavras[a] que Yahweh havia falado a vocês no monte, do meio do fogo, no dia da assembleia; e Yahweh as deu a mim.
  rationale: A revisão remove a explicitação não presente de «as mesmas palavras» e traduz a comparação hebraica de modo direto. Também ajusta a oração final para refletir mais precisamente a coordenação e o verbo hebraicos, sem alterar o sentido do versículo.
