source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: pt
  text: Ele escreveu nas tábuas, como na primeira inscrição, as Dez Palavras[a] que Yahweh havia falado a vocês no monte, do meio do fogo, no dia da assembleia; e Yahweh as deu a mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “os Dez Mandamentos”. Em hebraico, “as dez palavras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: E ele escreveu
  rationale: O wayyiqtol de כתב narra uma ação passada. “Escreveu” é natural em português e mantém a ligação lexical com מִכְתָּב, “inscrição”.
- source_word: הַלֻּחֹת
  choice: nas tábuas
  rationale: לֻחֹת designa as tábuas da aliança neste contexto. “De pedra” não foi acrescentado porque não aparece explicitamente neste versículo.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: as mesmas palavras da primeira inscrição
  rationale: A formulação comunica em português natural a comparação introduzida por כ e entende מִכְתָּב como a inscrição anterior, sem sugerir que se tratava meramente de caligrafia semelhante.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: as Dez Palavras
  rationale: A expressão hebraica significa literalmente “as dez palavras”. A designação tradicional é preservada em nota.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: que Yahweh havia falado a vocês
  rationale: O mais-que-perfeito composto esclarece que a fala precedeu a escrita. “A vocês” é amplamente compreensível e evita regionalismo excessivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּהָר
  choice: no monte
  rationale: Forma portuguesa natural para o local da revelação; “monte” é tradicional e claro sem inserir aqui o nome Sinai ou Horebe.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: do meio do fogo
  rationale: 'Preserva a imagem espacial do hebraico: a voz procedia de dentro do fogo.'
- source_word: בְּיוֹם הַקָּהָל
  choice: no dia da assembleia
  rationale: קָהָל indica a reunião do povo de Israel; “assembleia” é atual, digna e não impõe conotação eclesiástica específica.
- source_word: וַיִּתְּנֵם יְהוָה אֵלָי
  choice: Então Yahweh as entregou a mim
  rationale: “Entregou” expressa naturalmente נתן neste contexto. O pronome feminino plural retoma as tábuas; “então” marca a progressão narrativa do wayyiqtol.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o caráter de nome próprio, sem substituí-lo por um título.
- issue: Tradução de עֲשֶׂרֶת הַדְּבָרִים
  choice: as Dez Palavras
  alternative: os Dez Mandamentos
  rationale: “Dez Palavras” reflete diretamente o hebraico e preserva a forma bíblica da designação; a expressão tradicional e interpretativamente válida aparece na nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa legibilidade brasileira. A redação evita arcaísmos, conserva o nome Yahweh e mantém a expressão fonte “Dez Palavras”, explicando a forma tradicional em nota.
