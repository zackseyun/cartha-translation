source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: pt
  text: Por isso, Levi não tem parte nem herança com seus irmãos[a]; Yahweh é a sua herança[b], assim como Yahweh, o teu Deus, lhe falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente «com seus irmãos». O singular «Levi» representa aqui a tribo de Levi, em contraste com as demais tribos de Israel.
    reason: cultural_note
  - marker: b
    text: 'Ou: «Yahweh é a sua porção». O hebraico repete o termo traduzido por «herança» para destacar que a parte de Levi não é uma terra, mas o próprio Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz naturalmente, em português atual, a conclusão decorrente do contexto anterior.
- source_word: לְלֵוִי
  choice: Levi
  rationale: Mantém o nome singular do hebraico, empregado como representante da tribo.
- source_word: חֵלֶק וְנַחֲלָה
  choice: parte nem herança
  rationale: Preserva os dois substantivos e o sentido territorial da distribuição da terra; em português, a negação inicial rege naturalmente a coordenação com «nem».
- source_word: עִם אֶחָיו
  choice: com seus irmãos
  rationale: Reproduz o termo masculino de parentesco e conserva a imagem das tribos irmãs.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: הוּא נַחֲלָתוֹ
  choice: é a sua herança
  rationale: Repete «herança» para manter o elo lexical e o contraste entre uma herança territorial e o próprio Yahweh.
- source_word: כַּאֲשֶׁר דִּבֶּר ... לוֹ
  choice: conforme ... lhe disse
  rationale: Expressa de modo idiomático o sentido de «assim como falou a ele», sem ampliar o verbo para «prometeu».
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Mantém a fórmula da aliança e o pronome de segunda pessoa singular dirigido a Israel coletivamente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio da aliança; a transliteração preserva sua condição de nome, em vez de substituí-lo por um título.
- issue: Levi como representante singular da tribo
  choice: Levi
  alternative: a tribo de Levi
  rationale: A forma singular do original é conservada, enquanto uma nota esclarece seu valor coletivo.
- issue: Natureza da herança de Levi
  choice: Yahweh é a sua herança
  alternative: Yahweh é a sua porção
  rationale: A repetição de «herança» preserva a correspondência com נַחֲלָה na primeira oração e salienta o contraste deliberado com a herança territorial.
- issue: Valor temporal de לֹא הָיָה
  choice: não tem
  alternative: não teve
  rationale: Embora a forma verbal seja perfeita, o contexto descreve a condição vigente e normativa de Levi; o presente comunica esse estado em português sem negar sua origem histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Por isso» e «conforme ... lhe disse» evitam rigidez desnecessária, enquanto «parte», «herança» e «Yahweh» preservam os vínculos lexicais e teológicos do hebraico.
