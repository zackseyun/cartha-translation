  text: וּ/מַלְתֶּ֕ם אֵ֖ת עָרְלַ֣ת לְבַבְ/כֶ֑ם וְ/עָ֨רְפְּ/כֶ֔ם לֹ֥א תַקְשׁ֖וּ עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/016.yaml
  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: pt
  text: Portanto, circuncidem o prepúcio do coração de vocês[a][b] e não endureçam mais a sua cerviz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E circuncidem o prepúcio do coração de vocês”. A conjunção hebraica pode ser apenas conectiva, embora o contexto também favoreça o sentido de conclusão: “Portanto”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico preserva literalmente a metáfora “o prepúcio do coração”, imagem de remover a resistência interior a Deus.
    reason: cultural_note
  - marker: c
    text: 'Ou: “não tornem mais rígida a sua nuca”; isto é, não continuem obstinados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: Portanto, circuncidem
  rationale: O perfeito qal na segunda pessoa masculina plural, ligado pela conjunção, tem força exortativa neste contexto. “Portanto” explicita a relação inferencial com os versículos anteriores, e “circuncidem” comunica naturalmente a ordem em português.
- source_word: עָרְלַת לְבַבְכֶם
  choice: o prepúcio do coração de vocês
  rationale: Mantém a construção concreta e a metáfora hebraica, preservando sua força pactual e moral sem reduzi-la a uma paráfrase interpretativa.
- source_word: לְבַבְכֶם
  choice: do coração de vocês
  rationale: “Coração” é o equivalente tradicional e inteligível para o centro interior da vontade, do entendimento e das disposições humanas; “de vocês” expressa claramente a segunda pessoa plural.
- source_word: וְעָרְפְּכֶם
  choice: a sua cerviz
  rationale: עֹרֶף designa a nuca ou parte posterior do pescoço. “Cerviz” conserva em português a imagem bíblica estabelecida de resistência obstinada, embora seja um termo mais elevado.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: não endureçam mais
  rationale: O hifil de קשׁה indica tornar duro ou rígido. Com “cerviz”, “endurecer” preserva diretamente a imagem hebraica, e “mais” expressa עוֹד na proibição.
theological_decisions:
- issue: Linguagem pactual metafórica da circuncisão interior
  choice: Manter explicitamente “circuncidem o prepúcio do coração de vocês”
  alternative: “Purifiquem o coração” ou “removam a obstinação do coração”
  rationale: O texto aplica a imagem da circuncisão à resposta moral interior. Preservar a metáfora mantém a tensão entre o sinal exterior e a obediência interior, sem impor uma interpretação doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e de leitura amplamente acessível, com “vocês” para explicitar o plural. A metáfora incomum do original foi mantida. “Cerviz” foi escolhida por conservar a expressão bíblica em português; a nota oferece uma formulação mais transparente.
