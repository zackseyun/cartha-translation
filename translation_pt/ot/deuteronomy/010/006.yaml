base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: pt
  text: Os filhos de Israel partiram de Beerote-Bene-Jaacã para Moserá[a]. Ali Arão morreu e ali foi sepultado; e Eleazar, seu filho, serviu como sacerdote em seu lugar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beerote-Bene-Jaacã” pode ser entendido literalmente como “os poços dos filhos de Jaacã”; aqui, porém, é apresentado por transliteração como nome de lugar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eleazar, seu filho, serviu como sacerdote depois dele”. O hebraico diz literalmente “em seu lugar”, indicando sucessão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel
  rationale: Preserva a expressão hebraica e sua força genealógica e nacional. O ו inicial não precisa ser explicitado isoladamente em português, pois aqui funciona como conexão narrativa.
- source_word: נָסְעוּ
  choice: partiram
  rationale: No contexto de itinerário, נסע indica levantar acampamento e seguir viagem; “partiram” comunica esse movimento com naturalidade.
- source_word: מִבְּאֵרֹת בְּנֵי יַעֲקָן
  choice: de Beerote-Benê-Jaacã
  rationale: Mantém por transliteração o topônimo do itinerário, em vez de traduzir literalmente seus componentes.
- source_word: מוֹסֵרָה
  choice: rumo a Moserá
  rationale: Embora o hebraico não traga preposição antes do nome, a fórmula de deslocamento indica o destino; “rumo a” o expressa naturalmente.
- source_word: שָׁם
  choice: Ali
  rationale: Preserva a ênfase locativa. Na segunda ocorrência, o português permite omiti-lo sem perder o vínculo com o mesmo lugar e evita repetição pouco natural.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Reproduz diretamente o nifal passivo, sem introduzir um agente não expresso.
- source_word: וַיְכַהֵן
  choice: serviu como sacerdote
  rationale: O verbo כהן descreve o exercício da função sacerdotal, não apenas a investidura no cargo.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Mantém o sentido literal e sucessório da expressão hebraica, sem restringi-la apenas a uma sequência temporal.
theological_decisions:
- issue: Natureza da sucessão de Eleazar
  choice: em seu lugar
  alternative: depois dele
  rationale: A expressão תחתיו indica substituição ou sucessão no ofício. A tradução preserva essa amplitude sem definir além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, com formas de nomes próprias de uso bíblico em português. A redação conserva “filhos de Israel” e o sentido sacerdotal e sucessório do hebraico, mas emprega sintaxe natural.
