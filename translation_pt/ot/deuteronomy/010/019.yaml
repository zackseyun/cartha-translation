  text: וַ/אֲהַבְתֶּ֖ם אֶת הַ/גֵּ֑ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: pt
  text: Portanto, amem o estrangeiro[a], pois vocês foram estrangeiros na terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “imigrante residente”, “forasteiro” ou “peregrino”. O hebraico ger se refere a uma pessoa não nativa que vivia entre os israelitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: Portanto, amem
  rationale: A forma de אהב tem força de ordem e está ligada ao motivo apresentado no versículo anterior. “Portanto” expressa naturalmente a conexão conclusiva, e “amem” comunica a ordem em português atual.
- source_word: הַ/גֵּר
  choice: o estrangeiro
  rationale: גֵּר designa aqui uma pessoa não nativa que reside entre os israelitas e se encontra em condição social vulnerável, não apenas um viajante de passagem. “Estrangeiro” é claro e acessível, enquanto a nota preserva alternativas mais técnicas.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem. “Pois” mantém de modo natural e digno a relação causal; “porque” também seria possível.
- source_word: גֵרִים
  choice: estrangeiros
  rationale: Plural de גֵּר, traduzido com o mesmo termo usado antes para preservar a repetição e a ligação ética entre a experiência de Israel e a ordem recebida.
- source_word: הֱיִיתֶם
  choice: vocês foram
  rationale: A forma de היה expressa aqui a condição passada de Israel como estrangeiros no Egito.
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Conserva אֶרֶץ (“terra”) e a formulação histórico-covenantal hebraica sem perder naturalidade em português.
theological_decisions:
- issue: Sentido social de גֵּר na legislação da aliança
  choice: estrangeiro
  alternative: imigrante residente, forasteiro ou peregrino
  rationale: O texto fundamenta a obrigação ética de Israel em sua própria experiência como população estrangeira no Egito. “Estrangeiro” comunica amplamente a condição de alguém de fora, enquanto a nota esclarece que se trata de um não nativo residente, sem impor categorias jurídicas modernas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” explicita o destinatário coletivo. A repetição “estrangeiro/estrangeiros” preserva a coesão lexical do hebraico.
