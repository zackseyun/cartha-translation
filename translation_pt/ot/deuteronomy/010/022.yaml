  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: pt
  text: Seus pais[b] desceram ao Egito em número de setenta pessoas[a], e agora Yahweh, seu Deus, fez você tão numeroso quanto as estrelas dos céus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “setenta almas”. Aqui, a palavra hebraica נֶפֶשׁ (“alma; pessoa”) é usada para contar pessoas.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus antepassados”. O hebraico diz literalmente “seus pais”.
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “como as estrelas do céu”. A comparação enfatiza a grande quantidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: em número de setenta pessoas
  rationale: נֶפֶשׁ funciona aqui como termo de contagem para seres humanos. A formulação comunica naturalmente em português que o grupo totalizava setenta pessoas, sem sugerir o sentido moderno mais restrito de “almas”.
- source_word: יָרְדוּ
  choice: desceram
  rationale: Preserva o sentido comum de ירד e a maneira convencional de descrever a viagem para o Egito.
- source_word: אֲבֹתֶיךָ
  choice: seus pais
  rationale: Mantém o substantivo masculino explícito do hebraico. Neste contexto, refere-se aos pais ancestrais de Israel; “antepassados” seria uma alternativa interpretativamente mais ampla.
- source_word: מִצְרָיְמָה
  choice: ao Egito
  rationale: A terminação direcional indica movimento em direção ao Egito; “ao Egito” é idiomático e fiel.
- source_word: וְעַתָּה
  choice: e agora
  rationale: Preserva tanto a ligação conjuntiva quanto o contraste temporal entre o pequeno número inicial e a multidão presente.
- source_word: שָׂמְךָ
  choice: fez você
  rationale: Embora שׂים tenha o sentido básico de pôr ou colocar, aqui descreve a condição resultante do crescimento de Israel; “fez você” expressa esse uso de modo claro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de maneira direta a construção com sufixo de segunda pessoa masculina singular.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: tão numeroso quanto as estrelas dos céus
  rationale: Explicita que a comparação diz respeito à grande quantidade, preservando a imagem das estrelas e o plural formal de שָׁמַיִם.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Termo ancestral masculino אֲבֹתֶיךָ
  choice: seus pais
  alternative: seus antepassados
  rationale: A tradução principal conserva a forma masculina explícita do hebraico, enquanto a nota registra a extensão contextual do termo aos ancestrais de Israel.
- issue: Número gramatical do destinatário
  choice: você, no singular
  alternative: vocês, no plural
  rationale: Os sufixos hebraicos estão no singular e tratam Israel coletivamente. O singular foi preservado para não apagar essa personificação coletiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular “você” preserva o tratamento hebraico de Israel como uma coletividade personificada. “Em número de” evita a construção pouco natural “com setenta pessoas”, e “céus” mantém a forma hebraica sem comprometer a fluidez.
