base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: pt
  text: Então me virei e desci do monte. Coloquei as tábuas na arca que eu havia feito, e elas ficaram ali, conforme Yahweh me havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Então me virei
  rationale: פנה significa voltar-se ou virar-se. “Então” expressa com naturalidade a progressão narrativa do waw consecutivo.
- source_word: וָאֵרֵד מִן הָהָר
  choice: e desci do monte
  rationale: ירד indica movimento para baixo; “desci do monte” é natural em português e preserva o artigo definido hebraico.
- source_word: וָאָשִׂם אֶת הַלֻּחֹת
  choice: Coloquei as tábuas
  rationale: שׂים significa pôr ou colocar. “Coloquei” mantém clareza e dignidade; “as tábuas” basta, pois o contexto as identifica sem ser necessário acrescentar “de pedra”.
- source_word: בָּאָרוֹן אֲשֶׁר עָשִׂיתִי
  choice: na arca que eu havia feito
  rationale: אָרוֹן é “arca” neste contexto da aliança. O mais-que-perfeito composto esclarece naturalmente que a fabricação da arca precedeu a colocação das tábuas.
- source_word: וַיִּהְיוּ שָׁם
  choice: e elas ficaram ali
  rationale: A construção com היה e שׁם pode indicar que as tábuas estavam ou permaneceram naquele lugar. “Ficaram ali” preserva a ideia de estado resultante sem afirmar explicitamente que ainda estavam lá no momento da fala.
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: conforme ... me havia ordenado
  rationale: כַּאֲשֶׁר expressa correspondência, bem representada por “conforme”. O mais-que-perfeito torna natural em português a anterioridade da ordem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e segue a transliteração adotada pelo projeto.
- issue: Valor temporal de וַיִּהְיוּ שָׁם
  choice: elas ficaram ali
  alternative: elas estão ali
  rationale: A forma hebraica relata que as tábuas passaram a estar ali e pode sugerir permanência, mas não exige que a tradução explicite um presente contemporâneo ao discurso. “Ficaram ali” mantém melhor a ambiguidade temporal.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A coordenação longa do hebraico foi dividida em duas frases para fluidez, sem alterar a sequência das ações.
