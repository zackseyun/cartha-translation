  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: pt
  text: 'Naquele tempo, Yahweh me disse: “Talhe para você duas tábuas de pedra como as primeiras, suba até mim, no monte, e faça para você uma arca de madeira.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Expressa de modo natural a referência temporal deítica do hebraico e introduz o cenário narrativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: פְּסָל
  choice: Talhe
  rationale: O imperativo de פסל descreve o ato de cortar e dar forma às tábuas de pedra; “talhar” é claro, preciso e digno em português atual.
- source_word: לְךָ
  choice: para você
  rationale: Preserva a força benefactiva ou reflexiva do pronome sem recorrer ao menos natural “para ti” em português de ampla legibilidade brasileira.
- source_word: שְׁנֵי לֻוחֹת אֲבָנִים
  choice: duas tábuas de pedra
  rationale: É a formulação consagrada e natural para as tábuas da aliança, mantendo a construção material do hebraico.
- source_word: כָּרִאשֹׁנִים
  choice: como as primeiras
  rationale: Mantém a comparação explícita com as tábuas anteriores sem acrescentar explicação.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: suba até mim ao monte
  rationale: Comunica tanto o movimento ascendente quanto o destino indicado pelo ה direcional, preservando a relação “até mim” expressa por אֵלַי.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: e faça para você uma arca de madeira
  rationale: “Arca” preserva o sentido cultual do recipiente destinado às tábuas; “de madeira” reproduz naturalmente a indicação do material.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título; “Jeová” reflete uma vocalização híbrida posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se os imperativos e a repetição de “para você” do hebraico. Não foram incluídas notas, pois as alternativas fornecidas são variações formais sem ambiguidade substantiva no texto-fonte.
