  text: ה֥וּא תְהִלָּתְ/ךָ֖ וְ/ה֣וּא אֱלֹהֶ֑י/ךָ אֲשֶׁר עָשָׂ֣ה אִתְּ/ךָ֗ אֶת הַ/גְּדֹלֹ֤ת וְ/אֶת הַ/נּֽוֹרָאֹת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר רָא֖וּ עֵינֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: pt
  text: Ele é o seu louvor[a] e ele é o seu Deus, que fez por você estas coisas grandiosas e temíveis[b], que os seus olhos viram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele é aquele a quem você louva” ou “Ele é o motivo do seu louvor”. O hebraico diz literalmente: “Ele é o seu louvor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que inspiram temor” ou “aterradoras”. O termo hebraico descreve atos que despertam temor, reverência e assombro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: o seu louvor
  rationale: 'Preserva a formulação predicativa compacta do hebraico e sua força poética: Deus é tanto o objeto quanto o fundamento do louvor de Israel.'
- source_word: אֱלֹהֶיךָ
  choice: o seu Deus
  rationale: Mantém a linguagem pactual direta e o tratamento singular, pelo qual Israel é interpelado coletivamente.
- source_word: עָשָׂה אִתְּךָ
  choice: fez por você
  rationale: Expressa de modo natural o sentido benefactivo do idioma hebraico, referente aos atos realizados em favor de Israel.
- source_word: הַגְּדֹלֹת
  choice: coisas grandiosas
  rationale: O adjetivo substantivado designa 'as coisas grandiosas'; esta opção preserva a amplitude do termo sem restringi-lo apenas à ideia de poder.
- source_word: הַנּוֹרָאוֹת
  choice: temíveis
  rationale: O termo designa atos que despertam temor e reverência. 'Temíveis' conserva essa intensidade e a ambivalência entre medo e assombro, explicada em nota.
- source_word: רָאוּ עֵינֶיךָ
  choice: os seus olhos viram
  rationale: Preserva o idioma hebraico e sua ênfase vívida no testemunho ocular.
- source_word: הוּא ... וְהוּא
  choice: Ele é ... e ele é ...
  rationale: A repetição mantém a ênfase do pronome hebraico sem acrescentar exclusividade que não está explicitamente formulada.
theological_decisions:
- issue: Sentido da expressão predicativa הוּא תְהִלָּתְךָ
  choice: Ele é o seu louvor
  alternative: Ele é aquele a quem você louva; ele é o motivo do seu louvor
  rationale: A tradução escolhida conserva a tensão teológica e a concisão poética do hebraico, em que Deus pode ser entendido como objeto e fundamento do louvor.
- issue: Nuance de הַנּוֹרָאוֹת
  choice: coisas temíveis
  alternative: coisas que inspiram temor; coisas aterradoras
  rationale: '''Temíveis'' não reduz o termo a mera admiração nem o limita a terror destrutivo; preserva a gama de temor, reverência e assombro associada aos atos divinos.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular 'você' preserva o tratamento hebraico dirigido a Israel como uma unidade coletiva. A ordem e a repetição do original foram mantidas quando naturais em português.
