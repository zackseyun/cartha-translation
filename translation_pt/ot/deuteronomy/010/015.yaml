revisions:
- from: Contudo, foi aos seus antepassados que Yahweh se apegou, para amá-los, e escolheu depois deles a descendência deles — vocês — dentre todos os povos, como se vê hoje.[a]
  to: Contudo, foi aos seus antepassados que Yahweh se afeiçoou, para amá-los, e escolheu a descendência deles depois deles — vocês — dentre todos os povos, como se vê hoje.[a]
  rationale: A revisão elimina uma ambiguidade sintática relevante ao ligar claramente «depois deles» a «a descendência deles». Também substitui «se apegou» por «se afeiçoou», expressão portuguesa mais natural para o vínculo afetivo que o hebraico descreve. Não há alteração de sentido teológico nem resolução artificial das alternativas de רַק.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:02:27Z'
