  naturalness: O registro é moderno e digno. «Se afeiçoou» é uma formulação mais idiomática e relacional em português do que «se apegou» neste contexto. Reposicionar «depois deles» torna a frase clara sem perder o dado temporal/genealógico do hebraico.
  terminology: «Yahweh», «antepassados», «descendência», «povos» e «escolheu» são escolhas adequadas. A nota continua a registrar, sem resolver indevidamente, a alternativa restritiva de רַק e a nuance de deleite/afeição de חָשַׁק.
