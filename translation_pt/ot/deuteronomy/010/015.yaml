  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: pt
  text: Contudo, foi aos seus antepassados que Yahweh se afeiçoou, para amá-los, e escolheu a descendência deles depois deles — vocês — dentre todos os povos, como se vê hoje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Somente dos seus antepassados Yahweh se agradou, para amá-los”.'
    reason: Alternativa lexical e sintática para רַק e חָשַׁק, preservando a possível força restritiva de רַק e a nuance de deleite de חָשַׁק.
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: No contexto, introduz um contraste enfático entre o domínio universal de Yahweh e seu vínculo particular com os antepassados de Israel. “Contudo” expressa naturalmente essa força adversativa; a leitura restritiva “Somente” é registrada em nota.
- source_word: בַּאֲבֹתֶיךָ חָשַׁק
  choice: foi aos seus antepassados que Yahweh se apegou
  rationale: חָשַׁק com בְּ indica forte apego dirigido a alguém. A construção enfática em português preserva a particularidade do objeto sem reduzir o verbo a mera preferência.
- source_word: לְאַהֲבָה אֹתָם
  choice: para amá-los
  rationale: Mantém diretamente o infinitivo de propósito ou resultado e o vocabulário explícito do amor.
- source_word: וַיִּבְחַר
  choice: e escolheu
  rationale: “Escolheu” é o equivalente corrente e transparente do verbo בחר, preservando sua força sem ampliação doutrinária.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: depois deles a descendência deles
  rationale: זֶרַע tem sentido coletivo neste contexto. “Descendência” é natural em português e conserva a relação genealógica; “depois deles” mantém o elemento temporal do hebraico.
- source_word: בָּכֶם
  choice: — vocês —
  rationale: O pronome identifica em aposição a descendência mencionada com os ouvintes presentes. Os travessões tornam essa identificação clara.
- source_word: מִכָּל הָעַמִּים
  choice: dentre todos os povos
  rationale: “Povos” corresponde ao plural עַמִּים, e “dentre” expressa adequadamente escolha a partir de um conjunto.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê hoje
  rationale: A expressão aponta para a situação presente como confirmação observável. Esta formulação comunica o idioma hebraico com naturalidade em português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Eleição divina
  choice: Preservar explicitamente o apego, o amor e a escolha de Yahweh.
  alternative: Atenuar a declaração como simples preferência histórica ou expandi-la segundo um sistema doutrinário posterior.
  rationale: O hebraico reúne deliberadamente apego, amor e escolha. A tradução conserva essa tensão entre a soberania universal de Yahweh e sua escolha particular, sem explicá-la além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Antepassados” evita a possível leitura estritamente imediata de “pais”; “descendência” conserva o valor coletivo. A nota registra a ambiguidade real de רַק e a alternativa semântica de חָשַׁק.
