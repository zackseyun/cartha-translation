  text: הֵ֚ן לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/שָּׁמַ֖יִם וּ/שְׁמֵ֣י הַ/שָּׁמָ֑יִם הָ/אָ֖רֶץ וְ/כָל אֲשֶׁר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: pt
  text: 'Eis: a Yahweh, teu Deus, pertencem os céus, até mesmo os mais altos céus[a], a terra e tudo o que nela há.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «os céus e os céus dos céus».
    reason: Preserva a forma da expressão hebraica intensificadora traduzida no texto por uma formulação idiomática.
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Partícula discursiva que chama a atenção e dá ênfase. O plural concorda com o povo de Israel coletivamente interpelado no contexto e soa mais natural em português moderno do que «Eis».
- source_word: לַיהוָה
  choice: a Yahweh ... pertencem
  rationale: A preposição לְ expressa aqui posse ou relação dativa; a construção com «pertencem» reproduz com clareza a afirmação de domínio.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: O sufixo hebraico é masculino singular, pois Israel é tratado coletivamente. «Seu Deus» mantém essa forma de tratamento e tem leitura ampla no português internacional.
- source_word: הַשָּׁמַיִם
  choice: os céus
  rationale: Preserva o plural hebraico e o alcance cósmico, sem restringi-lo ao céu visível.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: até os mais altos céus
  rationale: A construção «céus dos céus» intensifica a expressão e pode ter valor superlativo. «Até os mais altos céus» comunica esse sentido naturalmente, enquanto a forma literal é preservada em nota.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O paralelismo com os céus e a referência a tudo o que nela há indicam o âmbito cósmico, não apenas uma região ou território.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: e tudo o que nela há
  rationale: Representa diretamente a totalidade expressa pela oração relativa e mantém a referência pronominal à terra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. «Yahweh» preserva explicitamente o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. «Vejam» dá naturalidade à interpelação enfática; a ordem «a Yahweh ... pertencem» conserva o destaque dado ao possuidor no hebraico.
