  text: וְ/אָנֹכִ֞י עָמַ֣דְתִּי בָ/הָ֗ר כַּ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וַ/יִּשְׁמַ֨ע יְהוָ֜ה אֵלַ֗/י גַּ֚ם בַּ/פַּ֣עַם הַ/הִ֔וא לֹא אָבָ֥ה יְהוָ֖ה הַשְׁחִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: pt
  text: Quanto a mim, permaneci no monte, como na primeira vez, quarenta dias e quarenta noites. Também naquela ocasião, Yahweh me ouviu[a]; Yahweh não quis destruir vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me atendeu”. O verbo hebraico pode significar tanto ouvir quanto escutar favoravelmente e responder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Quanto a mim
  rationale: A conjunção com o pronome independente retoma o relato e confere leve ênfase tópica a Moisés.
- source_word: עָמַדְתִּי
  choice: permaneci
  rationale: Embora o sentido básico seja 'fiquei de pé', aqui o verbo descreve a permanência prolongada de Moisés no monte; 'permaneci' comunica naturalmente esse valor contextual.
- source_word: בָהָר
  choice: no monte
  rationale: Expressão portuguesa natural para a localização de Moisés sobre o monte.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: como da primeira vez
  rationale: A expressão compara esta permanência de quarenta dias com a ocasião anterior, e não apenas com certos dias isolados.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: quarenta dias e quarenta noites
  rationale: Reprodução direta e idiomática da fórmula de duração.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahweh me ouviu
  rationale: שׁמע com אֶל pode indicar ouvir com atenção e responder favoravelmente; o contexto da intercessão sustenta essa nuance sem torná-la explícita demais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: Também naquela ocasião
  rationale: Expressa com clareza que a resposta favorável ocorreu novamente nessa ocasião.
- source_word: לֹא אָבָה
  choice: não quis
  rationale: Preserva de maneira concisa o sentido volitivo de não estar disposto ou não consentir.
- source_word: הַשְׁחִיתֶךָ
  choice: destruir vocês
  rationale: O hifil indica causar destruição; o sufixo singular se refere coletivamente a Israel, representado naturalmente em português por 'vocês'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e evita substituí-lo por um título.
- issue: Nuance da resposta divina em וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahweh me ouviu
  alternative: Yahweh me atendeu; Yahweh escutou o que eu disse
  rationale: '''Ouviu'' mantém a amplitude do verbo hebraico, que pode abranger tanto a audição quanto a acolhida favorável da intercessão; a nota registra essa ambiguidade.'
- issue: Número gramatical do destinatário em הַשְׁחִיתֶךָ
  choice: destruir vocês
  alternative: destruir você
  rationale: O hebraico usa o singular coletivo ao dirigir-se a Israel. Em português corrente, 'vocês' deixa claro que Moisés fala ao povo, sem transformar o referente em um indivíduo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente longa. 'Permaneci' expressa o valor contextual de עמד, enquanto 'como da primeira vez' identifica naturalmente a comparação com os primeiros quarenta dias.
