  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: pt
  text: Dali partiram para Gudgodá e, de Gudgodá, para Jotbatá, uma terra de cursos de água.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma terra de riachos” ou “uma terra de uádis”. A expressão hebraica נַחֲלֵי מָיִם pode referir-se a riachos, cursos de água sazonais ou aos leitos e ravinas por onde eles correm.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Dali
  rationale: A combinação da preposição com o advérbio indica partida do lugar anterior; “dali” expressa isso de modo natural e conciso em português.
- source_word: נָסְעוּ
  choice: partiram
  rationale: No contexto de itinerário no deserto, נסע denota levantar acampamento e seguir viagem. “Partiram” preserva a ideia de saída sem tornar a frase pesada.
- source_word: הַגֻּדְגֹּדָה
  choice: Gudgodá
  rationale: Nome de lugar transliterado segundo uma forma clara e pronunciável em português, com acento gráfico para indicar a tonicidade final.
- source_word: וּמִן
  choice: e, de
  rationale: Mantém a ligação narrativa simples e a indicação de procedência, sem acrescentar uma sequência temporal não explicitada.
- source_word: יָטְבָתָה
  choice: Jotbatá
  rationale: Nome de lugar transliterado em forma corrente e legível em português, com indicação gráfica da tonicidade final.
- source_word: אֶרֶץ
  choice: uma terra
  rationale: O substantivo descreve Jotbatá em aposição; “uma terra” conserva o caráter geográfico e descritivo.
- source_word: נַחֲלֵי מָיִם
  choice: de cursos de água
  rationale: A expressão construta pode designar canais naturais, ribeiros ou vales por onde corre água. “Cursos de água” é acessível e conserva a amplitude lexical melhor do que uma designação topográfica excessivamente específica.
