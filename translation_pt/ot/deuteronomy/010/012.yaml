id: DEU.10.12
reference: Deuteronomy 10:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: pt
  text: E agora, Israel, o que Yahweh, seu Deus, pede de você[a], senão que tema Yahweh, seu Deus[b], ande em todos os seus caminhos, o ame e sirva Yahweh, seu Deus, de todo o seu coração e de toda a sua alma[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exige de você”. O verbo hebraico pode indicar um pedido que implica obrigação.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “temer” inclui reverência, assombro e devoção obediente a Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Ou “de toda a sua vida” ou “com todo o seu ser”. O hebraico néfesh pode significar alma, vida ou a própria pessoa, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto a transição para a exortação presente.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: o que ... pede de você
  rationale: Expressa naturalmente a pergunta retórica; o verbo também pode implicar uma exigência, alternativa registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a forma com sufixo masculino singular, pois Israel é interpelado coletivamente como uma só pessoa.
- source_word: כִּי אִם
  choice: senão que
  rationale: Preserva a força limitadora da construção e introduz naturalmente, em português, o conteúdo do que Deus pede.
- source_word: לְיִרְאָה
  choice: que tema
  rationale: Mantém a força lexical de temor, sem reduzi-la apenas a respeito, e se encaixa na sequência regida por 'senão que'.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: ande em todos os seus caminhos
  rationale: Conserva a metáfora hebraica do andar como modo de vida e conduta.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: o ame
  rationale: Traduz diretamente o amor devido a Yahweh, mantendo sua dimensão relacional e pactual.
- source_word: וְלַעֲבֹד
  choice: sirva
  rationale: Abrange obediência, devoção e serviço cultual sem restringir o sentido somente à adoração ritual.
- source_word: בְּכָל לְבָבְךָ
  choice: de todo o seu coração
  rationale: Emprega a expressão portuguesa estabelecida para a totalidade da disposição interior, incluindo vontade e pensamento.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: de toda a sua alma
  rationale: Preserva a expressão tradicional e a ideia de entrega integral; a amplitude semântica de נֶפֶשׁ é indicada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta o nome pessoal divino; a transliteração preserva sua função pactual sem substituí-lo por um título.
- issue: Força de ירא na exortação pactual
  choice: tema
  alternative: reverencie
  rationale: ‘Tema’ conserva a tensão entre temor, reverência, assombro e obediência devota, sem suavizar o termo hebraico.
- issue: Extensão de עבד no serviço a Deus
  choice: sirva
  alternative: adore
  rationale: ‘Sirva’ preserva o alcance amplo da dedicação pactual, que inclui adoração, mas não se limita a atos cultuais.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se o tratamento singular de Israel (‘você’, ‘seu’), correspondente ao hebraico, e conserva-se a metáfora bíblica de andar nos caminhos de Deus.
