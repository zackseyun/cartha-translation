  text: וָ/אַ֤עַשׂ אֲרוֹן֙ עֲצֵ֣י שִׁטִּ֔ים וָ/אֶפְסֹ֛ל שְׁנֵי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וָ/אַ֣עַל הָ/הָ֔רָ/ה וּ/שְׁנֵ֥י הַ/לֻּחֹ֖ת בְּ/יָדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: pt
  text: Então fiz uma arca de madeira de acácia e talhei duas tábuas de pedra como as primeiras. Depois subi o monte com as duas tábuas na mão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַעַשׂ
  choice: fiz
  rationale: O verbo עשה tem o sentido amplo de fazer; “fiz” traduz de modo direto e natural a ação de Moisés.
- source_word: אֲרוֹן
  choice: arca
  rationale: Embora o substantivo possa designar um baú ou cofre, “arca” é o termo consagrado e contextualmente preciso para o recipiente sagrado das tábuas da aliança.
- source_word: עֲצֵי שִׁטִּים
  choice: madeira de acácia
  rationale: A expressão indica madeira proveniente de acácias; esta formulação é clara, atual e preserva a espécie mencionada.
- source_word: וָאֶפְסֹל
  choice: talhei
  rationale: O verbo פסל descreve o trabalho de cortar e dar forma à pedra. “Talhei” expressa essa ação com precisão e sem o caráter arcaico de “lavrei”.
- source_word: לֻחֹת אֲבָנִים
  choice: tábuas de pedra
  rationale: A construção hebraica designa tábuas feitas de pedra; a formulação é idiomática e preserva o sentido físico.
- source_word: כָּרִאשֹׁנִים
  choice: como as primeiras
  rationale: A preposição comparativa כ e o adjetivo “primeiras” indicam correspondência com as tábuas anteriores.
- source_word: וָאַעַל הָהָרָה
  choice: subi o monte
  rationale: O verbo עלה, junto à forma direcional הָהָרָה, descreve a subida ao monte, e não apenas deslocamento em sua direção.
- source_word: בְּיָדִי
  choice: na mão
  rationale: Mantém o singular do hebraico e constitui uma expressão natural em português para algo que se leva consigo.
theological_decisions:
- issue: Designação do recipiente sagrado das tábuas da aliança
  choice: arca
  alternative: baú
  rationale: “Arca” conserva a referência cultual e pactual reconhecível no contexto, sem acrescentar afirmações teológicas ausentes do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Talhei” preserva a ação concreta de moldar a pedra; a divisão em duas frases torna natural a sequência narrativa sem alterar seu conteúdo.
