base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: pt
  text: Tema Yahweh, seu Deus; sirva a ele, apegue-se a ele e jure pelo nome dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Expressa naturalmente em português o construto com sufixo masculino singular, na forma de tratamento individual do contexto.
- source_word: תִּירָא
  choice: Tema
  rationale: O verbo denota temor que, neste contexto de aliança, inclui reverência; “tema” preserva sua força sem reduzir o sentido a simples respeito.
- source_word: אֹתוֹ תַעֲבֹד
  choice: sirva somente a ele
  rationale: עבד significa fundamentalmente “servir” e pode incluir serviço cultual. O pronome objeto anteposto é enfático; “somente a ele” torna essa focalização natural em português.
- source_word: וּבוֹ תִדְבָּק
  choice: apegue-se a ele
  rationale: Com דבק, a preposição ב indica ligação estreita a uma pessoa. “Apegar-se a” comunica de modo atual a lealdade e adesão próprias da aliança.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: jure pelo nome dele
  rationale: A construção com שבע no nifal é a expressão hebraica para prestar juramento invocando alguém; “jurar pelo nome” preserva seu caráter jurídico e religioso.
theological_decisions:
- issue: Força modal dos imperfeitos hebraicos em exortação de aliança
  choice: 'Imperativos coordenados: “Tema... sirva... apegue-se... jure”.'
  alternative: 'Futuro prescritivo: “Você temerá... servirá... se apegará... jurará”.'
  rationale: No contexto, os imperfeitos têm força normativa. Em português moderno, o imperativo transmite essa força com mais naturalidade e dignidade do que o futuro prescritivo, sem transformar as obrigações em meras previsões.
- issue: Ênfase exclusiva em אֹתוֹ, pronome objeto anteposto
  choice: “sirva somente a ele”
  alternative: “a ele sirva” ou simplesmente “sirva-o”
  rationale: A ordem hebraica destaca o objeto. “Somente a ele” comunica claramente a exclusividade exigida no contexto da aliança, enquanto a construção marcada “a ele sirva” soa menos natural em português.
- issue: Sentido de temor diante de Deus
  choice: “Tema” no texto, entendido como temor reverente
  alternative: “Reverencie”
  rationale: “Tema” conserva a amplitude e a tensão teológica de ירא, que inclui reverência sem excluir a dimensão real de temor; “reverencie” estreitaria o termo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A sequência de imperativos reproduz o ritmo exortativo do hebraico. Optou-se por “seu Deus” e “nome dele”, formas naturais no português brasileiro; não há necessidade de nota textual neste versículo.
