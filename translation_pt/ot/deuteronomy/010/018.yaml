id: DEU.10.18
reference: Deuteronomy 10:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אֹהֵ֣ב גֵּ֔ר לָ֥/תֶת ל֖/וֹ לֶ֥חֶם וְ/שִׂמְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: pt
  text: Ele faz justiça ao órfão[a] e à viúva e ama o estrangeiro residente[b], dando-lhe alimento e roupa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico se refere especificamente a alguém privado do pai; também pode ser traduzido por “quem não tem pai”.
    reason: lexical_alternative
  - marker: b
    text: Ou “imigrante” ou “estrangeiro”. O termo hebraico designa um não israelita que residia no meio de Israel, e não apenas alguém de passagem.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “pão e roupa”. Aqui, “pão” representa o alimento ou sustento básico.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: faz justiça
  rationale: A expressão hebraica indica exercer ou garantir a justiça devida. “Faz justiça” é natural em português e conserva tanto a ação concreta quanto a força jurídico-ética.
- source_word: יָתוֹם
  choice: órfão
  rationale: O termo designa especialmente quem foi privado do pai. “Órfão” é a forma corrente e clara em português; a nota preserva a nuance específica do hebraico.
- source_word: אַלְמָנָה
  choice: viúva
  rationale: Equivalente direto e corrente para a categoria social vulnerável mencionada no texto.
- source_word: אֹהֵב
  choice: ama
  rationale: Reproduz diretamente a disposição ativa de Deus para com o גֵּר, sem reduzi-la apenas a sentimento ou assistência.
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: O hebraico se refere a um não israelita que vive no meio de Israel, não simplesmente a um visitante ou viajante. A expressão explicita essa condição jurídico-social em português atual.
- source_word: לָתֶת לוֹ
  choice: dando-lhe
  rationale: O infinitivo apresenta a provisão material como expressão concreta desse amor; o gerúndio estabelece essa relação naturalmente em português.
- source_word: לֶחֶם
  choice: alimento
  rationale: Embora o sentido literal seja “pão”, neste par com roupa o termo representa sustento básico. “Alimento” comunica essa função sem restringi-la a um único item.
- source_word: שִׂמְלָה
  choice: roupa
  rationale: Termo natural e amplamente compreensível para vestimenta, adequado ao par de necessidades básicas formado com alimento.
theological_decisions:
- issue: A preocupação divina com pessoas socialmente vulneráveis
  choice: Apresentar tanto a ação judicial de Deus quanto seu amor manifestado em provisão material.
  alternative: Enfatizar somente a defesa jurídica ou somente a compaixão afetiva.
  rationale: O hebraico reúne מִשְׁפַּט, a prática da justiça, e אֹהֵב, o amor, seguido pela concessão de alimento e roupa. A tradução mantém juntas essas dimensões sem acrescentar uma formulação doutrinária mais ampla.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Faz justiça” evita solenidade artificial; “estrangeiro residente” preserva a precisão social e jurídica de גֵּר. Os marcadores seguem a ordem de ocorrência no texto.
