  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: pt
  text: Declaro hoje a vocês que certamente perecerão[a]; vocês não prolongarão seus dias[b] na terra que você[c] está atravessando o Jordão para entrar ali e tomar posse dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “perecendo, perecerão”, construção enfática que significa “certamente perecerão”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não viverão muito na terra”.'
    reason: lexical_alternative
  - marker: c
    text: Neste ponto, o hebraico passa das formas plurais para o singular “você”, dirigindo-se a Israel como um só povo.
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי
  choice: Declaro
  rationale: O hifil de נגד expressa tornar conhecido ou declarar. “Declaro” conserva o tom solene da advertência.
- source_word: לָכֶם
  choice: a vocês
  rationale: O pronome está no plural e identifica os israelitas como os destinatários da declaração.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente temporal direto e natural, que mantém a imediatidade da linguagem de aliança.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo da declaração de modo idiomático em português.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: certamente perecerão
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza do resultado; “certamente” transmite essa ênfase sem reproduzir de modo artificial a repetição hebraica.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: não prolongarão seus dias
  rationale: Mantém a imagem hebraica de tornar longos os dias e sua ressonância pactual, sem reduzi-la à paráfrase “não viverão muito”.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: Neste contexto, אֲדָמָה designa o território prometido além do Jordão. “Na terra” é natural em português e conserva a referência territorial.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת־הַיַּרְדֵּן
  choice: para a qual você está atravessando o Jordão
  rationale: A construção indica a terra à qual Israel se dirige ao atravessar o Jordão. O singular “você” preserva a mudança do plural para o singular coletivo no texto hebraico.
- source_word: לָבֹא שָׁמָּה
  choice: a fim de entrar ali
  rationale: “Entrar” expressa o movimento de בוא, e “ali” representa explicitamente o advérbio שָׁמָּה.
- source_word: לְרִשְׁתָּהּ
  choice: e tomar posse dela
  rationale: ירש, neste contexto da terra prometida, significa tomar posse. “Dela” representa o sufixo feminino singular que retoma “terra”.
theological_decisions:
- issue: Mudança do plural para o singular coletivo ao dirigir-se a Israel
  choice: Preservar “a vocês/perecerão/prolongarão” no plural e mudar para “você” no singular na oração sobre a travessia do Jordão
  alternative: Uniformizar todo o versículo no plural para maior fluidez em português
  rationale: O hebraico começa com formas plurais e depois passa ao singular אַתָּה, tratando Israel como um só povo. Preservar a mudança mantém a retórica da fonte e evita apagar uma característica genuína do texto.
- issue: Terminologia da terra da aliança
  choice: Traduzir הָאֲדָמָה por “a terra”
  alternative: o solo; o chão
  rationale: A advertência diz respeito ao território prometido que Israel está prestes a ocupar, e não ao solo em sentido material.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a solenidade da advertência, o idioma relativo à duração dos dias, os elementos explícitos “ali” e “dela” e a mudança deliberada do plural para o singular coletivo.
