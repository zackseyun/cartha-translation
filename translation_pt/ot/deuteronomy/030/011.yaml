base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: pt
  text: Pois este mandamento que hoje lhe ordeno não é difícil demais para você[a], nem está longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não está além do seu alcance” ou “não está escondido de você”. O verbo hebraico pode indicar algo extraordinário, inacessível ou além da compreensão ou capacidade de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da exortação anterior e preserva com naturalidade o fluxo argumentativo.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: este mandamento
  rationale: Mantém o registro pactual e jurídico de מִצְוָה em Deuteronômio.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhe ordeno
  rationale: Expressa de modo natural em português a ação presente de Moisés e conserva a ênfase temporal em “hoje”.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: não é difícil demais para você
  rationale: No contexto, פלא indica aquilo que é extraordinário, inacessível ou está além do alcance; a formulação comunica a acessibilidade prática do mandamento sem eliminar outras nuances, registradas em nota.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: nem está longe
  rationale: Preserva a metáfora espacial de distância, desenvolvida nos versículos seguintes, em português claro e idiomático.
theological_decisions:
- issue: Sentido de נִפְלֵאת em relação à capacidade humana e à obediência à aliança
  choice: não é difícil demais para você
  alternative: não está além do seu alcance; não está escondido de você
  rationale: A tradução destaca que o mandamento não é inacessível no contexto imediato da aliança, sem afirmar uma doutrina mais ampla sobre capacidade moral humana autônoma ou sem auxílio divino.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você” torna explícito o singular hebraico dirigido a Israel como interlocutor coletivo; “lhe ordeno” evita repetição pouco natural sem perder essa referência.
