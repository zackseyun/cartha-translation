  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: pt
  text: E Yahweh, seu Deus, levará você à terra que seus pais possuíram[a], e você tomará posse dela. Ele lhe fará bem[b] e o tornará mais numeroso do que seus pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que seus pais herdaram” ou “da qual seus pais tomaram posse”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fará você prosperar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: levará você
  rationale: O hifil de בוא expressa fazer entrar ou levar. O contexto implica retorno, mas o verbo, por si só, não explicita “de volta”.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Preserva o nome divino expresso pelo tetragrama e traduz diretamente a identificação pactual “seu Deus”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Em Deuteronômio, o termo designa naturalmente a terra prometida, mantendo tanto o sentido geográfico quanto o pactual.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: que seus pais possuíram
  rationale: ירשׁ pode significar herdar, possuir ou tomar posse. Aqui descreve a relação anterior dos pais com a terra; “possuíram” é claro e preserva a amplitude básica do verbo.
- source_word: וִירִשְׁתָּהּ
  choice: e você tomará posse dela
  rationale: Com a terra como objeto, ירשׁ comunica apropriação ou posse efetiva. A formulação é natural em português e mantém o aspecto ativo.
- source_word: וְהֵיטִבְךָ
  choice: Ele lhe fará o bem
  rationale: O hifil de יטב com sufixo pessoal significa literalmente fazer o bem a alguém. A escolha evita restringir a bênção apenas à prosperidade material.
- source_word: וְהִרְבְּךָ
  choice: e o tornará mais numeroso
  rationale: O hifil de רבה significa aumentar ou tornar numeroso. Esta formulação comunica em português natural o aumento do povo representado pelo “você” coletivo.
- source_word: מֵאֲבֹתֶיךָ
  choice: do que seus pais
  rationale: A preposição מן tem valor comparativo, e “pais” preserva o termo masculino plural explícito do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o tetragrama como nome próprio de Deus; sua transliteração preserva essa função, sem substituí-lo por um título.
- issue: Alcance de וְהֵיטִבְךָ
  choice: lhe fará o bem
  alternative: fará você prosperar
  rationale: A expressão hebraica é ampla e pode incluir prosperidade, mas não se limita explicitamente a ela; a redação principal conserva essa amplitude.
- issue: Termo de parentesco אֲבֹתֶיךָ
  choice: seus pais
  alternative: seus antepassados
  rationale: O hebraico emprega o substantivo masculino plural “pais”. A tradução o preserva, embora no contexto se refira aos antepassados de Israel.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pronome singular “você” conserva a interpelação hebraica no singular, dirigida coletivamente a Israel. A divisão em duas frases melhora a legibilidade sem alterar a relação entre as orações.
