source:
  edition: WLC
  text: לֹ֥א בַ/שָּׁמַ֖יִם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲלֶה לָּ֤/נוּ הַ/שָּׁמַ֨יְמָ/ה֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: pt
  text: 'Ela não está no céu[a], para que digas: “Quem subirá ao céu por nós, irá buscá-la para nós e nos fará ouvi-la, para que a pratiquemos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal: “Quem subirá por nós ao céu, a tomará para nós e nos fará ouvi-la, para que a façamos?”'
    reason: Registra uma tradução mais formal da sequência verbal e da posição de ‘por nós’, sem alterar o sentido básico.
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: no céu
  rationale: Expressa de modo natural em português o âmbito celeste e inacessível contrastado, no contexto, com aquilo que está perto; embora a forma hebraica seja morfologicamente plural, o singular é idiomático em português.
- source_word: הִוא
  choice: Ela
  rationale: Mantém o pronome feminino singular hebraico, cujo referente contextual é a palavra feminina מִצְוָה, ‘ordem’ ou ‘mandamento’.
- source_word: לֵאמֹר
  choice: para que digas
  rationale: Introduz a objeção hipotética e preserva tanto a finalidade/consequência da construção quanto a segunda pessoa singular do discurso.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Quem subirá ao céu por nós
  rationale: ‘Subirá’ conserva o movimento ascendente de עלה, e ‘por nós’ comunica o valor benefactivo de לָנוּ em ordem natural no português.
- source_word: הַשָּׁמַיְמָה
  choice: ao céu
  rationale: A terminação direcional hebraica indica movimento em direção ao céu.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: irá buscá-la para nós
  rationale: No contexto, לקח descreve obter e trazer a ordem desde o céu. ‘Irá buscá-la’ transmite essa ação com clareza contemporânea, enquanto o pronome feminino preserva a referência gramatical.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: e nos fará ouvi-la
  rationale: Preserva a força causativa do hifil de שמע sem substituí-la pela interpretação mais específica ‘proclamá-la’.
- source_word: וְנַעֲשֶׂנָּה
  choice: para que a pratiquemos
  rationale: Comunica em português natural a execução ou observância da ordem. ‘Praticar’ evita a formulação pouco idiomática ‘fazê-la’, embora esta seja mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O singular ‘digas’ e o plural ‘nós’ refletem a passagem do destinatário coletivo tratado no singular para a fala hipotética do povo. O pronome ‘Ela’ pressupõe o referente no versículo anterior e evita inserir novamente ‘ordem’ ou ‘mandamento’ no texto.
