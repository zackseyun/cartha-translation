  text: אִם יִהְיֶ֥ה נִֽדַּחֲ/ךָ֖ בִּ/קְצֵ֣ה הַ/שָּׁמָ֑יִם מִ/שָּׁ֗ם יְקַבֶּצְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וּ/מִ/שָּׁ֖ם יִקָּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: pt
  text: Se os seus dispersos[a] estiverem na extremidade dos céus[b], de lá Yahweh, seu Deus, reunirá você, e de lá levará você[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “desterrados”, “banidos” ou “espalhados”. O hebraico se refere aos que foram afastados ou dispersos.
    reason: lexical_alternative
  - marker: b
    text: “Na extremidade dos céus” é uma expressão hebraica para o lugar mais distante possível.
    reason: cultural_note
  - marker: c
    text: Ou “tomará você”. O verbo hebraico significa, mais literalmente, “tomar”; no contexto, também pode ser entendido como “trazer você”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִהְיֶה
  choice: Se ... estiverem
  rationale: אִם introduz uma condição. Embora יִהְיֶה esteja formalmente no singular, a expressão se refere coletivamente aos membros dispersos de Israel; o plural é natural em português com “os seus dispersos”.
- source_word: נִדַּחֲךָ
  choice: os seus dispersos
  rationale: A forma deriva de נדח e designa quem foi afastado, expulso ou espalhado. “Dispersos” conserva o sentido resultante sem especificar indevidamente a causa do afastamento.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: na extremidade dos céus
  rationale: Mantém a imagem espacial hebraica, que indica o lugar mais remoto possível, e conserva o registro elevado de שָׁמַיִם.
- source_word: מִשָּׁם
  choice: de lá
  rationale: A expressão ocorre duas vezes no hebraico para dar ênfase ao lugar remoto de onde virá a restauração; a repetição foi preservada.
- source_word: יְקַבֶּצְךָ
  choice: reunirá você
  rationale: O piel de קבץ significa reunir ou ajuntar. Não se acrescentou “de volta”, pois essa ideia pertence ao contexto, mas não está expressa no verbo.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: O nome divino foi transliterado como “Yahweh”, e אֱלֹהֶיךָ foi traduzido pela designação pactual natural “seu Deus”.
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: e de lá tomará você
  rationale: לקח tem o sentido básico de tomar. A formulação preserva essa amplitude lexical, sem antecipar explicitamente o movimento descrito no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou a substituição pelo título “SENHOR”
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança, em vez de substituí-lo por um título.
- issue: Tratamento do singular coletivo dirigido a Israel
  choice: Manter “você/seu” para Israel coletivamente, com “dispersos” para seus membros espalhados
  alternative: Expandir para “vocês” ou “seu povo exilado”
  rationale: O hebraico dirige-se a Israel no singular pactual. A tradução mantém essa forma de tratamento, ao mesmo tempo que torna compreensível a referência coletiva aos dispersos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conservam-se a repetição enfática de “de lá”, a imagem hebraica dos céus e o tratamento coletivo de Israel por “você”. A construção final é deliberadamente um pouco marcada para preservar o sentido amplo de לקח.
