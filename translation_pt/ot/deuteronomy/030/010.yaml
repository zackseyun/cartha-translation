  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר מִצְוֺתָי/ו֙ וְ/חֻקֹּתָ֔י/ו הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּ֑ה כִּ֤י תָשׁוּב֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: pt
  text: se você obedecer à voz[a] de Yahweh, seu Deus, guardando os seus mandamentos e os seus estatutos escritos neste Livro da Lei, e se voltar[b] para Yahweh, seu Deus, de todo o seu coração e de toda a sua alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ouvir a voz”; a expressão significa dar ouvidos ao que ele diz e obedecer.'
    reason: lexical_alternative
  - marker: b
    text: Ou “retornar” ou “arrepender-se”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: se
  rationale: Neste contexto, introduz a condição ligada à promessa dos versículos anteriores; “se” comunica naturalmente essa função.
- source_word: תִשְׁמַע בְּקוֹל
  choice: obedecer à voz
  rationale: A expressão hebraica significa escutar de modo atento e obediente. A tradução preserva a imagem da “voz” e explicita seu sentido contextual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לִשְׁמֹר
  choice: guardando
  rationale: O infinitivo esclarece em que consiste obedecer à voz de Yahweh e mantém uma formulação tradicional e compreensível em contexto legal e pactual.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: os seus mandamentos e os seus estatutos
  rationale: Mantém a distinção entre os dois termos jurídicos hebraicos, com vocabulário corrente nas traduções da Torá.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: neste Livro da Lei
  rationale: Expressa com clareza o documento da aliança; “livro” é natural em português, embora o suporte histórico pudesse ser um rolo.
- source_word: כִּי תָשׁוּב
  choice: e se voltar
  rationale: O segundo כִּי retoma a condição, enquanto שׁוּב conserva a metáfora de retorno a Deus e suas implicações de arrependimento sem reduzi-las a um termo interpretativo.
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: de todo o seu coração e de toda a sua alma
  rationale: Formulação idiomática em português que comunica a totalidade da dedicação interior e da própria vida.
theological_decisions:
- issue: Sentido pactual de שׁוּב em contexto de arrependimento
  choice: voltar
  alternative: arrepender-se; retornar
  rationale: “Voltar” preserva o movimento metafórico do hebraico em direção a Yahweh, incluindo suas conotações de arrependimento e restauração da aliança sem tornar uma delas exclusiva.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração mantém o nome pessoal presente no texto hebraico e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A repetição de “Yahweh, seu Deus” e a estrutura condicional foram mantidas por sua importância retórica e pactual. O segundo “se” foi ligado por “e” para tornar clara a coordenação das condições em português.
