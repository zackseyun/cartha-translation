  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: pt
  text: Yahweh, seu Deus, fará recair todas estas maldições[a] sobre seus inimigos e sobre os que odeiam você e perseguiram você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos estes juramentos”. Em Deuteronômio, este termo geralmente se refere às maldições ou sanções da aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: fará recair
  rationale: Neste contexto, נתן expressa a imposição das sanções sobre alguém. “Fará recair” é natural em português com “maldições” e preserva a imagem de que elas passam a atingir os inimigos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a relação possessiva da forma com sufixo de segunda pessoa masculina singular em português moderno e amplamente compreensível.
- source_word: כָּל הָאָלוֹת הָאֵלֶּה
  choice: todas estas maldições
  rationale: No contexto da aliança em Deuteronômio, אָלָה designa sobretudo as maldições ou sanções da aliança; a nota conserva a possibilidade lexical mais ampla de “juramentos”.
- source_word: עַל אֹיְבֶיךָ
  choice: sobre os seus inimigos
  rationale: A preposição עַל indica aqueles sobre quem recaem as maldições, e אֹיְבֶיךָ significa diretamente “seus inimigos”.
- source_word: וְעַל שֹׂנְאֶיךָ
  choice: e sobre aqueles que odeiam você
  rationale: A expressão relativa transmite naturalmente em português a força do particípio “os que odeiam”, evitando o pouco idiomático “seus odiadores”.
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: os quais o perseguiram
  rationale: רדף tem o sentido amplo de perseguir ou ir no encalço. A formulação mantém o vínculo da oração relativa com aqueles que odeiam o destinatário, sem especificar a forma da perseguição.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta o nome próprio da aliança. “Yahweh” o preserva como nome, sem substituí-lo pelo título “SENHOR”.
- issue: Sentido de אָלוֹת no contexto da aliança
  choice: maldições
  alternative: juramentos
  rationale: O contexto imediato trata das sanções da aliança anteriormente anunciadas. “Maldições” comunica esse sentido contextual, enquanto a nota registra a extensão lexical do termo.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por “seu/você” para ampla legibilidade brasileira e internacional. A expressão “fará recair” é idiomática sem perder a imagem hebraica de impor as maldições sobre alguém.
