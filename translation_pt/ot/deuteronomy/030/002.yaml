base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: pt
  text: e você voltar para Yahweh, seu Deus, e obedecer à sua voz[a], conforme tudo o que hoje ordeno a você e a seus filhos[b], de todo o seu coração e de toda a sua alma[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escutar a sua voz”. A expressão hebraica frequentemente tem o sentido mais forte de dar ouvidos e obedecer.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus filhos”. Neste contexto da aliança, o termo pode funcionar genericamente para a prole.'
    reason: lexical_scope
  - marker: c
    text: Ou “de toda a sua vida” ou “com todo o seu ser”. O termo hebraico traduzido por “alma” pode ter esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ
  choice: e você voltar
  rationale: שׁוּב significa comumente “voltar” ou “retornar”. No contexto da aliança, pode implicar arrependimento, mas “voltar” preserva a imagem concreta sem restringi-la a um termo teológico.
- source_word: עַד יְהוָה אֱלֹהֶיךָ
  choice: para Yahweh, seu Deus
  rationale: 'Com שׁוּב, עַד indica retorno em direção a alguém. O nome da aliança יְהוָה é transliterado como “Yahweh”, e אֱלֹהֶיךָ é possessivo: “seu Deus”.'
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: e obedecer à sua voz
  rationale: A construção שׁמע בְּקוֹל frequentemente significa dar ouvidos de modo obediente. A formulação mantém tanto a força de “obedecer” quanto a imagem hebraica da voz.
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: conforme tudo o que hoje lhe ordeno
  rationale: “Conforme tudo” expressa correspondência com a totalidade do mandamento; “hoje lhe ordeno” é natural em português e preserva a ênfase temporal.
- source_word: אַתָּה וּבָנֶיךָ
  choice: você e seus filhos
  rationale: בָּנִים significa literalmente “filhos” e, neste contexto de aliança e descendência, pode abranger genericamente os descendentes. Em português, “filhos” também pode ter esse uso inclusivo.
- source_word: בְּכָל לְבָבְךָ
  choice: de todo o seu coração
  rationale: Expressão portuguesa corrente que comunica integralidade da disposição interior, correspondente ao amplo sentido antropológico de לֵבָב.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: e de toda a sua alma
  rationale: נֶפֶשׁ pode indicar alma, vida, pessoa ou ser inteiro. “Alma” preserva a formulação tradicional e a tensão semântica, enquanto a nota registra alternativas legítimas.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título; “Jeová” representa uma forma tradicional posterior.
- issue: Alcance de בָנֶיךָ
  choice: seus filhos
  alternative: seus filhos homens; seus descendentes
  rationale: O plural masculino pode referir-se genericamente à prole no contexto da aliança. “Seus filhos” mantém maior proximidade lexical e pode ser entendido de forma abrangente em português.
- issue: Sentido antropológico de נַפְשֶׁךָ
  choice: sua alma
  alternative: sua vida; todo o seu ser
  rationale: O termo hebraico tem amplitude semântica e não exige aqui uma definição técnica da alma. A tradução conserva a expressão tradicional, e a nota explicita outras leituras possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi mantida próxima do hebraico sem produzir uma frase artificial. O infinitivo flexionado após a condição iniciada no contexto anterior é representado por “você voltar” e “obedecer”, preservando a continuidade sintática do versículo.
