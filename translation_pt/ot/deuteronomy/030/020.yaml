base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: pt
  text: amando Yahweh, seu Deus, ouvindo a sua voz[a] e apegando-se a ele[b]; pois ele é a sua vida e a duração de seus dias, para que você habite na terra que Yahweh jurou dar a seus pais[c], a Abraão, Isaque e Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “obedecendo à sua voz”; a expressão hebraica “ouvir a voz” muitas vezes inclui a ideia de atender ou obedecer.
    reason: lexical_alternative
  - marker: b
    text: Ou “mantendo-se firmemente unido a ele”.
    reason: lexical_alternative
  - marker: c
    text: Ou “aos seus antepassados”; mantém-se “pais” porque o texto logo nomeia Abraão, Isaque e Jacó.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה
  choice: amando
  rationale: O infinitivo com לְ continua a explicação dos meios pelos quais se escolhe a vida no versículo anterior; o gerúndio preserva essa ligação discursiva com naturalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva sua força pessoal e pactual.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: ouvindo a sua voz
  rationale: Conserva a imagem concreta do hebraico; nesse idioma, ouvir a voz frequentemente inclui atender e obedecer, nuance indicada em nota.
- source_word: וּלְדָבְקָה בוֹ
  choice: e apegando-se a ele
  rationale: דבק com ב expressa adesão estreita e lealdade; 'apegar-se' é atual e mantém a dimensão relacional.
- source_word: כִּי הוּא חַיֶּיךָ
  choice: pois ele é a sua vida
  rationale: O pronome remete mais naturalmente a Yahweh; a formulação direta preserva a força pessoal da oração nominal hebraica.
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: e a duração dos seus dias
  rationale: Mantém o idioma hebraico sem o expandir para 'fonte de vida' nem reduzir a expressão simplesmente a 'vida longa'.
- source_word: לָשֶׁבֶת עַל הָאֲדָמָה
  choice: para que você habite na terra
  rationale: Expressa a finalidade ou o resultado do viver e da duração dos dias; 'habite' preserva o vínculo com a terra prometida.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: que Yahweh jurou
  rationale: Traduz diretamente o verbo de juramento e conserva seu caráter solene e pactual.
- source_word: לַאֲבֹתֶיךָ
  choice: aos seus pais
  rationale: Mantém o masculino do texto e se ajusta à identificação imediata deles como Abraão, Isaque e Jacó.
- source_word: לָתֵת לָהֶם
  choice: dar a eles
  rationale: Preserva o infinitivo e o objeto indireto explícito do hebraico, ligado ao juramento de Yahweh.
theological_decisions:
- issue: Referente de הוּא em 'ele é a sua vida'
  choice: O pronome refere-se ao próprio Yahweh.
  alternative: O pronome pode ser entendido conceitualmente como referência ao caminho de amor, escuta e fidelidade descrito antes.
  rationale: Yahweh é o antecedente pessoal mais próximo e saliente, e o pronome masculino singular favorece essa leitura, sem negar a ligação conceitual entre vida e fidelidade à aliança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular masculino de segunda pessoa foi vertido por “você/seu”, evitando formas arcaicas. A ordem conserva o encadeamento dos infinitivos hebraicos e a solenidade do juramento, sem sacrificar a clareza.
