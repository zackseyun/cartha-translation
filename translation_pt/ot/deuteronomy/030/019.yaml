  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: pt
  text: Hoje tomo os céus e a terra como testemunhas contra vocês:[a] pus diante de vocês a vida e a morte, a bênção e a maldição. Escolham, pois, a vida, para que vocês e seus descendentes[b] vivam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega formas no singular ao se dirigir a Israel como um todo e apresenta os céus e a terra como testemunhas em linguagem jurídica de aliança.
    reason: Nota gramatical e cultural sobre o destinatário representativo e a fórmula forense.
  - marker: b
    text: Literalmente, “semente”; isto é, descendência ou posteridade.
    reason: Alternativa lexical para זֶרַע.
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: tomo ... como testemunhas contra vocês
  rationale: Preserva o sentido causativo e jurídico do hifil de עוּד com בְּ, adequado ao contexto de aliança, em português natural.
- source_word: הַיּוֹם
  choice: Hoje
  rationale: Reproduz diretamente a ênfase temporal em linguagem atual.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: os céus e a terra
  rationale: Mantém o plural morfológico de שָׁמַיִם e a fórmula hebraica que abrange a totalidade da criação.
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: a vida e a morte
  rationale: Tradução direta do par de resultados contrapostos da aliança.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: pus diante de vocês
  rationale: Expressa idiomaticamente a apresentação concreta das alternativas; o pretérito perfeito corresponde ao perfeito hebraico no discurso.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: a bênção e a maldição
  rationale: Conserva os substantivos singulares definidos e o contraste da aliança.
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: Escolham, pois, a vida
  rationale: O perfeito com waw assume força injuntiva no contexto. 'Pois' comunica a ligação exortativa com as alternativas anteriores sem acrescentar uma conclusão teológica.
- source_word: לְמַעַן תִּחְיֶה
  choice: para que ... vivam
  rationale: Mantém a força de propósito ou resultado de לְמַעַן, sem decidir rigidamente entre essas nuances.
- source_word: אַתָּה וְזַרְעֶךָ
  choice: vocês e seus descendentes
  rationale: זֶרַע denota a posteridade. O plural português torna legível o destinatário coletivo, Israel, embora as formas hebraicas sejam masculinas singulares e representativas.
theological_decisions:
- issue: Moldura jurídica da aliança
  choice: tomo os céus e a terra como testemunhas contra vocês
  alternative: dou testemunho hoje contra vocês, pelos céus e pela terra
  rationale: A construção hebraica apresenta os céus e a terra como testemunhas invocadas em um contexto de aliança; a tradução conserva esse caráter forense sem ampliar a afirmação.
- issue: Número gramatical do destinatário
  choice: vocês; escolham; vivam
  alternative: você; escolha; viva
  rationale: O hebraico usa o masculino singular para se dirigir representativamente a Israel. Em português moderno, o plural deixa claro o referente coletivo e evita que a fala pareça dirigida apenas a um indivíduo; a nota registra a forma original.
- issue: Relação entre escolha e vida
  choice: para que vocês e seus descendentes vivam
  alternative: e assim vocês e seus descendentes viverão
  rationale: A formulação preserva a abertura de לְמַעַן entre propósito e resultado, sem transformar a exortação em uma garantia desvinculada do contexto da aliança.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com escolhas naturais para leitores brasileiros. Emprega 'vocês' para tornar explícito o destinatário coletivo, preservando em nota o singular representativo hebraico. A pontuação mantém o fluxo solene da convocação, da apresentação das alternativas e da exortação.
