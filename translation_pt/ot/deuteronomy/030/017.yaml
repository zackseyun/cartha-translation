base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: pt
  text: Mas, se o seu coração se desviar, e você não der ouvidos[a], e for arrastado para longe[b], e se prostrar diante de outros deuses e os servir,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “não ouvir” ou “não obedecer”. No contexto da aliança, o verbo hebraico inclui frequentemente a ideia de atender ao que foi ordenado.
    reason: lexical_alternative
  - marker: b
    text: Ou “for afastado” ou “for atraído para longe”. O verbo hebraico pode expressar ser tirado do rumo ou impelido para longe da lealdade correta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz a condição contrária à exortação positiva anterior. “Mas” comunica naturalmente essa oposição contextual, embora a conjunção hebraica também possa ser traduzida por “e”.
- source_word: יִפְנֶה לְבָבְךָ
  choice: o seu coração se desviar
  rationale: פנה significa “virar-se” ou “voltar-se”; com “coração”, descreve o afastamento interior da lealdade devida. “Desviar-se” expressa isso de modo natural sem especificar além do texto.
- source_word: וְלֹא תִשְׁמָע
  choice: e você não der ouvidos
  rationale: שׁמע abrange ouvir, escutar e obedecer. “Dar ouvidos” preserva a imagem auditiva e, no contexto da aliança, sugere acolher e cumprir o que foi ordenado.
- source_word: וְנִדַּחְתָּ
  choice: e for arrastado para longe
  rationale: O nifal de נדח pode indicar ser impelido, afastado ou atraído para fora do rumo e da lealdade corretos. A formulação preserva a voz passiva e a imagem de deslocamento sem definir o agente.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: e se prostrar diante de
  rationale: O verbo denota literalmente inclinar-se ou prostrar-se. No contexto, o gesto constitui adoração, mas a tradução conserva sua expressão corporal concreta.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É a expressão deuteronômica habitual para divindades rivais; esta é sua tradução direta e convencional.
- source_word: וַעֲבַדְתָּם
  choice: e os servir
  rationale: עבד designa serviço e, aqui, serviço cultual prestado a divindades. “Servir” mantém o valor lexical e deixa o contexto comunicar seu caráter religioso.
theological_decisions:
- issue: Progressão da apostasia
  choice: 'Manter a sequência: desvio do coração, recusa em dar ouvidos, afastamento, prostração diante de outros deuses e serviço a eles.'
  alternative: Traduzir שׁמע diretamente por “obedecer” ou tornar וְנִדַּחְתָּ mais reflexivo, como “deixar-se desviar”.
  rationale: O hebraico apresenta uma progressão de infidelidade à aliança, mas não exige que a tradução determine de modo mais específico a agência do afastamento nem reduza o campo semântico de שׁמע apenas à obediência.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O singular “você” reflete o destinatário masculino singular do hebraico. A repetição de “e” conserva o encadeamento enfático das orações, enquanto “dar ouvidos” e “prostrar-se diante de” permanecem naturais no uso contemporâneo.
