    text: 'Ou: “fará você prosperar” ou “lhe dará fartura”. O verbo hebraico indica causar abundância ou excedente.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus pais”; isto é, os antepassados de Israel.'
    reason: lexical_alternative
  revision_rationale: 'A revisão restaura a estrutura do hebraico na segunda metade do versículo: Yahweh se alegra a respeito do destinatário, «para o bem», tal como se alegrou a respeito de seus pais. Também preserva a referência masculina de אֲבֹתֶיךָ e torna mais específico o sentido agrícola de בְּהֵמָה. A formulação inicial foi ajustada para expressar diretamente o sentido causativo de abundância de וְהוֹתִירְךָ.'
