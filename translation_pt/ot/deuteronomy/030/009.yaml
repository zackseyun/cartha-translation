  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: pt
  text: E Yahweh, seu Deus, lhe dará abundância em todo o trabalho de suas mãos[a], no fruto de seu ventre, no fruto de seu gado e no fruto de seu solo, para o bem. Pois Yahweh voltará a alegrar-se a seu respeito, para o bem, assim como se alegrou a respeito de seus pais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fará você prosperar” ou “lhe dará fartura”. O verbo hebraico indica causar abundância ou excedente.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus pais”; isto é, os antepassados de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: fará você prosperar
  rationale: O hifil de יתר expressa causar abundância ou excedente. Em português, “fará você prosperar” comunica naturalmente essa ação causativa e introduz bem a lista concreta de bênçãos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: em todo o trabalho das suas mãos
  rationale: Conserva a imagem hebraica da mão como instrumento do trabalho, usando o plural idiomático mais natural em português.
- source_word: בִּפְרִי בִטְנְךָ
  choice: no fruto do seu ventre
  rationale: Preserva a metáfora hebraica tradicional para os filhos ou descendentes e sua ressonância nas fórmulas de bênção da aliança.
- source_word: בְהֶמְתְּךָ
  choice: seus animais
  rationale: No contexto agrícola, designa coletivamente os animais domésticos. “Animais” é corrente e suficientemente amplo; a ligação com produção rural é clara pelo contexto.
- source_word: אַדְמָתְךָ
  choice: seu solo
  rationale: Refere-se concretamente ao chão cultivável que produz colheitas; “solo” evita a possível leitura territorial mais ampla de “terra”.
- source_word: לְטוֹבָה / לְטוֹב
  choice: para o seu bem / em fazer o bem
  rationale: A primeira ocorrência indica resultado benéfico. Na segunda, junto de “alegrar-se sobre”, a formulação “alegrar-se em fazer o bem” explicita em português a relação sintática sem transformar o bem em mera prosperidade material.
- source_word: יָשׁוּב ... לָשׂוּשׂ
  choice: voltará a se alegrar
  rationale: 'A construção com שוב e infinitivo indica retomada da ação: Yahweh se alegrará novamente.'
- source_word: אֲבֹתֶיךָ
  choice: seus antepassados
  rationale: Embora o substantivo seja masculino, aqui ele pode designar os pais ancestrais ou as gerações anteriores de Israel. “Antepassados” é natural, referencialmente preciso e não elimina o caráter histórico da expressão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor / Jeová
  rationale: O texto hebraico apresenta o nome pessoal da aliança. “Yahweh” preserva-o como nome próprio, sem substituí-lo pelo título “Senhor”.
- issue: Sentido de לָשׂוּשׂ עָלֶיךָ לְטוֹב
  choice: se alegrar em fazer o bem a você
  alternative: alegrar-se por você para o bem
  rationale: A formulação escolhida torna inteligível em português que a alegria de Yahweh está ligada ao benefício concedido ao povo, sem apagar a expressão relacional “sobre você” nem restringir o bem a riqueza.
- issue: Referência de אֲבֹתֶיךָ
  choice: seus antepassados
  alternative: seus pais / seus patriarcas
  rationale: O termo é masculino no hebraico e pode evocar tanto os patriarcas quanto gerações israelitas anteriores. “Antepassados” mantém essa amplitude; a nota registra a forma literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o nome Yahweh e as imagens agrícolas do hebraico. O singular coletivo “você” representa o destinatário israelita singular do discurso; formas possessivas com “seu/suas” evitam regionalismos.
