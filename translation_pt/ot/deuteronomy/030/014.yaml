  yaml_path: translation/ot/deuteronomy/030/014.yaml
  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: pt
  text: Pois a palavra[a] está muito perto de você, na sua boca e no seu coração, para que você a ponha em prática.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a questão” ou “o mandamento”. O termo hebraico דָּבָר pode significar “palavra”, “questão” ou “mandamento”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a afirmação anterior e preserva naturalmente a conexão lógica em português.
- source_word: קָרוֹב אֵלֶיךָ
  choice: está muito perto de você
  rationale: Expressa diretamente a proximidade indicada pelo hebraico e soa natural em português.
- source_word: הַדָּבָר
  choice: esta palavra
  rationale: “Palavra” preserva a forma lexical ampla de דָּבָר; o demonstrativo torna natural a referência ao que Moisés acaba de expor, sem restringi-la explicitamente a “mandamento”.
- source_word: מְאֹד
  choice: muito
  rationale: Mantém de modo claro e corrente a intensificação da proximidade.
- source_word: בְּפִיךָ
  choice: na sua boca
  rationale: Preserva a imagem concreta do hebraico e o paralelismo com o coração.
- source_word: וּבִלְבָבְךָ
  choice: e no seu coração
  rationale: “Coração” conserva a imagem hebraica do ser interior, incluindo pensamento e vontade, sem reduzir o sentido a apenas “mente”.
- source_word: לַעֲשֹׂתוֹ
  choice: para que você a cumpra
  rationale: Torna explícita a finalidade prática da proximidade da palavra. “Cumprir” comunica aqui pôr em prática ou obedecer, de modo mais natural do que o literal “fazê-la”.
theological_decisions:
- issue: Referente de הַדָּבָר
  choice: esta palavra
  alternative: este mandamento; esta questão
  rationale: O contexto trata do mandamento de Deus, mas דָּבָר é semanticamente mais amplo. A tradução principal preserva essa amplitude, e a nota registra as alternativas legítimas.
- issue: Sentido de לַעֲשֹׂתוֹ
  choice: para que você a cumpra
  alternative: para fazê-la; a fim de praticá-la
  rationale: O infinitivo pode indicar finalidade ou resultado. A formulação escolhida preserva a relação entre ter a palavra na boca e no coração e obedecer-lhe, sem decidir rigidamente entre finalidade e resultado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. Mantêm-se as imagens concretas de “boca” e “coração”; evita-se linguagem arcaica e preserva-se a amplitude lexical do hebraico.
