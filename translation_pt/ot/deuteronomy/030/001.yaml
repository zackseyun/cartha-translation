  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: pt
  text: E acontecerá que, quando todas estas coisas vierem sobre você — a bênção e a maldição que coloquei diante de você — e você as trouxer de volta ao seu coração[a], no meio de todas as nações para onde Yahweh, seu Deus, o tiver expulsado,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você as levar a sério”; literalmente, “você as fizer voltar ao seu coração”.'
    reason: A expressão hebraica pode indicar recordar, refletir sobre algo e levá-lo profundamente em consideração.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E acontecerá que, quando
  rationale: Preserva a fórmula que introduz uma circunstância futura e mantém a oração aberta para sua continuação no versículo seguinte.
- source_word: יָבֹאוּ עָלֶיךָ
  choice: vierem sobre você
  rationale: Reproduz de modo natural a imagem hebraica de acontecimentos que sobrevêm ao destinatário.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas coisas
  rationale: דברים refere-se aqui ao conjunto dos resultados da aliança, não apenas a palavras pronunciadas.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: a bênção e a maldição
  rationale: Mantém o par técnico e contrastante das consequências da aliança.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: que coloquei diante de você
  rationale: 'Expressa o sentido idiomático de נתן com לפני: pôr ou apresentar algo diante de alguém.'
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: e você as trouxer de volta ao coração
  rationale: Mantém a imagem concreta do hebraico e sua amplitude entre recordar, refletir e levar seriamente em consideração.
- source_word: בְּכָל הַגּוֹיִם
  choice: no meio de todas as nações
  rationale: Comunica a presença dispersa de Israel entre povos estrangeiros.
- source_word: הִדִּיחֲךָ
  choice: o tiver expulsado
  rationale: O verbo descreve ser impelido para longe ou banido; 'expulsado' preserva a força do exílio.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Translitera o nome divino explícito e preserva a fórmula relacional da aliança.
- source_word: שָׁמָּה
  choice: para onde
  rationale: Integrado à oração relativa, expressa naturalmente o destino para o qual o povo foi expulso.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio da aliança; 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Sentido de וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: trouxer de volta ao coração
  alternative: levar a sério / recordar
  rationale: A formulação conserva a metáfora hebraica e não restringe sua tensão semântica à memória intelectual ou à resposta afetiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular 'você/seu/o' representa o destinatário coletivo de Israel. A frase termina com vírgula porque a construção sintática continua no versículo 2.
