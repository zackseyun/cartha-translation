base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: pt
  text: 'isto que hoje lhe ordeno: amar Yahweh, seu Deus, andar nos caminhos dele e guardar os seus mandamentos, estatutos e juízos[a], para que você viva e se multiplique[b], e para que Yahweh, seu Deus, o abençoe na terra em que você está entrando para tomar posse dela[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ordenanças”, em vez de “juízos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e você viverá e se multiplicará, e Yahweh, seu Deus, o abençoará”. A sequência verbal hebraica pode ser entendida como resultado ou como promessa.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “para herdá-la”. O hebraico inclui o advérbio direcional “para lá” e diz literalmente: “a terra para a qual você está entrando, para tomar posse dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: isto que hoje lhe ordeno
  rationale: Mantém o vínculo relativo com a oração anterior, embora o versículo isolado comece no meio da frase. O presente português expressa com naturalidade a ordem dada naquele dia.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: amar Yahweh, seu Deus
  rationale: Conserva o infinitivo e apresenta יהוה como nome pessoal, sem substituí-lo por um título.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: andar nos caminhos dele
  rationale: Preserva a metáfora hebraica de conduzir a vida segundo os caminhos de Deus, com formulação clara em português.
- source_word: לִשְׁמֹר
  choice: guardar
  rationale: Em contexto pactual e jurídico, 'guardar' comunica observar fielmente, sem reduzir o sentido à mera lembrança.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: os seus mandamentos, estatutos e juízos
  rationale: Mantém a tríade jurídica e as distinções lexicais do hebraico; 'juízos' conserva a nuance judicial de מִשְׁפָּטִים.
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: para que você viva e se multiplique
  rationale: Lê a sequência como consequência ou resultado ligado aos infinitivos anteriores, sem excluir a força promissória das formas verbais.
- source_word: בָּאָרֶץ אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: na terra em que você está entrando para tomar posse dela
  rationale: Expressa de modo natural o movimento para a terra e preserva o sufixo feminino referente a ela. O advérbio direcional שָׁמָּה fica incorporado à construção locativa 'em que ... entrando'.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome pessoal. A transliteração preserva essa função e evita substituí-lo silenciosamente por um título.
- issue: Relação entre obediência, vida, multiplicação e bênção
  choice: para que você viva e se multiplique, e para que ... o abençoe
  alternative: e você viverá e se multiplicará, e ... o abençoará
  rationale: A construção pode ser entendida como resultado da obediência ou como promessa. O texto principal explicita a relação de resultado, e a nota conserva a leitura promissória possível.
- issue: Sentido de ירשׁ no contexto da terra
  choice: tomar posse
  alternative: herdar
  rationale: O verbo pode enfatizar a entrada em posse da terra e, no contexto da promessa, também admitir a linguagem de herança; nenhuma implicação denominacional é acrescentada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'você' para o singular hebraico e formas como 'dele' para evitar ambiguidades de referência. O início fragmentário é mantido porque o versículo continua a sintaxe do versículo anterior.
