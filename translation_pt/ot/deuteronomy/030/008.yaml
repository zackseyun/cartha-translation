  text: וְ/אַתָּ֣ה תָשׁ֔וּב וְ/שָׁמַעְתָּ֖ בְּ/ק֣וֹל יְהוָ֑ה וְ/עָשִׂ֨יתָ֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: pt
  text: E você voltará[a], dará ouvidos à voz de Yahweh[b] e cumprirá todos os mandamentos dele que hoje lhe ordeno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retornará” ou “voltará para trás”; neste contexto, o verbo também pode incluir a ideia de voltar à fidelidade da aliança e arrepender-se.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “ouvirá a voz de Yahweh”; a expressão frequentemente implica atender e obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה תָשׁוּב
  choice: E você voltará
  rationale: Mantém o pronome explícito e enfático, bem como o sentido amplo de שׁוּב, sem restringi-lo a arrependimento explícito.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: dará ouvidos à voz de Yahweh
  rationale: A expressão portuguesa preserva a imagem hebraica de ouvir a voz e, ao mesmo tempo, comunica naturalmente a ideia contextual de atender e obedecer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וְעָשִׂיתָ אֶת כָּל מִצְוֺתָיו
  choice: e cumprirá todos os mandamentos dele
  rationale: Com mandamentos como objeto, 'cumprirá' expressa em português corrente o ato de pô-los em prática. 'Dele' conserva o sufixo masculino singular que remete a Yahweh.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhe ordeno
  rationale: Conserva a primeira pessoa enfática do discurso, o destinatário singular e o marcador de atualidade 'hoje', com sintaxe natural em português.
theological_decisions:
- issue: Se שׁוּב deve ser explicitamente traduzido como arrependimento
  choice: voltará
  alternative: se arrependerá; retornará
  rationale: '''Voltará'' mantém aberta a sobreposição entre retorno, restauração e volta à fidelidade da aliança, sem reduzir o termo a apenas uma dessas dimensões.'
- issue: Se שׁמע בְּקוֹל deve ser reduzido diretamente a 'obedecer'
  choice: dará ouvidos à voz de Yahweh
  alternative: obedecerá a Yahweh; ouvirá a voz de Yahweh
  rationale: A formulação mantém a imagem verbal do hebraico e também sugere a obediência própria do idioma da aliança, cuja concretização aparece na cláusula seguinte.
- issue: Relação entre os mandamentos de Yahweh e a primeira pessoa de quem ordena
  choice: todos os mandamentos dele que hoje lhe ordeno
  alternative: todos os seus mandamentos que hoje lhe ordeno
  rationale: Preserva tanto o sufixo de terceira pessoa referente a Yahweh quanto a primeira pessoa do mediador que os comunica, sem apagar a mudança de pessoa presente no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Usa 'você' para o destinatário singular e 'lhe' como objeto indireto. 'Dará ouvidos' evita a impressão de mera percepção auditiva sem eliminar a imagem hebraica; 'cumprirá' soa mais natural do que o literal 'fará' com 'mandamentos'.
