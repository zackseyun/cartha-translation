source:
  edition: WLC
  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: pt
  text: Yahweh, seu Deus, circuncidará o seu coração[a] e o coração dos seus descendentes[b], para que você ame Yahweh, seu Deus, de todo o seu coração e de toda a sua alma[c], para que você viva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Circuncidar o coração” é uma metáfora para a transformação interior e a dedicação à aliança.
    reason: cultural_note
  - marker: b
    text: Ou “da sua descendência”. O termo hebraico também pode ser traduzido literalmente como “semente”.
    reason: lexical_alternative
  - marker: c
    text: Ou “de toda a sua vida” ou “com todo o seu ser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: circuncidará
  rationale: Preserva o sentido literal do verbo e a imagem da circuncisão aplicada metaforicamente ao coração, central à linguagem da aliança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de modo natural a construção com sufixo de segunda pessoa masculina singular.
- source_word: לְבָבְךָ
  choice: seu coração
  rationale: Neste contexto, o termo designa o interior da pessoa, incluindo vontade e afeições; “coração” mantém essa amplitude e a imagem do texto.
- source_word: לְבַב זַרְעֶךָ
  choice: o coração dos seus descendentes
  rationale: זֶרַע é um coletivo que pode significar semente, descendência ou descendentes. A forma plural é clara e natural em português.
- source_word: לְאַהֲבָה
  choice: para que você ame
  rationale: Expressa a força de propósito ou resultado do infinitivo com לְ e torna explícito o sujeito em português corrente.
- source_word: בְּכָל לְבָבְךָ
  choice: de todo o seu coração
  rationale: Formulação portuguesa natural que comunica devoção integral e corresponde à expressão hebraica.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: e de toda a sua alma
  rationale: Mantém a conhecida fórmula de amor e lealdade totais, sem excluir os sentidos possíveis de vida ou ser inteiro, registrados em nota.
- source_word: לְמַעַן חַיֶּיךָ
  choice: para que você viva
  rationale: Comunica de maneira idiomática a finalidade ou o resultado indicado por לְמַעַן, preservando a relação entre renovação, amor e vida.
theological_decisions:
- issue: Linguagem metafórica da circuncisão do coração
  choice: Mantida a expressão “circuncidará o seu coração” no texto principal.
  alternative: transformará o seu coração; purificará o seu coração
  rationale: A metáfora associa o sinal da aliança à transformação interior realizada por Deus. Preservá-la mantém a tensão e as conexões do texto sem impor uma formulação doutrinária posterior.
- issue: Sentido de נֶפֶשׁ na fórmula do mandamento de amar
  choice: Traduzido como “alma” no texto principal.
  alternative: vida; ser inteiro
  rationale: O termo pode abranger a pessoa viva em sua totalidade. “Alma” conserva a formulação bíblica reconhecível, enquanto a nota evita restringir o termo a uma antropologia específica.
translation_notes:
  register: Português moderno, claro e digno, com uso de “você” para tornar explícito o singular do hebraico. A metáfora da circuncisão e o nome Yahweh foram preservados; as alternativas semânticas relevantes aparecem em notas.
