  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: pt
  text: 'Veja[a]: hoje coloquei diante de você a vida e o bem, a morte e o mal[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Olhe”. O verbo também funciona como um chamado à atenção.'
    reason: lexical_alternative
  - marker: b
    text: Em certos contextos, o termo hebraico traduzido por “mal” também pode significar “dano”, “desgraça” ou “calamidade”; aqui ele aparece em contraste direto com “o bem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Veja
  rationale: O imperativo singular funciona como chamado direto à atenção. “Veja” é atual e preserva a imagem verbal do hebraico sem o tom arcaico de “eis”.
- source_word: נָתַתִּי
  choice: ponho
  rationale: Embora a forma hebraica seja perfeita, no discurso performativo a ação se realiza no presente (“hoje”); em português, “ponho diante de você” expressa naturalmente a apresentação das alternativas. O verbo נָתַן também pode significar “dar” ou “colocar”.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: Equivalente idiomático que comunica opções apresentadas à consideração e decisão do interlocutor singular.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Tradução direta e natural do advérbio temporal.
- source_word: הַחַיִּים
  choice: a vida
  rationale: Apesar da forma morfologicamente plural, חַיִּים funciona aqui como substantivo abstrato e corresponde naturalmente ao singular “vida” em português.
- source_word: הַטּוֹב
  choice: o bem
  rationale: Mantém a amplitude lexical e o paralelismo antitético do hebraico, sem restringir o sentido a prosperidade ou bem-estar.
- source_word: הַמָּוֶת
  choice: a morte
  rationale: Tradução direta, em oposição explícita à vida.
- source_word: הָרָע
  choice: o mal
  rationale: Preserva a oposição abrangente entre bem e mal. O termo hebraico também pode designar dano, desgraça ou calamidade conforme o contexto.
theological_decisions:
- issue: Sentido de הָרָע na antítese da aliança
  choice: o mal
  alternative: a desgraça; a calamidade; o dano
  rationale: “O mal” conserva a força moral e existencial da contraposição com “o bem”, sem reduzir o termo apenas às consequências adversas; a nota reconhece sua amplitude sem resolver indevidamente a tensão.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. O singular “você” reflete o destinatário gramatical singular do hebraico. A ordem foi ajustada para a fluência natural do português, mantendo as duas duplas antitéticas: vida/bem e morte/mal.'
