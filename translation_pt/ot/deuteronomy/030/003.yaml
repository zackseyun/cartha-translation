  text: וְ/שָׁ֨ב יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת שְׁבוּתְ/ךָ֖ וְ/רִחֲמֶ֑/ךָ וְ/שָׁ֗ב וְ/קִבֶּצְ/ךָ֙ מִ/כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֧ר הֱפִֽיצְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: pt
  text: então Javé, seu Deus, restaurará a sua sorte[a] e terá compaixão de você; ele tornará a reunir você[b] dentre todos os povos[c] entre os quais Javé, seu Deus, o espalhou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “fará voltar o seu cativeiro”; a expressão hebraica significa restaurar alguém de uma situação de aflição ou exílio.
    reason: lexical_alternative
  - marker: b
    text: Ou “ele voltará e reunirá você”.
    reason: alternative_reading
  - marker: c
    text: Ou “dentre todas as nações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Preserva o nome divino da aliança em uma forma consagrada e facilmente reconhecível em português.
- source_word: שָׁב אֶת שְׁבוּתְךָ
  choice: restaurará a sua sorte
  rationale: Traduz o valor idiomático da expressão hebraica como reversão da aflição e restauração da condição, sem confundi-la com o ato de reunir os dispersos, mencionado em seguida.
- source_word: וְרִחֲמֶךָ
  choice: e terá compaixão de você
  rationale: Expressa de modo natural a misericórdia compassiva indicada pelo verbo רחם.
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: ele tornará a reunir você
  rationale: Entende o segundo שָׁב com valor reiterativo, 'novamente', junto de קבץ, preservando em nota a possibilidade de lê-lo como verbo independente.
- source_word: מִכָּל הָעַמִּים
  choice: dentre todos os povos
  rationale: Mantém o sentido plural de grupos humanos de עַמִּים; 'nações' também é lexicalmente possível.
- source_word: הֱפִיצְךָ
  choice: o espalhou
  rationale: Reproduz de forma clara e vívida o sentido causativo de dispersar em contexto de exílio.
- source_word: שָׁמָּה
  choice: entre os quais
  rationale: Integra idiomaticamente o locativo 'ali/lá' à oração relativa em português, referindo-se aos povos entre os quais houve dispersão.
theological_decisions:
- issue: Valor idiomático de שׁוּב אֶת־שְׁבוּת
  choice: restaurará a sua sorte
  alternative: fará voltar o seu cativeiro; trará de volta os seus cativos
  rationale: A expressão hebraica indica provavelmente a reversão da situação adversa do destinatário. A tradução escolhida evita transformar o objeto em 'cativos', enquanto a reunião concreta dos dispersos aparece na oração seguinte.
- issue: Função do segundo וְשָׁב
  choice: ele tornará a reunir você
  alternative: ele voltará e reunirá você
  rationale: O hebraico admite que שָׁב tenha valor reiterativo, ligado ao verbo seguinte, ou que seja lido como verbo independente. A tradução principal favorece a formulação portuguesa mais natural sem eliminar a alternativa, registrada em nota.
translation_notes:
  register: 'Português moderno, digno e acessível, com tratamento por “você” e concordância na terceira pessoa. A construção “tornará a reunir” conserva a ideia de nova reunião sem soar excessivamente literal; a pontuação separa os dois movimentos da promessa: restauração compassiva e reunião dos dispersos.'
