  text: וְ/לֹֽא מֵ/עֵ֥בֶר לַ/יָּ֖ם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲבָר לָ֜/נוּ אֶל עֵ֤בֶר הַ/יָּם֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: pt
  text: 'Ele não está do outro lado do mar[a], para que vocês digam: “Quem atravessará até o outro lado do mar por nós, o buscará para nós e nos fará ouvi-lo[c], para que o cumpramos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “além do mar”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “nos fará ouvi-lo”; a forma causativa pode ter o sentido de anunciá-lo ou explicá-lo ao povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: do outro lado do mar
  rationale: A expressão indica uma localização além do mar, na margem oposta. A formulação é clara e natural em português e mantém a imagem espacial.
- source_word: הִוא
  choice: Ele está
  rationale: O pronome hebraico feminino retoma o “mandamento” do contexto. Em português, a concordância natural acompanha o substantivo masculino “mandamento”, sem alterar o referente.
- source_word: לֵאמֹר
  choice: para que vocês digam
  rationale: Introduz a objeção hipotética e preserva a relação de finalidade/resultante da construção hebraica.
- source_word: יַעֲבָר לָנוּ אֶל עֵבֶר הַיָּם
  choice: atravessará até o outro lado do mar por nós
  rationale: Mantém tanto o movimento de atravessar quanto o destino expresso, além do valor benefactivo de לָנוּ.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: irá buscá-lo para nós
  rationale: Embora o verbo signifique literalmente “tomar”, neste contexto indica obter o mandamento e colocá-lo ao alcance do povo. “Ir buscá-lo” expressa esse movimento com naturalidade.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: nos fará ouvi-lo
  rationale: Preserva o valor causativo do hifil de שׁמע, sem decidir silenciosamente entre anunciar, recitar e explicar.
- source_word: וְנַעֲשֶׂנָּה
  choice: para que o cumpramos
  rationale: “Cumprir” comunica de modo idiomático que o mandamento deve ser posto em prática e explicita a relação entre ouvi-lo e obedecer-lhe.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”. A tradução conserva a pergunta retórica, a repetição espacial do hebraico e a expressão causativa incomum “nos fará ouvi-lo”, esclarecida em nota.
