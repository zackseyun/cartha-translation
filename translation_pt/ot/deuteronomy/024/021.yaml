base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: pt
  text: Quando você colher as uvas da sua vinha, não volte para recolher o que ficou para trás[a]; isso ficará para o imigrante residente[b], para o órfão[c] e para a viúva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “não faça uma segunda colheita” ou “não respigue depois de você”. O verbo hebraico se refere a passar novamente pela vinha para recolher o que restou.'
    reason: lexical_alternative
  - marker: b
    text: “Imigrante residente” se refere a uma pessoa de origem estrangeira que vivia estabelecida entre os israelitas; também se pode traduzir por “estrangeiro residente”.
    reason: cultural_note
  - marker: c
    text: Ou “o que não tem pai”. Em muitos contextos, o termo hebraico designa especificamente uma pessoa sem pai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz a circunstância prevista pela lei; “quando” é natural em português e adequado ao caráter casuístico da instrução.
- source_word: תִבְצֹר
  choice: colher as uvas
  rationale: O verbo designa especificamente a colheita de uvas; explicitar “as uvas” comunica com naturalidade o sentido incorporado no verbo hebraico.
- source_word: כַּרְמְךָ
  choice: da sua vinha
  rationale: “Vinha” é o equivalente português corrente de כֶּרֶם e combina naturalmente com a colheita das uvas.
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: não volte para recolher o que ficou para trás
  rationale: A expressão proíbe uma segunda passagem do proprietário para apanhar o que restou. A formulação evita a possível ambiguidade de “respigar” e incorpora de modo idiomático אַחֲרֶיךָ, literalmente “depois de você/atrás de você”.
- source_word: לַגֵּר
  choice: para o imigrante residente
  rationale: גֵּר indica um não israelita estabelecido e vivendo no meio da comunidade; “imigrante residente” preserva melhor esse estatuto social do que o termo genérico “estrangeiro”.
- source_word: לַיָּתוֹם
  choice: para o órfão
  rationale: יָתוֹם pode indicar quem não tem pai e, em português atual, “órfão” é a forma mais natural no trio social recorrente da legislação.
- source_word: וְלָאַלְמָנָה
  choice: e para a viúva
  rationale: Equivalente direto e corrente de אַלְמָנָה.
- source_word: יִהְיֶה
  choice: isso ficará
  rationale: No contexto, refere-se ao que permanece na vinha e deve ser deixado para os grupos vulneráveis; “ficará” expressa essa destinação de maneira clara sem acrescentar uma ordem ausente da forma hebraica.
