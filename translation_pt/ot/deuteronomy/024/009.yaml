base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: pt
  text: Lembre-se do que Yahweh, seu Deus, fez com Miriã no caminho quando vocês saíram do Egito.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do que Yahweh, seu Deus, havia feito com Miriã”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, durante a jornada de Israel depois da saída do Egito; veja Números 12:1–15.
    reason: cross_reference
lexical_decisions:
- source_word: זָכוֹר
  choice: Lembre-se
  rationale: Imperativo qal masculino singular de זכר. A forma pronominal é natural no português moderno e preserva a força direta da ordem.
- source_word: אֵת אֲשֶׁר
  choice: do que
  rationale: Introduz o conteúdo a ser lembrado; “do que” completa naturalmente a regência de “lembrar-se”.
- source_word: עָשָׂה
  choice: fez
  rationale: Tradução direta e não interpretativa do verbo comum עשה neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Representa a construção com sufixo de segunda pessoa masculina singular e conserva a designação pactual.
- source_word: לְמִרְיָם
  choice: a Miriã
  rationale: A preposição ל marca aqui a pessoa afetada pela ação. “Fez a Miriã” preserva a amplitude da expressão sem especificar além do hebraico.
- source_word: בַּדֶּרֶךְ
  choice: no caminho
  rationale: Equivalente conciso e natural da expressão literal, que no contexto se refere à jornada de Israel.
- source_word: בְּצֵאתְכֶם
  choice: quando vocês saíam
  rationale: O infinitivo construto com sufixo plural tem valor temporal. O imperfeito “saíam” preserva o aspecto processual e torna explícita a mudança do destinatário singular para o grupo plural presente no hebraico.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Com o verbo “sair”, esta é a expressão idiomática correspondente à preposição מן.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome pessoal divino; a transliteração o preserva e evita substituí-lo por um título.
- issue: Natureza do que Yahweh fez a Miriã
  choice: fez a Miriã
  alternative: fez contra Miriã
  rationale: A expressão hebraica com עשה e ל identifica Miriã como afetada, mas não exige que a tradução introduza explicitamente a ideia de hostilidade. A formulação mais ampla preserva a tensão e remete ao episódio de Números 12.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Lembre-se” dirige a ordem a um indivíduo, enquanto “vocês saíam” conserva a mudança do hebraico para a segunda pessoa plural. A vírgula antes da oração temporal favorece a leitura em português e esclarece que a saída do Egito situa a jornada.
