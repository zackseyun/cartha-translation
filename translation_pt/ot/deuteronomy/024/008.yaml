base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: pt
  text: No caso de uma manifestação de doença de pele[a], tenham muito cuidado de observar e de fazer tudo o que os sacerdotes levitas lhes instruírem; como lhes ordenei, tenham cuidado de fazer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, «lepra». Na Torá, o termo hebraico se refere de modo mais amplo a diversas condições de pele e não especificamente à hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Tenham muito cuidado
  rationale: O imperativo nifal de שׁמר introduz uma advertência enfática. O plural explicita em português o destinatário coletivo indicado depois pelas formas plurais hebraicas.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: no caso de uma manifestação de doença de pele
  rationale: נֶגַע designa uma lesão, afecção ou manifestação, enquanto צָרַעַת abrange condições rituais mais amplas que a hanseníase moderna. A formulação é natural e evita precisão médica anacrônica.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: observem e façam
  rationale: Os dois verbos são preservados para refletir a atenção às instruções e seu cumprimento. A intensidade de מְאֹד é expressa de modo natural por «muito» na advertência inicial.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: tudo o que ... lhes instruírem
  rationale: O hifil de ירה significa ensinar, instruir ou orientar; «instruírem» convém à direção jurídica e ritual dada pelos sacerdotes.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  rationale: A expressão deuteronômica identifica sacerdotes pertencentes a Levi, e não necessariamente dois grupos separados.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: Assim como ordenei a eles
  rationale: Preserva o sujeito na primeira pessoa e o objeto masculino plural, que remete aos sacerdotes.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: tenham o cuidado de fazer
  rationale: Reproduz a repetição enfática de שׁמר + לעשות e mantém o caráter de exortação dirigida à comunidade.
theological_decisions:
- issue: Sentido de צָרַעַת
  choice: doença de pele
  alternative: lepra
  rationale: No contexto da Torá, o termo abrange diversas condições classificadas ritualmente e não corresponde de modo exclusivo à hanseníase moderna.
- issue: Identificação de הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  alternative: os sacerdotes, os levitas
  rationale: A leitura adotada entende a expressão como a designação deuteronômica dos sacerdotes pertencentes à tribo de Levi, sem introduzir distinção entre dois grupos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural coletivo foi explicitado. Evitou-se «lepra» no texto principal por sua especificidade médica moderna; a tradução tradicional foi preservada em nota.
