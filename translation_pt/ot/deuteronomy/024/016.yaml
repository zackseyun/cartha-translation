base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: pt
  text: Os pais não serão mortos por causa dos filhos, nem os filhos serão mortos por causa dos pais; cada um será morto por seu próprio pecado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: serão mortos / será morto
  rationale: O hofal de מות é causativo-passivo e, neste contexto legal, indica que alguém é levado à morte por decisão judicial, não que simplesmente morre. “Ser executado” seria mais técnico e interpretativo.
- source_word: אָבוֹת
  choice: pais
  rationale: O substantivo designa especificamente os pais do sexo masculino e mantém o paralelismo familiar do hebraico.
- source_word: בָּנִים
  choice: filhos
  rationale: O termo hebraico é masculino e pode designar filhos; “filhos” preserva sua forma e funciona naturalmente em português.
- source_word: עַל
  choice: por causa de
  rationale: Neste contexto jurídico, a preposição indica o motivo ou a responsabilidade em razão de outra pessoa. “Por causa de” expressa isso com clareza.
- source_word: אִישׁ
  choice: cada um
  rationale: O uso distributivo exige a ideia de responsabilidade individual. “Cada um” é natural em português e conserva a referência singular sem tornar o texto desnecessariamente marcado.
- source_word: בְּחֶטְאוֹ
  choice: por seu próprio pecado
  rationale: A preposição tem sentido causal no contexto judicial, e o sufixo possessivo contrasta o pecado do próprio indivíduo com o de seus familiares. “Próprio” explicita esse contraste presente na construção.
theological_decisions:
- issue: Responsabilidade individual na pena de morte
  choice: O texto proíbe que pais ou filhos sejam mortos judicialmente pelo pecado uns dos outros e determina que cada indivíduo responda com a morte por seu próprio pecado.
  alternative: Uma afirmação geral sobre todas as consequências intergeracionais do pecado.
  rationale: A forma causativo-passiva repetida de מות aponta especificamente para alguém ser morto, e o contexto é jurídico. A tradução preserva o princípio de responsabilidade individual sem ampliar o versículo para toda consequência possível do pecado.
translation_notes:
  register: Português moderno, claro e digno, com cadência jurídica. A repetição de “serão mortos” preserva a força e o paralelismo do hebraico; “cada um” oferece legibilidade ampla no português contemporâneo.
