revisions:
- from: Você lhe dará o salário no mesmo dia, antes que o sol se ponha, pois ele é pobre e depende desse salário para viver.[a] Caso contrário, ele poderá clamar contra você a Yahweh, e haverá pecado em você.
  to: Você lhe pagará o salário no mesmo dia, antes que o sol se ponha, pois ele é pobre e depende desse salário para viver.[a] Para que ele não clame contra você a Yahweh, você incorrerá em pecado.
  rationale: A revisão mantém o prazo de pagamento e a interpretação contextual segura do idioma hebraico. Substitui a formulação hipotética por uma advertência mais próxima da construção original e torna a consequência moral idiomática em português. A nota é corrigida para explicar a metáfora sem atribuir-lhe um sentido lexical inadequado.
