review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem representado: pagamento no próprio dia, antes do pôr do sol, em razão da vulnerabilidade do trabalhador, seguido da advertência de apelo a Yahweh e de pecado para o empregador. Contudo, “poderá clamar” enfraquece a advertência hebraica, e a nota propõe “anseio”, nuance que não é uma boa equivalência lexical para נפשׁ neste contexto.'
  naturalness: O texto é geralmente claro e moderno. “Caso contrário” e “poderá” tornam a consequência mais hipotética do que a construção hebraica. “E haverá pecado em você” é compreensível, mas pouco idiomático em português contemporâneo; “você incorrerá em pecado” conserva o efeito moral com maior fluência.
  terminology: “Salário”, “pobre” e “Yahweh” são adequados. A expressão idiomática sobre erguer/levar a vida deve ser explicada como dependência vital e urgente da remuneração, sem introduzir a ideia de “todo o seu anseio”, que pode sugerir desejo ou aspiração não exigidos pelo hebraico.
  issues:
  - severity: medium
    issue: A nota de rodapé oferece “põe nele todo o seu anseio”.
    rationale: A expressão hebraica וְאֵלָיו הוּא נֹשֵׂא אֶת־נַפְשׁוֹ fala literalmente de erguer/levar a sua vida para isso e, no contexto, comunica dependência urgente do pagamento. “Anseio” não é uma correspondência lexical segura e pode deslocar o sentido para desejo intenso.
  - severity: low
    issue: “Caso contrário, ele poderá clamar” enfraquece a advertência.
    rationale: A construção com לא e imperfeito apresenta a consequência a evitar (“para que ele não clame”/“do contrário, ele clamará”), não meramente uma possibilidade remota.
  - severity: low
    issue: “Haverá pecado em você” soa pouco natural em português atual.
    rationale: A expressão hebraica preserva a noção de pecado atribuível ao destinatário. “Você incorrerá em pecado” exprime isso naturalmente sem impor uma formulação teológica mais técnica.
