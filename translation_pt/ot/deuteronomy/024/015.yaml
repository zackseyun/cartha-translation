base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: pt
  text: Você lhe pagará o salário no mesmo dia, antes que o sol se ponha, pois ele é pobre e depende desse salário para viver.[a] Para que ele não clame contra você a Yahweh, você incorrerá em pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois para ele eleva a sua vida”. O hebraico usa uma expressão idiomática que retrata a vida do trabalhador voltada para essa remuneração, indicando dependência urgente dela para viver.'
    reason: Preserva a imagem hebraica sem introduzir a nuance menos segura de “anseio” e esclarece o sentido idiomático no contexto.
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: no mesmo dia
  rationale: Embora a expressão seja literalmente “no seu dia”, no contexto legal ela exige o pagamento no próprio dia em que o trabalho foi realizado. “No mesmo dia” comunica isso com naturalidade em português.
- source_word: תִתֵּן שְׂכָרוֹ
  choice: Você lhe dará o salário
  rationale: O imperfeito hebraico tem força normativa. A forma futura mantém o tom solene da instrução legal, e “salário” designa claramente a remuneração já devida.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: antes que o sol se ponha
  rationale: A expressão hebraica estabelece o pôr do sol como prazo máximo para o pagamento. A formulação portuguesa transmite o sentido sem reproduzir um pronome de referência incerta de modo artificial.
- source_word: כִּי עָנִי הוּא
  choice: pois ele é pobre
  rationale: Neste contexto, עָנִי descreve vulnerabilidade econômica; “pobre” é direto, corrente e adequado.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: e depende desse salário para viver
  rationale: O idioma hebraico expressa que a vida ou o sustento do trabalhador está voltado para o pagamento e depende urgentemente dele. A nota registra a imagem e a possível nuance de expectativa intensa.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: Caso contrário, ele poderá clamar contra você a Yahweh
  rationale: A coordenação negativa introduz o resultado que a ordem procura evitar. “Clamar contra” preserva a ideia de apelo a Deus por causa de opressão sofrida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: e haverá pecado em você
  rationale: Mantém a construção incomum do hebraico, em que o pecado vem a estar “em” ou “contra” a pessoa, sem reduzi-la apenas ao conceito técnico de culpa.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Sentido de וְהָיָה בְךָ חֵטְא
  choice: haverá pecado em você
  alternative: você será culpado
  rationale: A tradução conserva a formulação moral do hebraico e evita transformar uma expressão aberta sobre pecado em uma declaração exclusivamente jurídico-forense.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” reflete o destinatário individual masculino da legislação hebraica sem recorrer a formas arcaicas. A nota foi colocada junto à expressão que de fato explica.
