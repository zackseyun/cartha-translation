  text: כִּ֤י תַחְבֹּט֙ זֵֽיתְ/ךָ֔ לֹ֥א תְפָאֵ֖ר אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: pt
  text: Quando você sacudir sua oliveira para colher as azeitonas, não volte para recolher o que restou[a]; isso ficará para o estrangeiro residente[b], para o órfão[c] e para a viúva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico de sentido raro; também pode ser traduzido: “não repasse os ramos depois de você”, isto é, não faça uma segunda passagem para retirar as azeitonas deixadas após a primeira colheita.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa um não nativo que residia no meio de Israel; também pode ser traduzido como “forasteiro” ou “imigrante residente”.
    reason: cultural_note
  - marker: c
    text: 'Ou: “aquele que não tem pai”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto legal, introduz uma situação recorrente e é bem representado por uma oração temporal.
- source_word: תַחְבֹּט זֵיתְךָ
  choice: você sacudir sua oliveira para colher as azeitonas
  rationale: חבט descreve golpear ou sacudir os ramos para fazer cair o fruto. A formulação explicita de modo natural, para leitores modernos, a prática agrícola em vista.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: não volte para recolher o que restou
  rationale: O piel de פאר nesta lei de colheita proíbe uma segunda passagem para retirar as azeitonas remanescentes. A tradução comunica o sentido do raro idiomatismo sem introduzir a imagem não expressa de modo inequívoco no hebraico.
- source_word: לַגֵּר
  choice: para o estrangeiro residente
  rationale: גֵּר designa o não israelita que vivia de forma estável no meio da comunidade; a expressão evita tanto o arcaísmo de 'forasteiro' quanto a noção genérica de um visitante.
- source_word: לַיָּתוֹם
  choice: para o órfão
  rationale: יָתוֹם designa a pessoa privada do amparo paterno. 'Órfão' é a forma corrente e digna em português, com nota para a possível especificidade de 'sem pai'.
- source_word: וְלָאַלְמָנָה
  choice: e para a viúva
  rationale: Equivalente português direto de אַלְמָנָה neste conjunto de pessoas socialmente vulneráveis.
- source_word: יִהְיֶה
  choice: isso ficará
  rationale: O verbo simples expressa que o restante da colheita deve permanecer destinado aos grupos mencionados; 'ficará' liga naturalmente o pronome ao que restou.
theological_decisions:
- issue: Identidade e condição jurídica do גֵּר
  choice: estrangeiro residente
  alternative: forasteiro; imigrante; estrangeiro
  rationale: A escolha preserva a condição de não nativo integrado como residente na sociedade israelita, sem impor categorias migratórias modernas nem apagar sua condição estrangeira.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação torna clara a antiga técnica de colher azeitonas sem perder o tom legal. Os marcadores aparecem no texto em ordem alfabética e as notas preservam a incerteza lexical e o contexto social.
