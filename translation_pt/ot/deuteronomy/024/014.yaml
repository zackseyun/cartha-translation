  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: pt
  text: Não oprima o trabalhador contratado que é pobre e necessitado[a], seja ele um dos seus irmãos ou um dos estrangeiros residentes que vive na sua terra, dentro das suas cidades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não defraude” ou “não explore” o trabalhador contratado; o verbo hebraico inclui opressão econômica.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dentro dos seus portões”, expressão hebraica que se refere às cidades ou à jurisdição da comunidade.
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: oprima
  rationale: O verbo עָשַׁק abrange opressão, exploração e fraude, especialmente econômica. “Oprimir” conserva a amplitude e a força moral do hebraico; a nota explicita as nuances econômicas.
- source_word: שָׂכִיר
  choice: trabalhador contratado
  rationale: Designa alguém empregado em troca de salário. A expressão é atual, clara e não sugere condição servil.
- source_word: עָנִי וְאֶבְיוֹן
  choice: pobre e necessitado
  rationale: Mantém os dois termos hebraicos que, em conjunto, ressaltam a vulnerabilidade econômica do trabalhador.
- source_word: מֵאַחֶיךָ
  choice: um dos seus irmãos
  rationale: Preserva a linguagem de parentesco da aliança e a construção singular do contexto, referindo-se a um membro do povo de Israel.
- source_word: מִגֵּרְךָ
  choice: um dos estrangeiros residentes
  rationale: גֵּר indica um não israelita que reside de modo estável na comunidade. “Estrangeiro residente” comunica essa categoria social e jurídica com clareza moderna, sem recorrer a terminologia migratória técnica.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: que vive na sua terra
  rationale: A oração relativa está no singular e se liga naturalmente ao estrangeiro residente individual mencionado imediatamente antes.
- source_word: בִּשְׁעָרֶיךָ
  choice: dentro das suas cidades
  rationale: Embora literalmente signifique “dentro dos seus portões”, a expressão funciona como idioma para as cidades ou a jurisdição comunitária. O texto traduz o sentido, e a nota preserva a imagem hebraica.
theological_decisions:
- issue: Termo de parentesco אַחֶיךָ na legislação da aliança
  choice: irmãos
  alternative: compatriotas israelitas
  rationale: A tradução mantém a metáfora de parentesco masculina e pactual do hebraico, sem ocultar que ela se refere aos membros do povo de Israel.
- issue: Categoria social גֵּר
  choice: estrangeiros residentes
  alternative: peregrinos
  rationale: A escolha exprime um estrangeiro estabelecido e protegido dentro da sociedade israelita, evitando tanto a ideia de mero viajante quanto categorias jurídicas modernas inadequadas.
- issue: Imagem jurídica בִּשְׁעָרֶיךָ
  choice: dentro das suas cidades
  alternative: dentro dos seus portões
  rationale: A tradução principal comunica a função idiomática da expressão; a nota conserva sua forma literal e seu sentido de comunidade ou jurisdição local.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “você” implícito na forma verbal e possessivos “seus/sua”, evitando arcaísmos. A formulação preserva a linguagem de parentesco do texto e apresenta גֵּר como “estrangeiro residente”, categoria social mais precisa em português atual.
