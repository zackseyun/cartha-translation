- from: Quando você fizer qualquer empréstimo ao seu próximo[a], não entre na casa dele para tomar o que ele deu como garantia.
  to: Quando você emprestar qualquer coisa ao seu próximo[a], não entre na casa dele para tomar o que ele deu como garantia.
  rationale: A revisão substitui uma construção potencialmente ambígua por “emprestar”, que identifica inequivocamente o credor como sujeito da ação. Mantêm-se o alcance amplo de מְאוּמָה (“qualquer coisa”), a proibição jurídica e a explicitação acessível do bem dado em garantia.
