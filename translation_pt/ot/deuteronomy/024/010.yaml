base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: pt
  text: Quando você emprestar qualquer coisa ao seu próximo[a], não entre na casa dele para tomar o que ele deu como garantia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você emprestar qualquer coisa ao seu próximo”.'
    reason: Preserva a possibilidade de entender כִּי como “se” na formulação casuística.
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz uma situação típica de lei casuística; “quando” é natural no contexto, embora “se” também seja possível.
- source_word: תַשֶּׁה ... מַשַּׁאת מְאוּמָה
  choice: fizer qualquer empréstimo
  rationale: O hifil de נשה com o substantivo cognato מַשַּׁאת descreve a concessão de crédito ou empréstimo; מְאוּמָה amplia o alcance para qualquer espécie de empréstimo.
- source_word: בְרֵעֲךָ
  choice: ao seu próximo
  rationale: רֵעַ indica outra pessoa da comunidade; “próximo” preserva o caráter interpessoal e é corrente no registro bíblico em português.
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: não entre na casa dele
  rationale: A forma verbal com לֹא tem força proibitiva neste contexto jurídico. A formulação é direta e natural em português moderno.
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: para tomar o que ele deu como garantia
  rationale: A construção refere-se à retirada do objeto empenhado como garantia. A expressão explicita o sentido jurídico sem sugerir força indevida, como poderia ocorrer com “confiscar”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém o tom jurídico sem recorrer a vocabulário excessivamente técnico; “o que ele deu como garantia” comunica melhor ao leitor comum o sentido de עֲבֹטוֹ.
