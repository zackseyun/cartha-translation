review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem representado: a lei trata de conceder crédito ao próximo e proíbe entrar na casa dele para tomar o bem dado em garantia. Contudo, “fizer qualquer empréstimo ao seu próximo” pode soar ambíguo no uso brasileiro atual, pois “fazer um empréstimo” frequentemente significa tomar um empréstimo. “Emprestar qualquer coisa” exprime de modo mais direto a ação do hebraico e preserva o alcance de מְאוּמָה.'
  naturalness: A redação é clara e de registro apropriado, mas “emprestar qualquer coisa ao seu próximo” é mais idiomático e imediatamente compreensível do que “fizer qualquer empréstimo ao seu próximo”. “Não entre na casa dele” e “o que ele deu como garantia” são naturais em português moderno.
  terminology: “Próximo” é adequado para רֵעַ no registro bíblico. “O que ele deu como garantia” comunica com precisão o sentido de עֲבֹטוֹ sem exigir o termo técnico “penhor”. A nota mantém corretamente a alternativa condicional para כִּי.
  issues:
  - severity: medium
    issue: Possível ambiguidade em “fizer qualquer empréstimo ao seu próximo”.
    rationale: Em português brasileiro contemporâneo, “fazer um empréstimo” costuma também — e muitas vezes principalmente — designar obter dinheiro emprestado. O hebraico exige aqui a ação de emprestar/conceder crédito ao próximo; uma formulação verbal direta evita a leitura inversa.
  revised_text: Quando você emprestar qualquer coisa ao seu próximo[a], não entre na casa dele para tomar o que ele deu como garantia.
  revised_footnotes:
  - marker: a
    text: 'Ou: “Se você emprestar qualquer coisa ao seu próximo”.'
    reason: Preserva a possibilidade de entender כִּי como “se” na formulação casuística.
  revision_rationale: A revisão substitui uma construção potencialmente ambígua por “emprestar”, que identifica inequivocamente o credor como sujeito da ação. Mantêm-se o alcance amplo de מְאוּמָה (“qualquer coisa”), a proibição jurídica e a explicitação acessível do bem dado em garantia.
