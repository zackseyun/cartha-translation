source:
  edition: WLC
  text: כִּ֣י תִקְצֹר֩ קְצִֽירְ/ךָ֨ בְ/שָׂדֶ֜/ךָ וְ/שָֽׁכַחְתָּ֧ עֹ֣מֶר בַּ/שָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְ/קַחְתּ֔/וֹ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מַעֲשֵׂ֥ה יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: pt
  text: Quando você ceifar a sua colheita em seu campo e esquecer um feixe no campo, não volte para buscá-lo. Ele ficará para o estrangeiro residente[a], para o órfão[b] e para a viúva, a fim de que Yahweh, seu Deus, abençoe você em todo o trabalho das suas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “forasteiro”, “imigrante” ou “estrangeiro”. O termo hebraico designa uma pessoa não nativa que residia no meio de Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou “aquele que não tem pai”. O termo hebraico pode destacar especialmente a falta do pai e da proteção social que ele normalmente proporcionava.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz uma situação típica de lei casuística. “Quando” soa natural em português e mantém o valor circunstancial, com a condicionalidade implícita.
- source_word: תִקְצֹר קְצִירְךָ
  choice: ceifar a sua colheita
  rationale: Preserva a imagem específica do corte dos cereais e, na medida possível em português natural, a repetição da raiz hebraica entre o verbo e o substantivo.
- source_word: בְשָׂדֶךָ
  choice: em seu campo
  rationale: Representa de modo direto e natural o sentido locativo do hebraico.
- source_word: וְשָׁכַחְתָּ עֹמֶר
  choice: e esquecer um feixe
  rationale: עֹמֶר designa aqui um feixe de cereal cortado, não a unidade de medida chamada ômer.
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: não volte para buscá-lo
  rationale: Expressa claramente tanto o movimento de retorno quanto a intenção de recolher o feixe, em forma proibitiva natural no português atual.
- source_word: לַגֵּר
  choice: para o estrangeiro residente
  rationale: גֵּר refere-se a uma pessoa não nativa que vive no meio de Israel. “Estrangeiro residente” comunica melhor essa condição social e jurídica do que o genérico “estranho”.
- source_word: לַיָּתוֹם
  choice: para o órfão
  rationale: “Órfão” é a forma corrente e inclusiva em português para a pessoa privada de amparo parental; uma nota registra a alternativa mais estreitamente literal “sem pai”.
- source_word: וְלָאַלְמָנָה
  choice: e para a viúva
  rationale: Equivalência direta e natural para a terceira categoria vulnerável da tríade legal.
- source_word: יִהְיֶה
  choice: Ele ficará para
  rationale: Indica que o feixe deve ser deixado à disposição dessas pessoas, sem impor ao texto uma formulação técnica de transferência de propriedade.
- source_word: לְמַעַן
  choice: a fim de que
  rationale: Introduz de modo digno e claro a finalidade ou o resultado pretendido, sem eliminar a possível sobreposição entre essas nuances.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶיךָ
  choice: em todo o trabalho das suas mãos
  rationale: Conserva a expressão concreta do hebraico e permanece compreensível no português moderno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” representa o nome próprio em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Categoria social e jurídica גֵּר
  choice: estrangeiro residente
  alternative: forasteiro; imigrante; estrangeiro
  rationale: A expressão identifica uma pessoa de origem não israelita que reside no meio da comunidade. A escolha preserva tanto sua origem estrangeira quanto sua residência local, sem reduzi-la a um visitante passageiro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa foi expressa por “você” e formas correlatas, evitando tanto arcaísmo quanto coloquialismo excessivo. A repetição de “campo” foi mantida por corresponder à estrutura enfática do hebraico; “feixe” conserva o cenário agrícola concreto.
