  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: pt
  text: Se um homem tomar uma mulher por esposa e se casar com ela, e acontecer que ela não encontre favor aos olhos dele porque ele encontrou nela alguma indecência[a], e ele lhe redigir uma certidão de divórcio, puser a certidão na mão dela e a mandar embora de sua casa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma questão de indecência” ou “algo vergonhoso”. A expressão hebraica é deliberadamente ambígua e tem sido entendida de mais de uma maneira.
    reason: alternativa lexical
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz o caso hipotético de uma lei casuística, e não uma oração meramente causal.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: um homem tomar uma mulher por esposa
  rationale: Reproduz de modo natural em português o idioma hebraico “tomar uma mulher”, deixando explícito que se trata de casamento.
- source_word: וּבְעָלָהּ
  choice: e se casar com ela
  rationale: Expressa a entrada na relação conjugal sem recorrer a uma formulação como “possuir”, que teria conotações enganosas em português moderno.
- source_word: וְהָיָה
  choice: e acontecer que
  rationale: Mantém a função discursiva da fórmula hebraica, que faz avançar condicionalmente o caso jurídico.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: ela não encontre favor aos olhos dele
  rationale: Conserva a imagem do idioma hebraico em uma formulação clara e conhecida em português.
- source_word: כִּי מָצָא בָהּ
  choice: porque ele encontrou nela
  rationale: Apresenta a razão alegada dentro do cenário jurídico sem determinar além do texto a natureza da falta.
- source_word: עֶרְוַת דָּבָר
  choice: alguma indecência
  rationale: Mantém a expressão indefinida e sua ambiguidade genuína, evitando restringi-la a uma infração específica.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: e ele escrever para ela uma certidão de divórcio
  rationale: “Certidão de divórcio” comunica com clareza a função jurídica do documento formal de dissolução do casamento.
- source_word: וְנָתַן בְּיָדָהּ
  choice: entregá-la na mão dela
  rationale: Preserva o ato concreto e procedimental de colocar o documento em poder da mulher.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: e mandá-la embora de sua casa
  rationale: Conserva tanto a ideia de despedir quanto a referência espacial explícita à casa do homem.
theological_decisions:
- issue: Se o versículo deve soar como uma ordem que autoriza o divórcio ou como a condição inicial de uma lei casuística
  choice: Apresentar o texto como um cenário jurídico condicional, cuja prótase continua nos versículos seguintes
  alternative: Formular os atos como ordens ou como autorização direta para o homem se divorciar
  rationale: A sintaxe de Deuteronômio 24:1–4 desenvolve uma condição extensa antes de chegar à proibição jurídica. A tradução mantém a sequência condicional e termina com vírgula, sem sugerir que este versículo ordene o divórcio.
- issue: O alcance preciso de עֶרְוַת דָּבָר
  choice: Preservar a indefinição com “alguma indecência” e explicá-la em nota
  alternative: Especificar adultério, imoralidade sexual ou outra falta determinada
  rationale: A expressão hebraica é discutida e não identifica inequivocamente uma única conduta; especificá-la resolveria uma tensão que o próprio texto deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura condicional e a vírgula final indicam que a frase jurídica prossegue nos versículos seguintes. O marcador [a] foi colocado junto à expressão a que a nota se refere.
