  source_fidelity: A estrutura condicional casuística, a expressão ambígua עֶרְוַת דָּבָר e a sequência dos atos jurídicos são bem representadas. Porém, «entregá-la» retoma gramaticalmente «ela», isto é, a mulher, quando o hebraico manda entregar o documento de divórcio na mão dela.
  naturalness: O texto é geralmente claro e de registro apropriado. A revisão torna a cadeia verbal condicional mais fluente e elimina a referência pronominal ambígua.
  terminology: «Certidão de divórcio» é termo moderno e compreensível para סֵפֶר כְּרִיתֻת. «Alguma indecência», com nota, preserva adequadamente a indeterminação da expressão hebraica.
