  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: pt
  text: Fique do lado de fora, e o homem a quem você emprestou[a] lhe trará o penhor para fora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem que está endividado com você”. A expressão hebraica pode enfatizar tanto o ato do credor de emprestar como a condição do devedor de estar em dívida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: do lado de fora
  rationale: Expressa naturalmente a localização fora da casa e se encaixa no contexto legal que proíbe o credor de entrar na residência do devedor.
- source_word: תַּעֲמֹד
  choice: fique
  rationale: O verbo עמד significa literalmente permanecer de pé, mas aqui funciona como ordem para permanecer do lado de fora; «fique» é natural e preserva o sentido espacial.
- source_word: וְהָאִישׁ
  choice: e o homem
  rationale: איש designa aqui o homem que recebeu o empréstimo; a tradução mantém a referência masculina explícita do caso legal.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: a quem você fez o empréstimo
  rationale: A expressão descreve a relação entre credor e devedor. Esta formulação dá destaque ao ato de emprestar sem excluir a possível ênfase hebraica no estado de endividamento, registrada em nota.
- source_word: יוֹצִיא
  choice: levará ... para fora
  rationale: O hifil de יצא indica fazer sair. Em português, «levará ... para fora» comunica claramente que o devedor retira o objeto da casa em direção ao credor.
- source_word: אֵלֶיךָ
  choice: até você
  rationale: A preposição indica movimento em direção ao credor; «até você» combina naturalmente com «levará».
- source_word: הָעֲבוֹט
  choice: o penhor
  rationale: עבוט é o bem entregue como garantia de uma dívida. «Penhor» conserva de modo conciso o sentido jurídico e é mais apropriado ao registro bíblico que termos financeiros técnicos.
- source_word: הַחוּצָה
  choice: para fora
  rationale: A forma direcional significa movimento para o exterior; «para fora» preserva essa direção.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O imperativo «fique» soa mais natural que «permaneça de pé» neste contexto jurídico, sem perder a exigência de que o credor aguarde fora. A nota preserva a ambiguidade lexical da relação expressa por נשה.
