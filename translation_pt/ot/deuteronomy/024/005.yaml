  naturalness: O português é claro e de registro jurídico natural. “Casar-se recentemente” é uma maneira moderna e desambígua de comunicar que se trata de um casamento recente, sem sugerir uma esposa adicional, como “nova esposa” poderia sugerir em português.
  terminology: “Exército”, “obrigação”, “livre” e “alegrará” correspondem adequadamente aos termos hebraicos no contexto. “Sua esposa, com quem se casou” é natural e mantém a referência matrimonial da cláusula final, embora não replique lexicalmente o verbo “tomar”.
