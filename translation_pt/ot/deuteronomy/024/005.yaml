base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: pt
  text: Quando um homem se casar recentemente, não sairá com o exército[a], nem se imporá a ele obrigação alguma[b]. Ficará livre para dedicar-se ao seu lar durante um ano[c] e alegrará sua esposa, com quem se casou[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não sairá para a guerra”. O hebraico diz literalmente “não sairá com o exército” e pode abranger o serviço militar em sentido mais amplo, não apenas o combate direto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nem lhe será atribuída tarefa alguma” ou “nem se colocará sobre ele obrigação alguma”. A expressão hebraica pode ser mais ampla que os deveres militares.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “Ficará isento em casa durante um ano” ou “Ficará livre para sua família durante um ano”. A expressão hebraica pode destacar tanto a isenção de encargos quanto sua dedicação à vida doméstica.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “e fará feliz a esposa que tomou”. O verbo hebraico é causativo e significa fazer alegrar-se; “tomou” reproduz literalmente o idioma hebraico para casar-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz um caso previsto pela legislação. “Quando” é natural em português jurídico e não reduz a situação a uma hipótese remota.
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: um homem se casar com uma mulher
  rationale: O hebraico usa o idioma “tomar uma mulher”, isto é, casar-se. חֲדָשָׁה caracteriza a esposa como recém-tomada em casamento; em português, a construção verbal já comunica o casamento recente sem a possível ambiguidade de “nova mulher”.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: não sairá com o exército
  rationale: Preserva a imagem hebraica e permite que צָבָא abranja a mobilização ou o serviço militar, sem restringir o sentido ao combate direto.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: nem se imporá a ele obrigação alguma
  rationale: Expressa de modo idiomático a imposição de uma incumbência ou obrigação. O hebraico é amplo e não limita necessariamente essa obrigação à esfera militar.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ
  choice: Ficará livre para cuidar de sua casa
  rationale: נָקִי indica isenção ou liberdade de encargos, e לְבֵיתוֹ orienta essa liberdade para a casa ou família. “Para cuidar” torna natural em português essa finalidade doméstica sem reduzir בַּיִת ao edifício.
- source_word: שָׁנָה אֶחָת
  choice: durante um ano
  rationale: Comunica claramente a duração prescrita.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: e alegrará a mulher
  rationale: 'O piel de שׂמח tem valor causativo: fazer alguém alegrar-se ou proporcionar-lhe alegria.'
- source_word: אֲשֶׁר לָקָח
  choice: com quem se casou
  rationale: Traduz idiomaticamente a repetição de לָקַח no sentido matrimonial, evitando o português pouco natural “a mulher que tomou”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe jurídica clara. A formulação evita “nova esposa”, que em português pode sugerir esposa adicional ou substituta, mas a nota implícita na construção preserva o casamento recente. Os marcadores seguem a ordem em que aparecem no texto.
