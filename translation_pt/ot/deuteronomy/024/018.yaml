  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a slave in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: pt
  text: E lembre-se de que você foi escravo no Egito e de que Yahweh, seu Deus, o resgatou de lá. Por isso, eu ordeno que você faça isso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: E lembre-se
  rationale: O perfeito qal com a conjunção funciona como exortação no contexto. O imperativo em português comunica naturalmente essa força, enquanto “E” preserva a ligação simples com a instrução anterior.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo a ser lembrado. A repetição de “de que” antes da segunda oração coordenada torna clara e natural a construção em português.
- source_word: עֶבֶד
  choice: escravo
  rationale: Expressa diretamente a condição de sujeição de Israel no Egito; “servo” atenuaria indevidamente essa realidade.
- source_word: בְּמִצְרַיִם
  choice: no Egito
  rationale: Correspondência direta e idiomática, sem acrescentar “na terra do”, ausente do hebraico.
- source_word: וַיִּפְדְּךָ
  choice: o resgatou
  rationale: פדה denota libertar mediante resgate ou redenção. “Resgatou” é corrente em português, preserva a ideia de libertação da escravidão e evita que “redimiu” soe excessivamente técnico neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Tradução direta da construção com sufixo de segunda pessoa masculina singular.
- source_word: מִשָּׁם
  choice: de lá
  rationale: Retoma naturalmente o Egito em português contemporâneo.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Marca com clareza a conclusão ética baseada na libertação recordada; é mais corrente em português do que “portanto” neste fluxo discursivo.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: eu ordeno
  rationale: O pronome explícito preserva a ênfase em “eu”, e o presente traduz com naturalidade a força vigente do particípio. “Estou ordenando” seria possível, mas menos idiomático neste registro legal.
- source_word: לַעֲשׂוֹת
  choice: que você faça
  rationale: A oração finita após “ordeno” é a construção mais natural em português e corresponde ao infinitivo hebraico de finalidade ou conteúdo.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: isso
  rationale: Retoma de modo natural a instrução legal imediatamente anterior. “Esta coisa” seria literalista e pouco idiomático; “este mandamento” acrescentaria uma especificação interpretativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o tetragrama como nome próprio. “Yahweh” preserva o nome pessoal sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
- issue: Condição de Israel expressa por עֶבֶד
  choice: escravo
  alternative: servo
  rationale: No contexto da opressão egípcia, o termo salienta a sujeição e a falta de liberdade. “Escravo” mantém a força histórica e ética que fundamenta a ordem.
- issue: Sentido de פדה na libertação do Egito
  choice: resgatou
  alternative: redimiu; libertou
  rationale: “Resgatou” conserva o campo semântico de redenção ou resgate e permanece claro ao leitor comum. “Libertou” expressaria o resultado, mas reduziria a nuance própria do verbo; “redimiu” é legítimo, porém mais técnico no uso contemporâneo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém o tratamento singular por “você”, coerente com os sufixos de segunda pessoa singular do hebraico, e usa períodos curtos para clareza. Não são necessárias notas de rodapé neste versículo.
