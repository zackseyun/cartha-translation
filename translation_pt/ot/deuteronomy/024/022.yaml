  text: And remember that you were a slave in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: pt
  text: Lembre-se de que você foi escravo na terra do Egito; por isso, eu lhe ordeno que faça isto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta matéria” ou “esta ordem”; mais literalmente, “esta coisa”. A expressão hebraica se refere à instrução anterior de deixar parte da produção para as pessoas vulneráveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Lembre-se
  rationale: O perfeito qal com a conjunção tem força exortativa ou imperativa neste contexto legal. Em português, “Lembre-se” expressa naturalmente essa força; a ligação com a norma anterior permanece clara pelo contexto.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo daquilo que Israel deve recordar, e não uma oração causal.
- source_word: עֶבֶד
  choice: escravo
  rationale: No contexto do Egito, designa uma condição de escravidão, não serviço comum.
- source_word: הָיִיתָ
  choice: você foi
  rationale: Expressa de modo natural o estado passado indicado pela construção predicativa com היה.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Preserva a expressão concreta e a cadência do hebraico, sem reduzi-la simplesmente a “no Egito”.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Marca claramente a conclusão prática extraída da antiga escravidão de Israel, em linguagem portuguesa corrente.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: eu lhe ordeno
  rationale: O pronome independente e o particípio apresentam uma ordem direta e vigente; a estrutura com “eu” conserva uma medida adequada da ênfase do original.
- source_word: לַעֲשׂוֹת
  choice: que cumpra
  rationale: Embora o sentido básico seja “fazer”, em referência a uma instrução legal “cumprir” é mais natural em português e comunica a execução exigida sem acrescentar conteúdo doutrinário.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: esta instrução
  rationale: דבר é amplo e retoma a norma imediatamente anterior. “Esta instrução” evita o pouco natural “esta coisa” e explicita apenas o referente contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” representa o destinatário masculino singular do hebraico. A formulação conserva a relação entre a memória da escravidão e a obrigação legal, sem resolver além do texto o fundamento teológico dessa relação.
