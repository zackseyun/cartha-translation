  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: pt
  text: Ninguém tomará como garantia um par de pedras de moinho, nem mesmo a pedra de cima, pois assim estaria tomando uma vida como garantia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois assim estaria tomando como garantia o meio de sustento de uma pessoa”.'
    reason: Alternativa lexical para נֶפֶשׁ, explicitando a dimensão econômica e vital envolvida.
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: tomará como garantia / tomando ... como garantia
  rationale: No contexto jurídico, חבל significa tomar um bem como garantia de uma dívida. A repetição preserva a correspondência verbal do hebraico.
- source_word: רֵחַיִם
  choice: um par de pedras de moinho
  rationale: A forma dual designa naturalmente as duas pedras que compõem o moinho manual.
- source_word: וָרָכֶב
  choice: nem mesmo a pedra de cima
  rationale: 'רָכֶב é a pedra superior móvel. “Nem mesmo” expressa a força jurídica contextual: não se deve tomar o conjunto, nem sequer uma de suas partes indispensáveis.'
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão da proibição.
- source_word: נֶפֶשׁ
  choice: uma vida
  rationale: Aqui נֶפֶשׁ aponta para a vida concreta, sustentada pelo preparo diário de alimento, e não especificamente para uma alma imaterial. A formulação mantém a força e a tensão da metáfora hebraica.
- source_word: הוּא
  choice: assim estaria
  rationale: O pronome retoma quem toma a garantia; a formulação verbal torna essa referência natural em português sem alterar o sentido.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto jurídico-social
  choice: vida concreta
  alternative: meio de sustento; pessoa; alma
  rationale: Privar alguém das pedras de moinho compromete a preparação do alimento e, portanto, sua própria vida. A escolha é contextual e lexical, sem formular uma doutrina antropológica.
translation_notes:
  register: Português moderno, claro e digno, com redação jurídica acessível. “Pedra de cima” é mais imediatamente compreensível que o termo técnico “mó superior”; a repetição de “como garantia” conserva a ênfase do original.
