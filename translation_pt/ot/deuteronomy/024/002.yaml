lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: e ela sair da casa dele
  rationale: A construção dá continuidade à sequência do caso legal. “Sair da casa dele” representa de modo direto o verbo יצא com a preposição מן e soa natural em português.
- source_word: וְהָלְכָה
  choice: for embora
  rationale: הלך marca a ação seguinte à saída. “For embora” evita a repetição pouco natural de “sair... e ir” e conserva a ideia de partida sem especificar o modo.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: e se tornar mulher de outro homem
  rationale: היה com ל indica aqui a entrada em uma nova relação ou condição. No contexto, “mulher de outro homem” comunica o vínculo conjugal, enquanto a nota preserva a forma mais literal e a concisão do hebraico.
