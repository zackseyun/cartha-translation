  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: pt
  text: Se um homem for encontrado sequestrando[a] um de seus irmãos, dentre os filhos de Israel[b], e o tratar como escravo[c] e o vender, esse sequestrador deverá morrer. Assim você eliminará o mal do seu meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “roubando uma pessoa”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” se refere a outros membros do povo de Israel, não apenas a irmãos biológicos.
    reason: cultural_note
  - marker: c
    text: Ou “o escravizar”. O verbo pode também enfatizar tratá-lo como propriedade.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא אִישׁ
  choice: Se um homem for encontrado
  rationale: Mantém a formulação condicional e passiva do registro jurídico hebraico, bem como o singular masculino de אִישׁ.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: sequestrando
  rationale: A expressão significa literalmente roubar uma pessoa; no contexto jurídico, “sequestrar” comunica com clareza a abdução humana.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: um de seus irmãos, dentre os filhos de Israel
  rationale: Preserva a linguagem de parentesco coletivo de אָח e a expressão israelita tradicional, sem restringir “irmãos” a irmãos biológicos.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: e o explorar como escravo
  rationale: O Hitpael de עמר descreve tratar a pessoa sequestrada como propriedade ou escravo. A formulação preserva tanto a exploração quanto a condição servil, sem ocultar a amplitude lexical do verbo.
- source_word: וּמְכָרוֹ
  choice: e o vender
  rationale: Reproduz diretamente a venda da vítima, elemento explícito da infração.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: esse sequestrador deverá morrer
  rationale: Identifica o “ladrão” como sequestrador e conserva a força normativa da pena jurídica sem tornar o modo de execução mais explícito que o hebraico.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Assim você eliminará o mal do seu meio
  rationale: Expressa de modo natural e solene a fórmula jurídica recorrente em Deuteronômio, preservando a ideia de remover o mal da comunidade.
theological_decisions:
- issue: Linguagem de parentesco da comunidade da aliança
  choice: Manter “irmãos” e esclarecer o âmbito com “dentre os filhos de Israel”.
  alternative: “compatriotas israelitas” ou “membros do seu povo”
  rationale: A opção conserva a retórica familiar do texto hebraico, enquanto a frase seguinte mostra que se trata de membros de Israel, não apenas de irmãos biológicos.
- issue: Sentido do tratamento imposto à vítima
  choice: “explorar como escravo”
  alternative: “escravizar”, “tratar como escravo” ou “tirar proveito dele”
  rationale: O verbo é lexicalmente discutido e pode enfatizar exploração, tratamento como propriedade ou escravização. A tradução combina a exploração com a condição servil e registra as alternativas em nota.
- issue: Formulação da pena capital
  choice: “deverá morrer”
  alternative: “será morto”
  rationale: O hebraico determina a morte do infrator, mas não especifica aqui o agente nem o modo. A tradução mantém essa tensão sem acrescentar detalhes.
translation_notes:
  register: Português atual, claro e solene, com legibilidade brasileira e alcance internacional. A sintaxe preserva o caráter jurídico do versículo sem recorrer a arcaísmos; “você” traduz o singular hebraico dirigido a Israel como comunidade.
