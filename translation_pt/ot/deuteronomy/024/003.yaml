  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: pt
  text: e o segundo homem odiá-la[a], escrever para ela um documento de divórcio[b], entregá-lo na mão dela e mandá-la embora de sua própria casa; ou se morrer o segundo homem, que a tomou por esposa[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vier a odiá-la”. A forma verbal hebraica pode ser entendida como parte da sequência jurídica ou como indicando que ele passa a nutrir hostilidade contra ela.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “um livro/documento de rompimento”, isto é, uma declaração escrita que formaliza a dissolução do casamento.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “que a tomou para si por esposa”, isto é, que se casou com ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: passar a odiá-la
  rationale: Preserva a força lexical de שׂנא e expressa naturalmente, no encadeamento jurídico, o surgimento da hostilidade que leva ao divórcio.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: o segundo homem
  rationale: Embora אַחֲרוֹן signifique literalmente “último/posterior”, neste caso jurídico designa o homem mencionado depois do primeiro marido; “segundo homem” é claro e natural em português.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: escrever para ela um documento de divórcio
  rationale: סֵפֶר indica um documento escrito, e כְּרִיתֻת, a dissolução formal do vínculo; a expressão comunica com clareza o procedimento jurídico.
- source_word: וְנָתַן בְּיָדָהּ
  choice: entregá-lo nas mãos dela
  rationale: Mantém a imagem concreta da entrega pessoal do documento e soa idiomático em português.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: mandá-la embora de sua casa
  rationale: Comunica tanto o afastamento da mulher quanto a origem espacial explícita em מִבֵּיתוֹ, sem recorrer a linguagem excessivamente técnica.
- source_word: אוֹ כִי יָמוּת
  choice: ou se morrer
  rationale: Introduz com naturalidade a condição alternativa no desenvolvimento casuístico da lei.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: que a tomou por esposa
  rationale: Conserva de modo natural e formal o idioma hebraico de tomar uma mulher como esposa, sem reduzi-lo simplesmente a “casou-se com ela”.
