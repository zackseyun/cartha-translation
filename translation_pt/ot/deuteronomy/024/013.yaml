  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: pt
  text: Devolva-lhe sem falta o penhor ao pôr do sol[a], para que ele possa deitar-se com sua capa e abençoar você; e isso será justiça[b] para você diante de Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a garantia” ou “aquilo que foi recebido como penhor”.
    reason: lexical_alternative
  - marker: b
    text: Ou “isso lhe será contado como justiça” ou “isso será para você um ato justo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: Devolva-lhe sem falta
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ordem; “sem falta” comunica essa ênfase de modo natural em português.
- source_word: הַעֲבוֹט
  choice: o penhor
  rationale: Designa o objeto recebido como garantia de uma dívida. “Penhor” é conciso, compreensível e adequado ao contexto jurídico.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: ao pôr do sol
  rationale: A expressão hebraica é idiomática e indica o momento em que o sol se põe.
- source_word: וְשָׁכַב
  choice: para que ele possa deitar-se
  rationale: No contexto, a oração apresenta a finalidade ou o resultado da devolução antes da noite, sem reduzir o sentido especificamente a dormir.
- source_word: בְּשַׂלְמָתוֹ
  choice: com sua capa
  rationale: שַׂלְמָה indica uma veste exterior que aqui serve também de coberta; “capa” torna clara essa função prática.
- source_word: וּבֵרֲכֶךָּ
  choice: e abençoar você
  rationale: O homem necessitado é o sujeito implícito, e o sufixo de segunda pessoa singular identifica como destinatário aquele que devolve o penhor.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: e isso será justiça para você
  rationale: A formulação mantém a expressão hebraica e sua possível amplitude entre condição reconhecida como justa e ato de justiça, sem introduzir explicitamente a ideia de imputação.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: diante de Yahweh, seu Deus
  rationale: “Diante de” preserva a relação expressa por לִפְנֵי, e o nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva sua identificação como nome, em vez de substituí-lo por um título.
- issue: Sentido de צְדָקָה neste contexto
  choice: isso será justiça para você
  alternative: isso lhe será contado como justiça; isso será para você um ato justo
  rationale: A tradução formal preserva a tensão entre reconhecimento diante de Deus e caracterização moral do ato, sem impor uma formulação teológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem enfática foi expressa por “sem falta”; “você” mantém clareza sem tornar o registro excessivamente solene. O ponto e vírgula conserva a progressão da frase hebraica.
