  text: לֹא יוּכַ֣ל בַּעְלָ֣/הּ הָ/רִאשׁ֣וֹן אֲשֶֽׁר שִׁ֠לְּחָ/הּ לָ/שׁ֨וּב לְ/קַחְתָּ֜/הּ לִ/הְי֧וֹת ל֣/וֹ לְ/אִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי תוֹעֵבָ֥ה הִ֖וא לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹ֤א תַחֲטִיא֙ אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: pt
  text: seu primeiro marido, que a mandou embora, não poderá tomá-la novamente para ser sua mulher, depois que ela foi contaminada[a], pois isso é uma abominação diante de Yahweh. Não traga pecado sobre a terra que Yahweh, seu Deus, lhe dá como herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois que ela se tornou impura” ou “depois que foi tornada impura”. O hebraico diz “depois que ela foi contaminada”, sem especificar a natureza exata dessa contaminação.
    reason: alternativa lexical e preservação de ambiguidade
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: seu primeiro marido
  rationale: No contexto matrimonial, בַּעַל significa “marido”; הָרִאשׁוֹן estabelece o contraste jurídico com o marido posterior.
- source_word: שִׁלְּחָהּ
  choice: que a mandou embora
  rationale: Preserva o sentido básico de שׁלח, “mandar embora”, enquanto o contexto legal anterior deixa claro que se trata de divórcio.
- source_word: לָשׁוּב לְקַחְתָּהּ
  choice: tomá-la novamente
  rationale: A sequência verbal expressa retomada; esta formulação natural preserva a ideia de voltar a recebê-la como esposa.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: depois que ela foi contaminada
  rationale: O passivo de טמא indica que ela foi tornada impura ou contaminada, sem esclarecer se a condição é ritual, jurídica ou relacional.
- source_word: תוֹעֵבָה
  choice: uma abominação
  rationale: Mantém a força moral e pactual do termo hebraico.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Representa a ideia de presença ou avaliação divina e conserva o nome pactual יְהוָה.
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: Não traga pecado sobre a terra
  rationale: O hifil de חטא pode indicar fazer incorrer em pecado ou culpa; a formulação evita personificação artificial e mantém a relação entre o ato e a culpa da terra.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: lhe dá como herança
  rationale: נַחֲלָה designa herança ou patrimônio recebido, preservando o conceito pactual da terra.
theological_decisions:
- issue: Sentido de הֻטַּמָּאָה na proibição de novo casamento
  choice: Manter o termo amplo “foi contaminada”, com nota explicativa.
  alternative: “tornou-se impura”, “foi tornada impura” ou explicitação como impureza sexual, ritual ou jurídica.
  rationale: O hebraico não especifica neste versículo a natureza exata da contaminação; a tradução não deve resolver silenciosamente essa tensão interpretativa.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: Translitera o nome pactual presente no texto hebraico, conforme a orientação editorial fornecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a formulação jurídica do hebraico sem explicitar além do texto a natureza da contaminação.
