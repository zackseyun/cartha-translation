  terminology: «Yahweh» corresponde à política editorial indicada e é usado de modo consistente. «Marido», «mulher», «abominação», «terra» e «herança» são escolhas estáveis, naturais e adequadas ao vocabulário bíblico-jurídico. A nota está ancorada no termo potencialmente disputado e preserva as alternativas sem impor uma leitura teológica.
