  source_fidelity: 'A tradução acompanha de perto o hebraico: identifica corretamente o «primeiro marido», preserva «mandou embora» sem antecipar a terminologia de divórcio, expressa a retomada do casamento em «tomá-la novamente para ser sua mulher» e conserva a ambiguidade de הֻטַּמָּאָה por «foi contaminada». «Abominação diante de Yahweh», bem como «não traga pecado sobre a terra» e «como herança», representam adequadamente o sentido jurídico-covenantal do versículo.'
