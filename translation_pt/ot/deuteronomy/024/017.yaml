  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: pt
  text: Não distorça a justiça devida ao estrangeiro residente[a] nem ao órfão, nem tome como garantia a roupa de uma viúva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estrangeiro”, “forasteiro” ou “migrante residente”. O termo hebraico designa um não israelita que vivia entre Israel e estava sob suas proteções sociais e jurídicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: distorça
  rationale: O hifil de נטה, em contexto jurídico e com מִשְׁפָּט, indica desviar ou corromper a justiça. “Distorcer” é atual, claro e preserva a imagem verbal hebraica.
- source_word: מִשְׁפַּט
  choice: a justiça devida a
  rationale: Aqui o termo abrange a justiça e o direito reconhecido às pessoas vulneráveis. A formulação explicita a relação jurídica sem reduzi-lo apenas a uma sentença.
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Designa um não israelita que vivia de modo estável entre Israel e estava sujeito às proteções sociais e jurídicas da comunidade; evita a ideia de mero viajante.
- source_word: יָתוֹם
  choice: órfão
  rationale: É a forma portuguesa corrente para uma criança privada da proteção parental, embora no contexto antigo o termo possa salientar especialmente a ausência do pai.
- source_word: תַחֲבֹל
  choice: tome como garantia
  rationale: No contexto legal, חבל significa tomar um bem em penhor como garantia de dívida. A expressão é natural e inteligível no português atual.
- source_word: בֶּגֶד
  choice: roupa
  rationale: O substantivo é geral e pode indicar roupa ou veste. “Roupa” é clara e não especifica indevidamente uma capa ou manto.
- source_word: אַלְמָנָה
  choice: de uma viúva
  rationale: Reproduz diretamente a pessoa socialmente vulnerável protegida pela proibição.
theological_decisions:
- issue: Identificação da categoria social גֵּר
  choice: estrangeiro residente
  alternative: estrangeiro, migrante ou forasteiro
  rationale: A expressão indica um não nativo estabelecido entre Israel, e não simplesmente qualquer estrangeiro ou viajante. A escolha preserva a dimensão comunitária e jurídica sem importar uma categoria migratória moderna específica.
translation_notes:
  register: Português moderno, digno e acessível, com imperativo negativo no singular, conforme a forma hebraica. “Estrangeiro residente” preserva a categoria jurídica de גֵּר; “tomar como garantia” comunica com clareza a prática de penhor por dívida.
