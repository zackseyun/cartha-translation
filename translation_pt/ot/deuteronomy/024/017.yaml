  naturalness: «Não distorça a justiça devida ao estrangeiro residente nem ao órfão» é claro e natural em português moderno. «Roupa» e «tomar como garantia» comunicam bem o alcance geral de בגד e o sentido jurídico de חבל.
  terminology: «Estrangeiro residente» é uma boa tradução explicativa de גר neste contexto. «Justiça devida» preserva o valor de direito ou tratamento judicial devido; «órfão», «viúva» e «garantia» são apropriados.
