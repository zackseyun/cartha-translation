  yaml_path: translation/ot/deuteronomy/024/012.yaml
  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: pt
  text: E, se ele for pobre, não durma mantendo consigo o penhor dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se deite com a garantia dele”; isto é, não passe a noite mantendo consigo o objeto que ele entregou como garantia de um empréstimo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Mantém a força conectiva de ו e introduz naturalmente a condição que dá continuidade ao versículo anterior.
- source_word: אִישׁ עָנִי הוּא
  choice: ele for pobre
  rationale: Expressa em português natural a condição econômica indicada por עָנִי e preserva o referente masculino singular, sem reproduzir de modo artificial a construção enfática hebraica.
- source_word: לֹא תִשְׁכַּב
  choice: não durma
  rationale: שׁכב significa literalmente deitar-se ou dormir; aqui, a proibição é passar a noite ainda de posse do objeto empenhado.
- source_word: בַּעֲבֹטוֹ
  choice: com o penhor dele
  rationale: עֲבוֹט designa um objeto entregue como garantia de empréstimo. “Penhor” é conciso, jurídico sem ser excessivamente técnico, e a preposição “com” preserva a forma expressiva do hebraico.
