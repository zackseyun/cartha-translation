base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: pt
  text: Eles ensinarão os teus juízos a Jacó e a tua lei[a] a Israel; colocarão incenso diante de ti[b] e uma oferta inteiramente queimada sobre o teu altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua instrução”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no teu nariz” ou “em tua narina”, uma expressão antropomórfica para o incenso apresentado diante de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: ensinarão
  rationale: O hifil de ירה significa com frequência “ensinar” ou “instruir”, especialmente em contextos sacerdotais e jurídicos. “Ensinarão” é natural e preserva a função dos levitas.
- source_word: מִשְׁפָּטֶיךָ
  choice: os teus juízos
  rationale: מִשְׁפָּט pode designar juízos, decisões ou normas jurídicas. “Juízos” conserva a dimensão judicial e a linguagem da aliança.
- source_word: לְיַעֲקֹב
  choice: a Jacó
  rationale: A preposição לְ marca aqui o destinatário do ensino; “a Jacó” mantém de modo direto o paralelismo poético.
- source_word: וְתוֹרָתְךָ
  choice: e a tua lei
  rationale: תּוֹרָה pode significar “instrução”, mas “lei” preserva neste contexto o sentido jurídico ligado à aliança e forma um paralelo adequado com “juízos”.
- source_word: לְיִשְׂרָאֵל
  choice: a Israel
  rationale: A tradução direta conserva o paralelismo entre Jacó e Israel.
- source_word: יָשִׂימוּ
  choice: colocarão
  rationale: שׂים significa pôr, colocar ou apresentar. “Colocarão” é claro e adequado ao contexto ritual.
- source_word: קְטוֹרָה
  choice: incenso
  rationale: O substantivo designa incenso; o contexto sacrificial torna desnecessário acrescentar “oferta” no texto principal.
- source_word: בְּאַפֶּךָ
  choice: diante de ti
  rationale: Literalmente, a expressão diz “junto ao teu nariz/à tua narina”. No contexto do incenso, é uma imagem antropomórfica; “diante de ti” transmite sua função sem produzir uma formulação opaca.
- source_word: וְכָלִיל
  choice: e ofertas totalmente queimadas
  rationale: כָּלִיל designa aquilo que é inteiramente consumido no altar. O plural genérico soa natural em português e expressa a categoria sacrificial sem sugerir que apenas uma oferta específica esteja em vista.
- source_word: עַל מִזְבְּחֶךָ
  choice: sobre o teu altar
  rationale: Tradução direta e natural da expressão preposicional no contexto do sacrifício.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto da aliança
  choice: lei
  alternative: instrução
  rationale: O versículo descreve a função sacerdotal de ensinar ao povo as exigências de Deus. “Lei” mantém a força jurídico-pactual, enquanto a amplitude lexical de “instrução” é registrada em nota.
- issue: Interpretação do antropomorfismo בְּאַפֶּךָ
  choice: diante de ti
  alternative: junto à tua narina
  rationale: A tradução funcional evita que a imagem hebraica seja entendida de forma indevidamente física ou como referência à ira, mas a forma literal é preservada em nota.
- issue: Número e natureza de כָּלִיל
  choice: ofertas totalmente queimadas
  alternative: uma oferta totalmente queimada
  rationale: O substantivo singular pode funcionar coletivamente no paralelismo cultual. O plural genérico comunica em português a prática sacrificial, sem alterar a natureza da oferta, inteiramente consumida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas pronominais tradicionais (“teus”, “tua”, “ti”) coerentes com o discurso dirigido a Deus. A ordem das notas foi ajustada para que cada marcador apareça imediatamente após a expressão correspondente.
