  to: 'A respeito de Benjamim, disse:


    “O amado de Yahweh habita em segurança junto dele[a];


    Ele o protege o dia todo,


    e habita entre os ombros dele[b].”'
  rationale: A única alteração é a formulação da cláusula final. Ela preserva a repetição de «habita», a imagem literal dos ombros e a ambiguidade assinalada em nota, mas evita que o possessivo «seus» seja lido automaticamente como reflexivo do sujeito da oração em português.
