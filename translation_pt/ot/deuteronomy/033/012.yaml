base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: pt
  text: 'A respeito de Benjamim, disse:


    “O amado de Yahweh habita em segurança junto dele[a];


    Ele o protege o dia todo,


    e habita entre os ombros dele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “habita seguro ao lado dele”, “sob ele” ou “sobre ele”. A preposição hebraica é concisa e pode indicar proximidade ou proteção exercida de cima.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “entre os seus ombros”. Alguns entendem a expressão como imagem de proximidade protetora; outros, como referência topográfica à região montanhosa de Benjamim ou ao santuário situado no território dessa tribo. Os pronomes hebraicos também permitem mais de uma identificação de quem habita e de quem são os ombros.
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: A respeito de Benjamim
  rationale: A preposição introduz a tribo à qual se refere a bênção. “A respeito de” soa natural em português e preserva melhor esse valor de cabeçalho do que uma tradução rígida como “para Benjamim”.
- source_word: יְדִיד יְהוָה
  choice: O amado de Yahweh
  rationale: יְדִיד designa alguém amado ou querido. A formulação mantém o calor relacional da expressão e verte o nome divino יהוה como “Yahweh”, sem substituí-lo por um título.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: habita em segurança
  rationale: שׁכן denota habitar ou residir, e לָבֶטַח expressa segurança. O presente comunica adequadamente o caráter duradouro da bênção poética.
- source_word: עָלָיו
  choice: junto dele
  rationale: A preposição עַל é compacta e admite aqui nuances de proximidade, posição e proteção. “Junto dele” comunica proximidade sem fixar em excesso a relação espacial; as possibilidades alternativas são registradas em nota.
- source_word: חֹפֵף עָלָיו
  choice: ele o protege
  rationale: O particípio חֹפֵף apresenta a imagem de cobrir ou pairar protetoramente. “Protege” torna claro o sentido contextual em português corrente, sem acrescentar uma modalidade específica de proteção.
- source_word: כָּל הַיּוֹם
  choice: o dia todo
  rationale: Expressão portuguesa natural que reproduz a duração contínua indicada pelo hebraico.
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: e entre os seus ombros ele habita
  rationale: A tradução conserva a imagem literal de “ombros” e repete o verbo “habitar”, como no hebraico. A ordem e os pronomes mantêm aberta a identificação exata do sujeito e do possuidor dos ombros.
theological_decisions:
- issue: Referência dos pronomes e sujeito dos verbos
  choice: O texto principal apresenta o amado como aquele que habita em segurança junto de Yahweh e Yahweh como aquele que o protege, mas conserva a ambiguidade da oração final.
  alternative: Yahweh habita sobre Benjamim e entre os ombros dele; ou Benjamim habita entre os ombros de Yahweh.
  rationale: A concisão poética hebraica e os sufixos pronominais permitem mais de uma relação entre Yahweh e Benjamim. A tradução não deve eliminar essa tensão, especialmente na oração final.
- issue: Sentido de “entre os seus ombros”
  choice: Manter a imagem corporal literal no texto principal.
  alternative: Entender a expressão topograficamente, como referência às encostas montanhosas de Benjamim ou ao santuário situado em seu território.
  rationale: O hebraico emprega כָּתֵף, “ombro/lado”. A imagem literal é textualmente primária, enquanto as leituras figurativa e topográfica merecem ser preservadas em nota, não impostas no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A disposição em linhas preserva o paralelismo poético. “Yahweh” translitera o nome divino, e a repetição de “habita” mantém a coesão lexical do original.
