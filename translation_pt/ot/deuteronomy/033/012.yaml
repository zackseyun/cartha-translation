    rationale: Em português, «seus» normalmente se associa ao sujeito próximo «ele», enquanto no hebraico o sufixo de «seus ombros» pode apontar para Benjamim e o sujeito final pode ser Yahweh. «E habita entre os ombros dele» é mais natural e deixa «dele» referencialmente aberto, como indicado na nota.
