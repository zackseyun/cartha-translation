  text: וְ/זֹ֣את הַ/בְּרָכָ֗ה אֲשֶׁ֨ר בֵּרַ֥ךְ מֹשֶׁ֛ה אִ֥ישׁ הָ/אֱלֹהִ֖ים אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לִ/פְנֵ֖י מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: pt
  text: 'Esta é a bênção com que Moisés, o homem de Deus, abençoou os filhos de Israel[a] antes de sua morte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Israel”, expressão coletiva habitual para o povo de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Esta é
  rationale: O waw com o demonstrativo introduz uma nova seção. Em português, “Esta é” expressa isso naturalmente sem acrescentar um advérbio temporal ausente do hebraico.
- source_word: הַבְּרָכָה
  choice: a bênção
  rationale: Mantém o artigo definido e o sentido de pronunciamento formal de bênção.
- source_word: אֲשֶׁר בֵּרַךְ
  choice: com que ... abençoou
  rationale: A construção portuguesa comunica de modo natural a relação instrumental entre a bênção e o ato de abençoar.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e corrente do nome em português.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva literalmente o título hebraico reconhecido de uma pessoa comissionada por Deus.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e o plural masculino do hebraico, que funciona coletivamente como designação do povo de Israel.
- source_word: לִפְנֵי מוֹתוֹ
  choice: antes de sua morte
  rationale: Reproduz de maneira direta e formal a expressão temporal nominal hebraica.
theological_decisions:
- issue: Sentido coletivo e forma masculina de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas / o povo de Israel / os descendentes de Israel
  rationale: A tradução retém a metáfora familiar e a forma masculina presentes no texto, sem restringir indevidamente sua referência coletiva; a nota esclarece que a expressão designa o povo de Israel.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. A formulação conserva a repetição etimológica “bênção ... abençoou”, o título “homem de Deus” e o caráter introdutório do versículo.
