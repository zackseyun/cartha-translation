source:
  edition: WLC
  text: וּ/לְ/נַפְתָּלִ֣י אָמַ֔ר נַפְתָּלִי֙ שְׂבַ֣ע רָצ֔וֹן וּ/מָלֵ֖א בִּרְכַּ֣ת יְהוָ֑ה יָ֥ם וְ/דָר֖וֹם יְרָֽשָׁ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: pt
  text: "Quanto a Naftali, ele disse:\n\n“Naftali, saciado de favor\n e cheio da bênção de Yahweh,\n tome posse do mar[a] e do sul.”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “do oeste e do sul”, pois, em hebraico, “mar” também pode ser usado como indicação do oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: Quanto a Naftali
  rationale: A preposição לְ na fórmula introdutória apresenta a tribo como tema ou destinatária da bênção. “Quanto a” reproduz isso com naturalidade em português.
- source_word: אָמַר
  choice: ele disse
  rationale: Tradução direta do verbo אמר no contexto da introdução à bênção; o pronome explicita naturalmente o sujeito retomado do contexto.
- source_word: שְׂבַע רָצוֹן
  choice: saciado de favor
  rationale: שְׂבַע descreve quem está plenamente satisfeito ou repleto, e רָצוֹן indica favor, aceitação ou benevolência. “Saciado de favor” conserva a imagem e o paralelismo poético.
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: e cheio da bênção de Yahweh
  rationale: Mantém a construção predicativa paralela e verte o nome divino יהוה por sua transliteração, Yahweh.
- source_word: יָם
  choice: o mar
  rationale: Este é o sentido lexical direto de יָם. Como o termo também pode indicar o oeste, a alternativa geográfica é preservada em nota.
- source_word: וְדָרוֹם
  choice: e do sul
  rationale: דָרוֹם designa o sul ou a região meridional. “Do sul” é claro e mantém o paralelismo com “do mar”.
- source_word: יְרָשָׁה
  choice: tome posse
  rationale: A forma expressa uma ordem ou bênção exortativa ligada à ocupação territorial. “Tome posse” comunica melhor esse valor do que o simples “possua”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Senhor ou Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome próprio. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Valor territorial de יָם
  choice: mar no texto principal
  alternative: oeste
  rationale: O sentido lexical básico é “mar”, mas o uso direcional “oeste” é genuinamente possível. A tradução mantém o sentido direto no texto e registra a ambiguidade em nota, sem resolvê-la dogmaticamente.
translation_notes:
  register: Português moderno, claro e solene, com estrutura poética. “Saciado” conserva a força imagética do hebraico sem soar excessivamente arcaico; “tome posse” torna explícito o sentido territorial de ירשׁ. O marcador [a] foi colocado imediatamente após “mar”, termo ao qual a nota se refere.
