id: DEU.33.11
reference: Deuteronomy 33:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: pt
  text: Abençoa, ó Yahweh, a sua força[a] e aceita a obra das suas mãos. Esmaga os lombos dos que se levantam contra ele e dos que o odeiam, para que não tornem a se levantar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus recursos”, “a sua riqueza” ou “o seu exército”; o termo hebraico pode indicar força, recursos materiais ou força militar.
    reason: lexical_alternative
  - marker: b
    text: “Lombos” é uma imagem hebraica de força. A expressão final indica que os inimigos seriam incapacitados de voltar a se levantar.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: Abençoa
  rationale: Imperativo dirigido a Yahweh; traduz diretamente o pedido sem explicitar a consequência possível de fazê-lo prosperar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חֵילוֹ
  choice: a sua força
  rationale: חַיִל pode indicar força, recursos, riqueza ou força militar. “Força” conserva melhor a amplitude do termo no contexto, com as demais possibilidades registradas em nota.
- source_word: וּפֹעַל יָדָיו
  choice: a obra das suas mãos
  rationale: Mantém a imagem concreta hebraica e é uma expressão natural e digna em português.
- source_word: תִּרְצֶה
  choice: aceita
  rationale: Exprime o pedido de aprovação e favor divinos para o serviço de Levi sem restringir o sentido a um ato sacrificial específico.
- source_word: מְחַץ
  choice: Esmaga
  rationale: Reproduz a força e a concisão do imperativo hebraico, que denota despedaçar ou esmagar.
- source_word: מָתְנַיִם
  choice: os lombos
  rationale: Preserva a imagem corporal hebraica associada à força, sem substituí-la silenciosamente por sua interpretação.
- source_word: קָמָיו
  choice: os que se levantam contra ele
  rationale: Conserva a imagem verbal do particípio derivado de קום, em vez de reduzi-la ao substantivo abstrato “adversários”.
- source_word: וּמְשַׂנְאָיו
  choice: os que o odeiam
  rationale: Mantém explícita a hostilidade pessoal expressa pelo particípio hebraico.
- source_word: מִן יְקוּמוּן
  choice: para que não tornem a se levantar
  rationale: 'Expressa em português natural o resultado elíptico pedido no hebraico: que os inimigos sejam incapacitados de voltar a se erguer.'
theological_decisions:
- issue: Referente dos pronomes singulares
  choice: Os pronomes referem-se a Levi, a tribo abençoada no contexto imediato.
  alternative: Podem ser entendidos de modo mais geral como referência ao ministro sacerdotal ou ao ministério representativo de Levi.
  rationale: Deuteronômio 33:8–11 trata da bênção de Levi. A tradução conserva os pronomes no singular conforme o hebraico, sem inserir uma identificação interpretativa adicional no texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem poética e as imagens concretas foram preservadas quando naturais; a ambiguidade lexical de חַיִל foi mantida por meio de nota.
