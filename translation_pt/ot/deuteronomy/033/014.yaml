  yaml_path: translation/ot/deuteronomy/033/014.yaml
  text: and with the choicest produce of the sun[a], and with the yield of the months[b],
translation:
  language: pt
  text: e com os melhores produtos do sol[a] e com a melhor produção dos meses[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas preciosas do sol”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “meses”; o termo está relacionado à lua e pode evocar a produção que brota mês após mês.'
    reason: cultural_note
lexical_decisions:
- source_word: מֶגֶד
  choice: melhores / preciosa
  rationale: No contexto da bênção, o termo indica excelência e valor. A variação de gênero e número em português permite uma formulação natural com os dois substantivos, mantendo a repetição sem rigidez artificial.
- source_word: תְּבוּאֹת
  choice: produtos
  rationale: Designa amplamente aquilo que a terra produz; “produtos” conserva o sentido agrícola e acomoda o plural hebraico.
- source_word: שָׁמֶשׁ
  choice: sol
  rationale: Preserva diretamente a associação do crescimento agrícola com o sol.
- source_word: גֶּרֶשׁ
  choice: produção
  rationale: O substantivo raro se refere ao que é feito brotar ou produzido. “Produção” comunica esse resultado agrícola sem impor a imagem etimológica incerta de algo expelido.
- source_word: יְרָחִים
  choice: meses
  rationale: O plural normalmente significa “meses”, embora esteja relacionado à lua; a escolha mantém o ciclo temporal agrícola e deixa a evocação lunar para a nota.
