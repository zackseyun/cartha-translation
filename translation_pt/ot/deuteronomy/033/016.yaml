base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: pt
  text: e com o melhor da terra e tudo o que ela contém, e o favor daquele que habitava na sarça[a]. Que tudo isso venha sobre a cabeça de José e sobre a coroa da cabeça daquele que foi separado dentre seus irmãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão alude à manifestação de Deus a Moisés na sarça ardente.
    reason: allusion_explanation
  - marker: b
    text: Ou “o príncipe entre seus irmãos” ou “o consagrado entre seus irmãos”. O termo hebraico enfatiza alguém separado e, no caso de José, também pode indicar preeminência.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ
  choice: com o melhor da terra
  rationale: מֶגֶד designa o que é precioso ou excelente, especialmente a produção valiosa no contexto da bênção. A formulação mantém a ideia de dádiva abundante e soa natural em português.
- source_word: מְלֹאָהּ
  choice: tudo o que ela contém
  rationale: A expressão comunica de modo claro o conteúdo de מְלֹאָהּ, isto é, aquilo que enche a terra, evitando a construção menos corrente 'sua plenitude'.
- source_word: רְצוֹן
  choice: o favor
  rationale: No contexto, o termo indica a disposição benevolente de Deus para com José; 'favor' é conciso e preserva o sentido teológico sem ampliá-lo.
- source_word: שֹׁכְנִי סְנֶה
  choice: daquele que habitou na sarça
  rationale: A expressão participial alude à manifestação divina a Moisés na sarça. 'Sarça' preserva a conhecida linguagem bíblica e a referência alusiva, sem inserir no texto a menção ao fogo.
- source_word: תָּבוֹאתָה
  choice: Que tudo isso venha
  rationale: O verbo feminino singular retoma coletivamente as bênçãos mencionadas. 'Tudo isso' torna claro o referente coletivo em português e mantém a força desiderativa da bênção.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: sobre a cabeça de José
  rationale: Mantém de perto a fórmula hebraica de bênção e sua imagem poética.
- source_word: קָדְקֹד
  choice: o alto da cabeça
  rationale: O substantivo indica o topo ou a parte mais alta da cabeça. A escolha é compreensível em português e preserva o paralelismo com 'cabeça'.
- source_word: נְזִיר אֶחָיו
  choice: daquele que foi separado de seus irmãos
  rationale: נְזִיר tem como núcleo a ideia de alguém separado ou consagrado. A tradução preserva essa ideia básica sem decidir se o contexto também implica principado ou preeminência.
theological_decisions:
- issue: Identidade daquele que habitou na sarça
  choice: Manter a descrição como título alusivo de Deus, remetendo à sua manifestação a Moisés na sarça
  alternative: Entender a frase de modo mais genérico como referência a uma manifestação divina ligada ao Sinai ou Horebe
  rationale: A formulação evoca fortemente Êxodo 3. A tradução descritiva conserva a alusão e evita acrescentar uma identificação doutrinária mais específica do que o hebraico expressa.
- issue: Sentido de נְזִיר aplicado a José
  choice: aquele que foi separado de seus irmãos
  alternative: o príncipe entre seus irmãos; o consagrado entre seus irmãos
  rationale: O termo pode sugerir tanto separação ou consagração quanto distinção e preeminência. O texto principal retém o núcleo lexical, e a nota registra as possibilidades contextuais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o paralelismo poético, enquanto 'tudo o que ela contém' e 'Que tudo isso venha' esclarecem relações que poderiam soar obscuras numa reprodução excessivamente literal.
