base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: pt
  text: Que Rúben viva e não morra; e que seus homens sejam poucos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que seus homens sejam contados”. A oração final em hebraico é difícil e também tem sido entendida como um pedido para que Rúben não se torne insignificante nem seja excluído da contagem das tribos.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: Que ... viva
  rationale: O jussivo qal de חיה expressa desejo ou bênção. A construção portuguesa com “que” e subjuntivo preserva naturalmente essa força volitiva.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: וְ/אַל יָמֹת
  choice: e não morra
  rationale: אַל com o jussivo exprime um desejo negativo. “Não morra” mantém o sentido direto de מות e o paralelismo conciso com “viva”.
- source_word: וִ/יהִי
  choice: e que ... sejam
  rationale: O segundo jussivo introduz outro desejo. O plural “sejam” concorda de modo natural com “seus homens” em português.
- source_word: מְתָיו
  choice: seus homens
  rationale: Neste contexto de bênção tribal, o termo difícil é mais plausivelmente entendido como os homens ou integrantes de Rúben, não como “seus mortos”.
- source_word: מִסְפָּר
  choice: poucos
  rationale: Literalmente relacionado a “número”, o termo pode formar aqui a ideia idiomática de um grupo pequeno ou numerável. “Sejam poucos” comunica a leitura mais direta, enquanto a nota preserva a ambiguidade.
theological_decisions:
- issue: Interpretação da oração final וִיהִי מְתָיו מִסְפָּר
  choice: “e que seus homens sejam poucos”, entendida como uma bênção de sobrevivência apesar do número reduzido
  alternative: “e que seus homens sejam contados”, isto é, que Rúben não seja excluído da contagem tribal
  rationale: O texto massorético é breve e difícil. A leitura “poucos” é uma compreensão direta de מִסְפָּר com היה, mas a formulação hebraica permite a leitura ligada à contagem. A nota registra essa alternativa sem corrigir o texto nem eliminar sua tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “que” reproduz a sequência de desejos da bênção, e o ponto e vírgula distingue a oração final sem romper o paralelismo.
