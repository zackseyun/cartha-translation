  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֚ף חֹבֵ֣ב עַמִּ֔ים כָּל קְדֹשָׁ֖י/ו בְּ/יָדֶ֑/ךָ וְ/הֵם֙ תֻּכּ֣וּ לְ/רַגְלֶ֔/ךָ יִשָּׂ֖א מִ/דַּבְּרֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: pt
  text: De fato, ele ama os povos; todos os seus santos estão em tua mão, e eles se assentam[a] aos teus pés; cada um recebe as tuas palavras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido do verbo hebraico é incerto. Também pode ser entendido como “eles se reúnem”, “eles se agacham” ou até “eles são abatidos”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “cada um toma das tuas palavras” ou “leva os teus pronunciamentos”. A expressão hebraica é rara e difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: De fato
  rationale: Expressa o valor enfático/asseverativo da partícula neste contexto, sem tratá-la primariamente como aditiva.
- source_word: חֹבֵב
  choice: ama
  rationale: O particípio indica uma disposição contínua; “ama” é natural e preserva o sentido relacional.
- source_word: עַמִּים
  choice: os povos
  rationale: Mantém o plural coletivo e não restringe indevidamente a referência a nações gentias.
- source_word: כָּל קְדֹשָׁיו
  choice: todos os seus santos
  rationale: “Santos” designa os que são santos ou consagrados, sem especificar se são anjos, Israel ou outro grupo; em português corrente, a expressão é mais natural que “santos seus” ou “seus seres santos”.
- source_word: בְּיָדֶךָ
  choice: em tua mão
  rationale: Preserva a imagem hebraica e a mudança poética da terceira para a segunda pessoa.
- source_word: תֻּכּוּ
  choice: eles se assentam
  rationale: O verbo é muito incerto; no contexto de estar aos pés e receber palavras, o sentido de sentar-se ou agachar-se é coerente. A incerteza é explicitada em nota.
- source_word: לְרַגְלֶךָ
  choice: aos teus pés
  rationale: É a formulação idiomática em português para postura de proximidade, submissão ou escuta.
- source_word: יִשָּׂא
  choice: recebe
  rationale: Embora o sentido básico seja levantar ou carregar, aqui o objeto ligado à fala favorece a ideia idiomática de acolher ou receber.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: as tuas palavras
  rationale: O substantivo é raro e difícil, mas se relaciona à fala. “Palavras” é claro; a nota registra a possibilidade de conservar o valor partitivo da preposição e o sentido de tomar ou levar.
theological_decisions:
- issue: Mudanças de pessoa gramatical no poema
  choice: Preservar a sequência “ele ama... seus santos... tua mão... teus pés... tuas palavras”.
  alternative: Uniformizar todos os pronomes na terceira pessoa ou todos na segunda pessoa.
  rationale: A mudança de pessoa está no hebraico e pode ser poeticamente significativa; uniformizá-la eliminaria uma tensão genuína do texto.
- issue: Identidade dos “santos”
  choice: Manter a designação ampla “santos”, sem identificar explicitamente o grupo.
  alternative: Traduzir interpretativamente como “anjos”, “o povo santo de Israel” ou expressão equivalente.
  rationale: O contexto não exige uma identificação única, por isso a tradução evita impor uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa (“tua”, “teus”) para preservar claramente a mudança pronominal do hebraico. As notas [a] e [b] registram as duas principais dificuldades textuais e lexicais.
