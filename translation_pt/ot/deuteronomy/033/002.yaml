  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: pt
  text: 'E ele disse:

    “Yahweh veio do Sinai,

    raiou de Seir sobre eles

    e resplandeceu do monte Parã.

    Veio de miríades de santidade[a];

    da sua mão direita veio para eles uma lei de fogo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de miríades de seres santos”. A expressão hebraica pode referir-se a acompanhantes santos, em vez de à santidade em sentido abstrato.
    reason: alternative_reading
  - marker: b
    text: O hebraico אשדת é difícil e seu sentido é incerto. Tradicionalmente, entende-se “uma lei de fogo”, mas a expressão também pode indicar clarões flamejantes ou fogo que procede da mão direita de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִסִּינַי בָּא
  choice: veio do Sinai
  rationale: Expressa de modo natural o advento divino e preserva a força direcional de מִן.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: raiou desde Seir sobre eles
  rationale: “Raiou” conserva a imagem poética do nascer e brilhar da luz; “sobre eles” comunica o efeito da manifestação luminosa sobre o povo.
- source_word: הוֹפִיעַ
  choice: resplandeceu
  rationale: Transmite o sentido causativo de aparecer em brilho ou irradiar esplendor, mantendo o paralelismo poético.
- source_word: מֵהַר פָּארָן
  choice: desde o monte Parã
  rationale: Preserva o topônimo e a indicação de procedência; “desde” evita uma sequência excessivamente repetitiva de “de” sem apagar a força de מִן.
- source_word: וְאָתָה
  choice: veio
  rationale: Representa diretamente a ideia de chegar ou aproximar-se e mantém a sequência de verbos da manifestação divina.
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: dentre miríades de santidade
  rationale: Mantém no texto a construção incomum e a ambiguidade entre a noção abstrata de santidade e a referência possível a seres santos; a alternativa idiomática é registrada em nota.
- source_word: מִימִינוֹ
  choice: da sua mão direita
  rationale: Conserva o sentido mais natural da preposição מִן, indicando a origem daquilo que procede da mão direita de Yahweh.
- source_word: אשדת
  choice: uma lei de fogo
  rationale: Segue a leitura tradicional, coerente com o contexto do Sinai, sem ocultar que a forma hebraica é obscura e pode descrever fogo ou clarões flamejantes.
- source_word: לָמוֹ
  choice: para eles
  rationale: Representa o pronome plural e comunica naturalmente que aquilo que procede da mão de Yahweh é dirigido ou concedido ao povo.
theological_decisions:
- issue: Identidade do sujeito divino na teofania poética
  choice: Apresentar Yahweh como o sujeito da manifestação descrita no contexto da bênção de Moisés.
  alternative: Inserir no texto uma identificação cristológica posterior ou substituir o nome por um título.
  rationale: A tradução deve preservar o referente explícito e o horizonte veterotestamentário do versículo, sem incorporar ao enunciado uma interpretação teológica posterior.
- issue: Sentido de מֵרִבְבֹת קֹדֶשׁ
  choice: Manter “miríades de santidade” no texto e indicar “miríades de santos” em nota.
  alternative: Traduzir diretamente “miríades de santos” ou “miríades santas”.
  rationale: A construção hebraica pode expressar santidade de modo abstrato ou aludir a acompanhantes celestiais santos; a formulação principal conserva essa tensão.
- issue: Sentido de אשדת
  choice: Usar “uma lei de fogo” no texto e registrar a incerteza lexical em nota.
  alternative: Traduzir “fogo flamejante”, “clarões de fogo” ou expressão semelhante.
  rationale: A leitura tradicional se ajusta ao cenário do Sinai, mas a forma hebraica é difícil; a nota impede que uma solução incerta seja apresentada como indiscutível.
translation_notes:
  register: Português atual, digno e poeticamente cadenciado, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. O paralelismo foi disposto em versos; formas como “raiou” e “resplandeceu” preservam a imagem luminosa sem soar arcaicas. As construções deliberadamente incomuns são mantidas apenas onde refletem ambiguidade real do hebraico e recebem esclarecimento em nota.
