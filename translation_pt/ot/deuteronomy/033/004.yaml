base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/004.yaml
  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: pt
  text: Moisés nos ordenou uma lei[a][b], herança da assembleia de Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Moisés ordenou para nós uma lei, a herança da assembleia de Jacó”. A sintaxe hebraica é concisa, e “herança” pode ser lida em estreita aposição a “lei”.'
    reason: alternative_reading
  - marker: b
    text: “Lei” também pode ser traduzida por “instrução”; “herança”, por “patrimônio” ou “possessão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: lei
  rationale: Neste contexto da aliança, תּוֹרָה designa a instrução normativa transmitida por Moisés. “Lei” comunica de modo natural e público esse sentido, enquanto a nota preserva a alternativa “instrução”.
- source_word: צִוָּה
  choice: ordenou
  rationale: O verbo צוה expressa uma ordem autoritativa. “Ordenou” mantém sua força, sem suavizá-la para “deu”.
- source_word: לָנוּ
  choice: nos
  rationale: A construção “nos ordenou uma lei” representa de modo idiomático o destinatário expresso por לָנוּ, embora “ordenou uma lei para nós” também seja possível.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa corrente do nome próprio.
- source_word: מוֹרָשָׁה
  choice: herança
  rationale: מוֹרָשָׁה indica uma posse recebida e duradoura, frequentemente associada ao direito hereditário. “Herança” é clara e preserva a dimensão da aliança; “patrimônio” e “possessão” permanecem alternativas possíveis.
- source_word: קְהִלַּת
  choice: assembleia de
  rationale: קְהִלָּה se refere à comunidade reunida. “Assembleia” conserva esse sentido coletivo sem importar uma instituição eclesiástica posterior.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: O texto hebraico nomeia explicitamente Jacó; por isso, não foi substituído interpretativamente por “Israel”.
theological_decisions:
- issue: Relação sintática entre תּוֹרָה e מוֹרָשָׁה
  choice: “herança da assembleia de Jacó” foi mantido como uma aposição concisa que caracteriza a lei.
  alternative: “Moisés nos ordenou uma lei, a qual é herança da assembleia de Jacó” ou “Moisés ordenou para nós uma lei, a herança da assembleia de Jacó”.
  rationale: O hebraico poético é comprimido e não contém cópula na segunda parte. A aposição preserva tanto a concisão quanto a possibilidade de entender a lei como herança da comunidade, sem explicitar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “Moisés nos ordenou uma lei” mantém a força do verbo hebraico e soa natural; a segunda metade conserva a concisão poética do original.
