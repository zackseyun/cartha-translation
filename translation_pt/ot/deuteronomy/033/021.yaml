  naturalness: “Praticou a justiça ... e os seus juízos” soa pouco natural em português, pois “praticar” se associa bem a “justiça”, mas não a “juízos”. “Cumpriu” rege naturalmente os dois complementos e conserva o sentido de execução/cumprimento.
  terminology: “Javé”, “governante”, “chefes do povo” e “juízos” são apropriados ao registro. A nota b deve oferecer alternativas que correspondam à construção “justiça de Javé”; “o que era justo perante Javé” desloca o referente e é menos fiel.
