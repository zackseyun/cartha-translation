source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: pt
  text: Escolheu para si a melhor parte[a], pois ali estava reservada a porção do governante. Veio com os chefes do povo; cumpriu a justiça de Javé[b] e os seus juízos junto com Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser entendida como “viu para si a primeira parte”. “A porção do governante” também pode ser traduzida por “a porção do legislador”, termo que alguns entendem como referência a Moisés.
    reason: alternative_reading
  - marker: b
    text: Ou “a justiça de Javé” no sentido de “os atos justos de Javé”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא רֵאשִׁית לוֹ
  choice: Escolheu para si a melhor parte
  rationale: Embora וַיַּרְא signifique literalmente “viu”, a expressão indica selecionar para si; רֵאשִׁית, no contexto da distribuição territorial a Gade, aponta para a parte principal ou mais excelente, não necessariamente para a primeira em sentido temporal.
- source_word: חֶלְקַת
  choice: a porção
  rationale: O substantivo designa uma parte ou parcela atribuída, especialmente de terra ou herança.
- source_word: מְחֹקֵק
  choice: do governante
  rationale: O termo pode designar quem decreta, legisla ou governa. “Governante” mantém a referência genérica à autoridade sem identificar a figura como Moisés.
- source_word: סָפוּן
  choice: estava reservada
  rationale: O particípio passivo comunica algo guardado, oculto ou separado para determinado fim; “reservada” se ajusta ao contexto de uma porção territorial.
- source_word: וַיֵּתֵא
  choice: Veio
  rationale: A forma verbal expressa movimento de sair ou vir; “veio” corresponde bem à construção com os chefes do povo.
- source_word: רָאשֵׁי עָם
  choice: os chefes do povo
  rationale: Conserva a imagem hebraica de “cabeças” em uma expressão portuguesa natural para líderes tribais.
- source_word: צִדְקַת יְהוָה
  choice: a justiça de Javé
  rationale: A expressão pode indicar a justiça como atributo, aquilo que é justo segundo Javé ou seus atos justos. A formulação concisa preserva essa amplitude.
- source_word: וּמִשְׁפָּטָיו
  choice: os seus juízos
  rationale: O plural com sufixo refere-se às decisões judiciais, ordenanças ou normas de Javé; “juízos” mantém a formulação jurídica e solene.
- source_word: עִם יִשְׂרָאֵל
  choice: junto com Israel
  rationale: Traduz explicitamente o valor associativo da preposição עִם e indica ação em conjunto com Israel.
theological_decisions:
- issue: Identidade e sentido de מְחֹקֵק em חֶלְקַת מְחֹקֵק סָפוּן
  choice: Tradução genérica por “governante”
  alternative: “legislador”, possivelmente entendido como referência a Moisés
  rationale: O hebraico é conciso e permite mais de uma interpretação. A tradução não identifica a personagem além do que o texto exige e conserva a alternativa em nota.
- issue: Sentido de צִדְקַת יְהוָה
  choice: “a justiça de Javé”
  alternative: “os atos justos de Javé” ou “o que era justo perante Javé”
  rationale: A construção pode referir-se tanto à justiça quanto a suas manifestações concretas. A redação principal mantém a tensão sem restringir o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Javé” representa explicitamente o nome divino יהוה. A ordem poética e as ambiguidades centrais foram preservadas sem tornar a frase artificial.
