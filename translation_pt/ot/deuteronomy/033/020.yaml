base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: pt
  text: 'A respeito de Gade, ele disse: “Bendito aquele que dá espaço a Gade.[a] Gade habita como uma leoa[b] e dilacera o braço, até mesmo o alto da cabeça.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bendito seja aquele que dá espaço a Gade”. O sujeito pode ser entendido implicitamente como Deus, embora o hebraico não o declare.'
    reason: alternative_reading
  - marker: b
    text: “Leoa” também pode ser traduzido como “leão”; o termo hebraico pode designar de modo mais geral um leão forte e adulto.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “braço, até mesmo o alto da cabeça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד
  choice: A respeito de Gade
  rationale: Introduz de modo natural em português o oráculo dirigido à tribo de Gade.
- source_word: בָּרוּךְ
  choice: Bendito
  rationale: Preserva a forma declarativa e exclamativa da bênção hebraica, sem convertê-la necessariamente em pedido.
- source_word: מַרְחִיב
  choice: aquele que dá espaço
  rationale: Expressa o sentido causativo de tornar espaçoso, ampliar ou proporcionar espaço, sem especificar um sujeito que o hebraico deixa implícito.
- source_word: כְּלָבִיא
  choice: como uma leoa
  rationale: Mantém uma possibilidade lexical direta do substantivo hebraico e a imagem de força predatória; a alternativa mais geral, 'leão', é registrada em nota.
- source_word: שָׁכֵן
  choice: habita
  rationale: Conserva a dimensão territorial do verbo, embora ele também possa descrever o animal que se acomoda ou repousa.
- source_word: וְטָרַף
  choice: e dilacera
  rationale: Comunica com clareza a ação violenta de rasgar própria de um predador.
- source_word: זְרוֹעַ
  choice: o braço
  rationale: Preserva a imagem corporal concreta, em paralelo com o alto da cabeça.
- source_word: אַף
  choice: até mesmo
  rationale: Representa a força aditiva e intensificadora da partícula.
- source_word: קָדְקֹד
  choice: o alto da cabeça
  rationale: Traduz de maneira clara e precisa a parte superior ou coroa da cabeça, sem enfraquecer a imagem.
theological_decisions:
- issue: Referente de “aquele que dá espaço a Gade”
  choice: Manter o agente sem identificação explícita.
  alternative: Explicitar Deus como aquele que amplia o território de Gade.
  rationale: O particípio hebraico permite entender Deus como sujeito implícito, mas não o nomeia; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação mantém a concisão poética, a violência da metáfora leonina e a ambiguidade quanto ao agente que concede espaço a Gade.
