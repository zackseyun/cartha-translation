base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: pt
  text: 'E disse o seguinte a respeito de Judá:


    “Yahweh, ouve a voz de Judá

    e trazê-lo ao seu povo.

    Que as suas mãos lutem por ele[a],

    e sê tu o seu auxílio contra os seus adversários.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que as suas mãos lhe sejam suficientes”. A cláusula hebraica é difícil e tem sido entendida de mais de uma maneira.'
    reason: Leitura alternativa de uma expressão hebraica sintaticamente condensada e ambígua.
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: E disse o seguinte a respeito de Judá
  rationale: 'Expressa com naturalidade a fórmula que introduz a bênção, entendendo לְ como marcador de referência: a declaração é a respeito de Judá.'
- source_word: שְׁמַע יְהוָה
  choice: Yahweh, ouve
  rationale: Mantém o imperativo de oração e translitera o nome divino יהוה como “Yahweh”; a ordem vocativo-verbo é natural em português.
- source_word: קוֹל יְהוּדָה
  choice: a voz de Judá
  rationale: Preserva a imagem concreta do hebraico sem especificar se se trata de uma oração, clamor ou chamado militar.
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: e traze-o ao seu povo
  rationale: Traduz o hifil de בוא por “trazer” e não acrescenta “de volta”, deixando em aberto a situação pressuposta.
- source_word: יָדָיו רָב לוֹ
  choice: Que as suas mãos lutem por ele
  rationale: Entende רָב no sentido de lutar ou contender, leitura coerente com o contexto de adversários; a nota preserva a outra interpretação relevante da cláusula difícil.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: e sê tu o seu auxílio contra os seus adversários
  rationale: Toma מִן em sentido adversativo/separativo e explicita naturalmente em português que Yahweh é o auxílio solicitado.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o nome da aliança; “Yahweh” o representa como nome próprio sem substituí-lo por um título.
- issue: Sentido da cláusula יָדָיו רָב לוֹ
  choice: Que as suas mãos lutem por ele
  alternative: Que as suas mãos lhe sejam suficientes
  rationale: A sintaxe e a forma רָב admitem mais de uma compreensão. A leitura escolhida se ajusta ao contexto de combate, mas a alternativa é registrada para não eliminar a ambiguidade real do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa do singular (“ouve”, “traze”, “sê”) usadas de modo consistente na oração dirigida a Yahweh. O paralelismo poético foi preservado, e o marcador [a] foi colocado junto à cláusula a que a nota se refere.
