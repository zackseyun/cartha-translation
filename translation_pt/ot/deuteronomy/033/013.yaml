base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: pt
  text: 'E, a respeito de José, ele disse: “Que a terra dele seja abençoada por Yahweh, com as preciosidades do céu, com o orvalho, e com as águas profundas que jazem embaixo”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיוֹסֵף
  choice: E, a respeito de José
  rationale: A preposição לְ na fórmula introdutória da bênção pode indicar referência ou destinatário. “A respeito de José” é natural em português e preserva a estrutura da série de bênçãos.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: Que a terra dele seja abençoada por Yahweh
  rationale: O particípio passivo tem força de fórmula de bênção; a construção com “que... seja” comunica naturalmente esse valor em português. “Terra” designa o território atribuído às tribos de José.
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: com as preciosidades do céu
  rationale: מֶגֶד denota aquilo que é precioso, excelente ou abundante. “Preciosidades” mantém a abrangência lexical sem especificar indevidamente “dádivas” ou “produtos”; מן é vertido idiomaticamente por “com” dentro da bênção.
- source_word: מִטָּל
  choice: com o orvalho
  rationale: O orvalho é uma fonte concreta da fertilidade agrícola. A repetição de “com” torna clara a coordenação com as demais bênçãos.
- source_word: וּמִתְּהוֹם רֹבֶצֶת תָּחַת
  choice: e com as águas profundas que jazem embaixo
  rationale: תְּהוֹם pode designar a massa de águas profundas, aqui situada debaixo da terra. O plural natural “águas profundas” comunica esse referente sem introduzir as conotações teológicas de “abismo”; “jazem” preserva a imagem de רֹבֶצֶת, algo deitado ou repousando abaixo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino, não um título. “Yahweh” o representa diretamente e evita substituí-lo por “SENHOR”.
- issue: Sentido de תְּהוֹם neste contexto
  choice: as águas profundas
  alternative: o abismo
  rationale: No contexto de fertilidade da terra, o termo provavelmente se refere às águas profundas ou subterrâneas. A tradução mantém a imagem cosmológica e agrícola sem importar a ideia posterior de um lugar de punição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém o tom poético da bênção, mas evita inversões excessivamente arcaicas. Não foram incluídas notas porque as principais nuances puderam ser expressas no próprio texto.
