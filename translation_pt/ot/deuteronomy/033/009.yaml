base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: pt
  text: 'aquele que disse de seu pai e de sua mãe[a]: “Não o levei em conta”, e não reconheceu seus irmãos nem conheceu seus filhos; pois eles guardaram a tua palavra e preservaram a tua aliança.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Não o vi”. Aqui, “ver” provavelmente tem o sentido de “considerar”, “levar em conta” ou “dar atenção”, no contexto em que a fidelidade à aliança tem precedência sobre os laços familiares.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: aquele que disse
  rationale: O particípio substantivado retoma Levi; a expressão mantém o valor relativo e representativo do hebraico.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: de seu pai e de sua mãe
  rationale: Com אמר, ל pode introduzir as pessoas acerca das quais se fala; “de” é natural em português neste contexto.
- source_word: לֹא רְאִיתִיו
  choice: Não o levei em conta
  rationale: Embora ראה signifique literalmente “ver”, aqui o contexto de lealdade à aliança acima dos vínculos familiares favorece o sentido idiomático de não considerar ou não levar em conta; a nota preserva a forma literal.
- source_word: הִכִּיר
  choice: reconheceu
  rationale: O hifil de נכר expressa reconhecer ou admitir uma relação; “reconheceu” conserva a imagem relacional.
- source_word: אֶחָיו
  choice: seus irmãos
  rationale: Mantém a especificidade masculina plural do hebraico.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: Em português, “filhos” pode designar especificamente os filhos homens e é a correspondência natural para o masculino plural hebraico neste contexto.
- source_word: יָדָע
  choice: conheceu
  rationale: Preserva o verbo hebraico e seu sentido relacional no paralelismo.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão para a prioridade dada à aliança sobre os laços familiares.
- source_word: שָׁמְרוּ
  choice: guardaram
  rationale: Verbo corrente em contexto de obediência e fidelidade à palavra divina.
- source_word: אִמְרָתֶךָ
  choice: a tua palavra
  rationale: Tradução natural que não restringe o termo a um mandamento específico.
- source_word: בְּרִיתְךָ
  choice: a tua aliança
  rationale: Equivalente consagrado e preciso de ברית em contexto pactual.
- source_word: יִנְצֹרוּ
  choice: preservaram
  rationale: Distingue נצר do שׁמר anterior e comunica a ideia de proteger e manter fielmente.
theological_decisions:
- issue: Alternância entre o singular representativo e o plural coletivo
  choice: Manter o singular nas declarações sobre familiares e o plural na justificativa final.
  alternative: Uniformizar todo o versículo no singular ou no plural.
  rationale: 'O hebraico apresenta Levi de modo corporativo: usa formas singulares na caracterização e formas plurais em “guardaram” e “preservaram”. A tradução conserva essa tensão gramatical sem decidir se há uma mudança estrita entre indivíduo e tribo.'
- issue: Sentido contextual de ראה
  choice: Traduzir idiomaticamente por “levar em conta”, registrando “ver” em nota.
  alternative: Traduzir no corpo do texto por “ver”.
  rationale: No contexto, a afirmação trata de não conceder precedência aos laços familiares diante da fidelidade à aliança, e não de ausência de percepção visual. A nota mantém transparente a base lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas pronominais “teu/tua” para preservar o tom bíblico sem arcaísmo excessivo. A alternância entre singular e plural foi mantida deliberadamente.
