lexical_decisions:
- source_word: וּלְדָן
  choice: E a respeito de Dã
  rationale: A conjunção e a preposição introduzem a bênção referente à tribo de Dã. A formulação é natural em português e preserva o sentido de referência ou assunto.
- source_word: אָמַר
  choice: disse
  rationale: Tradução simples e direta do verbo comum de fala, adequada à fórmula que introduz a bênção.
- source_word: דָּן
  choice: Dã
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: גּוּר אַרְיֵה
  choice: um filhote de leão
  rationale: A expressão designa um leão jovem. “Filhote de leão” preserva a nuance de idade e soa clara em português atual.
- source_word: יְזַנֵּק
  choice: ele salta
  rationale: O verbo indica um movimento súbito de salto ou impulso. “Salta” mantém a imagem vívida sem acrescentar a ideia mais específica de atacar.
- source_word: מִן הַבָּשָׁן
  choice: de Basã
  rationale: A preposição marca origem ou procedência. “De Basã” é conciso, natural e preserva o topônimo.
