  rationale: A revisão elimina a ambiguidade de referente introduzida pela oração relativa após o vocativo e adota “as alturas celestes” como tradução principal de שְׁחָקִים, mais coerente com o paralelismo poético e com seu campo semântico. A possibilidade de “nuvens” é preservada em nota. A sequência dos marcadores foi ajustada para corresponder à posição de cada nota no texto.
