base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: pt
  text: 'Não há ninguém como Deus, ó Jesurum: ele cavalga sobre os céus para ajudar você e, em sua majestade, sobre as alturas celestes.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jesurum é um nome poético dado a Israel.
    reason: cultural_note
  - marker: b
    text: 'Ou: “em seu auxílio”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “as nuvens”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: Não há ninguém como Deus
  rationale: A negação existencial introduz uma comparação absoluta. A formulação é natural em português e mantém a força poética; אֵל é entendido aqui como designação divina comum.
- source_word: יְשֻׁרוּן
  choice: Jesurum
  rationale: Nome poético de Israel, transliterado segundo a forma tradicional e inteligível em português, sem converter o nome em seu possível sentido etimológico.
- source_word: רֹכֵב שָׁמַיִם
  choice: que cavalga sobre os céus
  rationale: O particípio retrata uma ação característica e majestosa de Deus. “Sobre” representa adequadamente a imagem de cavalgar nos céus.
- source_word: בְעֶזְרֶךָ
  choice: para ajudar você
  rationale: A expressão preposicional indica benefício ou finalidade. Esta formulação comunica o sentido com clareza em português moderno, enquanto a alternativa mais formal é registrada em nota.
- source_word: וּבְגַאֲוָתוֹ
  choice: e, em sua majestade
  rationale: Quando aplicada a Deus, גַּאֲוָה expressa exaltação ou majestade; “orgulho” poderia sugerir indevidamente um vício moral.
- source_word: שְׁחָקִים
  choice: as nuvens
  rationale: O termo poético pode designar nuvens, firmamento ou alturas celestes. “Nuvens” preserva a imagem concreta e o paralelismo sem repetir “céus”.
theological_decisions:
- issue: Referente e valor de אֵל na comparação poética
  choice: designação divina comum, traduzida como “Deus”
  alternative: nome próprio “El” ou título “o Poderoso”
  rationale: O contexto exalta de modo incomparável o Deus de Israel. “Deus” é o equivalente português mais natural e não introduz a ideia de outra divindade nomeada.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. Emprega “você” para representar com clareza o singular hebraico dirigido a Israel personificado; mantém “céus” no plural e a imagem elevada de Deus cavalgando sobre eles.
