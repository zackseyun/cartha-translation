  text: וּ/לְ/לֵוִ֣י אָמַ֔ר תֻּמֶּ֥י/ךָ וְ/אוּרֶ֖י/ךָ לְ/אִ֣ישׁ חֲסִידֶ֑/ךָ אֲשֶׁ֤ר נִסִּית/וֹ֙ בְּ/מַסָּ֔ה תְּרִיבֵ֖/הוּ עַל מֵ֥י מְרִיבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: pt
  text: 'E a respeito de Levi ele disse: “Teus Tumim e teus Urim pertencem ao teu fiel[a], a quem puseste à prova em Massá[b] e com quem contendeste junto às águas de Meribá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao teu homem piedoso” ou “ao teu leal”. A expressão hebraica pode designar alguém marcado pela lealdade à aliança.
    reason: lexical_alternative
  - marker: b
    text: Massá significa “provação”, e Meribá está associado a “contenda” ou “disputa” (ver Êx 17:1–7; Nm 20:1–13).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: E a respeito de Levi
  rationale: A preposição לְ introduz Levi como o tema desta parte da bênção. A formulação é natural em português e preserva a transição do hebraico.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: Teus Tumim e teus Urim
  rationale: Tumim e Urim são termos técnicos ligados ao sacerdócio, de significado e forma material não inteiramente certos; a transliteração preserva sua especificidade histórica e religiosa.
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: pertencem ao teu fiel
  rationale: A oração hebraica não tem verbo expresso; “pertencem” explicita de modo natural a relação indicada por לְ. “Teu fiel” comunica a lealdade ou fidelidade pactual de חָסִיד sem identificar o referente.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: a quem puseste à prova
  rationale: O piel de נסה significa testar ou pôr à prova. Esta expressão é corrente e digna em português.
- source_word: בְּמַסָּה
  choice: em Massá
  rationale: Massá é mantido como nome próprio do lugar, em vez de ser traduzido no corpo do texto como “provação”.
- source_word: תְּרִיבֵהוּ
  choice: com quem contendeste
  rationale: ריב expressa contenda ou disputa. A formulação preserva o confronto direto e a ambiguidade quanto ao referente do pronome.
- source_word: עַל מֵי מְרִיבָה
  choice: junto às águas de Meribá
  rationale: Neste contexto, עַל localiza o episódio associado às águas de Meribá; “junto às” é idiomático e mantém a alusão geográfica e narrativa.
theological_decisions:
- issue: Referente de “teu fiel” na bênção de Levi
  choice: Manter a expressão no singular sem identificar seu referente.
  alternative: Identificá-lo explicitamente como Arão, Levi ou a tribo levítica em sentido coletivo.
  rationale: O hebraico permite mais de uma identificação. A tradução conserva essa ambiguidade e não impõe uma interpretação teológica específica.
- issue: Sujeito divino dos verbos na segunda pessoa
  choice: 'Conservar a segunda pessoa dirigida a Deus: “puseste” e “contendeste”.'
  alternative: Reformular os episódios de modo a atribuir explicitamente a prova ou a contenda a Israel ou ao levita.
  rationale: A forma verbal hebraica apresenta o destinatário divino como sujeito; a tradução mantém a tensão do texto sem harmonização interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se os nomes técnicos Tumim e Urim e os topônimos Massá e Meribá. A colocação pronominal e os possessivos em segunda pessoa preservam o tom poético solene sem recorrer a construções arcaicas excessivas.
