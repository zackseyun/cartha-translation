  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: pt
  text: Eles convocarão povos ao monte[a]; ali sacrificarão sacrifícios justos, pois obterão a abundância dos mares e os tesouros ocultos da areia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a um monte”. O hebraico não identifica o monte.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “as coisas ocultas da areia” ou “os tesouros escondidos da areia”. A expressão provavelmente se refere a recursos ligados ao litoral ou a regiões arenosas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: povos
  rationale: Mantém o sentido plural e coletivo de grupos humanos, sem reduzi-los a indivíduos nem defini-los necessariamente como nações políticas.
- source_word: הַר
  choice: ao monte
  rationale: O hebraico não traz artigo, mas pode ser entendido como definido pelo contexto. “Ao monte” conserva a provável referência regional ou cultual sem identificar qual monte seria.
- source_word: יִקְרָאוּ
  choice: chamarão
  rationale: Preserva a amplitude do verbo, que pode envolver chamar, convocar ou convidar.
- source_word: יִזְבְּחוּ זִבְחֵי צֶדֶק
  choice: sacrificarão sacrifícios justos
  rationale: Mantém a especificidade cultual do verbo e expressa צֶדֶק sem decidir se os sacrifícios são corretos, aceitáveis ou oferecidos em justiça.
- source_word: שֶׁפַע יַמִּים
  choice: a abundância dos mares
  rationale: Expressão abrangente que pode incluir alimento, recursos e riqueza provenientes do mar, sem especificar um deles.
- source_word: יִינָקוּ
  choice: extrairão
  rationale: Comunica de modo natural o sentido metafórico de obter sustento ou riqueza, enquanto uma nota preserva a imagem literal de sugar.
- source_word: וּשְׂפוּנֵי טְמֻנֵי חוֹל
  choice: e dos tesouros escondidos na areia
  rationale: Reproduz a ideia de recursos ocultos ou armazenados ligados à areia, sem tentar identificá-los com um produto específico.
theological_decisions:
- issue: Natureza dos “sacrifícios justos”
  choice: Sacrifícios caracterizados como justos ou corretos, sem maior definição
  alternative: Sacrifícios oferecidos em justiça; sacrifícios cultualmente aceitáveis
  rationale: A construção hebraica admite mais de uma relação entre “sacrifícios” e “justiça”. A formulação mantém essa tensão sem introduzir categorias doutrinárias posteriores.
- issue: Identidade do monte
  choice: “o monte”, sem identificação explícita
  alternative: um monte; Sião; um santuário situado num monte; o território montanhoso das tribos
  rationale: O texto hebraico não nomeia o monte. Identificá-lo como Sião, Sinai ou outro lugar iria além da evidência textual.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conservou-se a repetição cultual “sacrificarão sacrifícios” porque ela reflete a construção enfática do hebraico e permanece compreensível. As notas preservam a indefinição do monte, a metáfora de ינק e a incerteza da expressão final.
