- from: Eles chamarão povos ao monte[a]; ali sacrificarão sacrifícios justos, pois extrairão[b] da abundância dos mares e dos tesouros escondidos na areia[c].
  to: Eles convocarão povos ao monte[a]; ali sacrificarão sacrifícios justos, pois obterão a abundância dos mares e os tesouros ocultos da areia[c].
  rationale: 'A revisão melhora a naturalidade sem alterar o sentido: substitui-se “chamarão” por “convocarão”; reformula-se a metáfora de יִינָקוּ como “obterão”, preservando a forma literal na nota; e troca-se “na areia” por “da areia”, que reproduz com maior precisão o genitivo hebraico. A nota b foi mantida como suporte da escolha não literal e sua posição foi ajustada para seguir uma sequência regular de marcadores, sem necessidade de âncora no texto principal, pois a nota c já assinala a expressão final.'
