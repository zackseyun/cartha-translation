review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e os principais termos do hebraico estão bem representados: os povos são chamados ao monte, há sacrifícios, e seguem-se os benefícios do mar e da areia. Contudo, “extrairão da abundância ... e dos tesouros” torna a relação verbal menos natural em português e desloca levemente os dois sintagmas, que são objetos de יִינָקוּ. “Na areia” também interpreta o genitivo חוֹל de modo mais restrito do que “da areia”.'
  naturalness: “Convocarão povos” é mais idiomático e explícito que “chamarão povos” neste contexto. “Obterão a abundância ... e os tesouros” mantém o sentido metafórico de derivar benefício, com a imagem literal preservada em nota, e produz uma frase portuguesa mais fluida.
  terminology: “Monte”, “sacrificarão sacrifícios justos”, “abundância dos mares” e “tesouros ocultos” preservam adequadamente o registro poético e cultual. “Sacrifícios justos” conserva a ambiguidade de זִבְחֵי צֶדֶק sem impor uma explicação doutrinária.
  issues:
  - severity: low
    issue: “Chamarão povos ao monte” é menos idiomático em português moderno.
    rationale: “Convocarão povos ao monte” comunica naturalmente o sentido amplo de קרא — chamar, reunir ou convocar — sem determinar se se trata de mera convocação ou convite.
  - severity: medium
    issue: “Extrairão da abundância dos mares e dos tesouros escondidos” é sintaticamente pouco natural e enfraquece a construção hebraica.
    rationale: יִינָקוּ toma “a abundância dos mares” e “os [tesouros] ocultos da areia” como benefícios dos quais se recebe sustento/riqueza. “Obterão” é uma representação idiomática do efeito metafórico; a nota conserva “sugarão”.
  - severity: low
    issue: “Tesouros escondidos na areia” especifica uma localização que o hebraico não afirma diretamente.
    rationale: חוֹל é um genitivo, “da areia”. “Tesouros ocultos da areia” preserva a relação sem decidir que estejam literalmente enterrados nela.
  revised_text: Eles convocarão povos ao monte[a]; ali sacrificarão sacrifícios justos, pois obterão a abundância dos mares e os tesouros ocultos da areia[c].
