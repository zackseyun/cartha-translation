base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: pt
  text: E ele foi rei em Jesurum[a][b], quando se reuniram os chefes do povo, juntamente com as tribos de Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E o SENHOR foi rei em Jesurum”. Outros entendem: “E ele, Moisés, foi rei em Jesurum”. O hebraico não identifica explicitamente o sujeito; também pode ser entendido como “E houve um rei em Jesurum”.'
    reason: alternative_reading
  - marker: b
    text: “Jesurum” é um nome poético de Israel.
    reason: cultural_note
  - marker: c
    text: 'Ou: “quando os chefes do povo se reuniram, as tribos de Israel juntas”. A construção hebraica é condensada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E ele foi
  rationale: A forma de היה pode indicar estado ou começo de estado. Aqui, “foi” é natural em português e não força a ideia de que a realeza começou naquele momento; o referente de “ele” permanece sem identificação explícita.
- source_word: בִישֻׁרוּן
  choice: em Jesurum
  rationale: Mantém como nome próprio o nome poético de Israel e traduz ב pelo sentido locativo ou corporativo mais direto, “em”.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente comum do substantivo hebraico, sem acrescentar uma identificação que o texto não fornece.
- source_word: בְּהִתְאַסֵּף
  choice: quando se reuniram
  rationale: O infinitivo construto com ב introduz naturalmente uma circunstância temporal.
- source_word: רָאשֵׁי עָם
  choice: os chefes do povo
  rationale: Preserva o sentido idiomático de “cabeças do povo” como seus chefes ou líderes, em linguagem portuguesa natural.
- source_word: יַחַד
  choice: todas juntas
  rationale: Expressa a reunião e unidade corporativa indicadas pelo advérbio.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: as tribos de Israel
  rationale: Mantém a designação literal e a lê em aposição explicativa aos representantes reunidos, sem definir uma estrutura política ou litúrgica específica.
theological_decisions:
- issue: Referente do rei
  choice: O texto principal conserva “ele” sem identificar seu referente.
  alternative: '“O SENHOR foi rei em Jesurum”; ou “Moisés foi rei em Jesurum”; também é possível entender impessoalmente: “houve um rei em Jesurum”.'
  rationale: O hebraico não nomeia explicitamente o sujeito. Identificá-lo no texto principal eliminaria uma ambiguidade genuína e poderia impor uma conclusão teológica discutida.
- issue: Unidade corporativa de Israel
  choice: A reunião é apresentada como a congregação conjunta dos chefes e das tribos.
  alternative: Entender a cena especificamente como entronização real ou assembleia formal da aliança.
  rationale: O versículo afirma a reunião e a unidade de Israel, mas não define expressamente a natureza política ou litúrgica da ocasião.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Jesurum” conserva o nome poético tradicional; “chefes” comunica com naturalidade o idioma hebraico. A ordem e a aposição procuram manter a construção compacta do original sem resolver suas ambiguidades.
