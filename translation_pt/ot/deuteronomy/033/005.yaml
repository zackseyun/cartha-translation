  naturalness: “E ele foi rei” é aceitável em registro bíblico português, embora tenha uma nuance narrativa mais marcada do que o inglês. A correção necessária é tornar natural e inequívoca a oração temporal.
  terminology: “Jesurum”, “rei” e “chefes do povo” são escolhas adequadas. “SENHOR” na nota é a convenção portuguesa apropriada para a leitura que identifica o sujeito com YHWH.
