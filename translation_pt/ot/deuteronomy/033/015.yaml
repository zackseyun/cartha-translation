  text: וּ/מֵ/רֹ֖אשׁ הַרְרֵי קֶ֑דֶם וּ/מִ/מֶּ֖גֶד גִּבְע֥וֹת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/015.yaml
  text: and from the choicest things of the ancient mountains[a], and from the abundance of the everlasting hills[b],
translation:
  language: pt
  text: 'e do melhor dos montes antigos[a],

    e da abundância das colinas eternas[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do topo dos montes antigos”. A expressão hebraica pode ser entendida espacialmente (“topo”) ou qualitativamente (“o principal” ou “o melhor”).
    reason: lexical_alternative
  - marker: b
    text: Ou “das preciosidades das colinas eternas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: do melhor dos
  rationale: Embora רֹאשׁ signifique literalmente “cabeça” ou “topo”, neste catálogo poético de bênçãos a expressão pode indicar aquilo que é principal ou melhor. O paralelismo com מֶגֶד favorece aqui o sentido qualitativo, sem ocultar a leitura espacial possível.
- source_word: הַרְרֵי
  choice: montes
  rationale: Plural construto de הַר. “Montes” é natural em português e mantém a distinção poética em relação às “colinas” do segundo membro.
- source_word: קֶדֶם
  choice: antigos
  rationale: קֶדֶם pode indicar o leste ou a antiguidade. Em paralelo com עוֹלָם, o sentido temporal é mais provável.
- source_word: מִמֶּגֶד
  choice: da abundância das
  rationale: מֶגֶד denota bens preciosos, excelência ou produção rica. “Abundância” comunica de modo claro a fartura proveniente das colinas, enquanto a alternativa mais literal é preservada em nota.
- source_word: גִּבְעוֹת
  choice: colinas
  rationale: Equivalente corrente de גִּבְעָה, distinguindo-o de הַרְרֵי, “montes”.
- source_word: עוֹלָם
  choice: eternas
  rationale: No retrato poético da paisagem, עוֹלָם expressa duração sem fim ou antiguidade duradoura. “Eternas” preserva a força elevada da expressão sem repetir “antigos”.
