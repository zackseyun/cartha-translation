source:
  edition: WLC
  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: pt
  text: Como você é feliz, Israel! Quem é como você, povo salvo por Yahweh, o escudo que o ajuda e a espada da sua majestade? Seus inimigos virão se curvando diante de você[a], e você pisará sobre as alturas deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se submeterão a você com fingimento”. O verbo hebraico pode indicar submissão forçada, servil ou fingida.
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre os lugares altos — ou as fortalezas — deles”. Alguns entendem a expressão como “sobre as costas deles”, mas “alturas” representa mais diretamente o substantivo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: Como você é feliz
  rationale: A exclamação אַשְׁרֵי descreve uma condição de felicidade e bem-aventurança digna de admiração. A formulação conserva o tom celebrativo e soa natural em português atual.
- source_word: מִי כָמוֹךָ
  choice: Quem é como você
  rationale: Mantém diretamente a pergunta retórica que proclama a incomparabilidade de Israel como povo favorecido por Deus.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: povo salvo por Yahweh
  rationale: O particípio nifal caracteriza Israel como povo que foi salvo ou liberto por Yahweh. “Salvo” preserva a amplitude do termo e a forma passiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: מָגֵן עֶזְרֶךָ
  choice: o escudo que o ajuda
  rationale: Expressa em português natural a construção nominal hebraica condensada, apresentando Yahweh como proteção e fonte de auxílio de Israel.
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: e a espada da sua majestade
  rationale: Preserva o paralelismo nominal e o sentido positivo de exaltação ou dignidade de גַּאֲוָה, sem introduzir a conotação moral negativa que “orgulho” costuma ter.
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: Seus inimigos virão se curvando diante de você
  rationale: Comunica a submissão humilhante indicada pelo verbo sem eliminar sua possível nuance de submissão forçada, fingida ou enganosa, explicitada em nota.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: você pisará sobre as alturas deles
  rationale: “Alturas” é a correspondência direta de בָּמוֹת e conserva a imagem poética e militar sem decidir se se trata especificamente de posições elevadas, fortalezas ou, metaforicamente, costas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto apresenta o tetragrama como nome próprio. “Yahweh” o preserva de forma transliterada, sem substituí-lo por um título.
- issue: Sentido de גַּאֲוָתֶךָ
  choice: sua majestade
  alternative: seu orgulho; sua exaltação; sua glória
  rationale: No contexto da bênção, o termo indica exaltação honrosa. “Majestade” conserva esse valor positivo sem sugerir necessariamente orgulho pecaminoso.
- issue: Agente e sentido das imagens do escudo e da espada
  choice: Yahweh é descrito como o escudo que ajuda Israel e a espada da majestade de Israel
  alternative: um escudo e uma espada pertencentes a Israel
  rationale: A sintaxe poética liga as duas imagens a Yahweh, mas conserva a formulação compacta do hebraico e evita desenvolver uma explicação teológica ausente do verso.
translation_notes:
  register: Português moderno, solene e acessível, com tratamento por “você” adequado à ampla legibilidade brasileira. A poesia foi mantida em uma única sequência retórica, e as ambiguidades lexicais relevantes foram preservadas por meio de notas.
