base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: pt
  text: 'E a respeito de Zebulom ele disse: “Alegra-te, Zebulom, em tuas saídas[a], e tu, Issacar, em tuas tendas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando saíres”. A expressão hebraica pode indicar a esfera das saídas de Zebulom, de suas atividades ou de sua prosperidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: E a respeito de Zebulom
  rationale: A preposição ל introduz a bênção referente à tribo; “a respeito de” comunica isso com naturalidade e sem sugerir necessariamente que Moisés fale diretamente a Zebulom nesta fórmula introdutória.
- source_word: אָמַר
  choice: ele disse
  rationale: Tradução comum e direta de אמר na introdução de discurso.
- source_word: שְׂמַח
  choice: Alegre-se
  rationale: Preserva a força imperativa e o tom elevado da bênção em português atual.
- source_word: זְבוּלֻן
  choice: Zebulom
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: בְּ/צֵאתֶךָ
  choice: em suas saídas
  rationale: Mantém a imagem concreta, o valor circunstancial ou de esfera da construção com ב e o paralelismo com “em suas tendas”, sem especificar indevidamente o tipo de atividade.
- source_word: וְ/יִשָּׂשכָר
  choice: e você, Issacar
  rationale: A explicitação pronominal torna natural em português a coordenação do segundo destinatário com o imperativo “alegre-se”, que vale para ambas as tribos.
- source_word: בְּ/אֹהָלֶיךָ
  choice: em suas tendas
  rationale: Conserva o plural e a imagem concreta hebraica, bem como o contraste poético com as saídas de Zebulom.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. O paralelismo poético e a ambiguidade de בְּצֵאתֶךָ foram preservados; a alternativa circunstancial aparece em nota.
