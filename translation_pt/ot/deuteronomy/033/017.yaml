  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: pt
  text: Seu touro primogênito tem majestade, e seus chifres são como os de um boi selvagem[a]; com eles, ele investirá contra os povos, todos juntos, até os confins da terra. Essas são as miríades de Efraim[b], e esses são os milhares de Manassés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os chifres de um touro selvagem”. O hebraico רְאֵם provavelmente se refere a um bovino selvagem poderoso, tradicionalmente traduzido por “unicórnio” em versões antigas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as dezenas de milhares de Efraim”. O hebraico רִבְבוֹת denota números muito elevados e contrasta aqui com os “milhares de Manassés”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: seu touro primogênito
  rationale: בְּכוֹר designa o primeiro nascido, e שׁוֹר é um bovino; “touro” mantém a imagem masculina e combina naturalmente com os chifres.
- source_word: הָדָר לוֹ
  choice: tem majestade
  rationale: Preserva a força nominal de הָדָר, que expressa majestade, esplendor ou honra, em português natural.
- source_word: קַרְנֵי רְאֵם קַרְנָיו
  choice: seus chifres são como os de um boi selvagem
  rationale: רְאֵם provavelmente designa um bovino selvagem poderoso, possivelmente o auroque. A formulação comunica claramente a comparação implícita sem recorrer ao tradicional e zoologicamente improvável “unicórnio”.
- source_word: בָּהֶם עַמִּים יְנַגַּח
  choice: com eles, ele atingirá a chifradas os povos
  rationale: נָגַח descreve o ataque de um animal com os chifres. “Atingirá a chifradas” conserva a imagem concreta e é mais claro em português atual do que o verbo isolado “chifrará”.
- source_word: יַחְדָּו
  choice: todos juntos
  rationale: Expressa o alcance coletivo ou simultâneo do ataque, sem determinar além do que o contexto permite se o foco recai mais diretamente sobre os povos ou sobre a ação.
- source_word: אַפְסֵי אָרֶץ
  choice: até os confins da terra
  rationale: Equivalente idiomático e poético para as regiões mais distantes da terra.
- source_word: רִבְבוֹת אֶפְרַיִם
  choice: as miríades de Efraim
  rationale: רִבְבוֹת indica números muito elevados, literalmente dezenas de milhares; “miríades” mantém o registro poético e o contraste com os milhares de Manassés.
- source_word: אַלְפֵי מְנַשֶּׁה
  choice: os milhares de Manassés
  rationale: O paralelismo com רִבְבוֹת favorece o sentido numérico de אַלְפֵי, em vez do possível sentido de unidades de clã.
theological_decisions:
- issue: Referente da imagem do touro na bênção de José
  choice: Manter o pronome masculino e a metáfora bovina sem identificar explicitamente o touro apenas com José ou apenas com Efraim.
  alternative: Explicitar que o “touro primogênito” representa Efraim como preeminente entre os descendentes de José.
  rationale: A bênção se dirige a José e depois relaciona a força retratada às multidões de Efraim e Manassés. O texto traduzido preserva essa tensão referencial sem impor uma interpretação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção poética conserva a imagem vigorosa dos chifres, o alcance universal de “confins da terra” e o contraste numérico entre Efraim e Manassés. O marcador [a] foi colocado junto à expressão a que sua nota lexical efetivamente se refere.
