base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: pt
  text: 'E a respeito de Aser, disse:


    “Mais bendito que os filhos seja Aser[a];

    que ele seja favorecido por seus irmãos[b]

    e mergulhe o pé em óleo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O mais bendito entre os filhos seja Aser”. A comparação hebraica pode ser entendida em sentido comparativo ou superlativo.'
    reason: lexical_alternative
  - marker: b
    text: “Seus irmãos” provavelmente se refere às outras tribos de Israel.
    reason: cultural_note
  - marker: c
    text: A imagem de mergulhar o pé em óleo provavelmente comunica abundância ou prosperidade, talvez ligada à produção de azeite; o hebraico, porém, mantém a imagem concreta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: E a respeito de Aser, disse
  rationale: A preposição introduz a bênção referente à tribo seguinte. “A respeito de” é claro e natural em português, enquanto “disse” mantém a fórmula narrativa simples.
- source_word: בָּרוּךְ מִבָּנִים אָשֵׁר
  choice: Bendito mais que os filhos seja Aser
  rationale: A construção com מִן admite valor comparativo ou superlativo. A formulação preserva a comparação e a ordem poética sem identificar explicitamente os “filhos” com as tribos no texto principal.
- source_word: יְהִי רְצוּי אֶחָיו
  choice: que ele seja favorecido por seus irmãos
  rationale: O jussivo expressa um desejo próprio de uma bênção. רְצוּי indica ser aceito ou acolhido com favor; “favorecido” preserva essa amplitude relacional.
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: e mergulhe o pé em óleo
  rationale: A coordenação poética permite que o particípio prossiga o sentido volitivo da linha anterior. Mantêm-se o singular “pé” e a imagem concreta do óleo sem explicá-la no corpo do texto.
theological_decisions:
- issue: Sentido de “bendito mais que os filhos”
  choice: Preservar no texto a construção comparativa
  alternative: “O mais bendito entre os filhos seja Aser”
  rationale: O hebraico pode ser entendido comparativa ou superlativamente; a tradução principal não deve eliminar essa ambiguidade legítima.
- issue: Imagem de mergulhar o pé em óleo
  choice: Manter literalmente a metáfora
  alternative: Explicitar prosperidade agrícola, luxo ou abundância
  rationale: A imagem sugere abundância, possivelmente de azeite, mas não define seu alcance. A tradução conserva a tensão poética e deixa a explicação provável para a nota.
translation_notes:
  register: Português moderno, digno e de leitura corrente, com estrutura poética em linhas. Emprega “óleo” em vez de especificar “azeite”, pois שֶׁמֶן não explicita aqui a origem, e conserva “irmãos” como metáfora tribal masculina do texto hebraico.
