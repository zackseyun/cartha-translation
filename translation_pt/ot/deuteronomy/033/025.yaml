lexical_decisions:
- source_word: בַּרְזֶל
  choice: ferro
  rationale: Sentido comum do metal e par natural de נְחֹשֶׁת neste contexto.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode abranger cobre ou bronze; “bronze” forma a combinação tradicional e idiomática com “ferro”.
- source_word: מִנְעָלֶיךָ
  choice: as suas trancas
  rationale: Embora o substantivo possa designar sandálias ou calçados, a referência a ferro e bronze favorece aqui a imagem de trancas ou ferrolhos que oferecem proteção. A alternativa lexical é preservada em nota.
- source_word: וּכְיָמֶיךָ
  choice: e, como os seus dias
  rationale: A preposição כ marca comparação ou proporção. A formulação preserva o caráter condensado do hebraico sem explicitar se “dias” se refere à duração da vida ou ao curso cotidiano.
- source_word: דָּבְאֶךָ
  choice: assim será a sua força
  rationale: O termo é raro e de sentido incerto. “Força” é uma leitura tradicional e adequada ao contexto de bênção, mas as possibilidades “descanso” e “segurança” são registradas em nota.
theological_decisions:
- issue: Imagem e promessa da bênção
  choice: A tradução principal expressa proteção duradoura e força correspondente aos dias do destinatário.
  alternative: O texto pode descrever calçados resistentes para terreno difícil, e o termo final pode significar descanso ou segurança, em vez de força.
  rationale: A combinação dos metais favorece a leitura de trancas, e o contexto de bênção favorece “força”; contudo, a incerteza lexical genuína é mantida nas notas, sem transformar a opção principal em certeza exegética.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo conciso do hebraico foi mantido, e as duas principais incertezas lexicais foram explicitadas em notas.
