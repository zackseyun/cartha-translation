    text: 'Ou: “Suas sandálias serão de ferro e bronze” ou “Seus calçados serão de ferro e bronze”. O substantivo hebraico pode designar calçados, embora muitos entendam aqui “trancas” ou “ferrolhos”, por causa da imagem dos metais e do contexto de proteção.'
