  terminology: “Deus de outrora”, “morada”, “braços eternos”, “expulsou”, “inimigo” e “Destrua!” são escolhas adequadas. “De outrora” evita a possível impressão de que Deus pertence apenas a tempos antigos, que “dos tempos antigos” pode sugerir.
