  text: מְעֹנָה֙ אֱלֹ֣הֵי קֶ֔דֶם וּ/מִ/תַּ֖חַת זְרֹעֹ֣ת עוֹלָ֑ם וַ/יְגָ֧רֶשׁ מִ/פָּנֶ֛י/ךָ אוֹיֵ֖ב וַ/יֹּ֥אמֶר הַשְׁמֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: pt
  text: 'O Deus de outrora é uma morada[a], e, por baixo, estão os braços eternos. Ele expulsou o inimigo de diante de você e disse: “Destrua!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Deus eterno é o seu refúgio”. Essa interpretação tradicional é possível, embora a formulação mais direta do hebraico seja: “O Deus de outrora é uma morada”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: morada
  rationale: O substantivo designa habitação ou lugar de abrigo. “Morada” preserva a imagem concreta e poética sem reduzi-la à interpretação metafórica de “refúgio”.
- source_word: אֱלֹהֵי קֶדֶם
  choice: O Deus dos tempos antigos
  rationale: קֶדֶם aponta diretamente para a antiguidade ou os tempos de outrora. A formulação é natural em português e evita transformar sem explicitação essa referência temporal em “eterno”.
- source_word: וּמִתַּחַת
  choice: e por baixo
  rationale: Mantém a relação espacial do hebraico e o paralelismo poético com a morada mencionada na primeira oração.
- source_word: זְרֹעֹת עוֹלָם
  choice: os braços eternos
  rationale: “Braços” conserva a metáfora de força e amparo; עוֹלָם expressa aqui duração permanente, bem representada por “eternos”.
- source_word: וַיְגָרֶשׁ
  choice: Ele expulsou
  rationale: גרש significa expulsar ou pôr para fora e, neste contexto, descreve com clareza a remoção forçada do inimigo.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: Reproduz de modo natural o sentido literal de afastar o inimigo da presença ou do caminho de Israel.
- source_word: אוֹיֵב
  choice: o inimigo
  rationale: Preserva o singular hebraico, que também pode ter valor coletivo.
- source_word: וַיֹּאמֶר
  choice: e disse
  rationale: Dá continuidade à ação narrativa, tomando Deus como o sujeito indicado pelo contexto imediato.
- source_word: הַשְׁמֵד
  choice: Destrua!
  rationale: O imperativo no Hifil exige destruição completa; “Destrua!” é forte, claro e não acrescenta especificidade além do hebraico.
theological_decisions:
- issue: Se קֶדֶם em אֱלֹהֵי קֶדֶם deve ser traduzido temporalmente como “dos tempos antigos” ou teologicamente como “eterno”
  choice: O Deus dos tempos antigos
  alternative: O Deus eterno é o seu refúgio
  rationale: O sentido lexical mais direto de קֶדֶם remete à antiguidade ou aos tempos de outrora. A tradução tradicional “Deus eterno” é uma interpretação viável no contexto, mas combina esse entendimento com uma leitura metafórica e possessiva de מְעֹנָה; por isso, é preservada em nota, sem eliminar a tensão do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A dicção conserva o paralelismo e as imagens espaciais do poema. O pronome singular “você” comunica o destinatário coletivo personificado no contexto, sem tornar o número explicitamente plural.
