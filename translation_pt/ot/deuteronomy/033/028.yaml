base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: pt
  text: Assim, Israel habitou em segurança, sozinho[b]; a fonte de Jacó[a], numa terra de cereal e vinho novo; até os seus céus gotejaram orvalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o olho de Jacó”. A palavra hebraica pode significar tanto “olho” como “fonte” ou “nascente”; o texto principal segue o sentido que melhor se ajusta às imagens de abundância agrícola.
    reason: lexical_alternative
  - marker: b
    text: Ou “à parte”. Aqui, “sozinho” pode expressar uma condição separada e segura, e não abandono ou solidão negativa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: habitou
  rationale: O verbo שׁכן indica morar, residir ou estabelecer-se. “Habitou” conserva o aspecto narrativo do hebraico e mantém um registro digno sem ser obscuro.
- source_word: בֶּטַח
  choice: em segurança
  rationale: O termo funciona adverbialmente e descreve a condição segura em que Israel habita.
- source_word: בָּדָד
  choice: sozinho
  rationale: Expressa separação ou condição à parte. No contexto de bênção, aponta para segurança sem ameaça, não necessariamente para solidão negativa.
- source_word: עֵין יַעֲקֹב
  choice: a fonte de Jacó
  rationale: עַיִן pode significar “olho” ou “fonte/nascente”. A imagem de uma fonte se harmoniza com a terra fértil, o cereal, o vinho novo e o orvalho, mas a alternativa literal é preservada em nota.
- source_word: אֶל אֶרֶץ
  choice: numa terra
  rationale: Embora אֶל costume significar “para” ou “em direção a”, na construção poética a frase relaciona a fonte de Jacó à terra fértil; “numa terra” comunica naturalmente essa localização sem ampliar a afirmação.
- source_word: דָּגָן
  choice: cereal
  rationale: Designa genericamente os grãos ou produtos cerealíferos. “Cereal” evita restringir o sentido a uma espécie específica.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: O termo costuma designar vinho novo ou produto recente da videira e integra a imagem de abundância agrícola.
- source_word: אַף
  choice: até
  rationale: 'Marca ênfase crescente: além da fertilidade da terra, até os céus contribuem com o orvalho.'
- source_word: שָׁמָיו
  choice: os seus céus
  rationale: Mantém o sufixo possessivo masculino singular do hebraico, provavelmente referido a Israel/Jacó, e preserva a linguagem poética.
- source_word: יַעַרְפוּ
  choice: gotejaram
  rationale: O verbo descreve o ato de destilar ou deixar cair gotas, especialmente em imagens poéticas de chuva ou orvalho.
- source_word: טָל
  choice: orvalho
  rationale: Equivalente direto e natural, além de imagem agrícola de fertilidade e bênção.
theological_decisions:
- issue: Sentido de עֵין יַעֲקֹב
  choice: “a fonte de Jacó”
  alternative: “o olho de Jacó”
  rationale: A leitura “fonte” se ajusta melhor ao conjunto de imagens de fertilidade, mas a polissemia hebraica é genuína e fica registrada em nota, sem lhe atribuir significado doutrinário adicional.
- issue: Força de בָּדָד
  choice: “sozinho”, no sentido de habitar à parte e em segurança
  alternative: “por si só” ou “à parte”
  rationale: O contexto é de bênção e segurança, não de abandono. A tradução conserva a possível tensão da palavra sem explicá-la excessivamente no texto.
