  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: pt
  text: Com pedras inteiras[a] você construirá o altar de Yahweh, seu Deus, e sobre ele oferecerá holocaustos a Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras não lavradas”. O hebraico diz literalmente “pedras inteiras/completas”; “não lavradas” reflete a instrução do versículo 5 de que nenhuma ferramenta de ferro fosse usada nelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: pedras inteiras
  rationale: O adjetivo שְׁלֵמוֹת indica literalmente pedras inteiras ou completas. A expressão preserva o sentido lexical direto; “pedras não lavradas” é uma interpretação contextual baseada na proibição de usar ferramenta de ferro no versículo 5.
- source_word: תִּבְנֶה
  choice: você construirá
  rationale: Neste contexto instrutivo e legal, o imperfeito tem força diretiva. O futuro em português comunica naturalmente a ordem solene.
- source_word: מִזְבַּח
  choice: altar
  rationale: Equivalente corrente e preciso para a estrutura destinada aos sacrifícios.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de modo direto a construção possessiva e pactual com sufixo de segunda pessoa masculina singular.
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: e sobre ele oferecerá
  rationale: O hifil de עלה com objeto sacrificial significa oferecer. A formulação é idiomática em português e mantém explícito que a oferta ocorre sobre o altar.
- source_word: עוֹלֹת
  choice: holocaustos
  rationale: Termo sacrificial tradicional e preciso em português para ofertas queimadas por inteiro; evita a paráfrase mais longa “ofertas queimadas”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica aqui o destinatário ou a dedicação do sacrifício.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Se שְׁלֵמוֹת deve ser interpretado como “não lavradas” no texto principal
  choice: pedras inteiras
  alternative: pedras não lavradas
  rationale: O adjetivo significa diretamente “inteiras/completas”. A ideia de não serem lavradas decorre da instrução contextual do versículo 5 e, por isso, é conservada em nota, sem eliminar a distinção entre léxico e contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação “sobre ele” evita ambiguidade quanto ao altar, e o futuro mantém o tom diretivo da instrução pactual.
