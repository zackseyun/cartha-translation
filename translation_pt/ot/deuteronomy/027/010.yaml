  text: וְ/שָׁ֣מַעְתָּ֔ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/עָשִׂ֤יתָ אֶת מִצְוֺתָ/ו֙ וְ/אֶת חֻקָּ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: pt
  text: Portanto, escute a voz de Yahweh, seu Deus, e cumpra os seus mandamentos e os seus estatutos que hoje lhe ordeno[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obedeça à voz de Yahweh, seu Deus”. A expressão hebraica traduzida como “escute a voz” muitas vezes inclui a ideia de obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: escute a voz
  rationale: Preserva a imagem hebraica de escutar a voz, ao mesmo tempo que o contexto implica acolher e obedecer ao que é dito. A nota registra explicitamente essa dimensão idiomática.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de modo direto a construção possessiva e a relação pactual expressa no texto.
- source_word: וְעָשִׂיתָ
  choice: e cumpra
  rationale: Neste contexto legal, עשה significa pôr em prática ou executar. “Cumpra” é natural em português com “mandamentos” e “estatutos” e evita a formulação menos idiomática “faça os mandamentos”.
- source_word: מִצְוֺתָיו
  choice: os seus mandamentos
  rationale: Mantém o sentido jurídico e pactual de מִצְוָה em linguagem portuguesa corrente e digna.
- source_word: חֻקָּיו
  choice: os seus estatutos
  rationale: Distingue חֻקִּים de “mandamentos” e conserva sua nuance de prescrições estabelecidas.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ
  choice: que ... lhe ordeno
  rationale: Expressa a ação presente de Moisés ao dar a ordem e mantém a referência singular ao destinatário coletivo, com formulação natural em português.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente moderno e direto que preserva a ênfase de Deuteronômio no momento presente da aliança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome divino; sua transliteração preserva a distinção entre o nome próprio e o título אֲדֹנָי.
- issue: Relação entre ouvir e obedecer
  choice: escute a voz, com explicação em nota
  alternative: obedeça
  rationale: A expressão hebraica implica obediência, mas a tradução principal conserva a metáfora auditiva e não elimina a tensão entre escutar e cumprir, especialmente porque a oração seguinte explicita a prática dos mandamentos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo “escute ... e cumpra” comunica naturalmente a força injuntiva das formas verbais hebraicas neste contexto. “Portanto” representa a ligação conclusiva com a declaração anterior.
