  text: וְ/זָבַחְתָּ֥ שְׁלָמִ֖ים וְ/אָכַ֣לְתָּ שָּׁ֑ם וְ/שָׂ֣מַחְתָּ֔ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: pt
  text: Você oferecerá sacrifícios de paz[a], comerá ali e se alegrará diante de Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifícios de comunhão” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Você oferecerá
  rationale: No contexto sacrificial, זבח descreve a realização de um sacrifício. “Oferecerá” é natural em português com o complemento “sacrifícios” e evita a redundância de “sacrificará sacrifícios” e a ênfase gráfica de “abaterá”.
- source_word: שְׁלָמִים
  choice: sacrifícios de paz
  rationale: שְׁלָמִים designa uma categoria de sacrifícios ligada ao bem-estar, à comunhão e à refeição sacrificial. “Sacrifícios de paz” conserva a designação tradicional e reconhecível; outras possibilidades legítimas são registradas em nota.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: comerá ali
  rationale: Preserva tanto o sentido simples de אָכַל, “comer”, quanto a indicação de lugar de שָׁם, “ali”, mantendo a sequência instrutiva sem repetir desnecessariamente o pronome.
- source_word: וְשָׂמַחְתָּ
  choice: e se alegrará
  rationale: שׂמח expressa alegria celebrativa no contexto da adoração e da refeição sacrificial; “se alegrará” transmite essa força de modo corrente e digno.
- source_word: לִפְנֵי
  choice: diante de
  rationale: No contexto cúltico, לִפְנֵי indica estar perante ou na presença de alguém. “Diante de” é conciso, natural e preserva essa dimensão relacional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, em vez de substituído por um título, preservando o nome pessoal presente no texto hebraico.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Mantém o sufixo hebraico de segunda pessoa masculina singular e o caráter pactual da fala dirigida a Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual como nome próprio, sem substituí-lo por um título.
- issue: Designação da categoria sacrificial שְׁלָמִים
  choice: sacrifícios de paz
  alternative: sacrifícios de comunhão; ofertas de bem-estar
  rationale: O termo nomeia uma categoria sacrificial associada à integridade, ao bem-estar e à refeição compartilhada, sem se limitar a uma única dessas nuances. A tradução principal mantém a forma tradicional, e a nota preserva as alternativas lexicais legítimas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação verbal é fluida, e o singular da fala dirigida a Israel é preservado.
