base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: pt
  text: '“Maldito aquele que aceita suborno para matar uma pessoa inocente[a].” E todo o povo dirá: “Amém!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para ferir uma pessoa, sangue inocente”. A expressão hebraica refere-se a matar uma pessoa inocente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Mantém a fórmula solene de maldição da aliança em linguagem portuguesa clara e consagrada.
- source_word: לֹקֵחַ
  choice: aquele que aceitar
  rationale: O particípio hebraico tem sentido substantivado e genérico. O futuro do subjuntivo soa natural em português na caracterização de quem vier a praticar o ato.
- source_word: שֹׁחַד
  choice: suborno
  rationale: É o termo jurídico corrente para pagamento ilícito destinado a corromper uma ação ou decisão.
- source_word: לְהַכּוֹת
  choice: para matar
  rationale: Embora נכה possa significar ferir ou abater, a expressão com ‘sangue inocente’ indica aqui violência letal; ‘matar’ comunica diretamente o resultado no português atual.
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: uma pessoa inocente
  rationale: A construção hebraica é incomum e literalmente associa נֶפֶשׁ a ‘sangue inocente’. No contexto jurídico, refere-se à vida ou pessoa inocente; a nota preserva a forma idiomática do original.
- source_word: וְאָמַר כָּל הָעָם
  choice: E todo o povo dirá
  rationale: No contexto litúrgico e prescritivo, a forma verbal introduz a resposta que o povo deverá pronunciar; ‘dirá’ é formal, natural e fiel.
- source_word: אָמֵן
  choice: Amém
  rationale: Retém a afirmação litúrgica hebraica já incorporada ao português e adequada à ratificação pública da maldição.
theological_decisions:
- issue: Força da fórmula de maldição no contexto da aliança
  choice: Maldito aquele que aceitar suborno para matar uma pessoa inocente
  alternative: Maldito quem aceitar suborno para derramar sangue inocente
  rationale: A redação mantém a condenação pactual e jurídica sem acrescentar uma interpretação denominacional. A formulação principal explicita a vítima humana, enquanto a nota conserva a imagem hebraica de ‘sangue inocente’.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala da maldição e a resposta ‘Amém’ recebem pontuação de discurso direto para evidenciar a recitação litúrgica.
