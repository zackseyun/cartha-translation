source:
  edition: WLC
  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: pt
  text: '“Maldito aquele que perverte a justiça devida[c] ao estrangeiro residente[a], ao órfão[b] e à viúva.” E todo o povo dirá: “Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico ger designa uma pessoa não nativa que vivia entre os israelitas.
    reason: cultural_note
  - marker: b
    text: O termo também pode ser traduzido por “aquele que não tem pai”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “desvia o direito do estrangeiro residente, do órfão e da viúva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Mantém a fórmula solene de maldição da aliança e funciona naturalmente como adjetivo predicativo em português.
- source_word: מַטֶּה
  choice: perverte
  rationale: O particípio no hifil de נטה expressa a ação de desviar, torcer ou corromper uma decisão justa; “perverte” comunica com clareza essa corrupção judicial.
- source_word: מִשְׁפַּט
  choice: a justiça devida
  rationale: Neste contexto jurídico, מִשְׁפַּט abrange o direito ou tratamento justo que cabe às pessoas mencionadas, não apenas a justiça em sentido abstrato.
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Designa uma pessoa não israelita que residia entre o povo e possuía uma condição social vulnerável. A expressão é mais precisa que apenas “estrangeiro” e mais natural que um termo técnico moderno.
- source_word: יָתוֹם
  choice: órfão
  rationale: É a forma corrente e amplamente compreensível em português para a categoria social vulnerável indicada pelo hebraico, que pode enfatizar especificamente a ausência do pai.
- source_word: אַלְמָנָה
  choice: viúva
  rationale: Equivalente direto e natural da categoria social mencionada no texto.
- source_word: וְאָמַר כָּל הָעָם
  choice: E todo o povo dirá
  rationale: No contexto da cerimônia, a forma verbal estabelece a resposta coletiva prescrita. O futuro em português preserva esse valor instrutivo e solene.
- source_word: אָמֵן
  choice: Amém
  rationale: Preserva a resposta litúrgica tradicional e seu sentido de confirmação solene.
theological_decisions:
- issue: Representação da tríade jurídico-social sem impor categorias políticas modernas
  choice: o estrangeiro residente, o órfão e a viúva
  alternative: o estrangeiro, o que não tem pai e a viúva
  rationale: A formulação conserva as categorias históricas de pessoas socialmente vulneráveis na lei da aliança, esclarecendo a condição do גֵּר sem transformá-la automaticamente numa classificação política contemporânea.
- issue: Sentido jurídico de מַטֶּה מִשְׁפַּט
  choice: perverte a justiça devida
  alternative: desvia o direito
  rationale: A tradução explicita que a maldição recai sobre quem corrompe o tratamento judicial que cabe a essas pessoas, sem limitar o termo a uma única modalidade processual.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Estrangeiro residente” evita tanto o arcaísmo de “forasteiro” quanto a importação automática de categorias migratórias modernas. A ordem da tríade e a resposta litúrgica coletiva foram preservadas.
