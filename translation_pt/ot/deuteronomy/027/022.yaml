  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: pt
  text: 'Maldito aquele que se deitar com sua irmã, filha de seu pai ou filha de sua mãe. E todo o povo dirá: “Amém.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Mantém a fórmula solene de maldição da aliança de modo direto e corrente em português.
- source_word: שֹׁכֵב עִם
  choice: se deitar com
  rationale: Preserva o eufemismo hebraico para relação sexual e o registro solene, sem recorrer a uma expressão clínica ou excessivamente coloquial.
- source_word: אֲחֹתוֹ
  choice: sua irmã
  rationale: Equivalente direto do termo de parentesco com sufixo masculino singular.
- source_word: בַּת אָבִיו
  choice: filha de seu pai
  rationale: Conserva a especificação legal em aposição e a estrutura explícita do hebraico.
- source_word: אוֹ
  choice: ou
  rationale: Reproduz a conjunção disjuntiva que apresenta a alternativa de parentesco materno.
- source_word: בַת אִמּוֹ
  choice: filha de sua mãe
  rationale: Mantém o paralelismo e a repetição formal da descrição legal.
- source_word: וְאָמַר
  choice: E ... dirá
  rationale: Dá continuidade natural à sequência litúrgica prescrita, conservando o valor prospectivo da resposta comunitária.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Traduz diretamente a expressão hebraica sem acrescentar 'de Israel' nem substituí-la por 'assembleia'.
- source_word: אָמֵן
  choice: Amém
  rationale: Preserva a aclamação litúrgica hebraica já incorporada ao português e adequada ao contexto da aliança.
theological_decisions:
- issue: Alcance da descrição do incesto
  choice: Manter 'sua irmã, filha de seu pai ou filha de sua mãe', sem limitar a proibição apenas à meia-irmã.
  alternative: Explicitar 'meia-irmã' ou ampliar para qualquer parentesco feminino próximo.
  rationale: A formulação hebraica define a irmã por descendência paterna ou materna. Ela abrange relações por um dos pais e não exige que se exclua uma irmã dos mesmos pais; a tradução conserva essa amplitude sem a resolver indevidamente.
- issue: Participante masculino genérico
  choice: aquele que ... sua irmã
  alternative: o homem que ... sua irmã
  rationale: O particípio hebraico é masculino singular, mas funciona como sujeito de uma fórmula jurídica. 'Aquele que' mantém a referência gramatical e evita acrescentar o substantivo 'homem'.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção 'se deitar com' preserva o eufemismo jurídico do hebraico; 'Maldito' e 'Amém' mantêm a cadência litúrgica da série de maldições.
