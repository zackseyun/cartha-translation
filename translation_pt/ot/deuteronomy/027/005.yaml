  text: וּ/בָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא תָנִ֥יף עֲלֵי/הֶ֖ם בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: pt
  text: Ali você construirá um altar para Yahweh, seu Deus, um altar de pedras; não usará nenhuma ferramenta de ferro sobre elas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: você construirá
  rationale: O perfeito qal com a conjunção, neste contexto instrutivo, tem força prospectiva e prescritiva. O futuro mantém o tom solene da instrução sem soar artificial em português.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo que retoma o lugar indicado no contexto. “Ali” é direto e natural.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Equivalente corrente e preciso para o lugar de sacrifício.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: a Yahweh, seu Deus
  rationale: A preposição indica que o altar é destinado a Yahweh; o sufixo de segunda pessoa singular em אֱלֹהֶיךָ expressa “seu Deus”.
- source_word: מִזְבַּח אֲבָנִים
  choice: um altar de pedras
  rationale: Reproduz naturalmente a construção hebraica e conserva a especificação material no plural.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: não passará ferro sobre elas
  rationale: Mantém a imagem concreta do hebraico e a referência literal a “ferro”, sem inserir no texto principal a palavra “ferramenta”, que está implícita. A nota apresenta a formulação explícita.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título; a nota identifica a forma hebraica.
- issue: Grau de explicitação de בַּרְזֶל
  choice: ferro
  alternative: ferramenta de ferro
  rationale: O substantivo hebraico significa literalmente “ferro”, embora no contexto designe um instrumento de ferro. A tradução principal conserva a concisão e a imagem do original, enquanto a nota esclarece o sentido instrumental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você construirá” mantém a instrução no singular, conforme o hebraico, e evita o caráter regional ou excessivamente solene de “tu construirás”. A ordem da frase e a repetição de “altar” preservam a ênfase do original.
