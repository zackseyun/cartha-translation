  text: וְ/אֵ֛לֶּה יַֽעַמְד֥וּ עַל הַ/קְּלָלָ֖ה בְּ/הַ֣ר עֵיבָ֑ל רְאוּבֵן֙ גָּ֣ד וְ/אָשֵׁ֔ר וּ/זְבוּלֻ֖ן דָּ֥ן וְ/נַפְתָּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: pt
  text: 'E estes ficarão de pé no monte Ebal para a maldição: Rúben[a], Gade, Aser, Zebulom, Dã e Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a proclamação da maldição” ou “para amaldiçoar”.
    reason: Alternativas lexicais para עַל הַקְּלָלָה, cuja formulação hebraica não explicita a ação ritual.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes
  rationale: A conjunção e o demonstrativo ligam este grupo ao do versículo anterior e estabelecem o contraste correspondente.
- source_word: יַעַמְדוּ
  choice: ficarão
  rationale: O imperfeito expressa a instrução futura de Moisés; “ficarão” é natural em português e mantém o sentido de tomar posição no contexto cerimonial.
- source_word: עַל הַקְּלָלָה
  choice: para a maldição
  rationale: A preposição indica associação ou designação para o ato ou conteúdo da maldição, em paralelo com a bênção no versículo anterior, sem acrescentar um verbo ausente no hebraico.
- source_word: בְּהַר עֵיבָל
  choice: no monte Ebal
  rationale: Forma idiomática em português para indicar a localização, com transliteração tradicional do topônimo.
- source_word: רְאוּבֵן גָּד אָשֵׁר זְבוּלֻן דָּן נַפְתָּלִי
  choice: Rúben, Gade, Aser, Zebulom, Dã e Naftali
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
theological_decisions:
- issue: Função ritual das tribos em relação à maldição
  choice: para a maldição
  alternative: para proclamar a maldição; para amaldiçoar
  rationale: O hebraico não repete explicitamente um verbo como “proclamar”. A formulação concisa preserva essa abertura, enquanto o contexto dos dois montes indica participação cerimonial.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. A ordem foi ajustada para “ficarão no monte Ebal para a maldição”, mais natural em português, sem alterar a relação semântica do hebraico.
