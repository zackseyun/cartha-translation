base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: pt
  text: 'Maldito seja aquele que ferir o seu próximo às escondidas[a]. E todo o povo dirá: “Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “golpear” ou “matar”; o verbo hebraico pode abranger desde ferir violentamente até matar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Reproduz com clareza a fórmula de maldição da aliança expressa pelo particípio passivo/adjetival hebraico.
- source_word: מַכֵּה
  choice: abater
  rationale: O verbo נכה pode indicar golpear, ferir ou matar. “Abater” comunica violência grave e admite resultado fatal sem restringir obrigatoriamente o sentido a homicídio.
- source_word: רֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ designa aqui outro membro da comunidade ou semelhante; “próximo” é natural, reconhecível e mantém o caráter relacional do termo.
- source_word: בַּסָּתֶר
  choice: às escondidas
  rationale: Expressa de modo idiomático uma ação praticada em segredo, fora da vista pública.
- source_word: וְאָמַר
  choice: E ... dirá
  rationale: No contexto da sequência cerimonial, a construção introduz a resposta prescrita da assembleia; o futuro conserva a cadência litúrgica.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Traduz diretamente a expressão hebraica sem acrescentar “de Israel”, embora isso esteja claro no contexto.
- source_word: אָמֵן
  choice: Amém
  rationale: Mantém a resposta litúrgica tradicional e sua força de confirmação e aceitação da maldição da aliança.
theological_decisions:
- issue: Grau de violência expresso por מַכֵּה
  choice: “abater”, com nota sobre a amplitude lexical
  alternative: “ferir”, “golpear” ou “matar”
  rationale: O hebraico não determina por si só se a agressão termina em morte. “Abater” preserva a gravidade sugerida pelo contexto sem transformar explicitamente toda ocorrência em homicídio.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Às escondidas” soa natural sem perder a ideia hebraica de ocultação, e “Amém” conserva o caráter responsivo e litúrgico.
