  yaml_path: translation/ot/deuteronomy/027/014.yaml
  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: pt
  text: E os levitas responderão e dirão em alta voz a todo homem de Israel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a todo israelita”. O hebraico diz literalmente “a todo homem de Israel”, empregando o masculino singular com sentido representativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ
  choice: responderão
  rationale: O verbo ענה, nesta fórmula, introduz uma resposta ou proclamação formal. O futuro em português expressa adequadamente a instrução para a cerimônia.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: O hebraico menciona especificamente os levitas, não os sacerdotes; por isso, mantém-se a designação exata.
- source_word: וְאָמְרוּ
  choice: e dirão
  rationale: אמר é o verbo comum para dizer. A tradução conserva a sequência hebraica 'responderão e dirão', própria de uma proclamação formal.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: a todo homem de Israel
  rationale: A expressão usa o singular masculino אִישׁ, 'homem', com força representativa. A tradução preserva essa forma, enquanto a nota apresenta a alternativa idiomática.
- source_word: קוֹל רָם
  choice: em alta voz
  rationale: A expressão hebraica indica uma proclamação pública e claramente audível. 'Em alta voz' é natural, solene e fiel em português.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ
  choice: a todo homem de Israel
  alternative: a todo israelita
  rationale: O texto hebraico emprega o substantivo masculino singular אִישׁ com alcance coletivo ou representativo. A tradução principal preserva a forma explícita, sem negar que a proclamação se dirige representativamente à assembleia da aliança.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva-se a fórmula formal 'responderão e dirão' e a ordem foi ajustada levemente para que 'em alta voz' se ligue de modo natural aos verbos de fala.
