  text: אָר֗וּר שֹׁכֵב֙ עִם אֵ֣שֶׁת אָבִ֔י/ו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑י/ו וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: pt
  text: 'Maldito aquele que se deitar com a mulher de seu pai[a], pois descobriu a cobertura de seu pai[b]. E todo o povo dirá: “Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “mulher de seu pai” pode referir-se, neste contexto, à madrasta, mas o hebraico não usa esse termo de modo explícito.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa literalmente um termo que pode significar “asa”, “extremidade” ou “aba” de uma veste. Aqui é um eufemismo sexual relacionado à linguagem de Levítico 18:8 e 20:11; também pode ser entendido como “expôs a nudez de seu pai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Mantém a fórmula de maldição da aliança em linguagem clara, solene e corrente.
- source_word: שֹׁכֵב עִם
  choice: aquele que se deitar com
  rationale: Reproduz o eufemismo hebraico para relação sexual e se ajusta ao registro jurídico do contexto.
- source_word: אֵשֶׁת אָבִיו
  choice: a mulher de seu pai
  rationale: Traduz diretamente a construção hebraica sem especificar que se trata da madrasta, embora o contexto possa sugeri-lo.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, em registro solene, a razão da maldição.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: descobriu a aba da veste de seu pai
  rationale: Preserva a imagem concreta de כָּנָף, literalmente a extremidade ou aba de uma veste, bem como seu emprego eufemístico sexual neste contexto.
- source_word: וְאָמַר כָּל הָעָם
  choice: E todo o povo dirá
  rationale: Conserva a fórmula coletiva e litúrgica, com o futuro português expressando a resposta prescrita.
- source_word: אָמֵן
  choice: Amém
  rationale: Mantém a forma litúrgica tradicional, natural e amplamente compreendida em português.
theological_decisions:
- issue: Tratamento do eufemismo sexual גִלָּה כְּנַף אָבִיו
  choice: Preservar no texto a imagem de descobrir a aba da veste do pai.
  alternative: Traduzir como “expôs a nudez de seu pai” ou parafrasear como violação do leito conjugal do pai.
  rationale: A expressão evoca as proibições sexuais da Torá e a honra ou os direitos conjugais do pai. A tradução concreta preserva a tensão metafórica sem converter uma interpretação possível no próprio texto; a nota registra a força eufemística.
- issue: Identidade da mulher de seu pai
  choice: Não explicitar “madrasta” no texto.
  alternative: Traduzir “sua madrasta”.
  rationale: Embora muitas vezes se trate da madrasta, o hebraico diz literalmente “mulher de seu pai”; preservar essa forma evita restringir indevidamente a referência.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sintaxe conserva o caráter jurídico-litúrgico da maldição, enquanto as notas esclarecem, sem resolver no texto, a ambiguidade da relação familiar e do eufemismo hebraico.
