  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: pt
  text: 'Maldito o homem[a] que fizer uma imagem esculpida ou uma imagem fundida[b] — uma abominação para Yahweh, obra das mãos de um artesão — e a colocar em segredo. E todo o povo responderá: “Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “o homem”; aqui, o masculino singular funciona como fórmula legal representativa, abrangendo qualquer pessoa.
    reason: lexical_alternative
  - marker: b
    text: Ou “imagem de metal fundido”. O termo hebraico designa uma imagem feita por fundição, geralmente em metal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Preserva a fórmula jurídica e pactual de maldição em linguagem portuguesa clara e solene.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Reproduz o masculino singular do hebraico, que funciona aqui como fórmula legal representativa; uma nota esclarece seu alcance genérico.
- source_word: יַעֲשֶׂה
  choice: fizer
  rationale: No contexto da produção de imagens, é a forma portuguesa mais natural e concreta de traduzir o verbo.
- source_word: פֶסֶל
  choice: uma imagem esculpida
  rationale: Expressa especificamente uma imagem produzida por entalhe ou escultura, sem recorrer ao termo mais amplo “ídolo”.
- source_word: מַסֵּכָה
  choice: uma imagem fundida
  rationale: Mantém a referência ao processo de fundição sem acrescentar “metal” ao texto principal, embora esse fosse o material usual.
- source_word: תּוֹעֲבַת יְהוָה
  choice: abominação para Yahweh
  rationale: Conserva a força moral e pactual do hebraico e apresenta a expressão como aquilo que é repugnante a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: obra das mãos de um artesão
  rationale: Preserva a ênfase na fabricação humana e emprega vocabulário corrente e digno.
- source_word: וְשָׂם בַּסָּתֶר
  choice: e a colocar em segredo
  rationale: Traduz a colocação da imagem e o caráter oculto do ato sem ampliar o sentido para uma instalação pública.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ אָמֵן
  choice: 'E todo o povo responderá: “Amém.”'
  rationale: Reproduz de modo natural a resposta coletiva e litúrgica; os dois verbos hebraicos formam uma fórmula de resposta, adequadamente condensada em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pactual em vez de substituí-lo por um título. “Yahweh” também evita escolher uma forma portuguesa confessionalmente tradicional.
- issue: Masculino singular na fórmula de maldição
  choice: o homem
  alternative: a pessoa; quem
  rationale: A tradução mantém a forma masculina do hebraico, enquanto a nota esclarece que ela tem função representativa e não restringe a proibição aos homens.
- issue: Natureza da imagem מַסֵּכָה
  choice: imagem fundida
  alternative: imagem de metal fundido; ídolo fundido
  rationale: “Fundida” preserva o método de fabricação explicitado pelo termo sem inserir no texto principal o material, que está implícito pelo uso habitual, mas não é declarado lexicalmente.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem da sentença e os travessões preservam a estrutura enfática da fórmula de maldição, enquanto “responderá” mantém o caráter litúrgico-jurídico da resposta coletiva.
