  text: אָר֕וּר שֹׁכֵ֖ב עִם חֹֽתַנְתּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: pt
  text: 'Maldito aquele que se deita com a sua sogra.[a] E todo o povo dirá: “Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “tem relações sexuais com a sua sogra”. O hebraico usa a expressão idiomática “deitar-se com”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Adjetivo predicativo que introduz uma fórmula de maldição da aliança. “Maldito” é claro, corrente e adequado ao contexto jurídico-litúrgico.
- source_word: שֹׁכֵב עִם
  choice: se deita com
  rationale: A expressão hebraica é um eufemismo convencional para relações sexuais. “Deita-se com” preserva a imagem e o tom eufemístico do original sem ocultar seu sentido no contexto.
- source_word: חֹתַנְתּוֹ
  choice: a sua sogra
  rationale: O substantivo חֹתֶנֶת significa “sogra”, e o sufixo indica posse na terceira pessoa do masculino singular.
- source_word: וְאָמַר
  choice: E ... dirá
  rationale: A conjunção seguida do perfeito dá continuidade à fórmula litúrgica e tem aqui força prescritiva ou performativa; o futuro em português a expressa naturalmente.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Tradução direta da expressão hebraica, sem acrescentar “de Israel”, que está implícito no contexto, mas não aparece no versículo.
- source_word: אָמֵן
  choice: Amém
  rationale: Mantém a resposta litúrgica hebraica em sua forma consagrada e amplamente compreendida em português.
theological_decisions:
- issue: Eufemismo sexual na fórmula jurídica
  choice: “se deita com”
  alternative: “tem relações sexuais com”
  rationale: Preserva o eufemismo reconhecível do hebraico e a sobriedade do texto legal, enquanto a nota esclarece explicitamente o sentido.
- issue: Sujeito masculino singular
  choice: “aquele que”
  alternative: “quem” ou “qualquer pessoa que”
  rationale: A forma conserva o referente masculino singular do particípio hebraico sem recorrer a uma formulação artificial ou excessivamente neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da fórmula de maldição foi preservada, e o marcador da nota foi colocado junto à expressão que ele esclarece.
