base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: pt
  text: E, no dia em que vocês atravessarem o Jordão para entrar na terra que Javé, seu Deus, está dando a vocês, ergam grandes pedras e revistam-nas de cal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “revistam-nas de reboco”; o termo hebraico designa cal ou reboco usado como revestimento.'
    reason: Alternativa lexical para שִׂיד, cujo sentido abrange a cal e o material de reboco produzido com ela.
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם
  choice: E, no dia em que
  rationale: A expressão hebraica introduz uma circunstância futura. Esta formulação conserva o valor temporal sem reproduzir literalmente o idiomatismo com uma construção pouco natural em português.
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: vocês atravessarem o Jordão
  rationale: O verbo עבר indica passar de uma margem para a outra; “atravessar o Jordão” é claro e idiomático. O plural de תַּעַבְרוּ é expresso por “vocês”.
- source_word: אֶל הָאָרֶץ
  choice: para entrar na terra
  rationale: A preposição אֶל indica movimento em direção à terra. A explicitação de “entrar” torna natural em português a relação entre atravessar o rio e chegar à terra, sem acrescentar uma ideia estranha ao contexto.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título; “Javé” é a forma corrente e legível em português.
- source_word: נֹתֵן לָךְ
  choice: está dando a vocês
  rationale: O particípio apresenta a dádiva como em curso e certa. O plural em português mantém a referência coletiva a Israel de modo natural, apesar da alternância hebraica entre formas plurais e singulares.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: levantem para vocês mesmos
  rationale: No hifil, קום significa levantar ou erigir. “Para vocês mesmos” representa a nuance de interesse próprio de לְךָ, enquanto o plural mantém fluidez na exortação dirigida ao povo.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: grandes pedras
  rationale: Tradução direta e natural do substantivo e do adjetivo, adequada a pedras de grande tamanho.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: e revistam-nas de cal
  rationale: O verbo descreve a aplicação de uma camada sobre as pedras, e שִׂיד designa cal ou material de reboco. “Revestir de cal” evita uma repetição artificial e comunica a ação com precisão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino, não o título אֲדֹנָי. “Javé” preserva essa distinção e é uma transliteração portuguesa amplamente reconhecida.
- issue: Alternância entre destinatário plural e singular coletivo
  choice: Plural natural em toda a frase
  alternative: Reproduzir a mudança como “vocês atravessarem... você levantará para si”
  rationale: O hebraico começa com verbo plural e passa a formas singulares que tratam Israel como unidade coletiva. A oscilação explícita de número seria confusa e pouco natural em português; o plural conserva o mesmo referente comunitário sem impor uma diferença teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para tornar explícito o destinatário coletivo e evita formas arcaicas. A colocação pronominal em “revistam-nas” mantém um tom solene sem comprometer a clareza.
