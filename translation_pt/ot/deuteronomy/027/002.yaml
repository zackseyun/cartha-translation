  source_fidelity: A tradução transmite corretamente a sequência temporal, a travessia do Jordão, a terra dada por Javé, a instalação de pedras grandes e seu revestimento com cal. O plural português é uma normalização aceitável da alternância hebraica entre o plural inicial e os singulares coletivos posteriores. Porém, «para vocês mesmos» dá a לְךָ uma ênfase reflexiva incomum e desnecessária em português; no hebraico, trata-se de dativo de interesse e não exige essa formulação pesada.
  naturalness: «Levantem para vocês mesmos grandes pedras» é pouco idiomático e pode sugerir que as pedras são destinadas à posse pessoal dos destinatários. «Ergam grandes pedras» é mais natural e mantém o sentido de estabelecer/erigir as pedras.
  terminology: «Javé» representa adequadamente o tetragrama em português. «Cal» para שִׂיד é preciso no texto principal; a nota preserva corretamente a alternativa «reboco».
