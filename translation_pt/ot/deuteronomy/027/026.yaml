base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: pt
  text: 'Maldito aquele que não sustenta[a] as palavras desta lei, praticando-as. E todo o povo dirá: “Amém!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “não confirma” ou “não estabelece”. O verbo hebraico pode ter o sentido de manter ou validar a força da lei; aqui, essa ideia está ligada à obediência: “praticando-as”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Reproduz de modo claro e convencional a fórmula de maldição da aliança, sem recorrer ao mais enfático e menos natural “amaldiçoado”.
- source_word: אֲשֶׁר
  choice: aquele que
  rationale: Expressa a referência singular e genérica da oração relativa hebraica, sem restringi-la ao sexo masculino.
- source_word: לֹא יָקִים
  choice: não sustenta
  rationale: O hifil de קום pode significar confirmar, estabelecer ou manter em vigor. “Sustenta” preserva essa ideia sem reduzi-la simplesmente a “cumpre”, pois a frase seguinte explicita a obediência prática.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: as palavras desta lei
  rationale: 'Mantém os dois componentes da expressão hebraica: דְּבָרִים como “palavras” e תּוֹרָה como “lei” no contexto público e pactual de Deuteronômio.'
- source_word: לַעֲשׂוֹת אֹתָם
  choice: praticando-as
  rationale: Comunica que a lei é sustentada por meio de sua realização concreta. “Praticar” é português atual e evita a construção menos natural “fazendo-as”.
- source_word: וְאָמַר כָּל הָעָם
  choice: E todo o povo dirá
  rationale: O perfeito com waw nesta sequência litúrgico-legal prescreve a resposta coletiva; o futuro português transmite adequadamente essa força.
- source_word: אָמֵן
  choice: Amém
  rationale: Preserva a aclamação litúrgica tradicional e amplamente compreendida, em vez de substituí-la por uma paráfrase como “Assim seja”.
theological_decisions:
- issue: Sentido da obrigação da aliança em יָקִים ... לַעֲשׂוֹת אֹתָם
  choice: A maldição recai sobre quem deixa de sustentar a lei mediante a obediência prática.
  alternative: A maldição recai apenas sobre quem deixa de confirmar ou ratificar publicamente a lei; ou, de forma simplificada, sobre quem não a cumpre.
  rationale: A combinação de “sustentar/estabelecer” com “praticando-as” vai além de uma ratificação verbal, mas preserva a distinção entre reconhecer a força da lei e agir de acordo com ela, sem inserir formulações teológicas posteriores.
- issue: Referência genérica de אֲשֶׁר
  choice: aquele que
  alternative: quem; o homem que
  rationale: “Aquele que” conserva o singular representativo do hebraico e funciona genericamente em português, sem tornar a referência exclusivamente masculina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva a cadência solene da maldição pactual e a resposta litúrgica coletiva, sem arcaísmos desnecessários.
