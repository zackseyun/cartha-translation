  text: And on that day Moses commanded the people, saying,
translation:
  language: pt
  text: 'Naquele dia, Moisés ordenou ao povo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה expressa uma ordem ou incumbência com autoridade; “ordenou” preserva essa força e é natural em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico משה em português.
- source_word: אֶת הָעָם
  choice: ao povo
  rationale: עָם designa aqui Israel coletivamente; “o povo” é a correspondência mais direta e natural no contexto.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Reproduz de modo claro e idiomático a indicação temporal formada pela preposição בְּ com “dia” e o demonstrativo.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo לֵאמֹר introduz o conteúdo da ordem nos versículos seguintes. Em português atual, os dois-pontos cumprem naturalmente essa função sem a formulação menos idiomática “dizendo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A estrutura narrativa hebraica foi preservada, enquanto לֵאמֹר foi representado funcionalmente por dois-pontos, pois introduz a fala subsequente.
