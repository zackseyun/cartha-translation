source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ וְ/זִקְנֵ֣י יִשְׂרָאֵ֔ל אֶת הָ/עָ֖ם לֵ/אמֹ֑ר שָׁמֹר֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: pt
  text: 'Então Moisés e os anciãos de Israel ordenaram ao povo: “Cumpram todo o mandamento[a] que hoje lhes ordeno.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mandamento inteiro”; o hebraico emprega o singular, possivelmente em sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenaram
  rationale: O verbo צוה expressa uma ordem com autoridade; “ordenaram” é direto e natural em português, concordando com os sujeitos coordenados Moisés e os anciãos.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: e os anciãos de Israel
  rationale: Mantém Moisés e os anciãos como sujeitos conjuntos do verbo, conforme a coordenação hebraica.
- source_word: הָעָם
  choice: ao povo
  rationale: “Povo” é a tradução transparente de עָם neste contexto nacional e da aliança.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português atual, os dois-pontos introduzem naturalmente o discurso direto e comunicam a função quotativa de לֵאמֹר sem a fórmula mais pesada “dizendo”.
- source_word: שָׁמֹר
  choice: Cumpram
  rationale: No contexto de um mandamento, שׁמר envolve observar e obedecer cuidadosamente. “Cumpram” expressa isso de maneira clara e idiomática; o plural corresponde ao povo como destinatário coletivo.
- source_word: כָּל הַמִּצְוָה
  choice: todo o mandamento
  rationale: Preserva tanto כָּל como o singular הַמִּצְוָה. Em português, “todo o mandamento” pode indicar o mandamento em sua totalidade e também admitir o uso coletivo do singular.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: que ... lhes ordeno
  rationale: A construção mantém a primeira pessoa enfática e o valor presente do particípio, em português natural. “Lhes” retoma o povo como destinatário coletivo.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Tradução moderna e direta do advérbio temporal, preservando sua ênfase contextual.
theological_decisions:
- issue: Número de מִצְוָה na instrução da aliança
  choice: 'singular coletivo: “o mandamento”'
  alternative: 'plural interpretativo: “os mandamentos”'
  rationale: O substantivo hebraico está no singular. Mantê-lo evita eliminar a possível apresentação da instrução da aliança como uma unidade, sem negar que o termo possa ter força coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto é introduzido por dois-pontos, evitando uma reprodução mecânica de לֵאמֹר. A forma “Cumpram” prioriza naturalidade e comunica obediência cuidadosa, enquanto “todo o mandamento” conserva a tensão do singular hebraico.
