  text: אָר֕וּר שֹׁכֵ֖ב עִם כָּל בְּהֵמָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: pt
  text: 'Maldito aquele[a] que se deita com qualquer animal. E todo o povo dirá: “Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem se deita com qualquer animal”. O hebraico emprega uma forma masculina singular.'
    reason: Registra a alternativa genérica em português e esclarece a forma gramatical do texto hebraico.
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Preserva a fórmula solene de maldição pactual e é a expressão corrente e direta em português.
- source_word: שֹׁכֵב
  choice: aquele que se deita
  rationale: O particípio tem sentido sexual neste contexto legal. “Deitar-se com” conserva o eufemismo do hebraico sem tornar a formulação desnecessariamente explícita; “aquele” também reflete a forma masculina singular.
- source_word: עִם
  choice: com
  rationale: Equivalente natural da preposição na expressão portuguesa “deitar-se com”.
- source_word: כָּל בְּהֵמָה
  choice: qualquer animal
  rationale: “Qualquer” comunica bem o valor distributivo de כָּל, enquanto “animal” mantém a abrangência contextual de בְּהֵמָה sem a restrição de “gado” nem o tom antiquado de “besta”.
- source_word: וְאָמַר
  choice: E ... dirá
  rationale: Mantém a ligação com a sequência litúrgica e o valor prescritivo-futuro da resposta coletiva.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Tradução direta e idiomática, sem acrescentar “de Israel”, ausente do texto hebraico.
- source_word: אָמֵן
  choice: Amém
  rationale: Conserva a afirmação litúrgica tradicional, amplamente compreendida em português.
theological_decisions:
- issue: Particípio substantivado masculino singular na fórmula legal de maldição
  choice: aquele que se deita
  alternative: quem se deita
  rationale: “Aquele” preserva a forma masculina singular do hebraico sem acrescentar explicitamente o substantivo “homem”. A nota registra a alternativa genérica natural em português, mantendo visível a ambiguidade quanto ao alcance jurídico da formulação.
translation_notes:
  register: Português moderno, claro e solene, com cadência apropriada a uma fórmula pública de maldição e resposta litúrgica. O eufemismo sexual do original foi preservado.
