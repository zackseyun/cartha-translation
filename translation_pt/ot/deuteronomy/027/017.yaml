  text: אָר֕וּר מַסִּ֖יג גְּב֣וּל רֵעֵ֑/הוּ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: pt
  text: '“Maldito aquele que deslocar o marco de divisa do seu próximo.[a]” E todo o povo dirá: “Amém!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o limite”. O termo hebraico pode se referir à divisa de uma propriedade ou ao marco que a assinala.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Preserva a fórmula solene de maldição pactual e sua força jurídica em português claro e corrente.
- source_word: מַסִּיג
  choice: aquele que deslocar
  rationale: O particípio caracteriza quem pratica o ato. “Deslocar” comunica a mudança fraudulenta da demarcação, sem restringir o sentido à remoção completa.
- source_word: גְּבוּל
  choice: marco de divisa
  rationale: Neste contexto de propriedade, o termo pode indicar tanto o limite quanto aquilo que o demarca. “Marco de divisa” torna concreta e compreensível a prática condenada.
- source_word: רֵעֵהוּ
  choice: do seu próximo
  rationale: O termo designa outro membro da comunidade em contexto interpessoal e jurídico. “Próximo” conserva esse sentido e o sufixo possessivo hebraico.
- source_word: וְאָמַר
  choice: E ... dirá
  rationale: Dá continuidade à fórmula litúrgico-jurídica pela qual o povo ratifica publicamente a maldição.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Traduz diretamente a expressão hebraica sem acrescentar “de Israel”, embora isso esteja implícito no contexto.
- source_word: אָמֵן
  choice: Amém
  rationale: É a resposta litúrgica tradicional e ainda plenamente compreensível, preservando a afirmação comunitária do hebraico.
theological_decisions:
- issue: A fórmula de maldição no contexto jurídico da aliança
  choice: Maldito aquele que deslocar o marco de divisa do seu próximo
  alternative: Maldito aquele que remover o limite do seu próximo
  rationale: A redação mantém a gravidade da maldição contra a apropriação fraudulenta de terra, sem limitar a infração à retirada completa do marco.
- issue: Gênero e valor representativo do particípio
  choice: aquele que deslocar
  alternative: quem deslocar
  rationale: “Aquele que” conserva naturalmente em português o caso jurídico individual e representativo expresso pelo particípio masculino singular, sem transformar a frase em uma generalização plural.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fala da maldição foi colocada entre aspas, seguida pela resposta comunitária. O marcador da nota foi posicionado junto a “marco de divisa”, expressão a que a nota lexical se refere.
