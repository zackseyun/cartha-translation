base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: pt
  text: '“Maldito aquele que desvia um cego do caminho.” E todo o povo dirá: “Amém.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Preserva a fórmula declarativa de maldição da aliança de maneira direta, solene e corrente em português.
- source_word: מַשְׁגֶּה
  choice: aquele que desviar
  rationale: O particípio hifil expressa a ação causativa de fazer alguém se extraviar; “desviar” comunica esse sentido com naturalidade sem determinar se o ato ocorre por orientação enganosa ou condução direta.
- source_word: עִוֵּר
  choice: um cego
  rationale: O adjetivo substantivado está no masculino singular e designa um indivíduo; esta forma reproduz o dado gramatical e se ajusta ao estilo jurídico do contexto.
- source_word: בַּדָּרֶךְ
  choice: do caminho
  rationale: Com “desviar”, a construção idiomática portuguesa “desviar alguém do caminho” expressa adequadamente o cenário concreto de fazer um cego perder o rumo.
- source_word: וְאָמַר
  choice: E ... dirá
  rationale: No encadeamento litúrgico e legal, a forma verbal prescreve a resposta comunitária; o futuro português transmite essa função.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: Traduz integralmente a expressão hebraica sem acrescentar uma identificação não explícita neste versículo.
- source_word: אָמֵן
  choice: Amém
  rationale: Mantém a resposta litúrgica tradicional e o sentido de confirmação solene.
theological_decisions:
- issue: Forma da declaração de maldição
  choice: Maldito aquele que...
  alternative: Que seja maldito aquele que...
  rationale: O hebraico apresenta uma fórmula declarativa de maldição da aliança, não explicitamente um desejo ou pedido; a formulação nominal preserva essa força.
- issue: Representação do masculino singular עִוֵּר
  choice: um cego
  alternative: uma pessoa cega
  rationale: A escolha preserva o masculino singular do texto hebraico no caso jurídico individual, sem transformar o referente numa classe abstrata.
- issue: Natureza do desvio
  choice: desviar um cego do caminho
  alternative: induzir um cego a errar o caminho
  rationale: A formulação conserva a ação causativa e o cenário espacial, sem restringir indevidamente o ato a engano verbal ou condução física.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem foi ajustada ao uso natural do português, mantendo a concisão e o caráter litúrgico-jurídico do hebraico.
