  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: pt
  text: Escreva nelas todas as palavras desta lei[a] quando você atravessar, para que entre na terra que Yahweh, seu Deus, está lhe dando — terra que mana leite e mel —, conforme Yahweh, o Deus de seus pais[b], lhe falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desta instrução”. O termo hebraico torá pode significar tanto “instrução” quanto “lei”; aqui, “lei” se ajusta ao contexto da aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou “de seus antepassados”. O hebraico diz literalmente “de seus pais”, preservando a fórmula da aliança usada ao longo de Deuteronômio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Escreva
  rationale: O perfeito qal com conjunção, neste contexto instrutivo, tem força de ordem. O imperativo comunica isso de modo natural e digno em português.
- source_word: עֲלֵיהֶן
  choice: nelas
  rationale: Retoma as pedras mencionadas no versículo anterior e expressa de forma idiomática a escrita sobre elas.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: todas as palavras desta lei
  rationale: Mantém דִּבְרֵי como “palavras” e traduz תּוֹרָה por “lei”, adequado ao contexto pactual e jurídico, sem ocultar em nota a alternativa “instrução”.
- source_word: בְּעָבְרֶךָ
  choice: quando você atravessar
  rationale: A preposição com o infinitivo construto tem valor temporal. “Atravessar” preserva a referência contextual à travessia do Jordão sem acrescentar o nome do rio ao texto.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: para que entre
  rationale: Conserva a relação de propósito ou resultado expressa no hebraico, sem resolver a possível tensão lógica entre escrever nas pedras e entrar na terra.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Reproduz o nome divino e a relação pactual de maneira clara em português.
- source_word: נֹתֵן לְךָ
  choice: está lhe dando
  rationale: O particípio apresenta a dádiva como em curso, iminente ou certa; a locução progressiva preserva esse aspecto.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: terra que mana leite e mel
  rationale: Preserva a imagem tradicional de abundância com formulação corrente e elevada em português bíblico.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: conforme ... lhe falou
  rationale: Traduz o verbo como “falou”, sem explicitar “prometeu”, embora a ideia de promessa esteja presente no contexto.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: o Deus de seus pais
  rationale: Preserva o masculino plural do hebraico e a fórmula pactual recorrente em Deuteronômio.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de תּוֹרָה
  choice: lei
  alternative: instrução
  rationale: “Lei” se ajusta ao contexto pactual e jurídico, enquanto a nota preserva a amplitude lexical do termo hebraico.
- issue: Tradução de אֲבֹתֶיךָ
  choice: seus pais
  alternative: seus antepassados
  rationale: “Pais” mantém tanto a forma masculina do original quanto a fórmula de continuidade pactual, sem negar que o referente possa abranger os antepassados.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperativo “Escreva” soa natural no contexto de instrução; “mana leite e mel” conserva a imagem bíblica tradicional. O marcador [a] foi colocado após “lei”, termo ao qual a nota lexical efetivamente se refere.
