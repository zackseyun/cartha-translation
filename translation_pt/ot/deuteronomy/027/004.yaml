base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: pt
  text: Quando vocês atravessarem o Jordão[a], ergam estas pedras que hoje ordeno a vocês no monte Ebal e cubram-nas com cal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas tradições textuais, especialmente o Pentateuco Samaritano, trazem “monte Gerizim” em vez de “monte Ebal”.
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: Quando vocês atravessarem
  rationale: A construção com וְהָיָה e o infinitivo בְּעָבְרְכֶם introduz naturalmente uma circunstância futura. A oração temporal com futuro do subjuntivo é idiomática em português.
- source_word: הַיַּרְדֵּן
  choice: o Jordão
  rationale: O nome próprio designa o rio; em português, a forma breve é clara e tradicional sem acrescentar uma palavra ausente do hebraico.
- source_word: תָּקִימוּ
  choice: levantem
  rationale: O hifil de קום indica erguer ou instalar as pedras. “Levantem” é natural, direto e preserva a ação física.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: estas pedras
  rationale: Tradução direta do substantivo com demonstrativo, sem interpretar as pedras como monumentos.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: que hoje ordeno a vocês
  rationale: Preserva o valor presente do particípio מְצַוֶּה, a ênfase de אָנֹכִי e a referência temporal הַיּוֹם em português corrente.
- source_word: בְּהַר עֵיבָל
  choice: no monte Ebal
  rationale: A preposição ב com o nome do monte é expressa naturalmente por “no”; Ebal translitera o nome hebraico.
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: e revistam-nas com cal
  rationale: שׂוד descreve cobrir ou rebocar, e שׂיד indica cal ou material à base de cal. “Revestir com cal” comunica o procedimento sem a repetição pouco natural de “rebocar com reboco”.
theological_decisions:
- issue: Nome do local em Deuteronômio 27:4
  choice: monte Ebal
  alternative: monte Gerizim
  rationale: O texto massorético da WLC fornecido traz Ebal. A variante Gerizim, conhecida sobretudo no Pentateuco Samaritano, é registrada em nota sem substituir a leitura da fonte principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para o plural hebraico. O imperativo “levantem” expressa naturalmente a força injuntiva das formas verbais no contexto. A nota conserva uma variante textual relevante sem resolver a divergência no corpo do versículo.
