  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: pt
  text: 'Estes ficarão no monte Gerizim para abençoar o povo, quando vocês atravessarem o Jordão: Simeão, Levi, Judá, Issacar, José[a] e Benjamim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nesta lista tribal, José representa as tribos descendentes dele, Efraim e Manassés.
    reason: Referência cruzada e esclarecimento da composição tribal.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes
  rationale: O demonstrativo plural introduz as tribos que serão especificadas; “Estes” é direto e natural.
- source_word: יַעַמְדוּ
  choice: ficarão
  rationale: O imperfeito qal, no contexto das instruções de Moisés, indica a posição que essas tribos deverão ocupar. “Ficarão” preserva o sentido sem a rigidez pouco natural de “estarão de pé”.
- source_word: לְבָרֵךְ
  choice: para abençoar
  rationale: O infinitivo construto com ל expressa propósito.
- source_word: הָעָם
  choice: o povo
  rationale: Refere-se coletivamente à comunidade de Israel.
- source_word: עַל הַר גְּרִזִים
  choice: no monte Gerizim
  rationale: Forma idiomática em português para indicar a localização sobre o monte, com transliteração consagrada do topônimo.
- source_word: בְּעָבְרְכֶם
  choice: quando vocês atravessarem
  rationale: A preposição ב com infinitivo construto e sufixo tem valor temporal. “Vocês” torna explícita a segunda pessoa do plural, e o futuro do subjuntivo é natural em português.
- source_word: אֶת הַיַּרְדֵּן
  choice: o Jordão
  rationale: A forma tradicional e natural em português dispensa a explicitação de “rio”.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma portuguesa consagrada do nome.
- source_word: לֵוִי
  choice: Levi
  rationale: Forma portuguesa consagrada do nome.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa consagrada do nome.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forma portuguesa consagrada e amplamente reconhecida do nome.
- source_word: יוֹסֵף
  choice: José
  rationale: Mantém o nome expresso no hebraico, sem substituí-lo por Efraim e Manassés.
- source_word: בִנְיָמִן
  choice: Benjamim
  rationale: Forma portuguesa consagrada do nome.
theological_decisions:
- issue: Força da instrução sobre a posição e a função das tribos
  choice: “Estes ficarão [...] para abençoar”
  alternative: “Estes deverão ficar [...] para abençoar”
  rationale: O contexto é prescritivo, mas o imperfeito hebraico permite uma formulação futura dentro das instruções. “Ficarão” soa natural e não elimina a força diretiva do contexto.
- issue: Sentido de José na lista tribal
  choice: Manter “José” no texto principal
  alternative: “as tribos de José” ou “Efraim e Manassés”
  rationale: O hebraico nomeia explicitamente José. A função representativa do nome pode ser explicada em nota sem ampliar o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção usa “vocês” para explicitar naturalmente a segunda pessoa do plural e mantém os nomes bíblicos em suas formas portuguesas tradicionais.
