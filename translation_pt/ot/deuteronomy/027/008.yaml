  text: וְ/כָתַבְתָּ֣ עַל הָ/אֲבָנִ֗ים אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בַּאֵ֥ר הֵיטֵֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: pt
  text: E você escreverá nas pedras todas as palavras desta lei, com toda a clareza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de modo bem claro” ou “de modo que fiquem claras”. A expressão hebraica combina um verbo que significa “tornar claro” ou “explicar” com um termo intensificador.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: E você escreverá
  rationale: O perfeito qal na segunda pessoa masculina singular, ligado pela conjunção, integra a sequência de instruções e tem força injuntiva; o futuro preserva a forma solene e natural do mandamento em português.
- source_word: עַל הָאֲבָנִים
  choice: nas pedras
  rationale: A preposição עַל indica a superfície em que se escreve. Em português, “escrever nas pedras” é mais idiomático que “sobre as pedras”, mantendo a referência às pedras já mencionadas.
- source_word: אֵת כָּל דִּבְרֵי
  choice: todas as palavras
  rationale: Reproduz diretamente כָּל דִּבְרֵי e preserva a textura verbal do hebraico sem ampliar o sentido para “assuntos” ou “determinações”.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: desta lei
  rationale: No contexto pactual e legislativo de Deuteronômio, “lei” é o equivalente corrente e adequado de תּוֹרָה; “desta” conserva o demonstrativo.
- source_word: בַּאֵר הֵיטֵב
  choice: com toda a clareza
  rationale: בַּאֵר comunica tornar claro ou explicar, e הֵיטֵב intensifica essa ideia. A expressão portuguesa transmite o modo exigido para a inscrição sem restringir indevidamente a clareza apenas à legibilidade física.
