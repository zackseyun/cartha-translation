  text: אָר֕וּר מַקְלֶ֥ה אָבִ֖י/ו וְ/אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: pt
  text: 'Maldito aquele que desonrar[a] seu pai ou sua mãe. E todo o povo dirá: “Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tratar com desprezo”, “tratar como sem importância” ou “menosprezar”. O verbo hebraico transmite a ideia de considerar alguém insignificante ou desprezível.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Maldito
  rationale: Reproduz de modo claro e tradicional a fórmula de maldição da aliança expressa pelo particípio passivo hebraico.
- source_word: מַקְלֶה
  choice: desonrar
  rationale: O verbo hebraico קלה, nesta forma, descreve tratar alguém como sem importância, desprezível ou indigno de honra. “Desonrar” comunica de modo natural a força social e ética do termo sem limitá-lo a um sentimento interior ou a um único ato verbal.
- source_word: אָבִיו וְאִמּוֹ
  choice: seu pai ou sua mãe
  rationale: 'Embora a conjunção hebraica seja formalmente “e”, “ou” expressa em português o alcance distributivo da fórmula: a maldição se aplica a quem desonra qualquer um dos pais.'
- source_word: וְאָמַר כָּל הָעָם
  choice: E todo o povo dirá
  rationale: Mantém a coordenação e a sequência litúrgica do hebraico, bem como o caráter solene da resposta coletiva.
- source_word: אָמֵן
  choice: Amém
  rationale: Preserva a aclamação litúrgica tradicional e sua função de confirmação solene.
theological_decisions:
- issue: Natureza da ofensa contra os pais
  choice: desonrar
  alternative: tratar com desprezo; tratar como sem importância
  rationale: A tradução apresenta a ofensa como negação de honra e tratamento desdenhoso, não apenas como antipatia emocional nem exclusivamente como maldição verbal. Assim, conserva a amplitude ética do verbo hebraico e sua relação natural com o dever de honrar os pais.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A formulação preserva o caráter jurídico-litúrgico do versículo sem arcaísmos desnecessários.
