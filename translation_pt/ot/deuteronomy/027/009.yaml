base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: pt
  text: 'Então Moisés e os sacerdotes levitas falaram a todo o Israel, dizendo: “Israel, fique em silêncio[a] e escute: hoje você se tornou um povo de Yahweh, seu Deus[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Preste atenção”. O imperativo hebraico pode enfatizar tanto o silêncio como a atenção concentrada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um povo pertencente a Yahweh, seu Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falaram
  rationale: O waw consecutivo faz a narrativa avançar. “Então” produz uma transição natural em português, e o plural “falaram” concorda de modo idiomático com o sujeito composto Moisés e os sacerdotes.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  rationale: A expressão identifica os sacerdotes como levitas. Esta formulação é clara, tradicional e natural em português.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Preserva a referência coletiva à totalidade do povo e corresponde ao uso bíblico corrente em português.
- source_word: הַסְכֵּת
  choice: Fique em silêncio
  rationale: O imperativo raro provavelmente pede silêncio atento. A formulação conserva sua força concreta, enquanto a nota registra a possível ênfase na atenção.
- source_word: וּשְׁמַע
  choice: e escute
  rationale: “Escute” expressa com clareza a força imperativa de שמע no português contemporâneo e sugere recepção atenta.
- source_word: הַיּוֹם הַזֶּה
  choice: Hoje
  rationale: Equivalente natural e completo da expressão dêitica hebraica, sem a rigidez de “neste dia”.
- source_word: נִהְיֵיתָ לְעָם
  choice: você se tornou um povo
  rationale: O singular “você” preserva a interpelação corporativa de Israel na segunda pessoa singular; “um povo” mantém a indefinição da construção hebraica.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל com היה pode expressar relação, destinação ou pertencimento. “Para Yahweh” conserva a concisão e parte dessa abertura sem explicitar demais; a nota registra o sentido de pertencimento.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Tradução direta do substantivo com sufixo de segunda pessoa masculina singular, em consonância com a interpelação corporativa de Israel.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” representa o nome pactual como nome próprio, sem substituí-lo por um título.
- issue: Israel interpelado na segunda pessoa singular
  choice: você se tornou um povo
  alternative: vocês se tornaram um povo; Israel se tornou um povo
  rationale: As formas hebraicas são singulares e tratam Israel coletivamente como uma unidade pactual. O singular foi mantido para preservar essa retórica.
- issue: Sentido pactual de לַיהוָה
  choice: um povo para Yahweh
  alternative: um povo pertencente a Yahweh
  rationale: A tradução principal preserva a construção relacional concisa do hebraico; a alternativa explicita o pertencimento pactual possível, mas é mais interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Emprega “você” no singular para tornar visível a interpelação corporativa singular do hebraico. Os marcadores foram colocados junto às expressões que explicam.
