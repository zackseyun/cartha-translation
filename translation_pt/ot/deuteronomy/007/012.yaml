source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: pt
  text: E, como consequência de vocês ouvirem estes juízos[a], os guardarem e os cumprirem, Yahweh, seu Deus, guardará para vocês a aliança e o amor leal[b] que jurou aos seus pais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estas ordenanças” ou “estas normas”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico ḥésed designa amor fiel, constante e ligado à aliança; também pode ser traduzido por “amor constante” ou “fidelidade à aliança”.
    reason: lexical_alternative
  - marker: c
    text: Ou “aos seus antepassados”; o hebraico diz literalmente “aos seus pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: E acontecerá que, porque
  rationale: Preserva tanto a fórmula introdutória וְהָיָה quanto a relação causal ou consequencial expressa por עֵקֶב, sem tornar a frase excessivamente rígida.
- source_word: תִּשְׁמְעוּן
  choice: vocês ouvirem
  rationale: שׁמע inclui a ideia de ouvir com resposta obediente; “ouvirem” mantém a imagem auditiva, enquanto os verbos seguintes explicitam a obediência.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: estes juízos
  rationale: “Juízos” conserva a natureza jurídica de מִשְׁפָּטִים e evita confundi-lo com outros termos legais de Deuteronômio.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: os guardarem e os cumprirem
  rationale: Mantém os dois verbos hebraicos. “Cumprir” comunica naturalmente, em português, a execução concreta das determinações.
- source_word: וְשָׁמַר
  choice: guardará
  rationale: Repete “guardar”, preservando a correspondência verbal entre Israel guardar os juízos e Yahweh guardar a aliança e o amor leal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Expressa naturalmente a relação possessiva e pactual do hebraico; o referente coletivo é vertido por “vocês” no contexto.
- source_word: לְךָ
  choice: para vocês
  rationale: Apresenta Israel como beneficiário da ação de Yahweh e harmoniza a forma portuguesa com o destinatário coletivo.
- source_word: הַבְּרִית
  choice: a aliança
  rationale: Equivalente português estabelecido para o termo pactual central בְּרִית.
- source_word: הַחֶסֶד
  choice: o amor leal
  rationale: Expressa simultaneamente o caráter relacional e a constância fiel de חֶסֶד sem reduzi-lo apenas a sentimento, misericórdia ou obrigação jurídica.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: que jurou
  rationale: Traduz de modo conciso o ato de assumir compromisso mediante juramento.
- source_word: לַאֲבֹתֶיךָ
  choice: aos seus pais
  rationale: Mantém a referência masculina explícita do hebraico aos pais ou antepassados patriarcais.
theological_decisions:
- issue: Sentido de חֶסֶד no contexto da aliança
  choice: o amor leal
  alternative: a fidelidade à aliança; o amor constante; a misericórdia
  rationale: “Amor leal” preserva a tensão entre afeição graciosa, lealdade e compromisso pactual, sem restringir o termo a uma única dimensão.
- issue: Relação entre a obediência de Israel e a ação de Yahweh
  choice: Preservar a construção causal e a repetição de “guardar”
  alternative: Parafrasear como uma promessa geral de recompensa
  rationale: O texto relaciona a escuta obediente de Israel à manutenção, por Yahweh, da aliança e do amor leal. A tradução mantém essa formulação sem elaborar um sistema teológico além do versículo.
- issue: Referência masculina em לַאֲבֹתֶיךָ
  choice: aos seus pais
  alternative: aos seus antepassados
  rationale: A forma masculina do original é preservada no texto, enquanto a nota informa a alternativa portuguesa mais abrangente.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o destinatário coletivo. A construção “E acontecerá que” conserva a solenidade narrativa e pactual, enquanto “porque” explicita a ligação causal. Mantiveram-se os dois usos de “guardar” para reproduzir a correspondência lexical do hebraico.
