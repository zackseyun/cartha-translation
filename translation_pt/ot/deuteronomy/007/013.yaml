base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: pt
  text: Ele amará você, o abençoará e fará você se multiplicar. Abençoará o fruto do seu ventre e o fruto da sua terra — seus cereais, seu vinho novo e seu azeite, as crias do seu gado e as crias do seu rebanho — na terra que jurou aos seus pais[a] dar a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus antepassados”. O hebraico diz literalmente “aos seus pais”.
    reason: Alternativa lexical para esclarecer o alcance possível do termo hebraico sem substituir sua forma explícita no texto principal.
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: Ele amará você
  rationale: O contexto projeta a sequência de bênçãos da aliança para o futuro; “amar” preserva diretamente a afeição pactual expressa pelo verbo.
- source_word: וּבֵרַכְךָ
  choice: o abençoará
  rationale: “Abençoar” é a equivalência corrente e direta de ברך; o pronome mantém o objeto singular.
- source_word: וְהִרְבֶּךָ
  choice: fará você se multiplicar
  rationale: Expressa o sentido causativo do hifil e a ideia de crescimento populacional, evitando o pouco natural “multiplicará você”.
- source_word: פְּרִי בִטְנְךָ
  choice: o fruto do seu ventre
  rationale: Conserva a metáfora concreta repetida com “fruto” e sua referência à descendência.
- source_word: פְּרִי אַדְמָתֶךָ
  choice: o fruto da sua terra
  rationale: Mantém a repetição lexical de פְּרִי e traduz אֲדָמָה naturalmente no contexto agrícola.
- source_word: דְּגָנְךָ
  choice: seus cereais
  rationale: Designa de modo claro e atual a produção de grãos, sem a ambiguidade regional de “milho”.
- source_word: תִירֹשְׁךָ
  choice: seu vinho novo
  rationale: Preserva a distinção tradicional de תירוש como vinho recém-produzido ou produto fresco da vindima.
- source_word: יִצְהָרֶךָ
  choice: seu azeite
  rationale: No contexto agrícola israelita, o termo designa tipicamente azeite de oliva; “azeite” é mais preciso e natural em português do que “óleo”.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: as crias do seu gado
  rationale: Comunica o aumento produzido pelos bovinos ou animais de criação em linguagem portuguesa natural.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: os filhotes dos seus rebanhos
  rationale: A expressão incomum é entendida nesta colocação como a prole dos animais de pequeno porte; a tradução evita tratá-la indevidamente como nome próprio.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: Localiza as bênçãos no território prometido, que é o sentido contextual da expressão.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: que jurou aos seus pais dar a você
  rationale: Mantém a fórmula do juramento, o masculino plural explícito de אָבוֹת e o destinatário singular.
theological_decisions:
- issue: Tradução de לַאֲבֹתֶיךָ
  choice: aos seus pais
  alternative: aos seus antepassados
  rationale: O hebraico emprega o plural masculino “pais”. A tradução principal conserva essa forma e a nota registra a alternativa abrangente sem neutralizar silenciosamente o texto.
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento por “você” para ampla legibilidade brasileira. A repetição de “fruto” e a metáfora do ventre foram preservadas; termos agrícolas foram vertidos de modo atual e concreto.
