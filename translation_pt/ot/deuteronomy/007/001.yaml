  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: pt
  text: Quando Yahweh, seu Deus, levar você para a terra em que está entrando a fim de tomar posse dela e expulsar de diante de você muitas nações[a] — os hititas, os girgaseus, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus —, sete nações maiores e mais fortes que você[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desalojar de diante de você muitas nações”.'
    reason: Alternativa lexical para וְנָשַׁל, que pode enfatizar a expulsão ou a perda da posse da terra.
  - marker: b
    text: 'Ou: “mais numerosas e mais poderosas que você”.'
    reason: Alternativa que explicita os possíveis sentidos quantitativo de רַב e intensivo de עָצוּם.
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto, a conjunção introduz a circunstância temporal das ordens que vêm a seguir, e não uma causa ou hipótese.
- source_word: יְבִיאֲךָ
  choice: levar você para
  rationale: O hiphil de בוא expressa a ação causativa de fazer entrar ou conduzir alguém a um destino; esta formulação é natural em português e preserva esse sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a relação de posse no singular e a identificação pactual presente no hebraico.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: É a tradução corrente e contextualmente adequada para o território prometido em Deuteronômio.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: em que está entrando
  rationale: Expressa naturalmente a entrada iminente de Israel, sem reproduzir de modo artificial o advérbio hebraico שָׁמָּה.
- source_word: לְרִשְׁתָּהּ
  choice: a fim de tomar posse dela
  rationale: ירשׁ neste contexto envolve apropriação efetiva da terra; “tomar posse” conserva melhor esse aspecto ativo do que apenas “herdar”.
- source_word: וְנָשַׁל
  choice: expulsar
  rationale: O verbo descreve a remoção ou desapropriação dos povos da terra. “Expulsar” é claro e natural, enquanto a nota registra uma alternativa lexical.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: Refere-se aos diversos grupos étnico-políticos que habitavam Canaã; “nações” mantém a formulação tradicional e adequada ao contexto.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: Conserva a imagem espacial do idioma hebraico e comunica que os povos seriam removidos da presença e do avanço de Israel.
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: os hititas, os girgaseus, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus
  rationale: Emprega as formas portuguesas correntes dos gentílicos, tratando cada singular coletivo hebraico como o nome plural de um povo.
- source_word: שִׁבְעָה גוֹיִם
  choice: sete nações
  rationale: Mantém a aposição resumitiva da lista e a coerência com a tradução anterior de גּוֹיִם.
- source_word: רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: maiores e mais fortes que você
  rationale: Preserva a amplitude semântica de רַב, que pode indicar grandeza ou número, e de עָצוּם, que indica força ou poder; a alternativa quantitativa aparece em nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Senhor ou Jeová
  rationale: O texto hebraico traz explicitamente o tetragrama. A transliteração “Yahweh” preserva a distinção entre o nome pactual e o título אֲדֹנָי, sem introduzir uma interpretação denominacional.
- issue: Sentido de ירשׁ na entrada na terra
  choice: tomar posse dela
  alternative: herdá-la
  rationale: O verbo pode abranger herança e posse, mas neste contexto de entrada e remoção dos povos destaca-se a tomada efetiva de posse. A tradução não decide além do que o contexto imediato sustenta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para o destinatário singular do hebraico, evita construções excessivamente arcaicas e mantém a frase aberta com vírgula porque o período continua no versículo seguinte.
