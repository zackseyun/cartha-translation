  source_fidelity: 'O texto traduz adequadamente a estrutura de Deuteronômio 7:1: a oração temporal introduzida por כִּי, Yahweh como sujeito de «levar» e «expulsar», a entrada na terra para dela tomar posse, a lista dos sete povos e a aposição final que os caracteriza como superiores a Israel. «Tomar posse dela» representa bem לְרִשְׁתָּהּ no contexto, sem excluir indevidamente a dimensão de herança/posse. «Expulsar de diante de você» transmite de modo claro וְנָשַׁל ... מִפָּנֶיךָ.'
