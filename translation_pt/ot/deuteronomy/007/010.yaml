base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: pt
  text: e retribui diretamente aos que o odeiam[a], para destruí-los. Não demora a retribuir a quem o odeia; retribui-lhe diretamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para a sua face”. A expressão também pode significar “diante dele/deles” ou “na sua presença”; neste contexto, indica retribuição direta e pessoal. O singular hebraico pode ter sentido distributivo na primeira ocorrência.
    reason: Preserva a imagem e a ambiguidade do idiomatismo hebraico, sem introduzir a reflexividade inadequada de “deles mesmos”.
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: e retribui
  rationale: O piel de שׁלם expressa aqui a ideia de dar a alguém o que seus atos merecem. “Retribui” conserva o sentido judicial e a ligação lexical com יְשַׁלֶּם no fim do versículo.
- source_word: לְשֹׂנְאָיו
  choice: aos que o odeiam
  rationale: O particípio de שׂנא caracteriza pessoas que odeiam a Deus. A formulação é clara e mais precisa que o termo mais amplo “inimigos”.
- source_word: אֶל־פָּנָיו
  choice: diante deles mesmos / diante dele mesmo
  rationale: A expressão, literalmente relacionada à face ou presença da pessoa, comunica uma retribuição direta. O português ajusta distributivamente o pronome à referência plural na primeira ocorrência e singular na segunda.
- source_word: לְהַאֲבִידוֹ
  choice: para destruí-los
  rationale: O infinitivo hifil de אבד indica propósito ou resultado. Embora o sufixo hebraico seja singular distributivo, o plural em português retoma naturalmente “os que o odeiam”.
- source_word: לֹא יְאַחֵר
  choice: não demora em agir
  rationale: O piel de אחר significa demorar ou adiar. “Em agir” explicita de modo natural em português a relação marcada por לְ, sem retirar de Deus a agência no juízo.
- source_word: לְשֹׂנְאוֹ
  choice: contra quem o odeia
  rationale: A preposição marca a pessoa em relação à qual Deus não demora. “Contra” torna natural em português o sentido contextual de ação judicial dirigida ao que o odeia.
- source_word: יְשַׁלֶּם לוֹ
  choice: retribui-lhe
  rationale: Mantém a repetição da raiz שׁלם e o foco singular e distributivo da segunda oração.
theological_decisions:
- issue: Linguagem do juízo divino
  choice: Deus retribui diretamente e destrói os que o odeiam
  alternative: Apresentar a destruição como consequência impessoal dos atos humanos
  rationale: O hebraico atribui diretamente a Deus os atos de retribuir e destruir; a tradução conserva essa agência e a tensão teológica do texto.
- issue: Número dos sufixos na primeira oração
  choice: Plural em português, entendido distributivamente
  alternative: 'Manter mecanicamente o singular: “para destruí-lo”'
  rationale: O antecedente לְשֹׂנְאָיו é plural, enquanto os sufixos singulares focalizam distributivamente cada pessoa. O plural evita uma referência obscura em português sem alterar o alcance do juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Diante deles mesmos” evita o coloquial “na cara” e preserva a imagem de presença ou confronto direto. O paralelismo e a repetição de “retribui” refletem a estrutura hebraica.
