  naturalness: “Diante deles mesmos” e “diante dele mesmo” soam forçados e pouco idiomáticos em português moderno. “Diretamente” comunica com clareza a retribuição pessoal, enquanto a nota mantém a imagem literal de “face”. “Não demora a retribuir” é natural e torna explícita, sem mudança material de sentido, a ação que o paralelismo imediatamente repete.
  terminology: “Retribui” é uma boa escolha para שׁלם e deve ser mantido nas duas ocorrências. “Os que o odeiam” conserva a precisão do particípio hebraico e “destruí-los” representa adequadamente o hifil de אבד.
