  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ מֵֽ/אַהֲבַ֨ת יְהוָ֜ה אֶתְ/כֶ֗ם וּ/מִ/שָּׁמְר֤/וּ אֶת הַ/שְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹ֣תֵי/כֶ֔ם הוֹצִ֧יא יְהוָ֛ה אֶתְ/כֶ֖ם בְּ/יָ֣ד חֲזָקָ֑ה וַֽ/יִּפְדְּ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים מִ/יַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of slaves[b], from the hand of Pharaoh king of Egypt.
translation:
  language: pt
  text: mas porque Yahweh ama vocês e porque guarda o juramento que fez aos seus pais, Yahweh os tirou com mão poderosa[a] e os resgatou da casa de escravos[b], da mão do faraó, rei do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «com mão forte». A expressão indica o poder com que Yahweh libertou Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou, de forma mais tradicional, «da casa da escravidão». O hebraico diz literalmente «da casa de escravos».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: mas porque
  rationale: No contexto, introduz a causa em contraste com a negação do versículo anterior; «mas porque» preserva tanto o valor explicativo quanto o adversativo.
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: porque Yahweh ama vocês
  rationale: A construção com מִן expressa causa. A forma verbal é natural em português e mantém o amor de Yahweh como fundamento da ação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: e porque guarda o juramento
  rationale: A construção causal paralela descreve a fidelidade contínua de Yahweh ao juramento; o presente simples é natural e não força uma nuance progressiva.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: que fez aos seus pais
  rationale: Em português, «fazer um juramento» é idiomático; «pais» mantém a referência masculina e histórico-pactual aos patriarcas.
- source_word: הוֹצִיא
  choice: tirou de lá
  rationale: Expressa naturalmente a ação do êxodo em português; «de lá» explicita apenas o ponto de partida já estabelecido pelo contexto imediato.
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: Mantém de perto a imagem hebraica e o adjetivo חֲזָקָה, sendo compreensível em português; a alternativa idiomática é registrada em nota.
- source_word: וַיִּפְדְּךָ
  choice: e os resgatou
  rationale: פדה designa libertar mediante resgate ou redenção. «Resgatou» preserva a força libertadora sem soar excessivamente técnica.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Reproduz a imagem concreta do hebraico, literalmente «casa de escravos», em vez de convertê-la silenciosamente na abstração «escravidão».
- source_word: מִיַּד פַּרְעֹה
  choice: da mão do faraó
  rationale: Conserva a metáfora hebraica de domínio ou poder, que permanece inteligível em português.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: rei do Egito
  rationale: Tradução direta do título em aposição.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Referência pactual em אֲבֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: «Pais» conserva a forma masculina e a provável referência específica aos patriarcas, sem generalização interpretativa.
- issue: Linguagem de servidão em עֲבָדִים
  choice: escravos
  alternative: escravidão
  rationale: O contexto é a sujeição de Israel no Egito, e o substantivo hebraico é concreto e plural; «escravos» mantém essa força.
- issue: Força de פדה
  choice: resgatou
  alternative: redimiu
  rationale: Ambas são possíveis. «Resgatou» comunica de modo corrente a libertação do cativeiro e mantém aberta a dimensão de redenção inerente ao verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» para o plural hebraico e «os» como objeto plural. Conserva imagens hebraicas relevantes sem sacrificar a fluência.
