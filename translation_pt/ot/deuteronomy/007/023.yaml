source:
  edition: WLC
  text: וּ/נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנֶ֑י/ךָ וְ/הָמָ/ם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: pt
  text: Mas Yahweh, seu Deus, os entregará a você[a] e os lançará em grande confusão[b], até que sejam destruídos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante de você”. Aqui, a expressão significa que Yahweh colocará esses inimigos sob o poder de Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou “grande pânico” ou “grande tumulto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: os entregará
  rationale: No contexto militar, נתן com objeto direto e לְפָנֶיךָ indica pôr os inimigos sob o poder de Israel. “Os entregará” expressa esse sentido de modo natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: A forma construta com sufixo masculino singular significa diretamente “seu Deus”.
- source_word: לְפָנֶיךָ
  choice: a você
  rationale: Embora literalmente signifique “diante de você”, junto de נתן a expressão comunica que os inimigos serão entregues ao poder de Israel.
- source_word: וְהָמָם
  choice: e os lançará em grande confusão
  rationale: O verbo המם descreve causar pânico, desordem ou debandada, especialmente em combate. A formulação preserva sua força causativa.
- source_word: מְהוּמָה גְדֹלָה
  choice: grande confusão
  rationale: A expressão pode indicar grande confusão, pânico ou tumulto; “grande confusão” é clara e mantém a amplitude semântica.
- source_word: עַד הִשָּׁמְדָם
  choice: até que sejam destruídos
  rationale: O infinitivo construto depois de עַד marca o resultado final da ação e admite naturalmente esta formulação passiva em português.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama יהוה. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa masculina singular do hebraico foi vertida por “seu/a você”, evitando formas regionais ou arcaizantes. A repetição semântica entre o verbo המם e o substantivo מְהוּמָה foi expressa naturalmente como “lançará em grande confusão”.
