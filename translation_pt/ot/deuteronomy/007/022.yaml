  source_fidelity: 'O texto principal traduz adequadamente os elementos centrais do hebraico: Yahweh, a expulsão gradual das nações, a incapacidade de eliminá-las depressa e o risco representado pelos animais selvagens. «Exterminá-las» mantém a força de כַּלֹּתָם, e «contra você» preserva de modo defensável o valor adversativo de עָלֶיךָ.'
  naturalness: A reordenação de «essas nações» antes de «da sua frente» torna a frase mais fluente em português moderno, sem alterar seu sentido. O uso de «você» é consistente com o registro-alvo.
  terminology: '«Yahweh» está correto para o Tetragrama. «Animais selvagens» é uma boa equivalência contemporânea para חַיַּת הַשָּׂדֶה. A alternativa da nota a deve ser corrigida: «desapropriará» normalmente se refere à expropriação de bens ou propriedade e não é uma alternativa idiomática apropriada para a remoção de povos.'
