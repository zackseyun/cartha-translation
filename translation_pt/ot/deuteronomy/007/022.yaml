base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: pt
  text: E Yahweh, seu Deus, expulsará essas nações da sua frente, pouco a pouco.[a] Você não poderá exterminá-las depressa, para que os animais selvagens não se multipliquem contra você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desalojará essas nações da sua frente, pouco a pouco”.'
    reason: Alternativa lexical para וְנָשַׁל; «desalojará» expressa de modo idiomático a remoção territorial das nações.
  - marker: b
    text: 'Literalmente: “os animais do campo”.'
    reason: Alternativa mais formal para חַיַּת הַשָּׂדֶה.
lexical_decisions:
- source_word: וְנָשַׁל
  choice: expulsará
  rationale: No contexto da tomada da terra, o verbo indica fazer com que as nações sejam removidas. “Expulsará” é natural em português e conserva o sentido territorial.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַגּוֹיִם הָאֵל
  choice: essas nações
  rationale: “Nações” preserva o sentido coletivo e político-territorial; “essas” traduz o demonstrativo hebraico.
- source_word: מִפָּנֶיךָ
  choice: da sua frente
  rationale: Conserva a imagem espacial do hebraico e, com “expulsará”, comunica a remoção do caminho e da presença de Israel.
- source_word: מְעַט מְעָט
  choice: pouco a pouco
  rationale: Reproduz de modo idiomático a repetição hebraica que expressa gradualidade.
- source_word: לֹא תוּכַל
  choice: Você não poderá
  rationale: Expressa claramente a incapacidade no contexto futuro.
- source_word: כַּלֹּתָם
  choice: exterminá-las
  rationale: O verbo indica levá-las ao fim ou eliminá-las por completo. “Exterminá-las” é direto, digno e adequado ao contexto, sem recorrer ao coloquial “acabar com elas”.
- source_word: מַהֵר
  choice: depressa
  rationale: Equivalente corrente e claro para a ideia de rapidez.
- source_word: פֶּן
  choice: para que ... não
  rationale: Preserva a nuance preventiva de פֶּן em português natural; “para que não” pode exprimir tanto propósito preventivo quanto resultado temido.
- source_word: תִּרְבֶּה
  choice: se multipliquem
  rationale: Traduz diretamente a ideia de aumentar em número, com concordância natural com “animais”.
- source_word: חַיַּת הַשָּׂדֶה
  choice: os animais selvagens
  rationale: Expressa em português moderno os animais do campo ou da região aberta, em contraste implícito com os domésticos.
- source_word: עָלֶיךָ
  choice: contra você
  rationale: Mantém a força adversativa da preposição neste contexto de ameaça, sem neutralizar o perigo representado pelos animais.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Alcance de כַּלֹּתָם
  choice: exterminá-las
  alternative: acabar com elas; destruí-las completamente
  rationale: A formulação conserva a ideia forte de levar as nações ao fim, sem amenizar a violência do texto nem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Você” evita uma forma regionalmente marcada de segunda pessoa; “seu Deus” acompanha essa opção. A ordem foi levemente ajustada para que “pouco a pouco” modifique com clareza a expulsão. Os marcadores de nota aparecem no texto principal.
