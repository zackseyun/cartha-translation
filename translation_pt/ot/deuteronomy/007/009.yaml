source:
  edition: WLC
  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: pt
  text: Saiba[a], portanto, que Yahweh, seu Deus, é Deus, o Deus fiel, que guarda a aliança e o amor leal[b] para com os que o amam e para com os que guardam os seus mandamentos, até mil gerações[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E saiba» ou «Saiba, pois»; a conjunção hebraica pode indicar simples continuação ou uma conclusão baseada no contexto anterior.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico חֶסֶד (ḥésed), termo que também pode ser traduzido como «amor constante», «lealdade pactual» ou «misericórdia».
    reason: lexical_alternative
  - marker: c
    text: 'Ou, ligando «por mil gerações» mais diretamente aos que amam a Deus e guardam os seus mandamentos: «para com os que o amam e para com os que guardam os seus mandamentos, por mil gerações». A expressão ressalta a fidelidade pactual de Deus ao longo de um período imenso.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Saiba, portanto
  rationale: O perfeito qal na segunda pessoa masculina singular tem força exortativa no contexto. «Portanto» expressa de modo natural a possível relação inferencial da conjunção com o argumento anterior, sem ocultar outras leituras, registradas em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva sua função pactual.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a forma construta com sufixo de segunda pessoa masculina singular em português corrente.
- source_word: הוּא הָאֱלֹהִים
  choice: é Deus
  rationale: O pronome hebraico confere ênfase; em português, a construção «Yahweh, seu Deus, é Deus» mantém a afirmação enfática e exclusiva sem a formulação pouco natural «é o Deus».
- source_word: הָאֵל הַנֶּאֱמָן
  choice: o Deus fiel
  rationale: A aposição identifica Yahweh como o Deus caracterizado por firmeza, confiabilidade e fidelidade, especialmente no âmbito da aliança.
- source_word: שֹׁמֵר
  choice: que guarda
  rationale: O particípio descreve uma ação contínua. «Guardar a aliança» é expressão natural e preserva a ligação lexical com guardar os mandamentos.
- source_word: הַבְּרִית
  choice: a aliança
  rationale: Equivalente formal e consolidado para o compromisso pactual definido.
- source_word: וְהַחֶסֶד
  choice: e o amor leal
  rationale: חֶסֶד reúne amor, lealdade, misericórdia e constância no contexto da aliança. «Amor leal» comunica de forma acessível tanto o afeto quanto a fidelidade relacional; a amplitude lexical é indicada em nota.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: para com os que o amam e guardam os seus mandamentos
  rationale: «Para com» marca naturalmente os destinatários da fidelidade divina; o único artigo antes dos dois verbos coordena os mesmos grupos sem exigir uma distinção artificial entre eles.
- source_word: לְאֶלֶף דּוֹר
  choice: até mil gerações
  rationale: Expressa a extensão temporal imensa da fidelidade pactual. «Até» distingue com clareza a duração dos beneficiários introduzidos por לְ.
theological_decisions:
- issue: Relação entre a fidelidade pactual de Deus e o amor e a obediência humanos
  choice: Deus guarda a aliança e o amor leal para com os que o amam e guardam seus mandamentos.
  alternative: Deus demonstra misericórdia aos que o amam, ou guarda a aliança e a lealdade pactual com eles.
  rationale: A tradução mantém juntos aliança, חֶסֶד, amor humano e observância dos mandamentos, sem diluir a condicionalidade pactual do contexto nem enquadrá-la em um sistema teológico posterior.
- issue: Alcance de «mil gerações»
  choice: A expressão qualifica a duração da fidelidade pactual de Deus.
  alternative: 'A expressão pode ser ligada mais diretamente aos que amam a Deus e guardam seus mandamentos: «para com os que... por mil gerações».'
  rationale: A ordem hebraica permite proximidade com os beneficiários, mas o sentido global é a longa duração da fidelidade divina. A nota preserva a alternativa sintática.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Emprega «seu» em referência ao interlocutor singular, «Yahweh» para o nome divino e «amor leal» para comunicar חֶסֶד sem jargão excessivo. A repetição de «Deus» conserva a ênfase da aposição hebraica.
