base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: pt
  text: Você será mais abençoado do que todos os povos[a]. Não haverá no seu meio homem estéril nem mulher estéril[b], nem entre os seus animais de criação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você será abençoado acima de todos os povos”. A preposição hebraica indica comparação neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega explicitamente uma forma masculina e outra feminina: “homem estéril” e “mulher estéril”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: Você será mais abençoado
  rationale: O particípio passivo de ברך com היה expressa o estado futuro de ser abençoado. A formulação é natural em português e, com o comparativo seguinte, comunica a bênção da aliança.
- source_word: מִכָּל הָעַמִּים
  choice: do que todos os povos
  rationale: A preposição מִן tem aqui força comparativa. “Do que todos os povos” explicita essa relação sem transformar a bênção em separação de Israel dentre as nações.
- source_word: לֹא יִהְיֶה בְךָ
  choice: Não haverá no seu meio
  rationale: A construção existencial com בְּ indica ausência dentro da comunidade. “No seu meio” conserva a referência corporativa ao povo tratado no singular.
- source_word: עָקָר וַעֲקָרָה
  choice: homem estéril nem mulher estéril
  rationale: O hebraico emprega deliberadamente formas masculina e feminina. A tradução torna ambas explícitas e usa “nem”, adequado ao enunciado negativo.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: nem entre os seus animais
  rationale: בְּהֵמָה designa coletivamente os animais domésticos. O possessivo e o contexto deixam claro esse sentido, enquanto “animais” permanece amplo e acessível.
theological_decisions:
- issue: Termos de infertilidade em uma bênção da aliança
  choice: Explicitar “homem estéril” e “mulher estéril”
  alternative: Generalizar como “ninguém estéril”
  rationale: A redação conserva a distinção intencional entre as formas hebraicas masculina e feminina, sem restringir a promessa a apenas um dos sexos.
- issue: Tratamento de Israel como singular coletivo
  choice: Manter “você/seu” no singular
  alternative: Pluralizar como “vocês”
  rationale: O hebraico se dirige a Israel no masculino singular, concebendo-o como um só povo da aliança. A tradução preserva essa forma sem negar o sentido coletivo.
- issue: Força comparativa de מִן
  choice: “mais abençoado do que todos os povos”
  alternative: “abençoado acima de todos os povos”
  rationale: A opção principal expressa diretamente a comparação. A alternativa, registrada em nota, pode sugerir posição ou grau e preserva uma formulação igualmente possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O singular “você” preserva o tratamento corporativo de Israel; “no seu meio” torna perceptível o sentido comunitário. A repetição de “estéril” evita qualquer dúvida sobre a aplicação do termo tanto ao homem quanto à mulher.
