source:
  edition: WLC
  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: pt
  text: E, quando Javé, seu Deus, os entregar diante de você e você os derrotar, consagre-os totalmente à destruição[a]. Não faça aliança com eles nem lhes mostre favor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destrua-os completamente” ou “coloque-os totalmente sob o anátema”. O hebraico repete a raiz verbal חרם numa construção intensiva, indicando dedicação total à destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nem tenha misericórdia deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: os entregar
  rationale: No contexto militar, נתן indica entregar alguém ao poder de outro. “Entregar” preserva a ação divina sem acrescentar a expressão “nas mãos”, ausente do hebraico.
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, em vez de substituí-lo por um título.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: Reproduz de modo claro a expressão hebraica e indica que esses povos são postos diante de Israel no contexto da conquista.
- source_word: וְהִכִּיתָם
  choice: você os derrotar
  rationale: Em contexto de guerra, נכה pode indicar ferir ou derrotar. “Derrotar” comunica naturalmente o resultado militar sem recorrer a linguagem arcaica.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: consagre-os totalmente à destruição
  rationale: A construção intensiva com חרם expressa dedicação total à destruição. A formulação preserva tanto a totalidade quanto a dimensão religiosa do termo, sem reduzi-lo a uma destruição militar comum.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: Não faça aliança com eles
  rationale: כרת ברית é a expressão hebraica habitual para estabelecer uma aliança. “Fazer aliança” é idiomático e mantém a amplitude formal do termo.
- source_word: וְלֹא תְחָנֵּם
  choice: nem lhes mostre favor
  rationale: חנן denota conceder favor ou graça. “Mostrar favor” preserva esse sentido lexical, enquanto “mostrar misericórdia” permanece como alternativa contextual em nota.
theological_decisions:
- issue: Sentido de חרם no contexto da guerra sagrada
  choice: consagre-os totalmente à destruição
  alternative: destrua-os completamente; coloque-os sob o anátema
  rationale: A tradução mantém a força religiosa e totalizante de חרם, em vez de apresentar a expressão apenas como linguagem militar. A nota registra alternativas legítimas sem resolver além do que o hebraico permite.
- issue: Sentido de תְחָנֵּם
  choice: nem lhes mostre favor
  alternative: nem tenha misericórdia deles
  rationale: “Favor” corresponde mais diretamente ao campo lexical de חנן; “misericórdia” é uma leitura contextual comum e plausível, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “você” no singular para refletir o destinatário singular hebraico. O pronome masculino plural retoma os povos mencionados no contexto. A coordenação inicial “E, quando” preserva a ligação do versículo com a frase anterior.
