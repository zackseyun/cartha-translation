  source_fidelity: 'O texto traduz adequadamente a sequência hebraica: Yahweh/Javé entrega os povos diante do destinatário, este os derrota, e eles são submetidos ao חרם de modo total. «Consagre-os totalmente à destruição» preserva tanto a intensificação do infinitivo absoluto quanto a dimensão de dedicação/destruição própria de חרם. «Não faça aliança» e «nem lhes mostre favor» refletem com precisão as expressões finais.'
  naturalness: O português é moderno, claro e de registro apropriado. O uso de «você» mantém de modo natural o singular do hebraico e é compatível com a variante-alvo. A coordenação «E, quando» é aceitável por conservar a ligação sintática com o contexto anterior.
  terminology: «Javé» é uma forma portuguesa estabelecida para o Tetragrama. «Aliança», «favor» e «consagre-os ... à destruição» são escolhas terminologicamente defensáveis e não impõem leitura confessional indevida. As notas apresentam alternativas pertinentes; os seus marcadores estão corretamente ligados a «destruição» e «favor», respectivamente.
