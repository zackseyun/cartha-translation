base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: pt
  text: Queimem no fogo as imagens esculpidas dos deuses deles. Não cobice a prata nem o ouro que há sobre elas, nem os tome para você, para que você não seja enredado por isso[a], pois isso é uma abominação para Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que isso não se torne uma armadilha para você”. O verbo hebraico evoca a imagem de alguém apanhado numa armadilha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּסִילֵי אֱלֹהֵיהֶם
  choice: as imagens esculpidas dos deuses deles
  rationale: Preserva o sentido concreto de פֶּסֶל como imagem talhada ou esculpida, sem substituir antecipadamente o termo pelo mais interpretativo “ídolos”.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: Queimem no fogo
  rationale: Expressa naturalmente tanto a ação de queimar quanto a especificação enfática do fogo como meio.
- source_word: לֹא תַחְמֹד
  choice: Não cobice
  rationale: “Cobiçar” comunica o desejo indevido por algo atraente e mantém o registro ético tradicional do verbo חמד.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: a prata nem o ouro que há sobre elas
  rationale: Em uma proibição portuguesa, “nem... nem” expressa com naturalidade que nenhum dos dois metais pode ser cobiçado, enquanto “sobre elas” conserva a relação espacial do hebraico.
- source_word: וְלָקַחְתָּ לָךְ
  choice: nem os tome para você
  rationale: O plural retoma naturalmente “a prata” e “o ouro” em português, e “para você” comunica a apropriação em benefício próprio indicada por לָךְ.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: para que não seja apanhado numa armadilha por causa disso
  rationale: Mantém explícita a imagem de uma armadilha presente no Niphal de יקשׁ. “Por causa disso” evita fixar de modo indevido o referente singular de בּוֹ.
- source_word: תוֹעֲבַת
  choice: uma abominação
  rationale: Conserva a força do termo hebraico para algo profundamente repugnante ou detestável diante de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em conformidade com a camada inglesa fornecida e sem substituí-lo por um título.
theological_decisions:
- issue: Referente de בּוֹ e do pronome final הוּא
  choice: Empregar “disso” e “isso”, preservando um referente amplo.
  alternative: Identificar especificamente a imagem, os metais retirados dela ou o ato de tomá-los.
  rationale: O contexto imediato envolve as imagens, os metais que as revestem e sua apropriação. Os demonstrativos neutros em português preservam a ambiguidade do hebraico sem decidir qual elemento particular constitui a armadilha e a abominação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O imperativo plural “Queimem” reflete o destinatário coletivo na primeira oração; o singular “você” acompanha a mudança hebraica para formas de segunda pessoa masculina singular no restante do versículo. O nome divino é grafado “Yahweh”.
