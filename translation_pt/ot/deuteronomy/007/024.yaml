base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: pt
  text: Ele entregará os reis deles em sua mão, e você fará desaparecer o nome deles de debaixo do céu. Ninguém resistirá a você, até que você os tenha destruído.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַן
  choice: Ele entregará
  rationale: O perfeito qal com conjunção, nesta sequência de promessas, tem valor futuro. O sujeito é o SENHOR, mencionado no contexto anterior.
- source_word: מַלְכֵיהֶם בְּיָדֶךָ
  choice: os reis deles em suas mãos
  rationale: A expressão idiomática indica que os reis serão entregues ao poder de Israel; a imagem das mãos é preservada em português natural.
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: e você fará desaparecer o nome deles
  rationale: O hifil de אבד é causativo, e seu objeto é o singular coletivo 'nome'. A formulação preserva tanto a causalidade quanto a ideia de apagar sua memória ou existência.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de debaixo dos céus
  rationale: Mantém a imagem e o plural hebraico, uma expressão abrangente para o âmbito da existência humana.
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  choice: Ninguém conseguirá resistir a você
  rationale: Neste contexto militar, התיצב לפני significa tomar posição e manter-se firme diante de alguém. אִישׁ tem sentido representativo e é traduzido naturalmente por 'ninguém' em português.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: até que você os tenha destruído
  rationale: A construção com עַד assinala o ponto final da ação, e שׁמד comunica destruição completa no contexto de guerra de Deuteronômio.
theological_decisions:
- issue: Sentido representativo de אִישׁ
  choice: Ninguém conseguirá resistir a você
  alternative: Nenhum homem ficará de pé diante de você
  rationale: Embora אִישׁ seja masculino singular, aqui tem força genérica. 'Ninguém' transmite esse alcance com clareza e naturalidade, sem alterar o referente.
- issue: Alcance de destruir o 'nome' dos reis
  choice: fará desaparecer o nome deles
  alternative: apagará a memória deles
  rationale: A tradução mantém o objeto e a metáfora do hebraico, sem limitar 'nome' apenas a reputação ou memória.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento por 'você'. A redação conserva a imagem hebraica das mãos e dos céus, mas expressa o idioma militar de modo natural.
