review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a sequência preditiva: o SENHOR entregará os reis, o destinatário eliminará o seu nome, ninguém resistirá, até a destruição deles. «Fará desaparecer o nome deles» conserva bem o objeto singular coletivo e a nuance causativa de וְהַאֲבַדְתָּ. «Ninguém resistirá a você» comunica de modo idiomático o sentido militar de «não se manterá de pé diante de você», sem restringir indevidamente o singular representativo אִישׁ.'
  naturalness: O registro é claro e moderno. «De debaixo do céu» é a formulação portuguesa mais corrente para o idiomatismo bíblico מִתַּחַת הַשָּׁמָיִם; «de debaixo dos céus» soa menos natural e sugere uma pluralidade que não é necessária em português.
  terminology: «Em sua mão» preserva a imagem hebraica e mantém a referência no singular do destinatário tratado por «você». «Nome» deve permanecer no singular coletivo. Não são necessárias notas de rodapé para esta formulação.
  issues:
