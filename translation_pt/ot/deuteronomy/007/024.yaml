    issue: «de debaixo dos céus»
    rationale: Embora שָׁמַיִם tenha morfologia plural em hebraico, a expressão é um idiomatismo estabelecido que em português se traduz naturalmente por «de debaixo do céu». A alteração melhora a naturalidade sem reduzir o alcance da expressão.
  - severity: low
    issue: «em suas mãos»
    rationale: O hebraico traz «em tua mão», no singular. «Em sua mão» preserva com maior precisão a imagem e harmoniza com o tratamento singular «você».
  - severity: low
    issue: «Ninguém conseguirá resistir»
    rationale: «Conseguirá» explicita uma noção de capacidade não marcada pelo verbo hebraico. «Ninguém resistirá» é mais direto e conserva o sentido contextual de não se sustentar em oposição.
