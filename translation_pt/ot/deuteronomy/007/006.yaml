base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: pt
  text: Pois você é um povo santo para Yahweh, seu Deus. Yahweh, seu Deus, escolheu você para ser seu povo precioso[a], dentre todos os povos que há sobre a face da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um povo que é sua propriedade preciosa”. O hebraico diz literalmente “um povo de propriedade preciosa”, reunindo as ideias de povo e de uma posse especialmente valorizada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da ordem anterior e conserva de modo natural a força explicativa do hebraico.
- source_word: עַם קָדוֹשׁ
  choice: um povo santo
  rationale: Preserva a expressão nominal e seu sentido de povo separado como santo, com linguagem bíblica clara e corrente.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para Yahweh, seu Deus
  rationale: A preposição ל marca aqui relação e pertencimento; “para” mantém a estrutura e permite que o contexto comunique esse vínculo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּךָ בָּחַר
  choice: escolheu você
  rationale: בחר expressa escolha ou eleição. O pretérito perfeito português comunica naturalmente o ato divino com relevância contínua no contexto da aliança.
- source_word: לִהְיוֹת לוֹ
  choice: para ser para ele
  rationale: Conserva tanto a ideia de propósito do infinitivo quanto a relação de posse ou destinação expressa por לו, sem explicitar além do hebraico.
- source_word: לְעַם סְגֻלָּה
  choice: um povo precioso
  rationale: Mantém o substantivo explícito עַם e comunica que סְגֻלָּה designa uma posse especialmente estimada. A nota registra a alternativa mais possessiva.
- source_word: מִכֹּל הָעַמִּים
  choice: dentre todos os povos
  rationale: Expressa seleção no interior de um conjunto, evitando introduzir a ideia comparativa de superioridade que “acima de” poderia sugerir.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: que há sobre a face da terra
  rationale: Preserva a imagem idiomática hebraica em português compreensível e evita a construção menos natural “que estão” aplicada coletivamente aos povos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido da escolha em מִכֹּל הָעַמִּים
  choice: dentre todos os povos
  alternative: acima de todos os povos; de todos os povos
  rationale: A formulação comunica escolha dentre as nações sem afirmar uma superioridade intrínseca não exigida pela preposição hebraica.
- issue: Relação entre povo e posse em לְעַם סְגֻלָּה
  choice: um povo precioso
  alternative: uma propriedade preciosa; um povo de propriedade particular
  rationale: O hebraico reúne a identidade de povo e a ideia de posse especialmente valorizada. O texto principal preserva עַם, enquanto a nota mantém visível a nuance possessiva de סְגֻלָּה.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você/seu” reflete a forma hebraica singular que se dirige coletivamente a Israel. Mantiveram-se a repetição de “Yahweh, seu Deus” e a imagem “sobre a face da terra” por sua relevância formal e retórica.
