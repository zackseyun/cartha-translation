  text: לֹ֥א תַעֲרֹ֖ץ מִ/פְּנֵי/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/קִרְבֶּ֔/ךָ אֵ֥ל גָּד֖וֹל וְ/נוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: pt
  text: 'Não se apavorem diante deles, pois Yahweh, o Deus de vocês, está no meio de vocês: um Deus grande e temível.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que inspira temor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: Não fiquem apavorados diante deles
  rationale: O verbo ערץ expressa pavor ou terror, e מִפְּנֵיהֶם significa literalmente “diante deles”. A formulação preserva a intensidade do hebraico e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Mantém explicitamente a relação pactual indicada pelo sufixo possessivo singular, usando o possessivo de valor coletivo em português.
- source_word: בְּקִרְבְּךָ
  choice: no meio de vocês
  rationale: Comunica a presença de Deus no meio da comunidade e evita a possível leitura individual e interior de “dentro de você”.
- source_word: אֵל גָּדוֹל וְנוֹרָא
  choice: Deus grande e temível
  rationale: Preserva o valor de אֵל como designação divina, גָּדוֹל como “grande” e נוֹרָא como aquele que inspira temor e reverência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de נוֹרָא aplicado a Deus
  choice: temível
  alternative: impressionante
  rationale: “Temível” conserva a noção de inspirar temor reverente e evita o enfraquecimento semântico que “impressionante” pode sofrer no uso moderno.
translation_notes:
  register: Português moderno, digno e acessível, com concordância plural para explicitar que o discurso se dirige coletivamente a Israel. A estrutura final com dois-pontos conserva a aposição hebraica sem acrescentar verbo ausente no original.
