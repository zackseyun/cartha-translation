base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: pt
  text: Você consumirá[a] todos os povos que Yahweh, seu Deus, está entregando a você. Os seus olhos não os pouparão,[b] e você não servirá aos deuses deles, pois isso seria uma armadilha para você.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “devorará” ou “destruirá”. O verbo hebraico significa literalmente “comer” e aqui é usado figuradamente para indicar derrota completa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Você não terá piedade deles”. Literalmente: “Seus olhos não os pouparão”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pois ele é uma armadilha para você”. O pronome hebraico pode referir-se ao serviço prestado aos deuses, aos próprios deuses ou, mais amplamente, à situação idólatra.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Você consumirá
  rationale: O verbo אָכַל significa literalmente “comer”, mas aqui é empregado de modo figurado para derrota e destruição completas. “Consumirá” preserva a metáfora sem reduzi-la diretamente a “destruirá”.
- source_word: כָּל הָעַמִּים
  choice: todos os povos
  rationale: O plural עַמִּים designa povos distintos; “povos” é mais diretamente correspondente do que “nações” neste contexto.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: que Yahweh, seu Deus, está entregando a você
  rationale: O particípio נֹתֵן expressa ação em curso ou iminente. “Entregando” explicita o sentido contextual de colocar esses povos sob o poder de Israel, e o nome divino é transliterado como “Yahweh”.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: Seus olhos não terão compaixão deles
  rationale: A formulação conserva a imagem concreta do olho presente no idioma hebraico, mas usa uma construção compreensível em português atual.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: e você não servirá aos deuses deles
  rationale: עבד, quando tem deuses como objeto, inclui culto e lealdade religiosa. “Servirá” mantém a amplitude do verbo, enquanto “adorará” seria uma explicitação mais estreita.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: pois isso seria uma armadilha para você
  rationale: מוֹקֵשׁ indica laço ou armadilha. “Isso” aponta naturalmente para servir aos deuses, sem excluir completamente a possibilidade de uma referência mais ampla.
theological_decisions:
- issue: Referente de הוּא em כִּי מוֹקֵשׁ הוּא לָךְ
  choice: “isso” retoma mais naturalmente o ato de servir aos deuses deles
  alternative: O pronome pode referir-se aos próprios deuses ou, de modo mais amplo, à situação idólatra ligada aos povos.
  rationale: A oração imediatamente anterior torna o serviço aos deuses o referente mais próximo, mas a nota preserva a amplitude possível do pronome hebraico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Mantém-se o nome pessoal “Yahweh”, a metáfora de consumir e a imagem dos olhos, com notas para esclarecer os idiomas hebraicos e a ambiguidade pronominal.
