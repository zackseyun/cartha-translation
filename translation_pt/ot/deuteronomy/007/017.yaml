  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: pt
  text: 'Se você disser em seu coração: “Estas nações são mais numerosas do que eu sou; como poderei desapossá-las[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “expulsá-las”. O verbo hebraico inclui a ideia de fazê-las perder a posse da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz uma situação condicional que prepara a exortação do versículo seguinte.
- source_word: תֹאמַר בִּלְבָבְךָ
  choice: você disser no coração
  rationale: Preserva tanto o verbo 'dizer' quanto a imagem hebraica do coração como lugar do pensamento interior.
- source_word: רַבִּים ... מִמֶּנִּי
  choice: mais numerosas do que eu
  rationale: Expressa a comparação numérica com o destinatário singular sem introduzir um plural ausente no hebraico.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: estas nações
  rationale: É a correspondência natural para os povos distintos mencionados no contexto de Deuteronômio.
- source_word: אֵיכָה אוּכַל
  choice: Como poderei
  rationale: Comunica de modo natural a pergunta sobre capacidade, preservando a orientação futura do imperfeito no cenário previsto.
- source_word: לְהוֹרִישָׁם
  choice: desapossá-las
  rationale: No contexto territorial, o hifil de ירש indica fazer com que as nações percam a posse da terra; 'desapossar' conserva essa nuance.
