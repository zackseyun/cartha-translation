base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: pt
  text: 'Pelo contrário, é isto que vocês devem fazer com eles: derrubem os seus altares, despedacem as suas colunas sagradas[a], cortem os seus postes de Aserá[b] e queimem no fogo as suas imagens esculpidas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras erigidas” ou “pedras levantadas”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico asherim; provavelmente objetos cultuais de madeira associados à deusa Aserá.
    reason: cultural_note
  - marker: c
    text: Ou “ídolos”; o hebraico significa mais especificamente imagens feitas por escultura ou entalhe.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pelo contrário
  rationale: A expressão introduz forte contraste com a proibição anterior; “Pelo contrário” comunica esse valor adversativo de modo natural.
- source_word: כֹּה תַעֲשׂוּ לָהֶם
  choice: é isto que vocês devem fazer com eles
  rationale: Preserva a referência prospectiva de כֹּה e a força diretiva do imperfeito em contexto legal, com formulação clara no português atual.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: derrubem os seus altares
  rationale: נתץ indica demolir ou pôr abaixo uma estrutura; “derrubem” é concreto, vigoroso e idiomático.
- source_word: מַצֵּבֹתָם
  choice: as suas colunas sagradas
  rationale: מַצֵּבָה designa pedras erigidas com função cultual. “Colunas sagradas” torna explícito o caráter religioso sem recorrer a uma transliteração opaca.
- source_word: תְּשַׁבֵּרוּ
  choice: despedacem
  rationale: O Piel de שׁבר expressa uma ação enérgica; “despedacem” conserva essa intensidade.
- source_word: אֲשֵׁירֵיהֶם
  choice: os seus postes de Aserá
  rationale: O plural אֲשֵׁרִים refere-se a objetos de culto associados a Aserá, provavelmente de madeira; a expressão mantém a referência histórico-religiosa específica, com a incerteza material registrada em nota.
- source_word: תְּגַדֵּעוּן
  choice: cortem
  rationale: גדע significa cortar ou abater, especialmente algo de madeira. “Cortem” combina naturalmente com os postes mencionados sem acrescentar detalhes ausentes.
- source_word: פְסִילֵיהֶם
  choice: as suas imagens esculpidas
  rationale: פֶּסֶל é uma imagem produzida por entalhe ou escultura. A escolha preserva o sentido concreto, em vez de reduzi-lo ao termo mais genérico “ídolos”.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: queimem no fogo
  rationale: Mantém a menção explícita ao fogo e a força direta da ordem, em português natural.
theological_decisions:
- issue: Identificação de אֲשֵׁרִים como objeto cultual específico
  choice: postes de Aserá
  alternative: símbolos de Aserá; aserins; imagens de Aserá
  rationale: O texto enumera categorias distintas de objetos cultuais. A tradução conserva a associação específica com Aserá, sem nivelar o termo para o genérico “ídolos”; a nota reconhece que a forma exata do objeto não é inteiramente certa.
- issue: Força das ordens de destruição dos objetos de culto
  choice: 'imperativos diretos: “derrubem”, “despedacem”, “cortem” e “queimem”'
  alternative: uma formulação atenuada, como “eliminem” ou “livrem-se de”
  rationale: As formas hebraicas têm força diretiva e empregam verbos concretos. A tradução conserva a severidade textual sem acrescentar justificações teológicas que não aparecem no versículo.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. Os imperativos mantêm a força do mandamento sem arcaísmo. A colocação dos marcadores foi corrigida segundo o termo a que cada nota efetivamente se refere.
