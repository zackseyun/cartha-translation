base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: pt
  text: Portanto[a], guarde o mandamento, os estatutos e as ordenanças[b] que hoje lhe ordeno, para os cumprir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E guarde”. A conjunção hebraica pode indicar simples continuidade ou uma conclusão decorrente dos versículos anteriores.'
    reason: lexical_alternative
  - marker: b
    text: “Ordenanças” também pode ser traduzido por “juízos”, “normas” ou “decisões judiciais”; o termo hebraico se refere a determinações legais prescritas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Portanto, guarde
  rationale: שׁמר, em contexto jurídico e de aliança, significa guardar ou observar. O imperativo em português comunica naturalmente a força normativa da forma hebraica; “Portanto” representa a possível relação inferencial com os versículos anteriores.
- source_word: הַמִּצְוָה
  choice: o mandamento
  rationale: Mantém o singular do hebraico e o distingue das duas categorias legais plurais seguintes.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: “Estatutos” preserva o registro jurídico da legislação da aliança e a distinção em relação aos demais termos da tríade.
- source_word: הַמִּשְׁפָּטִים
  choice: as ordenanças
  rationale: מִשְׁפָּטִים pode designar decisões judiciais, normas ou ordenanças. “Ordenanças” é claro no português bíblico moderno e evita a possível leitura de “juízos” como atos de punição, embora essa alternativa seja registrada em nota.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhe ordeno
  rationale: Expressa de modo natural o ato presente de ordenar e conserva a posição enfática de “hoje” no contexto da aliança de Deuteronômio.
- source_word: לַעֲשׂוֹתָם
  choice: para os cumprir
  rationale: O infinitivo עשה significa literalmente “fazer”. Em português jurídico e bíblico, “cumprir” comunica a execução concreta das prescrições sem confundi-la com o primeiro verbo, “guardar”.
theological_decisions:
- issue: Distinção entre os três termos da legislação da aliança
  choice: o mandamento, os estatutos e as ordenanças
  alternative: o mandamento, os decretos e os juízos
  rationale: A formulação conserva o singular de מִצְוָה e mantém três designações distintas, sem reduzir a tríade a uma categoria genérica nem atribuir a cada termo uma delimitação teológica mais rígida do que o hebraico permite.
- issue: Relação lógica com os versículos anteriores
  choice: Portanto
  alternative: E
  rationale: O וְ inicial admite simples coordenação, mas, neste contexto, pode introduzir uma conclusão decorrente da fidelidade e da justiça de Deus descritas anteriormente. A nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi levemente ajustada para a colocação natural de “hoje”. O registro jurídico da tríade hebraica foi preservado sem excesso de arcaísmo.
