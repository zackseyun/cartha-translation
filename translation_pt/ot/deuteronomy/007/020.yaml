  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: pt
  text: Além disso, Yahweh, seu Deus, enviará contra eles o vespão[a], até que pereçam os que restarem e os que se esconderem de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o terror” ou “o pânico”. Alguns entendem “o vespão” em sentido figurado, como o medo enviado por Deus, e não como um inseto literal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: Expressa de modo natural em português a força aditiva e enfática, ligando esta ação às promessas anteriores de conquista.
- source_word: הַצִּרְעָה
  choice: o vespão
  rationale: Mantém no texto principal o sentido lexical concreto do substantivo singular com artigo, que pode ter valor coletivo; a possível leitura figurada é registrada em nota.
- source_word: יְשַׁלַּח
  choice: enviará
  rationale: Representa diretamente a ação futura de Yahweh ao mandar esse agente contra os inimigos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a construção possessiva e a forma direta de tratamento ao povo.
- source_word: בָּם
  choice: contra eles
  rationale: No contexto hostil, comunica naturalmente o direcionamento do vespão aos inimigos; 'entre eles' também seria possível, mas menos claro quanto à ação adversativa.
- source_word: עַד אֲבֹד
  choice: até que pereçam
  rationale: Preserva a ideia de limite ou resultado final da ação sem especificar indevidamente a maneira da morte.
- source_word: הַנִּשְׁאָרִים
  choice: os que restarem
  rationale: Traduz o particípio como referência aos sobreviventes deixados após as ações anteriores, sem introduzir a conotação técnica de 'remanescente'.
- source_word: וְהַנִּסְתָּרִים
  choice: e os que se esconderem
  rationale: Torna natural em português o sentido contextual de pessoas que se ocultam diante do avanço de Israel.
- source_word: מִפָּנֶיךָ
  choice: de você
  rationale: Expressa em português corrente o sentido idiomático de afastar-se ou esconder-se da presença do interlocutor.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido literal ou figurado de הַצִּרְעָה
  choice: o vespão, em sentido literal, no texto principal
  alternative: terror ou pânico enviado por Deus
  rationale: O sentido lexical básico designa o inseto. Como a interpretação figurada é possível e tradicionalmente discutida, ela é preservada em nota sem resolver a ambiguidade de modo dogmático.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência natural, mantendo a progressão e a tensão interpretativa do hebraico.
