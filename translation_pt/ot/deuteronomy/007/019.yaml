  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: pt
  text: as grandes provações que os seus olhos viram[a], os sinais, as maravilhas, a mão poderosa e o braço estendido com que Yahweh, seu Deus, fez você sair — assim Yahweh, seu Deus, fará com todos os povos[b] que você teme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as grandes provas”. O termo hebraico pode se referir a testes ou a experiências severas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todas as nações”. “Povos” corresponde mais literalmente ao hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: as grandes provações
  rationale: מַסּוֹת pode indicar provas ou experiências severas. “Provações” comunica naturalmente a dureza dos acontecimentos presenciados no Egito sem sugerir tentação ao pecado.
- source_word: רָאוּ עֵינֶיךָ
  choice: que os seus olhos viram
  rationale: Mantém a referência explícita aos olhos, preservando a ênfase vívida do hebraico na experiência de testemunha ocular.
- source_word: הָאֹתֹת וְהַמֹּפְתִים
  choice: os sinais, as maravilhas
  rationale: “Sinais” é o equivalente comum de אוֹת, e “maravilhas” conserva o caráter extraordinário de מוֹפֵת e o par tradicional, sem restringi-lo antecipadamente a uma categoria técnica.
- source_word: הַיָּד הַחֲזָקָה
  choice: a mão poderosa
  rationale: Preserva a metáfora hebraica da ação divina eficaz; “poderosa” é natural em português e expressa חֲזָקָה nesse contexto.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: o braço estendido
  rationale: Reproduz a imagem hebraica convencional do poder de Deus em ação para libertar e julgar.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: com que ... tirou você de lá
  rationale: A oração relativa retoma naturalmente a mão e o braço como meios da libertação. “De lá” torna explícito em português o ponto de partida implícito pelo Hifil de יצא no contexto do êxodo, sem nomear além do texto imediato.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כֵּן יַעֲשֶׂה
  choice: assim ... fará
  rationale: Preserva de forma concisa a comparação entre os atos passados de libertação e o que Deus fará aos povos temidos.
- source_word: לְכָל הָעַמִּים
  choice: com todos os povos
  rationale: “Povos” traduz literalmente o plural עַמִּים. A construção “fará com” é idiomática em português e deixa o conteúdo da ação ser definido pela comparação anterior.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: que você teme
  rationale: Expressa naturalmente em português o sentido idiomático de temer diante ou por causa deles, sem introduzir uma formulação artificial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva esse nome por transliteração, enquanto “SENHOR” o substituiria por um título e “Jeová” representa uma forma tradicional posterior.
- issue: Relação entre a libertação passada e a ação futura de Deus
  choice: “assim ... fará” mantém a comparação sem especificar além do texto a forma exata da ação
  alternative: explicitar “destruirá” ou “castigará”
  rationale: O verbo עשה é geral (“fazer”). A comparação fornece um sentido de intervenção poderosa, mas o versículo não repete um verbo mais específico; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O singular masculino hebraico dirigido a Israel foi vertido pelo singular inclusivo “você”. A enumeração conserva o ritmo solene do original, enquanto “que você teme” evita uma reprodução pouco natural do idioma hebraico “diante deles”.
