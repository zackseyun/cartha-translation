source:
  edition: WLC
  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: pt
  text: Pois ele desviará seu filho de me seguir[a], e eles servirão a outros deuses[b]; então a ira de Yahweh[c] se acenderá contra vocês, e ele os destruirá rapidamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de depois de mim”, expressão hebraica que significa deixar de me seguir.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico passa do singular “seu filho” ao plural “eles servirão”. Esse plural pode ampliar a advertência para a família, os descendentes ou a comunidade resultante. Ou, regularizando o número: “ele servirá”.'
    reason: alternative_reading
  - marker: c
    text: “Yahweh” representa o nome divino YHWH (יהוה), tradicionalmente traduzido por “SENHOR”. O hebraico diz “contra vocês” no plural, mas depois volta ao singular em “destruirá você”, tratando o povo tanto como comunidade quanto como unidade coletiva.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da proibição do versículo anterior e mantém a ligação explicativa com o contexto.
- source_word: יָסִיר
  choice: desviará
  rationale: 'O hifil de סור tem sentido causativo: ele fará o filho se afastar. “Desviará” expressa isso com naturalidade em português.'
- source_word: בִּנְךָ
  choice: seu filho
  rationale: Conserva o singular masculino do hebraico, coerente com o casamento mencionado no contexto imediato, sem generalizá-lo como “filhos” ou “descendentes”.
- source_word: מֵאַחֲרַי
  choice: de me seguir
  rationale: Traduz de modo natural o idioma hebraico literalmente formulado como “de depois de mim”, isto é, deixar de seguir Yahweh.
- source_word: וְעָבְדוּ
  choice: e eles servirão
  rationale: Mantém o verbo no plural e, assim, preserva a mudança de número depois do singular “seu filho”, sem decidir se o plural abrange a família, os descendentes ou a comunidade.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Equivalente direto e corrente, que conserva o contraste com a lealdade exclusiva a Yahweh.
- source_word: וְחָרָה אַף יְהוָה
  choice: então a ira de Yahweh se acenderá
  rationale: Preserva a imagem hebraica da ira que se acende e torna clara a consequência da infidelidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בָּכֶם
  choice: contra vocês
  rationale: Com a expressão חרה אף, a preposição indica aqueles contra quem a ira se dirige; o sufixo é plural.
- source_word: וְהִשְׁמִידְךָ
  choice: e ele os destruirá
  rationale: שׁמד no hifil comunica destruição completa. O pronome plural produz português claro e retoma o grupo de “vocês”; uma nota registra que o sufixo hebraico volta ao singular.
- source_word: מַהֵר
  choice: rapidamente
  rationale: Conserva a ideia adverbial de um juízo executado sem demora.
theological_decisions:
- issue: Referente e número dos participantes na advertência
  choice: Conservar “seu filho” no singular e “eles servirão” no plural.
  alternative: Uniformizar a frase no singular (“ele servirá”) ou no plural (“seus filhos”).
  rationale: O hebraico muda deliberadamente do filho singular para o verbo plural. A tradução conserva essa tensão, permitindo que o plural indique consequências familiares ou comunitárias sem impor uma interpretação.
- issue: Número do destinatário no anúncio do juízo
  choice: Traduzir בָּכֶם por “contra vocês” e retomar o grupo com “os destruirá”, registrando em nota a volta do hebraico ao singular.
  alternative: Reproduzir rigidamente a alternância como “contra vocês, e ele destruirá você”.
  rationale: O hebraico passa do plural בָּכֶם ao singular וְהִשְׁמִידְךָ, tratando Israel tanto como comunidade quanto como unidade coletiva. A forma escolhida evita uma construção portuguesa artificial, enquanto a nota preserva a informação formal.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: Usa o nome pessoal presente no texto hebraico, sem substituí-lo silenciosamente por um título; a nota informa a convenção alternativa.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Seu filho” evita a marca regional mais forte de “teu filho”. A tradução mantém a mudança singular–plural mais teologicamente relevante e explica em nota a alternância final que não pode ser reproduzida literalmente sem soar artificial.
