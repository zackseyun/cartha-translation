base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: pt
  text: Não tenha medo deles; lembre-se bem[a] do que Yahweh, seu Deus, fez ao faraó e a todo o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “lembrar, você se lembrará” — construção enfática com o sentido de “lembre-se bem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא
  choice: Não tenha medo
  rationale: Neste contexto de exortação, o imperfeito com לֹא expressa uma proibição. A forma portuguesa é direta, natural e mantém a força de ordem.
- source_word: מֵהֶם
  choice: deles
  rationale: Depois do verbo ירא, a preposição מִן introduz aquilo que causa temor; em português, “ter medo deles” comunica naturalmente esse sentido.
- source_word: זָכֹר תִּזְכֹּר
  choice: lembre-se muito bem
  rationale: A construção com infinitivo absoluto seguido do verbo conjugado intensifica a ação. “Muito bem” transmite a ênfase sem produzir uma formulação artificial em português.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: do que ... fez
  rationale: A expressão refere-se naturalmente aos atos históricos já realizados por Deus; o pretérito perfeito preserva esse valor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: O sufixo está na segunda pessoa masculina singular, dirigindo-se a Israel coletivamente como um só interlocutor.
- source_word: לְפַרְעֹה
  choice: ao faraó
  rationale: Com עשה, a preposição לְ pode indicar quem foi afetado pela ação; “fez ao faraó” é idiomático e adequado ao contexto de juízo.
- source_word: וּלְכָל מִצְרָיִם
  choice: e a todo o Egito
  rationale: O hebraico designa coletivamente o Egito, e não explicitamente os egípcios; esta formulação conserva tanto a abrangência como a referência nacional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança em forma transliterada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O imperativo singular conserva o modo como Israel é interpelado coletivamente. O marcador da nota foi colocado junto à expressão enfática a que de fato se refere.
