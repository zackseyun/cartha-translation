  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: pt
  text: E Yahweh afastará de você toda enfermidade. Ele não porá sobre você nenhuma das doenças nocivas do Egito[a] que você conheceu[b]; pelo contrário, ele as porá sobre todos os que odeiam você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “más doenças do Egito” ou “doenças penosas do Egito”. O adjetivo hebraico pode descrever o que é mau, nocivo, grave ou penoso.
    reason: lexical_alternative
  - marker: b
    text: Ou “que você experimentou”. O verbo hebraico traduzido como “conheceu” pode ter aqui sentido ligado à experiência pessoal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: afastará
  rationale: O hifil de סור expressa fazer algo se retirar. “Afastará de você” preserva o sentido causativo e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל חֹלִי
  choice: toda enfermidade
  rationale: חֹלִי designa doença ou enfermidade. O singular coletivo “toda enfermidade” preserva a abrangência da expressão.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: as terríveis doenças do Egito
  rationale: מַדְוֵי é o plural de um termo para doença, e הָרָעִים pode indicar algo mau, nocivo ou penoso. “Terríveis” comunica aqui a gravidade dessas doenças sem sugerir que elas possuam culpa moral.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: que você conheceu
  rationale: Mantém o sentido básico de ידע e deixa aberta sua possível força experiencial no contexto.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: não porá sobre você
  rationale: שׂים com ב descreve pôr ou colocar algo sobre alguém. A formulação conserva a imagem e a negação do hebraico.
- source_word: וּנְתָנָם
  choice: pelo contrário, ele as porá
  rationale: נתן significa literalmente “dar”, mas, aplicado a doenças, “pôr sobre” é idiomático e mantém a continuidade com a oração anterior. “Pelo contrário” explicita o contraste contextual marcado pela conjunção.
- source_word: בְּכָל שֹׂנְאֶיךָ
  choice: sobre todos os que odeiam você
  rationale: O particípio substantivado significa literalmente aqueles que odeiam o destinatário; evita-se o termo mais amplo “inimigos”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto contém diretamente o tetragrama. A transliteração preserva o nome pessoal e não o substitui por um título.
- issue: Alcance da promessa relativa às doenças do Egito
  choice: Apresentá-la como promessa concreta no contexto da aliança, sem ampliá-la além do que o versículo afirma.
  alternative: Interpretá-la como imunidade universal e incondicional a toda doença, ou como referência puramente metafórica.
  rationale: O hebraico fala concretamente de enfermidade e das doenças do Egito, mas o versículo isolado não formula uma doutrina universal de saúde.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O singular “você” reflete os sufixos hebraicos no singular. “Enfermidade” e “doenças” distinguem os dois substantivos do original sem criar uma diferença médica rígida.
