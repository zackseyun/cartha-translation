  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: pt
  text: Não leve uma abominação para dentro da sua casa, senão você se tornará, como ela, destinado à destruição.[a] Deteste-a completamente e abomine-a por completo, pois ela está destinada à destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “posto sob interdição”; tradicionalmente, “amaldiçoado”. O termo hebraico se refere a algo destinado à destruição sob o juízo divino.'
    reason: Registra alternativas tradicionais para חֵרֶם e esclarece seu sentido no contexto.
lexical_decisions:
- source_word: תָבִיא
  choice: leve para dentro
  rationale: O hifil de בוא expressa fazer entrar. “Leve para dentro” comunica com naturalidade o movimento do objeto para o interior da casa.
- source_word: תּוֹעֵבָה
  choice: abominação
  rationale: O termo designa algo fortemente repulsivo no âmbito moral e cultual, aqui em referência aos objetos idolátricos do contexto. “Abominação” preserva sua força teológica.
- source_word: בֵּיתֶךָ
  choice: sua casa
  rationale: Mantém a imagem concreta da casa e a advertência contra introduzir nela o objeto proibido.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: senão você se tornará, como ela, destinado à destruição
  rationale: “Senão” expressa o valor consequencial da conjunção no contexto. “Destinado à destruição” comunica o estado de חֵרֶם sem reduzi-lo à ideia genérica de maldição.
- source_word: חֵרֶם
  choice: destinado à destruição
  rationale: No contexto deuteronômico, refere-se ao que foi separado para destruição sob juízo divino. A formulação é clara em português atual e pode ser aplicada tanto à pessoa quanto ao objeto.
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: Deteste-a completamente
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ordem; “completamente” preserva essa ênfase sem acrescentar uma ideia nova.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: e abomine-a por completo
  rationale: Preserva o segundo verbo do par hebraico e sua construção intensiva, sem fundi-lo com o primeiro.
- source_word: כִּי חֵרֶם הוּא
  choice: pois ela está destinada à destruição
  rationale: A oração causal explica a ordem e repete a mesma tradução de חֵרֶם, preservando o vínculo lexical dentro do versículo.
theological_decisions:
- issue: Sentido de חֵרֶם no contexto do juízo da aliança
  choice: destinado à destruição
  alternative: posto sob interdição; amaldiçoado
  rationale: A expressão preserva a noção de algo separado para destruição sob juízo divino. Evita tanto a opacidade de “interdição” quanto a redução do termo a uma simples maldição.
- issue: Consequência de levar o objeto para casa
  choice: senão você se tornará, como ela, destinado à destruição
  alternative: e você se tornará, como ela, destinado à destruição
  rationale: “Senão” torna natural em português a força consequencial da conjunção hebraica, sem transformar a advertência em mera possibilidade nem resolver além do texto como essa condição seria aplicada.
translation_notes:
  register: Português moderno, claro e digno, com uso de “você” para o destinatário masculino singular. A repetição intensiva e os dois verbos paralelos foram preservados de modo natural. O marcador da nota foi colocado junto à primeira ocorrência da expressão que ela explica.
