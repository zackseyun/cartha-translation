base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: pt
  text: Não foi por vocês serem mais numerosos que os demais povos que Yahweh se afeiçoou a vocês[a] e os escolheu, pois vocês eram o povo menos numeroso de todos os povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pôs seu amor em vocês”. O verbo hebraico expressa forte apego ou afeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: por vocês serem mais numerosos do que todos os outros povos
  rationale: Expressa de modo natural a relação causal-comparativa da construção hebraica sob a negação. “Outros” esclarece que Israel está sendo comparado com os demais povos, sem alterar o sentido.
- source_word: חָשַׁק
  choice: se afeiçoou a
  rationale: O verbo indica forte apego ou afeição dirigida a alguém. A forma pronominal é natural em português e preserva o caráter relacional do termo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּבְחַר
  choice: e os escolheu
  rationale: “Escolher” é a correspondência direta e corrente para בחר e preserva a linguagem da eleição de Israel sem acrescentar elaboração doutrinária.
- source_word: כִּי
  choice: pois
  rationale: Introduz com clareza a explicação da afirmação negativa anterior, em registro digno e corrente.
- source_word: הַמְעַט מִכָּל הָעַמִּים
  choice: o menos numeroso de todos os povos
  rationale: Preserva o contraste estritamente numérico com a primeira oração. O singular trata Israel coletivamente como um povo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico apresenta o nome pessoal divino. A transliteração “Yahweh” o preserva sem substituí-lo por um título.
- issue: Alcance teológico da escolha divina
  choice: e os escolheu
  alternative: e os elegeu
  rationale: “Escolheu” traduz o verbo hebraico sem importar categorias sistemáticas posteriores. O versículo nega que a superioridade numérica de Israel tenha motivado essa escolha, mas não explicita aqui uma causa positiva.
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para a segunda pessoa plural e vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos.
