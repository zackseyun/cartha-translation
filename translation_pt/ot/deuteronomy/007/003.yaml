review_pass:
  verdict: revise
  source_fidelity: 'O sentido central é preservado: a proibição de vínculos matrimoniais com os povos referidos por «eles», seguida pelas duas aplicações familiares, corresponde ao hebraico. Contudo, o hebraico dirige-se no singular à pessoa representativa («não te casarás... não darás... não tomarás»); a forma plural do rascunho perde essa característica formal. «De nenhum deles» é uma explicitação distributiva possível, mas acrescenta uma quantificação negativa que não está expressa literalmente e torna a formulação mais pesada.'
  naturalness: «Façam casamentos com eles» é compreensível, mas pouco idiomático no português moderno. «Não se case com eles» é a formulação corrente, clara e adequada ao registro jurídico-exortativo. A sequência resultante também soa mais natural em português.
  terminology: «Filha» e «filho» mantêm corretamente os termos de parentesco específicos e singulares. «Dar» e «tomar» preservam os verbos simples do hebraico, deixando o contexto matrimonial fornecer a implicação. Não é necessária nota de rodapé, pois não há ambiguidade textual relevante que exija sinalização.
  issues:
  - severity: medium
    issue: Mudança do destinatário singular para o plural
    rationale: As formas hebraicas תִתְחַתֵּן, תִתֵּן e תִקַּח estão no singular masculino. Embora o plural possa adaptar-se ao público contemporâneo, aqui a formulação jurídica representativa no singular pode ser preservada naturalmente em português.
  - severity: low
    issue: «Façam casamentos» é pouco natural
    rationale: A expressão é excessivamente calcada na alternativa formal inglesa e não é a maneira mais idiomática de exprimir casamento em português contemporâneo.
  - severity: low
    issue: «Nenhum deles» explicita além do necessário
    rationale: O hebraico usa o singular possessivo distributivo («seu filho», «sua filha») após o plural «eles». «Deles» preserva a referência coletiva sem introduzir a forma negativa «nenhum».
  revised_text: 'Não se case com eles: não dê sua filha ao filho deles, nem tome a filha deles para seu filho.'
