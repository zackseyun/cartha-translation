  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: pt
  text: 'Não se case com eles: não dê sua filha ao filho deles, nem tome a filha deles para seu filho.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: façam casamentos
  rationale: O hitpael de חתן expressa o estabelecimento de vínculos matrimoniais com os povos mencionados. “Fazer casamentos com” preserva o caráter relacional e coletivo da formulação hebraica sem sugerir apenas o ato individual de casar-se.
- source_word: בָּם
  choice: com eles
  rationale: A preposição com o sufixo masculino plural retoma os povos citados no contexto anterior; “com eles” é claro e natural em português.
- source_word: בִּתְּךָ
  choice: a sua filha
  rationale: Reprodução direta do substantivo singular com sufixo de segunda pessoa masculina singular; o artigo torna a expressão natural em português.
- source_word: תִתֵּן
  choice: dê
  rationale: Mantém o sentido básico de “dar”. O contexto matrimonial esclarece a finalidade, sem exigir o acréscimo interpretativo “em casamento”.
- source_word: לִבְנוֹ
  choice: ao filho de nenhum deles
  rationale: O hebraico muda do referente plural “eles” para o singular distributivo “seu filho”. A formulação portuguesa explicita esse valor distributivo e evita que “dele” tenha antecedente obscuro.
- source_word: וּבִתּוֹ
  choice: a filha de nenhum deles
  rationale: Preserva o singular distributivo do hebraico e identifica com clareza que a filha pertence a qualquer indivíduo dentre os povos anteriormente mencionados.
- source_word: תִקַּח
  choice: tome
  rationale: Conserva o verbo simples “tomar”, cujo sentido matrimonial é definido pelo contexto, sem acrescentar “em casamento” ao texto principal.
- source_word: לִבְנֶךָ
  choice: para o seu filho
  rationale: Expressa naturalmente em português a relação marcada por ל e mantém o substantivo masculino singular do hebraico.
theological_decisions:
- issue: Alcance da proibição
  choice: A proibição se refere a vínculos matrimoniais com os povos identificados no contexto anterior.
  alternative: Entender o versículo como proibição geral de todo casamento com estrangeiros, ou como proibição étnica desligada do contexto da aliança.
  rationale: O pronome “eles” possui referente contextual específico. A tradução não amplia a proibição nem introduz a motivação apresentada no versículo seguinte.
- issue: Termos familiares marcados por gênero
  choice: Manter “filha” e “filho” no singular.
  alternative: Substituir por termos coletivos ou neutros, como “filhos” ou “descendentes”.
  rationale: A formulação jurídica hebraica usa termos de parentesco singulares e específicos quanto ao gênero; preservá-los mantém a forma e os paralelos do texto.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal plural por o discurso se dirigir coletivamente a Israel. A repetição “de nenhum deles” explicita o singular distributivo dos sufixos hebraicos e evita ambiguidades pronominais. Não há notas de rodapé, portanto não são necessários marcadores no texto.
