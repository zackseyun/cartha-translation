  text: Quando vocês se aproximarem da batalha[a], o sacerdote virá à frente e falará ao povo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da guerra”. O hebraico מִלְחָמָה pode indicar a guerra em geral ou uma batalha específica; aqui, a aproximação imediata ao combate favorece “batalha”.
    reason: lexical_alternative
