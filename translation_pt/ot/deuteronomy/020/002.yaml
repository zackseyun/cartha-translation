lexical_decisions:
- source_word: וְהָיָה כְּקָרָבְכֶם
  choice: Quando vocês se aproximarem
  rationale: A construção וְהָיָה seguida de expressão temporal introduz uma circunstância futura. Em português, a oração com futuro do subjuntivo transmite naturalmente esse valor, enquanto קרב mantém o sentido de aproximar-se.
- source_word: אֶל הַמִּלְחָמָה
  choice: da batalha
  rationale: מִלְחָמָה pode designar guerra em geral ou uma batalha específica. Neste contexto de aproximação imediata ao combate, “batalha” é a opção mais precisa; “aproximar-se da batalha” é idiomático em português.
- source_word: וְנִגַּשׁ
  choice: se apresentará
  rationale: נגשׁ significa aproximar-se ou chegar à frente. No contexto de um sacerdote que toma a palavra diante da assembleia, “se apresentará” expressa de modo natural o movimento funcional sem acrescentar uma função não indicada.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Mantém o substantivo definido singular do hebraico sem especificações interpretativas.
- source_word: וְדִבֶּר
  choice: e falará
  rationale: O piel de דבר tem aqui o sentido comum de falar. O futuro coordenado acompanha naturalmente “se apresentará”.
- source_word: אֶל הָעָם
  choice: ao povo
  rationale: Preserva o termo amplo עָם, embora no contexto ele designe os israelitas reunidos para o combate, evitando substituí-lo por um termo militar mais estreito.
