base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: pt
  text: 'Então os oficiais continuarão a falar ao povo e dirão: “Quem é o homem medroso e de coração fraco[a]? Que ele vá e volte para casa, para que ele não derreta o coração de seus irmãos[b], como o seu próprio coração.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “com medo e de coração brando”. O hebraico fala literalmente de alguém “medroso e brando/mole de coração”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” se refere aos outros israelitas ou aos companheiros de combate.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: continuarão
  rationale: O verbo יסף significa literalmente “acrescentar”, mas, seguido de um infinitivo, forma o idioma “continuar a fazer” ou “prosseguir fazendo”. “Continuarão” comunica com naturalidade a progressão do discurso.
- source_word: הַשֹּׁטְרִים
  choice: os oficiais
  rationale: No contexto administrativo e militar de Deuteronômio, שֹׁטְרִים designa encarregados oficiais, não policiais no sentido moderno.
- source_word: מִי הָאִישׁ
  choice: Quem é o homem
  rationale: A expressão hebraica está no masculino singular e se refere a um soldado individual; a formulação preserva essa particularidade do texto.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: medroso e de coração tímido
  rationale: יָרֵא indica alguém que sente medo, enquanto רַךְ הַלֵּבָב significa literalmente “brando/mole de coração” e, no contexto de guerra, descreve falta de coragem. A tradução mantém a imagem do coração sem soar artificial.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Que ele vá e volte para casa
  rationale: Os imperfeitos têm força diretiva ou jussiva. “Que ele vá” preserva essa força, e “volte para casa” expressa naturalmente לְבֵיתוֹ.
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו
  choice: para que não faça o coração de seus irmãos se derreter
  rationale: מסס descreve o ato de derreter e é empregado metaforicamente para a perda da coragem. A construção causativa em português esclarece que o medo desse homem poderia contagiar os demais, preservando a metáfora hebraica.
- source_word: כִּלְבָבוֹ
  choice: como o seu próprio coração
  rationale: A tradução conserva a comparação explícita e a repetição de “coração” presente no hebraico.
theological_decisions:
- issue: Linguagem masculina no contexto militar
  choice: manter “homem” e “irmãos” no texto principal
  alternative: usar “pessoa” e “companheiros” ou “companheiros de armas”
  rationale: O hebraico emprega formas masculinas e linguagem de parentesco em uma convocação militar. A tradução preserva essa textura social e gramatical, enquanto a nota esclarece o alcance contextual de “irmãos”.
- issue: Metáfora da perda de coragem
  choice: preservar a imagem do coração que se derrete
  alternative: traduzir interpretativamente como “para que seus irmãos não percam a coragem”
  rationale: A imagem hebraica é clara no contexto e teologicamente neutra; mantê-la conserva a força retórica sem eliminar seu sentido metafórico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva o tom formal da proclamação militar, mas evita arcaísmos. As metáforas e a linguagem masculina do hebraico foram mantidas, com esclarecimentos em notas.
