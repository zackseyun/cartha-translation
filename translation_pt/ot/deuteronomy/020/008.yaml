  - severity: low
    issue: “para que não faça o coração de seus irmãos se derreter” é uma perífrase pesada.
    rationale: O hebraico emprega diretamente o verbo “derreter” com “o coração de seus irmãos” como objeto. “Para que ele não derreta o coração de seus irmãos” é mais conciso, natural e próximo da construção de origem.
