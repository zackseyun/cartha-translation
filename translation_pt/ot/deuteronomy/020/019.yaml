base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: pt
  text: Quando você cercar uma cidade por muitos dias, lutando contra ela para tomá-la, não destrua as árvores dela usando um machado contra elas, pois você pode comer delas; não as corte. Acaso a árvore do campo é um ser humano, para vir diante de você no cerco?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois o ser humano é árvore do campo”, ou: “pois a árvore do campo é alimento para o ser humano”. O hebraico da frase final é difícil; o texto principal a entende como uma pergunta retórica que contrasta a árvore com um inimigo humano.'
    reason: Leituras alternativas de uma construção hebraica sintaticamente difícil.
lexical_decisions:
- source_word: תָצוּר
  choice: cercar
  rationale: No contexto militar, o verbo descreve pôr uma cidade sob cerco; “cercar” é claro e natural em português.
- source_word: יָמִים רַבִּים
  choice: por muitos dias
  rationale: Mantém de perto a expressão temporal hebraica sem perder naturalidade.
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: lutando contra ela para tomá-la
  rationale: Preserva tanto a ação militar contra a cidade quanto o propósito de capturá-la.
- source_word: לֹא תַשְׁחִית אֶת עֵצָהּ
  choice: não destrua as árvores dela
  rationale: שׁחת no hifil comunica destruição ou ruína; o plural em português expressa naturalmente o substantivo coletivo hebraico.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: manejando contra elas o machado
  rationale: Traduz a expressão idiomática de aplicar ou brandir o machado contra as árvores, conservando sua imagem concreta.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: pois delas você poderá comer
  rationale: Expressa a utilidade alimentar das árvores sem inserir explicitamente “fruto”, palavra ausente no hebraico.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: não as corte
  rationale: כרת é o verbo comum para cortar árvores; o pronome plural retoma naturalmente “árvores” em português.
- source_word: הָאָדָם
  choice: um homem
  rationale: No provável contraste retórico, אָדָם designa o adversário humano, em oposição à árvore que não participa do combate.
- source_word: עֵץ הַשָּׂדֶה
  choice: a árvore do campo
  rationale: Conserva a construção hebraica e o caráter proverbial da frase.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: para vir diante de você no cerco
  rationale: Permanece próxima da formulação hebraica, reconhecidamente difícil, sem acrescentar uma ação militar não expressa.
theological_decisions:
- issue: Interpretação de כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: Pergunta retórica que contrasta a árvore com um adversário humano
  alternative: Declaração de que o ser humano é árvore do campo, ou de que a árvore do campo serve de alimento ao ser humano
  rationale: A sintaxe hebraica admite mais de uma leitura. A pergunta retórica se ajusta ao contexto imediato, no qual as árvores não devem ser tratadas como combatentes, mas as alternativas genuínas são mantidas em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” mantém clareza contemporânea; a formulação da frase final conserva deliberadamente parte da tensão do original.
