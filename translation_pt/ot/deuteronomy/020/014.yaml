  text: רַ֣ק הַ֠/נָּשִׁים וְ/הַ/טַּ֨ף וְ/הַ/בְּהֵמָ֜ה וְ/כֹל֩ אֲשֶׁ֨ר יִהְיֶ֥ה בָ/עִ֛יר כָּל שְׁלָלָ֖/הּ תָּבֹ֣ז לָ֑/ךְ וְ/אָֽכַלְתָּ֙ אֶת שְׁלַ֣ל אֹיְבֶ֔י/ךָ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: pt
  text: Somente as mulheres, as crianças pequenas, os animais domésticos e tudo o que houver na cidade — todo o seu despojo — você poderá tomar para si como saque; e poderá comer[a] o despojo dos seus inimigos, que Yahweh, seu Deus, lhe deu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “poderá usar o despojo dos seus inimigos”. O verbo hebraico significa literalmente “comer”, mas pode estender-se ao uso ou consumo daquilo que foi tomado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Marca a exceção restritiva em relação à ordem anterior e mantém a força concisa do hebraico.
- source_word: הַנָּשִׁים
  choice: as mulheres
  rationale: Tradução direta do substantivo plural específico.
- source_word: הַטַּף
  choice: as crianças pequenas
  rationale: טַף costuma designar crianças novas ou pequenos dependentes; a formulação explicita a idade sem ampliar para todos os dependentes.
- source_word: הַבְּהֵמָה
  choice: os animais domésticos
  rationale: No contexto de despojos de guerra, refere-se aos animais mantidos como propriedade; evita restringir o termo a gado bovino.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: e tudo o que houver na cidade
  rationale: Preserva a abrangência da expressão e o valor prospectivo/contextual de יִהְיֶה em português natural.
- source_word: כָּל שְׁלָלָהּ
  choice: todos os seus despojos
  rationale: שָׁלָל designa bens tomados na guerra; “despojos” mantém essa referência e permite conservar a repetição lexical seguinte.
- source_word: תָּבֹז לָךְ
  choice: você poderá tomar como saque para si
  rationale: Expressa a ação de saquear e, no contexto legal, a autorização comunicada pela forma verbal, sem convertê-la numa ordem categórica.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: e poderá comer os despojos dos seus inimigos
  rationale: Mantém o sentido literal de אָכַל, “comer”, preservando também sua possível extensão metafórica a usar ou consumir os bens capturados.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de modo natural a expressão pactual com sufixo de segunda pessoa singular.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: que Yahweh, seu Deus, lhe deu
  rationale: O perfeito נָתַן é vertido pelo pretérito perfeito, apresentando a concessão divina como ação realizada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Força dos verbos de segunda pessoa na instrução legal
  choice: forma permissiva “poderá”
  alternative: forma prescritiva “deverá” ou futuro simples
  rationale: O contexto autoriza Israel a tomar e usar os despojos. “Poderá” comunica essa permissão sem eliminar por completo o caráter instrutivo da legislação.
- issue: Alcance de אָכַל aplicado aos despojos
  choice: manter “comer” no texto e explicar a extensão possível em nota
  alternative: “usar”, “consumir” ou “desfrutar”
  rationale: A tradução literal preserva a imagem hebraica e sua tensão sem restringir silenciosamente os despojos a alimentos nem substituir a metáfora por uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular “você” representa o destinatário masculino singular coletivo do discurso. A repetição de “despojos” conserva a coesão lexical do hebraico; “saque” evita uma construção portuguesa pesada com o verbo cognato.
