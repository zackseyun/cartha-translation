  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: pt
  text: Quando você se aproximar de uma cidade para lutar contra ela, proponha-lhe a paz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “proclame-lhe paz”; também pode ser entendido como “ofereça-lhe termos de paz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz aqui a circunstância em que a instrução deve ser cumprida; em português, “quando” se ajusta naturalmente ao contexto legal.
- source_word: תִקְרַב
  choice: você se aproximar
  rationale: Expressa de modo claro e atual o movimento de chegar perto da cidade.
- source_word: עִיר
  choice: uma cidade
  rationale: Tradução direta do substantivo singular com sentido indefinido.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: para lutar contra ela
  rationale: Mantém a finalidade e a direção hostil expressas no hebraico; “ela” concorda naturalmente com “cidade” em português.
- source_word: וְקָרָאתָ אֵלֶיהָ לְשָׁלוֹם
  choice: proponha-lhe a paz
  rationale: Reproduz de forma idiomática o ato de dirigir à cidade uma proposta de paz, sem pressupor detalhes adicionais sobre seus termos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção idiomática de ampla compreensão. O imperativo “proponha” comunica a força normativa da forma verbal hebraica no discurso legal. O pronome “você” mantém clareza para o leitor brasileiro sem recorrer a regionalismos.
