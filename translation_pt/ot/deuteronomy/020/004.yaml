base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: pt
  text: Pois Yahweh, o Deus de vocês, é quem vai com vocês para lutar por vocês contra os seus inimigos e salvá-los.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livrá-los” ou “dar-lhes a vitória”. O verbo hebraico pode indicar salvação ou livramento; aqui, no contexto de batalha, inclui a ideia de vitória.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exortação anterior e preserva de modo natural o valor explicativo da conjunção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Representa a construção com sufixo de segunda pessoa masculina plural em português claro e amplamente compreensível.
- source_word: הַהֹלֵךְ
  choice: é quem vai
  rationale: Preserva o caráter descritivo do particípio e soa natural em português.
- source_word: עִמָּכֶם
  choice: com vocês
  rationale: Expressa diretamente o acompanhamento divino.
- source_word: לְהִלָּחֵם
  choice: para lutar
  rationale: Verte de forma clara o infinitivo ligado ao contexto de combate.
- source_word: לָכֶם
  choice: por vocês
  rationale: 'Expressa o dativo de vantagem: Yahweh combate em favor do povo.'
- source_word: עִם אֹיְבֵיכֶם
  choice: contra os seus inimigos
  rationale: No contexto do verbo lutar, a preposição indica oposição; 'contra' comunica corretamente esse sentido em português.
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: e salvá-los
  rationale: Mantém o sentido amplo de salvar ou livrar, sem reduzi-lo exclusivamente à ideia de vitória militar; a coordenação com 'e' é idiomática e expressa o propósito adicional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome divino; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Alcance de לְהוֹשִׁיעַ no contexto militar
  choice: salvá-los
  alternative: livrá-los; dar-lhes a vitória
  rationale: '''Salvar'' conserva a amplitude lexical e a ressonância teológica do verbo, enquanto o contexto deixa claro que aqui a salvação inclui livramento no combate e vitória.'
translation_notes:
  register: Português moderno, digno e de leitura natural, com 'vocês' para o plural e colocação pronominal padrão. A repetição de 'vocês' reflete a ênfase do hebraico no acompanhamento e na ação de Yahweh em favor do povo.
