base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: pt
  text: Assim[a] você fará com todas as cidades que estiverem muito distantes de você, que não pertençam a estas nações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Desse modo” ou “É assim que”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “que não são das cidades destas nações”; o sentido é que essas cidades não pertencem às nações mencionadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Retoma a maneira de agir descrita no contexto anterior e mantém, com concisão, o tom de instrução legal.
- source_word: תַּעֲשֶׂה
  choice: você fará
  rationale: O imperfeito qal de segunda pessoa masculina singular tem aqui força diretiva. O futuro do indicativo é uma forma natural de expressar essa instrução em português.
- source_word: לְכָל הֶעָרִים
  choice: com todas as cidades
  rationale: Neste contexto, a preposição introduz as cidades afetadas pela ação. “Fazer com” é natural em português e corresponde bem à construção hebraica.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: que estiverem muito distantes de você
  rationale: Preserva tanto a ideia espacial quanto a intensificação de מְאֹד, em linguagem corrente e digna.
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: e que não forem cidades de
  rationale: Expressa idiomaticamente a exclusão dessas cidades do grupo pertencente às nações mencionadas, sem reproduzir de modo obscuro a construção partitiva hebraica.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: destas nações
  rationale: “Nações” se ajusta ao contexto geopolítico de Deuteronômio e evita conotações posteriores que “gentios” poderia introduzir.
- source_word: הֵנָּה
  choice: incorporado em “destas nações”
  rationale: O pronome feminino plural reforça a referência às nações indicadas. Em português, sua força é expressa naturalmente pelo demonstrativo “destas”.
theological_decisions:
- issue: Distinção entre as cidades distantes e as cidades das nações mencionadas no contexto imediato
  choice: Apresentar o versículo como delimitando a aplicação das instruções anteriores às cidades distantes que não pertencem às nações indicadas.
  alternative: Generalizar a referência para quaisquer cidades estrangeiras ou inserir no versículo uma explicação detalhada das regras de cerco anteriores.
  rationale: O texto funciona como uma delimitação jurídica. A tradução conserva essa distinção sem suavizar sua força militar nem importar para o versículo explicações do contexto adjacente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Você” comunica de modo natural o singular hebraico; a formulação preserva o caráter diretivo da legislação sem recorrer a linguagem arcaica.
