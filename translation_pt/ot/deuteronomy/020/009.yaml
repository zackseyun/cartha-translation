translation:
  language: pt
  text: Quando os oficiais terminarem de falar ao povo, designarão[a] comandantes das tropas à frente do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passarão em revista os comandantes das tropas à frente do povo”. O verbo hebraico pode significar designar, reunir para revista ou pôr no comando, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: Quando ... terminarem
  rationale: A fórmula וְהָיָה seguida de כְּ com infinitivo introduz aqui uma oração temporal; o futuro do subjuntivo expressa naturalmente em português a conclusão da fala antes da ação seguinte.
- source_word: הַשֹּׁטְרִים
  choice: os oficiais
  rationale: Em Deuteronômio, o termo designa agentes administrativos responsáveis por instruir e organizar o povo; “oficiais” é claro no contexto cívico-militar sem reduzi-los a escribas.
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: falar ao povo
  rationale: Mantém o sentido direto do hebraico e evita especificar “soldados” ou “tropas” onde o texto diz עָם, “povo”.
- source_word: וּפָקְדוּ
  choice: designarão
  rationale: O verbo פקד possui amplo campo semântico, incluindo designar, reunir para revista e pôr alguém no comando. Com comandantes como objeto e a indicação de posição à frente do povo, “designarão” se ajusta bem ao contexto, sem ocultar a alternativa lexical registrada em nota.
- source_word: שָׂרֵי צְבָאוֹת
  choice: comandantes das tropas
  rationale: שָׂרֵי indica chefes ou comandantes, e צְבָאוֹת se refere aqui às forças militares. “Comandantes das tropas” é natural e inteligível em português contemporâneo.
- source_word: בְּרֹאשׁ הָעָם
  choice: à frente do povo
  rationale: Preserva a imagem hebraica de posição na cabeça do povo, que neste contexto comunica liderança, sem substituí-la diretamente pela interpretação “sobre o povo”.
