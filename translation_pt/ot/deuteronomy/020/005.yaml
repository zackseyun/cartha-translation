  text: וְ/דִבְּר֣וּ הַ/שֹּֽׁטְרִים֮ אֶל הָ/עָ֣ם לֵ/אמֹר֒ מִֽי הָ/אִ֞ישׁ אֲשֶׁ֨ר בָּנָ֤ה בַֽיִת חָדָשׁ֙ וְ/לֹ֣א חֲנָכ֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יַחְנְכֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: pt
  text: 'Então os oficiais falarão ao povo: “Quem é o homem que construiu uma casa nova e ainda não a inaugurou[a]? Que ele vá e volte para sua casa, para que não morra na batalha e outro homem a inaugure.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dedicou”. O verbo hebraico se refere ao começo formal do uso da casa nova, muitas vezes com sentido de dedicação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: os oficiais
  rationale: No contexto administrativo e militar de Deuteronômio, o termo designa funcionários investidos de autoridade; “oficiais” é claro e adequado sem reduzi-los a escribas.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o sentido direto do hebraico, embora aqui o referente contextual seja a população masculina reunida para a guerra.
- source_word: מִי הָאִישׁ
  choice: Quem é o homem
  rationale: Mantém o singular masculino explícito do hebraico, pertinente ao contexto dos homens convocados para a batalha.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: construiu uma casa nova
  rationale: Reproduz diretamente a ação e o substantivo hebraicos em português natural.
- source_word: וְלֹא חֲנָכוֹ
  choice: e ainda não a inaugurou
  rationale: “Inaugurou” comunica o início formal do uso da casa e evita que “dedicou” seja entendido exclusivamente como consagração religiosa; “ainda” expressa naturalmente a situação não concluída sem alterar seu sentido.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Que ele vá e volte para sua casa
  rationale: Os imperfeitos têm força diretiva neste procedimento legal; a construção com “que” transmite essa força com naturalidade.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: para que não morra na batalha
  rationale: Expressa a prevenção introduzida por פֶּן e mantém o caráter concreto da batalha mencionada.
- source_word: וְאִישׁ אַחֵר
  choice: e outro homem
  rationale: Conserva tanto o singular quanto a referência masculina explícita do original.
- source_word: יַחְנְכֶנּוּ
  choice: a inaugure
  rationale: Repete a mesma escolha lexical usada para חנך anteriormente, preservando a repetição intencional do hebraico.
theological_decisions:
- issue: Possível sentido dedicatório de חנך aplicado à casa
  choice: inaugurou
  alternative: dedicou
  rationale: O verbo pode incluir uma cerimônia ou sentido dedicatório, mas também indica o começo formal do uso. “Inaugurou” preserva essa amplitude melhor no português corrente, enquanto a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do hebraico sem rigidez. Mantiveram-se “oficiais”, “povo”, “homem” e “batalha” para conservar a precisão do contexto administrativo e militar, bem como a linguagem explicitamente masculina do versículo.
