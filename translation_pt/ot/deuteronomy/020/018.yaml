  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: pt
  text: para que não lhes ensinem a praticar conforme todas as abominações que eles praticaram para os seus deuses[a], e vocês pequem contra Yahweh, o seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos seus deuses”.'
    reason: O ל de לֵאלֹהֵיהֶם pode indicar atos feitos para os deuses ou dirigidos a eles.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר לֹא
  choice: para que não
  rationale: Expressa naturalmente em português a finalidade preventiva introduzida pela locução hebraica.
- source_word: יְלַמְּדוּ אֶתְכֶם
  choice: ensinem vocês
  rationale: Preserva o sentido direto de למד no piel e torna explícito o objeto plural em português corrente.
- source_word: לַעֲשׂוֹת כְּכֹל תּוֹעֲבֹתָם
  choice: a praticar todas as abominações
  rationale: “Praticar” é idiomático para atos religiosos reiterados; “todas as abominações” mantém a força moral e cultual de תועבה. A ideia conformativa de כ é comunicada pelo ensino voltado à imitação dessas práticas.
- source_word: אֲשֶׁר עָשׂוּ
  choice: que eles praticaram
  rationale: Retoma as abominações como práticas efetivamente realizadas, evitando a expressão pouco natural “fizeram abominações”.
- source_word: לֵאלֹהֵיהֶם
  choice: para os seus deuses
  rationale: O ל pode indicar aquilo em cuja honra ou serviço os atos eram praticados; “para” conserva essa relação, enquanto “a” permanece alternativa possível.
- source_word: וַחֲטָאתֶם
  choice: levando vocês a pecar
  rationale: Comunica a consequência prevista na sequência hebraica sem sugerir que o pecado seja a finalidade desejada.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: contra Yahweh, o seu Deus
  rationale: Com חטא, ל assinala a parte ofendida e é naturalmente traduzido por “contra”; o nome divino é transliterado como Yahweh.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome pactual presente no texto hebraico, sem substituí-lo por um título.
- issue: Relação lógica de וַחֲטָאתֶם
  choice: 'consequência: “levando vocês a pecar”'
  alternative: 'coordenação: “e vocês pecariam”'
  rationale: O contexto apresenta o pecado como resultado de aprender e imitar as práticas; a formulação escolhida explicita essa relação sem apagar a ligação sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e mantém “abominações” pela força e coerência intertextual do termo.
