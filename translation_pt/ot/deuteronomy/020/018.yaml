  to: para que não lhes ensinem a praticar conforme todas as abominações que eles praticaram para os seus deuses[a], e vocês pequem contra Yahweh, o seu Deus.
  rationale: A revisão explicita «conforme», que traduz a preposição כ em כְּכֹל; substitui a ordem menos idiomática «ensinem vocês» por «lhes ensinem»; e restaura uma oração coordenada finita para o resultado de וַחֲטָאתֶם. Mantêm-se Yahweh, «abominações» e a alternativa lexical da nota.
