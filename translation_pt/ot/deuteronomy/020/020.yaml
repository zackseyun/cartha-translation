  source_fidelity: A cláusula final עַד רִדְתָּהּ emprega o infinitivo de ירד (“descer/cair”) com sufixo referente à cidade. Não expressa de forma inequívoca uma ação causativa de segunda pessoa. Portanto, “até fazê-la cair” acrescenta uma causatividade que o hebraico não marca; “até que ela caia” preserva a imagem e a ambiguidade do original.
  naturalness: O texto é claro e de registro adequado. A revisão também torna mais idiomática a sequência de ações aplicadas às árvores, com “derrubá-las” para o corte de árvores.
  terminology: “Obras de cerco” é uma boa tradução ampla de מָצוֹר e a nota correspondente preserva alternativas sem especificar indevidamente uma única estrutura. “Guerreando contra você” é natural no contexto militar.
