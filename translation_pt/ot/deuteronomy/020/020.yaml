  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: pt
  text: Somente as árvores que você souber que não servem para alimento você poderá destruí-las e derrubá-las, e construir obras de cerco[a] contra a cidade que está guerreando contra você, até que ela caia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma rampa de cerco” ou “fortificações de cerco”. O termo hebraico מָצוֹר pode designar genericamente estruturas de cerco, não apenas uma construção específica.
    reason: lexical_alternative
  - marker: b
    text: Ou “até a sua queda”. O hebraico emprega um verbo de descida para descrever a derrota da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Introduz a exceção à proibição do versículo anterior e conserva de modo conciso sua força restritiva.
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: árvores ... servem para alimento
  rationale: O contexto trata de árvores vivas. A formulação comunica que não produzem alimento aproveitável sem restringir indevidamente a expressão a uma classificação botânica.
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: que você souber que não servem
  rationale: Expressa o conhecimento verificável exigido no hebraico e verte naturalmente para o plural o singular distributivo.
- source_word: אֹתוֹ תַשְׁחִית
  choice: essas você poderá destruir
  rationale: O pronome singular hebraico tem sentido distributivo. “Poderá” expressa permissão dentro desta instrução legal, e “destruir” mantém a força militar do hifil de שׁחת.
- source_word: וְכָרָתָּ
  choice: e cortar
  rationale: כרת, aplicado a árvores, indica cortá-las ou derrubá-las; “cortar” é claro e não acrescenta um método específico.
- source_word: וּבָנִיתָ מָצוֹר
  choice: e construirá obras de cerco
  rationale: מָצוֹר pode designar de modo amplo estruturas e fortificações de cerco; o plural coletivo em português evita especificar apenas uma rampa ou uma única construção.
- source_word: עַל הָעִיר
  choice: contra a cidade
  rationale: No contexto militar, “contra” comunica a função hostil das obras de cerco com mais naturalidade do que uma reprodução espacial rígida de עַל.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: que está guerreando contra você
  rationale: Reproduz o aspecto contínuo do particípio e traduz naturalmente o idioma hebraico “fazer guerra com”.
- source_word: עַד רִדְתָּהּ
  choice: até fazê-la cair
  rationale: Mantém a ação causativa da segunda pessoa e a imagem de descida ou queda empregada para a derrota da cidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tratamento singular por “você”. A coordenação do hebraico foi preservada, enquanto o singular distributivo foi vertido naturalmente no plural. Os marcadores das notas foram posicionados junto às expressões a que efetivamente se referem.
