  verdict: revise
  source_fidelity: A tradução preserva adequadamente o contraste de כִּי, a intensificação de הַחֲרֵם תַּחֲרִימֵם, a lista dos seis povos e a referência a Yahweh como Deus de Israel. A formulação principal deve conservar explicitamente a noção de destinação total à destruição, própria de חרם neste contexto.
  naturalness: “Consagrá-los totalmente à destruição” é compreensível, mas “devotá-los totalmente à destruição” exprime com mais naturalidade em português a destinação sob o חרם. A pontuação com travessão seguido de vírgula antes de “conforme” é evitada com a substituição por “como”.
  terminology: “Yahweh” e os gentílicos estão adequados. “Anátema” é útil como alternativa técnica em nota, mas deve ser explicado para não ser entendido apenas no sentido moderno de maldição.
