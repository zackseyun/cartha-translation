base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: pt
  text: Pelo contrário, vocês devem devotá-los totalmente à destruição[a] — os hititas, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus —, como Yahweh, o Deus de vocês, lhes ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “vocês certamente os colocarão sob o anátema”; a construção é enfática e o verbo se refere a destiná-los por completo à destruição.'
    reason: Esclarece a construção hebraica enfática e preserva a nuance cultual e jurídica de חרם.
lexical_decisions:
- source_word: כִּי
  choice: Pelo contrário
  rationale: Neste contexto, a conjunção contrasta esta ordem com a permissão do versículo anterior de poupar as cidades distantes.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: vocês devem consagrá-los totalmente à destruição
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ordem. חרם expressa a entrega completa ao anátema, que neste contexto implica destruição, e não apenas o ato comum de matar.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: os hititas, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus
  rationale: Formas étnicas tradicionais e amplamente reconhecidas em português, vertidas no plural por seu sentido coletivo.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: conforme ... lhes ordenou
  rationale: Expressa naturalmente a conformidade da ação com a ordem divina anterior; o pronome plural acompanha o tratamento contextual de Israel como audiência coletiva.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, o Deus de vocês
  rationale: Preserva o nome pessoal divino representado pelo tetragrama e traduz de modo claro a expressão pactual com sufixo de segunda pessoa.
theological_decisions:
- issue: Sentido de חרם na ordem de guerra
  choice: consagrá-los totalmente à destruição
  alternative: destruí-los por completo; colocá-los sob o anátema
  rationale: A formulação mantém tanto a dimensão de entrega total a uma determinação divina quanto seu resultado destrutivo no contexto, sem reduzir o termo a uma referência genérica a matar.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal no texto hebraico em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês/lhes” explicita naturalmente que Moisés se dirige ao povo de Israel, embora o hebraico empregue formas gramaticais singulares coletivas.
