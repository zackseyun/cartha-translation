    rationale: “Devotar ... à destruição” comunica de modo mais idiomático a destinação total implicada pelo חרם do que “consagrar ... à destruição”, sem reduzir a expressão a simples matar.
  - severity: low
    issue: Pontuação e conectivo da oração final
    rationale: A sequência “— ..., conforme” é pouco fluida. “— ... —, como Yahweh ... ordenou” organiza naturalmente os apostos e a comparação do hebraico.
