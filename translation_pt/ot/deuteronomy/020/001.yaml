base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: pt
  text: Quando você sair para a guerra contra os seus inimigos e vir cavalos e carros de guerra[a], um povo mais numeroso do que você[b], não tenha medo deles, pois Yahweh, seu Deus, está com você — aquele que fez você subir da terra do Egito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cavalo e carro de guerra”; os substantivos hebraicos estão no singular, provavelmente com sentido coletivo para as forças militares.
    reason: lexical_alternative
  - marker: b
    text: Ou “um povo maior do que você”. A expressão provavelmente destaca que o povo inimigo é superior em número.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, “aquele que fez você subir da terra do Egito”, evocando o êxodo como fundamento da confiança de Israel.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: Quando você sair para a guerra
  rationale: כִּי introduz aqui uma situação futura, e o idioma יצא למלחמה descreve sair para um conflito militar. A formulação é natural em português e mantém a imagem hebraica.
- source_word: עַל אֹיְבֶיךָ
  choice: contra os seus inimigos
  rationale: Com ação hostil, עַל tem naturalmente o sentido de “contra”; o plural e o sufixo de segunda pessoa são preservados.
- source_word: וְרָאִיתָ סוּס וָרֶכֶב
  choice: e vir cavalos e carros de guerra
  rationale: O verbo prossegue a situação futura. Os substantivos hebraicos singulares têm provável valor coletivo; o plural em português comunica esse sentido com clareza. “Carros de guerra” evita a leitura de veículos comuns.
- source_word: עַם רַב מִמְּךָ
  choice: um povo mais numeroso do que você
  rationale: רַב na construção comparativa indica sobretudo superioridade numérica, sem restringir “povo” a “exército” nem converter a ideia em força militar genérica.
- source_word: לֹא תִירָא מֵהֶם
  choice: não tenha medo deles
  rationale: O imperfeito funciona como proibição. Esta expressão é corrente e digna em português, além de transmitir diretamente o sentido de temor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: seu Deus, está com você
  rationale: Preserva diretamente a afirmação da presença de Deus com Israel.
- source_word: הַמַּעַלְךָ
  choice: aquele que o fez subir
  rationale: O particípio com artigo identifica Yahweh como aquele que realizou a ação. “Fez subir” conserva a direção expressa pelo verbo hebraico, em vez de assimilá-la a “tirou”.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Reproduz de modo natural e formalmente próximo a expressão geográfica hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva explicitamente esse nome sem substituí-lo por um título.
- issue: Relação de הַמַּעַלְךָ com a afirmação anterior
  choice: aquele que o fez subir da terra do Egito
  alternative: pois foi ele quem o fez subir da terra do Egito
  rationale: A aposição mantém a forma hebraica e deixa o êxodo como identificação de Yahweh e fundamento da confiança, sem acrescentar uma nova oração causal explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “você” para o singular hebraico e “carros de guerra” para desambiguar רֶכֶב. O travessão sinaliza naturalmente a aposição final sem eliminar sua ligação sintática com Yahweh.
