base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: pt
  text: E acontecerá que, se ela lhe responder em paz[a] e se abrir para você, todo o povo que nela se encontrar ficará sujeito a trabalho forçado[b] para você e o servirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhe responder com termos de paz”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficará sujeito a trabalho tributário”. O termo hebraico מַס pode indicar tributo, prestação compulsória ou trabalho forçado; neste contexto, a referência ao serviço favorece o sentido de trabalho compulsório.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: em paz
  rationale: Mantém visível o substantivo hebraico e expressa, no contexto militar, uma resposta pacífica à proposta do versículo anterior, sem convertê-lo no termo mais específico «condições de paz».
- source_word: תַּעַנְךָ
  choice: lhe responder
  rationale: Traduz diretamente o sentido de «responder». O pronome feminino «ela» retoma a cidade personificada no contexto.
- source_word: וּפָתְחָה לָךְ
  choice: se abrir para você
  rationale: O hebraico diz literalmente «abrir» sem mencionar portões. A forma reflexiva produz português natural e evita acrescentar um objeto não expresso.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: todo o povo que nela se encontrar
  rationale: Preserva a ideia do particípio de מצא, «ser encontrado/encontrar-se», em uma construção corrente em português.
- source_word: לָמַס
  choice: ficará sujeito a trabalhos forçados
  rationale: מַס pode indicar tributo, serviço compulsório ou corveia. Aqui, a oração seguinte sobre servir favorece a sujeição a trabalho compulsório; a formulação conserva a força coercitiva sem identificar uma instituição posterior específica.
- source_word: וַעֲבָדוּךָ
  choice: e o servirá
  rationale: Traduz de modo direto עבד, «servir/trabalhar», e mantém a relação de sujeição sem ampliá-la para uma categoria jurídica mais específica.
theological_decisions:
- issue: Linguagem de subjugação em uma lei de guerra
  choice: Conservar explicitamente a imposição de trabalhos forçados e serviço.
  alternative: Traduzir apenas como pagamento de tributo ou suavizar para uma obrigação genérica.
  rationale: O texto descreve a consequência coercitiva para uma cidade que aceita a paz. A tradução não deve amenizar a severidade histórica de מַס nem especificar além do que o hebraico permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura «E acontecerá que» conserva a sequência jurídica hebraica; «você» comunica com clareza o singular de segunda pessoa. A concordância passa de «todo o povo» no singular coletivo para «o servirá».
