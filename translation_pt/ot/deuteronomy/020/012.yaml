base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: pt
  text: Mas, se ela não fizer paz com você e fizer guerra contra você, então você a sitiará.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Mas, se ... não
  rationale: A conjunção introduz a alternativa contrastante ao desfecho pacífico do versículo anterior; “Mas, se” expressa naturalmente esse contraste.
- source_word: תַשְׁלִים עִמָּךְ
  choice: fizer paz com você
  rationale: O hifil de שׁלם, seguido de עִם, indica estabelecer ou concluir relações pacíficas. “Fazer paz com” é claro, corrente e próximo da construção hebraica.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: e sim guerrear contra você
  rationale: A expressão עשה מלחמה significa fazer ou travar guerra. “Guerrear contra você” soa natural em português e, após a negação, “e sim” explicita o contraste já presente na sequência hebraica sem alterar o sentido.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: então você a sitiará
  rationale: צור com עַל significa cercar militarmente uma cidade. O futuro traduz adequadamente a força instrutiva da forma verbal neste contexto legal, e o pronome feminino retoma “cidade” do contexto.
