  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: pt
  text: Mas, das cidades destes povos que Yahweh, seu Deus, lhe dá como herança, não deixe com vida nenhum ser que respira[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nada que respire”. Hebraico: “todo ser que respira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Mas
  rationale: Introduz a exceção contrastante às instruções anteriores sobre cidades distantes; “Mas” expressa esse contraste com naturalidade.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: nas cidades destes povos
  rationale: Embora מִן tenha normalmente valor de origem, aqui a expressão delimita as cidades às quais se aplica a ordem; “nas cidades” comunica isso de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: lhe dá como herança
  rationale: Mantém o sentido da concessão da terra e preserva a terminologia pactual de נַחֲלָה, sem tornar a frase artificial em português.
- source_word: לֹא תְחַיֶּה
  choice: não deixe com vida
  rationale: 'Reproduz o valor causativo do Piel de חיה: não permitir que continue vivo, em vez de usar uma paráfrase como “não poupe”.'
- source_word: כָּל נְשָׁמָה
  choice: nenhum ser que respira
  rationale: No contexto, a expressão designa todo ser dotado de respiração. A formulação conserva a imagem concreta do hebraico e evita o sentido moderno potencialmente enganoso de “alma”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome pactual; a transliteração preserva o nome próprio sem substituí-lo por um título.
- issue: Terminologia da terra pactual em נַחֲלָה
  choice: como herança
  alternative: como propriedade; por possessão
  rationale: “Herança” preserva o peso pactual da concessão da terra sem acrescentar uma interpretação não expressa no hebraico.
- issue: Abrangência de כָּל נְשָׁמָה
  choice: nenhum ser que respira
  alternative: nada que respire; nenhum ser vivo
  rationale: A tradução mantém a abrangência e a imagem respiratória do hebraico, sem restringir silenciosamente o referente a pessoas nem ampliá-lo por explicação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “não deixe com vida” preserva a força causativa do hebraico; “ser que respira” mantém sua imagem concreta sem soar excessivamente técnica.
