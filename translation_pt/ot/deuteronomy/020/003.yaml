base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: pt
  text: 'e lhes dirá: “Ouça, Israel! Hoje vocês se aproximam da batalha contra os seus inimigos. Não percam a coragem[a]. Não tenham medo, não entrem em pânico nem fiquem apavorados diante deles[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Que o coração de vocês não enfraqueça”. A expressão hebraica se refere à perda da coragem.
    reason: lexical_alternative
  - marker: b
    text: O hebraico acumula três proibições — não ter medo, não entrar em pânico e não ficar apavorado — intensificando a convocação à coragem diante do inimigo.
    reason: literary_clarification
lexical_decisions:
- source_word: וְאָמַר אֲלֵהֶם
  choice: e lhes dirá
  rationale: O perfeito com waw dá continuidade à instrução do contexto; em português, o futuro expressa naturalmente o procedimento prescrito, mantendo o sacerdote como sujeito singular.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Ouça, Israel!
  rationale: Preserva a fórmula de convocação característica de Deuteronômio e seu sentido de escutar com atenção e responder.
- source_word: אַתֶּם קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: Hoje vocês se aproximam da batalha
  rationale: O presente traduz o particípio de ação iminente, e “se aproximam” conserva a imagem espacial do hebraico sem tornar a frase artificial.
- source_word: עַל אֹיְבֵיכֶם
  choice: contra os seus inimigos
  rationale: No contexto militar, עַל indica oposição hostil e é traduzido naturalmente por “contra”.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: Não percam a coragem
  rationale: A expressão hebraica descreve o enfraquecimento do coração, isto é, o colapso da coragem. A formulação escolhida comunica a função do idioma em português atual, enquanto a nota preserva sua imagem literal.
- source_word: אַל תִּירְאוּ
  choice: Não tenham medo
  rationale: Equivalente português direto e natural para a proibição formada com ירא.
- source_word: וְאַל תַּחְפְּזוּ
  choice: não entrem em pânico
  rationale: Neste contexto de batalha, o verbo indica uma reação agitada e alarmada, não simples pressa.
- source_word: וְאַל תַּעַרְצוּ
  choice: nem fiquem apavorados
  rationale: Expressa o forte temor causado pela presença do inimigo e conserva a intensificação da série de proibições.
- source_word: מִפְּנֵיהֶם
  choice: diante deles
  rationale: Mantém a imagem relacional de estar perante os inimigos, sem reduzir a expressão a uma causalidade explícita.
