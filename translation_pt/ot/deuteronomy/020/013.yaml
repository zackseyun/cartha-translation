base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: pt
  text: E Javé, seu Deus, a entregará em sua mão, e você matará ao fio da espada todos os que nela forem do sexo masculino.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico especifica todos os indivíduos do sexo masculino, em vez de empregar um termo mais geral como «homens».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: e ... a entregará
  rationale: O verbo נתן com sufixo de objeto feminino singular retoma a cidade. O futuro expressa naturalmente, em português, a sequência anunciada no contexto, enquanto «a» preserva a referência à cidade.
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, em vez de substituí-lo pelo título «SENHOR».
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a construção com sufixo de segunda pessoa masculina singular e a expressão pactual do hebraico.
- source_word: בְּיָדֶךָ
  choice: em suas mãos
  rationale: Conserva a imagem hebraica de entrega ao poder ou controle de alguém, usando a forma idiomática natural em português.
- source_word: וְהִכִּיתָ
  choice: e você matará
  rationale: No contexto militar e com a expressão «ao fio da espada», o hifil de נכה indica um golpe letal. «Matará» comunica diretamente o resultado sem suavizar a ordem.
- source_word: כָּל זְכוּרָהּ
  choice: todos os que nela forem do sexo masculino
  rationale: זָכוּר especifica sexo masculino, não apenas homens adultos. A formulação evita restringir indevidamente o referente e torna explícito que o sufixo feminino remete à cidade.
- source_word: לְפִי חָרֶב
  choice: ao fio da espada
  rationale: Equivalente idiomático tradicional e natural da expressão hebraica, literalmente «à boca da espada».
theological_decisions:
- issue: Tradução de uma ordem de guerra atribuída a Deus sem suavização nem ampliação interpretativa
  choice: Apresentar diretamente a entrega da cidade por Javé e a ordem de matar todos os que nela forem do sexo masculino.
  alternative: Atenuar a ação como mera derrota ou acrescentar explicações sobre juízo divino ou guerra santa.
  rationale: O hebraico atribui explicitamente a entrega da cidade a Javé e ordena ação letal contra todo indivíduo do sexo masculino. A tradução preserva a gravidade e a tensão do texto sem inserir justificativas teológicas ausentes do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Você» representa o singular hebraico e mantém a instrução dirigida individualmente a Israel; «ao fio da espada» conserva o caráter solene e militar da expressão original.
