base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: pt
  text: E quem é o homem que plantou uma vinha e ainda não desfrutou de seus frutos? Que ele vá e volte para sua casa[a], para que não morra na batalha e outro homem desfrute de seus frutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “ainda não a dedicou” ou “ainda não começou a usá-la”. Aqui, o verbo hebraico se refere a começar a fazer uso comum da vinha, provavelmente desfrutando de sua produção depois dos primeiros anos de restrição (compare Levítico 19:23–25).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: E qual é o homem
  rationale: Preserva a fórmula interrogativa que introduz mais um caso de dispensa militar e mantém a referência explícita ao homem convocado para o combate.
- source_word: נָטַע כֶּרֶם
  choice: plantou uma vinha
  rationale: Tradução direta do verbo perfeito e de seu objeto, com formulação natural em português.
- source_word: וְלֹא חִלְּלוֹ
  choice: e ainda não desfrutou de seus frutos
  rationale: Neste contexto, חלל indica começar a usufruir normalmente da vinha, provavelmente mediante sua produção após os anos de restrição; 'ainda' explicita a relevância temporal, e 'desfrutou de seus frutos' comunica o benefício prático sem sugerir profanação ritual.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Vá e volte para casa
  rationale: A sequência verbal tem força instrutiva ou jussiva. A terceira pessoa do imperativo ('vá') é natural, clara e digna em português.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: para que não morra na batalha
  rationale: Expressa a função preventiva de פן em português corrente, sem afirmar que a morte certamente ocorrerá.
- source_word: וְאִישׁ אַחֵר
  choice: e outro homem
  rationale: Mantém a referência masculina explícita do hebraico e sua relação com o contexto de combatentes homens.
- source_word: יְחַלְּלֶנּוּ
  choice: desfrute deles
  rationale: Repete o sentido contextual do primeiro חלל; o pronome plural retoma naturalmente 'frutos' na formulação portuguesa.
