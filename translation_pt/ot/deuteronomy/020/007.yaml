  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר אֵרַ֤שׂ אִשָּׁה֙ וְ/לֹ֣א לְקָחָ֔/הּ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יִקָּחֶֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: pt
  text: E qual é o homem que ficou noivo de uma mulher, mas ainda não a tomou por esposa?[a] Que ele vá e volte para casa, para que não morra na batalha e outro homem a tome por esposa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “ficou noivo de uma mulher e não a tomou”. Aqui, “tomar” refere-se a efetivar o casamento, recebendo-a como esposa.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “e outro homem a tome”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: E qual é o homem
  rationale: Mantém a ligação com as categorias anteriores e a forma retórica da proclamação, preservando o masculino singular próprio do contexto militar.
- source_word: אֵרַשׂ אִשָּׁה
  choice: ficou noivo de uma mulher
  rationale: אֵרַשׂ indica o compromisso formal de casamento anterior à efetivação da união; “ficou noivo” é claro e natural em português moderno.
- source_word: וְלֹא לְקָחָהּ
  choice: mas ainda não a tomou por esposa
  rationale: Explicita o sentido matrimonial de לקח sem apagar a distinção entre noivado e casamento efetivado. “Ainda” torna natural a relação temporal implícita, e “mas” expressa o contraste contextual.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Que ele vá e volte para casa
  rationale: Reproduz a força diretiva das formas verbais e verte לְבֵיתוֹ de modo idiomático.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: para que não morra na batalha
  rationale: Expressa a advertência negativa introduzida por פֶּן em português corrente; “na batalha” remete à campanha militar em questão.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: e outro homem a tome por esposa
  rationale: Conserva o paralelismo lexical de לקח nas duas ocorrências e deixa claro seu sentido matrimonial em português.
