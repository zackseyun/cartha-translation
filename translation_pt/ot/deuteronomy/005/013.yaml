base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: pt
  text: Durante seis dias você trabalhará e fará todo o seu trabalho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Durante seis dias você poderá trabalhar e fazer todo o seu trabalho”. Neste contexto legal, a forma verbal hebraica pode ser entendida como instrução ou como permissão.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Durante seis dias
  rationale: A construção numeral expressa naturalmente duração. Em português, “durante” torna essa relação clara e idiomática sem alterar o sentido.
- source_word: תַּעֲבֹד
  choice: você trabalhará
  rationale: עבד refere-se aqui ao trabalho comum. O futuro do indicativo pode ter força instrutiva ou normativa no registro legal português, sem confundir este verbo com o seguinte עשה.
- source_word: וְעָשִׂיתָ
  choice: e fará
  rationale: עשה é amplo e, com מְלָאכָה, significa realizar ou fazer as tarefas. “Fará” preserva a coordenação hebraica e soa natural.
- source_word: כָּל
  choice: todo
  rationale: כָּל indica a totalidade do trabalho; “todo” é a correspondência direta e idiomática diante de um substantivo singular coletivo.
- source_word: מְלַאכְתֶּךָ
  choice: o seu trabalho
  rationale: מְלָאכָה designa trabalho, ocupação ou tarefa, especialmente no contexto do sábado. “O seu trabalho” é claro, natural e mantém a referência pessoal do sufixo.
theological_decisions:
- issue: Força dos verbos na legislação do sábado
  choice: Durante seis dias você trabalhará e fará todo o seu trabalho.
  alternative: Durante seis dias você poderá trabalhar e fazer todo o seu trabalho.
  rationale: No contexto da aliança, os imperfeitos podem comunicar instrução normativa, mas também admitem uma nuance permissiva. O texto principal conserva a força legal, enquanto a nota registra a ambiguidade genuína sem decidir além da evidência hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. O uso explícito de “você” evita a ambiguidade regional de formas verbais sem pronome; a formulação mantém o paralelismo e o tom legal do original.
