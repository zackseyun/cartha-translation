base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: pt
  text: 'Eu estava, naquela ocasião, entre Yahweh e vocês para lhes anunciar a palavra de Yahweh, porque vocês tiveram medo por causa do fogo[a] e não subiram ao monte, nestes termos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “diante da face/presença do fogo”; expressão idiomática com o sentido de “por causa do fogo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי עֹמֵד
  choice: eu estava
  rationale: O pronome independente dá destaque a Moisés, enquanto o particípio, no contexto passado, descreve sua posição mediadora naquele momento. Em português, “eu estava” expressa isso naturalmente sem exigir “eu mesmo”.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: entre Yahweh e vocês
  rationale: Reproduz a relação entre as duas partes e torna clara a função mediadora de Moisés. “Vocês” oferece ampla legibilidade moderna.
- source_word: בָּעֵת הַהִוא
  choice: naquele momento
  rationale: Expressão temporal idiomática que remete ao acontecimento no Horebe; “momento” se ajusta bem à cena específica.
- source_word: לְהַגִּיד לָכֶם
  choice: para lhes anunciar
  rationale: O hifil de נגד indica comunicar ou dar a conhecer uma mensagem. “Anunciar” mantém a solenidade sem soar arcaico.
- source_word: אֶת דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Preserva o sentido concreto de דבר como fala ou mensagem divina e a expressão bíblica reconhecível “palavra de Yahweh”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da mediação de Moisés; “pois” comunica a relação causal de modo natural e digno.
- source_word: יְרֵאתֶם מִפְּנֵי הָאֵשׁ
  choice: vocês tiveram medo por causa do fogo
  rationale: Expressa idiomaticamente o medo provocado pela presença do fogo, sem reproduzir de modo obscuro a formulação literal hebraica.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: e não subiram ao monte
  rationale: Traduz diretamente o movimento de subida e usa “monte”, termo natural e tradicional para o Horebe/Sinai.
- source_word: לֵאמֹר
  choice: 'nestes termos:'
  rationale: O infinitivo introduz a fala divina que começa no versículo seguinte. “Nestes termos:” evita um gerúndio solto em português e preserva sua função discursiva.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Identificação de quem fala após לֵאמֹר
  choice: 'Introdução sem sujeito explícito: “nestes termos:”'
  alternative: “dizendo:” ou “ele disse:”
  rationale: O hebraico introduz a fala seguinte sem explicitar aqui um novo sujeito. A formulação escolhida mantém essa estrutura e evita atribuir gramaticalmente o verbo a Moisés ou acrescentar um pronome não expresso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os travessões delimitam a explicação causal e permitem que “nestes termos:” introduza com clareza a fala do versículo seguinte.
