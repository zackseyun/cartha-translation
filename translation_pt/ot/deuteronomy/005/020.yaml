  text: You shall not bear false witness against your neighbor[a].
translation:
  language: pt
  text: Não dê falso testemunho contra o seu próximo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não testemunhe falsamente contra o seu próximo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: Negação direta que, no contexto do Decálogo, expressa uma proibição de modo natural em português.
- source_word: תַעֲנֶה
  choice: dê
  rationale: Com עֵד, o verbo ענה pertence ao contexto jurídico de prestar ou dar testemunho; a expressão portuguesa “dar testemunho” comunica esse sentido com clareza.
- source_word: בְרֵעֲךָ
  choice: contra o seu próximo
  rationale: רֵעַ designa o próximo, semelhante ou companheiro; após um verbo de testemunho, a preposição בְ é adequadamente expressa por “contra” neste contexto judicial.
- source_word: עֵד
  choice: testemunho
  rationale: Embora o substantivo possa designar uma testemunha, em combinação com o verbo forma uma expressão relativa ao ato de testemunhar; “dar testemunho” é natural e mantém o sentido jurídico.
- source_word: שָׁוְא
  choice: falso
  rationale: No contexto judicial, שָׁוְא indica falsidade ou engano; “falso testemunho” é a formulação portuguesa precisa e consagrada.
theological_decisions: []
