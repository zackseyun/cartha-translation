source:
  edition: WLC
  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: pt
  text: Pois quem, de toda a humanidade,[a] ouviu a voz do Deus vivo falando do meio do fogo, como nós a ouvimos, e permaneceu vivo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “toda carne”, expressão hebraica para a humanidade mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta o temor e o pedido do povo no contexto; “Pois” preserva naturalmente essa função argumentativa.
- source_word: מִי
  choice: quem
  rationale: Pronome interrogativo que inicia uma pergunta retórica.
- source_word: כָל בָּשָׂר
  choice: toda a humanidade
  rationale: Expressa em português atual o alcance universal do idioma hebraico “toda carne”; a formulação literal é registrada em nota para preservar sua ênfase na condição mortal humana.
- source_word: שָׁמַע
  choice: ouviu
  rationale: O pretérito perfeito comunica de modo natural a experiência concluída à qual a pergunta retórica se refere.
- source_word: קוֹל
  choice: a voz
  rationale: Embora o termo também possa significar “som”, o sujeito que fala favorece claramente “voz”.
- source_word: אֱלֹהִים חַיִּים
  choice: o Deus vivo
  rationale: Apesar da morfologia plural, a expressão designa de forma idiomática e singular o Deus de Israel.
- source_word: מְדַבֵּר
  choice: falando
  rationale: O particípio descreve Deus no ato de falar e mantém a estrutura da frase com naturalidade.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: do meio do fogo
  rationale: Preserva a imagem de uma voz procedente de dentro do fogo, sem linguagem artificial.
- source_word: כָּמֹנוּ
  choice: assim como nós
  rationale: Compara a experiência considerada impossível com a experiência concreta de Israel, sem acrescentar uma explicação não expressa no hebraico.
- source_word: וַיֶּחִי
  choice: e continuou vivo
  rationale: Mantém o sentido básico de viver e torna explícita, em português natural, a ideia de permanecer com vida depois de ouvir Deus.
theological_decisions:
- issue: Sentido antropológico de כָל בָּשָׂר
  choice: toda a humanidade
  alternative: toda carne
  rationale: A tradução principal evita uma expressão pouco corrente e comunica claramente que a pergunta abrange os seres humanos mortais; a nota conserva a imagem concreta e a textura teológica do hebraico.
- issue: Número e sentido de אֱלֹהִים חַיִּים
  choice: o Deus vivo
  alternative: os deuses vivos
  rationale: No contexto, a construção morfologicamente plural funciona como título singular do Deus de Israel; traduzi-la no plural deturparia seu referente.
- issue: Resultado expresso por וַיֶּחִי
  choice: e continuou vivo
  alternative: e sobreviveu
  rationale: “Continuou vivo” preserva o verbo “viver” e a tensão do encontro com Deus, enquanto “sobreviveu” explicitaria de modo mais interpretativo a ameaça implícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pergunta retórica foi mantida em uma única frase; “do meio do fogo” conserva a imagem da fonte da voz, e a nota recupera o idioma hebraico sem tornar o texto principal artificial.
