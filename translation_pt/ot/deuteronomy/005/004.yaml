  yaml_path: translation/ot/deuteronomy/005/004.yaml
  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: pt
  text: Yahweh falou com vocês face a face[a], no monte, do meio do fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “face a face”, expressão que indica comunicação pessoal e direta; compare Deuteronômio 4:12, onde Israel ouve a voz, mas não vê forma alguma.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: face a face
  rationale: Preserva literalmente o conhecido idiomatismo hebraico e sua força retórica, sem reduzi-lo interpretativamente a “diretamente” ou “pessoalmente”.
- source_word: דִּבֶּר ... עִמָּכֶם
  choice: falou com vocês
  rationale: Reproduz o sentido comum do verbo “falar” e da preposição עִם, “com”, mantendo a ideia de interlocução direta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בָּהָר
  choice: no monte
  rationale: Expressa naturalmente em português o valor locativo da preposição ב no cenário do Sinai.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: do meio do fogo
  rationale: Conserva a especificidade de מִתּוֹךְ, que indica procedência do interior ou meio do fogo, em linguagem portuguesa natural.
theological_decisions:
- issue: A expressão antropomórfica “face a face” em relação à teofania do Sinai
  choice: Manter “face a face” como expressão de comunicação pessoal e direta, sem afirmar explicitamente percepção visual literal.
  alternative: Traduzir interpretativamente como “diretamente” ou “pessoalmente”.
  rationale: Deuteronômio 4:12,15 afirma que Israel ouviu a voz, mas não viu forma alguma. A tradução conserva o idiomatismo e a tensão do texto sem impor uma harmonização explicativa no versículo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Vocês” comunica naturalmente o plural de עִמָּכֶם; “monte” é preferido a “montanha” no registro bíblico corrente. O marcador [a] foi colocado após “monte” para acompanhar a camada de consulta fornecida, embora a nota explique principalmente “face a face”.
