source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: pt
  text: Não tome o nome de Yahweh, seu Deus, em vão[a], pois Yahweh não deixará impune[b] quem tomar o seu nome em vão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para falsidade”, “indevidamente” ou “de modo vazio”. O hebraico pode incluir o uso falso ou vazio do nome de Yahweh, não apenas uma forma específica de uso indevido.
    reason: lexical_alternative
  - marker: b
    text: Ou “não terá por inocente” ou “não absolverá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: tome / tomar
  rationale: O verbo pode significar levantar, carregar ou levar. Na expressão com “nome” e לַשָּׁוְא, “tomar o nome em vão” conserva o idioma tradicional em português sem restringir o mandamento apenas à pronúncia, ao juramento falso ou a uma forma específica de uso indevido.
- source_word: שֵׁם
  choice: nome
  rationale: Correspondência direta e natural. Mantém abertas as associações hebraicas do nome com identidade, autoridade e reputação, sem inseri-las como paráfrase no texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a referência direta ao Deus do destinatário singular, expressa de modo natural e amplamente compreensível em português.
- source_word: לַשָּׁוְא
  choice: em vão
  rationale: שָׁוְא abrange ideias de vazio, falsidade, inutilidade e uso indevido. “Em vão” é idiomático e preserva melhor essa amplitude; alternativas são registradas em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição com concisão e dignidade, de maneira natural no português atual.
- source_word: יְנַקֶּה (נקה)
  choice: não deixará impune
  rationale: O piel de נקה indica não livrar de culpa ou punição. A formulação comunica claramente a força judicial sem recorrer a uma construção arcaica.
- source_word: אֲשֶׁר
  choice: quem
  rationale: Expressa de forma concisa e idiomática a referência genérica à pessoa que comete a infração.
- source_word: שְׁמוֹ
  choice: seu nome
  rationale: Retoma explicitamente o nome de Yahweh, preservando a relação possessiva do hebraico.
theological_decisions:
- issue: Representação do nome divino YHWH
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz diretamente o tetragrama יהוה. “Yahweh” preserva o nome pessoal no corpo do versículo, em vez de substituí-lo por um título; “Javé” é uma forma aportuguesada conhecida, mas não foi adotada para manter a política lexical do projeto.
- issue: Alcance da proibição
  choice: tomar o nome de Yahweh em vão
  alternative: usar indevidamente o nome de Yahweh; invocar o nome de Yahweh para falsidade; carregar falsamente o nome de Yahweh
  rationale: A formulação hebraica pode abranger juramentos falsos, invocações vazias e outros usos falsos ou indevidos, possivelmente também a ideia de portar ou representar o nome. O texto principal mantém a amplitude da expressão, e a nota explicita alternativas sem impor uma única interpretação.
- issue: Força judicial de לֹא יְנַקֶּה
  choice: não deixará impune
  alternative: não terá por inocente; não absolverá
  rationale: A escolha expressa a certeza da responsabilização divina sem decidir além do que o texto afirma sobre a forma ou o momento da punição.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. A expressão consagrada “tomar o nome em vão” foi mantida por ser clara e por não reduzir a amplitude do hebraico. Evitou-se “pronunciar”, que limitaria o mandamento ao ato de falar. Os marcadores foram colocados junto às expressões a que cada nota se refere.
