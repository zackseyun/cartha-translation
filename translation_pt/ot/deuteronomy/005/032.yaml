  text: וּ/שְׁמַרְתֶּ֣ם לַ/עֲשׂ֔וֹת כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֶתְ/כֶ֑ם לֹ֥א תָסֻ֖רוּ יָמִ֥ין וּ/שְׂמֹֽאל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: pt
  text: Portanto, tenham o cuidado de fazer como Yahweh, seu Deus, lhes ordenou; não se desviem nem para a direita nem para a esquerda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Não se desviem nem para a direita nem para a esquerda” é uma expressão que significa não se afastar, em direção alguma, daquilo que Deus ordenou.
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: tenham o cuidado de fazer
  rationale: A construção com שׁמר e o infinitivo לַעֲשׂוֹת expressa atenção cuidadosa que resulta em obediência. A formulação é natural em português e preserva tanto a vigilância quanto a ação requerida.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Indica conformidade com o mandamento divino; “exatamente como” comunica com clareza que não se deve alterar o que foi ordenado.
- source_word: צִוָּה
  choice: ordenou
  rationale: O perfeito hebraico apresenta o ato de ordenar como realizado. O pretérito perfeito português é direto e mantém a obrigação decorrente desse ato.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: 'O substantivo em estado construto com sufixo de segunda pessoa plural expressa a relação: “Deus de vocês”. “Seu Deus” é uma forma natural e amplamente compreensível, com referência plural indicada pelo contexto verbal.'
- source_word: לֹא תָסֻרוּ
  choice: não se desviem
  rationale: סור descreve metaforicamente o afastamento do caminho prescrito. “Desviar-se” conserva essa imagem e exprime claramente a proibição.
- source_word: יָמִין וּשְׂמֹאל
  choice: nem para a direita nem para a esquerda
  rationale: A expressão indica qualquer desvio em relação ao caminho ordenado. A correlação “nem... nem...” é idiomática em português depois da proibição e mantém as duas direções do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Alcance da imagem de direita e esquerda
  choice: Preservar a imagem direcional no texto e explicar seu valor idiomático em nota
  alternative: Traduzir apenas o sentido como “não se desviem de modo algum”
  rationale: A formulação concreta do hebraico é clara em português e comunica a exigência de não se afastar dos mandamentos em nenhuma direção, sem eliminar a metáfora original.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais no plural. “Tenham o cuidado” evita uma tradução mecânica de שׁמר e comunica sua força exortativa; “Yahweh” mantém o nome divino.
