  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: pt
  text: mas demonstro amor leal a milhares, aos que me amam e guardam os mandamentos dele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos e traduções trazem “meus mandamentos”, leitura que corresponde à fala em primeira pessoa no contexto; o texto hebraico fornecido aqui diz “os mandamentos dele”.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: mas demonstro
  rationale: O particípio dá continuidade à fala divina em primeira pessoa e, em contraste com o versículo anterior, é expresso naturalmente por “mas demonstro”.
- source_word: חֶסֶד
  choice: amor leal
  rationale: A expressão comunica amor fiel e lealdade relacional, preservando o peso pactual do termo sem recorrer a vocabulário arcaico.
- source_word: לַאֲלָפִים
  choice: a milhares
  rationale: O hebraico diz literalmente “a milhares” e não explicita “gerações”; a tradução não acrescenta esse substantivo a partir de passagens paralelas.
- source_word: לְאֹהֲבַי
  choice: aos que me amam
  rationale: A forma participial com sufixo de primeira pessoa é vertida por uma oração relativa natural em português.
- source_word: וּלְשֹׁמְרֵי
  choice: e guardam
  rationale: Com “mandamentos”, “guardar” expressa adequadamente observar e cumprir, além de manter uma formulação bíblica corrente e compreensível.
- source_word: מצות/ו
  choice: os mandamentos dele
  rationale: O sufixo da forma hebraica fornecida é de terceira pessoa masculina singular. “Dele” torna essa leitura explícita e evita a ambiguidade de “seus” em português.
theological_decisions:
- issue: Pronome na expressão referente aos mandamentos
  choice: os mandamentos dele
  alternative: meus mandamentos
  rationale: A tradução segue a forma hebraica fornecida, que apresenta sufixo de terceira pessoa masculina singular, embora a primeira pessoa do contexto e outras testemunhas favoreçam “meus mandamentos”. A tensão textual é preservada e explicada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Amor leal” preserva a dimensão de fidelidade de חֶסֶד; “a milhares” mantém a concisão e a indeterminação do hebraico. A formulação incomum “os mandamentos dele” é intencional, por fidelidade à forma textual fornecida.
