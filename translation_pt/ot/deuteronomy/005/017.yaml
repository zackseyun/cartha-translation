  yaml_path: translation/ot/deuteronomy/005/017.yaml
  text: You shall not murder[a].
translation:
  language: pt
  text: Não assassine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a tradução tradicional: “Não mate.” Aqui, o verbo hebraico se refere mais especificamente a assassinar ou matar ilicitamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: A partícula de negação introduz uma proibição direta; em português, o imperativo negativo com o presente do subjuntivo expressa isso naturalmente.
- source_word: תִּרְצָח
  choice: assassine
  rationale: O verbo רָצַח designa mais especificamente matar de modo ilícito, e não todo e qualquer ato de matar. “Assassinar” preserva a precisão moral e jurídica do hebraico.
theological_decisions:
- issue: Alcance da proibição no sexto mandamento
  choice: A ordem proíbe o assassinato, isto é, matar ilicitamente.
  alternative: Não mate.
  rationale: O hebraico emprega רָצַח, verbo mais específico do que termos gerais para matar. A tradução evita transformar o mandamento numa proibição absoluta de toda forma de tirar a vida, sem definir além do texto todas as categorias jurídicas envolvidas.
translation_notes:
  register: Formulação direta, digna e corrente em português moderno. “Não assassine” comunica com clareza a força proibitiva e a especificidade lexical do hebraico; a nota preserva a forma tradicional e explica a diferença.
