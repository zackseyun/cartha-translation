  text: לֹא יִהְיֶ֥ה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/007.yaml
  text: You shall have no other gods before me[a].
translation:
  language: pt
  text: Não tenha outros deuses diante de mim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além de mim”. O hebraico diz literalmente “diante da minha face”, expressão que pode comunicar tanto presença quanto exclusividade.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: não
  rationale: Negação direta que introduz a proibição; em português, combina naturalmente com o presente do subjuntivo de valor imperativo.
- source_word: יִהְיֶה לְךָ
  choice: tenha
  rationale: A construção hebraica com o verbo “ser” e לְךָ (“para você”) expressa existência ou posse em relação ao destinatário. “Não tenha” é a forma portuguesa natural e mantém a força proibitiva e o tratamento singular.
- source_word: אֱלֹהִים
  choice: deuses
  rationale: O substantivo plural, qualificado por “outros”, designa aqui divindades rivais; “deuses” é a tradução direta e corrente.
- source_word: אֲחֵרִים
  choice: outros
  rationale: Indica deuses distintos do SENHOR. “Outros” traduz diretamente o termo sem acrescentar a ideia de origem estrangeira.
- source_word: עַל פָּנָי
  choice: diante de mim
  rationale: A expressão significa literalmente “diante da minha face”. “Diante de mim” preserva sua imagem relacional e sua possível ideia de presença, sem eliminar a nuance de exclusividade explicada na nota.
theological_decisions:
- issue: Sentido da expressão final עַל פָּנָי
  choice: diante de mim
  alternative: além de mim; na minha presença
  rationale: A expressão hebraica pode indicar presença espacial e, neste contexto proibitivo, exclusividade. O texto principal mantém uma tradução formalmente transparente, enquanto a nota registra a leitura exclusiva possível, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular “tenha” conserva o destinatário hebraico singular, Israel considerado como parceiro da aliança. A formulação evita tanto o arcaísmo “não terás” quanto uma paráfrase que eliminaria a ambiguidade do original.
