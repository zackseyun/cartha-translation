  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: pt
  text: Yahweh, nosso Deus, fez uma aliança conosco em Horebe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “cortou conosco uma aliança em Horebe”.'
    reason: Preserva a imagem da expressão idiomática hebraica כָּרַת בְּרִית, traduzida de modo natural no texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Expressa diretamente o substantivo com o sufixo da primeira pessoa do plural e preserva a relação de aliança.
- source_word: כָּרַת
  choice: fez
  rationale: Na expressão idiomática hebraica כָּרַת בְּרִית, o sentido natural em português é estabelecer ou fazer uma aliança; a imagem literal de 'cortar' é preservada em nota.
- source_word: עִמָּנוּ
  choice: conosco
  rationale: Tradução direta e natural da preposição com sufixo da primeira pessoa do plural.
- source_word: בְּרִית
  choice: aliança
  rationale: É o termo português consagrado que mantém o peso relacional e solene do hebraico, sem reduzi-lo a mero acordo.
- source_word: בְּחֹרֵב
  choice: em Horebe
  rationale: Mantém o topônimo tradicional em português e traduz naturalmente o uso locativo da preposição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem 'Yahweh, nosso Deus' é natural em português, e 'fez uma aliança' comunica de forma idiomática o sentido do hebraico.
