review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a exortação, a condição de escravidão no Egito, a ação libertadora de Yahweh, as imagens de poder e a relação causal com o mandamento sabático. Contudo, «o tirou de lá» introduz uma ambiguidade sintática indevida em português: o pronome masculino singular pode remeter a «Egito», embora o objeto hebraico seja «você».'
  naturalness: O registro é claro e moderno. A substituição de «o tirou» por «tirou você» elimina a ambiguidade e mantém o tratamento por «você». «O dia do sábado» é mais claro e mais próximo da expressão hebraica do que «o dia de sábado», que pode ser entendido simplesmente como um sábado.
  terminology: «Yahweh», «seu Deus», «escravo», «mão forte», «braço estendido» e «observar» são escolhas adequadas. As notas preservam tanto a alternativa para «mão forte» quanto o sentido idiomático de «fazer o dia do sábado».
  issues:
  - severity: medium
    issue: Pronome ambíguo em «Yahweh, seu Deus, o tirou de lá».
    rationale: O sufixo de segunda pessoa em וַיּוֹצִאֲךָ significa que Yahweh tirou o destinatário/Israel do Egito. Em português, «o» pode ser lido como retomando «Egito», substantivo masculino imediatamente anterior. «Tirou você de lá» torna o referente exigido pelo texto inequívoco.
  - severity: low
    issue: «Dia de sábado» é menos definido que a expressão hebraica.
    rationale: יוֹם הַשַּׁבָּת é literalmente «o dia do sábado». A forma com artigo explicita que se trata do dia sabático instituído, não apenas de um dia que calha ser sábado.
  revised_text: E lembre-se de que você foi escravo na terra do Egito, e Yahweh, seu Deus, tirou você de lá com mão forte[a] e braço estendido; por isso, Yahweh, seu Deus, ordenou que você observasse o dia do sábado[b].
  revised_footnotes:
