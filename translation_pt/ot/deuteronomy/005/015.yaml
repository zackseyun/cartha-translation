source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a slave in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: pt
  text: E lembre-se de que você foi escravo na terra do Egito, e Yahweh, seu Deus, tirou você de lá com mão forte[a] e braço estendido; por isso, Yahweh, seu Deus, ordenou que você observasse o dia do sábado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com mão poderosa”. A expressão hebraica enfatiza o poderoso ato de libertação realizado por Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fazer o dia do sábado”; a expressão hebraica significa guardá-lo ou observá-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: E lembre-se
  rationale: O perfeito qal com a conjunção, neste contexto de mandamento, tem força exortativa. A formulação preserva tanto a ligação com o discurso anterior quanto o imperativo dirigido ao israelita individual.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo daquilo que deve ser lembrado; em português, “lembrar-se de que” é a construção natural.
- source_word: עֶבֶד
  choice: escravo
  rationale: O termo descreve a condição de sujeição no Egito. “Escravo” comunica com clareza a servidão opressiva que fundamenta o mandamento sabático.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Mantém a expressão concreta do hebraico sem perder naturalidade em português.
- source_word: וַיֹּצִאֲךָ
  choice: o tirou
  rationale: O hifil de יצא indica que Deus fez Israel sair do Egito. “O tirou de lá” é direto e idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando sua referência pactual em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz o construto com sufixo de segunda pessoa do singular; a repetição foi mantida conforme o hebraico.
- source_word: בְּיָד חֲזָקָה
  choice: com mão forte
  rationale: Preserva de perto a metáfora hebraica e o sentido direto de חֲזָקָה, que enfatiza o poder da libertação realizada por Deus.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: e braço estendido
  rationale: Mantém a imagem hebraica tradicional da manifestação ativa do poder divino; a preposição “com” rege naturalmente os dois elementos coordenados.
- source_word: עַל כֵּן
  choice: por isso
  rationale: 'Expressa de modo natural a inferência: a libertação da escravidão fundamenta a ordem de observar o sábado.'
- source_word: צִוְּךָ ... לַעֲשׂוֹת אֶת יוֹם הַשַּׁבָּת
  choice: ordenou que você observasse o dia de sábado
  rationale: Embora לַעֲשׂוֹת signifique literalmente “fazer”, neste contexto a expressão idiomática significa cumprir ou observar o dia sabático. “Observasse” é claro, atual e digno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome próprio divino. “Yahweh” o preserva de modo explícito e evita convertê-lo silenciosamente em um título; “Javé” é uma forma portuguesa possível, mas representa uma adaptação fonológica adicional.
- issue: Sentido de עֶבֶד na experiência de Israel no Egito
  choice: escravo
  alternative: servo
  rationale: A lembrança da sujeição e da libertação é a base teológica da observância do sábado. “Escravo” mantém a gravidade da condição descrita, enquanto “servo” poderia atenuá-la.
- issue: Relação entre o êxodo e o sábado
  choice: por isso
  alternative: portanto; por essa razão
  rationale: 'Mantém explícito, sem ampliá-lo, o nexo apresentado pelo texto: a libertação efetuada por Yahweh fundamenta o mandamento sabático.'
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O tratamento por “você” torna explícita a segunda pessoa masculina singular do hebraico sem recorrer ao registro regional de “tu”. As imagens “mão forte” e “braço estendido” foram preservadas, enquanto a expressão idiomática final foi vertida de maneira natural.
