revisions:
- from: E lembre-se de que você foi escravo na terra do Egito, e Yahweh, seu Deus, o tirou de lá com mão forte[a] e braço estendido; por isso, Yahweh, seu Deus, ordenou que você observasse o dia de sábado[b].
  to: E lembre-se de que você foi escravo na terra do Egito, e Yahweh, seu Deus, tirou você de lá com mão forte[a] e braço estendido; por isso, Yahweh, seu Deus, ordenou que você observasse o dia do sábado[b].
  rationale: A revisão limita-se a eliminar uma ambiguidade pronominal que não está no hebraico e a tornar mais explícita a referência definida ao dia do sábado. O sentido, o registro, os termos teológicos e os pontos de ancoragem das notas foram preservados.
