source:
  edition: WLC
  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: pt
  text: Não faça para você imagem esculpida[a], nem qualquer representação[b] do que há nos céus acima, na terra abaixo ou nas águas debaixo da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolo”. O termo hebraico designa uma imagem talhada ou esculpida, frequentemente usada na idolatria; aqui se conserva o sentido mais concreto.
    reason: lexical_alternative
  - marker: b
    text: Ou “forma” ou “semelhança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: imagem esculpida
  rationale: Preserva o sentido concreto de uma imagem produzida por entalhe ou escultura, muitas vezes ligada à idolatria, sem antecipar a interpretação mais específica de “ídolo”.
- source_word: תְּמוּנָה
  choice: representação
  rationale: Exprime de modo natural a ideia de forma ou semelhança representada e amplia adequadamente a proibição para além de uma imagem especificamente esculpida.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Não faça para você
  rationale: A forma imperativa negativa comunica naturalmente a proibição legal em português, enquanto “para você” preserva לְךָ e sua noção de apropriação ou uso pessoal.
- source_word: כָּל תְּמוּנָה
  choice: qualquer representação
  rationale: Em uma proibição, “qualquer” transmite idiomaticamente o alcance abrangente de כָּל.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: do que há nos céus acima
  rationale: Mantém o plural hebraico “céus” e a relação espacial vertical, com formulação corrente em português.
- source_word: בָּאָרֶץ מִתָּחַת
  choice: na terra abaixo
  rationale: Reproduz o contraste cosmológico com “nos céus acima” de modo conciso e natural.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: nas águas debaixo da terra
  rationale: Preserva diretamente a antiga descrição cosmológica das águas situadas sob a terra.
theological_decisions:
- issue: Alcance da proibição de imagens
  choice: Traduzir a proibição de fazer uma imagem esculpida ou qualquer representação sem acrescentar referência ao culto.
  alternative: Interpretar explicitamente como proibição de fabricar ídolos para adoração.
  rationale: O versículo 8 fala da fabricação da imagem, enquanto o versículo 9 explicita curvar-se e prestar culto. A redação mantém essa progressão e não resolve por acréscimo a relação entre os dois versículos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não faça” é mais natural hoje do que a formulação futura “não farás”; “imagem esculpida” evita o arcaísmo “imagem de escultura”. Os marcadores [a] e [b] aparecem no texto principal.
