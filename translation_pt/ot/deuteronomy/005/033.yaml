base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: pt
  text: Andem por todo o caminho que Yahweh, seu Deus, lhes ordenou, para que vivam, tudo lhes vá bem e prolonguem os seus dias na terra de que tomarão posse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra que receberão por herança”. O verbo hebraico pode transmitir tanto a ideia de tomar posse como a de receber por herança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל הַ/דֶּרֶךְ
  choice: por todo o caminho
  rationale: Mantém o singular e a metáfora pactual do caminho como modo de vida prescrito por Deus, em formulação natural em português.
- source_word: צִוָּה
  choice: ordenou
  rationale: Expressa a ordem já dada e ainda vigente no contexto da exortação de Moisés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em conformidade com a convenção do projeto.
- source_word: אֱלֹהֵי/כֶם
  choice: seu Deus
  rationale: Reproduz naturalmente a expressão pactual hebraica, com referência ao plural 'vocês' entendida pelo contexto.
- source_word: תֵּלֵכוּ
  choice: Andem
  rationale: Preserva a metáfora hebraica de andar como conduta e obediência, além do tom exortativo do contexto.
- source_word: לְמַעַן
  choice: para que
  rationale: Comunica com clareza a finalidade ou o resultado pretendido.
- source_word: תִּחְיוּן
  choice: vivam
  rationale: É a tradução direta e natural do verbo, adequada ao contexto de bênção pactual.
- source_word: וְ/טוֹב לָכֶם
  choice: tudo lhes vá bem
  rationale: Expressa idiomaticamente o bem-estar indicado pela construção hebraica.
- source_word: וְ/הַאֲרַכְתֶּם יָמִים
  choice: prolonguem os seus dias
  rationale: Conserva a imagem hebraica de alongar os dias, sem reduzir a expressão simplesmente a 'vivam muito'.
- source_word: בָּ/אָ֖רֶץ
  choice: na terra
  rationale: É a formulação usual e natural para a linguagem da terra pactual em Deuteronômio.
- source_word: תִּֽירָשׁוּן
  choice: tomarão posse
  rationale: Representa o sentido territorial concreto de receber e ocupar a terra, preservando em nota a possível nuance de herança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Linguagem referente à posse da terra
  choice: a terra da qual tomarão posse
  alternative: a terra que receberão por herança
  rationale: A escolha principal conserva o sentido territorial concreto de ירשׁ, enquanto a nota registra a nuance legítima de herança sem decidir excessivamente a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo plural 'Andem' reproduz o tom exortativo, e a metáfora singular do caminho foi mantida. O marcador da nota foi colocado junto a 'tomarão posse', termo ao qual a alternativa lexical se refere.
