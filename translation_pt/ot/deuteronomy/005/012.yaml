base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: pt
  text: Guarde o dia do sábado[a] para mantê-lo santo, como Yahweh, seu Deus, lhe ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Observe o dia do sábado” ou “Guarde cuidadosamente o dia do sábado”. O verbo hebraico enfatiza a observância cuidadosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Guarde
  rationale: O infinitivo absoluto qal tem força imperativa. “Guarde” expressa cuidado atento e observância, além de preservar o contraste deliberado com “Lembre-se” em Êxodo 20:8.
- source_word: יוֹם הַשַׁבָּת
  choice: o dia do sábado
  rationale: Tradução natural e clara em português, mantendo em vista o dia específico de descanso.
- source_word: לְקַדְּשׁוֹ
  choice: para mantê-lo santo
  rationale: A construção expressa finalidade. “Mantê-lo santo” comunica que o dia deve ser tratado como santo e separado, sem sugerir necessariamente que o ser humano lhe confira santidade intrínseca.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Introduz de modo conciso e natural a conformidade com a ordem divina anterior.
- source_word: צִוְּךָ
  choice: lhe ordenou
  rationale: צוה indica uma ordem com autoridade; o pretérito perfeito se ajusta à recordação de um mandamento anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz naturalmente a designação pactual com sufixo de segunda pessoa masculina singular.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal revelado a Israel e corresponde à transliteração adotada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular de segunda pessoa do hebraico foi vertido por “seu/lhe”, evitando regionalismo marcado. A formulação conserva a força imperativa e o vínculo com a ordem divina anterior.
