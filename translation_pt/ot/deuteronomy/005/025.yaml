base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: pt
  text: E agora, por que haveríamos de morrer? Pois este grande fogo nos consumirá. Se continuarmos a ouvir por mais tempo a voz de Javé[a], nosso Deus, morreremos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH (יהוה), o nome divino, aqui representado por “Javé”.'
    reason: Esclarece a representação do Tetragrama e permite ao leitor reconhecer o nome presente no texto hebraico.
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto o sentido temporal imediato.
- source_word: לָמָּה נָמוּת
  choice: por que haveríamos de morrer?
  rationale: A pergunta é retórica e exprime a perspectiva temida; esta formulação conserva melhor essa nuance do imperfeito do que um simples futuro.
- source_word: כִּי תֹאכְלֵנוּ
  choice: Pois ... nos consumirá
  rationale: כִּי introduz a razão da pergunta, e אכל, tendo o fogo como sujeito, significa naturalmente consumir.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: este grande fogo
  rationale: Mantém o substantivo, o adjetivo e o demonstrativo do hebraico em ordem natural em português.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: Se continuarmos a ouvir
  rationale: A construção יסף + infinitivo indica continuar ou voltar a fazer algo; 'continuarmos a ouvir' é natural e fiel ao contexto.
- source_word: ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛ינוּ
  choice: a voz de Javé, nosso Deus
  rationale: קוֹל designa a voz divina neste contexto; o nome próprio יהוה é transliterado na forma portuguesa corrente 'Javé', e אֱלֹהֵינוּ conserva a relação expressa por 'nosso Deus'.
- source_word: עוֹד וָמָתְנוּ
  choice: morreremos
  rationale: 'עוֹד reforça a ideia de continuidade já expressa por ''continuarmos''; o resultado final é apresentado diretamente: ''morreremos''.'
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Javé
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Javé' preserva o nome pessoal e corresponde à forma tradicionalmente adaptada à fonologia e à ortografia portuguesas; a nota informa a forma consonantal hebraica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. A repetição de 'morrer' foi mantida por refletir a estrutura e a intensidade do hebraico.
