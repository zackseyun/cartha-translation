source:
  edition: WLC
  text: אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of slaves.
translation:
  language: pt
  text: Eu sou Yahweh, seu Deus, que tirei você da terra do Egito, da casa de escravos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da casa da escravidão»; tradicionalmente, «da casa da servidão». O hebraico diz literalmente «da casa de escravos».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Eu sou
  rationale: O pronome independente de primeira pessoa forma uma oração nominal em hebraico; em português, a cópula expressa produz uma autoidentificação natural e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Representa diretamente אֱלֹהִים com o sufixo masculino singular de segunda pessoa; no contexto da aliança, refere-se ao Deus de Israel.
- source_word: אֲשֶׁר
  choice: que
  rationale: O relativo português «que» é natural e preserva a ligação com a autoidentificação precedente.
- source_word: הוֹצֵאתִיךָ
  choice: tirou você
  rationale: O hifil de יצא significa fazer sair ou tirar; esta formulação é clara e idiomática em português, mantendo o destinatário no singular.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: A preposição מִן indica a origem; «da terra do Egito» é natural, e o sentido de movimento para fora já está no verbo.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Preserva a imagem concreta e o plural de עֲבָדִים, embora «casa de escravidão» seja mais idiomático em algumas tradições portuguesas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome pessoal; «Yahweh» o conserva em transliteração, sem trocá-lo por um título.
- issue: Sentido de עֲבָדִים na fórmula do êxodo
  choice: escravos
  alternative: escravidão; servos
  rationale: O substantivo plural designa pessoas escravizadas. A escolha conserva a realidade social concreta e evita enfraquecê-la como mera servidão.
- issue: Número do destinatário em אֱלֹהֶיךָ e הוֹצֵאתִיךָ
  choice: 'segunda pessoa do singular: «seu» e «você»'
  alternative: 'formas plurais: «vosso» e «vocês»'
  rationale: Os sufixos hebraicos são masculinos singulares, dirigindo a declaração a Israel como interlocutor coletivo singular.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Você» explicita a segunda pessoa singular de modo corrente; a repetição de «da» acompanha as duas expressões paralelas de origem. O marcador foi colocado após a expressão à qual a nota se refere.
