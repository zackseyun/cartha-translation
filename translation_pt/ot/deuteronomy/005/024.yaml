base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: pt
  text: 'E vocês disseram: “Vejam! O SENHOR, nosso Deus, nos mostrou a sua glória e a sua grandeza, e ouvimos a sua voz do meio do fogo. Hoje vimos que Deus pode falar com o ser humano, e que o ser humano continua vivo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Vejam!
  rationale: Partícula de apresentação e ênfase, vertida de modo natural e perceptível no discurso direto.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o tetragrama por SENHOR em versaletes.
- source_word: כְּבֹדוֹ וְאֶת־גָּדְלוֹ
  choice: a sua glória e a sua grandeza
  rationale: Mantém os dois substantivos distintos e a formulação solene do hebraico.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: do meio do fogo
  rationale: Reproduz diretamente a imagem espacial do texto hebraico.
- source_word: אֶת־הָאָדָם
  choice: com o ser humano
  rationale: O artigo em הָאָדָם tem valor genérico neste contexto; a tradução inclusiva e corrente evita restringir a afirmação a um homem específico.
- source_word: וָחָי
  choice: e este ainda continuar vivo
  rationale: Expressa a construção coordenada hebraica e deixa explícito, em português, que o ser humano que ouve Deus permanece vivo.
theological_decisions:
- issue: Valor modal de יְדַבֵּר na oração com כִּי
  choice: Deus pode falar
  alternative: Deus fala
  rationale: No contexto, o povo conclui pela possibilidade demonstrada de Deus falar com um ser humano sem que este morra; “pode falar” preserva essa força contextual sem afirmar incapacidade ou mera permissão.
- issue: Sujeito implícito de וָחָי
  choice: e este ainda continuar vivo
  alternative: e ele vive
  rationale: O sujeito é o ser humano mencionado imediatamente antes, não Deus. “Este” desfaz a ambiguidade referencial natural em português, enquanto “ainda” comunica a sobrevivência inesperada diante da manifestação divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” reflete o discurso de Moisés ao povo. A sintaxe conserva a progressão retórica do hebraico sem rigidez excessiva.
