base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/030.yaml
  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: pt
  text: 'Vá e diga a eles: “Voltem para as suas tendas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: Vá
  rationale: O imperativo singular de הלך ordena a Moisés que se dirija para transmitir a mensagem. “Vá” é direto e natural em português.
- source_word: אֱמֹר
  choice: diga
  rationale: O imperativo singular de אמר introduz o conteúdo da mensagem. “Diga” expressa naturalmente o ato de fala dirigido a terceiros.
- source_word: לָהֶם
  choice: a eles
  rationale: A preposição com sufixo masculino plural marca os destinatários da fala; “a eles” preserva essa relação de modo claro.
- source_word: שׁוּבוּ
  choice: Voltem
  rationale: O imperativo plural de שוב indica retorno ao lugar anterior. “Voltem” conserva tanto o número plural quanto o sentido direcional.
- source_word: לָכֶם
  choice: para as suas
  rationale: Com שוב, a construção indica movimento de volta ao lugar próprio dos destinatários. Em português, isso se exprime naturalmente com “para as suas”.
- source_word: לְאָהֳלֵיכֶם
  choice: tendas
  rationale: A tradução concreta “tendas” preserva o cenário histórico e é perfeitamente compreensível em português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos naturais no plural para o povo e manutenção da imagem concreta das tendas. A coordenação “Vá e diga” evita uma sequência excessivamente literal de imperativos sem alterar o sentido.
