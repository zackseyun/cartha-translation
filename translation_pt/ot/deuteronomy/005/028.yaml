  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת ק֣וֹל דִּבְרֵי/כֶ֔ם בְּ/דַבֶּרְ/כֶ֖ם אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שָׁ֠מַעְתִּי אֶת ק֨וֹל דִּבְרֵ֜י הָ/עָ֤ם הַ/זֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔י/ךָ הֵיטִ֖יבוּ כָּל אֲשֶׁ֥ר דִּבֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: pt
  text: 'E Javé ouviu as palavras de vocês quando falavam comigo[a]. Então Javé me disse: “Ouvi as palavras deste povo, que eles disseram a você. Eles falaram bem em tudo o que disseram[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ouviu a voz (ou o som) das palavras de vocês”; trata-se de um idioma auditivo hebraico.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eles agiram bem em tudo o que disseram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome divino, em vez de substituí-lo por um título.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: ouviu / ouvi
  rationale: O verbo descreve diretamente a audição do que o povo falou; o pretérito perfeito é natural tanto na narrativa quanto no discurso direto.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: as palavras de vocês / as palavras
  rationale: O hebraico traz literalmente um idioma auditivo, 'a voz/o som das palavras'. Em português corrente, 'ouvir as palavras' comunica o mesmo sentido sem uma construção artificial; a forma literal é preservada em nota.
- source_word: בְּדַבֶּרְכֶם אֵלַי
  choice: quando falavam comigo
  rationale: A preposição com o infinitivo marca uma ação contemporânea. O imperfeito português expressa naturalmente a ação em curso no momento em que Javé a ouviu.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o substantivo coletivo singular e o demonstrativo do hebraico.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: que eles disseram a você
  rationale: Preserva a oração relativa e o destinatário singular, Moisés, distinguindo-o do plural anterior dirigido ao povo.
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: Eles falaram bem em tudo o que disseram
  rationale: No contexto, a avaliação positiva recai sobre a fala do povo. A tradução mantém essa ligação, sem ocultar que o verbo também pode significar 'agir/fazer bem'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino, não o título אֲדֹנָי. 'Javé' preserva essa distinção e é uma forma amplamente reconhecida em português.
- issue: Sentido de הֵיטִיבוּ na aprovação divina
  choice: Eles falaram bem
  alternative: Eles agiram bem
  rationale: A sequência 'em tudo o que disseram' favorece uma referência à correção da fala, mas a alternativa mais formalmente verbal permanece possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Usa “vocês” para o plural e “você” para o singular a fim de tornar visível a mudança do povo para Moisés. Evita reproduzir mecanicamente o idioma auditivo hebraico no corpo do texto, mas o documenta em nota.
