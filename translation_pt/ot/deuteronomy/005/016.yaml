  text: כַּבֵּ֤ד אֶת אָבִ֨י/ךָ֙ וְ/אֶת אִמֶּ֔/ךָ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְמַ֣עַן יַאֲרִיכֻ֣/ן יָמֶ֗י/ךָ וּ/לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: pt
  text: Honre o seu pai e a sua mãe, como Yahweh, seu Deus, lhe ordenou, para que os seus dias se prolonguem e para que lhe vá bem na terra que Yahweh, seu Deus, lhe está dando.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: Honre
  rationale: O imperativo piel de כבד, nesta relação familiar, significa tratar com honra e devido valor. “Honre” expressa de modo direto e natural tanto a obrigação ética quanto a força do termo hebraico.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: o seu pai e a sua mãe
  rationale: A repetição da marca de objeto אֶת diante de cada substantivo dá destaque equilibrado aos dois pais. A repetição dos artigos e possessivos preserva essa simetria em português.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: como ... lhe ordenou
  rationale: כַּאֲשֶׁר liga o mandamento à ordem divina já dada. O pretérito “ordenou” transmite naturalmente a referência anterior do perfeito hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino יהוה, aqui transliterado como “Yahweh”, em vez de ser substituído por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: 'A forma com sufixo de segunda pessoa singular indica posse e relação de aliança: “seu Deus”.'
- source_word: לְמַעַן
  choice: para que
  rationale: לְמַעַן introduz propósito ou resultado. “Para que” preserva essa relação de maneira clara e natural.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: os seus dias se prolonguem
  rationale: A tradução mantém “seus dias” como sujeito, de acordo com o hebraico, e expressa a ideia de duração prolongada sem reduzi-la à paráfrase “viva muito”.
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: e tudo lhe vá bem
  rationale: A expressão idiomática ייטב לך comunica bem-estar. “Tudo lhe vá bem” é corrente, digna e evita limitar a promessa a prosperidade material.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: Embora עַל tenha como sentido básico “sobre”, aqui אֲדָמָה designa a terra concedida por Deus. “Na terra” é a formulação idiomática em português e preserva a dimensão territorial da promessa.
- source_word: נֹתֵן לָךְ
  choice: lhe está dando
  rationale: O particípio נֹתֵן apresenta a dádiva como ação em curso ou iminente e certa. “Lhe está dando” conserva esse aspecto sem convertê-lo simplesmente em futuro.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Natureza da promessa ligada à honra aos pais
  choice: Manter a promessa de longevidade e bem-estar na terra sem defini-la como garantia individual absoluta nem como promessa exclusivamente coletiva
  alternative: Entendê-la apenas como garantia universal de longevidade individual; ou apenas como promessa nacional sem dimensão individual
  rationale: O hebraico apresenta uma promessa real no contexto da aliança, mas o versículo não resolve sozinho a relação entre suas dimensões individual e comunitária. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “lhe” evita alternância entre “tu” e “você” e mantém fluidez formal sem arcaísmo. Não foram mantidas as notas da camada inglesa porque seus marcadores não correspondem aos pontos do texto a que deveriam se referir; as variantes não são necessárias para compreender o versículo em português.
