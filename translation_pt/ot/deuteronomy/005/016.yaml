    rationale: יִיטַב לָךְ é uma expressão de bem-estar, literalmente algo como “seja bom para você” ou idiomaticamente “lhe vá bem”. O pronome indefinido “tudo” torna a afirmação mais abrangente do que o hebraico requer.
