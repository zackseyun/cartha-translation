base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: pt
  text: Mas você, fique de pé aqui comigo, e eu lhe falarei todo o mandamento[a], os estatutos e os juízos que você lhes ensinará, para que os cumpram na terra que eu lhes dou, a fim de tomarem posse dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mandamento inteiro”. O hebraico emprega aqui um substantivo no singular, seguido dos plurais “estatutos” e “juízos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para a herdarem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: fique aqui comigo
  rationale: A expressão mantém a ordem direta e a ideia contextual de permanecer na presença de Deus, em português atual e natural. Embora עָמַד signifique literalmente “estar de pé”, aqui a força idiomática é permanecer no lugar.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: e eu lhe falarei
  rationale: O coortativo após o imperativo indica a ação volitiva subsequente de Deus; o futuro conserva bem a sequência e a solenidade.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: todo o mandamento
  rationale: Preserva o singular hebraico de מִצְוָה e a totalidade expressa por כָּל, sem convertê-lo silenciosamente em plural.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: “Estatutos” é uma tradução estabelecida em contexto pactual e mantém a distinção em relação aos outros termos jurídicos do versículo.
- source_word: הַמִּשְׁפָּטִים
  choice: os juízos
  rationale: “Juízos” conserva a ligação de מִשְׁפָּטִים com decisões e normas de justiça, além de preservar a tríade lexical.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: que você lhes ensinará
  rationale: O imperfeito tem valor instrutivo e futuro; a formulação comunica diretamente a incumbência dada a Moisés.
- source_word: וְעָשׂוּ
  choice: para que os cumpram
  rationale: A locução explicita a relação de finalidade entre o ensino e a obediência. “Cumpram” é natural para mandamentos, estatutos e juízos e evita o pouco idiomático “façam-nos”.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: que eu lhes dou
  rationale: O presente português representa o particípio נֹתֵן como concessão divina em curso ou iminente.
- source_word: לְרִשְׁתָּהּ
  choice: a fim de tomarem posse dela
  rationale: A expressão comunica concretamente o sentido de יָרַשׁ neste contexto e torna explícito que o sufixo feminino retoma “terra”.
theological_decisions:
- issue: Tríade jurídica מִצְוָה / חֻקִּים / מִשְׁפָּטִים
  choice: mandamento / estatutos / juízos
  alternative: lei / decretos / normas
  rationale: A manutenção de três termos distintos respeita a textura jurídica da instrução pactual sem reduzi-la a uma categoria genérica.
- issue: Número singular de מִצְוָה
  choice: todo o mandamento
  alternative: todos os mandamentos
  rationale: O substantivo hebraico está no singular, possivelmente com valor coletivo. A tradução conserva essa forma e deixa aberta sua extensão exata.
- issue: Relação entre o ensino de Moisés e a prática de Israel
  choice: para que os cumpram
  alternative: e eles os cumprirão
  rationale: A leitura final ou resultativa é natural no encadeamento, mas não transforma a obediência em mera previsão automática.
translation_notes:
  register: Português moderno, digno e acessível, com “você” para clareza amplamente compreensível e pronomes átonos naturais (“lhe”, “lhes”). A formulação evita arcaísmos, mas conserva a solenidade e a diferenciação jurídica do hebraico.
