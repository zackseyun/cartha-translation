  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: pt
  text: Não se curve diante delas[a] nem as sirva, pois eu, Yahweh, seu Deus, sou um Deus ciumento[d], que visita[b] a iniquidade dos pais sobre os filhos, sobre a terceira e a quarta geração[c] daqueles que me odeiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se prostre diante delas”. O verbo hebraico descreve o ato de inclinar-se ou prostrar-se em reverência.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pede contas por” ou “castiga”. O hebraico diz literalmente “visita”, termo judicial amplo que pode incluir tanto a prestação de contas quanto a punição.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “sobre os terceiros e sobre os quartos”. A palavra “geração” está implícita e foi acrescentada para dar clareza.'
    reason: lexical_alternative
  - marker: d
    text: “Ciumento” descreve a exigência de lealdade exclusiva no contexto da aliança; não sugere inveja ou insegurança humanas.
    reason: contextual_clarification
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: se curve diante delas
  rationale: Preserva a ação concreta de inclinar-se em reverência e mantém sua distinção em relação a 'servir'.
- source_word: תָעָבְדֵם
  choice: as sirva
  rationale: Expressa o serviço cultual prestado às imagens sem fundir os dois verbos hebraicos em um único termo como 'adorar'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֵל קַנָּא
  choice: Deus zeloso
  rationale: Em português atual, 'zeloso' comunica o zelo de Deus por sua relação exclusiva de aliança sem sugerir diretamente a inveja ou insegurança que 'ciumento' pode evocar; a nota registra a alternativa tradicional.
- source_word: פֹּקֵד
  choice: visita
  rationale: Mantém a amplitude do termo judicial hebraico, que pode envolver levar em conta, pedir contas e punir, sem restringi-lo silenciosamente a uma dessas nuances.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: Conserva o peso moral e a possível amplitude entre ato perverso, culpa e suas consequências.
- source_word: אָבוֹת
  choice: pais
  rationale: Reproduz o substantivo masculino plural hebraico e sua referência geracional.
- source_word: עַל בָּנִים
  choice: nos filhos
  rationale: É a correspondência natural de בנים neste encadeamento de gerações; pode abranger os descendentes.
- source_word: וְעַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: na terceira e na quarta geração
  rationale: Supre 'geração', implícito no idioma hebraico, para produzir português claro e natural.
- source_word: לְשֹׂנְאָי
  choice: daqueles que me odeiam
  rationale: Mantém a frase final ligada aos descendentes abrangidos pela visitação, sem apagar a tensão sintática e teológica do enunciado.
theological_decisions:
- issue: Sentido do zelo divino
  choice: Deus zeloso
  alternative: Deus ciumento
  rationale: O contexto exige devoção exclusiva. 'Zeloso' comunica essa reivindicação de aliança em português corrente, enquanto a alternativa mais literal é preservada em nota.
- issue: Alcance transgeracional da visitação da iniquidade
  choice: Conservar 'daqueles que me odeiam' ao fim da oração, qualificando naturalmente as gerações mencionadas
  alternative: Entender que os descendentes são punidos automaticamente apenas pelo pecado dos pais
  rationale: A construção hebraica permite que a expressão final delimite os que permanecem em oposição a Deus. A tradução preserva essa relação sem transformar a ambiguidade em uma afirmação doutrinária explícita.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A coordenação e a ordem da oração acompanham de perto o hebraico, mas ''geração'' é explicitada por clareza idiomática. Observação editorial: a nota [d] deve ter marcador no texto; por isso, a forma final para publicação deve ler ''Deus zeloso[d]''.'
