base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: pt
  text: Não foi com nossos pais[a] que Yahweh fez esta aliança[b], mas conosco[c] — nós que hoje estamos todos aqui vivos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nossos antepassados”. O hebraico diz literalmente “nossos pais”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente: “cortou esta aliança”.'
    reason: lexical_alternative
  - marker: c
    text: 'Alguns entendem o contraste de modo retórico: não somente com nossos pais, mas especialmente conosco, os que hoje estamos aqui vivos.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית הַזֹּאת
  choice: fez esta aliança
  rationale: O hebraico usa literalmente o idioma “cortar uma aliança”; em português atual, “fazer uma aliança” comunica naturalmente o sentido, e “esta” preserva o demonstrativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: אֲבֹתֵינוּ
  choice: nossos pais
  rationale: Reproduz de modo direto o termo hebraico “pais”; “nossos antepassados” permanece como alternativa lexical em nota.
- source_word: כִּי
  choice: mas
  rationale: Após a negação, a conjunção introduz aqui um contraste, expresso naturalmente em português por “mas”.
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה
  choice: conosco — conosco mesmos
  rationale: A retomada enfática e a aposição hebraicas são representadas por repetição deliberada, sem tentar regularizar completamente a construção.
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: todos nós que estamos aqui vivos hoje
  rationale: Preserva a totalidade, a localização, o tempo presente e a condição de estarem vivos, com ordem natural em português.
theological_decisions:
- issue: Se o versículo nega de modo absoluto que a aliança tenha sido feita com os antepassados ou enfatiza sua aplicação à geração presente
  choice: 'Manter no texto principal o contraste direto: “Não foi com nossos pais... mas conosco”.'
  alternative: 'Entender retoricamente: “não somente com nossos pais, mas especialmente conosco”.'
  rationale: O hebraico não contém “somente”. A tradução conserva a tensão do enunciado, enquanto a nota registra a interpretação retórica possível sem inseri-la no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “conosco — conosco mesmos” conserva a ênfase incomum do hebraico; as notas seguem a ordem alfabética de seus marcadores no texto.
