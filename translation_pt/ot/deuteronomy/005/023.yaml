base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: pt
  text: E, quando vocês ouviram a voz vinda do meio da escuridão[a], enquanto o monte ardia em fogo, vocês se aproximaram de mim — todos os chefes de suas tribos e seus anciãos —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o som”. A palavra hebraica qôl pode significar tanto “voz” como “som”; neste contexto, “voz” se ajusta melhor ao fato de Deus estar falando do meio da escuridão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: E aconteceu que, quando vocês ouviram
  rationale: A construção introduz o acontecimento seguinte e uma oração temporal. A formulação preserva a transição narrativa hebraica sem soar excessivamente rígida em português.
- source_word: הַקּוֹל
  choice: a voz
  rationale: Embora קוֹל possa significar tanto “voz” como “som”, o contexto é o discurso de Deus; “voz” comunica melhor a origem pessoal, mantendo a alternativa em nota.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: vinda do meio da escuridão
  rationale: Preserva a imagem espacial de תּוֹךְ, isto é, a voz procedendo de dentro da escuridão, em português natural.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: enquanto o monte ardia em fogo
  rationale: O waw é entendido circunstancialmente, e o particípio descreve uma ação simultânea e contínua. “Ardia em fogo” conserva a intensidade da imagem.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: vocês se aproximaram de mim
  rationale: קרב indica movimento para perto de alguém; a forma pronominal é idiomática e digna em português.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: todos os chefes das suas tribos
  rationale: “Chefes” conserva o sentido metafórico e institucional de רָאשֵׁי, sem sugerir apenas homens fisicamente à frente.
- source_word: וְזִקְנֵיכֶם
  choice: e os seus anciãos
  rationale: No contexto, זְקֵנִים são autoridades comunitárias reconhecidas, não simplesmente pessoas idosas; “anciãos” é preciso e corrente no registro bíblico.
