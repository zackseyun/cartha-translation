  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: pt
  text: 'Moisés convocou todo o Israel e lhes disse: “Ouça[a], Israel, os estatutos e as decisões legais[b] que hoje estou proclamando aos ouvidos de vocês. Aprendam-nos e observem-nos, para os pôr em prática.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Escute”. O imperativo hebraico indica ouvir com atenção de modo que isso conduza à obediência, não apenas perceber sons.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “juízos”, “ordenanças” ou “normas”. O termo hebraico se refere a decisões judiciais ou a normas legalmente prescritas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convocou
  rationale: No contexto de um discurso dirigido à assembleia de Israel, קרא indica chamar ou reunir o povo; “convocou” comunica com naturalidade essa força coletiva.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a designação coletiva e pactual do povo como um todo, em formulação corrente em português.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Ouça, Israel
  rationale: O imperativo שׁמע exige atenção receptiva e, neste contexto pactual, aponta para uma resposta obediente; “ouça” preserva a solenidade sem ser arcaico.
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: חקים designa prescrições estabelecidas; “estatutos” conserva o registro jurídico-pactual e a distinção em relação a משפטים.
- source_word: הַמִּשְׁפָּטִים
  choice: as decisões legais
  rationale: משפטים pode indicar decisões judiciais ou normas legalmente prescritas. “Decisões legais” torna clara essa nuance no português atual e evita que “juízos” seja entendido apenas como condenações.
- source_word: דֹּבֵר
  choice: estou proclamando
  rationale: O particípio expressa ação em curso. “Estou proclamando” representa a situação imediata do discurso público, sem reduzir a fala a mera conversa.
- source_word: בְּאָזְנֵיכֶם
  choice: diante de vocês
  rationale: A expressão significa literalmente “aos ouvidos de vocês” e indica comunicação oral direta. “Diante de vocês” é idiomático em português no contexto de proclamação pública.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Preserva de modo direto a atualidade e a urgência pactual do discurso.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: Aprendam-nos
  rationale: Mantém o chamado a aprender e assimilar as prescrições, bem como o objeto pronominal explícito do hebraico.
- source_word: וּשְׁמַרְתֶּם
  choice: observem-nos
  rationale: Em contexto pactual, שׁמר significa guardar ou observar mandamentos. “Observar” expressa fidelidade prática sem sugerir apenas conservação passiva.
- source_word: לַעֲשֹׂתָם
  choice: para os pôr em prática
  rationale: O infinitivo expressa a finalidade concreta da aprendizagem e observância. A formulação natural comunica o sentido hebraico de efetivamente fazer ou cumprir as prescrições.
theological_decisions:
- issue: Distinção entre חקים e משפטים no vocabulário da aliança
  choice: os estatutos e as decisões legais
  alternative: os decretos e os juízos; os estatutos e as ordenanças
  rationale: Os dois termos jurídicos relacionados não são fundidos numa expressão genérica. A tradução conserva a distinção lexical sem impor categorias doutrinárias posteriores.
- issue: Força do imperativo שׁמע na exortação pactual
  choice: Ouça, Israel
  alternative: Escute, Israel
  rationale: A expressão abrange audição atenta orientada para a obediência. “Ouça” mantém a ressonância solene e deixa que a sequência do versículo explicite a aprendizagem e a prática.
- issue: Relação entre guardar e fazer em וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: observem-nos, para os pôr em prática
  alternative: guardem-nos, para os cumprir
  rationale: A tradução mantém as duas ideias e a relação de finalidade, sem reduzir a observância a conhecimento mental nem fundir silenciosamente os dois verbos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Convocou” esclarece o cenário coletivo; “decisões legais” preserva o campo jurídico sem o possível equívoco moderno de “juízos”; e “pôr em prática” expressa de modo natural a obediência concreta. Os marcadores [a] e [b] aparecem no texto principal junto às expressões que explicam.
