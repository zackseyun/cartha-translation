  text: And you shall not commit adultery[a].
translation:
  language: pt
  text: E não cometa adultério.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, na forma tradicional: “E não cometerás adultério.” O hebraico inclui uma conjunção (“e”) que liga este mandamento aos anteriores.'
    reason: alternativa de forma e esclarecimento lexical
lexical_decisions:
- source_word: וְ/לֹא
  choice: E não
  rationale: A conjunção וְ liga esta proibição aos mandamentos anteriores, por isso é preservada como “E”. A partícula לֹא expressa uma proibição categórica.
- source_word: תִּנְאָף
  choice: cometa adultério
  rationale: O Qal imperfeito na segunda pessoa masculina singular tem força proibitiva no Decálogo. “Cometer adultério” é a expressão portuguesa corrente e precisa para a violação conjugal indicada por נאף.
theological_decisions:
- issue: Forma da proibição na segunda pessoa masculina singular da legislação da aliança
  choice: E não cometa adultério.
  alternative: E não cometerás adultério.
  rationale: “Não cometa” mantém a proibição direta e solene em português moderno, sem tornar o futuro morfológico português uma correspondência artificial ao imperfeito hebraico. A conjunção inicial é mantida para refletir a coordenação do texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita arcaísmo desnecessário, preserva a conjunção hebraica e mantém o caráter categórico do mandamento.
