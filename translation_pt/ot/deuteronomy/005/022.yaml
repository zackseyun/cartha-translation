  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: pt
  text: Yahweh falou estas palavras a toda a assembleia de vocês, no monte, do meio do fogo, da nuvem e da escuridão densa, em alta voz, e não acrescentou mais nada.[a] Ele as escreveu em duas tábuas de pedra e as deu a mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não continuou [a falar]”. A expressão hebraica pode significar que ele não acrescentou mais nada ou que não continuou a falar.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando seu caráter pessoal.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: Estas palavras
  rationale: Mantém o sentido básico de דְּבָרִים e a ênfase nas declarações que acabavam de ser pronunciadas, sem explicitar além do texto que eram “mandamentos”.
- source_word: כָּל קְהַלְכֶם
  choice: toda a assembleia de vocês
  rationale: Expressa a comunidade reunida e reproduz de maneira clara o sufixo de segunda pessoa do plural.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: do meio do fogo, da nuvem e da escuridão densa
  rationale: Preserva a força espacial de מִתּוֹךְ e traduz עֲרָפֶל como escuridão espessa ou profunda, em linguagem portuguesa natural.
- source_word: קוֹל גָּדוֹל
  choice: em alta voz
  rationale: Comunica naturalmente a intensidade da voz divina; a expressão hebraica é literalmente “voz grande”.
- source_word: וְלֹא יָסָף
  choice: e não acrescentou mais nada
  rationale: No contexto, indica que Yahweh nada acrescentou àquelas palavras; a possibilidade de entender a frase como interrupção ou não continuação da fala é mantida em nota.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: duas tábuas de pedra
  rationale: É uma formulação corrente e fiel à construção hebraica.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: e as deu a mim
  rationale: Mantém Yahweh como sujeito e Moisés como destinatário, com o referente feminino plural naturalmente associado às tábuas em português.
theological_decisions:
- issue: Representação do nome divino YHWH
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome próprio presente no hebraico e evita substituí-lo por um título.
- issue: Sentido de וְלֹא יָסָף
  choice: não acrescentou mais nada
  alternative: não continuou [a falar]
  rationale: A leitura escolhida combina com a referência às palavras completas depois escritas nas tábuas, mas a forma hebraica permite entender que Yahweh não continuou a falar. A nota conserva essa ambiguidade sem impor uma conclusão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Assembleia de vocês” evita tanto o tom excessivamente tradicional de “congregação” quanto uma construção artificial. O marcador da nota foi colocado junto à expressão ambígua a que efetivamente se refere.
