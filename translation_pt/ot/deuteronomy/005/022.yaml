  naturalness: A abertura "Estas palavras Yahweh falou" segue uma ordem pouco natural no português moderno. "Yahweh falou estas palavras" é mais fluente sem perda de ênfase ou fidelidade. Também é preferível evitar "Depois", que explicita uma relação temporal além da simples progressão narrativa do waw hebraico.
  terminology: '"Yahweh", "assembleia", "escuridão densa" e "tábuas de pedra" são escolhas claras, dignas e adequadas ao registro. "Toda a assembleia de vocês" preserva a segunda pessoa plural e tem boa legibilidade internacional.'
