revisions:
- from: Estas palavras Yahweh falou a toda a assembleia de vocês, no monte, do meio do fogo, da nuvem e da escuridão densa, em alta voz; e não acrescentou mais nada.[a] Depois, escreveu-as em duas tábuas de pedra e as deu a mim.
  to: Yahweh falou estas palavras a toda a assembleia de vocês, no monte, do meio do fogo, da nuvem e da escuridão densa, em alta voz, e não acrescentou mais nada.[a] Ele as escreveu em duas tábuas de pedra e as deu a mim.
  rationale: A revisão melhora a ordem sintática e a fluência em português, sem alterar o sentido, o registro ou a ambiguidade assinalada em nota. A repetição de "Ele" torna inequívoca a continuidade do sujeito divino após a cláusula ambígua.
