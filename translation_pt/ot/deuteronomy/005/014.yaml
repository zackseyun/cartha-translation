revisions:
- from: Mas o sétimo dia é sábado dedicado a Yahweh, seu Deus. Não faça trabalho algum — nem você, nem seu filho, nem sua filha, nem seu escravo, nem sua escrava, nem seu boi, nem seu jumento, nem qualquer outro animal seu, nem o estrangeiro residente que vive dentro das suas cidades[a] — para que seu escravo e sua escrava descansem como você.
  to: Mas o sétimo dia é um sábado dedicado a Yahweh, seu Deus. Não faça trabalho algum — nem você, nem seu filho, nem sua filha, nem seu escravo, nem sua escrava, nem seu boi, nem seu jumento, nem nenhum dos seus animais, nem o estrangeiro residente que mora nas suas cidades[a] — para que seu escravo e sua escrava descansem como você.
  rationale: A revisão substitui a expressão singular e adicionalmente qualificadora “qualquer outro animal” por uma formulação que abrange todos os animais do destinatário, conforme וְכָל־בְּהֶמְתֶּךָ. Também elimina a redundância em relação ao estrangeiro residente e ajusta a nota para explicar o idiomatismo de “portões” sem acrescentar a especificação interpretativa “sob a jurisdição de Israel”. A leve inclusão de “um” em “um sábado” torna a construção predicativa natural em português sem alterar a referência à instituição sabática.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:02:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a estrutura legal, o sábado dedicado a Yahweh, a proibição de trabalho e a finalidade de descanso para o escravo e a escrava. Contudo, “nem qualquer outro animal seu” não exprime com suficiente precisão וְכָל־בְּהֶמְתֶּךָ (“todo/qualquer [um] do seu gado/animais”): o acréscimo de “outro” não está no hebraico e a formulação no singular é menos abrangente que o coletivo hebraico.'
  naturalness: O português é atual e claro. “O estrangeiro residente que vive dentro das suas cidades” é um pouco redundante (“residente que vive”) e “dentro das cidades” não preserva bem, no corpo do texto, o idiomatismo de “dentro dos seus portões”. “Que mora nas suas cidades” é mais fluente e comunica o referente idiomático sem a redundância.
  terminology: “Yahweh”, “sábado”, “trabalho”, “escravo/escrava”, “boi”, “jumento” e “estrangeiro residente” são escolhas adequadas e consistentes com o hebraico. “Animais” é uma solução ampla e natural para בְּהֵמָה neste contexto, sem excluir boi e jumento.
  issues:
  - severity: medium
    issue: “nem qualquer outro animal seu” para וְכָל־בְּהֶמְתֶּךָ
    rationale: O hebraico diz “todo o seu gado/animais”, não “qualquer outro animal”. “Outro” é uma inferência dispensável, e o singular não transmite tão claramente a abrangência coletiva. “Nem nenhum dos seus animais” preserva a inclusão de todos os animais pertencentes ao destinatário.
  - severity: low
    issue: “o estrangeiro residente que vive dentro das suas cidades”
    rationale: A expressão é redundante e a construção “dentro das cidades” é menos natural. “O estrangeiro residente que mora nas suas cidades” comunica de modo idiomático o sentido de גֵּר ... בִּשְׁעָרֶיךָ; a nota conserva a imagem literal dos portões.
  revised_text: Mas o sétimo dia é um sábado dedicado a Yahweh, seu Deus. Não faça trabalho algum — nem você, nem seu filho, nem sua filha, nem seu escravo, nem sua escrava, nem seu boi, nem seu jumento, nem nenhum dos seus animais, nem o estrangeiro residente que mora nas suas cidades[a] — para que seu escravo e sua escrava descansem como você.
  revised_footnotes:
