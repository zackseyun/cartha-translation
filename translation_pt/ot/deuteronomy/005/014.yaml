source:
  edition: WLC
  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male slave, or your female slave, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male slave and your female slave may rest as you do.
translation:
  language: pt
  text: Mas o sétimo dia é um sábado dedicado a Yahweh, seu Deus. Não faça trabalho algum — nem você, nem seu filho, nem sua filha, nem seu escravo, nem sua escrava, nem seu boi, nem seu jumento, nem nenhum dos seus animais, nem o estrangeiro residente que mora nas suas cidades[a] — para que seu escravo e sua escrava descansem como você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dentro dos seus portões”; expressão idiomática que se refere aos que residem em suas cidades ou comunidades.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבָּת
  choice: sábado
  rationale: Designa a instituição pactual específica e já é o termo estabelecido em português, não apenas um descanso genérico.
- source_word: לַיהוָה
  choice: dedicado a Yahweh
  rationale: A preposição ל indica que o dia pertence a Yahweh ou lhe é consagrado; “dedicado a” explicita esse sentido com naturalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, preservando seu caráter de nome próprio.
- source_word: מְלָאכָה
  choice: trabalho
  rationale: Termo amplo e natural para a categoria de atividade proibida na legislação sabática, sem especificá-la além do hebraico.
- source_word: עַבְדְּךָ
  choice: seu escravo
  rationale: O termo indica aqui um homem em condição de escravidão doméstica; “escravo” preserva a realidade social e a distinção de gênero do texto.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: sua escrava
  rationale: O substantivo feminino, em paralelo com עבד, indica uma mulher em condição de escravidão e mantém a distinção explícita no hebraico.
- source_word: שׁוֹר
  choice: boi
  rationale: Equivalente corrente e preciso para o bovino doméstico empregado no trabalho.
- source_word: חֲמוֹר
  choice: jumento
  rationale: Equivalente moderno, claro e amplamente compreensível para o animal doméstico mencionado.
- source_word: וְכָל בְּהֶמְתֶּךָ
  choice: nem qualquer outro animal seu
  rationale: Depois de boi e jumento, o substantivo abrange os demais animais domésticos pertencentes à pessoa; “outro” torna natural a relação inclusiva sem mudar o referente.
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Indica alguém de origem não israelita que reside de modo integrado e juridicamente vulnerável na comunidade, não um simples viajante.
- source_word: בִּשְׁעָרֶיךָ
  choice: dentro das suas cidades
  rationale: Traduz o sentido idiomático de estar dentro dos portões, isto é, residir nas localidades sob a jurisdição da comunidade.
- source_word: לְמַעַן יָנוּחַ
  choice: para que ... descansem
  rationale: Expressa de maneira natural a finalidade da proibição e conserva a forma verbal de repouso.
- source_word: כָּמוֹךָ
  choice: como você
  rationale: Mantém a comparação direta e a ênfase na igualdade de descanso concedida aos escravizados.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Natureza do sábado em לַיהוָה
  choice: sábado dedicado a Yahweh
  alternative: sábado de Yahweh; sábado para Yahweh
  rationale: A formulação comunica consagração e pertencimento sem decidir de modo excessivamente estreito entre as nuances possíveis da preposição ל.
- issue: Condição social expressa por עבד e אמה
  choice: escravo / escrava
  alternative: servo / serva
  rationale: Neste contexto doméstico e legal, os termos incluem condição de escravidão. A escolha evita suavizar essa realidade e preserva a extensão explícita do descanso a essas pessoas.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega singular informal-neutro em “você/seu”, coerente com a interpelação hebraica no singular. A enumeração mantém o ritmo legal; “não faça trabalho algum” reproduz a proibição abrangente. O marcador [a] aparece imediatamente após a expressão explicada.
