base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: pt
  text: Quem dera[a] que eles tivessem um coração assim, para me temer e guardar todos os meus mandamentos todos os dias, a fim de que lhes vá bem, a eles e a seus filhos, para sempre!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ah, se eles tivessem um coração assim». A expressão hebraica é uma fórmula de anseio, literalmente: «Quem dará...?».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Quem dera
  rationale: A expressão hebraica é uma fórmula de desejo intenso, literalmente «Quem dará?». «Quem dera» comunica esse anseio de modo natural e digno em português.
- source_word: וְהָיָה ... לְבָבָם זֶה לָהֶם
  choice: que eles tivessem ... um coração assim
  rationale: A construção que segue a fórmula de desejo é expressa naturalmente em português pelo imperfeito do subjuntivo. «Um coração assim» transmite o valor qualitativo do demonstrativo.
- source_word: לְבָבָם
  choice: coração
  rationale: No hebraico, o coração abrange vontade, pensamento e disposição interior. O termo preserva a antropologia bíblica sem restringir o sentido à mente ou às emoções.
- source_word: לְיִרְאָה אֹתִי
  choice: para me temer
  rationale: «Temer» conserva o termo pactual que inclui reverência, reconhecimento e disposição obediente diante de Deus.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: e guardar todos os meus mandamentos
  rationale: «Guardar» é uma combinação portuguesa corrente com «mandamentos» e comunica observância obediente.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Mantém de perto a expressão hebraica e, no contexto, comunica continuidade durante toda a vida.
- source_word: לְמַעַן
  choice: a fim de que
  rationale: Introduz com clareza a relação de propósito ou resultado presente no hebraico.
- source_word: יִיטַב לָהֶם
  choice: tudo vá bem com eles
  rationale: Reproduz a fórmula de bem-estar e bênção sem limitá-la à prosperidade material.
- source_word: וְלִבְנֵיהֶם
  choice: e com seus filhos
  rationale: Embora o substantivo tenha forma masculina, aqui designa coletivamente os filhos ou descendentes do povo.
- source_word: לְעֹלָם
  choice: para sempre
  rationale: Equivalente direto e natural para a duração indefinida ou perpétua indicada no texto.
theological_decisions:
- issue: Linguagem antropológica de לְבָבָם
  choice: coração
  alternative: mente; disposição interior
  rationale: «Coração» preserva a categoria bíblica ampla da vida interior, incluindo vontade, pensamento e orientação moral, sem a reduzir a mera cognição ou emoção.
- issue: Sentido do temor de Deus em לְיִרְאָה אֹתִי
  choice: me temer
  alternative: me reverenciar
  rationale: «Temer» mantém a tensão e a amplitude do termo bíblico, que neste contexto envolve reverência e obediência, sem substituir o conceito por uma interpretação mais estreita.
- issue: Referência de וְלִבְנֵיהֶם
  choice: seus filhos
  alternative: seus descendentes; seus filhos homens
  rationale: No contexto pactual, o masculino plural abrange a descendência do povo; «filhos» é natural em português e não restringe indevidamente a referência aos homens.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Quem dera» preserva a força emotiva da abertura; a ordem das orações acompanha o desenvolvimento do hebraico sem produzir rigidez. O marcador [a] aparece junto à expressão anotada.
