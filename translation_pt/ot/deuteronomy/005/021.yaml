  source_fidelity: A tradução preserva corretamente a distinção entre os dois verbos hebraicos (חמד, «cobiçar», e אוה, «desejar») e inclui explicitamente «campo», particularidade da formulação de Deuteronômio. Contudo, os dois «ou» na enumeração alteram a coordenação aditiva do hebraico (וְ... וְ...) e fazem os itens parecerem alternativas, não bens cumulativamente enumerados.
  naturalness: O imperativo negativo é moderno, claro e apropriado. A repetição de «dele» pode ser reduzida sem perder clareza, mas a enumeração precisa manter conjunção aditiva. A separação das duas proibições por ponto e vírgula torna especialmente clara a mudança de verbo no hebraico.
  terminology: «Mulher do seu próximo», «casa», «campo», «escravo», «escrava», «boi» e «jumento» são escolhas adequadas. A nota sobre «casa» deve evitar apresentar «família» como equivalência direta; neste contexto, «grupo doméstico» ou «patrimônio/propriedade» representa melhor a amplitude possível de בַּיִת.
