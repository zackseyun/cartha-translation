base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male slave, his female slave, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: pt
  text: Não cobice a mulher do seu próximo; não deseje[a] a casa[b] do seu próximo, o campo dele, o escravo dele, a escrava dele, o boi dele, o jumento dele, nem coisa alguma que pertença ao seu próximo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa aqui um verbo diferente do anterior, «cobice». Também pode ser traduzido por «anseie por».
    reason: lexical_alternative
  - marker: b
    text: «Casa» também pode ter o sentido mais amplo de grupo doméstico ou patrimônio; a lista que segue favorece aqui o sentido de propriedade.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: cobice
  rationale: חמד expressa aqui o desejo indevido pelo que pertence a outra pessoa. “Cobiçar” preserva tanto a força ética quanto a ressonância jurídica do mandamento.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: a mulher do seu próximo
  rationale: A expressão construta designa a esposa do próximo. Em português bíblico e jurídico, “a mulher do seu próximo” é natural e mantém o sentido conjugal no contexto.
- source_word: תִתְאַוֶּה
  choice: deseje
  rationale: O verbo אוה no hitpael se sobrepõe semanticamente a חמד, mas não é idêntico. “Desejar” preserva a variação lexical do hebraico sem enfraquecer a proibição.
- source_word: בֵּית רֵעֶךָ
  choice: a casa do seu próximo
  rationale: בַּיִת pode indicar a casa física, a família ou o patrimônio doméstico. A enumeração de bens favorece “casa”, embora o sentido mais amplo continue possível.
- source_word: שָׂדֵהוּ
  choice: o campo dele
  rationale: שָׂדֶה significa naturalmente “campo” e deve ser representado de modo explícito nesta formulação de Deuteronômio.
- source_word: עַבְדּוֹ וַאֲמָתוֹ
  choice: o escravo ou a escrava dele
  rationale: Os termos designam, respectivamente, uma pessoa escravizada do sexo masculino e outra do sexo feminino. “Escravo” e “escrava” tornam claro o status de sujeição e preservam o contraste de gênero.
- source_word: שׁוֹרוֹ
  choice: o boi dele
  rationale: שׁוֹר designa um bovino, frequentemente usado como animal de trabalho; “boi” é o equivalente português específico e corrente.
- source_word: חֲמֹרוֹ
  choice: o jumento dele
  rationale: חֲמוֹר designa o asno doméstico. “Jumento” é claro, atual e amplamente compreensível em português.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: nem coisa alguma que pertença ao seu próximo
  rationale: A expressão encerra a lista de maneira abrangente. “Que pertença” explicita naturalmente em português a relação possessiva do hebraico.
- source_word: רֵעֶךָ
  choice: seu próximo
  rationale: רֵעַ indica aqui a outra pessoa com quem se convive no âmbito comunitário. “Próximo” é a equivalência tradicional, precisa e amplamente inteligível.
theological_decisions:
- issue: Distinção entre os dois verbos de desejo na proibição
  choice: Traduzir חמד por “cobiçar” e אוה por “desejar”
  alternative: Traduzir ambos por “cobiçar” ou ambos por “desejar”
  rationale: O hebraico emprega dois verbos relacionados, mas distintos. Manter a diferença preserva a estrutura retórica e evita uniformizar indevidamente o texto.
- issue: Terminologia referente à escravidão
  choice: Usar “escravo” e “escrava”
  alternative: Usar “servo” e “serva”
  rationale: No contexto da lista de pessoas e bens pertencentes à casa, o status de sujeição é saliente. A tradução direta evita suavizar a realidade social refletida pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A proibição foi vertida no imperativo negativo (“Não cobice”) em vez do futuro tradicional (“Não cobiçarás”), para comunicar diretamente a força normativa do hebraico. Emprega-se “dele” em partes da enumeração para reduzir a possível ambiguidade possessiva de “seu” sem tornar a frase pesada.
