  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: pt
  text: Aproxime-se e ouça tudo o que o SENHOR, nosso Deus, disser. Depois, diga-nos tudo o que o SENHOR, nosso Deus, lhe disser; e nós ouviremos e faremos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: Aproxime-se você
  rationale: Preserva o imperativo e a ênfase explícita no pronome, pela qual o povo encarrega Moisés de se aproximar em seu lugar.
- source_word: וּשֲׁמָע
  choice: e ouça
  rationale: Traduz diretamente o imperativo שמע, mantendo a sequência de ações pedida a Moisés.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o nome divino pelo título em versaletes, sem introduzir uma vocalização disputada.
- source_word: וְאַתְּ תְּדַבֵּר אֵלֵינוּ
  choice: Depois, conte-nos
  rationale: O verbo דבר aqui introduz a transmissão ao povo do que Deus disser; 'conte-nos' é natural em português e preserva essa função comunicativa. 'Depois' explicita apenas a progressão contextual, sem alterar a relação entre as orações.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: nós ouviremos e obedeceremos
  rationale: A expressão hebraica é literalmente 'ouviremos e faremos'. Neste contexto de palavras e mandamentos divinos, 'obedeceremos' comunica naturalmente a força idiomática de ouvir e pôr em prática.
theological_decisions:
- issue: Representação do tetragrama יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção consolidada e amplamente inteligível em português, sem afirmar como certa uma reconstrução específica da pronúncia.
- issue: Força de וְעָשִׂינוּ
  choice: obedeceremos
  alternative: faremos
  rationale: A tradução idiomática expressa a resposta prática exigida pela fala divina, sem acrescentar uma doutrina específica; a alternativa literal é possível, mas menos clara isoladamente em português.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de 'o SENHOR, nosso Deus' foi mantida por corresponder à ênfase do hebraico. O pronome em 'Aproxime-se você' conserva a ênfase contrastiva do texto-fonte.
