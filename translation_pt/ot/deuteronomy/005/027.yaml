  rationale: A revisão conserva a estrutura e a repetição do hebraico, emprega formas naturais em português e mantém «ouviremos e faremos» como tradução não interpretativa da fórmula ושמענו ועשינו. «Lhe disser» deixa claro que a fala divina é dirigida a Moisés.
