base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: pt
  text: 'Então a viúva de seu irmão se aproximará dele na presença dos anciãos, tirará a sandália do pé dele, cuspirá no rosto dele[a] e responderá, dizendo: “Assim se fará ao homem que não quiser edificar a casa de seu irmão[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cuspirá diante dele”. Alguns entendem o hebraico como uma indicação de que ela cospe na frente do homem, e não diretamente no rosto dele.'
    reason: lexical_alternative
  - marker: b
    text: “Edificar a casa de seu irmão” significa estabelecer ou dar continuidade à linhagem familiar e à casa do irmão por meio do casamento levirato.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: a viúva de seu irmão
  rationale: No contexto da lei do levirato, designa especificamente a viúva do irmão falecido, não uma cunhada em sentido genérico.
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: na presença dos anciãos
  rationale: Expressa de modo natural o sentido literal de ocorrer diante dos olhos dos anciãos, destacando o caráter público e testemunhado do ato.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: tirará a sandália do pé dele
  rationale: חָלַץ indica aqui retirar o calçado; o singular do hebraico é preservado em “a sandália”.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: cuspirá no rosto dele
  rationale: É a leitura direta da construção hebraica e preserva a força humilhante do rito, sem ocultar a alternativa lexical indicada em nota.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: responderá, dizendo
  rationale: Reproduz os dois elementos da fórmula narrativa hebraica em português natural e digno.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Assim se fará
  rationale: Mantém a força solene e declarativa da fórmula, com construção idiomática em português.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: não quiser edificar a casa de seu irmão
  rationale: “Edificar a casa” conserva a metáfora hebraica de dar continuidade à família e ao nome do irmão; “não quiser” explicita a recusa voluntária estabelecida pelo contexto imediato.
theological_decisions:
- issue: Se בְּפָנָיו descreve a mulher cuspindo diretamente no rosto do homem ou diante dele
  choice: cuspirá no rosto dele
  alternative: cuspirá diante dele
  rationale: A tradução principal segue o sentido mais direto da expressão hebraica, enquanto a nota preserva a leitura alternativa sem resolver indevidamente a ambiguidade interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o caráter jurídico e público da cena, conserva a metáfora hebraica “edificar a casa” e usa notas para explicar tanto a alternativa lexical quanto o contexto cultural.
