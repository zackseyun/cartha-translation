  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: pt
  text: 'Se houver uma disputa entre homens[a], e eles comparecerem perante o tribunal[b], os juízes decidirão entre eles: absolverão o justo e condenarão o culpado[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando houver uma disputa entre homens”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “ao julgamento”, isto é, ao processo judicial ou ao tribunal.'
    reason: lexical_alternative
  - marker: c
    text: “Absolver” e “condenar” traduzem termos jurídicos que significam, literalmente, “declarar justo” e “declarar perverso ou culpado”. Aqui, “justo” e “culpado” se referem à posição de cada parte na causa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Se houver
  rationale: A expressão introduz uma situação típica de lei casuística. “Se houver” comunica de modo natural a força condicional, embora “Quando houver” também seja possível.
- source_word: רִיב
  choice: disputa
  rationale: No contexto judicial, o termo designa uma controvérsia ou litígio. “Disputa” é claro e acessível sem ser excessivamente técnico.
- source_word: בֵּין אֲנָשִׁים
  choice: entre homens
  rationale: O hebraico usa o plural masculino e apresenta litigantes homens; a tradução preserva essa especificidade textual.
- source_word: וְנִגְּשׁוּ אֶל הַמִּשְׁפָּט
  choice: e eles comparecerem perante o tribunal
  rationale: Literalmente, os litigantes “se aproximam do julgamento”. Em português jurídico corrente, “comparecer perante o tribunal” expressa com clareza a entrada no processo judicial.
- source_word: וּשְׁפָטוּם
  choice: os juízes decidirão entre eles
  rationale: O hebraico diz literalmente “e os julgarão”, com sujeito plural implícito. O contexto fornece os juízes; “decidirão entre eles” explicita a adjudicação da disputa sem alterar seu sentido.
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: absolverão o justo
  rationale: No hifil e em contexto forense, צדק significa declarar alguém em conformidade com o direito, isto é, absolvê-lo, e não torná-lo moralmente justo.
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: condenarão o culpado
  rationale: No hifil e em contexto judicial, רשע significa declarar culpado ou condenar. “Culpado” torna explícita a condição forense no caso, sem sugerir uma avaliação total do caráter da pessoa.
theological_decisions:
- issue: Sentido forense ou moral de צדק e רשע
  choice: 'Vereditos judiciais: “absolverão o justo e condenarão o culpado”'
  alternative: 'Caracterização moral: “declararão justo o justo e perverso o perverso”'
  rationale: Todo o versículo descreve um processo judicial. Assim, os verbos indicam declarações legais sobre quem tem razão e quem é culpado na causa, não transformação moral nem categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com terminologia judicial compreensível em diferentes regiões lusófonas. “Perante o tribunal” e “absolver/condenar” mantêm o cenário forense; a nota preserva a formulação hebraica e sua tensão lexical.
