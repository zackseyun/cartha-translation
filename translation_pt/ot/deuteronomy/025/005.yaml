base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: pt
  text: Se irmãos morarem juntos e um deles morrer sem ter filho[a], a mulher do falecido não se casará com um homem de fora da família[b]. O irmão do falecido irá até ela[c], a tomará por mulher e cumprirá para com ela o dever de irmão do falecido[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz especificamente “filho”; algumas interpretações entendem a condição de modo mais amplo, como “sem descendente”.
    reason: lexical_alternative
  - marker: b
    text: Lit. “não pertencerá, do lado de fora, a um homem estranho”; isto é, ela não deveria casar-se com alguém de fora do círculo familiar sujeito a essa obrigação.
    reason: lexical_alternative
  - marker: c
    text: Lit. “virá sobre ela”, expressão idiomática hebraica para a união sexual.
    reason: lexical_alternative
  - marker: d
    text: O verbo hebraico é próprio do dever do irmão do falecido para com a viúva, instituição tradicionalmente chamada casamento levirático ou levirato.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: irmãos morarem juntos
  rationale: Mantém o sentido comum de irmãos do sexo masculino e a condição de convivência expressa pelo advérbio, sem definir além do texto o tipo exato de residência comum.
- source_word: וּבֵן אֵין לוֹ
  choice: sem ter filho
  rationale: Preserva o substantivo hebraico específico בֵּן, 'filho', em vez de ampliá-lo no texto principal para 'filho ou filha' ou 'descendente'.
- source_word: אֵשֶׁת הַמֵּת
  choice: a mulher do falecido
  rationale: Reproduz de modo natural a construção hebraica; 'viúva' seria correto por implicação, mas não corresponde à forma lexical empregada.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: fora da família com um homem de fora
  rationale: O primeiro 'fora' explicita o contraste jurídico implícito com o círculo familiar obrigado, enquanto 'homem de fora' comunica que זָר designa aqui alguém alheio a essa obrigação, não necessariamente um estrangeiro étnico.
- source_word: יְבָמָהּ
  choice: o irmão do marido
  rationale: Identifica sem ambiguidade o irmão do marido falecido; 'cunhado' em português pode designar relações diferentes.
- source_word: יָבֹא עָלֶיהָ
  choice: se unirá a ela
  rationale: Expressa com dignidade e clareza o eufemismo hebraico referente à união sexual conjugal, evitando o português pouco natural de uma tradução literal.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: a tomará por mulher
  rationale: É uma formulação portuguesa natural e solene, próxima de 'tomá-la para si por mulher'.
- source_word: וְיִבְּמָהּ
  choice: cumprirá para com ela o dever de cunhado
  rationale: Comunica o verbo técnico relativo à obrigação levirática sem exigir terminologia especializada no texto principal.
theological_decisions:
- issue: Alcance da condição וּבֵן אֵין לוֹ
  choice: Manter 'sem ter filho' no texto principal.
  alternative: Traduzir 'sem ter descendente' ou 'sem ter filho ou filha'.
  rationale: O hebraico diz especificamente 'filho'. A tradução não resolve silenciosamente se a aplicação jurídica abrangia a ausência de qualquer descendente.
- issue: Terminologia do casamento levirático
  choice: Empregar relações familiares e linguagem de dever compreensíveis no texto principal.
  alternative: Usar 'levir', 'levirato' ou 'casamento levirático' no texto principal.
  rationale: A formulação comum preserva a força jurídica e torna o versículo acessível; o termo técnico é fornecido em nota cultural.
- issue: Sentido de זָר
  choice: Entender 'homem de fora' como alheio à obrigação familiar.
  alternative: Traduzir como 'estrangeiro', sugerindo origem étnica ou nacional diversa.
  rationale: Neste contexto legal, o contraste é com o irmão do falecido e com a obrigação familiar, não necessariamente com um não israelita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe preserva a forma legal do versículo sem recorrer a construções excessivamente literais. 'Homem de fora' evita que 'estrangeiro' introduza uma distinção étnica ausente do contexto, e as quatro marcas de nota aparecem no texto principal.
