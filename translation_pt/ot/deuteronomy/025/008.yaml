base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: pt
  text: 'Então os anciãos da cidade dele o chamarão e falarão com ele. Se ele persistir e disser: “Não quero tomá-la por mulher”,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “tomá-la”. Nesse contexto, a expressão significa tomá-la em casamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ
  choice: chamarão
  rationale: No procedimento legal, a forma verbal com וְ expressa a ação seguinte prescrita; o futuro em português comunica isso naturalmente sem recorrer a um registro jurídico excessivamente rígido.
- source_word: זִקְנֵי עִירוֹ
  choice: os anciãos da cidade dele
  rationale: זִקְנֵי designa os líderes cívicos reconhecidos, e עִיר pode ser cidade ou povoado. “Cidade” mantém a correspondência tradicional e “dele” deixa claro que se trata da cidade do homem.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: e falarão com ele
  rationale: דבר com אֶל indica fala dirigida a alguém. “Falarão com ele” é natural em português e sugere a interlocução própria da audiência perante os anciãos.
- source_word: וְעָמַד
  choice: Se ele persistir
  rationale: Literalmente, “e ele ficar de pé”. Neste contexto legal, a expressão indica manter-se firme na recusa depois da intervenção dos anciãos; “persistir” comunica o sentido contextual, evitando a imagem potencialmente enganosa de simplesmente se levantar.
- source_word: וְאָמַר
  choice: e disser
  rationale: O subjuntivo acompanha com naturalidade a condição introduzida por “se” e preserva a sequência da fala.
- source_word: לֹא חָפַצְתִּי
  choice: Não quero
  rationale: חפץ abrange desejar, querer ou estar disposto. “Não quero” é corrente, claro e digno, e expressa adequadamente a recusa sem intensificá-la.
- source_word: לְקַחְתָּהּ
  choice: tomá-la por mulher
  rationale: לקח com uma mulher é um idioma comum para tomá-la em casamento. “Tomá-la por mulher” preserva algo da forma hebraica e torna explícito o sentido matrimonial exigido pelo contexto.
