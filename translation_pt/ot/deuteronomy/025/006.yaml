  text: וְ/הָיָ֗ה הַ/בְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל שֵׁ֥ם אָחִ֖י/ו הַ/מֵּ֑ת וְ/לֹֽא יִמָּחֶ֥ה שְׁמ֖/וֹ מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: pt
  text: E o primogênito que ela der à luz dará continuidade ao nome do irmão falecido[a], para que o nome deste não seja apagado de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “se levantará sobre o nome do irmão falecido”; isto é, preservará o nome e a continuidade familiar dele em Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: o primogênito
  rationale: Preserva o sentido jurídico e familiar do primeiro filho homem no contexto do levirato, sem reduzir a expressão a uma simples ordem de nascimento.
- source_word: תֵּלֵד
  choice: que ela der à luz
  rationale: Mantém explícita a viúva como sujeito feminino e emprega uma formulação natural no português moderno.
- source_word: יָקוּם עַל שֵׁם
  choice: sucederá ao nome
  rationale: Comunica a continuação jurídica e familiar do nome e da linhagem do falecido. A nota preserva a forma mais literal e a ambiguidade do idioma hebraico.
- source_word: אָחִיו הַמֵּת
  choice: do irmão falecido
  rationale: Tradução clara e digna da expressão hebraica, sem ambiguidade desnecessária sobre quem morreu.
- source_word: יִמָּחֶה
  choice: seja apagado
  rationale: Reproduz adequadamente o passivo de מחה aplicado ao nome ou à memória, conservando sua força social e pactual.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: A preposição indica remoção do meio do povo ou da comunidade de Israel; esta é a formulação portuguesa mais direta.
theological_decisions:
- issue: Sentido da fórmula levirática יָקוּם עַל שֵׁם אָחִיו הַמֵּת
  choice: O primogênito dará continuidade ao nome, à linhagem e à posição do irmão falecido.
  alternative: O primogênito receberá literalmente o mesmo nome pessoal do irmão falecido.
  rationale: No contexto jurídico, a expressão trata da preservação da casa e da memória do falecido em Israel, não necessariamente da atribuição de seu nome pessoal à criança. A tradução evita decidir além do que o idioma exige, e a nota registra sua forma literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E acontecerá” conserva a estrutura normativa hebraica; “sucederá ao nome” expressa o efeito jurídico do idioma sem sugerir necessariamente a repetição do nome pessoal.
