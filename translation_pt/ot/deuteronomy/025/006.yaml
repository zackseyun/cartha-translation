revisions:
- from: E acontecerá que o primogênito que ela der à luz sucederá ao nome do irmão falecido[a], para que o nome dele não seja apagado de Israel.
  to: E o primogênito que ela der à luz dará continuidade ao nome do irmão falecido[a], para que o nome deste não seja apagado de Israel.
  rationale: 'A revisão substitui uma expressão pouco natural por uma formulação portuguesa clara que transmite a função da fórmula levirática: o primeiro filho preserva a continuidade do nome do irmão morto. A nota mantém a imagem verbal hebraica e assinala que não se trata necessariamente de o filho receber o mesmo nome pessoal do falecido.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:02:45Z'
review_pass:
  verdict: revise
  source_fidelity: O texto identifica corretamente o primogênito nascido da viúva e preserva a finalidade de impedir que o nome do falecido seja apagado de Israel. Contudo, “sucederá ao nome” não é uma construção portuguesa natural para a fórmula hebraica יָקוּם עַל־שֵׁם; uma formulação que explicite a continuidade do nome comunica melhor seu sentido jurídico-familiar sem reduzi-lo à mera atribuição de um nome pessoal.
  naturalness: “E acontecerá que” é compreensível, mas excessivamente calcado na sintaxe bíblica; “E o primogênito que ela der à luz” conserva o encadeamento solene e soa mais natural. “Dará continuidade ao nome” é claro e idiomático em português internacional.
  terminology: “Primogênito”, “irmão falecido”, “apagado” e “Israel” são apropriados. O demonstrativo “deste” evita que “o nome dele” possa ser momentaneamente associado ao primogênito, em vez de ao irmão falecido.
  issues:
  - severity: medium
    issue: “Sucedará ao nome” é pouco idiomático e semanticamente opaco em português.
    rationale: Em português, sucede-se a uma pessoa, cargo, herança ou posição; a combinação “suceder ao nome” não comunica com clareza a preservação jurídico-familiar expressa pela fórmula hebraica.
  - severity: low
    issue: O pronome “dele” no final tem antecedente potencialmente ambíguo.
    rationale: Embora o contexto favoreça o irmão falecido, “deste” retoma explicitamente o falecido e torna a finalidade legal do enunciado inequívoca.
  revised_text: E o primogênito que ela der à luz dará continuidade ao nome do irmão falecido[a], para que o nome deste não seja apagado de Israel.
  revised_footnotes:
  - marker: a
    text: Ou, mais literalmente, “se levantará sobre o nome do irmão falecido”; isto é, preservará o nome e a continuidade familiar dele em Israel.
    reason: lexical_alternative
  revision_rationale: 'A revisão substitui uma expressão pouco natural por uma formulação portuguesa clara que transmite a função da fórmula levirática: o primeiro filho preserva a continuidade do nome do irmão morto. A nota mantém a imagem verbal hebraica e assinala que não se trata necessariamente de o filho receber o mesmo nome pessoal do falecido.'
