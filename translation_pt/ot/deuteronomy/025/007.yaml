base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: pt
  text: 'Mas, se o homem não quiser tomar por esposa a viúva de seu irmão, ela irá à porta da cidade e falará aos anciãos: “Meu cunhado se recusa a perpetuar o nome de seu irmão em Israel[a]; não quer cumprir comigo o dever de cunhado[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “levantar um nome para seu irmão em Israel”. A expressão se refere a preservar a linhagem e a posição do irmão falecido.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega aqui um verbo técnico que significa cumprir a obrigação de cunhado, casando-se com a viúva do irmão falecido.
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: não quiser
  rationale: Expressa de modo natural a falta de vontade ou consentimento no contexto jurídico.
- source_word: לָקַחַת אֶת יְבִמְתּוֹ
  choice: tomar por esposa a viúva de seu irmão
  rationale: O verbo significa literalmente “tomar”, mas, neste contexto, trata-se de casamento; “por esposa” explicita o sentido, e “viúva de seu irmão” identifica com precisão a relação indicada por יְבִמְתּוֹ.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: ela irá à porta da cidade
  rationale: A porta era o local público de julgamento. “Irá” é mais natural em português do que reproduzir mecanicamente “subirá”, e “da cidade” torna explícito o referente cultural implícito.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: Designa as autoridades comunitárias reconhecidas que julgavam causas à porta da cidade.
- source_word: מֵאֵן
  choice: se recusa
  rationale: Comunica a recusa deliberada apresentada formalmente pela viúva.
- source_word: לְהָקִים לְאָחִיו שֵׁם
  choice: a perpetuar o nome de seu irmão
  rationale: 'Traduz o sentido do idioma hebraico: preservar a linhagem e a posição do irmão falecido, sem impor uma explicação extensa ao texto principal.'
- source_word: לֹא אָבָה
  choice: não quer
  rationale: Preserva a ideia de falta de disposição ou consentimento e mantém alguma distinção estilística em relação ao anterior “se recusa”.
- source_word: יַבְּמִי
  choice: cumprir para comigo o dever de cunhado
  rationale: O verbo técnico יבם indica assumir a obrigação do casamento levirato. A formulação é clara em português e conserva a linguagem relacional do hebraico.
theological_decisions:
- issue: Terminologia do casamento levirato
  choice: Usar linguagem jurídica e relacional compreensível — “viúva de seu irmão” e “dever de cunhado” — com nota explicativa.
  alternative: Empregar diretamente o termo técnico “casamento levirato” ou traduzir apenas como “cunhada”.
  rationale: O texto regula uma instituição social específica. A tradução explicita a relação sem introduzir terminologia acadêmica no corpo do versículo nem reduzir o termo a uma relação de parentesco potencialmente ambígua.
- issue: Sentido de “perpetuar o nome”
  choice: Conservar a imagem do nome, usando o verbo “perpetuar”.
  alternative: Traduzir de modo mais literal como “levantar um nome” ou explicar integralmente como “preservar a descendência”.
  rationale: “Perpetuar o nome” comunica o propósito dinástico e social do idioma hebraico, ao mesmo tempo que preserva sua imagem e sua amplitude.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Evitou-se o jargão “levirato” no texto principal. A expressão “porta da cidade” comunica o local público de julgamento, e a fala mantém o tom formal de uma queixa apresentada às autoridades.
