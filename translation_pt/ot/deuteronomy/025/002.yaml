base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/002.yaml
  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: pt
  text: então, se o culpado merecer ser açoitado, o juiz o fará deitar-se e mandará açoitá-lo diante de si, com um número de golpes proporcional à sua culpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo a sua culpa, por número”. O hebraico é conciso e indica um número contado de golpes proporcional à infração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: merecer ser açoitado
  rationale: O idiomatismo hebraico, literalmente “filho de açoites”, indica alguém sujeito ou passível de castigo corporal; esta formulação comunica naturalmente seu sentido jurídico.
- source_word: הָרָשָׁע
  choice: o culpado
  rationale: No contexto judicial, o adjetivo substantivado designa a parte declarada culpada. “O culpado” preserva o sentido jurídico sem apagar por completo a avaliação moral do termo.
- source_word: וְהִפִּילוֹ
  choice: o fará deitar-se
  rationale: O hifil de נפל expressa aqui fazer o condenado ficar deitado para receber o castigo.
- source_word: הַשֹּׁפֵט
  choice: o juiz
  rationale: Equivalente corrente e direto para a autoridade judicial mencionada.
- source_word: וְהִכָּהוּ
  choice: mandará açoitá-lo
  rationale: A forma verbal pode significar que o juiz aplica ou determina os golpes. No procedimento descrito, “mandará açoitá-lo” expressa de modo natural sua autoridade e supervisão, sem afirmar que ele próprio executa a pena.
- source_word: לְפָנָיו
  choice: diante de si
  rationale: Indica que a punição ocorre perante o juiz, sob sua supervisão; o pronome reflexivo evita atribuir o referente ao condenado.
- source_word: כְּדֵי רִשְׁעָתוֹ בְּמִסְפָּר
  choice: com um número de golpes proporcional à sua culpa
  rationale: A construção concisa exige que a quantidade contada corresponda à gravidade da culpa. A tradução explicita “golpes”, subentendido pelo contexto e confirmado pelo versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Açoitado” mantém o caráter corporal e judicial da pena; “culpado” é mais natural no contexto forense do que “perverso”. A nota preserva a forma compacta e a possível segmentação do hebraico.
