base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: pt
  text: Você deverá ter um peso[a] completo e justo; deverá ter uma efa[b] completa e justa, para que os seus dias se prolonguem na terra que Yahweh, seu Deus, lhe dá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pedra”; isto é, uma pedra usada como peso no comércio.'
    reason: Preserva o sentido literal e a imagem concreta por trás da tradução funcional “peso”.
  - marker: b
    text: A efa era uma antiga unidade de medida para produtos secos.
    reason: Explica uma unidade antiga sem impor uma conversão moderna de volume, cujo valor exato é incerto.
lexical_decisions:
- source_word: אֶבֶן
  choice: peso
  rationale: Embora signifique literalmente “pedra”, neste contexto comercial designa uma pedra usada como peso padrão. “Peso” comunica com clareza a função, enquanto a nota preserva a imagem concreta do hebraico.
- source_word: שְׁלֵמָה
  choice: completo
  rationale: O adjetivo indica inteireza, sem falta ou redução. Aplicado a pesos e medidas, “completo” preserva a ideia de um padrão não adulterado.
- source_word: וָצֶדֶק
  choice: e justo
  rationale: No comércio, o termo expressa conformidade com o que é correto e equitativo. “Justo” conserva tanto a exatidão prática quanto a dimensão moral.
- source_word: יִהְיֶה לָּךְ
  choice: você deverá ter
  rationale: A expressão significa literalmente “haverá para você”, mas neste contexto legal estabelece uma obrigação. “Deverá ter” transmite essa força normativa em português natural.
- source_word: אֵיפָה
  choice: efa
  rationale: Trata-se de uma unidade antiga específica para produtos secos, sem equivalente moderno exato. A transliteração preserva a referência histórica, explicada em nota.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade ou o resultado ligado à obediência, relação expressa naturalmente por “para que”.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: os seus dias se prolonguem
  rationale: Preserva a imagem hebraica de dias alongados, sem reduzir a expressão simplesmente a “viva muito”.
- source_word: עַל הָאֲדָמָה
  choice: sobre a terra
  rationale: Mantém de perto a preposição e, no contexto de Deuteronômio, refere-se à terra concedida a Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נֹתֵן לָךְ
  choice: está dando a você
  rationale: O particípio apresenta a dádiva da terra como ação em curso ou iminente. A forma progressiva conserva esse aspecto no discurso da aliança.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem o substituir por um título.
- issue: Relação entre a conduta comercial justa e a longevidade na terra
  choice: 'manter a oração final como finalidade ou resultado: “para que os seus dias se prolonguem”'
  alternative: formular como garantia automática de vida longa
  rationale: לְמַעַן permite uma relação de finalidade ou resultado no quadro da bênção da aliança. A tradução conserva essa relação sem transformá-la numa promessa individual mecânica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “deverá ter” reproduz a estrutura enfática das duas exigências hebraicas. Mantiveram-se “completo e justo” para conservar tanto a integridade material dos padrões quanto sua dimensão ética.
