  text: כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֣שֵׂה אֵ֑לֶּה כֹּ֖ל עֹ֥שֵׂה עָֽוֶל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: pt
  text: Pois todo aquele que faz essas coisas — todo aquele que pratica injustiça[a] — é uma abominação para Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pratica o mal” ou “age injustamente”. O hebraico עָוֶל pode indicar mal, injustiça ou perversidade; aqui se refere especialmente à desonestidade nas relações comerciais.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da proibição anterior e preserva de modo natural a força explicativa da conjunção.
- source_word: תוֹעֲבַת
  choice: uma abominação para
  rationale: Mantém a forma nominal e a forte carga moral e pactual do termo hebraico, em português claro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz naturalmente o substantivo com o sufixo masculino singular, dentro da fórmula pactual.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: todo aquele que faz essas coisas
  rationale: Expressa a classe geral indicada pelo particípio e preserva a força distributiva de כָּל.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: todo aquele que pratica injustiça
  rationale: Conserva a repetição da construção hebraica, enquanto 'pratica injustiça' comunica com naturalidade o sentido ético e social de עָוֶל no contexto de pesos e medidas desonestos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o nome pactual; a transliteração preserva o nome próprio em vez de substituí-lo por um título.
- issue: Alcance de עָוֶל
  choice: injustiça
  alternative: maldade
  rationale: O termo pode designar erro, perversidade ou injustiça; no contexto imediato de fraude comercial, 'injustiça' preserva melhor sua dimensão moral e social sem restringi-lo apenas ao ato técnico de enganar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os travessões apresentam a segunda expressão como explicação enfática da primeira e preservam a repetição do hebraico sem tornar a frase artificial.
