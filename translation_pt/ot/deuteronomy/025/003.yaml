  terminology: “Golpes”, “surra excessiva” e “seu irmão” são escolhas defensáveis. “Surra excessiva” comunica adequadamente o valor coletivo de מַכָּה רַבָּה; a nota mantém corretamente a ausência de especificação do instrumento.
