base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: pt
  text: Poderá aplicar-lhe até quarenta golpes[a], mas não mais, para que não venha a aplicar-lhe, além desses, uma surra excessiva, e seu irmão seja humilhado diante de seus olhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quarenta açoites”. O hebraico determina o número quarenta, mas aqui não especifica o instrumento nem a forma exata de cada golpe.'
    reason: lexical_alternative
  - marker: b
    text: “Seu irmão” refere-se aqui a outro membro da comunidade da aliança. Mesmo depois de punido, ele não deveria ser tratado como desprezível.
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: Poderá dar-lhe até quarenta golpes
  rationale: O numeral fixa o limite máximo da punição corporal. A formulação explicita naturalmente em português a força permissiva e limitadora do contexto jurídico, sem especificar um instrumento que o hebraico não menciona.
- source_word: לֹא יֹסִיף
  choice: mas não mais
  rationale: Expressa de modo conciso a proibição de acrescentar golpes ao limite estabelecido.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: para que não continue a golpeá-lo
  rationale: Preserva a advertência introduzida por פֶּן e o sentido de continuação ou acréscimo expresso por יסף com o infinitivo.
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: além disso com uma surra excessiva
  rationale: Mantém a construção singular e coletiva מַכָּה רַבָּה, que pode designar uma surra grande ou excessiva, evitando transformar inequivocamente a expressão em muitos golpes adicionais.
- source_word: וְנִקְלָה
  choice: seja humilhado
  rationale: Comunica a ideia de ser rebaixado, desonrado ou tornado desprezível, em português corrente e digno.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Conserva o termo familiar literal e sua força ética no contexto da comunidade da aliança.
- source_word: לְעֵינֶיךָ
  choice: diante dos seus olhos
  rationale: Reproduz a imagem hebraica e ressalta que a humilhação ocorreria abertamente à vista da comunidade.
theological_decisions:
- issue: Termo de parentesco da comunidade da aliança
  choice: seu irmão
  alternative: seu compatriota israelita; seu próximo
  rationale: A forma literal preserva a condição continuada do condenado como membro da comunidade e a razão ética para limitar a punição.
- issue: Natureza do excesso em מַכָּה רַבָּה
  choice: uma surra excessiva
  alternative: muitos golpes a mais; uma grande surra
  rationale: O hebraico singular admite uma descrição coletiva da punição excessiva. A tradução conserva essa amplitude sem decidir que a expressão se refere necessariamente apenas à contagem de golpes adicionais.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Golpes” evita introduzir o instrumento não declarado no hebraico; “surra excessiva” preserva a construção coletiva e a ambiguidade de מַכָּה רַבָּה.
