base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: pt
  text: como ele encontrou você no caminho e atacou todos os retardatários que ficavam atrás de você, quando você estava cansado e exausto; e ele não temeu a Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: encontrou você
  rationale: O verbo קרה aqui expressa o encontro de Amaleque com Israel no caminho; a formulação mantém a referência direta ao destinatário coletivo.
- source_word: וַיְזַנֵּב
  choice: atacou ... os que ... ficavam para trás
  rationale: O verbo deriva de 'cauda/retaguarda' e descreve uma agressão dirigida à parte traseira da coluna, especialmente aos retardatários; 'atacou' evita acrescentar que todos foram mortos.
- source_word: הַנֶּחֱשָׁלִים
  choice: os que, exaustos, ficavam para trás
  rationale: A forma rara designa os debilitados ou retardatários na retaguarda. A tradução explicita de modo natural tanto sua condição quanto sua posição, em consonância com o contexto.
- source_word: עָיֵף וְיָגֵעַ
  choice: cansado e abatido
  rationale: Preserva o par hebraico de exaustão e desgaste em português corrente e digno.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: ele não temeu a Deus
  rationale: Mantém a construção simples e a ambiguidade textual do pronome implícito, cujo referente mais natural no contexto é Amaleque.
theological_decisions:
- issue: Referente de 'não temeu a Deus'
  choice: ele não temeu a Deus
  alternative: você não temia a Deus
  rationale: Embora o hebraico permita formalmente relacionar a oração ao destinatário coletivo precedente, o fluxo da acusação e a tradição sintática predominante entendem Amaleque como sujeito. A tradução conserva o pronome sem inserir o nome, evitando sobre-explicação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O singular 'você' representa Israel como destinatário coletivo, seguindo a forma hebraica; a redação evita regionalismos marcados e não amplia 'atacou' para 'matou'.
