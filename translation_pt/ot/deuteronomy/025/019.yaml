base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: pt
  text: Quando Yahweh, seu Deus, lhe der descanso de todos os inimigos ao seu redor, na terra que Yahweh, seu Deus, lhe dá como herança para que você tome posse dela, apague a memória de Amaleque de debaixo do céu.[a] Não se esqueça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a lembrança de Amaleque”.'
    reason: Alternativa lexical para זֵכֶר, que pode designar memória ou lembrança.
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: Quando ... lhe der descanso
  rationale: A construção introduz uma circunstância futura que antecede a ordem. “Quando” expressa naturalmente o valor temporal, e “der descanso” preserva o sentido causativo de נוח.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: de todos os inimigos ao seu redor
  rationale: Preserva tanto a totalidade indicada por כָּל como a ideia espacial de inimigos circundantes.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: lhe dá como herança
  rationale: O presente “dá” pode exprimir a ação divina em curso ou certa no horizonte do discurso; “herança” mantém o valor pactual de נַחֲלָה.
- source_word: לְרִשְׁתָּהּ
  choice: para que você tome posse dela
  rationale: Explicita de modo natural o sufixo feminino, cujo referente é a terra, e traduz ירשׁ no sentido de tomar posse.
- source_word: תִּמְחֶה
  choice: apague
  rationale: O verbo מחה significa apagar, eliminar ou fazer desaparecer; “apague” conserva a imagem sem acrescentar o modo pelo qual a ordem seria executada.
- source_word: זֵכֶר עֲמָלֵק
  choice: a memória de Amaleque
  rationale: זֵכֶר designa memória, lembrança ou aquilo que mantém alguém recordado. “Memória” é corrente em português e preserva a amplitude da expressão.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de debaixo do céu
  rationale: Mantém a imagem e o alcance da expressão hebraica, sem reduzi-la simplesmente a “da terra”.
- source_word: לֹא תִּשְׁכָּח
  choice: Não se esqueça
  rationale: Transmite de forma direta e natural a proibição enfática que encerra o versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Alcance de זֵכֶר עֲמָלֵק
  choice: a memória de Amaleque
  alternative: a lembrança de Amaleque
  rationale: A formulação mantém a ambiguidade entre a recordação de Amaleque e aquilo que perpetua seu nome, sem restringir a expressão a uma interpretação doutrinária específica.
translation_notes:
  register: Português atual, digno e de leitura natural no Brasil, com formas de tratamento coerentes no padrão “você/lhe/seu”. A repetição de “Yahweh, seu Deus” e a imagem “de debaixo do céu” foram preservadas por sua relevância estrutural e retórica.
