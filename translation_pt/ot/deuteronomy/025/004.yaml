translation:
  language: pt
  text: Não amordace o boi enquanto ele debulha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando pisa os grãos para debulhá-los”. Em hebraico, mais literalmente: “em seu debulhar”.'
