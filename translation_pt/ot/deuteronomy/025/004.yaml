lexical_decisions:
- source_word: לֹא תַחְסֹם
  choice: Não amordace
  rationale: A combinação expressa uma proibição direta. Em português, o imperativo negativo comunica naturalmente a força legal do hebraico; “amordaçar” indica impedir que o animal coma ao fechar ou restringir-lhe a boca.
- source_word: שׁוֹר
  choice: o boi
  rationale: No contexto agrícola, שׁוֹר designa o bovino empregado no trabalho; “boi” é a forma corrente e adequada em português.
- source_word: בְּדִישׁוֹ
  choice: enquanto ele debulha
  rationale: A construção com בְּ e o sufixo masculino singular significa literalmente “em seu debulhar”. A formulação temporal é natural em português e preserva o sentido sem especificar além do hebraico o método usado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação direta de proibição. O pronome “ele” explicita de modo natural que o sujeito de “debulha” é o boi, conforme o sufixo masculino singular hebraico.
