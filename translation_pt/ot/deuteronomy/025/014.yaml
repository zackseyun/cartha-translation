base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/014.yaml
  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: pt
  text: Não tenha em sua casa uma efa e outra efa[a], uma grande e outra pequena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A efa era uma antiga unidade hebraica de medida para produtos secos.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Não tenha
  rationale: A construção hebraica, literalmente «não haverá para você», funciona aqui como proibição de possuir. «Não tenha» é natural em português e preserva a força legal.
- source_word: בְּבֵיתְךָ
  choice: em sua casa
  rationale: בַּיִת significa literalmente «casa»; neste contexto, refere-se ao lugar onde as medidas eram guardadas.
- source_word: אֵיפָה וְאֵיפָה
  choice: uma efa e outra efa
  rationale: Mantém o nome da medida antiga e torna natural em português a repetição distributiva hebraica, que indica duas medidas diferentes.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: uma grande e outra pequena
  rationale: Preserva o contraste conciso entre medidas desiguais, com concordância feminina com «efa».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação proibitiva direta. Conserva-se «efa» para preservar a unidade cultural específica, explicada em nota; «uma... outra» comunica com naturalidade a duplicidade deliberada das medidas.
