  text: you shall cut off her hand[b][a]; your eye shall not pity.
translation:
  language: pt
  text: você cortará a mão dela[a]; seu olho não terá piedade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palma da mão dela”. A palavra hebraica pode designar especificamente a palma ou, por extensão, a mão.
    reason: lexical_alternative
  - marker: b
    text: Ou “não a poupará”. A expressão hebraica menciona literalmente o olho para indicar que não se deve ceder à piedade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: você cortará
  rationale: O verbo קצץ ordena cortar ou decep ar. O futuro com valor imperativo é natural na formulação jurídica em português e mantém a concretude da pena.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: O marcador hebraico de objeto direto definido não tem equivalente explícito necessário em português.
- source_word: כַּפָּהּ
  choice: a mão dela
  rationale: כַּף pode designar a palma ou, por extensão, a mão. Neste contexto, “mão” é a formulação portuguesa mais natural, sem eliminar a alternativa lexical indicada em nota.
- source_word: לֹא
  choice: não
  rationale: Negação direta.
- source_word: תָחוֹס
  choice: terá compaixão
  rationale: חוס pode significar ter compaixão, poupar ou ter dó. “Ter compaixão” preserva o sentido sem transformar a expressão em uma ordem genérica de não mostrar misericórdia.
- source_word: עֵינֶךָ
  choice: o seu olho
  rationale: Mantém a imagem concreta do idioma hebraico e sua fórmula jurídica característica, em vez de reduzi-la simplesmente a “você”.
theological_decisions:
- issue: Literalidade da fórmula penal
  choice: Manter tanto a ordem concreta de cortar a mão quanto a expressão “o seu olho não terá compaixão”.
  alternative: Verter dinamicamente como “corte a mão dela e não tenha pena”.
  rationale: A redação concreta e severa pertence à forma jurídica do texto hebraico. Preservá-la evita suavizar a pena ou resolver a imagem idiomática por interpretação.
translation_notes:
  register: Português moderno, claro e digno, com futuro de valor imperativo próprio de linguagem legal. A construção “a mão dela” evita a ambiguidade possessiva de “sua mão”, e a imagem hebraica do olho é conservada.
