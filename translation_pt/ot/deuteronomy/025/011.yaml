base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: pt
  text: Se dois homens estiverem brigando entre si, um homem e seu irmão[a], e a mulher de um deles se aproximar para livrar seu marido da mão de quem o agride[b], e ela estender a mão e agarrar os órgãos genitais dele[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “irmão” pode significar um compatriota ou semelhante, não necessariamente um irmão biológico.
    reason: cultural_note
  - marker: b
    text: 'Hebraico: “da mão daquele que o fere”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico emprega uma expressão eufemística para as partes íntimas masculinas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִנָּצוּ
  choice: Se ... estiverem brigando
  rationale: A construção introduz um caso jurídico hipotético; “se” expressa bem essa força condicional, e “estiverem brigando” indica confronto físico em curso.
- source_word: אֲנָשִׁים יַחְדָּו
  choice: dois homens ... entre si
  rationale: O substantivo designa homens neste contexto, e “entre si” comunica naturalmente que eles lutam um contra o outro. O número dois fica claro pela continuação do caso.
- source_word: אִישׁ וְאָחִיו
  choice: um homem e seu irmão
  rationale: Preserva a formulação concreta do hebraico e sua possível dimensão social pactual, sem restringir necessariamente “irmão” ao parentesco biológico.
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: e a mulher de um deles se aproximar
  rationale: “De um deles” explicita de modo natural em português que ela é esposa de um dos dois homens, sem alterar o referente.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: para livrar seu marido
  rationale: No contexto de perigo físico imediato, “livrar” traduz adequadamente a ação de resgatar; אִישָׁהּ refere-se claramente ao marido.
- source_word: מִיַּד מַכֵּהוּ
  choice: das mãos de quem o agride
  rationale: Mantém a imagem hebraica da “mão” e verte o particípio de modo atual e claro, sem especificar além do texto a intensidade dos golpes.
- source_word: וְשָׁלְחָה יָדָהּ
  choice: e ela estender a mão
  rationale: Reproduz de modo idiomático e próximo a expressão hebraica para projetar ou estender a mão.
- source_word: וְהֶחֱזִיקָה בִּמְבֻשָׁיו
  choice: e agarrar os órgãos genitais dele
  rationale: “Agarrar” comunica a tomada firme expressa pelo verbo; “órgãos genitais” torna compreensível o eufemismo hebraico sem vulgaridade.
