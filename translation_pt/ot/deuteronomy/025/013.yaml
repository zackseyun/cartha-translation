  yaml_path: translation/ot/deuteronomy/025/013.yaml
  text: You shall not have in your bag differing weights[a], a large and a small.
translation:
  language: pt
  text: Não tenha na sua bolsa dois pesos diferentes[a], um maior e outro menor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma pedra e uma pedra”, referindo-se a pedras usadas como pesos nas transações comerciais.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Não tenha
  rationale: A construção significa literalmente que não deve haver para a pessoa; em português, a proibição direta com “não tenha” é natural e preserva a força legal.
- source_word: בְּכִיסְךָ
  choice: na sua bolsa
  rationale: כִּיס designa uma bolsa ou pequeno saco que, neste contexto comercial, continha pesos; “bolsa” é claro e corrente.
- source_word: אֶבֶן וָאָבֶן
  choice: dois pesos diferentes
  rationale: Literalmente, “uma pedra e uma pedra”; trata-se de pedras usadas como pesos comerciais. A formulação explicita o referente e preserva a ideia de um par desigual.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: um maior e outro menor
  rationale: Os adjetivos femininos qualificam as pedras implícitas. Em português, “um maior e outro menor” concorda com “pesos” e expressa naturalmente o contraste.
