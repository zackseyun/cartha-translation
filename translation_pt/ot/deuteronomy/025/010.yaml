  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: pt
  text: E em Israel ele será chamado de “Casa daquele de quem foi tirada a sandália”.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִקְרָא
  choice: será chamado
  rationale: O nifal de קרא expressa aqui uma designação pública; a forma futura preserva o tom jurídico da fórmula.
- source_word: שְׁמוֹ
  choice: ele
  rationale: Embora literalmente seja “seu nome”, em português a construção idiomática “ele será chamado de” comunica naturalmente a mesma ideia de designação pública sem alterar o referente.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: A preposição ב indica o âmbito social em que o nome será usado; “em Israel” é claro e direto.
- source_word: בֵּית
  choice: Casa
  rationale: בֵּית designa a casa ou linhagem familiar e integra o título público de desonra; “Casa” preserva a forma nominal concisa.
- source_word: חֲלוּץ הַנָּעַל
  choice: da Sandália Tirada
  rationale: A expressão hebraica é terse e literalmente associa a casa à sandália removida. Esta formulação preserva a compressão do título ritual, deixando a versão explicativa na nota.
