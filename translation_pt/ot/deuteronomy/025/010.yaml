  source_fidelity: A oração principal é bem representada por “em Israel ele será chamado de”, que transmite a fórmula pública de designação. Contudo, “Casa da Sandália Tirada” desloca a referência do homem a uma sandália caracterizada como retirada. No hebraico, חֲלוּץ הַנָּעַל designa aquele de quem a sandália foi retirada no rito; a tradução deve explicitar essa relação para evitar ambiguidade indevida.
