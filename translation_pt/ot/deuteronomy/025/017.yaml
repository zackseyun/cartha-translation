  text: זָכ֕וֹר אֵ֛ת אֲשֶׁר עָשָׂ֥ה לְ/ךָ֖ עֲמָלֵ֑ק בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: pt
  text: Lembre-se do que Amaleque lhe fez no caminho, quando vocês saíram do Egito:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao saírem do Egito”.'
    reason: Alternativa mais próxima da forma infinitiva hebraica, embora “quando vocês saíram” seja mais natural no texto principal.
lexical_decisions:
- source_word: זָכוֹר
  choice: Lembre-se
  rationale: Imperativo qal masculino singular de זכר. A forma pronominal é a expressão natural em português e mantém a ordem dirigida a Israel no singular coletivo.
- source_word: אֵת אֲשֶׁר
  choice: do que
  rationale: O marcador de objeto seguido do relativo introduz o conteúdo da lembrança; “do que” é claro e idiomático em português.
- source_word: עָשָׂה לְךָ
  choice: fez com você
  rationale: עשה com ל e sufixo singular indica aqui uma ação dirigida contra Israel. “Fez com você” preserva a construção sem acrescentar explicitamente “contra”, cujo sentido hostil vem do contexto.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico.
- source_word: בַּדֶּרֶךְ
  choice: no caminho
  rationale: דרך com ב situa a ação durante o percurso; “no caminho” é conciso, natural e fiel.
- source_word: בְּצֵאתְכֶם
  choice: quando vocês saíram
  rationale: O infinitivo construto de יצא com ב e sufixo plural expressa circunstância temporal. A tradução conserva o plural hebraico e produz português corrente.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: A preposição מן marca a origem. Com o verbo “sair”, “do Egito” é a formulação natural em português.
theological_decisions:
- issue: Alternância entre destinatário singular e plural
  choice: “Lembre-se... com você... quando vocês saíram”
  alternative: “Lembrem-se... com vocês... quando vocês saíram”
  rationale: O hebraico alterna deliberadamente o singular זָכוֹר/לְךָ e o plural בְּצֵאתְכֶם. A tradução preserva essa mudança, tratando Israel tanto como unidade coletiva quanto como conjunto de pessoas, sem uniformizar a tensão gramatical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário simples. Emprega “você/vocês” para tornar audível a alternância hebraica entre singular coletivo e plural. O sinal de dois-pontos mantém a ligação desta ordem com a explicação que segue no versículo seguinte.
