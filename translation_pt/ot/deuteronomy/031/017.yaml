  naturalness: O português é moderno, claro e adequadamente solene. “Minha ira se acenderá”, “esconderei deles o meu rosto” e “meu Deus não está no meu meio” são formulações naturais e mantêm o registro bíblico sem arcaísmo excessivo.
  terminology: “Ira”, “abandonarei”, “rosto”, “males” e “aflições” são escolhas consistentes e semanticamente adequadas. “Devastação” ou “destruição” não deve substituir sem qualificação a imagem de ser consumido; “serão devorados” é mais fiel, enquanto a nota conserva a alternativa de vulnerabilidade.
