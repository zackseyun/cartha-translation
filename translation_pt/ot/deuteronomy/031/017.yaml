  text: וְ/חָרָ֣ה אַפִּ֣/י ב֣/וֹ בַ/יּוֹם הַ֠/הוּא וַ/עֲזַבְתִּ֞י/ם וְ/הִסְתַּרְתִּ֨י פָנַ֤/י מֵ/הֶם֙ וְ/הָיָ֣ה לֶֽ/אֱכֹ֔ל וּ/מְצָאֻ֛/הוּ רָע֥וֹת רַבּ֖וֹת וְ/צָר֑וֹת וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הֲ/לֹ֗א עַ֣ל כִּֽי אֵ֤ין אֱלֹהַ/י֙ בְּ/קִרְבִּ֔/י מְצָא֖וּ/נִי הָ/רָע֥וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: pt
  text: 'Então, naquele dia, minha ira se acenderá contra eles, e eu os abandonarei e esconderei deles o meu rosto. Eles serão devorados[a], e muitos males e aflições os alcançarão. Naquele dia, ele dirá: “Não foi porque meu Deus não está no meu meio[b] que estes males me alcançaram?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ele/isso será para comer”. A expressão hebraica é condensada e pode indicar que o povo será devorado ou ficará vulnerável à destruição.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “no meu meio”. O singular personifica Israel como um só povo que fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: minha ira se acenderá
  rationale: Preserva a metáfora hebraica do ardor da ira em uma formulação natural e digna em português.
- source_word: בּוֹ
  choice: contra eles
  rationale: A forma hebraica é singular, mas seu referente é Israel como coletividade; o plural é mais natural na narração portuguesa.
- source_word: וַעֲזַבְתִּים
  choice: eu os abandonarei
  rationale: Expressa com clareza a retirada pactual indicada pelo verbo, sem acrescentar a ideia de rejeição definitiva.
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: esconderei deles o meu rosto
  rationale: Mantém a imagem hebraica significativa, em vez de explicá-la como simples ausência ou desfavor.
- source_word: וְהָיָה לֶאֱכֹל
  choice: eles ficarão expostos à destruição
  rationale: A expressão comprimida, literalmente algo como 'será para comer', apresenta Israel como vulnerável a ser consumido; a tradução conserva essa ideia sem identificar um agente ausente no texto.
- source_word: וּמְצָאֻהוּ / מְצָאוּנִי
  choice: os alcançarão / me alcançaram
  rationale: O verbo significa literalmente 'encontrar', mas, com males como sujeito, 'alcançar' comunica de modo natural sua chegada inevitável e mantém a repetição entre as duas ocorrências.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: muitos males e aflições
  rationale: 'Mantém distintos os dois termos hebraicos: רָעוֹת como males ou calamidades e צָרוֹת como aflições ou angústias.'
- source_word: וְאָמַר
  choice: ele dirá
  rationale: Retém o singular hebraico que personifica Israel como um só povo.
- source_word: הֲלֹא עַל כִּי
  choice: Não foi porque
  rationale: Reproduz de maneira natural a pergunta retórica causal no contexto de males já sofridos.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: meu Deus não está no meu meio
  rationale: Preserva tanto a expressão espacial 'no meu meio' quanto a primeira pessoa singular da personificação coletiva.
theological_decisions:
- issue: Singular coletivo e plural na referência a Israel
  choice: Usar o plural nas ações dirigidas à coletividade, mas conservar o singular na fala em que Israel é personificado.
  alternative: Empregar singular em todo o versículo ou pluralizar também a fala citada.
  rationale: Essa solução produz português natural na narração sem apagar a personificação singular retoricamente marcante do hebraico.
- issue: Sentido do esconder do rosto divino
  choice: Conservar a imagem 'esconderei deles o meu rosto'.
  alternative: Traduzir como 'me afastarei deles' ou 'retirarei minha presença'.
  rationale: A imagem comunica juízo e retirada relacional sem reduzir sua tensão teológica a uma explicação específica.
- issue: Reconhecimento de Israel sobre a ausência de Deus
  choice: Manter a declaração como pergunta retórica da personagem coletiva.
  alternative: Transformá-la em afirmação explícita de arrependimento ou confissão.
  rationale: O texto registra o reconhecimento causal, mas não explicita se ele constitui arrependimento genuíno; a tradução não deve resolver essa ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para fluidez. As imagens centrais do hebraico e a alternância entre Israel como coletividade plural e personagem singular foram preservadas.
