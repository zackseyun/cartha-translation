  to: 'Então, naquele dia, minha ira se acenderá contra eles, e eu os abandonarei e esconderei deles o meu rosto. Eles serão devorados[a], e muitos males e aflições os alcançarão. Naquele dia, ele dirá: “Não foi porque meu Deus não está no meu meio[b] que estes males me alcançaram?”'
  rationale: A revisão limita-se a substituir a formulação atenuada “ficarão expostos à destruição” por “serão devorados”, que representa mais diretamente a imagem hebraica de ser dado ao consumo. A nota mantém explicitamente a alternativa interpretativa, sem resolver além do necessário a compressão sintática do hebraico. As demais escolhas preservam tanto a fidelidade ao texto-fonte quanto a legibilidade em português internacional.
