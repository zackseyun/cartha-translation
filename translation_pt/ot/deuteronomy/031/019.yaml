base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: pt
  text: E agora, escrevam para vocês este cântico e ensine-o aos filhos de Israel[a]. Ponha-o em suas bocas, para que este cântico seja para mim uma testemunha contra os filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” (também no fim deste versículo). O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “entre os filhos de Israel”. A preposição hebraica pode ter o sentido mais literal de “em/entre”, mas, neste contexto, o cântico provavelmente atua como testemunha contra eles.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção וְ quanto o valor temporal e transitivo de עַתָּה.
- source_word: כִּתְבוּ לָכֶם
  choice: escrevam para vocês
  rationale: Mantém o imperativo plural e o dativo/reflexivo לָכֶם sem acrescentar uma ideia ausente no hebraico.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: este cântico
  rationale: שִׁירָה designa diretamente um cântico; a escolha também preserva o caráter poético e recitável do texto seguinte.
- source_word: וְלַמְּדָהּ
  choice: e ensine-o
  rationale: O imperativo é singular, em contraste com o plural anterior; a tradução conserva essa mudança de número. O pronome retoma 'cântico'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica e sua linguagem de identidade coletiva; uma formulação idiomática é indicada em nota.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: Ponha-o na boca deles
  rationale: Conserva o imperativo singular e a imagem concreta hebraica de fazer o povo aprender e recitar o cântico, sem explicitar além do texto.
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa naturalmente a finalidade da ordem.
- source_word: תִּהְיֶה לִּי ... לְעֵד
  choice: seja para mim testemunha
  rationale: Mantém a relação expressa por לִי e traduz עֵד diretamente como 'testemunha'.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: contra os filhos de Israel
  rationale: No contexto judicial e pactual, בְּ pode indicar a parte contra a qual se dá o testemunho; a leitura espacial mais literal permanece em nota.
theological_decisions:
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A forma hebraica é preservada no texto, sem sugerir que a referência coletiva exclua as mulheres; a nota esclarece o sentido idiomático.
- issue: Sentido de בִּבְנֵי יִשְׂרָאֵל na cláusula da testemunha
  choice: contra os filhos de Israel
  alternative: entre os filhos de Israel
  rationale: O contexto de advertência e acusação favorece o sentido adversativo, mas a preposição hebraica permite uma leitura espacial, registrada em nota.
- issue: Mudança de número nos imperativos
  choice: plural em 'escrevam' e singular em 'ensine' e 'ponha'
  alternative: uniformizar todos os imperativos no plural ou no singular
  rationale: O hebraico apresenta uma mudança real de plural para singular. A tradução a conserva, sem decidir silenciosamente como se distribuem as ordens entre Moisés e Josué.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a alternância incomum entre o imperativo plural e os imperativos singulares, bem como a imagem concreta de pôr o cântico na boca do povo.
