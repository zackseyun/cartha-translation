  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: pt
  text: 'Moisés ordenou aos levitas que carregavam a arca da aliança de Yahweh[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos levitas, portadores da arca da aliança de Yahweh”. O particípio hebraico também pode ser traduzido de maneira mais formal, como uma descrição semelhante a um título.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה indica dar uma ordem ou incumbência; “ordenou” é direto, natural e adequado ao contexto.
- source_word: הַלְוִיִּם
  choice: aos levitas
  rationale: Forma portuguesa consagrada para a designação tribal no plural com artigo, ajustada à regência de “ordenou”.
- source_word: נֹשְׂאֵי
  choice: que carregavam
  rationale: O particípio de נשׂא caracteriza os levitas por sua função em relação à arca. A oração relativa é clara e natural, sem eliminar a possibilidade de leitura mais titular.
- source_word: אֲרוֹן
  choice: arca
  rationale: No contexto cultual e da aliança, “arca” é a designação tradicional e semanticamente apropriada, em vez do genérico “caixa” ou “baú”.
- source_word: בְּרִית
  choice: da aliança
  rationale: A relação construta com אֲרוֹן forma a expressão “arca da aliança”, preservando seu significado pactual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz de modo transparente a fórmula hebraica que introduz o discurso direto do versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal, enquanto “SENHOR” representa a tradição de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a fórmula introdutória “dizendo” e preserva em nota a nuance titular possível do particípio hebraico.
