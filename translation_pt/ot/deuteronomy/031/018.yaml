  text: וְ/אָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא עַ֥ל כָּל הָ/רָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל אֱלֹהִ֖ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: pt
  text: E eu mesmo certamente esconderei o meu rosto[a] naquele dia, por causa de todo o mal que ele fez, pois se voltou para outros deuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a minha presença»; literalmente, o hebraico diz «o meu rosto», expressão que pode indicar a retirada do favor ou da presença divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: E eu mesmo
  rationale: O pronome independente אָנֹכִי é enfático; «eu mesmo» preserva essa ênfase, e וְ mantém a ligação com o contexto por meio de «E».
- source_word: הַסְתֵּר אַסְתִּיר
  choice: certamente esconderei
  rationale: A construção de infinitivo absoluto seguido do verbo finito intensifica a ação. «Certamente esconderei» comunica essa força de modo natural em português.
- source_word: פָּנַי
  choice: o meu rosto
  rationale: A expressão significa literalmente «meu rosto». Embora possa indicar favor ou presença, a imagem concreta é preservada no texto, sem resolver sua implicação teológica.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal direta e corrente em português, preservando o valor demonstrativo.
- source_word: עַל כָּל הָרָעָה
  choice: por causa de todo o mal
  rationale: עַל tem aqui sentido causal, e הָרָעָה se refere ao mal moral praticado.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ele fez
  rationale: O verbo hebraico está no masculino singular. O pronome «ele» conserva a personificação coletiva de Israel presente no texto-fonte.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão explicativa. «Pois» evita a repetição imediata de «por causa de» e mantém clara a relação causal.
- source_word: פָנָה אֶל
  choice: se voltou para
  rationale: A formulação expressa mudança de direção, lealdade ou devoção sem explicitar além do que o hebraico afirma.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Tradução direta da expressão que designa divindades distintas do SENHOR.
theological_decisions:
- issue: Expressão antropomórfica para o afastamento divino
  choice: Manter «esconderei o meu rosto» no texto principal
  alternative: «retirarei a minha presença» ou «deixarei de lhe mostrar favor»
  rationale: O hebraico emprega a imagem concreta do rosto escondido. Mantê-la preserva a linguagem e a tensão teológica do texto, enquanto a nota esclarece o alcance possível do idioma.
- issue: Referência singular a Israel
  choice: Usar «ele fez» e «se voltou»
  alternative: «eles fizeram» e «se voltaram»
  rationale: Os verbos hebraicos estão no singular e apresentam Israel coletivamente como uma só entidade. A tradução conserva essa forma em vez de nivelá-la para o plural.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi mantida próxima ao hebraico sem sacrificar a naturalidade; a vírgula antes de «naquele dia» foi omitida por fluidez sintática.
