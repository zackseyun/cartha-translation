base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: pt
  text: 'Pois conheço a rebeldia de vocês e a cerviz dura de vocês[a]. Vejam: enquanto ainda estou vivo com vocês hoje, vocês têm sido rebeldes contra Yahweh[b]; quanto mais depois da minha morte!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a cerviz dura de vocês”, imagem que indica teimosia ou obstinação.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se poderia traduzir literalmente: “com Yahweh”; neste contexto, porém, a expressão indica oposição, daí “contra Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: a rebeldia de vocês
  rationale: Preserva o substantivo hebraico e expressa de modo natural a resistência deliberada do povo.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: a sua dura cerviz
  rationale: Mantém a metáfora corporal hebraica, tradicionalmente compreensível em registro bíblico digno; a nota esclarece seu sentido idiomático.
- source_word: הֵן
  choice: Vejam
  rationale: Reproduz a partícula que chama a atenção, em linguagem atual e adequada ao destinatário coletivo.
- source_word: בְּעוֹדֶנִּי חַי
  choice: enquanto ainda estou vivo
  rationale: Expressa diretamente a continuidade temporal indicada pela construção hebraica.
- source_word: מַמְרִים הֱיִתֶם
  choice: vocês têm sido rebeldes
  rationale: O particípio com היה descreve comportamento persistente; o pretérito perfeito composto comunica essa continuidade até o presente da fala.
- source_word: עִם יְהוָה
  choice: contra Yahweh
  rationale: Embora עִם costume significar 'com', junto ao verbo de rebelião indica oposição; 'contra' torna essa relação clara em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְאַף כִּי
  choice: quanto mais
  rationale: 'Conserva a inferência intensificada: se o povo se rebela durante a vida de Moisés, a expectativa é ainda maior depois da morte dele.'
- source_word: אַחֲרֵי מוֹתִי
  choice: depois da minha morte
  rationale: Tradução direta e natural da locução temporal nominal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome próprio divino; 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Valor de עִם junto à ideia de rebelião
  choice: contra Yahweh
  alternative: com Yahweh
  rationale: O contexto exige oposição, mas a nota registra a forma mais comum da preposição e preserva a transparência quanto à decisão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com formas brasileiras naturais. O plural 'vocês' explicita que os sufixos hebraicos no singular se dirigem coletivamente a Israel. A metáfora 'dura cerviz' foi preservada por transparência ao original e explicada em nota.
