  yaml_path: translation/ot/deuteronomy/031/030.yaml
  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: pt
  text: Então Moisés falou, aos ouvidos de toda a assembleia de Israel, as palavras deste cântico, até que fossem concluídas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até que ele terminasse de pronunciá-las” — isto é, até Moisés concluir a recitação das palavras do cântico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então Moisés falou
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “falou” traduz o sentido simples de דבר neste contexto.
- source_word: בְּאָזְנֵי
  choice: diante de
  rationale: A expressão significa literalmente “aos ouvidos de” e indica fala pública dirigida a uma audiência. “Diante de” comunica isso em português natural sem reproduzir um hebraísmo pouco idiomático.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: toda a assembleia de Israel
  rationale: קהל designa a comunidade reunida. “Assembleia” preserva o sentido coletivo sem coloração eclesiástica indevida, e “toda” representa כָּל.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: as palavras deste cântico
  rationale: Mantém o substantivo explícito “palavras” e traduz שירה por “cântico”, termo corrente e digno para uma composição poética destinada à recitação ou ao canto.
- source_word: עַד תֻּמָּם
  choice: até que chegassem ao fim
  rationale: A forma com sufixo masculino plural remete mais naturalmente às “palavras”. A formulação portuguesa conserva essa referência plural e expressa a conclusão integral da recitação sem explicitar indevidamente quem a concluiu.
