  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֥וּ וְ/אַל תַּעַרְצ֖וּ מִ/פְּנֵי/הֶ֑ם כִּ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ ה֚וּא הַ/הֹלֵ֣ךְ עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֥א יַעַזְבֶֽ/ךָּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: pt
  text: Sejam fortes e corajosos. Não tenham medo nem fiquem apavorados por causa deles[a], pois Yahweh, o Deus de vocês, é quem vai com vocês; ele não falhará com vocês[b] nem os abandonará.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A segunda expressão é mais forte que a primeira e pode significar “não fiquem aterrorizados” ou “não se deixem dominar pelo pavor diante deles”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico pode ser traduzido mais literalmente como “ele não soltará vocês” ou “não deixará vocês cair”; o sentido é que Yahweh não deixará de sustentá-los.
    reason: lexical_alternative
  - marker: c
    text: No hebraico, os mandamentos iniciais estão no plural, mas, a partir de “seu Deus”, Israel é tratado coletivamente no singular. A tradução mantém o plural para maior clareza em português.
    reason: grammatical_number
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Sejam fortes e corajosos
  rationale: Os dois imperativos plurais formam uma exortação idiomática recorrente. A formulação preserva ambos os elementos e soa natural e digna em português moderno.
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: Não tenham medo nem fiquem apavorados
  rationale: 'A segunda expressão intensifica a primeira: ערץ comunica pavor ou terror, não apenas medo comum.'
- source_word: מִפְּנֵיהֶם
  choice: por causa deles
  rationale: A expressão significa literalmente algo como “diante da presença deles”, mas, neste contexto, indica a causa do medo. “Por causa deles” comunica isso com naturalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: é quem vai com vocês
  rationale: 'O pronome seguido do particípio é enfático: Yahweh é aquele que acompanha o povo. “É quem vai” preserva essa ênfase.'
- source_word: לֹא יַרְפְּךָ
  choice: ele não falhará com vocês
  rationale: No hifil, רפה pode descrever soltar, deixar cair ou deixar sem sustentação. “Não falhará com vocês” expressa a garantia de apoio sem se confundir com o verbo seguinte.
- source_word: וְלֹא יַעַזְבֶךָ
  choice: nem os abandonará
  rationale: עזב significa deixar ou abandonar. “Abandonará” mantém o tom solene e distingue esta garantia da anterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio do Deus de Israel. A transliteração preserva esse nome em vez de substituí-lo pelo título tradicional.
- issue: Distinção entre יַרְפְּךָ e יַעַזְבֶךָ
  choice: não falhará com vocês nem os abandonará
  alternative: não os deixará nem os abandonará
  rationale: A tradução escolhida mantém a garantia dupla e evita reduzir os dois verbos a quase sinônimos, sem atribuir ao primeiro uma afirmação mais ampla do que o hebraico permite.
- issue: Mudança do plural para o singular no hebraico
  choice: Plural natural no texto, com nota explicativa
  alternative: 'Preservar literalmente a alternância: “seu Deus... com você... não o...”'
  rationale: Os imperativos se dirigem ao povo no plural, enquanto as formas seguintes tratam Israel coletivamente no singular. Manter o plural em português evita uma mudança confusa de destinatário, e a nota conserva a informação formal do original.
translation_notes:
  register: Português moderno, claro e solene, com formas brasileiras amplamente compreensíveis. “Apavorados” conserva a intensificação do segundo verbo sem soar arcaico. O plural “vocês” torna explícito o destinatário coletivo, enquanto a nota registra a mudança de número do hebraico.
