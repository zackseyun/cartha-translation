base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: pt
  text: Reúnam diante de mim todos os anciãos das suas tribos e os seus oficiais, para que eu lhes diga estas palavras e invoque os céus e a terra como testemunhas contra eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o céu e a terra». A expressão hebraica é uma fórmula convencional de testemunhas da aliança em Deuteronômio.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: Reúnam
  rationale: O imperativo hifil plural de קהל ordena aos destinatários que façam os líderes se reunir. “Reúnam” é natural, claro e preserva adequadamente o valor causativo no contexto.
- source_word: אֵלַי
  choice: diante de mim
  rationale: A expressão significa literalmente “a mim”, mas, numa convocação formal, “diante de mim” comunica com naturalidade que os líderes devem ser reunidos na presença de Moisés.
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: os anciãos das suas tribos
  rationale: Reproduz de modo transparente a cadeia construta, identificando os anciãos ligados às tribos dos destinatários.
- source_word: שֹׁטְרֵיכֶם
  choice: os seus oficiais
  rationale: שֹׁטְרִים designa autoridades administrativas subordinadas; “oficiais” mantém a referência ampla sem restringi-la indevidamente a escribas.
- source_word: וַאֲדַבְּרָה
  choice: para que eu diga
  rationale: O coortativo expressa a ação pretendida após a reunião. A oração final com “para que” transmite de forma natural a relação de propósito.
- source_word: בְּאָזְנֵיהֶם
  choice: na presença deles
  rationale: O hebraico diz literalmente “aos ouvidos deles”, isto é, de modo que eles ouçam. “Na presença deles” é uma formulação corrente e digna, embora torne menos explícita a imagem auditiva.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: דְּבָרִים se refere aqui ao pronunciamento de Moisés; “palavras” corresponde ao contexto imediato de fala.
- source_word: וְאָעִידָה בָּם
  choice: invoque contra eles ... como testemunhas
  rationale: 'O hifil de עוּד, com בָּם, tem força jurídico-pactual: convocar testemunhas contra alguém. A formulação explicita esse papel sem eliminar a solenidade da expressão.'
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: os céus e a terra
  rationale: O plural hebraico הַשָּׁמַיִם é bem representado por “os céus”; a expressão preserva a fórmula cósmica de testemunho característica de Deuteronômio.
theological_decisions:
- issue: Fórmula de testemunho da aliança
  choice: invoque contra eles os céus e a terra como testemunhas
  alternative: tome os céus e a terra por testemunhas contra eles
  rationale: A tradução mantém a cena jurídico-pactual em que os céus e a terra são convocados como testemunhas da responsabilidade de Israel, sem resolver além do texto a natureza dessa personificação.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira. Emprega “vocês” implicitamente nas formas possessivas “suas/seus”, evitando tanto arcaísmo quanto coloquialismo excessivo.
