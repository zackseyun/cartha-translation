  yaml_path: translation/ot/deuteronomy/031/024.yaml
  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
translation:
  language: pt
  text: Quando Moisés terminou de escrever num livro[a] as palavras desta lei até o fim,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «num rolo». O hebraico סֵפֶר pode designar um documento escrito ou rolo, não necessariamente um livro encadernado no sentido moderno.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a transição narrativa e a sequência expressas por וַיְהִי; em português bíblico digno, a fórmula é natural sem ser excessivamente arcaica.
- source_word: כְּכַלּוֹת
  choice: quando ... terminou
  rationale: A preposição כְּ com o infinitivo construto de כלה introduz uma oração temporal e destaca a conclusão da ação.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לִכְתֹּב
  choice: de escrever
  rationale: Depois de «terminou», o infinitivo preposicionado é a construção idiomática em português.
- source_word: דִּבְרֵי
  choice: as palavras de
  rationale: Neste contexto escrito e legal, «palavras» representa diretamente דְּבָרִים e ressalta o conteúdo registrado.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: desta lei
  rationale: «Lei» comunica com clareza o sentido jurídico-aliancista de תּוֹרָה em Deuteronômio; «desta» preserva o demonstrativo.
- source_word: עַל סֵפֶר
  choice: num livro
  rationale: É uma formulação portuguesa natural para o registro em um documento escrito, sem afirmar no texto principal que se tratava de um códice moderno; a nota registra a possibilidade material de um rolo.
- source_word: עַד תֻּמָּם
  choice: até completá-las
  rationale: Expressa o limite da ação até sua conclusão e preserva, pelo pronome feminino plural, a referência às «palavras», evitando a construção pouco natural «até a conclusão delas».
