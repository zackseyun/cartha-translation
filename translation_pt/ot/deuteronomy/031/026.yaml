language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: pt
  text: “Peguem este Livro da Lei[a] e coloquem-no ao lado da arca da aliança de Yahweh, o Deus de vocês. Ele ficará ali como testemunha contra vocês[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este rolo da lei”. O termo hebraico סֵפֶר pode designar um rolo ou outro documento escrito.
    reason: lexical_alternative
  - marker: b
    text: Isto é, como testemunho contra vocês caso violem a aliança.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: Peguem
  rationale: O infinitivo absoluto qal tem força imperativa neste contexto. O plural harmoniza com a continuação וְשַׂמְתֶּם e com os levitas aos quais Moisés se dirige no versículo anterior.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: este Livro da Lei
  rationale: סֵפֶר designa um documento escrito, provavelmente em forma de rolo, enquanto תּוֹרָה aqui se refere à instrução legal e pactual registrada. “Livro da Lei” é claro, digno e reconhecível; a alternativa material “rolo” é preservada em nota.
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: e coloquem-no
  rationale: שׂוּם indica pôr ou colocar concretamente. A forma imperativa dá continuidade natural à ordem inicial.
- source_word: מִצַּד
  choice: ao lado de
  rationale: A expressão indica posição junto à lateral da arca, sem afirmar que o livro foi colocado dentro dela.
- source_word: אֲרוֹן בְּרִית
  choice: arca da aliança
  rationale: Reproduz com naturalidade a relação de construção hebraica e a expressão pactual estabelecida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Expressa de modo natural o sufixo pronominal plural e mantém a fórmula pactual ligada ao nome Yahweh.
- source_word: וְהָיָה שָׁם
  choice: Ele ficará ali
  rationale: 'Comunica o estado resultante e continuado pretendido: depois de colocado, o livro permaneceria naquele lugar.'
- source_word: לְעֵד בְּךָ
  choice: como testemunha contra vocês
  rationale: עֵד conserva a imagem jurídica de uma testemunha, e בְּ tem força adversativa no contexto de sanções da aliança. O hebraico singular trata Israel coletivamente; o plural em português acompanha os destinatários explícitos e soa natural.
theological_decisions:
- issue: Função do testemunho do Livro da Lei
  choice: O livro serve como testemunha contra Israel no âmbito jurídico da aliança.
  alternative: O livro seria apenas um memorial, ou uma testemunha neutra, junto à arca.
  rationale: A construção לְעֵד בְּךָ, no contexto imediato da rebeldia prevista e das sanções da aliança, favorece o sentido acusatório. A nota explicita o contexto sem acrescentar uma doutrina externa ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Peguem” e “coloquem-no” preservam a ordem dirigida aos levitas; “vocês” evita regionalismo excessivo. A redação mantém a localização externa ao lado da arca e a força jurídica de “testemunha contra”.
