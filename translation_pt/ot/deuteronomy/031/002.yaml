  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: pt
  text: 'E disse-lhes: “Hoje tenho cento e vinte anos. Já não posso sair e entrar[a], e Yahweh me disse: ‘Você não atravessará este Jordão’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “sair e entrar”, expressão que pode se referir tanto às atividades habituais como ao exercício da liderança sobre o povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: E disse-lhes
  rationale: Preserva o fluxo narrativo do wayyiqtol e expressa naturalmente o objeto indireto em português digno e corrente.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Hoje tenho cento e vinte anos
  rationale: Traduz naturalmente o idioma hebraico de idade e mantém em destaque a referência temporal הַיּוֹם.
- source_word: לֹא אוּכַל עוֹד
  choice: Já não posso
  rationale: Comunica de modo conciso a incapacidade expressa por יכל juntamente com a ideia de continuidade cessada em עוֹד.
- source_word: לָצֵאת וְלָבוֹא
  choice: sair e entrar
  rationale: Mantém o idioma hebraico sem decidir se ele indica atividade comum, mobilidade pública ou exercício da liderança.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em conformidade com a camada teológica fornecida e sem substituí-lo por um título.
- source_word: אָמַר אֵלַי
  choice: me disse
  rationale: O perfeito hebraico indica uma declaração divina anterior ainda relevante; o pretérito perfeito é natural em português e o contexto preserva essa relevância.
- source_word: לֹא תַעֲבֹר
  choice: Você não atravessará
  rationale: O futuro em português preserva a força de declaração divina e pode também comportar valor proibitivo, sem resolver indevidamente essa tensão.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: este Jordão
  rationale: Conserva o demonstrativo hebraico e o nome geográfico sem acrescentar ‘rio’, ausente do texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. ‘Yahweh’ preserva o nome da aliança e segue a decisão teológica explícita fornecida, evitando substituí-lo por um título.
- issue: Força de לֹא תַעֲבֹר
  choice: Você não atravessará
  alternative: Você não deve atravessar; você não poderá atravessar
  rationale: A construção pode ser entendida como declaração de resultado certo ou proibição divina. O futuro português conserva melhor essa sobreposição do que uma formulação exclusivamente permissiva ou de capacidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A colocação ‘disse-lhes’ mantém tom bíblico sem arcaísmo excessivo; ‘você’ torna natural a fala direta singular. O idioma ‘sair e entrar’ foi preservado e explicado em nota para não eliminar sua ambiguidade.
