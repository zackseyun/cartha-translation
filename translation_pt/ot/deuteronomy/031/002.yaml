  source_fidelity: 'O texto traduz com precisão os elementos centrais do hebraico: a fala dirigida a eles, a idade de Moisés no dia presente, a incapacidade já vigente expressa por ‘já não posso’, o idioma ‘sair e entrar’ e a declaração de Yahweh de que ele não atravessará este Jordão. O futuro em ‘Você não atravessará’ mantém adequadamente a força declarativa, sem fixá-la apenas como proibição ou simples previsão.'
