  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: pt
  text: E os filhos deles[a], que não conheceram, ouvirão e aprenderão a temer Yahweh[b], o Deus de vocês, todos os dias em que viverem na terra para a qual estão atravessando o Jordão, a fim de tomar posse dela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes deles”. O termo hebraico pode referir-se especificamente aos filhos homens ou, de forma mais ampla, aos filhos e à geração seguinte.
    reason: lexical_alternative
  - marker: b
    text: Hebraico YHWH; tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
  - marker: c
    text: Ou “possuí-la” ou “herdá-la”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: E os filhos deles
  rationale: בנים pode designar especificamente filhos do sexo masculino ou, de modo mais amplo, os filhos e a geração descendente. A formulação portuguesa mantém a expressão natural e registra a amplitude possível em nota.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: que não conheceram
  rationale: O perfeito de ידע indica ausência de conhecimento ou experiência anterior. A tradução conserva o aspecto e não supre um objeto que o hebraico deixa implícito.
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: ouvirão e aprenderão
  rationale: 'Os verbos expressam o resultado esperado da leitura pública: primeiro ouvir, depois aprender. O futuro é natural em português e preserva a sequência hebraica.'
- source_word: לְיִרְאָה
  choice: a temer
  rationale: ירא, em Deuteronômio, abrange temor e reverência no relacionamento de aliança. “Temer” conserva o peso teológico e a tensão do termo sem suavizá-lo para “reverenciar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Representa de modo claro o sufixo de segunda pessoa do plural e evita a possível ambiguidade de “seu Deus” no português brasileiro.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: todos os dias em que viverem
  rationale: Mantém a extensão temporal explícita do hebraico em português atual e natural.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: אדמה refere-se aqui ao território em que Israel viverá; “na terra” é mais idiomático em português do que a reprodução literal “sobre a terra”.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה
  choice: para a qual estão atravessando o Jordão
  rationale: A formulação conserva tanto a travessia do Jordão quanto o sentido direcional de שָׁמָּה, que aponta para a terra como destino.
- source_word: לְרִשְׁתָּהּ
  choice: a fim de tomar posse dela
  rationale: ירשׁ pode significar possuir, tomar posse ou herdar. “Tomar posse” preserva a ideia de entrada e ocupação da terra sem excluir sua condição de herança prometida.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome da aliança, enquanto a forma tradicional substitui o nome por um título.
- issue: Amplitude de בנים na instrução da aliança
  choice: os filhos deles
  alternative: os descendentes deles / as crianças deles
  rationale: No contexto, o termo aponta para a geração seguinte em sentido amplo, embora possa designar especificamente filhos homens. A tradução mantém a forma lexical comum e a nota explicita a amplitude sem estreitar o referente.
- issue: Sentido de ירא diante de Deus
  choice: temer
  alternative: reverenciar
  rationale: “Temer” mantém a linguagem característica de Deuteronômio e não elimina a tensão entre temor, reverência e fidelidade da aliança.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. “O Deus de vocês” torna explícito o plural da fala dirigida a Israel. A sintaxe mantém a progressão ouvir–aprender–temer e preserva o objeto não expresso de “não conheceram”.
