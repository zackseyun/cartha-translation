  yaml_path: translation/ot/deuteronomy/031/010.yaml
  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: pt
  text: 'Moisés lhes ordenou, dizendo: “Ao fim de cada período de sete anos[a], no tempo determinado do ano da remissão[b], na Festa das Cabanas[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao fim de sete anos”. O contexto indica que a ordem se repete a cada ciclo de sete anos.'
    reason: lexical_alternative
  - marker: b
    text: “Ano da remissão” designa o sétimo ano, no qual se concedia remissão; tradicionalmente, “ano sabático”.
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, “Festa dos Tabernáculos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה expressa uma ordem ou incumbência; “ordenou” preserva sua força diretiva.
- source_word: אוֹתָם
  choice: lhes
  rationale: O pronome objeto masculino plural retoma, pelo contexto, os destinatários da ordem; em português, “lhes ordenou” é a construção natural.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz a fórmula hebraica que introduz discurso direto, sem alterar a estrutura da frase.
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: ao fim de cada sete anos
  rationale: מִקֵּץ significa “ao fim de”. “Cada sete anos” explicita o ciclo recorrente indicado pelo contexto legal, enquanto a nota preserva a formulação mais estrita.
- source_word: בְּמוֹעֵד
  choice: no tempo determinado
  rationale: מוֹעֵד designa um tempo ou ocasião fixada; a expressão mantém tanto a ideia temporal quanto a de determinação prévia.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: ano da remissão
  rationale: שְׁמִטָּה se refere à soltura ou remissão própria do sétimo ano. “Ano da remissão” é uma formulação concisa e estabelecida, sem reduzir o termo apenas a uma de suas aplicações.
- source_word: בְּחַג הַסֻּכּוֹת
  choice: na Festa das Cabanas
  rationale: חַג significa “festa”, e סֻכּוֹת, literalmente, “cabanas”. A tradução conserva a imagem concreta do hebraico e permanece clara em português.
