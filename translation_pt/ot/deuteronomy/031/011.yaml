  text: בְּ/ב֣וֹא כָל יִשְׂרָאֵ֗ל לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל בְּ/אָזְנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: pt
  text: quando todo o Israel vier comparecer diante de Yahweh, seu Deus,[a] no lugar que ele escolher, você lerá esta lei diante de todo o Israel, para que todos a ouçam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “ver a face de Yahweh, seu Deus”; expressão que significa comparecer à sua presença.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא כָל־יִשְׂרָאֵל
  choice: quando todo o Israel vier
  rationale: A preposição בְּ com o infinitivo construto introduz uma oração temporal. A forma coletiva singular preserva de modo natural a referência a Israel como povo.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: comparecer diante de
  rationale: A expressão descreve a apresentação do povo na presença divina. A tradução idiomática evita sugerir que os israelitas contemplariam visualmente o rosto de Deus; a forma mais literal é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz o sufixo possessivo masculino singular, dirigido a Israel em sentido coletivo.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: no lugar que ele escolher
  rationale: Mantém o tema deuteronômico do local de culto escolhido por Deus e expressa naturalmente o valor futuro do imperfeito.
- source_word: תִּקְרָא
  choice: você lerá
  rationale: Mantém a segunda pessoa singular e, neste contexto, קרא designa a leitura pública em voz alta.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: esta lei
  rationale: Aqui תּוֹרָה se refere ao corpo de instrução da aliança; 'lei' é claro, corrente e contextualmente adequado.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: diante de todo o Israel
  rationale: Expressa a apresentação pública na presença do povo reunido.
- source_word: בְּאָזְנֵיהֶם
  choice: para que todos a ouçam
  rationale: Transmite em português natural a expressão hebraica que indica recitação pública audível, explicitando que o referente ouvido é a lei.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de לֵרָאוֹת אֶת־פְּנֵי na presença de Deus
  choice: comparecer diante de
  alternative: ver a face de
  rationale: No contexto de peregrinação e culto, a expressão indica apresentar-se na presença de Deus. A tradução principal comunica esse sentido sem eliminar a forma hebraica, que aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Você lerá' conserva a segunda pessoa singular do hebraico sem recorrer ao mais solene e regionalmente restrito 'lerás'. A repetição de 'todo o Israel' acompanha a ênfase do original.
