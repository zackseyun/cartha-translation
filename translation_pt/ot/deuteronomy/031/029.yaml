  naturalness: O registro é claro e moderno. Para manter coerência com «vocês» e favorecer a legibilidade brasileira, «que ordenei a vocês» é preferível a «que lhes ordenei».
  terminology: «Yahweh», «calamidade», «nos últimos dias», «o que é mau» e «provocando-o à ira» são escolhas adequadas. As notas preservam de modo útil as alternativas lexicais e a abertura contextual da expressão temporal.
