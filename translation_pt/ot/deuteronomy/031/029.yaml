  - severity: low
    issue: A formulação «agirão de modo totalmente corrupto» na nota a é pouco idiomática.
    rationale: «Agirão de modo corrupto» comunica melhor a alternativa intransitiva, enquanto «certamente» já representa a intensificação hebraica.
