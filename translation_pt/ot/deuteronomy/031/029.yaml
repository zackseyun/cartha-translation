  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: pt
  text: Pois sei que, depois da minha morte, vocês certamente se corromperão[a] e se desviarão do caminho que ordenei a vocês, e a calamidade[b] os atingirá nos últimos dias[c], porque vocês farão o que é mau aos olhos de Yahweh, provocando-o à ira com as obras das suas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “certamente agirão de modo corrupto” ou “certamente se tornarão corruptos”. O hebraico intensifica o verbo e permite entendê-lo em sentido reflexivo ou intransitivo neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “o mal” ou “a desgraça”. O termo hebraico pode indicar tanto o mal em sentido amplo quanto uma calamidade que sobrevém a alguém.
    reason: lexical_alternative
  - marker: c
    text: “Nos últimos dias” também pode ser traduzido por “nos dias que virão”. A expressão aponta para o futuro e, conforme o contexto, pode ter peso escatológico.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: Pois sei
  rationale: Introduz a explicação de Moisés e expressa sua convicção de modo natural em português.
- source_word: אַחֲרֵי מוֹתִי
  choice: depois da minha morte
  rationale: Preserva a construção nominal hebraica com clareza e dignidade.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: vocês certamente se corromperão
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. A forma reflexiva comunica naturalmente a corrupção moral de Israel sem introduzir um objeto ausente.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: e se desviarão do caminho
  rationale: Reproduz a metáfora pactual de abandonar a conduta ordenada e soa natural no português atual.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: que lhes ordenei
  rationale: Mantém Moisés como sujeito da ordem e emprega uma construção idiomática em português.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: Então a calamidade os atingirá
  rationale: Nesta construção, קרא descreve uma adversidade que sobrevém a alguém, e רָעָה pode designar calamidade. A escolha evita confusão com o mal moral mencionado em seguida.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  rationale: Preserva a formulação bíblica reconhecível e sua possível carga escatológica, sem restringi-la a um esquema específico.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: porque vocês farão o que é mau
  rationale: Expressa naturalmente a avaliação moral contida no hebraico.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém o idioma hebraico de avaliação divina e verte o Tetragrama como nome próprio.
- source_word: לְהַכְעִיסוֹ
  choice: provocando-o à ira
  rationale: Comunica o sentido causativo de suscitar a ira divina.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: com as obras das suas mãos
  rationale: Conserva a imagem concreta do hebraico, que no contexto provavelmente alude ao que o povo produzirá, inclusive ídolos.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- issue: Alcance de בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  alternative: nos dias que virão
  rationale: Mantém a orientação futura e a possível força escatológica da expressão, sem impor uma interpretação cronológica mais estreita.
- issue: Sentido de רָעָה na calamidade anunciada
  choice: calamidade
  alternative: mal; desgraça
  rationale: O contexto de algo que atingirá Israel favorece uma consequência desastrosa, embora o substantivo também possa ser traduzido de maneira mais ampla como 'mal'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A tradução conserva imagens bíblicas reconhecíveis, evita linguagem excessivamente arcaica e mantém as ambiguidades relevantes em notas.
