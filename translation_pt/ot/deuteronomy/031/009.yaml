  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: pt
  text: Assim, Moisés escreveu esta lei[a] e a entregou aos sacerdotes, filhos de Levi[b], que carregam a arca da aliança de Yahweh[c], e a todos os anciãos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta instrução” ou “esta Torá”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Levi”; muitas traduções dizem de modo mais compacto “levitas”.'
    reason: lexical_alternative
  - marker: c
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: escreveu
  rationale: O verbo כתב indica diretamente o ato de escrever; a forma narrativa é reproduzida com naturalidade pelo pretérito perfeito.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: esta lei
  rationale: תּוֹרָה pode significar lei ou instrução; neste contexto de um texto pactual escrito e confiado aos líderes, “esta lei” é a formulação portuguesa mais natural, sem eliminar as alternativas legítimas, registradas em nota.
- source_word: וַיִּתְּנָהּ
  choice: a entregou
  rationale: O sufixo feminino retoma תּוֹרָה. “A entregou” expressa com clareza que Moisés confiou o texto aos destinatários e soa mais natural em português do que a reprodução literal “deu-a”.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: É o equivalente português corrente e preciso de כֹּהֲנִים.
- source_word: בְּנֵי לֵוִי
  choice: filhos de Levi
  rationale: Preserva a expressão hebraica explícita e sua relação apositiva com “os sacerdotes”, em vez de compactá-la como “levitas”.
- source_word: הַנֹּשְׂאִים
  choice: que carregam
  rationale: O particípio caracteriza esses sacerdotes como os que transportam a arca; “carregam” é claro e atual.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Mantém de modo transparente a cadeia construta hebraica e conserva o nome divino pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome próprio, em vez de substituí-lo pelo título tradicional “SENHOR”.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: todos os anciãos de Israel
  rationale: Tradução direta e estabelecida para os dirigentes designados por זִקְנֵי.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal; a nota informa a substituição tradicional sem inseri-la no corpo do versículo.
- issue: Alcance de תּוֹרָה neste contexto
  choice: lei
  alternative: instrução; Torá
  rationale: O referente é o corpo pactual que Moisés põe por escrito. “Lei” se ajusta ao contexto imediato, enquanto a nota conserva a amplitude lexical do hebraico.
- issue: Identidade dos sacerdotes como בְּנֵי לֵוִי
  choice: sacerdotes, filhos de Levi
  alternative: sacerdotes levitas; sacerdotes, descendentes de Levi
  rationale: A formulação preserva a aposição e não transforma a expressão em uma categoria denominacional ou técnica além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada ao uso natural do português, preservando a aposição “filhos de Levi”, a função participial “que carregam” e a cadeia “arca da aliança de Yahweh”. Todos os marcadores de nota aparecem no texto principal.
