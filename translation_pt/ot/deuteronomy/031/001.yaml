base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/001.yaml
  text: Then Moses went and spoke these words to all Israel[a].
translation:
  language: pt
  text: Então Moisés foi e falou estas palavras a todo o Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E Moisés foi e falou estas palavras a todo o Israel». A conjunção inicial pode ser traduzida mais formalmente por «E».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: O verbo הלך no wayyiqtol conserva aqui seu sentido comum de movimento, «foi». Embora a ausência de destino permita entendê-lo como «prosseguiu», não é necessário substituir o sentido verbal simples.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: דבר no piel significa normalmente «falar». «Falou» combina de modo natural com o objeto direto «estas palavras» e preserva o estilo narrativo.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: estas palavras
  rationale: Tradução direta da expressão hebraica, que aponta para as palavras do discurso, sem generalizá-las como «estas coisas» nem interpretá-las como «esta mensagem».
- source_word: אֶל
  choice: a
  rationale: A preposição marca os destinatários da fala; em português, «falar estas palavras a» reproduz essa relação de forma clara.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém Israel como designação coletiva do povo e representa diretamente כָּל, sem converter a expressão em um plural individualizante como «todos os israelitas».
- source_word: וַ
  choice: Então
  rationale: O waw narrativo faz a sequência avançar. «Então» exprime essa progressão em português corrente; «E» é a alternativa mais formal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção próxima ao hebraico sem sacrificar a naturalidade. A expressão coletiva «todo o Israel» e a repetição lexical «falou estas palavras» foram preservadas deliberadamente.
