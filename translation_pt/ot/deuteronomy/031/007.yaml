  naturalness: O português é moderno, claro e adequado. «Diante de todo Israel» é ligeiramente mais idiomático do que «diante de todo o Israel» neste registro bíblico contemporâneo.
  terminology: «Yahweh», «Josué», «terra» e «herança» são escolhas adequadas e consistentes. «Pais deles» deve substituir «antepassados deles» para refletir o hebraico e a decisão lexical de base; a nota pode esclarecer a forma hebraica.
