base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: pt
  text: 'Então Moisés chamou Josué e lhe disse diante de todo Israel: “Seja forte e corajoso, pois você entrará com este povo[a] na terra que Yahweh jurou dar aos pais deles[b], e você a dará a eles como herança.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você fará este povo entrar na terra”. O hebraico pode ser entendido tanto como Josué entrando com o povo quanto como conduzindo-o para dentro da terra; a oração seguinte afirma que ele lhes dará a terra como herança.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “pais deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: No contexto narrativo, קרא significa naturalmente chamar; a opção é corrente e não acrescenta a formalidade de uma convocação oficial.
- source_word: לִיהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: diante de todo o Israel
  rationale: Expressa de modo natural o sentido literal de algo feito à vista de todo Israel, preservando o caráter público da declaração.
- source_word: חֲזַק וֶאֱמָץ
  choice: Seja forte e corajoso
  rationale: Reproduz a exortação hebraica convencional com uma formulação natural, digna e conhecida em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação sem tornar a frase excessivamente coloquial.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: você entrará com este povo
  rationale: Preserva a leitura segundo a qual Josué entra junto com o povo, sem apagar a possibilidade sintática de que ele o faça entrar, registrada em nota.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém o termo corrente no contexto da terra prometida e sua continuidade temática na narrativa da aliança.
- source_word: נִשְׁבַּע יְהוָה
  choice: Yahweh jurou
  rationale: O verbo expressa um juramento, e o tetragrama é representado pelo nome pessoal Yahweh.
- source_word: לַאֲבֹתָם
  choice: aos antepassados deles
  rationale: Comunica claramente que se trata das gerações ancestrais de Israel; a forma literalmente masculina é indicada em nota.
- source_word: לָתֵת לָהֶם
  choice: dar aos antepassados deles
  rationale: A construção infinitiva expressa o conteúdo do juramento; em português, o complemento foi integrado à oração relativa.
- source_word: תַּנְחִילֶנָּה אֹתָם
  choice: você a dará a eles como herança
  rationale: Torna claro o valor causativo do verbo נחל e preserva o conceito de herança ligado à aliança.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de תָּבוֹא אֶת הָעָם
  choice: você entrará com este povo
  alternative: você fará este povo entrar
  rationale: A construção admite que Josué entre com o povo e também pode ser entendida em sentido causativo. O texto principal conserva a primeira leitura, enquanto a nota registra a alternativa sem harmonizar silenciosamente a expressão com passagens próximas.
- issue: Representação de אֲבֹתָם
  choice: antepassados deles
  alternative: pais deles
  rationale: No contexto, o termo designa as gerações ancestrais às quais a terra foi prometida. A tradução comunica esse referente com clareza, e a nota preserva a forma lexical literal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação evita arcaísmos, mantém o nome Yahweh e conserva em nota a ambiguidade real da construção hebraica referente à entrada na terra.
