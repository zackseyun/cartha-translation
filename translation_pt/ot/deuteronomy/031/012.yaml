  rationale: A revisão limita-se a tornar natural a descrição do estrangeiro residente e a precisar a nota sobre «portões». Mantêm-se a estrutura de finalidade repetida, a enumeração explícita, o nome Yahweh, o temor reverente e «todas as palavras desta lei».
