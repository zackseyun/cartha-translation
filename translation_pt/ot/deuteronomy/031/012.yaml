  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: pt
  text: Reúna o povo — os homens, as mulheres, as crianças pequenas e o estrangeiro que reside nas cidades de vocês[a] — para que ouçam, para que aprendam e temam Yahweh, o Deus de vocês[b], e tenham o cuidado de cumprir todas as palavras desta lei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “que está dentro dos seus portões”. “Portões” é uma expressão que se refere às cidades ou comunidades.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “reverenciem Yahweh, o Deus de vocês”. O verbo hebraico abrange temor reverente e obediência.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “desta instrução”. O hebraico torá pode significar tanto “lei” como “instrução”; aqui, “lei” corresponde ao contexto da aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  choice: Reúna
  rationale: O hifil imperativo de קהל ordena fazer o povo reunir-se em assembleia. “Reúna” é natural, direto e preserva a força da convocação.
- source_word: הָעָם
  choice: o povo
  rationale: עָם designa aqui toda a comunidade da aliança.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: os homens, as mulheres, as crianças pequenas
  rationale: Mantém a enumeração explícita do hebraico; טַף se refere especialmente às crianças pequenas ou aos dependentes.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: e o estrangeiro residente que vive dentro das suas cidades
  rationale: גֵר é o não israelita residente na comunidade, não um visitante passageiro. שְׁעָרִים, literalmente “portões”, funciona em Deuteronômio como referência às cidades ou comunidades.
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: para que ouçam, para que aprendam
  rationale: Preserva a repetição das orações de finalidade e o vocabulário de ouvir e aprender característico de Deuteronômio.
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: e temam Yahweh, o Deus de vocês
  rationale: ירא inclui temor reverente e obediência; “temam” preserva a força e a amplitude do termo. O nome יהוה é transliterado como Yahweh.
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: e tenham o cuidado de cumprir
  rationale: A construção שמר + infinitivo comunica observância cuidadosa que se concretiza em ação. “Cumprir” é idiomático em português no contexto de mandamentos.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: todas as palavras desta lei
  rationale: Conserva דִּבְרֵי como “palavras”. Embora תּוֹרָה também possa significar “instrução”, “lei” se ajusta ao contexto do documento da aliança.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança, em vez de substituí-lo por um título.
- issue: Sentido de ירא em relação a Deus
  choice: temam
  alternative: reverenciem
  rationale: “Temam” mantém a tensão bíblica entre medo, reverência e submissão obediente, sem reduzir o verbo a apenas respeito.
- issue: Enumeração dos participantes
  choice: os homens, as mulheres, as crianças pequenas e o estrangeiro residente
  alternative: todos, incluindo homens, mulheres e crianças
  rationale: O hebraico enumera expressamente os grupos, destacando a inclusão de toda a comunidade na audição da lei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” por corresponder ao plural hebraico dirigido à comunidade. A formulação explicita o sentido idiomático de “portões” no texto principal e registra a forma literal em nota.
