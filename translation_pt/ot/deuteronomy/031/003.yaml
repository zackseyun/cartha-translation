language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: pt
  text: Yahweh, seu Deus, é quem atravessará à sua frente[a]. Ele mesmo destruirá estas nações diante de você, e você as desapossará[b]. Josué é quem atravessará à sua frente, conforme Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vai adiante de você” ou “está atravessando à sua frente”. O particípio hebraico pode indicar uma ação em andamento, iminente ou futura tida como certa.
    reason: lexical_alternative
  - marker: b
    text: Ou “você tomará posse delas” — isto é, do território delas. Neste contexto, o verbo hebraico traz a ideia de tomar posse mediante o desapossamento dos ocupantes anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a forma com sufixo de segunda pessoa masculina singular e a maneira natural de dirigir-se coletivamente a Israel em português.
- source_word: הוּא
  choice: é quem / ele mesmo
  rationale: A construção enfática destaca tanto a ação pessoal de Yahweh quanto a função de Josué; as duas formulações naturais em português preservam essa ênfase.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: atravessará à sua frente
  rationale: No contexto da entrada na terra, o particípio indica ação iminente ou certa. “Atravessará” preserva a imagem concreta da travessia e “à sua frente” indica precedência.
- source_word: יַשְׁמִיד
  choice: destruirá
  rationale: Expressa com clareza a força causativa do hifil de שׁמד sem acrescentar uma especificação de totalidade não explicitada pela forma.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: estas nações
  rationale: Representa os grupos político-étnicos de Canaã e corresponde ao uso habitual de גּוֹיִם em Deuteronômio.
- source_word: מִלְּפָנֶיךָ
  choice: diante de você
  rationale: Conserva o sentido espacial de povos removidos do caminho de Israel, com expressão idiomática em português.
- source_word: וִירִשְׁתָּם
  choice: você as desapossará
  rationale: No contexto da conquista, ירשׁ descreve a tomada de posse mediante a remoção dos ocupantes anteriores. O pronome feminino retoma “nações”, objeto explícito no hebraico.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma portuguesa convencional do nome pessoal.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: conforme Yahweh falou
  rationale: Traduz דִּבֶּר como ato de fala, sem ampliá-lo interpretativamente para “prometeu”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto apresenta diretamente o Tetragrama; conservar “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Ênfase da agência de Yahweh e de Josué
  choice: Preservar a ênfase em ambos com “é quem” e, na segunda oração, “ele mesmo”
  alternative: Usar apenas pronomes simples, sem ênfase
  rationale: A repetição de הוּא ressalta que Yahweh vai pessoalmente adiante e que Josué também seguirá adiante sob sua comissão. A redação mantém juntas a agência divina e a humana sem colocá-las em competição.
- issue: Valor temporal do particípio עֹבֵר
  choice: 'Futuro iminente e certo: “atravessará”'
  alternative: 'Presente progressivo: “está atravessando”; ação habitual: “vai adiante”'
  rationale: A cena aponta para a travessia que ocorrerá em breve. O futuro é natural em português, enquanto a nota conserva a amplitude aspectual do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O singular “você” conserva a segunda pessoa singular hebraica dirigida coletivamente a Israel. “Desapossará” é menos cotidiano, mas é preciso no contexto; a nota esclarece a alternativa mais corrente. Todos os marcadores de nota aparecem no texto principal.
