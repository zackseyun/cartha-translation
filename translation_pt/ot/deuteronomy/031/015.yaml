base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: pt
  text: E Yahweh apareceu na tenda[a], em uma coluna de nuvem; e a coluna de nuvem ficou à entrada da tenda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na Tenda”; o hebraico diz simplesmente “na tenda”, que, pelo contexto, provavelmente é a tenda do encontro.
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre a entrada da tenda”; a preposição hebraica também pode ser traduzida mais literalmente por “sobre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה descreve aqui uma manifestação visível. “Apareceu” é natural em português e preserva o caráter teofânico sem explicar além do texto como se deu a manifestação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּאֹהֶל
  choice: na tenda
  rationale: אֹהֶל significa literalmente “tenda”. Embora o contexto indique a tenda do encontro, o versículo diz apenas “a tenda”; por isso, evita-se explicitar no corpo do texto o que permanece implícito no hebraico.
- source_word: בְּעַמּוּד עָנָן
  choice: em uma coluna de nuvem
  rationale: A preposição בְּ é preservada por “em”, apresentando a coluna de nuvem como o meio ou âmbito da manifestação. A construção sem artigo favorece “uma coluna de nuvem” na primeira menção.
- source_word: וַיַּעֲמֹד
  choice: ficou parada
  rationale: עמד significa “estar de pé” ou “permanecer parado”. Como o sujeito é a coluna de nuvem, “ficou parada” comunica com naturalidade a imagem concreta e sua posição estável.
- source_word: עַמּוּד הֶעָנָן
  choice: a coluna de nuvem
  rationale: A expressão retoma de modo definido a coluna já mencionada, o que se reproduz claramente com o artigo definido em português.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: à entrada da tenda
  rationale: Embora עַל frequentemente signifique “sobre”, junto de פתח pode indicar posição junto à entrada. “À entrada” é idiomático e adequado à cena, enquanto a alternativa mais literal é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: A tradução conserva o nome da aliança como nome próprio, sem substituí-lo por um título.
- issue: Descrição da manifestação divina
  choice: apareceu na tenda, em uma coluna de nuvem
  alternative: apareceu junto à tenda como uma coluna de nuvem
  rationale: A formulação mantém a manifestação visível e localizada e a imagem concreta da coluna de nuvem, sem identificar a própria essência divina com a coluna nem reduzir a cena a uma abstração.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a repetição de “coluna de nuvem” e “tenda”, própria da estrutura hebraica. O ponto e vírgula separa as duas ações sem quebrar a unidade da cena.
