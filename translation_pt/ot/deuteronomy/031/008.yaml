base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: pt
  text: Yahweh é quem vai adiante de você. Ele mesmo estará com você; não o deixará cair[a] nem o abandonará. Não tenha medo nem se deixe abater.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o soltará”.'
    reason: Alternativa lexical para יַרְפְּךָ, verbo que pode significar não soltar ou não deixar cair alguém.
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הוּא הַהֹלֵךְ לְפָנֶיךָ
  choice: é quem vai adiante de você
  rationale: Preserva a ênfase do pronome independente e apresenta de modo natural a ação contínua do particípio, no sentido de preceder para guiar e proteger.
- source_word: הוּא יִהְיֶה עִמָּךְ
  choice: Ele mesmo estará com você
  rationale: Mantém tanto a ênfase de הוּא quanto a linguagem direta da presença divina.
- source_word: לֹא יַרְפְּךָ
  choice: não o deixará sem apoio
  rationale: Comunica o sentido causativo de não soltar, não deixar cair ou não falhar com alguém, sem confundi-lo com o verbo seguinte, 'abandonar'.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: nem o abandonará
  rationale: Expressa com clareza o sentido de deixar ou desamparar e preserva a distinção em relação a רפה.
- source_word: לֹא תִירָא
  choice: Não tenha medo
  rationale: Reproduz naturalmente a força exortativa e proibitiva da forma verbal no contexto.
- source_word: וְלֹא תֵחָת
  choice: nem se deixe abater
  rationale: Transmite o sentido de não ficar quebrantado, intimidado ou desalentado, evitando mera repetição de 'ter medo'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome pessoal divino; a transliteração o preserva e evita substituí-lo por um título.
- issue: Ênfase da presença e ação pessoais de Deus
  choice: é quem vai... Ele mesmo estará
  alternative: vai... estará
  rationale: Os dois usos do pronome independente הוּא são enfáticos; a tradução conserva essa ênfase sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento naturais para leitores brasileiros e amplamente compreensíveis no português internacional. A formulação evita arcaísmos e preserva a ênfase e a distinção entre os dois verbos hebraicos de desamparo.
