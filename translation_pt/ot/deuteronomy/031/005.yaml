  yaml_path: translation/ot/deuteronomy/031/005.yaml
  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: pt
  text: O SENHOR os entregará a vocês, e vocês farão com eles conforme tudo o que ordenei a vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: O SENHOR os entregará a vocês
  rationale: O verbo נתן com לִפְנֵי, neste contexto militar, indica colocar os inimigos sob o poder de Israel. “Entregará a vocês” comunica naturalmente esse sentido sem acrescentar detalhes ausentes no hebraico.
- source_word: כְּכָל הַמִּצְוָה
  choice: conforme tudo o que ordenei
  rationale: Embora מִצְוָה seja literalmente “mandamento”, a construção refere-se à totalidade das instruções dadas por Moisés. A formulação verbal é clara em português e evita o pouco natural “conforme todo o mandamento”.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: que ordenei a vocês
  rationale: Preserva a primeira pessoa de Moisés e o destinatário plural explícito.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: O SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes, sem introduzir uma vocalização no corpo do texto.
- issue: Conteúdo da ordem acerca das nações
  choice: conforme tudo o que ordenei a vocês
  alternative: explicitar aqui a natureza da ordem
  rationale: O versículo remete a instruções anteriores sem repeti-las. A tradução mantém essa referência e não amplia nem suaviza seu conteúdo.
translation_notes:
  register: Português moderno, claro e digno, com concordância no plural marcada por “vocês”. A repetição de “a vocês” reflete os dois complementos plurais do hebraico e mantém clareza.
