  source_fidelity: 'A oração final hebraica é uma relativa (אֲשֶׁר הִשְׁמִיד אֹתָם, literalmente, “aos/quais ele destruiu”), não uma oração temporal. O antecedente e o alcance do pronome plural são sintaticamente difíceis: pode retomar os reis, ou o conjunto dos reis e seus domínios/povos. A versão proposta, “quando os destruiu”, segue a auditoria inglesa, mas transforma a relação relativa em temporal e tende a restringir “os” aos dois reis.'
