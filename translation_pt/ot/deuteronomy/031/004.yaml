  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: pt
  text: E o SENHOR fará com eles como fez com Seom e Ogue, reis dos amorreus, e com a terra deles, destruindo-os.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o nome divino pelo título em versaletes, mantendo dignidade e ampla legibilidade.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: como fez
  rationale: Reproduz de modo natural a comparação expressa no hebraico.
- source_word: הִשְׁמִיד
  choice: destruiu
  rationale: Expressa diretamente o sentido causativo forte do verbo hebraico, sem suavizá-lo.
theological_decisions:
- issue: Referência do relativo אֲשֶׁר
  choice: quando os destruiu
  alternative: que ele destruiu
  rationale: A formulação temporal preserva a leitura contextual adotada pela camada inglesa auditada e evita sugerir que o pronome relativo modifique apenas “terra”; “os” retoma Seom, Ogue e, no contexto, seus domínios/povos vencidos.
translation_notes:
  register: Português moderno, digno e corrente, com ordem sintática próxima do hebraico sem sacrificar a naturalidade. Os nomes são grafados nas formas portuguesas Seom e Ogue.
