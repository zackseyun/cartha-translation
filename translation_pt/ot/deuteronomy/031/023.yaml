base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: pt
  text: 'Ele deu esta ordem a Josué, filho de Num, e disse: “Seja forte e corajoso, pois você levará os filhos de Israel[a] para a terra que lhes jurei, e eu estarei com você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “o povo de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: deu esta ordem
  rationale: O piel de צוה significa ordenar ou incumbir. “Deu esta ordem” é natural em português e preserva a força do comissionamento solene.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Emprega as formas tradicionais e reconhecíveis dos nomes bíblicos em português e verte naturalmente o patronímico.
- source_word: חֲזַק וֶאֱמָץ
  choice: Seja forte e corajoso
  rationale: A expressão combina firmeza e coragem; esta formulação preserva sua força exortativa e é clara no português atual.
- source_word: כִּי
  choice: pois
  rationale: Aqui a conjunção introduz a razão para a exortação, relação causal expressa de modo conciso por “pois”.
- source_word: תָּבִיא
  choice: você fará ... entrarem
  rationale: O hifil de בוא é causativo. A construção explicita que Josué conduzirá o povo para dentro da terra sem reduzir o verbo apenas a “liderar”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a imagem familiar e pactual da expressão hebraica, enquanto a nota oferece equivalentes coletivos naturais.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: “A terra” preserva a terminologia temática da promessa territorial em Deuteronômio.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: que lhes prometi sob juramento
  rationale: O hebraico diz literalmente que Deus jurou a eles. Em português, “prometi sob juramento” comunica naturalmente o compromisso solene sem acrescentar explicitamente “dar”.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: e eu estarei com você
  rationale: O pronome expresso אָנֹכִי recebe correspondência em “eu”, preservando sua ênfase e a fórmula reconhecível da presença divina.
theological_decisions:
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução principal conserva a expressão familiar masculina do hebraico e sua textura pactual; a nota esclarece seu sentido coletivo sem apagar a forma da fonte.
- issue: Sujeito implícito de וַיְצַו / וַיֹּאמֶר
  choice: Ele deu esta ordem ... e disse
  alternative: O SENHOR deu esta ordem ... e disse
  rationale: O hebraico emprega sujeito masculino singular implícito, identificado pelo contexto como o SENHOR. Mantê-lo como pronome evita inserir no versículo um nome divino que não está expresso nesta oração.
- issue: Conteúdo do juramento
  choice: a terra que lhes prometi sob juramento
  alternative: a terra que jurei dar a eles
  rationale: A formulação escolhida preserva o caráter juramentado da promessa sem acrescentar na oração o verbo “dar”, que está implícito pelo contexto, mas não aparece no texto hebraico deste versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. O tratamento por “você” evita formas regionais ou excessivamente solenes, enquanto “sob juramento” mantém o tom pactual.
