base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/022.yaml
  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: pt
  text: Assim, naquele dia, Moisés escreveu este cântico e o ensinou aos filhos de Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” ou “ao povo de Israel”. O hebraico diz literalmente “aos filhos de Israel”, designação coletiva tradicional do povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: escreveu
  rationale: O qal narrativo de כתב significa diretamente “escrever”; “escreveu” preserva com naturalidade a sequência narrativa.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: este cântico
  rationale: שִׁירָה designa uma composição cantada ou poética. “Cântico” mantém o caráter literário e solene do contexto sem reduzi-lo a um poema não musical.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal direto e idiomático em português, sem acrescentar a interpretação mais enfática “naquele mesmo dia”.
- source_word: וַיְלַמְּדָהּ
  choice: o ensinou
  rationale: O piel de למד significa “ensinar”, e o sufixo feminino singular retoma שִׁירָה. Em português, o pronome masculino “o” concorda com “cântico” na tradução.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma masculina plural da expressão hebraica e sua função como designação coletiva tradicional do povo da aliança.
theological_decisions:
- issue: Expressão coletiva marcada por gênero בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A expressão hebraica é literalmente masculina plural e funciona como designação coletiva do povo. A tradução mantém sua forma sem negar o alcance corporativo, esclarecido em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Cântico” conserva o tom literário do contexto; “filhos de Israel” mantém a formulação hebraica, enquanto a nota esclarece seu sentido coletivo.
