source:
  edition: WLC
  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: pt
  text: E, quando muitos males e aflições lhe sobrevierem[a], este cântico responderá diante dele[b] como testemunha, pois não desaparecerá da boca de seus descendentes. Pois conheço a sua inclinação[c], aquilo que ele está fazendo hoje, antes de eu o levar para a terra que jurei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o encontrarem” ou “o alcançarem”.
    reason: lexical_alternative
  - marker: b
    text: “Diante dele” também pode ser entendido, com maior força forense, como “contra ele”, pois o cântico atua como testemunha.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “sua inclinação”; também pode significar “intenção”, referindo-se à sua disposição interior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E, quando
  rationale: Expressa de modo natural a moldura temporal futura do hebraico, sem reproduzir desnecessariamente a fórmula mais rígida “e acontecerá que”.
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: lhe sobrevierem
  rationale: No contexto, o verbo descreve males e aflições que alcançam ou acometem Israel; “sobrevierem” conserva essa força e é idiomático em português.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: muitos males e aflições
  rationale: Aqui רָעוֹת indica acontecimentos danosos, não simplesmente maldade moral; “males” mantém a transparência lexical, e “aflições” comunica a angústia de צָרוֹת.
- source_word: וְעָנְתָה
  choice: responderá
  rationale: Preserva a imagem verbal de ענה, “responder”, enquanto a expressão seguinte explicita que o cântico exerce a função de testemunha.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: este cântico
  rationale: “Cântico” é natural no registro bíblico português e identifica uma composição destinada a ser cantada ou recitada.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Mantém o sentido espacial e forense básico de “diante dele”, sem decidir no texto principal se a testemunha atua especificamente “contra ele”.
- source_word: לְעֵד
  choice: como testemunha
  rationale: Explicita de modo direto e idiomático a função probatória atribuída ao cântico.
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: não será esquecido da boca de seus descendentes
  rationale: Conserva a imagem hebraica da boca, importante para a transmissão oral, e verte o coletivo זרע por “descendentes”.
- source_word: יִצְרוֹ
  choice: a sua inclinação
  rationale: Comunica a disposição ou tendência interior de Israel sem impor uma categoria teológica posterior.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: aquilo que ele está fazendo hoje
  rationale: Mantém a construção participial e a formulação incomum que relaciona a inclinação interior à conduta presente de Israel.
- source_word: בְּטֶרֶם אֲבִיאֶנּוּ
  choice: antes mesmo de eu o levar
  rationale: “Antes mesmo” realça naturalmente a anterioridade marcada por בטרם, e “o” retoma Israel no singular coletivo.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבָּעְתִּי
  choice: à terra que jurei dar
  rationale: “Dar” não está expresso no texto consonantal da oração, mas é o complemento elíptico natural da fórmula da promessa da terra; a nota preserva transparência quanto à explicitação.
theological_decisions:
- issue: Sentido de יִצְרוֹ no contexto do conhecimento divino e da disposição humana
  choice: a sua inclinação
  alternative: a sua intenção; a sua imaginação; a sua tendência
  rationale: “Inclinação” preserva o peso moral e volitivo da disposição interior de Israel sem transformá-la em uma formulação técnica de doutrinas antropológicas posteriores.
- issue: Função forense do cântico em וְעָנְתָה ... לְעֵד
  choice: responderá diante dele como testemunha
  alternative: testemunhará contra ele
  rationale: A tradução mantém separadamente a imagem de “responder” e a função de “testemunha”, além de conservar a ambiguidade de לְפָנָיו entre presença e oposição forense.
- issue: Complemento elíptico da fórmula do juramento sobre a terra
  choice: que jurei dar
  alternative: que jurei
  rationale: O verbo “dar” torna explícito em português o objeto implícito do juramento pactual, sem alterar a natureza da promessa; a nota registra que o termo é suprido pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Cântico” preserva o registro bíblico sem arcaísmo excessivo. O singular coletivo referente a Israel foi mantido nos pronomes, e as ambiguidades lexical, forense e teológica foram preservadas no texto ou registradas em notas.
