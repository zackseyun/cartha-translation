  to: E, quando muitos males e aflições lhe sobrevierem[a], este cântico responderá diante dele[b] como testemunha, pois não desaparecerá da boca de seus descendentes. Pois conheço a sua inclinação[c], aquilo que ele está fazendo hoje, antes de eu o levar para a terra que jurei.
