base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Eis que você está prestes a deitar-se com seus antepassados. Então este povo se levantará e se prostituirá, seguindo os deuses estrangeiros da terra, em cujo meio ele está entrando[a]. Eles me abandonarão e quebrarão a aliança que fiz com eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega formas no singular: “ele está entrando” e, no fim do versículo, “com ele”. Essas formas tratam Israel, “este povo”, como uma coletividade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: Veja, você está prestes a deitar-se com seus antepassados
  rationale: Conserva a solenidade do marcador discursivo e a metáfora hebraica para a morte, usando linguagem portuguesa compreensível.
- source_word: וְקָם
  choice: Então este povo se levantará
  rationale: Expressa a sequência futura sem acrescentar explicitamente a ideia de rebelião, que o verbo isolado não exige.
- source_word: וְזָנָה אַחֲרֵי
  choice: se prostituirá, seguindo
  rationale: Mantém a forte metáfora sexual da infidelidade à aliança e expressa com naturalidade o sentido relacional de אַחֲרֵי.
- source_word: אֱלֹהֵי נֵכַר הָאָרֶץ
  choice: os deuses estrangeiros da terra
  rationale: Preserva a associação dos deuses estrangeiros com a terra em que Israel entraria.
- source_word: אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: em cujo meio está entrando
  rationale: Mantém o singular coletivo do hebraico, que retoma 'este povo', e evita inserir um referente não explícito.
- source_word: וַעֲזָבַנִי
  choice: Eles me abandonarão
  rationale: Traduz claramente a ruptura relacional e pactual indicada pelo verbo.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: e quebrarão a aliança
  rationale: Usa a expressão portuguesa natural para violar uma aliança.
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: que fiz com eles
  rationale: Traduz o idioma כרת ברית por 'fazer uma aliança' e torna explícito o referente coletivo do sufixo singular.
theological_decisions:
- issue: A idolatria descrita por uma metáfora sexual
  choice: se prostituirá, seguindo os deuses estrangeiros
  alternative: será infiel, seguindo os deuses estrangeiros
  rationale: A formulação preserva a severidade deliberada da metáfora hebraica de infidelidade à aliança sem convertê-la numa categoria doutrinária posterior.
- issue: Alternância entre singular coletivo e plural
  choice: Preservar o singular em 'está entrando' e usar o plural em 'eles... com eles' quando a concordância portuguesa o pede
  alternative: Uniformizar todas as referências no plural
  rationale: O texto hebraico apresenta 'este povo' como coletivo singular e depois alterna formas; a tradução conserva parte dessa textura sem prejudicar a clareza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a metáfora hebraica da morte e a linguagem forte da infidelidade idólatra. 'Antepassados' evita que 'pais' seja entendido apenas como progenitores imediatos.
