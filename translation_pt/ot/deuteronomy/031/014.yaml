base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: pt
  text: 'Yahweh disse a Moisés: “Eis que seus dias estão chegando ao fim, e você morrerá. Chame Josué e apresentem-se na tenda do encontro, para que eu lhe dê ordens.[a]” Então Moisés e Josué foram e se apresentaram na tenda do encontro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o encarregue”, “lhe dê uma incumbência” ou “o comissione”. O verbo hebraico pode significar ordenar, dar instruções ou incumbir formalmente alguém; neste contexto, refere-se à ordem dada por Yahweh a Josué em vista de sua função futura.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֵן
  choice: Veja
  rationale: Preserva a função de chamar a atenção no início da fala divina, em português atual e natural.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: está próximo o tempo de sua morte
  rationale: Comunica com clareza a expressão idiomática hebraica sobre a proximidade da morte de Moisés, sem tornar a frase portuguesa artificial.
- source_word: קְרָא אֶת־יְהוֹשֻׁעַ
  choice: Chame Josué
  rationale: Reproduz de modo direto e natural o imperativo simples.
- source_word: וְהִתְיַצְּבוּ / וַיִּתְיַצְּבוּ
  choice: apresentem-se / se apresentaram
  rationale: O hitpael indica comparecer ou tomar posição diante de alguém; a mesma equivalência é mantida nas duas ocorrências.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Conserva a designação do santuário e o valor locativo da preposição.
- source_word: וַאֲצַוֶּנּוּ
  choice: para que eu o encarregue
  rationale: No contexto da sucessão de Moisés por Josué, o verbo denota a atribuição formal de uma responsabilidade; a nota registra as alternativas lexicais legítimas.
- source_word: וַיֵּלֶךְ מֹשֶׁה וִיהוֹשֻׁעַ
  choice: Então Moisés e Josué foram
  rationale: Expressa de maneira fluente a progressão narrativa e a resposta à ordem divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino; a transliteração preserva sua condição de nome pessoal.
- issue: Sentido de צוה na designação de Josué
  choice: encarregue
  alternative: ordene; dê uma incumbência; comissione
  rationale: “Encarregue” comunica a atribuição formal de responsabilidade sem limitar o verbo a uma ordem isolada nem importar conotações eclesiásticas posteriores; a ambiguidade lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “sua” e formas verbais correntes, evita arcaísmos e mantém a repetição deliberada de “apresentar-se” nas duas ocorrências do mesmo verbo hebraico.
