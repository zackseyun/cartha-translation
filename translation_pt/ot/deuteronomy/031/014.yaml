revisions:
- from: 'Yahweh disse a Moisés: “Veja, está próximo o tempo de sua morte. Chame Josué, e apresentem-se na tenda do encontro, para que eu o encarregue.[a]” Então Moisés e Josué foram e se apresentaram na tenda do encontro.'
  to: 'Yahweh disse a Moisés: “Eis que seus dias estão chegando ao fim, e você morrerá. Chame Josué e apresentem-se na tenda do encontro, para que eu lhe dê ordens.[a]” Então Moisés e Josué foram e se apresentaram na tenda do encontro.'
  rationale: A revisão preserva a imagem hebraica dos dias que chegam ao fim e traduz o verbo צוה com seu sentido básico, “dar ordens”, sem excluir em nota a possível nuance contextual de encargo formal. Mantêm-se o nome divino, os nomes próprios, o termo cultual e a repetição do verbo de comparecimento.
