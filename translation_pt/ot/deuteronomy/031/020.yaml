  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: pt
  text: Pois, quando eu o levar à terra que prometi sob juramento a seus pais[a], terra que mana leite e mel, ele comerá, ficará satisfeito e engordará. Então se voltará para outros deuses; eles os servirão e me desprezarão[b], e ele quebrará a minha aliança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico trata Israel primeiro no singular (“o… ele”), passa ao plural em “eles os servirão e me desprezarão” e volta ao singular em “ele quebrará”, apresentando Israel tanto como um só povo quanto como as pessoas que o compõem.
    reason: Preservar e explicar as mudanças de número gramatical do texto-fonte.
  - marker: b
    text: 'Ou: “me tratarão com desprezo”.'
    reason: Registrar uma alternativa lexical legítima para וְנִאֲצוּנִי.
lexical_decisions:
- source_word: כִּי
  choice: Pois, quando
  rationale: Reproduz tanto a função explicativa de כִּי quanto o valor temporal da oração que se segue.
- source_word: אֲבִיאֶנּוּ
  choice: eu o levar
  rationale: O sufixo é masculino singular e se refere coletivamente a Israel; o futuro é expresso de modo natural após “quando”.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: prometi sob juramento a seus pais
  rationale: Torna explícita em português a ideia idiomática de uma promessa jurada, preservando o sufixo singular coletivo e a referência aos pais de Israel.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: terra que mana leite e mel
  rationale: Mantém a conhecida imagem hebraica de abundância em formulação natural e dignificada.
- source_word: וְשָׂבַע
  choice: ficará satisfeito
  rationale: Expressa a ideia de comer até ficar saciado sem recorrer a linguagem arcaica.
- source_word: וְדָשֵׁן
  choice: engordará
  rationale: Preserva a metáfora concreta do hebraico, em que a fartura conduz à complacência.
- source_word: וּפָנָה אֶל
  choice: se voltará para
  rationale: Conserva a imagem de uma mudança de orientação e lealdade em direção a outros deuses.
- source_word: וַעֲבָדוּם
  choice: eles os servirão
  rationale: A forma hebraica tem sujeito plural e objeto plural. “Servir” preserva a linguagem de lealdade religiosa sem reduzi-la apenas ao ato de culto.
- source_word: וְנִאֲצוּנִי
  choice: me desprezarão
  rationale: O verbo indica tratar com desprezo ou desdém; o plural hebraico é mantido.
- source_word: וְהֵפֵר אֶת־בְּרִיתִי
  choice: ele quebrará a minha aliança
  rationale: A forma volta ao singular coletivo. “Quebrar a aliança” comunica de modo claro a violação do compromisso pactual.
theological_decisions:
- issue: Alternância entre singular coletivo e plural ao falar de Israel
  choice: 'Manter a sequência do hebraico: “o/ele”, depois “eles”, e por fim novamente “ele”.'
  alternative: Uniformizar todas as referências no singular ou todas no plural.
  rationale: O texto apresenta Israel ora como um só povo, ora como as pessoas que o compõem. Preservar as mudanças evita eliminar uma tensão gramatical genuína da fonte.
- issue: Linguagem da infidelidade à aliança
  choice: “se voltará para outros deuses; eles os servirão”
  alternative: “cometerá idolatria” ou “apostatará”
  rationale: A tradução conserva as ações descritas no texto sem acrescentar rótulos teológicos que, embora pertinentes, não aparecem expressamente no hebraico.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. A construção mantém a metáfora tradicional “mana leite e mel” e conserva deliberadamente as mudanças de número do hebraico, esclarecidas em nota.
