base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/013.yaml
  text: And it is not with you alone that I am making this covenant and this oath[b][a],
translation:
  language: pt
  text: E não é somente com vocês que faço esta aliança[a] e este juramento[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «corto esta aliança»; «faço esta aliança» traduz em português natural a expressão idiomática hebraica.
    reason: lexical_alternative
  - marker: b
    text: Ou «e esta maldição». O termo hebraico pode designar o juramento ou a maldição vinculada a ele como sanção.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא
  choice: E não é
  rationale: Mantém a ligação com o contexto e introduz naturalmente, em português, o contraste expresso pela conjunção e pela negação.
- source_word: אִתְּכֶם לְבַדְּכֶם
  choice: somente com vocês
  rationale: 'Expressa com clareza a exclusividade negada pelo hebraico: a aliança não abrange apenas os ouvintes presentes.'
- source_word: אָנֹכִי
  choice: '[sujeito implícito em «faço»]'
  rationale: O português dispensa o pronome explícito; a primeira pessoa verbal identifica claramente o sujeito sem produzir uma ênfase artificial.
- source_word: כֹּרֵת
  choice: faço
  rationale: Verter literalmente por «corto» obscureceria a expressão idiomática hebraica «cortar uma aliança». «Faço» comunica naturalmente o ato de estabelecer a aliança.
- source_word: הַבְּרִית הַזֹּאת
  choice: esta aliança
  rationale: «Aliança» preserva o peso jurídico e teológico de בְּרִית no contexto de Deuteronômio.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: e este juramento
  rationale: «Juramento» comunica o ato solene de ratificação, enquanto a possível dimensão de maldição vinculada a ele é preservada em nota.
theological_decisions:
- issue: Sentido de אָלָה no contexto da aliança
  choice: juramento
  alternative: maldição
  rationale: O termo pode indicar tanto o juramento solene quanto a sanção de maldição ligada a ele. «Juramento» funciona bem no texto principal, sem eliminar a leitura alternativa, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva o vínculo sintático com o contexto anterior e mantém aberta, em nota, a ambiguidade de אָלָה.
