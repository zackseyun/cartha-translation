base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/026.yaml
  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: pt
  text: Então Yahweh, cuja ira ardeu contra aquela terra, trouxe sobre ela toda a maldição escrita neste livro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira ... ardeu
  rationale: Preserva a imagem vívida do idioma hebraico, no qual a ira se inflama ou arde, e continua natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּאָרֶץ הַהִוא
  choice: contra aquela terra
  rationale: Neste contexto, a preposição marca o alvo da ira; “contra” comunica com clareza a direção hostil do juízo.
- source_word: לְהָבִיא
  choice: trazendo
  rationale: O infinitivo pode indicar propósito ou resultado. O gerúndio liga naturalmente a ira ao juízo que ela ocasiona sem eliminar totalmente essa amplitude.
- source_word: עָלֶיהָ
  choice: sobre ela
  rationale: O pronome retoma “terra”, feminino em hebraico e português, mantendo de modo natural a referência gramatical.
- source_word: כָּל הַקְּלָלָה
  choice: toda a maldição
  rationale: Mantém o substantivo singular e a ideia de totalidade do hebraico; no contexto, refere-se ao conjunto integral da maldição pactual.
- source_word: הַכְּתוּבָה
  choice: escrita
  rationale: Reproduz diretamente o particípio passivo e conserva o caráter textual e jurídico da expressão.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: neste livro
  rationale: “Livro” é a tradução ampla, corrente e acessível de סֵפֶר neste contexto, sem especificar indevidamente o suporte material.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa por transliteração, evitando substituí-lo por um título e sem adotar a forma híbrida tradicional “Jeová”.
- issue: Relação expressa por לְהָבִיא
  choice: trazendo
  alternative: para trazer
  rationale: O infinitivo hebraico admite nuance de propósito ou resultado. “Trazendo” preserva uma relação relativamente aberta entre a ira de Yahweh e a aplicação da maldição, sem resolver de modo rígido a tensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção concisa. A imagem hebraica da ira que arde foi preservada; “toda a maldição” mantém o singular coletivo do original.
