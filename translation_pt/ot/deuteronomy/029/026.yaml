  naturalness: O texto é moderno e claro. A construção com gerúndio, porém, cria uma ligação sintática ambígua e pouco precisa. A redação revista permanece fluente e tem registro apropriado.
  terminology: “Yahweh”, “ira”, “maldição” e “livro” são escolhas consistentes com o hebraico e com o audit trail em inglês. “Toda a maldição” reproduz de modo válido o singular coletivo כָּל־הַקְּלָלָה.
  issues:
