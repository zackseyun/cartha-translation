revisions:
- from: Yahweh não estará disposto a perdoá-lo, pois então a ira de Yahweh e o seu ciúme arderão contra aquele homem. Toda a maldição[a] escrita neste livro pousará sobre ele, e Yahweh apagará o nome dele de sob os céus.
  to: Yahweh não estará disposto a perdoá-lo, pois então a ira de Yahweh e o seu ciúme arderão contra aquele homem. Toda a maldição[a] escrita neste livro se assentará sobre ele, e Yahweh apagará o nome dele de sob os céus.
