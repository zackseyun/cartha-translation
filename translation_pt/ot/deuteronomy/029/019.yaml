base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: pt
  text: Yahweh não estará disposto a perdoá-lo, pois então a ira de Yahweh e o seu ciúme arderão contra aquele homem. Toda a maldição[a] escrita neste livro se assentará sobre ele, e Yahweh apagará o nome dele de sob os céus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a maldição ligada a juramento”. O termo hebraico pode indicar uma maldição invocada por juramento no contexto da aliança, e não apenas uma maldição em sentido geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבֶה
  choice: não estará disposto
  rationale: Preserva a força volitiva de אבה — disposição ou consentimento — sem sugerir incapacidade de perdoar.
- source_word: סְלֹחַ לוֹ
  choice: a perdoá-lo
  rationale: סלח denota perdoar ou absolver, especialmente em contexto de aliança; “perdoá-lo” é claro e natural em português.
- source_word: כִּי אָז
  choice: pois então
  rationale: Reproduz de modo conciso tanto a função explicativa quanto a temporal da expressão hebraica.
- source_word: יֶעְשַׁן אַף יְהוָה וְקִנְאָתוֹ
  choice: a ira de Yahweh e o seu ciúme arderão
  rationale: Comunica em português corrente a imagem intensa da ira que fumega ou arde. “Ciúme” conserva o sentido direto de קנאה no contexto de fidelidade à aliança.
- source_word: בָּאִישׁ הַהוּא
  choice: contra aquele homem
  rationale: A preposição ב, em contexto de hostilidade, é naturalmente expressa por “contra”; “homem” mantém o masculino singular do hebraico.
- source_word: וְרָבְצָה בוֹ
  choice: pousará sobre ele
  rationale: רבץ descreve literalmente algo que se deita ou se instala. “Pousará sobre ele” conserva a imagem de uma maldição que vem e permanece.
- source_word: כָּל הָאָלָה
  choice: toda a maldição
  rationale: O substantivo hebraico está no singular e pode designar a maldição formal ligada a um juramento de aliança. A formulação principal é clara, e a nuance jurídica é indicada em nota.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: escrita neste livro
  rationale: סֵפֶר pode ser livro ou rolo; “livro” é natural no uso moderno e não altera o sentido.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: apagará o nome dele
  rationale: Conserva a expressão hebraica de eliminar o nome, a memória ou a continuidade de alguém.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de sob os céus
  rationale: Mantém a expressão espacial hebraica e seu sentido abrangente de remoção da terra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Imagem antropomórfica do juízo divino
  choice: “a ira de Yahweh e o seu ciúme arderão”
  alternative: “a ira de Yahweh e o seu ciúme fumegarão”
  rationale: “Arderão” é natural e vigoroso em português e preserva a imagem da ira intensamente acesa, sem formular uma teoria sobre as paixões divinas.
- issue: Referência masculina singular
  choice: “aquele homem”
  alternative: “aquela pessoa”
  rationale: O hebraico emprega uma expressão masculina singular para o indivíduo que viola a aliança; a tradução conserva essa forma.
- issue: Terminologia da maldição da aliança
  choice: “toda a maldição”, com nota sobre a dimensão de juramento
  alternative: “toda a maldição jurada” no texto principal
  rationale: A tradução principal permanece clara e direta, enquanto a nota conserva a nuance formal de אָלָה sem sobrecarregar o versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém o nome Yahweh, o masculino singular e as imagens concretas do hebraico, evitando construções excessivamente literais ou arcaicas.
