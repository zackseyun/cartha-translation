  - severity: low
    issue: «Pousará sobre ele»
    rationale: Embora defensável, «pousar» pode evocar sobretudo o movimento de uma ave. «Se assentará sobre ele» mantém de modo mais próximo e natural a figura hebraica de deitar-se ou instalar-se sobre alguém.
