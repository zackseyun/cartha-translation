    rationale: Em português, «fazer» pode ser entendido como tendo por objeto imediato «juramento», enquanto o idiomatismo hebraico é especificamente o de firmar/fazer uma aliança. «Está firmando» preserva o ato pactual e mantém a explicação literal na nota.
