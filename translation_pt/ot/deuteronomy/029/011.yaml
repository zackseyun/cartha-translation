base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: pt
  text: para que você entre na aliança de Yahweh, seu Deus, e no juramento dele[a], que Yahweh, seu Deus, está firmando com você hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e na maldição ligada ao juramento dele”. O termo hebraico pode indicar um juramento que inclui as sanções ou maldições da aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: para que você entre
  rationale: O infinitivo com לְ expressa propósito ou resultado. No contexto da aliança, עָבַר בִּבְרִית indica entrar formalmente nas obrigações da aliança, não um deslocamento físico.
- source_word: בִּבְרִית
  choice: na aliança
  rationale: בְּרִית é “aliança”; com o verbo português “entrar”, a construção natural é “entrar na aliança”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: 'O sufixo masculino singular indica posse ou relação: “seu Deus”.'
- source_word: וּבְאָלָתוֹ
  choice: e no juramento dele
  rationale: אָלָה pode designar um juramento e também carregar a ideia das maldições ou sanções que o confirmam. “Juramento” mantém o sentido amplo no texto, enquanto a nota registra a nuance sancionatória.
- source_word: כֹּרֵת
  choice: está fazendo
  rationale: כרת, literalmente “cortar”, integra a expressão idiomática hebraica para firmar ou fazer uma aliança. A forma progressiva comunica a ação cerimonial em curso.
- source_word: עִמְּךָ
  choice: com você
  rationale: Equivalência direta e natural da preposição com sufixo masculino singular.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Forma corrente e exata para a referência temporal.
theological_decisions:
- issue: Representação do nome divino na fórmula da aliança
  choice: Yahweh, seu Deus
  alternative: SENHOR, seu Deus
  rationale: O hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal na relação de aliança.
- issue: Amplitude semântica de אָלָה
  choice: juramento no texto principal, com a dimensão de maldição em nota
  alternative: maldição; juramento acompanhado de maldições
  rationale: O termo pode incluir tanto o ato juramentado quanto suas sanções. A solução evita reduzir a expressão a apenas um desses aspectos e preserva a tensão lexical.
- issue: Referente da oração relativa אֲשֶׁר ... כֹּרֵת
  choice: manter uma oração relativa capaz de abranger a fórmula coordenada da aliança e do juramento
  alternative: explicitar que somente a aliança está sendo feita
  rationale: Embora כרת seja especialmente idiomático com בְּרִית, a sintaxe permite relacionar a oração ao conjunto coordenado. A tradução não restringe desnecessariamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O singular “você” representa o destinatário coletivo tratado gramaticalmente no masculino singular. A repetição de “Yahweh, seu Deus” conserva a ênfase formal do hebraico.
