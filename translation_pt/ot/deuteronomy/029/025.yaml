base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: pt
  text: e foram servir a outros deuses e se prostraram diante deles, deuses que não conheciam e que ele não lhes havia atribuído.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que não lhes haviam sido atribuídos”. No hebraico, o sujeito do verbo singular está implícito e provavelmente se refere a Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: foram
  rationale: Preserva o sentido básico de הלך e a sequência hebraica “foram servir”, sem reduzir a ação a uma metáfora.
- source_word: וַיַּעַבְדוּ
  choice: servir
  rationale: עבד significa comumente “servir”. A escolha mantém a distinção em relação ao verbo seguinte, que descreve a prostração cultual.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É o sentido direto da expressão e corresponde ao uso característico de Deuteronômio.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: se prostraram diante deles
  rationale: Conserva a imagem física de שׁחה e comunica naturalmente, em português, o ato de reverência cultual.
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: deuses que não conheciam
  rationale: ידע pode envolver conhecimento relacional, não apenas informação; a formulação portuguesa preserva essa abertura sem explicá-la em excesso.
- source_word: וְלֹא חָלַק לָהֶם
  choice: e que ele não lhes havia designado
  rationale: חלק no qal expressa repartir, atribuir ou destinar. “Designado” é claro e natural no contexto, enquanto o pronome singular “ele” conserva o sujeito implícito mais provável.
theological_decisions:
- issue: Sujeito implícito do verbo singular חָלַק
  choice: 'Entender o sujeito implícito como Deus: “e que ele não lhes havia designado”.'
  alternative: “e que não lhes haviam sido designados” ou “e que não lhes foram atribuídos”.
  rationale: O hebraico apresenta um verbo na terceira pessoa masculina singular sem sujeito expresso. O contexto favorece Deus como agente, mas a nota registra a possibilidade de uma tradução passiva que preserve a ausência do sujeito explícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a sequência verbal do hebraico, distingue serviço de prostração e evita linguagem denominacional.
