base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: pt
  text: para que não haja entre vocês homem ou mulher, clã ou tribo, cujo coração esteja se desviando hoje de Yahweh, nosso Deus, para ir servir aos deuses daquelas nações; para que não haja entre vocês raiz que produza veneno[a] e absinto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “raiz que produza fel e absinto”. A palavra hebraica traduzida como “veneno” pode indicar fel ou uma substância ou planta venenosa.'
    reason: Registra a amplitude lexical de רֹאשׁ e a tradução tradicional sem tornar o texto principal opaco.
lexical_decisions:
- source_word: פֶּן
  choice: para que não
  rationale: Introduz a advertência contra um perigo possível. A repetição preserva a estrutura cautelar do hebraico em português corrente.
- source_word: יֵשׁ בָּכֶם
  choice: haja entre vocês
  rationale: Reproduz naturalmente a construção existencial sob a dependência de פֶּן.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: homem ou mulher
  rationale: Mantém o par explícito masculino-feminino do texto hebraico.
- source_word: מִשְׁפָּחָה
  choice: clã
  rationale: Neste contexto social e pactual, designa um grupo de parentesco mais amplo que uma família nuclear.
- source_word: שֵׁבֶט
  choice: tribo
  rationale: Refere-se aqui inequivocamente a uma unidade tribal de Israel.
- source_word: לְבָבוֹ פֹנֶה
  choice: cujo coração esteja se desviando
  rationale: A construção com particípio sugere um afastamento em curso ou incipiente; a forma portuguesa conserva essa nuance.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Mantém a imediatidade temporal e pactual do original.
- source_word: מֵעִם יְהוָה אֱלֹהֵינוּ
  choice: de Yahweh, nosso Deus
  rationale: A preposição indica afastamento da lealdade a Yahweh; o sentido de separação já está expresso por 'se desviando'.
- source_word: לָלֶכֶת לַעֲבֹד
  choice: para ir servir
  rationale: Conserva tanto o verbo de movimento quanto a finalidade, em formulação natural em português.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: os deuses daquelas nações
  rationale: Traduz diretamente a referência aos povos estrangeiros e às suas divindades.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: raiz que produza veneno e absinto
  rationale: Preserva a metáfora da raiz e o paralelismo dos dois produtos nocivos, evitando acrescentar explicitamente 'fruto', substantivo não presente no hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Alcance da imagem רֹאשׁ וְלַעֲנָה
  choice: veneno e absinto
  alternative: fel e absinto
  rationale: רֹאשׁ pode designar veneno, planta venenosa ou fel. 'Veneno' comunica o caráter nocivo sem identificar com precisão indevida a substância, enquanto a nota preserva a alternativa tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém a repetição solene da advertência hebraica, e 'vocês' expressa com clareza o plural de בָכֶם.
