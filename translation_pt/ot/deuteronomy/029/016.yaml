base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: pt
  text: e vocês viram as coisas detestáveis e os ídolos deles — de madeira e pedra, de prata e ouro — que havia entre eles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as abominações”. O termo hebraico é uma expressão forte de repulsa, usada muitas vezes para objetos de idolatria.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “ídolos” é depreciativo e talvez contenha uma nuance grosseira, semelhante a “ídolos de esterco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: e vocês viram
  rationale: O wayyiqtol qal na segunda pessoa masculina plural dá continuidade à recordação dirigida por Moisés ao povo. O pretérito perfeito é natural em português, e a conjunção mantém o encadeamento com o contexto.
- source_word: שִׁקּוּצֵיהֶם
  choice: as coisas detestáveis deles
  rationale: שִׁקּוּץ designa algo repugnante, sobretudo em contexto idólatra. “Coisas detestáveis” conserva a força avaliativa e permanece claro para leitores atuais.
- source_word: גִּלֻּלֵיהֶם
  choice: os ídolos deles
  rationale: גִּלּוּלִים é uma designação fortemente depreciativa de ídolos. “Ídolos” comunica o referente com naturalidade; a possível nuance mais grosseira é registrada em nota.
- source_word: עֵץ וָאֶבֶן
  choice: de madeira e pedra
  rationale: Os substantivos indicam naturalmente os materiais dos objetos idólatras. A preposição “de” torna essa relação clara em português.
- source_word: כֶּסֶף וְזָהָב
  choice: de prata e ouro
  rationale: A expressão dá continuidade à enumeração dos materiais. A repetição de “de” produz uma lista natural e inequívoca em português.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: que havia entre eles
  rationale: A oração relativa aponta, pelo contexto, para os objetos presentes entre os povos mencionados no versículo anterior. “Havia entre eles” evita sugerir que Israel possuía esses ídolos.
theological_decisions:
- issue: Tradução dos termos pejorativos ligados à idolatria
  choice: “coisas detestáveis” e “ídolos” no texto principal
  alternative: “abominações” e “ídolos repugnantes”
  rationale: O hebraico emprega dois termos distintos e depreciativos. A tradução mantém a distinção sem acrescentar explicações doutrinárias, enquanto as notas preservam alternativas e a intensidade lexical.
- issue: Referente de אֲשֶׁר עִמָּהֶם
  choice: “que havia entre eles”, referente aos povos mencionados anteriormente
  alternative: “que estavam com eles” ou “que lhes pertenciam”
  rationale: O contexto favorece os povos por cujas terras Israel passou. A formulação escolhida preserva a ideia de presença sem afirmar explicitamente posse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões delimitam a enumeração dos materiais e deixam claro que a oração final se refere ao conjunto dos objetos. Todos os marcadores de nota aparecem no texto principal.
