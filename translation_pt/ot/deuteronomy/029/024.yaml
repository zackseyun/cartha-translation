  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: pt
  text: 'Então dirão: “Porque abandonaram a aliança de Yahweh, o Deus de seus pais,[a] aliança que ele firmou com eles quando os tirou da terra do Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Deus de seus antepassados”. Hebraico: “o Deus de seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Então dirão
  rationale: O contexto projeta para o futuro a resposta dos povos; “então” expressa naturalmente a progressão do discurso, e “dirão” preserva o valor futuro.
- source_word: עַל אֲשֶׁר
  choice: Isso aconteceu porque
  rationale: A expressão introduz a causa da devastação mencionada no contexto. A explicitação de “isso aconteceu” torna a resposta completa e natural em português sem alterar sua relação causal.
- source_word: עָזְבוּ
  choice: abandonaram
  rationale: O verbo indica deserção deliberada da aliança, não simples afastamento; “abandonaram” comunica isso em linguagem atual.
- source_word: בְּרִית
  choice: aliança
  rationale: É o termo português consagrado para a relação vinculante estabelecida por Deus e preserva o peso bíblico da expressão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: o Deus de seus pais
  rationale: Preserva a construção hebraica e sua referência masculina à linhagem ancestral, sem neutralizá-la.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: aliança que ele firmou com eles
  rationale: O hebraico diz literalmente “cortou com eles”; “firmou uma aliança” transmite em português atual o sentido idiomático. A repetição de “aliança” evita que o relativo pareça retomar “pais”.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: quando os tirou
  rationale: A preposição com o infinitivo tem valor temporal neste contexto e remete de modo direto ao êxodo.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Preserva a formulação hebraica completa e sua ressonância narrativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” conserva o nome pessoal da aliança sem substituí-lo pelo título “SENHOR”.
- issue: Expressão patriarcal אֱלֹהֵי אֲבֹתָם
  choice: o Deus de seus pais
  alternative: o Deus de seus antepassados
  rationale: A forma hebraica é masculina e designa a linhagem ancestral. A tradução mantém “pais”, preservando a especificidade formal, enquanto a alternativa explicita o sentido coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Abandonaram” evita o arcaísmo de “desampararam” ou “deixaram”, e “firmou” comunica naturalmente o idioma hebraico de estabelecer uma aliança.
