base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: pt
  text: Quando vocês chegaram a este lugar[a], Seom, rei de Hesbom, e Ogue, rei de Basã, saíram ao nosso encontro para a batalha, e nós os derrotamos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E vocês chegaram a este lugar”. A forma narrativa hebraica pode ser entendida como simples sequência ou com sentido temporal.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “nós os golpeamos”. Em contextos militares, o verbo é frequentemente usado com o sentido de derrotar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: Quando vocês chegaram
  rationale: O wayyiqtol qal na segunda pessoa masculina plural relata um acontecimento passado dirigido ao povo. “Quando” expressa naturalmente a relação temporal com a ação seguinte; a coordenação simples também é possível.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: a este lugar
  rationale: מָקוֹם significa “lugar”, e a preposição אֶל indica aqui movimento em direção a ele.
- source_word: וַיֵּצֵא
  choice: saíram
  rationale: O singular hebraico antecede o sujeito composto “Seom... e Ogue”, uso possível pela posição do verbo. Em português, a concordância plural é natural. “Saíram” preserva o sentido básico de יצא sem acrescentar a ideia específica de marchar.
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Seom, rei de Hesbom
  rationale: Empregam-se as formas portuguesas correntes dos nomes bíblicos, com o título em aposição clara.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: e Ogue, rei de Basã
  rationale: Mantém o paralelismo com a expressão anterior e usa formas tradicionais inteligíveis em português.
- source_word: לִקְרָאתֵנוּ לַמִּלְחָמָה
  choice: ao nosso encontro para a batalha
  rationale: לִקְרָאתֵנוּ indica vir ou sair ao encontro de alguém; לַמִּלְחָמָה explicita o propósito militar. A formulação preserva ambos os elementos.
- source_word: וַנַּכֵּם
  choice: e nós os derrotamos
  rationale: O hifil de נכה com sufixo de terceira pessoa plural significa literalmente “nós os ferimos/golpeamos” e, em contexto militar, frequentemente denota derrotar. “Derrotamos” comunica o resultado sem sugerir necessariamente que cada indivíduo foi morto.
