translation:
  language: pt
  text: as grandes provações que os seus olhos viram[a], aqueles grandes sinais e maravilhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as grandes provas”. Aqui, o sentido é de testes ou provas, não de indução ao pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת
  choice: as grandes provações
  rationale: מַסּוֹת designa provas ou experiências de teste. “Provações” é natural em português e, ao contrário de “tentações”, não sugere necessariamente indução ao pecado.
- source_word: הַגְּדֹלֹת
  choice: grandes
  rationale: גָּדוֹל qualifica a magnitude e a importância das provações; “grandes” preserva a ênfase de modo natural.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: que os seus olhos viram
  rationale: A expressão hebraica menciona explicitamente os olhos, enfatizando a experiência direta da pessoa a quem Moisés se dirige; a formulação foi preservada.
- source_word: הָאֹתֹת
  choice: sinais
  rationale: אוֹת significa normalmente “sinal” e, neste contexto, refere-se aos atos divinos presenciados por Israel.
- source_word: וְהַמֹּפְתִים
  choice: e maravilhas
  rationale: מוֹפֵת forma com אוֹת a conhecida expressão “sinais e maravilhas”; “maravilhas” comunica atos extraordinários sem defini-los de maneira excessiva.
- source_word: הַגְּדֹלִים
  choice: grandes
  rationale: O adjetivo ressalta a magnitude dos sinais e das maravilhas e é reproduzido para conservar a repetição enfática do hebraico.
- source_word: הָהֵם
  choice: aqueles
  rationale: O demonstrativo retoma enfaticamente os sinais e as maravilhas mencionados, e “aqueles” preserva essa força dêitica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Conserva-se a expressão enfática “os seus olhos viram” e a repetição de “grandes”, ambas presentes no hebraico. O fragmento começa em minúscula porque o texto fornecido corresponde à continuação do versículo.
