base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: pt
  text: Yahweh os arrancou[a] da sua terra, com ira, furor e grande indignação, e os lançou em outra terra, como é neste dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “desarraigou” ou “tirou à força”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “como neste dia”; expressão que indica uma situação evidente no presente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: os arrancou
  rationale: O verbo נתשׁ expressa arrancar ou desarraigar, frequentemente evocando uma planta tirada do solo. “Os arrancou” preserva a imagem vigorosa e se encaixa naturalmente no contexto da expulsão da terra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵעַל אַדְמָתָם
  choice: de sua terra
  rationale: Neste contexto de aliança, juízo e exílio, אַדָמָה designa a terra da qual o povo foi expulso; esta formulação é clara e natural em português.
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: com ira, furor e grande indignação
  rationale: Mantém a acumulação enfática de três termos hebraicos próximos, sem reduzi-los a uma única expressão, e conserva diretamente a intensidade de גָּדוֹל, “grande”.
- source_word: וַיַּשְׁלִכֵם
  choice: e os lançou
  rationale: O verbo שלך significa lançar ou atirar. “Lançou” conserva a força da ação e mantém um registro digno.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: em outra terra
  rationale: Comunica de modo natural o deslocamento para território estrangeiro e a realidade do exílio.
- source_word: כַּיּוֹם הַזֶּה
  choice: como se vê hoje
  rationale: Reproduz o sentido idiomático da fórmula hebraica, que aponta para uma situação presente e observável, sem introduzir a ideia adicional de duração contida em “até hoje”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal da aliança, sem substituí-lo por um título.
- issue: Acumulação de termos para a ira divina
  choice: ira, furor e grande indignação
  alternative: ira, cólera e grande furor
  rationale: O hebraico empilha termos parcialmente sobrepostos para intensificar o juízo. A tradução mantém os três elementos e evita harmonizá-los em uma única palavra.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem e a progressão retórica do hebraico foram preservadas, enquanto a expressão idiomática final foi vertida de modo natural.
