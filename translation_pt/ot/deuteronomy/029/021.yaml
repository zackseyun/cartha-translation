revisions:
- from: E dirá a geração futura — os filhos de vocês que se levantarão depois de vocês — e também o estrangeiro que vier de uma terra distante, ao verem as pragas daquela terra e as doenças com que Yahweh a afligiu:[a][b]
  to: E a geração futura — os filhos de vocês que surgirão depois de vocês — e o estrangeiro que vier de uma terra distante dirão, ao verem as pragas daquela terra e as doenças com que Yahweh a afligiu:[a][b]
  rationale: A revisão ajusta a concordância verbal ao sujeito composto em português, substitui uma expressão temporal pouco idiomática por “surgirão depois de vocês” e torna a nota literal mais fiel à construção hebraica. O restante da redação é mantido por refletir adequadamente o texto-fonte e conservar um registro moderno e digno.
