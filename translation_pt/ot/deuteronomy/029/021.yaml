  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: pt
  text: E a geração futura — os filhos de vocês que surgirão depois de vocês — e o estrangeiro que vier de uma terra distante dirão, ao verem as pragas daquela terra e as doenças com que Yahweh a afligiu:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a geração posterior”. A expressão hebraica indica uma geração que virá depois da atual, não necessariamente a última geração.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “as doenças com as quais Yahweh a fez adoecer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: dirá
  rationale: O verbo hebraico está morfologicamente no singular e concorda com o primeiro núcleo do sujeito, “a geração”; o português permite manter essa concordância mesmo com o sujeito composto que se segue.
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: a geração futura
  rationale: Expressa uma geração posterior aos ouvintes sem sugerir necessariamente a geração final em sentido escatológico.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: os filhos de vocês que se levantarão depois de vocês
  rationale: Mantém a imagem hebraica de filhos que se levantam depois da geração presente; “filhos” pode designar a descendência no contexto corporativo.
- source_word: וְהַנָּכְרִי
  choice: e também o estrangeiro
  rationale: “Estrangeiro” comunica claramente alguém de fora de Israel; “também” explicita de modo natural a coordenação, sem alterar o referente.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: de uma terra distante
  rationale: Formulação natural que preserva a ideia de distância geográfica.
- source_word: וְרָאוּ
  choice: ao verem
  rationale: O perfeito com waw é entendido temporalmente em relação a “dirá”; o infinitivo flexionado preserva o plural hebraico e apresenta a visão como circunstância da fala.
- source_word: מַכּוֹת
  choice: pragas
  rationale: No contexto das maldições da aliança, o termo designa golpes ou calamidades punitivas; “pragas” é claro e adequado.
- source_word: תַּחֲלֻאֶיהָ
  choice: doenças
  rationale: Preserva a metáfora da terra adoecida e é uma expressão corrente em português.
- source_word: חִלָּה
  choice: afligiu
  rationale: O piel de חלה pode significar “tornar doente” ou “afligir”; “afligiu” conserva a causalidade sem forçar a metáfora em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּהּ
  choice: a
  rationale: O pronome retoma “terra”; com “afligir”, o objeto direto é a construção mais natural em português, embora o hebraico tenha uma preposição locativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Alcance de בְּנֵיכֶם
  choice: os filhos de vocês
  alternative: os descendentes de vocês; os filhos homens de vocês
  rationale: O masculino plural hebraico pode representar a posteridade coletivamente. “Filhos” mantém a relação familiar sem exigir que a referência se limite aos homens.
- issue: Sentido de הָאַחֲרוֹן
  choice: futura
  alternative: última
  rationale: No contexto, a expressão aponta para uma geração posterior, não necessariamente para a última geração da história; evita-se impor uma leitura escatológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o singular “dirá” para refletir a forma hebraica e a concordância com o primeiro núcleo do sujeito composto. Os travessões delimitam a aposição que identifica a geração futura.
