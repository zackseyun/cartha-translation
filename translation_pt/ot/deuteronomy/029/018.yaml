  to: 'E acontecerá que, ao ouvir as palavras deste juramento[a], ele se abençoará em seu coração, dizendo: “Terei paz, ainda que eu ande na teimosia do meu coração” — para varrer o bem regado juntamente com o sedento.[b]'
