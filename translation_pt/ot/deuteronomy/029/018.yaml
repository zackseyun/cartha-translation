    issue: Construção passiva e sujeito obscurecido no fecho
    rationale: “Para que sejam varridos o bem regado juntamente com o sedento” não tem um antecedente natural para “sejam varridos” e altera a apresentação do infinitivo לְמַעַן סְפוֹת. “Para varrer” preserva a construção verbal e evita introduzir um sujeito passivo implícito.
  - severity: low
    issue: Formulação reflexiva pouco idiomática
    rationale: “Abençoará a si mesmo no coração” é compreensível, mas “se abençoará em seu coração” é mais natural e conserva tanto o valor reflexivo de וְהִתְבָּרֵךְ quanto a interioridade expressa por בִּלְבָבוֹ.
