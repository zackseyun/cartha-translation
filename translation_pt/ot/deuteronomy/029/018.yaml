  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: pt
  text: 'E acontecerá que, ao ouvir as palavras deste juramento[a], ele se abençoará em seu coração, dizendo: “Terei paz, ainda que eu ande na teimosia do meu coração” — para varrer o bem regado juntamente com o sedento.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desta maldição”. O termo hebraico pode indicar um juramento que traz consigo uma maldição.
    reason: alternative_reading
  - marker: b
    text: Ou, possivelmente, “a terra regada juntamente com a seca”, isto é, destruir tudo sem distinção.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: juramento
  rationale: O termo pode designar um juramento que traz consigo uma maldição. “Juramento” corresponde bem à formulação pactual imediata, enquanto a nota preserva a força sancionatória de “maldição”.
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: ele abençoará a si mesmo no coração
  rationale: Preserva o sentido reflexivo do hitpael e a ironia da autoconfiança interior, sem transformá-lo numa paráfrase interpretativa.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: Terei paz
  rationale: Mantém a amplitude de שָׁלוֹם, que abrange paz, bem-estar e segurança, e soa natural em português.
- source_word: שְׁרִרוּת לִבִּי
  choice: a teimosia do meu coração
  rationale: Expressa a obstinação ou dureza da vontade em linguagem atual e clara, sem suavizar a censura do contexto.
- source_word: לְמַעַן
  choice: para que
  rationale: Preserva a relação de propósito ou resultado pretendido introduzida pela expressão hebraica, deixando aberta a tensão contextual.
- source_word: סְפוֹת
  choice: sejam varridos
  rationale: No contexto de juízo da aliança, o verbo provavelmente tem o sentido destrutivo de varrer ou eliminar, embora existam outras propostas lexicais.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: o bem regado juntamente com o sedento
  rationale: Conserva os adjetivos substantivados e a imagem difícil do hebraico, sem decidir silenciosamente que se trata necessariamente de terras ou pessoas.
theological_decisions:
- issue: Sentido da linguagem de sanção pactual em הָאָלָה
  choice: “juramento” no texto principal, com “maldição” em nota
  alternative: “maldição”
  rationale: A palavra pode indicar um juramento acompanhado de maldição. O texto principal conserva a forma do ato pactual, e a nota explicita sua possível força punitiva.
- issue: Interpretação da expressão הָרָוָה אֶת־הַצְּמֵאָה
  choice: preservar a metáfora substantivada no texto
  alternative: “a terra regada juntamente com a seca”, isto é, destruir tudo sem distinção
  rationale: A expressão é genuinamente difícil e possivelmente proverbial. A tradução evita fixar uma única interpretação e oferece em nota a leitura referente à terra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe formal de abertura preserva a continuidade do discurso pactual; o trecho final mantém deliberadamente a imagem enigmática do hebraico.
