  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente os termos centrais: “juramento”, a autobenção interior, “paz” e a obstinação do coração. No entanto, “para que sejam varridos” introduz uma construção passiva sem referente expresso e deixa de refletir claramente o infinitivo hebraico ligado ao sujeito da fala. Uma construção infinitiva ativa preserva melhor a forma e a tensão do original.'
  naturalness: O registro é em geral claro e digno. “Se abençoará em seu coração” é mais fluente em português do que “abençoará a si mesmo no coração”, mantendo o reflexivo. A revisão do fecho também elimina a passiva impessoal pouco natural.
  terminology: “Juramento” com a alternativa “maldição” em nota é uma solução equilibrada para אָלָה. “Teimosia do meu coração” comunica adequadamente a obstinação de שְׁרִרוּת. A imagem de “o bem regado ... o sedento” deve permanecer não especificada no texto, com a leitura relativa à terra na nota.
  issues:
