  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: pt
  text: 'Hoje, todos vocês estão de pé diante de Yahweh, o Deus de vocês: seus chefes, suas tribos[a], seus anciãos e seus oficiais — todos os homens de Israel[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “os chefes de suas tribos”. O hebraico permite ler “seus chefes” e “suas tribos” como itens separados da lista.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “cada homem de Israel”, expressão distributiva que abrange coletivamente todos os homens israelitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  choice: estão de pé
  rationale: O particípio nifal descreve a comunidade reunida em posição diante de Deus; “estão de pé” preserva tanto o aspecto presente quanto a imagem concreta do hebraico.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente português natural que mantém a ênfase temporal do texto.
- source_word: כֻּלְּכֶם
  choice: todos vocês
  rationale: Expressa claramente a totalidade da comunidade interpelada e reproduz o sufixo de segunda pessoa do plural.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Formulação corrente e digna para indicar presença, especialmente no contexto solene da aliança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Reproduz de modo direto o substantivo com o sufixo de segunda pessoa plural; em português, “seu” concorda com “Deus” e refere-se a “vocês”.
- source_word: רָאשֵׁיכֶם
  choice: seus chefes
  rationale: “Chefes” comunica naturalmente o sentido metafórico de “cabeças” aplicado aos líderes, sem exigir ao leitor moderno uma expressão pouco idiomática.
- source_word: שִׁבְטֵיכֶם
  choice: suas tribos
  rationale: Mantém o sentido lexical direto e a possibilidade de uma lista de grupos, sem incorporar silenciosamente a leitura alternativa “chefes de suas tribos”.
- source_word: זִקְנֵיכֶם
  choice: seus anciãos
  rationale: Termo tradicional e ainda compreensível para os líderes mais velhos da estrutura comunitária israelita.
- source_word: שֹׁטְרֵיכֶם
  choice: seus oficiais
  rationale: Representa a função administrativa sem especificá-la além do que o contexto permite.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  rationale: Conserva o substantivo masculino אִישׁ e traduz naturalmente a construção distributiva singular como um coletivo plural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o preserva como nome e evita substituí-lo por um título, sem impor ao versículo uma interpretação denominacional.
- issue: Alcance de כֹּל אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  alternative: cada homem de Israel; todo israelita; todo o Israel
  rationale: A formulação escolhida mantém a expressão masculina específica e seu valor coletivo. O versículo seguinte amplia explicitamente a descrição da assembleia, por isso esta frase não deve ser neutralizada nem usada para restringir silenciosamente o conjunto.
- issue: Relação sintática entre רָאשֵׁיכֶם e שִׁבְטֵיכֶם
  choice: seus chefes, suas tribos
  alternative: os chefes de suas tribos
  rationale: A sequência e a acentuação massorética permitem representar os termos como itens coordenados, mas a leitura idiomática “chefes de suas tribos” também é possível. A alternativa genuína é preservada em nota.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem da enumeração hebraica foi preservada. “Estão de pé” mantém a imagem concreta do particípio, e as notas registram as ambiguidades reais sem sobrecarregar o texto principal.
