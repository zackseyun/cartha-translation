  yaml_path: translation/ot/deuteronomy/029/007.yaml
  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: pt
  text: e tomamos a terra deles e a demos como herança aos rubenitas, aos gaditas e à meia tribo de Manassés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: e tomamos
  rationale: O Qal wayyiqtol de לקח expressa aqui a ação narrativa comum de tomar. “Tomamos” preserva o sentido direto sem acrescentar a força interpretativa de “conquistamos” ou “apoderamo-nos”.
- source_word: אַרְצָם
  choice: a terra deles
  rationale: אֶרֶץ com sufixo de terceira pessoa masculina plural designa o território dos reis derrotados mencionados no contexto. “A terra deles” é claro e natural em português.
- source_word: וַנִּתְּנָהּ
  choice: e a demos
  rationale: O sufixo feminino singular retoma “terra”. A construção pronominal “a demos” reproduz com concisão essa referência e mantém o sentido básico de נתן, “dar”.
- source_word: לְנַחֲלָה
  choice: como herança
  rationale: נַחֲלָה indica uma propriedade herdada ou atribuída como herança, especialmente na distribuição da terra. “Como herança” conserva essa dimensão sem tornar a frase excessivamente técnica.
- source_word: לָראוּבֵנִי
  choice: aos rubenitas
  rationale: O gentílico singular hebraico tem sentido coletivo. O plural português é a forma natural de indicar os integrantes da tribo de Rúben.
- source_word: וְלַגָּדִי
  choice: aos gaditas
  rationale: Assim como no gentílico anterior, o singular hebraico funciona coletivamente; “aos gaditas” comunica esse valor com naturalidade.
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: e à meia tribo dos manassitas
  rationale: חֲצִי שֵׁבֶט significa literalmente “meia tribo”, e הַמְנַשִּׁי é um gentílico coletivo. “Dos manassitas” preserva essa forma gentílica e produz português compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com coordenação fluente e gentílicos no plural para expressar o valor coletivo dos singulares hebraicos. Não há necessidade de nota, pois “meia tribo dos manassitas” preserva a morfologia gentílica do texto-fonte sem causar ambiguidade relevante.
