  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: pt
  text: Portanto, guardem as palavras desta aliança e cumpram-nas, para que ajam com sabedoria em tudo o que fizerem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejam bem-sucedidos” ou “prosperem” em tudo o que fizerem.'
    reason: Alternativas lexicais para תַּשְׂכִּילוּ, cujo campo semântico abrange tanto agir com sabedoria quanto alcançar êxito.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Portanto, guardem
  rationale: שׁמר, em contexto de aliança, significa guardar ou observar as obrigações assumidas. “Guardem” conserva a imagem hebraica e a força pactual; “portanto” explicita o valor inferencial do וּ no contexto.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: as palavras desta aliança
  rationale: A formulação mantém o sentido concreto de דִּבְרֵי (“palavras”), sem substituí-lo interpretativamente por “termos”, e traduz בְּרִית pela expressão portuguesa consagrada “aliança”.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: e cumpram-nas
  rationale: O pronome plural retoma “palavras”. “Cumpram-nas” expressa em português natural a ideia hebraica de fazer ou pôr em prática essas palavras, preservando a referência plural.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz adequadamente a relação de propósito ou resultado, de modo claro e corrente em português.
- source_word: תַּשְׂכִּילוּ
  choice: ajam com sabedoria
  rationale: O hifil de שׂכל pode indicar agir com discernimento e, por extensão, ser bem-sucedido ou prosperar. A redação principal preserva mais diretamente a nuance de conduta sábia, enquanto os possíveis sentidos de resultado aparecem na nota.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: em tudo o que fizerem
  rationale: Formulação idiomática que conserva a abrangência de כָּל אֲשֶׁר e delimita a esfera em que se manifesta o agir sábio ou bem-sucedido.
theological_decisions:
- issue: Natureza da consequência pactual expressa por תַּשְׂכִּילוּ
  choice: “ajam com sabedoria”, enfatizando a conduta prudente sem excluir seu bom resultado
  alternative: “sejam bem-sucedidos” ou “prosperem”, enfatizando o resultado favorável
  rationale: O verbo comporta tanto a nuance de discernimento prático quanto a de êxito decorrente desse agir. A tradução principal evita reduzir o termo a prosperidade material, e a nota preserva a legítima amplitude sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo plural “guardem” dirige-se à comunidade; “cumpram-nas” evita o literalismo pouco natural de “façam-nas” sem perder a referência às palavras da aliança.
