  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה אֶל כָּל יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אַתֶּ֣ם רְאִיתֶ֗ם אֵ֣ת כָּל אֲשֶׁר֩ עָשָׂ֨ה יְהוָ֤ה לְ/עֵֽינֵי/כֶם֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: pt
  text: 'Moisés convocou todo o Israel e lhes disse: “Vocês viram tudo o que Yahweh fez diante dos seus olhos, na terra do Egito, ao faraó, a todos os seus servos e a toda a sua terra.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra o faraó, contra todos os seus servos e contra toda a sua terra”. Neste contexto, a preposição hebraica pode indicar que os atos de Yahweh foram juízos contra eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convocou
  rationale: Neste contexto de reunião do povo, קרא tem o sentido de chamar ou convocar. “Convocou” comunica com naturalidade que Moisés reuniu Israel para falar-lhe.
- source_word: כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a designação coletiva do povo da aliança e segue de perto a forma concisa do hebraico.
- source_word: רְאִיתֶם
  choice: vocês viram
  rationale: O perfeito hebraico aponta para a experiência testemunhada pelo público. O pretérito perfeito é a forma mais natural em português, sem perder a relevância contextual dessa experiência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעֵינֵיכֶם
  choice: diante dos seus olhos
  rationale: Preserva a imagem hebraica e enfatiza que os acontecimentos foram públicos e diretamente testemunhados.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Conserva o substantivo “terra”, explicitamente presente no hebraico, sem produzir uma expressão pouco natural.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: ao faraó, a todos os seus servos e a toda a sua terra
  rationale: Reproduz a preposição ל repetida no hebraico e mantém aberta a relação semântica, deixando que o contexto indique que os atos foram juízos contra o Egito.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança, sem substituí-lo por um título.
- issue: Sentido da preposição ל diante de faraó, seus servos e sua terra
  choice: ao faraó, a todos os seus servos e a toda a sua terra
  alternative: contra o faraó, contra todos os seus servos e contra toda a sua terra
  rationale: A tradução principal conserva a estrutura hebraica e sua relativa abertura; a nota registra o sentido contextual plausível de juízo, evitando resolver silenciosamente a nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para o plural de segunda pessoa e preserva a imagem concreta “diante dos seus olhos”.
