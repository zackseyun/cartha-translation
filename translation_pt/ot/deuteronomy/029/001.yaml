  source_fidelity: 'A tradução reproduz com precisão a estrutura e o sentido do hebraico: Moisés reúne todo Israel, dirige-se a eles e recorda o que Yahweh fez no Egito ao faraó, aos seus servos e à sua terra. «Ao» preserva adequadamente a abertura semântica de ל, e a nota registra, sem impor à linha principal, a leitura contextual «contra».'
