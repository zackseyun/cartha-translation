base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: pt
  text: Eu conduzi vocês durante quarenta anos pelo deserto. Suas roupas não se gastaram enquanto vocês as usavam, e sua sandália não se gastou no seu pé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico passa do plural para o singular na oração final; literalmente: “e sua sandália não se gastou de sobre o seu pé”. O singular pode dirigir-se a Israel como um todo coletivo ou ter sentido distributivo, referindo-se a cada pessoa.'
    reason: Preserva e explica a mudança de número gramatical do texto-fonte.
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: Eu conduzi
  rationale: A forma causativa de הלך, com sujeito na primeira pessoa, descreve o ato de fazer o povo caminhar; “conduzi” expressa de modo natural a orientação divina.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: A preposição “durante” torna explícito em português o valor de duração da expressão hebraica, sem acrescentar conteúdo.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: מִדְבָּר designa a região árida e inóspita da peregrinação; “pelo deserto” combina naturalmente com o verbo de movimento e preserva o sentido contextual.
- source_word: שַׂלְמֹתֵיכֶם
  choice: suas roupas
  rationale: O termo plural refere-se de modo amplo às peças de vestuário; “roupas” é atual, claro e não restringe indevidamente o referente.
- source_word: בָּלוּ / בָלְתָה
  choice: não se gastaram / não se gastou
  rationale: בלה descreve roupas e calçados que se deterioram pelo uso; “gastar-se” é concreto e idiomático em português.
- source_word: מֵעֲלֵיכֶם
  choice: sobre vocês
  rationale: Preserva a imagem hebraica das roupas enquanto estavam sobre o povo, embora “enquanto vocês as usavam” fosse uma formulação mais idiomática e interpretativa.
- source_word: נַעַלְךָ
  choice: sua sandália
  rationale: נַעַל indica o calçado típico do contexto antigo. Mantém-se o singular da segunda pessoa presente no hebraico.
- source_word: מֵעַל רַגְלֶךָ
  choice: no seu pé
  rationale: A expressão hebraica é literalmente “de sobre o seu pé”; com “gastar-se”, o português natural requer “no seu pé”.
theological_decisions:
- issue: Mudança do plural para o singular na referência aos destinatários
  choice: Manter o plural na primeira oração e o singular na oração final
  alternative: 'Uniformizar no plural: “suas sandálias não se gastaram nos seus pés”'
  rationale: O hebraico passa de sufixos plurais em “suas roupas/sobre vocês” para sufixos masculinos singulares em “sua sandália/seu pé”. A tradução conserva essa mudança, que pode tratar Israel como uma unidade coletiva ou funcionar distributivamente, sem decidir entre essas possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” comunica com clareza o plural; a mudança deliberada para “sua/seu” conserva o singular hebraico na oração final. A formulação mantém certo grau de literalidade na imagem “sobre vocês”, sem sacrificar a compreensão.
