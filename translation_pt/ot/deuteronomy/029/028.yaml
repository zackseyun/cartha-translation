base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: pt
  text: As coisas ocultas[a] pertencem ao SENHOR, nosso Deus, mas as coisas reveladas pertencem a nós e a nossos filhos[b] para sempre, para que cumpramos todas as palavras desta lei.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “secretas”.'
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico massorético traz pontos extraordinários sobre as palavras traduzidas por “a nós e a nossos filhos”. O significado exato dessa antiga marcação é incerto.
    reason: textual_note
  - marker: c
    text: “Lei” também pode ser traduzida por “instrução”; em Deuteronômio, o termo se refere ao ensino da aliança que Moisés apresenta a Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: as coisas ocultas
  rationale: O particípio passivo de סתר é usado como substantivo plural e designa aquilo que está escondido do conhecimento humano. “Ocultas” preserva a ideia verbal sem sugerir necessariamente mistérios esotéricos.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: pertencem ao SENHOR, nosso Deus
  rationale: A preposição לְ indica posse ou pertencimento. O nome divino יהוה é representado pela forma portuguesa tradicional “SENHOR”, em versaletes, e אֱלֹהֵינוּ por “nosso Deus”.
- source_word: וְהַנִּגְלֹת
  choice: mas as coisas reveladas
  rationale: O particípio passivo de גלה forma um paralelo direto com “as coisas ocultas”. Embora וְ normalmente signifique “e”, “mas” expressa naturalmente o contraste presente entre as duas orações.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: pertencem a nós e a nossos filhos
  rationale: O verbo “pertencem” está implícito no hebraico e é repetido em português para manter claro o paralelismo. בנים, neste contexto de continuidade da aliança, abrange os filhos e descendentes.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressão idiomática que comunica duração permanente, vertida de modo direto e natural.
- source_word: לַעֲשׂוֹת
  choice: para que cumpramos
  rationale: O infinitivo com לְ expressa finalidade. “Cumpramos” comunica aqui não apenas realizar, mas observar na prática as determinações reveladas, sem acrescentar uma explicação doutrinária.
- source_word: אֵת כָּל דִּבְרֵי
  choice: todas as palavras de
  rationale: A tradução mantém o sentido concreto de דִּבְרֵי, “palavras”, preservando a ênfase nas determinações específicas da aliança.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: desta lei
  rationale: תּוֹרָה pode significar “instrução”, mas em Deuteronômio designa a instrução pactual e legal apresentada por Moisés. “Lei” é clara, reconhecível e adequada ao contexto, enquanto a alternativa é registrada em nota.
theological_decisions:
- issue: Alcance das “coisas ocultas” e das “coisas reveladas”
  choice: Manter o contraste geral entre o que pertence exclusivamente a Deus e a revelação confiada a Israel para ser obedecida.
  alternative: Entender a frase como um princípio abrangente sobre todos os mistérios divinos ou, de modo mais restrito, apenas sobre as bênçãos e maldições imediatas da aliança.
  rationale: O hebraico não define de forma exaustiva as duas categorias. A tradução conserva essa abertura e deixa que o contexto de Deuteronômio oriente a interpretação sem restringi-la ou ampliá-la indevidamente.
- issue: Valor de לַעֲשׂוֹת
  choice: Expressar finalidade por “para que cumpramos”.
  alternative: Traduzir de maneira mais formal como “para fazer”.
  rationale: A construção relaciona a revelação à obediência prática. A formulação escolhida torna essa finalidade clara em português sem resolver além do texto a relação entre revelação e responsabilidade humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do hebraico foi preservada, e termos técnicos foram evitados no corpo do versículo. A pontuação extraordinária do texto massorético foi registrada em nota sem atribuir-lhe uma interpretação incerta.
