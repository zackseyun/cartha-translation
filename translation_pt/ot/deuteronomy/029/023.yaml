base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: pt
  text: 'E todas as nações dirão: “Por que Yahweh fez isso a esta terra? Por que tamanha ira ardente?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Por que Yahweh agiu assim com esta terra? Por que esta grande intensidade de ira?”'
    reason: Registra uma formulação mais formal da expressão hebraica, incluindo a construção intensiva חֳרִי הָאַף, sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: E ... perguntarão
  rationale: Embora אָמַר signifique literalmente “dizer”, a fala introduz perguntas diretas; “perguntarão” é natural em português e explicita a função contextual. O perfeito com waw, neste contexto preditivo da aliança, é adequadamente expresso pelo futuro.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: Preserva o alcance coletivo e o sentido usual de povos estrangeiros que observam o juízo sobre a terra.
- source_word: עַל מֶה
  choice: Por que
  rationale: A expressão idiomática pergunta pela causa; “Por que” é a equivalência portuguesa mais direta e natural.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Yahweh fez isso
  rationale: כָּכָה significa “assim/deste modo”; no português corrente, “fez isso” retoma naturalmente a devastação descrita no contexto, sem alterar o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לָאָרֶץ הַזֹּאת
  choice: a esta terra
  rationale: אָרֶץ designa aqui a terra da aliança submetida a juízo. A regência de “fazer isso a” comunica naturalmente o ל hebraico.
- source_word: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: Por que tamanha fúria ardente?
  rationale: “Tamanha” reúne a força de הַגָּדוֹל הַזֶּה (“esta tão grande”), enquanto “fúria ardente” preserva a metáfora de calor de חֳרִי e o sentido idiomático de ira em אַף.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal e corresponde à transliteração adotada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Tamanha fúria ardente” mantém a intensidade e a imagem térmica do hebraico. O marcador [a] aparece no texto principal.
