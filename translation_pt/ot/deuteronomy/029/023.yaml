  source_fidelity: A tradução preserva a estrutura interrogativa dupla, o futuro contextual, «todas as nações», o nome Yahweh e a imagem de ardor ligada à ira. Contudo, אָמְרוּ significa «dirão», não «perguntarão»; as perguntas são o conteúdo da fala, mas o verbo não deve ser substituído. «Fúria» é possível, porém «ira» corresponde mais diretamente a אַף neste idiomatismo e ao registro do contexto de juízo.
  naturalness: «E todas as nações dirão» é natural e mantém a ligação discursiva. «Por que Yahweh fez isso a esta terra?» é compreensível e conserva a construção causal e o alvo da ação. «Por que tamanha ira ardente?» é fluente, digno e retém tanto a grandeza demonstrativa quanto a metáfora térmica.
  terminology: «Yahweh» está correto para o Tetragrama. «Ira» é preferível a «fúria» como equivalente bíblico direto de אַף, e «ardente» traduz adequadamente חֳרִי.
