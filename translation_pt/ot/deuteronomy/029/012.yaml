base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: pt
  text: para que hoje ele o estabeleça como povo para si[a] e ele seja o seu Deus, conforme lhe falou e conforme jurou aos seus pais[b], a Abraão, a Isaque e a Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “como seu povo”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seus pais”; isto é, os patriarcas Abraão, Isaque e Jacó.'
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade do ingresso na aliança e é uma formulação natural em português.
- source_word: הָקִים אֹתְךָ הַיּוֹם
  choice: hoje ele estabeleça você
  rationale: O hifil de קום indica fazer permanecer ou estabelecer em uma condição de aliança; o singular preserva o tratamento coletivo de Israel no hebraico.
- source_word: לוֹ לְעָם
  choice: como povo para si
  rationale: Mantém tanto a condição de Israel como povo quanto a ideia de pertencimento expressa por לוֹ, sem acrescentar um possessivo não explícito.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: e ele seja o seu Deus
  rationale: Reproduz de modo idiomático a fórmula da aliança. O pronome explícito mantém a ênfase de וְהוּא.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: conforme lhe falou
  rationale: Preserva o sentido básico de דבר e evita convertê-lo em 'prometeu', pois o juramento é mencionado separadamente.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: e conforme jurou
  rationale: נשבע designa explicitamente o ato de jurar.
- source_word: לַאֲבֹתֶיךָ
  choice: aos seus pais
  rationale: O masculino plural refere-se especificamente aos patriarcas nomeados em seguida, não a antepassados indistintos.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: a Abraão, a Isaque e a Jacó
  rationale: Conserva os três destinatários do juramento; a preposição repetida antes de cada nome no hebraico pode ser representada naturalmente pela coordenação portuguesa.
theological_decisions:
- issue: Formulação da aliança
  choice: como povo para si ... o seu Deus
  alternative: como seu povo ... Deus para você
  rationale: A redação conserva a reciprocidade da fórmula da aliança e, ao mesmo tempo, mantém a nuance formal de לְעָם לוֹ.
- issue: Identidade dos pais
  choice: seus pais
  alternative: seus antepassados
  rationale: Abraão, Isaque e Jacó são explicitamente identificados, de modo que o termo tem referência patriarcal específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular “você/seu” preserva o tratamento coletivo singular dirigido a Israel; “Isaque” segue a forma bíblica corrente no português brasileiro.
