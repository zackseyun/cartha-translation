  verdict: revise
  source_fidelity: A tradução preserva a construção final de לְמַעַן, o valor de estabelecimento pactual de הָקִים, a pertença expressa em לוֹ לְעָם, a fórmula da aliança e a referência específica aos patriarcas. A forma explícita «ele» representa adequadamente o sujeito וְהוּא, sem exigir a intensificação «ele mesmo».
  naturalness: «Estabeleça você como povo» é compreensível, mas pouco idiomático no português atual, sobretudo em registro bíblico moderno. «O estabeleça como povo» conserva o singular coletivo hebraico e soa mais natural e solene. A nota sobre «pais» deve ser ancorada no termo que explica, não no fim do versículo.
  terminology: «Povo para si», «seu Deus», «pais», Abraão, Isaque e Jacó são escolhas corretas e adequadas ao registro. «Isaque» é a forma bíblica corrente e amplamente reconhecível em português brasileiro.
