  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: pt
  text: mas com quem está aqui conosco hoje, em pé diante de Yahweh, nosso Deus, e com quem não está aqui conosco hoje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os que não estão aqui conosco hoje”. A expressão pode se referir a israelitas ausentes da assembleia, às gerações futuras ou a ambos.'
    reason: Preserva a amplitude do referente e registra a alternativa plural sem decidir entre as interpretações possíveis.
lexical_decisions:
- source_word: כִּי
  choice: mas
  rationale: No contexto, a partícula dá continuidade ao contraste iniciado pela negação do versículo anterior (“não somente com vocês”); por isso, a conjunção adversativa é mais adequada do que uma causal.
- source_word: אֶת אֲשֶׁר
  choice: com quem
  rationale: A preposição “com” é recuperada da fórmula de aliança do versículo anterior. “Quem” transmite de modo natural em português a referência pessoal ampla e distributiva.
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ
  choice: está aqui conosco
  rationale: O verbo existencial, junto de “aqui”, indica presença na assembleia; “está aqui conosco” é natural e mantém a nuance relacional de עִם.
- source_word: עֹמֵד
  choice: está
  rationale: Embora o particípio signifique literalmente “em pé”, neste contexto descreve a presença dos participantes perante Deus. Em português corrente, “está aqui” evita uma formulação rígida sem perder o sentido contextual.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente moderno e direto, repetido nas duas orações como no hebraico.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa com naturalidade tanto a relação espacial quanto a solenidade da assembleia da aliança.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Tradução direta da forma com sufixo possessivo, preservando a fórmula pactual.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ
  choice: e com quem não está
  rationale: Espelha a primeira oração e mantém a negação existencial sem interpretar “não está” como simples ausência física.
theological_decisions:
- issue: Abrangência dos participantes da aliança que “não estão aqui conosco hoje”
  choice: Manter o referente aberto, sem identificar um grupo específico.
  alternative: Especificar israelitas ausentes, gerações futuras ainda não nascidas, ou ambos.
  rationale: O hebraico não define quem são essas pessoas. A formulação preserva deliberadamente a amplitude e a tensão interpretativa do texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção “com quem” evita marcação de gênero e conserva o caráter abrangente do hebraico; “Yahweh” mantém o nome divino.
