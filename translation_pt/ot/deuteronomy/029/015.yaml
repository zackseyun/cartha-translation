lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que fundamenta a declaração anterior, preservando de modo natural o valor causal do hebraico.
- source_word: יְדַעְתֶּם
  choice: vocês sabem
  rationale: O perfeito hebraico aponta para um conhecimento presente adquirido pela experiência passada; o presente é idiomático em português.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: como vivemos
  rationale: A construção indica aquilo que os ouvintes conhecem acerca da permanência no Egito. Esta formulação comunica naturalmente as circunstâncias dessa vida sem acrescentar uma interpretação específica.
- source_word: יָשַׁבְנוּ
  choice: vivemos
  rationale: ישׁב pode significar morar, habitar ou viver. “Vivemos” é corrente e adequado ao contexto de permanência no Egito.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: na terra do Egito
  rationale: Mantém a expressão hebraica tradicional sem deixar de ser clara em português moderno.
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: e como passamos
  rationale: Expressa de modo idiomático a experiência de atravessar, sem interpretar o verbo como referência necessária a sofrimento ou provação.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: pelo meio das nações
  rationale: Combina o sentido de movimento de עבר com o valor espacial de בקרב, “no meio de” ou “entre”.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Representa o sentido político-étnico geral de גּוֹיִם sem importar o uso posterior de “gentios”.
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: pelas quais vocês passaram
  rationale: Preserva a referência direta à jornada dos ouvintes e também a repetição enfática do verbo hebraico.
