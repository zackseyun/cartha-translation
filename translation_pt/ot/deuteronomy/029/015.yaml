  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: pt
  text: Pois vocês sabem como vivemos na terra do Egito e como passamos pelo meio das nações pelas quais vocês passaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o que atravessamos entre as nações pelas quais vocês passaram”. A construção hebraica admite uma tradução mais literal, embora o texto principal expresse o sentido de maneira mais natural.'
