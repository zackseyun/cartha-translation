base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: pt
  text: Toda a sua terra é enxofre e sal[a], uma desolação ardente; não é semeada, não produz brotos, e nela não cresce planta alguma, como na destruição de Sodoma e Gomorra, Admá e Zeboim, as quais Yahweh destruiu na sua ira e no seu furor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «enxofre e sal, uma queima». «Enxofre» é a designação moderna e clara; «brimstone» é uma opção tradicional em inglês, sem equivalente português igualmente necessário.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: Enxofre e sal
  rationale: Tradução direta e atual das duas substâncias, cuja associação evoca esterilidade e devastação.
- source_word: שְׂרֵפָה כָל אַרְצָהּ
  choice: uma terra queimada, é toda a sua extensão
  rationale: O substantivo שְׂרֵפָה descreve queima ou condição queimada. A formulação preserva a oração nominal hebraica e comunica o estado devastado de toda a terra.
- source_word: לֹא תִזָּרַע וְלֹא תַצְמִחַ
  choice: não é semeada, não produz brotos
  rationale: Mantém, respectivamente, o passivo de זרע e o sentido causativo de צמח, com a terra como referente contínuo.
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: e nenhuma planta cresce nela
  rationale: עֵשֶׂב pode designar erva ou vegetação; 'planta' é amplo e natural neste quadro de esterilidade total.
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  choice: como na destruição ... que ... destruiu
  rationale: Em português, 'destruição/destruiu' expressa naturalmente a catástrofe indicada pelo substantivo e pelo verbo cognatos, preservando a correspondência lexical.
- source_word: סְדֹם וַעֲמֹרָה אַדְמָה וּצְבֹיִים
  choice: Sodoma e Gomorra, Admá e Zeboim
  rationale: Emprega as formas portuguesas reconhecíveis dos quatro topônimos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: na sua ira e no seu furor
  rationale: Preserva os dois termos intensificadores para a indignação divina em linguagem portuguesa digna e corrente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o tetragrama como nome próprio; 'Yahweh' preserva essa função e evita substituí-lo por um título.
- issue: Agência divina na destruição das cidades
  choice: que Yahweh destruiu na sua ira e no seu furor
  alternative: que foram destruídas na ira divina
  rationale: Mantém a agência explícita de Yahweh e os dois termos hebraicos relativos à ira, sem atenuar a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. A coordenação foi mantida para reproduzir a acumulação retórica do hebraico; os topônimos seguem formas portuguesas usuais.
