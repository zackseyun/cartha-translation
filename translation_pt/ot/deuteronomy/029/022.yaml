revisions:
- from: Enxofre e sal, uma terra queimada, é toda a sua extensão; não é semeada, não produz brotos, e nenhuma planta cresce nela, como na destruição de Sodoma e Gomorra, Admá e Zeboim, que Yahweh destruiu na sua ira e no seu furor.
  to: Toda a sua terra é enxofre e sal[a], uma desolação ardente; não é semeada, não produz brotos, e nela não cresce planta alguma, como na destruição de Sodoma e Gomorra, Admá e Zeboim, as quais Yahweh destruiu na sua ira e no seu furor.
  rationale: A revisão substitui a construção inicial defeituosa por uma predicação portuguesa clara de «toda a sua terra», preservando os três elementos descritivos do hebraico. «Desolação ardente» expressa a condição de devastação por fogo associada a שְׂרֵפָה. A relativa foi ajustada para explicitar seu antecedente plural. A nota foi mantida no ponto de «enxofre e sal», mas formulada para ser útil ao leitor em português.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:07:25Z'
review_pass:
  verdict: revise
  source_fidelity: A sequência de esterilidade, os quatro topônimos, a agência explícita de Yahweh e a dupla expressão de ira são transmitidos com fidelidade. Contudo, a primeira oração do rascunho é gramaticalmente inadequada e não exprime com clareza a predicação hebraica que caracteriza toda a terra como enxofre, sal e devastação ardente.
  naturalness: «Enxofre e sal, uma terra queimada, é toda a sua extensão» é pouco natural e apresenta desacordo sintático; «sua extensão» também é uma formulação abstrata e desnecessária para אַרְצָהּ, «sua terra». A reformulação torna a descrição inteligível e mantém seu caráter cumulativo.
  terminology: «Enxofre», «sal», «Yahweh», «ira» e «furor» são escolhas adequadas. «Desolação ardente» comunica de modo natural o substantivo שְׂרֵפָה no quadro de uma terra devastada, sem reduzir a imagem de fogo a uma ação pontual.
  issues:
  - severity: medium
    issue: Construção inicial defeituosa
    rationale: O sujeito plural «Enxofre e sal» é seguido de «é», e a aposição «uma terra queimada» não se integra de maneira clara à oração. Além disso, «é toda a sua extensão» não é uma maneira natural de predicar a devastação de toda a terra.
  - severity: low
    issue: Referente pouco claro da relativa
    rationale: «que Yahweh destruiu» pode ser entendido corretamente, mas «as quais» deixa explícito que a relativa se refere às quatro cidades, não à «destruição».
  revised_text: Toda a sua terra é enxofre e sal[a], uma desolação ardente; não é semeada, não produz brotos, e nela não cresce planta alguma, como na destruição de Sodoma e Gomorra, Admá e Zeboim, as quais Yahweh destruiu na sua ira e no seu furor.
  revised_footnotes:
