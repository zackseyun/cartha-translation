reference: Deuteronomy 29:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: pt
  text: Mas, até hoje, Yahweh não deu a vocês um coração para conhecer, olhos para ver nem ouvidos para ouvir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Yahweh não deu a vocês um coração para conhecer, nem olhos para ver, nem ouvidos para ouvir, até hoje.”'
    reason: Alternativa que preserva de modo mais estritamente formal a conjunção inicial e a posição final da expressão temporal.
lexical_decisions:
- source_word: וְלֹא
  choice: Mas ... não
  rationale: A conjunção dá continuidade ao discurso e, no contexto, contrasta esta declaração com aquilo que Israel viu; “mas” expressa naturalmente essa força adversativa.
- source_word: נָתַן
  choice: não deu
  rationale: O perfeito hebraico descreve a ação como realizada, e a expressão “até hoje” deixa clara a relevância contínua. O pretérito perfeito é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לֵב לָדַעַת
  choice: um coração para conhecer
  rationale: Preserva tanto a imagem antropológica de לֵב, que abrange entendimento e disposição interior, quanto o sentido direto de ידע.
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: olhos para ver
  rationale: Mantém a imagem concreta e o paralelismo hebraico; em português, a enumeração negativa dispensa repetir a conjunção antes deste segundo elemento.
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: nem ouvidos para ouvir
  rationale: “Nem” conclui de modo idiomático a enumeração sob a negação e preserva a expressão bíblica de percepção auditiva.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente português corrente que expressa a persistência da situação até o momento do discurso.
theological_decisions:
- issue: Ação divina na falta de entendimento de Israel
  choice: A tradução afirma diretamente que Yahweh não lhes deu coração, olhos e ouvidos capazes de conhecer, ver e ouvir.
  alternative: Entender a declaração em sentido permissivo, como se Yahweh apenas não os tivesse habilitado ou permitido alcançar entendimento.
  rationale: O hebraico atribui explicitamente a Yahweh o ato de não dar. A tradução não suaviza essa atribuição nem tenta resolver a tensão entre ação divina e responsabilidade humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem de “até hoje” foi antecipada para fluidez e para deixar claro que a expressão temporal abrange toda a série; a nota registra uma ordem mais próxima do hebraico.
