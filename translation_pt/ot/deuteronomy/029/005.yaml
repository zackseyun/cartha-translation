  text: לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: pt
  text: Vocês não comeram pão nem beberam vinho nem bebida forte[a], para que vocês soubessem que eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bebida intoxicante”. O termo hebraico refere-se amplamente a bebida alcoólica fermentada e forte, não necessariamente a uma bebida específica.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém o sentido concreto e básico do hebraico; embora o termo possa às vezes significar alimento em geral, aqui contrasta naturalmente com vinho e outra bebida fermentada.
- source_word: אֲכַלְתֶּם / שְׁתִיתֶם
  choice: não comeram / nem beberam
  rationale: Os perfeitos hebraicos recapitulam a experiência passada de Israel. O pretérito perfeito é natural em português e a construção com “nem” liga com clareza as duas negações.
- source_word: יַיִן
  choice: vinho
  rationale: É o equivalente lexical direto e adequado ao contexto.
- source_word: שֵׁכָר
  choice: bebida fermentada
  rationale: O termo designa uma bebida alcoólica fermentada, distinta do vinho, sem identificar necessariamente uma bebida específica. “Bebida forte” poderia sugerir destilados modernos, que não são o referente histórico mais provável.
- source_word: לְמַעַן תֵּדְעוּ
  choice: para que soubessem
  rationale: Expressa de modo natural a finalidade ou o resultado pretendido indicado por לְמַעַן, sem eliminar a possível sobreposição entre propósito e resultado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Reproduz claramente a relação possessiva no plural e tem leitura natural no português brasileiro contemporâneo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Força de לְמַעַן na relação entre a privação e o conhecimento de Deus
  choice: para que soubessem
  alternative: de modo que soubessem
  rationale: A formulação conserva a finalidade expressa no hebraico, sem desenvolver uma explicação teológica que o versículo não explicita.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “vocês” apenas na locução possessiva “de vocês”, evitando tanto a ambiguidade de “seu Deus” quanto o regionalismo de “vosso Deus”. A colocação do marcador junto a “bebida fermentada” corrige sua associação lexical: a nota explica שֵׁכָר, não “pão”.'
