  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: pt
  text: E Yahweh o separará de todas as tribos de Israel para a desgraça, conforme todas as maldições da aliança[a] que está escrita neste livro da lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “maldições de juramento da aliança”. O termo hebraico pode se referir especificamente às maldições da aliança invocadas por juramento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: o separará
  rationale: O hifil de בדל com sufixo masculino singular indica fazer alguém ficar separado ou apartado. “O separará de todas as tribos” preserva o sentido básico e se liga naturalmente ao complemento hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino YHWH, preservando seu caráter de nome próprio.
- source_word: לְרָעָה
  choice: para a desgraça
  rationale: Neste contexto, רָעָה designa um resultado danoso de juízo, não maldade moral. “Desgraça” comunica ruína punitiva de modo natural em português.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: de todas as tribos de Israel
  rationale: A preposição מִן marca a separação do indivíduo em relação ao conjunto das tribos de Israel.
- source_word: כְּכֹל
  choice: conforme todas
  rationale: 'כְּ indica correspondência: a desgraça se dará em conformidade com as sanções registradas.'
- source_word: אָלֹות
  choice: maldições
  rationale: Em contexto de aliança, אָלָה refere-se às maldições sancionadoras vinculadas a juramento. “Maldições” é claro no texto principal; a nuance de juramento é preservada em nota.
- source_word: הַבְּרִית
  choice: da aliança
  rationale: בְּרִית designa aqui a aliança formal entre Yahweh e Israel.
- source_word: הַכְּתוּבָה
  choice: escritas
  rationale: O particípio passivo feminino singular concorda gramaticalmente com אָלֹות no hebraico consonantal vocalizado, e o plural em português concorda naturalmente com “maldições”.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: neste livro da lei
  rationale: סֵפֶר pode ser livro ou rolo; “livro” é a formulação bíblica corrente e compreensível. תּוֹרָה refere-se aqui ao corpo legal da aliança.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” é uma transliteração amplamente reconhecida e não o substitui por um título.
- issue: Sentido do juízo em לְרָעָה
  choice: para a desgraça
  alternative: para o mal
  rationale: O contexto é o castigo decorrente das maldições da aliança. A escolha evita sugerir que Yahweh destina a pessoa à maldade moral, sem enfraquecer o caráter punitivo.
- issue: Nuance pactual de אָלוֹת
  choice: maldições da aliança, com nota sobre juramento
  alternative: maldições de juramento da aliança
  rationale: A forma mais breve e natural fica no texto principal, enquanto a nota conserva a associação lexical entre maldição e juramento sem resolver excessivamente a nuance.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A ordem mantém clara a separação do indivíduo do conjunto das tribos antes de indicar seu destino punitivo.
