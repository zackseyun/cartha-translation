  yaml_path: translation/ot/deuteronomy/029/010.yaml
  text: your little ones[a], your wives, and the sojourner who is in the midst of your camp, from the one who chops your wood to the one who draws your water[b],
translation:
  language: pt
  text: suas crianças pequenas[a], suas esposas e o estrangeiro residente que está no meio do seu acampamento, desde aquele que corta a sua lenha até aquele que tira a sua água[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seus pequeninos». O termo hebraico se refere especialmente a crianças pequenas ou a dependentes.
    reason: lexical_alternative
  - marker: b
    text: A expressão «desde ... até» abrange todos os níveis da comunidade, inclusive os que realizam esses trabalhos.
    reason: cultural_clarification
lexical_decisions:
- source_word: טַפְּכֶם
  choice: as suas crianças
  rationale: טַף designa especialmente crianças pequenas e, por extensão, os pequenos ou dependentes. “Crianças” é natural e claro em português, sem ampliar o sentido para toda a descendência.
- source_word: נְשֵׁיכֶם
  choice: as suas mulheres
  rationale: Neste contexto de assembleia, נָשִׁים com sufixo possessivo se refere naturalmente às mulheres/esposas dos destinatários. “Mulheres” preserva a formulação coletiva e é corrente em português.
- source_word: וְגֵרְךָ
  choice: e o estrangeiro residente
  rationale: גֵּר é o estrangeiro que vive integrado à comunidade, não um simples visitante. “Estrangeiro residente” explicita essa condição social e jurídica, mantendo o singular coletivo do hebraico.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: que está no meio do seu acampamento
  rationale: A tradução representa explicitamente אֲשֶׁר e conserva tanto a localização espacial de בְּקֶרֶב quanto a inclusão do estrangeiro na comunidade reunida.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: desde aquele que corta a sua lenha
  rationale: A construção מִן...עַד apresenta uma extensão inclusiva. A forma verbal “aquele que corta” conserva o valor participial de חֹטֵב e soa natural em português.
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: até aquele que tira a sua água
  rationale: שֹׁאֵב descreve quem retira água de uma fonte ou poço. “Tira a sua água” é idiomático e mantém o paralelismo com o corte da lenha.
theological_decisions:
- issue: Alcance social da assembleia da aliança
  choice: O texto inclui explicitamente diferentes grupos da comunidade, entre eles o estrangeiro residente e os trabalhadores associados a tarefas servis.
  alternative: Restringir a enumeração aos israelitas étnicos ou entender os trabalhadores apenas como classes metafóricas.
  rationale: O sentido direto do hebraico apresenta uma enumeração abrangente das pessoas reunidas. A tradução mantém essa amplitude social sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a estrutura enumerativa do hebraico e o singular coletivo em “estrangeiro residente”. Os marcadores [a] e [b] aparecem no texto principal.
