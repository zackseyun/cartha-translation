  text: לֹא תַסְגִּ֥יר עֶ֖בֶד אֶל אֲדֹנָ֑י/ו אֲשֶׁר יִנָּצֵ֥ל אֵלֶ֖י/ךָ מֵ/עִ֥ם אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a slave who has escaped from his master to you[a].
translation:
  language: pt
  text: Não entregue ao seu senhor o escravo que tenha fugido do seu senhor para junto de você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. O termo hebraico pode designar servo ou escravo; aqui se usa “escravo” porque a sujeição da pessoa a um senhor é central à lei.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: entregue
  rationale: O hifil de סגר significa aqui entregar alguém ao controle de outra pessoa. “Entregar” é natural em português e conserva a força jurídica da proibição.
- source_word: עֶבֶד
  choice: escravo
  rationale: Embora o termo também possa designar um servo, neste contexto a sujeição a um senhor e a possibilidade de devolução tornam central a condição de escravidão.
- source_word: אֶל אֲדֹנָיו
  choice: ao seu senhor
  rationale: Neste contexto social e jurídico, אָדוֹן indica aquele sob cuja autoridade o escravo estava. “Senhor” expressa essa relação sem sugerir um título divino.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: que tiver fugido
  rationale: O nifal de נצל pode significar ser livrado ou escapar. Aqui, a fuga do escravo é o sentido contextual mais provável; o futuro composto ajusta a relação temporal à proibição em português.
- source_word: אֵלֶיךָ
  choice: e procurado refúgio junto a você
  rationale: A expressão hebraica indica movimento em direção ao destinatário. Em associação com נצל, esta formulação comunica naturalmente que a pessoa escapou para junto dele, sem pressupor que ele tenha efetuado o resgate.
- source_word: מֵעִם אֲדֹנָיו
  choice: do seu senhor
  rationale: מֵעִם assinala afastamento da companhia ou domínio do senhor; “do seu senhor” é a equivalência idiomática em português.
theological_decisions:
- issue: Condição social expressa por עֶבֶד
  choice: escravo
  alternative: servo
  rationale: A lei trata de uma pessoa sujeita à autoridade de um senhor, da qual fugiu e à qual não deve ser devolvida. “Escravo” torna explícita a condição de sujeição central ao texto, enquanto a nota preserva a amplitude lexical do hebraico.
- issue: Sentido do nifal יִנָּצֵל
  choice: tiver fugido
  alternative: tiver sido livrado
  rationale: O contexto favorece a ideia de escapar do senhor, mas o nifal admite a noção de ser livrado. A tradução adota o sentido contextual sem acrescentar um agente libertador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A forma singular “você” reflete o destinatário singular hebraico; “junto a você” evita a possível leitura instrumental de “por você”.
