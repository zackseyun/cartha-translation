  terminology: “Nascimento ilegítimo” é uma solução prudente para מַמְזֵר, sem usar o termo moderno e pejorativo “bastardo” como texto principal. “Assembleia de Yahweh” e “Yahweh” refletem adequadamente o hebraico e as decisões do projeto.
