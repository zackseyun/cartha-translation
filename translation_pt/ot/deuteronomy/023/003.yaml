  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: pt
  text: Nenhuma pessoa de nascimento ilegítimo poderá entrar na assembleia de Yahweh; nem mesmo os seus descendentes, até a décima geração, poderão entrar na assembleia de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַמְזֵר
  choice: pessoa de nascimento ilegítimo
  rationale: Expressa a condição de nascimento ilegítimo ou socialmente excluído indicada pelo termo hebraico, sem recorrer ao pejorativo moderno “bastardo” nem definir com precisão indevida uma categoria cuja extensão é discutida.
- source_word: יָבֹא
  choice: entrará
  rationale: O verbo significa literalmente “vir/entrar”; com a negação, o futuro em português comunica de modo digno e natural a proibição legal.
- source_word: קְהַל יְהוָה
  choice: assembleia de Yahweh
  rationale: “Assembleia” representa קָהָל como a comunidade reunida, e “Yahweh” preserva diretamente o nome divino.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: nem mesmo até a décima geração
  rationale: Preserva a força enfática e a extensão geracional da fórmula hebraica.
- source_word: לֹא יָבֹא לוֹ
  choice: nenhum dos seus descendentes entrará
  rationale: No contexto explícito de gerações, torna natural em português a referência pronominal aos pertencentes à sua linhagem, sem limitar a repetição ao indivíduo inicial.
theological_decisions:
- issue: Sentido de מַמְזֵר
  choice: nascimento ilegítimo
  alternative: bastardo; pessoa de condição de nascimento excluída
  rationale: O termo designa uma condição genealógica ou de nascimento que acarretava exclusão, mas sua definição exata é debatida. A tradução mantém a formulação tradicionalmente provável, e a nota registra a incerteza sem impor uma interpretação denominacional.
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração comunica o nome próprio presente no texto hebraico e segue a orientação lexical fornecida para o projeto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a repetição solene da fórmula legal hebraica e evita o tom vulgar ou insultuoso que “bastardo” costuma ter no uso atual.
