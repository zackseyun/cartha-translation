  text: לֹא תִדְרֹ֥שׁ שְׁלֹמָ֖/ם וְ/טֹבָתָ֑/ם כָּל יָמֶ֖י/ךָ לְ/עוֹלָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/007.yaml
  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: pt
  text: Não busque a paz deles nem o bem-estar deles em todos os seus dias, para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a paz deles nem o bem deles”. Os termos hebraicos têm sentido amplo e não se limitam à paz política ou à prosperidade econômica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: busque
  rationale: דרש significa com frequência “buscar” ou “procurar saber”. Com os objetos abstratos deste versículo, “buscar” é natural e mantém a formulação ampla do hebraico.
- source_word: שְׁלֹמָם
  choice: a paz deles
  rationale: שָׁלוֹם abrange paz, bem-estar e integridade. “Paz” conserva o sentido central e mantém distinção em relação ao termo seguinte.
- source_word: טֹבָתָם
  choice: o bem-estar deles
  rationale: טוֹבָה designa o bem, benefício ou condição favorável. “Bem-estar” expressa essa amplitude de modo claro, sem restringir o sentido à prosperidade econômica.
- source_word: כָּל יָמֶיךָ
  choice: durante todos os seus dias
  rationale: Reproduz a expressão temporal hebraica e preserva o tratamento na segunda pessoa do singular, em português corrente e digno.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Mantém separadamente a intensificação de duração presente no hebraico, embora venha após “todos os seus dias”.
theological_decisions:
- issue: Aparente redundância ou tensão entre “todos os seus dias” e “para sempre”
  choice: Manter as duas expressões
  alternative: Condensar como “por toda a sua vida”
  rationale: O hebraico acumula כָּל יָמֶיךָ e לְעוֹלָם para dar ênfase. A tradução preserva essa força sem resolver ou apagar a aparente redundância.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “a paz nem o bem-estar deles” evita repetição pesada sem perder a relação possessiva de ambos os substantivos. O ponto vem depois do marcador de nota, conforme o padrão solicitado para que [a] apareça no texto principal.
