  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: pt
  text: Nenhum amonita ou moabita poderá entrar na assembleia de Yahweh[a]; nem até a décima geração, nenhum deles poderá entrar na assembleia de Yahweh para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “congregação de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz tanto “até a décima geração” quanto “para sempre”; as duas expressões são mantidas para preservar a força duradoura da exclusão.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: poderá entrar
  rationale: Com לֹא, o imperfeito tem força jurídica de proibição ou exclusão. “Poderá entrar” expressa naturalmente a falta de admissão, sem reduzir o verbo a um simples movimento espacial.
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: amonita nem moabita
  rationale: Os gentílicos portugueses correntes representam diretamente os termos hebraicos; “nem” combina de modo natural com a negação inicial.
- source_word: קְהַל
  choice: assembleia
  rationale: Neste contexto, קָהָל designa a comunidade reunida em sentido oficial. “Assembleia” é claro, digno e menos marcado por uso eclesiástico do que “congregação”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: nem mesmo os da décima geração
  rationale: A formulação conserva a intensificação de גַּם e torna explícita em português a referência aos integrantes ou descendentes dessa geração.
- source_word: לָהֶם
  choice: os da
  rationale: O pronome remete aos amonitas e moabitas mencionados e, ligado à fórmula geracional, refere-se aos que pertencem à linhagem deles. A redação evita o literalismo obscuro “para eles”.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: É a equivalência portuguesa direta para duração indefinida ou permanente e mantém a expressão ao lado da referência à décima geração.
theological_decisions:
- issue: Relação entre “décima geração” e “para sempre”
  choice: Manter as duas expressões temporais no texto principal.
  alternative: Interpretar “décima geração” simplesmente como “nunca”, ou tratar “para sempre” como mera explicação e omiti-lo.
  rationale: O hebraico contém ambas as formulações. Preservá-las mantém a força e a tensão internas da disposição legal sem harmonizá-las silenciosamente.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção jurídica “poderá entrar” comunica admissão, e não apenas deslocamento físico. Todos os marcadores de nota aparecem no texto principal.
