  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ מִתְהַלֵּ֣ךְ בְּ/קֶ֣רֶב מַחֲנֶ֗/ךָ לְ/הַצִּֽילְ/ךָ֙ וְ/לָ/תֵ֤ת אֹיְבֶ֨י/ךָ֙ לְ/פָנֶ֔י/ךָ וְ/הָיָ֥ה מַחֲנֶ֖י/ךָ קָד֑וֹשׁ וְ/לֹֽא יִרְאֶ֤ה בְ/ךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/שָׁ֖ב מֵ/אַחֲרֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: pt
  text: Pois Yahweh, seu Deus, anda no meio do seu acampamento para livrá-lo e entregar seus inimigos em suas mãos. Por isso, seu acampamento deve ser santo, para que ele não veja entre vocês nada indecente[a] e se afaste de vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguma coisa vergonhosa”. A expressão hebraica é ampla e pode indicar algo indecente ou impuro que torne o acampamento impróprio para a presença divina.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “volte de detrás de vocês”, retratando Yahweh deixando de acompanhar o acampamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal e seu sentido pactual, conforme a prática do projeto.
- source_word: מִתְהַלֵּךְ
  choice: anda
  rationale: Mantém a imagem antropomórfica concreta da presença ativa de Yahweh no acampamento.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: no meio do seu acampamento
  rationale: Reflete de perto a expressão hebraica e comunica naturalmente a presença divina entre o povo.
- source_word: לְהַצִּילְךָ
  choice: para livrá-lo
  rationale: Adequa-se ao contexto militar e evita restringir o verbo a uma formulação teológica posterior.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: e entregar seus inimigos em suas mãos
  rationale: 'Explicita em português corrente o sentido do idioma hebraico: pôr os inimigos sob o poder de Israel.'
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: Por isso, seu acampamento deve ser santo
  rationale: Torna clara a consequência normativa da presença de Yahweh, sem tratar a frase como mera previsão.
- source_word: עֶרְוַת דָּבָר
  choice: nada indecente
  rationale: Conserva a amplitude da expressão hebraica, que pode abranger algo vergonhoso ou impuro, e não apenas nudez literal.
- source_word: וְלֹא יִרְאֶה בְךָ
  choice: para que ele não veja entre vocês
  rationale: O plural idiomático em português representa naturalmente o singular coletivo dirigido a Israel.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: e se afaste de vocês
  rationale: Expressa com naturalidade o resultado temido; a nota preserva a imagem literal de Yahweh deixar de acompanhar o acampamento por trás.
theological_decisions:
- issue: Descrição antropomórfica da presença de Yahweh
  choice: Manter que Yahweh “anda” no acampamento
  alternative: Parafrasear como “está presente” no acampamento
  rationale: O hebraico emprega deliberadamente uma imagem concreta de movimento para ligar a proximidade divina à santidade do acampamento.
- issue: Força da cláusula sobre a santidade
  choice: “seu acampamento deve ser santo”
  alternative: “seu acampamento será santo”
  rationale: 'O contexto dá à formulação força prescritiva: a presença e a atuação de Yahweh exigem a santidade do acampamento.'
- issue: Imagem de Yahweh afastando-se
  choice: Texto principal natural, “se afaste de vocês”, com a imagem literal preservada em nota
  alternative: “volte de detrás de vocês”
  rationale: Evita uma construção obscura em português sem eliminar a imagem hebraica de Yahweh deixar de acompanhar o povo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular coletivo hebraico dirigido a Israel foi vertido naturalmente por formas plurais em alguns pontos, enquanto “seu acampamento” conserva a unidade do povo.
