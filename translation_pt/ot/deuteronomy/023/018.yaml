  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: pt
  text: Não haverá prostituta cultual entre as filhas de Israel[a], nem haverá prostituto cultual entre os filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prostituta de templo”. Os termos hebraicos significam literalmente “mulher consagrada” e “homem consagrado”, mas aqui são tradicionalmente entendidos como referência a uma atividade sexual ilícita ligada ao culto pagão. A natureza exata dessas funções é discutida.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: prostituta cultual
  rationale: Expressa o provável sentido técnico e pejorativo de uma mulher ligada a práticas sexuais de culto, sem sugerir uma consagração legítima. “Cultual” preserva a dimensão religiosa sem restringir necessariamente a prática a um templo.
- source_word: קָדֵשׁ
  choice: prostituto cultual
  rationale: Mantém o paralelo lexical e a distinção de gênero presentes no hebraico, indicando um homem ligado à mesma prática cultual ilícita.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: Não haverá / nem haverá
  rationale: Reproduz de modo natural e digno a proibição formulada com o verbo existencial, conservando a cadência jurídica e o paralelismo.
- source_word: מִבְּנוֹת יִשְׂרָאֵל
  choice: entre as filhas de Israel
  rationale: Neste contexto, a preposição מן indica pertencimento ou presença dentro do grupo. “Entre” é idiomático em português e preserva a expressão pactual “filhas de Israel”.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém o paralelismo deliberado com “filhas de Israel” e comunica naturalmente que tal pessoa não deve existir no meio da comunidade.
theological_decisions:
- issue: Sentido de קָדֵשׁ / קְדֵשָׁה nesta proibição legal
  choice: Os termos designam, provavelmente, um homem e uma mulher ligados à prostituição cultual.
  alternative: “Homem/mulher consagrado(a)” ou, de modo mais genérico, pessoa sexualmente imoral.
  rationale: O contexto favorece termos técnicos de conotação cultual ilícita, e não uma consagração neutra nem a imoralidade sexual em geral. A nota preserva a cautela necessária porque a natureza histórica exata dessas funções continua discutida.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. “Prostituta/prostituto cultual” conserva o paralelismo de gênero do hebraico. Preferiu-se “entre” por ser a formulação natural em português para presença no interior da comunidade; “das filhas/dos filhos” poderia sugerir origem ou posse de modo pouco idiomático.
