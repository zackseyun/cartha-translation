  text: לַ/נָּכְרִ֣י תַשִּׁ֔יךְ וּ/לְ/אָחִ֖י/ךָ לֹ֣א תַשִּׁ֑יךְ לְמַ֨עַן יְבָרֶכְ/ךָ֜ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹל֙ מִשְׁלַ֣ח יָדֶ֔/ךָ עַל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: pt
  text: Você poderá cobrar juros do estrangeiro[a], mas de seu irmão não cobrará juros[b], para que Yahweh, seu Deus, abençoe você em todo o trabalho de suas mãos, na terra em que você está entrando para tomar posse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “emprestar a juros” ou “exigir juros”. Traduções mais antigas podem usar “usura”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “seu irmão” significa um compatriota, membro de Israel; o hebraico mantém o termo familiar.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: do estrangeiro
  rationale: נָכְרִי designa alguém estrangeiro ou de fora, em contraste com um membro do próprio Israel. A preposição portuguesa exigida por “cobrar juros” torna natural a formulação “do estrangeiro”.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: poderá cobrar juros / não cobrará juros
  rationale: O Hifil de נשׁך, neste contexto jurídico de empréstimo, indica impor ou exigir juros. “Cobrar juros” é claro e atual, sem a conotação moral adicional que “usura” costuma ter.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Mantém o termo familiar masculino do hebraico e a força comunitária da legislação da aliança; aqui ele se refere a um compatriota israelita.
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa naturalmente a relação de propósito ou resultado introduzida pela conjunção hebraica.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus, abençoe você
  rationale: Preserva o nome divino יְהוָה e traduz a forma verbal no contexto de finalidade com o subjuntivo português.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: em todo o trabalho de suas mãos
  rationale: Conserva a imagem hebraica da mão como expressão dos empreendimentos e atividades da pessoa, em formulação compreensível em português.
- source_word: עַל הָאָרֶץ
  choice: na terra
  rationale: “Na terra” comunica de modo idiomático a localização indicada por עַל neste contexto.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: em que você está entrando para tomar posse
  rationale: Expressa a entrada iminente na terra e conserva a finalidade do infinitivo לְרִשְׁתָּהּ.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Alcance de “seu irmão” na lei de empréstimos
  choice: Manter “seu irmão” no texto e esclarecer sua referência comunitária em nota
  alternative: Traduzir diretamente como “seu compatriota israelita”
  rationale: A opção mantém a metáfora familiar e a formulação pactual do hebraico, sem ocultar que, neste contexto legal, ela distingue o membro de Israel do estrangeiro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para o singular hebraico, preserva o nome Yahweh e mantém a imagem “trabalho de suas mãos” sem recorrer a linguagem arcaica.
