base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: pt
  text: Quando entrares na seara[a] do teu próximo, poderás colher espigas com a mão, mas não passarás a foice[b] na seara do teu próximo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o cereal ainda em pé no campo.
    reason: lexical_clarification
  - marker: b
    text: 'Ou: “não brandirás a foice sobre a seara”. O verbo hebraico pode indicar erguer, mover ou brandir a foice para aplicá-la à colheita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Quando entrares
  rationale: כִּי introduz aqui a situação em que a norma se aplica, e בוא pode significar entrar. A formulação preserva o caráter casuístico da lei e soa natural em português.
- source_word: בְּקָמַת
  choice: na seara
  rationale: קָמָה designa cereal ainda em pé, não apenas um campo em sentido genérico. “Seara” expressa de modo conciso uma plantação de cereal antes da colheita; a nota explicita o sentido.
- source_word: רֵעֶךָ
  choice: do teu próximo
  rationale: Em contexto jurídico, רֵעַ indica outra pessoa da comunidade. “Próximo” é uma equivalência tradicional, clara e suficientemente ampla.
- source_word: וְקָטַפְתָּ
  choice: poderás colher
  rationale: Embora a forma verbal não contenha por si só um verbo modal, o contraste jurídico mostra que a colheita manual é permitida. “Poderás” torna explícita essa força permissiva.
- source_word: מְלִילֹת
  choice: espigas
  rationale: מְלִילֹת refere-se às partes do cereal que contêm os grãos. “Espigas” é o termo agrícola corrente e natural em português.
- source_word: בְּיָדֶךָ
  choice: com a mão
  rationale: 'A expressão delimita a maneira permitida de apanhar as espigas: manualmente, sem instrumento de colheita.'
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: mas não passarás a foice
  rationale: A conjunção introduz contraste entre apanhar com a mão e colher com ferramenta. O Hifil de נוּף sugere mover, erguer ou brandir; “passar a foice” comunica de forma natural sua aplicação à seara sem reduzir o verbo ao genérico “usar”.
- source_word: עַל קָמַת רֵעֶךָ
  choice: na seara do teu próximo
  rationale: A preposição עַל, neste contexto instrumental, indica a aplicação da foice ao cereal em pé. A repetição de “seara do teu próximo” acompanha a estrutura enfática do hebraico.
