base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: pt
  text: Quando você entrar na vinha do seu próximo[a], poderá comer uvas quanto desejar, até ficar satisfeito[b], mas não deverá colocar nenhuma no seu recipiente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Se você entrar na vinha do seu próximo”. A partícula hebraica pode introduzir uma oração temporal ou condicional.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “segundo o seu desejo, até a sua satisfação”; expressão idiomática que indica comer conforme o apetite, até ficar satisfeito.
    reason: lexical_alternative
  - marker: c
    text: Ou “vasilha”. O termo hebraico é geral e não especifica o tipo de recipiente.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: A partícula introduz aqui uma situação prevista pela lei. “Quando” é natural no estilo jurídico do contexto, embora “se” também seja possível.
- source_word: תָבֹא בְּכֶרֶם
  choice: entrar na vinha
  rationale: A construção com בוא e בְּ indica a entrada no lugar; esta formulação é clara e natural em português.
- source_word: רֵעֶךָ
  choice: do seu próximo
  rationale: רֵעַ designa o próximo, semelhante ou compatriota. “Próximo” preserva a amplitude relacional do termo sem o restringir ao morador vizinho.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: poderá comer uvas
  rationale: No contexto legal, a forma verbal concede permissão, em vez de simplesmente predizer ou ordenar a ação.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: quanto desejar, até ficar satisfeito
  rationale: A expressão idiomática associa נֶפֶשׁ ao desejo ou apetite e שֹׂבַע à saciedade; a tradução comunica tanto a liberdade de comer quanto o limite do consumo pessoal.
- source_word: כֶּלְיְךָ
  choice: seu recipiente
  rationale: כְּלִי é um termo geral para utensílio, vaso ou objeto usado para conter algo; “recipiente” evita especificar indevidamente uma cesta ou bolsa.
- source_word: לֹא תִתֵּן
  choice: não deverá colocar nenhuma
  rationale: נתן tem aqui o sentido contextual de pôr ou colocar. “Nenhuma” retoma naturalmente as uvas mencionadas na oração anterior.
