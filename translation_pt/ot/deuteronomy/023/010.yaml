base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: pt
  text: Quando você sair em campanha contra os seus inimigos, guarde-se de toda coisa má.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de toda coisa impura” ou “de qualquer coisa imprópria”. A expressão hebraica é ampla e, neste contexto, pode incluir impureza ritual sem se limitar a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz a situação em que a instrução se aplica; “quando” é natural no contexto legal e preserva melhor o sentido do que uma condição hipotética rígida.
- source_word: תֵצֵא מַחֲנֶה
  choice: você sair em campanha
  rationale: A combinação de “sair” com מַחֲנֶה e com a expressão “contra os seus inimigos” descreve uma mobilização militar. “Sair em campanha” comunica isso naturalmente sem acrescentar detalhes indevidos.
- source_word: עַל אֹיְבֶיךָ
  choice: contra os seus inimigos
  rationale: Em contexto militar, עַל tem sentido adversativo; אֹיְבֶיךָ significa diretamente “os seus inimigos”.
- source_word: וְנִשְׁמַרְתָּ
  choice: guarde-se
  rationale: 'O nifal de שׁמר tem aqui força reflexiva e exortativa: manter-se protegido ou atento, evitando o que segue.'
- source_word: מִכֹּל דָּבָר רָע
  choice: de toda coisa má
  rationale: A formulação conserva a amplitude de דָּבָר רָע, que pode abranger o mal moral e, neste contexto, também aquilo que é impróprio ou impuro, sem restringir o sentido antecipadamente.
theological_decisions:
- issue: Amplitude de דָּבָר רָע na legislação sobre a santidade do acampamento
  choice: toda coisa má
  alternative: toda coisa impura; qualquer coisa imprópria
  rationale: O contexto subsequente trata de impureza ritual, mas a expressão hebraica é mais ampla. A tradução principal preserva essa amplitude e a nota registra possibilidades contextuais sem reduzir o texto a uma única categoria.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sair em campanha” expressa naturalmente o cenário militar; “guarde-se” preserva a força reflexiva da ordem.
