base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: pt
  text: 'Você deve guardar e cumprir o que saiu de seus lábios, conforme o voto que fez a Yahweh, seu Deus: uma oferta voluntária que declarou com sua boca.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «oferta espontânea». A expressão hebraica também pode ser entendida como «conforme você prometeu voluntariamente a Yahweh, seu Deus».
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: o que saiu dos seus lábios
  rationale: Preserva a imagem concreta do hebraico, em que מוֹצָא designa aquilo que sai ou procede, e deixa claro no contexto que se trata das palavras de um voto.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: você deverá cumprir e fazer
  rationale: שׁמר expressa guardar ou observar fielmente, aqui no sentido de cumprir o compromisso; עשה acrescenta a exigência de efetivamente realizá-lo. A formulação mantém os dois verbos do original.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: conforme prometeu
  rationale: נדר se refere especificamente a fazer um voto. Em português corrente, “prometeu” comunica com naturalidade o ato, enquanto “conforme” mantém a ideia de agir segundo o conteúdo exato do voto.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: a Yahweh, seu Deus
  rationale: Translitera o nome divino יהוה como Yahweh e preserva a fórmula relacional “seu Deus”.
- source_word: נְדָבָה
  choice: como oferta espontânea
  rationale: O substantivo designa uma dádiva ou oferta apresentada de livre vontade. “Oferta espontânea” é clara em português e evita sugerir que a oferta fosse involuntária ou imposta.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: aquilo que declarou com a sua boca
  rationale: Conserva a repetição enfática da expressão oral do voto, incluindo a referência concreta à boca, sem tornar a frase excessivamente arcaica.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Relação sintática de נְדָבָה com o voto
  choice: como oferta espontânea
  alternative: voluntariamente
  rationale: A leitura substantiva mantém o sentido cultual comum de נְדָבָה e o apresenta como conteúdo ou caráter da promessa. A construção hebraica também permite entender o termo de modo adverbial, indicando que o voto foi feito voluntariamente; essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” e sintaxe de fácil leitura. A repetição referente aos lábios e à boca foi mantida por refletir a ênfase concreta do hebraico.
