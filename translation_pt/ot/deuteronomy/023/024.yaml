revisions:
- from: Você deverá cumprir e fazer o que saiu dos seus lábios[a], conforme prometeu a Yahweh, seu Deus, como oferta espontânea[b], aquilo que declarou com a sua boca.
  to: 'Você deve guardar e cumprir o que saiu de seus lábios, conforme o voto que fez a Yahweh, seu Deus: uma oferta voluntária que declarou com sua boca.[a]'
  rationale: A revisão torna a estrutura portuguesa mais natural, explicita o sentido técnico de «voto», preserva os dois verbos do hebraico mediante «guardar e cumprir» e resolve a ligação sintática entre a oferta voluntária e a palavra declarada. A única nota necessária mantém a alternativa lexical e sintática de נדבה. A nota anterior sobre «o que saiu dos lábios» foi incorporada de modo suficientemente transparente no próprio texto e não é necessária para a compreensão ou para preservar uma ambiguidade relevante.
