base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: pt
  text: Mas Yahweh, seu Deus, não quis ouvir Balaão, e Yahweh, seu Deus, transformou a maldição em bênção para você, porque Yahweh, seu Deus, amava você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: não quis
  rationale: Expressa recusa ou falta de disposição, preservando a nuance volitiva do hebraico de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Representa diretamente a forma com sufixo de segunda pessoa masculina singular; no português moderno, 'seu' mantém leitura ampla e natural.
- source_word: לִשְׁמֹעַ אֶל
  choice: ouvir
  rationale: A construção significa ouvir ou dar atenção a alguém. 'Ouvir Balaão' conserva a formulação simples sem explicitar além do texto a ideia de obedecer.
- source_word: בִּלְעָם
  choice: Balaão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיַּהֲפֹךְ
  choice: transformou
  rationale: Comunica claramente a mudança da maldição em bênção e corresponde ao sentido de virar ou converter uma coisa em outra.
- source_word: הַקְּלָלָה
  choice: a maldição
  rationale: Equivalente direto e natural do substantivo definido.
- source_word: לִבְרָכָה
  choice: em bênção
  rationale: Com 'transformou', a preposição 'em' expressa idiomaticamente o resultado da transformação indicado pelo lamed.
- source_word: כִּי
  choice: porque
  rationale: Preserva a relação causal explícita entre o amor de Yahweh e sua ação em favor de Israel.
- source_word: אֲהֵבְךָ
  choice: amava você
  rationale: Traduz diretamente o verbo 'amar'; o imperfeito em português apresenta esse amor como a realidade que motivava a ação narrada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome pessoal divino. 'Yahweh' preserva-o por transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional 'Jeová'.
- issue: Sentido de לִשְׁמֹעַ אֶל no contexto de Balaão
  choice: ouvir Balaão
  alternative: atender a Balaão; dar ouvidos a Balaão
  rationale: A expressão pode incluir a ideia de atender ao pedido ou intenção de Balaão, mas 'ouvir' preserva a abertura sem resolver em excesso a extensão pragmática do idioma.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição integral de 'Yahweh, seu Deus' foi mantida nas três ocorrências para refletir a ênfase do hebraico. 'Ao contrário' explicita de modo natural o contraste narrativo do wayyiqtol após a negação, sem acrescentar conteúdo teológico.
