base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: pt
  text: Tenha também uma estaca junto ao seu equipamento[a]. Quando você se sentar fora[b], cave com ela; depois, volte e cubra os seus excrementos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um cravo”. Alguns entendem o objeto, neste contexto, como uma ferramenta de cavar ou uma pequena pá. A expressão hebraica traduzida por “junto ao seu equipamento” diz literalmente “sobre a sua orelha” e provavelmente é idiomática.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “quando você se sentar fora”, um eufemismo discreto para fazer as necessidades.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: estaca
  rationale: O substantivo normalmente designa uma estaca ou cravo. Aqui se refere a um objeto levado com o equipamento e usado para cavar; “estaca” preserva a imagem lexical, enquanto a oração seguinte esclarece sua função.
- source_word: עַל אֲזֵנֶךָ
  choice: entre os seus equipamentos
  rationale: Embora אֲזֵן signifique literalmente “orelha”, a expressão neste contexto provavelmente se refere ao equipamento que a pessoa leva consigo. A tradução literal seria ininteligível em português.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: quando você se agachar fora do acampamento
  rationale: A expressão diz literalmente “quando você se sentar fora” e funciona como eufemismo modesto para evacuar. “Se agachar” conserva a imagem corporal de modo natural; “do acampamento” explicita o referente contextual de “fora”.
- source_word: וְחָפַרְתָּה בָהּ
  choice: cave com ela
  rationale: O pronome feminino retoma יָתֵד. A tradução mantém o instrumento explícito sem acrescentar “um buraco”, que está implícito, mas não aparece no hebraico.
- source_word: וְשַׁבְתָּ
  choice: depois, vire-se
  rationale: O verbo שׁוב indica aqui voltar-se após cavar para então cobrir os dejetos. “Vire-se” expressa naturalmente a sequência da ação.
- source_word: צֵאָתֶךָ
  choice: os seus excrementos
  rationale: O termo denota dejetos humanos. “Excrementos” é preciso, corrente e suficientemente digno para o registro legal.
