base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: pt
  text: Os filhos que lhes nascerem, na terceira geração, poderão entrar na assembleia de Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos”; neste contexto jurídico-genealógico, o termo pode referir-se mais amplamente à descendência.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a terceira geração entrará”. O hebraico admite essa tradução mais formal; no contexto, trata-se da permissão de entrada a partir da terceira geração.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: filhos
  rationale: Mantém o sentido familiar e a correspondência direta com o masculino plural hebraico; neste contexto jurídico-genealógico, pode abranger a descendência em geral, como esclarece a nota.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: que lhes nascerem
  rationale: Reproduz naturalmente em português o passivo de ילד com ל e preserva a oração relativa explícita.
- source_word: דּוֹר שְׁלִישִׁי
  choice: na terceira geração
  rationale: Expressa o ponto geracional em que a admissão passa a ocorrer, sem transformar a expressão em uma formulação excessivamente explicativa.
- source_word: יָבֹא
  choice: poderão entrar
  rationale: No contexto jurídico, comunica admissão permitida; o plural concorda naturalmente com “filhos”, embora o hebraico empregue o singular coletivo junto de “terceira geração”.
- source_word: בִּקְהַל יְהוָה
  choice: na assembleia de Yahweh
  rationale: “Assembleia” conserva o sentido comunitário e jurídico de קהל em linguagem portuguesa atual; a preposição “em” com “entrar” é idiomática em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Abrangência de בָּנִים no contexto jurídico-genealógico
  choice: filhos, com nota explicativa
  alternative: descendentes
  rationale: “Filhos” conserva a forma lexical e a imagem familiar do hebraico, enquanto a nota esclarece que o uso pode incluir a descendência de modo mais amplo.
- issue: Força modal de יָבֹא
  choice: poderão entrar
  alternative: entrarão
  rationale: A formulação ocorre em uma regra de admissão; o futuro português isolado poderia soar apenas preditivo, enquanto “poderão” torna explícito o sentido permissivo sem negar a tradução formal alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase permanece próxima do hebraico, e as notas preservam tanto a amplitude possível de “filhos” quanto a tensão entre a forma futura e o sentido jurídico-permissivo.
