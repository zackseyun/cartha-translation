  text: לֹא תַשִּׁ֣יךְ לְ/אָחִ֔י/ךָ נֶ֥שֶׁךְ כֶּ֖סֶף נֶ֣שֶׁךְ אֹ֑כֶל נֶ֕שֶׁךְ כָּל דָּבָ֖ר אֲשֶׁ֥ר יִשָּֽׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: pt
  text: Não cobre do seu irmão juros sobre dinheiro[a], juros sobre alimentos ou juros sobre qualquer coisa emprestada a juros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prata”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico refere-se à cobrança de juros em geral, não somente a juros excessivos, por vezes chamados de “usura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: cobre ... juros
  rationale: O hifil de נשׁך expressa a imposição ou cobrança de juros. “Cobrar juros” é natural em português e mantém o foco da proibição no credor.
- source_word: לְאָחִיךָ
  choice: de seu irmão
  rationale: Preserva o sentido literal e o enquadramento familiar-aliançal de אָח, sem substituir no texto a expressão por uma interpretação como “compatriota israelita”.
- source_word: נֶשֶׁךְ
  choice: juros
  rationale: O termo designa juros cobrados sobre empréstimo; “usura” poderia sugerir apenas juros excessivos e, por isso, seria indevidamente restritivo.
- source_word: כֶּסֶף
  choice: dinheiro
  rationale: Embora כֶּסֶף signifique literalmente “prata”, neste contexto econômico-jurídico refere-se naturalmente a dinheiro.
- source_word: אֹכֶל
  choice: alimentos
  rationale: Traduz com clareza a categoria ampla de comida ou mantimentos e se ajusta ao registro jurídico da enumeração.
- source_word: כָּל דָּבָר
  choice: qualquer coisa
  rationale: Reproduz o alcance abrangente da expressão hebraica, estendendo a proibição para além de dinheiro e alimentos.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: pela qual se possam cobrar juros
  rationale: Mantém a formulação abrangente e algo impessoal do hebraico, indicando tudo aquilo que pode estar sujeito à cobrança de juros sem limitar a expressão a uma forma específica de empréstimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção jurídica direta. Conserva “irmão” por sua força familiar e pactual; a repetição de “juros” acompanha a ênfase da enumeração hebraica.
