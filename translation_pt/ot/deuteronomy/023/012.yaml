  text: וְ/הָיָ֥ה לִ/פְנֽוֹת עֶ֖רֶב יִרְחַ֣ץ בַּ/מָּ֑יִם וּ/כְ/בֹ֣א הַ/שֶּׁ֔מֶשׁ יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: pt
  text: Ao cair da tarde, ele se lavará com água e, quando o sol se puser[a], poderá entrar no interior do acampamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quando o sol entrar”; expressão idiomática hebraica para o pôr do sol.
    reason: lexical_alternative
  - marker: b
    text: Ou, simplesmente, “no acampamento”; o hebraico ressalta a entrada em seu interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ele se lavará
  rationale: A construção com waw e היה dá continuidade à instrução legal; em português, essa continuidade fica natural sem uma tradução isolada de וְהָיָה.
- source_word: לִפְנוֹת עֶרֶב
  choice: Ao cair da tarde
  rationale: A expressão descreve o momento em que o dia se volta para a tarde; a formulação escolhida é corrente, clara e mantém o valor temporal.
- source_word: יִרְחַץ בַּמָּיִם
  choice: ele se lavará com água
  rationale: Neste contexto de pureza ritual, רחץ indica a lavagem do corpo. O pronome reflexivo explicita naturalmente em português o sentido contextual.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: quando o sol se puser
  rationale: A expressão hebraica diz literalmente que o sol “entra”, um modo idiomático de indicar o pôr do sol. A tradução comunica o sentido sem reproduzir uma imagem pouco clara em português.
- source_word: יָבֹא
  choice: poderá entrar
  rationale: No contexto legal, a forma verbal indica que, depois da lavagem e do pôr do sol, a pessoa recebe permissão para voltar a entrar, não apenas que o fará no futuro.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: no interior do acampamento
  rationale: תּוֹךְ destaca a entrada para dentro do acampamento. “No interior” preserva essa nuance com linguagem natural.
theological_decisions:
- issue: Valor modal de יָבֹא na instrução sobre a readmissão
  choice: poderá entrar
  alternative: entrará
  rationale: A proibição contextual de entrar no acampamento vigora até a lavagem e o pôr do sol; por isso, a forma expressa adequadamente permissão após essas condições, sem acrescentar uma afirmação sobre o que a pessoa necessariamente fará.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ao cair da tarde” e “quando o sol se puser” são expressões correntes; “interior do acampamento” conserva uma nuance espacial do hebraico sem soar excessivamente literal.
