    issue: Ordem dos complementos em “ele contratou contra vocês Balaão”
    rationale: Embora compreensível, a construção é pouco idiomática e pode inicialmente sugerir que “contra vocês” modifica o ato de contratar antes de identificar quem foi contratado. A inversão para “contratou Balaão ... contra vocês” preserva integralmente o sentido hostil de עָלֶיךָ e melhora a fluência.
