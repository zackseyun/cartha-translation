  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: pt
  text: porque não foram ao encontro de vocês com pão e água no caminho, quando vocês saíram do Egito, e porque ele contratou Balaão, filho de Beor, de Petor, em Arã-Naaraim,[a] contra vocês, para amaldiçoá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arã-Naaraim é tradicionalmente identificada com a Mesopotâmia; o nome significa literalmente “Arã dos Dois Rios”.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: porque
  rationale: Introduz a razão da proibição precedente; “porque” preserva naturalmente o valor causal da expressão hebraica.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: não foram ao encontro de vocês
  rationale: קדמ indica aqui sair ao encontro de alguém, neste caso levando provisões. A formulação evita o sentido mais interpretativo de “acolher”.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: com pão e água
  rationale: Mantém os substantivos concretos do hebraico em uma construção natural em português.
- source_word: בַּדֶּרֶךְ
  choice: no caminho
  rationale: Equivalente locativo direto e idiomático.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: quando vocês saíram do Egito
  rationale: O infinitivo construto com preposição tem valor temporal; a redação é clara e natural.
- source_word: וַאֲשֶׁר
  choice: e porque
  rationale: Retoma uma segunda razão paralela à primeira.
- source_word: שָׂכַר עָלֶיךָ
  choice: ele contratou contra vocês
  rationale: שׂכר significa contratar, e עַל comunica aqui direção hostil. Mantém-se o sujeito singular do texto hebraico, embora o referente possa ser entendido coletivamente ou à luz do contexto anterior.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaão, filho de Beor
  rationale: Emprega as formas portuguesas correntes dos nomes e preserva o patronímico hebraico.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: de Petor, em Arã-Naaraim
  rationale: Trata Petor como localidade situada na região denominada Arã-Naaraim, preservando o topônimo hebraico sem substituí-lo pela identificação tradicional “Mesopotâmia”.
- source_word: לְקַלְלֶךָּ
  choice: para amaldiçoá-los
  rationale: O infinitivo expressa finalidade; a formulação é direta e semanticamente precisa.
theological_decisions:
- issue: Alternância entre destinatário plural e agente singular
  choice: “vocês” para Israel e “ele contratou” para o sujeito singular
  alternative: 'Uniformizar o segundo sujeito no plural: “eles contrataram”'
  rationale: O hebraico alterna formas plurais dirigidas a Israel com שָׂכַר no singular. A tradução conserva essa tensão gramatical em vez de identificar explicitamente o agente ou harmonizar o número.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e mantém a concretude de “pão e água”. O marcador [a] aparece junto ao topônimo explicado.
