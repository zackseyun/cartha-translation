  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: pt
  text: 'Nenhum homem que tenha os testículos esmagados ou o pênis decepado poderá entrar na assembleia de Yahweh.[a][b]


    [a] Ou, de modo mais formal: “Aquele cujos testículos foram esmagados ou cujo pênis foi cortado não entrará na assembleia de Yahweh”.


    [b] “Assembleia de Yahweh” pode referir-se à participação formal na comunidade da aliança de Israel; o alcance exato dessa exclusão é discutido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Aquele cujos testículos foram esmagados ou cujo pênis foi cortado não entrará na assembleia de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: “Assembleia de Yahweh” pode referir-se à participação formal na comunidade da aliança de Israel; o alcance exato dessa exclusão é discutido.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָבֹא
  choice: não poderá entrar
  rationale: בוא significa “vir/entrar”; com לֹא, neste contexto jurídico, a formulação expressa naturalmente em português uma proibição, sem definir além do texto a natureza precisa do acesso negado.
- source_word: פְצוּעַ דַּכָּא
  choice: homem que tenha os testículos esmagados
  rationale: A expressão descreve lesão por esmagamento dos órgãos sexuais masculinos, provavelmente dos testículos. A tradução anatômica direta é mais clara e precisa do que eufemismos tradicionais.
- source_word: וּכְרוּת שָׁפְכָה
  choice: ou o pênis decepado
  rationale: A expressão designa o órgão masculino cortado. “Pênis decepado” é direto e atual; “ou” preserva a distinção entre as duas condições mencionadas.
- source_word: בִּקְהַל
  choice: na assembleia
  rationale: קהל designa a comunidade reunida. “Assembleia” conserva o caráter comunitário e jurídico-cultual da expressão sem introduzir associações eclesiásticas indevidas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado em vez de ser substituído por um título, preservando seu caráter de nome próprio.
- source_word: referente masculino implícito nos particípios
  choice: homem
  rationale: As lesões descritas são especificamente da anatomia sexual masculina; “homem” torna explícito o referente sem neutralizá-lo artificialmente.
theological_decisions:
- issue: Natureza da exclusão da “assembleia de Yahweh”
  choice: Manter a expressão como exclusão da assembleia da aliança, sem especificar suas consequências posteriores
  alternative: Entendê-la especificamente como exclusão do culto formal, da cidadania, do casamento dentro de Israel ou da salvação
  rationale: O hebraico declara a proibição, mas não define neste versículo todo o alcance jurídico, cultual ou teológico de “entrar na assembleia”. A tradução preserva essa tensão, e a nota registra a incerteza sem resolver a questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação é anatomicamente explícita porque o hebraico também é específico; evita tanto eufemismos opacos quanto interpretações denominacionais da expressão “assembleia de Yahweh”.
