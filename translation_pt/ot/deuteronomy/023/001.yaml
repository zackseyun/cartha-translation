  text: לֹא יִקַּ֥ח אִ֖ישׁ אֶת אֵ֣שֶׁת אָבִ֑י/ו וְ/לֹ֥א יְגַלֶּ֖ה כְּנַ֥ף אָבִֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: pt
  text: Nenhum homem tomará a mulher de seu pai[a], nem descobrirá a aba da veste de seu pai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomará por esposa a mulher de seu pai”.'
    reason: lexical_alternative
  - marker: b
    text: Expressão eufemística de sentido sexual, provavelmente referente a violar a união conjugal do pai ao ter relações com a mulher dele. Compare “descobrir a nudez de seu pai”.
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: tomará
  rationale: O verbo לָקַח significa literalmente “tomar” e, quando usado com “mulher”, pode ter o sentido idiomático de tomá-la em casamento. “Tomará” conserva a formulação hebraica sem excluir esse sentido matrimonial.
- source_word: אִישׁ
  choice: Nenhum homem
  rationale: O substantivo masculino singular refere-se a um homem. Com a negação hebraica, “nenhum homem” expressa de modo natural em português a proibição legal.
- source_word: אֵשֶׁת אָבִיו
  choice: a mulher de seu pai
  rationale: Reproduz a relação expressa no hebraico sem restringi-la a “madrasta”, termo que seria mais interpretativo.
- source_word: יְגַלֶּה
  choice: descobrirá
  rationale: Mantém o sentido básico de גלה, “descobrir, expor”, e preserva a linguagem eufemística da cláusula.
- source_word: כְּנַף
  choice: a aba da veste
  rationale: כָּנָף pode designar asa, extremidade, ponta ou aba de uma roupa. “Aba da veste” torna a imagem concreta em português sem substituí-la diretamente por sua interpretação sexual.
theological_decisions:
- issue: Se o eufemismo sexual deve ser explicitado no texto principal
  choice: Conservar a metáfora “descobrir a aba da veste de seu pai”
  alternative: “violar o leito conjugal de seu pai” ou “descobrir a nudez de seu pai”
  rationale: O hebraico não emprega aqui a fórmula habitual “descobrir a nudez”, mas uma imagem baseada na aba ou extremidade da veste. A tradução mantém essa tensão e explica o sentido provável em nota, sem converter uma interpretação em texto principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formulação jurídica direta. “Nenhum homem” soa mais natural do que uma reprodução rígida de “um homem não”. A metáfora incomum da segunda oração foi mantida e esclarecida em nota.
