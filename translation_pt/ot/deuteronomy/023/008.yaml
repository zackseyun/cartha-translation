  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: pt
  text: Não deteste o edomita[a], pois ele é seu irmão[b]. Não deteste o egípcio, pois você foi estrangeiro residente[c] na terra dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tenha aversão” ou “não considere abominável”.'
    reason: lexical_alternative
  - marker: b
    text: “Seu irmão” se refere ao parentesco de Israel com Edom por meio de Esaú.
    reason: cross_reference
  - marker: c
    text: 'Ou: “imigrante” ou “estrangeiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: tenha aversão
  rationale: O piel de תעב expressa considerar ou tratar alguém como detestável. A construção portuguesa «não tenha aversão» comunica a forte rejeição exigida pelo contexto sem recorrer ao pouco corrente «abominar»; a repetição hebraica é preservada nas duas proibições.
- source_word: אֲדֹמִי
  choice: edomita
  rationale: Forma gentílica portuguesa corrente para um membro do povo de Edom.
- source_word: אָחִיךָ
  choice: seu irmão
  rationale: Mantém a metáfora familiar explícita do hebraico e a ligação histórica entre Israel e Edom, sem substituí-la pela interpretação mais genérica «parente».
- source_word: מִצְרִי
  choice: egípcio
  rationale: Forma gentílica portuguesa corrente, mantida no singular representativo como no hebraico.
- source_word: גֵר
  choice: estrangeiro residente
  rationale: Expressa a condição de quem vive fora de seu povo ou terra de origem sob a proteção de outra comunidade. É mais precisa que apenas «estrangeiro» e mais clara no português atual que «forasteiro».
- source_word: בְאַרְצוֹ
  choice: na terra dele
  rationale: Conserva o substantivo «terra» e o sufixo pronominal masculino singular, no qual o egípcio representa coletivamente o Egito.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente, nas duas orações, a razão dada para cada proibição.
theological_decisions:
- issue: Gentílicos no singular com sentido representativo
  choice: Manter «o edomita», «o egípcio», «ele» e «dele» no singular.
  alternative: 'Usar plurais coletivos: «os edomitas», «os egípcios» e «deles».'
  rationale: O hebraico emprega o singular representativo no estilo jurídico. Preservá-lo mantém tanto a forma da fonte quanto o caráter pessoal da obrigação.
- issue: Linguagem de parentesco entre Israel e Edom
  choice: Traduzir אָחִיךָ literalmente por «seu irmão».
  alternative: Explicitar como «seu parente» ou «seu povo irmão».
  rationale: A formulação literal preserva a fundamentação histórico-teológica da ordem na fraternidade entre Israel e Edom, descendentes de Jacó e Esaú, sem inserir a explicação no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular «você» reflete a forma hebraica dirigida individualmente ao israelita representativo. A repetição das duas proibições foi mantida, assim como os singulares nacionais e pronominais da fonte.
