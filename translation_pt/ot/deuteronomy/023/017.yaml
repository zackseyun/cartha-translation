  source_fidelity: 'A tradução preserva adequadamente a sequência e o sentido jurídico do hebraico: residência junto à comunidade, escolha do lugar dentro de uma de suas cidades, critério do que é melhor para ele e proibição de oprimi-lo. «Ele morará» transmite bem o valor durativo de יֵשֵׁב; «onde for melhor para ele» conserva a perspectiva expressa por בַּטּוֹב לוֹ sem reduzi-la a mero capricho.'
  naturalness: O português é moderno, claro e amplamente compreensível. O emprego de «vocês» funciona naturalmente para o singular coletivo dirigido a Israel. A construção «no lugar que escolher, em uma das suas cidades» é inteligível e mantém a restrição locativa do hebraico.
  terminology: «Oprimir» corresponde apropriadamente ao peso jurídico e social de לֹא תּוֹנֶנּוּ. «Cidades», com a nota que explicita o literal «portões» e sua função metonímica, é uma solução adequada e natural. Os pronomes masculinos singulares refletem as formas hebraicas e o referente contextual do versículo anterior.
