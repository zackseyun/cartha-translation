reference: Deuteronomy 23:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עִמְּ/ךָ֞ יֵשֵׁ֣ב בְּ/קִרְבְּ/ךָ֗ בַּ/מָּק֧וֹם אֲשֶׁר יִבְחַ֛ר בְּ/אַחַ֥ד שְׁעָרֶ֖י/ךָ בַּ/טּ֣וֹב ל֑/וֹ לֹ֖א תּוֹנֶֽ/נּוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: pt
  text: Ele morará com vocês, no meio de vocês, no lugar que escolher, em uma das suas cidades[a], onde for melhor para ele[b]. Vocês não o oprimirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em um dos seus portões”; os portões representam aqui as cidades ou comunidades.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “onde lhe parecer melhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: morará
  rationale: O verbo ישב pode significar sentar-se, permanecer ou habitar. Neste contexto legal, “morará” expressa de modo natural a residência contínua permitida ao servo fugitivo.
- source_word: עִמְּךָ ... בְּקִרְבְּךָ
  choice: com vocês, no meio de vocês
  rationale: A combinação preserva tanto a ideia literal de estar “com” a comunidade quanto a de residir dentro dela. O plural português explicita que o singular hebraico se dirige coletivamente a Israel.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: no lugar que escolher
  rationale: Mantém o residente como sujeito de “escolher” e preserva sua liberdade de decidir onde morar.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: em uma das suas cidades
  rationale: Embora שׁער signifique literalmente “portão”, no uso hebraico os “portões” representam por metonímia as cidades ou comunidades. A tradução comunica diretamente o referente, e a nota preserva a imagem original.
- source_word: בַּטּוֹב לוֹ
  choice: onde for melhor para ele
  rationale: A expressão literalmente relaciona o lugar ao que é bom para ele. Esta formulação é natural em português e não reduz o sentido a mero agrado subjetivo.
- source_word: לֹא תּוֹנֶנּוּ
  choice: Vocês não o oprimirão
  rationale: O Hifil de ינה, em contexto legal, indica oprimir, explorar ou maltratar uma pessoa vulnerável. “Oprimir” preserva a força social e moral da proibição.
theological_decisions:
- issue: Referente das formas masculinas singulares
  choice: O servo fugitivo mencionado no versículo anterior é apresentado como indivíduo masculino, por meio de “ele” e “o”.
  alternative: Empregar uma formulação sem marca de gênero para representar qualquer pessoa fugitiva.
  rationale: O hebraico mantém formas masculinas singulares para essa pessoa. A tradução conserva essa forma gramatical sem ampliar nem restringir explicitamente a aplicação da lei.
- issue: Número do destinatário israelita
  choice: Traduzir o singular coletivo hebraico por “vocês”.
  alternative: Manter o singular em “você” ou usar “tu”.
  rationale: O destinatário gramatical é singular, mas representa coletivamente Israel e suas comunidades. Em português moderno, o plural torna essa referência comunitária clara e evita que a ordem pareça dirigida apenas a um indivíduo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Morará” é mais corrente que “habitará” neste contexto; “vocês” explicita o destinatário coletivo. As duas notas mantêm visíveis a imagem hebraica dos portões e a nuance possível da avaliação pessoal do lugar.
