base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: pt
  text: Se houver entre vocês um homem que não estiver puro por causa de uma emissão noturna[a], ele sairá para fora do acampamento e não entrará no interior do acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma ocorrência da noite”, expressão hebraica referente a uma emissão noturna.
    reason: Esclarecer o idiomatismo hebraico e registrar sua forma literal.
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz um caso condicional no contexto legal, de modo natural em português.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: houver entre vocês um homem
  rationale: Preserva a construção existencial, o âmbito da comunidade e a referência masculina exigida pela condição corporal descrita.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: que não esteja puro
  rationale: Expressa o estado de pureza ritual sem sugerir culpa moral; neste contexto, “puro” é mais preciso do que uma noção comum de higiene.
- source_word: מִקְּרֵה לָיְלָה
  choice: por causa de uma emissão noturna
  rationale: Traduz de forma clara e discreta o idiomatismo hebraico referente a uma emissão corporal ocorrida à noite.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: ele sairá para fora do acampamento
  rationale: Mantém tanto o movimento para fora quanto a formulação normativa do hebraico.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: não entrará no interior do acampamento
  rationale: Preserva a nuance de תּוֹךְ, que indica a parte interna ou o meio do acampamento.
theological_decisions:
- issue: Natureza da impureza no versículo
  choice: Apresentar a condição como falta de pureza ritual, não como culpa moral.
  alternative: Traduzir com linguagem que possa sugerir contaminação moral ou pecado.
  rationale: O contexto trata da santidade do acampamento e de uma condição corporal temporária. O texto não atribui culpa moral ao homem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” comunica naturalmente o plural comunitário de בְךָ neste contexto. A formulação conserva o caráter legal sem recorrer a linguagem arcaica.
