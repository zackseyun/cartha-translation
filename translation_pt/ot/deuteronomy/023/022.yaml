source:
  edition: WLC
  text: כִּֽי תִדֹּ֥ר נֶ֨דֶר֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תְאַחֵ֖ר לְ/שַׁלְּמ֑/וֹ כִּֽי דָּרֹ֨שׁ יִדְרְשֶׁ֜/נּוּ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מֵֽ/עִמָּ֔/ךְ וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: pt
  text: Mas, se você fizer um voto a Yahweh, seu Deus, não demore a cumpri-lo, pois Yahweh, seu Deus, certamente o exigirá de você, e isso será pecado em você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você será culpado de pecado”. O hebraico diz literalmente: “isso será pecado em você”.'
    reason: Alternativa lexical para uma construção hebraica idiomática.
lexical_decisions:
- source_word: כִּי
  choice: Mas, se
  rationale: Introduz uma condição com leve contraste em relação ao versículo anterior, no qual não fazer voto não constitui pecado.
- source_word: תִדֹּר נֶדֶר
  choice: você fizer um voto
  rationale: A combinação do verbo נדר com seu objeto cognato é expressa naturalmente em português por “fazer um voto”, sem a rigidez de uma reprodução palavra por palavra.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: a Yahweh, seu Deus
  rationale: A preposição indica o destinatário do voto; o nome divino יהוה é transliterado como “Yahweh”.
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: não demore a cumpri-lo
  rationale: אחר comunica demora, enquanto שלם, no contexto de votos, significa pagar ou cumprir o que foi prometido. “Cumpri-lo” abrange votos sacrificiais, dedicatórios e outros.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: certamente o exigirá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação; “certamente” preserva essa ênfase, e “exigirá” se ajusta ao contexto jurídico da obrigação assumida.
- source_word: מֵעִמָּךְ
  choice: de você
  rationale: Indica que o cumprimento será requerido da pessoa que fez o voto.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: e isso será pecado em você
  rationale: Mantém a formulação compacta e a imagem incomum do hebraico, sem resolver silenciosamente sua expressão idiomática como mera declaração de culpa.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido de וְהָיָה בְךָ חֵטְא
  choice: isso será pecado em você
  alternative: você será culpado de pecado
  rationale: A tradução principal conserva a construção hebraica e sua tensão idiomática; a alternativa explicita a culpa resultante, mas interpreta mais diretamente a expressão.
translation_notes:
  register: Português moderno, claro e digno, com uso de “você” para ampla legibilidade brasileira. “Cumpri-lo” é mais abrangente e natural do que “pagá-lo” no contexto de votos. A redação principal permanece próxima da expressão hebraica no desfecho, e a nota oferece a interpretação idiomática.
