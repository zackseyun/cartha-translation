base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: pt
  text: Você terá um lugar fora do acampamento[a] e sairá para lá, para fora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mão” (yad); aqui, provavelmente um uso idiomático que significa um lugar ou local designado. Algumas traduções entendem o termo mais concretamente como utensílio ou estaca, à luz do versículo seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: lugar
  rationale: Embora o sentido comum seja “mão”, aqui o termo parece designar idiomaticamente um local determinado fora do acampamento. “Lugar” se ajusta à sintaxe e à instrução de sair para lá.
- source_word: תִּהְיֶה לְךָ
  choice: você terá
  rationale: A construção existencial com לְ expressa posse ou provisão atribuída; “você terá” é natural e conserva a força diretiva.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: Traduz diretamente a localização além dos limites do acampamento.
- source_word: וְיָצָאתָ
  choice: e sairá
  rationale: O qal de יצא indica sair; o futuro em português expressa adequadamente a determinação no contexto legal.
- source_word: שָׁמָּה
  choice: para lá
  rationale: O advérbio direcional remete ao lugar anteriormente indicado.
- source_word: חוּץ
  choice: para fora
  rationale: Mantém a repetição enfática do hebraico e esclarece que o movimento termina fora do acampamento.
