  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: pt
  text: Não leve à casa de Yahweh, seu Deus, o pagamento de uma prostituta nem o preço de um cão em cumprimento de qualquer voto,[a] pois ambos são uma abominação para Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “nem o preço de um prostituto”, caso “cão” seja aqui um termo depreciativo para um prostituto cultual.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָבִיא
  choice: leve
  rationale: O hifil de בוא indica fazer entrar ou levar algo a um lugar. “Leve à casa” expressa naturalmente em português o movimento concreto exigido pelo contexto.
- source_word: אֶתְנַן זוֹנָה
  choice: o pagamento de uma prostituta
  rationale: אֶתְנַן designa pagamento ou remuneração, e זוֹנָה, uma prostituta. A formulação é clara e preserva a relação entre os termos sem recorrer a linguagem arcaica.
- source_word: מְחִיר כֶּלֶב
  choice: o preço de um cão
  rationale: מְחִיר significa normalmente “preço”, e כֶּלֶב significa literalmente “cão”. Como a interpretação idiomática é discutida, o texto principal mantém a forma lexical e registra a alternativa em nota.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: à casa de Yahweh, seu Deus
  rationale: בֵּית é “casa”; “templo” seria mais específico do que o hebraico. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: לְכָל נֶדֶר
  choice: para cumprir voto algum
  rationale: A expressão indica a finalidade de levar o pagamento à casa de Yahweh em conexão com um voto. “Para cumprir voto algum” torna essa relação natural em português, sem especificar além do contexto.
- source_word: תוֹעֲבַת
  choice: abominação
  rationale: תוֹעֵבָה é um termo forte para aquilo que é detestável diante de Deus. “Abominação” preserva sua intensidade no contexto legal e cultual.
- source_word: גַּם שְׁנֵיהֶם
  choice: ambos
  rationale: A expressão inclui enfaticamente os dois itens mencionados. “Ambos” comunica isso de modo direto e natural.
theological_decisions:
- issue: Sentido de כֶּלֶב em מְחִיר כֶּלֶב
  choice: Traduzir literalmente como “cão” no texto principal.
  alternative: Entender “cão” como termo depreciativo para um prostituto, possivelmente ligado à prostituição cultual.
  rationale: O sentido lexical inequívoco é “cão”, enquanto a leitura referente a um prostituto é possível, mas discutida. Manter “cão” preserva a ambiguidade histórica, e a nota informa a alternativa sem impô-la.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração “Yahweh” representa diretamente o nome divino presente no texto hebraico e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “seu Deus” como forma natural do singular e conserva “casa”, “voto” e “abominação” para manter o caráter concreto, jurídico e cultual do hebraico.
