  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: pt
  text: Mas, se você se abstiver de fazer um voto, isso não será pecado para você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você não terá culpa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Mas, se
  rationale: A combinação introduz uma condição em contraste com a obrigação de cumprir um voto mencionada no contexto anterior.
- source_word: תֶחְדַּל
  choice: você se abstiver
  rationale: O verbo חדל indica cessar ou abster-se; aqui descreve a decisão de não praticar o ato de fazer um voto.
- source_word: לִ/נְדֹּר
  choice: de fazer um voto
  rationale: O infinitivo de נדר significa fazer um voto; esta formulação é natural em português e mantém explícito o ato em questão.
- source_word: לֹא יִהְיֶה
  choice: não haverá
  rationale: A construção existencial negativa é expressa de modo claro e natural em português, preservando seu sentido resultante ou futuro.
- source_word: בְ/ךָ
  choice: em você
  rationale: Reproduz diretamente a preposição hebraica, embora a expressão também possa comunicar culpa atribuída à pessoa.
- source_word: חֵטְא
  choice: pecado
  rationale: חֵטְא pode indicar pecado ou culpa. 'Pecado' exprime claramente o contraste moral do contexto, enquanto a nota preserva a nuance jurídica de culpa.
theological_decisions:
- issue: Situação moral de quem não faz um voto
  choice: Abster-se de fazer um voto não constitui pecado.
  alternative: A ênfase pode recair na ausência de culpa ou responsabilidade imputável.
  rationale: O hebraico חֵטְא abrange as ideias relacionadas de pecado e culpa. O texto principal mantém 'pecado', sem eliminar a possível nuance de culpa, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção condicional natural. A expressão 'em você' conserva de perto o idioma hebraico; a nota oferece a alternativa jurídica 'culpa sobre você'.
