base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: pt
  text: Você ajuntará todos os despojos da cidade no meio da praça e queimará no fogo a cidade e todos os seus despojos, como oferta inteira ao SENHOR, seu Deus.[a] Ela ficará para sempre como um monte de ruínas[b] e nunca mais será reconstruída.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inteiramente para o SENHOR, seu Deus”. O termo hebraico pode indicar tanto que tudo seria queimado por completo quanto que seria inteiramente dedicado a Deus como oferta.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “um monte para sempre”, isto é, um monte permanente de ruínas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: os despojos da cidade / seus despojos
  rationale: שָׁלָל designa bens tomados como saque. “Despojos” é natural neste contexto jurídico-militar; a primeira ocorrência explicita “da cidade” para evitar a ambiguidade do pronome em português.
- source_word: תִּקְבֹּץ
  choice: você ajuntará
  rationale: O imperfeito qal de קבץ, em uma sequência de instruções legais, tem força diretiva. “Ajuntará” comunica reunir tudo em um só lugar e mantém o tom solene.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: no meio da praça
  rationale: רְחוֹב designa aqui um espaço público amplo da cidade. “Praça” é mais natural e exato em português do que “rua”.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: queimará no fogo
  rationale: A formulação conserva a expressão enfática hebraica e permanece idiomática em português.
- source_word: כָּלִיל
  choice: como oferta inteira
  rationale: כָּלִיל pode significar adverbialmente “inteiramente”, mas, seguido de לַיהוָה, também evoca algo totalmente consumido e dedicado a Deus. “Como oferta inteira” preserva essa ressonância cultual sem identificar a cidade tecnicamente com um holocausto animal.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: A preposição ל marca destinação ou dedicação, e o nome divino יהוה é representado pela convenção portuguesa “SENHOR” em versaletes.
- source_word: תֵּל עוֹלָם
  choice: para sempre como um monte de ruínas
  rationale: תֵּל é um monte ou amontoado, frequentemente formado por ruínas, e עוֹלָם expressa duração indefinidamente contínua. A formulação preserva tanto a imagem física quanto a permanência.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: nunca mais será reconstruída
  rationale: O nifal de בנה com עוֹד indica que a cidade não voltará a ser edificada. “Nunca mais será reconstruída” é direto e natural.
theological_decisions:
- issue: Força cultual de כָּלִיל na ordem de queimar a cidade
  choice: como oferta inteira ao SENHOR, seu Deus
  alternative: inteiramente para o SENHOR, seu Deus
  rationale: A tradução principal mantém a possível ideia de completa dedicação sacrificial, sem impor o termo técnico “holocausto”. A nota registra a leitura adverbial genuinamente possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O futuro do indicativo preserva o caráter diretivo da legislação. “Praça”, “despojos” e “monte de ruínas” comunicam imagens concretas sem arcaísmo excessivo. Os marcadores das notas foram colocados junto aos termos que de fato explicam.
