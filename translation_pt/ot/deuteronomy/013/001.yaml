  text: אֵ֣ת כָּל הַ/דָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם אֹת֥/וֹ תִשְׁמְר֖וּ לַ/עֲשׂ֑וֹת לֹא תֹסֵ֣ף עָלָ֔י/ו וְ/לֹ֥א תִגְרַ֖ע מִמֶּֽ/נּוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: pt
  text: Tudo o que eu lhes ordeno, tenham o cuidado de cumprir. Não acrescentem nada a isso[a] nem tirem nada disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em algumas tradições de numeração, este versículo corresponde a Deuteronômio 12:32.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: Tudo o que
  rationale: Expressa naturalmente em português o singular coletivo hebraico, abrangendo a totalidade da instrução, sem a formulação pouco idiomática «toda a palavra».
- source_word: מְצַוֶּה אֶתְכֶם
  choice: eu lhes ordeno
  rationale: Mantém explícitos o falante e os destinatários; o presente português comunica adequadamente a força atual e contínua do particípio.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: tenham o cuidado de cumprir
  rationale: Reproduz de modo natural a ideia idiomática de observar atentamente com vistas à execução; «cumprir» é apropriado para uma ordem.
- source_word: לֹא תֹסֵף עָלָיו
  choice: Não acrescentem nada a isso
  rationale: Conserva a proibição direta de adicionar ao conjunto da instrução; «nada» torna explícita em português a abrangência da negação.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: nem tirem nada disso
  rationale: Traduz de forma corrente o sentido de diminuir ou retirar, em paralelismo claro com a proibição anterior.
theological_decisions:
- issue: Numeração do versículo e ligação discursiva
  choice: Traduzir como uma injunção completa e autônoma, sem incorporar conteúdo do versículo seguinte.
  alternative: Em algumas tradições, o texto é numerado como Deuteronômio 12:32 e fica graficamente ligado à seção anterior.
  rationale: O hebraico forma uma ordem completa que também funciona como transição; a diferença de numeração deve ser registrada em nota, não resolvida mediante alteração do texto.
- issue: Alcance de כָּל הַדָּבָר
  choice: Preservar a totalidade da instrução por meio de «Tudo o que».
  alternative: Traduzir literalmente «toda a palavra» ou distributivamente «cada palavra».
  rationale: O singular coletivo permite referência ao conjunto da ordem. A formulação escolhida preserva esse alcance sem sugerir indevidamente apenas vocábulos isolados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «lhes» para o objeto indireto plural e formas verbais no plural para refletir os destinatários coletivos. A nota trata de versificação, não de variante no texto hebraico.
