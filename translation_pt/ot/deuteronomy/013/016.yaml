review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a estrutura, a repetição de לְפִי חָרֶב e o sentido técnico de חרם. Contudo, “ferirá” em português atual normalmente sugere ferimento, não a morte inequívoca indicada pela execução “ao fio da espada” no contexto da ordem de destruição. “Animais” também é mais amplo do que בְּהֶמָה, que aqui se refere aos animais domesticados/de criação da cidade.
  naturalness: “Você certamente ferirá” soa pouco natural e semanticamente brando neste contexto. A formulação revista mantém registro solene e inteligível, com uma ordem clara e sem recorrer a linguagem excessivamente arcaica.
  terminology: “Dedicar ... à destruição” comunica bem o valor de חרם, inclusive sua dimensão de destinação irrevogável. “Animais de criação” representa melhor o coletivo hebraico do que o genérico “animais”. As notas e seus marcadores correspondem às expressões anotadas.
  issues:
  - severity: medium
    issue: “Ferirá” não transmite claramente a execução letal exigida pelo contexto de “ao fio da espada”.
    rationale: Embora נכה possa ser traduzido literalmente por “ferir/golpear”, nesta construção militar a expressão com a espada especifica uma morte violenta. Em português contemporâneo, “ferir” tende a sugerir apenas lesão e pode atenuar indevidamente o enunciado.
  - severity: low
    issue: “Os seus animais” é demasiado genérico para בְּהֶמְתָּהּ.
    rationale: O termo hebraico designa aqui os animais domesticados ou de criação pertencentes à cidade; “animais de criação” mantém a abrangência sem incluir indistintamente toda fauna.
  revised_text: Você deverá matar os habitantes daquela cidade ao fio da espada[b] e dedicá-la à destruição[a], juntamente com tudo o que nela houver e seus animais de criação, ao fio da espada.
