  text: הַכֵּ֣ה תַכֶּ֗ה אֶת יֹֽשְׁבֵ֛י הָ/עִ֥יר ה/הוא לְ/פִי חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧/הּ וְ/אֶת כָּל אֲשֶׁר בָּ֛/הּ וְ/אֶת בְּהֶמְתָּ֖/הּ לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: pt
  text: Você deverá matar os habitantes daquela cidade ao fio da espada[b] e dedicá-la à destruição[a], juntamente com tudo o que nela houver e seus animais de criação, ao fio da espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “colocando-a sob o anátema”. O verbo hebraico indica dedicar algo irrevogavelmente à destruição.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “à boca da espada”, expressão que significa “ao fio da espada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: Você certamente ferirá
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a ordem. “Certamente ferirá” preserva essa ênfase e mantém o verbo נכה, enquanto a expressão seguinte deixa claro o resultado letal.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: os habitantes daquela cidade
  rationale: O particípio יֹשְׁבֵי designa os que residem no lugar; “habitantes” é claro, natural e abrangente em português moderno.
- source_word: לְפִי חָרֶב
  choice: ao fio da espada
  rationale: A expressão significa literalmente “à boca da espada”. “Ao fio da espada” é um equivalente idiomático corrente que preserva a imagem concreta.
- source_word: הַחֲרֵם אֹתָהּ
  choice: dedicando-a à destruição
  rationale: O hifil de חרם indica colocar algo sob ḥērem, destinando-o irrevogavelmente à destruição. A forma escolhida conserva a dimensão sacral e evita o jargão pouco transparente “pôr sob o anátema”.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: junto com tudo o que nela houver
  rationale: A formulação inclui no alcance da ordem tudo o que estiver na cidade e se encaixa naturalmente na sequência da frase.
- source_word: בְּהֶמְתָּהּ
  choice: os seus animais
  rationale: בְּהֵמָה é um coletivo que pode designar animais domésticos ou de criação. “Animais” evita restringir indevidamente o termo apenas ao gado bovino.
- source_word: לְפִי חָרֶב
  choice: ao fio da espada
  rationale: A repetição do idioma hebraico é mantida para conservar a ênfase e o alcance explícito da ordem.
theological_decisions:
- issue: Sentido de חרם no contexto de guerra e juízo
  choice: dedicando-a à destruição
  alternative: destruindo-a completamente; colocando-a sob o anátema
  rationale: A expressão comunica destruição total com uma dimensão de consagração irrevogável. A tradução mantém essa tensão teológica sem reduzir o termo a simples ação militar nem recorrer a linguagem opaca.
- issue: Severidade da linguagem de juízo
  choice: preservar integralmente a força da ordem
  alternative: atenuar com expressões como “derrotar”
  rationale: O hebraico descreve uma ordem letal e abrangente. Atenuá-la introduziria uma mitigação interpretativa sem apoio no texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “ao fio da espada” foi preservada por corresponder à repetição enfática do hebraico. Os marcadores foram posicionados junto às expressões que explicam.
