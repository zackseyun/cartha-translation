revisions:
- from: Você certamente ferirá os habitantes daquela cidade ao fio da espada[b], dedicando-a à destruição[a], junto com tudo o que nela houver e os seus animais, ao fio da espada.
  to: Você deverá matar os habitantes daquela cidade ao fio da espada[b] e dedicá-la à destruição[a], juntamente com tudo o que nela houver e seus animais de criação, ao fio da espada.
  rationale: A revisão substitui “ferirá” por “matar” para evitar que a ordem seja enfraquecida em português, pois o contexto e a expressão repetida “ao fio da espada” tornam explícito o resultado letal. “Animais de criação” torna mais precisa a referência a בְּהֶמָה. Mantêm-se a repetição enfática, a referência pronominal à cidade, a formulação de חרם e os marcadores das notas.
  reviewer_model: gpt-5.6-terra
