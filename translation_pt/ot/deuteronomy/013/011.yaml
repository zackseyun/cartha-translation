  - severity: low
    issue: O único marcador de nota foi deslocado para uma nota cultural, deixando sem ancoragem a alternativa lexical relevante.
    rationale: A separação em duas notas, uma junto de «afastar» e outra junto de «casa da escravidão», torna os respectivos esclarecimentos transparentes e preserva os pontos de anotação pertinentes.
