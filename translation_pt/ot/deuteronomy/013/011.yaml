  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: pt
  text: Você o apedrejará, e ele morrerá, pois procurou afastar você[a] de Yahweh, seu Deus, que tirou você da terra do Egito, da casa da escravidão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «desviar você de Yahweh, seu Deus» ou «induzir você a afastar-se de Yahweh, seu Deus».
    reason: lexical_alternative
  - marker: b
    text: A expressão «casa da escravidão» é uma fórmula da aliança que recorda a libertação de Israel do Egito.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים
  choice: Você o apedrejará
  rationale: O perfeito com waw em instrução legal tem força injuntiva. O verbo português “apedrejar” já expressa naturalmente o uso de pedras, evitando a redundância pouco idiomática “apedrejar com pedras”.
- source_word: וָמֵת
  choice: e ele morrerá
  rationale: Mantém explícito o resultado da execução e preserva a sequência solene do hebraico.
- source_word: כִּי בִקֵּשׁ
  choice: porque procurou
  rationale: Expressa a causa da sentença e conserva a ideia de intenção ou tentativa deliberada presente em בקש.
- source_word: לְהַדִּיחֲךָ מֵעַל
  choice: afastar você de
  rationale: Reproduz a força causativa de נדח e a ruptura de lealdade indicada por מֵעַל, em português corrente, sem restringir o sentido à sedução verbal.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Translitera o nome divino e conserva a relação pactual expressa pelo possessivo.
- source_word: הַמּוֹצִיאֲךָ מֵאֶרֶץ מִצְרַיִם
  choice: que o tirou da terra do Egito
  rationale: O particípio descreve Yahweh por seu ato histórico de libertação; o pretérito é natural neste contexto.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa da escravidão
  rationale: Preserva de modo claro e relativamente formal a metáfora hebraica e sua fórmula memorial da libertação do Egito.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título.
- issue: Sentido da apostasia em לְהַדִּיחֲךָ מֵעַל יְהוָה
  choice: afastar você de Yahweh
  alternative: desviar você de Yahweh; induzir você a abandonar Yahweh
  rationale: “Afastar” preserva a causatividade e a ruptura relacional, sem decidir se o meio empregado foi engano, persuasão ou coerção.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção legal “Você o apedrejará” mantém a solenidade injuntiva; “apedrejar” evita repetir desnecessariamente “com pedras”. O pronome objeto singular masculino acompanha o referente do contexto.
