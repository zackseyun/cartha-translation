  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: a injunção judicial, o resultado de morte, a intenção de afastar da lealdade a Yahweh e a fórmula do êxodo estão presentes. «Apedrejar» já inclui naturalmente o emprego de pedras em português. Convém, porém, conservar em nota a faixa semântica de נדח no hifil, como faz a trilha de auditoria inglesa.'
  naturalness: O registro é moderno e adequadamente solene. «Você o apedrejará» é compreensível em registro jurídico-bíblico. Na oração relativa, «que tirou você» evita que «o tirou» seja lido, ainda que improvavelmente, como referência ao homem condenado.
  terminology: «Yahweh», «seu Deus» e «casa da escravidão» são escolhas adequadas e consistentes. «Afastar você de» é uma boa tradução não confessional para a ruptura de lealdade expressa no hebraico.
