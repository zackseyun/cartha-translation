  naturalness: A redação é clara e adequada ao registro jurídico. “Indague cuidadosamente” é igualmente natural em português moderno e preserva melhor a progressão verbal do hebraico. “E veja:” oferece uma forma corrente de representar o marcador discursivo sem o artificialismo de “e eis que” neste contexto.
  terminology: “Abominação” preserva apropriadamente a força de תּוֹעֵבָה. “Esta abominação” reflete de modo mais direto o demonstrativo hebraico הַזֹּאת, sem prejuízo de naturalidade.
