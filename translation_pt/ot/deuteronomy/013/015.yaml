  text: וְ/דָרַשְׁתָּ֧ וְ/חָקַרְתָּ֧ וְ/שָׁאַלְתָּ֖ הֵיטֵ֑ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/קִרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: pt
  text: 'Investigue, examine e indague cuidadosamente. E veja: se for verdade e estiver comprovado[a] que esta abominação foi cometida no meio de vocês,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se a denúncia for verdadeira e o fato ficar confirmado”.'
    reason: A fórmula hebraica também pode ser explicitada com “a denúncia” e “o fato”, tornando visível o substantivo הַדָּבָר (“assunto”, “fato” ou “relato”).
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: investigue
  rationale: No contexto jurídico, דרש indica realizar uma investigação; “investigue” é atual, claro e mantém a força injuntiva da forma verbal.
- source_word: וְחָקַרְתָּ
  choice: examine
  rationale: חקר acrescenta a ideia de exame minucioso. “Examine” distingue este verbo do anterior sem tornar a sequência artificial.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: faça uma apuração cuidadosa
  rationale: שאל significa perguntar ou inquirir, e הֵיטֵב intensifica a ação. Em linguagem jurídica portuguesa, “faça uma apuração cuidadosa” comunica uma investigação completa e diligente.
- source_word: וְהִנֵּה
  choice: Se
  rationale: Aqui הנה introduz o resultado constatado após a investigação. Em português corrente, a construção condicional “Se for verdade” expressa naturalmente essa função, sem recorrer ao pouco idiomático “e eis que”.
- source_word: אֱמֶת
  choice: for verdade
  rationale: אמת funciona de modo predicativo na fórmula de confirmação; “for verdade” é a expressão portuguesa natural.
- source_word: נָכוֹן
  choice: ficar comprovado
  rationale: נכון indica que o assunto foi estabelecido ou confirmado. “Ficar comprovado” preserva o caráter judicial e probatório da expressão.
- source_word: הַדָּבָר
  choice: '[implícito na oração introduzida por “que”]'
  rationale: O substantivo significa “o assunto” ou “o fato”, mas a sintaxe portuguesa comunica seu referente com mais naturalidade por meio da oração “que essa abominação foi cometida”.
- source_word: נֶעֶשְׂתָה
  choice: foi cometida
  rationale: A forma verbal indica que o ato ocorreu. Com “abominação”, “foi cometida” é idiomático e conserva a responsabilidade moral envolvida, sem identificar antecipadamente o agente.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: essa abominação
  rationale: תועבה é um termo forte para algo abominável no contexto da aliança. “Abominação” preserva sua gravidade; “essa” retoma naturalmente o delito mencionado no contexto anterior.
- source_word: בְּקִרְבֶּךָ
  choice: no meio de vocês
  rationale: A expressão localiza o ato dentro da comunidade. Embora o hebraico use a segunda pessoa singular coletiva, “vocês” torna explícito o referente comunitário em português moderno.
theological_decisions:
- issue: Fórmula de verificação judicial
  choice: “Se for verdade e ficar comprovado que essa abominação foi cometida...”
  alternative: “Se a denúncia for verdadeira e o fato ficar comprovado — essa abominação foi cometida...”
  rationale: A sequência hebraica acumula verbos de investigação e culmina numa fórmula de confirmação. A redação escolhida mantém a exigência de prova antes da ação judicial e evita resolver além do necessário se הַדָּבָר significa especificamente “denúncia”, “fato” ou “assunto”.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário jurídico acessível. A coordenação de três ações conserva a insistência hebraica numa averiguação rigorosa. A vírgula final foi mantida porque o versículo forma uma oração condicional que prossegue no versículo seguinte.
