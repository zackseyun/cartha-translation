review_pass:
  verdict: revise
  source_fidelity: A estrutura condicional, «surgir», «no meio de vocês», «profeta», «sinal» e «prodígio» correspondem bem ao hebraico. Contudo, «lhes anunciar» não traduz adequadamente וְנָתַן אֵלֶיךָ (“der a vocês”); introduz a noção de mera proclamação e pode excluir a apresentação ou realização do sinal. «Alguém que tenha sonhos» também é mais genérico que o particípio hebraico que designa um sonhador.
  naturalness: O português é claro e de registro apropriado. «Um sonhador» é idiomático e, neste contexto paralelo a «profeta», designa naturalmente a pessoa caracterizada por sonhos.
  terminology: «Profeta», «sinal» e «prodígio» são escolhas estabelecidas e não impõem uma interpretação sobre a natureza do fenômeno. A alternativa «presságio» é lexicalmente defensável para מוֹפֵת.
  issues:
  - severity: medium
    issue: «e lhes anunciar» para וְנָתַן אֵלֶיךָ
    rationale: O verbo נתן significa “dar” nesta construção. “Anunciar” acrescenta conteúdo verbal e pode sugerir que o sinal é apenas predito, em vez de dado/apresentado.
  - severity: low
    issue: «alguém que tenha sonhos» para חֹלֵם חֲלוֹם
    rationale: A expressão hebraica identifica um “sonhador”, não apenas qualquer pessoa que tenha sonhos. A formulação proposta preserva melhor a designação sem soar artificial.
  revised_text: Se surgir no meio de vocês um profeta ou um sonhador e lhes der um sinal ou um prodígio,[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: “um sinal ou um presságio”.'
    reason: lexical_alternative
  revision_rationale: A revisão restaura o sentido de “dar” em וְנָתַן e torna mais precisa a designação חֹלֵם חֲלוֹם, preservando a concisão, o registro moderno e a abertura da condição, que continua no versículo seguinte.
