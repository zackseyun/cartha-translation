base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: pt
  text: Se surgir no meio de vocês um profeta ou um sonhador e lhes der um sinal ou um prodígio,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sinal ou um presságio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Neste contexto legal, introduz uma condição cuja continuação aparece no versículo seguinte.
- source_word: יָקוּם
  choice: surgir
  rationale: Expressa o aparecimento de tal pessoa dentro da comunidade, em português atual e natural.
- source_word: בְּקִרְבְּךָ
  choice: no meio de vocês
  rationale: Preserva o cenário comunitário e verte naturalmente a expressão hebraica.
- source_word: נָבִיא
  choice: profeta
  rationale: Equivalente padrão e claro para o termo hebraico.
- source_word: חֹלֵם חֲלוֹם
  choice: alguém que tenha sonhos
  rationale: Comunica de modo natural o particípio com substantivo cognato, mantendo essa figura distinta do profeta sem produzir uma formulação artificial em português.
- source_word: וְנָתַן אֵלֶיךָ
  choice: e lhes anunciar
  rationale: No encadeamento condicional, a forma tem valor prospectivo; 'anunciar' exprime que a pessoa apresenta o sinal ou prodígio à comunidade, sem afirmar que ela o produz.
- source_word: אוֹת
  choice: um sinal
  rationale: Mantém o sentido evidencial ou confirmatório comum do termo.
- source_word: מוֹפֵת
  choice: um prodígio
  rationale: Preserva a ideia de uma ocorrência extraordinária ou portentosa e forma uma combinação portuguesa digna com 'sinal'.
theological_decisions:
- issue: Natureza do sinal ou prodígio apresentado pelo profeta ou sonhador
  choice: um sinal ou um prodígio
  alternative: um sinal milagroso ou uma maravilha
  rationale: O texto não determina aqui se o fenômeno é realmente milagroso, enganoso ou apenas alegado. A tradução mantém essa tensão sem acrescentar um juízo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com plural comunitário explícito. A construção permanece aberta, pois a condição continua no versículo seguinte.
