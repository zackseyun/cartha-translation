base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: pt
  text: 'Se[a] você ouvir dizer, em uma das suas cidades que Yahweh, seu Deus, lhe dá para morar ali:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Quando». A conjunção hebraica pode introduzir uma condição ou uma circunstância temporal em textos legais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Neste contexto jurídico casuístico, introduz a situação condicional desenvolvida nos versículos seguintes, embora também possa ter valor temporal.
- source_word: תִשְׁמַע
  choice: você ouvir dizer
  rationale: O verbo se refere aqui a tomar conhecimento de uma notícia ou denúncia; a expressão portuguesa comunica naturalmente esse sentido.
- source_word: בְּאַחַת עָרֶיךָ
  choice: em uma das cidades
  rationale: עִיר pode designar cidade ou povoado; «cidades» é claro, abrangente e adequado ao contexto dos assentamentos israelitas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a fórmula pactual e o tratamento direto na segunda pessoa do singular.
- source_word: נֹתֵן לְךָ
  choice: lhe dá
  rationale: O presente português expressa de modo natural a ação divina vigente e característica indicada pelo particípio hebraico.
- source_word: לָשֶׁבֶת שָׁם
  choice: para morar ali
  rationale: Expressa a finalidade da concessão das cidades; «morar» é atual e acessível, enquanto «ali» preserva שָׁם.
- source_word: לֵאמֹר
  choice: 'dizer ... :'
  rationale: Introduz o conteúdo da notícia apresentado no versículo seguinte; os dois-pontos reproduzem naturalmente sua função citativa em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; «Yahweh» preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Ouvir dizer» evita uma construção artificial e conserva a ideia de receber uma notícia; os dois-pontos deixam claro que o conteúdo prossegue no versículo seguinte.
