base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: pt
  text: Sigam Yahweh, seu Deus[a]; temam-no, guardem os seus mandamentos, escutem a sua voz[b], sirvam-no e apeguem-se a ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Andem após Yahweh, seu Deus”. O hebraico diz literalmente: “Andem após Yahweh, seu Deus”.'
    reason: lexical_alternative
  - marker: b
    text: “Escutem a sua voz” também pode ter o sentido de “obedeçam-lhe” ou “obedeçam à sua voz”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Permaneçam unidos a ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי ... תֵּלֵכוּ
  choice: Andem após
  rationale: Preserva a metáfora hebraica de caminhar atrás de alguém em lealdade, embora “sigam” seja uma formulação portuguesa mais direta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Reproduz a relação de aliança indicada pelo sufixo hebraico de segunda pessoa do plural; “seu” é natural no português brasileiro e amplamente compreensível.
- source_word: תִירָאוּ
  choice: temam-no
  rationale: Mantém o peso pactual de ירא, que inclui temor, reverência e assombro, sem reduzi-lo apenas a “reverenciar”.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: guardem os seus mandamentos
  rationale: “Guardar” é uma formulação bíblica natural para observar fielmente os mandamentos e conserva a imagem de cuidado vigilante presente em שׁמר.
- source_word: וּבְקֹלוֹ תִּשְׁמָעוּ
  choice: escutem a sua voz
  rationale: Preserva a expressão explícita do hebraico, deixando que o contexto comunique também a ideia de obediência.
- source_word: תַעֲבֹדוּ
  choice: sirvam-no
  rationale: עבד abrange serviço e culto; “servir” conserva essa amplitude sem restringir o sentido somente ao ato de adoração.
- source_word: תִדְבָּקוּן
  choice: apeguem-se a ele
  rationale: Expressa a ligação estreita e a lealdade persistente de דבק em português corrente e digno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico apresenta o nome pessoal, não um título. “Yahweh” conserva explicitamente o tetragrama segundo a convenção do projeto, enquanto “SENHOR” o substituiria e “Javé” adotaria uma forma aportuguesada diferente.
- issue: Se שׁמע בְּקוֹל deve ser explicitado como obediência
  choice: escutem a sua voz
  alternative: obedeçam à sua voz; obedeçam-lhe
  rationale: A construção frequentemente implica obediência, mas sua forma verbal menciona escutar a voz. O texto principal mantém essa imagem e a nota registra a força obediencial.
- issue: Amplitude cultual de עבד
  choice: sirvam-no
  alternative: adorem-no
  rationale: No relacionamento com Deus, o verbo pode incluir culto, mas também expressa serviço e lealdade de modo mais amplo; “sirvam-no” evita estreitar indevidamente o sentido.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais no imperativo plural para comunicar a força exortativa dos imperfeitos hebraicos. Mantém-se a metáfora pactual “andar após” no texto principal, esclarecida por uma alternativa mais idiomática em nota. Os pronomes enclíticos conferem fluidez sem elevar excessivamente o registro.
