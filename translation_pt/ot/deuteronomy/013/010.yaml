    issue: «para lhe dar a morte»
    rationale: A expressão é pouco natural no português contemporâneo e pode soar como um calque desnecessário. «Para matá-lo» exprime diretamente o infinitivo לַהֲמִיתוֹ no contexto de execução judicial.
  - severity: low
    issue: «matá-lo sem falta»
    rationale: Embora compreensível, «sem falta» tem registro mais coloquial e não transmite tão naturalmente a ênfase jurídico-mandatória da construção hebraica. «Deverá certamente matá-lo» é mais claro e digno.
  - severity: low
    issue: «a sua mão será a primeira contra ele»
    rationale: A tradução é muito literal e fica truncada em português. Acrescentar «a agir» explicita apenas o verbo implicado pela imagem da mão, sem ampliar o sentido.
  revised_text: Pois você deverá certamente matá-lo[a]; sua mão será a primeira a agir contra ele para matá-lo, e depois a mão de todo o povo.
