review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e os elementos essenciais do hebraico foram preservados: a partícula causal, a ênfase do infinitivo absoluto com verbo finito, a imagem de «mão», a prioridade do destinatário e a ação posterior de todo o povo. A revisão substitui uma expressão portuguesa pouco idiomática sem alterar o sentido judicial do texto.'
  naturalness: «Dar a morte» não é uma formulação natural no português moderno neste contexto e soa artificial. «Sua mão será a primeira a agir contra ele» torna inteligível a construção hebraica preservando a metáfora jurídica de «mão». «Você deverá certamente matá-lo» comunica com mais naturalidade a obrigação enfática do que «matá-lo sem falta».
  terminology: «Matar» é apropriado para הרג neste enunciado legal; a repetição em «para matá-lo» é aceitável e clara em português, sem exigir uma distinção estilística artificial entre הרג e o hifil de מות. «Todo o povo» preserva כָּל־הָעָם.
  issues:
