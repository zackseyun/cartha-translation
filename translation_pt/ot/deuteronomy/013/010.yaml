base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: pt
  text: Pois você deverá certamente matá-lo[a]; sua mão será a primeira a agir contra ele para matá-lo, e depois a mão de todo o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente o matará”. O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da ordem anterior e mantém de modo natural a ligação lógica com o contexto.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: você deverá matá-lo sem falta
  rationale: A construção hebraica com infinitivo absoluto e verbo finito intensifica a ação, expressando forte obrigação ou certeza. A formulação preserva a ênfase sem soar artificial em português.
- source_word: יָדְךָ
  choice: a sua mão
  rationale: Mantém a imagem concreta e jurídica do hebraico, além do paralelismo com “a mão de todo o povo”.
- source_word: תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: será a primeira contra ele
  rationale: Expressa a prioridade da pessoa que denunciou o culpado na execução da sentença e conserva o sentido adversativo da construção.
- source_word: לַהֲמִיתוֹ
  choice: para lhe dar a morte
  rationale: O hifil de מות indica causar a morte. Esta formulação mantém o caráter formal e judicial do contexto sem eliminar a distinção verbal presente no hebraico.
- source_word: וְיַד כָּל הָעָם
  choice: e depois a mão de todo o povo
  rationale: Preserva o paralelismo explícito entre a mão do indivíduo e a mão da comunidade, bem como a participação coletiva determinada pela lei.
- source_word: בָּאַחֲרֹנָה
  choice: depois
  rationale: Em contraste com “a primeira”, indica a ação subsequente do restante do povo.
theological_decisions:
- issue: Como expressar a execução judicial sem suavizar nem intensificar indevidamente a linguagem
  choice: matá-lo sem falta / para lhe dar a morte
  alternative: executá-lo / certamente o matará
  rationale: A redação comunica claramente a pena capital no contexto jurídico da aliança, preservando tanto a ênfase hebraica quanto a distinção entre הרג e o causativo de מות, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com “você” para representar o destinatário singular e favorecer a legibilidade brasileira. A repetição de “mão” foi mantida por seu valor jurídico e retórico.
