base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: pt
  text: Não ceda a ele[a] nem lhe dê ouvidos; não olhe para ele com piedade[b], não o poupe nem o encubra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não consinta com ele”. O verbo hebraico pode indicar estar disposto, consentir ou ceder.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que o seu olho não tenha piedade dele”, expressão hebraica para não olhar para alguém com compaixão.
    reason: cultural_note
  - marker: c
    text: Ou “não o esconda”. A expressão pode se referir a ocultar a pessoa ou a encobrir sua culpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לּוֹ
  choice: ceda a ele
  rationale: אָבָה no qal expressa disposição, consentimento ou aquiescência. “Ceder a ele” comunica de modo natural a recusa em aceitar a persuasão do instigador, sem restringir o sentido a simples concordância verbal.
- source_word: תִשְׁמַע אֵלָיו
  choice: lhe dê ouvidos
  rationale: שׁמע com אֶל significa escutar ou atender. “Dar ouvidos” expressa escuta receptiva, e não apenas percepção auditiva, sem chegar a traduzir explicitamente como obediência.
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: olhe para ele com piedade
  rationale: חוּס pode significar olhar com piedade, compadecer-se ou poupar. A formulação conserva a imagem visual do hebraico, mas evita em português a construção pouco natural “seu olho não terá piedade”.
- source_word: תַחְמֹל
  choice: poupe
  rationale: חמל denota compaixão ou o ato de poupar. “Poupar” distingue este verbo da proibição anterior referente à piedade e mantém a força cumulativa da sequência.
- source_word: תְכַסֶּה עָלָיו
  choice: o encubra
  rationale: כסה no piel significa cobrir ou ocultar. “Encobrir” preserva a possibilidade de esconder a pessoa, proteger o culpado ou ocultar sua culpa, sem decidir silenciosamente entre essas nuances.
theological_decisions:
- issue: Preservação da linguagem judicial severa no contexto da incitação à apostasia
  choice: Manter a sequência direta de proibições, sem amenizar sua força.
  alternative: Parafrasear o texto como mera desaprovação emocional ou reduzir a sequência a “não o proteja”.
  rationale: O contexto legal exige que o ouvinte não consinta, não dê atenção receptiva, não se deixe mover por piedade, não poupe e não encubra o instigador. A tradução conserva a progressão e a tensão do texto sem inserir uma harmonização doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo negativo foi preservado, enquanto “lhe dê ouvidos” e “olhe para ele com piedade” tornam naturais dois sentidos idiomáticos do hebraico. Todos os marcadores aparecem no texto principal em ordem.
