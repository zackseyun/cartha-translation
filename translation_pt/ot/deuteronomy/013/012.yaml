  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: pt
  text: E todo o Israel ouvirá e temerá, e não voltará a praticar uma maldade como esta em teu meio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre vocês”. O hebraico emprega uma forma de tratamento singular, dirigindo-se a Israel como um todo coletivo.
    reason: alternativa lexical e esclarecimento do singular corporativo
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: E todo o Israel
  rationale: כָּל com o nome próprio יִשְׂרָאֵל designa o povo inteiro coletivamente. “Todo o Israel” é corrente, digno e mantém essa dimensão corporativa.
- source_word: יִשְׁמְעוּ
  choice: ouvirá
  rationale: O imperfeito qal tem valor futuro ou resultante no contexto legal. Embora o verbo hebraico esteja no plural, o português normalmente faz a concordância de “todo o Israel” no singular.
- source_word: וְיִרָאוּן
  choice: e temerá
  rationale: יָרֵא aqui indica temor que produz efeito dissuasório. “Temerá” preserva a concisão e não reduz o sentido a mero susto.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: e não voltará a fazer
  rationale: A construção de יסף no hifil com infinitivo significa acrescentar, continuar ou tornar a fazer. “Não voltará a fazer” expressa naturalmente a não repetição do ato.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: uma coisa má como esta
  rationale: דָּבָר pode significar palavra, assunto ou coisa; neste contexto refere-se ao ato mencionado. A formulação mantém tanto a comparação indicada por כַּ quanto a avaliação moral de רַע.
- source_word: בְּקִרְבֶּךָ
  choice: no seu meio
  rationale: A expressão significa literalmente “em teu meio”. “No seu meio” é natural em português e permite que a nota esclareça o tratamento singular corporativo.
theological_decisions:
- issue: Número da forma de tratamento na linguagem da aliança
  choice: Preservar no texto a ideia corporativa com “no seu meio” e explicá-la em nota
  alternative: “entre vocês”
  rationale: O sufixo hebraico é masculino singular e dirige-se a Israel como um só povo. A tradução evita converter silenciosamente essa forma em plural, sem recorrer ao pouco natural “em teu meio” neste registro.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A concordância verbal singular segue o uso português com o sujeito coletivo “todo o Israel”; a nota conserva a particularidade da forma hebraica de tratamento.
