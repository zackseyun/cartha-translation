source:
  edition: WLC
  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: pt
  text: Não deem ouvidos às palavras daquele profeta nem às daquele que sonha sonhos, pois Yahweh, o Deus de vocês, está pondo vocês à prova, para saber se vocês amam[a] Yahweh, o Deus de vocês, de todo o coração e de toda a alma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se vocês estão amando”. O hebraico emprega um particípio, que pode destacar um estado ou uma disposição contínua; o presente simples é mais natural em português.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “alma” também pode significar “vida”, “pessoa” ou “ser”. Nesta fórmula da aliança, “alma” preserva a redação tradicional e sua importância intertextual.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: Não deem ouvidos a
  rationale: שׁמע com אֶל significa ouvir ou atender, com implicação de acatamento. “Dar ouvidos a” preserva em português tanto a dimensão auditiva quanto a obediencial da proibição.
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא
  choice: às palavras daquele profeta
  rationale: Mantém o plural דִּבְרֵי, “palavras”, e representa naturalmente a combinação do artigo com o demonstrativo הַהוּא, que identifica o profeta mencionado anteriormente.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: às daquele que sonha sonhos
  rationale: A repetição cognata do hebraico é preservada por “sonha sonhos”, evitando reduzir a expressão simplesmente a “sonhador”. “Às” retoma “palavras” sem uma repetição pesada em português.
- source_word: מְנַסֶּה
  choice: está pondo vocês à prova
  rationale: O piel de נסה expressa testar ou provar. A locução é corrente e clara em português e conserva o aspecto em curso do particípio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Representa de modo claro o substantivo com sufixo de segunda pessoa masculina plural e tem ampla legibilidade no português brasileiro.
- source_word: לָדַעַת
  choice: para saber
  rationale: Conserva diretamente o infinitivo hebraico e sua formulação antropomórfica, sem reinterpretá-lo como “revelar” ou “mostrar”.
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: se vocês amam
  rationale: O particípio descreve um estado ou disposição contínua. O presente simples é a forma natural em português para expressar esse sentido sem sugerir apenas uma ação momentânea.
- source_word: בְּכָל לְבַבְכֶם
  choice: de todo o coração
  rationale: “Coração” preserva a linguagem pactual tradicional e abrange aqui a interioridade, a vontade e o pensamento.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: e de toda a alma
  rationale: נֶפֶשׁ pode designar alma, vida, pessoa ou ser. “Alma” mantém a fórmula tradicional e sua continuidade intertextual, enquanto a nota registra a amplitude lexical.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio pactual. A transliteração “Yahweh” o conserva, sem substituí-lo por um título.
- issue: Deus põe o povo à prova “para saber”
  choice: Manter literalmente “para saber”
  alternative: “para revelar” ou “para mostrar” se vocês amam
  rationale: A formulação hebraica produz uma tensão teológica real. Alterá-la para “revelar” ou “mostrar” resolveria interpretativamente uma questão que o versículo deixa aberta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O plural “vocês” torna explícito que a exortação se dirige ao povo. A expressão cognata “sonha sonhos” é deliberadamente preservada por refletir o hebraico, enquanto “dar ouvidos” comunica com naturalidade a ideia de ouvir e acatar.
