base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: pt
  text: se você ouvir a voz de Yahweh, seu Deus, para guardar todos os seus mandamentos que hoje lhe ordeno e para fazer o que é certo aos olhos de Yahweh, seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: se
  rationale: Neste contexto, introduz a condição da qual depende a promessa anterior.
- source_word: תִשְׁמַע בְּקוֹל
  choice: ouvir a voz
  rationale: Preserva a imagem auditiva do idioma hebraico, que neste contexto implica atenção obediente sem reduzi-lo simplesmente a 'obedecer'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לִשְׁמֹר
  choice: guardando
  rationale: Expressa a observância cuidadosa dos mandamentos e liga naturalmente o infinitivo à condição precedente.
- source_word: כָּל מִצְוֺתָיו
  choice: todos os seus mandamentos
  rationale: Mantém explicitamente a totalidade e o caráter pactual e normativo de מִצְוָה.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: que hoje lhe ordeno
  rationale: Reproduz de modo natural em português o ato de ordenar realizado no discurso presente.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: fazendo o que é certo
  rationale: Comunica a prática daquilo que é reto, ligando-a de forma clara à observância dos mandamentos.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva o idioma hebraico de avaliação ou julgamento, também transparente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Nuance obediencial de שׁמע בקול
  choice: ouvir a voz
  alternative: obedecer
  rationale: A expressão implica obediência, mas a formulação escolhida conserva a metáfora auditiva e a dimensão pessoal do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A formulação mantém o fluxo da condição iniciada no versículo anterior; por isso começa com letra minúscula.
