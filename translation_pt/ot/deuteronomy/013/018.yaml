base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: pt
  text: E que nada do que foi consagrado à destruição se apegue às suas mãos[a], para que Yahweh se afaste do furor de sua ira, lhe conceda misericórdia, tenha compaixão de você e faça você crescer em número, como jurou aos seus pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «nada do que está sob a interdição se apegue às suas mãos». O hebraico חֵרֶם designa algo irrevogavelmente consagrado a Deus, muitas vezes para destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: fique em suas mãos
  rationale: O verbo דבק traz a imagem de algo que adere ou permanece ligado; com «mão», a expressão indica reter ou tomar posse. A formulação portuguesa comunica naturalmente essa ideia sem perder a metáfora corporal.
- source_word: מְאוּמָה מִן הַחֵרֶם
  choice: nada do que foi consagrado à destruição
  rationale: Com a negação, מְאוּמָה significa «nada». חֵרֶם designa algo irrevogavelmente consagrado a Deus, neste contexto para destruição; a tradução torna explícito esse sentido sem recorrer ao termo opaco «anátema».
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Yahweh deixe o furor da sua ira
  rationale: שׁוב מן expressa afastar-se ou deixar algo. חֲרוֹן אַף é uma expressão idiomática de ira intensa; «furor da sua ira» preserva a força do hebraico em português digno e compreensível.
- source_word: וְנָתַן לְךָ רַחֲמִים
  choice: tenha misericórdia de você
  rationale: Literalmente, a construção fala em «dar misericórdias/compaixão». A forma idiomática escolhida comunica com clareza a ação misericordiosa de Deus.
- source_word: וְרִחַמְךָ
  choice: se compadeça de você
  rationale: A escolha distingue o verbo רחם do substantivo precedente e conserva a intensificação por termos próximos presente no hebraico.
- source_word: וְהִרְבֶּךָ
  choice: o multiplique
  rationale: O hifil de רבה significa fazer numeroso. «Multiplique» preserva a ressonância da promessa de numerosa descendência feita aos patriarcas.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: como jurou aos seus pais
  rationale: «Como» expressa a comparação, e «pais» mantém a referência específica aos patriarcas da aliança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; «Yahweh» preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Sentido de חֵרֶם
  choice: o que foi consagrado à destruição
  alternative: o anátema; o que está sob proibição
  rationale: No contexto, trata-se de bens irrevogavelmente destinados a Deus mediante destruição. A formulação explicita o conceito sem acrescentar uma interpretação denominacional.
- issue: Linguagem da ira divina
  choice: deixe o furor da sua ira
  alternative: afaste-se do ardor da sua ira
  rationale: A tradução mantém a representação pessoal e intensa da ira divina, mas verte idiomaticamente a expressão corporal hebraica ligada ao nariz.
- issue: Referência a אֲבֹתֶיךָ
  choice: seus pais
  alternative: seus antepassados
  rationale: O hebraico aponta especificamente para os pais patriarcais ligados à promessa; «pais» conserva essa precisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular «você/suas» reflete o destinatário singular do hebraico. Evitou-se «anátema» por ser pouco transparente no uso corrente.
