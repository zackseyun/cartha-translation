  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: pt
  text: dos deuses dos povos que estão ao redor de vocês, quer perto de você, quer longe de você, de uma extremidade da terra à outra[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de uma extremidade do país à outra”. O hebraico אֶרֶץ pode significar tanto “terra” como “país”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: dos deuses de
  rationale: A preposição מִן introduz aqui os deuses entre os quais poderia vir a proposta mencionada no contexto; em português, a formulação concisa “dos deuses dos povos” expressa naturalmente essa relação.
- source_word: הָעַמִּים
  choice: os povos
  rationale: O plural עַמִּים designa coletividades étnicas; “povos” conserva essa nuance melhor que “nações” neste contexto.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: que estão ao redor de vocês
  rationale: Mantém o sentido espacial da expressão hebraica e o pronome no plural.
- source_word: הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: quer perto de você, quer longe de você
  rationale: Reproduz o contraste de proximidade e distância, preservando também a passagem do plural anterior para o singular coletivo presente no hebraico.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: de uma extremidade da terra à outra
  rationale: A expressão indica toda a extensão geográfica concebível. A formulação portuguesa é natural e conserva a força abrangente do idioma, enquanto a nota registra a alternativa lexical “país”.
theological_decisions:
- issue: Alcance de הָאָרֶץ na expressão final
  choice: terra
  alternative: país
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto um território ou país. Neste contexto, a expressão de uma extremidade à outra parece enfatizar o alcance geográfico mais amplo, mas a alternativa mais restrita permanece possível e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a mudança do plural “vocês” para o singular “você” existente no hebraico, tratando Israel ao mesmo tempo como comunidade e como unidade coletiva. O travessão final indica que a frase continua no contexto.
