  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: pt
  text: 'Se seu irmão, filho de sua mãe, ou seu filho, ou sua filha, ou a esposa que você acolhe nos braços[a], ou seu amigo, que é como sua própria vida[b], induzir você em segredo, dizendo: “Vamos e sirvamos a outros deuses” — deuses que nem você nem seus pais conheceram —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a esposa do seu regaço”, expressão que indica a esposa com quem se tem a mais estreita intimidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que é como sua própria alma” ou “como você mesmo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: tentar seduzir você
  rationale: O hifil de סות expressa atrair, instigar ou induzir alguém a determinada conduta. “Tentar seduzir” conserva a ideia de atração enganosa sem especificar um meio que o hebraico não explicita.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: seu irmão, filho de sua mãe
  rationale: Mantém a aposição explícita do hebraico e sua ênfase no parentesco mais próximo.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: a esposa que você acolhe nos braços
  rationale: חֵיק pode indicar colo, peito ou regaço e, nesta expressão, comunica intimidade conjugal. A formulação preserva a imagem em português atual, sem recorrer ao arcaico “esposa do seu seio”.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: seu amigo, que é como sua própria vida
  rationale: נֶפֶשׁ pode significar vida, pessoa ou ser. “Como sua própria vida” comunica a intensidade da afeição e preserva a imagem sem impor uma antropologia específica.
- source_word: בַּסֵּתֶר
  choice: em segredo
  rationale: Reproduz diretamente o valor adverbial da expressão hebraica e qualifica o ato de seduzir.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Vamos servir
  rationale: As formas coortativas exprimem convite ou exortação conjunta. Em português, “vamos servir” comunica naturalmente tanto o movimento proposto quanto o serviço religioso; a ideia de ir fica incorporada na construção idiomática “vamos”.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É a correspondência direta de אֲחֵרִים e evita interpretar o termo como “estrangeiros”.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: deuses que nem você nem seus pais conheceram
  rationale: A construção “nem... nem...” explicita naturalmente em português a negação aplicada ao destinatário e a seus antepassados, mantendo o sentido de conhecimento ou reconhecimento religioso.
theological_decisions:
- issue: Preservação da intensidade das relações familiares e pessoais
  choice: Manter “filho de sua mãe”, a imagem da esposa acolhida nos braços e o amigo comparado à própria vida.
  alternative: Generalizar como “seu próprio irmão”, “sua amada esposa” e “seu melhor amigo”.
  rationale: A enumeração hebraica acentua que até as relações humanas mais íntimas podem tornar-se ocasião de deslealdade religiosa. Preservar suas imagens mantém essa força retórica sem acrescentar interpretação.
- issue: Sentido de עבד diante de outros deuses
  choice: servir
  alternative: adorar
  rationale: עבד inclui culto, mas possui o sentido mais amplo de prestar serviço a uma divindade. “Servir” conserva essa amplitude lexical.
- issue: Sentido de נֶפֶשׁ na descrição do amigo
  choice: própria vida
  alternative: própria alma
  rationale: Neste contexto, נֶפֶשׁ expressa apego pessoal extremo e pode ser entendido como vida ou ser. “Vida” evita reduzir o termo a uma noção exclusivamente imaterial, enquanto a nota preserva a alternativa formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe condicional e o travessão final foram mantidos porque a frase prossegue no versículo seguinte. As imagens hebraicas de intimidade foram conservadas em formulações naturais e esclarecidas em notas.
