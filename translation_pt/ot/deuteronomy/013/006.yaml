    rationale: חֹלֵם הַחֲלוֹם é literalmente «o sonhador daquele sonho» e identifica a pessoa como sonhador, não meramente como alguém que teve um sonho.
  - severity: medium
    issue: «Falou rebeldia» é construção pouco natural em português.
    rationale: Embora reflita formalmente «falou rebelião», a formulação portuguesa soa deficiente. «Proferiu rebelião contra» conserva o objeto lexical e o sentido de fala hostil contra Yahweh.
