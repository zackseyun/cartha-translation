  verdict: revise
  source_fidelity: A tradução preserva bem a estrutura jurídica, o nome Yahweh, a referência ao êxodo, o resgate da escravidão, o desvio do caminho e a fórmula final. Contudo, «aquele que teve aquele sonho» descreve alguém que simplesmente teve um sonho, em vez de «o sonhador daquele sonho»; e «falou rebeldia» é pouco idiomático em português para o hebraico דִּבֶּר סָרָה.
  naturalness: O registro é em geral claro e moderno. «O sonhador daquele sonho» mantém a repetição enfática do hebraico de modo aceitável em registro bíblico-jurídico. «Proferiu rebelião» é mais natural e preciso do que «falou rebeldia».
  terminology: «Yahweh», «resgatou», «casa da escravidão», «caminho» e «eliminem o mal» são escolhas adequadas. «Rebelião» comunica melhor em português o desvio hostil da fidelidade de aliança expresso por סָרָה, sem excluir a alternativa «apostasia» em nota.
