  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: pt
  text: Mas aquele profeta ou o sonhador daquele sonho deverá ser morto, porque proferiu rebelião[a] contra Yahweh, o Deus de vocês, que os tirou da terra do Egito e os resgatou da casa da escravidão[b], a fim de desviá-los do caminho em que Yahweh, o Deus de vocês, lhes ordenou andar. Assim, eliminem o mal do meio de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apostasia”. A expressão hebraica descreve o abandono rebelde da fidelidade devida a Yahweh na aliança.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “casa da servidão”; literalmente, “casa de escravos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא
  choice: Mas aquele profeta
  rationale: A conjunção retoma o caso anterior com força contrastiva no contexto jurídico; o demonstrativo é preservado.
- source_word: אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: ou aquele que teve aquele sonho
  rationale: Expressa em português natural o hebraico literalmente próximo de “sonhador daquele sonho” e conserva a referência enfática ao sonho em questão.
- source_word: יוּמָת
  choice: será morto
  rationale: O hofal de מות indica que a pessoa sofrerá execução, não simplesmente que morrerá.
- source_word: כִּי דִבֶּר סָרָה
  choice: porque falou rebeldia
  rationale: Preserva a construção concreta do hebraico e o sentido de insubordinação ou ruptura da fidelidade à aliança, sem reduzir o termo a mera falsidade.
- source_word: עַל יְהוָה אֱלֹהֵיכֶם
  choice: contra Yahweh, o Deus de vocês
  rationale: No contexto hostil, עַל indica oposição. O nome da aliança é transliterado como Yahweh, e a aposição torna a relação sintática clara.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: que os tirou da terra do Egito
  rationale: Formulação natural que preserva a linguagem característica do êxodo.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: e os resgatou da casa da escravidão
  rationale: “Resgatou” comunica פדה; “casa da escravidão” mantém a imagem hebraica e soa mais natural do que “casa de escravos”. O plural suaviza a alternância hebraica entre tratamento plural e singular coletivo.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: a fim de desviá-los do caminho
  rationale: O hifil de נדח descreve fazer alguém afastar-se; “desviar” preserva essa força e combina naturalmente com a metáfora do caminho.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: em que Yahweh, o Deus de vocês, lhes ordenou andar
  rationale: Mantém a metáfora hebraica de andar no caminho, entendida como modo de conduta, sem explicá-la em excesso.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Assim, eliminem o mal do meio de vocês
  rationale: A fórmula jurídica deuteronômica exige remoção decisiva do mal. “Eliminem” é claro e corrente; o plural mantém a coerência do tratamento em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de סָרָה no contexto da aliança
  choice: rebeldia
  alternative: apostasia; perversidade
  rationale: “Rebeldia” comunica oposição e abandono da lealdade devida sem impor ao termo uma formulação teológica posterior; a alternativa “apostasia” é registrada em nota.
- issue: Imagem de בֵּית עֲבָדִים
  choice: casa da escravidão
  alternative: casa de escravos; casa da servidão
  rationale: A escolha conserva a imagem da “casa” e explicita de modo idiomático a condição da qual Israel foi resgatado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a comunidade e suaviza a alternância hebraica entre plural e singular coletivo. Conserva as metáforas da casa e do caminho, bem como a força jurídica da sentença e da fórmula final.
