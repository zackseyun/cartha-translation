source:
  edition: WLC
  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: pt
  text: 'Homens perversos[a] saíram do meio de vocês e desviaram os habitantes da cidade deles, dizendo: “Vamos e sirvamos outros deuses que vocês não conheceram”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos da maldade”; tradicionalmente, “filhos de Belial”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: saíram
  rationale: O qatal de יצא integra o relato ouvido na construção condicional do contexto; o pretérito perfeito é natural em português.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: O substantivo está explicitamente no masculino plural.
- source_word: בְּנֵי בְלִיַּעַל
  choice: homens perversos
  rationale: A expressão idiomática, literalmente 'filhos da indignidade', designa homens moralmente corruptos ou sem escrúpulos; 'perversos' comunica sua força sem tratar Belial como nome próprio.
- source_word: מִקִּרְבְּךָ
  choice: do meio de vocês
  rationale: Preserva a ideia de que esses homens surgiram dentro da própria comunidade; o hebraico emprega singular coletivo, enquanto o contexto exige referência plural em português.
- source_word: וַיַּדִּיחוּ
  choice: desviaram
  rationale: O hifil de נדח indica fazer outros se afastarem, aqui levando-os à apostasia.
- source_word: יֹשְׁבֵי עִירָם
  choice: os habitantes da cidade deles
  rationale: Reproduz o particípio substantivado 'os que habitam' e mantém o sufixo plural de terceira pessoa de עִירָם.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente para introduzir o discurso direto.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Vamos servir
  rationale: Os coortativos exprimem exortação conjunta. Em português, 'vamos servir' é natural e conserva tanto o movimento implícito em נלך quanto o sentido religioso amplo de עבד.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Tradução direta da expressão deuteronômica, sem restringi-la a deuses estrangeiros.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: que vocês não conheceram
  rationale: Mantém o verbo 'conhecer' e sua possível dimensão relacional, sem reduzi-lo a mero conhecimento informativo.
theological_decisions:
- issue: Interpretação de בְּנֵי בְלִיַּעַל
  choice: homens perversos
  alternative: filhos de Belial
  rationale: Neste contexto, a expressão funciona como descrição idiomática de pessoas moralmente corruptas, e não exige que Belial seja entendido como nome próprio ou ser demoníaco.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'vocês' explicita naturalmente o referente comunitário do singular coletivo hebraico. A nota preserva a forma literal e a tradução tradicional.
