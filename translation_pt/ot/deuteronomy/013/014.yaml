    rationale: 'נֵלְכָה וְנַעַבְדָה contém dois verbos coordenados: «vamos e sirvamos». «Vamos servir» funde-os e deixa de representar o movimento/exortação expresso por נֵלְכָה.'
  - severity: low
    issue: A formulação da nota lexical necessita ajuste.
    rationale: «Filhos da indignidade» é uma glosa pouco natural e semanticamente menos precisa para a expressão hebraica. Uma formulação inteligível como «filhos da maldade», acompanhada da alternativa tradicional, explica melhor o idiomatismo sem impor uma leitura teológica.
