  verdict: revise
  source_fidelity: A tradução reproduz adequadamente os participantes, a procedência interna à comunidade, o desvio para a apostasia e os «outros deuses». Contudo, «Vamos servir» não traduz explicitamente o primeiro coortativo נֵלְכָה («vamos»/«vamos embora»), seguido de «e sirvamos».
  naturalness: O português é atual, claro e adequado ao registro bíblico. «Vamos e sirvamos» preserva os dois coortativos sem soar artificial. A âncora da nota fica mais clara junto de «homens perversos», expressão a que se refere.
  terminology: «Homens perversos» é uma representação aceitável, em português corrente, do idiomatismo אַנָשִׁים בְּנֵי־בְלִיַּעַל, sem transformar Belial em nome próprio no corpo do texto. Na nota, «filhos da indignidade» é pouco idiomático e não exprime com precisão suficiente o sentido lexical usual de beliyya'al; «filhos da maldade» é uma alternativa literal-idiomática mais inteligível, mantendo «filhos de Belial» como forma tradicional.
