base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: pt
  text: 'e acontecer o sinal ou o prodígio[a] de que ele falou a você, dizendo: “Vamos seguir outros deuses, que você não conhecia[b], e vamos servi-los[c]”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o sinal e o prodígio”; em hebraico, os dois termos formam uma expressão coordenada que também pode ser entendida como “sinal ou prodígio”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a quem você não conhecia”.
    reason: lexical_alternative
  - marker: c
    text: Ou “e vamos adorá-los”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: e acontecer
  rationale: O verbo significa literalmente “vir”, mas, aplicado a um sinal anunciado, indica que ele acontece ou se realiza. “Acontecer” comunica isso com naturalidade em português.
- source_word: הָאוֹת
  choice: o sinal
  rationale: אוֹת designa um sinal, marca ou acontecimento que serve de comprovação. “Sinal” é a tradução mais direta e corrente neste contexto.
- source_word: וְהַמּוֹפֵת
  choice: ou o prodígio
  rationale: Embora a conjunção hebraica seja literalmente “e”, a expressão coordenada אוֹת וּמוֹפֵת pode abranger um “sinal ou prodígio”. “Prodígio” preserva a ideia de um acontecimento extraordinário sem impor que os dois elementos tenham de ocorrer juntos.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: de que ele falou a você
  rationale: Mantém a oração relativa e traduz de modo natural a fala dirigida ao ouvinte.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente o conteúdo da fala, conforme a construção hebraica.
- source_word: נֵלְכָה אַחֲרֵי
  choice: Vamos seguir
  rationale: A forma exortativa com אַחֲרֵי expressa o convite para acompanhar e aderir. “Seguir” transmite com clareza a lealdade religiosa implicada.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É a expressão habitual e direta para a fórmula deuteronômica referente a divindades alheias.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: que você não conhecia
  rationale: “Conhecer” preserva a amplitude de ידע, que pode envolver conhecimento, familiaridade ou reconhecimento, sem explicar além do texto.
- source_word: וְנָעָבְדֵם
  choice: e vamos servi-los
  rationale: עבד descreve serviço e, neste contexto, culto religioso. “Servir” conserva a amplitude da linguagem de lealdade e culto.
theological_decisions:
- issue: Referência aos outros deuses
  choice: outros deuses, que você não conhecia
  alternative: outros deuses, a quem você não conhecia
  rationale: O relativo “que” é natural em português e não atribui por si só personalidade ou legitimidade às divindades mencionadas. Ao mesmo tempo, “conhecia” mantém a tensão do hebraico sem reduzir a expressão a mera informação intelectual.
- issue: Sentido religioso de עבד
  choice: servi-los
  alternative: adorá-los
  rationale: “Servir” traduz mais diretamente o verbo e conserva seu campo de lealdade e culto; “adorar” explicita corretamente o sentido contextual, mas é semanticamente mais estreito.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O singular “você” corresponde ao destinatário singular do hebraico. A frase permanece aberta, pois continua sintaticamente no versículo seguinte.
