id: DEU.32.22
reference: Deuteronomy 32:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי אֵשׁ֙ קָדְחָ֣ה בְ/אַפִּ֔/י וַ/תִּיקַ֖ד עַד שְׁא֣וֹל תַּחְתִּ֑ית וַ/תֹּ֤אכַל אֶ֨רֶץ֙ וִֽ/יבֻלָ֔/הּ וַ/תְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: pt
  text: Pois um fogo se acendeu na minha ira e arde até as profundezas do Sheol[a]; devora a terra e o que ela produz e incendeia os alicerces dos montes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até o Sheol mais profundo” ou “até as profundezas da sepultura”. O hebraico traz literalmente “até o Sheol, o mais baixo/profundo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do juízo descrito anteriormente e preserva de modo natural o valor causal-explicativo da conjunção.
- source_word: אֵשׁ קָדְחָה
  choice: um fogo se acendeu
  rationale: Expressa o início da combustão indicado pela combinação do substantivo com o verbo no perfeito, sem impor uma construção passiva ausente do hebraico.
- source_word: בְאַפִּי
  choice: na minha ira
  rationale: אַף significa literalmente nariz ou narina, mas nesta expressão designa idiomaticamente a ira; a tradução comunica o sentido sem reproduzir um hebraísmo obscuro.
- source_word: וַתִּיקַד
  choice: e arde
  rationale: Mantém a imagem contínua do fogo e permite que a expressão seguinte indique até onde ele alcança.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: até as profundezas do Sheol
  rationale: Conserva Sheol como designação hebraica do domínio dos mortos e traduz תַּחְתִּית como indicação de profundidade extrema, em português natural.
- source_word: וַתֹּאכַל
  choice: devora
  rationale: Preserva a metáfora vívida do verbo que literalmente significa comer e que aqui descreve a ação destrutiva do fogo.
- source_word: אֶרֶץ
  choice: a terra
  rationale: O cenário poético inclui o Sheol e os alicerces dos montes; por isso, 'terra' preserva melhor a possível amplitude cósmica do que a opção mais localizada 'região' ou 'território'.
- source_word: וִיבֻלָהּ
  choice: o que ela produz
  rationale: Refere-se àquilo que a terra faz brotar. A formulação é ampla, clara e evita restringir o sentido apenas a determinadas colheitas.
- source_word: וַתְּלַהֵט
  choice: e incendeia
  rationale: Comunica a força intensificada e causativa da imagem do fogo em português corrente e digno.
- source_word: מוֹסְדֵי הָרִים
  choice: os alicerces dos montes
  rationale: Reproduz a imagem concreta das partes estruturais mais profundas dos montes, com formulação idiomática em português.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: sepultura; mundo dos mortos; inferno
  rationale: O termo hebraico designa o domínio dos mortos e não deve ser identificado antecipadamente com noções doutrinárias posteriores de inferno. Mantê-lo transliterado preserva o universo conceitual do texto e sua amplitude.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A estrutura poética e as imagens de fogo, profundidade e fundamentos foram preservadas sem arcaísmos desnecessários.
