base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: pt
  text: Pois a videira deles vem da videira de Sodoma e dos campos de Gomorra; suas uvas são uvas de veneno, e seus cachos lhes são amargos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִגֶּפֶן סְדֹם
  choice: da videira de Sodoma
  rationale: Mantém a imagem e a repetição do hebraico, segundo o qual a videira deles procede da videira de Sodoma.
- source_word: שַׁדְמֹת
  choice: campos
  rationale: Expressa de modo natural o sentido de terras cultivadas ou campos, sem especificar um tipo de plantação não indicado no texto.
- source_word: רֹאשׁ
  choice: veneno
  rationale: Neste contexto, o termo designa uma substância vegetal tóxica ou amarga; “veneno” comunica claramente o caráter nocivo das uvas sem tentar identificar uma planta específica.
- source_word: מְרֹרֹת לָמוֹ
  choice: amargos para eles
  rationale: Preserva tanto o predicativo plural “amargos” quanto o pronome dativo explícito לָמוֹ, evitando omitir a expressão “para eles”.
theological_decisions:
- issue: Identidade do grupo representado pela videira
  choice: Preservar o pronome “deles” sem explicitar o referente no próprio versículo
  alternative: Substituir o pronome por uma identificação interpretativa do povo ou dos inimigos
  rationale: O versículo depende do contexto poético imediato para o referente; explicitá-lo aqui resolveria uma relação discursiva que o hebraico deixa pronominal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo poético preservado. A repetição “videira... videira” e “uvas... uvas” foi mantida por ser retoricamente significativa no hebraico. A formulação “amargos para eles” é menos idiomática, mas conserva o dativo explícito do texto-fonte.
