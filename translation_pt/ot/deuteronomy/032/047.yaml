  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: pt
  text: Pois esta palavra não é vazia para vocês[a]; ela é a vida de vocês[b]. Por meio desta palavra, vocês prolongarão os seus dias na terra da qual estão atravessando o Jordão para tomar posse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não é uma questão sem importância para vocês” ou “não é algo inútil para vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a vida de vocês”; a forma plural hebraica pode funcionar como um substantivo abstrato singular.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para possuí-la” ou “para herdá-la”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: palavra vazia
  rationale: Mantém o substantivo concreto דָבָר e expressa רֵק como algo sem conteúdo, valor ou eficácia, sem reduzir a frase apenas a uma 'questão sem importância'.
- source_word: מִכֶּם
  choice: para vocês
  rationale: A preposição מן é idiomática nesta construção e indica a relação da palavra com Israel, não uma origem separativa.
- source_word: חַיֵּיכֶם
  choice: a vida de vocês
  rationale: Embora a forma hebraica seja morfologicamente plural, חַיִּים pode funcionar como substantivo abstrato singular. A formulação é natural e preserva a força coletiva dirigida a Israel.
- source_word: וּבַדָּבָר הַזֶּה
  choice: Por meio desta palavra
  rationale: Entende ב como instrumental e repete 'palavra', preservando a ligação lexical com דָבָר na primeira oração.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: vocês prolongarão os seus dias
  rationale: Conserva a imagem hebraica do hifil de ארך com יָמִים e continua compreensível em português moderno.
- source_word: עַל הָאֲדָמָה
  choice: na terra
  rationale: Em português, 'na terra' é a forma natural de falar da permanência no território prometido; evita o sentido mais genérico de 'sobre a terra'.
- source_word: עֹבְרִים אֶת הַיַּרְדֵּן
  choice: estão atravessando o Jordão
  rationale: O particípio apresenta a travessia como iminente a partir da perspectiva de Moisés; a forma progressiva preserva essa vivacidade.
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: para possuir
  rationale: ירשׁ indica tomar posse ou receber a terra como herança. A tradução concisa é natural, enquanto a nota registra alternativas que explicitam o destino e o pronome.
theological_decisions:
- issue: Força pactual da palavra, da vida e da permanência na terra
  choice: O texto apresenta a palavra dada a Israel como sua vida e como o meio pelo qual seus dias serão prolongados na terra.
  alternative: Entender a declaração apenas como elogio retórico à importância da instrução, sem consequência pactual.
  rationale: O paralelismo entre 'ela é a vida de vocês' e 'por meio desta palavra, vocês prolongarão os seus dias' relaciona a palavra à vida e à permanência de Israel na terra, sem ser necessário acrescentar categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O tratamento plural 'vocês' deixa claro que Moisés se dirige coletivamente a Israel. A repetição de 'palavra' e a expressão 'prolongarão os seus dias' preservam a coesão e a imagem do hebraico.
