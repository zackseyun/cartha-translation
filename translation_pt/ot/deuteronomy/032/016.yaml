  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: pt
  text: Eles o provocaram ao ciúme com estrangeiros[a]; com abominações o provocaram à ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com deuses estranhos” ou “com deuses estrangeiros”; o hebraico diz literalmente “com estrangeiros”.
    reason: alternative_reading
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: o provocaram ao ciúme
  rationale: O hifil de קנא com sufixo de objeto masculino singular expressa causar ou despertar ciúme nele. A formulação preserva a força causativa e a linguagem relacional da aliança.
- source_word: בְּזָרִים
  choice: com estrangeiros
  rationale: זָרִים significa literalmente “estrangeiros” ou “os de fora”. Como “deuses” não aparece explicitamente no hebraico, o texto principal conserva a expressão literal, enquanto a nota registra o sentido contextual possível.
- source_word: בְּתוֹעֵבֹת
  choice: com abominações
  rationale: תּוֹעֵבָה designa algo abominável ou detestável, frequentemente ligado à idolatria. “Abominações” mantém o peso condenatório do termo e o paralelismo do verso.
- source_word: יַכְעִיסֻהוּ
  choice: o provocaram à ira
  rationale: 'O hifil de כעס tem sentido causativo: provocar à ira. A escolha conserva essa força e corresponde ao paralelismo com o primeiro segmento.'
theological_decisions:
- issue: Se deve tornar explícito o objeto idolátrico implícito em זָרִים
  choice: Manter “estrangeiros” no texto principal
  alternative: “deuses estranhos” ou “deuses estrangeiros”
  rationale: O contexto aponta para objetos estrangeiros de culto, mas o substantivo “deuses” não está expresso neste versículo. A tradução preserva a formulação hebraica e apresenta a explicitação contextual em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “provocaram” mantém o paralelismo e a força causativa dos dois verbos hebraicos.
