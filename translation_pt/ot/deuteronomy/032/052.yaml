base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: pt
  text: Pois você verá a terra de longe[a], mas não entrará nessa terra, que estou dando aos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do lado oposto”. A expressão hebraica indica que Moisés verá a terra à distância, sem entrar nela.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da declaração anterior e preserva de modo natural a ligação causal no discurso.
- source_word: מִנֶּגֶד
  choice: de longe
  rationale: Expressa idiomaticamente a ideia de observar a terra à distância, sem entrar nela; a formulação hebraica também pode indicar vê-la do lado oposto.
- source_word: תִּרְאֶה
  choice: você verá
  rationale: O imperfeito de segunda pessoa masculina singular tem valor futuro e integra uma declaração divina solene; o futuro simples é natural no português atual.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Neste contexto, refere-se à terra prometida; 'terra' é a tradução corrente e conserva sua ressonância bíblica.
- source_word: וְשָׁמָּה לֹא תָבוֹא
  choice: mas não entrará nela
  rationale: Embora literalmente a construção seja próxima de 'e para lá não irá/virá', 'não entrará nela' comunica com clareza o movimento negado e evita uma formulação pouco natural.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: que eu estou dando
  rationale: O particípio נֹתֵן apresenta a dádiva como ação divina em curso ou iminente, nuance preservada pela locução progressiva.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a forma masculina plural do hebraico e a designação pactual tradicional, embora a expressão designe coletivamente todo o povo de Israel.
theological_decisions:
- issue: Designação pactual com בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel; descendentes de Israel
  rationale: A tradução conserva a forma gramatical masculina e a expressão bíblica convencional, sem negar que o referente coletivo abrange o povo inteiro.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega-se 'você' para a segunda pessoa singular, evitando tanto o arcaísmo de 'tu' em algumas regiões quanto a solenidade acrescentada de 'o senhor'. A oposição hebraica é vertida naturalmente por 'mas'. Mantém-se 'filhos de Israel' por fidelidade à forma da designação hebraica.
