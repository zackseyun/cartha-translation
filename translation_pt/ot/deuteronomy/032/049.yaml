  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: pt
  text: Suba a este monte de Abarim, o monte Nebo, que fica na terra de Moabe, em frente a Jericó[a], e veja a terra de Canaã, que estou dando aos filhos de Israel[b] como propriedade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “diante de Jericó” ou “defronte de Jericó”. A expressão hebraica indica uma posição geográfica oposta ou voltada para Jericó.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “aos israelitas”. Hebraico: “aos filhos de Israel”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “como posse”; possivelmente, “como herança”. O termo hebraico designa uma propriedade ou domínio territorial.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Suba
  rationale: O imperativo qal masculino singular de עלה ordena um movimento para cima. “Suba” é direto, natural e preserva a direção do verbo.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: este monte de Abarim
  rationale: Mantém o demonstrativo e trata Abarim como nome geográfico, sem impor uma tradução etimológica incerta. “Monte” conserva o singular do hebraico.
- source_word: הַר נְבוֹ
  choice: o monte Nebo
  rationale: Reproduz a aposição que identifica o monte de Abarim mencionado como o monte Nebo, usando a forma tradicional portuguesa do topônimo.
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: que fica na terra de Moabe
  rationale: A relativa localiza o monte. “Fica” torna natural em português a relação locativa expressa no hebraico, sem alterar seu conteúdo.
- source_word: אֲשֶׁר עַל־פְּנֵי יְרֵחוֹ
  choice: em frente a Jericó
  rationale: Em contexto geográfico, עַל־פְּנֵי indica posição diante de, defronte ou no lado oposto. “Em frente a” é claro e corrente, mantendo a relação topográfica.
- source_word: וּרְאֵה
  choice: e veja
  rationale: Preserva a coordenação e o imperativo simples de ראה, sem recorrer a uma forma arcaica como “contempla”.
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: a terra de Canaã
  rationale: Tradução direta do sintagma nominal, com a forma portuguesa consagrada do topônimo.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: que estou dando
  rationale: O pronome explícito e o particípio apresentam a concessão divina como ação em curso ou iminente. A locução progressiva preserva essa vivacidade.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Conserva a forma concreta e tradicional do etnônimo hebraico בְּנֵי יִשְׂרָאֵל, sem ocultar sua expressão masculina; a alternativa idiomática “aos israelitas” é registrada em nota.
- source_word: לַאֲחֻזָּה
  choice: como propriedade
  rationale: אֲחֻזָּה designa uma posse ou propriedade, especialmente uma terra mantida como domínio. “Como propriedade” é natural e evita acrescentar necessariamente a ideia específica de herança.
theological_decisions:
- issue: Forma de traduzir בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  alternative: aos israelitas
  rationale: A expressão hebraica é um etnônimo pactual no masculino plural. A redação principal preserva sua forma lexical, enquanto a nota oferece a equivalência coletiva mais idiomática sem decidir além do texto.
- issue: Nuance de אֲחֻזָּה
  choice: como propriedade
  alternative: como herança
  rationale: O termo ressalta posse ou domínio territorial. Embora “herança” possa ser apropriado em certos contextos, aqui essa opção poderia tornar explícita uma nuance que o substantivo, por si só, não exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe acompanha de perto a sequência dos dois imperativos hebraicos, mas usa “que fica” para uma localização natural em português. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
