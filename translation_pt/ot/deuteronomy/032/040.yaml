base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/040.yaml
  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: pt
  text: 'Pois levanto a mão ao céu e digo[a]: “Tão certo como eu vivo para sempre,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “levanto a mão ao céu e digo: ‘Eu vivo para sempre’”. O texto principal explicita a força de juramento da expressão hebraica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a base solene da declaração anterior e mantém a ligação discursiva sem impor uma leitura temporal.
- source_word: אֶשָּׂא
  choice: levanto
  rationale: Preserva o gesto concreto de erguer a mão, associado aqui à prestação de juramento.
- source_word: אֶל שָׁמַיִם
  choice: ao céu
  rationale: Expressa naturalmente em português a direção ascendente, embora o substantivo hebraico tenha forma plural.
- source_word: יָדִי
  choice: a mão
  rationale: Mantém o singular do hebraico; o possessivo já é recuperado naturalmente pelo sujeito verbal em primeira pessoa.
- source_word: וְאָמַרְתִּי
  choice: e digo
  rationale: No contexto, a forma verbal dá continuidade performativa ao gesto de juramento; o presente português comunica bem essa declaração solene.
- source_word: חַי אָנֹכִי
  choice: Tão certo como eu vivo
  rationale: Reproduz a força idiomática da fórmula hebraica de autojuramento, em vez de reduzi-la a uma simples afirmação de que Deus está vivo.
- source_word: לְעֹלָם
  choice: para sempre
  rationale: Comunica duração ilimitada em linguagem moderna e acessível, ligada à afirmação divina de viver.
theological_decisions:
- issue: Como traduzir a fórmula divina de autojuramento sem enfraquecer sua força
  choice: Tão certo como eu vivo para sempre
  alternative: Eu vivo para sempre
  rationale: O contexto de levantar a mão indica juramento. A formulação escolhida torna explícita essa força idiomática sem acrescentar conteúdo doutrinário, enquanto a alternativa conserva mais de perto a forma lexical do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Tão certo como” comunica de modo natural a fórmula de juramento, enquanto a nota preserva a forma mais literal e sua ambiguidade superficial.
