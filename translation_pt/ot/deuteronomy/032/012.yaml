base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: pt
  text: Somente Yahweh o conduziu[a], e nenhum deus estrangeiro estava com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o guiou”. O verbo hebraico pode significar conduzir ou guiar.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּדָד
  choice: Somente
  rationale: Usado adverbialmente, indica que Yahweh agiu sozinho, sem auxílio ou companhia; a posição inicial mantém a ênfase do hebraico.
- source_word: יַנְחֶנּוּ
  choice: o conduziu
  rationale: A forma hifil de נחה expressa conduzir ou guiar. “Conduziu” é natural neste contexto e permite registrar “guiou” como alternativa lexical.
- source_word: וְאֵין
  choice: e nenhum
  rationale: Expressa de modo idiomático em português a negação existencial que introduz a segunda oração.
- source_word: עִמּוֹ
  choice: estava com ele
  rationale: A preposição com sufixo masculino singular indica companhia; “estava” é suprido para formar uma oração natural em português.
- source_word: אֵל נֵכָר
  choice: deus estrangeiro
  rationale: Designa uma divindade alheia a Israel; a expressão é clara e preserva a força polêmica contra a idolatria.
theological_decisions:
- issue: Referente dos pronomes masculinos singulares em “o conduziu” e “com ele”
  choice: Manter o singular, referente corporativamente a Israel/Jacó no contexto imediato.
  alternative: Empregar o plural (“os conduziu”, “com eles”) para explicitar que se trata do povo.
  rationale: O hebraico traz sufixos masculinos singulares, em harmonia com a personificação contextual de Israel/Jacó como uma só pessoa. A tradução conserva essa forma sem eliminar o sentido coletivo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Somente Yahweh” preserva a ênfase exclusiva da primeira oração; o paralelismo é mantido sem tornar explícito além do hebraico quem é o referente coletivo de “ele”.
