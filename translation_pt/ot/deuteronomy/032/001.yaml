  text: הַאֲזִ֥ינוּ הַ/שָּׁמַ֖יִם וַ/אֲדַבֵּ֑רָה וְ/תִשְׁמַ֥ע הָ/אָ֖רֶץ אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: pt
  text: Deem ouvidos[a], ó céus, e eu falarei; e que a terra ouça as palavras da minha boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Escutem, ó céus, e eu falarei; e que a terra ouça”. O hebraico emprega formas poéticas elevadas de ordem e apelo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Deem ouvidos
  rationale: O imperativo hifil de אזן pede escuta atenta. A expressão preserva o tom elevado da convocação poética e continua compreensível em português moderno.
- source_word: הַשָּׁמַיִם
  choice: ó céus
  rationale: O plural «céus» representa naturalmente שָׁמַיִם; «ó» explicita em português o vocativo já indicado pelo discurso direto.
- source_word: וַאֲדַבֵּרָה
  choice: e eu falarei
  rationale: A forma coortativa expressa intenção ou determinação do falante; o futuro mantém essa força sem tornar explícita uma relação final que o hebraico deixa aberta.
- source_word: וְתִשְׁמַע
  choice: e que a terra ouça
  rationale: A forma imperfeita de valor volitivo funciona como apelo paralelo ao imperativo dirigido aos céus. «Que ... ouça» conserva esse valor jussivo.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No par cósmico céus-terra, «terra» é preferível a «país» ou «território».
- source_word: אִמְרֵי
  choice: as palavras
  rationale: אִמְרֵי designa enunciados falados; «palavras» é natural, claro e suficientemente solene.
- source_word: פִי
  choice: da minha boca
  rationale: A locução concreta do hebraico é preservada em vez de ser reduzida à paráfrase «que eu digo».
theological_decisions:
- issue: Alcance da convocação aos céus e à terra
  choice: Convocação poética do cosmos como testemunha
  alternative: Simples apelo retórico a todos os ouvintes
  rationale: O par «céus» e «terra» forma uma invocação solene encontrada em contextos de aliança e profecia. A tradução preserva essa solenidade sem inserir na linha principal a interpretação explícita de que atuam como testemunhas.
translation_notes:
  register: Português moderno, solene e poético, com ampla legibilidade brasileira. «Deem ouvidos» mantém a elevação do chamado sem recorrer a uma construção arcaica; o paralelismo e a concretude da expressão hebraica foram preservados.
