  rationale: O substantivo coletivo designa um povo como grupo; “nação” é natural e adequado ao contexto.
- source_word: אֹבַד עֵצוֹת
  choice: sem orientação
  rationale: A expressão indica estar privado de conselho sensato ou direção prudente. “Sem orientação” comunica o sentido idiomático em português atual sem rigidez excessiva.
- source_word: הֵמָּה
  choice: eles são
  rationale: O pronome independente é enfático e integra uma oração nominal; a cópula explícita produz uma formulação natural em português.
- source_word: וְאֵין
  choice: e não há
  rationale: Preserva a negação existencial e a coordenação da oração hebraica.
- source_word: בָּהֶם
  choice: neles
  rationale: Expressa diretamente a ausência dessa qualidade no povo referido.
- source_word: תְּבוּנָה
  choice: entendimento
  rationale: Mantém o vocabulário sapiencial do hebraico e a distinção em relação a conselho ou orientação.
