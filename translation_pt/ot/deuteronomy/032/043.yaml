base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: pt
  text: Alegrem-se[a], ó nações, com o povo dele[c], pois ele vingará o sangue dos seus servos; retribuirá com vingança aos seus adversários e fará expiação pela sua terra e pelo seu povo.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Cantem de alegria” ou “Gritem de alegria”. O imperativo hebraico pode indicar canto ou aclamação jubilosa.'
    reason: lexical_alternative
  - marker: c
    text: A Septuaginta grega e um manuscrito dos Manuscritos do Mar Morto preservam uma forma mais longa deste versículo, com convocações adicionais para que os céus e os seres divinos se alegrem e para que as nações o adorem. O texto principal segue o hebraico massorético.
    reason: textual_variant
  - marker: d
    text: 'Ou: “purificará a sua terra e o seu povo”. O verbo hebraico pode realçar tanto a expiação quanto a purificação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Alegrem-se
  rationale: O imperativo plural de רנן expressa exultação jubilosa; esta formulação é natural em português, enquanto a possível nuance de cantar ou bradar de alegria é preservada em nota.
- source_word: גוֹיִם
  choice: nações
  rationale: Equivalente usual de גוים em sentido internacional coletivo; evita a coloração neotestamentária que «gentios» poderia introduzir.
- source_word: עַמּוֹ
  choice: com o povo dele
  rationale: A sequência hebraica é concisa e sintaticamente ambígua. A preposição «com» explicita a leitura contextual mais provável, segundo a qual as nações se alegram juntamente com o povo de Deus. «Dele» evita que «seu» pareça referir-se às nações.
- source_word: כִּי
  choice: pois
  rationale: Introduz o fundamento da convocação à alegria em registro poético e corrente.
- source_word: דַם עֲבָדָיו
  choice: o sangue dos seus servos
  rationale: עבד pode designar servo ou escravo; no contexto, «servos» destaca sua relação com Deus e o derramamento injusto do sangue deles, sem pressupor que a condição de escravidão seja o foco.
- source_word: יִקּוֹם
  choice: vingará
  rationale: Na construção com «sangue», o verbo נקם indica vingar ou exigir reparação pelo sangue derramado.
- source_word: וְנָקָם יָשִׁיב
  choice: retribuirá com vingança
  rationale: Conserva tanto o substantivo «vingança» quanto a força retributiva de ישיב, literalmente ligada à ideia de fazer voltar ou dar em retorno.
- source_word: לְצָרָיו
  choice: aos seus adversários
  rationale: צרים designa oponentes hostis; «adversários» preserva o registro solene do poema.
- source_word: וְכִפֶּר
  choice: fará expiação por
  rationale: Mantém a força expiatória de כפר sem excluir a nuance associada de purificação, registrada em nota.
- source_word: אַדְמָתוֹ
  choice: sua terra
  rationale: אדמה pode significar terra ou solo; «terra» é idiomático e adequado ao contexto nacional e pactual.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Mantém de forma direta o segundo complemento da cláusula final.
theological_decisions:
- issue: Relação entre «nações» e «seu povo» no primeiro cólon
  choice: As nações são convocadas a alegrar-se com o povo de Deus.
  alternative: As nações são convocadas a aclamar ou louvar o povo dele; a tradição grega e um manuscrito do mar Morto também apresentam uma forma ampliada do versículo.
  rationale: O texto massorético é comprimido. Suprir «com» representa a relação sintática contextual mais provável sem incorporar ao texto principal as ampliações de outras testemunhas.
- issue: Sentido de כפר na cláusula final
  choice: Deus fará expiação pela sua terra e pelo seu povo.
  alternative: Deus purificará a sua terra e o seu povo.
  rationale: «Fazer expiação» conserva o peso expiatório do verbo e deixa em aberto como essa expiação se relaciona à vingança e à purificação neste contexto poético.
- issue: Agente divino implícito
  choice: Os verbos na terceira pessoa são mantidos sem inserir «Deus» no texto.
  alternative: Explicitar «Deus» como sujeito.
  rationale: O referente é claro no contexto, mas o hebraico usa pronomes e formas verbais; evitar a inserção preserva a forma do texto e não resolve além do necessário.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe poética foi preservada sem arcaísmos. Emprega-se «o povo dele» na abertura para evitar a ambiguidade referencial de «seu povo», mas «seu povo» no fim, onde o referente divino está claro. A nota lexical sobre עבד não foi incluída por não ser necessária neste contexto e para evitar sobrecarregar o versículo; «servos» preserva adequadamente o sentido contextual.
