base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: pt
  text: 'Eu disse: “Eu os dispersaria[a]; faria desaparecer da humanidade[b] a memória deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eu os sopraria para longe” ou “Eu os espalharia”. O verbo hebraico é raro e difícil; alguns o entendem como conduzi-los aos cantos ou removê-los de vista.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos seres humanos” ou “dos mortais”. O hebraico emprega um termo coletivo singular para a humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Eu disse
  rationale: O qal perfeito na primeira pessoa do singular introduz a intenção declarada de Deus; a tradução direta preserva a forma poética do discurso.
- source_word: אַפְאֵיהֶם
  choice: Eu os dispersaria
  rationale: A forma hebraica é rara e de interpretação difícil. “Dispersaria” comunica com clareza a ameaça de espalhá-los, sem fixar como certa a possível imagem de lançá-los aos cantos ou removê-los de vista.
- source_word: אַשְׁבִּיתָה
  choice: faria desaparecer
  rationale: O hifil de שבת exprime fazer cessar. Com “a memória deles” como objeto, “faria desaparecer” é natural em português e mantém a ideia causativa.
- source_word: מֵאֱנוֹשׁ
  choice: da humanidade
  rationale: אֱנוֹשׁ é um singular coletivo que designa os seres humanos, frequentemente com nuance de mortalidade. “Humanidade” preserva o sentido coletivo de modo corrente e inclusivo.
- source_word: זִכְרָם
  choice: a memória deles
  rationale: זֵכֶר indica memória ou lembrança. A expressão escolhida transmite que deixariam de ser recordados entre os seres humanos.
theological_decisions:
- issue: Fala divina e juízo ameaçado em linguagem poética
  choice: 'Traduzir a intenção declarada com o futuro do pretérito: “dispersaria; faria desaparecer”'
  alternative: 'Usar o futuro simples: “dispersarei; farei desaparecer”'
  rationale: No contexto do cântico, as formas exprimem uma intenção declarada cuja execução é qualificada no versículo seguinte. O futuro do pretérito preserva essa relação sem eliminar a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da segunda oração foi ajustada para soar natural, sem alterar a relação entre o verbo, a esfera humana e a memória do povo.
