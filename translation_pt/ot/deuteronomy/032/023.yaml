  text: אַסְפֶּ֥ה עָלֵ֖י/מוֹ רָע֑וֹת חִצַּ֖/י אֲכַלֶּה בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/023.yaml
  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: pt
  text: Acumularei desgraças sobre eles[a]; contra eles esgotarei as minhas flechas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “calamidades”; literalmente, “males”, no sentido de acontecimentos danosos, não de maldade moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “gastarei as minhas flechas neles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: Acumularei
  rationale: O hifil imperfeito na primeira pessoa singular expressa fazer com que males se acumulem sobre o povo; “acumularei” preserva essa força e soa natural em português.
- source_word: עָלֵימוֹ
  choice: sobre eles
  rationale: A preposição עַל com sufixo plural indica que as desgraças são trazidas sobre o povo, mantendo a imagem espacial e o tom poético.
- source_word: רָעוֹת
  choice: desgraças
  rationale: Neste contexto de juízo, o plural designa acontecimentos nocivos ou calamidades, não maldade moral. “Desgraças” comunica isso com clareza em português corrente.
- source_word: חִצַּי
  choice: as minhas flechas
  rationale: Tradução literal que conserva a metáfora militar do texto hebraico.
- source_word: אֲכַלֶּה
  choice: esgotarei
  rationale: O piel comunica gastar ou consumir completamente. Aplicado às flechas, “esgotarei” preserva a ideia de usar todo o estoque sem desfazer a imagem.
- source_word: בָּם
  choice: contra eles
  rationale: A preposição ב marca aqui o alvo contra o qual as flechas serão gastas; “contra eles” expressa naturalmente a direção hostil.
theological_decisions:
- issue: Sentido de רָעוֹת no contexto do juízo divino
  choice: desgraças
  alternative: males; calamidades
  rationale: O termo hebraico pode designar genericamente coisas más, mas aqui se refere a acontecimentos danosos de juízo. “Desgraças” preserva a severidade sem sugerir que Deus pratique o mal moral.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. A ordem da segunda oração foi mantida próxima do hebraico para dar ênfase a “contra eles”, sem comprometer a naturalidade.
