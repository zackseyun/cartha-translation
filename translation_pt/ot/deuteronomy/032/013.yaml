  text: יַרְכִּבֵ֨/הוּ֙ עַל במותי אָ֔רֶץ וַ/יֹּאכַ֖ל תְּנוּבֹ֣ת שָׂדָ֑י וַ/יֵּנִקֵ֤/הֽוּ דְבַשׁ֙ מִ/סֶּ֔לַע וְ/שֶׁ֖מֶן מֵ/חַלְמִ֥ישׁ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: pt
  text: Ele o fez cavalgar sobre as alturas da terra[a], e ele comeu a produção do campo[b]; fez com que sugasse mel da rocha[c] e óleo da rocha de pederneira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre os lugares altos da terra”. Aqui, a expressão provavelmente se refere a terrenos elevados e férteis, não a “lugares altos” de culto.
    reason: lexical_alternative
  - marker: b
    text: Ou “o rendimento do campo” ou “os frutos do campo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o amamentou com mel da rocha”. O verbo hebraico significa literalmente “fez sugar” ou “fez mamar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: Ele o fez cavalgar
  rationale: O hifil de רכב tem força causativa, “fazer cavalgar”. A formulação preserva essa força e mantém distintos o sujeito e o objeto pronominais.
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: sobre as alturas da terra
  rationale: במותי designa elevações ou lugares altos. Neste contexto poético, a expressão é topográfica; “alturas” evita sugerir indevidamente santuários cultuais.
- source_word: וַיֹּאכַל
  choice: e ele comeu
  rationale: Tradução direta de אכל. O pronome explícito torna clara a mudança do agente da ação sem substituir o referente pelo nome “Israel”.
- source_word: תְּנוּבֹת שָׂדָי
  choice: a produção do campo
  rationale: תנובות refere-se ao que a terra produz, isto é, sua produção ou rendimento. “Produção” é natural e mantém o campo como coletivo singular.
- source_word: וַיֵּנִקֵהוּ
  choice: fez com que sugasse
  rationale: O hifil de ינק significa literalmente “fazer sugar/mamar”. A escolha conserva a metáfora vívida de receber alimento diretamente de fontes improváveis.
- source_word: דְבַשׁ מִסֶּלַע
  choice: mel da rocha
  rationale: “Mel” é o sentido comum de דבש, e סלע designa rocha ou penhasco. A expressão preserva a imagem de provisão abundante proveniente da pedra.
- source_word: וְשֶׁמֶן
  choice: e azeite
  rationale: שמן significa óleo; no cenário agrícola, trata-se naturalmente de azeite comestível, provavelmente de oliva. “Azeite” comunica essa realidade de modo idiomático em português.
- source_word: מֵחַלְמִישׁ צוּר
  choice: da rocha de pederneira
  rationale: חלמיש designa pederneira ou pedra muito dura, e צור, rocha. A expressão conserva tanto a concretude quanto o contraste poético entre a dureza da pedra e a riqueza do azeite.
theological_decisions:
- issue: Referentes dos pronomes da terceira pessoa do singular
  choice: Manter os pronomes do hebraico sem identificar nominalmente o sujeito e o objeto
  alternative: Explicitar “o SENHOR” como sujeito e “Israel” ou “Jacó” como objeto
  rationale: O contexto imediato identifica os referentes, mas o versículo emprega pronomes. Preservá-los respeita o fluxo poético e evita inserir explicação interpretativa no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e as imagens poéticas do hebraico foram preservadas, enquanto construções excessivamente rígidas foram evitadas. “Rocha de pederneira” mantém a imagem concreta da pedra dura; “fez com que sugasse” conserva a metáfora incomum sem a suavizar.
