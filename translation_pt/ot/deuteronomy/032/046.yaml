  timestamp: '2026-07-13T22:07:41Z'
review_pass:
  verdict: revise
  source_fidelity: A redação preserva em grande parte o sentido do hebraico, inclusive a solenidade de מֵעִיד בָּכֶם e a referência explícita a «filhos». Contudo, «com que hoje dou testemunho» faz as palavras parecerem instrumento do testemunho, quando אֲשֶׁר introduz o seu conteúdo/objeto. Além disso, «tenham o cuidado de cumprir» funde os dois infinitivos לִשְׁמֹר לַעֲשׂוֹת, que convém manter distintos.
  naturalness: «Ponham no coração» e o uso de «vocês» são naturais e adequados ao registro. A substituição de «com que» por «a respeito das quais» elimina uma construção ambígua e melhora a ligação sintática. «Guardem e cumpram» é claro, atual e preserva a dupla ênfase.
  terminology: «Palavras», «lei» e «filhos» são escolhas adequadas. «Dou testemunho a respeito de vocês» conserva o caráter solene sem determinar indevidamente se a força é adversativa («contra vocês»); a nota registra as alternativas pertinentes.
  issues:
  - severity: medium
    issue: «com que hoje dou testemunho entre vocês»
    rationale: Em português, «com que» normalmente tem valor instrumental («por meio das quais»). No hebraico, אֲשֶׁר retoma «todas as palavras» como o teor acerca do qual Moisés dá testemunho/advertência; a relação deve ser expressa de modo não instrumental.
  - severity: medium
    issue: «tenham o cuidado de cumprir» para לִשְׁמֹר לַעֲשׂוֹת
    rationale: A formulação é possível como paráfrase, mas neutraliza a sequência de «guardar/observar» e «fazer/cumprir». Uma tradução de equivalência ótima deve preservar ambos os verbos quando isso é natural em português.
  revised_text: 'E ele lhes disse: “Ponham no coração todas as palavras a respeito das quais hoje dou testemunho entre vocês[a], para que ordenem a seus filhos que guardem e cumpram[b] todas as palavras desta lei.”'
  revised_footnotes:
  - marker: a
    text: Também pode ser traduzido por “a respeito das quais hoje advirto vocês” ou “a respeito das quais hoje dou testemunho contra vocês”. Em contextos de aliança, o verbo hebraico pode expressar testemunho solene, advertência ou força forense.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “seus filhos”; o termo pode representar mais amplamente a geração seguinte.'
    reason: lexical_alternative
