base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: pt
  text: 'E ele lhes disse: “Ponham no coração todas as palavras a respeito das quais hoje dou testemunho entre vocês[a], para que ordenem a seus filhos que guardem e cumpram[b] todas as palavras desta lei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “a respeito das quais hoje advirto vocês” ou “a respeito das quais hoje dou testemunho contra vocês”. Em contextos de aliança, o verbo hebraico pode expressar testemunho solene, advertência ou força forense.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “seus filhos”; o termo pode representar mais amplamente a geração seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Ponham no coração
  rationale: Preserva a imagem concreta do hebraico e comunica atenção interior, vontade e determinação em português natural.
- source_word: הַדְּבָרִים
  choice: as palavras
  rationale: Refere-se às declarações e instruções da aliança e mantém a repetição de דִּבְרֵי no fim do versículo.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: com que hoje dou testemunho entre vocês
  rationale: Mantém o sentido formal de testemunho e traduz בָּכֶם de modo compatível com o contexto público e comunitário, sem excluir a possível força de advertência ou acusação.
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: para que ordenem
  rationale: 'No contexto, a oração relativa tem valor de propósito: Israel deve interiorizar as palavras para transmiti-las com autoridade à geração seguinte.'
- source_word: בְּנֵיכֶם
  choice: seus filhos
  rationale: Conserva o masculino plural explícito do hebraico; uma nota registra que o termo pode representar mais amplamente a geração seguinte.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: que tenham o cuidado de cumprir
  rationale: Expressa conjuntamente a observância cuidadosa e a execução efetiva requeridas pelos dois infinitivos hebraicos, com fluência em português.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: as palavras desta lei
  rationale: Mantém a formulação hebraica, a repetição de 'palavras' e o sentido estabelecido de תּוֹרָה no contexto da aliança de Deuteronômio.
theological_decisions:
- issue: Nuance forense de מֵעִיד בָּכֶם
  choice: dou testemunho entre vocês
  alternative: advirto vocês hoje; hoje invoco testemunho contra vocês
  rationale: A formulação principal conserva a solenidade do testemunho da aliança sem tornar explícita uma força adversativa não inequívoca neste versículo; a nota preserva as demais possibilidades.
- issue: Referência de gênero em בְּנֵיכֶם
  choice: seus filhos
  alternative: seus filhos e descendentes; seus filhos e filhas
  rationale: O texto hebraico emprega o masculino plural 'filhos', que pode funcionar representativamente para a geração seguinte; a tradução mantém a forma lexical e esclarece o alcance possível em nota.
- issue: Relação entre guardar e fazer em לִשְׁמֹר לַעֲשׂוֹת
  choice: tenham o cuidado de cumprir
  alternative: guardem, para cumprir; observem e pratiquem
  rationale: A redação escolhida não reduz a exigência à mera audição ou memória, mas apresenta a observância cuidadosa como orientada à prática efetiva.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A expressão 'ponham no coração' preserva o idioma hebraico sem soar arcaica. 'Vocês' evita regionalismo excessivo, e 'tenham o cuidado de cumprir' comunica naturalmente a dupla ênfase em observar e fazer.
