revisions:
- from: 'E ele lhes disse: “Ponham no coração todas as palavras com que hoje dou testemunho entre vocês[a], para que ordenem a seus filhos que tenham o cuidado de cumprir[b] todas as palavras desta lei.”'
  to: 'E ele lhes disse: “Ponham no coração todas as palavras a respeito das quais hoje dou testemunho entre vocês[a], para que ordenem a seus filhos que guardem e cumpram[b] todas as palavras desta lei.”'
  rationale: 'A revisão corrige a relação sintática da oração relativa ligada a «palavras» e restaura explicitamente a dupla ação expressa pelos infinitivos hebraicos, sem resolver além do necessário a nuance disputada de מֵעִיד בָּכֶם. As âncoras das notas permanecem válidas: [a] continua ligada à expressão de testemunho, e [b] a «filhos».'
