base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/033.yaml
  text: Their wine is the venom of serpents[b][a], the cruel poison of cobras.
translation:
  language: pt
  text: 'O vinho deles é veneno de serpentes[a],

    e peçonha cruel de cobras[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em outros contextos, o termo hebraico também pode designar grandes répteis ou monstros; aqui, o paralelo com serpentes venenosas favorece “serpentes”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico nomeia uma serpente venenosa, tradicionalmente traduzida como “áspide” ou “víbora”; a espécie exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: veneno
  rationale: No paralelismo com serpentes e com רֹאשׁ, o substantivo designa uma substância tóxica, não ira ou calor. “Veneno” é claro e natural em português.
- source_word: תַּנִּינִם
  choice: serpentes
  rationale: Embora o termo possa designar grandes répteis ou monstros em outros contextos, a referência ao veneno e o paralelo com פְּתָנִים favorecem aqui serpentes.
- source_word: יֵינָם
  choice: o vinho deles
  rationale: Reproduz diretamente a construção possessiva e mantém a metáfora poética.
- source_word: וְרֹאשׁ
  choice: peçonha
  rationale: Neste contexto, o termo indica uma substância venenosa ou amarga. “Peçonha” evita repetição imediata de “veneno” e se associa naturalmente a animais peçonhentos.
- source_word: פְּתָנִים
  choice: cobras
  rationale: O hebraico nomeia uma serpente venenosa cuja identificação zoológica exata é incerta. “Cobras” comunica o sentido sem impor uma espécie específica.
- source_word: אַכְזָר
  choice: cruel
  rationale: Preserva a personificação forte do hebraico, caracterizando a peçonha por seu efeito implacável e mortal.
