  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: pt
  text: Definhados pela fome e consumidos pela peste[a] e pela destruição amarga; enviarei contra eles as presas das feras[b], junto com o veneno das criaturas que rastejam no pó[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “febre ardente”. O hebraico רֶשֶׁף também pode evocar Resefe, nome associado à peste no antigo Oriente Próximo.'
