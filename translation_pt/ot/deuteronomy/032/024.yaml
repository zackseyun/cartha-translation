  - marker: b
    text: 'Literalmente: “os dentes dos animais”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica é ampla e pode incluir serpentes e outras criaturas que rastejam pelo chão.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: Consumidos pela fome
  rationale: מְזֵי descreve pessoas definhadas ou exauridas; em combinação com רָעָב, a formulação comunica de modo natural a devastação física causada pela fome, sem restringir o termo necessariamente a uma fome coletiva formal.
- source_word: וּלְחֻמֵי רֶשֶׁף
  choice: devorados pela peste
  rationale: לְחֻמֵי é uma forma rara ligada à ideia de comer ou consumir. 'Devorados' preserva essa imagem concreta; 'peste' expressa o sentido destrutivo mais provável de רֶשֶׁף no contexto.
- source_word: וְקֶטֶב מְרִירִי
  choice: e pela destruição amarga
  rationale: קֶטֶב denota destruição, flagelo ou pestilência. 'Destruição' evita redundância com 'peste', enquanto 'amarga' conserva o valor literal e poético de מְרִירִי.
- source_word: וְשֶׁן בְּהֵמוֹת
  choice: as presas das feras
  rationale: שֶׁן significa literalmente 'dente', mas 'presas' comunica naturalmente o perigo de animais atacantes. בְּהֵמוֹת é amplo, porém 'feras' torna explícita a ameaça exigida pelo contexto sem identificar uma espécie.
- source_word: אֲשַׁלַּח בָּם
  choice: enviarei contra eles
  rationale: A preposição com o verbo de enviar tem aqui sentido hostil; 'contra eles' exprime com clareza o juízo anunciado.
- source_word: חֲמַת זֹחֲלֵי עָפָר
  choice: o veneno das criaturas que rastejam no pó
  rationale: חֲמַת pode significar ardor, ira ou veneno; associado a criaturas rastejantes, 'veneno' é contextual. A expressão ampla 'criaturas que rastejam no pó' preserva a imagem hebraica sem reduzi-la apenas a serpentes.
theological_decisions:
- issue: Possível pano de fundo mitológico de רֶשֶׁף
  choice: Traduzir como substantivo comum, 'peste'.
  alternative: Transliterar como nome próprio, 'Resefe'.
  rationale: No paralelismo, o termo funciona como uma calamidade entre os juízos da aliança. A tradução comum representa melhor sua função imediata, enquanto a nota preserva a possível alusão antiga sem transformar em certeza uma ambiguidade lexical.
- issue: Agente dos flagelos anunciados
  choice: Manter a primeira pessoa explícita em 'enviarei'.
  alternative: Converter em construção impessoal, como 'serão atacados'.
  rationale: O hebraico atribui diretamente ao locutor o envio das feras e do veneno; conservar essa forma evita atenuar a tensão teológica do juízo divino.
translation_notes:
  register: Português moderno, digno e de leitura natural, com paralelismo poético. 'Fome' é preferível a 'fome extrema' ou 'carestia' porque mantém a amplitude de רָעָב. As notas aparecem na ordem textual [a], [b], [c] e registram ambiguidades relevantes sem sobrecarregar o versículo.
