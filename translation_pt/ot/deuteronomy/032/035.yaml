base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: pt
  text: A mim pertencem a vingança e a retribuição[a][d], no tempo em que o pé deles vacilar[b]; pois está próximo o dia da sua calamidade, e se apressa o que lhes está preparado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a paga» ou «a recompensa devida».
    reason: lexical_alternative
  - marker: b
    text: Ou «o pé deles escorregar» ou «ceder».
    reason: lexical_alternative
  - marker: c
    text: Ou «as coisas destinadas a eles se apressam»; o hebraico é conciso.
    reason: lexical_alternative
  - marker: d
    text: A afirmação sobre a vingança e a retribuição é citada em Romanos 12:19 e retomada em Hebreus 10:30.
    reason: cross_reference
lexical_decisions:
- source_word: לִי
  choice: A mim pertencem
  rationale: A preposição com sufixo de primeira pessoa expressa posse ou prerrogativa; esta formulação natural em português abrange os dois substantivos coordenados.
- source_word: נָקָם
  choice: vingança
  rationale: Preserva o sentido de retribuição judicial divina e a ressonância intertextual, sem o reduzir ao termo mais genérico «justiça».
- source_word: וְשִׁלֵּם
  choice: e a retribuição
  rationale: O termo, ligado à ideia de pagar ou retribuir, funciona aqui em paralelo nominal com «vingança»; «retribuição» é claro, solene e adequado ao contexto judicial.
- source_word: לְעֵת
  choice: para o tempo em que
  rationale: Mantém a construção hebraica e sua possível orientação para o momento determinado, sem converter a frase inequivocamente em simples simultaneidade.
- source_word: תָּמוּט רַגְלָם
  choice: o pé deles vacilar
  rationale: Conserva o singular coletivo «pé» e a imagem poética de instabilidade e queda iminente.
- source_word: כִּי קָרוֹב
  choice: pois está próximo
  rationale: Expressa naturalmente o valor explicativo ou causal de כִּי.
- source_word: יוֹם אֵידָם
  choice: o dia da sua calamidade
  rationale: «Calamidade» comunica desastre destrutivo em registro digno, sem especificar além do hebraico.
- source_word: וְחָשׁ
  choice: se apressa
  rationale: Preserva a personificação e a concisão poética do verbo que indica aproximação rápida.
- source_word: עֲתִדֹת לָמוֹ
  choice: o que lhes está preparado
  rationale: Representa concretamente aquilo que está pronto ou destinado para eles, mantendo indefinido o conteúdo exato do juízo.
theological_decisions:
- issue: Natureza da linguagem de retribuição divina
  choice: «A mim pertencem a vingança e a retribuição»
  alternative: «A justiça é minha» ou «eu me vingarei»
  rationale: A redação preserva a prerrogativa divina de julgar e retribuir, sem suavizar «vingança» para um conceito mais geral nem sugerir vindicta pessoal caprichosa.
- issue: Sentido de עֲתִדֹת לָמוֹ
  choice: «o que lhes está preparado»
  alternative: «seu destino fatal» ou «as coisas destinadas a eles»
  rationale: A formulação concreta reflete a expressão hebraica comprimida e preserva a ambiguidade quanto à natureza precisa do que os aguarda.
- issue: Relação temporal introduzida por לְעֵת
  choice: «para o tempo em que»
  alternative: «no momento em que»
  rationale: A opção mantém a orientação da preposição hebraica para o tempo assinalado, sem eliminar a possível leitura de que a vingança e a retribuição estão reservadas para esse momento.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e as imagens do hebraico foram preservadas sempre que naturais; evitou-se explicitar além do texto a natureza do que está preparado para os julgados.
