base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: pt
  text: Vejam agora que eu, sim, eu sou ele, e não há deus algum além de mim.[a] Eu faço morrer e faço viver; eu feri e eu curarei;[b] ninguém pode escapar da minha mão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não há Deus comigo”. A preposição hebraica significa literalmente “com”, mas, neste contexto, provavelmente expressa a ideia de que nenhuma outra divindade existe ao lado dele.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu esmaguei e eu curarei”. O verbo traduzido por “feri” pode ter o sentido mais forte de esmagar ou despedaçar.'
    reason: lexical_alternative
  - marker: c
    text: “Da minha mão” é uma expressão hebraica que significa escapar do poder ou domínio de alguém.
    reason: cultural_note
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: Vejam agora
  rationale: O imperativo plural convoca os ouvintes a reconhecer a verdade apresentada; “vejam agora” é direto, natural e preserva o valor temporal de עַתָּה.
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: que eu, sim, eu sou ele
  rationale: A construção com “sim” reproduz de modo natural em português a ênfase da repetição אֲנִי אֲנִי, sem acrescentar “sozinho”, enquanto “sou ele” mantém a formulação simples e sua possível ressonância intertextual.
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: e não há deus algum além de mim
  rationale: Neste contexto de exclusividade divina, “além de mim” comunica que nenhuma outra divindade existe ao lado do falante; “deus” fica em minúscula por se referir a qualquer pretensa divindade rival.
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: Eu faço morrer e faço viver
  rationale: A formulação preserva a agência causativa e o paralelismo antitético dos dois verbos, com dignidade poética e clareza moderna.
- source_word: מָחַצְתִּי
  choice: eu feri
  rationale: O verbo pode exprimir ferir, esmagar ou despedaçar. “Feri” mantém a antítese direta com “curarei” sem enfraquecer nem maximizar indevidamente a imagem.
- source_word: וַאֲנִי אֶרְפָּא
  choice: e eu curarei
  rationale: O pronome explícito preserva a ênfase do hebraico, e o futuro expressa naturalmente o imperfeito após o perfeito “feri”.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: não há quem possa livrar alguém da minha mão
  rationale: A expressão comunica a inexistência de qualquer agente capaz de resgatar uma pessoa do poder divino. “Da minha mão” preserva o idioma hebraico, esclarecido em nota.
theological_decisions:
- issue: Exclusividade divina em relação a outros deuses
  choice: “não há deus algum além de mim”
  alternative: “não há Deus comigo”
  rationale: O contexto favorece uma declaração forte de exclusividade, mas a nota conserva a tradução mais literal da preposição e a possível nuance de ausência de associado.
- issue: Peso teológico e intertextual de “eu sou ele”
  choice: Manter “eu sou ele”, com a repetição enfática vertida como “eu, sim, eu”
  alternative: “eu sou o único” ou “eu sou aquele”
  rationale: A escolha preserva o teor da frase hebraica e sua tensão teológica sem convertê-la em fórmula doutrinária nem acrescentar uma exclusividade já expressa na oração seguinte.
- issue: Soberania divina sobre morte, vida, ferida e cura
  choice: Preservar as afirmações paralelas em primeira pessoa sem explicação mitigadora
  alternative: Interpretá-las apenas como permissão divina ou como referência exclusiva a juízo nacional
  rationale: O texto atribui diretamente essas ações ao falante; a tradução não deve resolver por paráfrase questões teológicas que o verso deixa em formulação poética abrangente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por formas naturais no Brasil sem regionalismos marcados. A repetição enfática foi mantida como “eu, sim, eu”, evitando tanto uma repetição que poderia soar acidental quanto uma expansão interpretativa. O paralelismo poético foi preservado.
