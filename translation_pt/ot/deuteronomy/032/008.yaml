base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: pt
  text: Quando o Altíssimo deu a cada nação a sua herança, quando separou os filhos do ser humano[a], estabeleceu as fronteiras dos povos conforme o número dos filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Os filhos do ser humano” é uma expressão hebraica que se refere aos seres humanos ou à humanidade.
    reason: lexical_alternative
  - marker: b
    text: Os Manuscritos do Mar Morto e a Septuaginta trazem “filhos de Deus” (ou “anjos de Deus”) em vez de “filhos de Israel”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּ/הַנְחֵל
  choice: Quando ... deu ... a sua herança
  rationale: O infinitivo construto no hifil, com בְּ temporal, introduz a ocasião em que o Altíssimo atribuiu heranças às nações. A formulação é natural em português e conserva a ideia distributiva.
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: Título divino consagrado e claro em português, preservando a força do hebraico.
- source_word: גּוֹיִם
  choice: às nações
  rationale: Refere-se aos diversos povos do mundo, sem a conotação posterior que «gentios» poderia introduzir.
- source_word: בְּ/הַפְרִיד/וֹ
  choice: quando separou
  rationale: O segundo infinitivo temporal tem como sujeito o Altíssimo; «separou» expressa diretamente o sentido de פרד.
- source_word: בְּנֵי אָדָם
  choice: os filhos do ser humano
  rationale: Mantém a imagem hebraica de «filhos» e o sentido coletivo de אָדָם, evitando que «filhos do homem» seja confundido com um título cristológico.
- source_word: יַצֵּב
  choice: estabeleceu
  rationale: O hifil de יצב indica fixar ou assentar firmemente; «estabeleceu» é digno e idiomático no contexto de fronteiras.
- source_word: גְּבֻלֹת עַמִּים
  choice: as fronteiras dos povos
  rationale: Expressa delimitação territorial e distingue עַמִּים de גּוֹיִם sem alterar o referente coletivo.
- source_word: לְ/מִסְפַּר
  choice: conforme o número de
  rationale: Representa a relação de correspondência ou medida indicada pela preposição לְ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Segue transparentemente a leitura do Texto Massorético fornecido, preservando a forma masculina e genealógica do hebraico.
theological_decisions:
- issue: Variante textual na cláusula final
  choice: os filhos de Israel
  alternative: os filhos de Deus; os anjos de Deus
  rationale: O texto WLC fornecido lê בְּנֵי יִשְׂרָאֵל. Contudo, manuscritos do mar Morto e a Septuaginta testemunham uma leitura diferente, relevante para a interpretação da visão do mundo apresentada pelo versículo; por isso, ela é indicada em nota sem substituir silenciosamente o texto-base.
- issue: Expressão antropológica בְּנֵי אָדָם
  choice: os filhos do ser humano
  alternative: a humanidade; os seres humanos; os filhos de Adão
  rationale: A tradução conserva a figura masculina e coletiva do hebraico, enquanto a nota explicita que a expressão designa os seres humanos em geral.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem poética das duas orações temporais foi preservada. «Ser humano» comunica o valor coletivo de אָדָם sem apagar a imagem de filiação nem criar uma associação indevida com o título «Filho do Homem».
