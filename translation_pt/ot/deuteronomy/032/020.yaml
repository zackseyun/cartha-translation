  text: וַ/יֹּ֗אמֶר אַסְתִּ֤ירָה פָנַ/י֙ מֵ/הֶ֔ם אֶרְאֶ֖ה מָ֣ה אַחֲרִיתָ֑/ם כִּ֣י ד֤וֹר תַּהְפֻּכֹת֙ הֵ֔מָּה בָּנִ֖ים לֹא אֵמֻ֥ן בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: pt
  text: 'E ele disse: “Esconderei deles o meu rosto; verei qual será o fim deles, pois são uma geração perversa[a], filhos em quem não há fidelidade[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma geração de perversidades”. A expressão hebraica é literalmente “uma geração de perversidades/distorções”.
    reason: lexical_alternative
  - marker: b
    text: Ou “filhos em quem não há confiabilidade” ou “lealdade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: Esconderei deles o meu rosto
  rationale: Preserva a expressão hebraica sobre ocultar o rosto, que comunica a retirada do favor ou da presença divina, sem reduzi-la a uma simples ideia de ausência.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: verei qual será o fim deles
  rationale: אַחֲרִית pode indicar fim, destino ou resultado. “Fim” conserva a concisão e a solenidade do hebraico.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: uma geração perversa
  rationale: Formulação natural em português que expressa a corrupção e a distorção moral indicadas pelo substantivo hebraico plural, cuja forma mais literal é registrada em nota.
- source_word: בָּנִים
  choice: filhos
  rationale: Mantém a metáfora familiar e pactual do hebraico, referindo-se coletivamente ao povo como descendência.
- source_word: לֹא אֵמֻן בָּם
  choice: em quem não há fidelidade
  rationale: אֵמֻן denota firmeza, confiabilidade ou fidelidade. “Fidelidade” expressa adequadamente a acusação moral e relacional no contexto da aliança.
theological_decisions:
- issue: Expressão antropomórfica do rosto divino
  choice: Esconderei deles o meu rosto
  alternative: Eu me afastarei deles
  rationale: A imagem do rosto possui peso pactual em Deuteronômio e deve ser preservada, sem explicar em excesso como se dá a retirada do favor ou da presença divina.
- issue: Sentido de אֵמֻן
  choice: fidelidade
  alternative: confiabilidade
  rationale: O contexto censura a falta de constância moral e relacional do povo, não a ausência de crença intelectual; “fidelidade” mantém essa tensão pactual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e as imagens principais do hebraico foram preservadas, enquanto “geração perversa” evita uma construção excessivamente áspera no texto principal. Os marcadores [a] e [b] aparecem junto às expressões que suas respectivas notas explicam.
