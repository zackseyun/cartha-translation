  text: שִׁחֵ֥ת ל֛/וֹ לֹ֖א בָּנָ֣י/ו מוּמָ֑/ם דּ֥וֹר עִקֵּ֖שׁ וּ/פְתַלְתֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: pt
  text: Eles agiram corruptamente para com ele[a]; não são seus filhos, por causa do defeito deles. São uma geração perversa e retorcida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é difícil e condensado. A primeira oração também pode ser entendida como “Eles se corromperam”; a expressão seguinte pode ser traduzida como “a mancha deles” ou “a culpa deles”.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “uma geração perversa e tortuosa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: agiram de modo corrupto
  rationale: O piel de שׁחת expressa aqui uma ação corrupta. A formulação preserva a força verbal sem impor o sentido reflexivo, que não está explícito no texto consonantal.
- source_word: לוֹ
  choice: para com ele
  rationale: A preposição ל com sufixo pronominal é difícil nesta oração condensada. “Para com ele” mantém a relação com Deus sem defini-la estritamente como favorável ou adversativa.
- source_word: לֹא בָּנָיו
  choice: não são seus filhos
  rationale: A expressão hebraica é nominal e concisa. O verbo “são” é suprido naturalmente em português, sem acrescentar a ideia temporal de que já não seriam filhos.
- source_word: מוּמָם
  choice: por causa do defeito deles
  rationale: מוּם costuma designar defeito ou mancha. “Defeito” conserva a metáfora moral; “por causa de” explicita com cautela a relação sintática, que no hebraico é comprimida.
- source_word: דּוֹר
  choice: geração
  rationale: É a equivalência corrente e semanticamente precisa neste contexto poético e pactual.
- source_word: עִקֵּשׁ
  choice: perversa
  rationale: O adjetivo descreve o que é torto ou moralmente desviado. “Perversa” é natural em português e mantém o peso moral do termo.
- source_word: וּפְתַלְתֹּל
  choice: retorcida
  rationale: Este adjetivo raro intensifica a distorção moral. “Retorcida” preserva a imagem e não funde os dois adjetivos hebraicos em uma única ideia.
theological_decisions:
- issue: Se לֹא בָּנָיו declara perda da condição de filhos da aliança ou nega o caráter filial
  choice: não são seus filhos
  alternative: já não são seus filhos; não são filhos para ele
  rationale: O hebraico faz uma negação enfática, mas não contém marcador temporal. A tradução mantém a severidade e a tensão do texto sem introduzir uma conclusão teológica mais desenvolvida sobre a condição pactual.
- issue: Como analisar sintaticamente o primeiro cólon, que é muito condensado
  choice: Eles agiram de modo corrupto para com ele; não são seus filhos, por causa do defeito deles.
  alternative: Eles se corromperam; não são seus filhos; a mancha é deles. / Ele agiu de modo corrupto para com ele; não ser seus filhos é a mancha deles.
  rationale: Deuteronômio 32:5 apresenta reconhecida dificuldade sintática. A leitura adotada acompanha de modo plausível a vocalização massorética e produz português coerente sem emendar o texto; a ambiguidade real é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem poética foi preservada, e as relações sintáticas apenas implícitas no hebraico foram explicitadas com moderação. Os marcadores [a] e [b] aparecem no texto principal.
