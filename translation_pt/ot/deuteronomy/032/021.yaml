base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: pt
  text: Eles provocaram meu ciúme com o que não é deus; provocaram minha ira com seus ídolos.[a] Por isso, eu os farei sentir ciúme por meio de um povo que não é povo[b]; provocarei sua ira por meio de uma nação insensata.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com suas coisas inúteis” ou “com suas vaidades”. O termo hebraico pode indicar vazio ou inutilidade e, neste contexto, refere-se a ídolos.
    reason: lexical_alternative
  - marker: b
    text: Ou “por meio de um não povo”. O hebraico estabelece um paralelo deliberado com “o que não é deus”.
    reason: lexical_alternative
  - marker: c
    text: “Insensata” tem aqui sentido moral e espiritual, não indica apenas falta de inteligência.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי
  choice: provocaram meu ciúme
  rationale: Preserva o sentido causativo de קנא e permite manter a reciprocidade com אַקְנִיאֵם, em linguagem portuguesa natural e digna.
- source_word: בְּלֹא אֵל
  choice: com o que não é deus
  rationale: Mantém a negação polêmica do hebraico e o substantivo comum אֵל, sem identificar o referente como o Deus verdadeiro nem suavizar a formulação.
- source_word: כִּעֲסוּנִי
  choice: provocaram minha ira
  rationale: Expressa a força causativa de כעס e conserva o paralelismo com אַכְעִיסֵם.
- source_word: בְּהַבְלֵיהֶם
  choice: com seus ídolos
  rationale: No contexto, הבל designa metonimicamente os ídolos; a nota preserva os sentidos literais de vacuidade, inutilidade e vaidade.
- source_word: אַקְנִיאֵם
  choice: provocarei o ciúme deles
  rationale: Reproduz a raiz usada no primeiro membro e torna clara a simetria retributiva do versículo.
- source_word: בְּלֹא עָם
  choice: por meio dos que não são povo
  rationale: Preserva a formulação deliberadamente paradoxal e seu paralelo com 'o que não é deus', sem identificar um povo histórico específico.
- source_word: בְּגוֹי נָבָל
  choice: por meio de uma nação insensata
  rationale: '''Insensata'' comunica a falta de discernimento moral e espiritual de נבל melhor do que uma descrição de mera capacidade intelectual.'
- source_word: אַכְעִיסֵם
  choice: provocarei sua ira
  rationale: Mantém a força causativa e a correspondência verbal com 'provocaram minha ira'.
theological_decisions:
- issue: Referente de 'os que não são povo' e 'uma nação insensata'
  choice: Tradução genérica, sem identificar uma nação histórica
  alternative: Uma nação gentia específica, os gentios coletivamente ou um povo desprezível
  rationale: O texto hebraico não identifica a nação. A formulação genérica conserva a tensão retórica e teológica e evita inserir no texto uma interpretação posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A estrutura paralela e retributiva do hebraico foi conservada; 'por meio de' explicita o valor instrumental da preposição sem identificar o agente histórico.
