revisions:
- from: Eles provocaram meu ciúme com o que não é deus; provocaram minha ira com seus ídolos.[a] Por isso, provocarei o ciúme deles por meio dos que não são povo[b]; provocarei sua ira por meio de uma nação insensata.[c]
  to: Eles provocaram meu ciúme com o que não é deus; provocaram minha ira com seus ídolos.[a] Por isso, eu os farei sentir ciúme por meio de um povo que não é povo[b]; provocarei sua ira por meio de uma nação insensata.[c]
  rationale: A revisão torna explícito em português que o sujeito divino fará o povo sentir ciúme, sem alterar o sentido nem especificar a identidade da nação. Também recupera mais de perto a formulação paradoxal singular de «não povo». As notas e seus marcadores permanecem corretamente ancorados.
