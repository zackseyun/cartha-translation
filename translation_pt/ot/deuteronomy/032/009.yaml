  text: כִּ֛י חֵ֥לֶק יְהֹוָ֖ה עַמּ֑/וֹ יַעֲקֹ֖ב חֶ֥בֶל נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: pt
  text: 'Pois a porção de Yahweh é o seu povo;

    Jacó, o quinhão[a] de sua herança.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Jacó, a corda de medir de sua herança” ou “Jacó, o lote de sua herança”. O termo hebraico חֶבֶל pode designar literalmente uma corda de medir e, por extensão, uma porção demarcada ou atribuída.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e preserva de modo natural a ligação argumentativa do cântico.
- source_word: חֵלֶק
  choice: porção
  rationale: Designa a parte atribuída a alguém e mantém a imagem de distribuição que domina o contexto.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: Expressa a relação coletiva e pactual indicada por עַם; o artigo torna a formulação natural em português.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Conserva o nome patriarcal usado poeticamente para o povo de Israel, sem converter a metáfora em explicação.
- source_word: חֶבֶל
  choice: quinhão
  rationale: No paralelismo com 'porção' e 'herança', denota a parte atribuída a alguém. 'Quinhão' preserva tanto a ideia de atribuição quanto o registro poético.
- source_word: נַחֲלָתוֹ
  choice: sua herança
  rationale: Mantém a imagem de herança ou posse recebida e o paralelismo conciso do hebraico.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original traz o Tetragrama como nome próprio. 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Identificação de Jacó com Israel
  choice: Jacó
  alternative: Israel
  rationale: O hebraico emprega explicitamente 'Jacó'. Preservar o nome mantém o paralelismo poético e a referência corporativa sem explicitação interpretativa.
- issue: Relação entre Yahweh e seu povo nas imagens de porção e herança
  choice: Manter ambas as imagens possessivas sem explicação doutrinária adicional
  alternative: Explicitar que Israel pertence exclusivamente a Yahweh
  rationale: O verso apresenta o povo como porção e quinhão de Yahweh, mas não desenvolve aqui todas as implicações teológicas dessa relação.
translation_notes:
  register: Português moderno, digno e poético, com paralelismo conciso. O ponto e vírgula reproduz a estreita correspondência entre os dois membros do verso; a elipse do verbo no segundo membro conserva a forma poética hebraica.
