base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/048.yaml
  text: And Yahweh spoke to Moses on that very day[a], saying,
translation:
  language: pt
  text: 'Naquele mesmo dia, Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”. Outras formas incluem “Yahweh” e “Jeová”.'
    reason: Registra a forma hebraica do nome divino e as principais convenções de tradução.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O wayyiqtol de דבר dá continuidade à narrativa; “falou” é a forma portuguesa direta e natural, além de combinar bem com a fórmula seguinte לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל marca o destinatário da fala; “a Moisés” é a construção corrente em português.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: naquele mesmo dia
  rationale: A expressão idiomática enfatiza que o acontecimento ocorreu precisamente naquele dia; não se traduz literalmente o substantivo עֶצֶם como “osso” ou “substância”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso direto do versículo seguinte, mantendo o encadeamento formal sem soar artificial em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo pelo título tradicional “SENHOR”; a nota registra as formas tradicionais conhecidas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem inicial “Naquele mesmo dia” expressa naturalmente a ênfase temporal do hebraico. Mantém-se “dizendo” para conservar a fórmula de introdução do discurso que continua no versículo seguinte.
