  text: כִּ֛י שֵׁ֥ם יְהוָ֖ה אֶקְרָ֑א הָב֥וּ גֹ֖דֶל לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: pt
  text: Pois proclamarei o nome de Yahweh[a]; atribuam grandeza ao nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”. Outras formas usadas em português incluem “Javé” e “Jeová”.'
    reason: Esclarece a representação do Tetragrama e registra traduções tradicionais e alternativas.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a força causal ou explicativa da conjunção e liga naturalmente o verso ao contexto do cântico.
- source_word: שֵׁם
  choice: nome
  rationale: Preserva o termo concreto, que aqui abrange a identidade revelada e a reputação de Deus sem as substituir por uma paráfrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶקְרָא
  choice: proclamarei
  rationale: No contexto do cântico, o verbo descreve a declaração pública do nome de Yahweh; o futuro também representa naturalmente a forma hebraica.
- source_word: הָבוּ
  choice: atribuam
  rationale: O imperativo plural convoca os ouvintes a reconhecerem a grandeza que pertence a Deus, sem sugerir que eles a concedem ou produzem.
- source_word: גֹדֶל
  choice: grandeza
  rationale: É o equivalente direto do substantivo hebraico e conserva sua referência à excelsitude de Deus.
- source_word: לֵאלֹהֵינוּ
  choice: ao nosso Deus
  rationale: Expressa a preposição e o sufixo de primeira pessoa do plural de modo natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. A transliteração preserva o nome pessoal e evita substituí-lo silenciosamente por um título; a nota registra as formas tradicionais.
- issue: Sentido de הָבוּ גֹדֶל
  choice: atribuam grandeza
  alternative: deem grandeza; reconheçam a grandeza
  rationale: A formulação conserva a imagem hebraica de atribuir grandeza a Deus, entendida como reconhecimento e louvor, não como concessão humana de uma qualidade que Deus não possuísse.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Proclamarei” e “atribuam grandeza” preservam o tom poético e convocatório sem recorrer a linguagem excessivamente arcaica.
