  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
translation:
  language: pt
  text: 'coalhada do gado e leite do rebanho,

    com a gordura de cordeiros,

    de carneiros criados em Basã e de bodes,

    com o trigo mais seleto[a];

    e bebeste vinho espumoso[b],

    o sangue das uvas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a gordura dos rins do trigo”, expressão que indica o trigo mais fino ou rico.
    reason: lexical_alternative
  - marker: b
    text: Ou “vinho tinto”; o termo hebraico pode evocar vinho intensamente fermentado ou espumoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: coalhada do gado
  rationale: חֶמְאָה designa um produto lácteo espesso, possivelmente leite coalhado ou nata, não necessariamente a manteiga moderna. “Coalhada” preserva a imagem pastoril e “do gado” mantém o sentido coletivo de בָּקָר.
- source_word: חֲלֵב צֹאן
  choice: leite do rebanho
  rationale: צֹאן é um coletivo para animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanho” preserva essa amplitude e o paralelismo com “gado”.
- source_word: חֵלֶב כָּרִים
  choice: a gordura de cordeiros
  rationale: חֵלֶב significa literalmente “gordura”, evocando alimento rico e abundante; כָּרִים refere-se a ovinos jovens, aqui vertido de modo claro como “cordeiros”.
- source_word: אֵילִים בְּנֵי בָשָׁן
  choice: carneiros criados em Basã
  rationale: A expressão literal “carneiros, filhos de Basã” indica animais provenientes ou criados nessa região fértil. A formulação escolhida comunica naturalmente o valor idiomático sem apagar a referência geográfica.
- source_word: עַתּוּדִים
  choice: bodes
  rationale: O termo designa especificamente caprinos machos. “Bodes” conserva essa precisão, que é facilmente compreensível em português.
- source_word: חֵלֶב כִּלְיוֹת חִטָּה
  choice: o trigo mais seleto
  rationale: A expressão literalmente menciona “a gordura dos rins do trigo”, metáfora hebraica para os grãos mais ricos ou excelentes. A tradução idiomática evita obscuridade, enquanto a nota preserva a imagem original.
- source_word: דַם עֵנָב
  choice: o sangue das uvas
  rationale: A metáfora poética é mantida de forma direta, em aposição ao vinho, preservando a força visual do hebraico.
- source_word: תִּשְׁתֶּה
  choice: bebeste
  rationale: O imperfeito hebraico ocorre na recapitulação poética das dádivas recebidas por Israel. O pretérito perfeito corresponde naturalmente a essa perspectiva narrativa.
- source_word: חָמֶר
  choice: vinho espumoso
  rationale: O termo designa vinho e pode sugerir sua fermentação intensa ou espuma; “espumoso” preserva essa vivacidade, e a alternativa “vinho tinto” é registrada em nota.
theological_decisions:
- issue: Representação da abundância pastoril e agrícola
  choice: Manter as imagens concretas de alimentos e bebida
  alternative: Substituí-las por linguagem abstrata sobre prosperidade ou bênção da aliança
  rationale: O versículo enumera provisões concretas. A tradução não acrescenta uma interpretação teológica abstrata à poesia.
- issue: Relação entre o vinho e “o sangue das uvas”
  choice: Tratar “o sangue das uvas” como expressão poética em aposição ao vinho
  alternative: Explicitar causalidade, como “vinho feito do sangue das uvas”
  rationale: A aposição reflete mais de perto a construção poética hebraica e preserva sua tensão metafórica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética em versos. Empregou-se “bebeste” para conservar o tratamento singular e o tom solene sem recorrer a construções arcaicas mais extensas. As metáforas transparentes foram preservadas; a expressão hebraica opaca sobre os “rins do trigo” foi vertida idiomaticamente e documentada em nota.
