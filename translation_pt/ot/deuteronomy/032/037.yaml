  text: וְ/אָמַ֖ר אֵ֣י אֱלֹהֵ֑י/מוֹ צ֖וּר חָסָ֥יוּ בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: pt
  text: 'E ele dirá: “Onde estão os deuses deles, a rocha[a] em que buscaram refúgio?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “a rocha em que buscaram refúgio”, ou “a rocha, nela buscaram refúgio”. O hebraico passa de “os deuses deles”, no plural, para “rocha”, no singular, e usa um pronome masculino singular que retoma “rocha”.'
    reason: alternativa lexical e esclarecimento da construção gramatical
lexical_decisions:
- source_word: וְאָמַר
  choice: E ele dirá
  rationale: 'O qatal de אמר com a conjunção, no fluxo poético de Deuteronômio 32:36–38, tem sentido prospectivo: o SENHOR ainda dirá essas palavras. “E” preserva a ligação explícita do hebraico.'
- source_word: אֵי אֱלֹהֵימוֹ
  choice: Onde estão os deuses deles
  rationale: אֵי introduz a pergunta “onde?”, e אֱלֹהֵימוֹ tem sentido plural com sufixo de terceira pessoa do plural. A formulação expõe a impotência das divindades em que eles confiavam.
- source_word: צוּר
  choice: a rocha
  rationale: O substantivo singular “rocha” está em aposição a “os deuses deles” e descreve ironicamente a proteção que se esperava dessas divindades. A inicial minúscula evita confundi-lo com o título do SENHOR usado em outros pontos do cântico.
- source_word: חָסָיוּ בּוֹ
  choice: em que buscaram refúgio
  rationale: חסה significa procurar ou encontrar refúgio. A construção relativa reproduz naturalmente em português o sufixo masculino singular de בּוֹ, que retoma “rocha”, sem apagar a mudança do plural “deuses” para a imagem singular.
theological_decisions:
- issue: Identidade do falante e valor temporal de וְאָמַר
  choice: “E ele dirá”, entendido como continuação prospectiva da fala do SENHOR
  alternative: “E ele disse” ou “Então se dirá”
  rationale: O contexto imediato favorece o SENHOR como sujeito e apresenta a pergunta como a provocação que ele fará ao revelar a incapacidade dos falsos deuses. A forma poética admite esse valor futuro sem exigir que ele seja explicitado além do verbo.
- issue: Relação entre “os deuses deles” e “a rocha”
  choice: Manter o plural seguido da aposição metafórica singular, com “rocha” em minúscula
  alternative: Harmonizar o número (“as rochas”) ou escrever “Rocha” como título divino
  rationale: 'A tensão gramatical pertence ao hebraico: “rocha” singular caracteriza, de modo coletivo e irônico, os deuses em que buscaram proteção. Harmonizar o número ou usar maiúscula apagaria essa tensão e poderia sugerir indevidamente uma referência ao SENHOR.'
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla legibilidade brasileira. “Buscaram refúgio” conserva a metáfora concreta do hebraico; “os deuses deles” evita a possível ambiguidade de “seus deuses”. O marcador foi colocado junto à expressão que a nota esclarece.
