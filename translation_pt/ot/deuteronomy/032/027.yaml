  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: pt
  text: 'se eu não temesse a provocação do inimigo[a], para que seus adversários não interpretassem mal[b], para que não dissessem: “Nossa mão está elevada[c], e Yahweh não fez tudo isso”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se eu não receasse a insolência do inimigo”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico é difícil; também pode significar “julgassem mal” ou “não discernissem” a verdadeira causa da queda de Israel.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “Nossa mão é alta”. A expressão indica poder ou triunfo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: se eu não
  rationale: Preserva a força condicional-exceptiva da construção hebraica e liga naturalmente o versículo ao contexto anterior.
- source_word: כַּעַס אוֹיֵב
  choice: a provocação do inimigo
  rationale: כַּעַס pode designar aqui a provocação ou insolência do inimigo; a formulação mantém a ambiguidade entre aquilo que provoca e a atitude provocadora.
- source_word: אָגוּר
  choice: temesse
  rationale: Mantém explicitamente a linguagem de temor empregada na primeira pessoa no hebraico, sem suavizá-la para mera preocupação.
- source_word: פֶּן
  choice: para que... não
  rationale: Expressa em português atual a ideia preventiva das duas ocorrências de פֶּן; a segunda foi coordenada com “e não” para evitar rigidez desnecessária.
- source_word: יְנַכְּרוּ
  choice: interpretassem mal
  rationale: O piel de נכר é difícil neste contexto; “interpretassem mal” comunica que os adversários poderiam atribuir a queda de Israel à causa errada, sem eliminar as alternativas lexicais.
- source_word: צָרֵימוֹ
  choice: os adversários deles
  rationale: Mantém o referente plural e distingue os adversários de Israel do inimigo coletivo mencionado na oração anterior.
- source_word: יָדֵינוּ רָמָה
  choice: Nossa mão está elevada
  rationale: Conserva a metáfora hebraica da mão elevada como afirmação de poder e triunfo, em vez de substituí-la inteiramente por uma explicação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וְלֹא יְהוָה פָּעַל כָּל זֹאת
  choice: não foi Yahweh quem fez tudo isso
  rationale: A construção enfática soa natural em português e comunica claramente a alegação dos inimigos de que Yahweh não foi o agente desses acontecimentos.
theological_decisions:
- issue: Linguagem antropopática em אָגוּר
  choice: manter “temesse”
  alternative: “me preocupasse” ou “me contivesse por causa de”
  rationale: O hebraico emprega diretamente um verbo de temer ou recear. A tradução conserva essa tensão, deixando que o contexto esclareça que não se trata de fraqueza diante do inimigo.
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o caráter de nome próprio do Tetragrama sem substituí-lo por um título.
- issue: Agência na derrota de Israel
  choice: “não foi Yahweh quem fez tudo isso”
  alternative: “Yahweh não fez tudo isso”
  rationale: A formulação escolhida preserva a negação atribuída aos adversários e destaca a questão central da agência divina sem endossar a fala deles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O início em minúscula preserva a continuidade sintática com o versículo anterior. A repetição hebraica de פֶּן foi vertida por uma construção preventiva natural, e a metáfora da mão elevada foi mantida no texto principal.
