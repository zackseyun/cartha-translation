language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מֻ֗ת בָּ/הָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּ/ה וְ/הֵאָסֵ֖ף אֶל עַמֶּ֑י/ךָ כַּֽ/אֲשֶׁר מֵ֞ת אַהֲרֹ֤ן אָחִ֨י/ךָ֙ בְּ/הֹ֣ר הָ/הָ֔ר וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: pt
  text: e morra no monte ao qual você está subindo, e seja reunido ao seu povo[a], assim como Arão, seu irmão, morreu no monte Hor e foi reunido ao seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus antepassados”. A expressão hebraica diz literalmente “ao seu povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֻת
  choice: e morra
  rationale: O imperativo qal de מות dirige-se a Moisés. “E morra” preserva a forma direta e volitiva sem transformá-la apenas em predição.
- source_word: בָּהָר
  choice: no monte
  rationale: הַר designa normalmente um monte ou montanha; com ב, a expressão tem sentido locativo. “No monte” é natural em português neste contexto.
- source_word: אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: ao qual você está subindo
  rationale: עלה expressa movimento ascendente. A construção portuguesa comunica naturalmente o destino indicado por שָׁמָּה sem acrescentar o pouco idiomático “para lá”.
- source_word: וְהֵאָסֵף
  choice: e seja reunido
  rationale: O nifal de אסף integra a expressão bíblica relacionada à morte. “Seja reunido” conserva a imagem do original.
- source_word: אֶל עַמֶּיךָ
  choice: ao seu povo
  rationale: Mantém literalmente o elemento “povo” da expressão hebraica, em vez de restringi-lo interpretativamente a “antepassados” ou “parentes”.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Introduz de maneira clara e natural a comparação entre a morte de Moisés e a de Arão.
- source_word: מֵת
  choice: morreu
  rationale: O perfeito qal de מות, nesta comparação narrativa, é adequadamente expresso pelo pretérito perfeito.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Arão, seu irmão
  rationale: Conserva a ordem informacional do hebraico e usa pontuação natural em português para o aposto.
- source_word: בְּהֹר הָהָר
  choice: no monte Hor
  rationale: הֹר é o nome próprio, acompanhado de הָהָר. “Monte Hor” é a forma convencional e clara em português.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: e foi reunido ao seu povo
  rationale: Repete coerentemente a mesma expressão usada a respeito de Moisés e preserva a correspondência lexical do texto.
theological_decisions:
- issue: Tradução da expressão de morte אסף אל־עמיו
  choice: Conservar “ser reunido ao seu povo” no texto principal
  alternative: “ser reunido aos seus antepassados” ou “juntar-se aos seus parentes na morte”
  rationale: A expressão hebraica é um modo bíblico convencional de falar da morte, mas pode carregar implicações além do sepultamento. A formulação escolhida preserva sua imagem e sua tensão teológica, sem reduzi-la a uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” por clareza contemporânea e mantém o paralelismo entre Moisés e Arão. O marcador foi colocado junto à expressão que a nota explica.
