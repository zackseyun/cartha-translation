  text: ל֥וּ חָכְמ֖וּ יַשְׂכִּ֣ילוּ זֹ֑את יָבִ֖ינוּ לְ/אַחֲרִיתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/029.yaml
  text: If only they were wise[a], they would understand this; they would discern their end.
translation:
  language: pt
  text: Quem dera fossem sábios! Entenderiam isto e discerniriam o seu fim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu desfecho” ou “o seu futuro”. O hebraico pode referir-se ao resultado final de alguém ou ao que acontecerá depois.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּ
  choice: Quem dera
  rationale: A partícula introduz aqui um desejo ou lamento, não uma condição meramente neutra; “Quem dera” comunica essa força optativa com naturalidade em português.
- source_word: חָכְמ֖וּ
  choice: fossem sábios
  rationale: O verbo חכם expressa ter ou exercer sabedoria. Depois de “Quem dera”, o imperfeito do subjuntivo é a construção idiomática natural em português.
- source_word: יַשְׂכִּ֣ילוּ
  choice: Entenderiam
  rationale: O hifil de שׂכל pode indicar compreender, adquirir discernimento ou agir com sabedoria. Neste paralelismo cognitivo, “entenderiam” é claro e preserva distinção em relação ao verbo seguinte.
- source_word: זֹ֑את
  choice: isto
  rationale: Mantém o demonstrativo singular hebraico e sua referência provável à realidade ou lição apresentada no contexto anterior.
- source_word: יָבִ֖ינוּ
  choice: discerniriam
  rationale: בין significa perceber, compreender ou discernir. “Discerniriam” conserva a nuance perceptiva e evita nivelar os dois verbos paralelos numa única tradução.
- source_word: לְאַחֲרִיתָם
  choice: o seu fim
  rationale: אַחֲרִית pode designar o fim, o desfecho ou o futuro de alguém. “O seu fim” é conciso, mantém a ambiguidade essencial e preserva a força de advertência do contexto.
theological_decisions:
- issue: Sentido de אַחֲרִיתָם no contexto
  choice: o seu fim
  alternative: o seu desfecho; o seu futuro; o que lhes acontecerá depois
  rationale: A expressão aponta para o resultado que os aguarda, com possível dimensão temporal e judicial. “O seu fim” mantém essa tensão sem limitar o texto a uma referência exclusiva à morte nem suavizá-lo como simples menção ao futuro.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quem dera” reproduz o lamento inicial de modo idiomático; a exclamação seguida do futuro do pretérito torna explícita a relação desejada no hebraico sem transformar a frase numa condição comum. O paralelismo poético é preservado por “entenderiam” e “discerniriam”.
