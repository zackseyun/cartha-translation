  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: pt
  text: Então Moisés veio e falou todas as palavras deste cântico aos ouvidos do povo, ele e Oseias, filho de Num.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “Oseias”; essa mesma pessoa é geralmente chamada de Josué em outros lugares (ver Números 13:16).
    reason: Esclarece a forma do nome na fonte e sua relação com o nome mais conhecido, sem alterar o texto principal.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio
  rationale: O verbo בוא no wayyiqtol significa normalmente “vir” ou “chegar”. “Veio” preserva de modo natural a transição narrativa sem especificar além do texto.
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: דבר no piel tem o sentido comum de “falar”. A escolha mantém a ação verbal direta, sem acrescentar força retórica.
- source_word: אֶת כָּל דִּבְרֵי
  choice: todas as palavras
  rationale: A construção indica literalmente a totalidade das palavras e preserva a abrangência da recitação.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: deste cântico
  rationale: שירה designa aqui o cântico de Moisés. “Cântico” é natural no registro bíblico português e mantém a referência imediata.
- source_word: בְּאָזְנֵי הָעָם
  choice: aos ouvidos do povo
  rationale: A expressão conserva a imagem hebraica e comunica uma recitação pública e audível. É corrente e compreensível em português.
- source_word: הָעָם
  choice: o povo
  rationale: עם refere-se à comunidade reunida; “o povo” é a tradução portuguesa normal e suficientemente ampla.
- source_word: הוּא
  choice: ele
  rationale: 'O pronome independente foi mantido para refletir a formulação enfática ou apositiva do hebraico: “ele e Oseias”.'
- source_word: וְהוֹשֵׁעַ
  choice: Oseias
  rationale: O texto hebraico traz הוֹשֵׁעַ, a forma do nome tradicionalmente transliterada em português como “Oseias”, em vez de “Josué”.
- source_word: בִּן נוּן
  choice: filho de Num
  rationale: A expressão em estado construto é o patronímico habitual. “Filho de Num” é natural e fiel em português.
theological_decisions:
- issue: Identificação do companheiro de Moisés como Oseias ou Josué
  choice: Oseias
  alternative: Josué
  rationale: O hebraico deste versículo traz explicitamente הוֹשֵׁעַ. A tradução segue a forma presente na fonte, sem harmonizá-la silenciosamente com o nome mais conhecido, Josué; a nota esclarece a identidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem “ele e Oseias” conserva deliberadamente a construção marcada do hebraico. O marcador da nota foi colocado após a identificação completa para não interromper o patronímico.
