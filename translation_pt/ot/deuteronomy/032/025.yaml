  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: pt
  text: Lá fora, a espada deixará sem filhos; dentro dos aposentos, haverá terror[a] — tanto o jovem como a virgem[b], a criança de peito e o homem de cabelos brancos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e dos aposentos, pavor”. O hebraico contrasta o perigo lá fora com o terror no interior.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa uma jovem não casada, muitas vezes com a implicação de virgindade; “jovem mulher” é uma tradução possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: Lá fora
  rationale: Preserva de modo natural e conciso o contraste espacial com os aposentos interiores, sem especificar indevidamente a rua.
- source_word: תְּשַׁכֶּל
  choice: deixará sem filhos
  rationale: O piel de שׁכל expressa privar de filhos ou causar luto pela perda deles; a formulação mantém a força causativa e a espada personificada.
- source_word: חֶרֶב
  choice: a espada
  rationale: Conserva a imagem concreta e personificada da guerra como agente de morte.
- source_word: וּמֵחֲדָרִים
  choice: dentro dos aposentos
  rationale: O hebraico traz literalmente 'e dos aposentos'; no paralelismo com 'lá fora', a frase indica o espaço interior. A nota registra a forma mais literal e a ambiguidade sintática.
- source_word: אֵימָה
  choice: terror
  rationale: Equivalente direto e vigoroso, adequado ao estilo poético abrupto do verso.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: tanto para o jovem como para a virgem
  rationale: Mantém a estrutura inclusiva גם...גם e a especificidade lexical de בְּתוּלָה, sem generalizá-la silenciosamente como 'jovem mulher'.
- source_word: יוֹנֵק
  choice: criança de peito
  rationale: Reproduz a imagem participial daquele que mama em português corrente e compreensível.
- source_word: עִם אִישׁ שֵׂיבָה
  choice: e para o homem de cabelos brancos
  rationale: Preserva a imagem concreta da velhice indicada pelos cabelos brancos e integra naturalmente o último par de extremos etários.
