base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: pt
  text: 'A Rocha — perfeita é a sua obra,

    pois todos os seus caminhos são justiça.[a]

    Deus fiel[b] e sem injustiça,[c]

    justo e reto é ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os seus caminhos são juízo”. O hebraico מִשְׁפָּט pode indicar justiça, juízo ou aquilo que é juridicamente correto.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Deus de fidelidade”; também pode ser entendido como “Deus digno de confiança” ou, com menor probabilidade neste contexto, “Deus de verdade”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não há nele injustiça” / “sem iniquidade”. O hebraico עָוֶל abrange injustiça, perversidade e mal moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: A Rocha
  rationale: צוּר designa uma rocha ou penhasco e, neste cântico, funciona como metáfora e título divino. A inicial maiúscula sinaliza essa função sem eliminar a imagem.
- source_word: תָּמִים
  choice: perfeita
  rationale: Expressa inteireza, integridade e ausência de defeito na obra de Deus. “Perfeita” é clara, natural e adequada ao registro poético.
- source_word: פָּעֳלוֹ
  choice: a sua obra
  rationale: O substantivo singular com sufixo masculino refere-se de modo abrangente à atuação de Deus. A forma nominal concisa preserva a estrutura hebraica.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a afirmação anterior e mantém uma ligação explicativa natural em português.
- source_word: כָל־דְּרָכָיו
  choice: todos os seus caminhos
  rationale: Preserva a metáfora hebraica para a maneira de Deus agir, com formulação compreensível em português contemporâneo.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Como predicativo, caracteriza todos os caminhos de Deus como conformes ao que é justo. A nota preserva os sentidos judiciais alternativos.
- source_word: אֵל אֱמוּנָה
  choice: Deus fiel
  rationale: אֱמוּנָה denota aqui confiabilidade e constância. “Deus fiel” comunica isso com naturalidade, enquanto a nota registra a construção mais literal e a possível nuance de verdade.
- source_word: וְאֵין עָוֶל
  choice: e sem injustiça
  rationale: Nega em Deus toda injustiça, perversidade ou falta moral. A formulação é concisa e mantém o paralelismo dos atributos.
- source_word: צַדִּיק
  choice: justo
  rationale: Expressa a retidão moral de Deus e corresponde naturalmente ao contexto de justiça do verso.
- source_word: וְיָשָׁר
  choice: e reto
  rationale: Comunica integridade e correção moral, preservando a imagem hebraica de retidão.
- source_word: הוּא
  choice: é ele
  rationale: A colocação final mantém a ênfase poética do pronome hebraico.
theological_decisions:
- issue: Função metafórica e titular de הַצּוּר
  choice: “A Rocha”, com inicial maiúscula
  alternative: “a rocha”, com inicial minúscula, ou “o Rochedo”
  rationale: No Cântico de Moisés, o termo identifica metaforicamente o Deus de Israel. A maiúscula ajuda a reconhecer a força titular sem acrescentar conteúdo doutrinário.
- issue: Sentido de אֱמוּנָה como atributo divino
  choice: “fiel”
  alternative: “de fidelidade” ou “de verdade”
  rationale: O contexto enfatiza a confiabilidade e a constância moral de Deus. “Fiel” é idiomático em português, e a nota preserva a amplitude lexical.
- issue: Relação entre justiça e ausência de עָוֶל
  choice: “justiça” e “sem injustiça”
  alternative: “julgamento” e “sem iniquidade”
  rationale: A tradução mantém a tensão poética entre a justiça positiva dos caminhos de Deus e a negação de qualquer mal ou injustiça, sem restringir עָוֶל a uma categoria doutrinária específica.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A ordem marcada em “perfeita é a sua obra” e “justo e reto é ele” conserva parte da ênfase do hebraico sem tornar o verso obscuro. Os quatro membros foram dispostos em linhas para refletir o paralelismo poético.
