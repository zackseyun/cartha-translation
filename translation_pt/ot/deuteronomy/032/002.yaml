  text: יַעֲרֹ֤ף כַּ/מָּטָר֙ לִקְחִ֔/י תִּזַּ֥ל כַּ/טַּ֖ל אִמְרָתִ֑/י כִּ/שְׂעִירִ֣ם עֲלֵי דֶ֔שֶׁא וְ/כִ/רְבִיבִ֖ים עֲלֵי עֵֽשֶׂב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: pt
  text: Que o meu ensino caia como a chuva[a]; que a minha palavra goteje como o orvalho, como chuviscos sobre a relva tenra[b] e como chuvas abundantes sobre as plantas verdes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “goteje” ou “se destile”: o verbo hebraico retrata o ensino descendo como chuva.'
    reason: lexical_alternative
  - marker: b
    text: “Chuviscos” traduz um termo hebraico raro que pode designar chuva leve ou gotas de chuva.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: caia
  rationale: O verbo retrata o ensino descendo em gotas, à semelhança da chuva. “Caia” é natural em português e preserva o movimento descendente sem o tom técnico de “destile”.
- source_word: לִקְחִי
  choice: o meu ensino
  rationale: לֶקַח designa ensino ou instrução comunicada; “o meu ensino” se ajusta ao discurso poético de Moisés e é claro ao leitor moderno.
- source_word: תִּזַּל
  choice: goteje
  rationale: נזל pode descrever algo que flui ou pinga. “Goteje” mantém a imagem delicada do orvalho e o paralelismo com a chuva.
- source_word: אִמְרָתִי
  choice: a minha palavra
  rationale: אִמְרָה pode significar palavra, declaração ou fala. “A minha palavra” é idiomático e representa a expressão proferida em paralelo com “o meu ensino”.
- source_word: שְׂעִירִם
  choice: chuviscos
  rationale: O substantivo raro parece indicar chuva leve ou gotas de chuva. “Chuviscos” comunica precipitação suave e conserva o contraste com as chuvas abundantes do membro seguinte.
- source_word: דֶשֶׁא
  choice: relva tenra
  rationale: דֶּשֶׁא refere-se à vegetação nova ou à relva que brota. “Relva tenra” preserva essa nuance e distingue o termo de עֵשֶׂב.
- source_word: רְבִיבִים
  choice: chuvas abundantes
  rationale: רְבִיבִים denota chuvas copiosas ou aguaceiros. “Chuvas abundantes” mantém a intensidade e o plural sem sugerir necessariamente violência.
- source_word: עֵשֶׂב
  choice: plantas verdes
  rationale: עֵשֶׂב abrange ervas e outras plantas, sendo mais amplo que “relva”. “Plantas verdes” é acessível e mantém a distinção poética entre os dois tipos de vegetação.
theological_decisions: []
