  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: pt
  text: Ele o encontrou numa terra deserta e no ermo desolado, cheio de uivos; cercou-o, cuidou dele[a] e guardou-o como a pupila do seu olho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico traduzido por “cuidou dele” também pode significar “deu-lhe entendimento” ou “prestou muita atenção nele”.
    reason: alternative_reading
  - marker: b
    text: Ou, segundo uma expressão tradicional, “como a menina dos seus olhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: Ele o encontrou
  rationale: O verbo מצא significa normalmente “encontrar”. O passado exprime com naturalidade portuguesa a retrospectiva poética, e o pronome singular preserva a personificação coletiva de Israel/Jacó.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: numa terra deserta
  rationale: A expressão combina אֶרֶץ, “terra”, com מִדְבָּר, “deserto/ermo”. “Terra deserta” é clara e mantém a imagem de um lugar inóspito.
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: e no ermo desolado, cheio de uivos
  rationale: תֹהוּ comunica desolação ou vacuidade, יְשִׁמֹן designa uma região erma, e יְלֵל evoca uivos. A formulação conserva os três elementos sem impor aqui o sentido cosmológico de “caos”.
- source_word: יְסֹבְבֶנְהוּ
  choice: cercou-o
  rationale: סבב significa rodear ou cercar. A escolha preserva a imagem concreta, deixando que o contexto comunique sua função protetora.
- source_word: יְבֹונְנֵהוּ
  choice: cuidou dele
  rationale: O verbo pode exprimir compreensão, atenção cuidadosa ou concessão de entendimento. No encadeamento com “cercou” e “guardou”, “cuidou dele” comunica atenção discernente sem eliminar as demais possibilidades, registradas em nota.
- source_word: יִצְּרֶנְהוּ
  choice: guardou-o
  rationale: נצר significa guardar, proteger ou preservar. “Guardou-o” corresponde diretamente ao sentido protetor e prepara a comparação com o olho.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: como a pupila do seu olho
  rationale: אִישׁוֹן designa a pupila, possivelmente com a imagem da pequena figura refletida nela. A tradução é transparente para leitores atuais e mantém o singular do hebraico.
theological_decisions:
- issue: Referente dos pronomes masculinos singulares
  choice: Manter o singular e entender Israel/Jacó como uma pessoa coletiva.
  alternative: Empregar o plural, referindo-se explicitamente aos israelitas, ou tomar Jacó apenas como indivíduo.
  rationale: O contexto do cântico apresenta o povo coletivamente sob a figura singular de Jacó. Manter “o/dele” conserva tanto a gramática quanto a personificação poética do texto.
- issue: Sentido de יְבֹונְנֵהוּ
  choice: 'Traduzir pelo sentido relacional de atenção e cuidado: “cuidou dele”.'
  alternative: “Deu-lhe entendimento”, “instruiu-o” ou “prestou atenção nele”.
  rationale: O verbo admite mais de uma nuance. O contexto imediato favorece o cuidado atento, ao lado de cercar e guardar, mas a nota preserva a possibilidade de um sentido ligado ao entendimento.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção poética mantém a sucessão concisa das ações divinas e o singular coletivo do hebraico. “Ermo desolado, cheio de uivos” explicita de modo natural a densa sequência nominal hebraica, sem reduzir sua atmosfera ameaçadora.
