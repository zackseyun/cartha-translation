  text: הֲ/לֹא ה֖וּא כָּמֻ֣ס עִמָּ/דִ֑י חָתֻ֖ם בְּ/אוֹצְרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: pt
  text: Acaso isso não está guardado comigo[a], selado nos meus depósitos[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escondido comigo” ou “reservado comigo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nos meus tesouros” ou “nas minhas tesourarias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Acaso ... não
  rationale: Preserva a forma de pergunta retórica que espera resposta afirmativa e soa natural em português atual.
- source_word: הוּא
  choice: isso
  rationale: O pronome hebraico é masculino singular, mas aqui retoma de modo resumido uma realidade mencionada anteriormente. O demonstrativo neutro evita transformá-lo indevidamente em pessoa e mantém impreciso o antecedente.
- source_word: כָּמֻס
  choice: guardado
  rationale: O particípio passivo pode indicar algo escondido, armazenado ou mantido em reserva. “Guardado” conserva essa amplitude e se harmoniza com a imagem dos depósitos.
- source_word: עִמָּדִי
  choice: comigo
  rationale: É a correspondência direta da preposição com sufixo de primeira pessoa e comunica posse ou custódia sem explicitação excessiva.
- source_word: חָתֻם
  choice: selado
  rationale: Reproduz diretamente o particípio passivo e a ideia de algo fechado e mantido em segurança.
- source_word: בְּאוֹצְרֹתָי
  choice: nos meus depósitos
  rationale: O substantivo designa lugares em que bens são armazenados. “Depósitos” preserva a imagem espacial sem restringi-la a dinheiro ou riqueza.
theological_decisions:
- issue: Referente daquilo que está guardado e selado
  choice: “isso”, como retomada impessoal do assunto anterior, sem definir exatamente se se trata da culpa registrada, do juízo reservado ou do conjunto do que foi dito
  alternative: “ele”, caso o pronome seja entendido como referência pessoal a um inimigo ou povo personificado
  rationale: Embora הוּא seja masculino singular, o contexto permite uma retomada resumitiva e impessoal. “Isso” conserva a incerteza quanto ao antecedente e evita impor uma identificação teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Acaso” sinaliza a pergunta retórica; “depósitos” mantém a metáfora de armazenamento sem sugerir apenas riqueza monetária.
