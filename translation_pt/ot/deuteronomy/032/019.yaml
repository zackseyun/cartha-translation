  naturalness: A redação é compreensível e digna, mas “Yahweh viu e os rejeitou” é mais concisa e natural do que “viu isso e os rejeitou”. “Por causa da provocação de seus filhos e de suas filhas” mantém boa legibilidade em português internacional.
  terminology: “Yahweh”, “rejeitou”, “filhos” e “filhas” são adequados. A nota lexical preserva alternativas legítimas para נאץ.
