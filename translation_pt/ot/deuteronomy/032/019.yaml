  yaml_path: translation/ot/deuteronomy/032/019.yaml
  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: pt
  text: E Yahweh viu e os rejeitou por causa da provocação de seus filhos e de suas filhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os desprezou” ou “os tratou com desprezo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino da aliança por transliteração reconhecível, em vez de substituí-lo por um título.
- source_word: וַיַּרְא
  choice: viu isso
  rationale: ראה significa normalmente “ver”. O pronome “isso” retoma a conduta anterior e permite uma construção natural em português sem alterar o referente contextual.
- source_word: וַיִּנְאָץ
  choice: os rejeitou
  rationale: נאץ exprime rejeição marcada por desprezo. “Os rejeitou” comunica claramente a ruptura relacional; o objeto, implícito no hebraico, é recuperado do contexto.
- source_word: מִכַּעַס
  choice: provocado à ira por
  rationale: כעס denota provocação ou irritação que desperta ira, e מִן tem aqui valor causal. A formulação conserva a força da reação divina em português corrente.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: seus filhos e suas filhas
  rationale: Mantém a menção explícita aos descendentes de ambos os sexos e reproduz mais de perto o paralelismo hebraico.
theological_decisions:
- issue: Objeto implícito de וַיִּנְאָץ
  choice: Suprir “os”, referindo-se ao povo de Israel.
  alternative: 'Deixar o objeto sem expressão: “viu e rejeitou”.'
  rationale: O contexto identifica o povo como referente, e o português natural favorece a explicitação do objeto sem acrescentar uma afirmação teológica nova.
- issue: Força da desaprovação divina
  choice: “os rejeitou, provocado à ira”
  alternative: “os desprezou” ou “os abominou”
  rationale: A redação preserva o juízo divino real diante da infidelidade da aliança, sem suavizar a passagem nem intensificá-la além da evidência lexical.
- issue: Referente de “seus filhos e suas filhas”
  choice: Conservar a linguagem relacional de filiação aplicada ao povo.
  alternative: Generalizar como “seu povo” ou “seus filhos”.
  rationale: O hebraico nomeia explicitamente filhos e filhas de Yahweh; a tradução mantém essa imagem teológica sem resolver além do texto a natureza dessa filiação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem foi levemente ajustada para fluência, mantendo a sequência narrativa, a causalidade e a linguagem explícita de filhos e filhas.
