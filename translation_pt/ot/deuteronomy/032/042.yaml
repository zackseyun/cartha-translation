base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: pt
  text: 'Embriagarei de sangue as minhas flechas,

    e a minha espada devorará carne:

    do sangue dos mortos e dos cativos,

    das cabeças dos líderes do inimigo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “das cabeças cabeludas do inimigo”; ou “da cabeça dos guerreiros do inimigo”. A expressão hebraica é difícil, especialmente por causa da palavra rara פַּרְעוֹת.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: Embriagarei
  rationale: O hifil de שׁכר significa literalmente “fazer ficar bêbado/embriagar”. A escolha conserva a metáfora forte do cântico, sem reduzi-la a “encharcarei”.
- source_word: חִצַּי
  choice: as minhas flechas
  rationale: Equivalente corrente e natural para o plural de חֵץ com sufixo de primeira pessoa.
- source_word: מִדָּם
  choice: de sangue
  rationale: Depois de “embriagar”, a preposição מן indica aquilo de que as flechas ficam saturadas; “de sangue” é idiomático em português e permanece próximo da forma hebraica.
- source_word: וְחַרְבִּי
  choice: e a minha espada
  rationale: Preserva diretamente a construção possessiva e o paralelismo marcial.
- source_word: תֹּאכַל בָּשָׂר
  choice: devorará carne
  rationale: “Devorará” mantém a personificação violenta da espada e comunica melhor a força poética de “comerá carne” em português atual.
- source_word: מִדַּם חָלָל
  choice: do sangue dos que foram mortos
  rationale: חָלָל designa normalmente pessoas mortas violentamente, sobretudo em batalha. A formulação evita a possível leitura de “os mortos” como morte natural.
- source_word: וְשִׁבְיָה
  choice: e dos cativos
  rationale: No contexto bélico, o substantivo é entendido como referência coletiva a pessoas levadas cativas, em paralelo com os mortos.
- source_word: מֵרֹאשׁ
  choice: desde a cabeça
  rationale: Conserva a imagem concreta e o valor de origem ou extensão de מן, sem antecipar uma interpretação abstrata como “desde o chefe”.
- source_word: פַּרְעוֹת
  choice: líderes
  rationale: O termo raro e discutido pode aludir a cabelos soltos, guerreiros ou chefes. “Líderes” produz um texto principal compreensível, enquanto a alternativa mais literal é registrada em nota.
- source_word: אוֹיֵב
  choice: do inimigo
  rationale: O singular tem valor coletivo e genérico; “do inimigo” preserva essa forma sem exigir um plural interpretativo.
theological_decisions:
- issue: Sentido da expressão difícil מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: desde a cabeça dos líderes do inimigo
  alternative: desde a cabeça cabeluda do inimigo; ou desde a cabeça dos guerreiros do inimigo
  rationale: A dificuldade é lexical e sintática, não propriamente doutrinária. O texto principal privilegia inteligibilidade sem ocultar a incerteza; a nota preserva as leituras ligadas ao sentido possível de cabelos soltos ou compridos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com ritmo poético em quatro linhas. Mantêm-se as metáforas concretas das flechas embriagadas e da espada que devora, bem como a ambiguidade da expressão final por meio de nota.
