  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: pt
  text: os quais comiam a gordura dos sacrifícios deles e bebiam o vinho de suas libações. Que eles se levantem e ajudem vocês; que sejam para vocês um abrigo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: a gordura dos sacrifícios deles
  rationale: Reproduz concretamente a expressão hebraica e mantém a referência irônica aos deuses que supostamente recebiam a porção sacrificial.
- source_word: יֵין נְסִיכָם
  choice: o vinho das suas ofertas derramadas
  rationale: נסך designa uma libação, isto é, vinho ritualmente derramado; a formulação comunica a prática em português corrente sem perder a imagem.
- source_word: יַעְזְרֻכֶם
  choice: ajudem vocês
  rationale: Mantém o plural do verbo, referente aos falsos deuses, e o objeto plural, dirigido ao povo.
- source_word: סִתְרָה
  choice: abrigo
  rationale: O substantivo denota esconderijo, proteção ou cobertura. “Abrigo” preserva a imagem protetora e soa natural neste desafio irônico.
theological_decisions:
- issue: Identidade do antecedente dos verbos no plural
  choice: Preservar a referência implícita aos deuses mencionados no contexto, sem inseri-los nominalmente no versículo.
  alternative: Explicitar “os deuses” no texto.
  rationale: O hebraico usa uma oração relativa e depois pronomes e verbos no plural; explicitar o referente eliminaria uma ligação contextual que o original deixa implícita.
- issue: Tom do desafio dirigido aos ídolos
  choice: 'Manter o imperativo irônico: “Que eles se levantem e ajudem vocês”.'
  alternative: Parafrasear como afirmação direta da incapacidade dos ídolos.
  rationale: O texto ridiculariza a confiança nos deuses estrangeiros mediante um desafio retórico; a tradução conserva essa tensão sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”). O paralelismo e a ironia do hebraico foram preservados. Não foram necessárias notas de rodapé.
