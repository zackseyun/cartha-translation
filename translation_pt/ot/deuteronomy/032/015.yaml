source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ן יְשֻׁרוּן֙ וַ/יִּבְעָ֔ט שָׁמַ֖נְתָּ עָבִ֣יתָ כָּשִׂ֑יתָ וַ/יִּטֹּשׁ֙ אֱל֣וֹהַ עָשָׂ֔/הוּ וַ/יְנַבֵּ֖ל צ֥וּר יְשֻׁעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: pt
  text: 'Mas Jesurum engordou e deu coices;

    você engordou, ficou corpulento e lustroso[a].

    Então ele abandonou o Deus que o fez

    e tratou com desprezo a Rocha da sua salvação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «ficou coberto de gordura» ou «ficou inchado». O termo hebraico é raro, e sua nuance exata é incerta, embora a ideia de excesso decorrente da superalimentação seja clara.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: Jesurum
  rationale: Mantém como nome ou título poético de Israel, em forma aportuguesada, sem reduzi-lo à interpretação «o Justo» nem substituí-lo diretamente por «Israel».
- source_word: וַיִּשְׁמַן
  choice: engordou
  rationale: Preserva a imagem concreta de um animal bem alimentado, cuja prosperidade resulta em rebeldia.
- source_word: וַיִּבְעָט
  choice: deu coices
  rationale: Reproduz a metáfora vívida do animal cevado que reage com coices, em vez de achatá-la para o sentido abstrato «rebelou-se».
- source_word: שָׁמַנְתָּ
  choice: você engordou
  rationale: Conserva a mudança hebraica para a interpelação direta na segunda pessoa, usando uma forma corrente e clara no português brasileiro.
- source_word: עָבִיתָ
  choice: ficou corpulento
  rationale: Intensifica a imagem física de excesso e volume de modo natural em português.
- source_word: כָּשִׂיתָ
  choice: lustroso[a]
  rationale: Evoca a aparência lisa e saudável de um animal muito bem alimentado, em consonância com o paralelismo; a raridade da forma hebraica e outras possibilidades são registradas em nota.
- source_word: וַיִּטֹּשׁ
  choice: abandonou
  rationale: Expressa com clareza moderna a deslealdade de deixar aquele que o criou.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: o Deus que o fez
  rationale: Preserva a identificação de Deus como aquele que fez Israel e mantém a estrutura relativa do hebraico.
- source_word: וַיְנַבֵּל
  choice: tratou com desprezo
  rationale: Comunica o ato de desonrar e considerar desprezível, sem limitar o verbo apenas a uma emoção interior.
- source_word: צוּר
  choice: a Rocha
  rationale: Mantém a metáfora divina recorrente no cântico; a inicial maiúscula sinaliza seu emprego como designação de Deus.
- source_word: יְשׁוּעָתוֹ
  choice: da sua salvação
  rationale: Preserva tanto o sentido de livramento divino quanto o peso teológico do termo.
theological_decisions:
- issue: Alternância entre narração na terceira pessoa e interpelação na segunda pessoa
  choice: Preservar «Jesurum engordou... você engordou... ele abandonou».
  alternative: Uniformizar todo o versículo na terceira pessoa.
  rationale: A alternância está no hebraico e intensifica poeticamente a acusação; regularizá-la eliminaria uma tensão retórica genuína.
- issue: Metáfora divina צוּר
  choice: «a Rocha», com inicial maiúscula
  alternative: «a rocha», com inicial minúscula, ou uma explicação como «seu protetor».
  rationale: No Cântico de Moisés, «Rocha» é uma designação metafórica recorrente do Deus de Israel; a tradução mantém a imagem sem substituí-la por interpretação.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil. «Você» preserva de forma transparente a interpelação direta. O paralelismo e as mudanças de pessoa do poema hebraico foram mantidos, assim como as imagens concretas dos coices e da Rocha.
