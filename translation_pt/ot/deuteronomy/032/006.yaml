  source_fidelity: A tradução preserva a pergunta retórica de censura, o vocativo coletivo e a sequência dos três predicados divinos. “Retribuem” corresponde bem a תִּגְמְלוּ; “insensato e sem sabedoria” comunica adequadamente a reprovação moral de נָבָל e a negação de חָכָם. “Aquele que os adquiriu” é uma opção defensável para קָנֶךָ e mantém a distinção em relação a “fez” e “estabeleceu”; a nota registra de modo apropriado as alternativas relevantes.
