  text: הֲ לַ/יְהוָה֙ תִּגְמְלוּ זֹ֔את עַ֥ם נָבָ֖ל וְ/לֹ֣א חָכָ֑ם הֲ/לוֹא הוּא֙ אָבִ֣י/ךָ קָּנֶ֔/ךָ ה֥וּא עָֽשְׂ/ךָ֖ וַֽ/יְכֹנְנֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: pt
  text: É assim que vocês retribuem a Yahweh, povo insensato e sem sabedoria? Não é ele o seu Pai, aquele que os adquiriu[a]? Ele os fez e os estabeleceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que os criou” ou “aquele que os comprou”. O verbo hebraico pode significar adquirir, possuir, comprar ou, em certos contextos, criar.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: retribuem
  rationale: Expressa dar em retorno conforme o tratamento recebido e preserva o tom de censura da pergunta retórica.
- source_word: זֹאת
  choice: É assim que
  rationale: Comunica naturalmente em português o valor demonstrativo e modal, apontando para a conduta de Israel descrita no contexto.
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: povo insensato e sem sabedoria
  rationale: “Insensato” preserva a dimensão moral de נָבָל, enquanto “sem sabedoria” traduz de modo direto a negação hebraica וְלֹא חָכָם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: הֲלוֹא
  choice: Não é ele
  rationale: Mantém a forma de pergunta retórica que espera resposta afirmativa.
- source_word: אָבִיךָ
  choice: seu Pai
  rationale: Preserva a designação relacional e pactual de Deus como Pai de Israel; a inicial maiúscula esclarece o referente divino.
- source_word: קָּנֶךָ
  choice: aquele que os adquiriu
  rationale: קנה pode significar adquirir, possuir, comprar ou, em certos contextos, criar. “Adquiriu” conserva a distinção lexical em relação a “fez” e “estabeleceu” nas orações seguintes.
- source_word: עָשְׂךָ
  choice: os fez
  rationale: Tradução direta e natural da ação divina de fazer ou constituir Israel.
- source_word: וַיְכֹנְנֶךָ
  choice: os estabeleceu
  rationale: Comunica a ideia de firmar, constituir ou dar estabilidade, sem confundi-la com o verbo anterior.
theological_decisions:
- issue: Sentido de קנה na relação entre Deus e Israel
  choice: aquele que os adquiriu
  alternative: aquele que os criou; aquele que os comprou
  rationale: O verbo admite mais de um sentido genuíno. “Adquiriu” preserva a distinção entre os três verbos do texto, enquanto a nota registra as alternativas relevantes sem resolver indevidamente a ambiguidade.
- issue: Linguagem da paternidade divina
  choice: seu Pai
  alternative: seu pai
  rationale: O texto chama explicitamente Yahweh de Pai de Israel. A maiúscula é uma convenção gráfica que identifica o referente, não uma ampliação doutrinária.
- issue: Número gramatical na referência a Israel
  choice: vocês / os
  alternative: tu / te
  rationale: O hebraico se dirige coletivamente a Israel mediante formas masculinas singulares. O plural em português torna clara essa referência coletiva e soa natural, embora não reproduza formalmente o singular hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega “vocês” para explicitar que o singular hebraico se dirige coletivamente ao povo. Evita o vocativo literário “ó” e mantém a força retórica por meio da pontuação e da ordem natural da frase.
