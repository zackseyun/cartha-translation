  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: pt
  text: Como a águia[a] que agita o seu ninho e paira sobre os seus filhotes[b], ele estende as suas asas, toma-o e o carrega sobre as suas penas de voo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abutre”, pois o hebraico נֶשֶׁר pode designar uma grande ave de rapina semelhante à águia ou um abutre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “esvoaça sobre os seus filhotes” ou “choca os seus filhotes”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, as grandes penas das asas; de modo mais geral, “asas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: Como a águia
  rationale: נֶשֶׁר designa uma grande ave de rapina; “águia” mantém a imagem tradicional de força e cuidado, enquanto a possibilidade zoológica de “abutre” é preservada em nota.
- source_word: יָעִיר קִנּוֹ
  choice: que agita o seu ninho
  rationale: O hifil de עור expressa despertar ou incitar. “Agita” é natural em português e sugere a ave estimulando os filhotes no ninho.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: e paira sobre os seus filhotes
  rationale: רחף indica movimento de pairar ou esvoaçar; גּוֹזָלִים refere-se às crias da ave, vertido naturalmente por “filhotes”.
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: ele abre as asas
  rationale: פרשׂ significa estender ou abrir. O pronome masculino permite que a imagem poética continue evocando o SENHOR, sem explicitá-lo no verso.
- source_word: יִקָּחֵהוּ
  choice: toma um deles
  rationale: לקח significa “tomar”. O sufixo masculino singular individualiza um filhote; “um deles” torna essa referência clara em português sem trocar o singular pelo coletivo.
- source_word: יִשָּׂאֵהוּ
  choice: o carrega
  rationale: נשא, neste contexto, expressa levar ou sustentar fisicamente; “carrega” é corrente e preserva o objeto singular.
- source_word: עַל אֶבְרָתוֹ
  choice: sobre as suas penas de voo
  rationale: אֶבְרָה refere-se à plumagem ou às grandes penas da asa. “Penas de voo” preserva a distinção em relação a כָּנָף, “asas”, e é mais compreensível que o tecnicismo “rêmiges”.
theological_decisions:
- issue: Transição pronominal dentro da comparação
  choice: Manter “ele/suas” na segunda metade
  alternative: Conservar a referência impessoal à ave em toda a comparação
  rationale: As formas hebraicas são masculinas singulares, e o contexto aplica a figura ao cuidado do SENHOR por Israel. “Ele” conserva essa possível transição poética sem inserir explicitamente “o SENHOR” no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o paralelismo poético e distingue “asas” de “penas de voo”, evitando tanto um termo técnico raro quanto a eliminação da nuance lexical.
