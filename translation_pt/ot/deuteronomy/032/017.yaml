base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: pt
  text: Sacrificaram a demônios, não a Deus[a], a deuses que não conheciam, deuses novos que tinham surgido havia pouco[b], diante dos quais os pais de vocês não tinham tremido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não a um deus”. O hebraico pode negar que esses seres fossem verdadeiramente divinos, embora o contexto também os contraponha ao Deus de Israel.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “vieram de perto”, expressão que aqui provavelmente significa que haviam aparecido ou sido introduzidos recentemente.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os quais os pais de vocês não tinham temido”. O verbo hebraico raro pode expressar tremor, pavor ou temor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: Sacrificaram
  rationale: O qal de זבח denota sacrificar ou oferecer em sacrifício. A forma concisa preserva o sentido cultual e se ajusta ao caráter poético retrospectivo do cântico.
- source_word: לַשֵּׁדִים
  choice: a demônios
  rationale: שֵׁדִים designa seres demoníacos. “Demônios” transmite o sentido ao leitor moderno sem recorrer a uma transliteração obscura.
- source_word: לֹא אֱלֹהַ
  choice: não a Deus
  rationale: No contexto, a expressão contrapõe os destinatários falsos do sacrifício ao Deus de Israel. A nota preserva a possibilidade gramatical de entender “não a um deus”.
- source_word: אֱלֹהִים לֹא יְדָעוּם
  choice: a deuses que não conheciam
  rationale: Mantém o substantivo plural e o sentido direto de ידע, sem transformar “conhecer” em “reconhecer” ou “adorar”.
- source_word: חֲדָשִׁים
  choice: deuses novos
  rationale: O adjetivo substantivado retoma “deuses”; a explicitação em português evita uma construção truncada e conserva a ênfase na novidade desses deuses.
- source_word: מִקָּרֹב בָּאוּ
  choice: que tinham surgido havia pouco
  rationale: A expressão indica aparecimento ou introdução recente, não necessariamente proximidade espacial. Esta formulação comunica naturalmente o valor temporal.
- source_word: לֹא שְׂעָרוּם
  choice: diante dos quais ... não tinham tremido
  rationale: O verbo raro exprime tremor, pavor ou temor reverente. “Tremido diante” preserva sua imagem forte, enquanto a nota registra a alternativa mais geral.
- source_word: אֲבֹתֵיכֶם
  choice: seus pais
  rationale: O hebraico emprega o plural masculino “pais” com sufixo de segunda pessoa do plural, referindo-se aos antepassados paternos de Israel.
theological_decisions:
- issue: Relação entre “demônios”, “Deus” e “deuses”
  choice: 'Manter os três termos em sequência: “a demônios, não a Deus, a deuses...”'
  alternative: Suavizar a repetição, tratar “deuses” apenas como explicação de “demônios” ou traduzir “não-Deus”
  rationale: 'O hebraico acumula deliberadamente שֵׁדִים, אֱלֹהַ e אֱלֹהִים. Preservar a sequência mantém a tensão polêmica: são cultuados como deuses, mas não são o Deus de Israel, sem impor uma explicação sistemática posterior.'
- issue: Sentido de אֱלֹהַ após a negação
  choice: “não a Deus”, com inicial maiúscula
  alternative: “não a um deus”
  rationale: O contexto favorece o contraste com o Deus de Israel. Como a forma hebraica também admite leitura indefinida, essa possibilidade é mantida em nota.
- issue: Natureza do temor dos pais
  choice: “não tinham tremido”
  alternative: “não tinham temido”
  rationale: A escolha conserva a força imagética do verbo raro sem decidir se o sentimento seria mero pavor ou temor religioso; a alternativa mais ampla aparece em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética clara. A repetição de “deuses” é intencional para tornar explícita a retomada do adjetivo hebraico substantivado e preservar a estrutura enfática do verso. “Seus pais” mantém a referência masculina do texto-fonte.
