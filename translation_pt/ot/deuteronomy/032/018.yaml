  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: pt
  text: Tu negligenciaste a Rocha que te gerou[a][b] e te esqueceste do Deus que te deu à luz[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que te fez nascer».'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido como «negligenciaste» é difícil; também pode ser entendido como «esqueceste» ou «não deste atenção a».
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «que te trouxe ao mundo»; o hebraico emprega uma imagem de parto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: a Rocha
  rationale: Preserva a imagem literal e o uso de «Rocha» como título divino em Deuteronômio.
- source_word: יְלָדְךָ
  choice: que o gerou
  rationale: O qal de ילד pode expressar gerar ou procriar. «Gerou» é natural e digno em português e mantém aqui a nuance paterna.
- source_word: תֶּשִׁי
  choice: você negligenciou
  rationale: O verbo é difícil, mas, em paralelo com «se esqueceu», indica desatenção culpável ou abandono. «Negligenciou» preserva a distinção poética entre os dois membros.
- source_word: וַתִּשְׁכַּח
  choice: e se esqueceu
  rationale: Traduz diretamente שכח e dá continuidade natural à acusação na segunda pessoa do singular.
- source_word: אֵל
  choice: do Deus
  rationale: Neste contexto, אֵל designa o Deus de Israel e forma um paralelo definido com «a Rocha».
- source_word: מְחֹלְלֶךָ
  choice: que lhe deu à luz
  rationale: A forma verbal de חול evoca trabalho de parto e nascimento. A expressão conserva a marcante imagem materna, justaposta a «gerou».
theological_decisions:
- issue: Imagens paterna e materna aplicadas a Deus
  choice: Manter «que o gerou» e «que lhe deu à luz» no texto principal.
  alternative: Empregar linguagem genérica, como «que o criou» ou «que o formou».
  rationale: O hebraico justapõe deliberadamente a ideia de gerar à imagem do parto. A tradução conserva essa tensão sem reduzir as duas metáforas a uma afirmação genérica sobre criação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A colocação pronominal em «o gerou» e «lhe deu à luz» mantém a referência coletiva a Israel no masculino singular. A repetição de imagens parentais foi preservada, assim como o paralelismo poético.
