base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: pt
  text: Lembre-se dos dias antigos; reflita sobre os anos de geração em geração. Pergunte a seu pai, e ele lhe contará; a seus anciãos, e eles lhe dirão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְכֹר
  choice: Lembre-se
  rationale: O imperativo qal de זכר ordena recordar ou trazer à memória; “lembre-se” é direto, natural e preserva a forma reflexiva idiomática do português.
- source_word: יְמוֹת עוֹלָם
  choice: os dias antigos
  rationale: A expressão construta designa os dias da antiguidade ou de um passado remoto. “Dias antigos” mantém o sentido histórico em linguagem clara e digna.
- source_word: בִּינוּ
  choice: reflita sobre
  rationale: O imperativo de בין pode significar entender, discernir ou considerar. No paralelismo com “lembre-se”, pede atenção reflexiva à história; “reflita sobre” expressa isso naturalmente sem pressupor que a compreensão já foi alcançada.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: os anos de geração em geração
  rationale: A construção literalmente repetida, “geração e geração”, tem força distributiva e aponta para gerações sucessivas. A formulação escolhida conserva a imagem dos “anos” e o paralelismo hebraico.
- source_word: שְׁאַל
  choice: Pergunte
  rationale: Imperativo simples de שאל; “pergunte” é o equivalente corrente e direto no contexto.
- source_word: אָבִיךָ
  choice: a seu pai
  rationale: O substantivo singular com sufixo de segunda pessoa significa primariamente “seu pai”. Não se amplia no texto principal para “antepassado”, pois isso resolveria uma possível extensão contextual além do dado lexical imediato.
- source_word: וְיַגֵּדְךָ
  choice: e ele lhe contará
  rationale: O hifil de נגד comunica fazer saber, declarar ou contar. “Lhe contará” é natural no contexto da transmissão da memória histórica e distingue este verbo do אמר seguinte.
- source_word: זְקֵנֶיךָ
  choice: a seus anciãos
  rationale: O termo se refere aos homens mais velhos reconhecidos como depositários da memória e autoridade comunitária. “Anciãos” preserva esse papel social melhor que uma simples referência à idade.
- source_word: וְיֹאמְרוּ לָךְ
  choice: e eles lhe dirão
  rationale: אמר é o verbo comum para “dizer”. “Lhe dirão” conserva a variação lexical em relação a נגד e produz português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Mantém o paralelismo poético e a sequência de imperativos, com tom solene sem arcaísmo. Os pronomes no singular refletem as formas masculinas singulares hebraicas dirigidas a Israel de modo representativo.
