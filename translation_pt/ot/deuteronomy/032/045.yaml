  text: Quando Moisés terminou de dizer todas estas palavras a todo o Israel,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: terminou
  rationale: O verbo כלה no wayyiqtol indica a conclusão da ação; “terminou” é natural em português e conserva esse sentido.
- source_word: לְדַבֵּר
  choice: de dizer
  rationale: Com כלה, o infinitivo forma a expressão idiomática “terminou de dizer”. “Dizer” acomoda naturalmente o objeto direto “palavras” e evita a construção menos fluida “falar palavras”.
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: דברים significa literalmente “palavras” neste contexto e remete ao discurso ou cântico precedente, preservando a textura formal do hebraico.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: a todo o Israel
  rationale: Mantém Israel como designação coletiva e pactual, sem expandi-la interpretativamente para “israelitas”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
