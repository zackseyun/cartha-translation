base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: pt
  text: porque vocês foram infiéis a mim entre os filhos de Israel[a], nas águas de Meribá de Cades[b], no deserto de Zim, porque não me trataram como santo[c] entre os filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os israelitas”.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “águas da Contenda de Cades”; “Meribá” significa “contenda”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não me santificaram” ou “não honraram a minha santidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: agiram com infidelidade contra mim
  rationale: מעל descreve uma quebra de fidelidade, frequentemente com dimensão pactual; com ב, Deus é a parte ofendida. A formulação mantém tanto a ação quanto a gravidade relacional da ofensa.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: no meio dos filhos de Israel
  rationale: Reproduz o sentido de בְּתוֹךְ e preserva a forma concreta e repetida do hebraico, sem perder inteligibilidade em português.
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: junto às águas de Meribá de Cades
  rationale: Trata a expressão como designação geográfica ligada ao episódio conhecido, usando formas portuguesas tradicionais para os topônimos.
- source_word: מִדְבַּר צִן
  choice: no deserto de Zim
  rationale: “Deserto” é a forma corrente e clara para מִדְבָּר neste contexto geográfico; “Zim” segue a transliteração portuguesa tradicional.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: não me trataram como santo
  rationale: 'Expressa o valor causativo/declarativo do piel de קדשׁ: Moisés e Arão deixaram de reconhecer e manifestar publicamente a santidade de Deus. A formulação evita sugerir que Deus precisasse tornar-se santo.'
theological_decisions:
- issue: Sentido público de קִדַּשְׁתֶּם אֹתִי
  choice: não me trataram como santo
  alternative: não me santificaram; não sustentaram a minha santidade
  rationale: A escolha conserva Deus como objeto direto e comunica a falha em honrá-lo como santo diante de Israel, sem insinuar deficiência na santidade intrínseca de Deus.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A expressão hebraica é literalmente “filhos de Israel”. Mantê-la preserva a textura e a repetição do original, enquanto a nota oferece a equivalência etnonímica mais fluente.
- issue: Repetição causal de עַל אֲשֶׁר
  choice: porque ... porque
  alternative: por terem ... e por não terem
  rationale: A repetição foi preservada para refletir a estrutura enfática do hebraico, sem decidir se as duas formulações descrevem aspectos distintos ou explicações sobrepostas da mesma transgressão.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. O plural “vocês” explicita que a fala se dirige a Moisés e Arão. Mantiveram-se a repetição de “no meio dos filhos de Israel” e a dupla construção causal do hebraico.
