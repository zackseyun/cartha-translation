  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: pt
  text: Como poderia um só perseguir mil, e dois pôr dez mil em fuga, se a Rocha deles não os tivesse vendido e Yahweh não os tivesse entregue[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os tivesse dado em poder de outros».'
    reason: Alternativa contextual para הִסְגִּירָם, preservando a ideia de entrega ao poder de outra parte sem explicitar um destinatário que o hebraico não nomeia nesta oração.
lexical_decisions:
- source_word: אֵיכָה
  choice: Como poderia
  rationale: Introduz uma pergunta retórica de espanto; a forma condicional comunica naturalmente em português a aparente impossibilidade descrita.
- source_word: יִרְדֹּף
  choice: perseguir
  rationale: Mantém o sentido militar comum de רדף e a relação direta com o número que funciona como objeto.
- source_word: אֶחָד אֶלֶף
  choice: um só perseguir mil
  rationale: Preserva a desproporção numérica do hebraico; «um só» torna explícita em português a ênfase no combatente individual.
- source_word: וּשְׁנַיִם יָנִיסוּ רְבָבָה
  choice: e dois pôr dez mil em fuga
  rationale: «Pôr em fuga» expressa o valor causativo de יָנִיסוּ, e «dez mil» traduz o numeral רְבָבָה de modo claro.
- source_word: אִם לֹא כִּי
  choice: se ... não
  rationale: Na pergunta retórica, a construção portuguesa apresenta a única explicação possível e equivale contextualmente a «a menos que».
- source_word: צוּרָם
  choice: a Rocha deles
  rationale: Conserva a metáfora divina recorrente no cântico; a inicial maiúscula sinaliza seu uso como designação do Deus de Israel.
- source_word: מְכָרָם
  choice: os tivesse vendido
  rationale: Traduz diretamente a metáfora de מכר, que neste contexto de juízo indica entregar o povo ao poder dos inimigos.
- source_word: וַיהוָה
  choice: e Yahweh
  rationale: Reproduz o nome divino pessoal יהוה, distinguindo-o de um título como «Senhor».
- source_word: הִסְגִּירָם
  choice: não os tivesse entregado
  rationale: O hifil de סגר significa aqui entregar alguém ao poder de outro. A formulação é natural e mantém o paralelismo com «vendido».
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama; «Yahweh» preserva o nome pactual em vez de substituí-lo por um título.
- issue: Uso de צוּר como metáfora ou título divino
  choice: Rocha, com inicial maiúscula
  alternative: rocha, com inicial minúscula
  rationale: No Cântico de Moisés, «Rocha» designa repetidamente o Deus de Israel. A maiúscula esclarece a referência titular sem eliminar a metáfora.
- issue: Agência divina na derrota de Israel
  choice: Deus os vendeu e entregou
  alternative: A derrota ocorreu apenas por superioridade militar inimiga
  rationale: A pergunta atribui explicitamente a derrota desproporcional ao juízo de Deus; a tradução conserva essa afirmação sem suavizá-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A estrutura paralela e a forte desproporção numérica do hebraico foram preservadas. O marcador da nota foi colocado junto ao termo ao qual a alternativa lexical realmente se refere.
