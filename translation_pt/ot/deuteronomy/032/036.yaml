base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: pt
  text: Pois Yahweh fará justiça ao seu povo[a] e terá compaixão dos seus servos[b], quando vir que a força deles se acabou[c] e que não restou ninguém, nem escravo nem livre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “julgará o seu povo”. Aqui, “fará justiça ao” indica uma ação judicial em favor do povo.
    reason: lexical_alternative
  - marker: b
    text: Ou “voltará atrás a respeito dos seus servos”. O verbo hebraico pode expressar tanto mudança de decisão quanto compaixão.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a mão se foi”; expressão que indica o esgotamento da força ou do poder.
    reason: lexical_alternative
  - marker: d
    text: Hebraico “retido e abandonado”, um par de sentido incerto. Pode significar “escravo e livre” ou, de modo abrangente, “ninguém, sem exceção”.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: fará justiça ao
  rationale: O verbo דין pode significar julgar, governar ou defender judicialmente. No contexto, a ação é favorável ao povo; “fará justiça ao” conserva o caráter judicial sem reduzir o sentido a mera absolvição.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: Preserva de modo natural a designação coletiva e pactual.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: e terá compaixão dos seus servos
  rationale: O verbo נחם nesta forma pode indicar compaixão ou mudança de disposição; o contexto de extrema fraqueza favorece “ter compaixão”, mantendo em nota a alternativa “voltar atrás”.
- source_word: כִּי יִרְאֶה
  choice: quando vir
  rationale: Expressa naturalmente a sobreposição temporal e causal de כִּי neste contexto.
- source_word: אָזְלַת יָד
  choice: a força deles se acabou
  rationale: Traduz o sentido do idiomatismo literalmente relacionado à mão, isto é, o esgotamento do poder ou da capacidade.
- source_word: וְאֶפֶס
  choice: e que não restou ninguém
  rationale: Comunica a cessação ou inexistência introduzida por אֶפֶס e prepara o par final.
- source_word: עָצוּר וְעָזוּב
  choice: nem preso nem solto
  rationale: Mantém as imagens contrastantes do hebraico e sua provável força abrangente, sem fixar como certa a interpretação específica “escravo ou livre”.
theological_decisions:
- issue: Sentido da ação divina em יָדִין ... וְעַל עֲבָדָיו יִתְנֶחָם
  choice: Yahweh fará justiça em favor de seu povo e terá compaixão de seus servos.
  alternative: Yahweh julgará seu povo e voltará atrás a respeito de seus servos.
  rationale: O paralelismo e a referência à completa impotência do povo favorecem uma intervenção restauradora, mas as notas preservam a amplitude judicial de דין e a possibilidade de נחם significar voltar atrás.
- issue: Interpretação de עָצוּר וְעָזוּב
  choice: nem preso nem solto
  alternative: nem escravo nem livre; ninguém, sem exceção
  rationale: O par hebraico é difícil. A formulação principal preserva sua imagem e sua ambiguidade; a nota apresenta tanto a leitura social tradicional quanto a provável força de totalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas acompanha as expressões correspondentes no texto. O nome divino é transliterado como “Yahweh”; os idiomatismos são traduzidos com clareza, enquanto ambiguidades genuínas permanecem registradas em notas.
