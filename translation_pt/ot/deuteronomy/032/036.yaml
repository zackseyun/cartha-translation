revisions:
- from: Pois Yahweh fará justiça ao seu povo[a] e terá compaixão dos seus servos[b], quando vir que a força deles se acabou[c] e que não restou ninguém, nem preso nem solto[d].
  to: Pois Yahweh fará justiça ao seu povo[a] e terá compaixão dos seus servos[b], quando vir que a força deles se acabou[c] e que não restou ninguém, nem escravo nem livre[d].
  rationale: A revisão corrige a representação do par final difícil e a explicação literal do idiomatismo da “mão”. “Nem escravo nem livre” segue a interpretação idiomática tradicional e o sentido contextual de que ninguém resta, enquanto a nota d preserva explicitamente a incerteza lexical e a alternativa mais literal. Não se altera o sentido teológico nem a ambiguidade relevante de דין e נחם, que continuam adequadamente documentadas nas notas.
