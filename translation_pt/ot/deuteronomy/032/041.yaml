  terminology: “Vingança”, “adversários” e “os que me odeiam” representam adequadamente os termos hebraicos e conservam o tom solene. “Retribuirei vingança” comunica a expressão hebraica de fazer a vingança retornar sobre os adversários; “darei a paga” é substituído por “retribuirei” para registro mais estável e paralelismo verbal.
