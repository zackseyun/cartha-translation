  yaml_path: translation/ot/deuteronomy/032/041.yaml
  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: pt
  text: Se eu afiar o relâmpago da minha espada e a minha mão tomar posse do juízo, retribuirei vingança aos meus adversários e retribuirei aos que me odeiam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Quando
  rationale: Embora normalmente condicional (“se”), aqui introduz, no contexto poético, a ação que antecede a resposta divina; “quando” expressa naturalmente essa relação sem alterar a sequência do hebraico.
- source_word: שַׁנּוֹתִי בְּרַק חַרְבִּי
  choice: eu afiar o relâmpago da minha espada
  rationale: Preserva a imagem poética compacta e incomum do hebraico, em que o brilho ou lampejo da espada é apresentado como “relâmpago”, sem normalizá-la para uma simples “espada reluzente”.
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: e a minha mão se apoderar do juízo
  rationale: Mantém a personificação e a construção concreta do original. “Juízo” conserva a amplitude de מִשְׁפָּט, que pode envolver decisão judicial e execução da justiça.
- source_word: אָשִׁיב נָקָם לְצָרָי
  choice: retribuirei com vingança aos meus adversários
  rationale: Comunica a ideia de fazer a vingança recair em resposta sobre os adversários, preservando נָקָם como vingança retributiva.
- source_word: וְלִמְשַׂנְאַי אֲשַׁלֵּם
  choice: e darei a paga aos que me odeiam
  rationale: Reproduz a linguagem de retribuição completa de שׁלם no piel e distingue esta cláusula da anterior sem enfraquecê-la.
theological_decisions:
- issue: A vingança divina
  choice: “retribuirei com vingança”
  alternative: “farei justiça”
  rationale: O texto nomeia explicitamente a vingança (נָקָם); substituí-la apenas por “justiça” apagaria a força e a tensão teológica da declaração, embora o paralelo com “juízo” situe a ação em âmbito judicial.
- issue: Valor de אִם
  choice: “Quando”
  alternative: “Se”
  rationale: A leitura temporal se ajusta à formulação poética e ao contexto da ação divina anunciada como certa. “Se” continua sendo uma possibilidade gramatical, mas em português poderia sugerir dúvida indevida sobre a ação subsequente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe poética fluente. A imagem deliberadamente forte e pouco comum “o relâmpago da minha espada” foi mantida para não dissolver a metáfora hebraica.
