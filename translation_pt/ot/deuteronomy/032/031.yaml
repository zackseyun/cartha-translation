base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/031.yaml
  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: pt
  text: Pois a rocha deles não é como a nossa Rocha[a], e os nossos inimigos são juízes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Rocha deles não é como a nossa rocha”. O substantivo hebraico פְּלִילִים significa literalmente “juízes” ou “árbitros”, conferindo à frase um sentido forense.'
    reason: Registra uma alternativa de capitalização/referência e esclarece o valor lexical incomum de פְּלִילִים.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou confirmação da afirmação anterior e se encaixa naturalmente no fluxo argumentativo do cântico.
- source_word: כְצוּרֵנוּ
  choice: como a nossa Rocha
  rationale: Preserva a metáfora hebraica e, com a inicial maiúscula, sinaliza sua referência ao Deus de Israel sem substituí-la por uma interpretação.
- source_word: צוּרָם
  choice: a rocha deles
  rationale: Mantém o mesmo substantivo e o contraste deliberado do hebraico, usando minúscula para o objeto inferior de confiança dos inimigos.
- source_word: וְאֹיְבֵינוּ
  choice: e os nossos inimigos
  rationale: Reproduz diretamente a conjunção e o sujeito, sem acrescentar uma relação comparativa ou concessiva que não está explicitada.
- source_word: פְּלִילִים
  choice: são juízes
  rationale: Traduz literalmente o substantivo plural, preservando o sentido forense e a formulação concisa e ambígua do hebraico.
theological_decisions:
- issue: Se צוּר deve ser mantido como metáfora ou substituído por um título explicativo
  choice: Manter “Rocha” como metáfora/título de Deus no texto principal
  alternative: protetor, refúgio ou força
  rationale: O hebraico emprega intencionalmente o mesmo substantivo para o Deus de Israel e para aquilo em que os povos confiam; conservar “rocha/Rocha” mantém o contraste literário e teológico.
- issue: Como entender פְּלִילִים em relação aos inimigos
  choice: Preservar a expressão nominal “são juízes”
  alternative: “julgam”, “decidem” ou “dão testemunho”
  rationale: A forma nominal hebraica permite um sentido forense sem explicitar precisamente como os inimigos exercem essa função; a tradução evita resolver essa tensão por paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura paralela e a concisão poética foram preservadas; a formulação forense deliberadamente incomum não foi suavizada por interpretação.
