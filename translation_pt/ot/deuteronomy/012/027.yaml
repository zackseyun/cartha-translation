base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: pt
  text: Você apresentará as suas ofertas queimadas — a carne e o sangue — sobre o altar de Yahweh, seu Deus. O sangue dos seus sacrifícios será derramado sobre o altar de Yahweh, seu Deus, e você comerá a carne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Apresente
  rationale: Embora o verbo signifique literalmente “fazer”, com עֹלֹתֶיךָ no contexto sacrificial ele designa a realização ou apresentação da oferta. “Apresente” é natural e mantém o sentido cultual.
- source_word: עֹלֹתֶיךָ
  choice: suas ofertas queimadas
  rationale: עֹלָה designa a oferta inteiramente queimada no altar. “Oferta queimada” é clara em português e conserva a natureza do sacrifício.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: a carne e o sangue
  rationale: “Carne” expressa naturalmente בָּשָׂר neste contexto sacrificial, mantendo a referência concreta em paralelo com “sangue”.
- source_word: עַל מִזְבַּח יְהוָה אֱלֹהֶיךָ
  choice: sobre o altar de Yahweh, seu Deus
  rationale: “Sobre” representa adequadamente עַל no contexto da colocação ritual da oferta no altar; o aposto “seu Deus” permanece claro em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְדַם זְבָחֶיךָ
  choice: O sangue dos seus sacrifícios
  rationale: זֶבַח é um termo sacrificial amplo; “sacrifícios” é exato, corrente e evita a expressão pouco natural “ofertas de abate”.
- source_word: יִשָּׁפֵךְ
  choice: será derramado
  rationale: A forma passiva descreve a ação ritual aplicada ao sangue. “Será derramado” preserva tanto a voz quanto a formulação solene.
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: e você comerá a carne
  rationale: Mantém a conjunção hebraica e a forma verbal sem explicitar como mera permissão aquilo que o texto também pode apresentar como instrução.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Força de וְהַבָּשָׂר תֹּאכֵל
  choice: e você comerá a carne
  alternative: mas você poderá comer a carne
  rationale: A construção pode funcionar como instrução legal e, no contexto, implicar permissão em contraste com o sangue. A tradução principal preserva a coordenação e a forma verbal hebraicas sem resolver essa nuance em favor da leitura exclusivamente permissiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão esclarece que “a carne e o sangue” especifica o conteúdo das ofertas queimadas. Evitou-se uma nota textual herdada da camada inglesa por ela não corresponder de modo coerente a uma variante real do hebraico e repetir a própria redação.
