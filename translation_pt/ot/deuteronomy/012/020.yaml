base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: pt
  text: 'Quando o SENHOR, seu Deus, ampliar o seu território, como lhe prometeu, e você disser: “Quero comer carne”, porque está com desejo de comer carne, poderá comer carne quanto desejar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְחִיב ... אֶת־גְּבוּלְךָ
  choice: ampliar o seu território
  rationale: Expressa naturalmente a expansão das fronteiras ou dos limites territoriais prometidos.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: 'e você disser: “Quero comer carne”'
  rationale: O coortativo אֹכְלָה, neste contexto, comunica vontade ou intenção, e não apenas uma ação futura.
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: está com desejo
  rationale: Traduz idiomaticamente o desejo atribuído à נֶפֶשׁ, sem introduzir conotação necessariamente pecaminosa.
- source_word: בְּכָל־אַוַּת נַפְשְׁךָ
  choice: quanto desejar
  rationale: Reproduz em português corrente a permissão de comer carne conforme a plena medida do desejo da pessoa.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR, sem alterar a referência ao nome divino.
- issue: Sentido de נֶפֶשׁ nas expressões de desejo
  choice: Formulação idiomática com “desejo/desejar”
  alternative: “sua alma deseja” e “todo o desejo da sua alma”
  rationale: Aqui נֶפֶשׁ designa a própria pessoa como sujeito do apetite; a tradução idiomática preserva o sentido sem impor uma leitura antropológica específica.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para o singular hebraico e sintaxe natural. A repetição hebraica de “carne” foi parcialmente preservada, enquanto as expressões com נֶפֶשׁ foram vertidas de modo idiomático.
