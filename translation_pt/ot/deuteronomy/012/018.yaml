  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: pt
  text: Mas você só o comerá diante de Yahweh, seu Deus, no lugar que Yahweh, seu Deus, escolher, juntamente com seu filho, sua filha, seu servo, sua serva e o levita que vive nas suas cidades[a]. E você se alegrará diante de Yahweh, seu Deus, em tudo o que você fizer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dentro dos seus portões”, expressão hebraica que se refere às pessoas que vivem nas cidades ou comunidades locais.
    reason: cultural_note
  - marker: b
    text: Literalmente, “em todo envio da sua mão”, isto é, em tudo o que você fizer ou empreender.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas ... só
  rationale: A locução introduz, em contraste com a proibição do versículo anterior, a única alternativa permitida. A construção portuguesa mantém tanto o contraste quanto a força restritiva.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: diante de Yahweh, seu Deus
  rationale: “Diante de” expressa naturalmente a ideia de estar perante ou na presença de Deus, e “Yahweh” preserva o nome divino representado pelo Tetragrama.
- source_word: תֹּאכְלֶנּוּ
  choice: você só o comerá
  rationale: O futuro do presente com valor diretivo preserva a instrução e o pronome “o” representa o objeto masculino singular retomado do contexto.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: no lugar que Yahweh, seu Deus, escolher
  rationale: A formulação mantém a linguagem deuteronômica do lugar escolhido por Deus; em português, o sentido de בּוֹ já está naturalmente contido em “no lugar”.
- source_word: אַתָּה וּבִנְךָ וּבִתֶּךָ וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: juntamente com seu filho, sua filha, seu servo, sua serva
  rationale: “Juntamente com” torna clara em português a participação de toda a casa, enquanto a enumeração e as distinções de gênero do hebraico são mantidas.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: e o levita que vive nas suas cidades
  rationale: “Dentro dos seus portões” é uma expressão cívica hebraica que se refere às localidades sob a jurisdição da pessoa. A tradução comunica o sentido corrente, e a forma literal é registrada em nota.
- source_word: וְשָׂמַחְתָּ
  choice: E você se alegrará
  rationale: O verbo descreve alegria ativa e celebrativa diante de Deus; “se alegrará” mantém sua força e o caráter diretivo do contexto.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: em tudo aquilo em que puser a mão
  rationale: A expressão portuguesa conserva a imagem da mão e comunica de modo natural tudo o que a pessoa faz ou empreende; a formulação mais literal é indicada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Natureza da alegria diante de Deus
  choice: se alegrará diante de Yahweh
  alternative: ficará contente na presença de Yahweh
  rationale: A opção mantém a formulação cultual e celebrativa do hebraico sem especificar indevidamente se a frase constitui ordem, promessa ou consequência; o contexto instrutivo admite essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com tratamento singular por “você” para refletir o destinatário masculino singular do hebraico. A sintaxe foi ajustada para leitura natural, sem eliminar as repetições teologicamente significativas de “Yahweh, seu Deus”. Os marcadores de nota foram colocados junto às expressões que explicam.
