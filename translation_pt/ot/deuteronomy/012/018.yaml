review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o contraste restritivo de כִּי אִם, o objeto singular de “comerá”, a referência ao lugar escolhido por Yahweh, a enumeração inclusiva da casa e do levita, e a alegria diante de Yahweh. A expressão final, porém, é mais bem comunicada em português por uma formulação que indique as atividades/empreendimentos da pessoa, sem atribuir à expressão portuguesa “pôr a mão” um sentido potencialmente diferente.
  naturalness: O texto é claro e tem registro moderno. “Em tudo aquilo em que puser a mão”, embora compreensível, pode sugerir interferir em algo ou simplesmente tocar em algo; “em tudo o que você fizer” é mais idiomático e transmite com maior precisão o alcance de מִשְׁלַח יָדֶךָ. A nota conserva a imagem literal da mão.
  terminology: “Yahweh, seu Deus”, “servo”, “serva”, “levita” e “se alegrará” são escolhas adequadas. “Cidades” para a expressão idiomática “dentro dos seus portões” é aceitável neste contexto; a nota explica o hebraísmo.
  issues:
  - severity: low
    issue: A expressão “em tudo aquilo em que puser a mão” é potencialmente ambígua em português moderno.
    rationale: O hebraico בְּכֹל מִשְׁלַח יָדֶךָ abrange tudo o que a pessoa faz ou empreende. Em português, “pôr a mão” pode evocar intervenção ou contato, e não necessariamente trabalho ou empreendimento. Uma tradução funcional direta, acompanhada da nota literal, é mais natural e exata.
  revised_text: Mas você só o comerá diante de Yahweh, seu Deus, no lugar que Yahweh, seu Deus, escolher, juntamente com seu filho, sua filha, seu servo, sua serva e o levita que vive nas suas cidades[a]. E você se alegrará diante de Yahweh, seu Deus, em tudo o que você fizer[b].
