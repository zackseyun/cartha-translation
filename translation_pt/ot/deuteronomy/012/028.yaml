  naturalness: “Guarde e ouça atentamente” é claro, digno e natural no registro bíblico moderno, sem o literalismo excessivamente estranho. “Tudo vá bem com você” mantém uma formulação idiomática e amplamente compreensível.
  terminology: “Yahweh”, “seu Deus”, “filhos”, “para sempre”, “o que é bom e correto” e “aos olhos de” são escolhas adequadas. A nota sobre “filhos” preserva corretamente a possível amplitude de posteridade sem apagar a forma masculina do hebraico.
