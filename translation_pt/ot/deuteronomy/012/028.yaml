  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: pt
  text: Guarde e ouça atentamente todas estas palavras que lhe ordeno[a], para que tudo vá bem com você e com seus filhos depois de você, para sempre[b], pois você fará o que é bom e correto aos olhos de Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenha o cuidado de ouvir todas estas palavras”. O hebraico combina os verbos “guardar” e “ouvir”, expressando observância cuidadosa e escuta atenta; o contexto implica obediência.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos”; aqui, a expressão pode abranger a descendência ou posteridade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: Tenha o cuidado de ouvir
  rationale: A combinação expressa atenção cuidadosa às palavras, com observância implícita no contexto. A formulação é natural em português e evita o pouco idiomático “guarde e ouça”, sem reduzir שׁמע explicitamente a “obedecer”.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: todas estas palavras
  rationale: Mantém o sentido concreto de דְּבָרִים e se ajusta ao contexto das palavras de ordem pronunciadas por Moisés.
- source_word: מְצַוֶּךָּ
  choice: lhe ordeno
  rationale: O presente português comunica de forma natural a ordem que Moisés está dando naquele momento; o pronome “lhe” acompanha o tratamento amplamente inteligível com “você”.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: para que tudo vá bem com você
  rationale: Reproduz em português corrente a expressão de bem-estar resultante, frequente em Deuteronômio.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: e com seus filhos depois de você
  rationale: “Filhos” conserva a imagem familiar do hebraico e, neste contexto de continuidade da aliança, pode abranger a posteridade.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressa de maneira concisa a duração contínua ou indefinida voltada ao futuro.
- source_word: כִּי תַעֲשֶׂה
  choice: pois você fará
  rationale: Mantém a leitura causal e o valor futuro possível do imperfeito, sem converter silenciosamente a frase em uma condição explícita.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: o que é bom e correto
  rationale: Os adjetivos substantivados descrevem aquilo que corresponde ao bem e à retidão; “correto” é atual e claro em português.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica da avaliação divina e verte diretamente o nome pessoal יְהוָה como “Yahweh”.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Abrangência de בָנֶיךָ
  choice: seus filhos
  alternative: seus filhos homens; seus descendentes
  rationale: A forma hebraica é masculina plural, mas, em linguagem de promessa pactual, pode representar a descendência de modo amplo. “Filhos” mantém a expressão familiar sem impor exclusão das filhas.
- issue: Relação introduzida por כִּי
  choice: pois
  alternative: quando; se; porque
  rationale: “Pois” conserva a explicação causal adotada pelo contexto sem tornar a relação excessivamente rígida; o hebraico também pode admitir uma nuance circunstancial.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. Usa “você” sem coloquialismo excessivo, mantém “palavras” e a metáfora “aos olhos de”, e evita tanto literalismo obscuro quanto paráfrase doutrinária.
