source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: pt
  text: Mas vocês buscarão o lugar que Yahweh, seu Deus, escolher dentre todas as suas tribos para ali pôr o seu nome[a], para sua morada, e irão para lá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para estabelecer ali o seu nome, para sua morada”. O hebraico desta oração é conciso, e as traduções divergem quanto a se a ênfase recai na habitação de Deus, no lugar como sua morada ou em ambas as ideias.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: No contexto, a expressão introduz a alternativa positiva à prática anteriormente proibida; “Mas” comunica o contraste de modo natural e conciso.
- source_word: הַמָּקוֹם
  choice: o lugar
  rationale: Preserva a referência concreta, porém ainda não especificada, ao local escolhido por Deus.
- source_word: יִבְחַר
  choice: escolher
  rationale: O imperfeito aponta aqui para a escolha futura do lugar; em português, o futuro é expresso pela construção verbal com “escolherá” no conjunto da oração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Expressa naturalmente em português o título pactual ligado ao nome Yahweh; “seu” tem referência coletiva a vocês.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: dentre todas as suas tribos
  rationale: Indica uma escolha feita no âmbito das tribos de Israel e evita sugerir que o lugar seja selecionado fora delas.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: para ali pôr o seu nome
  rationale: Mantém de perto a imagem hebraica da colocação do nome, ligada à presença e ao culto autorizado, sem explicá-la além do texto.
- source_word: לְשִׁכְנוֹ
  choice: como sua morada
  rationale: Reproduz a concisão e a dificuldade sintática do hebraico, relacionando o lugar, o nome e a morada sem acrescentar explicitamente o verbo “fazer”.
- source_word: תִדְרְשׁוּ
  choice: vocês buscarão
  rationale: דרש indica procurar ou buscar o lugar apropriado; o futuro com valor diretivo é natural no discurso legal de Deuteronômio.
- source_word: וּבָאתָ שָׁמָּה
  choice: e irão para lá
  rationale: Embora בוא possa significar literalmente “vir”, “ir para lá” é idiomático em português diante de um destino ainda não identificado; o plural concorda com o referente coletivo explicitado na tradução.
theological_decisions:
- issue: Nome divino e linguagem do santuário central
  choice: Yahweh ... para ali pôr o seu nome, como sua morada
  alternative: Yahweh ... para estabelecer ali o seu nome, para nele habitar
  rationale: A formulação conserva os motivos do nome e da morada divina sem importar uma teoria posterior do templo nem afirmar mais do que o hebraico compacto permite.
- issue: Relação sintática de לְשִׁכְנוֹ
  choice: como sua morada, com nota sobre a ambiguidade
  alternative: para ali habitar / para sua morada
  rationale: O hebraico permite mais de uma relação entre o nome, o lugar e a habitação. A tradução principal é legível, enquanto a nota preserva as alternativas genuínas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para tornar explícito o plural hebraico e mantém “Yahweh” como nome próprio. A ordem foi levemente ajustada para evitar uma construção artificial em português, sem apagar a relação enfática entre buscar o lugar escolhido e ir até ele.
