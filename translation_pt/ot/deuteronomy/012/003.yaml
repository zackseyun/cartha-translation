base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: pt
  text: Derrubem os altares deles, despedacem suas colunas sagradas, queimem no fogo os seus postes de Aserá[a], cortem as imagens esculpidas de seus deuses[b] e façam desaparecer daquele lugar o nome deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus aserins” ou “seus postes sagrados”. O termo hebraico designa objetos de culto associados a Aserá.
    reason: lexical_alternative
  - marker: b
    text: Ou “os ídolos de seus deuses”. O hebraico ressalta que esses objetos de culto eram imagens fabricadas por entalhe.
    reason: lexical_alternative
  - marker: c
    text: Fazer desaparecer “o nome deles” significa eliminar daquele local de culto a presença preservada na memória e a lembrança desses deuses.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם אֶת מִזְבּחֹתָם
  choice: Derrubem os altares deles
  rationale: נתץ designa demolir ou pôr abaixo uma estrutura. “Derrubem” é claro, vigoroso e natural em português.
- source_word: שִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  choice: despedacem suas colunas sagradas
  rationale: A forma intensiva de שׁבר comunica destruição enérgica; מַצֵּבָה é uma pedra ou coluna erguida com função cultual.
- source_word: אֲשֵׁרֵיהֶם
  choice: os seus postes de Aserá
  rationale: A expressão preserva a referência cultural específica a objetos de culto associados a Aserá, sem reduzi-los a bosques nem identificá-los simplesmente com a própria divindade.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: queimem no fogo
  rationale: Mantém a menção explícita ao fogo e soa natural em português, embora a construção seja enfática.
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: as imagens esculpidas de seus deuses
  rationale: Preserva tanto a natureza fabricada e entalhada dos objetos quanto sua relação com os deuses, em vez de substituí-la pelo termo interpretativo mais amplo “ídolos”.
- source_word: תְּגַדֵּעוּן
  choice: cortem
  rationale: גדע significa cortar ou decepar. “Cortem” adapta-se às imagens esculpidas sem acrescentar que necessariamente eram árvores ou postes.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: façam desaparecer ... o nome deles
  rationale: A construção causativa expressa eliminar ou fazer perecer. A formulação conserva a imagem hebraica do “nome” e comunica sua remoção completa sem limitar o sentido a inscrições literais.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: daquele lugar
  rationale: Equivalência direta e idiomática para a remoção a partir do local de culto mencionado.
theological_decisions:
- issue: Identidade e natureza de אֲשֵׁרֵיהֶם
  choice: postes de Aserá
  alternative: aserins; postes sagrados
  rationale: A escolha mantém a especificidade religiosa do termo e, ao mesmo tempo, deixa claro que se trata de objetos cultuais associados a Aserá.
- issue: Caracterização de פְסִילֵי אֱלֹהֵיהֶם
  choice: imagens esculpidas de seus deuses
  alternative: ídolos deles
  rationale: A tradução conserva a concretude material do hebraico e evita trocar a descrição do objeto por uma classificação teológica mais abrangente.
- issue: Sentido de destruir o “nome”
  choice: manter a expressão figurada “façam desaparecer ... o nome deles”
  alternative: eliminem dali toda lembrança deles
  rationale: O “nome” pode abranger presença cultual, memória e invocação. A expressão figurada preserva essa amplitude e a tensão do original, enquanto a nota esclarece o idioma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural coerentes com o discurso dirigido a Israel. “Deles” após “altares” evita possível ambiguidade de “seus”; nas frases seguintes, o referente permanece claro. As notas aparecem na ordem em que os marcadores ocorrem no texto.
