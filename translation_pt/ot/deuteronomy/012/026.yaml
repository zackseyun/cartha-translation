  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: pt
  text: Mas somente as coisas sagradas que lhe pertencem e as suas ofertas de voto[a] você levará e irá ao lugar que Yahweh escolher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus votos”. O hebraico pode se referir aos próprios votos ou, neste contexto sacrificial, às ofertas levadas para cumpri-los.
    reason: alternativa lexical
lexical_decisions:
- source_word: רַק
  choice: Mas somente
  rationale: Expressa tanto o contraste com as permissões anteriores quanto a restrição introduzida neste versículo.
- source_word: קָדָשֶׁיךָ אֲשֶׁר יִהְיוּ לְךָ
  choice: as coisas sagradas que você tiver
  rationale: Mantém o sentido amplo de bens consagrados e traduz naturalmente a construção possessiva hebraica sem limitar o termo a uma classe específica de sacrifícios.
- source_word: וּנְדָרֶיךָ
  choice: e as suas ofertas de voto[a]
  rationale: No contexto sacrificial, os votos são concretamente aquilo que se leva para cumprir o voto; a nota preserva a tradução mais literal e a ambiguidade lexical.
- source_word: תִּשָּׂא וּבָאתָ
  choice: você as levará e irá
  rationale: Conserva os dois movimentos verbais do hebraico — carregar e dirigir-se ao lugar — em português natural, com o pronome retomando os objetos mencionados.
- source_word: הַמָּקוֹם
  choice: o lugar
  rationale: Preserva a fórmula deuteronômica sem explicitar indevidamente que se trata do santuário central.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: que Yahweh escolher
  rationale: O futuro corresponde ao caráter prospectivo da fórmula, e o nome divino é transliterado como Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Reproduz o nome da aliança presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Referência concreta de נְדָרֶיךָ no contexto sacrificial
  choice: ofertas de voto
  alternative: votos
  rationale: O ato de levar ao lugar escolhido indica o objeto oferecido em cumprimento dos votos, mas a nota mantém visível que o substantivo hebraico significa literalmente “votos”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição pronominal em “você as levará” dá clareza ao objeto de תִּשָּׂא, e “irá” soa mais natural em português do que a reprodução mecânica de “virá” quando o destino é mencionado.
