translation:
  language: pt
  text: Mas tenha muito cuidado para não comer o sangue[a], pois o sangue é a vida; não coma a vida com a carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alma”, nas duas ocorrências de “vida”. Aqui, o termo hebraico נֶפֶשׁ se refere à vida que anima a criatura; por isso, muitas traduções usam “vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Apenas
  rationale: Introduz uma forte ressalva à permissão anterior, marcando claramente a única restrição destacada neste ponto.
- source_word: חֲזַק
  choice: tenha o firme cuidado
  rationale: Embora o sentido literal seja “seja forte”, com לְבִלְתִּי a expressão é uma exortação enfática a manter-se resoluto para não fazer algo. A formulação preserva tanto a força quanto o valor idiomático.
- source_word: לְבִלְתִּי אֲכֹל
  choice: de não comer
  rationale: Expressa o conteúdo negativo da exortação de modo natural e fiel em português.
- source_word: הַדָּם
  choice: o sangue
  rationale: Equivalente direto, mantido de modo uniforme nas duas ocorrências.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão da proibição com clareza no português contemporâneo.
- source_word: הַנָּפֶשׁ
  choice: a vida
  rationale: Neste contexto, נֶפֶשׁ designa a vida animadora da criatura, não necessariamente uma alma imaterial. “Vida” preserva a lógica da proibição alimentar.
- source_word: וְלֹא תֹאכַל
  choice: você não deve comer
  rationale: Comunica a força proibitiva da instrução legal em português atual e amplamente compreensível.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: a vida com a carne
  rationale: Mantém a imagem concreta e a ligação lexical com a oração anterior; “carne” corresponde ao corpo comestível do animal sem desfazer a tensão da formulação hebraica.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto da lei alimentar
  choice: vida
  alternative: alma
  rationale: “Vida” expressa aqui a existência animada da criatura e explica a relação estabelecida entre sangue e vida. “Alma” poderia sugerir um dualismo posterior que o hebraico não exige; a alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve tom jurídico. “Tenha o firme cuidado” conserva a intensidade de חֲזַק sem a tradução pouco natural “seja forte”. O ponto e vírgula ajuda a preservar a progressão lógica entre a explicação e a proibição final.
