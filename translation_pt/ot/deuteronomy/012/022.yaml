base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: pt
  text: Mas, assim como se come a gazela e o cervo[a], assim vocês poderão comê-la[b]; tanto a pessoa impura como a pura poderão comê-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o corço e o veado”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, tanto as pessoas ritualmente impuras como as ritualmente puras podem comer dessa carne.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Introduz uma ressalva ligada à instrução anterior, sem a força restritiva mais marcada de “somente”.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: assim como ... assim
  rationale: Preserva com clareza a construção correlativa que compara o consumo do animal em questão ao da caça selvagem.
- source_word: יֵאָכֵל
  choice: se come
  rationale: Expressa o passivo hebraico de maneira impessoal e natural em português, com valor geral.
- source_word: הַצְּבִי
  choice: a gazela
  rationale: É o equivalente moderno mais provável para o animal selvagem designado por צְבִי.
- source_word: הָאַיָּל
  choice: o cervo
  rationale: Traduz de forma natural o termo para um animal da família dos cervídeos, sem especificar desnecessariamente sexo ou espécie.
- source_word: תֹּאכְלֶנּוּ
  choice: vocês poderão comê-la
  rationale: No contexto legal, o imperfeito comunica permissão; o plural “vocês” representa a segunda pessoa plural hebraica.
- source_word: הַטָּמֵא ... הַטָּהוֹר
  choice: a pessoa impura ... a pura
  rationale: Mantém o contraste tradicional de status ritual e torna explícito que os termos substantivados se referem a pessoas, não à carne.
- source_word: יַחְדָּו
  choice: tanto ... como
  rationale: Comunica que as duas categorias têm igualmente permissão para comer, sem sugerir necessariamente simultaneidade.
- source_word: יֹאכְלֶנּוּ
  choice: poderá comê-la
  rationale: Reproduz o valor permissivo do imperfeito na instrução legal.
theological_decisions:
- issue: Terminologia de status ritual
  choice: a pessoa impura ... a pura
  alternative: a pessoa ritualmente impura ... a ritualmente pura
  rationale: “Impura” e “pura” preservam o par lexical do hebraico; a nota esclarece que se trata de condição ritual, não de caráter moral.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa plural. A repetição correlativa “assim como ... assim” conserva a estrutura hebraica sem soar arcaica. O pronome feminino “la” retoma a carne ou a porção de carne permitida pelo contexto anterior.
