  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲלֶ֖ה עֹלֹתֶ֑י/ךָ בְּ/כָל מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: pt
  text: Tenha cuidado para não oferecer os seus holocaustos em qualquer lugar que você vir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenha cuidado para não oferecer os seus holocaustos em todo lugar que você vir.”'
    reason: Alternativa lexical para בְּכָל מָקוֹם, que pode ser representado mais literalmente por “em todo lugar”, embora no contexto negativo “em qualquer lugar” seja mais natural.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Tenha cuidado
  rationale: 'A forma imperativa com o pronome funciona como fórmula de advertência: “esteja atento” ou “tenha cuidado”. A escolha é natural em português atual e preserva a força da ordem.'
- source_word: פֶּן
  choice: para não
  rationale: Introduz uma advertência negativa e preventiva. Em português moderno, “para não” expressa essa força com mais naturalidade do que uma construção rebuscada.
- source_word: תַּעֲלֶה
  choice: oferecer
  rationale: O hifil de עלה significa literalmente “fazer subir” e, no contexto sacrificial, refere-se a apresentar a oferta no altar. “Oferecer” comunica claramente o uso cultual sem explicitação excessiva.
- source_word: עֹלֹתֶיךָ
  choice: os seus holocaustos
  rationale: עֹלָה é o termo técnico para a oferta inteiramente queimada. “Holocaustos” é a designação bíblica consagrada em português e mantém a especificidade cultual.
- source_word: בְּכָל מָקוֹם
  choice: em qualquer lugar
  rationale: Embora כָּל possa ser vertido literalmente por “todo”, sob uma proibição a expressão naturalmente significa “qualquer lugar”, isto é, um local escolhido sem restrição.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: que você vir
  rationale: Mantém o verbo concreto “ver” e a ambiguidade da expressão hebraica, sem acrescentar explicitamente a ideia de escolher segundo a preferência pessoal.
theological_decisions:
- issue: Linguagem de centralização do culto
  choice: Traduzir o versículo como proibição de oferecer holocaustos em locais arbitrários.
  alternative: Explicitar uma proibição geral de todo culto fora do santuário central.
  rationale: O contexto trata da centralização do culto, mas este versículo menciona especificamente os holocaustos e os lugares que a pessoa vê. A tradução não deve ampliar a afirmação além do conteúdo lexical do versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Você” representa o singular hebraico. O termo cultual “holocaustos” foi mantido por precisão e tradição bíblica; a formulação evita importar uma conclusão doutrinária mais ampla do contexto.
