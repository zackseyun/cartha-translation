  source_fidelity: A sequência futura introduzida por «Quando» reproduz adequadamente o valor contextual de וַעֲבַרְתֶּם. «Habitarão em segurança» traduz bem וִישַׁבְתֶּם בֶּטַח, e «lhes dá como herança» preserva o sentido causativo/hereditário de מַנְחִיל. Convém explicitar «ao redor de vocês», pois מִסָּבִיב se relaciona aos destinatários.
  naturalness: O texto é claro e tem registro adequado. «Yahweh, o Deus de vocês» evita a possível ambiguidade de «seu Deus» em uma frase dirigida a «vocês» e soa natural em português atual.
  terminology: «Yahweh», «terra», «herança», «descanso» e «segurança» são escolhas consistentes com o hebraico e com o registro bíblico moderno. A nota oferece uma alternativa idiomática legítima para a expressão final.
