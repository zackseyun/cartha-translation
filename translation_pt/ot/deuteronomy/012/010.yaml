  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: pt
  text: Quando vocês atravessarem o Jordão e habitarem na terra que Yahweh, o Deus de vocês, lhes dá como herança, e ele lhes der descanso de todos os inimigos ao redor de vocês, então vocês habitarão em segurança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “viverão seguros”.'
    reason: Alternativa lexical natural para וִישַׁבְתֶּם בֶּטַח, que pode ser expressa como «habitar em segurança» ou «viver seguros».
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: Quando vocês atravessarem
  rationale: O perfeito com waw integra uma sequência futura e, neste contexto, introduz naturalmente a circunstância temporal da oração principal.
- source_word: הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma consagrada do nome geográfico em português; “rio” está implícito e não precisa ser acrescentado.
- source_word: וִישַׁבְתֶּם בָּאָרֶץ
  choice: e habitarem na terra
  rationale: ישׁב indica residência estabelecida. “Habitar” preserva essa ideia e o registro digno, enquanto “terra” mantém a ressonância geográfica e pactual.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, seu Deus
  rationale: Mantém o nome divino expresso no hebraico e reproduz de modo claro a relação entre o nome próprio e o título.
- source_word: מַנְחִיל אֶתְכֶם
  choice: lhes dá como herança
  rationale: O hifil de נחל expressa fazer alguém receber uma herança ou posse; a formulação comunica tanto a ação divina quanto o caráter hereditário da terra.
- source_word: וְהֵנִיחַ לָכֶם
  choice: e ele lhes der descanso
  rationale: O hifil de נוח denota conceder descanso ou alívio, preservando aqui o importante motivo do descanso na terra.
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: de todos os inimigos ao redor
  rationale: Expressa proteção abrangente contra inimigos circundantes sem acrescentar uma referência espacial ausente no texto.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: vocês habitarão em segurança
  rationale: בטח comunica segurança e ausência de ameaça; “habitarão em segurança” conserva tanto o verbo de residência quanto a condição segura.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” o apresenta como nome próprio, sem substituí-lo por um título.
- issue: Sentido de מַנְחִיל na concessão da terra
  choice: lhes dá como herança
  alternative: faz vocês herdarem; lhes concede como posse
  rationale: A tradução mantém juntas a iniciativa divina e a linguagem de herança, sem definir além do que o hifil exige a natureza teológica dessa herança.
translation_notes:
  register: Português atual, claro e digno, com “vocês” para explicitar a segunda pessoa do plural e favorecer a legibilidade brasileira. A construção “quando... então” torna natural a sequência futura hebraica. O marcador da nota foi colocado após a expressão a que a alternativa lexical realmente se refere.
