  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: pt
  text: Não o coma[a]; derrame-o no chão como água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o sangue do animal abatido, conforme especificado no contexto imediato.
