lexical_decisions:
- source_word: לֹא תֹּאכְלֶנּוּ
  choice: Não o coma
  rationale: O imperfeito qal de segunda pessoa masculina singular com sufixo de terceira pessoa masculina singular funciona como proibição. A forma portuguesa é direta, natural e preserva o pronome que retoma o sangue no contexto.
- source_word: עַל הָאָרֶץ
  choice: no chão
  rationale: Neste contexto concreto de descarte, אֶרֶץ designa a superfície do solo; “no chão” é a expressão mais natural em português.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: derrame-o
  rationale: O verbo שׁפך descreve o ato requerido de verter o sangue, e o pronome enclítico preserva o objeto expresso por sufixo no hebraico.
- source_word: כַּמָּיִם
  choice: como água
  rationale: Mantém de modo idiomático a comparação que indica como o sangue deve ser derramado.
theological_decisions:
- issue: Referente dos sufixos pronominais
  choice: Manter “o” no texto, remetendo ao sangue mencionado no contexto.
  alternative: Explicitar “o sangue” no texto principal.
  rationale: O hebraico emprega sufixos pronominais sem repetir o substantivo. Preservar o pronome mantém a estrutura da fonte e a nota esclarece o referente sem inserir uma expansão interpretativa no versículo.
translation_notes:
  register: Português moderno, claro e digno, com imperativo proibitivo natural. O singular segue a forma hebraica dirigida ao israelita individual, e a repetição do pronome conserva a coesão do original.
