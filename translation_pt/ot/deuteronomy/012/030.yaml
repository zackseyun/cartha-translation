base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: pt
  text: 'Tenham cuidado para não cair numa armadilha ao seguir essas nações, depois de terem sido destruídas diante de vocês, e para não procurarem saber acerca dos deuses delas, perguntando: “Como estas nações adoravam os seus deuses? Eu também farei o mesmo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Tenham cuidado
  rationale: A expressão hebraica é uma advertência enfática, literalmente “guarda-te para ti”. O plural em português acompanha o destinatário coletivo implícito no contexto e evita a formulação pouco natural “tenham cuidado consigo mesmos”.
- source_word: תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: cair numa armadilha ao seguir essas nações
  rationale: O verbo נקש em nifal comunica ser enredado ou cair numa armadilha; אַחֲרֵיהֶם pode expressar seguimento. A tradução conserva ambas as ideias e explicita o referente humano do pronome.
- source_word: מִפָּנֶיךָ
  choice: diante de vocês
  rationale: Equivalente idiomático da expressão hebraica “de diante da tua face”, mantendo a perspectiva de Israel como destinatário coletivo.
- source_word: תִדְרֹשׁ לֵאלֹהֵיהֶם
  choice: procurem saber acerca dos deuses delas
  rationale: דרש aqui significa investigar ou indagar a respeito de algo. “Acerca de” evita sugerir, sem necessidade, que a consulta seja diretamente dirigida às divindades.
- source_word: יַעַבְדוּ
  choice: adoravam
  rationale: עבד, quando tem divindades por objeto, refere-se ao serviço cultual; “adoravam” é natural e claro neste contexto.
- source_word: וְאֶעֱשֶׂה כֵּן גַּם אָנִי
  choice: Eu também farei o mesmo
  rationale: Preserva a intenção expressa pela forma volitiva hebraica sem acrescentar uma relação final que não está lexicalmente marcada.
theological_decisions:
- issue: Natureza da proibição
  choice: A advertência proíbe investigar as práticas cultuais das nações com a intenção declarada de imitá-las.
  alternative: Entender a frase como proibição absoluta de qualquer conhecimento descritivo sobre outras religiões.
  rationale: A pergunta citada culmina em “Eu também farei o mesmo”, ligando a investigação à imitação cultual; a tradução mantém essa progressão sem ampliar nem restringir doutrinariamente a proibição.
- issue: Objeto do verbo דרש
  choice: “procurar saber acerca dos deuses”
  alternative: “consultar os deuses”
  rationale: A construção e a pergunta subsequente favorecem investigação acerca de como eram servidos, embora a formulação hebraica possa tangenciar a ideia de consulta religiosa. A escolha preserva o fluxo imediato do versículo sem impor esse sentido mais específico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Emprega-se a segunda pessoa coletiva por meio de “vocês”, evitando a alternância pouco natural entre “tu” singular gramatical e o povo de Israel como destinatário coletivo. A repetição hebraica de אַחֲרֵי (“depois/ao seguir”) é reproduzida semanticamente, mas não mecanicamente, para manter clareza.
