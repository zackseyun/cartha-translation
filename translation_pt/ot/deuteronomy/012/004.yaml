  yaml_path: translation/ot/deuteronomy/012/004.yaml
  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: pt
  text: Não tratem Yahweh, o Deus de vocês, dessa maneira.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dessa maneira” retoma as instruções anteriores sobre a destruição dos locais e objetos de culto das nações; Israel não deve tratar Yahweh dessa maneira.
    reason: cross_reference
  - marker: b
    text: Hebraico YHWH, tradicionalmente traduzido como “o SENHOR”; aqui, “Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: Não façam
  rationale: A negação לֹא com o imperfeito qal na segunda pessoa masculina plural expressa aqui uma proibição direta. O imperativo negativo é a forma mais natural e clara em português.
- source_word: כֵּן
  choice: assim
  rationale: O advérbio retoma de modo conciso o tratamento dos locais e objetos de culto das nações descrito nos versículos anteriores, sem explicitar no corpo do texto mais do que o hebraico diz.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica a relação ou direção da ação; em português, “fazer assim a Yahweh” preserva a construção breve e a referência anafórica do original.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: O substantivo com sufixo de segunda pessoa masculina plural expressa a relação da aliança. “Seu” tem leitura natural no português brasileiro e, neste contexto dirigido à comunidade, mantém o sentido plural coletivo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo silenciosamente por um título; a forma tradicional é registrada em nota.
- issue: Alcance da proibição
  choice: Manter a formulação breve “Não façam assim”, com esclarecimento contextual em nota
  alternative: Explicitar no texto que Israel não deve tratar Yahweh como tratou os locais de culto das nações
  rationale: כֵּן é deliberadamente anafórico e depende do contexto anterior. A tradução preserva essa concisão e não resolve no corpo do versículo toda a possível extensão da referência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A proibição usa o imperativo negativo idiomático; a concisão e a dependência do contexto presentes no hebraico foram preservadas.
