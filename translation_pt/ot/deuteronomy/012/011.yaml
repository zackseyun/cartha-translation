review_pass:
  verdict: revise
  source_fidelity: 'A tradução representa com precisão a estrutura e os principais termos do hebraico: o lugar escolhido por Yahweh, o causativo em «fazer habitar o seu nome», a direção para o lugar, a lista de ofertas e a designação divina «Yahweh». A formulação final, porém, pode expressar mais diretamente a ideia de «a escolha/o melhor dentre os votos», sem sugerir qualidades internas de cada voto.'
  naturalness: O português é moderno, claro e apropriado ao registro bíblico. «Ao lugar que ... escolher» é uma antecipação natural do complemento e preserva bem a direção de שָׁמָּה. A pequena revisão na oração final torna a leitura mais idiomática e menos ambígua.
  terminology: «Yahweh», «holocaustos», «sacrifícios», «dízimos» e «contribuição das suas mãos» são escolhas adequadas. «Holocaustos» é o termo sacrificial português estabelecido para עוֹלֹת. A nota reproduz legitimamente a alternativa não causativa para לְשַׁכֵּן.
  issues:
