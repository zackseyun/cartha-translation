source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: pt
  text: 'Então, ao lugar que Yahweh, o Deus de vocês, escolher para ali fazer habitar o seu nome[a], vocês levarão tudo o que eu lhes ordeno: seus holocaustos, seus sacrifícios, seus dízimos, a contribuição das suas mãos e tudo o que houver de melhor entre os votos que fizerem a Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que seu nome habite ali”.'
    reason: Registra uma tradução menos formal da construção causativa hebraica, preservando a imagem de habitação.
lexical_decisions:
- source_word: וְהָיָה
  choice: Então
  rationale: Marca com naturalidade a progressão para a circunstância futura decorrente das instruções anteriores.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: ao lugar que ... escolher
  rationale: Mantém o lugar específico como elemento central e expressa o sentido futuro do contexto sem tornar a frase pesada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para ali fazer habitar o seu nome
  rationale: Preserva tanto a forma causativa do hifil quanto a imagem de habitação, importante na linguagem de Deuteronômio sobre o nome divino.
- source_word: שָׁמָּה תָבִיאוּ
  choice: vocês levarão
  rationale: O destino já foi expresso por “ao lugar”; o futuro em português comunica aqui a determinação normativa dirigida ao povo.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: tudo o que eu lhes ordeno
  rationale: Reproduz de modo corrente a abrangência de כָּל e a força vigente do particípio מְצַוֶּה.
- source_word: עוֹלֹתֵיכֶם
  choice: seus holocaustos
  rationale: Termo português estabelecido para ofertas queimadas por inteiro, adequado ao contexto sacrificial.
- source_word: זִבְחֵיכֶם
  choice: seus sacrifícios
  rationale: Conserva a amplitude do substantivo e evita restringi-lo a uma modalidade sacrificial específica.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: seus dízimos
  rationale: Equivalente corrente e preciso para contribuições da décima parte.
- source_word: תְרֻמַת יֶדְכֶם
  choice: a contribuição das suas mãos
  rationale: Preserva a imagem concreta do hebraico e continua compreensível em português moderno.
- source_word: וְכֹל מִבְחַר נִדְרֵיכֶם אֲשֶׁר תִּדְּרוּ
  choice: e tudo o que houver de melhor nos votos que fizerem
  rationale: Expressa מִבְחַר como a parte mais excelente dos votos sem acrescentar o substantivo “ofertas”, ausente do texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o nome pessoal divino; a transliteração o preserva, sem trocá-lo por um título.
- issue: A linguagem de habitação do nome em לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para ali fazer habitar o seu nome
  alternative: para que seu nome habite ali; para colocar ali o seu nome
  rationale: A redação mantém o causativo hebraico e a tensão própria do texto, que fala da presença do nome de Yahweh no lugar escolhido sem afirmar que o próprio ser divino fique confinado ali.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas de tratamento no plural (“vocês”) adequadas à leitura brasileira e internacional. A ordem foi levemente ajustada para fluidez, sem eliminar a ênfase no lugar escolhido nem a terminologia sacrificial.
