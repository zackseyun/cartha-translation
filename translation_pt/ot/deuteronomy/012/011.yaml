    issue: Ambiguidade em «tudo o que houver de melhor nos votos que fizerem»
    rationale: וְכֹל מִבְחַר נִדְרֵיכֶם se refere ao que há de escolhido/mais excelente entre os votos. «Nos votos» pode sugerir que cada voto contém uma parte melhor. «Entre os votos» preserva mais claramente a relação partitiva sem acrescentar «ofertas».
