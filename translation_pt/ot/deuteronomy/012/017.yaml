  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: pt
  text: Você não poderá comer nas suas cidades[a] o dízimo do seu cereal, do seu vinho novo e do seu azeite, nem os primogênitos do seu gado e do seu rebanho, nem nenhuma das ofertas de voto que você fizer,[b] nem as suas ofertas voluntárias, nem a contribuição da sua mão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dentro dos seus portões”, expressão que se refere às cidades ou povoações locais.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todos os seus votos que você fizer”. Neste contexto, a expressão provavelmente se refere às ofertas prometidas por voto.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a oferta da sua mão”; tradicionalmente, “a oferta alçada da sua mão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: Você não poderá comer
  rationale: A construção com יכל e infinitivo tem força proibitiva neste texto legal. “Não poderá” comunica proibição em português atual, sem reduzi-la a mera incapacidade.
- source_word: בִּשְׁעָרֶיךָ
  choice: nas suas cidades
  rationale: Literalmente, “dentro dos seus portões”; aqui, “portões” funciona como metonímia para os assentamentos ou cidades locais. A tradução no texto comunica naturalmente o sentido, enquanto a nota preserva a imagem hebraica.
- source_word: מַעְשַׂר דְּגָנְךָ
  choice: o dízimo do seu cereal
  rationale: מַעְשַׂר é a décima parte devida ou consagrada, e דָּגָן designa cereal ou grão. “Cereal” evita que “grão” seja entendido apenas como unidade ou semente.
- source_word: תִירֹשְׁךָ
  choice: seu vinho novo
  rationale: תִּירוֹשׁ costuma designar o produto recente da videira, distinguindo-se de termos mais gerais para vinho.
- source_word: יִצְהָרֶךָ
  choice: seu azeite
  rationale: O termo se refere tipicamente a óleo fresco, sobretudo azeite de oliva. “Azeite” é claro e idiomático em português.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: os primogênitos do seu gado e do seu rebanho
  rationale: בְּכוֹרֹת indica as primeiras crias; os coletivos “gado” e “rebanho” representam adequadamente בָּקָר e צֹאן.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: nenhuma das ofertas de voto que você fizer
  rationale: Embora נֶדֶר signifique literalmente “voto”, no contexto da lista de coisas sagradas comestíveis refere-se às ofertas comprometidas por voto. A nota registra a forma mais literal e preserva a tensão lexical.
- source_word: נִדְבֹתֶיךָ
  choice: suas ofertas voluntárias
  rationale: Designa dádivas cultuais oferecidas espontaneamente, em contraste com ofertas devidas ou prometidas por voto.
- source_word: תְּרוּמַת יָדֶךָ
  choice: a contribuição das suas mãos
  rationale: A formulação mantém a imagem concreta do hebraico sem recorrer ao tradicional e pouco transparente “oferta alçada”. O plural “mãos” é idiomático em português, embora o hebraico use o singular.
theological_decisions:
- issue: Sentido cultual de נְדָרֶיךָ na lista de alimentos e ofertas sagradas
  choice: ofertas de voto
  alternative: votos
  rationale: O objeto do verbo “comer” não pode ser a promessa verbal em si, mas aquilo que foi consagrado em cumprimento do voto. A tradução explicita o referente contextual sem ocultar em nota a expressão literal.
- issue: Força da proibição em לֹא תוּכַל
  choice: não poderá
  alternative: não pode / não comerá
  rationale: No contexto legal, a expressão comunica falta de permissão, não incapacidade física. “Não poderá” conserva a forma modal e a força normativa sem adotar uma fórmula confessional específica.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” no singular para refletir o destinatário singular hebraico. A enumeração legal foi mantida com repetições de “nem” para clareza. Termos cultuais reconhecíveis — “dízimo”, “ofertas de voto” e “ofertas voluntárias” — preservam as categorias do texto sem linguagem arcaica.
