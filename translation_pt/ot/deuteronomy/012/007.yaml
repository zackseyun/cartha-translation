base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: pt
  text: Ali vocês comerão diante de Yahweh, seu Deus, e se alegrarão em toda a obra de suas mãos[a], vocês e suas famílias, com a qual Yahweh, seu Deus, os abençoou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em todos os seus empreendimentos” ou “em tudo aquilo a que vocês puserem a mão”. O hebraico diz literalmente “em todo o envio da mão de vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: vocês comerão
  rationale: O perfeito qal com waw, neste contexto instrutivo e legal, tem força futura e prescritiva. O futuro em português comunica naturalmente o que Israel deverá fazer no lugar escolhido.
- source_word: שָׁם
  choice: ali
  rationale: Mantém a referência dêitica ao lugar que Yahweh escolherá, sem explicitar além do hebraico.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: diante de Yahweh, seu Deus
  rationale: “Diante de” traduz de modo natural לִפְנֵי e expressa a refeição celebrada na presença divina. O nome יהוה é transliterado como “Yahweh”.
- source_word: וּשְׂמַחְתֶּם
  choice: e se alegrarão
  rationale: Preserva o paralelismo com “comerão” e o tema da alegria comunitária perante Deus.
- source_word: מִשְׁלַח יֶדְכֶם
  choice: por tudo o que as suas mãos realizarem
  rationale: Expressa de forma compreensível o idiomatismo literalmente relacionado ao “estender/enviar da mão”, sem restringi-lo apenas a trabalho agrícola. A nota registra alternativas e a imagem hebraica.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: vocês e suas famílias
  rationale: Neste contexto, בָּתִּים designa unidades familiares ou domésticas, não edifícios. “Famílias” é claro e corrente em português.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: com que Yahweh, seu Deus, os abençoou
  rationale: Conserva a ligação relativa potencialmente ambígua com aquilo que as mãos realizam e evita convertê-la sem necessidade em uma oração causal. “Os” torna legível em português a referência corporativa a Israel.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal da aliança, sem substituí-lo por um título.
- issue: Alternância entre destinatários plurais e sufixos finais singulares
  choice: Empregar formas plurais idiomáticas em português
  alternative: Marcar artificialmente a mudança para o singular na oração final
  rationale: O hebraico passa do plural ao singular corporativo, recurso frequente em Deuteronômio. Como “você” é ambíguo e uma mudança literal produziria confusão em português, o plural preserva o referente coletivo e a naturalidade, embora não reproduza formalmente a alternância.
- issue: Relação da oração אֲשֶׁר בֵּרַכְךָ
  choice: 'oração relativa: “com que ... os abençoou”'
  alternative: 'oração causal: “porque ... os abençoou”'
  rationale: A sintaxe admite alguma tensão quanto ao antecedente e à relação semântica. A formulação relativa mantém essa ligação mais próxima da forma hebraica, em vez de resolver a expressão como causal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Usa “vocês” para o destinatário plural e “famílias” para o sentido doméstico de בָּתִּים. O travessão destaca sem alterar o sentido a expressão parentética “vocês e suas famílias”.
