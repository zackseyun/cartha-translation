base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: pt
  text: E vocês se alegrarão diante de Yahweh, seu Deus — vocês, seus filhos e suas filhas, seus escravos e suas escravas, e o levita que está dentro das suas portas[a] —, pois ele não tem parte nem herança com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que está nas suas cidades”; literalmente, “que está dentro das suas portas”.'
    reason: A expressão hebraica usa “portas” literalmente, mas pode designar, por metonímia, as cidades ou comunidades locais.
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: E vocês se alegrarão
  rationale: O perfeito qal com conjunção, neste contexto instrutivo, tem força prospectiva e prescritiva. “Se alegrarão” preserva tanto a forma quanto o sentido de alegria cultual e comunitária.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: diante de Yahweh, seu Deus
  rationale: “Diante de” expressa naturalmente לִפְנֵי como presença cultual; Yahweh translitera o nome divino יְהוָה, e “seu” concorda com o tratamento plural “vocês” no português brasileiro corrente.
- source_word: אַתֶּם וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: vocês, seus filhos e suas filhas
  rationale: Mantém o pronome enfático e o par masculino/feminino explícito no hebraico.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: seus escravos e suas escravas
  rationale: Os termos designam dependentes domésticos em condição servil. A tradução explicita o status social e preserva a distinção de gênero, sem suavizá-lo como “servos”.
- source_word: וְהַלֵּוִי אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: e o levita que vive dentro das suas portas
  rationale: “Levita” é a designação convencional. “Dentro das suas portas” conserva a imagem e a ressonância jurídico-comunitária do hebraico, enquanto “vive” torna a relação locativa natural em português.
- source_word: כִּי אֵין לוֹ חֵלֶק וְנַחֲלָה אִתְּכֶם
  choice: pois ele não tem parte nem herança com vocês
  rationale: “Pois” preserva a relação causal; “parte nem herança” reproduz o par coordenado no alcance da negação e se refere à ausência de uma porção territorial hereditária.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Condição social expressa por עֶבֶד e אָמָה
  choice: escravos e escravas
  alternative: servos e servas
  rationale: No contexto legal e doméstico, a condição servil é relevante para a inclusão de todos na celebração. “Escravos e escravas” preserva essa realidade social e a distinção de gênero do original.
- issue: Sentido de חֵלֶק וְנַחֲלָה
  choice: parte nem herança
  alternative: porção nem propriedade hereditária
  rationale: A formulação mantém a linguagem teologicamente significativa da ausência de herança territorial do levita sem inserir uma explicação interpretativa no corpo do versículo.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade, com tratamento plural por “vocês”. A enumeração foi mantida para refletir a inclusão explícita de toda a casa. Travessões organizam a lista sem apagar a estrutura do hebraico; a nota preserva a alternativa idiomática para “portas”.
