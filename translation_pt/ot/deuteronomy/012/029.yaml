source:
  edition: WLC
  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: pt
  text: Quando Yahweh, seu Deus, eliminar de diante de você as nações para cuja terra você está indo, a fim de desalojá-las, e você as desalojar e habitar na terra delas,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz uma circunstância futura que prepara a advertência do versículo seguinte; o valor temporal é mais adequado aqui do que o causal.
- source_word: יַכְרִית
  choice: eliminar
  rationale: O hifil de כרת indica remover ou eliminar as nações de diante de Israel. “Eliminar” preserva essa força sem afirmar, por si só, aniquilação total.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a construção com sufixo de segunda pessoa masculina singular em português natural.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: É a correspondência direta e contextual de גּוֹיִם, referindo-se aos povos que habitavam a terra.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: que você vai desalojar ao entrar ali
  rationale: Expressa naturalmente o movimento para aquele lugar e a finalidade de tomar posse mediante o afastamento dos habitantes, sem reproduzir a ordem hebraica de modo artificial.
- source_word: מִפָּנֶיךָ
  choice: de diante de você
  rationale: Preserva a imagem espacial do idioma hebraico, indicando a remoção das nações do caminho ou da presença de Israel.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: e você as desalojar
  rationale: Com as nações como objeto, ירש descreve tomar posse mediante a retirada dos ocupantes; “desalojar” comunica essa relação.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: e habitar na terra delas
  rationale: “Habitar” mantém o tom digno e traduz ישב no contexto de estabelecimento permanente na terra antes ocupada pelas nações.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz o nome pessoal divino; “Yahweh” o translitera e evita substituí-lo por um título.
- issue: Alcance de יַכְרִית na descrição do destino das nações
  choice: eliminar de diante de você
  alternative: exterminar
  rationale: A formulação mantém a ideia de remoção decisiva sem resolver a expressão como uma afirmação inequívoca de aniquilação total.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi ajustada para evitar o literalismo pouco natural de “ir para lá para desalojá-las”, preservando o movimento, a finalidade e a sequência do hebraico. A vírgula final mantém a ligação sintática com a advertência que continua no versículo seguinte.
