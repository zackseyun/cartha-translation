  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲזֹ֖ב אֶת הַ/לֵּוִ֑י כָּל יָמֶ֖י/ךָ עַל אַדְמָתֶֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: pt
  text: Tenha cuidado para não abandonar o levita[a] todos os seus dias na sua terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os levitas”. O hebraico traz o singular “o levita”, provavelmente usado de modo representativo para os levitas como grupo.
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre a sua terra”. O hebraico diz literalmente “sobre a sua terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Tenha cuidado
  rationale: 'O imperativo nifal de שׁמר com לְךָ funciona como uma advertência idiomática: vigiar a si mesmo ou tomar cuidado. “Tenha cuidado” é claro, atual e mantém a força da exortação.'
- source_word: פֶּן
  choice: para não
  rationale: פֶּן introduz uma advertência negativa. A construção portuguesa “tenha cuidado para não” expressa essa relação de modo natural, sem recorrer a uma formulação excessivamente literal.
- source_word: תַּעֲזֹב
  choice: abandonar
  rationale: עזב pode significar deixar, abandonar ou desamparar. “Abandonar” conserva o peso moral da obrigação comunitária para com o levita e continua sendo linguagem comum.
- source_word: אֶת הַלֵּוִי
  choice: o levita
  rationale: O hebraico emprega o substantivo singular com artigo, provavelmente como singular representativo. A tradução mantém essa forma e registra em nota a alternativa coletiva.
- source_word: כָּל יָמֶיךָ
  choice: enquanto você viver
  rationale: A expressão significa literalmente “todos os seus dias”. A formulação escolhida comunica naturalmente em português a duração por toda a vida, sem alterar seu alcance temporal.
- source_word: עַל אַדְמָתֶךָ
  choice: na sua terra
  rationale: אדמה designa solo ou terra, e עַל significa literalmente “sobre”. Neste contexto territorial, “na sua terra” é a expressão portuguesa mais natural; a forma mais literal é preservada em nota.
theological_decisions:
- issue: Singular representativo referente ao levita
  choice: o levita
  alternative: os levitas
  rationale: O texto hebraico traz o singular definido, provavelmente representando qualquer levita ou a classe dos levitas. Manter o singular preserva a forma e a tensão do texto-fonte sem excluir seu sentido coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe é idiomática, enquanto o singular representativo e a alternativa mais literal para a preposição são preservados por meio de notas.
