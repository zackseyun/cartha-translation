base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: pt
  text: Estes são os estatutos e os juízos[a] que vocês devem ter o cuidado de cumprir na terra que Yahweh, o Deus de seus pais, deu a vocês para que tomem posse dela[b], durante todos os dias em que viverem sobre a terra[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as determinações” ou “as decisões judiciais”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que a herdem”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “sobre a terra”; אַדָמָה também pode significar “solo” ou, neste contexto, ser entendido de modo mais restrito como “a terra”.'
    reason: lexical_alternative
  - marker: d
    text: O hebraico alterna entre formas plurais (“vocês devem”, “viverem”) e singulares (“seus pais”, “deu a você”) ao dirigir-se a Israel. A tradução usa o plural no texto principal para maior clareza.
    reason: source_form
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: Estes são os estatutos
  rationale: A forma de apresentação introduz a seção legal; “estatutos” mantém o registro jurídico e distingue חֻקִּים do termo seguinte.
- source_word: וְהַמִּשְׁפָּטִים
  choice: e as decisões
  rationale: מִשְׁפָּטִים designa decisões ou determinações jurídicas. “Decisões” é atual e inteligível, sem confundi-lo completamente com “estatutos”; a alternativa tradicional consta em nota.
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: que vocês devem ter o cuidado de cumprir
  rationale: A construção שׁמר + infinitivo exprime observância cuidadosa levada à prática; “cumprir” é mais natural em português para legislação do que o literal “fazer”.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: No contexto de Deuteronômio, refere-se ao território que Israel receberia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: o Deus de seus pais
  rationale: Preserva a fórmula pactual tradicional e o vínculo com as gerações anteriores.
- source_word: לְרִשְׁתָּהּ
  choice: para que tomem posse dela
  rationale: ירשׁ, neste contexto territorial, envolve entrar na terra e possuí-la; a formulação explicita o pronome feminino referente a “terra”.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: durante todos os dias em que viverem
  rationale: Mantém a abrangência de כָּל הַיָּמִים e comunica naturalmente a duração da obrigação.
- source_word: עַל הָאֲדָמָה
  choice: sobre a terra
  rationale: Aqui אֲדָמָה pode ter sentido amplo (“terra”) ou mais concreto (“solo”); a leitura ampla evita limitar indevidamente a duração à terra prometida.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o nome próprio divino. A transliteração conserva essa distinção, enquanto “SENHOR” substitui o nome por um título tradicional.
- issue: Sentido de ירשׁ na concessão da terra
  choice: tomar posse
  alternative: herdar
  rationale: “Tomar posse” expressa melhor o sentido territorial e ativo frequente em Deuteronômio, sem excluir a noção de dádiva já expressa pelo verbo “deu”.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “vocês” como plural explícito. O registro jurídico é preservado sem recorrer a construções excessivamente arcaicas. A mudança de número do hebraico é registrada em nota, em vez de produzir uma oscilação pouco natural no texto principal.
