  naturalness: O texto é claro e atual para leitores de português internacional, com boa legibilidade brasileira. “Vocês” é uma solução natural para o plural. A posição das âncoras deve ser regularizada antes do ponto final.
  terminology: “Estatutos” e “juízos” mantêm a distinção tradicional e jurídica entre חֻקִּים e מִשְׁפָּטִים. “Tomem posse dela” expressa bem ירשׁ no contexto territorial. “Yahweh” reproduz de modo consistente o nome divino.
