  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: pt
  text: Não o coma[a], para que tudo vá bem com você e com seus filhos depois de você, pois você fará o que é certo aos olhos de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus filhos homens depois de você”; em sentido mais amplo, “seus descendentes depois de você”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: o coma
  rationale: אָכַל significa comer ou consumir; o sufixo masculino singular retoma o sangue no contexto imediato. A construção «não o coma» conserva o objeto direto e soa natural em português.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz finalidade ou resultado; «para que» preserva de modo claro essa relação.
- source_word: יִיטַב לְךָ
  choice: tudo vá bem com você
  rationale: Expressa a fórmula de bem-estar ou bom resultado comum em Deuteronômio, sem restringi-la à prosperidade material.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: e com seus filhos depois de você
  rationale: בָּנִים pode designar filhos ou, por extensão, descendentes. «Filhos» mantém a linguagem familiar concreta, enquanto a nota registra a amplitude possível.
- source_word: כִּי
  choice: pois assim
  rationale: A partícula fundamenta o bem prometido na prática do que é correto. «Pois assim» explicita com naturalidade a relação entre a obediência e o resultado, sem transformá-la em mera sequência temporal.
- source_word: תַעֲשֶׂה
  choice: você fará
  rationale: O imperfeito tem orientação prospectiva no contexto e descreve a ação esperada de obedecer.
- source_word: הַיָּשָׁר
  choice: o que é certo
  rationale: יָשָׁר denota aquilo que é reto ou correto; esta formulação é clara e conserva a linguagem ética de Deuteronômio.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica de avaliação divina e verte o nome próprio conforme aparece no texto-fonte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal sem substituí-lo por um título.
- issue: Amplitude de בָנֶיךָ
  choice: filhos
  alternative: filhos homens; descendentes
  rationale: A forma é masculina plural, mas pode abranger a posteridade no contexto da aliança. O texto mantém a linguagem familiar «filhos», e a nota preserva as leituras mais específica e mais ampla.
- issue: Relação expressa por כִּי תַעֲשֶׂה
  choice: pois assim você fará
  alternative: porque você fará; quando você fizer
  rationale: A construção pode ser entendida como fundamento ou circunstância da promessa. A versão mantém o valor explicativo de כִּי e liga a obediência ao resultado sem impor uma formulação teológica mais rígida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A próclise em «Não o coma» é natural no português atual. A expressão «aos olhos de» conserva o idioma hebraico sem soar arcaica.
