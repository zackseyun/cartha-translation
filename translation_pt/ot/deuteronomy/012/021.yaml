id: DEU.12.21
reference: Deuteronomy 12:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: pt
  text: Se o lugar que Yahweh, seu Deus, escolher para ali pôr o seu nome ficar longe demais de você, então você poderá abater animais do seu gado e do seu rebanho que Yahweh lhe deu, conforme eu lhe ordenei. Você poderá comê-los à vontade nas suas cidades[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dentro dos seus portões”. Os portões representam aqui as cidades ou localidades.
    reason: lexical_alternative
  - marker: b
    text: Ou “conforme todo o seu apetite”; literalmente, “segundo todo o desejo da sua alma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: Se ... ficar longe demais de você
  rationale: כִּי introduz aqui uma circunstância condicional, e רחק indica distância. “Longe demais” explicita com naturalidade a dificuldade prática que fundamenta a permissão.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: o lugar que Yahweh, seu Deus, escolher
  rationale: O yiqtol de בחר admite valor geral ou futuro no discurso legal. O futuro do subjuntivo em português se ajusta naturalmente à condição sem fixar indevidamente o momento da escolha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: para ali pôr o seu nome
  rationale: Mantém a formulação deuteronômica e o sentido direto de שׂים, sem introduzir a interpretação mais específica de fazer o nome habitar.
- source_word: וְזָבַחְתָּ
  choice: então você poderá abater
  rationale: Neste contexto, זבח se refere ao abate local para alimentação, não necessariamente a um sacrifício. “Poderá” comunica a força permissiva da disposição legal.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: animais do seu gado e do seu rebanho
  rationale: בקר e צאן são termos coletivos para animais de maior e menor porte. A inclusão de “animais” torna natural em português a ideia de selecionar alguns deles para o abate.
- source_word: אֲשֶׁר נָתַן יְהוָה לְךָ
  choice: que Yahweh lhe deu
  rationale: Preserva de modo simples a afirmação de que os animais são dádiva de Yahweh.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: conforme eu lhe ordenei
  rationale: Mantém a primeira pessoa de Moisés e a referência a instruções já dadas.
- source_word: וְאָכַלְתָּ
  choice: Você poderá comê-los
  rationale: O pronome explicita o objeto já mencionado, e “poderá” mantém a força permissiva no contexto legal.
- source_word: בִּשְׁעָרֶיךָ
  choice: nas suas cidades
  rationale: Literalmente “dentro dos seus portões”, expressão metonímica hebraica para as cidades ou localidades onde o povo vivia. A tradução no texto comunica o referente em português corrente, e a nota preserva a imagem original.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: sempre que desejar
  rationale: A expressão denota a plena vontade ou o apetite da pessoa. Esta formulação é natural no contexto alimentar, enquanto a nota registra a imagem antropológica literal e outras nuances possíveis.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Natureza do abate permitido
  choice: abater
  alternative: sacrificar
  rationale: O contexto permite o abate e consumo nas cidades quando o santuário escolhido está distante. “Sacrificar” poderia sugerir indevidamente a autorização de culto sacrificial local.
- issue: Força modal das ações וְזָבַחְתָּ e וְאָכַלְתָּ
  choice: poderá abater ... poderá comer
  alternative: abaterá ... comerá; deverá abater ... deverá comer
  rationale: No desenvolvimento da lei, as formas verbais concedem permissão para o consumo local, não impõem que o abate e a refeição ocorram.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no singular porque o hebraico se dirige individualmente ao israelita representativo. A divisão em duas frases evita um período excessivamente longo sem alterar a progressão do mandamento.
