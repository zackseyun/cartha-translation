  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: pt
  text: Destruam completamente todos os lugares onde as nações que vocês estão expulsando serviam aos seus deuses[a], nos montes altos, nas colinas e debaixo de toda árvore verdejante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adoravam os seus deuses”. O verbo hebraico também pode significar “servir” no sentido de prestar culto religioso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: Destruam completamente
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ordem. “Destruam completamente” comunica essa ênfase em português atual, sem recorrer a uma construção arcaica.
- source_word: הַמְּקֹמוֹת
  choice: todos os lugares
  rationale: O substantivo designa aqui locais associados ao culto. “Lugares” mantém a concretude do hebraico sem explicitar além do texto que sejam “santuários”.
- source_word: עָבְדוּ שָׁם
  choice: onde ... serviam
  rationale: עבד, quando tem divindades por objeto, pode significar servir em sentido religioso, isto é, prestar culto. “Serviam aos seus deuses” preserva a imagem lexical do hebraico; a nota registra a alternativa mais explícita.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: No contexto, refere-se às nações não israelitas da terra. “Nações” é direto e evita importar usos religiosos posteriores ligados a “gentios”.
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: que vocês estão expulsando
  rationale: ירשׁ, neste contexto de conquista, inclui tomar posse mediante a remoção dos habitantes anteriores. “Estão expulsando” expressa com naturalidade o efeito sobre as nações, embora não torne explícita toda a nuance de tomar posse.
- source_word: אֱלֹהֵיהֶם
  choice: seus deuses
  rationale: Equivalência direta do plural com sufixo possessivo.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: nos montes altos
  rationale: Tradução direta do substantivo e do adjetivo, adequada aos locais elevados de culto mencionados no contexto.
- source_word: הַגְּבָעוֹת
  choice: nas colinas
  rationale: Equivalente corrente e preciso para גְּבָעוֹת, sem acrescentar a ideia mais específica de “topos”.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: debaixo de toda árvore verdejante
  rationale: רַעֲנָן descreve vegetação viçosa, fresca ou frondosa. “Verdejante” preserva essa qualidade e soa digna e compreensível em português moderno.
theological_decisions:
- issue: Natureza da ação ordenada contra os locais de culto das nações
  choice: A ordem tem como objeto concreto todos os lugares associados ao serviço religioso prestado aos deuses das nações expulsas.
  alternative: Parafrasear de modo mais amplo como a eliminação das práticas de culto pagãs.
  rationale: O objeto expresso no hebraico é “todos os lugares”, e não diretamente as práticas. A tradução conserva esse foco concreto, deixando implícita a consequência mais ampla para o culto.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa, favorecendo ampla legibilidade brasileira. A ordem foi formulada de modo enfático e natural; evitou-se tanto linguagem arcaica quanto a explicitação interpretativa de “lugares de culto” no corpo do versículo.
