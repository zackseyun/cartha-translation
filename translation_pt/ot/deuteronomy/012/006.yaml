base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: pt
  text: E ali vocês levarão seus holocaustos, seus sacrifícios, seus dízimos, a contribuição da mão de vocês[a], suas ofertas de voto[b], suas ofertas voluntárias e os primogênitos do gado e dos rebanhos de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a contribuição que vocês apresentam”. A expressão hebraica inclui literalmente “mão” e destaca aquilo que cada pessoa apresenta.
    reason: lexical_alternative
  - marker: b
    text: Ou simplesmente “seus votos”. Neste contexto, provavelmente se refere às ofertas apresentadas em cumprimento de votos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: vocês levarão
  rationale: O hifil de בוא expressa fazer chegar ou levar ao lugar indicado. O futuro em português funciona naturalmente como prescrição no contexto legal.
- source_word: שָׁמָּה
  choice: ali
  rationale: Retoma de modo conciso o lugar de culto mencionado anteriormente.
- source_word: עֹלֹתֵיכֶם
  choice: seus holocaustos
  rationale: עוֹלָה é o termo sacrificial para a oferta inteiramente queimada; “holocausto” é a designação técnica tradicional e ainda reconhecível em português bíblico.
- source_word: וְזִבְחֵיכֶם
  choice: seus sacrifícios
  rationale: זֶבַח designa de maneira ampla sacrifícios de animais abatidos, distintos dos holocaustos nesta enumeração.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: seus dízimos
  rationale: O substantivo indica porções de um décimo; “dízimos” é o equivalente corrente e preciso.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: a contribuição das suas mãos
  rationale: Preserva tanto o sentido de תְּרוּמָה como contribuição separada quanto a imagem hebraica da mão, sem reduzir a expressão simplesmente a “oferta”.
- source_word: וְנִדְרֵיכֶם
  choice: suas ofertas de voto
  rationale: Embora o substantivo possa significar literalmente “seus votos”, dentro desta lista de dádivas levadas ao santuário refere-se naturalmente às ofertas vinculadas ao cumprimento deles.
- source_word: וְנִדְבֹתֵיכֶם
  choice: suas ofertas voluntárias
  rationale: Expressa dádivas espontâneas, não exigidas por voto, e as distingue das ofertas de voto anteriores.
- source_word: וּבְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: os primogênitos dos seus rebanhos de gado e de ovelhas e cabras
  rationale: בָּקָר indica gado bovino, enquanto צֹאן abrange o gado miúdo, isto é, ovelhas e cabras. A formulação torna clara essa abrangência zoológica.
theological_decisions:
- issue: Sentido de נִדְרֵיכֶם na lista cultual
  choice: ofertas de voto
  alternative: votos
  rationale: A tradução explicita a referência concreta às ofertas entregues em cumprimento dos votos, mas a nota conserva a forma lexical mais literal e a possível concisão do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural dirigido ao povo. Mantêm-se termos bíblicos reconhecíveis, como “holocaustos” e “dízimos”, enquanto “ofertas voluntárias” evita o caráter arcaico de alternativas como “ofertas de livre vontade”.
