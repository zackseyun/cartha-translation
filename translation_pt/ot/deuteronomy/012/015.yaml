language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: pt
  text: Contudo, sempre que você desejar[a], poderá abater animais e comer carne, conforme a bênção que Yahweh, seu Deus, lhe deu, em todas as suas cidades[b]. Tanto o impuro como o puro poderão comê-la, como se come a gazela ou o cervo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “em todo o desejo da sua alma”; isto é, sempre que você desejar.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “em todas as suas portas”. Nesse idiomatismo hebraico, “portas” representa as cidades ou povoações.'
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: Introduz uma ressalva em relação à ordem anterior; “contudo” preserva essa força adversativa sem soar excessivamente literal.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: sempre que você desejar
  rationale: Expressa em português natural o idiomatismo hebraico, literalmente “em todo o desejo da sua alma”; a nota conserva sua forma concreta.
- source_word: תִּזְבַּח
  choice: poderá abater animais
  rationale: O contexto concede permissão para matar animais destinados à alimentação. “Abater” é mais específico e apropriado que o genérico “matar”; “animais” explicita o objeto implícito sem mudar o sentido.
- source_word: וְאָכַלְתָּ בָשָׂר
  choice: e comer carne
  rationale: בָשָׂר designa aqui carne animal usada como alimento.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: conforme a bênção que Yahweh, seu Deus, lhe deu
  rationale: Mantém o substantivo “bênção” e a ideia de que o consumo corresponde à provisão concedida por Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: em qualquer uma das suas cidades
  rationale: “Em todas as suas portas” é um idiomatismo hebraico que se refere às cidades ou povoações; “qualquer uma” comunica naturalmente a permissão distributiva no contexto.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: Tanto o impuro como o puro
  rationale: Refere-se ao estado ritual, não ao caráter moral, e a construção correlativa deixa claro que ambos podem comer.
- source_word: יֹאכְלֶנּוּ
  choice: poderão comê-la
  rationale: O contexto é permissivo; o pronome feminino retoma “carne” em português.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: como se come a gazela ou o cervo
  rationale: A comparação é com animais de caça cujo consumo não exigia tratamento sacrificial. A formulação evita sugerir que as próprias pessoas comem à maneira dos animais.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido de “impuro” e “puro”
  choice: Manter os termos sem qualificá-los no corpo do texto
  alternative: cerimonialmente impuro e puro
  rationale: O contexto indica condição ritual, mas acrescentar “cerimonialmente” tornaria explícito algo que o hebraico deixa implícito. A formulação preserva a terminologia e a tensão do sistema de pureza.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O tratamento singular por “você” acompanha o destinatário singular do hebraico. A ordem foi suavizada apenas onde a expressão hebraica seria pouco natural em português, mantendo em notas os principais idiomatismos.
