  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: pt
  text: Pois vocês ainda não chegaram ao lugar de descanso e à herança que Yahweh, seu Deus, lhes está dando.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao descanso”. O hebraico pode indicar tanto o descanso em sentido abstrato quanto um lugar de descanso; neste contexto de entrada na terra, o sentido mais concreto parece preferível.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da ordem anterior e preserva de modo natural a relação causal no discurso.
- source_word: לֹא בָּאתֶם עַד עָתָּה
  choice: vocês ainda não chegaram
  rationale: Expressa idiomaticamente em português a ação que não ocorreu até o momento presente; “chegaram” mantém o sentido amplo de בוא diante de um destino.
- source_word: הַמְּנוּחָה
  choice: o lugar de descanso
  rationale: מְנוּחָה pode indicar tanto o descanso como estado quanto um lugar de repouso; neste contexto de entrada na terra, o sentido concreto é favorecido.
- source_word: הַנַּחֲלָה
  choice: a herança
  rationale: Preserva a ideia da terra como posse concedida e destinada por Deus ao seu povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente no texto hebraico.
- source_word: נֹתֵן
  choice: está dando
  rationale: Reproduz o aspecto do particípio hebraico, apresentando a dádiva divina como em curso ou iminente.
- source_word: לָךְ
  choice: lhes
  rationale: O referente é o povo tratado no plural ao longo da frase; o pronome português torna explícita essa concordância contextual apesar da forma massorética singular nesta palavra.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de מְנוּחָה
  choice: lugar de descanso
  alternative: descanso
  rationale: O contexto geográfico favorece um destino concreto, mas a alternativa abstrata continua lexicalmente possível e é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês/lhes” para a segunda pessoa plural e mantém “Yahweh” como nome divino.
