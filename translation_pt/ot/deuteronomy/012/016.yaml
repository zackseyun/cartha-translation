  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: pt
  text: Mas não comam o sangue; derramem-no no chão como água.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Marca a restrição à permissão anterior e conserva de modo conciso a força exceptiva do hebraico.
- source_word: הַדָּם
  choice: o sangue
  rationale: Mantém o artigo hebraico e se refere especificamente ao sangue do animal abatido.
- source_word: לֹא תֹאכֵלוּ
  choice: não comam
  rationale: Expressa com clareza e naturalidade a proibição legal dirigida ao plural.
- source_word: עַל הָאָרֶץ
  choice: no chão
  rationale: Neste contexto de uma ação física concreta, אֶרֶץ designa o solo, e não a terra em sentido territorial ou cósmico.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: derramem-no
  rationale: Traduz o ato deliberado de verter o sangue e mantém explícita, pelo pronome, a referência ao sangue.
- source_word: כַּמָּיִם
  choice: como água
  rationale: Reproduz de forma idiomática e direta a comparação hebraica.
theological_decisions:
- issue: Tratamento do sangue na lei alimentar
  choice: Apresentar diretamente a proibição de consumir o sangue e a ordem de derramá-lo no chão.
  alternative: Acrescentar uma explicação simbólica ou ritual do sangue.
  rationale: O versículo formula uma instrução legal concreta; a tradução não deve inserir desenvolvimentos teológicos posteriores nem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com imperativos plurais naturais. “Somente” preserva a ligação restritiva com o contexto anterior; o ponto e vírgula mantém unidas as duas instruções.
