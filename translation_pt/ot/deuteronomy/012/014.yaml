source:
  edition: WLC
  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: pt
  text: mas somente no lugar que Yahweh escolher no território de uma das suas tribos.[a] Ali você oferecerá os seus holocaustos, e ali fará tudo o que eu lhe ordeno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “em uma das suas tribos”, isto é, dentro do território de uma das tribos de Israel.'
    reason: Nota cultural e esclarecimento da formulação espacial literal.
lexical_decisions:
- source_word: כִּי אִם
  choice: mas somente
  rationale: No contexto da proibição do versículo anterior, a expressão introduz a única exceção permitida e combina contraste com exclusividade.
- source_word: בַּמָּקוֹם
  choice: no lugar
  rationale: Designa o local específico de culto que seria escolhido por Deus; a formulação preserva a determinação do hebraico.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: que Yahweh escolher
  rationale: O yiqtol tem sentido prospectivo neste contexto, e o futuro do subjuntivo é a forma portuguesa natural após o relativo.
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: no território de uma das suas tribos
  rationale: O hebraico diz literalmente 'em uma das suas tribos', mas o sentido espacial é o território tribal; a explicitação evita sugerir que o lugar esteja dentro de um grupo de pessoas.
- source_word: שָׁם
  choice: ali
  rationale: A repetição foi mantida nas duas orações para enfatizar que os atos de culto devem ocorrer exclusivamente no lugar escolhido.
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: você oferecerá os seus holocaustos
  rationale: O hifil de עלה com עֹלָה é uma expressão sacrificial. 'Oferecer os seus holocaustos' é claro, corrente e preserva o termo técnico para a oferta inteiramente queimada.
- source_word: תַּעֲשֶׂה כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: fará tudo o que eu lhe ordeno
  rationale: Mantém a amplitude de עשה e traduz o particípio de modo natural como ordem vigente no discurso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Centralização do culto
  choice: manter a referência indefinida ao lugar que Yahweh escolher
  alternative: identificar explicitamente o lugar com Jerusalém
  rationale: O versículo não nomeia Jerusalém. A tradução preserva a formulação prospectiva e evita resolver no texto uma identificação histórica ou teológica posterior.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega 'você' por corresponder ao singular hebraico dirigido individualmente a Israel, sem perder o caráter coletivo do discurso. A repetição de 'ali' preserva a ênfase do original.
