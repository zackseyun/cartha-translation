  source_fidelity: A tradução preserva adequadamente a restrição de כִּי אִם (“mas somente”), o local definido escolhido por Yahweh, a localização em uma tribo/território tribal, a dupla ênfase de “ali”, os holocaustos e a abrangência de “tudo o que eu lhe ordeno”. O futuro do subjuntivo em “que Yahweh escolher” é natural e corresponde bem ao valor prospectivo do yiqtol hebraico.
  naturalness: O português é moderno, claro e digno. “No território de uma das suas tribos” explicita de maneira natural a referência espacial que está implícita na expressão hebraica literal; a nota informa essa formulação. O emprego de “você” e “lhe” é consistente e legível para o público-alvo.
