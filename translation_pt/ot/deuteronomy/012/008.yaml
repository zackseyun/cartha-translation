  text: לֹ֣א תַעֲשׂ֔וּ/ן כְּ֠/כֹל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַ/יּ֑וֹם אִ֖ישׁ כָּל הַ/יָּשָׁ֥ר בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: pt
  text: 'Não façam como estamos fazendo aqui hoje: cada um[a] faz tudo o que é certo aos seus próprios olhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cada homem”; a expressão é distributiva, indicando que cada pessoa age segundo o próprio julgamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: Não façam
  rationale: O imperfeito na segunda pessoa masculina plural sob negação expressa uma proibição ou instrução. O imperativo negativo é a forma mais natural de conservar essa força normativa em português.
- source_word: כְּכֹל אֲשֶׁר
  choice: como
  rationale: A construção comparativa indica a maneira de agir. “Como” transmite o sentido sem a rigidez de “conforme tudo o que”.
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: estamos fazendo aqui hoje
  rationale: O particípio descreve a prática em curso do grupo ao qual Moisés se associa; a locução progressiva comunica isso naturalmente.
- source_word: אִישׁ
  choice: cada um
  rationale: O substantivo masculino singular tem aqui valor distributivo. “Cada um” é natural em português e mantém a distribuição individual; a forma lexical mais explícita, “cada homem”, é registrada em nota.
- source_word: כָּל הַיָּשָׁר
  choice: tudo o que é certo
  rationale: A expressão designa aquilo que é reto ou correto segundo a avaliação de cada indivíduo. A tradução evita acrescentar “parece”, que tornaria explícita uma nuance apenas implícita.
- source_word: בְּעֵינָיו
  choice: aos seus próprios olhos
  rationale: Mantém o conhecido idioma hebraico de avaliação pessoal e sua tensão moral, com uma formulação corrente em português.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ ... בְּעֵינָיו
  choice: cada um ... aos seus próprios olhos
  alternative: cada homem ... aos seus próprios olhos
  rationale: “Cada um” conserva o singular distributivo em português natural, enquanto a nota informa que o hebraico emprega literalmente “cada homem”. Assim, não se perde a forma da fonte nem se restringe indevidamente a aplicação do enunciado.
- issue: Valor de כָּל הַיָּשָׁר בְּעֵינָיו
  choice: tudo o que é certo aos seus próprios olhos
  alternative: tudo o que lhe parece certo
  rationale: A tradução principal preserva o idioma concreto do hebraico e não resolve antecipadamente se a expressão descreve mera percepção subjetiva ou uma alegação de retidão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição verbal com o particípio (“cada um fazendo”) preserva a relação sintática entre a prática coletiva presente e a ação individual descrita na segunda metade do versículo.
