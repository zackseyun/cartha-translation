  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: pt
  text: Não faça assim para Yahweh, seu Deus[a], pois eles fizeram para seus deuses toda abominação que Yahweh odeia; chegaram até a queimar no fogo seus filhos e suas filhas para seus deuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não proceda assim para com Yahweh, seu Deus”.'
    reason: Alternativa mais formal para a construção לַיהוָה, mantendo aberta a amplitude relacional da preposição hebraica.
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן
  choice: Não faça o mesmo
  rationale: Preserva a proibição direta no singular e a referência retrospectiva à maneira de culto descrita no contexto anterior, em linguagem portuguesa natural.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: em honra de Yahweh, seu Deus
  rationale: A preposição ל indica aqui a orientação cultual do ato. “Em honra de” comunica esse sentido com clareza, sem substituir o nome divino Yahweh.
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: tudo o que é abominável para Yahweh e que ele odeia
  rationale: A formulação conserva tanto a relação da abominação com Yahweh quanto a declaração explícita de que ele a odeia, evitando o possível sentido possessivo e enganoso de “abominações de Yahweh” em português.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: praticaram, em honra de seus deuses
  rationale: “Praticaram” exprime atos cultuais estabelecidos; “em honra de” torna natural em português a orientação indicada por ל.
- source_word: כִּי גַם
  choice: chegam até
  rationale: Transmite a força explicativa e intensificadora da expressão, apresentando a queima dos filhos como o exemplo culminante e chocante.
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: seus filhos e suas filhas
  rationale: Mantém a menção explícita de descendentes de ambos os sexos, sem reduzi-la ao termo genérico “filhos” ou “crianças”.
- source_word: יִשְׂרְפוּ בָאֵשׁ
  choice: queimar no fogo
  rationale: Expressa diretamente a queima literal em fogo, preservando a gravidade concreta da prática.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” representa o nome pessoal da aliança sem o substituir por um título.
- issue: Força da avaliação divina em תּוֹעֵבָה e שָׂנֵא
  choice: abominável ... odeia
  alternative: detestável ... rejeita
  rationale: A tradução mantém a intensidade moral e cultual das duas expressões hebraicas, sem suavizá-las nem acrescentar uma interpretação doutrinária.
- issue: Singular da proibição dirigida a Israel
  choice: Não faça ... seu Deus
  alternative: Não façam ... seu Deus
  rationale: O hebraico emprega a segunda pessoa masculina singular na forma pactual de dirigir-se coletivamente a Israel; o português conserva esse singular sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação evita o possessivo potencialmente equívoco “abominações de Yahweh”, mas conserva a repetição semântica deliberada entre aquilo que é abominável para Yahweh e aquilo que ele odeia.
