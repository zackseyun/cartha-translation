revisions:
- from: Não faça o mesmo em honra de Yahweh, seu Deus[a], pois elas praticaram, em honra de seus deuses, tudo o que é abominável para Yahweh e que ele odeia; chegam até a queimar no fogo seus filhos e suas filhas em honra de seus deuses.
  to: Não faça assim para Yahweh, seu Deus[a], pois eles fizeram para seus deuses toda abominação que Yahweh odeia; chegaram até a queimar no fogo seus filhos e suas filhas para seus deuses.
  rationale: A revisão elimina o pronome feminino não exigido pelo hebraico, conserva as ações dos povos no passado e adota formulações portuguesas diretas que mantêm a orientação cultual de ל e a intensidade de תּוֹעֵבָה e שָׂנֵא. A nota permanece adequadamente ancorada e relevante para a primeira expressão preposicional.
