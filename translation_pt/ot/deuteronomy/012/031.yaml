    rationale: O hebraico traz um verbo plural sem especificar gênero. “Elas” depende de um antecedente contextual não expresso e pode soar incorreto ou obscuro em leitura isolada. “Eles” evita essa restrição indevida.
  - severity: medium
    issue: Mudança de tempo/aspecto em “chegam até a queimar”
    rationale: O hebraico descreve as práticas dos povos com formas perfectivas; “chegam” introduz presente. “Chegaram até a queimar” conserva a culminação enfática e a perspectiva passada.
  - severity: low
    issue: “Praticaram ... tudo o que é abominável” é menos direto
    rationale: O verbo עשה é “fazer”, e “toda abominação que Yahweh odeia” reproduz de modo mais claro a relação entre a abominação e a oração relativa.
