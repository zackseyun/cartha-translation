base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/018.yaml
  text: And at that time I commanded you all the things that you should do[a].
translation:
  language: pt
  text: Naquele tempo, ordenei a vocês tudo o que deveriam fazer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as palavras” ou “todos os assuntos”. O termo hebraico דְּבָרִים pode se referir tanto a instruções faladas quanto a assuntos ou a ações que se devem realizar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: ordenei
  rationale: O verbo צוה expressa uma ordem ou instrução dotada de autoridade; “ordenei” preserva essa força com naturalidade.
- source_word: אֶתְכֶם
  choice: a vocês
  rationale: O sufixo está na segunda pessoa masculina plural. “A vocês” torna explícito o plural em português corrente.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Expressão temporal idiomática que retoma o período mencionado no contexto.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: tudo
  rationale: דְּבָרִים pode significar palavras, coisas ou assuntos; no contexto, refere-se ao conjunto das determinações a serem cumpridas. “Tudo” comunica isso naturalmente sem eliminar as alternativas, registradas em nota.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: o que deveriam fazer
  rationale: A construção relativa descreve aquilo que os destinatários receberam a obrigação de cumprir. “Deveriam fazer” conserva a força diretiva sem intensificá-la indevidamente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem temporal foi mantida no início, e o plural dos destinatários foi explicitado por “a vocês”.
