  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: pt
  text: 'E vocês murmuraram em suas tendas e disseram: “Porque Yahweh nos odeia, ele nos tirou da terra do Egito para nos entregar nas mãos dos amorreus[a] e nos destruir.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “para nos dar na mão do amorreu”; aqui, “o amorreu” é uma designação coletiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: murmuraram
  rationale: Expressa a queixa descontente e murmurada indicada pelo verbo, em linguagem bíblica ainda corrente e compreensível.
- source_word: בְאָהֳלֵיכֶם
  choice: em suas tendas
  rationale: Preserva de modo direto a localização concreta no contexto do deserto.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: Porque Yahweh nos odeia
  rationale: Traduz de forma idiomática a construção causal com o substantivo 'ódio', mantendo-a como acusação proferida pelo povo, não como afirmação do narrador.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: ele nos tirou da terra do Egito
  rationale: Reflete claramente o verbo de saída e conserva a expressão explícita 'terra do Egito'.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: para nos entregar nas mãos dos amorreus
  rationale: Comunica naturalmente o idioma hebraico de entregar alguém ao poder de outro; o singular coletivo hebraico é vertido pelo plural étnico usual em português.
- source_word: לְהַשְׁמִידֵנוּ
  choice: e nos destruir
  rationale: Mantém a força do verbo hebraico sem intensificação interpretativa desnecessária; a coordenação em português expressa naturalmente o propósito consecutivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o Tetragrama como nome próprio. A transliteração 'Yahweh' preserva esse nome sem substituí-lo por um título.
- issue: Atribuição de ódio a Yahweh
  choice: 'manter a fala direta: “Porque Yahweh nos odeia”'
  alternative: amenizar para “Porque Yahweh não nos ama” ou reformular como fato narrativo
  rationale: A declaração é a acusação do povo dentro do discurso citado. Preservar sua formulação forte mantém a tensão teológica e não a endossa como avaliação do narrador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Murmuraram” conserva a nuance de queixa em voz baixa; “nos entregar nas mãos” torna natural o idioma hebraico sem perder sua imagem. O marcador [a] aparece no texto principal.
