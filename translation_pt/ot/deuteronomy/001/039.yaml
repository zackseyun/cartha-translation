source:
  edition: WLC
  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: pt
  text: 'E os seus pequeninos, dos quais vocês disseram: “Serão levados como despojo”[a], e os seus filhos, que hoje não sabem distinguir entre o bem e o mal[b], esses entrarão ali. A eles darei a terra, e eles tomarão posse dela[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão presa” ou “serão tomados como espólio”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica indica falta de discernimento maduro.
    reason: cultural_note
  - marker: c
    text: 'Ou: “eles a herdarão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: os seus pequeninos
  rationale: טַף designa sobretudo crianças pequenas e ressalta sua vulnerabilidade no contexto; “pequeninos” preserva essa nuance e evita confundi-lo com o termo seguinte, בְנֵיכֶם.
- source_word: לָבַז יִהְיֶה
  choice: serão levados como despojo
  rationale: בַּז é aquilo que um inimigo toma como despojo. A formulação portuguesa expressa naturalmente o destino temido pelos israelitas sem sugerir que as crianças se tornariam objetos inanimados.
- source_word: בְנֵיכֶם
  choice: os seus filhos
  rationale: Embora o substantivo seja morfologicamente masculino, בנים pode abranger os descendentes ou filhos da geração seguinte. “Filhos” é formalmente próximo e, em português, pode ter referência coletiva.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: que hoje não sabem distinguir entre o bem e o mal
  rationale: A tradução explicita com naturalidade a ideia idiomática de falta de discernimento maduro, sem transformá-la numa afirmação doutrinária sobre inocência ou responsabilidade moral.
- source_word: שָׁמָּה
  choice: entrarão ali
  rationale: Com o verbo de movimento, “ali” aponta naturalmente para a terra mencionada no contexto; “entrarão” comunica a direção para dentro dela.
- source_word: אֶתְּנֶנָּה
  choice: A eles darei a terra
  rationale: O sufixo feminino singular retoma a terra. Tornar o referente explícito evita ambiguidade em português e preserva o destinatário indicado por לָהֶם.
- source_word: יִירָשׁוּהָ
  choice: eles tomarão posse dela
  rationale: ירשׁ neste contexto descreve receber e ocupar a terra. “Tomarão posse” preserva esse sentido amplo sem decidir exclusivamente entre herdar, possuir e desapossar.
theological_decisions:
- issue: O estado moral da nova geração na expressão “não sabem o bem e o mal”
  choice: Traduzir como falta de discernimento entre o bem e o mal
  alternative: Entender como declaração de inocência moral ou de ausência de responsabilidade pactual
  rationale: O idioma hebraico descreve imaturidade de discernimento, mas não resolve por si só debates posteriores sobre inocência ou idade de responsabilidade; a tradução evita importar essas conclusões.
- issue: A nuance de ירשׁ em relação à terra prometida
  choice: tomar posse dela
  alternative: herdá-la
  rationale: “Tomar posse” conserva a dimensão concreta de entrada e ocupação, enquanto “herdar” salientaria mais diretamente a concessão pactual. A nota registra essa alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto torna clara a lembrança da alegação do povo. “Vocês” evita o regionalismo de “vós”; “pequeninos” mantém a vulnerabilidade de טף; e a terra é explicitada para clareza referencial.
