base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: pt
  text: Yahweh, o Deus de vocês, que vai adiante de vocês, ele mesmo lutará por vocês, assim como fez por vocês[a] no Egito, diante dos seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “fez com vocês”. No contexto, a expressão se refere ao que Yahweh fez em favor de Israel no Egito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, o Deus de vocês
  rationale: Preserva o nome divino pessoal e traduz אֱלֹהֵיכֶם no singular exigido pelo contexto, com formulação clara em português.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: que vai adiante de vocês
  rationale: O particípio expressa ação contínua ou característica; a formulação comunica naturalmente a liderança divina.
- source_word: הוּא יִלָּחֵם לָכֶם
  choice: ele mesmo lutará por vocês
  rationale: “Ele mesmo” preserva a ênfase do pronome independente הוּא, e “lutará por vocês” expressa o sentido benefactivo de לָכֶם.
- source_word: כְּכֹל אֲשֶׁר
  choice: assim como
  rationale: Transmite de modo idiomático a comparação com a atuação anterior de Deus.
- source_word: עָשָׂה אִתְּכֶם
  choice: fez por vocês
  rationale: Embora a construção hebraica diga literalmente “fez com vocês”, o contexto aponta para a ação de Deus em benefício de Israel; a alternativa literal é preservada em nota.
- source_word: בְּמִצְרַיִם לְעֵינֵיכֶם
  choice: no Egito, diante dos seus olhos
  rationale: Mantém tanto o valor locativo quanto o idioma visual que salienta que Israel testemunhou os atos de Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o preserva sem substituí-lo por um título.
- issue: Agência divina enfática em הוּא יִלָּחֵם
  choice: ele mesmo lutará
  alternative: ele lutará
  rationale: A tradução explícita da ênfase conserva a afirmação de que o próprio Yahweh agirá em favor de Israel.
- issue: Sentido de עָשָׂה אִתְּכֶם
  choice: fez por vocês
  alternative: fez com vocês
  rationale: A leitura contextual expressa benefício sem apagar a forma incomum do hebraico, registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. A repetição de “vocês” acompanha a ênfase do original sem tornar a frase obscura; “ele mesmo” conserva a força enfática do hebraico.
