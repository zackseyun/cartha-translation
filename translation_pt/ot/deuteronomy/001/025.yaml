base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: pt
  text: 'Eles tomaram em suas mãos alguns dos frutos da terra e os trouxeram para baixo até nós. Deram-nos um relato[a] e disseram: “A terra que Yahweh, nosso Deus, está nos dando é boa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos trouxeram uma notícia”; literalmente, “nos trouxeram de volta uma palavra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: Eles pegaram nas mãos
  rationale: Preserva tanto o sentido narrativo comum de לקח quanto a imagem concreta de carregar os frutos nas mãos.
- source_word: מִפְּרִי הָאָרֶץ
  choice: alguns frutos da terra
  rationale: 'Expressa o valor partitivo de מִן: tratava-se de uma amostra dos produtos da terra, não de toda a sua produção.'
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: os trouxeram até nós
  rationale: Comunica naturalmente em português o movimento causativo de ירד. A nuance literal de descida é registrada em nota, pois 'trouxeram-nos para baixo' seria pouco natural e potencialmente ambíguo.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: nos deram um relato
  rationale: Traduz o idiomatismo hebraico de voltar com uma palavra ou informação, evitando um decalque pouco natural em português.
- source_word: טוֹבָה הָאָרֶץ
  choice: É boa a terra
  rationale: Mantém a avaliação ampla e positiva de טוֹבָה e conserva a ênfase inicial do predicativo no hebraico.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, nosso Deus
  rationale: Translitera o nome divino e traduz diretamente a expressão pactual אֱלֹהֵינוּ.
- source_word: נֹתֵן לָנוּ
  choice: está nos dando
  rationale: O presente progressivo representa bem o particípio hebraico como ação divina em curso ou iminente e inclui naturalmente o beneficiário explícito.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. A transliteração 'Yahweh' preserva o nome próprio sem substituí-lo por um título.
- issue: Aspecto de נֹתֵן na concessão da terra
  choice: está nos dando
  alternative: nos dá; nos dará
  rationale: Mantém a apresentação da dádiva como vigente ou em processo, sem convertê-la exclusivamente em afirmação habitual ou promessa futura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'frutos' é idiomático para uma amostra variada da produção da terra. A direção descendente contida em וַיּוֹרִדוּ foi priorizada na análise, mas não explicitada no corpo por soar artificial sem contexto topográfico suficiente.
