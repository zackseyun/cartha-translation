- from: 'Eles pegaram nas mãos alguns frutos da terra e os trouxeram até nós. Então nos deram um relato[a] e disseram: “É boa a terra que Yahweh, nosso Deus, está nos dando”.'
  to: 'Eles tomaram em suas mãos alguns dos frutos da terra e os trouxeram para baixo até nós. Deram-nos um relato[a] e disseram: “A terra que Yahweh, nosso Deus, está nos dando é boa.”'
  rationale: A revisão explicita «para baixo», correspondente a וַיּוֹרִדוּ, aprimora a expressão portuguesa da ação de tomar os frutos nas mãos e ajusta a nota para representar com maior precisão o idiomatismo שוב + דבר. A ordem mais corrente na declaração final mantém integralmente a avaliação positiva da terra e a concessão divina em curso.
