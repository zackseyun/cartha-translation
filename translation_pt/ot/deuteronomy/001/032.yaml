base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/032.yaml
  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: pt
  text: Contudo, nesse assunto, vocês não confiaram no SENHOR, seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês não creram no SENHOR, seu Deus”; também é possível: “vocês não acreditaram no SENHOR, seu Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: Contudo, nesse assunto
  rationale: דָּבָר designa aqui o assunto ou acontecimento recém-narrado, não apenas uma palavra falada. A conjunção ו recebe valor levemente adversativo no contexto da repreensão; “nesse assunto” retoma de modo natural o que precede.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: vocês não confiaram
  rationale: A negação com o particípio hifil de אמן descreve a postura de incredulidade dos israelitas. Com בְּ e uma pessoa como objeto, “confiar em” comunica naturalmente em português tanto a falta de fé quanto a recusa em se apoiar na promessa divina.
- source_word: בַּ/יהוָה
  choice: no SENHOR
  rationale: A preposição בְּ é preservada idiomaticamente em “confiar no”. O nome divino יהוה é representado pela forma tradicional “SENHOR” em versaletes.
- source_word: אֱלֹהֵי/כֶם
  choice: seu Deus
  rationale: O construto com sufixo de segunda pessoa masculina plural é traduzido diretamente, preservando a relação de aliança. Em português, “vocês... seu Deus” é natural e amplamente compreensível.
theological_decisions:
- issue: Sentido de אמן + ב com referência ao SENHOR
  choice: confiaram no SENHOR, seu Deus
  alternative: creram no SENHOR, seu Deus; acreditaram no SENHOR, seu Deus
  rationale: A construção hebraica abrange crer e confiar. “Confiaram” expressa com clareza a dimensão relacional e a recusa de Israel em se apoiar na palavra e no cuidado do SENHOR, sem excluir o sentido de acreditar; as alternativas são registradas em nota para preservar a amplitude lexical.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa plural. “Contudo” mantém a força de repreensão sem soar arcaico. A pontuação separa o aposto “seu Deus” e evita ambiguidade.
