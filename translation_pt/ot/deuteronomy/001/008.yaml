  source_fidelity: A tradução reproduz adequadamente a convocação, a terra posta diante do povo, a entrada e tomada de posse, o juramento de Yahweh aos patriarcas e a extensão da promessa à descendência. Contudo, a construção final do texto corrente torna sintaticamente incerta a relação entre «jurou dar aos seus pais» e «a eles e à sua descendência».
  naturalness: «Vejam», «pus diante de vocês», «Entrem» e «tomem posse» são naturais em português moderno e adequados ao registro. A oração final precisa ser reordenada para que a promessa de dar a terra aos patriarcas e à sua descendência seja imediatamente clara.
  terminology: «Yahweh», «pais», os nomes Abraão, Isaque e Jacó, e «descendência» são escolhas adequadas e fiéis. «Descendência» conserva bem o valor coletivo de זַרְעָם.
