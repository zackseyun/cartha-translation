source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: pt
  text: 'Vejam[a]: pus diante de vocês a terra. Entrem e tomem posse[b] da terra que Yahweh jurou dar a seus pais[c] — Abraão, Isaque e Jacó — e à descendência deles depois deles[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Olhem” ou “Eis”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “possuam”; o verbo hebraico também pode ter o sentido de herdar ou tomar posse.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “seus pais”, referindo-se especificamente a Abraão, Isaque e Jacó.'
    reason: alternative_reading
  - marker: d
    text: 'Ou: “à sua semente depois deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Vejam
  rationale: O imperativo hebraico está morfologicamente no singular, pois Moisés se dirige a Israel como unidade coletiva; em português, o plural naturaliza a referência imediata ao povo indicada por «diante de vocês», sem perder a força de chamar a atenção.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: pus diante de vocês
  rationale: A construção com נתן e לִפְנֵי expressa colocar ou disponibilizar algo diante de alguém. O perfeito é representado pelo pretérito «pus», apresentando a terra como já posta à disposição deles.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto, אֶרֶץ designa a terra prometida; «terra» é a forma consagrada, clara e semanticamente ampla em português.
- source_word: בֹּאוּ
  choice: Entrem
  rationale: O imperativo plural indica ingresso na terra. «Entrem» comunica diretamente o movimento para dentro dela.
- source_word: וּרְשׁוּ
  choice: tomem posse
  rationale: ירשׁ pode envolver possuir, herdar ou, em contexto de conquista, tomar posse. A formulação mantém tanto a ação requerida quanto a ideia de posse concedida.
- source_word: נִשְׁבַּע יְהוָה
  choice: Yahweh jurou
  rationale: O verbo é vertido de modo direto, e o nome próprio da aliança יְהוָה é transliterado como «Yahweh».
- source_word: לַאֲבֹתֵיכֶם
  choice: aos seus pais
  rationale: O substantivo masculino plural é preservado, e a aposição identifica explicitamente esses pais como Abraão, Isaque e Jacó.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: a Abraão, a Isaque e a Jacó
  rationale: A repetição da preposição reproduz o ritmo e a ênfase do hebraico sem prejudicar a naturalidade em português.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: dar aos seus pais ... a eles e à sua descendência depois deles
  rationale: A disposição da frase em português deixa claro que a promessa consiste em dar a terra tanto aos patriarcas quanto à descendência coletiva posterior; «descendência» preserva o valor coletivo singular de זֶרַע.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama como nome próprio. «Yahweh» preserva de modo transparente o nome da aliança sem substituí-lo por um título.
- issue: Sentido de אֲבֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A forma hebraica é masculina, e a sequência especifica Abraão, Isaque e Jacó. «Pais» conserva essa particularidade textual.
- issue: Alcance de זַרְעָם
  choice: sua descendência
  alternative: sua semente; seus descendentes
  rationale: «Descendência» mantém o caráter coletivo e potencialmente singular de זֶרַע, sem impor aqui uma interpretação teológica mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para a segunda pessoa plural e conserva «Yahweh» como nome próprio. A pontuação destaca a convocação inicial e a aposição dos patriarcas.
