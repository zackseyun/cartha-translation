  text: וָ/אֶקַּ֞ח אֶת רָאשֵׁ֣י שִׁבְטֵי/כֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽ/ידֻעִ֔ים וָ/אֶתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עֲלֵי/כֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְ/שָׂרֵ֣י מֵא֗וֹת וְ/שָׂרֵ֤י חֲמִשִּׁים֙ וְ/שָׂרֵ֣י עֲשָׂרֹ֔ת וְ/שֹׁטְרִ֖ים לְ/שִׁבְטֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: pt
  text: 'Então tomei os chefes das suas tribos, homens sábios e reconhecidos[a], e os coloquei como líderes sobre vocês: chefes de grupos de mil, de cem, de cinquenta e de dez, além de oficiais para as suas tribos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entendidos” ou “conhecedores”. O termo hebraico significa literalmente pessoas conhecidas ou reconhecidas, mas também pode indicar homens reconhecidos por seu conhecimento ou discernimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Então tomei
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência com naturalidade.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: os chefes das suas tribos
  rationale: “Chefes” conserva a metáfora de רֹאשׁ aplicada a pessoas que ocupam posição de liderança tribal.
- source_word: אֲנָשִׁים חֲכָמִים וִידֻעִים
  choice: homens sábios e reconhecidos
  rationale: “Homens” mantém a referência masculina explícita; “sábios” traduz חֲכָמִים, e “reconhecidos” reflete a forma passiva de ידע sem eliminar a possível nuance de conhecimento ou competência.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: e os coloquei como líderes sobre vocês
  rationale: נתן neste padrão indica designação para uma função. “Líderes” comunica de modo natural a função expressa pela repetição de רֹאשׁ, evitando a expressão pouco idiomática “cabeças sobre vocês”.
- source_word: שָׂרֵי אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: chefes de grupos de mil, de cem, de cinquenta e de dez
  rationale: שָׂרֵי designa autoridades responsáveis por unidades organizadas. A inclusão de “grupos” deixa claro que os números indicam escalões administrativos ou militares.
- source_word: וְשֹׁטְרִים לְשִׁבְטֵיכֶם
  choice: além de oficiais para as suas tribos
  rationale: שֹׁטְרִים refere-se a oficiais subordinados com funções administrativas; לְ indica sua designação em benefício ou no âmbito das tribos.
