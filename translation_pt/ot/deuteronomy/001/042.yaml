  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: pt
  text: 'E Javé me disse: “Diga-lhes: Não subam nem lutem, pois não estou no meio de vocês; caso contrário, vocês serão derrotados diante dos seus inimigos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que não sejam derrotados diante dos seus inimigos”.'
    reason: A oração hebraica pode ser vertida como uma consequência advertida (“caso contrário”) ou, de modo mais próximo da forma negativa, como a consequência a evitar.
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para representar o nome divino YHWH, preservando-o como nome próprio.
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: me disse
  rationale: Forma narrativa natural em português para introduzir a fala dirigida a Moisés.
- source_word: אֱמֹר לָהֶם
  choice: Diga-lhes
  rationale: Equivalente direto e idiomático do imperativo hebraico seguido do objeto indireto.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: Não subam nem lutem
  rationale: Preserva as duas proibições coordenadas de modo claro e natural; “subir” mantém a perspectiva geográfica e militar do contexto.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: pois não estou no meio de vocês
  rationale: Reproduz de perto a expressão hebraica “no meio de vocês”, mantendo o tema da presença divina sem explicá-lo além do texto.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: para que não sejam derrotados
  rationale: Expressa em português a consequência que a proibição procura evitar. O verbo passivo נגף pode indicar ser golpeado, vencido ou derrotado; o contexto militar favorece “derrotados”.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: diante dos seus inimigos
  rationale: Mantém o idioma hebraico e comunica claramente uma derrota em confronto com os inimigos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR; Iahweh
  rationale: O texto hebraico traz o nome próprio YHWH. “Javé” o preserva como nome e é uma forma portuguesa reconhecível, sem substituí-lo por um título.
- issue: Relação sintática da cláusula וְלֹא תִּנָּגְפוּ
  choice: para que não sejam derrotados
  alternative: senão vocês serão derrotados; e não sejam derrotados
  rationale: No contexto, Javé ordena que o povo não avance porque sua ausência os exporia à derrota. A formulação escolhida expressa a consequência a ser evitada, enquanto a nota registra a possível leitura mais explícita como advertência.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural, adequado à leitura brasileira e compreensível internacionalmente. A fala dentro da fala foi marcada com aspas simples para deixar clara a estrutura do discurso.
