  text: הָב֣וּ לָ֠/כֶם אֲנָשִׁ֨ים חֲכָמִ֧ים וּ/נְבֹנִ֛ים וִ/ידֻעִ֖ים לְ/שִׁבְטֵי/כֶ֑ם וַ/אֲשִׂימֵ֖/ם בְּ/רָאשֵׁי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: pt
  text: Escolham para vocês homens sábios, prudentes e reconhecidos entre as suas tribos[a], e eu os nomearei como seus chefes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conhecidos por suas tribos”; o hebraico pode destacar homens de reputação estabelecida entre o povo.
    reason: lexical_alternative
  - marker: b
    text: Ou “líderes”. Literalmente, “como suas cabeças”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Escolham para vocês
  rationale: Neste contexto, a ordem não pede simplesmente que tragam ou deem homens, mas que os escolham para representá-los; “para vocês” preserva o valor do dativo לָכֶם.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: O substantivo é masculino plural e, neste contexto, designa os homens que exerceriam funções de liderança nas tribos.
- source_word: חֲכָמִים
  choice: sábios
  rationale: Refere-se à sabedoria e ao bom juízo necessários para liderar e julgar, não apenas a uma habilidade técnica.
- source_word: וּנְבֹנִים
  choice: prudentes
  rationale: O termo ligado à raiz בין expressa compreensão perceptiva e capacidade de julgar; “prudentes” comunica esse discernimento prático em português corrente.
- source_word: וִידֻעִים לְשִׁבְטֵיכֶם
  choice: reconhecidos em suas tribos
  rationale: O particípio passivo de ידע indica homens conhecidos ou de reputação estabelecida entre as respectivas tribos. A formulação mantém a ligação natural entre “reconhecidos” e “suas tribos”.
- source_word: וַאֲשִׂימֵם
  choice: eu os colocarei
  rationale: A forma apresenta a ação consequente de Moisés depois da escolha feita pelo povo. “Colocarei” preserva de modo natural a imagem verbal, com sentido contextual de designação.
- source_word: בְּרָאשֵׁיכֶם
  choice: como chefes de vocês
  rationale: רֹאשׁ significa literalmente “cabeça”, mas aqui funciona como metáfora de autoridade. “Chefes” comunica claramente a função de liderança sem obscurecer o sentido.
theological_decisions:
- issue: Termo masculino אֲנָשִׁים para a liderança tribal
  choice: homens
  alternative: pessoas
  rationale: O hebraico emprega explicitamente o masculino plural no contexto da nomeação dos dirigentes tribais; a tradução conserva esse dado em vez de neutralizá-lo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Prudentes” evita o tom excessivamente técnico de “dotados de discernimento”, e “chefes” expressa naturalmente a metáfora hebraica de liderança, preservada em nota.
