    issue: Ambiguidade em «reconhecidos em suas tribos».
    rationale: O possessivo pode ser lido como referente aos homens («as tribos deles»), enquanto o hebraico se dirige ao povo («suas tribos»). «Entre as suas tribos» torna a relação pretendida mais clara.
  - severity: low
    issue: «Eu os colocarei» é pouco específico para o ato de investidura.
    rationale: וַאֲשִׂימֵם, neste contexto de seleção de dirigentes, tem sentido de estabelecer ou nomear. «Eu os nomearei» exprime melhor a ação sem acrescentar conteúdo.
  revised_text: Escolham para vocês homens sábios, prudentes e reconhecidos entre as suas tribos[a], e eu os nomearei como seus chefes[b].
