  text: יְהוֹשֻׁ֤עַ בִּן נוּן֙ הָ/עֹמֵ֣ד לְ/פָנֶ֔י/ךָ ה֖וּא יָ֣בֹא שָׁ֑מָּ/ה אֹת֣/וֹ חַזֵּ֔ק כִּי ה֖וּא יַנְחִלֶ֥/נָּה אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: pt
  text: Josué, filho de Num, que está diante de você, é ele quem entrará lá. Fortaleça-o, pois ele fará Israel herdar essa terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “ele dará essa terra a Israel como herança” ou “ele repartirá essa terra entre os israelitas”.
    reason: alternativa lexical para o hifil de נחל
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português; a vírgula torna natural a construção patronímica.
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: que está diante de você
  rationale: Conserva a imagem literal de estar diante de Moisés sem adotar a interpretação mais específica de que Josué o serve.
- source_word: הוּא יָבֹא שָׁמָּה
  choice: é ele quem entrará lá
  rationale: A construção enfática representa o pronome הוּא, enquanto “entrará lá” expressa o movimento para dentro da terra mencionada no contexto.
- source_word: אֹתוֹ חַזֵּק
  choice: Fortaleça-o
  rationale: Mantém a amplitude do imperativo, que pode envolver dar força, apoio e ânimo, sem reduzi-lo apenas ao encorajamento verbal.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a razão da ordem dada a Moisés.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: ele fará Israel herdar essa terra
  rationale: Preserva o valor causativo do hifil de נחל e explicita o referente do sufixo feminino, a terra, de maneira clara em português.
theological_decisions:
- issue: Referente do sufixo feminino em יַנְחִלֶנָּה
  choice: “essa terra”, isto é, a terra prometida a Israel
  alternative: 'Deixar o objeto menos explícito: “ele fará Israel herdar”'
  rationale: O contexto imediato trata da entrada na terra e de sua posse. Explicitar “essa terra” esclarece o referente pronominal hebraico sem acrescentar uma afirmação teológica nova.
- issue: Amplitude do papel de Josué no hifil de נחל
  choice: “fará Israel herdar”
  alternative: “dará essa terra a Israel como herança” ou “repartirá essa terra entre os israelitas”
  rationale: A formulação principal mantém a causalidade do hebraico sem decidir se o foco recai na concessão da terra ou em sua distribuição entre as tribos.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. “Você” evita arcaísmo, enquanto “diante de” e “pois” preservam o tom elevado. A repetição enfática em “é ele quem” reflete a ênfase do hebraico.
