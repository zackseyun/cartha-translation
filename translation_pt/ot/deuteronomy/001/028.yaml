  text: אָנָ֣ה אֲנַ֣חְנוּ עֹלִ֗ים אַחֵי/נוּ֩ הֵמַ֨סּוּ אֶת לְבָבֵ֜/נוּ לֵ/אמֹ֗ר עַ֣ם גָּד֤וֹל וָ/רָם֙ מִמֶּ֔/נּוּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצוּרֹ֖ת בַּ/שָּׁמָ֑יִם וְ/גַם בְּנֵ֥י עֲנָקִ֖ים רָאִ֥ינוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: pt
  text: '“Para onde estamos subindo? Nossos irmãos fizeram nosso coração derreter[a], dizendo: ‘O povo é maior e mais alto do que nós; as cidades são grandes e fortificadas até os céus[b]; além disso, vimos ali os descendentes de Anaque[c]’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeram derreter o nosso coração”; isto é, “tiraram a nossa coragem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “fortificadas nos céus”, expressão hiperbólica para fortificações extremamente altas.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “os anaquins”; literalmente, “os filhos de Anaque”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: Para onde estamos subindo?
  rationale: Mantém a pergunta de destino e o sentido participial de עלה, que descreve a subida rumo à região montanhosa da terra.
- source_word: אַחֵינוּ
  choice: Nossos irmãos
  rationale: Conserva a forma masculina plural e a força retórica do hebraico, referindo-se aos israelitas que haviam explorado a terra.
- source_word: הֵמַסּוּ אֶת לְבָבֵנוּ
  choice: fizeram nosso coração derreter
  rationale: Preserva a imagem vívida do hebraico para a perda de coragem, sem reduzir a expressão simplesmente a ‘desanimaram’.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: O povo é maior e mais alto do que nós
  rationale: Expressa tanto o tamanho ou poder indicado por גָּדוֹל quanto a estatura indicada por רָם.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: as cidades são grandes e fortificadas até os céus
  rationale: Mantém a linguagem hiperbólica e a imagem bíblica de fortificações de altura impressionante.
- source_word: וְגַם
  choice: além disso
  rationale: Comunica naturalmente o acréscimo de mais um detalhe alarmante.
- source_word: בְּנֵי עֲנָקִים
  choice: os descendentes de Anaque
  rationale: Identifica em português corrente o grupo associado a Anaque, preservando a relação de descendência expressa por בְּנֵי.
- source_word: רָאִינוּ שָׁם
  choice: vimos ali
  rationale: O pretérito perfeito traduz naturalmente o relato de algo observado durante a exploração.
