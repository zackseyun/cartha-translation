  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: pt
  text: 'Naquele tempo, ordenei aos seus juízes: “Ouçam as causas[a] entre seus irmãos e julguem com justiça[b] entre um homem e seu irmão, e entre ele e o estrangeiro residente[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ouçam as disputas entre seus irmãos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “julguem com retidão” ou “julguem de maneira justa”. O hebraico usa o substantivo צֶדֶק (tsédeq), que, em contextos judiciais, pode transmitir tanto a ideia de retidão quanto a de justiça.
    reason: lexical_alternative
  - marker: c
    text: Ou “o imigrante residente” ou “o estrangeiro que reside entre eles”. O hebraico גֵּר (ger) designa um não nativo estabelecido entre Israel. O sufixo indica sua associação com o homem mencionado no caso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: ordenei
  rationale: O verbo צוה expressa uma ordem ou incumbência dada com autoridade; “ordenei” é direto e natural neste contexto.
- source_word: שֹׁפְטֵיכֶם
  choice: seus juízes
  rationale: O substantivo designa os responsáveis por decidir questões judiciais; “juízes” é o equivalente português mais claro.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: A expressão temporal remete ao período anteriormente narrado; “naquele tempo” preserva essa referência de modo idiomático.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: Ouçam as causas entre seus irmãos
  rationale: שׁמע tem aqui força imperativa e sentido forense de dar audiência. “Ouçam as causas” explicita naturalmente o contexto judicial sem alterar seu conteúdo.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: e julguem com justiça
  rationale: צֶדֶק, empregado adverbialmente no contexto judicial, abrange retidão e justiça. “Com justiça” é natural em português e conserva a dimensão moral e jurídica.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: entre um homem e seu irmão
  rationale: A tradução mantém a formulação concreta e a linguagem de parentesco do hebraico, sem reduzi-la a uma expressão genérica.
- source_word: גֵּרוֹ
  choice: o estrangeiro residente que vive com ele
  rationale: גֵּר indica um não israelita estabelecido entre o povo e amparado por sua ordem jurídica. A formulação comunica tanto sua condição estrangeira quanto sua residência, e representa o sufixo pronominal por “com ele”.
theological_decisions:
- issue: Linguagem masculina de parentesco em אֲחֵיכֶם e אָחִיו
  choice: seus irmãos / seu irmão
  alternative: seus compatriotas / seu próximo
  rationale: A linguagem de parentesco apresenta os membros de Israel como irmãos e possui força representativa no contexto jurídico. Mantê-la preserva a textura comunitária do hebraico sem restringir silenciosamente a aplicação apenas aos homens.
- issue: Sentido de צֶדֶק no contexto judicial
  choice: com justiça
  alternative: com retidão / de maneira justa
  rationale: O termo pode expressar tanto justiça quanto retidão. No contexto forense, “com justiça” é a formulação portuguesa mais natural, sem eliminar a dimensão moral do termo.
- issue: Condição jurídica e social do גֵּר
  choice: estrangeiro residente
  alternative: imigrante residente / estrangeiro que reside entre vocês
  rationale: O termo se refere a um não nativo estabelecido entre Israel, não simplesmente a um viajante. “Estrangeiro residente” preserva conjuntamente sua origem externa e sua residência na comunidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. A sintaxe preserva a solenidade do discurso legal sem recorrer a formas arcaicas; os marcadores foram colocados junto às expressões a que cada nota se refere.
