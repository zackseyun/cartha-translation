base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: pt
  text: Que Yahweh, o Deus de seus pais, os torne mil vezes mais numerosos do que são e os abençoe, conforme lhes disse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme lhes prometeu”. O hebraico diz literalmente “conforme lhes falou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: o Deus de seus pais
  rationale: Mantém a formulação hebraica e sua ligação histórico-pactual com os antepassados de Israel.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: os torne mil vezes mais numerosos do que são
  rationale: Expressa em português natural o desejo de que Deus multiplique o número atual do povo, preservando o multiplicador explícito.
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: e os abençoe
  rationale: Continua naturalmente o valor desiderativo da primeira oração.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: conforme lhes falou
  rationale: Preserva o sentido amplo e literal de דבר, sem restringi-lo silenciosamente a uma promessa.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome pactual; a transliteração o distingue de títulos divinos.
- issue: Referência ancestral em אֲבֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A forma masculina literal é mantida por seu valor histórico e pactual, enquanto a alternativa idiomática é registrada em nota.
- issue: Valor de דִּבֶּר no contexto da bênção
  choice: lhes falou
  alternative: lhes prometeu
  rationale: O verbo significa literalmente falar; embora o contexto possa implicar promessa, a tradução principal preserva a amplitude e a tensão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal e a concordância mantêm o discurso dirigido ao povo no plural; a construção evita o pouco natural “acrescente sobre vocês” sem perder a ideia hebraica de aumento.
