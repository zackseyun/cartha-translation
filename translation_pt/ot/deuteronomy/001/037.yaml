  text: גַּם בִּ/י֙ הִתְאַנַּ֣ף יְהוָ֔ה בִּ/גְלַלְ/כֶ֖ם לֵ/אמֹ֑ר גַּם אַתָּ֖ה לֹא תָבֹ֥א שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: pt
  text: 'Yahweh também se irou contra mim por causa de vocês[a], dizendo: “Você também não entrará ali”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh também ficou irado comigo por causa de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: Compare Números 20:12, onde a proibição de Moisés de entrar na terra está ligada à sua falha em Meribá; aqui, Deuteronômio enfatiza o papel do povo no ocorrido.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: também
  rationale: A partícula aparece duas vezes e expressa adição com leve ênfase; “também” preserva naturalmente sua força cumulativa.
- source_word: בִּי
  choice: contra mim
  rationale: Com הִתְאַנַּף, a preposição בְּ marca o alvo da ira. “Contra mim” reproduz com clareza essa relação e evita uma formulação excessivamente coloquial.
- source_word: הִתְאַנַּף
  choice: se irou
  rationale: O hitpael de אנף indica irar-se ou ficar indignado. “Se irou” é digno, compreensível e mantém o peso do verbo sem exagerá-lo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בִּגְלַלְכֶם
  choice: por causa de vocês
  rationale: A expressão indica causa ou motivo. “Por causa de vocês” é direta, natural e mantém a responsabilidade coletiva indicada pela forma plural.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o conteúdo da fala divina; “dizendo” corresponde à construção hebraica e funciona naturalmente em português.
- source_word: גַּם אַתָּה
  choice: você também
  rationale: O pronome é masculino singular e se dirige a Moisés. A combinação preserva a ênfase aditiva sem inserir “você mesmo”, que seria mais forte.
- source_word: לֹא תָבֹא
  choice: não entrará
  rationale: Neste contexto, בוא se refere à entrada na terra prometida. O futuro “não entrará” comunica adequadamente a declaração divina.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio aponta para a terra já mencionada. “Ali” preserva seu valor dêitico e soa natural no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Causa da ira contra Moisés e de sua exclusão
  choice: Manter no texto principal a afirmação de que Yahweh se irou contra Moisés por causa do povo.
  alternative: Atribuir toda a culpa ao povo; ou harmonizar explicitamente o versículo com a falha do próprio Moisés em Meribá.
  rationale: Deuteronômio 1:37 enfatiza o papel do povo, enquanto Números 20:12 relaciona a exclusão de Moisés à falha dele. A tradução preserva essa tensão canônica sem resolvê-la no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O plural “vocês” distingue o povo do singular “você”, dirigido a Moisés. A ordem inicial “Também contra mim” conserva a ênfase do primeiro גַּם; “você também” conserva a do segundo.
