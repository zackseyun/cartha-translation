  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: pt
  text: exceto Calebe, filho de Jefoné. Ele verá a terra, e eu darei a ele e a seus filhos[a] a terra em que pisou, porque seguiu Yahweh plenamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes”. O hebraico diz literalmente “filhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: exceto
  rationale: Introduz de modo natural a exceção ao juízo anunciado nos versículos anteriores.
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: Calebe, filho de Jefoné
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes próprios.
- source_word: ה֣וּא יִרְאֶ֔נָּה
  choice: Ele verá a terra
  rationale: O sufixo feminino retoma 'a terra'. Repetir o substantivo em português evita um pronome pouco natural e torna clara a referência.
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: e eu darei a ele
  rationale: Preserva a ênfase do dativo hebraico em Calebe sem prejudicar a naturalidade em português.
- source_word: אֶת הָאָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖הּ
  choice: a terra em que pisou
  rationale: Mantém a imagem concreta de דרך, 'pisar, caminhar', em formulação portuguesa concisa.
- source_word: וּלְבָנָ֑יו
  choice: e a seus filhos
  rationale: Preserva o sentido formalmente masculino de בנים; uma nota registra que, no contexto de herança, o termo pode abranger descendentes.
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: porque
  rationale: Expressa de maneira direta e idiomática a relação causal.
- source_word: מִלֵּ֖א אַחֲרֵ֥י
  choice: seguiu ... de todo o coração
  rationale: O idioma hebraico, literalmente 'encher após', indica seguir plena ou fielmente. A expressão portuguesa comunica dedicação completa de modo natural e digno.
- source_word: יְהוָֽה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama; 'Yahweh' preserva o nome próprio e corresponde de perto à vocalização acadêmica amplamente aceita.
- issue: Extensão semântica de בָּנָיו
  choice: seus filhos
  alternative: seus descendentes
  rationale: A tradução mantém o masculino plural explícito do hebraico, enquanto a nota reconhece sua possível extensão à descendência no contexto de posse hereditária.
- issue: Força do idioma מִלֵּא אַחֲרֵי יהוה
  choice: seguiu Yahweh de todo o coração
  alternative: seguiu Yahweh plenamente
  rationale: A escolha transmite lealdade integral sem transformar o texto em afirmação abstrata de impecabilidade; a alternativa mais formal também é possível.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para evitar ambiguidade: ''a ele e a seus filhos'' compartilha naturalmente o verbo ''darei''. A repetição de ''a terra'' explicita o referente do sufixo hebraico. O marcador [a] aparece imediatamente após a expressão anotada.'
