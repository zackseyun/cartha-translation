base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: pt
  text: e no deserto[a], onde você viu que Yahweh, seu Deus, carregou você, assim como um homem carrega seu filho[b], por todo o caminho que vocês percorreram, até chegarem a este lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na região desértica”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “assim como um homem carrega seu filho”; algumas traduções expressam a comparação de modo mais genérico: “como alguém carrega uma criança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: e no deserto
  rationale: מִדְבָּר designa uma região erma ou desértica. “Deserto” é claro, corrente e adequado ao cenário da jornada de Israel.
- source_word: אֲשֶׁר רָאִיתָ
  choice: onde você viu que
  rationale: A oração relativa é ligada naturalmente ao deserto, preservando o sentido direto de que Israel testemunhou o cuidado de Deus.
- source_word: נְשָׂאֲךָ
  choice: carregou você
  rationale: נשא significa aqui “carregar, levar”. A escolha mantém a ligação explícita com a comparação seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de modo direto a designação pactual ligada ao nome divino.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: assim como um homem carrega seu filho
  rationale: Preserva os termos masculinos explícitos אִישׁ, “homem”, e בְּנוֹ, “seu filho”, sem intensificar “homem” para “pai” nem neutralizar a imagem.
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: por todo o caminho
  rationale: Expressa que o cuidado se estendeu ao percurso inteiro, em português natural.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: que vocês percorreram
  rationale: הלך tem o sentido básico de ir ou andar; no contexto da jornada, “percorreram” comunica naturalmente o deslocamento e preserva o plural hebraico.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: até chegarem a este lugar
  rationale: Converte idiomaticamente a construção infinitiva em uma oração temporal e mantém a referência ao local presente do discurso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual em forma transliterada, sem substituí-lo por um título.
- issue: Imagem familiar marcada por gênero
  choice: um homem carrega seu filho
  alternative: uma pessoa carrega uma criança; um pai carrega seu filho
  rationale: O hebraico emprega substantivos masculinos singulares. A tradução conserva essa imagem sem neutralizá-la e sem tornar אִישׁ mais específico do que o original.
- issue: Alternância entre singular e plural na forma de dirigir-se a Israel
  choice: você... vocês
  alternative: uniformizar tudo no singular ou tudo no plural
  rationale: O hebraico passa do singular em רָאִיתָ e נְשָׂאֲךָ ao plural em הֲלַכְתֶּם e בֹּאֲכֶם. A tradução mantém essa mudança, tratando Israel primeiro de modo coletivo e depois como o conjunto do povo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “você/vocês” para preservar a alternância de número do hebraico e mantém “Yahweh” como nome próprio. A repetição de “carregou/carrega” foi conservada porque estrutura a comparação no original.
