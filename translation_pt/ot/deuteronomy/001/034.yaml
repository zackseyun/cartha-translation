  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה אֶת ק֣וֹל דִּבְרֵי/כֶ֑ם וַ/יִּקְצֹ֖ף וַ/יִּשָּׁבַ֥ע לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: pt
  text: 'Yahweh ouviu o som das palavras de vocês[a], ficou irado e jurou, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a voz das palavras de vocês”.'
    reason: Registra a forma mais literal da expressão hebraica קוֹל דִּבְרֵיכֶם, cuja construção é incomum em português.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: Neste contexto narrativo, שׁמע indica diretamente o ato de ouvir; a opção evita sugerir a receptividade implícita em «escutou» ou «atendeu».
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: o som das palavras de vocês
  rationale: Preserva os dois elementos da expressão hebraica, קוֹל («som/voz») e דִּבְרֵיכֶם («palavras de vocês»), mantendo uma formulação compreensível em português.
- source_word: וַיִּקְצֹף
  choice: ficou irado
  rationale: Expressa com clareza e dignidade a intensidade de קצף no encadeamento narrativo.
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: O nifal de שׁבע significa prestar juramento; «jurou» é conciso e natural, e o conteúdo do juramento vem em seguida.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a função formal do infinitivo hebraico que introduz o discurso direto no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém diretamente o Tetragrama. «Yahweh» preserva o nome pessoal divino, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Vocês» representa naturalmente o sufixo plural de segunda pessoa; «ficou irado» conserva o peso do verbo sem soar arcaico. A vírgula e os dois-pontos mantêm a continuidade com o juramento apresentado no versículo seguinte.
