base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: pt
  text: 'Yahweh, nosso Deus, falou conosco em Horebe[a]: “Vocês já ficaram tempo suficiente neste monte.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Horebe é o nome hebraico usado aqui para o monte também associado ao Sinai.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Já basta; não permaneçam mais neste monte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Embora אֱלֹהִים tenha forma plural, aqui se refere de modo singular ao Deus de Israel e leva o sufixo da primeira pessoa do plural.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: falou conosco
  rationale: דבר significa normalmente “falar”; em português, “falar conosco” expressa com naturalidade o destinatário marcado por אֶל, sem mudar o sentido direcional básico.
- source_word: בְּחֹרֵב
  choice: em Horebe
  rationale: A preposição é locativa, e “em Horebe” é a forma portuguesa natural; mantém-se o nome usado no texto hebraico sem harmonizá-lo com Sinai.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica que introduz discurso direto é representada naturalmente em português pelos dois-pontos, evitando o pesado “dizendo”.
- source_word: רַב לָכֶם שֶׁבֶת
  choice: Vocês já ficaram tempo suficiente
  rationale: Traduz idiomaticamente a construção de suficiência ou excesso com o infinitivo de ישׁב, preservando a ideia de permanência prolongada.
- source_word: בָּהָר הַזֶּה
  choice: neste monte
  rationale: הַר designa aqui o monte Horebe; “neste monte” preserva a referência imediata e é natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Relação entre Horebe e Sinai
  choice: Manter “Horebe” no texto
  alternative: Harmonizar como “Sinai”
  rationale: O versículo diz חֹרֵב. A nota informa a associação tradicional sem apagar a escolha nominal do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e converte a fórmula לֵאמֹר em pontuação natural. A alternativa mais abrupta de רַב לָכֶם é preservada em nota.
