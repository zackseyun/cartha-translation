  yaml_path: translation/ot/deuteronomy/001/046.yaml
  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: pt
  text: Assim, vocês permaneceram em Cades muitos dias[a], tantos quantos os dias que permaneceram ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “muitos dias, como os dias em que vocês permaneceram [ali]”. A frase final é elíptica; pode expressar uma comparação de duração, sem esclarecer plenamente o referente implícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: Assim, vocês permaneceram
  rationale: O verbo ישׁב, no contexto, indica ficar ou permanecer num lugar. “Permaneceram” expressa a estada prolongada, e “assim” liga o versículo ao desenvolvimento narrativo anterior.
- source_word: בְקָדֵשׁ
  choice: em Cades
  rationale: A preposição בְּ marca localização; “em Cades” é natural em português e mantém o nome geográfico transliterado.
- source_word: יָמִים רַבִּים
  choice: muitos dias
  rationale: Tradução direta da expressão hebraica, preservando sua forma concreta em vez de substituí-la por “muito tempo”.
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: tantos quantos os dias que permaneceram ali
  rationale: A construção comparativa é elíptica. Esta formulação conserva a referência aos “dias” e comunica em português a comparação de duração sem determinar de modo excessivo seu referente implícito.
