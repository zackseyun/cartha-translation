base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: pt
  text: Estas são as palavras que Moisés falou a todo Israel do outro lado do Jordão[a], no deserto, na Arabá[b], diante de Sufe[c], entre Parã, Tofel, Labã, Hazerote e Di-Zaabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “além do Jordão” ou “na outra margem do Jordão”. A expressão hebraica pode ser entendida a partir de diferentes pontos de vista geográficos.
    reason: lexical_alternative
  - marker: b
    text: “Arabá” é um termo geográfico que designa a região de vale ou planície da grande depressão; tradicionalmente também é traduzido por “planície”.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “Sufe”. Alguns o entendem como nome de lugar; outros o relacionam com o “mar dos Juncos”, mas a palavra “mar” não aparece aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Estas são as palavras
  rationale: Mantém a força apresentativa da abertura e entende דְּבָרִים como palavras, conforme o contexto imediato de discurso.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: que Moisés falou
  rationale: Reproduz naturalmente a oração relativa e o caráter formal do ato de falar.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: a todo o Israel
  rationale: Expressa a totalidade do povo e conserva a designação coletiva Israel.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: Expressão geográfica natural em português que preserva a referência ao lado oposto sem fixar silenciosamente o ponto de vista.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português contemporâneo, deserto pode designar a região árida e pouco habitada, sendo mais corrente que ermo neste contexto.
- source_word: בָּעֲרָבָה
  choice: na Arabá
  rationale: Translitera o termo como designação geográfica da região de vale ou planície de rifte, evitando reduzi-lo a um substantivo genérico.
- source_word: מוֹל סוּף
  choice: diante de Sufe
  rationale: מוֹל indica posição em frente ou defronte; Sufe conserva o termo como possível topônimo, sem acrescentar mar, ausente no hebraico.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: entre Parã, Tofel, Labã, Hazerote e Di-Zaabe
  rationale: Uma lista com vírgulas e conjunção final é natural em português e conserva todos os topônimos do texto hebraico.
