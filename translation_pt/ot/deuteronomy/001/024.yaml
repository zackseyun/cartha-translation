base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: pt
  text: Então, eles se voltaram e subiram à região montanhosa; chegaram até o vale de Escol[a] e espionaram a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uádi de Escol” ou “ribeiro de Escol”; o termo hebraico pode indicar um vale com um curso de água sazonal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: eles se voltaram
  rationale: Traduz diretamente o sentido narrativo de פנה, indicando mudança de direção antes da subida.
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva de modo natural o movimento ascendente expresso por עלה.
- source_word: הָהָרָה
  choice: à região montanhosa
  rationale: A terminação direcional indica movimento rumo à área elevada; esta formulação é geograficamente clara e natural em português.
- source_word: וַיָּבֹאוּ עַד
  choice: chegaram até
  rationale: Reproduz a ideia de chegada a um ponto ou limite expressa pela combinação de בוא com עַד.
- source_word: נַחַל אֶשְׁכֹּל
  choice: o vale de Escol
  rationale: נחל pode designar um vale, ravina ou curso de água sazonal; 'vale' oferece uma leitura clara no texto, enquanto a amplitude lexical é preservada em nota.
- source_word: וַיְרַגְּלוּ
  choice: espionaram
  rationale: O piel de רגל descreve reconhecimento feito por espias, e não simples exploração.
- source_word: אֹתָהּ
  choice: que
  rationale: O pronome feminino singular retoma naturalmente em português o vale ou a área mencionada, sem explicitar além do hebraico.
