base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: pt
  text: 'Então todos vocês se aproximaram de mim e disseram: “Enviemos homens à nossa frente para que explorem[a] a terra por nós e nos tragam informações sobre o caminho pelo qual devemos subir[b] e sobre as cidades às quais chegaremos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “investiguem” ou “reconheçam”. O verbo hebraico pode indicar procurar ou examinar; “explorem” evita sugerir necessariamente uma operação secreta.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “o caminho pelo qual subiremos nela”. “Devemos subir” expressa no contexto a deliberação sobre a rota; “subir” preserva a expressão bíblica comum para avançar em direção à terra ou à região montanhosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: Então todos vocês se aproximaram de mim
  rationale: “Aproximaram-se de mim” expressa com naturalidade o sentido concreto de קָרַב, e “todos vocês” preserva a ênfase de כֻּלְּכֶם.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: Enviemos homens
  rationale: O coortativo נִשְׁלְחָה pede uma exortação na primeira pessoa do plural. אֲנָשִׁים designa aqui homens adultos escolhidos para a missão.
- source_word: לְפָנֵינוּ
  choice: à nossa frente
  rationale: Equivalente idiomático que comunica que os homens seriam enviados adiante do grupo.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: para que explorem a terra por nós
  rationale: חָפַר pode indicar procurar, examinar ou investigar. “Explorem” comunica a missão de reconhecimento sem impor necessariamente a ideia moderna de espionagem clandestina.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: e nos tragam informações
  rationale: A construção transmite a ideia de voltar com uma palavra ou relatório. “Tragam informações” é clara e natural em português, sem alterar a função do relato esperado.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: sobre o caminho pelo qual devemos subir
  rationale: “Caminho” traduz דֶּרֶךְ, enquanto “subir” conserva o valor de עָלָה e o modo bíblico de descrever a entrada na região. “Devemos” expressa a deliberação sobre a rota a tomar.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: e sobre as cidades às quais chegaremos
  rationale: A formulação preserva o segundo objeto do relatório e traduz de modo natural a chegada às cidades, sem especificar além do hebraico se elas seriam imediatamente ocupadas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto a progressão do hebraico, mas evita construções excessivamente literais. As aspas marcam a fala direta; os marcadores de nota foram colocados junto às expressões que explicam.
