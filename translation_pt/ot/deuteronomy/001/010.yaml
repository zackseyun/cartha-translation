id: DEU.1.10
reference: Deuteronomy 1:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהֵי/כֶ֖ם הִרְבָּ֣ה אֶתְ/כֶ֑ם וְ/הִנְּ/כֶ֣ם הַ/יּ֔וֹם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: pt
  text: Yahweh, o Deus de vocês, multiplicou vocês; e eis que hoje vocês são tão numerosos quanto as estrelas dos céus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “como as estrelas dos céus, em multidão”.'
    reason: A nota preserva a forma mais concreta e a possível ligação sintática da expressão hebraica לָרֹב, enquanto o texto principal apresenta seu sentido em português natural.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título, preservando a forma adotada para o tetragrama.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: No contexto da aliança, אֱלֹהִים designa o único Deus, e o sufixo de segunda pessoa masculina plural é expresso de modo natural por “de vocês”.
- source_word: הִרְבָּה אֶתְכֶם
  choice: multiplicou vocês
  rationale: O hifil de רבה tem sentido causativo, “fazer numerosos, multiplicar”. A formulação mantém os próprios israelitas como objeto e conserva a ligação verbal com as promessas patriarcais.
- source_word: וְהִנְכֶם הַיּוֹם
  choice: e eis que hoje vocês são
  rationale: “Eis que” retém a força dêitica e retórica de הִנֵּה, chamando atenção para a situação presente; “hoje” traduz diretamente הַיּוֹם.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: tão numerosos quanto as estrelas dos céus
  rationale: Expressa em português corrente tanto a comparação introduzida por כְּ quanto a ideia de grande número em לָרֹב, sem reproduzir uma construção hebraica pouco natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz explicitamente o tetragrama. A transliteração “Yahweh” preserva o nome pessoal do Deus de Israel sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De vocês” torna inequívoco o destinatário plural; “eis que” conserva a ênfase retórica do hebraico, embora seja levemente solene. O ponto e vírgula acompanha a progressão entre a ação de Yahweh e o estado presente do povo.
