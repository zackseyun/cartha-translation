base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: pt
  text: 'Virem-se, partam e vão para a região montanhosa dos amorreus e para todas as regiões vizinhas: na Arabá, na região montanhosa, na região de terras baixas[a], no Neguebe, no litoral do mar, na terra dos cananeus e no Líbano, até o grande rio, o rio Eufrates.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na Sefelá”, nome da região ocidental de terras baixas e colinas ao pé das montanhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  choice: Virem-se
  rationale: O imperativo de פנה indica mudança de direção antes da partida; “virem-se” conserva de modo natural a força da ordem.
- source_word: וּסְעוּ לָכֶם
  choice: partam
  rationale: נסע, em contexto de viagem, significa levantar acampamento e pôr-se a caminho. O dativo לָכֶם é idiomático e não exige a formulação pouco natural “para vocês”.
- source_word: וּבֹאוּ
  choice: e vão para
  rationale: בוא pode significar “vir”, “ir” ou “entrar”; no encadeamento de ordens sobre o destino de Israel, “vão para” comunica naturalmente a direção.
- source_word: הַר הָאֱמֹרִי
  choice: a região montanhosa dos amorreus
  rationale: הַר designa aqui uma zona de terras altas, não uma única montanha; o gentílico singular hebraico tem sentido coletivo.
- source_word: שְׁכֵנָיו
  choice: todas as regiões vizinhas
  rationale: Literalmente, “todos os seus vizinhos”. No contexto da enumeração geográfica, a expressão refere-se naturalmente às áreas adjacentes, evitando personificação obscura em português.
- source_word: בָּעֲרָבָה
  choice: a Arabá
  rationale: Arabá é o nome geográfico da região do vale de rifte do Jordão; a transliteração preserva esse sentido específico.
- source_word: וּבַשְּׁפֵלָה
  choice: a planície
  rationale: שְׁפֵלָה designa a região baixa ou de colinas baixas a oeste das montanhas da Judeia. “Planície” é acessível, enquanto o nome técnico alternativo é preservado em nota.
- source_word: וּבַנֶּגֶב
  choice: o Neguebe
  rationale: Na lista de zonas geográficas, נֶגֶב indica a região meridional específica, e não apenas o ponto cardeal sul.
- source_word: וּבְחוֹף הַיָּם
  choice: o litoral do mar
  rationale: A expressão mantém os dois elementos do hebraico, חוֹף e הַיָּם, em linguagem geográfica clara.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: a terra dos cananeus
  rationale: O gentílico singular hebraico é coletivo; o plural português é natural e claro.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: até o grande rio, o rio Eufrates
  rationale: Preserva a repetição explicativa do hebraico, na qual “rio Eufrates” identifica “o grande rio”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas correntes no Brasil. A enumeração foi organizada com dois-pontos para tornar clara a relação entre as regiões vizinhas e a lista geográfica, sem eliminar a amplitude sintática do hebraico.
