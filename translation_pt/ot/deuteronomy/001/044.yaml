  text: וַ/יֵּצֵ֨א הָ/אֱמֹרִ֜י הַ/יֹּשֵׁ֨ב בָּ/הָ֤ר הַ/הוּא֙ לִ/קְרַאתְ/כֶ֔ם וַ/יִּרְדְּפ֣וּ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֥ר תַּעֲשֶׂ֖ינָה הַ/דְּבֹרִ֑ים וַֽ/יַּכְּת֥וּ אֶתְ/כֶ֛ם בְּ/שֵׂעִ֖יר עַד חָרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: pt
  text: Então os amorreus[a] que viviam naquela região montanhosa[b] saíram ao encontro de vocês, perseguiram vocês como fazem as abelhas e os esmagaram em Seir, até Hormá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o amorreu” — o hebraico emprega o singular com sentido coletivo para a população amorreia; os verbos seguintes estão no plural.
    reason: lexical_alternative
  - marker: b
    text: Ou “naquela montanha”; aqui, “região montanhosa” expressa o sentido regional possível da palavra hebraica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saíram
  rationale: O verbo יצא descreve os inimigos deixando sua posição para confrontar Israel; “saíram” é natural em português e concorda com o sentido coletivo do sujeito.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: Embora a forma hebraica seja singular, ela tem valor coletivo, como confirmam os verbos seguintes no plural.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: que viviam naquela região montanhosa
  rationale: O particípio indica residência habitual, e הַר designa aqui a região elevada, não necessariamente uma única montanha.
- source_word: לִקְרַאתְכֶם
  choice: ao encontro de vocês
  rationale: Preserva o sentido básico de לקראת; o contexto deixa clara a intenção hostil sem precisar explicitá-la.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: perseguiram vocês
  rationale: רדף é o verbo comum para perseguição, inclusive em contexto militar.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: como fazem as abelhas
  rationale: Mantém a comparação vívida e proverbial do hebraico em uma formulação natural em português.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: os esmagaram
  rationale: A forma verbal de כתת comunica um ataque violento que destroça ou abate; “esmagaram” preserva a força da imagem sem acrescentar detalhes.
- source_word: בְּשֵׂעִיר
  choice: em Seir
  rationale: A preposição ב indica de modo direto o âmbito geográfico da derrota.
- source_word: עַד חָרְמָה
  choice: até Hormá
  rationale: עד marca o limite geográfico alcançado pela perseguição e derrota.
theological_decisions: []
