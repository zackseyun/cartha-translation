base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: pt
  text: Dentre todos estes homens desta geração má, nenhum verá a boa terra que jurei dar aos seus pais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “aos seus antepassados”. Hebraico: “aos seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nenhum ... verá
  rationale: Aqui אִם integra uma fórmula enfática de juramento negativo, não uma condição simples; a negação categórica reproduz naturalmente sua força em português.
- source_word: יִרְאֶה
  choice: verá
  rationale: Mantém o sentido comum de ראה e, no contexto do juízo, expressa a exclusão futura da terra sem explicitar além do hebraico.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: Nenhum homem entre estes homens
  rationale: Preserva o singular distributivo אִישׁ, a relação partitiva da preposição ב e a referência masculina explícita de אֲנָשִׁים.
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: desta geração má
  rationale: דּוֹר significa “geração”; “má” comunica aqui a avaliação moral de רַע em linguagem portuguesa natural e digna.
- source_word: אֵת הָאָרֶץ הַטּוֹבָה
  choice: a boa terra
  rationale: Tradução direta que conserva tanto a referência à terra como sua caracterização positiva e pactual.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָתֵת
  choice: que jurei dar
  rationale: Reproduz de modo conciso o relativo, o verbo de juramento no nifal e o infinitivo de נתן.
- source_word: לַאֲבֹתֵיכֶם
  choice: aos seus pais
  rationale: Mantém o masculino plural explícito do hebraico; a acepção mais abrangente “antepassados” é registrada em nota.
theological_decisions:
- issue: Sentido de לַאֲבֹתֵיכֶם
  choice: aos seus pais
  alternative: aos seus antepassados
  rationale: O texto hebraico diz literalmente “pais”, referindo-se aos antepassados patriarcais de Israel. A tradução principal preserva a forma masculina explícita, sem ocultar em nota a amplitude possível do referente.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição “homem entre estes homens” foi mantida por corresponder à formulação enfática e distributiva do hebraico, apesar de ser menos enxuta em português.
