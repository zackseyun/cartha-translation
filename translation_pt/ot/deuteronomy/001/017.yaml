  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: pt
  text: Não façam acepção de pessoas no julgamento[a]; ouçam tanto o pequeno como o grande. Não tenham medo de homem algum[b], pois o julgamento pertence a Deus. Quanto à questão que for difícil demais para vocês, tragam-na a mim, e eu a ouvirei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “reconhecer rostos no julgamento”, expressão que significa agir com parcialidade ou favoritismo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não se deixem intimidar por homem algum”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: façam acepção de pessoas
  rationale: A expressão hebraica significa literalmente “reconhecer rostos”, mas, em contexto judicial, designa favorecer alguém ou agir com parcialidade. “Fazer acepção de pessoas” conserva a força jurídica do idioma e é amplamente reconhecível em português.
- source_word: בַּמִּשְׁפָּט
  choice: no julgamento
  rationale: Aqui מִשְׁפָּט se refere ao exercício da decisão judicial, não apenas à justiça em sentido abstrato.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: tanto o pequeno como o grande
  rationale: A dupla expressão contrasta pessoas de menor e maior posição social. A formulação preserva a imagem hebraica sem explicá-la excessivamente.
- source_word: תִּשְׁמָעוּן
  choice: ouçam
  rationale: No contexto judicial, שׁמע significa dar audiência ou ouvir uma causa. “Ouçam” mantém o elo verbal com a última oração do versículo.
- source_word: לֹא תָגוּרוּ מִפְּנֵי אִישׁ
  choice: não tenham medo de homem algum
  rationale: A expressão descreve o receio que poderia levar os juízes a recuar diante de uma pessoa. Esta tradução é natural, mantém o masculino singular genérico do hebraico e evita restringir o sentido apenas à intimidação externa.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: pois o julgamento pertence a Deus
  rationale: A formulação preserva diretamente a afirmação de que a autoridade do julgamento é de Deus, sem definir além do texto como essa pertença deve ser entendida.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: a questão que for difícil demais para vocês
  rationale: דָּבָר denota aqui uma questão ou causa, e a construção com קשׁה indica algo além da capacidade dos juízes de resolver.
- source_word: תַּקְרִבוּן אֵלַי
  choice: tragam-na a mim
  rationale: O hiphil de קרב significa fazer chegar ou apresentar; no contexto jurídico, “trazer a questão” é claro e natural.
- source_word: וּשְׁמַעְתִּיו
  choice: e eu a ouvirei
  rationale: O sufixo retoma mais naturalmente “a questão”. “Ouvirei” preserva a linguagem de audiência judicial, enquanto “decidirei” acrescentaria uma conclusão não expressa pelo verbo.
theological_decisions:
- issue: Fundamento da autoridade judicial em “o julgamento pertence a Deus”
  choice: Preservar a afirmação direta de que o julgamento pertence a Deus e, assim, fundamenta a imparcialidade dos juízes.
  alternative: Explicitar que Deus julgará os juízes ou que o julgamento consiste exclusivamente na lei divina.
  rationale: O hebraico afirma diretamente a pertença do julgamento a Deus, mas não desenvolve aqui uma teoria específica de responsabilidade judicial ou de direito divino.
- issue: Masculino singular genérico אִישׁ
  choice: homem algum
  alternative: ninguém ou pessoa alguma
  rationale: A escolha conserva a forma masculina singular do hebraico e seu sentido genérico, sem sugerir que somente certos homens estejam em vista.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais no plural dirigidas aos juízes. “Acepção de pessoas” mantém uma expressão jurídica e bíblica reconhecível; a nota esclarece seu sentido. O paralelismo e a repetição de “ouvir” foram preservados. O marcador [b] foi colocado junto à expressão a que sua nota efetivamente se refere.
