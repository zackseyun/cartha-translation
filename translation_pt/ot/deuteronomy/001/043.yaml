  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: pt
  text: Assim, falei com vocês, mas vocês não deram ouvidos; rebelaram-se contra a ordem de Yahweh[a], agiram com presunção e subiram à região montanhosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “contra a boca de Yahweh”; isto é, contra o que Yahweh havia ordenado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Assim, falei com vocês
  rationale: O piel de דבר significa “falar”, e o waw dá continuidade à narrativa. “Assim” expressa naturalmente a ligação resultativa com o contexto anterior; “vocês” torna explícito o plural do sufixo hebraico.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: mas vocês não deram ouvidos
  rationale: שׁמע pode significar ouvir, escutar ou obedecer. “Não deram ouvidos” preserva a imagem de escuta e, no contexto, comunica recusa sem antecipar a ideia de rebelião da oração seguinte.
- source_word: וַתַּמְרוּ
  choice: rebelaram-se
  rationale: מרה descreve rebelião ou desafio à autoridade; “rebelaram-se” é direto e adequado ao contexto da aliança.
- source_word: אֶת פִּי יְהוָה
  choice: contra a ordem de Yahweh
  rationale: A expressão significa literalmente “contra a boca de Yahweh”, idiomatismo referente ao que Yahweh disse ou ordenou. “Ordem” comunica o sentido em português corrente, enquanto a nota preserva a forma concreta do hebraico.
- source_word: וַתָּזִדוּ
  choice: agiram com presunção
  rationale: זיד indica agir de modo presunçoso, arrogante ou insolente. A escolha conserva a avaliação moral sem fundi-la com o verbo seguinte.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: subiram à região montanhosa
  rationale: עלה indica subir, e a terminação direcional em הָהָרָה marca movimento rumo à área montanhosa. “Região montanhosa” evita sugerir necessariamente uma única montanha.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Sentido de אֶת פִּי יְהוָה
  choice: contra a ordem de Yahweh
  alternative: contra a boca de Yahweh; contra a palavra de Yahweh
  rationale: A tradução principal comunica o idiomatismo no contexto de desobediência a uma instrução divina; a nota registra a expressão literal e evita ocultar a imagem hebraica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A segunda pessoa do plural é expressa por “vocês”, e “não deram ouvidos” mantém naturalidade sem reduzir שׁמע simplesmente a “obedecer”.
