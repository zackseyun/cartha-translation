  text: וְ/אַתֶּ֖ם פְּנ֣וּ לָ/כֶ֑ם וּ/סְע֥וּ הַ/מִּדְבָּ֖רָ/ה דֶּ֥רֶךְ יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/040.yaml
  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: pt
  text: Mas vocês, deem meia-volta e partam para o deserto, pelo caminho do Mar Vermelho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “mar dos Juncos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mas vocês
  rationale: A conjunção, seguida do pronome independente, contrasta enfaticamente os destinatários com as pessoas mencionadas no juízo anterior. “Mas vocês” comunica esse contraste em português natural.
- source_word: פְּנוּ לָכֶם
  choice: deem meia-volta
  rationale: O imperativo exige uma mudança concreta de direção, e לָכֶם reforça que os próprios destinatários devem fazê-la. A expressão idiomática “deem meia-volta” reúne os dois elementos sem o artificial “virem-se para vocês mesmos”.
- source_word: וּסְעוּ
  choice: e partam
  rationale: O verbo נסע frequentemente descreve levantar acampamento e pôr-se a caminho. “Partam” preserva a força do imperativo e soa natural.
- source_word: הַמִּדְבָּרָה
  choice: para o deserto
  rationale: O ה direcional indica movimento rumo ao deserto, adequadamente expresso pela preposição “para”, sem afirmar mais do que a direção indicada.
- source_word: דֶּרֶךְ
  choice: pelo caminho do
  rationale: Neste contexto, דֶּרֶךְ assinala a rota a seguir. “Pelo caminho do” conserva essa noção de percurso.
- source_word: יַם סוּף
  choice: mar Vermelho
  rationale: “Mar Vermelho” é a designação geográfica tradicional e amplamente reconhecida em português. A forma lexical mais literal, “mar dos Juncos”, é mantida em nota para transparência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” torna explícito o destinatário coletivo; “deem meia-volta” reproduz de modo idiomático a mudança de direção e a ênfase reflexiva do hebraico. A nota foi colocada junto de “mar Vermelho”, termo ao qual se refere.
