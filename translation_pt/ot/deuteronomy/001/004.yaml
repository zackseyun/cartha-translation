  text: אַחֲרֵ֣י הַכֹּת֗/וֹ אֵ֚ת סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן וְ/אֵ֗ת ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן אֲשֶׁר יוֹשֵׁ֥ב בְּ/עַשְׁתָּרֹ֖ת בְּ/אֶדְרֶֽעִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: pt
  text: depois de ter abatido Seom, rei dos amorreus, que morava em Hesbom, e Ogue, rei de Basã, que morava em Astarote, em Edrei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “em Astarote e Edrei”. O hebraico repete “em” diante dos dois nomes de lugar, mas não explicita plenamente a relação entre eles.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי הַכֹּתוֹ
  choice: depois de ter abatido
  rationale: A preposição temporal seguida do infinitivo com sufixo indica uma ação anterior à fala de Moisés mencionada no contexto. “Ter abatido” conserva a força de נכה sem tornar a construção pouco natural em português.
- source_word: סִיחֹן
  choice: Seom
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: rei dos amorreus
  rationale: Expressa naturalmente a cadeia construta e mantém explícita a designação étnica.
- source_word: אֲשֶׁר יוֹשֵׁב
  choice: que morava
  rationale: No contexto de residência ou sede real, ישׁב significa morar ou habitar; “morava” é atual e natural.
- source_word: בְּחֶשְׁבּוֹן
  choice: em Hesbom
  rationale: Representa diretamente a preposição locativa e emprega a forma portuguesa corrente do topônimo.
- source_word: עוֹג
  choice: Ogue
  rationale: Forma portuguesa tradicional e facilmente pronunciável do nome hebraico.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: rei de Basã
  rationale: Tradução natural da cadeia construta com o nome da região.
- source_word: בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: em Asterote, em Edrei
  rationale: Mantém os dois topônimos e a repetição da preposição hebraica, evitando definir uma relação geográfica que o texto deixa comprimida e não inteiramente explícita.
theological_decisions: []
