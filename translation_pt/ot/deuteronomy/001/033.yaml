  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: pt
  text: que ia adiante de vocês pelo caminho, procurando para vocês um lugar para acamparem[a], no fogo, de noite, para mostrar a vocês o caminho que deveriam seguir[b], e na nuvem, de dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “explorando para vocês um lugar para acamparem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “para fazê-los ver o caminho pelo qual iriam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: que ia
  rationale: O particípio qal funciona como oração relativa e continua a descrição do SENHOR no versículo anterior. O imperfeito português comunica bem a ação contínua no contexto narrativo.
- source_word: לִפְנֵיכֶם
  choice: adiante de vocês
  rationale: Expressa de modo natural a posição daquele que segue à frente do povo para guiá-lo.
- source_word: בַּדֶּרֶךְ
  choice: pelo caminho
  rationale: No contexto, דֶּרֶךְ designa o trajeto da jornada; a formulação é corrente e preserva a imagem espacial.
- source_word: לָתוּר
  choice: procurando
  rationale: תור indica percorrer ou examinar com o objetivo de encontrar um local apropriado. A escolha é clara em português e evita uma conotação militar desnecessária.
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: um lugar onde acampar
  rationale: Reproduz naturalmente a relação de finalidade entre o lugar e o acampamento do povo.
- source_word: בָּאֵשׁ לַיְלָה
  choice: no fogo durante a noite
  rationale: Mantém o fogo como forma da presença orientadora e conserva o contraste paralelo com a nuvem durante o dia.
- source_word: לַרְאֹתְכֶם
  choice: para lhes mostrar
  rationale: O infinitivo hifil de ראה é causativo; em contexto de orientação, 'mostrar' é o equivalente idiomático adequado.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: o caminho pelo qual deviam seguir
  rationale: Identifica a rota indicada por Deus sem reduzir a frase a uma obrigação moral; 'deviam seguir' expressa o percurso que lhes cabia tomar.
- source_word: וּבֶעָנָן יוֹמָם
  choice: e na nuvem durante o dia
  rationale: A nuvem é definida pelo contexto da condução no deserto; a expressão forma paralelo claro com o fogo noturno.
theological_decisions:
- issue: Identificação do sujeito como o SENHOR a partir do contexto anterior
  choice: Manter a oração relativa, começando com 'que ia', sem repetir 'o SENHOR'.
  alternative: Explicitar 'o SENHOR, que ia...' para tornar o sujeito independente do versículo anterior.
  rationale: O hebraico depende sintaticamente da menção ao SENHOR no versículo precedente. A tradução preserva essa ligação e não acrescenta um nome ausente neste versículo.
- issue: Valor da forma verbal em אֲשֶׁר תֵּלְכוּ בָהּ
  choice: Traduzir como 'pelo qual deviam seguir'.
  alternative: Traduzir mais literalmente como 'pelo qual seguiriam' ou 'pelo qual iriam'.
  rationale: A construção descreve a rota indicada para o povo, podendo envolver destino ou orientação. 'Deviam seguir' preserva essa tensão sem apresentar o trecho como mero mandamento moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Vocês' representa o plural hebraico; 'lhes mostrar' evita repetição excessiva. O versículo permanece sintaticamente ligado ao anterior, como no texto hebraico.
