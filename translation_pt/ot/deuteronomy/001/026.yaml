  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: pt
  text: Mas vocês não quiseram subir e se rebelaram contra a ordem de Yahweh, seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “contra a boca de Yahweh, seu Deus”, expressão que significa resistir à sua ordem ou desafiá-la.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֲבִיתֶם
  choice: Mas vocês não quiseram
  rationale: A conjunção assume valor adversativo no contexto, e a construção negativa de אבה expressa falta de disposição ou recusa. A formulação preserva a nuance volitiva em português natural.
- source_word: לַעֲלֹת
  choice: subir
  rationale: עלה indica movimento ascendente. “Subir” é direto, idiomático e mantém a orientação espacial do hebraico.
- source_word: וַתַּמְרוּ
  choice: e se rebelaram
  rationale: מרה denota rebeldia ou desafio à autoridade; “se rebelaram” comunica claramente a ação.
- source_word: אֶת פִּי
  choice: contra a ordem
  rationale: Literalmente, “contra a boca”, expressão idiomática que se refere à ordem pronunciada por uma autoridade. “Contra a ordem” transmite o sentido sem obscurecer o texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: 'Com Yahweh e o sufixo de segunda pessoa do plural, o substantivo tem referência singular: o Deus de vocês.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de “rebelar-se contra a boca” de Yahweh
  choice: contra a ordem de Yahweh
  alternative: contra a boca de Yahweh; contra a palavra de Yahweh
  rationale: A expressão hebraica descreve desobediência à ordem proferida por Deus. A tradução idiomática preserva a autoridade da fala sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” e construção concisa. A nota preserva a imagem literal do hebraico enquanto o texto principal apresenta seu sentido idiomático.
