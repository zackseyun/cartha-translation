source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: pt
  text: 'E eu lhes disse: “Vocês chegaram à região montanhosa dos amorreus[a], que Yahweh, nosso Deus, está nos dando.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao monte dos amorreus”. O termo hebraico pode indicar tanto um monte como, em sentido mais amplo, uma região montanhosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: E eu lhes disse
  rationale: O wayyiqtol dá continuidade à narrativa, e אֲלֵכֶם é plural. A formulação é natural e mantém explícito o destinatário coletivo.
- source_word: בָּאתֶם
  choice: Vocês chegaram
  rationale: O perfeito qal de segunda pessoa plural indica que o grupo já alcançou o lugar. Em português, o pretérito perfeito expressa isso com naturalidade.
- source_word: עַד
  choice: a
  rationale: Com verbo de movimento, marca o ponto alcançado; a regência de “chegar” pede “a”.
- source_word: הַר הָאֱמֹרִי
  choice: a região montanhosa dos amorreus
  rationale: הַר pode designar tanto um monte quanto uma zona de relevo elevado. No contexto geográfico, “região montanhosa” comunica melhor o sentido amplo; o gentílico singular hebraico tem valor coletivo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, sem substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Representa diretamente a forma construta com sufixo de primeira pessoa do plural.
- source_word: נֹתֵן לָנוּ
  choice: está nos dando
  rationale: O particípio apresenta a dádiva como ação em curso ou iminente. A colocação pronominal é clara e natural em português brasileiro contemporâneo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O original emprega o Tetragrama como nome próprio. “Yahweh” preserva esse nome e evita substituí-lo por um título.
- issue: Aspecto de נֹתֵן na concessão da terra
  choice: está nos dando
  alternative: nos dá; nos deu
  rationale: A construção progressiva mantém o caráter presente e em desenvolvimento da concessão, sem tratá-la apenas como fato passado ou máxima geral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural hebraico; “lhes” evita a forma regional “vos”. O nome Yahweh é mantido como nome próprio.
