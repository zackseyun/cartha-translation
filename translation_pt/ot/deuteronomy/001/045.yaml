  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: pt
  text: Então vocês voltaram e choraram diante de Yahweh, mas Yahweh não escutou a voz de vocês nem lhes deu ouvidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não ouviu a voz de vocês nem prestou atenção em vocês”. O hebraico emprega dois verbos quase paralelos relacionados a ouvir ou escutar, ressaltando que Yahweh não atendeu ao clamor deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: Então vocês voltaram
  rationale: שׁוּב significa “voltar/retornar”; aqui descreve o retorno após o ataque fracassado. “Então” expressa a progressão narrativa do waw consecutivo.
- source_word: וַתִּבְכּוּ
  choice: e choraram
  rationale: בכה significa “chorar”; a forma escolhida é natural em português e não acrescenta intensidade ausente no hebraico.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica “diante de/na presença de”. “Diante de” preserva de modo natural a ideia de comparecer perante Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso diretamente no texto hebraico.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: mas Yahweh não escutou a voz de vocês
  rationale: שׁמע com בְּקוֹל pode indicar ouvir com atenção ou atender. “Escutou a voz” mantém a expressão concreta do hebraico e, no contexto, sugere ausência de resposta.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: nem lhes deu ouvidos
  rationale: האזין significa dar ouvidos, escutar atentamente. A expressão portuguesa preserva o paralelismo entre os dois verbos de audição sem reduzi-los a uma única formulação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa por transliteração, sem substituí-lo por um título.
- issue: Sentido da afirmação de que Yahweh não ouviu
  choice: Preservar a linguagem de não escutar e não dar ouvidos
  alternative: Explicitar como “não respondeu à súplica de vocês”
  rationale: Os verbos hebraicos, em paralelismo, indicam que Deus não atendeu ao clamor. A tradução mantém a imagem auditiva e deixa a implicação contextual sem transformar a explicação em texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. “Deu ouvidos” é uma expressão corrente e preserva o paralelismo hebraico.
