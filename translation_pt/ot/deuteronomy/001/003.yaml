  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: pt
  text: E aconteceu que, no quadragésimo ano, no décimo primeiro mês, no primeiro dia do mês, Moisés falou aos filhos de Israel[a] conforme tudo o que Yahweh lhe havia ordenado para eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aos israelitas». O hebraico diz literalmente «aos filhos de Israel».
    reason: lexical_alternative
  - marker: b
    text: 'A construção hebraica é compacta: literalmente, «lhe ordenou a eles», podendo também ser entendida como «lhe havia ordenado a respeito deles». O sentido é que Moisés transmitiu o que Yahweh lhe havia ordenado para Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Reproduz a fórmula narrativa hebraica de modo natural e digno, sem recorrer ao arcaísmo «e sucedeu que».
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: no quadragésimo ano
  rationale: A construção hebraica indica a numeração do ano; o ordinal é a forma idiomática em português.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: no décimo primeiro mês
  rationale: O cardinal hebraico exerce aqui função ordinal numa fórmula de datação.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: Explicita «dia», subentendido na fórmula hebraica, para produzir uma data clara em português.
- source_word: דִּבֶּר
  choice: falou
  rationale: Equivalente amplo e direto, sem especificar além do texto a natureza do ato de fala.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a expressão familiar masculina do hebraico; a nota registra a alternativa coletiva natural «aos israelitas».
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Mantém a ideia de conformidade e totalidade expressa por כְּ־ com כֹּל.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da ordem de Yahweh em relação à fala de Moisés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֹתוֹ אֲלֵהֶם
  choice: lhe havia ordenado para eles
  rationale: Conserva, em português compreensível, a relação compacta entre a ordem dada a Moisés e sua destinação a Israel, sem eliminar a possível nuance «a respeito deles».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pactual em forma reconhecível e não o substitui por um título.
- issue: Referente de אֲלֵהֶם na ordem dada a Moisés
  choice: para eles
  alternative: a respeito deles
  rationale: A construção hebraica é compacta e admite diferença de nuance. O texto principal expressa Israel como destinatário da mensagem, enquanto a nota preserva a alternativa referencial sem decidir mais do que o hebraico permite.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem dos elementos conserva a fórmula hebraica de datação. As notas ficam junto às expressões que efetivamente explicam, corrigindo a associação deslocada dos marcadores na camada inglesa de consulta.
