base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/002.yaml
  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: pt
  text: São onze dias de viagem desde Horebe até Cades-Barneia, pelo caminho do monte Seir[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “São onze dias”. A expressão hebraica indica o tempo de viagem entre Horebe e Cades-Barneia por essa rota.'
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico usa aqui o nome Horebe, muitas vezes associado ao Sinai.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: onze dias de viagem
  rationale: A expressão hebraica indica a duração do percurso. Em português, “onze dias de viagem” comunica naturalmente o sentido sem acrescentar uma distância geográfica precisa.
- source_word: מֵחֹרֵב
  choice: desde Horebe
  rationale: חֹרֵב é o topônimo Horebe. “Desde” marca com clareza o ponto de partida do trajeto.
- source_word: דֶּרֶךְ הַר שֵׂעִיר
  choice: pelo caminho do monte Seir
  rationale: דֶּרֶךְ designa caminho ou rota; a formulação mantém a relação construta com “monte Seir” e soa natural em português.
- source_word: הַר שֵׂעִיר
  choice: monte Seir
  rationale: הַר pode indicar monte ou região montanhosa. “Monte Seir” preserva a designação tradicional e concisa, deixando a extensão geográfica implícita como no hebraico.
- source_word: עַד
  choice: até
  rationale: No contexto geográfico, עַד assinala o ponto final do percurso.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Cades-Barneia
  rationale: Forma portuguesa tradicional e reconhecível do topônimo composto, aqui grafada com hífen.
theological_decisions: []
