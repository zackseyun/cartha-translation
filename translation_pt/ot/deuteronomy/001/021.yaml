source:
  edition: WLC
  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: pt
  text: 'Veja: Yahweh, seu Deus, pôs a terra diante de você. Suba e tome posse dela, conforme Yahweh, o Deus de seus pais[a], lhe disse. Não tenha medo nem se deixe abater.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Deus de seus antepassados”. O hebraico diz literalmente “seus pais”, fórmula de aliança preservada no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Veja
  rationale: Imperativo singular usado para chamar a atenção. “Veja” conserva a força direta do hebraico em português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz a construção com sufixo masculino singular e a fórmula de aliança dirigida a Israel como interlocutor singular.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: pôs ... diante de você
  rationale: Expressa de maneira natural a ideia de que Deus colocou a terra à disposição de Israel para que entrasse nela.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto de Deuteronômio, designa a terra prometida; “terra” mantém a amplitude do termo hebraico.
- source_word: עֲלֵה
  choice: Suba
  rationale: Mantém a imagem geográfica e o imperativo de avançar para a região montanhosa da terra.
- source_word: רֵשׁ
  choice: tome posse dela
  rationale: O imperativo de ירשׁ envolve entrar ativamente na posse daquilo que Deus concede. O pronome “dela” torna o objeto claro e natural em português.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: conforme ... lhe disse
  rationale: Preserva o sentido básico de “falar/dizer” sem explicitar como promessa aquilo que o contexto apenas implica.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: o Deus de seus pais
  rationale: Conserva a formulação masculina e familiar da aliança presente no hebraico; a alternativa mais abrangente é indicada em nota.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Forma idiomática e direta, em português moderno, para a proibição ligada ao verbo ירא.
- source_word: וְאַל תֵּחָת
  choice: nem se deixe abater
  rationale: חתת transmite a ideia de ser quebrantado, intimidado ou desanimado. A formulação distingue esse estado do medo mencionado na oração anterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o nome da aliança. “Yahweh” representa de modo transparente a forma hebraica e não a substitui por “SENHOR”.
- issue: Fórmula de aliança אֱלֹהֵי אֲבֹתֶיךָ
  choice: o Deus de seus pais
  alternative: o Deus de seus antepassados
  rationale: O substantivo hebraico é masculino plural e integra uma fórmula significativa da aliança. O texto principal preserva essa forma, sem excluir a alternativa semântica indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com tratamento singular por “você”, adequado à leitura brasileira e amplamente compreensível. Os imperativos permanecem diretos; “nem se deixe abater” evita um arcaísmo e preserva a distinção entre temer e perder o ânimo.
