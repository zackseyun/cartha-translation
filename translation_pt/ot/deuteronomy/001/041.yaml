base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: pt
  text: 'Então vocês me responderam: “Pecamos contra Yahweh. Nós mesmos subiremos e lutaremos, conforme tudo o que Yahweh, nosso Deus, nos ordenou.” Então cada homem prendeu ao corpo suas armas de guerra, e vocês, presunçosamente, se atreveram a subir[a] à região montanhosa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se precipitaram a subir” ou “subiram presunçosamente”. O verbo hebraico é raro e indica uma ação excessivamente confiante ou imprudente.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o monte”. Neste contexto, a expressão provavelmente se refere de modo mais amplo à região montanhosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: vocês me responderam
  rationale: A combinação hebraica literalmente diz “responderam e disseram a mim”, mas “me responderam” transmite de modo natural e conciso a introdução da réplica em português.
- source_word: חָטָאנוּ לַיהוָה
  choice: Pecamos contra Yahweh
  rationale: O verbo חטא com ל indica a parte ofendida; “pecar contra” é a formulação idiomática em português. O nome divino é transliterado como “Yahweh”.
- source_word: אֲנַחְנוּ נַעֲלֶה וְנִלְחַמְנוּ
  choice: Nós mesmos subiremos e lutaremos
  rationale: O pronome explícito אֲנַחְנוּ recebe a ênfase “nós mesmos”; “subiremos” preserva o movimento ascendente e “lutaremos” expressa com clareza o sentido militar do nifal de לחם.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: conforme tudo o que ... nos ordenou
  rationale: A formulação mantém tanto a ideia de conformidade quanto o alcance abrangente de כְּכֹל.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: cada homem prendeu ao corpo suas armas de guerra
  rationale: חגר descreve cingir ou fixar equipamento ao corpo. O singular distributivo אִישׁ é preservado como “cada homem”, e כְּלֵי מִלְחָמָה como “armas de guerra”, sem especificar indevidamente armadura ou um tipo de arma.
- source_word: וַתָּהִינוּ
  choice: vocês se atreveram, presunçosamente
  rationale: O verbo raro comunica, no contexto, iniciativa temerária e autoconfiante. A tradução conserva a avaliação negativa sem eliminar a incerteza lexical, registrada em nota.
- source_word: לַעֲלֹת הָהָרָה
  choice: a subir à região montanhosa
  rationale: A forma direcional indica movimento para a área elevada. Neste contexto geográfico, הָהָר pode designar a região montanhosa, não necessariamente um único monte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Nuance moral de וַתָּהִינוּ na tentativa de subida
  choice: se atreveram, presunçosamente
  alternative: se precipitaram; acharam fácil; decidiram subir
  rationale: O contexto imediato apresenta a ação como desobediência autoconfiante depois da sentença divina. A redação assinala essa nuance negativa, enquanto a nota preserva alternativas plausíveis para o verbo raro.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. O plural “vocês” torna explícita a segunda pessoa plural sem regionalismo; “região montanhosa” comunica o provável sentido geográfico sem apagar a leitura literal indicada em nota.
