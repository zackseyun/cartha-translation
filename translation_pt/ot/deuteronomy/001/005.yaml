  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: pt
  text: 'Do outro lado do Jordão[a], na terra de Moabe, Moisés começou a explicar esta lei[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Além do Jordão” ou “Na outra margem do Jordão”. A expressão hebraica depende do ponto de referência geográfico e admite mais de uma tradução natural.
    reason: lexical_alternative
  - marker: b
    text: Ou “esta instrução”. O termo hebraico torá pode significar “lei” ou, de modo mais amplo, “instrução”; aqui foi escolhida “lei” por causa do contexto jurídico da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: Do outro lado do Jordão
  rationale: A expressão situa a região em relação ao Jordão e depende do ponto de referência geográfico. Esta formulação é natural em português e preserva essa relatividade; outras traduções possíveis são registradas em nota.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: na terra de Moabe
  rationale: אֶרֶץ designa aqui uma região geográfico-política. “Terra de Moabe” é uma tradução clara, tradicional e natural.
- source_word: הוֹאִיל
  choice: começou
  rationale: Nesta construção, o verbo indica o início ou a iniciativa de realizar a ação seguinte. “Começou” comunica o sentido de modo idiomático e introduz adequadamente a exposição de Moisés.
- source_word: בֵּאֵר
  choice: a explicar
  rationale: O verbo באר expressa tornar claro, explicar ou expor. “Explicar” é atual e acessível, sem perder o sentido expositivo.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: esta lei
  rationale: תּוֹרָה pode significar “instrução”, mas o contexto pactual e jurídico de Deuteronômio favorece “lei”. A alternativa mais ampla é preservada em nota.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: É a fórmula que introduz o conteúdo do discurso subsequente. “Dizendo:” mantém de maneira natural a ligação formal com as palavras que seguem.
theological_decisions:
- issue: Tradução de תּוֹרָה no contexto da aliança
  choice: esta lei
  alternative: esta instrução; esta Torá
  rationale: “Lei” preserva a dimensão jurídica e pactual da exposição de Moisés, sem negar que תּוֹרָה também tenha o sentido mais amplo de instrução. Trata-se de uma decisão lexical e contextual, não denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha o hebraico sem rigidez, e as notas preservam a ambiguidade geográfica e a amplitude semântica de תּוֹרָה.
