  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: pt
  text: Então partimos de Horebe e atravessamos todo aquele grande e assustador deserto[a] que vocês viram no caminho para a região montanhosa dos amorreus, assim como Yahweh, nosso Deus, nos havia ordenado; e chegamos até Cades-Barneia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande e terrível deserto”. O adjetivo hebraico pode descrever aquilo que inspira medo, assombro ou pavor.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַנִּסַּע
  choice: partimos
  rationale: O verbo נסע, neste contexto de deslocamento, indica levantar acampamento e iniciar a jornada. “Partimos” comunica isso de modo natural e conciso.
- source_word: מֵחֹרֵב
  choice: de Horebe
  rationale: Mantém o nome geográfico em sua forma portuguesa tradicional e traduz diretamente a preposição מִן.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: atravessamos todo ... deserto
  rationale: Com אֵת e a totalidade do deserto como objeto, הלך descreve o percurso através da região. “Atravessamos” expressa naturalmente essa relação em português.
- source_word: הַמִּדְבָּר
  choice: deserto
  rationale: No contexto da jornada de Israel, מִדְבָּר designa uma região árida e pouco habitada. “Deserto” é claro e corrente em português, sem exigir a ideia de completa ausência de vida.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: grande e assustador
  rationale: גָּדוֹל significa “grande”; נוֹרָא descreve aquilo que provoca temor, pavor ou reverência. “Assustador” conserva aqui a força experiencial do percurso sem atribuir maldade ao deserto.
- source_word: אֲשֶׁר רְאִיתֶם
  choice: que vocês viram
  rationale: Traduz diretamente a oração relativa e mantém o apelo de Moisés à experiência dos ouvintes.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: no caminho para a região montanhosa dos amorreus
  rationale: דֶּרֶךְ indica o caminho ou percurso, e הַר tem aqui sentido regional e coletivo, mais bem expresso por “região montanhosa” do que por uma única montanha.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: assim como ... nos havia ordenado
  rationale: כַּאֲשֶׁר marca conformidade com a ordem divina. O mais-que-perfeito deixa clara, em português, a anterioridade da ordem em relação à jornada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Tradução direta do substantivo com o sufixo pronominal da primeira pessoa do plural.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Cades-Barneia
  rationale: Emprega a forma portuguesa reconhecível do nome geográfico composto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico traz explicitamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Sentido de נוֹרָא aplicado ao deserto
  choice: assustador
  alternative: terrível; que inspira temor
  rationale: O adjetivo pode abranger medo, pavor ou assombro. “Assustador” se ajusta ao perigo do deserto, enquanto a nota preserva a amplitude lexical e evita resolver em excesso a nuance.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Usa “vocês” para o plural dirigido à assembleia, evita construções excessivamente literais e conserva os nomes próprios em formas reconhecíveis, mantendo “Yahweh” conforme a decisão de tradução do nome divino.
