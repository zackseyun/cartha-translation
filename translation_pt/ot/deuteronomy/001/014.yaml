  yaml_path: translation/ot/deuteronomy/001/014.yaml
  text: And you answered me and said[a], ‘The thing that you have spoken is good for us to do.’
translation:
  language: pt
  text: 'E vocês me responderam e disseram: “É bom fazer o que você disse.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲנוּ אֹתִי וַתֹּאמְרוּ
  choice: E vocês me responderam
  rationale: A expressão hebraica coordena literalmente “responderam-me e disseram”, uma fórmula discursiva que em português natural pode ser condensada em “me responderam” sem perda do sentido.
- source_word: טוֹב
  choice: É bom
  rationale: Mantém a avaliação positiva direta e não acrescenta nuances como “correto” ou “agradável”.
- source_word: הַדָּבָר אֲשֶׁר דִּבַּרְתָּ
  choice: o que você propôs
  rationale: דָּבָר designa aqui a medida que Moisés acabara de apresentar; “o que você propôs” comunica naturalmente esse referente contextual, enquanto o verbo “propôs” representa o sentido pragmático de דִּבַּרְתָ neste contexto.
- source_word: לַעֲשׂוֹת
  choice: fazer
  rationale: O infinitivo expressa a execução da proposta; “fazer” preserva a concisão e é idiomático em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A fórmula hebraica redundante foi vertida de modo idiomático, preservando a resposta direta e a aprovação da proposta.
