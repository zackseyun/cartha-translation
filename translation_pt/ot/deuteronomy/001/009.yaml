  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: pt
  text: 'E, naquele tempo, eu lhes disse: “Não posso carregá-los sozinho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂאֵת אֶתְכֶם
  choice: carregá-los
  rationale: Preserva a metáfora hebraica de suportar ou levar o povo, que neste contexto se refere ao peso da liderança e de suas demandas.
- source_word: לְבַדִּי
  choice: sozinho
  rationale: Expressa de modo natural e direto que Moisés não conseguia assumir sem auxílio toda a carga do povo.
- source_word: לֵאמֹר
  choice: introdução por dois-pontos
  rationale: O infinitivo hebraico introduz o conteúdo da fala; em português atual, os dois-pontos cumprem essa função naturalmente, sem o redundante “dizendo”.
theological_decisions:
- issue: Natureza da incapacidade declarada por Moisés
  choice: Manter a metáfora ampla “carregá-los”
  alternative: Explicitar como “liderá-los” ou “julgar suas causas”
  rationale: O hebraico não restringe aqui a carga a uma única função; a metáfora preserva a amplitude e a ligação com o contexto.
translation_notes:
  register: Português moderno, digno e de leitura natural. Emprega “lhes” e “carregá-los” com referência ao povo; omite o pleonástico “dizendo” por equivalência idiomática, sem perder conteúdo proposicional.
