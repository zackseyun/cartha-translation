base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: pt
  text: Como poderei eu, sozinho, suportar o incômodo de vocês, a carga de vocês e as disputas[a] de vocês?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contendas” ou “causas judiciais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Como poderei
  rationale: Introduz uma pergunta retórica que expressa a impossibilidade prática ou a extrema dificuldade da tarefa; o futuro modal soa natural em português.
- source_word: אֶשָּׂא
  choice: suportar
  rationale: O verbo נשׂא significa literalmente levantar ou carregar e, neste contexto, assumir e aguentar responsabilidades; “suportar” combina naturalmente com os três complementos abstratos.
- source_word: לְבַדִּי
  choice: eu sozinho
  rationale: Preserva a ênfase de que Moisés não consegue desempenhar essa função sem ajuda.
- source_word: טָרְחֲכֶם
  choice: o trabalho que vocês me dão
  rationale: טֹרַח designa trabalho penoso, incômodo ou fadiga. A formulação explicita de modo natural que se trata do esforço imposto a Moisés pelo povo e distingue o termo do substantivo seguinte.
- source_word: מַשַּׂאֲכֶם
  choice: a carga que representam
  rationale: מַשָּׂא é carga ou peso. A formulação conserva a metáfora e comunica em português atual o peso coletivo que recaía sobre Moisés.
- source_word: רִיבְכֶם
  choice: as suas disputas
  rationale: רִיב pode indicar contenda, disputa ou causa judicial; “disputas” preserva tanto a dimensão interpessoal quanto a possível dimensão jurídica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A pergunta retórica e a tríade hebraica foram preservadas; formulações relacionais naturais evitam a sequência pouco idiomática “seu trabalho, sua carga” sem eliminar as imagens do original.
