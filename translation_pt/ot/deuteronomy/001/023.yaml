  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: pt
  text: A proposta me pareceu boa, por isso escolhi doze homens dentre vocês, um de cada tribo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי הַדָּבָר
  choice: A proposta me pareceu boa
  rationale: A construção hebraica indica que o assunto ou proposta recebeu a aprovação pessoal de Moisés. Em português atual, esta formulação transmite naturalmente tanto o valor avaliativo de יטב quanto o sentido idiomático de בְּעֵינַי, sem conservar um decalque pouco natural como “foi boa aos meus olhos”.
- source_word: הַדָּבָר
  choice: a proposta
  rationale: Neste contexto, דָּבָר retoma a sugestão apresentada no versículo anterior. “Proposta” torna clara a referência contextual sem alterar seu conteúdo.
- source_word: וָאֶקַּח
  choice: escolhi
  rationale: Embora לקח signifique literalmente “tomar”, aqui descreve a seleção dos representantes. “Escolhi” é o equivalente contextual mais natural em português.
- source_word: מִכֶּם
  choice: dentre vocês
  rationale: A preposição מן indica que os homens foram tirados do conjunto do povo. “Dentre vocês” expressa com clareza essa origem interna ao grupo.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: doze homens
  rationale: A expressão designa diretamente doze homens adultos; a tradução mantém a referência masculina explícita do hebraico.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: um de cada tribo
  rationale: 'A construção tem sentido distributivo: um homem representando cada tribo. Como “homens” já aparece imediatamente antes, a omissão de sua repetição produz português mais natural sem perda de sentido.'
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A tradução prioriza equivalência ótima: preserva a avaliação pessoal de Moisés, mas verte os idiomas hebraicos por expressões correntes em português.'
