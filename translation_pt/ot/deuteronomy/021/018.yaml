base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: pt
  text: Se[a] um homem tiver um filho teimoso e rebelde, que não atende à voz do pai nem à voz da mãe[b], e, embora eles o disciplinem[c], não lhes dá ouvidos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando um homem tiver...”. A fórmula jurídica hebraica admite tanto “se” como “quando”.'
    reason: alternative_reading
  - marker: b
    text: Em hebraico, “à voz do pai e à voz da mãe”. “Voz” refere-se aqui à instrução dotada de autoridade.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e eles o disciplinarem”. A conjunção hebraica pode ser entendida simplesmente como “e”, embora o contexto também permita o sentido concessivo “embora”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz uma condição típica da formulação casuística das leis. “Se” é natural em português; “quando” também é possível.
- source_word: יִהְיֶה לְאִישׁ
  choice: um homem tiver
  rationale: A construção hebraica de existência com dativo expressa posse; esta é a equivalência idiomática mais clara em português.
- source_word: בֵּן
  choice: filho
  rationale: O substantivo hebraico designa especificamente um filho do sexo masculino.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: teimoso e rebelde
  rationale: A dupla descreve resistência persistente e insubmissão ativa, preservando a intensificação dos termos coordenados.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקוֹל
  choice: não atende à voz
  rationale: שׁמע, nesse contexto, implica escutar com obediência. “Atender à voz” conserva a imagem hebraica sem sugerir mera percepção auditiva.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: embora eles o disciplinem
  rationale: יסר denota correção ou disciplina parental. O contexto favorece valor concessivo, embora a conjunção também possa ser traduzida simplesmente por “e”.
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: não lhes dá ouvidos
  rationale: Expressa de modo idiomático a recusa em atender ou obedecer, mantendo a repetição sem produzir português rígido.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Preserva-se “voz” na primeira ocorrência para refletir o idioma hebraico, enquanto “dá ouvidos” comunica naturalmente a implicação de acatar. A frase permanece aberta com vírgula porque o período legal continua no versículo seguinte.
