base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: pt
  text: Mas deverá reconhecer o primogênito, o filho da mulher menos amada[a], dando-lhe uma porção dupla[b] de tudo o que o pai possuir, pois ele é o primeiro fruto do vigor de seu pai[c]; a ele pertence o direito de primogenitura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da mulher odiada” ou “da mulher não amada”. O termo hebraico pode significar literalmente “odiada”, mas, neste contraste, pode indicar a esposa menos favorecida.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma boca de dois”, expressão idiomática que significa duas partes, isto é, uma porção dupla.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o princípio da força de seu pai”. A expressão se refere ao primeiro filho como a primeira manifestação da força geradora do pai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: deverá reconhecer
  rationale: O hifil de נכר indica aqui o reconhecimento jurídico da condição do verdadeiro primogênito, não apenas uma identificação perceptiva.
- source_word: הַבְּכֹר
  choice: o primogênito
  rationale: Termo familiar e jurídico padrão que preserva a condição ligada à herança.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: o filho da mulher menos amada
  rationale: No contraste conjugal do contexto, שְׂנוּאָה pode ter sentido relacional comparativo. Esta formulação mantém o contraste sem necessariamente afirmar ódio ativo.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: dando-lhe uma porção dobrada
  rationale: A expressão idiomática literalmente relacionada a 'boca de dois' designa duas partes ou uma porção dupla na herança.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: de tudo o que possuir
  rationale: Expressa naturalmente, no contexto sucessório, tudo o que se encontra na posse do pai, isto é, seu patrimônio.
- source_word: רֵאשִׁית אֹנוֹ
  choice: o primeiro fruto do seu vigor
  rationale: Preserva a imagem do primeiro descendente como primeira manifestação da força geradora do pai.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: o direito de primogenitura
  rationale: Comunica de modo conciso o direito legal vinculado à condição de primogênito.
- source_word: כִּי ... כִּי
  choice: Mas ... pois
  rationale: O primeiro כִּי é adversativo em relação à preferência proibida no versículo anterior; o segundo apresenta a razão da norma.
theological_decisions:
- issue: Sentido de שְׂנוּאָה no contexto jurídico matrimonial
  choice: mulher menos amada
  alternative: mulher odiada; mulher não amada
  rationale: A formulação comparativa preserva a tensão relacional com a mulher amada e evita impor ao hebraico uma afirmação inequívoca de hostilidade emocional ativa.
translation_notes:
  register: Português atual, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A redação mantém o caráter jurídico do versículo e preserva as imagens hebraicas relevantes, esclarecendo-as em notas.
