base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: pt
  text: E, no dia em que repartir entre seus filhos, como herança, aquilo que lhe pertence, não poderá reconhecer como primogênito o filho da mulher amada em preferência ao filho da mulher odiada[a], que é o primogênito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da mulher não amada” ou “da mulher menos amada”. O hebraico contrasta literalmente “amada” e “odiada”, mas, em contextos familiares e jurídicos, o segundo termo pode indicar alguém relativamente menos favorecida, e não necessariamente objeto de aversão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: E, no dia em que
  rationale: Mantém a moldura temporal e jurídica do hebraico em português natural.
- source_word: הַנְחִילוֹ אֶת בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: repartir entre seus filhos como herança aquilo que lhe pertence
  rationale: Expressa o causativo de נחל e conserva a menção explícita aos filhos e ao patrimônio que pertence ao pai, sem a formulação pouco idiomática de 'dar seus filhos como herança'.
- source_word: לֹא יוּכַל
  choice: não poderá
  rationale: No contexto legal, indica falta de direito ou permissão, não simples incapacidade física.
- source_word: לְבַכֵּר
  choice: dar ... a condição de primogênito
  rationale: Comunica a atribuição jurídica da posição e dos direitos de primogenitura.
- source_word: בֶּן הָאֲהוּבָה
  choice: filho da mulher amada
  rationale: Preserva o particípio passivo 'amada'; 'mulher' é suficiente e natural no contexto das esposas mencionado no versículo anterior.
- source_word: עַל פְּנֵי
  choice: em detrimento de
  rationale: Explicita a preferência indevida ou precedência jurídica indicada pela expressão nesse contexto.
- source_word: בֶן הַשְּׂנוּאָה
  choice: filho da mulher odiada
  rationale: Retém no texto principal o contraste forte e literal entre 'amada' e 'odiada', deixando a possível nuance comparativa para a nota.
- source_word: הַבְּכֹר
  choice: que é o primogênito
  rationale: A oração relativa deixa claro que o filho da mulher odiada é o primogênito de fato.
theological_decisions:
- issue: Contraste relacional no contexto de uma família poligínica
  choice: mulher amada / mulher odiada
  alternative: mulher amada / mulher não amada ou menos amada
  rationale: O hebraico apresenta um par antitético forte. A tradução principal preserva essa tensão, enquanto a nota registra que, nesse tipo de contexto familiar e jurídico, 'odiada' pode ter sentido comparativo.
translation_notes:
  register: Português moderno, digno e acessível, com formulação jurídica clara. A ordem foi levemente ajustada para fluência, sem apagar a estrutura e as distinções lexicais do hebraico.
