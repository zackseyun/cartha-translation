base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: pt
  text: Mas, se você não a desejar, deixe-a partir em liberdade[a]. De modo algum a venda por dinheiro, nem a trate como mercadoria[b], pois você a humilhou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “mande-a embora para si mesma”; isto é, deixe-a seguir em liberdade, por conta própria.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nem a explore para obter lucro”. O verbo hebraico é raro e provavelmente transmite a ideia de tratar alguém como objeto de uso econômico.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pois você a violou”. O verbo hebraico pode significar afligir, humilhar ou violar sexualmente, conforme o contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Mas, se
  rationale: Introduz a condição em contraste com a situação prevista nos versículos anteriores; a forma breve é natural em português e não precisa reproduzir literalmente o idiomatismo hebraico וְהָיָה.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: você não tiver prazer nela
  rationale: חפץ expressa desejo, agrado ou prazer. A formulação preserva o aspecto afetivo sem acrescentar a ideia temporal de “já não”, ausente do hebraico.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: deixe-a ir livre
  rationale: A expressão, literalmente “mande-a embora para si mesma”, comunica que ela deve ser solta e ficar livre para seguir seu próprio caminho.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: De modo algum a venda por dinheiro
  rationale: “De modo algum” representa a ênfase da construção hebraica com infinitivo absoluto e verbo finito; “dinheiro” é o equivalente moderno e claro de כֶּסֶף neste contexto.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: nem a trate como mercadoria
  rationale: O verbo raro parece indicar utilização dominadora ou exploração econômica. Em paralelo com a proibição de vendê-la, esta formulação preserva a ideia de reduzi-la a objeto de comércio sem restringir o sentido à escravização formal.
- source_word: תַּחַת אֲשֶׁר
  choice: pois
  rationale: A construção apresenta a razão das proibições; “pois” transmite de modo natural essa relação causal.
- source_word: עִנִּיתָהּ
  choice: você a humilhou
  rationale: O piel de ענה pode indicar afligir, humilhar ou violar sexualmente. “Humilhou” mantém a gravidade e a amplitude sem fixar no texto principal uma especificação discutida.
theological_decisions:
- issue: Força ética da lei acerca da mulher capturada
  choice: 'Apresentar o versículo como limitação do poder do homem: ele deve libertar a mulher e não pode vendê-la nem explorá-la depois de tê-la humilhado.'
  alternative: Descrever a situação apenas como divórcio consensual, ou identificar explicitamente o ato como estupro no texto principal.
  rationale: O hebraico proíbe a mercantilização da mulher e fundamenta isso no dano que lhe foi causado. A tradução mantém tanto o contexto coercitivo quanto a amplitude lexical de ענה, sem suavizá-lo nem torná-lo mais específico do que a forma hebraica exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” no singular. A redação mantém o tom jurídico direto, dá expressão à proibição enfática e preserva em nota a ambiguidade dos dois verbos raros ou semanticamente amplos.
