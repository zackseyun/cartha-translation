  text: וּ֠/רְגָמֻ/הוּ כָּל אַנְשֵׁ֨י עִיר֤/וֹ בָֽ/אֲבָנִים֙ וָ/מֵ֔ת וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּ֑/ךָ וְ/כָל יִשְׂרָאֵ֖ל יִשְׁמְע֥וּ וְ/יִרָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: pt
  text: Então todos os homens da cidade dele o apedrejarão, e ele morrerá. Assim você eliminará o mal do seu meio, e todo o Israel ouvirá e terá medo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְגָמֻהוּ
  choice: o apedrejarão
  rationale: Em contexto jurídico, רגם designa a execução por apedrejamento; a forma verbal portuguesa é clara e natural.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: todos os homens da cidade dele
  rationale: אַנְשֵׁי é explicitamente masculino, «homens de»; a tradução conserva essa especificidade sem ampliá-la para uma afirmação doutrinária.
- source_word: בָאֲבָנִים
  choice: apedrejarão
  rationale: O meio da execução, «com pedras», está incorporado idiomaticamente no verbo «apedrejar» em português, evitando a redundância pouco natural «apedrejar com pedras».
- source_word: וָמֵת
  choice: e ele morrerá
  rationale: Mantém a sequência e o resultado jurídicos da ação, sem convertê-los explicitamente em finalidade.
- source_word: וּבִעַרְתָּ
  choice: você eliminará
  rationale: Na fórmula jurídica de Deuteronômio, בער significa retirar ou extirpar o mal da comunidade, não queimá-lo literalmente; «eliminar» comunica isso em linguagem atual e solene.
- source_word: הָרָע
  choice: o mal
  rationale: Preserva a categoria moral e jurídica abstrata da fórmula hebraica recorrente.
- source_word: מִקִּרְבֶּךָ
  choice: do seu meio
  rationale: Reproduz de modo transparente a expressão comunitária hebraica e mantém o singular dirigido a Israel.
- source_word: יִשְׁמְעוּ
  choice: ouvirá
  rationale: Traduz diretamente o verbo «ouvir»; o contexto fornece naturalmente o sentido de tomar conhecimento do ocorrido.
- source_word: וְיִרָאוּ
  choice: e terá medo
  rationale: Expressa o temor provocado pela advertência judicial, sem reduzi-lo a reverência nem explicitar além do hebraico sua função dissuasória.
theological_decisions:
- issue: Termo cívico masculino no contexto jurídico
  choice: todos os homens da cidade dele
  alternative: todo o povo da cidade dele
  rationale: O hebraico usa uma expressão explicitamente masculina. Preservá-la reflete a redação da fonte sem formular uma tese mais ampla sobre papéis de gênero.
- issue: Fórmula de eliminação do mal em Deuteronômio
  choice: eliminará o mal do seu meio
  alternative: expurgará o mal do seu meio
  rationale: «Eliminar» preserva a ideia judicial e comunitária de remover o mal, em português atual e amplamente compreensível; «expurgar» seria mais formal, mas menos comum.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O futuro do presente conserva a força prescritiva e sequencial da legislação. Não se acrescentou nota à expressão masculina porque a tradução principal já reproduz literalmente essa característica do hebraico.
