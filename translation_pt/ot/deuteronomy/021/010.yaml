  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: pt
  text: Quando você sair para a guerra contra os seus inimigos, e Yahweh, seu Deus, os entregar em suas mãos[a], e você levar cativos dentre eles[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “o entregar em sua mão”. O pronome singular provavelmente se refere coletivamente à força inimiga; por isso, traduz-se “os” em português.
    reason: lexical_alternative
  - marker: b
    text: Ou “e capturar prisioneiros dentre eles”. O hebraico emprega um verbo e um substantivo da mesma raiz para descrever a tomada de cativos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Introduz aqui a situação típica de uma lei casuística. “Quando” expressa com naturalidade esse enquadramento sem transformar a frase numa afirmação de que o caso necessariamente ocorrerá.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: você sair para a guerra
  rationale: Preserva o sentido concreto de יָצָא, “sair”, e traduz a expressão militar de modo natural e digno em português.
- source_word: עַל אֹיְבֶיךָ
  choice: contra os seus inimigos
  rationale: Em contexto de hostilidade, עַל tem o sentido natural de “contra”; o plural e o sufixo de segunda pessoa são mantidos.
- source_word: וּנְתָנוֹ
  choice: e os entregar
  rationale: נתן significa literalmente “dar”, mas, neste contexto militar e com בְּיָדֶךָ, “entregar” comunica melhor a ideia de pôr o inimigo sob o poder de Israel. O sufixo hebraico é singular e coletivo, retomando a força inimiga, enquanto o português emprega naturalmente o plural “os”.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Mantém o nome divino expresso no hebraico e traduz diretamente a fórmula pactual “seu Deus”.
- source_word: בְּיָדֶךָ
  choice: em suas mãos
  rationale: Conserva a imagem hebraica de colocar alguém na mão, isto é, sob o poder de outra pessoa. O plural “mãos” é a forma idiomática corrente em português.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: e você levar cativos dentre eles
  rationale: Comunica que prisioneiros são tomados da força inimiga e mantém o campo lexical de cativeiro presente na construção cognata hebraica, sem produzir uma repetição artificial em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta o tetragrama como nome próprio. “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título.
- issue: Número do objeto em וּנְתָנוֹ
  choice: os entregar
  alternative: o entregar
  rationale: Embora o sufixo hebraico esteja no singular, seu referente mais provável é coletivamente o conjunto dos inimigos. O plural em português deixa clara essa referência sem alterar o sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o tom jurídico-narrativo do hebraico, preserva o nome Yahweh e conserva a imagem idiomática das mãos sem rigidez excessiva.
