  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: pt
  text: Se na terra que Yahweh, teu Deus, te está dando para tomares posse dela for encontrado um homem assassinado[a], caído em campo aberto, sem que se saiba quem o golpeou,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pessoa assassinada”. O hebraico está no masculino singular (“um homem assassinado”), embora o princípio da lei trate, de modo geral, de um homicídio cujo autor é desconhecido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz a condição de uma lei casuística; “Se” é a formulação jurídica mais natural em português, embora “Quando” também seja possível.
- source_word: יִמָּצֵא
  choice: for encontrado
  rationale: O nifal de מצא tem sentido passivo neste contexto e é expresso diretamente pelo futuro do subjuntivo português após “Se”.
- source_word: חָלָל
  choice: um homem assassinado
  rationale: O substantivo indica alguém morto violentamente e está no masculino singular. “Assassinado” comunica a morte causada por outra pessoa sem reduzi-lo a mero cadáver.
- source_word: בָּאֲדָמָה
  choice: na terra
  rationale: A oração relativa seguinte mostra que אֲדָמָה designa o território dado a Israel, não apenas o solo.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: que Yahweh, seu Deus, está dando a vocês para dela tomarem posse
  rationale: Preserva o aspecto progressivo do particípio נֹתֵן e o sentido possessório de ירשׁ. O hebraico passa do destinatário singular ao tratamento comunitário implícito; em português, “a vocês” explicita de modo natural a referência coletiva a Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, distinguindo-o do título “Senhor”.
- source_word: נֹפֵל
  choice: caído
  rationale: Mantém de perto o particípio hebraico e descreve o estado em que a vítima é encontrada.
- source_word: בַּשָּׂדֶה
  choice: em campo aberto
  rationale: Expressa naturalmente um local fora da povoação; “campo” sozinho poderia sugerir especificamente uma área cultivada.
- source_word: לֹא נוֹדַע
  choice: sem que se saiba
  rationale: Reproduz de modo idiomático a construção passiva impessoal e liga claramente a circunstância ao caso jurídico.
- source_word: מִי הִכָּהוּ
  choice: quem o matou
  rationale: Embora נכה signifique literalmente “golpear”, aqui o golpe é fatal, como demonstra חָלָל. “Matou” evita em português a possível leitura de que apenas uma agressão não fatal esteja em questão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome divino pessoal. “Yahweh” preserva sua função de nome próprio sem substituí-lo por um título.
- issue: Referência masculina em חָלָל
  choice: um homem assassinado
  alternative: uma pessoa assassinada; alguém assassinado
  rationale: A forma hebraica é masculina singular. A tradução principal conserva essa forma, enquanto a nota registra que o princípio jurídico pode ser entendido de maneira geral.
- issue: Agente desconhecido em מִי הִכָּהוּ
  choice: quem o matou
  alternative: quem o golpeou
  rationale: O contexto estabelece uma morte violenta, mas não identifica o responsável. A tradução comunica o resultado fatal sem acrescentar identidade, motivo ou grau jurídico de culpabilidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O plural “vocês” torna natural a referência coletiva a Israel, embora o hebraico empregue formas de segunda pessoa masculina singular. A frase permanece aberta com vírgula porque o versículo introduz a condição desenvolvida nos versículos seguintes.
