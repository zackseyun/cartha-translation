  text: וְ/אַתָּ֗ה תְּבַעֵ֛ר הַ/דָּ֥ם הַ/נָּקִ֖י מִ/קִּרְבֶּ֑/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: pt
  text: Assim, expurgarás do teu meio o sangue inocente[a], pois farás o que é reto aos olhos de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “removerás do teu meio o sangue inocente”. A expressão hebraica “sangue inocente” pode incluir a responsabilidade da comunidade por um derramamento de sangue que ainda não foi expiado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Assim
  rationale: A conjunção com o pronome independente introduz enfaticamente a conclusão da instrução anterior. “Assim” expressa essa força discursiva em português natural.
- source_word: תְּבַעֵר
  choice: eliminarás
  rationale: No piel, בער indica retirar ou expurgar algo nocivo da comunidade. “Eliminarás” preserva o sentido jurídico e comunitário sem sugerir literalmente a ação de queimar.
- source_word: הַדָּם הַנָּקִי
  choice: o sangue inocente
  rationale: Mantém a imagem hebraica e sua possível referência tanto ao sangue injustamente derramado quanto à responsabilidade comunitária decorrente desse derramamento.
- source_word: מִקִּרְבֶּךָ
  choice: do teu meio
  rationale: Reproduz a expressão comunitária e judicial recorrente em Deuteronômio, mantendo o endereço na segunda pessoa do singular.
- source_word: כִּי
  choice: pois
  rationale: Representa a relação causal ou explicativa mais provável, sem tornar a conexão excessivamente rígida.
- source_word: תַעֲשֶׂה
  choice: farás
  rationale: O imperfeito possui aqui força prospectiva e prescritiva no contexto legal.
- source_word: הַיָּשָׁר
  choice: o que é reto
  rationale: O adjetivo substantivado designa aquilo que corresponde ao padrão moral correto; a formulação é natural e digna em português.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica da avaliação divina e translitera diretamente o nome da aliança.
theological_decisions:
- issue: Sentido de “sangue inocente”
  choice: Manter a expressão concreta “o sangue inocente”
  alternative: Explicitar “a culpa pelo sangue inocente”
  rationale: O texto hebraico menciona literalmente o sangue inocente, mas, no contexto, pode incluir a culpa comunitária por homicídio não expiado. A tradução conserva essa tensão e a nota informa a implicação possível.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta o tetragrama como nome próprio; “Yahweh” preserva sua função de nome da aliança sem substituí-lo por um título.
- issue: Relação expressa por כִּי
  choice: 'Causal ou explicativa: “pois”'
  alternative: 'Temporal ou condicional: “quando”'
  rationale: A leitura causal liga a eliminação da responsabilidade pelo sangue ao cumprimento do que é reto, embora a forma hebraica permita alguma sobreposição com uma leitura circunstancial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservam-se a segunda pessoa do singular do hebraico, a imagem jurídica de “sangue inocente” e a metáfora “aos olhos de”.
