  source_fidelity: O texto principal preserva adequadamente a estrutura causal, o singular de segunda pessoa, a imagem jurídica de "sangue inocente" e o nome divino Yahweh. Contudo, "eliminarás" pode sugerir a eliminação física do próprio inocente ou de seu sangue, e não comunica tão claramente a noção jurídica de purgar/remover a culpa ou a responsabilidade decorrente do sangue derramado.
  naturalness: A redação é clara e de registro apropriado. "Expurgarás" é uma opção mais precisa para o registro jurídico-cultual do contexto, embora mantenha dignidade e inteligibilidade. A nota atual contém "dentre vocês", introduzindo indevidamente a segunda pessoa do plural em contraste com o singular do versículo.
  terminology: '"Sangue inocente", "do teu meio", "o que é reto" e "aos olhos de Yahweh" são escolhas fiéis e consistentes. Mantém-se Yahweh como representação do tetragrama.'
  issues:
  - severity: medium
    issue: '"eliminarás" é semanticamente pouco específico neste contexto.'
    rationale: Embora possa significar remover, em português contemporâneo também pode evocar destruir ou matar. Para o hebraico תְּבַעֵר, no contexto de responsabilidade comunitária por sangue derramado, "expurgarás" comunica melhor a remoção/purgação jurídica sem explicitar além do texto.
  - severity: medium
    issue: A alternativa na nota muda "teu" para "vocês".
    rationale: O hebraico dirige-se à segunda pessoa masculina singular, e a tradução principal preserva isso. A nota deve manter o mesmo referente e não introduzir plural sem base textual.
