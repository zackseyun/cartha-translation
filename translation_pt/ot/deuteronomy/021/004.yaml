base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: pt
  text: Então os anciãos daquela cidade farão a novilha descer até um vale de curso permanente[a], que não é lavrado nem semeado; e ali, no vale, quebrarão a nuca da novilha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma ravina de curso permanente”. A expressão hebraica pode referir-se a um vale ou curso de água de fluxo duradouro; também tem sido entendida como “vale escarpado”. O sentido exato de איתן é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: levarão ... até
  rationale: O hifil de ירד indica fazer descer ou levar para baixo. Em português, “levarão ... até” expressa naturalmente o deslocamento ao vale; a topografia já sugere a descida.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: os anciãos daquela cidade
  rationale: Equivalente direto e convencional do sintagma hebraico, adequado ao contexto jurídico.
- source_word: הָעֶגְלָה
  choice: a novilha
  rationale: עגלה designa uma fêmea bovina jovem; “novilha” é preciso, corrente e apropriado ao rito descrito.
- source_word: אֶל נַחַל אֵיתָן
  choice: até um vale de corrente perene
  rationale: נחל pode designar vale, ravina, leito de torrente ou curso de água, enquanto איתן sugere permanência ou continuidade. A formulação comunica o relevo e o caráter duradouro da corrente sem usar o empréstimo menos acessível “wadi”.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: que não seja lavrado nem semeado
  rationale: Os passivos hebraicos referem-se ao trabalho agrícola. “Lavrado nem semeado” preserva o paralelismo e soa natural em português.
- source_word: וְעָרְפוּ
  choice: quebrarão a nuca
  rationale: ערף descreve a ação ritual específica feita na parte posterior do pescoço, não simplesmente o abate nem necessariamente a decapitação. “Quebrar a nuca” mantém essa particularidade.
- source_word: שָׁם ... בַּנָּחַל
  choice: ali, no vale
  rationale: Preserva tanto o advérbio locativo quanto a repetição de נחל, de modo claro e sem redundância excessiva.
