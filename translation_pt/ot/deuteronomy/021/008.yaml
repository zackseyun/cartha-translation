  terminology: “Expiação”, “resgataste” e “culpa de sangue” mantêm o campo semântico cultual e jurídico do texto. “Yahweh” é usado de forma consistente como nome próprio no vocativo. A nota está corretamente ancorada ao fim da oração que interpreta e distingue com transparência a formulação mais literal.
