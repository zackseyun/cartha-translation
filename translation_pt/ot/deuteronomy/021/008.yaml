base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: pt
  text: Faz expiação pelo teu povo Israel, que resgataste, ó Yahweh, e não deixes que a culpa pelo sangue inocente permaneça no meio do teu povo Israel. Assim, a culpa de sangue será expiada em favor deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e o sangue será expiado em favor deles”. O hebraico emprega “o sangue” como expressão jurídica para a responsabilidade decorrente do derramamento de sangue.'
    reason: alternativa lexical e esclarecimento do idioma jurídico hebraico
lexical_decisions:
- source_word: כַּפֵּר
  choice: Faz expiação
  rationale: O imperativo de כפר, neste contexto cultual e jurídico, pede uma formulação que preserve a ideia de remover a culpa mediante expiação. “Faz expiação” é corrente, digna e mais precisa do que “cobre”.
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: pelo teu povo Israel
  rationale: A preposição לְ indica aqueles em favor de quem se pede a expiação; “pelo teu povo Israel” é natural em português.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: que resgataste
  rationale: פדה expressa resgate ou libertação mediante redenção. “Resgataste” conserva esse sentido e soa natural no contexto.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Mantém o nome divino como nome próprio e, com “ó”, marca de modo natural o vocativo da oração.
- source_word: וְאַל תִּתֵּן דָּם נָקִי בְּקֶרֶב
  choice: e não deixes que a culpa pelo sangue inocente permaneça no meio
  rationale: Embora נתן signifique literalmente “dar” ou “pôr”, aqui a petição diz respeito a não permitir que a responsabilidade pelo derramamento de sangue inocente recaia ou permaneça na comunidade. A formulação explicita o valor jurídico da expressão sem perder a imagem comunitária de בְּקֶרֶב.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: Assim, a culpa de sangue será expiada em favor deles
  rationale: O Nifal de כפר tem sentido passivo ou resultativo. “Assim” comunica a consequência do rito; “culpa de sangue” torna inteligível o emprego jurídico de הַדָּם, enquanto a nota preserva a forma mais literal.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva o caráter de nome pessoal do Tetragrama, sem substituí-lo por um título.
- issue: Sentido jurídico de הַדָּם na oração final
  choice: culpa de sangue
  alternative: o sangue
  rationale: O contexto trata da responsabilidade comunitária decorrente de um homicídio não solucionado. “Culpa de sangue” comunica esse sentido jurídico em português, e a tradução mais literal é preservada em nota para não ocultar a forma hebraica.
- issue: Relação entre o rito e a expiação
  choice: será expiada em favor deles
  alternative: será perdoada a eles quanto ao sangue
  rationale: A forma passiva de כפר é mantida sem especificar além do texto quem efetua a expiação nem impor uma explicação doutrinária do mecanismo ritual.
translation_notes:
  register: 'Português moderno, claro e digno, com formas de segunda pessoa do singular coerentes com a oração dirigida a Yahweh. A redação busca equivalência ótima: mantém o vocabulário cultual de “expiação”, mas esclarece o valor jurídico de “sangue” no contexto.'
