  source_fidelity: A tradução representa adequadamente a oração hebraica. “Faz expiação” corresponde ao imperativo כַּפֵּר; “pelo teu povo Israel, que resgataste” preserva o beneficiário da expiação e a oração relativa אֲשֶׁר פָּדִיתָ. A formulação “não deixes que a culpa pelo sangue inocente permaneça” transmite idiomaticamente o pedido jurídico expresso por וְאַל־תִּתֵּן דָּם נָקִי בְּקֶרֶב, sem afirmar que se conheça o autor do homicídio. Na oração final, “a culpa de sangue será expiada em favor deles” explicita de modo justificável o valor forense de הַדָּם no contexto, e a nota conserva a expressão literal.
