  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: pt
  text: Ela tirará de si as roupas do seu cativeiro[a], ficará em sua casa e chorará por seu pai e por sua mãe durante um mês inteiro. Depois disso, você poderá unir-se a ela e tornar-se seu marido, e ela será sua esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as roupas que usava quando foi capturada”.'
    reason: A expressão hebraica significa literalmente “as roupas do seu cativeiro” e pode designar as roupas associadas à sua condição de cativa ou as que vestia no momento da captura.
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: Ela tirará
  rationale: O hifil de סור expressa remoção; “tirará” é natural em português para roupas e mantém a força prescritiva do texto legal.
- source_word: שִׂמְלַת שִׁבְיָהּ
  choice: as roupas do seu cativeiro
  rationale: 'Preserva a construção hebraica e sua ambiguidade: podem ser as roupas ligadas à condição de cativa ou aquelas que usava ao ser capturada.'
- source_word: מֵעָלֶיהָ
  choice: de sobre si
  rationale: Reflete de perto o sentido literal “de sobre ela”, em formulação portuguesa compreensível.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: ficará em sua casa
  rationale: ישב pode indicar sentar-se, habitar ou permanecer; “ficará” comunica aqui a permanência na casa sem rigidez excessiva.
- source_word: וּבָכְתָה אֶת־אָבִיהָ וְאֶת־אִמָּהּ
  choice: chorará por seu pai e por sua mãe
  rationale: בכה significa primariamente “chorar”; com as pessoas como objeto, “chorar por” expressa naturalmente o lamento sem determinar se os pais morreram ou apenas foram perdidos pela separação.
- source_word: יֶרַח יָמִים
  choice: durante um mês inteiro
  rationale: O idioma literal “um mês de dias” indica um mês completo; a tradução comunica essa ênfase de modo natural.
- source_word: תָּבֹא אֵלֶיהָ
  choice: você poderá unir-se a ela
  rationale: A expressão é um eufemismo hebraico para relações sexuais. “Unir-se a ela” preserva o caráter eufemístico e é mais inteligível em português moderno do que o calque “entrar a ela”.
- source_word: וּבְעַלְתָּהּ
  choice: e tornar-se seu marido
  rationale: Neste contexto, בעל descreve assumir a condição de marido; a formulação evita sugerir mera posse e mantém a distinção em relação à união sexual precedente.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: e ela será sua esposa
  rationale: Reproduz naturalmente a fórmula hebraica de estabelecimento da relação matrimonial.
theological_decisions:
- issue: O idioma sexual e matrimonial numa lei sobre uma mulher capturada em guerra
  choice: Manter distintos o ato de unir-se a ela, a condição dele como marido e a condição dela como esposa.
  alternative: Resumir toda a sequência como “você poderá casar-se com ela” ou explicitá-la como “ter relações sexuais com ela”.
  rationale: O hebraico apresenta elementos sucessivos e relacionados, mas não idênticos. A tradução conserva a textura jurídica e a tensão moral da passagem, sem romantizá-la nem acrescentar uma caracterização que o versículo não formula.
- issue: A natureza do lamento pelos pais
  choice: “chorará por seu pai e por sua mãe”
  alternative: “ficará de luto por seu pai e por sua mãe”
  rationale: O verbo hebraico denota choro, e o contexto não afirma expressamente que os pais estejam mortos; a redação escolhida preserva a possibilidade de lamento pela separação.
translation_notes:
  register: 'Português moderno, digno e de leitura amplamente acessível, com tratamento por “você”. A tradução segue equivalência ótima: conserva construções juridicamente relevantes e ambiguidades reais, mas verte os idiomas hebraicos em português natural.'
