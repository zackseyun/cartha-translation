base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: pt
  text: Então, os anciãos da cidade que estiver mais próxima da pessoa morta[a] pegarão uma novilha do gado[b] que nunca tenha sido usada para trabalho e que nunca tenha puxado com jugo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da pessoa que foi morta” ou “do cadáver”. O termo hebraico se refere a alguém que foi morto.
    reason: lexical_alternative
  - marker: b
    text: Ou simplesmente “uma novilha”. A expressão hebraica especifica uma fêmea bovina jovem pertencente ao gado.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “que não puxou com jugo”, isto é, que nunca foi usada como animal de tração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Então
  rationale: Expressa de modo natural a fórmula hebraica que introduz a etapa seguinte do procedimento legal.
- source_word: הָעִיר הַקְּרֹבָה
  choice: a cidade que estiver mais próxima
  rationale: Conserva o sentido contextual de proximidade máxima e se integra naturalmente à sintaxe portuguesa.
- source_word: אֶל הֶחָלָל
  choice: da pessoa morta
  rationale: חָלָל designa alguém que foi morto. A formulação evita presumir sexo ou classificar juridicamente a morte, enquanto a nota registra alternativas mais explícitas.
- source_word: וְלָקְחוּ זִקְנֵי הָעִיר הַהִוא
  choice: os anciãos da cidade ... pegarão
  rationale: Mantém a instrução legal dada aos dirigentes reconhecidos da cidade; a referência demonstrativa é expressa naturalmente pela oração relativa.
- source_word: עֶגְלַת בָּקָר
  choice: uma novilha do gado
  rationale: Novilha identifica a fêmea bovina jovem, e 'do gado' representa בָּקָר sem tornar a frase excessivamente técnica.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: com a qual nunca se tenha trabalhado
  rationale: 'A construção passiva hebraica tem sentido instrumental: o animal nunca foi utilizado para trabalho.'
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: que nunca tenha puxado sob um jugo
  rationale: Preserva o sentido ativo de משך, 'puxar', e comunica que a novilha nunca foi usada como animal de tração.
