  yaml_path: translation/ot/deuteronomy/021/012.yaml
  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: pt
  text: Então você a levará para dentro da sua casa, e ela raspará a cabeça e aparará as unhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixará as unhas crescer”. O hebraico diz literalmente “fará as unhas”; a expressão é idiomática e seu sentido é discutido.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: Então você a levará
  rationale: O hifil de בוא com waw dá sequência às determinações legais. “Então” expressa a progressão, e “levará” comunica naturalmente o movimento para a casa em português.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: para dentro da sua casa
  rationale: תּוֹךְ indica o interior. “Para dentro da sua casa” preserva essa ideia sem a rigidez pouco natural de “para o meio da sua casa”.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: e ela raspará a cabeça
  rationale: גלח significa raspar, e “raspar a cabeça” é a formulação portuguesa natural e concreta, sem acrescentar que ficaria totalmente calva.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: e aparará as unhas
  rationale: A expressão literalmente diz “fará as unhas” e é discutida. “Aparará as unhas” oferece uma leitura clara e tradicionalmente plausível; a interpretação alternativa é mantida em nota.
theological_decisions:
- issue: Ambiguidade de וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: A mulher aparará as unhas.
  alternative: A mulher deixará as unhas crescer.
  rationale: O hebraico usa uma construção idiomática não explícita, literalmente “fará as unhas”. A leitura principal é apresentada de modo natural, mas a alternativa relevante é preservada para não encerrar indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construção natural de ampla compreensão. O futuro mantém o tom prescritivo da sequência legal. O marcador de nota foi colocado logo após a expressão ambígua a que se refere.
