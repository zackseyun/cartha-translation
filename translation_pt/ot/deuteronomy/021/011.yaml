  text: וְ/רָאִיתָ֙ בַּ/שִּׁבְיָ֔ה אֵ֖שֶׁת יְפַת תֹּ֑אַר וְ/חָשַׁקְתָּ֣ בָ֔/הּ וְ/לָקַחְתָּ֥ לְ/ךָ֖ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: pt
  text: e você vir entre os cativos uma mulher de bela aparência[a], desejá-la e tomá-la para si como esposa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma mulher de bela forma”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “tomá-la para si por esposa”, expressão idiomática que significa casar-se com ela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָ
  choice: e você vir
  rationale: O perfeito qal na sequência casuística iniciada no contexto anterior tem valor condicional/temporal. O futuro do subjuntivo em português expressa naturalmente essa função sem transformar a oração em uma afirmação independente.
- source_word: בַּשִּׁבְיָה
  choice: entre os cativos
  rationale: O substantivo designa o conjunto das pessoas capturadas na guerra. “Entre os cativos” preserva o sentido locativo e evita a explicitação interpretativa de “prisioneiros de guerra”.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: uma mulher de bela aparência
  rationale: A expressão construta descreve a beleza da forma ou aparência exterior. Esta formulação é natural em português e mantém explícito o aspecto físico.
- source_word: תֹּאַר
  choice: aparência
  rationale: O termo pode indicar forma, figura ou aparência exterior. “Aparência” comunica o sentido com clareza; “bela forma” permanece na nota como alternativa mais formal.
- source_word: וְחָשַׁקְתָּ בָהּ
  choice: desejá-la
  rationale: O verbo exprime desejo ou forte inclinação por alguém. “Desejá-la” conserva essa força e não a suaviza para simples atração.
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  choice: e tomá-la para si como esposa
  rationale: A tradução preserva a forma do idioma hebraico, literalmente “tomar para si por esposa”, incluindo a nuance reflexiva de לְךָ, sem ocultar que se trata de casamento.
theological_decisions:
- issue: Tradução de uma lei moralmente difícil sem eufemizar o texto nem acrescentar um juízo que o versículo não explicita
  choice: Manter a descrição direta do desejo e do ato de tomá-la como esposa
  alternative: Suavizar para “escolhê-la para ser sua esposa” ou explicitar coerção ou aprovação
  rationale: O versículo apresenta diretamente uma situação jurídica em contexto de guerra. A tradução não deve suavizar o desejo e o ato descritos, nem inserir uma avaliação moral ausente desta frase; assim, preserva-se a tensão ética do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O futuro do subjuntivo mantém a ligação casuística com o contexto anterior; os infinitivos coordenados evitam repetição pesada sem apagar a sequência hebraica. A pontuação final indica que o período continua no versículo seguinte.
