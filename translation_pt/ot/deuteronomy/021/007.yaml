base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: pt
  text: 'Então responderão e dirão: “Nossas mãos não derramaram este sangue[a], e nossos olhos não viram isso[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “este sangue”. A expressão é uma fórmula jurídica que nega responsabilidade pela morte.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não foram testemunhas disso”. A expressão hebraica “nossos olhos não viram” usa uma parte do corpo para negar conhecimento como testemunhas oculares.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: Então responderão e dirão
  rationale: A combinação introduz uma resposta pública e formal. “Então” expressa naturalmente a sequência do procedimento, enquanto “responderão e dirão” preserva os dois verbos hebraicos.
- source_word: יָדֵינוּ
  choice: Nossas mãos
  rationale: Mantém a linguagem concreta da parte do corpo, que aqui representa a participação direta e a responsabilidade pelo homicídio.
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: não derramaram este sangue
  rationale: “Derramar sangue” é a expressão tradicional e natural para matar. O plural em português concorda com “mãos”, embora o hebraico empregue uma forma verbal feminina singular conforme sua gramática.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: e nossos olhos não viram isso
  rationale: Preserva a imagem concreta dos olhos e acrescenta “isso” apenas para completar a expressão de modo natural em português; o pronome retoma o ato investigado, sem restringir o sentido exclusivamente a testemunhá-lo.
