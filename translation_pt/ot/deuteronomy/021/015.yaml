  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: pt
  text: Se um homem tiver duas esposas, uma amada e a outra não amada[a], e tanto a amada como a não amada lhe derem filhos, e o filho primogênito for filho da não amada,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “odiada”. O termo hebraico pode ter esse sentido mais forte, mas aqui provavelmente designa a mulher desfavorecida, em contraste com a amada.
    reason: Alternativa lexical que preserva a amplitude semântica do hebraico.
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz uma situação hipotética de legislação casuística; “Se” é natural e preserva a força condicional.
- source_word: תִהְיֶיןָ לְאִישׁ
  choice: um homem tiver
  rationale: Expressa idiomaticamente em português a construção hebraica de existência/posse.
- source_word: שְׁתֵּי נָשִׁים
  choice: duas mulheres
  rationale: No contexto, são esposas; “mulheres” é uma designação conjugal corrente em português e evita rigidez desnecessária.
- source_word: הָאַחַת אֲהוּבָה
  choice: uma amada
  rationale: Mantém diretamente o particípio/adjetivo passivo hebraico e o contraste relacional.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: a outra não amada
  rationale: Preserva o contraste com “amada” sem impor necessariamente a ideia mais forte de hostilidade ativa; a alternativa literal é registrada em nota.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: lhe derem filhos
  rationale: Formulação natural em português para gerar filhos ao homem; “filhos” mantém a referência masculina relevante à lei do primogênito.
- source_word: הָאֲהוּבָה וְהַשְּׂנוּאָה
  choice: tanto a amada como a não amada
  rationale: Deixa claro que ambas deram filhos, reproduzindo a coordenação enfática do hebraico.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר
  choice: e o filho primogênito for
  rationale: Transpõe naturalmente a construção circunstancial hebraica dentro da condição legal.
- source_word: לַשְּׂנִיאָה
  choice: o da não amada
  rationale: Expressa de modo conciso e inequívoco que o primogênito é filho da mulher não amada.
theological_decisions:
- issue: Sentido de שְׂנוּאָה no contexto da legislação familiar
  choice: não amada
  alternative: odiada; menos amada
  rationale: O termo hebraico pode significar “odiada”, mas neste contraste conjugal também pode indicar a esposa desfavorecida ou não amada. A tradução preserva a tensão relacional sem intensificá-la indevidamente, e a nota registra o sentido mais forte.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A frase permanece aberta por continuar no versículo seguinte. “Mulheres” é usado em sentido conjugal, comum em português; “não amada” mantém o paralelismo com “amada” e a ambiguidade contextual.
