  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o caráter de acusação pública em contexto jurídico sem arcaísmos desnecessários; o idioma hebraico ligado a “ouvir a voz” foi preservado no texto e esclarecido em nota.
