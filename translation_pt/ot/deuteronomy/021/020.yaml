  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמְר֞וּ אֶל זִקְנֵ֣י עִיר֗/וֹ בְּנֵ֤/נוּ זֶה֙ סוֹרֵ֣ר וּ/מֹרֶ֔ה אֵינֶ֥/נּוּ שֹׁמֵ֖עַ בְּ/קֹלֵ֑/נוּ זוֹלֵ֖ל וְ/סֹבֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: pt
  text: 'Então dirão aos anciãos da cidade dele: “Este nosso filho é teimoso e rebelde; não dá ouvidos à nossa voz[a]; é glutão e beberrão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não nos obedece”. A expressão hebraica é literalmente “não ouve a nossa voz”; nesse idioma, ouvir também pode ter o sentido de atender ou obedecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Então dirão
  rationale: Dá continuidade natural à sequência do procedimento jurídico, preservando o valor prospectivo da forma verbal no contexto legal.
- source_word: זִקְנֵי עִירוֹ
  choice: os anciãos da cidade dele
  rationale: “Anciãos” designa os líderes da comunidade; “da cidade dele” preserva explicitamente o sufixo masculino singular de עִירוֹ e evita a possível ambiguidade de “sua cidade”.
- source_word: בְּנֵנוּ זֶה
  choice: Este nosso filho
  rationale: Reproduz de modo natural em português a identificação enfática expressa pelo demonstrativo e pelo sufixo de primeira pessoa do plural.
- source_word: סוֹרֵר וּמֹרֶה
  choice: teimoso e rebelde
  rationale: A dupla descreve resistência persistente e rebelião ativa. A formulação é clara, digna e mantém a força cumulativa dos dois particípios.
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: não dá ouvidos à nossa voz
  rationale: Preserva a imagem do idioma hebraico de ouvir a voz e, ao mesmo tempo, comunica naturalmente em português a ideia contextual de atender ou obedecer.
- source_word: זוֹלֵל
  choice: glutão
  rationale: No paralelismo com סֹבֵא, indica alguém entregue habitualmente ao excesso no comer; “glutão” conserva a acusação nominal e seu peso moral.
- source_word: וְסֹבֵא
  choice: e beberrão
  rationale: Designa alguém dado habitualmente ao excesso de bebida. “Beberrão” é corrente e reproduz bem o sentido habitual do particípio.
theological_decisions: []
