  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: pt
  text: então o pai e a mãe dele o agarrarão e o levarão para fora, aos anciãos de sua cidade e ao portão de sua localidade.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o portão da cidade, espaço público onde os anciãos locais julgavam questões legais.
    reason: cultural_note
  - marker: b
    text: 'Ou: “ao portão de sua cidade”. Hebraico: “ao portão de seu lugar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: o segurarão
  rationale: O verbo תפשׂ com ב indica agarrar ou deter fisicamente. “Segurarão” comunica contenção firme em português atual sem sugerir necessariamente uma captura policial.
- source_word: אָבִיו וְאִמּוֹ
  choice: seu pai e sua mãe
  rationale: Mantém a menção explícita e separada dos dois pais, preservando a ênfase jurídica de que ambos participam da ação.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: o levarão
  rationale: O hifil de יצא significa fazer sair ou levar para fora. No contexto, “o levarão” expressa naturalmente o deslocamento da esfera doméstica ao foro público; a ideia de saída fica implícita no movimento até os anciãos e a porta.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: aos anciãos da cidade dele
  rationale: “Anciãos” conserva o título tradicional dos líderes e juízes locais. “Da cidade dele” reproduz o sufixo possessivo sem a possível ambiguidade de “sua cidade” em português.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: à porta do lugar onde ele mora
  rationale: שׁער designa a porta da cidade, que funcionava como espaço público e judicial. מְקֹמוֹ é literalmente “seu lugar”; a formulação escolhida torna o sentido local compreensível sem substituir silenciosamente “lugar” por “cidade”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. A ordem das ações e a participação conjunta do pai e da mãe foram preservadas. As notas esclarecem a função jurídica da porta e mantêm visível a expressão hebraica literalmente incomum.
