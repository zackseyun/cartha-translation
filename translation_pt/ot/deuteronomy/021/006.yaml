  text: וְ/כֹ֗ל זִקְנֵי֙ הָ/עִ֣יר הַ/הִ֔וא הַ/קְּרֹבִ֖ים אֶל הֶ/חָלָ֑ל יִרְחֲצוּ֙ אֶת יְדֵי/הֶ֔ם עַל הָ/עֶגְלָ֖ה הָ/עֲרוּפָ֥ה בַ/נָּֽחַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: pt
  text: E todos os anciãos daquela cidade, os mais próximos do homem morto violentamente, lavarão as mãos sobre a novilha cujo pescoço foi quebrado no leito do ribeiro[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do cadáver”. O termo hebraico pode designar uma pessoa morta violentamente ou o cadáver dessa pessoa; aqui, “homem morto violentamente” mantém explícito o contexto de uma morte violenta.
    reason: lexical_alternative
  - marker: b
    text: Ou “no vale” ou “no leito do riacho”. A palavra hebraica se refere a uma ravina ou vale associado a um curso de água, muitas vezes sazonal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: E todos
  rationale: Preserva a coordenação do procedimento e a inclusão de todo o grupo.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: os anciãos daquela cidade
  rationale: “Anciãos” expressa os líderes cívicos, e “daquela cidade” mantém a especificidade do demonstrativo.
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: os mais próximos do homem morto
  rationale: Expressa a proximidade em relação à vítima e mantém explícito o contexto de morte violenta, sem reduzir o termo hebraico apenas a “cadáver”.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: lavarão as mãos
  rationale: O futuro português funciona naturalmente como prescrição em contexto legal e conserva a força procedural do imperfeito hebraico.
- source_word: עַל
  choice: sobre
  rationale: Indica a posição ritual dos anciãos em relação ao animal.
- source_word: הָעֶגְלָה
  choice: a novilha
  rationale: Equivalente corrente e preciso para uma fêmea bovina jovem.
- source_word: הָעֲרוּפָה
  choice: cujo pescoço foi quebrado
  rationale: Descreve com precisão o ato ritual sem sugerir necessariamente decapitação por instrumento cortante.
- source_word: בַנָּחַל
  choice: no leito do ribeiro
  rationale: Comunica em português corrente o sentido topográfico de um curso de água ou leito sazonal, preservando a associação entre ravina e corrente de água.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro verbal preserva o tom prescritivo da legislação. “Leito do ribeiro” evita o empréstimo pouco corrente “uádi”, enquanto as alternativas topográficas são registradas em nota.
