  text: then your elders and your judges shall go out and measure to the cities that are around the slain man[a].
translation:
  language: pt
  text: Então os seus anciãos e os seus juízes sairão e medirão a distância até as cidades que ficam ao redor da pessoa que foi morta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do morto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: Então ... sairão
  rationale: O waw com a forma verbal dá sequência ao procedimento legal; “Então” expressa naturalmente essa progressão, e “sairão” preserva o sentido do verbo.
- source_word: זְקֵנֶיךָ
  choice: os seus anciãos
  rationale: Preserva o sufixo de segunda pessoa do singular, dirigido corporativamente a Israel, e emprega o termo tradicional e inteligível para líderes comunitários.
- source_word: וְשֹׁפְטֶיךָ
  choice: e os seus juízes
  rationale: Designa diretamente os que exercem autoridade judicial neste contexto legal.
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: e medirão a distância até as cidades
  rationale: O hebraico diz literalmente “medirão até as cidades”. A explicitação de “a distância” produz português natural e deixa claro o objeto implícito da medição sem alterar o procedimento.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: que ficam ao redor
  rationale: Identifica de modo claro e corrente as cidades situadas nas proximidades do morto.
- source_word: הֶחָלָל
  choice: o homem morto
  rationale: חָלָל denota alguém que foi morto. A formulação evita “assassinado”, que poderia especificar antecipadamente a natureza jurídica da morte, e é mais natural no texto principal do que “o morto” isoladamente.
