translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A sintaxe mantém a sequência do procedimento legal. “Anciãos” preserva o vocabulário institucional bíblico; “medirão a distância” explicita de forma idiomática o objeto implícito da medição.
