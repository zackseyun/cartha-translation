  verdict: revise
  source_fidelity: A sequência procedimental, os anciãos, os juízes e a medição até as cidades circundantes são bem transmitidos. Contudo, «homem morto» restringe «הֶחָלָל» a um homem, enquanto o hebraico designa a pessoa que foi morta/caída, sem exigir que o tradutor explicite o sexo.
  naturalness: O português é claro, atual e apropriado ao registro jurídico-narrativo. «Medirão a distância até as cidades» é uma explicitação idiomática aceitável do objeto implícito da medição.
  terminology: «Anciãos» e «juízes» preservam adequadamente os termos institucionais. «A pessoa que foi morta» mantém o sentido de alguém morto de modo violento, sem antecipar uma qualificação jurídica como «assassinada» nem introduzir gênero. A nota deve oferecer uma alternativa real e não chamar «pessoa morta» de formulação «mais formal».
