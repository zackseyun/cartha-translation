base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: pt
  text: E, se houver em um homem um pecado passível de morte[a], e ele for morto, e você o pendurar numa árvore[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “digno de morte” ou “sob sentença de morte”. O hebraico diz literalmente algo como “um pecado, julgamento de morte”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “numa estaca”. O hebraico diz literalmente “numa árvore”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: E se
  rationale: Introduz o caso condicional e preserva tanto a conjunção quanto a partícula condicional hebraicas em português natural.
- source_word: יִהְיֶה בְ/אִישׁ חֵטְא
  choice: um homem tiver cometido um pecado
  rationale: A formulação hebraica é literalmente semelhante a 'houver em um homem um pecado'. A expressão escolhida comunica o sentido jurídico com naturalidade, sem neutralizar o sujeito masculino nem reduzir חֵטְא a mero delito civil.
- source_word: מִשְׁפַּט מָוֶת
  choice: que mereça a morte
  rationale: Expressa de modo idiomático que o pecado é passível de pena capital, enquanto a nota preserva as possibilidades de 'digno de morte' e 'sob sentença de morte'.
- source_word: וְ/הוּמָת
  choice: e ele for morto
  rationale: Preserva a forma passiva causativa do hebraico e o contexto judicial sem especificar além do texto o método da morte.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: e você o pendurar
  rationale: Traduz diretamente o verbo תלה e mantém a segunda pessoa singular da formulação legal.
- source_word: עַל עֵץ
  choice: numa árvore
  rationale: Mantém o sentido mais transparente de עֵץ e sua relevância intertextual, sem impor a especificação mais estreita 'estaca'.
theological_decisions:
- issue: Sujeito masculino da lei
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: אִישׁ é masculino singular; a tradução preserva essa forma do caso jurídico em vez de neutralizá-la.
- issue: Sentido de מִשְׁפַּט מָוֶת
  choice: que mereça a morte
  alternative: digno de morte; sob sentença de morte
  rationale: O sintagma admite uma nuance de merecimento ou sentença. O texto principal usa uma formulação natural, e a nota conserva a amplitude sem decidir indevidamente entre culpa capital e sentença judicial.
- issue: Objeto de suspensão em עַל עֵץ
  choice: numa árvore
  alternative: numa estaca
  rationale: A tradução literal preserva a linguagem hebraica e suas ressonâncias bíblicas posteriores, sem definir de maneira especulativa a estrutura física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção jurídica permanece condicional e termina com vírgula porque o período continua no versículo seguinte.
