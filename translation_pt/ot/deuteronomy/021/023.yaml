  naturalness: O português é claro e de registro apropriado. “Não ficará durante a noite” é mais direto do que “não deve passar a noite”, e “contaminará” comunica naturalmente o sentido de tornar impura a terra, sem sugerir exclusivamente profanação cultual.
  terminology: “Cadáver”, “árvore”, “certamente”, “Yahweh” e “herança” são escolhas adequadas. “Sob a maldição de Deus” preserva a leitura principal sem eliminar a ambiguidade registrada em nota. A nota foi ajustada para formular a alternativa sem introduzir o pronome objeto “-lo”, ausente no hebraico.
