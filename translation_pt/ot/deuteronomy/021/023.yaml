  to: O cadáver dele não ficará durante a noite na árvore, mas você certamente o enterrará naquele mesmo dia, pois quem está pendurado está sob a maldição de Deus[a]; e não contaminará a terra que Yahweh, seu Deus, lhe dá como herança.
