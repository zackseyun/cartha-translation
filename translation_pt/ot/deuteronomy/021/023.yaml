base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: pt
  text: O cadáver dele não ficará durante a noite na árvore, mas você certamente o enterrará naquele mesmo dia, pois quem está pendurado está sob a maldição de Deus[a]; e não contaminará a terra que Yahweh, seu Deus, lhe dá como herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois o pendurado é amaldiçoado por Deus”; outra possibilidade: “pois o estar pendurado é uma afronta a Deus”. A expressão hebraica é concisa e pode ser entendida de mais de uma maneira.'
    reason: Leitura alternativa de uma construção hebraica sintaticamente concisa e semanticamente discutida.
lexical_decisions:
- source_word: תָלִין
  choice: não deve passar a noite
  rationale: Expressa de modo natural em português o sentido de permanecer durante a noite, mantendo a força temporal da proibição.
- source_word: נִבְלָתוֹ
  choice: o cadáver dele
  rationale: נְבֵלָה designa o corpo morto; “cadáver” é preciso e evita a atenuação de “corpo”.
- source_word: עַל הָעֵץ
  choice: na árvore
  rationale: עֵץ pode significar árvore ou madeira. “Árvore” é a correspondência direta e preserva a formulação retomada em tradições bíblicas posteriores.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: você certamente o enterrará
  rationale: O infinitivo absoluto seguido da forma verbal intensifica a ordem; “certamente” conserva essa ênfase.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele mesmo dia
  rationale: Formulação idiomática que deixa claro que o sepultamento deve ocorrer antes de terminar o dia.
- source_word: קִלְלַת אֱלֹהִים
  choice: sob a maldição de Deus
  rationale: A construção é concisa e discutida. Esta opção comunica a leitura contextual de que o pendurado se encontra sob maldição divina, sem apagar outras análises possíveis, registradas na nota.
- source_word: תָּלוּי
  choice: quem é pendurado
  rationale: O particípio passivo significa alguém pendurado ou suspenso. A formulação é natural e mantém o caráter geral da declaração.
- source_word: תְטַמֵּא
  choice: profanará
  rationale: No contexto da pureza da terra, טמא abrange contaminação ritual e moral. “Profanar” comunica que a terra dada por Deus seria tornada impura, em registro bíblico natural.
- source_word: אַדְמָתְךָ
  choice: a terra
  rationale: No contexto da concessão pactual e da herança, אֲדָמָה se refere à terra recebida, não apenas ao solo físico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: נַחֲלָה
  choice: como herança
  rationale: Preserva o sentido de propriedade recebida como herança e a dimensão da concessão da terra.
theological_decisions:
- issue: Sentido de כִּי קִלְלַת אֱלֹהִים תָּלוּי
  choice: quem é pendurado está sob a maldição de Deus
  alternative: “o pendurado é amaldiçoado por Deus” ou “pendurá-lo é uma afronta a Deus”
  rationale: A construção hebraica é comprimida e admite mais de uma análise. A leitura principal entende a exposição do condenado como sinal de maldição divina e explica o sepultamento imediato, enquanto a nota conserva as alternativas sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna explícito o singular hebraico e mantém clareza contemporânea. A coordenação final foi vertida com “Assim” para indicar a consequência prática sem tornar a frase artificial.
