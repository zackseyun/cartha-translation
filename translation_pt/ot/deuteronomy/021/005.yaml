base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: pt
  text: E os sacerdotes, filhos de Levi, se aproximarão, pois Yahweh, seu Deus, os escolheu para servi-lo e para abençoar em nome de Yahweh; pela palavra deles serão decididas toda disputa e toda lesão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo golpe” ou “toda aflição”. O termo hebraico é amplo; neste contexto jurídico, provavelmente se refere a casos que envolvem dano corporal.
    reason: Preserva a amplitude lexical de נֶגַע e informa alternativas possíveis sem limitar o termo à ideia mais estreita de agressão intencional.
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: se aproximarão
  rationale: O nifal de נגשׁ indica que os sacerdotes se apresentam para participar oficialmente do procedimento jurídico-ritual; “se aproximarão” preserva o movimento expresso no hebraico sem tornar explícita uma ideia não declarada.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: os sacerdotes, filhos de Levi
  rationale: Mantém a aposição hebraica e identifica os sacerdotes por sua linhagem, com formulação clara e natural em português.
- source_word: כִּי בָם בָּחַר
  choice: pois ... os escolheu
  rationale: כִּי introduz a razão da atuação sacerdotal, e o perfeito בָּחַר aponta para a escolha divina já realizada, cujo efeito permanece.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Translitera diretamente o nome divino do texto hebraico e conserva a fórmula de aliança, com a vírgula favorecendo a leitura natural em português.
- source_word: לְשָׁרְתוֹ
  choice: para servi-lo
  rationale: שרת designa aqui o serviço sacerdotal prestado a Deus. “Servi-lo” é amplo, digno e inteligível, sem acrescentar uma especificação cultual ausente da expressão.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: e para abençoar em nome de Yahweh
  rationale: Reproduz de modo direto a bênção sacerdotal exercida sob a autoridade do nome divino.
- source_word: וְעַל פִּיהֶם
  choice: pela palavra deles
  rationale: A expressão idiomática, literalmente “segundo a boca deles”, refere-se ao pronunciamento autorizado dos sacerdotes; “pela palavra deles” preserva tanto a dimensão verbal quanto a autoridade.
- source_word: יִהְיֶה
  choice: será decidida
  rationale: Embora o verbo signifique literalmente “será”, o contexto jurídico exige em português um predicativo implícito. “Será decidida” comunica a função judicial sem especificar indevidamente o conteúdo da decisão.
- source_word: כָּל רִיב
  choice: toda disputa
  rationale: רִיב pode indicar contenda, controvérsia ou litígio. “Disputa” conserva a amplitude do termo e se ajusta ao contexto jurídico.
- source_word: וְכָל נָגַע
  choice: e toda lesão
  rationale: נֶגַע abrange golpe, dano corporal, afecção ou calamidade. Neste contexto jurídico, “lesão” comunica de forma natural um caso de dano físico, sem restringi-lo à categoria intencional de agressão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança e evita substituí-lo por um título.
- issue: Alcance da autoridade sacerdotal na cláusula final
  choice: “pela palavra deles será decidida”
  alternative: “sob a autoridade deles será resolvida”
  rationale: A tradução comunica a função decisória atribuída aos sacerdotes sem concluir além do texto se sua palavra constitui pessoalmente o veredito final ou se rege formalmente o procedimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe mantém o paralelismo do hebraico sem rigidez excessiva. O marcador [a] foi colocado junto de “lesão”, termo ao qual a nota efetivamente se refere.
