  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: pt
  text: para que não seja derramado sangue inocente no meio da sua terra, que Yahweh, seu Deus, lhe está dando como herança, e para que você não incorra em culpa de sangue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: «e haja sangue sobre você». O idioma hebraico indica responsabilidade pelo derramamento de sangue inocente, isto é, culpa de sangue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: se derrame
  rationale: O nifal de שׁפך expressa a ação passiva de derramar. Com sangue e em contexto jurídico, «se derrame» é natural e preserva a imagem hebraica.
- source_word: דָּם נָקִי
  choice: sangue inocente
  rationale: Mantém a expressão jurídico-moral compacta do hebraico, referente ao sangue de alguém que não merece a morte.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: no meio da terra
  rationale: קֶרֶב denota o meio ou interior de algo; a formulação conserva esse valor espacial e o tom solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: lhe dá como herança
  rationale: O particípio נֹתֵן apresenta a dádiva em curso ou característica, e נַחֲלָה designa uma propriedade recebida como herança.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: e não recaia sobre você a culpa de sangue
  rationale: Em contexto jurídico, o plural דָּמִים pode indicar responsabilidade por derramamento de sangue. «Recaia sobre você» reflete a construção com עַל e se integra à finalidade negativa iniciada no contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em forma transliterada.
- issue: Alcance sintático da consequência final
  choice: e não recaia sobre você a culpa de sangue
  alternative: e a culpa de sangue recairia sobre você
  rationale: 'A coordenação pode ser entendida como continuação da finalidade negativa: estabelecer as cidades evita tanto o derramamento de sangue inocente quanto a culpa dele decorrente. A nota preserva o idioma hebraico mais literal.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém «terra», «herança», «sangue inocente» e «culpa de sangue» para conservar o vocabulário jurídico e pactual do hebraico.
