  source_fidelity: A primeira finalidade está bem traduzida, mas a oração final hebraica, וְהָיָה עָלֶיךָ דָּמִים, é formalmente uma consequência («e haverá/ficará sobre você sangue[s]»), não traz uma segunda negação explícita. Em português, a finalidade global do contexto pode ser expressa com clareza por «para que você não incorra em culpa de sangue», sem atribuir ao hebraico uma forma negativa que ele não contém.
  naturalness: «No meio da terra» soa incompleto em português, pois אַרְצְךָ inclui o possessivo. «No meio da sua terra» é mais natural e fiel. A revisão também uniformiza o tratamento em «você/lhe».
  terminology: «Yahweh», «sangue inocente», «herança» e «culpa de sangue» são adequados. «Culpa de sangue» comunica bem o sentido jurídico de דָּמִים neste contexto.
  issues:
