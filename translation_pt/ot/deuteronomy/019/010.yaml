    issue: A oração final foi vertida como «e não recaia sobre você», embora o hebraico não repita a negação.
    rationale: וְהָיָה é uma forma de consequência; a tradução deve evitar apresentar uma segunda negação como se estivesse expressa no texto. «Para que você não incorra em culpa de sangue» comunica a relação final-contextual sem alegar uma correspondência formal inexistente.
  - severity: low
    issue: «No meio da terra» omite o possessivo de אַרְצְךָ.
    rationale: O hebraico diz literalmente «no meio da sua terra». A inclusão de «sua» restaura esse elemento e melhora a naturalidade.
