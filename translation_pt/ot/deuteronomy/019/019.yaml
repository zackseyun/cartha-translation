  text: וַ/עֲשִׂ֣יתֶם ל֔/וֹ כַּ/אֲשֶׁ֥ר זָמַ֖ם לַ/עֲשׂ֣וֹת לְ/אָחִ֑י/ו וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: pt
  text: Então vocês farão com ele exatamente o que ele planejou fazer com seu irmão[a]. Assim, vocês eliminarão o mal do meio de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu compatriota”; em hebraico, “seu irmão”, termo que neste contexto jurídico designa outro membro da comunidade da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Então vocês farão
  rationale: A forma verbal dirige a instrução à comunidade ou aos juízes. O futuro com valor prescritivo preserva o tom jurídico, e “Então” explicita a sequência do discurso indicada pelo waw.
- source_word: לוֹ
  choice: com ele
  rationale: O pronome se refere à testemunha falsa. Em português, “fazer com ele” expressa naturalmente a ação judicial aplicada à pessoa.
- source_word: כַּאֲשֶׁר
  choice: exatamente o que
  rationale: Transmite de modo idiomático a correspondência rigorosa entre a pena e aquilo que a testemunha falsa pretendia causar.
- source_word: זָמַם
  choice: planejou
  rationale: O verbo denota conceber ou planejar uma ação, frequentemente hostil. “Planejou” mantém o elemento deliberado sem acrescentar motivação além do contexto.
- source_word: לַעֲשׂוֹת
  choice: fazer
  rationale: Infinitivo complementar de זָמַם, traduzido diretamente.
- source_word: לְאָחִיו
  choice: com seu irmão
  rationale: אָח significa literalmente “irmão” e, neste contexto jurídico da aliança, pode designar outro membro da comunidade. A formulação mantém a expressão masculina do hebraico, enquanto a nota registra o alcance comunitário.
- source_word: וּבִעַרְתָּ
  choice: Assim, vocês eliminarão
  rationale: Na fórmula jurídica de Deuteronômio, בער significa remover ou extirpar o mal, não queimá-lo literalmente. “Eliminarão” comunica isso com clareza e dignidade.
- source_word: הָרָע
  choice: o mal
  rationale: Preserva o peso moral e o caráter formular da expressão hebraica, sem restringi-la apenas ao delito.
- source_word: מִקִּרְבֶּךָ
  choice: do meio de vocês
  rationale: Expressão portuguesa natural que conserva a imagem comunitária de retirar o mal do interior de Israel. O singular coletivo hebraico é vertido no plural para concordar com o tratamento “vocês”.
theological_decisions:
- issue: O termo masculino e comunitário אָחִיו no contexto jurídico
  choice: seu irmão
  alternative: seu compatriota; outro membro da comunidade
  rationale: O texto hebraico diz literalmente “seu irmão”, mas o uso jurídico abrange um membro da comunidade da aliança. A tradução principal conserva a forma lexical e a nota preserva seu sentido contextual mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. Emprega “vocês” para reproduzir a referência plural aos responsáveis pela aplicação da sentença e mantém a fórmula de remoção do mal em linguagem natural.
