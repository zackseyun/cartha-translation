base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: pt
  text: Então os dois homens entre os quais houver a disputa[a] se apresentarão diante de Yahweh, diante dos sacerdotes e dos juízes que estiverem em exercício naqueles dias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre os quais está a disputa”; também pode ser entendido como “que têm a causa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “que estiverem naqueles dias”.'
    reason: translation_literalness
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: Então ... se apresentarão
  rationale: O waw com a forma verbal dá sequência ao procedimento legal. Nesse contexto judicial, “se apresentarão” expressa naturalmente a ação de comparecer formalmente perante a autoridade, sem perder o sentido básico de permanecer de pé diante dela.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: os dois homens
  rationale: O hebraico emprega explicitamente o numeral “dois” e o substantivo masculino plural “homens”. A tradução mantém essa forma, em vez de substituí-la pela interpretação jurídica “as duas partes”.
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: entre os quais houver a disputa
  rationale: רִיב pode designar disputa, controvérsia ou causa judicial. A formulação explicita de modo natural a relação entre os dois homens e preserva “disputa” sem restringir o termo a um processo formal.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” conserva a linguagem de comparecimento à presença divina no contexto judicial, e “Yahweh” representa o nome próprio יהוה.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: diante dos sacerdotes e dos juízes
  rationale: A repetição de “diante de” no texto hebraico é mantida, distinguindo a referência a Yahweh da referência às autoridades sacerdotais e judiciais.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: que estiverem em exercício naqueles dias
  rationale: A expressão hebraica identifica os sacerdotes e juízes contemporâneos ao caso. “Em exercício” comunica sua função oficial em português atual, embora o hebraico diga mais literalmente apenas que eles “estiverem” naqueles dias.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama como nome próprio de Deus. “Yahweh” o representa diretamente, sem substituí-lo por um título e sem introduzir uma forma portuguesa tradicional derivada de outra vocalização.
- issue: Sentido de comparecer “diante de Yahweh” no procedimento judicial
  choice: preservar a referência direta à presença de Yahweh
  alternative: interpretar como comparecimento somente perante o santuário ou perante representantes humanos de Deus
  rationale: O texto coloca explicitamente os litigantes “diante de Yahweh” e, em seguida, “diante dos sacerdotes e dos juízes”. A tradução conserva essa tensão sem explicar de que maneira institucional ou cultual a presença divina se manifesta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Se apresentarão” e “em exercício” comunicam o cenário judicial sem excesso de juridiquês; as notas registram as construções hebraicas mais literais e suas alternativas.
