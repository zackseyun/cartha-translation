  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: pt
  text: Quando Yahweh, seu Deus, eliminar[a] as nações cuja terra Yahweh, seu Deus, está dando a você, e você as expulsar e passar a morar nas cidades e nas casas delas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cortar”; também pode ser traduzido como “destruir” ou “remover”.'
    reason: Preserva o sentido concreto e as alternativas lexicais de יַכְרִית.
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto legal, introduz uma circunstância futura esperada que serve de condição para as instruções seguintes; “quando” comunica isso naturalmente.
- source_word: יַכְרִית
  choice: eliminar
  rationale: O hifil de כרת significa aqui remover ou eliminar as nações. “Eliminar” é natural em português, enquanto a tradução literal “cortar” seria pouco clara; a nota preserva o idioma hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz naturalmente a construção com sufixo de segunda pessoa masculina singular.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Equivalente corrente de גּוֹיִם e adequado aos povos que ocupavam a terra.
- source_word: נֹתֵן לְךָ
  choice: está dando a você
  rationale: O particípio apresenta a dádiva divina como ação em curso ou certa; a formulação também evita a ambiguidade regional de “lhe”.
- source_word: וִירִשְׁתָּם
  choice: você as expulsar
  rationale: Com as nações como objeto pessoal, ירש indica desalojá-las ou despossuí-las. “Expulsar” expressa isso com clareza em português comum.
- source_word: וְיָשַׁבְתָּ
  choice: passar a morar
  rationale: Comunica o estabelecimento posterior nas cidades e casas, mantendo clara a sequência verbal.
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: nas cidades e nas casas delas
  rationale: Mantém a preposição e explicita que as cidades e casas pertenciam às nações, em português natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome pessoal divino. “Yahweh” preserva o Tetragrama por transliteração, sem substituí-lo por um título.
- issue: Agência divina e expulsão humana
  choice: 'manter as duas ações: Yahweh elimina as nações, e Israel as expulsa'
  alternative: fundir as duas ações numa única descrição da conquista
  rationale: A redação hebraica mantém em tensão a ação divina e a participação de Israel; a tradução não as identifica nem resolve a relação entre elas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A frase permanece aberta porque o versículo continua na instrução seguinte. A repetição de “Yahweh, seu Deus” foi mantida por corresponder à ênfase do hebraico.
