  text: פֶּן יִרְדֹּף֩ גֹּאֵ֨ל הַ/דָּ֜ם אַחֲרֵ֣י הָ/רֹצֵ֗חַ כִּי יֵחַם֮ לְבָב/וֹ֒ וְ/הִשִּׂיג֛/וֹ כִּֽי יִרְבֶּ֥ה הַ/דֶּ֖רֶךְ וְ/הִכָּ֣ה/וּ נָ֑פֶשׁ וְ/ל/וֹ֙ אֵ֣ין מִשְׁפַּט מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: pt
  text: do contrário, o vingador do sangue poderia perseguir aquele que matou, pois seu coração se inflamaria[a], alcançá-lo, por ser longo o caminho, e tirar-lhe a vida, embora ele não fosse passível da pena de morte, pois não o odiava antes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pois seu coração se aquece”; o idioma hebraico descreve a ira inflamada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “desde ontem e anteontem”, expressão hebraica que significa “antes”, “anteriormente” ou “desde tempos anteriores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: do contrário
  rationale: Introduz a consequência que as medidas anteriores procuram evitar; a formulação é natural em português moderno e preserva a força preventiva.
- source_word: גֹּאֵל הַדָּם
  choice: o vingador do sangue
  rationale: Mantém a designação jurídica e familiar estabelecida no contexto da Torá, sem reduzir a expressão a uma vingança meramente pessoal.
- source_word: הָרֹצֵחַ
  choice: quem matou
  rationale: O particípio designa aqui a pessoa que causou a morte sem intenção homicida comprovada. “Assassino” sugeriria culpa deliberada, enquanto “quem matou” preserva a distinção jurídica do contexto.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: quando seu coração se inflamasse
  rationale: Conserva a imagem hebraica do coração que se aquece, mas a expressa por um idioma português claro para a ira intensa.
- source_word: וְהִשִּׂיגוֹ
  choice: alcançá-lo
  rationale: Representa diretamente o resultado da perseguição.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: por ser longo o caminho
  rationale: Preserva a imagem concreta da distância até a cidade de refúgio.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: tirar-lhe a vida
  rationale: Transmite naturalmente o sentido da expressão hebraica de ferir alguém na vida, isto é, matá-lo.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: embora ele não fosse passível da pena de morte
  rationale: Preserva o sentido jurídico de que a pessoa não estava legalmente sujeita a uma sentença capital.
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: pois não odiava a vítima
  rationale: 'Expõe a razão jurídica dada no texto: não havia inimizade anterior que indicasse intenção deliberada.'
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: anteriormente
  rationale: Traduz com clareza o idioma temporal hebraico, que literalmente se refere a ontem e ao dia anterior, mas significa um período prévio.
theological_decisions:
- issue: Culpabilidade de quem causou a morte
  choice: Não empregar “assassino” e declarar que não era passível da pena de morte
  alternative: Traduzir הָרֹצֵחַ como “assassino” ou entender a morte pelo vingador como pena legítima
  rationale: O próprio versículo nega ódio anterior e responsabilidade capital; a tradução deve conservar essa tensão jurídica sem atribuir homicídio doloso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A terminologia jurídica foi mantida sem arcaísmos; as imagens hebraicas relevantes foram preservadas no texto ou esclarecidas em notas.
