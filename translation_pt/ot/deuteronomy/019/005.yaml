  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: pt
  text: Mas, se alguém entrar com seu próximo na floresta para cortar lenha, e, ao manejar o machado para cortar a árvore, a cabeça de ferro se soltar do cabo[a], atingir seu próximo e ele morrer, essa pessoa poderá fugir para uma dessas cidades e viver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o ferro se soltar da madeira”. Aqui, “o ferro” se refere à cabeça do machado, e “a madeira”, ao cabo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Mas, se alguém
  rationale: Introduz um caso particular dentro da legislação anterior. A formulação condicional é natural em português jurídico-narrativo e preserva a relação com o contexto.
- source_word: רֵעֵהוּ
  choice: seu próximo
  rationale: Em contexto legal, designa outra pessoa da comunidade ou um companheiro, não necessariamente um amigo íntimo. “Próximo” mantém o sentido social amplo e a dignidade do registro.
- source_word: בַיַּעַר
  choice: na floresta
  rationale: יַעַר designa uma região arborizada; “floresta” é claro e adequado ao registro.
- source_word: לַחְטֹב עֵצִים
  choice: para cortar lenha
  rationale: A expressão descreve a atividade de cortar madeira. “Cortar lenha” é idiomático em português, sem exigir que עֵצִים seja entendido aqui apenas como árvores inteiras.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: ao manejar o machado
  rationale: A construção descreve o movimento da mão com o machado. A tradução comunica naturalmente a ação sem impor uma descrição mecânica além do contexto.
- source_word: לִכְרֹת הָעֵץ
  choice: para cortar a árvore
  rationale: כרת indica cortar e, neste contexto, provavelmente derrubar a árvore. “Cortar a árvore” permanece próximo da forma hebraica e é plenamente compreensível.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן־הָעֵץ
  choice: a cabeça de ferro se soltar do cabo
  rationale: Literalmente, “o ferro se soltar da madeira”. No contexto do machado, os referentes implícitos são a cabeça de ferro e o cabo de madeira; explicitá-los torna o acidente claro.
- source_word: וּמָצָא אֶת־רֵעֵהוּ
  choice: atingir seu próximo
  rationale: מצא tem aqui o sentido contextual de alcançar ou acertar alguém. “Atingir” expressa o impacto acidental sem sugerir intenção.
- source_word: וָמֵת
  choice: e ele morrer
  rationale: Mantém a sequência hebraica e deixa claro pelo contexto que quem morre é o próximo atingido.
- source_word: הוּא יָנוּס
  choice: essa pessoa poderá fugir
  rationale: O pronome retoma quem causou a morte. “Poderá fugir” comunica a autorização e proteção oferecidas pela disposição legal, evitando a possível ambiguidade de gênero de um simples “ele”.
- source_word: וָחָי
  choice: e viver
  rationale: 'Preserva de modo conciso o resultado previsto: escapar da morte e permanecer vivo.'
