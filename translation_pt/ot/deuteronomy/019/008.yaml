base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: pt
  text: E, se Yahweh, teu Deus, ampliar o teu território, como jurou aos teus pais,[a] e te der toda a terra que prometeu dar aos teus pais,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos teus antepassados”, nas duas ocorrências de “aos teus pais”. O hebraico diz literalmente “aos teus pais” e se refere aos antepassados patriarcais de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: Mantém a ligação com a instrução legal anterior e introduz a condição de modo natural em português.
- source_word: יַרְחִיב
  choice: ampliar
  rationale: O hifil de רחב significa tornar amplo ou aumentar; com território, “ampliar” é corrente e preciso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz naturalmente o substantivo com sufixo masculino singular de segunda pessoa.
- source_word: גְּבֻלְךָ
  choice: o seu território
  rationale: Neste contexto, גְּבוּל designa a extensão territorial, não apenas a linha de fronteira.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: como jurou
  rationale: Expressa de forma concisa a comparação com o juramento feito anteriormente.
- source_word: לַאֲבֹתֶיךָ
  choice: aos seus pais
  rationale: Preserva literalmente o termo masculino e o idioma pactual referente aos antepassados patriarcais de Israel.
- source_word: וְנָתַן לְךָ
  choice: e lhe der
  rationale: O perfeito com waw prossegue a condição de orientação futura; o futuro do subjuntivo é a construção portuguesa natural depois de “se”.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: Refere-se à totalidade da terra prometida a Israel, e não ao planeta.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: que prometeu dar
  rationale: Embora דִּבֶּר signifique literalmente “falou”, neste contexto de juramento e concessão da terra comunica uma promessa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal pactual sem substituí-lo por um título.
- issue: Sentido de אבות
  choice: pais
  alternative: antepassados
  rationale: “Pais” preserva a formulação masculina literal e a referência aos patriarcas de Israel; “antepassados” explicita o sentido contextual e fica registrado em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se a estrutura condicional do hebraico e a vírgula final, pois o período continua no versículo seguinte.
