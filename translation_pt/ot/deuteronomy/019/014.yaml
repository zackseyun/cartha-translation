  source_fidelity: 'O sentido central está bem representado: a proibição diz respeito ao deslocamento de um marco que define a divisa da propriedade do próximo, e o versículo preserva a moldura da herança territorial dada por Yahweh. Contudo, a relação entre o marco e a nota lexical deve ser ancorada no termo pertinente; além disso, a repetição intencional entre «herança» e «herdará» pode ser preservada em português sem sacrificar a clareza.'
  naturalness: «Marco da divisa» é compreensível, mas «marco de divisa» é uma colocação mais direta. «Os que vieram antes» é mais natural que atribuir literalmente a ação de estabelecer marcos a «gerações anteriores», ao mesmo tempo que mantém a referência aberta do hebraico.
  terminology: «Yahweh», «seu Deus», «herança» e «tomar posse» são escolhas adequadas. A nota deve acompanhar «marco de divisa», pois explica גְּבוּל e sua referência ao marco/divisa da propriedade, não «próximo».
  issues:
