  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: pt
  text: Não desloque o marco de divisa[a] do seu próximo, que os que vieram antes estabeleceram, em sua herança, que você herdará na terra que Yahweh, seu Deus, lhe dá para tomar posse dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “marco de limite”. O hebraico se refere à divisa da propriedade, assinalada por um marco.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסִּיג
  choice: desloque
  rationale: O hifil de נסג, neste contexto jurídico, proíbe alterar a divisa em prejuízo do vizinho. “Deslocar” é natural e não especifica além do texto a direção do movimento.
- source_word: גְּבוּל
  choice: marco da divisa
  rationale: Embora גְּבוּל possa significar “limite” ou “divisa”, o verbo indica aqui o marco físico pelo qual a divisa da propriedade era assinalada.
- source_word: רֵעֲךָ
  choice: do seu próximo
  rationale: רֵעַ designa outro membro da comunidade e, no contexto fundiário, o proprietário vizinho. “Próximo” conserva o vocabulário relacional e jurídico.
- source_word: גָּבְלוּ
  choice: estabeleceram
  rationale: O verbo expressa a fixação ou demarcação dos limites. “Estabeleceram” combina naturalmente com “marco da divisa” sem repetir a ideia de marcar.
- source_word: רִאשֹׁנִים
  choice: as gerações anteriores
  rationale: O adjetivo plural substantivado refere-se aos que vieram antes e fixaram as antigas divisões das terras; a expressão explicita esse sentido coletivo.
- source_word: בְּנַחֲלָתְךָ
  choice: na herança
  rationale: “Herança” preserva o sentido jurídico e pactual de נַחֲלָה como porção de terra recebida por Israel.
- source_word: תִּנְחַל
  choice: que você receberá
  rationale: O verbo cognato de “herança” indica o recebimento da porção hereditária. Em português, “herança que você receberá” evita a construção pouco natural “herança que você herdará”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: נֹתֵן לְךָ
  choice: lhe dá
  rationale: O particípio retrata a dádiva da terra como ação característica e em curso de Yahweh; o presente português comunica isso naturalmente.
- source_word: לְרִשְׁתָּהּ
  choice: para tomar posse dela
  rationale: O infinitivo de ירשׁ indica entrar na posse da terra. A forma com “dela” mantém explícito o referente feminino, “terra”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e pactual, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário jurídico acessível. O singular de segunda pessoa foi vertido por “você”, de uso amplo no Brasil. A repetição semântica hebraica entre נַחֲלָה e נחל foi suavizada para naturalidade, sem perder a noção de herança territorial.
