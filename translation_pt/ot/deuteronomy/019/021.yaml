  text: וְ/לֹ֥א תָח֖וֹס עֵינֶ֑/ךָ נֶ֣פֶשׁ בְּ/נֶ֗פֶשׁ עַ֤יִן בְּ/עַ֨יִן֙ שֵׁ֣ן בְּ/שֵׁ֔ן יָ֥ד בְּ/יָ֖ד רֶ֥גֶל בְּ/רָֽגֶל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: pt
  text: Que o seu olho não tenha piedade:[a] vida por vida,[b] olho por olho, dente por dente, mão por mão, pé por pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não poupe” ou “não tenha compaixão”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa נֶפֶשׁ, que aqui significa “vida”, não especificamente “alma” em sentido teológico posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: tenha piedade
  rationale: O verbo חוס pode expressar ter piedade, compadecer-se ou poupar. “Tenha piedade” é natural em português e mantém a severidade do mandamento judicial.
- source_word: עֵינֶךָ
  choice: o seu olho
  rationale: Mantém a imagem concreta do hebraico, no qual o olho é o sujeito do verbo, em vez de reduzir a expressão simplesmente a “você”.
- source_word: נֶפֶשׁ
  choice: vida
  rationale: Na fórmula נֶפֶשׁ בְּנֶפֶשׁ, נֶפֶשׁ designa a vida, não especificamente a “alma” em sentido metafísico posterior.
- source_word: בְּ
  choice: por
  rationale: A preposição marca equivalência ou retribuição em cada par. “Por” reproduz de modo conciso e idiomático a fórmula jurídica.
- source_word: עַיִן
  choice: olho
  rationale: Termo literal para a parte do corpo na fórmula de retribuição proporcional.
- source_word: שֵׁן
  choice: dente
  rationale: Equivalente português direto e preciso do termo hebraico.
- source_word: יָד
  choice: mão
  rationale: Equivalente português direto, preservando a sequência concreta das lesões corporais.
- source_word: רֶגֶל
  choice: pé
  rationale: “Pé” é o equivalente contextual e tradicionalmente adequado nesta fórmula jurídica.
theological_decisions:
- issue: Preservar a fórmula concreta de retribuição jurídica ou substituí-la por um princípio geral de proporcionalidade
  choice: Manter “vida por vida, olho por olho, dente por dente, mão por mão, pé por pé”.
  alternative: Parafrasear como “a punição deve ser proporcional ao delito”.
  rationale: O hebraico emprega uma fórmula jurídica fixa e concreta. Preservá-la mantém sua força retórica, suas conexões com outros textos da Torá e a tensão teológica do texto, sem suavizá-lo por interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção volitiva “Que o seu olho não tenha piedade” preserva a imagem hebraica sem soar excessivamente arcaica. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
