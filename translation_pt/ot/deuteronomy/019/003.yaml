source:
  edition: WLC
  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: pt
  text: Prepare o caminho e divida em três partes o território da sua terra, que Yahweh, seu Deus, lhe dá por herança, para que todo homicida[a] possa fugir para lá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo aquele que mata”. O termo hebraico é mais amplo que “assassino” no contexto das cidades de refúgio.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “e será para fugir para lá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: Prepare o caminho
  rationale: O hifil de כון expressa tornar pronto ou preparar. O dativo לְךָ é natural no contexto como referência ao encargo do destinatário e não precisa ser vertido mecanicamente como “para você”.
- source_word: וְשִׁלַּשְׁתָּ
  choice: divida em três partes
  rationale: O piel de שלש indica uma divisão tripartida; a formulação explicita o sentido em português corrente.
- source_word: גְּבוּל אַרְצְךָ
  choice: o território da terra
  rationale: Embora גְּבוּל possa significar “limite” ou “fronteira”, aqui designa a extensão territorial a ser organizada em três partes.
- source_word: יַנְחִילְךָ
  choice: lhe dará como herança
  rationale: O hifil de נחל apresenta Yahweh como aquele que concede a terra por herança, preservando tanto a ideia de dádiva quanto a de herança.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: A transliteração representa diretamente o nome divino יהוה e mantém a fórmula da aliança.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: para que ... possa fugir para lá
  rationale: A construção hebraica comprimida exprime finalidade; esta formulação é idiomática em português sem acrescentar conteúdo.
- source_word: כָּל רֹצֵחַ
  choice: todo homicida
  rationale: No contexto das cidades de refúgio, רֹצֵחַ abrange quem causou uma morte, inclusive sem intenção; “homicida” é mais amplo e juridicamente mais adequado do que “assassino”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio da aliança; “Yahweh” o preserva de modo direto, sem substituí-lo por um título.
- issue: Se רֹצֵחַ implica assassinato doloso ou uma categoria mais ampla de homicídio
  choice: homicida
  alternative: assassino; aquele que matar alguém
  rationale: O contexto subsequente inclui a morte não intencional. “Homicida” preserva a amplitude jurídica do termo sem antecipar um juízo de culpa que este versículo não estabelece.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega o singular de tratamento (“seu”, “lhe”) para acompanhar o destinatário singular do hebraico. A ordem foi levemente ajustada para fluência, sem eliminar a finalidade nem a linguagem de herança.
