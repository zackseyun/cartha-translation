  text: עַל כֵּ֛ן אָנֹכִ֥י מְצַוְּ/ךָ֖ לֵ/אמֹ֑ר שָׁלֹ֥שׁ עָרִ֖ים תַּבְדִּ֥יל לָֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/007.yaml
  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: pt
  text: 'Por isso, eu lhe ordeno: “Separe[a] três cidades para você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Designe três cidades para você”. O verbo hebraico pode significar “separar”, “pôr à parte” ou, neste contexto, “designar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão decorrente do contexto anterior.
- source_word: אָנֹכִי
  choice: eu
  rationale: Mantém o pronome independente e sua leve ênfase sem acrescentar uma forma enfática excessiva como “eu mesmo”.
- source_word: מְצַוְּךָ
  choice: ordeno a você
  rationale: Reproduz a força direta do particípio de צוה com sufixo de segunda pessoa; o presente é natural em português para uma ordem proferida agora.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem naturalmente em português o conteúdo da ordem, cumprindo a função do infinitivo quotativo sem o pouco idiomático “dizendo”.
- source_word: שָׁלֹשׁ עָרִים
  choice: três cidades
  rationale: Tradução direta da construção numeral mais substantivo.
- source_word: תַּבְדִּיל
  choice: Separe
  rationale: Preserva o sentido causativo do hifil de בדל, isto é, separar ou pôr à parte; no contexto, também implica destinar oficialmente as cidades.
- source_word: לָךְ
  choice: para você
  rationale: Conserva a preposição e o sufixo masculino singular, indicando que as cidades seriam separadas para uso e benefício do povo interpelado coletivamente.
theological_decisions:
- issue: Tratamento de Israel na segunda pessoa masculina singular na lei da aliança
  choice: 'Manter a segunda pessoa do singular: “você”'
  alternative: Empregar o plural “vocês” ou uma construção impessoal
  rationale: O hebraico dirige-se coletivamente a Israel no singular. A tradução mantém essa forma retórica sem transformar a ordem em plural nem torná-la impessoal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Os dois-pontos substituem a fórmula hebraica לֵאמֹר de maneira idiomática. “Separe” conserva a imagem lexical, enquanto a nota registra o sentido administrativo contextual de “designe”.
