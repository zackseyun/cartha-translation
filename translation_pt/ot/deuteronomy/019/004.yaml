  - severity: low
    issue: “Ferir mortalmente” explicita “mortalmente”
    rationale: יַכֶּה significa “ferir/golpear”. O contexto do “causou uma morte” permite compreender o desfecho, mas o advérbio acrescenta uma explicitação não presente no verbo da cláusula.
  revised_text: 'Esta é a disposição para quem causou uma morte e pode fugir para lá e viver: aquele que ferir o seu próximo sem intenção e não o odiava antes[a].'
