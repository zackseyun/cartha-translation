  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: pt
  text: 'Esta é a disposição para quem causou uma morte e pode fugir para lá e viver: aquele que ferir o seu próximo sem intenção e não o odiava antes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “desde ontem e anteontem”. A expressão idiomática significa “anteriormente” ou “de antemão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: disposição
  rationale: No contexto jurídico, דָּבָר indica a norma ou estipulação aplicável ao caso; “disposição” é natural e precisa em português.
- source_word: הָרֹצֵחַ
  choice: quem causou uma morte
  rationale: O termo designa aqui a pessoa responsável por uma morte, sem pressupor assassinato doloso. A formulação evita a conotação de culpa intencional frequentemente associada a “homicida”.
- source_word: יָנוּס שָׁמָּה
  choice: pode fugir para lá
  rationale: O imperfeito define quem tem direito de buscar refúgio, e não formula diretamente uma ordem; “pode” expressa essa permissão jurídica.
- source_word: וָחָי
  choice: e viver
  rationale: 'Preserva de modo conciso a sequência hebraica e seu sentido resultativo: a fuga permite que a pessoa continue viva.'
- source_word: יַכֶּה
  choice: ferir mortalmente
  rationale: נכה significa literalmente “golpear/ferir”, mas o contexto identifica o golpe como causador da morte. “Ferir mortalmente” mantém a imagem verbal sem deixar incerto o resultado fatal pressuposto pelo caso legal.
- source_word: רֵעֵהוּ
  choice: o seu próximo
  rationale: “Próximo” preserva o sentido relacional de רֵעַ e é corrente na linguagem jurídica e bíblica em português.
- source_word: בִּבְלִי דַעַת
  choice: sem intenção
  rationale: Literalmente “sem conhecimento”; neste contexto legal, a expressão indica ausência de consciência prévia ou intenção no ato.
- source_word: לֹא שֹׂנֵא לוֹ
  choice: não tiver ódio dele
  rationale: O particípio negado descreve a ausência de hostilidade anterior contínua. A expressão é natural em português e conserva a relevância jurídica da inimizade prévia.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: anteriormente
  rationale: A expressão idiomática significa “antes” ou “previamente”. A tradução idiomática mantém o texto corrente, enquanto a forma literal é registrada em nota.
theological_decisions:
- issue: Grau de culpa indicado por הָרֹצֵחַ
  choice: quem causou uma morte
  alternative: homicida / assassino
  rationale: O contexto distingue morte não intencional de assassinato culpável. A escolha não antecipa um juízo moral que o próprio caso legal está determinando.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se “homicida” por sua possível conotação de dolo. O marcador da nota foi colocado junto de “anteriormente”, termo ao qual a explicação do idioma hebraico efetivamente se refere.
