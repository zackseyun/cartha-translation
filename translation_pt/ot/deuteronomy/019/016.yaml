  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: pt
  text: Se uma testemunha mal-intencionada[a] se levantar contra um homem para dar testemunho contra ele de rebeldia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma testemunha falsa». A expressão hebraica significa literalmente «uma testemunha de violência/injustiça» e pode designar um acusador mal-intencionado ou falso em juízo.
    reason: lexical_alternative
  - marker: b
    text: Ou «desvio» ou «apostasia». A palavra hebraica pode indicar afastamento grave, desafio ou defecção; neste contexto, refere-se ao teor da acusação apresentada em juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Introduz uma condição casuística no contexto legal; «Se» é a formulação portuguesa mais natural.
- source_word: יָקוּם
  choice: se levantar
  rationale: Conserva a imagem concreta de קום e, no contexto judicial, comunica que a testemunha toma posição contra o acusado.
- source_word: עֵד חָמָס
  choice: uma testemunha mal-intencionada
  rationale: A expressão significa literalmente «testemunha de violência/injustiça» e aqui descreve alguém que presta testemunho com intenção perversa; a nota preserva a alternativa tradicional «testemunha falsa».
- source_word: בְּאִישׁ
  choice: contra um homem
  rationale: A preposição assinala o alvo da acusação, e אִישׁ é masculino singular; conserva-se a formulação masculina representativa do caso legal.
- source_word: לַעֲנוֹת
  choice: para acusá-lo
  rationale: Embora o verbo possa significar «responder», em contexto forense refere-se a prestar depoimento. Como o testemunho é hostil e dirigido contra o homem, «acusá-lo» é idiomático e claro.
- source_word: בּוֹ
  choice: -lo
  rationale: O pronome retoma «um homem» e, unido a «acusar», expressa naturalmente em português que o depoimento é contra ele.
- source_word: סָרָה
  choice: rebeldia
  rationale: O substantivo indica desvio grave, desafio ou defecção. «Rebeldia» preserva sua força sem restringi-lo necessariamente à apostasia religiosa.
theological_decisions:
- issue: Linguagem masculina representativa na formulação legal
  choice: contra um homem
  alternative: contra alguém / contra uma pessoa
  rationale: O hebraico emprega אִישׁ, masculino singular, na apresentação do caso jurídico. A tradução mantém essa forma sem afirmar que o princípio legal se limite aos homens.
- issue: Natureza da acusação expressa por סָרָה
  choice: rebeldia
  alternative: desvio / apostasia / delito
  rationale: «Rebeldia» mantém a gravidade e a amplitude do termo hebraico. «Apostasia» imporia uma referência religiosa que o versículo não explicita, enquanto «delito» seria genérico demais.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe própria de uma disposição legal. A vírgula final foi mantida porque o versículo introduz a condição cuja consequência continua nos versículos seguintes.
