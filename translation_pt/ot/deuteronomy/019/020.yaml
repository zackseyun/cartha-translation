base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: pt
  text: Os que restarem[a] ouvirão e temerão; e nunca mais farão algo mau como isso[b] em teu meio[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “os restantes” ou “os que ficaram”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “como esta coisa má”, isto é, um ato mau desse tipo.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega o singular, dirigindo-se a Israel como um todo: “em teu meio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: os que restarem
  rationale: O particípio nifal de שׁאר designa as pessoas que ficam depois da punição judicial. “Os que restarem” é natural em português e preserva o caráter verbal da expressão.
- source_word: יִשְׁמְעוּ
  choice: ouvirão
  rationale: Mantém o sentido básico de שמע. No contexto, implica que tomarão conhecimento do ocorrido, sem explicitar no texto o complemento ausente no hebraico.
- source_word: וְיִרָאוּ
  choice: e temerão
  rationale: ירא expressa aqui o temor provocado pela punição e seu efeito dissuasório. “Temerão” conserva o tom jurídico e solene.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: e nunca mais farão
  rationale: A combinação de יסף com o infinitivo e עוֹד comunica que o ato não deverá voltar a ocorrer. “Nunca mais farão” reproduz com naturalidade a força enfática da construção.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: uma coisa má como essa
  rationale: 'דבר refere-se aqui a um ato ou fato, enquanto o prefixo כ preserva a ideia comparativa: algo mau desse tipo. A formulação evita reduzir a expressão apenas ao caso específico.'
- source_word: בְּקִרְבֶּךָ
  choice: em seu meio
  rationale: Expressão jurídica e comunitária que significa dentro da comunidade de Israel. “Em seu meio” é corrente e digna em português, mantendo aberta a referência corporativa do pronome singular.
theological_decisions:
- issue: Número e destinatário em בְּקִרְבֶּךָ
  choice: usar “em seu meio” e explicar que o hebraico se dirige a Israel no singular coletivo
  alternative: “no meio de vocês” ou “entre vocês”
  rationale: O sufixo hebraico está na segunda pessoa masculina singular e trata Israel como um todo coletivo. “Em seu meio” conserva essa forma sem impor uma interpretação teológica adicional nem soar artificial em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O futuro mantém o tom de consequência e determinação da lei. O ponto e vírgula separa com clareza o efeito dissuasório da punição de seu resultado esperado.
