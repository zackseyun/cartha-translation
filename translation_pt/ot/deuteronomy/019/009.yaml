revisions:
- from: se guardares todo este mandamento[a] e o puseres em prática, o qual hoje te ordeno — amar Yahweh, teu Deus, e andar nos seus caminhos todos os dias —, acrescentarás para ti mais três cidades, além destas três,
  to: se guardares todo este mandamento[a], pondo-o em prática, que hoje te ordeno — amar Yahweh, teu Deus, e andar nos seus caminhos todos os dias —, acrescentarás para ti mais três cidades, além destas três,
  rationale: A revisão limita-se a substituir a coordenação «e o puseres em prática» por «pondo-o em prática» e a posicionar a oração relativa de modo mais natural. Assim, mantém-se o sentido de guardar o mandamento mediante sua realização, bem como a ambiguidade moderada da relação dos infinitivos finais com o mandamento.
