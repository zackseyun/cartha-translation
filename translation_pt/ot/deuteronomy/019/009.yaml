    issue: Ligação sintática ambígua da oração relativa
    rationale: Em «e o puseres em prática, o qual hoje te ordeno», a oração introduzida por «o qual» fica distante de «mandamento» e sucede um pronome objeto («o»), o que torna a construção pouco fluida. Uma reformulação pontual clarifica o antecedente sem alterar o sentido.
