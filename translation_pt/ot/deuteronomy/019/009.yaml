source:
  edition: WLC
  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: pt
  text: se guardares todo este mandamento[a], pondo-o em prática, que hoje te ordeno — amar Yahweh, teu Deus, e andar nos seus caminhos todos os dias —, acrescentarás para ti mais três cidades, além destas três,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega o singular: «todo este mandamento».'
    reason: Preservar a forma singular incomum e abrangente do texto-fonte.
lexical_decisions:
- source_word: כִּי
  choice: se
  rationale: Introduz a condição da ampliação do número de cidades de refúgio; em português, «se» expressa com clareza essa relação condicional.
- source_word: תִשְׁמֹר
  choice: guardares
  rationale: No contexto da aliança, שׁמר significa guardar ou observar os mandamentos. «Guardares» mantém essa linguagem bíblica sem acrescentar um advérbio ausente no hebraico.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: todo este mandamento
  rationale: Preserva tanto a abrangência de כָּל quanto o singular מִצְוָה, ainda que o conjunto de exigências esteja em vista.
- source_word: לַעֲשֹׂתָהּ
  choice: e o puseres em prática
  rationale: Expressa a execução concreta do mandamento e preserva o pronome feminino singular hebraico por meio de «o», referente a «mandamento» em português.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: o qual hoje te ordeno
  rationale: Reproduz a oração relativa e o ato presente de Moisés ao ordenar, em formulação natural e solene em português.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: amar Yahweh, teu Deus
  rationale: Mantém o infinitivo que apresenta o conteúdo do mandamento e translitera diretamente o nome divino.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: e andar nos seus caminhos
  rationale: Conserva a metáfora pactual de andar nos caminhos de Deus, em vez de reduzi-la a uma paráfrase comportamental.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Comunica continuidade ao longo da vida sem introduzir no texto um possessivo que está apenas implícito.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: acrescentarás para ti mais três cidades
  rationale: Mantém o sentido aditivo de יסף e representa explicitamente לְךָ, embora a expressão seja ligeiramente marcada em português.
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: além destas três
  rationale: Aqui עַל tem valor aditivo e se refere às três cidades anteriormente designadas.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o nome próprio da aliança. «Yahweh» o representa por transliteração, sem substituí-lo por um título e sem impor uma leitura denominacional.
- issue: Relação entre guardar o mandamento, amar Deus e andar em seus caminhos
  choice: Preservar os infinitivos como conteúdo ou explicação do mandamento, sem definir mais precisamente sua relação sintática
  alternative: Traduzir explicitamente como finalidade («para que ames») ou como condição adicional («se amares» etc.)
  rationale: A construção hebraica permite que os infinitivos expliquem o conteúdo ou a expressão prática do mandamento. Os travessões preservam essa relação sem resolver além do que o texto exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com segunda pessoa do singular para refletir diretamente o discurso hebraico. A frase permanece aberta por vírgula porque o versículo integra uma construção que continua no contexto. O marcador [a] aparece junto à expressão explicada.
