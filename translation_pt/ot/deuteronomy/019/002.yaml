base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/002.yaml
  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: pt
  text: Separe para si três cidades dentro da terra que Yahweh, seu Deus, lhe está dando para tomar posse dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para herdá-la”. O verbo hebraico pode significar “tomar posse” ou “herdar” em contextos de concessão de terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: três cidades
  rationale: עִיר pode designar cidade ou povoado; “cidades” é a formulação consagrada e adequada ao contexto jurídico das cidades de refúgio.
- source_word: תַּבְדִּיל
  choice: Separe
  rationale: O hifil de בדל significa separar ou pôr à parte. “Separe” comunica de modo natural tanto a distinção espacial quanto a designação legal.
- source_word: לָךְ
  choice: para você
  rationale: A preposição com sufixo marca benefício ou interesse; “para você” preserva essa nuance sem sugerir que as cidades seriam propriedade pessoal do interlocutor.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: no território da sua terra
  rationale: בְּתוֹךְ expressa localização dentro dos limites da terra. A formulação evita a possível leitura de que as cidades deveriam ficar necessariamente no centro geográfico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz o construto com sufixo masculino singular e a forma de tratamento pactual do texto.
- source_word: נֹתֵן לְךָ
  choice: está dando a você
  rationale: O particípio indica ação em curso ou iminente; a locução progressiva preserva esse aspecto no contexto da promessa da terra.
- source_word: לְרִשְׁתָּהּ
  choice: para que tome posse dela
  rationale: ירשׁ pode significar possuir, tomar posse ou herdar em contextos de concessão territorial. Esta escolha é clara e mantém explícito o pronome feminino referente à terra.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo pelo título “SENHOR”.
- issue: Sentido de ירשׁ no contexto da terra concedida
  choice: tomar posse
  alternative: herdar
  rationale: Ambos os sentidos são possíveis. O texto principal usa “tomar posse” por sua clareza no contexto territorial, enquanto a nota conserva a alternativa legítima “herdar”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O imperativo “Separe” expressa naturalmente a força diretiva do yiqtol legal hebraico. A repetição de “terra” e “dela” mantém claro o referente, e a nota preserva a ambiguidade lexical de ירשׁ.
