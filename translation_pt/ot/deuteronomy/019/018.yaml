base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/018.yaml
  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: pt
  text: Os juízes investigarão cuidadosamente. Se constatarem que a testemunha é falsa e que deu falso testemunho contra seu irmão,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ ... הֵיטֵב
  choice: investigarão cuidadosamente
  rationale: O verbo דרשׁ, reforçado pelo infinitivo adverbial הֵיטֵב, exige uma investigação diligente e completa; a formulação é natural em contexto judicial moderno.
- source_word: וְהִנֵּה
  choice: Se constatarem que
  rationale: Neste contexto, introduz o resultado verificado pela investigação, não apenas uma exclamação visual. A forma condicional em português preserva o sentido forense e liga naturalmente as orações.
- source_word: עֵד שֶׁקֶר הָעֵד
  choice: a testemunha é falsa
  rationale: Mantém a repetição enfática de עֵד e שֶׁקֶר em forma idiomática e inteligível.
- source_word: שֶׁקֶר עָנָה
  choice: deu falso testemunho
  rationale: Em contexto jurídico, ענה descreve prestar ou depor como testemunha; esta expressão comunica com precisão a acusação.
- source_word: בְאָחִיו
  choice: contra seu irmão
  rationale: A preposição בְּ tem aqui valor adversativo, e אָחִיו designa o compatriota ou membro da comunidade. 'Irmão' conserva a linguagem pactual do hebraico sem restringi-la ao parentesco biológico.
theological_decisions:
- issue: Sentido comunitário de אָחִיו
  choice: seu irmão
  alternative: seu compatriota / seu próximo
  rationale: A tradução formal preserva a imagem bíblica de Israel como fraternidade comunitária; o contexto jurídico impede que seja entendida necessariamente como parentesco literal.
- issue: Valor de וְהִנֵּה após a investigação
  choice: Se constatarem que
  alternative: e eis que
  rationale: A escolha não elimina a condição implícita nem antecipa culpa; expressa o achado eventual dos juízes de modo natural em português.
translation_notes:
  register: Português moderno, digno e claro, com vocabulário jurídico acessível. O versículo termina com vírgula porque a sentença e sua consequência continuam no versículo seguinte.
