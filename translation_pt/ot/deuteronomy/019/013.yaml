  terminology: '"Piedade" representa bem a compaixão/poupança expressa pelo idiomático hebraico. "Culpa pelo derramamento de sangue inocente" exprime de modo inteligível a força jurídica de "purificar/remover o sangue inocente" sem sugerir vingança privada. A nota continua a indicar a formulação concreta hebraica.'
