base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: pt
  text: Seu olhar não terá piedade dele[a]. Assim, você removerá de Israel a culpa pelo derramamento de sangue inocente[b], e tudo irá bem com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não tenha piedade dele”. O hebraico menciona literalmente o olho como sede da piedade ou compaixão.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o sangue inocente”. Isto é, a culpa que recai sobre a comunidade pelo derramamento de sangue inocente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָחוֹס עֵינְךָ עָלָיו
  choice: Que o seu olhar não tenha piedade dele
  rationale: Preserva a imagem hebraica do olho como sede da compaixão, mas a expressa em português natural e solene. O contexto judicial indica que não se deve poupar o homicida por compaixão indevida.
- source_word: וּבִעַרְתָּ
  choice: Assim, você eliminará
  rationale: No direito deuteronômico, o verbo designa a remoção de um mal ou de uma culpa da comunidade, não uma queima literal. “Eliminará” é claro e mantém a força judicial; “assim” explicita a relação consequencial possível entre as orações.
- source_word: דַם הַנָּקִי
  choice: a culpa pelo sangue inocente
  rationale: A tradução torna explícita a ideia contextual de culpa comunitária decorrente do derramamento de sangue inocente. A nota registra a formulação hebraica mais literal para preservar a imagem e sua possível amplitude.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: Representa de modo conciso a remoção para fora da comunidade de Israel indicada pela preposição מן.
- source_word: וְטוֹב לָךְ
  choice: e tudo irá bem com você
  rationale: Expressa em português corrente a fórmula deuteronômica que associa a obediência a um resultado favorável.
theological_decisions:
- issue: Natureza da ordem relativa ao homicida
  choice: A comunidade deve executar a justiça legal sem deixar que uma compaixão indevida preserve o homicida e mantenha sobre Israel a culpa de sangue.
  alternative: A ordem poderia ser lida isoladamente como autorização para vingança particular.
  rationale: Deuteronômio 19:11–12 situa a ordem no procedimento judicial contra um homicida deliberado. A tradução não acrescenta “tribunal” ao versículo, mas conserva seu caráter comunitário e jurídico.
- issue: Sentido de דַם הַנָּקִי
  choice: Culpa decorrente do derramamento de sangue inocente
  alternative: Referência direta e não explicitada ao próprio “sangue inocente” que deve ser removido de Israel
  rationale: No contexto legal, eliminar o sangue inocente de Israel significa retirar da comunidade a responsabilidade por esse derramamento mediante a justiça devida. Como o hebraico mantém a expressão concreta, a nota oferece a forma literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A imagem do olhar foi mantida, enquanto a expressão jurídica sobre o sangue inocente foi esclarecida no texto e documentada em nota. O tratamento por “você” comunica o singular hebraico dirigido a Israel de forma coletiva.
