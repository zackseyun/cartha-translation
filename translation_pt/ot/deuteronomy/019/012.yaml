  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: pt
  text: Então os anciãos da cidade dele mandarão buscá-lo de lá, o entregarão nas mãos do vingador do sangue[a], e ele morrerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vingador de sangue”. A expressão hebraica גֹּאֵל הַדָּם é um termo jurídico técnico para a pessoa responsável por vingar o derramamento de sangue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ זִקְנֵי עִירוֹ
  choice: os anciãos da cidade dele mandarão
  rationale: A construção tem força prescritiva no contexto jurídico. “Os anciãos da cidade dele” identifica com clareza os líderes civis da cidade do homicida.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: buscá-lo ali
  rationale: Em combinação com “mandarão”, o verbo לקח expressa que os anciãos providenciam que ele seja retirado daquele lugar. “Mandarão buscá-lo ali” é natural em português sem acrescentar a ideia explícita de violência.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: o entregarão nas mãos do
  rationale: A expressão idiomática נתן ביד indica entregar alguém ao poder ou controle de outra pessoa. A formulação portuguesa preserva a imagem das “mãos” e comunica a transferência de custódia.
- source_word: גֹּאֵל הַדָּם
  choice: vingador do sangue
  rationale: Trata-se de uma expressão jurídica técnica para a pessoa incumbida de vingar o derramamento de sangue. A tradução é transparente e mantém a formulação específica do hebraico.
- source_word: וָמֵת
  choice: e ele morrerá
  rationale: A oração declara de modo breve o resultado jurídico da entrega. O futuro preserva a força prescritiva e resultativa do contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica direta. “Cidade dele” favorece ampla legibilidade brasileira; “nas mãos do” conserva a imagem idiomática hebraica sem soar excessivamente arcaica.
