base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: pt
  text: Uma só testemunha não bastará contra alguém por qualquer culpa ou por qualquer pecado, seja qual for o pecado que tenha cometido. Pelo depoimento de duas testemunhas ou pelo depoimento de três testemunhas, o caso será estabelecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela boca de duas testemunhas ou pela boca de três testemunhas”. O mesmo verbo, traduzido por “não bastará” no início do versículo e por “será estabelecido” no final, ocorre nas duas partes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: não será suficiente ... será estabelecido
  rationale: No contexto jurídico, קום indica que um depoimento ou caso se sustenta como válido. A formulação portuguesa explicita esse sentido legal; a nota registra a repetição do mesmo verbo hebraico.
- source_word: עֵד אֶחָד
  choice: uma só testemunha
  rationale: Expressão natural em português que destaca a insuficiência jurídica de um testemunho isolado.
- source_word: בְּאִישׁ
  choice: contra alguém
  rationale: A preposição tem sentido adversativo no contexto judicial. אִישׁ está no masculino singular representativo, mas 'alguém' comunica naturalmente em português a aplicação geral da norma.
- source_word: לְכָל עָוֺן וּלְכָל חַטָּאת
  choice: por qualquer culpa ou por qualquer pecado
  rationale: 'Mantém distintos os termos acumulados pelo hebraico: עָוֺן pode designar culpa ou iniquidade, enquanto חַטָּאת designa pecado.'
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: seja qual for o pecado que tenha cometido
  rationale: Preserva a abrangência enfática da construção hebraica sem reproduzir de modo artificial a cognatação 'pecado que pecar'.
- source_word: עַל פִּי
  choice: pelo depoimento de
  rationale: O idioma literalmente significa 'pela boca de', mas neste contexto se refere ao testemunho que serve de base jurídica.
- source_word: דָּבָר
  choice: o caso
  rationale: No contexto judicial, דָּבָר pode indicar o assunto ou caso submetido a decisão. 'Caso' é claro e mantém o sentido jurídico.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ
  choice: alguém
  alternative: um homem / uma pessoa
  rationale: Embora o hebraico use o masculino singular, trata-se de formulação legal representativa. 'Alguém' preserva a aplicação geral sem introduzir uma restrição masculina inexistente na norma.
- issue: Força jurídica de קום
  choice: ser suficiente / ser estabelecido
  alternative: ficar de pé / prevalecer
  rationale: O verbo conserva a imagem de algo que 'se mantém', mas aqui descreve a validade legal do testemunho e o estabelecimento do caso, não uma postura física.
translation_notes:
  register: Português moderno, claro e digno, com terminologia jurídica acessível. Evita o literalismo pouco natural de “não se levantará” e “pela boca de”, preservando por nota a imagem e a repetição do hebraico.
