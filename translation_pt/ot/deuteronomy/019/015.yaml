  source_fidelity: A tradução comunica corretamente a regra de que uma testemunha isolada não basta e que duas ou três estabelecem a questão. Contudo, «não será suficiente contra alguém» é menos natural e menos precisamente jurídico do que «não bastará contra alguém». A recorrência de קום é adequadamente sinalizada em nota, embora não possa ser reproduzida de modo inteiramente idiomático com o mesmo verbo português nos dois membros.
  naturalness: «Uma só testemunha não bastará contra alguém» é uma formulação mais corrente e clara no português jurídico e bíblico moderno. O restante do versículo tem registro acessível e digno.
  terminology: «Culpa», «pecado», «depoimento» e «caso» são escolhas defensáveis. «Alguém» comunica corretamente o alcance geral do masculino singular representativo hebraico, sem restringir a norma a homens.
