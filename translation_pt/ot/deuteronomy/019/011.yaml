  to: Mas, se um homem odiar o seu próximo, ficar à espreita dele, levantar-se contra ele, golpeá-lo mortalmente[a], e ele morrer, e então o homem fugir para uma dessas cidades,
  rationale: A revisão substitui uma expressão não idiomática por «ficar à espreita dele», que conserva a ideia de espera deliberada para atacar. Também torna a nota mais precisa quanto ao caráter idiomático da expressão hebraica, sem alterar o sentido do texto nem eliminar a sequência explícita entre o golpe e a morte.
