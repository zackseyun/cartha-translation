  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: pt
  text: Mas, se um homem odiar o seu próximo, ficar à espreita dele, levantar-se contra ele, golpeá-lo mortalmente[a], e ele morrer, e então o homem fugir para uma dessas cidades,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «golpeá-lo de modo que ele morra». Literalmente, o hebraico diz «golpeá-lo, vida/alma»; trata-se de uma construção idiomática que indica um golpe letal.
    reason: alternativa lexical e esclarecimento do idioma hebraico
lexical_decisions:
- source_word: וְכִי
  choice: Mas, se
  rationale: Introduz um caso condicional que contrasta com o homicídio não intencional tratado anteriormente; «Mas, se» expressa tanto a condição quanto a transição adversativa.
- source_word: יִהְיֶה אִישׁ שֹׂנֵא לְרֵעֵהוּ
  choice: um homem odiar o seu próximo
  rationale: A formulação condicional com o subjuntivo é natural em português. «Homem» preserva o caso jurídico masculino apresentado no hebraico, e «próximo» comunica o sentido social e jurídico de רֵעַ sem pressupor amizade íntima.
- source_word: וְאָרַב לוֹ
  choice: ficar de emboscada contra ele
  rationale: Expressa a espera deliberada para atacar e torna clara a premeditação indicada pelo verbo hebraico.
- source_word: וְקָם עָלָיו
  choice: levantar-se contra ele
  rationale: Preserva a imagem e a sequência do idioma hebraico, que descreve uma ação hostil contra a vítima.
- source_word: וְהִכָּהוּ נֶפֶשׁ
  choice: golpeá-lo mortalmente
  rationale: A combinação de נכה com נֶפֶשׁ é uma expressão de golpe letal. «Mortalmente» transmite essa força idiomática sem substituir toda a sequência por «assassiná-lo».
- source_word: וָמֵת
  choice: e ele morrer
  rationale: Mantém explicitamente o resultado da agressão e a sequência coordenada do hebraico, ainda que a letalidade já esteja implícita na expressão anterior.
- source_word: וְנָס אֶל אַחַת הֶעָרִים הָאֵל
  choice: e então o homem fugir para uma dessas cidades
  rationale: «Fugir» corresponde diretamente ao verbo hebraico, e a retomada de «o homem» evita em português a possível confusão entre agressor e vítima depois de «ele morrer». «Dessas cidades» remete naturalmente às cidades de refúgio já mencionadas no contexto.
theological_decisions:
- issue: Descrição jurídica de homicídio intencional em contraste com morte acidental
  choice: Preservar a sequência «odiar... ficar de emboscada... levantar-se contra... golpear mortalmente»
  alternative: Resumir a sequência como «assassiná-lo»
  rationale: O texto caracteriza a intenção e a premeditação por uma cadeia concreta de atitudes e atos. Manter essa cadeia evita acrescentar um rótulo jurídico resumido e conserva a forma pela qual o hebraico estabelece a culpa.
- issue: Relação entre o golpe contra a נֶפֶשׁ e a morte subsequente
  choice: «golpeá-lo mortalmente, e ele morrer»
  alternative: «golpeá-lo de modo que ele morra»
  rationale: 'A redação escolhida preserva os dois elementos do hebraico: o caráter letal do golpe e a afirmação subsequente da morte. A nota registra a forma literal e a alternativa mais fluente, sem apagar a tensão sintática.'
translation_notes:
  register: Português moderno, digno e acessível, com cadência jurídica. O subjuntivo organiza naturalmente a condição. A repetição de «ele» foi parcialmente desambiguada pela retomada de «o homem» para identificar o agressor como aquele que foge. O versículo termina com vírgula porque a sentença jurídica continua no versículo seguinte.
