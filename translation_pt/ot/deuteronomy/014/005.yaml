  yaml_path: translation/ot/deuteronomy/014/005.yaml
  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: pt
  text: o cervo[a], a gazela, o gamo, a cabra selvagem, o íbex, o antílope e a ovelha-da-montanha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação de vários animais deste versículo é incerta. “Gamo” também pode designar outro tipo de cervo; “cabra selvagem” pode ser “íbex”; “íbex” pode ser “adax”; “antílope” pode ser “boi selvagem” ou “auroque”; e “ovelha-da-montanha” pode ser “camurça” ou “cabra-montês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: cervo
  rationale: Designa um cervídeo, possivelmente o macho. “Cervo” é natural, claro e não especifica além do necessário.
- source_word: צְבִי
  choice: gazela
  rationale: É a identificação moderna mais comum e distingue adequadamente este animal dos cervídeos da lista.
- source_word: יַחְמוּר
  choice: gamo
  rationale: A espécie exata é incerta; “gamo” é uma identificação tradicional e inteligível em português, sem ocultar a incerteza registrada na nota.
- source_word: אַקּוֹ
  choice: cabra selvagem
  rationale: Provavelmente indica um caprino silvestre. A expressão é mais transparente ao leitor comum que uma identificação zoológica estrita como “íbex”.
- source_word: דִישׁוֹן
  choice: íbex
  rationale: É uma identificação plausível e concisa, embora o animal exato seja discutido; as alternativas são preservadas na nota.
- source_word: תְּאוֹ
  choice: antílope
  rationale: Identificação corrente e legível dentro da lista de ruminantes selvagens; a possibilidade de um bovino selvagem permanece na nota.
- source_word: זָמֶר
  choice: ovelha-da-montanha
  rationale: Expressa de modo acessível o provável tipo de animal, sem fingir precisão zoológica; outras identificações são registradas na nota.
