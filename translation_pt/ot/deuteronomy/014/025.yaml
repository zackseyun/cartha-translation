  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: pt
  text: então, troque-o por prata[a], amarre a prata em sua mão[b] e vá ao lugar que Yahweh, seu Deus, escolher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “troque-o por dinheiro”. O hebraico diz literalmente “prata”, que neste contexto funciona como dinheiro.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “embrulhe a prata em sua mão”, isto é, acondicione-a com segurança para a viagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: troque tudo por prata
  rationale: A construção com נָתַן, ב e כֶּסֶף expressa aqui a troca do dízimo mencionado no contexto por prata usada como dinheiro. “Troque” comunica naturalmente a transação, enquanto “prata” preserva o termo concreto hebraico.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: amarre a prata em sua mão
  rationale: צָרַר significa amarrar, embrulhar ou prender. A formulação conserva a imagem concreta de acondicionar e levar a prata em segurança, sem substituí-la pela paráfrase geral “leve o dinheiro com você”.
- source_word: בְּיָדְךָ
  choice: em sua mão
  rationale: Tradução direta que mantém a imagem hebraica, embora no contexto também implique posse e controle durante a viagem.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: e vá ao lugar
  rationale: הלך é o verbo comum para ir; o imperativo português é natural na sequência de instruções legais e representa adequadamente a forma hebraica de valor injuntivo.
- source_word: אֲשֶׁר יִבְחַר
  choice: que ... escolher
  rationale: O imperfeito aponta naturalmente para a escolha futura do lugar por Yahweh no contexto da instrução deuteronômica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Equivalente português corrente da designação pactual ligada ao nome divino.
theological_decisions:
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem convertê-lo em título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Troque” evita o pouco natural “converta em prata”; “amarre ... em sua mão” conserva deliberadamente a imagem concreta e algo incomum do hebraico, esclarecida em nota. O pronome “tudo” retoma o produto/dízimo do versículo anterior sem especificá-lo novamente.
