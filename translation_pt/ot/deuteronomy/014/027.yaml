base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: pt
  text: E não abandone[a] o levita que está em suas cidades,[b] pois ele não tem parte nem herança com você.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não desampare” ou “não negligencie”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que está dentro dos seus portões”; expressão hebraica referente às cidades ou comunidades locais.
    reason: cultural_note
  - marker: c
    text: Isto é, o levita não recebeu uma porção territorial tribal normal entre os israelitas.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: E ... o levita
  rationale: O substantivo definido singular representa um membro da classe levítica. “Levita” é preciso; acrescentar “sacerdote” iria além do hebraico, pois nem todo levita era sacerdote.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: que vive em suas cidades
  rationale: A expressão hebraica literalmente diz “que está dentro dos seus portões”, uma fórmula para as cidades ou comunidades locais. A tradução comunica naturalmente o referente do idioma, e a nota preserva sua imagem.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: não abandone
  rationale: עזב pode significar deixar, abandonar ou desamparar. “Não abandone” mantém a força ampla do verbo e, neste contexto, inclui não deixar o levita sem o devido sustento.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem. “Pois” conserva o tom digno e é claro em português moderno.
- source_word: אֵין לוֹ
  choice: ele não tem
  rationale: Forma idiomática em português para a construção existencial hebraica, literalmente “não há para ele”.
- source_word: חֵלֶק וְנַחֲלָה
  choice: parte nem herança
  rationale: O par designa participação ou quinhão e herança territorial. Depois da negação, “nem” exprime naturalmente em português a privação dos dois elementos ligados por וְ.
- source_word: עִמָּךְ
  choice: com você
  rationale: Reproduz diretamente a preposição e o singular de segunda pessoa, preservando a ideia de que o levita não possui tal quinhão ao lado do israelita e do restante do povo.
theological_decisions:
- issue: Natureza da privação do levita
  choice: A falta de “parte” e “herança” refere-se principalmente à ausência de uma porção territorial tribal normal em Israel, fundamento para o sustento comunitário do levita.
  alternative: Uma referência genérica à marginalização social, sem relação específica com a posse da terra.
  rationale: No contexto de Deuteronômio, a fórmula “parte e herança” aponta para a ausência de território tribal concedido aos levitas. A tradução mantém essa linguagem, e a nota esclarece o contexto sem inserir interpretação adicional no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para o singular hebraico e traduz o idioma dos portões pelo seu sentido corrente, preservando a imagem literal em nota. Os marcadores foram colocados junto às expressões que esclarecem.
