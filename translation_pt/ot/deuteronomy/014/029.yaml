  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: pt
  text: E o levita virá, pois não tem nem parte nem herança com você; e o estrangeiro residente[a], o órfão e a viúva que estiverem nas suas cidades[b] comerão e ficarão satisfeitos, para que Yahweh, seu Deus, abençoe você em todo o trabalho das suas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “residente estrangeiro”. O termo hebraico se refere a uma pessoa não israelita que vivia entre os israelitas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dentro dos seus portões”, expressão hebraica que se refere às cidades ou comunidades locais.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא
  choice: virão
  rationale: Embora a forma verbal hebraica esteja no singular e tenha como sujeito imediato “o levita”, a frase passa a enumerar outros grupos e depois emprega verbos no plural. Em português, o plural posposto à enumeração completa transmite naturalmente o sentido prospectivo da instrução legal.
- source_word: הַלֵּוִי
  choice: o levita
  rationale: Designa a classe tribal e social dos levitas, sem afirmar que este levita seja especificamente sacerdote.
- source_word: חֵלֶק וְנַחֲלָה
  choice: parte nem herança
  rationale: Mantém os dois termos do par hebraico, que abrangem tanto a participação atribuída quanto a propriedade hereditária.
- source_word: הַגֵּר
  choice: o estrangeiro residente
  rationale: Expressa a condição de uma pessoa não israelita que residia de modo estável no meio de Israel; é mais preciso no português atual do que apenas “estrangeiro” ou “forasteiro”.
- source_word: הַיָּתוֹם
  choice: o órfão
  rationale: É a designação portuguesa corrente para a categoria social vulnerável indicada pelo hebraico e tradicionalmente associada à viúva e ao estrangeiro residente.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: que estiverem nas suas cidades
  rationale: “Nos seus portões” é uma expressão metonímica hebraica para as cidades ou comunidades sob a jurisdição local. A tradução explicita o sentido para o leitor moderno.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: comerão e ficarão satisfeitos
  rationale: Conserva a sequência verbal e comunica que a provisão lhes permitirá comer o suficiente.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: para que ... abençoe você
  rationale: A construção marca propósito ou resultado pretendido, sem transformar a bênção em uma previsão automática e incondicional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ
  choice: em todo o trabalho das suas mãos
  rationale: Preserva a imagem hebraica das mãos como agentes da atividade humana, em linguagem portuguesa clara e natural.
theological_decisions:
- issue: Forma de representar o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome divino pessoal, não o título אֲדֹנָי; “Yahweh” mantém essa distinção textual.
- issue: Relação entre a assistência aos vulneráveis e a bênção divina
  choice: “para que ... abençoe”, como propósito ou resultado esperado
  alternative: “e ... abençoará”, como promessa incondicional
  rationale: לְמַעַן seguido do imperfeito exprime finalidade ou resultado pretendido. A formulação preserva essa relação sem definir além do texto o mecanismo teológico da bênção.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem sintática foi ajustada para reunir naturalmente os quatro grupos como sujeito dos verbos no plural. Conservou-se a imagem “trabalho das suas mãos”, e o tratamento singular “você” corresponde ao destinatário israelita coletivo apresentado no singular.
