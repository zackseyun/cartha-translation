  text: You shall not eat any detestable thing[a].
translation:
  language: pt
  text: Não coma nada que seja detestável.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nenhuma abominação”. O termo hebraico se refere a algo abominável ou detestável; aqui, ele introduz a lista de alimentos proibidos que vem a seguir.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכַל
  choice: Não coma
  rationale: A negação לֹא com o imperfeito qal de segunda pessoa masculina singular, neste contexto legal, expressa uma proibição direta. O imperativo negativo é a forma mais natural de preservar essa força em português moderno.
- source_word: כָּל
  choice: nada que seja
  rationale: Sob negação e com um substantivo singular, esta construção comunica abrangência total. “Nada que seja” soa natural em português e corresponde ao sentido de “nenhuma coisa”.
- source_word: תּוֹעֵבָה
  choice: detestável
  rationale: O substantivo designa algo abominável, repugnante ou incompatível com as exigências da aliança. Neste contexto, introduz os alimentos proibidos nos versículos seguintes; “detestável” mantém a força do termo sem recorrer a linguagem excessivamente arcaica.
theological_decisions:
- issue: Força da proibição na legislação da aliança
  choice: 'Proibição direta: “Não coma nada que seja detestável.”'
  alternative: 'Declaração genérica: “Você não come nada que seja detestável.”'
  rationale: Neste contexto jurídico, לֹא seguido do imperfeito tem força normativa, não meramente descritiva ou preditiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A forma “Não coma” transmite naturalmente a proibição dirigida ao indivíduo representativo de Israel. O marcador [a] aparece no texto principal.
