  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: pt
  text: Mas não comerão nada que não tenha barbatanas e escamas; é impuro para vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Mas tudo o que
  rationale: כֹל tem sentido abrangente, “tudo”; neste contexto, ו introduz contraste com a permissão do versículo anterior, por isso “Mas” é natural em português.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: que não tiver
  rationale: A construção אֵין + sufixo pronominal expressa ausência de posse. “Que não tiver” reproduz isso com naturalidade numa regra geral.
- source_word: סְנַפִּיר וְ/קַשְׂקֶשֶׂת
  choice: barbatanas e escamas
  rationale: Embora os substantivos estejam no singular hebraico, o plural é idiomático em português para descrever genericamente as características dos animais aquáticos.
- source_word: לֹא תֹאכֵלוּ
  choice: vocês não comerão
  rationale: A forma verbal na segunda pessoa do plural com לֹא, em contexto legal, expressa proibição. O futuro mantém o tom normativo e continua claro no português moderno.
- source_word: טָמֵא
  choice: impuro
  rationale: Em contexto de pureza ritual e alimentar, “impuro” designa com precisão a categoria cultual, sem sugerir apenas sujeira física.
- source_word: הוּא לָכֶם
  choice: é impuro para vocês
  rationale: Preserva tanto a afirmação de estado expressa por הוּא quanto a relação específica com a comunidade indicada por לָכֶם.
theological_decisions:
- issue: Natureza da impureza
  choice: impuro
  alternative: sujo
  rationale: O termo descreve uma categoria ritual e pactual para Israel, não meramente falta de higiene; a tradução não amplia nem reduz essa categoria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna explícita a segunda pessoa plural do hebraico; “não comerão” preserva o registro jurídico sem recorrer a formas arcaicas.
