  source_fidelity: 'O sentido central está preservado: a proibição abrange todo ser aquático sem barbatanas e escamas, e o seu estatuto é de impureza para os destinatários. Contudo, a ordem «tudo o que ... vocês não comerão» pode introduzir em português uma ambiguidade de escopo, como se não se devesse comer a totalidade desses seres, em vez de proibir qualquer um deles.'
  naturalness: «Barbatanas e escamas» e «é impuro para vocês» são naturais e adequados ao português moderno. A formulação negativa com «nada que» é mais idiomática e deixa inequívoco o alcance abrangente da proibição.
  terminology: «Impuro» é apropriado para טָמֵא no contexto de classificação ritual/alimentar; não deve ser reduzido a uma noção de sujeira física. «Barbatanas» traduz adequadamente סְנַפִּיר em registro amplo e compreensível.
