  text: the pelican[a], the carrion vulture, and the cormorant[c][b],
translation:
  language: pt
  text: o pelicano[a], o abutre[b] e o corvo-marinho[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação dos nomes hebraicos das aves neste versículo é incerta. “Pelicano” também pode ser traduzido por “coruja-do-deserto” ou simplesmente “coruja”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa provavelmente algum tipo de abutre; a espécie exata é incerta.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico pode designar outra ave aquática, como um pelicano ou uma coruja-pescadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּאָת
  choice: o pelicano
  rationale: A identificação da ave é incerta. “Pelicano” é uma tradução tradicional e amplamente reconhecida, adequada ao contexto de uma lista de aves, enquanto a nota preserva outras possibilidades lexicais.
- source_word: הָרָחָמָה
  choice: o abutre
  rationale: O termo parece designar uma ave de rapina necrófaga. “Abutre” é natural e claro em português, sem impor uma identificação de espécie mais precisa do que a evidência permite.
- source_word: הַשָּׁלָךְ
  choice: o corvo-marinho
  rationale: Embora a espécie exata seja discutida, o termo provavelmente designa uma ave aquática que pesca. “Corvo-marinho” é uma equivalência moderna comum; as alternativas permanecem na nota.
- source_word: וְ / וְאֶת
  choice: e / [marcador de objeto direto não traduzido]
  rationale: A conjunção וְ é traduzida por “e”. O marcador hebraico de objeto direto אֵת não possui equivalente lexical necessário em português.
