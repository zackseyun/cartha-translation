  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: pt
  text: 'Use o dinheiro para comprar tudo o que desejar: gado, ovelhas e cabras[a], vinho, bebida forte[b] ou tudo o que quiser.[c] Coma ali, diante de Yahweh, seu Deus, e alegre-se, você e os de sua casa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico abrange os animais do pequeno rebanho, principalmente ovelhas e cabras.
    reason: lexical_alternative
  - marker: b
    text: “Bebida forte” refere-se a uma bebida alcoólica diferente do vinho.
    reason: cultural_note
  - marker: c
    text: 'Literalmente, nas duas expressões de desejo: “tudo o que sua alma desejar” e “tudo o que sua alma lhe pedir”. Aqui, “alma” indica a própria pessoa em seus desejos ou apetites.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: Use o dinheiro para comprar
  rationale: O hebraico diz literalmente “dê a prata”, mas, neste contexto comercial, a expressão significa empregar o dinheiro na compra das provisões para a celebração.
- source_word: תְּאַוֶּה נַפְשְׁךָ
  choice: tudo o que desejar
  rationale: נֶפֶשׁ designa aqui a própria pessoa como sujeito do desejo, especialmente em relação ao que será consumido. A formulação portuguesa é natural e evita sugerir uma distinção entre corpo e alma que o contexto não exige.
- source_word: בַּבָּקָר
  choice: gado
  rationale: בָּקָר é um termo coletivo para bovinos; “gado” comunica esse sentido de modo claro e conciso.
- source_word: וּבַצֹּאן
  choice: ovelhas e cabras
  rationale: צֹאן abrange coletivamente os animais de pequeno porte do rebanho, sobretudo ovelhas e cabras. A explicitação evita restringir indevidamente o termo a ovelhas.
- source_word: וּבַיַּיִן
  choice: vinho
  rationale: Equivalente português usual e direto de יַיִן.
- source_word: וּבַשֵּׁכָר
  choice: bebida forte
  rationale: שֵׁכָר indica uma bebida alcoólica distinta do vinho. “Bebida forte” preserva a distinção sem especificar uma bebida cuja identidade exata o texto não informa.
- source_word: וּבְכֹל אֲשֶׁר תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: ou qualquer outra coisa que tiver vontade de consumir
  rationale: A expressão amplia a lista precedente. “Tiver vontade de consumir” transmite naturalmente a imagem hebraica da pessoa ou do apetite pedindo algo, sem a formulação pouco idiomática “que sua alma lhe pedir”.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: Coma ali
  rationale: Forma imperativa natural em português para a instrução hebraica; “ali” remete ao local de culto indicado no contexto.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: diante de Yahweh, seu Deus
  rationale: “Diante de” preserva a fórmula de presença cultual, e “Yahweh” representa o nome divino יהוה.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: e alegre-se, você e toda a sua família
  rationale: “Alegre-se” mantém o caráter celebrativo da ordem. בַּיִת significa aqui a casa no sentido de unidade familiar; “toda” torna natural em português a inclusão expressa pelo hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o nome da aliança. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Referência explícita a bebidas alcoólicas
  choice: vinho, bebida forte
  alternative: vinho, outra bebida
  rationale: O hebraico nomeia vinho e שֵׁכָר, uma segunda bebida alcoólica. A tradução mantém essa referência sem suavização doutrinária nem especificação excessiva.
- issue: Sentido de נֶפֶשׁ nas duas expressões de desejo
  choice: desejo ou vontade da pessoa, com nota sobre a forma literal
  alternative: alma
  rationale: Neste contexto de aquisição e consumo, נֶפֶשׁ expressa a pessoa desejante ou seu apetite. Traduzir simplesmente por “alma” poderia introduzir uma leitura antropológica inadequada, mas a nota conserva a imagem do original.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais de ampla compreensão e boa legibilidade brasileira. O singular “você” representa o destinatário individual do hebraico, enquanto “família” comunica o sentido doméstico de בַּיִת. As notas preservam nuances lexicais que soariam artificiais ou potencialmente enganosas se reproduzidas literalmente no corpo do versículo.
