    issue: Restrição indevida da segunda expressão de desejo
    rationale: «...que tiver vontade de consumir» limita a «consumo» o hebraico וּבְכֹל אֲשֶׁר תִּשְׁאָלְךָ נַפְשֶׁךָ, que diz de modo mais amplo «em tudo o que a sua nefesh lhe pedir». Além disso, «outra» não está explicitamente no original.
  - severity: low
    issue: «Toda a sua família» é mais estreito que «sua casa»
    rationale: בֵּיתֶךָ pode incluir a unidade doméstica além dos parentes imediatos. «Os de sua casa» conserva essa amplitude sem perder naturalidade.
