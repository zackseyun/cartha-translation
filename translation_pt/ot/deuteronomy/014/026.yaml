revisions:
- from: 'Use o dinheiro para comprar tudo o que desejar: gado, ovelhas e cabras[a], vinho, bebida forte[b] ou qualquer outra coisa que tiver vontade de consumir.[c] Coma ali, diante de Yahweh, seu Deus, e alegre-se, você e toda a sua família.'
  to: 'Use o dinheiro para comprar tudo o que desejar: gado, ovelhas e cabras[a], vinho, bebida forte[b] ou tudo o que quiser.[c] Coma ali, diante de Yahweh, seu Deus, e alegre-se, você e os de sua casa.'
  rationale: A revisão elimina o acréscimo e a limitação semântica de «qualquer outra coisa que tiver vontade de consumir», preservando a amplitude da segunda fórmula hebraica de desejo. Também substitui «toda a sua família» por «os de sua casa», que reproduz melhor o alcance de «casa» como unidade doméstica. As demais escolhas e notas permanecem seguras e fiéis.
