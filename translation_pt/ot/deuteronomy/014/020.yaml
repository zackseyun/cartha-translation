lexical_decisions:
- source_word: כָּל
  choice: qualquer
  rationale: No contexto permissivo, expressa de modo natural que toda ave pertencente à categoria indicada pode ser comida.
- source_word: עוֹף
  choice: ave
  rationale: Embora o termo possa abranger criaturas voadoras, o contexto imediato das leis alimentares trata especificamente de aves; “ave” é claro, atual e adequado.
- source_word: טָהוֹר
  choice: pura
  rationale: Designa a categoria ritual permitida nas leis alimentares. Em português, “ave pura” é a formulação bíblica consagrada e contrasta com a categoria impura.
- source_word: תֹּאכֵלוּ
  choice: vocês podem comer
  rationale: O imperfeito na formulação legal tem aqui força permissiva, em contraste com as proibições do contexto. “Podem comer” transmite essa permissão sem convertê-la em ordem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural explícito (“vocês”) e formulação natural. Não se acrescentou nota, pois a ordem formal hebraica não oferece uma alternativa de sentido relevante em português.
