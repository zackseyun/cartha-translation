  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: pt
  text: E todos os seres alados que enxameiam são impuros para vocês[a]; não serão comidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda criatura que voa e enxameia” ou “toda criatura alada que enxameia”. A expressão hebraica combina שֶׁרֶץ (“ser que enxameia”) com עוֹף (“criatura voadora”, “ave”) e provavelmente se refere sobretudo a insetos voadores, não a aves no sentido comum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: E todos
  rationale: וְ liga a proibição às leis alimentares anteriores, e כֹל expressa totalidade. O plural em português permite uma formulação natural e concorda com a forma verbal plural no fim do versículo.
- source_word: שֶׁרֶץ הָעוֹף
  choice: seres alados que enxameiam
  rationale: שֶׁרֶץ designa criaturas pequenas que se movem em grande número, enquanto עוֹף abrange aquilo que voa ou possui asas. A expressão provavelmente se refere sobretudo a insetos voadores; esta tradução evita entendê-la como aves no sentido comum.
- source_word: טָמֵא הוּא לָכֶם
  choice: são impuros para vocês
  rationale: טָמֵא é o termo habitual para a condição ritual ou alimentar de impureza. “Para vocês” mantém a orientação da norma aos israelitas.
- source_word: לֹא יֵאָכֵלוּ
  choice: não serão comidos
  rationale: A tradução conserva tanto a voz passiva quanto o plural da forma hebraica, em registro jurídico claro e atual.
