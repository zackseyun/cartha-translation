  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação plural torna natural a concordância em português e preserva o plural da proibição passiva hebraica; “seres alados que enxameiam” mantém a amplitude lexical sem restringir indevidamente a categoria a aves comuns.
