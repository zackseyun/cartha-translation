base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: pt
  text: 'E estas são as aves que vocês não comerão: a águia[a], o abutre-barbudo e o abutre-negro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação das aves designadas pelos nomes hebraicos neste versículo é incerta. “Águia” talvez se refira a um grande abutre; “abutre-barbudo” é tradicionalmente chamado de “quebra-ossos”; e alguns traduzem “abutre-negro” como “águia-pescadora” ou “águia-marinha”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: E estas são
  rationale: Embora o hebraico tenha forma singular, a expressão introduz uma enumeração de aves; o plural idiomático em português torna essa função clara.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: as aves que vocês não comerão
  rationale: Explicita o referente implícito no contexto imediato e preserva a proibição direta. O sentido partitivo de מִן é naturalmente comunicado pela seleção das aves enumeradas.
- source_word: הַנֶּשֶׁר
  choice: a águia
  rationale: É a tradução tradicional e amplamente reconhecida, embora o termo hebraico possa designar uma grande ave de rapina ou um abutre; a incerteza é registrada em nota.
- source_word: הַפֶּרֶס
  choice: o abutre-barbudo
  rationale: Identificação moderna plausível para a ave conhecida tradicionalmente como quebra-ossos; evita um termo arcaico e permanece compreensível.
- source_word: הָעָזְנִיָּה
  choice: o abutre-preto
  rationale: É uma identificação acadêmica moderna possível, mas não segura; outras propostas são preservadas na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e nomes comuns atuais das aves, deixando a incerteza zoológica explícita em nota.
