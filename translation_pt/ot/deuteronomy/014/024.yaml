base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: pt
  text: E, se o caminho for longo demais para você e você não puder carregar o dízimo, porque o lugar que Yahweh, seu Deus, escolher para ali pôr o seu nome ficar longe demais de você, quando Yahweh, seu Deus, abençoar você[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois Yahweh, seu Deus, abençoa você”. A conjunção hebraica também pode ser entendida em sentido causal aqui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Mas, se
  rationale: Introduz uma condição que dá continuidade à instrução anterior; “Mas, se” expressa naturalmente o contraste prático em português.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: o caminho for longo demais para você
  rationale: Reproduz de modo idiomático a ideia de que a distância excede o que a pessoa consegue percorrer levando o dízimo.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: você não puder carregar o dízimo
  rationale: נשא indica carregar fisicamente. O referente pronominal é explicitado como “o dízimo” a partir do contexto imediato, evitando ambiguidade pouco natural em português.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: o lugar ... fica longe demais de você
  rationale: Mantém o sentido espacial e a expressão deuteronômica “o lugar”, com formulação corrente em português.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: que Yahweh, seu Deus, escolher
  rationale: O futuro do subjuntivo é natural após a construção relativa de referência futura neste contexto legal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, distinguindo-o do título “Senhor”.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: para ali pôr o seu nome
  rationale: Conserva a fórmula teológica de Deuteronômio e evita interpretar além do que o hebraico declara.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: quando Yahweh, seu Deus, abençoar você
  rationale: Entende כִּי como temporal, apresentando a bênção divina como a circunstância da abundância; a leitura causal permanece registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Valor da última conjunção כִּי
  choice: quando
  alternative: porque
  rationale: A leitura temporal se ajusta bem ao fluxo da lei, mas o hebraico também admite valor causal; essa tensão é preservada por nota.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” e ordem sintática próxima do hebraico sem sacrificar a naturalidade. O versículo termina com vírgula porque a oração prossegue no versículo seguinte.
