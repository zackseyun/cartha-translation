base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/009.yaml
  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: pt
  text: 'Dos que há nas águas, vocês podem comer o seguinte: tudo o que tem barbatanas e escamas vocês podem comer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: vocês podem comer isto
  rationale: Preserva o demonstrativo זֶה e expressa naturalmente em português o valor permissivo da legislação alimentar.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: de tudo o que vive nas águas
  rationale: A expressão hebraica diz literalmente 'de tudo o que está nas águas'; 'vive' torna explícito o referente animal implícito e evita uma formulação portuguesa pouco natural.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: barbatanas e escamas
  rationale: Equivalentes zoológicos comuns e precisos em português moderno.
- source_word: תֹּאכֵלוּן
  choice: vocês podem comer
  rationale: No contexto legal, o imperfeito de segunda pessoa plural comunica permissão, não uma ordem para comer.
theological_decisions:
- issue: Força normativa do verbo תֹּאכֵלוּן
  choice: 'permissão: ''podem comer'''
  alternative: 'ordem ou previsão: ''comerão'''
  rationale: A seção distingue animais permitidos e proibidos; portanto, a forma verbal funciona como autorização alimentar.
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para a segunda pessoa plural e vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos.
