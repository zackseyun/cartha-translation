lexical_decisions:
- source_word: כָּל
  choice: qualquer
  rationale: O quantificador é abrangente. Com o substantivo singular “ave”, “qualquer” expressa de modo idiomático a permissão irrestrita dentro da categoria.
- source_word: צִפּוֹר
  choice: ave
  rationale: O substantivo designa normalmente uma ave. “Ave” é claro e natural no contexto das leis alimentares.
- source_word: טְהֹרָה
  choice: pura
  rationale: No contexto alimentar e ritual, o adjetivo indica a categoria cerimonial permitida. “Pura” preserva essa distinção e concorda naturalmente com “ave”.
- source_word: תֹּאכֵלוּ
  choice: vocês podem comer
  rationale: A forma verbal na segunda pessoa do plural funciona aqui como permissão legal, não como ordem de que todas essas aves sejam comidas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para tornar explícita a segunda pessoa do plural do hebraico. A formulação mantém o valor permissivo da norma alimentar.
