source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: pt
  text: E o porco, porque tem o casco fendido, mas não rumina, é impuro para vocês. Não comam da carne deles[a] nem toquem em seus cadáveres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico passa do singular, “o porco”, para formas plurais: literalmente, “da carne deles” e “em seus cadáveres”.'
    reason: Esclarece a mudança de número presente no texto hebraico e preservada na tradução.
lexical_decisions:
- source_word: הַחֲזִיר
  choice: o porco
  rationale: “Porco” é o termo comum, claro e atual em português; “suíno” seria mais técnico e menos natural no contexto.
- source_word: מַפְרִיס פַּרְסָה
  choice: tem o casco fendido
  rationale: Expressa de modo idiomático o critério de o casco ser dividido.
- source_word: גֵרָה
  choice: rumina
  rationale: O verbo português comunica de forma natural e precisa a ação descrita pela expressão hebraica ligada ao bolo alimentar.
- source_word: טָמֵא
  choice: impuro
  rationale: Preserva a categoria legal e ritual do texto sem sugerir que o animal seja moralmente mau.
- source_word: לָכֶם
  choice: para vocês
  rationale: Mantém a aplicação do estatuto à comunidade destinatária em português corrente e amplamente compreensível.
- source_word: מִבְּשָׂרָם
  choice: da carne deles
  rationale: Mantém o valor partitivo da preposição e o sufixo plural hebraico, embora o porco tenha sido mencionado no singular.
- source_word: נִבְלָתָם
  choice: seus cadáveres
  rationale: “Cadáveres” designa com clareza os corpos mortos dos animais e conserva naturalmente em português a referência plural do sufixo hebraico.
- source_word: תִגָּעוּ
  choice: toquem
  rationale: Tradução direta do verbo, preservando a força da proibição sem ampliá-la para ‘aproximar-se’ ou restringi-la a ‘manusear’.
theological_decisions:
- issue: Natureza da impureza na lei alimentar da Torá
  choice: Traduzir טָמֵא por “impuro” como categoria legal e ritual.
  alternative: “Imundo” ou uma formulação que implique maldade moral.
  rationale: O versículo classifica o animal para fins pactuais e alimentares; não faz uma afirmação de maldade moral intrínseca.
- issue: Alcance da proibição de tocar
  choice: Manter a ordem direta “nem toquem”.
  alternative: “Não manuseiem” ou “não se aproximem”.
  rationale: O hebraico emprega o verbo comum para tocar; a tradução não deve estreitar nem alargar o mandamento.
- issue: Mudança do porco singular para sufixos plurais
  choice: Preservar no texto a referência plural em “deles” e “seus cadáveres”.
  alternative: 'Harmonizar tudo no singular: “da carne dele” e “em seu cadáver”.'
  rationale: Os sufixos de מִבְּשָׂרָם e נִבְלָתָם são plurais. A formulação pode se referir aos animais dessa classe ou retomar coletivamente os animais proibidos, e a tradução não elimina essa tensão gramatical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Rumina” evita uma paráfrase longa, e “casco fendido” é natural no contexto das leis alimentares. A coordenação com “nem” torna a segunda proibição fluente sem reduzir sua força.
