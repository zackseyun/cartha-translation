base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/022.yaml
  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: pt
  text: Separe, sem falta, o dízimo de toda a produção da sua semente que sair do campo, ano após ano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais fluente: “Você deve dar o dízimo de toda a produção que o seu campo render a cada ano.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: Separe fielmente o dízimo
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ordem. Em português, “separe fielmente o dízimo” comunica com naturalidade tanto o dever quanto a ênfase, sem recorrer à formulação pouco idiomática “dizime certamente”.
- source_word: תְּבוּאַת
  choice: produção
  rationale: O substantivo designa de modo amplo o produto ou rendimento agrícola. “Produção” mantém essa abrangência e se encaixa naturalmente na frase.
- source_word: זַרְעֶךָ
  choice: sua semente
  rationale: A expressão significa literalmente “sua semente” e, no contexto, refere-se ao que é semeado e ao produto resultante. A tradução conserva a imagem agrícola do hebraico sem restringi-la a grãos.
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: que o campo produzir
  rationale: A formulação dinâmica exprime em português corrente aquilo que literalmente “sai do campo”. Evita a construção artificial “que sai do campo” sem alterar o referente agrícola.
- source_word: שָׁנָה שָׁנָה
  choice: ano após ano
  rationale: A repetição hebraica indica recorrência distributiva anual. “Ano após ano” preserva essa força e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação principal prioriza naturalidade sem perder a ênfase da ordem hebraica; a nota registra uma alternativa mais formal e próxima da imagem verbal do original.
