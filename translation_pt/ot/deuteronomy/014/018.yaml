  text: the stork[a], and the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: pt
  text: a cegonha[a], a garça segundo a sua espécie[b], a poupa[c] e o morcego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a garça”; a identificação exata de várias aves neste versículo é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “o íbis” ou “a tarambola” em vez de “a garça”.
    reason: lexical_alternative
  - marker: c
    text: Traduções antigas às vezes trazem outra ave; o termo hebraico provavelmente designa a poupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: a cegonha
  rationale: “Cegonha” é a identificação tradicional e mais amplamente aceita, embora a identificação zoológica exata permaneça incerta.
- source_word: הָאֲנָפָה
  choice: a garça
  rationale: “Garça” é uma tradução convencional e adequada para uma categoria de ave pernalta; a espécie exata é incerta.
- source_word: לְמִינָהּ
  choice: segundo a sua espécie
  rationale: Preserva a fórmula hebraica que indica a espécie ou o grupo mais amplo associado à ave mencionada.
- source_word: הַדּוּכִיפַת
  choice: a poupa
  rationale: A identificação como “poupa” é favorecida pela pesquisa lexical moderna, em lugar de identificações tradicionais menos prováveis.
- source_word: הָעֲטַלֵּף
  choice: o morcego
  rationale: O termo hebraico designa claramente o morcego; mantém-se a designação direta, apesar de sua inclusão antiga entre criaturas voadoras.
