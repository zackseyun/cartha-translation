  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֣א תֹאכְל֣וּ כָל נְ֠בֵלָה לַ/גֵּ֨ר אֲשֶׁר בִּ/שְׁעָרֶ֜י/ךָ תִּתְּנֶ֣נָּ/ה וַ/אֲכָלָ֗/הּ א֤וֹ מָכֹר֙ לְ/נָכְרִ֔י כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: pt
  text: Não comam nenhum animal morto.[a] Vocês podem dá-lo ao estrangeiro residente que vive em suas cidades,[b] e ele poderá comê-lo; ou podem vendê-lo a um estrangeiro.[c] Pois vocês são um povo santo para Yahweh, seu Deus. Não fervam um cabrito no leite de sua mãe.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a carcaça de um animal que morreu por si mesmo ou que não foi abatido de maneira permitida.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ao estrangeiro residente que está dentro de seus portões”. “Portões” é uma expressão hebraica para as cidades ou comunidades. O termo indica um não israelita que vivia entre o povo de Israel.
    reason: cultural_note
  - marker: c
    text: '“Estrangeiro” traduz um termo diferente do usado para “estrangeiro residente” e designa alguém de fora sem a mesma condição de residente. As formas verbais também podem ser traduzidas mais literalmente: “deem-no ... e ele o comerá; ou vendam-no”.'
    reason: alternative_reading
  - marker: d
    text: 'Ou, mais literalmente: “Não fervam um cabrito no leite de sua mãe”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: animal encontrado morto
  rationale: Designa a carcaça de um animal que morreu ou não foi abatido de maneira permitida. A expressão é clara em português e evita sugerir qualquer carcaça, inclusive a de um animal devidamente abatido.
- source_word: גֵּר
  choice: imigrante residente
  rationale: Refere-se a um não israelita estabelecido na comunidade e com condição social reconhecida; distingue-se de נָכְרִי. A formulação comunica essa residência sem recorrer ao hoje ambíguo 'estrangeiro residente'.
- source_word: בִּשְׁעָרֶיךָ
  choice: que vive em suas cidades
  rationale: A expressão literal 'em seus portões' é um idiomatismo que indica as cidades ou comunidades sob jurisdição israelita. A tradução explicita o sentido natural em português.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: Vocês podem dá-lo ... para que ele o coma
  rationale: No contexto jurídico, as formas apresentam uma opção permitida em contraste com a proibição de Israel comer o animal, não necessariamente uma obrigação de entregá-lo.
- source_word: נָכְרִי
  choice: estrangeiro
  rationale: Indica alguém de fora sem a condição de residente expressa por גֵּר, preservando a distinção lexical entre os dois grupos.
- source_word: עַם קָדוֹשׁ
  choice: um povo santo
  rationale: Mantém a linguagem da aliança e a ideia de um povo consagrado e pertencente a Deus.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição expressa relação, pertença ou consagração, e o nome divino é representado diretamente como Yahweh.
- source_word: גְּדִי
  choice: cabrito
  rationale: '''Cabrito'' é a designação portuguesa natural e inequívoca para um bode jovem.'
- source_word: תְבַשֵּׁל
  choice: cozinhem
  rationale: O piel de בשׁל pode indicar cozinhar ou ferver. 'Cozinhar' é natural em português e preserva a possibilidade de preparo no leite sem restringir indevidamente o método ao ponto de ebulição.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: no leite de sua mãe
  rationale: Reproduz com naturalidade a relação concreta expressa pelo hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio da aliança. 'Yahweh' o representa diretamente, sem substituí-lo por um título.
- issue: Força jurídica dos verbos relativos a dar e vender o animal
  choice: 'permissiva: ''podem dar ... podem vender'''
  alternative: 'injuntiva: ''deem ... vendam'''
  rationale: O contraste jurídico central proíbe o consumo israelita e apresenta formas permitidas de destinação. A formulação permissiva não cria uma obrigação adicional, enquanto a nota registra a forma mais literal.
- issue: Relação de Israel com Yahweh em עַם קָדוֹשׁ ... לַיהוָה
  choice: ‘um povo santo para Yahweh’
  alternative: ‘um povo consagrado a Yahweh’ ou ‘um povo santo pertencente a Yahweh’
  rationale: A tradução conserva a concisão e a tensão semântica da preposição, que pode envolver orientação, consagração e pertença.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com concordância no plural para refletir os verbos hebraicos dirigidos ao povo. Evitou-se a literalidade opaca de 'dentro dos portões' no texto principal, preservando-a em nota. A distinção entre גֵּר e נָכְרִי foi mantida como 'imigrante residente' e 'estrangeiro'. Todos os marcadores de nota aparecem no texto principal.
