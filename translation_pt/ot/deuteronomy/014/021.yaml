  naturalness: A redação é clara e apropriada ao português contemporâneo. “Estrangeiro residente” é mais neutro e menos anacrônico do que “imigrante residente”, mantendo a distinção jurídica e social pretendida pelo hebraico. A coordenação “e ele poderá comê-lo; ou...” torna explícita, com fluência, a sequência verbal hebraica.
  terminology: “Povo santo”, “Yahweh”, “estrangeiro residente”, “estrangeiro” e “cabrito” são escolhas adequadas. As notas devem distinguir com clareza os dois termos hebraicos para não apagar a diferença entre o residente estrangeiro (גֵּר) e o estrangeiro de fora (נָכְרִי).
