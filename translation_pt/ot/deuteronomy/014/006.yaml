  text: וְ/כָל בְּהֵמָ֞ה מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ שְׁתֵּ֣י פְרָס֔וֹת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/006.yaml
  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: pt
  text: Vocês poderão comer qualquer animal que tenha o casco fendido e completamente dividido em duas partes, e que rumine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל בְּהֵמָה
  choice: todo animal
  rationale: Expressa naturalmente o sentido distributivo e abrangente no contexto da permissão alimentar; “animal” é amplo o bastante para a categoria terrestre em questão.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: tem o casco fendido
  rationale: Formulação portuguesa corrente que conserva o critério zoológico concreto indicado pelo particípio hebraico.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: inteiramente dividido em duas partes
  rationale: Preserva a ênfase hebraica em uma fenda efetiva que divide o casco em duas partes, sem reproduzir de modo artificial a repetição etimológica.
- source_word: מַעֲלַת גֵּרָה
  choice: rumina
  rationale: Equivalente moderno, preciso e conciso para o ato de fazer subir e tornar a mastigar o alimento.
- source_word: בַּבְּהֵמָה
  choice: incorporado na expressão “todo animal”
  rationale: A expressão hebraica delimita a classe dos animais; repeti-la como “entre os animais” produziria redundância pouco natural em português sem acrescentar conteúdo necessário.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: Vocês poderão comer
  rationale: No contexto legal, a forma verbal comunica permissão alimentar, não uma ordem para consumir; o pronome objeto feminino é absorvido naturalmente pela construção portuguesa.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” torna explícito o destinatário coletivo do hebraico. A redação conserva os dois requisitos cumulativos: casco completamente dividido e ruminação.'
