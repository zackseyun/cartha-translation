  text: מִ/קְצֵ֣ה שָׁלֹ֣שׁ שָׁנִ֗ים תּוֹצִיא֙ אֶת כָּל מַעְשַׂר֙ תְּבוּאָ֣תְ/ךָ֔ בַּ/שָּׁנָ֖ה הַ/הִ֑וא וְ/הִנַּחְתָּ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: pt
  text: Ao fim de cada período de três anos[b], você tirará todo o dízimo da sua produção daquele ano e o depositará em suas cidades[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «dentro dos seus portões»; a expressão se refere às cidades ou comunidades locais sob sua jurisdição.
    reason: cultural_note
  - marker: b
    text: 'Ou: «ao fim de cada terceiro ano».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה
  choice: Ao fim de
  rationale: Expressa o ponto temporal alcançado, preservando o sentido de encerramento do período sem recorrer ao menos preciso «depois de».
- source_word: שָׁלֹשׁ שָׁנִים
  choice: cada período de três anos
  rationale: Comunica de modo natural em português a prática trienal recorrente sugerida pelo contexto, enquanto a nota registra a alternativa mais estritamente ordinal.
- source_word: תּוֹצִיא
  choice: você tirará
  rationale: O hifil de יצא indica fazer sair ou retirar; «tirará» conserva a ideia concreta de remover o dízimo de onde estava sob posse ou armazenado.
- source_word: כָּל מַעְשַׂר
  choice: todo o dízimo
  rationale: Preserva a ênfase de כָּל na totalidade do décimo exigido.
- source_word: תְּבוּאָתְךָ
  choice: sua produção
  rationale: Abrange o produto ou rendimento agrícola da terra sem restringi-lo apenas aos cereais.
- source_word: בַּשָּׁנָה הַהִוא
  choice: daquele ano
  rationale: Em português, liga com clareza a produção ao ano trienal em questão e mantém a referência temporal do hebraico.
- source_word: וְהִנַּחְתָּ
  choice: e o depositará
  rationale: Traduz o sentido causativo de colocar ou deixar em determinado lugar, adequado ao contexto da destinação local do dízimo.
- source_word: בִּשְׁעָרֶיךָ
  choice: em suas cidades
  rationale: A expressão literalmente ligada aos «portões» funciona como referência às cidades ou comunidades locais sob a jurisdição da pessoa. A tradução comunica o sentido idiomático, e a nota preserva a imagem hebraica.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Emprega «você» para o singular de segunda pessoa e traduz idiomaticamente «em seus portões» como «em suas cidades», preservando a forma literal em nota.
