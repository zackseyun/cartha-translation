  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: pt
  text: 'Contudo, estes vocês não comerão, dentre os animais que ruminam ou que têm o casco fendido: o camelo, a lebre[a] e o damão-das-rochas[b]. Pois ruminam, mas não têm o casco fendido. São impuros para vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «coelho». O termo hebraico provavelmente designa a lebre, embora sua identificação zoológica exata seja discutida.
    reason: lexical_alternative
  - marker: b
    text: Ou «hírax». Trata-se de um pequeno mamífero que vive entre rochas.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Marca a ressalva ou exceção em relação à regra do versículo anterior, com linguagem atual e digna.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: dentre os animais que ruminam
  rationale: Expressa de modo natural em português o comportamento descrito pelo idioma hebraico, sem recorrer ao literalismo opaco de «fazer subir o bolo alimentar».
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: ou que têm o casco fendido
  rationale: «Casco fendido» é a expressão portuguesa corrente para o casco dividido. O «ou» comunica que a proibição abrange animais que apresentam apenas uma das características, conforme a enumeração que continua no versículo seguinte.
- source_word: הַגָּמָל
  choice: o camelo
  rationale: Equivalente direto e inequívoco do nome hebraico.
- source_word: הָאַרְנֶבֶת
  choice: a lebre
  rationale: É a identificação tradicional e zoologicamente provável; a alternativa «coelho» é registrada em nota por persistir alguma incerteza na identificação antiga.
- source_word: הַשָּׁפָן
  choice: o damão-das-rochas
  rationale: Designa o pequeno mamífero rupícola geralmente identificado como o hírax. «Damão-das-rochas» é um nome zoológico português claro; «hírax» é preservado em nota como alternativa técnica.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה וּפַרְסָה לֹא הִפְרִיסוּ
  choice: Embora ruminem, eles não têm o casco fendido
  rationale: Neste contexto, כִּי apresenta a condição que explica a inclusão desses animais entre os proibidos. «Embora» torna explícito o contraste já presente entre as duas características sem alterar o sentido legal.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: São impuros para vocês
  rationale: Mantém o termo bíblico amplo «impuros» e a orientação legal «para vocês», sem acrescentar no texto principal qualificações interpretativas como «ritualmente» ou «cerimonialmente».
theological_decisions:
- issue: Natureza da impureza nas leis alimentares
  choice: impuros
  alternative: ritualmente impuros; cerimonialmente impuros
  rationale: O hebraico טָמֵא pertence aqui às categorias de pureza da aliança, mas o texto não acrescenta um qualificativo. A tradução preserva o termo abrangente e evita restringi-lo por interpretação.
- issue: Relação entre ruminação e casco fendido
  choice: A proibição recai sobre animais que apresentam apenas uma das características exigidas
  alternative: Ler a coordenação como se os animais enumerados possuíssem simultaneamente as duas características
  rationale: O contexto imediato, incluindo a explicação de que os animais citados ruminam mas não têm o casco fendido e a continuação no versículo 8, mostra que a enumeração trata dos animais que satisfazem apenas um dos critérios.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega «vocês» para a segunda pessoa plural do discurso legal e mantém tom claro e digno. Os nomes zoológicos menos familiares recebem alternativas em notas.
