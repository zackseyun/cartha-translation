  yaml_path: translation/ot/deuteronomy/014/004.yaml
  text: 'These are the animals that you may eat: the ox[a], the sheep, and the goat.'
translation:
  language: pt
  text: 'Estes são os animais[a] que vocês podem comer: o boi, a ovelha e a cabra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Este é o animal que vocês podem comer”; as formas no singular introduzem uma categoria coletiva antes da lista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: Estes são os animais
  rationale: O hebraico emprega formas singulares para introduzir coletivamente a categoria que será enumerada. O plural em português é natural e acompanha a lista seguinte.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: que vocês podem comer
  rationale: A oração identifica os animais permitidos como alimento; “podem comer” comunica permissão sem sugerir que comê-los seja uma obrigação.
- source_word: שׁוֹר
  choice: o boi
  rationale: Designa aqui um bovino; “boi” é a equivalência tradicional e clara no contexto de uma lista de animais.
- source_word: שֵׂה כְשָׂבִים
  choice: a ovelha
  rationale: A expressão indica um animal do rebanho da espécie ovina. “Ovelha” funciona como nome genérico da categoria, sem restringir idade ou sexo.
- source_word: וְשֵׂה עִזִּים
  choice: e a cabra
  rationale: Em paralelo com a expressão anterior, indica um animal da espécie caprina. “Cabra” é o termo genérico mais natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural. Os substantivos singulares da lista são mantidos como nomes genéricos de cada espécie; a construção introdutória passa naturalmente ao plural em português.
