base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: pt
  text: Pois você é um povo santo, consagrado a Javé, seu Deus, e Javé escolheu você, dentre todos os povos que há sobre a face da terra, para ser um povo que é sua propriedade preciosa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um povo que é sua propriedade especialmente estimada». O termo hebraico סְגֻלָּה designa uma posse de valor especial.
    reason: alternativa lexical
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da proibição anterior e preserva com naturalidade a função explicativa da conjunção.
- source_word: עַם קָדוֹשׁ
  choice: um povo santo
  rationale: Expressa a comunidade da aliança como consagrada a Deus, sem reduzir santidade a mera superioridade moral.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para Javé, seu Deus
  rationale: A preposição ל indica relação ou pertencimento; «para» mantém a formulação concisa, enquanto «Javé» representa o nome divino יהוה.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: e Javé escolheu você
  rationale: Com בחר, a preposição ב introduz idiomaticamente o objeto da escolha; em português, o objeto direto comunica o sentido natural.
- source_word: לִהְיוֹת לוֹ
  choice: para ser seu
  rationale: O infinitivo expressa o propósito ou resultado da escolha, e o possessivo comunica o pertencimento indicado por לוֹ.
- source_word: לְעַם סְגֻלָּה
  choice: povo, sua propriedade preciosa
  rationale: Mantém explícito עַם, «povo», e traduz סְגֻלָּה como uma posse especialmente estimada, sem enfraquecê-la para apenas «especial».
- source_word: מִכֹּל הָעַמִּים
  choice: dentre todos os povos
  rationale: מן marca aqui a seleção no interior de um conjunto; «dentre» evita sugerir superioridade comparativa não exigida pela expressão.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: que há sobre a face da terra
  rationale: Reproduz de modo natural a expressão hebraica abrangente para os povos que habitam a terra.
theological_decisions:
- issue: Natureza da eleição de Israel
  choice: Apresentar a escolha como eleição para pertencimento pactual e condição de propriedade preciosa de Javé.
  alternative: Traduzir מִכֹּל como «acima de todos» ou desenvolver a frase segundo sistemas teológicos posteriores.
  rationale: O hebraico afirma que Javé escolheu Israel dentre os povos para lhe pertencer de modo especial; a tradução preserva tanto a escolha divina quanto o pertencimento, sem acrescentar superioridade étnica.
- issue: Sentido de santidade
  choice: Conservar «povo santo» como linguagem de consagração e relação com Javé.
  alternative: Parafrasear como «povo moralmente perfeito» ou apenas «povo diferente».
  rationale: קָדוֹשׁ possui alcance teológico que inclui consagração; uma paráfrase mais estreita resolveria indevidamente essa riqueza semântica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O singular «você» preserva o tratamento hebraico de Israel como uma unidade coletiva. A colocação de «dentre todos os povos» junto ao verbo esclarece a seleção sem alterar o sentido.
