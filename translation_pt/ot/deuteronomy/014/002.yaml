- from: Pois você é um povo santo para Javé, seu Deus, e Javé escolheu você, dentre todos os povos que há sobre a face da terra, para ser seu povo, sua propriedade preciosa[a].
  to: Pois você é um povo santo, consagrado a Javé, seu Deus, e Javé escolheu você, dentre todos os povos que há sobre a face da terra, para ser um povo que é sua propriedade preciosa[a].
  rationale: 'A revisão melhora a fluência e esclarece a sintaxe sem alterar o sentido: a santidade é entendida como consagração a Javé, e o povo escolhido é descrito como sua posse preciosa. «Dentre todos os povos» continua qualificando a escolha, sem introduzir uma afirmação comparativa de superioridade.'
