review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: Israel é chamado de povo santo em relação a Javé, e a escolha divina dentre os povos visa torná-lo sua posse especialmente valorizada. A posição de «dentre todos os povos» no rascunho é defensável, mas a reformulação proposta a aproxima mais claramente do alcance de «escolheu ... para ser».'
  naturalness: «Para Javé» é compreensível, mas menos idiomático em português moderno nesse contexto. Além disso, «para ser seu povo, sua propriedade preciosa» produz uma aposição um tanto abrupta e pode soar como duas designações desconexas. «Consagrado a Javé» e «um povo que é sua propriedade preciosa» são mais naturais, preservando o sentido.
  terminology: «Javé», «povo santo» e «propriedade preciosa» são escolhas adequadas. «Consagrado» explicita de maneira idiomática a relação expressa por «santo para Javé», sem reduzi-la a perfeição moral. A nota mantém corretamente a alternativa lexical e o valor de סְגֻלָּה.
  issues:
  - severity: low
    issue: Formulação pouco idiomática de «um povo santo para Javé».
    rationale: Embora literal, «para Javé» soa menos natural em português do que «consagrado a Javé» para expressar a relação de santidade e pertencimento indicada pelo hebraico.
  - severity: medium
    issue: A expressão «para ser seu povo, sua propriedade preciosa» é sintaticamente pesada e pode obscurecer a relação entre עַם e סְגֻלָּה.
    rationale: O hebraico descreve o povo como a posse especialmente valorizada de Javé. A oração relativa torna essa relação explícita sem eliminar a repetição intencional de «povo».
  revised_text: Pois você é um povo santo, consagrado a Javé, seu Deus, e Javé escolheu você, dentre todos os povos que há sobre a face da terra, para ser um povo que é sua propriedade preciosa[a].
  revised_footnotes:
