  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: pt
  text: Você comerá diante de Yahweh, seu Deus, no lugar que ele escolher para ali fazer habitar o seu nome[a], o dízimo do seu cereal, do seu vinho novo e do seu azeite, bem como os primogênitos do seu gado e do seu rebanho, para que aprenda a temer Yahweh, seu Deus, todos os dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que o seu nome habite ali” ou “para estabelecer ali o seu nome”. O hebraico preserva a expressão segundo a qual Yahweh faz seu nome habitar no santuário escolhido.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Você comerá
  rationale: O perfeito qal com conjunção, neste contexto legal, tem força injuntiva ou futura. A forma preserva essa sequência normativa em português atual.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: diante de Yahweh, seu Deus
  rationale: לִפְנֵי significa literalmente “diante de” ou “na presença de”. “Diante de” é conciso e natural no contexto de culto.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: no lugar que ele escolher
  rationale: Mantém a fórmula deuteronômica da escolha divina do santuário e seu sentido prospectivo.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para ali fazer habitar o seu nome
  rationale: O infinitivo hifil de שכן admite o sentido causativo “fazer habitar”. A tradução conserva a imagem hebraica da presença do nome no lugar escolhido.
- source_word: מַעְשַׂר דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: o dízimo do seu cereal, do seu vinho novo e do seu azeite
  rationale: “Dízimo” expressa a décima parte cultual; “cereal”, “vinho novo” e “azeite” preservam a tríade agrícola e as distinções lexicais do hebraico.
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: bem como os primogênitos do seu gado e do seu rebanho
  rationale: “Primogênitos” designa as primeiras crias; “gado e rebanho” comunica de modo natural a distinção entre animais de grande e de pequeno porte.
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: para que aprenda a temer
  rationale: לְמַעַן introduz a finalidade pedagógica da ordem. “Temer” mantém o termo teológico sem reduzi-lo apenas a reverência ou medo.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Reprodução direta e idiomática da expressão temporal hebraica, com o sentido de continuidade ao longo da vida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: A transliteração preserva o nome pessoal divino presente no texto hebraico, sem substituí-lo por um título.
- issue: Fórmula do santuário לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: para ali fazer habitar o seu nome
  alternative: para que o seu nome habite ali; para estabelecer ali o seu nome
  rationale: A opção conserva a forma causativa e a imagem deuteronômica do nome de Deus habitando no local escolhido, sem explicar de modo excessivo a relação entre transcendência e presença divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome singular “você” torna explícito o destinatário individual presente nas formas hebraicas, enquanto a sintaxe mantém o tom de instrução da aliança.
