  text: the little owl[a], the great owl, and the white owl;
translation:
  language: pt
  text: a corujinha[a], o corujão e a coruja-branca;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata desses nomes de aves é incerta. Traduções antigas e modernas divergem e muitas vezes os vertem como diferentes tipos de coruja.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: mocho-galego
  rationale: Designa uma ave noturna geralmente entendida como algum tipo de coruja. “Mocho-galego” oferece uma identificação tradicional e específica, mas a incerteza zoológica é indicada em nota.
- source_word: יַנְשׁוּף
  choice: bufo-real
  rationale: O termo costuma ser entendido como uma ave noturna do grupo das corujas. “Bufo-real” o distingue dos outros dois nomes da lista, sem ocultar na nota a incerteza da identificação.
- source_word: תִּנְשָׁמֶת
  choice: coruja-branca
  rationale: Neste catálogo de aves, o termo provavelmente se refere a uma ave do grupo das corujas, embora a mesma forma hebraica possa designar outra criatura em outro contexto. “Coruja-branca” preserva a distinção entre os três nomes.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: Partícula hebraica que marca o objeto direto definido e não possui equivalente independente natural em português.
- source_word: וְ
  choice: e
  rationale: Conjunção que liga os itens finais da lista.
- source_word: הַ
  choice: o/a
  rationale: Artigo definido repetido no hebraico; em português, concorda em gênero com cada nome de ave.
