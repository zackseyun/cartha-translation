  text: the glede[a], and the falcon, and the kite according to its kind,
translation:
  language: pt
  text: o milhafre-vermelho[a], o falcão e o milhafre, segundo a sua espécie;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata dessas aves é incerta. Traduções tradicionais e modernas variam entre «milhafre-vermelho», «milhafre» e «falcão».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: o milhafre-vermelho
  rationale: A identificação zoológica é incerta, mas o termo é frequentemente entendido como uma ave de rapina do grupo dos milhafres; «milhafre-vermelho» oferece um nome moderno e concreto, com a incerteza preservada em nota.
- source_word: הָאַיָּה
  choice: o falcão
  rationale: Designa uma ave de rapina, muitas vezes identificada como falcão. Esta escolha também mantém distintos os três nomes hebraicos da lista.
- source_word: הַדַּיָּה
  choice: o milhafre
  rationale: O termo é comumente associado ao milhafre, embora sua identificação exata e sua relação com os nomes vizinhos sejam discutidas.
- source_word: לְמִינָהּ
  choice: segundo a sua espécie
  rationale: Reproduz a fórmula classificatória hebraica usada em listas de animais e em outros contextos, com linguagem clara e digna.
- source_word: וְאֶת
  choice: e
  rationale: A conjunção liga os itens da enumeração; o marcador hebraico de objeto direto não requer tradução independente em português.
