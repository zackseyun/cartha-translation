base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: pt
  text: Vocês são filhos[a] de Yahweh, seu Deus. Não façam cortes em si mesmos, nem façam uma área calva entre os olhos[b] em sinal de luto por um morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos”, no masculino plural. Conforme o contexto, o termo pode referir-se aos membros do povo de Deus em conjunto.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “entre os olhos”, expressão que se refere à região da testa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: filhos
  rationale: O substantivo hebraico está no masculino plural e identifica Israel em sua relação de aliança com Deus. “Filhos” preserva a forma da fonte; “filhos e filhas” ou “crianças” explicitaria ou neutralizaria algo que o texto não formula.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: 'Neste contexto, a preposição לְ marca relação ou pertencimento: eles são filhos de Yahweh. A forma “de Yahweh” é natural em português e mantém o nome divino.'
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: O construto com sufixo plural significa “Deus de vocês”. Em português corrente, “seu Deus” concorda naturalmente com o tratamento plural “vocês”.
- source_word: תִתְגֹּדְדוּ
  choice: façam cortes em si mesmos
  rationale: A forma reflexiva descreve a prática de produzir cortes no próprio corpo, especialmente em contexto de luto. A expressão é clara e preserva a natureza deliberada do ato.
- source_word: תָשִׂימוּ קָרְחָה
  choice: façam uma área calva
  rationale: A combinação verbal significa produzir uma calva ou parte sem cabelo, provavelmente por raspagem. A tradução conserva a imagem concreta sem inserir no texto principal um método mais específico do que o hebraico declara.
- source_word: בֵּין עֵינֵיכֶם
  choice: entre os olhos
  rationale: A tradução mantém a expressão corporal hebraica. No uso, ela aponta para a região da testa; isso é esclarecido em nota sem substituir a imagem da fonte.
- source_word: לָמֵת
  choice: por causa de um morto
  rationale: A preposição indica que os atos eram realizados em razão da morte, como práticas de luto. O singular hebraico é preservado em “um morto”.
theological_decisions:
- issue: Identidade pactual expressa pelo masculino plural בָּנִים
  choice: filhos
  alternative: filhos e filhas; crianças
  rationale: O texto usa literalmente o masculino plural “filhos”. A tradução preserva essa forma sem concluir que as mulheres estejam excluídas da comunidade da aliança.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal da aliança. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Natureza das proibições de luto
  choice: práticas corporais realizadas por causa de um morto
  alternative: proibição geral de toda modificação corporal
  rationale: A frase final liga explicitamente os cortes e a calva ao morto. A tradução mantém esse enquadramento imediato sem ampliar silenciosamente o alcance da proibição.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural. A formulação preserva o paralelismo das duas proibições, o nome Yahweh e as imagens corporais do hebraico, esclarecendo em nota apenas onde o idioma da fonte pode ser entendido de modo excessivamente literal.
