base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/015.yaml
  text: the ostrich[a], the hawk, the gull, and the falcon according to its kind[b],
translation:
  language: pt
  text: o avestruz[a], o gavião, a gaivota e o falcão[b], segundo a sua espécie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “filha da ya‘anah”, expressão idiomática usada como nome de uma espécie de ave, provavelmente o avestruz.
    reason: cultural_note
  - marker: b
    text: A identificação de várias aves neste versículo é incerta. O termo traduzido por “gavião” também pode designar uma coruja ou outra ave; “gaivota” também já foi traduzido por “cuco”; e “falcão” também pode ser traduzido por “gavião”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: o avestruz
  rationale: A expressão hebraica significa literalmente “filha da ya‘anah”, mas funciona nesta lista como nome de uma ave. “Avestruz” representa adequadamente a identificação mais provável e evita uma tradução literal enganosa.
- source_word: הַתַּחְמָס
  choice: o gavião
  rationale: A identificação exata é incerta. “Gavião” é uma designação moderna plausível para uma ave de rapina, mas a incerteza e alternativas tradicionais são preservadas em nota.
- source_word: הַשָּׁחַף
  choice: a gaivota
  rationale: Embora o termo seja de identificação difícil, os léxicos modernos geralmente o associam a uma gaivota ou ave marinha semelhante. A alternativa tradicional “cuco” é registrada em nota.
- source_word: הַנֵּץ
  choice: o falcão
  rationale: O substantivo designa uma ave de rapina e pode ser traduzido por “gavião” ou “falcão”. Escolheu-se “falcão” para distingui-lo de תַּחְמָס no mesmo versículo, sem eliminar a alternativa lexical.
- source_word: לְמִינֵהוּ
  choice: segundo a sua espécie
  rationale: Reproduz de forma natural e próxima do hebraico a fórmula classificatória que inclui a ave mencionada e suas variedades.
