  source_fidelity: A redação preserva a sequência narrativa e os bens mencionados. Contudo, «numa das tendas» tende a apresentar a tenda como uma dentre um conjunto definido, enquanto o hebraico diz literalmente «uma tenda». Além disso, «mais coisas» acrescenta a noção explícita de quantidade adicional, ausente do hebraico, que apenas deixa o objeto de «levaram» implícito.
  naturalness: O português é claro, moderno e adequado ao registro narrativo. «Em uma tenda» e «levaram dali coisas» permanecem naturais e evitam as pequenas explicitações indevidas.
  terminology: «Leprosos», com a nota qualificadora, é uma solução tradicional e inteligível. «Extremidade do acampamento», «prata, ouro e roupas» e «outra tenda» correspondem bem ao texto hebraico.
