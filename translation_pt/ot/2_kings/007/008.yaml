  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: pt
  text: Quando esses leprosos[a] chegaram à extremidade do acampamento, entraram em uma tenda, comeram e beberam. Depois, levaram dali prata, ouro e roupas, foram e esconderam tudo. Em seguida, voltaram, entraram em outra tenda, levaram dali coisas, foram e as esconderam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “leprosos” designa pessoas afetadas por uma doença de pele tradicionalmente chamada de “lepra”; essa designação antiga pode abranger uma variedade de condições mais ampla que a hanseníase, no sentido médico moderno.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: leprosos
  rationale: É a forma tradicional, concisa e reconhecível em narrativa bíblica. A nota esclarece que o termo hebraico abrange condições de pele mais amplas que a hanseníase moderna.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: extremidade do acampamento
  rationale: Expressa com naturalidade a ideia espacial de limite ou borda do acampamento.
- source_word: אֹהֶל אֶחָד
  choice: uma das tendas
  rationale: Preserva a referência concreta a uma única tenda e soa mais natural em português no contexto de um acampamento com várias tendas.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: comeram e beberam
  rationale: Reproduz diretamente a sequência narrativa no passado, sem acrescentar valor aspectual.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: levaram dali
  rationale: Comunica a retirada dos bens de modo claro e idiomático, sem tornar explícita uma ideia de saque além do contexto.
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: prata, ouro e roupas
  rationale: Usa vocabulário moderno e corrente, mantendo todos os itens da enumeração hebraica.
- source_word: וַיַּטְמִנוּ
  choice: esconderam
  rationale: Mantém o sentido amplo de ocultar, sem especificar que os objetos foram enterrados.
- source_word: וַיָּשֻׁבוּ
  choice: Em seguida, voltaram
  rationale: Marca com fluidez a progressão da sequência narrativa.
- source_word: אֹהֶל אַחֵר
  choice: outra tenda
  rationale: Equivalente direto e natural para a ideia de uma tenda diferente.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: levaram dali mais coisas
  rationale: O objeto está elíptico no hebraico; 'coisas' recupera naturalmente o referente, e 'mais' indica que se trata de uma nova retirada sem especificar os bens.
