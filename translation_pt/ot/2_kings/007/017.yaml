  text: וְ/הַ/מֶּלֶךְ֩ הִפְקִ֨יד אֶת הַ/שָּׁלִ֜ישׁ אֲשֶׁר נִשְׁעָ֤ן עַל יָד/וֹ֙ עַל הַ/שַּׁ֔עַר וַ/יִּרְמְסֻ֧/הוּ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/רֶ֥דֶת הַ/מֶּ֖לֶךְ אֵלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: pt
  text: O rei tinha encarregado o oficial[a], em cujo braço se apoiava[b], da supervisão do portão, e o povo o pisoteou no portão, e ele morreu, exatamente como o homem de Deus havia dito quando o rei desceu até ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “capitão” ou “ajudante real”; o termo hebraico שָׁלִישׁ indica um oficial de alta posição próximo do rei.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em cuja mão se apoiava”, expressão que identifica um auxiliar pessoal próximo do rei.
    reason: cultural_note
lexical_decisions:
- source_word: הִפְקִיד ... עַל הַשַּׁעַר
  choice: tinha encarregado ... de cuidar do portão
  rationale: O hifil de פקד, construído com עַל, indica atribuição de responsabilidade ou supervisão. O mais-que-perfeito expressa naturalmente a referência retrospectiva no contexto narrativo.
- source_word: הַשָּׁלִישׁ
  choice: o oficial
  rationale: שָׁלִישׁ designa aqui um oficial de alta patente próximo do rei; “oficial” evita atribuir uma patente militar específica que o termo não determina com certeza.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: em cujo braço se apoiava
  rationale: Embora יָד signifique literalmente “mão”, em português “apoiar-se no braço” comunica com naturalidade a imagem e a função de um auxiliar pessoal próximo.
- source_word: וַיִּרְמְסֻהוּ הָעָם
  choice: o povo o pisoteou
  rationale: רמס expressa o ato de pisotear; a formulação direta conserva tanto o agente coletivo quanto a violência da cena.
- source_word: בַּשַּׁעַר
  choice: no portão
  rationale: Indica a área da própria entrada da cidade, sem ampliar o texto para “praça” ou apenas “perto do portão”.
- source_word: כַּאֲשֶׁר דִּבֶּר אִישׁ הָאֱלֹהִים
  choice: exatamente como o homem de Deus havia dito
  rationale: A expressão apresenta o acontecimento como cumprimento da palavra anterior; “homem de Deus” preserva o título hebraico específico.
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: quando o rei desceu até ele
  rationale: A construção com בְּ e infinitivo marca o momento da fala. “Desceu até ele” conserva o movimento espacial expresso no hebraico.
theological_decisions:
- issue: Cumprimento da palavra profética
  choice: A morte é explicitamente ligada ao que o homem de Deus havia dito antes.
  alternative: Relatar apenas a morte, sem destacar que ela ocorreu conforme a palavra anterior.
  rationale: כַּאֲשֶׁר דִּבֶּר estabelece de modo expresso essa correspondência. A tradução mantém a ênfase narrativa e teológica sem acrescentar uma explicação sobre causalidade ou providência que não esteja formulada no versículo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Portão” é preferido a “porta” para deixar claro que se trata da entrada fortificada da cidade. Os marcadores foram colocados junto às expressões que as respectivas notas explicam.
