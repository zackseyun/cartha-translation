base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: pt
  text: 'Então o oficial respondeu ao homem de Deus: “Se Yahweh fizesse janelas nos céus[a], poderia acontecer uma coisa dessas?” Ele disse: “Você verá isso com os próprios olhos, mas não comerá disso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comportas nos céus”. O hebraico diz literalmente “janelas nos céus”, imagem de aberturas celestes pelas quais poderiam vir provisão ou juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: o oficial
  rationale: O termo designa um oficial militar ou da corte de posição elevada. “Oficial” é claro em português moderno e evita especificar uma patente que o hebraico não determina com precisão.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva a designação profética tradicional e formal do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: fizesse janelas nos céus
  rationale: Mantém a imagem concreta do hebraico. “Fizesse” integra naturalmente a expressão à condição hipotética, enquanto a nota registra a alternativa idiomática “comportas”.
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: poderia acontecer uma coisa dessas?
  rationale: Expressa de modo natural a pergunta retórica e cética, sem intensificar além do texto.
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: Você verá isso com os próprios olhos
  rationale: O particípio tem sentido prospectivo no contexto; “com os próprios olhos” reproduz a ênfase da expressão hebraica em português corrente.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: mas não comerá disso
  rationale: “Disso” retoma de forma idiomática a provisão anunciada; o contraste de וּ é adequadamente expresso por “mas”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo pelo título “SENHOR”.
- issue: Identidade do segundo falante
  choice: Ele disse
  alternative: O homem de Deus disse
  rationale: O hebraico apenas repete “e disse”, sem nomear explicitamente o falante. O pronome conserva essa forma, embora o contexto indique que se trata do homem de Deus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi levemente condensada ao omitir o redundante “e disse” após “respondeu”, sem perda de conteúdo. A imagem hebraica incomum foi mantida no texto e esclarecida em nota.
