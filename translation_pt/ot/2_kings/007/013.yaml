base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: pt
  text: 'Então um dos seus servos respondeu: “Por favor, que peguem cinco dos cavalos que restam, que ficaram nela.[a] Vejam: eles são como toda a multidão de Israel que ficou nela; vejam: eles são como toda a multidão de Israel que pereceu.[b] Enviemos e vejamos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome hebraico traduzido por “nela” provavelmente se refere à cidade de Samaria, embora o nome da cidade não seja repetido neste versículo.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico traz uma comparação difícil e repetitiva: “como toda a multidão de Israel que ficou nela [...] como toda a multidão de Israel que pereceu”. A tradução conserva essa repetição, incluindo o duplo “Vejam”, em vez de explicá-la ou simplificá-la.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: Então um dos seus servos respondeu
  rationale: A fórmula narrativa hebraica introduz uma fala em resposta. “Servos” mantém a amplitude de עֲבָדִים no contexto da corte sem especificar indevidamente “escravos” ou “oficiais”.
- source_word: וְיִקְחוּ נָא
  choice: Por favor, tomem
  rationale: O jussivo com נָא expressa uma proposta cortês; a forma portuguesa preserva tanto o pedido quanto seu caráter volitivo.
- source_word: חֲמִשָּׁה מִן הַסּוּסִים הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: cinco dos cavalos que restam, os que ficaram nela
  rationale: “Dos cavalos” traduz naturalmente o מן partitivo. “Restam” e “ficaram” refletem a repetição da raiz שׁאר, e “nela” conserva o pronome feminino sem inserir “cidade” no texto principal.
- source_word: הִנָּם
  choice: 'Vejam: eles são'
  rationale: A expressão chama a atenção dos ouvintes para a comparação. “Vejam” é atual e digna; na segunda ocorrência, o verbo não é repetido em português para evitar peso artificial, embora a estrutura comparativa permaneça repetida.
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: como toda a multidão de Israel
  rationale: “Multidão” preserva o sentido coletivo de הָמוֹן e a comparação explícita com כְּ.
- source_word: אֲשֶׁר תָּמּוּ
  choice: que pereceu
  rationale: Neste contexto de fome e mortandade, תָּמּוּ indica os que chegaram ao fim ou morreram; “pereceu” comunica o sentido sem especificar uma causa não declarada.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: Enviemos alguns homens para verificar
  rationale: Os coortativos propõem uma ação investigativa. O objeto humano está implícito no contexto; “alguns homens” o explicita naturalmente em português, e “verificar” expressa o idiomático “enviar e ver”.
theological_decisions:
- issue: Destino dos cavalos e dos israelitas na comparação repetitiva
  choice: 'Preservar as duas comparações: com os que ficaram e com os que pereceram'
  alternative: Simplificar para dizer que os cavalos morrerão de qualquer maneira, como o restante do povo
  rationale: O hebraico é difícil e repetitivo. A tradução não resolve a tensão por paráfrase nem acrescenta uma interpretação causal ou temporal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é narrativo e digno, sem arcaísmos como “eis”. A estranheza da comparação hebraica foi mantida, com notas breves para orientar o leitor sem resolver a ambiguidade.
