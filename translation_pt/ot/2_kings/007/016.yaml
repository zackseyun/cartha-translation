reference: 2 Kings 7:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: pt
  text: Então o povo saiu e saqueou o acampamento de Aram[a]. Uma seá[b] de farinha fina passou a ser vendida por um siclo, e duas seás de cevada por um siclo, conforme a palavra de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o acampamento arameu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Seá: antiga medida para produtos secos.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: Então o povo saiu
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa com naturalidade a sequência em português, e “o povo” traduz diretamente הָעָם.
- source_word: וַיָּבֹזּוּ
  choice: saqueou
  rationale: בזז designa tomar os despojos do inimigo. “Saqueou” é claro, atual e preserva o contexto militar.
- source_word: מַחֲנֵה אֲרָם
  choice: o acampamento de Aram
  rationale: A expressão construta significa literalmente “acampamento de Aram”. Mantém-se o nome antigo Aram, sem substituí-lo pelo equivalente geopolítico tradicional “Síria”.
- source_word: וַיְהִי
  choice: passou a ser vendida
  rationale: Na fórmula de preços, o verbo indica que o produto chegou ao preço anunciado. A formulação explicita de modo natural em português a situação comercial pressuposta pelo contexto.
- source_word: סְאָה
  choice: uma seá
  rationale: O hebraico nomeia uma medida seca específica. A transliteração preserva a unidade antiga, acompanhada de nota explicativa.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: סֹלֶת indica farinha fina ou de qualidade, e não farinha em sentido genérico.
- source_word: בְּשֶׁקֶל
  choice: por um siclo
  rationale: “Por” é idiomático em uma declaração de preço; “siclo” conserva a antiga unidade de peso e valor.
- source_word: וְסָאתַיִם
  choice: e duas seás
  rationale: A forma dual especifica exatamente duas unidades da medida mencionada.
- source_word: שְׂעֹרִים
  choice: de cevada
  rationale: No contexto de mercado, o plural hebraico designa naturalmente a cevada como produto.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: A expressão assinala o cumprimento da palavra profética anterior e mantém explicitamente o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. A construção “passou a ser vendida” torna explícita a fórmula de preço implícita no hebraico sem alterar seu sentido. Os marcadores foram associados aos termos que efetivamente explicam.
