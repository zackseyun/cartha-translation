  text: וַ/יַּ֣עַן הַ/שָּׁלִ֡ישׁ אֲשֶׁר לַ/מֶּלֶךְ֩ נִשְׁעָ֨ן עַל יָד֜/וֹ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/כָ֤ה רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: pt
  text: 'Então o oficial em cujo braço o rei se apoiava respondeu ao homem de Deus: “Veja: se Yahweh fizesse janelas nos céus[a], isso poderia acontecer?” O homem de Deus respondeu: “Você verá isso com os próprios olhos, mas não comerá nada disso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abrisse as comportas do céu”. O hebraico diz literalmente “fizesse janelas nos céus”, imagem de uma provisão extraordinária vinda de cima.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: o oficial
  rationale: O termo designa um oficial militar ou da corte de posição elevada, mas sua patente exata não é segura; “oficial” evita uma precisão indevida.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: em cujo braço o rei se apoiava
  rationale: Preserva a imagem concreta do hebraico e comunica naturalmente a função de auxiliar próximo e confiável do rei.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém o título hebraico tradicional dado ao profeta, sem substituí-lo pela interpretação “profeta”.
- source_word: הִנֵּה
  choice: Veja!
  rationale: Marca a exclamação que introduz a resposta cética do oficial em português atual, sem recorrer ao arcaico “Eis”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: fizesse janelas nos céus
  rationale: Conserva a metáfora concreta e extraordinária do original; a alternativa idiomática “abrisse as comportas do céu” é registrada em nota.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: isso poderia acontecer?
  rationale: Expressa de modo natural a pergunta retórica e incrédula sobre a possibilidade de a promessa se cumprir.
- source_word: הִנְּכָה רֹאֶה בְּעֵינֶיךָ
  choice: Você verá isso com os próprios olhos
  rationale: Reproduz a ênfase deítica e pessoal da resposta sem acrescentar uma indicação temporal não explícita.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: mas não comerá nada disso
  rationale: Em contexto, o referente é a provisão de alimento anunciada; a formulação comunica claramente que o oficial a verá, mas não participará dela.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o nome próprio divino; a transliteração preserva essa distinção em relação ao título “Senhor”.
- issue: Força da fala do oficial
  choice: Pergunta retórica cética introduzida por “Mesmo que”
  alternative: Afirmação condicional neutra com “Se”
  rationale: O contexto e a construção interrogativa indicam incredulidade, mas a tradução continua em forma de pergunta e não explicita além do texto a motivação interior do oficial.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem narrativa foi suavemente ajustada para evitar a repetição pouco natural de “respondeu... e disse”. “O homem de Deus” é repetido na segunda fala para tornar explícito o referente do pronome hebraico sem introduzir nova identificação.
