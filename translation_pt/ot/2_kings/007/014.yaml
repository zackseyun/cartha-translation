    issue: A nota diz «duas parelhas de carros».
    rationale: Uma parelha é de animais de tração, não de carros. Isso deturpa a alternativa indicada pela expressão hebraica comprimida e pelo audit trail inglês, que contempla equipagens ou parelhas de cavalos para carros.
  - severity: low
    issue: «Atrás do acampamento» é direcionalmente possível, mas pode soar estático ou espacial.
    rationale: Aqui אַחֲרֵי introduz o alvo que o rei manda seguir; «após o acampamento» expressa esse movimento de maneira mais precisa e natural no registro bíblico moderno.
