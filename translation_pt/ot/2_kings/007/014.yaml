base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/014.yaml
  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: pt
  text: 'Então pegaram dois carros de guerra com cavalos[a], e o rei os enviou após o acampamento de Arã, dizendo: “Vão e vejam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dois carros de cavalos”, expressão condensada que provavelmente se refere a dois carros puxados por cavalos ou a duas equipagens de cavalos para carros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Então pegaram
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: dois carros com cavalos
  rationale: A expressão hebraica é condensada e um pouco elíptica. A tradução mantém a imagem concreta de carros e cavalos sem impor se a referência exata é aos carros puxados por cavalos ou às respectivas parelhas.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: e o rei os enviou
  rationale: O pronome “os”, recuperado do contexto imediato, torna explícito em português o objeto implícito do verbo.
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: atrás do acampamento de Arã
  rationale: Preserva o sentido direcional de אַחֲרֵי e traduz מַחֲנֶה concretamente como “acampamento”, sem transformar Arã em adjetivo gentílico.
- source_word: אֲרָם
  choice: Arã
  rationale: Emprega a forma portuguesa tradicional do nome antigo e evita o anacrônico “Síria”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz o discurso direto, de maneira natural e dignificada.
- source_word: לְכוּ וּרְאוּ
  choice: Vão e vejam
  rationale: Reproduz os dois imperativos simples e diretos. As formas no plural correspondem à ordem dirigida ao grupo enviado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. “Carros” é mantido no sentido antigo de carros de guerra, esclarecido pela menção aos cavalos e pela nota. A concisão da ordem real e a ambiguidade lexical da expressão hebraica são preservadas.
