  yaml_path: translation/ot/2_kings/007/020.yaml
  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: pt
  text: 'E assim aconteceu com ele[a]: o povo o pisoteou no portão[b], e ele morreu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E foi assim com ele”, isto é, os acontecimentos se deram exatamente como havia sido anunciado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “junto ao portão” ou “na passagem do portão”. O termo hebraico pode indicar tanto o portão da cidade quanto a área ou o complexo de entrada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: E assim aconteceu com ele
  rationale: A expressão indica que o que havia sido anunciado se cumpriu exatamente para ele. A formulação é natural em português e mantém a forma narrativa, sem acrescentar uma explicação teológica.
- source_word: וַיִּרְמְסוּ
  choice: pisoteou
  rationale: O verbo רמס descreve o ato de pisar ou calcar sob os pés. “Pisoteou” expressa isso de modo direto e idiomático; o singular concorda naturalmente com o coletivo “o povo”.
- source_word: הָעָם
  choice: o povo
  rationale: É o equivalente direto de עַם e preserva a referência coletiva à população que passava pelo portão. “A multidão” explicitaria mais a cena, mas seria menos formalmente correspondente.
- source_word: בַּשַּׁעַר
  choice: no portão
  rationale: שַׁעַר pode designar tanto o portão da cidade quanto a área ou o complexo de entrada. “No portão” é conciso, segue de perto o hebraico e deixa essa extensão espacial em aberto.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Reproduz de maneira direta a sequência narrativa do hebraico. O contexto já indica que a morte resultou do pisoteamento, sem ser necessário tornar essa relação explicitamente causal.
theological_decisions:
- issue: Formulação do cumprimento do juízo anunciado
  choice: Apresentar o destino do oficial como algo que aconteceu conforme fora anunciado, mantendo a formulação narrativa do versículo.
  alternative: 'Explicitar a interpretação, por exemplo: “Assim veio sobre ele o juízo”.'
  rationale: O contexto mostra o cumprimento da palavra profética de Eliseu e o juízo do SENHOR, mas o versículo relata o acontecimento sem comentário teológico explícito. A tradução preserva essa sobriedade e não acrescenta ao texto uma conclusão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe concisa conserva a progressão narrativa do hebraico; as notas registram alternativas legítimas sem sobrecarregar o texto principal.
