  text: וַ/יָּ֨קָם הַ/מֶּ֜לֶךְ לַ֗יְלָה וַ/יֹּ֨אמֶר֙ אֶל עֲבָדָ֔י/ו אַגִּֽידָה נָּ֣א לָ/כֶ֔ם אֵ֛ת אֲשֶׁר עָ֥שׂוּ לָ֖/נוּ אֲרָ֑ם יָדְע֞וּ כִּי רְעֵבִ֣ים אֲנַ֗חְנוּ וַ/יֵּצְא֤וּ מִן הַֽ/מַּחֲנֶה֙ לְ/הֵחָבֵ֤ה ב/ה/שדה לֵ/אמֹ֔ר כִּֽי יֵצְא֤וּ מִן הָ/עִיר֙ וְ/נִתְפְּשֵׂ֣/ם חַיִּ֔ים וְ/אֶל הָ/עִ֖יר נָבֹֽא־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: pt
  text: 'Então o rei se levantou durante a noite e disse aos seus servos: “Deixem-me dizer-lhes, por favor, o que Arã nos fez. Eles sabem que estamos com fome. Por isso, saíram do acampamento para se esconder no campo, dizendo: ‘Quando eles saírem da cidade, nós os capturaremos vivos e entraremos na cidade’.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Expressa naturalmente o ato de o rei se erguer durante a noite, preservando a ação concreta do verbo קום.
- source_word: לַיְלָה
  choice: durante a noite
  rationale: Reproduz o valor temporal adverbial e mantém vivo o cenário noturno.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: É a equivalência ampla e transparente; no contexto, pode abranger servidores ou oficiais da corte.
- source_word: אַגִּידָה נָּא לָכֶם
  choice: Deixem-me dizer a vocês
  rationale: Comunica a força volitiva do coortativo e a suavização de נָא em português atual, sem recorrer a uma formulação excessivamente literal.
- source_word: אֵת אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: o que Arã fez contra nós
  rationale: Mantém o nome geográfico e nacional Arã e sua personificação coletiva; 'contra nós' explicita de modo natural o sentido hostil de לָנוּ neste contexto.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: Eles sabem que estamos com fome
  rationale: O presente se ajusta à explicação direta do rei sobre o conhecimento e o plano que ele atribui ao inimigo.
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: saíram do acampamento
  rationale: Forma narrativa clara e idiomática; 'acampamento' indica o arraial militar arameu.
- source_word: לְהֵחָבֵה
  choice: para se esconder
  rationale: 'Preserva o sentido reflexivo do infinitivo: os soldados teriam saído a fim de ocultar a si mesmos.'
- source_word: בַּשָּׂדֶה
  choice: no campo
  rationale: Equivalência direta que também pode designar coletivamente a área aberta fora da cidade.
- source_word: לֵאמֹר
  choice: pensando
  rationale: Neste contexto, introduz o conteúdo do plano que o rei atribui aos arameus; 'pensando' evita sugerir necessariamente uma fala audível.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: Quando eles saírem da cidade
  rationale: Apresenta a circunstância esperada para a emboscada, sem convertê-la numa afirmação já realizada.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: nós os capturaremos vivos
  rationale: Transmite a ação de תפשׂ e conserva o valor predicativo de חַיִּים.
- source_word: וְאֶל הָעִיר נָבֹא
  choice: e entraremos na cidade
  rationale: 'Formulação portuguesa natural que preserva a progressão do suposto plano: capturar os que saírem e depois entrar na cidade.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva-se 'Arã' em vez de 'Síria' para representar o nome hebraico; a nota esclarece seu uso coletivo. A fala mantém a suspeita e o raciocínio do rei sem afirmar que o plano atribuído aos arameus era real.
