reference: 2 Kings 7:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: pt
  text: 'Então Eliseu disse: “Ouçam a palavra de Yahweh. Assim diz Yahweh: Amanhã, por volta desta hora, uma seá[a] de farinha fina será vendida por um siclo, e duas seás de cevada, por um siclo, à porta de Samaria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A seá era uma antiga medida de capacidade para produtos secos; o hebraico emprega uma unidade específica, não apenas o termo genérico “medida”.
    reason: Nota cultural sobre uma unidade antiga de capacidade.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência em português.
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: O imperativo está no plural e introduz solenemente a proclamação profética.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional e o caráter verbal da revelação, sem reduzi-la a uma mensagem genérica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula formal do mensageiro profético e sua cadência reconhecível.
- source_word: כָּעֵת מָחָר
  choice: Amanhã, por volta desta hora
  rationale: Expressa naturalmente o valor aproximativo de כְּ e a referência ao mesmo período do dia seguinte.
- source_word: סְאָה
  choice: seá
  rationale: Conserva a unidade específica de capacidade para secos, em vez de empregar o termo genérico “medida”.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Distingue סֹלֶת de farinha em sentido genérico.
- source_word: בְּשֶׁקֶל
  choice: por um siclo
  rationale: Neste contexto comercial, a preposição indica o preço.
- source_word: וְסָאתַיִם
  choice: e duas seás
  rationale: Reproduz o dual hebraico e mantém a mesma unidade usada na primeira cotação.
- source_word: שְׂעֹרִים
  choice: cevada
  rationale: É o equivalente comum e preciso para o cereal mencionado.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: à porta de Samaria
  rationale: A porta da cidade funcionava como espaço público e comercial; “à porta” preserva o local concreto com português natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética preservada. O plural “Ouçam” reflete o hebraico. “Será vendida” explicita de modo natural a relação de preço implícita nas frases nominais hebraicas; a elipse do segundo verbo evita repetição pesada. O marcador da nota foi colocado junto de “seá”, termo que a nota explica.
