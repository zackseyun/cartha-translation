  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: pt
  text: 'Se dissermos: “Vamos entrar na cidade”, há fome na cidade, e morreremos ali. E, se ficarmos aqui, morreremos. Agora, vamos nos entregar[a] ao acampamento de Arã[b]. Se eles nos deixarem viver, viveremos; e, se nos matarem, morreremos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cair sobre/contra”. Neste contexto militar, a expressão hebraica pode significar passar para o lado de outra força ou render-se a ela.
    reason: lexical_alternative
  - marker: b
    text: Arã é o nome hebraico da região e do povo também chamados de Síria e sírios, ou de arameus.
    reason: cultural_note
lexical_decisions:
- source_word: נָבוֹא
  choice: vamos entrar
  rationale: O imperfeito na fala proposta após “se dissermos” tem valor volitivo; “vamos entrar” expressa isso naturalmente em português.
- source_word: הָעִיר
  choice: a cidade
  rationale: Preserva o substantivo comum do hebraico, que no contexto se refere a Samaria sem nomeá-la aqui.
- source_word: הָרָעָב
  choice: há fome
  rationale: רָעָב indica a fome generalizada causada pelo cerco. A construção portuguesa “há fome na cidade” é direta e natural.
- source_word: וָמַתְנוּ / וָמָתְנוּ
  choice: morreremos
  rationale: Nas sequências condicionais, as formas exprimem o resultado esperado; o futuro comunica claramente essa consequência.
- source_word: יָשַׁבְנוּ פֹה
  choice: ficarmos aqui
  rationale: ישב pode significar sentar-se, permanecer ou ficar. “Ficarmos aqui” comunica neste contexto a opção de não sair, sem sugerir que a postura física seja o ponto central.
- source_word: וְעַתָּה
  choice: agora, portanto
  rationale: Marca a passagem da avaliação das alternativas para uma conclusão prática; “portanto” torna perceptível essa força inferencial.
- source_word: לְכוּ
  choice: venham
  rationale: Embora literalmente seja “vão”, funciona como exortação que convida os demais a agir com o falante; “venham” é idiomático em português.
- source_word: וְנִפְּלָה אֶל
  choice: vamos nos entregar a
  rationale: No contexto militar, נפל אל é um idioma que pode indicar passar para o outro lado ou render-se. “Nos entregar” comunica o sentido contextual com clareza, enquanto a nota registra a imagem literal.
- source_word: מַחֲנֵה אֲרָם
  choice: o acampamento de Arã
  rationale: Mantém o nome hebraico Arã e traduz a relação construta de modo natural.
- source_word: יְחַיֻּנוּ
  choice: eles nos deixarem viver
  rationale: O piel de חיה com sufixo objetivo significa conservar vivo ou deixar viver; esta escolha preserva também a repetição com “viveremos”.
- source_word: נִחְיֶה
  choice: viveremos
  rationale: Traduz diretamente a oração de resultado e mantém a repetição enfática da raiz חיה.
- source_word: יְמִיתֻנוּ
  choice: nos matarem
  rationale: O hifil de מות significa causar a morte, isto é, matar. “Nos matarem” é atual, claro e semanticamente exato em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva as repetições decisivas de “morreremos” e “viver”, mas verte o idioma militar נפל אל pelo sentido contextual claro. A pontuação apresenta a deliberação desesperada como fala direta e encadeada.
