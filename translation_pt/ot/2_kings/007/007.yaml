base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: pt
  text: Então eles se levantaram e fugiram ao crepúsculo[a]. Deixaram suas tendas, seus cavalos, seus jumentos e o acampamento como estava[b], e fugiram para salvar a vida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao anoitecer” ou “na penumbra”. O termo hebraico pode designar o crepúsculo, sem indicar por si só com absoluta precisão se é vespertino ou matutino.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o acampamento como estava”, isto é, deixaram tudo no estado em que se encontrava.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “fugiram para a sua vida”, expressão idiomática que significa fugir para preservar a vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: ao crepúsculo
  rationale: נֶשֶׁף designa a luz incerta entre o dia e a noite. “Ao crepúsculo” conserva a possível referência ao entardecer sem especificá-la além do hebraico.
- source_word: וַיַּעַזְבוּ
  choice: deixaram
  rationale: עזב pode significar deixar ou abandonar. “Deixaram” é natural e claro, enquanto o contexto da fuga comunica o abandono repentino.
- source_word: אָהֳלֵיהֶם
  choice: suas tendas
  rationale: Equivalente direto e corrente no contexto de um acampamento militar.
- source_word: סוּסֵיהֶם
  choice: seus cavalos
  rationale: Equivalente lexical direto.
- source_word: חֲמֹרֵיהֶם
  choice: seus jumentos
  rationale: “Jumentos” é uma designação contemporânea e amplamente compreensível para os animais de carga mencionados.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: o acampamento como estava
  rationale: Reproduz de perto a expressão hebraica e ressalta que o acampamento foi deixado no estado em que se encontrava, sem introduzir a interpretação mais específica “intacto”.
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: fugiram para salvar a própria vida
  rationale: A expressão hebraica é um modo idiomático de indicar fuga para preservar a vida. Esta formulação é natural em português e mantém a urgência.
- source_word: וַיָּקוּמוּ
  choice: eles se levantaram
  rationale: קום inicia a ação urgente. “Levantaram-se” preserva o sentido básico e o ritmo narrativo.
- source_word: וַיָּנ֣וּסוּ ... וַיָּנֻסוּ
  choice: fugiram ... fugiram
  rationale: A repetição do mesmo verbo no hebraico é preservada para refletir a ênfase e a urgência do relato.
