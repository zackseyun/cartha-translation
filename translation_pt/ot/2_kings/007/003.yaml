base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: pt
  text: 'Havia quatro homens com uma doença de pele à entrada do portão[a], e disseram uns aos outros: “Por que estamos sentados aqui até morrermos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a tradução tradicional, “leprosos”. O hebraico se refere a uma condição de pele associada à צָרַעַת e não necessariamente à hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: Havia quatro homens
  rationale: A construção introduz os participantes da nova cena. “Havia quatro homens” é natural em português e mantém a referência a adultos do sexo masculino.
- source_word: מְצֹרָעִים
  choice: com uma doença de pele
  rationale: O termo hebraico designa pessoas afetadas pela condição associada a צָרַעַת, que não corresponde necessariamente à hanseníase moderna; a formulação evita precisão médica indevida.
- source_word: פֶּתַח הַשָּׁעַר
  choice: junto à entrada do portão
  rationale: Expressa de modo claro a localização no acesso do portão da cidade. “Junto à” evita sugerir necessariamente que estavam dentro da passagem.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: Eles disseram uns aos outros
  rationale: O idiomatismo distributivo singular indica uma conversa recíproca entre os homens.
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: Por que ficamos aqui sentados
  rationale: מָה tem valor idiomático de “por que” nesta pergunta retórica; a expressão portuguesa preserva tanto a permanência quanto a postura indicada pelo particípio.
- source_word: עַד מָתְנוּ
  choice: até morrermos
  rationale: Indica a morte como resultado final de continuarem naquele lugar; o futuro do subjuntivo é a construção portuguesa natural após “até” nesse contexto.
