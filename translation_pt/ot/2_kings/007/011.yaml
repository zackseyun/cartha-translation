  yaml_path: translation/ot/2_kings/007/011.yaml
  text: Then the gatekeepers called out and reported it inside the king’s house[a].
translation:
  language: pt
  text: Então os guardas dos portões chamaram em voz alta e levaram a notícia para dentro da casa do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e comunicaram a notícia à casa do rei, no interior”. O hebraico diz literalmente “casa do rei, para dentro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gritaram
  rationale: O verbo קרא descreve aqui os guardas chamando em voz alta para fazer chegar o aviso. Embora a forma verbal hebraica esteja no singular diante de um sujeito plural, o português requer concordância natural no plural.
- source_word: הַשֹּׁעֲרִים
  choice: os guardas dos portões
  rationale: שֹׁעֲרִים designa os encarregados ou vigias dos portões. Esta formulação é clara em português moderno e, no contexto urbano, evita a possível impressão de simples porteiros domésticos.
- source_word: וַיַּגִּידוּ
  choice: transmitiram a notícia
  rationale: נגד significa fazer saber, informar ou relatar. O conteúdo é implícito e retomado naturalmente como 'a notícia' em português.
- source_word: בֵּית הַמֶּלֶךְ
  choice: palácio do rei
  rationale: A expressão literal é 'casa do rei', mas neste contexto designa a residência e sede real; 'palácio do rei' comunica essa referência de modo natural sem decidir se o informe foi dirigido ao edifício ou à casa real.
- source_word: פְּנִימָה
  choice: para o interior
  rationale: O advérbio direcional indica que a comunicação seguiu para dentro, partindo dos portões.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. 'Guardas dos portões' explicita a função contextual; a nota preserva a construção hebraica e sua possível referência tanto ao espaço interior quanto à casa real.
