base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: pt
  text: 'Então disseram uns aos outros: “O que estamos fazendo não é certo. Este é um dia de boas notícias, e estamos calados. Se esperarmos até a luz da manhã, a culpa nos alcançará[a]. Agora, venham! Vamos à casa do rei levar a notícia[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o castigo nos alcançará” ou “incorreremos em culpa”. Literalmente, o hebraico diz: “a culpa/iniquidade nos encontrará”.'
    reason: lexical_alternative
  - marker: b
    text: “A casa do rei” também pode ser entendida como “a casa real”, “a corte real” ou “o palácio real”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: O que estamos fazendo não é certo
  rationale: Expressa de modo natural a avaliação moral do idiomatismo hebraico, literalmente ‘não é assim que estamos fazendo’, sem tornar a frase rígida.
- source_word: יוֹם בְּשֹׂרָה
  choice: dia de boas notícias
  rationale: בְּשֹׂרָה designa notícia favorável, especialmente de vitória ou livramento; a formulação é clara e adequada ao contexto.
- source_word: מַחְשִׁים
  choice: estamos calados
  rationale: O particípio causativo comunica silêncio contínuo e deliberado, isto é, a retenção da notícia.
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: Se esperarmos até a luz da manhã
  rationale: A construção tem sentido condicional no contexto, e ‘luz da manhã’ preserva a imagem explícita do hebraico.
- source_word: וּמְצָאָנוּ עָוֹן
  choice: a culpa nos alcançará
  rationale: Preserva a personificação da expressão literal ‘culpa/iniquidade nos encontrará’ e sua dimensão moral, sem excluir a consequência punitiva.
- source_word: לְכוּ וְנָבֹאָה
  choice: Agora, venham! Vamos
  rationale: Reproduz a exortação urgente formada pelo imperativo e pelo coortativo, em português corrente.
- source_word: וְנַגִּידָה
  choice: levar a notícia
  rationale: O Hifil de נגד significa contar, declarar ou comunicar; no contexto, trata-se de transmitir oficialmente uma notícia urgente.
- source_word: בֵּית הַמֶּלֶךְ
  choice: à casa do rei
  rationale: Mantém a expressão hebraica e sua possível referência tanto à residência real quanto à casa ou administração do rei.
