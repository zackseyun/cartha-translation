source:
  edition: WLC
  text: וַ/יֵּלְכ֣וּ אַחֲרֵי/הֶם֮ עַד הַ/יַּרְדֵּן֒ וְ/הִנֵּ֣ה כָל הַ/דֶּ֗רֶךְ מְלֵאָ֤ה בְגָדִים֙ וְ/כֵלִ֔ים אֲשֶׁר הִשְׁלִ֥יכוּ אֲרָ֖ם ב/החפז/ם וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יַּגִּ֖דוּ לַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: pt
  text: Eles foram atrás deles até o Jordão. E viram que todo o caminho estava cheio de roupas e equipamentos[a] que Aram[b] havia jogado fora na pressa. Então os mensageiros[c] voltaram e deram a notícia ao rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “objetos”, “apetrechos” ou “suprimentos”. O termo hebraico é amplo e pode designar objetos, utensílios ou equipamentos.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Aram”, empregado aqui coletivamente em referência aos arameus.'
    reason: alternative_reading
  - marker: c
    text: Ou “os exploradores”. O termo hebraico significa literalmente “mensageiros”, mas aqui se refere aos homens enviados para averiguar o que havia acontecido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: Eles foram atrás deles
  rationale: Expressa de modo natural a sequência narrativa e o ato de seguir os fugitivos, sem intensificar necessariamente a ideia como perseguição militar.
- source_word: עַד הַיַּרְדֵּן
  choice: até o Jordão
  rationale: עַד indica o limite alcançado; em português, “até o Jordão” comunica isso com clareza.
- source_word: וְהִנֵּה
  choice: E viram que
  rationale: No contexto, הִנֵּה introduz vividamente o que os homens encontraram. Esta formulação evita o arcaísmo de “e eis que” e mantém a perspectiva da descoberta.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: todo o caminho estava cheio
  rationale: Reproduz a imagem concreta da rota inteira coberta pelos objetos abandonados.
- source_word: בְגָדִים
  choice: roupas
  rationale: Termo atual, claro e digno para peças de vestuário.
- source_word: וְכֵלִים
  choice: e equipamentos
  rationale: כֵלִים é um termo amplo para objetos, utensílios ou apetrechos; no contexto de um exército em fuga, “equipamentos” é adequado sem restringir demais o sentido.
- source_word: אֲשֶׁר הִשְׁלִיכוּ אֲרָם
  choice: que Aram havia jogado fora
  rationale: O mais-que-perfeito situa corretamente o abandono antes da descoberta. “Aram” preserva o nome coletivo empregado pelo texto hebraico.
- source_word: בְחָפְזָם
  choice: na pressa
  rationale: Traduz diretamente a ideia de pressa sob pressão, sem acrescentar a noção mais forte de pânico.
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: Então os mensageiros voltaram
  rationale: מַלְאָכִים significa literalmente “mensageiros”; no contexto, eram os homens enviados para averiguar a situação.
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ
  choice: e deram a notícia ao rei
  rationale: Expressão idiomática portuguesa para comunicar um relato ou informação ao rei.
