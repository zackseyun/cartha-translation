source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: pt
  text: 'Pois o Senhor havia feito o acampamento de Arã ouvir o som de carros de guerra, o som de cavalos e o som de um grande exército, e disseram uns aos outros: “Vejam! O rei de Israel contratou os reis dos hititas e os reis do Egito contra nós, para virem contra nós.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי
  choice: o Senhor
  rationale: O título divino אֲדֹנָי refere-se aqui ao Deus de Israel; “o Senhor” é a forma portuguesa natural e tradicional, sem substituir o título pelo Tetragrama.
- source_word: הִשְׁמִיעַ
  choice: havia feito ... ouvir
  rationale: Preserva o valor causativo do hifil de שׁמע e, com o mais-que-perfeito composto, apresenta a ação como explicação da fuga narrada no contexto.
- source_word: מַחֲנֵה אֲרָם
  choice: o acampamento de Arã
  rationale: Mantém o nome próprio hebraico Arã e a relação construta, evitando a associação anacrônica que “Síria” pode produzir.
- source_word: קוֹל רֶכֶב
  choice: o som de carros de guerra
  rationale: “Som” traduz קוֹל, enquanto “carros de guerra” explicita naturalmente em português o sentido militar de רֶכֶב neste contexto.
- source_word: קוֹל סוּס
  choice: o som de cavalos
  rationale: Conserva a repetição enfática de קוֹל e a imagem concreta do texto hebraico.
- source_word: קוֹל חַיִל גָּדוֹל
  choice: o som de um grande exército
  rationale: חַיִל designa aqui uma força militar; “grande exército” é claro e contextualmente preciso.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: Então disseram uns aos outros
  rationale: Expressa em português corrente o sentido recíproco da expressão idiomática literalmente formulada como “cada homem ao seu irmão”.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Reproduz a força de chamada de atenção da partícula no discurso direto, em linguagem atual e digna.
- source_word: שָׂכַר עָלֵינוּ
  choice: contratou contra nós
  rationale: Preserva o verbo “contratar” e o sentido hostil da preposição עַל, sem acrescentar um objeto como “mercenários”, ausente do hebraico.
- source_word: מַלְכֵי הַחִתִּים
  choice: os reis dos hititas
  rationale: Mantém o plural do texto e a relação genitiva, que pode apontar para diversos governantes regionais.
- source_word: מַלְכֵי מִצְרַיִם
  choice: os reis do Egito
  rationale: Conserva o plural hebraico, apesar de sua possível dificuldade histórica, sem corrigi-lo para o singular.
- source_word: לָבוֹא עָלֵינוּ
  choice: para virem contra nós
  rationale: Mantém tanto a ideia de movimento do infinitivo בוא quanto o sentido hostil de עַל, sem reduzir a expressão a “atacar”.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: o Senhor
  alternative: o senhor / o soberano
  rationale: O contexto identifica o referente como o Deus de Israel. “O Senhor” comunica o título divino de modo reconhecível, sem tratá-lo como se fosse explicitamente o Tetragrama.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição tríplice de “o som de” foi mantida por seu efeito retórico. Preservaram-se os plurais potencialmente difíceis “reis dos hititas” e “reis do Egito”, bem como a dupla expressão hostil “contra nós ... contra nós”, que pertence ao texto hebraico.
