revisions:
- from: 'Pois o Senhor havia feito o acampamento de Arã ouvir o som de carros de guerra, o som de cavalos e o som de um grande exército. Então disseram uns aos outros: “Vejam! O rei de Israel contratou contra nós os reis dos hititas e os reis do Egito para virem contra nós.”'
  to: 'Pois o Senhor havia feito o acampamento de Arã ouvir o som de carros de guerra, o som de cavalos e o som de um grande exército, e disseram uns aos outros: “Vejam! O rei de Israel contratou os reis dos hititas e os reis do Egito contra nós, para virem contra nós.”'
  rationale: A revisão limita-se à ordem dos constituintes e à ligação narrativa, para obter português mais natural e manter de modo transparente todos os elementos do hebraico, inclusive a dupla formulação hostil “contra nós”.
