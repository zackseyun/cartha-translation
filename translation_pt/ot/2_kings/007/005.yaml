source:
  edition: WLC
  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: pt
  text: Então eles se levantaram ao anoitecer para ir ao acampamento de Arã. Quando chegaram à extremidade do acampamento de Arã, eis que não havia ninguém ali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: Então eles se levantaram
  rationale: O wayyiqtol de קום faz a narrativa avançar; “Então” expressa a sequência, e “se levantaram” é natural e fiel.
- source_word: בַנֶּ֔שֶׁף
  choice: ao anoitecer
  rationale: נֶשֶׁף designa o crepúsculo vespertino neste contexto; “ao anoitecer” é corrente e combina com a partida em direção ao acampamento.
- source_word: לָב֖וֹא
  choice: para ir
  rationale: O infinitivo de בוא indica propósito. Em português, a partir da perspectiva narrativa, “para ir” expressa naturalmente o movimento rumo ao acampamento.
- source_word: מַחֲנֵ֣ה אֲרָם
  choice: o acampamento de Arã
  rationale: Mantém de modo transparente a construção hebraica e emprega a forma portuguesa tradicional do topônimo Aram, “Arã”.
- source_word: וַיָּבֹ֗אוּ
  choice: Quando chegaram
  rationale: O segundo wayyiqtol prossegue a sequência. A oração temporal produz uma ligação natural com a descoberta subsequente.
- source_word: עַד קְצֵה֙
  choice: à extremidade de
  rationale: A expressão indica o limite externo do acampamento. “Extremidade” preserva essa noção sem especificar indevidamente periferia ou entrada.
- source_word: וְהִנֵּ֥ה
  choice: eis que
  rationale: Preserva a função discursiva de הִנֵּה, que chama atenção para uma descoberta inesperada.
- source_word: אֵֽין שָׁ֖ם אִֽישׁ
  choice: não havia ninguém ali
  rationale: 'Embora אִישׁ seja formalmente masculino singular, nesta construção negativa tem sentido genérico: nenhuma pessoa estava presente. “Ninguém” comunica esse sentido com precisão e naturalidade em português.'
theological_decisions:
- issue: Masculino singular אִישׁ em uma expressão que indica ausência total de pessoas
  choice: não havia ninguém ali
  alternative: não havia homem algum ali
  rationale: No contexto, אִישׁ não contrasta homens com mulheres, mas nega a presença de qualquer pessoa. A tradução genérica evita criar uma restrição de sexo inexistente no sentido da passagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” mantém o relevo narrativo do hebraico, enquanto “ao anoitecer” e “ninguém” evitam rigidez desnecessária.
