  text: וַ/יָּבֹ֗אוּ וַֽ/יִּקְרְאוּ֮ אֶל שֹׁעֵ֣ר הָ/עִיר֒ וַ/יַּגִּ֤ידוּ לָ/הֶם֙ לֵ/אמֹ֔ר בָּ֚אנוּ אֶל מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֛ם אִ֖ישׁ וְ/ק֣וֹל אָדָ֑ם כִּ֣י אִם הַ/סּ֤וּס אָסוּר֙ וְ/הַ/חֲמ֣וֹר אָס֔וּר וְ/אֹהָלִ֖ים כַּ/אֲשֶׁר הֵֽמָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: pt
  text: 'Então eles vieram e chamaram os guardas do portão da cidade. E lhes relataram: “Fomos ao acampamento de Arã[a] e eis que não havia ninguém ali, nem se ouvia som humano algum[b]; havia apenas os cavalos amarrados, os jumentos amarrados e as tendas como estavam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “o acampamento dos sírios”. O hebraico traz o nome próprio “Arã”.
    reason: alternative_reading
  - marker: b
    text: Ou “voz humana alguma”. A palavra hebraica pode designar especificamente uma voz ou, de modo mais amplo, um som.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: os guardas do portão da cidade
  rationale: Embora שֹׁעֵר esteja morfologicamente no singular, os verbos e pronomes plurais seguintes favorecem um sentido coletivo. “Guardas do portão” comunica com naturalidade a função exercida na entrada fortificada da cidade.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: E lhes relataram
  rationale: O hifil de נגד significa contar ou relatar. A formulação portuguesa transmite a introdução do discurso sem reproduzir de maneira rígida o redundante “relataram, dizendo”.
- source_word: מַחֲנֵה אֲרָם
  choice: acampamento de Arã
  rationale: “Arã” preserva diretamente o nome próprio hebraico, em vez de substituí-lo pela designação tradicional “Síria”.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a apresentação vívida e repentina marcada por הִנֵּה, em registro bíblico digno e ainda compreensível.
- source_word: אֵין שָׁם אִישׁ
  choice: não havia ninguém ali
  rationale: אִישׁ é genérico neste contexto; “ninguém” expressa a ausência de qualquer pessoa sem restringir o sentido ao sexo masculino.
- source_word: וְקוֹל אָדָם
  choice: nem se ouvia som humano algum
  rationale: קוֹל pode indicar voz ou som. A tradução mantém o sentido mais amplo e torna natural em português a construção nominal elíptica do hebraico.
- source_word: כִּי אִם
  choice: havia apenas
  rationale: A expressão introduz as únicas exceções à ausência descrita; “apenas” comunica essa função de modo claro.
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: os cavalos amarrados, os jumentos amarrados
  rationale: Os substantivos singulares têm valor coletivo, e אָסוּר significa preso ou amarrado. O plural é natural em português e “amarrados” se ajusta ao contexto do acampamento.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: e as tendas como estavam
  rationale: A formulação concisa conserva a ideia de que as tendas tinham sido deixadas em seu estado anterior, sem acrescentar detalhes não expressos no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se “e eis que” para representar a vividez narrativa do hebraico; evitam-se arcaísmos como “porteiro” no sentido militar e a fórmula rígida “relataram, dizendo”.
