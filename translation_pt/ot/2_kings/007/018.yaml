  text: וַ/יְהִ֗י כְּ/דַבֵּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר סָאתַ֨יִם שְׂעֹרִ֜ים בְּ/שֶׁ֗קֶל וּֽ/סְאָה סֹ֨לֶת֙ בְּ/שֶׁ֔קֶל יִהְיֶה֙ כָּ/עֵ֣ת מָחָ֔ר בְּ/שַׁ֖עַר שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: pt
  text: 'E aconteceu exatamente como o homem de Deus tinha dito ao rei: “Duas seás[a] de cevada por um siclo e uma seá de farinha fina por um siclo — assim será amanhã, por volta desta hora, no portão[b] de Samaria”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A seá era uma antiga medida para produtos secos. O hebraico menciona diretamente as unidades: duas seás de cevada e uma seá de farinha fina.'
    reason: cultural_note
  - marker: b
    text: Ou «à porta de Samaria». O portão da cidade era um lugar público de comércio e de administração da justiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu
  rationale: Reproduz a fórmula narrativa de cumprimento sem recorrer ao arcaísmo «e sucedeu que».
- source_word: כְּדַבֵּר
  choice: exatamente como ... tinha dito
  rationale: O כְּ com o infinitivo indica correspondência entre o acontecimento e a palavra anterior; o mais-que-perfeito situa naturalmente a fala antes de seu cumprimento.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém diretamente o título hebraico, sem o substituir pela interpretação «o profeta».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem a citação direta de modo natural em português e cumprem a função do infinitivo quotativo hebraico.
- source_word: סָאתַיִם / וּסְאָה
  choice: duas seás / uma seá
  rationale: Preserva a unidade antiga e o contraste numérico entre a forma dual e a singular; a nota esclarece seu uso.
- source_word: שְׂעֹרִים
  choice: cevada
  rationale: Equivalente corrente e preciso do cereal mencionado.
- source_word: בְּשֶׁקֶל
  choice: por um siclo
  rationale: Na fórmula comercial, בְּ indica o preço; «por» é idiomático em português.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Conserva a distinção entre farinha de qualidade fina e farinha em sentido genérico.
- source_word: יִהְיֶה
  choice: assim será
  rationale: Torna explícita, sem acrescentar conteúdo, a construção hebraica elíptica que declara que esses preços vigorarão.
- source_word: כָּעֵת מָחָר
  choice: amanhã, por volta desta hora
  rationale: Expressa tanto a referência ao dia seguinte como a aproximação sugerida por כְּ.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: à porta de Samaria
  rationale: Em português, «à porta» designa naturalmente o espaço junto à entrada urbana onde se realizavam comércio e atos públicos; a nota registra essa função cultural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da declaração foi mantida próxima ao hebraico, enquanto os dois-pontos e o travessão tornam natural a estrutura elíptica da previsão. As unidades antigas foram preservadas e explicadas em nota.
