  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְ֠תַנְיָה בֶּן אֱלִ֨ישָׁמָ֜ע מִ/זֶּ֣רַע הַ/מְּלוּכָ֗ה וַ/עֲשָׂרָ֤ה אֲנָשִׁים֙ אִתּ֔/וֹ וַ/יַּכּ֥וּ אֶת גְּדַלְיָ֖הוּ וַ/יָּמֹ֑ת וְ/אֶת הַ/יְּהוּדִים֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים אֲשֶׁר הָי֥וּ אִתּ֖/וֹ בַּ/מִּצְפָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: pt
  text: Aconteceu que, no sétimo mês, Ismael, filho de Netanias, filho de Elisama, de linhagem real,[a] veio com dez homens. Eles feriram Gedalias, e ele morreu, juntamente com os judeus e os caldeus[b] que estavam com ele em Mispá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da semente da realeza”, isto é, descendente da casa real.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “caldeus” também pode ser traduzido por “babilônios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Reproduz de modo natural e não arcaico a fórmula narrativa hebraica que introduz o acontecimento.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: no sétimo mês
  rationale: Tradução direta da expressão temporal, sem especificar um mês que o hebraico não nomeia.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: de linhagem real
  rationale: Comunica com clareza a descendência dinástica indicada literalmente pela expressão 'da semente da realeza', evitando uma formulação artificial em português.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: veio com dez homens
  rationale: Integra o acompanhamento ao verbo de movimento de maneira idiomática em português.
- source_word: וַיַּכּוּ
  choice: feriram
  rationale: Preserva o sentido básico de נכה como golpear ou ferir, sem fundi-lo com a declaração seguinte de que Gedalias morreu.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Mantém separadamente a forma verbal singular e a sequência narrativa hebraica, cujo referente mais natural é Gedalias.
- source_word: הַיְּהוּדִים
  choice: os judeus
  rationale: É a designação corrente e amplamente compreensível em português para os habitantes ou naturais de Judá neste contexto.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Conserva o etnônimo específico do texto hebraico; no contexto, ele designa representantes do poder babilônico.
- source_word: בַּמִּצְפָּה
  choice: em Mispá
  rationale: Forma locativa natural em português para a cidade mencionada.
theological_decisions: []
