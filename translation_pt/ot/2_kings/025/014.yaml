base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: pt
  text: Levaram as panelas, as pás, os aparadores de pavio[a], as tigelas e todos os utensílios de bronze com os quais se prestava serviço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “facas” ou “podadeiras”. O termo hebraico pode indicar um instrumento cortante, mas, neste contexto de utensílios do templo, costuma ser entendido como um instrumento para aparar os pavios das lâmpadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: as panelas
  rationale: סִירוֹת designa panelas ou recipientes; “panelas” é claro, natural e adequado a este inventário do templo.
- source_word: הַיָּעִים
  choice: as pás
  rationale: יָעִים refere-se a instrumentos usados para retirar cinzas ou manejar brasas; “pás” preserva o sentido sem especificação excessiva.
- source_word: הַמְזַמְּרוֹת
  choice: as tesouras de pavio
  rationale: Embora o termo possa designar instrumentos cortantes, no contexto dos utensílios do templo é tradicionalmente entendido como instrumento para aparar os pavios das lâmpadas.
- source_word: הַכַּפּוֹת
  choice: as tigelas
  rationale: כַּפּוֹת pode indicar pequenos recipientes, conchas ou vasilhas. “Tigelas” é uma tradução ampla e inteligível neste contexto.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: todos os utensílios de bronze
  rationale: כְּלִים é um termo abrangente para objetos ou implementos; “utensílios” soa natural num inventário. Aqui נְחֹשֶׁת é adequadamente traduzido por “bronze”.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: usados no serviço do templo
  rationale: A construção relativa literalmente se refere aos objetos com os quais se prestava serviço. A formulação explicita de modo natural o contexto cultual, já estabelecido pela passagem, sem introduzir um agente indefinido pouco claro.
- source_word: לָקָחוּ
  choice: Levaram
  rationale: No contexto do saque e da remoção dos utensílios, “levaram” comunica naturalmente tanto o ato de tomar como o de retirar.
