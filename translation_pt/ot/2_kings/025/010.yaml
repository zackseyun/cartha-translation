  text: וְ/אֶת חוֹמֹ֥ת יְרוּשָׁלִַ֖ם סָבִ֑יב נָֽתְצוּ֙ כָּל חֵ֣יל כַּשְׂדִּ֔ים אֲשֶׁ֖ר רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/010.yaml
  text: And all the army of the Chaldeans who were with the captain of the guard tore down the walls of Jerusalem all around[a].
translation:
  language: pt
  text: E todo o exército dos caldeus que estava com o comandante da guarda derrubou as muralhas ao redor de Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe dos executores” ou “comandante da guarda pessoal”; traduções possíveis do título hebraico rab-tabbaḥim.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹת
  choice: muralhas
  rationale: O plural de חוֹמָה designa as fortificações muradas da cidade; “muralhas” é natural e preciso em português.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma consagrada do nome da cidade em português.
- source_word: סָבִיב
  choice: ao redor de
  rationale: Expressa a extensão circundante das muralhas sem sugerir necessariamente que cada trecho foi destruído.
- source_word: נָתְצוּ
  choice: derrubou
  rationale: נתץ indica derrubar ou demolir uma estrutura; o singular concorda naturalmente com o coletivo “exército” em português.
- source_word: כָּל חֵיל כַּשְׂדִּים
  choice: todo o exército dos caldeus
  rationale: Mantém o quantificador e o sentido militar coletivo de חֵיל, preservando o etnônimo específico “caldeus”.
- source_word: אֲשֶׁר רַב טַבָּחִים
  choice: que estava com o comandante da guarda
  rationale: A construção hebraica é elíptica; o contexto fornece a associação com o oficial citado no versículo anterior. “Estava com” mantém essa relação sem especificar excessivamente a cadeia de comando.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: É uma tradução funcional e idiomática do título cortesão-militar, enquanto as possibilidades mais literais são preservadas em nota.
