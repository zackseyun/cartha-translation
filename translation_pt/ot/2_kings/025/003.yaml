base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: pt
  text: No nono dia do mês, a fome se agravou na cidade, e não havia pão[a] para o povo da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não havia alimento”, pois “pão” também pode ser usado em sentido mais amplo para se referir ao sustento.
    reason: lexical_alternative
  - marker: b
    text: Em alguns contextos, “povo da terra” pode se referir mais especificamente ao povo comum ou à população local.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: No dia nove do mês
  rationale: O hebraico diz literalmente “no nono do mês”; “dia” é explicitado para produzir uma expressão temporal clara e natural em português.
- source_word: וַיֶּחֱזַק
  choice: se agravou
  rationale: O verbo חזק tem o sentido básico de tornar-se forte. Tendo “a fome” como sujeito, “se agravou” comunica de modo idiomático que ela se tornou mais intensa.
- source_word: הָרָעָב
  choice: a fome
  rationale: Neste contexto de cerco, רָעָב descreve a falta generalizada de alimento. Em português, “a fome” é natural e pode designar essa calamidade coletiva.
- source_word: בָּעִיר
  choice: na cidade
  rationale: Tradução locativa direta, natural e sem especificar além do texto hebraico.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: e não havia pão
  rationale: Mantém o termo concreto לֶחֶם, “pão”, embora ele também possa funcionar de modo mais amplo como referência a alimento ou sustento.
- source_word: לְעַם הָאָרֶץ
  choice: para o povo da terra
  rationale: Preserva a formulação hebraica e sua possível amplitude, sem restringi-la silenciosamente a uma classe social específica ou acrescentar “Judá” ao texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação conserva “pão” e “povo da terra” no texto principal, usando notas para registrar as alternativas lexicais sem eliminar a ambiguidade do hebraico.
