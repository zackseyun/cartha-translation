  text: וַ/יָּקֻ֨מוּ כָל הָ/עָ֜ם מִ/קָּטֹ֤ן וְ/עַד גָּדוֹל֙ וְ/שָׂרֵ֣י הַ/חֲיָלִ֔ים וַ/יָּבֹ֖אוּ מִצְרָ֑יִם כִּ֥י יָרְא֖וּ מִ/פְּנֵ֥י כַשְׂדִּֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: pt
  text: Então todo o povo, do menor ao maior, e os comandantes das tropas[a] se levantaram e foram para o Egito, pois tinham medo dos caldeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os oficiais do exército”; ou: “os capitães das tropas”.'
    reason: Alternativas lexicais para וְשָׂרֵי הַחֲיָלִים, cuja expressão identifica líderes militares sem especificar com precisão uma patente moderna.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levantaram
  rationale: O qal narrativo de קום assinala uma ação decidida. A expressão preserva a sequência do hebraico sem reduzir o verbo apenas ao ato físico de ficar em pé.
- source_word: כָל הָעָם
  choice: todo o povo
  rationale: Reproduz de modo natural a expressão coletiva e abrangente do hebraico.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: do menor ao maior
  rationale: Mantém o idiomatismo de totalidade, provavelmente relacionado a posição ou importância, sem restringi-lo indevidamente à idade.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: e os comandantes das tropas
  rationale: שָׂרֵי designa chefes ou oficiais, e הַחֲיָלִים se refere aqui às forças militares. A formulação é clara e não impõe uma patente específica.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: e foram para o Egito
  rationale: Embora בוא possa significar literalmente vir, a perspectiva narrativa em português pede naturalmente foram para o Egito.
- source_word: כִּי
  choice: pois
  rationale: Introduz a causa da partida; pois mantém com clareza a relação explicativa no fluxo narrativo.
- source_word: יָרְאוּ
  choice: tinham medo
  rationale: Expressa de maneira corrente o sentido de temor de ירא e combina naturalmente com a locução causal.
- source_word: מִפְּנֵי כַשְׂדִּים
  choice: dos caldeus
  rationale: Com ירא, מִפְּנֵי indica aquilo diante do qual se sente medo. Dos caldeus é a construção portuguesa idiomática e preserva o etnônimo histórico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva a sequência dos dois verbos hebraicos (“se levantaram e foram”) e o idiomatismo abrangente “do menor ao maior”. O marcador da nota foi colocado junto à expressão a que a alternativa lexical efetivamente se refere.
