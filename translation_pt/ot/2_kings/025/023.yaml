  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: pt
  text: 'Quando todos os comandantes das tropas — eles e seus homens — ouviram que o rei da Babilônia havia nomeado Gedalias[a], foram até Gedalias, em Mispá: Ismael, filho de Netanias; Joanã, filho de Careá; Seraías, filho de Tanumete, o netofatita; e Jazanias, filho do maacatita — eles e seus homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “havia colocado Gedalias no comando”; o verbo hebraico pode indicar a nomeação de alguém para uma função de supervisão ou administração.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: comandantes das tropas
  rationale: שָׂרִים designa chefes ou oficiais, e חַיִל tem aqui sentido militar. A expressão comunica liderança militar sem especificar uma patente não indicada pelo hebraico.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: com seus homens
  rationale: A construção distingue os comandantes dos homens ligados a eles. No início da frase, “com seus homens” transmite isso em português natural; a retomada enfática no fim é preservada como “eles e seus homens”.
- source_word: הִפְקִיד
  choice: havia nomeado
  rationale: O verbo pode significar nomear, encarregar ou colocar sob responsabilidade. “Havia nomeado” é amplo e não acrescenta um cargo específico ausente do texto.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: até ele em Mispá
  rationale: Mispá indica o local onde Gedalias se encontrava. O pronome evita repetição pesada sem obscurecer o referente.
- source_word: הַנְּטֹפָתִי
  choice: o netofatita
  rationale: Preserva o gentílico geográfico ligado a Tanumete, de acordo com a forma tradicional e inteligível em português bíblico.
- source_word: הַמַּעֲכָתִי
  choice: o maacatita
  rationale: Mantém o gentílico substantivado do hebraico sem transformá-lo indevidamente em nome próprio.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן
  choice: 'foram ...: Ismael ...; Joanã ...; Seraías ...; e Jazanias'
  rationale: Os nomes estão em aposição aos comandantes. Os dois-pontos e os pontos e vírgulas tornam a longa enumeração clara em português.
- source_word: וְאַנְשֵׁיהֶם
  choice: eles e seus homens
  rationale: A expressão encerra e retoma enfaticamente a identificação dos comandantes e de seus grupos, repetição que foi preservada por ter função estrutural no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Foram usados nomes próprios e gentílicos em formas correntes na tradição bíblica em português. A sintaxe foi levemente reorganizada para clareza, mas a retomada enfática final do hebraico foi mantida.
