base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: pt
  text: No quinto mês, no sétimo dia do mês — no décimo nono ano do reinado de Nabucodonosor, rei da Babilônia —, Nebuzaradã, chefe da guarda[a] e servo do rei da Babilônia, chegou a Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “chefe dos matadores”; o título provavelmente designa o comandante da guarda real ou dos executores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: No quinto mês
  rationale: A expressão dá continuidade à narrativa e introduz a data. Em português, “No quinto mês” é natural e mantém formalmente a designação calendárica; a conjunção hebraica não precisa ser reproduzida por “E” para conservar seu valor narrativo.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: no sétimo dia do mês
  rationale: O substantivo “dia” está implícito na fórmula hebraica e é explicitado em português para clareza.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה
  choice: que correspondia ao décimo nono ano
  rationale: A formulação portuguesa transmite o caráter explicativo e parentético da oração hebraica sem sugerir que o mês inteiro seja idêntico ao ano de reinado.
- source_word: לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: do rei Nabucodonosor
  rationale: O לְ marca aqui a contagem segundo o reinado; “do rei” é a forma idiomática de indicar o ano régio em português.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta e convencional da cadeia construta, mantida nas duas ocorrências pertinentes.
- source_word: בָּא
  choice: chegou
  rationale: No contexto de deslocamento com destino expresso, “chegou a Jerusalém” é mais natural em português do que “veio a Jerusalém”, sem alterar o sentido básico de בוא.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradã
  rationale: Transliteração portuguesa corrente do nome próprio, com terminação ajustada à pronúncia e ortografia em português.
- source_word: רַב טַבָּחִים
  choice: chefe da guarda
  rationale: O título literalmente relacionado a “matadores” ou “executores” designa, no uso da corte, o comandante da guarda real. A tradução comunica a função provável, enquanto a nota preserva a forma literal e a alternativa contextual.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: servo do rei da Babilônia
  rationale: עֶבֶד pode designar servo, súdito ou oficial subordinado. “Servo” conserva a amplitude da relação de serviço sem especificar indevidamente escravidão nem substituir o termo por uma interpretação funcional.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe cronológica clara. Os travessões conservam o comentário parentético sobre o ano de reinado. “Servo” mantém a ambiguidade social e administrativa do hebraico, e a nota esclarece o sentido literal do título militar.
