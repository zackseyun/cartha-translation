  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחַ֣ר הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥גוּ אֹת֖/וֹ בְּ/עַרְב֣וֹת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: pt
  text: Mas o exército dos caldeus[a] perseguiu o rei e o alcançou nas planícies de Jericó[b]; e todo o seu exército se dispersou, afastando-se dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o exército dos babilônios». O hebraico diz «caldeus», termo usado neste contexto para as forças babilônicas.
    reason: lexical_alternative
  - marker: b
    text: Ou «nas estepes de Jericó».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: o exército dos caldeus
  rationale: חֵיל designa aqui uma força militar, e כַּשְׂדִּים é mais diretamente vertido por «caldeus», a designação empregada no texto hebraico para as forças babilônicas.
- source_word: וַיִּרְדְּפוּ אַחַר הַמֶּלֶךְ
  choice: perseguiu o rei
  rationale: Em português, «perseguir» já incorpora naturalmente a relação expressa por אַחַר; o singular concorda com o núcleo coletivo «exército».
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: o alcançou
  rationale: נשׂג indica alcançar alguém durante uma perseguição; «alcançou» é claro e idiomático em português atual.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: nas planícies de Jericó
  rationale: עֲרָבוֹת refere-se às terras planas ou estepes da região; «planícies» comunica o sentido de modo natural, sem tornar a geografia excessivamente específica.
- source_word: וְכָל חֵילוֹ נָפֹצוּ
  choice: e todo o seu exército se dispersou
  rationale: O plural hebraico trata a força militar coletivamente; em português, o singular «se dispersou» concorda naturalmente com «exército» e preserva a ideia de desagregação.
- source_word: מֵעָלָיו
  choice: para longe dele
  rationale: A expressão assinala que os soldados se separaram do rei; «para longe dele» explicita naturalmente em português o movimento de afastamento.
