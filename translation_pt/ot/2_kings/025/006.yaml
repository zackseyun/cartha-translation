base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: pt
  text: Então eles capturaram o rei e o levaram até o rei da Babilônia, em Ribla, e pronunciaram a sentença contra ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “falaram juízo com ele”, expressão idiomática que indica a pronúncia de uma sentença judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: capturaram
  rationale: No contexto, תפשׂ descreve a apreensão bem-sucedida do rei em fuga; “capturaram” é claro e natural.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém a forma definida do hebraico e a referência discursiva a Zedequias sem repetir seu nome.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: o levaram
  rationale: O valor causativo e direcional de עלה é expresso naturalmente em português por “levaram”; acrescentar “para cima” seria artificial neste contexto.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: até o rei da Babilônia
  rationale: Representa diretamente אֶל e deixa claro que o rei foi conduzido à presença do monarca babilônico, sem substituir a preposição por uma interpretação judicial.
- source_word: רִבְלָתָה
  choice: em Ribla
  rationale: Embora o ה direcional possa assinalar movimento rumo a Ribla, na estrutura da oração o topônimo identifica naturalmente o lugar onde estava o rei da Babilônia.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: pronunciaram a sentença contra ele
  rationale: Traduz o sentido judicial da expressão idiomática sem reproduzir literalmente a construção pouco natural “falaram juízo com ele”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” mantém a progressão narrativa; “ali” explicita de modo natural que a sentença foi pronunciada em Ribla, sem alterar o conteúdo.
