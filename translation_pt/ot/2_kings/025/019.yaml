  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: pt
  text: E da cidade ele levou um oficial[a] que estava encarregado dos homens de guerra, cinco homens daqueles que tinham acesso direto ao rei[b] e que foram encontrados na cidade, o escriba, comandante do exército, que convocava para o serviço militar o povo da terra[c], e sessenta homens do povo da terra que foram encontrados na cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eunuco”; o termo hebraico pode designar tanto um eunuco literal como um oficial régio.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “daqueles que viam o rosto do rei”, expressão hebraica referente a pessoas que tinham acesso direto ao rei, provavelmente cortesãos ou auxiliares reais.
    reason: cultural_note
  - marker: c
    text: Ou “alistava” ou “recrutava o povo da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: oficial
  rationale: O termo pode designar um eunuco literal ou um oficial régio. “Oficial” preserva a ambiguidade quanto à condição física e se ajusta à função administrativa e militar do contexto.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: encarregado dos homens de guerra
  rationale: פָקִיד indica alguém nomeado ou posto à frente de outros; a formulação mantém o registro militar sem soar excessivamente arcaica.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: daqueles que tinham acesso direto ao rei
  rationale: Expressa em português natural o sentido do idioma hebraico, referente a pessoas admitidas à presença do rei, sem determinar de modo excessivo seu cargo na corte.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: o escriba, comandante do exército
  rationale: Mantém visíveis os dois elementos da construção hebraica comprimida e sua relação apositiva possível.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: que convocava para o serviço militar o povo da terra
  rationale: O particípio hifil de צבא indica organizar ou chamar pessoas para serviço militar. A tradução explicita esse sentido sem afirmar necessariamente recrutamento forçado.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: A tradução formal conserva a possível nuance social da expressão, que pode designar a população do território e, em certos contextos, a população não pertencente à elite.
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  choice: foram encontrados
  rationale: Preserva a voz passiva e a ideia narrativa de que essas pessoas foram localizadas na cidade.
- source_word: לָקַח
  choice: levou
  rationale: No contexto da captura e remoção dessas pessoas, “levou” comunica naturalmente o efeito de לָקַח sem acrescentar a intensidade de “prendeu” ou “capturou”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem da enumeração hebraica foi preservada, enquanto o idioma sobre ver o rosto do rei foi traduzido pelo sentido e documentado em nota. “Povo da terra” permanece formal para conservar sua amplitude e possível nuance social.
