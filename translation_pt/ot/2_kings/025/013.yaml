source:
  edition: WLC
  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר בֵּית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: pt
  text: Os caldeus quebraram em pedaços as colunas de bronze que estavam na casa de Yahweh, os suportes[a] e o Mar de bronze que estava na casa de Yahweh; depois levaram o bronze desses objetos para a Babilônia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as bases”; eram as estruturas que sustentavam as bacias do templo.
    reason: lexical_alternative
  - marker: b
    text: Os “caldeus” eram, neste contexto, as forças babilônicas.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: as colunas de bronze
  rationale: עַמּוּדִים designa colunas ou pilares. “Colunas” é natural em português e adequado à arquitetura do templo; נְחֹשֶׁת é traduzido por “bronze”, a identificação moderna usual desse metal no contexto.
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: que estavam na casa de Yahweh
  rationale: A oração relativa hebraica não traz verbo expresso. O contexto favorece uma indicação de localização, explicitada naturalmente em português com “estavam na”.
- source_word: הַמְּכֹנוֹת
  choice: os suportes
  rationale: מְכֹנוֹת refere-se às estruturas que sustentavam as bacias do templo. “Suportes” comunica bem sua função sem acrescentar a ideia de mobilidade não expressa neste versículo; “bases” permanece uma alternativa possível.
- source_word: יָם הַנְּחֹשֶׁת
  choice: o Mar de bronze
  rationale: יָם significa literalmente “mar” e funciona como designação conhecida da grande bacia do templo. A forma conserva a imagem e o nome específico do objeto, em vez de substituí-los pela interpretação “bacia”.
- source_word: שִׁבְּרוּ
  choice: quebraram em pedaços
  rationale: Neste contexto, שׁבר descreve o desmonte de grandes objetos de bronze para transporte. “Quebraram em pedaços” expressa essa ação de modo claro.
- source_word: כַשְׂדִּים
  choice: os caldeus
  rationale: A tradução preserva o termo étnico-político específico do hebraico. No contexto, ele designa as forças babilônicas.
- source_word: וַיִּשְׂאוּ
  choice: depois levaram
  rationale: נשא aqui tem o sentido de carregar ou levar o metal, como despojo, até o destino indicado. “Levaram” é idiomático em português; “depois” marca com naturalidade a sequência narrativa do wayyiqtol.
- source_word: נְחֻשְׁתָּם
  choice: o bronze desses objetos
  rationale: O sufixo masculino plural retoma coletivamente os objetos de bronze mencionados. A formulação evita a possível estranheza ou ambiguidade de “seu bronze” em português.
- source_word: בָּבֶלָה
  choice: para a Babilônia
  rationale: A terminação direcional indica movimento rumo à Babilônia. Em português, o nome da região/cidade bíblica é normalmente usado com artigo nesta construção.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e é uma transliteração acadêmica amplamente reconhecida, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação hebraica foi ajustada com ponto e vírgula e “depois” para tornar a sequência natural. “Casa de Yahweh” preserva a expressão do original; “Mar” recebe inicial maiúscula por funcionar como nome do grande reservatório do templo.
