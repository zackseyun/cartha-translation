base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/012.yaml
  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: pt
  text: Mas o comandante da guarda[b] deixou alguns dos mais pobres da terra para trabalhar nas vinhas e nos campos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para cuidar das vinhas e lavrar a terra”. O termo hebraico traduzido por “trabalhar nos campos” é raro e provavelmente se refere, de modo geral, ao trabalho agrícola no solo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “chefe dos matadores”. Neste contexto, trata-se do título do oficial babilônico que comandava a guarda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלַּת הָאָרֶץ
  choice: alguns dos mais pobres da terra
  rationale: A preposição מִן tem sentido partitivo, e דַּלַּת designa a camada pobre ou humilde da população. “Alguns dos mais pobres” explicita naturalmente em português o objeto implícito de “deixou” e preserva a força contextual da expressão.
- source_word: הִשְׁאִיר
  choice: deixou
  rationale: O hifil de שׁאר significa fazer restar ou deixar para trás. “Deixou” é conciso e adequado ao contraste com as deportações anteriores.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: Embora o título tenha relação literal com “chefe dos matadores”, no contexto da corte e do exército babilônicos ele designa o oficial responsável pela guarda.
- source_word: לְכֹרְמִים
  choice: para trabalhar nas vinhas
  rationale: O termo designa pessoas que cultivam ou cuidam de vinhas. A construção verbal é mais corrente e imediatamente compreensível do que um substantivo ocupacional raro.
- source_word: וּלְיֹגְבִים
  choice: e nos campos
  rationale: O termo agrícola raro provavelmente se refere a trabalhadores do solo. Em coordenação com “trabalhar nas vinhas”, “e nos campos” produz uma frase natural sem restringir indevidamente a atividade a arar ou lavrar.
