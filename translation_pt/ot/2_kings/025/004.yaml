base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: pt
  text: Então foi aberta uma brecha na cidade, e todos os homens de guerra fugiram durante a noite pelo portão entre as duas muralhas, junto ao jardim do rei, embora os caldeus[a] estivessem ao redor da cidade por todos os lados. E o rei[b] seguiu pelo caminho da Arabá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os babilônios”. O hebraico diz especificamente “os caldeus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ele”. No hebraico, o sujeito não é expresso; o contexto indica o rei.
    reason: lexical_alternative
  - marker: c
    text: A Arabá é a região da depressão do Jordão que se estende para o sul a partir do vale do Jordão; tradicionalmente, o termo também é traduzido como “planície”.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: a cidade foi invadida por uma brecha
  rationale: O nifal de בקע descreve a abertura forçada das defesas no contexto do cerco. A formulação portuguesa expressa de modo natural que a cidade foi penetrada por uma brecha, sem sugerir que toda a cidade literalmente se partiu.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  rationale: Preserva a expressão masculina e militar do hebraico, mantendo linguagem clara e digna.
- source_word: הַלַּיְלָה
  choice: durante a noite
  rationale: Representa o uso adverbial com fluência narrativa em português.
- source_word: דֶּרֶךְ שַׁעַר
  choice: pelo caminho do portão
  rationale: Conserva a ênfase hebraica na rota, em vez de reduzir a expressão simplesmente a 'pelo portão'.
- source_word: בֵּין הַחֹמֹתַיִם
  choice: entre as duas muralhas
  rationale: O dual hebraico indica explicitamente duas muralhas.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: junto ao jardim do rei
  rationale: Aqui עַל indica proximidade; 'junto a' é natural e topograficamente apropriado.
- source_word: וְכַשְׂדִּים
  choice: os caldeus
  rationale: Mantém o termo étnico-político específico do texto hebraico, em vez de substituí-lo no corpo do versículo por 'babilônios'.
- source_word: עַל הָעִיר סָבִיב
  choice: ao redor da cidade por todos os lados
  rationale: Comunica enfaticamente o cerco completo expresso por סָבִיב.
- source_word: וַיֵּלֶךְ
  choice: o rei seguiu
  rationale: O sujeito está implícito no hebraico. O contexto identifica o rei; torná-lo explícito evita ambiguidade em português, enquanto a nota registra a forma literal.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: pelo caminho da Arabá
  rationale: Retém Arabá como nome geográfico e preserva a repetição de דֶּרֶךְ, importante para a descrição da rota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A tradução preserva o termo histórico 'caldeus', o dual 'duas muralhas', a repetição da linguagem de rota e a referência geográfica Arabá. Os marcadores foram posicionados junto às expressões que explicam.
