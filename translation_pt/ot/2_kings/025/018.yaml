base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: pt
  text: O comandante da guarda levou Seraías, o sacerdote principal[a], Sofonias, o segundo sacerdote[b], e os três guardas da entrada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sumo sacerdote”. O hebraico diz literalmente “o sacerdote, o principal”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sacerdote adjunto” ou “sacerdote de segunda posição”.
    reason: lexical_alternative
  - marker: c
    text: Ou “porteiros” ou “guardas do limiar”. O hebraico diz literalmente “guardas do limiar”, provavelmente referindo-se à entrada do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: o comandante da guarda
  rationale: O título designa o oficial babilônico encarregado da guarda real. A tradução idiomática evita o literalismo inadequado de “chefe dos matadores” e comunica claramente sua função militar.
- source_word: וַיִּקַּח
  choice: levou
  rationale: לקח significa normalmente “tomar” ou “levar”. No contexto, trata-se da detenção e remoção dos oficiais; “levou” preserva a formulação sóbria do hebraico sem explicitar além do texto a força envolvida.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: o sacerdote principal
  rationale: A expressão significa literalmente “o sacerdote, o cabeça/principal” e identifica o sacerdote de maior posição. “Sacerdote principal” reflete de perto a estrutura hebraica sem impor como única leitura o título técnico “sumo sacerdote”.
- source_word: כֹּהֵן מִשְׁנֶה
  choice: o segundo sacerdote
  rationale: מִשְׁנֶה indica segunda posição ou condição de substituto. “Segundo sacerdote” conserva essa concisão e a possível ambiguidade entre posto e função de auxiliar.
- source_word: שֹׁמְרֵי הַסַּף
  choice: guardas da entrada
  rationale: Literalmente, são os “guardas do limiar”. No contexto do templo, “guardas da entrada” comunica naturalmente a função provável, enquanto a imagem literal e a alternativa “porteiros” ficam registradas em nota.
- source_word: שְׁלֹשֶׁת
  choice: os três
  rationale: A forma construta diante de uma expressão definida refere-se aos três membros desse grupo conhecido; o artigo é natural e necessário em português.
- source_word: שְׂרָיָה
  choice: Seraías
  rationale: Forma tradicional e inteligível em português para o nome hebraico.
- source_word: צְפַנְיָהוּ
  choice: Sofonias
  rationale: Forma tradicional em português para o nome hebraico, reconhecível aos leitores modernos.
theological_decisions:
- issue: Título de Seraías
  choice: sacerdote principal
  alternative: sumo sacerdote
  rationale: O hebraico descreve literalmente o sacerdote que era “o principal”. Embora “sumo sacerdote” seja historicamente plausível, a redação escolhida preserva mais diretamente a forma e a amplitude semântica da expressão de origem.
- issue: Posição de Sofonias
  choice: segundo sacerdote
  alternative: sacerdote adjunto
  rationale: A tradução mantém aberta a questão de מִשְׁנֶה designar estritamente o segundo posto ou uma função de substituto/auxiliar.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a concisão narrativa do hebraico e registra em notas as alternativas lexicais relevantes.
