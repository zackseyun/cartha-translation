  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: pt
  text: Falou-lhe com bondade[a] e colocou o trono dele[b] acima do trono dos reis que estavam com ele na Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Falou-lhe coisas boas”, expressão idiomática que significa dirigir-se a ele de modo favorável ou bondoso.'
    reason: lexical_alternative
  - marker: b
    text: “Trono” também pode ser entendido concretamente como “assento”; o sentido é que Joaquim recebeu uma posição superior à dos outros reis na Babilônia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: Falou com ele bondosamente
  rationale: A expressão hebraica literalmente fala em dizer “coisas boas”, mas funciona aqui como idioma para dirigir-se a alguém de modo bondoso ou favorável. A formulação portuguesa conserva esse sentido com naturalidade.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: colocou o trono dele
  rationale: Neste contexto, נתן indica atribuir ou estabelecer uma posição, não presentear alguém com um objeto. “Colocou” comunica o posicionamento do assento e da dignidade real.
- source_word: כִּסְאוֹ
  choice: o trono dele
  rationale: כִּסֵּא pode designar tanto um assento quanto um trono. “Trono” preserva a imagem concreta e a dignidade régia de Joaquim.
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: acima do trono dos reis
  rationale: A tradução mantém o singular da construção hebraica e expressa precedência de posição ou categoria. Em português, a expressão pode referir-se coletivamente à posição ocupada pelos demais reis.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: os reis que estavam com ele
  rationale: Reprodução direta da oração relativa hebraica, sem resolver além do texto a referência do pronome.
- source_word: בְּבָבֶל
  choice: na Babilônia
  rationale: Tradução locativa corrente do nome do lugar.
