base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: pt
  text: Quanto ao povo que restara na terra de Judá[a], que Nabucodonosor, rei da Babilônia, havia deixado ali, ele nomeou Gedalias, filho de Aicão, filho de Safã, para ficar à frente do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que havia sido deixado”; o particípio hebraico pode indicar tanto quem restara como quem fora deixado, referindo-se à população que continuou em Judá depois das deportações.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעָם
  choice: Quanto ao povo
  rationale: A conjunção introduz uma mudança de tópico, e esta formulação é natural em português sem perder a conexão narrativa.
- source_word: הַנִּשְׁאָר
  choice: que permanecera
  rationale: O particípio nifal de שׁאר descreve os que continuaram na terra após as deportações; evita transformar a expressão descritiva no termo teologicamente carregado “remanescente”.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: na terra de Judá
  rationale: Preserva o sentido territorial de אֶרֶץ e a formulação geográfica tradicional.
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: aquele que ... havia deixado ali
  rationale: O hifil de שׁאר indica que Nabucodonosor deixou essa população no lugar; “ali” explicita naturalmente em português o local já mencionado, sem acrescentar conteúdo novo.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nabucodonosor, rei da Babilônia
  rationale: Emprega as formas portuguesas usuais do nome e do título, mantendo a aposição do hebraico.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: ele pôs sobre eles
  rationale: Mantém a imagem administrativa e a construção com עַל; no contexto, significa colocar Gedalias em posição de autoridade.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: Gedalias, filho de Aicão, filho de Safã
  rationale: Usa formas portuguesas reconhecíveis e preserva integralmente a cadeia patronímica.
