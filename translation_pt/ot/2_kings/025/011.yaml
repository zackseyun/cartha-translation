id: 2KI.25.11
reference: 2 Kings 25:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: pt
  text: Nebuzaradã, comandante da guarda[a], levou para o exílio o restante do povo que havia ficado na cidade, os desertores que tinham passado para o lado do rei da Babilônia[b] e o restante da multidão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “chefe dos matadores”; provavelmente um título oficial para o comandante da guarda real.
    reason: cultural_note
  - marker: b
    text: Ou “os que tinham passado para o rei da Babilônia”; literalmente, “os que tinham caído para o rei da Babilônia”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o restante do povo reunido” ou “o restante da população”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: o restante do povo
  rationale: Expressa de modo natural as pessoas que restaram depois da morte e das deportações anteriores.
- source_word: הַנִּשְׁאָרִים בָּעִיר
  choice: que havia ficado na cidade
  rationale: O particípio nifal de שׁאר designa os que ainda permaneciam em Jerusalém; o mais-que-perfeito situa essa permanência antes da deportação narrada.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל הַמֶּלֶךְ בָּבֶל
  choice: os desertores que tinham passado para o lado do rei da Babilônia
  rationale: Neste contexto político-militar, נפל על é uma expressão idiomática para passar ao lado ou submeter-se a outro governante, não uma queda literal. “Desertores” comunica concisamente a situação, enquanto a nota preserva a forma hebraica.
- source_word: יֶתֶר הֶהָמוֹן
  choice: o restante da multidão
  rationale: הָמוֹן indica uma massa ou grande conjunto de pessoas; “multidão” mantém o sentido coletivo amplo sem defini-lo especificamente como toda a população.
- source_word: הֶגְלָה
  choice: levou para o exílio
  rationale: O hifil de גלה descreve deportação forçada; a formulação é clara e digna em português corrente.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradã
  rationale: Forma portuguesa tradicional e legível do nome próprio.
- source_word: רַב טַבָּחִים
  choice: comandante da guarda
  rationale: Trata-se de um título oficial babilônico. A tradução funcional evita a impressão enganosa de que a expressão literal descreve apenas um ofício de abate.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase foi ajustada para apresentar o sujeito antes dos objetos, sem alterar as relações sintáticas. As notas preservam tanto o sentido literal da expressão de deserção quanto a incerteza lexical de הָמוֹן e a forma literal do título babilônico.
