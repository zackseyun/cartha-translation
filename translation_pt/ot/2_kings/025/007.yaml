  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: pt
  text: Mataram os filhos de Zedequias diante dos olhos de Zedequias, e ele vazou os olhos de Zedequias[a], prendeu-o com grilhões de bronze e o levou para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cegou Zedequias”. O verbo hebraico significa “cegou”; neste contexto, a menção aos olhos provavelmente se refere ao ato físico de vazá-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: Degolaram
  rationale: O verbo descreve matar por corte e conserva a brutalidade da cena melhor que o termo genérico “mataram”.
- source_word: לְעֵינָיו
  choice: diante dos seus olhos
  rationale: Reproduz de modo natural e vívido o idioma hebraico, indicando que Zedequias presenciou diretamente a morte dos filhos.
- source_word: עִוֵּר
  choice: furou os olhos
  rationale: No contexto violento e com “os olhos de Zedequias” como objeto, esta formulação comunica naturalmente o ato físico pelo qual ele foi cegado, sem tornar a linguagem excessivamente arcaica.
- source_word: וַיַּאַסְרֵהוּ
  choice: prendeu-o
  rationale: O verbo significa prender ou amarrar; com a expressão instrumental seguinte, “prendeu-o” é claro e idiomático.
- source_word: בַנְחֻשְׁתַּיִם
  choice: com grilhões de bronze
  rationale: A forma designa restrições metálicas, provavelmente um par; “grilhões de bronze” é preciso, compreensível e mantém o tom digno.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: o levou para a Babilônia
  rationale: Em português narrativo, “levou” exprime naturalmente o movimento do agente com o prisioneiro até a Babilônia.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: os filhos de Zedequias
  rationale: É a construção possessiva mais natural em português e preserva integralmente o sentido.
