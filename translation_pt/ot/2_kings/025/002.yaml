  text: So the city remained under siege until the eleventh year of King Zedekiah[a].
translation:
  language: pt
  text: Assim, a cidade ficou sitiada até o décimo primeiro ano do rei Zedequias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a cidade entrou no cerco”, expressão hebraica que indica que ela estava sitiada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: ficou
  rationale: Embora בוא signifique literalmente “vir” ou “entrar”, nesta construção com מָצוֹר expressa o estado resultante e contínuo da cidade; “ficou sitiada” comunica isso naturalmente em português.
- source_word: הָעִיר
  choice: a cidade
  rationale: Equivalente direto de עִיר com o artigo definido.
- source_word: בַּמָּצוֹר
  choice: sitiada
  rationale: מָצוֹר denota cerco ou estado de cerco. Em combinação com בוא, o português idiomático favorece “ficou sitiada”.
- source_word: עַד
  choice: até
  rationale: Marca o limite temporal do estado de cerco.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: o décimo primeiro ano
  rationale: A expressão cardinal hebraica funciona como datação régia e é naturalmente vertida com ordinal em português.
- source_word: לַמֶּלֶךְ
  choice: do rei
  rationale: Nesta fórmula cronológica, ל indica o ano pertencente ao reinado do monarca; “do rei” é a forma idiomática em português.
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
