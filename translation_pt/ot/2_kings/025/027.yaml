  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: pt
  text: No trigésimo sétimo ano do exílio de Joaquim, rei de Judá, no décimo segundo mês, no vigésimo sétimo dia do mês, aconteceu que Evil-Merodaque, rei da Babilônia[a], no ano de seu reinado[b], favoreceu Joaquim, rei de Judá, e o tirou da prisão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Evil-Merodaque também é conhecido historicamente como Amel-Marduque.
    reason: cultural_note
  - marker: b
    text: “No ano de seu reinado” pode significar “no primeiro ano de seu reinado”.
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “levantou a cabeça de Joaquim para fora da prisão”, expressão que indica que o rei elevou a condição de Joaquim ou lhe concedeu favor, começando por libertá-lo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: aconteceu que
  rationale: Introduz um novo episódio narrativo de modo natural em português moderno, sem recorrer à fórmula arcaica “sucedeu que”.
- source_word: לְגָלוּת
  choice: do exílio
  rationale: גָּלוּת designa o exílio ou estado resultante da deportação; “exílio” é claro e corrente.
- source_word: יְהוֹיָכִין
  choice: Joaquim
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do rei de Judá conhecido em inglês como Jehoiachin.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: no décimo segundo mês
  rationale: Forma idiomática portuguesa para a data hebraica.
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: no vigésimo sétimo dia do mês
  rationale: Explicita “dia”, subentendido na expressão hebraica, para maior clareza.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Evil-Merodaque
  rationale: Mantém a forma bíblica tradicional do nome em português; a forma histórica acadiana é indicada em nota.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: no ano de seu reinado
  rationale: Preserva a formulação não especificada do hebraico, sem inserir “primeiro” no texto principal.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: favoreceu
  rationale: Traduz em português natural o sentido contextual da expressão idiomática “levantou a cabeça”, que indica elevação de condição ou concessão de favor.
- source_word: מִבֵּית כֶּלֶא
  choice: e o tirou da prisão
  rationale: Expressa claramente a saída do lugar de confinamento implicada pelo hebraico, em ligação com o favor concedido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe cronológica próxima do hebraico. A expressão idiomática hebraica foi vertida por seu sentido contextual no texto principal e preservada literalmente em nota. A ambiguidade de בִּשְׁנַת מָלְכוֹ foi mantida, sem transformar a provável referência ao primeiro ano em afirmação categórica.
