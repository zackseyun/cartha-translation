base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: pt
  text: O rei da Babilônia os feriu e os matou em Ribla, na terra de Hamate.[a] Assim, Judá foi deportado de sua terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os golpeou e os fez morrer”. O hebraico emprega dois verbos em sequência: “feriu” e “matou”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Judá partiu para o exílio, deixando sua terra”. No contexto, o verbo hebraico pode ser traduzido com formulação ativa ou passiva; a passiva ressalta a deportação forçada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: os feriu
  rationale: Preserva o sentido básico de נכה, “ferir/golpear”, sem fundi-lo com o verbo seguinte, que declara explicitamente a morte.
- source_word: וַיְמִיתֵם
  choice: os matou
  rationale: O hifil de מות significa “fazer morrer”. “Os matou” comunica com clareza o resultado causativo sem acrescentar a ideia mais específica de uma execução formal.
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: Tradução direta e natural da construção hebraica.
- source_word: בְּרִבְלָה
  choice: em Ribla
  rationale: Forma idiomática em português para indicar o lugar onde ocorreu a ação.
- source_word: בְּאֶרֶץ חֲמָת
  choice: na terra de Hamate
  rationale: Mantém de modo claro e formal a expressão geográfica hebraica.
- source_word: וַיִּגֶל
  choice: foi levado para o exílio
  rationale: No contexto, גלה descreve deportação. A formulação passiva evidencia que a remoção foi imposta, embora o hebraico também permita uma tradução formalmente ativa.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Conserva a concisão e a metonímia do hebraico, que pode designar o reino ou seu povo.
- source_word: מֵעַל אַדְמָתוֹ
  choice: para longe de sua terra
  rationale: Expressa naturalmente a separação indicada por מֵעַל e traduz אדמה como “terra”, adequado ao contexto nacional e exílico.
