base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: pt
  text: Ele incendiou a casa de Yahweh[a], a casa do rei e todas as casas de Jerusalém; e queimou com fogo toda casa grande[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “o templo de Yahweh”. Em hebraico: “a casa de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “toda casa ampla” ou “toda casa importante”. A expressão hebraica pode indicar casas notáveis pelo tamanho ou pela proeminência.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Ele incendiou
  rationale: O wayyiqtol de שׂרף dá sequência à narrativa. “Incendiou” expressa de modo natural em português a ação de queimar deliberadamente com fogo.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a expressão hebraica literal “casa de Yahweh” e o paralelismo com “casa do rei”; “templo de Yahweh” é uma explicitação contextual registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֵּית הַמֶּלֶךְ
  choice: a casa do rei
  rationale: Reproduz diretamente a construção hebraica e preserva o paralelismo com “a casa de Yahweh”; “palácio real” seria uma explicitação contextual.
- source_word: כָּל בָּתֵּי יְרוּשָׁלַםִ
  choice: todas as casas de Jerusalém
  rationale: Tradução direta da expressão construta, natural e clara em português.
- source_word: כָּל בֵּית גָּדוֹל
  choice: toda casa grande
  rationale: O singular depois de כָּל tem sentido distributivo. “Grande” preserva a ambiguidade de גָּדוֹל, que pode indicar tamanho ou importância.
- source_word: שָׂרַף בָּאֵשׁ
  choice: incendiou
  rationale: O verbo português incorpora naturalmente a ideia expressa por “queimou com fogo”, evitando uma redundância pouco idiomática sem perder o sentido da ação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio e não o substitui por um título, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação conserva a repetição de “casa” e a ambiguidade de “grande”, enquanto “incendiou” comunica de modo idiomático a ação deliberada de queimar com fogo.
