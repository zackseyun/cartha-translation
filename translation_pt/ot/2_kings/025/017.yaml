  text: שְׁמֹנֶה֩ עֶשְׂרֵ֨ה אַמָּ֜ה קוֹמַ֣ת הָ/עַמּ֣וּד הָ/אֶחָ֗ד וְ/כֹתֶ֨רֶת עָלָ֥י/ו נְחֹשֶׁת֮ וְ/קוֹמַ֣ת הַ/כֹּתֶרֶת֮ שָׁלֹ֣שׁ אמה וּ/שְׂבָכָ֨ה וְ/רִמֹּנִ֧ים עַֽל הַ/כֹּתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י עַל הַ/שְּׂבָכָֽה׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: pt
  text: A altura de uma das colunas era de dezoito côvados, e sobre ela havia um capitel de bronze. O capitel tinha três côvados de altura. Ao redor do capitel havia uma treliça[a] e romãs, tudo de bronze. A segunda coluna tinha elementos iguais[b], incluindo a treliça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rede ornamental”; o termo hebraico שְׂבָכָה designa uma estrutura decorativa semelhante a uma rede no capitel.
    reason: lexical_alternative
  - marker: b
    text: 'A frase final é elíptica em hebraico; literalmente: “e coisas como estas para a segunda coluna, sobre a treliça”. O sentido parece ser que a segunda coluna tinha ornamentação correspondente.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  choice: altura
  rationale: O substantivo em estado construto indica a altura ou medida vertical do elemento arquitetônico; “altura” é natural e exato em português.
- source_word: עַמּוּד
  choice: coluna
  rationale: No contexto da arquitetura do templo, o termo designa uma coluna monumental. “Coluna” é o termo arquitetônico corrente em português.
- source_word: כֹתֶרֶת
  choice: capitel
  rationale: Refere-se à peça ornamental situada no topo de uma coluna; “capitel” é o termo arquitetônico preciso.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Em descrições bíblicas de objetos do templo, o termo costuma designar bronze ou liga de cobre; “bronze” é a tradução convencional e historicamente adequada.
- source_word: שְׂבָכָה
  choice: treliça
  rationale: Designa uma estrutura ornamental semelhante a uma rede. “Treliça” comunica de modo claro essa forma vazada em português moderno.
- source_word: רִמֹּנִים
  choice: romãs
  rationale: O termo significa literalmente “romãs” e, neste contexto, descreve ornamentos em forma dessa fruta.
- source_word: סָבִיב
  choice: ao redor
  rationale: Expressa a disposição circular dos ornamentos em torno do capitel.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: tudo de bronze
  rationale: Resume de maneira concisa e natural o material dos elementos ornamentais mencionados.
- source_word: וְכָאֵלֶּה
  choice: tinha elementos iguais
  rationale: A expressão remete às características já descritas. A formulação explicita com moderação a elipse hebraica sem acrescentar novos elementos.
- source_word: עַל הַשְּׂבָכָה
  choice: incluindo a treliça
  rationale: A cláusula final é elíptica. Esta formulação indica naturalmente que a correspondência entre as colunas abrangia também a treliça, preservando a referência do hebraico.
