  rationale: A revisão evita uma inferência excessiva de impossibilidade em «não havia como pesar», conserva a explicação contextual em nota e torna a designação técnica «Mar» mais idiomática em português. Também emprega «utensílios» como equivalente contextual mais preciso para כֵּלִים.
