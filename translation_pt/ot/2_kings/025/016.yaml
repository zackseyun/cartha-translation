  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם הָֽ/אֶחָד֙ וְ/הַ/מְּכֹנ֔וֹת אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֹ֖שֶׁת כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: pt
  text: Quanto às duas colunas, ao Mar e aos suportes que Salomão havia feito para a casa de Yahweh, não se pesou o bronze de todos esses utensílios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não havia peso para o bronze de todos esses utensílios”; isto é, devido à enorme quantidade, o bronze não foi pesado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: as duas colunas
  rationale: עַמּוּדִים designa as colunas estruturais do templo; “colunas” é natural e imediatamente compreensível em português.
- source_word: הַיָּם הָאֶחָד
  choice: o único Mar
  rationale: יָם é aqui o nome técnico da grande bacia de bronze do templo; a inicial maiúscula preserva seu caráter de objeto denominado, e “único” expressa o numeral contrastado com as duas colunas.
- source_word: וְהַמְּכֹנוֹת
  choice: os suportes
  rationale: מְכֹנוֹת refere-se às estruturas ou bases que sustentavam as bacias; “suportes” é concreto e corrente.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: que Salomão havia feito
  rationale: O mais-que-perfeito composto exprime naturalmente a ação anterior ao momento narrado.
- source_word: לְבֵית יְהוָה
  choice: para a casa de Yahweh
  rationale: Preserva a expressão hebraica “casa” e translitera o nome divino explícito יְהוָה.
- source_word: לֹא הָיָה מִשְׁקָל
  choice: não havia como pesar
  rationale: A formulação portuguesa comunica idiomaticamente que a enorme quantidade de bronze inviabilizava sua pesagem, sem afirmar que seu peso fosse intrinsecamente impossível de determinar.
- source_word: לִנְחֹשֶׁת
  choice: o bronze
  rationale: “Bronze” é o termo convencional e contextual para נְחֹשֶׁת nos utensílios do templo.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: todos esses objetos
  rationale: כֵּלִים é um termo amplo; “objetos” abrange adequadamente colunas, o Mar e suportes, enquanto “vasos” seria estreito demais neste contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido da ausência de מִשְׁקָל
  choice: a grande quantidade tornava a pesagem impraticável
  alternative: o bronze não possuía peso; seu peso não podia ser conhecido em princípio
  rationale: A expressão é uma hipérbole contextual sobre a quantidade do bronze, não uma declaração metafísica nem necessariamente uma afirmação de incognoscibilidade absoluta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. Mantém “casa de Yahweh” e o nome técnico “Mar”, evitando linguagem excessivamente eclesiástica ou arcaica.
