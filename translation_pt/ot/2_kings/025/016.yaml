review_pass:
  verdict: revise
  source_fidelity: A enumeração dos objetos do templo, o nome Yahweh, o emprego técnico de «Mar» e «bronze» correspondem bem ao hebraico. Contudo, «não havia como pesar» transforma a expressão לֹא הָיָה מִשְׁקָל numa impossibilidade de pesagem mais forte do que o texto requer. No contexto, a formulação indica que o bronze não foi pesado em razão da quantidade.
  naturalness: «O único Mar» soa pouco idiomático em português, especialmente porque «Mar» já funciona como nome técnico do grande reservatório. «O Mar» é natural e mantém o referente. «Não se pesou o bronze» é claro, moderno e fiel ao sentido contextual.
  terminology: «Colunas», «Mar», «suportes», «casa de Yahweh» e «bronze» são escolhas adequadas. «Utensílios» dá a כֵּלִים um equivalente mais concreto e apropriado ao contexto de objetos do templo do que «objetos», sem restringi-lo a vasos.
  issues:
  - severity: medium
    issue: «não havia como pesar» sugere impossibilidade de pesar
    rationale: O hebraico diz literalmente que não havia peso/pesagem para o bronze. A explicação contextual é que ele não foi pesado pela abundância, não que fosse impossível pesá-lo em princípio.
  - severity: low
    issue: «ao único Mar» é uma construção pouco natural
    rationale: Embora reflita o numeral hebraico, em português «o Mar» preserva o nome técnico do objeto e lê de modo mais fluente; sua singularidade já é evidente no referente.
  revised_text: Quanto às duas colunas, ao Mar e aos suportes que Salomão havia feito para a casa de Yahweh, não se pesou o bronze de todos esses utensílios.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: “não havia peso para o bronze de todos esses utensílios”; isto é, devido à enorme quantidade, o bronze não foi pesado.'
    reason: lexical_alternative
  revision_rationale: A revisão evita uma inferência excessiva de impossibilidade em «não havia como pesar», conserva a explicação contextual em nota e torna a designação técnica «Mar» mais idiomática em português. Também emprega «utensílios» como equivalente contextual mais preciso para כֵּלִים.
