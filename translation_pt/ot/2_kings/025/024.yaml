  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e no restante do mundo lusófono. A tradução conserva “caldeus” e “servos” no texto principal para refletir de perto o hebraico, deixando as identificações contextuais mais específicas em nota.
