base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: pt
  text: 'Gedalias prestou juramento a eles e aos seus homens[a] e lhes disse: “Não tenham medo dos servos dos caldeus[b]. Habitem nesta terra e sirvam ao rei da Babilônia, e tudo irá bem para vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus soldados” ou “aos seus seguidores”. O hebraico diz literalmente “aos seus homens”.
    reason: lexical_alternative
  - marker: b
    text: “Caldeus” é o termo hebraico e, neste contexto, pode referir-se aos babilônios. “Servos” também pode indicar agentes ou administradores caldeus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: prestou juramento
  rationale: O nifal de שׁבע significa “jurar” ou “prestar juramento”. Esta formulação expressa com naturalidade e dignidade a garantia solene dada por Gedalias.
- source_word: וּלְאַנְשֵׁיהֶם
  choice: e aos seus homens
  rationale: אַנְשֵׁי significa literalmente “homens de”. No contexto, refere-se aos homens ligados aos líderes, possivelmente seus soldados ou seguidores, sem que o hebraico especifique mais.
- source_word: אַל תִּירְאוּ
  choice: Não tenham medo
  rationale: Tradução idiomática do imperativo negativo, preservando diretamente a força da exortação.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: dos servos dos caldeus
  rationale: Mantém os equivalentes lexicais mais diretos de עֶבֶד e כַּשְׂדִּים. Neste contexto, “servos” pode designar agentes ou administradores da autoridade babilônica.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Habitem nesta terra
  rationale: ישׁב pode significar morar, habitar ou permanecer. “Habitem” comunica a residência continuada; “nesta terra” torna natural em português a referência contextual definida de בָאָרֶץ.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: e sirvam ao rei da Babilônia
  rationale: עבד com objeto pessoal significa “servir”; no contexto político, implica viver sob a autoridade do rei, sem explicitar além do texto a ideia de submissão.
- source_word: וְיִטַב לָכֶם
  choice: e tudo irá bem para vocês
  rationale: Reproduz em português corrente a expressão impessoal hebraica que promete um resultado favorável.
theological_decisions: []
