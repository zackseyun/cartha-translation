  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: pt
  text: 'O capitão da guarda[d] levou também os braseiros[a] e as bacias[b]: tudo o que era de ouro, ouro, e tudo o que era de prata, prata.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os incensários”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as tigelas”.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico repete os nomes dos materiais: “o que era ouro, ouro, e o que era prata, prata”, classificando enfaticamente os objetos conforme o material.'
    reason: lexical_alternative
  - marker: d
    text: Ou “o chefe dos executores” ou “o comandante da guarda pessoal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: os braseiros
  rationale: מַחְתָּה designa uma pá ou recipiente usado para transportar brasas no serviço do templo. “Braseiros” comunica de modo claro a relação com brasas sem limitar o objeto exclusivamente à queima de incenso.
- source_word: הַמִּזְרָקוֹת
  choice: as bacias
  rationale: מִזְרָק designa uma vasilha usada no culto, inclusive para conter ou aspergir líquidos sacrificiais. “Bacias” é natural em português e adequado ao contexto dos utensílios do templo.
- source_word: אֲשֶׁר זָהָב זָהָב
  choice: tudo o que era de ouro, como ouro
  rationale: A formulação mantém a repetição incomum de זָהָב e expressa a classificação dos objetos segundo o material, sem reduzir a frase simplesmente a “os objetos de ouro”.
- source_word: וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: e tudo o que era de prata, como prata
  rationale: A tradução acompanha a construção paralela referente ao ouro e conserva a repetição enfática e classificatória do hebraico.
- source_word: לָקַח
  choice: levou
  rationale: לָקַח significa basicamente “tomou” ou “pegou”; neste contexto de remoção dos utensílios do templo, “levou” é idiomático e não acrescenta mais interpretação do que o contexto exige.
- source_word: רַב טַבָּחִים
  choice: o capitão da guarda
  rationale: A expressão funciona aqui como título do alto oficial babilônico. “Capitão da guarda” é uma forma tradicional, clara e funcional em português, embora o sentido etimológico admita outras descrições.
