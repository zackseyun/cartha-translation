base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: pt
  text: Ele trocou suas roupas de prisão e tomava suas refeições regularmente diante dele[a], todos os dias da sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na presença dele”. No contexto, a expressão também pode indicar que ele comia à mesa do rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: Ele trocou
  rationale: O piel de שׁנה significa “mudar, trocar”. Com roupas como objeto, “trocou” expressa naturalmente que ele deixou de usar as vestes da prisão.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: suas roupas de prisão
  rationale: Reproduz de modo claro e atual a construção “roupas de seu aprisionamento”, sem acrescentar detalhes não presentes no hebraico.
- source_word: וְאָכַל לֶחֶם
  choice: passou a tomar suas refeições
  rationale: A expressão literalmente diz “comeu pão”, mas neste contexto designa refeições regulares. “Passou a” comunica a nova situação duradoura descrita após a libertação, sem tornar “pão” indevidamente específico em português.
- source_word: תָּמִיד
  choice: regularmente
  rationale: תמיד indica constância ou regularidade. No contexto das refeições concedidas pela corte, “regularmente” é natural e evita sugerir uma ação ininterrupta.
- source_word: לְפָנָיו
  choice: na presença dele[a]
  rationale: A expressão significa literalmente “diante dele”. Esta formulação preserva a referência pronominal e a ideia de presença, enquanto a possível alusão à mesa do rei fica registrada em nota.
- source_word: כָּל יְמֵי חַיָּיו
  choice: todos os dias da sua vida
  rationale: Mantém de forma clara e idiomática a expressão hebraica de duração vitalícia.
