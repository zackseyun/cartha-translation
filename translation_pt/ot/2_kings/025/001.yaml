  naturalness: O português é atual, claro e adequado ao registro narrativo. A coordenação com «eles» torna explícita e natural a mudança para o sujeito plural exigida pelo hebraico.
  terminology: «Nabucodonosor», «rei da Babilônia», «exército» e «obra de cerco» são escolhas adequadas. A nota para דָּיֵק preserva corretamente a amplitude semântica do termo.
