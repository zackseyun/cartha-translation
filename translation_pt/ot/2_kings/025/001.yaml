  text: וַ/יְהִי֩ בִ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/מָלְכ֗/וֹ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִי֮ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֒ בָּ֠א נְבֻכַדְנֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֜ל ה֧וּא וְ/כָל חֵיל֛/וֹ עַל יְרוּשָׁלִַ֖ם וַ/יִּ֣חַן עָלֶ֑י/הָ וַ/יִּבְנ֥וּ עָלֶ֖י/הָ דָּיֵ֥ק סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: pt
  text: No nono ano do reinado de Zedequias, no décimo mês, no décimo dia do mês, Nabucodonosor, rei da Babilônia, veio com todo o seu exército contra Jerusalém. Acampou contra ela, e eles construíram ao redor dela uma obra de cerco[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «muro de cerco», «rampa de cerco» ou «fortificações de cerco». O termo hebraico designa obras militares construídas contra uma cidade sitiada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: No nono ano
  rationale: A fórmula narrativa hebraica introduz a data e o acontecimento; em português, integrá-la diretamente à oração evita a expressão pouco natural «e aconteceu» sem perder conteúdo.
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: no nono ano do reinado de Zedequias
  rationale: A fórmula indica o nono ano do reinado do rei mencionado no contexto. A explicitação de Zedequias torna o referente pronominal claro para o leitor sem alterar a referência histórica.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: no décimo mês, no décimo dia do mês
  rationale: Mantém a fórmula calendárica antiga sem convertê-la em um mês moderno não nomeado pelo texto.
- source_word: נְבֻכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nabucodonosor, rei da Babilônia
  rationale: Usa a forma tradicional e amplamente reconhecida do nome em português e traduz diretamente o título real.
- source_word: הוּא וְכָל חֵילוֹ
  choice: veio com todo o seu exército
  rationale: Expressa naturalmente em português a inclusão enfática do próprio rei com a totalidade de suas forças.
- source_word: עַל יְרוּשָׁלַםִ
  choice: contra Jerusalém
  rationale: No contexto de avanço militar e cerco, עַל tem sentido hostil, não apenas locativo.
- source_word: וַיִּחַן עָלֶיהָ
  choice: Acampou diante dela
  rationale: Comunica a instalação militar junto à cidade; «diante dela» evita a repetição imediata de «contra» e permanece adequada ao contexto hostil.
- source_word: דָּיֵק
  choice: uma obra de cerco
  rationale: O termo designa uma estrutura ou conjunto de trabalhos militares levantados contra uma cidade. A expressão conserva a amplitude lexical sem especificar indevidamente muro, rampa ou aterro.
- source_word: סָבִיב
  choice: ao redor dela
  rationale: Preserva explicitamente a ideia de circundar a cidade.
theological_decisions: []
translation_notes:
  register: Português atual, digno e narrativamente fluente, com vocabulário militar acessível. A segmentação em duas frases melhora a legibilidade sem alterar a sequência dos acontecimentos. O nome de Zedequias é explicitado a partir do contexto imediato para esclarecer o referente de «seu reinado».
