  text: וַ/אֲרֻחָת֗/וֹ אֲרֻחַ֨ת תָּמִ֧יד נִתְּנָה לּ֛/וֹ מֵ/אֵ֥ת הַ/מֶּ֖לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ כֹּ֖ל יְמֵ֥י חַיָּֽ/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: pt
  text: 'E a sua provisão[a], uma provisão contínua, lhe era dada da parte do rei: a porção de cada dia, no seu próprio dia[b], durante todos os dias de sua vida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ração”, “porção” ou “sustento”. O termo hebraico se refere à provisão que lhe era destinada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a coisa de um dia no seu dia”; expressão que indica que a provisão correspondente era fornecida dia após dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: provisão
  rationale: O substantivo designa o sustento ou a porção destinada a Joaquim. “Provisão” comunica de modo natural uma quantidade regularmente fornecida, sem limitar o sentido a uma ração militar ou apenas a dinheiro.
- source_word: תָּמִיד
  choice: contínua
  rationale: Modifica “provisão” e expressa permanência ou continuidade. “Contínua” preserva essa força e mantém a repetição enfática do hebraico.
- source_word: נִתְּנָה
  choice: lhe era dada
  rationale: Reproduz o passivo de נתן e, com o imperfeito perifrástico, comunica adequadamente o fornecimento habitual descrito no contexto.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: da parte do rei
  rationale: Preserva a ideia de procedência expressa pela construção hebraica, em vez de apresentá-la apenas como agência passiva.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: a porção de cada dia no seu devido dia
  rationale: A expressão hebraica é distributiva e literalmente se aproxima de “a coisa de um dia no seu dia”. No contexto, “porção” explicita naturalmente o referente, enquanto “no seu devido dia” conserva a ideia de que cada allotment era fornecido no dia correspondente.
- source_word: כֹּל יְמֵי חַיָּו
  choice: durante todos os dias de sua vida
  rationale: Tradução clara e próxima da fórmula hebraica de duração vitalícia.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição “provisão, uma provisão contínua” acompanha a ênfase do hebraico; “da parte do rei” mantém a noção de origem, e a formulação distributiva conserva o caráter diário do fornecimento.
