  text: וַ/יִּקַּ֣ח אֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אֹתָ֛/ם עַל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: pt
  text: Nebuzaradã, chefe da guarda[a], tomou-os e os levou ao rei da Babilônia, em Ribla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “chefe dos matadores” ou “chefe dos carrascos”; provavelmente um título militar ou de segurança da corte real.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “levou-os à presença do rei da Babilônia, em Ribla”; também é possível entender o final como “levou-os ao rei da Babilônia, para Ribla”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou-os
  rationale: O verbo לקח significa aqui, de modo natural, “tomar” ou “levar consigo”. “Prendeu” ou “capturou” acrescentaria uma ideia de captura não expressa diretamente, sobretudo porque os homens já estão sob custódia no contexto.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradã
  rationale: Adota-se a forma portuguesa tradicional e amplamente reconhecível do nome próprio.
- source_word: רַב טַבָּחִים
  choice: chefe da guarda
  rationale: Embora a expressão seja literalmente “chefe dos matadores/carrascos”, ela funciona como título de um alto oficial militar ou de segurança da corte babilônica. “Chefe da guarda” comunica o cargo em português corrente sem transformar a expressão idiomática numa descrição literal enganosa.
- source_word: וַיֹּלֶךְ
  choice: levou
  rationale: A forma causativa de הלך indica fazer alguém ir; com objeto pessoal e destino, “levou” é a formulação idiomática mais natural em português.
- source_word: עַל
  choice: ao
  rationale: Com verbo de movimento e uma pessoa como destino, עַל indica aqui condução até o rei ou à sua presença. “Ao” mantém a formulação concisa sem explicitar além do necessário a possível situação de audiência ou julgamento.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta da cadeia construta hebraica, em conformidade com o uso português consagrado.
- source_word: רִבְלָתָה
  choice: em Ribla
  rationale: Embora a terminação direcional possa indicar movimento para Ribla, na frase completa o nome localiza o rei a quem os prisioneiros foram levados. “Em Ribla” expressa essa relação naturalmente; a alternativa direcional é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa simples. O pronome enclítico em “tomou-os” e “levou” preserva concisão sem soar excessivamente arcaico. O título é vertido funcionalmente no texto e sua forma literal é mantida em nota; a ambiguidade de עַל e da terminação locativa/direcional de רִבְלָתָה também é preservada em nota.
