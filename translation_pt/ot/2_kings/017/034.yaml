id: 2KI.17.34
reference: 2 Kings 17:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: pt
  text: Até hoje, eles agem segundo os costumes antigos[a]. Não temem Yahweh[b] nem agem segundo seus estatutos e suas ordenanças[e], nem segundo a lei e o mandamento que Yahweh ordenou aos filhos de Jacó[c], a quem deu o nome de Israel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo as antigas ordenanças” ou “segundo as práticas anteriores”.'
    reason: lexical_alternative
  - marker: b
    text: “Temer Yahweh” também pode ser expresso por “reverenciar Yahweh”; a expressão hebraica pode envolver temor, reverência e lealdade religiosa.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “os filhos de Jacó”; a expressão se refere coletivamente ao povo descendente de Jacó.'
    reason: lexical_alternative
  - marker: d
    text: Isto é, Jacó. Compare Gênesis 32:28; 35:10.
    reason: cross_reference
  - marker: e
    text: O hebraico diz literalmente “seus estatutos e seus juízos”. O possessivo pode ser entendido como referência às normas próprias das pessoas descritas ou às normas dadas a Israel; o texto principal conserva essa ambiguidade.
    reason: textual_ambiguity
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: segundo os costumes antigos
  rationale: מִשְׁפָּט pode designar juízo, ordenança, costume ou prática estabelecida. Neste contexto, a expressão retoma as práticas religiosas já descritas; “costumes antigos” comunica esse sentido sem sugerir apenas decisões judiciais.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: temem Yahweh
  rationale: O verbo ירא abrange temor, reverência e lealdade religiosa. “Temem” preserva a expressão bíblica e sua amplitude, enquanto a nota esclarece que não se trata somente de pavor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como “Yahweh”, preservando o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: segundo seus estatutos e suas ordenanças
  rationale: “Estatutos” e “ordenanças” mantêm o registro jurídico-cultual do par hebraico. O possessivo “seus” conserva a forma pronominal e não elimina a possível incerteza quanto ao referente no discurso.
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: nem segundo a lei e o mandamento
  rationale: תּוֹרָה é traduzido por “lei” neste contexto de exigências da aliança, e o singular מִצְוָה é mantido em “mandamento”. “Nem” expressa naturalmente em português a continuação da negação hebraica.
- source_word: בְּנֵי יַעֲקֹב
  choice: os filhos de Jacó
  rationale: A tradução mantém a expressão hebraica no masculino plural; ela designa coletivamente o povo descendente de Jacó, como esclarece a nota.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: a quem deu o nome de Israel
  rationale: A oração alude à mudança do nome de Jacó. Esta formulação é idiomática em português e preserva Jacó como referente singular.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração “Yahweh” preserva o nome da aliança sem convertê-lo em título.
- issue: Sentido de “temer Yahweh”
  choice: manter “temer”, com esclarecimento em nota
  alternative: reverenciar Yahweh
  rationale: A expressão hebraica pode incluir tanto temor quanto reverência e fidelidade religiosa. Manter “temer” evita reduzir essa tensão semântica.
- issue: Referente de “seus estatutos e suas ordenanças”
  choice: preservar o possessivo ambíguo no texto e registrar as leituras na nota
  alternative: explicitar que são as normas dos povos ou as normas de Israel
  rationale: Os sufixos hebraicos são de terceira pessoa plural, mas a identificação discursiva do referente é discutida. Explicitar uma só interpretação resolveria uma ambiguidade que o texto permite manter.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “segundo” acompanha a estrutura cumulativa do hebraico sem tornar a frase artificial; “agem” traduz de modo natural o particípio עֹשִׂים no contexto de prática habitual.
