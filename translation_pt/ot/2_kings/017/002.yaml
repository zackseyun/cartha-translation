id: 2KI.17.2
reference: 2 Kings 17:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: pt
  text: Fez o que era mau aos olhos de Yahweh, mas não como os reis de Israel que o antecederam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol de עשה dá continuidade à narrativa. Em português, o sujeito pode permanecer implícito, e a conjunção inicial não precisa ser reproduzida.
- source_word: הָרַע
  choice: o que era mau
  rationale: O adjetivo com artigo está substantivado, literalmente 'o mal'; a formulação escolhida expressa com naturalidade o sentido moral da fórmula régia.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a imagem do idioma hebraico e comunica claramente uma avaliação segundo a perspectiva de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רַק
  choice: mas
  rationale: Neste contexto, a partícula introduz uma ressalva adversativa à avaliação negativa, expressando que a conduta do rei não alcançou o padrão dos antecessores.
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: não como os reis de Israel
  rationale: Reproduz diretamente a negação e a comparação marcadas por לֹא e כְּ.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: que o antecederam
  rationale: Expressa em português corrente o sentido temporal de 'que estiveram antes dele', referindo-se aos reis anteriores.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Força qualificadora de רַק
  choice: mas
  alternative: somente; contudo
  rationale: A partícula limita a censura anterior por meio de uma comparação mitigadora. 'Mas' conserva essa tensão sem sugerir que o rei não tenha praticado o mal.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e concisa. A expressão hebraica 'aos olhos de' foi mantida por ser compreensível e preservar a imagem original.
