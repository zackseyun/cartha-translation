  text: But they did not listen; instead[a], they kept acting according to their former custom.
translation:
  language: pt
  text: Mas eles não deram ouvidos; pelo contrário, continuaram agindo conforme seu antigo costume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme sua antiga norma/prática”. A palavra hebraica traduzida como “costume” também pode significar ordenança, norma ou prática estabelecida; aqui se refere à antiga maneira de prestar culto.'
