lexical_decisions:
- source_word: וְלֹא
  choice: Mas ... não
  rationale: A conjunção com a negação dá continuidade ao relato com leve contraste em relação à instrução anterior; “mas” expressa isso naturalmente.
- source_word: שָׁמֵעוּ
  choice: não deram ouvidos
  rationale: שׁמע pode significar ouvir, escutar ou obedecer. “Dar ouvidos” preserva tanto a ideia de escuta quanto a de acolher uma ordem, sem explicitar demais “obedecer”.
- source_word: כִּי אִם
  choice: pelo contrário
  rationale: 'A expressão contrapõe o comportamento efetivo à negativa anterior: não fizeram uma coisa; ao contrário, persistiram em outra.'
- source_word: כְּמִשְׁפָּטָם הָרִאשׁוֹן
  choice: conforme seu antigo costume
  rationale: מִשְׁפָּט pode indicar norma, ordenança ou prática costumeira. Neste contexto religioso, “costume” comunica melhor a maneira de agir já estabelecida; הָרִאשׁוֹן aponta para a prática anterior.
- source_word: הֵם עֹשִׂים
  choice: continuaram agindo
  rationale: A construção com particípio apresenta uma ação contínua ou habitual; “continuaram agindo” transmite essa persistência em português corrente.
