  text: וַ/יָּבֹ֞א אֶחָ֣ד מֵ/הַ/כֹּהֲנִ֗ים אֲשֶׁ֤ר הִגְלוּ֙ מִ/שֹּׁ֣מְר֔וֹן וַ/יֵּ֖שֶׁב בְּ/בֵֽית אֵ֑ל וַֽ/יְהִי֙ מוֹרֶ֣ה אֹתָ֔/ם אֵ֖יךְ יִֽירְא֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: pt
  text: Então veio um dos sacerdotes que eles haviam deportado de Samaria. Ele passou a morar em Betel e lhes ensinava como deviam temer Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então veio
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: um dos sacerdotes
  rationale: A expressão designa um indivíduo pertencente ao grupo de sacerdotes.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: que eles haviam deportado de Samaria
  rationale: O hifil de גלה significa levar ao exílio ou deportar. Mantém-se o sujeito plural indeterminado do hebraico, e o mais-que-perfeito esclarece que a deportação precedeu sua vinda.
- source_word: וַיֵּשֶׁב בְּבֵית אֵל
  choice: Ele passou a morar em Betel
  rationale: ישב neste contexto indica fixar residência; “passou a morar” comunica o início dessa situação sem sugerir necessariamente permanência definitiva.
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: e lhes ensinava
  rationale: A construção היה com particípio apresenta uma atividade contínua ou característica; o pretérito imperfeito preserva esse aspecto.
- source_word: אֵיךְ יִירְאוּ
  choice: como deviam temer
  rationale: A formulação transmite tanto a maneira quanto o caráter normativo da instrução, sem reduzir “temer” a simples conhecimento intelectual.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, distinguindo-o de um título como “Senhor”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio, enquanto “SENHOR” representa a tradição de substituição reverencial.
- issue: Sentido de ירא em relação a Yahweh
  choice: temer Yahweh
  alternative: reverenciar Yahweh
  rationale: “Temer” mantém a amplitude e a tensão do verbo hebraico, que pode envolver temor, reverência e lealdade religiosa; “reverenciar” estreitaria o sentido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente longa. O imperfeito “ensinava” preserva o valor durativo da construção hebraica.
