  text: וַ/יָּבֵ֣א מֶֽלֶךְ אַשּׁ֡וּר מִ/בָּבֶ֡ל וּ֠/מִ/כּוּ֠תָ/ה וּ/מֵ/עַוָּ֤א וּ/מֵֽ/חֲמָת֙ וּ/סְפַרְוַ֔יִם וַ/יֹּ֨שֶׁב֙ בְּ/עָרֵ֣י שֹֽׁמְר֔וֹן תַּ֖חַת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּֽרְשׁוּ֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֵּֽשְׁב֖וּ בְּ/עָרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: pt
  text: Então o rei da Assíria trouxe pessoas da Babilônia, de Cuta, de Ava, de Hamate e de Sefarvaim e as instalou nas cidades de Samaria, no lugar dos filhos de Israel[a]. Eles tomaram posse de Samaria e habitaram em suas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos israelitas” ou “do povo de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: trouxe gente
  rationale: O hifil de בוא significa “trazer” ou “fazer vir”. O objeto não está expresso no hebraico, mas o contexto mostra que se trata dos grupos reassentados; “gente” torna isso claro em português sem especificar além do texto.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Tradução natural e precisa da construção hebraica.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: da Babilônia, de Cuta, de Ava, de Hamate e de Sefarvaim
  rationale: Os topônimos são transliterados em formas correntes e legíveis em português.
- source_word: וַיֹּשֶׁב
  choice: a estabeleceu
  rationale: 'O hifil de ישׁב é causativo: o rei fez a população trazida morar ali. O pronome coletivo singular retoma naturalmente “gente”.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: nas cidades de Samaria
  rationale: Mantém o plural עָרֵי. Neste contexto, Samaria designa o território com suas diversas cidades, não apenas a capital.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: no lugar dos filhos de Israel
  rationale: תַּחַת tem aqui o sentido de substituição, “no lugar de”. “Filhos de Israel” preserva a forma tradicional e relativamente literal do etnônimo hebraico, com alternativa idiomática em nota.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: Eles tomaram posse de Samaria
  rationale: ירשׁ, no contexto de conquista e ocupação territorial, significa “tomar posse de”, e não necessariamente “herdar”.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: e habitaram em suas cidades
  rationale: O qal de ישׁב expressa morar ou habitar; o sufixo feminino singular remete a Samaria.
theological_decisions:
- issue: Expressão étnica de gênero בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: Embora a expressão seja literalmente masculina, funciona como designação coletiva do povo. A tradução principal conserva a formulação hebraica, enquanto a nota registra equivalentes idiomáticos que incluem toda a comunidade.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação narrativa reproduz o andamento do hebraico sem rigidez excessiva. Corrige-se a aparente troca de marcadores na camada inglesa: a alternativa relativa a Israel pertence ao ponto marcado após “filhos de Israel”; não se acrescenta nota para Ava, pois uma variante de transliteração inglesa não é pertinente à edição portuguesa.'
