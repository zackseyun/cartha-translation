  terminology: '"Rei da Assíria", "Samaria", "filhos de Israel", "tomaram posse" e "habitaram" são adequados ao registro e ao contexto. A nota apresenta alternativas idiomáticas legítimas para "filhos de Israel" sem alterar a formulação principal.'
