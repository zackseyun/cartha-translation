  source_fidelity: 'A tradução segue fielmente a sintaxe e o sentido do hebraico: o rei assírio traz grupos das localidades enumeradas, instala-os nas cidades de Samaria em substituição aos filhos de Israel, e esses grupos passam a possuir Samaria e a morar em suas cidades. Os topônimos e o valor causativo de וַיֹּשֶׁב são preservados.'
