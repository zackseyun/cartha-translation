  text: וַ/יְהִ֗י בִּ/תְחִלַּת֙ שִׁבְתָּ֣/ם שָׁ֔ם לֹ֥א יָרְא֖וּ אֶת יְהוָ֑ה וַ/יְשַׁלַּ֨ח יְהוָ֤ה בָּ/הֶם֙ אֶת הָ֣/אֲרָי֔וֹת וַ/יִּֽהְי֥וּ הֹרְגִ֖ים בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: pt
  text: E aconteceu que, no início de sua permanência ali, eles não temiam Yahweh[a]. Por isso, Yahweh enviou leões entre eles, e os leões matavam alguns deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não reverenciavam Yahweh”. No hebraico, “temer” inclui reverência e consideração pela aliança, não apenas terror.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: No início de sua permanência ali
  rationale: Preserva a construção temporal e nominal do hebraico, indicando a fase inicial da residência dos povos naquele lugar, em português natural.
- source_word: לֹא יָרְאוּ אֶת יְהוָה
  choice: eles não temiam Yahweh
  rationale: Mantém o verbo 'temer', cuja amplitude inclui reverência e reconhecimento religioso, sem reduzi-lo apenas a terror ou culto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְשַׁלַּח יְהוָה בָּהֶם אֶת הָאֲרָיוֹת
  choice: Yahweh enviou leões para o meio deles
  rationale: Expressa de modo idiomático que os leões foram enviados entre aquela população; 'para o meio deles' preserva a imagem espacial da preposição.
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: e estes matavam alguns deles
  rationale: O auxiliar היה com particípio indica ação contínua ou repetida; 'matavam' conserva esse aspecto, e 'alguns deles' comunica o valor partitivo contextual de בָּהֶם.
theological_decisions:
- issue: Sentido de ירא em relação a Yahweh
  choice: temiam Yahweh
  alternative: reverenciavam Yahweh
  rationale: A tradução literal conserva a linguagem bíblica e sua tensão sem limitar o sentido a medo aterrorizado; uma nota esclarece sua dimensão de reverência e consideração religiosa.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o nome próprio divino; a transliteração o preserva em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação evita o pouco natural 'no princípio de sua habitação' e preserva o aspecto reiterado de 'matavam'.
