- from: No início de sua permanência ali, eles não temiam Yahweh[a]. Por isso, Yahweh enviou leões para o meio deles, e estes matavam alguns deles.
  to: E aconteceu que, no início de sua permanência ali, eles não temiam Yahweh[a]. Por isso, Yahweh enviou leões entre eles, e os leões matavam alguns deles.
  rationale: A revisão restaura a fórmula narrativa inicial, ajusta a preposição para uma formulação portuguesa mais direta e identifica explicitamente os leões como sujeito da ação reiterada. Mantêm-se o nome Yahweh, o sentido amplo de “temer” e o valor contínuo ou repetido de “matavam”.
