base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: pt
  text: No nono ano de Oseias, o rei da Assíria conquistou Samaria, deportou Israel para a Assíria e os estabeleceu em Hala, junto ao Habor, rio de Gozã[a], e nas cidades da Média.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “às margens do Habor, o rio de Gozã”. O hebraico pode indicar que eles foram estabelecidos ao longo do rio Habor, na região de Gozã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: No nono ano de Oseias
  rationale: A construção indica o nono ano do reinado de Oseias; a formulação é natural e preserva a concisão do hebraico.
- source_word: לָכַד
  choice: conquistou
  rationale: Em contexto militar e tendo uma cidade como objeto, expressa sua tomada pela força.
- source_word: וַיֶּגֶל אֶת יִשְׂרָאֵל אַשּׁוּרָה
  choice: deportou Israel para a Assíria
  rationale: O hifil de גלה denota remoção forçada para o exílio; “deportou” comunica isso de modo claro e atual.
- source_word: וַיֹּשֶׁב אֹתָם
  choice: os estabeleceu
  rationale: O hifil de ישׁב significa fazer habitar ou instalar; o pronome plural retoma as pessoas compreendidas coletivamente em “Israel”.
- source_word: בַּחְלַח
  choice: em Hala
  rationale: Transliteração portuguesa do topônimo com a preposição locativa.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: junto ao Habor, o rio de Gozã
  rationale: Como Habor é identificado em aposição como rio, “junto ao” indica assentamento em suas margens sem tratá-lo como cidade; “de Gozã” preserva a relação do construto hebraico.
- source_word: וְעָרֵי מָדָי
  choice: e nas cidades dos medos
  rationale: מָדַי designa a Média ou os medos; neste contexto, “cidades dos medos” é uma tradução natural e mantém a referência étnico-geográfica.
