  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: pt
  text: Ergueram para si colunas sagradas e postes de Aserá[a] em toda colina alta e debaixo de toda árvore verdejante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aserins”; o termo hebraico se refere a objetos de culto associados a Aserá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: Ergueram
  rationale: O hifil de נצב significa aqui instalar ou erigir objetos de culto; “ergueram” é natural e preciso em português.
- source_word: לָהֶם
  choice: para si
  rationale: 'Expressa de modo conciso o valor reflexivo do dativo: os objetos foram instalados para uso deles próprios.'
- source_word: מַצֵּבוֹת
  choice: colunas sagradas
  rationale: Designa pedras ou colunas erigidas com função cultual. O qualificativo “sagradas” explicita o sentido contextual sem as confundir com colunas arquitetônicas comuns.
- source_word: וַאֲשֵׁרִים
  choice: postes de Aserá
  rationale: O plural refere-se a objetos de culto associados à deusa Aserá; esta formulação é acessível e mantém a ligação específica com Aserá, sem tratá-los simplesmente como ídolos genéricos.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: em todas as colinas altas
  rationale: Preserva a imagem física e a fórmula hebraica de locais de culto, com preposição idiomática em português.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: e debaixo de todas as árvores verdejantes
  rationale: רַעֲנָן indica vegetação fresca, frondosa ou viçosa; “verdejantes” conserva a imagem e soa natural no registro bíblico moderno.
theological_decisions:
- issue: Sentido de אֲשֵׁרִים
  choice: postes de Aserá
  alternative: aserins; imagens de Aserá
  rationale: O termo provavelmente designa objetos cultuais associados a Aserá, embora sua forma exata não seja inteiramente certa. A tradução mantém essa associação e a nota registra a alternativa transliterada, evitando identificar de modo absoluto o objeto como uma representação da própria deusa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Colunas sagradas” comunica a função cultual de מַצֵּבוֹת; “árvores verdejantes” preserva a imagem da folhagem viva sem recorrer a linguagem arcaica.
