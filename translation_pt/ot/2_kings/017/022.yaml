  text: וַ/יֵּֽלְכוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/כָל חַטֹּ֥אות יָרָבְעָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה לֹא סָ֖רוּ מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/022.yaml
  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: pt
  text: Os israelitas andaram em todos os pecados que Jeroboão havia cometido; não se afastaram deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dela”; o singular provavelmente se refere coletivamente à conduta ou ao padrão pecaminoso que acaba de ser mencionado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: andaram
  rationale: Preserva a metáfora hebraica de andar em determinado caminho ou padrão de conduta; no contexto, significa viver ou proceder de acordo com práticas pecaminosas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Expressa de modo natural e atual o sentido nacional de “os filhos de Israel”, sem alterar o referente.
- source_word: בְּכָל חַטֹּאות
  choice: em todos os pecados
  rationale: Mantém diretamente a preposição, a totalidade indicada por כָּל e o plural concreto “pecados”.
- source_word: יָרָבְעָם אֲשֶׁר עָשָׂה
  choice: que Jeroboão havia cometido
  rationale: Em português, “cometer pecados” é a combinação idiomática correspondente ao hebraico literalmente “fez”; o mais-que-perfeito composto esclarece que esses atos antecederam a persistência de Israel.
- source_word: לֹא סָרוּ
  choice: não se afastaram
  rationale: Comunica naturalmente a ideia de não se desviar nem abandonar o padrão pecaminoso.
- source_word: מִמֶּנָּה
  choice: deles
  rationale: Embora o sufixo hebraico seja feminino singular, ele provavelmente retoma coletivamente o caminho ou padrão pecaminoso. O plural português retoma com clareza os “pecados” imediatamente anteriores, enquanto a nota preserva a forma do original.
theological_decisions:
- issue: Referente do sufixo feminino singular em מִמֶּנָּה depois do plural “pecados”
  choice: Traduzir no plural, “deles”, referindo-se coletivamente aos pecados de Jeroboão.
  alternative: “dela”, entendendo o referente como a conduta ou o caminho pecaminoso mencionado de forma coletiva.
  rationale: O texto descreve a persistência de Israel nas práticas pecaminosas de Jeroboão. O plural é mais claro em português, mas a nota registra o singular hebraico e preserva a possível referência coletiva sem resolver além do necessário.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. “Andaram em” conserva a metáfora moral do hebraico, enquanto “os israelitas” evita uma formulação excessivamente arcaica. O marcador [a] aparece no texto principal junto ao termo que explica.
