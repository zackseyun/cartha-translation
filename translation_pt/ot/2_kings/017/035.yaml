  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: pt
  text: 'Yahweh fez uma aliança com eles e lhes ordenou: “Não temam outros deuses, não se curvem diante deles, não os sirvam nem lhes ofereçam sacrifícios.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: fez uma aliança
  rationale: A expressão idiomática hebraica, literalmente “cortou uma aliança”, significa estabelecer ou fazer uma aliança; a formulação escolhida é natural e exata em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: lhes ordenou
  rationale: Comunica diretamente o ato de ordenar; o introdutor hebraico de discurso לֵאמֹר não precisa ser reproduzido como “dizendo” para que a construção seja natural em português.
- source_word: לֹא תִירְאוּ
  choice: Não temam
  rationale: Em português atual, o imperativo negativo preserva com naturalidade e dignidade a força da proibição pactual. “Temer” é mantido, pois os verbos seguintes descrevem outros atos religiosos.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Tradução direta e contextualmente precisa, sem reinterpretar “deuses” como ídolos.
- source_word: תִשְׁתַּחֲווּ לָהֶם
  choice: se curvem diante deles
  rationale: Preserva a ação concreta de inclinar-se ou prostrar-se, distinguindo-a do serviço e do sacrifício mencionados em seguida.
- source_word: תַעַבְדוּם
  choice: os sirvam
  rationale: Mantém o sentido próprio de עבד e a distinção entre servir e os demais atos de culto enumerados.
- source_word: תִזְבְּחוּ לָהֶם
  choice: lhes ofereçam sacrifícios
  rationale: Expressa de modo idiomático e inequívoco a oferta sacrificial dirigida aos outros deuses.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Força das proibições no contexto da aliança
  choice: Não temam ... não se curvem ... não os sirvam nem lhes ofereçam sacrifícios
  alternative: Vocês não temerão ... nem se curvarão ...
  rationale: A forma escolhida transmite naturalmente em português moderno a força normativa das proibições hebraicas, sem perder o contexto solene da ordem pactual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração paralela do hebraico foi preservada, e “nem” coordena naturalmente as duas últimas proibições. Não há notas de rodapé, portanto não são usados marcadores no texto.
