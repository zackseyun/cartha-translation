revisions:
- from: Até Judá não guardou os mandamentos de Yahweh, seu Deus, mas seguiu os costumes que Israel havia adotado.[a]
  to: Nem Judá guardou os mandamentos de Yahweh, seu Deus, mas andou segundo os estatutos que Israel havia estabelecido.[a]
  rationale: A revisão torna a ênfase negativa inicial mais idiomática, restaura “estatutos” para חֻקּוֹת e traduz עָשׂוּ por “havia estabelecido”, preservando o contraste entre os mandamentos de Yahweh e as normas instituídas por Israel. A nota mantém alternativas naturais para a expressão idiomática “andar segundo”.
