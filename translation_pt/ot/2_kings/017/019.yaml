  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: pt
  text: Nem Judá guardou os mandamentos de Yahweh, seu Deus, mas andou segundo os estatutos que Israel havia estabelecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas seguiu os estatutos que Israel havia estabelecido” ou “seguiu as práticas de Israel”.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'A partícula anteposta tem força enfática no contexto: não apenas Israel, mas até Judá incorreu na mesma culpa.'
- source_word: שָׁמַר
  choice: guardou
  rationale: No contexto da aliança, expressa observar e cumprir mandamentos; “guardar” conserva o registro bíblico sem deixar de ser compreensível.
- source_word: מִצְוֺת
  choice: os mandamentos
  rationale: Preserva o sentido formal e pactual do plural hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Embora o hebraico tenha sufixo plural, Judá representa coletivamente seu povo; em português, “seu Deus” concorda naturalmente com o referente coletivo singular sem alterar o sentido.
- source_word: וַיֵּלְכוּ בְּ
  choice: mas seguiu
  rationale: A construção idiomática descreve conduta conforme determinado padrão. “Seguiu” comunica naturalmente a metáfora hebraica, e “mas” explicita o contraste contextual.
- source_word: בְּחֻקּוֹת
  choice: os costumes
  rationale: Neste contexto, חֻקּוֹת pode designar práticas prescritas ou costumes; a escolha evita sugerir que as normas de Israel tinham a mesma autoridade dos mandamentos de Yahweh.
- source_word: אֲשֶׁר עָשׂוּ
  choice: que Israel havia adotado
  rationale: O verbo pode significar fazer, instituir ou praticar. “Adotado” expressa costumes estabelecidos e preserva a possível referência coletiva a Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sujeito e sentido de אֲשֶׁר עָשׂוּ
  choice: que Israel havia adotado
  alternative: que eles haviam feito; que Israel praticava
  rationale: O verbo está no plural e pode referir-se a Israel como coletivo ou às pessoas do reino. A formulação escolhida mantém Israel como referente explícito, mas a nota registra a amplitude semântica do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Até Judá” preserva a ênfase inicial; “seguiu” torna natural a expressão hebraica de andar segundo um padrão. A nota conserva as alternativas possíveis para חֻקּוֹת e עָשׂוּ.
