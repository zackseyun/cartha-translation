  source_fidelity: 'A tradução transmite com precisão a ordem do rei da Assíria: a remoção de um sacerdote anteriormente exilado, seu retorno e residência no local, e seu ensino acerca do mishpat do deus da terra. O singular contextual em “Que ele vá morar” é justificável, pois o antecedente imediato é “um dos sacerdotes” e o verbo seguinte é singular; a nota documenta corretamente a irregularidade dos verbos hebraicos no plural.'
