  text: וַ/יְצַ֨ו מֶֽלֶךְ אַשּׁ֜וּר לֵ/אמֹ֗ר הֹלִ֤יכוּ שָׁ֨מָּ/ה֙ אֶחָ֤ד מֵ/הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר הִגְלִיתֶ֣ם מִ/שָּׁ֔ם וְ/יֵלְכ֖וּ וְ/יֵ֣שְׁבוּ שָׁ֑ם וְ/יֹרֵ֕/ם אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: pt
  text: 'Então o rei da Assíria ordenou: “Levem para lá[a] um dos sacerdotes que vocês exilaram de lá[b]. Que ele vá morar ali[c] e lhes ensine o costume[d] do deus daquela terra[e]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Tragam para lá” ou “Mandem para lá” um dos sacerdotes.
    reason: lexical_alternative
  - marker: b
    text: Ou “que vocês deportaram de lá”.
    reason: lexical_alternative
  - marker: c
    text: 'Aqui o hebraico emprega verbos no plural (“que eles vão” e “morem”), embora o contexto indique o singular: “um dos sacerdotes” e, em seguida, “que ele lhes ensine”.'
    reason: textual_variant
  - marker: d
    text: Ou “a lei”, “a exigência” ou “a prática devida”.
    reason: lexical_alternative
  - marker: e
    text: Ou “do Deus daquela terra”. A inicial minúscula reflete a perspectiva assíria de um deus territorial.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה no relato expressa uma ordem régia; “ordenou” é direto, atual e preserva sua força.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Reproduz naturalmente em português a construção de título e território.
- source_word: לֵאמֹר
  choice: introdução direta por dois-pontos
  rationale: A fórmula hebraica introduz discurso direto. Em português atual, os dois-pontos comunicam essa função sem o artificial “dizendo”.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: Levem para lá
  rationale: O hifil de הלך significa fazer ir ou conduzir; “levem para lá” mantém a direção indicada por שָׁמָּה sem definir excessivamente se a ação é levar, trazer ou enviar.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: um dos sacerdotes
  rationale: Equivalente natural e exato da construção partitiva.
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: que vocês exilaram de lá
  rationale: O hifil de גלה denota levar ao exílio ou deportar; “exilaram” é conciso e mantém explícitos os agentes plurais.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: Que ele vá morar ali
  rationale: Embora os dois verbos estejam no plural no texto hebraico, o antecedente é “um dos sacerdotes” e o verbo seguinte volta ao singular. O singular comunica o sentido contextual, enquanto a nota registra a irregularidade.
- source_word: וְיֹרֵם
  choice: e lhes ensine
  rationale: O hifil de ירה significa ensinar ou instruir; o sufixo plural é representado por “lhes”.
- source_word: מִשְׁפַּט
  choice: o costume
  rationale: Neste contexto, מִשְׁפַּט indica a prática ou observância considerada devida ao deus local. “Costume” preserva esse sentido sem restringi-lo a uma lei codificada.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: o deus daquela terra
  rationale: A minúscula reflete a concepção assíria de uma divindade territorial; “daquela terra” soa natural no discurso e retoma o lugar para onde o sacerdote seria enviado.
theological_decisions:
- issue: Maiúscula ou minúscula em אֱלֹהֵי הָאָרֶץ
  choice: o deus daquela terra
  alternative: o Deus daquela terra
  rationale: A fala do rei assírio parece pressupor uma divindade territorial. A minúscula preserva a perspectiva do personagem sem decidir contra a identificação narrativa com o Deus de Israel; a alternativa é registrada em nota.
- issue: Discordância de número em וְיֵלְכוּ / וְיֵשְׁבוּ
  choice: 'sentido singular: “Que ele vá morar ali”'
  alternative: 'forma plural: “Que eles vão e morem ali”'
  rationale: “Um dos sacerdotes” é o antecedente imediato, e וְיֹרֵם é singular com objeto plural. O singular oferece o sentido contextual mais provável, sem ocultar a forma hebraica, documentada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula לֵאמֹר foi vertida idiomaticamente por dois-pontos. “Vocês” explicita o destinatário plural já marcado no hebraico. Evitou-se linguagem arcaica, preservando em notas as ambiguidades lexicais, a tensão teológica da capitalização e a irregularidade de número.
