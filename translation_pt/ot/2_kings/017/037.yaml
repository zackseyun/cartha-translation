  text: וְ/אֶת הַ/חֻקִּ֨ים וְ/אֶת הַ/מִּשְׁפָּטִ֜ים וְ/הַ/תּוֹרָ֤ה וְ/הַ/מִּצְוָה֙ אֲשֶׁ֣ר כָּתַ֣ב לָ/כֶ֔ם תִּשְׁמְר֥וּ/ן לַ/עֲשׂ֖וֹת כָּל הַ/יָּמִ֑ים וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: pt
  text: E vocês guardarão os estatutos, as ordenanças, a instrução e o mandamento que ele escreveu para vocês, tendo o cuidado de cumpri-los todos os dias; e não temerão outros deuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “temer” inclui a ideia de reverência, lealdade religiosa e culto prestado a uma divindade.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: os estatutos
  rationale: Preserva o sentido de prescrições estabelecidas e o registro jurídico da enumeração.
- source_word: הַמִּשְׁפָּטִים
  choice: as ordenanças
  rationale: Expressa normas ou decisões jurídicas e mantém este termo distinto de חֻקִּים.
- source_word: הַתּוֹרָה
  choice: a instrução
  rationale: Neste contexto, תּוֹרָה designa a instrução normativa da aliança; 'instrução' preserva sua amplitude sem reduzi-la a legislação abstrata.
- source_word: הַמִּצְוָה
  choice: o mandamento
  rationale: Mantém o singular hebraico e o tom solene do conjunto legal.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: que ele escreveu para vocês
  rationale: Conserva o sujeito masculino singular implícito sem inserir explicitamente 'o SENHOR', embora o contexto o identifique.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: guardarão ... tendo o cuidado de cumpri-los
  rationale: Representa tanto o ato de guardar/observar quanto sua realização prática, de maneira natural em português.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Reproduz com naturalidade o valor durativo da expressão hebraica, isto é, continuamente.
- source_word: תִירְאוּ
  choice: temerão
  rationale: Preserva a amplitude de ירא, que neste contexto envolve temor reverente, lealdade religiosa e culto.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É a correspondência direta e convencional da expressão hebraica.
theological_decisions:
- issue: Distinção entre os quatro termos da linguagem da aliança
  choice: 'Manter quatro termos: estatutos, ordenanças, instrução e mandamento'
  alternative: Resumir como 'leis e mandamentos'
  rationale: A acumulação deliberada no hebraico dá peso retórico às obrigações da aliança; condensá-la apagaria distinções presentes no texto.
- issue: Sujeito de 'escreveu'
  choice: Manter 'ele'
  alternative: Explicitar 'o SENHOR'
  rationale: O contexto identifica o referente, mas o versículo traz apenas o sujeito implícito no verbo; a tradução evita acrescentar o nome divino ao texto principal.
- issue: Sentido religioso de 'temer'
  choice: Manter 'temer', com esclarecimento em nota
  alternative: Traduzir diretamente por 'adorar' ou 'reverenciar'
  rationale: O verbo hebraico conserva a tensão entre temor, reverência e lealdade cultual; uma opção mais estreita resolveria indevidamente essa amplitude.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. A coordenação extensa do hebraico foi preservada, mas a expressão verbal foi ajustada à sintaxe natural do português. O pronome plural 'vocês' evita regionalismo e corresponde ao destinatário coletivo.
