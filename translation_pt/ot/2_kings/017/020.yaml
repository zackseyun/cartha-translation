  text: וַ/יִּמְאַ֨ס יְהוָ֜ה בְּ/כָל זֶ֤רַע יִשְׂרָאֵל֙ וַ/יְעַנֵּ֔/ם וַֽ/יִּתְּנֵ֖/ם בְּ/יַד שֹׁסִ֑ים עַ֛ד אֲשֶׁ֥ר הִשְׁלִיכָ֖/ם מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: pt
  text: Assim, Yahweh rejeitou toda a descendência de Israel[a], afligiu-os e os entregou nas mãos de saqueadores[b], até que os expulsou de sua presença[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os descendentes de Israel”. Hebraico: “toda a semente de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “os entregou na mão de saqueadores”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “de diante dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: rejeitou
  rationale: מָאַס indica rejeitar ou recusar, especialmente em contexto judicial e de aliança; “rejeitou” expressa repúdio decisivo sem acrescentar a carga emocional de “desprezou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: toda a descendência de Israel
  rationale: זֶרַע é um coletivo que pode significar semente, prole ou descendência. “Toda a descendência” é natural em português e mantém a abrangência do hebraico sem definir além do texto seu alcance histórico.
- source_word: וַיְעַנֵּם
  choice: afligiu-os
  rationale: O piel de ענה pode significar afligir, humilhar ou oprimir. “Afligiu-os” preserva a amplitude do sofrimento imposto no contexto de juízo.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: os entregou nas mãos de
  rationale: A expressão נתן ביד significa entregar ao poder ou controle de alguém. O plural idiomático “nas mãos de” soa natural em português, enquanto a nota registra a forma hebraica singular.
- source_word: שֹׁסִים
  choice: saqueadores
  rationale: O particípio de שסס designa pessoas que saqueiam ou despojam; “saqueadores” é claro, atual e conserva o sentido predatório.
- source_word: עַד אֲשֶׁר
  choice: até
  rationale: Introduz o ponto culminante ou limite da sequência; “até” é conciso e idiomático.
- source_word: הִשְׁלִיכָם
  choice: expulsá-los
  rationale: השליך significa literalmente lançar ou atirar. Neste contexto, “expulsá-los” comunica naturalmente o afastamento resultante, sem sugerir mero descarte físico.
- source_word: מִפָּנָיו
  choice: de sua presença
  rationale: A expressão literalmente significa “de diante dele” e, neste contexto, indica remoção da presença divina.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Alcance de “toda a descendência de Israel”
  choice: manter a formulação abrangente sem restringi-la na tradução
  alternative: explicitar apenas o reino do Norte ou entender absolutamente cada descendente de Jacó
  rationale: O hebraico afirma “toda a descendência de Israel”. Embora o contexto histórico informe sua leitura, a tradução não deve resolver uma questão de alcance que o próprio versículo deixa aberta.
- issue: Força de הִשְׁלִיכָם מִפָּנָיו
  choice: expulsá-los de sua presença
  alternative: lançá-los para longe de diante dele
  rationale: A escolha comunica exclusão judicial e relacional sem acrescentar uma formulação doutrinária mais específica do que a expressão hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “Yahweh” como nome próprio, evita arcaísmos e conserva por notas os principais hebraísmos e alternativas lexicais.
