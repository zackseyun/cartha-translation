base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: pt
  text: Os aveus[a] fizeram Nibaz e Tartaque, e os sefarvitas queimavam seus filhos no fogo para Adrameleque e Anameleque, os deuses de Sefarvaim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os avim”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, ofereciam os filhos como sacrifícios, queimando-os em honra dessas divindades.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  choice: os aveus
  rationale: Gentílico plural; usa-se uma forma transliterada e adaptada à morfologia portuguesa. A variante mais próxima da forma hebraica é indicada em nota.
- source_word: עָשׂוּ
  choice: fizeram
  rationale: Representa diretamente o verbo comum עשה sem acrescentar no texto principal “ídolos” ou “imagens”, embora o contexto seja cultual.
- source_word: נִבְחַז וְאֶת תַּרְתָּק
  choice: Nibaz e Tartaque
  rationale: Nomes próprios de divindades transliterados e adaptados à ortografia portuguesa.
- source_word: הַסְפַרְוִים
  choice: os sefarvitas
  rationale: Gentílico plural referente aos habitantes de Sefarvaim; forma clara e concisa em português.
- source_word: שֹׂרְפִים
  choice: queimavam
  rationale: O particípio expressa prática habitual ou reiterada; o pretérito imperfeito comunica essa força naturalmente em português.
- source_word: אֶת בְּנֵיהֶם בָּאֵשׁ
  choice: seus filhos no fogo
  rationale: Preserva o termo masculino específico “filhos” e a expressão locativa/instrumental “no fogo”.
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: em sacrifício a Adrameleque e Anameleque
  rationale: A preposição ל marca os destinatários da oferta; “em sacrifício a” torna explícita a relação cultual exigida pelo contexto sem alterar a natureza do ato.
- source_word: אלה ספרים
  choice: os deuses de Sefarvaim
  rationale: A frase construta identifica Adrameleque e Anameleque como divindades associadas à cidade de Sefarvaim.
theological_decisions:
- issue: Explicitar que Nibaz e Tartaque eram ídolos ou imagens
  choice: Manter “fizeram Nibaz e Tartaque”
  alternative: “fizeram ídolos de Nibaz e Tartaque” ou “fizeram imagens de Nibaz e Tartaque”
  rationale: O hebraico traz apenas o verbo “fazer” seguido dos nomes. O contexto implica fabricação cultual, mas o texto principal não deve especificar além do que a fonte declara.
- issue: Generalizar בְּנֵיהֶם como “crianças”
  choice: Traduzir como “filhos”
  alternative: “crianças”
  rationale: O substantivo hebraico é masculino e específico neste contexto; preserva-se essa precisão.
- issue: Valor aspectual de שֹׂרְפִים
  choice: “queimavam”
  alternative: “queimaram”
  rationale: O particípio descreve uma prática cultual habitual, bem representada pelo pretérito imperfeito português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os nomes próprios em formas portuguesas tradicionais ou fonologicamente naturais; o pretérito imperfeito expressa a prática habitual.
