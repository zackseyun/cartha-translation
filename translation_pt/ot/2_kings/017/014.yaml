  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּקְשׁ֤וּ אֶת עָרְפָּ/ם֙ כְּ/עֹ֣רֶף אֲבוֹתָ֔/ם אֲשֶׁר֙ לֹ֣א הֶאֱמִ֔ינוּ בַּֽ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: pt
  text: Mas eles não quiseram ouvir; endureceram o pescoço, como o de seus antepassados, que não creram[a] em Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: não confiaram. O verbo hebraico pode expressar tanto crer como depositar confiança, especialmente em contexto de aliança.'
    reason: Alternativa lexical que preserva a amplitude semântica de הֶאֱמִינוּ.
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  choice: Mas eles não quiseram ouvir
  rationale: O sentido básico de שׁמע é ouvir ou dar atenção, podendo incluir a ideia de obedecer em contexto de aliança. “Não quiseram ouvir” expressa a resistência deliberada indicada pelo contexto e soa natural em português.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: endureceram o pescoço
  rationale: A expressão conserva a imagem hebraica de tornar rígido o pescoço como figura de teimosia e resistência, sem substituí-la diretamente por uma explicação abstrata.
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: como o de seus antepassados
  rationale: O pronome “o” retoma “pescoço” e preserva a comparação concreta do hebraico. “Antepassados” comunica aqui o sentido genealógico de אָבוֹת com maior clareza do que “pais” em português corrente.
- source_word: הֶאֱמִינוּ
  choice: creram
  rationale: O Hiphil de אמן com a preposição ב pode indicar crer em alguém ou nele depositar confiança. “Creram em” reproduz de perto a construção hebraica, enquanto a nota registra a alternativa contextual “confiaram”.
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  choice: em Yahweh, seu Deus
  rationale: A preposição é representada por “em”; o nome divino é transliterado como “Yahweh”, e a identificação pactual “seu Deus” é mantida explicitamente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: 'Sentido de אמן com ב: crer ou confiar'
  choice: não creram em Yahweh
  alternative: não confiaram em Yahweh
  rationale: As duas leituras são lexicalmente possíveis. O texto principal conserva de perto a construção “crer em”, e a nota mantém visível a nuance de confiança pactual sem resolver indevidamente a amplitude do verbo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A metáfora concreta do pescoço endurecido foi preservada; “antepassados” evita a possível leitura restrita de “pais” como progenitores imediatos.
