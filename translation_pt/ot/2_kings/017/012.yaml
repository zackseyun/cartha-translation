  text: וַ/יַּֽעַבְד֖וּ הַ/גִּלֻּלִ֑ים אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם לֹ֥א תַעֲשׂ֖וּ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: pt
  text: 'Eles prestaram culto aos ídolos[a], a respeito dos quais Yahweh lhes havia dito: “Não façam tal coisa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolos” é depreciativo e pode sugerir “ídolos imundos” ou “ídolos de esterco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: prestaram culto
  rationale: O verbo עבד significa literalmente “servir”, mas, com ídolos como objeto, designa serviço religioso. “Prestaram culto” comunica esse sentido com naturalidade em português sem reduzir a ação a mera reverência interior.
- source_word: הַגִּלֻּלִים
  choice: os ídolos
  rationale: גִּלֻּלִים é uma designação fortemente depreciativa para ídolos. “Ídolos” é a forma clara e corrente no texto principal; a carga de desprezo é registrada em nota.
- source_word: אֲשֶׁר
  choice: a respeito dos quais
  rationale: O relativo liga a proibição divina aos ídolos e à prática idólatra mencionada. A expressão preserva essa relação sem tornar a frase obscura.
- source_word: אָמַר יְהוָה לָהֶם
  choice: Yahweh lhes havia dito
  rationale: O perfeito após a ação narrativa aponta naturalmente para uma ordem anterior. O nome divino יהוה é transliterado como “Yahweh”.
- source_word: לֹא תַעֲשׂוּ
  choice: Não façam
  rationale: A forma verbal expressa uma proibição dirigida ao povo no plural. O imperativo negativo é direto, atual e natural em português.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: tal coisa
  rationale: A expressão hebraica refere-se ao ato ou prática que acaba de ser mencionado. “Tal coisa” conserva a referência anafórica e soa mais idiomático em português do que “esta coisa”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Sentido cultual de עבד
  choice: prestaram culto
  alternative: serviram; adoraram
  rationale: No contexto, o verbo descreve serviço religioso prestado aos ídolos. “Prestaram culto” torna isso claro, enquanto “serviram” poderia ser entendido de modo não religioso e “adoraram” estreitaria um pouco o campo semântico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala divina usa uma proibição direta no plural, evitando tanto arcaísmo quanto coloquialismo excessivo.
