source:
  edition: WLC
  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: pt
  text: Pois Israel rompeu com a casa de Davi, e fizeram de Jeroboão, filho de Nebate, rei; Jeroboão desviou Israel de seguir Yahweh[a] e levou Israel a cometer um grande pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “afastou Israel de seguir Yahweh”. O verbo hebraico pode significar afastar ou desencaminhar.'
    reason: alternativa lexical
lexical_decisions:
- source_word: קָרַע
  choice: rompeu com
  rationale: O verbo significa literalmente rasgar ou arrancar. No contexto da ruptura política com a dinastia davídica, “rompeu com” conserva parte da força da imagem e soa natural em português.
- source_word: מֵעַל בֵּית דָּוִד
  choice: com a casa de Davi
  rationale: A expressão indica separação da autoridade da dinastia de Davi. Com o verbo “romper”, a preposição idiomática em português é “com”.
- source_word: וַיַּמְלִיכוּ
  choice: constituiu ... rei
  rationale: A forma causativa de מלך indica instalar ou fazer alguém reinar. “Constituiu ... rei” expressa isso com clareza e dignidade.
- source_word: וַיַּדַּח
  choice: desviou
  rationale: O verbo pode indicar afastar à força ou desencaminhar. “Desviou” comunica aqui a ação de Jeroboão ao levar Israel à apostasia, enquanto a nota preserva a amplitude lexical.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: de seguir Yahweh
  rationale: A expressão idiomática hebraica significa deixar de seguir Yahweh; a formulação portuguesa preserva a imagem de seguimento e a relação de fidelidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְהֶחֱטֵיאָם
  choice: levou o povo a cometer
  rationale: A forma causativa de חטא atribui a Jeroboão a responsabilidade de induzir os israelitas ao pecado. “O povo” torna natural em português a referência plural do sufixo hebraico ao Israel coletivo.
- source_word: חֲטָאָה גְדוֹלָה
  choice: um grande pecado
  rationale: Tradução direta do substantivo com adjetivo, preservando a ênfase na gravidade do pecado sem acrescentar interpretação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e pactual em transliteração, sem substituí-lo por um título.
- issue: Agência de Jeroboão na apostasia de Israel
  choice: desviou Israel ... e levou o povo a cometer
  alternative: afastou Israel ... e os fez pecar
  rationale: A tradução mantém a força causativa dos dois verbos sem eliminar a possível nuance de coerção ou desencaminhamento no primeiro.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Rompeu com” exprime naturalmente a cisão política; “constituiu ... rei” mantém o sentido causativo em registro solene sem arcaísmo excessivo. A referência a Israel alterna entre coletivo singular e povo, acompanhando de modo idiomático a oscilação hebraica entre singular e plural.
