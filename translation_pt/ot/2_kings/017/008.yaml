  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: pt
  text: Viviam segundo os estatutos das nações que Yahweh havia expulsado de diante dos israelitas[a] e segundo os costumes que os reis de Israel haviam estabelecido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “os filhos de Israel”; isto é, os israelitas.
    reason: lexical_alternative
  - marker: b
    text: 'A expressão hebraica é elíptica; também pode ser traduzida: “e segundo o que os reis de Israel haviam feito”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Viviam segundo
  rationale: O verbo הלך significa literalmente “andar”, mas, neste contexto ético e pactual, descreve a maneira de viver ou de proceder. “Viviam segundo” comunica naturalmente a metáfora em português.
- source_word: בְּחֻקּוֹת
  choice: segundo os estatutos
  rationale: חֻקּוֹת designa prescrições estabelecidas e também práticas fixadas. “Estatutos” preserva o caráter normativo do termo, enquanto a preposição é expressa idiomaticamente por “segundo”.
- source_word: הַגּוֹיִם
  choice: das nações
  rationale: Neste contexto histórico, גּוֹיִם se refere aos povos não israelitas que habitavam a terra. “Nações” é uma tradução corrente e evita conotações teológicas desnecessárias.
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: que Yahweh havia expulsado de diante de
  rationale: No hiphil, ירש pode significar “desapossar” ou “expulsar”. “Expulsado de diante de” preserva tanto a ação quanto a expressão espacial מִפְּנֵי.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora a forma hebraica seja literalmente “filhos de Israel”, ela funciona aqui como designação coletiva do povo de Israel. “Israelitas” é claro e natural; a forma literal é registrada em nota.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: e segundo os costumes que os reis de Israel haviam estabelecido
  rationale: A oração hebraica é elíptica e retoma implicitamente a ideia de práticas ou estatutos segundo os quais o povo vivia. “Costumes que ... haviam estabelecido” torna explícito o complemento implícito sem ocultar a construção alternativa, indicada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual, em vez de substituí-lo por um título.
- issue: Referente do sujeito na cláusula final elíptica
  choice: os reis de Israel estabeleceram os costumes seguidos pelo povo
  alternative: segundo o que os reis de Israel haviam feito
  rationale: A sequência mantém como tema a conduta de Israel segundo padrões estabelecidos. A formulação principal explicita essa retomada, mas a nota conserva a alternativa mais literal e a ambiguidade da elipse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora hebraica de “andar” foi expressa pelo idiomático “viver segundo”; “estatutos” mantém o tom formal na primeira ocorrência, e “costumes” esclarece a retomada elíptica na cláusula final.
