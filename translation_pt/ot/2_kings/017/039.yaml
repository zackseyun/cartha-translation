id: 2KI.17.39
reference: 2 Kings 17:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: pt
  text: Mas temam Yahweh, seu Deus, e ele os livrará da mão de todos os seus inimigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “da mão de todos os seus inimigos”, expressão que significa “do poder ou controle de todos os seus inimigos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: A expressão introduz um contraste com a proibição anterior de temer outros deuses. “Mas” comunica esse valor adversativo naturalmente, sem tornar explícita demais uma exclusividade apenas implícita no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Embora אֱלֹהִים tenha forma plural, a referência a Yahweh e a concordância contextual exigem sentido singular; “seu” dirige-se coletivamente ao grupo.
- source_word: תִּירָאוּ
  choice: temam
  rationale: O imperfeito hebraico tem força injuntiva neste contexto. “Temam” conserva tanto a ideia de temor reverente quanto a forma direta da instrução.
- source_word: וְהוּא
  choice: e ele
  rationale: Mantém o pronome explícito do hebraico sem intensificá-lo indevidamente com “ele mesmo”.
- source_word: יַצִּיל
  choice: livrará
  rationale: O hifil de נצל indica libertar ou resgatar de perigo ou domínio; “livrará” é natural no contexto e mantém a formulação pactual.
- source_word: מִיַּד
  choice: da mão de
  rationale: Preserva a imagem idiomática hebraica de estar sob a mão, isto é, sob o poder ou controle de alguém.
- source_word: כָּל אֹיְבֵיכֶם
  choice: todos os seus inimigos
  rationale: Representa diretamente o quantificador e o substantivo plural, em português corrente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o nome pactual de Deus. “Yahweh” preserva o nome próprio em transliteração, sem substituí-lo por um título.
- issue: Sentido de ירא em relação a Deus
  choice: temam
  alternative: reverenciem
  rationale: “Temam” preserva a amplitude do verbo, que neste contexto inclui temor reverente e lealdade religiosa; “reverenciem” poderia suavizar indevidamente seu peso.
translation_notes:
  register: Português moderno, claro e digno, com tratamento coletivo por “seu/os”. A ordem foi ajustada à sintaxe natural do português, e a metáfora hebraica “da mão de” foi preservada e explicada em nota.
