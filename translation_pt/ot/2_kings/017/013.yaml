  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: pt
  text: 'Contudo, Yahweh advertiu solenemente[a] Israel e Judá por meio de cada um dos seus profetas e de cada vidente, dizendo: “Abandonem os seus maus caminhos e guardem os meus mandamentos e os meus estatutos, de acordo com toda a lei que ordenei aos seus pais[b] e que enviei a vocês por meio dos meus servos, os profetas[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “testemunhou contra Israel e Judá”. O verbo hebraico pode indicar tanto uma advertência solene como um testemunho contra alguém.'
    reason: lexical_alternative
  - marker: b
    text: “Seus pais” também pode ser entendido como “seus antepassados”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “por intermédio dos meus servos, os profetas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: advertiu solenemente
  rationale: O hifil de עוּד pode expressar advertência solene ou testemunho contra alguém. A formulação comunica a força jurídica e profética sem tornar a frase artificial em português; a alternativa é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: Israel e Judá
  rationale: Com o verbo עוּד e a preposição ב, são os destinatários — e potencialmente os alvos — da advertência; o objeto direto em português mantém essa abertura contextual.
- source_word: בְּיַד כָּל נְבִיאוֹ כָל חֹזֶה
  choice: por meio de cada um dos seus profetas e de cada vidente
  rationale: ביד é um idioma instrumental, adequadamente expresso por “por meio de”. “Cada um dos seus profetas” reflete o sufixo possessivo, e a repetição de “cada” preserva a força distributiva.
- source_word: חֹזֶה
  choice: vidente
  rationale: Mantém a distinção lexical em relação a “profeta” e designa aquele que recebe ou contempla visões.
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: Abandonem os seus maus caminhos
  rationale: שׁוב seguido de מן pede afastamento ou mudança de direção. “Abandonem” soa natural e comunica claramente o imperativo, sem substituir o verbo pelo termo teológico mais interpretativo “arrependam-se”.
- source_word: וְשִׁמְרוּ
  choice: e guardem
  rationale: No contexto da aliança, שׁמר significa guardar, observar ou cumprir. “Guardem” conserva a metáfora e é português bíblico claro.
- source_word: מִצְוֺתַי חֻקּוֹתַי
  choice: os meus mandamentos e os meus estatutos
  rationale: Preserva os dois termos jurídicos distintos e o vocabulário reconhecível da aliança.
- source_word: כְּכָל הַתּוֹרָה
  choice: de acordo com toda a Lei
  rationale: Neste contexto de mandamentos e estatutos, תּוֹרָה tem sentido de lei ou instrução normativa. A inicial maiúscula indica o corpo reconhecível da Lei sem acrescentar uma identificação não expressa.
- source_word: אֲשֶׁר צִוִּיתִי אֶת אֲבֹתֵיכֶם
  choice: que ordenei aos seus pais
  rationale: A construção hebraica permite em português “ordenar algo a alguém”. “Pais” conserva o termo masculino e histórico; “antepassados” é indicado em nota como sentido possível.
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: e que enviei a vocês por meio dos meus servos, os profetas
  rationale: Mantém a oração relativa ligada naturalmente à Lei/instrução e verte ביד como mediação. A aposição “os profetas” identifica os servos sem fundir os termos.
theological_decisions:
- issue: Referente de “que enviei a vocês”
  choice: A oração permanece gramaticalmente ligada à Lei/instrução que Deus enviou por mediação profética.
  alternative: Pode referir-se de maneira mais ampla às mensagens proféticas ou retomar toda a exortação precedente.
  rationale: A sintaxe favorece a ligação com “toda a Lei”, mas a tradução não acrescenta explicação que elimine a amplitude possível da referência.
- issue: Força forense de וַיָּעַד
  choice: “advertiu solenemente” no texto, com a alternativa “testemunhou contra” em nota.
  alternative: “testemunhou contra Israel e Judá”
  rationale: O contexto inclui exortação e juízo, e o verbo comporta tanto advertência solene quanto testemunho acusatório. A nota preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa, mantém “Yahweh” e preserva vocabulário pactual reconhecível. Os marcadores [a], [b] e [c] aparecem no texto; [a] foi posicionado ao fim da citação para não interromper a abertura narrativa, enquanto [b] e [c] seguem as expressões específicas.
