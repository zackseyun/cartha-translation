  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: pt
  text: 'Então disseram ao rei da Assíria: “As nações que exilaste e estabeleceste nas cidades de Samaria não conhecem o costume[a] do deus da terra[b]. Por isso, ele enviou leões entre elas; e eis que os leões as estão matando, porque elas não conhecem o costume do deus da terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “lei”, “norma” ou “prática prescrita”; aqui se refere à maneira de culto considerada devida à divindade da terra.
    reason: lexical_alternative
  - marker: b
    text: Ou “Deus da terra”. O hebraico pode se referir ao Deus de Israel; a minúscula no texto principal preserva a perspectiva pagã relatada nas palavras dos falantes.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Conserva o sentido coletivo e étnico dos diversos grupos populacionais transferidos pela Assíria, sem as associações posteriores que «gentios» poderia evocar.
- source_word: הִגְלִיתָ
  choice: exilaste
  rationale: Expressa a remoção forçada indicada pelo hifil de גלה e mantém a segunda pessoa singular do discurso dirigido ao rei.
- source_word: וַתּוֹשֶׁב
  choice: estabeleceste
  rationale: Reproduz de modo natural o sentido causativo de fazer habitar ou instalar essas populações em outro lugar.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: nas cidades de Samaria
  rationale: Preserva a construção hebraica e a referência à região de Samaria, não apenas à cidade principal.
- source_word: מִשְׁפַּט
  choice: costume
  rationale: Neste contexto, designa a norma ou prática prescrita para o culto da divindade vinculada à terra; «costume» comunica esse sentido sem sugerir apenas uma decisão judicial.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: o deus da terra
  rationale: A minúscula preserva a perspectiva territorial e pagã dos interlocutores dentro do discurso citado, embora no contexto narrativo o referente seja o Deus de Israel.
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: Por isso, ele enviou leões para o meio delas
  rationale: «Por isso» torna explícita a relação causal entendida no relato, enquanto «para o meio delas» representa de forma idiomática בָּם.
- source_word: וְהִנָּם מְמִיתִים אוֹתָם
  choice: e eles as estão matando
  rationale: O presente progressivo conserva o caráter contínuo do particípio; os pronomes deixam claro que os leões estão matando pessoas pertencentes às nações mencionadas.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: porque elas não conhecem
  rationale: «Porque» expressa com clareza a força causal da oração neste contexto.
theological_decisions:
- issue: Uso de maiúscula ou minúscula em «deus da terra»
  choice: «deus da terra» em minúscula no texto principal
  alternative: «Deus da terra»
  rationale: A minúscula mantém a perspectiva dos falantes, que concebem a divindade em termos territoriais, sem negar que o referente, na narrativa, seja o Deus de Israel.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais de segunda pessoa singular para conservar o discurso direto ao rei. Evitaram-se arcaísmos como «eis que» quando o caráter vívido já é transmitido pela construção progressiva e pelo encadeamento da frase.
