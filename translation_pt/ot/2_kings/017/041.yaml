  text: וַ/יִּהְי֣וּ הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֶת פְּסִֽילֵי/הֶ֖ם הָי֣וּ עֹֽבְדִ֑ים גַּם בְּנֵי/הֶ֣ם וּ/בְנֵ֣י בְנֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עָשׂ֤וּ אֲבֹתָ/ם֙ הֵ֣ם עֹשִׂ֔ים עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: pt
  text: Assim, essas nações temiam Yahweh, mas continuavam servindo às suas imagens esculpidas.[a] Também os seus filhos e os filhos de seus filhos continuam fazendo até hoje o mesmo que seus antepassados fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus ídolos”. O termo hebraico se refere especificamente a imagens feitas por entalhe ou escultura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Assim, ...
  rationale: O waw consecutivo introduz a conclusão resumida da seção; “Assim” expressa esse valor de resultado.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: essas nações
  rationale: Refere-se aos grupos étnicos estrangeiros instalados em Samaria; “nações” conserva a referência coletiva.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: temiam Yahweh
  rationale: Preserva a expressão religiosa hebraica sem decidir se esse temor era sincero, sincrético ou apenas exterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama.
- source_word: וְאֶת פְּסִילֵיהֶם
  choice: mas ... às suas imagens esculpidas
  rationale: פְּסִילִים designa imagens cultuais produzidas por entalhe ou escultura. “Mas” torna natural em português o contraste implícito na justaposição hebraica.
- source_word: הָיוּ עֹבְדִים
  choice: continuavam servindo
  rationale: A construção perifrástica indica uma prática habitual ou contínua; “servindo” mantém o sentido amplo de serviço cultual.
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: Também os seus filhos e os filhos de seus filhos
  rationale: Conserva a repetição genealógica do hebraico e comunica a continuidade por várias gerações.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: o mesmo que seus antepassados fizeram
  rationale: Expressa naturalmente a comparação; “antepassados” comunica aqui melhor a referência ancestral de אֲבֹתָם.
- source_word: הֵם עֹשִׂים עַד הַיּוֹם הַזֶּה
  choice: continuam fazendo até hoje
  rationale: O particípio indica prática em curso, e “até hoje” é a forma idiomática portuguesa da expressão temporal hebraica.
theological_decisions:
- issue: Coexistência do temor de Yahweh com o serviço a imagens
  choice: “temiam Yahweh, mas continuavam servindo às suas imagens esculpidas”
  alternative: “fingiam temer Yahweh enquanto serviam aos seus ídolos”
  rationale: O hebraico afirma as duas práticas lado a lado sem determinar a sinceridade ou a natureza exata desse temor. A tradução preserva a tensão e não acrescenta um julgamento sobre as motivações.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Yahweh” preserva o nome divino; “imagens esculpidas” mantém a especificidade lexical, e “continuavam” explicita o aspecto habitual das construções hebraicas.
