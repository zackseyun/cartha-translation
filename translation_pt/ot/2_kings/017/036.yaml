reference: 2 Kings 17:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: pt
  text: Mas temam a Yahweh[a], que os tirou da terra do Egito com grande poder e com braço estendido; a ele se curvem e a ele ofereçam sacrifícios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pelo contrário, temam a Yahweh”. A expressão hebraica inicial estabelece contraste entre Yahweh e os outros deuses.'
    reason: alternative_reading
  - marker: b
    text: «Temam» aqui inclui reverência e lealdade à aliança, não apenas terror.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: 'No contexto, a expressão estabelece contraste com os outros deuses mencionados anteriormente: não a eles, mas a Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: הֶעֱלָה אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: que os tirou da terra do Egito
  rationale: Em contexto do êxodo, o hifil de עלה comunica fazer sair ou conduzir para fora; “tirou” é natural em português e mantém a fórmula histórica.
- source_word: בְּכֹחַ גָּדוֹל
  choice: com grande poder
  rationale: Expressa adequadamente o uso instrumental da preposição e a magnitude do poder divino.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: e braço estendido
  rationale: Preserva a imagem tradicional do êxodo e soa natural em coordenação com “com grande poder”.
- source_word: אֹתוֹ תִירָאוּ
  choice: temam a Yahweh
  rationale: Mantém o verbo “temer”, que neste contexto abrange temor reverente e lealdade cultual, e explicita o referente para produzir uma abertura natural em português.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: diante dele vocês se curvarão
  rationale: Conserva a imagem corporal de inclinar-se ou prostrar-se, sem reduzi-la ao termo interpretativo mais amplo “adorar”.
- source_word: וְלוֹ תִזְבָּחוּ
  choice: somente a ele oferecerão sacrifícios
  rationale: “Oferecer sacrifícios” é idiomático em português; “somente” torna natural a ênfase da repetição hebraica de לֹו no contexto contrastivo.
theological_decisions:
- issue: Forma portuguesa do nome יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto apresenta diretamente o tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de ירא no contexto da aliança e do culto
  choice: temam
  alternative: reverenciem
  rationale: “Temam” preserva a amplitude e a tensão do termo hebraico, que aqui não indica mero terror, mas inclui reverência e fidelidade cultual.
- issue: Valor de כִּי אִם no início do versículo
  choice: Mas
  alternative: Antes; Pelo contrário; Somente
  rationale: A conjunção introduz a alternativa positiva às proibições anteriores e contrapõe Yahweh aos outros deuses.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém “temer” e a imagem de curvar-se, preservando o vocabulário e a tensão cultual do hebraico; a segunda pessoa do plural é vertida por “vocês”.
