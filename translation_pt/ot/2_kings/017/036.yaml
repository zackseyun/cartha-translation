  source_fidelity: A redação capta corretamente o contraste inicial, o nome divino, o êxodo, o grande poder e a imagem do braço estendido. Contudo, «somente» acrescenta uma exclusividade que não é expressa lexicalmente no hebraico, e «diante dele» é menos direto que o dativo repetido «a ele». Os imperfeitos finais, no contexto de instrução, são melhor expressos como imperativos coordenados, preservando a sequência cultual do texto.
  naturalness: A revisão mantém português moderno e claro, com legibilidade brasileira. «A ele se curvem e a ele ofereçam sacrifícios» é natural, solene sem ser arcaico, e reproduz a ênfase da repetição hebraica.
  terminology: «Yahweh», «temam», «braço estendido» e «ofereçam sacrifícios» são escolhas adequadas. «Temam» conserva a amplitude de ירא, sem a reduzir a terror ou simplesmente a adoração.
