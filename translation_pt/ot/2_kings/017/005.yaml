base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: pt
  text: Então o rei da Assíria avançou por toda a terra e subiu contra[a] Samaria, e a sitiou durante três anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «subiu a Samaria». O verbo hebraico pode indicar simples subida ou avanço militar; o cerco mencionado em seguida favorece aqui o sentido hostil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: avançou
  rationale: עלה significa literalmente “subir”, mas em narrativa militar pode indicar avanço de tropas. “Avançou” comunica naturalmente esse sentido no primeiro uso.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Reproduz de modo claro e convencional a construção hebraica, definida pelo contexto.
- source_word: בְּכָל הָאָרֶץ
  choice: por toda a terra
  rationale: A preposição בְּ aqui indica movimento pela extensão do território; a tradução evita especificar além do texto se houve conquista de cada parte.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: subiu contra Samaria
  rationale: Preserva a imagem hebraica de subir e, com “contra”, expressa o avanço militar indicado pelo cerco que se segue.
- source_word: וַיָּצַר עָלֶיהָ
  choice: cercando-a
  rationale: צור neste contexto designa cercar uma cidade militarmente. O gerúndio liga com naturalidade o avanço contra Samaria ao cerco prolongado, sem alterar a sequência dos fatos.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: durante três anos
  rationale: Forma portuguesa natural e inequívoca de expressar a duração do cerco.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantém-se “terra”, em vez de “país”, para não impor uma concepção política moderna; “subiu contra” conserva o idioma espacial e militar hebraico.
