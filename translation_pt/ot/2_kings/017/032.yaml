  text: וַ/יִּהְי֥וּ יְרֵאִ֖ים אֶת יְהוָ֑ה וַ/יַּעֲשׂ֨וּ לָ/הֶ֤ם מִ/קְצוֹתָ/ם֙ כֹּהֲנֵ֣י בָמ֔וֹת וַ/יִּהְי֛וּ עֹשִׂ֥ים לָ/הֶ֖ם בְּ/בֵ֥ית הַ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: pt
  text: Eles temiam Yahweh e nomearam para si, dentre o seu próprio povo[a], sacerdotes dos lugares altos[b], os quais serviam em favor deles nos santuários dos lugares altos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é idiomática, literalmente relacionada às “extremidades” deles. Pode indicar uma escolha feita entre o povo em geral, sem a devida distinção; alguns a entendem como “dentre todas as suas classes”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, sacerdotes que serviam em centros locais de culto, em vez de no santuário central.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: temiam Yahweh
  rationale: Preserva o sentido básico de temor reverente e mantém a tensão narrativa entre reconhecer Yahweh e participar de práticas cultuais ilegítimas; “adoravam” seria mais interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מִקְצוֹתָם
  choice: dentre o seu próprio povo
  rationale: Expressa de modo natural a seleção feita dentro do próprio grupo, sem impor a interpretação discutível de que eram necessariamente os membros das classes mais baixas.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: nomearam para si
  rationale: Quando pessoas são constituídas em uma função, עשה pode ter o sentido de fazer ou nomear; a expressão também conserva a ideia reflexiva de לָהֶם.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: sacerdotes dos lugares altos
  rationale: Mantém tanto o ofício cultual quanto o termo técnico usado em Reis para centros locais de culto.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: os quais serviam em favor deles
  rationale: A construção perifrástica indica atividade contínua dos sacerdotes em benefício do povo, sem especificar ritos que o verbo não explicita.
- source_word: בְּבֵית הַבָּמוֹת
  choice: nos santuários dos lugares altos
  rationale: Comunica naturalmente em português as estruturas de culto associadas aos lugares altos; o singular construto pode ter valor coletivo neste contexto.
theological_decisions:
- issue: Tensão entre temer Yahweh e manter um culto ilegítimo
  choice: Eles temiam Yahweh e nomearam... sacerdotes dos lugares altos
  alternative: Eles diziam temer Yahweh, mas nomearam...
  rationale: A coordenação simples segue o hebraico e preserva a tensão sem afirmar que o temor era apenas fingido nem acrescentar um contraste explícito ausente do texto.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Lugares altos” preserva o termo técnico bíblico; “santuários” esclarece de modo natural o valor coletivo de בֵּית sem recorrer ao termo mais específico “templos”.
