  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: pt
  text: Yahweh ficou muito irado com Israel e os afastou de diante da sua face[a]. Não restou ninguém, exceto a tribo de Judá, somente ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da sua presença”. O hebraico diz mais literalmente: “de diante da sua face”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: ficou muito irado
  rationale: O hitpael de אנף, intensificado por מְאֹד, expressa ira intensa. A formulação é natural, digna e preserva a força da expressão hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: בְּיִשְׂרָאֵל
  choice: com Israel
  rationale: Com verbos de ira, a preposição ב marca o alvo da ira. Em português, 'irado com Israel' expressa isso de maneira idiomática.
- source_word: וַיְסִרֵם
  choice: e o afastou
  rationale: A forma causativa de סור significa fazer retirar ou afastar. O sufixo plural refere-se coletivamente ao povo de Israel; em português, o singular coletivo concorda com 'Israel' sem explicitar além do texto a ideia de exílio.
- source_word: מֵעַל פָּנָיו
  choice: de diante da sua face
  rationale: Mantém a imagem antropomórfica concreta do hebraico. A alternativa mais idiomática, 'da sua presença', aparece em nota.
- source_word: לֹא נִשְׁאַר
  choice: Não restou ninguém
  rationale: Comunica com clareza o sentido do nifal de שׁאר no contexto de pessoas ou grupos remanescentes.
- source_word: רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: exceto somente a tribo de Judá
  rationale: Preserva tanto a partícula de exceção רַק quanto a ênfase de לְבַדּוֹ, ainda que haja reforço semântico deliberado.
theological_decisions:
- issue: Expressão antropomórfica da presença divina em מֵעַל פָּנָיו
  choice: de diante da sua face
  alternative: da sua presença
  rationale: A tradução principal conserva a imagem concreta e a tensão teológica do hebraico, enquanto a nota oferece a equivalência idiomática.
- issue: Referente de Israel
  choice: Mantido como Israel, no singular coletivo
  alternative: os israelitas ou o reino do Norte
  rationale: O contexto identifica Israel com o reino do Norte, mas o versículo não deve ser expandido interpretativamente na tradução.
- issue: Alcance de 'não restou ninguém'
  choice: Entendido em relação a Israel no juízo descrito, em contraste com Judá
  alternative: Declaração absoluta sobre todo o povo da aliança
  rationale: A estrutura do versículo contrapõe o Israel removido à tribo de Judá que permaneceu; a tradução não amplia essa afirmação além do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se o nome Yahweh e a imagem hebraica 'diante da sua face'; a pontuação divide as duas afirmações para facilitar a leitura.
