review_pass:
  verdict: revise
  source_fidelity: A omissão de «Por isso» é necessária, pois a conjunção hebraica não exige uma inferência causal explícita. O sufixo de וַיְסִרֵם é plural e deve ser conservado em português («os afastou»), embora «Israel» funcione como antecedente coletivo. A tradução mantém adequadamente a imagem concreta de «diante da sua face» e a ênfase final sobre Judá.
  naturalness: «Exceto somente» é uma combinação pouco natural em português. «Exceto a tribo de Judá, somente ela» é mais fluente, ao mesmo tempo que conserva a ênfase de לְבַדּוֹ. A redação revisada permanece moderna, clara e de registro digno.
  terminology: «Yahweh», «Israel» e «Judá» estão corretos e consistentes. «Ficou muito irado com Israel» é uma formulação natural e suficientemente forte para o hebraico intensificado.
  issues:
  - severity: medium
    issue: «Por isso» introduz uma relação causal que não está expressa de modo específico no hebraico.
    rationale: O waw narrativo pode ser traduzido simplesmente pela coordenação ou omitido em português. «Por isso» torna explícita uma inferência contextual e vai além do enunciado imediato.
  - severity: medium
    issue: «O afastou» neutraliza o sufixo plural de וַיְסִרֵם.
    rationale: Embora «Israel» seja um coletivo, o hebraico se refere ao povo no plural. «Os afastou» preserva esse traço sem precisar acrescentar «os israelitas».
  - severity: low
    issue: «Exceto somente» é redundante e pouco idiomático.
    rationale: A ênfase hebraica de רַק e לְבַדּוֹ pode ser mantida com uma construção portuguesa mais natural.
  revised_text: Yahweh ficou muito irado com Israel e os afastou de diante da sua face[a]. Não restou ninguém, exceto a tribo de Judá, somente ela.
  revised_footnotes:
  - marker: a
    text: 'Ou: “da sua presença”. O hebraico diz mais literalmente: “de diante da sua face”.'
    reason: lexical_alternative
