revisions:
- from: Por isso, Yahweh ficou muito irado com Israel e o afastou de diante da sua face[a]. Não restou ninguém, exceto somente a tribo de Judá.
  to: Yahweh ficou muito irado com Israel e os afastou de diante da sua face[a]. Não restou ninguém, exceto a tribo de Judá, somente ela.
  rationale: A revisão remove a causalidade explícita não exigida pelo original, restaura o objeto plural do verbo «afastou» e melhora a formulação da exceção, preservando a ênfase de que apenas Judá permaneceu. A nota continua corretamente ancorada na expressão antropomórfica hebraica.
