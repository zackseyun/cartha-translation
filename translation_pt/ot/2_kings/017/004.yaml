  text: וַ/יִּמְצָא֩ מֶֽלֶךְ אַשּׁ֨וּר בְּ/הוֹשֵׁ֜עַ קֶ֗שֶׁר אֲשֶׁ֨ר שָׁלַ֤ח מַלְאָכִים֙ אֶל ס֣וֹא מֶֽלֶךְ מִצְרַ֔יִם וְ/לֹא הֶעֱלָ֥ה מִנְחָ֛ה לְ/מֶ֥לֶךְ אַשּׁ֖וּר כְּ/שָׁנָ֣ה בְ/שָׁנָ֑ה וַֽ/יַּעַצְרֵ֨/הוּ֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּאַסְרֵ֖/הוּ בֵּ֥ית כֶּֽלֶא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: pt
  text: Então o rei da Assíria descobriu que Oseias conspirava[a], pois ele havia enviado mensageiros a Sô, rei do Egito,[b] e não havia entregado o tributo ao rei da Assíria, como fazia ano após ano.[c] Por isso, o rei da Assíria o deteve e o amarrou na prisão.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “encontrou uma conspiração em Oseias”; a expressão indica que detectou nele uma trama ou deslealdade.
    reason: lexical_alternative
  - marker: b
    text: “Sô” translitera o nome hebraico. A identidade histórica desse rei egípcio é incerta.
    reason: cultural_note
  - marker: c
    text: O hebraico também pode ser traduzido por “não havia feito subir o tributo [...] ano após ano”.
    reason: lexical_alternative
  - marker: d
    text: 'O hebraico distingue duas ações: o rei da Assíria primeiro deteve Oseias e depois o amarrou na prisão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... קֶשֶׁר בְּהוֹשֵׁעַ
  choice: descobriu que Oseias conspirava
  rationale: Expressa em português natural o idioma hebraico que, literalmente, diz que o rei 'encontrou uma conspiração em Oseias', isto é, detectou sua trama desleal.
- source_word: שָׁלַח מַלְאָכִים
  choice: havia enviado mensageiros
  rationale: O mais-que-perfeito composto esclarece que o envio ocorreu antes da descoberta; 'mensageiros' mantém o sentido amplo, adequado também a enviados diplomáticos.
- source_word: סוֹא
  choice: Sô
  rationale: Translitera a forma hebraica do nome sem impor uma identificação histórica incerta; o acento evita leitura inadequada em português.
- source_word: מִנְחָה
  choice: tributo
  rationale: No contexto da relação entre um vassalo e o rei assírio, o termo designa o pagamento político devido, não uma oferta religiosa.
- source_word: לֹא הֶעֱלָה
  choice: não havia entregado
  rationale: O hebraico diz literalmente 'não fizera subir'. 'Entregado' comunica de modo atual o pagamento do tributo sem introduzir um meio específico de remessa.
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: como fazia ano após ano
  rationale: Torna explícita em português a repetição anual pressuposta pelo idioma hebraico, sem alterar seu referente contextual.
- source_word: וַיַּעַצְרֵהוּ
  choice: o deteve
  rationale: O verbo indica restrição ou detenção e é mantido distinto do ato seguinte de prendê-lo com vínculos.
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: o pôs acorrentado na prisão
  rationale: Preserva o sentido básico de 'amarrar/prender com vínculos' e traduz idiomaticamente בֵּית כֶּלֶא como 'prisão'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação evita literalismos pouco naturais, mas as notas preservam o idioma hebraico, a incerteza histórica quanto a Sô e a distinção entre deter e prender com vínculos.
