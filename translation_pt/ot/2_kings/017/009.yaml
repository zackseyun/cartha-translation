source:
  edition: WLC
  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: pt
  text: Os filhos de Israel fizeram em segredo coisas que não eram certas contra Yahweh, seu Deus[a], e construíram para si lugares altos[b] em todas as suas cidades[c], desde a torre de vigia até a cidade fortificada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encobriram coisas que não eram certas a respeito de Yahweh, seu Deus”. O verbo hebraico é raro e pode ter o sentido de ocultar algo ou de agir em segredo.'
    reason: lexical_alternative
  - marker: b
    text: “Lugares altos” eram locais de culto, muitas vezes associados a práticas não autorizadas.
    reason: cultural_note
  - marker: c
    text: A expressão “desde a torre de vigia até a cidade fortificada” indica toda a terra, desde o menor posto de observação até a cidade mais protegida.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: fizeram em segredo
  rationale: O verbo חפא é raro e pode indicar ocultação ou ação secreta. No contexto, rege “coisas” e introduz atos de infidelidade; “fizeram em segredo” comunica a ação clandestina sem eliminar a possibilidade lexical de encobrimento, registrada em nota.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: coisas que não eram certas
  rationale: A expressão hebraica é idiomática. Esta formulação natural preserva a avaliação moral do texto sem especificar indevidamente quais foram os atos.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: contra Yahweh, seu Deus
  rationale: Neste contexto de apostasia, עַל tem sentido adversativo. “Contra” preserva a ideia de oposição, enquanto “seu Deus” mantém a relação pactual expressa no hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: construíram para si lugares altos
  rationale: “Lugares altos” conserva o termo cultual tradicional para santuários locais, e “para si” representa לָהֶם, sugerindo culto estabelecido por iniciativa própria.
- source_word: בְּכָל עָרֵיהֶם
  choice: em todas as suas cidades
  rationale: Tradução direta e natural da expressão locativa.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: desde a torre de vigia
  rationale: A expressão designa uma pequena instalação de observação e inicia um merismo que abrange toda a terra.
- source_word: עַד עִיר מִבְצָר
  choice: até a cidade fortificada
  rationale: Completa o merismo, passando do menor posto de observação ao centro urbano protegido.
theological_decisions:
- issue: Natureza das ações ocultas de Israel
  choice: Atos impróprios praticados secretamente contra Yahweh
  alternative: Assuntos encobertos ou declarações falsas a respeito de Yahweh
  rationale: O verbo raro permite mais de uma nuance, mas o objeto “coisas” e a sequência sobre a construção de lugares altos favorecem atos concretos de infidelidade cultual. A tradução mantém tanto o caráter secreto quanto a oposição a Deus, sem definir além do que o hebraico afirma.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “filhos de Israel” para refletir a expressão hebraica e conserva “lugares altos” como termo cultual, explicado em nota. A ordem dos marcadores acompanha diretamente os termos explicados.
