  text: וַ/יִּמְאֲס֣וּ אֶת חֻקָּ֗י/ו וְ/אֶת בְּרִית/וֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת אֲבוֹתָ֔/ם וְ/אֵת֙ עֵֽדְוֺתָ֔י/ו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑/ם וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י הַ/הֶ֨בֶל֙ וַ/יֶּהְבָּ֔לוּ וְ/אַחֲרֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔/ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔/ם לְ/בִלְתִּ֖י עֲשׂ֥וֹת כָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: pt
  text: Rejeitaram os seus estatutos e a sua aliança, que ele havia feito com os pais deles, bem como os seus testemunhos, pelos quais os havia advertido.[a] Foram atrás do que é vazio[b] e se tornaram vazios;[c] foram também atrás das nações que estavam ao redor deles, a respeito das quais Yahweh lhes havia ordenado que não agissem como elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os seus testemunhos, com os quais testemunhou contra eles”; a expressão hebraica também pode indicar advertências solenes.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica também pode significar “o que é inútil” ou “sem valor” e, neste contexto, pode aludir aos ídolos.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega palavras relacionadas: eles foram atrás do que é vazio e se tornaram vazios — isto é, tornaram-se semelhantes àquilo que buscavam.'
    reason: wordplay
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Rejeitaram
  rationale: Expressa com clareza a recusa deliberada indicada por מָאַס, sem acrescentar necessariamente a carga afetiva de “desprezaram”.
- source_word: חֻקָּיו
  choice: os seus estatutos
  rationale: Mantém o sentido jurídico e pactual de prescrições estabelecidas.
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: a sua aliança, que ele havia feito
  rationale: “Fazer uma aliança” traduz naturalmente a expressão idiomática hebraica literalmente equivalente a “cortar uma aliança”.
- source_word: אֲבוֹתָם
  choice: os pais deles
  rationale: Preserva a formulação masculina concreta do hebraico e a expressão pactual tradicional, sem generalizá-la silenciosamente para “antepassados”.
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: os seus testemunhos, pelos quais os havia advertido
  rationale: Conserva o valor lexical de “testemunhos” e comunica a função de advertência do verbo relacionado, mantendo em nota a possível leitura forense.
- source_word: הַהֶבֶל וַיֶּהְבָּלוּ
  choice: o que é vazio e se tornaram vazios
  rationale: Reproduz em português a relação intencional entre o substantivo e o verbo hebraicos, com linguagem atual; a nota registra os sentidos de inutilidade e a possível referência a ídolos.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: as nações que estavam ao redor deles
  rationale: Identifica naturalmente os povos circunvizinhos sem usar “gentios”, termo menos preciso neste contexto histórico.
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: que não agissem como elas
  rationale: Expressa em português natural o hebraico conciso “não fazer como elas”, sem especificar práticas além do que o contexto afirma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de הֶבֶל no contexto da idolatria
  choice: o que é vazio
  alternative: ídolos / o que é inútil
  rationale: A tradução mantém a metáfora aberta de vazio, inutilidade e futilidade, sem restringir o referente apenas aos ídolos; a implicação idolátrica permanece disponível no contexto e na nota.
- issue: Valor de עֵדוֹתָיו e הֵעִיד בָּם
  choice: os seus testemunhos, pelos quais os havia advertido
  alternative: as suas advertências / os testemunhos que apresentou contra eles
  rationale: A formulação preserva simultaneamente a terminologia pactual e a força admonitória, sem eliminar a possível nuance judicial de testemunho contra Israel.
- issue: Representação do nome יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz o nome divino, e a transliteração o distingue de títulos como “Senhor”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e a repetição de “foram atrás” preservam o movimento retórico do hebraico; “embora” torna explícita em português a oposição contextual sem alterar a proibição. Todos os marcadores aparecem no texto na ordem [a], [b], [c].
