base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: pt
  text: Ali queimaram incenso em todos os lugares altos, como as nações que Yahweh havia expulsado de diante deles[a]; e fizeram coisas más para provocar a ira de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “havia levado ao exílio para longe deles”. O verbo hebraico pode indicar levar ao exílio, deportar ou remover; aqui se refere às nações desapropriadas da terra.'
    reason: Alternativa lexical para הֶגְלָה, cuja amplitude semântica inclui tanto exílio/deportação quanto remoção.
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: queimaram incenso
  rationale: O piel de קטר indica fazer subir fumaça em contexto cultual, muitas vezes pela queima de incenso. Esta formulação é natural em português e adequada ao culto ilícito nos lugares altos.
- source_word: שָׁם
  choice: Ali
  rationale: Reproduz o advérbio hebraico e retoma naturalmente os locais de culto mencionados no contexto.
- source_word: בְּכָל בָּמוֹת
  choice: em todos os lugares altos
  rationale: “Lugares altos” conserva o sentido técnico de בָּמוֹת como santuários ou locais de culto, sem reduzi-los apenas a elevações geográficas.
- source_word: כַּגּוֹיִם
  choice: como as nações
  rationale: גּוֹיִם designa aqui os povos anteriormente presentes na terra; “nações” evita a conotação posterior e mais específica de “gentios”.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: que Yahweh havia expulsado de diante deles
  rationale: Neste contexto de tomada e ocupação da terra, a expressão comunica a remoção dos povos anteriores. A nota preserva a possibilidade lexical de deportação ou exílio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: fizeram coisas más
  rationale: Tradução direta, clara e abrangente da condenação moral hebraica, sem especificar atos que o texto não enumera.
- source_word: לְהַכְעִיס אֶת יְהוָה
  choice: para provocar a ira de Yahweh
  rationale: O hiphil de כעס significa causar ira ou provocar. A formulação explicita em português o resultado inerente ao verbo e mantém Yahweh como aquele contra quem os atos são dirigidos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e pactual em vez de substituí-lo por um título.
- issue: Sentido de הֶגְלָה no contexto da conquista
  choice: havia expulsado de diante deles
  alternative: havia levado ao exílio para longe deles; havia removido de diante deles
  rationale: O contexto aponta para a retirada e desapropriação dos povos que ocupavam a terra. “Expulsado” comunica esse quadro histórico, enquanto a nota registra a amplitude lexical do verbo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário internacional. “Lugares altos” é mantido como termo cultual técnico, e o paralelismo narrativo do hebraico é preservado com uma formulação natural.
