  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: pt
  text: Eles abandonaram todos os mandamentos de Yahweh, seu Deus, fizeram para si imagens fundidas, dois bezerros, fizeram uma Aserá[a], prostraram-se diante de todo o exército dos céus e serviram a Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um objeto de culto de Aserá». O termo hebraico pode designar a deusa cananeia Aserá ou um objeto associado ao seu culto.
    reason: alternativa lexical e preservação de ambiguidade
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: abandonaram
  rationale: Expressa o abandono deliberado das obrigações da aliança, com força maior que simplesmente «deixaram».
- source_word: כָּל מִצְוֺת
  choice: todos os mandamentos
  rationale: Preserva tanto a totalidade indicada por כָּל quanto o sentido pactual de מִצְוֺת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיהֶם
  choice: seu Deus
  rationale: Mantém o sufixo possessivo e sua relevância para a relação de aliança.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: fizeram para si
  rationale: Representa o dativo pronominal, indicando objetos produzidos para seu próprio uso cultual.
- source_word: מַסֵּכָה שנים עֲגָלִים
  choice: imagens de metal fundido — dois bezerros
  rationale: Comunica o modo de fabricação indicado por מַסֵּכָה e identifica as imagens como os dois bezerros. O plural em português produz uma relação natural com «dois bezerros», sem alterar o referente.
- source_word: אֲשֵׁירָה
  choice: uma Aserá
  rationale: Conserva o termo hebraico em forma aportuguesada e não decide indevidamente entre a deusa e seu objeto de culto.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: prostraram-se diante de
  rationale: Preserva o gesto físico de reverência cultual, sem reduzi-lo ao termo mais genérico «adoraram».
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: diante de todo o exército dos céus
  rationale: Mantém a metáfora coletiva do hebraico para os corpos ou poderes celestes.
- source_word: וַיַּעַבְדוּ
  choice: serviram
  rationale: Preserva o sentido de serviço cultual e a distinção em relação ao verbo anterior de prostração.
- source_word: הַבָּעַל
  choice: Baal
  rationale: Emprega a forma natural do nome da divindade em português; o artigo hebraico não precisa ser reproduzido.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração o preserva sem substituí-lo por um título.
- issue: Referente de אֲשֵׁירָה
  choice: uma Aserá
  alternative: um poste de Aserá; a deusa Aserá
  rationale: O verbo «fizeram» favorece um objeto de culto, mas o substantivo pode designar a deusa ou seu símbolo; a tradução mantém essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com coordenação verbal direta. «Aserá» segue a forma aportuguesada usual; «exército dos céus» conserva a imagem hebraica. O marcador [a] foi colocado junto ao termo que a nota explica.
