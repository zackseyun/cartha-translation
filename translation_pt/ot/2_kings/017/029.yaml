base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: pt
  text: Mas cada povo continuava fazendo seus próprios deuses e os colocou nos santuários dos lugares altos que os habitantes de Samaria[a] haviam feito, cada povo nas cidades onde morava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os samaritanos”.'
    reason: Tradução alternativa de הַשֹּׁמְרֹנִים; a forma direta pode ser entendida historicamente como os habitantes de Samaria, sem necessariamente indicar a comunidade samaritana posterior.
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: continuava fazendo
  rationale: A construção com היה e particípio indica ação habitual ou contínua no passado; a formulação preserva esse aspecto em português natural.
- source_word: גּוֹי גּוֹי
  choice: cada povo
  rationale: A repetição tem força distributiva, indicando que cada grupo agia separadamente. “Povo” é natural no contexto de populações reassentadas.
- source_word: אֱלֹהָיו
  choice: seus próprios deuses
  rationale: O sufixo possessivo retoma distributivamente cada povo, e “próprios” torna clara a distinção entre as divindades dos diferentes grupos.
- source_word: וַיַּנִּיחוּ
  choice: os colocava
  rationale: O verbo significa pôr ou depositar. O singular concorda distributivamente com “cada povo”, enquanto o pronome retoma “deuses”.
- source_word: בְּבֵית הַבָּמוֹת
  choice: nos santuários dos lugares altos
  rationale: A expressão designa estruturas cultuais ligadas aos lugares altos; “santuários” comunica o sentido com clareza sem reproduzir de modo rígido o singular idiomático “casa”.
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: que os habitantes de Samaria haviam feito
  rationale: A expressão identifica o povo da região/cidade de Samaria neste contexto histórico, evitando que o leitor suponha automaticamente a comunidade samaritana posterior.
- source_word: בְּעָרֵיהֶם
  choice: nas cidades
  rationale: O sentido possessivo é recuperado naturalmente pela construção distributiva e pela oração seguinte, sem tornar a frase pesada.
- source_word: אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: onde morava
  rationale: A oração indica o local de residência; o singular acompanha de modo natural o distributivo “cada povo”.
theological_decisions:
- issue: Sentido histórico de הַשֹּׁמְרֹנִים
  choice: os habitantes de Samaria
  alternative: os samaritanos
  rationale: A escolha evita impor ao relato associações sectárias posteriores, mas a alternativa mais direta é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “cada povo” foi mantida para preservar a estrutura distributiva enfática do hebraico.
