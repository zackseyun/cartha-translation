  text: אֶת יְהוָ֖ה הָי֣וּ יְרֵאִ֑ים וְ/אֶת אֱלֹֽהֵי/הֶם֙ הָי֣וּ עֹֽבְדִ֔ים כְּ/מִשְׁפַּט֙ הַ/גּוֹיִ֔ם אֲשֶׁר הִגְל֥וּ אֹתָ֖/ם מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: pt
  text: Temiam a Yahweh[a], mas serviam aos seus próprios deuses, conforme o costume das nações das quais haviam sido deportados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Temiam a Yahweh e serviam aos seus deuses”. Em hebraico, a conjunção é simplesmente “e”; “mas” explicita o contraste sugerido pelo contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הָיוּ יְרֵאִים
  choice: temiam
  rationale: A construção com היה e particípio indica ação habitual ou contínua; “temiam” é natural e mantém a ideia de temor reverente.
- source_word: אֱלֹהֵיהֶם
  choice: seus próprios deuses
  rationale: Expressa o sufixo possessivo e torna perceptível o contraste com Yahweh sem acrescentar uma identificação alheia ao texto.
- source_word: הָיוּ עֹבְדִים
  choice: serviam
  rationale: Mantém de perto o sentido de עבד no contexto do culto prestado a divindades e preserva o paralelismo verbal.
- source_word: כְּמִשְׁפַּט
  choice: conforme o costume
  rationale: Neste contexto, מִשְׁפָּט designa prática ou costume estabelecido, não sentença judicial.
- source_word: הַגּוֹיִם
  choice: das nações
  rationale: É a correspondência direta e adequada para os diversos povos envolvidos no contexto histórico.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: das quais haviam sido deportados
  rationale: Reproduz de modo natural em português a formulação hebraica de sentido impessoal/passivo e comunica a transferência forçada de população.
theological_decisions:
- issue: Valor adversativo da conjunção entre temer Yahweh e servir outros deuses
  choice: mas
  alternative: e
  rationale: Embora וְ seja formalmente “e”, o contexto apresenta uma tensão sincrética. “Mas” explicita essa relação discursiva; a nota preserva a forma mais literal e a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Haviam sido deportados” é historicamente preciso e mais natural do que uma reprodução literal da construção hebraica. O nome Yahweh é mantido em transliteração.
