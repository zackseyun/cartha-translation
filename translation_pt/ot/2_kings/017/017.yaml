  text: וַֽ֠/יַּעֲבִירוּ אֶת בְּנֵי/הֶ֤ם וְ/אֶת בְּנֽוֹתֵי/הֶם֙ בָּ/אֵ֔שׁ וַ/יִּקְסְמ֥וּ קְסָמִ֖ים וַ/יְנַחֵ֑שׁוּ וַ/יִּֽתְמַכְּר֗וּ לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: pt
  text: Fizeram seus filhos e suas filhas passar pelo fogo[a], praticaram adivinhação e interpretaram presságios. Venderam-se para fazer o que era mau aos olhos de Yahweh e para provocar a sua ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito, “sacrificaram seus filhos e suas filhas no fogo”. A expressão idiomática hebraica diz literalmente: “fizeram [...] passar pelo fogo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: fizeram ... passar pelo fogo
  rationale: Preserva literalmente o idioma hebraico e sua ressonância intertextual, sem definir no texto principal a forma exata do rito; o contexto aponta para sacrifício infantil ou rito de fogo relacionado.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: seus filhos e suas filhas
  rationale: Mantém a menção explícita dos dois grupos, preservando a ênfase e a gravidade da declaração hebraica.
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: praticaram adivinhação
  rationale: Expressão portuguesa natural para a construção cognata hebraica, conservando com clareza o sentido de prática divinatória.
- source_word: וַיְנַחֵשׁוּ
  choice: interpretaram presságios
  rationale: Comunica a observação e interpretação divinatória de sinais e distingue esta prática do termo anterior, mais geral, para adivinhação.
- source_word: וַיִּתְמַכְּרוּ
  choice: venderam-se
  rationale: Retém a metáfora forte do hitpael de מכר, que retrata entrega voluntária e autoescravização à prática do mal.
- source_word: לַעֲשׂוֹת הָרַע
  choice: para fazer o que era mau
  rationale: Formulação idiomática que representa o infinitivo hebraico e o uso genérico do substantivo adjetivado com artigo.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica comum de avaliação divina e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, em conformidade com a prática do projeto.
- source_word: לְהַכְעִיסוֹ
  choice: provocando-o à ira
  rationale: Preserva a força causativa do hebraico e expressa a ofensa que suscita a ira divina.
theological_decisions:
- issue: Natureza do rito infantil com fogo
  choice: Manter no texto principal o idioma “fizeram seus filhos e suas filhas passar pelo fogo”.
  alternative: “sacrificaram seus filhos e suas filhas no fogo” ou “queimaram seus filhos e suas filhas no fogo”
  rationale: Embora o contexto favoreça fortemente a referência a sacrifício infantil, a formulação hebraica não especifica por si só todos os detalhes do rito. A tradução conserva essa tensão, e a nota informa o sentido provável.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: Preserva o nome pessoal no texto e mantém a convenção adotada pelo projeto.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A ordem das orações acompanha de perto o hebraico; a divisão em duas frases evita uma sequência excessivamente longa. O pronome em “provocando-o” retoma Yahweh sem ambiguidade.
