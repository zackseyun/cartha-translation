  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: pt
  text: Os homens da Babilônia fizeram Sucote-Benote[a]; os homens de Cuta fizeram Nergal; e os homens de Hamate fizeram Asima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sucote-Benote provavelmente é o nome de uma divindade estrangeira ou de um objeto de culto. O significado do nome é incerto; por isso, ele é transliterado, e não traduzido.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: os homens de
  rationale: Reproduz diretamente o plural construto de אִישׁ e preserva a fórmula masculina repetida no hebraico. Neste contexto, também pode designar coletivamente os habitantes de cada lugar.
- source_word: עָשׂוּ
  choice: fizeram
  rationale: É o equivalente mais direto do verbo comum עשה. Opções como «fabricaram» ou «ergueram» especificariam além do que o texto afirma.
- source_word: סֻכּוֹת בְּנוֹת
  choice: Sucote-Benote
  rationale: O nome, de sentido e referente exatos incertos, é transliterado segundo padrões naturais do português, em vez de receber uma tradução etimológica especulativa.
- source_word: בָבֶל
  choice: Babilônia
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: כּוּת
  choice: Cute
  rationale: Transliteração portuguesa do topônimo hebraico, evitando a aparência gráfica pouco natural de «Cuth» em português.
- source_word: נֵרְגַל
  choice: Nergal
  rationale: Nome próprio de uma divindade mesopotâmica; a transliteração preserva o referente histórico sem acrescentar uma interpretação ao texto.
- source_word: חֲמָת
  choice: Hamate
  rationale: Forma portuguesa tradicional do topônimo hebraico.
- source_word: אֲשִׁימָא
  choice: Asima
  rationale: Nome próprio de uma divindade estrangeira, transliterado sem tradução especulativa.
theological_decisions:
- issue: Se os objetos de עָשׂוּ devem ser explicitamente chamados de ídolos ou deuses
  choice: Manter apenas os nomes próprios como objetos de «fizeram».
  alternative: Acrescentar «o ídolo» ou dizer que fizeram cada figura «seu deus».
  rationale: O hebraico traz simplesmente o verbo «fazer» seguido dos objetos diretos. Embora o contexto cultual indique divindades ou objetos de culto, acrescentar «ídolo» ou «deus» resolveria no texto principal algo que a formulação original deixa implícito.
- issue: Sentido coletivo de אַנְשֵׁי
  choice: Traduzir literalmente por «os homens de».
  alternative: Traduzir por «o povo de» ou pelos gentílicos «os babilônios», «os habitantes de Cute» e «os habitantes de Hamate».
  rationale: A expressão pode funcionar coletivamente para os habitantes, mas sua forma é explicitamente masculina plural. A tradução direta preserva esse dado e a repetição retórica do versículo.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes adequadas à leitura brasileira e amplamente reconhecíveis. A repetição «os homens de... fizeram» foi mantida para refletir a estrutura hebraica. O marcador [a] aparece no texto principal.
