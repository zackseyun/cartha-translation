source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: pt
  text: Isso aconteceu porque os filhos de Israel haviam pecado contra Yahweh, seu Deus, que os havia tirado da terra do Egito, de debaixo da mão do faraó, rei do Egito[a], e haviam temido outros deuses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do poder do faraó». A expressão hebraica diz literalmente «de debaixo da mão do faraó».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «haviam adorado outros deuses». O hebraico diz «haviam temido outros deuses», usando um verbo que pode incluir reverência e devoção expressas na adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Isso aconteceu porque
  rationale: Expressa de modo natural em português a introdução narrativa e a força causal de כִּי, sem recorrer à fórmula arcaica «e aconteceu que».
- source_word: חָטְאוּ
  choice: haviam pecado
  rationale: O mais-que-perfeito composto convém à explicação retrospectiva da calamidade narrada no contexto e preserva o sentido religioso e moral de חטא.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão nacional e pactual do hebraico, tradicional e ainda compreensível em português.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: contra Yahweh, seu Deus
  rationale: Com חטא, a preposição indica pecado cometido contra alguém. «Yahweh» representa o nome divino, e «seu Deus» conserva a relação pactual enfatizada pelo texto.
- source_word: הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: que os havia tirado da terra do Egito
  rationale: Embora o verbo signifique literalmente «fazer subir», neste contexto descreve a saída do Egito; «tirado» comunica essa ação redentora com naturalidade sem alterar seu referente.
- source_word: מִתַּחַת יַד פַּרְעֹה
  choice: de debaixo da mão do faraó
  rationale: Preserva a imagem hebraica da mão como domínio ou poder, esclarecida em nota.
- source_word: וַיִּירְאוּ
  choice: haviam temido
  rationale: Mantém o sentido lexical de ירא e sua possível amplitude entre temor, reverência e devoção cultual, sem reduzi-lo silenciosamente a «adorar».
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Correspondência direta e natural que também preserva a linguagem pactual da proibição de seguir outras divindades.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome pactual יהוה; a transliteração «Yahweh» o distingue do título «Senhor» e evita substituir o nome por um título.
- issue: Sentido religioso de וַיִּירְאוּ aplicado a outros deuses
  choice: haviam temido outros deuses
  alternative: haviam adorado outros deuses; haviam reverenciado outros deuses
  rationale: O contexto implica devoção idólatra, mas o verbo empregado é «temer». A tradução principal conserva essa formulação e a tensão semântica, enquanto a nota informa o sentido cultual possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe retrospectiva usa o mais-que-perfeito composto. Conservam-se «filhos de Israel», o nome «Yahweh» e a imagem hebraica «de debaixo da mão», enquanto notas breves explicam os dois possíveis pontos de estranheza.
