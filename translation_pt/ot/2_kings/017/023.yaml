  text: עַ֠ד אֲשֶׁר הֵסִ֨יר יְהוָ֤ה אֶת יִשְׂרָאֵל֙ מֵ/עַ֣ל פָּנָ֔י/ו כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד כָּל עֲבָדָ֣י/ו הַ/נְּבִיאִ֑ים וַ/יִּ֨גֶל יִשְׂרָאֵ֜ל מֵ/עַ֤ל אַדְמָת/וֹ֙ אַשּׁ֔וּרָ/ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: pt
  text: até que Yahweh afastou Israel de diante dele[a], conforme tinha falado por meio de todos os seus servos, os profetas. Então Israel foi deportado de sua terra para a Assíria, até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “de diante de seu rosto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: afastou
  rationale: O hifil de סור expressa fazer retirar ou afastar. “Afastou” é natural em português e se liga bem à expressão “de sua presença”, sem acrescentar uma ideia mais específica de banimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor”.
- source_word: מֵעַל פָּנָיו
  choice: de sua presença
  rationale: A expressão hebraica é literalmente “de diante de seu rosto”; “de sua presença” comunica em português atual o sentido idiomático sem eliminar a dimensão pessoal do juízo.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: conforme havia falado
  rationale: Preserva tanto a comparação quanto a noção de cumprimento do anúncio profético anterior.
- source_word: בְּיַד
  choice: por meio de
  rationale: O hebraísmo “pela mão de” indica agência. “Por meio de” transmite esse valor com naturalidade em português.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: seus servos, os profetas
  rationale: A aposição identifica os profetas como servos de Yahweh e permanece clara com a vírgula explicativa.
- source_word: וַיִּגֶל
  choice: foi deportado
  rationale: Neste contexto histórico, גלה descreve a remoção forçada da população para o exílio. “Foi deportado” preserva essa força melhor que uma formulação que pudesse sugerir partida voluntária.
- source_word: אַדְמָתוֹ
  choice: sua terra
  rationale: “Terra” conserva o sentido territorial de אֲדָמָה e concorda naturalmente com Israel como entidade coletiva.
- source_word: אַשּׁוּרָה
  choice: para a Assíria
  rationale: A terminação direcional indica movimento em direção à Assíria.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: permanece lá até hoje
  rationale: No contexto, a fórmula temporal caracteriza a continuidade do exílio, embora “permanece lá” esteja implícito e por isso seja explicitado e documentado em nota.
theological_decisions:
- issue: Sentido de מֵעַל פָּנָיו no juízo divino
  choice: de sua presença
  alternative: de diante dele; literalmente, de diante de seu rosto
  rationale: A opção conserva a dimensão relacional e judicial da retirada de Israel, sem definir metafisicamente o alcance da presença divina.
- issue: Continuidade indicada por עַד הַיּוֹם הַזֶּה
  choice: e permanece lá até hoje
  alternative: até hoje
  rationale: A explicitação associa naturalmente a expressão ao estado de exílio resultante, sem converter a observação histórica do narrador em uma afirmação doutrinária atemporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O hebraísmo בְּיַד foi vertido idiomaticamente; a imagem concreta de מֵעַל פָּנָיו foi preservada em nota. A forma coletiva singular “Israel foi deportado” acompanha o hebraico.
