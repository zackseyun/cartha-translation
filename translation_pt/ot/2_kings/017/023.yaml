    issue: Acréscimo de «e permanece lá»
    rationale: O hebraico diz literalmente que Israel foi deportado de sua terra para a Assíria «até o dia de hoje»; não contém o verbo «permanece» nem o advérbio locativo «lá». Embora a continuidade possa ser inferida no contexto narrativo, a tradução não deve explicitá-la como parte do texto.
  - severity: low
    issue: Nota b não é necessária e apresenta uma alternativa ligada ao acréscimo interpretativo
    rationale: Uma vez removido «e permanece lá», a nota deixa de ter função. A expressão temporal pode ser vertida diretamente sem nota.
