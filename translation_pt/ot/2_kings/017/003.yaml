base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: pt
  text: Salmaneser, rei da Assíria, avançou contra ele, e Oseias tornou-se seu servo[a] e lhe pagou tributo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tornou-se seu vassalo”. O hebraico diz literalmente “tornou-se seu servo”, empregando linguagem de subordinação política.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: avançou contra ele
  rationale: Em contexto militar, a expressão indica avançar contra alguém. A escolha preserva o sentido hostil sem afirmar além do texto que já tenha ocorrido um ataque pleno.
- source_word: שַׁלְמַנְאֶסֶר
  choice: Salmaneser
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Reproduz naturalmente em aposição o título e o domínio do rei.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: tornou-se seu servo
  rationale: A construção expressa mudança de condição. “Servo” preserva a linguagem hebraica de subordinação, enquanto o contexto político indica uma relação de vassalagem, não escravidão pessoal.
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: lhe pagou tributo
  rationale: No contexto geopolítico, a expressão descreve o pagamento de tributo por um governante subordinado; esta formulação é clara e natural em português.
- source_word: מִנְחָה
  choice: tributo
  rationale: Embora a palavra possa significar presente ou oferta em outros contextos, aqui designa o tributo devido a um soberano estrangeiro.
