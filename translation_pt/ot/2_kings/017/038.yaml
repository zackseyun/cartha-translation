  text: וְ/הַ/בְּרִ֛ית אֲשֶׁר כָּרַ֥תִּי אִתְּ/כֶ֖ם לֹ֣א תִשְׁכָּ֑חוּ וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: pt
  text: E não se esqueçam da aliança que fiz com vocês[a], nem temam outros deuses.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a aliança que cortei com vocês”; “fiz” traduz em português natural a expressão hebraica usada para estabelecer uma aliança.
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “vocês não se esquecerão... e não temerão outros deuses”. As formas hebraicas podem expressar proibições ou instruções.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  choice: a aliança
  rationale: Preserva o sentido formal e teológico de uma relação vinculante estabelecida por Deus; “acordo” seria menos preciso.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: que fiz com vocês
  rationale: Traduz naturalmente a expressão idiomática hebraica que, literalmente, diz “cortei com vocês” em referência ao estabelecimento de uma aliança.
- source_word: לֹא תִשְׁכָּחוּ
  choice: não se esqueçam
  rationale: O imperfeito com לֹא tem aqui força proibitiva; o imperativo negativo é natural em português e mantém o tom de instrução.
- source_word: וְלֹא תִירְאוּ
  choice: nem temam
  rationale: Mantém o verbo “temer”, que neste contexto pode abranger reverência, culto e lealdade religiosa, sem reduzir sua amplitude semântica.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: É a tradução direta e corrente da fórmula bíblica para divindades além do Deus de Israel.
theological_decisions:
- issue: Tom das proibições da aliança
  choice: 'Usar imperativos negativos: “não se esqueçam... nem temam”.'
  alternative: 'Usar futuro com valor normativo: “vocês não se esquecerão... nem temerão”.'
  rationale: As formas hebraicas expressam proibição ou instrução. Em português moderno, o imperativo negativo comunica essa função com clareza, enquanto a nota preserva a alternativa formal.
- issue: Amplitude religiosa do verbo ירא
  choice: Traduzir por “temer”.
  alternative: Traduzir por “reverenciar” ou “adorar”.
  rationale: “Temer” preserva a formulação da aliança e sua tensão semântica entre medo, reverência e lealdade religiosa; opções como “adorar” explicitariam apenas parte do sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” como plural de alcance internacional e boa legibilidade brasileira. A coordenação “não... nem...” soa natural e reproduz a sequência das duas proibições.
