  text: וַ/יִּתֹּץ֙ אֶת בָּתֵּ֣י הַ/קְּדֵשִׁ֔ים אֲשֶׁ֖ר בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁ֣ר הַ/נָּשִׁ֗ים אֹרְג֥וֹת שָׁ֛ם בָּתִּ֖ים לָ/אֲשֵׁרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: pt
  text: Ele demoliu os aposentos dos prostitutos cultuais[a] que ficavam na Casa de Yahweh, onde as mulheres teciam ali coberturas[b] para a Aserá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico está no masculino plural e significa literalmente “consagrados”. Neste contexto, é tradicionalmente entendido como referência a homens ligados a práticas sexuais cultuais.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “casas”. O sentido da expressão é incerto; pode referir-se a coberturas, cortinas ou outros tecidos feitos para a Aserá.
    reason: alternative_reading
  - marker: c
    text: “A Aserá” pode designar tanto a deusa Aserá como o objeto cultual associado a ela, muitas vezes chamado de poste de Aserá.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: demoliu
  rationale: O verbo נתץ descreve a derrubada ou demolição de estruturas; “demoliu” transmite com naturalidade a força da ação.
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: os aposentos dos prostitutos cultuais
  rationale: Embora בָּתֵּי signifique literalmente “casas de”, no recinto do templo provavelmente designa aposentos ou dependências. הַקְּדֵשִׁים é masculino plural e, neste contexto, refere-se a homens ligados à prostituição ritual.
- source_word: בְּבֵית יְהוָה
  choice: na Casa de Yahweh
  rationale: Mantém a imagem hebraica de “casa” e translitera o nome divino, distinguindo-o de um título.
- source_word: אֹרְגוֹת
  choice: teciam
  rationale: O particípio feminino plural indica a atividade exercida pelas mulheres naquele lugar; o pretérito imperfeito é idiomático na narrativa portuguesa.
- source_word: בָּתִּים
  choice: coberturas
  rationale: Literalmente “casas”, mas o objeto do ato de tecer provavelmente eram peças têxteis, como coberturas, cortinas ou estruturas semelhantes a pequenos santuários. “Coberturas” comunica essa interpretação sem especificar demais.
- source_word: לָאֲשֵׁרָה
  choice: para a Aserá
  rationale: A forma com artigo procura conservar a possibilidade de referência tanto à divindade Aserá quanto ao objeto cultual que a representava, sem impor “poste” no texto principal.
theological_decisions:
- issue: Identidade dos הַקְּדֵשִׁים
  choice: prostitutos cultuais
  alternative: consagrados; pessoas envolvidas em práticas sexuais cultuais
  rationale: O contexto da reforma de Josias favorece a referência a homens envolvidos em prática sexual cultual ilícita. O masculino do hebraico é mantido explicitamente, sem ampliar o termo para um grupo de gênero indeterminado.
- issue: Sentido de אֲשֵׁרָה
  choice: a Aserá
  alternative: Aserá; o poste de Aserá; o objeto sagrado de Aserá
  rationale: O termo pode indicar a deusa ou seu objeto cultual. A tradução principal conserva essa tensão, e a nota apresenta as possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Aposentos” evita a impressão enganosa de casas independentes dentro do templo; “prostitutos cultuais” explicita o masculino hebraico; “Casa de Yahweh” preserva a formulação e o nome divino do original.
