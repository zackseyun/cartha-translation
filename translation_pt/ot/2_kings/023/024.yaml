  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: pt
  text: Além disso, Josias eliminou os médiuns, os consultores de espíritos, os deuses domésticos, os ídolos e todas as coisas abomináveis que havia na terra de Judá e em Jerusalém, a fim de pôr em vigor as palavras da Lei escritas no livro[a] que o sacerdote Hilquias encontrou na casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no rolo”. A palavra hebraica pode designar um documento escrito em forma de rolo.
    reason: Alternativa lexical que esclarece a provável forma física do documento.
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: Preserva a força aditiva e liga naturalmente esta medida às reformas anteriores.
- source_word: הָאֹבוֹת
  choice: os médiuns
  rationale: No contexto, designa pessoas associadas à consulta aos mortos; “médiuns” é claro e atual.
- source_word: הַיִּדְּעֹנִים
  choice: os adivinhos
  rationale: Termo paralelo para praticantes do ocultismo. “Adivinhos” é compreensível em português e evita formulações arcaicas, embora não reproduza toda a possível associação específica com espíritos.
- source_word: הַתְּרָפִים
  choice: os deuses domésticos
  rationale: Expressa a função provável dos terafins como objetos ou divindades do culto familiar.
- source_word: הַגִּלֻּלִים
  choice: os ídolos
  rationale: Tradução clara do termo pejorativo para imagens idolátricas; a conotação de desprezo não pode ser reproduzida literalmente sem artificialidade.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: todas as coisas abomináveis
  rationale: Mantém a amplitude do termo, que pode abranger objetos e práticas religiosamente detestáveis.
- source_word: נִרְאוּ
  choice: que havia
  rationale: Traduz idiomaticamente a ideia de coisas que estavam presentes ou visíveis em Judá e Jerusalém.
- source_word: בִּעֵר
  choice: eliminou
  rationale: Comunica a remoção completa de pessoas e objetos diversos sem especificar indevidamente o método.
- source_word: לְמַעַן הָקִים
  choice: a fim de pôr em vigor
  rationale: Expressa propósito e a ideia de fazer com que as palavras da Lei fossem efetivamente observadas, sem sugerir cumprimento profético.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: as palavras da Lei
  rationale: Refere-se às determinações da instrução pactual contidas no documento encontrado.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: escritas no livro
  rationale: Formulação natural em português; a possível forma física de rolo é indicada em nota.
- source_word: בֵּית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de Yahweh”, compreensível no contexto do templo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino conforme a política declarada do projeto, sem substituí-lo por um título.
- issue: Sentido de לְמַעַן הָקִים em relação à Lei
  choice: a fim de pôr em vigor
  alternative: a fim de cumprir; a fim de confirmar
  rationale: Mantém o propósito de implementar as palavras da Lei e evita a possível leitura de que se trata do cumprimento de uma previsão.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “Lei” com inicial maiúscula por se referir ao corpo específico de instrução encontrado. Conserva “casa de Yahweh” em vez de explicitar “templo”, mantendo a imagem do hebraico.
