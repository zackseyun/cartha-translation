base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: pt
  text: 'Então o rei ordenou a todo o povo: “Celebrem a Páscoa em honra de Yahweh, seu Deus, conforme está escrito neste Livro da Aliança.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה expressa uma ordem; “ordenou” é direto e natural no contexto narrativo.
- source_word: כָּל הָעָם
  choice: todo o povo
  rationale: עם designa coletivamente a população; a construção portuguesa preserva a abrangência do hebraico.
- source_word: עֲשׂוּ פֶסַח
  choice: Celebrem a Páscoa
  rationale: A expressão literalmente diz “façam uma Páscoa”, mas funciona como idioma para celebrar ou observar a festa; “celebrem” comunica isso com naturalidade.
- source_word: לַיהוָה
  choice: em honra de Yahweh
  rationale: A preposição ל indica orientação ou dedicação. “Em honra de” soa natural em português para uma celebração dedicada a Yahweh, sem reduzir a relação a mero benefício.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Reproduz o substantivo com o sufixo de segunda pessoa do plural; em português, “seu” concorda distributivamente com o povo coletivo.
- source_word: כַּכָּתוּב
  choice: conforme está escrito
  rationale: Expressa de modo corrente a conformidade com uma prescrição escrita e preserva a forma passiva do hebraico.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: neste Livro da Aliança
  rationale: Embora עַל tenha sentido básico de “sobre”, em fórmulas de escrita o português pede “em”. A posição do demonstrativo é ajustada à sintaxe natural portuguesa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido cultual de עֲשׂוּ פֶסַח
  choice: Celebrem a Páscoa
  alternative: Observem a Páscoa; façam a Páscoa
  rationale: “Celebrem” transmite o ato festivo e cultual ordenado, enquanto a tradução literal “façam” seria obscura em português. “Observem” também é possível, mas pode soar mais restrito ao cumprimento de normas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto elimina o desnecessário “dizendo” sem perder conteúdo proposicional; a relação de dedicação marcada por ל é explicitada idiomaticamente por “em honra de”.
