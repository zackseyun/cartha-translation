  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: pt
  text: Então, o rei subiu à casa de Yahweh[a], e com ele subiram todos os homens de Judá[b], todos os habitantes de Jerusalém, os sacerdotes, os profetas e todo o povo, do menor ao maior[c]. Ele leu para que todos ouvissem todas as palavras do Livro da Aliança que havia sido encontrado na casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao templo de Yahweh”. Literalmente: “à casa de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “todos os homens de Judá”. A expressão pode representar a população de Judá em geral, mas a formulação masculina foi mantida no texto.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “do menos importante ao mais importante”. A expressão hebraica abrange todo o povo, sem indicar necessariamente idade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva a ideia direcional de עלה, natural para a ida ao templo situado em lugar elevado.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica literalmente transparente; “templo de Yahweh” é uma alternativa contextual válida.
- source_word: כָל אִישׁ יְהוּדָה
  choice: todos os homens de Judá
  rationale: אִישׁ está no singular formal, mas tem sentido coletivo. A tradução conserva a formulação masculina e seu possível caráter representativo.
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלַם
  choice: todos os habitantes de Jerusalém
  rationale: Tradução corrente e precisa do particípio substantivado que designa os que moravam na cidade.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: desde o menor até o maior
  rationale: Reproduz a expressão abrangente sem restringi-la indevidamente à idade; pode indicar posição, importância ou condição.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: leu diante deles
  rationale: O objeto escrito favorece “leu”; “diante deles” comunica de modo natural a leitura pública feita para que ouvissem.
- source_word: סֵפֶר הַבְּרִית
  choice: Livro da Aliança
  rationale: Equivalente formal e consagrado que preserva a referência a um documento escrito da aliança.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama. “Yahweh” representa diretamente o nome próprio divino sem substituí-lo por um título.
- issue: Alcance do coletivo כָל אִישׁ יְהוּדָה
  choice: todos os homens de Judá
  alternative: todo o povo de Judá
  rationale: A formulação mantém o substantivo masculino presente no hebraico, sem decidir silenciosamente se ele representa toda a população.
- issue: Sentido de לְמִקָּטֹן וְעַד גָּדוֹל
  choice: desde o menor até o maior
  alternative: desde o menos importante até o mais importante
  rationale: A tradução preserva a amplitude e a tensão da expressão hebraica, evitando definir se a gradação é social, etária ou de outra natureza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em três frases evita uma sequência excessivamente longa sem alterar a progressão narrativa. “Casa de Yahweh” conserva a imagem hebraica, enquanto as notas registram alternativas relevantes e ambiguidades genuínas.
