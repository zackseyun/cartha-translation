id: 2KI.23.13
reference: 2 Kings 23:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: pt
  text: O rei profanou os lugares altos que ficavam diante de Jerusalém, à direita do monte da Destruição[a], os quais Salomão, rei de Israel, havia construído para Astarote, a abominação dos sidônios, para Camos, a abominação de Moabe, e para Milcom[b], a abominação dos amonitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao sul do monte da Destruição”, pois, na orientação geográfica hebraica, “à direita” pode indicar o sul. O monte da Destruição talvez seja a elevação posteriormente identificada com o monte das Oliveiras.
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “Milcom”; essa divindade é por vezes associada a Moloque.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Preserva o sentido cultual consagrado de locais de adoração, sem especificar indevidamente sua arquitetura.
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: diante de Jerusalém
  rationale: Mantém a expressão espacial hebraica sem resolver de modo excessivamente específico a localização como 'a leste'.
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: à direita do monte da Destruição
  rationale: Reproduz de modo transparente o hebraico 'à direita'; a possível orientação geográfica 'ao sul' é registrada em nota.
- source_word: הַר הַמַּשְׁחִית
  choice: monte da Destruição
  rationale: Traduz a designação depreciativa do texto hebraico, em vez de substituí-la pela identificação tradicional com o monte das Oliveiras.
- source_word: לְעַשְׁתֹּרֶת
  choice: para Astarote
  rationale: Transliteração portuguesa corrente do nome da divindade.
- source_word: שִׁקֻּץ צִידֹנִים
  choice: a abominação dos sidônios
  rationale: Conserva a forte censura cultual do hebraico e seu registro bíblico.
- source_word: לִכְמוֹשׁ
  choice: para Camos
  rationale: Emprega a forma portuguesa corrente do nome próprio da divindade moabita.
- source_word: שִׁקֻּץ מוֹאָב
  choice: a abominação de Moabe
  rationale: Mantém a mesma força pejorativa de שִׁקּוּץ e uma relação natural com Moabe.
- source_word: לְמִלְכֹּם
  choice: para Milcom
  rationale: Segue o texto consonantal, que traz Milcom, sem o identificar silenciosamente com Moloque.
- source_word: תּוֹעֲבַת בְּנֵי עַמּוֹן
  choice: a abominação dos amonitas
  rationale: Traduz a censura cultual com vigor e verte naturalmente 'filhos de Amom' pelo gentílico.
- source_word: טִמֵּא
  choice: profanou
  rationale: No contexto, indica que o rei tornou os santuários impróprios para o culto; 'profanou' comunica isso de forma clara e cultualmente adequada.
- source_word: הַמֶּלֶךְ
  choice: O rei
  rationale: Preserva o título usado no versículo; o contexto identifica o rei como Josias.
theological_decisions:
- issue: Designações polêmicas das divindades estrangeiras
  choice: abominação
  alternative: coisa detestável
  rationale: O hebraico emprega deliberadamente linguagem teologicamente condenatória; 'abominação' mantém essa força sem neutralizá-la.
- issue: Identificação topográfica de הַר הַמַּשְׁחִית
  choice: monte da Destruição
  alternative: monte da Corrupção; monte das Oliveiras
  rationale: A tradução conserva o nome depreciativo presente no hebraico e evita substituir o texto por uma identificação geográfica provável.
- issue: Identidade de מִלְכֹּם
  choice: Milcom
  alternative: Moloque
  rationale: O texto hebraico lê Milcom. A possível associação histórica ou tradicional com Moloque não deve substituir a leitura no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas próprias correntes em português para nomes bíblicos. A sintaxe preserva a longa cadeia relativa do hebraico, mas usa pontuação e ordem naturais. Todos os marcadores de nota aparecem no texto principal.
