  text: אַ֗ךְ לֹ֤א יַֽעֲלוּ֙ כֹּהֲנֵ֣י הַ/בָּמ֔וֹת אֶל מִזְבַּ֥ח יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם כִּ֛י אִם אָכְל֥וּ מַצּ֖וֹת בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: pt
  text: Contudo, os sacerdotes dos lugares altos[a] não subiram ao altar de Yahweh, em Jerusalém, mas comiam pães sem fermento entre seus irmãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sacerdotes dos lugares altos”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “entre seus irmãos”; provavelmente se refere aos demais sacerdotes ou a seus parentes sacerdotais.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Introduz uma ressalva ou limitação em relação às medidas de reforma narradas anteriormente, preservando o valor adversativo do hebraico.
- source_word: יַעֲלוּ
  choice: não subiam
  rationale: O verbo עלה significa subir e, neste contexto cultual, também pode sugerir aproximar-se para servir no altar. “Não subiam” conserva a imagem ligada a Jerusalém sem explicitar uma função que o texto não declara.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: os sacerdotes dos lugares altos
  rationale: Reproduz de modo transparente a construção hebraica. “Lugares altos” é a designação bíblica tradicional dos locais de culto regionais, embora nem todos fossem necessariamente pontos topograficamente elevados.
- source_word: מִזְבַּח יְהוָה
  choice: o altar de Yahweh
  rationale: Mantém a relação nominal do hebraico e apresenta o nome divino como nome próprio, em vez de substituí-lo por um título.
- source_word: כִּי אִם
  choice: mas
  rationale: 'Após a oração negativa, a expressão introduz a circunstância contrastante: eles não subiam ao altar, mas partilhavam esse alimento.'
- source_word: אָכְלוּ מַצּוֹת
  choice: comiam pães sem fermento
  rationale: Expressa em linguagem corrente o plural מַצּוֹת, tradicionalmente chamado de “pães ázimos”.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: no meio de seus irmãos
  rationale: Preserva a formulação e o termo masculino do hebraico. Pelo contexto, os “irmãos” provavelmente são outros sacerdotes ou membros de sua parentela sacerdotal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o Tetragrama como nome próprio. “Yahweh” procura representá-lo diretamente; a nota registra a substituição tradicional por “SENHOR”.
- issue: Identidade dos “irmãos” em אֲחֵיהֶם
  choice: seus irmãos
  alternative: seus colegas sacerdotes
  rationale: O contexto favorece uma referência aos demais sacerdotes, mas o substantivo hebraico diz apenas “irmãos”. A tradução preserva essa abertura, e a nota fornece a provável referência contextual.
- issue: Sentido cultual de não subir ao altar
  choice: não subiam ao altar
  alternative: não oficiavam no altar
  rationale: É possível que a frase indique exclusão do serviço sacerdotal no altar de Jerusalém, mas o texto emprega literalmente o verbo “subir”. A tradução não transforma a implicação contextual em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a imagem de “subir”, o termo bíblico “lugares altos” e a referência literal a “irmãos”, enquanto notas breves esclarecem os elementos culturais e a provável referência contextual.
