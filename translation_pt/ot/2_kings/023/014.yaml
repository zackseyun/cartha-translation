  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: pt
  text: Ele despedaçou as colunas, derrubou os aserins[a] e encheu de ossos humanos os lugares onde eles estavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “postes de Aserá”. O hebraico אֲשֵׁרִים (aserins) pode designar objetos de culto associados à deusa Aserá; o termo, por si só, não especifica a forma exata desses objetos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: despedaçou
  rationale: Expressa a destruição violenta e em pedaços indicada pelo verbo, em linguagem natural e vívida.
- source_word: הַמַּצֵּבוֹת
  choice: as colunas sagradas
  rationale: מַצֵּבָה designa pedras ou colunas erguidas para uso cultual; “sagradas” torna clara a função no contexto sem identificar uma divindade específica.
- source_word: וַיִּכְרֹת
  choice: derrubou
  rationale: No contexto de objetos cultuais ligados a Aserá, comunica de modo natural o resultado de cortá-los, sem exigir uma forma física específica.
- source_word: הָאֲשֵׁרִים
  choice: os aserins
  rationale: A transliteração preserva o termo específico e sua ambiguidade quanto à forma dos objetos cultuais associados a Aserá.
- source_word: וַיְמַלֵּא
  choice: encheu
  rationale: Reproduz o sentido básico do verbo e mantém a imagem concreta do texto.
- source_word: מְקוֹמָם
  choice: os lugares onde eles estavam
  rationale: Explicita naturalmente que o sufixo se refere aos locais ocupados pelos objetos cultuais destruídos.
- source_word: עַצְמוֹת אָדָם
  choice: ossos humanos
  rationale: אָדָם tem aqui sentido genérico, referente a seres humanos, e não especificamente a homens adultos.
theological_decisions:
- issue: Sentido de אָדָם em עַצְמוֹת אָדָם
  choice: ossos humanos
  alternative: ossos de homem
  rationale: O substantivo é genérico neste contexto; “humanos” comunica o sentido sem impor referência exclusiva ao sexo masculino.
- issue: Identificação física de הָאֲשֵׁרִים
  choice: aserins, com explicação em nota
  alternative: postes de Aserá
  rationale: O termo pode designar objetos cultuais associados a Aserá, mas por si só não determina com precisão sua forma; a transliteração preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem da última oração foi ajustada para maior naturalidade. “Aserins” preserva a ambiguidade lexical do hebraico, esclarecida em nota.
