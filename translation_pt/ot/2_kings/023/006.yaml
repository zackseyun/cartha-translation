  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: pt
  text: Ele tirou a Aserá[a] da casa de Yahweh, levou-a para fora de Jerusalém, até o vale do Cedrom, e a queimou ali. Depois, reduziu-a a pó e lançou o pó sobre as sepulturas do povo comum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o poste de Aserá” ou “a imagem de Aserá”. O termo hebraico pode designar a deusa cananeia Aserá ou o objeto de culto associado à sua adoração; aqui se refere ao objeto retirado e destruído.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: a Aserá
  rationale: Mantém o nome específico e a ambiguidade do hebraico entre a deusa e o objeto de culto associado a ela; no contexto, trata-se do objeto retirado e destruído.
- source_word: מִבֵּית יְהוָה
  choice: da casa de Yahweh
  rationale: Reproduz de modo natural a expressão hebraica e preserva o nome divino pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome próprio, em vez de substituí-lo por um título.
- source_word: מִחוּץ לִירוּשָׁלִַם
  choice: para fora de Jerusalém
  rationale: Expressa claramente o movimento desde o templo até um local além da cidade.
- source_word: נַחַל קִדְרוֹן
  choice: vale do Cedrom
  rationale: נחל pode indicar um vale ou ravina com curso de água sazonal; 'vale do Cedrom' é claro, natural e geograficamente adequado em português.
- source_word: וַיִּשְׂרֹף אֹתָהּ
  choice: e a queimou
  rationale: O pronome feminino concorda naturalmente com 'Aserá' em português sem decidir se o referente era um poste ou uma imagem.
- source_word: וַיָּדֶק לְעָפָר
  choice: reduziu-a a pó
  rationale: Comunica a pulverização completa de maneira idiomática e fiel à sequência de destruição.
- source_word: עֲפָרָהּ
  choice: o pó
  rationale: Traduz עפר como 'pó', sem restringir o sentido a cinzas resultantes da queima.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: sobre as sepulturas do povo comum
  rationale: Preserva a provável nuance social da expressão, que distingue as pessoas comuns das elites; o substantivo hebraico está no singular coletivo, mas o português natural pede 'sepulturas' neste contexto.
theological_decisions:
- issue: Sentido do termo cultual אֲשֵׁרָה
  choice: a Aserá
  alternative: o poste de Aserá; a imagem de Aserá
  rationale: A transliteração preserva a referência religiosa específica e evita definir com certeza indevida a forma exata do objeto, mantendo a força do relato sobre sua remoção e destruição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição hebraica de 'vale do Cedrom' foi condensada em 'ali' para evitar peso desnecessário sem perder a localização; a sequência narrativa e a ambiguidade cultual foram preservadas.
