  terminology: «Aserá» conserva de forma apropriada o termo cultual e sua indeterminação quanto à forma precisa do objeto. «Yahweh», «casa de Yahweh» e «vale do Cedrom» são consistentes, compreensíveis e adequados ao projeto. A nota lexical apresenta alternativas pertinentes e esclarece que, neste contexto, o referente é o objeto cultual.
