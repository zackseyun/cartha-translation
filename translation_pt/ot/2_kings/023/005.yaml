reference: 2 Kings 23:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: pt
  text: Ele pôs fim à atividade dos sacerdotes de cultos ilegítimos[a], que os reis de Judá haviam nomeado para queimar incenso nos lugares altos das cidades de Judá e nos arredores de Jerusalém, e à dos que queimavam incenso a Baal, ao sol, à lua, às constelações[b] e a todo o exército dos céus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacerdotes pagãos”. O termo hebraico designa sacerdotes ligados a cultos ilegítimos ou idólatras, não os sacerdotes legítimos do SENHOR.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos signos do zodíaco”. O termo hebraico provavelmente se refere a constelações ou agrupamentos astrais.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “o exército dos céus”, expressão também traduzida por “o exército do céu”. Aqui se refere aos corpos celestes venerados no culto astral.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: pôs fim à atuação de / acabou com
  rationale: O hifil de שׁבת indica fazer cessar. A formulação expressa a supressão da função cultual sem afirmar, além do texto, que os sacerdotes foram mortos.
- source_word: הַכְּמָרִים
  choice: sacerdotes de cultos ilegítimos
  rationale: כְּמָרִים designa sacerdotes ligados, neste contexto e em seu uso bíblico, a cultos não autorizados ou idólatras, distinguindo-os dos sacerdotes legítimos do SENHOR.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: que os reis de Judá haviam nomeado
  rationale: נתן nesta construção tem o sentido de designar ou instalar; o mais-que-perfeito explicita com naturalidade que a nomeação precedeu a reforma de Josias.
- source_word: וַיְקַטֵּר
  choice: para queimar incenso
  rationale: קטר pode indicar queimar incenso ou produzir fumaça sacrificial; no contexto cultual, esta é a tradução portuguesa mais clara e tradicional.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: Expressão consolidada para os santuários cultuais locais chamados בָּמוֹת, sem reduzi-los simplesmente a elevações geográficas.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: nas cidades de Judá e nos arredores de Jerusalém
  rationale: מְסִבֵּי indica as áreas circundantes; 'nos arredores' é natural e preciso em português.
- source_word: וְאֶת הַמְקַטְּרִים
  choice: Acabou também com os que queimavam incenso
  rationale: O particípio caracteriza outro grupo por sua prática. A nova oração reduz o peso sintático da longa enumeração sem alterar sua coordenação com o primeiro objeto.
- source_word: לַבַּעַל
  choice: a Baal
  rationale: Mantém a forma convencional do nome próprio da divindade.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: ao sol, à lua
  rationale: A repetição da preposição conserva os objetos distintos de culto enumerados no hebraico.
- source_word: וְלַמַּזָּלוֹת
  choice: às constelações
  rationale: מַזָּלוֹת provavelmente se refere a constelações ou agrupamentos zodiacais, não simplesmente às estrelas em geral; a nota preserva a alternativa.
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: e a todo o exército dos céus
  rationale: Mantém a imagem da expressão hebraica צְבָא הַשָּׁמַיִם. Neste contexto, ela se refere aos corpos celestes venerados, esclarecimento dado em nota para evitar confusão.
theological_decisions:
- issue: Se כְּמָרִים deve ser traduzido apenas como 'sacerdotes' ou marcado como um grupo cultual ilegítimo
  choice: sacerdotes de cultos ilegítimos
  alternative: sacerdotes; sacerdotes pagãos; sacerdotes idólatras
  rationale: O termo hebraico é distintivo e, no contexto da reforma de Josias, não designa indistintamente os sacerdotes do SENHOR. 'De cultos ilegítimos' comunica essa diferença sem exigir que todos fossem necessariamente estrangeiros.
- issue: Se צְבָא הַשָּׁמָיִם deve ser interpretado diretamente como 'astros'
  choice: exército dos céus, com esclarecimento em nota
  alternative: conjunto dos astros; corpos celestes
  rationale: A tradução conserva a metáfora hebraica e sua amplitude, enquanto a nota esclarece que, neste contexto de culto astral, a referência é aos corpos celestes.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A divisão em duas frases torna a enumeração extensa mais clara. A tradução preserva as expressões cultuais tradicionais “lugares altos” e “exército dos céus”, apoiadas por notas explicativas.
