  to: Ele pôs fim à atividade dos sacerdotes de cultos ilegítimos[a], que os reis de Judá haviam nomeado para queimar incenso nos lugares altos das cidades de Judá e nos arredores de Jerusalém, e à dos que queimavam incenso a Baal, ao sol, à lua, às constelações[b] e a todo o exército dos céus[c].
