  naturalness: O português é claro, moderno e apropriado ao registro bíblico. Uma construção única com paralelismo (“à atividade ... e à dos ...”) torna a relação sintática mais transparente e evita a mudança de foco entre “atuação” e “acabou com os que”.
  terminology: “Sacerdotes de cultos ilegítimos” comunica de modo prudente o valor distintivo de כְּמָרִים no contexto, sem identificá-los indevidamente com os sacerdotes levíticos. “Lugares altos”, “Baal”, “constelações” e “exército dos céus” são escolhas adequadas. As notas preservam a incerteza de מַזָּלוֹת e esclarecem corretamente a referência contextual de “exército dos céus”.
