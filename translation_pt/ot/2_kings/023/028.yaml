  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais atos de Josias e tudo o que ele fez não estão escritos[a] no Livro das Crônicas dos Reis de Judá?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “registrados”. O particípio passivo hebraico significa literalmente “escritos”, mas, neste contexto de arquivo, também pode ser entendido como “registrados”.
    reason: lexical_alternative
  - marker: b
    text: O “Livro das Crônicas dos Reis de Judá” é um registro régio citado como fonte em Reis; não se trata necessariamente dos livros bíblicos de 1–2 Crônicas em sua forma canônica final.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: os demais atos
  rationale: Na fórmula historiográfica de encerramento dos reinados, יֶתֶר indica o restante, e דִּבְרֵי abrange os atos ou feitos do rei, não apenas suas palavras.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta, abrangente e natural do resumo das ações do rei.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica hebraica, que espera resposta afirmativa, e mantém o sentido básico do particípio passivo כְּתוּבִים.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha o sentido básico de 'sobre', neste contexto documental o português idiomático pede 'escritos no livro'.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Livro das Crônicas dos Reis de Judá
  rationale: Reproduz de modo claro e reconhecível o título do registro régio citado em Reis, sem identificar automaticamente esse documento com os livros bíblicos de Crônicas.
theological_decisions:
- issue: Identidade do Livro das Crônicas dos Reis de Judá
  choice: Manter o título tradicional e esclarecer em nota que se trata de uma fonte régia citada em Reis.
  alternative: Identificá-lo diretamente com os livros canônicos de 1–2 Crônicas.
  rationale: O texto hebraico cita um registro documental, mas não afirma que seja idêntico à forma canônica final de 1–2 Crônicas; a tradução não deve resolver essa questão além da evidência textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase preserva a fórmula historiográfica e a pergunta retórica do hebraico. Não se acrescenta um marcador discursivo equivalente a “agora”, pois não há termo temporal explícito no texto-fonte.
