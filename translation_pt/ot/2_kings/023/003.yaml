source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: pt
  text: 'Então o rei ficou de pé junto à coluna e fez a aliança diante de Yahweh: seguir Yahweh e guardar seus mandamentos, seus testemunhos e seus estatutos de todo o coração e de toda a alma, para cumprir as palavras desta aliança escritas neste livro[a]. E todo o povo aderiu à aliança[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “neste rolo”. A palavra hebraica pode designar um rolo ou um livro/documento.'
    reason: cultural_note
  - marker: b
    text: 'Literalmente: “ficou de pé na aliança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: ficou de pé junto à coluna
  rationale: עָמַד significa ficar ou estar de pé, e עַל pode indicar posição junto a um lugar. A formulação evita sugerir, sem necessidade, que o rei estivesse literalmente em cima da coluna.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: fez a aliança
  rationale: כרת ברית é a expressão idiomática hebraica para estabelecer ou fazer uma aliança. A tradução natural preserva o artigo definido do texto.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa aqui diante de ou na presença de; a forma escolhida é concisa e mantém a solenidade da cena.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico, em vez de substituí-lo por um título.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: seguir Yahweh
  rationale: Embora a expressão seja literalmente andar após, em português moderno seguir comunica com clareza o sentido idiomático de lealdade e obediência, sem acrescentar uma ideia ausente do texto.
- source_word: מִצְוֺתָיו ... עֵדְוֺתָיו ... חֻקֹּתָיו
  choice: seus mandamentos, seus testemunhos e seus estatutos
  rationale: Mantém as três categorias jurídicas distintas do hebraico. Testemunhos conserva o valor pactual de עֵדוֹת, enquanto estatutos representa prescrições fixadas.
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: de todo o coração e de toda a alma
  rationale: Preserva a fórmula pactual conhecida e os dois termos antropológicos, sem reduzir נֶפֶשׁ a uma paráfrase genérica.
- source_word: לְהָקִים
  choice: cumprindo
  rationale: Neste contexto, o infinitivo aponta para pôr em prática ou efetivar as palavras da aliança. Cumprir é claro e idiomático em português.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: as palavras desta aliança
  rationale: Conserva o sentido literal de דִּבְרֵי e a ligação com o conteúdo escrito mencionado em seguida.
- source_word: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: todo o povo aderiu à aliança
  rationale: A expressão literal ficar de pé na aliança funciona idiomaticamente como ratificação ou compromisso coletivo. Aderiu comunica esse sentido de modo natural, enquanto a nota preserva a forma hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. Yahweh preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Sentido da fórmula final וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: todo o povo aderiu à aliança
  alternative: todo o povo ficou de pé na aliança
  rationale: A tradução principal expressa a participação pública do povo no compromisso pactual. A alternativa literal é mantida em nota porque a imagem de permanecer firme na aliança pode estar implícita.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A estrutura pactual e as categorias legais do hebraico foram preservadas, enquanto expressões idiomáticas potencialmente obscuras foram vertidas por equivalentes naturais. Os marcadores [a] e [b] estão posicionados exatamente nos trechos a que suas notas se referem.
