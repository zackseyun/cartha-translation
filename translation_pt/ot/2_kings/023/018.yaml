base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: pt
  text: 'Então ele disse: “Deixem-no em paz; ninguém mexa nos ossos dele”. Assim, preservaram os ossos dele[a], juntamente com os ossos do profeta que tinha vindo de Samaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pouparam os ossos dele”.'
    reason: O verbo hebraico pode expressar tanto preservar como poupar ou livrar de dano.
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: Deixem-no em paz
  rationale: A construção imperativa pede que cessem qualquer ação contra os restos mortais; a expressão é natural em português e mantém a referência pessoal do pronome hebraico.
- source_word: אִישׁ אַל יָנַע
  choice: ninguém mexa
  rationale: אִישׁ tem valor genérico na proibição, e נוע, neste contexto, indica mover ou perturbar os ossos. “Ninguém mexa” comunica isso de modo claro e corrente.
- source_word: עַצְמֹתָיו
  choice: os ossos dele
  rationale: Mantém o termo concreto e repetido do hebraico, sem generalizá-lo como “restos mortais”.
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: Assim, preservaram os ossos dele
  rationale: A forma intensiva de מלט aqui expressa livrar ou poupar da remoção e profanação. “Preservaram” comunica o resultado sem sugerir um resgate físico não indicado pelo contexto.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: juntamente com os ossos do profeta
  rationale: Explicita em português que os dois conjuntos de ossos foram preservados, conservando a coordenação do hebraico.
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: que tinha vindo de Samaria
  rationale: O mais-que-perfeito composto deixa claro que a vinda do profeta ocorreu antes deste momento narrativo.
