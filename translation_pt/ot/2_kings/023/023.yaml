  yaml_path: translation/ot/2_kings/023/023.yaml
  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: pt
  text: Mas somente no décimo oitavo ano do rei Josias esta Páscoa foi celebrada para Yahweh em Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “foi feita”; isto é, “foi celebrada” ou “foi observada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas somente
  rationale: No contexto, a expressão adversativo-restritiva contrasta esta celebração com a ausência de uma Páscoa semelhante mencionada no versículo anterior.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: no décimo oitavo ano
  rationale: Forma idiomática em português para indicar o ano de reinado.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: do rei Josias
  rationale: O lamed relaciona a data ao reinado de Josias; a construção portuguesa natural é “ano do rei Josias”.
- source_word: נַעֲשָׂה
  choice: foi celebrada
  rationale: O verbo significa literalmente “foi feita”, mas, tendo a Páscoa como sujeito, refere-se idiomaticamente à sua realização ou celebração; mantém-se a voz passiva.
- source_word: הַפֶּסַח הַזֶּה
  choice: esta Páscoa
  rationale: Tradução direta do substantivo com artigo e demonstrativo, sem acrescentar “festa”, que está implícito.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: O lamed indica que a celebração era dirigida ou dedicada a Yahweh; “para” expressa essa relação com naturalidade.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta conforme a forma portuguesa consagrada do topônimo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título; “SENHOR” e “Jeová” são alternativas tradicionais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem final “em Jerusalém” reproduz naturalmente a informação locativa, e a vírgula reduz a possível leitura de que “Yahweh, em Jerusalém” seja uma unidade sintática.
