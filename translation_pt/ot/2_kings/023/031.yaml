base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: pt
  text: Jeoacaz tinha vinte e três anos quando começou a reinar e reinou três meses em Jerusalém. O nome de sua mãe era Hamutal, filha de Jeremias, natural de Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: tinha vinte e três anos
  rationale: A expressão hebraica é uma fórmula idiomática de idade; esta tradução comunica seu sentido de modo natural em português.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção com בְּ situa a idade no início do reinado; a formulação portuguesa é natural e precisa.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: e reinou três meses
  rationale: O verbo finito descreve a duração do reinado, e o período funciona como expressão temporal de duração.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Preserva a fórmula régia hebraica em português claro e digno.
- source_word: חֲמוּטַל
  choice: Hamutal
  rationale: Transliteração corrente e inteligível do nome próprio hebraico.
- source_word: בַּת יִרְמְיָהוּ
  choice: filha de Jeremias
  rationale: בַּת indica filiação; emprega-se a forma portuguesa consagrada do nome Jeremias.
- source_word: מִלִּבְנָה
  choice: de Libna
  rationale: A preposição מִן indica aqui a origem ou associação geográfica de Jeremias; 'de Libna' preserva naturalmente essa identificação.
