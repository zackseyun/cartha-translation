  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/יָמָ֡י/ו עָלָה֩ פַרְעֹ֨ה נְכֹ֧ה מֶֽלֶךְ מִצְרַ֛יִם עַל מֶ֥לֶךְ אַשּׁ֖וּר עַל נְהַר פְּרָ֑ת וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ יֹאשִׁיָּ֨הוּ֙ לִ/קְרָאת֔/וֹ וַ/יְמִיתֵ֨/הוּ֙ בִּ/מְגִדּ֔וֹ כִּ/רְאֹת֖/וֹ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: pt
  text: Nos seus dias, o faraó Neco[a], rei do Egito, subiu contra o rei da Assíria, até o rio Eufrates. O rei Josias foi ao encontro dele[b][c], e ele o matou em Megido, quando o viu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Neco; forma tradicional: Necao.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, explicitando por interpretação: “O faraó Neco matou Josias em Megido, quando Josias foi ao encontro dele”. O hebraico emprega pronomes de terceira pessoa cujo referente não é explicitado.'
    reason: alternative_reading
  - marker: c
    text: Veja também 2 Crônicas 35:20–24, o relato paralelo da morte de Josias.
    reason: cross_reference
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Nos seus dias
  rationale: Reproduz o idiomatismo temporal hebraico, que se refere ao período de Josias, sem ampliar o texto para “durante o seu reinado”.
- source_word: עָלָה ... עַל מֶלֶךְ אַשּׁוּר
  choice: subiu contra o rei da Assíria
  rationale: Mantém o verbo de movimento e o sentido militar mais natural da preposição עַל neste contexto, sem ajustar a frase com base em reconstruções históricas.
- source_word: פַרְעֹה נְכֹה
  choice: faraó Neco
  rationale: Emprega uma transliteração moderna e corrente do nome; a forma tradicional “Necao” é registrada em nota.
- source_word: עַל נְהַר פְּרָת
  choice: até o rio Eufrates
  rationale: Expressa com naturalidade o destino geográfico do avanço, distinguindo este uso locativo do עַל anterior, de sentido adversativo.
- source_word: לִקְרָאתוֹ
  choice: foi ao encontro dele
  rationale: Preserva a amplitude de לִקְרָאת, que pode descrever um encontro neutro ou hostil, sem acrescentar ao texto a ideia explícita de confronto.
- source_word: וַיְמִיתֵהוּ
  choice: ele o matou
  rationale: Traduz de modo direto e natural o hifil de מות neste relato; os pronomes permanecem sem referentes explicitados para conservar a ambiguidade do hebraico.
- source_word: בִּמְגִדּוֹ
  choice: em Megido
  rationale: Forma idiomática em português para indicar o local do acontecimento.
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: quando o viu
  rationale: Mantém a formulação concisa e a ambiguidade dos dois pronomes masculinos singulares do hebraico.
theological_decisions:
- issue: Ambiguidade dos pronomes na declaração da morte de Josias
  choice: Manter “ele o matou” e “quando o viu”, sem identificar os referentes no texto principal.
  alternative: 'Explicitar: “o faraó Neco matou Josias em Megido, quando Josias foi ao encontro dele”.'
  rationale: A sequência hebraica usa pronomes masculinos singulares semanticamente comprimidos. Embora o contexto e o relato paralelo permitam identificar os participantes, explicitá-los no texto principal resolveria uma ambiguidade real do original.
- issue: Relação entre Neco e o rei da Assíria
  choice: Traduzir עַל como “contra”.
  alternative: Traduzir “em direção ao” ou entender que Neco subiu para auxiliar o rei da Assíria.
  rationale: A construção hebraica com עָלָה e עַל tem naturalmente sentido militar adversativo. A situação histórica pode sugerir outra relação, mas a tradução não deve substituir a forma do texto por uma reconstrução histórica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural para brasileiros. A sintaxe conserva a concisão narrativa e a ambiguidade pronominal do hebraico; as vírgulas ajudam a leitura sem explicitar os referentes.
