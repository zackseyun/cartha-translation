base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: pt
  text: O faraó Neco o prendeu[a] em Ribla, na terra de Hamate, quando ele reinava em Jerusalém[b], e impôs à terra um tributo[c] de cem talentos de prata e um talento de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o amarrou” ou “o manteve detido”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode ser entendida como “para que não reinasse em Jerusalém” ou “impedindo-o de reinar em Jerusalém”.
    reason: alternative_reading
  - marker: c
    text: Ou “uma penalidade” ou “uma multa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: o prendeu
  rationale: O verbo אסר pode significar amarrar, deter ou aprisionar. “Prendeu” comunica com naturalidade a ação coercitiva no contexto político sem especificar além do hebraico a forma de custódia.
- source_word: פַרְעֹה נְכֹה
  choice: o faraó Neco
  rationale: Mantém o título do governante e emprega a forma portuguesa corrente do nome.
- source_word: בְרִבְלָה
  choice: em Ribla
  rationale: Translitera o topônimo e usa a preposição locativa natural em português.
- source_word: בְּאֶרֶץ חֲמָת
  choice: na terra de Hamate
  rationale: Preserva a designação geográfica do hebraico de maneira clara e tradicional.
- source_word: במלך בִּירוּשָׁלָם
  choice: quando ele reinava em Jerusalém
  rationale: Segue a vocalização do texto massorético fornecido, בִּמְלֹךְ, que apresenta valor temporal. A leitura contextual de impedimento é preservada em nota, sem substituir silenciosamente a forma da edição-fonte.
- source_word: וַיִּתֶּן עֹנֶשׁ עַל הָאָרֶץ
  choice: impôs à terra um tributo
  rationale: עֹנֶשׁ designa uma penalidade ou pagamento imposto. “Tributo” expressa bem a cobrança político-econômica feita ao país, enquanto as alternativas mais estritamente lexicais são registradas em nota.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: cem talentos de prata
  rationale: Conserva a antiga unidade de peso, sem introduzir uma conversão moderna incerta.
- source_word: וְכִכַּר זָהָב
  choice: e um talento de ouro
  rationale: Preserva o singular e mantém a mesma unidade antiga empregada para a prata.
