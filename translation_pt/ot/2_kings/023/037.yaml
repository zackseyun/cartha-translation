  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: pt
  text: E ele fez o que era mau aos olhos de Yahweh, conforme tudo o que seus antepassados[a] haviam feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seus pais”; aqui, isto é, seus antepassados ou predecessores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: E ele fez
  rationale: O waw consecutivo dá continuidade à narrativa; “E ele fez” preserva essa progressão e explicita naturalmente o sujeito em português.
- source_word: הָרַע
  choice: o que era mau
  rationale: A expressão idiomática עשה הרע indica praticar aquilo que é moralmente mau; esta formulação é natural em português e preserva o caráter avaliativo.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém a metáfora hebraica de avaliação segundo a perspectiva de alguém e constitui uma expressão clara e consagrada em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Expressa correspondência com a conduta anterior e reproduz naturalmente a força comparativa da construção hebraica.
- source_word: עָשׂוּ
  choice: haviam feito
  rationale: O mais-que-perfeito composto deixa claro que a ação dos pais ocorreu antes da conduta do rei agora avaliado.
- source_word: אֲבֹתָיו
  choice: seus pais
  rationale: Preserva a formulação concreta do hebraico, embora neste contexto “pais” possa abranger antepassados; a nota registra essa amplitude lexical.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal mediante transliteração, sem substituí-lo por “SENHOR”; “Javé” é uma forma aportuguesada possível.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao leitor brasileiro. A fórmula régia de avaliação foi mantida, bem como a metáfora “aos olhos de”. O marcador da nota foi colocado imediatamente após o termo ao qual se refere.
