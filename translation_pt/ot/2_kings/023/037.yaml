  terminology: «Yahweh» preserva corretamente o Tetragrama. «Aos olhos de» é uma equivalência idiomática estabelecida para a metáfora hebraica. «Antepassados» traduz o sentido contextual de אֲבֹתָיו sem exigir uma interpretação denominacional.
