  source_fidelity: 'A fórmula hebraica foi em geral bem reproduzida: «fez o que era mau aos olhos de Yahweh» transmite adequadamente וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה, e «haviam feito» expressa com naturalidade a anterioridade contextual. No contexto régio, porém, אֲבֹתָיו não pode ser entendido como os pais imediatos: o pai de Jeoaquim, Josias, recebeu avaliação positiva. O termo designa os antepassados/predecessores dinásticos.'
