  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: pt
  text: Ele retirou da entrada da casa de Yahweh os cavalos que os reis de Judá haviam dedicado ao sol, junto à sala de Netã-Meleque, oficial da corte[a], situada nos recintos[b]; e queimou no fogo os carros do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o eunuco”; o termo hebraico pode designar tanto um eunuco quanto um oficial da corte.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é raro e provavelmente se refere a uma área periférica do complexo do templo. Outras traduções possíveis são “arredores” ou “colunatas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: retirou
  rationale: O hifil de שׁבת indica fazer cessar ou tirar de uso; no contexto da reforma de Josias, “retirou” é natural e preserva a ação concreta.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: que os reis de Judá haviam dedicado ao sol
  rationale: Embora נתן signifique literalmente “dar”, o contexto cultual favorece “dedicado”, sem precisar identificar o sol explicitamente como divindade.
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: da entrada da casa de Yahweh, junto à sala de
  rationale: A formulação trata מִבֹּא como o local do qual os cavalos foram retirados e אֶל לִשְׁכַּת como indicação de proximidade/orientação; evita sugerir com excessiva certeza um trajeto entre dois pontos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: נְתַן מֶלֶךְ
  choice: Netã-Meleque
  rationale: Forma transliterada e adaptada à leitura portuguesa do nome próprio massorético.
- source_word: הַסָּרִיס
  choice: o oficial da corte
  rationale: סָרִיס pode designar tanto um eunuco quanto um oficial régio; a tradução principal expressa a função sem afirmar uma condição física incerta.
- source_word: בַּפַּרְוָרִים
  choice: nos recintos externos
  rationale: O termo raro parece indicar uma área periférica do complexo do templo; a tradução comunica essa noção sem impor uma identificação arquitetônica específica.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: os carros do sol
  rationale: Mantém a imagem cultual concreta e a construção genitiva do hebraico.
- source_word: שָׂרַף בָּאֵשׁ
  choice: queimou no fogo
  rationale: Preserva a menção explícita ao fogo, ainda que ela seja parcialmente redundante em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Natureza da dedicação dos cavalos ao sol
  choice: dedicado ao sol
  alternative: dado ao sol; separado para o sol
  rationale: “Dedicado” torna perceptível o uso cultual indicado pelo contexto, mas não define além do texto a natureza exata do culto solar.
- issue: Sentido de הַסָּרִיס
  choice: oficial da corte, com alternativa em nota
  alternative: eunuco
  rationale: A palavra hebraica admite ambos os sentidos; a tradução principal não resolve indevidamente a condição física de Netã-Meleque, e a nota conserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “Casa de Yahweh” preserva a designação do templo; “sala” é mais corrente que “câmara”. Os marcadores de nota foram colocados exatamente nos termos a que se referem.
