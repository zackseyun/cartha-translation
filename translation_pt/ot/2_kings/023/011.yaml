    text: Ou “o eunuco”; o termo hebraico pode designar tanto um eunuco quanto um oficial da corte.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é raro e provavelmente se refere a uma área periférica do complexo do templo. Outras traduções possíveis são “arredores” ou “colunatas”.
    reason: lexical_alternative
  revision_rationale: A revisão explicita em português que “situada nos recintos” descreve a sala, como no hebraico, e reduz a especificidade indevida de “recintos externos”. A expressão locativa foi deslocada para junto do verbo a fim de melhorar a fluidez sem decidir além do necessário se a construção descreve precisamente um percurso ou a localização dos cavalos.
