  text: וַ/יַּמְלֵךְ֩ פַּרְעֹ֨ה נְכֹ֜ה אֶת אֶלְיָקִ֣ים בֶּן יֹאשִׁיָּ֗הוּ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יְהוֹאָחָ֣ז לָקָ֔ח וַ/יָּבֹ֥א מִצְרַ֖יִם וַ/יָּ֥מָת שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: pt
  text: O faraó Neco fez de Eliaquim, filho de Josias, rei no lugar de Josias, seu pai, e mudou o nome dele para Jeoaquim. Levou Jeoacaz, que chegou ao Egito[a] e morreu ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi para o Egito”. O hebraico diz literalmente: “veio ao Egito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: fez ... rei
  rationale: 'O hifil de מלך tem sentido causativo: Neco instalou Eliaquim como rei. A formulação é clara e preserva essa força.'
- source_word: תַּחַת
  choice: no lugar de
  rationale: Neste contexto de sucessão, indica que Eliaquim substituiu Josias no trono.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: mudou o nome dele
  rationale: Reproduz naturalmente o idioma hebraico de alterar o nome de alguém, sem acrescentar uma explicação interpretativa.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: Depois, levou Jeoacaz consigo
  rationale: לקח é o verbo comum para tomar ou levar. Neste contexto, 'levou ... consigo' comunica a remoção de Jeoacaz sem explicitar além do hebraico se houve captura formal.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: este chegou ao Egito
  rationale: '''Chegou'' conserva a perspectiva do hebraico בוא (''vir/chegar'') e evita a estranheza de ''veio ao Egito'' na narração portuguesa. ''Este'' identifica Jeoacaz como o referente provável do sujeito implícito.'
- source_word: וַיָּמָת שָׁם
  choice: e morreu ali
  rationale: Tradução direta e concisa, mantendo o encerramento seco da narrativa.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com as formas portuguesas tradicionais dos nomes: Neco, Eliaquim, Josias, Jeoaquim e Jeoacaz. A repetição de “Josias” foi mantida para refletir a explicitação do hebraico; “levou ... consigo” preserva a concisão narrativa sem impor a nuance mais forte de “capturou”.'
