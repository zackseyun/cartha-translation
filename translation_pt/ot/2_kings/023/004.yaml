id: 2KI.23.4
reference: 2 Kings 23:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: pt
  text: Então o rei ordenou ao sumo sacerdote Hilquias, aos sacerdotes de segunda ordem e aos guardiões da entrada que retirassem do templo de Yahweh todos os objetos feitos para Baal, para Aserá[a] e para todo o exército dos céus. Ele os queimou fora de Jerusalém, nos campos do Cedrom, e levou o pó deles para Betel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o poste sagrado de Aserá”; o termo hebraico אֲשֵׁרָה pode referir-se tanto à deusa Aserá quanto a um objeto de culto associado a ela.
    reason: Alternativa lexical necessária para preservar a ambiguidade genuína do termo hebraico.
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: Expressa de modo natural a autoridade da ordem real e corresponde ao valor narrativo de צוה.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: Designação consagrada e clara, em português, do principal ofício sacerdotal.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: os sacerdotes de segunda ordem
  rationale: Preserva a ideia de categoria ou posição secundária sem especificar uma estrutura institucional que o hebraico não explicita.
- source_word: שֹׁמְרֵי הַסַּף
  choice: os guardiões da entrada
  rationale: Comunica o ofício ligado ao limiar ou acesso do templo em português atual, sem reduzi-lo apenas à função de porteiros.
- source_word: לְהוֹצִיא
  choice: que retirassem
  rationale: No contexto, o causativo de יצא ordena a remoção dos objetos do interior do templo; a formulação é natural em português.
- source_word: מֵהֵיכַל יְהוָה
  choice: do templo de Yahweh
  rationale: הֵיכָל refere-se claramente ao templo neste contexto cultual; o nome divino é transliterado como Yahweh.
- source_word: כָּל הַכֵּלִים
  choice: todos os objetos
  rationale: כְּלִים é abrangente e pode incluir utensílios, recipientes e outros artefatos; 'objetos' evita restringir indevidamente o referente.
- source_word: לָאֲשֵׁרָה
  choice: para Aserá
  rationale: Mantém Aserá como nome próprio no texto e preserva a possível referência à deusa, deixando em nota a alternativa de objeto cultual.
- source_word: כֹל צְבָא הַשָּׁמָיִם
  choice: todo o exército dos céus
  rationale: Reproduz a expressão hebraica para os corpos ou seres celestes como conjunto cultuado, sem explicar além do texto.
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: nos campos do Cedrom
  rationale: Equivalência direta e inteligível para a área rural associada ao Cedrom.
- source_word: עֲפָרָם
  choice: o pó deles
  rationale: עָפָר significa propriamente pó; a escolha mantém maior precisão que 'cinzas', mesmo após a queima.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Forma tradicional e reconhecível em português para o topônimo hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: Translitera o nome pactual presente no hebraico em vez de substituí-lo por um título; 'Yahweh' também favorece reconhecimento internacional.
- issue: Referente de אֲשֵׁרָה
  choice: Aserá
  alternative: poste sagrado de Aserá; objeto cultual associado a Aserá
  rationale: A construção 'para Baal, para Aserá e para todo o exército dos céus' favorece manter a formulação orientada aos destinatários do culto, sem eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se expressões formais relevantes, como 'sumo sacerdote' e 'exército dos céus', enquanto 'objetos' e 'guardiões da entrada' evitam arcaísmo excessivo. O pronome em 'Ele os queimou' segue naturalmente o sujeito mais próximo e esperado, o rei.
