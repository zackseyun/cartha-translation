  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: pt
  text: Pois nunca se havia celebrado uma Páscoa como esta[a], desde os dias dos juízes que julgaram Israel, nem durante todos os dias dos reis de Israel e dos reis de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como esta Páscoa”; isto é, uma Páscoa comparável a esta.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da declaração anterior sobre a Páscoa de Josias, preservando a força causal e explicativa.
- source_word: לֹא נַעֲשָׂה
  choice: nunca se havia celebrado
  rationale: O passivo de עשה é literalmente 'não havia sido feita'; no contexto da Páscoa, 'celebrar' é a expressão idiomática natural em português. 'Havia' mantém a perspectiva retrospectiva, e 'nunca' expressa a negação ao longo do período indicado.
- source_word: כַּפֶּסַח הַזֶּה
  choice: uma Páscoa como esta
  rationale: Torna explícita a força comparativa de כ, evitando a interpretação de que nenhuma Páscoa teria sido celebrada no período.
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: desde os dias dos juízes
  rationale: A preposição מִן com 'dias' assinala o ponto inicial da comparação histórica.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: que julgaram Israel
  rationale: Preserva a relação lexical entre 'juízes' e o verbo 'julgar', sem substituir a função por uma interpretação mais ampla como 'governaram'.
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: nem durante todos os dias dos reis de Israel e dos reis de Judá
  rationale: O 'nem' dá continuidade natural à negação, enquanto a repetição de 'dos reis' reflete a estrutura hebraica e distingue claramente as duas monarquias.
theological_decisions:
- issue: Alcance da comparação histórica
  choice: Nenhuma Páscoa comparável à de Josias havia sido celebrada desde a época dos juízes e durante os reinados de Israel e Judá.
  alternative: Nenhuma Páscoa havia sido celebrada em absoluto durante todo esse período.
  rationale: A construção comparativa כַּפֶּסַח הַזֶּה significa 'como esta Páscoa'; portanto, o texto destaca o caráter incomparável da celebração, não a ausência total de celebrações anteriores. A formulação não decide se a declaração deve ser entendida como exaustiva ou retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a repetição histórica nem a comparação presente no hebraico.
