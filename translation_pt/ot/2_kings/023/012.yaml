source:
  edition: WLC
  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: pt
  text: Quanto aos altares que ficavam no telhado do aposento superior de Acaz[a], feitos pelos reis de Judá, e aos altares que Manassés havia feito nos dois pátios da casa de Yahweh, o rei os derrubou, despedaçou-os ali[b] e lançou o pó deles no vale do Cedrom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do quarto superior de Acaz”. O termo hebraico עֲלִיָּה pode designar um aposento, quarto ou cômodo no andar superior.
    reason: lexical_alternative
  - marker: b
    text: A forma hebraica também pode ser entendida como “correu dali”. Aqui, o contexto favorece o sentido de despedaçar ou esmagar os altares.
    reason: textual_ambiguity
  - marker: c
    text: Ou “no ribeiro do Cedrom”. O hebraico נַחַל pode indicar um curso d’água, seu leito, uma ravina ou um vale.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: os altares
  rationale: מִזְבֵּחַ designa diretamente um altar; o plural foi mantido nas duas ocorrências.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: no teto do aposento superior de Acaz
  rationale: גָּג é o teto ou a cobertura plana, e עֲלִיָּה designa um aposento ou cômodo superior. A formulação preserva a relação arquitetônica do hebraico.
- source_word: אֲשֶׁר עָשׂוּ מַלְכֵי יְהוּדָה
  choice: feitos pelos reis de Judá
  rationale: A construção participial em português expressa naturalmente que os altares haviam sido construídos anteriormente pelos reis de Judá.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: nos dois pátios da casa de Yahweh
  rationale: חָצֵר é pátio ou átrio. “Casa de Yahweh” conserva o idioma hebraico בֵּית יְהוָה sem substituí-lo por “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino foi transliterado, em vez de ser substituído por um título.
- source_word: נָתַץ
  choice: derrubou
  rationale: נָתַץ descreve a demolição ou derrubada de uma estrutura, sentido adequado para os altares.
- source_word: וַיָּרָץ מִשָּׁם
  choice: despedaçou-os ali
  rationale: No contexto, a forma é entendida como a redução dos altares demolidos a fragmentos, preparando a menção do pó. A possível leitura ligada a “correr” é preservada em nota.
- source_word: עֲפָרָם
  choice: o pó deles
  rationale: עָפָר significa pó ou terra solta; aqui retrata os restos pulverizados dos altares.
- source_word: נַחַל קִדְרוֹן
  choice: vale do Cedrom
  rationale: נַחַל pode designar um vale, ravina, leito de torrente ou curso d’água. “Vale do Cedrom” é claro no contexto geográfico, com a amplitude lexical indicada em nota.
- source_word: וְאֶת ... וְאֶת
  choice: Quanto aos ... e aos ...
  rationale: A construção reproduz de modo natural a topicalização dos dois objetos diretos antes do verbo principal.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o nome próprio divino. A transliteração “Yahweh” o preserva sem trocá-lo por um título nem adotar outra forma tradicional.
- issue: Sentido de וַיָּרָץ מִשָּׁם
  choice: despedaçou-os ali
  alternative: correu dali
  rationale: A sequência de derrubar os altares, reduzi-los a pó e lançar esse pó no Cedrom favorece o sentido de despedaçar. Como a forma consonantal/vocalizada também permite associação com o verbo “correr”, a alternativa não foi ocultada e consta em nota.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A sintaxe “Quanto aos...” conserva a ênfase inicial do hebraico sem soar excessivamente literal. “Pátios” foi preferido a “átrios” por maior acessibilidade, e “casa de Yahweh” mantém a imagem do texto-fonte.
