  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: pt
  text: Seus servos o transportaram morto de Megido para Jerusalém[a] e o sepultaram em seu túmulo. Então o povo da terra[b] tomou Jeoacaz, filho de Josias, ungiu-o e o constituiu rei no lugar de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fizeram-no andar” ou “fizeram-no montar”; aqui, a expressão se refere ao transporte do corpo de Josias.
    reason: lexical_alternative
  - marker: b
    text: “O povo da terra” é uma expressão hebraica formal para a população local agindo como corpo político.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: o transportaram
  rationale: O hifil de רכב significa literalmente “fizeram-no montar/andar”; no contexto, refere-se ao transporte do corpo de Josias. “Transportaram” é natural e preserva o sentido sem sugerir que ele estivesse vivo.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עבד pode designar servos, oficiais ou servidores da corte. “Servos” é a correspondência direta, e o contexto régio esclarece sua função.
- source_word: מֵת
  choice: morto
  rationale: Indica o estado de Josias durante o transporte e deixa claro que seu corpo foi levado de Megido.
- source_word: וַיְבִאֻהוּ יְרוּשָׁלַם
  choice: para Jerusalém
  rationale: A construção indica o destino do transporte; “para Jerusalém” é corrente e precisa em português.
- source_word: בִּקְבֻרָתוֹ
  choice: em seu túmulo
  rationale: O substantivo indica o lugar de sepultamento; “túmulo” é apropriado ao contexto de um sepultamento régio.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Mantém a expressão sociopolítica formal do hebraico sem restringi-la interpretativamente a “povo comum” ou ampliá-la a toda a nação.
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Preserva o sentido básico de לקח. Aqui descreve Jeoacaz sendo tomado pelo grupo para a entronização, sem explicitar indevidamente “escolheu” ou “prendeu”.
- source_word: יְהוֹאָחָז
  choice: Jeoacaz
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: ungiu-o
  rationale: משׁח designa explicitamente a unção cerimonial ligada à investidura régia; “ungiu-o” conserva essa dimensão política e ritual.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: o constituiu rei
  rationale: O hifil de מלך significa fazer alguém reinar. “Constituiu rei” expressa a instalação no reinado com naturalidade e sem confundi-la com a unção anterior.
theological_decisions:
- issue: Linguagem da unção régia
  choice: ungiu-o
  alternative: nomeou-o
  rationale: O hebraico emprega especificamente o verbo da unção, ato cerimonial e político da monarquia israelita; uma formulação genérica como “nomeou” apagaria esse elemento.
- issue: Agência do povo na sucessão
  choice: tomou Jeoacaz [...] e o constituiu rei
  alternative: escolheu Jeoacaz [...] e o proclamou rei
  rationale: A tradução conserva os verbos concretos do hebraico e não determina além do texto se o ato foi eleição, aclamação ou outra forma de intervenção política.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantém a expressão formal “povo da terra” acompanhada de nota explicativa e emprega “transportaram” para comunicar naturalmente a construção causativa hebraica.
