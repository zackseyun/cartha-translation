  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: pt
  text: Ele trouxe todos os sacerdotes das cidades de Judá e profanou os lugares altos onde os sacerdotes haviam queimado incenso, desde Geba até Berseba. Também derrubou os lugares altos dos portões[a], que ficavam à entrada do portão de Josué, governador da cidade — à esquerda de alguém junto ao portão da cidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “os santuários junto aos portões”. O hebraico diz literalmente “os lugares altos dos portões”.
    reason: lexical_alternative
  - marker: b
    text: A frase hebraica traduzida como “à esquerda de alguém junto ao portão da cidade” é difícil. É provável que indique o lado esquerdo de quem entrava pelo portão.
    reason: textual_difficulty
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Ele trouxe
  rationale: O hifil de בוא significa normalmente “trazer” ou “fazer vir”. A forma direta preserva a ação de Josias sem especificar um destino que o hebraico não declara.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português comum e preciso para כֹּהֲנִים neste contexto cultual.
- source_word: מֵעָרֵי יְהוּדָה
  choice: das cidades de Judá
  rationale: עָרִים pode designar cidades ou povoações; “cidades” é amplo, natural e tradicional.
- source_word: וַיְטַמֵּא
  choice: profanou
  rationale: No piel, טמא significa tornar impuro ou contaminar. “Profanou” comunica com naturalidade a desqualificação deliberada desses locais de culto, mantendo a dimensão religiosa do ato.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: “Lugares altos” é a designação bíblica estabelecida para בָּמוֹת e evita decidir se todos eram literalmente elevados ou que tipo exato de estrutura possuíam.
- source_word: קִטְּרוּ שָׁמָּה
  choice: haviam queimado incenso
  rationale: קטר neste contexto indica queimar incenso ou produzir fumaça sacrificial. O mais-que-perfeito situa a prática antes da profanação, e “onde” incorpora naturalmente o sentido locativo de שָׁמָּה.
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: desde Geba até Berseba
  rationale: Reproduz a extensão geográfica de norte a sul. “Berseba” é a forma portuguesa corrente do topônimo.
- source_word: וְנָתַץ
  choice: Também derrubou
  rationale: נתץ significa demolir ou pôr abaixo. “Derrubou” é claro e natural; “também” explicita o valor aditivo do waw.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: os lugares altos dos portões
  rationale: Mantém a construção hebraica comprimida e sua possível ambiguidade; a alternativa interpretativa “santuários junto aos portões” é registrada em nota.
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ
  choice: à entrada do portão de Josué
  rationale: Traduz a cadeia construta de modo direto e preserva a identificação do portão pelo nome de Josué.
- source_word: שַׂר הָעִיר
  choice: governador da cidade
  rationale: שַׂר pode indicar chefe, autoridade ou oficial. “Governador” expressa adequadamente uma função administrativa municipal sem sugerir realeza.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: à esquerda de uma pessoa no portão da cidade
  rationale: A frase hebraica é elíptica e difícil. A tradução conserva sua formulação básica sem afirmar como certo que se trata especificamente do lado esquerdo de quem entrava.
