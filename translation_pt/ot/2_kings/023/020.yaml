base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: pt
  text: Ele massacrou, sobre os altares, todos os sacerdotes dos lugares altos que estavam ali[a] e queimou ossos humanos sobre eles. Depois voltou para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacrificou, sobre os altares, todos os sacerdotes dos lugares altos que estavam ali”. O verbo hebraico pode ter sentido sacrificial, mas, neste contexto, também descreve uma matança violenta durante a eliminação de locais de culto ilícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: massacrou
  rationale: O verbo זבח pode significar abater ou sacrificar. Neste contexto de expurgo violento, “massacrou” comunica a matança e evita apresentar o ato inequivocamente como sacrifício legítimo, sem apagar por completo a possível conotação cultual, registrada em nota.
- source_word: כָּל כֹּהֲנֵי הַבָּמוֹת
  choice: todos os sacerdotes dos lugares altos
  rationale: “Todos” preserva o quantificador totalizante, e “lugares altos” é a designação tradicional e precisa para os santuários locais chamados בָּמוֹת em Reis.
- source_word: אֲשֶׁר שָׁם
  choice: que estavam ali
  rationale: Reproduz de modo natural a oração relativa e sua força locativa.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: sobre os altares
  rationale: Mantém o sentido espacial direto de עַל e a ligação com a profanação dos altares.
- source_word: וַיִּשְׂרֹף אֶת עַצְמוֹת אָדָם עֲלֵיהֶם
  choice: e queimou ossos humanos sobre eles
  rationale: “Ossos humanos” expressa o uso genérico de אָדָם, enquanto “sobre eles” retoma naturalmente os altares.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: Depois voltou para Jerusalém
  rationale: “Depois” apresenta com naturalidade a progressão da narrativa marcada pelo waw consecutivo.
theological_decisions:
- issue: Possível nuance sacrificial de וַיִּזְבַּח na morte dos sacerdotes dos lugares altos
  choice: massacrou
  alternative: sacrificou
  rationale: “Sacrificou” preservaria mais explicitamente a nuance cultual possível, mas poderia sugerir que se tratou de uma oferta legítima ao SENHOR, algo que o texto não afirma. “Massacrou” mantém a gravidade do ato; a alternativa fica registrada em nota para preservar a ambiguidade lexical.
translation_notes:
  register: Português atual, digno e acessível, com construção narrativa fluente. “Lugares altos” conserva a terminologia histórica e religiosa consolidada. A posição de “sobre os altares” evita sugerir que os sacerdotes apenas se encontravam fisicamente sobre eles e expressa que ali ocorreu a matança.
