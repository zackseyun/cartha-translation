  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: pt
  text: Contudo, Yahweh não se afastou do ardor da sua grande ira[a], com a qual sua ira se acendeu contra Judá[b], por causa de todas as provocações com que Manassés o havia provocado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da sua grande ira ardente”. A expressão hebraica fala literalmente do “ardor do nariz/da ira”, um modo de descrever ira intensa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em Judá”. A preposição hebraica é literalmente “em”, mas, neste contexto, Judá é o alvo da ira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Introduz o forte contraste entre as reformas de Josias e a permanência da ira de Yahweh.
- source_word: שָׁב
  choice: não se afastou
  rationale: Preserva a imagem de voltar ou retirar-se de algo, sem explicitar além do texto a ideia de arrepender-se ou desistir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH segundo a convenção do projeto.
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: do ardor da sua grande ira
  rationale: Expressa naturalmente o idioma hebraico de ira intensa e mantém tanto a imagem do ardor quanto o adjetivo 'grande'.
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: com a qual sua ira se acendeu
  rationale: Conserva a repetição hebraica da linguagem de ira e ardor, apesar da leve redundância intencional.
- source_word: בִּיהוּדָה
  choice: contra Judá
  rationale: Embora בְּ seja literalmente 'em', neste contexto Judá é o alvo da ira, o que em português se expressa naturalmente com 'contra'.
- source_word: עַל כָּל הַכְּעָסִים
  choice: por causa de todas as provocações
  rationale: O plural designa atos que despertaram ira; 'provocações' preserva também a ligação lexical com o verbo seguinte.
- source_word: הִכְעִיסוֹ
  choice: o havia provocado
  rationale: Reproduz a força causativa do hifil e mantém o jogo lexical com 'provocações'.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Linguagem antropopática da ira divina
  choice: Manter as imagens de ardor e ira
  alternative: Parafrasear como 'não desistiu de seu grande desagrado'
  rationale: O hebraico emprega deliberadamente linguagem concreta e repetida de ira ardente; a tradução não a suaviza nem acrescenta uma explicação doutrinária.
- issue: Sentido de שָׁב aplicado a Yahweh
  choice: não se afastou
  alternative: não voltou atrás; não desistiu
  rationale: A escolha preserva o movimento figurado do verbo e evita resolver teologicamente se a expressão implica mudança de intenção.
- issue: Nome divino
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração representa diretamente o nome próprio יהוה sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição de 'ira' e a relação entre 'provocações' e 'provocado' foram mantidas para refletir a textura do hebraico.
