source:
  edition: WLC
  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: pt
  text: Ele profanou Tofete, que fica no vale de Ben-Hinom, para que ninguém fizesse seu filho ou sua filha passar pelo fogo[a] para Moloque.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Fazer o filho ou a filha passar pelo fogo” é uma expressão ritual associada a Moloque, provavelmente referente ao sacrifício de crianças.
    reason: cultural_note
  - marker: b
    text: 'Ou, menos provavelmente: “ao rei”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְטִמֵּא
  choice: Ele profanou
  rationale: O piel de טמא significa tornar impuro ou profanar. No contexto, Josias torna o local de culto impróprio para uso; “profanou” é natural e preserva a ação deliberada.
- source_word: הַתֹּפֶת
  choice: Tofete
  rationale: Nome próprio do local, transliterado segundo a forma portuguesa corrente; o artigo hebraico não precisa ser reproduzido diante do topônimo.
- source_word: בְּגֵי בני הִנֹּם
  choice: no vale de Ben-Hinom
  rationale: גֵי significa “vale”; בני הִנֹּם é preservado como topônimo tradicional, sem converter literalmente בני em “filhos”.
- source_word: לְבִלְתִּי לְהַעֲבִיר
  choice: para que ninguém fizesse ... passar
  rationale: A construção expressa propósito preventivo. “Para que ninguém” comunica naturalmente a força negativa, e “fizesse passar” preserva o causativo do hifil e o idioma ritual.
- source_word: אִישׁ
  choice: ninguém
  rationale: Embora o substantivo seja masculino singular, aqui tem força genérica. Em português, “ninguém” transmite com precisão e naturalidade que pessoa alguma deveria realizar o rito.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: seu filho ou sua filha
  rationale: Depois da negação, “ou” expressa em português a aplicação distributiva a qualquer dos filhos, embora o hebraico use a conjunção simples “e”.
- source_word: בָּאֵשׁ
  choice: pelo fogo
  rationale: Com “fazer passar”, a expressão portuguesa “passar pelo fogo” conserva o idioma cultual do hebraico sem explicá-lo excessivamente no corpo do texto.
- source_word: לַמֹּלֶךְ
  choice: em honra a Moloque
  rationale: A preposição לְ marca aqui o destinatário ou beneficiário cultual. “Em honra a” soa natural em português e evita sugerir movimento espacial; Moloque é a leitura contextual mais provável.
theological_decisions:
- issue: Como traduzir o idioma ligado à oferta de crianças
  choice: Manter “fizesse ... passar pelo fogo” no texto principal
  alternative: “sacrificasse seu filho ou sua filha no fogo”
  rationale: O contexto aponta para um rito associado a Moloque, provavelmente sacrifício de crianças, mas o hebraico emprega uma expressão idiomática e não o verbo explícito “sacrificar”. A formulação conserva essa tensão, com esclarecimento em nota.
- issue: Força genérica de אִישׁ
  choice: “ninguém”
  alternative: “nenhum homem”
  rationale: Neste propósito negativo, אִישׁ significa pessoa alguma. “Ninguém” é mais natural e não restringe indevidamente a referência ao sexo masculino.
- issue: Identificação de לַמֹּלֶךְ
  choice: Moloque
  alternative: “ao rei”
  rationale: O contexto cultual e o uso estabelecido favorecem a leitura como nome da divindade, mas a possível vocalização alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente naturalizada, os topônimos seguem formas portuguesas correntes e o idioma ritual hebraico foi preservado no texto principal.
