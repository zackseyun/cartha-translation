  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָ֨ה יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ זבידה בַת פְּדָיָ֖ה מִן רוּמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: pt
  text: Jeoaquim tinha vinte e cinco anos quando começou a reinar[a] e reinou onze anos em Jerusalém. O nome de sua mãe era Zebida, filha de Pedaías[b], de Ruma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Jeoaquim era filho de vinte e cinco anos quando se tornou rei”.'
    reason: lexical_alternative
  - marker: b
    text: O nome Zebida também aparece como “Zebuda” em algumas tradições de transliteração.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: tinha vinte e cinco anos
  rationale: A expressão hebraica é uma fórmula idiomática de idade; a tradução natural em português comunica seu sentido sem reproduzir literalmente «filho de vinte e cinco anos».
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção com בְּ situa a idade no momento da ascensão ao trono; esta formulação é natural em português e adequada ao contexto régio.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo indica o exercício da realeza durante o período mencionado.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A expressão locativa identifica a sede do reinado.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Tradução portuguesa natural da fórmula genealógica, preservando sua informação.
- source_word: זבידה
  choice: Zebida
  rationale: Transliteração portuguesa legível do nome consonantal presente no texto massorético; a tradição também registra a forma Zebuda.
- source_word: בַת פְּדָיָה
  choice: filha de Pedaías
  rationale: Designação filial direta; «Pedaías» segue uma forma portuguesa tradicional e indica adequadamente a pronúncia.
- source_word: מִן רוּמָה
  choice: de Ruma
  rationale: Neste contexto, מִן indica procedência. Em português, «de Ruma» expressa naturalmente a origem geográfica.
