base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: pt
  text: Antes dele, não houve rei semelhante a ele, que se voltou para Yahweh de todo o seu coração, de toda a sua alma e com toda a sua força, de acordo com toda a Lei de Moisés.[a][b] Depois dele, não se levantou nenhum rei semelhante a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retornou para Yahweh”. O verbo hebraico pode indicar retorno a Deus em arrependimento e lealdade à aliança.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “de todo o seu coração, de toda a sua alma e com toda a sua força” ecoa Deuteronômio 6:5.
    reason: cross_reference
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: Antes dele, não houve rei semelhante a ele
  rationale: A formulação natural em português mantém a comparação enfática e o sentido temporal de לְפָנָיו.
- source_word: שָׁב אֶל יְהוָה
  choice: se voltasse para Yahweh
  rationale: שׁוּב com אֶל expressa voltar-se ou retornar a Deus em lealdade e arrependimento; “voltar-se para” preserva essa amplitude sem tornar explícito apenas um aspecto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: de todo o coração, de toda a alma e com toda a força
  rationale: Preserva a tríade deuteronômica em português claro; “força” comunica naturalmente a capacidade total indicada por מְאֹד nesta fórmula.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: conforme toda a Lei de Moisés
  rationale: Neste contexto avaliativo régio, תּוֹרָה designa o conjunto da instrução legal mosaica; “conforme” expressa correspondência normativa.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: E depois dele também não surgiu nenhum semelhante a ele
  rationale: “Surgiu” traduz naturalmente קָם no sentido de aparecer na história, e “também” reforça a comparação simétrica com os reis anteriores.
theological_decisions:
- issue: Eco de Deuteronômio 6:5 na descrição da devoção de Josias
  choice: Manter a tríade “coração... alma... força”
  alternative: Parafrasear como devoção completa ou usar “poder” no último termo
  rationale: A forma tríplice permite reconhecer o eco da aliança sem reduzir a expressão a uma abstração.
- issue: Sentido de שָׁב na relação de Josias com Yahweh
  choice: “se voltasse para”
  alternative: “retornasse para” ou “se arrependesse diante de”
  rationale: O verbo pode incluir retorno, arrependimento e renovação da lealdade à aliança; a opção escolhida conserva essa tensão sem especificá-la excessivamente.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O original emprega o nome pessoal divino, por isso a transliteração o distingue de um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível a leitores brasileiros e compreensível internacionalmente. A repetição comparativa do hebraico foi preservada, e “Lei” recebeu inicial maiúscula por designar aqui a Lei de Moisés como corpo reconhecido de instrução.
