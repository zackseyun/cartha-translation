revisions:
- from: Antes dele, não houve rei semelhante a ele, que se voltasse para Yahweh de todo o coração, de toda a alma e com toda a força, conforme toda a Lei de Moisés.[a][b] E depois dele também não surgiu nenhum semelhante a ele.
  to: Antes dele, não houve rei semelhante a ele, que se voltou para Yahweh de todo o seu coração, de toda a sua alma e com toda a sua força, de acordo com toda a Lei de Moisés.[a][b] Depois dele, não se levantou nenhum rei semelhante a ele.
  rationale: A revisão substitui o subjuntivo por uma forma indicativa, que reproduz a descrição factual do hebraico; elimina o acréscimo “também”; torna a relação com a Lei mais idiomática; e explicita “rei” na última oração, em conformidade com o referente real estabelecido pela frase anterior. Os pronomes possessivos preservam explicitamente a referência individual de Josias, e as notas foram ajustadas para coincidir com o texto revisto.
