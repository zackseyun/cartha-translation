base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: pt
  text: Joaquim deu a prata e o ouro ao faraó, mas tributou[a] a terra para entregar a prata conforme a ordem do faraó.[b] Exigiu de cada um do povo da terra a prata e o ouro, segundo a sua avaliação,[c] para entregá-los ao faraó Neco.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “avaliou a terra” ou “impôs uma contribuição à terra”. O verbo hebraico pode indicar a fixação de uma avaliação para pagamento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “segundo a boca do faraó”, isto é, conforme a ordem dele.
    reason: lexical_alternative
  - marker: c
    text: Ou “segundo a quantia fixada para cada um”; de modo mais interpretativo, “segundo os recursos de cada um”.
    reason: lexical_alternative
  - marker: d
    text: O nome também aparece em português sob a forma “Necao”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: tributou
  rationale: No hifil, tendo “a terra” como objeto e em contexto de pagamento, o verbo indica a imposição de uma avaliação tributária. “Tributou” comunica esse sentido fiscal sem reduzi-lo a uma simples estimativa de valor.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém o termo hebraico e sua dimensão político-territorial, além de preservar a ligação verbal com “povo da terra” no mesmo versículo.
- source_word: עַל־פִּי פַרְעֹה
  choice: conforme a ordem do faraó
  rationale: A expressão idiomática significa literalmente “segundo a boca do faraó”, isto é, segundo sua palavra ou ordem. A tradução explicita naturalmente o sentido em português.
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: de cada um segundo a sua avaliação
  rationale: Preserva a ideia de uma avaliação individual e a relação lexical com a raiz de הֶעֱרִיךְ, sem interpretar de modo definitivo que se tratava da capacidade financeira de cada pessoa.
- source_word: נָגַשׂ
  choice: exigiu
  rationale: O verbo pode expressar pressão ou cobrança coerciva. “Exigiu” conserva essa força melhor que o mais neutro “arrecadou”.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: A tradução formal preserva uma expressão que pode ter valor sociopolítico específico, evitando defini-la indevidamente como “o povo comum”.
- source_word: פַרְעֹה נְכֹה
  choice: faraó Neco
  rationale: Translitera o nome hebraico numa forma corrente e reconhecível em português.
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: a prata e o ouro
  rationale: Conserva a referência concreta aos metais preciosos e seu paralelismo, embora a prata também pudesse funcionar como dinheiro.
- source_word: נָתַן
  choice: deu
  rationale: Reproduz o sentido básico do verbo hebraico; o contexto deixa claro que se trata do pagamento exigido pelo faraó.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao leitor brasileiro e inteligível internacionalmente. Mantêm-se “a terra” e “o povo da terra” para preservar a repetição hebraica e evitar uma identificação social excessivamente específica. As notas registram a ambiguidade fiscal de ערך, o caráter idiomático de על־פי e a incerteza quanto ao critério exato da avaliação individual.
