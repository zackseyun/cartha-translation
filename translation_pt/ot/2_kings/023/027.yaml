source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: pt
  text: 'E Yahweh disse: “Também removerei Judá de diante de mim, assim como removi Israel; rejeitarei[a] esta cidade que escolhi — Jerusalém — e a casa[b] a respeito da qual eu disse: ‘O meu nome estará ali’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Rejeitei esta cidade que escolhi — Jerusalém — e a casa”. A forma verbal hebraica pode ser entendida como ação concluída; no texto, ela foi traduzida com sentido futuro no contexto do anúncio de juízo.'
    reason: alternative_reading
  - marker: b
    text: Isto é, o templo de Jerusalém. O hebraico diz literalmente “a casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal e seu valor pactual, em vez de substituí-lo por um título.
- source_word: אָסִיר / הֲסִרֹתִי (סור no hifil)
  choice: removerei / removi
  rationale: Mantém o paralelismo verbal entre o futuro juízo de Judá e o juízo já ocorrido sobre Israel.
- source_word: מֵעַל פָּנַי
  choice: de diante de mim
  rationale: Conserva de modo inteligível o idioma hebraico e sua força relacional, sem ampliar para uma interpretação mais específica.
- source_word: גַּם
  choice: também
  rationale: Assinala que Judá terá destino correspondente ao de Israel.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Expressa claramente a comparação explícita entre a remoção de Judá e a de Israel.
- source_word: וּמָאַסְתִּי
  choice: rejeitarei
  rationale: Embora seja formalmente uma conjugação qatal, o verbo continua a declaração de juízo orientada para o futuro. A nota preserva a leitura temporal alternativa.
- source_word: הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: Tradução direta e natural do sintagma demonstrativo.
- source_word: אֲשֶׁר בָּחַרְתִּי
  choice: que escolhi
  rationale: Refere-se de modo simples à escolha anterior de Jerusalém por Deus.
- source_word: אֶת יְרוּשָׁלִַם
  choice: — Jerusalém —
  rationale: Os travessões apresentam Jerusalém como aposto identificador de “esta cidade”, sem acrescentar conteúdo.
- source_word: הַבַּיִת
  choice: a casa
  rationale: Mantém o termo concreto do hebraico e sua ressonância teológica; neste contexto, a referência é ao templo de Jerusalém.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: O meu nome estará ali
  rationale: Reprodução direta e idiomática da declaração, preservando o tema bíblico da presença do nome de Deus no santuário escolhido.
theological_decisions:
- issue: Força temporal de וּמָאַסְתִּי na declaração profética de juízo
  choice: 'Traduzir com orientação futura: “Rejeitarei”'
  alternative: “Rejeitei” ou “tenho rejeitado”
  rationale: O contexto anuncia a futura remoção de Judá e compara esse ato com a remoção já realizada de Israel. O futuro dá continuidade natural ao anúncio, enquanto a nota mantém visível a possibilidade de entender a forma hebraica como ação concluída.
- issue: Tradução de הַבַּיִת
  choice: Usar “a casa” no texto principal
  alternative: “o templo”
  rationale: “Casa” traduz literalmente o hebraico e conserva suas associações intertextuais. Como o referente é o templo de Jerusalém, a alternativa explicativa aparece em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros e internacionais. Conservam-se “Yahweh”, “de diante de mim” e “a casa” para manter elementos significativos da forma e da teologia do hebraico, com notas apenas onde a clareza ou a ambiguidade textual o exigem.
