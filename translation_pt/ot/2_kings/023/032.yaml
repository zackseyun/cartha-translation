source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/032.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: pt
  text: Fez o que era mau aos olhos de Yahweh, conforme tudo o que seus pais[a] haviam feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seus pais”; isto é, seus antepassados ou predecessores.'
    reason: Esclarece o alcance contextual de אֲבֹתָיו na fórmula de avaliação dos reis.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Fez
  rationale: O wayyiqtol dá continuidade à narrativa. Em português, “fez” expressa de modo natural a ação, sem exigir a conjunção inicial.
- source_word: הָרַע
  choice: o que era mau
  rationale: A expressão idiomática עשה הרע descreve a prática daquilo que é moralmente mau; esta formulação evita o literalismo pouco natural “fez o mal” sem alterar o sentido.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a metáfora avaliativa hebraica e é uma expressão clara e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Mantém tanto a ideia de correspondência quanto a força abrangente de כֹּל.
- source_word: עָשׂוּ
  choice: haviam feito
  rationale: O mais-que-perfeito composto torna clara, em português, a anterioridade das ações dos pais em relação à ação do rei.
- source_word: אֲבֹתָיו
  choice: seus pais
  rationale: Conserva a expressão hebraica, que neste contexto régio pode abranger antepassados ou predecessores; a nota esclarece essa extensão sem fixar uma única interpretação no texto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz o nome divino diretamente. “Yahweh” preserva sua condição de nome próprio, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da metáfora hebraica “aos olhos de”. A formulação mantém a possível amplitude de “pais” mediante nota, sem decidir silenciosamente entre ascendentes familiares e reis predecessores.
