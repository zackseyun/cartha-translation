  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַם֩ אֶת כָּל בָּתֵּ֨י הַ/בָּמ֜וֹת אֲשֶׁ֣ר בְּ/עָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֤י יִשְׂרָאֵל֙ לְ/הַכְעִ֔יס הֵסִ֖יר יֹֽאשִׁיָּ֑הוּ וַ/יַּ֣עַשׂ לָ/הֶ֔ם כְּ/כָל הַֽ/מַּעֲשִׂ֔ים אֲשֶׁ֥ר עָשָׂ֖ה בְּ/בֵֽית אֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: pt
  text: Josias também removeu todos os santuários dos lugares altos que havia nas cidades de Samaria, os quais os reis de Israel tinham construído para provocar a ira[a]. Fez com eles tudo o que havia feito em Betel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando com base no contexto mais amplo: “para provocar a ira do SENHOR”.'
    reason: O hebraico deixa implícito aquele cuja ira era provocada.
lexical_decisions:
- source_word: וְגַם
  choice: também
  rationale: Preserva de modo natural a força aditiva, ligando esta ação ao relato anterior.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: santuários dos lugares altos
  rationale: בָּתִּים significa literalmente “casas”, mas, nesta construção cultual, “santuários” comunica com clareza que eram edifícios destinados ao culto; “lugares altos” preserva o termo tradicional para esses centros de culto.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: nas cidades de Samaria
  rationale: Reproduz diretamente a construção hebraica; aqui Samaria designa a região do antigo reino do norte.
- source_word: אֲשֶׁר עָשׂוּ
  choice: os quais ... tinham construído
  rationale: O verbo עשה é amplo (“fazer”), mas, tendo edifícios como objeto, “construir” expressa naturalmente o sentido contextual em português.
- source_word: לְהַכְעִיס
  choice: para provocar a ira
  rationale: Mantém a ideia de finalidade e deixa implícito, como no hebraico, de quem é a ira provocada.
- source_word: הֵסִיר
  choice: removeu
  rationale: Verbo claro e concreto, apropriado ao contexto das reformas de Josias.
- source_word: וַיַּעַשׂ לָהֶם כְּכָל הַמַּעֲשִׂים
  choice: Fez com eles tudo o que havia feito
  rationale: Preserva a repetição do verbo “fazer” e a comparação com as ações realizadas anteriormente, em português natural.
- source_word: בְּבֵית אֵל
  choice: em Betel
  rationale: Forma idiomática em português para indicar o local onde Josias havia realizado as ações mencionadas.
theological_decisions:
- issue: Objeto implícito de לְהַכְעִיס
  choice: 'Manter o objeto implícito no texto principal: “para provocar a ira”.'
  alternative: “para provocar a ira do SENHOR”
  rationale: O contexto mais amplo identifica o SENHOR como aquele cuja ira era provocada, mas esta oração hebraica não o nomeia. A tradução principal preserva essa elipse, e a nota oferece a explicitação contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Santuários dos lugares altos” evita o pouco natural “casas dos lugares altos” sem perder a referência aos edifícios cultuais; a segunda frase conserva a correspondência verbal com o hebraico.
