base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: pt
  text: Então o rei mandou chamar[a] todos os anciãos de Judá e de Jerusalém, e eles se reuniram junto dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “enviou”. O verbo não explicita o objeto; no contexto, «mandou chamar» entende o envio como uma convocação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou chamar
  rationale: Neste contexto narrativo, o verbo indica que o rei enviou uma convocação, embora o hebraico não expresse objeto direto. A formulação é natural em português e a nota registra a construção mais literal.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o substantivo definido e o título usado no versículo, sem substituir pelo nome de Josias.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: se reuniram junto dele
  rationale: A forma hebraica é ativa e plural, literalmente 'reuniram-se a ele'. Esta redação preserva a voz e o movimento em direção ao rei de maneira natural em português.
- source_word: כָּל זִקְנֵי
  choice: todos os anciãos
  rationale: זקנים designa aqui autoridades reconhecidas da comunidade, e 'anciãos' é a tradução tradicional e contextualmente precisa.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: de Judá e de Jerusalém
  rationale: Preserva os nomes próprios e apresenta os anciãos ligados tanto ao território de Judá quanto à capital.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A tradução mantém o título 'o rei', a designação institucional 'anciãos' e a construção ativa do hebraico.
