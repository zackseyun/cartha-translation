  text: וְ/גַ֨ם אֶת הַ/מִּזְבֵּ֜חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֗ל הַ/בָּמָה֙ אֲשֶׁ֨ר עָשָׂ֜ה יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל גַּ֣ם אֶת הַ/מִּזְבֵּ֧חַ הַ/ה֛וּא וְ/אֶת הַ/בָּמָ֖ה נָתָ֑ץ וַ/יִּשְׂרֹ֧ף אֶת הַ/בָּמָ֛ה הֵדַ֥ק לְ/עָפָ֖ר וְ/שָׂרַ֥ף אֲשֵׁרָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: pt
  text: Também, quanto ao altar que havia em Betel — o lugar alto que Jeroboão, filho de Nebate, que fez Israel pecar, havia feito —, ele derrubou tanto aquele altar como o lugar alto. Queimou o lugar alto, reduziu-o a pó e queimou a Aserá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o poste de Aserá”; o termo hebraico pode designar o objeto cultual associado à adoração de Aserá.
    reason: Alternativa lexical que esclarece o provável referente concreto sem eliminar a ambiguidade do termo hebraico no texto principal.
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Tradução padrão e direta de מִזְבֵּחַ, sem explicitação desnecessária.
- source_word: בְּבֵית אֵל
  choice: em Betel
  rationale: Expressa de modo natural em português a localização indicada pela preposição hebraica.
- source_word: הַבָּמָה
  choice: o lugar alto
  rationale: Preserva o sentido técnico cultual de בָּמָה e mantém consistência nas duas ocorrências.
- source_word: עָשָׂה
  choice: havia feito
  rationale: Mantém o sentido amplo de 'fazer' e assinala que a ação de Jeroboão antecedeu a destruição narrada.
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: fez Israel pecar
  rationale: Reproduz de forma concisa e clara a força causativa do hifil de חטא.
- source_word: הַמִּזְבֵּחַ הַהוּא
  choice: esse altar
  rationale: O demonstrativo retoma enfaticamente o altar já identificado; a repetição de 'também' seria pouco natural neste ponto em português.
- source_word: נָתָץ
  choice: derrubou
  rationale: Verbo natural para a demolição de uma estrutura e fiel ao sentido do hebraico.
- source_word: וַיִּשְׂרֹף אֶת־הַבָּמָה
  choice: Queimou o lugar alto
  rationale: Conserva a formulação concreta e a repetição lexical do texto hebraico, sem especificar quais elementos da instalação foram queimados.
- source_word: הֵדַק לְעָפָר
  choice: reduziu-o a pó
  rationale: Comunica o resultado da pulverização de modo idiomático, com o objeto retomado explicitamente pelo pronome.
- source_word: אֲשֵׁרָה
  choice: a Aserá
  rationale: Translitera o termo hebraico e preserva sua possível referência à deusa ou ao objeto cultual associado a ela.
theological_decisions:
- issue: Referente de אֲשֵׁרָה
  choice: a Aserá
  alternative: o poste de Aserá; o poste sagrado
  rationale: No contexto de destruição, o termo provavelmente designa o objeto cultual de madeira, mas o hebraico não elimina totalmente a associação com a deusa. A transliteração no texto principal preserva essa ambiguidade, e a nota apresenta a alternativa explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura parentética conserva a identificação do lugar alto e a oração relativa ligada a Jeroboão. O pronome explícito em “ele derrubou” ajuda a sinalizar a retomada do sujeito Josias após a longa descrição do objeto.
