source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מָ֚ה הַ/צִּיּ֣וּן הַלָּ֔ז אֲשֶׁ֖ר אֲנִ֣י רֹאֶ֑ה וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אַנְשֵׁ֣י הָ/עִ֗יר הַ/קֶּ֤בֶר אִישׁ הָֽ/אֱלֹהִים֙ אֲשֶׁר בָּ֣א מִֽ/יהוּדָ֔ה וַ/יִּקְרָ֗א אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר עָשִׂ֔יתָ עַ֖ל הַ/מִּזְבַּ֥ח בֵּֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: pt
  text: 'Então ele perguntou: “Que monumento[a] é aquele que estou vendo?” Os homens da cidade lhe responderam: “É o túmulo do homem de Deus que veio de Judá e proclamou[b] estas coisas que você fez contra o altar de Betel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “marco”, “pedra memorial” ou “marco de sepultura”.
    reason: lexical_alternative
  - marker: b
    text: Ou “clamou” ou “anunciou”; o verbo se refere à declaração profética do homem de Deus a respeito do altar (veja 1Rs 13:1–2).
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: monumento
  rationale: O substantivo indica um sinal ou marco visível, aqui associado a um túmulo. “Monumento” é natural em português e não define com precisão indevida a forma do objeto.
- source_word: הַלָּז
  choice: aquele
  rationale: O demonstrativo aponta para um objeto visível, com provável força distal; “aquele” reproduz naturalmente essa referência em português.
- source_word: אֲנִי רֹאֶה
  choice: estou vendo
  rationale: A construção participial expressa a percepção em curso no momento da pergunta.
- source_word: הַקֶּבֶר
  choice: túmulo
  rationale: O contexto apresenta um local de sepultamento identificado por um monumento ou marco visível; “túmulo” é a opção mais natural.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título hebraico tradicional sem interpretá-lo de maneira mais restrita como “profeta”.
- source_word: מִיהוּדָה
  choice: de Judá
  rationale: Forma geográfica corrente e direta em português.
- source_word: וַיִּקְרָא
  choice: proclamou
  rationale: No contexto, o verbo descreve uma declaração profética pública a respeito do altar, à qual 1 Reis 13:1–2 fornece o pano de fundo.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: estas coisas
  rationale: A expressão pode abranger tanto as palavras pronunciadas como os acontecimentos anunciados; “estas coisas” conserva essa amplitude.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: que você fez
  rationale: Traduz diretamente a ação atribuída a Josias, usando linguagem moderna e amplamente compreensível.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contra o altar
  rationale: O contexto de juízo e destruição favorece o sentido adversativo de עַל, sem eliminar por nota a possibilidade mais geral de referência ao altar.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Transliteração portuguesa consagrada do nome do lugar.
theological_decisions:
- issue: Caracterização da declaração do homem de Deus
  choice: proclamou
  alternative: clamou; anunciou
  rationale: “Proclamou” torna clara a natureza pública e profética da declaração, sem acrescentar conteúdo ao texto nem identificar o homem de Deus por um título mais específico.
- issue: Relação das ações de Josias com o altar
  choice: contra o altar
  alternative: sobre o altar; a respeito do altar
  rationale: O contexto imediato favorece uma relação adversativa, pois Josias profanou e destruiu o altar. A tradução mantém a formulação compacta e a tensão sintática do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com formas correntes no Brasil e compreensão internacional. O discurso direto permanece natural; “lhe responderam” evita repetição pesada, e os termos tradicionais “homem de Deus” e “Betel” são preservados.
