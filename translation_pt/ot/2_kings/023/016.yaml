source:
  edition: WLC
  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: pt
  text: Então Josias se virou e viu os túmulos que estavam ali no monte[a]. Mandou buscar os ossos dos túmulos, queimou-os sobre o altar e assim o profanou, conforme a palavra de Yahweh, proclamada pelo homem de Deus[b], que proclamou estas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as sepulturas”. O termo hebraico pode designar locais de sepultamento em geral, não apenas túmulos construídos.
    reason: lexical_alternative
  - marker: b
    text: Ou “que clamou” ou “que bradou”. O verbo hebraico pode destacar uma proclamação pública feita em voz alta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: se virou
  rationale: Expressa naturalmente o movimento indicado por פנה antes de Josias avistar os túmulos.
- source_word: הַקְּבָרִים
  choice: os túmulos
  rationale: קבר pode indicar sepultura ou túmulo; “túmulos” se ajusta a locais de sepultamento visíveis no monte, sem excluir a alternativa mais geral registrada em nota.
- source_word: בָּהָר
  choice: no monte
  rationale: הר pode designar monte ou montanha. “Monte” é natural no contexto topográfico e evita sugerir necessariamente uma elevação muito grande.
- source_word: הָעֲצָמוֹת
  choice: os ossos
  rationale: Mantém o sentido concreto de עצמות, essencial para a descrição da profanação ritual.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: queimou-os sobre o altar
  rationale: Preserva os ossos como objeto direto e representa על de forma clara, indicando que foram queimados no altar.
- source_word: וַיְטַמְּאֵהוּ
  choice: assim o profanou
  rationale: טמא, neste contexto ritual, significa tornar impuro ou profanar; o pronome retoma naturalmente o altar. “Assim” explicita apenas a relação instrumental já indicada pela sequência narrativa.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: Conserva a fórmula de cumprimento da palavra divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Traduz diretamente o título profético hebraico, sem parafraseá-lo como “profeta”.
- source_word: קָרָא
  choice: proclamada / anunciado
  rationale: קרא pode significar chamar, clamar ou proclamar. A formulação comunica uma declaração profética pública; a variação portuguesa evita repetição pesada sem alterar o referente verbal hebraico.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: essas coisas
  rationale: דברים pode significar palavras, assuntos ou acontecimentos; aqui a expressão abrange os atos anteriormente preditos.
theological_decisions:
- issue: Fórmula de cumprimento que relaciona a ação de Josias à profecia anterior
  choice: “conforme a palavra de Yahweh proclamada pelo homem de Deus”
  alternative: “conforme a palavra de Yahweh que o homem de Deus proclamou”
  rationale: A redação apresenta a ação como cumprimento da palavra de Yahweh mediada pelo homem de Deus, sem acrescentar identificação ou explicação doutrinária.
- issue: Repetição de אֲשֶׁר קָרָא
  choice: “proclamada pelo homem de Deus, que havia anunciado essas coisas”
  alternative: “que o homem de Deus proclamou, o qual proclamou essas coisas”
  rationale: Preserva as duas ocorrências e a relativa final, mas usa uma construção portuguesa menos truncada. O mais-que-perfeito composto situa naturalmente o anúncio antes do cumprimento sem resolver além disso a tensão sintática.
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: Mantém o nome pessoal representado pelo tetragrama, de acordo com a convenção do projeto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação narrativa hebraica foi suavizada sem omitir ações. “Monte” soa mais natural que “montanha” neste contexto. Todos os marcadores de nota aparecem no texto principal.
