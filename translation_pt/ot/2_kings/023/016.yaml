  terminology: “Yahweh”, “homem de Deus”, “ossos”, “altar” e “profanou” são escolhas adequadas. A nota b precisa apresentar alternativas aplicáveis ao verbo cujo sujeito é o homem de Deus; “clamada” e “gritada” criavam uma mudança indevida para construções passivas.
