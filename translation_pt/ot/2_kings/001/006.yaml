id: 2KI.1.6
reference: 2 Kings 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: pt
  text: 'Eles lhe responderam: “Um homem subiu ao nosso encontro e nos disse: ‘Vão, voltem ao rei que enviou vocês e falem com ele: Assim diz Yahweh: “É por não haver Deus em Israel que você manda consultar Baal-Zebube, o deus de Ecrom?[a] Por isso, da cama para a qual você subiu, não descerá[b], pois certamente morrerá.”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É por falta de um Deus em Israel que você manda consultar Baal-Zebube...?”'
    reason: Registra uma tradução alternativa do idioma hebraico sem reduzir a força retórica da pergunta.
  - marker: b
    text: 'Literalmente, a construção hebraica diz: “não descerá dela”; “dela” retoma “a cama”.'
    reason: Explicita o pronome resumptivo feminino do hebraico e a relação sintática com “cama”.
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva a forma masculina singular e a perspectiva narrativa, pois os mensageiros ainda não identificam Elias pelo nome.
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: subiu ao nosso encontro
  rationale: Mantém tanto o movimento em direção aos mensageiros quanto o sentido ascendente de עָלָה.
- source_word: לְכוּ שׁוּבוּ
  choice: Vão, voltem
  rationale: Conserva os dois imperativos do hebraico, em vez de reduzi-los a uma única ordem.
- source_word: וְדִבַּרְתֶּם אֵלָיו
  choice: e falem com ele
  rationale: Preserva a distinção lexical entre דּבר, falar, e אמר, dizer, sem comprometer a compreensão.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Reproduz a fórmula profética tradicional e translitera o nome divino expresso no texto.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: É por não haver Deus em Israel
  rationale: Mantém a pergunta retórica e seu tom de repreensão, com formulação natural em português.
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: você manda consultar
  rationale: Neste contexto, דרש indica buscar uma resposta oracular de uma divindade; “consultar” comunica esse sentido com clareza.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebube
  rationale: Translitera o nome próprio da divindade segundo uma forma clara e corrente em português.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: o deus de Ecrom
  rationale: Identifica naturalmente Baal-Zebube como a divindade associada à cidade de Ecrom.
- source_word: הַמִּטָּה
  choice: a cama
  rationale: Embora o termo também possa designar um leito ou divã, “cama” se ajusta melhor ao contexto da enfermidade.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: para a qual você subiu
  rationale: Preserva o verbo ascendente e o referente relativo, evitando reproduzir de modo artificial o advérbio resumptivo semítico שָׁם.
- source_word: מוֹת תָּמוּת
  choice: certamente morrerá
  rationale: Expressa a construção enfática hebraica por meio de uma formulação idiomática e solene em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Força da pergunta sobre a existência de Deus em Israel
  choice: É por não haver Deus em Israel...?
  alternative: É por falta de um Deus em Israel...?
  rationale: A formulação principal conserva a repreensão retórica sem transformar a frase numa afirmação de ausência divina; a alternativa lexical igualmente possível é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais como “vocês” e “você”. A fala profética mantém solenidade sem arcaísmos. As aspas aninhadas distinguem a resposta dos mensageiros, a fala de Elias e a mensagem divina.
