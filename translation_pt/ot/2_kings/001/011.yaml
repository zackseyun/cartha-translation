base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: pt
  text: 'Mais uma vez, o rei enviou a Elias outro comandante de cinquenta com os seus cinquenta homens. O comandante lhe disse: “Homem de Deus, assim diz o rei: ‘Desça depressa.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Venha depressa.” O verbo hebraico significa simplesmente “descer”; “desça” preserva essa neutralidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: Mais uma vez, ... enviou
  rationale: A construção com וַיָּשָׁב seguida de outro verbo indica repetição da ação, não retorno físico.
- source_word: אֵלָיו
  choice: a Elias
  rationale: O referente pronominal é explicitado para dar clareza natural em português sem acrescentar conteúdo.
- source_word: שַׂר חֲמִשִּׁים
  choice: comandante de cinquenta
  rationale: Designa o oficial responsável por uma unidade militar de cinquenta homens; “comandante” é claro e atual.
- source_word: וַחֲמִשָּׁיו
  choice: com os seus cinquenta homens
  rationale: O sufixo indica os cinquenta sob o comando do oficial; “homens” torna natural uma expressão que no hebraico é elíptica.
- source_word: וַיַּעַן וַיְדַבֵּר אֵלָיו
  choice: O comandante lhe disse
  rationale: A dupla fórmula narrativa hebraica é vertida de modo idiomático; “respondeu” seria estranho sem uma fala imediatamente anterior dirigida a este comandante.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Homem de Deus
  rationale: Mantém o título reconhecido de Elias e sua força vocativa.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: assim diz o rei
  rationale: Preserva a fórmula solene e autoritativa do mensageiro.
- source_word: מְהֵרָה רֵדָה
  choice: Desça depressa
  rationale: “Desça” conserva o sentido básico do verbo ירד sem impor a distinção portuguesa entre “vir” e “ir”; “depressa” expressa a urgência de מְהֵרָה.
