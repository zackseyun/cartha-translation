translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição semítica da fórmula de fala foi suavizada, enquanto a fórmula régia formal foi preservada. O marcador [a] aparece imediatamente após a fala a que se refere.
