  text: וַ/יַּ֣עַן אֵלִיָּה֮ וַ/יְדַבֵּ֣ר אֲלֵי/הֶם֒ אִם אִ֤ישׁ הָֽ/אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ אֱלֹהִים֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: pt
  text: 'Elias lhes respondeu: “Se eu sou homem de Deus[a], que desça fogo do céu e consuma você e os seus cinquenta[b]”. Então o fogo de Deus[c] desceu do céu e consumiu o capitão e os seus cinquenta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se eu sou o homem de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os seus cinquenta”, isto é, o grupo de cinquenta homens comandado pelo capitão.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “fogo vindo de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: Elias lhes respondeu
  rationale: Condensa a fórmula narrativa hebraica literalmente redundante, ‘respondeu e falou a eles’, numa introdução de fala natural em português, preservando tanto a resposta quanto o destinatário plural.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: Se eu sou homem de Deus
  rationale: Mantém o título profético tradicional sem acrescentar artigo em português; a alternativa definida é registrada em nota por causa da possível leitura do sintagma hebraico.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: que desça fogo do céu
  rationale: O subjuntivo com ‘que’ expressa adequadamente a força jussiva ou invocativa, em vez de transformar a fala numa simples previsão.
- source_word: וְתֹאכַל
  choice: e consuma
  rationale: ‘Consumir’ é o verbo português idiomático para a ação destrutiva do fogo e mantém a repetição do mesmo verbo na realização subsequente.
- source_word: אֹתְךָ וְאֶת חֲמִשֶּׁיךָ
  choice: você e os seus cinquenta
  rationale: Distingue o capitão, tratado no singular, do destacamento de cinquenta homens; a expressão concisa do hebraico é preservada.
- source_word: וַתֵּרֶד אֵשׁ אֱלֹהִים מִן הַשָּׁמַיִם
  choice: Então o fogo de Deus desceu do céu
  rationale: Traduz explicitamente אֵשׁ אֱלֹהִים como ‘fogo de Deus’, preservando a atribuição divina presente no texto hebraico.
- source_word: וַתֹּאכַל אֹתוֹ וְאֶת חֲמִשָּׁיו
  choice: e consumiu o capitão e os seus cinquenta
  rationale: ‘O capitão’ torna claro o referente do pronome masculino singular sem alterar a relação entre o comandante e seu destacamento.
theological_decisions:
- issue: O título profético אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  alternative: o homem de Deus
  rationale: A forma sem artigo é natural como predicativo em português e preserva o título profético; a possível leitura definida permanece disponível em nota, sem decidir além da evidência.
- issue: A relação expressa por אֵשׁ אֱלֹהִים
  choice: fogo de Deus
  alternative: fogo vindo de Deus
  rationale: A tradução conserva a ligação explícita entre Deus e o fogo, sem explicar indevidamente a natureza ou o mecanismo do acontecimento.
- issue: A força verbal de תֵּרֶד
  choice: que desça
  alternative: descerá
  rationale: A forma hebraica tem força jussiva ou invocativa no contexto; o subjuntivo português preserva essa tensão melhor do que uma previsão categórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula hebraica de introdução da fala foi vertida idiomaticamente; conservaram-se a concisão de ‘os seus cinquenta’, a força invocativa da fala de Elias e a atribuição explícita do fogo a Deus.
