id: 2KI.1.3
reference: 2 Kings 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: pt
  text: 'Mas o anjo de Yahweh falou a Elias, o tisbita: “Levante-se, suba ao encontro dos mensageiros do rei de Samaria e diga-lhes: ‘É por não haver Deus em Israel[a] que vocês vão consultar Baal-Zebube, o deus de Ecrom?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É por falta de um Deus em Israel”.'
    reason: Alternativa lexical para a construção הֲמִבְּלִי אֵין, que pode ser expressa em termos de causa (“por não haver”) ou de carência (“por falta de”).
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Mas o anjo de Yahweh
  rationale: A conjunção וּ é vertida como “Mas” para marcar o contraste narrativo com a iniciativa do rei no versículo anterior. מַלְאַךְ, neste contexto, é naturalmente “anjo”, enquanto o nome divino יְהוָה é preservado como “Yahweh”.
- source_word: דִּבֶּר אֶל
  choice: falou a
  rationale: A expressão significa normalmente “falar a/com”. “Falou a” preserva o verbo sem o reduzir a uma simples fórmula de introdução do discurso.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Elias, o tisbita
  rationale: Usa-se a forma portuguesa tradicional do nome próprio, “Elias”, e o gentílico הַתִּשְׁבִּי é traduzido convencionalmente como “o tisbita”.
- source_word: קוּם עֲלֵה
  choice: Levante-se, suba
  rationale: Os dois imperativos são mantidos separadamente. “Suba” conserva o valor direcional de עֲלֵה, sem simplificá-lo para apenas “vá”.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: A expressão indica que Elias deve ir para encontrar os mensageiros. “Ao encontro de” preserva essa finalidade sem acrescentar a ideia interpretativa de confronto.
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: os mensageiros do rei de Samaria
  rationale: Aqui מַלְאָךְ designa agentes humanos, por isso “mensageiros” os distingue do “anjo” mencionado no início. “Rei de Samaria” reproduz a formulação hebraica.
- source_word: וְדַבֵּר אֲלֵהֶם
  choice: e diga-lhes
  rationale: Antes de discurso direto, “diga-lhes” é idiomático em português e transmite com clareza a ordem de comunicar a mensagem.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: É por não haver Deus em Israel
  rationale: A construção introduz uma pergunta retórica de censura. A formulação mantém a relação causal e a ênfase do hebraico, enquanto a nota registra uma alternativa lexical possível.
- source_word: אַתֶּם הֹלְכִים
  choice: vocês vão
  rationale: O particípio expressa uma ação em andamento ou pretendida. “Vocês vão” é natural e claro em português internacional com boa legibilidade brasileira.
- source_word: לִדְרֹשׁ
  choice: consultar
  rationale: No contexto de busca de resposta oracular junto a uma divindade, דרש significa procurar orientação ou resposta. “Consultar” comunica esse sentido com precisão.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebube
  rationale: O nome próprio composto é transliterado em forma adaptada ao português; o hífen evidencia seus dois elementos.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: o deus de Ecrom
  rationale: A construção identifica Baal-Zebube como a divindade associada a Ecrom. O artigo definido é natural e adequado ao sentido determinado da expressão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: “Anjo” é o sentido mais natural neste contexto narrativo e mantém a distinção em relação aos mensageiros humanos do rei, sem definir além do texto a identidade teológica desse ser.
- issue: Força da pergunta sobre a inexistência de Deus em Israel
  choice: pergunta retórica de censura, sem negar literalmente a existência de Deus
  alternative: afirmação literal de que Israel não teria Deus
  rationale: A construção hebraica repreende a busca de um oráculo estrangeiro e pressupõe que há Deus em Israel; a tradução conserva a forma interrogativa e sua tensão retórica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. Mantêm-se os dois imperativos, a pergunta retórica e a distinção lexical entre o anjo divino e os mensageiros humanos. A colocação pronominal em “diga-lhes” conserva um tom literário natural sem arcaísmo excessivo.
