base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: pt
  text: 'Os mensageiros voltaram para ele, e ele lhes disse: “Por que[a] vocês voltaram?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “Que é isto? Vocês voltaram?”; uma expressão idiomática que significa “Por que vocês voltaram?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: voltaram
  rationale: O verbo שׁוב indica aqui o retorno dos enviados àquele que os havia mandado; “voltaram” é natural e mantém o sentido direcional.
- source_word: הַמַּלְאָכִים
  choice: os mensageiros
  rationale: Neste contexto, מַלְאָכִים designa agentes humanos enviados pelo rei, não seres celestiais; “mensageiros” é a equivalência contextual direta.
- source_word: אֵלָיו
  choice: para ele
  rationale: A preposição indica movimento em direção ao rei; “para ele” expressa isso com clareza, sem explicitar no texto um referente que o hebraico deixa pronominal.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: e ele lhes perguntou
  rationale: Embora o verbo hebraico seja literalmente “disse”, o enunciado seguinte é uma pergunta direta; em português atual, “perguntou” comunica naturalmente a função discursiva.
- source_word: מַה זֶּה
  choice: Por que
  rationale: A expressão literal “Que é isto...?” funciona idiomaticamente como pergunta sobre o motivo da ação; “Por que” transmite seu sentido em português claro.
- source_word: שַׁבְתֶּם
  choice: vocês voltaram
  rationale: A forma verbal é segunda pessoa masculina plural. “Vocês voltaram” é amplamente compreensível e natural no português moderno, com boa legibilidade brasileira.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de leitura amplamente acessível. O pronome “ele” preserva a referência implícita do hebraico e depende do contexto anterior. Optou-se por diálogo natural sem perder a concisão narrativa.
