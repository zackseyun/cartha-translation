base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: pt
  text: 'Elias respondeu ao capitão de cinquenta: “Mas, se eu sou homem de Deus, que desça fogo do céu e consuma você e os seus cinquenta homens.” Então desceu fogo do céu e consumiu o capitão e os seus cinquenta homens.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: capitão de cinquenta
  rationale: Mantém o título militar e a unidade sob seu comando, em formulação tradicional e inteligível.
- source_word: וְאִם
  choice: Pois bem, se
  rationale: O waw pode ter força discursiva ou enfática no contexto; esta formulação preserva a resposta incisiva sem impor um contraste lógico forte.
- source_word: תֵּרֶד
  choice: que desça
  rationale: O imperfeito jussivo expressa a convocação ou determinação de que o fogo desça.
- source_word: וְתֹאכַל / וַתֹּאכַל
  choice: consuma / consumiu
  rationale: No contexto do fogo, 'consumir' comunica naturalmente o sentido de devorar ou destruir.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: os seus cinquenta homens
  rationale: A expressão elíptica significa o grupo de cinquenta comandado pelo capitão; 'homens' torna explícito em português o referente implícito.
theological_decisions:
- issue: A condição “se eu sou homem de Deus”
  choice: Preservar a forma condicional sem explicar se Elias expressa dúvida ou propõe uma prova.
  alternative: 'Traduzir como afirmação enfática: “já que sou homem de Deus”.'
  rationale: O hebraico apresenta אִם, uma condição formal; o cumprimento subsequente confirma a identidade de Elias, mas a tradução não deve antecipar essa interpretação.
- issue: Origem sobrenatural do juízo
  choice: Manter literalmente “fogo do céu”.
  alternative: Parafrasear como raio ou outro fenômeno natural.
  rationale: O texto atribui o acontecimento ao céu e o apresenta como confirmação divina; uma identificação naturalista excederia a evidência lexical.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Evitou-se o redundante “respondeu e disse”, naturalizando-o como “respondeu”. A repetição narrativa entre a ordem e seu cumprimento foi preservada.
