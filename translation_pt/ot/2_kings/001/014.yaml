language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: pt
  text: 'Veja: desceu fogo do céu e consumiu os dois primeiros comandantes de cinquenta e os seus grupos de cinquenta[a]. Mas agora, que a minha vida[b] seja preciosa aos teus olhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «os seus cinquentas», isto é, as unidades de cinquenta homens sob o comando deles.
    reason: lexical_alternative
  - marker: b
    text: Ou «a minha alma»; neste contexto, «alma» se refere à vida do homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Mantém a chamada enfática à atenção, em linguagem portuguesa atual e natural.
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: desceu fogo do céu
  rationale: Reproduz de modo direto o movimento e a origem expressos no hebraico, preservando a ordem marcada com o verbo antes do sujeito.
- source_word: וַתֹּאכַל
  choice: consumiu
  rationale: Embora אכל signifique literalmente «comer», com fogo como sujeito «consumir» expressa naturalmente seu efeito destruidor.
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: os dois primeiros comandantes de cinquenta
  rationale: שַׂר designa aqui um oficial militar, e «de cinquenta» conserva a designação hebraica da unidade comandada; הָרִאשֹׁנִים remete aos dois oficiais anteriores.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: e os seus grupos de cinquenta
  rationale: Explicita de forma compreensível que o plural hebraico se refere às duas unidades de cinquenta homens, sem reduzi-lo genericamente a «seus homens».
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Expressa a transição contrastiva entre o destino dos grupos anteriores e o apelo pessoal do oficial.
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: que a minha vida seja preciosa aos teus olhos
  rationale: O jussivo é vertido como pedido; נֶפֶשׁ refere-se concretamente à vida do suplicante, enquanto «preciosa aos teus olhos» preserva a imagem e o valor de יקר.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no pedido para sobreviver
  choice: vida
  alternative: alma
  rationale: O oficial pede que não seja morto como os que vieram antes. «Vida» comunica o referente concreto sem impor uma concepção dicotômica de corpo e alma que o contexto não exige.
translation_notes:
  register: Português atual, digno e amplamente compreensível. «Comandantes» evita o sabor excessivamente histórico de «capitães» e deixa clara a função militar. Conservou-se a expressão idiomática hebraica «preciosa aos teus olhos», que permanece natural no registro bíblico português.
