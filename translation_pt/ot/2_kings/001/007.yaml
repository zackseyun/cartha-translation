base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: pt
  text: 'Então ele lhes perguntou: “Qual era a aparência[a] do homem que subiu ao encontro de vocês e lhes falou estas palavras?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que tipo de homem era?” O termo hebraico pode indicar modo, porte, descrição ou aparência; aqui provavelmente se refere às características pelas quais o homem poderia ser identificado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט
  choice: Qual era a aparência
  rationale: A expressão pergunta pelas características que permitiriam identificar o homem. “Aparência” é natural em português e corresponde à resposta descritiva do versículo seguinte, sem eliminar em nota a amplitude de מִשְׁפַּט.
- source_word: הָאִישׁ
  choice: do homem
  rationale: O artigo definido aponta para o indivíduo específico que os mensageiros encontraram.
- source_word: עָלָה
  choice: veio
  rationale: Embora o verbo signifique literalmente “subiu”, aqui descreve o movimento do homem em direção aos mensageiros. Em português, “veio ao encontro” comunica naturalmente essa perspectiva; explicitar “subiu” sugeriria uma informação topográfica que o contexto não exige.
- source_word: לִקְרַאתְכֶם
  choice: ao encontro de vocês
  rationale: Equivalente idiomático e claro para a expressão hebraica de encontro ou aproximação.
- source_word: וַיְדַבֵּר אֲלֵיכֶם
  choice: e lhes falou
  rationale: Preserva o sentido de dirigir a fala aos mensageiros e evita uma construção pesada.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: Tradução concreta e próxima do hebraico, adequada à referência ao que havia acabado de ser comunicado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para a segunda pessoa do plural. “Perguntou” torna explícita a força interrogativa da fala sem acrescentar conteúdo. A formulação mantém a pergunta identificadora e registra em nota a ambiguidade lexical do hebraico.
