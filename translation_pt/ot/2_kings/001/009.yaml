base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: pt
  text: 'Então ele enviou a Elias um comandante de cinquenta homens, acompanhado de seus cinquenta soldados. O comandante subiu até Elias, e eis que Elias estava sentado no alto do monte[a]. Ele lhe disse: “Homem de Deus, o rei diz[b]: ‘Desça!’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no alto da colina” ou “no alto da montanha”. O termo hebraico הַר pode indicar uma elevação de diferentes dimensões, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “o rei falou: ‘Desça!’”. A fórmula hebraica usada por um mensageiro é traduzida aqui de modo idiomático por “o rei diz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: Então ele enviou a Elias
  rationale: O wayyiqtol dá sequência à narrativa, expresso naturalmente por “Então”. O pronome referente a Elias é explicitado para evitar ambiguidade em português, sem identificar além do texto o sujeito de “enviou”.
- source_word: שַׂר חֲמִשִּׁים
  choice: um comandante de cinquenta homens
  rationale: A expressão designa um oficial militar responsável por um contingente de cinquenta; “comandante” é atual e claro.
- source_word: וַחֲמִשָּׁיו
  choice: acompanhado de seus cinquenta soldados
  rationale: O hebraico diz literalmente “e os seus cinquenta”; “soldados” explicita o sentido militar implícito e evita uma formulação truncada.
- source_word: וַיַּעַל אֵלָיו
  choice: O comandante subiu até Elias
  rationale: “Subiu” preserva o movimento vertical em direção ao lugar elevado onde Elias estava. Os referentes pronominais são explicitados para clareza.
- source_word: וְהִנֵּה יֹשֵׁב
  choice: e o encontrou sentado
  rationale: הִנֵּה introduz a cena percebida pelo comandante. Em português narrativo, “o encontrou sentado” transmite essa descoberta vívida com maior naturalidade do que “e eis que estava sentado”.
- source_word: עַל רֹאשׁ הָהָר
  choice: no alto do monte
  rationale: רֹאשׁ indica o alto ou cume; הַר pode designar monte, colina ou montanha. “Monte” mantém uma amplitude semelhante em português.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Homem de Deus
  rationale: Título reconhecido para um profeta, preservado de modo direto.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: o rei diz
  rationale: Embora a forma hebraica seja literalmente “o rei falou”, o presente é a fórmula idiomática portuguesa para transmitir a mensagem vigente do rei, sem ampliar o verbo para “ordena”.
- source_word: רֵדָה
  choice: Desça!
  rationale: O imperativo exige que Elias desça de sua posição elevada. “Desça” é natural e preserva a direção sem acrescentar um elemento dêitico ausente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Os referentes foram explicitados apenas onde a sequência de pronomes seria pouco natural ou ambígua em português; a identidade do sujeito que envia permanece pronominal, como no hebraico.
