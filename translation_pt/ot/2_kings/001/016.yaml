source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: pt
  text: 'E ele lhe falou: “Assim diz Yahweh: Visto que você enviou mensageiros para consultar Baal-Zebube[b], deus de Ecrom — acaso não há Deus em Israel para consultar a sua palavra[a]? —, por isso, da cama para a qual você subiu[c], você não descerá, pois certamente morrerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “consultar a sua palavra”, provavelmente no sentido de buscar dele uma mensagem ou resposta divina.'
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico traz Baal-Zebube; a forma relacionada Baal-Zebul aparece na tradição posterior.
    reason: alternative_reading
  - marker: c
    text: 'Ou, mais literalmente: “a cama à qual você subiu ali”. O hebraico mantém o contraste entre subir à cama e não descer dela.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: E ele lhe falou
  rationale: Mantém o verbo ‘falar’ e o referente pronominal do hebraico, sem explicitar uma identidade que o versículo não nomeia.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Reproduz a fórmula profética tradicional e translitera diretamente o nome divino.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: você enviou mensageiros
  rationale: Os מַלְאָכִים são aqui enviados humanos; ‘mensageiros’ evita a leitura de ‘anjos’.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: consultar Baal-Zebube
  rationale: Neste contexto, דרש designa buscar uma resposta ou oráculo de uma divindade; ‘consultar’ é natural e preserva esse sentido religioso.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: será por não haver Deus em Israel
  rationale: Conserva a força da pergunta retórica que repreende o rei por recorrer a uma divindade estrangeira.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: cuja palavra se possa consultar
  rationale: Preserva a referência explícita à ‘palavra’ de Deus, embora em português a expressão exija leve reestruturação sintática.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: da cama para a qual você subiu, você não descerá
  rationale: Mantém a imagem concreta e o contraste hebraico entre ‘subir’ e ‘descer’, bem como a topicalização da cama, apesar de a formulação ser deliberadamente mais marcada em português.
- source_word: כִּי מוֹת תָּמוּת
  choice: pois certamente morrerá
  rationale: A construção infinitivo absoluto mais verbo finito intensifica a certeza da morte; ‘certamente’ transmite essa ênfase.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; ‘Yahweh’ preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de לִדְרֹשׁ בִּדְבָרוֹ
  choice: cuja palavra se possa consultar
  alternative: a quem consultar; de quem buscar uma resposta
  rationale: A tradução conserva דָּבָר, ‘palavra’, sem definir além do texto se se trata especificamente de profecia, oráculo ou outro meio de revelação.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com tratamento por ‘você’ para legibilidade brasileira. A ordem marcada da sentença final foi mantida para refletir a cama colocada em destaque no hebraico. Os marcadores de nota foram posicionados junto às expressões que de fato explicam.
