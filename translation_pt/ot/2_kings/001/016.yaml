  to: 'E ele lhe falou: “Assim diz Yahweh: Visto que você enviou mensageiros para consultar Baal-Zebube[b], deus de Ecrom — acaso não há Deus em Israel para consultar a sua palavra[a]? —, por isso, da cama para a qual você subiu[c], você não descerá, pois certamente morrerá.”'
