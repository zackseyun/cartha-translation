base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: pt
  text: 'De novo, o rei enviou um terceiro comandante de cinquenta com os seus cinquenta homens. Ele subiu e, ao chegar, o terceiro comandante de cinquenta pôs-se de joelhos diante de Elias, suplicou-lhe e disse: “Homem de Deus, por favor, que a minha vida e a vida destes cinquenta servos teus sejam preciosas aos teus olhos.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que a minha alma e a alma destes cinquenta servos teus sejam preciosas aos teus olhos”. O termo hebraico néfesh pode significar “vida”, “pessoa” ou “alma”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: De novo, o rei enviou
  rationale: O verbo וַיָּשָׁב tem aqui força reiterativa na sequência narrativa. A explicitação de “o rei” recupera naturalmente em português o sujeito do contexto anterior.
- source_word: שַׂר חֲמִשִּׁים שְׁלִשִׁים וַחֲמִשָּׁיו
  choice: um terceiro comandante de cinquenta com os seus cinquenta homens
  rationale: Preserva a ordem ordinal e a função militar. “Homens” é uma explicitação contextual natural do grupo contado, sem alterar o referente.
- source_word: וַיַּעַל וַיָּבֹא
  choice: Ele subiu e, ao chegar
  rationale: Mantém os dois movimentos verbais do hebraico, mas evita em português a formulação pouco natural “subiu e veio”.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו
  choice: pôs-se de joelhos
  rationale: Expressa com naturalidade a postura corporal de submissão indicada por כרע e pela menção aos joelhos.
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: suplicou-lhe
  rationale: O hitpael de חנן indica um pedido insistente e humilde; “suplicou-lhe” conserva essa intensidade em registro digno.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Homem de Deus
  rationale: Título profético tradicional e semanticamente direto; a pontuação marca seu uso vocativo.
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: por favor, que ... sejam preciosas aos teus olhos
  rationale: Preserva a metáfora hebraica de valor e estima, em vez de reduzi-la à consequência implícita “poupa”.
- source_word: נַפְשִׁי וְנֶפֶשׁ עֲבָדֶיךָ
  choice: a minha vida e a vida ... dos teus servos
  rationale: Neste contexto de ameaça de morte, נֶפֶשׁ designa a vida da pessoa. O singular repetido foi mantido para acompanhar de perto a estrutura hebraica.
theological_decisions:
- issue: Sentido de נֶפֶשׁ em uma situação de perigo mortal
  choice: vida
  alternative: alma
  rationale: O pedido trata da preservação da vida do comandante e de seus homens. “Vida” comunica o sentido contextual sem impor uma antropologia posterior ao termo hebraico.
- issue: Força de תִּיקַר na súplica
  choice: sejam preciosas aos teus olhos
  alternative: poupa
  rationale: A tradução mantém a imagem de valor presente no texto e deixa que o leitor perceba sua consequência prática — que Elias não permita a morte deles — sem substituir a formulação hebraica por uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “comandante de cinquenta” para o posto militar, “pôs-se de joelhos” para naturalidade narrativa e formas de segunda pessoa coerentes na fala dirigida a Elias.
