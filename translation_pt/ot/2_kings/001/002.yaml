revisions:
- from: 'Acazias caiu através da grade do seu aposento no andar de cima, em Samaria, e ficou doente. Então enviou mensageiros e lhes disse: “Vão consultar Baal-Zebube[a], o deus de Ecrom, para saber se vou me recuperar desta enfermidade”.'
  to: 'Acazias caiu pela treliça de seu aposento no andar de cima, que ficava em Samaria, e adoeceu. Então enviou mensageiros e lhes disse: “Vão consultar Baal-Zebube[a], o deus de Ecrom, para saber se vou me recuperar desta enfermidade.”'
  rationale: A revisão torna mais concreta a estrutura pela qual Acazias caiu e reproduz de modo explícito a oração relativa que localiza o aposento em Samaria. «Adoeceu» mantém o sentido de ויחל sem especificar indevidamente a natureza da condição.
