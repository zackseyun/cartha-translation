  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: pt
  text: 'Acazias caiu pela treliça de seu aposento no andar de cima, que ficava em Samaria, e adoeceu. Então enviou mensageiros e lhes disse: “Vão consultar Baal-Zebube[a], o deus de Ecrom, para saber se vou me recuperar desta enfermidade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Zebube é a forma hebraica do nome; a forma posterior Belzebu aparece em grego e em parte da tradição bíblica em português.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: através da grade
  rationale: Expressa a passagem pela abertura gradeada e conserva a imagem concreta do hebraico sem acrescentar explicitamente uma janela.
- source_word: עֲלִיָּתוֹ
  choice: seu aposento no andar de cima
  rationale: Comunica em português atual que se tratava de um cômodo situado na parte superior da residência.
- source_word: וַיָּחַל
  choice: ficou doente
  rationale: O verbo indica que Acazias adoeceu após a queda. Esta opção preserva o sentido lexical sem especificar além do texto se a condição era apenas um ferimento.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: O contexto indica agentes humanos enviados pelo rei, não seres celestiais.
- source_word: דִרְשׁוּ
  choice: consultar
  rationale: Neste contexto, o verbo descreve a busca de uma resposta oracular junto a uma divindade.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebube
  rationale: Mantém no texto principal a forma do nome baseada no hebraico, em transliteração reconhecível para leitores de português.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: o deus de Ecrom
  rationale: Reproduz diretamente a relação construta que identifica a divindade associada a Ecrom.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: para saber se vou me recuperar desta enfermidade
  rationale: Traduz de modo idiomático a expressão literalmente ligada a 'viver desta enfermidade', preservando a incerteza sobre a recuperação.
- source_word: וַיִּפֹּל
  choice: caiu
  rationale: Equivalente direto e natural do verbo narrativo hebraico.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma portuguesa consagrada do topônimo.
theological_decisions:
- issue: Forma do nome da divindade pagã
  choice: Baal-Zebube
  alternative: Belzebu
  rationale: O texto principal segue a forma hebraica בַּעַל זְבוּב. A forma posterior, difundida pela tradição grega e portuguesa, é registrada em nota sem substituir a leitura da fonte hebraica.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A coordenação narrativa foi mantida sem introduzir um marcador temporal ausente do hebraico. O marcador de nota foi colocado junto ao nome ao qual a nota efetivamente se refere.
