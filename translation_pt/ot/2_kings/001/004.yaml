  text: וְ/לָ/כֵן֙ כֹּֽה אָמַ֣ר יְהוָ֔ה הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּ֣י מ֣וֹת תָּמ֑וּת וַ/יֵּ֖לֶךְ אֵלִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh: “Você não descerá da cama em que subiu,[a] pois certamente morrerá”. Então Elias partiu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a cama à qual você subiu ali”; a formulação conserva o contraste entre “subir” e “descer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a consequência da repreensão e da sentença anteriores.
- source_word: כֹּה אָמַר יְהוָה
  choice: assim diz Yahweh
  rationale: Preserva a fórmula profética solene e mantém explícito o nome divino.
- source_word: הַמִּטָּה
  choice: a cama
  rationale: É o sentido comum de מִטָּה e evita a especificação interpretativa de “leito de enfermo”.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: em que subiu
  rationale: O português omite naturalmente o advérbio resumptivo שׁם, mas conserva o verbo “subir” e seu contraste com “descer”.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: Você não descerá da cama
  rationale: Mantém a negação da descida e o contraste lexical com עלה, “subir”.
- source_word: כִּי מוֹת תָּמוּת
  choice: pois certamente morrerá
  rationale: Traduz a certeza enfática comunicada pelo infinitivo absoluto seguido do verbo finito.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: Então Elias partiu
  rationale: Faz avançar a narrativa e transmite que Elias seguiu seu caminho; “partiu” é natural neste encerramento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção mantém a solenidade da fórmula profética e preserva o contraste verbal do hebraico sem reproduzir sua sintaxe resumptiva de maneira artificial.
