  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֲחַזְיָ֖הוּ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Os demais atos que Acazias praticou não estão escritos[a] no Livro das Crônicas dos Reis de Israel[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «registrados». O hebraico diz literalmente «escritos», numa fórmula comum de referência aos arquivos reais.
    reason: lexical_alternative
  - marker: b
    text: O «Livro das Crônicas dos Reis de Israel» era uma fonte de anais reais citada em Reis; não se trata necessariamente do livro bíblico de Crônicas.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Os demais
  rationale: יֶתֶר introduz a fórmula conclusiva sobre o restante do reinado; o וְ tem aqui valor de ligação discursiva e não exige um «e» inicial em português.
- source_word: דִּבְרֵי
  choice: atos
  rationale: Nesta fórmula historiográfica, דִּבְרֵי designa os acontecimentos e feitos do rei, não apenas suas palavras.
- source_word: אֲחַזְיָהוּ
  choice: Acazias
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֲשֶׁר עָשָׂה
  choice: o que ele fez
  rationale: A expressão explica o conteúdo de «atos» de maneira natural, preservando a repetição enfática do hebraico.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica, que espera resposta afirmativa, e conserva o sentido literal de כְתוּבִים.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל possa significar literalmente «sobre», «no Livro» é o equivalente idiomático adequado para um registro escrito; סֵפֶר pode indicar livro ou rolo.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Crônicas
  rationale: No contexto das fontes régias, a expressão se refere a registros analísticos; «Crônicas» preserva o título convencional.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: O לְ integra o título da fonte e é expresso naturalmente em português pela relação genitiva «dos».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Os travessões preservam a relação explicativa entre «atos» e «o que ele fez» sem acrescentar uma conjunção ausente no hebraico.
