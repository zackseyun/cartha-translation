base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: pt
  text: 'Então o anjo de Yahweh falou a Elias: “Desça com ele; não tenha medo dele[a].” Elias se levantou e desceu com ele até o rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “não tenha medo de diante dele”, isto é, “não tema por causa da presença dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode significar “mensageiro” ou “anjo”; neste contexto de comunicação divina, “anjo” é a opção mais natural. O nome יְהוָה é transliterado como “Yahweh”.
- source_word: רֵד אוֹתוֹ
  choice: Desça com ele
  rationale: O imperativo de ירד expressa movimento para baixo, e אוֹתוֹ funciona aqui idiomaticamente como indicação de companhia.
- source_word: אַל תִּירָא מִפָּנָיו
  choice: não tenha medo dele
  rationale: A expressão hebraica, literalmente ligada à face ou presença do homem, comunica de modo natural que Elias não deveria temê-lo.
- source_word: וַיָּקָם
  choice: Elias se levantou
  rationale: O verbo marca a ação de resposta. A explicitação do sujeito evita ambiguidade em português e mantém a narrativa fluente.
- source_word: וַיֵּרֶד אוֹתוֹ אֶל הַמֶּלֶךְ
  choice: desceu com ele até o rei
  rationale: A construção repete a ideia de acompanhamento e apresenta o rei como destino do movimento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Identidade de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: “Anjo” corresponde naturalmente ao contexto, sem acrescentar uma identificação cristológica ou outra definição teológica que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega-se “Desça” e “não tenha” como formas naturais de tratamento no contexto. O marcador da nota foi colocado junto à expressão que ela esclarece.
