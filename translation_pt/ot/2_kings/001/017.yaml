  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: pt
  text: Assim, ele morreu[a], conforme a palavra de Yahweh que Elias havia dito. E Jorão tornou-se rei em seu lugar no segundo ano de Jorão, filho de Josafá, rei de Judá, porque Acazias não tinha filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ele morreu [...] E Jorão reinou em seu lugar”. Os verbos hebraicos são formas narrativas simples; “tornou-se rei” destaca a ascensão ao trono, enquanto “reinou” é uma alternativa mais formal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Assim, ele morreu
  rationale: O wayyiqtol dá continuidade à narrativa e, neste contexto, apresenta o cumprimento do anúncio anterior; “Assim” expressa naturalmente essa sequência sem ampliar o sentido de “morreu”.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: כִּדְבַר indica conformidade com a palavra pronunciada. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: que Elias havia anunciado
  rationale: A oração relativa modifica “palavra”; o mais-que-perfeito marca a anterioridade da fala de Elias. “Anunciado” comunica com naturalidade uma palavra profética, sem alterar quem a proferiu.
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: E Jorão tornou-se rei em seu lugar
  rationale: Neste contexto, מלך assinala a ascensão ao trono; “tornou-se rei” é natural em português, e “em seu lugar” preserva תַּחְתָּיו.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: no segundo ano de Jorão
  rationale: A construção fornece uma data segundo o reinado de Jorão de Judá; a formulação é idiomática e mantém a referência cronológica.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: filho de Josafá, rei de Judá
  rationale: A aposição distingue o Jorão de Judá do Jorão que sucede Acazias em Israel.
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: porque Acazias não tinha filho
  rationale: כִּי introduz a razão da sucessão. O hebraico diz literalmente “ele”, mas explicitar “Acazias” evita que o pronome seja atribuído ao Jorão mencionado imediatamente antes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Referente do pronome em כִּי לֹא הָיָה לוֹ בֵּן
  choice: Acazias
  alternative: ele
  rationale: O referente contextual é o rei que morreu, Acazias, cuja falta de filho explica a sucessão por Jorão. A explicitação evita uma ambiguidade involuntária em português, sem resolver qualquer tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais correntes no Brasil e amplamente reconhecíveis. A repetição de “Jorão” foi mantida para distinguir os dois reis homônimos. “Acazias” foi explicitado na oração final para impedir que “ele” pareça referir-se ao Jorão de Judá.
