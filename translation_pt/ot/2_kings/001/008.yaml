base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: pt
  text: 'Eles lhe disseram: “Era um homem peludo[a], com um cinto de couro preso à cintura.” Então ele disse: “É Elias, o tisbita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um homem que usava uma veste de pelos”. A expressão hebraica diz literalmente “um possuidor de pelos” e pode descrever tanto um homem peludo quanto alguém vestido com tecido de pelos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: homem
  rationale: O substantivo designa naturalmente um adulto do sexo masculino neste contexto e integra a descrição de Elias.
- source_word: בַּעַל שֵׂעָר
  choice: homem peludo
  rationale: A expressão significa literalmente algo como “possuidor de pelos/cabelos” e pode descrever a aparência física. A possibilidade de se referir a uma veste de pelos é preservada em nota.
- source_word: וְאֵזוֹר עוֹר
  choice: com um cinto de couro
  rationale: אֵזוֹר indica cinto ou faixa, e עוֹר especifica o material; a formulação é clara e natural em português moderno.
- source_word: אָזוּר
  choice: preso
  rationale: O particípio descreve o cinto posto ou ajustado ao corpo; “preso” expressa isso de modo corrente sem o arcaísmo de “cingido”.
- source_word: בְּמָתְנָיו
  choice: à cintura
  rationale: מָתְנַיִם refere-se à região dos lombos ou da cintura; “à cintura” é idiomático e contemporâneo.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Elias, o tisbita
  rationale: Emprega a forma portuguesa tradicional do nome e traduz o gentílico de maneira convencional.
- source_word: הוּא
  choice: É
  rationale: Na identificação de alguém a partir de uma descrição, “É Elias” é a construção mais natural em português.
