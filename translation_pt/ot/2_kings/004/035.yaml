base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: pt
  text: Então ele voltou e andou pela casa, de um lado para o outro[a]. Depois subiu e estendeu-se sobre o menino[b]. O menino espirrou sete vezes e abriu os olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “uma vez para cá e outra para lá”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “inclinou-se sobre ele”. O verbo hebraico pode indicar curvar-se ou inclinar-se sobre alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Então ele voltou
  rationale: O wayyiqtol de שׁוּב dá continuidade à narrativa e expressa retorno; “então” comunica naturalmente a sequência em português.
- source_word: וַיֵּלֶךְ בַּבַּיִת
  choice: andou pela casa
  rationale: הלך com a expressão locativa descreve movimento dentro da casa. “Andou pela casa” é claro sem acrescentar a ideia emocional sugerida por “ficou andando de um lado para o outro”.
- source_word: אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: de um lado para o outro
  rationale: A expressão hebraica descreve movimento alternado, literalmente “uma vez para cá e outra para lá”. A formulação escolhida é corrente e inteligível em português.
- source_word: וַיַּעַל
  choice: Depois subiu
  rationale: Preserva o sentido espacial de עלה, provavelmente em referência ao quarto de cima ou ao lugar onde o menino estava, sem explicitar o destino não declarado neste versículo.
- source_word: וַיִּגְהַר עָלָיו
  choice: estendeu-se sobre o menino
  rationale: גהר pode descrever alguém que se curva ou se inclina sobre outra pessoa. No contexto da ação corporal já narrada, “estendeu-se sobre” comunica a postura sem explicar seu mecanismo; a alternativa mais lexicalmente direta consta em nota.
- source_word: וַיְזוֹרֵר
  choice: espirrou
  rationale: O verbo raro é tradicional e lexicalmente entendido como “espirrar”; o numeral subsequente indica a repetição da ação.
- source_word: הַנַּעַר
  choice: o menino
  rationale: נַעַר possui ampla faixa semântica, mas aqui designa o filho da sunamita. “Menino” é específico, natural e adequado ao contexto.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: 'Embora עַד possa significar “até”, com a contagem de ocorrências a expressão apresenta o total completo: sete vezes.'
- source_word: וַיִּפְקַח הַנַּעַר אֶת עֵינָיו
  choice: abriu os olhos
  rationale: פקח עיניים é a expressão hebraica comum para abrir os olhos; a tradução simples reproduz o sentido de modo idiomático.
theological_decisions:
- issue: Natureza da ação de Eliseu sobre o menino
  choice: Descrever a postura corporal como “estendeu-se sobre o menino”, sem explicar como ela se relaciona com o milagre.
  alternative: “Inclinou-se sobre ele” ou “curvou-se sobre ele”.
  rationale: O texto relata a ação física, mas não lhe atribui explicitamente um mecanismo mágico, sacramental ou médico. A tradução preserva o acontecimento e sua tensão teológica sem acrescentar uma explicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “de um lado para o outro” no texto para naturalidade, preservando a forma mais literal em nota. A repetição de “o menino” evita um pronome potencialmente ambíguo e mantém o foco narrativo.
