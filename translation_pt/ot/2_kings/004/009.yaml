  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: pt
  text: 'E ela disse ao marido: “Olhe, eu sei que este homem que passa por aqui regularmente[a] é um santo homem de Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “continuamente”.
    reason: Alternativa lexical mais direta para תָמִיד; no contexto, a ideia provável é de passagem habitual e repetida.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: E ela disse
  rationale: O wayyiqtol dá continuidade à narrativa; “E ela disse” preserva a sequência de modo simples e natural.
- source_word: אֶל אִישָׁהּ
  choice: ao marido
  rationale: Neste contexto doméstico, אִישׁ com o sufixo de terceira pessoa feminina singular designa naturalmente o marido dela.
- source_word: הִנֵּה נָא
  choice: Olhe
  rationale: A expressão chama a atenção do interlocutor, com נָא suavizando o apelo. “Olhe” comunica essa função em português atual sem a rigidez de “Eis, por favor”.
- source_word: יָדַעְתִּי
  choice: eu sei
  rationale: O perfeito expressa uma convicção já formada a partir da observação repetida; “eu sei” é a formulação portuguesa mais natural.
- source_word: אִישׁ אֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título reconhecido para um profeta ou representante divinamente comissionado, sem reduzi-lo apenas a “homem piedoso”.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: Mantém o sentido de santidade ou consagração próprio de קָדוֹשׁ e sua força teológica.
- source_word: עֹבֵר עָלֵינוּ
  choice: passa por aqui
  rationale: No contexto de deslocamento junto à casa da mulher, a expressão indica passar pelo lugar onde eles estão. “Por aqui” é idiomático e evita o pouco natural “passa por nós”.
- source_word: תָּמִיד
  choice: regularmente
  rationale: Neste contexto, indica recorrência habitual, não necessariamente ação ininterrupta. “Regularmente” expressa essa frequência com precisão; a alternativa mais formal está registrada em nota.
theological_decisions:
- issue: Tradução do título אִישׁ אֱלֹהִים
  choice: homem de Deus
  alternative: homem piedoso
  rationale: “Homem de Deus” conserva o título literário e teológico usado nos livros históricos para um profeta ou enviado de Deus, sem acrescentar afirmações doutrinárias além do texto.
- issue: Relação de קָדוֹשׁ com o título “homem de Deus”
  choice: um santo homem de Deus
  alternative: um homem de Deus que é santo
  rationale: A formulação escolhida mantém קָדוֹשׁ como qualificação do homem designado pelo título “homem de Deus”, preservando a afirmação direta do hebraico sem explicar em que sentido ele é santo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Olhe” funciona como marcador natural de atenção; “passa por aqui regularmente” comunica o caráter habitual da ação. A ordem “santo homem de Deus” preserva intacto o título “homem de Deus” e a qualificação “santo”.
