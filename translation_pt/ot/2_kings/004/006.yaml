base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: pt
  text: 'Quando os recipientes ficaram cheios, ela disse ao filho: “Traga-me outro recipiente.” Mas ele lhe respondeu: “Não há mais nenhum recipiente.” Então o azeite parou[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o azeite ficou parado”; isto é, deixou de fluir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת
  choice: Quando ... ficaram cheios
  rationale: A construção com כְּ e infinitivo construto introduz uma oração temporal. A formulação explicita naturalmente em português que os recipientes atingiram sua capacidade.
- source_word: הַכֵּלִים / כֶּלִי
  choice: recipientes / recipiente
  rationale: כְּלִי é um termo amplo para objeto ou vasilha. “Recipiente” é atual, claro e não especifica indevidamente o material ou o formato.
- source_word: הַגִּישָׁה
  choice: Traga-me
  rationale: O imperativo hifil de נגשׁ significa aproximar ou apresentar algo. No contexto, a mãe pede que o filho lhe passe mais um recipiente; “Traga-me” expressa isso com naturalidade.
- source_word: עוֹד
  choice: outro / mais nenhum
  rationale: Com o substantivo singular, עוֹד indica um item adicional. A alternância idiomática entre “outro” no pedido e “mais nenhum” na resposta preserva o sentido em português natural.
- source_word: אֵין עוֹד כֶּלִי
  choice: Não há mais nenhum recipiente
  rationale: אֵין declara inexistência, e עוֹד indica que não resta recipiente adicional disponível. A formulação é clara sem acrescentar detalhes não expressos.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: Então o azeite parou
  rationale: עמד significa literalmente “ficar de pé” ou “parar”. Aqui indica que o azeite deixou de fluir; o texto principal mantém a expressão concisa, enquanto a nota registra a forma literal e esclarece o sentido contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Azeite” foi preferido a “óleo” por ser a designação narrativa tradicional e natural para o produto neste contexto. Evitou-se “vasilha”, que pode sugerir uma forma mais específica do que o hebraico כְּלִי.
