  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: pt
  text: 'Geazi foi adiante deles e pôs o bordão sobre o rosto do menino, mas não houve voz nem reação.[a] Então voltou ao encontro de Eliseu e lhe comunicou: “O menino não despertou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não houve voz nem atenção (ou audição)”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: foi adiante deles
  rationale: Expressa naturalmente que Geazi seguiu à frente de Eliseu e da mulher, preservando o sentido direcional do hebraico.
- source_word: הַמִּשְׁעֶנֶת
  choice: o bordão
  rationale: Designa de modo digno e reconhecível o bastão de Eliseu; evita tanto o tom excessivamente cotidiano de “bengala” quanto possíveis conotações distintas de “vara”.
- source_word: עַל פְּנֵי הַנַּעַר
  choice: sobre o rosto do menino
  rationale: Mantém o sentido concreto de פָּנִים e traduz נַעַר de acordo com o contexto.
- source_word: וְאֵין קוֹל וְאֵין קָשֶׁב
  choice: não houve voz nem reação
  rationale: “Voz” preserva de perto קוֹל, enquanto “reação” comunica em português o valor contextual de קָשֶׁב, isto é, atenção ou audição responsiva, sem ampliar para “sinal de vida”.
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: voltou ao encontro de Eliseu
  rationale: Torna explícito o referente masculino em português para evitar possível ambiguidade com o menino, sem alterar a identificação narrativa.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: e lhe comunicou
  rationale: A fórmula hebraica introduz um relato direto; em português atual, “comunicou” transmite o ato de informar sem reproduzir o redundante “contou-lhe, dizendo”.
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: O menino não despertou
  rationale: Preserva o verbo hebraico “despertar/acordar” e a tensão narrativa, sem substituir a declaração por uma conclusão explícita sobre a morte.
theological_decisions:
- issue: Estado do menino após a tentativa de Geazi
  choice: O menino não despertou
  alternative: O menino não voltou à vida
  rationale: O hebraico declara literalmente que ele não despertou. A tradução mantém essa formulação e não resolve além do texto a relação entre sono, morte e restauração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Bordão” conserva o caráter narrativo e profético do objeto. A nota preserva a formulação hebraica incomum de קוֹל e קָשֶׁב; o marcador foi colocado após toda a expressão que ela esclarece.
