  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição deliberada de “Está tudo bem” preserva o paralelismo do hebraico; “diga-lhe” mantém um registro narrativo natural sem arcaísmo excessivo.
