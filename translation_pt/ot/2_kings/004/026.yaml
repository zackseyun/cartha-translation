base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: pt
  text: 'Agora, por favor, corra ao encontro dela e diga-lhe: “Está tudo bem[a] com você? Está tudo bem com seu marido? Está tudo bem com a criança[b]?” Ela respondeu: “Tudo bem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico shalom, repetido quatro vezes neste versículo, pode indicar paz, integridade ou bem-estar. Aqui, refere-se à situação ou ao bem-estar: “Está tudo bem...?” / “Tudo bem.”'
    reason: lexical_alternative
  - marker: b
    text: Ou “menino”. O hebraico yeled pode significar “criança” ou “menino”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Mantém o advérbio temporal que introduz a instrução urgente, sem intensificá-lo para “imediatamente”.
- source_word: רוּץ נָא
  choice: por favor, corra
  rationale: O imperativo preserva a força da ordem, e “por favor” representa a nuance de נָא, que pode suavizar o pedido ou reforçar seu apelo urgente.
- source_word: לִקְרָאתָהּ
  choice: ao encontro dela
  rationale: Expressa de modo natural a construção hebraica de sair ou ir para encontrar alguém.
- source_word: וֶאֱמָר לָהּ
  choice: e diga-lhe
  rationale: Mantém o sentido comum de אמר, “dizer”, e a referência explícita à mulher.
- source_word: הֲשָׁלוֹם לָךְ / לְאִישֵׁךְ / לַיָּלֶד
  choice: Está tudo bem com você / seu marido / a criança?
  rationale: A repetição de “Está tudo bem” reproduz a estrutura hebraica e comunica שָׁלוֹם como bem-estar ou situação segura, não apenas como saúde física.
- source_word: יֶלֶד
  choice: criança
  rationale: “Criança” preserva a amplitude lexical de יֶלֶד; no contexto, a criança é o filho da mulher, mas o termo hebraico em si também pode ser traduzido por “menino”.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: 'Ela respondeu: “Tudo bem.”'
  rationale: A resposta breve verte o único termo שָׁלוֹם de maneira inteligível em português e conserva sua concisão e possível reserva narrativa.
theological_decisions: []
