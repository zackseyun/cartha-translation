base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: pt
  text: Certo dia, Eliseu passou por Suném. Ali vivia uma mulher de destaque[a], que insistiu com ele para que comesse uma refeição. Assim, sempre que ele passava por ali, desviava-se para lá para comer uma refeição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “uma mulher grande”; a expressão provavelmente indica posição social, influência ou recursos.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “para comer pão”, expressão que pode designar uma refeição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Certo dia
  rationale: Reproduz de modo natural o início narrativo temporal hebraico, sem a rigidez de uma tradução palavra por palavra.
- source_word: וַיַּעֲבֹר אֱלִישָׁע אֶל שׁוּנֵם
  choice: Eliseu passou por Suném
  rationale: No contexto de viagem, עבר com o destino indica que Eliseu atravessou ou passou pela localidade; esta formulação também prepara a referência às visitas repetidas.
- source_word: אִשָּׁה גְדוֹלָה
  choice: uma mulher de destaque
  rationale: A expressão literalmente diz 'uma mulher grande', mas aqui provavelmente indica posição social, influência ou recursos, sem exigir que a tradução a identifique apenas como rica.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: insistiu com ele
  rationale: O verbo tem força maior que um simples convite e, neste contexto, descreve a insistência hospitaleira da mulher.
- source_word: לֶאֱכָל לָחֶם
  choice: para que comesse uma refeição / para comer
  rationale: Embora לֶחֶם signifique literalmente 'pão', a expressão funciona como modo comum de dizer que alguém toma uma refeição. A segunda ocorrência pode ser vertida naturalmente como 'comer' sem alterar o sentido.
- source_word: מִדֵּי עָבְרוֹ
  choice: sempre que passava por lá
  rationale: A construção hebraica expressa uma ocasião recorrente, não apenas um único deslocamento.
- source_word: יָסֻר שָׁמָּה
  choice: ele entrava
  rationale: סור indica desviar-se do caminho ou dirigir-se ao lugar; no contexto, 'entrava' comunica naturalmente que ele parava na casa dela.
