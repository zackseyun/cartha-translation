base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: pt
  text: 'E ele disse a ele: “Por favor, diga a ela: ‘Veja, você se deu a todo este trabalho por nós. O que se pode fazer por você? Há algo a dizer em seu favor ao rei ou ao comandante do exército?’” Ela respondeu: “Eu vivo no meio do meu povo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A resposta provavelmente indica que ela vivia amparada e em segurança no meio de sua comunidade e, por isso, não buscava favor especial das autoridades reais ou militares.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: você tem tido todo este cuidado conosco
  rationale: O verbo e o substantivo cognato podem denotar tremor, ansiedade ou preocupação; neste contexto de hospitalidade, a expressão idiomática descreve o grande cuidado e esforço da mulher em favor de Eliseu e Geazi.
- source_word: הִנֵּה
  choice: Veja
  rationale: Partícula que chama a atenção para o que segue; “Veja” é atual, clara e digna.
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: O que se pode fazer por você?
  rationale: Mantém implícito o agente da ação, como no hebraico, e expressa com naturalidade a oferta de retribuição.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: Há algo que possamos dizer em seu favor
  rationale: Comunica a ideia de falar ou interceder em benefício dela, sem restringir antecipadamente o tipo de pedido.
- source_word: שַׂר הַצָּבָא
  choice: comandante do exército
  rationale: Equivalente moderno e claro para o título do principal oficial militar.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: Eu vivo no meio do meu povo
  rationale: Reproduz diretamente a afirmação de pertencimento e inserção comunitária, preservando sua implicação contextual sem incorporá-la ao texto.
- source_word: נָא
  choice: Por favor
  rationale: Representa de modo natural a partícula de cortesia que suaviza o imperativo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O diálogo conserva a cortesia e a relativa formalidade do hebraico. O nome “Geazi”, explícito no contexto imediato, foi empregado para tornar natural em português o pronome masculino “a ele” do original, sem alterar o referente.
