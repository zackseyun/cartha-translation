  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: pt
  text: 'Então a mãe do menino disse: “Tão certo como vive Yahweh e como você vive, não o deixarei”. Então ele se levantou e foi atrás dela.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: a mãe do menino
  rationale: Reproduz naturalmente a construção hebraica e mantém a identificação específica da mulher.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Tão certo como vive Yahweh e como você vive
  rationale: Expressa em português atual a fórmula hebraica de juramento, na qual a vida de Yahweh e a do interlocutor garantem solenemente a declaração. נֶפֶשׁ, neste contexto, refere-se à própria pessoa viva, não a uma alma separada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: não o deixarei
  rationale: Depois da fórmula de juramento, אִם introduz uma asseveração negativa; uma tradução condicional literal seria obscura em português. O pronome masculino retoma Eliseu.
- source_word: וַיָּקָם
  choice: ele se levantou
  rationale: Traduz de modo natural o verbo קום na sequência narrativa; pelo contexto, o sujeito é Eliseu.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: foi atrás dela
  rationale: Preserva de perto a imagem hebraica e comunica que Eliseu acompanhou a mulher.
theological_decisions:
- issue: Tradução do nome divino יְהוָה na fórmula de juramento
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino. “Yahweh” o representa diretamente, sem trocá-lo pelo título “SENHOR”.
- issue: Sentido de נַפְשְׁךָ na fórmula חֵי נַפְשְׁךָ
  choice: como você vive
  alternative: como vive a sua alma
  rationale: Na fórmula de juramento, נֶפֶשׁ designa a vida ou a própria pessoa. A formulação escolhida preserva o sentido sem sugerir indevidamente uma afirmação sobre a natureza da alma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula solene “Tão certo como vive...” mantém o caráter de juramento sem soar excessivamente arcaica.
