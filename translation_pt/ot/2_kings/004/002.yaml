  text: וַ/יֹּ֨אמֶר אֵלֶ֤י/הָ אֱלִישָׁע֙ מָ֣ה אֶֽעֱשֶׂה לָּ֔/ךְ הַגִּ֣ידִי לִ֔/י מַה יֶּשׁ ל/כי בַּ/בָּ֑יִת וַ/תֹּ֗אמֶר אֵ֣ין לְ/שִׁפְחָתְ/ךָ֥ כֹל֙ בַּ/בַּ֔יִת כִּ֖י אִם אָס֥וּךְ שָֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: pt
  text: 'Então Eliseu lhe disse: “O que farei por você? Diga-me: o que você tem em casa?” Ela respondeu: “Sua serva não tem absolutamente nada em casa, a não ser um frasco de azeite[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma vasilha de azeite” ou “um pequeno frasco de azeite”; o termo hebraico אָסוּךְ refere-se a um recipiente para azeite, provavelmente pequeno.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: O que farei por você?
  rationale: Preserva a nuance deliberativa do imperfeito hebraico e expressa de modo natural a ação que Eliseu poderia realizar em favor dela.
- source_word: הַגִּידִי לִי
  choice: Diga-me
  rationale: Traduz diretamente o imperativo feminino com o sufixo de primeira pessoa, sem acrescentar uma fórmula de cortesia ausente do hebraico.
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: o que você tem em casa?
  rationale: A construção existencial com לְ indica posse e é expressa naturalmente em português com o verbo “ter”.
- source_word: לְשִׁפְחָתְךָ
  choice: Sua serva
  rationale: Mantém o gênero feminino e a forma deferente pela qual a mulher se refere a si mesma diante de Eliseu, sem recorrer a linguagem arcaica.
- source_word: אֵין ... כֹל
  choice: não tem absolutamente nada
  rationale: A combinação negativa com כֹל tem força enfática; “absolutamente nada” comunica essa intensidade em português corrente.
- source_word: כִּי אִם
  choice: a não ser
  rationale: Introduz de modo idiomático a única exceção à declaração de carência.
- source_word: אָסוּךְ שָׁמֶן
  choice: um frasco de azeite
  rationale: אָסוּךְ designa um recipiente de azeite, provavelmente pequeno; “frasco” conserva essa especificidade sem impor uso ritual, e “azeite” é a designação portuguesa natural para o óleo de oliva neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala conserva a deferência social de “sua serva”, enquanto o restante evita construções arcaicas. A pontuação com dois-pontos liga naturalmente a ordem à pergunta seguinte.
