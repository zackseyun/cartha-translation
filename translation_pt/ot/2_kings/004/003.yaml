base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/003.yaml
  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: pt
  text: 'Então ele disse: “Vá para fora e peça emprestados[a], de todos os seus vizinhos, recipientes vazios. Não peça poucos recipientes[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “peça”; o verbo hebraico pode significar simplesmente pedir, mas aqui provavelmente indica tomar emprestado dos vizinhos para uso temporário.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não faça poucos” ou “não diminua”. No contexto, a instrução é não pedir apenas uma pequena quantidade de recipientes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי
  choice: Vá
  rationale: O imperativo feminino singular envia a mulher para agir; “Vá” é natural e direto em português.
- source_word: שַׁאֲלִי
  choice: pedir emprestados
  rationale: Embora o verbo possa significar simplesmente “pedir”, o contexto indica a obtenção temporária de recipientes junto aos vizinhos.
- source_word: כֵּלִים
  choice: recipientes
  rationale: O termo hebraico é amplo e, neste contexto, designa objetos capazes de conter o azeite sem especificar indevidamente jarros ou vasos.
- source_word: לָךְ
  choice: incorporado na construção “pedir emprestados”
  rationale: O dativo de interesse indica que ela deve obtê-los para seu próprio uso; em português, isso fica natural e suficientemente expresso pelo contexto.
- source_word: מִן הַחוּץ
  choice: fora de casa
  rationale: A expressão significa literalmente “de fora”; a explicitação idiomática indica que os recipientes deveriam vir de fora da própria casa.
- source_word: מֵאֵת כָּל שכנכי
  choice: a todos os seus vizinhos
  rationale: Reproduz de modo claro o alcance coletivo da instrução.
- source_word: כֵּלִים רֵקִים
  choice: recipientes vazios
  rationale: Mantém a repetição enfática do substantivo e a exigência de que estivessem vazios.
- source_word: אַל תַּמְעִיטִי
  choice: Não peça poucos
  rationale: Conserva a formulação concisa e enfática do hebraico, cujo sentido contextual é não obter uma quantidade pequena.
