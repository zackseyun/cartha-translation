base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: pt
  text: 'Eliseu voltou para Gilgal, e havia fome na terra. Os filhos dos profetas[a] estavam sentados diante dele, e ele disse ao seu servo: “Ponha a panela grande no fogo e cozinhe um ensopado para os filhos dos profetas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os discípulos dos profetas”; a expressão se refere aos integrantes de uma comunidade ou grupo profético.
    reason: Alternativa lexical e esclarecimento de um idioma hebraico que pode não ser imediatamente compreendido em português.
lexical_decisions:
- source_word: שָׁב
  choice: voltou
  rationale: O qal perfeito de שוב indica que Eliseu retornou a um lugar onde já estivera; “voltou” é a forma mais natural e concisa em português.
- source_word: הַגִּלְגָּלָה
  choice: para Gilgal
  rationale: O ה direcional indica movimento em direção ao lugar; “para Gilgal” expressa isso naturalmente.
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: e havia fome naquela terra
  rationale: A oração nominal fornece a circunstância de fundo. “Havia fome” é idiomático em português, e “naquela terra” se refere naturalmente à região do relato.
- source_word: בְנֵי הַנְּבִיאִים
  choice: os filhos dos profetas
  rationale: Preserva o idioma familiar hebraico, que designa os integrantes de uma comunidade ou grupo profético; a nota esclarece o sentido possível.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: estavam sentados diante dele
  rationale: O particípio descreve uma situação em curso, provavelmente discípulos reunidos na presença de Eliseu; “diante dele” mantém essa nuance relacional.
- source_word: לְנַעֲרוֹ
  choice: ao seu servo
  rationale: נַעַר pode significar jovem, ajudante ou servo. A tarefa doméstica recebida aqui favorece “servo”.
- source_word: שְׁפֹת הַסִּיר הַגְּדוֹלָה
  choice: Ponha a panela grande no fogo
  rationale: Neste contexto, שפת significa colocar a panela para cozinhar, isto é, sobre o fogo. A explicitação produz português claro sem alterar a ação.
- source_word: וּבַשֵּׁל נָזִיד
  choice: e cozinhe um ensopado
  rationale: בשל abrange cozinhar ou ferver, e נָזִיד é comida cozida, especialmente ensopado. A combinação escolhida é natural e mantém o sentido culinário.
theological_decisions:
- issue: Sentido do idioma בְנֵי הַנְּבִיאִים
  choice: os filhos dos profetas
  alternative: os discípulos dos profetas
  rationale: O texto principal conserva a expressão hebraica sem transformá-la diretamente em uma designação institucional. A nota oferece o sentido funcional provável, sem impor uma estrutura específica ao grupo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem narrativa e a descrição da cena foram preservadas, evitando arcaísmos como “puseram-se perante ele” ou termos culinários pouco correntes.
