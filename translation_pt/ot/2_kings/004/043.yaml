base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: pt
  text: 'Mas o seu servo disse[a]: “Como vou pôr isto diante de cem homens?” Eliseu respondeu: “Dê isto ao povo, e que eles comam[b], pois assim diz Yahweh: ‘Eles comerão, e ainda sobrará.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como posso dar isto a cem homens?” O hebraico diz literalmente: “Que darei isto diante de cem homens?”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “comam e deixem sobrar”, expressão que indica que restará alimento depois que tiverem comido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: seu servo
  rationale: O termo designa alguém que serve em função pessoal ou oficial. “Servo” é natural no contexto narrativo e expressa a posição subordinada em relação a Eliseu.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: Como vou pôr isto diante de cem homens?
  rationale: A formulação preserva a imagem concreta de colocar a comida diante deles e transmite naturalmente a incredulidade expressa pela construção hebraica.
- source_word: אִישׁ
  choice: homens
  rationale: O substantivo masculino singular é usado distributivamente após “cem”; “homens” corresponde à forma e ao provável referente do hebraico.
- source_word: תֵּן לָעָם
  choice: Dê isto ao povo
  rationale: עָם designa coletivamente o grupo reunido. “Povo” mantém a mudança do hebraico de אִישׁ para um substantivo coletivo.
- source_word: וְיֹאכֵלוּ
  choice: para que coma
  rationale: Depois do imperativo, o verbo indica o propósito ou resultado desejado. A concordância no singular trata “povo” como substantivo coletivo e soa natural em português.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: pois assim diz Yahweh
  rationale: Conserva a fórmula profética reconhecível e verte diretamente o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אָכֹל וְהוֹתֵר
  choice: Eles comerão, e ainda sobrará
  rationale: A construção assegura o resultado prometido. A tradução natural explicita o sujeito e indica que restará alimento depois de todos comerem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Certeza da promessa em אָכֹל וְהוֹתֵר
  choice: Eles comerão, e ainda sobrará
  alternative: Comerão e deixarão sobras
  rationale: A tradução comunica a certeza profética do resultado sem acrescentar uma explicação teológica nem sugerir que os comensais deliberadamente deixarão comida.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. “Como vou pôr” evita arcaísmo sem perder a imagem do original; “assim diz Yahweh” conserva o tom da fórmula profética. O nome “Eliseu” explicita o referente do segundo verbo de fala para evitar ambiguidade narrativa em português.
