  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: pt
  text: 'E ele disse ao pai: “Minha cabeça! Minha cabeça!” Então o pai disse ao jovem[a]: “Carregue-o até a mãe dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”. A palavra hebraica pode designar um menino, um jovem, um assistente ou um servo, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: E ele disse ao pai
  rationale: Mantém o verbo comum אמר sem acrescentar a ideia de gritar; o contexto e a exclamação expressam a aflição. Em português, o possessivo é dispensável porque a relação é clara no contexto.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: Minha cabeça! Minha cabeça!
  rationale: Preserva a repetição breve e enfática do hebraico sem explicitar interpretativamente “está doendo”.
- source_word: וַיֹּאמֶר
  choice: Então o pai disse
  rationale: “Então” representa a progressão narrativa do wayyiqtol. A repetição de “o pai” torna explícito o sujeito inferido pelo contexto e evita atribuir a ordem ao menino.
- source_word: אֶל הַנַּעַר
  choice: ao jovem
  rationale: נַעַר pode designar menino, jovem, ajudante ou servo. “Jovem” preserva a referência etária sem impor no texto principal uma condição servil.
- source_word: שָׂאֵהוּ
  choice: Leve-o
  rationale: Neste contexto, נשׂא implica tomar e transportar a criança. “Leve-o” é natural em português e inclui a ação física exigida pela situação.
- source_word: אֶל אִמּוֹ
  choice: para a mãe dele
  rationale: Expressa com clareza o destino e a relação materna, evitando a possível leitura de que se trata da mãe do jovem.
