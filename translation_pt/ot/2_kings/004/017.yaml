base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/017.yaml
  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: pt
  text: Assim, a mulher ficou grávida e deu à luz um filho no tempo determinado[a], por volta dessa mesma época no ano seguinte, conforme Eliseu lhe havia dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “neste tempo determinado, no tempo da vida”; expressão que significa aproximadamente a mesma época no ano seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: ficou grávida
  rationale: O qal de הרה indica que a mulher engravidou; a expressão é clara e natural no português atual.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”; aqui retoma a mulher sunamita já identificada no relato.
- source_word: וַתֵּלֶד בֵּן
  choice: deu à luz um filho
  rationale: É a forma corrente e digna de expressar o idiomatismo hebraico de nascimento.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: no tempo determinado
  rationale: מוֹעֵד designa um tempo fixado ou marcado; “determinado” preserva essa ideia sem soar artificial.
- source_word: כָּעֵת חַיָּה
  choice: por volta dessa mesma época no ano seguinte
  rationale: O idiomatismo aponta para a mesma estação ou época do ano seguinte; a formulação comunica o sentido temporal e preserva a aproximação de כָּ.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ
  choice: conforme Eliseu lhe havia dito
  rationale: A oração relativa assinala o cumprimento da palavra anterior de Eliseu; o mais-que-perfeito situa corretamente essa fala antes do nascimento.
- source_word: אֱלִישָׁע
  choice: Eliseu
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
