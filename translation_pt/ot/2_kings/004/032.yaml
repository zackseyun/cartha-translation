base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/032.yaml
  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: pt
  text: Quando Eliseu entrou na casa, eis que o menino estava morto, deitado sobre sua cama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo sido colocado sobre sua cama”. O particípio hebraico pode destacar mais explicitamente o estado resultante de alguém ter deitado ou estendido o menino ali. O pronome “sua” também pode referir-se à cama de Eliseu, conforme o contexto do versículo 21.'
    reason: lexical_alternative_and_referential_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא ... הַבָּיְתָה
  choice: entrou na casa
  rationale: O verbo בוא, junto do ה direcional em הַבָּיְתָה, expressa movimento para dentro da casa. “Entrou na casa” é natural em português e preserva essa direção.
- source_word: אֱלִישָׁע
  choice: Eliseu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva a função apresentativa de הִנֵּה, chamando a atenção para a cena que Eliseu encontra, sem recorrer a uma paráfrase interpretativa como “viu que”.
- source_word: הַנַּעַר
  choice: o menino
  rationale: Neste contexto, נַעַר designa o filho da sunamita; “menino” é claro, natural e mais específico que “jovem”.
- source_word: מֵת
  choice: estava morto
  rationale: A forma descreve o estado em que o menino se encontrava, não simplesmente o acontecimento anterior de sua morte.
- source_word: מֻשְׁכָּב
  choice: deitado
  rationale: O particípio passivo de שׁכב apresenta o menino no estado resultante de ter sido posto ou estendido na cama. “Deitado” é idiomático em português, enquanto a nota registra a nuance passiva mais explícita.
- source_word: עַל מִטָּתוֹ
  choice: sobre sua cama
  rationale: Tradução direta e natural. O possessivo hebraico masculino singular não explicita no próprio sintagma se a cama é atribuída ao menino ou a Eliseu; “sua” preserva essa ambiguidade formal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Eis que” mantém a vivacidade narrativa do hebraico; “sobre sua cama” conserva a ambiguidade do possessivo em vez de fixar silenciosamente seu referente.
