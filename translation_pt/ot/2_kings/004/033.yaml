  text: וַ/יָּבֹ֕א וַ/יִּסְגֹּ֥ר הַ/דֶּ֖לֶת בְּעַ֣ד שְׁנֵי/הֶ֑ם וַ/יִּתְפַּלֵּ֖ל אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/033.yaml
  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: pt
  text: Ele entrou, fechou a porta atrás dos dois[a] e orou a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fechou a porta sobre os dois”, isto é, deixou a si mesmo e o menino dentro do aposento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ele entrou
  rationale: O verbo בוא, na sequência narrativa, indica que Eliseu entrou no aposento. “Entrou” é direto, natural e não exige explicitar novamente o local já conhecido pelo contexto.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: fechou a porta
  rationale: סגר com דלת descreve concretamente o ato de fechar a porta; esta é a formulação corrente e clara em português.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: atrás dos dois
  rationale: Com o verbo “fechar”, בְּעַד pode indicar que a porta foi fechada atrás de alguém, deixando essa pessoa no interior. “Dos dois” preserva a referência hebraica a Eliseu e ao menino sem acrescentar “sozinhos” ao texto principal.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: e orou a Yahweh
  rationale: O hitpael de פלל significa “orar”, e אֶל marca o destinatário da oração. O nome divino יהוה é transliterado como “Yahweh”, preservando sua ocorrência explícita no hebraico.
theological_decisions:
- issue: Forma de verter o nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” conserva o caráter de nome próprio, em vez de substituí-lo por um título.
- issue: Agente e caráter da restauração do menino
  choice: manter apenas a afirmação de que Eliseu orou a Yahweh
  alternative: explicitar que Eliseu pediu a Yahweh que ressuscitasse o menino
  rationale: O versículo relata a oração, mas não registra seu conteúdo. A tradução não deve antecipar nem formular aquilo que o hebraico deixa implícito no contexto.
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa fluida. A expressão “atrás dos dois” mantém de perto a construção hebraica; a nota esclarece seu sentido espacial sem sobrecarregar o texto principal.
