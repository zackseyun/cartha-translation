  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לַ/מּוֹעֵ֤ד הַ/זֶּה֙ כָּ/עֵ֣ת חַיָּ֔ה אתי חֹבֶ֣קֶת בֵּ֑ן וַ/תֹּ֗אמֶר אַל אֲדֹנִ/י֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אַל תְּכַזֵּ֖ב בְּ/שִׁפְחָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: pt
  text: 'Então ele disse: “Por esta época, no ano que vem,[a] você estará abraçando um filho.” Mas ela respondeu: “Não, meu senhor, homem de Deus! Não engane a sua serva.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “por este tempo de vida”; isto é, por esta mesma época no ano seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: Por esta época
  rationale: Expressa o período correspondente e, em conjunto com a expressão seguinte, soa natural em português sem perder a referência temporal definida.
- source_word: כָּעֵת חַיָּה
  choice: no ano que vem
  rationale: Neste contexto, o idioma hebraico aponta para a mesma época do ano seguinte. A tradução comunica o sentido corrente, enquanto a nota registra a forma mais literal e sua ambiguidade.
- source_word: אתי
  choice: você
  rationale: O pronome independente dá ênfase à destinatária; o pronome explícito em português a representa de modo natural.
- source_word: חֹבֶקֶת
  choice: estará abraçando
  rationale: Preserva a imagem concreta de ter o filho nos braços e reproduz adequadamente o particípio hebraico.
- source_word: בֵּן
  choice: um filho
  rationale: Mantém a referência específica a um filho do sexo masculino.
- source_word: אַל
  choice: Não
  rationale: A primeira ocorrência funciona como reação emocional negativa, não como simples ordem proibitiva.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Conserva o tratamento humano respeitoso dirigido a Eliseu, sem atribuir-lhe natureza divina.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: É a forma portuguesa estabelecida e semanticamente fiel para o título profético hebraico.
- source_word: תְּכַזֵּב
  choice: Não engane
  rationale: Abrange a ideia de mentir ou alimentar uma esperança que venha a se mostrar falsa, preservando a força emocional do pedido.
- source_word: בְּשִׁפְחָתֶךָ
  choice: a sua serva
  rationale: Mantém tanto o gênero feminino quanto a autodesignação humilde da mulher, em linguagem portuguesa natural.
theological_decisions:
- issue: Sentido do tratamento humano אֲדֹנִי
  choice: meu senhor
  alternative: meu mestre; senhor
  rationale: O título é dirigido a Eliseu como tratamento respeitoso. A tradução preserva essa deferência sem sugerir que ele seja divino.
- issue: Interpretação temporal de כָּעֵת חַיָּה
  choice: no ano que vem
  alternative: quando chegar esta mesma época; por este tempo de vida
  rationale: O contexto de anúncio de nascimento favorece a referência à mesma época no ano seguinte, mas a nota conserva a formulação literal incomum e evita ocultar a expressão hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Estará abraçando” preserva a vivacidade da imagem hebraica; “sua serva” mantém o feminino e a deferência. A nota explicita o idioma temporal sem sobrecarregar o texto principal.
