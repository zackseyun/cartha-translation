base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: pt
  text: 'Assim, ela foi e chegou ao homem de Deus, no monte Carmelo. Quando o homem de Deus a viu de longe[a], disse a Geazi, seu servo: “Olhe, aquela sunamita!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à distância”. A expressão hebraica indica que ele a viu enquanto ela ainda estava a certa distância.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: Assim, ela foi e chegou
  rationale: Os dois wayyiqtol fazem a narrativa avançar em sequência. A formulação conserva ambos os movimentos sem ficar excessivamente literal.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém diretamente o título hebraico tradicional, sem substituí-lo pela interpretação “profeta”.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: no monte Carmelo
  rationale: Depois de “chegou até o homem de Deus”, a expressão localiza o homem no monte Carmelo e evita a repetição pouco natural de “até”.
- source_word: וַיְהִי כִּרְאוֹת
  choice: Quando ... viu
  rationale: A construção introduz uma oração temporal; a tradução comunica isso naturalmente sem reproduzir o hebraísmo “e aconteceu que”.
- source_word: מִנֶּגֶד
  choice: de longe
  rationale: No contexto, indica que ele a avistou enquanto ela ainda estava a certa distância; a expressão portuguesa é concisa e natural.
- source_word: נַעֲרוֹ
  choice: seu servo
  rationale: Embora o substantivo possa significar literalmente “seu jovem”, aqui designa Geazi em sua função de assistente ou servo de Eliseu.
- source_word: הִנֵּה
  choice: Olhe!
  rationale: A interjeição chama de imediato a atenção de Geazi para a mulher que se aproxima.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: É aquela sunamita
  rationale: “Sunamita” preserva a designação geográfica, e “aquela” conserva a força dêitica de הַלָּז, apontando para alguém a certa distância. O verbo “é” torna a identificação idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o título “homem de Deus” e a designação “sunamita”, evitando tanto arcaísmos quanto explicações inseridas no corpo do versículo.
