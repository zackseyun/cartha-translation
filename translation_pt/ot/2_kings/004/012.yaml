base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: pt
  text: 'Então Eliseu disse a Geazi, seu servo: “Chame esta sunamita.” Ele a chamou, e ela se pôs de pé diante dele.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então Eliseu disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa naturalmente a sequência em português. O sujeito “Eliseu”, implícito no hebraico e claro pelo contexto, é explicitado para evitar ambiguidade entre Eliseu e Geazi.
- source_word: גֵּחֲזִי
  choice: Geazi
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: נַעֲרוֹ
  choice: seu servo
  rationale: נַעַר pode designar jovem, auxiliar ou servo. Neste contexto, descreve a função de Geazi junto a Eliseu; “servo” é claro, corrente e adequado.
- source_word: קְרָא
  choice: Chame
  rationale: O imperativo de קרא pede que Geazi faça a mulher vir à presença de Eliseu. “Chame” preserva o verbo simples e não introduz a força mais formal de “convoque”.
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: esta sunamita
  rationale: O hebraico identifica a mulher por sua origem em Suném. Em português, “sunamita” funciona naturalmente como substantivo feminino, sem necessidade de acrescentar “mulher”.
- source_word: וַיִּקְרָא לָהּ
  choice: Ele a chamou
  rationale: Mantém a repetição de קרא e comunica de modo natural que Geazi cumpriu a ordem.
- source_word: וַתַּעֲמֹד
  choice: e ela ficou em pé
  rationale: עמד significa estar ou pôr-se em pé. “Ficou em pé” preserva a postura indicada sem acrescentar um movimento de aproximação que não está expresso.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Expressa de maneira concisa tanto a posição espacial como a presença pessoal indicada por לִפְנֵי.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. O nome de Eliseu foi explicitado no início para distinguir claramente o falante de Geazi; não há necessidade de nota, pois isso apenas torna explícito o referente contextual do pronome verbal hebraico.
