base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: pt
  text: 'Então serviram o ensopado aos homens para que comessem. Mas, enquanto comiam do ensopado, gritaram e disseram: “Há morte na panela, homem de Deus!” E não conseguiram comer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: serviram
  rationale: Embora o verbo denote literalmente derramar, no contexto da distribuição de um ensopado, “serviram” expressa de modo natural em português a ação concreta sem sugerir que a comida foi simplesmente despejada.
- source_word: לַאֲנָשִׁים
  choice: aos homens
  rationale: Mantém a referência masculina explícita do hebraico e se ajusta ao grupo reunido no contexto.
- source_word: לֶאֱכֹל
  choice: para que comessem
  rationale: Expressa com clareza o infinitivo de finalidade e concorda naturalmente com a oração principal no passado.
- source_word: כְּאָכְלָם מֵהַנָּזִיד
  choice: enquanto comiam do ensopado
  rationale: Preserva a simultaneidade da construção hebraica; “ensopado” é um equivalente moderno e claro para נָזִיד.
- source_word: צָעָקוּ
  choice: gritaram
  rationale: Comunica a reação alta, urgente e alarmada indicada pelo verbo.
- source_word: מָוֶת בַּסִּיר
  choice: Há morte na panela
  rationale: Preserva a imagem vívida e a formulação concisa do hebraico, sem reduzir interpretativamente “morte” a “veneno”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: É o título convencional de Eliseu e funciona naturalmente como vocativo sem partícula adicional.
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: E não conseguiram comer
  rationale: Segue de perto o hebraico, que não explicita objeto, e permanece idiomático em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A expressão figurada “Há morte na panela” foi mantida no texto, pois seu sentido de alimento mortal ou venenoso é suficientemente perceptível pelo contexto e não exige nota.
