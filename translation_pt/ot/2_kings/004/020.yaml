  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: pt
  text: Ele o carregou e o levou à sua mãe. O menino sentou-se no colo dela[a] até o meio-dia; então morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre os joelhos dela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: o carregou
  rationale: נשׂא pode significar levantar, carregar ou levar; no contexto, descreve o transporte do menino até a mãe.
- source_word: וַיְבִיאֵהוּ
  choice: o levou
  rationale: O hifil de בוא indica fazer chegar ou trazer. Em português, “levou à sua mãe” expressa naturalmente o movimento em direção a ela.
- source_word: אֶל אִמּוֹ
  choice: à sua mãe
  rationale: Tradução direta e adequada ao registro narrativo.
- source_word: וַיֵּשֶׁב
  choice: ficou
  rationale: Embora ישׁב possa significar literalmente “sentar-se”, aqui “ficou” comunica com naturalidade que o menino permaneceu no colo da mãe.
- source_word: עַל בִּרְכֶּיהָ
  choice: no colo dela
  rationale: O hebraico diz literalmente “sobre os joelhos dela”; “no colo dela” é o equivalente idiomático natural em português, com a forma literal registrada em nota.
- source_word: עַד הַצָּהֳרַיִם
  choice: até o meio-dia
  rationale: צהריים designa o meio do dia; “meio-dia” é claro e corrente em português.
- source_word: וַיָּמֹת
  choice: então morreu
  rationale: “Então” representa de modo idiomático o avanço da sequência narrativa marcado pelo waw consecutivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “O menino” explicita o sujeito já presente no contexto, evitando a possível ambiguidade de “ele” entre o servo e a criança.
