base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/021.yaml
  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: pt
  text: Então ela subiu, deitou o menino na cama do homem de Deus, fechou a porta, deixando-o dentro do quarto, e saiu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַל
  choice: Então ela subiu
  rationale: Preserva o movimento expresso por עלה, provavelmente para o quarto no andar de cima, enquanto “Então” comunica com naturalidade a sequência narrativa do waw consecutivo.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: deitou o menino
  rationale: A forma causativa de שׁכב significa fazer alguém deitar-se. O objeto pronominal masculino é explicitado como “o menino” para clareza natural em português, conforme o contexto imediato.
- source_word: עַל מִטַּת
  choice: na cama
  rationale: Em português, “deitar alguém na cama” é a formulação idiomática correspondente ao hebraico literal “sobre a cama”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Mantém diretamente o título hebraico, sem restringi-lo interpretativamente a “profeta”.
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: fechou a porta, deixando-o lá dentro
  rationale: סגר significa fechar, e בְּעַד com o sufixo masculino indica que ela fechou o acesso com o menino no interior. “Porta” é um complemento implícito exigido pelo contexto e pela expressão em português.
- source_word: וַתֵּצֵא
  choice: e saiu
  rationale: Tradução direta e natural de יצא, preservando o movimento concreto sem especificar um destino não declarado.
