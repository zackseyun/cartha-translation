base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/028.yaml
  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
translation:
  language: pt
  text: 'Ela disse: “Por acaso pedi ao meu senhor um filho? Eu não disse: ‘Não me engane[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não me iluda” ou “Não me dê falsas esperanças”. O verbo hebraico pode indicar levar alguém ao engano, aqui possivelmente no sentido de despertar uma esperança que acabaria frustrada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ela disse
  rationale: O waw consecutivo introduz a fala na sequência narrativa; em português natural, a conjunção pode ser omitida sem perda de sentido.
- source_word: הֲשָׁאַלְתִּי
  choice: Por acaso pedi
  rationale: A partícula interrogativa introduz uma pergunta retórica. “Por acaso” torna essa força clara e natural em português.
- source_word: בֵן
  choice: um filho
  rationale: O substantivo hebraico designa especificamente um filho do sexo masculino, não apenas uma criança.
- source_word: מֵאֵת אֲדֹנִי
  choice: ao meu senhor
  rationale: Com o verbo “pedir”, o português idiomático usa “pedir algo a alguém”. “Meu senhor” é aqui uma forma respeitosa de dirigir-se a Eliseu, não um título divino.
- source_word: הֲלֹא אָמַרְתִּי
  choice: Eu não disse
  rationale: Preserva a segunda pergunta retórica e a proximidade lexical com אמר, sem acrescentar explicitamente o destinatário.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: Não me dê falsas esperanças
  rationale: O hifil de שלה pode indicar enganar ou induzir a uma expectativa ilusória. No contexto da promessa do filho e de sua morte, esta formulação comunica naturalmente o sentido sem afirmar necessariamente fraude deliberada.
