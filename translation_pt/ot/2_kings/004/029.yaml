base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: pt
  text: 'Então ele disse a Geazi: “Prenda a roupa à cintura[a], pegue o meu cajado e vá. Se encontrar alguém, não o cumprimente; e, se alguém cumprimentar você, não responda[b]. Coloque o meu cajado sobre o rosto do menino.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “cinja os seus lombos”, expressão que indica preparar-se rapidamente para agir.
    reason: lexical_alternative
  - marker: b
    text: Ou “não o abençoe; e, se alguém abençoar você, não lhe responda”. Neste contexto, o verbo provavelmente se refere à troca de cumprimentos no caminho.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Prenda a roupa à cintura
  rationale: A expressão significa literalmente “cingir os lombos” e descreve prender a veste para preparar-se para agir ou viajar depressa. A formulação comunica a ação e a urgência em português atual.
- source_word: מִשְׁעַנְתִּי
  choice: o meu cajado
  rationale: O substantivo designa um bastão usado como apoio. “Cajado” é natural neste contexto narrativo e preserva sua função como objeto pertencente ao profeta.
- source_word: וָלֵךְ
  choice: e vá
  rationale: Imperativo simples de movimento, mantido de forma direta para preservar a sequência rápida das ordens.
- source_word: כִּי תִמְצָא אִישׁ
  choice: Se encontrar alguém
  rationale: Embora אִישׁ signifique formalmente “homem”, aqui tem sentido genérico, referindo-se a qualquer pessoa encontrada no caminho.
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: não o cumprimente / se alguém cumprimentar você
  rationale: Neste contexto de encontro no caminho, ברך provavelmente se refere à troca de saudações, não a uma bênção formal. A repetição do mesmo verbo é preservada.
- source_word: לֹא תַעֲנֶנּוּ
  choice: não responda
  rationale: ענה significa aqui responder ou dar resposta. A forma concisa mantém a urgência da instrução.
- source_word: וְשַׂמְתָּ מִשְׁעַנְתִּי עַל פְּנֵי הַנָּעַר
  choice: Coloque o meu cajado sobre o rosto do menino
  rationale: A tradução conserva literalmente a ação de colocar o cajado sobre o rosto, sem explicar ou antecipar seu efeito.
- source_word: הַנָּעַר
  choice: o menino
  rationale: נַעַר pode designar menino, jovem ou servo; neste contexto, refere-se ao filho da sunamita, de modo que “menino” é claro e apropriado.
