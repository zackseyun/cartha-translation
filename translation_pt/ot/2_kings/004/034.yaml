  text: וַ/יַּ֜עַל וַ/יִּשְׁכַּ֣ב עַל הַ/יֶּ֗לֶד וַ/יָּשֶׂם֩ פִּ֨י/ו עַל פִּ֜י/ו וְ/עֵינָ֤י/ו עַל עֵינָי/ו֙ וְ/כַפָּ֣י/ו עַל כפ/ו וַ/יִּגְהַ֖ר עָלָ֑י/ו וַ/יָּ֖חָם בְּשַׂ֥ר הַ/יָּֽלֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: pt
  text: Então ele subiu, deitou-se sobre o menino e pôs a boca sobre a boca dele, os olhos sobre os olhos dele e as palmas das mãos sobre as palmas dele. Depois, curvou-se sobre ele[a], e o corpo do menino ficou aquecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estendeu-se sobre ele”. O verbo hebraico é raro e pode indicar que ele se curvou ou se estendeu sobre o menino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Então ele subiu
  rationale: Mantém o sentido direto de עלה, sem explicitar o aposento superior, que está apenas implícito no contexto.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: deitou-se sobre o menino
  rationale: Expressa de modo natural e concreto a ação física indicada por שׁכב עַל.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: pôs a boca sobre a boca dele
  rationale: Preserva a concretude de שׂים e פֶּה, usando “dele” para evitar ambiguidade excessiva em português.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: os olhos sobre os olhos dele
  rationale: Conserva o paralelismo corporal do hebraico e depende naturalmente do verbo “pôs”.
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: as palmas das mãos sobre as palmas dele
  rationale: כַּף designa especificamente a palma da mão; a formulação é clara no português corrente.
- source_word: וַיִּגְהַר עָלָיו
  choice: curvou-se sobre ele
  rationale: O verbo raro גהר descreve inclinar-se ou estender-se por cima de alguém. “Curvou-se” preserva a postura sem afirmar mais do que o hebraico.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: o corpo do menino ficou aquecido
  rationale: בָּשָׂר é literalmente “carne”, mas neste contexto “corpo” comunica com naturalidade a referência corporal; חם indica que se tornou quente ou aquecido.
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: o menino
  rationale: יֶלֶד pode significar criança ou menino; o contexto identifica a criança como filho, favorecendo “menino”.
theological_decisions:
- issue: Natureza da ação de Eliseu sobre o menino morto
  choice: Descrever concretamente os movimentos corporais sem explicar seu mecanismo.
  alternative: Caracterizar o ato como ressuscitação boca a boca ou empregar linguagem eufemística.
  rationale: O texto relata uma ação profética associada à restauração do menino, mas não a define em termos médicos, rituais ou sacramentais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição anatômica do hebraico foi mantida, mas pronomes foram ajustados para clareza. O marcador [a] aparece no texto principal junto ao verbo raro a que se refere.
