  text: וַ/יֹּ֖אמֶר קְרָא לָ֑/הּ וַ/יִּקְרָא לָ֔/הּ וַֽ/תַּעֲמֹ֖ד בַּ/פָּֽתַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/015.yaml
  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: pt
  text: 'Então ele disse: “Chame-a.” Geazi a chamou, e ela ficou de pé à entrada[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na porta” ou “no vão da porta”. O termo hebraico pode referir-se à porta ou à área de entrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele disse
  rationale: O wayyiqtol de אמר dá sequência à narrativa; “Então ele disse” expressa essa progressão de modo natural em português.
- source_word: קְרָא לָהּ
  choice: Chame-a
  rationale: O imperativo masculino singular de קרא, com o pronome לָהּ, dirige a Geazi a ordem simples de chamar a mulher.
- source_word: וַיִּקְרָא לָהּ
  choice: Geazi a chamou
  rationale: O sujeito está implícito em hebraico e é Geazi pelo contexto imediato. Explicitá-lo evita em português a possível leitura de que Eliseu executou a ordem, sem acrescentar uma identificação alheia ao contexto.
- source_word: וַתַּעֲמֹד
  choice: e ela ficou
  rationale: עמד significa estar ou pôr-se de pé, tomar posição. “Ficou” comunica naturalmente que ela se posicionou ali, sem acrescentar o movimento “veio”, ausente do texto.
- source_word: בַּפָּתַח
  choice: à entrada
  rationale: פתח designa a abertura, porta ou entrada. “À entrada” preserva a localização sem especificar indevidamente se ela estava dentro do vão da porta ou junto dele.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com fluidez narrativa. A referência explícita a Geazi esclarece o sujeito recuperável do contexto. Não se acrescentou “veio”. A ambiguidade espacial de בַּפָּתַח foi mantida pela expressão ampla “à entrada”.
