  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: pt
  text: 'Então ela selou a jumenta e disse ao seu servo: “Conduza-a e siga em frente. Não diminua o ritmo por minha causa, a menos que eu lhe diga.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz aproximadamente: “não detenha/retenha para mim o montar”. O sentido é que ele não deveria diminuir o ritmo nem parar por causa dela enquanto ela estivesse montada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: ela selou a jumenta
  rationale: Neste contexto, חבש significa preparar o animal para ser montado, isto é, selá-lo. אָתוֹן designa especificamente uma jumenta, distinção que pode ser preservada naturalmente em português.
- source_word: נַעֲרָהּ
  choice: seu servo
  rationale: נַעַר pode designar um jovem do sexo masculino que serve ou acompanha alguém. “Servo” comunica aqui sua função no relato sem exigir a explicitação da idade.
- source_word: נְהַג וָלֵךְ
  choice: Toque a jumenta e siga em frente
  rationale: נהג expressa conduzir ou fazer o animal avançar, e הלך reforça a continuação do movimento. “Tocar” um animal é uma formulação portuguesa natural para fazê-lo seguir.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: Não diminua o ritmo por minha causa
  rationale: עצר pode significar deter, reter ou impedir. Com לִי e לִרְכֹּב, a ordem é para não refrear ou interromper o avanço enquanto ela cavalga; a formulação escolhida transmite esse sentido com naturalidade.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: a menos que eu lhe diga
  rationale: Depois de uma proibição, כִּי אִם introduz uma exceção. “A menos que” preserva de modo idiomático a condição expressa no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Jumenta” preserva o sexo do animal indicado no hebraico; “toque” emprega o uso corrente do verbo para conduzir um animal adiante.
