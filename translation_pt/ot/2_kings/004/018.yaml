  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: pt
  text: O menino[a] cresceu. Certo dia[b], saiu até seu pai, que estava com os ceifeiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a criança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e foi o dia”; expressão que introduz uma ocasião específica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: cresceu
  rationale: O verbo גדל descreve aqui o crescimento físico do menino. “Cresceu” preserva a simplicidade do hebraico sem acrescentar que ele já teria chegado à idade adulta.
- source_word: הַיָּלֶד
  choice: o menino
  rationale: יֶלֶד pode designar tanto uma criança quanto um menino. O contexto identifica uma pessoa do sexo masculino e mostra que ele já podia sair até o campo; “menino” é natural em português, enquanto a alternativa mais neutra é registrada em nota.
- source_word: וַיְהִי הַיּוֹם
  choice: certo dia
  rationale: A expressão hebraica introduz uma ocasião específica na narrativa. “Certo dia” comunica esse valor idiomático em português atual e fluente.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: יצא indica sair, provavelmente de casa ou da localidade em direção ao campo. “Saiu” mantém essa nuance direcional.
- source_word: אֶל אָבִיו
  choice: para ir até seu pai
  rationale: A preposição אֶל indica movimento em direção ao pai. A formulação portuguesa liga naturalmente esse destino ao verbo “saiu”.
- source_word: אֶל הַקֹּצְרִים
  choice: que estava com os ceifeiros
  rationale: A repetição de אֶל associa o pai aos que ceifavam. Em português, a oração relativa expressa naturalmente que o menino foi até o pai no lugar onde estavam os ceifeiros.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ceifeiros” preserva com concisão o cenário agrícola e permanece compreensível no registro bíblico. A divisão em duas frases evita uma sequência excessiva de coordenações sem perder o andamento narrativo.
