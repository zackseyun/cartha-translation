base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: pt
  text: 'Então ela chamou o marido e disse: “Por favor, mande-me um dos rapazes e uma das jumentas[b], para eu correr[a] até o homem de Deus e voltar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para eu me apressar”. O verbo hebraico significa literalmente “correr” e expressa urgência.'
    reason: lexical_alternative
  - marker: b
    text: O substantivo hebraico designa especificamente jumentas; algumas traduções empregam apenas o termo genérico “jumento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: Então ela chamou o marido
  rationale: A forma narrativa faz a ação avançar; “então” expressa naturalmente a sequência. Neste contexto doméstico, אִישָׁהּ significa “marido”.
- source_word: שִׁלְחָה נָא לִי
  choice: Por favor, mande-me
  rationale: O imperativo acompanhado de נָא formula um pedido cortês. A construção portuguesa mantém tanto o pedido direto quanto a delicadeza do tom.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: um dos rapazes
  rationale: נַעַר pode indicar jovem, ajudante ou servo. “Rapazes” preserva o sentido etário sem impor uma condição servil que o texto não explicita.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: e uma das jumentas
  rationale: אָתוֹן designa especificamente a fêmea do jumento; “jumentas” conserva essa precisão lexical.
- source_word: וְאָרוּצָה
  choice: para eu correr
  rationale: O coortativo de primeira pessoa expressa a ação pretendida em consequência do pedido. “Correr” mantém a imagem concreta e o senso de urgência do verbo hebraico.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: até o homem de Deus
  rationale: Em contexto de movimento, עַד indica o destino. “Homem de Deus” preserva o título hebraico tradicional, em vez de substituí-lo por “profeta”.
- source_word: וְאָשׁוּבָה
  choice: e voltar
  rationale: O segundo coortativo continua a expressão da intenção da mulher. O infinitivo coordenado é natural em português depois de “para eu” e conserva a concisão.
theological_decisions: []
