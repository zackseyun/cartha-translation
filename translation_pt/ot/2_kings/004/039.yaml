base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: pt
  text: Um deles saiu ao campo para colher verduras[a]. Encontrou uma videira silvestre e colheu dela cabaças silvestres[b], até encher sua roupa. Depois voltou e as cortou na panela do ensopado, pois não sabiam o que eram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “plantas comestíveis”. O termo hebraico designa de modo amplo plantas ou verduras colhidas no campo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma videira do campo” e “cabaças do campo”. Provavelmente eram colocíntidas ou frutos semelhantes a cabaças, mas a identificação exata é incerta.
    reason: lexical_alternative
  - marker: c
    text: Ou “embora não soubessem o que eram”. A conjunção hebraica também pode ser entendida em sentido circunstancial ou contrastivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: um deles
  rationale: O numeral é substantivado e, no contexto, indica um integrante do grupo; “um deles” é natural em português e mantém essa referência.
- source_word: לְלַקֵּט אֹרֹת
  choice: para colher verduras
  rationale: אֹרֹת designa de modo amplo plantas comestíveis colhidas no campo. “Verduras” comunica isso com clareza, sem sugerir especificamente ervas aromáticas.
- source_word: גֶּפֶן שָׂדֶה
  choice: uma trepadeira silvestre
  rationale: A expressão descreve uma planta semelhante a uma videira que crescia sem cultivo. “Trepadeira” evita identificar indevidamente a planta como videira de uvas.
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: frutos silvestres
  rationale: O termo provavelmente se refere a colocíntidas ou frutos semelhantes, mas a identificação botânica não é absolutamente segura. A tradução geral evita precisão indevida; a nota registra a alternativa tradicional.
- source_word: מְלֹא בִגְדוֹ
  choice: tantos quantos couberam em sua roupa
  rationale: Reproduz naturalmente a imagem hebraica da roupa usada como recipiente e indica a quantidade colhida.
- source_word: וַיְפַלַּח
  choice: os cortou
  rationale: O verbo indica partir, fatiar ou cortar. O pronome explicita em português o objeto subentendido no hebraico.
- source_word: סִיר הַנָּזִיד
  choice: a panela do ensopado
  rationale: Expressão corrente e clara para a panela que continha o cozido.
- source_word: כִּי לֹא יָדָעוּ
  choice: pois não sabiam o que eram
  rationale: כִּי é preservado em seu sentido explicativo mais direto, e “o que eram” explicita com naturalidade o complemento implícito.
