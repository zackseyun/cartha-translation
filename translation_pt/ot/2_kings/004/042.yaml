base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: pt
  text: 'Um homem veio de Baal-Salisa e trouxe ao homem de Deus pão das primícias, vinte pães de cevada e grãos novos[a] em seu saco[b]. Então ele disse: “Dê ao povo para que comam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grãos tostados”. O termo hebraico pode indicar cereal preparado para consumo, e não apenas grãos recém-colhidos.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida por “saco” é rara e de sentido incerto; pode indicar uma bolsa, um invólucro ou, possivelmente, os grãos em sua própria casca.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: Traduz diretamente o substantivo masculino singular e mantém a apresentação indefinida do personagem.
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: de Baal-Salisa
  rationale: Translitera o topônimo em forma natural para leitores de língua portuguesa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva o título hebraico em vez de substituí-lo pela interpretação explícita “o profeta”.
- source_word: לֶחֶם בִּכּוּרִים
  choice: pão das primícias
  rationale: Mantém a relação entre o pão e as primícias sem definir além do texto sua função cultual exata.
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: vinte pães de cevada
  rationale: Expressa de modo idiomático a quantidade e o tipo de pão indicados pelo hebraico.
- source_word: כַרְמֶל
  choice: grãos novos
  rationale: No contexto das primícias, designa cereal novo ou preparado para consumo; a formulação é clara sem especificar de modo indevido o método de preparo.
- source_word: בְּצִקְלֹנוֹ
  choice: em seu saco
  rationale: Adota uma interpretação contextual plausível para o substantivo raro, preservando em nota a incerteza lexical.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: Dê ao povo para que coma
  rationale: Reproduz naturalmente o imperativo seguido da ideia de finalidade ou resultado pretendido.
theological_decisions:
- issue: Identidade do sujeito de וַיֹּאמֶר (“disse”)
  choice: Então ele disse
  alternative: Então Eliseu disse
  rationale: O hebraico não nomeia explicitamente o sujeito nesta oração. A tradução conserva essa referência formalmente ambígua, sem inserir o nome de Eliseu.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a expressão bíblica tradicional “homem de Deus”; o topônimo é transliterado como “Baal-Salisa”. Os marcadores de nota foram colocados junto aos termos a que efetivamente se referem.
