  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: pt
  text: Então ela se afastou dele e fechou a porta atrás de si e de seus filhos. Eles traziam os recipientes para ela[a], e ela derramava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente “traziam para ela”; “os recipientes” foi suprido com base no contexto dos recipientes vazios mencionados nos versículos anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: Então ela se afastou dele
  rationale: A forma narrativa faz a ação avançar, e מֵאִתּוֹ indica que ela saiu da presença de Eliseu. “Afastou-se dele” é natural em português e mantém a ideia de partida.
- source_word: וַתִּסְגֹּר הַדֶּלֶת
  choice: e fechou a porta
  rationale: סגר significa fechar; esta é a expressão corrente e concreta em português.
- source_word: בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: atrás de si e de seus filhos
  rationale: Com “fechar a porta”, בְּעַד indica que a porta foi fechada deixando-os no interior. “Atrás de si” conserva o valor reflexivo, e a coordenação evita repetir “atrás” sem perder o sentido.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: Eles traziam os recipientes para ela
  rationale: O particípio expressa ação contínua. O objeto não aparece neste sintagma hebraico, mas os recipientes vazios dos versículos anteriores são claramente retomados e foram explicitados para fluidez; a nota registra o acréscimo contextual.
- source_word: וְהִיא מיצקת
  choice: e ela ia derramando o azeite
  rationale: O particípio retrata uma ação contínua e concomitante. “Ia derramando” comunica o processo repetido; “o azeite” é recuperado do contexto imediato e torna explícito em português o objeto natural do verbo.
