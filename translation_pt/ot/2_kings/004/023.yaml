base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: pt
  text: 'Ele disse: “Por que você vai até ele hoje? Hoje não é lua nova nem sábado.” Ela respondeu: “Tudo bem.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Paz». Hebraico: «Paz»; nesta resposta breve, a expressão pode significar «Está tudo bem».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Equivalente interrogativo natural em português para uma pergunta sobre motivo.
- source_word: אתי הלכתי
  choice: você vai
  rationale: A forma textual irregular tem sentido de ação presente dirigida a uma mulher; em português, o presente expressa naturalmente o deslocamento iminente ou já iniciado.
- source_word: אֵלָיו
  choice: até ele
  rationale: Preserva o pronome do hebraico, cujo referente contextual é Eliseu, sem explicitá-lo no texto.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Equivalente temporal corrente e direto.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: Não é lua nova nem sábado
  rationale: A construção negativa coordenada é reproduzida de modo natural e apresenta o motivo da pergunta.
- source_word: חֹדֶשׁ
  choice: lua nova
  rationale: Neste contexto de calendário e culto, refere-se à ocasião da lua nova, não simplesmente ao mês.
- source_word: שַׁבָּת
  choice: sábado
  rationale: Termo bíblico reconhecido em português para o dia sagrado israelita.
- source_word: שָׁלוֹם
  choice: Está tudo bem
  rationale: Embora literalmente seja 'paz', nesta resposta breve o substantivo funciona idiomaticamente como garantia de que está tudo bem; a tradução comunica essa função no português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e legibilidade brasileira. A resposta idiomática evita o pouco natural “Paz” isolado, sem acrescentar interpretação teológica.
