translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. «Quarto no terraço» comunica o ambiente arquitetônico antigo melhor do que «quarto superior», enquanto a nota preserva a ambiguidade da expressão hebraica. A pontuação divide a proposta de construção e sua finalidade para maior clareza.
