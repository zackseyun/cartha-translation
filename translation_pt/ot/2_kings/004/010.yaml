base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: pt
  text: Por favor, vamos construir para ele um pequeno quarto no andar de cima, junto à parede[a], e colocar para ele ali uma cama, uma mesa, uma cadeira e um candelabro. Assim, sempre que ele vier até nós, poderá hospedar-se ali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um pequeno quarto superior com uma parede» ou simplesmente «um pequeno quarto no andar de cima». A expressão hebraica é compacta, e a relação exata entre o quarto e a parede é incerta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «poderá entrar ali» ou «poderá parar ali». O verbo hebraico significa literalmente desviar-se ou voltar-se para o lado e, neste contexto, refere-se a parar para se hospedar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: Por favor, vamos construir
  rationale: O coortativo na primeira pessoa do plural, acompanhado de נָא, apresenta uma proposta cortês. A formulação é natural em português e conserva tanto a volição quanto a cortesia.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: um pequeno quarto no terraço, junto à parede
  rationale: עֲלִיָּה designa um cômodo elevado ou no terraço; קִיר significa literalmente «parede», mas sua relação sintática com o cômodo é compacta e incerta. A tradução mantém o elemento concreto sem afirmar uma solução arquitetônica única.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: e colocar ali
  rationale: שִׂים significa pôr ou colocar. O beneficiário já aparece em «para ele» ligado à construção, e continua naturalmente abrangendo os móveis, evitando uma repetição pouco idiomática.
- source_word: מִטָּה
  choice: uma cama
  rationale: No contexto de hospedagem, é o equivalente moderno mais claro.
- source_word: שֻׁלְחָן
  choice: uma mesa
  rationale: Equivalente direto e corrente do termo hebraico.
- source_word: כִסֵּא
  choice: uma cadeira
  rationale: Embora o termo possa ter o sentido geral de assento, «cadeira» se ajusta à lista de móveis domésticos.
- source_word: מְנוֹרָה
  choice: um candelabro
  rationale: O termo designa um suporte para lâmpada, não simplesmente a lâmpada. «Candelabro» é a designação bíblica corrente e inteligível em português.
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: Assim, sempre que ele vier nos visitar
  rationale: A construção introduz a circunstância futura resultante. «Vier nos visitar» expressa naturalmente אֵלֵינוּ, literalmente «vier a nós», neste contexto de visitas recorrentes.
- source_word: יָסוּר שָׁמָּה
  choice: poderá se recolher ali
  rationale: סוּר significa literalmente desviar-se ou dirigir-se para outro lugar e, em contexto de viagem e hospedagem, refere-se a entrar ou parar para alojar-se. «Recolher-se ali» preserva essa ideia sem especificar indevidamente a duração.
