source:
  edition: WLC
  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as slaves.”
translation:
  language: pt
  text: 'Uma mulher dentre as esposas dos membros da comunidade dos profetas clamou a Eliseu: “Meu marido, teu servo, morreu. Tu sabes que teu servo temia Yahweh. O credor veio para levar meus dois filhos[a] para si como escravos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus dois filhos homens”. O termo hebraico não especifica por si só o sexo, embora o contexto possa sugerir filhos homens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: Uma das mulheres dos discípulos dos profetas
  rationale: Expressa naturalmente a introdução indefinida e a pertença da mulher ao grupo, enquanto verte o idiomatismo hebraico “filhos dos profetas” por “discípulos dos profetas”, isto é, membros da comunidade profética.
- source_word: צָעֲקָה
  choice: clamou
  rationale: Preserva a urgência e a aflição do apelo, em registro digno e corrente.
- source_word: עַבְדְּךָ אִישִׁי
  choice: Meu marido, teu servo
  rationale: Mantém explícitas as duas relações do falecido com a mulher e com Eliseu, em ordem natural no português.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: temia Yahweh
  rationale: Conserva a expressão bíblica de reverência e fidelidade, sem reduzir ירא a mero respeito.
- source_word: הַנֹּשֶׁה
  choice: o credor
  rationale: Termo direto e compreensível para a pessoa a quem a dívida era devida.
- source_word: בָּא לָקַחַת
  choice: veio para levar
  rationale: Representa o perfeito hebraico como uma chegada já ocorrida, cuja ameaça permanece presente.
- source_word: שְׁנֵי יְלָדַי
  choice: meus dois filhos
  rationale: É a formulação portuguesa mais natural; o termo hebraico pode designar crianças sem explicitar o sexo, ambiguidade registrada em nota.
- source_word: לוֹ לַעֲבָדִים
  choice: para si como escravos
  rationale: “Para si” preserva o valor de apropriação de לוֹ, e “como escravos” exprime a condição pretendida pelo credor.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome divino pessoal em vez de substituí-lo por um título.
- issue: Sentido de “temer Yahweh”
  choice: temia Yahweh
  alternative: reverenciava Yahweh
  rationale: A formulação mantém tanto a reverência quanto o peso pactual e ético do idioma hebraico, sem resolver a expressão em um único aspecto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Discípulos dos profetas” comunica o sentido social do idiomatismo hebraico sem sugerir descendência biológica. A ordem “Meu marido, teu servo” evita rigidez excessiva sem omitir nenhum elemento.
