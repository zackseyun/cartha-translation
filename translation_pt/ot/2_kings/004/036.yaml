  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: pt
  text: 'Então ele chamou Geazi e disse: “Chame esta mulher de Suném.” Geazi a chamou, e ela veio até ele. Então ele disse: “Pegue o seu filho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: Então ele chamou Geazi
  rationale: O wayyiqtol dá sequência à narrativa; “então” expressa essa progressão com naturalidade. O nome גֵּיחֲזִי é transliterado na forma portuguesa consagrada “Geazi”.
- source_word: קְרָא
  choice: Chame
  rationale: O imperativo de קרא significa chamar ou convocar. “Chame” é direto, natural e preserva a repetição do verbo no versículo.
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: esta mulher de Suném
  rationale: O gentílico feminino designa uma mulher de Suném. A forma analítica é imediatamente compreensível para leitores atuais, e “esta” preserva o demonstrativo הַזֹּאת.
- source_word: וַיִּקְרָאֶהָ
  choice: Geazi a chamou
  rationale: O hebraico repete קרא para narrar o cumprimento da ordem. Explicitar “Geazi” em português esclarece o sujeito sem alterar o referente dado pelo contexto.
- source_word: וַתָּבֹא אֵלָיו
  choice: e ela veio até ele
  rationale: A expressão בוא + אֶל indica movimento em direção a alguém. “Veio até ele” mantém o pronome do hebraico sem acrescentar a ideia de entrada em um recinto.
- source_word: שְׂאִי בְנֵךְ
  choice: Pegue o seu filho
  rationale: O imperativo feminino singular de נשׂא, neste contexto, manda a mãe tomar ou levantar o menino. “Pegue” é natural em português e בֵּן é traduzido especificamente por “filho”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição narrativa do verbo “chamar” foi mantida, e os pronomes do hebraico não foram interpretativamente substituídos por nomes onde isso não era necessário.
