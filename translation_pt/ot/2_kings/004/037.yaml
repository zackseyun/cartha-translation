base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/037.yaml
  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: pt
  text: Então ela entrou, lançou-se aos pés dele e curvou-se até o chão[a]. Depois, pegou o filho e saiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prostrou-se por terra”. O verbo hebraico também pode ser traduzido por “adorou” em alguns contextos, mas aqui provavelmente indica profunda reverência diante de Eliseu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Então ela entrou
  rationale: O waw consecutivo dá continuidade à sequência narrativa; como o contexto indica a entrada no aposento, “entrou” comunica naturalmente o movimento.
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: lançou-se aos pés dele
  rationale: A expressão descreve um gesto intenso de prostração ou súplica diante de Eliseu; “aos pés dele” é idiomático em português.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: curvou-se até o chão
  rationale: Preserva o gesto físico de profunda reverência sem determinar que se trate de adoração divina.
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: pegou o filho
  rationale: נשא pode significar levantar, tomar ou carregar; “pegou” expressa com naturalidade a ação concreta neste contexto.
- source_word: וַתֵּצֵא
  choice: saiu
  rationale: Tradução direta e natural do movimento narrativo indicado por יצא.
theological_decisions:
- issue: Sentido de וַתִּשְׁתַּחוּ em relação a Eliseu
  choice: Descrever o ato como curvar-se profundamente diante de Eliseu, em reverência e gratidão.
  alternative: Traduzir por “adorou” ou “prostrou-se”.
  rationale: O verbo hebraico pode indicar adoração ou reverência, conforme o contexto. Aqui, a formulação escolhida preserva o gesto e sua intensidade sem afirmar explicitamente que a mulher prestou adoração divina a Eliseu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição hebraica de waw foi variada entre “Então” e “Depois” para produzir uma narrativa natural sem perder a sequência das ações.
