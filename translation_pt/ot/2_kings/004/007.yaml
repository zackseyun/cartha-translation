base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/007.yaml
  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: pt
  text: 'Então ela veio e contou ao homem de Deus, e ele disse: “Vá, venda o óleo e pague o que você deve[a]. Você e seus filhos poderão viver do que sobrar[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pague ao seu credor”; a forma hebraica pode ser entendida com referência à obrigação devida ou à pessoa a quem se deve.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “você e seus filhos viverão do restante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: Então ela foi e contou
  rationale: Os dois wayyiqtol fazem a narrativa avançar em sequência. Em português, “Então ela foi e contou” expressa esse movimento com naturalidade, sem tornar a conjunção excessivamente explícita.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: ao homem de Deus
  rationale: Preserva o título hebraico tradicional e transparente, em vez de substituí-lo pela interpretação “ao profeta”.
- source_word: לְכִי מִכְרִי
  choice: Vá, venda
  rationale: Reproduz os dois imperativos femininos singulares em uma formulação portuguesa direta e natural.
- source_word: אֶת הַשֶּׁמֶן
  choice: o óleo
  rationale: Traduz שֶׁמֶן sem acrescentar a especificação “de oliva”, que não está expressa no substantivo neste versículo.
- source_word: וְשַׁלְּמִי אֶת נשי/כי
  choice: e pague o que você deve
  rationale: A formulação idiomática comunica a obrigação financeira e evita impor um número gramatical discutível, preservando em nota a possibilidade de referência ao credor.
- source_word: וְאַתְּ בני/כי
  choice: Você e seus filhos
  rationale: Mantém a referência explícita aos filhos, sem generalizá-la para “crianças” ou “filhos e filhas”.
- source_word: תִחְיִי בַּנּוֹתָר
  choice: poderão viver do que sobrar
  rationale: Expressa naturalmente a ideia de que o restante lhes dará meios de subsistência, ao mesmo tempo que preserva em nota a construção mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Empregou-se “você” por naturalidade ampla no português brasileiro; a estrutura direta conserva o tom narrativo e a fala imperativa do hebraico.
