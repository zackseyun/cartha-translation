  text: וּ/בָ֗את וְ/סָגַ֤רְתְּ הַ/דֶּ֨לֶת֙ בַּעֲדֵ֣/ךְ וּ/בְעַד בָּנַ֔יִ/ךְ וְ/יָצַ֕קְתְּ עַ֥ל כָּל הַ/כֵּלִ֖ים הָ/אֵ֑לֶּה וְ/הַ/מָּלֵ֖א תַּסִּֽיעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/004.yaml
  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: pt
  text: Depois entre, feche a porta atrás de você e de seus filhos e derrame o azeite em todas essas vasilhas[a]. À medida que cada uma ficar cheia, ponha-a de lado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos esses recipientes”. O termo hebraico é amplo e pode designar diversos tipos de objetos usados como recipientes.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “e a que estiver cheia, retire”. O singular hebraico pode ter sentido distributivo, referindo-se a cada vasilha à medida que fica cheia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאת
  choice: Depois entre
  rationale: בוא indica entrar no recinto; “Depois” expressa naturalmente a sequência marcada pelo waw.
- source_word: וְסָגַרְתְּ הַדֶּלֶת
  choice: feche a porta
  rationale: סגר significa fechar; a formulação é direta, atual e digna.
- source_word: בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: atrás de você e de seus filhos
  rationale: Com uma porta, בְּעַד indica que ela deve ser fechada atrás das pessoas, deixando-as no interior e excluindo os demais.
- source_word: וְיָצַקְתְּ עַל
  choice: derrame o azeite em
  rationale: יצק significa derramar, e em português se derrama o conteúdo “em” recipientes. “O azeite” fica implícito no hebraico, mas é recuperado naturalmente do contexto imediato.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: todas essas vasilhas
  rationale: כְּלִים é um termo amplo para objetos ou recipientes; no contexto, “vasilhas” é claro e natural sem especificar indevidamente um formato.
- source_word: וְהַמָּלֵא
  choice: À medida que cada uma ficar cheia
  rationale: O adjetivo substantivado singular, “a cheia”, tem sentido distributivo ou genérico no contexto; a formulação portuguesa deixa clara a ação repetida sem alterar o referente.
- source_word: תַּסִּיעִי
  choice: ponha-a de lado
  rationale: O hifil de נסע aqui significa retirar ou deslocar a vasilha cheia; “pôr de lado” descreve naturalmente a ação prática.
