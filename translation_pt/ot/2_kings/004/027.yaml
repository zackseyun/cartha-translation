  text: וַ/תָּבֹ֞א אֶל אִ֤ישׁ הָֽ/אֱלֹהִים֙ אֶל הָ/הָ֔ר וַֽ/תַּחֲזֵ֖ק בְּ/רַגְלָ֑י/ו וַ/יִּגַּ֨שׁ גֵּֽיחֲזִ֜י לְ/הָדְפָ֗/הּ וַ/יֹּאמֶר֩ אִ֨ישׁ הָ/אֱלֹהִ֤ים הַרְפֵּֽה לָ/הּ֙ כִּֽי נַפְשָׁ֣/הּ מָֽרָה לָ֔/הּ וַֽ/יהוָה֙ הֶעְלִ֣ים מִמֶּ֔/נִּי וְ/לֹ֥א הִגִּ֖יד לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: pt
  text: 'Quando ela chegou junto ao homem de Deus, no monte, agarrou-se aos pés dele. Geazi se aproximou para empurrá-la dali, mas o homem de Deus disse: “Deixe-a em paz, pois ela está com a alma amargurada[a], e Yahweh ocultou isso de mim e não me contou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a alma dela está amarga para ela”, expressão hebraica que indica profunda angústia interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Mantém literalmente o título hebraico tradicional dado ao profeta, sem substituí-lo pela interpretação “profeta”.
- source_word: אֶל הָהָר
  choice: no monte
  rationale: No contexto da chegada ao lugar onde Eliseu estava, “no monte” expressa a localização com naturalidade em português, sem especificar além do texto.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: agarrou-se aos pés dele
  rationale: O verbo חזק com ב indica segurar firmemente. A forma pronominal “agarrou-se” comunica tanto o contato físico quanto a urgência do gesto.
- source_word: וַיִּגַּשׁ
  choice: se aproximou
  rationale: Equivalente corrente e preciso para o verbo de aproximação, adequado ao fluxo narrativo.
- source_word: לְהָדְפָהּ
  choice: para empurrá-la dali
  rationale: הדף denota repelir ou afastar com força; “empurrá-la dali” preserva o caráter físico da ação em português natural.
- source_word: הַרְפֵּה לָהּ
  choice: Deixe-a em paz
  rationale: No contexto, a ordem exige que Geazi pare de interferir com a mulher; esta é a formulação idiomática mais natural.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: ela está com a alma amargurada
  rationale: Preserva o termo antropológico נֶפֶשׁ e a imagem hebraica da amargura interior, mas em uma construção natural e compreensível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הֶעְלִים מִמֶּנִּי
  choice: ocultou isso de mim
  rationale: A forma causativa de עלם indica que a questão ficou escondida de Eliseu; “isso” retoma naturalmente a aflição da mulher.
- source_word: וְלֹא הִגִּיד לִי
  choice: e não me contou
  rationale: Reproduz de modo direto a declaração de que Deus não revelou a Eliseu o que havia acontecido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” conserva o nome pessoal e evita substituí-lo pelo título “SENHOR”; “Javé” é uma forma aportuguesada possível, mas a transliteração escolhida mantém continuidade editorial.
- issue: Sentido antropológico de נֶפֶשׁ na expressão de sofrimento
  choice: ela está com a alma amargurada
  alternative: ela está profundamente angustiada; a vida dela lhe é amarga
  rationale: A opção conserva “alma” e a metáfora da amargura sem definir de forma técnica a composição humana nem reduzir a frase a uma paráfrase psicológica.
- issue: Conhecimento profético e revelação divina
  choice: Yahweh ocultou isso de mim e não me contou
  alternative: Yahweh não me revelou isso
  rationale: Mantém os dois verbos coordenados do hebraico e a tensão narrativa de que o homem de Deus não tinha conhecimento independente daquilo que Deus lhe revelava.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluência brasileira. A colocação “junto ao homem de Deus, no monte” esclarece a relação espacial sem alterar a sequência hebraica. “Geazi” segue a forma portuguesa tradicional do nome.
