base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/011.yaml
  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: pt
  text: Certo dia, ele chegou ali, dirigiu-se ao aposento de cima e deitou-se ali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dormiu ali”. O verbo hebraico pode indicar tanto deitar-se como dormir; o contexto não exige o sentido mais específico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Certo dia
  rationale: A expressão hebraica introduz uma ocasião na narrativa. “Certo dia” é natural em português e preserva o valor temporal sem reproduzir de modo rígido a fórmula hebraica.
- source_word: וַיָּבֹא שָׁמָּה
  choice: ele chegou ali
  rationale: בוא indica vir, chegar ou entrar; com שָׁמָּה, “chegou ali” expressa naturalmente o movimento até o lugar mencionado.
- source_word: וַיָּסַר
  choice: entrou
  rationale: Embora סור signifique literalmente desviar-se ou voltar-se para o lado, neste contexto descreve a entrada de Eliseu no aposento preparado para ele. “Entrou” comunica com clareza o movimento contextual sem sugerir um desvio incomum em português.
- source_word: אֶל הָעֲלִיָּה
  choice: no quarto de cima
  rationale: עֲלִיָּה designa um aposento situado na parte superior da casa. “Quarto de cima” é claro, atual e adequado ao espaço mobiliado para hospedagem descrito no contexto.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: e deitou-se ali
  rationale: שׁכב pode indicar deitar-se ou dormir. “Deitou-se” preserva a ação básica sem determinar que ele tenha adormecido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “ali” preserva a repetição enfática de שָׁמָּה no hebraico. O marcador [a] foi colocado após a oração a que se refere.
