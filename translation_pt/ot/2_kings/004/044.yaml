  text: וַ/יִּתֵּ֧ן לִ/פְנֵי/הֶ֛ם וַ/יֹּאכְל֥וּ וַ/יּוֹתִ֖רוּ כִּ/דְבַ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: pt
  text: Então ele pôs a comida diante deles, e eles comeram e deixaram sobrar[a], conforme a palavra de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ainda sobrou”.'
    reason: Alternativa idiomática que apresenta a sobra de modo impessoal, embora o hebraico empregue uma forma verbal cujo sujeito é “eles”.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ele pôs a comida
  rationale: נתן pode significar dar ou pôr. Com לִפְנֵיהֶם, o sentido contextual é servir ou colocar diante deles. “A comida” explicita de modo natural em português o objeto subentendido no hebraico e recuperado do versículo anterior.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Reproduz diretamente a expressão espacial e é idiomático no contexto de apresentar comida a um grupo.
- source_word: וַיֹּאכְלוּ
  choice: eles comeram
  rationale: Tradução direta do verbo אכל na sequência narrativa.
- source_word: וַיּוֹתִרוּ
  choice: deixaram sobrar
  rationale: A forma hifil de יתר apresenta os comensais como agentes que deixaram uma parte restante. “Deixaram sobrar” preserva essa estrutura sem sugerir apenas a existência passiva de sobras.
- source_word: כִּדְבַר
  choice: conforme a palavra de
  rationale: Mantém a referência formal à palavra pronunciada e sua realização, em vez de reduzi-la a uma paráfrase como “conforme havia dito”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva esse caráter e representa de modo amplamente reconhecido o tetragrama.
- issue: Relação entre a abundância da comida e a palavra divina
  choice: conforme a palavra de Yahweh
  alternative: como Yahweh havia dito
  rationale: A formulação conserva o vínculo explícito entre o acontecimento e a “palavra” divina, sem explicar além do que o hebraico afirma.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A construção “pôs a comida diante deles” mantém a imagem concreta do hebraico, enquanto “deixaram sobrar” preserva sua estrutura verbal. O nome Yahweh é mantido como nome próprio.
