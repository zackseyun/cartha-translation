    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ele perguntou
  rationale: O waw consecutivo dá continuidade à narrativa; como a fala introduz uma pergunta, “perguntou” é natural em português e explicita corretamente a função da frase.
- source_word: וּמֶה לַעֲשׂוֹת לָהּ
  choice: O que se pode fazer por ela?
  rationale: A construção com infinitivo e לָהּ pergunta que ação poderia ser realizada em benefício dela. A forma impessoal é clara e preserva a abertura modal da expressão hebraica.
- source_word: גֵּיחֲזִי
  choice: Geazi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲבָל
  choice: Bem
  rationale: Neste contexto, a partícula introduz uma observação ponderada, sem exigir contraste forte; “Bem” conserva o tom conversacional.
- source_word: בֵּן אֵין לָהּ
  choice: ela não tem filho
  rationale: A construção existencial hebraica é vertida pela expressão possessiva idiomática em português, mantendo בֵּן especificamente como “filho”.
- source_word: וְאִישָׁהּ זָקֵן
  choice: e o marido dela é idoso
  rationale: אִישׁ com o sufixo refere-se ao marido; “idoso” comunica com dignidade e clareza a idade avançada indicada por זָקֵן.
