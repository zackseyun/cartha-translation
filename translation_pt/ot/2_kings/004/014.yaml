  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: pt
  text: 'Então ele disse[a]: “O que se pode fazer por ela?” Geazi respondeu: “Bem, ela não tem filho[b], e o marido dela é idoso.”'
  philosophy: optimal-equivalence
  footnotes:
