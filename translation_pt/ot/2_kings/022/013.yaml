  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: pt
  text: Vão[a] e consultem Yahweh por mim, pelo povo e por todo o Judá, a respeito das palavras deste livro que foi encontrado. Pois grande é a ira de Yahweh que se acendeu contra nós, porque nossos pais não deram ouvidos às palavras deste livro, para fazer tudo conforme o que está escrito a nosso respeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “busquem Yahweh”. O verbo hebraico pode indicar buscar Deus de modo geral ou consultá-lo para obter orientação; aqui, o contexto favorece a ideia de uma consulta formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: consultem Yahweh
  rationale: Neste contexto, דרשׁ com Yahweh como objeto indica buscar uma resposta ou orientação divina formal. “Consultem” comunica isso com naturalidade; a nota conserva o sentido mais amplo de “buscar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em conformidade com a convenção do projeto.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: por mim, pelo povo e por todo o Judá
  rationale: בעד expressa atuação em favor ou em nome de alguém. A repetição de “por” preserva a estrutura enfática sem soar artificial em português.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: a respeito das palavras deste livro que foi encontrado
  rationale: Mantém o foco explícito nas palavras do livro e verte o particípio הנמצא por uma oração relativa natural.
- source_word: חֲמַת יְהוָה
  choice: a ira de Yahweh
  rationale: “Ira” preserva a força judicial e pactual de חֵמָה sem recorrer a uma formulação excessivamente intensa ou coloquial.
- source_word: נִצְּתָה בָנוּ
  choice: se acendeu contra nós
  rationale: Preserva a imagem de algo incendiado expressa pelo verbo יצת; “contra nós” explicita naturalmente a direção hostil exigida pelo contexto.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: nossos pais não deram ouvidos
  rationale: “Dar ouvidos” conserva tanto a imagem auditiva de שׁמע quanto sua implicação de acolhimento obediente. “Pais” mantém a forma masculina explícita do hebraico.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: para fazer tudo conforme o que está escrito
  rationale: Preserva o infinitivo de finalidade e a força de conformidade da preposição כְּ, em ordem natural no português.
- source_word: עָלֵינוּ
  choice: a nosso respeito
  rationale: Mantém a referência aberta do hebraico ao que foi escrito com aplicação à comunidade, sem restringi-la indevidamente a “contra nós” ou “para nós”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o tetragrama; “Yahweh” preserva o nome pactual segundo a convenção declarada do projeto.
- issue: Referência masculina em אֲבֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: “Nossos pais” reproduz a referência masculina do texto e é compreensível como designação dos predecessores da nação; a alternativa inclusiva é registrada em nota.
- issue: Relação entre ouvir e obedecer em שׁמע
  choice: não deram ouvidos ... para fazer
  alternative: não obedeceram
  rationale: A formulação escolhida preserva a progressão do hebraico entre acolher as palavras e agir de acordo com elas, sem condensar os dois elementos em um único verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial foi vertida no plural (“Vão e consultem”), e as repetições significativas do hebraico foram preservadas sem rigidez excessiva.
