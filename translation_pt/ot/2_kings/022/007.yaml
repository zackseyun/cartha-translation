base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: pt
  text: Mas não se exigirá deles prestação de contas[a] do dinheiro[b] entregue em suas mãos, pois agem com fidelidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não se lhes pedirá prestação de contas». Mais literalmente, «o dinheiro não será contabilizado com eles».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «prata»; em contextos financeiros, a palavra hebraica costuma significar dinheiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Introduz uma ressalva à instrução anterior; «mas» expressa de modo natural a força adversativa no contexto.
- source_word: יֵחָשֵׁב אִתָּם
  choice: não se exigirá deles prestação de contas
  rationale: O nifal de חשׁב, nesta construção e neste contexto financeiro, indica fazer ou exigir acerto de contas. A formulação comunica com clareza que os responsáveis não precisavam apresentar contas, enquanto a nota preserva a expressão mais formal e ambígua do hebraico.
- source_word: הַכֶּסֶף
  choice: o dinheiro
  rationale: כסף significa literalmente «prata», mas é empregado com frequência para dinheiro. Aqui, o contexto financeiro favorece «dinheiro» no texto principal; a forma literal é preservada em nota.
- source_word: הַנִּתָּן עַל יָדָם
  choice: entregue em suas mãos
  rationale: Mantém a imagem hebraica de algo posto sob a responsabilidade deles e continua natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual não se exigia prestação de contas.
- source_word: בֶאֱמוּנָה
  choice: com fidelidade
  rationale: Neste contexto, אֱמוּנָה descreve confiabilidade e integridade na conduta, não uma formulação doutrinária sobre fé.
- source_word: הֵם עֹשִׂים
  choice: agem
  rationale: O hebraico diz literalmente «eles fazem»; «agem» expressa naturalmente que desempenham sua responsabilidade de modo fiel sem especificar além do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução prioriza a expressão financeira natural «prestação de contas», preservando em nota a construção mais literal e sua ambiguidade; «em suas mãos» conserva a imagem do hebraico.
