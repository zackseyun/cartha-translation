  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: pt
  text: Fez o que era correto aos olhos de Yahweh e andou em todo o caminho de Davi, seu pai[a], sem se desviar nem para a direita nem para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “Davi, seu pai”. Aqui, “pai” tem o sentido mais amplo de antepassado ou fundador da dinastia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Fez o que era correto
  rationale: O adjetivo substantivado הַיָּשָׁר expressa aquilo que é reto ou correto; a formulação é natural em português e conserva a avaliação moral.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a imagem do idioma avaliativo hebraico e verte diretamente o nome divino.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: andou em todo o caminho
  rationale: Preserva a metáfora hebraica de caminhar como modo de conduta e o singular דֶּרֶךְ, indicando conformidade integral ao caminho mencionado.
- source_word: דָּוִד אָבִיו
  choice: Davi, seu pai
  rationale: Conserva a expressão dinástica do hebraico; a nota esclarece que 'pai' tem aqui o sentido amplo de antepassado.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: sem se desviar nem para a direita nem para a esquerda
  rationale: Reproduz a metáfora de não abandonar o caminho correto em nenhuma direção, com sintaxe natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; 'Yahweh' o representa diretamente, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A tradução preserva as metáforas hebraicas dos “olhos”, do “caminho” e do desvio para a direita ou para a esquerda.
