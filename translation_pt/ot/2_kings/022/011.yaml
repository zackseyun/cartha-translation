  yaml_path: translation/ot/2_kings/022/011.yaml
  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: pt
  text: Quando o rei ouviu as palavras do Livro da Lei[a], rasgou as suas roupas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Rolo da Lei”. O termo hebraico סֵפֶר pode designar um rolo, livro ou documento escrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A construção narrativa com וַיְהִי e a expressão temporal כִּשְׁמֹעַ é vertida naturalmente em português por uma oração iniciada por “Quando”, sem a fórmula pouco idiomática “e aconteceu que”.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Correspondência direta e natural do substantivo definido.
- source_word: דִּבְרֵי
  choice: as palavras do
  rationale: Preserva o sentido formal de דָּבָר no construto e aponta para as palavras ouvidas na leitura do documento.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Livro da Lei
  rationale: סֵפֶר pode designar livro, rolo ou documento escrito; “Livro da Lei” é claro e tradicional neste contexto, enquanto a nota preserva a alternativa material “rolo”. תּוֹרָה aqui designa o corpo de instrução legal da aliança.
- source_word: וַיִּקְרַע
  choice: rasgou
  rationale: קרע significa rasgar; a forma portuguesa comunica de modo digno e direto o gesto de aflição e alarme.
- source_word: בְּגָדָיו
  choice: as suas roupas
  rationale: Traduz o substantivo plural com sufixo possessivo em linguagem atual e amplamente compreensível.
