base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: pt
  text: 'Então o sumo sacerdote Hilquias disse ao escriba Safã: “Encontrei o Livro da Lei[a] na casa de Yahweh[b].” Hilquias entregou o livro a Safã, e ele o leu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rolo da Lei”. A palavra hebraica סֵפֶר pode designar um livro, rolo ou documento escrito.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, no templo de Yahweh.
    reason: cultural_note
  - marker: c
    text: 'Ou, com menor probabilidade: “leu nele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” comunica naturalmente a sequência em português.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: É o título consagrado e claro em português para o principal ofício sacerdotal de Israel.
- source_word: הַסֹּפֵר
  choice: o escriba
  rationale: Preserva o termo histórico para o funcionário letrado da administração real, sem restringir indevidamente sua função a “secretário”.
- source_word: סֵפֶר הַתּוֹרָה
  choice: o Livro da Lei
  rationale: Neste contexto jurídico e pactual, “Lei” expressa adequadamente תּוֹרָה; סֵפֶר pode designar tanto um livro-documento como um rolo, alternativa registrada em nota.
- source_word: מָצָאתִי
  choice: Encontrei
  rationale: O perfeito hebraico anuncia uma descoberta concluída e agora comunicada; o pretérito perfeito é natural e preciso em português.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Mantém a expressão concreta do hebraico, enquanto uma nota esclarece que ela se refere ao templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּתֵּן ... אֶת הַסֵּפֶר
  choice: entregou o livro
  rationale: “Entregou” comunica de modo natural o ato de dar o documento a Safã neste contexto.
- source_word: וַיִּקְרָאֵהוּ
  choice: e ele o leu
  rationale: O sufixo pronominal é entendido naturalmente como objeto direto, “o leu”. A forma “ele” conserva a estrutura do hebraico, embora Safã seja o referente narrativo mais provável.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo pelo título “SENHOR” e representa melhor a forma hebraica do que “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Mantêm-se a expressão hebraica “casa de Yahweh” e a ambiguidade pronominal de “ele”, sem tornar o texto artificial.
