  text: לָ/כֵן֩ הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ עַל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁר אֲנִ֥י מֵבִ֖יא עַל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: pt
  text: “Por isso, eis que eu o reunirei a seus antepassados, e você será recolhido aos seus túmulos em paz[a]. Seus olhos não verão toda a calamidade que trarei sobre este lugar.” Então eles levaram a resposta ao rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tranquilamente”. O hebraico diz “em paz”, expressão que pode indicar que Josias morreria antes de ver o juízo vindouro, sem necessariamente especificar a maneira exata de sua morte.
    reason: alternativa lexical e preservação da tensão histórica e teológica
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de modo natural a conclusão decorrente da humildade e da resposta de Josias no contexto anterior.
- source_word: הִנְנִי
  choice: eis que
  rationale: Preserva a ênfase solene e demonstrativa do anúncio divino, em registro elevado mas compreensível.
- source_word: אֹסִפְךָ / וְנֶאֱסַפְתָּ
  choice: eu o reunirei / você será recolhido
  rationale: Mantém a repetição da raiz אסף e o idiomatismo referente à morte e à reunião com os antepassados.
- source_word: עַל אֲבֹתֶיךָ
  choice: a seus antepassados
  rationale: Comunica claramente o sentido idiomático de ser reunido aos familiares falecidos; evita que “pais” seja entendido apenas como os genitores imediatos.
- source_word: קִבְרֹתֶיךָ
  choice: aos seus túmulos
  rationale: Preserva o plural hebraico e emprega um termo natural para os locais de sepultamento da família.
- source_word: בְּשָׁלוֹם
  choice: em paz
  rationale: Mantém a forma nominal e a abertura semântica de שָׁלוֹם, sem definir de modo indevido a maneira exata da morte de Josias.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Seus olhos não verão
  rationale: Conserva a imagem explícita e enfática do hebraico, no qual “seus olhos” é o sujeito.
- source_word: הָרָעָה
  choice: a calamidade
  rationale: No contexto, רָעָה designa a desgraça ou o juízo vindouro, e não o mal moral.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל
  choice: que trarei sobre
  rationale: Expressa de forma natural em português a ação divina iminente anunciada pelo particípio hebraico.
- source_word: הַמָּקוֹם הַזֶּה
  choice: este lugar
  rationale: Tradução direta e suficientemente ampla para a referência contextual a Jerusalém e ao âmbito atingido pelo juízo.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: Então eles levaram a resposta ao rei
  rationale: Reproduz naturalmente a fórmula hebraica de voltar ao rei com a mensagem recebida.
theological_decisions:
- issue: Sentido de “em paz” diante da posterior morte de Josias em batalha (2 Reis 23:29)
  choice: Manter literalmente “em paz”, preservando a tensão do texto.
  alternative: Traduzir como “tranquilamente” ou explicar no corpo do versículo que Josias morreria antes de o juízo chegar.
  rationale: A expressão hebraica não deve ser harmonizada com o relato posterior. A oração seguinte sugere que a promessa se relaciona especialmente ao fato de Josias não presenciar a calamidade vindoura, sem necessariamente descrever todos os pormenores de sua morte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” conserva a solenidade profética; o restante privilegia sintaxe corrente. O tratamento por “você” permite distinguir naturalmente as formas dirigidas ao rei sem recorrer a construções excessivamente arcaicas.
