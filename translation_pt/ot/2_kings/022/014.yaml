source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: pt
  text: Então o sacerdote Hilquias, Aicão, Acbor, Safã e Asaías foram até a profetisa Hulda, mulher de Salum, filho de Ticvá, filho de Harás, que era responsável pelas vestes[a]. Ela morava em Jerusalém, no Segundo Bairro[b], e eles falaram com ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “guardião das vestes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “no segundo distrito”; o hebraico provavelmente se refere a uma área específica de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ... foram
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa naturalmente a sequência, e o plural em português concorda com o sujeito composto.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: O hebraico diz apenas “o sacerdote”; não se acrescenta “sumo”, embora Hilquias seja assim identificado em outro contexto.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: a profetisa Hulda
  rationale: O substantivo hebraico está no feminino e identifica Hulda explicitamente como mulher que exercia função profética.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: mulher de Salum
  rationale: A construção indica a relação matrimonial; “mulher de” é uma forma bíblica, clara e corrente em português.
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: filho de Ticvá e neto de Harás
  rationale: Na cadeia genealógica, o segundo “filho de” relaciona Ticvá a Harás; “neto de” torna a relação de Hulda por casamento clara em português sem alterar a genealogia.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: responsável pelas vestes
  rationale: Expressa de modo natural a função oficial de guardar ou cuidar das vestes, preservando “vestes” no texto e registrando a forma literal em nota.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: Ela morava
  rationale: Neste aviso locativo, יָשַׁב tem o sentido comum de residir ou morar.
- source_word: בַּמִּשְׁנֶה
  choice: no Segundo Bairro
  rationale: Provavelmente designa uma área específica de Jerusalém. A capitalização sinaliza topônimo, enquanto a nota preserva a possibilidade de “segundo distrito”.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: e eles falaram com ela
  rationale: A expressão descreve a fala dirigida a Hulda no contexto de uma consulta. “Falaram com ela” é natural em português e não acrescenta o conteúdo da conversa.
theological_decisions:
- issue: Se o título de Hilquias deve ser ampliado para “sumo sacerdote”
  choice: o sacerdote
  alternative: o sumo sacerdote
  rationale: O versículo traz somente הַכֹּהֵן, “o sacerdote”. A tradução não importa para o texto um título mais específico conhecido pelo contexto.
- issue: Como verter o título profético feminino
  choice: a profetisa
  alternative: a profeta
  rationale: A forma hebraica é explicitamente feminina; “profetisa” conserva essa marca de modo claro e tradicional, sem diminuir a função profética de Hulda.
- issue: Identificação de בַּמִּשְׁנֶה
  choice: no Segundo Bairro
  alternative: no segundo distrito
  rationale: A expressão parece designar uma parte específica de Jerusalém, mas sua identificação exata é incerta; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os nomes próprios seguem formas portuguesas reconhecíveis. A sintaxe foi suavemente ajustada para clareza, sem ampliar o título sacerdotal nem resolver a incerteza do nome da área urbana.
