source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: pt
  text: Visto que o seu coração se enterneceu e você se humilhou diante de Yahweh ao ouvir o que falei contra este lugar e contra os seus habitantes — que este lugar se tornaria uma desolação[a] e uma maldição —, e visto que você rasgou as suas roupas e chorou diante de mim, eu também ouvi você — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “motivo de horror” ou “motivo de espanto”. O termo hebraico שַׁמָּה pode indicar desolação, horror ou algo que causa espanto em contextos de juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Visto que
  rationale: Introduz a causa da resposta divina e permite construir com naturalidade, em português, o longo período que culmina em “eu também ouvi você”.
- source_word: רַךְ לְבָבְךָ
  choice: o seu coração se enterneceu
  rationale: Conserva a imagem do coração que se torna brando e receptivo, comunicando contrição sem sugerir fraqueza.
- source_word: וַתִּכָּנַע
  choice: você se humilhou
  rationale: Expressa a ação reflexiva e voluntária de se rebaixar diante de Deus.
- source_word: מִפְּנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Traduz naturalmente o idioma hebraico de estar perante a face ou presença de Deus e preserva o nome divino.
- source_word: בְּשָׁמְעֲךָ
  choice: ao ouvir
  rationale: Representa de modo conciso a relação temporal e circunstancial do infinitivo hebraico.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: o que falei
  rationale: Apresenta o conteúdo do pronunciamento divino em português corrente e digno.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: contra este lugar e contra os seus habitantes
  rationale: No contexto de juízo, עַל tem força adversativa; “contra” torna clara a direção da sentença anunciada.
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: que se tornariam uma desolação e uma maldição
  rationale: Expressa o resultado anunciado para o lugar e seus habitantes. “Desolação” é adequado ao contexto de juízo, enquanto a nota preserva a amplitude semântica de שַׁמָּה.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: você rasgou as suas roupas
  rationale: Usa linguagem moderna para o gesto convencional de luto e arrependimento.
- source_word: וַתִּבְכֶּה לְפָנַי
  choice: chorou diante de mim
  rationale: Preserva tanto a expressão de pesar quanto a orientação pessoal do ato perante Deus.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: eu também ouvi você
  rationale: O pronome enfático e גַם destacam a resposta correspondente de Deus; “você” explicita o objeto subentendido pelo contexto.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade e naturalidade a fórmula profética de encerramento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Natureza da resposta de Josias
  choice: “o seu coração se enterneceu” e “você se humilhou”
  alternative: “o seu coração era fraco” ou “você foi humilhado”
  rationale: A formulação retrata receptividade contrita e humilhação voluntária diante de Deus, sem converter a ternura em fraqueza nem atribuir o ato apenas a uma ação externa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período longo e solene acompanha a estrutura causal do hebraico, com travessões para tornar claro o pronunciamento de juízo. O marcador [a] foi colocado junto de “desolação”, termo ao qual a nota realmente se refere.
