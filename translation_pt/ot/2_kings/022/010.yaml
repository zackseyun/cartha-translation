  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: pt
  text: 'Então Safã, o escriba, informou ao rei: “O sacerdote Hilquias me deu um livro[a].” E Safã o leu diante do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um rolo”. A palavra hebraica pode se referir, de modo geral, a um documento escrito e não especifica por si só o formato físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: informou
  rationale: O hifil de נגד significa tornar conhecido, contar ou informar. “Informou” é natural no contexto de um oficial que comunica algo ao rei, sem dar ao verbo formalidade excessiva.
- source_word: הַסֹּפֵר
  choice: o escriba
  rationale: סֹפֵר pode designar um escriba ou secretário real. “Escriba” preserva a designação histórica e é amplamente reconhecível em português.
- source_word: סֵפֶר
  choice: um livro[a]
  rationale: סֵפֶר é um termo geral para um escrito, livro ou documento e não determina por si só o formato físico. O artigo indefinido acompanha a forma sem artigo no hebraico; a nota preserva a alternativa culturalmente provável “rolo”.
- source_word: נָתַן לִי
  choice: me deu
  rationale: O perfeito hebraico apresenta uma ação concluída. Em português, o pretérito perfeito simples é a forma idiomática para essa fala e pode conservar naturalmente sua relevância presente.
- source_word: וַיִּקְרָאֵהוּ
  choice: o leu
  rationale: קרא, tendo um escrito como objeto, significa lê-lo, normalmente em voz alta nesse contexto. O pronome “o” retoma “livro” sem acrescentar uma especificação ausente no hebraico.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: diante do rei
  rationale: A expressão significa na presença do rei. “Diante do rei” é conciso, digno e idiomático.
- source_word: חִלְקִיָּה
  choice: Hilquias
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: שָׁפָן
  choice: Safã
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome hebraico em português.
