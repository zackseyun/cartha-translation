source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֣ה הַ/כֹּהֵ֡ן וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַכְבּ֨וֹר בֶּן מִיכָיָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סֹּפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: pt
  text: 'Então o rei ordenou a Hilquias, o sacerdote[c], a Aicão, filho de Safã, a Acbor, filho de Micaías, a Safã, o escriba[a], e a Asaías, servo do rei[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Safã, o secretário». O termo hebraico pode designar um escriba real ou um secretário administrativo.
    reason: lexical_alternative
  - marker: b
    text: Ou «Asaías, oficial do rei». O hebraico diz literalmente «servo», expressão que, na corte, também podia designar um oficial a serviço do rei.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz «Hilquias, o sacerdote», não explicitamente «o sumo sacerdote».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: O verbo צוה expressa uma ordem com autoridade; o wayyiqtol situa a ação na sequência narrativa passada.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: Hilquias, o sacerdote
  rationale: Reproduz o título hebraico הַכֹּהֵן sem acrescentar «sumo», que não aparece neste versículo.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Aicão, filho de Safã
  rationale: «Filho de» é a forma portuguesa natural para a identificação patronímica com בֶּן.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: Acbor, filho de Micaías
  rationale: Emprega formas onomásticas portuguesas reconhecíveis e mantém a identificação patronímica do hebraico.
- source_word: שָׁפָן הַסֹּפֵר
  choice: Safã, o escriba
  rationale: סֹפֵר pode designar escriba ou secretário administrativo; «escriba» preserva mais diretamente o termo, com a alternativa registrada em nota.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaías, servo do rei
  rationale: עֶבֶד significa literalmente «servo», embora no ambiente da corte possa indicar um oficial a serviço do rei; a nota preserva essa possibilidade.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz diretamente o conteúdo da ordem no versículo seguinte; em português atual, os dois-pontos realizam essa função com naturalidade, sem perder a ligação sintática.
theological_decisions:
- issue: Título sacerdotal de Hilquias
  choice: o sacerdote
  alternative: o sumo sacerdote
  rationale: O texto hebraico deste versículo diz apenas הַכֹּהֵן, «o sacerdote»; a tradução evita importar um título mais específico a partir do contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formas tradicionais dos nomes bíblicos. A enumeração recebe vírgulas explicativas para distinguir títulos e patronímicos; os dois-pontos antecipam naturalmente a fala do versículo seguinte. Todos os marcadores de nota aparecem junto aos termos correspondentes.
