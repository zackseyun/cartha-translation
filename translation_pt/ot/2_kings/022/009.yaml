  to: 'Então Safã, o escriba, foi ao rei, apresentou-lhe o relatório e disse: “Seus servos despejaram[a] a prata encontrada no templo[b] e a entregaram[c] aos trabalhadores encarregados da Casa de Yahweh.”'
