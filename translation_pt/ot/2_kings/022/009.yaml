  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: pt
  text: 'Então Safã, o escriba, foi ao rei, apresentou-lhe o relatório e disse: “Seus servos despejaram[a] a prata encontrada no templo[b] e a entregaram[c] aos trabalhadores encarregados da Casa de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esvaziaram”; o verbo hebraico descreve mais literalmente o ato de derramar ou esvaziar, aqui no sentido de retirar a prata depositada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na casa”; isto é, no templo.
    reason: cultural_note
  - marker: c
    text: Literalmente, “puseram-na nas mãos dos”; expressão que significa entregar algo à responsabilidade de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: o escriba
  rationale: Embora o termo também possa designar um secretário ou oficial da corte, “escriba” preserva sua forma lexical e é compreensível no contexto.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: apresentou-lhe o relatório
  rationale: O idioma hebraico expressa o ato de voltar com uma informação ou prestar contas. A formulação portuguesa comunica naturalmente a ação administrativa sem exigir que Safã tivesse saído da presença do rei imediatamente antes.
- source_word: הִתִּיכוּ
  choice: esvaziaram
  rationale: No contexto da administração dos fundos do templo, o verbo indica retirar ou despejar a prata de onde estava depositada, não derretê-la. “Esvaziaram” conserva parte da imagem concreta e permanece inteligível.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: כֶּסֶף pode significar prata ou dinheiro; “prata” mantém a referência material explícita do hebraico.
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: encontrada na Casa
  rationale: “Casa” preserva o termo hebraico, que neste contexto designa o templo. A inicial maiúscula sinaliza esse uso sem substituir o vocábulo por uma interpretação no texto principal.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: a entregaram
  rationale: O idioma literalmente relacionado a pôr algo na mão de alguém significa colocá-lo sob sua responsabilidade. “Entregaram” expressa essa transferência de custódia em português natural.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: aos trabalhadores
  rationale: A expressão refere-se às pessoas que executavam os trabalhos de reparação; “trabalhadores” é claro, atual e inclusivo.
- source_word: הַמֻּפְקָדִים
  choice: encarregados
  rationale: O particípio passivo indica pessoas designadas ou postas sob responsabilidade; “encarregados” conserva tanto a nomeação quanto a função.
- source_word: בֵּית יְהוָה
  choice: Casa de Yahweh
  rationale: A expressão designa o templo, mas a tradução mantém a imagem hebraica da “Casa” e o nome divino pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, sem introduzir uma interpretação denominacional.
- issue: Sentido de בַּבַּיִת e בֵּית יְהוָה
  choice: Casa; Casa de Yahweh
  alternative: templo; templo de Yahweh
  rationale: No contexto, a referência é inequivocamente ao templo, mas “Casa” conserva a metáfora cultual do hebraico; a nota esclarece o referente histórico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. Mantiveram-se “escriba”, “prata”, “Casa” e “Yahweh” para preservar elementos concretos e teologicamente relevantes do hebraico, enquanto os idiomas administrativos foram vertidos de modo corrente. Os marcadores foram posicionados junto às expressões que cada nota esclarece.
