  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: pt
  text: 'Então ela lhes disse: “Assim diz Yahweh, o Deus de Israel: Digam ao homem que os enviou a mim:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: Então ela lhes disse
  rationale: O wayyiqtol dá continuidade à narrativa, e “então” expressa essa sequência com naturalidade. O pronome “ela” preserva explicitamente que é Hulda quem fala, enquanto “lhes” representa אֲלֵיהֶם.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética de mensageiro em linguagem corrente e solene. O presente “diz” comunica a proclamação vigente introduzida pelo perfeito hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a cadeia construta e identifica Yahweh como o Deus de Israel.
- source_word: אִמְרוּ
  choice: Digam
  rationale: Preserva o imperativo plural dirigido aos integrantes da delegação.
- source_word: לָאִישׁ
  choice: ao homem
  rationale: Traduz o substantivo masculino singular אִישׁ, que no contexto se refere especificamente ao homem que enviou a delegação.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלַי
  choice: que os enviou a mim
  rationale: Verte a oração relativa de modo natural, mantendo tanto o objeto plural masculino da ação de enviar quanto Hulda como destino.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico traz o tetragrama como nome próprio. “Yahweh” o preserva por transliteração, sem substituí-lo pelo título “SENHOR”; “Javé” é uma forma portuguesa possível, mas menos diretamente transliterada.
- issue: Gênero de אִישׁ
  choice: ao homem
  alternative: à pessoa
  rationale: O substantivo é masculino singular e, neste contexto, designa um homem específico; por isso, não foi neutralizado.
- issue: Continuidade da fala profética
  choice: dois-pontos ao fim do versículo
  alternative: encerrar a frase neste versículo
  rationale: A ordem “Digam ao homem...” introduz a mensagem que começa no versículo seguinte. Os dois-pontos preservam essa ligação sintática sem completar antecipadamente o conteúdo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a cadência profética de כֹּה אָמַר e deixa a frase deliberadamente aberta para a continuação no versículo seguinte.
