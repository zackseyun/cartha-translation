  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: pt
  text: aos artesãos, aos construtores e aos pedreiros,[a] e para comprar madeira e pedras de cantaria,[b] a fim de reforçar a casa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “aos que constroem ou reparam muros ou cercas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pedras lavradas” ou “pedras cortadas”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “a casa”; isto é, o templo, a casa do SENHOR no contexto.'
    reason: cross_reference
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: aos artesãos
  rationale: חָרָשִׁים designa trabalhadores especializados de modo amplo; “artesãos” evita restringir o termo a carpinteiros.
- source_word: וְלַבֹּנִים
  choice: aos construtores
  rationale: O particípio substantivado de בנה refere-se diretamente aos que executam a construção.
- source_word: וְלַגֹּדְרִים
  choice: aos que reparavam os muros
  rationale: גדר se relaciona à construção ou reparação de muros e cercas. A formulação explicita essa atividade sem reduzi-la ao sentido moderno mais estreito de “pedreiros”.
- source_word: וְלִקְנוֹת
  choice: e para comprar
  rationale: O infinitivo com ל indica a finalidade ou destinação dos recursos e continua naturalmente a enumeração.
- source_word: עֵצִים
  choice: madeira
  rationale: No contexto de materiais de construção, “madeira” é corrente e claro em português amplo.
- source_word: וְאַבְנֵי מַחְצֵב
  choice: pedras de cantaria
  rationale: A expressão indica pedras extraídas e trabalhadas para construção; “pedras de cantaria” preserva esse sentido técnico, com alternativa mais transparente em nota.
- source_word: לְחַזֵּק
  choice: a fim de reforçar
  rationale: Preserva a força causativa de חזק, “tornar forte”, e comunica naturalmente a finalidade das obras.
- source_word: אֶת־הַבָּיִת
  choice: o templo
  rationale: Embora בַּיִת signifique literalmente “casa”, o referente contextual é o templo do SENHOR. “Templo” torna o referente imediato para o leitor, enquanto a forma literal é registrada em nota.
