  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְרֹ֣שׁ אֶת יְהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: pt
  text: 'Mas ao rei de Judá, que enviou vocês para consultar Yahweh, digam a ele o seguinte: Assim diz Yahweh, o Deus de Israel: Quanto às palavras que você ouviu[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase hebraica fica em suspenso neste ponto e é completada no versículo seguinte.
    reason: Esclarece que a construção incompleta é característica do texto hebraico e continua no próximo versículo.
lexical_decisions:
- source_word: וְאֶל
  choice: Mas ao
  rationale: A conjunção com a preposição marca a mudança contrastiva do destinatário anterior para o rei de Judá; “Mas ao” preserva essa transição discursiva.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Reprodução natural e direta da construção hebraica.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: que enviou vocês
  rationale: O particípio identifica o rei por sua ação; a oração relativa é natural em português. “Vocês” representa claramente o objeto plural.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: para consultar Yahweh
  rationale: Neste contexto, דרשׁ descreve a busca de orientação divina por meio de consulta profética; “consultar” comunica esse sentido com clareza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: digam o seguinte
  rationale: Expressa de modo idiomático a instrução dirigida ao grupo e introduz a mensagem que deve ser comunicada ao rei.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética tradicional e sua força declarativa no presente.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da expressão hebraica de identificação.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Quanto às palavras que você ouviu—
  rationale: “Quanto às” mantém a construção tópica suspensa, cuja conclusão aparece no versículo seguinte; “você” reflete a mudança para o destinatário singular, o rei.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Manutenção da construção sintaticamente suspensa no fim do versículo
  choice: Quanto às palavras que você ouviu—
  alternative: Completar a frase com conteúdo do versículo seguinte
  rationale: O texto hebraico deixa a oração em aberto, e a tradução conserva essa tensão sintática sem antecipar nem incorporar o versículo seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” distingue os enviados, enquanto o singular “você” se dirige ao rei. O travessão final conserva visualmente a frase suspensa.
