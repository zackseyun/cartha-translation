id: 2KI.22.3
reference: 2 Kings 22:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: pt
  text: 'No décimo oitavo ano do rei Josias, o rei enviou Safã, filho de Azalias, filho de Mesulão, o escriba, à casa de Yahweh[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao templo de Yahweh”. Literalmente: “à casa de Yahweh”.'
    reason: Esclarece que a expressão hebraica literal “casa de Yahweh” se refere ao templo.
lexical_decisions:
- source_word: וַיְהִי
  choice: 'No'
  rationale: A forma narrativa introduz um novo episódio; em português, a expressão temporal direta é natural e mantém a continuidade sem acrescentar um marcador como “ora”.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: décimo oitavo ano do rei Josias
  rationale: Reproduz de modo claro e idiomático a fórmula hebraica de datação pelo ano de reinado.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: o rei enviou
  rationale: Mantém a repetição explícita de “rei” presente no hebraico.
- source_word: שָׁפָן
  choice: Safã
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: filho de Azalias, filho de Mesulão
  rationale: Conserva diretamente a cadeia patronímica do texto hebraico, sem convertê-la interpretativamente em “neto”.
- source_word: הַסֹּפֵר
  choice: o escriba
  rationale: Tradução ampla e transparente; o termo também pode designar um secretário ou oficial da corte, mas o contexto imediato não exige essa especificação.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a imagem literal hebraica de “casa”, embora a referência seja ao templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz diretamente as palavras da incumbência que continuam no versículo seguinte; os dois-pontos são naturais em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. Mantiveram-se a repetição de “rei”, a cadeia patronímica e o título “escriba” para refletir a estrutura e a abertura semântica do hebraico.
