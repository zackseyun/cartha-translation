  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Eis que trago calamidade[a] sobre este lugar e sobre os seus habitantes: todas as palavras do livro que o rei de Judá leu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desgraça” ou “desastre”. O termo hebraico רָעָה, neste contexto, indica a calamidade resultante do juízo, não o mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e verte diretamente o nome divino, mantendo sua força pactual.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Comunica a ênfase solene e a iminência do anúncio divino em registro digno e reconhecível.
- source_word: מֵבִיא
  choice: estou trazendo
  rationale: O particípio hebraico apresenta a ação como iminente ou já em curso; a forma progressiva conserva melhor esse aspecto do que o futuro simples.
- source_word: רָעָה
  choice: desgraça
  rationale: Neste contexto de juízo, o termo indica calamidade ou desastre, não maldade moral. “Desgraça” é clara e natural em português.
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: sobre este lugar e sobre os seus habitantes
  rationale: “Sobre” expressa naturalmente o direcionamento do juízo, e “habitantes” verte de modo conciso o particípio substantivado.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: todas as palavras do livro
  rationale: Mantém a formulação concreta e a relação sintática appositiva do hebraico, sem substituí-la pela interpretação mais explícita “tudo o que está escrito”.
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: que o rei de Judá leu
  rationale: Tradução direta da oração relativa; não acrescenta “em voz alta”, sentido possível no contexto, mas não exigido pela forma verbal.
theological_decisions:
- issue: Sentido de רָעָה no anúncio do juízo divino
  choice: desgraça
  alternative: mal; calamidade; desastre
  rationale: O contexto descreve a calamidade punitiva que Yahweh fará vir sobre o lugar e seus habitantes. A escolha evita sugerir que Deus pratique maldade moral, sem atenuar a severidade do juízo.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome divino presente no texto hebraico e sua força pactual.
- issue: Relação de “todas as palavras do livro” com a calamidade anunciada
  choice: manter a construção appositiva sem explicá-la
  alternative: isto é, cumprirei tudo o que está escrito no livro
  rationale: O hebraico associa diretamente a calamidade a “todas as palavras do livro”. A tradução conserva essa tensão sintática e evita acrescentar explicitamente o verbo “cumprir”, embora esse sentido esteja implícito no contexto.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva o tom profético elevado; a ordem e a aposição finais permanecem próximas do hebraico para não explicitar além do texto-fonte.
