  text: ו/יתנ/ה עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים ב/בית יְהוָ֑ה וְ/יִתְּנ֣וּ אֹת֗/וֹ לְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁר֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/חַזֵּ֖ק בֶּ֥דֶק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: pt
  text: Que ele entregue o dinheiro nas mãos dos responsáveis pela obra que foram designados na casa de Yahweh, e que eles o deem aos trabalhadores que estão na casa de Yahweh, para reparar os danos na casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para fortalecer a deterioração da casa”. A expressão se refere à reparação dos danos estruturais do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְּנֵה עַל יַד
  choice: Que ele entregue o dinheiro aos responsáveis
  rationale: נתן com עַל יַד descreve a entrega de algo à custódia ou ao controle de alguém. O objeto, o dinheiro, vem do contexto imediato e é explicitado em português para evitar um pronome sem antecedente dentro do versículo isolado.
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  choice: responsáveis pela obra, encarregados
  rationale: A expressão distingue os executores ou administradores da obra que haviam sido formalmente incumbidos na casa de Yahweh; esta formulação preserva tanto a atividade quanto a ideia passiva de nomeação ou incumbência.
- source_word: בְּבֵית יְהוָה
  choice: da casa de Yahweh
  rationale: בית é mantido como 'casa', e o nome divino יהוה é transliterado como Yahweh.
- source_word: וְיִתְּנוּ אֹתוֹ
  choice: e que estes o deem
  rationale: Mantém a força instrutiva da forma verbal e a cadeia de entrega do dinheiro aos trabalhadores.
- source_word: לְעֹשֵׂי הַמְּלָאכָה אֲשֶׁר בְּבֵית יְהוָה
  choice: aos trabalhadores que estão na casa de Yahweh
  rationale: Aqui 'trabalhadores' diferencia naturalmente os que executam o serviço do primeiro grupo encarregado de administrar a obra, sem acrescentar uma função técnica específica.
- source_word: לְחַזֵּק בֶּדֶק הַבָּיִת
  choice: para reparar as partes danificadas do templo
  rationale: Literalmente, a expressão fala em 'fortalecer o dano/a deterioração da casa'; no contexto de manutenção predial, 'reparar as partes danificadas' comunica o sentido de maneira clara. 'Templo' explicita o referente da última ocorrência de 'casa' e evita uma sequência ambígua em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o tetragrama; 'Yahweh' preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura conserva a cadeia de custódia do dinheiro e distingue, sem rigidez excessiva, os encarregados da obra dos trabalhadores que executariam os reparos.
