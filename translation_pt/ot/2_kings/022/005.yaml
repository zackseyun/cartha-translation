revisions:
- from: Que ele entregue o dinheiro aos responsáveis pela obra, encarregados da casa de Yahweh, e que estes o deem aos trabalhadores que estão na casa de Yahweh, para reparar as partes danificadas do templo.[a]
  to: Que ele entregue o dinheiro nas mãos dos responsáveis pela obra que foram designados na casa de Yahweh, e que eles o deem aos trabalhadores que estão na casa de Yahweh, para reparar os danos na casa.[a]
  rationale: A revisão conserva a explicitação contextual de «o dinheiro», melhora a representação da entrega à custódia dos responsáveis e mantém a localização/atribuição dos designados sem transformá-la em um cargo definido. Também preserva «casa» na última ocorrência, refletindo a repetição de בית no hebraico, e ajusta a nota para uma explicação lexical mais precisa.
