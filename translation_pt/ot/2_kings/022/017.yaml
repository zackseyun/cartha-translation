source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: pt
  text: porque me abandonaram e fizeram ofertas por queima a outros deuses[a], a fim de me provocar à ira com todas as obras das suas mãos. Por isso, a minha ira se acendeu contra este lugar e não se apagará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais especificamente: “queimaram incenso a outros deuses”.'
    reason: 'Alternativa lexical: קטר frequentemente designa a queima de incenso, embora possa ter sentido cultual um pouco mais amplo.'
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: porque
  rationale: A locução introduz a razão do juízo; “porque” expressa com naturalidade sua força causal.
- source_word: עֲזָבוּנִי
  choice: me abandonaram
  rationale: Preserva o peso relacional e pactual de עזב em português atual, sem a possível ambiguidade coloquial de “me deixaram”.
- source_word: וַיְקַטְּרוּ
  choice: queimaram ofertas
  rationale: O piel de קטר descreve uma oferta feita por queima e frequentemente se refere a incenso, sem que o verbo isolado precise ser restringido sempre a ele. A alternativa mais específica é registrada em nota.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Tradução direta da expressão para divindades diferentes de YHWH.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: a fim de me provocar à ira
  rationale: Mantém a possível nuance de propósito ou resultado de לְמַעַן e a força afetiva e judicial de הכעיס.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: com todas as obras das suas mãos
  rationale: Conserva a metáfora hebraica das “obras das mãos”, especialmente relevante na crítica à idolatria, e toma בְּ em sentido instrumental.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: a minha ira se acendeu
  rationale: Preserva a imagem de fogo expressa por יצת e verte חמה como ira intensa. O perfeito é apresentado como estado já desencadeado, com efeito que prossegue.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: contra este lugar
  rationale: Embora בְּ seja literalmente “em”, “contra” identifica em português o lugar como alvo da ira e do juízo.
- source_word: וְלֹא תִכְבֶּה
  choice: e não se apagará
  rationale: Mantém a metáfora do fogo e expressa de modo natural e solene a continuidade futura do juízo.
theological_decisions:
- issue: Linguagem antropopática sobre a ira divina
  choice: Manter que o povo provoca Deus à ira e que sua ira se acende
  alternative: Substituir por linguagem impessoal de punição ou consequência
  rationale: O hebraico emprega explicitamente linguagem relacional e afetiva para o juízo divino; suavizá-la eliminaria uma tensão genuína do texto.
- issue: Imagem ígnea do juízo divino
  choice: Preservar a sequência “se acendeu” e “não se apagará”
  alternative: Explicitar apenas que o castigo é certo ou irreversível
  rationale: A metáfora do fogo estrutura as duas orações e comunica a força do juízo sem exigir a importação de desenvolvimentos doutrinários posteriores.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a abertura causal do versículo, a metáfora tradicional das “obras das mãos” e a imagem de ira como fogo, evitando tanto arcaísmos quanto paráfrases doutrinárias.
