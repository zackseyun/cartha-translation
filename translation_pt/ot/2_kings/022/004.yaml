  text: עֲלֵ֗ה אֶל חִלְקִיָּ֨הוּ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְ/יַתֵּ֣ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה אֲשֶׁ֥ר אָסְפ֛וּ שֹׁמְרֵ֥י הַ/סַּ֖ף מֵ/אֵ֥ת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: pt
  text: Suba até Hilquias, o sumo sacerdote, e que ele faça a soma da prata que foi trazida à Casa de Yahweh e que os guardas da entrada[a] recolheram do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os guardas do limiar”; ou “os porteiros”.
    reason: Registra a forma concreta da expressão hebraica e sua alternativa funcional.
lexical_decisions:
- source_word: עֲלֵה
  choice: Suba
  rationale: O imperativo de עלה indica subir ou dirigir-se a um lugar mais elevado. “Suba” preserva de modo natural a nuance direcional.
- source_word: חִלְקִיָּהוּ
  choice: Hilquias
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: o sumo sacerdote
  rationale: Título consagrado em português para o principal ofício sacerdotal; expressa naturalmente o sentido da construção hebraica.
- source_word: וְיַתֵּם
  choice: e mande-o calcular o total
  rationale: O hifil de תמם, neste contexto administrativo, indica concluir a apuração ou soma dos recursos. A formulação portuguesa também preserva o valor volitivo da forma verbal.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: Mantém o referente literal do hebraico, embora a prata funcione aqui como dinheiro.
- source_word: הַמּוּבָא
  choice: que foi trazida
  rationale: Reproduz o particípio passivo de בוא como ação já realizada em relação à ordem dada.
- source_word: בֵּית יְהוָה
  choice: a Casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de Yahweh” sem substituí-la pelo termo interpretativo “templo”.
- source_word: אָסְפוּ
  choice: recolheram
  rationale: Verbo natural em português para a coleta de contribuições ou recursos provenientes do povo.
- source_word: שֹׁמְרֵי הַסַּף
  choice: os guardas da entrada
  rationale: Expressa com clareza a função dos responsáveis pelo limiar ou acesso do templo, enquanto a tradução mais literal é registrada em nota.
- source_word: מֵאֵת הָעָם
  choice: do povo
  rationale: Equivalente direto, claro e não restritivo da expressão hebraica.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Casa” recebe inicial maiúscula como designação do santuário, sem perder o sentido literal da expressão hebraica.
