base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: pt
  text: Josias tinha oito anos quando começou a reinar e reinou trinta e um anos em Jerusalém. O nome de sua mãe era Jedida, filha de Adaías, de Bozcate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: tinha oito anos
  rationale: A expressão hebraica de idade, literalmente “filho de oito anos”, é vertida pelo equivalente natural e preciso em português.
- source_word: בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção temporal indica a idade de Josias ao iniciar seu reinado.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה מָלַךְ
  choice: reinou trinta e um anos
  rationale: Preserva a duração exata e o sentido verbal de exercer a realeza, com ordem natural em português.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução locativa direta, que identifica a sede do reinado.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Mantém a fórmula genealógica hebraica em português claro e digno.
- source_word: יְדִידָה
  choice: Jedida
  rationale: Transliteração portuguesa convencional do nome pessoal hebraico.
- source_word: בַת עֲדָיָה
  choice: filha de Adaías
  rationale: Reproduz diretamente a relação filial e translitera o nome segundo o uso português.
- source_word: מִבָּצְקַת
  choice: de Bozcate
  rationale: O מִן indica origem; “de” expressa isso naturalmente no contexto genealógico. A forma do topônimo segue a tradição de transliteração portuguesa.
