  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: pt
  text: Mas Jeoseba, filha do rei Jorão e irmã de Acazias, pegou Joás, filho de Acazias, e o tirou às escondidas do meio dos filhos do rei que estavam sendo mortos, juntamente com sua ama[a], e os levou para o quarto de dormir[b]. Ali o esconderam[c] de Atalia, e ele não foi morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a mulher que o amamentava; também se pode traduzir por “ama de leite”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “quarto das camas” ou “câmara dos leitos”.'
    reason: lexical_alternative
  - marker: c
    text: 'O verbo hebraico está no plural: “o esconderam”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: pegou
  rationale: O verbo לקח é comum na narrativa hebraica. “Pegou” é natural em português e introduz sem exagero a ação de resgatar a criança.
- source_word: יְהוֹשֶׁבַע
  choice: Jeoseba
  rationale: Transliteração portuguesa corrente da forma do nome preservada em Reis.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: filha do rei Jorão
  rationale: Reproduz de modo claro a cadeia construta que identifica Jeoseba como filha de Jorão, mantendo o título real.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: irmã de Acazias
  rationale: אחות tem aqui seu sentido comum de “irmã”; a tradução não deve enfraquecer a relação familiar para harmonizá-la com outros dados genealógicos.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: o levou às escondidas
  rationale: גנב tem a ideia básica de furtar. No contexto do resgate, a expressão comunica tanto a retirada quanto seu caráter secreto, sem sugerir em português que Jeoseba cometeu um sequestro criminoso.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: para longe dos filhos do rei
  rationale: Expressa a retirada de Joás do meio do grupo dos filhos do rei, em português natural, sem substituir “filhos” pelo interpretativo “príncipes”.
- source_word: הַמּוּמָתִים
  choice: que estavam sendo mortos
  rationale: O particípio hofal de מות apresenta os filhos do rei como vítimas de uma ação de matar em andamento.
- source_word: מֵינִקְתּוֹ
  choice: sua ama
  rationale: Designa a mulher que amamentava e cuidava da criança. “Ama” é uma forma digna e concisa; a especificidade é esclarecida em nota.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: para o quarto de dormir
  rationale: Equivalente claro da expressão concreta “quarto dos leitos/camas”, evitando o sentido moderno potencialmente ambíguo de apenas “quarto”.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: o esconderam
  rationale: Mantém o verbo hebraico na terceira pessoa do plural, sem harmonizá-lo com o sujeito feminino singular das ações anteriores.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: de Atalia
  rationale: No contexto, מִפְּנֵי indica que Joás foi ocultado da presença e do alcance de Atalia.
- source_word: וְלֹא הוּמָת
  choice: assim, ele não foi morto
  rationale: Preserva a voz passiva de מות e apresenta naturalmente o resultado do esconderijo.
theological_decisions:
- issue: Possível harmonização da relação familiar de Jeoseba com Acazias
  choice: Manter “irmã de Acazias”
  alternative: Usar o termo mais amplo “parente de Acazias”
  rationale: O hebraico emprega o termo normal para “irmã”. Qualquer tentativa de resolver tensões com dados genealógicos paralelos caberia em comentário, não na tradução.
- issue: Sujeito plural de “esconderam”
  choice: Preservar o plural “o esconderam”
  alternative: Regularizar para o singular “ela o escondeu”
  rationale: A forma verbal massorética é plural e pode incluir Jeoseba e a ama ou outras pessoas presentes. Preservar o plural mantém a transparência ao texto e sua ambiguidade referencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente reorganizada para evitar uma frase excessivamente carregada, preservando a sequência narrativa e o plural textual de “esconderam”.
