revisions:
- from: Mas Jeoseba, filha do rei Jorão e irmã de Acazias, pegou Joás, filho de Acazias, e o levou às escondidas, junto com sua ama[a], para longe dos filhos do rei que estavam sendo mortos. Ela o levou para o quarto de dormir[b], e o esconderam[c] de Atalia; assim, ele não foi morto.
  to: Mas Jeoseba, filha do rei Jorão e irmã de Acazias, pegou Joás, filho de Acazias, e o tirou às escondidas do meio dos filhos do rei que estavam sendo mortos, juntamente com sua ama[a], e os levou para o quarto de dormir[b]. Ali o esconderam[c] de Atalia, e ele não foi morto.
  rationale: 'A revisão conserva todas as decisões lexicais defensáveis do rascunho, mas recompõe a cena segundo a sintaxe e a progressão do hebraico: Joás é retirado secretamente dentre os filhos ameaçados, sua ama o acompanha, ambos são levados ao quarto, e então o texto mantém o plural massorético no ato de escondê-lo. “E ele não foi morto” traduz diretamente o resultado expresso pela forma passiva final, sem tornar a relação causal mais explícita do que o necessário.'
  reviewer_model: gpt-5.6-terra
