base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: pt
  text: 'Então o sacerdote Joiada deu ordens aos comandantes de centenas encarregados do exército: “Levem-na para fora, por entre as fileiras[a], e matem à espada quem a seguir”. Pois o sacerdote havia dito: “Ela não deve ser morta na casa de Yahweh”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é difícil. Outras possibilidades são “para fora das fileiras” ou “até o espaço entre as fileiras”; provavelmente se refere a levá-la para fora através das fileiras organizadas dos guardas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: comandantes de centenas
  rationale: Preserva o título militar israelita sem introduzir o termo romano “centuriões”; “comandantes” é natural e digno em português atual.
- source_word: פְּקֻדֵי הַחַיִל
  choice: encarregados do exército
  rationale: Representa o particípio passivo de פקד, indicando homens designados ou encarregados em relação à força militar.
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: Levem-na para fora
  rationale: 'O hifil imperativo de יצא exige sentido causativo: fazer sair, levar para fora.'
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: para fora, por entre as fileiras
  rationale: A construção hebraica é difícil. No contexto, indica a retirada de Atalia do templo através das fileiras ordenadas dos guardas; a tradução conserva essa provável imagem militar sem fingir certeza absoluta.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: quem a seguir
  rationale: O particípio singular com artigo tem força genérica. “Seguir” mantém aberta tanto a ideia de ir atrás dela quanto a de aderir à sua causa.
- source_word: הָמֵת בֶּחָרֶב
  choice: matem à espada
  rationale: Transmite de modo direto a força imperativa da construção e preserva o instrumento explicitamente mencionado.
- source_word: אַל תּוּמַת
  choice: Ela não deve ser morta
  rationale: Expressa com clareza a proibição na forma passiva, mantendo Atalia como sujeito recuperado do contexto.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Conserva a expressão hebraica “casa”, que neste contexto designa o templo, e verte o nome divino explicitamente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Sentido de וְהַבָּא אַחֲרֶיהָ
  choice: quem a seguir
  alternative: quem vier atrás dela
  rationale: “Seguir” preserva a tensão entre deslocamento físico e possível lealdade política, sem restringir indevidamente o referente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso militar é direto, mas não coloquial. “Casa de Yahweh” preserva a forma hebraica tradicional, enquanto “exército” e “fileiras” tornam clara a cena sem acrescentar detalhes ausentes do texto.
