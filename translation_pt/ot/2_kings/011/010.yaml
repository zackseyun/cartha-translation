id: 2KI.11.10
reference: 2 Kings 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י ה/מאיות אֶֽת הַ/חֲנִית֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑ד אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: pt
  text: Então o sacerdote entregou aos comandantes de centenas as lanças[a] e os escudos que haviam pertencido ao rei Davi e estavam na casa de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a lança”. O singular pode ter sentido coletivo; por isso, “as lanças”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no templo de Yahweh”. Literalmente: “na casa de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Então ... entregou
  rationale: O wayyiqtol dá prosseguimento à narrativa. “Então” expressa naturalmente a sequência, e “entregou” se ajusta ao ato de pôr as armas nas mãos dos comandantes.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução direta do substantivo singular definido.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: aos comandantes de centenas
  rationale: Designa chefes militares de unidades de cem homens. A formulação conserva de perto a estrutura hebraica sem acrescentar “homens”, que está implícito.
- source_word: הַחֲנִית
  choice: as lanças
  rationale: Embora a forma hebraica seja singular, o contexto de distribuição de armamentos a vários comandantes e sua coordenação com “escudos”, no plural, favorecem o sentido coletivo.
- source_word: הַשְּׁלָטִים
  choice: os escudos
  rationale: Neste contexto de armamentos reais guardados no templo, “escudos” é a identificação mais bem sustentada do termo, embora haja incerteza lexical histórica.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: que haviam pertencido ao rei Davi
  rationale: A construção relativa com לְ expressa posse. O mais-que-perfeito comunica naturalmente que eram armas de Davi preservadas posteriormente.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Mantém a expressão hebraica concreta “casa de Yahweh”; “templo de Yahweh” é uma alternativa contextual explicada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio sem o substituir pelo título “Senhor”.
- issue: Singular morfológico ou sentido coletivo de הַחֲנִית
  choice: as lanças
  alternative: a lança
  rationale: O singular hebraico pode ter valor coletivo. A distribuição a vários comandantes e o paralelo com os escudos favorecem o plural em português, sem ocultar a forma literal, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se “comandantes de centenas” para refletir a organização militar do original, e “casa de Yahweh” para manter sua imagem concreta.
