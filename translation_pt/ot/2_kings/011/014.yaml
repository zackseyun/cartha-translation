source:
  edition: WLC
  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עֹמֵ֨ד עַֽל הָ/עַמּ֜וּד כַּ/מִּשְׁפָּ֗ט וְ/הַ/שָּׂרִ֤ים וְ/הַ/חֲצֹֽצְרוֹת֙ אֶל הַ/מֶּ֔לֶךְ וְ/כָל עַ֤ם הָ/אָ֨רֶץ֙ שָׂמֵ֔חַ וְ/תֹקֵ֖עַ בַּ/חֲצֹֽצְר֑וֹת וַ/תִּקְרַ֤ע עֲתַלְיָה֙ אֶת בְּגָדֶ֔י/הָ וַ/תִּקְרָ֖א קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: pt
  text: 'Ela olhou e eis que o rei estava em pé junto à coluna[a], como era o costume, com os oficiais e as trombetas junto do rei. Todo o povo da terra se alegrava e tocava as trombetas. Então Atalia rasgou as suas roupas e gritou: “Conspiração! Conspiração!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre a coluna” ou “à coluna”. A preposição hebraica admite mais de uma relação espacial neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “Traição! Traição!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Ela olhou e viu que
  rationale: Reproduz a percepção súbita e dramática da cena em português natural; evita o arcaísmo pouco corrente de uma tradução rígida de הִנֵּה como “e eis”.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: o rei estava em pé
  rationale: O particípio apresenta uma situação em curso; a forma progressiva e postural transmite isso com clareza.
- source_word: עַל הָעַמּוּד
  choice: junto à coluna
  rationale: Neste contexto cerimonial, עַל indica associação espacial com a coluna ou plataforma; “junto à” é natural sem excluir outra compreensão locativa.
- source_word: כַּמִּשְׁפָּט
  choice: conforme o costume
  rationale: מִשְׁפָּט designa aqui a prática estabelecida da cerimônia real, e não um julgamento judicial.
- source_word: וְהַשָּׂרִים
  choice: os oficiais
  rationale: שָׂרִים é um termo amplo para autoridades ou líderes; “oficiais” se ajusta ao contexto régio-militar sem especificar uma patente.
- source_word: וְהַחֲצֹצְרוֹת
  choice: os trombeteiros
  rationale: Embora a forma nomeie literalmente “as trombetas”, a coordenação com pessoas ao lado do rei e a ação posterior de tocá-las favorecem a metonímia pelos portadores ou tocadores.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao lado do rei
  rationale: A preposição expressa aqui proximidade e presença junto ao rei.
- source_word: כָל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Preserva a expressão hebraica tradicional, que neste contexto se refere à população ou assembleia do país.
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: se alegrava e tocava as trombetas
  rationale: Os singulares coletivos concordam com “povo”; a formulação comunica a celebração pública e o som cerimonial.
- source_word: וַתִּקְרַע ... אֶת בְּגָדֶיהָ
  choice: Atalia rasgou as próprias roupas
  rationale: Expressão moderna e clara para o gesto público de choque e aflição.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Conspiração! Conspiração!
  rationale: קֶשֶׁר denota uma conspiração ou complô contra a autoridade; a repetição enfática foi preservada.
theological_decisions:
- issue: Natureza da acusação de Atalia em קֶשֶׁר
  choice: Conspiração
  alternative: Traição
  rationale: “Conspiração” representa diretamente a alegação de um complô organizado e não define de antemão a legitimidade política ou moral dos envolvidos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A narrativa foi dividida em períodos para evitar uma cadeia excessivamente longa. “Atalia” segue a forma portuguesa corrente. Todos os marcadores de nota aparecem no texto principal.
