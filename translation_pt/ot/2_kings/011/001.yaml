base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: pt
  text: Atalia, mãe de Acazias, viu que seu filho estava morto; então se levantou e exterminou toda a descendência real[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “toda a semente do reino”, isto é, a linhagem ou os descendentes reais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה
  choice: Atalia
  rationale: O nome próprio é transliterado segundo a forma bíblica tradicional e corrente em português. O waw inicial não recebe um advérbio temporal que não esteja explicitamente no hebraico.
- source_word: אֵם אֲחַזְיָהוּ
  choice: mãe de Acazias
  rationale: A cadeia construta identifica Atalia por sua relação com Acazias; a formulação é clara e natural em português.
- source_word: וַתֵּרֶא כִּי מֵת בְּנָהּ
  choice: viu que seu filho estava morto
  rationale: A construção com ראה e כִּי expressa a percepção de um fato, e “estava morto” conserva o valor resultativo de מֵת.
- source_word: וַתָּקָם
  choice: então se levantou
  rationale: קום, na sequência narrativa, introduz uma ação decidida. “Então” comunica a progressão consequente sem tornar a relação mais causal do que o contexto permite.
- source_word: וַתְּאַבֵּד
  choice: exterminou
  rationale: A forma causativa/intensiva de אבד denota fazer perecer ou destruir; no contexto da eliminação da linhagem dinástica, “exterminou” transmite de modo natural a ação letal.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: toda a descendência real
  rationale: זֶרַע significa literalmente “semente”, mas aqui designa descendentes; הַמַּמְלָכָה dá à expressão seu sentido dinástico ou régio.
