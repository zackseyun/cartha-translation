  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: pt
  text: Ele ficou com ela na Casa do SENHOR, escondido durante seis anos, enquanto Atalia reinava sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית יְהוָה
  choice: Casa do SENHOR
  rationale: Traduz a expressão como designação do templo e representa o nome divino segundo a convenção portuguesa amplamente reconhecida, com SENHOR em versaletes.
- source_word: מִתְחַבֵּא
  choice: escondido
  rationale: O particípio reflexivo indica a situação contínua de permanecer oculto; em português, 'escondido' expressa isso de modo natural e preserva o foco contextual na proteção da criança.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: Mantém a formulação abrangente do hebraico sem restringi-la explicitamente a Judá ou ao país, preservando a referência contextual.
theological_decisions:
- issue: Representação do tetragrama יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção bíblica portuguesa tradicional e amplamente inteligível, sem acrescentar uma nota não exigida pelo versículo.
- issue: Relação temporal entre o esconderijo e o reinado de Atalia
  choice: enquanto Atalia reinava
  alternative: e Atalia reinava
  rationale: A conjunção hebraica permite coordenação, mas o contexto indica simultaneidade; 'enquanto' torna natural em português essa relação sem alterar o conteúdo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. 'Casa' recebe inicial maiúscula por funcionar aqui como designação específica do templo. O nome próprio é grafado 'Atalia', forma corrente em português.
