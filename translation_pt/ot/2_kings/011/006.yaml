  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: pt
  text: Um terço ficará no portão de Sur, e um terço no portão atrás dos corredores[a]. Vocês guardarão a casa, para impedir a entrada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos guardas” ou “da guarda real”; em hebraico, literalmente, “dos corredores”.
    reason: lexical_alternative
  - marker: b
    text: O sentido do termo hebraico é incerto; também pode significar “como barreira” ou “para defesa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: Um terço
  rationale: O ordinal feminino com artigo tem sentido distributivo no contexto e designa uma das três divisões da guarda. “Um terço” é natural em português.
- source_word: בְּשַׁעַר סוּר
  choice: junto ao Portão de Sur
  rationale: שַׁעַר significa “portão”, e סוּר é mais provavelmente um nome próprio. A transliteração “Sur” evita atribuir ao nome um sentido não demonstrado.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: junto ao portão atrás dos corredores
  rationale: אַחַר significa naturalmente “atrás de”, enquanto הָרָצִים significa literalmente “os corredores”. A formulação preserva a relação arquitetônica ambígua do hebraico.
- source_word: הָרָצִים
  choice: os corredores
  rationale: O particípio substantivado de רוץ significa literalmente “corredores”. Em contexto régio pode designar mensageiros ou membros da guarda real; essa possibilidade é registrada em nota sem ser imposta ao texto.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: Vocês montarão guarda
  rationale: A construção com o verbo שמר e o substantivo cognato משמרת enfatiza o dever de vigiar. “Montar guarda” comunica isso de modo natural e digno.
- source_word: הַבַּיִת
  choice: a casa
  rationale: בַּיִת significa literalmente “casa”. Embora no contexto possa indicar o palácio ou o complexo real, o texto não o especifica aqui.
- source_word: מַסָּח
  choice: para impedir a entrada
  rationale: O termo raro é de sentido incerto, mas parece indicar que a vigilância funcionaria como proteção ou impedimento de acesso. A tradução expressa essa provável função, e a incerteza é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. Mantiveram-se “casa” e “corredores” no texto principal para não resolver além da evidência as ambiguidades lexical e contextual; as possibilidades funcionais aparecem nas notas.
