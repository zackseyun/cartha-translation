  text: וַ/יַּעַמְד֨וּ הָ/רָצִ֜ים אִ֣ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֗/וֹ מִ/כֶּ֨תֶף הַ/בַּ֤יִת הַ/יְמָנִית֙ עַד כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/שְּׂמָאלִ֔ית לַ/מִּזְבֵּ֖חַ וְ/לַ/בָּ֑יִת עַל הַ/מֶּ֖לֶךְ סָבִֽיב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: pt
  text: Os guardas[a] ficaram em posição, cada um com suas armas na mão, desde o lado direito do templo até o lado esquerdo[b], junto ao altar e ao templo, ao redor do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os corredores”, isto é, a guarda real.
    reason: lexical_alternative
  - marker: b
    text: Em termos da orientação do templo, “desde o lado direito [...] até o lado esquerdo” também pode ser entendido como “desde o lado sul [...] até o lado norte”.
    reason: alternative_reading
lexical_decisions:
- source_word: הָרָצִים
  choice: os guardas[a]
  rationale: Embora o particípio derive literalmente de “correr”, neste contexto régio e militar designa os corredores que serviam como guarda armada. “Guardas” comunica com clareza a função; a nota preserva a forma mais literal.
- source_word: וַיַּעַמְדוּ
  choice: ficaram em posição
  rationale: O verbo significa literalmente “ficaram de pé”, mas aqui descreve guardas armados assumindo seus postos. A formulação portuguesa expressa naturalmente essa prontidão sem alterar a cena.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: cada um com suas armas na mão
  rationale: אִישׁ tem valor distributivo, e כְּלִי, no contexto de uma guarda armada, refere-se naturalmente a armas. O singular coletivo “na mão” conserva a expressão vívida do hebraico.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: desde o lado ... até o lado
  rationale: כָּתֵף significa literalmente “ombro”, mas em descrições arquitetônicas indica o lado ou flanco de uma construção.
- source_word: הַבַּיִת
  choice: o templo
  rationale: Embora o substantivo signifique literalmente “a casa”, neste contexto seu referente é inequivocamente o templo. “Templo” evita em português a impressão equivocada de uma residência comum.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: direito ... esquerdo[b]
  rationale: A tradução principal conserva os sentidos espaciais diretos “direito” e “esquerdo”; a nota registra a possível orientação sul–norte.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: junto ao altar e ao templo
  rationale: A preposição לְ pode indicar posição ou direção nesta descrição espacial condensada. “Junto a” comunica proximidade sem impor precisão indevida.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: ao redor do rei
  rationale: A expressão descreve o cerco protetor formado pelos guardas em torno do rei.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “templo” para explicitar o referente contextual de הַבַּיִת e evita o pouco natural “casa” nesse contexto. Mantém a ordem espacial e a imagem de prontidão militar do hebraico.
