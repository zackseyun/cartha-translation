source:
  edition: WLC
  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֔ה אֶת ק֥וֹל הָֽ/רָצִ֖ין הָ/עָ֑ם וַ/תָּבֹ֥א אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: pt
  text: Quando Atalia ouviu o barulho[b] dos guardas[a] e do povo, foi até o povo na casa de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “corredores”; provavelmente os membros da guarda real ou da escolta pessoal do rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “o som” ou “a voz” dos guardas e do povo.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o templo de Yahweh ou suas dependências.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: ouviu
  rationale: No encadeamento narrativo, שׁמע indica percepção auditiva simples; “ouviu” é a correspondência natural em português.
- source_word: עֲתַלְיָה
  choice: Atalia
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: קוֹל
  choice: barulho
  rationale: קוֹל pode significar “voz”, “som” ou “barulho”. Neste cenário público, com guardas e povo reunidos, “barulho” comunica melhor a agitação audível sem sugerir uma só voz.
- source_word: הָרָצִין
  choice: os guardas
  rationale: A forma derivada de רוץ significa literalmente “os corredores”, mas, em contexto régio, pode designar a guarda real. “Guardas” expressa com clareza sua função; a tradução literal é registrada em nota.
- source_word: הָעָם
  choice: o povo
  rationale: עָם é o termo comum para “povo” e, aqui, indica a população reunida sem precisar defini-la como mera multidão.
- source_word: וַתָּבֹא אֶל
  choice: foi até
  rationale: בוא com אֶל indica movimento em direção a alguém ou a um grupo. “Foi até” é natural em narrativa portuguesa a partir do ponto de vista externo da cena.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: A expressão significa literalmente “casa de Yahweh”. A formulação preserva a imagem hebraica, enquanto a nota esclarece que se trata do templo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título, sem ocultar em nota a identificação contextual do lugar como templo.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. A tradução mantém a expressão concreta “casa de Yahweh”, esclarecida em nota, e usa “guardas” no texto principal para comunicar a função provável de הָרָצִין.
