source:
  edition: WLC
  text: וּ/שְׁתֵּ֤י הַ/יָּדוֹת֙ בָּ/כֶ֔ם כֹּ֖ל יֹצְאֵ֣י הַ/שַּׁבָּ֑ת וְ/שָֽׁמְר֛וּ אֶת מִשְׁמֶ֥רֶת בֵּית יְהוָ֖ה אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: pt
  text: E as duas divisões dentre vocês[a] — todos os que saem de serviço no sábado[b] — deverão montar guarda na casa de Yahweh para proteger o rei.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “as duas mãos dentre vocês”; aqui, provavelmente, “as duas divisões” ou “as duas companhias”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os que saem no sábado”. No contexto, a expressão provavelmente se refere aos que encerravam seu turno quando ocorria a troca da guarda no sábado.'
    reason: alternative_reading
  - marker: c
    text: 'Ou, mais literalmente: “deverão manter a guarda da casa de Yahweh em direção ao rei” ou “com referência ao rei”. A preposição hebraica é difícil; no contexto, o sentido provável é guardar a casa de Yahweh a fim de proteger o rei.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת
  choice: as duas divisões
  rationale: A expressão significa literalmente “as duas mãos”, mas, neste contexto de organização da guarda, יָד designa um grupo, setor ou divisão. “Divisões” comunica o sentido sem conservar uma imagem opaca em português.
- source_word: בָּכֶם
  choice: dentre vocês
  rationale: A preposição com o pronome indica que as duas divisões pertencem ao grupo de guardas a quem se dirige a ordem.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: todos os que saem de serviço no sábado
  rationale: Literalmente, “todos os que saem no sábado”. No contexto da troca de turnos, refere-se aos guardas cujo período de serviço termina no sábado.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: deverão montar guarda
  rationale: O verbo e o substantivo cognato expressam a obrigação de guardar ou manter vigilância. “Deverão montar guarda” preserva a força diretiva e soa natural no contexto militar.
- source_word: בֵּית יְהוָה
  choice: na casa de Yahweh
  rationale: Mantém a expressão hebraica “casa de Yahweh”, clara no contexto e mais próxima do texto do que “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל הַמֶּלֶךְ
  choice: para proteger o rei
  rationale: A preposição אֶל é difícil nesta construção. O contexto indica que a guarda da casa de Yahweh é mantida em benefício da segurança do rei; a nota registra a formulação mais literal e sua ambiguidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o nome divino. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Relação entre a guarda da casa de Yahweh e o rei
  choice: para proteger o rei
  alternative: em direção ao rei; com referência ao rei; junto ao rei
  rationale: A narrativa trata da proteção de Joás, mas a preposição hebraica permanece incomum. A tradução principal comunica o sentido contextual provável, enquanto a nota preserva a dificuldade textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Montar guarda” preserva o cenário militar; os travessões mostram que “todos os que saem de serviço” explica quais são as duas divisões.
