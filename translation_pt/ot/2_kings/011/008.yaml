  text: וְ/הִקַּפְתֶּ֨ם עַל הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/שְּׂדֵר֖וֹת יוּמָ֑ת וִ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/צֵאת֥/וֹ וּ/בְ/בֹאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: pt
  text: Cerquem o rei por todos os lados, cada homem com suas armas na mão. Quem entrar nas fileiras[a] será morto. Fiquem com o rei quando ele sair e quando entrar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quem se aproximar das linhas/fileiras”. O termo hebraico provavelmente se refere às fileiras organizadas da guarda.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na sua saída e na sua entrada”, expressão que indica acompanhá-lo e protegê-lo em todos os seus movimentos.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם
  choice: Cerquem
  rationale: A forma causativa expressa a ordem de formar um cerco protetor. O imperativo em português transmite naturalmente a força do comando no contexto.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: o rei por todos os lados
  rationale: A combinação da preposição com סָבִיב descreve uma disposição ao redor do rei; “por todos os lados” conserva a ideia de proteção completa.
- source_word: אִישׁ
  choice: cada homem
  rationale: O singular tem valor distributivo e se refere individualmente aos guardas presentes.
- source_word: וְכֵלָיו בְּיָדוֹ
  choice: com suas armas na mão
  rationale: כְּלִי pode indicar objeto, instrumento ou arma; neste contexto militar, “armas” é o sentido mais provável. “Na mão” preserva a imagem hebraica em português natural.
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: Quem entrar nas fileiras
  rationale: O particípio com artigo tem sentido genérico. שְּׂדֵרוֹת provavelmente designa as fileiras organizadas da guarda, enquanto אֶל permite a noção de entrar ou avançar até elas; a nota preserva essa amplitude.
- source_word: יוּמָת
  choice: será morto
  rationale: O hofal expressa uma ação passiva determinada contra quem violar as fileiras. “Será morto” é claro, direto e mantém a força da ordem.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Fiquem com o rei
  rationale: A construção dá continuidade às ordens e היה אֶת indica presença ou acompanhamento; “fiquem com” comunica a função protetora sem explicá-la em excesso.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: quando ele sair e quando entrar
  rationale: Os infinitivos com sufixo descrevem a saída e a entrada do rei. A formulação é natural em português e conserva o paralelismo hebraico.
