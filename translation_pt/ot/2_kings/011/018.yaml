source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: pt
  text: Então todo o povo da terra foi à casa de Baal[a] e a demoliu. Despedaçaram completamente os altares e as imagens[b] de Baal e mataram Matã, sacerdote de Baal, diante dos altares. Depois, o sacerdote designou supervisores para a casa de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao templo de Baal”. O hebraico diz literalmente “à casa de Baal”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as estátuas” ou “os ídolos”.
    reason: lexical_alternative
  - marker: c
    text: Yahweh representa o nome divino escrito em hebraico com as consoantes YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Preserva a expressão sociopolítica recorrente em Reis sem restringi-la, de modo interpretativo, às pessoas comuns.
- source_word: בֵּית הַבַּעַל
  choice: a casa de Baal
  rationale: Reproduz o substantivo hebraico בַּיִת e mantém o contraste verbal com a casa de Yahweh no fim do versículo; uma nota esclarece a tradução contextual possível, “templo”.
- source_word: וַיִּתְּצֻהוּ
  choice: e a demoliu
  rationale: O verbo indica derrubar uma construção. “Demoliu” é natural, conciso e distingue a destruição do edifício do despedaçamento dos objetos cultuais.
- source_word: מזבחתו
  choice: os altares ... de Baal
  rationale: A forma consonantal e o contexto apontam para altares associados a Baal. Repetir “de Baal” em português evita a possível ambiguidade de “seus”, que poderia remeter ao povo.
- source_word: צְלָמָיו
  choice: as imagens de Baal
  rationale: “Imagens” conserva a amplitude do termo, que pode designar representações ou estátuas cultuais, sem antecipar a opção interpretativa “ídolos”.
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: despedaçaram completamente
  rationale: Expressa tanto a ação violenta de quebrar quanto a força intensificadora de הֵיטֵב.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: Matã, sacerdote de Baal
  rationale: Identifica de maneira direta e natural o indivíduo e sua função cultual.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: diante dos altares
  rationale: Mantém o sentido espacial normal da preposição hebraica sem especificar além do texto.
- source_word: וַיָּשֶׂם הַכֹּהֵן פְּקֻדּוֹת
  choice: o sacerdote designou encarregados
  rationale: No contexto administrativo, a construção indica o estabelecimento de pessoas ou funções de supervisão. “Designou encarregados” comunica isso em português corrente, embora o substantivo hebraico admita outras nuances.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém “casa”, em paralelo com a casa de Baal, e translitera o nome divino expresso no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo por um título; a nota informa a tradição gráfica sem impor uma leitura denominacional.
- issue: Referente dos sufixos em “seus altares e suas imagens”
  choice: de Baal
  alternative: seus altares e suas imagens; os altares e as imagens do templo
  rationale: Os sufixos masculinos singulares se referem naturalmente a Baal ou ao complexo cultual dele. A repetição explícita do nome em português evita que o possessivo seja entendido como referente ao povo, sem decidir entre Baal e sua casa mais do que o contexto permite.
- issue: Sentido de פְּקֻדּוֹת na organização da casa de Yahweh
  choice: encarregados
  alternative: funções de supervisão; guardas; supervisores
  rationale: A palavra pode indicar encargos, supervisão ou pessoas incumbidas. O contexto favorece responsáveis designados, mas a tradução evita especificar que eram exclusivamente guardas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa direta. “Casa” foi mantido nos dois polos cultuais para preservar o contraste literário hebraico; “demoliu” e “despedaçaram” distinguem a destruição da construção da quebra dos objetos. O nome Matã segue a forma portuguesa baseada no hebraico מַתָּן.
