    reason: alternative_reading
  revision_rationale: A revisão limita-se à fórmula de pertença pactual e à nota correspondente. «Um povo de Javé» é uma formulação portuguesa natural que transmite o valor relacional de לְעָם לַיהוָה; a nota preserva a construção hebraica mais literal. A repetição de «entre ... e entre ...» e o advérbio «também» mantêm clara a segunda relação de aliança no versículo.
