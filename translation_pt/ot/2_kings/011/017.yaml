base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: pt
  text: Então Joiada fez a aliança[a] entre Javé, o rei e o povo, para serem um povo de Javé[b], e também entre o rei e o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, «cortou a aliança», expressão usual que significa «fez a aliança».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «para serem um povo para Javé».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: fez
  rationale: A expressão כרת ברית é uma fórmula hebraica que, literalmente, significa «cortar uma aliança», mas em português corrente equivale a «fazer uma aliança».
- source_word: הַבְּרִית
  choice: a aliança
  rationale: O artigo definido foi preservado, e «aliança» mantém o peso formal, relacional e religioso de בְּרִית.
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega-se a forma portuguesa corrente do nome divino, em vez de substituí-lo por um título.
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: entre Javé, o rei e o povo
  rationale: A formulação portuguesa apresenta com clareza as três partes da aliança, sem reproduzir de modo artificial a repetição hebraica de בֵּין.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: para que fossem um povo para Javé
  rationale: A construção expressa o propósito da aliança e conserva a formulação relacional do hebraico, sem transformá-la diretamente em uma expressão possessiva.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: e também entre o rei e o povo
  rationale: «Também» ajuda a distinguir a relação pactual adicional entre o rei e o povo, já presente na estrutura hebraica.
- source_word: הָעָם
  choice: o povo
  rationale: É a designação coletiva mais direta e natural para a comunidade envolvida na aliança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Javé
  alternative: SENHOR
  rationale: A tradução conserva o nome pessoal de Deus na forma tradicionalmente adaptada ao português, mantendo sua ressonância pactual.
- issue: Sentido da fórmula לִהְיוֹת לְעָם לַיהוָה
  choice: um povo para Javé
  alternative: o povo de Javé
  rationale: A opção principal preserva mais de perto a construção relacional hebraica; a alternativa possessiva expressa corretamente o pertencimento implícito, mas interpreta a forma de maneira mais explícita.
translation_notes:
  register: Português moderno, claro e solene, com nomes bíblicos em formas correntes no uso lusófono. A sintaxe foi suavizada para leitura natural, preservando a estrutura das duas relações pactuais e a ambiguidade da fórmula de pertencimento.
