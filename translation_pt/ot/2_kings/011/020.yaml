base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: pt
  text: Todo o povo da terra se alegrou, e a cidade ficou tranquila. Quanto a Atalia, mataram-na à espada na casa do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «no palácio real». Literalmente, «na casa do rei».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: se alegrou
  rationale: Expressa diretamente a alegria coletiva indicada por שׂמח, em português natural e digno.
- source_word: כָּל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Preserva a expressão hebraica e sua possível dimensão sociopolítica, sem reduzi-la simplesmente a 'todos'.
- source_word: הָעִיר שָׁקָטָה
  choice: a cidade ficou tranquila
  rationale: שׁקט descreve a cessação da agitação; 'ficou tranquila' comunica naturalmente a mudança de estado no contexto narrativo.
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: Quanto a Atalia
  rationale: A topicalização reproduz a posição destacada do objeto com אֵת, marcando a mudança de foco para Atalia.
- source_word: הֵמִיתוּ
  choice: mataram-na
  rationale: Verte o hifil de מות de modo direto e natural, sem acrescentar a ideia mais específica de uma execução judicial formal.
- source_word: בַחֶרֶב
  choice: à espada
  rationale: Expressão portuguesa corrente que preserva a espada como instrumento da morte.
- source_word: בֵּית מלך
  choice: junto ao palácio real
  rationale: O hebraico compacto significa literalmente 'casa do rei'; 'palácio real' é o equivalente contextual mais claro, enquanto 'junto a' evita afirmar com excessiva precisão que a morte ocorreu dentro do edifício.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A topicalização 'Quanto a Atalia' conserva a ênfase sintática do hebraico; 'palácio real' esclarece idiomaticamente 'casa do rei', e a nota registra a incerteza locativa.
