base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: pt
  text: Assim, os comandantes de centenas fizeram tudo conforme o sacerdote Joiada havia ordenado. Cada um tomou os seus homens[a], tanto os que entravam de serviço no sábado como os que saíam de serviço no sábado, e foram até o sacerdote Joiada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomou os seus homens, os que entravam no sábado e os que saíam no sábado”. O hebraico pode ser traduzido de modo mais literal, mas o contexto indica provavelmente os turnos que entravam e saíam de serviço.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: os comandantes de centenas
  rationale: Designa chefes militares de unidades de cem; a formulação preserva a estrutura militar do hebraico com clareza.
- source_word: כְּכֹל אֲשֶׁר
  choice: tudo conforme
  rationale: Expressa conformidade completa com a ordem e soa natural em português.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O verbo indica uma ordem dada com autoridade; o mais-que-perfeito composto torna clara a anterioridade no fluxo narrativo.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: Cada um reuniu os seus homens
  rationale: אִישׁ tem sentido distributivo, referindo-se individualmente a cada comandante. 'Reuniu' comunica que cada um tomou consigo os homens sob seu comando.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: os que entravam de serviço no sábado
  rationale: No contexto da guarda do templo, a expressão provavelmente designa o turno que começava seu serviço no sábado.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: os que saíam de serviço no sábado
  rationale: Em paralelo com בָּאֵי הַשַּׁבָּת, provavelmente designa o turno cujo serviço terminava no sábado.
- source_word: עִם
  choice: tanto ... como
  rationale: Expressa de modo natural que os dois grupos foram reunidos, preservando a relação inclusiva do hebraico.
- source_word: וַיָּבֹאוּ אֶל
  choice: e foram até
  rationale: O verbo narrativo descreve o deslocamento até Joiada; em português, 'foram até' é natural a partir da perspectiva do narrador.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução direta do título que identifica o ofício de Joiada.
