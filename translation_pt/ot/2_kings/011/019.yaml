  source_fidelity: 'O texto preserva adequadamente a sequência e as mudanças de sujeito do hebraico: Joiada reúne os grupos, o grupo faz o rei descer da Casa de Yahweh, seguem pelo portão associado aos corredores e o rei se senta no trono. “Fizeram o rei descer” representa bem a forma causativa plural, sem transformar indevidamente a ação em mera escolta. O plural de “trono dos reis” é mantido.'
  naturalness: O português é moderno, claro e de registro bíblico sóbrio. “Tomou consigo” é uma solução idiomática aceitável para o verbo inicial no contexto de reunir os grupos. A repetição explícita de “o rei” na última oração favorece a clareza. “Portão dos Corredores” é compreensível, e a nota esclarece o uso técnico provável de “corredores”.
  terminology: “Yahweh” corresponde diretamente ao Tetragrama. “Chefes de cem” evita o anacronismo de “centuriões”. “Caritas” translitera prudentemente o termo hebraico incerto, enquanto a nota registra alternativas sem decidir a questão. “Todo o povo da terra” conserva a expressão tradicional e sua amplitude semântica.
