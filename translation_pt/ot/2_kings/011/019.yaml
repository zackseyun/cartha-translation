id: 2KI.11.19
reference: 2 Kings 11:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: pt
  text: Então ele tomou consigo os chefes de cem, os caritas[a], os corredores[b] e todo o povo da terra. Eles fizeram o rei descer da Casa de Yahweh e, passando pelo Portão dos Corredores, chegaram à casa do rei. E o rei sentou-se no trono dos reis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os queretitas” ou “a guarda pessoal”. O termo hebraico é incerto.
    reason: alternative_reading
  - marker: b
    text: “Os corredores” provavelmente eram guardas reais ou mensageiros; o mesmo termo aparece no nome “Portão dos Corredores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ele tomou consigo
  rationale: O verbo no singular retoma naturalmente Joiada como sujeito. “Tomou consigo” expressa de modo idiomático que ele reuniu e levou os grupos mencionados, sem perder o sentido básico do hebraico.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: os chefes de cem
  rationale: Preserva a organização militar expressa no hebraico sem importar o termo romano “centuriões”. “Chefes” é claro e natural em português.
- source_word: הַכָּרִי
  choice: os caritas
  rationale: O termo hebraico é incerto. A transliteração evita decidir indevidamente se se trata de um grupo étnico específico ou de uma função militar; as principais alternativas são registradas em nota.
- source_word: הָרָצִים
  choice: os corredores
  rationale: Mantém a imagem concreta do hebraico, literalmente “os que correm”. No contexto real, provavelmente designa guardas ou mensageiros oficiais, possibilidade explicada em nota.
- source_word: כָּל עַם הָאָרֶץ
  choice: todo o povo da terra
  rationale: Conserva a expressão hebraica tradicional sem restringi-la indevidamente aos plebeus nem ampliá-la explicitamente a toda a nação.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: Eles fizeram o rei descer
  rationale: O verbo passa ao plural, tendo o grupo reunido como sujeito, e a forma causativa indica que conduziram o rei para baixo, do complexo do templo em direção ao palácio.
- source_word: מִבֵּית יְהוָה
  choice: da Casa de Yahweh
  rationale: “Casa” preserva o termo hebraico e seu paralelo com a “casa do rei”; Yahweh translitera o nome divino presente no texto.
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: passando pelo Portão dos Corredores
  rationale: Expressa naturalmente a rota indicada por דֶּרֶךְ e mantém a designação literal do portão ligada ao corpo dos “corredores”.
- source_word: בֵּית הַמֶּלֶךְ
  choice: à casa do rei
  rationale: A tradução literal conserva o paralelo deliberado com a Casa de Yahweh, embora “palácio real” seja uma alternativa idiomática.
- source_word: וַיֵּשֶׁב
  choice: E o rei sentou-se
  rationale: O sujeito nominal é repetido em português para evitar ambiguidade após a sequência de verbos no plural; o ato de sentar-se no trono comunica a entronização.
- source_word: עַל כִּסֵּא הַמְּלָכִים
  choice: no trono dos reis
  rationale: Mantém o plural hebraico, provavelmente referente ao trono dinástico ocupado pelos reis de Judá, sem reduzi-lo simplesmente a “trono real”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e corresponde à transliteração adotada, sem substituí-lo por “SENHOR”.
- issue: Sentido de כִּסֵּא הַמְּלָכִים
  choice: trono dos reis
  alternative: trono real
  rationale: O plural é mantido para preservar a possível ênfase na continuidade dinástica, sem decidir além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura foi dividida em três frases para clareza, preservando as mudanças de sujeito do hebraico. “Casa de Yahweh” e “casa do rei” mantêm o paralelismo lexical; as maiúsculas em “Casa de Yahweh” e “Portão dos Corredores” sinalizam designações específicas.
