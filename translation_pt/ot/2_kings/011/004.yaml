source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: pt
  text: No sétimo ano, Joiada mandou buscar os comandantes de centenas, os caritas[a] e os corredores[b], e os trouxe para junto de si, na Casa de Yahweh. Ali fez uma aliança com eles e os pôs sob juramento, na Casa de Yahweh. Depois lhes mostrou o filho do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quereteus”. O termo hebraico provavelmente designa uma unidade da guarda real, mas sua identificação exata é incerta.
    reason: alternative_reading
  - marker: b
    text: “Corredores” era provavelmente uma designação de guardas reais ou mensageiros da corte.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: No sétimo ano
  rationale: Expressa naturalmente em português a indicação temporal do hebraico; a conjunção inicial não precisa ser reproduzida de modo mecânico.
- source_word: שָׁלַח וַיִּקַּח
  choice: mandou buscar
  rationale: Reproduz de modo idiomático a sequência hebraica “enviou e tomou”, indicando que Joiada providenciou que os oficiais fossem trazidos, sem acrescentar um objeto não expresso.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: comandantes de centenas
  rationale: Mantém a estrutura militar do título e evita o termo “centuriões”, que poderia sugerir indevidamente o contexto romano.
- source_word: לַכָּרִי
  choice: os caritas
  rationale: Preserva a designação do grupo conforme o texto massorético, sem definir além da evidência sua origem ou função; a identificação alternativa é registrada em nota.
- source_word: וְלָרָצִים
  choice: e os corredores
  rationale: Conserva o sentido lexical literal e a antiga designação da unidade da corte; sua provável função é esclarecida em nota.
- source_word: וַיָּבֵא אֹתָם אֵלָיו
  choice: e os trouxe para junto de si
  rationale: Comunica claramente que Joiada os levou à sua própria presença.
- source_word: בֵּית יְהוָה
  choice: Casa de Yahweh
  rationale: Preserva a expressão hebraica “Casa de Yahweh”, referência ao templo, e mantém o nome divino.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: fez uma aliança com eles
  rationale: Traduz de forma idiomática a expressão hebraica “cortar uma aliança”, conservando seu peso solene, político e religioso.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: os pôs sob juramento
  rationale: 'Expressa o sentido causativo: Joiada os obrigou formalmente a jurar.'
- source_word: וַיַּרְא אֹתָם אֶת בֶּן הַמֶּלֶךְ
  choice: lhes mostrou o filho do rei
  rationale: É a formulação portuguesa direta para o ato de apresentar ou revelar o príncipe aos oficiais.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” representa o nome pessoal da aliança sem substituí-lo por um título.
- issue: Natureza de בְּרִית no contexto
  choice: aliança
  alternative: acordo; pacto
  rationale: “Aliança” preserva tanto a formalidade política quanto a solenidade religiosa do compromisso, sem especificar cláusulas que o versículo não apresenta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa foi levemente reorganizada para fluência, sem eliminar a repetição enfática de “Casa de Yahweh”. Os marcadores foram posicionados junto aos termos que efetivamente explicam.
