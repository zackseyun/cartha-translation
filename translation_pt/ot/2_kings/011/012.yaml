base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: pt
  text: 'Então ele trouxe para fora o filho do rei, colocou sobre ele a coroa e deu-lhe o testemunho[a]. Eles o fizeram rei e o ungiram; depois bateram palmas e disseram: “Viva o rei!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o documento da aliança” ou “o decreto”. O hebraico traz “o testemunho”, provavelmente em referência a um documento escrito associado ao governo do rei.
    reason: Alternativa lexical e esclarecimento da ambiguidade contextual de הָעֵדוּת.
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: trouxe para fora
  rationale: O hifil de יצא expressa fazer sair ou trazer para fora; a formulação preserva o sentido causativo e é clara em português.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: o filho do rei
  rationale: Reproduz de modo natural e direto a cadeia construta hebraica.
- source_word: הַנֵּזֶר
  choice: a coroa
  rationale: No contexto régio, נֵזֶר designa o emblema da realeza; “coroa” é mais corrente e acessível do que “diadema”.
- source_word: הָעֵדוּת
  choice: o Testemunho
  rationale: Mantém o sentido lexical amplo de “testemunho” sem definir de maneira indevida qual documento ou objeto estava ligado à entronização.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: Eles o fizeram rei
  rationale: O hifil de מלך significa constituir alguém rei ou fazê-lo reinar; a tradução evita confundir esse ato com a colocação da coroa, já mencionada.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: o ungiram
  rationale: “Ungir” é a tradução corrente e precisa de משׁח no contexto da consagração régia.
- source_word: וַיַּכּוּ כָף
  choice: bateram palmas
  rationale: Equivale naturalmente ao idiomatismo hebraico de bater palma/mão como aclamação pública.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Viva o rei!
  rationale: É a fórmula portuguesa natural de aclamação que preserva a força jussiva da expressão hebraica.
theological_decisions:
- issue: Sentido de הָעֵדוּת na cerimônia de entronização
  choice: Testemunho no texto principal
  alternative: documento da aliança; decreto
  rationale: O termo talvez indique um documento escrito que testemunhava as obrigações régias ou da aliança, mas o hebraico não o especifica. A tradução principal conserva essa abertura sem impor uma identificação institucional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Trouxe para fora” explicita o movimento causativo; “Viva o rei!” reproduz a aclamação régia de modo idiomático. A inicial maiúscula em “Testemunho” sinaliza que se trata de algo definido no rito sem resolver sua natureza exata.
