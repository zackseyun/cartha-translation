    issue: 'Formulação da nota: “provavelmente uma testemunha escrita”'
    rationale: A expressão portuguesa é imprecisa e pode apresentar o documento como uma pessoa/entidade que testemunha. O sentido pretendido é o de um possível documento escrito associado ao reinado.
