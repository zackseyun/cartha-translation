  source_fidelity: 'A tradução transmite adequadamente a sequência da entronização: a apresentação do filho do rei, a coroa, a entrega do objeto/documento chamado הָעֵדוּת, a proclamação régia, a unção e a aclamação pública. Contudo, a maiúscula em “Testemunho” sugere indevidamente um título técnico definido, ausente do hebraico.'
  naturalness: O texto é claro e de registro apropriado. “Trouxe para fora” é compreensível, mas “trouxe para fora” pode ser mantido por equivalência formal; “deu-lhe o testemunho” é mais direto do que “lhe entregou o Testemunho”.
  terminology: “Coroa”, “ungiram” e “Viva o rei!” são escolhas naturais e fiéis. “Testemunho” deve permanecer em minúscula para conservar a indeterminação lexical do hebraico. A explicação da nota deve falar de possível documento escrito, não de uma “testemunha escrita”, expressão que altera e torna impreciso o referente.
