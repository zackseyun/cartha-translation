lexical_decisions:
- source_word: וַיְצַוֵּם
  choice: Então ele lhes ordenou
  rationale: O piel de צוה expressa uma ordem com autoridade. “Então” liga naturalmente a ação à narrativa, sem acrescentar conteúdo substantivo.
- source_word: לֵאמֹר זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: Façam o seguinte
  rationale: Reproduz de maneira natural e digna a fórmula hebraica de introdução da instrução, preservando sua força imperativa.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: um terço de vocês
  rationale: É a expressão portuguesa corrente para a fração coletiva indicada no hebraico.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: que entram de serviço no sábado
  rationale: O particípio de בוא descreve os que entram no turno por ocasião da troca da guarda no sábado. “Entram de serviço” torna explícito o sentido contextual sem identificar um horário não declarado.
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: ficará de guarda
  rationale: A construção idiomática hebraica designa o exercício da vigilância. O singular concorda naturalmente em português com o coletivo “um terço”.
- source_word: בֵּית הַמֶּלֶךְ
  choice: palácio real
  rationale: Embora a expressão signifique literalmente “casa do rei”, neste contexto ela designa o palácio ou complexo real; a forma literal é preservada em nota.
