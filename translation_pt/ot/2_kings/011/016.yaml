  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: pt
  text: Então eles a agarraram[a], e ela foi pelo caminho da entrada dos cavalos do palácio real[b]; ali foi morta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “puseram as mãos sobre ela”. Também pode ser traduzido como “eles a prenderam”. Algumas traduções entendem a expressão como “abriram caminho para ela”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a entrada dos cavalos” e “a casa do rei”. Provavelmente se refere à via de acesso ou entrada usada pelos cavalos na área do palácio; o hebraico não exige que fosse especificamente um portão.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: eles a agarraram
  rationale: O hebraico diz literalmente que 'puseram mãos nela'. No contexto de prisão e execução, a expressão comunica que a agarraram; a formulação portuguesa é clara e natural.
- source_word: וַתָּבֹא
  choice: ela seguiu
  rationale: O verbo בוא descreve aqui o deslocamento de Atalia para fora do recinto do templo, em direção ao palácio. 'Seguiu' preserva a voz ativa sem sugerir, como faria 'foi levada', uma passiva ausente no hebraico.
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: pelo caminho da entrada dos cavalos
  rationale: A tradução mantém tanto a ideia de trajeto em דֶּרֶךְ quanto a de entrada em מְבוֹא, sem especificar indevidamente que se tratava de um portão.
- source_word: בֵּית הַמֶּלֶךְ
  choice: palácio real
  rationale: Embora a expressão seja literalmente 'casa do rei', neste contexto designa o palácio ou complexo real. 'Palácio real' é natural e inequívoco em português moderno.
- source_word: וַתּוּמַת
  choice: foi morta
  rationale: 'A forma Hofal de מות é passiva e causativa: ela foi feita morrer. ''Foi morta'' expressa isso diretamente; o contexto deixa claro que se trata de execução.'
- source_word: שָׁם
  choice: ali
  rationale: O advérbio retoma naturalmente em português o lugar indicado imediatamente antes.
