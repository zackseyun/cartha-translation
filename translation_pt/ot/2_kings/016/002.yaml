id: 2KI.16.2
reference: 2 Kings 16:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: pt
  text: Acaz tinha vinte anos quando começou a reinar e reinou dezesseis anos em Jerusalém. Não fez o que era certo aos olhos de Yahweh, seu Deus, como havia feito Davi, seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto régio, “pai” significa antepassado ou ancestral dinástico, não pai imediato.
    reason: Nota cultural e genealógica que esclarece o alcance de אָבִיו sem eliminar a formulação do texto-fonte.
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: tinha vinte anos
  rationale: Expressa em português natural o idiomatismo hebraico usado para indicar a idade.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção marca o momento em que Acaz assumiu o reinado.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: e reinou dezesseis anos
  rationale: Preserva a força verbal de מָלַךְ e a fórmula régia do texto.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Uso locativo direto, indicando a sede do reinado.
- source_word: וְלֹא עָשָׂה הַיָּשָׁר
  choice: Não fez o que era certo
  rationale: Tradução idiomática da fórmula de avaliação moral recorrente em Reis.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém de modo claro e natural a imagem hebraica de avaliação segundo a perspectiva de alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו
  choice: seu Deus
  rationale: Preserva o sufixo masculino singular, que se refere a Acaz, e a formulação relacional do hebraico.
- source_word: כְּדָוִד אָבִיו
  choice: como havia feito Davi, seu pai
  rationale: Retém a linguagem de parentesco do original e explicita naturalmente em português a ação subentendida na comparação; neste contexto, “pai” designa um antepassado dinástico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido de “Davi, seu pai”
  choice: manter “pai” no texto e esclarecer seu sentido em nota
  alternative: Davi, seu antepassado
  rationale: אָבִיו pode designar um ancestral dinástico no contexto régio. A tradução conserva a expressão hebraica, enquanto a nota evita que ela seja entendida como referência ao pai imediato de Acaz.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a concisão da avaliação régia hebraica e mantém a imagem “aos olhos de”.
