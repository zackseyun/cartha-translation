base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: pt
  text: No décimo sétimo ano de Peca, filho de Remalias, Acaz, filho de Jotão, rei de Judá, começou a reinar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: No décimo sétimo ano
  rationale: A fórmula cronológica de reinado emprega ב com שְׁנַת e o numeral em sentido ordinal. A expressão portuguesa é natural e preserva a referência ao ano régio.
- source_word: לְפֶקַח בֶּן רְמַלְיָהוּ
  choice: de Peca, filho de Remalias
  rationale: A preposição ל identifica o rei cujo ano de reinado está sendo contado; a relação patronímica é mantida de modo claro em português.
- source_word: מָלַךְ
  choice: começou a reinar
  rationale: Nesta fórmula régia, o qatal de מלך indica a ascensão ao trono, e não toda a duração do reinado.
- source_word: אָחָז בֶּן יוֹתָם
  choice: Acaz, filho de Jotão
  rationale: Adota as formas portuguesas tradicionais e amplamente reconhecidas dos nomes, preservando o patronímico.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: O título em aposição identifica Acaz e é vertido com concisão natural em português.
