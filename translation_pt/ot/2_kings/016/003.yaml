  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: pt
  text: Ele andou no caminho dos reis de Israel e até fez seu filho passar pelo fogo[a], seguindo as práticas abomináveis das nações que Yahweh havia expulsado de diante dos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofereceu seu filho no fogo”. O hebraico diz literalmente “fez seu filho passar pelo fogo”, expressão associada a um rito pagão condenado.'
    reason: Leitura alternativa que explicita a possível referência a sacrifício infantil sem impor essa interpretação ao texto principal.
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: andou no caminho
  rationale: A combinação de הלך com בְּדֶרֶךְ descreve a conduta ou o modo de viver. A tradução preserva a metáfora hebraica e permanece clara em português.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: reis de Israel
  rationale: Construção genitiva direta que se refere aos governantes do reino do norte como modelo moral negativo.
- source_word: וְגַם
  choice: e até
  rationale: 'גַּם tem aqui força enfática e crescente: além de seguir o padrão dos reis de Israel, ele praticou ainda este grave rito.'
- source_word: אֶת־בְּנוֹ
  choice: seu filho
  rationale: Mantém o objeto no singular e o sufixo possessivo do hebraico.
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: fez seu filho passar pelo fogo
  rationale: Preserva a expressão hebraica convencional associada a um rito pagão condenado, sem definir além do texto se ela descreve especificamente sacrifício consumado ou outro rito com fogo.
- source_word: כְּתֹעֲבוֹת
  choice: seguindo as práticas abomináveis
  rationale: A preposição כְּ indica conformidade ou imitação. A formulação natural em português comunica que a conduta dele reproduzia atos considerados detestáveis, embora explicite 'práticas' como substantivo contextual.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: No contexto histórico, refere-se aos povos não israelitas da terra; 'nações' é uma tradução neutra e direta.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: que ... havia expulsado
  rationale: O verbo הורישׁ, neste contexto, indica retirar os habitantes da terra ou desapossá-los. O mais-que-perfeito composto situa naturalmente a expulsão antes da conduta narrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִפְּנֵי
  choice: de diante de
  rationale: Conserva a imagem espacial da expulsão da presença dos israelitas e é inteligível em registro bíblico digno.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a forma da expressão hebraica, um etnônimo pactual tradicional, sem reduzi-la simplesmente a 'israelitas'.
theological_decisions:
- issue: Se הֶעֱבִיר בָּאֵשׁ deve ser traduzido como sacrifício explícito de uma criança ou pela expressão hebraica mais literal
  choice: Manter no texto principal a expressão “fez seu filho passar pelo fogo”
  alternative: “ofereceu seu filho no fogo” ou “queimou seu filho no fogo”
  rationale: O contexto condena inequivocamente um rito pagão, mas a expressão hebraica, por si só, não especifica todos os detalhes rituais. Preservar o idioma mantém a ambiguidade genuína, enquanto a nota apresenta a interpretação mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a metáfora de andar em um caminho e o nome divino Yahweh; 'práticas abomináveis' torna natural a referência às תֹעֲבוֹת sem enfraquecer sua forte avaliação moral.
