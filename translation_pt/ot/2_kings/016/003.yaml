  terminology: «Yahweh», «reis de Israel», «nações» e «filhos de Israel» são consistentes com as escolhas lexicais e com o registro do projeto. A nota preserva a ambiguidade do hebraico e identifica a leitura sacrificial apenas como alternativa, sem a impor ao texto principal.
