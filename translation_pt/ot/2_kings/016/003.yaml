  source_fidelity: 'O texto conserva adequadamente a progressão do hebraico: seguir o padrão dos reis de Israel, e ainda fazer o filho passar pelo fogo, em conformidade com as abominações das nações expulsas por Yahweh. Mantém o singular «seu filho», a metáfora de «andar no caminho», o nome divino Yahweh e a formulação deliberadamente não conclusiva do rito com fogo.'
