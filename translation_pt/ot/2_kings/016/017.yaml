  text: וַ/יְקַצֵּץ֩ הַ/מֶּ֨לֶךְ אָחָ֜ז אֶת הַ/מִּסְגְּר֣וֹת הַ/מְּכֹנ֗וֹת וַ/יָּ֤סַר מֵֽ/עֲלֵי/הֶם֙ ו/את הַ/כִּיֹּ֔ר וְ/אֶת הַ/יָּ֣ם הוֹרִ֔ד מֵ/עַ֛ל הַ/בָּקָ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁ֣ר תַּחְתֶּ֑י/הָ וַ/יִּתֵּ֣ן אֹת֔/וֹ עַ֖ל מַרְצֶ֥פֶת אֲבָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: pt
  text: Então o rei Acaz cortou as molduras dos suportes e retirou deles a bacia. Também tirou o Mar[a] de cima dos bois de bronze[b] que estavam debaixo dele e o colocou sobre um pavimento de pedras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Mar” era o nome da grande bacia feita para o templo de Salomão (ver 1 Reis 7:23–26).
    reason: cross_reference
  - marker: b
    text: Ou “os touros de bronze”. O termo hebraico pode referir-se de modo geral a bovinos; “bois” é a tradução tradicional neste contexto do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: cortou
  rationale: O verbo קצץ indica cortar ou retirar mediante corte; “cortou” é direto e natural, sem especificar além do hebraico como se deu o desmonte.
- source_word: הַמִּסְגְּרוֹת
  choice: as molduras
  rationale: מִסְגְּרוֹת designa estruturas emolduradas ou bordas dos suportes; “molduras” é concreto e adequado ao contexto arquitetônico.
- source_word: הַמְּכֹנוֹת
  choice: dos suportes
  rationale: No contexto dos utensílios do templo, מְכֹנוֹת são as bases ou estruturas móveis que sustentavam as bacias; “suportes” comunica claramente sua função.
- source_word: וַיָּסַר מֵעֲלֵיהֶם וְאֶת הַכִּיּוֹר
  choice: retirou deles as bacias
  rationale: A construção indica que Acaz retirou de cima dos suportes o recipiente associado a eles. O hebraico usa כִּיּוֹר no singular coletivo/distributivo após o plural “suportes”; o plural em português evita sugerir que uma única bacia estivesse sobre vários suportes e corresponde à descrição anterior dos dez conjuntos.
- source_word: הַכִּיּוֹר
  choice: as bacias
  rationale: כִּיּוֹר é uma bacia usada no serviço do templo. “Bacia” é mais acessível no português atual do que o tradicional “lavatório” e conserva a natureza do objeto.
- source_word: הַיָּם
  choice: o Mar
  rationale: É a designação própria da grande bacia do templo de Salomão; a inicial maiúscula mostra que se trata de um utensílio específico, não do mar comum.
- source_word: הוֹרִד
  choice: tirou ... de cima
  rationale: O hifil de ירד expressa fazer descer ou retirar de uma posição elevada; a formulação portuguesa descreve naturalmente a remoção do Mar de seus apoios.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: os bois de bronze
  rationale: בָּקָר pode designar bovinos em geral; “bois” é a forma tradicional e natural neste contexto das figuras que sustentavam o Mar. נְחֹשֶׁת é “bronze” no contexto dos utensílios do templo.
- source_word: אֲשֶׁר תַּחְתֶּיהָ
  choice: que estavam debaixo dele
  rationale: A oração identifica os bois como os suportes situados sob o Mar. Em português, o pronome masculino concorda com “Mar”.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: o colocou
  rationale: נתן aqui expressa a colocação do objeto; “colocou” é atual, claro e ligeiramente mais digno do que “pôs”.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: sobre um pavimento de pedras
  rationale: מַרְצֶפֶת denota uma superfície pavimentada. “Pavimento de pedras” preserva a construção material explicitada no hebraico sem pressupor uma plataforma elevada.
