base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: pt
  text: Então o rei Acaz foi a Damasco encontrar-se com Tiglate-Pileser, rei da Assíria. Ao ver o altar que havia em Damasco, o rei Acaz enviou ao sacerdote Urias um modelo do altar e o seu projeto, com todos os detalhes de sua construção.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: encontrar-se com
  rationale: Expressa naturalmente a ideia de ir ao encontro de alguém, sem especificar uma finalidade além da indicada pelo hebraico.
- source_word: דְּמוּת הַמִּזְבֵּחַ
  choice: um modelo do altar
  rationale: דמות denota aqui uma representação visual ou reprodução do altar; “modelo” é claro e adequado ao contexto da construção.
- source_word: תַּבְנִיתוֹ
  choice: o seu projeto
  rationale: תבנית refere-se à configuração, forma ou planta do altar; “projeto” comunica em português a informação técnica enviada para reproduzi-lo.
- source_word: לְכָל מַעֲשֵׂהוּ
  choice: com todos os detalhes de sua construção
  rationale: A expressão abrange o modo como o altar era feito; esta formulação idiomática preserva a abrangência de כל e o sentido construtivo de מעשה no contexto.
theological_decisions: []
translation_notes:
