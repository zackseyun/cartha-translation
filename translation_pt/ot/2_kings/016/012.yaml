  text: וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ מִ/דַּמֶּ֔שֶׂק וַ/יַּ֥רְא הַ/מֶּ֖לֶךְ אֶת הַ/מִּזְבֵּ֑חַ וַ/יִּקְרַ֥ב הַ/מֶּ֛לֶךְ עַל הַ/מִּזְבֵּ֖חַ וַ/יַּ֥עַל עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: pt
  text: Quando o rei veio de Damasco, viu o altar; então o rei se aproximou do altar e subiu nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofereceu sobre ele”. Alguns entendem “subiu nele” como uma forma abreviada de indicar o início da ação sacrificial, embora o hebraico descreva mais literalmente uma subida sobre o altar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא ... מִדַּמֶּשֶׂק
  choice: voltou de Damasco
  rationale: בוא indica a chegada do rei, e מן marca sua procedência. No contexto, ele retorna de Damasco; “voltou” expressa isso naturalmente em português.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: O substantivo definido ocorre três vezes. A tradução mantém duas ocorrências relevantes, evitando uma repetição inicial pouco natural sem perder o destaque dado à ação pessoal do rei.
- source_word: וַיַּרְא
  choice: viu
  rationale: ראה denota percepção visual direta; “viu” é a equivalência simples e natural.
- source_word: אֶת־הַמִּזְבֵּחַ
  choice: o altar
  rationale: מִזְבֵּחַ designa precisamente um altar.
- source_word: וַיִּקְרַב ... עַל־הַמִּזְבֵּחַ
  choice: se aproximou do altar
  rationale: קרב no qal significa aproximar-se; com עַל, o movimento é dirigido ao altar. A formulação é idiomática em português.
- source_word: וַיַּעַל עָלָיו
  choice: subiu nele
  rationale: עלה com עַל e sufixo pronominal descreve mais diretamente uma subida sobre o altar. A tradução conserva essa imagem e não antecipa explicitamente o ato sacrificial do versículo seguinte.
theological_decisions:
- issue: Se וַיַּעַל עָלָיו descreve subida física ou, de modo elíptico, a oferta de sacrifícios
  choice: subiu nele
  alternative: ofereceu sacrifícios sobre ele; subiu até ele
  rationale: A construção hebraica expressa literalmente subida sobre o altar. Embora possa ser entendida como referência abreviada ao início da ação sacrificial, traduzir diretamente preserva a ambiguidade e evita acrescentar conteúdo explicitado no versículo seguinte.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. A sequência narrativa foi tornada natural com “então”, e a difícil expressão final foi traduzida de modo formal, com a leitura sacrificial registrada em nota.
