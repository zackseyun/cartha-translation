  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: pt
  text: Então Rezim, rei de Arã, e Peca, filho de Remalias, rei de Israel, subiram a Jerusalém para guerrear. Sitiaram Acaz, mas não puderam combater[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente «mas não puderam lutar/combater» e não explicita contra quem. Pelo contexto, pode referir-se a Acaz ou a Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência temporal da narrativa de modo natural e conciso.
- source_word: יַעֲלֶה
  choice: subiram
  rationale: O singular hebraico precede um sujeito composto, mas em português a concordância no plural é natural; 'subir' preserva a expressão convencional de deslocamento rumo a Jerusalém.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Rezim, rei de Arã
  rationale: Translitera o nome e conserva Arã, correspondente mais direto do termo hebraico, em vez de identificá-lo simplesmente com a Síria.
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: e Peca, filho de Remalias, rei de Israel
  rationale: Mantém o patronímico e a aposição régia com pontuação clara em português.
- source_word: יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: a Jerusalém para guerrear
  rationale: Expressa destino e propósito militar em linguagem atual, sem acrescentar um objeto que o hebraico não explicita.
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: Eles cercaram Acaz
  rationale: No contexto militar, צור significa sitiar ou cercar; a construção com עַל apresenta Acaz como alvo do cerco.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: mas não conseguiram vencê-lo
  rationale: A tradução contextual evita a impressão incoerente de que os reis nem sequer conseguiram combater, embora já estivessem sitiando. A nota preserva a formulação mais estrita e sua ambiguidade de referente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A divisão em duas frases alivia a longa coordenação hebraica. A ambiguidade do complemento final é mantida em nota, enquanto o texto principal comunica o provável sentido contextual de fracasso militar.
