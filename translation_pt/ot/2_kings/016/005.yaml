  source_fidelity: 'A tradução de לְהִלָּחֵם por «vencê-lo» restringe e intensifica indevidamente o sentido: o hebraico diz literalmente que eles não puderam lutar/combater e não explicita objeto. «Sitiaram Acaz» é uma formulação militar mais precisa para וַיָּצֻרוּ עַל אָחָז do que «cercaram Acaz».'
  naturalness: «Então», os nomes e a construção geral são naturais em português moderno. «Não puderam combater» preserva o sentido verbal sem exigir um complemento que o hebraico não fornece.
