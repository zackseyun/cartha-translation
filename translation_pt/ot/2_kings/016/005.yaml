    issue: «não conseguiram vencê-lo» traduz o verbo final como vitória/conquista sobre Acaz.
    rationale: לְהִלָּחֵם significa «lutar, combater, fazer guerra»; o texto não declara que não puderam vencer Acaz, nem fornece pronome-objeto após o infinitivo.
