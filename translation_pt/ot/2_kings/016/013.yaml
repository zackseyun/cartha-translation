base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: pt
  text: Ele queimou o seu holocausto e a sua oferta de cereal, derramou a sua oferta de bebida e lançou contra o altar o sangue das suas ofertas de comunhão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como «ofertas pacíficas» ou «ofertas de bem-estar». O termo hebraico שְׁלָמִים designa uma categoria específica de sacrifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: queimou sobre o altar
  rationale: No contexto sacrificial, o hifil de קטר indica fazer a oferta subir em fumaça. A formulação explicita naturalmente o contexto ritual sem acrescentar um elemento estranho à cena.
- source_word: עֹלָתוֹ
  choice: o seu holocausto
  rationale: עֹלָה é o termo sacrificial habitual para a oferta inteiramente queimada; «holocausto» é a designação bíblica consagrada e amplamente compreensível em português.
- source_word: מִנְחָתוֹ
  choice: a sua oferta de cereal
  rationale: No contexto cultual, מִנְחָה designa a oferta feita de cereais, e não apenas uma dádiva genérica.
- source_word: וַיַּסֵּךְ
  choice: derramou
  rationale: נסך descreve o ato ritual de derramar uma libação; o objeto torna clara a natureza sacrificial da ação.
- source_word: נִסְכּוֹ
  choice: a sua oferta de bebida
  rationale: נֶסֶךְ é a bebida derramada como oferta. «Oferta de bebida» é mais transparente para leitores comuns do que o termo técnico «libação».
- source_word: וַיִּזְרֹק
  choice: lançou
  rationale: זרק expressa lançar ou arremessar o sangue no ritual, com mais força do que «aspergir», sem especificar além do hebraico o modo exato do contato.
- source_word: דַּם הַשְּׁלָמִים
  choice: o sangue das suas ofertas de comunhão
  rationale: שְׁלָמִים nomeia uma categoria sacrificial específica. «Ofertas de comunhão» comunica uma de suas associações centrais e permanece natural, enquanto alternativas legítimas são registradas em nota.
- source_word: אֲשֶׁר לוֹ
  choice: suas
  rationale: A expressão indica que as ofertas lhe pertenciam. O possessivo integrado ao sintagma é natural em português e preserva esse sentido.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contra o altar
  rationale: Com זרק no rito de sangue, עַל pode indicar sangue lançado contra a superfície do altar; «contra» reproduz bem a ação física.
theological_decisions:
- issue: Sentido sacrificial de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; ofertas de bem-estar
  rationale: O termo hebraico designa uma categoria ritual e admite mais de uma representação semântica. A tradução principal não deve transformar a expressão numa afirmação doutrinária específica; a nota conserva alternativas reconhecidas.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente e terminologia sacrificial clara. O artigo e o complemento «sobre o altar» foram organizados para evitar que «queimou» pareça referir-se a uma ação comum, preservando o valor cultual do verbo.
