base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: pt
  text: Acaz descansou com seus antepassados[a] e foi sepultado com seus antepassados na Cidade de Davi. Ezequias, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “descansou com seus antepassados” é uma fórmula convencional dos relatos sobre os reis e significa que Acaz morreu e se juntou aos seus antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No aviso régio de morte, שׁכב, junto de “com seus antepassados”, é uma expressão convencional para morrer. “Descansou” preserva a imagem e o caráter formular do hebraico sem a possível estranheza de “dormiu com” no português atual.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: “Antepassados” comunica naturalmente a referência aos membros falecidos da linhagem e evita que “pais” seja entendido apenas como pai e mãe, embora o hebraico use literalmente “pais”.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: A forma passiva do hebraico é preservada com uma expressão corrente e digna em português.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: Mantém a designação geográfica tradicional e transparente como nome próprio.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Em fórmulas de sucessão, מלך indica que o sucessor assumiu e exerceu o reinado; “reinou” é conciso e formalmente próximo.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: בְנוֹ
  choice: seu filho
  rationale: Preserva explicitamente a relação filial presente na fórmula hebraica de sucessão.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa de modo natural a substituição e sucessão no trono.
