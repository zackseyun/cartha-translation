  text: וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּעַל֩ מֶ֨לֶךְ אַשּׁ֤וּר אֶל דַּמֶּ֨שֶׂק֙ וַֽ/יִּתְפְּשֶׂ֔/הָ וַ/יַּגְלֶ֖/הָ קִ֑ירָ/ה וְ/אֶת רְצִ֖ין הֵמִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: pt
  text: Então o rei da Assíria lhe deu ouvidos[a]. O rei da Assíria marchou contra Damasco, tomou a cidade, deportou seus habitantes para Quir[b] e matou Rezim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atendeu ao seu pedido”. O verbo hebraico pode indicar ouvir e agir em resposta.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “deportou-a para Quir”, empregando a cidade para representar seus habitantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: lhe deu ouvidos
  rationale: שׁמע com אֶל indica ouvir alguém de modo responsivo, isto é, atender ao pedido. A expressão portuguesa conserva tanto a ideia de escutar quanto a de agir em resposta.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Tradução direta da cadeia construta; a repetição na segunda oração acompanha a ênfase narrativa do hebraico.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: marchou contra Damasco
  rationale: Em contexto militar, עלה com אֶל descreve um avanço hostil. “Marchou contra” comunica isso naturalmente sem acrescentar detalhes.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: tomou a cidade
  rationale: תפשׂ indica a tomada de controle de Damasco. Explicitar “a cidade” torna claro o referente do sufixo feminino hebraico.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: deportou seus habitantes para Quir
  rationale: Literalmente, o objeto pronominal é Damasco, mas a cidade representa metonimicamente sua população. A formulação explicita essa metonímia em português idiomático; “para” representa o he locale de קִירָה.
- source_word: קִירָה
  choice: Quir
  rationale: Nome geográfico transliterado segundo a forma tradicional e reconhecível em português bíblico.
- source_word: וְאֶת רְצִין הֵמִית
  choice: e matou Rezim
  rationale: המית significa causar a morte. “Matou” é direto, natural e não acrescenta ao texto a noção específica de uma execução formal.
theological_decisions: []
