  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preserva-se a repetição de “o rei da Assíria”, mas as ações subsequentes são coordenadas com fluidez. As notas registram a nuance responsiva de שׁמע e a metonímia presente no objeto de גלה.
