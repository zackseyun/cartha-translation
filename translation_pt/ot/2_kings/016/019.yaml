base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/019.yaml
  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais atos de Acaz, que ele fez, não estão escritos no Livro das Crônicas[a] dos Reis de Judá?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Livro dos Anais dos Reis de Judá”.'
    reason: Alternativa lexical para דִּבְרֵי הַיָּמִים, que pode ser traduzido por “Crônicas” ou “Anais” neste contexto arquivístico.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos
  rationale: יֶתֶר indica o restante, e דִּבְרֵי, nesta fórmula de resumo régio, refere-se aos atos ou feitos do rei. A expressão escolhida é natural em português e preserva o sentido historiográfico.
- source_word: אָחָז
  choice: Acaz
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֲשֶׁר עָשָׂה
  choice: tudo o que ele fez
  rationale: Traduz de modo natural a oração relativa hebraica e retoma a totalidade dos demais atos mencionados.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica, que espera resposta afirmativa, e o sentido passivo de כְּתוּבִים.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל possa ser literalmente 'sobre', em referência documental o português idiomático pede 'no'. סֵפֶר designa aqui um registro escrito.
- source_word: דִּבְרֵי הַיָּמִים
  choice: das Crônicas
  rationale: A expressão designa um registro cronístico ou analístico. 'Crônicas' é clara, tradicional e adequada como parte do título.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: dos Reis de Judá
  rationale: Neste título documental, לְ expressa relação ou referência; 'dos Reis de Judá' é a formulação natural em português.
