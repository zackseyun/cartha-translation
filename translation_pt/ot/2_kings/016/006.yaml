base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: pt
  text: Naquele tempo, Rezim, rei de Arã, recuperou Elate para Arã e expulsou os judeus de Elate[b]. Os arameus[a] vieram a Elate e ali vivem até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico massorético traz “arameus”. Alguns intérpretes e testemunhos antigos favorecem “edomitas”, provavelmente porque essa leitura se ajusta melhor ao contexto mais amplo e ao relato paralelo de 2Crônicas 28:17.
    reason: textual_variant
  - marker: b
    text: Na segunda ocorrência, o nome Elate aparece no hebraico com uma grafia alternativa, que também pode ser transliterada como “Elote”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: recuperou
  rationale: O hifil de שוב indica que Elate voltou ao controle de Arã. “Recuperou” expressa de modo natural a retomada política e militar.
- source_word: אֵילַת / אֵילוֹת
  choice: Elate
  rationale: Adota-se a forma portuguesa tradicional “Elate”; a variação gráfica hebraica na segunda ocorrência é registrada em nota.
- source_word: לַאֲרָם
  choice: para Arã
  rationale: A expressão indica transferência de posse ou controle. “Arã” preserva o nome próprio hebraico, em vez do nome geopolítico posterior “Síria”.
- source_word: וַיְנַשֵּׁל
  choice: expulsou
  rationale: O verbo descreve a remoção dos habitantes de sua posse do lugar; “expulsou” conserva a força da ação com concisão.
- source_word: הַיְהוּדִים
  choice: os judeus
  rationale: No contexto monárquico, o termo designa o povo de Judá. “Judeus” é a forma corrente e amplamente inteligível em português, sem exigir a expressão menos natural “judaítas”.
- source_word: וארמים
  choice: os arameus
  rationale: O texto consonantal massorético traz “arameus”. A variante “edomitas”, apoiada pelo contexto e por testemunhos antigos, é preservada em nota, não inserida silenciosamente no texto.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: ali vivem até hoje
  rationale: A formulação comunica a residência iniciada no evento narrado e continuada até o tempo do narrador, em português natural.
theological_decisions:
- issue: Dificuldade textual e histórica no etnônimo da oração final
  choice: os arameus foram para Elate
  alternative: os edomitas foram para Elate
  rationale: O Texto Massorético lê “arameus” e, por isso, governa o texto principal. A leitura “edomitas” é uma variante antiga e contextualmente plausível, mas deve ser apresentada em nota para preservar a tensão textual sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantêm-se “Arã”, “Elate” e “arameus” para proximidade histórica e textual; as duas dificuldades do hebraico são explicitadas em notas.
