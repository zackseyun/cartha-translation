reference: 2 Kings 16:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אָחָ֜ז אֶת הַ/כֶּ֣סֶף וְ/אֶת הַ/זָּהָ֗ב הַ/נִּמְצָא֙ בֵּ֣ית יְהוָ֔ה וּ/בְ/אֹֽצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֥ח לְ/מֶֽלֶךְ אַשּׁ֖וּר שֹֽׁחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: pt
  text: Acaz pegou a prata e o ouro que havia no templo de Yahweh e nos tesouros do palácio real e os enviou como suborno[a] ao rei da Assíria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tributo” ou “presente”; a palavra hebraica geralmente tem o sentido de suborno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: Traduz de modo direto o wayyiqtol de לקח na sequência narrativa, em linguagem corrente e digna.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: a prata e o ouro
  rationale: Mantém os metais preciosos concretos e o paralelismo do hebraico.
- source_word: הַנִּמְצָא
  choice: que havia
  rationale: Expressa naturalmente em português aquilo que se encontrava disponível nos dois locais, sem alterar o sentido do particípio passivo.
- source_word: בֵּית יְהוָה
  choice: templo de Yahweh
  rationale: Embora literalmente seja 'casa de Yahweh', 'templo' comunica com clareza a referência institucional em português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: e nos tesouros do palácio real
  rationale: אֹצְרוֹת designa os depósitos de riquezas, enquanto 'palácio real' traduz idiomaticamente a casa do rei neste contexto.
- source_word: וַיִּשְׁלַח
  choice: e os enviou
  rationale: O pronome plural retoma naturalmente 'a prata e o ouro' em português; o verbo hebraico introduz o segundo ato da narrativa.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: ao rei da Assíria
  rationale: Construção portuguesa clara e convencional para o sintagma hebraico.
- source_word: שֹׁחַד
  choice: como suborno
  rationale: Preserva o sentido normalmente negativo de שֹׁחַד e descreve a função dada à prata e ao ouro enviados.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; a transliteração preserva sua condição de nome sem substituí-lo por um título.
- issue: Caracterização do pagamento a Assíria
  choice: suborno
  alternative: tributo ou presente
  rationale: שֹׁחַד normalmente tem conotação de suborno. A alternativa é registrada em nota para não ocultar a amplitude possível no contexto diplomático.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. 'Templo' e 'palácio real' evitam a repetição literal, mas pouco idiomática, de 'casa'; 'pegou' conserva a simplicidade narrativa. O marcador [a] está ligado diretamente a 'suborno'.
