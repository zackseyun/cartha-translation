  text: ו/יצו/הו הַ/מֶּֽלֶךְ אָ֠חָז אֶת אוּרִיָּ֨ה הַ/כֹּהֵ֜ן לֵ/אמֹ֗ר עַ֣ל הַ/מִּזְבֵּ֣חַ הַ/גָּד֡וֹל הַקְטֵ֣ר אֶת עֹֽלַת הַ/בֹּקֶר֩ וְ/אֶת מִנְחַ֨ת הָ/עֶ֜רֶב וְֽ/אֶת עֹלַ֧ת הַ/מֶּ֣לֶךְ וְ/אֶת מִנְחָת֗/וֹ וְ֠/אֵת עֹלַ֞ת כָּל עַ֤ם הָ/אָ֨רֶץ֙ וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֔ם וְ/כָל דַּ֥ם עֹלָ֛ה וְ/כָל דַּם זֶ֖בַח עָלָ֣י/ו תִּזְרֹ֑ק וּ/מִזְבַּ֧ח הַ/נְּחֹ֛שֶׁת יִֽהְיֶה לִּ֖/י לְ/בַקֵּֽר־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: pt
  text: 'Então o rei Acaz deu esta ordem ao sacerdote Urias: “Sobre o grande altar, ofereça o holocausto da manhã e a oferta de cereal da tarde, o holocausto do rei e sua oferta de cereal, bem como o holocausto de todo o povo da terra, suas ofertas de cereal e suas libações. Lance sobre ele todo o sangue do holocausto e todo o sangue do sacrifício. Quanto ao altar de bronze, ficará reservado para eu consultar por meio dele[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para eu examinar”, “para eu considerar” ou, possivelmente, “para eu buscar orientação por meio dele”. A expressão hebraica é difícil, e não se sabe ao certo que função Acaz atribuiu ao altar de bronze.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז אֶת אוּרִיָּה הַכֹּהֵן
  choice: Então o rei Acaz deu esta ordem ao sacerdote Urias
  rationale: Expressa naturalmente em português a autoridade de צוה e entende o sufixo verbal como antecipação do objeto explicitado, Urias. Mantém o título sacerdotal e a ordem portuguesa usual para o título real.
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: Sobre o grande altar
  rationale: Preserva a preposição espacial e o adjetivo que distingue o altar recém-construído do altar de bronze.
- source_word: הַקְטֵר
  choice: ofereça
  rationale: No hifil e em contexto sacrificial, o verbo indica fazer a oferta subir em fumaça. “Ofereça” comunica a função ritual com naturalidade, sem reduzir o ato à mera combustão.
- source_word: עֹלַת הַבֹּקֶר
  choice: o holocausto da manhã
  rationale: “Holocausto” é o termo português corrente para a oferta inteiramente queimada e mantém a especificação temporal.
- source_word: מִנְחַת הָעֶרֶב
  choice: a oferta de cereal da tarde
  rationale: Em contexto cultual, מִנְחָה designa a oferta vegetal ou de cereal; a formulação evita o sentido vago de “oferta” apenas.
- source_word: עֹלַת הַמֶּלֶךְ וְאֶת מִנְחָתוֹ
  choice: o holocausto do rei e sua oferta de cereal
  rationale: Mantém as relações possessivas e a referência natural do pronome ao rei.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: o holocausto de todo o povo da terra
  rationale: Conserva a expressão sociopolítica hebraica sem restringi-la indevidamente a uma classe específica.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: suas ofertas de cereal e suas ofertas derramadas
  rationale: Mantém o valor plural e distributivo dos sufixos. “Ofertas derramadas” é compreensível e explicita a natureza ritual das libações.
- source_word: וְכָל דַּם עֹלָה וְכָל דַּם זֶבַח
  choice: todo o sangue dos holocaustos e todo o sangue dos sacrifícios
  rationale: Preserva o paralelismo e diferencia os holocaustos dos sacrifícios em sentido mais geral; os plurais são naturais no uso coletivo português.
- source_word: עָלָיו תִּזְרֹק
  choice: Lance sobre ele
  rationale: זרק indica lançar ou aspergir o sangue contra o altar. “Lance” preserva a força física do verbo, e “sobre ele” retoma o grande altar.
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת יִהְיֶה לִּי לְבַקֵּר
  choice: Quanto ao altar de bronze, ficará reservado para eu consultar por meio dele
  rationale: Distingue o altar de bronze do grande altar e conserva o provável sentido consultivo da expressão final, sem definir que espécie de consulta estaria em vista.
theological_decisions:
- issue: Sentido de לְבַקֵּר na função reservada ao altar de bronze
  choice: para eu consultar por meio dele
  alternative: para eu examinar; para eu considerar; para eu buscar orientação por meio dele
  rationale: A expressão hebraica é difícil e pode ter sentido de examinar, cuidar ou consultar. O contexto sugere que Acaz reserva o altar para uso próprio, possivelmente consultivo, mas não permite identificar com segurança uma prática técnica específica. A tradução conserva essa tensão, e a nota registra a incerteza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega terminologia sacrificial reconhecível sem excesso de arcaísmo. A enumeração foi pontuada para clareza, e o marcador da nota foi colocado junto à expressão ambígua a que de fato se refere.
