  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: pt
  text: 'Então Acaz enviou mensageiros a Tiglate-Pileser, rei da Assíria, dizendo: “Sou teu servo e teu filho.[a] Sobe e salva-me da mão[b] do rei de Arã[c] e da mão do rei de Israel, que estão se levantando contra mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sou teu vassalo e teu filho”. O hebraico usa literalmente a linguagem diplomática de submissão “teu servo e teu filho”.'
    reason: lexical_alternative
  - marker: b
    text: “Da mão” é uma expressão hebraica que significa “do poder”.
    reason: lexical_alternative
  - marker: c
    text: “Arã” é tradicionalmente traduzido por “Síria”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Forma narrativa de שלח; “enviou” é a equivalência corrente e natural no contexto.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto político, designa emissários humanos; “mensageiros” é claro e não sugere seres celestiais.
- source_word: תִּגְלַת פְּלֶסֶר
  choice: Tiglate-Pileser
  rationale: Forma portuguesa convencional do nome real assírio.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: rei da Assíria
  rationale: Reproduz com precisão o título e o reino indicados pela construção hebraica.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: teu servo e teu filho
  rationale: Preserva literalmente a linguagem diplomática de submissão e parentesco, sem substituí-la no texto por terminologia política interpretativa.
- source_word: עֲלֵה
  choice: Sobe
  rationale: Mantém o sentido básico de עלה e a imagem espacial do hebraico, ao mesmo tempo que o contexto deixa clara a solicitação de intervenção militar.
- source_word: וְהוֹשִׁיעֵנִי
  choice: salva-me
  rationale: Traduz diretamente o hifil de ישׁע e conserva sua continuidade lexical bíblica; aqui o contexto indica salvação político-militar.
- source_word: מִכַּף
  choice: da mão
  rationale: Conserva a imagem concreta do idioma hebraico, que neste contexto significa estar sob o poder de alguém.
- source_word: אֲרָם
  choice: Arã
  rationale: Representa o nome histórico original, em vez da tradução tradicional “Síria”, potencialmente anacrônica.
- source_word: הַקּוֹמִים עָלַי
  choice: que estão se levantando contra mim
  rationale: A construção progressiva comunica a ação hostil em curso expressa pelo particípio hebraico e preserva a metáfora verbal.
theological_decisions:
- issue: Linguagem de autohumilhação diplomática no apelo de Acaz
  choice: “teu servo e teu filho”
  alternative: “teu vassalo e teu filho”
  rationale: Embora a expressão declare submissão política, o hebraico emprega as metáforas de serviço e filiação. A tradução mantém essa retórica sem introduzir no texto principal um termo técnico.
- issue: Sentido político-militar de וְהוֹשִׁיעֵנִי
  choice: “salva-me”
  alternative: “livra-me” ou “resgata-me”
  rationale: “Salva-me” preserva a amplitude e a continuidade do verbo bíblico, enquanto o contexto esclarece que se trata aqui de livramento político e militar.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conservam-se as imagens hebraicas “teu servo e teu filho”, “sobe”, “salva-me” e “da mão”, com notas apenas onde a expressão literal pode exigir esclarecimento.
