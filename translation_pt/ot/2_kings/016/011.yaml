base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: pt
  text: O sacerdote Urias construiu o altar conforme tudo o que o rei Acaz havia enviado de Damasco. Assim fez o sacerdote Urias até que o rei Acaz chegasse de Damasco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construiu
  rationale: O verbo בנה significa normalmente construir; “construiu” é direto, natural e apropriado para um altar.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: o sacerdote Urias
  rationale: Mantém o título e o nome, inclusive na repetição, que reforça a responsabilidade pessoal de Urias.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: מזבח é o termo comum para “altar”, e o artigo definido foi preservado.
- source_word: כְּכֹל אֲשֶׁר שָׁלַח
  choice: conforme tudo o que ... havia enviado
  rationale: Preserva a ideia de plena conformidade sem especificar se Acaz enviou um desenho, modelo ou instruções; o mais-que-perfeito esclarece que o envio antecedeu a construção.
- source_word: כֵּן עָשָׂה
  choice: fez exatamente assim
  rationale: Expressa a correspondência enfática entre o que Acaz enviou e o que Urias executou, em português natural.
- source_word: עַד בּוֹא
  choice: antes que ... voltasse
  rationale: No contexto narrativo, a construção já estava concluída quando Acaz retornou; a expressão marca sua chegada como limite temporal. A alternativa mais literal é registrada em nota.
- source_word: מִדַּמֶּשֶׂק
  choice: de Damasco
  rationale: A preposição מִן indica origem. Na segunda ocorrência, “voltasse de Damasco” explicita naturalmente o retorno de Acaz sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “o sacerdote Urias” foi mantida por fidelidade e ênfase. Evitou-se transformar “tudo o que ... havia enviado” em “instruções” ou “projeto”, pois o versículo não nomeia explicitamente o conteúdo enviado.
