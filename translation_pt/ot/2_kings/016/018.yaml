revisions:
- from: Também desviou da Casa de Yahweh a passagem coberta do sábado, que haviam construído no templo[a], e a entrada externa do rei[b][c], por causa do rei da Assíria[d].
  to: E desviou[c] da Casa de Yahweh a estrutura coberta do sábado, que haviam construído no templo[a], e a entrada externa do rei[b], por causa do rei da Assíria[d].
  rationale: A revisão usa uma designação arquitetônica mais cautelosa para מִסָּךְ, reposiciona a nota sobre הֵסֵב junto ao verbo para que seu alcance sobre os dois objetos fique inequívoco e retira da nota causal a explicitação interpretativa de «pressão». Conserva-se a ambiguidade quanto à natureza exata das estruturas, ao tipo de alteração e à motivação de Acaz.
