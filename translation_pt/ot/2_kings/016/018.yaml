  naturalness: «Desviou da Casa de Yahweh ... a passagem ... e a entrada» é compreensível, mas a ordem dos constituintes é um pouco pesada em português, e o marcador da nota verbal, posposto a «entrada», pode parecer restringir-se ao segundo objeto. Uma formulação com o marcador junto ao verbo torna o escopo claro.
  terminology: «Casa de Yahweh» é aceitável e mantém o nome divino. «Estrutura coberta do sábado» é mais neutro e fiel para מִסָּךְ do que «passagem coberta».
