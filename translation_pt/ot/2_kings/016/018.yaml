base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: pt
  text: E desviou[c] da Casa de Yahweh a estrutura coberta do sábado, que haviam construído no templo[a], e a entrada externa do rei[b], por causa do rei da Assíria[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a passagem coberta do sábado”, “o pavilhão do sábado” ou “o pórtico do sábado”. O sentido arquitetônico exato do termo hebraico é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “a entrada externa usada pelo rei” ou “o acesso externo do rei”.
    reason: lexical_alternative
  - marker: c
    text: Ou “alterou”, “mudou de lugar” ou “removeu”. O verbo hebraico pode indicar que algo foi desviado ou teve sua disposição modificada, não necessariamente que foi eliminado.
    reason: lexical_alternative
  - marker: d
    text: Ou “por causa do rei da Assíria”; possivelmente, “por medo do rei da Assíria”.
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: a passagem coberta do sábado
  rationale: O termo מיסך é raro e designa, ao que parece, alguma estrutura arquitetônica coberta associada ao sábado. “Passagem coberta” é compreensível e evita definir com excessiva precisão sua forma incerta.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: que haviam construído no templo
  rationale: Mantém o sujeito plural não especificado de בָּנוּ. Aqui בַּבַּיִת refere-se ao complexo do templo; “no templo” soa natural e evita a repetição ambígua de “casa”.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: a entrada externa do rei
  rationale: מְבוֹא indica entrada ou acesso. A construção portuguesa conserva a ligação com o rei e a qualificação “externa” sem determinar se era de propriedade ou de uso real.
- source_word: הֵסֵב
  choice: desviou da
  rationale: O hifil de סבב pode significar fazer virar, desviar, alterar ou mudar de lugar. “Desviou da” preserva melhor essa amplitude do que “removeu”, que afirmaria eliminação completa.
- source_word: בֵּית יְהוָה
  choice: Casa de Yahweh
  rationale: Preserva a expressão hebraica tradicional para o templo e translitera o nome divino pessoal יהוה como “Yahweh”.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: por causa do rei da Assíria
  rationale: É a formulação causal mais ampla e menos interpretativa; o hebraico também pode sugerir pressão ou temor diante do rei assírio.
theological_decisions:
- issue: A natureza das alterações feitas por Acaz e sua motivação diante da Assíria
  choice: Empregar “desviou” e “por causa de”, sem afirmar remoção total nem medo explícito.
  alternative: “removeu” e/ou “por medo do rei da Assíria”
  rationale: O hebraico permite alteração, desvio ou deslocamento, e מִפְּנֵי não exige que o temor seja explicitado. A tradução conserva a tensão histórica sem acrescentar uma motivação psicológica definida.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Casa de Yahweh” mantém a expressão cultual e o nome divino; “templo” na oração relativa esclarece o referente sem repetição pesada. Os marcadores seguem imediatamente os trechos a que se referem.
