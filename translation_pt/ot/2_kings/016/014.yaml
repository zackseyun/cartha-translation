id: 2KI.16.14
reference: 2 Kings 16:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: pt
  text: Quanto ao altar de bronze[a] que estava diante de Yahweh, Acaz o retirou da frente do templo, de entre o altar e o templo de Yahweh[b], e o colocou ao lado do altar, ao norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «altar de cobre».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «casa de Yahweh», isto é, o templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: o altar de bronze
  rationale: נְחֹשֶׁת pode designar bronze ou cobre. «Bronze» é a designação tradicional e provavelmente adequada no contexto dos utensílios do templo, sem eliminar a alternativa lexical indicada em nota.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: que estava diante de Yahweh
  rationale: לִפְנֵי expressa aqui posição espacial, «diante de», e também preserva a associação cultual com a presença de Yahweh.
- source_word: וַיַּקְרֵב מֵאֵת פְּנֵי הַבַּיִת
  choice: Acaz o retirou da frente do templo
  rationale: Embora קרב tenha o sentido básico de aproximar ou trazer para perto, a construção com מֵאֵת e o contexto descrevem a remoção do altar de sua posição diante do edifício. O sujeito implícito é Acaz, identificado no contexto imediato; explicitá-lo evita ambiguidade em português.
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: de entre o altar e o templo de Yahweh
  rationale: A repetição de מִבֵּין especifica a posição da qual o altar de bronze foi removido. «Templo» comunica naturalmente o referente de בַּיִת neste contexto.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: e o colocou
  rationale: נתן, em um contexto de localização física, significa pôr ou colocar; «colocou» é claro e digno em português atual.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: ao lado do altar, ao norte
  rationale: יֶרֶךְ indica lado ou flanco, enquanto צָפוֹנָה acrescenta a direção norte. A formulação preserva ambas as informações e evita sugerir que o objeto foi posto sobre a superfície do altar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. «Yahweh» preserva o nome pactual e segue a decisão terminológica fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Templo» foi usado no corpo para evitar que «casa» pareça uma residência comum; a expressão hebraica literal é preservada em nota. Os dois marcadores de nota aparecem no texto principal.
