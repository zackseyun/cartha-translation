base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/016.yaml
  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: pt
  text: Assim, o sacerdote Urias fez conforme tudo o que o rei Acaz havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה tem sentido amplo, “fazer”. Neste contexto, com a expressão de conformidade que se segue, “fez” é a forma mais natural e direta em português.
- source_word: אוּרִיָּה
  choice: Urias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico אוּרִיָּה.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: O substantivo definido identifica o ofício de Urias; “o sacerdote” reproduz claramente seu sentido.
- source_word: כְּכֹל אֲשֶׁר
  choice: tudo conforme
  rationale: A construção expressa conformidade integral com a ordem mencionada. “Fez tudo conforme” é natural em português e preserva essa abrangência.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O verbo צוה significa “ordenar, dar uma ordem”. O mais-que-perfeito composto indica naturalmente que a ordem do rei precedeu a ação de Urias.
- source_word: הַמֶּלֶךְ אָחָז
  choice: o rei Acaz
  rationale: Esta é a ordem idiomática usual do título e do nome em português, mantendo também a determinação presente no hebraico.
theological_decisions:
- issue: Avaliação narrativa da obediência de Urias
  choice: Relatar a ação de modo descritivo, sem acrescentar julgamento moral explícito.
  alternative: Empregar palavras que sugiram aprovação ou condenação além do que o versículo declara.
  rationale: O hebraico apenas informa que Urias agiu em plena conformidade com a ordem de Acaz. Embora o contexto mais amplo permita uma avaliação negativa, este versículo não a explicita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação concisa acompanha o caráter direto da narrativa hebraica.
