base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: pt
  text: Ele ofereceu sacrifícios e queimou incenso nos lugares altos, nas colinas e sob toda árvore verdejante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob toda árvore frondosa” ou “sob toda árvore viçosa”. O adjetivo hebraico pode descrever algo verde, fresco ou viçoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: oferecia sacrifícios
  rationale: O verbo זבח indica o ato cultual de sacrificar. A formulação explicita naturalmente em português o objeto implícito, sem acrescentar uma espécie particular de sacrifício.
- source_word: וַיְקַטֵּר
  choice: queimava incenso
  rationale: No piel e neste contexto cultual, קטר pode indicar queimar incenso ou fazer uma oferta produzir fumaça; “queimava incenso” é uma formulação natural e adequada à expressão recorrente em Reis.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: במות designa locais de culto, muitas vezes situados em elevações. “Lugares altos” preserva o termo bíblico estabelecido sem reduzi-lo simplesmente a colinas.
- source_word: וְעַל הַגְּבָעוֹת
  choice: nas colinas
  rationale: גבעות refere-se a colinas reais; a tradução mantém a distinção entre o acidente geográfico e os “lugares altos” como locais de culto.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: e debaixo de toda árvore verdejante
  rationale: רענן pode descrever algo verde, viçoso ou frondoso. “Verdejante” conserva a imagem concreta e o caráter formulístico da expressão, com naturalidade em português.
theological_decisions:
- issue: Formulação referente ao culto ilícito
  choice: 'Manter as ações e os locais concretos: “oferecia sacrifícios e queimava incenso nos lugares altos, nas colinas e debaixo de toda árvore verdejante”.'
  alternative: Explicitar a avaliação com algo como “praticava culto pagão em santuários”.
  rationale: O hebraico deste versículo enumera práticas e lugares, mas não os qualifica expressamente como “pagãos”. A tradução deixa que o contexto forneça a avaliação negativa, sem importar uma interpretação para o próprio enunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O aspecto habitual dos verbos no contexto é expresso pelo pretérito imperfeito. A terminologia cultual tradicional é mantida onde continua inteligível.
