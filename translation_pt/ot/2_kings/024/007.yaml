  text: וְ/לֹֽא הֹסִ֥יף עוֹד֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ/צֵ֖את מֵֽ/אַרְצ֑/וֹ כִּֽי לָקַ֞ח מֶ֣לֶךְ בָּבֶ֗ל מִ/נַּ֤חַל מִצְרַ֨יִם֙ עַד נְהַר פְּרָ֔ת כֹּ֛ל אֲשֶׁ֥ר הָיְתָ֖ה לְ/מֶ֥לֶךְ מִצְרָֽיִם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: pt
  text: O rei do Egito nunca mais saiu de sua terra, porque o rei da Babilônia havia tomado tudo o que pertencia ao rei do Egito, desde o ribeiro do Egito[a] até o rio Eufrates.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uádi do Egito”. O termo hebraico pode designar um curso de água sazonal ou um ribeiro; “rio” é menos provável aqui e poderia ser confundido com o Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד
  choice: nunca mais saiu
  rationale: 'A construção idiomática com לא e עוד indica cessação: o rei deixou de sair. “Nunca mais saiu” comunica isso com naturalidade em português.'
- source_word: לָצֵאת מֵאַרְצוֹ
  choice: saiu de sua terra
  rationale: Mantém o sentido básico de יצא sem explicitar “marchou” ou “fez campanha”, embora o contexto régio-militar permita essa implicação.
- source_word: כִּי
  choice: porque
  rationale: Introduz diretamente a causa de o rei do Egito não voltar a sair de seu território.
- source_word: לָקַח
  choice: havia tomado
  rationale: Preserva o sentido amplo de “tomar” e, pelo mais-que-perfeito composto, apresenta a tomada como anterior à situação descrita.
- source_word: מִנַּחַל מִצְרַיִם
  choice: desde o ribeiro do Egito
  rationale: נחל designa com frequência um ribeiro, leito de torrente ou uádi, não um grande rio perene. “Ribeiro” é compreensível e evita confusão com o Nilo.
- source_word: עַד נְהַר פְּרָת
  choice: até o rio Eufrates
  rationale: Tradução direta e idiomática de נהר פרת.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: tudo o que pertencia ao rei do Egito
  rationale: Conserva a amplitude da construção possessiva hebraica sem restringi-la explicitamente a terras, embora o enquadramento geográfico indique sobretudo domínio territorial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. A formulação mantém a descrição literal de o rei “sair” de sua terra, sem tornar explícita a possível nuance de campanha militar.
