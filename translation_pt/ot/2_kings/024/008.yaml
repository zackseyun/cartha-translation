base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: pt
  text: Joaquim tinha dezoito anos quando começou a reinar e reinou três meses em Jerusalém. Sua mãe se chamava Neusta, filha de Elnatã, de Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «filha de Elnatã, natural de Jerusalém». Literalmente, «de Jerusalém».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: tinha dezoito anos
  rationale: Reproduz em português corrente o sentido do idiomatismo hebraico de idade, sem o literalismo pouco natural «era filho de dezoito anos».
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção com בְּ e o infinitivo situa a idade no início do reinado; esta formulação é clara e natural em português.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ בִּירוּשָׁלִָם
  choice: e reinou três meses em Jerusalém
  rationale: Mantém o valor verbal de מָלַךְ, a duração do reinado e o sentido locativo de בִּירוּשָׁלִַם.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Equivalente idiomático moderno da fórmula hebraica «e o nome de sua mãe era».
- source_word: נְחֻשְׁתָּא
  choice: Neústa
  rationale: Transliteração portuguesa inteligível do nome hebraico, com acento gráfico para orientar a pronúncia.
- source_word: בַת אֶלְנָתָן
  choice: ela era filha de Elnatã
  rationale: Explicita naturalmente em nova oração a filiação expressa pela cadeia construta hebraica.
- source_word: מִירוּשָׁלִָם
  choice: de Jerusalém
  rationale: O hebraico indica procedência ou vinculação local; «de Jerusalém» preserva de modo conciso a ambiguidade idiomática entre origem e identificação geográfica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural e nomes em formas portuguesas usuais. A pontuação evita atribuir silenciosamente a expressão final «de Jerusalém» a uma única pessoa; a nota registra a ambiguidade de referência.
