  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְהוֹיָקִ֖ים וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais atos de Jeoaquim e tudo o que ele fez não estão escritos no Livro das Crônicas dos Reis de Judá[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Livro dos Anais dos Reis de Judá”. O título hebraico se refere a uma fonte de registros reais citada repetidamente em Reis, não necessariamente ao livro bíblico de Crônicas.
    reason: Alternativa lexical e esclarecimento sobre a fonte documental.
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: os demais atos
  rationale: Na fórmula de encerramento dos reinados, יֶתֶר indica o restante, e דִּבְרֵי se refere amplamente aos atos ou feitos registrados do rei. A expressão é natural em português e preserva o sentido contextual.
- source_word: יְהוֹיָקִים
  choice: Jeoaquim
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Tradução direta que mantém a abrangência da oração hebraica sem especificar indevidamente a natureza das ações.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica introduzida por הֲלֹא e a concordância plural associada aos atos mencionados.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל possa ser vertido literalmente por “sobre”, o português usa naturalmente “escritos no livro” para conteúdo registrado em uma fonte documental.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Livro das Crônicas dos Reis de Judá
  rationale: Reproduz o título descritivo da fonte régia citada em Reis; “Crônicas” comunica o sentido arquivístico de דִּבְרֵי הַיָּמִים, enquanto a nota esclarece que não se trata necessariamente do livro bíblico canônico de Crônicas.
theological_decisions:
- issue: Identidade do documento citado
  choice: Manter o título “Livro das Crônicas dos Reis de Judá” sem identificá-lo com o livro bíblico de Crônicas
  alternative: Entender a referência como indicação direta de 1–2 Crônicas
  rationale: O hebraico apresenta uma fonte documental régia citada repetidamente em Reis, mas não estabelece sua identidade com a obra canônica posterior. A tradução e a nota preservam essa distinção histórica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A formulação conserva a pergunta retórica do hebraico e evita acrescentar um marcador discursivo como “Ora” ou “Quanto a”.
