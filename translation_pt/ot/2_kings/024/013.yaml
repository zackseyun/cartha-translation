language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: pt
  text: E ele levou dali[a] todos os tesouros da Casa de Yahweh e os tesouros da casa do rei. Também cortou em pedaços todos os utensílios de ouro que Salomão, rei de Israel, tinha feito no santuário de Yahweh[b], exatamente como Yahweh havia falado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “fez sair dali” ou “tirou dali”.
    reason: lexical_alternative
  - marker: b
    text: No início do versículo, o hebraico diz literalmente “Casa de Yahweh”; aqui emprega outra palavra, que pode se referir mais especificamente ao edifício do templo ou ao santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: levou dali
  rationale: O hifil de יצא expressa a retirada dos objetos daquele lugar. “Levou dali” é natural em português e mantém tanto o movimento para fora quanto a ideia contextual de remoção.
- source_word: אוֹצְרוֹת
  choice: tesouros
  rationale: No contexto de saque, o termo designa os bens valiosos retirados, e não principalmente os depósitos onde eram guardados.
- source_word: בֵּית יְהוָה
  choice: Casa de Yahweh
  rationale: A tradução conserva de modo transparente a expressão hebraica e permite distingui-la de הֵיכַל, empregado mais adiante no versículo.
- source_word: בֵּית הַמֶּלֶךְ
  choice: casa do rei
  rationale: Mantém o paralelismo lexical com “Casa de Yahweh” e permanece compreensível como referência à residência ou ao palácio real.
- source_word: וַיְקַצֵּץ
  choice: cortou em pedaços
  rationale: O piel de קצץ descreve concretamente o ato de cortar ou seccionar os objetos, sem substituir a imagem por uma formulação mais interpretativa.
- source_word: כְּלֵי הַזָּהָב
  choice: utensílios de ouro
  rationale: כְּלִי é um termo amplo para objetos e utensílios; no contexto do culto, “utensílios” é claro e idiomático em português.
- source_word: עָשָׂה
  choice: tinha feito
  rationale: O mais-que-perfeito explicita naturalmente que a fabricação por Salomão ocorreu antes da destruição narrada.
- source_word: בְּהֵיכַל יְהוָה
  choice: no santuário de Yahweh
  rationale: הֵיכַל refere-se aqui ao edifício sagrado ou santuário. A escolha também preserva a distinção lexical em relação a בֵּית יְהוָה no início do versículo.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: exatamente como Yahweh havia falado
  rationale: A formulação preserva a correspondência entre o acontecimento e a palavra divina anterior, com o valor anterior de דִּבֶּר expresso naturalmente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo por um título.
- issue: Relação entre o saque e a palavra anterior de Yahweh
  choice: exatamente como Yahweh havia falado
  alternative: como Yahweh havia dito
  rationale: A tradução preserva a afirmação de cumprimento sem especificar neste versículo qual pronunciamento anterior está em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Casa” recebe inicial maiúscula apenas na designação cultual “Casa de Yahweh”; “casa do rei” permanece em minúsculas. A coordenação foi dividida em duas frases para maior clareza, sem alterar a sequência narrativa.
