  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: pt
  text: E Yahweh enviou contra ele bandos[a] dos caldeus, bandos de Aram[b], bandos de Moabe e bandos dos amonitas. Ele os enviou contra Judá para destruí-lo[c], conforme a palavra de Yahweh, que ele havia falado por meio de seus servos, os profetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destacamentos de saqueadores”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Aram”; tradicionalmente, “Síria”.'
    reason: lexical_alternative
  - marker: c
    text: 'O pronome pode referir-se a Judá ou a Jeoaquim: “para destruir Judá” ou “para destruir Jeoaquim”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: enviou
  rationale: Tradução corrente de שלח na prosa narrativa, preservando a ação direta de Yahweh sem especificar além do texto como ela foi executada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em conformidade com a orientação do projeto.
- source_word: בּוֹ
  choice: contra ele
  rationale: No contexto de ação militar hostil, בְּ com שלח indica que a ação foi dirigida contra Jeoaquim.
- source_word: גְּדוּדֵי
  choice: bandos
  rationale: O termo designa grupos armados, provavelmente destacamentos de saqueadores, e não necessariamente exércitos nacionais completos; a repetição de 'bandos' acompanha a estrutura enfática do hebraico.
- source_word: כַשְׂדִּים
  choice: caldeus
  rationale: Mantém o etnônimo específico do hebraico, sem substituí-lo pelo termo historicamente relacionado, porém mais amplo, 'babilônios'.
- source_word: אֲרָם
  choice: Aram
  rationale: Preserva o nome hebraico do território ou povo, em vez do exônimo tradicional 'Síria'.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma portuguesa corrente e reconhecível do nome bíblico.
- source_word: בְנֵי עַמּוֹן
  choice: amonitas
  rationale: Etnônimo idiomático em português para a expressão hebraica literalmente equivalente a 'filhos de Amom'.
- source_word: וַיְשַׁלְּחֵם
  choice: Ele os enviou
  rationale: Conserva a repetição do verbo presente no hebraico, que dá ênfase e faz a narrativa avançar.
- source_word: בִּיהוּדָה
  choice: contra Judá
  rationale: Embora a preposição possa significar 'em' ou 'para dentro de', o contexto militar e a finalidade expressa tornam 'contra Judá' a formulação portuguesa mais clara.
- source_word: לְהַאֲבִידוֹ
  choice: para destruí-lo
  rationale: O pronome masculino singular português conserva de modo natural a possibilidade de referência tanto a Judá quanto a Jeoaquim, sem resolver uma ambiguidade genuína do hebraico.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: Formulação digna e clara que preserva a fórmula profética do texto-fonte.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: por meio de seus servos, os profetas
  rationale: Traduz idiomaticamente a expressão hebraica 'pela mão de', que aqui indica mediação ou agência.
theological_decisions:
- issue: Referente do sufixo em לְהַאֲבִידוֹ
  choice: Manter no texto a ambiguidade com 'para destruí-lo', tendo Judá como referente contextual mais provável.
  alternative: 'Entender o pronome exclusivamente como referência pessoal a Jeoaquim: ''para destruir o rei''.'
  rationale: Judá aparece imediatamente antes e constitui o alvo coletivo do juízo no contexto, mas o sufixo masculino singular também pode retomar Jeoaquim. Como 'Judá' e 'Jeoaquim' admitem o pronome masculino em português, a tradução pode conservar a tensão sem impor uma solução.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'bandos' e de 'enviou' foi mantida para refletir a estrutura hebraica. O pronome em 'destruí-lo' preserva deliberadamente a ambiguidade do texto-fonte.
