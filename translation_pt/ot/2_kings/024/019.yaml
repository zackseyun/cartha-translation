base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh, conforme tudo o que Jeoaquim havia feito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol dá continuidade à narrativa; em português, o conectivo inicial pode ser omitido sem perda do sentido.
- source_word: הָרַע
  choice: o que era mau
  rationale: A expressão idiomática עשה הרע indica praticar aquilo que é moralmente mau; esta formulação é natural e preserva a avaliação do texto.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém a metáfora hebraica de avaliação segundo a perspectiva de alguém, em expressão corrente e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Preserva tanto a ideia de correspondência quanto a força abrangente de כֹּל.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito composto esclarece naturalmente em português que os atos de Jeoaquim antecederam a conduta aqui avaliada.
- source_word: יְהוֹיָקִים
  choice: Jeoaquim
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o caráter de nome pessoal, sem substituí-lo por um título nem adotar outra vocalização tradicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção conserva o idiomatismo bíblico “aos olhos de” sem soar excessivamente literal.
