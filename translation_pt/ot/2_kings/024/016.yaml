base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: pt
  text: E todos os homens valentes, sete mil, e os artesãos e os ferreiros,[a] mil — todos eles homens fortes, aptos para a guerra[b] —, o rei da Babilônia levou ao exílio, para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os artífices e os trabalhadores de metal”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que fazem a guerra”, isto é, aptos para o serviço militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: homens de guerra
  rationale: No contexto da deportação e da posterior descrição como homens capazes de guerrear, a expressão designa homens fortes e militarmente úteis. “Homens de guerra” é natural e evita o tom arcaico de “homens de valor”.
- source_word: שִׁבְעַת אֲלָפִים
  choice: sete mil
  rationale: Tradução direta da expressão numérica hebraica.
- source_word: הֶחָרָשׁ
  choice: os artesãos
  rationale: O termo designa trabalhadores especializados e não identifica necessariamente um único ofício; “artesãos” conserva essa amplitude.
- source_word: הַמַּסְגֵּר
  choice: os ferreiros
  rationale: O termo provavelmente indica trabalhadores de metal ou ferreiros. A nota registra a alternativa mais ampla sem restringi-lo a “serralheiros”.
- source_word: אֶלֶף
  choice: mil
  rationale: Indica o total conjunto dos artesãos e ferreiros.
- source_word: הַכֹּל
  choice: todos eles
  rationale: Retoma e resume os grupos enumerados, deixando clara essa função no português.
- source_word: גִּבּוֹרִים
  choice: homens valentes
  rationale: Conserva a ideia de homens fortes e capazes, com conotação militar, sem repetir imediatamente “homens de guerra”.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: capazes de guerrear
  rationale: A expressão literalmente fala dos que “fazem a guerra”, mas aqui caracteriza homens aptos para o serviço militar.
- source_word: וַיְבִיאֵם
  choice: levou
  rationale: Embora o verbo básico seja “trazer”, o movimento narrado parte de Judá rumo à Babilônia; “levou” é a forma natural em português nesse enquadramento.
- source_word: גּוֹלָה
  choice: para o exílio
  rationale: O substantivo funciona adverbialmente e expressa o resultado da deportação.
- source_word: בָּבֶלָה
  choice: na Babilônia
  rationale: O hebraico traz direção para a Babilônia. Depois de “levou para o exílio”, “na Babilônia” comunica naturalmente o destino e evita a sequência pesada “para o exílio para a Babilônia”.
