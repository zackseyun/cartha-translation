base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: pt
  text: Ele deportou Joaquim para a Babilônia, junto com a mãe do rei[a], as esposas do rei, seus oficiais da corte[b] e os homens de destaque da terra[c]; levou-os de Jerusalém para o exílio na Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “a rainha-mãe”; o hebraico diz literalmente “a mãe do rei”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus eunucos”. O termo hebraico pode se referir especificamente a eunucos ou, de modo mais geral, a oficiais da corte.
    reason: lexical_alternative
  - marker: c
    text: Ou “os poderosos da terra” ou “os nobres da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: deportou
  rationale: O hifil de גלה indica fazer alguém partir para o exílio. “Deportou” expressa com naturalidade o afastamento forçado, enquanto a segunda oração mantém explicitamente a ideia de exílio.
- source_word: בָּבֶלָה
  choice: para a Babilônia
  rationale: O ה direcional indica movimento em direção à Babilônia; a preposição “para” reproduz esse sentido em português corrente.
- source_word: אֵם הַמֶּלֶךְ
  choice: a mãe do rei
  rationale: Tradução direta da relação familiar expressa no hebraico, sem transformar necessariamente a expressão em um título oficial.
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: as esposas do rei
  rationale: O plural construto designa aqui as mulheres que eram esposas do rei. A repetição de “do rei” acompanha a estrutura enfática da enumeração hebraica.
- source_word: סָרִיסָיו
  choice: seus oficiais da corte
  rationale: סָרִיס pode designar especificamente eunucos ou, de modo mais amplo, funcionários ligados à corte. A tradução comunica a função provável sem decidir de forma indevida sua condição física.
- source_word: אֵילֵי הָאָרֶץ
  choice: os homens de destaque da terra
  rationale: A expressão se refere aos homens fortes, poderosos ou proeminentes do país. “Homens de destaque” comunica a posição social sem restringir o sentido à força militar.
- source_word: הוֹלִיךְ גּוֹלָה
  choice: levou-os ... para o exílio
  rationale: A combinação verbal descreve fazer pessoas seguirem como exiladas. A formulação natural em português conserva explicitamente o motivo do exílio.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: de Jerusalém ... na Babilônia
  rationale: A construção marca o ponto de origem e o destino. Com “levou-os para o exílio”, “na Babilônia” apresenta de modo idiomático o lugar de destino.
