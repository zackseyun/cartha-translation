  text: בֶּן עֶשְׂרִ֨ים וְ/אַחַ֤ת שָׁנָה֙ צִדְקִיָּ֣הוּ בְ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חמיטל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: pt
  text: Zedequias tinha vinte e um anos quando começou a reinar e reinou onze anos em Jerusalém. Sua mãe se chamava Hamutal[a] e era filha de Jeremias, de Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também grafado Hamital em algumas traduções.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: tinha vinte e um anos
  rationale: Converte o idiomatismo hebraico literalmente 'filho de vinte e um anos' em português natural, preservando com exatidão a idade.
- source_word: בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: O infinitivo construto com בְּ situa temporalmente o início do reinado; esta formulação é clara e tradicional em português.
- source_word: מָלַךְ
  choice: reinou
  rationale: Traduz diretamente o verbo que designa o exercício do reinado.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Reproduz o uso locativo da preposição hebraica.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Expressa em português moderno e natural a fórmula régia hebraica 'e o nome de sua mãe era'.
- source_word: חמיטל
  choice: Hamutal
  rationale: Translitera o nome próprio conforme a vocalização massorética; 'Hamital' é uma variante gráfica usada em algumas traduções.
- source_word: בַּת יִרְמְיָהוּ
  choice: filha de Jeremias
  rationale: Traduz diretamente a expressão genealógica de filiação.
- source_word: מִלִּבְנָה
  choice: de Libna
  rationale: A preposição מִן indica procedência; em português, 'de Libna' comunica naturalmente a origem e preserva a possível associação do complemento com Jeremias.
