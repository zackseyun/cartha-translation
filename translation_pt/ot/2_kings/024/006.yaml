  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: pt
  text: E Jeoaquim adormeceu com seus antepassados[a], e Joaquim, seu filho, tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “morreu”. O hebraico diz literalmente “adormeceu com seus antepassados”, fórmula habitual para indicar a morte de um rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No idioma régio formado com עִם אֲבֹתָיו, o verbo indica a morte. “Descansou” preserva a imagem hebraica de modo digno e compreensível em português, sem reduzi-la diretamente à glosa interpretativa “morreu”.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: “Antepassados” comunica naturalmente o sentido coletivo de אָבוֹת em português atual e evita que “pais” seja entendido apenas como os genitores imediatos.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: Neste relato de sucessão, o verbo assinala a ascensão ao trono; “tornou-se rei” expressa esse início melhor que “reinou”, que pode destacar a duração do governo.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Tradução direta da designação filial.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Em contexto dinástico, a expressão indica substituição e sucessão no trono; “em seu lugar” é clara e idiomática.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: Jeoaquim / Joaquim
  rationale: Empregam-se as formas portuguesas bíblicas amplamente reconhecidas para esses nomes distintos.
theological_decisions:
- issue: Tradução da fórmula régia de morte sem acrescentar informação sobre sepultamento
  choice: Manter no texto a imagem idiomática “descansou com seus antepassados”.
  alternative: Traduzir de forma interpretativa como “morreu” ou ampliar para “morreu e foi sepultado com seus antepassados”.
  rationale: O hebraico emprega uma fórmula convencional para a morte, mas este versículo não afirma explicitamente que Jeoaquim foi sepultado com seus antepassados. A formulação escolhida preserva a imagem da fonte e não acrescenta detalhes.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “antepassados” em vez do potencialmente ambíguo “pais”. A coordenação simples reproduz o andamento conciso do aviso de sucessão.
