  text: וְ/הִגְלָ֣ה אֶת כָּל יְ֠רוּשָׁלִַם וְֽ/אֶת כָּל הַ/שָּׂרִ֞ים וְ/אֵ֣ת כָּל גִּבּוֹרֵ֣י הַ/חַ֗יִל עשרה אֲלָפִים֙ גּוֹלֶ֔ה וְ/כָל הֶ/חָרָ֖שׁ וְ/הַ/מַּסְגֵּ֑ר לֹ֣א נִשְׁאַ֔ר זוּלַ֖ת דַּלַּ֥ת עַם הָ/אָֽרֶץ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: pt
  text: Levou para o exílio toda Jerusalém, todos os oficiais e todos os guerreiros valentes — dez mil exilados —, bem como todos os artesãos e ferreiros[a]. Não ficou ninguém, exceto os mais pobres do povo da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trabalhadores em metal”; o termo hebraico tradicionalmente traduzido por “ferreiros” pode designar de modo mais amplo profissionais que trabalhavam com metais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  choice: Levou para o exílio
  rationale: O hifil de גלה indica fazer alguém ir para o exílio. A formulação expressa com clareza a deportação forçada e mantém o tom narrativo.
- source_word: כָּל יְרוּשָׁלִַם
  choice: toda Jerusalém
  rationale: Mantém a metonímia hebraica, na qual a cidade representa sua população e sua estrutura dirigente, sem sugerir que os edifícios tenham sido transportados.
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: שׂרים pode designar príncipes, autoridades ou comandantes. “Oficiais” abrange aqui a elite governante sem restringir o sentido a membros da família real.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: os guerreiros valentes
  rationale: A expressão designa homens de reconhecida capacidade e valor militar. Esta tradução é natural em português e preserva seu caráter elevado.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: dez mil exilados
  rationale: גולה funciona coletivamente para os deportados. “Exilados” conserva a ligação lexical com o ato de levar para o exílio e comunica a remoção da população.
- source_word: הֶחָרָשׁ
  choice: os artesãos
  rationale: חָרָשׁ é um termo amplo para trabalhadores especializados; “artesãos” preserva essa abrangência.
- source_word: הַמַּסְגֵּר
  choice: ferreiros
  rationale: A tradução tradicional se ajusta ao provável campo da metalurgia, mas a especialização exata do termo é incerta; por isso, registra-se uma alternativa mais ampla em nota.
- source_word: לֹא נִשְׁאַר
  choice: Não ficou ninguém
  rationale: Expressa naturalmente em português o nifal, que indica que nenhuma pessoa dos grupos em vista permaneceu.
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: exceto os mais pobres do povo da terra
  rationale: דלת designa a camada pobre ou vulnerável. A formulação mantém tanto o sentido socioeconômico quanto a construção partitiva do hebraico.
theological_decisions: []
