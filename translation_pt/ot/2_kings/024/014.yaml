  register: Português moderno, claro e digno, com legibilidade brasileira. A metonímia “toda Jerusalém” e a expressão histórica “povo da terra” foram preservadas; travessões indicam que “dez mil exilados” funciona como especificação do grupo deportado sem resolver além do texto a extensão exata dessa contagem.
