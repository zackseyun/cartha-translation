base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: pt
  text: Pois foi por causa da ira de Yahweh que isso aconteceu em Jerusalém e em Judá, até que ele os expulsou de sua presença.[a] E Zedequias se rebelou contra o rei da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois a ira de Yahweh estava contra Jerusalém e Judá, até que ele os expulsou de diante de si.” A primeira oração em hebraico é condensada e pode ser traduzida mais formalmente dessa maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação causal ligada ao contexto anterior; em português, “Pois” preserva naturalmente essa ligação sem a redundância de “pois porque”.
- source_word: עַל אַף יְהוָה
  choice: por causa da ira de Yahweh
  rationale: A expressão idiomática indica a ira divina; “ira” mantém sua força, e o nome próprio יהוה é transliterado como “Yahweh”.
- source_word: הָיְתָה
  choice: isso aconteceu
  rationale: O verbo feminino singular ocorre sem sujeito expresso numa construção hebraica condensada. “Isso aconteceu” é claro e evita definir além do texto qual situação específica está em vista.
- source_word: בִירוּשָׁלִַם וּבִיהוּדָה
  choice: em Jerusalém e em Judá
  rationale: Mantém o valor locativo mais direto da preposição ב.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: até que ele os expulsou
  rationale: Expressa o limite ou desfecho da situação e conserva a força do ato de remoção.
- source_word: מֵעַל פָּנָיו
  choice: de sua presença
  rationale: Tradução idiomática de “de diante de sua face”, indicando afastamento da presença divina.
- source_word: וַיִּמְרֹד
  choice: E ... se rebelou
  rationale: מרד denota rebelião contra uma autoridade; a construção pronominal é natural em português.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: contra o rei da Babilônia
  rationale: Com מרד, a preposição ב tem sentido adversativo, expresso naturalmente por “contra”.
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Relação entre a ira divina, a situação de Jerusalém e Judá e a expulsão
  choice: A ira de Yahweh é apresentada como a causa da situação que culminou na expulsão.
  alternative: “A ira de Yahweh estava contra Jerusalém e Judá, até que ele os expulsou de diante de si.”
  rationale: A sintaxe hebraica é condensada e admite uma formulação mais locativa ou uma leitura em que a ira está dirigida contra Jerusalém e Judá. O texto principal mantém a sequência causal sem especificar mais do que o hebraico.
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. A formulação conserva a ambiguidade da primeira oração, registrando em nota a alternativa mais formal.
