  text: וַ/יֵּצֵ֞א יְהוֹיָכִ֤ין מֶֽלֶךְ יְהוּדָה֙ עַל מֶ֣לֶךְ בָּבֶ֔ל ה֣וּא וְ/אִמּ֔/וֹ וַ/עֲבָדָ֖י/ו וְ/שָׂרָ֣י/ו וְ/סָֽרִיסָ֑י/ו וַ/יִּקַּ֤ח אֹת/וֹ֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַ֥ת שְׁמֹנֶ֖ה לְ/מָלְכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: pt
  text: Então Joaquim, rei de Judá, saiu ao encontro do rei da Babilônia — ele, sua mãe, seus servos, seus oficiais e seus eunucos[a] —, e o rei da Babilônia o tomou no oitavo ano de seu reinado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus funcionários da corte”; o termo hebraico pode designar tanto eunucos em sentido literal como, de modo mais amplo, oficiais da corte real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Mantém o sentido básico de יצא sem explicitar como “rendeu-se”, embora o contexto de cerco sugira que Joaquim se apresentou ao rei babilônico.
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: ao encontro do rei da Babilônia
  rationale: Com o verbo “sair”, expressa em português o movimento em direção ao rei da Babilônia sem converter a ação explicitamente em rendição.
- source_word: הוּא וְאִמּוֹ
  choice: ele, sua mãe
  rationale: Conserva a retomada enfática do sujeito e introduz com naturalidade o grupo que o acompanhava.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: “Servos” preserva o valor amplo de עבד, que neste contexto pode incluir servidores ou membros subordinados da corte.
- source_word: שָׂרָיו
  choice: seus oficiais
  rationale: O termo designa pessoas em posição elevada de liderança; “oficiais” é atual, amplo e adequado ao contexto régio.
- source_word: סָרִיסָיו
  choice: seus eunucos
  rationale: Traduz de modo direto o termo distinto סריס, sem o confundir com שרים (“oficiais”); uma nota registra que ele também pode designar funcionários da corte.
- source_word: וַיִּקַּח אֹתוֹ
  choice: o tomou
  rationale: Mantém o verbo comum לקח, “tomar”, deixando que o contexto comunique a submissão e custódia, sem tornar explícito “capturou” ou “prendeu”.
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: no oitavo ano de seu reinado
  rationale: Reproduz a construção cronológica de maneira idiomática. No contexto, o pronome se refere mais naturalmente ao rei da Babilônia, antecedente e sujeito mais próximo.
theological_decisions:
- issue: Referente de “seu reinado” na nota cronológica final
  choice: o reinado do rei da Babilônia
  alternative: o reinado de Joaquim
  rationale: O antecedente sintático imediato é o rei da Babilônia, e a cronologia do capítulo favorece o ano régio de Nabucodonosor. A redação com “seu” conserva, porém, a forma pronominal concisa do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os travessões delimitam a enumeração retomada por “ele” e evitam uma sequência sintática pesada. Evitou-se traduzir “saiu” como “rendeu-se” e “o tomou” como “capturou”, para não explicitar além do hebraico.
