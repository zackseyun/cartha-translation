base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: pt
  text: 'Nos seus dias, Nabucodonosor, rei da Babilônia, avançou, e Jeoaquim tornou-se seu servo durante três anos[a]. Depois, voltou atrás[b] e se rebelou contra ele.


    [a] Ou: “tornou-se seu vassalo durante três anos”. O hebraico diz literalmente “tornou-se servo dele”, expressão política que indica submissão a um soberano.


    [b] Ou: “mudou de posição”. O verbo hebraico significa literalmente “voltou” e, neste contexto, provavelmente indica que Jeoaquim reverteu sua lealdade antes de se rebelar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se seu vassalo durante três anos”. O hebraico diz literalmente “tornou-se servo dele”, expressão política que indica submissão a um soberano.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mudou de posição”. O verbo hebraico significa literalmente “voltou” e, neste contexto, provavelmente indica que Jeoaquim reverteu sua lealdade antes de se rebelar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Nos seus dias
  rationale: Preserva a expressão temporal hebraica e indica o período de governo ou vida do rei mencionado anteriormente.
- source_word: עָלָה
  choice: avançou
  rationale: O verbo significa literalmente “subiu” ou “veio subindo”; em contexto geopolítico e militar, “avançou” comunica naturalmente o movimento de Nabucodonosor sem acrescentar um objeto ausente no hebraico.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta e natural da construção hebraica.
- source_word: וַיְהִי לוֹ יְהוֹיָקִים עֶבֶד
  choice: Jeoaquim tornou-se seu servo
  rationale: A construção narrativa indica a entrada de Jeoaquim numa condição de sujeição. “Servo” mantém o termo hebraico, enquanto a nota esclarece seu sentido político.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: durante três anos
  rationale: Expressa de modo idiomático em português a duração indicada pelo hebraico.
- source_word: וַיָּשָׁב
  choice: Depois, voltou atrás
  rationale: Mantém a ideia básica de voltar ou reverter e comunica, no contexto, a mudança de lealdade de Jeoaquim.
- source_word: וַיִּמְרָד בּוֹ
  choice: e se rebelou contra ele
  rationale: Traduz claramente a rebelião contra um governante superior.
