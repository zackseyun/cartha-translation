source:
  edition: WLC
  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: pt
  text: De fato, isso sobreveio a Judá por ordem de Yahweh, para afastá-los de diante de sua face[a], por causa dos pecados de Manassés, conforme tudo o que ele havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da sua presença”.'
    reason: Alternativa idiomática para a expressão hebraica literalmente ligada à face de Yahweh.
lexical_decisions:
- source_word: אַךְ
  choice: De fato
  rationale: Neste contexto, a partícula introduz uma afirmação enfática e explicativa, não uma restrição; “De fato” expressa isso naturalmente em português.
- source_word: עַל פִּי
  choice: por ordem de
  rationale: O idioma, literalmente “segundo a boca de”, indica que o acontecimento se deu por determinação de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal de modo coerente com a evidência hebraica e com a prática do projeto.
- source_word: הָיְתָה בִּיהוּדָה
  choice: isso sobreveio a Judá
  rationale: A construção é elíptica e remete ao juízo descrito no contexto. “Sobreveio a Judá” comunica a ocorrência adversa sem explicá-la excessivamente.
- source_word: לְהָסִיר
  choice: para afastá-los
  rationale: 'O infinitivo causativo de סור indica remoção ou afastamento. O objeto, implícito no hebraico, é expresso pelo pronome plural conforme o referente contextual: o povo de Judá.'
- source_word: מֵעַל פָּנָיו
  choice: de diante de sua face
  rationale: Preserva a imagem concreta hebraica ligada à expulsão da presença divina; uma formulação mais idiomática aparece em nota.
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  choice: por causa dos pecados de Manassés
  rationale: A preposição tem valor causal, e o plural “pecados” representa naturalmente o conjunto de transgressões atribuídas a Manassés.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: conforme tudo o que ele havia feito
  rationale: Mantém a ideia de correspondência expressa por כְּכֹל e situa as ações de Manassés como anteriores ao juízo narrado.
theological_decisions:
- issue: Objeto implícito do afastamento
  choice: Expressar o objeto como “-los”, referindo-se contextualmente ao povo de Judá.
  alternative: Deixar o objeto sem expressão ou empregar o singular, referindo-se a Judá como entidade coletiva.
  rationale: O hebraico não explicita o objeto de לְהָסִיר, mas o contexto trata da rejeição de Judá e Jerusalém. O plural torna a frase natural em português sem acrescentar um referente estranho ao contexto.
- issue: Linguagem da presença divina
  choice: Conservar no texto a expressão concreta “de diante de sua face”.
  alternative: “da sua presença”.
  rationale: A formulação mantém a imagem antropomórfica do hebraico e seu peso teológico, sem negar que o sentido idiomático é afastamento da presença de Yahweh.
- issue: Agência divina no juízo
  choice: Traduzir עַל פִּי יְהוָה como “por ordem de Yahweh”.
  alternative: “segundo a palavra de Yahweh”.
  rationale: A expressão atribui o acontecimento à determinação divina. “Por ordem de” comunica essa agência claramente, sem ampliar as razões oferecidas pelo texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A imagem “de diante de sua face” foi mantida deliberadamente, enquanto a elipse hebraica foi esclarecida apenas no grau necessário à leitura.
