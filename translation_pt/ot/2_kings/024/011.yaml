base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/011.yaml
  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: pt
  text: E Nabucodonosor, rei da Babilônia, veio contra a cidade enquanto seus servos a sitiavam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «seus servos» pode se referir aos oficiais, agentes ou forças que estavam a serviço do rei da Babilônia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio
  rationale: O wayyiqtol de בוא é o verbo narrativo simples «veio»; com עַל e no contexto militar, «veio contra» expressa o movimento hostil.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do rei babilônio.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta da cadeia construta que identifica o cargo e o reino de Nabucodonosor.
- source_word: עַל הָעִיר
  choice: contra a cidade
  rationale: Com um verbo de aproximação hostil e em contexto de cerco, עַל tem sentido adversativo, bem expresso por «contra».
- source_word: וַעֲבָדָיו
  choice: seus servos
  rationale: Preserva o sentido amplo de עבדים sem especificar indevidamente se eram oficiais, agentes ou tropas do rei.
- source_word: צָרִים
  choice: sitiavam
  rationale: O particípio de צור descreve uma ação de cerco em andamento, simultânea à chegada de Nabucodonosor.
- source_word: עָלֶיהָ
  choice: a
  rationale: O pronome retoma «cidade»; em português, o verbo «sitiar» rege objeto direto, tornando natural o pronome «a».
theological_decisions: []
