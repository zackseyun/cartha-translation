  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/009.yaml
  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh, conforme tudo o que seu pai havia feito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol qal de עשה dá continuidade à narrativa com valor de passado simples. Em português, omitir o «e» inicial produz uma frase mais natural sem perder a sequência narrativa.
- source_word: הָרַע
  choice: o que era mau
  rationale: O adjetivo com artigo funciona como substantivo na fórmula recorrente de Reis. «Fez o que era mau» transmite o sentido com naturalidade e dignidade.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Preserva a imagem do idioma hebraico e expressa a avaliação segundo a perspectiva de Yahweh em português corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּכֹל
  choice: conforme tudo o que
  rationale: A preposição comparativa כְּ com כֹּל indica correspondência com a totalidade da conduta paterna; esta formulação mantém a força abrangente.
- source_word: אֲשֶׁר
  choice: o que
  rationale: Liga naturalmente «tudo» à oração relativa em português.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito composto explicita de modo natural que os atos do pai antecederam os do filho.
- source_word: אָבִיו
  choice: seu pai
  rationale: Tradução direta do substantivo com sufixo pronominal masculino singular, sem ambiguidade no contexto.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal mediante transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A fórmula hebraica «aos olhos de» foi mantida por ser compreensível e preservar a linguagem avaliativa característica de Reis.
