id: 2KI.24.10
reference: 2 Kings 24:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא עלה עַבְדֵ֛י נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָ֑ם וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: pt
  text: Naquele tempo, os servos de Nabucodonosor, rei da Babilônia, subiram contra Jerusalém[a], e a cidade ficou sob cerco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, «subiram a Jerusalém»; a expressão hebraica pode refletir tanto a elevação do lugar quanto o avanço militar.
    reason: lexical_alternative
  - marker: b
    text: Ou «a cidade foi sitiada». Mais literalmente, o hebraico diz que «a cidade entrou em cerco», o que pode destacar o início do cerco.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressa de modo natural o enquadramento temporal e preserva a força dêitica da expressão hebraica.
- source_word: עָלָה
  choice: subiram contra
  rationale: Preserva tanto a ideia de subida em direção a Jerusalém quanto, pelo uso de «contra», o avanço militar indicado pelo contexto.
- source_word: עַבְדֵי
  choice: servos
  rationale: Mantém o sentido amplo do hebraico para pessoas sob a autoridade do rei, sem especificá-las indevidamente como oficiais ou tropas.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Tradução direta e natural do título real em construção genitiva.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalém
  rationale: Forma consagrada do topônimo em português.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: e a cidade ficou sob cerco
  rationale: Formulação idiomática em português que conserva a nuance ingressiva do hebraico, isto é, o início da condição de cerco.
- source_word: מָצוֹר
  choice: cerco
  rationale: Equivalente militar corrente, claro e preciso em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Servos» preserva a generalidade do hebraico, enquanto «ficou sob cerco» comunica naturalmente o começo da situação sem tornar a frase excessivamente literal.
