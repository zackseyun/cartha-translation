base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: pt
  text: O rei da Babilônia fez Matanias, tio de Joaquim, reinar em seu lugar[a] e mudou o nome dele para Zedequias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nomeou Matanias, tio de Joaquim, rei em seu lugar”. O verbo hebraico é causativo e indica que o rei da Babilônia o instalou como rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: fez ... reinar
  rationale: 'O hifil de מלך é causativo: o rei babilônico instalou Matanias como rei. A formulação preserva diretamente essa força causativa e soa natural em português.'
- source_word: מֶלֶךְ בָּבֶל
  choice: o rei da Babilônia
  rationale: A construção identifica de modo direto o agente da entronização.
- source_word: מַתַּנְיָה
  choice: Matanias
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: דֹדוֹ
  choice: tio de Joaquim
  rationale: O sufixo pronominal remete ao rei deposto mencionado no contexto, Joaquim. Explicitar o referente evita ambiguidade em português sem alterar a relação indicada pelo hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: 'No contexto de entronização, תחת expressa substituição ou sucessão: Matanias passa a ocupar o lugar de Joaquim.'
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  choice: mudou o nome dele
  rationale: Com 'nome' como objeto, סבב tem o sentido idiomático de mudar ou alterar o nome.
- source_word: צִדְקִיָּהוּ
  choice: Zedequias
  rationale: Forma tradicional portuguesa do nome hebraico.
