  text: וְ/גַ֤ם דַּֽם הַ/נָּקִי֙ אֲשֶׁ֣ר שָׁפָ֔ךְ וַ/יְמַלֵּ֥א אֶת יְרוּשָׁלִַ֖ם דָּ֣ם נָקִ֑י וְ/לֹֽא אָבָ֥ה יְהוָ֖ה לִ/סְלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: pt
  text: e também por causa do sangue inocente que ele havia derramado[a], pois havia enchido Jerusalém de sangue inocente. E Yahweh não quis perdoar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o sangue dos inocentes».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: e também
  rationale: Preserva tanto a ligação com o contexto anterior quanto a força aditiva da expressão hebraica.
- source_word: דַּם הַנָּקִי
  choice: sangue inocente
  rationale: Expressa de modo natural em português a culpa decorrente da morte injusta de inocentes; a definitude pode ser entendida pelo contexto sem artigo obrigatório.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: que ele havia derramado
  rationale: Em associação com sangue, שׁפך corresponde ao idioma português «derramar sangue»; o mais-que-perfeito composto marca adequadamente a ação anterior.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: pois havia enchido Jerusalém de sangue inocente
  rationale: O conector «pois» torna explícita a relação explicativa natural no contexto, e «encher de» é a construção idiomática corrente em português.
- source_word: וְלֹא אָבָה
  choice: E ... não quis
  rationale: אָבָה denota vontade ou consentimento. «Não quis» é conciso, natural e mantém a atribuição direta de recusa sem a suavizar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לִסְלֹחַ
  choice: perdoar
  rationale: É o equivalente moderno e claro para o verbo hebraico de perdão ou indulto divino.
theological_decisions:
- issue: A recusa divina de perdoar diante da culpa pelo sangue derramado
  choice: «Yahweh não quis perdoar»
  alternative: «Yahweh não perdoaria»
  rationale: A formulação preserva a afirmação severa e direta do hebraico, sem explicar além do texto o alcance ou a duração dessa recusa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva a repetição enfática de «sangue inocente» e usa o nome divino Yahweh.
