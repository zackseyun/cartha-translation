  verdict: revise
  source_fidelity: 'A redação preserva adequadamente a sentença dirigida a Geazi: a afecção de Naamã aderirá a ele e à sua descendência permanentemente, e ele sai da presença de Eliseu afetado e branco como a neve. A identificação explícita de Geazi é contextual e não altera o sentido. Contudo, “ficará apegada” é uma realização pouco idiomática do hebraico תדבק neste contexto.'
  naturalness: “Ficará apegada a você” soa calcado e pouco natural em português contemporâneo. “Se apegará a você” transmite com clareza a imagem de adesão persistente e mantém o registro solene. “Com a doença” também é menos preciso como predicação final; “afetado por uma doença de pele” torna a condição explicitamente qualificativa sem diagnosticá-la como hanseníase.
  terminology: “Doença de pele”, “descendência”, “para sempre”, “Naamã” e “Geazi” são adequados. A nota deve manter a distinção entre a terminologia hebraica e a hanseníase moderna, sem apresentar “lepra” como diagnóstico médico.
  issues:
