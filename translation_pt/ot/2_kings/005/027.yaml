  text: וְ/צָרַ֤עַת נַֽעֲמָן֙ תִּֽדְבַּק בְּ/ךָ֔ וּֽ/בְ/זַרְעֲ/ךָ לְ/עוֹלָ֑ם וַ/יֵּצֵ֥א מִ/לְּ/פָנָ֖י/ו מְצֹרָ֥ע כַּ/שָּֽׁלֶג־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/027.yaml
  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: pt
  text: Portanto, a doença de pele de Naamã se apegará a você e à sua descendência para sempre”. E Geazi saiu da presença dele afetado por uma doença de pele, branco como a neve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרַעַת
  choice: doença de pele
  rationale: O termo hebraico abrange diferentes afecções graves da pele e condições de impureza ritual, não necessariamente a hanseníase moderna. A expressão é clara e evita precisão médica anacrônica.
- source_word: נַעֲמָן
  choice: Naamã
  rationale: Forma consagrada do nome próprio em português.
- source_word: תִּדְבַּק
  choice: ficará apegada
  rationale: Preserva a imagem de algo que adere persistentemente, expressa pelo verbo דבק, e funciona com naturalidade no contexto da sentença.
- source_word: בְּךָ
  choice: a você
  rationale: Com o verbo escolhido, a construção portuguesa natural é “apegada a você”.
- source_word: וּבְזַרְעֲךָ
  choice: e à sua descendência
  rationale: זֶרַע designa aqui a posteridade; “descendência” é natural, digna e evita o literalismo ambíguo de “semente”.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa de maneira direta a duração contínua da sentença no contexto.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Tradução direta e natural do verbo narrativo, que descreve movimento para fora.
- source_word: מִלְּפָנָיו
  choice: da presença dele
  rationale: Reproduz idiomaticamente a expressão hebraica “de diante da face/presença dele”, cujo referente é Eliseu.
- source_word: מְצֹרָע
  choice: com a doença
  rationale: Mantém a ligação com צָרַעַת sem identificar indevidamente a condição como hanseníase; em português, é mais natural do que “doente” antes da descrição “branco como a neve”.
- source_word: כַּשָּׁלֶג
  choice: branco como a neve
  rationale: Explicita o ponto de comparação implícito no hebraico — a brancura — sem acrescentar uma ideia estranha ao contexto.
theological_decisions:
- issue: Tradução de צָרַעַת / מְצֹרָע
  choice: doença de pele / com a doença
  alternative: lepra / leproso
  rationale: O texto apresenta uma afecção imposta como juízo e transmitida à descendência, mas o hebraico não exige sua identificação com a hanseníase moderna. A formulação ampla preserva a natureza da condição sem impor um diagnóstico anacrônico; a tradução tradicional é registrada em nota.
- issue: Identificação do sujeito de וַיֵּצֵא
  choice: Geazi saiu
  alternative: ele saiu
  rationale: O sujeito está implícito no hebraico e é Geazi pelo contexto. Nomeá-lo em português evita ambiguidade referencial sem alterar o sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Descendência” preserva o tom solene sem arcaísmo; “Geazi” explicita o sujeito contextual para evitar ambiguidade. A nota mantém a tradução tradicional acessível ao leitor.
