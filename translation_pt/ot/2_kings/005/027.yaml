    issue: 'Construção pouco idiomática: “ficará apegada a você”.'
    rationale: Embora inteligível, a construção é pouco natural para uma doença em português moderno. “Se apegará a você” corresponde melhor à imagem verbal de דבק e à fluência do registro.
  - severity: low
    issue: Predicação final pouco definida em “saiu ... com a doença”.
    rationale: A expressão pode funcionar por retomada, mas “afetado por uma doença de pele” exprime mais diretamente o valor de מְצֹרָע, preservando a amplitude semântica do hebraico.
  revised_text: Portanto, a doença de pele de Naamã se apegará a você e à sua descendência para sempre”. E Geazi saiu da presença dele afetado por uma doença de pele, branco como a neve.
