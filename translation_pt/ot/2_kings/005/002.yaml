  source_fidelity: O texto traduz adequadamente o hebraico. “Os arameus” explicita os agentes humanos de Arã requeridos pelos verbos plurais; “tinham saído em grupos de ataque” comunica bem a ação de incursão em plano de fundo; e “levado cativa” preserva a noção de captura para cativeiro. “Da terra de Israel” mantém a formulação geográfica do original. A expressão “uma menina ainda pequena” reproduz de modo natural a ênfase de נערה קטנה, e “ficou a serviço da mulher de Naamã” transmite corretamente o valor idiomático de estar ‘diante de’ alguém como assistente ou servidora.
