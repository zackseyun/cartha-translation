  text: וַ/אֲרָם֙ יָצְא֣וּ גְדוּדִ֔ים וַ/יִּשְׁבּ֛וּ מֵ/אֶ֥רֶץ יִשְׂרָאֵ֖ל נַעֲרָ֣ה קְטַנָּ֑ה וַ/תְּהִ֕י לִ/פְנֵ֖י אֵ֥שֶׁת נַעֲמָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: pt
  text: Os arameus tinham saído em grupos de ataque e levado cativa da terra de Israel uma menina ainda pequena[a]; ela ficou a serviço da mulher de Naamã.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma menina muito jovem”. A expressão hebraica enfatiza sua pouca idade e pequenez.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “ela ficou diante da mulher de Naamã”, isto é, passou a atendê-la ou servi-la.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם
  choice: Os arameus
  rationale: Embora o hebraico nomeie literalmente Arã, o verbo no plural e o contexto indicam seus combatentes; o gentílico explicita naturalmente os agentes humanos.
- source_word: יָצְאוּ גְדוּדִים
  choice: tinham saído em grupos de ataque
  rationale: O mais-que-perfeito apresenta a incursão como ação de fundo anterior à situação narrada, e “grupos de ataque” comunica o sentido militar de גְדוּדִים sem sugerir um exército regular completo.
- source_word: וַיִּשְׁבּוּ
  choice: levado cativa
  rationale: O verbo se refere especificamente a capturar alguém e levá-lo ao cativeiro, nuance preservada pela expressão portuguesa.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: da terra de Israel
  rationale: Mantém a formulação geográfica explícita do hebraico.
- source_word: נַעֲרָה קְטַנָּה
  choice: uma menina ainda pequena
  rationale: A expressão salienta juventude e pequenez. “Ainda pequena” é natural em português e evita introduzir no sintagma a condição de serva, que só aparece na oração seguinte.
- source_word: וַתְּהִי לִפְנֵי
  choice: ela ficou a serviço
  rationale: A expressão significa literalmente que ela “esteve diante de” alguém, mas, neste contexto, indica que passou a atendê-la ou servi-la.
- source_word: אֵשֶׁת נַעֲמָן
  choice: da mulher de Naamã
  rationale: Forma portuguesa natural que preserva a relação expressa pela construção hebraica.
