  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר חַי יְהוָ֛ה אֲשֶׁר עָמַ֥דְתִּי לְ/פָנָ֖י/ו אִם אֶקָּ֑ח וַ/יִּפְצַר בּ֥/וֹ לָ/קַ֖חַת וַ/יְמָאֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: pt
  text: 'Ele, porém, disse: “Tão certo como vive Yahweh[a], perante quem estou[b], não aceitarei isso”. Naamã insistiu com ele para que aceitasse, mas Eliseu recusou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Fórmula hebraica de juramento. A construção completa diz literalmente: “Vive Yahweh... se eu aceitar”, sendo que “se” expressa aqui uma forte negação: “certamente não aceitarei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em cuja presença estou”. A expressão também pode sugerir serviço prestado diante de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Reproduz em português natural a fórmula hebraica solene de juramento, preservando sua força asseverativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: perante quem estou
  rationale: Mantém a imagem hebraica de estar diante de alguém, com sua conotação de presença e serviço profético, sem reduzi-la apenas a “a quem sirvo”.
- source_word: אִם אֶקָּח
  choice: não aceitarei isso
  rationale: Em fórmulas de juramento, אִם introduz uma negação enfática elíptica. “Isso” retoma naturalmente a oferta de Naamã no contexto; “aceitar” explicita que se trata de receber o presente.
- source_word: וַיִּפְצַר בּוֹ
  choice: insistiu com ele
  rationale: Expressa a pressão ou insistência forte indicada por פצר em português corrente.
- source_word: לָקַחַת
  choice: para que aceitasse
  rationale: Completa naturalmente o verbo “insistir” e retoma a aceitação da oferta sem repetição pesada.
- source_word: וַיְמָאֵן
  choice: recusou
  rationale: É a tradução direta e natural da recusa decidida expressa por מאן.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de “estar perante” Yahweh
  choice: perante quem estou
  alternative: a quem sirvo
  rationale: A formulação mantém tanto a linguagem de presença quanto a possível conotação de serviço profético, sem resolver a expressão em apenas uma dessas dimensões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Os nomes “Naamã” e “Eliseu” esclarecem os referentes dos pronomes hebraicos sem alterar o sentido narrativo. A pontuação preserva a solenidade do juramento e a fluidez do relato.
