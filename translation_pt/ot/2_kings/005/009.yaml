  yaml_path: translation/ot/2_kings/005/009.yaml
  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: pt
  text: Então Naamã veio com seus cavalos e carros de guerra[a] e parou à entrada da casa de Eliseu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “com seu cavalo e com seu carro”; as formas no singular provavelmente têm sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio
  rationale: No encadeamento narrativo, בוא indica a chegada de Naamã ao lugar onde Eliseu estava; “veio” preserva de modo simples e natural esse movimento.
- source_word: נַעֲמָן
  choice: Naamã
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּסוּסוֹ
  choice: com seus cavalos
  rationale: Embora a forma hebraica seja singular, o substantivo pode ter sentido coletivo no contexto da comitiva militar de Naamã; o plural é natural em português.
- source_word: וּבְרִכְבּוֹ
  choice: e carros de guerra
  rationale: רֶכֶב pode designar um carro ou coletivamente os carros. Aqui, em paralelo com os cavalos e no contexto militar, “carros de guerra” comunica o referente sem confundi-lo com automóveis modernos.
- source_word: וַיַּעֲמֹד
  choice: parou
  rationale: עמד significa literalmente “ficou de pé”, mas aqui descreve Naamã detendo-se e permanecendo diante da casa; “parou” é a expressão narrativa mais natural em português.
- source_word: פֶּתַח הַבַּיִת
  choice: à entrada da casa
  rationale: פֶּתַח designa a abertura ou entrada; esta formulação é corrente e preserva a localização junto ao limiar.
- source_word: לֶאֱלִישָׁע
  choice: de Eliseu
  rationale: 'A preposição ל־ indica aqui associação ou posse: a casa pertencente a Eliseu.'
