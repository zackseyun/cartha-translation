revisions:
- from: 'Quando o rei de Israel leu a carta, rasgou as suas roupas e disse: “Por acaso sou Deus, capaz de matar e dar vida, para que este homem me mande curar um homem da sua lepra?[a] Prestem atenção, por favor, e vejam como ele está procurando motivo para brigar comigo”.[b]'
  to: 'Quando o rei de Israel leu a carta, rasgou as suas roupas e disse: “Por acaso sou Deus, para matar e dar vida, que este homem me escreve pedindo que eu cure alguém da sua lepra?[a] Prestem atenção, por favor, e vejam como ele está procurando motivo para brigar comigo[b].”'
  rationale: A revisão substitui uma construção portuguesa sintaticamente ambígua por uma formulação que expressa com clareza que o remetente escreveu ao rei solicitando uma cura, conforme o contexto narrativo da carta e a força de שֹׁלֵחַ אֵלַי. Mantêm-se o caráter retórico da pergunta, o paralelismo morte/vida, a referência não especificada a “alguém” e a ambiguidade da intenção hostil. As duas notas foram preservadas, com a segunda ancorada diretamente na expressão que ela esclarece.
