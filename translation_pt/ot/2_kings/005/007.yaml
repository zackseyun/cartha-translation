  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: pt
  text: 'Quando o rei de Israel leu a carta, rasgou as suas roupas e disse: “Por acaso sou Deus, para matar e dar vida, que este homem me escreve pedindo que eu cure alguém da sua lepra?[a] Prestem atenção, por favor, e vejam como ele está procurando motivo para brigar comigo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar diversas doenças graves de pele, não necessariamente a hanseníase.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como ele está procurando um pretexto contra mim” ou “buscando uma ocasião contra mim”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: a carta
  rationale: No contexto narrativo, סֵפֶר designa a mensagem escrita enviada pelo rei da Síria; “carta” é a forma natural e precisa em português.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: rasgou as suas roupas
  rationale: Preserva literalmente o gesto convencional de angústia ou consternação, em linguagem moderna.
- source_word: הַאֱלֹהִים אָנִי
  choice: Por acaso sou Deus
  rationale: A pergunta retórica contrasta o rei com Deus, a quem pertence o poder sobre a vida e a morte; “por acaso” comunica naturalmente a força retórica.
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: capaz de matar e dar vida
  rationale: Mantém o paralelismo dos infinitivos e expressa com clareza a prerrogativa divina, sem tornar a frase artificial em português.
- source_word: שֹׁלֵחַ אֵלַי
  choice: me mande
  rationale: No contexto da carta, o particípio indica que o remetente exige do rei de Israel uma ação; a formulação portuguesa explicita naturalmente essa relação.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: curar um homem da sua lepra
  rationale: אָסַף com מִן e uma enfermidade tem sentido idiomático de livrar ou recuperar alguém dessa condição; “curar” comunica esse sentido diretamente.
- source_word: צָּרַעַת
  choice: lepra
  rationale: Mantém o termo tradicional e reconhecível na narrativa, enquanto uma nota esclarece que o vocábulo hebraico não identifica necessariamente a hanseníase.
- source_word: אַךְ דְּעוּ נָא וּרְאוּ
  choice: Prestem atenção, por favor, e vejam
  rationale: Reproduz o apelo enfático e os dois imperativos em português natural, preservando também a partícula cortês נָא.
- source_word: מִתְאַנֶּה הוּא לִי
  choice: ele está procurando motivo para brigar comigo
  rationale: Expressa a ideia de buscar uma ocasião para conflito ou provocação; a nota conserva a alternativa mais formal de procurar um pretexto contra alguém.
theological_decisions:
- issue: Sentido de הָאֱלֹהִים na pergunta do rei
  choice: sou Deus
  alternative: sou um deus
  rationale: No contexto israelita e na associação imediata com matar e dar vida, a pergunta alude à prerrogativa do próprio Deus, não apenas à de uma divindade genérica.
- issue: Identificação de צָרַעַת
  choice: lepra
  alternative: doença grave de pele
  rationale: O termo tradicional favorece continuidade e reconhecimento, mas a nota evita atribuir ao hebraico uma precisão médica que ele não possui.
- issue: Natureza da suspeita expressa por מִתְאַנֶּה
  choice: procurando motivo para brigar comigo
  alternative: procurando um pretexto contra mim
  rationale: A expressão principal comunica a suspeita de provocação hostil sem definir além do texto se o objetivo era uma discussão, confronto ou ação política.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica foi formulada de modo oral e natural; o paralelismo sobre morte e vida e a ambiguidade da intenção hostil foram preservados.
