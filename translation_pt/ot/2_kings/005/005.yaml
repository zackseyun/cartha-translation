  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ אֲרָם֙ לֶךְ בֹּ֔א וְ/אֶשְׁלְחָ֥ה סֵ֖פֶר אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יֵּלֶךְ֩ וַ/יִּקַּ֨ח בְּ/יָד֜/וֹ עֶ֣שֶׂר כִּכְּרֵי כֶ֗סֶף וְ/שֵׁ֤שֶׁת אֲלָפִים֙ זָהָ֔ב וְ/עֶ֖שֶׂר חֲלִיפ֥וֹת בְּגָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: pt
  text: 'Então o rei de Aram[b] disse: “Vá, pois,[a] e eu enviarei uma carta ao rei de Israel”. Naamã foi e levou consigo dez talentos de prata, seis mil peças de ouro[c] e dez mudas de roupa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “Vá, venha”; a combinação dos dois imperativos provavelmente expressa pronta autorização ou incentivo.
    reason: lexical_alternative
  - marker: b
    text: “Aram” é o nome hebraico; em algumas traduções, é tradicionalmente vertido como “Síria”.
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “seis mil de ouro”. A unidade contada não é declarada explicitamente; “peças” foi acrescentado para dar naturalidade à frase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: Vá, pois
  rationale: Os dois imperativos, literalmente “vá, venha”, formam aqui uma expressão idiomática de pronta autorização e incentivo. “Vá, pois” comunica esse sentido em português natural, enquanto a nota preserva a forma hebraica.
- source_word: סֵפֶר
  choice: uma carta
  rationale: No contexto diplomático, o termo designa uma comunicação escrita enviada de um rei a outro; “carta” é a opção mais natural e precisa.
- source_word: בְּיָדוֹ
  choice: levou consigo
  rationale: A expressão significa literalmente “em sua mão”, mas pode indicar aquilo que alguém leva em sua posse. “Levou consigo” expressa esse sentido com naturalidade em português.
- source_word: כִּכְּרֵי כֶסֶף
  choice: talentos de prata
  rationale: כִּכָּר é uma antiga unidade de peso. Manter “talentos” evita uma conversão moderna incerta e segue o uso bíblico consolidado.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: seis mil peças de ouro
  rationale: O hebraico traz o número seguido de “ouro”, sem nomear explicitamente a unidade contada. “Peças” torna a frase natural sem especificar indevidamente uma unidade monetária.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: mudas de roupa
  rationale: A expressão se refere a conjuntos de vestuário para troca, frequentemente oferecidos como presentes valiosos. “Mudas de roupa” é conciso e compreensível.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Aram
  rationale: Mantém o nome hebraico do reino, em vez de substituí-lo pelo equivalente geográfico tradicional “Síria”.
