  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: pt
  text: 'Mas ele entrou e pôs-se diante de seu senhor. Então Eliseu lhe perguntou: “De onde você vem, Geazi?”[a] Ele respondeu: “Seu servo não foi a lugar nenhum.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “De onde, Geazi?”'
    reason: lexical_alternative
  - marker: b
    text: 'Expressão idiomática hebraica: “Seu servo não foi nem para cá nem para lá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Mas ele
  rationale: A conjunção com o pronome dá continuidade à narrativa com leve contraste em relação às ações secretas de Geazi.
- source_word: בָא
  choice: entrou
  rationale: O verbo significa literalmente “veio”, mas, no contexto, Geazi entra para se apresentar diante de Eliseu; “entrou” expressa esse movimento naturalmente.
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: ficou diante de seu senhor
  rationale: Preserva a postura de Geazi na presença de seu superior, em linguagem natural e digna.
- source_word: אֲדֹנָיו
  choice: seu senhor
  rationale: Refere-se a Eliseu como superior humano de Geazi, não como título divino; “senhor” mantém a relação social indicada pelo hebraico.
- source_word: מֵאָן
  choice: De onde você vem
  rationale: A expressão pergunta literalmente pela procedência. Em português, “De onde você vem?” é natural no contexto e mantém mais de perto a forma hebraica do que uma paráfrase sobre onde ele esteve.
- source_word: גֵּחֲזִי
  choice: Geazi
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: Seu servo não foi
  rationale: Conserva a forma deferente e autorreferencial “seu servo”, importante para o tom da resposta de Geazi.
- source_word: אָנֶה וָאָנָה
  choice: a lugar nenhum
  rationale: Traduz naturalmente o sentido idiomático de não ter ido a parte alguma, enquanto a formulação literal é registrada em nota.
