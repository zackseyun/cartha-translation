base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: pt
  text: 'E ele respondeu: “Está tudo bem.[a] Meu senhor me enviou para dizer: ‘Veja, acabam de chegar até mim dois jovens da região montanhosa de Efraim, dentre os filhos dos profetas.[b] Por favor, dê a eles um talento[c] de prata e duas mudas de roupa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Paz” ou “Tudo vai bem”. Aqui, o hebraico shalom é usado como uma garantia de que não há problema algum.
    reason: lexical_alternative
  - marker: b
    text: “Filhos dos profetas” é uma expressão hebraica usual para os membros de uma comunidade ou grupo de profetas.
    reason: cultural_note
  - marker: c
    text: O talento era uma grande unidade de peso usada para metais preciosos.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Está tudo bem
  rationale: No diálogo, o termo funciona como uma garantia de que não há nenhum problema, e não primariamente como saudação ou referência abstrata à paz.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Expressa a relação de Geazi com Eliseu de modo natural e respeitoso, sem atribuir sentido divino ao termo.
- source_word: שְׁלָחַנִי
  choice: me enviou
  rationale: O perfeito hebraico apresenta o envio como ação concluída; o pretérito perfeito é natural no discurso direto em português.
- source_word: הִנֵּה עַתָּה זֶה
  choice: Veja, acabam de
  rationale: “Veja” preserva o marcador de atenção, enquanto “acabam de” comunica a forte ideia de imediatidade do conjunto hebraico.
- source_word: נְעָרִים
  choice: jovens
  rationale: O termo pode designar rapazes, servos ou auxiliares; aqui, por serem membros de uma comunidade profética, “jovens” evita especificação indevida.
- source_word: מֵהַר אֶפְרַיִם
  choice: da região montanhosa de Efraim
  rationale: A expressão designa a zona elevada de Efraim, não necessariamente uma única montanha.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: dentre os filhos dos profetas
  rationale: Mantém a expressão técnica hebraica e sua textura histórica, com nota explicativa para o leitor moderno.
- source_word: תְּנָה נָּא
  choice: Por favor, dê
  rationale: O imperativo com נָא formula um pedido cortês; esta é a construção corrente em português.
- source_word: כִּכַּר כֶּסֶף
  choice: um talento de prata
  rationale: “Talento” preserva com precisão a antiga unidade de peso, sem convertê-la especulativamente em valor monetário moderno.
- source_word: חֲלִפוֹת בְּגָדִים
  choice: mudas de roupa
  rationale: A expressão se refere a conjuntos de vestuário para troca; “mudas de roupa” é clara, concisa e idiomática.
theological_decisions: []
