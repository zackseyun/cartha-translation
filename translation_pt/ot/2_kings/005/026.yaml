source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: pt
  text: 'Mas ele lhe disse[a]: “Por acaso meu coração não foi com você quando aquele homem se virou de sua carruagem para ir ao seu encontro? Será este o momento de receber prata e roupas, olivais e vinhas, ovelhas e bois, servos e servas[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo: “Eu não estava lá em espírito quando aquele homem se virou de sua carruagem para ir ao seu encontro?”'
    reason: lexical_alternative
  - marker: b
    text: Ou “escravos e escravas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: meu coração não foi com você
  rationale: Preserva a imagem hebraica do coração que acompanha alguém, exprimindo a percepção interior de Eliseu sem substituí-la diretamente por uma explicação como “eu estava lá em espírito”. “Com você” explicita o complemento naturalmente pressuposto no contexto e em português.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: quando aquele homem se virou de seu carro para ir ao seu encontro
  rationale: Mantém o sentido básico de הָפַךְ, “virar-se”, e a referência contextual a Naamã sem inserir seu nome. “Aquele homem” torna natural em português a referência específica de אִישׁ.
- source_word: הָעֵת
  choice: Será este o momento
  rationale: Expressa como pergunta retórica a censura implícita no hebraico, conservando o presente e a ideia de que aquela ocasião era imprópria.
- source_word: לָקַחַת אֶת־הַכֶּסֶף
  choice: receber prata
  rationale: “Prata” conserva o termo concreto כֶּסֶף, enquanto “receber” comunica naturalmente, neste contexto, a aceitação dos bens oferecidos, sem sugerir necessariamente furto.
- source_word: בְּגָדִים
  choice: roupas
  rationale: Termo moderno, claro e digno para peças de vestuário, sem acrescentar a ideia não expressa de mudas de roupa.
- source_word: זֵיתִים
  choice: olivais
  rationale: No inventário de propriedades produtivas, o plural aponta naturalmente para plantações de oliveiras; “olivais” é conciso e forma bom par com “vinhas”.
- source_word: כְרָמִים
  choice: vinhas
  rationale: Equivalente português corrente para terrenos plantados de videiras e apropriado à enumeração de propriedades agrícolas.
- source_word: צֹאן וּבָקָר
  choice: ovelhas e bois
  rationale: Conserva os substantivos concretos do hebraico. “Bois” funciona aqui como termo coletivo tradicional e compreensível para gado bovino.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: servos e servas
  rationale: Preserva a distinção de gênero e o registro doméstico da enumeração. Como os termos podem abranger serviço sujeito ou escravizado, a alternativa mais explícita é registrada em nota.
theological_decisions:
- issue: Sentido da presença ou percepção de Eliseu em לִבִּי הָלַךְ
  choice: Preservar a expressão figurada “meu coração não foi com você”
  alternative: “Eu não estava lá em espírito?”
  rationale: A formulação literal mantém a ambiguidade entre percepção interior, acompanhamento mental e presença espiritual, evitando definir o mecanismo profético além do que o texto afirma.
- issue: Condição social indicada por עֲבָדִים וּשְׁפָחוֹת
  choice: servos e servas
  alternative: escravos e escravas
  rationale: Os termos hebraicos têm amplitude semântica dependente do contexto. A tradução principal evita resolver em excesso a condição jurídica das pessoas, enquanto a nota preserva a leitura mais forte e historicamente possível.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é digno e direto. A construção figurada “meu coração não foi com você” foi mantida deliberadamente, com esclarecimento interpretativo em nota; “olivais e vinhas” apresenta de modo conciso as propriedades agrícolas.
