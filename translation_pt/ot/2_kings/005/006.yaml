  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: pt
  text: 'Ele levou a carta ao rei de Israel, na qual estava escrito: “Agora, quando esta carta chegar às suas mãos, saiba que lhe enviei Naamã, meu servo, para que o livre[a] de sua doença de pele[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega uma expressão incomum, literalmente “o recolha de sua doença de pele”; o sentido é livrá-lo ou curá-lo dessa aflição.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “lepra”. O termo hebraico pode designar várias doenças de pele e não corresponde necessariamente à hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Ele levou
  rationale: O hifil de בוא tem הַסֵּפֶר como objeto e indica que ele fez a carta chegar ao destinatário. “Levou” reproduz naturalmente esse sentido sem acrescentar a ideia mais específica de entrega formal.
- source_word: הַסֵּפֶר
  choice: a carta
  rationale: Neste contexto diplomático, סֵפֶר designa uma comunicação escrita entre reis; “carta” é o equivalente moderno mais claro.
- source_word: לֵאמֹר
  choice: na qual estava escrito
  rationale: A fórmula introduz o conteúdo da carta. Esta formulação evita que “dizendo” pareça atribuir a fala oralmente ao mensageiro, sem alterar o referente do texto citado.
- source_word: וְעַתָּה
  choice: Agora
  rationale: Conserva a função discursiva da fórmula epistolar em português natural; o “e” inicial não é necessário para representar seu valor.
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: quando esta carta chegar às suas mãos
  rationale: A construção com כְּ e infinitivo é temporal. “Chegar às suas mãos” expressa de modo idiomático a chegada da carta ao destinatário.
- source_word: הִנֵּה
  choice: saiba que
  rationale: Neste documento real, הִנֵּה chama a atenção do destinatário para a informação seguinte. “Saiba que” preserva essa força em registro formal e corrente, sem o arcaísmo de “eis que”.
- source_word: שָׁלַחְתִּי
  choice: lhe enviei
  rationale: O perfeito é apropriado como ação já realizada do ponto de vista de quem escreveu a carta; o pronome marca naturalmente o destinatário em português.
- source_word: נַעֲמָן
  choice: Naamã
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: עֶבֶד, em linguagem de corte, pode designar um subordinado ou oficial do rei. “Servo” mantém o termo amplo sem especificar indevidamente sua condição jurídica ou função.
- source_word: וַאֲסַפְתּוֹ
  choice: para que o livre
  rationale: Embora אסף normalmente signifique “reunir, recolher”, sua construção incomum com מן e a enfermidade comunica aqui a remoção do mal. “Livre” oferece português inteligível, preserva a imagem de separação e evita explicitar além do texto o mecanismo da cura; a expressão literal é registrada em nota.
- source_word: מִצָּרַעְתּוֹ
  choice: de sua doença de pele
  rationale: צָרַעַת abrange afecções que não correspondem necessariamente à hanseníase moderna. “Doença de pele” evita precisão médica anacrônica, enquanto a tradução tradicional consta em nota.
theological_decisions:
- issue: Sentido da expressão וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: para que o livre de sua doença de pele
  alternative: para que o cure de sua lepra; literalmente, para que o recolha de sua doença de pele
  rationale: A construção hebraica é incomum e sua imagem não produz uma expressão compreensível se calcada literalmente em português. “Livre” comunica a remoção da aflição sem apagar a peculiaridade do original, que é preservada em nota, nem definir como o rei deveria realizar isso.
- issue: Identificação de צָרַעַת
  choice: doença de pele
  alternative: lepra
  rationale: O termo bíblico é mais amplo que a hanseníase moderna. A tradução principal evita uma identificação médica indevida, mas conserva a forma tradicional na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais tanto no Brasil quanto em outros contextos lusófonos. A fala mantém o tom formal de uma carta régia sem recorrer a arcaísmos. Os pronomes de terceira pessoa permitem tratamento respeitoso sem impor “tu” ou “você”.
