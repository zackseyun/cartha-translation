  source_fidelity: 'A tradução reproduz com fidelidade o sentido do hebraico: a carta é levada ao rei de Israel e comunica o envio de Naamã para ser liberto de sua aflição cutânea. «Para que o livre» expressa de modo contextual e adequado a construção incomum וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ, sem impor uma explicação médica ou um mecanismo de cura.'
