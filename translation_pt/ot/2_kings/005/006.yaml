  terminology: «Naamã» e «meu servo» são escolhas estabelecidas e adequadas. «Doença de pele» evita identificar צָרַעַת de forma anacrônica com a hanseníase moderna; a nota preserva corretamente «lepra» como a forma tradicional. As notas estão ancoradas nos termos pertinentes e explicam tanto a expressão verbal incomum quanto a questão lexical de צָרַעַת.
