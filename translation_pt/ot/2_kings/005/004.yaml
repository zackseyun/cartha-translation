  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: pt
  text: 'Então ele entrou e contou ao seu senhor: “Isto e aquilo[a] foi o que a moça da terra de Israel disse.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão idiomática hebraica que também pode ser traduzida por “assim e assim” ou “tal e tal”; resume o que ela disse sem repeti-lo palavra por palavra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ele foi
  rationale: בוא pode significar vir, ir ou entrar conforme o ponto de vista. Aqui, a sequência narrativa favorece “foi”, sem acrescentar explicitamente a ideia de entrada.
- source_word: וַיַּגֵּד
  choice: contou
  rationale: O Hifil de נגד significa contar, relatar ou dar a conhecer. “Contou” é corrente em português e preserva o ato de transmitir a informação.
- source_word: לַאדֹנָיו
  choice: ao seu senhor
  rationale: אָדוֹן pode designar senhor, mestre ou superior. “Seu senhor” mantém a relação hierárquica sem especificá-la além do hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz discurso direto. Em português atual, os dois-pontos desempenham essa função de modo natural, sem exigir o mais rígido “dizendo”.
- source_word: כָּזֹאת וְכָזֹאת
  choice: isto e aquilo
  rationale: A expressão idiomática resume o que foi dito sem repetir as palavras. “Isto e aquilo” conserva a forma distributiva e soa compreensível em português moderno.
- source_word: דִּבְּרָה
  choice: disse
  rationale: דבר é o verbo comum para falar; “disse” encaixa-se naturalmente na oração que relata o conteúdo da fala.
- source_word: הַנַּעֲרָה
  choice: a moça
  rationale: נַעֲרָה designa uma menina, jovem ou moça. “Moça” é natural e não acrescenta aqui a condição de serva, que este termo isoladamente não explicita.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: que é da terra de Israel
  rationale: A tradução mantém a oração relativa e o substantivo אֶרֶץ, preservando a identificação geográfica expressa no hebraico.
