  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: pt
  text: Quando chegou à colina[a], tomou-os das mãos deles e os guardou[b] na casa. Depois, despediu os homens, e eles foram embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao outeiro” ou “à elevação fortificada”; hebraico: “ao Ofel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os depositou” ou “os pôs em segurança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: a colina
  rationale: עֹפֶל pode designar uma elevação, um outeiro ou uma colina fortificada. Neste contexto, o sentido topográfico é o mais provável; “colina” é claro e natural sem tratar necessariamente o termo como nome próprio.
- source_word: מִיָּדָם
  choice: das mãos deles
  rationale: A expressão hebraica significa literalmente “da mão deles” e indica que Geazi recebeu diretamente os objetos que os homens carregavam. O plural idiomático em português conserva a imagem e soa natural.
- source_word: וַיִּפְקֹד
  choice: os guardou
  rationale: Neste contexto, פקד indica colocar os objetos em algum lugar para mantê-los guardados ou em segurança. “Guardou” comunica esse sentido em português corrente sem especificar além do texto.
- source_word: בַּבָּיִת
  choice: na casa
  rationale: בית designa aqui, de modo mais natural, a casa como o local físico onde os objetos foram guardados.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O hebraico usa o termo geral “homens”. Embora fossem acompanhantes de Naamã, o versículo não os chama especificamente de servos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Os pronomes em “tomou-os” e “os guardou” preservam a referência implícita no hebraico aos objetos recebidos, enquanto “foram embora” expressa naturalmente o encerramento da ação.
