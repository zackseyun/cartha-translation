base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/019.yaml
  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: pt
  text: 'Então Eliseu lhe disse: “Vá em paz.” Naamã se afastou dele e percorreu certa distância.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “uma extensão de terra”. A expressão hebraica indica uma distância percorrida sem especificar uma medida exata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Então Eliseu lhe disse
  rationale: O wayyiqtol dá continuidade à narrativa. Os nomes, claros pelo contexto imediato, evitam em português a sequência ambígua de dois pronomes masculinos.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Vá em paz
  rationale: Reproduz de maneira natural a fórmula hebraica de despedida e bênção, preservando tanto o imperativo quanto o sentido de שָׁלוֹם.
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: Naamã se afastou dele
  rationale: Expressa a partida de Naamã da presença de Eliseu sem acrescentar motivação ou interpretação.
- source_word: כִּבְרַת אָרֶץ
  choice: percorreu certa distância
  rationale: A expressão indica uma extensão de percurso não quantificada. “Certa distância” evita tanto uma medida precisa quanto a ideia não exigida de uma distância necessariamente grande.
theological_decisions:
- issue: A resposta de Eliseu ao pedido anterior de Naamã relacionado ao templo de Rimom
  choice: Manter apenas a fórmula “Vá em paz”
  alternative: Explicitar aprovação ou reprovação da conduta proposta por Naamã
  rationale: O hebraico apresenta uma bênção ou despedida convencional, mas não declara expressamente uma avaliação moral. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com formas naturais de narrativa. A explicitação de Eliseu e Naamã resolve a ambiguidade pronominal que seria pouco natural em português sem alterar os referentes do contexto.
