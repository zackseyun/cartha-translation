  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו אֱלִישָׁ֖ע מַלְאָ֣ךְ לֵ/אמֹ֑ר הָל֗וֹךְ וְ/רָחַצְתָּ֤ שֶֽׁבַע פְּעָמִים֙ בַּ/יַּרְדֵּ֔ן וְ/יָשֹׁ֧ב בְּשָׂרְ/ךָ֛ לְ/ךָ֖ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: pt
  text: 'Então Eliseu lhe enviou um mensageiro, dizendo: “Vá e lave-se sete vezes no Jordão. Sua carne lhe será restaurada[a], e você ficará limpo[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua carne voltará a ser como antes”. O idioma hebraico descreve a restauração à condição saudável anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “você será purificado”. O verbo pode indicar tornar-se limpo ou puro, com possíveis sentidos físicos e rituais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: lhe enviou
  rationale: Expressa de modo natural a ação de enviar alguém a Naamã e preserva a direção indicada pelo pronome hebraico.
- source_word: מַלְאָךְ
  choice: mensageiro
  rationale: Neste contexto narrativo, refere-se claramente a um intermediário humano, não a um ser celestial.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz as palavras transmitidas pelo mensageiro.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: Vá e lave-se
  rationale: Reproduz a força imperativa da construção hebraica e soa natural em português atual.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Correspondência direta e clara da expressão numérica hebraica.
- source_word: בַּיַּרְדֵּן
  choice: no Jordão
  rationale: Forma tradicional e natural em português para o nome do rio; o contexto torna desnecessário acrescentar “rio”.
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: Sua carne lhe será restaurada
  rationale: Comunica a restauração da carne à condição saudável anterior, sem perder a linguagem corporal concreta do hebraico.
- source_word: וּטְהָר
  choice: e você ficará limpo
  rationale: Preserva o sentido resultativo de tornar-se limpo e mantém abertas tanto a dimensão física quanto a possível ressonância de pureza.
theological_decisions:
- issue: Se בָּשָׂר deve ser traduzido como “carne” ou suavizado para “corpo”
  choice: carne
  alternative: corpo
  rationale: “Carne” conserva a imagem corporal concreta do hebraico e continua plenamente compreensível no contexto da cura.
- issue: Se טהר deve receber formulação explicitamente ritual ou uma expressão mais ampla
  choice: você ficará limpo
  alternative: você será purificado
  rationale: A formulação escolhida não limita o verbo à cura física nem impõe exclusivamente uma leitura ritual, preservando sua amplitude semântica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” para clareza do discurso dirigido a Naamã. A pontuação divide naturalmente a ordem e os resultados prometidos, sem eliminar a relação entre eles.
