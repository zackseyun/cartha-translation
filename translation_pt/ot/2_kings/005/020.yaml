source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: pt
  text: 'Mas Geazi, servo de Eliseu, o homem de Deus, disse: “Vejam! Meu senhor poupou Naamã, este arameu, não tomando da mão dele o que ele trouxe. Tão certo como Yahweh vive,[a] correrei atrás dele e tomarei dele alguma coisa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Vive Yahweh”, fórmula usada em juramentos solenes.'
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: servo
  rationale: No contexto da relação de Geazi com Eliseu, indica sua função de servidor ou auxiliar, sem enfatizar necessariamente a idade.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém de forma transparente o título profético convencional do hebraico.
- source_word: הִנֵּה
  choice: Vejam só!
  rationale: Reproduz a força enfática e reativa da partícula em português atual e natural.
- source_word: חָשַׂךְ ... מִקַּחַת
  choice: poupou ... não aceitando
  rationale: Expressa tanto a ideia de poupar Naamã quanto a ação específica da qual Eliseu se absteve; 'aceitar' é natural para receber uma oferta, embora o hebraico diga literalmente 'tomar da mão'.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Designa Eliseu como superior de Geazi e preserva o registro respeitoso sem sugerir referência divina.
- source_word: הָאֲרַמִּי
  choice: arameu
  rationale: Representa diretamente a designação étnico-geopolítica hebraica, evitando o anacrônico 'sírio'.
- source_word: אֵת אֲשֶׁר הֵבִיא
  choice: o que ele trouxe
  rationale: Tradução direta e idiomática da oração relativa.
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Comunica em português corrente a fórmula hebraica de juramento e preserva o nome divino.
- source_word: רַצְתִּי אַחֲרָיו
  choice: correrei atrás dele
  rationale: Mantém a imagem vívida da corrida e, no contexto do juramento, expressa a intenção imediata de Geazi.
- source_word: וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה
  choice: e conseguirei alguma coisa dele
  rationale: Comunica a intenção pragmática de obter algo de Naamã; evita que 'tomar' soe necessariamente como roubo direto.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome pessoal no corpo do juramento sem substituí-lo por um título.
- issue: Força da fórmula חַי יְהוָה
  choice: 'juramento: “Tão certo como Yahweh vive”'
  alternative: 'afirmação simples: “Yahweh vive”'
  rationale: A construção seguida por כִּי אִם introduz uma declaração enfática de intenção; no contexto, funciona como fórmula de juramento, não apenas como afirmação sobre Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem hebraica “Naamã, esse arameu” foi preservada em sentido, mas pontuada naturalmente. A expressão idiomática “tomar da mão dele” foi vertida como “aceitar”, enquanto a fórmula de juramento foi explicitada sem eliminar sua imagem original.
