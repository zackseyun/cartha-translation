revisions:
- from: 'Mas Geazi, servo de Eliseu, o homem de Deus, disse: “Vejam só! Meu senhor poupou Naamã, esse arameu, não aceitando o que ele trouxe. Tão certo como Yahweh vive,[a] correrei atrás dele e conseguirei alguma coisa dele.”'
  to: 'Mas Geazi, servo de Eliseu, o homem de Deus, disse: “Vejam! Meu senhor poupou Naamã, este arameu, não tomando da mão dele o que ele trouxe. Tão certo como Yahweh vive,[a] correrei atrás dele e tomarei dele alguma coisa.”'
  rationale: A revisão restitui «da mão dele», conservando a imagem e a precisão da construção hebraica, e traduz o verbo final de modo mais direto por «tomarei». A fórmula de juramento, o nome Yahweh e a referência enfática a Naamã como «este arameu» foram preservados.
  reviewer_model: gpt-5.6-terra
