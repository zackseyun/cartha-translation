base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: pt
  text: 'Então seus servos se aproximaram, falaram com ele e disseram: “Meu pai, se o profeta lhe tivesse dito algo grandioso, você não o faria? Quanto mais, quando lhe disse: ‘Lave-se e fique limpo[a]’!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seja purificado”. O hebraico pode indicar tornar-se limpo ou purificado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: se aproximaram
  rationale: Expressa naturalmente o ato de chegar perto, inclusive a aproximação socialmente cuidadosa dos subordinados.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto, designa os subordinados ou assistentes de Naamã; “servos” preserva a amplitude do hebraico sem definir além do texto sua condição jurídica.
- source_word: אָבִי
  choice: Meu pai
  rationale: Mantém a metáfora hebraica como forma respeitosa e afetuosa de um inferior dirigir-se a um superior, sem sugerir paternidade literal.
- source_word: דָּבָר גָּדוֹל
  choice: alguma coisa extraordinária
  rationale: Aqui a expressão aponta para uma tarefa grandiosa, difícil ou exigente. “Extraordinária” comunica o contraste com a ordem simples de lavar-se.
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: você não a faria?
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e usa português atual e amplamente compreensível.
- source_word: וְאַף כִּי
  choice: Quanto mais agora que
  rationale: Torna explícito, sem ampliar indevidamente, o argumento hebraico do maior para o menor.
- source_word: רְחַץ
  choice: Lave-se
  rationale: Imperativo direto e natural no contexto da instrução dada pessoalmente a Naamã.
- source_word: וּטְהָר
  choice: e fique limpo
  rationale: O verbo pode indicar tornar-se limpo ou purificado. Esta formulação conserva tanto a dimensão física da cura quanto a ressonância de pureza, sem especificar um sentido ritual ou teológico exclusivo.
theological_decisions:
- issue: Nuance de טהר na cura de Naamã
  choice: e fique limpo
  alternative: e seja purificado
  rationale: “Fique limpo” conserva a sobreposição entre cura física e pureza. “Seja purificado” também é possível, mas pode soar mais estritamente ritual ou teológico em português.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para clareza internacional e boa legibilidade brasileira. A forma de tratamento “Meu pai” foi mantida para preservar a imagem e o tom respeitoso do hebraico.
