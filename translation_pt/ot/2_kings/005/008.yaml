  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: pt
  text: 'Quando Eliseu, o homem de Deus, ouviu que o rei de Israel tinha rasgado as suas roupas[a], mandou dizer ao rei: “Por que você rasgou as suas roupas? Que ele venha a mim, por favor[b], e saberá que há um profeta em Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rasgar as roupas era um gesto costumeiro de profunda aflição ou luto.
    reason: contexto_cultural
  - marker: b
    text: “Ele” se refere a Naamã, não ao rei de Israel.
    reason: clareza_de_referente
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A fórmula narrativa hebraica introduz a circunstância temporal. “Quando ... ouviu” comunica isso de modo natural, sem acrescentar um marcador discursivo que não está explicitamente no texto.
- source_word: אֱלִישָׁע
  choice: Eliseu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva a forma lexical e o uso da expressão como título profético, sem reduzi-la a uma simples descrição de piedade.
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: tinha rasgado as suas roupas
  rationale: “Rasgar” traduz diretamente קָרַע, e o mais-que-perfeito composto indica naturalmente que o ato ocorreu antes de Eliseu tomar conhecimento dele. “Roupas” é claro e atual.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ לֵאמֹר
  choice: mandou dizer ao rei
  rationale: Expressa de forma idiomática o envio de uma comunicação seguido de discurso direto, sem afirmar explicitamente a identidade do mensageiro.
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: Por que você rasgou as suas roupas?
  rationale: Mantém a pergunta direta e o vocabulário da oração anterior. “Você” oferece leitura moderna e ampla, apropriada à fala dirigida ao rei sem introduzir um tratamento honorífico ausente do hebraico.
- source_word: יָבֹא נָא אֵלַי
  choice: Que ele venha a mim, por favor
  rationale: Preserva a terceira pessoa singular de יָבֹא e a nuance cortês de נָא. O pronome remete a Naamã, não ao rei.
- source_word: וְיֵדַע
  choice: e saberá
  rationale: O imperfeito expressa o resultado esperado. Em português, o sujeito pode permanecer implícito e continua sendo o homem que virá, isto é, Naamã.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: que há um profeta em Israel
  rationale: “Há” traduz naturalmente a construção existencial יֵשׁ e conserva a ênfase na presença real de um profeta em Israel.
theological_decisions:
- issue: Força profética de אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  alternative: o homem piedoso; o homem que pertence a Deus
  rationale: A expressão funciona como designação reconhecida do profeta enquanto representante de Deus, e não apenas como comentário sobre sua devoção pessoal.
- issue: Referente do sujeito em יָבֹא ... וְיֵדַע
  choice: Naamã é aquele que deve vir e saber
  alternative: o rei de Israel deve vir e saber
  rationale: A terceira pessoa retoma naturalmente Naamã, cuja necessidade desencadeou a narrativa. A nota torna explícito o referente sem inseri-lo no corpo do versículo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe acompanha de perto o hebraico, mas evita construções artificiais. O tratamento “você” mantém a pergunta direta e natural; a ordem “Que ele venha a mim” preserva a referência pronominal e a cortesia do original.
