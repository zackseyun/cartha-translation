base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: pt
  text: 'Então Naamã disse: “Se não, por favor, seja dada a teu servo uma carga de terra — o que um par de mulas pode carregar[a] —, pois teu servo não oferecerá mais holocausto nem sacrifício a outros deuses[c], mas somente a Yahweh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “a carga de um par de mulas” ou “uma carga para duas mulas”. A expressão hebraica indica a quantidade de terra que um par de mulas podia transportar.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” translitera o nome divino YHWH, tradicionalmente representado por “SENHOR” em muitas traduções.
    reason: alternative_reading
  - marker: c
    text: O pedido de Naamã por terra de Israel pode refletir a antiga associação entre uma divindade e sua terra, ou o desejo de cultuar Yahweh sobre solo israelita. O texto não explica expressamente o motivo.
    reason: cultural_note
lexical_decisions:
- source_word: וָלֹא
  choice: Se não
  rationale: No contexto, introduz a resposta de Naamã à recusa de Eliseu no versículo anterior. A formulação elíptica preserva o sentido condicional e cortês sem acrescentar uma explicação ausente do hebraico.
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: por favor, permita que se dê a este seu servo
  rationale: Preserva a construção passiva, a partícula de cortesia נָא e a forma deferente pela qual Naamã fala de si mesmo.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: uma carga de terra, tanto quanto um par de mulas pode carregar
  rationale: Explicita em português natural que a expressão indica a quantidade de terra transportável por duas mulas, mantendo a referência concreta a terra.
- source_word: עֹלָה וָזֶבַח
  choice: holocausto nem sacrifício
  rationale: Holocausto é o termo corrente para a oferta inteiramente queimada; sacrifício traduz o termo sacrificial mais geral. O português pede nem após a negação.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Expressa diretamente os destinatários das ofertas.
- source_word: כִּי אִם לַיהוָה
  choice: mas somente a Yahweh
  rationale: A construção כִּי אִם estabelece exclusão enfática, comunicada naturalmente por mas somente; o nome divino é transliterado.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: A transliteração representa explicitamente o nome divino presente no texto hebraico e evita substituí-lo por um título. A nota informa a identificação com YHWH.
- issue: Motivo do pedido de terra israelita
  choice: O pedido é traduzido sem explicar sua motivação no texto principal
  alternative: Explicá-lo como preparação de um altar ou como crença de que Yahweh só poderia ser cultuado em solo israelita
  rationale: O versículo relaciona o pedido ao culto exclusivo a Yahweh, mas não declara por que Naamã queria a terra. A nota apresenta possibilidades históricas sem escolher uma delas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. “Este seu servo” conserva a deferência antiga sem recorrer a uma sintaxe excessivamente arcaica; “por favor” comunica a cortesia de נָא. A ordem das notas acompanha os elementos a que se referem no texto português.
