reference: 2 Kings 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: pt
  text: Naamã, comandante do exército do rei de Arã, era um homem importante diante de seu senhor e muito estimado, pois, por meio dele, Yahweh havia dado a vitória[a] a Arã. Ele era um guerreiro valente, mas era acometido de uma doença de pele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “libertação” ou “salvação”. O termo hebraico tem sentido mais amplo, mas aqui se refere ao sucesso militar.
    reason: lexical_alternative
  - marker: b
    text: Hebraico “era acometido de tsaraat”. O termo designa uma categoria antiga de afecção cutânea e não corresponde necessariamente à hanseníase moderna.
    reason: cultural_note
lexical_decisions:
- source_word: וְנַעֲמָן
  choice: Naamã
  rationale: O waw introduz o novo episódio sem exigir um marcador temporal explícito em português; o nome recebe a forma portuguesa consagrada.
- source_word: שַׂר צְבָא מֶלֶךְ אֲרָם
  choice: comandante do exército do rei de Arã
  rationale: Expressa com clareza moderna o cargo militar de Naamã e mantém Arã, a designação histórica do texto hebraico, em vez de Síria.
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו
  choice: era um homem importante diante de seu senhor
  rationale: אִישׁ גָּדוֹל indica elevada posição e importância social; לִפְנֵי preserva a imagem relacional e cortesã de estar diante do rei, seu senhor.
- source_word: וּנְשֻׂא פָנִים
  choice: e muito estimado
  rationale: Traduz naturalmente o idiomatismo hebraico que comunica honra, consideração ou favor.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: pois, por meio dele, Yahweh havia dado a vitória a Arã
  rationale: בוֹ tem valor instrumental; תְּשׁוּעָה, embora possa significar libertação ou salvação, aponta neste contexto militar para vitória.
- source_word: גִּבּוֹר חַיִל
  choice: um guerreiro valente
  rationale: Comunica força, capacidade e valor militar em português atual, sem a rigidez de uma reprodução palavra por palavra.
- source_word: מְצֹרָע
  choice: sofria de uma grave doença de pele
  rationale: O termo designa alguém atingido por צָרַעַת, categoria antiga que não corresponde necessariamente à hanseníase clínica moderna.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome próprio divino presente no hebraico, sem substituí-lo por um título.
- issue: Yahweh concedendo sucesso militar a uma nação estrangeira
  choice: Yahweh havia dado a vitória a Arã
  alternative: Yahweh havia dado libertação a Arã
  rationale: Preserva sem atenuação a afirmação teológica do texto de que Yahweh atua soberanamente também na história militar de Arã.
- issue: Identificação médica de מְצֹרָע
  choice: sofria de uma grave doença de pele
  alternative: era leproso
  rationale: Evita identificar de modo indevido a categoria ritual e dermatológica antiga com a hanseníase moderna, preservando a gravidade da condição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a estrutura de contraste do versículo e a tensão entre a alta posição de Naamã e sua enfermidade. Usa “Arã”, em conformidade com o hebraico, e “Yahweh” para o nome divino.
