  text: וַ/תֹּ֨אמֶר֙ אֶל גְּבִרְתָּ֔/הּ אַחֲלֵ֣י אֲדֹנִ֔/י לִ/פְנֵ֥י הַ/נָּבִ֖יא אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן אָ֛ז יֶאֱסֹ֥ף אֹת֖/וֹ מִ/צָּרַעְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: pt
  text: 'Ela disse à sua senhora: “Quem dera que o meu senhor estivesse diante do profeta que está em Samaria! Então ele o curaria[a] da sua lepra.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico significa literalmente “recolher” ou “ajuntar”, mas aqui é usado no sentido de remover a doença, isto é, curar.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico tradicionalmente traduzido por “lepra” pode designar mais amplamente uma doença grave da pele, não necessariamente a hanseníase moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: sua senhora
  rationale: Designa a mulher que ocupa posição superior no ambiente doméstico. “Sua senhora” comunica com naturalidade a relação social entre a menina serva e a esposa de Naamã.
- source_word: אַחֲלֵי
  choice: Quem dera
  rationale: Expressa desejo intenso ou anseio; “quem dera” preserva naturalmente em português a força optativa da partícula.
- source_word: אֲדֹנִי
  choice: o meu senhor
  rationale: Mantém a forma possessiva e o tratamento respeitoso usado pela menina ao referir-se a Naamã.
- source_word: לִפְנֵי
  choice: estivesse diante de
  rationale: Preserva a imagem hebraica de estar na presença de alguém e continua clara em português moderno.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Traduz diretamente o substantivo definido; o hebraico usa o título, embora o contexto identifique Eliseu.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: Forma portuguesa convencional do topônimo.
- source_word: אָז
  choice: Então
  rationale: Marca a consequência da situação desejada.
- source_word: יֶאֱסֹף
  choice: curaria
  rationale: Embora o verbo tenha o sentido básico de “recolher, ajuntar”, nesta construção com uma doença ele expressa sua remoção, isto é, a cura. “Curaria” transmite o sentido contextual em português natural; a imagem lexical é registrada em nota.
- source_word: מִצָּרַעְתּוֹ
  choice: da sua lepra
  rationale: “Lepra” é a tradução bíblica tradicional e reconhecível de צָרַעַת, sem pressupor que a condição corresponda precisamente à hanseníase moderna; essa limitação é explicitada em nota.
theological_decisions:
- issue: Atribuição da cura ao profeta
  choice: ele o curaria
  alternative: Deus o curaria por meio dele
  rationale: O texto hebraico atribui gramaticalmente a ação ao profeta. A tradução não acrescenta uma explicação teológica de agência divina que, embora compatível com o contexto mais amplo, não está expressa neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quem dera” conserva a força do desejo sem soar excessivamente arcaico; “diante do profeta” mantém a imagem do original, enquanto “curaria” evita uma reprodução literal obscura do idioma hebraico.
