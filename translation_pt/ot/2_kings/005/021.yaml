    rationale: הֲשָׁלוֹם é literalmente uma pergunta elíptica centrada em «paz/bem-estar», não a declaração existencial portuguesa «Há paz?». «Paz?» preserva melhor a concisão literal, seguida da explicação idiomática.
  revised_text: 'Então Geazi foi atrás de Naamã. Quando Naamã o viu correndo atrás dele, desceu da carruagem para encontrá-lo e perguntou: “Está tudo bem?”[a]'
