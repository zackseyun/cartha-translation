base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: pt
  text: 'Então Geazi foi atrás de Naamã. Quando Naamã o viu correndo atrás dele, desceu da carruagem para encontrá-lo e perguntou: “Está tudo bem?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Paz?” A palavra shalom é usada aqui como saudação ou pergunta sobre o bem-estar e a situação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  choice: foi atrás de
  rationale: רדף indica perseguir ou seguir intencionalmente. Neste contexto, “foi atrás de” é natural e preserva a ação sem sugerir hostilidade indevida.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: o viu correndo atrás dele
  rationale: Mantém tanto a percepção visual quanto a ação em andamento expressas pela construção hebraica.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: desceu do carro
  rationale: Embora נפל costume significar “cair”, aqui a expressão descreve de modo idiomático o ato de descer do veículo, sem implicar uma queda acidental.
- source_word: לִקְרָאתוֹ
  choice: para encontrá-lo
  rationale: לקראת expressa movimento em direção a alguém para ir ao seu encontro.
- source_word: הֲשָׁלוֹם
  choice: Está tudo bem?
  rationale: שלום funciona aqui como uma pergunta convencional sobre o bem-estar ou sobre a situação; a formulação escolhida é clara e natural em português moderno.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo faz a narrativa avançar; “Então” comunica adequadamente a sequência dos acontecimentos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Carro” designa aqui o veículo puxado por cavalos mencionado no contexto antigo; evitou-se “carruagem” por acrescentar uma especificidade não exigida pelo hebraico.
