  text: וַ/יָּשָׁב֩ אֶל אִ֨ישׁ הָ/אֱלֹהִ֜ים ה֣וּא וְ/כָֽל מַחֲנֵ֗/הוּ וַ/יָּבֹא֮ וַ/יַּעֲמֹ֣ד לְ/פָנָי/ו֒ וַ/יֹּ֗אמֶר הִנֵּה נָ֤א יָדַ֨עְתִּי֙ כִּ֣י אֵ֤ין אֱלֹהִים֙ בְּ/כָל הָ/אָ֔רֶץ כִּ֖י אִם בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּ֛ה קַח נָ֥א בְרָכָ֖ה מֵ/אֵ֥ת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: pt
  text: 'Então Naamã voltou ao homem de Deus, ele e todo o seu séquito; veio, pôs-se diante dele e disse: “Agora sei que não há Deus em toda a terra, a não ser em Israel. E agora, por favor, aceite um presente[a] deste seu servo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “uma bênção”. Aqui, o termo hebraico se refere a um presente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Preserva o título hebraico tradicional para um profeta ou porta-voz divino, sem substituí-lo pela explicação interpretativa “profeta de Deus”.
- source_word: מַחֲנֵהוּ
  choice: seu séquito
  rationale: Embora o sentido básico seja “seu acampamento”, no contexto designa o grupo que acompanhava Naamã; “séquito” comunica de modo natural essa comitiva.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: pôs-se diante dele
  rationale: Reproduz a ação de apresentar-se e permanecer na presença de Eliseu, em português claro e digno.
- source_word: הִנֵּה נָא
  choice: Agora
  rationale: A expressão chama atenção para a conclusão recém-alcançada. Em português, “Agora sei” transmite naturalmente essa força sem recorrer ao arcaizante “Eis que”.
- source_word: יָדַעְתִּי
  choice: sei
  rationale: O perfeito hebraico exprime aqui um estado presente decorrente da experiência recente; “agora sei” torna explícito esse valor contextual.
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: não há Deus em toda a terra, a não ser em Israel
  rationale: Mantém a força exclusiva da confissão e conserva “em Israel”, sem expandir a frase para “o Deus de Israel”.
- source_word: בְרָכָה
  choice: presente
  rationale: Literalmente “bênção”, mas neste contexto de oferta a palavra designa um presente; a tradução literal é preservada em nota.
- source_word: עַבְדֶּךָ
  choice: deste seu servo
  rationale: Trata-se de uma autodesignação deferente, não de uma afirmação de condição servil; a formulação é idiomática em português.
- source_word: קַח נָא
  choice: por favor, aceite
  rationale: O imperativo significa literalmente “tome, por favor”, mas, no contexto de uma oferta, “aceite” expressa com naturalidade a intenção.
theological_decisions:
- issue: A confissão de Naamã de que não há Deus senão em Israel
  choice: 'Apresentar diretamente a singularidade do Deus verdadeiro: “não há Deus em toda a terra, a não ser em Israel”.'
  alternative: Usar “não há deus” em sentido genérico ou parafrasear “não há Deus além do Deus de Israel”.
  rationale: O hebraico formula uma confissão exclusiva e forte. A redação conserva essa tensão narrativa e teológica, ao mesmo tempo que evita acrescentar palavras ausentes do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém tom narrativo digno, evita arcaísmos e preserva os principais idiomatismos hebraicos quando são claros em português.
