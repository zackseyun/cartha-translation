base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: pt
  text: 'Naamã disse: “Por favor, aceite dois talentos[a]”. Ele insistiu com Geazi e amarrou dois talentos de prata em duas bolsas, juntamente com duas mudas de roupa. Entregou-os a dois de seus servos, que os levaram à frente de Geazi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O talento era uma unidade de peso; seu valor exato variava conforme a época e o padrão empregado.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: Por favor, aceite
  rationale: A combinação expressa um pedido cortês para que Geazi receba a oferta. “Aceite” explicita naturalmente o sentido contextual de לקח sem tornar a fala arcaica.
- source_word: כִּכָּרָיִם
  choice: dois talentos
  rationale: כִּכָּר é uma unidade de peso. “Talentos” conserva a designação tradicional, acompanhada de nota explicativa para leitores atuais.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Ele insistiu com Geazi
  rationale: A expressão indica que Naamã pressionou Geazi a aceitar. O nome próprio esclarece os referentes pronominais sem alterar o sentido.
- source_word: וַיָּצַר ... בִּשְׁנֵי חֲרִטִים
  choice: colocou ... em duas bolsas e as amarrou
  rationale: O verbo descreve o ato de prender ou acondicionar a prata nos recipientes. A formulação portuguesa torna clara e natural a ação concreta implícita na construção hebraica.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: duas mudas de roupa
  rationale: Expressão corrente em português para conjuntos de roupa destinados à troca, clara e fiel ao idioma hebraico.
- source_word: שְׁנֵי נְעָרָיו
  choice: dois de seus servos
  rationale: נַעַר pode designar jovem, ajudante ou servo. Neste contexto, os homens são subordinados de Naamã encarregados de transportar a oferta.
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: levaram a carga à frente de Geazi
  rationale: לְפָנָיו indica que os servos seguiam diante dele. “A carga” retoma naturalmente os presentes, e “Geazi” esclarece o referente do pronome.
