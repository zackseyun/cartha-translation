    rationale: A forma hebraica וַיִּטְהָר descreve Naamã como entrando no estado de pureza/limpeza. Em português, «foi purificado» é passiva e pode sugerir um agente não expresso. «Ficou puro» representa melhor o aspecto resultativo e preserva a ambiguidade de agência.
