  source_fidelity: A ação de descer e mergulhar, a repetição de sete vezes, a conformidade com a palavra do homem de Deus e a restauração da carne estão bem representadas. Contudo, וַיִּטְהָר é forma ativa com sentido resultativo («tornou-se/f icou puro, limpo»); «foi purificado» introduz uma formulação passiva que não está explícita no hebraico.
  naturalness: O texto é claro, moderno e de registro bíblico apropriado. «Sua carne voltou a ser como a carne de um menino pequeno» é inteligível e conserva a repetição expressiva do hebraico.
  terminology: «Jordão», «homem de Deus», «carne» e «puro» são escolhas adequadas. «Ficou puro» mantém a linguagem de pureza sem especificar um agente da purificação.
