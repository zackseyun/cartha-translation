base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: pt
  text: Então ele desceu e mergulhou no Jordão sete vezes[a], conforme a palavra do homem de Deus. Sua carne voltou a ser como a carne de um menino pequeno, e ele ficou puro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “imergiu-se”. O verbo hebraico pode indicar mergulhar ou imergir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi purificado”. O verbo hebraico expressa que ele ficou puro ou limpo; também pode ser traduzido de modo passivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Então ele desceu
  rationale: O consecutivo hebraico dá prosseguimento à narrativa e, no contexto, apresenta a resposta de Naamã à instrução recebida. “Desceu” preserva o movimento concreto de ירד.
- source_word: וַיִּטְבֹּל
  choice: mergulhou
  rationale: טבל designa a ação de mergulhar ou imergir. Em português, “mergulhou” expressa naturalmente a ação praticada pelo próprio Naamã sem acrescentar uma interpretação ritual específica.
- source_word: בַּיַּרְדֵּן
  choice: no Jordão
  rationale: Mantém a forma tradicional e corrente do nome próprio; “rio” não precisa ser acrescentado para a compreensão.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Equivalência direta e idiomática para a repetição da ação.
- source_word: כִּדְבַר
  choice: conforme a palavra de
  rationale: Preserva o sentido amplo de דָּבָר e comunica que Naamã agiu de acordo com o que o homem de Deus havia dito, sem restringir o termo a “ordem” ou “instrução”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Reproduz o título profético convencional do texto hebraico e conserva seu peso teológico.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: Sua carne voltou a ser
  rationale: Expressa o sentido restaurador de שׁוב e mantém a imagem corporal concreta de בָּשָׂר, sem substituí-la por “pele” ou “corpo”.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: como a carne de um menino pequeno
  rationale: Mantém a repetição enfática de “carne” e representa tanto נַעַר, “menino”, quanto קָטֹן, que ressalta sua pouca idade ou pequenez.
- source_word: וַיִּטְהָר
  choice: ele foi purificado
  rationale: Comunica o resultado expresso por טהר — tornar-se limpo ou puro — e preserva a dimensão de pureza presente no relato, sem reduzir a expressão a mera higiene.
theological_decisions:
- issue: Natureza da restauração de Naamã
  choice: Conservar tanto a restauração física da carne quanto a linguagem de purificação.
  alternative: Resumir o resultado com linguagem exclusivamente médica, como “foi curado”, ou exclusivamente ritual.
  rationale: 'O versículo apresenta duas dimensões: a restauração corporal e o tornar-se puro. A tradução mantém ambas sem impor uma leitura sacramental, tipológica ou estritamente médica.'
- issue: Agência e aspecto em וַיִּטְהָר
  choice: “foi purificado” no texto, com nota registrando “ficou puro”.
  alternative: “ficou puro” ou “tornou-se puro”.
  rationale: A forma hebraica pode ser vertida de modo resultativo em português. A nota preserva a possibilidade de expressar o resultado como estado, sem afirmar além do texto quem efetuou a purificação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva o título bíblico “homem de Deus”, a imagem concreta da “carne” e a distinção entre restauração corporal e purificação. “Menino pequeno” é deliberadamente simples e próximo da dupla expressão hebraica, embora “menino bem novo” seja uma alternativa mais coloquial.
