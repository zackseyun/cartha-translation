  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: pt
  text: '“Quanto a isto, que Javé perdoe ao teu servo: quando o meu senhor entrar na casa de Rimom[b] para se curvar[a] ali, apoiado na minha mão, e eu também me curvar na casa de Rimom — quando eu me curvar na casa de Rimom, por favor, que Javé perdoe ao teu servo quanto a isto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adorar”. O verbo hebraico pode indicar tanto o ato corporal de curvar-se como um ato de culto.
    reason: lexical_alternative
  - marker: b
    text: A “casa de Rimom” era o templo ou santuário de Rimom, uma divindade síria.
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח
  choice: que ... perdoe
  rationale: 'A forma verbal expressa aqui um pedido. A construção portuguesa com “que” comunica de modo natural o valor volitivo: Naamã pede perdão divino por uma situação específica.'
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega o nome divino em sua forma portuguesa consagrada, em vez de substituí-lo por um título como “o SENHOR”.
- source_word: לְעַבְדֶּךָ
  choice: ao teu servo
  rationale: É a forma natural de autorreferência respeitosa de Naamã diante do profeta; neste contexto, “escravo” destacaria indevidamente a condição jurídica.
- source_word: בְּבוֹא אֲדֹנִי
  choice: quando o meu senhor entrar
  rationale: A preposição com o infinitivo estabelece a circunstância temporal. “Meu senhor” conserva a referência respeitosa ao rei servido por Naamã sem substituir o termo por uma identificação interpretativa.
- source_word: בֵית רִמּוֹן
  choice: casa de Rimom
  rationale: Preserva a expressão hebraica literal. O contexto e a nota esclarecem que se trata do templo ou santuário dessa divindade síria.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: para se curvar
  rationale: O verbo pode indicar tanto o ato corporal de prostrar-se como o culto. “Curvar-se” mantém em aberto a intenção interior de Naamã e é natural em português.
- source_word: נִשְׁעָן עַל יָדִי
  choice: ele se apoiar na minha mão
  rationale: Conserva a imagem hebraica da mão que dá apoio, sem trocar “mão” por “braço”, embora esta última opção fosse mais idiomática em alguns contextos.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: e eu também me curvar
  rationale: Dá continuidade ao cenário descrito e explicita, por meio de “também”, a participação corporal de Naamã enquanto sustenta seu senhor, sem afirmar que ele esteja prestando culto interiormente.
- source_word: בְּהִשְׁתַּחֲוָיָתִי
  choice: quando eu me curvar
  rationale: Reproduz de modo idiomático a retomada enfática do ato mencionado imediatamente antes.
- source_word: נָא
  choice: por favor
  rationale: Representa a partícula de súplica com uma expressão cortês, clara e atual em português.
theological_decisions:
- issue: Se הִשְׁתַּחֲוָה deve ser entendido como adoração ou como o ato corporal de curvar-se no templo de uma divindade estrangeira
  choice: curvar-se
  alternative: adorar; prostrar-se
  rationale: 'O verbo hebraico admite tanto o sentido corporal quanto o cultual. “Curvar-se” preserva a tensão narrativa: Naamã prevê participar externamente do gesto enquanto serve seu senhor, mas o texto não define de maneira explícita sua disposição interior.'
translation_notes:
  register: Português moderno, claro e respeitoso, com sintaxe acessível ao leitor brasileiro e compreensível internacionalmente. A repetição de “casa de Rimom” e do pedido de perdão foi mantida por corresponder à ênfase do hebraico. O travessão ajuda a tornar legível a retomada enfática sem eliminar essa repetição.
