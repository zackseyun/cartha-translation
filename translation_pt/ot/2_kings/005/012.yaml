  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: pt
  text: “Acaso Abana[a] e Farfar, os rios de Damasco, não são melhores do que todas as águas de Israel? Eu não poderia me lavar neles e ficar limpo[b]?” Então ele se virou e foi embora furioso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns trazem “Amana”, seguindo uma forma tradicional alternativa do nome do rio.
    reason: alternative_reading
  - marker: b
    text: Ou “ser purificado”. O hebraico pode indicar tanto a limpeza física quanto uma condição mais ampla de pureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Acaso... não / não poderia
  rationale: Expressa as duas perguntas retóricas que esperam resposta afirmativa, de modo natural em português.
- source_word: טוֹב
  choice: melhores
  rationale: A construção comparativa com מִכֹּל exige o comparativo em português.
- source_word: אבנה
  choice: Abana
  rationale: Translitera a forma do Texto Massorético; a forma tradicional alternativa, Amana, é preservada em nota.
- source_word: וּפַרְפַּר
  choice: e Farfar
  rationale: Segue a forma tradicional do nome em português, com representação natural do פ aspirado tradicionalmente vertido por ph/f.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: os rios de Damasco
  rationale: Reproduz naturalmente a relação genitiva da cadeia construta hebraica.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: do que todas as águas de Israel
  rationale: Mantém tanto a expressão totalizante quanto o termo amplo 'águas', sem restringi-lo a rios.
- source_word: אֶרְחַץ בָּהֶם
  choice: me lavar neles
  rationale: Preserva o verbo comum 'lavar' e a referência pronominal aos rios mencionados.
- source_word: וְטָהָרְתִּי
  choice: e ficar limpo
  rationale: Conserva a sobreposição entre cura física e condição de pureza sem tornar a expressão explicitamente ritual.
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: ele se virou e foi embora
  rationale: Representa os dois verbos sucessivos de movimento em português corrente.
- source_word: בְּחֵמָה
  choice: furioso
  rationale: Comunica a intensidade de חֵמָה com linguagem moderna e digna.
theological_decisions:
- issue: Natureza da linguagem de limpeza
  choice: ficar limpo
  alternative: ser purificado / ficar purificado
  rationale: O contexto envolve a doença de pele de Naamã, mas o hebraico também pode evocar pureza em sentido mais amplo. 'Ficar limpo' preserva essa sobreposição sem resolver a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. As perguntas retóricas e a intensidade da ira de Naamã foram preservadas sem literalismo rígido.
