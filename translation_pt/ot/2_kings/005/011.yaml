base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: pt
  text: 'Naamã, porém, indignou-se e foi embora. Ele disse: “Eu dizia comigo mesmo: ‘Com certeza ele sairá e virá até mim, ficará em pé, invocará o nome de Yahweh, seu Deus, agitará a mão sobre o lugar afetado e curará a pessoa com doença de pele semelhante à lepra[a]’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “removerá a doença de pele semelhante à lepra”. O verbo hebraico significa literalmente “recolher” ou “remover”, e o termo final pode referir-se à pessoa afetada ou, conforme uma interpretação contextual, à condição semelhante à lepra; não designa necessariamente a hanseníase moderna.'
    reason: Alternativa lexical para o verbo e cautela quanto à identificação médica da enfermidade.
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: ficou indignado
  rationale: קצף expressa ira. “Ficou indignado” comunica a reação intensa de Naamã em português natural, sem exagerá-la como “ficou furioso”.
- source_word: וַיֵּלַךְ
  choice: foi embora
  rationale: No contexto, הלך indica que Naamã se retirou da casa de Eliseu; “foi embora” explicita naturalmente essa partida.
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: Eu dizia comigo mesmo
  rationale: A expressão introduz enfaticamente a expectativa interior de Naamã. A formulação conserva a imagem hebraica de falar consigo mesmo sem recorrer ao arcaico “eis que”.
- source_word: יֵצֵא יָצוֹא
  choice: Com certeza ele sairá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação; “com certeza” transmite essa expectativa enfática.
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: invocará o nome de Yahweh, seu Deus
  rationale: קרא בשם designa invocar uma divindade. “Invocará o nome de” mantém o idioma bíblico e o nome יהוה é transliterado como “Yahweh”.
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: agitará a mão sobre o lugar afetado
  rationale: הניף sugere um movimento de vaivém ou gesto com a mão. “Lugar afetado” torna claro, pelo contexto, que הַמָּקוֹם é a parte atingida pela enfermidade.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: curará o leproso
  rationale: אסף significa literalmente reunir, recolher ou remover, mas nesta construção comunica a eliminação da aflição. הַמְּצֹרָע pode ser entendido como “o leproso”; “curará” expressa com naturalidade o resultado pretendido, enquanto a nota preserva a alternativa lexical.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Linguagem relacionada a צרע
  choice: o leproso
  alternative: a doença de pele semelhante à lepra
  rationale: A forma הַמְּצֹרָע pode designar a pessoa afetada, e essa leitura se ajusta naturalmente ao verbo entendido no sentido contextual de curar. A nota evita identificar necessariamente a condição bíblica com a hanseníase moderna e registra a possível referência à aflição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O discurso interior foi mantido como citação direta, e a repetição enfática hebraica foi transmitida por “com certeza”.
