  terminology: “Yahweh” corresponde ao tetragrama. “Doença de pele semelhante à lepra” é uma formulação prudente para a terminologia de צרעת e não a identifica automaticamente com hanseníase. A nota registra a gama lexical de אָסַף e a possibilidade, discutida nas tradições de tradução, de entender o termo final em referência à aflição.
