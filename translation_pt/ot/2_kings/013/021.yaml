  rationale: A revisão substitui a paráfrase interpretativa «caiu ali» pela expressão literal «foi e tocou», mantendo a ambiguidade do hebraico. A nota foi ajustada para explicar a dificuldade sem apresentar como provável uma única reconstrução do movimento do cadáver. Também se usa «se levantou», que reproduz mais diretamente a ação verbal de וַיָּקָם.
