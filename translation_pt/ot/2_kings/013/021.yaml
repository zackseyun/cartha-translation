base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: pt
  text: Aconteceu que, enquanto sepultavam um homem, de repente avistaram um bando de saqueadores. Então lançaram o homem no túmulo de Eliseu. Quando o homem foi e tocou nos ossos de Eliseu,[a] voltou à vida e se levantou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “o homem foi e tocou nos ossos de Eliseu”. A expressão “foi” é incomum em relação a um cadáver; no contexto, pode indicar o movimento do corpo lançado no túmulo, mas seu sentido exato é incerto.'
    reason: Preserva no texto a construção difícil de וַיֵּלֶךְ e explica, sem decidir indevidamente, sua possível função contextual.
lexical_decisions:
- source_word: הַגְּדוּד
  choice: um bando de saqueadores
  rationale: O substantivo designa uma tropa ou bando que fazia incursões; a escolha explicita sua atividade sem identificar uma etnia não indicada neste versículo.
- source_word: וַיַּשְׁלִיכוּ
  choice: lançaram
  rationale: Preserva a ação brusca causada pelo aparecimento repentino dos saqueadores.
- source_word: וַיֵּלֶךְ
  choice: caiu ali
  rationale: No encadeamento narrativo, o verbo literalmente ligado a 'ir' descreve de modo difícil o movimento do cadáver lançado no túmulo; 'caiu ali' comunica naturalmente esse movimento, sem omiti-lo.
- source_word: וַיְחִי
  choice: voltou à vida
  rationale: Expressa a revivificação do homem já morto no contexto do sepultamento.
- source_word: וַיָּקָם עַל רַגְלָיו
  choice: ficou de pé
  rationale: Equivalente português natural da expressão hebraica 'levantou-se sobre os seus pés'.
theological_decisions:
- issue: Relação entre o contato com os ossos de Eliseu e a volta à vida
  choice: 'Manter apenas a sequência narrativa: tocou nos ossos e voltou à vida'
  alternative: Explicitar os ossos como causa ou atribuir diretamente o milagre a Deus
  rationale: O texto relata a proximidade temporal dos acontecimentos, mas não formula uma explicação teológica explícita; a tradução não deve acrescentá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A inversão inicial e o advérbio 'de repente' reproduzem a progressão súbita marcada por וְהִנֵּה sem recorrer ao arcaizante 'eis que'.
