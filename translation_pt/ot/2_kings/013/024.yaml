  text: וַ/יָּ֖מָת חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֑ם וַ/יִּמְלֹ֛ךְ בֶּן הֲדַ֥ד בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: pt
  text: Então Hazael, rei de Arã, morreu, e Ben-Hadade, seu filho, tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreu
  rationale: O qal wayyiqtol de מות expressa um acontecimento narrativo concluído; “morreu” é a tradução direta, e וַ é representado naturalmente pela sequência “Então ... e”.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Transliteração corrente do nome próprio hebraico, preservando sua identificação histórica.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: אֲרָם designa o reino histórico de Arã. “Arã” preserva diretamente o nome hebraico, em vez de substituí-lo pelo termo tradicional e mais interpretativo “Síria”.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: Neste contexto de sucessão, מלך indica a ascensão ao trono; “tornou-se rei” comunica isso com mais precisão do que o mais amplo “reinou”.
- source_word: בֶּן־הֲדַד
  choice: Ben-Hadade
  rationale: Forma portuguesa clara e reconhecível do nome próprio, com hífen para refletir sua composição.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: Mantém explicitamente a relação filial e remete de modo natural a Hazael.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A expressão indica substituição ou sucessão, sendo “em seu lugar” idiomático e preciso no contexto régio.
