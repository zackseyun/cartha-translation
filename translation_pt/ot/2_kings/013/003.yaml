revisions:
- from: Por isso, a ira de Yahweh se acendeu contra Israel, e ele os entregou nas mãos[a] de Hazael, rei de Arã[b], e de Ben-Hadade, filho de Hazael, durante todo aquele período[c].
  to: A ira de Yahweh se acendeu contra Israel, e ele os entregou nas mãos[a] de Hazael, rei de Arã[b], e de Ben-Hadade, filho de Hazael, em todos aqueles dias[c].
  rationale: A revisão remove o conectivo causal sem correspondente no texto hebraico e torna a expressão temporal final mais próxima da sua forma e ambiguidade originais. Mantêm-se as escolhas adequadas de nomes, do nome divino e da imagem de entrega «nas mãos de».
  reviewer_model: gpt-5.6-terra
