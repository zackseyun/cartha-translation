base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: pt
  text: A ira de Yahweh se acendeu contra Israel, e ele os entregou nas mãos[a] de Hazael, rei de Arã[b], e de Ben-Hadade, filho de Hazael, em todos aqueles dias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na mão de”; expressão que significa estar sob o poder ou controle de alguém.
    reason: lexical_alternative
  - marker: b
    text: Arã é o nome hebraico da região muitas vezes chamada de Síria em traduções mais antigas.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “todos os dias” ou “todos aqueles dias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira ... se acendeu
  rationale: Preserva a imagem hebraica vívida da ira que se inflama, usando uma expressão natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיִשְׂרָאֵל
  choice: contra Israel
  rationale: Com o verbo de ira, a preposição indica que Israel é o alvo da indignação.
- source_word: וַיִּתְּנֵם
  choice: ele os entregou
  rationale: No contexto de juízo e domínio militar, 'entregou' comunica naturalmente o sentido de dar alguém ao poder de outro.
- source_word: בְּיַד
  choice: nas mãos de
  rationale: Conserva a imagem do idioma hebraico e, em português, comunica de modo claro submissão ao poder ou controle de alguém.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazael, rei de Arã
  rationale: Mantém o nome pessoal e representa diretamente o topônimo hebraico Aram na forma portuguesa 'Arã'.
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: Ben-Hadade, filho de Hazael
  rationale: Emprega formas portuguesas reconhecíveis dos nomes e conserva explicitamente a filiação indicada pelo hebraico.
- source_word: כָּל הַיָּמִים
  choice: durante todo aquele período
  rationale: Expressa naturalmente a duração contínua referida pelo contexto, sem sugerir necessariamente cada dia de modo distributivo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação preserva a metáfora hebraica da ira que se acende e a imagem de estar nas mãos de alguém, enquanto verte a expressão temporal final de modo natural.
