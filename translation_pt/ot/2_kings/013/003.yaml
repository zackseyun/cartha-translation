    reason: alternative_reading
  - marker: c
    text: Literalmente, “todos os dias” ou “todos aqueles dias”.
    reason: lexical_alternative
  revision_rationale: A revisão remove o conectivo causal sem correspondente no texto hebraico e torna a expressão temporal final mais próxima da sua forma e ambiguidade originais. Mantêm-se as escolhas adequadas de nomes, do nome divino e da imagem de entrega «nas mãos de».
