id: 2KI.13.6
reference: 2 Kings 13:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: pt
  text: Contudo, eles não se afastaram dos pecados da casa de Jeroboão, com os quais ele levou Israel a pecar; ele continuou a seguir esse caminho. E até a Aserá[a] permaneceu de pé em Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poste de Aserá”. O termo hebraico pode designar a deusa cananeia Aserá ou, como provavelmente neste caso, o objeto cultual associado à sua adoração.
    reason: alternativa lexical e esclarecimento cultural
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Marca o contraste entre o livramento mencionado anteriormente e a persistência no pecado.
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: não se afastaram dos pecados
  rationale: O verbo com מִן indica afastar-se ou abandonar algo; aqui חטאות designa práticas pecaminosas, não ofertas pelo pecado.
- source_word: בֵּית יָרָבְעָם
  choice: casa de Jeroboão
  rationale: Mantém a expressão hebraica tradicional, que abrange a herança dinástica, política e cultual de Jeroboão.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: com os quais ele levou Israel a pecar
  rationale: O hifil de חטא expressa causação. A formulação portuguesa comunica naturalmente que Jeroboão induziu Israel ao pecado.
- source_word: בָּהּ הָלָךְ
  choice: ele continuou a seguir esse caminho
  rationale: הלך com ב descreve conduta ou persistência num modo de vida. 'Esse caminho' representa o antecedente coletivo singular sugerido pelo sufixo hebraico e evita a expressão pouco natural 'andou neles'.
- source_word: וְגַם
  choice: E até
  rationale: Conserva a força aditiva e enfática da expressão.
- source_word: הָאֲשֵׁרָה
  choice: a Aserá
  rationale: O termo pode indicar a deusa cananeia ou o objeto cultual ligado ao seu culto. A transliteração evita definir além do que o hebraico explicita.
- source_word: עָמְדָה
  choice: permaneceu de pé
  rationale: Preserva tanto a imagem literal de estar de pé quanto a ideia contextual de permanência.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: É a forma locativa corrente para a capital do reino do Norte.
theological_decisions:
- issue: Referente de הָאֲשֵׁרָה
  choice: Aserá, com explicação em nota de que provavelmente se trata do objeto cultual associado à deusa
  alternative: poste de Aserá; deusa Aserá
  rationale: O fato de permanecer de pé em Samaria favorece a referência a um objeto cultual, mas o substantivo hebraico, por si só, também pode designar a deusa. O texto principal conserva essa abertura lexical.
- issue: Mudança do plural סָרוּ para o singular הָלָךְ
  choice: manter a mudança mediante 'eles' e depois 'ele'
  alternative: uniformizar os sujeitos ou identificar expressamente o sujeito singular
  rationale: O hebraico muda deliberadamente do plural para o singular. Não se acrescenta um nome no segundo membro, preservando a forma e a possível tensão referencial do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção evita arcaísmos como 'andou neles', mas conserva a mudança de número verbal e a ambiguidade lexical de Aserá. O marcador da nota foi colocado junto ao termo que ela explica.
