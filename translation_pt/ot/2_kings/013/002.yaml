id: 2KI.13.2
reference: 2 Kings 13:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ֠/יֵּלֶךְ אַחַ֨ר חַטֹּ֜את יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל לֹא סָ֥ר מִמֶּֽ/נָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh e seguiu os pecados de Jeroboão, filho de Nebate, que fez Israel pecar; não se afastou deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “não se afastou dela”. O hebraico emprega um sufixo feminino singular, provavelmente em referência coletiva ao padrão de pecado de Jeroboão.
    reason: alternativa lexical e esclarecimento da forma gramatical hebraica
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O wayyiqtol dá continuidade à narrativa; em português, a conjunção inicial pode ser omitida sem perda do sentido.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: o que era mau aos olhos de Yahweh
  rationale: Preserva a fórmula avaliativa recorrente em Reis, com expressão natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֵּלֶךְ אַחַר
  choice: seguiu
  rationale: Comunica naturalmente o sentido idiomático de andar após alguém ou algo, isto é, adotar e continuar seu padrão.
- source_word: חַטֹּאת
  choice: os pecados
  rationale: Mantém o plural hebraico e designa as práticas pecaminosas associadas a Jeroboão.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas portuguesas tradicionais dos nomes e conserva o patronímico hebraico.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: que fez Israel pecar
  rationale: Reproduz diretamente a força causativa do hifil de חטא.
- source_word: לֹא סָר מִמֶּנָּה
  choice: não se afastou deles
  rationale: Traduz סור como afastar-se e explicita, de modo idiomático, que ele não abandonou os pecados mencionados; a forma singular do sufixo hebraico é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração preserva esse fato sem substituí-lo por um título.
- issue: Referente do sufixo feminino singular em מִמֶּנָּה
  choice: deles, referindo-se aos pecados de Jeroboão
  alternative: dela; desse pecado
  rationale: O hebraico emprega um sufixo feminino singular, possivelmente com referência coletiva ao padrão de pecado de Jeroboão. O plural é mais claro em português, enquanto a nota conserva a particularidade e a ambiguidade formal do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula “aos olhos de Yahweh” preserva o caráter tradicional da avaliação régia, enquanto “seguiu” evita um literalismo pouco natural.
