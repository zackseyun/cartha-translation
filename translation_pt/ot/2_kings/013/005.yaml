reference: 2 Kings 13:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: pt
  text: E Yahweh deu a Israel um libertador[a], de modo que eles saíram de debaixo da mão de Arã[b]; e os filhos de Israel habitaram em suas tendas como antes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um salvador”. A palavra hebraica designa alguém que traz resgate ou libertação.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “de debaixo da mão de Arã” significa ser libertado do poder ou domínio de Arã.
    reason: cultural_note
  - marker: c
    text: Ou “como nos tempos passados”. Literalmente, “como ontem e anteontem”, expressão hebraica referente a tempos anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva por transliteração o nome divino da aliança, distinguindo-o do título “Senhor”.
- source_word: מוֹשִׁיעַ
  choice: um libertador
  rationale: O particípio substantivado designa alguém que traz livramento. “Libertador” comunica naturalmente o resgate histórico da opressão arameia sem impor uma identificação messiânica não explicitada pelo versículo.
- source_word: מִתַּחַת יַד אֲרָם
  choice: de debaixo da mão de Arã
  rationale: Mantém a imagem concreta do idioma hebraico para domínio ou poder opressor; uma nota esclarece seu sentido.
- source_word: אֲרָם
  choice: Arã
  rationale: Emprega a forma portuguesa tradicional do nome do antigo reino, em vez do equivalente geográfico posterior “Síria”.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e pactual explícita do hebraico, sem reduzi-la a um coletivo neutro.
- source_word: בְּאָהֳלֵיהֶם
  choice: em suas tendas
  rationale: Conserva o substantivo concreto do hebraico, que permanece claro em português.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: como antes
  rationale: Traduz de modo natural o idioma hebraico que se refere aos tempos passados; a forma literal é indicada em nota.
- source_word: וַיֵּצְאוּ
  choice: eles saíram
  rationale: Representa diretamente o verbo hebraico, enquanto a expressão seguinte esclarece que se trata de sair da dominação arameia.
- source_word: וַיֵּשְׁבוּ
  choice: habitaram
  rationale: Neste contexto, o verbo significa morar ou habitar; “habitaram” combina naturalmente com “em suas tendas” e mantém um registro digno.
theological_decisions:
- issue: Se מוֹשִׁיעַ deve ser traduzido por “libertador” ou “salvador”
  choice: libertador
  alternative: salvador
  rationale: O contexto imediato trata de libertação temporal do domínio de Arã. “Libertador” preserva esse sentido histórico sem excluir a ação salvadora de Deus nem sugerir uma identificação cristológica que o texto não declara.
- issue: Se בְנֵי יִשְׂרָאֵל deve manter sua formulação familiar
  choice: os filhos de Israel
  alternative: os israelitas / o povo de Israel
  rationale: A escolha conserva a designação familiar e pactual masculina presente no hebraico, em vez de substituí-la por um coletivo interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução preserva as imagens concretas “de debaixo da mão” e “em suas tendas”, bem como a designação familiar “filhos de Israel”, enquanto notas breves esclarecem os idiomas hebraicos.
