id: 2KI.13.11
reference: 2 Kings 13:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh. Não se afastou de nenhum dos pecados de Jeroboão, filho de Nebate — que levou Israel a pecar —; continuou neles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “andou nele”. O pronome hebraico está no singular feminino e pode referir-se coletivamente ao caminho pecaminoso de Jeroboão.
    reason: Registra a forma singular e a metáfora literal do hebraico, que a tradução corrente verte de maneira idiomática.
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Ele fez o que era mau
  rationale: Reproduz de modo natural a fórmula avaliativa recorrente em Reis, sem o caráter rígido de “fez o mal” como objeto definido.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica da avaliação divina e translitera diretamente o nome divino.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Não se afastou de nenhum dos pecados
  rationale: Em contexto negativo, מִכָּל comunica que ele não abandonou pecado algum; esta formulação é clara e idiomática em português.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: com os quais ele levou Israel a pecar
  rationale: Expressa o sentido causativo do hifil de חטא e entende o relativo em conexão com os pecados mencionados.
- source_word: בָּהּ הָלָךְ
  choice: continuou neles
  rationale: Comunica naturalmente a ideia idiomática de conduzir-se ou persistir nesse padrão, enquanto a nota registra a forma singular e a metáfora literal do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: Mantém o nome próprio presente no texto hebraico, sem substituí-lo por um título.
- issue: Referente de אֲשֶׁר na oração relativa
  choice: os pecados como meio pelos quais Jeroboão levou Israel a pecar
  alternative: 'Jeroboão como antecedente pessoal: “Jeroboão, que levou Israel a pecar”'
  rationale: A ligação com “pecados” é sintaticamente possível e conserva a relação instrumental sugerida pelo contexto, sem eliminar a alternativa interpretativa.
- issue: Metáfora moral de הָלָךְ
  choice: continuou neles no texto, com a forma literal em nota
  alternative: andou nele
  rationale: O português corrente comunica melhor a persistência moral com “continuou”, enquanto a nota preserva a imagem e o singular formal do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação evita arcaísmos, conserva a fórmula teológica de Reis e usa “Yahweh” para o nome divino.
