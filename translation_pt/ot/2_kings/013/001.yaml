  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: pt
  text: No vigésimo terceiro ano de Joás, filho de Acazias, rei de Judá, Jeoacaz, filho de Jeú, começou a reinar sobre Israel, em Samaria, e reinou durante dezessete anos.
