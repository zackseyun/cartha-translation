revisions:
- from: Então Jeoacaz buscou o favor de Yahweh[a], e Yahweh o atendeu, pois viu a opressão de Israel, porque o rei de Arã os oprimia.
  to: Então Jeoacaz buscou o favor de Yahweh[a], e Yahweh lhe deu ouvidos, pois viu a opressão de Israel, porque o rei de Arã os oprimia.
  rationale: A revisão troca “o atendeu” por “lhe deu ouvidos”, formulação portuguesa natural que corresponde mais precisamente ao verbo hebraico sem especificar antecipadamente como Yahweh respondeu. A nota é ajustada para explicar o idiomatismo sem uma alegada tradução literal potencialmente enganosa.
