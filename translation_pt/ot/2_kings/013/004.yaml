  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: pt
  text: Então Jeoacaz buscou o favor de Yahweh[a], e Yahweh lhe deu ouvidos, pois viu a opressão de Israel, porque o rei de Arã os oprimia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suplicou a Yahweh”. A expressão hebraica inclui “face” e é um idiomatismo para buscar o favor de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: buscou o favor de Yahweh
  rationale: A expressão idiomática חלה את־פני indica suplicar ou procurar o favor de alguém. Esta formulação comunica o sentido em português natural sem traduzir פְּנֵי de modo rígido como “face”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando seu caráter de nome pessoal.
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: o atendeu
  rationale: שמע com אֶל expressa escutar com atenção ou dar ouvidos. “O atendeu” evita o sentido meramente auditivo de “o ouviu” e cabe naturalmente no contexto de uma súplica.
- source_word: כִּי רָאָה
  choice: pois viu
  rationale: O primeiro כִּי introduz a razão pela qual Yahweh atendeu Jeoacaz; “pois” preserva claramente essa relação causal.
- source_word: לַחַץ
  choice: opressão
  rationale: O substantivo designa a pressão ou aflição imposta por um poder hostil; “opressão” se ajusta ao contexto político e militar.
- source_word: כִּי לָחַץ אֹתָם
  choice: porque ... os oprimia
  rationale: A oração explica a opressão mencionada antes. O imperfeito português representa naturalmente a situação continuada no pano de fundo da narrativa.
- source_word: מֶלֶךְ אֲרָם
  choice: o rei de Arã
  rationale: “Arã” translitera o topônimo hebraico e evita substituí-lo pelo nome geopolítico posterior “Síria”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino. “Yahweh” o apresenta como nome pessoal, em vez de substituí-lo por um título.
- issue: Sentido da expressão ויחל את פני יהוה
  choice: buscou o favor de Yahweh
  alternative: suplicou a Yahweh; procurou a face de Yahweh
  rationale: A escolha preserva o sentido idiomático de apelo por benevolência sem sugerir uma conclusão teológica além do que o hebraico afirma.
- issue: Resposta divina em וַיִּשְׁמַע אֵלָיו
  choice: Yahweh o atendeu
  alternative: Yahweh o ouviu; Yahweh lhe deu ouvidos
  rationale: A formulação indica acolhimento da súplica, como sugere a construção hebraica, sem desenvolver além do texto qual foi a resposta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Jeoacaz” e “Arã” seguem formas correntes em português bíblico. O imperfeito “oprimia” explicita naturalmente a opressão continuada indicada pelo contexto.
