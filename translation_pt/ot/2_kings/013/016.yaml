  text: וַ/יֹּ֣אמֶר לְ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הַרְכֵּ֤ב יָֽדְ/ךָ֙ עַל הַ/קֶּ֔שֶׁת וַ/יַּרְכֵּ֖ב יָד֑/וֹ וַ/יָּ֧שֶׂם אֱלִישָׁ֛ע יָדָ֖י/ו עַל יְדֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: pt
  text: 'Então ele disse ao rei de Israel: “Ponha a mão sobre o arco[a]”. O rei pôs a mão sobre ele, e Eliseu colocou as mãos sobre as mãos do rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Apoie a mão no arco”.'
    reason: Alternativa lexical para o hifil de רכב neste contexto.
lexical_decisions:
- source_word: הַרְכֵּב
  choice: Ponha
  rationale: O hifil imperativo de רכב descreve aqui fazer a mão ficar apoiada ou posicionada sobre o arco. “Ponha” comunica a ação com naturalidade, sem reproduzir de modo estranho a imagem literal de “montar”.
- source_word: יָדְךָ עַל הַקֶּשֶׁת
  choice: a mão sobre o arco
  rationale: “Sobre” representa diretamente a relação espacial expressa por עַל e mantém clara a posição da mão.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: O rei pôs a mão sobre ele
  rationale: O hebraico não repete “arco”, mas o pronome “ele” explicita em português o referente já mencionado. “O rei” evita possível ambiguidade quanto ao sujeito.
- source_word: וַיָּשֶׂם
  choice: colocou
  rationale: “Colocou” expressa de forma simples e digna o gesto físico, sem acrescentar ao verbo uma interpretação simbólica.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: as mãos sobre as mãos do rei
  rationale: A tradução preserva o plural nos dois casos e, assim, a imagem concreta de Eliseu pondo suas mãos por cima das mãos do rei.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: Então ele disse ao rei de Israel
  rationale: “Então” reproduz com naturalidade o avanço da sequência narrativa indicado pelo wayyiqtol.
theological_decisions:
- issue: Sentido do gesto de Eliseu ao colocar as mãos sobre as mãos do rei
  choice: Narrar o gesto sem explicar seu simbolismo no texto principal.
  alternative: Explicitar que se trata de capacitação profética ou orientação divina para a batalha.
  rationale: O versículo descreve a ação, mas não define aqui seu significado teológico. A tradução mantém o gesto concreto e deixa que o contexto esclareça sua função.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “mão/mãos” foi mantida porque é estrutural e visualmente importante no hebraico.
