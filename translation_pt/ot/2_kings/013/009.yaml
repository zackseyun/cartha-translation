base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: pt
  text: Jeoacaz repousou com seus antepassados, e o sepultaram em Samaria. Então seu filho Joás[a] reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Joás também aparece na forma “Jeoás”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: repousou com seus antepassados
  rationale: A expressão hebraica é uma fórmula régia convencional para a morte. “Repousou” conserva a imagem sem produzir a ambiguidade indesejada de uma tradução mecanicamente literal, e “antepassados” comunica em português atual o sentido coletivo de אֲבֹתָיו.
- source_word: וַיִּקְבְּרֻהוּ
  choice: e o sepultaram
  rationale: Preserva a forma verbal ativa na terceira pessoa do plural, cujo sujeito é indefinido, em vez de convertê-la em passiva.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição ב indica aqui o local do sepultamento; “em Samaria” é a formulação portuguesa natural.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: No aviso de sucessão, מלך pode abranger tanto a ascensão ao trono quanto o exercício do reinado. “Reinou” mantém a concisão da fórmula régia.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A expressão assinala substituição e sucessão dinástica; “em seu lugar” reproduz esse sentido com naturalidade.
- source_word: יְהוֹאָחָז
  choice: Jeoacaz
  rationale: Forma tradicional e amplamente reconhecível do nome em português bíblico.
- source_word: יוֹאָשׁ
  choice: Joás
  rationale: Transliteração portuguesa tradicional da forma hebraica curta presente neste versículo; a variante “Jeoás” é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário bíblico acessível. A fórmula hebraica de morte foi preservada por meio de “repousou com seus antepassados”, e o plural indefinido de “o sepultaram” foi mantido. O marcador da nota foi colocado junto ao nome Joás, ao qual seu conteúdo se refere.
