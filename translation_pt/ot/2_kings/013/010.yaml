  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה לְ/יוֹאָ֖שׁ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֤ז עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: pt
  text: No trigésimo sétimo ano do reinado de Joás, rei de Judá[a], Jeoás, filho de Jeoacaz, tornou-se rei sobre Israel, em Samaria, e reinou dezesseis anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico distingue o rei de Judá יוֹאָשׁ (Joás) do rei de Israel יְהוֹאָשׁ (Jeoás); algumas tradições traduzem ambos os nomes como “Joás”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֶׁבַע שָׁנָה
  choice: No trigésimo sétimo ano do reinado
  rationale: A fórmula hebraica de datação indica o ano régio. A explicitação de “do reinado” produz português natural e deixa claro o ponto de referência temporal.
- source_word: לְיוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: de Joás, rei de Judá
  rationale: A preposição לְ marca o reinado usado como referência cronológica; a forma portuguesa tradicional “Joás” representa יוֹאָשׁ e a distingue de יְהוֹאָשׁ neste versículo.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Na fórmula régia, o perfeito de מלך tem aqui sentido ingressivo, indicando a ascensão ao trono; a duração do reinado é informada no fim do versículo.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: Jeoás, filho de Jeoacaz
  rationale: “Jeoás” preserva em português a forma mais longa do nome hebraico יְהוֹאָשׁ, distinguindo-a de יוֹאָשׁ, “Joás”, rei de Judá.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com מלך, עַל expressa domínio ou governo sobre um povo ou território.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição בְּ indica o local do governo, e “em Samaria” é a formulação portuguesa natural.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: dezesseis anos
  rationale: A expressão numérica informa a duração total do reinado; “reinou dezesseis anos” é idiomático e fiel.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação conserva a estrutura do aviso régio, mas explicita “do reinado” para evitar a leitura de que se trata da idade do rei. Os nomes “Joás” e “Jeoás” preservam a distinção gráfica presente no hebraico.
