  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: pt
  text: 'Então ele disse: “Pegue as flechas.” Ele as pegou. Então disse ao rei de Israel: “Golpeie o chão.” Ele o golpeou três vezes e parou.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ficou de pé”; o verbo hebraico significa literalmente “ficou de pé”, mas, neste contexto, indica que ele parou depois de golpear três vezes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח הַחִצִּים
  choice: Pegue as flechas
  rationale: O imperativo de לקח pede uma ordem direta; “pegue” é natural e corrente em português, e o artigo definido preserva a forma hebraica.
- source_word: וַיִּקָּח
  choice: e ele as pegou
  rationale: O pronome “as” retoma naturalmente “as flechas”, explicitando em português o objeto subentendido no hebraico.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: ao rei de Israel
  rationale: Tradução direta e digna da expressão hebraica, sem alterar a relação sintática.
- source_word: הַךְ אַרְצָה
  choice: Golpeie o chão
  rationale: “Golpeie” transmite a ação enérgica de נכה sem especificar indevidamente que se tratava de atirar flechas; “o chão” expressa com clareza o sentido contextual de אַרְצָה.
- source_word: וַיַּךְ שָׁלֹשׁ פְּעָמִים
  choice: Ele golpeou três vezes
  rationale: Mantém a correspondência verbal com a ordem anterior e traduz idiomaticamente שָׁלֹשׁ פְּעָמִים.
- source_word: וַיַּעֲמֹד
  choice: e parou
  rationale: Embora עמד signifique literalmente “ficar de pé” ou “ficar parado”, aqui o contexto indica que o rei cessou a ação depois de três golpes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “golpeie/golpeou” preserva o vínculo verbal do hebraico; “parou” comunica o sentido contextual, enquanto a nota registra a forma mais literal.
