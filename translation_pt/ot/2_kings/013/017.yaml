  text: וַ/יֹּ֗אמֶר פְּתַ֧ח הַ/חַלּ֛וֹן קֵ֖דְמָ/ה וַ/יִּפְתָּ֑ח וַ/יֹּ֤אמֶר אֱלִישָׁ֤ע יְרֵה֙ וַ/יּ֔וֹר וַ/יֹּ֗אמֶר חֵץ תְּשׁוּעָ֤ה לַֽ/יהוָה֙ וְ/חֵ֣ץ תְּשׁוּעָ֣ה בַֽ/אֲרָ֔ם וְ/הִכִּיתָ֧ אֶת אֲרָ֛ם בַּ/אֲפֵ֖ק עַד כַּלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: pt
  text: 'Então ele disse: “Abra a janela para o leste”, e o rei a abriu. Depois, Eliseu disse: “Atire!” E ele atirou. Eliseu declarou: “A flecha da vitória de Yahweh, a flecha da vitória contra Arã![a] Você atingirá Arã em Afeque até destruí-lo por completo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma flecha de salvação vinda de Yahweh, uma flecha de salvação contra Arã”. O termo hebraico também pode significar “salvação” ou “livramento”.'
    reason: Preserva os sentidos alternativos de תְּשׁוּעָה e a possível nuance de procedência na construção com לַיהוָה.
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: Abra a janela para o leste
  rationale: O imperativo פְּתַח significa naturalmente “abra”, e קֵדְמָה indica direção, “para o leste”, não necessariamente uma janela denominada “janela oriental”.
- source_word: יְרֵה
  choice: Atire!
  rationale: Imperativo conciso e idiomático no contexto do arco; não acrescenta “uma flecha”, objeto que está implícito, mas não expresso.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: A flecha da vitória de Yahweh
  rationale: No contexto militar, תְּשׁוּעָה designa concretamente vitória ou livramento. A construção com לַיהוָה permite entender Yahweh como aquele a quem a vitória pertence e de quem ela procede.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: a flecha da vitória contra Arã
  rationale: 'A segunda expressão explica a primeira, e בַאֲרָם tem sentido adversativo neste contexto: “contra Arã”.'
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome hebraico do antigo reino, em sua forma portuguesa corrente, em vez de substituí-lo pelo nome geopolítico posterior “Síria”.
- source_word: וְהִכִּיתָ אֶת אֲרָם
  choice: Você derrotará Arã
  rationale: Embora נכה tenha o sentido básico de “golpear”, no contexto de uma batalha anunciada, “derrotará” comunica com naturalidade o resultado militar sem recorrer ao pouco idiomático “golpeará Arã”.
- source_word: בַּאֲפֵק
  choice: em Afeque
  rationale: A preposição בְּ com o topônimo indica o lugar em que ocorrerá a derrota; “em Afeque” é natural em português.
- source_word: עַד כַּלֵּה
  choice: até destruí-lo por completo
  rationale: A expressão indica levar o inimigo ao fim ou à destruição completa. O pronome retoma Arã como poder inimigo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração “Yahweh” representa diretamente o nome próprio no texto hebraico e evita convertê-lo em um título.
- issue: Sentido de תְּשׁוּעָה no oráculo militar
  choice: vitória
  alternative: salvação; livramento
  rationale: O ato simbólico com arco e flecha e a promessa de derrotar Arã favorecem o sentido militar concreto “vitória”, enquanto a nota preserva a amplitude lexical do termo.
- issue: Relação expressa por לַיהוָה em חֵץ תְּשׁוּעָה לַיהוָה
  choice: da vitória de Yahweh
  alternative: da salvação vinda de Yahweh
  rationale: A formulação portuguesa preserva certa abertura entre pertencimento e procedência, sem reduzir a expressão apenas a uma dessas relações.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. “O rei” e “Eliseu” explicitam referentes contextualmente claros para evitar uma sequência confusa de pronomes, sem alterar os participantes da cena. Mantêm-se os topônimos antigos Arã e Afeque.
