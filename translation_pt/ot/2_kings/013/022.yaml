lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: Hazael
  rationale: O nome pessoal é transliterado segundo a forma consagrada em português. O waw inicial dá continuidade à narrativa e não exige um conectivo explícito neste versículo.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: A expressão construta é traduzida diretamente. “Arã” preserva o nome hebraico do reino, em vez da identificação tradicional com a Síria.
- source_word: לָחַץ
  choice: oprimiu
  rationale: O verbo expressa pressão severa e contínua; no contexto, refere-se à opressão político-militar exercida sobre Israel.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: O marcador de objeto direto não é vertido; o nome nacional refere-se aqui ao reino do norte.
- source_word: כֹּל יְמֵי
  choice: durante todos os dias de
  rationale: A formulação natural em português comunica a duração integral indicada pelo idioma hebraico, sem decidir além do contexto se o enfoque recai estritamente sobre a vida ou sobre o reinado.
- source_word: יְהוֹאָחָז
  choice: Jeoacaz
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
