  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: pt
  text: Mas Yahweh lhes concedeu favor, teve compaixão deles e voltou-se para eles por causa de sua aliança com Abraão, Isaque e Jacó.[a] Não quis destruí-los nem os expulsou de sua presença até agora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em consideração à sua aliança com Abraão, Isaque e Jacó”.'
    reason: Alternativa lexical para לְמַעַן, ressaltando a ideia de agir em atenção à aliança.
lexical_decisions:
- source_word: וַיָּחָן
  choice: lhes concedeu favor
  rationale: O verbo חנן expressa favor gracioso. A formulação é natural em português e evita tornar explícita uma noção teológica além do que o verbo afirma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְרַחֲמֵם
  choice: teve compaixão deles
  rationale: רחם comunica compaixão profunda; esta expressão é clara, atual e preserva o aspecto afetivo do termo.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: voltou-se para eles
  rationale: Preserva a imagem concreta de voltar-se em direção a alguém, que no contexto indica atenção favorável.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: por causa de sua aliança
  rationale: לְמַעַן apresenta a aliança como motivo ou fundamento da ação de Yahweh; a expressão é idiomática em português.
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: com Abraão, Isaque e Jacó
  rationale: A construção compacta identifica os patriarcas como aqueles com quem a aliança foi estabelecida; “com” exprime isso naturalmente.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: Não quis destruí-los
  rationale: אָבָה denota querer ou estar disposto; “não quis” conserva diretamente a nuance volitiva.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: nem os expulsou de sua presença
  rationale: A expressão hebraica retrata o ato de lançar alguém para longe de diante da face; “expulsou de sua presença” comunica o sentido relacional e espacial com naturalidade.
- source_word: עַד עָתָּה
  choice: até agora
  rationale: Mantém o ponto de vista temporal do narrador e traduz diretamente a continuidade da situação até o presente narrativo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé
  rationale: A forma escolhida preserva o nome pessoal divino mediante transliteração e mantém a convenção da edição consultiva, sem substituí-lo por um título.
- issue: A aliança como motivo da compaixão e da preservação
  choice: por causa de sua aliança com Abraão, Isaque e Jacó
  alternative: em consideração à sua aliança com Abraão, Isaque e Jacó
  rationale: A tradução mantém a ligação explícita entre as ações favoráveis de Yahweh e sua aliança, sem desenvolver implicações doutrinárias além do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantiveram-se a repetição das ações divinas, a imagem de voltar-se para o povo e a nuance volitiva de אָבָה.
