  yaml_path: translation/ot/2_kings/013/015.yaml
  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
translation:
  language: pt
  text: 'Então Eliseu lhe disse: “Tome um arco e flechas.” Ele tomou um arco e flechas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico acrescenta literalmente “a/para ele”. A expressão pode referir-se a Eliseu; alguns a entendem como “para si”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa com naturalidade a sequência em português.
- source_word: לוֹ
  choice: lhe
  rationale: A preposição ל com sufixo de terceira pessoa masculina singular indica o destinatário das palavras de Eliseu.
- source_word: אֱלִישָׁע
  choice: Eliseu
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: קַח
  choice: Pegue
  rationale: O imperativo de לקח ordena que o rei tome ou obtenha os objetos; “pegue” é direto e natural no português atual.
- source_word: קֶשֶׁת וְחִצִּים
  choice: um arco e flechas
  rationale: Mantém os dois objetos e sua repetição explícita no hebraico; o artigo indefinido é necessário para uma formulação natural em português.
- source_word: וַיִּקַּח
  choice: Ele pegou
  rationale: O waw consecutivo introduz a ação seguinte, realizada em resposta à ordem.
- source_word: אֵלָיו
  choice: e os levou a Eliseu
  rationale: A preposição אֶל com sufixo tem sentido direcional, literalmente “até/a ele”. A explicitação de Eliseu evita uma referência pronominal confusa em português e preserva a informação do texto hebraico.
theological_decisions: []
translation_notes:
