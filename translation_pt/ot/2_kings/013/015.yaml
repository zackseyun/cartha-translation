- from: 'Então Eliseu lhe disse: “Pegue um arco e flechas.” Ele pegou um arco e flechas e os levou a Eliseu.[a]'
  to: 'Então Eliseu lhe disse: “Tome um arco e flechas.” Ele tomou um arco e flechas.[a]'
  rationale: A revisão remove a expansão interpretativa “e os levou a Eliseu” e registra em nota a expressão hebraica difícil, incluindo suas possibilidades principais. Mantêm-se a sequência narrativa, a repetição de “um arco e flechas” e o nome tradicional “Eliseu”.
