base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: pt
  text: Joás dormiu com seus antepassados[a], e Jeroboão sentou-se no seu trono. Joás foi sepultado em Samaria, junto aos reis de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deitou-se com seus antepassados”; a expressão hebraica é uma fórmula convencional para a morte de um rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: dormiu
  rationale: Mantém a imagem da fórmula hebraica de morte régia, sem reduzi-la simplesmente a “morreu”.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: “Antepassados” comunica naturalmente o sentido dinástico abrangente de אָבוֹת em português moderno; “pais” seria mais literal, mas poderia ser entendido apenas como os genitores.
- source_word: יָשַׁב עַל כִּסְאוֹ
  choice: sentou-se no seu trono
  rationale: Preserva a imagem hebraica convencional da sucessão ao trono, sem explicitá-la como “tornou-se rei em seu lugar”.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Reproduz a forma passiva e não acrescenta um agente que o hebraico não identifica.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: A preposição tem sentido locativo e esta é a formulação natural em português.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: junto aos reis de Israel
  rationale: Expressa a associação do sepultamento de Joás com o dos reis anteriores de Israel de modo claro e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com preservação das imagens hebraicas de morte e sucessão régia. O pronome em “seu trono” mantém a formulação concisa do original.
