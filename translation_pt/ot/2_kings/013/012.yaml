  text: וְ/יֶ֨תֶר דִּבְרֵ֤י יוֹאָשׁ֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְב֣וּרָת֔/וֹ אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Quanto aos demais atos de Joás, a tudo o que fez e ao seu poderio, com o qual lutou contra Amazias, rei de Judá, não estão escritos no Livro das Crônicas dos Reis de Israel[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este “Livro das Crônicas dos Reis de Israel” era uma fonte de anais reais citada em Reis, não o livro bíblico de Crônicas.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Quanto aos demais atos de Joás
  rationale: A fórmula régia hebraica refere-se aos demais feitos do rei, não simplesmente às suas palavras. “Quanto aos” expressa com naturalidade a transição introduzida por וְ, sem acrescentar um advérbio temporal.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: a tudo o que fez
  rationale: Preserva a abrangência de כָל e o sentido amplo e direto de עָשָׂה.
- source_word: וּגְבוּרָתוֹ
  choice: ao seu poder
  rationale: גְּבוּרָה pode indicar força, valentia ou feitos poderosos. “Poder” mantém o substantivo abstrato, cuja manifestação militar é especificada pela oração seguinte.
- source_word: אֲשֶׁר נִלְחַם עִם
  choice: com o qual lutou contra
  rationale: A oração relativa liga o poder de Joás ao combate. Embora עִם signifique literalmente “com”, neste contexto militar indica confronto contra Amazias.
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: Amazias, rei de Judá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome, seguida do título régio em aposição natural.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Conserva a pergunta retórica e a forma passiva da fórmula hebraica.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: no Livro das Crônicas dos Reis de Israel
  rationale: “No” é a forma idiomática portuguesa para referência ao conteúdo de uma obra. O título identifica os anais reais citados no livro de Reis.
