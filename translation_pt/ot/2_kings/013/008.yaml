base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: pt
  text: Os demais atos de Jeoacaz, tudo o que ele fez e seu poder[a]—não estão escritos no Livro das Crônicas dos Reis de Israel[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua força”, “sua valentia” ou “seus feitos poderosos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “no Livro dos Anais dos Reis de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais atos
  rationale: Na fórmula de encerramento dos reinados, דִּבְרֵי designa os feitos ou acontecimentos registrados, não apenas palavras; “os demais atos” é natural e preserva o sentido histórico.
- source_word: יְהוֹאָחָז
  choice: Jeoacaz
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tudo o que ele fez
  rationale: Tradução direta e abrangente da oração relativa, sem especificar indevidamente a natureza dos feitos.
- source_word: וּגְבוּרָתוֹ
  choice: e seu poder
  rationale: גְּבוּרָה pode indicar força, poder, valentia ou feitos poderosos. “Poder” conserva a concisão e não limita o sentido ao valor militar.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica da fórmula hebraica e a concordância plural do particípio.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha o sentido básico de “sobre”, “escritos no Livro” é a formulação idiomática em português para um registro documental.
- source_word: דִּבְרֵי הַיָּמִים
  choice: das Crônicas
  rationale: A expressão se refere a registros analísticos; “Crônicas” é uma tradução tradicional, precisa e reconhecível.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: dos Reis de Israel
  rationale: Neste título documental, לְ expressa relação; “dos Reis de Israel” é a forma natural em português.
