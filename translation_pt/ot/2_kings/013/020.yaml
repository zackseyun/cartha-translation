  text: וַ/יָּ֥מָת אֱלִישָׁ֖ע וַֽ/יִּקְבְּרֻ֑/הוּ וּ/גְדוּדֵ֥י מוֹאָ֛ב יָבֹ֥אוּ בָ/אָ֖רֶץ בָּ֥א שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: pt
  text: Então Eliseu morreu, e o sepultaram. Ora, bandos de saqueadores moabitas costumavam entrar na terra na chegada do ano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na primavera”; o hebraico diz literalmente “na chegada do ano”, expressão referente à virada do ano, muitas vezes associada à época das campanhas militares.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Então ... morreu
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência, mantendo o sentido simples de מות, “morrer”.
- source_word: אֱלִישָׁע
  choice: Eliseu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיִּקְבְּרֻהוּ
  choice: e o sepultaram
  rationale: Preserva a construção hebraica ativa no plural, com sujeito indefinido, e o sufixo de objeto masculino singular.
- source_word: גְדוּדֵי מוֹאָב
  choice: bandos de saqueadores moabitas
  rationale: גְדוּד designa aqui grupos que faziam incursões, não necessariamente um exército formal; “moabitas” comunica naturalmente em português a relação construta com Moabe.
- source_word: יָבֹאוּ
  choice: costumavam entrar
  rationale: O imperfeito indica ação habitual e repetida; com בָאָרֶץ, “entrar na terra” expressa claramente o movimento para dentro.
- source_word: בָאָרֶץ
  choice: na terra
  rationale: Após “entrar”, a preposição portuguesa “em”, contraída em “na”, expressa ingresso de modo idiomático sem perder o sentido de אֶרֶץ.
- source_word: בָּא שָׁנָה
  choice: na chegada do ano
  rationale: Mantém de modo transparente a formulação hebraica e sua ambiguidade temporal, deixando a interpretação sazonal para a nota.
theological_decisions: []
