revisions:
- from: Pois ele não deixou a Jeoacaz tropa alguma, a não ser cinquenta cavaleiros, dez carros de guerra e dez mil soldados de infantaria, porque o rei da Síria os havia destruído e os reduzido a pó para ser pisado.[a]
  to: Pois ele não deixou a Jeoacaz tropa alguma, a não ser cinquenta cavaleiros, dez carros de guerra e dez mil soldados de infantaria, porque o rei da Síria os havia destruído e os fez como pó que se pisa na debulha.[a]
