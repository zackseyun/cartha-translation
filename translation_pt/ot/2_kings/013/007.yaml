    text: 'Ou: “como pó para ser pisado”. O verbo hebraico pode evocar o pisoteio empregado para debulhar cereais.'
    reason: lexical_alternative
  revision_rationale: A revisão preserva a estrutura comparativa do hebraico («os fez como pó») e exprime em português corrente a imagem de pisoteio vinculada à debulha. A nota mantém a alternativa mais literal sem eliminar a ambiguidade lexical de לָדוּשׁ.
