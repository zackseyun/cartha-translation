base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: pt
  text: Pois ele não deixou a Jeoacaz tropa alguma, a não ser cinquenta cavaleiros, dez carros de guerra e dez mil soldados de infantaria, porque o rei da Síria os havia destruído e os fez como pó que se pisa na debulha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como pó para ser pisado”. O verbo hebraico pode evocar o pisoteio empregado para debulhar cereais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: deixou
  rationale: O hifil de שׁאר indica fazer restar ou deixar como remanescente; “deixou” expressa o resultado com naturalidade em português.
- source_word: עָם
  choice: tropa alguma
  rationale: Embora עָם possa significar “povo”, a enumeração imediata de cavaleiros, carros e infantaria indica aqui as forças militares de Jeoacaz. “Tropa alguma” torna esse sentido contextual explícito sem recorrer a um termo excessivamente técnico.
- source_word: כִּי אִם
  choice: a não ser
  rationale: Após a negação, a expressão introduz aquilo que restou como única exceção.
- source_word: פָּרָשִׁים
  choice: cavaleiros
  rationale: Designa combatentes montados; “cavaleiros” é claro e tradicional no contexto militar.
- source_word: רֶכֶב
  choice: carros de guerra
  rationale: O substantivo singular tem valor coletivo e, com o numeral, refere-se a dez carros militares. “Carros de guerra” evita a possível ambiguidade moderna de “carros”.
- source_word: רַגְלִי
  choice: soldados de infantaria
  rationale: Refere-se a combatentes a pé. A formulação é transparente e adequada ao registro narrativo.
- source_word: אִבְּדָם
  choice: os havia destruído
  rationale: O piel de אבד comunica destruição intensa; o mais-que-perfeito explicita que essa destruição explica a força reduzida que restou.
- source_word: וַיְשִׂמֵם
  choice: os reduzido
  rationale: Com a comparação seguinte, שׂים descreve a condição a que eles foram levados. “Reduzido a” é natural em português e conserva a força da imagem.
- source_word: כֶּעָפָר
  choice: a pó
  rationale: Preserva a imagem de completa pulverização e insignificância, em construção idiomática portuguesa com “reduzir a pó”.
- source_word: לָדוּשׁ
  choice: para ser pisado
  rationale: O infinitivo de דושׁ pode evocar tanto pisar quanto debulhar por pisoteio. A tradução principal comunica a ação física sem eliminar a imagem agrícola, esclarecida na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Síria” foi usado para o antigo reino de Arã, forma consagrada e imediatamente reconhecível em português; a imagem final preserva a ambiguidade entre pisotear e debulhar por meio da nota.
