  text: וֶֽ/אֱלִישָׁע֙ חָלָ֣ה אֶת חָלְי֔/וֹ אֲשֶׁ֥ר יָמ֖וּת בּ֑/וֹ וַ/יֵּ֨רֶד אֵלָ֜י/ו יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל וַ/יֵּ֤בְךְּ עַל פָּנָי/ו֙ וַ/יֹּאמַ֔ר אָבִ֣/י אָבִ֔/י רֶ֥כֶב יִשְׂרָאֵ֖ל וּ/פָרָשָֽׁי/ו־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: pt
  text: 'Eliseu ficou doente da enfermidade de que morreria. Então Joás, rei de Israel, desceu até ele, chorou sobre ele[a] e disse: “Meu pai, meu pai![b] Os carros de Israel e seus cavaleiros!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “chorou sobre o rosto dele”.
    reason: lexical_alternative
  - marker: b
    text: Esse lamento repete as palavras que Eliseu dirigiu a Elias em 2 Reis 2:12.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: adoeceu da doença
  rationale: Preserva a repetição cognata do hebraico de modo compreensível em português e apresenta a enfermidade como pano de fundo da visita de Joás.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: da qual morreria
  rationale: Mantém a perspectiva futura dentro da narrativa e indica que essa doença levaria Eliseu à morte.
- source_word: וַיֵּרֶד אֵלָיו
  choice: desceu para visitá-lo
  rationale: Conserva o detalhe direcional de ירד; “para visitá-lo” explicita naturalmente em português o movimento até a pessoa sem acrescentar uma interpretação teológica.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: chorou sobre ele
  rationale: Traduz a construção hebraica de forma natural, preservando em nota sua imagem literalmente ligada ao rosto.
- source_word: אָבִי אָבִי
  choice: Meu pai, meu pai!
  rationale: Preserva os sufixos possessivos, a repetição enfática e o tom de respeito e lamento.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Carro de guerra de Israel e seus cavaleiros!
  rationale: רֶכֶב está no singular morfológico, embora possa ter sentido coletivo. A tradução mantém o singular e a metáfora sem explicar seu referente no corpo do texto.
theological_decisions:
- issue: Força metafórica de “carro de guerra de Israel e seus cavaleiros”
  choice: Manter a exclamação metafórica dirigida a Eliseu sem paráfrase explicativa.
  alternative: Interpretar explicitamente Eliseu como a verdadeira defesa de Israel ou entender a frase como visão de carros celestiais.
  rationale: O texto ecoa 2 Reis 2:12, mas não explica diretamente a metáfora. Mantê-la preserva sua tensão e evita impor uma leitura doutrinária específica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Evitou-se um marcador inicial equivalente a “ora/agora”, pois o hebraico não traz uma palavra temporal explícita. A formulação conserva a repetição expressiva e a metáfora militar do original.
