- from: 'Eliseu adoeceu da doença da qual morreria. Então Joás, rei de Israel, desceu para visitá-lo, chorou sobre ele[a] e disse: “Meu pai, meu pai![b] Carro de guerra de Israel e seus cavaleiros!”'
  to: 'Eliseu ficou doente da enfermidade de que morreria. Então Joás, rei de Israel, desceu até ele, chorou sobre ele[a] e disse: “Meu pai, meu pai![b] Os carros de Israel e seus cavaleiros!”'
