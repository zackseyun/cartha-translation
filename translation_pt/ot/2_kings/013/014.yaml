    reason: cross_reference
  revision_rationale: 'A revisão elimina a finalidade acrescentada em «para visitá-lo», melhora a naturalidade da abertura sem apagar a repetição hebraica e restitui o valor coletivo da expressão militar final. As notas permanecem corretamente ancoradas: a nota a esclarece a formulação literal ligada ao rosto, e a nota b indica a alusão interna.'
