  text: וַ/יִּקְצֹ֨ף עָלָ֜י/ו אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּ֨אמֶר֙ לְ/הַכּ֨וֹת חָמֵ֤שׁ אוֹ שֵׁשׁ֙ פְּעָמִ֔ים אָ֛ז הִכִּ֥יתָ אֶת אֲרָ֖ם עַד כַּלֵּ֑ה וְ/עַתָּ֕ה שָׁלֹ֥שׁ פְּעָמִ֖ים תַּכֶּ֥ה אֶת אֲרָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: pt
  text: 'Então o homem de Deus se indignou contra ele e disse[a]: “Você deveria ter golpeado o chão cinco ou seis vezes; então teria golpeado a Síria até acabar com ela[b]. Mas agora você golpeará a Síria apenas três vezes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente “golpear”; “o chão” é retomado da ação imediatamente anterior, no versículo 18.
    reason: cross_reference
  - marker: b
    text: 'Ou: “até dar cabo da Síria”; também pode expressar a ideia de destruição completa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף עָלָיו
  choice: se indignou contra ele
  rationale: קצף expressa ira ou indignação. A formulação conserva a força da repreensão e soa natural em português digno e atual.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva a designação hebraica tradicional, sem substituí-la pela interpretação contextual “profeta”.
- source_word: לְהַכּוֹת
  choice: deveria ter golpeado o chão
  rationale: O infinitivo significa literalmente “golpear”. O objeto “o chão” é recuperado da ação imediatamente anterior, em 2 Reis 13:18, para tornar clara a referência.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: cinco ou seis vezes
  rationale: Reprodução direta da expressão numérica hebraica.
- source_word: אָז הִכִּיתָ אֶת אֲרָם
  choice: então teria golpeado a Síria
  rationale: Mantém o mesmo verbo usado para o ato simbólico e para seu correspondente militar, preservando a conexão narrativa.
- source_word: עַד כַּלֵּה
  choice: até acabar com ela
  rationale: Expressa a ideia de levar a Síria ao fim ou à completa derrota sem especificar além da ambiguidade idiomática do hebraico.
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: Explicita naturalmente o contraste entre a possibilidade não realizada e o resultado limitado anunciado.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: você golpeará a Síria apenas três vezes
  rationale: O imperfeito é preditivo. “Apenas” torna explícita a limitação indicada pelo contraste e pela repreensão.
- source_word: אֲרָם
  choice: Síria
  rationale: “Síria” é a designação geográfica tradicional e prontamente compreensível em português para Arã neste contexto; a forma “Arã” permanece uma alternativa mais formal.
theological_decisions:
- issue: Preservação da ligação entre o golpe simbólico e as vitórias militares
  choice: Usar “golpear” tanto para o chão quanto para a Síria.
  alternative: Usar “bater no chão” e “derrotar a Síria”.
  rationale: 'A repetição verbal é central ao sinal profético: o número de golpes corresponde ao número de vitórias. Preservá-la permite que o leitor perceba essa ligação sem explicação doutrinária adicional.'
- issue: Força de עַד כַּלֵּה
  choice: “até acabar com ela”
  alternative: “até destruí-la completamente”
  rationale: A expressão indica consumação ou fim completo, mas não exige que a tradução resolva de modo mais específico se isso significa aniquilação absoluta ou derrota militar definitiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento “você” evita a rigidez regional de “tu” e mantém naturalidade narrativa. A repetição de “golpear” é deliberada para reproduzir o vínculo verbal do hebraico.
