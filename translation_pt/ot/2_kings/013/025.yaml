translation_notes:
  register: Português contemporâneo, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. Conservou-se a expressão semítica «das mãos de», mas evitou-se a redundância pouco natural de traduzir וַיָּשָׁב וַיִּקַּח por dois verbos portugueses quase sinônimos.
