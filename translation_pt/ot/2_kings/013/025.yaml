  source_fidelity: A recuperação das cidades e a sua restituição ao domínio de Israel refletem bem o contexto e o valor dos verbos hebraicos. Contudo, «o atacou» é mais amplo e menos preciso que הִכָּהוּ no contexto militar, em que a ideia é de golpe/derrota; além disso, «seu pai Jeoacaz» pode, em português, ligar-se indevidamente a Ben-Hadade em vez de a Jeoás.
  naturalness: O texto é claro e de registro apropriado. A explicitação de «pai de Jeoás» elimina uma ambiguidade pronominal real para leitores modernos. «O derrotou» é natural em narrativa militar e condiz com a recuperação subsequente das cidades.
  terminology: Jeoás/Joás reproduz adequadamente as duas formas hebraicas do nome, e a nota correspondente é necessária. Ben-Hadade, Hazael, Jeoacaz e Israel estão consistentes. A nota sobre a alternativa para הִכָּהוּ deve ser atualizada para corresponder à nova tradução principal.
