base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: pt
  text: Então Jeoás, filho de Jeoacaz, recuperou as cidades das mãos de Ben-Hadade, filho de Hazael[a], as quais este havia tomado das mãos de Jeoacaz, pai de Jeoás, na guerra. Três vezes Joás o derrotou[b] e restituiu a Israel as cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, este versículo usa duas formas do nome do mesmo rei: «Jeoás» no início e «Joás» mais adiante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o golpeou». O verbo hebraico pode designar golpear em combate e, neste contexto, derrotar militarmente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּקַּח
  choice: recuperou
  rationale: Os dois verbos formam, no contexto, uma expressão de retomada. Em português, «recuperou» comunica naturalmente a reversão da perda e a tomada de volta, sem redundância artificial.
- source_word: הֶעָרִים
  choice: as cidades
  rationale: Equivalente corrente de עָרִים e apropriado para os centros urbanos deste relato histórico.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Preserva o idioma hebraico de domínio ou posse, que continua inteligível e digno em português.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadade
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio.
- source_word: אֲשֶׁר לָקַח
  choice: as quais este havia tomado
  rationale: O mais-que-perfeito composto assinala que a tomada ocorreu antes da recuperação; «este» esclarece que o sujeito é Ben-Hadade.
- source_word: בַּמִּלְחָמָה
  choice: na guerra
  rationale: Representa de modo direto o contexto militar da perda anterior.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: Três vezes
  rationale: Forma natural e moderna do numeral iterativo.
- source_word: הִכָּהוּ
  choice: o atacou
  rationale: Mantém o sentido marcial de נכה sem implicar necessariamente golpe pessoal, morte ou derrota absoluta; a alternativa «o derrotou» é registrada em nota.
- source_word: יוֹאָשׁ
  choice: Joás
  rationale: Reflete a forma abreviada do nome usada na segunda ocorrência do texto hebraico.
- source_word: וַיָּשֶׁב אֶת עָרֵי יִשְׂרָאֵל
  choice: restituiu as cidades a Israel
  rationale: Expressa a devolução das cidades ao controle israelita e reproduz a diferença contextual em relação ao primeiro uso da raiz שוב.
