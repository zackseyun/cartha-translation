  text: יַ֗עַן אֲשֶׁ֨ר עָשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינַ֔/י וַ/יִּהְי֥וּ מַכְעִסִ֖ים אֹתִ֑/י מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבוֹתָ/ם֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: pt
  text: porque fizeram o que é mau aos meus olhos e têm me provocado desde o dia em que seus pais saíram do Egito até hoje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seus antepassados saíram do Egito». O hebraico diz literalmente «seus pais», termo masculino de parentesco usado para as gerações anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: porque
  rationale: Introduz naturalmente, em português, a causa do juízo anunciado no versículo anterior.
- source_word: עָשׂוּ אֶת־הָרַע
  choice: fizeram o que é mau
  rationale: Reproduz de modo claro o idiomatismo hebraico, evitando a formulação pouco natural «fizeram o mal» neste contexto avaliativo.
- source_word: בְּעֵינַי
  choice: aos meus olhos
  rationale: Preserva a metáfora avaliativa hebraica em uma expressão corrente e digna em português.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: e têm provocado a minha ira
  rationale: A construção com היה e particípio indica conduta contínua ou habitual. A explicitação de «ira» comunica o sentido causativo do Hifil de כעס com naturalidade.
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: desde o dia em que
  rationale: Marca o ponto inicial de uma ação que continua até o presente narrativo.
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: seus pais saíram do Egito
  rationale: «Saíram do Egito» corresponde ao verbo habitual do êxodo, e «seus pais» conserva o termo masculino de parentesco do hebraico.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Expressão portuguesa natural que mantém a extensão temporal contínua do hebraico.
theological_decisions:
- issue: Continuidade corporativa da rebelião de Israel desde a geração do êxodo
  choice: Manter o enquadramento histórico e corporativo desde a saída do Egito até o presente narrativo.
  alternative: Restringir a acusação aos pecados individuais ou apenas aos reis mais recentes.
  rationale: O próprio texto traça uma continuidade de provocação entre as gerações; a tradução preserva essa tensão sem acrescentar uma explicação doutrinária.
- issue: Alcance do termo אֲבוֹתָם
  choice: seus pais
  alternative: seus antepassados
  rationale: O hebraico emprega um termo masculino de parentesco para as gerações anteriores. O texto principal conserva essa forma, enquanto a nota registra a alternativa sem alterar o alcance histórico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe mantém o caráter causal do fragmento e a progressão temporal do hebraico. «Têm provocado a minha ira» explicita o valor causativo e durativo sem resolver ou suavizar a acusação teológica.
