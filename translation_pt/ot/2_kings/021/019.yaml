  register: 'Português moderno, claro e digno, com legibilidade brasileira. A divisão em duas orações na notícia materna evita uma sequência pesada sem acrescentar conteúdo. Os nomes seguem formas portuguesas correntes: Amom, Mesulemete, Haruz e Jotbá.'
