base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: pt
  text: Amom tinha vinte e dois anos quando começou a reinar e reinou dois anos em Jerusalém. Sua mãe se chamava Mesulemete; ela era filha de Haruz, de Jotbá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: tinha vinte e dois anos
  rationale: A fórmula hebraica de idade é vertida pelo equivalente idiomático e claro em português.
- source_word: בְּמָלְכוֹ
  choice: quando começou a reinar
  rationale: O infinitivo construto com בְּ situa a idade de Amom no momento de sua ascensão ao trono.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo indica o exercício do reinado e é preservado pela forma portuguesa correspondente.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Emprega-se a forma locativa corrente em português.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Expressão natural em português que comunica integralmente a fórmula nominal hebraica.
- source_word: מְשֻׁלֶּמֶת
  choice: Mesulemete
  rationale: Transliteração portuguesa reconhecível do nome próprio hebraico.
- source_word: בַּת חָרוּץ
  choice: filha de Haruz
  rationale: Preserva diretamente a relação genealógica expressa no hebraico.
- source_word: מִן יָטְבָה
  choice: de Jotbá
  rationale: Neste contexto, a preposição מִן indica procedência; em português, “de Jotbá” expressa naturalmente essa origem.
