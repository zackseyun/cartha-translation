id: 2KI.21.2
reference: 2 Kings 21:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh, seguindo as práticas detestáveis das nações[a] que Yahweh havia expulsado de diante dos filhos de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “conforme as abominações das nações”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de modo mais idiomático: “os israelitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ele fez o que era mau
  rationale: A expressão hebraica é uma fórmula de avaliação moral. Esta tradução evita o literalismo pouco natural “fez o mal” sem enfraquecer o juízo do texto.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica de avaliação divina e emprega uma expressão natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כְּתוֹעֲבֹת הַגּוֹיִם
  choice: seguindo as práticas detestáveis das nações
  rationale: תּוֹעֵבָה pode designar aquilo que é abominável, especialmente práticas religiosas e morais condenadas. “Seguindo” comunica aqui o sentido comparativo e normativo da preposição כְּ em português corrente.
- source_word: הוֹרִישׁ
  choice: havia expulsado
  rationale: O hifil de ירש indica fazer alguém perder a posse, isto é, desalojar ou expulsar. O mais-que-perfeito composto explicita naturalmente que essa expulsão precedeu os atos do rei.
- source_word: מִפְּנֵי
  choice: de diante de
  rationale: Mantém a imagem espacial do hebraico e combina de modo inteligível com “havia expulsado”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a forma filial e masculina da expressão hebraica convencional, sem a substituir silenciosamente pelo gentílico mais idiomático “israelitas”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal e pactual, evitando substituí-lo por um título.
- issue: Sentido de כְּתוֹעֲבֹת
  choice: seguindo as práticas detestáveis
  alternative: conforme as abominações
  rationale: A escolha explicita que estão em vista atos ou costumes condenados, mas a nota preserva a formulação mais próxima da substantivação e do peso teológico do hebraico.
- issue: Expressão coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A forma principal mantém a expressão filial do original; a nota registra a alternativa coletiva idiomática sem impor significado adicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase segue o movimento do hebraico, enquanto “seguindo as práticas detestáveis” evita uma construção excessivamente literal. Os marcadores foram colocados junto às expressões a que suas notas se referem.
