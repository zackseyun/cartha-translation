base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: pt
  text: Manassés tinha doze anos quando começou a reinar e reinou cinquenta e cinco anos em Jerusalém. O nome de sua mãe era Hefzibá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hefzibá significa aproximadamente “Meu prazer está nela”.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: tinha doze anos
  rationale: A expressão hebraica é uma fórmula idiomática de idade; esta é a forma natural e exata em português moderno.
- source_word: בְמָלְכוֹ
  choice: quando começou a reinar
  rationale: A construção indica o momento em que Manassés passou a exercer o reinado e integra a fórmula régia do texto.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: cinquenta e cinco anos
  rationale: Reproduz o valor numérico hebraico em português corrente.
- source_word: מָלַךְ
  choice: reinou
  rationale: Equivalente preciso e convencional do verbo hebraico no contexto de uma notícia régia.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Representa diretamente o uso locativo da preposição hebraica com o nome da cidade.
- source_word: וְשֵׁם אִמּוֹ
  choice: O nome de sua mãe era
  rationale: Mantém o conteúdo da fórmula hebraica em sintaxe natural do português moderno.
- source_word: חֶפְצִי בָהּ
  choice: Hefzibá
  rationale: Translitera o nome próprio segundo uma forma bíblica reconhecível em português; seu significado aproximado é esclarecido em nota.
