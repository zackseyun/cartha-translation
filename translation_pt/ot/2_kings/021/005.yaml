base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: pt
  text: Ele construiu altares para todo o exército dos céus nos dois pátios da casa de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para todo o exército celestial”. A expressão hebraica “exército dos céus” se refere ao conjunto dos seres ou corpos celestes e, neste contexto, provavelmente aos astros ou poderes celestes venerados no culto astral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ele construiu
  rationale: O wayyiqtol qal de בנה expressa a ação passada na sequência narrativa; em português, a conjunção pode ser omitida com naturalidade.
- source_word: מִזְבְּחוֹת
  choice: altares
  rationale: Plural comum e direto de מִזְבֵּחַ, sem necessidade de explicitação.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: para todo o exército dos céus
  rationale: Preserva a expressão hebraica צְבָא הַשָּׁמַיִם e sua amplitude, sem reduzi-la apenas às estrelas; no contexto, relaciona-se ao culto astral.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: nos dois pátios
  rationale: Mantém explícito o numeral 'dois' e traduz חַצְרוֹת pelo termo natural em português para as áreas abertas do complexo do templo.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Conserva de perto a expressão hebraica 'casa de YHWH' e verte o nome divino como Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém diretamente o Tetragrama; 'Yahweh' preserva o nome próprio da aliança em vez de substituí-lo por um título.
- issue: Referência de צְבָא הַשָּׁמַיִם
  choice: exército dos céus
  alternative: astros do céu
  rationale: A expressão pode abranger corpos ou poderes celestes; a tradução mantém essa tensão sem restringir indevidamente o referente, enquanto a nota esclarece o contexto de culto astral.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural e leve conservação da linguagem bíblica. 'Pátios' favorece a compreensão ampla; 'casa de Yahweh' preserva a formulação hebraica e o nome divino.
