base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/021.yaml
  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: pt
  text: Ele andou em todo o caminho em que seu pai havia andado, serviu aos ídolos[a] aos quais seu pai havia servido e se prostrou diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolos” é depreciativo; também pode ser vertido como “ídolos repugnantes” e possivelmente alude a “ídolos de esterco”.
    reason: Alternativa lexical e preservação da carga pejorativa do hebraico, com qualificação de uma etimologia debatida.
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ
  choice: andou em todo o caminho em que ... havia andado
  rationale: Preserva a metáfora hebraica de andar como modo de vida e mantém o singular “caminho”, com formulação compreensível em português atual.
- source_word: אָבִיו
  choice: seu pai
  rationale: Equivalência direta; a repetição é mantida nas duas ocorrências, como no hebraico.
- source_word: וַיַּעֲבֹד
  choice: serviu
  rationale: Mantém o sentido básico de עבד e sua distinção em relação ao verbo seguinte, que descreve o ato de prostrar-se.
- source_word: הַגִּלֻּלִים
  choice: os ídolos
  rationale: “Ídolos” identifica com clareza o referente em português corrente; a carga depreciativa específica do termo hebraico é registrada em nota.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: e se prostrou diante deles
  rationale: Expressa o gesto físico e reverencial do hebraico sem o reduzir simplesmente a “adorou”, preservando a distinção em relação a “serviu”.
theological_decisions:
- issue: Carga depreciativa de גִּלֻּלִים
  choice: ídolos no texto, com explicação em nota
  alternative: ídolos repugnantes; ídolos de esterco
  rationale: O termo hebraico é deliberadamente desdenhoso, mas uma tradução literal ou expandida soaria incomum e poderia restringir indevidamente a imagem. A nota preserva a força pejorativa sem impor uma interpretação além do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência pela metáfora bíblica “andar no caminho”. “Serviu aos ídolos” e “se prostrou diante deles” mantêm distintos os dois atos cultuais descritos no hebraico.
