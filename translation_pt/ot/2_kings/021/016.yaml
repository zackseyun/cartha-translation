revisions:
- from: Além disso, Manassés derramou sangue inocente em enorme quantidade, até encher Jerusalém de uma ponta à outra[a], além do pecado com que fez Judá pecar e praticar o que era mau aos olhos de Yahweh.
  to: Além disso, Manassés derramou sangue inocente em enorme quantidade, até que encheu Jerusalém de uma ponta à outra[a], além do pecado pelo qual fez Judá pecar, praticando o que era mau aos olhos de Yahweh.
  rationale: 'Foram feitos apenas ajustes estilísticos seguros: «até que encheu» torna a progressão narrativa mais direta; «pelo qual» retoma «pecado» com maior naturalidade; e a vírgula antes de «praticando» torna mais clara a ligação do infinitivo hebraico com o pecado de Judá. A nota e seu marcador foram preservados junto à expressão que traduz o idiomatismo.'
