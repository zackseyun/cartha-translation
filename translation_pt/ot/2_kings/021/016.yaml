  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַם֩ דָּ֨ם נָקִ֜י שָׁפַ֤ךְ מְנַשֶּׁה֙ הַרְבֵּ֣ה מְאֹ֔ד עַ֛ד אֲשֶׁר מִלֵּ֥א אֶת יְרוּשָׁלִַ֖ם פֶּ֣ה לָ/פֶ֑ה לְ/בַ֤ד מֵֽ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יְהוּדָ֔ה לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: pt
  text: Além disso, Manassés derramou sangue inocente em enorme quantidade, até que encheu Jerusalém de uma ponta à outra[a], além do pecado pelo qual fez Judá pecar, praticando o que era mau aos olhos de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “de boca a boca”, expressão idiomática que significa por toda a cidade, de uma ponta à outra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Além disso
  rationale: Expressa de modo natural o valor aditivo e enfático da locução hebraica, introduzindo uma acusação adicional.
- source_word: דָּם נָקִי
  choice: sangue inocente
  rationale: Preserva a expressão jurídico-moral hebraica referente ao sangue de pessoas que não mereciam a morte.
- source_word: שָׁפַךְ
  choice: derramou
  rationale: “Derramar sangue” é a expressão portuguesa consagrada e corresponde diretamente ao idioma hebraico para matar.
- source_word: הַרְבֵּה מְאֹד
  choice: em enorme quantidade
  rationale: Comunica com naturalidade a forte intensificação hebraica sem a construção pouco idiomática “muitíssimo sangue”.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: até encher Jerusalém de uma ponta à outra
  rationale: Traduz o sentido espacial da expressão idiomática “boca a boca”, mantendo a imagem de a cidade inteira ficar cheia.
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: além do pecado
  rationale: Mantém tanto a ideia de acréscimo quanto o singular abrangente do hebraico.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: com que fez Judá pecar
  rationale: Preserva diretamente a força causativa do Hifil, atribuindo a Manassés um papel ativo no pecado de Judá.
- source_word: לַעֲשׂוֹת הָרַע
  choice: e praticar o que era mau
  rationale: Apresenta o conteúdo ou resultado do pecado em português natural; “praticar” evita a repetição próxima de “fez ... fazer”.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Conserva a metáfora avaliativa hebraica em uma formulação clara e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega o Tetragrama como nome próprio; “Yahweh” preserva essa função sem substituí-lo por um título.
- issue: Força causativa de הֶחֱטִיא
  choice: fez Judá pecar
  alternative: levou Judá ao pecado
  rationale: A forma causativa sustenta uma expressão forte e direta da responsabilidade ativa de Manassés, sem acrescentar uma conclusão doutrinária ao texto.
- issue: Relação de לַעֲשׂוֹת הָרַע com o pecado de Judá
  choice: fez Judá pecar e praticar o que era mau
  alternative: fez Judá pecar, praticando o que era mau
  rationale: A redação escolhida liga o infinitivo a Judá como conteúdo ou resultado do pecado, acompanhando a sequência sintática mais imediata, embora o hebraico permita uma formulação menos explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase mantém a gravidade jurídica e moral do hebraico, explicando em nota apenas o idioma espacial opaco.
