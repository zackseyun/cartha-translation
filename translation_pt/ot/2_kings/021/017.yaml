  text: וְ/יֶ֨תֶר דִּבְרֵ֤י מְנַשֶּׁה֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וְ/חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Quanto aos demais atos de Manassés, a tudo o que ele fez e ao pecado que cometeu, não estão escritos no Livro das Crônicas dos Reis de Judá?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos Anais dos Reis de Judá”. A expressão hebraica se refere a uma fonte de registros reais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Quanto aos demais atos de Manassés
  rationale: A expressão régia דִּבְרֵי refere-se aqui aos atos ou feitos do rei, não apenas às suas palavras. “Quanto aos demais” introduz com naturalidade o restante do registro e representa o וְ inicial sem acrescentar uma indicação temporal.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: a tudo o que ele fez
  rationale: Mantém a abrangência de כָּל e a estrutura da oração relativa. A preposição “a” coordena este elemento com o complemento de “quanto aos”.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: e ao pecado que cometeu
  rationale: O hebraico emprega uma construção cognata enfática, literalmente próxima de “seu pecado que pecou”. “O pecado que cometeu” conserva o sentido moral e religioso e soa natural em português; no contexto, o pecado é inequivocamente o de Manassés.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica negativa, que espera resposta afirmativa, e mantém o plural do hebraico, referente aos atos, a tudo o que fez e ao pecado.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל tenha sentido básico de “sobre”, com registros escritos o português idiomático pede “no”. “Livro” é compreensível e não exige identificar o suporte material como rolo.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: das Crônicas dos Reis de Judá
  rationale: A expressão designa uma fonte de registros régios. “Crônicas” preserva a forma tradicional do título, enquanto a nota esclarece o sentido arquivístico e evita confundi-la necessariamente com o livro bíblico de Crônicas.
