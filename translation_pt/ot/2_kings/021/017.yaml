  source_fidelity: 'A tradução representa com precisão a fórmula régia hebraica: «demais atos» para וְיֶתֶר דִּבְרֵי, «tudo o que ele fez» para וְכָל אֲשֶׁר עָשָׂה, e «o pecado que cometeu» para a construção cognata enfática וְחַטָּאתוֹ אֲשֶׁר חָטָא. A pergunta negativa retórica («não estão escritos...?») conserva adequadamente הֲלֹא הֵם כְּתוּבִים, inclusive seu plural coletivo.'
