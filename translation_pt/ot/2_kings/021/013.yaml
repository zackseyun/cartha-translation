source:
  edition: WLC
  text: וְ/נָטִ֣יתִי עַל יְרוּשָׁלִַ֗ם אֵ֚ת קָ֣ו שֹֽׁמְר֔וֹן וְ/אֶת מִשְׁקֹ֖לֶת בֵּ֣ית אַחְאָ֑ב וּ/מָחִ֨יתִי אֶת יְרוּשָׁלִַ֜ם כַּֽ/אֲשֶׁר יִמְחֶ֤ה אֶת הַ/צַּלַּ֨חַת֙ מָחָ֔ה וְ/הָפַ֖ךְ עַל פָּנֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: pt
  text: Estenderei sobre Jerusalém a linha de medir de Samaria e o prumo da casa de Acabe[a], e limparei Jerusalém como quem limpa um prato[b], limpando-o e virando-o de boca para baixo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «casa de Acabe» refere-se à dinastia de Acabe. No contexto de juízo, a imagem indica que Jerusalém será avaliada pelo mesmo padrão aplicado a Samaria e à casa de Acabe.
    reason: contextual_explanation
  - marker: b
    text: Ou «uma tigela».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: Estenderei sobre
  rationale: Preserva o sentido concreto de estender um instrumento de medição sobre algo, sem substituir a metáfora por uma explicação.
- source_word: קָו
  choice: linha de medir
  rationale: Identifica de modo claro e corrente a linha usada para medição, mantendo a imagem de construção ou avaliação.
- source_word: מִשְׁקֹלֶת
  choice: prumo
  rationale: É o termo português normal para o instrumento de medição com peso e forma um par natural com 'linha de medir'.
- source_word: בֵּית אַחְאָב
  choice: casa de Acabe
  rationale: Mantém a expressão dinástica hebraica, compreensível em português como referência à linhagem ou dinastia de Acabe.
- source_word: וּמָחִיתִי
  choice: Limperei
  rationale: A comparação seguinte com a limpeza de um prato determina o sentido concreto do verbo e preserva a repetição verbal do hebraico.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: como quem limpa um prato
  rationale: Reproduz naturalmente o sujeito indefinido da comparação e traduz צַלַּחַת por um objeto doméstico comum sem estreitar indevidamente seu sentido.
- source_word: מָחָה
  choice: depois de limpá-lo
  rationale: Conserva a repetição enfática do verbo e expressa com naturalidade a sequência das ações.
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: vira-o de boca para baixo
  rationale: Transmite idiomaticamente a imagem literal de virar o recipiente sobre sua face.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma tradicional e corrente do topônimo em português.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma tradicional e corrente do topônimo em português.
theological_decisions:
- issue: Natureza da metáfora de medição associada a Samaria e à casa de Acabe
  choice: A redação apresenta Jerusalém como submetida à mesma medida de juízo aplicada a Samaria e à casa de Acabe.
  alternative: Em outros contextos bíblicos, a linha e o prumo podem evocar construção ou restauração.
  rationale: Neste contexto, a condenação e a comparação com um prato completamente limpo e virado deixam claro o caráter destrutivo da medição. A expressão 'usada contra' torna explícita a referência comparativa elíptica sem identificar a linha e o prumo como objetos pertencentes a Samaria e Acabe.
translation_notes:
  register: Português moderno, digno e acessível, com construção direta. 'Prumo' conserva a imagem técnica sem soar excessivamente erudito; 'de boca para baixo' comunica de forma natural a posição final do recipiente.
