  source_fidelity: A tradução preserva adequadamente as imagens de medição e de limpar/virar o recipiente. Contudo, «Limperei» está no pretérito perfeito, enquanto וּמָחִיתִי, coordenado com «Estenderei», exprime aqui a ação futura de juízo; deve ser «limparei».
  naturalness: «Linha de medir», «prumo», «prato» e «de boca para baixo» são claros e naturais no português moderno. A repetição «limpando-o» conserva melhor a repetição enfática do hebraico do que «depois de limpá-lo», sem introduzir uma relação temporal mais explícita do que o texto exige.
  terminology: Jerusalém, Samaria e Acabe estão em formas portuguesas correntes. «Casa de Acabe» preserva apropriadamente a expressão dinástica. A formulação principal deve dizer literalmente «de Samaria» e «da casa de Acabe»; a interpretação de que se trata do padrão de juízo cabe à nota, não à tradução.
  issues:
