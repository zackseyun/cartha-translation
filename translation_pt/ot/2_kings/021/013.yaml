    rationale: «Usada contra» explicita uma inferência contextual que não está lexicalmente expressa no hebraico. Além disso, a nota chama de literal uma formulação diferente da do texto. A leitura literal deve permanecer no texto, e a explicação interpretativa pode ficar na nota.
