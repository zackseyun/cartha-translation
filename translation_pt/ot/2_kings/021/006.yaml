  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: pt
  text: Fez seu filho passar pelo fogo[a], praticou a adivinhação e interpretou presságios[b], e envolveu-se com médiuns e adivinhos[c]. Abundou em fazer o mal aos olhos de Yahweh, para provocar sua ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “sacrificou seu filho no fogo”. A expressão hebraica diz literalmente: “fez seu filho passar pelo fogo”.'
    reason: alternative_reading
  - marker: b
    text: O verbo hebraico também pode ser traduzido por “praticou a adivinhação”.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica é difícil. Pode também ser traduzida por “consultou médiuns e adivinhos” e talvez indique, de modo mais amplo, envolvimento com esses praticantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: Fez seu filho passar pelo fogo
  rationale: Preserva no texto principal a formulação idiomática hebraica, associada a ritos de sacrifício infantil, sem definir além do que a expressão declara explicitamente.
- source_word: וְעוֹנֵן
  choice: praticou a adivinhação
  rationale: Expressa uma prática oculta de prognóstico de modo claro e corrente em português.
- source_word: וְנִחֵשׁ
  choice: interpretou presságios
  rationale: 'Distingue esta prática da anterior e comunica o sentido frequente do verbo נחשׁ: procurar conhecimento por meio de sinais ou presságios.'
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: recorreu a médiuns e necromantes
  rationale: A locução hebraica é difícil literalmente; 'recorreu a' preserva a ideia ampla de envolvimento ou uso desses praticantes sem pressupor nomeação formal.
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  choice: Fez muito do que era mau
  rationale: Reproduz naturalmente a intensificação de רבה com infinitivo e mantém הָרַע como categoria moral substantivada.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Conserva a metáfora avaliativa hebraica e verte o tetragrama de acordo com a política do projeto.
- source_word: לְהַכְעִיס
  choice: provocando-o à ira
  rationale: Mantém a força causativa e explicita naturalmente em português que as ações provocavam a ira de Yahweh.
theological_decisions:
- issue: Grau de explicitação da expressão ligada ao sacrifício infantil
  choice: Manter no texto principal 'fez seu filho passar pelo fogo'
  alternative: sacrificou seu filho no fogo
  rationale: O contexto aponta fortemente para sacrifício infantil, mas a redação hebraica emprega uma expressão idiomática. Preservá-la evita tornar explícita no texto uma reconstrução interpretativa; a nota registra o sentido provável.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: Segue a política do projeto para o tetragrama e mantém visível o nome pessoal no texto.
- issue: Identificação de אוֹב e יִדְּעֹנִים
  choice: médiuns e necromantes
  alternative: médiuns e espíritas
  rationale: '''Necromantes'' indica com maior precisão praticantes que buscam contato ou conhecimento por meio dos mortos, evitando a associação moderna e denominacional que ''espíritas'' pode evocar em português.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação verbal acompanha o ritmo cumulativo do hebraico. Evitou-se 'espíritas' por sua possível leitura denominacional no contexto lusófono; 'necromantes' é preciso, embora ligeiramente mais formal.
