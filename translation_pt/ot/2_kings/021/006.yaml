  to: Fez seu filho passar pelo fogo[a], praticou a adivinhação e interpretou presságios[b], e envolveu-se com médiuns e adivinhos[c]. Abundou em fazer o mal aos olhos de Yahweh, para provocar sua ira.
  rationale: A revisão preserva a ambiguidade do hebraico quanto a אֹוב e יִדְּעֹנִים, sem impor a atividade específica de necromancia nem restringir o envolvimento a uma consulta. Também melhora a fluência de הִרְבָּה לַעֲשׂוֹת e torna mais clara a relação final de לְהַכְעִיס, sem alterar o sentido do versículo. As âncoras das três notas permanecem corretamente vinculadas às expressões relevantes.
