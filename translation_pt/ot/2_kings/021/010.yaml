base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/010.yaml
  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou por meio de seus servos, os profetas, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O piel de דבר significa normalmente “falar”. “Falou” preserva a força narrativa e permite manter a fórmula introdutória לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד
  choice: por meio de
  rationale: A expressão hebraica literalmente “pela mão de” funciona aqui como um idiomatismo de agência. “Por meio de” comunica isso com naturalidade em português.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: No contexto profético, עבד destaca o serviço e o comissionamento por Deus; “servos” é a opção contextual mais adequada.
- source_word: הַנְּבִיאִים
  choice: os profetas
  rationale: Tradução direta do substantivo definido no plural, em aposição a “seus servos”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz o discurso divino apresentado no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A locução idiomática “por meio de” evita o pouco natural “pela mão de” sem perder a ideia de mediação profética. A vírgula marca “os profetas” como aposição explicativa.
