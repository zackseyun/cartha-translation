  text: וַ/יַּעֲזֹ֕ב אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑י/ו וְ/לֹ֥א הָלַ֖ךְ בְּ/דֶ֥רֶךְ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: pt
  text: Ele abandonou Yahweh[a], o Deus de seus pais[b], e não andou no caminho de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abandonou o SENHOR”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o Deus de seus pais”; também pode ser traduzido por “o Deus de seus antepassados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: abandonou
  rationale: עזב significa deixar, abandonar ou desamparar. “Abandonou” é atual, claro e expressa a deslealdade religiosa e pactual do contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: o Deus de seus pais
  rationale: Reproduz de perto a construção hebraica e preserva sua linguagem familiar e pactual; “antepassados” é uma alternativa natural em português.
- source_word: וְלֹא הָלַךְ
  choice: e não andou
  rationale: Preserva a metáfora bíblica de הלך para a conduta ou maneira de viver, que continua compreensível em português moderno.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: no caminho de Yahweh
  rationale: דרך designa metaforicamente a conduta ou orientação de vida; a formulação conserva a imagem do texto hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Linguagem ancestral em אֲבֹתָיו
  choice: seus pais
  alternative: seus antepassados
  rationale: “Pais” mantém a forma masculina plural e a expressão familiar tradicional do hebraico, enquanto “antepassados” explicita o sentido coletivo possível sem alterar a referência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A metáfora “andar no caminho” e a expressão “Deus de seus pais” foram mantidas por transparência ao hebraico.
