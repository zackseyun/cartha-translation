source:
  edition: WLC
  text: וְ/נָטַשְׁתִּ֗י אֵ֚ת שְׁאֵרִ֣ית נַחֲלָתִ֔/י וּ/נְתַתִּ֖י/ם בְּ/יַ֣ד אֹֽיְבֵי/הֶ֑ם וְ/הָי֥וּ לְ/בַ֛ז וְ/לִ/מְשִׁסָּ֖ה לְ/כָל אֹיְבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: pt
  text: E abandonarei o remanescente da minha herança[a] e os entregarei nas mãos de seus inimigos; eles se tornarão presa e despojo para todos os seus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do meu patrimônio»; o termo hebraico descreve uma herança ou porção pertencente a alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: E abandonarei
  rationale: O verbo נטשׁ expressa deixar, abandonar ou desamparar. «Abandonarei» comunica com naturalidade a força judicial e relacional do contexto.
- source_word: שְׁאֵרִית
  choice: o remanescente
  rationale: שְׁאֵרִית designa aquilo que resta após juízo ou calamidade; «remanescente» preserva o termo bíblico sem perder clareza.
- source_word: נַחֲלָתִי
  choice: da minha herança
  rationale: נחלה pode indicar herança, porção atribuída ou posse. «Minha herança» mantém a linguagem de pertencimento pactual sem especificar além do hebraico.
- source_word: וּנְתַתִּים בְּיַד
  choice: e os entregarei nas mãos
  rationale: Embora נתן seja literalmente «dar», junto de בְּיַד forma uma expressão de transferência ao poder de alguém. «Entregarei nas mãos» conserva a imagem hebraica e é natural em português.
- source_word: אֹיְבֵיהֶם
  choice: seus inimigos
  rationale: Tradução direta e clara, mantida nas duas ocorrências.
- source_word: וְהָיוּ
  choice: eles se tornarão
  rationale: היה pode significar «ser» ou «tornar-se»; aqui introduz o resultado futuro de serem entregues aos inimigos.
- source_word: לְבַז
  choice: presa
  rationale: בז refere-se ao que inimigos tomam ou saqueiam. «Presa» funciona bem como primeiro elemento da dupla expressão e evita uma repetição portuguesa pouco elegante.
- source_word: וְלִמְשִׁסָּה
  choice: e despojo
  rationale: משסה designa algo sujeito a pilhagem ou saque. «Despojo» preserva a duplicação retórica de termos próximos no hebraico.
- source_word: לְכָל אֹיְבֵיהֶם
  choice: para todos os seus inimigos
  rationale: 'A preposição לְ marca aqui relação ou resultado: o povo passará a servir de presa e despojo a todos os inimigos.'
theological_decisions:
- issue: Nuance pactual de נַחֲלָתִי («minha herança»)
  choice: Manter «minha herança» como referência à porção ou ao povo pertencente a Deus, sem delimitar mais o referente.
  alternative: «Minha propriedade» ou «meu patrimônio»
  rationale: «Herança» preserva a linguagem bíblica de porção atribuída e pertencimento, enquanto as alternativas podem reduzir a expressão a mera posse material.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem e a duplicação retórica do hebraico foram preservadas, enquanto «entregarei nas mãos» verte naturalmente a expressão idiomática de domínio.
