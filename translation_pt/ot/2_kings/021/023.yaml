  language: en
  yaml_path: translation/ot/2_kings/021/023.yaml
  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: pt
  text: Os servos de Amom conspiraram contra ele e mataram o rei em sua própria casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: conspiraram
  rationale: No contexto de uma intriga política contra o rei, קשר expressa a formação de uma conspiração; “conspiraram” é preciso, conciso e natural em português.
- source_word: עַבְדֵי אָמוֹן
  choice: os servos de Amom
  rationale: Preserva a relação construta do hebraico e evita especificar indevidamente que eram “oficiais”, embora se trate de membros subordinados da corte.
- source_word: עָלָיו
  choice: contra ele
  rationale: Com o verbo de conspiração, עַל indica o alvo hostil da ação; o antecedente é Amom.
- source_word: וַיָּמִיתוּ
  choice: mataram
  rationale: O hifil de מות é causativo, mas o português atual expressa naturalmente essa ação por “mataram”; “condenaram à morte” sugeriria um processo judicial ausente do texto.
- source_word: אֶת־הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título empregado pelo hebraico, sem substituir por “o rei Amom”.
- source_word: בְּבֵיתוֹ
  choice: em sua própria casa
  rationale: “Em sua casa” corresponde diretamente ao hebraico; “própria” explicita de modo natural em português que a casa era do rei, sem alterar o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira e compreensão internacional. A coordenação narrativa hebraica foi vertida sem o “E” inicial, mais natural como versículo isolado; “servos” preserva a formulação do texto sem interpretar excessivamente sua função cortesã.
