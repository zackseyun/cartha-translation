source:
  edition: WLC
  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: pt
  text: E não tornarei a fazer o pé de Israel vaguear para longe da terra que dei aos seus pais[a], contanto que tenham o cuidado de fazer tudo conforme lhes ordenei e de cumprir toda a Lei[b] que meu servo Moisés lhes ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus antepassados”. Em hebraico, “pais” é uma expressão da aliança referente aos antepassados de Israel.
    reason: lexical_alternative
  - marker: b
    text: “Lei” também pode ser traduzida por “instrução”; aqui se refere à Torá mosaica transmitida por Moisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: não tornarei a
  rationale: Com לֹא e o hifil de יסף, a expressão indica que a ação não voltará a ocorrer; “não tornarei a” comunica isso naturalmente em português.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: fazer o pé de Israel vaguear para longe
  rationale: Mantém a imagem concreta e singular do hebraico, ao passo que “para longe” explicita de modo natural o sentido de deslocamento para fora da terra sem substituir a metáfora por uma interpretação plena.
- source_word: הָאֲדָמָה
  choice: a terra
  rationale: No contexto territorial e da aliança, refere-se à terra dada aos antepassados, não apenas ao solo.
- source_word: לַאֲבוֹתָם
  choice: aos seus pais
  rationale: Reproduz a expressão pactual tradicional do hebraico; uma nota esclarece o sentido de antepassados.
- source_word: רַק אִם
  choice: contanto que
  rationale: Expressa com clareza a força restritiva e condicional da locução hebraica.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: tenham o cuidado de fazer
  rationale: Conserva tanto a ideia de atenção diligente quanto a de cumprimento efetivo.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִם
  choice: tudo conforme lhes ordenei
  rationale: Preserva a abrangência de כֹל e a noção de conformidade introduzida por כְּ, em ordem natural no português.
- source_word: וּלְכָל הַתּוֹרָה
  choice: e conforme toda a Lei
  rationale: “Lei” é a designação natural da Torá mosaica neste contexto, enquanto “conforme” representa a preposição e mantém o paralelismo.
- source_word: עַבְדִּי מֹשֶׁה
  choice: meu servo Moisés
  rationale: Tradução direta e idiomática que preserva o título honorífico.
theological_decisions:
- issue: Condicionalidade da permanência de Israel na terra
  choice: A promessa de não deslocar Israel é apresentada sob a condição real de obediência aos mandamentos de Deus e à Lei transmitida por Moisés.
  alternative: Tratar a condição como meramente retórica ou atenuá-la em favor de uma promessa incondicional.
  rationale: רַק אִם introduz explicitamente uma condição restritiva. A tradução mantém a tensão pactual do texto sem a resolver por meio de uma posição doutrinária externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva deliberadamente a imagem hebraica singular “o pé de Israel”; “vaguear para longe” evita que a metáfora seja reduzida simplesmente a “expulsar” ou “remover”.
