  text: וַ/יָּ֗שָׁב וַ/יִּ֨בֶן֙ אֶת הַ/בָּמ֔וֹת אֲשֶׁ֥ר אִבַּ֖ד חִזְקִיָּ֣הוּ אָבִ֑י/ו וַ/יָּ֨קֶם מִזְבְּחֹ֜ת לַ/בַּ֗עַל וַ/יַּ֤עַשׂ אֲשֵׁרָה֙ כַּ/אֲשֶׁ֣ר עָשָׂ֗ה אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יִּשְׁתַּ֨חוּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַֽ/יַּעֲבֹ֖ד אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: pt
  text: Ele reconstruiu os lugares altos que seu pai Ezequias havia destruído, ergueu altares a Baal e fez um poste de Aserá[a], como Acabe, rei de Israel, havia feito. Também se prostrou diante de todo o exército dos céus e os serviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma aserá”. O termo hebraico designa um objeto cultual associado a Aserá; sua forma exata é incerta.
    reason: Esclarece a incerteza histórica e lexical de אֲשֵׁרָה sem impor uma identificação material definitiva.
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Mantém o termo bíblico tradicional para santuários ou locais de culto elevados, sem reduzir seu sentido a simples colinas.
- source_word: מִזְבְּחֹת לַבַּעַל
  choice: altares a Baal
  rationale: A preposição indica altares dedicados a Baal; a formulação é natural e fiel em português.
- source_word: אֲשֵׁרָה
  choice: um poste de Aserá
  rationale: No contexto, designa um objeto cultual associado à deusa Aserá. A explicitação evita que o nome isolado seja entendido apenas como uma pessoa, sem afirmar com precisão indevida a forma do objeto.
- source_word: כָל־צְבָא הַשָּׁמַיִם
  choice: todo o exército dos céus
  rationale: Preserva a imagem hebraica coletiva, normalmente referente aos corpos ou poderes celestes, sem restringi-la a uma única interpretação.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: e o serviu
  rationale: O pronome hebraico é formalmente plural, mas retoma a expressão coletiva 'todo o exército'; a concordância no singular soa natural em português e mantém a referência coletiva.
theological_decisions:
- issue: Natureza de אֲשֵׁרָה
  choice: poste de Aserá
  alternative: Aserá; imagem de Aserá
  rationale: A escolha reconhece o objeto cultual sem identificar de modo excessivamente específico seu formato ou transformar automaticamente o termo no nome pessoal da deusa.
- issue: Sentido de 'exército dos céus'
  choice: preservar a expressão figurada do hebraico
  alternative: astros; corpos celestes
  rationale: A expressão pode abranger sol, lua, estrelas ou seres/poderes celestes; traduzi-la literalmente conserva essa amplitude e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa fluente. Emprega terminologia bíblica reconhecível sem arcaísmos desnecessários.
