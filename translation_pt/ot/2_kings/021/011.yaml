base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: pt
  text: Visto que Manassés, rei de Judá, cometeu estas abominações e praticou mais mal do que todos os amorreus que o precederam fizeram, levando também Judá a pecar com seus ídolos[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ídolos” é depreciativo; também pode ser traduzido como “ídolos imundos” ou, de modo mais vívido, “ídolos de esterco”.
    reason: alternativa lexical
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Visto que
  rationale: Introduz a causa da sentença anunciada no versículo seguinte e soa natural em uma declaração profética formal.
- source_word: עָשָׂה
  choice: cometeu
  rationale: Com “abominações”, “cometeu” expressa de modo idiomático a ação concluída sem perder a força acusatória.
- source_word: מְנַשֶּׁה מֶלֶךְ יְהוּדָה
  choice: Manassés, rei de Judá
  rationale: Mantém o nome tradicional em português e o título real em aposição clara.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: estas abominações
  rationale: Preserva o peso moral e cultual do termo hebraico no contexto profético.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: praticou mais mal do que todos ...
  rationale: Reproduz a comparação explícita e o sentido de agir perversamente, em português natural.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: O singular hebraico funciona coletivamente; o plural é a forma idiomática em português.
- source_word: אֲשֶׁר לְפָנָיו
  choice: que viveram antes dele
  rationale: Explicita com naturalidade a precedência temporal dos antigos habitantes, sem acrescentar “na terra”, que não aparece no texto.
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: levando também Judá a pecar
  rationale: 'Preserva a força causativa do hifil de חטא: Manassés não apenas pecou, mas induziu Judá ao pecado.'
- source_word: בְּגִלּוּלָיו
  choice: com seus ídolos
  rationale: “Ídolos” é claro no texto principal; a forte carga depreciativa do termo hebraico é registrada em nota.
theological_decisions:
- issue: Força depreciativa de גִּלּוּלִים
  choice: ídolos
  alternative: ídolos imundos; ídolos de esterco
  rationale: A tradução principal permanece digna e compreensível, enquanto a nota conserva a conotação deliberadamente insultuosa do hebraico sem impor uma formulação excessivamente gráfica.
- issue: Causalidade em וַיַּחֲטִא
  choice: levando ... a pecar
  alternative: fez ... pecar
  rationale: Ambas preservam o causativo; “levando” comunica influência ativa sem especificar além do que o verbo hebraico afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase permanece aberta com vírgula porque a declaração causal continua no versículo seguinte.
