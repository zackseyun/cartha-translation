    text: 'Ou: “a imagem de Aserá”. O hebraico combina “imagem esculpida” com “Aserá”, indicando uma imagem associada a Aserá. Alguns traduzem “poste de Aserá”, mas isso é menos preciso aqui, pois o texto menciona explicitamente uma imagem esculpida.'
