base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: pt
  text: 'Ele colocou na casa a imagem esculpida de Aserá que havia feito, casa a respeito da qual Yahweh tinha dito a Davi e a Salomão, filho de Davi: “Nesta casa e em Jerusalém, que escolhi dentre todas as tribos de Israel, porei o meu nome para sempre.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ele colocou
  rationale: Expressa de modo natural a ação narrativa passada de pôr o objeto em determinado lugar.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: a imagem esculpida de Aserá
  rationale: Preserva tanto o sentido concreto de פֶּסֶל, uma imagem talhada, quanto a relação com Aserá, sem especificar indevidamente um poste cultual.
- source_word: אֲשֶׁר עָשָׂה
  choice: que havia feito
  rationale: O mais-que-perfeito deixa claro em português que a fabricação antecedeu a colocação da imagem.
- source_word: בַּבַּיִת
  choice: na Casa
  rationale: Mantém o termo hebraico 'casa' e sua repetição na fala divina; a inicial maiúscula sinaliza naturalmente a referência ao templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְאֶל שְׁלֹמֹה בְנוֹ
  choice: e a seu filho Salomão
  rationale: Reproduz de maneira clara a relação filial indicada pelo sufixo hebraico, cujo referente é Davi.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: que escolhi dentre todas as tribos de Israel
  rationale: ‘Dentre’ comunica a escolha feita no conjunto das tribos, sem acrescentar interpretação.
- source_word: אָשִׂים אֶת שְׁמִי לְעוֹלָם
  choice: porei o meu nome para sempre
  rationale: Mantém a formulação concreta e teológica do hebraico sobre estabelecer o nome divino no lugar escolhido.
theological_decisions:
- issue: Identificação do objeto cultual ligado a אֲשֵׁרָה
  choice: imagem esculpida de Aserá
  alternative: poste de Aserá
  rationale: O texto emprega explicitamente פֶּסֶל, ‘imagem esculpida’, por isso a tradução não reduz o objeto a um poste cultual, embora mantenha sua associação com Aserá.
- issue: Representação do tetragrama יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A forma escolhida preserva no texto traduzido o caráter de nome próprio do tetragrama.
- issue: Relação entre a Casa, Jerusalém e a escolha divina
  choice: manter a formulação compacta do hebraico
  alternative: explicitar que tanto a Casa quanto a cidade foram escolhidas
  rationale: A construção hebraica admite alguma tensão sintática quanto ao antecedente da oração relativa; a tradução evita acrescentar uma resolução interpretativa.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe dividida em duas frases para evitar uma cadeia relativa pesada. ‘Casa’ recebe inicial maiúscula por referir-se ao templo e para preservar a repetição lexical do hebraico. Não há notas de rodapé nesta versão.
