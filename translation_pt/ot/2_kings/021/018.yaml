base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: pt
  text: Manassés adormeceu com seus antepassados[a] e foi sepultado no jardim de sua casa, no jardim de Uzá. E Amom, seu filho, tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deitou-se com seus pais”; fórmula hebraica tradicional referente à morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: adormeceu
  rationale: O verbo שׁכב significa literalmente “deitar-se” e, nesta fórmula régia, funciona como eufemismo para a morte. “Adormeceu” preserva em português a imagem tradicional sem reduzir a expressão simplesmente a “morreu” nem sugerir apenas o ato físico de deitar-se.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: A expressão integra a fórmula tradicional de morte dos reis. “Antepassados” comunica com clareza o sentido genealógico de אָבוֹת no português atual; a alternativa mais literal consta na nota.
- source_word: וַיִּקָּבֵר
  choice: foi sepultado
  rationale: Tradução direta e dignificada da forma passiva de קבר, natural em relatos de morte e sepultamento.
- source_word: בְּגַן בֵּיתוֹ
  choice: no jardim de sua casa
  rationale: Mantém os termos explícitos גַּן, “jardim”, e בַּיִת, “casa”, sem especificar “palácio”, embora se trate de uma residência real.
- source_word: בְּגַן עֻזָּא
  choice: no jardim de Uzá
  rationale: Conserva a repetição apositiva do hebraico e translitera o nome próprio em forma corrente em português.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: Na fórmula de sucessão, מלך indica a ascensão ao trono; “tornou-se rei” expressa isso com mais precisão que o simples “reinou”.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: No contexto de sucessão dinástica, a expressão indica que Amom ocupou o lugar de Manassés como rei.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas nominais correntes no uso bíblico lusófono. A formulação preserva o eufemismo hebraico de morte, mas evita o possível sentido inadequado ou excessivamente físico de “deitou-se com seus pais” no texto principal.
