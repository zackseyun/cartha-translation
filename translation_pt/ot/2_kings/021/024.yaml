base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: pt
  text: Mas o povo da terra matou todos os que haviam conspirado contra o rei Amom[a]; e o povo da terra proclamou Josias, seu filho, rei em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os conspiradores contra o rei Amom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: matou
  rationale: Neste contexto, נכה descreve a ação letal contra os conspiradores. “Matou” comunica o resultado com clareza e naturalidade, sem o tom arcaico de “feriu de morte”.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Mantém a expressão sociopolítica hebraica sem restringi-la indevidamente a “povo comum” ou “proprietários de terras”; a repetição do original também é preservada.
- source_word: כָּל הַקֹּשְׁרִים
  choice: todos os que haviam conspirado
  rationale: Expressa a força verbal do particípio de קשר e situa naturalmente a conspiração como anterior à represália narrada.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: contra o rei Amom
  rationale: Com קשר, a preposição עַל indica que Amom era o alvo hostil da conspiração.
- source_word: וַיַּמְלִיכוּ
  choice: proclamou rei
  rationale: O hifil de מלך significa fazer alguém rei. “Proclamou rei” é idiomático em português e não acrescenta a cerimônia específica pressuposta por “coroou”.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: Josias, filho dele
  rationale: Identifica com clareza Josias como filho de Amom e evita uma cadeia pronominal potencialmente ambígua.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa de modo natural a sucessão de Josias no lugar de Amom.
- source_word: וַ
  choice: Mas / e
  rationale: O primeiro waw é vertido por “Mas” para marcar o contraste com o assassinato de Amom no versículo anterior; o segundo é traduzido por “e”, preservando a progressão narrativa.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se “o povo da terra” nas duas ocorrências por seu valor sociopolítico possivelmente técnico. O ponto e vírgula separa a represália da entronização sem romper a estreita ligação narrativa.
