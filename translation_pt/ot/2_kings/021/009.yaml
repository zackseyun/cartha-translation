source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּתְעֵ֤/ם מְנַשֶּׁה֙ לַ/עֲשׂ֣וֹת אֶת הָ/רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: pt
  text: Mas eles não deram ouvidos, e Manassés os desencaminhou, levando-os a praticar o mal mais do que as nações que Yahweh havia destruído diante dos filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os israelitas». Hebraico: «os filhos de Israel».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: deram ouvidos
  rationale: No contexto, שׁמע implica escutar com disposição para responder. «Não deram ouvidos» preserva tanto a ideia de ouvir quanto a de recusar-se a atender, sem explicitar demais como «não obedeceram».
- source_word: וַיַּתְעֵם
  choice: os desencaminhou
  rationale: A forma causativa de תעה indica que Manassés fez o povo desviar-se moral e espiritualmente. «Desencaminhou» comunica essa causalidade de modo natural e digno.
- source_word: לַעֲשׂוֹת אֶת הָרָע מִן הַגּוֹיִם
  choice: levando-os a fazer mais mal do que as nações
  rationale: O infinitivo expressa o resultado ou propósito do desencaminhamento, e מִן introduz a comparação. A formulação torna explícito em português o grau comparativo exigido pela sintaxe hebraica.
- source_word: הִשְׁמִיד
  choice: havia destruído
  rationale: O verbo denota destruição ou eliminação. O mais-que-perfeito composto situa naturalmente essa ação antes do reinado de Manassés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Neste contexto da conquista, a expressão indica que as nações foram removidas da presença ou do caminho de Israel. «Diante de» preserva a imagem hebraica sem soar artificial.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz a expressão hebraica tradicional e mantém sua forma masculina representativa; uma alternativa idiomática é indicada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. «Yahweh» preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Expressão coletiva בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A redação principal mantém a forma concreta do hebraico, enquanto a nota reconhece o sentido coletivo idiomático.
- issue: Alcance da comparação com as nações
  choice: fazer mais mal do que as nações
  alternative: fazer o mal, mais do que as nações
  rationale: A preposição מִן tem valor comparativo. A redação escolhida preserva a afirmação forte de que a maldade sob Manassés excedeu a das nações anteriormente destruídas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Deram ouvidos» conserva o matiz responsivo do verbo hebraico; «desencaminhou» evita coloquialismo. O marcador [a] aparece após a expressão a que se refere.
