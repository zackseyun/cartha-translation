  yaml_path: translation/ot/2_kings/021/026.yaml
  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: pt
  text: E ele foi sepultado em seu túmulo, no jardim de Uzá; e seu filho Josias tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: ele foi sepultado
  rationale: Embora a forma hebraica seja ativa e singular, literalmente «ele o sepultou», o agente não é identificado. A passiva natural em português preserva essa indefinição sem inventar um sujeito plural.
- source_word: קְבֻרָתוֹ
  choice: seu túmulo
  rationale: O substantivo designa o lugar de sepultamento; «túmulo» é conciso, claro e apropriado ao registro narrativo.
- source_word: גַן עֻזָּא
  choice: jardim de Uzá
  rationale: Preserva diretamente a relação construta hebraica e emprega a forma portuguesa usual do nome próprio.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: Na fórmula de sucessão, o verbo indica a ascensão ao trono, sentido expresso com precisão por «tornou-se rei».
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: A expressão idiomática indica que Josias sucedeu ao pai no trono.
