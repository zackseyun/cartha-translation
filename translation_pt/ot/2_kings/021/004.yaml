  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: pt
  text: 'Ele construiu altares na casa de Yahweh[a], sobre a qual Yahweh havia dito: “Em Jerusalém porei o meu nome.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no templo de Yahweh”. Literalmente, “na casa de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: '“Porei o meu nome” é linguagem da aliança ligada ao templo: indica o lugar que Yahweh escolhe para associar ao seu nome e à sua presença.'
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בָנָה
  choice: Ele construiu
  rationale: O wayyiqtol qal, terceira pessoa masculina singular de בנה, dá continuidade à narrativa. Em português, a omissão do ו inicial produz uma frase mais natural sem perder a sequência dos acontecimentos.
- source_word: מִזְבְּחֹת
  choice: altares
  rationale: Plural de מִזְבֵּחַ, termo comum para altares destinados a sacrifícios; a tradução direta é clara e natural.
- source_word: בְּ/בֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Preserva de perto a expressão hebraica בֵּית יְהוָה. Embora “no templo de Yahweh” seja mais explícito, “casa” mantém a imagem do texto-fonte e continua compreensível com a nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: sobre a qual Yahweh havia dito
  rationale: A oração relativa retoma naturalmente “casa de Yahweh”. O mais-que-perfeito composto indica que a declaração divina precedeu a ação narrada.
- source_word: בִּ/ירוּשָׁלַם
  choice: Em Jerusalém
  rationale: A preposição ב indica localização, e a posição inicial preserva a ênfase da ordem hebraica.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: porei o meu nome
  rationale: Mantém o idioma hebraico de modo conciso, sem explicá-lo dentro do texto nem acrescentar “ali”, palavra não expressa neste versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Linguagem do templo em “porei o meu nome”
  choice: Conservar o idioma “porei o meu nome”
  alternative: estabelecerei a minha presença; farei o meu nome habitar ali
  rationale: A expressão associa Jerusalém ao nome e à presença de Deus, mas o versículo formula isso por meio de um idioma conciso. Mantê-lo evita transformar a interpretação teológica em paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Porei” conserva a concisão solene do hebraico sem soar arcaico; “casa de Yahweh” mantém a imagem original, esclarecida em nota.
