  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֥ה אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh[a], assim como seu pai Manassés havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aos olhos de Yahweh”.'
    reason: A nota registra a forma literal da expressão hebraica; neste caso, ela coincide com a formulação adotada no texto e ressalta sua metáfora avaliativa.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ele fez
  rationale: O waw consecutivo dá continuidade à narrativa; em português, a conjunção inicial pode ser omitida com naturalidade, preservando-se o passado simples.
- source_word: הָרַע
  choice: o que era mau
  rationale: A expressão עשה הרע significa fazer o mal ou o que é mau. Esta formulação é idiomática e conserva o caráter avaliativo da expressão.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a metáfora hebraica tradicional e comunica que a conduta é avaliada segundo o juízo de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Expressa com clareza e naturalidade a comparação entre a conduta do filho e a do pai.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito composto esclarece que os atos de Manassés precederam os do sujeito da oração principal.
- source_word: מְנַשֶּׁה אָבִיו
  choice: seu pai Manassés
  rationale: Reproduz de modo natural em português o nome próprio seguido da relação paterna indicada pelo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o Tetragrama como nome próprio. A transliteração preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A expressão bíblica “aos olhos de” foi preservada por ser corrente e facilmente compreensível.
