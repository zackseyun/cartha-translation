  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: pt
  text: 'Por isso, assim diz Yahweh, o Deus de Israel: “Eis que estou trazendo uma desgraça[a] sobre Jerusalém e Judá, de modo que os dois ouvidos de todo aquele que ouvir falar dela ficarão tinindo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “calamidade”. Aqui, o termo hebraico se refere a um juízo desastroso, não ao mal moral.
    reason: lexical_alternative
  - marker: b
    text: Expressão idiomática hebraica que comunica o choque ou horror provocado pela notícia.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa de maneira natural a consequência do contexto anterior, preservando a força inferencial do hebraico.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Mantém a fórmula profética de mensageiro em linguagem portuguesa clara e digna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção hebraica que identifica Yahweh.
- source_word: הִנְנִי מֵבִיא
  choice: Eis que estou trazendo
  rationale: Preserva tanto a ênfase apresentativa de הִנְנִי quanto a ação vívida e iminente expressa pelo particípio.
- source_word: רָעָה
  choice: desgraça
  rationale: No contexto de juízo, designa uma catástrofe ou calamidade, não maldade moral; “desgraça” é corrente e natural em português.
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: sobre Jerusalém e Judá
  rationale: Comunica o juízo que virá sobre esses lugares sem tornar a preposição desnecessariamente hostil.
- source_word: אֲשֶׁר כָּל שֹׁמְעָיו
  choice: de modo que ... todo aquele que ouvir falar dela
  rationale: Explicita o resultado e entende o sufixo como referência à desgraça anunciada, sem acrescentar conteúdo.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: os dois ouvidos ... ficarão tinindo
  rationale: Conserva a imagem concreta do idioma hebraico, que descreve o choque ou horror causado pela notícia.
theological_decisions:
- issue: Sentido de רָעָה no anúncio do juízo divino
  choice: desgraça
  alternative: mal; calamidade
  rationale: O contexto fala da catástrofe punitiva trazida por Deus, não de maldade moral. “Desgraça” preserva o sentido judicial sem resolver além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A fórmula profética e a imagem dos ouvidos foram preservadas sem excesso de arcaísmo.
