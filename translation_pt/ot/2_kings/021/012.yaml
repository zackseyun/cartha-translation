  source_fidelity: A tradução preserva adequadamente a relação inferencial de לָכֵן, a fórmula profética כֹּה אָמַר, a ênfase de הִנְנִי com o particípio, e o sentido de juízo calamitoso de רָעָה. “Todo aquele que ouvir falar dela” reproduz de modo natural a referência do sufixo em שֹׁמְעָיו sem especificá-la além do necessário. A imagem idiomática dos ouvidos que “ficarão tinindo” mantém o efeito de choque/horror do hebraico.
