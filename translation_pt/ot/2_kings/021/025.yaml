  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais feitos[a] de Amom, que ele fez, não estão escritos no Livro[b] das Crônicas dos Reis de Judá?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «atos». A expressão hebraica significa literalmente «palavras» ou «assuntos», mas, nesta fórmula de resumo régio, refere-se aos feitos registrados do rei.
    reason: lexical_alternative
  - marker: b
    text: «Livro» refere-se a um antigo registro escrito, provavelmente um rolo. A expressão também pode ser traduzida como «os Anais dos Reis de Judá».
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Os demais
  rationale: יֶתֶר indica o restante; neste resumo régio, «os demais» é natural em português. O וְ funciona como ligação discursiva e não exige um «agora» temporal.
- source_word: דִּבְרֵי
  choice: feitos
  rationale: Embora דִּבְרֵי possa significar literalmente «palavras» ou «assuntos», nesta fórmula historiográfica designa os atos registrados do rei.
- source_word: אָמ֖וֹן
  choice: Amom
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: אֲשֶׁר עָשָׂה
  choice: tudo o que ele fez
  rationale: Expressa com naturalidade a oração relativa e explicita que se trata do conjunto das ações de Amom, sem acrescentar conteúdo alheio ao hebraico.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Preserva a pergunta retórica negativa, que espera resposta afirmativa, e mantém o sentido direto do particípio passivo «escritos».
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל seja literalmente «sobre», em português o conteúdo de um registro está idiomaticamente «no» livro. «Livro» é a forma convencional, com nota esclarecendo que o suporte antigo provavelmente era um rolo.
- source_word: דִּבְרֵי הַיָּמִים
  choice: das Crônicas
  rationale: Na citação de uma fonte régia, a expressão designa um registro analístico; «Crônicas» preserva o caráter de título e o uso bíblico consagrado.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: dos Reis de Judá
  rationale: Nesse título documental, לְ indica associação e é traduzido naturalmente por «dos».
