base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: pt
  text: 'Então ele foi até a nascente das águas, lançou sal ali e disse: “Assim diz Yahweh: Eu curei estas águas. Delas não virão mais morte nem perda gestacional[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem aborto espontâneo” ou “nem esterilidade”. O termo hebraico pode indicar perda da descendência, causar aborto espontâneo ou improdutividade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: nascente das águas
  rationale: מוֹצָא designa o lugar de onde a água sai; no contexto do abastecimento da cidade, “nascente” expressa isso naturalmente. O plural “águas” mantém a forma e o tom bíblico sem prejudicar a compreensão.
- source_word: מֶלַח
  choice: sal
  rationale: Equivalente lexical direto e adequado ao contexto.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética e translitera o nome divino expresso no hebraico.
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: Eu curei estas águas
  rationale: Mantém a metáfora vívida do verbo רפא, “curar”, aplicado à água, sem reduzi-la a uma mera explicação de potabilidade.
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: Delas não virão mais
  rationale: Representa de modo natural a ideia de que os efeitos nocivos já não procederão daquela água.
- source_word: מָוֶת
  choice: morte
  rationale: Equivalente direto; não especifica indevidamente como a água produzia a morte.
- source_word: מְשַׁכָּלֶת
  choice: perda de filhos
  rationale: A palavra derivada de שׁכל pode indicar privação de descendência, aborto ou efeito que causa essa perda. “Perda de filhos” conserva uma amplitude semântica maior do que “aborto” isoladamente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Alcance de מְשַׁכָּלֶת
  choice: perda de filhos
  alternative: aborto; esterilidade; aquilo que causa aborto
  rationale: O termo é semanticamente difícil neste contexto e pode envolver perda da descendência ou improdutividade. A tradução principal evita restringi-lo apenas a aborto, enquanto a nota registra as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem narrativa e a fórmula profética foram preservadas. A nota explicita a ambiguidade genuína de מְשַׁכָּלֶת.
