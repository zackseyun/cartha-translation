base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: pt
  text: 'Eliseu estava olhando[a] e clamava: “Meu pai, meu pai! O carro de Israel e seus cavaleiros!” Não o viu mais; então agarrou suas próprias roupas e as rasgou em duas partes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A exclamação “O carro de Israel e seus cavaleiros!” pode identificar Elias como a verdadeira força e defesa de Israel ou referir-se à cena celestial do carro e dos cavalos que Eliseu está presenciando.
    reason: Leitura alternativa decorrente da ambiguidade do referente da exclamação hebraica.
lexical_decisions:
- source_word: רֹאֶה
  choice: estava olhando
  rationale: O particípio expressa uma ação em andamento enquanto Elias era levado; a locução verbal preserva esse aspecto durativo.
- source_word: מְצַעֵק
  choice: clamava
  rationale: O particípio indica ação contínua e emocional. “Clamava” é digno e corrente, sem limitar o sentido a mero volume.
- source_word: אָבִי אָבִי
  choice: Meu pai, meu pai!
  rationale: Mantém o sufixo de primeira pessoa e a repetição enfática, que expressa a relação entre discípulo e profeta, não necessariamente paternidade biológica.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: O carro de Israel e seus cavaleiros
  rationale: Preserva o singular “carro”, o plural “cavaleiros” e o sufixo masculino singular, sem explicar no texto a referência ambígua da exclamação.
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: Depois, não o viu mais
  rationale: Expressa com naturalidade a cessação definitiva da visão no fluxo narrativo.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: agarrou suas próprias roupas
  rationale: “Agarrou” comunica que Eliseu tomou firmemente as roupas; “suas próprias” esclarece que eram as roupas dele, em contraste contextual com o manto de Elias.
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: as rasgou em duas partes
  rationale: Reproduz de modo natural o resultado enfático da ação e o gesto de luto.
theological_decisions:
- issue: Sentido do clamor “Meu pai, meu pai! O carro de Israel e seus cavaleiros!”
  choice: Manter a exclamação metafórica sem identificar explicitamente seu referente no texto principal.
  alternative: Entender que Eliseu chama Elias de verdadeira força e defesa de Israel, ou que se refere ao carro e aos cavalos celestiais que presencia.
  rationale: A construção hebraica admite ambas as relações contextuais. A tradução direta conserva a ambiguidade e a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregaram-se formas narrativas naturais, mantendo os particípios hebraicos com valor durativo e sem resolver a ambiguidade teológica da exclamação.
