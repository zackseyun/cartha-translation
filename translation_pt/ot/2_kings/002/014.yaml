  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: pt
  text: 'Então ele pegou o manto de Elias, que havia caído dele, bateu nas águas e disse: “Onde está Yahweh, o Deus de Elias?” Então ele também[a] bateu nas águas, que se dividiram para um lado e para o outro, e Eliseu atravessou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica traduzida por “também” é breve e de sentido incerto. Pode estar ligada à pergunta anterior: “Onde está Yahweh, o Deus de Elias — ele mesmo?”, talvez enfatizando que o mesmo Deus que estava com Elias continuava presente.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: manto
  rationale: Designa a veste exterior característica de Elias. “Manto” é natural no português bíblico contemporâneo e mantém a imagem concreta.
- source_word: נָפְלָה מֵעָלָיו
  choice: que havia caído dele
  rationale: O mais-que-perfeito composto esclarece que a queda do manto ocorreu antes de Eliseu o pegar.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: bateu nas águas
  rationale: “Bateu” é corrente e concreto; o plural “águas” acompanha a forma hebraica e é idiomático no contexto do rio.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Preserva a pergunta direta por localização ou presença, sem explicar antecipadamente seu sentido como apelo por intervenção divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: o Deus de Elias
  rationale: Reproduz com clareza a relação construta e conserva a formulação bíblica natural em português.
- source_word: אַף הוּא
  choice: também
  rationale: A expressão hebraica é breve e difícil. Ligá-la ao segundo ato de bater nas águas oferece uma leitura sintaticamente possível, sem inserir uma afirmação teológica ausente; a nota registra a ambiguidade.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: que se dividiram para um lado e para o outro
  rationale: Expressa claramente a separação das águas em direções opostas e preserva o plural hebraico.
- source_word: וַיַּעֲבֹר
  choice: atravessou
  rationale: É a forma mais direta e natural para a travessia do rio neste contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Vinculação e sentido de אַף הוּא
  choice: 'Vinculado ao segundo golpe: “Então ele também bateu nas águas”'
  alternative: 'Vinculado à pergunta: “Onde está Yahweh, o Deus de Elias? Ele mesmo?”; ou entendido como ênfase na continuidade da presença e ação de Yahweh'
  rationale: A sequência hebraica é comprimida e sua construção é debatida. A tradução adota uma análise sintática possível, enquanto a nota conserva as demais leituras sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “manto” por sua naturalidade no contexto bíblico, e a ambiguidade de אַף הוּא foi explicitamente preservada em nota.
