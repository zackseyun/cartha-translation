  text: וַ/יְהִ֗י הֵ֣מָּה הֹלְכִ֤ים הָלוֹךְ֙ וְ/דַבֵּ֔ר וְ/הִנֵּ֤ה רֶֽכֶב אֵשׁ֙ וְ/ס֣וּסֵי אֵ֔שׁ וַ/יַּפְרִ֖דוּ בֵּ֣ין שְׁנֵי/הֶ֑ם וַ/יַּ֨עַל֙ אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: pt
  text: Enquanto eles iam caminhando e conversando, eis que um carro de fogo e cavalos de fogo separaram os dois[b], e Elias subiu ao céu pelo redemoinho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no redemoinho”. A preposição hebraica pode indicar meio, acompanhamento ou localização.'
    reason: lexical_alternative
  - marker: b
    text: O texto diz que o carro de fogo e os cavalos de fogo separaram Elias e Eliseu e que Elias subiu pelo redemoinho; não afirma explicitamente que Elias tenha ido no carro.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר
  choice: Enquanto eles iam caminhando e conversando
  rationale: A construção com particípio e infinitivo absoluto apresenta ações contínuas e simultâneas. A formulação preserva essa duração em português natural, sem recorrer ao arcaísmo “e aconteceu que”.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a função de chamar a atenção para uma aparição dramática, em registro narrativo digno e ainda corrente.
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: um carro de fogo e cavalos de fogo
  rationale: Reproduz as duas construções hebraicas e o paralelismo da imagem, sem definir se o fogo indica matéria, aparência ou qualidade sobrenatural.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: separaram os dois
  rationale: O verbo plural provavelmente tem como sujeito coletivo o carro e os cavalos. “Os dois” conserva a referência explícita a Elias e Eliseu.
- source_word: וַיַּעַל אֵלִיָּהוּ
  choice: Elias subiu
  rationale: Expressa diretamente o movimento ascendente de עלה, com naturalidade e sem acrescentar um veículo não declarado pelo texto.
- source_word: בַּסְעָרָה
  choice: pelo redemoinho
  rationale: “Pelo” representa a possível função instrumental da preposição ב. A nota preserva as possibilidades locativa e de acompanhamento.
- source_word: הַשָּׁמָיִם
  choice: ao céu
  rationale: No contexto do movimento de subida, “ao céu” é idiomático e mantém o registro elevado; evita reduzir a expressão simplesmente ao céu visível.
theological_decisions:
- issue: Se o carro de fogo transportou Elias ou apenas separou Elias e Eliseu
  choice: O carro e os cavalos de fogo separam os dois homens; Elias sobe pelo redemoinho.
  alternative: Elias sobe transportado no carro de fogo.
  rationale: O hebraico associa explicitamente o carro e os cavalos à separação dos dois e o redemoinho à subida. A tradução não introduz a ideia, comum mas não expressa, de que Elias entrou no carro.
- issue: Valor da preposição ב em בַּסְעָרָה
  choice: 'Valor instrumental: “pelo redemoinho”.'
  alternative: 'Valor locativo ou de acompanhamento: “no redemoinho”.'
  rationale: A preposição permite mais de uma relação semântica neste contexto. A leitura instrumental é apresentada no texto principal, e a ambiguidade legítima é registrada em nota.
translation_notes:
  register: Português moderno, claro e narrativamente digno, com ampla legibilidade brasileira. “Eis que” conserva a vivacidade literária do hebraico sem tornar o restante do versículo arcaico. Os marcadores foram colocados junto às expressões que explicam.
