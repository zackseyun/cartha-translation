    rationale: O particípio hebraico מְשַׁכֶּלֶת indica causar perda de descendência; “abortos espontâneos” transmite em português a noção de perda gestacional sem a conotação de ação deliberada que “abortos” isoladamente pode ter.
  - severity: medium
    issue: 'A alternativa da nota está sintaticamente imprecisa: “torna a terra improdutiva”.'
    rationale: 'Na oração hebraica, “a terra” é o sujeito de מְשַׁכֶּלֶת. A alternativa contextual deve ser formulada como predicação da terra: “a terra é improdutiva”.'
