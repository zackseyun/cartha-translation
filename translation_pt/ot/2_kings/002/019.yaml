  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל אֱלִישָׁ֔ע הִנֵּה נָ֞א מוֹשַׁ֤ב הָ/עִיר֙ ט֔וֹב כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י רֹאֶ֑ה וְ/הַ/מַּ֥יִם רָעִ֖ים וְ/הָ/אָ֥רֶץ מְשַׁכָּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: pt
  text: 'Então os homens da cidade disseram a Eliseu: “Veja, por favor: a localização da cidade é boa, como meu senhor pode ver; mas a água é ruim, e a terra provoca abortos espontâneos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra é improdutiva”. O termo hebraico traduzido como “provoca abortos espontâneos” pode indicar a perda de descendência e, neste contexto, talvez também inclua a improdutividade agrícola.'
    reason: Alternativa lexical e preservação da ambiguidade contextual de מְשַׁכֶּלֶת.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Então ... disseram
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: Preserva o masculino plural explícito do hebraico e mantém a referência aos representantes masculinos da cidade.
- source_word: הִנֵּה נָא
  choice: Veja, por favor
  rationale: “Veja” conserva a força de chamar a atenção, enquanto “por favor” comunica a nuance cortês de נָא.
- source_word: מוֹשַׁב הָעִיר
  choice: a localização da cidade
  rationale: No contexto, מוֹשַׁב indica o lugar ou sítio em que a cidade está situada; “localização” é claro e corrente.
- source_word: טוֹב
  choice: boa
  rationale: Equivalente direto que descreve favoravelmente a localização da cidade.
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: como o meu senhor pode ver
  rationale: Mantém o tratamento respeitoso dirigido a Eliseu e expressa de modo natural em português aquilo que está evidente diante dele.
- source_word: וְהַמַּיִם רָעִים
  choice: mas a água é ruim
  rationale: A conjunção tem valor contrastivo diante da boa localização; o singular coletivo “água” é idiomático para o abastecimento local.
- source_word: וְהָאָרֶץ
  choice: e a terra
  rationale: “Terra” preserva a possível referência tanto ao solo quanto à região local.
- source_word: מְשַׁכָּלֶת
  choice: causa abortos
  rationale: O particípio piel de שׁכל indica causar perda de descendência. A formulação concreta preserva essa força lexical, sem apagar sua possível extensão à esterilidade agrícola.
theological_decisions:
- issue: Sentido de אֲדֹנִי no tratamento dirigido a Eliseu
  choice: meu senhor
  alternative: meu mestre
  rationale: Trata-se de um título social de respeito, não de uma designação divina. “Meu senhor” preserva a deferência sem atribuir divindade a Eliseu.
- issue: Alcance de מְשַׁכָּלֶת
  choice: causa abortos
  alternative: é improdutiva
  rationale: A tradução principal conserva a imagem concreta da perda de descendência; a nota registra que, no contexto, a expressão também pode abranger a improdutividade da terra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o contraste do hebraico foram preservados sem rigidez artificial; a ambiguidade de מְשַׁכָּלֶת é mantida por meio da nota.
