  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: pt
  text: 'Então os filhos dos profetas que estavam em Jericó se aproximaram de Eliseu e lhe disseram: “Você sabe que hoje Yahweh tirará o seu mestre de cima da sua cabeça[a]?” Ele respondeu: “Eu também sei. Fiquem calados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deixará de estar sobre você”. O hebraico diz literalmente “de cima da sua cabeça”, expressão que pode indicar a retirada de alguém que exercia autoridade sobre outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: se aproximaram
  rationale: Expressa naturalmente o movimento em direção a Eliseu e corresponde ao sentido comum de נגשׁ.
- source_word: בְנֵי הַנְּבִיאִים
  choice: os filhos dos profetas
  rationale: Preserva a forma do idioma hebraico, que provavelmente designa integrantes ou discípulos de um grupo profético, sem resolver essa identificação no texto principal.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: que estavam em Jericó
  rationale: Identifica com clareza e naturalidade o grupo localizado em Jericó.
- source_word: הֲיָדַעְתָּ
  choice: Você sabe
  rationale: O perfeito interrogativo indica aqui conhecimento presente; esta formulação é corrente no português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לֹקֵחַ
  choice: levará
  rationale: O particípio descreve uma ação iminente prevista para hoje. O futuro é mais natural em português neste contexto, sem especificar o modo dessa retirada.
- source_word: אֲדֹנֶיךָ
  choice: o seu mestre
  rationale: No contexto da relação humana entre Elias e Eliseu, 'mestre' comunica superioridade e discipulado sem a possível carga teológica de 'Senhor'.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: de sobre a sua cabeça
  rationale: Mantém a imagem concreta e incomum do hebraico, deixando sua provável dimensão de autoridade para a nota.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Eu também sei
  rationale: Conserva tanto a partícula aditiva גַּם quanto o pronome enfático em português natural.
- source_word: הֶחֱשׁוּ
  choice: Fiquem calados
  rationale: Reproduz o imperativo plural e a resposta breve e incisiva de Eliseu.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Interpretação de מֵעַל רֹאשֶׁךָ
  choice: manter no texto a expressão concreta “de sobre a sua cabeça”
  alternative: deixar de estar sobre você; tirar de você aquele que o dirige
  rationale: A expressão provavelmente alude à remoção de alguém que exerce autoridade sobre Eliseu, mas a imagem hebraica permite alguma tensão interpretativa e não deve ser silenciosamente reduzida a uma paráfrase.
- issue: Aspecto temporal de לֹקֵחַ
  choice: levará
  alternative: está levando; está para levar
  rationale: Com “hoje”, o particípio aponta para uma ação iminente. O futuro idiomático em português preserva essa expectativa sem sugerir necessariamente que a ação já começou.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você”. A ordem e a concisão do diálogo foram preservadas. O idioma hebraico “filhos dos profetas” foi mantido deliberadamente, e a imagem “de sobre a sua cabeça” recebeu esclarecimento em nota sem ser eliminada do texto.
