  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: pt
  text: 'Quando os discípulos dos profetas que estavam em Jericó o viram de longe[a], disseram: “O espírito de Elias repousa sobre Eliseu.” Então foram ao encontro dele e se prostraram diante dele até o chão[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de uma posição oposta”; a expressão hebraica indica uma posição em frente ou à vista, possivelmente também a certa distância.
    reason: lexical_alternative
  - marker: b
    text: O gesto expressa profunda honra e submissão; não implica necessariamente adoração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֻהוּ
  choice: o viram
  rationale: Tradução direta de ראה com sufixo de objeto masculino singular; expressa percepção visual simples no contexto narrativo.
- source_word: בְנֵי הַנְּבִיאִים
  choice: os discípulos dos profetas
  rationale: O idioma hebraico designa integrantes de uma comunidade profética, não necessariamente filhos biológicos. Esta formulação comunica naturalmente a relação formativa sem impor a ideia mais específica de uma corporação formal.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: que estavam em Jericó
  rationale: Identifica o grupo profético localizado em Jericó, em português narrativo natural.
- source_word: מִנֶּגֶד
  choice: de longe
  rationale: No contexto, indica que eles o viam de uma posição oposta e a certa distância. A nota conserva a nuance espacial mais ampla do hebraico.
- source_word: נָחָה
  choice: repousa
  rationale: 'O perfeito descreve um estado resultante reconhecido pelos observadores: o espírito veio a repousar e agora permanece sobre Eliseu.'
- source_word: רוּחַ אֵלִיָּהוּ
  choice: o espírito de Elias
  rationale: Mantém a construção hebraica e sua tensão interpretativa, sem explicitar no corpo do texto se se trata de capacitação, autoridade ou espírito profético.
- source_word: עַל אֱלִישָׁע
  choice: sobre Eliseu
  rationale: A preposição עַל com רוּחַ é naturalmente vertida por “sobre” e preserva a imagem bíblica do espírito repousando sobre alguém.
- source_word: לִקְרָאתוֹ
  choice: ao encontro dele
  rationale: Expressa o movimento intencional de ir encontrar alguém.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: se prostraram diante dele
  rationale: Reproduz o gesto intenso de reverência ou submissão sem traduzi-lo como adoração divina.
- source_word: אָרְצָה
  choice: com o rosto em terra
  rationale: Comunica de modo idiomático a prostração dirigida até o chão, tornando clara a postura física indicada pela forma direcional.
theological_decisions:
- issue: Sentido de “o espírito de Elias”
  choice: Preservar literalmente a expressão como reconhecimento de continuidade profética em Eliseu.
  alternative: Explicitar no texto “o poder profético de Elias” ou entender que a alma pessoal de Elias foi transferida.
  rationale: O contexto de 2 Reis 2:9,15 favorece sucessão e capacitação proféticas, mas o versículo emprega simplesmente “espírito de Elias”. A tradução mantém essa formulação e evita tanto a transmigração quanto uma paráfrase teológica excessiva.
- issue: Natureza da prostração diante de Eliseu
  choice: Apresentar o gesto como prostração reverente diante do sucessor profético de Elias.
  alternative: Traduzir como adoração religiosa prestada a Eliseu.
  rationale: שחה pode indicar reverência diante de seres humanos ou adoração a Deus conforme o contexto. Aqui, o reconhecimento da autoridade profética de Eliseu favorece homenagem e submissão, não culto divino.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “discípulos dos profetas” para tornar inteligível o idioma hebraico. “Repousa” preserva a linguagem teológica e poética do original. As notas esclarecem as nuances espaciais e gestuais sem sobrecarregar o versículo.
