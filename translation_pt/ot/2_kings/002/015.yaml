  terminology: “Discípulos dos profetas” comunica adequadamente o grupo conhecido pelo hebraico como בני הנביאים, sem sugerir filiação biológica. “O espírito de Elias” preserva a formulação do texto e sua abertura interpretativa. Os nomes Elias e Eliseu estão na forma portuguesa corrente.
