  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: pt
  text: Ele apanhou o manto de Elias[a], que havia caído de Elias, voltou e ficou de pé à margem do Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «capa». O termo hebraico se refere a uma peça exterior distintiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: apanhou
  rationale: O verbo expressa erguer ou levantar; no contexto de uma peça de roupa caída, «apanhou» comunica naturalmente a ação concreta.
- source_word: אַדֶּרֶת
  choice: manto
  rationale: Designa uma peça exterior distintiva. «Manto» é claro, digno e amplamente compreensível em português.
- source_word: אֵלִיָּהוּ
  choice: Elias
  rationale: Emprega-se a forma tradicional e corrente do nome em português.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: que havia caído dele
  rationale: Mantém a relação explícita com Elias e indica que a queda precedeu a ação principal.
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: Traduz de modo direto e natural o sentido de retornar ou voltar.
- source_word: וַיַּעֲמֹד
  choice: ficou de pé
  rationale: Expressa claramente a ação de parar e permanecer em posição ereta junto ao rio.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: à margem do Jordão
  rationale: שָׂפָה indica a borda ou margem; para um rio, «à margem» é a formulação portuguesa mais natural.
