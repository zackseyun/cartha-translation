  text: וַ/יֵּרָפ֣וּ הַ/מַּ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ/דְבַ֥ר אֱלִישָׁ֖ע אֲשֶׁ֥ר דִּבֵּֽר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/022.yaml
  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: pt
  text: Assim, as águas foram curadas e permanecem assim até hoje[a], conforme a palavra que Eliseu falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram restauradas” ou “se tornaram saudáveis”. O verbo hebraico é o termo normalmente usado para “curar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: foram curadas
  rationale: O verbo רפא é o termo comum para “curar”. Aplicado às águas, preserva a metáfora do hebraico e descreve sua transformação de nocivas em saudáveis.
- source_word: הַמַּיִם
  choice: as águas
  rationale: Mantém o plural formal do hebraico מַיִם e soa natural no contexto de uma fonte ou reserva de água.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: permanecem assim até hoje
  rationale: Expressa de modo claro que o estado restaurado continuava até o tempo do narrador. O acréscimo explícito de “permanecem assim” torna natural em português a relação temporal sem mudar o sentido.
- source_word: כִּדְבַר
  choice: conforme a palavra
  rationale: Preserva דָּבָר como “palavra” e vincula diretamente o resultado à declaração profética anterior.
- source_word: אֱלִישָׁע
  choice: Eliseu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲשֶׁר דִּבֵּר
  choice: que Eliseu falou
  rationale: Identifica de modo claro e corrente a declaração específica do profeta, sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Linguagem de cura aplicada às águas
  choice: 'Manter a metáfora: “as águas foram curadas”.'
  alternative: “as águas foram restauradas” ou “a água se tornou saudável”
  rationale: O hebraico emprega רפא, o verbo comum para curar. A tradução conserva a imagem teológica e literária de restauração efetuada em conformidade com a palavra profética, sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Assim” representa a sequência narrativa; “permanecem assim até hoje” explicita naturalmente em português a continuidade indicada pelo idioma hebraico.
