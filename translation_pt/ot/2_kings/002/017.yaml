base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: pt
  text: 'Mas eles insistiram com ele até que ficou constrangido[a], e ele disse: “Mandem os homens.” Então mandaram cinquenta homens, que procuraram durante três dias, mas não o encontraram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até que ficou envergonhado”. A expressão hebraica pode ser traduzida literalmente como “até envergonhar-se” e descreve a pressão social causada pela insistência repetida deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: insistiram com ele
  rationale: O verbo פצר expressa pressão ou insistência persistente. “Insistiram com ele” é natural em português e preserva a ação repetida dirigida a Eliseu.
- source_word: עַד בֹּשׁ
  choice: até que ficou constrangido
  rationale: בוש pode indicar vergonha ou constrangimento. Neste contexto, a expressão descreve o efeito da pressão social causada pela insistência; “constrangido” comunica isso sem eliminar a alternativa mais literal, registrada em nota.
- source_word: שְׁלָחוּ
  choice: Mandem-nos
  rationale: O imperativo masculino plural de שלח concede permissão para enviar os homens. O pronome torna explícito o objeto implícito no contexto.
- source_word: חֲמִשִּׁים אִישׁ
  choice: cinquenta homens
  rationale: Traduz diretamente a expressão hebraica, sem acrescentar aqui a identificação contextual deles como membros do grupo dos profetas.
- source_word: וַיְבַקְשׁוּ
  choice: procuraram
  rationale: בקש, neste contexto, significa procurar ou buscar uma pessoa. “Procuraram” é claro e idiomático em português.
- source_word: שְׁלֹשָׁה יָמִים
  choice: durante três dias
  rationale: A expressão temporal indica a duração da busca; “durante” explicita essa função de modo natural.
- source_word: וְלֹא מְצָאֻהוּ
  choice: mas não o encontraram
  rationale: מצא significa “encontrar”. “Mas” expressa naturalmente o contraste entre a busca prolongada e seu resultado negativo.
