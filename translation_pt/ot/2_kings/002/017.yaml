  naturalness: O texto é claro e de registro apropriado. “Até que ficou constrangido” é uma opção natural para a pressão social expressa por עַד בֹּשׁ, com a alternativa mais literal preservada em nota. A substituição do pronome no imperativo elimina uma ambiguidade gramatical relevante.
  terminology: '“Insistiram com ele”, “cinquenta homens”, “procuraram durante três dias” e “não o encontraram” são escolhas adequadas. A nota deve descrever a construção hebraica com mais precisão: trata-se de uma expressão idiomática, literalmente próxima de “até envergonhar-se”/“até ficar envergonhado”, sem exigir uma paráfrase interpretativa excessiva.'
