base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: pt
  text: 'Então os filhos dos profetas que estavam em Betel saíram ao encontro de Eliseu e lhe disseram: “Você sabe que hoje Yahweh vai tirar o seu mestre de sobre a sua cabeça[a]?” Ele respondeu: “Eu também sei. Calem-se.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de estar acima de você”. Em hebraico, a expressão diz literalmente “de sobre a sua cabeça” e pode indicar a retirada de alguém que exerce autoridade sobre outra pessoa.
    reason: Esclarece o provável valor idiomático sem apagar a metáfora do texto principal nem alterar o sentido de remoção expresso pelo verbo.
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: os filhos dos profetas
  rationale: Preserva a expressão relacional hebraica e seu provável sentido de membros ou discípulos de um grupo profético, sem substituir a metáfora por uma interpretação específica.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: que estavam em Betel
  rationale: Identifica naturalmente o grupo por sua localização no cenário narrativo.
- source_word: אֶל אֱלִישָׁע
  choice: ao encontro de Eliseu
  rationale: No contexto de movimento, expressa de modo natural o sentido de saírem em direção a Eliseu.
- source_word: הֲיָדַעְתָּ
  choice: Você sabe
  rationale: O presente idiomático em português corresponde à pergunta hebraica sobre conhecimento atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֹקֵחַ
  choice: vai tirar
  rationale: Comunica a ação iminente indicada pelo particípio no contexto de algo que ocorrerá naquele mesmo dia; 'tirar' também se integra à expressão seguinte.
- source_word: אֲדֹנֶיךָ
  choice: o seu mestre
  rationale: Refere-se a Elias como superior e mentor de Eliseu; 'mestre' evita confusão com um título divino.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: de sobre a sua cabeça
  rationale: Mantém visível a metáfora hebraica da retirada daquele que está acima de outra pessoa em posição de autoridade.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Eu também sei
  rationale: Reproduz explicitamente גַּם אֲנִי, indicando que Eliseu compartilha esse conhecimento.
- source_word: הֶחֱשׁוּ
  choice: Calem-se
  rationale: Imperativo plural direto e solene, dirigido ao grupo dos filhos dos profetas.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da retirada do mestre de Eliseu
  choice: manter a imagem 'de sobre a sua cabeça' com nota explicativa
  alternative: tirar de junto de você / deixar de ser seu superior
  rationale: A formulação preserva tanto a imagem concreta quanto a ideia provável de remoção de alguém que exerce autoridade, sem reduzir a expressão a uma única paráfrase.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O diálogo usa 'você' e formas verbais correntes; o imperativo plural 'Calem-se' preserva que Eliseu se dirige ao grupo. A construção incomum 'de sobre a sua cabeça' é mantida deliberadamente por fidelidade à imagem hebraica e acompanhada de nota.
