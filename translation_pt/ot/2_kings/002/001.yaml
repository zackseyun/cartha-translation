  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הַעֲל֤וֹת יְהוָה֙ אֶת אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָ֑יִם וַ/יֵּ֧לֶךְ אֵלִיָּ֛הוּ וֶ/אֱלִישָׁ֖ע מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: pt
  text: Aconteceu que, quando Yahweh estava para levar Elias ao céu[b] num redemoinho[a], Elias e Eliseu partiram de Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num vendaval” ou “numa tempestade”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “aos céus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: A forma narrativa de היה introduz um novo episódio. “Aconteceu que” conserva essa função sem recorrer à formulação arcaica “E sucedeu que” nem acrescentar um advérbio temporal ausente do hebraico.
- source_word: בְּהַעֲלוֹת
  choice: quando ... estava para levar ... ao alto
  rationale: O infinitivo construto com בְּ estabelece a circunstância temporal. Como a subida ainda será narrada, “estava para levar” exprime naturalmente o sentido iminente; “levar ... ao céu” preserva o movimento ascendente de עלה no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliteração do nome divino, em vez de sua substituição por um título.
- source_word: אֶת אֵלִיָּהוּ
  choice: Elias
  rationale: Nome próprio vertido segundo sua forma portuguesa tradicional e amplamente reconhecida.
- source_word: בַּסְעָרָה
  choice: num redemoinho
  rationale: סְעָרָה pode indicar tempestade, vendaval ou redemoinho. “Redemoinho” se ajusta ao contexto imediato e a preposição בְּ é aqui expressa naturalmente por “num”, sem decidir de modo rígido entre meio e circunstância.
- source_word: הַשָּׁמָיִם
  choice: ao céu
  rationale: Embora a forma hebraica seja plural, nesse contexto de subida o singular coletivo “céu” é a expressão portuguesa mais natural.
- source_word: וַיֵּלֶךְ
  choice: partiram
  rationale: הלך descreve o deslocamento iniciado por Elias e Eliseu. O plural exigido em português reúne naturalmente os dois sujeitos, e “partiram” comunica que saíram de Gilgal sem inserir um destino.
- source_word: וֶאֱלִישָׁע
  choice: e Eliseu
  rationale: Nome próprio vertido segundo sua forma portuguesa tradicional.
- source_word: מִן הַגִּלְגָּל
  choice: de Gilgal
  rationale: מִן marca a origem do deslocamento; “de Gilgal” é a formulação geográfica direta em português.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz explicitamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido de הַשָּׁמָיִם
  choice: ao céu
  alternative: aos céus
  rationale: O plural hebraico pode designar o céu ou os céus. O singular é idiomático neste contexto em português e não pretende definir uma cosmologia específica.
- issue: Relação expressa por בַּסְעָרָה
  choice: num redemoinho
  alternative: por meio de um redemoinho; numa tempestade
  rationale: A preposição בְּ pode ser circunstancial ou instrumental, e סְעָרָה admite “tempestade”, “vendaval” ou “redemoinho”. “Num redemoinho” mantém aberta a relação exata e se harmoniza com o relato.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem da frase foi ajustada para evitar uma construção excessivamente pesada. Os marcadores foram posicionados junto aos termos que efetivamente explicam: [a] após “redemoinho” e [b] após “céu”.'
