base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/020.yaml
  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: pt
  text: 'Ele disse: “Tragam-me um recipiente novo[a] e ponham sal nele.” E o levaram até ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tigela”, “jarro” ou “frasco”; o termo hebraico indica, de modo geral, um pequeno recipiente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ele disse
  rationale: O wayyiqtol de אמר dá sequência à narrativa e introduz a fala de Eliseu; em português, a sequência pode ser expressa naturalmente sem reproduzir a conjunção.
- source_word: קְחוּ לִי
  choice: Tragam-me
  rationale: Embora לקח signifique literalmente “tomar/pegar”, com לִי e neste pedido o sentido idiomático é trazer algo ao falante.
- source_word: צְלֹחִית
  choice: recipiente
  rationale: O substantivo designa de modo geral um pequeno vaso ou recipiente; “recipiente” evita especificar formato ou material que o hebraico não determina.
- source_word: חֲדָשָׁה
  choice: novo
  rationale: Adjetivo direto que qualifica o recipiente; o gênero foi ajustado ao substantivo português.
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: e ponham sal nele
  rationale: שׂים é “pôr/colocar”, e שָׁם, literalmente “ali”, remete aqui ao recipiente recém-mencionado; “nele” transmite essa referência com naturalidade.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: E o levaram até ele
  rationale: לקח conserva aqui o sentido de pegar e conduzir o objeto até Eliseu. O pronome “o”, implícito no hebraico, retoma naturalmente o recipiente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural e sintaxe narrativa natural. “Recipiente” preserva melhor a amplitude lexical do hebraico; a nota registra alternativas concretas.
