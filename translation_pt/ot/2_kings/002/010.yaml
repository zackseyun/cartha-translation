  text: וַ/יֹּ֖אמֶר הִקְשִׁ֣יתָ לִ/שְׁא֑וֹל אִם תִּרְאֶ֨ה אֹתִ֜/י לֻקָּ֤ח מֵֽ/אִתָּ/ךְ֙ יְהִֽי לְ/ךָ֣ כֵ֔ן וְ/אִם אַ֖יִן לֹ֥א יִהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: pt
  text: 'Ele disse: “Você pediu algo difícil. Se você me vir sendo levado para longe de você[a], isso lhe será concedido; mas, se não, não será.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você me vir quando eu for levado para longe de você”.'
    reason: Alternativa sintática para a relação entre תִּרְאֶה e o particípio passivo לֻקָּח.
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: Você pediu algo difícil
  rationale: A construção idiomática combina o hifil de קשׁה com o infinitivo de שׁאל e caracteriza o pedido como difícil ou exigente. A formulação é natural em português e mantém o foco no pedido de Eliseu.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: Se você me vir sendo levado para longe de você
  rationale: O particípio passivo לֻקָּח descreve Elias sendo levado, sem explicitar o agente. “Sendo levado” preserva o aspecto processual; “para longe de você” comunica naturalmente o sentido de separação de מֵאִתָּךְ.
- source_word: יְהִי לְךָ כֵן
  choice: isso lhe será concedido
  rationale: A expressão afirma que aquilo que Eliseu pediu se realizará para ele. “Será concedido” torna o referente implícito compreensível em português, sem especificar quem o concede.
- source_word: וְאִם אַיִן
  choice: mas, se não
  rationale: אַיִן é elíptico neste contexto e retoma a condição de Eliseu ver Elias ser levado. “Mas” expressa com clareza o contraste presente na sequência.
- source_word: לֹא יִהְיֶה
  choice: não será
  rationale: A frase nega que o resultado pedido venha a se realizar. A tradução concisa acompanha a elipse e o paralelismo do hebraico.
theological_decisions:
- issue: Agente de Elias ser levado e de o pedido ser concedido
  choice: Manter o agente implícito
  alternative: Explicitar que Deus levará Elias e concederá o pedido
  rationale: O hebraico emprega uma forma passiva e expressões sem agente explícito. Embora o contexto permita inferir a ação divina, a tradução não deve acrescentá-la diretamente ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A formulação preserva as elipses essenciais do hebraico, mas explicita de modo natural que o resultado é o pedido anteriormente feito.
