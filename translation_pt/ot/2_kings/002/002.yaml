  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: pt
  text: 'E Elias disse a Eliseu: “Por favor, fique aqui, pois Yahweh me enviou até Betel.” Mas Eliseu respondeu: “Tão certo como Yahweh vive e como você vive,[a] não o deixarei.” Então os dois desceram a Betel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Pela vida de Yahweh e pela sua vida, se eu o deixar...”. É uma fórmula de juramento cujo sentido é: “não o deixarei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: Por favor, fique aqui
  rationale: ישׁב pode significar sentar-se, ficar ou permanecer; no contexto, Elias pede que Eliseu não prossiga com ele. נָא confere cortesia ao pedido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: me enviou até Betel
  rationale: “Até Betel” preserva de modo natural o valor de limite ou destino de עַד, sem excluir o sentido simples de movimento para Betel.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Tão certo como Yahweh vive e como você vive
  rationale: Reproduz em português corrente a fórmula hebraica solene de juramento; נֶפֶשׁ aqui se refere à vida ou pessoa do interlocutor, não exige o termo técnico “alma”.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: não o deixarei
  rationale: Depois da fórmula de juramento, אִם introduz uma imprecação elíptica cujo sentido pragmático é uma negação enfática.
- source_word: וַיֵּרְדוּ
  choice: os dois desceram
  rationale: Preserva o sentido direcional de ירד e explicita naturalmente que Elias e Eliseu seguiram juntos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o preserva por transliteração sem substituí-lo por um título.
- issue: Forma negativa do juramento de Eliseu
  choice: não o deixarei
  alternative: se eu o deixar
  rationale: A formulação hebraica deixa implícita a consequência da imprecação. A tradução expressa o sentido negativo inequívoco sem inventar qual seria essa consequência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fique aqui” é natural no contexto; “até Betel” conserva a nuance de עַד; a fórmula de juramento mantém sua solenidade sem literalismo obscuro.
