  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֵלִיָּ֨הוּ אֶת אַדַּרְתּ֤/וֹ וַ/יִּגְלֹם֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֵּחָצ֖וּ הֵ֣נָּה וָ/הֵ֑נָּה וַ/יַּעַבְר֥וּ שְׁנֵי/הֶ֖ם בֶּ/חָרָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: pt
  text: Então Elias pegou seu manto[a], enrolou-o e bateu nas águas. Elas se dividiram para um lado e para o outro[b], e os dois atravessaram em terra seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «capa». O hebraico se refere à veste exterior característica de Elias.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as águas se dividiram em lados opostos. Literalmente, «aqui e ali».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: seu manto
  rationale: אַדֶּרֶת designa aqui a veste exterior característica de Elias. «Manto» é natural em português bíblico contemporâneo e permite a ação de enrolar e golpear.
- source_word: וַיִּגְלֹם
  choice: enrolou-o
  rationale: O verbo descreve juntar a veste enrolando-a, provavelmente para usá-la como instrumento; «enrolou-o» expressa a ação de modo claro e conciso.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: bateu nas águas
  rationale: נכה significa golpear ou bater. «Bateu nas águas» preserva a força da ação e concorda naturalmente com o plural hebraico הַמַּיִם.
- source_word: וַיֵּחָצוּ
  choice: Elas se dividiram
  rationale: O verbo hebraico está no plural e retoma «as águas». A forma pronominal preserva o resultado descrito sem explicar o mecanismo.
- source_word: הֵנָּה וָהֵנָּה
  choice: para um lado e para o outro
  rationale: A expressão indica que as águas se separaram em lados opostos; esta formulação é mais clara em português do que uma reprodução literal como «aqui e ali».
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: os dois atravessaram
  rationale: Preserva de maneira idiomática a ênfase explícita de שְׁנֵיהֶם em ambos os homens.
- source_word: בֶּחָרָבָה
  choice: em terra seca
  rationale: חָרָבָה indica o chão seco pelo qual se atravessa onde antes havia água; «em terra seca» é claro e mantém a associação bíblica com travessias semelhantes.
- source_word: וַיִּקַּח
  choice: Então Elias pegou
  rationale: O waw consecutivo faz avançar a narrativa. «Então» marca a sequência, e «pegou» é corrente e adequado ao objeto físico.
theological_decisions:
- issue: Divisão milagrosa das águas
  choice: Narrar diretamente que as águas se dividiram e que ambos atravessaram em terra seca.
  alternative: Naturalizar o acontecimento ou acrescentar uma explicação explícita sobre a sua causa divina.
  rationale: O hebraico apresenta o acontecimento sem qualificações explicativas. A tradução conserva o caráter extraordinário da narrativa sem minimizá-lo nem inserir comentário teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. «Manto» conserva a reconhecibilidade bíblica sem soar arcaico; «para um lado e para o outro» esclarece o idiomatismo hebraico sem ampliar a cena.
