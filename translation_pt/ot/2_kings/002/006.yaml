base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: pt
  text: 'Então Elias lhe disse: “Por favor, fique aqui, pois Yahweh me enviou ao Jordão.[a]” Mas ele respondeu: “Tão certo como Yahweh vive e como você vive,[b] não o deixarei.” Assim, os dois seguiram juntos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao rio Jordão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Fórmula hebraica de juramento, literalmente: “Vive Yahweh, e vive a sua vida, se eu o deixar…”. A consequência da condição fica subentendida, dando o sentido: “Certamente não o deixarei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: Por favor, fique
  rationale: O verbo ישׁב pode significar sentar-se, ficar ou permanecer. Neste contexto, Elias pede que o interlocutor permaneça no lugar; נָא acrescenta cortesia ou súplica, expressa por “Por favor”.
- source_word: פֹה
  choice: aqui
  rationale: Equivalente locativo direto e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שְׁלָחַנִי
  choice: me enviou
  rationale: O perfeito indica uma comissão já dada e relevante para o deslocamento presente; o pretérito perfeito é natural em português.
- source_word: הַיַּרְדֵּנָה
  choice: ao Jordão
  rationale: O ה direcional indica movimento em direção ao Jordão. O nome pode designar o rio sem que “rio” precise aparecer no texto principal.
- source_word: חַי יְהוָה
  choice: Tão certo como Yahweh vive
  rationale: Reproduz em português claro a força solene da fórmula hebraica de juramento.
- source_word: וְחֵי נַפְשְׁךָ
  choice: e como você vive
  rationale: Na fórmula de juramento, נֶפֶשׁ refere-se à vida ou à própria pessoa do interlocutor. A tradução evita o pouco natural “como vive a sua alma” e não impõe uma leitura dualista.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: não o deixarei
  rationale: Em juramentos, אִם introduz uma imprecação elíptica e comunica uma negação enfática. A formulação direta preserva o sentido em português.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: Assim, os dois seguiram juntos
  rationale: Mantém a ênfase em ambos continuarem a jornada, com uma ligação narrativa natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Forma elíptica do juramento אִם אֶעֶזְבֶךָּ
  choice: não o deixarei
  alternative: se eu o deixar…
  rationale: A construção hebraica omite a consequência imprecatória do juramento. Traduzir apenas “se eu o deixar” seria obscuro ou incompleto para muitos leitores; a negação enfática comunica sua força sem especificar a imprecação omitida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a referência pronominal “ele” do hebraico, sem inserir explicitamente o nome de Eliseu. A fórmula de juramento foi vertida de modo idiomático no texto e sua estrutura literal foi preservada em nota.
