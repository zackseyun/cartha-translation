  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: pt
  text: 'Elias lhe disse: “Eliseu, por favor, fique aqui, pois Yahweh me enviou a Jericó.” Mas Eliseu respondeu: “Tão certo como vive Yahweh e como você vive, não o deixarei.” Então eles chegaram a Jericó.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: por favor, fique aqui
  rationale: O imperativo שֵׁב, neste contexto de viagem, pede que Eliseu permaneça onde está, não que simplesmente se sente. נָא expressa cortesia ou apelo, e פֹה indica o lugar presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שְׁלָחַנִי
  choice: me enviou
  rationale: O perfeito hebraico expressa a comissão já dada a Elias e ainda relevante no momento da fala; o pretérito perfeito é natural em português.
- source_word: יְרִיחוֹ
  choice: Jericó
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: חַי יְהוָה
  choice: Tão certo como vive Yahweh
  rationale: Reproduz em português corrente a fórmula solene de juramento baseada na vida de Yahweh.
- source_word: וְחֵי נַפְשְׁךָ
  choice: e como você vive
  rationale: נֶפֶשׁ, nesta fórmula de juramento, refere-se à vida da pessoa, não especificamente a uma alma imaterial. A formulação mantém o paralelismo sem introduzir essa distinção.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: não o deixarei
  rationale: Depois da fórmula de juramento, אִם introduz uma imprecação elíptica cujo sentido pragmático é uma negativa enfática. 'Deixar' se ajusta ao contexto imediato da viagem.
- source_word: וַיָּבֹאוּ
  choice: Então eles foram
  rationale: O wayyiqtol faz a narrativa avançar. Como o destino já foi mencionado, 'foram a Jericó' soa mais natural em português do que 'vieram', sem alterar o movimento narrado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ na fórmula de juramento
  choice: como você vive
  alternative: como vive a sua alma
  rationale: Neste uso idiomático, נֶפֶשׁ designa a vida ou a própria pessoa. A tradução evita impor ao termo uma antropologia dualista que o contexto não exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os nomes dos interlocutores foram explicitados uma vez em cada fala para evitar ambiguidade pronominal natural em português. A fórmula de juramento conserva solenidade sem literalismo obscuro.
