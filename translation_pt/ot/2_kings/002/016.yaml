revisions:
- from: 'Então eles lhe disseram: “Veja, entre os seus servos há cinquenta homens fortes. Por favor, deixe-os ir procurar o seu senhor, pois talvez o Espírito de Yahweh[a] o tenha levado e lançado sobre algum monte ou em algum vale”. Mas ele respondeu: “Não os enviem”.'
  to: 'Então eles lhe disseram: “Veja, entre os seus servos há cinquenta homens fortes. Por favor, deixe-os ir procurar o seu senhor. Talvez o Espírito de Yahweh[a] o tenha levado e lançado sobre algum monte ou em algum vale”. Mas ele respondeu: “Não os enviem”.'
  rationale: A revisão elimina a nuance causal adicional de «pois», preservando a possibilidade apreensiva expressa por פֶּן, e desloca a âncora para que indique claramente a expressão sujeita à alternativa lexical. O restante da redação mantém fidelidade ao hebraico e boa legibilidade em português contemporâneo.
