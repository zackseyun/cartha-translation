  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him[a], “Look now, there are fifty strong men among your servants. Please let them go and seek your master, lest the Spirit of Yahweh has carried him away and thrown him on one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: pt
  text: 'Então eles lhe disseram: “Veja, entre os seus servos há cinquenta homens fortes. Por favor, deixe-os ir procurar o seu senhor. Talvez o Espírito de Yahweh[a] o tenha levado e lançado sobre algum monte ou em algum vale”. Mas ele respondeu: “Não os enviem”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o vento de Yahweh”. A palavra hebraica רוּחַ pode significar “espírito” ou “vento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Veja
  rationale: Reproduz de modo natural em português a função de chamar a atenção, sem recorrer ao arcaico “eis”.
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  choice: entre os seus servos há
  rationale: Expressa a construção existencial e indica que os homens estavam disponíveis entre os servos de Eliseu.
- source_word: בְּנֵי חַיִל
  choice: homens fortes
  rationale: Comunica capacidade e vigor no contexto de uma busca, sem impor uma conotação especificamente militar.
- source_word: יֵלְכוּ נָא
  choice: Por favor, deixe-os ir
  rationale: Preserva o valor de pedido cortês do jussivo acompanhado de נָא.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: procurar o seu senhor
  rationale: בקשׁ indica procurar, e אֲדֹנֶיךָ designa Elias como superior ou mestre de Eliseu; “senhor” conserva mais diretamente o termo hebraico no contexto.
- source_word: פֶּן
  choice: pois talvez
  rationale: Introduz com naturalidade a possibilidade temida, evitando o pouco corrente “para que não” quando se trata de uma ação possivelmente já ocorrida.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: o Espírito de Yahweh o tenha levado
  rationale: A ação extraordinária atribuída a Yahweh favorece “Espírito”; o subjuntivo composto expressa a possibilidade de uma ação já concluída.
- source_word: וַיַּשְׁלִכֵהוּ
  choice: e lançado
  rationale: Mantém o sentido de lançar ou arremessar, em registro digno e corrente.
- source_word: בְּאַחַד הֶהָרִים ... בְּאַחַת הַגֵּאָיוֹת
  choice: sobre algum monte ou em algum vale
  rationale: Traduz as duas localizações de maneira idiomática; “algum” representa naturalmente a ideia distributiva de “um dos”.
- source_word: לֹא תִשְׁלָחוּ
  choice: Não os enviem
  rationale: Preserva a proibição direta dirigida ao grupo.
theological_decisions:
- issue: Tradução de רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  alternative: o vento de Yahweh
  rationale: No contexto da remoção extraordinária de Elias, a agência divina favorece “Espírito”; contudo, רוּחַ também pode significar “vento”, possibilidade mantida em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “Yahweh” para o nome divino e preserva em nota a ambiguidade lexical de רוּחַ.
