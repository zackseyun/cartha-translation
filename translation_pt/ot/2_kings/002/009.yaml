base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: pt
  text: 'Depois que atravessaram, Elias disse a Eliseu: “Peça o que devo fazer por você antes que eu seja tirado de junto de você.” Eliseu respondeu: “Por favor, que uma porção dobrada[a] do seu espírito[b] venha sobre mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “duas partes do seu espírito”. A expressão hebraica significa “uma porção dobrada” e provavelmente evoca a parte da herança reservada ao primogênito.'
    reason: lexical_alternative
  - marker: b
    text: “Seu espírito” refere-se ao espírito associado ao ministério profético de Elias. Alguns entendem o pedido como o desejo de receber duas vezes o poder profético de Elias.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: Quando eles terminaram de atravessar
  rationale: A construção com כְּ e o infinitivo de עבר, seguido do sufixo de terceira pessoa plural, refere-se a Elias e Eliseu. No contexto, a travessia foi concluída antes da fala de Elias; a formulação explicita essa sequência em português natural.
- source_word: שְׁאַל
  choice: Peça
  rationale: O imperativo de שאל introduz uma solicitação que Elias se dispõe a atender. “Peça” é direto e idiomático no contexto.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: o que devo fazer por você
  rationale: A frase expressa a oferta de Elias para atender a um pedido. “Devo fazer” preserva o tom deliberativo sem transformar a fala numa promessa incondicional.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: antes que eu seja tirado de junto de você
  rationale: 'O nifal de לקח é passivo: Elias será levado. “De junto de você” preserva a ideia relacional e espacial de מֵעִמָּךְ sem identificar explicitamente quem o levará.'
- source_word: וִיהִי נָא
  choice: Por favor, que ... venha
  rationale: A forma volitiva, suavizada por נָא, expressa uma súplica cortês. “Por favor, que...” reproduz naturalmente esse tom em português.
- source_word: פִּי שְׁנַיִם
  choice: uma porção dobrada
  rationale: A expressão idiomática significa literalmente uma medida ou parte de dois, isto é, duas partes. “Porção dobrada” é clara em português e mantém a provável ressonância da porção hereditária do primogênito.
- source_word: בְּרוּחֲךָ
  choice: do seu espírito
  rationale: A expressão designa o espírito ligado a Elias e ao seu ministério profético. A minúscula e a ausência de uma explicitação como “espírito profético” evitam impor ao hebraico uma identificação técnica mais específica.
- source_word: אֵלָי
  choice: venha sobre mim
  rationale: Embora אֵלָי signifique literalmente “a mim”, com רוּחַ a formulação “venha sobre mim” comunica em português corrente a ideia de o espírito ou poder capacitador passar a atuar em Eliseu.
theological_decisions:
- issue: Sentido do pedido פִּי שְׁנַיִם בְּרוּחֲךָ
  choice: Eliseu pede uma porção dobrada, ou duas partes, do espírito de Elias, provavelmente evocando a herança do primogênito.
  alternative: Eliseu pede duas vezes o poder profético que Elias possuía.
  rationale: A expressão פִּי שְׁנַיִם designa naturalmente uma porção de duas partes. A tradução mantém a imagem de herança e não resolve indevidamente o pedido como comparação absoluta de poder.
- issue: Referente de “seu espírito”
  choice: O espírito ou capacitação profética associado a Elias permanece em vista, sem identificação técnica explícita.
  alternative: A expressão nomeia diretamente o Espírito Santo em sentido pessoal e trinitário.
  rationale: O sufixo possessivo aponta para aquilo que pertence a Elias ou o caracteriza. Manter “seu espírito” preserva a formulação e a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes bíblicos correntes no Brasil. A sintaxe é natural sem apagar a sequência narrativa, a voz passiva nem a ambiguidade teológica. Os marcadores foram colocados junto às expressões que cada nota explica.
