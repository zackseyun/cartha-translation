  text: וַ/יַּ֥עַל מִ/שָּׁ֖ם בֵּֽית אֵ֑ל וְ/ה֣וּא עֹלֶ֣ה בַ/דֶּ֗רֶךְ וּ/נְעָרִ֤ים קְטַנִּים֙ יָצְא֣וּ מִן הָ/עִ֔יר וַ/יִּתְקַלְּסוּ ב/וֹ֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ עֲלֵ֥ה קֵרֵ֖חַ עֲלֵ֥ה קֵרֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: pt
  text: 'Então ele subiu dali para Betel. Enquanto subia pelo caminho, alguns meninos pequenos[a] saíram da cidade, zombaram dele e lhe disseram: “Suba, careca! Suba[b], careca!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rapazes jovens” ou “jovens”; a expressão hebraica pode designar jovens do sexo masculino de modo mais amplo, não necessariamente crianças muito pequenas.
    reason: lexical_alternative
  - marker: b
    text: A repetição de “Suba” pode ser apenas uma provocação, mas também pode aludir ao fato de Elias ter sido levado para o alto.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: Então ele subiu
  rationale: O qal narrativo de עלה dá continuidade à sequência. “Então” produz um fluxo natural em português, e “subiu” mantém a repetição lexical que reaparece no percurso e na provocação.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Forma tradicional e amplamente reconhecida do nome do lugar em português.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: Enquanto subia pelo caminho
  rationale: A construção com pronome e particípio expressa ação em andamento. A formulação é natural em português e conserva o verbo “subir”, importante para a repetição do hebraico.
- source_word: נְעָרִים קְטַנִּים
  choice: alguns meninos pequenos
  rationale: A expressão designa jovens do sexo masculino e inclui um adjetivo que ressalta sua pouca idade ou condição juvenil. A nota preserva a possibilidade de uma faixa etária mais ampla.
- source_word: יָצְאוּ מִן הָעִיר
  choice: saíram da cidade
  rationale: Tradução direta e idiomática de יצא com a preposição מן.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: zombaram dele
  rationale: O hitpael de קלס expressa escárnio ou ridicularização; “zombaram dele” é claro, atual e mantém o peso da ação.
- source_word: עֲלֵה
  choice: Suba
  rationale: O imperativo de עלה é mantido literalmente, preservando a repetição com “subiu/subia” e sem decidir se a fala contém uma alusão à subida de Elias.
- source_word: קֵרֵחַ
  choice: careca
  rationale: O termo designa uma pessoa calva e, no vocativo, comunica diretamente o tom insultuoso da provocação.
theological_decisions:
- issue: Possível sentido alusivo da repetição de עֲלֵה
  choice: Manter “Suba” no texto principal
  alternative: Interpretar como “Vá embora daqui” ou explicitar “Suba como Elias”
  rationale: O hebraico diz literalmente “suba”, mas o sentido exato da provocação é discutido. A tradução conserva a expressão e registra a possível alusão em nota, sem resolver a ambiguidade.
- issue: Idade e responsabilidade sugeridas por נְעָרִים קְטַנִּים
  choice: Traduzir por “meninos pequenos”, com nota sobre o alcance semântico
  alternative: “rapazes jovens”, “jovens” ou “rapazes”
  rationale: A expressão aponta para jovens do sexo masculino, mas נער pode abranger mais do que crianças pequenas. A nota impede que a tradução determine uma idade excessivamente precisa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição “subiu… subia… Suba” foi preservada por sua relevância literária e possível força alusiva. Os marcadores de nota foram posicionados junto às expressões a que de fato se referem.
