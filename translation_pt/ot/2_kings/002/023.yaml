  source_fidelity: O texto traduz adequadamente a sequência narrativa de וַיַּעַל, o destino Betel, a ação em curso expressa pelo particípio, a saída da cidade, o escárnio e o imperativo repetido עֲלֵה. A repetição «subiu ... subia ... Suba» preserva bem o efeito lexical do hebraico. «Meninos pequenos» reproduz a força de קְטַנִּים, e a nota corretamente impede que essa formulação seja tomada como delimitação etária absoluta.
