base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: pt
  text: Cinquenta homens dos filhos dos profetas foram e se puseram diante deles, a certa distância[a], enquanto os dois estavam junto ao Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em frente a eles, de longe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: Cinquenta homens
  rationale: O numeral com אִישׁ significa naturalmente “cinquenta homens”; a forma masculina é preservada.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: dos filhos dos profetas
  rationale: Mantém a designação hebraica reconhecida para homens vinculados ao ministério profético, sem substituí-la pela interpretação “discípulos” ou “grupo”.
- source_word: הָלְכוּ
  choice: foram
  rationale: Equivalente narrativo simples e natural de הלך neste contexto.
- source_word: וַיַּעַמְדוּ
  choice: ficaram parados
  rationale: Expressa עמד de modo natural em português e distingue a ação de tomar posição da mera sequência verbal.
- source_word: מִנֶּגֶד מֵרָחוֹק
  choice: diante deles, a certa distância
  rationale: Preserva tanto a relação espacial frontal de מִנֶּגֶד quanto o afastamento indicado por מֵרָחוֹק, sem sugerir necessariamente que estivessem na margem oposta.
- source_word: וּשְׁנֵיהֶם
  choice: enquanto os dois
  rationale: Preserva a referência dual explícita a Elias e Eliseu; “enquanto” comunica naturalmente a simultaneidade e o contraste da cena.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: ficaram junto ao Jordão
  rationale: Com um rio, עַל indica aqui localização à margem ou junto dele, não literalmente sobre suas águas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão cultural “filhos dos profetas” foi mantida no corpo do texto; evitou-se “do outro lado”, pois o hebraico indica posição diante deles, mas não determina inequivocamente margens opostas.
