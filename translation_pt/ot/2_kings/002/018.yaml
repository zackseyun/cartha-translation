  text: וַ/יָּשֻׁ֣בוּ אֵלָ֔י/ו וְ/ה֖וּא יֹשֵׁ֣ב בִּ/ירִיח֑וֹ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם הֲ/לֽוֹא אָמַ֥רְתִּי אֲלֵי/כֶ֖ם אַל תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: pt
  text: 'Quando voltaram para junto dele[a], ele estava em Jericó e lhes disse: “Eu não disse a vocês: ‘Não vão’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “E voltaram para junto dele, enquanto ele permanecia em Jericó”.'
    reason: Alternativa sintática e lexical que reproduz mais de perto a coordenação hebraica e explicita o sentido durativo de יֹשֵׁב.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: Quando voltaram para junto dele
  rationale: O waw consecutivo dá continuidade à narrativa, e a construção temporal com “quando” liga naturalmente o retorno à situação de Eliseu em Jericó. “Para junto dele” expressa com clareza a ideia de movimento em direção a uma pessoa.
- source_word: וְהוּא יֹשֵׁב
  choice: ele estava
  rationale: O particípio de ישׁב pode indicar estar sentado, permanecer, morar ou ficar. Neste contexto, a informação principal é que Eliseu permanecia em Jericó; em português, “estava em Jericó” transmite isso naturalmente sem afirmar que sua postura física seja relevante.
- source_word: בִּירִיחוֹ
  choice: em Jericó
  rationale: Forma corrente do topônimo em português, com a preposição hebraica traduzida diretamente.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: e lhes disse
  rationale: Tradução natural e transparente do verbo comum de fala אמר com o complemento plural.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: Eu não disse a vocês
  rationale: הֲלוֹא introduz uma pergunta retórica que espera concordância. A formulação preserva em português o tom de repreensão e recordação.
- source_word: אַל תֵּלֵכוּ
  choice: Não vão
  rationale: אַל com a forma verbal prefixada expressa proibição. “Não vão” é direto, atual e adequado ao plural de segunda pessoa no português de ampla compreensão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “vocês” para o plural da segunda pessoa e conserva a pergunta retórica e a proibição direta do hebraico.
