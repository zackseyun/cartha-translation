  text: And he went from there to Mount Carmel, and from there he returned to Samaria.
translation:
  language: pt
  text: Dali, ele foi ao monte Carmelo; e dali voltou para Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ele foi
  rationale: O wayyiqtol faz a narrativa avançar com sentido de passado simples. Em português, a sequência é expressa naturalmente sem necessidade de reproduzir sempre a conjunção inicial.
- source_word: מִשָּׁם
  choice: Dali
  rationale: O advérbio indica movimento a partir do lugar mencionado anteriormente. “Dali” é corrente, claro e conciso.
- source_word: אֶל
  choice: ao
  rationale: A preposição marca direção para um destino; com o artigo de “monte”, a forma natural é “ao”.
- source_word: הַר הַכַּרְמֶל
  choice: monte Carmelo
  rationale: É a forma tradicional e amplamente reconhecida do topônimo em português, adequada à referência geográfica.
- source_word: וּמִשָּׁם
  choice: e dali
  rationale: Preserva a conjunção e a repetição espacial do hebraico, mantendo clara a sequência do percurso.
- source_word: שָׁב
  choice: voltou
  rationale: Neste contexto de deslocamento, שׁוּב significa retornar. “Voltou” é natural e exato em português contemporâneo.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: É a forma portuguesa consagrada do nome do lugar.
