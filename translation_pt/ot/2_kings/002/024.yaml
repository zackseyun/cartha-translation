base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: pt
  text: Ele se virou, olhou para eles e os amaldiçoou em nome do SENHOR. Então duas ursas saíram da floresta e despedaçaram quarenta e dois deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “deles” pode designar crianças, rapazes ou jovens. O verbo traduzido por “despedaçaram” indica que as ursas os rasgaram ou feriram gravemente, sem afirmar explicitamente que todos morreram.
    reason: 'Preserva duas ambiguidades genuínas do hebraico: a faixa etária do grupo e o resultado final do ataque.'
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: os amaldiçoou
  rationale: Traduz diretamente o verbo קלל no piel, preservando a gravidade da maldição pronunciada pelo profeta.
- source_word: שְׁתַּיִם דֻּבִּים
  choice: duas ursas
  rationale: O numeral feminino e a forma do substantivo indicam duas fêmeas de urso.
- source_word: מִן־הַיַּעַר
  choice: da floresta
  rationale: Equivalente natural e claro para a área arborizada indicada por יער.
- source_word: וַתְּבַקַּעְנָה
  choice: despedaçaram
  rationale: O verbo בקע significa partir, rasgar ou abrir; aqui descreve um ataque corporal violento. A tradução evita acrescentar que todas as vítimas morreram.
- source_word: יְלָדִים
  choice: deles
  rationale: Neste contexto, o termo retoma o grupo mencionado no versículo anterior. O pronome evita decidir no texto principal uma faixa etária mais precisa do que o hebraico permite.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Javé
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o tetragrama em versalete, sem ocultar que se trata do nome divino; a forma pode ser esclarecida em nota.
- issue: Resultado do ataque das ursas
  choice: despedaçaram
  alternative: mataram
  rationale: O hebraico descreve o ferimento violento, mas não declara explicitamente a morte dos quarenta e dois; a tradução não deve ampliar a afirmação.
- issue: Idade das pessoas atacadas
  choice: deles, com nota explicativa
  alternative: dos meninos
  rationale: ילדים pode referir-se a crianças, rapazes ou jovens conforme o contexto. Mantém-se a ambiguidade em vez de fixar uma idade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “SENHOR” representa o nome divino יהוה. A formulação evita tanto suavizar a violência do hebraico quanto acrescentar que os quarenta e dois morreram.
