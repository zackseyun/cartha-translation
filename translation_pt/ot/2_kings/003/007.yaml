base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: pt
  text: 'Então ele foi e mandou uma mensagem a Josafá, rei de Judá: “O rei de Moabe se rebelou contra mim[a]. Você irá comigo à guerra contra Moabe?” Josafá respondeu: “Subirei[b]. Eu sou como você, o meu povo é como o seu povo, e os meus cavalos são como os seus cavalos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rompeu comigo”. O verbo hebraico pode indicar revolta política ou quebra de lealdade; aqui se refere à rebelião de Moabe contra o domínio israelita.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico significa literalmente “subir” e pode descrever tanto o deslocamento para um lugar mais alto quanto uma marcha militar.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ele foi
  rationale: O waw consecutivo dá sequência à narrativa; “então” expressa essa progressão de maneira natural em português.
- source_word: וַיִּשְׁלַח אֶל
  choice: mandou uma mensagem a
  rationale: Com destinatário e discurso direto em seguida, o verbo indica o envio de uma mensagem, não de um objeto ou emissário explicitamente identificado.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Josafá, rei de Judá
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes próprios em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Os dois-pontos introduzem o discurso direto de modo idiomático, sem necessidade de reproduzir mecanicamente “dizendo”.
- source_word: פָּשַׁע בִּי
  choice: se rebelou contra mim
  rationale: No contexto político, o verbo designa a revolta de um rei vassalo e a ruptura de sua lealdade.
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Você irá comigo
  rationale: Mantém o sentido de movimento conjunto e formula a pergunta de modo claro e corrente no português brasileiro.
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: à guerra contra Moabe
  rationale: Expressa naturalmente tanto o destino ou alvo, Moabe, quanto o propósito militar da expedição.
- source_word: אֶעֱלֶה
  choice: Subirei
  rationale: Preserva o sentido lexical de עלה, que pode indicar subida geográfica ou marcha militar, sem decidir entre essas nuances.
- source_word: כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: Eu sou como você, o meu povo é como o seu povo, e os meus cavalos são como os seus cavalos
  rationale: Explicita em português as cópulas omitidas no hebraico e conserva a fórmula enfática de plena solidariedade.
