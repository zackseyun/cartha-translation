  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: pt
  text: Contudo, ele se apegou aos pecados de Jeroboão, filho de Nebate, com os quais este levou Israel a pecar[a]; não se afastou deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com os quais fez Israel pecar». O verbo hebraico está na forma causativa e indica que as ações de Jeroboão conduziram Israel ao pecado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: Introduz a ressalva que limita a avaliação positiva precedente; em português narrativo, «contudo» expressa com naturalidade esse contraste.
- source_word: בְּחַטֹּאות
  choice: aos pecados
  rationale: Com דבק, a preposição é vertida idiomaticamente pela regência portuguesa «apegar-se a».
- source_word: חַטֹּאות
  choice: pecados
  rationale: Mantém a avaliação moral e religiosa explícita do hebraico sem reduzir o termo a práticas ou erros.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas portuguesas tradicionais dos nomes e conserva a identificação patronímica.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: com os quais este levou Israel a pecar
  rationale: Preserva tanto a relação dos pecados com o ato de induzir Israel ao pecado quanto o valor causativo do hifil; «este» esclarece que o agente é Jeroboão.
- source_word: דָּבֵק
  choice: ele se apegou
  rationale: Comunica adesão persistente e corresponde naturalmente ao sentido de דבק neste contexto.
- source_word: לֹא סָר
  choice: não se afastou
  rationale: Expressa de modo corrente a ideia de não abandonar determinado curso de conduta.
- source_word: מִמֶּנָּה
  choice: deles
  rationale: Embora o sufixo hebraico seja formalmente feminino singular, o referente contextual são os «pecados»; a concordância plural é natural em português.
theological_decisions:
- issue: Fórmula de avaliação da apostasia real
  choice: 'Conservar a linguagem moral explícita: «pecados» e «levou Israel a pecar».'
  alternative: Verter de maneira mais neutra, como «práticas» ou «desvios».
  rationale: O hebraico apresenta uma avaliação teológica explícita e emprega a fórmula deuteronomista associada a Jeroboão; a tradução não deve atenuá-la.
- issue: Agente da ação causativa na oração relativa
  choice: Identificar Jeroboão como aquele que levou Israel a pecar, mediante «este».
  alternative: Deixar o pronome sem antecedente explicitado, permitindo que o rei em foco pareça ser o agente.
  rationale: A fórmula hebraica caracteriza habitualmente Jeroboão, filho de Nebate, como aquele que fez Israel pecar; o esclarecimento evita uma ambiguidade criada pela estrutura do português, sem alterar a referência contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Contudo» funciona como ressalva à avaliação anterior; o ponto e vírgula conserva a estreita ligação entre a adesão aos pecados e a recusa em abandoná-los.
