source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֶת בְּנ֨/וֹ הַ/בְּכ֜וֹר אֲשֶׁר יִמְלֹ֣ךְ תַּחְתָּ֗י/ו וַ/יַּעֲלֵ֤/הוּ עֹלָה֙ עַל הַ֣/חֹמָ֔ה וַ/יְהִ֥י קֶצֶף גָּד֖וֹל עַל יִשְׂרָאֵ֑ל וַ/יִּסְעוּ֙ מֵֽ/עָלָ֔י/ו וַ/יָּשֻׁ֖בוּ לָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: pt
  text: Então ele pegou seu filho primogênito, que reinaria em seu lugar, e o ofereceu como holocausto sobre a muralha. Houve grande ira contra Israel[a]. Então eles se retiraram de diante dele e voltaram para sua terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não identifica de quem procedia essa ira. Ela pode ser entendida como ira divina, fúria dos moabitas ou a consternação de Israel diante do sacrifício.
    reason: Preservar uma ambiguidade relevante do texto hebraico e informar as principais interpretações sem escolher entre elas.
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: seu filho primogênito
  rationale: “Primogênito” expressa a condição de primeiro filho e, no contexto, sua importância para a sucessão, sem reduzi-lo apenas ao filho mais velho em idade.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: que reinaria em seu lugar
  rationale: Reproduz com naturalidade a ideia de que o filho era o sucessor designado e mantém a linguagem de substituição presente em תַּחְתָּיו.
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: o ofereceu como holocausto
  rationale: A construção emprega linguagem sacrificial e indica uma oferta inteiramente queimada. “Holocausto” é o termo bíblico português corrente e não atenua o caráter terrível do ato.
- source_word: עַל הַחֹמָה
  choice: sobre a muralha
  rationale: חֹמָה designa a muralha defensiva da cidade. “Sobre a muralha” é claro e não acrescenta informação ausente do texto.
- source_word: קֶצֶף גָּדוֹל
  choice: grande ira
  rationale: Mantém a intensidade e a ambiguidade de קֶצֶף, sem identificar a origem ou o agente dessa ira.
- source_word: עַל יִשְׂרָאֵל
  choice: contra Israel
  rationale: Com קֶצֶף, a preposição עַל indica que a ira se dirigia contra Israel.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: eles se retiraram de diante dele
  rationale: No contexto militar, נסע descreve o levantamento do acampamento e a retirada. A formulação preserva a referência ao rei de Moabe sem tornar excessivamente explícito o que o hebraico deixa pronominal.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: voltaram para sua terra
  rationale: O sujeito contextual são as forças aliadas que abandonaram o cerco; “sua terra” comunica naturalmente o destino implícito.
theological_decisions:
- issue: Sentido de “grande ira contra Israel”
  choice: Conservar “grande ira” sem identificar sua origem.
  alternative: Explicitar ira divina, fúria dos moabitas ou consternação/desmoralização de Israel.
  rationale: O hebraico não declara de quem procedia a ira. Especificar seu agente resolveria indevidamente uma ambiguidade teológica e narrativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Holocausto” conserva o vocabulário sacrificial tradicional e amplamente reconhecido. A repetição de “Então” acompanha a sequência narrativa hebraica sem impor uma relação causal mais forte do que o original.
