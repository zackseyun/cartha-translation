base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: pt
  text: E isso é pouca coisa aos olhos de Yahweh[a]; ele também entregará Moabe nas mãos de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E isso é fácil aos olhos de Yahweh.”'
    reason: Alternativa lexical para וְנָקַל, que pode destacar facilidade em vez de pouca importância.
lexical_decisions:
- source_word: וְנָקַל
  choice: E isso é pouca coisa
  rationale: O valor estativo de נקל expressa algo leve, fácil ou de pouca importância. “É pouca coisa” preserva o sentido avaliativo e soa natural em português.
- source_word: זֹאת
  choice: isso
  rationale: O demonstrativo retoma a provisão de água mencionada no contexto anterior; “isso” é a retomada discursiva mais natural em português.
- source_word: בְּעֵינֵי
  choice: aos olhos de
  rationale: Mantém a metáfora hebraica de avaliação e é uma expressão clara e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְנָתַן
  choice: ele também entregará
  rationale: No discurso profético, a forma verbal comunica resultado futuro. “Também” explicita a adição ao milagre da água, e “entregará” comunica naturalmente a colocação de Moabe sob o poder dos destinatários.
- source_word: אֶת מוֹאָב
  choice: Moabe
  rationale: Preserva o nome da nação como objeto coletivo, conforme o hebraico.
- source_word: בְּיֶדְכֶם
  choice: nas mãos de vocês
  rationale: Preserva a imagem idiomática hebraica de domínio ou poder, com concordância natural no plural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “aos olhos de” e a imagem “nas mãos de vocês” preservam os idiomas hebraicos sem comprometer a naturalidade.
