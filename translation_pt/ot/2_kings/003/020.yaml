  text: וַ/יְהִ֤י בַ/בֹּ֨קֶר֙ כַּ/עֲל֣וֹת הַ/מִּנְחָ֔ה וְ/הִנֵּה מַ֥יִם בָּאִ֖ים מִ/דֶּ֣רֶךְ אֱד֑וֹם וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֶת הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: pt
  text: Pela manhã, na hora de se apresentar a oferta de cereal[a], eis que vinha água da direção de Edom[b], e a terra ficou cheia de água[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “quando a oferta de cereal era oferecida”. O hebraico diz literalmente “ao subir a oferta”, usando linguagem sacrificial para sua apresentação no altar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pelo caminho de Edom” ou “da parte de Edom”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a terra ficou cheia da água”, isto é, da água que acabava de chegar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Pela manhã
  rationale: A fórmula narrativa introduz o acontecimento seguinte; em português atual, a expressão temporal comunica isso naturalmente sem recorrer ao arcaizante “e aconteceu que”.
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: na hora de se apresentar a oferta de cereal
  rationale: עלה significa literalmente “subir”, mas aqui pertence à linguagem sacrificial e indica a apresentação da oferta no altar. מִנְחָה, neste contexto cultual, designa especificamente a oferta de cereal.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Conserva a função de chamar vividamente a atenção para o aparecimento inesperado da água.
- source_word: מַיִם בָּאִים
  choice: vinha água
  rationale: מַיִם é vertido como nome incontável no singular, conforme o uso natural do português, enquanto o particípio בָּאִים preserva o aspecto observável ou progressivo da chegada.
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: da direção de Edom
  rationale: דֶּרֶךְ significa “caminho” ou “via”, mas a construção indica aqui a rota ou direção de onde vinha a água.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: a terra ficou cheia de água
  rationale: A forma verbal expressa o estado resultante de ficar cheia. “Terra” mantém a amplitude de הָאָרֶץ, que pode referir-se ao solo ou à região; omitir o artigo diante de “água” produz português natural.
