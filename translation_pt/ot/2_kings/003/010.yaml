  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: pt
  text: 'Então o rei de Israel disse: “Ah! Pois Yahweh chamou estes três reis para entregá-los nas mãos de Moabe.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Mantém o título explícito do referente, que não é nomeado neste versículo.
- source_word: אֲהָהּ
  choice: Ah!
  rationale: Interjeição de aflição ou lamento; “Ah!” conserva a gravidade e soa natural em português atual.
- source_word: קָרָא
  choice: convocou
  rationale: O verbo pode significar “chamar” ou “convocar”; no contexto, refere-se à reunião dos três reis, sem explicitar além do texto como isso ocorreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no hebraico, em vez de substituí-lo por um título.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: estes três reis
  rationale: Reproduz naturalmente o numeral e o demonstrativo referentes à coalizão já mencionada.
- source_word: לָתֵת אֹתָם
  choice: para entregá-los
  rationale: Embora לָתֵת seja literalmente “dar”, “entregar” comunica em português o sentido hostil determinado pela expressão seguinte.
- source_word: בְּיַד מוֹאָב
  choice: nas mãos de Moabe
  rationale: Preserva a metáfora hebraica da mão como poder ou domínio, usando a formulação idiomática corrente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” preserva essa função e evita substituí-lo silenciosamente por um título.
- issue: Sentido de קָרָא na interpretação pessimista do rei
  choice: convocou
  alternative: chamou; reuniu
  rationale: “Convocou” permanece dentro da faixa lexical de קרא e expressa a reunião deliberada dos reis sem transformar em afirmação objetiva a interpretação mais ampla do personagem.
- issue: Imagem de entrega ao poder de Moabe
  choice: entregá-los nas mãos de Moabe
  alternative: entregá-los ao poder de Moabe
  rationale: A expressão conserva a imagem hebraica e seu peso bíblico, sendo ainda clara para leitores modernos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e a concisão da fala foram preservadas. “Moabe” segue a forma portuguesa tradicional do topônimo.
