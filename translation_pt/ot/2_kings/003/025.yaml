translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “atiradores de funda” em vez do termo técnico menos comum “fundibulários”. A repetição de “todas” acompanha a abrangência enfática do hebraico, e as notas preservam alternativas lexicais sem sobrecarregar o texto principal.
