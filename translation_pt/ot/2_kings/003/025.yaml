  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: pt
  text: Demoliram as cidades e, em cada boa parcela de terra[a], cada homem lançou a sua pedra e a encheram. Obstruíram todas as fontes de água e derrubaram todas as árvores boas[b], até que, em Quir-Haresete[c], só restaram as suas pedras. Então os atiradores de funda cercaram-na e a golpearam[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em cada bom campo”. O termo hebraico חֶלְקָה designa uma parcela ou porção de terra.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todas as árvores boas”; a expressão pode se referir mais especificamente a árvores valiosas ou produtivas.
    reason: lexical_alternative
  - marker: c
    text: Quir-Haresete é um nome de lugar, provavelmente a principal cidade fortificada de Moabe neste contexto.
    reason: cultural_note
  - marker: d
    text: Ou “a atacaram”. O verbo hebraico significa literalmente “golpear” ou “ferir” e aqui descreve uma ação militar contra a cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: Demoliram as cidades
  rationale: O verbo הרס descreve concretamente derrubar ou demolir estruturas; “demoliram” preserva esse sentido no contexto militar.
- source_word: חֶלְקָה טוֹבָה
  choice: boa parcela de terra
  rationale: חֶלְקָה indica uma parcela ou porção de terreno, aqui provavelmente produtiva; a formulação evita restringi-la sem necessidade a um campo cultivado.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: cada homem lançou a sua pedra, até que a encheram
  rationale: Mantém a distribuição singular do hebraico (“cada homem... sua pedra”) e expressa o resultado cumulativo do lançamento das pedras, com o sufixo feminino remetendo à parcela de terra.
- source_word: מַעְיַן מַיִם יִסְתֹּמוּ
  choice: Obstruíram todas as fontes de água
  rationale: סתם indica bloquear ou entupir; “obstruíram” é claro e adequado a fontes de água.
- source_word: עֵץ טוֹב יַפִּילוּ
  choice: derrubaram todas as árvores boas
  rationale: A tradução conserva a expressão ampla e literal “árvore boa”, sem especificar “frutífera”, embora árvores valiosas ou produtivas provavelmente estejam em vista.
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: até que, em Quir-Haresete, só restaram as suas pedras
  rationale: A redação comunica o resultado da devastação e acomoda naturalmente a mudança para o singular no hebraico, sem tentar identificar de modo excessivamente preciso a referência das pedras.
- source_word: הַקַּלָּעִים
  choice: os atiradores de funda
  rationale: O substantivo designa combatentes que usavam fundas; a expressão é mais imediatamente compreensível em português moderno do que “fundibulários”.
- source_word: וַיָּסֹבּוּ ... וַיַּכּוּהָ
  choice: cercaram a cidade e a atacaram
  rationale: סבב indica que os atiradores rodearam ou cercaram o alvo; נכה significa literalmente golpear, mas no contexto descreve o ataque militar contra a cidade.
