  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: pt
  text: Eles se levantaram cedo pela manhã, e o sol brilhou sobre as águas; os moabitas[a] viram, diante deles[b], as águas vermelhas como sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Moabe”, usado coletivamente para o povo de Moabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do outro lado deles” ou “em frente deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Eles se levantaram cedo pela manhã
  rationale: O hifil de שׁכם expressa levantar-se cedo ou começar cedo. A formulação conserva tanto a ação quanto a indicação temporal e soa natural em português.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: e o sol brilhou sobre as águas
  rationale: זרח pode indicar nascer ou brilhar; neste contexto, o efeito da luz sobre a água favorece “brilhou”. “Sobre as águas” reproduz de modo natural a relação expressa por עַל.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: os moabitas viram
  rationale: מוֹאָב, literalmente “Moabe”, designa coletivamente o povo. Em português corrente, “os moabitas” evita que o território pareça ser o sujeito da ação.
- source_word: מִנֶּגֶד
  choice: Do outro lado
  rationale: A expressão situa os observadores em posição oposta ou fronteira às águas. “Do outro lado” comunica essa relação espacial com clareza, sem reduzi-la apenas à ideia de distância.
- source_word: אֶת הַמַּיִם אֲדֻמִּים כַּדָּם
  choice: as águas vermelhas como sangue
  rationale: Mantém o predicativo plural hebraico e a comparação vívida introduzida por כ. O plural “águas” é idiomático no registro bíblico português e concorda com “vermelhas”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação narrativa hebraica foi preservada sem tornar o período excessivamente rígido; “os moabitas” explicita naturalmente o uso coletivo de “Moabe”.
