  text: וְ/הִכִּיתֶ֞ם כָּל עִ֤יר מִבְצָר֙ וְ/כָל עִ֣יר מִבְח֔וֹר וְ/כָל עֵ֥ץ טוֹב֙ תַּפִּ֔ילוּ וְ/כָל מַעְיְנֵי מַ֖יִם תִּסְתֹּ֑מוּ וְ/כֹל֙ הַ/חֶלְקָ֣ה הַ/טּוֹבָ֔ה תַּכְאִ֖בוּ בָּ/אֲבָנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: pt
  text: Vocês atacarão todas as cidades fortificadas e todas as cidades de destaque[a]; derrubarão todas as árvores boas, obstruirão todas as fontes de água e arruinarão com pedras todos os bons campos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cidades seletas” ou “as melhores cidades”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é literalmente “farão doer com pedras” e se refere a arruinar terras cultiváveis espalhando pedras sobre elas.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: Vocês atacarão
  rationale: O hifil de נכה tem sentido militar de golpear ou atacar. “Atacarão” soa natural em português quando o objeto é uma cidade, sem acrescentar a ideia de conquista.
- source_word: כָּל עִיר מִבְצָר
  choice: todas as cidades fortificadas
  rationale: מִבְצָר designa fortificação ou lugar fortificado; “cidades fortificadas” preserva com clareza o sentido militar.
- source_word: וְכָל עִיר מִבְחוֹר
  choice: e todas as cidades escolhidas[a]
  rationale: מִבְחוֹר significa aquilo que é escolhido, seleto ou excelente. “Escolhidas” mantém a formulação próxima do hebraico, enquanto a nota registra alternativas contextuais.
- source_word: וְכָל עֵץ טוֹב תַּפִּילוּ
  choice: derrubarão todas as árvores boas
  rationale: O hifil de נפל significa fazer cair. “Derrubarão” é corrente e preciso; “árvores boas” conserva a amplitude de טוֹב sem restringi-lo a árvores frutíferas.
- source_word: וְכָל מַעְיְנֵי מַיִם תִּסְתֹּמוּ
  choice: obstruirão todas as fontes de água
  rationale: מַעְיְנֵי מַיִם são nascentes ou fontes naturais, e סתם significa fechar ou bloquear. “Obstruirão” expressa de modo natural a inutilização dessas fontes.
- source_word: וְכֹל הַחֶלְקָה הַטּוֹבָה
  choice: todos os bons campos
  rationale: חֶלְקָה é uma parcela de terra ou campo. O plural distributivo em português transmite o valor de “cada/toda parcela boa” com fluidez.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: arruinarão com pedras
  rationale: A expressão incomum emprega o hifil de כאב, literalmente relacionado a causar dor ou dano. No contexto, descreve tornar a terra improdutiva espalhando pedras; “arruinarão com pedras” comunica o efeito sem apagar a imagem.
