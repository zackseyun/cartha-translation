    issue: “cidades escolhidas” é ambíguo e pode ser entendido como cidades selecionadas para serem atacadas.
    rationale: O hebraico עִיר מִבְחוֹר qualifica a cidade como escolhida/seleta/de excelência, não descreve uma seleção prévia das cidades que sofrerão o ataque. “Cidades de destaque” comunica melhor esse valor no português corrente.
