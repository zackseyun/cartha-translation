  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: pt
  text: Mesa, rei de Moabe, era criador de ovelhas e costumava pagar ao rei de Israel, como tributo, cem mil cordeiros e a lã de cem mil carneiros[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “cem mil carneiros, lã”. A expressão é elíptica e pode significar “cem mil carneiros com lã” ou, mais provavelmente neste contexto, “a lã de cem mil carneiros”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: criador de ovelhas
  rationale: O termo designa alguém dedicado à criação de ovelhas. A expressão é clara, atual e adequada ao contexto econômico.
- source_word: וְהֵשִׁיב
  choice: costumava pagar
  rationale: O hifil de שׁוב tem aqui o sentido idiomático de entregar ou pagar tributo; a forma verbal no contexto indica uma prática habitual.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: cem mil cordeiros
  rationale: כָּרִים designa cordeiros ou carneiros jovens; “cordeiros” é uma tradução natural no contexto de uma lista de tributos.
- source_word: אֵילִים צָמֶר
  choice: a lã de cem mil carneiros
  rationale: A construção hebraica é elíptica, literalmente “cem mil carneiros, lã”. A tradução explicita a interpretação contextual mais provável sem ocultar a alternativa, registrada em nota.
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Moabe / rei de Israel
  rationale: Tradução normal das construções de estado construto, com os nomes geográficos em suas formas portuguesas consagradas.
