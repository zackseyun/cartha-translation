source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: pt
  text: 'E Josafá disse: “Não há aqui nenhum profeta de Yahweh, para que consultemos Yahweh por meio dele?” Então um dos servos do rei de Israel respondeu: “Eliseu, filho de Safate, está aqui, aquele que derramava água sobre as mãos de Elias[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão descreve o serviço pessoal que Eliseu prestava a Elias e preserva a imagem hebraica de derramar água para lavar as mãos.
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: Não há... nenhum?
  rationale: Formula em português uma pergunta negativa natural, preservando a expectativa de que talvez haja um profeta disponível.
- source_word: נָבִיא לַיהוָה
  choice: profeta de Yahweh
  rationale: Expressa de modo natural a relação do profeta com Yahweh, sem tornar o lamed excessivamente específico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em conformidade com a convenção do projeto.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: para que consultemos Yahweh por meio dele
  rationale: Comunica tanto o propósito de buscar uma resposta de Yahweh quanto a mediação do profeta indicada por מֵאֹתוֹ.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: um dos servos do rei de Israel
  rationale: Mantém o termo amplo עֶבֶד; no contexto da corte, designa um servidor ou auxiliar real.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: aquele que derramava água sobre as mãos de Elias
  rationale: Preserva a imagem hebraica do serviço pessoal e usa o imperfeito para indicar uma prática passada, sem reduzi-la a uma única ocasião.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Consulta a Yahweh mediante o profeta
  choice: consultemos Yahweh por meio dele
  alternative: busquemos Yahweh da parte dele
  rationale: A tradução explicita apenas a mediação já indicada pela construção hebraica, sem definir além do texto a natureza dessa mediação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem cultural foi mantida no texto em vez de ser substituída por uma paráfrase como “assistente de Elias”.
