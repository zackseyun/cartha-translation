base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: pt
  text: 'Ele disse: “Por qual caminho subiremos?” E ele disse: “Pelo caminho do deserto de Edom.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ele perguntou / Ele respondeu
  rationale: O verbo אמר significa literalmente “dizer”, mas o contexto imediato torna naturais “perguntou” na primeira fala e “respondeu” na segunda. O pronome “ele” preserva a referência implícita do hebraico sem acrescentar nomes.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Por qual caminho
  rationale: A expressão interrogativa אֵי זֶה, diante de הַדֶּרֶךְ, pergunta qual rota deve ser tomada. “Por qual caminho” é idiomático em português e combina diretamente com a resposta.
- source_word: נַעֲלֶה
  choice: subiremos
  rationale: 'A forma de עלה indica a ação futura ou proposta do grupo: “subiremos”. Mantém a imagem espacial do hebraico sem explicitar uma marcha militar.'
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  choice: Pelo caminho do deserto de Edom
  rationale: A resposta nominal identifica a rota. “Pelo” supre naturalmente a relação exigida em português; “deserto de Edom” conserva de modo direto a cadeia construta hebraica.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
