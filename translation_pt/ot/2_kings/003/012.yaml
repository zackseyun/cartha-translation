  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: pt
  text: 'Josafá disse[a]: “A palavra de Yahweh está com ele.” Então o rei de Israel, Josafá e o rei de Edom desceram até ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele tem uma palavra de Yahweh”.'
    reason: Alternativa lexical para a construção יֵשׁ אֹתוֹ דְּבַר יְהוָה, que pode indicar tanto presença quanto posse de uma mensagem divina.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר; “disse” introduz naturalmente a fala direta.
- source_word: יֵשׁ אֹתוֹ
  choice: está com ele
  rationale: A construção existencial com אֹתוֹ pode expressar presença ou posse. “Está com ele” preserva a formulação e a ideia de que a revelação divina se encontra junto ao profeta, sem excluir o sentido idiomático de que ele a possui.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a expressão profética tradicional e deixa aberta a possibilidade de referência à revelação divina em geral ou a uma mensagem específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico.
- source_word: וַיֵּרְדוּ
  choice: desceram
  rationale: Preserva o sentido direcional de ירד de modo natural e conciso em português.
- source_word: אֵלָיו
  choice: até ele
  rationale: Expressa o movimento em direção ao profeta e combina naturalmente com “desceram”.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Reproduz diretamente o título formal.
- source_word: וִיהוֹשָׁפָט
  choice: Josafá
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: e o rei de Edom
  rationale: Preserva o título e a estrutura coordenada do hebraico.
theological_decisions:
- issue: Sentido da fórmula profética דְּבַר יְהוָה em relação a Eliseu
  choice: “A palavra de Yahweh está com ele”
  alternative: “Ele tem uma palavra de Yahweh”
  rationale: A tradução principal conserva a imagem de presença expressa pela construção hebraica, enquanto a nota registra o sentido possessivo idiomático e a possível referência a uma mensagem profética específica.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas reconhecíveis. A pontuação evita uma vírgula antes do último elemento da enumeração, conforme o uso corrente. O nome divino é apresentado como “Yahweh”, e a ambiguidade entre presença da palavra e posse de uma mensagem é preservada por nota.
