  text: וַ/יֵּלֶךְ֩ מֶ֨לֶךְ יִשְׂרָאֵ֤ל וּ/מֶֽלֶך יְהוּדָה֙ וּ/מֶ֣לֶךְ אֱד֔וֹם וַ/יָּסֹ֕בּוּ דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא הָיָ֨ה מַ֧יִם לַֽ/מַּחֲנֶ֛ה וְ/לַ/בְּהֵמָ֖ה אֲשֶׁ֥ר בְּ/רַגְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: pt
  text: Então o rei de Israel partiu com o rei de Judá e o rei de Edom. Eles fizeram um circuito de sete dias, mas não havia água para o acampamento nem para os animais que os acompanhavam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os animais que estavam aos pés deles”, expressão que indica os animais que os acompanhavam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partiu
  rationale: O verbo הלך inicia a expedição. “Partiu” é natural em português e expressa o início do deslocamento sem acrescentar ao verbo um sentido militar não explicitado.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: o rei de Israel ... o rei de Judá e o rei de Edom
  rationale: A repetição do título preserva a coordenação hebraica e deixa clara a participação dos três reis.
- source_word: וַיָּסֹבּוּ דֶּרֶךְ שִׁבְעַת יָמִים
  choice: Eles fizeram um circuito de sete dias
  rationale: סבב indica movimento em volta ou por uma rota indireta, enquanto דֶּרֶךְ שִׁבְעַת יָמִים indica a extensão da jornada. “Circuito de sete dias” conserva ambos os elementos de modo conciso e compreensível.
- source_word: וְלֹא הָיָה מַיִם
  choice: não havia água
  rationale: Reproduz diretamente a construção existencial hebraica em português natural.
- source_word: לַמַּחֲנֶה
  choice: para o acampamento
  rationale: מַחֲנֶה pode designar tanto o acampamento quanto a força nele reunida. “Acampamento” mantém essa referência coletiva sem explicitação excessiva.
- source_word: וְלַבְּהֵמָה
  choice: nem para os animais
  rationale: בְּהֵמָה é um coletivo para os animais domésticos ou de carga que acompanhavam a expedição. “Animais” é claro e abrangente no contexto.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: que os acompanhavam
  rationale: A expressão literal “que estavam aos pés deles” funciona aqui como referência aos animais que seguiam com o grupo. A tradução comunica o sentido idiomático, e a imagem literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente longa sem alterar a sequência narrativa.
