revisions:
- from: 'E disseram: “Isto é sangue! Os reis certamente se destruíram[a] e mataram uns aos outros. Agora, Moabe[b], ao despojo!”'
  to: 'E disseram: “Isto é sangue! Os reis certamente lutaram entre si e golpearam uns aos outros. Agora, Moabe, ao saque!”'
  rationale: A revisão evita atribuir explicitamente mortes onde o hebraico diz apenas que cada um golpeou o outro, melhora a fluência da sequência verbal e torna a nota lexical mais precisa. Mantém-se a leitura contextual de conflito recíproco, enquanto a nota preserva a alternativa formal do nifal enfático.
