    text: 'Ou: “Os reis foram completamente destruídos”. O hebraico usa uma forma enfática do verbo “ser destruído”; no contexto, os moabitas concluem que os reis se voltaram uns contra os outros.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Moabitas, ao saque!”'
    reason: lexical_alternative
  revision_rationale: A revisão evita atribuir explicitamente mortes onde o hebraico diz apenas que cada um golpeou o outro, melhora a fluência da sequência verbal e torna a nota lexical mais precisa. Mantém-se a leitura contextual de conflito recíproco, enquanto a nota preserva a alternativa formal do nifal enfático.
