review_pass:
  verdict: revise
  source_fidelity: A tradução atual capta corretamente a exclamação inicial, os reis como sujeitos definidos e o chamamento final. Contudo, «mataram uns aos outros» torna וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ mais específico do que o hebraico, cujo verbo significa primariamente «golpear/ferir». A primeira expressão verbal é formalmente um nifal enfático de חרב («foram completamente destruídos»), mas o contexto permite uma formulação recíproca que explicita a inferência dos moabitas.
  naturalness: «Certamente se destruíram e mataram uns aos outros» soa redundante em português, pois as duas ações se sobrepõem. «Certamente lutaram entre si e golpearam uns aos outros» preserva a progressão da inferência e é claro em português moderno. «Ao saque!» é mais idiomático e direto do que «ao despojo!» neste grito de guerra.
  terminology: «Moabe» é a forma portuguesa estabelecida para o topônimo. «Saque» traduz naturalmente שָׁלָל no contexto de pilhagem militar. A nota deve identificar corretamente a forma hebraica como nifal enfático, sem apresentar a leitura contextual como se fosse o único sentido lexical.
  issues:
  - severity: medium
    issue: «mataram uns aos outros» traduz וַיַּכּוּ de maneira excessivamente específica.
    rationale: O verbo נכה denota golpear e pode, conforme o contexto, levar à morte, mas não a exige. «Golpearam» mantém o sentido sem acrescentar o resultado letal.
  - severity: medium
    issue: A sequência «se destruíram e mataram uns aos outros» é semanticamente redundante e pouco natural.
    rationale: A primeira expressão já comunica, no contexto, destruição mútua. Verter a inferência como combate mútuo e manter «golpearam» para a segunda cláusula reproduz melhor a estrutura hebraica.
  - severity: low
    issue: A nota a descreve o verbo de forma imprecisa como «ser destruído/devastado».
    rationale: A construção é um infinitivo absoluto com verbo finito no nifal de חרב; convém indicar a leitura formal «foram completamente destruídos» e explicar que o contexto favorece a inferência de conflito mútuo.
  revised_text: 'E disseram: “Isto é sangue! Os reis certamente lutaram entre si e golpearam uns aos outros. Agora, Moabe, ao saque!”'
  revised_footnotes:
