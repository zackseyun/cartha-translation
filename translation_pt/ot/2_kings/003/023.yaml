base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: pt
  text: 'E disseram: “Isto é sangue! Os reis certamente lutaram entre si e golpearam uns aos outros. Agora, Moabe, ao saque!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּם זֶה
  choice: Isto é sangue!
  rationale: Mantém a oração nominal exclamativa e a força demonstrativa de זֶה em português natural.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: certamente se destruíram
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a afirmação. A forma reflexiva/recíproca comunica, no contexto, a conclusão dos moabitas de que os reis aliados haviam acabado uns com os outros, sem apagar a forma passiva do hebraico, registrada em nota.
- source_word: הַמְּלָכִים
  choice: os reis
  rationale: Plural definido que retoma os governantes da coalizão mencionados no contexto.
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: e mataram uns aos outros
  rationale: A construção idiomática expressa ação recíproca. No contexto militar e diante do suposto sangue, “mataram” transmite melhor o resultado inferido do que o mais genérico “feriram”.
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição urgente da observação para a convocação.
- source_word: לַשָּׁלָל
  choice: ao despojo
  rationale: Preserva a concisão do grito de guerra e a força direcional da preposição ל.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Conserva o nome da nação usado como vocativo coletivo; a alternativa gentílica é indicada em nota.
