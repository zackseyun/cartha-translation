base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/005.yaml
  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: pt
  text: Quando Acabe morreu, o rei de Moabe se rebelou contra o rei de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois da morte de Acabe, o rei de Moabe se rebelou contra o rei de Israel.” A expressão temporal hebraica admite ambas as formas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמוֹת
  choice: Quando ... morreu
  rationale: A construção narrativa וַיְהִי seguida de כְּ com o infinitivo de מות introduz a circunstância temporal do acontecimento seguinte. Em português, “Quando Acabe morreu” comunica essa relação de modo natural e fiel, sem a expressão pouco idiomática “e aconteceu”.
- source_word: אַחְאָב
  choice: Acabe
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיִּפְשַׁע
  choice: se rebelou
  rationale: Neste contexto político, פשע indica revolta contra um soberano ou o rompimento da submissão tributária; “se rebelou” é claro e preciso.
- source_word: מֶלֶךְ מוֹאָב
  choice: o rei de Moabe
  rationale: Reproduz naturalmente em português a cadeia construta hebraica e preserva a designação formal do governante.
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: contra o rei de Israel
  rationale: Com פשע, a preposição בְּ assinala aquele contra quem a rebelião é dirigida; “contra” é o equivalente idiomático em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluidez brasileira. A abertura temporal foi integrada à oração para evitar um hebraísmo artificial, enquanto a nota preserva a alternativa formal possível.
