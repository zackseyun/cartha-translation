base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/016.yaml
  text: 'And he said[c][b][a], “Thus says Yahweh: Make this wadi full of pits.”'
translation:
  language: pt
  text: 'E ele disse: “Assim diz Yahweh[a]: ‘Faça covas e mais covas[c] neste leito de riacho[b]’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh” representa o nome divino YHWH; tradicionalmente, também se traduz “SENHOR”.
    reason: alternative_reading
  - marker: b
    text: O termo hebraico pode indicar um vale, uma torrente ou o leito de um curso de água sazonal.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “covas, covas”; a repetição indica muitas covas ou covas por toda parte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva a sequência narrativa do wayyiqtol sem acrescentar uma nuance temporal ausente no hebraico.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética solene e verte o nome divino pessoal de modo transparente.
- source_word: עָשֹׂה
  choice: Façam
  rationale: O infinitivo absoluto funciona aqui como ordem. “Façam” conserva o sentido amplo de עשה, sem explicitar “cavem”, embora essa seja a ação naturalmente pressuposta.
- source_word: הַנַּחַל הַזֶּה
  choice: neste leito de riacho
  rationale: נחל pode designar o leito de um curso de água, muitas vezes sazonal; a expressão é mais imediatamente compreensível em português do que o empréstimo “uádi”.
- source_word: גֵּבִים גֵּבִים
  choice: covas e mais covas
  rationale: Reproduz de maneira idiomática a repetição distributiva e enfática do hebraico, indicando numerosas covas por todo o leito.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” o representa diretamente, em vez de substituí-lo por um título, sem impor uma leitura denominacional.
translation_notes:
  register: Português atual, claro e solene, com cadência profética em “Assim diz Yahweh”. “Leito de riacho” evita um regionalismo técnico, e “covas e mais covas” preserva a ênfase concreta da repetição hebraica.
