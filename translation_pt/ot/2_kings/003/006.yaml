  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: pt
  text: Naquele dia, o rei Jorão saiu de Samaria e convocou todo o Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contou todo o Israel” ou “passou em revista todo o Israel”. O verbo hebraico pode indicar uma contagem ou uma convocação militar; neste contexto, o sentido militar é o mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא indica sair ou partir. “Saiu” preserva o movimento narrativo sem acrescentar por si só uma nuance militar.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: o rei Jorão
  rationale: A construção hebraica é vertida segundo o uso natural do português, mantendo a forma tradicional e amplamente reconhecível do nome.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Reproduz de modo claro e idiomático a referência temporal literal “naquele dia”.
- source_word: מִשֹּׁמְרוֹן
  choice: de Samaria
  rationale: A preposição מן marca a origem ou o ponto de partida; “de Samaria” é a formulação portuguesa mais natural.
- source_word: וַיִּפְקֹד
  choice: convocou
  rationale: Neste contexto de preparação para uma campanha, פקד tem sentido militar de reunir, passar em revista ou contar as forças. “Convocou” comunica naturalmente a mobilização sem restringir o verbo ao ato de contar.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Mantém a expressão coletiva hebraica, que aqui pode designar o povo ou as forças do reino do norte.
