  text: וְ/כָל מוֹאָב֙ שָֽׁמְע֔וּ כִּֽי עָל֥וּ הַ/מְּלָכִ֖ים לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִּצָּעֲק֗וּ מִ/כֹּ֨ל חֹגֵ֤ר חֲגֹרָה֙ וָ/מַ֔עְלָ/ה וַ/יַּעַמְד֖וּ עַֽל הַ/גְּבֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: pt
  text: Todo o povo de Moabe soube que os reis tinham subido para lutar contra eles. Então foram convocados[a] todos, desde os que já podiam cingir um cinturão até os mais velhos[b], e tomaram posição na fronteira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram reunidos” ou “foram mobilizados”. Neste contexto, o verbo hebraico provavelmente se refere à convocação para a defesa, e não simplesmente a gritar.'
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “desde todo aquele que cinge um cinturão para cima”, expressão que indica os que já tinham idade para o serviço militar e os mais velhos.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: Todo o povo de Moabe
  rationale: O nome coletivo מוֹאָב designa aqui a nação ou o povo. A explicitação de “povo” evita que o território pareça ser o sujeito que ouve.
- source_word: שָׁמְעוּ
  choice: soube
  rationale: Neste contexto de recebimento de uma notícia, שמע tem naturalmente o sentido de “ouvir e ficar sabendo”; “soube” é idiomático em português.
- source_word: כִּי עָלוּ הַמְּלָכִים
  choice: que os reis tinham subido
  rationale: Preserva o valor direcional de עלה e o aspecto anterior da ação em relação à mobilização de Moabe.
- source_word: לְהִלָּחֶם בָּם
  choice: para lutar contra eles
  rationale: Expressa diretamente o infinitivo de לחם com ב, que indica entrar em combate contra alguém.
- source_word: וַיִּצָּעֲקוּ
  choice: foram convocados
  rationale: No contexto de resposta militar, o verbo indica convocação ou mobilização, não apenas um clamor.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: todos, desde os que já podiam cingir um cinturão até os mais velhos
  rationale: Mantém a imagem concreta do cinturão e comunica de modo natural o limiar de idade seguido por וָמַעְלָה, isto é, também os de idade superior.
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: e tomaram posição na fronteira
  rationale: עמד על descreve aqui uma tomada de posição no limite territorial; a formulação portuguesa transmite a nuance militar do contexto.
