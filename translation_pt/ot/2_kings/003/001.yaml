reference: 2 Kings 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וִ/יהוֹרָ֣ם בֶּן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ שְׁתֵּים עֶשְׂרֵ֥ה שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: pt
  text: Jorão, filho de Acabe, começou a reinar sobre Israel, em Samaria, no décimo oitavo ano de Josafá, rei de Judá,[a] e reinou durante doze anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “E Jorão, filho de Acabe, começou a reinar sobre Israel...”. A conjunção hebraica também pode ser traduzida simplesmente por “e”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹרָם
  choice: Jorão
  rationale: Adota a forma portuguesa tradicional e amplamente reconhecida do nome hebraico יְהוֹרָם. A conjunção inicial mantém a continuidade narrativa, mas não precisa ser representada por um «e» inicial pouco natural em português.
- source_word: בֶּן אַחְאָב
  choice: filho de Acabe
  rationale: Tradução direta da relação filial, com a forma portuguesa tradicional do nome Acabe.
- source_word: מָלַךְ
  choice: começou a reinar
  rationale: Neste sincronismo régio, o verbo indica a ascensão ao trono. A formulação distingue esse início do reinado da oração final, que informa sua duração.
- source_word: עַל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: Expressão portuguesa corrente para indicar o povo ou reino submetido à autoridade real.
- source_word: בְּ/שֹׁמְרוֹן
  choice: em Samaria
  rationale: O בְּ locativo é naturalmente traduzido por «em»; aqui Samaria é a capital e sede do governo.
- source_word: בִּ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: no décimo oitavo ano
  rationale: Formulação idiomática portuguesa para a datação por ano de reinado.
- source_word: לִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: de Josafá, rei de Judá
  rationale: Nesse tipo de sincronismo, לְ indica que se trata do décimo oitavo ano do reinado de Josafá.
- source_word: וַ/יִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: e reinou durante doze anos
  rationale: Aqui מלך descreve a duração do governo; «durante» torna clara essa função sem acrescentar conteúdo interpretativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais dos nomes bíblicos. A redação preserva a fórmula cronológica do hebraico, mas diferencia de modo natural a ascensão ao trono («começou a reinar») da duração do reinado («reinou durante doze anos»).
