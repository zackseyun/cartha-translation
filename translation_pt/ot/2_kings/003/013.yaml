  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: pt
  text: 'Então Eliseu disse ao rei de Israel: “Que tenho eu a ver com você?[a] Vá aos profetas de seu pai e aos profetas de sua mãe.” Mas o rei de Israel lhe disse: “Não,[b] pois Yahweh convocou estes três reis para entregá-los nas mãos de Moabe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Idiom hebraico: “Que há entre mim e você?” — fórmula que expressa distanciamento ou rejeição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Por favor, não! Pois Yahweh convocou estes três reis para entregá-los nas mãos de Moabe.” A expressão hebraica é difícil e também pode ser entendida como uma súplica, não apenas como uma objeção direta.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Que tenho eu a ver com você?
  rationale: Reproduz em português corrente o sentido do idioma hebraico, que expressa distanciamento ou rejeição, sem transformar a pergunta em uma afirmação explicativa.
- source_word: לֵךְ
  choice: Vá
  rationale: Mantém diretamente o imperativo hebraico em forma natural no português.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: os profetas de seu pai e os profetas de sua mãe
  rationale: Conserva a repetição enfática e a referência específica às associações proféticas da casa real.
- source_word: אַל כִּי
  choice: Não, pois
  rationale: A expressão é difícil e elíptica. No contexto, pode introduzir uma objeção do rei à rejeição de Eliseu; a nota preserva a possibilidade de uma súplica.
- source_word: קָרָא
  choice: convocou
  rationale: Neste contexto, o verbo indica que Yahweh chamou ou reuniu os três reis para a expedição; “convocou” comunica esse sentido com clareza.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: estes três reis
  rationale: Mantém o numeral, o demonstrativo e o título real do hebraico em ordem natural no português.
- source_word: לָתֵת אוֹתָם
  choice: para entregá-los
  rationale: Expressa naturalmente a finalidade ou o resultado indicado pelo infinitivo e prepara o idioma seguinte de sujeição ao poder inimigo.
- source_word: בְּיַד מוֹאָב
  choice: nas mãos de Moabe
  rationale: Preserva a imagem hebraica da mão como poder ou domínio, usando a forma idiomática mais corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino; “Yahweh” o representa por transliteração sem substituí-lo por um título.
- issue: Sentido da resposta אַל כִּי
  choice: 'Objeção: “Não, pois...”'
  alternative: 'Súplica: “Por favor, não! Pois...”'
  rationale: A construção hebraica é concisa e difícil. O contexto favorece uma contestação à fala de Eliseu, mas a nota registra a leitura possível como súplica, sem eliminar a ambiguidade.
- issue: Agência atribuída a Yahweh
  choice: Yahweh convocou os três reis para entregá-los
  alternative: Yahweh apenas permitiu que os reis se reunissem e fossem derrotados
  rationale: A tradução mantém a atribuição direta feita pelo rei de Israel, sem endossá-la por explicação adicional nem atenuá-la teologicamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” porque o rei é tratado no singular e o idioma hebraico comunica confronto direto; conserva a repetição “os profetas” e usa “nas mãos de Moabe” para manter a imagem semítica em forma natural.
