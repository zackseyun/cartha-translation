  text: וַ/יָּבֹאוּ֮ אֶל מַחֲנֵ֣ה יִשְׂרָאֵל֒ וַ/יָּקֻ֤מוּ יִשְׂרָאֵל֙ וַ/יַּכּ֣וּ אֶת מוֹאָ֔ב וַ/יָּנֻ֖סוּ מִ/פְּנֵי/הֶ֑ם ו/יבו בָ֔/הּ וְ/הַכּ֖וֹת אֶת מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: pt
  text: Quando chegaram ao acampamento de Israel, os israelitas se levantaram e atacaram Moabe, e os moabitas fugiram diante deles. Então, entraram nela[a] e continuaram a atacar Moabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entraram nela”. O sufixo feminino provavelmente se refere à terra ou ao território de Moabe; também pode ser entendido como “avançaram por Moabe”.'
    reason: O antecedente do pronome feminino está implícito e é gramaticalmente ambíguo no texto hebraico.
lexical_decisions:
- source_word: מַחֲנֵה
  choice: acampamento
  rationale: No contexto militar, o substantivo designa o acampamento do exército; “acampamento” é claro e natural em português.
- source_word: וַיָּקֻמוּ
  choice: se levantaram
  rationale: Mantém a imagem e a sequência narrativa de קום, que aqui introduz uma reação militar decidida sem antecipar o verbo seguinte.
- source_word: וַיַּכּוּ
  choice: atacaram
  rationale: Neste contexto de batalha, נכה descreve um golpe ou ataque militar. “Atacaram” soa natural em português e evita sugerir, como “derrotaram”, um resultado mais amplo que o verbo não explicita.
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: os moabitas fugiram diante deles
  rationale: Explicita a mudança de sujeito necessária para evitar ambiguidade enganosa em português e preserva o idioma hebraico “fugir diante de”.
- source_word: וַיָּבֹאוּ בָהּ
  choice: entraram na terra
  rationale: O sufixo feminino singular aponta provavelmente para a terra ou o território de Moabe, embora o antecedente permaneça implícito no hebraico. A opção principal oferece português inteligível, e a nota conserva a dificuldade textual.
- source_word: וְהַכּוֹת
  choice: continuaram atacando
  rationale: O infinitivo ligado à sequência verbal apresenta a ação como concomitante ou continuada; esta formulação reproduz naturalmente seu valor durativo.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Mantém o nome coletivo do território e do povo conforme o hebraico, usando a forma tradicional e corrente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Os israelitas” e “os moabitas” tornam explícitas as mudanças de sujeito exigidas pelo contexto, sem alterar os participantes. A ambiguidade do sufixo feminino em בָהּ é preservada em nota, enquanto o texto principal adota a leitura contextual mais provável.
