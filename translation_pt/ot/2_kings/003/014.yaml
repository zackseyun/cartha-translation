base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: pt
  text: 'E Eliseu disse: “Tão certo como Yahweh dos Exércitos vive, diante de quem estou, se não fosse pela consideração que tenho por Josafá, rei de Judá,[a] não olharia para você nem o veria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “se eu não levantasse a face de Josafá”; trata-se de uma expressão idiomática que significa mostrar consideração, favor ou deferência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: Tão certo como vive Yahweh dos Exércitos
  rationale: Reproduz a fórmula hebraica de juramento em português natural. Mantém Yahweh como nome divino e traduz צְבָאוֹת pelo título consagrado e semanticamente amplo “dos Exércitos”.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: diante de quem estou
  rationale: Preserva a imagem literal de estar diante de Yahweh e permite também a nuance de serviço profético, sem explicitá-la indevidamente.
- source_word: לוּלֵי פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: se eu não tivesse consideração pela presença de Josafá
  rationale: Expressa a condição contrária ao fato e conserva a referência à “presença/face” de Josafá. “Ter consideração” comunica o sentido idiomático de נָשָׂא פָנִים, isto é, mostrar favor ou deferência.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: não olharia para você nem lhe daria atenção
  rationale: A construção de juramento implica negação enfática. A primeira expressão mantém o ato de olhar; a segunda traduz idiomaticamente “ver” como reconhecer ou dar atenção, preservando a intensificação sem produzir uma repetição pouco natural.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Josafá, rei de Judá
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes próprios.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Postura profética diante de Deus
  choice: diante de quem estou
  alternative: a quem sirvo
  rationale: A formulação conserva tanto a imagem concreta do hebraico quanto sua possível conotação de serviço profético.
- issue: Atitude de Eliseu para com Josafá
  choice: ter consideração pela presença de Josafá
  alternative: respeitar Josafá ou favorecer Josafá
  rationale: A opção preserva o idioma hebraico envolvendo a “face/presença” sem definir de modo excessivamente estreito se se trata de respeito, favor ou deferência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação de “rei de Judá” entre vírgulas evita ambiguidade sintática. O singular “você” reflete o destinatário masculino singular no hebraico. Os marcadores [a] e [b] aparecem no texto principal.
