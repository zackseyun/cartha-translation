revisions:
- from: 'E Eliseu disse: “Tão certo como vive Yahweh dos Exércitos, diante de quem estou, se eu não tivesse consideração pela presença de Josafá, rei de Judá,[a] não olharia para você nem lhe daria atenção”.[b]'
  to: 'E Eliseu disse: “Tão certo como Yahweh dos Exércitos vive, diante de quem estou, se não fosse pela consideração que tenho por Josafá, rei de Judá,[a] não olharia para você nem o veria.”'
  rationale: A revisão torna a condição contrafactual mais idiomática em português e restabelece no texto principal os dois verbos da conclusão hebraica. A nota mantém a imagem literal de «levantar a face» e sua faixa semântica, sem impor uma interpretação mais estreita.
