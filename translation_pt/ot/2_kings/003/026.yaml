  source_fidelity: 'A tradução preserva adequadamente a progressão do hebraico: a desvantagem militar do rei de Moabe, o contingente de setecentos homens, a tentativa de romper em direção ao rei de Edom e o fracasso final. “Forte demais para ele” comunica de forma idiomática o sentido de que a batalha o sobrepujava.'
