  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: pt
  text: Quando o rei de Moabe viu que a batalha estava forte demais para ele, levou consigo setecentos homens que manejavam a espada, a fim de abrir caminho até o rei de Edom[a], mas não conseguiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra o rei de Edom”. Neste contexto militar, a preposição hebraica pode indicar direção (“até”, “em direção a”) ou hostilidade (“contra”).'
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: a batalha estava forte demais para ele
  rationale: Reproduz de modo natural a construção em que a batalha se mostra mais forte que o rei, isto é, passa a dominá-lo militarmente.
- source_word: אֹתוֹ
  choice: consigo
  rationale: 'Depois de ''levou'', o marcador de objeto com sufixo tem sentido associativo no contexto: o rei levou a tropa consigo.'
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: setecentos homens
  rationale: Mantém diretamente o substantivo de contagem אִישׁ sem explicitar 'soldados', embora o contexto seja militar.
- source_word: שֹׁלֵף חֶרֶב
  choice: que manejavam a espada
  rationale: Conserva a imagem hebraica da espada e exprime naturalmente uma tropa apta para o combate; o singular coletivo hebraico é vertido no plural em concordância com 'homens'.
- source_word: לְהַבְקִיעַ
  choice: a fim de abrir caminho
  rationale: O hifil de בקע indica romper ou abrir uma brecha nas linhas inimigas; esta formulação é clara e idiomática em português.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: até o rei de Edom
  rationale: Preserva o valor direcional mais comum de אֶל sem eliminar a possibilidade de sentido hostil no contexto militar.
- source_word: וְלֹא יָכֹלוּ
  choice: mas não conseguiram
  rationale: Expressa de forma concisa o fracasso do rei e de seus homens na tentativa de romper as linhas.
theological_decisions:
- issue: Sentido de אֶל no avanço em direção ao rei de Edom
  choice: até o rei de Edom
  alternative: contra o rei de Edom
  rationale: A preposição admite tanto direção quanto orientação hostil neste contexto. O texto principal mantém a leitura direcional, e a nota registra a alternativa para preservar a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe acompanha o movimento narrativo do hebraico, evitando tanto literalismo áspero quanto explicitação excessiva.
