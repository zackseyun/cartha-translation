base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: pt
  text: Ele fez o que era mau aos olhos de Yahweh, mas não como seu pai e sua mãe,[a] pois removeu a coluna de Baal[b] que seu pai havia feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “somente não como seu pai e sua mãe”. A partícula hebraica introduz uma restrição: ele praticou o mal, mas não da mesma maneira ou na mesma medida que seus pais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a estela de Baal” ou “a pedra erguida de Baal”. O termo hebraico designa uma coluna ou pedra cultual associada à adoração de Baal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: fez o que era mau
  rationale: A expressão idiomática com עשה e הרע descreve uma conduta considerada má. A formulação é natural em português e mantém a força avaliativa do hebraico.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a imagem do idioma hebraico, que expressa a avaliação de Yahweh, e é clara em português atual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: רַק לֹא כְאָבִיו וּכְאִמּוֹ
  choice: mas não como seu pai e sua mãe
  rationale: רַק introduz uma restrição ao juízo anterior. A tradução preserva a comparação sem decidir de modo excessivo se ela diz respeito principalmente à maneira ou ao grau da maldade.
- source_word: וַיָּסַר
  choice: pois removeu
  rationale: O verbo significa retirar ou remover. “Pois” exprime a relação explicativa provável entre a remoção da coluna e a restrição anterior.
- source_word: מַצְּבַת הַבַּעַל
  choice: a coluna de Baal
  rationale: מַצֵּבָה designa uma pedra erguida ou coluna de função cultual. “Coluna de Baal” é conciso, compreensível e não a confunde com um poste de Aserá.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: que seu pai havia feito
  rationale: O mais-que-perfeito deixa clara a anterioridade da ação do pai em relação à remoção narrada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Sentido da comparação com os pais
  choice: mas não como seu pai e sua mãe
  alternative: mas não tanto quanto seu pai e sua mãe
  rationale: A formulação escolhida mantém a tensão do hebraico, que qualifica a maldade do rei sem especificar de maneira inequívoca se a diferença é de grau, de modo ou de práticas concretas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto o hebraico, mas usa conectivos naturais. Mantém-se “Yahweh” como nome próprio e evita-se linguagem denominacional.
