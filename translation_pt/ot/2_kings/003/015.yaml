  text: וְ/עַתָּ֖ה קְחוּ לִ֣/י מְנַגֵּ֑ן וְ/הָיָה֙ כְּ/נַגֵּ֣ן הַֽ/מְנַגֵּ֔ן וַ/תְּהִ֥י עָלָ֖י/ו יַד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: pt
  text: Agora, porém, tragam-me um músico[a]. E, enquanto o músico tocava, a mão de Yahweh[b] veio sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um instrumentista”. O hebraico se refere de modo geral a alguém que toca música, sem especificar o instrumento.
    reason: lexical_alternative
  - marker: b
    text: “A mão de Yahweh” é uma expressão idiomática hebraica que indica poder divino ou influência profética.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, porém
  rationale: Marca uma transição imediata no discurso; “porém” expressa naturalmente a mudança em relação à fala anterior.
- source_word: קְחוּ לִי
  choice: tragam-me
  rationale: O imperativo plural com o pronome dativo significa, neste contexto, providenciar ou trazer alguém ao falante.
- source_word: מְנַגֵּן
  choice: um músico
  rationale: O particípio de נגן designa genericamente alguém que toca um instrumento, sem identificar qual; “músico” é amplo, atual e natural.
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: E, enquanto o músico tocava
  rationale: A construção introduz a circunstância temporal da ação seguinte. Esta formulação preserva o aspecto contínuo sem reproduzir de modo rígido a fórmula narrativa hebraica.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Mantém a imagem idiomática hebraica, que pode comunicar poder ou influência profética, sem restringir seu sentido na tradução.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַתְּהִי עָלָיו
  choice: veio sobre ele
  rationale: Expressa o início da atuação divina e conserva o pronome masculino do hebraico, sem explicitar no corpo do texto um referente que a frase não nomeia.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada.
- issue: Sentido de יַד יְהוָה
  choice: a mão de Yahweh veio sobre ele
  alternative: o poder de Yahweh veio sobre ele
  rationale: A expressão provavelmente descreve poder ou influência profética, mas a imagem hebraica é preservada para não reduzir sua amplitude teológica.
- issue: Referente de עָלָיו
  choice: ele
  alternative: Eliseu
  rationale: O contexto aponta para Eliseu, mas o hebraico usa apenas um pronome. Manter “ele” preserva a forma e a possível ambiguidade da expressão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e as imagens centrais do hebraico foram preservadas, enquanto a construção temporal foi vertida de modo natural. Todos os marcadores de nota aparecem junto aos termos que explicam.
