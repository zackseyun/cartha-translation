source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Vocês não verão vento nem verão chuva; contudo, aquele leito de rio[a] ficará cheio de água, e vocês, seus rebanhos e seus animais beberão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele vale” ou “aquele uádi”. O termo hebraico נַחַל muitas vezes designa um curso de água sazonal ou seu leito.
    reason: Alternativa lexical e esclarecimento geográfico.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי כֹה אָמַר
  choice: Pois assim diz
  rationale: Preserva tanto a função explicativa de כִּי quanto a fórmula solene e idiomática de introdução da declaração divina.
- source_word: לֹא תִרְאוּ רוּחַ וְלֹא תִרְאוּ גֶשֶׁם
  choice: Vocês não verão vento nem verão chuva
  rationale: Os imperfeitos têm sentido futuro no contexto; רוּחַ é meteorológico, e a repetição de 'verão' mantém o paralelismo hebraico.
- source_word: הַנַּחַל הַהוּא
  choice: aquele leito de rio
  rationale: נַחַל pode designar o leito de um curso de água, muitas vezes sazonal. 'Leito de rio' é claro em português corrente, enquanto a nota preserva alternativas geográficas possíveis.
- source_word: יִמָּלֵא מָיִם
  choice: ficará cheio de água
  rationale: 'Expressa de modo natural o resultado indicado pela forma nifal: o leito passará a estar cheio de água.'
- source_word: וּשְׁתִיתֶם
  choice: beberão
  rationale: O futuro simples acompanha naturalmente a sequência da promessa.
- source_word: מִקְנֵיכֶם וּבְהֶמְתְּכֶם
  choice: seus rebanhos e seus animais
  rationale: Mantém a distinção entre os animais possuídos como rebanho ou gado e o termo mais geral para animais, sem definir categorias além do que o hebraico permite.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente יְהוָה. A transliteração preserva o nome pessoal da aliança, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento naturais para um público amplo. O paralelismo da declaração foi preservado, e o termo geográfico potencialmente ambíguo foi esclarecido em nota.
