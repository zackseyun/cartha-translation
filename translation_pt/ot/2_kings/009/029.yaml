  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: pt
  text: No décimo primeiro ano de Jorão, filho de Acabe[a], Acazias tornou-se rei de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As indicações cronológicas relativas aos reinados de Jorão e Acazias são difíceis de harmonizar entre Reis e Crônicas. Esta tradução reproduz o hebraico tal como está escrito, sem tentar resolver a cronologia no texto principal.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: No ... ano
  rationale: A combinação da conjunção com a preposição introduz uma referência temporal. Em português, a conjunção inicial pode ser omitida para que a nota cronológica soe natural.
- source_word: אַחַת עֶשְׂרֵה שָׁנָה
  choice: décimo primeiro ano
  rationale: É a forma idiomática portuguesa para a expressão hebraica de datação pelo ano de reinado.
- source_word: לְיוֹרָם
  choice: de Jorão
  rationale: Nesta fórmula régia, a preposição ל marca o reinado usado como referência cronológica.
- source_word: בֶּן אַחְאָב
  choice: filho de Acabe
  rationale: Tradução direta do patronímico, que identifica qual Jorão está em vista.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Nesse contexto, o verbo assinala a ascensão ao trono, não toda a duração do reinado.
- source_word: אֲחַזְיָה
  choice: Acazias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עַל יְהוּדָה
  choice: de Judá
  rationale: Embora עַל indique literalmente o âmbito sobre o qual se exerce o governo, a expressão portuguesa natural é “rei de Judá”.
