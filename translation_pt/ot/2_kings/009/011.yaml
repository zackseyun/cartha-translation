base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: pt
  text: 'Então Jeú saiu e foi até os servos de seu senhor, e um deles lhe perguntou: “Está tudo bem?[a] Por que esse louco[b] veio até você?” Ele lhes respondeu: “Vocês conhecem o homem e a conversa dele.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Há paz?”; também pode ser traduzido por “Está tudo em paz?”
    reason: lexical_alternative
  - marker: b
    text: Ou “esse homem insano”. O termo hebraico é um rótulo depreciativo.
    reason: lexical_alternative
  - marker: c
    text: Ou “o modo de ele falar”; em tom mais depreciativo, “a tagarelice dele”. O hebraico pode referir-se de modo amplo à fala ou ao discurso de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: os servos de seu senhor
  rationale: Mantém os termos hebraicos sem especificar “rei” nem impor aqui o sentido de escravidão; no contexto, trata-se dos homens subordinados ao superior de Jeú.
- source_word: הֲשָׁלוֹם
  choice: Está tudo bem?
  rationale: Expressa em português corrente a pergunta idiomática hebraica, literalmente formulada em termos de “paz”.
- source_word: מַדּוּעַ בָּא
  choice: Por que ... veio
  rationale: O perfeito hebraico, no diálogo narrativo, refere-se naturalmente à vinda recém-ocorrida.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: esse louco
  rationale: Preserva o rótulo masculino, depreciativo e desdenhoso do hebraico, sem suavizá-lo.
- source_word: וַיֹּאמֶר לוֹ
  choice: um deles lhe perguntou
  rationale: O verbo singular após o grupo plural indica naturalmente que um dos servos falou em nome dos demais; “perguntou” corresponde à forma interrogativa da fala.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: Vocês conhecem o homem
  rationale: Conserva a resposta evasiva de Jeú e o substantivo definido do hebraico.
- source_word: שִׂיחוֹ
  choice: a conversa dele
  rationale: Mantém a amplitude semântica de fala, discurso ou maneira de falar, bem como o tom levemente desdenhoso, sem restringir o termo a uma mensagem específica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você/vocês” torna o diálogo natural; “seu senhor” preserva a formulação do hebraico. Os marcadores aparecem imediatamente após as expressões a que se referem.
