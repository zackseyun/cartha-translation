base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: pt
  text: E farei com que a casa de Acabe seja como a casa de Jeroboão, filho de Nebate, e como a casa de Baasa, filho de Aías.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a dinastia de Acabe... a dinastia de Jeroboão... a dinastia de Baasa”. Aqui, o hebraico “casa” se refere a uma casa real ou linhagem dinástica.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְ/נָֽתַתִּי
  choice: E farei com que ... seja
  rationale: Embora נתן signifique literalmente “dar”, “pôr” ou “colocar”, nesta fórmula de juízo seguida de comparações a construção portuguesa “farei com que ... seja como” comunica naturalmente o sentido resultante e causativo.
- source_word: אֶת
  choice: '[marcador de objeto direto, sem tradução independente]'
  rationale: אֶת assinala o objeto direto definido em hebraico e não requer palavra correspondente em português.
- source_word: בֵּית אַחְאָב
  choice: a casa de Acabe
  rationale: “Casa” preserva a metáfora hebraica para a família real ou linhagem dinástica; “dinastia” é mais explícito, mas interpretativo.
- source_word: כְּ/בֵית
  choice: como a casa de
  rationale: O prefixo כְּ marca comparação; “como” é claro e natural em português.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboão, filho de Nebate
  rationale: Emprega as formas portuguesas tradicionais dos nomes e verte diretamente a relação filial.
- source_word: וּ/כְ/בֵית
  choice: e como a casa de
  rationale: Mantém a conjunção e o paralelismo da segunda comparação.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasa, filho de Aías
  rationale: Emprega formas portuguesas reconhecíveis dos nomes e preserva a referência histórica à dinastia anteriormente julgada.
theological_decisions:
- issue: Fórmula de juízo sobre uma dinastia
  choice: a casa de Acabe ... como a casa de Jeroboão ... e como a casa de Baasa
  alternative: a dinastia de Acabe ... como a dinastia de Jeroboão ... e como a dinastia de Baasa
  rationale: A formulação com “casa” preserva a imagem bíblica e sua ressonância intertextual, enquanto a nota esclarece que se trata da linhagem ou dinastia real, sem ampliar o texto com uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe “farei com que ... seja como” evita um literalismo pouco natural, enquanto “casa” conserva a metáfora dinástica do hebraico.
