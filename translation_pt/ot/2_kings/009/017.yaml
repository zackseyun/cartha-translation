  text: וְ/הַ/צֹּפֶה֩ עֹמֵ֨ד עַֽל הַ/מִּגְדָּ֜ל בְּ/יִזְרְעֶ֗אל וַ/יַּ֞רְא אֶת שִׁפְעַ֤ת יֵהוּא֙ בְּ/בֹא֔/וֹ וַ/יֹּ֕אמֶר שִׁפְעַ֖ת אֲנִ֣י רֹאֶ֑ה וַ/יֹּ֣אמֶר יְהוֹרָ֗ם קַ֥ח רַכָּ֛ב וּֽ/שְׁלַ֥ח לִ/קְרָאתָ֖/ם וְ/יֹאמַ֥ר הֲ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: pt
  text: 'O vigia estava de pé na torre de Jezreel e viu o grupo de Jeú quando este se aproximava. Então disse: “Vejo um grupo”. Jorão disse: “Escolha um cavaleiro e mande-o ao encontro deles. Que ele pergunte: ‘Há paz?’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Está tudo bem?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: o vigia
  rationale: Designa quem permanece atento para observar. “Vigia” é natural em português e adequado ao cenário da torre.
- source_word: עֹמֵד עַל הַמִּגְדָּל
  choice: estava de pé sobre a torre
  rationale: O particípio apresenta uma ação ou postura contínua como pano de fundo; “estava de pé” conserva esse valor durativo, e “torre” traduz o substantivo sem especificação adicional.
- source_word: בְּיִזְרְעֶאל
  choice: em Jezreel
  rationale: Forma portuguesa estabelecida do nome do lugar.
- source_word: שִׁפְעַת יֵהוּא
  choice: o grupo de Jeú
  rationale: שִׁפְעָה indica uma massa ou quantidade visível de pessoas. “Grupo” comunica isso sem determinar indevidamente seu tamanho ou sua organização militar.
- source_word: בְּבֹאוֹ
  choice: se aproximando
  rationale: A construção temporal descreve Jeú vindo em direção à cidade. Em português, “se aproximando” expressa naturalmente o movimento observado pelo vigia.
- source_word: שִׁפְעַת אֲנִי רֹאֶה
  choice: Vejo um grupo
  rationale: Mantém a repetição do mesmo substantivo usado na descrição anterior e reproduz a concisão do relato.
- source_word: קַח רַכָּב
  choice: Escolha um cavaleiro
  rationale: רַכָּב designa aqui um único homem montado enviado como mensageiro. “Escolha” expressa de modo idiomático a ordem de tomar alguém para essa tarefa.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: e mande-o ao encontro deles
  rationale: Conserva o sufixo plural massorético, que se refere ao grupo avistado, sem substituí-lo por uma referência singular a Jeú.
- source_word: וְיֹאמַר
  choice: Que ele pergunte
  rationale: No encadeamento após o imperativo, a forma verbal transmite uma ordem indireta. Como a fala seguinte é uma indagação, “pergunte” é a formulação natural em português.
- source_word: הֲשָׁלוֹם
  choice: Há paz?
  rationale: Preserva a concisão da pergunta hebraica e o motivo recorrente de שָׁלוֹם no contexto, sem decidir se a preocupação principal é bem-estar geral ou intenção pacífica.
