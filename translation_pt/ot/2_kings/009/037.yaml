  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ו/הית נִבְלַ֣ת אִיזֶ֗בֶל כְּ/דֹ֛מֶן עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה בְּ/חֵ֣לֶק יִזְרְעֶ֑אל אֲשֶׁ֥ר לֹֽא יֹאמְר֖וּ זֹ֥את אִיזָֽבֶל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: pt
  text: 'E o cadáver de Jezabel será como esterco na superfície do campo, no território de Jezreel[a], de modo que não dirão: “Esta é Jezabel”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no terreno de Jezreel”. O termo hebraico חֵלֶק pode designar uma área ou parcela específica de terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: E ... será
  rationale: O perfeito com a conjunção dá continuidade ao oráculo profético e, neste contexto, tem sentido futuro.
- source_word: נִבְלַת אִיזֶבֶל
  choice: o cadáver de Jezabel
  rationale: נְבֵלָה designa um corpo morto; “cadáver” é direto, digno e preserva a força sombria da imagem.
- source_word: כְּדֹמֶן
  choice: como esterco
  rationale: דֹּמֶן significa esterco ou excremento; a escolha mantém sem suavização a comparação vívida do hebraico.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: na superfície do campo
  rationale: Expressa de modo natural em português a imagem espacial literalmente formulada como “sobre a face do campo”.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: no território de Jezreel
  rationale: חֵלֶק pode indicar uma porção, área ou parcela de terra; “território” comunica a área geográfica sem restringi-la indevidamente, enquanto a alternativa mais estreita é preservada em nota.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: de modo que não dirão
  rationale: A oração relativa exprime o resultado da dispersão e desfiguração dos restos; a formulação mantém o plural e o futuro do hebraico.
- source_word: זֹאת אִיזָבֶל
  choice: Esta é Jezabel
  rationale: Reproduz diretamente a fórmula dêitica de identificação.
