translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A construção pouco comum “virou com as mãos” conserva a concretude e a ambiguidade do hebraico; a nota esclarece o provável cenário sem inseri-lo no texto principal.
