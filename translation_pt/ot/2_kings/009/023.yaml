base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/023.yaml
  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
translation:
  language: pt
  text: 'Então Jeorão deu meia-volta e fugiu[a], e disse a Acazias: “Traição[b], Acazias!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “virou suas mãos”. A expressão provavelmente se refere a manobrar a carruagem para dar meia-volta, mas o hebraico não menciona explicitamente nem as rédeas nem a carruagem.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Engano, Acazias!”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ יָדָיו
  choice: virou com as mãos
  rationale: Preserva a expressão concreta do hebraico, literalmente ligada a 'virar' e 'suas mãos', sem acrescentar explicitamente rédeas ou carro. No contexto, provavelmente descreve a manobra de fazer o carro dar meia-volta.
- source_word: וַיָּנֹס
  choice: fugiu
  rationale: Equivalente direto e natural para נוס neste contexto narrativo de fuga urgente.
- source_word: מִרְמָה
  choice: Traição
  rationale: A palavra pode indicar engano ou perfídia; como exclamação diante da ação hostil de Jeú, 'Traição!' transmite com naturalidade a acusação alarmada, sem a especificidade política de 'traição contra o rei'.
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: Acazias
  rationale: Adota a forma tradicional e amplamente reconhecida do nome em português, preservando sua repetição no vocativo final.
- source_word: וַיֹּאמֶר אֶל אֲחַזְיָהוּ ... אֲחַזְיָה
  choice: 'dizendo a Acazias: “Traição, Acazias!”'
  rationale: Mantém o discurso direto dirigido a Acazias e a repetição enfática do nome, que comunica urgência.
