base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: pt
  text: Então foram sepultá-la, mas não encontraram nada dela, a não ser o crânio, os pés e as palmas das mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não encontraram nela nada, a não ser o crânio, os pés e as palmas das mãos”. Nesse contexto, “nela” é uma forma idiomática de se referir ao que restava de seu corpo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Então foram
  rationale: O wayyiqtol de הלך dá sequência à narrativa; “Então foram” expressa naturalmente essa progressão.
- source_word: לְקָבְרָהּ
  choice: sepultá-la
  rationale: O infinitivo de קבר com sufixo feminino singular refere-se a Jezabel; “sepultá-la” é natural e mantém o registro digno.
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: mas não encontraram nada dela
  rationale: A conjunção tem valor adversativo no contexto. A expressão com בָהּ, literalmente “nela”, refere-se idiomaticamente ao que restava de seu corpo.
- source_word: כִּי אִם
  choice: a não ser
  rationale: A locução hebraica introduz uma exceção; “a não ser” é clara e corrente em português.
- source_word: הַגֻּלְגֹּלֶת
  choice: o crânio
  rationale: גֻּלְגֹּלֶת designa especificamente o crânio, não a cabeça inteira, preservando a contundência da cena.
- source_word: וְהָרַגְלַיִם
  choice: os pés
  rationale: O dual רַגְלַיִם tem aqui seu sentido anatômico direto de “pés”.
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: as palmas das mãos
  rationale: כַּפּוֹת especifica as palmas; a tradução conserva a precisão anatômica do hebraico.
