  text: וַ/יָּב֥וֹא יֵה֖וּא יִזְרְעֶ֑אלָ/ה וְ/אִיזֶ֣בֶל שָׁמְעָ֗ה וַ/תָּ֨שֶׂם בַּ/פּ֤וּךְ עֵינֶ֨י/הָ֙ וַ/תֵּ֣יטֶב אֶת רֹאשָׁ֔/הּ וַ/תַּשְׁקֵ֖ף בְּעַ֥ד הַ/חַלּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: pt
  text: Quando Jeú chegou a Jezreel, Jezabel ficou sabendo. Ela pintou os olhos com cosmético escuro[a], adornou a cabeça[b] e olhou para fora pela janela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “pôs cosmético escuro nos olhos”. O termo hebraico designa uma pintura para os olhos, tradicionalmente identificada com o antimônio.
    reason: lexical_alternative
  - marker: b
    text: Ou “arrumou o cabelo”; o hebraico diz literalmente “tornou bela a sua cabeça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... יִזְרְעֶאלָה
  choice: chegou a Jezreel
  rationale: O verbo בוא, acompanhado do ה direcional em יִזְרְעֶאלָה, indica a chegada de Jeú a Jezreel; a formulação é natural em português sem especificar além do texto se ele já entrou na cidade.
- source_word: שָׁמְעָה
  choice: ficou sabendo
  rationale: O objeto está implícito no hebraico e se refere à chegada de Jeú. A expressão portuguesa transmite de modo idiomático que Jezabel recebeu essa notícia.
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: pintou os olhos com cosmético escuro
  rationale: פּוּךְ designa um cosmético escuro aplicado aos olhos, tradicionalmente associado ao antimônio. A tradução comunica a prática de modo claro sem pressupor uma composição química específica.
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: adornou a cabeça
  rationale: A expressão significa literalmente que ela tornou a cabeça boa ou bela. A escolha preserva a amplitude do hebraico, que pode envolver arrumar o cabelo ou outros adornos, sem restringi-la indevidamente.
- source_word: וַתַּשְׁקֵף בְּעַד הַחַלּוֹן
  choice: olhou para fora pela janela
  rationale: O verbo descreve o ato de olhar para fora, frequentemente de uma posição elevada, e בְּעַד indica que o olhar se dá através da janela.
theological_decisions: []
