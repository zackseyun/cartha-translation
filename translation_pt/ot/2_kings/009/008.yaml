  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: pt
  text: Toda a casa de Acabe perecerá, e eliminarei da casa de Acabe todo homem[a], tanto o escravo como o livre[b], em Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “todo aquele que urina contra a parede”, expressão grosseira que significa “todo indivíduo do sexo masculino”.
    reason: lexical_alternative
  - marker: b
    text: O sentido exato da expressão hebraica é incerto. Literalmente, pode ser entendida como “o retido e o deixado livre”; outras interpretações incluem “o protegido e o abandonado”. Provavelmente, a dupla abrange homens de toda condição.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וְאָבַד
  choice: perecerá
  rationale: O perfeito qal com conjunção, dentro deste oráculo profético, tem sentido futuro. “Perecerá” mantém a ideia de juízo sem explicitar além do texto o agente da destruição.
- source_word: כָּל בֵּית אַחְאָב
  choice: toda a casa de Acabe
  rationale: “Casa” preserva o idioma bíblico que abrange família, linhagem e dinastia, especialmente relevante em contextos de juízo contra uma casa real.
- source_word: וְהִכְרַתִּי
  choice: eliminarei
  rationale: O hifil de כרת expressa a remoção completa de uma linhagem. “Eliminarei” comunica naturalmente em português a força judicial de “cortar”, sem produzir uma expressão artificial.
- source_word: לְאַחְאָב
  choice: da casa de Acabe
  rationale: O ל marca aqui a relação com Acabe. A explicitação de “casa” torna claro que o alvo é sua família ou linhagem, conforme a primeira oração.
- source_word: מַשְׁתִּין בְּקִיר
  choice: todo homem
  rationale: O idioma hebraico, literalmente grosseiro, designa os indivíduos do sexo masculino. A tradução clara aparece no texto, e a forma literal é registrada em nota.
- source_word: וְעָצוּר וְעָזוּב
  choice: tanto o escravo como o livre
  rationale: A dupla integra uma fórmula de extermínio total e parece abranger homens de qualquer condição ou dependência. Como o sentido exato dos termos é discutido, a alternativa mais literal é preservada em nota.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: 'A preposição é entendida em sentido locativo: o juízo alcançará a casa de Acabe dentro de Israel.'
theological_decisions:
- issue: Formula de juízo contra a dinastia de Acabe
  choice: Manter “casa de Acabe” e expressar o alvo como “todo homem”.
  alternative: Parafrasear toda a fórmula como “destruirei completamente a família de Acabe”.
  rationale: A redação escolhida conserva a imagem bíblica da “casa” real e a abrangência masculina da ameaça, sem suavizar o caráter total do juízo nem ampliar o objeto para além do que a fórmula hebraica declara.
- issue: Sentido da dupla וְעָצוּר וְעָזוּב
  choice: “tanto o escravo como o livre”, com nota sobre a incerteza
  alternative: “tanto o retido como o deixado livre” ou “o protegido e o abandonado”
  rationale: A expressão provavelmente funciona como um merismo que abrange todas as condições sociais ou todos os dependentes masculinos. Como sua identificação precisa é incerta, a tradução oferece o entendimento tradicional no texto e mantém alternativas transparentes na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “casa de Acabe” por seu valor dinástico; a expressão hebraica grosseira e a ambiguidade da dupla social são documentadas em notas.
