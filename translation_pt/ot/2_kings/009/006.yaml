base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: pt
  text: 'Então ele se levantou, entrou na casa, derramou o óleo sobre a cabeça dele e lhe disse: “Assim diz Yahweh, o Deus de Israel: Eu o ungi[a] como rei sobre o povo de Yahweh, sobre Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu o unjo como rei sobre o povo de Yahweh, sobre Israel.” Neste contexto de unção, o perfeito hebraico pode ser entendido como performativo.'
    reason: Leitura alternativa do valor verbal do perfeito hebraico na fórmula de unção.
lexical_decisions:
- source_word: וַיָּקָם
  choice: ele se levantou
  rationale: O wayyiqtol de קום dá continuidade à sequência narrativa; “se levantou” é natural e fiel ao movimento descrito.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: entrou na casa
  rationale: בוא com o ה direcional em בַּיִת indica movimento para dentro; “entrou na casa” expressa isso de modo direto em português.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: derramou o óleo sobre a cabeça dele
  rationale: יצק significa “derramar”; o artigo definido foi preservado, e “a cabeça dele” evita a possível ambiguidade de “sua cabeça”.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética de mensageiro em linguagem bíblica clara e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção hebraica e sua identificação pactual.
- source_word: מְשַׁחְתִּיךָ
  choice: Eu o ungi
  rationale: O perfeito hebraico pode indicar o ato acabado de realizar e, neste contexto ritual, também tem força declarativa; a alternativa performativa é registrada em nota.
- source_word: לְמֶלֶךְ
  choice: como rei
  rationale: A preposição לְ marca o papel ou resultado da unção; “como rei” é idiomático e claro em português.
- source_word: אֶל עַם יְהוָה
  choice: sobre o povo de Yahweh
  rationale: Neste contexto de nomeação régia, אֶל indica a esfera sobre a qual se exercerá a autoridade.
- source_word: אֶל יִשְׂרָאֵל
  choice: sobre Israel
  rationale: A repetição de “sobre” preserva o paralelismo e apresenta Israel como explicação do povo de Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem trocá-lo por um título.
- issue: Valor da declaração מְשַׁחְתִּיךָ
  choice: Eu o ungi
  alternative: Eu o unjo
  rationale: O perfeito combina naturalmente com a unção que acaba de ser realizada, enquanto o contexto permite uma leitura performativa; a nota conserva essa possibilidade sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “lhe disse” e “Eu o ungi” para manter solenidade sem arcaísmo; “a cabeça dele” evita ambiguidade referencial. A repetição de “sobre” conserva a estrutura enfática do hebraico.
