source:
  edition: WLC
  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: pt
  text: 'Quando Acazias, rei de Judá, viu isso, fugiu pelo caminho de Bete-Hagã[a]. Jeú o perseguiu e disse: “Atingam-no também na carruagem, na subida de Gur, junto a Ibleão!” Ele fugiu para Megido e morreu ali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bete-Hagã pode significar “casa do jardim”, mas aqui provavelmente é um nome de lugar; por isso, foi transliterado.
    reason: cultural_note
lexical_decisions:
- source_word: רָאָה
  choice: viu isso
  rationale: O verbo significa simplesmente “viu”; “isso” explicita de modo natural em português o acontecimento implícito, sem especificá-lo além do texto.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: pelo caminho de Bete-Hagã
  rationale: דֶּרֶךְ designa caminho ou estrada. בֵּית הַגָּן funciona aqui provavelmente como topônimo, por isso foi transliterado, e não traduzido literalmente.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: o perseguiu
  rationale: A combinação de רדף com אַחַר expressa perseguição; “o perseguiu” transmite o sentido com naturalidade em português atual.
- source_word: גַּם אֹתוֹ
  choice: também
  rationale: גַּם acrescenta Acazias ao alvo anterior; a colocação após o pronome em “Atingam-no também” preserva essa força aditiva de modo idiomático.
- source_word: הַכֻּהוּ
  choice: Atingam-no
  rationale: A forma imperativa plural de נכה pede que os homens de Jeú golpeiem Acazias. “Atingam-no” conserva a amplitude do verbo sem antecipar lexicalmente sua morte.
- source_word: אֶל הַמֶּרְכָּבָה
  choice: na carruagem
  rationale: Embora אֶל normalmente indique direção, neste contexto pode assinalar o âmbito ou alvo do golpe. “Na carruagem” apresenta a leitura contextual mais provável, mantendo a alternativa em nota.
- source_word: בְּמַעֲלֵה גוּר
  choice: na subida de Gur
  rationale: מַעֲלֶה designa uma subida ou trecho ascendente; a formulação preserva a referência topográfica.
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: junto a Ibleão
  rationale: A expressão situa Gur em relação a Ibleão. “Junto a” comunica proximidade sem impor precisão geográfica ausente do hebraico.
- source_word: וַיָּנָס מְגִדּוֹ
  choice: Ele fugiu para Megido
  rationale: O verbo significa “fugir”, e o topônimo sem preposição explícita é entendido naturalmente como destino.
- source_word: וַיָּמָת שָׁם
  choice: e morreu ali
  rationale: Tradução direta da sequência narrativa e de שָׁם, “ali/lá”.
theological_decisions:
- issue: Delimitação da fala de Jeú e evento elíptico
  choice: Manter “na subida de Gur, junto a Ibleão” dentro da ordem direta, sem acrescentar uma segunda oração afirmando explicitamente que os homens o atingiram.
  alternative: 'Encerrar a fala após “na carruagem” e acrescentar: “Então eles o atingiram na subida de Gur, junto a Ibleão.”'
  rationale: O texto hebraico contém um único verbo de golpe, no imperativo, e não repete um verbo narrativo depois da ordem. A redação escolhida segue mais de perto a sintaxe preservada, sem negar que o golpe tenha ocorrido, como a continuação deixa implícito.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, com formas onomásticas correntes em português. A ordem de Jeú foi formulada no plural, conforme a forma hebraica, e evitou-se inserir no corpo do versículo um segundo verbo de golpe que não aparece explicitamente no texto massorético.
