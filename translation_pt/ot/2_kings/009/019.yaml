    issue: “Dê a volta” pode significar contornar algo.
    rationale: O imperativo hebraico סֹב ordena que o mensageiro se vire/mude de direção para colocar-se atrás de Jeú. Em português, “dar a volta” tende a comunicar dar a volta em torno de um lugar ou objeto. “Dê meia-volta” expressa melhor o movimento requerido.
