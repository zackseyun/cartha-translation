base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: pt
  text: 'Então ele enviou um segundo cavaleiro. Este chegou até eles e disse: “Assim diz o rei: ‘Há paz?’” Mas Jeú respondeu: “O que você tem a ver com a paz? Dê meia-volta e fique atrás de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: um segundo cavaleiro
  rationale: A expressão significa literalmente “um cavaleiro de cavalo, segundo”. “Um segundo cavaleiro” é natural em português e preserva tanto a sequência quanto a função de mensageiro montado.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Assim diz o rei
  rationale: Preserva a fórmula formal de mensageiro real e seu tom solene.
- source_word: שָׁלוֹם
  choice: paz
  rationale: O termo pode indicar paz, segurança, bem-estar ou que tudo está bem. “Paz” mantém a repetição lexical entre a pergunta do rei e a resposta de Jeú.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Que você tem a ver com a paz?
  rationale: Reproduz de modo natural o idiomatismo hebraico e conserva a força confrontadora da resposta, sem eliminar a repetição de “paz”.
- source_word: סֹב אֶל אַחֲרָי
  choice: Dê a volta e fique atrás de mim
  rationale: Reflete de perto a ordem literal para virar-se e colocar-se atrás de Jeú, sem explicitar além do texto que o cavaleiro deveria “segui-lo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe narrativa foi dividida em duas frases para maior naturalidade. Conservou-se “paz” nas duas ocorrências para preservar o jogo lexical hebraico e a tensão do diálogo.
