  text: וּ/בָ֖אתָ שָׁ֑מָּ/ה וּ/רְאֵֽה שָׁ֠ם יֵה֨וּא בֶן יְהוֹשָׁפָ֜ט בֶּן נִמְשִׁ֗י וּ/בָ֨אתָ֙ וַ/הֲקֵֽמֹת/וֹ֙ מִ/תּ֣וֹך אֶחָ֔י/ו וְ/הֵבֵיאתָ֥ אֹת֖/וֹ חֶ֥דֶר בְּ/חָֽדֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: pt
  text: Quando você chegar lá, procure Jeú, filho de Josafá, filho de Ninsi. Entre, faça-o levantar-se do meio de seus irmãos e leve-o para uma sala interna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “uma sala dentro de outra sala”, isto é, um aposento interno e reservado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: Quando você chegar lá
  rationale: בוא pode significar vir, ir ou chegar conforme o ponto de vista; aqui, “chegar lá” expressa naturalmente o movimento concluído antes da ordem seguinte.
- source_word: וּרְאֵה שָׁם
  choice: procure
  rationale: ראה significa literalmente “ver”, mas, nesta instrução seguida pelo nome da pessoa, comunica a ação de localizá-la ou identificá-la.
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: Jeú, filho de Josafá, filho de Ninsi
  rationale: Os nomes seguem formas portuguesas bíblicas amplamente reconhecíveis, e a sequência de בן é preservada como “filho de”.
- source_word: וּבָאתָ
  choice: Entre
  rationale: A segunda ocorrência de בוא indica o movimento para dentro do lugar onde Jeú estava com os demais; “Entre” é direto e natural.
- source_word: וַהֲקֵמֹתוֹ
  choice: faça-o levantar-se
  rationale: O hifil de קום significa causar que alguém se levante ou fique de pé; a formulação mantém esse valor causativo sem especificar além do texto.
- source_word: מִתּוֹךְ אֶחָיו
  choice: do meio de seus irmãos
  rationale: אחים significa literalmente “irmãos”; embora possa designar companheiros ou colegas nesse contexto militar, a tradução preserva a expressão concreta do hebraico.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: e leve-o
  rationale: O hifil de בוא pode significar trazer ou levar. Do ponto de vista do mensageiro que conduz Jeú a outro recinto, “leve-o” é natural em português.
- source_word: חֶדֶר בְּחָדֶר
  choice: para uma sala interna
  rationale: A expressão duplicada indica um recinto mais interior e reservado; “sala interna” comunica o sentido com clareza, enquanto a forma literal é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a sequência rápida de ordens do hebraico e conserva “irmãos” em vez de resolver a possível extensão contextual como “companheiros”.
