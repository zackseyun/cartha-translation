  text: וַ/יֵּ֧לֶךְ הַ/נַּ֛עַר הַ/נַּ֥עַר הַ/נָּבִ֖יא רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/004.yaml
  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: pt
  text: Então o jovem, o jovem profeta[a], foi a Ramote-Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete “o jovem”: “o jovem, o jovem profeta”.'
    reason: A nota explica a repetição enfática e incomum preservada no texto.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ... foi
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר designa aqui um jovem enviado por Eliseu; “o jovem” é claro e não acrescenta uma função de servo que o termo, por si só, não exige.
- source_word: הַנַּעַר הַנָּבִיא
  choice: o jovem profeta
  rationale: A expressão é mais naturalmente entendida em aposição, identificando o jovem como profeta. A tradução mantém também a repetição incomum do hebraico, sem transformá-la em uma relação possessiva (“servo do profeta”).
- source_word: רָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Forma portuguesa tradicional e transparente do topônimo composto hebraico.
theological_decisions:
- issue: Identidade do jovem como profeta ou servo de um profeta
  choice: o jovem profeta
  alternative: o servo do profeta
  rationale: O hebraico traz os dois substantivos com artigo definido e favorece a aposição (“o jovem, o profeta”), não uma construção possessiva. A escolha evita inserir uma relação de serviço que não está explicitada nesta frase.
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. Preserva-se deliberadamente a repetição do hebraico. “Ramote-Gileade” segue a forma toponímica corrente em português.
