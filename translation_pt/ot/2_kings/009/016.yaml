base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: pt
  text: Então Jeú montou e foi a Jezreel, pois Jorão estava deitado ali, e Acazias, rei de Judá, tinha descido para ver Jorão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, para visitá-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: subiu no carro
  rationale: O verbo רכב pode indicar montar ou andar montado. O contexto imediato envolve a condução de carros, por isso a explicitação natural «subiu no carro» preserva a ação distinta do verbo seguinte sem confundi-la com a viagem.
- source_word: וַיֵּלֶךְ יִזְרְעֶאלָה
  choice: foi a Jezreel
  rationale: הלך é o verbo comum para «ir», e o ה direcional em יִזְרְעֶאלָה indica movimento em direção a Jezreel.
- source_word: כִּי
  choice: pois
  rationale: A conjunção introduz a razão pela qual Jeú foi a Jezreel; «pois» expressa com naturalidade essa relação causal.
- source_word: שֹׁכֵב שָׁמָּה
  choice: estava deitado ali
  rationale: Mantém o sentido concreto do particípio שׁכב e do advérbio locativo, sem acrescentar que Jorão estivesse acamado ou convalescendo, embora o contexto mais amplo o indique.
- source_word: יָרַד
  choice: tinha descido
  rationale: O mais-que-perfeito marca naturalmente em português a ação anterior à partida de Jeú, enquanto «descido» preserva a possível nuance topográfica de ירד.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: para ver Jorão
  rationale: Traduz diretamente o infinitivo de ראה. No contexto, «ver» significa visitar Jorão, mas o texto principal conserva a expressão hebraica e a nota esclarece o sentido pragmático.
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: Jeú / Jorão / Acazias / Jezreel / Judá
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
