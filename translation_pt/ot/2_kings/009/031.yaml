  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יֵה֖וּא בָּ֣א בַ/שָּׁ֑עַר וַ/תֹּ֣אמֶר הֲ/שָׁל֔וֹם זִמְרִ֖י הֹרֵ֥ג אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: pt
  text: 'Quando Jeú entrou pelo portão, ela perguntou: “Tudo em paz,[a] Zinri,[b] assassino do seu senhor?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Está tudo bem?”'
    reason: lexical_alternative
  - marker: b
    text: Jezabel chama Jeú de “Zinri” como provocação, comparando-o a Zinri, que matou seu senhor e tomou o trono; veja 1 Reis 16:9–20.
    reason: cross_reference
  - marker: c
    text: 'Literalmente: “aquele que mata o seu senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: entrou pelo portão
  rationale: O verbo בּוֹא pode significar “vir” ou “entrar”; com בַשָּׁעַר, a expressão descreve naturalmente Jeú entrando pela porta da cidade. “Portão” comunica melhor em português atual uma entrada urbana ampla do que “porta”.
- source_word: וַתֹּאמֶר
  choice: ela perguntou
  rationale: A forma verbal feminina retoma Jezabel no contexto. Como a fala que segue é interrogativa, “perguntou” é mais natural em português do que o literal “disse”, sem alterar o sentido.
- source_word: הֲשָׁלוֹם
  choice: Tudo em paz
  rationale: A fórmula curta pergunta por paz, segurança ou bem-estar. “Tudo em paz?” conserva a concisão e a ironia da fala, enquanto uma nota registra a alternativa semântica.
- source_word: זִמְרִי
  choice: Zinri
  rationale: Emprega-se a forma tradicional portuguesa do nome. Jezabel não confunde a identidade de Jeú; usa o nome como comparação insultuosa com o usurpador de 1 Reis 16.
- source_word: הֹרֵג
  choice: assassino
  rationale: O particípio significa literalmente “aquele que mata”. Neste aposto acusatório, “assassino” transmite de modo natural a força hostil da provocação.
- source_word: אֲדֹנָיו
  choice: do seu senhor
  rationale: אדון designa aqui um superior humano, o rei. “Senhor” mantém a relação de autoridade e o pronome “seu” preserva a formulação compacta do hebraico.
theological_decisions:
- issue: Sentido do tratamento “Zinri, assassino do seu senhor”
  choice: Entender “Zinri” como uma provocação sarcástica que compara Jeú ao usurpador anterior.
  alternative: Ler “Zinri” apenas como tratamento direto, sem explicitar que se trata de uma alusão histórica.
  rationale: No contexto, Jezabel sabe que está falando com Jeú. O paralelo com Zinri, que matou seu senhor e tomou o trono (1 Reis 16:9–20), explica a acusação sem inserir essa interpretação no corpo do versículo.
- issue: Amplitude semântica de הֲשָׁלוֹם
  choice: Traduzir por “Tudo em paz?”, preservando a referência explícita à paz.
  alternative: “Está tudo bem?” ou “Você vem em paz?”
  rationale: A expressão hebraica pode perguntar tanto por paz quanto pelo bem-estar geral. A tradução principal mantém a imagem lexical, e a nota reconhece a alternativa mais idiomática.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes bíblicos usuais no Brasil. A pergunta foi mantida curta e incisiva para reproduzir o tom provocador de Jezabel; as ambiguidades de שָׁלוֹם e a força literal do particípio foram preservadas em notas.
