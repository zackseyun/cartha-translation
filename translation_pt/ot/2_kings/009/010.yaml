  text: וְ/אֶת אִיזֶ֜בֶל יֹאכְל֧וּ הַ/כְּלָבִ֛ים בְּ/חֵ֥לֶק יִזְרְעֶ֖אל וְ/אֵ֣ין קֹבֵ֑ר וַ/יִּפְתַּ֥ח הַ/דֶּ֖לֶת וַ/יָּנֹֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: pt
  text: E os cães comerão Jezabel no terreno de Jezreel[a], e não haverá quem a sepulte.” Então ele abriu a porta e fugiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na porção de terra de Jezreel”. O termo hebraico חֵלֶק refere-se a uma extensão ou parcela de terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: comerão
  rationale: Mantém o sentido futuro simples de אכל no anúncio profético, sem acrescentar a intensidade interpretativa de “devorarão”.
- source_word: הַכְּלָבִים
  choice: os cães
  rationale: Preserva o artigo definido hebraico e a imagem concreta do juízo anunciado.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: no terreno de Jezreel
  rationale: חֵלֶק designa uma porção ou parcela de terra. “Terreno” conserva essa referência fundiária sem definir indevidamente seu tamanho ou sua função.
- source_word: וְאֵין קֹבֵר
  choice: e não haverá quem a sepulte
  rationale: Expressa naturalmente em português a construção hebraica, literalmente “não há quem sepulte”, explicitando o objeto feminino indicado pelo contexto.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: Então ele abriu a porta
  rationale: “Então” representa com fluidez o avanço sequencial da narrativa marcado pelo wayyiqtol.
- source_word: וַיָּנֹס
  choice: e fugiu
  rationale: Preserva a concisão e a urgência de נוס, sem sugerir necessariamente que ele tenha conseguido escapar de algum perseguidor.
- source_word: אִיזֶבֶל
  choice: Jezabel
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
