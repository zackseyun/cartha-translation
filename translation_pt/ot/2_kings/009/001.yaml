base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: pt
  text: 'Então o profeta Eliseu chamou um dos filhos dos profetas[a] e lhe disse: “Prenda a roupa à cintura[b], pegue este frasco de azeite na mão e vá a Ramote-Gileade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos dos profetas” designa membros de um grupo ou comunidade de profetas, não necessariamente filhos biológicos de profetas.
    reason: cultural_note
  - marker: b
    text: Literalmente, “cinja os seus lombos”, expressão que descreve prender a veste comprida à cintura para se preparar para agir ou viajar com rapidez.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: Então o profeta Eliseu
  rationale: A conjunção faz avançar a narrativa; “Então” expressa essa sequência com naturalidade. Em português, “o profeta Eliseu” é uma ordem idiomática e preserva o título definido.
- source_word: קָרָא לְאַחַד מִבְּנֵי הַנְּבִיאִים
  choice: chamou um dos filhos dos profetas
  rationale: Mantém o sentido básico de קרא e conserva no texto a expressão hebraica tradicional, esclarecida em nota para evitar uma leitura estritamente biológica.
- source_word: וַיֹּאמֶר לוֹ
  choice: e lhe disse
  rationale: Forma portuguesa direta e natural para a introdução narrativa da fala.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Prenda a roupa à cintura
  rationale: Comunica a ação concreta pressuposta pelo idioma hebraico — ajustar a veste longa para estar pronto a viajar ou agir — sem recorrer à expressão portuguesa arcaica “cingir os lombos”.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: este frasco de azeite
  rationale: פַּךְ indica um recipiente pequeno, e “frasco” é preciso e corrente. Neste contexto de unção, “azeite” é a designação portuguesa natural para o óleo de oliva.
- source_word: בְּיָדֶךָ
  choice: leve-o na mão
  rationale: Preserva a imagem concreta do hebraico e explicita naturalmente em português que o frasco deve ser levado na mão.
- source_word: וְלֵךְ רָמֹת גִּלְעָד
  choice: depois vá a Ramote-Gileade
  rationale: “Depois” articula com clareza a sequência dos imperativos. “Ramote-Gileade” é uma forma portuguesa reconhecível do topônimo.
