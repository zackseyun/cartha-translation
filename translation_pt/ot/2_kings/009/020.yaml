  register: Português moderno, digno e acessível, com fluência brasileira e compreensão internacional. A fórmula hebraica לֵאמֹר não foi reproduzida por um “dizendo” redundante; os dois-pontos introduzem a fala de forma natural. “Conduzir” mantém aberta a referência contextual à condução do carro sem inserir explicitamente “carro” no texto.
