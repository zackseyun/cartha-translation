base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: pt
  text: 'Então o sentinela informou: “Ele chegou até eles, mas não voltou. E o modo de conduzir é como o de Jeú, filho de Ninsi, pois ele conduz como um louco[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele conduz de modo alucinado” ou “ele conduz de modo frenético”. O hebraico descreve uma maneira de conduzir descontrolada e temerária.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: informou
  rationale: No contexto de vigilância militar, expressa naturalmente a comunicação formal feita pelo sentinela.
- source_word: הַצֹּפֶה
  choice: o sentinela
  rationale: Designa a pessoa postada para observar movimentos à distância; “sentinela” é corrente e adequado ao cenário régio-militar.
- source_word: בָּא עַד אֲלֵיהֶם
  choice: Ele chegou até eles
  rationale: Reproduz a ideia de alcançar o grupo, sem especificar além do que o hebraico afirma.
- source_word: וְלֹא שָׁב
  choice: mas não voltou
  rationale: Mantém o contraste e o sentido simples de שוב, com resultado ainda relevante no momento do relato.
- source_word: הַמִּנְהָג כְּמִנְהַג
  choice: o modo de conduzir é como o de
  rationale: Preserva a comparação do estilo de condução, evitando em português a repetição pouco natural de “condução”.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Jeú, filho de Ninsi
  rationale: Emprega as formas portuguesas tradicionais dos nomes e traduz o patronímico de modo claro.
- source_word: בְשִׁגָּעוֹן יִנְהָג
  choice: ele conduz como um louco
  rationale: Comunica a maneira frenética ou descontrolada indicada pelo substantivo שִׁגָּעוֹן em uso adverbial, preservando sua imagem forte.
theological_decisions: []
