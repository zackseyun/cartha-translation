base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/032.yaml
  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: pt
  text: 'Ele ergueu o rosto para a janela e disse: “Quem está comigo? Quem?” Então dois ou três eunucos[a] olharam para baixo, na direção dele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oficiais da corte”; o termo hebraico pode ter ambos os sentidos, embora, neste contexto palaciano, “eunucos” seja o mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: ergueu o rosto
  rationale: Preserva a imagem hebraica de levantar o rosto para dirigir o olhar para cima e permanece natural em português.
- source_word: הַחַלּוֹן
  choice: a janela
  rationale: Equivalente arquitetônico direto e adequado à cena no palácio.
- source_word: מִי אִתִּי מִי
  choice: Quem está comigo? Quem?
  rationale: Traduz diretamente אִתִּי e conserva a repetição enfática, sem explicitar interpretativamente 'do meu lado'.
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: olharam para baixo, na direção dele
  rationale: Expressa o olhar a partir de um ponto elevado e traduz אֵלָיו sem sugerir necessariamente que os homens se inclinaram para fora.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: dois ou três
  rationale: Forma portuguesa natural para o par numérico hebraico que indica uma pequena quantidade aproximada.
- source_word: סָרִיסִים
  choice: eunucos
  rationale: Em um ambiente palaciano, o sentido específico de eunucos é o mais provável, embora o termo também possa designar oficiais da corte; essa alternativa é mantida em nota.
