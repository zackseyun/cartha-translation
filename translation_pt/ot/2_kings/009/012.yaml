  text: וַ/יֹּאמְר֣וּ שֶׁ֔קֶר הַגֶּד נָ֖א לָ֑/נוּ וַ/יֹּ֗אמֶר כָּ/זֹ֤את וְ/כָ/זֹאת֙ אָמַ֤ר אֵלַ/י֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: pt
  text: 'Eles disseram: “Mentira! Conte-nos, por favor”. Então ele respondeu: “Ele me disse isto e aquilo[a]: ‘Assim diz Yahweh: Eu o ungi rei sobre Israel’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “isto e aquilo”, expressão que indica um resumo indefinido ou parcial; também pode ser traduzida por “tais e tais coisas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Mentira!
  rationale: O substantivo significa “mentira, falsidade”. Como réplica abrupta, “Mentira!” preserva de modo natural a acusação de que Jeú está ocultando a mensagem.
- source_word: הַגֶּד נָא לָנוּ
  choice: Conte-nos, por favor
  rationale: O imperativo singular dirige-se a Jeú; נָא acrescenta cortesia ou insistência. A formulação é corrente e mantém a força do pedido.
- source_word: כָּזֹאת וְכָזֹאת
  choice: isto e aquilo
  rationale: A expressão idiomática apresenta um resumo indefinido ou parcial do que foi dito, não necessariamente uma citação palavra por palavra.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a cadência da fórmula profética de mensageiro e verte diretamente o nome divino.
- source_word: מְשַׁחְתִּיךָ
  choice: Eu o ungi
  rationale: O perfeito descreve a ação concluída de ungir e comissionar Jeú; “ungir” conserva seu sentido régio e teológico.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: rei sobre Israel
  rationale: A preposição לְ marca a nomeação ao cargo, enquanto אֶל, neste contexto régio, indica o âmbito do governo; a expressão portuguesa comunica isso com clareza.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Mentira!” conserva a brusquidão do diálogo; a fórmula profética permanece deliberadamente solene.
