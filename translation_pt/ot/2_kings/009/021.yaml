base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: pt
  text: 'Então Jeorão ordenou: “Atrele!” E ele atrelou o seu carro.[a] Jeorão, rei de Israel, e Acazias, rei de Judá, saíram, cada um no seu carro, ao encontro de Jeú. Eles o encontraram na parcela de terra de Nabote, o jezreelita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “e ele atrelou o seu carro”; pelo contexto, é provável que a ordem tenha sido cumprida por um servo ou por servos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: Atrelem!
  rationale: No contexto de carros, o imperativo de אסר ordena que se atrelem os animais ao carro. O plural indeterminado é natural em português para uma ordem dirigida aos servos, sem alterar o sentido prático da forma hebraica singular.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: E atrelaram o seu carro
  rationale: Embora o verbo hebraico esteja formalmente na terceira pessoa masculina singular, o contexto indica o cumprimento da ordem por um servo ou por servos. A construção com sujeito indeterminado soa natural em português; a nota preserva a forma literal.
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: cada um no seu carro
  rationale: אִישׁ tem valor distributivo aqui e indica que os dois reis saíram em carros separados.
- source_word: לִקְרַאת יֵהוּא
  choice: ao encontro de Jeú
  rationale: A expressão indica movimento na direção de alguém para encontrá-lo; esta formulação é clara e idiomática em português.
- source_word: וַיִּמְצָאֻהוּ
  choice: Eles o encontraram
  rationale: מצא pode significar encontrar ou deparar-se com alguém. 'Encontraram' preserva a formulação simples da narrativa.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: no terreno de Nabote
  rationale: חֶלְקָה designa uma parcela ou propriedade de terra. 'Terreno' é natural e mantém a dimensão fundiária relevante à história de Nabote.
- source_word: הַיִּזְרְעֵאלִי
  choice: o jezreelita
  rationale: O gentílico identifica Nabote como natural ou habitante de Jezreel e mantém a designação usada na narrativa anterior.
