base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: pt
  text: 'Pegue então o frasco de óleo, derrame-o sobre a cabeça dele e diga: “Assim diz Yahweh: Eu ungi você como rei sobre Israel[a].” Em seguida, abra a porta e fuja; não espere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “para Israel”; nesta fórmula de nomeação real, o sentido é “sobre Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: frasco de óleo
  rationale: פַךְ designa um recipiente pequeno para líquidos; “frasco” é natural e específico em português. הַשֶּׁמֶן diz apenas “o óleo”, sem explicitar que seja de oliva.
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: derrame-o sobre a cabeça dele
  rationale: יצק com עַל expressa derramar sobre alguma coisa. O pronome retoma naturalmente o óleo.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética solene e representa o nome divino יְהוָה por “Yahweh”, em vez de substituí-lo por um título.
- source_word: מְשַׁחְתִּיךָ
  choice: Eu ungi você
  rationale: O perfeito hebraico apresenta a ação como realizada; no contexto, a declaração interpreta e efetiva ritualmente a unção acabada de ser feita.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: rei sobre Israel
  rationale: לְמֶלֶךְ indica nomeação ao cargo de rei. Embora אֶל signifique formalmente “a/para”, nesta fórmula régia a relação pretendida é de governo sobre Israel.
- source_word: וְנַסְתָּה וְלֹא תְחַכֶּה
  choice: e fuja; não espere
  rationale: נוס transmite fuga urgente, enquanto חכה significa esperar ou permanecer. A formulação direta conserva a urgência das instruções.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração amplamente aceita, sem substituí-lo por um título.
- issue: Valor performativo de מְשַׁחְתִּיךָ
  choice: Eu ungi você
  alternative: Eu estou ungindo você; Eu o constituí
  rationale: A tradução mantém o verbo específico “ungir” e o aspecto de ação realizada, sem ampliar a fórmula para uma interpretação institucional não expressa diretamente.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construções naturais no Brasil. “Assim diz” conserva o tom formal da fórmula profética; “fuja; não espere” mantém a concisão e a urgência do hebraico.
