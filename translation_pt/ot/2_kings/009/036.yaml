base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: pt
  text: 'Então eles voltaram e lhe contaram, e ele disse: “Esta é a palavra de Yahweh, que Yahweh falou por meio de seu servo Elias, o tisbita: ‘Na região de Jezreel[a], os cães comerão a carne de Jezabel.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na parcela de Jezreel” ou “na porção de Jezreel”; o termo hebraico pode designar uma extensão ou parcela de terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: Então eles voltaram e lhe contaram
  rationale: Reproduz a sequência narrativa dos verbos hebraicos de forma clara e natural em português.
- source_word: דְּבַר יְהוָה הוּא
  choice: Esta é a palavra de Yahweh
  rationale: Mantém a ênfase da oração nominal hebraica e apresenta הוּא com valor demonstrativo natural no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד עַבְדּוֹ
  choice: pela mão de seu servo
  rationale: Preserva o idioma hebraico de mediação ou agência profética sem prejudicar a compreensão em português.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: Elias, o tisbita
  rationale: Emprega as formas tradicionais e inteligíveis dos nomes em português.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: na região de Jezreel
  rationale: חֵלֶק pode indicar uma porção, parcela ou extensão de terra; “região” comunica o sentido geográfico sem restringi-lo indevidamente a um pequeno terreno.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: os cães comerão
  rationale: Verte diretamente a forma verbal e conserva a formulação crua da profecia.
- source_word: בְּשַׂר אִיזָבֶל
  choice: a carne de Jezabel
  rationale: “Carne” corresponde especificamente a בָּשָׂר e preserva a concretude severa do juízo anunciado.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O marcador da nota foi colocado após “Jezreel”, expressão à qual a alternativa lexical realmente se refere.
