revisions:
- from: 'Então eles voltaram e lhe contaram. Ele disse: “Esta é a palavra de Yahweh, que ele falou pela mão de seu servo Elias, o tisbita: ‘Na região de Jezreel[a], os cães comerão a carne de Jezabel’”.'
  to: 'Então eles voltaram e lhe contaram, e ele disse: “Esta é a palavra de Yahweh, que Yahweh falou por meio de seu servo Elias, o tisbita: ‘Na região de Jezreel[a], os cães comerão a carne de Jezabel.’”'
  rationale: A revisão explicita Yahweh como sujeito da fala profética e substitui um calque potencialmente pesado por uma formulação portuguesa natural. Conserva-se a força concreta de “os cães comerão a carne de Jezabel”, a equivalência geográfica prudente de “região” para חֵלֶק e a nota lexical corretamente ancorada.
