    issue: Pontuação pouco natural das fórmulas de declaração בתוך da fala divina.
    rationale: Em português, «..., declara Yahweh, ...» integra naturalmente a fórmula à citação. A construção com travessões seguida de vírgula — «— declara Yahweh —, “e...» — é tipograficamente e sintaticamente pesada.
  - severity: low
    issue: «Portanto» é uma explicitação dispensável em «Agora, portanto».
    rationale: וְעַתָּה significa «e/agora» e introduz a ordem subsequente. «Agora» preserva a transição sem reforçar desnecessariamente uma relação lógica.
