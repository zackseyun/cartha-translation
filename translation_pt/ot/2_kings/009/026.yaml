source:
  edition: WLC
  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: pt
  text: “Certamente vi ontem o sangue de Nabote e o sangue de seus filhos”, declara Yahweh, “e lhe retribuirei neste terreno”, declara Yahweh. “Agora, levante-o e jogue-o no terreno, conforme a palavra de Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם לֹא
  choice: Certamente
  rationale: A expressão funciona aqui como uma afirmação enfática, semelhante a um juramento, e não como uma condição literal. “Certamente” comunica essa força com naturalidade em português.
- source_word: דְּמֵי
  choice: o sangue
  rationale: O plural hebraico “sangues” é idiomático e se refere ao sangue derramado ou à culpa por morte violenta. O singular é a forma natural em português.
- source_word: נָבוֹת
  choice: Nabote
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בָנָיו
  choice: seus filhos
  rationale: O hebraico especifica os filhos do sexo masculino; a tradução mantém essa referência em vez de generalizá-la.
- source_word: רָאִיתִי
  choice: vi
  rationale: O perfeito qal na primeira pessoa, acompanhado de “ontem”, é expresso naturalmente pelo pretérito perfeito em português.
- source_word: אֶמֶשׁ
  choice: ontem
  rationale: O termo pode indicar o dia ou a noite anterior; “ontem” é a opção usual e menos interpretativa neste contexto.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A formulação conserva o peso da fórmula profética e apresenta diretamente o nome divino.
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: e lhe retribuirei
  rationale: O piel de שלם comunica retribuição judicial. “Retribuirei” preserva esse sentido sem acrescentar explicitamente um objeto ausente no hebraico.
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: neste terreno
  rationale: חֶלְקָה designa uma parcela de terra. “Terreno” é preciso, corrente e adequado ao contexto da propriedade de Nabote.
- source_word: וְעַתָּה
  choice: Agora, portanto
  rationale: A expressão introduz a ordem de Jeú como consequência da declaração divina anterior.
- source_word: שָׂא
  choice: levante-o
  rationale: O imperativo de נשׂא significa levantar ou carregar. “Levante-o” mantém a imagem concreta do hebraico.
- source_word: הַשְׁלִכֵהוּ
  choice: jogue-o
  rationale: O imperativo com sufixo pronominal ordena que ele seja lançado. “Jogue-o” é direto e natural em português.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: A tradução preserva a referência explícita à palavra anteriormente pronunciada por Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Especificidade de בָנָיו no contexto judicial
  choice: seus filhos
  alternative: seus descendentes; suas crianças
  rationale: O hebraico diz especificamente “seus filhos”; a tradução mantém essa especificidade e não amplia o referente.
- issue: Caráter judicial de וְשִׁלַּמְתִּי לְךָ
  choice: e lhe retribuirei
  alternative: e farei você pagar; e lhe pagarei de volta
  rationale: “Retribuirei” mantém a ideia de resposta judicial divina sem tornar explícito além do texto o conteúdo da retribuição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação distingue a citação divina das fórmulas narrativas, e a repetição de “declara Yahweh” foi preservada por sua função solene. A tradução evita tanto o literalismo obscuro de “se não” quanto uma paráfrase que eliminaria a força enfática do idioma hebraico.
