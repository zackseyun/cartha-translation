reference: 2 Kings 9:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתְקַשֵּׁ֗ר יֵה֛וּא בֶּן יְהוֹשָׁפָ֥ט בֶּן נִמְשִׁ֖י אֶל יוֹרָ֑ם וְ/יוֹרָם֩ הָיָ֨ה שֹׁמֵ֜ר בְּ/רָמֹ֣ת גִּלְעָ֗ד ה֚וּא וְ/כָל יִשְׂרָאֵ֔ל מִ/פְּנֵ֥י חֲזָאֵ֖ל מֶֽלֶךְ אֲרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: pt
  text: Assim, Jeú, filho de Josafá e neto de Ninsi, conspirou contra Jorão. Jorão estava defendendo Ramote-Gileade, junto com todo o Israel[a], por causa de Hazael, rei de Arã[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o reino ou as forças de Israel; literalmente, “todo o Israel”.
    reason: cultural_note
  - marker: b
    text: Tradicionalmente, “Síria”; em hebraico, “Arã”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: conspirou contra
  rationale: O hitpael de קשר, neste contexto político, indica a formação de uma conspiração ou revolta; a expressão é natural em português e preserva o sentido hostil.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: filho de Josafá e neto de Ninsi
  rationale: A sequência hebraica identifica pai e avô. Em português, “filho de ... e neto de ...” comunica a genealogia com clareza e evita a possível leitura de que Jeú fosse filho de ambos.
- source_word: אֶל יוֹרָם
  choice: contra Jorão
  rationale: Com o verbo קשר, אֶל assinala o alvo da conspiração; “contra” explicita adequadamente essa relação adversativa.
- source_word: הָיָה שֹׁמֵר
  choice: estava defendendo
  rationale: A construção com היה e particípio apresenta uma ação passada em andamento. No cenário militar de Ramote-Gileade, “defendendo” expressa de modo claro o campo semântico de guardar, vigiar ou proteger.
- source_word: בְּרָמֹת גִּלְעָד
  choice: Ramote-Gileade
  rationale: Forma toponímica tradicional e inteligível em português, correspondente ao nome hebraico.
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: junto com todo o Israel
  rationale: Preserva a designação nacional explícita do hebraico, sem restringi-la no texto principal ao exército, embora o contexto seja militar.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Introduz a ameaça de Hazael como motivo da defesa; mantém a amplitude da expressão sem decidir entre oposição direta e temor.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Traduz o termo etnogeográfico hebraico אֲרָם diretamente, em vez do nome tradicional posterior “Síria”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A genealogia foi expressa idiomaticamente como “filho ... e neto”; o contexto militar foi tornado natural sem eliminar a designação literal “todo o Israel”.
