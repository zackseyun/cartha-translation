  yaml_path: translation/ot/2_kings/009/033.yaml
  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: pt
  text: 'E ele disse: “Joguem-na para baixo!” Então eles a jogaram para baixo, e parte do sangue dela respingou na parede e nos cavalos[a]; e ele a pisoteou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o sangue dela respingou na parede e nos cavalos”. O hebraico diz literalmente: “e respingou do sangue dela sobre a parede e sobre os cavalos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו
  choice: Joguem-na para baixo!
  rationale: O imperativo plural ordena que os servos façam Jezabel cair da janela. A formulação é natural, direta e mantém a violência da ordem.
- source_word: וישמטוה
  choice: Então eles a jogaram para baixo
  rationale: Repete em português o mesmo verbo da ordem, preservando a ligação lexical e mostrando o cumprimento imediato.
- source_word: ויז מדמה
  choice: parte do sangue dela respingou
  rationale: O verbo descreve sangue que salpica ou respinga, e a construção com מן tem sentido partitivo neste contexto.
- source_word: אל הקיר ואל הסוסים
  choice: na parede e nos cavalos
  rationale: A preposição indica as superfícies atingidas pelo sangue; a tradução é direta e idiomática.
- source_word: וירמסנה
  choice: e ele a pisoteou
  rationale: רמס significa pisotear ou calcar. O verbo hebraico está no singular masculino e aponta para Jeú como sujeito gramatical, embora os cavalos mencionados indiquem provavelmente o meio da ação.
theological_decisions:
- issue: Sujeito de וירמסנה
  choice: ele a pisoteou
  alternative: os cavalos a pisotearam / passaram por cima dela
  rationale: O hebraico emprega um verbo singular masculino, retomando naturalmente Jeú; tornar 'os cavalos' o sujeito apagaria essa característica gramatical e resolveria de modo indevido como a ação foi executada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “jogaram para baixo” preserva deliberadamente a repetição do verbo hebraico. “Pisoteou” mantém a brutalidade e o sujeito singular do original.
