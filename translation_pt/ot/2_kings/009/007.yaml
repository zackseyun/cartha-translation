  text: וְ/הִ֨כִּיתָ֔ה אֶת בֵּ֥ית אַחְאָ֖ב אֲדֹנֶ֑י/ךָ וְ/נִקַּמְתִּ֞י דְּמֵ֣י עֲבָדַ֣/י הַ/נְּבִיאִ֗ים וּ/דְמֵ֛י כָּל עַבְדֵ֥י יְהוָ֖ה מִ/יַּ֥ד אִיזָֽבֶל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: pt
  text: Você destruirá a casa de Acabe, seu senhor, e eu vingarei o sangue dos meus servos, os profetas, e o sangue de todos os servos de Yahweh da mão de Jezabel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “da mão de Jezabel”, expressão que indica que Jezabel é responsável por esse sangue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: Você eliminará
  rationale: Neste contexto de juízo contra uma linhagem real, נכה indica um golpe decisivo e mortal. “Eliminará” comunica em português atual a destruição pretendida, sem o arcaísmo de “ferirás”.
- source_word: בֵּית אַחְאָב
  choice: a casa de Acabe
  rationale: “Casa” preserva o conhecido uso bíblico de בַּיִת para a família, o grupo doméstico e a linhagem dinástica de um rei.
- source_word: אֲדֹנֶיךָ
  choice: seu senhor
  rationale: O termo designa o superior humano de Jeú. “Senhor” é natural no contexto político e militar, e a minúscula evita confusão com um título divino.
- source_word: וְנִקַּמְתִּי
  choice: e eu vingarei
  rationale: נקם expressa aqui a retribuição divina em favor dos que foram mortos. “Vingarei” mantém de modo conciso a força judicial e teológica do verbo.
- source_word: דְּמֵי
  choice: o sangue
  rationale: O plural hebraico de “sangue” funciona como expressão de sangue derramado e culpa de sangue. O singular coletivo é a forma idiomática em português.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: meus servos, os profetas
  rationale: A aposição identifica os profetas como servos de Deus; as vírgulas tornam essa relação clara em português.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: todos os servos de Yahweh
  rationale: A formulação preserva a relação do construto hebraico e mantém o nome divino como nome pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: מִיַּד אִיזָבֶל
  choice: derramado às mãos de Jezabel
  rationale: A expressão portuguesa comunica naturalmente o idioma hebraico de agência e responsabilidade. “Derramado” explicita o sentido já inerente à referência ao sangue, sem alterar o agente.
theological_decisions:
- issue: A vingança atribuída a Deus
  choice: e eu vingarei
  alternative: e eu exigirei vingança pelo
  rationale: O texto atribui diretamente a Deus a retribuição pelo sangue dos seus servos. A tradução conserva essa afirmação e sua tensão teológica, sem suavizá-la nem ampliá-la.
- issue: Responsabilidade de Jezabel pelo sangue derramado
  choice: derramado às mãos de Jezabel
  alternative: da mão de Jezabel
  rationale: A leitura mantém Jezabel como agente responsável, conforme o idioma hebraico, sem especificar além do texto se ela matou pessoalmente ou ordenou as mortes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o idioma bíblico “casa de Acabe” e o nome divino “Yahweh”; a ordem da frase foi ajustada apenas para fluência natural.
