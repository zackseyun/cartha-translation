  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram[a]. And Jehu said, “If this is your mind[b], let no fugitive leave the city to go and tell it in Jezreel.”
translation:
  language: pt
  text: 'O rei Jorão tinha voltado a Jezreel para se recuperar dos ferimentos que os arameus[a] lhe haviam causado quando ele lutou contra Hazael, rei de Arã. E Jeú disse: “Se essa é a vontade de vocês,[b] não deixem ninguém escapar da cidade para ir dar a notícia em Jezreel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “sírios”. O hebraico diz “arameus”.
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido por “Se esse é o desejo de vocês” ou “Se vocês estão dispostos”. Literalmente, a expressão hebraica diz: “Se há a alma de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: tinha voltado
  rationale: O mais-que-perfeito situa o retorno de Jorão antes da fala de Jeú e expressa com naturalidade a relação narrativa implícita no contexto.
- source_word: לְהִתְרַפֵּא
  choice: para se recuperar
  rationale: O hitpael de רפא indica recuperação ou cura; esta formulação é natural em português e não sugere que Jorão curou a si mesmo.
- source_word: מִן הַמַּכִּים אֲשֶׁר יַכֻּהוּ
  choice: dos ferimentos que ... lhe haviam causado
  rationale: Embora מַכִּים possa designar golpes, o contexto de convalescença favorece 'ferimentos'; a construção verbal portuguesa comunica naturalmente que foram causados pelos arameus.
- source_word: אֲרַמִּים
  choice: arameus
  rationale: Mantém a designação histórica do povo de Arã, evitando o termo tradicional 'sírios', que pode sugerir uma identificação geográfica posterior.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: quando ele lutou contra Hazael
  rationale: O infinitivo com בְּ apresenta a circunstância temporal, e 'contra' explicita em português a relação adversativa indicada pelo contexto.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: Se essa é a vontade de vocês
  rationale: O idioma hebraico, literalmente relacionado à 'alma' ou disposição dos ouvintes, expressa vontade, desejo ou consentimento. A tradução preserva esse sentido sem reproduzir uma construção obscura em português.
- source_word: אַל יֵצֵא פָלִיט מִן הָעִיר
  choice: não deixem ninguém escapar da cidade
  rationale: פָלִיט é alguém que escapa. A formulação verbal é mais natural em português do que chamar antecipadamente a pessoa de 'fugitivo' e preserva a ordem de impedir qualquer saída.
- source_word: לָלֶכֶת לְהַגִּיד
  choice: para ir dar a notícia
  rationale: Os infinitivos indicam o propósito da fuga. 'Dar a notícia' torna explícito apenas o objeto implícito no hebraico e soa idiomático em português.
- source_word: בְּיִזְרְעֶאל
  choice: em Jezreel
  rationale: A preposição é locativa e indica o lugar onde a notícia seria comunicada.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de boa legibilidade no Brasil. Emprega 'vocês' porque Jeú se dirige ao grupo presente. A coordenação narrativa foi vertida por 'Então', sem acrescentar um marcador temporal equivalente a 'agora'. Os marcadores das notas foram ligados aos respectivos termos, corrigindo a aparente inversão existente na camada inglesa fornecida.
