base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: pt
  text: 'Então o cavaleiro foi ao encontro dele e disse: “Assim diz o rei: ‘Está tudo em paz?’”[a] Jeú respondeu: “O que você tem a ver com a paz? Dê meia-volta e fique atrás de mim.”[b] Então o vigia informou: “O mensageiro chegou até eles, mas não voltou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Está tudo bem?” O hebraico usa shalom (“paz”, “bem-estar”), termo repetido ao longo da conversa.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Vire-se para trás de mim.” Conforme o contexto, a ordem também pode significar: “Ponha-se atrás de mim” ou “Siga atrás de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: o cavaleiro
  rationale: A expressão significa literalmente “o que monta o cavalo”. “O cavaleiro” é a forma portuguesa natural e adequada ao contexto de um mensageiro militar.
- source_word: לִקְרָאתוֹ
  choice: ao encontro dele
  rationale: Expressa movimento em direção a alguém com a finalidade de encontrá-lo; a formulação é clara e idiomática em português.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Assim diz o rei
  rationale: Preserva a fórmula solene usada por mensageiros reais sem deixar de ser compreensível ao leitor moderno.
- source_word: הֲשָׁלוֹם
  choice: Está tudo em paz?
  rationale: Comunica a pergunta sobre condições pacíficas e preserva “paz”, palavra repetida e retoricamente importante no diálogo.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: O que você tem a ver com a paz?
  rationale: Reproduz de modo natural a expressão hebraica de rejeição e mantém a repetição deliberada de “paz”.
- source_word: סֹב אֶל אַחֲרָי
  choice: Dê meia-volta e fique atrás de mim
  rationale: Comunica tanto o ato de virar quanto a ordem para ocupar posição atrás de Jeú, sem especificar além do que o contexto permite se o cavaleiro apenas permanece ali ou passa a acompanhá-lo.
- source_word: הַצֹּפֶה
  choice: o vigia
  rationale: Designa quem observa de um ponto elevado; “vigia” é corrente, claro e apropriado à narrativa.
- source_word: הַמַּלְאָךְ
  choice: o mensageiro
  rationale: Neste relato histórico, a palavra designa um enviado humano, não um ser celestial.
- source_word: בָּא ... עַד הֵם
  choice: chegou até eles
  rationale: Representa diretamente a chegada do mensageiro ao lugar onde estava o grupo.
- source_word: וְלֹא שָׁב
  choice: mas não voltou
  rationale: Expressa com naturalidade o resultado observado pelo vigia e mantém o contraste da conjunção hebraica.
