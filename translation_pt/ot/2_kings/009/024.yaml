base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: pt
  text: Então Jeú retesou o arco com toda a força e atingiu Jeorão entre os braços[a]. A flecha atravessou-lhe o coração, e ele tombou dentro do seu carro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «entre os ombros» ou «entre as omoplatas». O hebraico diz literalmente «entre os braços», expressão que pode se referir à parte superior das costas, na região dos ombros.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: retesou o arco com toda a força
  rationale: A expressão hebraica, literalmente «encheu a mão com o arco», descreve o ato de puxar plenamente a corda. A tradução comunica o gesto de modo natural e vívido em português.
- source_word: וַיַּךְ
  choice: atingiu
  rationale: O verbo נכה tem o sentido amplo de golpear ou atingir. «Atingiu» é natural no contexto de uma flecha sem acrescentar ao verbo uma especificidade ausente no hebraico.
- source_word: בֵּין זְרֹעָיו
  choice: entre os braços
  rationale: זְרוֹעַ significa normalmente «braço». A tradução principal conserva a formulação hebraica, enquanto a possível referência idiomática à região entre os ombros é indicada em nota.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: A flecha atravessou-lhe o coração
  rationale: Embora a construção diga literalmente que a flecha «saiu do seu coração», o contexto descreve sua passagem pelo corpo. Esta formulação natural preserva a referência explícita ao coração.
- source_word: וַיִּכְרַע
  choice: tombou
  rationale: כרע denota curvar-se, dobrar os joelhos ou desabar. Após o ferimento mortal, «tombou» expressa de maneira concisa o corpo que cede.
- source_word: בְּרִכְבּוֹ
  choice: dentro do seu carro
  rationale: O sufixo possessivo refere-se ao carro de Jeorão. «Dentro do seu carro» deixa claro o local em que ele tombou.
theological_decisions: []
