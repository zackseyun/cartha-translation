source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: pt
  text: 'Quando Jeorão viu Jeú, perguntou:


    — Você vem em paz, Jeú?


    Ele respondeu:


    — Que paz pode haver[a] enquanto continuarem as prostituições[b] de Jezabel, sua mãe, e as suas muitas feitiçarias?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que paz?”. O hebraico repete a palavra “paz” da pergunta de Jeorão para produzir efeito retórico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “devassidões”. O termo hebraico também pode sugerir infidelidade moral e religiosa, além do seu sentido sexual literal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Quando ... viu
  rationale: A construção narrativa hebraica introduz a circunstância temporal. Em português, “Quando ... viu” transmite com naturalidade a sequência sem o peso pouco idiomático de “E aconteceu que, quando”.
- source_word: הֲשָׁלוֹם
  choice: Você vem em paz?
  rationale: No contexto, a pergunta indaga as intenções pacíficas de Jeú. A formulação é natural em português e mantém “paz”, preparando a repetição retórica na resposta.
- source_word: מָה הַשָּׁלוֹם
  choice: Que paz pode haver
  rationale: Expressa a força retórica da frase e conserva a repetição de “paz”; o hebraico também pode ser reproduzido de modo mais conciso como “Que paz?”.
- source_word: עַד
  choice: enquanto continuarem
  rationale: Aqui a preposição introduz uma condição persistente que torna a paz impossível. A formulação portuguesa explicita adequadamente esse valor durativo.
- source_word: זְנוּנֵי
  choice: prostituições
  rationale: Preserva a metáfora deliberadamente forte do plural hebraico, que pode abranger tanto conduta sexual e moral quanto infidelidade religiosa, sem restringi-la no texto principal a “idolatrias”.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: Jezabel, sua mãe
  rationale: Reproduz de maneira clara e direta a identificação acusatória dirigida a Jeorão.
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  choice: e as suas muitas feitiçarias
  rationale: “Feitiçarias” comunica práticas mágicas proibidas e preserva tanto o plural quanto a intensificação expressa por “muitas”.
theological_decisions:
- issue: 'Amplitude de זְנוּנֵי: referência literal, moral ou cultual'
  choice: Manter a metáfora como “prostituições”
  alternative: “devassidões”, “imoralidades sexuais” ou “idolatrias”
  rationale: O termo hebraico é intencionalmente chocante e pode reunir conotações literais e figuradas. Traduzir apenas por “idolatrias” resolveria indevidamente a ambiguidade; “prostituições” conserva a tensão, esclarecida em nota.
- issue: Sentido e repetição de שָׁלוֹם
  choice: Usar “paz” nas duas falas
  alternative: “Está tudo bem?” ou “Você vem com boas intenções?”
  rationale: A repetição lexical sustenta o contraste retórico entre a pergunta de Jeorão e a rejeição de Jeú. Embora a primeira formulação seja idiomática, “paz” permanece explícita nas duas ocorrências.
translation_notes:
  register: Português moderno, claro e digno, com pontuação de diálogo natural para leitores brasileiros. A tradução favorece fluência sem apagar a repetição de “paz” nem a linguagem forte e ambígua de “prostituições”.
