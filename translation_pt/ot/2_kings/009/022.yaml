  source_fidelity: 'A tradução preserva adequadamente a estrutura e o sentido do hebraico: a pergunta de Jeorão mantém «paz», e a resposta de Jeú retoma o mesmo termo com força retórica. «Enquanto continuarem» expressa bem o valor durativo de עַד neste contexto. «Prostituições» e «muitas feitiçarias» representam, respectivamente, זְנוּנֵי e וּכְשָׁפֶיהָ הָרַבִּים sem reduzir a primeira expressão a uma interpretação exclusivamente cultual.'
