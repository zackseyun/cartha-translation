  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: pt
  text: 'Então ele disse a Bidcar, seu oficial[a]: “Levante-o e jogue-o na porção do campo de Nabote, o jezreelita. Lembre-se: eu e você cavalgávamos lado a lado[b] atrás de Acabe, pai dele, quando Yahweh proferiu contra ele este pronunciamento[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu terceiro homem”, possivelmente uma designação técnica da patente ou função de Bidcar.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, aproximadamente: “cavalgando em pares”; a expressão provavelmente indica que Jeú e Bidcar cavalgavam juntos atrás de Acabe.'
    reason: lexical_alternative
  - marker: c
    text: Ou “oráculo” ou “peso”. O termo hebraico designa um pronunciamento profético solene e carregado de gravidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: Bidcar
  rationale: Transliteração corrente e reconhecível do nome próprio hebraico em português.
- source_word: שלשה
  choice: seu oficial
  rationale: A tradição textual e o contexto apontam para uma designação da função de Bidcar. “Oficial” comunica seu papel sem definir com excessiva precisão uma patente militar incerta.
- source_word: שָׂא
  choice: Levante-o
  rationale: O imperativo de נשׂא indica que o corpo deve ser erguido ou retirado antes de ser lançado no campo.
- source_word: הַשְׁלִכֵהוּ
  choice: jogue-o
  rationale: Expressa de modo direto e natural a força do imperativo hebraico com sufixo masculino singular.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: no lote do campo
  rationale: “Lote” representa חֶלְקָה como uma parcela delimitada de terra, enquanto “campo” preserva שָׂדֶה.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabote, o jezreelita
  rationale: Emprega as formas tradicionais e inteligíveis em português para o nome pessoal e o gentílico.
- source_word: זְכֹר
  choice: Lembre-se
  rationale: Traduz o imperativo que introduz a recordação usada como fundamento da ordem.
- source_word: רֹכְבִים צְמָדִים
  choice: cavalgávamos lado a lado
  rationale: A expressão literalmente envolve cavaleiros em par; “lado a lado” comunica a provável disposição conjunta sem ocultar a dificuldade lexical, registrada em nota.
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: atrás de Acabe, pai dele
  rationale: Preserva o sentido espacial de אַחֲרֵי e a referência de “pai dele” ao pai do homem morto, sem substituir o pronome por um nome ausente do versículo.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, distinguindo-o de um título como “Senhor”.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: proferiu contra ele este pronunciamento
  rationale: A construção descreve a apresentação de uma declaração profética pesada ou ameaçadora contra Acabe. “Pronunciamento” é claro e mantém em nota as alternativas “oráculo” e “peso”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido profético de מַשָּׂא
  choice: pronunciamento
  alternative: oráculo; peso
  rationale: A escolha mantém o caráter solene e judicial da declaração profética sem transformar a metáfora lexical de “peso” em uma interpretação teológica mais específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe direta preserva a ordem narrativa e o tom enérgico da fala. As ambiguidades técnicas de שלשה, רֹכְבִים צְמָדִים e מַשָּׂא são mantidas nas notas, sem impor uma patente militar, uma formação exata ou uma interpretação teológica exclusiva.
