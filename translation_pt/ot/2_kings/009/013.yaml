base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: pt
  text: 'Então eles se apressaram; cada um pegou sua veste e a colocou debaixo de Jeú, sobre os degraus[a]. Depois tocaram a trombeta[b] e disseram: “Jeú é rei!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no alto da escadaria” ou “no patamar da escada”. A expressão hebraica é rara e seu sentido exato é incerto; pode referir-se à superfície descoberta dos degraus.
    reason: lexical_alternative
  - marker: b
    text: Hebraico shofar, um instrumento de chifre usado para emitir sinais; tradicionalmente traduzido por “trombeta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: Então eles se apressaram
  rationale: Preserva tanto a sequência narrativa do waw consecutivo quanto a ideia de resposta imediata expressa por מהר.
- source_word: אִישׁ בִּגְדוֹ
  choice: cada um pegou a sua veste
  rationale: אִישׁ tem sentido distributivo, e בֶּגֶד é um termo amplo para veste; a formulação é natural e não especifica indevidamente o tipo de roupa.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: a estendeu debaixo de Jeú
  rationale: O pronome em תַחְתָּיו se refere mais naturalmente a Jeú. “Estendeu” explicita de modo idiomático a disposição das vestes, sem sugerir uma forma precisa além do contexto.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: sobre os degraus nus
  rationale: A expressão é rara e incerta. Esta opção representa uma interpretação lexical plausível de גֶּרֶם como superfície descoberta, enquanto a nota conserva alternativas relevantes.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: tocaram a trombeta de chifre
  rationale: שׁוֹפָר designa um instrumento de chifre usado para sinais. “Trombeta de chifre” é compreensível em português e mais específico que apenas “trombeta”, sem restringir necessariamente o material a chifre de carneiro.
- source_word: מָלַךְ יֵהוּא
  choice: Jeú é rei!
  rationale: Embora o perfeito possa apresentar a entronização como fato consumado, no contexto de uma aclamação régia a fórmula direta “é rei” comunica naturalmente o sentido proclamativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O nome “Jeú” é repetido para eliminar uma ambiguidade pronominal pouco natural em português. As notas preservam a incerteza lexical de אֶל גֶּרֶם הַמַּעֲלוֹת e explicam o referente cultural de שׁוֹפָר.
