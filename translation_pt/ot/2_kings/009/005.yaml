base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: pt
  text: 'Então ele chegou, e eis que os comandantes do exército estavam sentados. Ele disse: “Tenho uma palavra[a] para você, comandante”. Jeú disse: “Para qual de nós?” Ele respondeu: “Para você, comandante”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenho uma mensagem para você, comandante”. Em hebraico, literalmente: “Uma palavra é para mim, para você, comandante”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ele entrou
  rationale: O wayyiqtol faz a narrativa avançar; no contexto, o jovem profeta entra no lugar onde os comandantes estavam reunidos.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a apresentação vívida e a chamada de atenção expressas por הִנֵּה, em registro digno e ainda compreensível.
- source_word: שָׂרֵי הַחַיִל
  choice: os comandantes do exército
  rationale: Expressa com clareza moderna a função militar dos שָׂרִים sem atribuir uma patente específica.
- source_word: יֹשְׁבִים
  choice: estavam sentados
  rationale: O particípio descreve a situação em curso quando ele entrou.
- source_word: דָּבָר לִי אֵלֶיךָ
  choice: Tenho uma palavra para você
  rationale: Reproduz de modo natural a construção idiomática hebraica, mantendo em “palavra” a possibilidade semântica de mensagem ou assunto.
- source_word: הַשַּׂר
  choice: comandante
  rationale: Como vocativo dirigido a um líder militar, “comandante” é claro e evita tanto arcaísmo quanto uma patente excessivamente específica.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: Para qual de nós?
  rationale: 'Formulação portuguesa natural que conserva o sentido partitivo: Jeú pergunta qual dos homens reunidos é o destinatário.'
- source_word: אֵלֶיךָ הַשָּׂר
  choice: Para você, comandante
  rationale: Mantém a resposta direta e repete a forma de tratamento usada anteriormente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” conserva a vivacidade narrativa do hebraico; “você” evita a ambiguidade que “o senhor” criaria ao lado do vocativo “comandante”.
