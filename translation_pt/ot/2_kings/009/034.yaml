  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: pt
  text: 'Depois, ele entrou, comeu e bebeu. Então disse: “Por favor, cuidem desta mulher amaldiçoada[a] e sepultem-na, pois ela é filha de um rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desta amaldiçoada”.'
    reason: A expressão hebraica feminina pode ser traduzida sem acrescentar o substantivo “mulher”.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Depois, ele entrou
  rationale: Neste contexto narrativo, בוא indica que Jeú entrou no edifício depois da morte de Jezabel. “Entrou” expressa o movimento de modo natural sem acrescentar um local não mencionado no hebraico.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: comeu e bebeu
  rationale: Os dois verbos não têm objeto expresso; a tradução direta preserva essa concisão e não acrescenta “vinho”.
- source_word: פִּקְדוּ נָא
  choice: Por favor, cuidem
  rationale: פקד, neste contexto, significa dar atenção ou tomar providências a respeito de alguém. “Cuidem” é claro e natural, enquanto “por favor” representa a partícula נָא sem enfraquecer o caráter de ordem.
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: desta mulher amaldiçoada
  rationale: A forma feminina se refere a Jezabel. “Mulher” explicita naturalmente o referente em português, e “amaldiçoada” preserva a força de ארר.
- source_word: וְקִבְרֻהָ
  choice: e sepultem-na
  rationale: O imperativo com sufixo feminino singular é reproduzido diretamente. “Sepultar” mantém o registro digno e corrente do contexto funerário.
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: pois ela é filha de um rei
  rationale: A oração apresenta a condição real dela como razão para o sepultamento. O artigo indefinido reflete de modo natural a construção hebraica sem artigo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência narrativa foi dividida em duas frases para fluidez, sem alterar sua progressão. O pronome enclítico em “sepultem-na” preserva o tom formal sem soar arcaico.
