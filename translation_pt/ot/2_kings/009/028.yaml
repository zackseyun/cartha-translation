  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: pt
  text: Seus servos o levaram para Jerusalém[a] e o sepultaram em seu túmulo, junto com seus antepassados[b], na Cidade de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o transportaram para Jerusalém”. O verbo hebraico significa literalmente “o fizeram montar” ou “o fizeram ir montado”; neste contexto, refere-se ao transporte do corpo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com seus pais”. Esta é uma expressão hebraica de sepultamento que, aqui, se refere aos seus antepassados da linhagem real.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: levaram
  rationale: O hifil de רכב significa literalmente “fizeram montar/andar” e, neste contexto funerário, indica que transportaram o corpo. “Levaram” é natural em português e não sugere que Acazias ainda estivesse vivo.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: עבד designa diretamente servos e também pode abranger oficiais ou assistentes da corte; “servos” preserva o sentido básico sem especificação indevida.
- source_word: יְרוּשָׁלָמָה
  choice: para Jerusalém
  rationale: A terminação direcional -ָה indica movimento em direção a Jerusalém, expresso naturalmente por “para”.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: e o sepultaram
  rationale: Tradução direta e digna do verbo קבר com objeto pronominal, mantendo “seus servos” como sujeito subentendido.
- source_word: בִקְבֻרָתוֹ
  choice: em seu túmulo
  rationale: O substantivo indica o lugar de sepultamento; “túmulo” é corrente e adequado ao contexto régio.
- source_word: עִם אֲבֹתָיו
  choice: com seus pais
  rationale: Preserva a expressão hebraica e sua ressonância dinástica; no contexto, refere-se ao sepultamento junto aos antepassados da linhagem real.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: Forma convencional e direta do topônimo, com inicial maiúscula por funcionar como nome próprio.
