source:
  edition: WLC
  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: pt
  text: Entregavam a prata pesada[a] aos trabalhadores[b] encarregados do templo de Yahweh, e estes a distribuíam aos carpinteiros e aos construtores que trabalhavam no templo de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a prata medida” ou “o dinheiro contado”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na mão dos”; a expressão indica que o dinheiro era confiado aos cuidados ou à responsabilidade deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: a prata pesada
  rationale: O particípio indica prata quantificada por medição ou pesagem. No contexto de recursos destinados à obra do templo, “prata pesada” é concreto e preserva o modo antigo de aferir dinheiro, sem excluir completamente outras formas de mensuração.
- source_word: עַל יַד
  choice: aos responsáveis
  rationale: A expressão idiomática significa literalmente “sobre/pela mão de”, aqui indicando que os recursos eram confiados à responsabilidade de alguém. A tradução comunica essa função em português natural; a forma literal é registrada em nota.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: pela obra
  rationale: A expressão designa os que executavam ou administravam o trabalho. Em combinação com הַפְּקֻדִים, “responsáveis pela obra” evita limitar o grupo apenas a trabalhadores braçais.
- source_word: הַפְּקֻדִים בֵּית יְהוָה
  choice: encarregados do templo de Yahweh
  rationale: O particípio passivo indica pessoas designadas ou encarregadas em relação ao templo. A redação preserva a ideia de responsabilidade delegada sem acrescentar uma estrutura administrativa não explicitada.
- source_word: וַיּוֹצִיאֻהוּ
  choice: e estes a pagavam
  rationale: Embora o verbo signifique literalmente “faziam-na sair”, neste contexto financeiro descreve o desembolso da prata. “Pagavam” é claro e idiomático, e “estes” explicita naturalmente que os encarregados faziam o pagamento.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: aos carpinteiros
  rationale: A expressão significa literalmente artesãos da madeira; “carpinteiros” é o equivalente português mais natural no contexto de construção.
- source_word: וְלַבֹּנִים
  choice: e aos construtores
  rationale: O termo é amplo e significa “os que constroem”. “Construtores” evita a especificidade indevida de “pedreiros”.
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: que trabalhavam no templo de Yahweh
  rationale: A construção expressa atividade realizada no edifício. “Trabalhavam no templo” é natural e não explicita “reparavam”, informação fornecida pelo contexto mais amplo, mas não pelo verbo deste versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa de modo transparente e evita substituí-lo pelo título “Senhor”; “Jeová” é uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Templo” traduz funcionalmente “casa” neste contexto cultual. A ordem da frase foi ajustada para esclarecer que os encarregados recebiam e desembolsavam os recursos, preservando o sentido do hebraico.
