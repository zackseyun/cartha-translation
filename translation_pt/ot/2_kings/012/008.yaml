  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: pt
  text: 'Então o rei Jeoás chamou o sacerdote Joiada e os sacerdotes e lhes disse: “Por que vocês não estão consertando os estragos do templo?[a] Agora, não recebam dinheiro dos seus contribuintes[b], mas entreguem-no para os reparos do templo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a casa”, isto é, o templo.'
    reason: cultural_note
  - marker: b
    text: O termo hebraico traduzido como “contribuintes” é de sentido incerto; também pode ser entendido como “conhecidos” ou “doadores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Neste contexto narrativo, קרא indica chamar alguém à presença; “chamou” é natural e mantém a força simples do relato.
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: o rei Jeoás
  rationale: A forma portuguesa corrente põe o título antes do nome; יְהוֹאָשׁ é tradicionalmente vertido como Jeoás.
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: o sacerdote Joiada e os sacerdotes
  rationale: Mantém os dois elementos expressos no hebraico sem acrescentar “outros”, embora Joiada também pertencesse ao grupo sacerdotal.
- source_word: אֵינְכֶם מְחַזְּקִים אֶת בֶּדֶק הַבָּיִת
  choice: vocês não estão consertando os estragos do templo
  rationale: חזק, combinado com בדק הבית, descreve a realização de reparos estruturais. “Consertando os estragos” expressa em português corrente tanto a ação quanto o dano que a exige.
- source_word: הַבָּיִת
  choice: o templo
  rationale: Embora o hebraico diga literalmente “a casa”, no contexto a referência inequívoca é ao templo; a tradução explícita evita obscuridade para o leitor moderno, com nota preservando a expressão original.
- source_word: וְעַתָּה
  choice: De agora em diante
  rationale: A expressão introduz uma mudança administrativa válida dali por diante, não apenas uma transição momentânea.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: não recebam mais dinheiro
  rationale: כֶּסֶף significa aqui recursos monetários, e לקח descreve o recebimento pelos sacerdotes. “Mais” torna natural a proibição de continuar a prática já existente.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: dos seus contribuintes
  rationale: מַכָּרֵיכֶם é uma expressão difícil. No contexto financeiro, “contribuintes” comunica pessoas ligadas aos sacerdotes das quais estes recebiam dinheiro, sem esconder a incerteza, registrada em nota.
- source_word: כִּי לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: entreguem-no para os reparos do templo
  rationale: כִּי tem aqui valor corretivo, e o sufixo em תתנהו retoma o dinheiro. “Entreguem-no” indica que os fundos deveriam ser destinados diretamente à obra.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento brasileiras naturais (“vocês”). A tradução explicita “templo” no texto principal para clareza contextual, enquanto a nota conserva o hebraísmo “a casa”. A incerteza de מַכָּרֵיכֶם é preservada em nota, sem impor uma identificação administrativa excessivamente específica.
