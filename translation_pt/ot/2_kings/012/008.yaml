- from: 'Então o rei Jeoás chamou o sacerdote Joiada e os sacerdotes e lhes perguntou: “Por que vocês não estão consertando os estragos do templo?[a] De agora em diante, não recebam mais dinheiro dos seus contribuintes[b]; entreguem-no para os reparos do templo.”'
  to: 'Então o rei Jeoás chamou o sacerdote Joiada e os sacerdotes e lhes disse: “Por que vocês não estão consertando os estragos do templo?[a] Agora, não recebam dinheiro dos seus contribuintes[b], mas entreguem-no para os reparos do templo.”'
