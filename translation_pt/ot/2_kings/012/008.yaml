    issue: «lhes perguntou» para וַיֹּאמֶר
    rationale: O verbo hebraico significa «disse»; a fala contém uma pergunta seguida de uma instrução, portanto «perguntou» não abrange plenamente o ato de fala.
  - severity: low
    issue: «De agora em diante» e «mais»
    rationale: Essas expressões explicitam uma continuidade temporal que o hebraico וְעַתָּה não afirma necessariamente. «Agora» preserva a transição discursiva sem acréscimo.
