  verdict: revise
  source_fidelity: A tradução identifica corretamente Jeoás, Joiada, os sacerdotes, o templo e a destinação do dinheiro aos reparos. Contudo, «perguntou» reduz וַיֹּאמֶר («disse») a uma pergunta, embora a fala inclua também uma ordem. «De agora em diante» e «mais» acrescentam uma duração/continuidade que não está expressa de modo inequívoco em וְעַתָּה («agora»).
  naturalness: O português é claro e de registro moderno. «Disse-lhes» e «Agora» são igualmente naturais e reproduzem melhor a forma e a progressão do hebraico.
  terminology: «Jeoás», «Joiada», «sacerdote», «templo», «contribuintes» e «reparos» são adequados. A nota sobre «contribuintes» preserva corretamente a dificuldade de מַכָּרֵיכֶם. A nota sobre «a casa» justifica de modo suficiente a explicitação contextual de «templo».
  issues:
