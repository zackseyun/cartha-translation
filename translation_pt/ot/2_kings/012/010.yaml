  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹיָדָ֤ע הַ/כֹּהֵן֙ אֲר֣וֹן אֶחָ֔ד וַ/יִּקֹּ֥ב חֹ֖ר בְּ/דַלְתּ֑/וֹ וַ/יִּתֵּ֣ן אֹת/וֹ֩ אֵ֨צֶל הַ/מִּזְבֵּ֜חַ ב/ימין בְּ/בֽוֹא אִישׁ֙ בֵּ֣ית יְהוָ֔ה וְ/נָֽתְנוּ שָׁ֤מָּ/ה הַ/כֹּֽהֲנִים֙ שֹׁמְרֵ֣י הַ/סַּ֔ף אֶת כָּל הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: pt
  text: Então Joiada, o sacerdote, pegou um cofre, fez um furo na tampa[a] e o colocou ao lado do altar, à direita de quem entra na casa de Yahweh[b]. Os sacerdotes que guardavam a entrada colocavam ali toda a prata[c] levada à casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na sua porta”. Neste contexto, a palavra provavelmente se refere à tampa ou cobertura do cofre.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “à direita, ao entrar um homem na casa de Yahweh”. A expressão indica o lado direito do ponto de vista de quem entra.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “todo o dinheiro”. A palavra hebraica para “prata” também pode designar dinheiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: cofre
  rationale: No contexto da arrecadação para o templo, designa um recipiente destinado a receber valores. “Cofre” é claro em português e evita as associações pactuais de “arca”.
- source_word: וַיִּקֹּב חֹר
  choice: fez um furo
  rationale: Expressa de modo natural a ação física de abrir ou perfurar um orifício no recipiente.
- source_word: בְּדַלְתּוֹ
  choice: na tampa
  rationale: Embora דֶּלֶת costume significar “porta”, aqui se refere provavelmente à parte móvel que fechava o cofre; “tampa” é a formulação natural em português.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: ao lado do altar
  rationale: Preserva com clareza a ideia espacial de proximidade indicada por אֵצֶל.
- source_word: בימין
  choice: à direita
  rationale: Tradução locativa direta, orientada pela perspectiva de quem entra.
- source_word: בְּבוֹא אִישׁ בֵּית יְהוָה
  choice: de quem entra na casa de Yahweh
  rationale: O singular hebraico é genérico e estabelece a perspectiva espacial. A formulação portuguesa comunica essa função naturalmente, enquanto a nota registra a forma literal.
- source_word: שֹׁמְרֵי הַסַּף
  choice: que guardavam a entrada
  rationale: O hebraico diz literalmente “guardiões do limiar”. “Guardavam a entrada” transmite com naturalidade a função dos sacerdotes no acesso ao templo.
- source_word: כָּל הַכֶּסֶף
  choice: toda a prata
  rationale: כֶּסֶף significa literalmente “prata” e pode, por extensão, significar dinheiro. O sentido concreto foi mantido no texto, com a alternativa indicada em nota.
- source_word: הַמּוּבָא
  choice: levada
  rationale: O particípio Hofal de בוא indica aquilo que era trazido ou levado para dentro; a forma concisa concorda naturalmente com “prata”.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica “casa de Yahweh”, compreensível no contexto como o templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Singular masculino genérico אִישׁ na indicação espacial
  choice: quem entra
  alternative: ao entrar um homem
  rationale: Neste contexto, אִישׁ não identifica um homem específico, mas orienta a posição do cofre a partir da perspectiva da pessoa que entra. A tradução natural mantém essa função; a nota conserva a forma mais literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi levemente ajustada para evitar rigidez, sem apagar as referências espaciais nem a distinção lexical entre “prata” e “dinheiro”.
