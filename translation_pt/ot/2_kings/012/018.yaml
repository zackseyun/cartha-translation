  text: אָ֣ז יַעֲלֶ֗ה חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יִּלָּ֥חֶם עַל גַּ֖ת וַֽ/יִּלְכְּדָ֑/הּ וַ/יָּ֤שֶׂם חֲזָאֵל֙ פָּנָ֔י/ו לַ/עֲל֖וֹת עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: pt
  text: Então Hazael, rei de Arã[b], subiu, lutou contra Gate e a conquistou. Depois, Hazael decidiu avançar contra Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pôs o rosto para subir contra Jerusalém”, expressão que indica determinação.'
    reason: lexical_alternative
  - marker: b
    text: “Arã” é o nome hebraico da região muitas vezes chamada tradicionalmente de “Síria”.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a progressão temporal da narrativa de modo natural e direto.
- source_word: יַעֲלֶה
  choice: subiu
  rationale: Preserva o sentido básico de עלה e sua nuance de avanço militar em direção a uma localidade.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazael, rei de Arã
  rationale: Translitera o nome pessoal e mantém Arã como o termo etnogeográfico hebraico, em vez do tradicional 'Síria'.
- source_word: וַיִּלָּחֶם עַל
  choice: lutou contra
  rationale: Expressa claramente a ação militar sem ampliar o verbo para uma formulação mais interpretativa como 'atacou'.
- source_word: גַּת
  choice: Gate
  rationale: Forma tradicional e amplamente reconhecível em português para o topônimo hebraico.
- source_word: וַיִּלְכְּדָהּ
  choice: a conquistou
  rationale: O pronome feminino retoma a cidade de Gate, e 'conquistou' comunica com precisão a tomada militar.
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: decidiu
  rationale: Traduz naturalmente o valor resoluto do idioma hebraico, cuja forma literal é registrada em nota.
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: avançar contra Jerusalém
  rationale: Conserva tanto o movimento militar quanto a direção hostil, sem afirmar que o ataque chegou a ocorrer.
