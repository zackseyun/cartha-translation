source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: pt
  text: 'Jeoás disse aos sacerdotes: “Todo o dinheiro das coisas consagradas que for levado ao templo de Yahweh — o dinheiro de cada homem recenseado[a], o dinheiro da avaliação de pessoas[b] e todo o dinheiro que alguém decidir de coração[c] levar ao templo de Yahweh —”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “o dinheiro de cada homem que passa”. Provavelmente se refere ao pagamento exigido dos homens incluídos no recenseamento; compare Êxodo 30:13–16.
    reason: lexical_alternative
  - marker: b
    text: Ou “o dinheiro pelo valor atribuído às pessoas”. Provavelmente se refere a pagamentos ligados às avaliações previstas em Levítico 27:2–8.
    reason: cross_reference
  - marker: c
    text: Literalmente, “que subir sobre o coração de alguém”, expressão que indica aquilo que a pessoa se dispõe voluntariamente a dar.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: Todo o dinheiro das coisas consagradas
  rationale: Preserva a relação do construto hebraico entre o dinheiro e as coisas sagradas ou dedicadas, sem limitar antecipadamente a expressão a uma única modalidade de oferta.
- source_word: יוּבָא בֵית יְהוָה
  choice: for levado ao templo de Yahweh
  rationale: A forma passiva reflete o hofal de בוא. Neste contexto, “templo” comunica naturalmente que a “casa de Yahweh” é o santuário, sem sugerir uma residência comum.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: o dinheiro de cada homem recenseado
  rationale: A expressão compacta provavelmente alude ao pagamento dos homens que passavam pela contagem do recenseamento; a formulação comunica esse sentido fiscal no texto e registra a leitura mais literal em nota.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: o dinheiro da avaliação de pessoas
  rationale: Mantém o sentido jurídico-cultual de valores fixados para pessoas, provavelmente no âmbito das avaliações descritas em Levítico 27, sem acrescentar “votos” ao texto principal.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: todo o dinheiro que alguém decidir de coração
  rationale: Expressa em português corrente a intenção voluntária indicada pelo idioma hebraico “subir sobre o coração”, enquanto a nota preserva a imagem literal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente e evita substituir o nome por um título.
- issue: Natureza do dinheiro ligado à avaliação de pessoas
  choice: avaliação de pessoas
  alternative: pagamentos por votos avaliados
  rationale: A provável relação com Levítico 27 é indicada em nota, mas o texto principal não explicita “votos”, termo ausente desta frase hebraica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Templo” traduz contextualmente “casa” para evitar opacidade; “homem” foi mantido na cláusula do recenseamento por seu provável referente masculino específico, enquanto “alguém” traduz o uso genérico de אִישׁ na oferta voluntária. O travessão final preserva a continuidade sintática da fala no versículo seguinte.
