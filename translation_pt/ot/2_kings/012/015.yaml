  text: כִּֽי לְ/עֹשֵׂ֥י הַ/מְּלָאכָ֖ה יִתְּנֻ֑/הוּ וְ/חִזְּקוּ ב֖/וֹ אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/015.yaml
  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: pt
  text: Pois o entregavam aos que faziam o trabalho, e estes reparavam com ele a casa de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o templo de Yahweh.
    reason: Esclarece o referente contextual da expressão hebraica literal «casa de Yahweh».
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação causal do motivo pelo qual, no versículo anterior, não se exigia prestação de contas.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: aos que faziam o trabalho
  rationale: Preserva a expressão participial hebraica, literalmente ‘aos que faziam a obra’, em linguagem portuguesa natural e sem especificar gênero além do que o contexto exige.
- source_word: יִתְּנֻהוּ
  choice: eles o entregavam
  rationale: O imperfeito hebraico descreve aqui uma prática habitual no passado; ‘entregavam’ expressa esse aspecto e mantém o objeto masculino singular, que no contexto é o dinheiro.
- source_word: וְחִזְּקוּ
  choice: reparavam
  rationale: Embora o sentido básico seja ‘fortalecer’ ou ‘tornar firme’, em contexto de construção o verbo designa restaurar a solidez do edifício.
- source_word: בּוֹ
  choice: com ele
  rationale: Retoma de modo conciso o dinheiro mencionado no contexto e expressa o meio usado nos reparos.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a imagem hebraica de ‘casa’ e representa diretamente o nome divino; no contexto, a expressão se refere ao templo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. ‘Yahweh’ distingue o nome pessoal divino de um título e evita substituir silenciosamente o nome por ‘Senhor’.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O imperfeito ‘entregavam’ e ‘reparavam’ comunica a ação habitual indicada pelo contexto narrativo.
