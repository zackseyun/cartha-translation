base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/009.yaml
  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: pt
  text: Mas os sacerdotes concordaram em não receber dinheiro do povo e em não reparar os estragos do templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “fortalecer os estragos da casa”; a expressão significa reparar os danos do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: concordaram
  rationale: O verbo אבה indica consentimento ou disposição; “concordaram” é natural e se ajusta aos dois infinitivos seguintes.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente usual de כֹּהֲנִים no contexto da administração do templo.
- source_word: לְבִלְתִּי קְחַת
  choice: em não receber
  rationale: לְבִלְתִּי com infinitivo expressa aquilo que eles concordaram em não fazer. “Receber” comunica neste contexto a coleta do dinheiro entregue pelo povo.
- source_word: כֶּסֶף
  choice: dinheiro
  rationale: Embora também possa significar “prata”, aqui o contexto financeiro e administrativo favorece “dinheiro”.
- source_word: מֵאֵת הָעָם
  choice: do povo
  rationale: Tradução direta e natural da expressão preposicional.
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: e em não reparar
  rationale: חזק significa literalmente “fortalecer”, mas, associado aos estragos do edifício, designa a execução de reparos.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: os estragos do templo
  rationale: בֶּדֶק denota brechas, rachaduras ou danos que exigem reparo. הַבַּיִת significa literalmente “a casa”, mas neste contexto se refere claramente ao templo.
