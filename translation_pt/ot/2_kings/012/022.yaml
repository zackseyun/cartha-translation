  text: וְ/יוֹזָבָ֣ד בֶּן שִׁ֠מְעָת וִ/יהוֹזָבָ֨ד בֶּן שֹׁמֵ֤ר עֲבָדָי/ו֙ הִכֻּ֣/הוּ וַ/יָּמֹ֔ת וַ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אֲמַצְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: pt
  text: Então Jozabade, filho de Simeate, e Jeozabade, filho de Somer — servos[a] do rei —, o feriram, e ele morreu. Sepultaram-no com seus antepassados na Cidade de Davi, e seu filho Amazias reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oficiais”. O termo hebraico pode indicar servos ou membros da corte, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד
  choice: Então Jozabade
  rationale: O nome próprio segue a forma portuguesa tradicional; a conjunção narrativa é expressa naturalmente por “Então” no contexto de continuação do relato.
- source_word: בֶּן שִׁמְעָת
  choice: filho de Simeate
  rationale: Mantém a construção genealógica hebraica e emprega uma forma portuguesa reconhecível do nome.
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: e Jeozabade, filho de Somer
  rationale: Preserva a coordenação e a filiação do texto hebraico, com transliterações adaptadas ao português.
- source_word: עֲבָדָיו
  choice: servos do rei
  rationale: עֶבֶד pode designar servos, cortesãos ou oficiais. “Servos do rei” mantém o sentido básico e esclarece o referente pronominal, sem impor a ideia específica de escravidão.
- source_word: הִכֻּהוּ
  choice: o feriram
  rationale: נכה significa golpear ou ferir. Esta opção preserva a progressão do hebraico, que declara em seguida, separadamente, que ele morreu.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Reproduz a sequência narrativa simples sem converter explicitamente a relação em finalidade ou resultado.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Sepultaram-no
  rationale: Forma natural e dignificada em português para a continuação narrativa com verbo plural e objeto pronominal.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: Comunica com clareza moderna o idiomatismo dinástico hebraico, segundo o qual foi sepultado junto aos seus predecessores familiares.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: Emprega a forma consagrada do topônimo bíblico em português.
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: e seu filho Amazias reinou em seu lugar
  rationale: Preserva a fórmula hebraica de sucessão real em português corrente e formal.
theological_decisions: []
