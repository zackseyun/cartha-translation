  register: Português moderno, claro e dignificado, com legibilidade brasileira e vocabulário amplamente internacional. A ordem narrativa e a distinção entre o golpe e a morte foram preservadas; a ambiguidade funcional de עֲבָדָיו foi registrada em nota.
