  text: וְ/לֹ֧א יְחַשְּׁב֣וּ אֶת הָ/אֲנָשִׁ֗ים אֲשֶׁ֨ר יִתְּנ֤וּ אֶת הַ/כֶּ֨סֶף֙ עַל יָדָ֔/ם לָ/תֵ֖ת לְ/עֹשֵׂ֣י הַ/מְּלָאכָ֑ה כִּ֥י בֶ/אֱמֻנָ֖ה הֵ֥ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/016.yaml
  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: pt
  text: Mas não exigiam prestação de contas[a] dos homens a cujas mãos[b] entregavam o dinheiro para que o entregassem aos que realizavam a obra, pois esses homens agiam com fidelidade.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não acertavam contas com os homens”.'
    reason: lexical_alternative
  - marker: b
    text: “A cujas mãos” é uma expressão hebraica que significa confiar algo à responsabilidade de alguém.
    reason: cultural_note
  - marker: c
    text: “Com fidelidade” também pode ser traduzido por “honestamente” ou “com integridade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: acertavam contas
  rationale: O piel de חשׁב, neste contexto administrativo, refere-se a calcular ou conferir contas. “Acertar contas com” preserva essa nuance sem explicitar além do hebraico que se exigia uma prestação formal.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O plural de אִישׁ designa aqui os homens específicos encarregados dos recursos; a tradução mantém a referência masculina do texto.
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: entregavam ... em cujas mãos
  rationale: Mantém a imagem do idioma hebraico de colocar algo nas mãos de alguém, isto é, sob sua responsabilidade.
- source_word: הַכֶּסֶף
  choice: o dinheiro
  rationale: Embora כֶּסֶף também possa significar “prata”, o contexto dos recursos destinados à reforma do templo favorece o sentido funcional de dinheiro.
- source_word: לָתֵת לְעֹשֵׂי הַמְּלָאכָה
  choice: para que o repassassem aos que executavam a obra
  rationale: A formulação comunica a transferência dos recursos aos responsáveis pela execução do trabalho e reflete o particípio hebraico “os que faziam/executavam a obra”.
- source_word: בֶאֱמֻנָה
  choice: com fidelidade
  rationale: A expressão descreve conduta digna de confiança no uso dos recursos. “Com fidelidade” preserva a amplitude ética de אֱמוּנָה, sem restringi-la apenas à honestidade financeira.
- source_word: הֵם עֹשִׂים
  choice: eles agiam
  rationale: Em português, “agiam com fidelidade” exprime naturalmente o modo habitual pelo qual esses homens desempenhavam sua responsabilidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção preserva a imagem hebraica das mãos, enquanto “repassassem” esclarece naturalmente a cadeia de entrega do dinheiro. A ambiguidade entre fidelidade, honestidade e integridade é mantida por meio de nota.
