  text: וְ/לַ/גֹּֽדְרִים֙ וּ/לְ/חֹצְבֵ֣י הָ/אֶ֔בֶן וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת בֶּ֣דֶק בֵּית יְהוָ֑ה וּ/לְ/כֹ֛ל אֲשֶׁר יֵצֵ֥א עַל הַ/בַּ֖יִת לְ/חָזְקָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: pt
  text: e aos pedreiros[a] e aos cortadores de pedra, e para comprar madeira e pedras de cantaria[b], a fim de reparar os danos na casa de Yahweh[c], bem como para todos os gastos com a casa, a fim de repará-la.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “construtores de muros”. O termo hebraico pode abranger trabalhadores de alvenaria ou de reparo de paredes.
    reason: lexical_alternative
  - marker: b
    text: Ou “pedras extraídas da pedreira” ou “pedras lavradas”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “fortalecer a brecha ou o dano da casa de Yahweh”. Aqui, “casa” se refere ao templo.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “tudo o que saísse sobre a casa”, isto é, todos os gastos necessários para repará-la.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּדְרִים
  choice: pedreiros
  rationale: O particípio designa trabalhadores que levantam ou reparam muros e estruturas de alvenaria; “pedreiros” é natural no contexto, embora o termo possa ser mais amplo.
- source_word: חֹצְבֵי הָאֶבֶן
  choice: cortadores de pedra
  rationale: A expressão se refere aos profissionais que extraem ou talham pedra; a formulação é clara e corrente.
- source_word: לִקְנוֹת עֵצִים
  choice: comprar madeira
  rationale: No contexto de construção, עֵצִים indica madeira usada na obra; “madeira” é amplamente compreensível em português.
- source_word: אַבְנֵי מַחְצֵב
  choice: pedras de cantaria
  rationale: Designa pedras extraídas e preparadas para construção; “pedras de cantaria” conserva o caráter de material trabalhado, com alternativa explicada em nota.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: reparar os estragos
  rationale: A combinação literalmente envolve fortalecer aquilo que apresenta brechas ou danos. Em português, “reparar os estragos” comunica naturalmente a ação estrutural requerida sem transformar בֶּדֶק no processo de reparo.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de YHWH”; no contexto, refere-se ao templo.
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: bem como para todas as despesas feitas com a casa
  rationale: A expressão idiomática, literalmente “tudo o que sair sobre a casa”, refere-se ao que fosse despendido na obra.
- source_word: לְחָזְקָה
  choice: a fim de repará-la
  rationale: O infinitivo expressa a finalidade dos gastos; “repará-la” é idiomático e adequado ao contexto de restauração do edifício.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Emprega o nome pessoal representado pelo tetragrama, sem substituí-lo por um título; “Yahweh” é uma transliteração acadêmica e amplamente reconhecida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe coordenada que mantém a continuidade do versículo anterior. Foram preservados “casa de Yahweh” e o sentido concreto dos danos, enquanto os idiomas financeiros e construtivos foram expressos com naturalidade.
