  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: pt
  text: E, sempre que viam que havia muito dinheiro no cofre, o secretário do rei e o sumo sacerdote subiam, faziam pacotes com ele e contavam o dinheiro encontrado no templo do SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּסֶף
  choice: dinheiro
  rationale: Embora o termo possa significar literalmente “prata”, neste contexto designa o numerário arrecadado para os reparos do templo; “dinheiro” comunica naturalmente essa função em português.
- source_word: אָרוֹן
  choice: cofre
  rationale: No contexto, trata-se de uma caixa destinada à coleta e guarda de dinheiro; “cofre” é claro e natural.
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: secretário do rei
  rationale: O título indica um oficial letrado da administração real; “secretário” evita sugerir apenas um copista.
- source_word: וַיָּצֻרוּ
  choice: juntavam em sacos
  rationale: O verbo, neste contexto, provavelmente descreve acondicionar e amarrar o dinheiro em volumes ou sacos; a formulação preserva a ação concreta sem afirmar além do necessário.
- source_word: בֵית יְהוָה
  choice: templo do SENHOR
  rationale: “Templo” é a expressão portuguesa natural para a casa cultual, e “SENHOR” segue a convenção consagrada para o Tetragrama.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma em versaletes segue a tradição bíblica portuguesa amplamente reconhecida e indica que o hebraico traz o nome divino, sem introduzir uma pronúncia reconstruída no texto principal.
- issue: Título sacerdotal הַכֹּהֵן הַגָּדוֹל
  choice: sumo sacerdote
  alternative: grande sacerdote
  rationale: “Sumo sacerdote” é a designação bíblica corrente e compreensível em português, sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com cadência narrativa. O iterativo de וַיְהִי כִּרְאוֹתָם é preservado por “E acontecia que, quando viam”. A coordenação verbal mantém a sequência administrativa do hebraico.
