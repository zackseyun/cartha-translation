  source_fidelity: 'O sentido geral está bem preservado: כֶּסֶף pode adequadamente ser vertido por “dinheiro” neste contexto, אָרוֹן por “cofre”, e בֵּית יהוה por “templo do SENHOR”. A construção inicial tem valor iterativo, adequadamente explicitável por “sempre que”. Contudo, “juntavam em sacos” não traduz com precisão suficiente וַיָּצֻרוּ, que descreve o acondicionamento/atamento do dinheiro em volumes; além disso, a formulação portuguesa fica elíptica quanto ao objeto.'
