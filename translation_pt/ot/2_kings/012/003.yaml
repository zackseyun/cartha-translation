  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: pt
  text: Joás fez o que era certo aos olhos de Yahweh durante todos os dias em que o sacerdote Joiada o instruiu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “todos os seus dias em que o sacerdote Joiada o instruiu”.'
    reason: Registra a construção hebraica, na qual a oração relativa pode qualificar “todos os seus dias”, sem converter a relação em causalidade nem afirmar inequivocamente que ela abrangeu toda a vida de Joás.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: fez o que era certo
  rationale: O adjetivo substantivado הַיָּשָׁר funciona como objeto de עשה. A formulação é natural em português e mantém a fórmula de avaliação moral característica de Reis.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica da avaliação divina e mantém o nome pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל יָמָיו אֲשֶׁר
  choice: durante todos os dias em que
  rationale: A oração relativa liga os dias da conduta correta ao período da instrução de Joiada. A tradução permanece próxima da sintaxe hebraica sem afirmar de modo inequívoco que Joás foi fiel por toda a vida.
- source_word: הוֹרָהוּ
  choice: o instruiu
  rationale: O hifil de ירה pode significar ensinar, instruir ou orientar. “Instruiu” expressa adequadamente a influência formativa de Joiada sem especificar indevidamente sua modalidade.
- source_word: יְהוֹאָשׁ
  choice: Joás
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: o sacerdote Joiada
  rationale: A ordem foi ajustada ao uso natural do português, preservando tanto o nome quanto o título.
theological_decisions:
- issue: Extensão temporal da retidão de Joás
  choice: A frase é entendida como referindo-se aos dias em que Joiada o instruiu.
  alternative: A frase pode ser entendida como afirmando que Joás agiu corretamente durante toda a vida porque Joiada o instruiu.
  rationale: A construção hebraica permite relacionar diretamente “todos os seus dias” à oração relativa seguinte. Essa leitura preserva a tensão narrativa sobre a duração da fidelidade de Joás, enquanto a nota registra a leitura causal refletida pela camada inglesa auditada.
translation_notes:
  register: Português atual, claro e digno, com sintaxe natural e vocabulário acessível. Os nomes Joás e Joiada seguem o uso bíblico consolidado em português; Yahweh preserva explicitamente o nome divino.
