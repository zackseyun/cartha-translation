source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: pt
  text: Então Jeoás, rei de Judá, tomou todas as coisas sagradas que Josafá, Jeorão e Acazias, seus antepassados[a], reis de Judá, haviam consagrado, bem como suas próprias coisas sagradas e todo o ouro encontrado nos tesouros da casa de Yahweh e da casa do rei. Ele enviou tudo isso a Hazael, rei de Arã, e Hazael se retirou de Jerusalém.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “seus pais”; aqui, a expressão significa seus antepassados ou predecessores reais.
    reason: Nota cultural e lexical para preservar a forma hebraica subjacente.
  - marker: b
    text: Lit. “e subiu de sobre Jerusalém”; a expressão indica que Hazael interrompeu seu avanço contra a cidade e se retirou.
    reason: Explica o idiomatismo hebraico e registra sua formulação literal.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Traduz diretamente לקח no contexto narrativo, sem sugerir indevidamente saque ou coerção.
- source_word: הַקֳּדָשִׁים
  choice: as coisas sagradas
  rationale: Preserva o sentido cultual de objetos separados para uso sagrado sem especificar além do hebraico.
- source_word: הִקְדִּישׁוּ
  choice: haviam consagrado
  rationale: O hifil de קדש indica dedicar ou consagrar algo para uso sagrado; o mais-que-perfeito esclarece a anterioridade.
- source_word: אֲבֹתָיו
  choice: seus antepassados
  rationale: Neste contexto dinástico, אבות designa antecessores ou ancestrais reais, não necessariamente pais imediatos.
- source_word: קֳדָשָׁיו
  choice: as coisas sagradas que ele próprio havia consagrado
  rationale: Explicita que o sufixo se refere às ofertas consagradas pelo próprio Jeoás e mantém o vínculo lexical com הַקֳּדָשִׁים.
- source_word: הַנִּמְצָא
  choice: encontrado
  rationale: Representa diretamente o particípio de מצא, descrevendo o ouro presente nos tesouros.
- source_word: בְּאֹצְרוֹת
  choice: nos tesouros
  rationale: Expressão natural em português para os depósitos de bens valiosos do templo e do palácio.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a metáfora hebraica de 'casa' e translitera o nome divino pessoal יהוה.
- source_word: בֵּית הַמֶּלֶךְ
  choice: a casa do rei
  rationale: Preserva o paralelismo formal com 'a casa de Yahweh', embora a referência seja ao palácio real.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: Ele enviou tudo isso a Hazael
  rationale: Retoma naturalmente em português o conjunto de objetos e ouro enumerado anteriormente.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: e este se retirou de Jerusalém
  rationale: A construção idiomática indica que Hazael abandonou seu avanço contra Jerusalém; 'este' torna inequívoco o sujeito contextual.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Identidade do sujeito em וַיַּעַל
  choice: Hazael, retomado por 'este'
  alternative: Jeoás
  rationale: A sequência narrativa indica que Hazael, após receber os bens, suspendeu o ataque e se retirou; a explicitação evita ambiguidade pronominal em português sem acrescentar uma nova personagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém 'casa de Yahweh' e 'casa do rei' para conservar o paralelismo hebraico; usa 'antepassados' no texto e registra a forma literal em nota.
