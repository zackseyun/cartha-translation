revisions:
- from: Então Jeoás, rei de Judá, tomou todas as coisas sagradas que Josafá, Jeorão e Acazias, seus antepassados[a], reis de Judá, haviam consagrado, bem como as coisas sagradas que ele próprio havia consagrado e todo o ouro encontrado nos tesouros da casa de Yahweh e da casa do rei. Ele enviou tudo isso a Hazael, rei de Arã, e este se retirou de Jerusalém.[b]
  to: Então Jeoás, rei de Judá, tomou todas as coisas sagradas que Josafá, Jeorão e Acazias, seus antepassados[a], reis de Judá, haviam consagrado, bem como suas próprias coisas sagradas e todo o ouro encontrado nos tesouros da casa de Yahweh e da casa do rei. Ele enviou tudo isso a Hazael, rei de Arã, e Hazael se retirou de Jerusalém.[b]
  rationale: Apenas o segundo «coisas sagradas» foi ajustado para não atribuir explicitamente a Jeoás um ato de consagração que o hebraico não enuncia nesse ponto. A repetição explícita de «Hazael» no desfecho melhora a clareza referencial em português. As notas e seus respectivos marcadores permanecem corretamente ancorados.
