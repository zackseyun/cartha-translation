  text: It happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
translation:
  language: pt
  text: No vigésimo terceiro ano do rei Jeoás, aconteceu que os sacerdotes não tinham reparado os danos na Casa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as brechas da Casa”. Aqui, “Casa” se refere ao templo.
    reason: Preserva a alternativa lexical mais concreta para בֶּדֶק e esclarece o referente contextual de הַבָּיִת.
lexical_decisions:
- source_word: וַיְהִי
  choice: aconteceu que
  rationale: A forma narrativa de היה introduz uma nova etapa do relato. “Aconteceu que” preserva essa função sem acrescentar um advérbio temporal ausente no hebraico.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: no vigésimo terceiro ano
  rationale: É a forma idiomática em português para a fórmula hebraica de datação por ano de reinado.
- source_word: לַמֶּלֶךְ יְהוֹאָשׁ
  choice: do rei Jeoás
  rationale: O לְ indica aqui o reinado usado como referência cronológica; “do rei Jeoás” é a formulação portuguesa natural.
- source_word: לֹא חִזְּקוּ
  choice: ainda não tinham reparado
  rationale: חזק significa literalmente “fortalecer”, mas, combinado com בדק הבית, denota executar reparos estruturais. O mais-que-perfeito expressa a situação ainda não concluída até o ano indicado; “ainda” torna natural essa relação temporal implícita.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Correspondência direta e corrente do substantivo hebraico.
- source_word: בֶּדֶק הַבָּיִת
  choice: os danos na Casa
  rationale: בדק designa fissuras, brechas ou partes danificadas que exigem conserto. “Danos” comunica a condição a ser reparada; “Casa” conserva a designação hebraica do templo, esclarecida em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem temporal natural. A inicial maiúscula em “Casa” sinaliza seu uso como designação do templo sem substituir no texto principal a imagem hebraica.
