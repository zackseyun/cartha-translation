  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹאָ֖שׁ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais feitos de Joás e tudo o que ele fez não estão escritos no Livro das Crônicas dos Reis de Judá[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Livro dos Anais dos Reis de Judá”. A expressão hebraica pode designar um registro oficial da corte ou uma crônica real.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais feitos
  rationale: יֶתֶר indica o restante, e דִּבְרֵי, nesta fórmula de resumo régio, abrange os atos ou feitos registrados do rei. A formulação é natural em português e preserva o sentido histórico.
- source_word: יוֹאָשׁ
  choice: Joás
  rationale: Forma tradicional e amplamente reconhecida em português para o nome deste rei de Judá.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Reproduz diretamente a abrangência de כָל e a oração relativa hebraica.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica hebraica, que espera resposta afirmativa, e conserva a imagem concreta de registros escritos.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora a preposição hebraica possa ser literalmente 'sobre', 'escritos no Livro' é o equivalente idiomático em português para uma referência documental.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: das Crônicas dos Reis de Judá
  rationale: Traduz a expressão como título de um registro histórico régio; 'Crônicas' é preciso e tradicional, enquanto a nota preserva a alternativa 'Anais'.
