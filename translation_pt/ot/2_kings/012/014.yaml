source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: pt
  text: Contudo, do dinheiro trazido à casa de Yahweh, não se faziam para a casa de Yahweh bacias de prata[a], espevitadeiras[b], bacias de aspersão[c], trombetas, nem qualquer utensílio de ouro ou de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tigelas de prata”.
    reason: lexical_alternative
  - marker: b
    text: Ou “aparadores de pavio”. O termo hebraico provavelmente se refere a um instrumento usado para cuidar das lâmpadas.
    reason: lexical_alternative
  - marker: c
    text: Ou simplesmente “bacias”. A tradução no texto explicita sua provável função ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Expressa de modo natural o contraste adversativo com o versículo anterior.
- source_word: יֵעָשֶׂה
  choice: não se faziam
  rationale: Preserva o valor passivo e impessoal do nifal, com concordância natural em português com a enumeração que segue.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a designação hebraica formal para o santuário, sem substituir 'casa' por uma explicitação interpretativa como 'templo'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: סִפּוֹת כֶּסֶף
  choice: bacias de prata
  rationale: סִפּוֹת designa recipientes ou bacias; a tradução distingue estes objetos dos מִזְרָקוֹת mencionados depois.
- source_word: מְזַמְּרוֹת
  choice: espevitadeiras
  rationale: No contexto dos utensílios do santuário, o termo provavelmente indica instrumentos usados para aparar os pavios das lâmpadas.
- source_word: מִזְרָקוֹת
  choice: bacias de aspersão
  rationale: Torna perceptível a provável função ritual desses recipientes, sem eliminar a alternativa lexical mais genérica.
- source_word: חֲצֹצְרוֹת
  choice: trombetas
  rationale: É a designação corrente e clara para as trombetas metálicas de uso cultual.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: qualquer utensílio de ouro ou de prata
  rationale: Utensílio comunica a amplitude de כְּלִי e preserva o sentido distributivo da expressão.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: com o dinheiro trazido
  rationale: Neste contexto administrativo, כֶּסֶף se refere aos fundos arrecadados; 'com' expressa naturalmente o uso do dinheiro indicado pelo hebraico מִן.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de alcance internacional. A repetição de “casa de Yahweh” acompanha a estrutura enfática do hebraico; os marcadores de nota foram posicionados junto aos termos a que realmente se referem.
