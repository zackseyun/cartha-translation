  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: pt
  text: Contudo, os lugares altos[a] não foram removidos; o povo ainda oferecia sacrifícios e queimava incenso nos lugares altos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santuários”; em hebraico, “lugares altos” refere-se a locais de culto, tradicionalmente associados a elevações.
    reason: Alternativa lexical e esclarecimento histórico-cultural.
lexical_decisions:
- source_word: רַק
  choice: Contudo
  rationale: Introduz uma ressalva à avaliação positiva anterior, preservando a força adversativa do hebraico em português natural.
- source_word: הַבָּמוֹת
  choice: os lugares altos
  rationale: Mantém o termo histórico-cúltico tradicional para locais de culto situados em elevações ou plataformas, sem reduzir seu sentido simplesmente a “santuários”.
- source_word: לֹא סָרוּ
  choice: não foram eliminados
  rationale: Com “lugares altos” como sujeito, expressa de modo idiomático que esses locais não foram suprimidos.
- source_word: עוֹד
  choice: ainda
  rationale: Indica a continuidade da prática cultual apesar da ressalva apresentada.
- source_word: הָעָם
  choice: o povo
  rationale: Tradução direta e natural do substantivo coletivo.
- source_word: מְזַבְּחִים
  choice: oferecia sacrifícios
  rationale: O particípio descreve uma prática contínua ou habitual; esta formulação é clara e idiomática em português.
- source_word: וּמְקַטְּרִים
  choice: e queimava incenso
  rationale: No contexto cultual, קטר normalmente se refere à queima de incenso ou à produção de fumaça sacrificial; “queimava incenso” é a leitura contextual mais provável e natural.
- source_word: בַּבָּמוֹת
  choice: nos lugares altos
  rationale: Indica o local em que o povo continuava realizando essas práticas cultuais.
theological_decisions:
- issue: Avaliação do culto nos lugares altos
  choice: Manter a designação histórica “lugares altos” sem explicitar no texto principal a ilegitimidade desses locais.
  alternative: “santuários” ou uma formulação que os qualifique expressamente como locais de culto não autorizados
  rationale: O versículo registra sua permanência e uso dentro de uma ressalva crítica, mas não acrescenta uma explicação teológica explícita. A tradução preserva essa tensão sem importar comentário denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Contudo” assinala com clareza a ressalva; o imperfeito em “oferecia” e “queimava” comunica prática habitual e contínua.
