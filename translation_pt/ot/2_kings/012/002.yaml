  text: בִּ/שְׁנַת שֶׁ֤בַע לְ/יֵהוּא֙ מָלַ֣ךְ יְהוֹאָ֔שׁ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּ/ירֽוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: pt
  text: No sétimo ano de Jeú, Jeoás tornou-se rei e reinou quarenta anos em Jerusalém. Sua mãe se chamava Zíbia e era de Berseba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: No sétimo ano de Jeú
  rationale: A fórmula régia hebraica situa a ascensão de Jeoás no sétimo ano do reinado de Jeú; esta redação é natural em português e preserva a referência cronológica.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: Jeoás tornou-se rei
  rationale: Neste contexto de ascensão, מָלַךְ tem sentido ingressivo. “Tornou-se rei” distingue o início do reinado da duração indicada logo depois.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: e reinou quarenta anos
  rationale: Aqui מָלַךְ descreve a duração do governo; “reinou” é preciso e idiomático.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Tradução direta do uso locativo da preposição בְּ.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Expressa de modo natural em português a fórmula hebraica “o nome de sua mãe era”, sem perda de conteúdo.
- source_word: צִבְיָה
  choice: Zíbia
  rationale: Transliteração portuguesa consagrada do nome pessoal hebraico.
- source_word: מִבְּאֵר שָׁבַע
  choice: e era de Berseba
  rationale: A preposição מִן indica procedência. A formulação explicita de maneira natural que Berseba era o lugar de origem de Zíbia.
