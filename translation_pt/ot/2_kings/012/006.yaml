source:
  edition: WLC
  text: יִקְח֤וּ לָ/הֶם֙ הַ/כֹּ֣הֲנִ֔ים אִ֖ישׁ מֵ/אֵ֣ת מַכָּר֑/וֹ וְ/הֵ֗ם יְחַזְּקוּ֙ אֶת בֶּ֣דֶק הַ/בַּ֔יִת לְ/כֹ֛ל אֲשֶׁר יִמָּצֵ֥א שָׁ֖ם בָּֽדֶק־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: pt
  text: Que os sacerdotes recebam para si, cada um de seu doador[a], e que eles reparem os danos do templo[b], onde quer que se encontre algum dano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de seu conhecido”. O termo hebraico pode designar alguém conhecido do sacerdote ou alguém com quem ele mantinha relações; neste contexto de coleta, provavelmente se refere à pessoa de quem ele recebia a contribuição.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da casa”; aqui, a expressão se refere ao templo.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ
  choice: recebam
  rationale: O imperfeito tem força diretiva no contexto. Em português, “que ... recebam” expressa naturalmente a instrução e se ajusta à coleta de contribuições.
- source_word: לָהֶם
  choice: para si
  rationale: A preposição com o pronome indica que os sacerdotes recebem os valores sob sua responsabilidade; “para si” preserva essa relação sem afirmar que fossem para benefício pessoal.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente e preciso no contexto da administração do templo.
- source_word: אִישׁ
  choice: cada um
  rationale: O substantivo tem uso distributivo depois do sujeito plural e se refere individualmente a cada sacerdote.
- source_word: מֵאֵת מַכָּרוֹ
  choice: de seu doador
  rationale: מַכָּר pode designar alguém conhecido ou alguém com quem se mantém relação. No contexto da coleta, “doador” comunica de modo claro a provável função da pessoa, enquanto a alternativa mais literal é mantida em nota.
- source_word: וְהֵם
  choice: e que eles
  rationale: O pronome explícito dá ênfase aos sacerdotes como responsáveis pela obra; sua presença é preservada em português.
- source_word: יְחַזְּקוּ
  choice: reparem
  rationale: Embora o sentido básico seja “fortalecer”, no contexto de manutenção de um edifício o verbo significa efetuar reparos.
- source_word: בֶּדֶק הַבַּיִת
  choice: os danos do templo
  rationale: בֶּדֶק indica avaria, fissura ou parte danificada que exige reparo. “Templo” explicita o referente contextual de “a casa” e evita possível confusão em português.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: onde quer que se encontre algum dano
  rationale: A formulação preserva a abrangência indefinida da expressão e a ideia de reparar todo dano descoberto no edifício.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção diretiva natural (“que ... recebam”; “que ... reparem”). “Templo” foi usado no texto para tornar explícito o referente contextual de הַבַּיִת, enquanto a forma literal foi registrada em nota. A repetição de “dano” conserva a correspondência com o hebraico.
