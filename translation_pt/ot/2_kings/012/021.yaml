base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: pt
  text: E seus servos se levantaram, tramaram uma conspiração e golpearam Joás em Bete-Milo, na descida para Silá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no caminho que desce para Silá”. O hebraico descreve literalmente um acesso descendente em direção a Silá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: os seus servos
  rationale: Em contexto real, עֶבֶד designa subordinados do rei. “Servos” conserva a amplitude do hebraico sem especificá-los interpretativamente como oficiais.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: tramaram uma conspiração
  rationale: A combinação do verbo קשׁר com o substantivo cognato קֶשֶׁר é uma expressão enfática para organizar uma conspiração. A formulação mantém verbo e objeto sem soar excessivamente artificial em português.
- source_word: וַיַּכּוּ
  choice: golpearam
  rationale: נכה significa de modo amplo “ferir” ou “golpear”. O contexto indica que o ataque foi fatal, mas “golpearam” evita substituir o verbo do versículo pelo mais específico “mataram”.
- source_word: בֵּית מִלֹּא
  choice: Bete-Milo
  rationale: A expressão funciona como nome de lugar; por isso, é transliterada segundo uma forma clara e tradicional em português, em vez de ser traduzida como “casa de Milo”.
- source_word: הַיּוֹרֵד סִלָּא
  choice: na descida para Silá
  rationale: O particípio יֹרֵד descreve um acesso descendente associado a Silá. A tradução preserva o sentido topográfico de forma concisa e natural.
- source_word: סִלָּא
  choice: Silá
  rationale: Nome próprio de lugar, transliterado com acento para indicar a pronúncia natural em português.
theological_decisions: []
