base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: pt
  text: O dinheiro[a] das ofertas pela culpa e o dinheiro das ofertas pelo pecado não devia ser levado à casa de Yahweh[b]; pertencia aos sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A prata das ofertas pela culpa e a prata das ofertas pelo pecado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, o templo de Yahweh. Hebraico: “casa de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: dinheiro
  rationale: Embora o termo denote literalmente “prata”, neste contexto de recursos ligados às ofertas ele se refere ao valor monetário destinado aos sacerdotes. “Dinheiro” comunica com naturalidade essa função, enquanto a alternativa literal é preservada em nota.
- source_word: אָשָׁם
  choice: ofertas pela culpa
  rationale: No contexto sacrificial, designa a oferta apresentada por culpa ou reparação. A formulação mantém a categoria cultual reconhecível sem acrescentar uma interpretação específica sobre sua função.
- source_word: חַטָּאוֹת
  choice: ofertas pelo pecado
  rationale: O plural se refere aqui às ofertas sacrificiais, e não aos pecados em sentido abstrato. “Ofertas pelo pecado” é claro, tradicional e adequado ao contexto.
- source_word: לֹא יוּבָא
  choice: não era levado
  rationale: O imperfeito passivo negado descreve a prática ou regra de administração desses recursos. O singular concorda naturalmente com “dinheiro” como substantivo coletivo.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de YHWH” e verte diretamente o nome divino como “Yahweh”; o referente ao templo é esclarecido em nota.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: pertencia aos sacerdotes
  rationale: A oração indica destinação ou posse. O singular retoma de modo natural o dinheiro mencionado como uma categoria coletiva, sem alterar a distribuição aos sacerdotes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Sentido cultual de חַטָּאוֹת
  choice: ofertas pelo pecado
  alternative: ofertas de purificação
  rationale: Ambas as designações são discutidas para essa categoria sacrificial. “Ofertas pelo pecado” mantém a formulação amplamente reconhecida e não elimina a possível dimensão purificadora do rito.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “dinheiro” acompanha a estrutura hebraica e distingue as duas categorias de oferta.
