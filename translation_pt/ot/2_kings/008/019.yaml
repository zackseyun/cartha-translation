  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: pt
  text: 'Contudo, Yahweh não quis destruir Judá, por causa de Davi, seu servo, conforme lhe havia dito: que lhe daria uma lâmpada[b] para seus filhos, por todos os dias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Lâmpada” é uma imagem régia que representa a continuidade da linhagem ou dinastia de Davi.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Contudo, ... não quis
  rationale: A conjunção introduz contraste com o juízo narrado no contexto, e אָבָה expressa vontade ou consentimento. “Não quis” é natural em português e preserva essa nuance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: destruir Judá
  rationale: O infinitivo causativo de שׁחת indica aqui a destruição de Judá como ato de juízo; a formulação é direta e natural.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: por causa de Davi, seu servo
  rationale: Expressa a consideração de Yahweh por Davi e conserva a designação teológica de Davi como servo.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: conforme lhe havia dito
  rationale: Traduz o verbo אָמַר de modo direto, sem tornar explícita no texto principal sua força contextual de promessa; essa possibilidade aparece em nota.
- source_word: נִיר
  choice: uma lâmpada
  rationale: Preserva a imagem concreta empregada para a continuidade da casa real de Davi, sem substituí-la pela interpretação “dinastia” ou “linhagem”.
- source_word: לְבָנָיו
  choice: para seus filhos
  rationale: Reflete diretamente a preposição לְ e o substantivo masculino plural, preservando a referência aos sucessores reais sem impor a leitura instrumental “por meio de”.
- source_word: כָּל הַיָּמִים
  choice: em todos os tempos
  rationale: Comunica duração contínua em português corrente, sem reduzir a expressão a uma repetição diária nem tornar “para sempre” a única leitura possível.
theological_decisions:
- issue: Imagem dinástica נִיר
  choice: uma lâmpada
  alternative: uma luz; uma dinastia
  rationale: A metáfora real deve permanecer visível por sua importância para a promessa davídica e para as conexões internas do texto bíblico.
- issue: Força de אָמַר no contexto da aliança
  choice: havia dito
  alternative: havia prometido
  rationale: O texto principal conserva o sentido lexical básico, enquanto a nota registra que, no contexto, a declaração funciona como promessa.
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: A transliteração preserva o nome próprio no texto, evitando substituí-lo por um título; “Yahweh” também mantém continuidade com a camada de consulta fornecida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase permanece próxima do hebraico, mas a pontuação e as ligações sintáticas foram ajustadas ao uso natural do português. As notas foram posicionadas junto às expressões que efetivamente explicam.
