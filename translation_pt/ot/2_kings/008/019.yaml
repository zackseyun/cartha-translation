  source_fidelity: 'O texto acompanha fielmente a estrutura e os principais termos do hebraico: o contraste inicial, a recusa de Yahweh, Judá, Davi como seu servo, a referência ao que foi dito, e a metáfora da lâmpada. «Por causa de» é aceitável para לְמַעַן. A expressão final «em todos os tempos», porém, é menos precisa: pode sugerir ocorrência em cada época, em vez da duração contínua expressa por «todos os dias».'
