  terminology: «Yahweh», «Judá», «Davi, seu servo» e «lâmpada» são adequados e consistentes. A nota sobre «lâmpada» explica a imagem dinástica sem substituí-la no texto. «Imagem régia» soa mais idiomático do que «imagem da realeza».
