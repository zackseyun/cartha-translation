  to: 'Contudo, Yahweh não quis destruir Judá, por causa de Davi, seu servo, conforme lhe havia dito: que lhe daria uma lâmpada[b] para seus filhos, por todos os dias.'
  rationale: A revisão é limitada à formulação temporal final e à pontuação, para refletir com maior precisão כָּל הַיָּמִים e tornar a sintaxe portuguesa mais transparente. A nota [a] foi removida, pois «conforme lhe havia prometido» não é uma alternativa lexical estrita para אָמַר («disse»), mas uma explicitação contextual interpretativa; a nota [b] permanece ancorada na metáfora que explica.
