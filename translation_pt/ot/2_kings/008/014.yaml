base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: pt
  text: 'Então ele partiu de Eliseu e foi ao seu senhor,[a] que lhe perguntou: “O que Eliseu lhe disse?” Ele respondeu: “Disse-me: ‘Certamente você se recuperará.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi ao seu amo” ou “foi ao seu senhor”. O hebraico usa um título para o superior humano de Hazael; aqui se refere ao rei Ben-Hadade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: saiu da presença de Eliseu
  rationale: A combinação de הלך com מֵאֵת indica afastamento da presença de Eliseu; esta formulação é natural em português e preserva o movimento de partida.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: voltou ao seu senhor
  rationale: בוא אֶל descreve a chegada junto ao superior de Hazael. No contexto, o movimento é de retorno ao rei; “senhor” conserva o título relacional sem sugerir um título divino, pois aparece em minúscula.
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: O que Eliseu lhe disse?
  rationale: Formulação corrente e clara em português para a pergunta hebraica.
- source_word: אָמַר לִי
  choice: Disse-me
  rationale: Tradução direta, natural e concisa, adequada à introdução do discurso citado.
- source_word: חָיֹה תִחְיֶה
  choice: Certamente você se recuperará
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a afirmação. Embora o sentido literal seja “certamente viverá”, no contexto da enfermidade a expressão comunica recuperação.
theological_decisions:
- issue: Sentido de אֲדֹנָיו em contexto humano
  choice: seu senhor
  alternative: seu amo
  rationale: O referente é o superior humano de Hazael, não Deus. “Senhor”, em minúscula, preserva o tratamento hierárquico da corte; “amo” soaria mais ligado à escravidão e menos apropriado ao ambiente cortesão.
- issue: Tradução contextual de חָיֹה תִחְיֶה
  choice: Certamente você se recuperará
  alternative: Certamente você viverá
  rationale: A fala responde a uma consulta sobre doença, de modo que “recuperará” expressa o valor contextual. A tradução não resolve a tensão narrativa entre a resposta relatada por Hazael e a revelação mais ampla de Eliseu nos versículos adjacentes.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “você” no discurso direto para naturalidade contemporânea e mantém “senhor” em minúscula para marcar claramente o referente humano.
