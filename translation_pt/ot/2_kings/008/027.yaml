  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ בֵּ֣ית אַחְאָ֔ב וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּ֛י חֲתַ֥ן בֵּית אַחְאָ֖ב הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: pt
  text: Ele seguiu o caminho da casa de Acabe e fez o que era mau aos olhos de Yahweh, como a casa de Acabe, pois era ligado por casamento[a] à casa de Acabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era genro da casa de Acabe”. O termo hebraico pode indicar especificamente um genro ou, em sentido mais amplo, alguém ligado a uma família por casamento.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: seguiu o caminho
  rationale: A expressão hebraica descreve conduta, não simples deslocamento. “Seguiu o caminho” conserva a metáfora e soa natural em português atual.
- source_word: בֵּית אַחְאָב
  choice: casa de Acabe
  rationale: בַּיִת pode abranger família, casa real e dinastia. A formulação tradicional preserva essa amplitude.
- source_word: וַיַּעַשׂ הָרַע
  choice: fez o que era mau
  rationale: Reproduz com clareza a fórmula avaliativa recorrente em Reis sem intensificar o sentido.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Mantém a imagem hebraica de avaliação divina em uma expressão corrente e compreensível em português.
- source_word: כְּבֵית אַחְאָב
  choice: como a casa de Acabe
  rationale: Conserva a comparação concisa do hebraico e liga a conduta do rei ao padrão moral daquela casa.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a razão apresentada pela oração final.
- source_word: חֲתַן
  choice: ligado por casamento
  rationale: O termo indica uma relação criada por casamento e pode ter o sentido específico de “genro”. Neste contexto, a expressão mais ampla evita definir além do que o termo e a relação dinástica exigem.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” representa o nome próprio e evita substituí-lo por um título.
- issue: Relação de Acazias com a casa de Acabe
  choice: ligado por casamento
  alternative: genro
  rationale: חֲתַן pode designar especificamente um genro, mas também uma relação de afinidade matrimonial mais ampla. A tradução principal preserva essa elasticidade sem impor uma reconstrução genealógica específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A expressão “seguiu o caminho” preserva a metáfora moral do hebraico; “casa de Acabe” mantém a possível referência tanto à família quanto à dinastia.
