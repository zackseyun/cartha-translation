base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: pt
  text: Então o rei Jorão voltou a Jezreel para se recuperar[a] dos ferimentos[b] que os arameus[c] lhe causaram em Ramá, quando lutava contra Hazael, rei de Arã. E Acazias, filho de Jeorão, rei de Judá, desceu a Jezreel para ver[d] Jorão, filho de Acabe, pois Jorão estava doente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para ser curado”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “golpes”.'
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, “sírios”.
    reason: lexical_alternative
  - marker: d
    text: Ou “para visitar”. O hebraico diz literalmente “para ver”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוב na sequência narrativa indica que Jorão retornou a Jezreel depois da batalha.
- source_word: לְהִתְרַפֵּא
  choice: para se recuperar
  rationale: O hitpael de רפא pode significar curar-se ou ser curado; “se recuperar” expressa com naturalidade a convalescença sem sugerir que Jorão efetuou a própria cura.
- source_word: מִן הַמַּכִּים
  choice: dos ferimentos
  rationale: Embora מַכִּים designe literalmente golpes, neste contexto militar e médico refere-se aos ferimentos resultantes.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: que os arameus lhe causaram
  rationale: A formulação comunica naturalmente que os ferimentos foram produzidos pelos golpes dos arameus, preservando a referência histórica a Arã.
- source_word: בָּרָמָה
  choice: em Ramá
  rationale: Reproduz o topônimo conforme a vocalização massorética do WLC, sem substituir silenciosamente o nome por outra identificação geográfica.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל
  choice: quando lutava contra Hazael
  rationale: A construção infinitiva com בְּ indica a circunstância temporal; em português, “lutar contra” é a regência natural.
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: E Acazias... desceu
  rationale: “Desceu” preserva a direção expressa por ירד e a conjunção mantém a progressão narrativa.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: para ver Jorão
  rationale: Mantém o sentido literal de ראה, embora no contexto a expressão possa denotar uma visita ao enfermo.
- source_word: כִּי חֹלֶה הוּא
  choice: pois ele estava doente
  rationale: חֹלֶה descreve o estado de enfermidade de Jorão; “doente” evita reduzir a expressão apenas ao fato de estar ferido.
