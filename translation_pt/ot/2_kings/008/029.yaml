translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de nomes familiares ao leitor lusófono. A tradução segue de perto o hebraico, mas emprega construções naturais, como “se recuperar dos ferimentos” e “lhe causaram”. Os marcadores de nota aparecem junto às expressões correspondentes.
