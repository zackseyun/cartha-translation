  text: וַ/יָּבֹ֤א אֱלִישָׁע֙ דַּמֶּ֔שֶׂק וּ/בֶן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם חֹלֶ֑ה וַ/יֻּגַּד ל֣/וֹ לֵ/אמֹ֔ר בָּ֛א אִ֥ישׁ הָ/אֱלֹהִ֖ים עַד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: pt
  text: 'Então Eliseu foi a Damasco. Ben-Hadade, rei de Arã, estava doente, e lhe anunciaram: “O homem de Deus chegou até aqui.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... foi
  rationale: O wayyiqtol faz a narrativa avançar. Em português, “Então” marca naturalmente a progressão, e “foi a Damasco” expressa de modo idiomático o movimento até o lugar indicado.
- source_word: אֱלִישָׁע
  choice: Eliseu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: דַּמֶּשֶׂק
  choice: Damasco
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: וּבֶן־הֲדַד
  choice: Ben-Hadade
  rationale: Forma portuguesa reconhecível do nome; a oração seguinte fornece informação circunstancial sobre o rei, sem necessidade de reproduzir mecanicamente a conjunção hebraica.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: “Arã” representa diretamente o termo etnogeográfico hebraico, evitando substituí-lo pelo termo interpretativo tradicional “Síria”.
- source_word: חֹלֶה
  choice: estava doente
  rationale: O particípio predicativo descreve o estado em que Ben-Hadade se encontrava.
- source_word: וַיֻּגַּד לוֹ
  choice: lhe anunciaram
  rationale: O passivo impessoal hebraico é expresso naturalmente em português por sujeito indeterminado, preservando o fato de que os informantes não são identificados.
- source_word: לֵאמֹר
  choice: introdução direta por dois-pontos
  rationale: A fórmula hebraica de citação é representada idiomaticamente pela pontuação portuguesa, sem o pouco natural “dizendo”.
- source_word: בָּא
  choice: chegou
  rationale: O perfeito indica que a chegada já ocorreu, com relevância presente no discurso; “chegou” é natural em português e o contexto implica que ele agora está no local.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém o título hebraico literalmente, sem explicá-lo como “profeta” e assim reduzir sua ressonância narrativa.
- source_word: עַד הֵנָּה
  choice: até aqui
  rationale: Reproduz o valor espacial explícito de עַד e a perspectiva dêitica do relato feito ao rei.
theological_decisions: []
