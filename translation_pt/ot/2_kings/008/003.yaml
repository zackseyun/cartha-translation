base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: pt
  text: Ao fim de sete anos, a mulher voltou da terra dos filisteus e saiu para apelar[a] ao rei por sua casa e por seu campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “clamar ao rei” ou “suplicar ao rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: Ao fim de sete anos
  rationale: A expressão com מִן e קָצֶה marca o término do período; esta formulação é natural e mantém o valor temporal do hebraico.
- source_word: וַתָּשָׁב
  choice: voltou
  rationale: שׁוּב indica que a mulher regressou do lugar onde havia residido durante a fome.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים
  choice: da terra dos filisteus
  rationale: Reproduz de modo transparente a expressão geográfica hebraica, em vez de substituí-la por “Filístia”.
- source_word: וַתֵּצֵא
  choice: foi
  rationale: Neste encadeamento narrativo, יָצָא introduz a iniciativa de dirigir-se ao rei; “foi” comunica naturalmente esse movimento sem a rigidez de “saiu para”.
- source_word: לִצְעֹק
  choice: apelar
  rationale: Embora צָעַק signifique literalmente “clamar”, diante do rei e em uma questão de restituição de bens o verbo tem sentido de pedido de reparação. A alternativa literal é preservada em nota.
- source_word: אֶל הַמֶּלֶךְ
  choice: ao rei
  rationale: אֶל indica o destinatário a quem a petição foi dirigida.
- source_word: בֵּיתָהּ
  choice: sua casa
  rationale: בַּיִת, em paralelo com “campo” e no contexto de restituição de propriedade, refere-se mais provavelmente ao imóvel.
- source_word: שָׂדָהּ
  choice: seu campo
  rationale: שָׂדֶה designa especificamente campo ou terreno cultivável; “campo” preserva essa especificidade.
