base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: pt
  text: E Jorão descansou com seus antepassados[a] e foi sepultado com eles na Cidade de Davi. Acazias, seu filho, reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deitou-se com seus pais”; trata-se de uma fórmula régia convencional que indica sua morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: No contexto da fórmula régia de morte, o verbo שׁכב é idiomático. “Descansou” mantém a imagem hebraica de deitar-se sem produzir a estranheza de uma tradução excessivamente literal; a nota explicita o sentido.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: Embora “pais” seja mais literal, em português atual “antepassados” comunica com clareza a referência dinástica aos ancestrais e evita sugerir apenas o pai imediato.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: foi sepultado com eles
  rationale: O passivo “foi sepultado” reproduz naturalmente o nifal. “Com eles” evita uma repetição pesada, mantendo como antecedente os antepassados.
- source_word: בְּעִיר דָּוִד
  choice: na Cidade de Davi
  rationale: É a designação geográfica estabelecida e transparente em português.
- source_word: וַיִּמְלֹךְ
  choice: reinou
  rationale: Preserva a fórmula de sucessão régia sem acrescentar aspecto incoativo não explícito no hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Expressa de modo natural a ideia de sucessão contida em תַּחְתָּיו.
- source_word: יוֹרָם
  choice: Jorão
  rationale: Forma portuguesa tradicional e diretamente correspondente ao hebraico Yoram, sem harmonizá-lo com a forma mais longa Jeorão.
- source_word: אֲחַזְיָהוּ
  choice: Acazias
  rationale: Forma consagrada em português para o nome hebraico אֲחַזְיָהוּ.
