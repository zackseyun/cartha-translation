base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: pt
  text: E aconteceu no dia seguinte que ele pegou o pano de cobertura[a], mergulhou-o na água e o estendeu sobre o rosto dele, e ele morreu[b]. Então Hazael reinou em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a cobertura da cama», «a colcha» ou «o tecido trançado». O termo hebraico é raro, e não se sabe ao certo que tipo de tecido era.
    reason: lexical_alternative
  - marker: b
    text: O hebraico não diz explicitamente quem realizou essas ações. Pelo contexto, muitos entendem que foi Hazael, mas o texto usa apenas «ele» até Hazael ser nomeado na oração final.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: No dia seguinte
  rationale: Expressa naturalmente a sequência temporal indicada pelo hebraico.
- source_word: הַמַּכְבֵּר
  choice: a coberta
  rationale: O substantivo raro designa algum tipo de tecido usado para cobrir; a tradução evita especificar além da evidência, e a incerteza lexical é registrada em nota.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: mergulhou-a em água
  rationale: Reproduz diretamente o sentido de mergulhar ou imergir o objeto em água.
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: a estendeu sobre o rosto dele
  rationale: Preserva a ação física de estender o tecido e usa «dele» para não sugerir reflexividade nem identificar indevidamente o referente.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Mantém a sequência narrativa simples do hebraico sem explicitar uma relação final ou causal.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: Então Hazael reinou em seu lugar
  rationale: Preserva a fórmula de sucessão e a progressão da narrativa.
theological_decisions:
- issue: Sujeito não expresso dos verbos «pegou», «mergulhou» e «estendeu»
  choice: Manter o pronome «ele» sem nomear o agente no texto principal
  alternative: Identificar explicitamente Hazael como agente, ou entender o agente como um assistente não identificado
  rationale: As formas verbais hebraicas não nomeiam o sujeito. Embora o contexto leve muitos a inferir Hazael, ele só é nomeado na oração final; a tradução conserva essa ambiguidade.
- issue: Referente dos pronomes em «seu rosto» e «ele morreu»
  choice: Usar «o rosto dele» e «ele morreu», preservando a referência contextual sem acrescentar nomes
  alternative: Explicitar Ben-Hadade como a pessoa cujo rosto foi coberto e que morreu
  rationale: O contexto identifica naturalmente o rei enfermo, mas o versículo emprega apenas formas pronominais; a tradução não torna explícito o que o hebraico deixa implícito.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. «Coberta» é corrente e funcional; a nota preserva a incerteza do termo raro. A construção «o rosto dele» evita a possível leitura reflexiva de «seu próprio rosto» e ajuda a conservar a ambiguidade dos participantes.
