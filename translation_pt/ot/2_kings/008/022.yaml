  source_fidelity: A primeira oração transmite adequadamente a revolta política de Edom e sua continuidade até o tempo do narrador. Contudo, «Naquela mesma época» funde אָז («então») e בָּעֵת הַהִיא («naquela época»), deixando de representar separadamente a progressão narrativa e a localização temporal presentes no hebraico.
  naturalness: O texto é claro e moderno. «Então, naquela época, Libna também se rebelou» mantém a ênfase temporal do original sem deixar de soar natural em português narrativo.
  terminology: «Domínio de Judá» comunica de modo apropriado o sentido político do idiomatismo «debaixo da mão de Judá». «Libna» é uma forma portuguesa estabelecida. A nota deve oferecer alternativas lexicais reais, sem ampliar a alternativa para a inferência histórica de independência contínua.
