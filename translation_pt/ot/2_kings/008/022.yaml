  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: pt
  text: Assim, Edom se rebelou contra o domínio de Judá e permanece assim até hoje[a]. Então, naquela época, Libna também se rebelou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “revoltou-se” ou “rompeu com o domínio de Judá”. O verbo hebraico descreve uma revolta política contra um governo estabelecido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: se rebelou
  rationale: No contexto político, פשע indica revolta contra um poder estabelecido. “Rebelou-se” preserva esse sentido em português atual.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: contra o domínio de Judá
  rationale: A expressão hebraica literalmente descreve Edom saindo “de debaixo da mão de Judá”; “domínio” comunica naturalmente a ideia de sujeição e controle político.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: e permanece assim até hoje
  rationale: A fórmula indica que o resultado da revolta continuava vigente no tempo do narrador. A explicitação mínima evita que “até hoje” pareça modificar apenas o ato pontual de rebelar-se.
- source_word: אָז
  choice: Naquela mesma época
  rationale: אָז liga a revolta de Libna ao mesmo período histórico; a combinação natural com בָּעֵת הַהִיא evita repetição temporal pouco idiomática.
- source_word: תִּפְשַׁע
  choice: também se rebelou
  rationale: O mesmo verbo político da primeira oração pede tradução consistente; “também” torna clara a relação narrativa entre os dois levantes.
- source_word: לִבְנָה
  choice: Libna
  rationale: Forma tradicional e natural do topônimo em português.
- source_word: בָּעֵת הַהִיא
  choice: naquela mesma época
  rationale: A expressão situa a revolta de Libna no período mencionado; “mesma” comunica a ligação contextual sem acrescentar uma precisão cronológica indevida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção idiomática “contra o domínio” substitui a imagem hebraica pouco natural “de debaixo da mão”, preservando seu sentido político. A continuidade indicada pela fórmula temporal foi expressa sem resolver além do que o contexto permite.
