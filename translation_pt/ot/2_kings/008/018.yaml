  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: pt
  text: Ele seguiu o caminho dos reis de Israel, como havia feito a casa de Acabe, pois a filha de Acabe era sua esposa; e fez o que era mau aos olhos de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: seguiu o caminho
  rationale: A expressão hebraica descreve a conduta segundo um padrão. “Seguiu o caminho” conserva a metáfora e soa natural em português.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: dos reis de Israel
  rationale: Construção genitiva direta que identifica os reis do reino do norte como modelo de conduta.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: como havia feito a casa de Acabe
  rationale: Mantém o coletivo singular “casa” com o verbo no singular idiomático em português e apresenta a conduta da dinastia de Acabe como padrão anterior.
- source_word: בֵּית אַחְאָב
  choice: a casa de Acabe
  rationale: Em contexto régio, “casa” pode designar família ou dinastia; a tradução preserva a expressão hebraica sem eliminar essa amplitude.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da ligação de Jeorão com a casa de Acabe.
- source_word: בַּת אַחְאָב
  choice: a filha de Acabe
  rationale: Representação natural e direta da cadeia construta hebraica.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: era sua esposa
  rationale: O idioma hebraico indica aqui uma relação matrimonial já existente, não necessariamente o momento em que ela se tornou esposa.
- source_word: וַיַּעַשׂ הָרַע
  choice: fez o que era mau
  rationale: Reproduz a fórmula avaliativa e reflete o artigo em הָרַע, com formulação clara em português atual.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora hebraica da avaliação divina e translitera o nome pessoal divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” representa o nome pessoal diretamente, sem o substituir por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora do “caminho” e a expressão “casa de Acabe” foram preservadas; a sintaxe foi ajustada para fluência natural.
