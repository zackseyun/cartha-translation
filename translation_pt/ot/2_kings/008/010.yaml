  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע לֵ֥ךְ אֱמָר לא חָיֹ֣ה תִחְיֶ֑ה וְ/הִרְאַ֥/נִי יְהוָ֖ה כִּֽי מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: pt
  text: 'Então Eliseu lhe disse: “Vá e diga a ele: ‘Você certamente se recuperará’[a]. Mas Yahweh me mostrou que ele certamente morrerá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “Você certamente não viverá”. O texto hebraico neste ponto é difícil; muitos entendem o sentido como “Você certamente se recuperará”, em contraste com a revelação seguinte de que ele de fato morreria.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: Então Eliseu lhe disse
  rationale: Explicita o sujeito nomeado no hebraico e usa uma ligação narrativa natural em português.
- source_word: לֵךְ אֱמָר
  choice: Vá e diga a ele
  rationale: Preserva os dois imperativos em sequência, com formulação clara e corrente.
- source_word: לא חָיֹה תִחְיֶה
  choice: Você certamente se recuperará
  rationale: No contexto da enfermidade, “recuperar-se” comunica melhor o sentido de חיה do que o literal “viver”. A construção com infinitivo absoluto intensifica a certeza. A forma negativa difícil do texto massorético é preservada em nota.
- source_word: וְהִרְאַנִי יְהוָה
  choice: Mas Yahweh me mostrou
  rationale: “Mas” torna explícito o contraste contextual entre a mensagem a ser transmitida e a revelação recebida por Eliseu; o nome divino é transliterado como Yahweh.
- source_word: כִּי מוֹת יָמוּת
  choice: que ele certamente morrerá
  rationale: A construção hebraica com infinitivo absoluto expressa forte certeza, comunicada naturalmente pelo advérbio “certamente”.
theological_decisions:
- issue: Interpretação da cláusula difícil לא חיה תחיה
  choice: No texto principal, apresentar a instrução como anúncio de recuperação.
  alternative: “Você certamente não viverá”, seguindo literalmente a partícula negativa לא do texto massorético.
  rationale: A leitura negativa do hebraico massorético é difícil, pois enfraquece o contraste com a revelação seguinte e se ajusta mal ao desenvolvimento narrativo. A tradução principal comunica o sentido contextual provável, sem ocultar a leitura literal alternativa, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “você” no discurso direto por naturalidade contemporânea, sem perder a solenidade narrativa. Mantém “Yahweh” como representação transparente do nome divino.
