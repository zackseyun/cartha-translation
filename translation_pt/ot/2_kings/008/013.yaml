  text: וַ/יֹּ֣אמֶר חֲזָהאֵ֔ל כִּ֣י מָ֤ה עַבְדְּ/ךָ֙ הַ/כֶּ֔לֶב כִּ֣י יַעֲשֶׂ֔ה הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע הִרְאַ֧/נִי יְהוָ֛ה אֹתְ/ךָ֖ מֶ֥לֶךְ עַל אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: pt
  text: 'Hazael disse: “Mas o que é teu servo, este cão, para que faça tamanha coisa?” Eliseu respondeu: “Yahweh me mostrou que você será rei sobre Arã.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rei de Arã”; em hebraico, literalmente, “rei sobre Arã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מָה
  choice: Mas o que
  rationale: Introduz a objeção incrédula de Hazael. “Mas” expressa a força adversativa do contexto, enquanto “o que” conserva a forma incomum e autodepreciativa da pergunta.
- source_word: עַבְדְּךָ הַכֶּלֶב
  choice: este seu servo, este cão
  rationale: “Servo” preserva a fórmula cortês de autodepreciação, e “este cão” mantém a aposição e a imagem insultuosa do hebraico sem transformá-la numa afirmação explicativa.
- source_word: כִּי יַעֲשֶׂה
  choice: para fazer
  rationale: Em português, a construção com “para” transmite naturalmente a incredulidade quanto à capacidade ou possibilidade, sem decidir rigidamente entre “poderia” e “haveria de”.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: tamanha coisa
  rationale: דָּבָר é amplo e pode significar coisa, assunto ou feito. “Tamanha coisa” soa natural na pergunta e preserva a abertura lexical, além da ideia de magnitude.
- source_word: הִרְאַנִי
  choice: me mostrou
  rationale: 'Traduz de modo direto a forma causativa perfeita: Yahweh fez Eliseu ver, isto é, revelou-lhe, que Hazael seria rei.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: rei sobre Arã
  rationale: Mantém de perto a preposição עַל, “sobre”, e usa a forma portuguesa do topônimo hebraico Aram.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pessoal sem o substituir por um título.
- issue: Natureza da revelação sobre a realeza de Hazael
  choice: Yahweh me mostrou que você será rei
  alternative: Yahweh me mostrou você como rei
  rationale: A tradução comunica a revelação profética sem explicitar se ela constitui aprovação, nomeação ou simples presciência divina, distinção que o versículo não resolve.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conserva-se a autodepreciação abrupta de Hazael e a ambiguidade de “coisa”, evitando explicar no corpo do texto se a fala expressa incapacidade moral, social ou prática.
