  text: וַ/יֵּ֜לֶךְ אֶת יוֹרָ֣ם בֶּן אַחְאָ֗ב לַ/מִּלְחָמָ֛ה עִם חֲזָהאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמֹ֣ת גִּלְעָ֑ד וַ/יַּכּ֥וּ אֲרַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: pt
  text: Ele foi com Jorão, filho de Acabe, guerrear contra Hazael, rei de Arã, em Ramote-Gileade[a], e os arameus feriram Jorão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “rei da Síria” e “os sírios”; o hebraico traz “Arã” e “arameus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “golpearam Jorão”. O verbo hebraico pode ter o sentido mais geral de “golpear”; “feriram” foi escolhido porque o contexto da batalha e o relato paralelo indicam que Jorão ficou ferido, mas não morreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Ele foi
  rationale: O wayyiqtol de הלך expressa movimento de maneira simples; o contexto militar é explicitado pelo restante da frase.
- source_word: אֶת יוֹרָם
  choice: com Jorão
  rationale: 'Depois de הלך, אֵת indica acompanhamento: o sujeito foi junto com Jorão.'
- source_word: לַמִּלְחָמָה
  choice: guerrear
  rationale: Verte naturalmente a expressão idiomática de ir à guerra, sem acrescentar detalhes ausentes no hebraico.
- source_word: עִם חֲזָהאֵל
  choice: contra Hazael
  rationale: No contexto de combate, עִם assinala o adversário, embora normalmente signifique “com”.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Mantém o nome etnogeográfico hebraico, em vez da identificação tradicional com a Síria.
- source_word: בְּרָמֹת גִּלְעָד
  choice: em Ramote-Gileade
  rationale: Indica o local da batalha e emprega a forma portuguesa corrente do topônimo.
- source_word: וַיַּכּוּ
  choice: feriram
  rationale: נכה pode significar “golpear”; aqui, o contexto da batalha e a continuação narrativa apontam para um ferimento, não para a morte.
- source_word: אֲרַמִּים
  choice: os arameus
  rationale: Reproduz de modo transparente o substantivo étnico plural hebraico.
- source_word: אֶת יוֹרָם
  choice: Jorão
  rationale: Emprega a forma portuguesa correspondente a יוֹרָם e distingue-a da forma mais longa Jeorão.
theological_decisions: []
