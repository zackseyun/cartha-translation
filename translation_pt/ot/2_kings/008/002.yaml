  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: pt
  text: Então a mulher se levantou e fez conforme a palavra do homem de Deus. Ela partiu, junto com os de sua casa, e morou como estrangeira na terra dos filisteus durante sete anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: se levantou
  rationale: Preserva a sequência narrativa do wayyiqtol de קום e apresenta a ação como resposta à instrução recebida.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: fez conforme a palavra de
  rationale: Reproduz de modo claro e digno o sentido de agir em conformidade com uma instrução falada, mantendo parte da formulação hebraica.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: É a tradução transparente do título hebraico tradicionalmente aplicado a um profeta ou representante comissionado por Deus.
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: Ela partiu, junto com os de sua casa
  rationale: Explicita o pronome enfático e entende בַּיִת como a casa no sentido de grupo doméstico, não como edifício.
- source_word: וַתָּגָר
  choice: morou como estrangeira
  rationale: 'Comunica a nuance de גור: residir fora da própria terra na condição de estrangeiro, sem recorrer ao termo menos corrente “peregrinar”.'
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: na terra dos filisteus
  rationale: Mantém a expressão etnogeográfica concreta do hebraico, em vez de substituí-la pelo nome regional “Filístia”.
- source_word: שֶׁבַע שָׁנִים
  choice: durante sete anos
  rationale: Expressa naturalmente em português a duração da residência.
