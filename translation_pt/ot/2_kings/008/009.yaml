  terminology: Os nomes Hazael, Ben-Hadade e Arã preservam adequadamente as formas históricas. “Seu filho” conserva a metáfora deferencial hebraica, e “o senhor” torna explícito o tratamento respeitoso sem alterar a relação expressa. “Doença” é termo apropriado para חֳלִי.
