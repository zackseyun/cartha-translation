  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: pt
  text: 'Então Hazael foi ao encontro dele, levando consigo um presente: tudo o que havia de melhor em Damasco, uma carga para quarenta camelos. Ele chegou, pôs-se diante dele e disse: “Seu filho[a] Ben-Hadade, rei de Arã, enviou-me ao senhor, dizendo: ‘Vou me recuperar desta doença?’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seu filho” é uma forma deferente e humilde de alguém se dirigir a um superior respeitado; não indica necessariamente filiação literal.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “Viverei, livre desta doença?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: ao encontro dele
  rationale: A construção com ל expressa movimento para encontrar alguém; a formulação é natural em português e preserva o sentido direcional.
- source_word: מִנְחָה
  choice: um presente
  rationale: Neste contexto diplomático, designa uma dádiva levada a um profeta, não uma oferta cultual nem necessariamente um tributo político.
- source_word: בְיָדוֹ
  choice: levando consigo
  rationale: O hebraico diz literalmente “em sua mão”, mas o presente abrangia uma carga muito grande; a expressão portuguesa comunica de modo natural que Hazael o levou, sem sugerir que tudo estivesse fisicamente em sua mão.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: tudo o que havia de melhor em Damasco
  rationale: טוּב indica aqui os produtos ou bens excelentes de Damasco. A formulação transmite qualidade e abundância e funciona como explicação do presente.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: carga para quarenta camelos
  rationale: A expressão descreve uma quantidade suficiente para carregar quarenta camelos, sem exigir que se entenda uma carga coletiva pertencente a eles.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: pôs-se diante dele
  rationale: Preserva a fórmula formal de audiência e soa mais idiomático em português narrativo do que uma tradução rigidamente literal.
- source_word: בִּנְךָ
  choice: Seu filho
  rationale: Mantém a metáfora familiar literal e a deferência da expressão cortesã, sem substituí-la interpretativamente por “seu servo”.
- source_word: שְׁלָחַנִי אֵלֶיךָ לֵאמֹר
  choice: enviou-me até o senhor para perguntar
  rationale: No contexto, o mensageiro foi enviado para transmitir a pergunta. “Até o senhor” distingue com clareza o destinatário respeitado, e “para perguntar” verte naturalmente לֵאמֹר.
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: Vou me recuperar desta doença?
  rationale: Embora חיה signifique literalmente “viver”, com “desta doença” a pergunta idiomática é se haverá recuperação; a nota preserva a forma mais literal.
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome histórico do território, em vez de substituí-lo pela designação geopolítica posterior “Síria”.
theological_decisions:
- issue: Sentido de “Seu filho”
  choice: Preservar no texto a expressão familiar literal e explicar sua função deferencial em nota.
  alternative: Traduzir interpretativamente como “seu servo”.
  rationale: O hebraico não afirma necessariamente filiação literal, mas sua imagem não deve ser apagada; a nota permite conservar simultaneamente forma e sentido cultural.
- issue: Forma da pergunta sobre a doença
  choice: Usar a expressão idiomática “Vou me recuperar” no texto e registrar a tradução literal em nota.
  alternative: “Viverei desta doença?”
  rationale: A tradução corrente comunica o sentido contextual sem eliminar a tensão lexical do verbo “viver”, preservada na nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “o senhor” para tornar perceptível a deferência da fala, conserva os nomes históricos Hazael, Ben-Hadade e Arã e evita linguagem denominacional.
