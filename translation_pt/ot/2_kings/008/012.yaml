- from: 'Hazael perguntou: “Por que meu senhor está chorando?” Ele respondeu: “Porque sei o mal que você fará aos filhos de Israel[a]: incendiará as fortalezas deles[b], matará à espada os jovens deles, despedaçará suas crianças pequenas e rasgará o ventre de suas mulheres grávidas.”'
  to: 'Hazael disse: “Por que meu senhor está chorando?” Ele respondeu: “Porque sei o mal que você fará aos filhos de Israel[a]: incendiará as fortalezas deles[b], matará à espada seus jovens, despedaçará suas crianças pequenas e dilacerará suas mulheres grávidas.”'
  rationale: A revisão conserva o sentido e a crueza da profecia, mas substitui o verbo narrativo por seu equivalente direto e elimina a especificação adicional «o ventre». «Dilacerará suas mulheres grávidas» comunica a violência de תבקע sem suavizá-la nem adicionar um referente corporal não expresso. As âncoras e o conteúdo das notas permanecem coerentes com as expressões anotadas.
