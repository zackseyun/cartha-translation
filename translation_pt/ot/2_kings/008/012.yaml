  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: pt
  text: 'Hazael disse: “Por que meu senhor está chorando?” Ele respondeu: “Porque sei o mal que você fará aos filhos de Israel[a]: incendiará as fortalezas deles[b], matará à espada seus jovens, despedaçará suas crianças pequenas e dilacerará suas mulheres grávidas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao povo de Israel” ou “aos israelitas”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “enviará as fortalezas deles ao fogo”; também se pode traduzir por “queimará as suas fortalezas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É um título respeitoso dirigido a Eliseu, não um título divino. “Meu senhor” preserva a deferência social em português natural.
- source_word: בֹכֶה
  choice: está chorando
  rationale: O particípio indica uma ação em curso; a locução verbal comunica isso de modo claro e atual.
- source_word: כִּי יָדַעְתִּי
  choice: Porque sei
  rationale: A conjunção introduz a explicação de Eliseu, e o perfeito hebraico tem relevância presente.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: o mal que você fará
  rationale: A construção incorpora רָעָה à oração relativa de modo natural, preservando o peso moral do termo.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a expressão hebraica tradicional e sua referência coletiva ao povo de Israel, sem eliminar sua forma concreta.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: incendiará as fortalezas deles
  rationale: Expressa em português corrente o sentido do idiomatismo literal “enviar ao fogo”, conservando o caráter militar de מִבְצָר.
- source_word: וּבַחֻרֵיהֶם
  choice: os jovens deles
  rationale: O substantivo designa homens jovens em pleno vigor, frequentemente aptos para a guerra; “jovens” evita acrescentar uma função militar não explicitada.
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: matará à espada
  rationale: Preserva tanto a ação violenta quanto o instrumento indicado no hebraico.
- source_word: עֹלְלֵיהֶם
  choice: suas crianças pequenas
  rationale: O termo se refere a crianças muito novas, sem necessariamente limitar a referência apenas a recém-nascidos.
- source_word: תְּרַטֵּשׁ
  choice: despedaçará
  rationale: Reproduz de forma direta a violência do verbo, que denota esmagar ou arremessar até romper em pedaços.
- source_word: הָרֹתֵיהֶם תְּבַקֵּעַ
  choice: rasgará o ventre de suas mulheres grávidas
  rationale: A formulação explicita naturalmente em português o resultado corporal implícito em “abrir/partir” mulheres grávidas, sem suavizar a atrocidade.
theological_decisions:
- issue: Sentido coletivo de לִבְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel; israelitas
  rationale: A expressão formal foi mantida porque é inteligível em português e conserva a forma da designação hebraica, enquanto a nota esclarece seu sentido coletivo.
- issue: Violência explícita na fala profética
  choice: preservar sem eufemismo as atrocidades enumeradas
  alternative: empregar termos mais brandos, como “causar dano” ou “atacar”
  rationale: A linguagem hebraica é deliberadamente gráfica. A tradução mantém sua gravidade moral e narrativa, sem atribuir aprovação divina aos atos previstos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O diálogo usa formas correntes (“está chorando”, “você fará”), enquanto a enumeração mantém a solenidade e a crueza do texto. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
