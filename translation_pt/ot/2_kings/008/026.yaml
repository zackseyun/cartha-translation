  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֤ם אִמּ/וֹ֙ עֲתַלְיָ֔הוּ בַּת עָמְרִ֖י מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: pt
  text: Acazias tinha vinte e dois anos quando se tornou rei e reinou um ano em Jerusalém. Sua mãe se chamava Atalia e era filha de Onri[a], rei de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendente de Onri”. Em hebraico, “filha” pode designar uma descendente ou integrante de uma dinastia, e não necessariamente uma filha imediata.
    reason: Alternativa lexical e genealógica.
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: tinha vinte e dois anos
  rationale: A expressão hebraica, literalmente “filho de vinte e dois anos”, é uma fórmula idiomática de idade; a redação escolhida é natural em português e preserva a idade exata.
- source_word: בְמָלְכוֹ
  choice: quando se tornou rei
  rationale: Expressa de modo claro e corrente a fórmula hebraica referente ao início do reinado.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: e reinou um ano
  rationale: Preserva diretamente a duração declarada no texto hebraico.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: Forma locativa padrão em português.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sua mãe se chamava
  rationale: Equivalente português natural da fórmula hebraica “e o nome de sua mãe era”.
- source_word: עֲתַלְיָהוּ
  choice: Atalia
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בַּת עָמְרִי
  choice: filha de Onri
  rationale: Mantém no texto principal o sentido lexical direto de בַּת, sem eliminar a possibilidade de referência mais ampla à descendência ou à dinastia, registrada em nota.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta da cadeia construta que identifica a condição régia de Onri.
theological_decisions:
- issue: Amplitude genealógica de “filha de Onri”
  choice: Manter “filha de Onri” no texto principal.
  alternative: “descendente de Onri” ou “membro da dinastia de Onri”.
  rationale: O substantivo hebraico בַּת significa literalmente “filha”, mas termos de parentesco podem indicar uma descendente ou integrante de uma linhagem. A tradução conserva o sentido imediato e registra a possível amplitude em nota, sem resolver indevidamente a relação genealógica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “Sua mãe se chamava” evita rigidez excessiva sem perder o conteúdo da fórmula hebraica. O marcador [a] foi colocado junto à expressão a que a nota se refere.
