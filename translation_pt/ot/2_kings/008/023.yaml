source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais feitos de Yoram[a], e tudo o que ele fez — não estão escritos no Livro das Crônicas dos Reis de Judá?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Yoram; tradicionalmente, Jorão.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «livro dos anais dos reis de Judá».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Os demais feitos
  rationale: יֶתֶר indica o restante, e דִּבְרֵי, nesta fórmula de resumo régio, refere-se aos feitos ou assuntos do rei. A formulação é natural em português e preserva o sentido historiográfico.
- source_word: יוֹרָם
  choice: Yoram
  rationale: Translitera diretamente a forma hebraica יוֹרָם. A forma tradicional portuguesa «Jorão» é indicada em nota.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: e tudo o que ele fez
  rationale: Reproduz com clareza e naturalidade a oração relativa hebraica.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Mantém a pergunta retórica, que pressupõe resposta afirmativa, e conserva o plural hebraico, cujo referente abrange os feitos e tudo o que o rei fez.
- source_word: עַל סֵפֶר
  choice: no Livro
  rationale: Embora עַל seja literalmente «sobre», em referência ao conteúdo de um registro escrito o português idiomático pede «no». «Livro» é uma designação legível para o registro antigo, provavelmente em forma de rolo.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Livro das Crônicas dos Reis de Judá
  rationale: Representa a fórmula que designa os registros reais. «Crônicas» é tradicional e exato no contexto, enquanto «anais» permanece uma alternativa lexical válida.
