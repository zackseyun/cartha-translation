base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: pt
  text: E no quinto ano de Jorão, filho de Acabe, rei de Israel, enquanto Josafá era rei de Judá,[a] Jeorão[b], filho de Josafá, começou a reinar como rei de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e Josafá, rei de Judá”. A oração hebraica é condensada; alguns a entendem como reflexo de um período de corregência.'
    reason: alternative_reading
  - marker: b
    text: 'O hebraico distingue os nomes: “Jorão” (rei de Israel) e “Jeorão” (filho de Josafá, rei de Judá), embora as duas formas sejam estreitamente relacionadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ
  choice: E, no quinto ano de
  rationale: A conjunção liga a notícia cronológica à narrativa anterior, e o numeral cardinal hebraico tem sentido ordinal nesta fórmula régia.
- source_word: לְ/יוֹרָם בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: de Jorão, filho de Acabe, rei de Israel
  rationale: A preposição indica o ano régio contado segundo o reinado de Jorão; o patronímico e o título real são mantidos para identificação histórica.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: enquanto Josafá era rei de Judá
  rationale: A oração hebraica, sem verbo expresso, é condensada. A formulação temporal comunica com naturalidade a circunstância, sem afirmar explicitamente uma corregência.
- source_word: מָלַךְ
  choice: começou a reinar
  rationale: Nesta notícia de reinado, o verbo assinala a ascensão ao trono, não a duração completa do reinado.
- source_word: יְהוֹרָם
  choice: Jeorão
  rationale: A forma portuguesa Jeorão distingue o rei de Judá de Jorão, rei de Israel, acompanhando a diferença entre יְהוֹרָם e יוֹרָם no texto hebraico.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: filho de Josafá, começou a reinar como rei de Judá
  rationale: A redação preserva o patronímico e aplica inequivocamente o título final a Jeorão, evitando a ambiguidade sintática que uma sequência literal de apostos produziria em português.
theological_decisions:
- issue: Relação cronológica entre o reinado de Josafá e a ascensão de Jeorão
  choice: 'Traduzir a oração sem verbo em sentido temporal: “enquanto Josafá era rei de Judá”.'
  alternative: Traduzir literalmente “e Josafá, rei de Judá” ou explicitar uma corregência.
  rationale: O hebraico não declara formalmente uma corregência. A tradução temporal torna a frase compreensível, mas não resolve além do texto a tensão cronológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “começou a reinar como rei de Judá” evita atribuir por engano o título final a Josafá e preserva a função da fórmula de ascensão.
