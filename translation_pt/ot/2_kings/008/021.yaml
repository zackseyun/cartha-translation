  text: וַ/יַּעֲבֹ֤ר יוֹרָם֙ צָעִ֔ירָ/ה וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַֽ/יְהִי ה֞וּא קָ֣ם לַ֗יְלָה וַ/יַּכֶּ֨ה אֶת אֱד֜וֹם הַ/סֹּבֵ֤יב אֵלָי/ו֙ וְ/אֵת֙ שָׂרֵ֣י הָ/רֶ֔כֶב וַ/יָּ֥נָס הָ/עָ֖ם לְ/אֹהָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: pt
  text: Então Jorão atravessou para Zair[a], levando consigo todos os carros de guerra. Durante a noite, levantou-se e atacou os edomitas que o cercavam e os comandantes dos carros de guerra; mas o povo fugiu para as suas tendas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “para Seir”. O topônimo hebraico צָעִירָה é de interpretação difícil, e alguns o entendem como uma variante relacionada a Seir/Edom, não como o nome distinto Zair.
    reason: alternative_reading
  - marker: b
    text: “Fugiu para as suas tendas” é uma expressão idiomática hebraica que indica que o povo se dispersou e voltou para casa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: atravessou
  rationale: O verbo עבר indica passar ou atravessar. No contexto de deslocamento militar, “atravessou” mantém esse sentido sem especificar uma rota não mencionada.
- source_word: צָעִירָה
  choice: para Zair
  rationale: A vocalização massorética favorece um topônimo acompanhado da terminação direcional. Como a identificação é incerta e pode haver relação com Seir, a alternativa é registrada em nota.
- source_word: הָרֶכֶב
  choice: os carros de guerra
  rationale: רכב pode designar os carros ou a força de carros coletivamente. “Carros de guerra” é claro em português e explicita naturalmente o sentido militar.
- source_word: קָם לַיְלָה
  choice: Durante a noite, levantou-se
  rationale: A expressão apresenta a ação noturna de Jorão. Esta formulação conserva a sequência narrativa e soa natural em português atual.
- source_word: וַיַּכֶּה
  choice: atacou
  rationale: נכה tem sentido amplo de golpear ou ferir. Neste contexto militar, “atacou” é natural e, diferentemente de “derrotou”, não afirma uma vitória total.
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: os edomitas que o cercavam
  rationale: O nome coletivo “Edom” refere-se aqui às forças edomitas, e o particípio descreve-as cercando Jorão. A tradução torna a imagem militar clara sem eliminar seu caráter coletivo.
- source_word: שָׂרֵי הָרֶכֶב
  choice: os comandantes dos carros de guerra
  rationale: שׂרים designa chefes ou comandantes; a construção associa esses oficiais à força de carros.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: o povo fugiu para as suas tendas
  rationale: A tradução preserva tanto o termo amplo העם, “povo”, quanto a imagem idiomática das tendas, explicada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Carros de guerra” evita a possível ambiguidade moderna de “carros”. A ordem foi levemente ajustada para fluidez, sem resolver a incerteza textual do topônimo nem exagerar o resultado do ataque.
