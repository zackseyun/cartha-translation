  text: וְ/הַ/מֶּ֗לֶךְ מְדַבֵּר֙ אֶל גֵּ֣חֲזִ֔י נַ֥עַר אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹ֑ר סַפְּרָ/ה נָּ֣א לִ֔/י אֵ֥ת כָּל הַ/גְּדֹל֖וֹת אֲשֶׁר עָשָׂ֥ה אֱלִישָֽׁע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: pt
  text: 'O rei estava conversando com Geazi[a], servo do homem de Deus, e lhe dizia: “Por favor, conte-me todas as grandes coisas que Eliseu fez.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ajudante do homem de Deus” ou “jovem do homem de Deus”; o termo hebraico נַעַר pode designar um servo, ajudante ou jovem, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֵּר
  choice: estava conversando
  rationale: O particípio, com o sujeito prefixado, apresenta uma ação em andamento que serve de pano de fundo na narrativa; a forma progressiva preserva esse aspecto em português.
- source_word: גֵּחֲזִי
  choice: Geazi
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome próprio hebraico.
- source_word: נַעַר
  choice: servo
  rationale: Embora possa significar jovem ou ajudante, aqui descreve a função de Geazi em relação ao homem de Deus; “servo” é claro e preserva a amplitude contextual, com alternativas registradas em nota.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Mantém literalmente o título hebraico tradicional sem explicitar “profeta” além do que o texto diz.
- source_word: סַפְּרָה נָּא לִי
  choice: Por favor, conte-me
  rationale: O imperativo de ספר pede que se narrem ou contem fatos, e נָא acrescenta cortesia; a formulação é natural em português moderno.
- source_word: כָּל הַגְּדֹלוֹת
  choice: todas as grandes coisas
  rationale: O adjetivo feminino plural substantivado designa feitos notáveis de forma ampla; “grandes coisas” evita restringi-los antecipadamente a milagres ou proezas.
- source_word: עָשָׂה
  choice: fez
  rationale: O perfeito hebraico apresenta os feitos realizados por Eliseu; o pretérito perfeito é a forma narrativa natural em português.
- source_word: וְהַמֶּלֶךְ
  choice: O rei
  rationale: O waw coordena e dá continuidade à narrativa, mas não exige um marcador lexical como “agora”; em português, a ligação contextual pode ficar implícita.
- source_word: לֵאמֹר
  choice: e lhe disse
  rationale: A fórmula hebraica introduz a fala. Em português corrente, “e lhe disse” comunica naturalmente essa função, embora o rei já estivesse conversando com Geazi.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A construção progressiva estabelece a cena; a fala direta é natural sem eliminar a cortesia do hebraico. O marcador [a] aparece junto a “Geazi”, identificando a nota relativa à descrição de sua função.
