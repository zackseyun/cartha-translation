source:
  edition: WLC
  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: pt
  text: 'Enquanto ele contava ao rei como havia feito o morto voltar à vida[a], eis que[b] a mulher cujo filho ele havia feito voltar à vida estava clamando ao rei por sua casa e por seu campo. Então Geazi disse: “Meu senhor, ó rei, esta é a mulher, e este é o filho dela, a quem Eliseu fez voltar à vida”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “como havia reavivado o morto” ou “como havia trazido o morto de volta à vida”. O hebraico emprega a forma causativa do verbo “viver” (החיה).'
    reason: lexical_alternative
  - marker: b
    text: '“Eis que” assinala a coincidência repentina e surpreendente: a mulher chegou justamente enquanto Geazi relatava o acontecimento ao rei.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר
  choice: Enquanto ele contava
  rationale: A construção narrativa com היה e o particípio מְסַפֵּר apresenta uma ação em andamento que serve de circunstância temporal; “Enquanto ele contava” expressa isso naturalmente em português.
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: como havia feito o morto voltar à vida
  rationale: הֶחֱיָה é a forma causativa de “viver”; “fez ... voltar à vida” preserva essa força. “O morto” mantém o singular definido do hebraico sem identificar explicitamente a pessoa além do que o texto diz.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: A expressão conserva o efeito discursivo de surpresa e da coincidência marcante da chegada da mulher naquele exato momento.
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: a mulher cujo filho ele havia feito voltar à vida
  rationale: A formulação idiomática em português comunica com clareza a relação expressa pela construção hebraica, sem perder o valor causativo de הֶחֱיָה.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: estava clamando ao rei
  rationale: צעק indica um clamor urgente por ajuda ou justiça. “Clamando” conserva essa intensidade melhor do que o termo mais administrativo “apelando”.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: por sua casa e por seu campo
  rationale: Neste contexto, עַל introduz os bens pelos quais a mulher pleiteava, enquanto שָׂדֶה designa especificamente o campo, e não apenas terra em sentido amplo.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Meu senhor, ó rei
  rationale: Reproduz de modo digno e natural a forma de tratamento cortesã, mantendo tanto אֲדֹנִי quanto o vocativo real.
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: esta é a mulher, e este é o filho dela
  rationale: Os demonstrativos identificam diretamente as duas pessoas presentes. “O filho dela” é claro e natural no português moderno.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: a quem Eliseu fez voltar à vida
  rationale: Mantém a mesma tradução de הֶחֱיָה ao longo do versículo e explicita apenas o sujeito, Eliseu, que está expresso no hebraico desta oração.
