base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: So the king asked the woman[a], and she told him. Then the king assigned to her one court official, saying, “Restore all that belongs to her, along with all the produce of the field from the day she left the land until now.”
translation:
  language: pt
  text: 'O rei perguntou à mulher, e ela lhe contou. Então o rei designou para ela um oficial da corte[a], dizendo: “Devolva tudo o que pertence a ela, bem como toda a produção do campo, desde o dia em que ela deixou a terra até agora.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um eunuco”, caso סָרִיס seja entendido em seu sentido mais literal, e não no sentido mais amplo de “oficial da corte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: O rei perguntou à mulher
  rationale: שׁאל introduz a indagação do rei, e אִשָּׁה se refere à sunamita já mencionada, não especificamente à sua condição de esposa.
- source_word: וַתְּסַפֶּר לוֹ
  choice: e ela lhe contou
  rationale: O piel de ספר significa contar ou relatar. A formulação concisa mantém o objeto implícito, como no hebraico.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: Então o rei designou um oficial da corte para cuidar do caso dela
  rationale: נתן tem aqui sentido administrativo, e סָרִיס pode indicar um oficial palaciano. A expressão portuguesa esclarece a função contextual sem afirmar que ele era fisicamente eunuco.
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: Devolva tudo o que pertence a ela
  rationale: O imperativo hifil de שוב ordena que os bens sejam restituídos; “devolva” é direto e natural em português.
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: toda a produção do campo
  rationale: תְּבוּאָה abrange a produção ou rendimento agrícola, não apenas uma colheita específica.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: desde o dia em que ela deixou a terra até agora
  rationale: A tradução conserva a referência temporal e mantém a amplitude de אֶרֶץ, que pode indicar terra, território ou país.
