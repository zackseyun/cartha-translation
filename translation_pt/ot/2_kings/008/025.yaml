  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: pt
  text: No décimo segundo ano de Jorão, filho de Acabe[a], rei de Israel, Acazias, filho de Jeorão, rei de Judá, tornou-se rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “Jorão” para o rei de Israel e “Jeorão” para o rei de Judá; são formas relacionadas do mesmo nome e, em algumas traduções, ambas aparecem como “Jorão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: No décimo segundo ano
  rationale: A fórmula hebraica de datação régia é idiomática; esta forma é natural em português e indica o décimo segundo ano do reinado.
- source_word: לְ/יוֹרָם
  choice: de Jorão
  rationale: A preposição לְ, nesta fórmula régia, identifica o rei cujos anos de reinado estão sendo contados.
- source_word: בֶּן אַחְאָב
  choice: filho de Acabe
  rationale: Preserva diretamente a construção patronímica hebraica.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta e corrente do título real.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Neste aviso de ascensão, o perfeito de מלך assinala o início do reinado, não apenas seu exercício continuado.
- source_word: אֲחַזְיָהוּ
  choice: Acazias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: בֶן יְהוֹרָם
  choice: filho de Jeorão
  rationale: Mantém em português a distinção convencional entre יְהוֹרָם (Jeorão) e a forma abreviada יוֹרָם (Jorão), embora sejam formas relacionadas do mesmo nome.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta e corrente do título real.
