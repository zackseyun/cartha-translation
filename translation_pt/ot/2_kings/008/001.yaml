  text: וֶ/אֱלִישָׁ֡ע דִּבֶּ֣ר אֶל הָ/אִשָּׁה֩ אֲשֶׁר הֶחֱיָ֨ה אֶת בְּנָ֜/הּ לֵ/אמֹ֗ר ק֤וּמִי וּ/לְכִי֙ אתי וּ/בֵיתֵ֔/ךְ וְ/ג֖וּרִי בַּ/אֲשֶׁ֣ר תָּג֑וּרִי כִּֽי קָרָ֤א יְהוָה֙ לָֽ/רָעָ֔ב וְ/גַם בָּ֥א אֶל הָ/אָ֖רֶץ שֶׁ֥בַע שָׁנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: pt
  text: 'Eliseu tinha falado à mulher cujo filho ele havia trazido de volta à vida: “Levante-se, vá com os de sua casa e more onde puder morar[a], pois Yahweh convocou uma fome, e ela virá sobre a terra por sete anos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fique temporariamente onde puder ficar”. O verbo hebraico pode indicar residir como forasteiro ou residente temporário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע דִּבֶּר
  choice: Eliseu tinha falado
  rationale: O perfeito hebraico é entendido retrospectivamente no contexto narrativo; o mais-que-perfeito em português deixa claro que a advertência precedeu os acontecimentos seguintes. O waw inicial não exige um marcador temporal independente.
- source_word: אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: cujo filho ele havia trazido de volta à vida
  rationale: Expressa naturalmente o hifil de חיה e identifica a mulher pelo milagre anteriormente realizado por Eliseu.
- source_word: קוּמִי וּלְכִי
  choice: Levante-se e vá embora
  rationale: Mantém os dois imperativos femininos singulares. “Vá embora” explicita, de modo natural, que ela devia deixar a região ameaçada.
- source_word: אַתִּי וּבֵיתֵךְ
  choice: você e sua família
  rationale: בַּיִת designa aqui as pessoas da casa, não o edifício; “família” é claro e corrente em português.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: More como estrangeira onde puder morar
  rationale: Preserva a repetição da raiz גור e sua nuance de residência temporária fora do lugar de origem, sem recorrer ao pouco usual “peregrinar”.
- source_word: קָרָא יְהוָה לָרָעָב
  choice: Yahweh convocou uma fome
  rationale: “Convocou” conserva a imagem de קרא com ל, apresentando a fome como sujeita ao chamado divino.
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: e ela virá sobre esta terra por sete anos
  rationale: Embora בָּא tenha forma perfeita, no discurso de advertência anuncia um acontecimento futuro tido como certo. O futuro em português comunica a relação temporal exigida pelo contexto, enquanto “por sete anos” mantém a duração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz explicitamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Agência divina na fome
  choice: Yahweh convocou uma fome
  alternative: Yahweh anunciou uma fome; Yahweh fez vir uma fome
  rationale: A formulação conserva a metáfora do hebraico e a afirmação da soberania divina, sem explicar além do que o versículo diz.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega “você” porque a fala se dirige diretamente a uma mulher, evita o arcaísmo “sojournar/peregrinar” e preserva em nota a nuance de residência temporária.
