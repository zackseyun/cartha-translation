  to: 'Eliseu tinha falado à mulher cujo filho ele havia trazido de volta à vida: “Levante-se, vá com os de sua casa e more onde puder morar[a], pois Yahweh convocou uma fome, e ela virá sobre a terra por sete anos.”'
