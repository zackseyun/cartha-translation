review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a advertência, a restauração à vida do filho e a agência de Yahweh sobre a fome. Contudo, “família” é mais estreito que בֵּיתֵךְ no contexto, que inclui a casa/unidade doméstica, e “esta terra” introduz uma ênfase dêitica não expressa no hebraico.
  naturalness: O texto é claro e moderno, mas “More como estrangeira onde puder morar” soa algo pesado e explicita como afirmação principal uma nuance que é melhor preservada em nota. “Os de sua casa” é natural, inclusivo e mais preciso neste contexto.
  terminology: “Yahweh” reproduz adequadamente o Tetragrama conforme a decisão do projeto. “Convocou uma fome” preserva de modo apropriado a metáfora de קָרָא לָרָעָב. A nota deve manter a nuance de residência temporária/forasteira sem sobrecarregar o texto principal.
  issues:
  - severity: medium
    issue: “sua família” para וּבֵיתֵךְ
    rationale: Embora possa incluir a família, “casa” aqui provavelmente abrange toda a unidade doméstica e seus dependentes. “Os de sua casa” evita restringir o referente.
  - severity: low
    issue: “esta terra” para הָאָרֶץ
    rationale: O artigo hebraico pede simplesmente “a terra”; o demonstrativo “esta” acrescenta uma proximidade discursiva que o texto não marca.
  - severity: low
    issue: “como estrangeira” no texto principal
    rationale: גור pode ter a nuance de residir como forasteiro ou temporariamente, mas a construção não exige que isso seja explicitado como predicação principal. “More onde puder” é mais fluente, e a nota preserva a nuance lexical.
