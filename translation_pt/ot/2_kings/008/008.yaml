  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל חֲזָהאֵ֗ל קַ֤ח בְּ/יָֽדְ/ךָ֙ מִנְחָ֔ה וְ/לֵ֕ךְ לִ/קְרַ֖את אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/דָרַשְׁתָּ֨ אֶת יְהוָ֤ה מֵֽ/אוֹת/וֹ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: pt
  text: 'Então o rei disse a Hazael: “Leve consigo um presente, vá ao encontro do homem de Deus e consulte Yahweh por meio dele, perguntando: ‘Vou me recuperar desta doença?’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Viverei apesar desta doença?” O verbo hebraico significa literalmente “viver” e, neste contexto, refere-se a sobreviver ou recuperar-se.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: presente
  rationale: No contexto narrativo, trata-se de um presente levado ao profeta por ocasião de uma consulta, não de uma oferta cultual nem de tributo.
- source_word: לִקְרַאת
  choice: ao encontro de
  rationale: Após o verbo 'ir', a expressão indica a finalidade de encontrar-se com o homem de Deus; 'vá ao encontro de' é natural e fiel.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Mantém o título hebraico tradicional dado ao profeta, preservando sua ressonância narrativa e teológica sem substituí-lo pela explicação 'profeta'.
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: consulte Yahweh por meio dele
  rationale: דרשׁ, neste contexto, designa a busca de uma resposta divina, e מֵאֹתוֹ apresenta o homem de Deus como mediador da consulta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הַאֶחְיֶה
  choice: Vou me recuperar
  rationale: O verbo significa literalmente 'viverei', mas aqui pergunta se o rei sobreviverá à doença e se recuperará; a alternativa literal é preservada em nota.
- source_word: מֵחֳלִי זֶה
  choice: desta doença
  rationale: Expressa de modo claro e natural a enfermidade específica de que o rei padecia.
- source_word: בְּיָדְךָ
  choice: consigo
  rationale: A expressão hebraica é literalmente 'em sua mão', mas no português atual 'leve consigo' comunica naturalmente que Hazael deve transportar o presente, sem sugerir que precise segurá-lo fisicamente na mão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido de הַאֶחְיֶה na pergunta do rei
  choice: Vou me recuperar
  alternative: Viverei
  rationale: A formulação idiomática comunica a pergunta sobre sobreviver e sarar, enquanto a nota conserva o sentido lexical literal e a tensão entre viver e recuperar-se.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O discurso direto permanece natural; o título 'homem de Deus' e o nome 'Yahweh' conservam elementos formais e teológicos do hebraico.
