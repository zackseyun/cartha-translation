  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: pt
  text: Nos dias dele, Edom se rebelou contra o domínio de Judá e nomeou para si um rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “rebelou-se de debaixo da mão de Judá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Nos dias dele
  rationale: Preserva o idioma temporal hebraico, referindo-se ao período do reinado da pessoa mencionada no contexto, sem inserir seu nome no versículo.
- source_word: פָּשַׁע
  choice: se rebelou
  rationale: No contexto político, o verbo indica revolta e ruptura de submissão, não transgressão moral.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Forma tradicional e amplamente reconhecida em português para o povo e território.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: contra o domínio de Judá
  rationale: Comunica naturalmente em português o sentido político do idioma literal 'de debaixo da mão de Judá'.
- source_word: וַיַּמְלִכוּ עֲלֵיהֶם מֶלֶךְ
  choice: constituiu para si um rei
  rationale: O hiphil de מלך indica fazer alguém rei; o singular coletivo 'Edom' favorece 'para si', expressando que os edomitas estabeleceram um governante próprio.
