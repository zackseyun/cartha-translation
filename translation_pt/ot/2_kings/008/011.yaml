  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: pt
  text: E ele manteve o rosto fixo nele e ficou olhando até que ele se envergonhou[a], e o homem de Deus chorou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até que Hazael se envergonhou”. O hebraico não deixa tão explícito quanto o português normalmente exige quem se envergonhou.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: manteve o rosto fixo nele
  rationale: O hifil de עמד com 'seu rosto' como objeto expressa manter ou firmar o rosto. A formulação conserva a imagem hebraica e, com 'nele', comunica naturalmente a direção do olhar no contexto.
- source_word: וַיָּשֶׂם
  choice: ficou olhando
  rationale: Embora שׂים signifique normalmente 'pôr' ou 'colocar', aqui a sequência idiomática prolonga a ideia do olhar fixo; a tradução natural evita o pouco claro 'pôs' sem acrescentar uma interpretação indevida.
- source_word: עַד־בֹּשׁ
  choice: até que ele se sentiu constrangido
  rationale: בוש pode indicar vergonha, embaraço ou constrangimento. 'Sentiu-se constrangido' se ajusta ao contexto de um olhar prolongado, mas mantém sem explicitar a identidade do sujeito.
- source_word: וַיֵּבְךְּ
  choice: chorou
  rationale: בכה significa chorar ou prantear; 'chorou' é corrente, digno e direto em português.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém o título hebraico tradicional, em vez de substituí-lo interpretativamente por 'o profeta'.
theological_decisions:
- issue: Identidade do sujeito de עַד־בֹּשׁ
  choice: 'Manter o pronome ambíguo: ''até que ele se sentiu constrangido''.'
  alternative: 'Explicitar: ''até que Hazael se sentiu constrangido'' ou entender que Eliseu foi quem se constrangeu.'
  rationale: O hebraico não nomeia o sujeito nessa oração, e a construção admite discussão. A tradução preserva essa ambiguidade real em vez de decidir por uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição semântica do olhar fixo reflete a progressão enfática do hebraico, enquanto 'constrangido' soa mais contextual e natural que uma formulação rígida com 'envergonhado'.
