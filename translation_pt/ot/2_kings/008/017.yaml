  text: He was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: pt
  text: Ele tinha trinta e dois anos quando se tornou rei e reinou oito anos em Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: tinha trinta e dois anos
  rationale: A construção hebraica בֶּן + numeral + שָׁנָה é uma fórmula idiomática de idade; em português natural, corresponde a “tinha trinta e dois anos”.
- source_word: הָיָה בְמָלְכוֹ
  choice: quando se tornou rei
  rationale: A expressão situa a idade no início do reinado. Esta formulação comunica com clareza a ascensão ao trono, sem reproduzir literalmente uma construção hebraica pouco natural em português.
- source_word: וּשְׁמֹנֶה שנה
  choice: oito anos
  rationale: Mantém diretamente a duração numérica do reinado indicada no texto hebraico.
- source_word: מָלַךְ
  choice: reinou
  rationale: O verbo מָלַךְ descreve o exercício da realeza; “reinou” é seu equivalente direto e natural neste contexto.
- source_word: בִּירוּשָׁלִָם
  choice: em Jerusalém
  rationale: A preposição locativa e o topônimo são vertidos de forma direta, indicando a cidade onde exerceu o reinado.
