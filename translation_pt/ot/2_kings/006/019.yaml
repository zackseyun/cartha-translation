  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם אֱלִישָׁ֗ע לֹ֣א זֶ֣ה הַ/דֶּרֶךְ֮ וְ/לֹ֣א זֹ֣ה הָ/עִיר֒ לְכ֣וּ אַחֲרַ֔/י וְ/אוֹלִ֣יכָה אֶתְ/כֶ֔ם אֶל הָ/אִ֖ישׁ אֲשֶׁ֣ר תְּבַקֵּשׁ֑וּ/ן וַ/יֹּ֥לֶךְ אוֹתָ֖/ם שֹׁמְרֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: pt
  text: 'Então Eliseu lhes disse: “Este não é o caminho, e esta não é a cidade. Sigam-me[a], e eu os conduzirei ao homem que vocês estão procurando”. E ele os conduziu a Samaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Vão atrás de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: o caminho
  rationale: דֶּרֶךְ pode designar caminho, estrada ou rota; “o caminho” preserva o artigo definido e a referência situacional sem especificar demais.
- source_word: הָעִיר
  choice: a cidade
  rationale: עִיר é o termo comum para “cidade”; a tradução mantém o artigo definido e o contraste deítico entre “este” e “esta”.
- source_word: לְכוּ אַחֲרַי
  choice: Sigam-me
  rationale: A expressão significa literalmente “vão atrás de mim”; “Sigam-me” comunica de modo natural em português a ordem e o movimento pretendidos.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: e eu os conduzirei
  rationale: A forma causativa de הלך significa fazer ir ou conduzir. “Eu os conduzirei” expressa claramente a promessa de guiá-los.
- source_word: הָאִישׁ
  choice: o homem
  rationale: אִישׁ normalmente significa “homem”. A tradução mantém a referência masculina singular e a ironia narrativa de Eliseu referir-se indiretamente a si mesmo.
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: que vocês estão procurando
  rationale: בקשׁ significa buscar ou procurar. A construção progressiva é natural no português brasileiro e representa a busca em andamento.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: E ele os conduziu
  rationale: Repete-se a forma causativa de הלך; “conduziu” mantém a coerência lexical com a fala anterior e descreve adequadamente o ato de guiá-los.
- source_word: שֹׁמְרוֹנָה
  choice: a Samaria
  rationale: O ה direcional indica movimento em direção a Samaria, expresso naturalmente pela preposição “a”.
theological_decisions:
- issue: A declaração enganosa de Eliseu aos arameus
  choice: 'Traduzir diretamente: “Este não é o caminho, e esta não é a cidade”.'
  alternative: Parafrasear de modo a apresentar a fala como verdade parcial ou qualificá-la explicitamente como mentira.
  rationale: O hebraico apresenta as palavras sem explicação moral. A tradução preserva a tensão narrativa e deixa sua avaliação ética e teológica para a interpretação.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” explicita naturalmente a segunda pessoa do plural; “conduzir” preserva a repetição do verbo hebraico causativo. O marcador da nota foi colocado junto à expressão que ela esclarece.
