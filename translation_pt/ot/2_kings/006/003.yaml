base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/003.yaml
  text: Then one said[a], “Please be willing to go with your servants.” And he said, “I will go.”
translation:
  language: pt
  text: 'Então um deles disse: “Por favor, aceite[a] ir com os seus servos.” Ele respondeu: “Eu irei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por favor, disponha-se a ir com os seus servos.”'
    reason: Alternativa lexical para a fórmula cortês הוֹאֶל נָא, que expressa disposição ou consentimento.
lexical_decisions:
- source_word: הָאֶחָד
  choice: um deles
  rationale: A expressão significa literalmente “o um”, mas neste contexto identifica naturalmente um integrante do grupo; “um deles” é claro e idiomático em português.
- source_word: הוֹאֶל נָא וְלֵךְ
  choice: Por favor, venha
  rationale: הוֹאֶל נָא formula um pedido cortês, com a ideia de dispor-se ou consentir. Em português, “por favor, venha” comunica naturalmente a solicitação, enquanto “venha” adota a perspectiva dos discípulos que convidam Eliseu a acompanhá-los.
- source_word: אֶת עֲבָדֶיךָ
  choice: com os seus servos
  rationale: Aqui אֶת indica acompanhamento, e עֲבָדֶיךָ é a forma respeitosa pela qual os discípulos se referem a si mesmos diante de Eliseu. “Servos” preserva essa relação e o registro do texto.
- source_word: אֲנִי אֵלֵךְ
  choice: Eu irei
  rationale: Conserva o pronome explícito אֲנִי e a resposta afirmativa simples de Eliseu sem exagerar sua ênfase.
