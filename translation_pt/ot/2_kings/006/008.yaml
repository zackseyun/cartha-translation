  text: וּ/מֶ֣לֶךְ אֲרָ֔ם הָיָ֥ה נִלְחָ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יִּוָּעַץ֙ אֶל עֲבָדָ֣י/ו לֵ/אמֹ֗ר אֶל מְק֛וֹם פְּלֹנִ֥י אַלְמֹנִ֖י תַּחֲנֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/008.yaml
  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: pt
  text: 'O rei de Arã estava guerreando contra Israel e consultou seus servos, dizendo: “Meu acampamento ficará em tal e tal lugar[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Em tal e tal lugar está o meu acampamento”. O hebraico usa uma expressão idiomática para indicar um lugar não especificado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: O rei de Arã
  rationale: O waw liga a frase ao contexto, mas não exige um marcador temporal explícito em português. אֲרָם é preservado como o nome geográfico histórico “Arã”, em vez de ser substituído por “Síria”.
- source_word: הָיָה נִלְחָם
  choice: estava guerreando
  rationale: A construção perifrástica com היה e particípio nifal indica ação contínua ou recorrente no passado; “estava guerreando” conserva esse valor durativo.
- source_word: בְּיִשְׂרָאֵל
  choice: contra Israel
  rationale: Com נלחם, a preposição ב marca o adversário; “contra” expressa isso naturalmente em português.
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: consultou seus servos
  rationale: O verbo indica buscar ou tomar conselho. Embora עֲבָדָיו possa designar auxiliares ou oficiais da corte, “servos” preserva a amplitude do termo hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Tradução natural do infinitivo usado para introduzir discurso direto.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: em tal e tal lugar
  rationale: A expressão dupla é uma fórmula idiomática para um lugar não especificado; “tal e tal lugar” conserva essa indefinição deliberada.
- source_word: תַּחֲנֹתִי
  choice: Meu acampamento ficará
  rationale: O substantivo indica acampamento ou posição de acampamento. No contexto de planejamento militar, “ficará” transmite naturalmente a referência prospectiva sem converter o substantivo em verbo.
