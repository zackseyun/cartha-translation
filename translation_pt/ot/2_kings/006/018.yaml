  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: pt
  text: 'Quando desceram contra ele, Eliseu orou a Yahweh e disse: “Por favor, fere esta nação com cegueira[a]”. Então ele os feriu com cegueira, conforme a palavra de Eliseu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com uma confusão que os cegasse”. O termo hebraico pode indicar uma perturbação visual causada por Deus, que impede a percepção correta, não necessariamente cegueira total ou permanente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: Quando desceram contra ele
  rationale: ירד indica descer, e אֶל marca movimento em direção a Eliseu. O contexto militar favorece “contra ele”, embora “até ele” também seja lexicalmente possível.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: Eliseu orou a Yahweh
  rationale: התפלל é o verbo comum para “orar”; o nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: הַךְ נָא
  choice: Por favor, fere
  rationale: נכה no imperativo significa “ferir/atingir”, e נָא dá à súplica um tom cortês, expresso naturalmente por “por favor”.
- source_word: הַגּוֹי הַזֶּה
  choice: esta nação
  rationale: גוי pode significar “nação” ou “povo”; “esta nação” conserva a correspondência lexical direta e apresenta a força arameia como coletividade nacional.
- source_word: בַּסַּנְוֵרִים
  choice: com cegueira
  rationale: סַנְוֵרִים designa uma incapacidade visual causada por intervenção divina. “Cegueira” é a tradução clara e tradicional, enquanto a nota preserva a possível nuance de confusão visual incapacitante.
- source_word: וַיַּכֵּם
  choice: Então ele os feriu
  rationale: O sujeito singular, subentendido pelo contexto, é Yahweh. “Então” comunica a sequência e a resposta divina à oração sem explicitar além do hebraico.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: conforme a palavra de Eliseu
  rationale: A formulação preserva o substantivo דָּבָר, “palavra”, e a ligação entre a súplica profética e a ação divina.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Agente de וַיַּכֵּם
  choice: Manter o pronome “ele”, tendo Yahweh como referente contextual
  alternative: Repetir “Yahweh os feriu”
  rationale: O hebraico não repete o nome divino. O pronome conserva essa concisão, e o contexto identifica claramente Yahweh como aquele que atende à oração.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conserva-se a repetição de “com cegueira” e a expressão formal “conforme a palavra de Eliseu” para refletir a estrutura e a ênfase do hebraico.
