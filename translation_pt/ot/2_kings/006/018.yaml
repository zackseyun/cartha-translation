  source_fidelity: 'O texto traduz com precisão a sequência narrativa hebraica: a descida hostil em direção a Eliseu, sua oração a Yahweh, o imperativo com partícula de súplica, a designação coletiva “esta nação”, a aflição visual e seu cumprimento em resposta à palavra de Eliseu. “Contra ele” é uma contextualização militar legítima de אֵלָיו neste contexto.'
