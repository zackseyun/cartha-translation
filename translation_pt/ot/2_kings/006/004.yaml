base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/004.yaml
  text: So he went with them[a], and they came to the Jordan and cut down the trees.
translation:
  language: pt
  text: Então ele foi com eles. Chegaram ao Jordão e cortaram as árvores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cortaram a madeira”. O substantivo hebraico pode se referir tanto a árvores como a madeira; neste contexto de corte de árvores, “árvores” parece mais preciso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Então ele foi
  rationale: A forma narrativa de הלך dá continuidade à sequência dos acontecimentos; “Então ele foi” expressa isso com naturalidade em português.
- source_word: אִתָּם
  choice: com eles
  rationale: A preposição com sufixo masculino plural indica acompanhamento de modo direto.
- source_word: וַיָּבֹאוּ
  choice: Chegaram
  rationale: בוא pode significar vir, entrar ou chegar. Diante de um destino expresso, “chegaram” comunica naturalmente a chegada ao local.
- source_word: הַיַּרְדֵּנָה
  choice: ao Jordão
  rationale: O ה direcional indica movimento em direção ao Jordão. A forma consagrada “ao Jordão” preserva a concisão do hebraico sem acrescentar “rio”.
- source_word: וַיִּגְזְרוּ
  choice: cortaram
  rationale: גזר descreve o ato de cortar; com árvores como objeto e no contexto da obtenção de vigas, a frase comunica o abate sem precisar explicitar “derrubaram”.
- source_word: הָעֵצִים
  choice: as árvores
  rationale: O plural definido de עֵץ pode designar árvores ou madeira. Neste contexto, em que se obtém material de construção no Jordão, “as árvores” apresenta com clareza a provável referência a árvores que estavam sendo cortadas, preservando a alternativa lexical em nota.
