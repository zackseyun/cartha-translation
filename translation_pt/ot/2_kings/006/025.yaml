base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: pt
  text: Houve uma grande fome em Samaria; e eis que a cidade estava sitiada, a ponto de uma cabeça de jumento custar oitenta peças de prata, e um quarto de um cabe de esterco de pombas[a] custar cinco peças de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esterco de pombos”. Alguns entendem a expressão literalmente; outros consideram que era o nome de um alimento barato ou produto vegetal vendido durante a fome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Houve
  rationale: Introduz uma nova circunstância narrativa de modo natural e fiel em português.
- source_word: רָעָב גָּדוֹל
  choice: uma grande fome
  rationale: Preserva a formulação hebraica e comunica a extrema gravidade da fome no contexto.
- source_word: בְּשֹׁמְרוֹן
  choice: em Samaria
  rationale: Expressa diretamente a localização indicada pela preposição hebraica.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém o marcador discursivo que chama atenção para a situação alarmante.
- source_word: צָרִים עָלֶיהָ
  choice: a cidade estava sitiada
  rationale: O particípio indica um cerco em andamento; explicitar 'a cidade' evita em português a ambiguidade do pronome sem introduzir informação nova.
- source_word: עַד הֱיוֹת
  choice: a ponto de ... custar
  rationale: Comunica idiomaticamente o resultado extremo do cerco e introduz com clareza os preços exorbitantes.
- source_word: רֹאשׁ חֲמוֹר
  choice: uma cabeça de jumento
  rationale: Preserva a imagem chocante e concreta do hebraico; 'jumento' é amplamente compreensível e adequado ao registro bíblico.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: oitenta peças de prata
  rationale: O texto menciona literalmente 'oitenta de prata' sem nomear a unidade; 'peças' evita especificar indevidamente siclos.
- source_word: רֹבַע הַקַּב
  choice: um quarto de um cabe
  rationale: Mantém a antiga unidade de capacidade, cuja equivalência moderna exata é incerta, e traduz literalmente a fração.
- source_word: חרי יונים
  choice: esterco de pombas
  rationale: É o sentido lexical mais direto da expressão hebraica. Como a identificação é discutida, preserva-se a alternativa em nota.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: cinco peças de prata
  rationale: Mantém o paralelismo com o primeiro preço sem inserir no texto uma unidade monetária não explicitada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura natural. Conserva-se “eis que” para reproduzir a ênfase discursiva e “cabe” como unidade antiga, sem conversão moderna incerta. A elipse de “custar” na segunda oração mantém fluidez e paralelismo.
