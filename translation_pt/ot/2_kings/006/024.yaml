base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: pt
  text: Depois disso, aconteceu que Ben-Hadade, rei de Arã,[a] reuniu todo o seu exército[b], subiu e sitiou Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “rei de Arã”; tradicionalmente, “rei da Síria”.'
    reason: alternative_reading
  - marker: b
    text: Ou “todas as suas forças”; o termo hebraico também pode significar “todo o seu acampamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa com naturalidade a sequência narrativa da fórmula hebraica, sem introduzir uma distância temporal não indicada.
- source_word: וַיִּקְבֹּץ
  choice: reuniu
  rationale: Equivalente direto e corrente para o ato de juntar as tropas.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadade
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Mantém o topônimo do texto hebraico, em vez da identificação tradicional e interpretativa com a Síria.
- source_word: כָּל מַחֲנֵהוּ
  choice: todo o seu exército
  rationale: No contexto militar, comunica de forma clara o sentido de מַחֲנֶה, que também pode designar acampamento ou forças.
- source_word: וַיַּעַל
  choice: avançou
  rationale: Representa naturalmente o movimento militar em direção a Samaria; o hebraico diz literalmente que ele 'subiu'.
- source_word: וַיָּצַר עַל
  choice: cercou
  rationale: Em contexto de guerra, o verbo com עַל significa sitiar ou pôr cerco a uma cidade.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma portuguesa consagrada do topônimo.
