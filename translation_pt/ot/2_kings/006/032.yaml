  text: וֶ/אֱלִישָׁע֙ יֹשֵׁ֣ב בְּ/בֵית֔/וֹ וְ/הַ/זְּקֵנִ֖ים יֹשְׁבִ֣ים אִתּ֑/וֹ וַ/יִּשְׁלַ֨ח אִ֜ישׁ מִ/לְּ/פָנָ֗י/ו בְּ/טֶ֣רֶם יָבֹא֩ הַ/מַּלְאָ֨ךְ אֵלָ֜י/ו וְ/ה֣וּא אָמַ֣ר אֶל הַ/זְּקֵנִ֗ים הַ/רְּאִיתֶם֙ כִּֽי שָׁלַ֞ח בֶּן הַֽ/מְרַצֵּ֤חַ הַ/זֶּה֙ לְ/הָסִ֣יר אֶת רֹאשִׁ֔/י רְא֣וּ כְּ/בֹ֣א הַ/מַּלְאָ֗ךְ סִגְר֤וּ הַ/דֶּ֨לֶת֙ וּ/לְחַצְתֶּ֤ם אֹת/וֹ֙ בַּ/דֶּ֔לֶת הֲ/ל֗וֹא ק֛וֹל רַגְלֵ֥י אֲדֹנָ֖י/ו אַחֲרָֽי/ו׀־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: pt
  text: 'Eliseu estava sentado em sua casa, e os anciãos estavam sentados com ele. O rei enviou um homem à sua frente, mas, antes que o mensageiro[b] chegasse até Eliseu, Eliseu disse aos anciãos: “Vocês estão vendo que esse filho de assassino mandou tirar-me a cabeça[a]? Quando o mensageiro chegar, fechem a porta e mantenham-no detido junto à porta. Não se ouve atrás dele o som dos passos do seu senhor?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mandou decapitar-me”. O hebraico diz literalmente “mandou tirar a minha cabeça”, expressão que indica execução por decapitação.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “mensageiro” se refere a um emissário humano do rei, não a um anjo.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: estava sentado / estavam sentados
  rationale: Os particípios apresentam uma cena em andamento; as formas progressivas no passado preservam esse valor narrativo em português natural.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: O rei enviou um homem à sua frente
  rationale: O contexto anterior identifica o rei como sujeito, e מִלְּפָנָיו indica que o homem foi enviado adiante dele, enquanto o próprio rei o seguia.
- source_word: הַמַּלְאָךְ
  choice: o mensageiro
  rationale: Neste contexto de uma ordem real, a palavra designa um emissário humano, não um ser angelical.
- source_word: הֲרְאִיתֶם
  choice: Vocês estão vendo
  rationale: A pergunta retórica apela à percepção imediata dos anciãos; esta formulação é corrente e preserva a urgência.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: esse filho de assassino
  rationale: Mantém a forma insultuosa e desdenhosa da expressão hebraica sem explicar além do que o texto afirma.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: tirar-me a cabeça
  rationale: Preserva de perto a expressão hebraica, cujo sentido contextual é executar por decapitação.
- source_word: סִגְרוּ הַדֶּלֶת
  choice: fechem a porta
  rationale: Imperativo claro e urgente em português contemporâneo.
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: mantenham-no preso contra ela
  rationale: Comunica a ação de pressionar ou conter o mensageiro junto à porta para impedir sua entrada, sem tornar a imagem artificial em português.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: Não vem atrás dele o som dos passos do seu senhor?
  rationale: Preserva a pergunta retórica e a indicação de que o senhor do mensageiro vinha logo atrás, em formulação idiomática.
theological_decisions:
- issue: Identificação do sujeito implícito de וַיִּשְׁלַח
  choice: O rei enviou um homem
  alternative: Ele enviou um homem
  rationale: O contexto imediato aponta para o rei de Israel. Explicitá-lo evita uma ambiguidade pronominal própria do português sem acrescentar uma nova identificação.
- issue: Identificação do sujeito de וְהוּא אָמַר
  choice: Eliseu é o sujeito, expresso por “ele” após a menção explícita de Eliseu
  alternative: O mensageiro disse
  rationale: A fala antecipa a chegada do mensageiro e se dirige aos anciãos que estavam com Eliseu, portanto o falante é Eliseu. A construção portuguesa torna essa referência clara.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas naturais tanto no Brasil quanto em outros contextos lusófonos. O tratamento plural “vocês” favorece a legibilidade brasileira sem alterar o sentido. Os marcadores de nota foram colocados junto às expressões que efetivamente explicam.
