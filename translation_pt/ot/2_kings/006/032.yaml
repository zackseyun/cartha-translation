revisions:
- from: 'Eliseu estava sentado em sua casa, e os anciãos estavam sentados com ele. O rei enviou um homem à sua frente, mas, antes que o mensageiro[b] chegasse até Eliseu, ele disse aos anciãos: “Vocês estão vendo que esse filho de assassino mandou tirar-me a cabeça[a]? Quando o mensageiro chegar, fechem a porta e mantenham-no preso contra ela. Não vem atrás dele o som dos passos do seu senhor?”'
  to: 'Eliseu estava sentado em sua casa, e os anciãos estavam sentados com ele. O rei enviou um homem à sua frente, mas, antes que o mensageiro[b] chegasse até Eliseu, Eliseu disse aos anciãos: “Vocês estão vendo que esse filho de assassino mandou tirar-me a cabeça[a]? Quando o mensageiro chegar, fechem a porta e mantenham-no detido junto à porta. Não se ouve atrás dele o som dos passos do seu senhor?”'
  rationale: A revisão explicita Eliseu como o falante para eliminar uma ambiguidade pronominal criada pela ordem das referências em português. Também substitui a formulação menos idiomática sobre conter o mensageiro por uma expressão natural que conserva a ação de detê-lo à porta. As notas e seus marcadores permanecem ancorados nos termos correspondentes.
