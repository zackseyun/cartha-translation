  text: וַ/יִּתְפַּלֵּ֤ל אֱלִישָׁע֙ וַ/יֹּאמַ֔ר יְהוָ֕ה פְּקַח נָ֥א אֶת עֵינָ֖י/ו וְ/יִרְאֶ֑ה וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵינֵ֣י הַ/נַּ֔עַר וַ/יַּ֗רְא וְ/הִנֵּ֨ה הָ/הָ֜ר מָלֵ֨א סוּסִ֥ים וְ/רֶ֛כֶב אֵ֖שׁ סְבִיבֹ֥ת אֱלִישָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: pt
  text: 'Então Eliseu orou: “Ó Javé[a], por favor, abre os olhos dele para que veja.” Javé abriu os olhos do jovem[b], e ele viu. Eis que o monte estava cheio de cavalos e carros de fogo ao redor de Eliseu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino YHWH, aqui transliterado “Javé”; tradicionalmente também traduzido “SENHOR”.
    reason: alternative_reading
  - marker: b
    text: Ou “servo” ou “auxiliar”; o hebraico ná‘ar pode indicar um jovem ou alguém que serve como assistente, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע וַיֹּאמַר
  choice: Então Eliseu orou
  rationale: O hitpael de פלל indica oração dirigida a Deus. Em português narrativo, os dois verbos hebraicos podem ser expressos naturalmente por “orou” seguido da fala direta, sem perda do sentido de “orou e disse”.
- source_word: יְהוָה
  choice: Javé
  rationale: Translitera o nome divino YHWH em uma forma consagrada e legível em português, em vez de substituí-lo pelo título “SENHOR”.
- source_word: פְּקַח נָא
  choice: por favor, abre
  rationale: פקח significa “abrir”, especialmente os olhos; נָא marca súplica ou cortesia, aqui expressa por “por favor”, e não necessariamente tempo presente como “agora”.
- source_word: עֵינָיו
  choice: os olhos dele
  rationale: Reproduz com clareza o referente masculino singular, o auxiliar de Eliseu mencionado no contexto.
- source_word: וְיִרְאֶה
  choice: para que veja
  rationale: O verbo prefixado após o imperativo exprime naturalmente a finalidade ou o resultado pretendido.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר pode designar um rapaz, jovem, auxiliar ou servo. “Jovem” preserva o sentido lexical sem tornar explícita no corpo do versículo uma função social apenas inferida do contexto.
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Mantém a função discursiva de chamar vividamente a atenção para aquilo que foi revelado à vista do jovem.
- source_word: הָהָר
  choice: o monte
  rationale: “Monte” é uma tradução corrente e adequada para a elevação ao redor de Dotã, sem sugerir necessariamente uma grande montanha.
- source_word: מָלֵא
  choice: estava cheio de
  rationale: Expressa diretamente o adjetivo predicativo hebraico e soa natural em português.
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: cavalos e carros de fogo
  rationale: Conserva a coordenação e a imagem hebraica; “de fogo” qualifica explicitamente os carros, sem acrescentar uma descrição ontológica dos cavalos.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: ao redor de Eliseu
  rationale: Transmite a ideia de que a força protetora cercava Eliseu.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Javé
  alternative: SENHOR; Yahweh; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Javé” preserva o nome pessoal em uma forma portuguesa amplamente reconhecível, sem substituí-lo por um título.
- issue: Natureza da visão
  choice: Relatar que Deus abriu os olhos do jovem e que ele viu cavalos e carros de fogo
  alternative: Definir a cena como um exército angelical literalmente visível ou como uma visão meramente simbólica
  rationale: O hebraico afirma a abertura divina dos olhos e a percepção da cena, mas não explica sua natureza ontológica. A tradução preserva essa tensão sem acrescentar interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Ó Javé” marca naturalmente o vocativo; “Eis que” conserva a vivacidade solene do marcador hebraico. As notas foram posicionadas junto aos termos a que efetivamente se referem.
