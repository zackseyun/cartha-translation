source:
  edition: WLC
  text: וַ֠/יַּשְׁכֵּם מְשָׁרֵ֨ת אִ֥ישׁ הָֽ/אֱלֹהִים֮ לָ/קוּם֒ וַ/יֵּצֵ֕א וְ/הִנֵּה חַ֛יִל סוֹבֵ֥ב אֶת הָ/עִ֖יר וְ/ס֣וּס וָ/רָ֑כֶב וַ/יֹּ֨אמֶר נַעֲר֥/וֹ אֵלָ֛י/ו אֲהָ֥הּ אֲדֹנִ֖/י אֵיכָ֥ה נַֽעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: pt
  text: 'Quando o servo do homem de Deus se levantou bem cedo e saiu, eis que um exército com cavalos e carros de guerra cercava a cidade. Então seu servo[a] lhe disse: “Ai, meu senhor! O que faremos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu jovem ajudante”. O termo hebraico pode indicar um jovem, um servo ou um ajudante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: se levantou bem cedo
  rationale: A construção expressa levantar-se ou começar a agir cedo. A formulação preserva a ênfase temporal e soa natural em português.
- source_word: מְשָׁרֵת
  choice: servo
  rationale: O particípio designa alguém que serve pessoal ou oficialmente. “Servo” é claro no contexto narrativo e mantém a relação com o homem de Deus.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Título profético estabelecido no Antigo Testamento; a tradução direta preserva seu valor e suas conexões intertextuais.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Expressa de modo direto o movimento de dentro para fora.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Mantém a vivacidade do marcador hebraico, que introduz uma descoberta súbita e alarmante.
- source_word: חַיִל
  choice: um exército
  rationale: Neste contexto militar, o termo indica uma força armada; “exército” é a opção mais clara.
- source_word: סֹבֵב
  choice: cercava
  rationale: O particípio retrata uma situação em curso no momento em que o servo a vê.
- source_word: וְסוּס וָרָכֶב
  choice: com cavalos e carros de guerra
  rationale: Os substantivos singulares têm sentido coletivo e especificam os recursos da força militar. “Carros de guerra” evita a ambiguidade moderna de “carros”.
- source_word: נַעֲרוֹ
  choice: seu servo
  rationale: נַעַר pode designar jovem, servo ou ajudante. No contexto, a pessoa já foi identificada por מְשָׁרֵת como alguém a serviço do homem de Deus; “servo” mantém essa continuidade, enquanto a nota registra a nuance possível de idade.
- source_word: אֲהָהּ
  choice: Ai
  rationale: Interjeição portuguesa natural que comunica alarme e aflição sem tom excessivamente coloquial.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É uma forma respeitosa de tratamento dirigida pelo servo ao seu superior humano, não um título divino neste contexto.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: O que faremos?
  rationale: Embora a forma hebraica seja literalmente próxima de “como faremos?”, a pergunta idiomática pede qual ação tomar; esta formulação transmite isso naturalmente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” preserva a súbita percepção da cena, enquanto “carros de guerra” esclarece o referente militar.
