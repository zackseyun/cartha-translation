lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva a sequência narrativa do wayyiqtol sem impor uma relação temporal mais específica.
- source_word: הָרֶם
  choice: Pegue-o
  rationale: Embora o sentido básico seja “levante”, no contexto o imperativo manda o homem recolher da água o objeto recuperado; “pegue-o” é natural e preciso em português.
- source_word: לָךְ
  choice: para você
  rationale: Mantém a nuance pessoal ou benefativa da preposição com sufixo de segunda pessoa.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: o homem estendeu a mão
  rationale: Reproduz naturalmente a expressão hebraica de estender a mão para alcançar ou agarrar algo; explicita o referente do pronome para evitar ambiguidade em português.
- source_word: וַיִּקָּחֵהוּ
  choice: e o pegou
  rationale: Expressa o sentido comum de לקח, “tomar/pegar”, e mantém claro que ele tomou o objeto.
