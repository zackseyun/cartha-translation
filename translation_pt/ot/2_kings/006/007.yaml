  text: 'E ele disse: “Pegue-o[a] para você.” Então, ele estendeu a mão e o pegou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Erga-o para você”. O imperativo hebraico pode ser traduzido mais literalmente como “erga-o”.'
