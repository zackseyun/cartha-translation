  text: וַֽ/יְהִי֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל עֹבֵ֖ר עַל הַ/חֹמָ֑ה וְ/אִשָּׁ֗ה צָעֲקָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר הוֹשִׁ֖יעָ/ה אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/026.yaml
  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: pt
  text: 'Enquanto o rei de Israel passava sobre a muralha, uma mulher gritou para ele: “Ajude-me[a], meu senhor, ó rei!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Salve-me”. O imperativo hebraico significa literalmente “salve”, mas aqui funciona como um pedido urgente de ajuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: Enquanto ... passava
  rationale: A construção narrativa seguida do particípio apresenta uma ação em andamento que serve de cenário; “Enquanto ... passava” expressa isso com naturalidade em português.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Reproduz diretamente a cadeia construta e sua referência definida no contexto.
- source_word: עַל הַחֹמָה
  choice: pela muralha
  rationale: A preposição עַל indica que o rei estava sobre a muralha; em português, “passava pela muralha” comunica de modo natural seu deslocamento nesse local sem acrescentar uma direção específica.
- source_word: וְאִשָּׁה צָעֲקָה אֵלָיו
  choice: uma mulher gritou para ele
  rationale: “Gritou” preserva o volume e a urgência de צעק, enquanto “para ele” identifica claramente o destinatário.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português atual, os dois-pontos introduzem a fala direta com mais naturalidade do que a reprodução explícita de “dizendo”, sem perda de conteúdo.
- source_word: הוֹשִׁיעָה
  choice: Ajude-me
  rationale: Embora o imperativo de ישׁע signifique literalmente “salve”, neste contexto ele funciona como um pedido urgente de intervenção dirigido ao rei; “Ajude-me” é idiomático e mantém essa força. A alternativa literal é registrada em nota.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meu senhor, ó rei
  rationale: Mantém tanto o tratamento respeitoso אֲדֹנִי quanto o título real em forma vocativa natural e digna em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A forma “ó rei” preserva a solenidade do tratamento direto sem recorrer a linguagem excessivamente arcaica.
