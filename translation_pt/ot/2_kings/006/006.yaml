base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: pt
  text: 'Então o homem de Deus perguntou: “Onde caiu?” O homem que havia perdido o machado mostrou-lhe o lugar. Então o homem de Deus cortou um pedaço de madeira, lançou-o ali, e o ferro[a] flutuou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o ferro”. Pelo contexto, trata-se da cabeça do machado, que era de ferro, mencionada no versículo anterior.
    reason: Esclarece o referente contextual sem substituir a formulação literal do hebraico no texto principal.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva diretamente o título hebraico convencional, sem substituí-lo pela interpretação explícita “profeta de Deus”.
- source_word: אָנָה נָפָל
  choice: Onde caiu?
  rationale: Expressa em português corrente a pergunta pelo lugar em que ocorreu a queda, mantendo o evento concluído.
- source_word: וַיַּרְאֵהוּ אֶת הַמָּקוֹם
  choice: Ele lhe mostrou o lugar
  rationale: O hifil de ראה tem sentido causativo, “fazer ver”, expresso naturalmente por “mostrar”; a frase independente preserva a sequência narrativa.
- source_word: וַיִּקְצָב עֵץ
  choice: cortou um pedaço de madeira
  rationale: קצב indica cortar, e עץ pode designar árvore, madeira ou um pedaço de madeira. A formulação é concreta sem definir de modo indevido o formato ou o tamanho.
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: lançou-o ali
  rationale: Reproduz a ação de lançar e o advérbio direcional, em registro narrativo natural e digno.
- source_word: וַיָּצֶף
  choice: flutuou
  rationale: Traduz diretamente o verbo que descreve flutuar ou vir à superfície, sem explicar nem naturalizar o caráter milagroso do acontecimento.
- source_word: הַבַּרְזֶל
  choice: o ferro
  rationale: Mantém a expressão literal do hebraico. O referente contextual — a cabeça de ferro do machado — é esclarecido em nota, sem ser inserido no texto principal.
theological_decisions:
- issue: Ação milagrosa na narrativa
  choice: Declarar diretamente que “o ferro flutuou”.
  alternative: Interpretar ou explicar como “a cabeça do machado veio à superfície”.
  rationale: O relato apresenta o acontecimento sem explicação naturalizante. A tradução preserva essa afirmação simples e a tensão própria do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Perguntou” é a forma idiomática de introduzir a fala interrogativa. A repetição de “o homem de Deus” evita que o segundo “ele” seja entendido como o homem que mostrou o lugar.
