  - severity: low
    issue: Formulação pouco idiomática da explicação na nota.
    rationale: «Cabeça de ferro do machado» pode sugerir uma categoria distinta. «A cabeça do machado, que era de ferro» comunica o referente contextual com maior naturalidade.
