base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: pt
  text: Então ele lhes preparou um grande banquete, e eles comeram e beberam. Depois, mandou-os embora, e eles foram para junto do seu senhor.[a] E os bandos de saqueadores de Arã[b] não tornaram a entrar na terra de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos seus senhores”. A forma hebraica é plural, mas, neste contexto, provavelmente se refere ao rei de Arã.
    reason: grammatical_ambiguity
  - marker: b
    text: Arã é o nome hebraico da região muitas vezes chamada de Síria em traduções mais antigas.
    reason: name_clarification
lexical_decisions:
- source_word: וַיִּכְרֶה לָהֶם כֵּרָה גְדוֹלָה
  choice: ele lhes preparou um grande banquete
  rationale: A construção com o verbo כרה e o substantivo cognato כֵּרָה é uma expressão idiomática para preparar uma refeição abundante. “Grande banquete” comunica naturalmente tanto a ideia da refeição como a ênfase de גְדוֹלָה.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: eles comeram e beberam
  rationale: Tradução direta dos verbos coordenados, em português natural.
- source_word: וַיְשַׁלְּחֵם
  choice: mandou-os embora
  rationale: 'Preserva o sentido narrativo de שׁלח: o rei os despediu e libertou para partirem.'
- source_word: אֶל אֲדֹנֵיהֶם
  choice: para junto do seu senhor
  rationale: O contexto aponta para o rei de Arã. “Senhor” conserva o sentido de autoridade sem introduzir linguagem especificamente divina; a forma hebraica admite uma leitura formalmente plural, registrada em nota.
- source_word: וְלֹא יָסְפוּ עוֹד ... לָבוֹא
  choice: não tornaram a entrar
  rationale: A combinação de יסף, עוֹד e o infinitivo expressa que a ação não voltou a ocorrer. “Não tornaram a entrar” reproduz essa cessação de modo claro.
- source_word: גְּדוּדֵי אֲרָם
  choice: os bandos de saqueadores de Arã
  rationale: גְּדוּדֵי designa grupos de incursão ou pilhagem, não necessariamente um exército regular. “Arã” mantém o nome hebraico em forma portuguesa.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: na terra de Israel
  rationale: Com o verbo de movimento בוא, a preposição indica entrada no território; em português, “entrar na terra” expressa naturalmente esse movimento.
theological_decisions:
- issue: Número e referente de אֲדֹנֵיהֶם
  choice: seu senhor
  alternative: seus senhores
  rationale: Embora a forma hebraica seja morfologicamente plural, o contexto favorece um singular de autoridade, provavelmente o rei de Arã. A alternativa formal é preservada em nota, sem tornar explícito no texto aquilo que o hebraico apenas sugere pelo contexto.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe narrativa mantém a sequência concisa do hebraico sem reproduzir mecanicamente todas as conjunções.
