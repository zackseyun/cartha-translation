base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: pt
  text: 'Enquanto um deles derrubava um tronco, o ferro[a] caiu na água. Então ele gritou: “Ai, meu senhor! E era emprestado!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a parte de ferro da ferramenta, provavelmente a cabeça do machado.
    reason: O hebraico diz literalmente “o ferro”, usando o material para designar a peça de ferro que se soltou e caiu.
lexical_decisions:
- source_word: מַפִּיל
  choice: derrubava
  rationale: O particípio hifil de נפל expressa aqui a ação de fazer cair a madeira ao cortá-la. “Derrubava” é natural no contexto e mantém o aspecto de ação em andamento.
- source_word: הַקּוֹרָה
  choice: um tronco
  rationale: קוֹרָה pode designar viga, madeira ou tronco. Como a madeira ainda está sendo derrubada, “tronco” evita sugerir uma viga já preparada e comunica com naturalidade o objeto cortado.
- source_word: הַבַּרְזֶל
  choice: o ferro
  rationale: Tradução lexicalmente próxima do hebraico, que usa “o ferro” por metonímia para a parte de ferro da ferramenta. A nota esclarece o referente sem inseri-lo silenciosamente no texto.
- source_word: וַיִּצְעַק
  choice: ele gritou
  rationale: Comunica a reação súbita e angustiada diante da perda.
- source_word: אֲהָהּ
  choice: Ai
  rationale: Interjeição portuguesa corrente de aflição, adequada ao tom de consternação do hebraico.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Preserva a forma respeitosa de tratamento dirigida a Eliseu, sem identificar o termo com o nome divino.
- source_word: שָׁאוּל
  choice: emprestado
  rationale: Neste contexto, a forma indica que o objeto havia sido tomado por empréstimo, razão da aflição do homem.
