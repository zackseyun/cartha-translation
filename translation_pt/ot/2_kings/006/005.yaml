  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa foi preservada, e a repetição inicial do hebraico foi vertida de modo fluente. “E era emprestado” conserva a ligação enfática da última oração com a exclamação anterior.
