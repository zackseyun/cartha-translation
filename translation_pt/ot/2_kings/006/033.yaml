base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: pt
  text: 'Enquanto ele ainda falava com eles, eis que o mensageiro desceu até ele e disse: “Eis que este mal vem de Yahweh. Por que eu continuaria esperando por Yahweh?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que mais posso esperar de Yahweh?” O verbo hebraico pode significar tanto “esperar” como “ter esperança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Enquanto ele ainda falava
  rationale: A construção com עוֹדֶנּוּ e o particípio expressa uma ação em andamento; a formulação portuguesa preserva naturalmente esse valor durativo.
- source_word: עִמָּם
  choice: com eles
  rationale: Tradução direta da preposição com o sufixo, referindo-se ao grupo que estava com Eliseu.
- source_word: הַמַּלְאָךְ
  choice: o mensageiro
  rationale: Embora מַלְאָךְ também possa designar um anjo, o contexto imediato identifica um emissário humano enviado pelo rei.
- source_word: יֹרֵד אֵלָיו
  choice: desceu até ele
  rationale: Preserva o movimento descendente de ירד e expressa de modo natural a aproximação do mensageiro.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a força de apresentação e ênfase da interjeição hebraica tanto na narração quanto na fala citada.
- source_word: זֹאת הָרָעָה
  choice: este mal
  rationale: Conserva a amplitude de רָעָה e o tom acusatório da fala, sem limitar o termo a “desastre” ou “calamidade”.
- source_word: מֵאֵת יְהוָה
  choice: vem de Yahweh
  rationale: Expressa Yahweh como a origem atribuída ao mal presente; “vem de” é idiomático em português e corresponde à força da preposição composta.
- source_word: מָה אוֹחִיל
  choice: Por que eu continuaria esperando
  rationale: No contexto de exasperação, מָה tem força interrogativa de “por quê?”, e יחל pode indicar esperar ou ter esperança. A tradução principal usa “esperando”, deixando a nuance alternativa em nota.
- source_word: לַיהוָה עוֹד
  choice: por Yahweh
  rationale: Com o verbo “esperar”, a preposição לְ indica aquele por quem se espera; o valor de עוֹד é incorporado naturalmente em “continuaria”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de יחל na queixa final
  choice: esperar por Yahweh
  alternative: ter esperança em Yahweh
  rationale: O verbo admite tanto a ideia de esperar quanto a de ter esperança. O contexto favorece a desistência de continuar aguardando intervenção divina, mas a nota preserva explicitamente a outra nuance.
- issue: Atribuição do mal a Yahweh
  choice: este mal vem de Yahweh
  alternative: esta calamidade vem de Yahweh
  rationale: A formulação mantém a tensão teológica e o tom acusatório da declaração, sem suavizar רָעָה nem explicar se a afirmação do personagem é teologicamente correta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Eis que” conserva deliberadamente a ênfase narrativa do hebraico. O marcador [a] foi colocado junto à expressão que a nota esclarece.
