base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/014.yaml
  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: pt
  text: Então ele enviou para lá cavalos, carros de guerra e um grande exército[a]. Eles chegaram de noite e cercaram a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma grande força militar”. A expressão hebraica significa literalmente “uma força pesada”, um modo de dizer que se tratava de um contingente militar considerável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ele enviou
  rationale: O wayyiqtol dá sequência à narrativa. “Enviou” expressa de modo claro e natural o sentido comum de שׁלח, enquanto “Então” marca a progressão sem acrescentar uma relação causal indevida.
- source_word: שָׁמָּה
  choice: para lá
  rationale: O advérbio direcional indica destino; “para lá” explicita naturalmente em português o movimento até o lugar mencionado no contexto anterior.
- source_word: סוּסִים
  choice: cavalos
  rationale: O substantivo designa literalmente cavalos. Embora o contexto seja militar, a tradução evita substituí-los interpretativamente por cavaleiros.
- source_word: וְרֶכֶב
  choice: carros de guerra
  rationale: רֶכֶב pode indicar carros ou a força de carros. “Carros de guerra” preserva a imagem concreta e esclarece ao leitor moderno que se trata de equipamento militar.
- source_word: וְחַיִל כָּבֵד
  choice: e um grande exército
  rationale: Em contexto militar, חַיִל designa uma força ou um exército, e כָּבֵד, literalmente “pesado”, funciona idiomaticamente com o sentido de numeroso ou considerável. “Grande exército” comunica esse sentido em linguagem corrente e digna.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: Eles chegaram de noite
  rationale: A expressão indica que a chegada ocorreu durante a noite. “De noite” é uma formulação natural em português e mantém a circunstância temporal do hebraico.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: e cercaram a cidade
  rationale: O verbo expressa a ação de rodear ou cercar. No contexto militar, “cercaram” é direto, idiomático e preciso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Carros de guerra” evita a possível ambiguidade moderna de “carros”, e a divisão em duas frases mantém o fluxo narrativo sem produzir um período excessivamente longo.
