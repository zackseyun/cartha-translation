base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: pt
  text: 'O coração do rei de Arã ficou muito agitado com essa situação. Então ele chamou os seus servos e lhes perguntou: “Vocês não vão me dizer quem dentre nós está do lado do rei de Israel?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pertence ao rei de Israel”. A expressão hebraica é concisa e pode indicar lealdade ou colaboração com ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר לֵב
  choice: O coração ... ficou muito agitado
  rationale: Mantém a imagem hebraica do coração como centro dos pensamentos e das emoções, enquanto expressa a forte perturbação interior indicada pelo verbo.
- source_word: מֶלֶךְ אֲרָם
  choice: rei de Arã
  rationale: Translitera o nome do reino antigo diretamente do hebraico, sem substituí-lo pelo nome geográfico posterior “Síria”.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: com essa situação
  rationale: Neste contexto, דָּבָר se refere ao conjunto dos acontecimentos que perturbava o rei; “situação” é claro e natural em português.
- source_word: עֲבָדָיו
  choice: seus servos
  rationale: Preserva o sentido lexical básico e se ajusta ao contexto da corte, no qual a palavra pode abranger subordinados e oficiais do rei.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: Vocês não vão me dizer
  rationale: Reproduz em português corrente a pergunta retórica urgente, que funciona também como exigência de resposta.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: quem dentre nós
  rationale: Expressa de modo conciso a suspeita de que havia um informante dentro do próprio grupo arameu.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: está do lado do rei de Israel
  rationale: Explicita a ideia contextual de lealdade ou colaboração sugerida pela construção hebraica extremamente concisa, sem determinar a forma exata dessa colaboração.
