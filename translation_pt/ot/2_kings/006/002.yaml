  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: pt
  text: '— Por favor, deixe-nos ir até o Jordão. De lá, vamos pegar, cada um de nós, uma viga e fazer ali um lugar para morarmos.


    Ele respondeu:


    — Vão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: Por favor, deixe-nos ir
  rationale: O coortativo na primeira pessoa do plural, acompanhado de נָא, expressa uma proposta apresentada como pedido cortês. Em português, esta formulação comunica com naturalidade tanto a ação coletiva quanto o pedido de permissão dirigido a Eliseu.
- source_word: עַד הַיַּרְדֵּן
  choice: até o Jordão
  rationale: עַד indica o destino ou limite do deslocamento, “até”. “O Jordão” é a forma corrente de designar o rio neste contexto.
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: Cada um de nós pegará ali uma viga
  rationale: 'Embora o verbo hebraico esteja no coortativo plural, אִישׁ קוֹרָה אֶחָת distribui a tarefa: cada integrante pegaria uma única peça. “Viga” expressa o uso de קוֹרָה como madeira destinada à construção.'
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: e faremos para nós um lugar
  rationale: A tradução conserva o sentido amplo de עשה, “fazer”, sem especificar mais do que o hebraico, e לָנוּ indica que o lugar seria para uso do próprio grupo.
- source_word: לָשֶׁבֶת שָׁם
  choice: onde morar
  rationale: ישׁב pode significar sentar-se, permanecer ou habitar. Neste contexto, refere-se ao uso continuado do novo lugar; “morar” é claro e natural em português.
- source_word: וַיֹּאמֶר לֵכוּ
  choice: 'Ele respondeu: “Vão”'
  rationale: O verbo de fala introduz a breve autorização de Eliseu. “Respondeu” explicita naturalmente a função narrativa da fala sem alterar seu conteúdo, e “Vão” preserva a concisão do imperativo plural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O diálogo foi formatado com travessões. Evitaram-se tanto o literalismo pouco natural de “sentar ali” quanto a especificação excessiva de “construir uma casa”; “um lugar onde morar” mantém a amplitude do hebraico.
