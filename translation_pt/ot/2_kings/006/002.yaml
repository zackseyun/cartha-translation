    issue: Os verbos “pegará” e “faremos” apresentam a ação como declaração futura, não como proposta volitiva.
    rationale: נִקְחָה e נַעֲשֶׂה são coortativos de primeira pessoa plural. Em contexto de pedido, “vamos ... pegar ... e fazer” preserva melhor a força de proposta sem criar uma construção excessivamente literal.
  - severity: low
    issue: “Ali” após “pegará” pode indicar o local, mas não explicita tão diretamente a procedência da madeira.
    rationale: מִשָּׁם significa “de lá”. A revisão emprega “de lá” para a retirada das vigas e mantém “ali” para o local do novo lugar.
