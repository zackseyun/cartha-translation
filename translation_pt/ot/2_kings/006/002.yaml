  verdict: revise
  source_fidelity: A proposta coletiva, a distribuição de uma viga por pessoa, o destino no Jordão e a breve autorização final estão bem preservados. Contudo, os coortativos hebraicos são melhor refletidos por formas portuguesas de intenção/proposta; além disso, “de lá” torna explícita a origem da madeira (מִשָּׁם).
  naturalness: O diálogo em travessões é natural e claro. A revisão conserva esse registro, mas substitui a sequência de futuros declarativos por uma formulação que exprime mais naturalmente a proposta apresentada a Eliseu.
  terminology: “Jordão”, “viga”, “lugar” e “morar” são escolhas adequadas. Não há termos teológicos ou nomes que exijam ajuste.
