  text: וַ/יִּשְׁלַ֞ח מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֶֽל הַ/מָּק֞וֹם אֲשֶׁ֨ר אָֽמַר ל֧/וֹ אִישׁ הָ/אֱלֹהִ֛ים ו/הזהיר/ה וְ/נִשְׁמַ֣ר שָׁ֑ם לֹ֥א אַחַ֖ת וְ/לֹ֥א שְׁתָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: pt
  text: Então, o rei de Israel mandou gente ao lugar sobre o qual o homem de Deus lhe havia falado e o havia advertido; e ali se manteve alerta, não uma nem duas vezes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomou precauções naquele lugar”. O hebraico pode destacar tanto o estado de alerta do rei quanto as medidas preventivas que ele tomou ali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou gente
  rationale: O verbo significa literalmente “enviou/mandou”, mas seu objeto está implícito. No contexto, o rei envia pessoas ao local indicado; “mandou gente” torna essa ação natural em português sem especificar indevidamente soldados ou mensageiros.
- source_word: הַמָּקוֹם
  choice: o lugar
  rationale: Equivalente direto que conserva o artigo definido e a referência narrativa específica.
- source_word: אֲשֶׁר אָמַר לוֹ
  choice: sobre o qual ... lhe havia falado
  rationale: Preserva a construção relativa e indica naturalmente que a comunicação do homem de Deus precedeu a ação do rei.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Mantém o título hebraico tradicional sem reduzi-lo interpretativamente a “profeta”.
- source_word: וְהִזְהִירֹה
  choice: e o havia advertido
  rationale: O Hifil de זהר expressa advertir ou alertar; o sufixo pronominal é entendido como referência ao rei.
- source_word: וְנִשְׁמַר שָׁם
  choice: e ali ficou de sobreaviso
  rationale: 'Expressa o valor reflexivo do Nifal: o rei se manteve alerta ou tomou precauções naquele local, sem definir além do texto quais medidas foram adotadas.'
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: Isso aconteceu não apenas uma ou duas vezes
  rationale: Reproduz com clareza o idiomatismo hebraico, cujo sentido é que a situação se repetiu várias vezes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém “homem de Deus” e preserva a margem de sentido de וְנִשְׁמַר por meio de nota. O objeto implícito de “mandou” foi explicitado genericamente como “gente”, sem identificar essas pessoas como soldados ou mensageiros.
