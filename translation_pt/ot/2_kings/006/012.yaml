base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: pt
  text: 'Mas um dos seus servos disse: “Não, meu senhor, ó rei. É que Eliseu, o profeta que está em Israel, informa ao rei de Israel as palavras que o senhor diz em seu quarto.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Na verdade
  rationale: Aqui a conjunção corrige a suspeita do rei e introduz a verdadeira explicação; “na verdade” expressa esse valor adversativo-explicativo com naturalidade.
- source_word: חֲדַר מִשְׁכָּבֶךָ
  choice: seu quarto
  rationale: A expressão significa literalmente “câmara do seu leito”; “seu quarto” comunica em português atual o lugar mais privado do rei.
- source_word: יַגִּיד
  choice: conta
  rationale: O verbo indica declarar ou informar; “conta” preserva a ideia de Eliseu transmitir ao rei de Israel aquilo que foi dito.
- source_word: אֶת הַדְּבָרִים
  choice: até as palavras
  rationale: “As palavras” representa diretamente o hebraico, e “até” explicita de modo natural a força surpreendente do contexto sem alterar o conteúdo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento respeitoso ao rei. A construção “meu senhor, ó rei” conserva os dois elementos do vocativo hebraico, enquanto “seu quarto” evita uma formulação excessivamente literal e arcaica.
