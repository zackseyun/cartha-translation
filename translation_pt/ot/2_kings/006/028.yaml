  choice: O que você tem?
  rationale: Reproduz de modo natural a pergunta idiomática sobre o problema ou a queixa da mulher, sem acrescentar uma interpretação específica.
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: Entregue o seu filho
  rationale: “Entregue” comunica adequadamente o imperativo de dar o filho para o fim declarado, com clareza em português corrente.
- source_word: וְנֹאכְלֶנּוּ
  choice: para que o comamos
  rationale: Mantém a primeira pessoa do plural e o objeto masculino singular do hebraico, preservando a brutalidade explícita do relato.
