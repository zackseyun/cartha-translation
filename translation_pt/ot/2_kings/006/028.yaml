  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: pt
  text: 'Então o rei lhe perguntou: “O que você tem?” Ela respondeu: “Esta mulher me disse: ‘Entregue o seu filho, para que o comamos hoje; amanhã comeremos o meu filho.’”'
