  naturalness: A redação revista mantém português moderno, claro e amplamente legível, com “Você mataria...?” como pergunta retórica natural e registro apropriado.
  terminology: “Matar” é contextual e naturalmente adequado para נכה nesta proibição. “Pão e água” preserva os itens concretos do hebraico. “Senhores” traduz adequadamente אַדֹנֵיהֶם no plural, sem impor que se trate de um único rei.
