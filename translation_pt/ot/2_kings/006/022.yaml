base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: pt
  text: 'Mas ele disse[a]: “Não os mate. Você mataria aqueles que capturou com sua espada e seu arco? Ponha pão e água diante deles[b], para que comam, bebam e vão aos seus senhores.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você mata aqueles que capturou com sua espada e seu arco?” A formulação hebraica é retórica e reforça a ordem de não os matar.'
    reason: alternative_reading
  - marker: b
    text: “Pão e água” pode ser uma expressão para provisões básicas, embora o hebraico mencione explicitamente esses dois itens.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: mate / mataria
  rationale: 'Neste contexto, נכה tem sentido letal: o rei pergunta se deve matar os arameus, e Eliseu o proíbe. “Matar” comunica isso com clareza em português atual, enquanto a pergunta mantém a forma retórica do hebraico.'
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: os que capturou
  rationale: שבה designa capturar ou levar cativo em contexto militar. A formulação é natural e preserva a referência a prisioneiros obtidos em combate.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: com a sua espada e o seu arco
  rationale: Mantém as duas armas explicitamente mencionadas, essenciais ao argumento de que esses homens não foram capturados pelo rei em combate convencional.
- source_word: שִׂים
  choice: Ponha
  rationale: Imperativo direto, corrente e natural em português, adequado à concisão da ordem hebraica.
- source_word: לֶחֶם וָמַיִם
  choice: pão e água
  rationale: Preserva os itens concretos nomeados no hebraico, sem excluir a possibilidade de funcionarem como expressão de provisões básicas.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Equivalente idiomático e digno para servir ou colocar alimento à disposição de alguém.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: para que comam, bebam e voltem
  rationale: A construção final expressa naturalmente o resultado pretendido da ordem. “Voltem” explicita em português o movimento de retorno aos seus superiores, implícito no contexto.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: para o seu senhor
  rationale: Embora אֲדֹנֵי tenha forma morfológica plural, com sufixo plural referente aos cativos, o contexto permite que o título designe coletivamente o soberano deles. O singular “seu senhor” preserva a referência provável ao rei da Síria sem nomeá-lo.
theological_decisions:
- issue: Força da pergunta retórica de Eliseu
  choice: A pergunta reforça a proibição de matar os prisioneiros, salientando que o rei não os capturou com suas próprias armas.
  alternative: Entender a sequência como afirmação simples ou como regra restrita aos prisioneiros pessoalmente capturados em batalha.
  rationale: A forma interrogativa se encaixa naturalmente após “Não os mate” e preserva a lógica narrativa, sem transformar o episódio em uma regra geral além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala conserva a ordem direta e a pergunta retórica. Evitou-se linguagem arcaica; “mate” comunica o sentido letal exigido pelo contexto.
