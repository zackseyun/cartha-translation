base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: pt
  text: 'Quando chegaram a Samaria, Eliseu disse: “Yahweh, abre os olhos destes homens[a] para que vejam.” Então Yahweh abriu os olhos deles, e eles viram; eis que estavam no meio de Samaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “destes”; “homens” foi acrescentado para maior clareza, em referência aos soldados arameus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: Quando chegaram
  rationale: A construção introduz uma circunstância temporal na sequência narrativa. A forma concisa é natural em português e preserva o sentido sem reproduzir mecanicamente a fórmula hebraica “e aconteceu”.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: É a forma portuguesa consagrada do nome próprio; neste contexto, designa a cidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: פְּקַח ... אֶת עֵינֵי
  choice: abre os olhos
  rationale: Mantém a expressão concreta do hebraico e sua ressonância no contexto da percepção impedida e depois restaurada por ação divina.
- source_word: אֵלֶּה
  choice: destes homens
  rationale: O hebraico diz literalmente “destes”; “homens” é acrescentado para explicitar em português que o demonstrativo se refere aos soldados arameus.
- source_word: וְיִרְאוּ
  choice: para que vejam
  rationale: Expressa naturalmente o valor de propósito do verbo após o imperativo.
- source_word: וַיִּפְקַח יְהוָה אֶת עֵינֵיהֶם
  choice: Então Yahweh abriu os olhos deles
  rationale: “Então” apresenta a ação como cumprimento imediato da oração de Eliseu, mantendo a progressão narrativa.
- source_word: וַיִּרְאוּ
  choice: e eles viram
  rationale: Conserva o verbo concreto “ver”, sem interpretá-lo apenas como “perceber” ou “dar-se conta”.
- source_word: וְהִנֵּה
  choice: eis que
  rationale: Preserva o marcador de surpresa e chama a atenção para a súbita descoberta dos arameus.
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: no meio de Samaria
  rationale: Reproduz o sentido espacial de estarem dentro da cidade e realça a situação dramática em que se encontravam.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título; “Jeová” representa uma forma tradicional alternativa.
- issue: Natureza da abertura dos olhos
  choice: Manter a formulação concreta “abre os olhos”
  alternative: Fazer que percebam; restaurar-lhes a visão
  rationale: O contexto envolve uma ação divina sobre a capacidade de ver ou perceber, mas o hebraico não exige que a tradução determine com maior precisão a natureza do impedimento. A expressão literal preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A sintaxe narrativa foi levemente ajustada ao uso corrente, enquanto “eis que” conserva a ênfase dramática do hebraico.
