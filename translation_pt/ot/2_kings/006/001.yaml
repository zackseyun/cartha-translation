  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: pt
  text: 'Os filhos dos profetas[a] disseram a Eliseu: “Por favor, veja: o lugar onde moramos na tua presença[b] é apertado demais para nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os discípulos dos profetas” ou “a comunidade dos profetas”. A expressão hebraica provavelmente se refere a uma comunidade profética que recebia instrução ou vivia sob supervisão.
    reason: lexical_alternative
  - marker: b
    text: Ou “diante de ti”. A expressão também pode indicar que eles viviam sob a supervisão de Eliseu, e não apenas fisicamente na presença dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: os filhos dos profetas
  rationale: Preserva o idiomatismo hebraico sem definir de modo excessivamente específico se o grupo era uma escola, uma fraternidade ou uma comunidade profética sob supervisão.
- source_word: הִנֵּה נָא
  choice: Veja, por favor
  rationale: Combina a chamada de atenção de הִנֵּה com o tom cortês ou suplicante de נָא em português atual.
- source_word: הַמָּקוֹם
  choice: o lugar
  rationale: Mantém a amplitude do substantivo, que pode indicar o espaço onde o grupo morava ou se reunia, sem especificar um tipo de construção.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: onde moramos diante de ti
  rationale: O verbo יָשַׁב tem aqui sentido residencial; “diante de ti” preserva a possibilidade de presença física e a de vida sob a supervisão de Eliseu. O advérbio שָׁם fica naturalmente incorporado à construção relativa portuguesa “onde moramos”.
- source_word: צַר מִמֶּנּוּ
  choice: é apertado demais para nós
  rationale: Expressa a ideia espacial de estreiteza ou insuficiência de espaço e reproduz naturalmente a comparação implícita em português.
- source_word: וַיֹּאמְרוּ
  choice: disseram
  rationale: O perfeito consecutivo faz avançar a narrativa; não se acrescenta um marcador temporal como “então” ou “ora”, pois ele não é exigido pelo contexto imediato.
theological_decisions:
- issue: Natureza do grupo chamado בְנֵי הַנְּבִיאִים
  choice: Manter o idiomatismo “filhos dos profetas” no texto
  alternative: “discípulos dos profetas” ou “comunidade dos profetas”
  rationale: O hebraico provavelmente designa membros de uma comunidade profética, talvez sob instrução ou supervisão, mas não define com precisão a relação institucional; a nota esclarece sem resolver além da evidência.
- issue: Sentido de לְפָנֶיךָ
  choice: “diante de ti”
  alternative: “sob a tua supervisão” ou “na tua presença”
  rationale: A formulação preserva a tensão entre localização na presença de Eliseu e relação de dependência ou supervisão, evitando transformar uma implicação provável em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O tratamento “ti” acompanha o singular hebraico e mantém um registro bíblico corrente sem arcaísmo excessivo.
