base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: pt
  text: 'E ele disse: “Que Deus me castigue, e ainda mais, se a cabeça de Eliseu, filho de Safate, continuar sobre ele[a] hoje!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “se a cabeça de Eliseu, filho de Safate, ficar de pé sobre ele hoje”; isto é, se a cabeça de Eliseu continuar sobre seu corpo hoje.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: Que Deus me castigue, e ainda mais
  rationale: A expressão é uma fórmula hebraica fixa de juramento com autoimprecação. Esta formulação comunica em português corrente a invocação de castigo divino, sem tentar especificar o ato deixado implícito no hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, aqui designa o Deus singular invocado na fórmula de juramento.
- source_word: אִם
  choice: se
  rationale: Em juramentos, אִם introduz a condição que atrairia a maldição. Manter “se” preserva a estrutura e a força condicional do hebraico.
- source_word: יַעֲמֹד
  choice: continuar
  rationale: O sentido básico é “ficar de pé” ou “permanecer”. Com “cabeça” como sujeito, “continuar” expressa naturalmente que ela ainda estaria ligada ao corpo, preservando a imagem incomum.
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: a cabeça de Eliseu, filho de Safate
  rationale: Mantém a construção vívida e direta do hebraico, bem como a identificação patronímica.
- source_word: עָלָיו
  choice: sobre ele
  rationale: Reproduz a expressão concisa e algo elíptica do hebraico. A explicitação de que se trata do corpo de Eliseu fica na nota.
- source_word: הַיּוֹם
  choice: hoje
  rationale: Forma natural e atual que preserva a urgência temporal da ameaça.
theological_decisions:
- issue: Referente e força da fórmula de juramento
  choice: Juramento autoimprecatório que invoca o castigo de Deus sobre o rei caso Eliseu não seja decapitado naquele mesmo dia.
  alternative: Uma exclamação de ira sem plena força de juramento.
  rationale: A fórmula “assim faça Deus comigo e ainda mais” é uma fórmula bíblica estabelecida de juramento. A tradução deve conservar sua força solene e ameaçadora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula do juramento foi vertida de modo idiomático, enquanto a imagem corporal deliberadamente dura e elíptica foi preservada no texto e esclarecida em nota.
