base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: pt
  text: 'Então cozinhamos meu filho e o comemos.[a] No dia seguinte, eu disse a ela: “Dê o seu filho, para que o comamos”,[b] mas ela escondeu o filho dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fervemos meu filho e o comemos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e nós o comeremos”. A forma hebraica também pode ser entendida simplesmente como futuro, embora, depois de “Dê o seu filho”, o contexto favoreça a ideia de finalidade ou resultado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: cozinhamos
  rationale: O verbo בשׁל pode indicar cozinhar ou, mais especificamente, ferver. “Cozinhamos” é natural em português e preserva a ação sem impor um método culinário além do que o contexto exige.
- source_word: בְּנִי
  choice: meu filho
  rationale: בן designa literalmente “filho”, e o sufixo de primeira pessoa explicita a relação materna.
- source_word: וַנֹּאכְלֵהוּ
  choice: e o comemos
  rationale: אכל significa “comer”; o pronome “o” preserva o objeto masculino explícito no hebraico.
- source_word: וָאֹמַר אֵלֶיהָ
  choice: eu disse a ela
  rationale: A forma narrativa dá sequência aos acontecimentos; o português mantém essa progressão naturalmente depois da indicação temporal.
- source_word: בַּיּוֹם הָאַחֵר
  choice: No dia seguinte
  rationale: A expressão indica o dia posterior ao primeiro acontecimento e corresponde ao uso corrente em português.
- source_word: תְּנִי
  choice: Dê
  rationale: O imperativo de נתן significa diretamente “dar”; “Dê” preserva sua força e simplicidade.
- source_word: בְּנֵךְ
  choice: o seu filho
  rationale: בן com sufixo de segunda pessoa feminina singular é literalmente “seu filho”.
- source_word: וְנֹאכְלֶנּוּ
  choice: para que o comamos
  rationale: O imperfeito com conjunção depois do imperativo pode expressar finalidade ou resultado pretendido. A formulação preserva esse valor contextual.
- source_word: וַתַּחְבִּא
  choice: mas ela escondeu
  rationale: Embora a conjunção hebraica também possa ser traduzida simplesmente por “e”, o contexto estabelece contraste com a exigência anterior; “mas” o expressa naturalmente.
- source_word: בְּנָהּ
  choice: o filho dela
  rationale: בן com sufixo de terceira pessoa feminina singular significa “filho dela”; essa formulação evita a possível ambiguidade de “seu filho” em português.
