  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דִּבְרֵ֤י הָֽ/אִשָּׁה֙ וַ/יִּקְרַ֣ע אֶת בְּגָדָ֔י/ו וְ/ה֖וּא עֹבֵ֣ר עַל הַ/חֹמָ֑ה וַ/יַּ֣רְא הָ/עָ֔ם וְ/הִנֵּ֥ה הַ/שַּׂ֛ק עַל בְּשָׂר֖/וֹ מִ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: pt
  text: Quando o rei ouviu as palavras da mulher, rasgou suas roupas enquanto passava pela muralha. O povo olhou e viu que ele usava pano de saco sobre o corpo, por baixo das roupas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “por dentro”, indicando que o pano de saco era usado sob as roupas exteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: Quando ... ouviu
  rationale: A construção com כ e o infinitivo introduz uma oração temporal; esta formulação é natural em português e preserva a sequência narrativa.
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: as palavras da mulher
  rationale: דְּבָרִים pode designar palavras, assunto ou relato; aqui se refere diretamente ao que a mulher acabou de dizer.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: rasgou suas roupas
  rationale: Reproduz de modo claro e corrente o gesto convencional de profunda aflição ou horror.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: enquanto passava pela muralha
  rationale: A oração é circunstancial. 'Pela muralha' comunica movimento ao longo dela sem sobrecarregar o texto com explicações espaciais.
- source_word: וַיַּרְא הָעָם וְהִנֵּה
  choice: O povo olhou e viu que
  rationale: A formulação portuguesa transmite tanto o ato de notar quanto a força apresentativa de הִנֵּה, evitando o arcaísmo 'e eis que'.
- source_word: הַשַּׂק
  choice: pano de saco
  rationale: Designa o tecido ou vestimenta áspera usada como sinal de luto e aflição; 'pano de saco' é a expressão bíblica portuguesa corrente.
- source_word: עַל־בְּשָׂרוֹ
  choice: sobre o corpo
  rationale: בָּשָׂר é literalmente 'carne', mas aqui se refere ao corpo ou à pele sob a roupa exterior; a escolha é clara sem ser excessivamente interpretativa.
- source_word: מִבָּיִת
  choice: por baixo das roupas
  rationale: Literalmente 'por dentro' ou 'no interior'; o contexto indica que o pano de saco estava oculto sob a roupa exterior.
