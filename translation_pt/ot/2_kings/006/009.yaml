  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: pt
  text: 'Então o homem de Deus mandou dizer ao rei de Israel: “Tenha cuidado para não passar por este lugar, pois os arameus estão descendo ali[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estão descendo para lá”.'
    reason: O hebraico «ali/lá» localiza a descida; no contexto, também pode ser entendido como o destino para o qual os arameus descem.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou dizer
  rationale: O verbo significa literalmente “enviou”, mas o conteúdo enviado é uma mensagem; “mandou dizer” expressa de modo natural em português a comunicação implícita no contexto.
- source_word: אִישׁ הָאֱלֹהִים
  choice: o homem de Deus
  rationale: Preserva o título hebraico tradicional, sem substituí-lo pela interpretação “o profeta”.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Tradução direta do título real e do nome nacional.
- source_word: לֵאמֹר
  choice: — incorporado em “mandou dizer” —
  rationale: A fórmula hebraica que introduz o discurso direto é representada idiomaticamente pela locução “mandou dizer”, evitando a construção pesada “enviou... dizendo”.
- source_word: הִשָּׁמֶר
  choice: Tenha cuidado
  rationale: O imperativo nifal transmite uma advertência; a formulação é atual, clara e mantém a força cautelar.
- source_word: מֵעֲבֹר
  choice: para não passar por
  rationale: Com הִשָּׁמֶר e a preposição מִן, indica que o rei deve evitar atravessar ou passar pelo local.
- source_word: הַמָּקוֹם הַזֶּה
  choice: este lugar
  rationale: Equivalência direta e natural da expressão demonstrativa.
- source_word: כִּי שָׁם
  choice: pois ... para lá
  rationale: כִּי apresenta a razão da advertência, enquanto שָׁם localiza o movimento; “pois” mantém a relação causal com dignidade e fluidez.
- source_word: אֲרָם
  choice: os arameus
  rationale: No contexto militar, o nome Arã designa o povo ou as forças arameias; “arameus” é historicamente mais preciso do que “sírios”.
- source_word: נְחִתִּים
  choice: estão descendo
  rationale: O particípio indica uma descida em curso ou iminente; a forma progressiva preserva tanto o aspecto quanto a imagem espacial do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, e a fórmula hebraica de envio mais introdução do discurso foi condensada em “mandou dizer”.
