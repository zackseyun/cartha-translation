base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: pt
  text: 'E ele disse: “Se Yahweh não a ajudar, de onde eu poderia ajudá-la? Da eira ou do lagar?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se Yahweh não a salvar, de onde eu poderia salvá-la?” O verbo hebraico nas duas orações pode significar ajudar, salvar ou livrar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva o avanço da narrativa marcado pelo waw consecutivo e mantém a ligação com o contexto anterior.
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: Se Yahweh não ajudar você
  rationale: Embora אַל seja normalmente uma partícula negativa, aqui a construção é entendida como premissa condicional ou retórica. ישׁע pode significar ajudar, salvar ou livrar; no contexto da fome, “ajudar” soa natural sem eliminar as demais possibilidades.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מֵאַיִן אֹושִׁיעֵךְ
  choice: de onde eu poderia ajudá-la?
  rationale: Expressa a pergunta retórica acerca da fonte de socorro. O condicional “poderia” torna natural em português a relação lógica com a oração anterior; “ajudá-la” reflete que o sufixo hebraico se dirige a uma mulher.
- source_word: הֲמִן הַגֹּרֶן
  choice: Da eira
  rationale: “Eira” é o termo português tradicional e preciso para o lugar de debulha, aqui visto como possível fonte de cereal.
- source_word: מִן הַיָּקֶב
  choice: do lagar
  rationale: “Lagar” designa adequadamente a instalação onde uvas eram prensadas e forma um par concreto com “eira”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Amplitude semântica de ישׁע
  choice: ajudar
  alternative: salvar; livrar
  rationale: O contexto imediato é a falta de provisões durante a fome. “Ajudar” comunica o socorro prático, enquanto a nota registra a amplitude legítima do verbo e evita impor uma acepção exclusivamente espiritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantiveram-se os termos concretos “eira” e “lagar”. A alternância entre “você” e “-la” evita a forma regional “ajudar-te” e explicita naturalmente que o rei se dirige a uma mulher.
