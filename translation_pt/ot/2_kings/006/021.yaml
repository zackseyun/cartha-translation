reference: 2 Kings 6:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל אֱלִישָׁ֔ע כִּ/רְאֹת֖/וֹ אוֹתָ֑/ם הַ/אַכֶּ֥ה אַכֶּ֖ה אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: pt
  text: 'Ao vê-los, o rei de Israel disse a Eliseu: “Devo matá-los? Devo matá-los[a], meu pai[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico combina duas formas do mesmo verbo para dar ênfase à pergunta; a repetição em português expressa essa insistência.
    reason: lexical_alternative
  - marker: b
    text: “Meu pai” é uma forma respeitosa de o rei se dirigir a Eliseu, não uma indicação de parentesco.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol faz a narrativa avançar. Em português, a sequência já fica clara com a oração temporal inicial, sem necessidade de acrescentar “então”.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: o rei de Israel
  rationale: Reproduz naturalmente a cadeia construta definida pelo contexto.
- source_word: אֶל אֱלִישָׁע
  choice: a Eliseu
  rationale: A preposição אֶל introduz a pessoa a quem o rei se dirige. Não se acrescenta “o profeta”, ausente do hebraico.
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: Ao vê-los
  rationale: A construção com infinitivo e sufixo tem valor temporal; pelo contexto, o sujeito de “ver” é o rei. A forma escolhida é concisa e natural.
- source_word: הַאַכֶּה אַכֶּה
  choice: Devo matá-los? Devo matá-los?
  rationale: O infinitivo absoluto junto da forma verbal intensifica a pergunta. A repetição em português comunica a insistência enfática; “matar” explicita adequadamente o sentido letal de נכה neste contexto militar.
- source_word: אָבִי
  choice: meu pai
  rationale: Mantém literalmente a expressão familiar usada como tratamento respeitoso dirigido a Eliseu.
theological_decisions:
- issue: Tratamento honorífico dado a Eliseu
  choice: meu pai
  alternative: meu senhor; senhor
  rationale: Embora a expressão funcione como tratamento respeitoso a uma autoridade profética, o hebraico emprega literalmente a linguagem familiar “meu pai”. Preservá-la evita eliminar sua força relacional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem “Ao vê-los” evita uma sequência pesada de orações, e “meu pai” preserva o caráter honorífico sem paráfrase denominacional.
