  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: pt
  text: 'E ele disse: “Vão e vejam onde ele está, para que eu mande prendê-lo.”[a] Informaram-lhe: “Eis que ele está em Dotã.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e enviarei e o tomarei». A sequência hebraica pode ser traduzida mais formalmente; neste contexto, provavelmente expressa finalidade: «para que eu mande prendê-lo».'
    reason: lexical_alternative
  - marker: b
    text: Dotã era uma cidade ao norte de Samaria, também mencionada no relato de José (Gn 37.17).
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa; a formulação preserva esse fluxo sem acrescentar uma nuance temporal indevida.
- source_word: לְכוּ וּרְאוּ
  choice: Vão e vejam
  rationale: Os dois imperativos estão no plural. A tradução direta é natural em português e mantém a ideia de verificar a localização.
- source_word: אֵיכֹה הוּא
  choice: onde ele está
  rationale: Expressa de modo idiomático a pergunta pela localização indicada pelo advérbio interrogativo e pelo pronome.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: para que eu mande prendê-lo
  rationale: A sequência pode indicar o propósito das ordens anteriores. לקח significa literalmente tomar, mas, neste contexto hostil, refere-se a deter ou capturar; “prendê-lo” comunica isso com clareza.
- source_word: וַיֻּגַּד לוֹ
  choice: Então lhe informaram
  rationale: O hophal de נגד é formalmente passivo, mas o plural impessoal em português reproduz naturalmente o agente não especificado e o ato de transmitir a informação.
- source_word: לֵאמֹר
  choice: introdução direta da fala, sem equivalente explícito
  rationale: O infinitivo quotativo hebraico pode ser representado naturalmente pelos dois-pontos em português; traduzir por “dizendo” seria possível, mas menos fluente aqui.
- source_word: הִנֵּה
  choice: Ele está
  rationale: A partícula chama atenção para a informação apresentada. Em português moderno, a afirmação direta conserva a força contextual sem recorrer ao solene “eis” ou ao pouco natural “veja” numa informação reportada.
- source_word: בְדֹתָן
  choice: em Dotã
  rationale: A preposição é locativa, e “Dotã” é a forma portuguesa corrente do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém o plural dos imperativos e a finalidade provável da sequência verbal. A passiva hebraica foi vertida por construção impessoal natural. O marcador [a] aparece no texto junto ao topônimo a que a nota se refere.
