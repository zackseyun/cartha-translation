  text: וַ/יֹּ֖אמֶר אַל תִּירָ֑א כִּ֤י רַבִּים֙ אֲשֶׁ֣ר אִתָּ֔/נוּ מֵ/אֲשֶׁ֖ר אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/016.yaml
  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: pt
  text: 'Ele disse: “Não tenha medo, pois os que estão conosco são mais numerosos do que os que estão com eles.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ele respondeu
  rationale: O verbo introduz a fala de Eliseu em resposta ao temor expresso no versículo anterior. Em português, “respondeu” transmite naturalmente essa função contextual, embora o sentido lexical básico seja “disse”.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: אַל com o imperfeito/jussivo expressa uma proibição. “Não tenha medo” é a formulação corrente e preserva o valor emocional de ירא.
- source_word: כִּי
  choice: pois
  rationale: Aqui כִּי apresenta a razão para a exortação. “Pois” mantém de forma natural a ligação explicativa.
- source_word: רַבִּים
  choice: são mais numerosos
  rationale: Embora רַבִּים signifique literalmente “numerosos” ou “muitos”, a construção comparativa com מֵאֲשֶׁר pede em português “mais numerosos do que”.
- source_word: אֲשֶׁר אִתָּנוּ
  choice: os que estão conosco
  rationale: A partícula relativa seguida da expressão preposicional funciona substantivamente, referindo-se aos que acompanham o profeta e seu servo.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: do que os que estão com eles
  rationale: מִן introduz a comparação. O hebraico elide a preposição correspondente antes de אוֹתָם; repor “com” em português preserva o paralelismo e torna a frase clara.
theological_decisions:
- issue: Identidade dos que estão “conosco”
  choice: Mantida implícita, como no versículo hebraico.
  alternative: Identificá-los explicitamente como o exército celestial ou os anjos de Deus.
  rationale: Embora o contexto seguinte revele uma força celestial, este versículo não a nomeia. A tradução preserva essa progressão narrativa sem acrescentar interpretação ao texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a comparação e a referência implícita à força que acompanha Eliseu, sem antecipar sua identificação no versículo seguinte.
