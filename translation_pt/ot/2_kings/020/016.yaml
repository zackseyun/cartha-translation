  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/016.yaml
  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: pt
  text: 'Então Isaías disse a Ezequias: “Ouça a palavra de Yahweh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Informa a forma hebraica e a tradução tradicional do nome divino.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá sequência à narrativa; “Então ... disse” expressa essa progressão de modo natural em português.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶל חִזְקִיָּהוּ
  choice: a Ezequias
  rationale: A preposição אֶל indica o destinatário da fala; “disse a Ezequias” é a construção natural em português.
- source_word: שְׁמַע
  choice: Ouça
  rationale: O imperativo singular convoca Ezequias a escutar com atenção. “Ouça” preserva a força direta da fórmula profética em português corrente.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética, דָּבָר designa a declaração ou mensagem divina. “A palavra” conserva o conhecido idioma bíblico sem excluir esse sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e distingue-o do título אֲדֹנָי. A nota informa a tradução tradicional sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A colocação do marcador após “Yahweh” corrige a associação aparente da camada inglesa, na qual o marcador estava depois de “Hezekiah”, embora a nota trate de YHWH.
