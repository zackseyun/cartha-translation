  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: pt
  text: Acrescentarei quinze anos à sua vida e livrarei você e esta cidade do poder do rei da Assíria.[a] Defenderei esta cidade[b] por minha própria causa e por causa de Davi, meu servo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da mão do rei da Assíria”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Protegerei esta cidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: Acrescentarei quinze anos à sua vida
  rationale: Expressa de modo natural em português o idioma hebraico literalmente construído como “acrescentar aos seus dias”, sem alterar a duração prometida.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: do poder do rei da Assíria
  rationale: Traduz o sentido contextual de כַּף, “mão” como imagem de poder ou domínio, enquanto a nota preserva a forma literal.
- source_word: אַצִּילְךָ וְאֵת הָעִיר הַזֹּאת
  choice: livrarei você e esta cidade
  rationale: O hifil de נצל indica resgatar ou livrar de poder hostil; a coordenação mantém Ezequias e a cidade como objetos da mesma ação divina.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: Defenderei esta cidade
  rationale: גנן denota cobrir, proteger ou defender; “defenderei” se ajusta ao contexto de ameaça militar sem excluir a ideia de proteção.
- source_word: לְמַעֲנִי וּלְמַעַן דָּוִד עַבְדִּי
  choice: por amor de mim mesmo e por amor de Davi, meu servo
  rationale: Preserva os dois fundamentos explicitamente declarados no hebraico e mantém a ênfase reflexiva do primeiro, sem desenvolver implicações doutrinárias além do texto.
theological_decisions:
- issue: O motivo divino para defender Jerusalém
  choice: por amor de mim mesmo e por amor de Davi, meu servo
  alternative: por minha causa e por causa de Davi, meu servo
  rationale: A formulação conserva tanto a motivação centrada no próprio Deus quanto a referência a Davi como servo, deixando intacta a tensão teológica e pactual do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” torna explícito o objeto singular sem recorrer a formas regionais ou excessivamente arcaicas; “por amor de” conserva o tom bíblico e continua compreensível no uso atual.
