    rationale: O hebraico diz literalmente «em tua casa». Embora o destinatário seja o rei e a expressão possa incluir a casa real, «palácio» especifica um referente arquitetônico que o texto não impõe e reduz o alcance da expressão. «Em sua casa» conserva a formulação e a possível amplitude do original.
