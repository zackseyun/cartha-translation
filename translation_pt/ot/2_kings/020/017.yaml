base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: pt
  text: Eis que vêm dias em que tudo o que há em sua casa e tudo o que seus antepassados acumularam até o dia de hoje será levado para a Babilônia. Não restará coisa alguma, diz o SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força introdutória e profética do hebraico em linguagem bíblica digna e ainda compreensível.
- source_word: בְּבֵיתֶךָ
  choice: em seu palácio
  rationale: Embora literalmente seja “em sua casa”, no contexto da fala dirigida ao rei a referência é à casa real e aos seus tesouros; “palácio” comunica isso naturalmente.
- source_word: אָצְרוּ
  choice: acumularam
  rationale: Expressa o ato de ajuntar e guardar bens ou tesouros sem restringir indevidamente o objeto.
- source_word: בָּבֶלָה
  choice: para a Babilônia
  rationale: O ה direcional indica movimento para Babilônia; o artigo corresponde ao uso português tradicional e natural para o império/região.
- source_word: דָּבָר
  choice: coisa alguma
  rationale: Neste contexto, דָּבָר significa “coisa”; em oração negativa, “coisa alguma” reproduz com naturalidade a ideia de que nada ficará.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino por SENHOR em versaletes.
theological_decisions:
- issue: Alcance da profecia de remoção
  choice: “tudo... será levado” e “não restará coisa alguma”
  alternative: Atenuar para “muitas coisas serão levadas”
  rationale: Mantém a formulação totalizante e a tensão profética do hebraico, sem suavizar o juízo anunciado.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A ordem e o paralelismo hebraicos foram preservados tanto quanto permite a fluência natural; “Eis que” mantém o tom profético, e “palácio” explicita o referente régio contextual de בַּיִת.
