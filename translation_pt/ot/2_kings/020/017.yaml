  source_fidelity: A tradução preserva adequadamente a advertência profética, a totalidade dos bens e o destino «para a Babilônia». Contudo, «palácio» interpreta e restringe indevidamente בְּבֵיתֶךָ, que é literalmente «em tua casa» e pode abranger a casa real, os bens e a dinastia, sem designar exclusivamente o edifício palaciano.
  naturalness: O texto é claro, solene e natural em português moderno. «Eis que vêm dias» e «Não restará coisa alguma» mantêm bem o registro profético.
  terminology: «SENHOR» é uma convenção apropriada para יהוה. «Antepassados» é aceitável para אֲבֹתֶיךָ neste contexto, e «acumularam» comunica satisfatoriamente a ideia de terem entesourado.
