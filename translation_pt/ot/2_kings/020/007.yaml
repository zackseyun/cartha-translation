  text: וַ/יֹּ֣אמֶר יְשַֽׁעְיָ֔הוּ קְח֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וַ/יִּקְח֛וּ וַ/יָּשִׂ֥ימוּ עַֽל הַ/שְּׁחִ֖ין וַ/יֶּֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: pt
  text: 'Então Isaías disse: “Peguem uma massa de figos[a].” Eles a pegaram e a colocaram sobre a ferida inflamada[b], e ele se recuperou[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um bolo de figos” ou “uma massa prensada de figos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o furúnculo” ou “a úlcera”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “e ele viveu”; neste contexto, isto é, recuperou-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural, sem acrescentar uma relação causal.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: קְחוּ
  choice: Peguem
  rationale: Imperativo plural de לקח. “Peguem” conserva o número e traduz diretamente a ação, sem introduzir a ideia direcional de “tragam” ou “busquem”.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: uma massa de figos
  rationale: דְּבֶלֶת designa uma massa ou bolo prensado, normalmente de frutos secos, e תְּאֵנִים especifica figos. “Massa de figos” é clara e evita sugerir necessariamente um bolo assado.
- source_word: וַיִּקְחוּ
  choice: Eles a pegaram
  rationale: O verbo está no plural, e o pronome “a” retoma naturalmente a massa de figos, objeto implícito no hebraico.
- source_word: וַיָּשִׂימוּ
  choice: e a colocaram
  rationale: שׂים é um verbo amplo de colocação. “Colocaram” descreve com naturalidade a aplicação da massa sem especificar um procedimento médico além do texto.
- source_word: עַל
  choice: sobre
  rationale: Equivalente espacial direto e natural para a aplicação da massa à lesão.
- source_word: הַשְּׁחִין
  choice: a ferida inflamada
  rationale: שְׁחִין pode indicar furúnculo, úlcera ou outra erupção cutânea inflamada. “Ferida inflamada” comunica o quadro sem impor precisão clínica ausente do termo hebraico.
- source_word: וַיֶּחִי
  choice: e ele se recuperou
  rationale: Embora חיה signifique literalmente “viver”, neste contexto de enfermidade e tratamento a expressão indica que Ezequias recobrou a saúde. “Recuperou-se” transmite esse sentido idiomático sem sugerir ressurreição.
theological_decisions:
- issue: Natureza do resultado expresso por וַיֶּחִי
  choice: recuperação física da enfermidade
  alternative: “viveu” ou “reviveu”
  rationale: O sentido básico de חיה é “viver”, mas o contexto imediato é o tratamento da enfermidade de Ezequias. A tradução contextual “se recuperou” preserva o sentido narrativo sem ampliar o acontecimento para uma ressurreição nem definir o mecanismo da cura.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O plural do imperativo e dos verbos seguintes foi preservado. A formulação evita tanto linguagem médica excessivamente técnica quanto a associação moderna de “bolo” com um alimento necessariamente assado.
