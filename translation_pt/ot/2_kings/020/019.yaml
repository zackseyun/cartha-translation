base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: pt
  text: 'Então Ezequias disse a Isaías: “A palavra de Yahweh que você falou é boa.” E disse: “Não haverá paz e estabilidade em meus dias?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “paz e verdade em meus dias”. O termo hebraico אֱמֶת pode significar “verdade”, “fidelidade” ou, neste contexto, estabilidade confiável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: boa
  rationale: Mantém a avaliação breve e direta do anúncio profético, sem explicar se Ezequias o considera moralmente bom ou apenas aceitável.
- source_word: דְּבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: “Palavra” conserva a formulação profética de דָּבָר, e “Yahweh” representa explicitamente o nome divino.
- source_word: דִּבַּרְתָּ
  choice: que você anunciou
  rationale: Em português, “anunciou” expressa naturalmente a fala profética dirigida por Isaías, embora a forma mais literal seja “falou”.
- source_word: הֲלוֹא אִם
  choice: Não haverá...?
  rationale: A construção hebraica é elíptica. A pergunta retórica em português transmite sua força sem introduzir a leitura não explícita de pensamento interior.
- source_word: שָׁלוֹם
  choice: paz
  rationale: Preserva o sentido amplo de tranquilidade, bem-estar e ausência de calamidade.
- source_word: אֱמֶת
  choice: estabilidade
  rationale: Neste contexto régio e nacional, comunica confiabilidade, firmeza e ordem duradoura; a alternativa formal “verdade” é preservada em nota.
- source_word: בְיָמָי
  choice: durante os meus dias
  rationale: Reproduz a imagem temporal hebraica de modo natural e conserva o foco de Ezequias em seu próprio período de vida.
theological_decisions:
- issue: A última declaração de Ezequias é elíptica e pode ser entendida como fala expressa ou como explicação narrativa de seu raciocínio.
  choice: 'Mantê-la como fala direta: “E acrescentou: ‘Não haverá paz e estabilidade durante os meus dias?’”'
  alternative: '“Pois pensou: ‘Não haverá paz e estabilidade durante os meus dias?’”'
  rationale: וַיֹּאמֶר afirma literalmente que ele disse. A pergunta suavemente completada em português preserva a elipse e a tensão moral do interesse de Ezequias pela paz em sua própria época, sem converter explicitamente sua fala em pensamento.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “E acrescentou” evita a repetição pouco natural de “disse” sem ocultar que o hebraico apresenta a segunda frase como fala. O marcador [a] aparece imediatamente após a expressão cuja alternativa a nota explica.
