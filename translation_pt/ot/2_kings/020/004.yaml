source:
  edition: WLC
  text: וַ/יְהִ֣י יְשַׁעְיָ֔הוּ לֹ֣א יָצָ֔א ה/עיר הַ/תִּֽיכֹנָ֑ה וּ/דְבַר יְהוָ֔ה הָיָ֥ה אֵלָ֖י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: pt
  text: 'Isaías ainda não tinha saído do pátio central[a] quando a palavra de Yahweh veio a ele, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a cidade do meio”. Aqui, a expressão é tradicionalmente entendida como uma área ou um pátio do palácio; por isso, “pátio central”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... לֹא יָצָא
  choice: ainda não tinha saído ... quando
  rationale: 'Reproduz com naturalidade a relação temporal da construção hebraica: a nova palavra divina chegou antes de Isaías concluir sua saída.'
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הָעִיר הַתִּיכֹנָה
  choice: o pátio central
  rationale: Embora a expressão hebraica seja literalmente 'a cidade do meio', o contexto palaciano e a tradição textual favorecem a referência a uma área ou pátio do palácio. 'Central' traduz תִּיכֹנָה sem impor a ideia mais específica de 'interior'.
- source_word: וּדְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética e verte diretamente o nome divino.
- source_word: הָיָה אֵלָיו
  choice: veio a ele
  rationale: Expressão idiomática portuguesa para a fórmula hebraica de recepção da palavra divina.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a ligação formal com o discurso direto que começa no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; 'Yahweh' preserva o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa natural. A construção temporal evita o arcaísmo 'e aconteceu' sem perder a sequência indicada pelo hebraico.
