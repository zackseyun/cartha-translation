base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: pt
  text: Naquele tempo, Berodaque-Baladã[a], filho de Baladã, rei da Babilônia, enviou cartas e um presente a Ezequias, porque soube que Ezequias havia estado doente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em Isaías 39:1, o nome aparece como “Merodaque-Baladã”, forma também preservada por antiga tradição textual. Aqui, o texto hebraico traz “Berodaque-Baladã”.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal narrativa corrente, natural em português e sem especificar uma duração que o hebraico não define.
- source_word: שָׁלַח
  choice: enviou
  rationale: Equivalente direto e natural para o verbo comum de enviar, adequado ao contexto diplomático.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: Berodaque-Baladã
  rationale: Translitera a forma consonantal preservada pelo texto hebraico de 2 Reis, sem substituí-la silenciosamente pela variante de Isaías 39:1.
- source_word: בֶּן בַּלְאֲדָן
  choice: filho de Baladã
  rationale: Reproduz de modo direto a construção patronímica hebraica.
- source_word: מֶלֶךְ בָּבֶל
  choice: rei da Babilônia
  rationale: Forma portuguesa consagrada e clara para o título e o domínio real.
- source_word: סְפָרִים
  choice: cartas
  rationale: No contexto de comunicação diplomática, designa naturalmente correspondência escrita, e não livros em sentido genérico.
- source_word: וּמִנְחָה
  choice: e um presente
  rationale: Neste contexto diplomático, 'presente' comunica uma dádiva enviada a outro rei sem impor o sentido mais específico de tributo ou oferta cultual.
- source_word: אֶל חִזְקִיָּהוּ
  choice: a Ezequias
  rationale: Indica com naturalidade em português o destinatário do envio.
- source_word: כִּי שָׁמַע
  choice: porque soube
  rationale: O primeiro כִּי apresenta a razão do gesto; 'soube' é idiomático em português para uma notícia recebida.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: que Ezequias havia estado doente
  rationale: O segundo כִּי introduz o conteúdo da notícia, e o mais-que-perfeito composto situa naturalmente a doença antes do envio.
