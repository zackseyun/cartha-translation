base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: pt
  text: 'Naqueles dias, Ezequias adoeceu e ficou à beira da morte. Então o profeta Isaías, filho de Amoz, veio até ele e lhe disse: “Assim diz Yahweh: Ponha sua casa em ordem, pois você vai morrer[a]; você não viverá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “você está morrendo” ou “você está morto”; a expressão hebraica anuncia uma morte certa e iminente.
    reason: Registra a forma predicativa incomum do hebraico e suas alternativas literais sem tornar o texto principal obscuro.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Reproduz de forma natural o idiomatismo temporal hebraico que introduz o cenário narrativo.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: Ezequias adoeceu e ficou à beira da morte
  rationale: “Adoeceu” preserva o sentido ingressivo do verbo, e “à beira da morte” comunica idiomaticamente a gravidade extrema expressa pelo infinitivo לָמוּת.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: o profeta Isaías, filho de Amoz
  rationale: Mantém o nome, a filiação e o título, com ordem e pontuação naturais em português.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Preserva a fórmula profética convencional e verte diretamente o nome divino.
- source_word: צַו לְבֵיתֶךָ
  choice: Ponha sua casa em ordem
  rationale: Equivalente idiomático corrente para dar as instruções necessárias acerca da casa e dos assuntos familiares diante da morte iminente.
- source_word: כִּי מֵת אַתָּה
  choice: pois você vai morrer
  rationale: Expressa em português moderno a morte certa e iminente anunciada pela construção predicativa hebraica, sem tratá-la como já consumada.
- source_word: וְלֹא תִחְיֶה
  choice: não continuará vivo
  rationale: Conserva a negação explícita da continuidade da vida e evita reduzir o sentido apenas a não se recuperar da doença.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Força de כִּי מֵת אַתָּה
  choice: você vai morrer
  alternative: você está morrendo; você morrerá; você está morto
  rationale: A formulação comunica morte iminente e certa, preservando na nota as possibilidades mais literais sem entender a declaração como morte já ocorrida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea, mantém a fórmula profética solene “Assim diz” e evita arcaísmos. O marcador [a] foi colocado junto à expressão que a nota efetivamente explica.
