  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: pt
  text: 'Volte e diga a Ezequias, líder do meu povo: “Assim diz Yahweh, o Deus de Davi, seu pai: Ouvi a sua oração e vi as suas lágrimas. Eis que estou curando você.[a] No terceiro dia, você subirá à casa de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu curarei você”. O hebraico diz mais literalmente: “Eis que estou curando você”, usando um particípio que também pode expressar uma ação iminente.'
    reason: Preserva a alternativa futura permitida pelo contexto sem eliminar a forma participial do hebraico.
lexical_decisions:
- source_word: שׁוּב וְאָמַרְתָּ
  choice: Volte e diga
  rationale: Expressa naturalmente a ordem para Isaías retornar e transmitir a mensagem, preservando a sequência dos imperativos.
- source_word: נְגִיד עַמִּי
  choice: líder do meu povo
  rationale: נָגִיד designa alguém posto à frente do povo; “líder” é claro e evita a conotação dinástica específica de “príncipe”.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética solene e verte diretamente o nome divino.
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: o Deus de Davi, seu pai
  rationale: Preserva a ordem e a relação ancestral expressas no hebraico, em português natural.
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ רָאִיתִי אֶת דִּמְעָתֶךָ
  choice: Ouvi a sua oração e vi as suas lágrimas
  rationale: O pretérito perfeito português comunica ações concluídas cuja relevância se manifesta na resposta divina presente.
- source_word: הִנְנִי רֹפֶא לָךְ
  choice: Eis que estou curando você
  rationale: “Eis que” retém a ênfase de הִנְנִי, enquanto a locução progressiva reproduz o particípio e sua força de ação presente ou iminente.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי תַּעֲלֶה
  choice: No terceiro dia, você subirá
  rationale: Mantém a indicação temporal e o sentido de subir, apropriado ao deslocamento até o templo.
- source_word: בֵּית יְהוָה
  choice: à casa de Yahweh
  rationale: Conserva a expressão hebraica “casa de Yahweh” em vez de substituí-la pela interpretação contextual “templo”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio da aliança; “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Valor aspectual de רֹפֶא na promessa divina
  choice: estou curando você
  alternative: eu curarei você
  rationale: O hebraico emprega הִנְנִי com particípio, construção que apresenta a ação como atual ou iminente. A tradução principal preserva essa forma, e a leitura explicitamente futura é registrada em nota.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A fórmula profética e a expressão “casa de Yahweh” conservam a cadência e as imagens do original sem arcaísmo excessivo.
