base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/010.yaml
  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: pt
  text: 'E Ezequias disse: “É fácil a sombra avançar dez degraus.[a] Não; antes, que a sombra volte dez degraus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dez graus”. A palavra hebraica significa “degraus” ou “subidas” e pode referir-se aos degraus ou às graduações do instrumento de Acaz que marcava a sombra.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: É fácil
  rationale: Expressa de modo natural e direto a ideia de facilidade ou pouca dificuldade.
- source_word: הַצֵּל / לַצֵּל
  choice: a sombra
  rationale: Equivalente comum de צֵל e adequado ao sinal envolvendo o deslocamento da sombra.
- source_word: לִנְטוֹת
  choice: avançar
  rationale: No contexto, o infinitivo descreve a extensão da sombra em sua direção normal; “avançar” torna claro esse movimento sem definir em excesso o mecanismo.
- source_word: מַעֲלוֹת
  choice: degraus
  rationale: O substantivo denota subidas ou degraus. “Degraus” preserva a imagem concreta, enquanto a possibilidade de graduações de um dispositivo é registrada em nota.
- source_word: לֹא כִּי
  choice: Não!
  rationale: Representa a rejeição enfática da primeira possibilidade antes da alternativa desejada; a frase seguinte explicita o contraste.
- source_word: יָשׁוּב
  choice: Que ... volte
  rationale: Reproduz naturalmente em português a força volitiva do pedido de Ezequias e o sentido de retornar.
- source_word: אֲחֹרַנִּית
  choice: volte
  rationale: A noção de movimento para trás é incorporada idiomaticamente ao verbo “voltar”, evitando a redundância de “volte para trás”.
