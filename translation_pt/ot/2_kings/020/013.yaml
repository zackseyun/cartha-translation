  text: וַ/יִּשְׁמַ֣ע עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת כָּל בֵּ֣ית נְכֹתֹ֡/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת שֶׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֽוֹצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: pt
  text: 'Ezequias deu-lhes ouvidos[a] e lhes mostrou toda a sua casa do tesouro[b]: a prata, o ouro, as especiarias, o óleo precioso, o seu arsenal[c] e tudo o que se encontrava em seus depósitos. Não houve nada em sua casa nem em todo o seu domínio[d] que Ezequias não lhes mostrou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os ouviu”, “lhes deu atenção” ou “os recebeu favoravelmente”; o idioma hebraico pode indicar que Ezequias lhes concedeu audiência ou os acolheu favoravelmente.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu depósito de tesouros”.
    reason: lexical_alternative
  - marker: c
    text: Ou “sua casa de equipamentos”; a expressão também pode ser entendida como “seu depósito de armas”.
    reason: lexical_alternative
  - marker: d
    text: Ou “em toda a área sob seu governo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: os recebeu favoravelmente
  rationale: O idioma hebraico vai além da simples percepção auditiva e, neste contexto diplomático, indica dar atenção ou acolher favoravelmente os enviados.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: lhes mostrou
  rationale: O hifil de ראה significa naturalmente “mostrar”; a mesma escolha preserva a repetição lexical no versículo.
- source_word: בֵּית נְכֹתֹה
  choice: sua casa do tesouro
  rationale: Designa o local onde eram guardados bens preciosos; “casa do tesouro” preserva a imagem concreta do hebraico.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: No inventário dos tesouros reais, refere-se ao metal precioso armazenado, não especificamente a dinheiro.
- source_word: הַזָּהָב
  choice: o ouro
  rationale: Equivalência direta para o metal precioso guardado entre os tesouros reais.
- source_word: הַבְּשָׂמִים
  choice: as especiarias
  rationale: O plural abrange substâncias aromáticas valiosas; “especiarias” é uma formulação ampla, natural e tradicional sem limitar o referente a perfumes.
- source_word: שֶׁמֶן הַטּוֹב
  choice: o óleo precioso
  rationale: Literalmente “o óleo bom”; no contexto de bens reais, “precioso” comunica tanto sua alta qualidade quanto seu valor sem especificar seu uso.
- source_word: בֵּית כֵּלָיו
  choice: o seu arsenal
  rationale: Embora literalmente seja “casa de seus utensílios/equipamentos”, no contexto régio a expressão provavelmente se refere ao depósito de armas ou equipamento militar.
- source_word: אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: tudo o que havia nos seus depósitos
  rationale: אֹצָר pode indicar tesouro ou depósito; “depósitos” evita repetição e comunica o conjunto de bens armazenados.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Não houve nada ... que Ezequias não lhes mostrasse
  rationale: Mantém em português a dupla negativa enfática e a abrangência total da afirmação hebraica.
- source_word: בְּבֵיתוֹ
  choice: em sua casa
  rationale: Preserva o sentido literal de בַּיִת; no contexto real, a referência pode incluir o palácio.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: em todo o seu domínio
  rationale: מֶמְשָׁלָה denota a esfera sob seu governo; “domínio” preserva essa amplitude sem restringi-la apenas ao reino como entidade política.
