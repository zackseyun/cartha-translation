  yaml_path: translation/ot/2_kings/020/002.yaml
  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: pt
  text: 'Então ele virou o rosto para a parede e orou a Yahweh[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Yahweh”. Muitas traduções trazem “o SENHOR”.'
    reason: Registra a forma do nome divino no texto-fonte e a alternativa tradicional amplamente conhecida.
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: Então ele virou
  rationale: O hifil wayyiqtol de סבב descreve uma ação passada em sequência. “Então” expressa naturalmente o avanço narrativo, e “virou” comunica o sentido simples do verbo.
- source_word: פָּנָיו
  choice: o rosto
  rationale: פנים significa aqui “rosto”; com o possessivo indicado pelo sufixo hebraico, a construção portuguesa “ele virou o rosto” é natural e preserva a imagem concreta.
- source_word: אֶל הַקִּיר
  choice: para a parede
  rationale: אֶל indica direção, e קִיר significa “parede”. “Para a parede” é uma formulação portuguesa clara e idiomática neste contexto.
- source_word: וַיִּתְפַּלֵּל
  choice: e orou
  rationale: O hitpael de פלל significa “orar” neste contexto; o pretérito perfeito acompanha a sequência narrativa.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: אֶל marca o destinatário da oração. O tetragrama יְהוָה é transliterado como “Yahweh”, preservando o nome divino presente no texto hebraico.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo construto de אמר introduz o conteúdo da oração no versículo seguinte. “Dizendo:” reproduz essa função de modo claro.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituir a forma por um título; a alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. O pronome sujeito foi mantido para clareza, e os dois verbos coordenados preservam a sequência concisa do hebraico.
