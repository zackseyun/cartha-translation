base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: pt
  text: 'E ele disse: “O que eles viram em sua casa[a]?” E Ezequias respondeu: “Viram tudo o que há em minha casa. Não houve nada que eu não lhes mostrasse em minhas tesourarias[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu palácio”. Em hebraico, literalmente, “em sua casa”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em meus tesouros” ou “em meus depósitos”. O termo hebraico pode designar tesouros ou lugares onde se guardam objetos valiosos ou provisões.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רָאוּ
  choice: O que eles viram
  rationale: Reproduz de modo direto e natural a pergunta hebraica, mantendo o sentido comum do verbo ראה, “ver”.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: em sua casa / em minha casa
  rationale: Preserva o sentido básico de בַּיִת. Embora o contexto régio permita “palácio”, “casa” evita explicitar além do hebraico e mantém a repetição do texto-fonte.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: tudo o que há em minha casa
  rationale: Expressa a abrangência de כָּל אֲשֶׁר e verte naturalmente a construção nominal hebraica no presente.
- source_word: לֹא הָיָה דָבָר
  choice: Não houve nada
  rationale: Equivalente idiomático da construção existencial negativa hebraica.
- source_word: אֲשֶׁר לֹא הִרְאִיתִם
  choice: que eu não lhes mostrasse
  rationale: O hifil de ראה significa “fazer ver”, isto é, “mostrar”; “lhes” representa o sufixo masculino plural referente aos visitantes.
- source_word: בְּאֹצְרֹתָי
  choice: nos meus tesouros
  rationale: אֹצָר pode indicar tesouro, tesouraria ou depósito. “Tesouros” é conciso e natural no contexto da exibição das riquezas reais, sem excluir em nota o sentido locativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “casa” foi mantida por refletir o hebraico. “Respondeu” traduz o segundo וַיֹּאמֶר de forma natural no diálogo, enquanto o primeiro permanece “disse”.
