base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/021.yaml
  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: pt
  text: E Ezequias deitou-se com seus antepassados[a], e Manassés, seu filho, tornou-se rei em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “descansou com seus antepassados”. O hebraico emprega uma fórmula régia convencional para a morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: descansou
  rationale: O verbo שׁכב significa literalmente deitar-se e, nesta fórmula régia, funciona como eufemismo de morte. “Descansou” preserva a imagem e soa natural e dignificado em português.
- source_word: עִם אֲבֹתָיו
  choice: com seus antepassados
  rationale: A expressão hebraica é uma fórmula convencional de morte régia. “Antepassados” comunica naturalmente o sentido coletivo de אבות no português moderno, sem sugerir apenas pais imediatos.
- source_word: וַיִּמְלֹךְ
  choice: tornou-se rei
  rationale: Neste contexto de sucessão, מלך assinala a ascensão ao trono, não a duração do reinado.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְנוֹ
  choice: seu filho
  rationale: Reproduz explicitamente a relação filial indicada no hebraico.
- source_word: תַּחְתָּיו
  choice: em seu lugar
  rationale: Em fórmulas de sucessão régia, תחתיו indica que o sucessor ocupa o lugar do rei anterior.
theological_decisions:
- issue: Natureza da fórmula “descansou com seus antepassados”
  choice: Preservar o eufemismo régio de morte sem explicá-lo como afirmação sobre o estado dos mortos
  alternative: Traduzir diretamente como “morreu” ou interpretar a frase em sentido doutrinário
  rationale: O hebraico emprega uma fórmula convencional de morte; manter sua imagem preserva o teor do texto e evita impor uma conclusão teológica que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Antepassados” é mais natural e abrangente que o literal “pais”; a nota preserva a forma mais próxima do hebraico. A vírgula antes do marcador mantém a pontuação da frase, e o marcador [a] aparece no texto principal.
