base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: pt
  text: 'E Ezequias disse a Isaías: “Qual é o sinal de que Yahweh me curará e de que subirei à casa de Yahweh[a] no terceiro dia?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o templo de Yahweh”. Literalmente, “a casa de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: perguntou
  rationale: Embora o verbo signifique literalmente “disse”, a fala introduzida é uma pergunta; “perguntou” comunica naturalmente a função do enunciado em português sem alterar seu conteúdo.
- source_word: מָה אוֹת
  choice: Qual será o sinal
  rationale: אוֹת designa um sinal confirmador da promessa divina. A formulação com “será” é natural em português e mantém a referência ao sinal ainda esperado.
- source_word: כִּי יִרְפָּא יְהוָה לִי
  choice: de que Yahweh me curará
  rationale: כִּי introduz aqui o conteúdo confirmado pelo sinal; יִרְפָּא tem valor futuro neste contexto, e o dativo לִי é vertido idiomaticamente como objeto direto.
- source_word: וְעָלִיתִי
  choice: e de que ... subirei
  rationale: A coordenação permanece sob o conteúdo do sinal. “Subirei” preserva o sentido concreto de עלה, adequado à ida ao templo.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: Equivalente temporal direto, corrente e claro em português.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Tradução formal da expressão hebraica, preservando sua imagem; “templo de Yahweh” é oferecido como alternativa lexical em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. A transliteração “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Relação entre cura e subida ao templo
  choice: duas afirmações coordenadas confirmadas pelo mesmo sinal
  alternative: entender a subida como propósito ou consequência secundária da cura
  rationale: A construção com כִּי e os verbos coordenados permite manter ambas as afirmações sob o conteúdo do sinal, sem impor uma relação causal não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem temporal foi ajustada para soar natural, e “perguntou” explicita a força interrogativa da fala.
