base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: pt
  text: 'Então o profeta Isaías foi até o rei Ezequias e lhe perguntou: “O que disseram esses homens, e de onde vieram até você?” Ezequias respondeu: “Vieram de uma terra distante, da Babilônia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... foi até
  rationale: O wayyiqtol faz a narrativa avançar. “Então” preserva a sequência, e “foi até” expressa com naturalidade em português o movimento em direção ao rei.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: o profeta Isaías
  rationale: Mantém o título definido e usa a forma tradicional portuguesa do nome.
- source_word: אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: até o rei Ezequias
  rationale: Construção idiomática em português que conserva o título e o nome em aposição.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: O que disseram esses homens
  rationale: O perfeito hebraico refere-se ao que os visitantes já haviam dito; o pretérito perfeito é natural no contexto. “Homens” preserva o masculino plural explícito.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: e de onde vieram até você
  rationale: Embora יָבֹאוּ seja formalmente imperfeito, o contexto narrativo favorece o passado. “Até você” conserva o complemento explícito אֵלֶיךָ sem acrescentar “aqui”.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: de uma terra distante
  rationale: Equivalência natural e dignificada que mantém a ideia de distância geográfica.
- source_word: מִבָּבֶל
  choice: da Babilônia
  rationale: Usa a forma portuguesa tradicional do topônimo e preserva a especificação da origem após a expressão geral.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. A resposta foi introduzida por “respondeu” em vez da repetição hebraica de “disse”, sem alterar o conteúdo. Não se acrescentou “até mim” à resposta de Ezequias, pois essa expressão não ocorre ali no texto hebraico.
