  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a pergunta retórica e a amplitude de “poder”, enquanto usa vocabulário corrente para as obras hidráulicas. Os marcadores foram colocados junto aos termos ou à afirmação que efetivamente explicam.
