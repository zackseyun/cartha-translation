  text: וְ/יֶ֨תֶר דִּבְרֵ֤י חִזְקִיָּ֨הוּ֙ וְ/כָל גְּב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר עָשָׂ֗ה אֶת הַ/בְּרֵכָה֙ וְ/אֶת הַ/תְּעָלָ֔ה וַ/יָּבֵ֥א אֶת הַ/מַּ֖יִם הָ/עִ֑ירָ/ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: pt
  text: Os demais atos de Ezequias, todo o seu poder e como ele fez o reservatório[a] e o canal[b][c] e levou a água para a cidade — não estão escritos no Livro das Crônicas dos Reis de Judá?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tanque”; o termo hebraico pode indicar uma bacia construída para armazenar água.
    reason: lexical_alternative
  - marker: b
    text: Ou “conduto”; o termo hebraico se refere a um curso ou canal construído para conduzir água.
    reason: lexical_alternative
  - marker: c
    text: A referência provavelmente é às conhecidas obras hidráulicas de Ezequias em Jerusalém; compare 2 Crônicas 32:30.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: os demais atos
  rationale: Reproduz a fórmula historiográfica de Reis em português natural; “atos” abrange os feitos e acontecimentos registrados do reinado.
- source_word: גְּבוּרָתוֹ
  choice: todo o seu poder
  rationale: Mantém o substantivo abstrato hebraico, que pode indicar força, poder ou realizações extraordinárias, sem restringi-lo apenas à valentia militar.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: e como ele construiu
  rationale: Introduz naturalmente, em português, a realização específica mencionada a seguir; “construiu” expressa o sentido contextual de עָשָׂה aplicado às obras hidráulicas.
- source_word: הַבְּרֵכָה
  choice: o reservatório
  rationale: O termo designa uma bacia construída para armazenar água. “Reservatório” é claro no contexto de engenharia hidráulica e evita sugerir uma piscina recreativa.
- source_word: הַתְּעָלָה
  choice: o canal
  rationale: Designa uma passagem ou curso destinado a conduzir água. “Canal” é corrente e preserva a generalidade do hebraico.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: e levou a água para dentro da cidade
  rationale: Expressa tanto o objeto definido quanto o movimento em direção ao interior da cidade indicado pela terminação direcional de עִירָה.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: não estão escritos
  rationale: Conserva a pergunta retórica da fórmula conclusiva hebraica, sem convertê-la numa afirmação direta.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Livro das Crônicas dos Reis de Judá
  rationale: Trata a expressão como título da fonte documental real mencionada em Reis, usando uma formulação tradicional e inteligível em português.
theological_decisions: []
