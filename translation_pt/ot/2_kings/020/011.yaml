  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: pt
  text: Então o profeta Isaías clamou a Yahweh, e ele fez a sombra retroceder os dez degraus[a] que ela havia descido nos degraus de Acaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dez graus”. O hebraico diz literalmente “dez degraus/subidas” (ma‘alot). Alguns entendem que se tratava de parte de um dispositivo para medir a sombra, daí a tradução tradicional “relógio solar de Acaz”.
    reason: Registra a alternativa lexical e a interpretação histórica sem inseri-las no texto principal.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: clamou
  rationale: O verbo קרא com אֶל־יְהוָה descreve um chamado dirigido a Deus. “Clamou” conserva a vivacidade do hebraico sem explicitar interpretativamente “orou”.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: o profeta Isaías
  rationale: Forma natural em português para o nome próprio acompanhado de seu título.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּשֶׁב אֶת הַצֵּל
  choice: ele fez a sombra retroceder
  rationale: O hifil de שוב é causativo. A formulação preserva tanto a causa exercida pelo sujeito quanto o movimento inverso da sombra.
- source_word: בַּמַּעֲלוֹת ... עֶשֶׂר מַעֲלוֹת
  choice: os dez degraus
  rationale: מַעֲלוֹת designa literalmente subidas ou degraus. “Degraus” mantém a imagem concreta sem impor a reconstrução de um relógio solar.
- source_word: אֲשֶׁר יָרְדָה
  choice: que ela havia descido
  rationale: A oração relativa descreve o movimento anterior da sombra; o mais-que-perfeito torna clara essa anterioridade em português.
- source_word: בְּמַעֲלוֹת אָחָז
  choice: nos degraus de Acaz
  rationale: Traduz de modo direto a estrutura associada a Acaz, sem defini-la mais especificamente como escadaria ou mostrador solar.
- source_word: אֲחֹרַנִּית
  choice: retroceder
  rationale: O sentido adverbial de movimento para trás é incorporado naturalmente ao verbo português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Natureza das מַעֲלוֹת de Acaz
  choice: degraus de Acaz
  alternative: escadaria de Acaz; relógio solar de Acaz; mostrador de Acaz
  rationale: O hebraico menciona degraus ou subidas, mas não identifica expressamente um relógio solar. A redação principal preserva essa indeterminação histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da frase foi ajustada para evitar que “nos degraus de Acaz” pareça modificar apenas “havia descido”, mantendo, porém, a repetição conceitual presente no hebraico. O pronome “ele” conserva a referência gramatical ao sujeito divino sem acrescentar explicação ao texto.
