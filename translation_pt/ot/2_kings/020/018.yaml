  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יקח וְ/הָיוּ֙ סָֽרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: pt
  text: Alguns dos seus filhos, que descenderão de você e que você gerará, serão levados e se tornarão eunucos[a] no palácio do rei da Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “funcionários da corte” ou “funcionários do palácio”; o termo hebraico pode referir-se tanto a eunucos em sentido literal quanto, em certos contextos, a oficiais reais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: Alguns dos seus filhos
  rationale: O מִן partitivo pede naturalmente “alguns dos”; “filhos” mantém o sentido direto de בָּנִים, sem substituir no texto a expressão por “descendentes”.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: que descenderão de você
  rationale: A expressão hebraica, literalmente “que sairão de você”, indica descendência física. “Descenderão de você” comunica esse sentido com clareza e dignidade em português atual.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: que você gerará
  rationale: O hifil de ילד, dirigido a um homem, expressa a geração paterna; “gerará” preserva esse valor específico e também a repetição enfática do original.
- source_word: יקח
  choice: serão levados
  rationale: Embora a forma consonantal seja singular ativa, o agente é indefinido no contexto. A passiva em português evita introduzir um sujeito não expresso e concorda naturalmente com “alguns dos seus filhos”.
- source_word: וְהָיוּ
  choice: e se tornarão
  rationale: Com um substantivo predicativo, היה pode indicar tanto estado quanto entrada em uma condição. Aqui, após serem levados para a corte babilônica, “se tornarão” exprime adequadamente o estado resultante.
- source_word: סָרִיסִים
  choice: eunucos
  rationale: “Eunucos” representa o sentido lexical central e é plausível no contexto de jovens da linhagem real levados para uma corte estrangeira. O sentido possível de funcionários da corte é preservado em nota.
- source_word: בְּהֵיכַל
  choice: no palácio
  rationale: Embora הֵיכָל também possa designar um templo, a referência ao rei da Babilônia determina aqui o sentido de residência ou complexo palaciano real.
- source_word: מֶלֶךְ בָּבֶל
  choice: do rei da Babilônia
  rationale: Tradução direta e idiomática da cadeia construta hebraica.
theological_decisions:
- issue: Sentido de סָרִיסִים no ambiente da corte
  choice: eunucos no texto principal
  alternative: funcionários da corte ou do palácio
  rationale: O termo pode designar eunucos em sentido literal ou, por extensão, oficiais reais. O sentido literal se ajusta ao núcleo lexical e à gravidade do juízo anunciado, mas a acepção administrativa continua possível e, por isso, é explicitada em nota sem eliminar a tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição entre “descenderão de você” e “você gerará” foi mantida porque corresponde à formulação enfática do hebraico. O marcador da nota foi colocado imediatamente após “eunucos”, termo ao qual a alternativa lexical se refere.
