  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: pt
  text: “Ah, Yahweh, lembra-te, por favor, de como tenho andado diante de ti com fidelidade[a] e de coração íntegro[b], e tenho feito o que é bom aos teus olhos.” E Ezequias chorou muito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em verdade”. O hebraico pode indicar verdade, sinceridade ou fidelidade; aqui caracteriza a conduta de Ezequias diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “de coração inteiro” ou “de coração não dividido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה
  choice: Ah
  rationale: Partícula de súplica que introduz uma oração intensa; “Ah” preserva a interjeição sem duplicar o valor suplicante de נָא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: זְכָר נָא
  choice: lembra-te, por favor
  rationale: O imperativo com נָא exprime uma súplica urgente; a formulação é natural e mantém explícita a força do pedido.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: tenho andado diante de ti
  rationale: Preserva a metáfora hebraica de caminhar como modo de vida na presença de Deus.
- source_word: בֶּאֱמֶת
  choice: com fidelidade
  rationale: No contexto, אֱמֶת caracteriza a conduta como fiel e íntegra, embora também possa ser traduzido por “em verdade”.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: de coração íntegro
  rationale: Expressa inteireza e lealdade não dividida sem sugerir perfeição moral absoluta.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: e tenho feito o que é bom aos teus olhos
  rationale: Mantém a expressão avaliativa hebraica e seu padrão de julgamento centrado em Deus.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: E Ezequias chorou muito
  rationale: A construção intensifica o choro; “chorou muito” comunica diretamente a grande intensidade sem acrescentar a nuance não explícita de amargura.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico traz o nome pessoal de Deus. “Yahweh” o conserva por transliteração e evita substituí-lo silenciosamente por um título.
- issue: Sentido de שָׁלֵם na descrição que Ezequias faz de si mesmo
  choice: de coração íntegro
  alternative: de coração inteiro; de coração não dividido; de coração perfeito
  rationale: A expressão afirma inteireza e lealdade de coração, sem resolver o texto como uma alegação de impecabilidade.
- issue: Intensidade de בְּכִי גָדוֹל
  choice: chorou muito
  alternative: chorou amargamente; chorou com grande choro
  rationale: גָדוֹל indica grande intensidade. A tradução escolhida preserva isso sem introduzir necessariamente a ideia de amargura.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém a metáfora bíblica “andar diante de ti”, usa tratamento direto em segunda pessoa e evita tanto arcaísmo excessivo quanto paráfrase interpretativa.
