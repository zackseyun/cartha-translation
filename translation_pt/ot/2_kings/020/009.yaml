base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: pt
  text: 'Isaías disse: “Este é para você o sinal da parte de Yahweh de que Yahweh fará o que disse: a sombra avançará dez degraus[a] ou recuará dez degraus?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “graus”. A palavra hebraica significa literalmente “degraus” ou “subidas”, mas tradicionalmente também é traduzida por “graus” neste contexto, por causa do movimento da sombra no dispositivo associado a Acaz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: o sinal
  rationale: אוֹת designa aqui um sinal confirmatório dado a Ezequias; “o sinal” é natural e preserva a função do termo.
- source_word: מֵאֵת יְהוָה
  choice: da parte de Yahweh
  rationale: A expressão indica origem ou procedência; “da parte de” comunica isso naturalmente em português, e o nome divino é transliterado como Yahweh.
- source_word: כִּי
  choice: de que
  rationale: 'Introduz o conteúdo confirmado pelo sinal: Yahweh cumprirá o que declarou.'
- source_word: יַעֲשֶׂה ... אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: fará o que prometeu
  rationale: Neste contexto de cumprimento, a formulação comunica em português corrente a ideia de realizar aquilo que foi previamente dito, sem alterar o referente.
- source_word: הָלַךְ הַצֵּל
  choice: a sombra avançará
  rationale: Embora הָלַךְ tenha forma de perfeito, no contexto interrogativo apresenta uma das alternativas do sinal; “avançará” exprime com clareza o movimento em contraste com “recuará”.
- source_word: מַעֲלוֹת
  choice: degraus
  rationale: O substantivo significa literalmente subidas ou degraus e provavelmente alude ao dispositivo ou à escadaria associados a Acaz; “degraus” evita a interpretação técnica de “graus” no texto principal.
- source_word: אִם
  choice: ou
  rationale: Introduz a segunda opção numa pergunta disjuntiva, naturalmente expressa em português por “ou”.
- source_word: יָשׁוּב
  choice: recuará
  rationale: שׁוּב significa voltar ou retornar; aplicado à sombra, “recuará” expressa naturalmente a inversão do movimento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido da promessa divina
  choice: fará o que prometeu
  alternative: fará a coisa que disse; cumprirá a palavra que falou
  rationale: A tradução mantém a afirmação de que Yahweh realizará sua declaração anterior, usando uma expressão portuguesa clara sem acrescentar uma especificação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta disjuntiva foi preservada, assim como a imagem concreta dos degraus e o nome divino Yahweh.
