  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: pt
  text: 'Então Ezequias, rei de Judá, mandou uma mensagem ao rei da Assíria, em Laquis[a], dizendo: “Eu pequei. Retire-se de mim. Suportarei tudo o que você impuser sobre mim[b]”. Então o rei da Assíria impôs a Ezequias, rei de Judá, trezentos talentos de prata e trinta talentos de ouro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Laquis”. A forma hebraica pode indicar movimento em direção a Laquis, embora aqui provavelmente identifique o lugar onde estava o rei da Assíria.
    reason: lexical_alternative
  - marker: b
    text: Ou “tudo o que você colocar sobre mim, eu carregarei/pagarei”. O hebraico fala em suportar o encargo ou tributo colocado sobre ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou uma mensagem
  rationale: O verbo significa literalmente “enviou”, com mensageiros ou uma mensagem subentendidos. Em português, explicitar “uma mensagem” torna clara a ação comunicativa introduzida pela fala direta sem acrescentar conteúdo substancial.
- source_word: לָכִישָׁה
  choice: em Laquis
  rationale: Embora o he locativo possa indicar movimento para Laquis, o contexto favorece a identificação do lugar onde estava o rei da Assíria. A alternativa literal é preservada em nota.
- source_word: חָטָאתִי
  choice: Eu pequei
  rationale: חטא é o verbo comum para “pecar”. Mesmo em contexto diplomático, esta tradução preserva a força moral da admissão, sem reduzi-la silenciosamente a mero erro político.
- source_word: שׁוּב מֵעָלַי
  choice: Retire-se de mim
  rationale: A expressão descreve afastar-se ou retirar a pressão hostil. “Retire-se de mim” é natural no contexto político-militar e mantém o imperativo.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: tudo o que você impuser sobre mim
  rationale: A construção refere-se a colocar sobre alguém um encargo, tributo ou penalidade. “Impuser” comunica o sentido sem especificar além do hebraico.
- source_word: אֶשָּׂא
  choice: Suportarei
  rationale: נשא significa carregar ou suportar. Aqui alude a assumir o encargo imposto, provavelmente pagando-o; “suportarei” preserva a imagem ampla.
- source_word: וַיָּשֶׂם ... עַל
  choice: impôs a
  rationale: A construção indica estabelecer sobre Ezequias uma obrigação ou tributo e mantém coerência lexical com a fala anterior.
- source_word: כִּכַּר
  choice: talentos
  rationale: ככר é uma antiga unidade de peso convencionalmente vertida como “talento” nas traduções bíblicas portuguesas.
- source_word: כֶּסֶף
  choice: prata
  rationale: O texto especifica o metal pesado, não apenas dinheiro.
- source_word: זָהָב
  choice: ouro
  rationale: É o sentido lexical direto do termo, aqui medido em talentos.
theological_decisions:
- issue: Força moral da confissão de Ezequias
  choice: “Eu pequei”
  alternative: “Eu errei” ou “Eu o ofendi”
  rationale: A situação é diplomática, mas o hebraico emprega o verbo comum para pecar. A tradução mantém essa possível dimensão moral sem decidir contra o valor político contextual.
- issue: Grau de interpretação na linguagem do tributo
  choice: “tudo o que você impuser sobre mim, suportarei”
  alternative: “pagarei qualquer tributo que você exigir”
  rationale: A formulação escolhida conserva a imagem hebraica de impor e carregar um encargo. O restante do versículo esclarece que esse encargo tomou a forma de metais preciosos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A colocação “em Laquis” evita ambiguidade sintática no corpo do texto, enquanto a nota conserva a leitura direcional. O tratamento por “você” torna a fala direta natural no português brasileiro moderno sem alterar a assimetria política do diálogo.
