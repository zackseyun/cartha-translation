  text: וַֽ/יִּלְכְּדֻ֗/הָ מִ/קְצֵה֙ שָׁלֹ֣שׁ שָׁנִ֔ים בִּ/שְׁנַת שֵׁ֖שׁ לְ/חִזְקִיָּ֑ה הִ֣יא שְׁנַת תֵּ֗שַׁע לְ/הוֹשֵׁ֨עַ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל נִלְכְּדָ֖ה שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/010.yaml
  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: pt
  text: Ao fim de três anos[a], eles a conquistaram. No sexto ano de Ezequias, que era o nono ano de Oseias, rei de Israel, Samaria foi conquistada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Depois de três anos”. A expressão hebraica significa mais literalmente “ao fim de três anos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: eles a conquistaram
  rationale: O qal narrativo na terceira pessoa do plural, com sufixo feminino singular, retoma Samaria no contexto anterior. A construção ativa e o pronome são preservados.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: Ao fim de três anos
  rationale: A expressão temporal indica o término de um período de três anos. A formulação conserva de perto o idioma hebraico sem deixar de ser natural em português.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: No sexto ano de Ezequias
  rationale: Forma portuguesa natural para a fórmula de datação segundo o ano de reinado.
- source_word: הִיא
  choice: que era
  rationale: O pronome relaciona por aposição as duas datas reais; “que era” expressa naturalmente essa sincronização.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: o nono ano de Oseias, rei de Israel
  rationale: Preserva a segunda datação real e mantém explicitamente o título atribuído a Oseias.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: Samaria foi conquistada
  rationale: O nifal perfeito apresenta a tomada da cidade em construção passiva. A repetição da raiz לכד é refletida pela repetição de “conquistar”.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
theological_decisions: []
