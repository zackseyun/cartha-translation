  register: Português atual, digno e de leitura ampla, com sintaxe narrativa clara. Mantém-se a alternância do hebraico entre a primeira declaração ativa (“eles a conquistaram”) e a recapitulação passiva (“Samaria foi conquistada”). O marcador da nota foi colocado junto à expressão temporal que ela esclarece.
