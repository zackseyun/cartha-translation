base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: pt
  text: No terceiro ano de Oseias, filho de Elá, rei de Israel, Ezequias, filho de Acaz, tornou-se rei[a] de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, «começou a reinar». Nesta fórmula régia, o verbo hebraico assinala a ascensão de Ezequias ao trono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[não expresso separadamente]'
  rationale: A forma introduz a nova seção narrativa. Em português moderno, a transição é comunicada naturalmente pela própria oração, sem acrescentar «ora» ou a fórmula arcaizante «e aconteceu».
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: No terceiro ano
  rationale: É a fórmula normal de datação por ano de reinado e soa natural em português.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: de Oseias, filho de Elá
  rationale: A preposição לְ indica aqui o reinado que serve de referência para a data. Empregam-se as formas portuguesas tradicionais dos nomes.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Reproduz diretamente o título e o reino de Oseias.
- source_word: מָלַךְ
  choice: tornou-se rei
  rationale: Nesta fórmula régia, o verbo assinala a ascensão de Ezequias ao trono, não toda a duração do seu reinado.
- source_word: חִזְקִיָּה בֶן אָחָז
  choice: Ezequias, filho de Acaz
  rationale: Usam-se as formas portuguesas correntes dos nomes e preserva-se a identificação filial.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Ligado em português a «tornou-se», comunica de modo claro que Ezequias ascendeu ao trono de Judá, evitando uma repetição pouco natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem informativa do hebraico foi preservada, mas foram acrescentadas vírgulas para distinguir com clareza os nomes, as filiações e o título de Oseias. O marcador da nota foi colocado junto à expressão verbal que ela explica.
