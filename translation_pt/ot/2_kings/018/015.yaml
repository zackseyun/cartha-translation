base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: pt
  text: Assim, Ezequias entregou toda a prata que se encontrava na casa de Yahweh[a] e nas tesourarias da casa do rei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no templo de Yahweh”; literalmente, “na casa de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas tesourarias do palácio real”; literalmente, “nas tesourarias da casa do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: entregou
  rationale: No contexto do tributo prometido no versículo anterior, נתן expressa dar ou passar às mãos de alguém. “Entregou” é natural em português e não especifica além do texto a forma exata da transação.
- source_word: חִזְקִיָּה
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כָּל הַכֶּסֶף
  choice: toda a prata
  rationale: Preserva o sentido concreto de כֶּסֶף, que pode também designar dinheiro, e mantém a abrangência de כָּל.
- source_word: הַנִּמְצָא
  choice: que se encontrava
  rationale: Reproduz naturalmente em português o particípio nifal de מצא, com o sentido da prata que estava disponível nesses locais.
- source_word: בֵית יְהוָה
  choice: casa de Yahweh
  rationale: Mantém a expressão hebraica literal “casa de Yahweh”; no contexto, ela designa o templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וּבְאֹצְרוֹת
  choice: e nos tesouros
  rationale: אֹצָר pode designar tesouro, depósito ou câmara do tesouro. Aqui, o plural “tesouros” comunica naturalmente os fundos ou reservas guardados no complexo real.
- source_word: בֵּית הַמֶּלֶךְ
  choice: casa do rei
  rationale: Preserva a formulação hebraica e o paralelo com “casa de Yahweh”; contextualmente, refere-se ao palácio ou complexo real.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa por transliteração, sem convertê-lo em título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e o paralelismo do hebraico foram preservados sem produzir sintaxe artificial. “Prata” mantém a concretude do original; “entregou” explicita apenas o valor contextual imediato de נתן.
