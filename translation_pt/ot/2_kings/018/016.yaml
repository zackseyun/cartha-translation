base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: pt
  text: Naquele tempo, Ezequias cortou as portas do templo de Yahweh e as ombreiras[a] que Ezequias, rei de Judá, havia revestido e as entregou ao rei da Assíria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “batentes”, “molduras das portas” ou “pilares”; o termo hebraico é raro e pode designar, de modo mais amplo, estruturas de sustentação associadas às portas do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal narrativa natural em português, que preserva a ligação com os acontecimentos anteriores.
- source_word: קִצַּץ
  choice: cortou
  rationale: Mantém a ação concreta de cortar para remover, sem reduzi-la à ideia interpretativa de apenas retirar o revestimento.
- source_word: דַּלְתוֹת
  choice: as portas
  rationale: Equivalente claro e corrente para as folhas ou estruturas das portas.
- source_word: הֵיכַל יְהוָה
  choice: o templo de Yahweh
  rationale: Neste contexto, הֵיכַל designa claramente o templo de Jerusalém; o nome divino é transliterado como Yahweh.
- source_word: הָאֹמְנוֹת
  choice: as ombreiras
  rationale: O termo arquitetônico raro parece indicar elementos estruturais ligados às portas; 'ombreiras' é conciso e plausível, com a incerteza preservada em nota.
- source_word: צִפָּה
  choice: havia revestido
  rationale: Expressa a aplicação de uma cobertura, provavelmente metálica, sem especificar um material que este versículo não nomeia.
- source_word: וַיִּתְּנֵם
  choice: e as entregou
  rationale: No contexto de tributo ao rei assírio, 'entregou' soa natural e conserva o sentido básico de dar.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: ao rei da Assíria
  rationale: Tradução direta e idiomática da construção hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio presente no texto hebraico, sem substituí-lo por um título.
- issue: Objeto do revestimento e repetição do nome de Ezequias
  choice: que o próprio Ezequias, rei de Judá, havia revestido
  alternative: que Ezequias, rei de Judá, havia revestido
  rationale: A repetição explícita de חִזְקִיָּה no hebraico é mantida com 'o próprio Ezequias', destacando a tensão narrativa de ele desfazer aquilo que havia revestido, sem acrescentar uma avaliação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe narrativa fluente. A nota conserva a incerteza lexical de הָאֹמְנוֹת; 'revestido' evita especificar ouro, que não é mencionado neste versículo.
