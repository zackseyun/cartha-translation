source:
  edition: WLC
  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: pt
  text: porque não deram ouvidos à voz de Yahweh, seu Deus,[a] mas violaram sua aliança, tudo o que Moisés, servo de Yahweh, ordenou; não deram ouvidos[c] nem o puseram em prática.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedeceram à voz de Yahweh, seu Deus”. A expressão hebraica “dar ouvidos à voz” frequentemente inclui a ideia de obedecer.'
    reason: lexical_alternative
  - marker: c
    text: A repetição de “não deram ouvidos” reproduz a ênfase do hebraico e ressalta a recusa persistente, não apenas um ato isolado de desobediência.
    reason: cultural_note
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: porque
  rationale: Introduz naturalmente, em português, a causa do exílio narrado no versículo anterior.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: deram ouvidos à voz de
  rationale: Preserva a expressão concreta hebraica e sua implicação de obediência sem reduzi-la simplesmente a “obedecer”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיַּעַבְרוּ אֶת בְּרִיתוֹ
  choice: violaram sua aliança
  rationale: No contexto de aliança, עבר expressa transgressão ou violação; “violaram” é atual, claro e mantém a força moral e pactual.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: tudo o que ... ordenou
  rationale: Mantém o alcance total daquilo que foi ordenado e permite que a expressão explique o conteúdo da aliança violada.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Moisés, servo de Yahweh
  rationale: “Servo” preserva o caráter honorífico e oficial do título de Moisés.
- source_word: וְלֹא שָׁמְעוּ
  choice: não deram ouvidos
  rationale: Repete a formulação inicial, reproduzindo a ênfase retórica do hebraico.
- source_word: וְלֹא עָשׂוּ
  choice: nem o puseram em prática
  rationale: Expressa de modo natural a ideia de não executar o conjunto do que fora ordenado; o pronome retoma coletivamente “tudo o que ... ordenou”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Se שׁמע deve ser explicitado como “obedecer”
  choice: dar ouvidos
  alternative: obedecer
  rationale: A expressão hebraica implica obediência, mas “dar ouvidos” conserva tanto a imagem original quanto sua repetição enfática, sem eliminar a tensão entre ouvir e agir.
- issue: Relação de אֵת כָּל אֲשֶׁר צִוָּה com “sua aliança”
  choice: aposição explicativa marcada por travessão
  alternative: tratar “tudo o que Moisés ordenou” como objeto coordenado de “violaram”
  rationale: A construção hebraica é compacta e admite tensão sintática. O travessão apresenta os mandamentos como explicação do conteúdo da aliança sem acrescentar uma relação teológica não expressa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Dar ouvidos” é idiomático e preserva a imagem hebraica; “puseram em prática” evita a ambiguidade pouco natural de “fizeram isso”. O travessão torna legível a aposição sem suavizar completamente a sintaxe tensa do original.
