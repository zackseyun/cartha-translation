id: 2KI.18.6
reference: 2 Kings 18:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּדְבַּק֙ בַּֽ/יהוָ֔ה לֹא סָ֖ר מֵ/אַֽחֲרָ֑י/ו וַ/יִּשְׁמֹר֙ מִצְוֺתָ֔י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: pt
  text: Ele permaneceu apegado a Yahweh e não deixou de segui-lo[a]. Obedeceu aos mandamentos que Yahweh havia dado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não se afastou de trás dele”; isto é, não deixou de segui-lo.'
    reason: A nota preserva a imagem hebraica subjacente e esclarece seu sentido de fidelidade contínua.
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: permaneceu apegado
  rationale: דבק expressa forte ligação e lealdade contínua; a formulação natural em português preserva a força relacional e pactual do verbo.
- source_word: בַּיהוָה
  choice: a Yahweh
  rationale: A preposição marca aquele a quem Ezequias se manteve ligado, e o nome divino é transliterado como Yahweh.
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: não deixou de segui-lo
  rationale: A construção סור מן + אחר indica abandonar o seguimento ou desviar-se da lealdade; esta redação comunica isso de modo claro e corrente.
- source_word: וַיִּשְׁמֹר
  choice: Obedeceu
  rationale: שׁמר, quando tem mandamentos por objeto, significa observá-los ou cumpri-los; 'obedeceu aos mandamentos' é idiomático e mantém o sentido.
- source_word: מִצְוֺתָיו
  choice: aos mandamentos
  rationale: מצוה designa mandamento ou ordem e aqui conserva o registro pactual e legal.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: que Yahweh havia dado a Moisés
  rationale: A oração identifica os mandamentos como os dados por Yahweh a Moisés; o mais-que-perfeito composto esclarece a anterioridade sem mudar o sentido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pactual em vez de substituí-lo por um título.
- issue: Força pactual de דבק
  choice: permaneceu apegado
  alternative: agarrou-se; uniu-se
  rationale: A escolha preserva a ideia de lealdade firme sem restringir o verbo a contato físico nem acrescentar uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação pesada, sem alterar as relações do hebraico.
