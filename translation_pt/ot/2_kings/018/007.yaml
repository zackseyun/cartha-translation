base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: pt
  text: E Yahweh estava com ele; em tudo o que empreendia, era bem-sucedido.[a] Ele se rebelou contra o rei da Assíria e não o serviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por onde quer que fosse, prosperava” ou “em tudo o que fazia, agia com sabedoria”. O termo hebraico reúne as ideias de sabedoria e sucesso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: וְהָיָה ... עִמּוֹ
  choice: estava com ele
  rationale: Expressa de modo natural a presença contínua e favorável de Yahweh.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: em tudo o que empreendia
  rationale: O hebraico é literalmente próximo de 'em tudo em que saía', mas, neste contexto régio, a expressão abrange ações, iniciativas e possíveis campanhas.
- source_word: יַשְׂכִּיל
  choice: era bem-sucedido
  rationale: O hifil de שׂכל reúne as ideias de agir com sabedoria e, por isso, alcançar êxito; o texto principal destaca o resultado, enquanto a nota preserva a amplitude lexical.
- source_word: וַיִּמְרֹד
  choice: se rebelou
  rationale: Equivalente corrente para rebelião política contra uma autoridade imperial.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: contra o rei da Assíria
  rationale: Tradução direta e natural do objeto político da rebelião.
- source_word: וְלֹא עֲבָדוֹ
  choice: deixou de servi-lo
  rationale: No contexto político, עבד descreve serviço de vassalagem. 'Deixou de servi-lo' explicita a interrupção desse vínculo sem acrescentar detalhes como tributo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração 'Yahweh' preserva o nome próprio e segue a convenção do projeto.
- issue: Natureza do êxito de Ezequias
  choice: era bem-sucedido, com nota sobre agir sabiamente
  alternative: agia com sabedoria
  rationale: יַשְׂכִּיל pode indicar tanto conduta prudente quanto sucesso. A formulação escolhida mantém o foco narrativo no êxito sem eliminar a dimensão de sabedoria, registrada na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção 'em tudo o que empreendia' comunica o idioma hebraico sem a rigidez de uma tradução literal de 'sair'.
