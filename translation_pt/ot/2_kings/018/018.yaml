  text: וַֽ/יִּקְרְאוּ֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֵּצֵ֧א אֲלֵ/הֶ֛ם אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָה֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: pt
  text: Eles chamaram pelo rei, e Eliaquim, filho de Hilquias, responsável pela casa real[a], saiu ao encontro deles[b], junto com Sebna, o escriba[c], e Joá, filho de Asafe, o cronista.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que estava sobre a casa”. Trata-se de um título administrativo; também pode ser entendido como “encarregado do palácio”.
    reason: cultural_note
  - marker: b
    text: Ou “foi até eles”.
    reason: lexical_alternative
  - marker: c
    text: Ou “secretário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: Eles chamaram pelo rei
  rationale: No contexto diplomático, קרא com אֶל indica que pediram a presença do rei. “Chamaram pelo rei” é natural em português e evita intensificar a ação como uma convocação formal.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: saiu ao encontro deles
  rationale: יצא significa sair, e אֲלֵהֶם indica movimento em direção a eles. A expressão portuguesa comunica naturalmente que o oficial saiu para encontrar a delegação.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Eliaquim, filho de Hilquias
  rationale: Os nomes são transliterados em formas portuguesas reconhecíveis, e o patronímico hebraico é preservado de modo direto.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: responsável pela casa real
  rationale: A expressão é um título administrativo. “Casa real” conserva a imagem de בַּיִת e deixa claro, em linguagem corrente, que se trata da administração régia, sem definir com excessiva precisão o alcance do cargo.
- source_word: וְשֶׁבְנָה הַסֹּפֵר
  choice: junto com Sebna, o escriba
  rationale: A construção mostra Sebna acompanhando Eliaquim. סֹפֵר designa um oficial ligado à escrita e à documentação; “escriba” preserva o termo tradicional, enquanto a nota registra a alternativa funcional “secretário”.
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: e Joá, filho de Asafe
  rationale: Os nomes e o patronímico são apresentados em formas portuguesas convencionais.
- source_word: הַמַּזְכִּיר
  choice: o cronista
  rationale: O termo designa um oficial régio encarregado de registros ou memoriais. “Cronista” é uma equivalência portuguesa estabelecida e distingue este cargo do סֹפֵר mencionado antes.
