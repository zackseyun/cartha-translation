source:
  edition: WLC
  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: pt
  text: 'Agora, será que subi contra este lugar para destruí-lo sem Yahweh[a]? Yahweh me disse: “Suba contra esta terra e destrua-a.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à parte de Yahweh” ou “independentemente de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: será que... sem
  rationale: A partícula interrogativa הֲ e a expressão מִבַּלְעֲדֵי formam uma pergunta retórica. “Será que... sem” é natural em português e preserva a alegação de que a ação não ocorreu à parte de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: עָלִיתִי
  choice: subi
  rationale: Traduz diretamente o verbo עלה e mantém seu sentido de movimento ascendente, que no contexto também pode envolver avanço militar.
- source_word: הַמָּקוֹם הַזֶּה
  choice: este lugar
  rationale: Mantém o termo amplo מָקוֹם sem explicitar Jerusalém no corpo do texto.
- source_word: לְהַשְׁחִיתוֹ
  choice: para destruí-lo
  rationale: Expressa de modo direto o infinitivo causativo de שׁחת e conserva o pronome masculino referente a “lugar” em português.
- source_word: אָמַר אֵלַי
  choice: me disse
  rationale: Formulação portuguesa natural e fiel para a declaração de que Yahweh teria dado a ordem.
- source_word: עֲלֵה
  choice: Suba
  rationale: Preserva o imperativo de עלה e a imagem geográfica ou militar de subir contra a terra.
- source_word: הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: Conserva אֶרֶץ como “terra” e não reduz seu referente a uma cidade específica.
- source_word: וְהַשְׁחִיתָהּ
  choice: e destrua-a
  rationale: Mantém a repetição da raiz שׁחת e usa o pronome feminino correspondente a “terra”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama. “Yahweh” preserva o nome próprio e evita trocá-lo por um título.
- issue: Natureza da alegação de autorização divina
  choice: Manter a fala como alegação direta do oficial assírio, sem confirmá-la nem negá-la
  alternative: Sinalizar no texto que a alegação é falsa ou verdadeira
  rationale: O versículo registra a afirmação do emissário, mas neste ponto não resolve explicitamente seu estatuto teológico. A tradução preserva essa tensão.
- issue: Referentes de “este lugar” e “esta terra”
  choice: Conservar as duas expressões distintas
  alternative: Jerusalém e Judá
  rationale: O original emprega מָקוֹם e אֶרֶץ. Não substituir esses termos por referentes interpretativamente mais específicos evita estreitar o sentido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da primeira frase foi levemente ajustada para soar natural em português, sem perder a pergunta retórica nem a relação entre a ação militar e a alegada autorização de Yahweh.
