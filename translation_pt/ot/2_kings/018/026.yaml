base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: pt
  text: 'Então Eliaquim, filho de Hilquias, Sebna e Joá disseram ao Rabe-Saqué: “Por favor, fale com os seus servos em aramaico, pois nós entendemos essa língua. Não fale conosco na língua de Judá[a], ao alcance dos ouvidos do povo que está sobre a muralha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em hebraico”. O termo hebraico é יְהוּדִית, literalmente “judaico” ou “de Judá”, e se refere à língua do reino de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabe-Saqué
  rationale: Mantém o título assírio em forma tradicionalmente reconhecível em português, sem definir com excesso de certeza qual era a função exata do oficial.
- source_word: דַּבֶּר נָא
  choice: Por favor, fale
  rationale: O imperativo com נָא expressa um pedido cortês; esta formulação é natural em português atual.
- source_word: עֲבָדֶיךָ
  choice: os seus servos
  rationale: No contexto diplomático, é uma expressão convencional de deferência, sem destacar a ideia de escravidão.
- source_word: אֲרָמִית
  choice: em aramaico
  rationale: A forma indica a língua em que deveriam falar; a construção adverbial é idiomática em português.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: pois nós entendemos essa língua
  rationale: שׁמע pode significar ouvir ou entender; aqui, a competência linguística é o sentido contextual. 'Essa língua' explicita naturalmente o referente.
- source_word: יְהוּדִית
  choice: na língua de Judá
  rationale: Reproduz o vínculo lexical com Judá e evita apresentar 'hebraico' como uma identificação técnica indiscutível.
- source_word: בְּאָזְנֵי
  choice: para que ... não ouça
  rationale: Expressa em português natural o sentido contextual da locução hebraica 'aos ouvidos de', preservando o destaque auditivo.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: o povo que está sobre a muralha
  rationale: Mantém 'povo', sem restringir o referente a soldados, e conserva a localização indicada pela oração relativa.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Então ... disseram ao
  rationale: O waw consecutivo faz a narrativa avançar; o plural em português concorda naturalmente com os três homens que falam.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala preserva o tom diplomático e deferente. A ordem final foi formulada de modo natural, sem perder a referência ao que o povo na muralha poderia ouvir.
