base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: pt
  text: 'Então o Rabsaqué se pôs de pé e gritou em voz alta, na língua de Judá[a], e falou, dizendo: “Ouçam a palavra do grande rei, o rei da Assíria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em hebraico”. O termo hebraico designa mais especificamente a língua de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se pôs de pé
  rationale: Expressa naturalmente a ação narrativa de עמד sem acrescentar a ideia militar mais forte de tomar posição.
- source_word: רַב שָׁקֵה
  choice: o Rabsaqué
  rationale: Mantém a designação histórica assíria tradicionalmente transliterada em português, em vez de impor uma tradução incerta do título do cargo.
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: gritou em alta voz
  rationale: Reproduz de modo corrente e concreto a proclamação pública feita com voz forte.
- source_word: יְהוּדִית
  choice: na língua de Judá
  rationale: Preserva a especificidade histórica do termo, que designa a língua ou variedade linguística de Judá, evitando identificá-la sem ressalva com o hebraico em sentido mais amplo.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: Ele falou e disse
  rationale: Conserva os dois verbos introdutórios do hebraico e seu efeito narrativo enfático, embora a repetição seja incomum no português moderno.
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural direto e natural em português, apropriado ao tom de proclamação pública.
- source_word: דְּבַר
  choice: a palavra
  rationale: Mantém o caráter formal da declaração real e a correspondência direta com דבר.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: o grande rei
  rationale: Reflete diretamente o título régio assírio sem reinterpretar גָּדוֹל como poderoso.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Tradução clara, formal e idiomática da construção hebraica.
