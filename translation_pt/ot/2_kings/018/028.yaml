translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição “falou e disse” foi mantida deliberadamente para refletir a forma enfática da introdução hebraica; “Rabsaqué” preserva a designação histórica tradicional.
