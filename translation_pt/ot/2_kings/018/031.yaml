source:
  edition: WLC
  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר מֶ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵֽנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵֽי בוֹרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: pt
  text: '“Não deem ouvidos a Ezequias, pois assim diz o rei da Assíria: ‘Façam as pazes comigo[a] e saiam para vir a mim. Cada um coma dos frutos da sua própria videira e da sua própria figueira, e cada um beba a água da sua própria cisterna.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “façam comigo uma bênção”; expressão que aqui significa fazer as pazes ou entrar em acordo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: deem ouvidos a
  rationale: A construção שׁמע com אֶל significa ouvir, dar atenção ou acatar. “Dar ouvidos a” é idiomático em português e preserva tanto o ato de escutar quanto a ideia implícita de seguir o conselho.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כִּי כֹה אָמַר
  choice: pois assim diz
  rationale: Reproduz de modo conciso e digno a fórmula hebraica que introduz discurso direto.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Tradução direta e transparente da cadeia construta hebraica.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: Façam as pazes comigo
  rationale: A expressão hebraica é incomum e, neste contexto de cerco, convida os habitantes a aceitar termos favoráveis com o rei assírio. A formulação idiomática comunica esse sentido sem inserir explicitamente “rendam-se”; a redação literal é registrada em nota.
- source_word: וּצְאוּ אֵלַי
  choice: e venham até mim
  rationale: Preserva o sentido concreto de sair da cidade e dirigir-se ao emissário ou ao poder assírio, sem explicitar como “rendam-se” aquilo que permanece implícito no contexto.
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: Cada um coma da sua própria videira e da sua própria figueira
  rationale: Mantém os imperativos e a distribuição individual expressa por אִישׁ. “Videira e figueira” conserva a imagem hebraica de segurança agrícola e vida estabelecida.
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: e cada um beba a água da sua própria cisterna
  rationale: בּוֹר designa aqui uma cisterna ou reservatório escavado para armazenar água, não necessariamente um poço alimentado por nascente.
theological_decisions:
- issue: Uso distributivo e gramaticalmente masculino de אִישׁ
  choice: cada um
  alternative: cada homem
  rationale: “Cada um” expressa naturalmente em português o valor distributivo do hebraico e mantém a forma masculina genérica sem sugerir, de maneira indevida, que a promessa se limitava aos homens adultos.
- issue: Expressão política idiomática עֲשׂוּ אִתִּי בְרָכָה
  choice: Façam as pazes comigo
  alternative: Façam comigo uma bênção
  rationale: No contexto, a expressão se refere a entrar em acordo com o rei assírio. A tradução principal comunica a função política, enquanto a nota preserva a forma incomum do hebraico e sua ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “deem” dirige-se coletivamente aos habitantes, enquanto “cada um” preserva a distribuição individual. Os imperativos “coma” e “beba” mantêm a forma do hebraico, sem transformar a promessa retórica em simples declaração futura.
