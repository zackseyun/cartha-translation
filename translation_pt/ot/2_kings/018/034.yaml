  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: pt
  text: Onde estão os deuses de Hamate e Arpade? Onde estão os deuses de Sefarvaim, Hena e Iva[a]? Será que livraram Samaria da minha mão?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome «Iva» também é transliterado «Ava».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Onde estão
  rationale: O interrogativo indica localização. Embora a forma hebraica não marque plural, o português pede «estão» por concordância com «os deuses»; a repetição preserva o tom de escárnio.
- source_word: אֱלֹהֵי
  choice: os deuses de
  rationale: É a forma construta de אֱלֹהִים e, neste contexto, designa as divindades associadas às cidades e aos povos mencionados.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamate e Arpade
  rationale: Transliterações correntes e reconhecíveis em português para os topônimos hebraicos.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: Sefarvaim, Hena e Iva
  rationale: Os topônimos são transliterados segundo formas correntes em português. A variante «Ava» para עִוָּה é registrada em nota.
- source_word: כִּי
  choice: Será que
  rationale: Aqui כִּי introduz ou reforça a pergunta retórica ligada ao escárnio anterior. «Será que» comunica essa força em português natural sem impor ao termo uma equivalência lexical rígida.
- source_word: הִצִּילוּ
  choice: livraram
  rationale: O hifil de נצל significa livrar ou resgatar alguém do poder ou perigo; «livraram» se ajusta ao contexto militar e à expressão «da minha mão».
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Mantém a imagem concreta do hebraico, que neste contexto expressa poder ou domínio, e continua clara em português.
theological_decisions:
- issue: A provocação do emissário assírio a respeito das divindades de outros povos
  choice: Manter a fala como uma pergunta retórica arrogante, sem comentar a existência ou o poder real dessas divindades.
  alternative: Explicitar que eram deuses falsos ou interpretar «mão» diretamente como «poder».
  rationale: O hebraico apresenta a alegação do próprio orador e deixa sua tensão teológica no contexto narrativo. A tradução não deve transformar a fala em endosso nem acrescentar uma avaliação doutrinária ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «Onde estão» conserva a cadência provocadora do original; «da minha mão» retém a metáfora hebraica sem prejudicar a compreensão.
