  terminology: “SENHOR” segue a convenção portuguesa estabelecida para o tetragrama; “lugares altos”, “altares” e “prostrar-se” mantêm apropriadamente o vocabulário cultual. Não há imposição doutrinária nem alteração da perspectiva equivocada atribuída ao interlocutor assírio.
