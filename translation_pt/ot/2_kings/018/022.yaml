  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: pt
  text: 'Mas, se vocês me disserem: ‘Confiamos no SENHOR, nosso Deus’, não é ele aquele cujos lugares altos e altares Ezequias removeu, dizendo a Judá e a Jerusalém: ‘É diante deste altar, em Jerusalém, que vocês devem se prostrar’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּמֹתָיו
  choice: seus lugares altos
  rationale: Mantém o termo cultual hebraico e o pronome que, na fala do emissário assírio, atribui esses santuários ao SENHOR.
- source_word: תִּשְׁתַּחֲווּ
  choice: vocês devem se prostrar
  rationale: Expressa o gesto concreto de inclinar-se em adoração, sem reduzir o verbo ao sentido mais genérico de prestar culto.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para representar o nome divino, distinguindo-o por versaletes.
- source_word: לִפְנֵי הַמִּזְבֵּחַ הַזֶּה
  choice: diante deste altar
  rationale: Reproduz diretamente a relação espacial do hebraico e conserva a ênfase no altar indicado.
theological_decisions:
- issue: Atribuição dos lugares altos e altares ao SENHOR
  choice: preservar ‘seus lugares altos e altares’
  alternative: explicitar que o assírio interpretava equivocadamente a reforma de Ezequias
  rationale: O texto apresenta o argumento do emissário sem inserir uma correção editorial; a ironia e o equívoco teológico devem permanecer perceptíveis no próprio contexto.
- issue: Centralização do culto em Jerusalém
  choice: traduzir a ordem como prostração diante deste altar em Jerusalém
  alternative: parafrasear como exclusividade legítima do templo
  rationale: A tradução conserva a formulação da fala adversária sem acrescentar uma avaliação doutrinária.
translation_notes:
  register: Português contemporâneo, digno e acessível, com tratamento plural por ‘vocês’. A construção enfática ‘É diante deste altar... que’ comunica naturalmente o foco hebraico e evita uma leitura em que ‘em Jerusalém’ modifique apenas o ato de prostrar-se.
