  source_fidelity: A tradução reproduz com precisão a estrutura condicional, a pergunta retórica e a atribuição, na fala do emissário, dos lugares altos e altares ao SENHOR. “Seus lugares altos e altares” preserva corretamente o pronome hebraico e não corrige editorialmente a alegação do personagem. “Diante deste altar, em Jerusalém” corresponde a לִפְנֵי הַמִּזְבֵּחַ הַזֶּה ... בִּירוּשָׁלִָם, e “se prostrar” traduz adequadamente o gesto cultual de תִּשְׁתַּחֲווּ.
