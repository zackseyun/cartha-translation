  text: כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ אַל יַשִּׁ֥יא לָ/כֶ֖ם חִזְקִיָּ֑הוּ כִּי לֹ֣א יוּכַ֔ל לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: pt
  text: 'Assim diz o rei: Não deixem que Ezequias engane vocês[a], pois ele não poderá livrá-los da mão dele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desencaminhe vocês”. O verbo hebraico pode indicar levar alguém ao erro ou enganá-lo.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “da mão dele”, expressão que significa estar sob o poder de alguém. O texto paralelo em Isaías 36:14 diz “da minha mão”.'
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula solene de proclamação real em português atual e digno.
- source_word: הַמֶּלֶךְ
  choice: o rei
  rationale: Mantém o título definido do hebraico, sem explicitar o nome do rei assírio.
- source_word: אַל יַשִּׁיא לָכֶם
  choice: Não deixem que ... engane vocês
  rationale: Expressa naturalmente a proibição e o sentido causativo de levar ao erro ou enganar; a forma plural fica clara em “deixem” e “vocês”.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: כִּי לֹא יוּכַל
  choice: pois ele não poderá
  rationale: “Pois” introduz a razão, e “não poderá” conserva a ideia prospectiva de incapacidade expressa pelo imperfeito.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: livrá-los
  rationale: “Livrar” é natural no contexto militar e preserva a ideia de retirar alguém do perigo ou do domínio de outro.
- source_word: מִיָּדוֹ
  choice: da mão dele
  rationale: Segue o sufixo de terceira pessoa singular do texto massorético e preserva a imagem hebraica de poder ou domínio.
theological_decisions:
- issue: Referente do sufixo em מִיָּדוֹ (“mão dele”)
  choice: da mão dele
  alternative: da minha mão; do poder dele
  rationale: O WLC traz o sufixo masculino de terceira pessoa singular, que remete naturalmente ao rei mencionado. A tradução não harmoniza o texto com Isaías 36:14, que apresenta “minha mão”, nem dissolve a metáfora em “poder”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fórmula régia mantém certa solenidade; “vocês” explicita com naturalidade o destinatário plural. A ordem dos marcadores foi normalizada para acompanhar os pontos correspondentes no texto.
