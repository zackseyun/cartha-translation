base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: pt
  text: 'Você diz: “É apenas uma palavra dos lábios” — mas conselho e força são para a guerra. Agora, em quem você confiou, para se rebelar contra mim?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: conversa vazia
  rationale: A expressão literalmente significa “palavra dos lábios”, mas, neste contexto de desprezo retórico, refere-se a palavras sem substância ou eficácia. “Conversa vazia” comunica o sentido idiomático em português corrente.
- source_word: עֵצָה
  choice: estratégia
  rationale: No contexto militar, o termo designa conselho, plano ou prudência estratégica; “estratégia” torna clara sua função sem acrescentar uma ideia estranha ao hebraico.
- source_word: גְבוּרָה
  choice: poder
  rationale: O substantivo pode indicar força, valentia ou poder. “Poder” preserva a amplitude do termo no contexto dos recursos necessários para a guerra.
- source_word: בָטַחְתָּ
  choice: você confia
  rationale: O perfeito hebraico, em uma pergunta sobre a base atual da rebelião, pode ser expresso naturalmente pelo presente em português.
- source_word: מָרַדְתָּ
  choice: se rebelar
  rationale: Traduz diretamente a ação de resistir ou revoltar-se contra a autoridade do rei assírio.
theological_decisions:
- issue: Natureza da confiança de Ezequias
  choice: 'Manter a pergunta aberta: “Em quem... você confia?”'
  alternative: Identificar explicitamente o Egito ou o SENHOR
  rationale: O versículo formula uma pergunta retórica sem nomear ainda o objeto da confiança; explicitá-lo aqui anteciparia o desenvolvimento dos versículos seguintes.
- issue: Relação entre palavras, estratégia e poder
  choice: Usar o contraste “mas” sem transformar a afirmação em comentário teológico
  alternative: Interpretar as palavras como confissão religiosa ineficaz
  rationale: O contexto é uma provocação político-militar do oficial assírio; a tradução deve preservar essa tensão sem importar uma aplicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” adequado à fala direta. A formulação idiomática evita o literalismo obscuro de “palavra dos lábios”, enquanto mantém o tom sarcástico e desafiador do emissário assírio.
