base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: pt
  text: Será que os deuses das nações conseguiram mesmo livrar[a], cada um deles, sua terra da mão do rei da Assíria?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega uma construção enfática; literalmente, algo como: “Será que os deuses das nações de fato livraram...?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: conseguiram mesmo livrar
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. Em uma pergunta retórica desafiadora, “conseguiram mesmo livrar” transmite naturalmente a ênfase sem reproduzir de modo artificial a repetição hebraica.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: os deuses das nações
  rationale: Traduz diretamente o plural construto e preserva o contraste entre as divindades dos diversos povos e o poder assírio.
- source_word: אִישׁ
  choice: cada um
  rationale: אִישׁ tem aqui valor distributivo, referindo-se a cada deus, e não a um indivíduo humano do sexo masculino.
- source_word: אֶת אַרְצוֹ
  choice: a sua terra
  rationale: 'O sufixo singular acompanha a construção distributiva: cada deus em relação à terra que lhe correspondia. “A sua terra” é natural em português e mantém essa relação.'
- source_word: מִיַּד
  choice: das mãos de
  rationale: Preserva a imagem hebraica da mão como poder ou domínio. O plural idiomático “das mãos de” soa natural em português contemporâneo.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: É a tradução direta e corrente da construção hebraica.
